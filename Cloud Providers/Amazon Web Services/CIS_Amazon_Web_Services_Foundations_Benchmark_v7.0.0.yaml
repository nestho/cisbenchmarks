      https://console.aws.amazon.com/iam

      2. Click on Users

      3. Click the Settings (gear) icon

      4. Select Console last sign-in, Access key last used, and Access Key Id

      5. Click on Confirm

      6. Check and ensure that Console last sign-in is less than 45 days ago.

      Note - - means the user has never logged in.

      7. If credentials have not been used within 45 days, refe'
    severity: medium
- id: '2.12'
  title: Ensure access keys are rotated every 90 days or less
  scoring: scored
  profile:
  - Level 1
  description: Access keys consist of an access key ID and secret access key, which are used to sign programmatic requests
    to AWS. IAM users require access keys to make programmatic calls via the AWS CLI, SDKs, or APIs. It is recommended that
    all access keys be rotated regularly and at least every 90 days.
  rationale: Rotating access keys reduces the window of opportunity for a compromised or exposed key to be used. Regular rotation
    also limits the risk associated with lost, stolen, or improperly stored credentials.
  impact: Long-lived access keys increase the risk of unauthorized access if compromised, as they may remain valid indefinitely
    without detection.
  references:
  - 1. CCE-78902-4
  - 2. https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html#rotatecredentials
  page_start: 74
  audit_raw: 'Perform the following to determine if access keys are rotated as prescribed:

    From Console:

    1. Sign in to the AWS Management Console and open the IAM console at

    https://console.aws.amazon.com/iam

    2. Click on Users

    3. For each user, go to Security Credentials

    4. Review each key under Access Keys

    5. For each key with Status = Active, ensure the Created date is within 90 days

    From Command Line:

    1. Run the following commands:

    aws iam generate-credential-report

    aws iam get-credential-report --query ''Content'' --output text | base64 -d

    2. Review the following fields:

    • access_key_1_last_rotated

    • access_key_2_last_rotated

    3. Ensure all active keys have been rotated within 90 days'
  remediation: 'Perform the following to rotate access keys:

    From Console:

    1. Sign in to the AWS Management Console and open the IAM console

    (https://console.aws.amazon.com/iam)

    2. Click on Users

    3. Select the user

    4. Navigate to Security credentials

    Rotate Access Keys:

    5. Click Create access key

    6. Update all applications and tools to use the new access key

    7. After confirming successful use of the new key:

    • Deactivate the old key

    • Delete the old key when no longer needed

    From Command Line:

    1. Create a new access key:

    aws iam create-access-key --user-name <user-name>

    2. Update all applications and tools to use the new access key

    3. Check usage of the old key:

    aws iam get-access-key-last-used --access-key-id <access-key-id>

    4. Deactivate the old key:

    aws iam update-access-key --access-key-id <access-key-id> --status Inactive -

    -user-name <user-name>

    5. After confirming no usage, delete the old key:

    aws iam delete-access-key --access-key-id <access-key-id> --user-name <username>'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if access keys are rotated as prescribed:

      From Console:

      1. Sign in to the AWS Management Console and open the IAM console at

      https://console.aws.amazon.com/iam

      2. Click on Users

      3. For each user, go to Security Credentials

      4. Review each key under Access Keys

      5. For each key with Status = Active, ensure the Created date is within 90 days

      From Command Line:

      1. Run the following commands:

      aws iam generate-credential-report

      aws iam get-credential-report --query ''C'
    severity: medium
- id: '2.13'
  title: Ensure IAM users receive permissions only through groups
  scoring: scored
  profile:
  - Level 1
  description: 'IAM users are granted access to services, functions, and data through IAM policies. There are four ways to
    assign policies to a user: 1. Attach an inline (user) policy directly to the user 2. Attach a managed policy directly
    to the user 3. Add the user to an IAM group with attached policies 4. Add the user to an IAM group with inline policies
    Only assigning permissions through IAM groups is recommended.'
  rationale: Assigning IAM policies through groups centralizes permissions management and aligns access with organizational
    roles. This reduces complexity and lowers the likelihood of excessive or inconsistent permissions.
  impact: Directly assigning policies to users increases the risk of misconfigured or excessive permissions and makes access
    management more difficult to audit and maintain.
  references:
  - 1. http://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  - 2. http://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_managedvs-inline.html
  page_start: 78
  audit_raw: 'Perform the following to determine if policies are directly attached to users:

    1. Run the following command to list all IAM users:

    aws iam list-users --query ''Users[*].UserName'' --output text

    2. For each user returned, run:

    aws iam list-attached-user-policies --user-name <user-name>

    aws iam list-user-policies --user-name <user-name>

    3. If any policies are returned, the user has either:

    • A directly attached managed policy, or

    • An inline policy'
  remediation: 'From Console:

    Create and configure a group:

    1. Sign in to the AWS Management Console and open the IAM

    console(https://console.aws.amazon.com/iam/)

    2. In the navigation pane, click User Groups and then click Create Group

    3. Enter a group name and click Next

    4. Select the appropriate policies

    5. Click Create Group

    Add users to the group:

    6. Navigate to User Groups

    7. Select the group

    8. Click Add users to group

    9. Select users and click Add users

    Remove direct user policies:

    10. Navigate to Users

    11. Select the user

    12. Go to the Permissions tab

    13. Remove any directly attached policies

    From Command Line:

    1. Create a group:

    aws iam create-group --group-name <group-name>

    2. Attach a policy to the group:

    aws iam attach-group-policy --group-name <group-name> --policy-arn <policyarn>

    3. Add user to group:

    aws iam add-user-to-group --user-name <user-name> --group-name <group-name>

    4. Detach managed policies from user:

    aws iam detach-user-policy --user-name <user-name> --policy-arn <policy-arn>

    5. Delete inline policies from user:

    aws iam delete-user-policy --user-name <user-name> --policy-name <policyname>'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if policies are directly attached to users:

      1. Run the following command to list all IAM users:

      aws iam list-users --query ''Users[*].UserName'' --output text

      2. For each user returned, run:

      aws iam list-attached-user-policies --user-name <user-name>

      aws iam list-user-policies --user-name <user-name>

      3. If any policies are returned, the user has either:

      • A directly attached managed policy, or

      • An inline policy'
    severity: medium
- id: '2.14'
  title: Ensure IAM policies that allow full "*:*" administrative privileges are not attached
  scoring: scored
  profile:
  - Level 1
  description: IAM policies are the means by which privileges are granted to users, groups, or roles. It is recommended and
    considered standard security advice to grant least privilege, granting only the permissions required to perform a task.
    Determine what users need to do, and then craft policies for them that allow the users to perform only those tasks, instead
    of granting full administrative privileges.
  rationale: 'It is more secure to start with a minimal set of permissions and grant additional permissions as necessary,
    rather than starting with overly permissive access and attempting to restrict it later. Providing full administrative
    privileges instead of restricting access to the minimum required exposes resources to potentially unintended or malicious
    actions. IAM policies that contain a statement with "Effect": "Allow" and "Action": "*" over "Resource": "*" should be
    removed.'
  impact: Policies granting full administrative privileges significantly increase the risk of unauthorized or unintended actions,
    potentially resulting in complete account compromise.
  references:
  - 1. https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  - 2. https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_managedvs-inline.html
  page_start: 82
  audit_raw: "Perform the following to determine existing policies:\nFrom Command Line:\n1. Run the following to get a list\
    \ of IAM policies:\naws iam list-policies --only-attached --output text\n2. For each policy returned, evaluate the default\
    \ policy version to determine if it\nallows full administrative privileges (\":\"). The default version represents the\n\
    effective permissions applied.\n3. Alternatively, the following command can be used to identify all attached policies\n\
    that allow full administrative privileges and list associated entities:\npolicies=$(aws iam list-policies --scope All\
    \ --only-attached --query\n'Policies[*].Arn' --output text)\nfor arn in $policies; do\n version=$(aws iam get-policy --policy-arn\
    \ \"$arn\" --query\n'Policy.DefaultVersionId' --output text)\n is_admin=$(aws iam get-policy-version --policy-arn \"$arn\"\
    \ --version-id\n\"$version\" --query 'PolicyVersion.Document' | jq -r '\n .Statement |\n (if type == \"array\" then .[]\
    \ else . end) |\n select(.Effect == \"Allow\") |\n select(\n (.Action | if type == \"array\" then .[] else . end == \"\
    *\") and\n (.Resource | if type == \"array\" then .[] else . end == \"*\")\n )\n ')\n if [ ! -z \"$is_admin\" ]; then\n\
    \ echo \"------------------------------------------------------------\"\n echo \"ADMIN POLICY FOUND: $arn\"\n echo \"\
    ATTACHED ENTITIES:\"\n aws iam list-entities-for-policy --policy-arn \"$arn\" --query '{Users:\nPolicyUsers[*].UserName,\
    \ Roles: PolicyRoles[*].RoleName, Groups:\nPolicyGroups[*].GroupName}' --output yaml\n fi\ndone\n4. In the output, no\
    \ policy should contain a statement with:\n• \"Effect\": \"Allow\"\n• \"Action\": \"*\"\n• \"Resource\": \"*\""
  remediation: 'From Console:

    1. Sign in to the AWS Management Console and open the IAM console

    2. In the navigation pane, click Policies

    3. Search for the policy identified in the audit step

    4. Select the policy

    5. Choose Detach

    6. Detach the policy from all Users, Groups, and Roles

    7. Delete the policy if it is no longer required

    From Command Line:

    1. List all entities attached to the policy:

    aws iam list-entities-for-policy --policy-arn <policy_arn>

    2. Detach from users:

    aws iam detach-user-policy --user-name <iam_user> --policy-arn <policy_arn>

    3. Detach from groups:

    aws iam detach-group-policy --group-name <iam_group> --policy-arn

    <policy_arn>

    4. Detach from roles:

    aws iam detach-role-policy --role-name <iam_role> --policy-arn <policy_arn>'
  checks:
  - type: manual_review
    info: 'Perform the following to determine existing policies:

      From Command Line:

      1. Run the following to get a list of IAM policies:

      aws iam list-policies --only-attached --output text

      2. For each policy returned, evaluate the default policy version to determine if it

      allows full administrative privileges (":"). The default version represents the

      effective permissions applied.

      3. Alternatively, the following command can be used to identify all attached policies

      that allow full administrative privileges '
    severity: medium
- id: '2.15'
  title: Ensure a support role has been created to manage incidents with AWS Support
  scoring: scored
  profile:
  - Level 1
  description: AWS provides a Support Center that can be used for incident notification and response, as well as technical
    support and customer service. Create an IAM role with the appropriate policy assigned to allow authorized users to manage
    incidents with AWS Support.
  rationale: Following the principle of least privilege, an IAM role should be used with a scoped policy to allow access to
    AWS Support. This ensures only authorized users can manage support cases without requiring broad administrative access.
  impact: Without a dedicated support role, access to AWS Support may require overly permissive roles, increasing the risk
    of excessive access and reducing separation of duties.
  references:
  - 1. https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_managedvs-inline.html
  - 2. https://aws.amazon.com/premiumsupport/pricing/
  page_start: 86
  audit_raw: 'From Console:

    1. Sign in to the AWS Management Console and open the IAM console at

    https://console.aws.amazon.com/iam

    2. In the left navigation pane, under Access management, select Policies

    3. In the policy search field, enter AWSSupportAccess

    4. Select the policy

    5. Click the Entities attached tab

    6. Ensure at least one IAM Role is attached

    From Command Line:

    1. Identify the AWS managed support policy:

    aws iam list-policies --query "Policies[?PolicyName==''AWSSupportAccess''].Arn"

    --output text

    2. Check if it is attached to any roles:

    aws iam list-entities-for-policy --policy-arn

    arn:aws:iam::aws:policy/AWSSupportAccess

    3. Ensure that at least one role is listed under PolicyRoles'
  remediation: "From Console:\n1. Sign in to the AWS Management Console and open the IAM console\n2. Navigate to Roles\n3.\
    \ Click Create role\n4. Configure the trusted entity (e.g., your AWS account or identity provider)\n5. Attach the AWSSupportAccess\
    \ policy\n6. Complete role creation\n7. Assign the role to appropriate users or groups\nFrom Command Line:\n1. Create\
    \ a trust policy (example):\n{\n \"Version\": \"2012-10-17\",\n \"Statement\": [\n {\n \"Effect\": \"Allow\",\n \"Principal\"\
    : {\n \"AWS\": \"arn:aws:iam::<account-id>:root\"\n },\n \"Action\": \"sts:AssumeRole\"\n }\n ]\n}\n2. Create the role:\n\
    aws iam create-role --role-name <role-name> --assume-role-policy-document\nfile://trust-policy.json\n3. Attach the AWS\
    \ Support policy:\naws iam attach-role-policy --policy-arn\narn:aws:iam::aws:policy/AWSSupportAccess --role-name <role-name>"
  checks:
  - type: manual_review
    info: 'From Console:

      1. Sign in to the AWS Management Console and open the IAM console at

      https://console.aws.amazon.com/iam

      2. In the left navigation pane, under Access management, select Policies

      3. In the policy search field, enter AWSSupportAccess

      4. Select the policy

      5. Click the Entities attached tab

      6. Ensure at least one IAM Role is attached

      From Command Line:

      1. Identify the AWS managed support policy:

      aws iam list-policies --query "Policies[?PolicyName==''AWSSupportAccess''].Arn"

      --output text

      '
    severity: medium
- id: '2.16'
  title: Ensure IAM instance roles are used for AWS resource access from instances
  scoring: scored
  profile:
  - Level 2
  description: AWS access from within EC2 instances can be achieved either by embedding AWS access keys into applications
    or by assigning an IAM role to the instance with the appropriate permissions. "AWS access" refers to making API calls
    to AWS services to access or manage resources.
  rationale: IAM roles reduce the risks associated with storing, sharing, and rotating long-term credentials. Compromised
    credentials can be used outside of AWS, whereas IAM role credentials are temporary and tied to the instance. Additionally,
    credentials embedded in applications or configuration files are more difficult to rotate and are more likely to be exposed
    over time, increasing the risk of unauthorized access.
  impact: Using embedded credentials instead of IAM roles increases the risk of credential exposure and unauthorized access,
    particularly if credentials are not rotated or are improperly stored.
  references:
  - 1. https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-roleec2.html
  - 2. https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/iam-roles-for-amazonec2.html
  page_start: 90
  audit_raw: 'Perform the following to determine if IAM roles are used:

    From Console:

    1. Sign in to the AWS Management Console and navigate to the EC2 dashboard at

    https://console.aws.amazon.com/ec2/

    2. In the left navigation panel, choose Instances

    3. Select the EC2 instance you want to examine

    4. Select Actions

    5. Select View details

    6. Review the following:

    • If IAM Role contains a role, it is compliant

    • If IAM Role is blank, it is non-compliant

    • If an Instance profile ARN exists but no role is attached, it is non-compliant

    7. Repeat for all EC2 instances

    From Command Line:

    1. List all EC2 instances:

    aws ec2 describe-instances --region <region-name> --query

    ''Reservations[*].Instances[*].InstanceId''

    2. Check for IAM instance profiles:

    aws ec2 describe-instances --region <region-name> --instance-id <Instance-ID>

    --query ''Reservations[*].Instances[*].IamInstanceProfile''

    3. If no IAM instance profile is returned, the instance does not have a role attached

    4. Repeat for all instances and regions'
  remediation: 'From Console:

    1. Sign in to the AWS Management Console and navigate to the EC2 dashboard at

    https://console.aws.amazon.com/ec2/

    2. In the left navigation panel, choose Instances

    3. Select the EC2 instance you want to modify

    4. Click Actions

    5. Click Security

    6. Click Modify IAM role

    7. Select an existing IAM role or create a new one

    8. Click Update IAM role

    9. Repeat for all applicable instances

    From Command Line:

    1. Identify instances without roles (all regions):

    for r in $(aws ec2 describe-regions --query "Regions[].RegionName" --output

    text); do aws ec2 describe-instances --region "$r" --query

    "Reservations[].Instances[?IamInstanceProfile==null].[InstanceId, ''$r'']" --

    output text done

    2. Attach an instance profile:

    aws ec2 associate-iam-instance-profile --region <region-name> --instance-id

    <Instance-ID> --iam-instance-profile Name="Instance-Profile-Name"

    3. Verify the role is attached:

    aws ec2 describe-instances --region <region-name> --instance-id <Instance-ID>

    --query ''Reservations[*].Instances[*].IamInstanceProfile''

    4. Repeat steps 2 and 3 for each EC2 instance in your AWS account that requires

    an IAM role to be attached.'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if IAM roles are used:

      From Console:

      1. Sign in to the AWS Management Console and navigate to the EC2 dashboard at

      https://console.aws.amazon.com/ec2/

      2. In the left navigation panel, choose Instances

      3. Select the EC2 instance you want to examine

      4. Select Actions

      5. Select View details

      6. Review the following:

      • If IAM Role contains a role, it is compliant

      • If IAM Role is blank, it is non-compliant

      • If an Instance profile ARN exists but no role is attached,'
    severity: medium
- id: '2.17'
  title: Ensure that all expired SSL/TLS certificates stored in AWS IAM are removed
  scoring: scored
  profile:
  - Level 1
  description: To enable HTTPS connections to your website or application in AWS, you need an SSL/TLS server certificate.
    You should use AWS Certificate Manager (ACM) to store and deploy server certificates, as storing certificates in IAM is
    no longer recommended. Use IAM only when you must support HTTPS connections in a region or service that is not supported
    by ACM. IAM securely encrypts your private keys and stores the encrypted version in IAM SSL certificate storage. IAM supports
    deploying server certificates in all regions, but you must obtain your certificate from an external provider for use with
    AWS. You cannot upload an ACM certificate to IAM. Additionally, you cannot manage your certificates from the IAM Console.
  rationale: Removing expired SSL/TLS certificates eliminates the risk that an invalid certificate will be deployed accidentally
    to a resource such as AWS Elastic Load Balancer (ELB), which can damage the credibility of the application or website
    behind the ELB. As a best practice, it is recommended to delete expired certificates and migrate certificate management
    to AWS Certificate Manager (ACM) where supported.
  impact: Deleting certificates may impact applications if expired certificates are still in use by services such as Elastic
    Load Balancing or CloudFront. Ensure services are updated to use valid certificates before removal. Migrating certificates
    from IAM to ACM may require updates to associated resources.
  references:
  - 1. https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_servercerts.html
  - 2. https://awscli.amazonaws.com/v2/documentation/api/latest/reference/iam/deleteserver-certificate.html
  page_start: 94
  audit_raw: "From Console:\nGetting certificate expiration information via the AWS Management Console is not\ncurrently supported\
    \ for IAM-stored certificates. To request information about SSL/TLS\ncertificates stored in IAM, use the Command Line\
    \ Interface (CLI).\nFrom Command Line:\n1. Run the following command to list all IAM-stored server certificates:\naws\
    \ iam list-server-certificates\n2. The command output returns an array containing all SSL/TLS certificates and\ntheir\
    \ metadata:\n{\n \"ServerCertificateMetadataList\": [\n {\n \"ServerCertificateId\": \"EHDGFRW7EJFYTE88D\",\n \"ServerCertificateName\"\
    : \"MyServerCertificate\",\n \"Expiration\": \"2018-07-10T23:59:59Z\",\n \"Path\": \"/\",\n \"Arn\": \"arn:aws:iam::012345678910:servercertificate/MySSLCertificate\"\
    ,\n \"UploadDate\": \"2018-06-10T11:56:08Z\"\n }\n ]\n}\n3. Review the Expiration value for each certificate and determine\
    \ if any\ncertificates are expired\n4. If expired certificates are identified, they should be removed\n5. If the command\
    \ returns:\n{ { \"ServerCertificateMetadataList\": [] }\nThis indicates that no certificates are currently stored in IAM"
  remediation: 'From Console:

    Removing expired certificates via the AWS Management Console is not currently

    supported. Use the CLI to delete IAM-stored certificates.

    From Command Line:

    1. Run the following command to delete an expired certificate:

    aws iam delete-server-certificate --server-certificate-name

    <CERTIFICATE_NAME>

    2. A successful command returns no output'
  checks:
  - type: manual_review
    info: "From Console:\nGetting certificate expiration information via the AWS Management Console is not\ncurrently supported\
      \ for IAM-stored certificates. To request information about SSL/TLS\ncertificates stored in IAM, use the Command Line\
      \ Interface (CLI).\nFrom Command Line:\n1. Run the following command to list all IAM-stored server certificates:\naws\
      \ iam list-server-certificates\n2. The command output returns an array containing all SSL/TLS certificates and\ntheir\
      \ metadata:\n{\n \"ServerCertificateMetadataList"
    severity: medium
- id: '2.18'
  title: Ensure that IAM External Access Analyzer is enabled for all regions
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: Enable IAM External Access Analyzer for all resources in each active AWS region. IAM Access Analyzer is a service
    that analyzes resource policies to identify resources that can be accessed from outside the account. After the analyzer
    is enabled, scan results are displayed in the console showing accessible resources. These results help determine whether
    unintended access is permitted, making it easier for administrators to monitor least privilege access. Access Analyzer
    analyzes only policies applied to resources within the same AWS region. In multi-account environments, IAM user centralization
    facilitates greater user control. User access beyond the initial account is provided through role assumption. Centralization
    of users can be accomplished through federation with an external identity provider or through the use of AWS Organizations.
    AWS IAM Identity Center (formerly AWS SSO) is the recommended approach for centralized user management in AWS Organizations.
  rationale: IAM External Access Analyzer helps identify resources in your account or organization that are shared with external
    entities. This allows detection of unintended access to resources and data. It continuously monitors policies for services
    such as S3 buckets, IAM roles, KMS keys, Lambda functions, and SQS queues. Centralizing IAM user management to a single
    identity store reduces complexity and the likelihood of access management errors. Using AWS IAM Identity Center further
    simplifies access management and reduces reliance on legacy per-account federation configurations.
  impact: If IAM External Access Analyzer is not enabled, unintended external access to resources may go undetected, increasing
    the risk of data exposure or unauthorized access. Managing IAM users independently across multiple accounts increases
    the risk of inconsistent access controls, orphaned accounts, and excessive permissions.
  references:
  - 1. https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-accessanalyzer.html
  - 2. https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-gettingstarted.html
  page_start: 97
  audit_raw: "From Console:\n1. Sign in to the AWS Management Console and open the IAM console at\nhttps://console.aws.amazon.com/iam\n\
    2. Under Access analyzer choose Analyzer Settings\n3. On the Analyzer Settings page, review the list of analyzers\n4.\
    \ Identify analyzers where the Finding type is External Access\n5. Repeat these steps for each active region, as analyzers\
    \ are region-specific\nFrom Command Line:\n1. Run the following command:\naws accessanalyzer list-analyzers --type <ACCOUNT|ORGANIZATION>\
    \ --region\n<region_name> | grep status\n2. Ensure that at least one Analyzer's status is set to ACTIVE\n3. To check all\
    \ regions:\nfor r in $(aws ec2 describe-regions --query \"Regions[].RegionName\" --output\ntext); do\n echo \"=== $r ===\"\
    \n aws accessanalyzer list-analyzers --region \"$r\" --type ACCOUNT --query\n\"analyzers[].status\" --output text\ndone\n\
    4. Ensure each region returns at least one ACTIVE analyzer\nFor multi-account AWS environments with an external identity\
    \ provider:\n1. Sign in to the AWS Management Console and open the IAM console at\nhttps://console.aws.amazon.com/iam\n\
    2. Click Identity providers\n3. Verify that federation is configured appropriately\nFor environments using AWS IAM Identity\
    \ Center (recommended):\n1. Sign in to the AWS Management Console and open the IAM console at\nhttps://console.aws.amazon.com/iam\n\
    2. Navigate to IAM Identity Center\n3. Verify that IAM Identity Center is enabled\n4. Confirm that users and groups are\
    \ centrally managed\n5. Confirm that access is assigned to accounts through IAM Identity Center\nFor multi-account environments\
    \ without centralized identity management:\n1. Identify accounts that should not contain local IAM users\n2. Sign in to\
