- id: '4.7'
  title: Ensure VPC flow logging is enabled in all VPCs
  scoring: scored
  profile:
  - Level 2
  description: VPC Flow Logs is a feature that enables you to capture information about the IP traffic going to and from network
    interfaces in your VPC. After you've created a flow log, you can view and retrieve its data in Amazon CloudWatch Logs.
    It is recommended that VPC Flow Logs be enabled for packet "Rejects" for VPCs.
  rationale: VPC Flow Logs provide visibility into network traffic that traverses the VPC and can be used to detect anomalous
    traffic or gain insights during security workflows.
  impact: 'By default, CloudWatch Logs will store logs indefinitely unless a specific retention period is defined for the
    log group. When choosing the number of days to retain, keep in mind that the average time it takes for an organization
    to realize they have been breached is 210 days (at the time of this writing). Since additional time is required to research
    a breach, a minimum retention policy of 365 days allows for detection and investigation. You may also wish to archive
    the logs to a cheaper storage service rather than simply deleting them. See the following AWS resource to manage CloudWatch
    Logs retention periods: 1. https://docs.aws.amazon.com/AmazonCloudWatch/latest/DeveloperGuide/Settin gLogRetention.html'
  references:
  - 1. CCE-79202-8
  - 2. https://docs.aws.amazon.com/AmazonVPC/latest/UserGuide/flow-logs.html
  page_start: 182
  audit_raw: "Perform the following to determine if VPC Flow logs are enabled:\nFrom Console:\n1. Sign into the management\
    \ console.\n2. Select Services, then select VPC.\n3. In the left navigation pane, select Your VPCs.\n4. Select a VPC.\n\
    5. In the right pane, select the Flow Logs tab.\n6. Ensure a Log Flow exists that has Active in the Status column.\nFrom\
    \ Command Line:\n1. Run the describe-vpcs command (OSX/Linux/UNIX) to list the VPC networks\navailable in the current\
    \ AWS region:\naws ec2 describe-vpcs --region <region> --query Vpcs[].VpcId\nThe command output returns the VpcId of VPCs\
    \ available in the selected region.\n2. Run the describe-flow-logs command (OSX/Linux/UNIX) using the VPC ID to\ndetermine\
    \ if the selected virtual network has the Flow Logs feature enabled:\naws ec2 describe-flow-logs --filter \"Name=resource-id,Values=<vpc-id>\"\
    \nIf there are no Flow Logs created for the selected VPC, the command output will return\nan empty list []. 3. Repeat\
    \ step 2 for other VPCs in the same region. 4. Change the\nregion by updating --region, and repeat steps 1-4 for each\
    \ region. 5. Alternatively, the\nfollowing command can be used to identify VPCs with and without Flow Logs:\nVPCS=$(aws\
    \ ec2 describe-vpcs --query \"Vpcs[].VpcId\" --output text)\nfor VPC in $VPCS; do\n COUNT=$(aws ec2 describe-flow-logs\
    \ --filter Name=resource-id,Values=$VPC --\nquery \"length(FlowLogs)\" --output text)\n if [ \"$COUNT\" -gt 0 ]; then\n\
    \ echo \"$VPC True\"\n else\n echo \"$VPC False\"\n fi\ndone"
  remediation: "Perform the following to enable VPC Flow Logs:\nFrom Console:\n1. Sign into the management console.\n2. Select\
    \ Services, then select VPC.\n3. In the left navigation pane, select Your VPCs.\n4. Select a VPC.\n5. In the right pane,\
    \ select the Flow Logs tab.\n6. If no Flow Log exists, click Create Flow Log.\n7. For Filter, select Reject.\n8. Enter\
    \ a Role and Destination Log Group.\n9. Click Create Log Flow.\n10. Click on CloudWatch Logs Group.\nNote: Setting the\
    \ filter to \"Reject\" will dramatically reduce the accumulation of logging\ndata for this recommendation and provide\
    \ sufficient information for the purposes of\nbreach detection, research, and remediation. However, during periods of\
    \ least privilege\nsecurity group engineering, setting the filter to \"All\" can be very helpful in discovering\nexisting\
    \ traffic flows required for the proper operation of an already running\nenvironment.\nFrom Command Line:\n1. Create a\
    \ policy document, name it role_policy_document.json, and paste the\nfollowing content:\n{\n \"Version\": \"2012-10-17\"\
    ,\n \"Statement\": [\n {\n \"Sid\": \"test\",\n \"Effect\": \"Allow\",\n \"Principal\": {\n \"Service\": \"vpc-flow-logs.amazonaws.com\"\
    \n },\n \"Action\": \"sts:AssumeRole\"\n }\n ]\n}\n2. Create another policy document, name it iam_policy.json, and paste\
    \ the\nfollowing content:\n{\n \"Version\": \"2012-10-17\",\n \"Statement\": [\n {\n \"Effect\": \"Allow\",\n \"Action\"\
    :[\n \"logs:CreateLogGroup\",\n \"logs:CreateLogStream\",\n \"logs:DescribeLogGroups\",\n \"logs:DescribeLogStreams\"\
    ,\n \"logs:PutLogEvents\",\n \"logs:GetLogEvents\",\n \"logs:FilterLogEvents\"\n ],\n \"Resource\": \"*\"\n }\n ]\n}\n\
    3. Run the following command to create an IAM role:\naws iam create-role --role-name <aws-support-iam-role> --assume-role-policydocument\
    \ file://<file-path>role_policy_document.json\n4. Run the following command to create an IAM policy:\naws iam create-policy\
    \ --policy-name <iam-policy-name> --policy-document\nfile://<file-path>iam-policy.json\n5. Run the attach-group-policy\
    \ command, using the IAM policy ARN returned\nfrom the previous step to attach the policy to the IAM role:\naws iam attach-group-policy\
    \ --policy-arn arn:aws:iam::<aws-accountid>:policy/<iam-policy-name> --group-name <group-name>\n• If the command succeeds,\
    \ no output is returned.\n6. Run the describe-vpcs command to get a list of VPCs in the selected region:\naws ec2 describe-vpcs\
    \ --region <region>\n• The command output should return a list of VPCs in the selected region.\n7. Run the create-flow-logs\
    \ command to create a flow log for a VPC:\naws ec2 create-flow-logs --resource-type VPC --resource-ids <vpc-id> --\ntraffic-type\
    \ REJECT --log-group-name <log-group-name> --deliver-logspermission-arn <iam-role-arn>\n8. Repeat step 7 for other VPCs\
    \ in the selected region.\n9. Change the region by updating --region, and repeat the remediation procedure\nfor each region."
