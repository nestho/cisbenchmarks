- id: '6.5'
  title: Ensure the default security group of every VPC restricts all traffic
  scoring: scored
  profile:
  - Level 2
  description: 'A VPC comes with a default security group whose initial settings deny all inbound traffic, allow all outbound
    traffic, and allow all traffic between instances assigned to the security group. If a security group is not specified
    when an instance is launched, it is automatically assigned to this default security group. Security groups provide stateful
    filtering of ingress/egress network traffic to AWS resources. It is recommended that the default security group restrict
    all traffic, both inbound and outbound. The default VPC in every region should have its default security group updated
    to comply with the following: • No inbound rules. • No outbound rules. Any newly created VPCs will automatically contain
    a default security group that will need remediation to comply with this recommendation. Note: When implementing this recommendation,
    VPC flow logging is invaluable in determining the least privilege port access required by systems to work properly, as
    it can log all packet acceptances and rejections occurring under the current security groups. This dramatically reduces
    the primary barrier to least privilege engineering by discovering the minimum ports required by systems in the environment.
    Even if the VPC flow logging recommendation in this benchmark is not adopted as a permanent security measure, it should
    be used during any period of discovery and engineering for least privileged security groups.'
  rationale: Configuring all VPC default security groups to restrict all traffic will encourage the development of least privilege
    security groups and promote the mindful placement of AWS resources into security groups, which will, in turn, reduce the
    exposure of those resources.
  impact: 'Implementing this recommendation in an existing VPC that contains operating resources requires extremely careful
    migration planning, as the default security groups are likely enabling many ports that are unknown. Enabling VPC flow
    logging (for accepted connections) in an existing environment that is known to be breach-free will reveal the current
    pattern of ports being used for each instance to communicate successfully. The migration process should include: • Analyzing
    VPC flow logs to understand current traffic patterns. • Creating least privilege security groups based on the analyzed
    data. • Testing the new security group rules in a staging environment before applying them to production.'
  references:
  - 1. CCE-79201-0
  - 2. https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-networksecurity.html
