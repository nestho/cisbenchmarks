- id: '4.5'
  title: Ensure CloudTrail logs are encrypted at rest using KMS CMKs
  scoring: scored
  profile:
  - Level 2
  description: AWS CloudTrail is a web service that records AWS API calls for an account and makes those logs available to
    users and resources in accordance with IAM policies. AWS Key Management Service (KMS) is a managed service that helps
    create and control the encryption keys used to encrypt account data, and uses Hardware Security Modules (HSMs) to protect
    the security of encryption keys. CloudTrail logs can be configured to leverage server side encryption (SSE) and KMS customer-created
    master keys (CMK) to further protect CloudTrail logs. It is recommended that CloudTrail be configured to use SSE-KMS.
  rationale: Configuring CloudTrail to use SSE-KMS provides additional confidentiality controls on log data, as a given user
    must have S3 read permission on the corresponding log bucket and must be granted decrypt permission by the CMK policy.
  impact: Customer-created keys incur an additional cost. See https://aws.amazon.com/kms/pricing/ for more information.
  references:
  - 1. https://docs.aws.amazon.com/awscloudtrail/latest/userguide/encryptingcloudtrail-log-files-with-aws-kms.html
  - 2. https://docs.aws.amazon.com/kms/latest/developerguide/create-keys.html
  page_start: 173
  audit_raw: "Perform the following to determine if CloudTrail is configured to use SSE-KMS:\nFrom Console:\n1. Sign in to\
    \ the AWS Management Console and open the CloudTrail console at\nhttps://console.aws.amazon.com/cloudtrail.\n2. In the\
    \ left navigation pane, choose Trails.\n3. Select a trail.\n4. In the General details section, select Edit to edit the\
    \ trail configuration.\n5. Ensure the box at Log file SSE-KMS encryption is checked and that a valid\nAWS KMS alias of\
    \ a KMS key is entered in the respective text box.\nFrom Command Line:\n1. Run the following command:\n aws cloudtrail\
    \ describe-trails\n2. For each trail listed, SSE-KMS is enabled if the trail has a KmsKeyId property\ndefined."
  remediation: 'Perform the following to configure CloudTrail to use SSE-KMS:

    From Console:

    1. Sign in to the AWS Management Console and open the CloudTrail console at

    https://console.aws.amazon.com/cloudtrail.

    2. In the left navigation pane, choose Trails.

    3. Click on a trail.

    4. Under the S3 section, click the edit button (pencil icon).

    5. Click Advanced.

    6. Select an existing CMK from the KMS key Id drop-down menu.

    • Note: Ensure the CMK is located in the same region as the S3 bucket.

    • Note: You will need to apply a KMS key policy on the selected CMK in order for

    CloudTrail, as a service, to encrypt and decrypt log files using the CMK provided.

    View the AWS documentation for editing the selected CMK Key policy.

    7. Click Save.

    8. You will see a notification message stating that you need to have decryption

    permissions on the specified KMS key to decrypt log files.

    9. Click Yes.

    From Command Line:

    Run the following command to specify a KMS key ID to use with a trail:

    aws cloudtrail update-trail --name <trail-name> --kms-key-id <cloudtrailkms-key>

    Run the following command to attach a key policy to a specified KMS key:

    aws kms put-key-policy --key-id <cloudtrail-kms-key> --policy <cloudtrailkms-key-policy>'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if CloudTrail is configured to use SSE-KMS:

      From Console:

      1. Sign in to the AWS Management Console and open the CloudTrail console at

      https://console.aws.amazon.com/cloudtrail.

      2. In the left navigation pane, choose Trails.

      3. Select a trail.

      4. In the General details section, select Edit to edit the trail configuration.

      5. Ensure the box at Log file SSE-KMS encryption is checked and that a valid

      AWS KMS alias of a KMS key is entered in the respective text box.'
