controls:
- id: 2.1.1
  title: Ensure centralized root access in AWS Organizations
  scoring: manual
  profile:
  - Level 2
  description: Ensure centralized root access management is enabled to manage and secure root user credentials for member
    accounts in AWS Organizations. This allows the management account and an optional delegated administrator account to centrally
    delete, prevent recovery of, and if necessary, perform short-lived, scoped root-required actions in member accounts without
    maintaining long-term root user credentials in each account.
  rationale: The AWS account root user is a powerful, default administrative identity that is difficult to manage safely across
    many accounts. When each member account manages its own root credentials, organizations often end up with numerous long-lived
    root passwords, access keys, and MFA devices that are hard to inventory, rotate, and protect. Centralized root access
    management lets security teams remove or avoid creating root user credentials in member accounts, centrally review and
    manage any remaining root credentials, and perform necessary root-only tasks via short-term, task-scoped root sessions.
    This significantly reduces privileged credential sprawl, supports least privilege and dedicated administrator models,
    and improves visibility and auditability of root-level activity across the organization.
  impact: Enabling centralized root access management changes how root user access is obtained and used in member accounts,
    but it does not automatically remove existing root credentials. Organizations must plan when and how to delete or disable
    any existing root passwords, access keys, signing certificates, and MFA devices in member accounts and update any workflows
    that still rely on direct root sign-in. Security and operations teams will need to use centrally initiated, short-lived
    root sessions for exceptional tasks that truly require root. This may require procedural changes and additional training,
    but it significantly reduces long-lived privileged credential sprawl across the organization.
  references: []
  page_start: 22
  audit_raw: '1. Sign in to the AWS Management Console with the management account.

    2. In the console search bar, type Organizations and open AWS Organizations.

    • On the Overview page, confirm that an Organization exists and that this account

    is listed as the Management account.

    3. In AWS Organizations, choose Services.

    • Confirm that AWS Identity and Access Management appears in the list of

    services with trusted access enabled.

    4. In the console search bar, type IAM and open IAM. In the left navigation pane,

    choose Root access management. Check the status banner.

    • If you see that Root access management is enabled and the feature card shows

    that root credentials management is turned on for member accounts, the

    organization has centralized root access management enabled.

    • If you see Root access management is disabled with an option to Enable,

    centralized root access is not yet enabled.

    5. (Optional) On the same Root access management page, review the Delegated

    administrator information (if shown).

    • Confirm that the delegated account (if present) is a security or

    management-focused account, not a general workload account.'
  remediation: '1. Sign in to the AWS Management Console with the management account.

    2. In the console search bar, type Organizations and open AWS Organizations.

    • On the Overview page, confirm that an Organization exists and that this account

    is listed as the Management account.

    3. In AWS Organizations, choose Services. Locate AWS Identity and Access

    Management in the list and, if it is not already enabled, choose Enable trusted

    access and confirm.

    • This allows IAM to integrate with AWS Organizations to manage root access

    centrally.

    4. In the console search bar, type IAM and open IAM. In the left navigation pane,

    choose Root access management. If you see Root access management is

    disabled, choose Enable.

    • In the enable dialog, confirm that you want to - "Root credentials management"

    and if desired - "Privileged root actions in member accounts"

    • In the Delegated administrator field, enter the account ID of the account that will

    manage root user access and take privileged actions on member accounts. AWS

    recommends using an account intended for security or management purposes,

    not a general workload account.

    • When you enable centralized root access in the console, IAM also enables

    trusted access for IAM in AWS Organizations if it isn’t already enabled.

    • Choose Enable to save the configuration.'
  checks:
  - type: manual_review
    info: '1. Sign in to the AWS Management Console with the management account.

      2. In the console search bar, type Organizations and open AWS Organizations.

      • On the Overview page, confirm that an Organization exists and that this account

      is listed as the Management account.

      3. In AWS Organizations, choose Services.

      • Confirm that AWS Identity and Access Management appears in the list of

      services with trusted access enabled.

      4. In the console search bar, type IAM and open IAM. In the left navigation pane,'
    severity: medium
- id: 2.1.2
  title: Ensure authorization guardrails for all AWS Organization accounts
  scoring: manual
  profile:
  - Level 2
  description: 'Ensure that one or more baseline authorization policies such as Service Control Policies (SCPs) and/or Resource
    Control Policies (RCPs) are attached to all member accounts in AWS Organizations in accordance with organizational security
    requirements. Authorization policies act as preventive permission guardrails: SCPs define the maximum available permissions
    for IAM principals within accounts, while RCPs define the maximum available permissions for resources within accounts.
    These policies can enforce security invariants such as preventing disabling of key security services, restricting use
    of unapproved AWS Regions, or blocking external access to sensitive resources.'
  rationale: Authorization policies do not grant permissions but instead set organization-wide limits on what actions principals
    can perform (SCPs) and what access can be granted to resources (RCPs), regardless of local IAM or resource-based policies.
    Without baseline guardrail authorization policies, each account can grant excessive or inconsistent permissions that disable
    logging, weaken security services, allow use of unapproved Regions and services, or permit unintended external access
    to resources. Attaching standard authorization policies to all member accounts enforces preventive, centralized control
    over high-risk actions and access patterns, supports least-privilege and role-based access control at scale, and helps
    ensure that all accounts and resources operate within the organization's defined security baseline.
  impact: Enforcing baseline authorization policies for all member accounts can initially block some existing patterns, such
    as use of unapproved Regions, disabling security services, or granting broader permissions than the guardrails allow.
    Teams may need to adjust IAM policies, deployment pipelines, and exception processes so legitimate use cases remain possible
    within the new guardrails. This can introduce short-term operational overhead and require careful testing, especially
    when attaching new policies at the root or OU level.
  references: []
  page_start: 25
  audit_raw: 'Pre-requisite: you must run these CLI commands in the management account for the

    AWS Organization.

    1. Before auditing, document or confirm your organization''s baseline guardrail

    requirements. Common examples include:

    • Prevent disabling CloudTrail, AWS Config, GuardDuty, or Security Hub

    • Restrict usage to approved AWS Regions only

    • Protect central security or logging roles from modification

    • Deny external principal access to sensitive resources

    2. List all SCPs and RCPs in the organization:

    aws organizations list-policies --filter SERVICE_CONTROL_POLICY

    aws organizations list-policies --filter RESOURCE_CONTROL_POLICY

    • This returns a list of SCP/RCP policy IDs and names.

    3. For each SCP/RCP, retrieve and review the policy document to determine if it

    implements your baseline guardrail requirements:

    aws organizations describe-policy --policy-id <policy-id>

    • Review the Content field in the output to confirm the policy enforces

    organizational security requirements.

    If no SCPs/RCPs exist that implement your documented baseline guardrail

    requirements, note this as a gap and proceed to remediation.

    4. List all accounts in the organization and note the account IDs:

    aws organizations list-accounts --query

    ''Accounts[?Status==`ACTIVE`].[Id,Name]'' --output table

    5. For each baseline guardrail Authorization policy identified in Step 2, list the

    accounts and OUs to which it is attached:

    aws organizations list-targets-for-policy --policy-id <policy-id>

    • The output shows TargetId values representing accounts, OUs, or the root.

    6. Compare the list of attached targets to your full account list.

    • If the policy is attached to the root, all accounts in the organization inherit it and

    this policy passes for coverage.

    • If the policy is attached to specific OUs, verify that all active member accounts

    belong to those OUs.

    • If the policy is attached to individual accounts, verify that all active member

    accounts are included.

    The environment passes this recommendation if:

    • All baseline guardrail authorization policies required by organizational security

    requirements exist.

    • Each baseline guardrail authorization policy is attached to all active member

    accounts either directly or via OU/root inheritance.'
  remediation: 'Design or confirm baseline guardrail SCPs.

    1. From the AWS Organizations console, go to Policies → Service control policies.

    • If you already have standard guardrail SCPs that implement your security

    baseline, note their names.

    • If you do not have such policies, choose Create policy and create at least one

    baseline guardrail SCP that encodes non-negotiable security requirements.

    2. Do the same step as above but for RCPs if needed. From the AWS

    Organizations console, go to Policies → Resource control policies.

    3. Attach guardrail authorization policies to the root and/or OUs. In AWS

    Organizations, choose AWS accounts, then select the Root of the organization.

    • Go to the Policies tab, then within section for Service control policies, choose

    Attach, and select the baseline guardrail SCP(s) you identified or created in step

    1.

    • If using RCPs, then within section for Resource control policies, choose Attach,

    and select the baseline guardrail RCP(s) you identified or created in step 2.

    • If your design uses different guardrails per OU (for example, stricter policies for

    production OU), select each OU in turn and attach the appropriate guardrail

    SCPs and RCPs to those OUs.

    • AWS recommends testing authorization policies in a staging OU before attaching

    them broadly to the root to avoid unintended service disruption.'
  checks:
  - type: manual_review
    info: 'Pre-requisite: you must run these CLI commands in the management account for the

      AWS Organization.

      1. Before auditing, document or confirm your organization''s baseline guardrail

      requirements. Common examples include:

      • Prevent disabling CloudTrail, AWS Config, GuardDuty, or Security Hub

      • Restrict usage to approved AWS Regions only

      • Protect central security or logging roles from modification

      • Deny external principal access to sensitive resources

      2. List all SCPs and RCPs in the organization:

      a'
    severity: medium
- id: 2.1.3
  title: Ensure Organizations management account is not used for workloads
  scoring: manual
  profile:
  - Level 2
  description: Ensure that the AWS Organizations management account is used only for organizational governance tasks and does
    not host production workloads, applications, or business data. The management account is the most privileged account in
    an AWS Organization and performs sensitive administrative functions such as creating and managing member accounts, applying
    service control policies (SCPs), and managing consolidated billing. Workloads, applications, and associated data should
    be deployed in dedicated member accounts, not in the management account.
  rationale: The management account has unique privileges that cannot be restricted by SCPs, making it the highest-risk account
    in an organization. Deploying workloads or storing business data in the management account increases the attack surface
    and blast radius of a compromise. If a workload vulnerability or misconfiguration occurs in the management account, it
    could grant attackers access to organization-wide administrative capabilities.
  impact: Restricting the management account to governance-only use may require creating new member accounts, redesigning
    existing account boundaries, and migrating workloads and data out of the management account. This can introduce short-term
    complexity and operational overhead. However, it reduces the blast radius of a compromise, simplifies security controls
    in the most privileged account, and aligns the environment with AWS multi-account and workload-isolation best practices.
  references: []
  page_start: 29
  audit_raw: '1. Confirm which AWS account is the management account for the organization (for

    example, via AWS Organizations “Overview” page or organizational

    documentation).

    2. Ensure you have read-only access to review resources in this account.

    3. Use your organization’s standard discovery methods (for example, AWS Config,

    CMDB/asset inventory, or CSPM) to obtain a list of services and resources

    running in the management account.

    • At a minimum, identify compute, storage, database, and application services (for

    example, EC2, Lambda, ECS, S3, RDS, DynamoDB, API Gateway, load

    balancers).

    4. For each identified resource, determine whether it is:

    • Governance/security: resources that support centralized management, logging,

    audit, or security (for example, org-wide CloudTrail, Config aggregator, Security

    Hub or GuardDuty delegated admin, billing/cost tooling).

    • Workload/business: resources that support business applications, production or

    non-production workloads, or customer-facing systems.

    5. If any workload/business resources are present in the management account,

    record this as a gap and document the affected services and resource types'
  remediation: '1. Inventory all workload resources currently in the management account (compute,

    storage, databases, application services).

    2. For each class of workload resource (for example, production, non-production,

    shared services), create or confirm dedicated member accounts within the

    organization and place them into the appropriate OUs.

    3. For each workload resource, design a migration plan to the appropriate member

    account.

    • Execute the migrations in phases, starting with lower-risk environments (for

    example, development/test) before production.

    4. Review and adjust IAM roles and permissions in the management account so

    that only personnel responsible for organization governance and security have

    access

    5. Update architecture diagrams, runbooks, and onboarding processes to state that

    new workloads must be deployed only into designated workload accounts, not

    the management account.'
  checks:
  - type: manual_review
    info: '1. Confirm which AWS account is the management account for the organization (for

      example, via AWS Organizations “Overview” page or organizational

      documentation).

      2. Ensure you have read-only access to review resources in this account.

      3. Use your organization’s standard discovery methods (for example, AWS Config,

      CMDB/asset inventory, or CSPM) to obtain a list of services and resources

      running in the management account.

      • At a minimum, identify compute, storage, database, and application service'
    severity: medium
- id: 2.1.4
  title: Ensure Organizational Units are structured by environment and sensitivity
  scoring: manual
  profile:
  - Level 2
  description: Ensure that AWS Organizations Organizational Units (OUs) are structured primarily by environment (for example,
    production, non-production, sandbox) and sensitivity (for example, security, logging, shared services, regulated workloads),
    rather than mirroring the corporate org chart. OUs should group accounts that share similar security requirements and
    controls so that appropriate authorization policies and other guardrails can be applied consistently at the OU level.
  rationale: A clear OU structure based on environment and sensitivity makes it easier to apply consistent guardrails and
    centralized security controls to accounts that have similar risk profiles and compliance needs. Poorly defined or ad-hoc
    OU structures complicate policy management, increase the chance of misapplied controls, and can lead to mixing workloads
    with different data sensitivities under the same set of controls.
  impact: Restructuring OUs by environment and sensitivity can require moving accounts, changing inherited policies, and updating
    automation that assumes existing OU paths. This may introduce short-term operational overhead, including policy revalidation,
    testing of workloads under new guardrails, and coordination with application and platform teams to avoid unintended service
    disruption.
  references: []
  page_start: 32
  audit_raw: '1. From the management account, use AWS Organizations console to obtain:

    • The full OU hierarchy (root, top-level and child OUs).

    • The list of accounts in each OU.

    2. Review top-level and key OUs and determine whether they are clearly aligned to:

    • Environment (for example, production, non-production, sandbox).

    • Sensitivity/function (for example, security, logging, shared services, regulated).

    • Note any OUs whose purpose is unclear or that appear to be organized mainly

    by department or owner rather than environment/sensitivity.

    3. For each environment/sensitivity OU, select a sample of accounts and verify that

    their primary workloads match the OU’s stated purpose.

    • Note any accounts that mix production and non-production workloads in the

    same OU when separate OUs are defined.

    • Note any accounts that place highly sensitive or regulated workloads in OUs that

    are intended for lower-sensitivity use.'
  remediation: '1. Work with security, platform, and application teams to agree on a small set of

    top-level OUs such as:

    • Security / Management

    • Shared Services / Infrastructure

    • Prod

    • Non-Prod (dev, test, staging)

    • You may also define dedicated OUs for highly regulated workloads.

    2. In the AWS Organizations console (management account), navigate to AWS

    Accounts. Under the root, create the agreed top-level OUs. If needed, create

    child OUs under these.

    3. Export or list all existing accounts and their current OUs. Create a simple

    mapping from each account to its target OU based on environment and

    sensitivity.

    4. In the AWS Organizations console (management account), navigate to AWS

    Accounts. Move accounts into the new environment/sensitivity-based OUs

    according to your mapping.

    • Start with low-risk accounts (for example, sandbox and non-production) to

    validate effects of inherited policies and guardrails before moving production and

    high-sensitivity accounts.

    5. After accounts have been moved, remove old OUs that no longer reflect the

    target structure.

    • Ensure no active accounts remain directly under the root unless explicitly justified

    and documented.

    6. Update architecture docs, onboarding runbooks, and account request processes

    to require new accounts to be created in the correct OU based on environment

    and sensitivity.'
  checks:
  - type: manual_review
    info: '1. From the management account, use AWS Organizations console to obtain:

      • The full OU hierarchy (root, top-level and child OUs).

      • The list of accounts in each OU.

      2. Review top-level and key OUs and determine whether they are clearly aligned to:

      • Environment (for example, production, non-production, sandbox).

      • Sensitivity/function (for example, security, logging, shared services, regulated).

      • Note any OUs whose purpose is unclear or that appear to be organized mainly

      by department or owner '
    severity: medium
- id: 2.1.5
  title: Ensure delegated admin manages AWS Organizations policies
  scoring: manual
  profile:
  - Level 2
  description: Ensure that a dedicated member account is configured as a delegated administrator for AWS Organizations to
    manage organization policies (SCPs, RCPs, tag policies, backup policies, AI opt-out policies) and other Organizations
    features, instead of performing these tasks directly from the management account. The delegated administrator for AWS
    Organizations is configured via a resource-based delegation policy in the management account, which grants specific member
    accounts limited permissions to perform Organizations policy and account management actions across the organization. This
    allows policy management, OU operations, and other governance tasks to be handled from purpose-built accounts without
    requiring broad access to the management account.
  rationale: The management account has unique and high privileges to manage AWS Organizations (for example, creating/deleting
    accounts, managing org structures) and is not subject to guardrails like SCPs. Without a delegated administrator for Organizations,
    all policy management, OU changes, and account governance must be performed directly from the management account. This
    results in concentrating operational activity in the most powerful account. Configuring a dedicated member account as
    a delegated administrator for Organizations policy management distributes these tasks to a purpose-built AWS account that
    can be protected by SCPs and other controls, reduces the number of users and roles that need management-account access,
    and supports separation of duties while maintaining centralized control over organization-wide features.
  impact: Configuring a delegated administrator for AWS Organizations requires creating or identifying a dedicated member
    account for policy management and granting it specific permissions via a resource-based delegation policy. Existing workflows,
    automation, and user access patterns that currently perform Organizations policy tasks directly from the management account
    must be updated to use the delegated account instead. This introduces short-term operational overhead and testing to ensure
    policy creation, attachment, and management continue to function correctly from the new account.
  references: []
  page_start: 35
  audit_raw: '1. Sign in to the AWS Organizations console. From the AWS Accounts section,

    verify that this is the management account for the organization.

    2. In the AWS Organizations console, navigate to Settings. Scroll to the Delegated

    administrator for AWS Organizations section

    3. Review the delegation policy status:

    • If a delegation policy is configured and shows one or more member accounts

    registered to manage Organizations policies, proceed to step 4.

    • If no delegation policy is configured or the section shows No delegated

    administrator (or equivalent), the audit fails because Organizations management

    is performed directly from the management account.

    4. In the Delegated administrator section, note the account IDs registered for

    Organizations policy management. Confirm that the delegated accounts are

    purpose-built governance, security, or policy management accounts, not general

    workload, sandbox, or development accounts.

    5. View the delegation policy details to confirm it grants appropriate least-privilege

    permissions for policy types (for example, SCPs, tag policies, backup policies)

    and actions (CreatePolicy, AttachPolicy, UpdatePolicy, etc.).'
  remediation: '1. Identify a dedicated member account for governance/policy management (for

    example, create a new “Policy Management” account or use an existing Security

    account)

    2. You must be in the management account with permissions to manage

    Organizations resource policies. Navigate to AWS Organizations console, then

    click on Settings and browse to "Delegated administrator for AWS Organizations"

    section.

    3. If no policy exists, click on Delegate. If a policy exists, choose Edit policy.

    • In the policy editor, paste or construct a delegation policy statement mentioning

    the Principal as the AWS account Root which is being delegated access to, and

    the Actions with the list of least-privileged permissions that could be performed

    by the delegated AWS account.

    • Save and validate the delegation policy.

    4. Sign in to the delegated administrator account and open the AWS Organizations

    console.

    • Confirm that policy management (Policies, Attach/Detach, etc.) is accessible and

    that users/roles in this account can perform Organizations tasks without

    management-account access.

    5. Grant IAM roles/users in the delegated admin account only the permissions

    needed for Organizations policy management.

    6. Update procedures so that routine Organizations policy tasks are performed from

    the delegated account, reserving the management account for tasks that only it

    can perform'
  checks:
  - type: manual_review
    info: '1. Sign in to the AWS Organizations console. From the AWS Accounts section,

      verify that this is the management account for the organization.

      2. In the AWS Organizations console, navigate to Settings. Scroll to the Delegated

      administrator for AWS Organizations section

      3. Review the delegation policy status:

      • If a delegation policy is configured and shows one or more member accounts

      registered to manage Organizations policies, proceed to step 4.

      • If no delegation policy is configured or the sect'
    severity: medium
- id: 2.1.6
  title: Ensure delegated admins manage AWS Organizationsintegrated services
  scoring: manual
  profile:
  - Level 2
  description: Ensure that AWS services (such as AWS CloudTrail) which integrate with AWS Organizations and support delegated
    administration are managed through delegated administrator member accounts instead of directly from the Organizations
    management account. For each such service, the management account should enable trusted access and register a purpose-built
    member account as the delegated administrator, so that this account can perform service-level administration across all
    organization accounts.
  rationale: The management account has unique and high privileges to manage AWS Organizations (for example, creating/deleting
    accounts, managing org structures) and is not subject to guardrails like SCPs. Without delegated administrators, organization-wide
    security, logging, and management services must be operated directly from the management account, concentrating operational
    activity and credentials in the most privileged account in the organization. Registering member accounts as delegated
    administrators for AWS services distributes service-specific administration to dedicated security, logging, or operations
    accounts that can be restricted by SCPs, monitored like other workload accounts, and aligned with team responsibilities,
    while reducing day-to-day use of the management account.
  impact: Configuring a delegated administrator for AWS Services that integrate with AWS Organizations requires creating or
    identifying a dedicated member account for policy management and granting it specific permissions. Existing workflows,
    automation, and user access patterns that currently perform tasks directly from the management account must be updated
    to use the delegated account instead. This introduces short-term operational overhead and testing to ensure policy creation,
    attachment, and management continue to function correctly from the new account.
  references: []
  page_start: 38
  audit_raw: 'Note: This audit uses AWS CloudTrail as a concrete example. You must perform similar

    audits for all other AWS services that integrate with AWS Organizations and support

    delegated administration that are in use in your environment.

    1. Sign in to the management account and open the CloudTrail console.

    2. In the left navigation pane, choose Trails.

    • Verify that there is at least one organization trail (trail with Apply trail to all

    accounts in my organization or equivalent setting enabled)

    • If CloudTrail is only configured as single-account trails and no organization trail is

    in use, note that delegated admin for CloudTrail is not in scope and this

    recommendation is not applicable for CloudTrail in this environment.

    3. In the same management account CloudTrail console, choose Settings in the left

    navigation pane, and scroll to the Organization delegated administrators section.

    4. Verify the configuration for Organization delegated administrators:

    • Verify that at least one member account ID (not the management account) is

    listed as a delegated administrator for CloudTrail.

    • Verify that the account(s) are appropriate for security/logging operations (for

    example, a named Security or Logging account, not a sandbox or general

    workload account).

    • If the section shows "No delegated administrators" when an organization trail is

    in use, CloudTrail is effectively administered from the management account and

    this is a gap.'
  remediation: 'Note: This remediation section uses AWS CloudTrail as a concrete example. You must

    perform similar procedure for all other AWS services that integrate with AWS

    Organizations and support delegated administration that are in use in your environment.

    1. In the management account, verify that trusted access for CloudTrail is enabled

    in AWS Organizations (AWS Organizations → Services).

    2. In the management account CloudTrail console, choose Settings in the left

    navigation pane. Scroll to Organization delegated administrators.

    3. Click on "Register administrator"

    • Enter the account ID of the designated Logging or Security account.

    • Click on Register administrator. CloudTrail will automatically create the

    necessary service-linked roles and register the account.

    4. In the delegated administrator account, open the CloudTrail console and confirm

    that the organization trail is visible and administrative actions are accessible.

    5. Update operational runbooks so that routine CloudTrail administration is

    performed from the delegated admin account, not the management account.'
  checks:
  - type: manual_review
    info: 'Note: This audit uses AWS CloudTrail as a concrete example. You must perform similar

      audits for all other AWS services that integrate with AWS Organizations and support

      delegated administration that are in use in your environment.

      1. Sign in to the management account and open the CloudTrail console.

      2. In the left navigation pane, choose Trails.

