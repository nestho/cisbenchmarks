- id: '2.2'
  title: Maintain current AWS account contact details
  scoring: manual
  profile:
  - Level 1
  description: Ensure contact email and telephone details for AWS accounts are current and mapped to more than one individual
    in your organization. An AWS account supports a number of contact details, and AWS will use these to contact the account
    owner if activity judged to be in breach of the Acceptable Use Policy or indicative of a likely security compromise is
    observed by the AWS Abuse team. Contact details should not be associated with a single individual, as circumstances may
    arise where that individual is unavailable. Email contact details should point to a mail alias that forwards messages
    to multiple individuals within the organization; where feasible, phone contact details should point to a PABX hunt group
    or other callforwarding system. In AWS Organizations environments, this applies to all member accounts, not just the management
    account.
  rationale: If an AWS account is observed to be behaving in a prohibited or suspicious manner, AWS will attempt to contact
    the account owner by email and phone using the listed contact details. If this is unsuccessful and the account behavior
    requires urgent mitigation, proactive measures may be taken, including throttling traffic between the account exhibiting
    suspicious behavior and AWS API endpoints or the Internet. This may result in impaired service to and from the affected
    account. Therefore, it is in both the customer’s and AWS’s best interests to ensure that prompt contact can be established.
    This is best achieved by configuring AWS account contact details to point to resources that reach multiple individuals,
    such as email aliases and PABX hunt groups.
  impact: Outdated contact details may delay incident response and lead to service disruption.
  references:
  - 1. https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/manage-accountsettings.html
  page_start: 41
  audit_raw: 'This activity can only be performed via the AWS Console, with a user who has

    permission to read and write Billing information (aws-portal:*Billing).

    1. Sign in to the AWS Management Console and open the Billing and Cost

    Management console at https://console.aws.amazon.com/billing/home#/.

    2. On the navigation bar, choose your account name, and then choose Account.

    3. Under Contact Information, review and verify the current details.'
  remediation: 'This activity can only be performed via the AWS Console, with a user who has

    permission to read and write Billing information (aws-portal:*Billing).

    From Console:

