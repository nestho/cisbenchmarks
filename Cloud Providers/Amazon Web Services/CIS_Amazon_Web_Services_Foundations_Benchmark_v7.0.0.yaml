- id: '2.11'
  title: Ensure credentials unused for 45 days or more are disabled
  scoring: scored
  profile:
  - Level 1
  description: AWS IAM users can access AWS resources using different types of credentials, such as passwords or access keys.
    It is recommended that all credentials that have been unused for 45 days or more be deactivated or removed.
  rationale: Disabling or removing unused credentials reduces the window of opportunity for credentials associated with a
    compromised or abandoned account to be used.
  impact: Disabling or removing unused credentials reduces the window of opportunity for credentials associated with a compromised
    or abandoned account to be used.
  references:
  - 1. CCE-78900-8
  - 2. https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html#removecredentials
  page_start: 70
  audit_raw: 'Perform the following to determine if unused credentials exist:

    From Console:

    1. Sign in to the AWS Management Console and open the IAM console at

    https://console.aws.amazon.com/iam

    2. Click on Users

    3. Click the Settings (gear) icon

    4. Select Console last sign-in, Access key last used, and Access Key Id

    5. Click on Confirm

    6. Check and ensure that Console last sign-in is less than 45 days ago.

    Note - - means the user has never logged in.

    7. If credentials have not been used within 45 days, refer to remediation

    From Command Line:

    Remove Access Key:

    1. Generate and review the credential report:

    aws iam generate-credential-report

    aws iam get-credential-report --query ''Content'' --output text | base64 -d

    2. Review the following fields:

    • password_last_used

    • access_key_1_last_used_date

    • access_key_2_last_used_date

    3. Identify any credentials unused for 45 days or more'
  remediation: 'From Console:

