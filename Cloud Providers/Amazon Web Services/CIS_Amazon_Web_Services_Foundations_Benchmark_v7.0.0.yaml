- id: '4.6'
  title: Ensure rotation for customer-created symmetric CMKs is enabled
  scoring: scored
  profile:
  - Level 2
  description: AWS Key Management Service (KMS) allows customers to rotate the backing key, which is key material stored within
    the KMS that is tied to the key ID of the customercreated customer master key (CMK). The backing key is used to perform
    cryptographic operations such as encryption and decryption. Automated key rotation currently retains all prior backing
    keys so that decryption of encrypted data can occur transparently. It is recommended that CMK key rotation be enabled
    for symmetric keys. Key rotation cannot be enabled for any asymmetric CMK.
  rationale: Rotating encryption keys helps reduce the potential impact of a compromised key, as data encrypted with a new
    key cannot be accessed with a previous key that may have been exposed. Keys should be rotated every year or upon an event
    that could result in the compromise of that key.
  impact: Creation, management, and storage of CMKs may require additional time from an administrator.
  references:
  - 1. https://aws.amazon.com/kms/pricing/
  - 2. https://csrc.nist.gov/publications/detail/sp/800-57-part-1/rev-5/final
  page_start: 179
  audit_raw: "From Console:\n1. Sign in to the AWS Management Console and open the KMS console at:\nhttps://console.aws.amazon.com/kms.\n\
    2. In the left navigation pane, click Customer-managed keys.\n3. Select a customer-managed CMK where Key spec = SYMMETRIC_DEFAULT.\n\
    4. Select the Key rotation tab.\n5. Ensure the Automatically rotate this KMS key every year box is\nchecked.\n6. Repeat\
    \ steps 3–5 for all customer-managed CMKs where Key spec =\nSYMMETRIC_DEFAULT.\nFrom Command Line:\n1. Run the following\
    \ command to get a list of all keys and their associated KeyIds:\n aws kms list-keys\n2. For each key, note the KeyId\
    \ and run the following command:\naws kms describe-key --key-id <key-id>\n3. If the response contains \"KeySpec = SYMMETRIC_DEFAULT\"\
    , run the following\ncommand:\n aws kms get-key-rotation-status --key-id <kms-key-id>\n4. Ensure KeyRotationEnabled is\
    \ set to true.\n5. Repeat steps 2–4 for all remaining CMKs.\n6. Alternatively, the following command can be used to check\
    \ all keys more\ncomprehensively:\nKEY_IDS=$(aws kms list-keys --query \"Keys[].KeyId\" --output text)\nfor KEY_ID in\
    \ $KEY_IDS; do\n aws kms get-key-rotation-status --key-id \"$KEY_ID\" --query\n\"{KeyId:KeyId,RotationEnabled:KeyRotationEnabled}\"\
    \ --output table\ndone"
  remediation: "From Console:\n1. Sign in to the AWS Management Console and open the KMS console at:\nhttps://console.aws.amazon.com/kms.\n\
    2. In the left navigation pane, click Customer-managed keys.\n3. Select a key with Key spec = SYMMETRIC_DEFAULT that does\
    \ not have\nautomatic rotation enabled.\n4. Select the Key rotation tab.\n5. Check the Automatically rotate this KMS key\
    \ every year box.\n6. Click Save.\n7. Repeat steps 3–6 for all customer-managed CMKs that do not have automatic\nrotation\
    \ enabled.\nFrom Command Line:\n1. Run the following command to enable key rotation:\n aws kms enable-key-rotation --key-id\
    \ <kms-key-id>"
