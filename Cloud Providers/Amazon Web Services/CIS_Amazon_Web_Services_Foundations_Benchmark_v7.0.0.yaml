- id: '6.2'
  title: Ensure no Network ACLs allow ingress from 0.0.0.0/0 to remote server administration ports
  scoring: scored
  profile:
  - Level 1
  description: The Network Access Control List (NACL) function provides stateless filtering of ingress and egress network
    traffic to AWS resources. It is recommended that no NACL allows unrestricted ingress access to remote server administration
    ports, such as SSH on port 22 and RDP on port 3389, using either the TCP (6), UDP (17), or ALL (-1) protocols.
  rationale: Public access to remote server administration ports, such as 22 (when used for SSH, not SFTP) and 3389, increases
    the attack surface of resources and unnecessarily raises the risk of resource compromise.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html
  - 2. https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Security.html#VPC_Sec
  page_start: 284
  audit_raw: 'From Console:

    Perform the following steps to determine if the account is configured as prescribed:

    1. Login to the AWS VPC Console at https://console.aws.amazon.com/vpc/home.

    2. In the left pane, click Network ACLs.

    3. For each network ACL, check whether it is associated with one or more subnets.

    4. If it is associated, proceed to Step 5

    5. If it is not associated, you may still review the rules, but note it has no effect until

    attached

    6. Select the network ACL

    7. Click the Inbound Rules tab

    8. Ensure that no rule exists which has a port range that includes port 22 or 3389,

    uses the protocols TCP (6), UDP (17), or ALL (-1), or other remote server

    administration ports for your environment, has a Source of 0.0.0.0/0, and shows

    ALLOW

    Note:

    • A port value of ALL or a port range such as 0-3389 includes port 22, 3389, and

    potentially other remote server administration ports

    • An effective ruleset that explicitly DENIES access to these ports (e.g., a DENY

    rule for ports 22 and 3389 from 0.0.0.0/0 placed before a broader ALLOW rule

    such as ANY/ANY) is considered acceptable, as NACLs are evaluated in order

    and the DENY rule will take precedence'
  remediation: 'From Console:

    Perform the following steps to remediate a network ACL:

    1. Login to the AWS VPC Console at https://console.aws.amazon.com/vpc/home.

    2. In the left pane, click Network ACLs.

    3. For each network ACL that needs remediation, perform the following:

    4. Select the network ACL.

    5. Click the Inbound Rules tab.

    6. Click Edit inbound rules.

    7. Either

    A) update the Source field to a range other than 0.0.0.0/0 B) click Delete to

    remove the offending inbound rule or C) Add an explicit DENY rule for the

    affected ports (e.g., 22, 3389) from 0.0.0.0/0 with a lower rule number than any

    broader ALLOW rule

    8. Click Save'
  checks:
  - type: manual_review
    info: 'From Console:

      Perform the following steps to determine if the account is configured as prescribed:

      1. Login to the AWS VPC Console at https://console.aws.amazon.com/vpc/home.

      2. In the left pane, click Network ACLs.

      3. For each network ACL, check whether it is associated with one or more subnets.

      4. If it is associated, proceed to Step 5

      5. If it is not associated, you may still review the rules, but note it has no effect until

      attached

      6. Select the network ACL

      7. Click the Inbound Rules tab

      8.'
    severity: medium
- id: '6.3'
  title: Ensure no security groups allow ingress from 0.0.0.0/0 to remote server administration ports
  scoring: scored
  profile:
  - Level 1
  description: Security groups provide stateful filtering of ingress and egress network traffic to AWS resources. It is recommended
    that no security group allows unrestricted ingress access to remote server administration ports, such as SSH on port 22
    and RDP on port 3389, using either the TCP (6), UDP (17), or ALL (-1) protocols.
  rationale: Public access to remote server administration ports, such as 22 (when used for SSH, not SFTP) and 3389, increases
    the attack surface of resources and unnecessarily raises the risk of resource compromise.
  impact: When updating an existing environment, ensure that administrators have access to remote server administration ports
    through another mechanism before removing access by deleting the 0.0.0.0/0 inbound rule.
  references:
  - 1. https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-securitygroups.html#deleting-security-group-rule
  page_start: 287
  audit_raw: 'Perform the following to determine if the account is configured as prescribed:

    1. Login to the AWS VPC Console at https://console.aws.amazon.com/vpc/home.

    2. In the left pane, click Security Groups.

    3. For each security group, perform the following:

    o Select the security group.

    o Click the Inbound Rules tab.

    o Ensure that no rule exists which has a port range including port 22 or

    3389, uses the protocols TCP (6), UDP (17), or ALL (-1), or other remote

    server administration ports for your environment, and has a Source of

    0.0.0.0/0.

    Note

    A port value of ALL or a port range such as 0-3389 includes port 22, 3389, and

    potentially other remote server administration ports

    Security groups are stateful and do not support explicit DENY rules. Therefore, an

    “effective ruleset” approach (e.g., allowing ANY/ANY but denying specific ports) is not

    applicable. Any rule that allows 0.0.0.0/0 access to administrative ports is considered

    non-compliant and must be removed or restricted'
  remediation: 'From Console:

    Perform the following to implement the prescribed state:

    1. Login to the AWS VPC Console at https://console.aws.amazon.com/vpc/home.

    2. In the left pane, click Security Groups.

    3. For each security group, perform the following:

    o Select the security group.

    o Click the Inbound Rules tab.

    o Click the Edit inbound rules button.

    4. Identify the rules to be edited or removed.

    5. Either:

    A) update the Source field to a range other than 0.0.0.0/0, or B) click Delete to

    remove the offending inbound rule.

    o Click Save rules.

    From Command Line:

    1. Check all security groups for insecure inbound rules allowing traffic from

    0.0.0.0/0:

    aws ec2 describe-security-group-rules --query ''SecurityGroupRules[?CidrIpv4

    == "0.0.0.0/0" && IsEgress == `false`]'' --output json

    2. Delete the insecure rule(s) based on their rule ID:

    aws ec2 delete-security-group-rules --group-id <security_group_id> --

    security-group-rule-ids <rule_id_to_delete>

    3. Recreate necessary security group rules:

    aws ec2 authorize-security-group-ingress --group-id <security_group_id> --

    protocol <tcp、udp、icmp or all> --port <port> --cidr <souce_cidr>'
