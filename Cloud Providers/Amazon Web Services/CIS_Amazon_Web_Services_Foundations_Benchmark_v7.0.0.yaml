- id: '4.3'
  title: Ensure AWS Config is enabled in all regions
  scoring: scored
  profile:
  - Level 2
  description: AWS Config is a web service that performs configuration management of supported AWS resources within your account
    and delivers log files to you. The recorded information includes the configuration items (AWS resources), relationships
    between configuration items (AWS resources), and any configuration changes between resources. It is recommended that AWS
    Config be enabled in all regions. In environments using AWS Control Tower or Landing Zone Accelerator (LZA), AWS Config
    may be centrally managed and automatically enabled across regions.
  rationale: The AWS configuration item history captured by AWS Config enables security analysis, resource change tracking,
    and compliance auditing.
  impact: Enabling AWS Config in all regions provides comprehensive visibility into resource configurations, enhancing security
    and compliance monitoring. However, this may incur additional costs and require proper configuration management.
  references:
  - 1. CCE-78917-2
  - 2. https://awscli.amazonaws.com/v2/documentation/api/latest/reference/configservi
  page_start: 164
  audit_raw: "Process to evaluate AWS Config configuration per region:\nFrom Console:\n1. Sign in to the AWS Management Console\
    \ and open the AWS Config console at\nhttps://console.aws.amazon.com/config/.\n2. On the top right of the console select\
    \ the target region.\n3. If a Config Recorder is enabled in this region, you should navigate to the Settings\npage from\
    \ the navigation menu on the left-hand side. If a Config Recorder is not\nyet enabled in this region, proceed to the remediation\
    \ steps.\n4. Ensure \"Record all resources supported in this region\" is checked.\n5. Ensure \"Include global resources\
    \ (e.g., AWS IAM resources)\" is checked, unless\nit is enabled in another region (this is only required in one region).\n\
    6. Ensure the correct S3 bucket has been defined.\n7. Ensure the correct SNS topic has been defined.\n8. Repeat steps\
    \ 2 to 7 for each region.\nNote: In environments using AWS Control Tower or Landing Zone Accelerator (LZA),\nAWS Config\
    \ configuration may be managed centrally. Verify that AWS Config is\nenabled and recording through the centralized governance\
    \ solution.\nFrom Command Line:\n1. Run this command to show all AWS Config Recorders and their properties:\naws configservice\
    \ describe-configuration-recorders\n2. Evaluate the output to ensure that all recorders have a recordingGroup object\n\
    which includes \"allSupported\": true. Additionally, ensure that at least one\nrecorder has \"includeGlobalResourceTypes\"\
    : true.\nNote: There is one more parameter, \"ResourceTypes,\" in the recordingGroup object.\nWe don't need to check it,\
    \ as whenever we set \"allSupported\" to true, AWS enforces the\nresource types to be empty (\"ResourceTypes\": []).\n\
    Sample output:\n{\n \"ConfigurationRecorders\": [\n {\n \"recordingGroup\": {\n \"allSupported\": true,\n \"resourceTypes\"\
    : [],\n \"includeGlobalResourceTypes\": true\n },\n \"roleARN\": \"arn:aws:iam::<AWS_Account_ID>:role/servicerole/<config-role-name>\"\
    ,\n \"name\": \"default\"\n }\n ]\n}\n3. Run this command to show the status for all AWS Config Recorders:\naws configservice\
    \ describe-configuration-recorder-status\n4. In the output, find recorders with name key matching the recorders that were\n\
    evaluated in step 2. Ensure that they include \"recording\": true and\n\"lastStatus\": \"SUCCESS\"."
  remediation: "To implement AWS Config configuration:\nFrom Console:\n1. Select the region you want to focus on in the top\
    \ right of the console.\n2. Click Services.\n3. Click Config.\n4. If a Config Recorder is enabled in this region, navigate\
    \ to the Settings page from\nthe navigation menu on the left-hand side. If a Config Recorder is not yet enabled\nin this\
    \ region, select \"Get Started\".\n5. Select \"Record all resources supported in this region\".\n6. Choose to include\
    \ global resources (IAM resources).\n7. Specify an S3 bucket in the same account or in another managed AWS account.\n\
    8. Create an SNS Topic from the same AWS account or another managed AWS\naccount.\nNote: In AWS Control Tower or Landing\
    \ Zone Accelerator (LZA) environments, AWS\nConfig setup and recording may be deployed and managed automatically. Configuration\n\
    changes should be performed through the centralized governance framework rather\nthan directly in individual accounts.\n\
    From Command Line:\n1. Ensure there is an appropriate S3 bucket, SNS topic, and IAM role per the AWS\nConfig Service prerequisites.\n\
    2. Run this command to create a new configuration recorder:\naws configservice put-configuration-recorder --configuration-recorder\n\
    name=<config-recorder-name>,roleARN=arn:aws:iam::<account-id>:role/<iam-role>\n--recording-group allSupported=true,includeGlobalResourceTypes=true\n\
    3. Create a delivery channel configuration file locally which specifies the channel\nattributes, populated from the prerequisites\
    \ set up previously:\n{\n \"name\": \"<delivery-channel-name>\",\n \"s3BucketName\": \"<bucket-name>\",\n \"snsTopicARN\"\
    : \"arn:aws:sns:<region>:<account-id>:<sns-topic>\",\n \"configSnapshotDeliveryProperties\": {\n \"deliveryFrequency\"\
    : \"Twelve_Hours\"\n }\n}\n4. Run this command to create a new delivery channel, referencing the json\nconfiguration file\
    \ made in the previous step:\naws configservice put-delivery-channel --delivery-channel file://<deliverychannel-file>.json\n\
    5. Start the configuration recorder by running the following command:\naws configservice start-configuration-recorder\
    \ --configuration-recorder-name\n<config-recorder-name>"
