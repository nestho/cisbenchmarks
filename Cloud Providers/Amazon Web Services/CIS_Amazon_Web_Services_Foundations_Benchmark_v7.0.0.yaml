    ''SecurityGroupRules[?GroupId == `<default-security-group-id>` && IsEgress ==

    `true`]''

    6. Delete the outbound security group rules based on their rule IDs

    aws ec2 revoke-security-group-egress --group-id <default-security-group-id> -

