    \ \"AdvancedEventSelectors\": [\n {\n \"Name\": \"Management events selector\",\n \"FieldSelectors\": [\n {\n \"Field\"\
    : \"eventCategory\",\n \"Equals\": [\n \"Management\"\n ]"
  remediation: 'Perform the following to enable global (Multi-region) CloudTrail logging:

    From Console:

    1. Sign in to the AWS Management Console and open the IAM console at

    https://console.aws.amazon.com/cloudtrail.

    2. Click on Trails in the left navigation pane.

    3. Click Get Started Now if it is presented, then:

    • Click Add new trail.

    • Enter a trail name in the Trail name box.

    o A trail created in the console is a multi-region trail by default.

    • Specify an S3 bucket name in the S3 bucket box.

    • Specify the AWS KMS alias under the Log file SSE-KMS encryption section,

    or create a new key.

    • Click Next.

    4. Ensure the Management events check box is selected.

    5. Ensure both Read and Write are checked under API activity.

    6. Click Next.

    7. Review your trail settings and click Create trail.

    From Command Line:

    Create a multi-region trail:

    aws cloudtrail create-trail --name <trail-name> --bucket-name <s3-bucket-forcloudtrail> --is-multi-region-trail

    Enable multi-region on an existing trail:

    aws cloudtrail update-trail --name <trail-name> --is-multi-region-trail

    Note: Creating a CloudTrail trail via the CLI without providing any overriding options

    configures all read and write Management Events to be logged by default.'
