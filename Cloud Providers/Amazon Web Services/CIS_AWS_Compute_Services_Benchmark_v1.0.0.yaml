- id: '2.13'
  title: Ensure Secrets and Sensitive Data are not stored directly in EC2 User Data
  scoring: manual
  profile:
  - Level 1
  description: User Data can be specified when launching an ec2 instance. Examples include specifying parameters for configuring
    the instance or including a simple script.
  rationale: The user data is not protected by authentication or cryptographic methods. Therefore, sensitive data, such as
    passwords or long-lived encryption keys should not be stored as user data.
  impact: Anyone who has access to the instance and configuration can view the user data.
  references:
  - 1. https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instancemetadata.html
  page_start: 63
  audit_raw: 'From the Console:

    1. Login to AWS Console using https://console.aws.amazon.com

    2. Click All services and click EC2 under Compute.

    3. Click on Instances.

    4. For each instance, click Actions -> Instance Settings -> Edit user data

    5. For each instance, review the user data to ensure there are no secrets or

    sensitive data stored.

    6. If secrets or sensitive data is found, refer to the remediation below.

    7. Repeat steps 2-7 for all regions used.

    From the Command line

    1. Run aws ec2 describe-instances to retrieve information about all instances in

    the AWS region. The output will include instance ids.

    2. Run aws ec2 describe-instance-attribute for each instance in AWS account.

    aws ec2 describe-instance-attribute

    --instance-id "ID of instance" --attribute userData

    Note: User Data may be Base64 encoded. Decode the output as necessary.

    3. Review user data to ensure no secrets or sensitive information are stored.

    4. Repeat the Audit for all the other AWS regions.'
  remediation: 'From the Console

    1. Login to AWS Console using https://console.aws.amazon.com

    2. Click All services and click EC2 under Compute.

    3. Click on Instances.

    4. If the instance is currently running, stop the instance first.

    Note: ensure there is no negative impact from stopping the instance prior to stopping

    the instance.

    5. For each instance, click Actions -> Instance Settings -> Edit user data

    6. For each instance, edit the user data to ensure there are no secrets or sensitive

    data stored. A Secret Management solution such as AWS Secrets Manager can

    be used here as a more secure mechanism of storing necessary sensitive data.

    7. Repeat this remediation for all the other AWS regions.

    Note: If the ec2 instances are created via automation or infrastructure-as-code, edit the

    user data in those pipelines and code.'
  checks:
  - type: manual_review
    info: 'From the Console:

      1. Login to AWS Console using https://console.aws.amazon.com

      2. Click All services and click EC2 under Compute.

      3. Click on Instances.

      4. For each instance, click Actions -> Instance Settings -> Edit user data

      5. For each instance, review the user data to ensure there are no secrets or

      sensitive data stored.

      6. If secrets or sensitive data is found, refer to the remediation below.

      7. Repeat steps 2-7 for all regions used.

