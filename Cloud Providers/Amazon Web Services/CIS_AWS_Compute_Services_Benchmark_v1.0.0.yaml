  rationale: The IMDSv2 method uses session-based controls to help protect access and control of Amazon Elastic Compute Cloud
    (Amazon EC2) instance metadata. With IMDSv2, controls can be implemented to restrict changes to instance metadata.
  impact: Once you enforce IMDSv2, then IMDSv1 no longer works, and applications that use IMDSv1 might not function correctly.
    Before enforcing IMDSv2, verify that any applications that use Amazon EC2 metadata are upgraded to a version that supports
    IMDSv2.
