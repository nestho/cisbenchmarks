  title: Ensure Lambda functions do not allow unknown cross account access via permission policies.
  scoring: manual
  profile:
  - Level 1
  description: Ensure that all your Amazon Lambda functions are configured to allow access only to trusted AWS accounts in
    order to protect against unauthorized cross-account access.
  rationale: Allowing unknown (unauthorized) AWS accounts to invoke your Amazon Lambda functions can lead to data exposure
    and data loss. To prevent any unauthorized invocation requests for your Lambda functions, restrict access only to trusted
    AWS accounts.
  impact: ''
  references: []
  page_start: 123
  audit_raw: 'From the Console

    1. Login to the AWS Console using https://console.aws.amazon.com/lambda/.

