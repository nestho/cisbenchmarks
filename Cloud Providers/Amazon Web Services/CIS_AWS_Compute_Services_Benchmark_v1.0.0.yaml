- id: 2.1.4
  title: Ensure Images (AMI) are not older than 90 days
  scoring: manual
  profile:
  - Level 1
  description: Ensure that your AMIs are not older than 90 days.
  rationale: Using up-to-date AMIs will provide many benefits from OS updates and security patches helping to ensure reliability,
    security and compliance.
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'Perform the following to determine the age of an AMI.

    From the Console

    1. Login to the EC2 console at https://console.aws.amazon.com/ec2/.

    2. In the left pane, under Images, click AMIs.

    3. Select the AMI for review.

    4. Under the Details tab

    5. Review the Creation date.

    If the age of the selected AMI is greater than 90 days, the AMI is considered outdated

    and it should be updated.

    6. Repeat steps no. 3 – 5 to verify the date of the other approved AMIs available.

    Repeat all steps for the other regions.

    Refer to the remediation procedure below to update the AMI.'
  remediation: 'Perform these steps if the Creation date is older than 90 days.

    From the Console

    1. Login to the EC2 console at https://console.aws.amazon.com/ec2/.

    2. In the left pane, under Images, click AMIs.

    3. Select the AMI to be updated.

    4. Click on Launch

    5. Go through the EC2 Instance creation process.

    6. Apply all system, security and application updates that are applicable to the EC2

    instance.

    7. Once completed click on Instance state, `Stop instance1.

    8. Click on Actions, Image and templates, Create image

    9. Once the image process has complete return to the AMI list but clicking on

    Images, AMIs

    10. Select the AMI that is older than 90 days.

    11. Click on Actions, Deregister

    Repeat these steps for any other AMIs older than 90 days.'
  checks:
  - type: manual_review
    info: 'Perform the following to determine the age of an AMI.

      From the Console

      1. Login to the EC2 console at https://console.aws.amazon.com/ec2/.

      2. In the left pane, under Images, click AMIs.

      3. Select the AMI for review.

      4. Under the Details tab

      5. Review the Creation date.

      If the age of the selected AMI is greater than 90 days, the AMI is considered outdated

      and it should be updated.

      6. Repeat steps no. 3 – 5 to verify the date of the other approved AMIs available.

      Repeat all steps for the other reg'
    severity: medium
- id: 2.1.5
  title: Ensure Images are not Publicly Available
  scoring: manual
  profile:
  - Level 1
  description: EC2 allows you to make an AMI public, sharing it with all AWS accounts.
  rationale: Publicly sharing an AMI with all AWS accounts could expose organizational data and configuration information.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/sharing-amis.html
  page_start: 26
  audit_raw: 'Perform the steps below to determine if any AMIs are shared with all AWS accounts.

    From the Console

    1. Login to the EC2 console at https://console.aws.amazon.com/ec2/.

    2. In the left pane, under Images, click AMIs.

    3. Confirm the Owned by me is set.

    4. Select the AMI from the list.

    5. Click on the Permissions Tab

    6. If this reads This image is currently Public.

    Please refer to the remediation below.'
  remediation: 'Perform the steps below to set an AMIs to Private.

    From the Console

    1. Login to the EC2 console at https://console.aws.amazon.com/ec2/.

    2. In the left pane, under Images, click AMIs.

    3. Confirm the Owned by me is set.

    4. Select the AMI from the list.

    5. Click on the Permissions Tab

    6. Click on Edit

    7. Click on the radio button Private

    Add AWS Account Number if you have a need to share with other Internal AWS

    accounts that your Organization owns.'
  checks:
  - type: sql
    command: Select the AMI from the list.
    severity: medium
    info: 'Perform the steps below to determine if any AMIs are shared with all AWS accounts.

      From the Console

      1. Login to the EC2 console at https://console.aws.amazon.com/ec2/.

      2. In the left pane, under Images, click AMIs.

      3. Confirm the Owned by me is set.

      4. Select the AMI from the list.

      5. Click on the Permissions Tab

      6. If this reads This image is currently Public.

      Please refer to the remediation belo'
- id: 2.2.1
  title: Ensure EBS volume encryption is enabled
  scoring: scored
  profile:
  - Level 1
  description: Elastic Compute Cloud (EC2) supports encryption at rest when using the Elastic Block Store (EBS) service. While
    disabled by default, forcing encryption at EBS volume creation is supported.
  rationale: Encrypting data at rest reduces the likelihood that it is unintentionally exposed and can nullify the impact
    of disclosure if the encryption remains unbroken.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/EBSEncryption.html
  - 2. https://aws.amazon.com/blogs/aws/new-opt-in-to-default-encryption-for-new-ebsvolumes/
  page_start: 29
  audit_raw: 'From Console:

    1. Login to the EC2 console using https://console.aws.amazon.com/ec2/

    2. Under Account attributes, click EBS encryption.

    3. Verify Always encrypt new EBS volumes displays Enabled.

    4. Review every region in-use.

    Note: EBS volume encryption is configured per region.

    From Command Line:

    1. Run

    aws --region <region> ec2 get-ebs-encryption-by-default

    2. Verify that "EbsEncryptionByDefault": true is displayed.

    3. Review every region in-use.

    Note: EBS volume encryption is configured per region.'
  remediation: 'From Console:

    1. Login to the EC2 console using https://console.aws.amazon.com/ec2/

    2. Under Account attributes, click EBS encryption.

    3. Click Manage.

    4. Click the Enable checkbox.

    5. Click Update EBS encryption

    6. Repeat for every region requiring the change.

    Note: EBS volume encryption is configured per region.

    From Command Line:

    1. Run

    aws --region <region> ec2 enable-ebs-encryption-by-default

    2. Verify that "EbsEncryptionByDefault": true is displayed.

    3. Repeat every region requiring the change.

    Note: EBS volume encryption is configured per region.'
  checks:
  - type: manual_review
    info: 'From Console:

      1. Login to the EC2 console using https://console.aws.amazon.com/ec2/

      2. Under Account attributes, click EBS encryption.

      3. Verify Always encrypt new EBS volumes displays Enabled.

      4. Review every region in-use.

      Note: EBS volume encryption is configured per region.

      From Command Line:

      1. Run

      aws --region <region> ec2 get-ebs-encryption-by-default

      2. Verify that "EbsEncryptionByDefault": true is displayed.

      3. Review every region in-use.

      Note: EBS volume encryption is configured per re'
    severity: medium
