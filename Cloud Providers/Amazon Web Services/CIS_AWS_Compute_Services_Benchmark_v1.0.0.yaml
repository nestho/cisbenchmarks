  scoring: manual
  profile:
  - Level 1
  description: As you can set your own environmental variables for Lambda it is important to also encrypt them for in transit
    protection.
  rationale: Lambda environment variables should be encrypted in transit for client-side protection as they can store sensitive
    information.
  impact: ''
  references: []
  page_start: 128
  audit_raw: 'From the Console

    1. Login to the AWS Console using https://console.aws.amazon.com/lambda/.

