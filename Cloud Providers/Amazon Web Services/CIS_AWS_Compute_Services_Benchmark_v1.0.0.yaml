- id: '5.2'
  title: Ensure Batch roles are configured for cross-service confused deputy prevention
  scoring: manual
  profile:
  - Level 1
  description: The Cross-service confused deputy problem is a security issue where an entity that doesn't have permission
    to perform an action can coerce a more-privileged entity to perform the action.
  rationale: Cross-service impersonation can result in the confused deputy problem. Cross-service impersonation can occur
    when one service (the calling service) calls another service (the called service). The calling service can be manipulated
    to use its permissions to act on another customer's resources in a way it should not otherwise have permission to access.
  impact: An IAM role is an identity you can create that has specific permissions with credentials that are valid for short
    durations. Roles can be assumed by entities that you trust. IAM Roles are often organization named and organization based.
    Searching for and reviewing the roles for this recommendation is a manual process.
  references:
  - 1. https://docs.aws.amazon.com/batch/latest/userguide/cross-service-confuseddeputy-prevention.html
  page_start: 132
  audit_raw: "From the Console\n1. Login to the AWS Console using https://console.aws.amazon.com/iam/\n2. On the left hand\
    \ side under Access management, Click on Roles\n3. Search for any roles related to Batch\n4. Click on the role and the\
    \ Assume Role Policy Document and confirm that the\nAssumeRole Action has a aws:SourceArn key that contains the full ARN\
    \ of the\nBatch resource\n{\n \"Version\": \"2012-10-17\",\n \"Statement\": [\n {\n \"Effect\": \"Allow\",\n \"Principal\"\
    : {\n \"Service\": \"batch.amazonaws.com\"\n },\n \"Action\": \"sts:AssumeRole\",\n \"Condition\": {\n \"ArnLike\": {\n\
    \ \"aws:SourceArn\": [\n \"arn:aws:batch:us-east-1:123456789012:computeenvironment/testCE\",\n ]\n }\n }\n }\n ]\n}\n\
    5. If it is showing an * within the ARN or does not have this condition key specified,\nthen the Batch process has access\
    \ to all of the resources defined in that\nenvironment.\n\"arn:aws:batch:us-east-1:123456789012:compute-environment/*\"\
    ,\n{\n \"Version\": \"2012-10-17\",\n \"Statement\": [\n {\n \"Effect\": \"Allow\",\n \"Principal\": {\n \"Service\":\
    \ \"batch.amazonaws.com\"\n },\n \"Action\": \"sts:AssumeRole\"\n }\n ]\n}\n6. Repeat for any roles assigned to Batch\
    \ that have AssumeRole\n7. Refer to the remediation below"
  remediation: "From the Console\n1. Login to the AWS Console using https://console.aws.amazon.com/iam/\n2. On the left hand\
    \ side under Access management, Click on Roles\n3. Search for any roles identified above in the audit.\n4. Click on the\
    \ role and update the Action AssumeRole, aws:SourceArn to contain\nthe full ARN of the resource\n\"aws:SourceArn\": [\n\
    \ \"arn:aws:batch:us-east-1:123456789012:computeenvironment/testCE\",\n5. Repeat for any roles defined in the Audit."
  checks:
