- id: '4.4'
  title: Ensure least privilege is used with Lambda function access
  scoring: manual
  profile:
  - Level 1
  description: Lambda is fully integrated with IAM, allowing you to control precisely what each Lambda function can do within
    the AWS Cloud. As you develop a Lambda function, you expand the scope of this policy to enable access to other resources.
    For example, for a function that processes objects put into an S3 bucket, it requires read access to objects stored in
    that bucket. Do not grant the function broader permissions to write or delete data, or operate in other buckets.
  rationale: You can use AWS Identity and Access Management (IAM) to manage access to the Lambda API and resources like functions
    and layers. For users and applications in your account that use Lambda, you manage permissions in a permissions policy
    that you can apply to IAM users, groups, or roles. To grant permissions to other accounts or AWS services that use your
    Lambda resources, you use a policy that applies to the resource itself.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/serviceauthorization/latest/reference/reference_policies_actions-resourcescontextkeys.html
  - 2. https://awspolicygen.s3.amazonaws.com/policygen.html
  page_start: 108
  audit_raw: 'Determining the exact permissions required is a manual process and can be

    challenging, since IAM permissions are very granular and they control access to both

    the data plane and control plane.

    Please refer to the references section below for useful documentation on developing the

    correct IAM policies for Lambda.'
  remediation: 'As building out the IAM permissions for Lambda here are some things to consider.

    • Set granular IAM permissions for Lambda functions.

    • Limit user access via IAM permissions to only necessary resources and

    operations.

    • Remove unused or outdated IAM Users, Roles and Permissions.

    • Periodically review and adjust IAM permissions.

    • Do not allow all-access permissions for Lambda functions as a short cut."'
  checks:
  - type: manual_review
    info: 'Determining the exact permissions required is a manual process and can be

      challenging, since IAM permissions are very granular and they control access to both

      the data plane and control plane.

      Please refer to the references section below for useful documentation on developing the

      correct IAM policies for Lambda.'
    severity: medium
- id: '4.5'
  title: Ensure every Lambda function has its own IAM Role
  scoring: manual
  profile:
  - Level 1
  description: Every Lambda function should have a one to one IAM execution role and the roles should not be shared between
    functions.
  rationale: The Principle of Least Privilege means that any Lambda function should have the minimal amount of access required
    to perform its tasks. In order to accomplish this Lambda functions should not share IAM Execution roles.
  impact: ''
  references: []
  page_start: 110
  audit_raw: 'From the Console

    1. Login to the AWS console using https://console.aws.amazon.com/lambda/

    2. In the left column, under AWS Lambda, click Functions.

    3. Under Function name click on the name of the function that you want to review.

    4. Click the Configuration tab

    5. Under General configuration on the left column, click Permissions.

    6. Under the Execution role section, Role name not the name listed as this is the

    IAM is the role that defines the access permissions for the selected function.

    7. Repeat steps 2 – 6 for all the Lambda functions listed within the AWS region.

    8. If any Lambda functions share the same Execution role, refer to the remediation

    below.

    9. Repeat this Audit for all the AWS Regions.'
  remediation: 'From the Console

    1. Login to the AWS console using https://console.aws.amazon.com/lambda/

    2. In the left column, under AWS Lambda, click Functions.

    3. Under Function name click on the name of the function that you want to

    change/update.

    4. Click the Configuration tab

    5. Under General configuration on the left column, click Permissions.

    6. Under the Execution role section, click Edit.

    7. Scroll down to Execution role

    To use an existing IAM role

    - Click `Use an existing role`

    - Select the role from the `Existing role` dropdown.

    - The IAM role can''t be associated with another Lambda function and must

    follow the Principle of Least Privilege.

    To use a new IAM role

    - Click `Create a new role from AWS policy templates`

    - Provide a unique name based on company policy in the `Role name`

    - Select the policy templates from the `Policy templates` dropdown.

    8. Click Save

    9. Repeat steps 2 – 8 for all the Lambda functions listed within the AWS region that

    do not have a unique IAM Execution Role.

    10. Repeat this remediation process for all the AWS Regions.'
  checks:
  - type: manual_review
    info: 'From the Console

      1. Login to the AWS console using https://console.aws.amazon.com/lambda/

      2. In the left column, under AWS Lambda, click Functions.

      3. Under Function name click on the name of the function that you want to review.

      4. Click the Configuration tab

      5. Under General configuration on the left column, click Permissions.

      6. Under the Execution role section, Role name not the name listed as this is the

      IAM is the role that defines the access permissions for the selected function.

