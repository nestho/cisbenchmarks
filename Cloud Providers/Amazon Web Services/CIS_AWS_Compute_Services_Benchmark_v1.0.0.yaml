- id: '4.6'
  title: Ensure Lambda functions are not exposed to everyone.
  scoring: manual
  profile:
  - Level 1
  description: A publicly accessible Amazon Lambda function is open to the public and can be reviewed by anyone. To protect
    against unauthorized users that are sending requests to invoke these functions they need to be changed so they are not
    exposed to the public.
  rationale: Allowing anyone to invoke and run your Amazon Lambda functions can lead to data exposure, data loss, and unexpected
    charges on your AWS bill.
  impact: ''
  references:
  - 1. https://awscli.amazonaws.com/v2/documentation/api/latest/reference/lambda/ind
  page_start: 112
  audit_raw: 'From the Console

    1. Login to the AWS Console using https://console.aws.amazon.com/lambda/.

    2. In the left column, under AWS Lambda, click Functions.

    3. Under Function name click on the name of the function that you want to review

    4. Click the Configuration tab

    5. In the left column, click Permissions.

    6. In the Resource-based policy section, click View policy document

    7. Review the Resource-based policy document box. Find the "Principal" element

    defined for each policy statement and check the element value. If the element

    has one of the following values: "" or { "AWS": "" }, it means it is set to "Allow",

    and if it does not contain a "Condition" clause to filter the access, the selected

    Amazon Lambda function is set to anonymous access.

    8. If any of the Lambda functions have anonymous access set refer to the

    remediation below.

    9. Repeat steps 2 – 7 for each Lambda function available within the current AWS

    region.

    10. Repeat this Audit for all the other AWS regions.

    From the Command line

    1. Run ''aws lambda list-functions''

    aws lambda list-functions --output table --query "Functions[*].FunctionName"

    This command will provide a table titles ListFunctions

    2. Run aws lambda get-policy

    aws lambda get-policy --function-name "name_of_function" --output text --

    query "Policy"

    This will provide an output of the policy assigned to that function.

    3. Find the "Principal" element defined for that function. If the element has one of

    the following values: "" or { "AWS": "" }, it means it is set to "Allow", and if it does

    not contain a "Condition" clause to filter the access, the selected Amazon

    Lambda function is set to anonymous access.

    4. Make note of the Function name from step 1 and the Statement name from step

    2 and refer to the remediation steps below.

    5. Repeat steps 1 – 3 for each Lambda function listed within the current region.

    6. Repeat this Audit for all the other AWS regions.'
  remediation: 'From the Console

    1. Login to the AWS Console using https://console.aws.amazon.com/lambda/.

    2. In the left column, under AWS Lambda, click Functions.

    3. Under Function name click on the name of the function that you want to review

    4. Click the Configuration tab

    5. In the left column, click Permissions.

    6. In the Resource-based policy section, perform the following actions:

    • Under Policy statements

    • Select the policy statement that allows anonymous access

    • Click Delete to remove the non-compliant statement from the resource-based

    policy attached

    • Within the Delete statement confirmation box, click Remove

    • Click Add permissions to add a new policy statement that grants permissions to a

    trusted entity only.

    • On the Add permissions page configure the new policy statement to grant access

    to another AWS account, IAM user, IAM role, or to another AWS service.

    • Click Save

    7. Repeat steps no. 2 – 6 for each Lambda function that fails the Audit above, within

    the current region.

    8. Repeat this Audit for all the other AWS regions.

    From the Command line

    1. Run ''aws lambda remove-permission''

    aws lambda remove-permission --function-name "name_of_function" --statementid "SID_of_Statement"

    This command will remove the access policy that is failing the audit for that function.

    2. Run aws lambda add-permission

    aws lambda add-permission --function-name "name_of_function" --statement-id

    "correctaccess" --principal "012345678910" --action lambda:InvokeFunction

    This adds a new policy to the function.

    ***Note The --principal parameter can be the The ID of the trusted AWS account,

    another AWS account, IAM user, IAM role, or another AWS service.

    3. The command output should display the new policy created.

    4. Repeat steps 1-2 for each Lambda function from the audit for all regions.'
  checks:
  - type: manual_review
    info: 'From the Console

      1. Login to the AWS Console using https://console.aws.amazon.com/lambda/.

      2. In the left column, under AWS Lambda, click Functions.

      3. Under Function name click on the name of the function that you want to review

      4. Click the Configuration tab

      5. In the left column, click Permissions.

      6. In the Resource-based policy section, click View policy document

      7. Review the Resource-based policy document box. Find the "Principal" element

      defined for each policy statement and check the el'
    severity: medium
- id: '4.7'
  title: Ensure Lambda functions are referencing active execution roles.
  scoring: manual
  profile:
  - Level 1
  description: In order to have the necessary permissions to access the AWS cloud services and resources Amazon Lambda functions
    should be associated with active(available) execution roles.
  rationale: A Lambda function's execution role is an Identity and Access Management (IAM) role that grants the function permission
    to process and access specific AWS services and resources. When Amazon Lambda functions are not referencing active execution
    roles, the functions are losing the ability to perform critical operations securely.
  impact: ''
  references: []
  page_start: 115
  audit_raw: 'From the Console

    1. Login to the AWS Console using https://console.aws.amazon.com/lambda/.

    2. In the left column, under AWS Lambda, click Functions.

    3. Under Function name click on the name of the function that you want to review

    4. Click the Configuration tab

    5. In the left column, click Permissions.

    6. In the Resource summary section, if it reads "The role with name <role_name>

    cannot be found. (Service: LambdaConsole; Status Code: 404; Error Code:

    NoSuchEntity; Request ID: e3f12a73-2988-4dd5-b2d1-237c800a27f4; Proxy:

    null) refer to the remediation below.

    7. Repeat steps 2 – 6 for each Lambda function available within the current AWS

    region.

    8. Repeat this Audit for all the other AWS regions.

    From the Command line

    1. Run aws lambda list-functions

    aws lambda list-functions --output table --query "Functions[*].FunctionName"

    This command will provide a table titled ListFunctions

    2. Run aws lambda get-function

    aws lambda get-function --function-name "name_of_function" --query

    "Configuration.Role"

    This will provide an output returning the role ARN assigned to that function.

    3. Run aws lambda get-role

    aws iam get-role --role-name "name_of_role"

    This will return the requested configuration information.

    4. The command output should return the requested configuration information:

    5. If the command output returns a An error occurred (NoSuchEntity) when

    calling the GetRole operation error message instead of the role''s

    configuration, the execution role associated with the selected Lambda function is

    no longer available. Refer to the remediation below.

    6. Repeat steps 1-5 for each Lambda function available in the selected AWS

    region.

    Perform the Audit process for other regions.'
  remediation: 'From the Console

    1. Login to the AWS Console using https://console.aws.amazon.com/lambda/.

    2. In the left column, under AWS Lambda, click Functions.

    3. Under Function name click on the name of the function that you want to update.

    4. Click the Configuration tab

    5. In the left column, click Permissions.

    6. In the Execution role section, click Edit

    7. In the Edit basic settings page, perform one of the following actions:

    - Click Use an existing role if you already a execution role for the selected

    Lambda function.

    - Select the IAM role from the `Existing role` dropdown list.

    - Click Save.

    Or

    - Click To create a custom role, go to the `IAM console`.

    - Click AWS Service

    - Click `Lambda`.

    - Click `Next: Permissions

    - Attach the permission policies needed

    - Click Next: Tags

    - Add tags (optional) based on your Organizational policy

    - Click Next: Review

    - Enter a Role name and a Role description so you can attach the policy to

    the Lambda function

    - Click `Create role`

    - Refresh the Edit basic settings page

    - Select the new IAM role you just created from the `Existing role` dropdown

    list.

    - Click Save.

    8. Repeat steps 2 – 7 to update the execution role for each misconfigured Amazon

    Lambda function within the current AWS region.

    9. Repeat this Audit for all the other AWS regions.'
  checks:
  - type: manual_review
    info: 'From the Console

      1. Login to the AWS Console using https://console.aws.amazon.com/lambda/.

      2. In the left column, under AWS Lambda, click Functions.

      3. Under Function name click on the name of the function that you want to review

      4. Click the Configuration tab

      5. In the left column, click Permissions.

      6. In the Resource summary section, if it reads "The role with name <role_name>

