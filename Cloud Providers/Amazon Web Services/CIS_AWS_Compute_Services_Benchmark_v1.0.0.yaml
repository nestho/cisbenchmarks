    \ AMI.\n6. Follow organization steps to secure this instance and replace it with an instance\nbuilt from an approved AMI\
    \ if applicable.\n7. Repeat steps 3 – 6 to verify all instance have been created with approved AMIs\nRepeat the process\
    \ for all other regions."
  checks:
  - type: manual_review
    info: "Perform the following to confirm only approved AMIs are being used.\nFrom the Console:\n1. Login to the EC2 console\
      \ at https://console.aws.amazon.com/ec2/.\n2. In the left pane click on Images.\n3. Then choose AMIs\n4. Confirm that\
      \ Owned by me is selected\n5. Review the list of AMIs.\n6. Confirm that the AMIs listed are all approved for use\n7.\
      \ In the left pane click on Instances\n8. Then choose Instances\n9. Select the EC2 instance for review.\n10. In the\
      \ Details tab review:\n AMI Name\n AMI location\n11. Co"
