- id: 2.1.1
  title: Ensure Consistent Naming Convention is used for Organizational AMI
  scoring: manual
  profile:
  - Level 1
  description: The naming convention for AMI (Amazon Machine Images) should be documented and followed for any AMI's created.
  rationale: The majority of AWS resources can be named and tagged. Most organizations have already created standardize naming
    conventions, and have existing rules in effect. They simply need to extend that for all AWS cloud resources to include
    Amazon Machine Images (AMI)
  impact: ''
  references:
  - 1. https://awscli.amazonaws.com/v2/documentation/api/latest/reference/ec2/describ
  - 2. https://docs.aws.amazon.com/AWSEC2/latest/WindowsGuide/AMIs.html
  page_start: 18
  audit_raw: 'Perform the following to determine what AMI''s are created:

    From the Console:

    1. Login to the EC2 console at https://console.aws.amazon.com/ec2/.

    2. In the left pane, under Images, click AMIs.

    3. Review the list of AMIs.

    4. Confirm that the AMI Name matches the organizational image naming policy.

    From the Command Line:

    1. Run aws ec2 describe-images.

    aws ec2 describe-images --owner self --region us-west-2

    2. Review the list of AMIs.

    3. Confirm that the AMI Name matches the organizational image naming policy.

    If any of the AMI Name''s do not match the Organization policy refer to the remediation

    below.'
  remediation: "If the AMI Name for an AMI doesn't follow Organization policy\nPerform the following to copy and rename the\
    \ AMI:\nFrom the Console:\n1. Login to the EC2 console at https://console.aws.amazon.com/ec2/.\n2. In the left pane click\
    \ Images, click AMIs.\n3. Select the AMI that does not comply to the naming policy.\n4. Click on Actions.\n5. Click on\
    \ Copy AMI.\n Destination region - Select the region the AMI is in.\n Name - `Enter the new Name`\n Description - `Enter\
    \ the new description`\n Encryption - `Select` if it matches your image policy\n6. Click on Copy AMI\nOnce the AMI has\
    \ finished copying.\n7. Select the AMI that does not comply to the naming policy.\n8. Click on Actions.\n9. Click on Deregister"
  checks:
  - type: manual_review
    info: 'Perform the following to determine what AMI''s are created:

      From the Console:

      1. Login to the EC2 console at https://console.aws.amazon.com/ec2/.

      2. In the left pane, under Images, click AMIs.

      3. Review the list of AMIs.

      4. Confirm that the AMI Name matches the organizational image naming policy.

      From the Command Line:

      1. Run aws ec2 describe-images.

      aws ec2 describe-images --owner self --region us-west-2

      2. Review the list of AMIs.

      3. Confirm that the AMI Name matches the organizational image na'
    severity: medium
- id: 2.1.2
  title: Ensure Images (AMI's) are encrypted
  scoring: manual
  profile:
  - Level 1
  description: Amazon Machine Images should utilize EBS Encrypted snapshots
  rationale: AMIs backed by EBS snapshots should use EBS encryption. Snapshot volumes can be encrypted and attached to an
    AMI.
  impact: ''
  references:
  - 1. https://aws.amazon.com/premiumsupport/knowledge-center/view-ami-snapshotencryption-details/
  - 2. https://docs.aws.amazon.com/AWSEC2/latest/WindowsGuide/AMIEncryption.ht
  page_start: 20
  audit_raw: 'Perform the following to determine AMIs are encrypted:

    From the Console:

    1. Login to the IAM console at https://console.aws.amazon.com/ec2/.

    2. In the left pane click Instances, click AMIs.

    3. In the Details tab.

    4. Review the ''Block Devices''

    5. Confirm that it ends with encrypted.

    If it doesn''t end with encrypted, refer to the remediation below.

    From the Command Line:

    1. Run the aws ec2 describe-images command

    aws ec2 describe-images --region us-east-1 --owner self --filter "Name=blockdevice-mapping.encrypted,Values=false" --query
    "Images[*].[ImageId]"

    2. If this produces a list of AMI''s make note as these are not encrypted, then refer to

    the remediation below.'
  remediation: "Perform the following to encrypt AMI EBS Snapshots:\nFrom the Console:\n1. Login to the EC2 console at https://console.aws.amazon.com/ec2/.\n\
    2. In the left pane click on AMIs.\n3. Select the AMI that does not comply to the encryption policy.\n4. Click on Actions.\n\
    5. Click on Copy AMI.\n Destination region - `Select the region the AMI is in`.\n Name - `Enter the new Name`\n Description\
    \ - `Enter the new description`\n Encryption - `Select` Encrypt target EBS snapshots\n6. Click on Copy AMI\nOnce the AMI\
    \ has finished copying.\n7. Select the AMI that does not have encrypted EBS snapshots.\n8. Click on Actions.\n9. Click\
    \ on Deregister"
  checks:
  - type: manual_review
    info: 'Perform the following to determine AMIs are encrypted:

      From the Console:

      1. Login to the IAM console at https://console.aws.amazon.com/ec2/.

      2. In the left pane click Instances, click AMIs.

      3. In the Details tab.

      4. Review the ''Block Devices''

      5. Confirm that it ends with encrypted.

      If it doesn''t end with encrypted, refer to the remediation below.

      From the Command Line:

      1. Run the aws ec2 describe-images command

      aws ec2 describe-images --region us-east-1 --owner self --filter "Name=blockdevice-ma'
    severity: medium
- id: 2.1.3
  title: Ensure Only Approved AMIs (Images) are Used
  scoring: manual
  profile:
  - Level 1
  description: Ensure that all base AMIs utilized are approved for use by your organization.
  rationale: An approved AMI is a base EC2 machine image that is a pre-configured OS configured to run your application. Using
    approved AMIs helps enforce consistency and security.
  impact: ''
  references: []
  page_start: 22
  audit_raw: "Perform the following to confirm only approved AMIs are being used.\nFrom the Console:\n1. Login to the EC2\
    \ console at https://console.aws.amazon.com/ec2/.\n2. In the left pane click on Images.\n3. Then choose AMIs\n4. Confirm\
    \ that Owned by me is selected\n5. Review the list of AMIs.\n6. Confirm that the AMIs listed are all approved for use\n\
    7. In the left pane click on Instances\n8. Then choose Instances\n9. Select the EC2 instance for review.\n10. In the Details\
    \ tab review:\n AMI Name\n AMI location\n11. Confirm that the AMI name matches an approved AMI and the AMI location is\n\
    within your account.\n12. Repeat steps 9 – 11 to verify the AMI is approved\nRepeat the process for all other regions.\n\
    If any of the AMIs are not approved refer to the remediation below."
  remediation: "Perform the following to remove unauthorized AMIs.\nFrom the Console:\n1. Login to the EC2 console at https://console.aws.amazon.com/ec2/.\n\
    2. In the left pane click on Images.\n3. Then choose AMIs\n4. Confirm that Owned by me is selected\n5. Review the list\
    \ of AMIs.\n6. Confirm that the AMIs listed are all approved for use\n7. If an AMI is listed that is not approved select\
    \ it.\n8. Click on Actions and choose Deregister\nAfter all unauthorized AMIs have been De-registered review all EC2 instances.\n\
    1. Click on Instances\n2. Then choose Instances\n3. Select the EC2 instance for review.\n4. In the Details tab review:\n\
