    \ instances Box for the Auto Scaling Group.\n6. Click Update.\n7. Repeat Steps 1-6 for each AWS Region used.\nAWS CLI\n\
    1. Run aws autoscaling create-or-update-tags for tags that are not set to\nPropogateAtLaunch for each Auto Scaling Group\
    \ that does not have this property\nset to true.\naws autoscaling create-or-update-tags \\\n --tags ResourceId=example-autoscaling-group,ResourceType=auto-scalinggroup,Key=TagKey,Value=TagValue,PropagateAtLaunch=true\n\
    2. Repeat Step 1 for each AWS Region used."
