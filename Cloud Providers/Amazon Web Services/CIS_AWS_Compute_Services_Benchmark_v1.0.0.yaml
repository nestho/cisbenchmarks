  description: To protect your data disable the public mode of EBS snapshots.
  rationale: This protects your data so that it is not accessible to all AWS accounts preventing accidental access and leaks.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/EBSSnapshots.html
  - 2. https://awscli.amazonaws.com/v2/documentation/api/latest/reference/ec2/describ
  page_start: 31
  audit_raw: "Perform the following to determine if a snapshot is shared publicly:\nFrom the Console\n1. Login to the EC2\
    \ console at https://console.aws.amazon.com/ec2/.\n2. In the left pane click Snapshots.\n3. Select the snapshot then click\
    \ Actions, Modify Permissions.\n4. Confirm that the snapshot is set to Private\n5. Repeat for any additional Snapshots,\
    \ Regions and AWS accounts.\nIf the snapshot is set to public refer to the remediation below.\nFrom the CLI\n1. For each\
    \ snapshot, run\naws ec2 describe-snapshot-attribute \\\n --snapshot-id <snapshot-ID> \\\n --attribute createVolumePermission\n\
    2. Validate UserId is not set to all."
  remediation: 'Perform the following to set a snapshot to private:

    From the Console

    1. Login to the EC2 console at https://console.aws.amazon.com/ec2/.

    2. In the left pane click Snapshots.

    3. Select the snapshot then click ''Actions, Modify Permissions`.

    4. Click the radio button for Private

    5. Click Save

    6. Repeat for any additional Snapshots, Regions and AWS accounts.'
