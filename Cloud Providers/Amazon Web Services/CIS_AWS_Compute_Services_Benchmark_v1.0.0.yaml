- id: '3.3'
  title: Disable SSH and RDP ports for Lightsail instances when not needed.
  scoring: manual
  profile:
  - Level 1
  description: Any ports enable within Lightsail by default are open and exposed to the world. For SSH and RDP access you
    should remove and disable these ports when not is use.
  rationale: Any ports enable within Lightsail by default are open and exposed to the world. This can result in outside traffic
    trying to access or even deny access to the Lightsail instances. Removing and disabling a protocol when not in use even
    if restricted by IP address is the safest solution especially when it is not required for access.
  impact: ''
  references:
  - 1. https://awscli.amazonaws.com/v2/documentation/api/latest/reference/lightsail/ind
  page_start: 72
  audit_raw: "From the Console:\n1. Login to AWS Console using https://console.aws.amazon.com\n2. Click All services, click\
    \ Lightsail under Compute.\n3. This will open up the Lightsail console.\n4. Select the Windows or Linux Instance you want\
    \ to review.\n5. Go to the Networking section.\n6. If it is a Windows instance confirm that SSH has been removed. If it\
    \ is a Linux\ninstance confirm RDP has been removed.\n7. If either still exists in the IPV4 Firewall list refer to the\
    \ remediation below.\n8. If the server needs HTTP, TCP Port 80 confirm that the application forwards Port\n80 to HTTPS,\
    \ TCP Port 443.\n9. If the server does not need HTTP refer to the remediation below.\n10. Confirm that there are no other\
    \ unused or unneeded ports.\n11. If the system has other ports that are not required or in use refer to the\nremediation\
    \ below.\nFrom the Command Line:\n1. Run aws lightsail get-instances\naws lightsail get-instances --query \"instances[*].name\"\
    \nThis command will provide a list of Instance names.\n\"WordPress-1\",\n\"Windows_Server_2019-1\"\n2. Run aws lightsail\
    \ get-instance-port-states for each instance listed above\naws lightsail get-instance-port-states --instance-name <instance_name>\n\
    This command will provide a list of available Ports for the Instance name.\n\"portStates\": [\n {\n \"fromPort\": 80,\n\
    \ \"toPort\": 80,\n \"protocol\": \"tcp\",\n \"state\": \"open\",\n \"cidrs\": [\n \"0.0.0.0/0\"\n ],\n \"cidrListAliases\"\
    : []\n },\n {\n \"fromPort\": 22,\n \"toPort\": 22,\n \"protocol\": \"tcp\",\n \"state\": \"open\",\n \"cidrs\": [\n \"\
    0.0.0.0/0\"\n ],\n \"cidrListAliases\": []\n },\n {\n \"fromPort\": 443,\n \"toPort\": 443,\n \"protocol\": \"tcp\",\n\
    \ \"state\": \"open\",\n \"cidrs\": [\n \"0.0.0.0/0\"\n ],\n \"cidrListAliases\": []\nIf it is a Linux host and has Port\
    \ 3398 listed, HTTP Port 80 listed or any other ports\nlisted that are not required refer to the remediation below.\n\
    If it is a Windows host and has Port 22 listed, HTTP Port 80 listed or any other ports\nlisted that are not required refer\
    \ to the remediation below."
  remediation: 'From the Console:

    1. Login to AWS Console using https://console.aws.amazon.com

    2. Click All services, click Lightsail under Compute.

    3. This will open up the Lightsail console.

    4. Select the Windows or Linux Instance you want to review.

    5. Go to the Networking section.

    6. If it is a Windows instance confirm that SSH has been removed. If it is a Linux

    instance confirm RDP has been removed.

    7. If either ssh(Port 22) is in the Windows system and RDP(Port 3389) is in the

    Linux system click the bucket icon to delete it.

    8. If the server needs HTTP, TCP Port 80 confirm that the application forwards Port

    80 to HTTPS, TCP Port 443.

    9. If the server does not need HTTP click the bucket icon to delete it.

    10. Confirm that there are no other unused or unneeded ports.

    11. If the system has other ports that are not required or in use click the bucket icon

    to delete it.

    From the Command Line:

    1. Run aws lightsail close-instance-public-ports

    For Windows:

    aws lightsail close-instance-public-ports --instance-name

    <Windows_Instance_Name> --port-info fromPort=22,protocol=TCP,toPort=22

    For Linux:

    aws lightsail close-instance-public-ports --instance-name

    <Linux_Instance_Name> --port-info fromPort=3389,protocol=TCP,toPort=3389

    For HTTP:

    aws lightsail close-instance-public-ports --instance-name <ANY_Instance_Name>

    --port-info fromPort=80,protocol=TCP,toPort=80

    2. Repeat for all instance names identified in the audit that have SSH, RDP or

    HTTP''s open and are not required based on the OS or the use of the system.'
  checks:
  - type: manual_review
    info: 'From the Console:

      1. Login to AWS Console using https://console.aws.amazon.com

      2. Click All services, click Lightsail under Compute.

      3. This will open up the Lightsail console.

      4. Select the Windows or Linux Instance you want to review.

      5. Go to the Networking section.

      6. If it is a Windows instance confirm that SSH has been removed. If it is a Linux

      instance confirm RDP has been removed.

      7. If either still exists in the IPV4 Firewall list refer to the remediation below.

      8. If the server needs H'
    severity: medium
