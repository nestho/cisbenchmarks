    console at https://console.aws.amazon.com/billing/home#/.

    2. On the navigation pane, choose Preferences.

    3. Verify whether the “Receive Billing Reports” check box is ticked. If it is not, billing

    reports are not being generated.'
  remediation: "44 | P a g e\nThere is currently no AWS CLI support for this operation, so it is necessary to use the\nManagement\
    \ Console.\nAs a user with IAM permission to read and write billing information (aws-portal:*Billing):\n Sign in to the\
    \ AWS Management Console and open the Billing and Cost Management\nconsole at https://console.aws.amazon.com/billing/home#/.\n\
     On the navigation pane, choose Preferences.\n Select the Receive Billing Reports check box.\n Designate the Amazon\
    \ S3 bucket <S3_billing_bucket> where you want AWS to\npublish your detailed billing reports.\n Ensure that policy allows\
    \ read access only to appropriate groups of users (finance,\nauditors, etc). For appropriate groups in IAM who you want\
    \ to have read access,\ninclude the following policy element:\n \"Statement\":[\n {\n \"Effect\":\"Allow\",\n \"Action\"\
    :[\n \"s3:GetObject\",\n \"s3:GetObjectVersion”,\n “s3:GetBucketLocation\"\n ],\n \"Resource\":\"arn:aws:s3:::<S3_billing_bucket>/*\"\
    \n }\n ]\n After your S3 bucket has been verified, under Report, select the check boxes for the\nreports that you want\
    \ to receive.\n Choose Save preferences\n Detailed billing reports can take up to 24 hours to start being generated.\
    \ Wait >24\nhours, and examine your designated S3 bucket to verify that files with names of the\nform (eg) <AWS account\
    \ number>-<aws-billing-detailed-line-items-with-resourcesand-tags-yyyy-mm>.csv.zip are being generated.\n45 | P a g e"
  checks:
  - type: manual_review
    info: 'There is currently no AWS CLI support for this operation, so it is necessary to use the

