controls:
- id: '1.1'
  title: Avoid the use of the "root" account
  scoring: scored
  profile:
  - Level 1
  description: The "root" account has unrestricted access to all resources in the AWS account. It is highly recommended that
    the use of this account be avoided.
  rationale: The "root" account is the most privileged AWS account. Minimizing the use of this account and adopting the principle
    of least privilege for access management will reduce the risk of accidental changes and unintended disclosure of highly
    privileged credentials.
  impact: ''
  references:
  - 1. http://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  - '2. CIS CSC v6.0 #5.1'
  page_start: 11
  audit_raw: 'Implement the Ensure a log metric filter and alarm exist for usage of "root"

    account recommendation in the Monitoring section of this benchmark to receive

    notifications of root account usage. Additionally, executing the following commands will

    provide ad-hoc means for determining the last time the root account was used:

    aws iam generate-credential-report

    aws iam get-credential-report --query ''Content'' --output text | base64 -d | cut -d, -

    f1,5,11,16 | grep -B1 ''<root_account>''

    Note: there are a few conditions under which the use of the root account is required, such

    as requesting a penetration test or creating a CloudFront private key.'
  remediation: 'Follow the remediation instructions of the Ensure IAM policies are attached only to

    groups or roles recommendation'
  checks:
  - type: command
    command: f1,5,11,16 | grep -B1 '<root_account>'
    expected: ''
    severity: medium
    info: 'Implement the Ensure a log metric filter and alarm exist for usage of "root"

      account recommendation in the Monitoring section of this benchmark to receive

      notifications of root account usage. Additionally, executing the following commands will

      provide ad-hoc means for determining the last time the root account was used:

      aws iam generate-credential-report

      aws iam get-credential-report --query ''Cont'
- id: '1.2'
  title: Ensure multi-factor authentication (MFA) is enabled for all IAM users that have a console password
  scoring: scored
  profile:
  - Level 1
  description: Multi-Factor Authentication (MFA) adds an extra layer of protection on top of a user name and password. With
    MFA enabled, when a user signs in to an AWS website, they will be prompted for their user name and password as well as
    for an authentication code from their AWS MFA device. It is recommended that MFA be enabled for all accounts that have
    a console password.
  rationale: Enabling MFA provides increased security for console access as it requires the authenticating principal to possess
    a device that emits a time-sensitive key and have knowledge of a credential.
  impact: ''
  references:
  - 1. http://tools.ietf.org/html/rfc6238
  - 2. http://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa.html
  page_start: 13
  audit_raw: 'Perform the following to determine if a MFA device is enabled for all IAM users having a

    console password:

    Via Management Console

    1. Open the IAM console at https://console.aws.amazon.com/iam/.

    2. In the left pane, select Users

    3. If the MFA Device or Password columns are not visible in the table, click the gear

    icon at the upper right corner of the table and ensure a checkmark is next to both,

    then click Close.

    4. Ensure each user having a checkmark in the Password column also has a value in the

    MFA Device column.

    Via the CLI

    1. Run the following command (OSX/Linux/UNIX) to generate a list of all IAM users

    along with their password and MFA status:

    aws iam generate-credential-report

    aws iam get-credential-report --query ''Content'' --output text | base64 -d | cut

    -d, -f1,4,8

    13 | P a g e

    2. The output of this command will produce a table similar to the following:

    user,password_enabled,mfa_active

    elise,false,false

    brandon,true,true

    rakesh,false,false

    helene,false,false

    paras,true,true

    anitha,false,false

    3. For any column having password_enabled set to true, ensure mfa_active is also set

    to true.'
  remediation: 'Perform the following to enable MFA:

    1. Sign in to the AWS Management Console and open the IAM console at

    https://console.aws.amazon.com/iam/.

    2. In the navigation pane, choose Users.

    3. In the User Name list, choose the name of the intended MFA user.

    4. Choose the Security Credentials tab, and then choose Manage MFA Device.

    5. In the Manage MFA Device wizard, choose A virtual MFA device, and then choose

    Next Step.

    IAM generates and displays configuration information for the virtual MFA device,

    including a QR code graphic. The graphic is a representation of the ''secret

    configuration key'' that is available for manual entry on devices that do not support

    QR codes.

    6. Open your virtual MFA application. (For a list of apps that you can use for hosting

    virtual MFA devices, see Virtual MFA Applications.) If the virtual MFA application

    supports multiple accounts (multiple virtual MFA devices), choose the option to

    create a new account (a new virtual MFA device).

    7. Determine whether the MFA app supports QR codes, and then do one of the

    following:

    o Use the app to scan the QR code. For example, you might choose the camera

    icon or choose an option similar to Scan code, and then use the device''s

    camera to scan the code.

    o In the Manage MFA Device wizard, choose Show secret key for manual

    configuration, and then type the secret configuration key into your MFA

    application.

    When you are finished, the virtual MFA device starts generating one-time

    passwords.

    14 | P a g e

    8. In the Manage MFA Device wizard, in the Authentication Code 1 box, type the onetime password that currently appears
    in the virtual MFA device. Wait up to 30

    seconds for the device to generate a new one-time password. Then type the second

    one-time password into the Authentication Code 2 box. Choose Active Virtual MFA.

    Forced IAM User Self-Service Remediation

    Amazon has published a pattern that forces users to self-service setup MFA before they

    have access to their complete permissions set. Until they complete this step, they

    cannot access their full permissions. This pattern can be used on new AWS

    accounts. It can also be used on existing accounts - it is recommended users are given

    instructions and a grace period to accomplish MFA enrollment before active

    enforcement on existing AWS accounts.

    How to Delegate Management of Multi-Factor Authentication to AWS IAM Users'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if a MFA device is enabled for all IAM users having a

      console password:

      Via Management Console

      1. Open the IAM console at https://console.aws.amazon.com/iam/.

      2. In the left pane, select Users

      3. If the MFA Device or Password columns are not visible in the table, click the gear

      icon at the upper right corner of the table and ensure a checkmark is next to both,

      then click Close.

      4. Ensure each user having a checkmark in the Password column also has a value in th'
    severity: medium
- id: '1.3'
  title: Ensure credentials unused for 90 days or greater are disabled
  scoring: scored
  profile:
  - Level 1
  description: AWS IAM users can access AWS resources using different types of credentials, such as passwords or access keys.
    It is recommended that all credentials that have been unused in 90 or greater days be removed or deactivated.
  rationale: Disabling or removing unnecessary credentials will reduce the window of opportunity for credentials associated
    with a compromised or abandoned account to be used.
  impact: ''
  references:
  - 1. CCE-78900-8
  - '2. CIS CSC v6.0 #16.6'
  page_start: 16
  audit_raw: 'Perform the following to determine if unused credentials exist:

    1. Login to the AWS Management Console

    2. Click Services

    3. Click IAM

    4. Click on Credential Report

    5. This will download an .xls file which contains credential usage for all users within

    an AWS Account - open this file

    6. For each user having password_enabled set to TRUE, ensure password_last_used is

    less than 90 days ago.

    7. For each user having access_key_1_active or access_key_2_active to TRUE,

    ensure the corresponding access_key_n_last_used_date is less than 90 days ago.

    Via CLI

    1. Run the following commands:

    aws iam generate-credential-report

    aws iam get-credential-report --query ''Content'' --output text | base64 -d | cut

    -d, -f1,9,10,11,14,15,16

    2. For each user having password_enabled set to TRUE,

    ensure password_last_used_date is less than 90 days ago.

    3. For each user having an access_key_1_active or access_key_2_active to TRUE,

    ensure the corresponding access_key_n_last_used_date is less than 90 days ago.

    16 | P a g e'
  remediation: 'Perform the following to remove or deactivate credentials:

    1. Login to the AWS Management Console:

    2. Click Services

    3. Click IAM

    4. Click on Users

    5. Click on Security Credentials

    6. As an Administrator

    o Click on Make Inactive for credentials that have not been used in 90 Days

    7. As an IAM User

    o Click on Make Inactive or Delete for credentials which have not been used

    in 90 Days'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if unused credentials exist:

      1. Login to the AWS Management Console

      2. Click Services

      3. Click IAM

      4. Click on Credential Report

      5. This will download an .xls file which contains credential usage for all users within

      an AWS Account - open this file

      6. For each user having password_enabled set to TRUE, ensure password_last_used is

      less than 90 days ago.

      7. For each user having access_key_1_active or access_key_2_active to TRUE,

      ensure the corresponding access_ke'
    severity: medium
- id: '1.4'
  title: Ensure access keys are rotated every 90 days or less
  scoring: scored
  profile:
  - Level 1
  description: Access keys consist of an access key ID and secret access key, which are used to sign programmatic requests
    that you make to AWS. AWS users need their own access keys to make programmatic calls to AWS from the AWS Command Line
    Interface (AWS CLI), Tools for Windows PowerShell, the AWS SDKs, or direct HTTP calls using the APIs for individual AWS
    services. It is recommended that all access keys be regularly rotated.
  rationale: Rotating access keys will reduce the window of opportunity for an access key that is associated with a compromised
    or terminated account to be used. Access keys should be rotated to ensure that data cannot be accessed with an old key
    which might have been lost, cracked, or stolen.
  impact: ''
  references:
  - 1. CCE-78902-4
  page_start: 18
  audit_raw: 'Perform the following to determine if access keys are rotated as prescribed:

    1. Login to the AWS Management Console

    2. Click Services

    3. Click IAM

    4. Click on Credential Report

    5. This will download an .xls file which contains Access Key usage for all IAM users

    within an AWS Account - open this file

    6. Focus on the following columns (where x = 1 or 2)

    o access_key_X_active

    o access_key_X_last_rotated

    o access_key_X_last_used_date

    7. Ensure all active keys have been rotated within 90 days

    8. Ensure all active keys have been used since last rotation

    o Keys not in-use since last rotation should be disabled/deleted

    Via CLI

    aws iam generate-credential-report

    aws iam get-credential-report --query ''Content'' --output text | base64 -d

    18 | P a g e'
  remediation: 'Perform the following to rotate access keys:

    1. Login to the AWS Management Console:

    2. Click Services

    3. Click IAM

    4. Click on Users

    5. Click on Security Credentials

    6. As an Administrator

    o Click on Make Inactive for keys that have not been rotated in 90 Days

    7. As an IAM User

    o Click on Make Inactive or Delete for keys which have not been rotated or

    used in 90 Days

    8. Click on Create Access Key

    9. Update programmatic call with new Access Key credentials

    Via CLI

    aws iam update-access-key

    aws iam create-access-key

    aws iam delete-access-key'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if access keys are rotated as prescribed:

      1. Login to the AWS Management Console

      2. Click Services

      3. Click IAM

      4. Click on Credential Report

      5. This will download an .xls file which contains Access Key usage for all IAM users

      within an AWS Account - open this file

      6. Focus on the following columns (where x = 1 or 2)

      o access_key_X_active

      o access_key_X_last_rotated

      o access_key_X_last_used_date

      7. Ensure all active keys have been rotated within 90 days

      8. Ensu'
    severity: medium
- id: '1.5'
  title: Ensure IAM password policy requires at least one uppercase letter
  scoring: scored
  profile:
  - Level 1
  description: Password policies are, in part, used to enforce password complexity requirements. IAM password policies can
    be used to ensure password are comprised of different character sets. It is recommended that the password policy require
    at least one uppercase letter.
  rationale: Setting a password complexity policy increases account resiliency against brute force login attempts.
  impact: ''
  references:
  - 1. CCE-78903-2
  page_start: 20
  audit_raw: 'Perform the following to ensure the password policy is configured as prescribed:

    Via AWS Console

    1. Login to AWS Console (with appropriate permissions to View Identity Access

    Management Account Settings)

    2. Go to IAM Service on the AWS Console

    3. Click on Account Settings on the Left Pane

    4. Ensure "Requires at least one uppercase letter" is checked under "Password Policy"

    Via CLI

    aws iam get-account-password-policy

    Ensure the output of the above command includes "RequireUppercaseCharacters": true'
  remediation: "Perform the following to set the password policy as prescribed:\nVia AWS Console\n1. Login to AWS Console\
    \ (with appropriate permissions to View Identity Access\nManagement Account Settings)\n2. Go to IAM Service on the AWS\
    \ Console\n20 | P a g e\n3. Click on Account Settings on the Left Pane\n4. Check \"Requires at least one uppercase letter\"\
    \n5. Click \"Apply password policy\"\nVia CLI\n aws iam update-account-password-policy --require-uppercase-characters\n\
    Note: All commands starting with \"aws iam update-account-password-policy\" can be\ncombined into a single command."
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the password policy is configured as prescribed:

      Via AWS Console

      1. Login to AWS Console (with appropriate permissions to View Identity Access

      Management Account Settings)

      2. Go to IAM Service on the AWS Console

      3. Click on Account Settings on the Left Pane

      4. Ensure "Requires at least one uppercase letter" is checked under "Password Policy"

      Via CLI

      aws iam get-account-password-policy

      Ensure the output of the above command includes "RequireUppercaseCharacters": tr'
    severity: medium
