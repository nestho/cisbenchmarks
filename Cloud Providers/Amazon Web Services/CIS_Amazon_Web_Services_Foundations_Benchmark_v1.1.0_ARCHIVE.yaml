- id: '2.4'
  title: Ensure CloudTrail trails are integrated with CloudWatch Logs
  scoring: scored
  profile:
  - Level 1
  description: 'AWS CloudTrail is a web service that records AWS API calls made in a given AWS account. The recorded information
    includes the identity of the API caller, the time of the API call, the source IP address of the API caller, the request
    parameters, and the response elements returned by the AWS service. CloudTrail uses Amazon S3 for log file storage and
    delivery, so log files are stored durably. In addition to capturing CloudTrail logs within a specified S3 bucket for long
    term analysis, realtime analysis can be performed by configuring CloudTrail to send logs to CloudWatch Logs. For a trail
    that is enabled in all regions in an account, CloudTrail sends log files from all those regions to a CloudWatch Logs log
    group. It is recommended that CloudTrail logs be sent to CloudWatch Logs. Note: The intent of this recommendation is to
    ensure AWS account activity is being captured, monitored, and appropriately alarmed on. CloudWatch Logs is a native way
    to accomplish this using AWS services but does not preclude the use of an alternate solution.'
  rationale: Sending CloudTrail logs to CloudWatch Logs will facilitate real-time and historic activity logging based on user,
    API, resource, and IP address, and provides opportunity to establish alarms and notifications for anomalous or sensitivity
    account activity.
  impact: 'Note: By default, CloudWatch Logs will store Logs indefinitely unless a specific retention period is defined for
    the log group. When choosing the number of days to retain, keep in mind the average days it takes an organization to realize
    they have been breached is 210 days (at the time of this writing). Since additional time is required to research a breach,
    a 78 | P a g e minimum 365 day retention policy allows time for detection and research. You may also wish to archive the
    logs to a cheaper storage service rather than simply deleting them. See the following AWS resource to manage CloudWatch
    Logs retention periods: 1. http://docs.aws.amazon.com/AmazonCloudWatch/latest/DeveloperGuide/SettingL ogRetention.html'
  references:
  - 1. https://aws.amazon.com/cloudtrail/
  - 2. CCE-78916-4
  page_start: 77
