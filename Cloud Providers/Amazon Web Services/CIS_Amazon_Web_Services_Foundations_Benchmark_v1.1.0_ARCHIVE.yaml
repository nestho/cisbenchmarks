  title: Ensure appropriate subscribers to each SNS topic
  scoring: scored
  profile:
  - Level 1
  description: AWS Simple Notification Service (SNS) is a web service that can publish messages from an application and immediately
    deliver them to subscribers or other applications. Subscribers are clients interested in receiving notifications from
    topics of interest; they can subscribe to a topic or be subscribed by the topic owner. When publishers have information
    or updates to notify their subscribers about, they can publish a message to the topic – which immediately triggers Amazon
    SNS to deliver the message to all applicable subscribers. It is recommended that the list of subscribers to given topics
    be periodically reviewed for appropriateness.
