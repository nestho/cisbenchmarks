- id: '1.16'
  title: Ensure IAM policies are attached only to groups or roles
  scoring: scored
  profile:
  - Level 1
  description: By default, IAM users, groups, and roles have no access to AWS resources. IAM policies are the means by which
    privileges are granted to users, groups, or roles. It is recommended that IAM policies be applied directly to groups and
    roles but not users.
  rationale: Assigning privileges at the group or role level reduces the complexity of access management as the number of
    users grow. Reducing access management complexity may in-turn reduce opportunity for a principal to inadvertently receive
    or retain excessive privileges.
  impact: ''
  references:
  - 1. http://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  - 2. http://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_managed-vsinline.html
