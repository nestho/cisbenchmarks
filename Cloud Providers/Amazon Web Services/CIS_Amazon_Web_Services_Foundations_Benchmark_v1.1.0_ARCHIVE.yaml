    : {\n \"AWS\": \"<iam_user>\"\n },\n \"Action\": \"sts:AssumeRole\"\n }\n ]\n}\n65 | P a g e\n\no Create the IAM role\
    \ using the above trust policy:\no aws iam create-role --role-name <aws_support_iam_role> --assume-rolepolicy-document\
    \ file:///tmp/TrustPolicy.json\n\no Attach 'AWSSupportAccess' managed policy to the created IAM role:\no aws iam attach-role-policy\
    \ --policy-arn <iam_policy_arn> --role-name\n<aws_support_iam_role>"
