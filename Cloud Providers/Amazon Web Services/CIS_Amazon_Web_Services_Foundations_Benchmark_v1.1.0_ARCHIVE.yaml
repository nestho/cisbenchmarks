- id: '1.17'
  title: Enable detailed billing
  scoring: scored
  profile:
  - Level 1
  description: Enable Detailed Billing to cause the generation of a log record for every event or hourly ongoing activity
    which incurs cost in an AWS account. These records are aggregated into CSV files of hourly records, and written to an
    S3 bucket. A CSV (Comma Separated Values) file of billing records is written at least every 24 hours; writing of files
    is often more frequent.
  rationale: Detailed Billing records can be used as an overview of AWS activity across the whole of an account, in addition
    to per-Region CloudTrail, Config and other service-specific JSON-based logs. Billing records can be graphed over time
    using the Cost Explorer tool, and budgeting alerts can be configured on billing records and pushed to SNS in the event
    of spend over time, or predicted spend at current rate, going above a customer-set threshold - this can be used as a simple
    means of detecting anomalous utilisation of AWS resources and thereby triggering investigation activities. Billing records
    can also be broken out by tag, which can serve as a starting point in identifying which part of the environment, or organisation,
    the anomalous activity is occurring in.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/billing-whatis.html
  - 2. https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/billingpermissions-ref.html#billing-example-policies
  page_start: 44
  audit_raw: 'There is currently no AWS CLI support for this operation, so it is necessary to use the

    Management Console.

    As a user with IAM permission to read billing information (aws-portal:ViewBilling):

