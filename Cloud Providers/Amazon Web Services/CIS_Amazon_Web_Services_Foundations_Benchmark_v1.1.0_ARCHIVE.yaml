  title: Ensure a log metric filter and alarm exist for unauthorized API calls
  scoring: scored
  profile:
  - Level 1
  description: Real-time monitoring of API calls can be achieved by directing CloudTrail Logs to CloudWatch Logs and establishing
    corresponding metric filters and alarms. It is recommended that a metric filter and alarm be established for unauthorized
    API calls.
  rationale: Monitoring unauthorized API calls will help reveal application errors and may reduce time to detect malicious
    activity.
  impact: This alert may be triggered by normal read-only console activities that attempt to opportunistically gather optional
    information, but gracefully fail if they don't have permissions. If an excessive number of alerts are being generated
    then an organization may wish to consider adding read access to the limited IAM user permissions simply to quiet the alerts.
    In some cases doing this may allow the users to actually view some areas of the system - any additional access given should
    be reviewed for alignment with the original limited IAM user intent.
  references:
  - 1. https://aws.amazon.com/sns/
  - 2. CCE-79186-3
  page_start: 88
  audit_raw: 'Perform the following to determine if the account is configured as prescribed:

    1. Identify the log group name configured for use with CloudTrail:

    aws cloudtrail describe-trails

    2. Note the <cloudtrail_log_group_name> value associated with

    CloudWatchLogsLogGroupArn:

    "arn:aws:logs:eu-west-1:<aws_account_number>:log-group:<cloudtrail_log_group_name>:*"

    3. Get a list of all associated metric filters for this <cloudtrail_log_group_name>:

    aws logs describe-metric-filters --log-group-name "<cloudtrail_log_group_name>"

    4. Ensure the output from the above command contains the following:

    88 | P a g e

    "filterPattern": "{ ($.errorCode = \"*UnauthorizedOperation\") || ($.errorCode =

    \"AccessDenied*\") }"

    5. Note the <unauthorized_api_calls_metric> value associated with the filterPattern

    found in step 4.

    6. Get a list of CloudWatch alarms and filter on the <unauthorized_api_calls_metric>

    captured in step 5.

