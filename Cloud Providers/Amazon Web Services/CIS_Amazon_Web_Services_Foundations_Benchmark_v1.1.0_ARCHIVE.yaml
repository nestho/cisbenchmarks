- id: '1.24'
  title: Ensure IAM policies that allow full "*:*" administrative privileges are not created
  scoring: scored
  profile:
  - Level 1
  description: IAM policies are the means by which privileges are granted to users, groups, or roles. It is recommended and
    considered a standard security advice to grant least privilege—that is, granting only the permissions required to perform
    a task. Determine what users need to do and then craft policies for them that let the users perform only those tasks,
    instead of allowing full administrative privileges.
  rationale: 'It''s more secure to start with a minimum set of permissions and grant additional permissions as necessary,
    rather than starting with permissions that are too lenient and then trying to tighten them later. Providing full administrative
    privileges instead of restricting to the minimum set of permissions that the user is required to do exposes the resources
    to potentially unwanted actions. IAM policies that have a statement with "Effect": "Allow" with "Action": "*" over "Resource":
    "*" should be removed.'
  impact: ''
  references:
  - 1. http://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  - 2. http://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_managed-vsinline.html
  page_start: 69
  audit_raw: 'Perform the following to determine what policies are created:

    1. Run the following to get a list of IAM policies:

    aws iam list-policies --output text

    2. For each policy returned, run the following command to determine if any policies is

    allowing full administrative privileges on the account:

    aws iam get-policy-version --policy-arn <policy_arn> --version <policy_version>

    --query "PolicyVersion.Document.Statement[?Effect == ''Allow'' &&

    contains(Resource, ''*'') && contains (Action, ''*'')]"

    3. If the output of the command returns any policies, it''s not compliant.

    69 | P a g e'
  remediation: 'Using the GUI, perform the following to detach the policy that has full administrative

    privileges:

    1. Sign in to the AWS Management Console and open the IAM console at

    https://console.aws.amazon.com/iam/.

    2. In the navigation pane, click Policies and then search for the policy name found in

    the audit step.

    3. Select the policy that needs to be deleted.

    4. In the policy action menu, select first Detach

    5. Select all Users, Groups, Roles that have this policy attached

    6. Click Detach Policy

    7. In the policy action menu, select Detach

    Using the CLI, perform the following to detach the policy that has full administrative

    privileges as found in the audit step:

    1. Lists all IAM users, groups, and roles that the specified managed policy is attached to.

    1. aws iam list-entities-for-policy --policy-arn <policy_arn>

    2. Detach the policy from all IAM Users:

    1. aws iam detach-user-policy --user-name <iam_user> --policy-arn <policy_arn>

    3. Detach the policy from all IAM Groups:

    1. aws iam detach-group-policy --group-name <iam_group> --policy-arn <policy_arn>

    4. Detach the policy from all IAM Roles:

    1. aws iam detach-role-policy --role-name <iam_role> --policy-arn <policy_arn>'
