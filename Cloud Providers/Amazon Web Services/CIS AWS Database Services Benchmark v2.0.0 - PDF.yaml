    info: "To check whether delete protection is enabled on your DynamoDB tables, use the\nfollowing command for each table:\n\
      aws dynamodb describe-table --table-name <your-table-name> \\\n --query \"{TableName: Table.TableName, DeleteProtectionEnabled:\n\
      Table.DeletionProtectionEnabled}\" \\\n --output table\n• Replace with your DynamoDB table name.\n• This will return\
