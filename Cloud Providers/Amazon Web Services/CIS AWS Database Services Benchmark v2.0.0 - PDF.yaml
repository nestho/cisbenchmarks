- id: '9.9'
  title: Ensure Neptune Database has automatic backups enabled
  scoring: manual
  profile:
  - Level 1
  description: Ensure that Amazon Neptune DB clusters have automated backups enabled with a nonzero backup retention period
    (for example, 7 to 35 days). Neptune automatically creates continuous, incremental backups of cluster data and retains
    them for the configured retention period, allowing point-in-time recovery to any second within the backup window.
  rationale: Enabling automated backups with a sufficient retention period ensures that Neptune cluster data can be quickly
    recovered to any point within the retention window, protecting against accidental deletions, data corruption, application
    errors, and infrastructure failures. Neptune backups are continuous and incremental, providing robust disaster recovery
    and business continuity capabilities with minimal storage overhead.
  impact: Enabling automated backups for Neptune ensures that cluster data is continuously protected and recoverable to any
    point within the configured retention period (1–35 days), significantly reducing exposure to data loss and enabling rapid
    recovery from operational incidents.
  references: []
  page_start: 237
  audit_raw: "List backup retention status for all Neptune DB clusters:\naws neptune describe-db-clusters \\\n --query\n\"\
    DBClusters[*].{DBClusterIdentifier:DBClusterIdentifier,Engine:Engine,BackupR\netentionPeriod:BackupRetentionPeriod}\"\n\
    • BackupRetentionPeriod > 0 ⇒ Automated backups are enabled (compliant).\n• BackupRetentionPeriod = 0 or missing/null\
    \ ⇒ Automated backups are not\nenabled (non-compliant)."
  remediation: "Enable automated backups on a specific Neptune cluster:\naws neptune modify-db-cluster \\\n --db-cluster-identifier\
    \ <cluster-identifier> \\\n --backup-retention-period 7 \\\n --preferred-backup-window \"03:00-04:00\" \\\n --apply-immediately\n\
    • --backup-retention-period 7 sets a 7-day retention; use a value between 1 and 35\ndays aligned with your policy.\n•\
    \ --preferred-backup-window \"03:00-04:00\" (optional) sets the daily UTC backup\nwindow during off-peak hours to minimize\
    \ performance impact.\n• --apply-immediately applies the change without waiting for the next maintenance\nwindow."
  checks:
  - type: manual_review
    info: "List backup retention status for all Neptune DB clusters:\naws neptune describe-db-clusters \\\n --query\n\"DBClusters[*].{DBClusterIdentifier:DBClusterIdentifier,Engine:Engine,BackupR\n\
      etentionPeriod:BackupRetentionPeriod}\"\n• BackupRetentionPeriod > 0 ⇒ Automated backups are enabled (compliant).\n\
      • BackupRetentionPeriod = 0 or missing/null ⇒ Automated backups are not\nenabled (non-compliant)."
    severity: medium
- id: '9.10'
  title: Ensure Database has delete protection enabled
  scoring: manual
  profile:
  - Level 1
  description: Ensure that delete protection is enabled on database instances to prevent accidental or unauthorized deletion.
    This setting safeguards critical databases by requiring explicit disabling of delete protection before deletion, reducing
    the risk of data loss through human error or malicious activity.
  rationale: Delete protection provides a safeguard against inadvertent or malicious deletion of critical databases. By requiring
    deliberate action to disable deletion protection, organizations mitigate risks associated with accidental data deletion
    and enhance the overall resilience of their data storage platform.
  impact: Failure to enable delete protection increases the risk of irreversible data loss, potential service disruption,
    and operational downtime.
  references: []
  page_start: 239
  audit_raw: "List deletion protection status for all Neptune DB clusters\naws neptune describe-db-clusters \\\n --query\n\
    \"DBClusters[*].{DBClusterIdentifier:DBClusterIdentifier,Engine:Engine,Deletio\nnProtection:DeletionProtection}\"\n• DeletionProtection:\
    \ true ⇒ Deletion protection is enabled (compliant).\n• DeletionProtection: false ⇒ Deletion protection is not enabled\
    \ (non-compliant)."
  remediation: "Enable deletion protection on a specific Neptune cluster:\naws neptune modify-db-cluster \\\n --db-cluster-identifier\
    \ <cluster-identifier> \\\n --deletion-protection \\\n --apply-immediately\n• --deletion-protection enables the deletion\
    \ protection feature.\n• --apply-immediately applies the change without waiting for the next maintenance\nwindow."
  checks:
  - type: manual_review
    info: "List deletion protection status for all Neptune DB clusters\naws neptune describe-db-clusters \\\n --query\n\"\
      DBClusters[*].{DBClusterIdentifier:DBClusterIdentifier,Engine:Engine,Deletio\nnProtection:DeletionProtection}\"\n• DeletionProtection:\
      \ true ⇒ Deletion protection is enabled (compliant).\n• DeletionProtection: false ⇒ Deletion protection is not enabled\
