  title: Ensure Network Security is Enabled
  scoring: manual
  profile:
  - Level 1
  description: Implementing network security for Amazon ElastiCache involves configuring your Virtual Private Cloud (VPC),
    security groups, and network access controls to control access to your ElastiCache clusters.
  rationale: This helps ensure that the data is safe and protected from any threats and or misconfigurations within the network.
    This helps to keep a potential hacker getting into the system and compromising the data.
  impact: ''
  references:
  - 1. https://aws.amazon.com/products/databases/
  page_start: 119
  audit_raw: '1. Create or Select a VPC

    • Sign in to the AWS Management Console and open the Amazon VPC console at

    https://console.aws.amazon.com/vpc/.

    • Create a new VPC or select an existing VPC where you want to deploy your

    ElastiCache cluster.

    2. Create Subnets

    • In the VPC console, navigate to Subnets in the left-side menu.

    • Create or select the desired subnets within your VPC where you want to deploy

    your ElastiCache cluster.

    3. Configure Security Groups

    • In the VPC console, navigate to Security Groups in the left-side menu.

    • Create a new security group.

    Or select an existing one to configure the security settings for your ElastiCache

    cluster.

    • Define inbound and outbound rules to control the traffic flow to and from your

    ElastiCache cluster.

    o Allow inbound traffic from trusted sources (e.g., specific IP ranges or

    security groups) on the necessary ports used by your ElastiCache cluster.

    o Define outbound rules based on your requirements, such as allowing

    outbound traffic to specific destinations or ports.

    • Associate the security group with the ElastiCache cluster when creating or

    modifying it.

    4. Set up Network Access Control Lists (ACLs)

    • In the VPC console, navigate to Network ACLs in the left-side menu.

    • Create or select the appropriate network ACL associated with the subnets used

    by your ElastiCache cluster.

    • Configure inbound and outbound rules in the network ACL to allow or deny traffic

    to and from your ElastiCache cluster.

    o Define rules based on your security requirements, allowing only necessary

    protocols, ports, and IP ranges.

    • Associate the network ACL with the subnets used by your ElastiCache cluster.

    5. Configure Route Tables

    • In the VPC console, navigate to Route Tables in the left-side menu.

    • Create or select the route table associated with the subnets used by your

    ElastiCache cluster.

    • Add or modify routes to ensure traffic to and from your ElastiCache cluster flows

    correctly.

    o Ensure that the route table has an appropriate route to the internet

    gateway or virtual private gateway if external connectivity is required.

    • Associate the route table with the subnets used by your ElastiCache cluster.

    6. Verify Connectivity and Test

    • Launch an Amazon EC2 instance within the same VPC and subnet as your

    ElastiCache cluster or use an existing one.

    • Connect to the EC2 instance using SSH or other remote access methods.

    • Test the connectivity to your ElastiCache cluster by trying to connect to it using

    the appropriate client or utility.

    • Verify that the network security settings allow the necessary traffic and deny

    unauthorized access.'
