  title: Ensure VPC Endpoints are configured
  scoring: manual
  profile:
  - Level 1
  description: Using VPC endpoints with Amazon DynamoDB allows you to securely access DynamoDB resources within your Amazon
    Virtual Private Cloud (VPC). This keeps your traffic off the public internet.
  rationale: Using VPC endpoint in the DynamoDB helps ensure that the data is secured and that no external networks would
    have access to the network. It is a private network where the user has access to their desired availability zones and
    subnets.
  impact: ''
  references:
  - 1. https://aws.amazon.com/products/databases/
  page_start: 102
  audit_raw: '1. Open Amazon VPC Console

    • Sign in to the AWS Management Console and open the Amazon VPC console at

    https://console.aws.amazon.com/vpc/.

    2. Create a VPC Endpoint

    • In the Amazon VPC console, navigate to the Endpoints section in the left-side

    menu.

    • Click Create Endpoint.

    • Select your desired VPC in the VPC dropdown menu.

    • In the Service category section, choose AWS services.

    • In the Filter Services search box, enter DynamoDB and select DynamoDB from

    the results.

    • Choose your desired availability zone(s) and subnet(s).

    • Leave the default settings for other options or customize them according to your

    requirements.

    • Click Create endpoint.

    3. Update Route Tables

    • In the Amazon VPC console, navigate to the Route Tables section in the leftside menu.

    • Find the route table associated with your VPC or subnet from which you want to

    access DynamoDB.

    1. Edit the route table and add a route for the DynamoDB VPC endpoint.

    o Destination: Enter the CIDR block of the DynamoDB VPC endpoint,

    typically in the form of vpce-xxxxxx-xxxxxxx-xxxxxxxxxxxxxx.vpce.amazonaws.com/32.

    o Target: Select the VPC endpoint ID from the dropdown menu.

    2. Save the changes to update the route table.

    3. Verify Connectivity

    To ensure that your VPC endpoint for DynamoDB is functioning correctly:

    • Launch an Amazon EC2 instance within your VPC or use an existing one.

    • Connect to the EC2 instance using SSH or other remote access methods.

    • From the EC2 instance, try to access DynamoDB using the SDK or CLI.

    • Ensure that the access to DynamoDB is successful and that data can be

    retrieved or modified.'
