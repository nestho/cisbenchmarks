    • Choose the MemoryDB cluster for which you want to enable encryption at rest

    and in transit.

    • Click on the cluster name to access its details page.

    4. Enable Encryption at Rest

    • In the cluster details page, navigate to the Encryption at Rest section.

    • Click on Modify to edit the encryption settings.

    • Select the desired encryption option:

    o AWS Managed Key (Default): Choose this option to use the default AWS

    managed key for encryption at rest. Amazon MemoryDB automatically

    encrypts your data using this key.

    o Customer Managed Key (CMK): Choose this option if you want to use

    your own AWS Key Management Service (KMS) customer-managed key

    for encryption. Select the appropriate CMK from the dropdown menu.

    • Click "Apply Changes" to enable encryption at rest for the MemoryDB cluster.

    5. Enable Encryption in Transit

    • In the cluster details page, navigate to the Encryption in Transit section.

    • Click on Modify to edit the encryption settings.

    • Select the desired encryption option:

    o Encryption in Transit Enabled: Choose this option to enable encryption in

    transit for data transmitted between your client applications and

    MemoryDB. MemoryDB uses SSL/TLS encryption to secure the

    communication channel.

    o Encryption in Transit Disabled: Choose this option if you do not require

    encryption in transit.

    • Click Apply Changes to enable encryption in transit for the MemoryDB cluster.

    6. Verify Encryption Status

    • Wait a few minutes for the changes to propagate and the encryption settings to

    take effect.

    • Refresh the cluster details page to see the updated encryption status.

    • Verify that encryption at rest and in transit are enabled for the MemoryDB cluster.'
