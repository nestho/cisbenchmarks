  title: Ensure DocumentDB has delete protection enabled
  scoring: manual
  profile:
  - Level 1
  description: Ensure that delete protection is enabled on database instances to prevent accidental or unauthorized deletion.
    This setting safeguards critical databases by requiring explicit disabling of delete protection before deletion, reducing
    the risk of data loss through human error or malicious activity.
  rationale: Delete protection provides a safeguard against inadvertent or malicious deletion of critical databases. By requiring
    deliberate action to disable deletion protection, organizations mitigate risks associated with accidental data deletion
    and enhance the overall resilience of their data storage platform.
  impact: Failure to enable delete protection increases the risk of irreversible data loss, potential service disruption,
    and operational downtime.
  references: []
  page_start: 201
  audit_raw: "List deletion protection status for all DocumentDB clusters:\naws docdb describe-db-clusters \\\n --query\n\"\
    DBClusters[*].{DBClusterIdentifier:DBClusterIdentifier,DeletionProtection:De\nletionProtection}\"\n• DeletionProtection:\
    \ true ⇒ Deletion protection is enabled.\n• DeletionProtection: false ⇒ Deletion protection is not enabled (non-compliant)."
  remediation: "Enable deletion protection on a specific cluster:\naws docdb modify-db-cluster \\\n --db-cluster-identifier\
    \ <cluster-identifier> \\\n --deletion-protection \\\n --apply-immediately\n• Replace with your DocDB cluster ID.\n• This\
    \ change is applied immediately without downtime.\n• Once enabled, the cluster cannot be deleted without first disabling\
    \ deletion\nprotection."
