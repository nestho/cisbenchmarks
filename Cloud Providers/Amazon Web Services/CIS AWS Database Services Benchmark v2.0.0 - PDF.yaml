- id: '4.9'
  title: Ensure Database has Backup enabled
  scoring: manual
  profile:
  - Level 1
  description: 'Ensure your DynamoDB tables have backups enabled to protect against accidental data loss or corruption. This
    can be achieved in two ways: by enabling Point-in-Time Recovery (PITR), which provides continuous backups for up to 35
    days, and by configuring on-demand backups that can be automated using the AWS Backup service.'
  rationale: Backups are essential for restoring data after accidental deletions, application errors or malicious events.
    Enabling both continuous and scheduled backups maximizes data resilience while meeting recovery point objectives (RPO)
    and compliance mandates.
  impact: Without backups, data loss can be permanent which can lead to business disruption and potential regulatory penalties.
    Enabling backup provides assurance of data availability and accelerates recovery from incidents, supporting overall system
    reliability.
  references: []
  page_start: 112
  audit_raw: '1. Check if Point-in-Time Recovery (PITR) is enabled

    Use the following steps on the AWS console to verify if PITR is enabled for your

    DynamoDB table and also conform the number of days its retained for:

    1.1 Log in to the AWS Management Console.

    1.2 Navigate to DynamoDB in the AWS Services menu.

    • Select "Tables" from the left sidebar.

    1.3 Click on the specific table name that you want to audit.

    1.4 Go to the “Backups” tab in the table’s navigation bar.

    1.5 Under the “Point-in-time recovery (PITR)” section:

    • Verify that “Status” is “On”, which means PITR is enabled.

    • Check the “Backup recovery period” value, this displays the configured retention

    period in days.

    • Optionally, review the Earliest restore point and Latest restore point timestamps

    to confirm the exact window for recovery.

    2. Check if automated backups are enabled via AWS Backup Service

    AWS Backup allows scheduled, automated backups of DynamoDB tables (if integrated).

    To confirm backup plan settings, list backup plans and recovery points:

    2.1 Check if Table is Assigned to a Backup Plan

    • List backup plans:

    aws backup list-backup-plans --query "BackupPlansList[].BackupPlanName" --

    output table

    • For each backup plan, list all backup selections (resource assignments):

    aws backup list-backup-selections --backup-plan-id <your-backup-plan-id> --

    query "BackupSelections[].SelectionId" --output text

    • For each selection, list assigned resources and search for your table:

    aws backup get-backup-selection --backup-plan-id <your-backup-plan-id> --

    selection-id <selection-id> --query "BackupSelection.Resources" --output text

    • If your table ARN appears in any selection, it is protected by the backup plan.

    2.2 Verify Backup Plan Configuration

    aws backup get-backup-plan --backup-plan-id <your-backup-plan-id>

    Look for the "Lifecycle" fields in each backup rule:

    • "DeleteAfterDays" is the retention period.

    • "ScheduleExpression" sets the backup schedule (cron format).

    • "BackupVaultName" is the name of the vault (where backups are stored).

    Summary:

    1. Confirm PITR is enabled for the table and note it''s retention period (up to 35

    days).

    2. Confirm if AWS Backup plans exist and are actively creating recovery points for

    your DynamoDB tables.'
  remediation: "1. Create Backup Plan with 2 Rules (Continuous and Scheduled Snapshots)\naws backup create-backup-plan --backup-plan\
    \ '{\n \"BackupPlanName\": \"<BackupPlanName>\",\n \"Rules\": [\n {\n \"RuleName\": \"Continuous-PITR\",\n \"TargetBackupVaultName\"\
    : \"Default\",\n \"ScheduleExpression\": \"cron(0 * * * ? *)\",\n \"StartWindowMinutes\": 60,\n \"CompletionWindowMinutes\"\
