- id: '8.4'
  title: Ensure Amazon Keyspaces tables have Point-in-Time Recovery (PITR) enabled
  scoring: manual
  profile:
  - Level 1
  description: Ensure that Amazon Keyspaces tables have Point-in-Time Recovery (PITR) enabled. When PITR is enabled, Amazon
    Keyspaces automatically creates continuous backups of table data, allowing tables to be restored to any point in time
    within the last 35 days. This protection is applied at the table level and provides defense against accidental writes,
    deletions, and other data loss scenarios.
  rationale: Enabling PITR on Amazon Keyspaces tables provides continuous, automatic backup protection without requiring manual
    snapshot management or impacting table performance or availability. In the event of accidental data corruption, malicious
    writes, or system failures, PITR allows rapid recovery to any second within the last 35 days, significantly reducing data
    loss exposure and recovery time.
  impact: Enabling PITR for Amazon Keyspaces ensures that table data is continuously protected and recoverable to any point
    within 35 days, providing strong defense against accidental loss and corruption while maintaining full table performance
    and availability.
  references: []
  page_start: 212
  audit_raw: "List PITR status for all tables in a keyspace:\naws keyspaces get-table \\\n --keyspace-name <keyspace-name>\
    \ \\\n --table-name <table-name>\n• If the value of pointInTimeRecovery = DISABLED, this means PITR is turned off"
  remediation: "Enable PITR on a specific table:\naws keyspaces update-table \\\n --keyspace-name <keyspace-name> \\\n --table-name\
    \ <table-name> \\\n --point-in-time-recovery status=ENABLED\n• This command enables PITR on the specified table in the\
    \ keyspace.\n• The change takes effect immediately with no performance impact."
  checks:
  - type: manual_review
    info: "List PITR status for all tables in a keyspace:\naws keyspaces get-table \\\n --keyspace-name <keyspace-name> \\\
      \n --table-name <table-name>\n• If the value of pointInTimeRecovery = DISABLED, this means PITR is turned off"
    severity: medium
