- id: '4.1'
  title: Ensure AWS Identity and Access Management (IAM) is in use
  scoring: manual
  profile:
  - Level 1
  description: AWS Identity and Access Management (IAM) lets you securely control your users' access to AWS services and resources.
    To manage access control for Amazon DynamoDB, you can create IAM policies that control access to tables and data.
