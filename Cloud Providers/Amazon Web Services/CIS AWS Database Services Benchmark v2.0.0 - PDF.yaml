      4. Check the encryption status under the Configuration section.

      • Confirm that the field Encryption is marked as Enabled.

      5. Verify KMS key usage (if your organization''s standards requi'
    severity: medium
- id: '2.3'
  title: Ensure Data in Transit Encryption is Enforced
  scoring: manual
  profile:
  - Level 1
  description: Use TLS (Transport Layer Security) to secure data in transit. Aurora supports TLSencrypted connections between
    your application and your DB instance, and this configuration can be enforced so non-TLS connections are prohibited.
  rationale: Encrypting data in transit protects sensitive information from interception and tampering by unauthorized parties.
    Aurora supports TLS for securing client connections, however it is essential to ensure that client applications are properly
    configured to use TLS and that the database enforces encrypted connections.
  impact: Disabling or failing to properly configure TLS can expose the data to be compromised by malicious actors, potentially
    resulting in data breaches, credential theft, or other security compromises.
  references:
  - 1. https://aws.amazon.com/products/databases/
  page_start: 26
  audit_raw: '1. Sign in to the AWS Management Console where the Aurora database cluster you

    are auditing resides.

    2. Navigate to the Amazon Aurora and RDS Dashboard:

    • You can find this under the Database category.

    3. Select the DB cluster name you wish to audit:

    • This opens the details page for your specific Aurora cluster.

    4. Under Configuration, locate the DB cluster parameter group attached to this

    cluster:

    • Click on the parameter group name to review its parameters.

    5. Verify the following engine-specific parameters to confirm encryption in transit is

    enforced:

    • 5a. PostgreSQL: Confirm that rds.force_ssl = 1

    • 5b. MySQL: Confirm that require_secure_transport = ON (Only applicable for

    Aurora MySQL versions 2 and 3)

    Notes:

    • Make sure the parameter changes are applied and the cluster has been rebooted

    if necessary for the parameters to take effect.'
  remediation: '1. Sign in to the AWS Management Console where the Aurora database cluster you

    are remediating resides.

    2. Navigate to the Amazon Aurora and RDS Dashboard:

    • You can find this under the Database category.

    3. Select the DB cluster name you wish to remediate:

    • This opens the details page for your specific Aurora cluster.

    4. Under Configuration, locate the DB cluster parameter group attached to this

    cluster:

    • Click on the parameter group name to remediate its parameters.

    5. Update the following engine-specific parameters to enforce encryption in transit

    at the database level:

    • PostgreSQL: Set rds.force_ssl = 1

    • MySQL: Set require_secure_transport = ON (applicable to Aurora MySQL

    versions 2 and 3 only).

    6. Reboot the database cluster to apply the parameter changes.

    7. Configure your client application for SSL/TLS connections:

    • Download the appropriate AWS-provided SSL/TLS certificates:

    For MySQL-compatible Aurora, Amazon provides an SSL certificate that you can

    download from their documentation. PostgreSQL-compatible Aurora uses the

    default PostgreSQL SSL certificate.

    • Once you have the appropriate certificate, you must configure your client

    application to use SSL/TLS. For example, in MySQL, you might use a command

    like this:

    mysql -h <myinstance.123456789012.us-east-1.rds.amazonaws.com> --sslca=</path_to_certificate/rds-combined-ca-bundle.pem>
    --sslmode=VERIFY_IDENTITY

    For PostgreSQL, you might use a command like this:

    psql "host=<myinstance.123456789012.us-east-1.rds.amazonaws.com>

    sslmode=verify-ca sslrootcert=</path_to_certificate/rds-combined-cabundle.pem>"

    Replace <myinstance.123456789012.us-east-1.rds.amazonaws.com> with the endpoint

    for your DB instance, and replace </path_to_certificate/rds-combined-ca-bundle.pem>

    with the path to the SSL certificate on your local machine.

    8. Verify Encryption After configuring your client to use SSL/TLS, you should verify

    that encryption in transit is working correctly. You can do this by checking the

    status of the SSL connection from within the database itself. For example, in

    MySQL, you can run the following command:

    SHOW STATUS LIKE ''Ssl_cipher'';

    In PostgreSQL, you can run the following command:

    SHOW ssl;

    In both cases, if SSL is enabled, you should see a non-empty cipher suite or on as a

    result.'
  checks:
