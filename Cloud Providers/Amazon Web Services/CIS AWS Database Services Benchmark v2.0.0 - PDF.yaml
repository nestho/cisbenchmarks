- id: '2.10'
  title: Ensure Database has IAM Auth is Enabled
  scoring: manual
  profile:
  - Level 2
  description: AuroraDB clusters should be configured to leverage AWS IAM authentication for database connections. This ensures
    that users authenticate using temporary IAM-based tokens rather than static long-lived passwords.
  rationale: Enabling IAM authentication for AuroraDB centralizes and strengthens access control by integrating database authentication
    with broader AWS IAM identity management. This approach eliminates the risks associated with hard-coded credentials, reduces
    administrative overhead for password rotation, and allows precise access management using IAM identities and policies.
  impact: With the usage of IAM database authentication instead of static passwords, AuroraDB clusters are protected against
    credential leakage and weak password practices, making unauthorized access significantly more difficult. This reduces
    the attack surface, supports audit and compliance, and ensures that database access is tightly aligned with enterprise
    identity governance and cloud security standards.
  references: []
  page_start: 45
  audit_raw: "1. List AuroraDB clusters and check IAM authentication status:\naws rds describe-db-clusters \\\n --query\n\"\
    DBClusters[*].{DBClusterIdentifier:DBClusterIdentifier,IAMDatabaseAuthentica\ntionEnabled:IAMDatabaseAuthenticationEnabled}\"\
    \ \\\n --output table\n2. List database users enabled for IAM authentication (Aurora MySQL):\n• For MySQL, connect to\
    \ the cluster and run below command to ensure that\nrequired database users exist for IAM token logins.\nSELECT user,\
    \ plugin FROM mysql.user WHERE plugin='AWSAuthenticationPlugin';\n• For Postgres, connect to the cluster and run below\
    \ command to verify that\nnecessary users are granted the rds_iam role.\nSELECT r.rolname\nFROM pg_roles AS r\nJOIN pg_auth_members\
    \ AS m ON r.oid = m.member\nJOIN pg_roles AS g ON m.roleid = g.oid\nWHERE g.rolname = 'rds_iam';\nThe cluster must have\
    \ IAM database authentication enabled and users intended for IAM\nauthentication must exist in the database engine with\
    \ appropriate privileges."
  remediation: "1. Enable IAM Database Authentication on the Aurora Cluster\n• Use the AWS CLI to enable IAM authentication\
    \ for an existing Aurora cluster:\naws rds modify-db-cluster \\\n --db-cluster-identifier <your-cluster-name> \\\n --enable-iam-database-authentication\
    \ \\\n --apply-immediately\n2. Create Local Database Users Configured for IAM Authentication\n• For Aurora MySQL: Connect\
    \ to the database and create or alter users as follows:\nCREATE USER 'jane_doe' IDENTIFIED WITH AWSAuthenticationPlugin\
    \ as 'RDS';\nor\nALTER USER 'jane_doe' IDENTIFIED WITH AWSAuthenticationPlugin as 'RDS';\n• For Aurora PostgreSQL:\nGrant\
    \ the rds_iam role to eligible users:\nGRANT rds_iam TO jane_doe;\n3. Grant Necessary Privileges to the Database Users\n\
    • Assign required permissions and roles to the users within your DB engine via\nstandard SQL GRANT commands.\n4. Ensure\
    \ IAM Users/Roles Have Required AWS Permissions\n• The IAM principal that connects needs the following AWS permission\
    \ in their\npolicy:\n{\n \"Version\":\"2012-10-17\",\n \"Statement\": [\n {\n \"Effect\": \"Allow\",\n \"Action\": [\n\
    \ \"rds-db:connect\"\n ],\n \"Resource\": [\n \"arn:aws:rds-db:region:accountid:dbuser:DbClusterResourceId/db-user-name\"\
    \n ]\n }\n ]\n}\n• region is the AWS Region for the DB cluster\n• account-id is the AWS account number for the DB cluster.\n\
    • DbClusterResourceId is the identifier for the DB cluster. This identifier is unique\nto an AWS Region and never changes.\
    \ To find a DB cluster resource ID in the\nAWS Management Console for Amazon Aurora, choose the DB cluster to see its\n\
    details. Then choose the Configuration tab. The Resource ID is shown in the\nConfiguration section.\n5. Test the Configuration\n\
    • Use the AWS CLI to generate an authentication token:\naws rds generate-db-auth-token \\\n --hostname <cluster-endpoint>\
    \ \\\n --port 3306 \\\n --region <region> \\\n --username <db_user>\n• Use the generated token to authenticate to the\
    \ database, confirming successful\nlogin.\nFor mysql:\nmysql --host= <cluster-endpoint> \\\n --port=3306 \\\n --ssl-mode=REQUIRED\
    \ \\\n --enable-cleartext-plugin \\\n --user= <db_user_name> \\\n --password= '<generated_db_auth_token>'\nFor postgres:\n\
    psql \"host=<cluster-endpoint> port=5432 dbname=<database_name>\nuser=<>db_user_name password='<generated_db_auth_token>'\
    \ sslmode=require\""
