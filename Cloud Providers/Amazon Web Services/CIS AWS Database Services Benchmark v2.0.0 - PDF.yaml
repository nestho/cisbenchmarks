controls:
- id: '2.1'
  title: Ensure the Use of Security Groups
  scoring: manual
  profile:
  - Level 1
  description: Security groups act as a firewall for associated Amazon RDS DB instances, controlling both inbound and outbound
    traffic.
  rationale: Creating your severity group either inbound or outbound rules. Inbound rules allow an individual to create a
    rule that permits the traffic to go to a specific port depending on which source it's coming from. Outbound rules enable
    your instances to connect with one another allow them to connect to the internet. If needed, you can limit the outgoing
    traffic.
  impact: ''
  references:
  - 1. https://aws.amazon.com/products/databases/
  page_start: 20
  audit_raw: '1. Open the Amazon Console

    2. Go to Aurora and RDS (https://console.aws.amazon.com/rds/)

    3. Click on Databases

    4. For each database instance click the name of the instance and check that there

    is at least one VPC security group under Connectivity & security -> Security ->

    VPC security groups'
  remediation: 'Here is a step-by-step guide on how to create and use Security Groups for an Amazon

    Aurora instance:

    1. Sign in to AWS Management Console

    If you do not already have an AWS account, you''ll need to create one at

    https://aws.amazon.com.

    2. Navigate to Amazon EC2 Dashboard

    Once you have logged in to the AWS Management Console, navigate to the EC2

    service. You can find this under the Compute category.

    3. Create a New Security Group

    • In the EC2 Dashboard, find the Network & Security section on the left-side

    navigation pane, then click Security Groups.

    • Click on the Create Security Group button.

    4. Configure the New Security Group

    • In the Create Security Group panel, give your new security group a name and

    a description.

    • Select the VPC in which your Amazon Aurora instance will be deployed.

    • Then click Create.

    5. Add Rules to the Security Group

    After creating the Security Group, you can add inbound and outbound rules. For

    Inbound Rules:

    • Click on the Inbound rules tab, then click Edit inbound rules.

    • Click Add Rule. For the type, select MYSQL/Aurora. For the source, you can

    specify the IP addresses allowed to access your Amazon Aurora instance.

    For Outbound Rules:

    • Click on the Outbound rules tab, then click Edit outbound rules. Outbound

    rules allow your instances to communicate with other instances or access the

    internet. You can restrict outbound traffic if necessary. In most cases, you can

    leave the default setting, which allows all outbound traffic.

    6. Assign the Security Group to Amazon Aurora

    • When launching a new Amazon Aurora instance (in the Amazon RDS

    dashboard), you can select your new security group in the Configure advanced

    settings step.

    • If your Aurora instance has already been launched, you can modify it to use the

    new security group by selecting the instance.

    • Click Modify, and then select the new security group.'
  checks:
  - type: manual_review
    info: '1. Open the Amazon Console

      2. Go to Aurora and RDS (https://console.aws.amazon.com/rds/)

      3. Click on Databases

      4. For each database instance click the name of the instance and check that there

      is at least one VPC security group under Connectivity & security -> Security ->

      VPC security groups'
    severity: medium
- id: '2.2'
  title: Ensure Data at Rest is Encrypted
  scoring: manual
  profile:
  - Level 1
  description: Amazon Aurora allows you to encrypt your databases using keys you manage through AWS Key Management Service
    (KMS).
  rationale: Databases are likely to hold sensitive and critical data; therefore, it is highly recommended to implement encryption
    to protect your data from unauthorized access or disclosure.
  impact: Unauthorized users cannot access the data because it is protected by an encryption key that only authorized users
    can use.
  references:
  - 1. https://aws.amazon.com/products/databases/
  page_start: 23
  audit_raw: '1. Sign in to the AWS Management Console where the Aurora database cluster you

    are auditing resides.

    2. Navigate to the Amazon Aurora and RDS Dashboard:

    • You can find this under the Database category.

    3. Select the DB cluster name you wish to audit:

    • This opens the details page for your specific Aurora cluster.

    4. Check the encryption status under the Configuration section.

    • Confirm that the field Encryption is marked as Enabled.

    5. Verify KMS key usage (if your organization''s standards require a customermanaged key):

    • In the Encryption section, identify the AWS KMS key associated with the cluster.

    Click the key link to open its details page. Confirm that it is a customer-managed

    KMS key, not an AWS-managed key.

    • Review additional key attributes to ensure compliance, including Key policy, Key

    rotation status, etc.'
  remediation: 'For existing Aurora databases: In order to encrypt an existing Aurora instance that was

    not initially created with encryption enabled, you will need to create a snapshot of the

    instance, make a copy of the snapshot with encryption enabled, and then restore the

    DB instance from the copied snapshot.

    For creating new Aurora databases with encryption at rest enabled:

    1. Sign in to AWS Management Console

    If you do not already have an AWS account, you''ll need to create one at

    https://aws.amazon.com

    2. Navigate to the Amazon Aurora and RDS Dashboard:

    • You can find this under the Database category.

    3. Click on Create Database and choose Aurora as your engine option.

    4. In the Additional Configuration section, you will see an option labeled

    Enable encryption. Check this box to enable encryption for data at rest.

    • You will also need to select a master key to use for encryption. You can choose

    the default AWS managed key for RDS or a pre-created customer-managed

    AWS Key Management Service (KMS) that aligns with your organization’s key

    management policies.

    5. Launch the DB Instance

    • After you have selected the appropriate encryption settings, click Create

    database.

    • Review your settings on the following page, and if everything looks correct, click

    Launch DB Instance.'
  checks:
  - type: manual_review
    info: '1. Sign in to the AWS Management Console where the Aurora database cluster you

      are auditing resides.

      2. Navigate to the Amazon Aurora and RDS Dashboard:

      • You can find this under the Database category.

      3. Select the DB cluster name you wish to audit:

