  title: Ensure Data at Rest is Encrypted
  scoring: manual
  profile:
  - Level 1
  description: This helps ensure that the data is kept secure and protected when at rest. The user must choose from two key
    options which then determine when the data is encrypted at rest.
  rationale: ''
  impact: If an unauthorized user steals the data, it would be unreadable for them because a key would be required to decrypt
    the message into plaintext.
  references:
  - 1. https://aws.amazon.com/products/databases/
  page_start: 276
  audit_raw: '1. Create an AWS Key Management Service (KMS) Key

    • Sign in to the AWS Management Console at https://console.aws.amazon.com/

    with your AWS account credentials.

    • Open the AWS Key Management Service (KMS) console.

    • Create a new KMS key or select an existing one to encrypt your QLDB data at

    rest.

    • Configure the key policy to grant the appropriate IAM users or role permissions.

    2. Enable Encryption for QLDB

    • Open the Amazon QLDB console.

    • Choose the QLDB ledger for which you want to enable encryption at rest.

    • Click on the Configuration tab.

    • Under the Encryption section.

    • Click on the Edit button or Modify option.

    • Enable encryption for the ledger.

    • Select the KMS key you created or chose in the first step for encrypting the

    QLDB data.

    • Save the changes to enable encryption at rest for the QLDB ledger.

    3. Verify Encryption Status

    • Once the encryption at rest is enabled, the QLDB console will indicate the

    encryption status as Enabled for the selected ledger.

    • Ensure that the KMS key specified for encryption is the correct key you intended

    to use.

    4. Testing and Verification

    • Perform read and write operations on your QLDB ledger to validate that the data

    is encrypted at rest.

    • Verify that you can access and query the encrypted data using appropriate

    authentication and authorization methods.

    5. Key Management and Rotation

    • Follow AWS best practices for key management, including securely storing and

    managing the KMS key used for QLDB encryption.

    • Implement a key rotation policy, following AWS recommendations and

    compliance requirements if required.

    6. Backup and Disaster Recovery

    • Ensure you have appropriate backup and disaster recovery mechanisms for your

    QLDB data.

    • Consider backing up the KMS key used for encryption to prevent data loss in

    case of a key compromise or accidental deletion.'
