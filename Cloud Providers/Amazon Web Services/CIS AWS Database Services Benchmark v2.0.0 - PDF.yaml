- id: '2.7'
  title: Ensure Least Privilege Access
  scoring: manual
  profile:
  - Level 1
  description: 'Use the principle of least privilege when granting access to your Amazon Aurora resources. This principle
    of least privilege (POLP) is a computer security concept where users are given the minimum access levels necessary to
    complete their job functions. In Amazon Aurora, this can be implemented at various levels, including AWS IAM for managing
    AWS resources and within the database for managing database users and roles. Here is a step-by-step guide for each:'
  rationale: POLP limits the user interaction on the database, and it only gives the database permission to complete the necessary
    or mandatory task. AWS IAM gives permission for what the entity can and cannot do. Incorporating both POLP and AWS IAM
    in a database gives limited permission to the user to complete the tasks.
  impact: Users would need to create a IAM role to implement POLP into their database.
  references:
  - 1. https://aws.amazon.com/products/databases/
  page_start: 37
  audit_raw: 'Implementing POLP with AWS IAM

    1. Sign in to AWS Management Console

    • If you do not already have an AWS account, you will need to create one at

    https://aws.amazon.com.

    2. Navigate to IAM Dashboard

    • Navigate to the IAM service once logged in to the AWS Management Console.

    • You can find this under the Security, Identity, & Compliance category.

    3. Create a new IAM role or user

    • If creating a new IAM role or user, click Roles or Users.

    • Then Create role or Create user.

    4. Attach minimum necessary permissions

    • When attaching policies, give only the permissions necessary to perform the

    intended tasks.

    • AWS provides many predefined policies designed following the POLP. You can

    create a custom policy with precise - permissions if none suits your needs.

    Implementing POLP within Amazon Aurora

    1. Log into your Aurora Database

    Depending on your Aurora database engine, you can log in through the terminal

    using a MySQL or PostgreSQL client. You''ll need your host endpoint, username,

    and password to log in.

    2. Create a new user

    You can create a new user with the CREATE USER command in SQL.

    For example,

    CREATE USER ''<username>''@''<localhost>'' IDENTIFIED BY ''password'';

    3. Grant minimal necessary privileges

    After creating the user, you can grant privileges using the GRANT command.

    The privileges should be as limited as possible for the user to perform their

    necessary functions.

    For example,

    GRANT SELECT, INSERT ON <mydb.mytbl> TO ''<username>''@''<localhost>'';

    4. Regularly review permissions

    It is essential to regularly review and update permissions to make sure they

    adhere to the principle of least privilege. You can view a user''s permissions with

    the SHOW GRANTS command; for example,

    SHOW GRANTS FOR ''<username>''@''<localhost>'';'
  remediation: 'This is important because it reduces and secures any possible threat that an

    unauthorized user can gain by hacking into the system.'
