  title: Ensure Database has delete protection enabled
  scoring: manual
  profile:
  - Level 1
  description: Ensure that delete protection is enabled on database instances to prevent accidental or unauthorized deletion.
    This setting safeguards critical databases by requiring explicit disabling of delete protection before deletion, reducing
    the risk of data loss through human error or malicious activity.
  rationale: Delete protection provides a safeguard against inadvertent or malicious deletion of critical databases. By requiring
    deliberate action to disable deletion protection, organizations mitigate risks associated with accidental data deletion
    and enhance the overall resilience of their data storage platform.
  impact: Failure to enable delete protection increases the risk of irreversible data loss, potential service disruption,
    and operational downtime.
  references: []
  page_start: 110
  audit_raw: "To check whether delete protection is enabled on your DynamoDB tables, use the\nfollowing command for each table:\n\
    aws dynamodb describe-table --table-name <your-table-name> \\\n --query \"{TableName: Table.TableName, DeleteProtectionEnabled:\n\
    Table.DeletionProtectionEnabled}\" \\\n --output table\n• Replace with your DynamoDB table name.\n• This will return True\
    \ if delete protection is enabled, False otherwise."
  remediation: "To enable delete protection on an existing DynamoDB table, use the following\ncommand:\naws dynamodb update-table\
    \ \\\n --table-name my-table \\\n --deletion-protection-enabled\n• Replace with your DynamoDB table name.\n• Delete protection\
    \ prevents the table from being deleted until the protection is\ndisabled explicitly."
  checks:
