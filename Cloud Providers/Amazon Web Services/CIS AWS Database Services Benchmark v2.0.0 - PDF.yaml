    https://console.aws.amazon.com/dynamodb/.

    2. Create DynamoDB Table

    • Click Create table. This will bring you to the Create DynamoDB table page.

    3. Specify Table Details

    • Enter a Table name and Primary key.

    • The primary key consists of a partition key and, optionally, a sort key.

    • Fill in these details according to your requirements.

    4. Enable Encryption

    • Under the Settings section, check the Enable encryption at rest.

    • By default, DynamoDB uses an AWS-owned CMK to encrypt your data.

    • To use an AWS-managed CMK or a customer-managed CMK instead, select

    AWS-managed CMK or Customer-managed CMK from the dropdown menu, then

    choose the desired CMK.

    5. Create a Table

    • Click Create.

    • This will create your DynamoDB table with encryption at rest enabled.

    Note:

    1. The setting for encryption at rest applies to all DynamoDB data associated with

    the table, including primary key data and indexes.

    2. If you need to apply encryption at rest to an existing table, you can modify the

    table settings. However, modifying settings on large tables could take time and

    impact performance during the transition.

    3. Ensure you have the necessary permissions in AWS KMS when choosing an

    AWS-managed CMK or a customer-managed CMK.'
