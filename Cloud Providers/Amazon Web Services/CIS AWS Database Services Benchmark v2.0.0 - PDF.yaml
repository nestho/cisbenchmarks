  scoring: manual
  profile:
  - Level 1
  description: In order to access Amazon Keyspaces the user is required to set specific networking parameters and security
    measurements without these extra steps they will not be able to access it. Users are required to create or select a virtual
    private cloud (VPC) and define their inbound and outbound rules accordingly.
