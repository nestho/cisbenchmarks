  scoring: manual
  profile:
  - Level 1
  description: Once a user is logged in to their AWS account and has access to their Amazon Keyspaces they are encouraged
    to choose from the following two options to encrypt their data. Depending on which key they select for encryption at rest
    would store the data according to their preference. For encryption in transit the user is also encouraged to choose from
    two options depending on if the data needs to be encrypted during transit.
  rationale: ''
  impact: Prevents any unauthorized user from accessing the database and provides security when transferring the data from
    one location to another.
  references:
  - 1. https://aws.amazon.com/products/databases/
  page_start: 209
  audit_raw: '1. Sign in to the AWS Management Console

    • Sign in to the AWS Management Console at https://console.aws.amazon.com/

    with your AWS account credentials.

    2. Open the Amazon Keyspaces Console

    • Navigate to the service using the Find Services search bar or by directly

    accessing the console at https://console.aws.amazon.com/keyspaces/.

    3. Select the Keyspace

    • Choose the Keyspace (database) for which you want to enable encryption at rest

    and in transit.

    • Click on the Keyspace name to access its details page.

    4. Enable Encryption at Rest

    • In the Keyspace details page, click on the Configuration tab.

    • Under the Encryption section, locate the "Encryption at Rest" option.

    • Click on Edit.

    • Select the desired encryption setting:

    o Default Encryption: Choose this option to use the default AWS-managed

    key for encryption at rest. Amazon Keyspaces automatically encrypts your

    data using this default key.

    o Customer Managed Key (CMK): Choose this option if you want to use

    your own AWS Key Management Service (KMS) customer-managed key

    for encryption. Select the appropriate CMK from the dropdown menu.

    • Click "Save" to enable encryption at rest for the Keyspace.

