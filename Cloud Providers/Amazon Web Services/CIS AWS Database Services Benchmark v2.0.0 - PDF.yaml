- id: '10.10'
  title: Ensure Database has automated Backups enabled
  scoring: manual
  profile:
  - Level 1
  description: Ensure that Amazon Timestream tables have automated backups enabled through AWS Backup with a defined backup
    schedule and retention policy. AWS Backup provides scheduled, automated backup functionality for Timestream tables, creating
    regular point-in-time snapshots that are retained according to a configurable lifecycle policy. This control is important
    because by having IAM roles implemented in the database it only allows certain people who are authenticated into the database
    to modify the database and would not give access to unauthorized personnel. This ensures that the data is being protected
    from any threat actor.
  rationale: Amazon Timestream stores critical time-series data that is often mission-critical for monitoring, analytics,
    and operational intelligence. Automated backups through AWS Backup ensure that Timestream tables are continuously protected
    without requiring manual intervention, and can be rapidly restored in the event of accidental deletion, data corruption,
    misconfiguration, or application errors.
  impact: Enabling automated backups for Timestream ensures that time-series data is regularly captured in durable backups
    and recoverable to any point within the configured retention window, providing strong protection against accidental loss
    and data corruption. Only authorized personnel can access the database and configure the applications by using their IAM
    credentials. If the user credentials are compromised by an unauthorized user, it would limit them to access specific areas
    within the database due to the leverage IAM roles established.
  references:
  - 1. https://aws.amazon.com/products/databases/
  page_start: 266
  audit_raw: 'Important Note: Amazon Timestream does not have a native automated backup feature

    built into the service. Instead, backups are managed through AWS Backup, which

    provides scheduled, on-demand, and lifecycle-managed backup functionality for

    Timestream tables.

    Check if automated backups are enabled via AWS Backup Service:

    1. Check if Timestream Database is Assigned to a Backup Plan

    • List backup plans:

    aws backup list-backup-plans --query "BackupPlansList[].BackupPlanName" --

    output table

    • For each backup plan, list all backup selections (resource assignments):

    aws backup list-backup-selections --backup-plan-id <your-backup-plan-id> --

    query "BackupSelections[].SelectionId" --output text

    • For each selection, list assigned resources and search for your database:

    aws backup get-backup-selection --backup-plan-id <your-backup-plan-id> --

    selection-id <selection-id> --query "BackupSelection.Resources" --output text

    • If your table ARN appears in any selection, it is protected by the backup plan.

    2. Verify Backup Plan Configuration

    aws backup get-backup-plan --backup-plan-id <your-backup-plan-id>

    Look for the "Lifecycle" fields in each backup rule:

    • "DeleteAfterDays" is the retention period.

    • "ScheduleExpression" sets the backup schedule (cron format).

    • "BackupVaultName" is the name of the vault (where backups are stored).

    1. Understand IAM and QLDB Integration

    • Familiarize yourself with IAM and its role in controlling access to AWS services,

    including QLDB.

    • Understand how IAM policies define permissions and access control rules for

    QLDB resources.

    2. Define IAM Users and Groups

    • Identify the users and groups that will need access to QLDB.

    • Create IAM user accounts for individuals who require direct access to QLDB.

    • Create IAM groups to organize users based on their roles or responsibilities

    logically.

    3. Define IAM Policies

    • Determine the permissions and actions users and groups need to perform on

    QLDB resources.

    • Create custom IAM policies or leverage existing IAM-managed policies to define

    these permissions.

    • Consider the principle of least privilege and grant only the necessary permissions

    for each user or group.

    4. Attach IAM Policies to Users and Groups

    • Associate the appropriate IAM policies with the IAM users and groups.

    • Ensure that each user or group has the necessary permissions to perform their

    tasks on QLDB.

    • Regularly review and update the assigned policies as access requirements

    evolve.

    5. Leverage IAM Roles

    • Identify AWS services or applications that require access to QLDB.

    • Create IAM roles to provide temporary credentials and permissions for these

    services.

    • Define trust relationships and establish the necessary permissions in the IAM

    role policies.

    6. Enable IAM Database Authentication

    • Configure IAM database authentication for QLDB to allow users to authenticate

    using their IAM credentials.

    • Enable the appropriate IAM authentication option in the QLDB configuration.

    • Configure your applications or clients to use IAM credentials when connecting to

    QLDB.

    7. Test IAM Access

    • Use IAM user credentials to log in and test the access to QLDB.

    • Verify that users can perform their intended actions based on their assigned IAM

    policies.

    • Test IAM roles and authentication for applications or services requiring access to

    QLDB.

    8. Monitor and Audit IAM Activity

    • Monitor IAM activity logs using AWS CloudTrail.

    • Set up appropriate CloudTrail trails to capture IAM-related events and API calls.

    • Regularly review IAM logs for any unauthorized access attempts or suspicious

    activities.

    9. Regularly Review and Update IAM Configuration

    • Periodically review the IAM policies, users, groups, and roles associated with

    QLDB.

    • Ensure access is granted based on business requirements and follows the

    principle of least privilege.

    • Remove or update IAM configurations when users or roles are no longer

    required.'
  remediation: "1. Create Backup Plan for on-demand snapshots:\naws backup create-backup-plan --backup-plan '{\n \"BackupPlanName\"\
    : \"<BackupPlanName>\",\n \"Rules\": [\n {\n \"RuleName\": \"Scheduled-OnDemand-Snapshots\",\n \"TargetBackupVaultName\"\
    : \"Default\",\n \"ScheduleExpression\": \"cron(0 3 ? * SUN *)\",\n \"StartWindowMinutes\": 120,\n \"CompletionWindowMinutes\"\
    : 360,\n \"Lifecycle\": { \"DeleteAfterDays\": 90 },\n \"RecoveryPointTags\": { \"BackupType\": \"OnDemand\" }\n }\n ]\n\
    }'\n• Replace \"BackupPlanName\" with your backup plan name\n• Replace \"Default\" with your actual backup vault name\
    \ if different\n• Update the \"ScheduleExpression\", \"StartWindowMinutes\" based on your unique\nbackup schedule.\n•\
    \ Replace \"35\" with your retention time for PITR if shorter\n• Replace \"90\" with your retention time for Snapshots\
    \ if different\nThis command outputs the BackupPlanId necessary for the next step.\n2. Assign Timestream Database to the\
    \ Backup Plan\nReplace <BackupPlanId> with the ID from Step 1 and <TableArn> with your\nTimestream table ARN.\naws backup\
    \ create-backup-selection --backup-plan-id <BackupPlanId> --backupselection '{ \"SelectionName\": \"timestream-tables\"\
    , \"IamRoleArn\":\n\"arn:aws:iam:::role/AWSBackupServiceRolePolicyForBackup\", \"Resources\":\n[\"<TableArn>\"] }'\n•\
    \ Make sure the IAM role has the necessary AWS Backup permissions.\n• These commands create a centralized backup plan\
    \ with scheduled snapshot\nbackups, then assign your Timestream database as a resource for backup."
