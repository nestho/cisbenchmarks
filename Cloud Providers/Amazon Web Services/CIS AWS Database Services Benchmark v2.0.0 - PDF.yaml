  scoring: manual
  profile:
  - Level 1
  description: ''
  rationale: This helps ensure that the system is updated with any potential vulnerabilities that might pose a threat to the
    organization. Helps authenticate the sources that are coming to the database and ensures that only authorized users have
    the credential to access the data.
  impact: ''
  references:
