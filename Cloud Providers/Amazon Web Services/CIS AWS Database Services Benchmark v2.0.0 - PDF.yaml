- id: '2.11'
  title: Ensure Database has delete protection enabled
  scoring: manual
  profile:
  - Level 1
  description: Ensure that delete protection is enabled on database instances to prevent accidental or unauthorized deletion.
    This setting safeguards critical databases by requiring explicit disabling of delete protection before deletion, reducing
    the risk of data loss through human error or malicious activity.
  rationale: Delete protection provides a safeguard against inadvertent or malicious deletion of critical databases. By requiring
    deliberate action to disable deletion protection, organizations mitigate risks associated with accidental data deletion
    and enhance the overall resilience of their data storage platform.
  impact: Failure to enable delete protection increases the risk of irreversible data loss, potential service disruption,
    and operational downtime.
  references: []
  page_start: 49
  audit_raw: "Run the following command to check if deletion protection is enabled on your Aurora DB\ncluster(s):\naws rds\
    \ describe-db-clusters \\\n --query\n\"DBClusters[*].{DBClusterIdentifier:DBClusterIdentifier,DeletionProtection:De\n\
    letionProtection}\" \\\n --output table\n• Review each cluster's DeletionProtection status.\n• Clusters marked as true\
    \ have deletion protection enabled.\n• Identify any clusters with deletion protection disabled for remediation."
  remediation: "1. To enable deletion protection on an existing Aurora DB cluster:\naws rds modify-db-cluster \\\n --db-cluster-identifier\
    \ <your-cluster-name> \\\n --deletion-protection \\\n --apply-immediately\n• Replace with your Aurora cluster ID.\n• This\
    \ change is applied immediately without downtime.\n• Once enabled, the cluster cannot be deleted without first disabling\
    \ deletion\nprotection."
  checks:
  - type: manual_review
    info: "Run the following command to check if deletion protection is enabled on your Aurora DB\ncluster(s):\naws rds describe-db-clusters\
      \ \\\n --query\n\"DBClusters[*].{DBClusterIdentifier:DBClusterIdentifier,DeletionProtection:De\nletionProtection}\"\
      \ \\\n --output table\n• Review each cluster's DeletionProtection status.\n• Clusters marked as true have deletion protection\
      \ enabled.\n• Identify any clusters with deletion protection disabled for remediation."
