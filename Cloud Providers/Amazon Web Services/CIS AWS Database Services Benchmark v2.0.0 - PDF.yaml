- id: '6.7'
  title: Ensure MemoryDB has automatic backups enabled
  scoring: manual
  profile:
  - Level 1
  description: Ensure that Amazon MemoryDB clusters that store critical or stateful data have automatic backups enabled with
    a non-zero retention period. This setting configures MemoryDB to take snapshots of database and retain them for a defined
    number of days, allowing restoration of data in case of corruption, accidental deletion, or infrastructure failure.
  rationale: Automatic backups provide a simple and reliable way to recover MemoryDB data without relying solely on application-level
    safeguards. In the event of node failure, misconfiguration, or data corruption, a recent backup snapshot can be used to
    create a new database, significantly reducing recovery time and impact on dependent applications.
  impact: Enabling automatic backups for MemoryDB ensures that cluster data is regularly captured in snapshots, keeping it
    protected and readily recoverable in case of accidental deletion, corruption, or node failure. As a result, organizations
    can quickly recreate clusters from recent backups and restore access to the data, minimizing downtime and business impact
    from unexpected data loss events.
  references: []
  page_start: 168
  audit_raw: "List snapshot settings for all memorydb clusters\naws memorydb describe-clusters \\\n --query\n\"Clusters[*].{Name:Name,SnapshotRetentionLimit:SnapshotRetentionLimit}\"\
    \n• SnapshotRetentionLimit > 0 ⇒ automatic snapshots enabled.\n• SnapshotRetentionLimit = 0 or missing/null ⇒ automatic\
    \ snapshots disabled."
  remediation: "Enable automatic snapshots on a specific cluster\naws memorydb update-cluster \\\n --cluster-name <cluster-name>\
    \ \\\n --snapshot-retention-limit 7 \\\n --snapshot-window \"03:00-04:00\"\n• --snapshot-retention-limit 7 configures\
    \ a 7-day retention; use a value aligned with\nyour policy (for example 7, 14, or 30 days).\n• --snapshot-window \"03:00-04:00\"\
    \ (optional) sets the daily snapshot window in\nUTC. Choose an off-peak period to minimize performance impact.\n• MemoryDB\
    \ applies these changes immediately for the cluster configuration."
  checks:
