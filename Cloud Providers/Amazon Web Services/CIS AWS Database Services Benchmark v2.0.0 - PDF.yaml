- id: '7.11'
  title: Ensure to Conduct Security Assessments
  scoring: manual
  profile:
  - Level 1
  description: Periodically perform security assessments, including vulnerability assessments and penetration testing, to
    identify and address any security weaknesses. Review your security configuration against best practices and industry standards.
  rationale: This helps ensure that any vulnerabilities that might lie dormant be addressed promptly, which would reduce the
    risk of a malicious attack. Reviewing and making sure the security policies are authentic ensures the safety of the organization
    data.
  impact: ''
  references:
  - 1. https://aws.amazon.com/products/databases/
  page_start: 198
  audit_raw: '1. Define the Scope of the Security Assessment

    • Clearly define the scope of the security assessment for your Amazon

    DocumentDB cluster.

    • Determine the objectives, areas of focus, and any specific compliance or security

    standards you must adhere to.

    2. Review Security Documentation

    • Familiarize yourself with the AWS security best practices and documentation

    related to Amazon DocumentDB.

    • Review the AWS Shared Responsibility Model and understand the security

    controls provided by AWS.

    3. Assess Network Security

    • Review the network security configuration of your Amazon DocumentDB cluster.

    • Ensure it is deployed within a secure Virtual Private Cloud (VPC) with

    appropriate security groups and network access control lists (ACLs).

    • Validate that the network traffic to and from the cluster is appropriately restricted

    based on your security requirements.

    4. Evaluate Encryption Configuration

    • Assess the encryption settings for your Amazon DocumentDB cluster.

    • Verify that encryption at rest is enabled and that the data stored in the cluster is

    encrypted.

    • Validate that encryption in transit is enforced, ensuring that all client connections

    to the cluster are encrypted using SSL/TLS.

    5. Review Access Control Mechanisms

    • Evaluate the access control mechanisms implemented for your Amazon

    DocumentDB cluster.

    • Ensure that appropriate Identity and Access Management (IAM) policies and

    roles are in place to control access to the cluster.

    • Review user accounts and their privileges, and validate that multi-factor

    authentication (MFA) is enforced for administrative access.

    6. Examine Audit Logging and Monitoring

    • Review the audit logging and monitoring configuration for your Amazon

    DocumentDB cluster.

    • Verify that audit logging is enabled, capturing relevant database activities and

    events.

    • Evaluate the monitoring setup using Amazon CloudWatch or other tools to detect

    unusual or suspicious activities.

    7. Assess Backup and Disaster Recovery

    • Evaluate the backup and disaster recovery mechanisms in place for your

    Amazon DocumentDB cluster.

    • Verify that automated backups are enabled and configured with an appropriate

    retention period.

    • Validate that manual backups can be performed and restored successfully.

    8. Perform Vulnerability Scanning and Penetration Testing (If Applicable)

    • If allowed and within the terms of service, perform vulnerability scanning and

    penetration testing on your Amazon DocumentDB cluster.

    • Conduct security assessments to identify any vulnerabilities or weaknesses that

    could be exploited.

    9. Document Findings and Remediation Plan

    • Document the findings of your security assessment, including any identified

    vulnerabilities or areas of improvement.

    • Develop a remediation plan that addresses the identified issues and outlines the

    necessary actions to enhance the security posture of your DocumentDB cluster.

    10. Implement Remediation Measures

    • Implement the necessary remediation measures based on your remediation plan.

    • Apply security patches, adjust configuration settings, and strengthen access

    controls as required.

    11. Regularly Repeat the Security Assessment

    • Conduct regular security assessments on your Amazon DocumentDB cluster to

    ensure ongoing compliance and identify new risks or vulnerabilities.

    • Stay updated with security best practices and apply any relevant updates or

    patches to your cluster.'
