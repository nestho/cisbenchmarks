  audit_raw: '1. Create or Select a Virtual Private Cloud (VPC)

    • Sign in to the AWS Management Console and open the Amazon VPC console at

    https://console.aws.amazon.com/vpc/.

    • Create a new VPC or select an existing VPC where you want to deploy your

    Amazon Keyspaces resources.

    2. Configure Subnets

    • In the VPC console, navigate to Subnets in the left-side menu.

    • Create or select the subnets within your VPC where you want to deploy your

    Amazon Keyspaces resources.

    • Ensure you have private subnets to isolate your Keyspaces resources from the

    public internet.

    3. Define Security Groups

    • In the VPC console, navigate to Security Groups in the left-side menu.

    • Create a new security group or select an existing one for your Amazon

    Keyspaces resources.

    • Configure inbound and outbound rules in the security group to control traffic

    access.

    o Allow inbound access only from trusted sources, such as specific IP

    ranges or security groups, on the necessary ports used by Amazon

    Keyspaces.

    o Define outbound rules based on your requirements, allowing outbound

    traffic to necessary destinations or ports.

    • Associate the security group with your Amazon Keyspaces resources.

    4. Configure Network Access Control Lists (ACLs)

    • In the VPC console, navigate to Network ACLs in the left-side menu.

    • Create or select the network ACLs associated with the subnets used by your

    Amazon Keyspaces resources.

    • Configure inbound and outbound rules in the network ACLs to control traffic

    access.

    o Define rules based on your security requirements, allowing only necessary

    protocols, ports, and IP ranges.

    o list text hereDeny unnecessary or unwanted traffic.

    • Associate the network ACLs with the subnets used by your Amazon Keyspaces

    resources.

    5. Configure VPC Endpoints

    • In the VPC console, navigate to Endpoints in the left-side menu.

    • Create or select the VPC endpoints required for Amazon Keyspaces.

    • If you need to access Keyspaces from within your VPC, create a VPC endpoint

    for Amazon Keyspaces to connect your applications securely.

    • If you need to access Keyspaces from another VPC or on-premises network, set

    up VPC peering or a transit gateway to establish a secure connection.

    6. Verify Connectivity and Test

    • Launch an Amazon EC2 instance within the same VPC and subnet as your

    Amazon Keyspaces resources or use an existing one.

    • Connect to the EC2 instance using SSH or other remote access methods.

    • Test the connectivity to your Amazon Keyspaces resources by trying to connect

    to them using the appropriate client or utility.

    • Verify that the network security settings allow the necessary traffic and deny

    unauthorized access.'
