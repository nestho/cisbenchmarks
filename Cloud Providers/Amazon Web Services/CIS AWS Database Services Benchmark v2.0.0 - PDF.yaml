- id: '3.2'
  title: Ensure to Create The Appropriate Deployment Configuration
  scoring: manual
  profile:
  - Level 1
  description: This control is important and helps businesses to choose from two deployment options, either single or multi-AZ
    deployment. Depending on the business factor and their security needs the organization is then encouraged to make a decision
    that would benefit them.
  rationale: ''
  impact: ''
  references:
  - 1. https://aws.amazon.com/products/databases/
  page_start: 55
  audit_raw: '1. Evaluate High Availability Requirements

    • Assess the high availability needs of your application. Consider factors such as

    uptime requirements, business continuity, and disaster recovery.

    • Determine if your application requires automatic failover, data durability, and

    minimal downtime during maintenance or outages.

    2. Understand RDS Deployment Options

    • Familiarize yourself with the deployment options available on Amazon RDS.

    These include single-AZ (Availability Zone) and multi-AZ deployments.

    • Understand the differences between these options regarding availability,

    durability, and cost.

    3. Single-AZ Deployment

    • Consider a single-AZ deployment if high availability is not a critical requirement

    for your application.

    • In a single-AZ deployment, your database runs in a single Availability Zone,

    providing basic durability and availability.

    4. Multi-AZ Deployment

    • Choose a multi-AZ deployment if high availability and automatic failover are

    crucial for your application.

    • In a multi-AZ deployment, your database is replicated synchronously to a

    standby replica in a different Availability Zone, providing automatic failover in the

    event of a primary database failure.

    • Multi-AZ deployments provide enhanced availability and durability, ensuring

    minimal downtime during maintenance or outages.

    5. Evaluate Cost Implications

    • Consider the cost implications of your deployment choice.

    • Multi-AZ deployments incur additional costs than single-AZ deployments due to

    the replication and standby infrastructure.

    6. Make a Deployment Decision

    • Based on your evaluation of high availability requirements, consider the tradeoffs between single-AZ and multi-AZ deployments.

    • Choose the appropriate deployment configuration that meets your application''s

    availability, durability, and cost requirements.

    7. Configure RDS Deployment

    • Once you have determined the deployment configuration, go to the Amazon RDS

    console.

    • Create a new database instance or modify an existing one to match your chosen

    deployment configuration.

    • Follow the prompts and configure the deployment options, selecting the desired

    AZs and replication settings.

    • Adjust other configuration settings, such as instance type, storage, and backup

    options, based on your application''s needs.

    8. Test and Monitor

    • After the deployment is set up, thoroughly test your application''s functionality and

    performance.

    • Monitor the RDS instance and replication status using the Amazon RDS console

    or CloudWatch metrics.

    • Ensure that the database failover and automatic maintenance operations work as

    expected.'
  remediation: ''
