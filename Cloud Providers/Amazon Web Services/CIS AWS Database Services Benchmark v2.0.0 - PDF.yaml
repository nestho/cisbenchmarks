- id: '5.11'
  title: Ensure ElastiCache has Cluster Mode Enabled
  scoring: manual
  profile:
  - Level 2
  description: Cluster Mode Enabled for ElastiCache distributes data across multiple shards, enabling horizontal scaling,
    higher availability, and isolating potential failures or resource exhaustion to a subset of the data set, rather than
    the entire cluster.
  rationale: Enabling Cluster Mode reduces the risk of service outage from node failures, hardware limits, or scaling bottlenecks.
    Data partitioning across shards allows zero-downtime horizontal scaling, automated failover, and better resource utilization
    in production workloads, especially under high load or large data sets.
  impact: Enabling Cluster Mode transforms ElastiCache from a single fault domain into a distributed, highly available system.
  references: []
  page_start: 144
  audit_raw: "List Cluster Mode Status for All Replication Groups\naws elasticache describe-replication-groups \\\n --query\
    \ \"ReplicationGroups[*].{ReplicationGroupId:ReplicationGroupId,\nClusterModeEnabled:ClusterEnabled}\"\n• This will output\
    \ a concise list showing each cluster's ID and whether Cluster\nMode is enabled (true) or not (false).\n• Review and flag\
    \ any replication group entries where \"ClusterModeEnabled\":\nfalse."
  remediation: "Migration from Cluster Mode Disabled (CMD) to Cluster Mode Enabled (CME) is\npossible via the cluster mode\
    \ compatible feature provided by AWS.\n1. Pre-requisites:\n• The cluster may only have keys in database 0 only.\n• Applications\
    \ must use a Valkey or Redis OSS client that is capable of using\nCluster protocol and use a configuration endpoint.\n\
    • Auto-failover must be enabled on the cluster with a minimum of 1 replica.\n• The minimum engine version required for\
    \ migration is Valkey 7.2 and above, or\nRedis OSS 7.0 and above.\n2. Modify Cluster Mode to Compatible\n• Change the\
    \ existing replication group cluster mode from disabled to Compatible:\naws elasticache modify-replication-group \\\n\
    \ --replication-group-id <your-replication-group-id> \\\n --cluster-mode compatible \\\n --apply-immediately\n• In this\
    \ mode, ElastiCache behaves as a single shard cluster but supports both\ncluster mode enabled and disabled client connections.\n\
    3. Migrate All Clients to Cluster Mode Enabled\n• Update your application clients to support the cluster protocol using\
    \ the cluster\nconfiguration endpoint.\n• Validate application behavior in this intermediate compatible mode.\n• This\
    \ allows your client applications to start transitioning to the cluster-aware\nmode while maintaining backward compatibility.\n\
    4. Complete Cluster Mode Configuration\n• Once all client applications have been migrated and validated, finalize the\
    \ cluster\nmode by switching from Compatible to Enabled:\naws elasticache modify-replication-group \\\n --replication-group-id\
    \ <your-replication-group-id> \\\n --cluster-mode enabled \\\n --apply-immediately\n• This enforces cluster mode fully,\
    \ allowing scaling and other cluster features to be\nenabled."
  checks:
  - type: manual_review
    info: "List Cluster Mode Status for All Replication Groups\naws elasticache describe-replication-groups \\\n --query \"\
      ReplicationGroups[*].{ReplicationGroupId:ReplicationGroupId,\nClusterModeEnabled:ClusterEnabled}\"\n• This will output\
      \ a concise list showing each cluster's ID and whether Cluster\nMode is enabled (true) or not (false).\n• Review and\
      \ flag any replication group entries where \"ClusterModeEnabled\":\nfalse."
    severity: medium
- id: '5.12'
  title: Ensure ElastiCache is deployed across multiple Availability Zones (AZs)
  scoring: manual
  profile:
  - Level 2
  description: Deploying Amazon ElastiCache across multiple Availability Zones means configuring the cache cluster nodes (primary
    and replicas) to be distributed in different AZs within the same AWS region. This multi-AZ deployment improves fault tolerance
    and availability by mitigating risks associated with failure or degradation in a single Availability Zone. If the primary
    node or an AZ becomes unavailable, ElastiCache can automatically fail over to a replica in a different AZ, minimizing
    downtime and data unavailability.
  rationale: Distributing ElastiCache nodes across multiple AZs protects the caching layer from localized infrastructure failures,
    such as power outages, networking disruptions, or hardware faults in a single AZ.
  impact: Enabling multi-AZ deployment for ElastiCache clusters enhances system availability and resiliency, significantly
    reducing the risk of cache service interruptions due to an AZ failure or node disruption.
  references: []
  page_start: 146
  audit_raw: 'Audit All Replication Groups for Multi-AZ Status:

    aws elasticache describe-replication-groups --query

    "ReplicationGroups[*].{ID:ReplicationGroupId,MultiAZ:MultiAZ}"

    This returns true if Multi-AZ with automatic failover is enabled, otherwise false.'
  remediation: "1. Prerequisites for Enabling Multi-AZ on ElastiCache\n• VPC with Subnets in Multiple Availability Zones:\
    \ The VPC associated with your\nElastiCache replication group must have at least two subnets in different\nAvailability\
    \ Zones within the same AWS Region.\n• Cache Subnet Group Configuration: The cache subnet group used by the\nreplication\
    \ group must include multiple subnets spanning the desired AZs to\nsupport node placement.\n• Replication Group with At\
    \ Least One Replica: Multi-AZ requires a primary node\nand at least one read replica that can be deployed in a different\
    \ AZ to support\nautomatic failover.\n• Automatic Failover Enabled: Failover between primary and replicas is automatic\n\
    with Multi-AZ, so automatic failover must be enabled on the replication group\n(can be set at creation or modified later).\n\
    2. Modify the Replication Group to Enable Multi-AZ:\naws elasticache modify-replication-group \\\n --replication-group-id\
    \ <your-replication-group-id> \\\n --multi-az-enabled \\\n --apply-immediately\n• This command enables Multi-AZ with automatic\
    \ failover for the specified\nreplication group.\n• The --apply-immediately flag ensures the change happens without waiting\
    \ for the\nnext maintenance window. Use with caution in production."
  checks:
  - type: manual_review
    info: 'Audit All Replication Groups for Multi-AZ Status:

      aws elasticache describe-replication-groups --query

      "ReplicationGroups[*].{ID:ReplicationGroupId,MultiAZ:MultiAZ}"

      This returns true if Multi-AZ with automatic failover is enabled, otherwise false.'
    severity: medium
- id: '5.13'
  title: Ensure ElastiCache has automatic backups enabled
  scoring: manual
  profile:
  - Level 1
  description: Ensure that Amazon ElastiCache clusters that store critical or stateful data have automatic backups enabled
    with a non-zero retention period. This setting configures ElastiCache to take daily snapshots of caches and retain them
    for a defined number of days, allowing restoration of data in case of corruption, accidental deletion, or infrastructure
    failure.
  rationale: Automatic backups provide a simple and reliable way to recover ElastiCache data without relying solely on application-level
    safeguards. In the event of node failure, misconfiguration, or data corruption, a recent backup snapshot can be used to
    create a new cache or replication group, significantly reducing recovery time and impact on dependent applications.
  impact: Enabling automatic backups for ElastiCache ensures that cache data is regularly captured in snapshots, keeping it
    protected and readily recoverable in case of accidental deletion, corruption, or node failure. As a result, organizations
    can quickly recreate cache clusters from recent backups and restore access to the cached data, minimizing downtime and
    business impact from unexpected data loss events.
  references: []
  page_start: 148
  audit_raw: "1. List backup settings for all cache clusters (node-based):\naws elasticache describe-cache-clusters \\\n --show-cache-node-info\
    \ \\\n --query\n\"CacheClusters[*].{Id:CacheClusterId,Engine:Engine,SnapshotRetentionLimit:Sna\npshotRetentionLimit}\"\
    \n• SnapshotRetentionLimit > 0 ⇒ automatic backups enabled.\n• SnapshotRetentionLimit = 0 or null ⇒ automatic backups\
    \ disabled.\n2. List backup settings for all replication groups (Redis/Valkey):\naws elasticache describe-replication-groups\
    \ \\\n --query\n\"ReplicationGroups[*].{Id:ReplicationGroupId,Engine:Engine,SnapshotRetentionL\nimit:SnapshotRetentionLimit}\"\
    \n• Again, treat SnapshotRetentionLimit = 0 as non-compliant for this control."
  remediation: "Enable backups on a replication group (Redis/Valkey):\naws elasticache modify-replication-group \\\n --replication-group-id\
    \ <replication-group-id> \\\n --snapshot-retention-limit 7 \\\n --snapshotting-cluster-id <primary-cache-cluster-id> \\\
    \n --apply-immediately\n• replication-group-id is your replication group (e.g., my-redis-rg).\n• primary-cache-cluster-id\
    \ is the cache cluster ID that should be used as the daily\nsnapshot source (often the primary node, like my-redis-rg-001).\n\
    • snapshot-retention-limit 7 sets a 7-day retention; choose a value (1–35 days) per\nyour policy.\n• Optionally set or\
    \ adjust --preferred-maintenance-window or a specific --snapshotwindow if supported for your engine/version.\n• Use --apply-immediately\
    \ for immediate effect; omit it to apply in the next\nmaintenance window.\n• You can find the cluster IDs with:\naws elasticache\
    \ describe-cache-clusters \\\n --show-cache-node-info \\\n --query\n\"CacheClusters[*].{Id:CacheClusterId,ReplicationGroupId:ReplicationGroupId}\""
  checks:
  - type: manual_review
    info: "1. List backup settings for all cache clusters (node-based):\naws elasticache describe-cache-clusters \\\n --show-cache-node-info\
      \ \\\n --query\n\"CacheClusters[*].{Id:CacheClusterId,Engine:Engine,SnapshotRetentionLimit:Sna\npshotRetentionLimit}\"\
      \n• SnapshotRetentionLimit > 0 ⇒ automatic backups enabled.\n• SnapshotRetentionLimit = 0 or null ⇒ automatic backups\
      \ disabled.\n2. List backup settings for all replication groups (Redis/Valkey):\naws elasticache describe-replication-groups\
      \ \\\n --query\n\"ReplicationGro"
