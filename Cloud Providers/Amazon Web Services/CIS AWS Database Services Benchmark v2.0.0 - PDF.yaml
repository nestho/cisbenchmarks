  title: Ensure Monitor and Audit Activity is enabled
  scoring: manual
  profile:
  - Level 1
  description: Regular monitoring and auditing of activity in Amazon DynamoDB help ensure your database's security, performance,
    and compliance.
  rationale: This keeps track and ensures who has recently modified a document and monitors all activity within the database.
    This information allows the individual to use the details provided for auditing purposes and to address any compliance
    requirements.
  impact: ''
  references:
