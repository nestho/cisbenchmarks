- id: '2.6'
  title: Ensure Passwords are Regularly Rotated
  scoring: manual
  profile:
  - Level 1
  description: Regularly rotating your Aurora passwords is critical to access management, contributing to maintaining system
    security. The database password can be rotated in Amazon Aurora, but the access keys refer to the rotation of AWS IAM
    User access keys.
  rationale: Updating your password is critical to access AWS resources. This also ensures that your account is being kept
    safe from a potential threat.
  impact: Having the passwords updated frequently allows only the authorized individual to access the AWS resources.
  references:
  - 1. https://aws.amazon.com/products/databases/
  page_start: 35
  audit_raw: '1. Sign in to AWS Management Console

    • If you do not already have an AWS account, you will need to create one at

    https://aws.amazon.com.

    2. Navigate to Amazon RDS Dashboard

    • Navigate to the RDS service once logged in to the AWS Management Console.

    You can find this under the Database category.

    3. Choose your Aurora DB instance

    • In the RDS Dashboard, click on Databases, and then click on the name of your

    Aurora DB instance.

    4. Modify the instance

    • Click Modify.

    • In the Settings section, enter a new password in the Master password and

    Confirm password fields.

    5. Apply the changes

    • Scroll to the bottom and choose when to apply the changes. You can apply them

    immediately or schedule them for the next maintenance window.

    • Then, click Continue and Modify DB Instance.

    Note: Changing the master password will reboot the DB instance if you apply the

    change immediately.'
