- id: '3.15'
  title: Ensure ECS task definitions use awsvpc network mode
  scoring: manual
  profile:
  - Level 2
  description: 'ECS task definitions support four network modes: awsvpc, bridge, host, and none. In awsvpc mode, each task
    gets its own elastic network interface (ENI) with a private IP address, providing network-level isolation between tasks.
    In bridge and host modes, containers share the host''s network namespace and can communicate with other containers on
    the same instance directly. Tasks using the Fargate launch type are always awsvpc and are inherently compliant; this control
    applies to EC2 launch-type tasks.'
  rationale: When tasks use bridge or host network mode, containers share the host's network stack. A compromised container
    can reach other containers on the same host via localhost and mapped ports, access services listening on the host network,
    and intercept network traffic. The awsvpc network mode provides each task with its own ENI and security group, enabling
    per-task network policies and preventing lateral movement between containers on the same instance.
  impact: The awsvpc mode consumes one ENI per task, which is limited by the instance type's ENI capacity. This may require
    larger instance types or enabling ENI trunking.
  references: []
  page_start: 117
  audit_raw: "The audit prioritizes task definitions currently in use by services or running tasks. aws\necs list-task-definitions\
    \ --status ACTIVE returns every revision ever\nregistered (commonly hundreds or thousands per account), most of which\
    \ no workload\nis actually launching anymore — auditing them all produces noise. Steps 1–3 cover\nwhat is in use; Step\
    \ 5 is an optional secondary sweep for orphan revisions that should\nbe deregistered.\n1. List all ECS clusters in the\
    \ region:\naws ecs list-clusters --region $AWS_REGION --query 'clusterArns[]' --output\ntable\n2. For each cluster returned\
    \ above, list the task definitions referenced by its\nservices and by its running tasks:\n# Services in the cluster —\
    \ note their taskDefinition\naws ecs list-services --cluster <cluster-arn> --region $AWS_REGION --query\n'serviceArns[]'\
    \ --output table\naws ecs describe-services --cluster <cluster-arn> --services <service-arn> --\nregion $AWS_REGION \\\
    \n --query 'services[].{Service:serviceName,TaskDefinition:taskDefinition}' --\noutput table\n# Running tasks in the cluster\
    \ — note their taskDefinitionArn\naws ecs list-tasks --cluster <cluster-arn> --region $AWS_REGION --query\n'taskArns[]'\
    \ --output table\naws ecs describe-tasks --cluster <cluster-arn> --tasks <task-arn> --region\n$AWS_REGION \\\n --query\
    \ 'tasks[].{Task:taskArn,TaskDefinition:taskDefinitionArn}' --output\ntable\n• Collect the unique set of task definition\
    \ ARNs from these outputs.\n3. For each unique task definition ARN collected in Step 2, inspect its network\nmode and\
    \ compatibility:\naws ecs describe-task-definition --task-definition <task-definition-arn> --\nregion $AWS_REGION \\\n\
    \ --query\n'taskDefinition.{Family:family,Revision:revision,NetworkMode:networkMode,Comp\nat:requiresCompatibilities}'\
    \ --output table\n• Confirm if NetworkMode: awsvpc for all task definitions.\n• NetworkMode: bridge, host, or none are\
    \ non-compliant unless covered by a\ndocumented exception.\n• A task definition with requiresCompatibilities: [FARGATE]\
    \ is implicitly compliant\n— Fargate forces awsvpc.\n5. (Optional) Sweep historical task definition revisions still marked\
    \ ACTIVE. Old\nnon-compliant revisions never expire and can be re-launched accidentally via\nrun-task. List every active\
    \ revision, then run Step 3 against any that look\nsuspicious; deregister or document them as exceptions:\naws ecs list-task-definitions\
    \ --status ACTIVE --region $AWS_REGION \\\n --query 'taskDefinitionArns[]' --output table"
  remediation: "Migrating a task from bridge/host to 'awsvpc' is more involved than re-registering the\ntask definition —\
    \ port mappings and other configurations all change with the network\nmodel. Validate in non-production first.\n1. Retrieve\
    \ the existing container definitions:\naws ecs describe-task-definition --task-definition <task-family> --region\n$AWS_REGION\
    \ \\\n --query 'taskDefinition.containerDefinitions' --output json >\n/tmp/containers.json\n2. If the source task definition\
    \ is bridge mode and has any 'portMappings', edit\n'/tmp/containers.json' before re-registering. In awsvpc mode every\
    \ 'hostPort' must\nequal its 'containerPort', but bridge mode commonly uses 'hostPort: 0' (random\nport assigned at runtime)\
    \ or a custom host port. Without this edit the next step\nfails.\n• For each port mapping, either set 'hostPort' to match\
    \ 'containerPort', or delete the\n'hostPort' line so it defaults correctly.\n• You can leave container-level memory in\
    \ place — awsvpc' accepts it as-is.\n3. Register the new revision:\naws ecs register-task-definition --family <task-family>\
    \ --region $AWS_REGION\n\\\n --network-mode awsvpc \\\n --container-definitions file:///tmp/containers.json \\\n --requires-compatibilities\
    \ <launch-type>\n• Set <launch-type> to EC2 if the workload runs on EC2, or\nMANAGED_INSTANCES if it runs on ECS Managed\
    \ Instances (Fargate already\nforces awsvpc, so it cannot be the source of a non-compliant taskdef)\n4. Update each service\
    \ to the new revision with awsvpcConfiguration:\n• If the service is fronted by an ALB or NLB, the existing target group\
    \ cannot be\nreused — bridge/host services use 'target-type: instance' while awsvpc services\nrequire 'target-type: ip'.\
    \ Create a new ip-type target group, switch the listener rule\nto it, and pass the new target group ARN in '--load-balancers'\
    \ below.\naws ecs update-service --cluster <cluster> --service <service> --region\n$AWS_REGION \\\n --task-definition\
    \ <task-family>:<new-revision> \\\n --network-configuration 'awsvpcConfiguration={subnets=[subnetxxx],securityGroups=[sg-xxx],assignPublicIp=DISABLED}'\
    \ \\\n --load-balancers '[{\"targetGroupArn\":\"<new-ip-tgarn>\",\"containerName\":\"<name>\",\"containerPort\":<port>}]'\
    \ \\\n --force-new-deployment"
  checks:
  - type: manual_review
    info: 'The audit prioritizes task definitions currently in use by services or running tasks. aws

      ecs list-task-definitions --status ACTIVE returns every revision ever

      registered (commonly hundreds or thousands per account), most of which no workload

      is actually launching anymore — auditing them all produces noise. Steps 1–3 cover

      what is in use; Step 5 is an optional secondary sweep for orphan revisions that should

      be deregistered.

      1. List all ECS clusters in the region:

      aws ecs list-clusters --region '
    severity: medium
- id: '3.16'
  title: Ensure ECS Exec sessions have audit logging enabled
  scoring: manual
  profile:
  - Level 1
  description: 'When ECS Exec is enabled, users with appropriate IAM permissions can open interactive shell sessions to running
    containers using the aws ecs execute-command CLI. ECS supports three session-logging modes via the cluster''s executeCommandConfiguration.logging
    property: • NONE — session logging is turned off entirely. • DEFAULT — session output is sent to whatever awslogs driver
    is configured on the task definition. If the task has no awslogs driver, no log is saved. • OVERRIDE — session output
    is sent to a dedicated CloudWatch Logs log group, an S3 bucket, or both, specified in logConfiguration. Only OVERRIDE
    provides a dedicated, organization-controlled audit destination.'
  rationale: ECS Exec provides direct shell access to running containers, equivalent to SSH access to a server. Without dedicated
    session logging, a malicious insider or compromised credential holder can exfiltrate data, modify runtime configuration,
    or install backdoors with no audit trail. Sending session logs to a dedicated CloudWatch Logs group or S3 bucket (with
    OVERRIDE) ensures all session activity is recorded in a destination the security team controls and can retain independently
    from application logs.
  impact: ''
  references: []
  page_start: 121
  audit_raw: "1. List all ECS clusters in the region:\naws ecs list-clusters --region $AWS_REGION --query 'clusterArns[]'\
    \ --output\ntable\n2. For each cluster, check whether any service has ECS Exec enabled:\naws ecs list-services --cluster\
    \ <cluster-arn> --region $AWS_REGION --query\n'serviceArns[]' --output table\naws ecs describe-services --cluster <cluster-arn>\
    \ --services <service-arn> --\nregion $AWS_REGION \\\n --query 'services[?enableExecuteCommand==`true`].[serviceName]'\
    \ --output\ntable\nIf no service has enableExecuteCommand=true, the cluster Passes — skip the\nremaining steps for that\
    \ cluster.\n3. For any cluster from Step 2 with at least one Exec-enabled service, check the\ncluster's session-logging\
    \ mode:\naws ecs describe-clusters --clusters <cluster-arn> --include CONFIGURATIONS -\n-region $AWS_REGION \\\n --query\
    \ 'clusters[].configuration.executeCommandConfiguration.logging' --\noutput text\n• The cluster Passes if the value is\
    \ OVERRIDE.\n• The cluster Fails if the value is None, NONE, or DEFAULT (an empty/None\nresult means the cluster was created\
    \ without an executeCommandConfiguration\nand behaves like DEFAULT)."
  remediation: "1. Create the destination CloudWatch log group:\naws logs create-log-group --log-group-name /ecs/exec-audit-logs\
    \ --region\n$AWS_REGION\naws logs put-retention-policy --log-group-name /ecs/exec-audit-logs --region\n$AWS_REGION \\\n\
    \ --retention-in-days 365\n2. For each cluster that Failed the audit, enable session logging in OVERRIDE\nmode pointing\
    \ at the log group from Step 1:\naws ecs update-cluster --cluster <cluster-name> --region $AWS_REGION \\\n --configuration\
    \ '{\n \"executeCommandConfiguration\": {\n \"logging\": \"OVERRIDE\",\n \"logConfiguration\": {\n \"cloudWatchLogGroupName\"\
    : \"/ecs/exec-audit-logs\"\n }\n }\n }'\n3. ECS Exec settings are evaluated at task launch, so force affected services\
    \ to\nredeploy:\naws ecs update-service --cluster <cluster-name> --service <service-name> --\nregion $AWS_REGION \\\n\
    \ --force-new-deployment\n4. Verify the configuration was applied:\naws ecs describe-clusters --clusters <cluster-name>\
    \ --include CONFIGURATIONS\n--region $AWS_REGION \\\n --query 'clusters[].configuration.executeCommandConfiguration' --output\n\
    json"
  checks:
  - type: manual_review
    info: "1. List all ECS clusters in the region:\naws ecs list-clusters --region $AWS_REGION --query 'clusterArns[]' --output\n\
      table\n2. For each cluster, check whether any service has ECS Exec enabled:\naws ecs list-services --cluster <cluster-arn>\
      \ --region $AWS_REGION --query\n'serviceArns[]' --output table\naws ecs describe-services --cluster <cluster-arn> --services\
      \ <service-arn> --\nregion $AWS_REGION \\\n --query 'services[?enableExecuteCommand==`true`].[serviceName]' --output\n\
      table\nIf no service has enable"
    severity: medium
- id: '5.1'
  title: Apply updates to any apps running in Lightsail
  scoring: manual
  profile:
  - Level 1
  description: Amazon Lightsail is a virtual private server (VPS) provider and is the easiest way to get started with AWS
    for developers, small businesses, students, and other users who need a solution to build and host their applications on
    cloud.
  rationale: Lightsail offers a range of operating system and application templates that are automatically installed when
    you create a new Lightsail instance. Application templates include WordPress, Drupal, Joomla!, Ghost, Magento, Redmine,
    LAMP, Nginx (LEMP), MEAN, Node.js, Django, and more. You can install additional software on your instances by using the
    in-browser SSH or your own SSH client.
  impact: ''
  references:
  - 1. https://lightsail.aws.amazon.com/ls/docs/en_us/overview
  - 2. https://aws.amazon.com/lightsail/features/?opdp2=features/?pg=ln&sec=hs
  page_start: 125
  audit_raw: 'To confirm that you are running the latest version of the application you are using is a

    manual process. Often dependent on the application itself and the operating system you

    are utilizing for the Lightsail instance.

    From the Console:

    1. Login to AWS Console using https://console.aws.amazon.com

    2. Click All services, click Lightsail under Compute.

    3. This will open up the Lightsail console.

    4. Select the Instance you want to review.

    5. Make sure the instance status is running.

    6. Connect to the instance.

    7. Depending on the instance OS and the application you are running determine

    what version it is and if there are any updates.

    8. If there are updates refer to the remediation below.

    9. Repeat steps no. 4 – 8 to verify if any Lightsail instances require application

    updates.'
  remediation: 'To process and apply the latest updates for the application you are using is a manual

    process. Often dependent on the application itself and the operating system you are

    utilizing for the Lightsail instance.

    From the Console:

    1. Login to AWS Console using https://console.aws.amazon.com

    2. Click All services, click Lightsail under Compute.

    3. This will open up the Lightsail console.

    4. Select the Instance you want to update.

    5. Make sure the instance status is running.

    6. Click on Snapshots

    7. Under Manual snapshots click on + Create snapshot

    8. Give it a name you will recognize

    9. Click on create

    while in process it will show ''Snapshotting...''

    10. Once the date and time and snapshot name appears it is completed.

    11. Click on Connect

    12. Run the updates for the application discovered above in the Audit.

    13. Repeat steps no. 4 – 12 to apply any application updates required on the

    Lightsail instances that you are running.'
  checks:
  - type: manual_review
    info: 'To confirm that you are running the latest version of the application you are using is a

