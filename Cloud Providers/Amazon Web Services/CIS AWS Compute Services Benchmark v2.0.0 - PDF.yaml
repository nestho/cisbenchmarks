- id: '2.14'
  title: Ensure EC2 Auto Scaling Groups Propagate Tags to EC2 Instances that it launches
  scoring: scored
  profile:
  - Level 1
  description: 'Tags can help with managing, identifying, organizing, searching for, and filtering resources. Additionally,
    tags can help with security and compliance. Tags can be propagated from an Auto Scaling group to the EC2 instances that
    it launches. Ensure that Amazon ECS task definitions using host network mode do not allow privileged or root user access.
    This protects the host container instance from unauthorized access and privilege escalation. Note: This recommendation
    assumes that only the latest active revision of a task definition is in use. If older revisions are in use, apply the
    audit and remediation procedures to those revisions as needed.'
  rationale: Without tags, EC2 instances created via Auto Scaling can be without tags and could be out of compliance with
    security policy. Combining host networking mode with privileged or root user access significantly increases the risk of
    container breakout, where a compromised container can gain control of the host system.
  impact: There may be some administrative effort required to ensure Amazon ECS applications function as expected without
    privileged or root user access.
  references:
  - 1. https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scalingtagging.html
  - 1. https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_definition
  - 2. https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_definition
  page_start: 75
  audit_raw: 'AWS Console

    1. Login to AWS Console using https://console.aws.amazon.com

    2. Click All services and click EC2 under Compute.

    3. Select Auto Scaling Groups.

    4. For each Auto Scaling Group''s Details, ensure that all tags have Tag new

    instances set to Yes.

    5. Repeat Steps 1-4 for each AWS Region used.

    AWS CLI

    1. Run aws autoscaling describe-auto-scaling-groups.

    2. Ensure PropogateAtLaunch is true under Tags for each Tag for the Auto

    Scaling Group.

    3. Repeat Steps 1-2 for each AWS Region used.

    From Console:

    1. Login to the ECS console using https://console.aws.amazon.com/ecs/.

    2. In the left panel, click Task definitions.

    3. Click the name of a task definition.

    4. Click on the latest active revision of the task definition.

    5. If Network mode is set to host, click JSON.

    6. For each element under containerDefinitions, ensure that privileged is set

    to false or is absent, and ensure that user is not set to root or is absent.

    7. Repeat steps 1-6 for each task definition.

    From Command Line:

    Run the following command to list task definitions:

    aws ecs list-task-definitions

    For the latest revision of a task definition, run the following command:

    aws ecs describe-task-definition --task-definition <task-definition-arn>

    If networkMode is set to host, ensure that for each element under

    containerDefinitions, privileged is set to false or is absent, and ensure that

    user is not set to root or is absent.

    Repeat for each task definition.'
  remediation: "AWS Console\n1. Login to AWS Console using https://console.aws.amazon.com\n2. Click All services and click\
    \ EC2 under Compute.\n3. Select Auto Scaling Groups.\n4. Click Edit for each Auto Scaling Group.\n5. Check the Tag new\
    \ instances Box for the Auto Scaling Group.\n6. Click Update.\n7. Repeat Steps 1-6 for each AWS Region used.\nAWS CLI\n\
    1. Run aws autoscaling create-or-update-tags for tags that are not set to\nPropogateAtLaunch for each Auto Scaling Group\
    \ that does not have this\nproperty set to true.\naws autoscaling create-or-update-tags \\\n --tags ResourceId=example-autoscaling-group,ResourceType=auto-scalinggroup,Key=TagKey,Value=TagValue,PropagateAtLaunch=true\n\
    2. Repeat Step 1 for each AWS Region used.\nFrom Console:\n1. Login to the ECS console using https://console.aws.amazon.com/ecs/.\n\
    2. In the left panel, click Task definitions.\n3. Click the name of a task definition.\n4. Click on the latest active\
    \ revision of the task definition.\n5. Click Create new revision.\n6. Click Create new revision with JSON.\n7. For each\
    \ element under containerDefinitions, set privileged to false, or\nremove \"privileged\": true.\n8. For each element under\
    \ containerDefinitions, set user to an appropriate\nnon-root user, or remove \"user\": \"root\".\n9. Click Create.\n10.\
    \ Repeat steps 1-9 for each task definition requiring remediation.\nNote: When a task definition is updated, running tasks\
    \ launched from the previous task\ndefinition remain unchanged. Updating a running task requires redeploying it with the\n\
    new task definition."
  checks:
  - type: manual_review
    info: 'AWS Console

      1. Login to AWS Console using https://console.aws.amazon.com

      2. Click All services and click EC2 under Compute.

      3. Select Auto Scaling Groups.

      4. For each Auto Scaling Group''s Details, ensure that all tags have Tag new

      instances set to Yes.

      5. Repeat Steps 1-4 for each AWS Region used.

      AWS CLI

      1. Run aws autoscaling describe-auto-scaling-groups.

      2. Ensure PropogateAtLaunch is true under Tags for each Tag for the Auto

      Scaling Group.

      3. Repeat Steps 1-2 for each AWS Region used.

      From C'
