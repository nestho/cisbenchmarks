- id: '12.14'
  title: Ensure Lambda recursive invocation detection is enabled
  scoring: manual
  profile:
  - Level 1
  description: Lambda functions triggered by event sources such as S3 or SQS can create recursive invocation loops when they
    write back to the same resource that triggers them. AWS Lambda supports recursive loop detection at the account level
    which automatically stops recursive invocations after approximately 16 loops. This feature should remain enabled and be
    supplemented with reserved concurrency limits on functions with recursive risk.
  rationale: A recursive invocation loop can scale Lambda to maximum concurrency within minutes, resulting in runaway costs
    (potentially tens of thousands of dollars) and denial of service to other Lambda workloads in the account. Recursive loop
    detection provides an automatic circuit breaker, while reserved concurrency limits provide a per-function safeguard against
    unbounded scaling.
  impact: Legitimate recursive patterns (intentional multi-step processing on the same queue/bucket) must be redesigned to
    use separate resources for input and output, or use step functions. Recursive loop detection may prematurely terminate
    intentional recursive workflows.
  references: []
  page_start: 217
  audit_raw: "1. List all Lambda functions in the region:\naws lambda list-functions --region $AWS_REGION --query\n'Functions[].FunctionName'\
    \ --output table\n2. For each function, check whether recursive loop detection is enabled (the\naccount-level default\
    \ is Terminate):\naws lambda get-function-recursion-config --function-name <function-name> --\nregion $AWS_REGION \\\n\
    \ --query 'RecursiveLoop' --output text\nThe function Fails if the returned value is Allow (detection disabled). The Passing\
    \ value\nis Terminate."
  remediation: "1. For each function that Failed the audit, re-enable recursive loop detection:\naws lambda put-function-recursion-config\
    \ --function-name <function-name> --\nregion $AWS_REGION \\\n --recursive-loop Terminate\n2. Verify by repeating audit\
    \ step 2 on the function."
  checks:
  - type: manual_review
    info: "1. List all Lambda functions in the region:\naws lambda list-functions --region $AWS_REGION --query\n'Functions[].FunctionName'\
      \ --output table\n2. For each function, check whether recursive loop detection is enabled (the\naccount-level default\
      \ is Terminate):\naws lambda get-function-recursion-config --function-name <function-name> --\nregion $AWS_REGION \\\
      \n --query 'RecursiveLoop' --output text\nThe function Fails if the returned value is Allow (detection disabled). The\
      \ Passing value\nis Terminate."
    severity: medium
- id: '12.15'
  title: Ensure Lambda function URLs do not use wildcard CORS origins
  scoring: manual
  profile:
  - Level 1
  description: 'Lambda function URLs support an optional CORS configuration including AllowOrigins, AllowCredentials, AllowMethods,
    and AllowHeaders. This recommendation applies only when CORS is configured on the function URL; function URLs without
    a CORS block are out of scope and pass automatically. When CORS is configured, AllowOrigins must not be set to * (wildcard),
    which would allow any website to make cross-origin requests to the function URL. Combined with AllowCredentials: true,
    this enables credentialbearing cross-origin requests from any origin.'
  rationale: A wildcard CORS origin allows any malicious website to make authenticated crossorigin requests to the Lambda
    function URL. If a victim visits an attacker-controlled page while authenticated, the attacker's JavaScript can read the
    function's response data, including user data, session tokens, or application secrets. Restricting origins to known application
    domains prevents unauthorized cross-origin data access.
  impact: Applications with legitimate multi-origin requirements must enumerate all allowed origins explicitly. This may require
    updates when new frontend domains are added.
  references: []
  page_start: 219
  audit_raw: "1. List all Lambda functions in the region:\naws lambda list-functions --region $AWS_REGION --query\n'Functions[].FunctionName'\
    \ --output table\n2. For each function returned above, check whether it has a function URL\nconfigured:\naws lambda get-function-url-config\
    \ --function-name <function-name> --region\n$AWS_REGION \\\n --query '{AuthType:AuthType,Cors:Cors}' --output json\n•\
    \ If the command returns ResourceNotFoundException, the function has no URL\n(skip).\n• Otherwise, inspect the Cors.AllowOrigins\
    \ value in the output. The function URL\nFails if AllowOrigins contains * (wildcard). This is especially severe when\n\
    combined with AllowCredentials: true."
  remediation: "1. For each function URL that Failed the audit, update the CORS configuration to\nallow only specific origins:\n\
    aws lambda update-function-url-config --function-name <function-name> --\nregion $AWS_REGION \\\n --cors '{\n \"AllowOrigins\"\
    : [\"https://app.example.com\", \"https://admin.example.com\"],\n \"AllowMethods\": [\"GET\", \"POST\"],\n \"AllowHeaders\"\
    : [\"Content-Type\", \"Authorization\"],\n \"AllowCredentials\": true\n }'\n2. Verify by repeating audit step 2 on the\
    \ function."
  checks:
  - type: manual_review
    info: "1. List all Lambda functions in the region:\naws lambda list-functions --region $AWS_REGION --query\n'Functions[].FunctionName'\
      \ --output table\n2. For each function returned above, check whether it has a function URL\nconfigured:\naws lambda\
      \ get-function-url-config --function-name <function-name> --region\n$AWS_REGION \\\n --query '{AuthType:AuthType,Cors:Cors}'\
      \ --output json\n• If the command returns ResourceNotFoundException, the function has no URL\n(skip).\n• Otherwise,\
      \ inspect the Cors.AllowOrigins va"
    severity: medium
- id: '12.16'
  title: Ensure AWS Lambda Function URLs are configured to use AWS IAM authentication
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: AWS Lambda Function URLs provide dedicated HTTPS endpoints for Lambda functions. The AuthType setting determines
    how requests are authenticated. When AuthType is configured as NONE, requests can be accepted without AWS IAM authentication,
    potentially exposing the function to unauthenticated internet access if the associated resource policy permits public
    invocation. Publicly accessible Lambda Function URLs can increase the attack surface and may be abused for unauthorized
    access, denial-of-service activity, data exfiltration, command-and-control infrastructure, or other malicious purposes.
    Configuring Lambda Function URLs to use AWS_IAM ensures that requests are authenticated and authorized through AWS Identity
    and Access Management before the function is invoked. By default, Lambda functions run in an AWS managed VPC with unrestricted
    outbound internet access. Functions that access private resources, such as RDS or internal APIs or that process sensitive
    data such as PII, should instead be deployed within a customer managed VPC to enforce network boundary controls through
    security groups and network ACLs.
  rationale: Lambda Function URLs configured with AuthType = NONE create internet-reachable HTTPS endpoints that do not require
    AWS IAM authentication. Such endpoints may be unintentionally exposed, difficult to inventory, and susceptible to misuse.
    Requiring AWS_IAM authentication enforces identity-based access control, supports the principle of least privilege, and
    reduces the likelihood of unauthorized invocation or abuse of Lambda-hosted services. Without VPC configuration, Lambda
    functions have unrestricted outbound access, meaning sensitive data could be exfiltrated with no network level controls
    in place to detect or stop it. Security groups, network ACLs, and standard network monitoring tools cannot be applied
    to functions outside a VPC. This is required under frameworks such as FedRAMP and is auditable today using the AWS Config
    managed rule lambda inside vpc.
  impact: Applications intentionally designed for public anonymous access may require architectural changes. Such workloads
    should instead be fronted by managed services such as API Gateway, CloudFront, or other approved ingress mechanisms that
    provide appropriate authentication, authorization, monitoring, and abuse protection controls. Deploying functions within
    a VPC may increase cold start latency and requires a NAT gateway for outbound internet access, along with additional IAM
    permissions for network interface management (may have additional costs). These tradeoffs are well documented by AWS and
    proportionate for functions handling sensitive data.
  references:
  - 1. https://docs.aws.amazon.com/controltower/latest/controlreference/lambdarules.html
  - 2. https://docs.aws.amazon.com/lambda/latest/dg/urls-auth.html
  - 1. https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc.html
  - 2. https://docs.aws.amazon.com/config/latest/developerguide/lambda-insidevpc.html
  page_start: 221
  audit_raw: 'Identify Lambda Function URLs where:

    aws lambda list-function-url-configs

    Review the value of:

    "AuthType": "NONE"

    Any Lambda Function URL configured with AuthType other than AWS_IAM should be

    considered a finding.

    From the Console

    1. Navigate to AWS Lambda

    2. For each function, open Configuration, then VPC

    3. Confirm a customer managed VPC, subnets, and security groups are configured

    4. Functions showing No VPC that access private resources or sensitive data are

    non compliant

    5. Repeat for each function in the current region, then repeat for all other regions'
  remediation: 'Update the Lambda Function URL configuration:

    aws lambda update-function-url-config --function-name <function-name>

    --auth-type AWS_IAM

    From the Console

    1. Navigate to the non compliant function, open Configuration, then VPC, then Edit

    2. Select the target VPC and at least two private subnets across different

    Availability Zones

    3. Select or create security groups enforcing least privilege for inbound and

    outbound traffic

    4. Save the configuration'
  checks:
  - type: manual_review
    info: 'Identify Lambda Function URLs where:

      aws lambda list-function-url-configs

      Review the value of:

      "AuthType": "NONE"

      Any Lambda Function URL configured with AuthType other than AWS_IAM should be

      considered a finding.

      From the Console

      1. Navigate to AWS Lambda

      2. For each function, open Configuration, then VPC

      3. Confirm a customer managed VPC, subnets, and security groups are configured

      4. Functions showing No VPC that access private resources or sensitive data are

      non compliant

      5. Repeat for each '
    severity: medium
