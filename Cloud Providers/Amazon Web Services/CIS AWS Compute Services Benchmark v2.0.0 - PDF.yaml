- id: 2.2.1
  title: Ensure EBS volume encryption is enabled
  scoring: scored
  profile:
  - Level 1
  description: Elastic Compute Cloud (EC2) supports encryption at rest when using the Elastic Block Store (EBS) service. While
    disabled by default, forcing encryption at EBS volume creation is supported.
  rationale: Encrypting data at rest reduces the likelihood that it is unintentionally exposed and can nullify the impact
    of disclosure if the encryption remains unbroken.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/ebs/latest/userguide/ebs-encryption.html
  - 2. https://aws.amazon.com/blogs/aws/new-opt-in-to-default-encryption-for-new-ebsvolumes/
  page_start: 34
  audit_raw: 'From Console:

    1. Login to the EC2 console using https://console.aws.amazon.com/ec2/

    2. Under Account attributes, click EBS encryption.

    3. Verify Always encrypt new EBS volumes displays Enabled.

    4. Review every region in-use.

    Note: EBS volume encryption is configured per region.

    From Command Line:

    1. Run

    aws --region <region> ec2 get-ebs-encryption-by-default

    2. Verify that "EbsEncryptionByDefault": true is displayed.

    3. Review every region in-use.

    Note: EBS volume encryption is configured per region.'
  remediation: 'From Console:

    1. Login to the EC2 console using https://console.aws.amazon.com/ec2/

    2. Under Account attributes, click EBS encryption.

    3. Click Manage.

    4. Click the Enable checkbox.

    5. Click Update EBS encryption

    6. Repeat for every region requiring the change.

    Note: EBS volume encryption is configured per region.

    From Command Line:

    1. Run

    aws --region <region> ec2 enable-ebs-encryption-by-default

    2. Verify that "EbsEncryptionByDefault": true is displayed.

    3. Repeat every region requiring the change.

    Note: EBS volume encryption is configured per region.'
  checks:
  - type: manual_review
    info: 'From Console:

      1. Login to the EC2 console using https://console.aws.amazon.com/ec2/

      2. Under Account attributes, click EBS encryption.

      3. Verify Always encrypt new EBS volumes displays Enabled.

      4. Review every region in-use.

      Note: EBS volume encryption is configured per region.

      From Command Line:

      1. Run

      aws --region <region> ec2 get-ebs-encryption-by-default

      2. Verify that "EbsEncryptionByDefault": true is displayed.

      3. Review every region in-use.

      Note: EBS volume encryption is configured per re'
    severity: medium
- id: 2.2.2
  title: Ensure Public Access to EBS Snapshots is Disabled
  scoring: scored
  profile:
  - Level 1
  description: To protect your data disable the public mode of EBS snapshots.
  rationale: This protects your data so that it is not accessible to all AWS accounts preventing accidental access and leaks.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/ebs/latest/userguide/ebs-snapshots.html
  - 2. https://awscli.amazonaws.com/v2/documentation/api/latest/reference/ec2/describ
  page_start: 36
  audit_raw: "Perform the following to determine if a snapshot is shared publicly:\nFrom the Console\n1. Login to the EC2\
    \ console at https://console.aws.amazon.com/ec2/.\n2. In the left pane click Snapshots.\n3. Select the snapshot then click\
    \ Actions, Modify Permissions.\n4. Confirm that the snapshot is set to Private\n5. Repeat for any additional Snapshots,\
    \ Regions and AWS accounts.\nIf the snapshot is set to public refer to the remediation below.\nFrom the CLI\n1. For each\
    \ snapshot, run\naws ec2 describe-snapshot-attribute \\\n --snapshot-id <snapshot-ID> \\\n --attribute createVolumePermission\n\
    2. Validate Group is not set to all."
  remediation: "Perform the following to set a snapshot to private:\nFrom the Console\n1. Login to the EC2 console at https://console.aws.amazon.com/ec2/.\n\
    2. In the left pane click Snapshots.\n3. Select the snapshot then click 'Actions, Modify Permissions`.\n4. Click the radio\
    \ button for Private\n5. Click Save\n6. Repeat for any additional Snapshots, Regions and AWS accounts.\nFrom the CLI\n\
    1. For each snapshot, run\naws ec2 modify-snapshot-attribute \\\n --snapshot-id <snapshot-ID> \\\n --attribute createVolumePermission\
    \ \\\n --operation remove --group-name all"
  checks:
  - type: manual_review
    info: 'Perform the following to determine if a snapshot is shared publicly:

      From the Console

      1. Login to the EC2 console at https://console.aws.amazon.com/ec2/.

      2. In the left pane click Snapshots.

      3. Select the snapshot then click Actions, Modify Permissions.

      4. Confirm that the snapshot is set to Private

      5. Repeat for any additional Snapshots, Regions and AWS accounts.

      If the snapshot is set to public refer to the remediation below.

      From the CLI

      1. For each snapshot, run

      aws ec2 describe-snapshot-att'
    severity: medium
- id: 2.2.3
  title: Ensure EBS volume snapshots are encrypted
  scoring: scored
  profile:
  - Level 1
  description: Elastic Compute Cloud (EC2) supports encryption at rest when using the Elastic Block Store (EBS) service.
  rationale: Encrypting data at rest reduces the likelihood that it is unintentionally exposed and can nullify the impact
    of disclosure if the encryption remains unbroken.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/ebs/latest/userguide/ebs-encryption.html
  - 2. https://awscli.amazonaws.com/v2/documentation/api/latest/reference/ec2/describ
  page_start: 38
  audit_raw: 'From Console:

    1. Login to the EC2 console using https://console.aws.amazon.com/ec2/

    2. Under Elastic Block Store, click Snapshots.

    3. Click the snapshot you want to review.

    4. Select the Description tab.

    5. Review the Encryption setting.

    6. If it reads encrypted you are all set.

    If it is set to Not Encrypted refer to the remediation below.

    Note: EBS snapshot volume encryption is configured per snapshot.

    From Command Line:

    1. Run describe-snapshots

    aws ec2 describe-snapshots --owner-ids <account number> --filter

    Name=status,Values=completed --query "Snapshots[*].{ID:SnapshotId}"

    2. This will provide a list of all the snapshots associated with that account in the

    region.

    3. For every snapshot listed - Run - describe-snapshots

    aws ec2 describe-snapshots --snapshot-id <snap-name> --query

    "Snapshots[*].{Encrypt:Encrypted}"

    4. If the output reads "Encrypt": true, Encryption is set on the snapshot.

    If the output reads "Encrypt": false refer to the remediation below.

    Note: EBS snapshot volume encryption is configured per snapshot.'
  remediation: 'From Console:

    1. Login to the EC2 console using https://console.aws.amazon.com/ec2/

    2. Under Elastic Block Store, click Snapshots`.

    3. Select the snapshot you want to encrypt.

    4. Click on Actions select Copy.

    Confirm `Snapshot ID`

    Set the `Destination Region`

    Update the `Description`

    Select the check box for `Encryption`

    5. Check the box for Encrypt this snapshot

    6. Set the Master Key

    7. Click on Copy

    8. Repeat steps 3-7 for the snapshots that need to be encrypted.

    9. Delete any of the unencrypted snapshots that are not longer needed.

    Note: EBS snapshot volume encryption is configured per snapshot.

    From Command Line:

    Using the snapshot ids gathered from the Audit section

    1. Run - copy-snapshot

    aws ec2 copy-snapshot --source-region <region> --source-snapshot-id <snapid> --description "Name of the new snapshot"
    --encrypted

    2. This will copy the existing unencrypted snapshot and set it to encrypted

    The output will show the new SnapshotId

    3. Run - describe-snapshots

    aws ec2 describe-snapshots --owner-ids <account id> --filter

    Name=status,Values=completed --query "Snapshots[*].{ID:SnapshotId}"

    Once the new Snapshot shows in the list confirm encryption is set

    4. Run - describe-snapshots

    aws ec2 describe-snapshots --snapshot-id <snap-name> --query

    "Snapshots[*].{Encrypt:Encrypted}"

    5.Repeat steps 1-4 for the snapshots that need to be encrypted.

    Delete snapshots that are no longer needed.

    6. Run - delete-snapshot

    aws ec2 delete-snapshot --snapshot-id <snap-name>

    7. Repeat for all unencrypted snapshots that have been copied and encrypted.

    Note: EBS snapshot volume encryption is configured per snapshot.'
  checks:
  - type: manual_review
    info: 'From Console:

      1. Login to the EC2 console using https://console.aws.amazon.com/ec2/

      2. Under Elastic Block Store, click Snapshots.

      3. Click the snapshot you want to review.

      4. Select the Description tab.

      5. Review the Encryption setting.

      6. If it reads encrypted you are all set.

      If it is set to Not Encrypted refer to the remediation below.

      Note: EBS snapshot volume encryption is configured per snapshot.

      From Command Line:

      1. Run describe-snapshots

      aws ec2 describe-snapshots --owner-ids <account '
    severity: medium
- id: 2.2.4
  title: Ensure unused EBS volumes are removed
  scoring: manual
  profile:
  - Level 1
  description: Identify any unused Elastic Block Store (EBS) volumes in your AWS account and remove them.
  rationale: Any Elastic Block Store volume created in your AWS account contains data, regardless of being used or not. If
    you have EBS volumes (other than root volumes) that are unattached to an EC2 instance they should be removed to prevent
    unauthorized access or data leak to any sensitive data on these volumes.
  impact: Once a EBS volume is deleted, the data will be lost. If this is data that you need to archive, create an encrypted
    EBS snapshot before deleting them.
  references:
  - 1. https://awscli.amazonaws.com/v2/documentation/api/latest/reference/ec2/describ
  - 2. https://awscli.amazonaws.com/v2/documentation/api/latest/reference/ec2/deletevolume.html
  page_start: 41
  audit_raw: 'From Console:

    1. Login to the EC2 console using https://console.aws.amazon.com/ec2/

    2. Under Elastic Block Store, click Volumes.

    3. Find the State column

    4. Sort by Available

    5. Any Volumes listed as Available can be deleted as that is the indication the

    volume is not attached to an instance.

    Capture this list of volume names and refer to the remediation below.

    Note: EBS volumes can be in different regions. Make sure to review all the regions

    being utilized.

    From Command Line:

    1. Run describe-volumes

    aws ec2 describe-volumes --filter Name=status,Values=available --query

    "Volumes[*].{ID:VolumeId}"

    2. This will provide a list of all the volumes not attached to an instance

    Capture this list of volume names and refer to the remediation below.

    Note: EBS volumes can be in different regions. Make sure to review all the regions

    being utilized.'
  remediation: 'From Console:

    1. Login to the EC2 console using https://console.aws.amazon.com/ec2/

    2. Under Elastic Block Store, click Volumes.

    3. Find the State column

    4. Sort by Available

    5. Select the Volume that you want to delete.

    6. Click Actions, Delete volume, Yes, Delete

    Note: EBS volumes can be in different regions. Make sure to review all the regions

    being utilized.

    From Command Line:

    Using the list of available volumes identified in the Audit above

    1. Run the delete-volume command

    aws ec2 delete-volume --volume-id <vol-name>

    2. This will delete the volume identified.

    Note: Using this command will not prompt you for confirmation. It will delete the volume

    and you will not be able to recover it. Please make sure you have the correct volume

    and that you have created a snapshot if it is something that needs to be archived.

    Note: EBS volumes can be in different regions. Make sure to review all the regions

    being utilized.'
  checks:
  - type: manual_review
    info: 'From Console:

      1. Login to the EC2 console using https://console.aws.amazon.com/ec2/

      2. Under Elastic Block Store, click Volumes.

      3. Find the State column

      4. Sort by Available

      5. Any Volumes listed as Available can be deleted as that is the indication the

      volume is not attached to an instance.

      Capture this list of volume names and refer to the remediation below.

      Note: EBS volumes can be in different regions. Make sure to review all the regions

      being utilized.

      From Command Line:

      1. Run describe-vo'
    severity: medium
- id: 2.2.5
  title: Ensure attached EBS volumes are encrypted
  scoring: manual
  profile:
  - Level 1
  description: The account level encryption by default setting only applies to volumes created after it is enabled and the
    existing snapshot encryption control only addresses snapshots. Neither checks whether volumes currently attached to running
    EC2 instances are encrypted, so a volume created before encryption by default was enabled, or created with encryption
    explicitly disabled, can remain unencrypted indefinitely without being flagged.
  rationale: A volume can be unencrypted even when the account level default setting is enabled and all snapshots are encrypted,
    since that setting only governs future volume creation and has no effect on resources that already exist. This control
    closes that gap by directly auditing the encryption status of each attached volume, rather than relying on settings or
    backups that don't reflect the current state of live, in use storage.
  impact: Existing unencrypted volumes cannot be encrypted in place and must be replaced using a snapshot, copy, recreate,
    and swap process. Root volume remediation requires stopping the instance, resulting in downtime. Data volume remediation
    can typically be performed with less disruption.
  references:
  - 1. https://docs.aws.amazon.com/ebs/latest/userguide/ebs-encryption.html
  - 2. https://docs.aws.amazon.com/ebs/latest/userguide/encryption-by-default.html
  page_start: 44
  audit_raw: 'From Console

    1. Login to the EC2 console

    2. Under Elastic Block Store, click Volumes

    3. For each volume, review the State and Encrypted columns

    4. Volumes showing State as in-use and Encrypted as false are non compliant

    5. Review every region in use

    From Command Line Run

    aws ec2 describe-volumes --filters Name=attachment.status,Values=attached --

    query "Volumes[*].{ID:VolumeId,Encrypted:Encrypted}"

    Any volume returning "Encrypted": false is non compliant. This filter ensures only

    attached, in use volumes are evaluated, avoiding overlap with the existing control

    covering unused volumes. Review every region in use.'
  remediation: 'From Console

    1. Under Elastic Block Store, click Snapshots, create a snapshot of the unencrypted

    volume

    2. Select the snapshot, click Actions, Copy, select Encrypt this snapshot

    3. Create a new volume from the encrypted snapshot

    4. Detach the original unencrypted volume, attach the new encrypted volume

    5. Confirm the new volume is attached using the same device name as the original,

    for example /dev/xvda for most root volumes, since an incorrect device name can

    prevent the instance from starting

    6. For root volumes, the instance must be stopped before detaching and

    reattaching, and this should be tested in a non production environment first given

    the required downtime'
  checks:
  - type: manual_review
    info: 'From Console

      1. Login to the EC2 console

      2. Under Elastic Block Store, click Volumes

      3. For each volume, review the State and Encrypted columns

      4. Volumes showing State as in-use and Encrypted as false are non compliant

      5. Review every region in use

      From Command Line Run

      aws ec2 describe-volumes --filters Name=attachment.status,Values=attached --

      query "Volumes[*].{ID:VolumeId,Encrypted:Encrypted}"

      Any volume returning "Encrypted": false is non compliant. This filter ensures only

      attached, in us'
    severity: medium
