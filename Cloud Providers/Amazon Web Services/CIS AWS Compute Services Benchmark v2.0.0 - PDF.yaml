- id: '5.2'
  title: Change default Administrator login names and passwords for applications
  scoring: manual
  profile:
  - Level 1
  description: Change the default settings for the administrator login names and passwords of the application software that
    you install on Lightsail instances.
  rationale: Default administrator login names and passwords for applications used on Lightsail instances can be used by hackers
    and individuals to break into your servers.
  impact: ''
  references:
  - 1. https://lightsail.aws.amazon.com/ls/docs/en_us/all
