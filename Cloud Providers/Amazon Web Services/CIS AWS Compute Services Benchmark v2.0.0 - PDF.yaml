- id: '17.1'
  title: Ensure Image Builder distribution configurations do not publicly share AMIs
  scoring: manual
  profile:
  - Level 1
  description: EC2 Image Builder pipelines reference a distribution configuration that controls how the AMI produced by each
    pipeline run is shared. The distribution config's AmiDistributionConfiguration.LaunchPermission field can grant public
    access ({"UserGroups":["all"]}) so that every AMI built by the pipeline is published publicly on creation. This control
    audits Image Builder distribution configurations directly to catch misconfigured pipelines before they produce public
    AMIs on their next run.
  rationale: AMIs contain the full filesystem of a configured instance, including pre-installed applications, configuration
    files, internal CA certificates, agent configurations, and potentially residual credentials. A publicly shared AMI allows
    any AWS account to launch an instance from it and inspect all contents.
  impact: Organizations that intentionally publish AMIs (community AMIs, AWS Marketplace offerings, open-source projects)
    and use Image Builder pipelines to do so must keep their public-distribution pipelines in dedicated accounts with this
    control disabled, while applying it to all production / internal accounts.
  references: []
  page_start: 229
  audit_raw: "1. List all Image Builder distribution configurations in the region:\naws imagebuilder list-distribution-configurations\
    \ --region $AWS_REGION \\\n --query 'distributionConfigurationSummaryList[].[name,arn]' --output table\n2. For each distribution\
    \ configuration returned above, inspect its AMI distribution\nsettings to check whether any region grants public launch\
    \ permissions:\naws imagebuilder get-distribution-configuration --distribution-configurationarn <arn> \\\n --region $AWS_REGION\
    \ \\\n --query\n'distributionConfiguration.distributions[].{Region:region,LaunchPermission:am\niDistributionConfiguration.launchPermission}'\
    \ \\\n --output json\n• The distribution configuration Fails if any region's launchPermission includes\n\"userGroups\"\
    : [\"all\"]. This indicates that AMIs produced by any pipeline using this\ndistribution config will be publicly accessible.\n\
    3. For each distribution configuration that Failed the audit, identify the Image Builder\npipelines that reference it\
    \ (so you understand the blast radius):\naws imagebuilder list-image-pipelines --region $AWS_REGION \\\n --filters name=distributionConfigurationArn,values=<arn>\
    \ \\\n --query 'imagePipelineList[].[name,arn,status]' --output table"
  remediation: "1. For each distribution configuration that Failed the audit, retrieve its current\ndistributions block and\
    \ remove the userGroups: [\"all\"] entry from each region's\namiDistributionConfiguration.launchPermission. The remediation\
    \ requires a full\nupdated distribution config to be sent — the AWS API doesn't support patching\nindividual fields:\n\
    # Retrieve current config\naws imagebuilder get-distribution-configuration --distribution-configurationarn <arn> \\\n\
    \ --region $AWS_REGION --query 'distributionConfiguration' > /tmp/distconfig.json\n# Edit /tmp/dist-config.json: in each\n\
    distributions[].amiDistributionConfiguration.launchPermission,\n# remove the \"userGroups\": [\"all\"] entry. To restrict\
    \ to specific accounts,\nreplace with:\n# \"userIds\": [\"<account-id-1>\", \"<account-id-2>\"]\n# To make AMIs private\
    \ to the source account only, remove the\nlaunchPermission key entirely.\n# Apply the updated config\naws imagebuilder\
    \ update-distribution-configuration --distributionconfiguration-arn <arn> \\\n --region $AWS_REGION --distributions file:///tmp/dist-config.json\n\
    2. Verify by repeating audit step 2 on the distribution configuration.\n3. Trigger a test run of any affected pipeline\
    \ and verify the resulting AMI is not\npublic:\naws ec2 describe-images --owners self --filters Name=is-public,Values=true\
    \ --\nregion $AWS_REGION \\\n --query 'Images[?starts_with(Name, `<image-builderprefix>`)].[ImageId,Name,Public]' --output\
    \ table"
  checks:
  - type: manual_review
    info: "1. List all Image Builder distribution configurations in the region:\naws imagebuilder list-distribution-configurations\
      \ --region $AWS_REGION \\\n --query 'distributionConfigurationSummaryList[].[name,arn]' --output table\n2. For each\
      \ distribution configuration returned above, inspect its AMI distribution\nsettings to check whether any region grants\
      \ public launch permissions:\naws imagebuilder get-distribution-configuration --distribution-configurationarn <arn>\
      \ \\\n --region $AWS_REGION \\\n --query\n'distr"
    severity: medium
- id: '17.2'
  title: Ensure Image Builder pipelines do not disable the built-in security cleanup script
  scoring: manual
  profile:
  - Level 2
  description: 'Before producing the final AMI snapshot, EC2 Image Builder runs a built-in security cleanup script on the
    build instance that securely removes cloud-init artifacts, SSH host keys and authorized_keys, instance log files, package
    manager logs, Task Orchestrator/Executor (TOE) working files, and SSM agent logs. This cleanup is enabled by default and
    runs automatically. However, AWS allows the cleanup to be partially or wholly disabled in two ways: (1) the recipe''s
    components can create skip_cleanup_* flag files that suppress individual sections of the cleanup, or (2) the recipe can
    specify additionalInstanceConfiguration.userDataOverride, which disables the entire cleanup script unless that user data
    explicitly creates the perform_cleanup flag file.'
  rationale: The built-in cleanup exists to prevent residual sensitive artifacts — SSH host keys, authorized_keys containing
    operator public keys, installation logs that may contain tokens, cloud-init data, and SSM session logs — from persisting
    into the final AMI. When an instance is launched from an AMI that retained these artifacts, anyone with access to that
    instance (or to the AMI itself, if shared cross-account or made public) can extract them. Reusing baked-in SSH host keys
    across many launched instances also breaks SSH host-key trust models and enables impersonation. Bypassing the cleanup
    is rarely necessary; teams sometimes do it inadvertently when they supply a userDataOverride for build-time provisioning
    without realizing it disables cleanup, or when they add skip_cleanup_* files for debugging and forget to remove them.
  impact: Organizations with a legitimate need to preserve specific artifacts on the AMI (e.g., a baseline log file required
    by an internal compliance tool) must instead capture those artifacts out-of-band before the cleanup phase rather than
    skipping cleanup. Recipes that need a userDataOverride must include a step that creates the /var/lib/amazon/toe/perform_cleanup
    flag file so that the cleanup script still runs.
  references: []
  page_start: 232
  audit_raw: "The cleanup can be bypassed in two ways: (a) a recipe's\nadditionalInstanceConfiguration.userDataOverride is\
    \ set without re-enabling\ncleanup, or (b) a custom component creates a skip_cleanup_* flag file.\n1. Identify any image\
    \ recipes that have a userDataOverride configured:\naws imagebuilder list-image-recipes --region $AWS_REGION \\\n --query\
    \ 'imageRecipeSummaryList[].arn' --output text \\\n | xargs -n1 -I {} aws imagebuilder get-image-recipe --image-recipe-arn\
    \ {} -\n-region $AWS_REGION \\\n --query 'imageRecipe.[arn,\nadditionalInstanceConfiguration.userDataOverride]' --output\
    \ table\n• For any recipe where the second column is not empty, base64-decode the\noverride and review the script. The\
    \ recipe Fails unless the script either (i) creates\nthe file /var/lib/amazon/toe/perform_cleanup (which re-enables the\
    \ built-in\ncleanup), or (ii) implements an equivalent organizational cleanup process to\npurge build artifacts, logs,\
    \ and temporary credentials before AMI finalization.\n2. Identify any custom components in use:\naws imagebuilder list-components\
    \ --owner Self --region $AWS_REGION \\\n --query 'componentVersionList[].arn' --output text \\\n | xargs -n1 -I {} aws\
    \ imagebuilder get-component --component-build-versionarn {} --region $AWS_REGION \\\n --query 'component.[arn, data]'\
    \ --output text\n• For each component, review the data field. The component Fails if it creates any\nskip_cleanup_* flag\
    \ file (e.g., skip_cleanup_ssh_files,\nskip_cleanup_instance_log_files, skip_cleanup_toe_files) without a\ndocumented\
    \ and approved exception.\nIf neither step surfaces a recipe or component that bypasses cleanup, the account\nPasses for\
    \ this region."
  remediation: "1. For components that Failed — remove the action that creates the skip_cleanup_*\nfile from the component's\
    \ data and publish a new component version, then\nupdate affected recipes to reference the new component version:\naws\
    \ imagebuilder create-component --name <component-name> --region\n$AWS_REGION \\\n --semantic-version <next-version> --platform\
    \ Linux \\\n --data file://component-fixed.yaml\n2. For recipes that Failed — image recipes are immutable, so create a\
    \ new recipe\nversion whose userDataOverride adds the perform_cleanup flag file before any\nother commands.\n• Publish\
    \ the new recipe version with the corrected override:\naws imagebuilder create-image-recipe --name <recipe-name> --region\n\
    $AWS_REGION \\\n --semantic-version <next-version> --parent-image <parent-image> \\\n --components '[{\"componentArn\"\
    : \"<component-arn>\"}]' \\\n --additional-instance-configuration \"userDataOverride=$(base64 -w0 userdata-fixed.sh)\"\
    \n• Update any pipelines using the old recipe to reference the new version.\n18 Elastic Container Registry (ECR)\nAmazon\
    \ Elastic Container Registry (ECR) is a fully-managed container image registry\nservice that makes it easy to store, manage,\
    \ share, and deploy container images and\nOCI (Open Container Initiative) artifacts without operating your own registry\n\
    infrastructure. ECR integrates natively with AWS compute services that consume\ncontainer images — Amazon ECS, Amazon\
    \ EKS, AWS Fargate, and AWS Lambda —\nand supports private and public repositories, image scanning, lifecycle policies,\
    \ crossregion and cross-account replication, immutable image tags, and pull-through caching\nfrom upstream registries."
  checks:
  - type: manual_review
    info: "The cleanup can be bypassed in two ways: (a) a recipe's\nadditionalInstanceConfiguration.userDataOverride is set\
      \ without re-enabling\ncleanup, or (b) a custom component creates a skip_cleanup_* flag file.\n1. Identify any image\
      \ recipes that have a userDataOverride configured:\naws imagebuilder list-image-recipes --region $AWS_REGION \\\n --query\
      \ 'imageRecipeSummaryList[].arn' --output text \\\n | xargs -n1 -I {} aws imagebuilder get-image-recipe --image-recipe-arn\
      \ {} -\n-region $AWS_REGION \\\n --query 'im"
    severity: medium
- id: '18.1'
  title: Ensure ECR repositories have image scanning enabled
  scoring: manual
  profile:
  - Level 1
  description: 'Amazon ECR supports image scanning to identify known software vulnerabilities (CVEs) in container images.
    Two scan types are available: Basic scanning (Clair-based, free) provides OS package vulnerability detection, while Enhanced
    scanning (powered by Amazon Inspector) provides continuous monitoring of both OS packages and programming language libraries.
    Scan-on-push ensures every image is assessed before deployment.'
  rationale: Container images may contain base OS layers or application dependencies with known critical vulnerabilities.
    Without scanning, vulnerable images are deployed to production where they can be exploited by attackers. Image scanning
    provides visibility into known vulnerabilities before deployment and enables enforcement of vulnerability thresholds in
    CI/CD pipelines.
  impact: Enhanced scanning incurs Amazon Inspector costs per image assessed. Basic scanning is free but limited to OS packages.
    Enabling scan-on-push adds seconds to the image push workflow.
  references: []
  page_start: 236
  audit_raw: "The ECR registry passes the audit procedure if either Basic or Enhanced scanning is\nenabled and covers all\
    \ repositories. Enhanced (Amazon Inspector) is the stronger\noption as it scans both OS packages and programming language\
    \ libraries; Basic (Clairbased) scans OS packages only.\n1. Check the registry-level scanning configuration:\naws ecr\
    \ get-registry-scanning-configuration --region $AWS_REGION \\\n --query 'scanningConfiguration.{ScanType:scanType,Rules:rules}'\
    \ --output\njson\n• If ScanType is ENHANCED with a rule covering all repositories (\"filter\":\"*\"), the\nregistry Passes\
    \ — skip the remaining steps.\n2. If ScanType is BASIC, list all repositories in the region:\naws ecr describe-repositories\
    \ --region $AWS_REGION \\\n --query 'repositories[].repositoryName' --output table\n3. For each repository returned above,\
    \ check its scan-on-push setting:\naws ecr describe-repositories --repository-names <repo-name> --region\n$AWS_REGION\
    \ \\\n --query 'repositories[].imageScanningConfiguration.scanOnPush' --output\ntext\n• Under BASIC scan mode, the repository\
    \ Fails if the returned value is False."
  remediation: "Before remediating, teams should determine the appropriate scanning level for their\nworkload:\n• Basic scanning\
    \ — Free, Clair-based, scans OS packages only. Suitable for\nteams with cost sensitivity or where container images are\
    \ thin OS layers only.\n• Enhanced scanning — Amazon Inspector-powered, scans OS packages plus\nprogramming language libraries,\
    \ supports continuous rescanning. Suitable for\nteams deploying application code in containers where library CVEs are\
    \ a\nconcern. Incurs Amazon Inspector per-image assessment charges.\nApply the remediation for whichever level you select.\n\
    Option A — Enable Enhanced scanning (recommended for application workloads):\naws ecr put-registry-scanning-configuration\
    \ --region $AWS_REGION \\\n --scan-type ENHANCED \\\n --rules\n'[{\"scanFrequency\":\"CONTINUOUS_SCAN\",\"repositoryFilters\"\
    :[{\"filter\":\"*\",\"filt\nerType\":\"WILDCARD\"}]}]'\n• The put-registry-scanning-configuration call auto-enables Amazon\
    \ Inspector for\nECR. Valid scan frequencies under Enhanced scanning are SCAN_ON_PUSH\n(scan only when images are pushed)\
    \ or CONTINUOUS_SCAN (push + ongoing\nrescans as new CVEs are disclosed — recommended).\nOption B — Enable Basic scanning\
    \ per repository:\nFor each repository that Failed the audit, enable scan-on-push:\naws ecr put-image-scanning-configuration\
    \ --region $AWS_REGION \\\n --repository-name <repo-name> \\\n --image-scanning-configuration scanOnPush=true"
  checks:
  - type: manual_review
    info: "The ECR registry passes the audit procedure if either Basic or Enhanced scanning is\nenabled and covers all repositories.\
      \ Enhanced (Amazon Inspector) is the stronger\noption as it scans both OS packages and programming language libraries;\
      \ Basic (Clairbased) scans OS packages only.\n1. Check the registry-level scanning configuration:\naws ecr get-registry-scanning-configuration\
      \ --region $AWS_REGION \\\n --query 'scanningConfiguration.{ScanType:scanType,Rules:rules}' --output\njson\n• If ScanType\
      \ is ENHAN"
    severity: medium
- id: '18.2'
  title: Ensure ECR repositories have lifecycle policies configured
  scoring: manual
  profile:
  - Level 2
  description: ECR lifecycle policies automatically expire old or untagged images based on age or count rules. Without lifecycle
    policies, repositories accumulate unlimited image versions over time, including untagged intermediate builds, old releases
    with known vulnerabilities, and images containing previously hardcoded secrets that have since been rotated.
  rationale: 'Stale images present security risk in two ways: they can be accidentally deployed (reintroducing patched vulnerabilities),
    and they preserve a historical record of application security weaknesses accessible to anyone with repository read access.
    Lifecycle policies ensure repositories retain only recent, relevant images and automatically remove images that should
    no longer be available.'
  impact: Lifecycle policies permanently delete images matching the expiration rules. Teams must ensure retention periods
    are sufficient for rollback requirements. Images needed for long-term archival should be stored separately.
  references: []
  page_start: 239
  audit_raw: "1. List all ECR repositories in the region:\naws ecr describe-repositories --region $AWS_REGION \\\n --query\
    \ 'repositories[].repositoryName' --output table\n2. For each of the repositories returned above, check whether it has\
    \ a lifecycle\npolicy:\naws ecr get-lifecycle-policy --repository-name <repo-name> --region\n$AWS_REGION\n• The repository\
    \ Fails if the command returns\nLifecyclePolicyNotFoundException."
  remediation: "For each repository that Failed the audit, apply a lifecycle policy. The example below\nexpires untagged images\
    \ after 14 days and keeps only the last 30 tagged versions:\naws ecr put-lifecycle-policy --repository-name <repo-name>\
    \ --region\n$AWS_REGION \\\n --lifecycle-policy-text '{\n \"rules\": [\n {\n \"rulePriority\": 1,\n \"description\": \"\
    Expire untagged images after 14 days\",\n \"selection\": {\n \"tagStatus\": \"untagged\",\n \"countType\": \"sinceImagePushed\"\
    ,\n \"countUnit\": \"days\",\n \"countNumber\": 14\n },\n \"action\": {\"type\": \"expire\"}\n },\n {\n \"rulePriority\"\
    : 2,\n \"description\": \"Keep only last 30 tagged images\",\n \"selection\": {\n \"tagStatus\": \"tagged\",\n \"tagPrefixList\"\
    : [\"v\"],\n \"countType\": \"imageCountMoreThan\",\n \"countNumber\": 30\n },\n \"action\": {\"type\": \"expire\"}\n\
    \ }\n ]\n }'"
  checks:
  - type: manual_review
    info: "1. List all ECR repositories in the region:\naws ecr describe-repositories --region $AWS_REGION \\\n --query 'repositories[].repositoryName'\
      \ --output table\n2. For each of the repositories returned above, check whether it has a lifecycle\npolicy:\naws ecr\
      \ get-lifecycle-policy --repository-name <repo-name> --region\n$AWS_REGION\n• The repository Fails if the command returns\n\
      LifecyclePolicyNotFoundException."
    severity: medium
- id: '18.3'
  title: Ensure ECR repositories use immutable image tags
  scoring: manual
  profile:
  - Level 1
  description: ECR repositories can be configured with either MUTABLE (default) or IMMUTABLE image tag mutability. When set
    to MUTABLE, an image tag can be overwritten by pushing a new image with the same tag. When set to IMMUTABLE, once a tag
    is assigned to an image, it cannot be reassigned to a different image.
  rationale: Mutable image tags allow an attacker who gains push access to a repository (via compromised CI/CD credentials
    or overly permissive repository policies) to replace a legitimate image with a malicious one using the same tag (e.g.,
    "latest", "v2.1.0"). When services pull the image by tag, they deploy the attacker's payload. Immutable tags ensure that
    a tagged image cannot be replaced, providing supply chain integrity guarantees.
  impact: CI/CD pipelines using overwrite-based tag strategies (e.g., always pushing to "latest") must be updated to use unique
    tags per build (commit SHA, build number, or semantic version). Rolling deployment strategies that rely on tag updates
    must use new tags instead.
  references: []
  page_start: 241
  audit_raw: "1. List all ECR repositories in the region:\naws ecr describe-repositories --region $AWS_REGION \\\n --query\
    \ 'repositories[].repositoryName' --output table\n2. For each repository returned above, check its image tag mutability\
    \ setting:\naws ecr describe-repositories --repository-names <repo-name> --region\n$AWS_REGION \\\n --query 'repositories[].imageTagMutability'\
    \ --output text\n• The repository Fails if the returned value is MUTABLE. The Passing value is\nIMMUTABLE."
  remediation: "For each repository that Failed the audit, set image tag immutability:\naws ecr put-image-tag-mutability --repository-name\
    \ <repo-name> --region\n$AWS_REGION \\\n --image-tag-mutability IMMUTABLE"
  checks:
  - type: manual_review
    info: "1. List all ECR repositories in the region:\naws ecr describe-repositories --region $AWS_REGION \\\n --query 'repositories[].repositoryName'\
      \ --output table\n2. For each repository returned above, check its image tag mutability setting:\naws ecr describe-repositories\
      \ --repository-names <repo-name> --region\n$AWS_REGION \\\n --query 'repositories[].imageTagMutability' --output text\n\
      • The repository Fails if the returned value is MUTABLE. The Passing value is\nIMMUTABLE."
    severity: medium
- id: '18.4'
  title: Ensure private ECR repositories do not allow public access via resource policies
  scoring: manual
  profile:
  - Level 1
  description: 'Amazon ECR private repositories support resource-based IAM policies that grant other principals permission
    to pull, push, or describe images. A repository policy that grants ECR actions to Principal: "*" or AWS: "*" without a
    restrictive Condition makes the repository''s images effectively public — any AWS account, and in some cases any unauthenticated
    caller, can read or modify them. This recommendation requires that no private ECR repository have a resource-based policy
    that grants ECR read or write actions to all principals without a Condition that limits access to specific accounts or
    organizations.'
  rationale: Container image layers in private repositories often contain proprietary application code, internal API endpoint
    configurations, embedded certificates, baked-in third-party credentials, and infrastructure details that can be used to
    identify application vulnerabilities. An overly permissive repository policy bypasses the implicit account boundary that
    private repositories provide and exposes these contents to anyone who can reach the ECR API.
  impact: Repositories that legitimately need to be shared with external accounts (e.g., partner organizations consuming a
    release feed) must restrict the principal explicitly to those account IDs or organization ID rather than grabting the
    blanket allow all.
  references: []
  page_start: 243
  audit_raw: "1. List all private ECR repositories in the region:\naws ecr describe-repositories --region $AWS_REGION \\\n\
    \ --query 'repositories[].repositoryName' --output table\n2. For each repository returned above, retrieve its repository\
    \ policy (if any) and\ninspect the principal and conditions on each statement:\naws ecr get-repository-policy --repository-name\
    \ <repo-name> --region\n$AWS_REGION \\\n --query 'policyText' --output text\n• A repository with no policy returns RepositoryPolicyNotFoundException\
    \ — this is\na Pass (default-deny applies).\n• The repository Fails if its policy contains any statement where all of\
    \ the following\nare true:\no Effect is Allow\no Action includes any of 'ecr:*', 'ecr:BatchGetImage',\n'ecr:GetDownloadUrlForLayer',\
    \ 'ecr:BatchCheckLayerAvailability',\n'ecr:DescribeImages', 'ecr:GetAuthorizationToken', 'ecr:PutImage',\n'ecr:InitiateLayerUpload',\
    \ 'ecr:UploadLayerPart',\n'ecr:CompleteLayerUpload', or any wildcard expansion thereof\no Principal is * or \"AWS\": \"\
    *\"\no Condition is absent OR does not restrict access to specific\naccounts/organizations (e.g., no 'aws:PrincipalAccount',\n\
    'aws:PrincipalOrgID', 'aws:SourceVpce', or equivalent constraint)\n3. Also check the registry-wide policy, which applies\
    \ to all repositories in the\naccount:\naws ecr get-registry-policy --region $AWS_REGION --query 'policyText' --\noutput\
    \ text\n• Apply the same evaluation criteria to registry-policy statements. A\nRegistryPolicyNotFoundException response\
    \ is a Pass."
  remediation: "1. For each repository that Failed the audit, retrieve the current policy and edit the\noffending statement\
    \ so the principal is restricted to specific accounts (or removed\nif no cross-account access is needed):\n# Retrieve\
    \ current policy\naws ecr get-repository-policy --repository-name <repo-name> --region\n$AWS_REGION \\\n --query 'policyText'\
    \ --output text > /tmp/repo-policy.json\nEdit '/tmp/repo-policy.json'. Replace \"Principal\": \"*\" (or \"Principal\"\
    : {\"AWS\":\n\"*\"}) with one of the following, depending on the intent:\n• No cross-account access needed — delete the\
    \ entire statement.\n• Specific external accounts — \"Principal\": { \"AWS\":\n[\"arn:aws:iam::<account-id-1>:root\",\
    \ \"arn:aws:iam::<account-id2>:root\"] }\n• All accounts within your AWS Organization — keep \"Principal\": \"*\" but\
    \ add\na Condition: \"Condition\": { \"StringEquals\": { \"aws:PrincipalOrgID\":\n\"<o-xxxxxxxxxx>\" } }\n2. Apply the\
    \ corrected policy:\naws ecr set-repository-policy --repository-name <repo-name> --region\n$AWS_REGION \\\n --policy-text\
    \ file:///tmp/repo-policy.json\n• If the repository should have no policy at all, delete it instead:\naws ecr delete-repository-policy\
    \ --repository-name <repo-name> --region\n$AWS_REGION\n3. For a Failed registry policy, apply the same logic via aws ecr\
    \ put-registrypolicy --policy-text file:///tmp/registry-policy.json or remove with\naws ecr delete-registry-policy --region\
    \ $AWS_REGION."
  checks:
  - type: manual_review
    info: "1. List all private ECR repositories in the region:\naws ecr describe-repositories --region $AWS_REGION \\\n --query\
      \ 'repositories[].repositoryName' --output table\n2. For each repository returned above, retrieve its repository policy\
      \ (if any) and\ninspect the principal and conditions on each statement:\naws ecr get-repository-policy --repository-name\
      \ <repo-name> --region\n$AWS_REGION \\\n --query 'policyText' --output text\n• A repository with no policy returns RepositoryPolicyNotFoundException\
      \ — this is"
    severity: medium
