  title: Change the auto-generated password for Windows based instances.
  scoring: manual
  profile:
  - Level 1
  description: When you create a Windows Server-based instance, Lightsail randomly generates a long password that is hard
    to guess. You use this password uniquely with your new instance. You can use the default password to connect quickly to
    your instance using remote desktop (RDP). You are always logged in as the Administrator on your Lightsail instance.
  rationale: Like any password it should be changed from the default and over time. The randomly generated password can be
    hard to remember and if anyone gains access to your AWS Lightsail environment they can utilize that to access your instances.
    For this reason you should change the password to something you can remember.
