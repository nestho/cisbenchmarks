controls:
- id: 2.1.1
  title: Ensure Consistent Naming Convention is used for Organizational AMI
  scoring: manual
  profile:
  - Level 1
  description: The naming convention for AMIs (Amazon Machine Images) should be documented and followed for any AMIs created.
  rationale: The majority of AWS resources can be named and tagged. Most organizations have already created standardized naming
    conventions and have existing rules in effect. These should be extended to include all AWS cloud resources, including
    Amazon Machine Images (AMIs).
  impact: Implementing and enforcing a standardized naming convention for AMIs may require updates to existing AMIs, including
    copying and deregistering non-compliant images. This may result in temporary duplication of AMIs and increased storage
    costs during the transition period. Additionally, processes and automation that reference AMIs by name may require updates
    to align with the new naming convention.
  references:
  - 1. https://docs.aws.amazon.com/cli/latest/reference/ec2/describe-images.html
  - 2. https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AMIs.html
  page_start: 20
  audit_raw: 'Perform the following to determine what AMIs are created:

    From the Console:

    1. Login to the EC2 console at https://console.aws.amazon.com/ec2/

    2. In the left pane, under Images, click AMIs

    3. Review the list of AMIs

    4. Confirm that the AMI name matches the organizational image naming policy

    From the Command Line:

    1. Run:

    aws ec2 describe-images --owner self --region us-west-2

    2. Review the list of AMIs

    3. Confirm that the AMI Name matches the organizational image naming policy

    If any of the AMI names do not match the organization policy, refer to the remediation

    below.'
  remediation: 'If the AMI name for an AMI does not follow organization policy:

    Perform the following to copy and rename the AMI:

    From the Console:

    1. Login to the EC2 console at https://console.aws.amazon.com/ec2/

    2. In the left pane click Images, click AMIs

    3. Select the AMI that does not comply to the naming policy

    4. Click on Actions

    5. Click on Copy AMI

    • Destination region - Select the region the AMI is in.

    • Name - Enter the new Name

    • Description - Enter the new description

    • Encryption - Select if it matches your image policy

    6. Click on Copy AMI

    7. Once the AMI has finished copying, select the AMI that does not comply to the

    naming policy

    8. Click on Actions

    9. Click on Deregister'
  checks:
  - type: manual_review
    info: 'Perform the following to determine what AMIs are created:

      From the Console:

      1. Login to the EC2 console at https://console.aws.amazon.com/ec2/

      2. In the left pane, under Images, click AMIs

      3. Review the list of AMIs

      4. Confirm that the AMI name matches the organizational image naming policy

      From the Command Line:

      1. Run:

      aws ec2 describe-images --owner self --region us-west-2

      2. Review the list of AMIs

      3. Confirm that the AMI Name matches the organizational image naming policy

      If any of the AMI '
    severity: medium
- id: 2.1.2
  title: Ensure Amazon Machine Images (AMIs) are encrypted
  scoring: scored
  profile:
  - Level 1
  description: Amazon Machine Images (AMIs) should utilize EBS encrypted snapshots
  rationale: AMIs backed by EBS snapshots should use EBS encryption. Snapshot volumes can be encrypted and attached to an
    AMI to help protect data at rest.
  impact: Implementing encryption for AMIs may require copying existing AMIs and enabling encryption on associated EBS snapshots.
    This may result in temporary duplication of AMIs and increased storage costs during the transition period. Additionally,
    processes, scripts, or automation that reference existing AMI IDs may require updates after new encrypted AMIs are created.
  references:
  - 1. https://repost.aws/knowledge-center/view-ami-snapshot-encryption-details
  - 2. https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AMIEncryption.html
  page_start: 23
  audit_raw: 'Perform the following to determine AMIs are encrypted:

    From the Console:

    1. Login to the EC2 console at https://console.aws.amazon.com/ec2/

    2. In the left pane, click AMIs under Images

    3. Select an AMI

    4. In the Details tab, review the Block devices section

    5. Confirm that the associated snapshots are encrypted

    If the snapshots are not encrypted, refer to the remediation below.

    From the Command Line:

    1. Run the following command:

    aws ec2 describe-images --region us-east-1 --owner self --filter "Name=blockdevice-mapping.encrypted,Values=false" --query
    "Images[*].[ImageId]"

    2. If this command returns a list of AMIs, these AMIs are not encrypted'
  remediation: 'Perform the following to encrypt AMI EBS Snapshots:

    From the Console:

    1. Login to the EC2 console at https://console.aws.amazon.com/ec2/

    2. In the left pane, click AMIs

    3. Select the AMI that does not comply to the encryption policy

    4. Click on Actions

    5. Click on Copy AMI

    • Destination region - Select the region the AMI is in

    • Name - Enter the new Name

    • Description - Enter the new description

    • Encryption - Select Encrypt target EBS snapshots

    6. Click on Copy AMI

    7. Once the AMI has finished copying, select the AMI that does not have encrypted

    EBS snapshots

    8. Click on Actions

    9. Click on Deregister

    From the Command Line:

    1. Run the following command to copy the AMI with encrypted block devices:

    aws ec2 copy-image --name <New_AMI_Name> --source-image-id <Image-ID> --

    source-region <region> --encrypted

    2. Run the following command to deregister the older AMI:

    aws ec2 deregister-image --image-id <Image-ID>'
  checks:
  - type: manual_review
    info: 'Perform the following to determine AMIs are encrypted:

      From the Console:

      1. Login to the EC2 console at https://console.aws.amazon.com/ec2/

      2. In the left pane, click AMIs under Images

      3. Select an AMI

      4. In the Details tab, review the Block devices section

      5. Confirm that the associated snapshots are encrypted

      If the snapshots are not encrypted, refer to the remediation below.

      From the Command Line:

      1. Run the following command:

      aws ec2 describe-images --region us-east-1 --owner self --filter "'
    severity: medium
- id: 2.1.3
  title: Ensure Only Approved Amazon Machine Images (AMIs) are Used
  scoring: manual
  profile:
  - Level 1
  description: Ensure that all base AMIs utilized are approved for use by your organization.
  rationale: An approved AMI is a base EC2 machine image that is a pre-configured operating system configured to run your
    application. Using approved AMIs helps enforce consistency and security.
  impact: Restricting the use of AMIs to only approved images may require replacing existing instances that were launched
    from unapproved AMIs. This may result in operational effort, potential downtime, and the need to rebuild or migrate workloads.
    Additionally, processes, scripts, or automation that rely on non-approved AMIs may require updates to align with the approved
    image list.
  references: []
  page_start: 26
  audit_raw: 'Perform the following to confirm only approved AMIs are being used:

    From the Console:

    1. Login to the EC2 console at https://console.aws.amazon.com/ec2/

    2. In the left pane, click Images, then choose AMIs

    3. Confirm that Owned by me is selected

    4. Review the list of AMIs

    5. Confirm that the AMIs listed are approved for use

    6. In the left pane, click Instances, then choose Instances

    7. Select an EC2 instance for review

    8. In the Details tab, review:

    • AMI Name

    • AMI location

    9. Confirm that the AMI name matches an approved AMI and that the AMI location

    is within your account

    10.Repeat steps 6–9 to verify that all instances are using approved AMIs

    10. Repeat the process for all other regions

    If any AMIs are not approved, refer to the remediation below.'
  remediation: 'Perform the following to remove unauthorized AMIs:

    From the Console:

    1. Login to the EC2 console at https://console.aws.amazon.com/ec2/

    2. In the left pane, click Images, then choose AMIs

    3. Confirm that Owned by me is selected

    4. Review the list of AMIs

    5. If an AMI is listed that is not approved, select it

    6. Click Actions, then choose Deregister

    7. After all unauthorized AMIs have been deregistered, review all EC2 instances:

    • Click Instances, then choose Instances

    • Select an EC2 instance for review

    8. In the Details tab, review:

    • AMI Name

    • AMI location

    9. If this information is listed as not available, the instance was built with an

    unauthorized AMI

    10. Follow organizational procedures to secure this instance and replace it with an

    instance built from an approved AMI, if applicable

    11. Repeat steps 7–10 to verify all instances have been created with approved AMIs

    12. Repeat the process for all other regions'
  checks:
  - type: manual_review
    info: 'Perform the following to confirm only approved AMIs are being used:

      From the Console:

      1. Login to the EC2 console at https://console.aws.amazon.com/ec2/

      2. In the left pane, click Images, then choose AMIs

      3. Confirm that Owned by me is selected

      4. Review the list of AMIs

      5. Confirm that the AMIs listed are approved for use

      6. In the left pane, click Instances, then choose Instances

      7. Select an EC2 instance for review

      8. In the Details tab, review:

      • AMI Name

      • AMI location

      9. Confirm that the A'
    severity: medium
- id: 2.1.4
  title: Ensure Images (AMI) are not older than 90 days
  scoring: scored
  profile:
  - Level 1
  description: Ensure that your AMIs are not older than 90 days.
  rationale: Using up-to-date AMIs will provide many benefits from OS updates and security patches helping to ensure reliability,
    security and compliance.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/cli/latest/reference/ec2/describe-images.html
  - 2. https://docs.aws.amazon.com/cli/latest/reference/ec2/deregister-image.html
  page_start: 29
  audit_raw: "Perform the following to determine the age of an AMI.\nFrom the Console\n1. Login to the EC2 console at https://console.aws.amazon.com/ec2/.\n\
    2. In the left pane, under Images, click AMIs.\n3. Select the AMI for review.\n4. Under the Details tab\n5. Review the\
    \ Creation date.\nIf the age of the selected AMI is greater than 90 days, the AMI is considered outdated\nand it should\
    \ be updated.\n6. Repeat steps no. 3 – 5 to verify the date of the other approved AMIs available.\nRepeat all steps for\
    \ the other regions.\nRefer to the remediation procedure below to update the AMI.\nFrom the Command Line:\nRun the aws\
    \ ec2 describe-images command\naws ec2 describe-images \\\n --region <region> \\\n --image-ids <image-ID>\nLook for CreationDate\
    \ in response. If the age of the selected AMI is greater than 90\ndays, the AMI is considered outdated and it should be\
    \ updated."
  remediation: 'Perform these steps if the Creation date is older than 90 days.

    From the Console

    1. Login to the EC2 console at https://console.aws.amazon.com/ec2/.

    2. In the left pane, under Images, click AMIs.

    3. Select the AMI to be updated.

    4. Click on Launch

    5. Go through the EC2 Instance creation process.

    6. Apply all system, security and application updates that are applicable to the EC2

    instance.

    7. Once completed click on Instance state, `Stop instance1.

    8. Click on Actions, Image and templates, Create image

    9. Once the image process has complete return to the AMI list but clicking on

    Images, AMIs

    10. Select the AMI that is older than 90 days.

    11. Click on Actions, Deregister

    Repeat these steps for any other AMIs older than 90 days.'
  checks:
  - type: manual_review
    info: 'Perform the following to determine the age of an AMI.

      From the Console

      1. Login to the EC2 console at https://console.aws.amazon.com/ec2/.

      2. In the left pane, under Images, click AMIs.

      3. Select the AMI for review.

      4. Under the Details tab

      5. Review the Creation date.

      If the age of the selected AMI is greater than 90 days, the AMI is considered outdated

      and it should be updated.

      6. Repeat steps no. 3 – 5 to verify the date of the other approved AMIs available.

      Repeat all steps for the other reg'
    severity: medium
