- id: '12.13'
  title: Ensure Lambda layers are not shared publicly
  scoring: manual
  profile:
  - Level 1
  description: 'Lambda layer version permissions control which AWS accounts can use or download a layer. A layer permission
    policy with Principal: "*" makes the layer publicly accessible to all AWS accounts. This exposes the layer''s code, libraries,
    and configuration to anyone who knows or discovers the layer ARN.'
  rationale: Lambda layers may contain proprietary code, shared authentication logic, internal API endpoint URLs, database
    connection helpers, and utility libraries. Publicly sharing a layer exposes this intellectual property and provides attackers
    with information about application architecture. Additionally, if the layer contains any embedded credentials or configuration,
    these become publicly accessible.
  impact: Teams using cross-account layer sharing must switch from public access to explicit account-based permissions. This
    requires knowing which accounts consume the layer.
  references: []
  page_start: 215
  audit_raw: "1. List all Lambda layers in the region:\naws lambda list-layers --region $AWS_REGION \\\n --query\n'Layers[].{LayerName:LayerName,LatestVersion:LatestMatchingVersion.Version}'\n\
    --output table\n2. For each layer returned above, fetch its permission policy:\naws lambda get-layer-version-policy --layer-name\
    \ <layer-name> \\\n --version-number <version> --region $AWS_REGION \\\n --query 'Policy' --output text\n• If the command\
    \ returns ResourceNotFoundException, the layer has no\npermission policy (Pass — no sharing). Otherwise, inspect the returned\
    \ policy\nJSON for \"Principal\": \"*\".\n• The layer Fails if any statement in the policy has \"Principal\": \"*\", which\
    \ grants\npublic access to all AWS accounts."
  remediation: "1. For each layer that Failed the audit, identify the statement ID granting public\naccess from the policy\
    \ output in audit step 2 (look for the Sid field).\n2. Remove the public permission:\naws lambda remove-layer-version-permission\
    \ --layer-name <layer-name> --region\n$AWS_REGION \\\n --version-number <version> --statement-id <statement-id>\n3. If\
    \ cross-account access is legitimately required, grant it to specific account IDs\ninstead of *:\naws lambda add-layer-version-permission\
    \ --layer-name <layer-name> --region\n$AWS_REGION \\\n --version-number <version> --statement-id \"allow-account-123\"\
    \ \\\n --action lambda:GetLayerVersion --principal \"123456789012\""
  checks:
  - type: manual_review
    info: "1. List all Lambda layers in the region:\naws lambda list-layers --region $AWS_REGION \\\n --query\n'Layers[].{LayerName:LayerName,LatestVersion:LatestMatchingVersion.Version}'\n\
