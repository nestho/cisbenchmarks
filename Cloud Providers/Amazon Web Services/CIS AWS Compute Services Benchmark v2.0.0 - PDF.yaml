- id: '3.2'
  title: Ensure 'assignPublicIp' is set to 'DISABLED' for Amazon ECS services
  scoring: scored
  profile:
  - Level 1
  description: Ensure that assignPublicIp is set to DISABLED for Amazon ECS services, to restrict direct exposure of containers
    to the public internet.
  rationale: Enabling public IP assignment could expose container application servers to unintended or unauthorized access.
  impact: Disabling assignPublicIp introduces administrative, operational, and potential cost overhead due to the need to
    configure and maintain private networking and associated resources.
  references:
  - 1. https://awscli.amazonaws.com/v2/documentation/api/latest/reference/ecs/listclusters.html
  - 2. https://awscli.amazonaws.com/v2/documentation/api/latest/reference/ecs/listservices.html
  page_start: 81
  audit_raw: 'From Console:

    1. Login to the ECS console using https://console.aws.amazon.com/ecs/.

    2. In the left panel, click Clusters.

    3. Click the name of a cluster.

    4. Under Services, click the name of a service.

    5. Click Configuration and networking.

    6. Under Network configuration, ensure Auto-assign public IP is set to

    Turned off.

    7. Repeat steps 1-6 for each ECS cluster and service.

    From Command Line:

    Run the following command to list clusters:

    aws ecs list-clusters

    Run the following command to list services in a cluster:

    aws ecs list-services --cluster <cluster-arn>

    Run the following command to view the details of a service:

    aws ecs describe-services --cluster <cluster-arn> --services <service-arn>

    Under networkConfiguration > awsvpcConfiguration, ensure assignPublicIp is

    set to DISABLED.

    Repeat for each cluster and service.'
  remediation: 'From Command Line:

    For each service requiring remediation, run the following command to set

    assignPublicIp to DISABLED:

    aws ecs update-service --cluster <cluster-arn> --service <service-arn> --

    network-configuration ''{"awsvpcConfiguration":{"subnets":["<subnetid>"],"securityGroups":["<security-group-id>"],"assignPublicIp":"DISABLED"}}'''
  checks:
  - type: manual_review
    info: 'From Console:

