  scoring: manual
  profile:
  - Level 1
  description: You can make all objects private, public (read-only) or private while making individual objects public (read-only).
    By default when creating a bucket the permissions are set to "All objects are private".
  rationale: When the Bucket access permissions are set to All objects are public (read-only) – All objects in the bucket
