  title: Ensure detailed monitoring is enable for production EC2 Instances
  scoring: manual
  profile:
  - Level 2
  description: Ensure that detailed monitoring is enabled for your Amazon EC2 instances.
  rationale: Monitoring is an important part of maintaining the reliability, availability, and performance of your Amazon
    EC2 instances
  impact: Data is available in 1-minute periods. For the instances where you've enabled detailed monitoring, you can also
    get aggregated data across groups of similar instances. You are charged per metric that is sent to CloudWatch. You are
    not charged for data storage. Due to this added cost it is recommended that you only enable this on critical instances.
