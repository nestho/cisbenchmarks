  scoring: manual
  profile:
  - Level 1
  description: Attaching an Amazon Lightsail instance to a Lightsail storage bucket gives it full programmatic access to the
    bucket and its objects.
  rationale: When you attach instances to buckets, you don't have to manage credentials like access keys. Resource access
    is ideal if you're configuring software or a plugin on your instance to upload files directly to your bucket. For example,
    if you want to configure a WordPress instance to store media files on a bucket configuration with bucket storage resource
    access allows for that securely.
  impact: You can attach instances that are in a running state only. Additionally, the instances have to be in the same AWS
    Region as the bucket or the buckets have to be in the same region as the instances.
