- id: '12.8'
  title: Ensure that Code Signing is enabled for Lambda functions.
  scoring: manual
  profile:
  - Level 1
  description: Ensure that all your Amazon Lambda functions are configured to use the Code Signing feature in order to restrict
    the deployment of unverified code.
  rationale: Code Signing, ensures that the function code is signed by an approved (trusted) source, and that it has not been
    altered since signing, and that the code signature has not expired or been revoked.
  impact: ''
  references: []
  page_start: 200
  audit_raw: 'From the Console

    1. Login to the AWS console using https://console.aws.amazon.com/lambda/

    2. In the left column, under AWS Lambda, click Functions.

    3. Under Function name click on the name of the function that you want to review.

    4. Click the Configuration tab

    5. Under General configuration on the left column, click Code signing.

    6. Under the Code signing configuration section check for any code signing

    configurations created for the function.

    7. If there are no code signing configurations available or listed is not enabled, refer

    to the remediation

    8. If a code signing configuration is listed, click into it and confirm the Signature

    validation policy is set to Enforce. If it is set to Warn, the function is non

    compliant, refer to the remediation.

    9. Compare the function''s Last modified date against the date the code signing

    configuration was attached. If the function''s last modified date predates that

    attachment date, the function is non compliant, refer to the remediation.

    10. Repeat steps 2-7 for each Lambda function within the current region.

    11. Then repeat the Audit process for all other regions.

    From the Command Line

    1. Run aws lambda list-functions

    aws lambda list-functions --output table --query "Functions[*].FunctionName"

    This command will provide a table titled ListFunctions

    2. Run aws lambda get-function-code-signing-config aws lambda getfunction-code-signing-config --function-name "name_of_function"
    -

    -query "CodeSigningConfigArn"

    3. The command output should return an array with the requested ARN(s)

    4. If the get-function-code-signing-config command output returns null, there are no

    code signing configurations for the Lambda function. Refer to the remediation

    below.

    5. If an ARN is returned, run

    aws lambda get-code-signing-config --code-signing-config-arn

    ARN_FROM_PREVIOUS_STEP --query

    "CodeSigningConfig.CodeSigningPolicies.UntrustedArtifactOnDeploym

    ent"

    If this returns "Warn" rather than "Enforce", the function is non compliant, refer to

    the remediation below.

    Additionally, run

    aws lambda get-function --function-name "name_of_function" --

    query "Configuration.LastModified"

    and compare this timestamp against the date the code signing configuration was

    attached. If the function''s last modified date predates the configuration''s

    attachment, the function is running unsigned legacy code and is non compliant

    pending a new signed deployment, refer to the remediation below.

    6. Repeat step 2-5 for each Lambda function available in the selected AWS region.

    7. Perform the Audit process for all other regions used.'
  remediation: 'From the Console

    1. Login to the AWS console using https://console.aws.amazon.com/signer

    2. Click on Create Signing Profile if none are set up. If you already have some

    created in the left panel click on Signing Profiles, Create Signing

    Profile.

    ***Note a Signing Profile is a trusted publisher and is analogous to the use of a

    digital signing certificate to generate signatures for your application code.

    3. On the Create Signing Profile setup page provide

    Profile name

    Specify the Signature Validity period (6 months up to 12 months is

    recomended)

    4. Click on Create Profile

    5. Go to the Amazon Lambda console https://console.aws.amazon.com/lambda/.

    6. In the left panel, under Additional resources, click on Code signing

    configurations.

    7. Click on Create configuration

    8. On the Create code signing configuration setup page:

    • Description box - provide a short description to identify this configuration

    • Click inside the Signing profile version ARN box and select the Signing

    Profile created above.

    • For Signature validation policy, click the signature validation policy

    suitable for your Lambda function.

    **Note - A signature check can fail if the code is not signed by an allowed Signing

    Profile, or if the signature has expired or has been revoked.

    • Click Enforce – blocking the deployment of the code and also issue a warning.

    • Click Create configuration

    9. Go to the Amazon Lambda console https://console.aws.amazon.com/lambda/.

    10. Click Functions.

    11. Under Function name click on the name of the function that you want to review

    12. Click the Configuration tab

    13. In the left menu click Code signing.

    14. Click Edit

    15. On the Edit code signing, select the code signing configuration created above

    from the drop down

    16. Click Save

    The Lambda function is now configured to use code signing.

    17. Next Upload a signed .zip file or provide an S3 URL of a signed .zip made by a

    signing job in AWS Signer.

    18. To start a signing job, go to AWS Signer console at

    https://console.aws.amazon.com/signer.

    19. In the left panel, click on Signing Jobs.

    20. Start a Signing Job to generate a signature for your code package and place the

    signed code package in the specified destination path.

    21. Start Signing Job setup page:

    - Select the Signing Profile created in dropdown list.

    - Code asset source location, specify the Amazon S3 location of the code

    package (.zip file) to be signed. Only S3 buckets available in the current

    region are displayed and can be used

    - Signature destination path with prefix where the signed code package should

    be uploaded.

    - Start Job to deploy your new Signing Job

    - Job status reads Succeeded, you can find the signed .zip package in your

    assigned S3 bucket.

    22. Publish the signed code package to the selected Lambda function.

    23. Amazon Lambda will perform signature checks to verify that the code has not

    been altered since signing

    Note, this final signing and publishing step (steps 17 through 23) is required even for

    functions where a code signing configuration is already attached and correctly set to

    Enforce, since attaching a configuration does not retroactively validate code that was

    deployed before the configuration existed. Any function flagged in the audit for predating

    its code signing configuration must go through this signing and publishing step to

    become compliant, not just have the configuration attached.

    25. Repeat steps for each Lambda function that was captured in the Audit.'
  checks:
  - type: manual_review
    info: 'From the Console

      1. Login to the AWS console using https://console.aws.amazon.com/lambda/

      2. In the left column, under AWS Lambda, click Functions.

      3. Under Function name click on the name of the function that you want to review.

      4. Click the Configuration tab

      5. Under General configuration on the left column, click Code signing.

      6. Under the Code signing configuration section check for any code signing

      configurations created for the function.

      7. If there are no code signing configurations avail'
    severity: medium
- id: '12.9'
  title: Ensure there are no Lambda functions with admin privileges within your AWS account
  scoring: manual
  profile:
  - Level 1
  description: Ensure that your Amazon Lambda functions don't have administrative permissions potentially giving the function
    access to all AWS cloud services and resources.
  rationale: In order to promote the Principle of Least Privilege (POLP) and provide your functions the minimal amount of
    access required to perform their tasks the right IAM execution role associated with the function should be used. Instead
    of providing administrative permissions you should grant the role the necessary permissions that the function really needs.
  impact: ''
  references: []
