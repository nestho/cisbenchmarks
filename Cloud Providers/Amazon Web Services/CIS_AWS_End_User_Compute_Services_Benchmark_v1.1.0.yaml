  - 1. https://aws.amazon.com/workspaces/faqs/
  - 2. https://docs.aws.amazon.com/workspaces/latest/adminguide/amazonworkspaces-bundles.html
  page_start: 47
  audit_raw: "Perform the following to ensure available workspace bundles are set.\nFrom the Console:\n1. Login to the WorkSpaces\
    \ dashboard at\nhttps://console.aws.amazon.com/workspaces/.\n2. In the left pane click WorkSpaces to access the instances\
    \ listing page.\n3. Check the bundle type value for each Amazon WorkSpaces instance available in\nthe current AWS region,\
