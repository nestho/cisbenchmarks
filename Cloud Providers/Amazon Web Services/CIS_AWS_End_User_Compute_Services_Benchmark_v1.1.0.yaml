controls:
- id: '2.1'
  title: Ensure Administration of WorkSpaces is defined using IAM
  scoring: manual
  profile:
  - Level 1
  description: To allow users to administer Amazon WorkSpaces, IAM policies must be created and attached with the required
    permissions to an IAM Principal used for administration of Amazon WorkSpaces. An IAM Principal may be a IAM Role or an
    IAM User, or an IAM User Group with Users within the User Group. AWS has an AWS Managed Policy, AmazonWorkSpacesAdmin
    that grants permissions to administer Amazon WorkSpaces. A custom managed policy or inline policy may be used to grant
    WorkSpaces permissions to the IAM Principal
  rationale: Creating and managing Workspaces specific users is not done in AWS IAM. Creating and managing Workspaces specific
    users is done within the Workspace service console. In order to properly administer Workspaces specific users, an IAM
    Principal with proper permissions must be created.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/workspaces/latest/adminguide/workspacesaccess-control.html
  - 2. https://docs.aws.amazon.com/workspaces/latest/adminguide/manageworkspaces-users.html
  page_start: 14
  audit_raw: 'Perform the following to determine what policies are created and how the policies are

    used:

    From the Console:

    1. Login in and open the IAM console at https://console.aws.amazon.com/iam/.

    2. In the left pane click on User Groups, Users, or Roles.

    3. Click on the IAM Principal (User, Group, or Role) that is to be used to administer

    Workspaces.

    4. Click on Permissions and confirm that the AmazonWorkSpacesAdmin policy or

    the proper permissions are attached.

    From the Command Line:

    1. Run the appropriate command to determine permissions for the IAM Principal.

    such as list-attached-role-policies for attached managed policies or getrole-policy for inline policies.

    aws iam list-attached-role-policies --role-name <workspace_group_name>

    If the AWS managed policy or a custom WorkSpaces Admin policy is not attached to

    the IAM Principal for administration of Workspaces, refer to the remediation below.'
  remediation: 'If the IAM Principal for WorkSpaces Administration exists but does not have the policy

    attached.

    From the Console:

    1. Login to the IAM console at https://console.aws.amazon.com/iam/.

    2. In the left pane click on either User Groups, Users, or Roles

    3. Click the proper IAM Principal.

    4. Click on the Permissions tab

    5. Click on Attach Policy.

    6. Select the AmazonWorkSpacesAdmin Policy or attach the desired Managed Policy.

    7. Click Attach Policy

    From the Console

    1. Login to the IAM console at https://console.aws.amazon.com/iam/.

    2. In the left pane click on Groups

    3. Select the Group.

    4. Click on the Permissions tab

    5. Click on Attach Policy.

    6. Select the AmazonWorkSpacesAdmin Policy

    7. Click Attach Policy

    From the Command Line:

    1. Attach the AmazonWorkSpacesAdmin policy by running the aws iam attachrole-policy command

    aws iam attach-role-policy --policy-arn

    arn:aws:iam::aws:policy/AmazonWorkSpacesAdmin --role-name

    <WorkSpaces_Admin_Role>'
  checks:
  - type: manual_review
    info: 'Perform the following to determine what policies are created and how the policies are

      used:

      From the Console:

      1. Login in and open the IAM console at https://console.aws.amazon.com/iam/.

      2. In the left pane click on User Groups, Users, or Roles.

      3. Click on the IAM Principal (User, Group, or Role) that is to be used to administer

      Workspaces.

      4. Click on Permissions and confirm that the AmazonWorkSpacesAdmin policy or

      the proper permissions are attached.

      From the Command Line:

      1. Run the appropri'
    severity: medium
- id: '2.2'
  title: Ensure MFA is enabled for WorkSpaces users
  scoring: manual
  profile:
  - Level 2
  description: Multi-Factor Authentication (MFA) adds an extra layer of authentication assurance beyond traditional username
    and password. With MFA enabled, when a user signs in to Amazon WorkSpaces, they will be prompted for their user name and
    password as well as for an authentication code from their physical or virtual MFA token. It is recommended that MFA be
    enabled for all accounts that utilize WorkSpaces.
  rationale: Enabling MFA provides increased security to a username and password as it requires the user to have a virtual
    or physical hardware solution that displays a time-sensitive code.
  impact: To enable MFA for Amazon WorkSpaces you require a RADIUS server or a plugin to a RADIUS server already in use in
    your environment. Multi-factor authentication is not available for Simple AD.
  references:
  - 1. https://docs.aws.amazon.com/directoryservice/latest/adminguide/ad_connector_mfa.html
  - 2. https://docs.aws.amazon.com/directoryservice/latest/adminguide/ms_ad_mfa.html
  page_start: 17
  audit_raw: 'Preform the following steps to check multi-factor authentication is enabled for

    WorkSpaces

    From the Console:

    For AWS Managed AD Authenticated Amazon Workspaces Environments:

    1. Identify the IP address of your RADIUS MFA server and your AWS Managed

    Microsoft AD directory.

    2. In the AWS Directory Service console navigation pane, select Directories.

    3. Choose the directory ID link for your AWS Managed Microsoft AD directory.

    4. On the Directories page, scroll to the Multi-factor authentication section.

    5. In the Multi-factor authentication section, confirm that it is enabled and that

    Radius Status is completed.

    For Self-Managed AD (with AD Connector) Amazon Workspaces Environments:

    1. Identify the IP address and port of your RADIUS MFA server and your AWS Managed

    Microsoft AD Connector Identifier.

    2. In the AWS Workspaces console navigation pane, select Directories.

    3. Choose the directory ID link for your AWS Managed Microsoft AD connector.

    4. On the Directories page, select the Actions > Update Details.

    5. In the Multi-factor authentication section, confirm that it is enabled and that

    Radius Status is completed, Enable Multi-Factor Authentication is checked

    and the IP Address of your Radius MFA server matches that of the RADIUS

    server IP address(es) field.

    If it is not enabled or the Radius status is in another state refer to the remediation steps

    below.'
  remediation: 'Perform the steps below to enable multi-factor authentication for WorkSpaces

    From the console:

    For AWS Managed Microsoft AD based Workspaces Environments:

    1. Identify the IP address of your RADIUS MFA server and your AWS Managed

    Microsoft AD directory.

    2. In the AWS Directory Service console navigation pane, select Directories.

    3. Choose the directory ID link for your AWS Managed Microsoft AD directory.

    4. On the Directories page, scroll to the Multi-factor authentication section.

    5. In the Multi-factor authentication section, click Actions, and then click Enable.

    6. On the Enable multi-factor authentication (MFA) page, provide the following

    values:

    • Display label - Provide a label name.

    • RADIUS server DNS name or IP addresses

    Note - AWS Directory Service does not support RADIUS Challenge/Response

    authentication.

    • Port - default 1812

    • Shared secret code

    • Confirm shared secret code

    • Protocol - MS-CHAPv2

    • Server timeout (in seconds) - 20

    • Max RADIUS request retries - 3

    *** Multi-factor authentication is available when the RADIUS Status changes to

    Enabled.

    7. Click Enable.

    For AD Connector based Workspaces Environments:

    1. Identify the IP address and port of your RADIUS MFA server and, your AWS

    Managed Microsoft AD Connector Identifier.

    2. In the AWS Workspaces console navigation pane, select Directories.

    3. Choose the directory ID link for your AWS Managed Microsoft AD directory

    connector.

    4. On the Directories page, scroll to the Multi-factor authentication section and

    select Edit.

    5. In the Multi-factor authentication section, select Enable Multi-factor

    authentication.

    6. On the Multi-Factor Authentication section, provide the following values:

    • RADIUS server DNS name (s) or IP address (s)

    • Port - default 1812

    • Shared secret code

    • Confirm shared secret code

    • Protocol - MS-CHAPv2

    • Server timeout (in seconds) - 20

    • Max RADIUS request retries - 3

    *** Multi-factor authentication is available when the RADIUS Status changes to

    Enabled.

    7. Click Save'
  checks:
  - type: manual_review
    info: 'Preform the following steps to check multi-factor authentication is enabled for

      WorkSpaces

      From the Console:

      For AWS Managed AD Authenticated Amazon Workspaces Environments:

      1. Identify the IP address of your RADIUS MFA server and your AWS Managed

      Microsoft AD directory.

      2. In the AWS Directory Service console navigation pane, select Directories.

      3. Choose the directory ID link for your AWS Managed Microsoft AD directory.

      4. On the Directories page, scroll to the Multi-factor authentication sect'
    severity: medium
- id: '2.3'
  title: Ensure WorkSpace volumes are encrypted.
  scoring: scored
  profile:
  - Level 1
  description: Encrypt WorkSpaces root volume (C:drive for Windows and root for Amazon Linux) and user volume (D:drive for
    Windows and /home for Amazon Linux).
  rationale: When you launch a WorkSpace, you can encrypt the root volume and the user volume. This ensures that the data
    stored at rest for WorkSpaces is encrypted.
  impact: You must encrypt a WorkSpace when it is launched You cannot create a custom image from an encrypted WorkSpace You
    cannot disable encryption once encryption is enabled for a WorkSpace You must enable to AWS KMS CMK prior to rebuilding/rebooting
    an encrypted WorkSpace or it becomes unusable.
  references:
  - 1. https://docs.aws.amazon.com/workspaces/latest/adminguide/encryptworkspaces.html
  - 2. https://docs.aws.amazon.com/workspaces/latest/adminguide/data-protection.html
  page_start: 20
  audit_raw: "Perform the following steps to confirm that data at rest is encrypted for WorkSpaces\nFrom the Console:\n1.\
    \ Login to the WorkSpaces dashboard at\nhttps://console.aws.amazon.com/workspaces/.\n2. In the left pane click WorkSpaces\
    \ to access the instances listing page.\n3. Check the storage volume(s) encryption status for each Amazon WorkSpaces\n\
    instance available in the current AWS region\n• It will be listed in the Volume Encryption column\nIf the value listed\
    \ in the Volume Encryption column is Disabled, the selected AWS\nWorkSpaces instance volumes are not encrypted.\n4. Change\
    \ the AWS region from the navigation bar and repeat step 3 for all other\nregions.\nFrom the Command line:\n1. Run describe-workspaces\
    \ command (OSX/Linux/UNIX) using custom query\nfilters to list the IDs of all AWS WorkSpaces instances available within\
    \ the\nselected region:\naws workspaces describe-workspaces --region us-east-1 --output table --query\n'Workspaces[*].WorkspaceId'\n\
    2. The command output should return a table with the requested WorkSpaces IDs:\n--------------------\n|DescribeWorkspaces|\n\
    +------------------+\n| ws-aaabbbccc |\n| ws-ccceeefff |\n+------------------+\n3. Execute again describe-workspaces command\
    \ (OSX/Linux/UNIX) using the\nname of the WorkSpaces instance as identifier and custom query filters to get the\nencryption\
    \ status for both root and user storage volumes:\naws workspaces describe-workspaces --region us-east-1 --workspace-ids\
    \ wsaaabbbccc --query\n'Workspaces[*].[RootVolumeEncryptionEnabled,UserVolumeEncryptionEnabled]'\n4. The command output\
    \ should return the encryption status (flag) for both root and\nuser instance volumes (true for enabled, false for disabled):\n\
    [\n [\n false,\n false\n ]\n]\nIf the returned flag value for both root and user volumes is false (as shown in the output\n\
    example above), the selected AWS WorkSpaces instance volumes are not encrypted.\n5. Repeat step 3 and 4 to verify the\
    \ storage volumes encryption status for other\nAWS WorkSpaces instances provisioned in the current region.\n6. Change\
    \ the AWS region by updating the --region command parameter value and\nrepeat steps 1 - 5 to perform the audit process\
    \ for other regions.\nIf the selected AWS WorkSpaces instance volumes are not encrypted, refer to the\nremediation procedure\
    \ below."
  remediation: "Perform the following steps to encrypt WorkSpace volumes\nFrom the Console:\n1. Login to the WorkSpaces console\
    \ at\nhttps://console.aws.amazon.com/workspaces/\n2. Click Launch WorkSpaces and complete the first three steps.\n3. For\
    \ the WorkSpaces Configuration step, do the following:\n - Select the volumes to encrypt: Root Volume, User Volume, or\
    \ both\nvolumes.\n - For Encryption Key, select an AWS KMS CMK. The CMK that you select must\nbe symmetric.\n4. Click\
    \ Next Step.\n5. Click Launch WorkSpaces.\nNOTE:\nTo encrypt existing AWS WorkSpaces data you must re-create the necessary\n\
    WorkSpaces instances with the volumes encryption feature enabled as outlined above.\nFrom the Command line:\n1. Run the\
    \ create-workspaces command\naws workspaces create-workspaces --workspaces DirectoryId=`your_directoryID`,\nUserName=`user_for_workspace`,\
    \ BundleId=`bundle_to_build`,\nVolumeEncryptionKey=`AWS_KMS_customer_master_key_(CMK)`,\nUserVolumeEncryptionEnabled=`true`,\
    \ RootVolumeEncryptionEnabled='true',\nWorkspaceProperties={RunningMode=`AUTO_STOP`,\nRunningModeAutoStopTimeoutInMinutes=`10`,\
    \ RootVolumeSizeGib=`root_GB`,\nUserVolumeSizeGib=`user_GB`, ComputeTypeName=`STANDARD`}\n2. You will receive output highlighting:\n\
    - FailedRequests - Will contain information about the WorkSpaces that could\nnot be created, and the command failed\n\
    - PendingRequests - Will contain information about the WorkSpaces that were\ncreated and the command was successful."
  checks:
  - type: manual_review
    info: 'Perform the following steps to confirm that data at rest is encrypted for WorkSpaces

      From the Console:

      1. Login to the WorkSpaces dashboard at

      https://console.aws.amazon.com/workspaces/.

      2. In the left pane click WorkSpaces to access the instances listing page.

      3. Check the storage volume(s) encryption status for each Amazon WorkSpaces

      instance available in the current AWS region

      • It will be listed in the Volume Encryption column

      If the value listed in the Volume Encryption column is Disabled, '
    severity: medium
- id: '2.4'
  title: Ensure WorkSpaces are deployed in their own virtual private cloud (VPC)
  scoring: manual
  profile:
  - Level 1
  description: Amazon WorkSpaces VPC should be created with two private subnets for your WorkSpaces and a NAT gateway in a
    public subnet.
  rationale: The NAT gateway will provide WorkSpaces access to the internet for updates to the operating system and so that
    applications can be deployed using Amazon WorkSpaces Application Manager if that is applicable for your environment.
  impact: Your VPC's subnets must be in different Availability Zones in the Region where you're launching WorkSpaces.
  references:
  - 1. https://docs.aws.amazon.com/workspaces/latest/adminguide/amazonworkspaces-vpc.html
  - 2. https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Subnets.html#vpcsizing-ipv4
  page_start: 24
  audit_raw: 'Perform the following steps to confirm that a VPC exists for WorkSpaces and is

    configured correctly.

    From the Console:

    1. Login to the VPC console at https://console.aws.amazon.com/vpc/

    2. In the left pane, click Your VPC''s

    3. Select the VPC for WorkSpaces

    4. Confirm the IPv4 settings are using a CIDR block from the private (non-publicly

    routable) IP address ranges. For example, 10.0.0.0/16. For more information,

    see the references below.

    5. Confirm the IPv6 CIDR Block, set to No.

    6. Confirm the IPv4 CIDR block for the public subnet (example - WorkSpaces

    Public Subnet)

    • Availability Zone, set to No Preference.

    7. Confirm the IPv4 CIDR block for the first private subnet (example - WorkSpaces

    Private Subnet 1)

    - Availability Zone, set for Amazon WorkSpaces.

    - Elastic IP Allocation ID

    - Service endpoints - `Blank`

    - Enable DNS hostnames, set to `Yes`.

    - Hardware tenancy, Default.

    8. Confirm the IPv4 CIDR block for the first private subnet (example - WorkSpaces

    Private Subnet 2)

    - Availability Zone set for Amazon WorkSpaces.

    NOTE-Make sure you select a different Availability Zone from the one you

    selected for the Workspaces Private Subnet 1

    - Elastic IP Allocation ID

    - Service endpoints - Blank

    - Enable DNS hostnames, set to `Yes`.

    - Hardware tenancy, Default.

    If this is not set as referenced above refer to the remediation procedure below.'
  remediation: 'Perform the following steps to create a VPC for Workspaces

    From the Console:

    Allocate an Elastic IP Address

    1. Login in to the VPC console at https://console.aws.amazon.com/vpc/

    2. In the left pane, click Elastic IPs.

    3. Click Allocate new address.

    4. On the Allocate new address page, for iPv4 address pool, click Amazon pool or

    Owned by me

    5. Click Allocate.

    6. Make a note of the Elastic IP address, click Close.

    Create a VPC with one public subnet and two private subnets as follows.

    1. Login in to the VPC console at https://console.aws.amazon.com/vpc/

    2. In the left pane, click VPC Dashboard in the upper-left corner.

    3. Click Launch VPC Wizard.

    4. Click VPC with Public and Private Subnets

    5. Click Select.

    6. Configure the VPC as follows:

    - For IPv4 CIDR block, enter the CIDR block from the private (non-publicly

    routable) IP address ranges. - example 10.0.0.0/16.

    - For IPv6 CIDR Block, keep `No IPv6 CIDR Block`.

    - For VPC name, enter a `name for the VPC` (example: WorkspacesVPC)

    - Public subnet''s IPv4 CIDR - enter a CIDR block from the private (nonpublicly routable) IP address range - ie. 10.0.0.0/24.

    - For Availability Zone, keep `No Preference`.

    - For Public subnet name, enter a `name for the subnet` (example: WorkSpaces

    Public Subnet).

    - For Private subnet''s IPv4 CIDR, enter the CIDR block for the subnet.

    - `Availability Zone` - Accept the default value - No Preference

    - For Private subnet name, enter a `name for the subnet` (example: WorkSpaces

    Private Subnet 1).

    - For Elastic IP Allocation ID, enter the Elastic IP address that you

    created.

    - For Service endpoints, `do nothing`.

    - For Enable DNS hostnames, keep `Yes`.

    - For Hardware tenancy, keep `Default`.

    7. Click Create VPC. Note that it takes several minutes to set up your VPC. After

    the VPC is created.

    8. Click OK.

    Create a Second Private Subnet

    1. In the left pane, click Subnets.

    2. Click Create Subnet.

    - For Name tag, enter a `name for the private subnet` (example: WorkSpaces

    Private Subnet 2).

    - For VPC, `select the VPC` that you created.

    - For Availability Zone. Make sure you select a different Availability Zone

    from the one used in WorkSpaces Private Subnet 1.

    - For IPv4 CIDR block, enter the CIDR block for the subnet.

    3. Click Create.

    Verify and Name the Route Tables for Public

    1. In the left pane, click Subnets

    2. Click the public subnet that you created. (example: WorkSpaces Public Subnet)

    3. On the Route Table tab, choose the ID of the route table (example: rtb12345678).

    4. Click the route table.

    5. Under Name, choose the edit icon, enter a name (example: workspaces-publicroutetable)

    6. Click the check mark to save the name.

    7. On the Routes tab, verify that there is one route for local traffic and another route

    that sends all other traffic to the internet gateway for the VPC.

    Verify and Name the Route Tables for Private

    1. In the left pane, click Subnets

    2. Click the private subnet 1 that you created. (example: WorkSpaces Private

    Subnet 1)

    3. On the Route Table tab, choose the ID of the route table (example: rtb12345678).

    4. Click the route table.

    5. Under Name, choose the edit icon, enter a name (example: workspaces-privateroutetable)

    6. Click the check mark to save the name.

    7. On the Routes tab, verify that there is one route for local traffic and another route

    that sends all other traffic to the NAT gateway.

    8. Repeat steps 1-7 under Verify and Name the Route Tables for Private'' for

    WorkSpaces Private Subnet 2`'
  checks:
  - type: sql
    command: Select the VPC for WorkSpaces
    severity: medium
    info: 'Perform the following steps to confirm that a VPC exists for WorkSpaces and is

      configured correctly.

      From the Console:

      1. Login to the VPC console at https://console.aws.amazon.com/vpc/

      2. In the left pane, click Your VPC''s

      3. Select the VPC for WorkSpaces

      4. Confirm the IPv4 settings are using a CIDR block from the private (non-publicly

      routable) IP address ranges. For example, 10.0.0.0/16. For m'
- id: '2.5'
  title: Ensure WorkSpaces traffic is controlled and routed through a NAT Gateway.
  scoring: manual
  profile:
  - Level 1
  description: A network address translation (NAT) gateway enables instances in a private subnet to connect to the internet
    or other AWS services, but prevents the internet from initiating a direct connection with those instances.
  rationale: WorkSpaces must have access to the internet so that you can install updates to the operating system and deploy
    applications.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html
  - 2. https://docs.aws.amazon.com/workspaces/latest/adminguide/amazonworkspaces-vpc.html
  page_start: 28
  audit_raw: 'Perform the following steps to verify a NAT Gateway is configured and utilized.

    From the Console:

    1. Login to the VPC console at https://console.aws.amazon.com/vpc/

    2. In the left pane, click Route Tables.

    3. On the Route Table tab.

    4. Select the public route table set for WorkSpaces.

    5. Click the Subnet Associations Tab

    6. Confirm that the Subnet ID is set to the WorkSpaces Public subnet.

    7. De-select the public route table and select the WorkSpaces Private route table.

    8. Click the Subnet Associations Tab

    9. Confirm that the Subnet ID is set to the 2 WorkSpaces Private subnet.

    If the Route tables aren''t set for one route for local traffic and another route that sends

    all other traffic to the internet gateway for the VPC refer to the remediation procedure

    below.'
  remediation: 'Perform the following steps to create a NAT gateway

    From the Console:

    1. Login to the VPC console at https://console.aws.amazon.com/vpc/

    2. In the left pane, click NAT Gateways

    3. Click Create NAT Gateway.

    4. For NAT Gateway settings

    - Name - although optional use something to identify it with WorkSpaces

    - Specify the subnet in which to create the NAT gateway

    - Select the Elastic IP Allocation ID

    5. Click Create a NAT Gateway.

    _The NAT gateway will display in the console and after a few moments, its status will

    change to Available.

    If the NAT gateway goes to a status of Failed, there was an error during creation._

    After you''ve created your NAT gateway, you must update your route tables for your

    private subnets to point internet traffic to the NAT gateway.

    To create a route for a NAT gateway

    1. Log in to the VPC console at https://console.aws.amazon.com/vpc/.

    2. In the left pane, Click Route Tables.

    3. Select the route table associated with your private subnet.

    4. Click Routes tab.

    5. Click Edit routes

    6. Click Add route

    7. For Edit routes

    - Destination, enter 0.0.0.0/0.

    - Target, select the ID of your NAT gateway.

    8. Click Save routes'
  checks:
  - type: manual_review
    info: 'Perform the following steps to verify a NAT Gateway is configured and utilized.

      From the Console:

      1. Login to the VPC console at https://console.aws.amazon.com/vpc/

      2. In the left pane, click Route Tables.

      3. On the Route Table tab.

      4. Select the public route table set for WorkSpaces.

      5. Click the Subnet Associations Tab

      6. Confirm that the Subnet ID is set to the WorkSpaces Public subnet.

      7. De-select the public route table and select the WorkSpaces Private route table.

      8. Click the Subnet Asso'
    severity: medium
- id: '2.6'
  title: Ensure Web Access to Workspaces is Disabled
  scoring: scored
  profile:
  - Level 1
  description: WorkSpaces access should be restricted to trusted operating systems and clients
  rationale: WorkSpaces access is supported from a variety of clients and operating systems, including HTML5 based browsers.
    Disabling Web Access prevents access to the Workspace from HTML5 based browsers, ensuring access can only occur from known
    operating systems.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/workspaces/latest/adminguide/web-access.html
  page_start: 31
  audit_raw: 'Perform the following steps to confirm that Web Access is disabled.

    From the Console:

    1. Log in to the WorkSpaces console at

    https://console.aws.amazon.com/workspaces/

    2. In the left pane, click Directories.

    3. Select the directory id link you wish to view.

    4. Scroll to the Other platforms section.

    5. Confirm that Web Access is denied.

    If everything is not configured as above refer to the remediation below.'
  remediation: 'Perform the following steps to disable Web Access.

    From the Console:

    1. Log in to the WorkSpaces console at

    https://console.aws.amazon.com/workspaces/

    2. In the left pane, click Directories.

    3. Select the directory id link.

    4. Scroll to the Other platforms section.

    5. Uncheck Web Access.

    6. Click Save'
  checks:
  - type: manual_review
    info: 'Perform the following steps to confirm that Web Access is disabled.

      From the Console:

      1. Log in to the WorkSpaces console at

      https://console.aws.amazon.com/workspaces/

      2. In the left pane, click Directories.

      3. Select the directory id link you wish to view.

      4. Scroll to the Other platforms section.

      5. Confirm that Web Access is denied.

      If everything is not configured as above refer to the remediation below.'
    severity: medium
- id: '2.7'
  title: Ensure access is limited to trusted devices
  scoring: manual
  profile:
  - Level 2
  description: WorkSpaces access should be restricted to trusted devices with valid certificates.
  rationale: WorkSpaces is accessible from any supported device that is connected to the internet. When you enable access
    to trusted devices, Amazon WorkSpaces uses certificatebased authentication to determine whether a device is trusted.
  impact: 'For each directory, you can import up to two root certificates and Amazon WorkSpaces will present them both to
    the client. Note: Certificates for trusted devices only applies to the Amazon WorkSpaces OS clients. This feature does
    not apply to the Amazon WorkSpaces Web Access client, or any third-party clients.'
  references:
  - 1. https://docs.aws.amazon.com/workspaces/latest/adminguide/trusteddevices.html
  - 2. https://docs.aws.amazon.com/acm/latest/userguide/gs.html
  page_start: 33
  audit_raw: 'Perform the following steps to confirm that Allow Trusted Devices is set.

    From the Console:

    1. Log in to the WorkSpaces console at

    https://console.aws.amazon.com/workspaces/

    2. In the left pane, click Directories.

    3. Select the directory id link.

    4. Scroll to the Access Control Options section.

    5. Confirm that the correct Allow settings are in place.

    6. Confirm that certificates have been imported.

    7. Confirm that the correct device types have been enabled.

    If everything is not configured as above refer to the remediation below.'
  remediation: "Perform the following steps to set the restriction Allow Trusted Devices\nCreate the Certificates\nNote -\
    \ It requires root certificates generated by an internal Certificate Authority (CA) and\nclient certificates that chain\
    \ up to a root certificate.\nRequirements\n- Certificates must be Base64-encoded certificate files in CRT, CERT, or PEM\n\
    format.\n- Certificates must include a Common Name.\n- The maximum length of certificate chain supported is 4.\n- Use\
    \ a strong encryption algorithm. Minimum SHA256 with RSA, SHA256 with\nECDSA. Other options SHA381 with ECDSA, or SHA512\
    \ with ECDSA.\n- Make sure \"key usage: Digital signature\" is present on the public key.\n- For macOS, if the device\
    \ certificate is in the system keychain, authorize\nthe WorkSpaces client application to access those certificates.\n\
    Deploy Client Certificates to the Trusted Devices\n- Client certificates must be installed on the trusted devices for\
    \ your\nusers.\nUtilize a third party tool to install the certificates or have the\ncertificates installed locally by\
    \ an administrator.\n- On Windows, the WorkSpaces client application searches for client\ncertificates in both the user\
    \ and root certificate stores.\n- On macOS, the WorkSpaces client application searches for client\ncertificates in the\
    \ entire keychain.\nConfigure the Restriction\nFrom the Console:\n1. Login to the WorkSpaces console at\nhttps://console.aws.amazon.com/workspaces/\n\
    2. In the left pane, click Directories.\n3. Select the directory id link.\n4. Scroll to the Access Control Options section\
    \ and click Edit.\n - [Windows] Choose Only Allow Trusted Windows Devices to Access\nWorkSpaces.\n - [macOS] Choose Only\
    \ Allow Trusted macOS Devices to Access\nWorkSpaces.\n5. Import up to two root certificates. For each root certificate,\
    \ do the following:\n - Choose Import.\n - Copy the body of the certificate to the form.\n - Choose Import.\n (Optional)\
    \ Specify whether other types of devices have access to\nWorkSpaces.\n6. Scroll down to the Trusted devices section.\n\
    7. Select the device types allowed to Trusted devices.\n8. To block access from all selected device types, click Deny\
    \ All.\n9. Click Save."
  checks:
  - type: manual_review
    info: 'Perform the following steps to confirm that Allow Trusted Devices is set.

      From the Console:

      1. Log in to the WorkSpaces console at

      https://console.aws.amazon.com/workspaces/

      2. In the left pane, click Directories.

      3. Select the directory id link.

      4. Scroll to the Access Control Options section.

      5. Confirm that the correct Allow settings are in place.

      6. Confirm that certificates have been imported.

      7. Confirm that the correct device types have been enabled.

      If everything is not configured as abo'
    severity: medium
- id: '2.8'
  title: Ensure the default IP access control group is disassociated.
  scoring: scored
  profile:
  - Level 1
  description: The default IP Access Control group allows all traffic. Once you create and attach an IP Access Control Group
    the default is disassociated.
  rationale: IP Access Control group acts as a virtual firewall for your WorkSpaces allowing you to add your trusted networks.
  impact: IP access control groups do not allow the use of dynamic IP addresses when using a NAT gateway and additional configuration
    has to be considered.
  references:
  - 1. https://docs.aws.amazon.com/workspaces/latest/adminguide/amazonworkspaces-ip-access-control-groups.html
  - 2. https://docs.aws.amazon.com/cli/latest/reference/workspaces/create-ipgroup.html
  page_start: 36
  audit_raw: 'Perform the following steps to review your Directory

