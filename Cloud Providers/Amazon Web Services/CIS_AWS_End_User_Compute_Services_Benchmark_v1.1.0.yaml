    \ id link.\n4. Scroll to the Maintenance mode section and ensure maintenance mode is set to\nEnabled.\nIf it is set to\
    \ Enabled you are meeting this recommendation.\nIf it is set to Disabled, refer to the remediation below.\nFrom the Command\
    \ line:\n1. Run the workspaces command describe-workspace-directories\naws workspaces describe-workspace-directories\n\
    2. Review the output under \"WorkspaceCreationProperties\" for\n\"EnableMaintenanceMode\" : true\nExample output:\n \"\
    WorkspaceCreationProperties\" :\n {\n \"EnableInternetAccess\" : false,\n \"EnableWorkDocs\" : true,\n \"UserEnabledAsLocalAdministrator\"\
    \ : true\n \"EnableMaintenanceMode\" : true\n },\nIf it is set to true you are meeting this recommendation.\nIf it is\
    \ set to false or is not listed in the output at all, refer to the remediation below."
