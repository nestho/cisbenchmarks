- id: '5.1'
  title: Ensure AppStream is utilizing its own virtual private cloud (VPC)
  scoring: manual
  profile:
  - Level 1
  description: AppStream 2.0 should be configured using a VPC with Private subnets and a NAT Gateway.
  rationale: For AppStream 2.0 the public subnet will have direct access to the internet through the NAT gateway. This setup
    allows the streaming instances in your private subnets to connect to the internet or other AWS services.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/appstream2/latest/developerguide/vpc-setuprecommendations.html
  - 2. https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Subnets.html#vpcsizing-ipv4
  page_start: 92
  audit_raw: "Perform the following to determine if a VPC is setup for AppStream 2.0 correctly.\nFrom Console:\n1. Login to\
    \ the VPC console at https://console.aws.amazon.com/vpc/\n2. In the left pane, click Your VPCs\n3. Select the VPC for\
    \ AppStream 2.0 and take note of the name and the VPC ID\n4. In the left pane, click Subnets\n5. Confirm you have 3 subnets\
    \ labeled and associated with the VPC\n1 AppStream Public Subnet and 2 AppStream Private Subnets\n6. Confirm the AppStream\
    \ Public Subnet is configured correctly.\no Select AppStream Public subnet\nDescription tab - VPC matches `AppStream ID\
    \ and name`\nRoute Table tab - verify contains rules\n`-Example` - Destination - 10.0.0.0/20, Target - local\n`-Example`\
    \ - Destination - 0.0.0.0/0, Target - internet_gateway_ID\n7. Confirm the 2 AppStream Private Subnets are configured correctly.\n\
    o Select AppStream Private subnet 1\nDescription Tab - VPC matches `AppStream ID and name` and note Availability\nzone\n\
    Route Table tab - verify contains routes\n`-Example` - Destination - 10.0.0.0/20, Target - local\n`-Example` - Destination\
    \ - 0.0.0.0/0, Target - nat_gateway_ID\n`-Example- optional` - Destination - S3bucket_enpoint_ID, Target -\nstorage_vpce_ID\n\
    \ - Select AppStream Private subnet 2\nDescription Tab - VPC matches `AppStream ID and name` and Availability zone\nis\
    \ set to something different than Private subnet 1\nRoute Table tab - verify contains routes\n`-Example` - Destination\
    \ - 10.0.0.0/20, Target - local\n`-Example` - Destination - 0.0.0.0/0, Target - nat_gateway_ID\n`-Example- optional` -\
    \ Destination - S3bucket_enpoint_ID, Target -\nstorage_vpce_ID\nIf The AppStream VPC, subnets and route tables are not\
    \ configured correctly refer to\nthe remediation procedure below."
  remediation: "Perform the steps below to create a VPC, subnets and routing table for AppStream 2.0\nFrom the Console\nAllocate\
    \ an Elastic IP address\n1. Login in to the Amazon VPC console at https://console.aws.amazon.com/vpc/\n2. In the left\
    \ pane, click Elastic IPs.\n3. Click Allocate new address.\n4. Then click on Allocate.\n5. Make a note of the Elastic\
    \ IP address.\n6. Click Close.\nCreate a New VPC with one public subnet and two private subnet's.\n1. Login to the VPC\
    \ console at https://console.aws.amazon.com/vpc/\n2. Click Launch VPC Wizard.\n3. Choose VPC with Public and Private Subnet'sand\
    \ then clickSelect`.\n4. Configure the VPC as follows:\n - `IPv4 CIDR block` - enter a CIDR block from the private (non-publicly\n\
    routable) IP address range - example. 10.0.0.0/16.\n - `IPv6 CIDR block` - Accept the default value - No IPv6 CIDR Block\n\
    \ - `VPC name` enter a name for the VPC (example, AppStream VPC).\n - `Public subnet's IPv4 CIDR` - enter a CIDR block\
    \ from the private\n(non-publicly routable) IP address range - ie. 10.0.0.0/24.\n - `Availability Zone` - Accept the default\
    \ value - No Preference\n - `Public subnet name` - enter a name for the subnet (example, AppStream\nPublic Subnet)\n -\
    \ `Private subnet's IPv4 CIDR` - enter the CIDR block for the subnet.\n - `Availability Zone` - Accept the default value\
    \ - No Preference\n - `Private subnet name` - enter a name for the subnet (example,\nAppStream Private Subnet 1).\n -\
    \ `Elastic IP Allocation ID` - enter the Elastic IP address that you\ncreated.\n - `Service Endpoints` - Accept the default\
    \ value - Blank\n - `Enable DNS hostnames` - Accept the default value - Yes\n - `Hardware tenancy` - Accept the default\
    \ value - Default\n5. Click on Create VPC\n***Note that it takes several minutes to set up your VPC. After the VPC is\n\
    created, choose OK.\nCreate the Second Private subnet to the VPC\n1. In the left pane, choose Subnets.\n2. Click Create\
    \ subnet.\n - `Name tag` - enter a name for the private subnet (example, AppStream\nPrivate subnet 2).\n - `VPC` - select\
    \ the VPC that you created for AppStream 2.0.\n - `Availability Zone` - select a different one than you are using for\n\
    AppStream2 Private subnet 1.\n - `IPv4 CIDR block` - enter the CIDR block for the subnet.\n3. Click Create.\nVerify and\
    \ Name the Route Tables\n1. In the left pane, choose Subnets\n2. Select the public subnet that you created (example, AppStream\
    \ Public subnet)\n3. On the Route Table tab, click the ID of the route table (example, rtb-12345678).\n4. Select the route\
    \ table.\n5. Under Name, choose the edit icon (the pencil), enter a name (for example,\nappstream-public-routetable),\
    \ then click the check mark to save.\n6. On the Routes tab, confirm one destination and target for local traffic and another\n\
    destination and target that sends all other traffic to the internet gateway\n(example, igw-0518a307898725db2).\n7. In\
    \ the left pane, choose Subnets.\n8. Select the first private subnet that you created (example, AppStream Private\nsubnet\
    \ 1)\n9. On the Route Table tab, click the ID of the route table (example, rtb-12345678).\n10. Select the route table.\
    \ Under Name, choose the edit icon (the pencil), enter a\nname (for example, appstream-private-routetable1), then click\
    \ the check mark to\nsave.\n11. On the Routes tab, confirm one destination and target for local traffic and another\n\
    destination and target that sends all other traffic to the NAT gateway (example,\nnat-06ea352539b2fddfc).\n12. In the\
    \ left pane, choose Subnets.\n13. Select the second private subnet that you created (example, AppStream Private\nsubnet\
    \ 2)\n14. On the Route Table tab, click the ID of the route table (example, rtb-12345678).\n15. Select the route table.\
    \ Under Name, choose the edit icon (the pencil), enter a\nname (for example, appstream-private-routetable2), then click\
    \ the check mark to\nsave.\n16. On the Routes tab, confirm one destination and target for local traffic and another\n\
    destination and target that sends all other traffic to the NAT gateway (example,\nnat-06ea352539b2fddfc)."
  checks:
  - type: manual_review
    info: 'Perform the following to determine if a VPC is setup for AppStream 2.0 correctly.

      From Console:

      1. Login to the VPC console at https://console.aws.amazon.com/vpc/

      2. In the left pane, click Your VPCs

      3. Select the VPC for AppStream 2.0 and take note of the name and the VPC ID

      4. In the left pane, click Subnets

      5. Confirm you have 3 subnets labeled and associated with the VPC

      1 AppStream Public Subnet and 2 AppStream Private Subnets

      6. Confirm the AppStream Public Subnet is configured correctly.

      '
    severity: medium
