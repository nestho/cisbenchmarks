- id: '4.2'
  title: Ensure MFA is enabled for WorkDoc users
  scoring: manual
  profile:
  - Level 2
  description: Multi-Factor Authentication (MFA) adds an extra layer of authentication assurance beyond traditional username
    and password. With MFA enabled, when a user signs in to Amazon WorkDocs, they will be prompted for their user name and
    password as well as for an authentication code from their MFA token.
  rationale: Enabling MFA provides increased security to a user name and password as it requires the user to possess a solution
    that displays a time-sensitive authentication code.
  impact: To enable MFA for Amazon WorkDocs you require a RADIUS server or a plugin to a RADIUS server already implemented
    in your environment. Multi-factor authentication is not available for Simple AD. You can enable multi-factor authentication
    for AD Connector if you have Active Directory running on-premises or in EC2 instances.
  references:
  - 1. https://docs.aws.amazon.com/directoryservice/latest/adminguide/ad_connector_mfa.html
  - 2. https://docs.aws.amazon.com/directoryservice/latest/adminguide/ms_ad_mfa.html
  page_start: 75
  audit_raw: "Perform the steps below to confirm MFA setup and configuration.\nFrom the console:\n1. Log in to the Directory\
    \ Service console at\nhttps://console.aws.amazon.com/directoryservicev2\n2. Select Directories.\n3. Choose the directory\
    \ ID link for your AWS Managed Microsoft AD directory.\n4. On the Directory details page, select the Networking & security\
    \ tab.\n5. In the Multi-factor authentication section, Confirm Radius status is set to\nEnabled.\n6. Open the WorkDocs\
    \ console at https://console.aws.amazon.com/zocalo/\n7. In the Manage Your WorkDocs Sites page, select the desired site\
    \ and choose\nActions and Manage MFA.\n8. Confirm the values are set correctly.\nMulti-factor authentication is available\
    \ when the RADIUS Status reads Enabled.\nFrom the Command line:\n1. Run describe-directories command to list the identifiers\
    \ of all the Active Directory\n(AD) Connector directories, available in the selected AWS region:\naws ds describe-directories\n\
    \ --region us-east-1\n --output table\n --query 'DirectoryDescriptions[*].DirectoryId'\n2. The command output should return\
    \ a table with the requested resource IDs:\n---------------------\n|DescribeDirectories|\n+-------------------+\n| d-12345abcde\
    \ |\n| d-abcd012345 |\n| d-aabbcc1234 |\n+-------------------+\n3. Run describe-directories command using the ID of the\
    \ AD Connector directory to\nget the status of the RADIUS MFA server connection:\naws ds describe-directories\n --region\
    \ us-east-1\n --directory-ids d-12345abcde\n --query 'DirectoryDescriptions[*].RadiusStatus'\n4. The command output should\
    \ return the requested status information:\n[]\n5. Repeat steps 3 and 4 to determine the MFA status for other AD Connector\n\
    directories.\n6. Change the AWS region by updating the --region command parameter value and\nrepeat steps 1 – 5 to perform\
    \ the audit process for other regions.\nIf describe-directories command output returns an empty array, as shown in the\n\
    example above, there is no RADIUS MFA server configured for the selected AD\nDirectory, therefore the resource does not\
    \ have Multi-Factor Authentication (MFA)\nprotection enabled. Refer to the remediation below."
  remediation: 'Perform the following steps to setup MFA on the server and in WorkDocs.

    From the Console:

    1. Identify the IP address of your RADIUS MFA server and your AWS Managed

    Microsoft AD directory.

    2. In the AWS Directory Service console navigation pane, select Directories.

    3. Choose the directory ID link for your AWS Managed Microsoft AD directory.

    4. On the Directory details page, select the Networking & security tab.

    5. In the Multi-factor authentication section, choose Actions, and then choose

    Enable.

    6. On the Enable multi-factor authentication (MFA) page, provide the following

    values:

    - Display label - Provide a label name.

    - RADIUS server DNS name or IP addresses

    - Port - default 1812

    - Shared secret code

    - Confirm shared secret code

    To enable multi-factor authentication in WorkDocs:

    1. Open WorkDocs console at https://console.aws.amazon.com/zocalo/

    2. In the Manage Your WorkDocs Sites page, select the desired site and choose

    Actions and Manage MFA.

    3. Enter the following values:

    - Enable Multi-Factor Authentication

    - Check to enable multi-factor authentication.

    - RADIUS server IP address(es) - The IP addresses of your RADIUS server

    endpoints

    - Port - The port that your RADIUS server is using for communications.

    Default RADIUS server port (1812)

    - Shared secret code - The shared secret code that was specified when your

    RADIUS endpoints were created.

    - Confirm shared secret code

    - Protocol - MS-CHAPv2

    - Server timeout - (in seconds) - 20

    - Max retries - 3

    4. Choose Enable.

    Multi-factor authentication is available when the RADIUS Status changes to Enabled.

    To enable RADIUS-based MFA protection for your Active Directory (AD) Connector

    directories, perform the following actions:

    Note: Enabling Multi-Factor authentication for AD Connector directories using the AWS

    Management Console is not currently supported.

    From the Command line:

    1. Run the enable-radius command:

    aws ds enable-radius --region us-east-1 --directory-id <value> --radiussettings { "RadiusServers": ["radius.<your-radius-server>.com"],"RadiusPort":

    1812,"RadiusTimeout": 20,"RadiusRetries": 3,"SharedSecret":

    "radiusmfa","AuthenticationProtocol": "MS-CHAPv2","DisplayLabel": "RADIUS

    Multi-Factor Authentication","UseSameUsername": true }

    2. Repeat step 1 for other AD Connectors and the Selected regions.'
  checks:
  - type: manual_review
    info: 'Perform the steps below to confirm MFA setup and configuration.

      From the console:

      1. Log in to the Directory Service console at

      https://console.aws.amazon.com/directoryservicev2

      2. Select Directories.

      3. Choose the directory ID link for your AWS Managed Microsoft AD directory.

      4. On the Directory details page, select the Networking & security tab.

      5. In the Multi-factor authentication section, Confirm Radius status is set to

      Enabled.

      6. Open the WorkDocs console at https://console.aws.amazon.com'
    severity: medium
