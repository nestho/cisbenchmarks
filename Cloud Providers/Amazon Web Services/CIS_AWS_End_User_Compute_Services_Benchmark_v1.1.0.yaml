      2. In the left pane, click Directories.

      3. Select your directory id link.

      4. Scroll to the IP access control groups section and click Edit.

      5. Confirm that you have an IP Access Control Group Associated with this

      Directory.

      6. Make note of the name'
- id: '2.9'
  title: Ensure CloudWatch is set up for WorkSpaces
  scoring: manual
  profile:
  - Level 1
  description: Set up and utilize Amazon CloudWatch Events for successful logins to WorkSpaces.
  rationale: Use Cloudwatch to store/archive WorkSpaces login events for future reference, analysis, and action based on the
    patterns. Utilize the IP address collected to figure out where users are logged in from, and then build policies to allow
    access only to files or data from those WorkSpaces that meet company access criteria. With this information you can also
    use policy controls to block access from unauthorized IP addresses.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/workspaces/latest/adminguide/amazonworkspaces-monitoring.html
  - 2. https://docs.aws.amazon.com/workspaces/latest/adminguide/cloudwatchevents.html
  page_start: 39
  audit_raw: "Perform the following steps to review the rules for CloudWatch and WorkSpaces Events\nFrom the Console:\n1.\
    \ Login to the CloudWatch console at\nhttps://console.aws.amazon.com/cloudwatch/\n2. In the left pane click Rules.\n3.\
    \ Click Rules.\n4. Click on the Rule Name for your WorkSpaces Access Events\n5. Confirm the Event Pattern\n{\n \"source\"\
    : [\n \"aws.workspaces\"\n ],\n \"detail-type\": [\n \"WorkSpaces Access\"\n ]\n}\n6. Confirm Status is Enabled\n7. Confirm\
    \ at least one Target is created for CloudWatch Log Group\nIf there is no CloudWatch Event created with the rule as outlined\
    \ above refer to the\nremediation below."
  remediation: 'Perform the following steps to create a Rule for CloudWatch WorkSpaces Events

    From the Console:

    1. Login to the CloudWatch console at

    https://console.aws.amazon.com/cloudwatch/

    2. In the left pane click Rules.

    3. Click Create rule.

    4. For Event Source, do the following:

    - Click `Event Pattern` and Build event pattern to match events by service

    (the default).

    5. For Service Name, click WorkSpaces.

    6. For Event Type, click WorkSpaces Access.

    7. For Targets, click Add target

    - Click and Change the Lambda Function to `CloudWatch log group`

    8. For Log Group, enter /aws/events/workspaces_access

    Note - You can add additional targets for other services to act when a WorkSpaces

    Access event is detected.

    9. Click Configure details.

    10. For Rule definition, enter a name and description.

    11. Click `Create rule''

    12. Click Create rule.'
  checks:
  - type: manual_review
    info: "Perform the following steps to review the rules for CloudWatch and WorkSpaces Events\nFrom the Console:\n1. Login\
      \ to the CloudWatch console at\nhttps://console.aws.amazon.com/cloudwatch/\n2. In the left pane click Rules.\n3. Click\
      \ Rules.\n4. Click on the Rule Name for your WorkSpaces Access Events\n5. Confirm the Event Pattern\n{\n \"source\"\
      : [\n \"aws.workspaces\"\n ],\n \"detail-type\": [\n \"WorkSpaces Access\"\n ]\n}\n6. Confirm Status is Enabled\n7.\
      \ Confirm at least one Target is created for CloudWatch Log Group\nI"
    severity: medium
- id: '2.10'
  title: Ensure that patches and updates are performed on the operating system for Workstations
