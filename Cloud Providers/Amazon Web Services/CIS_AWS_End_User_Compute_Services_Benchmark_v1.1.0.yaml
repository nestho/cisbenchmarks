    - For Service category, ensure that AWS services is selected.

    - For Service Name, choose com.amazonaws.<AWS Region>.appstream.streaming.

    - For VPC, choose a VPC in which to create the interface endpoint.

    - For Subnets, choose the subnets (Availability Zones) in which to create the

    endpoint network interfaces.

    - Ensure that the Enable Private DNS Name check box is selected.

    - For Security group, select the security group for AppStream

    4. Click Create endpoint.

    To update a stack to use a new interface endpoint

    1. Log in to AppStream 2.0 console at

    https://console.aws.amazon.com/appstream2

    2. In the left pane, click Stacks, and click the link of the stack name wish to edit.

    3. Scroll to the VPC Endpoints, and then choose Edit.

    4. In the Edit VPC Endpoint dialog box, for Streaming Endpoint, choose the

    endpoint you just created.

    5. Click Save Changes.

    Traffic for new streaming sessions will be routed through this endpoint. However, traffic

    for current streaming sessions continues to be routed through the previously specified

    endpoint.'
  checks:
  - type: manual_review
    info: 'Perform the steps to review the interface endpoint set for AppStream 2.0

      From the Console

      1. Log in to the AppStream 2.0 console at

      https://console.aws.amazon.com/appstream2

      2. In the left pane, click Stacks, click the link for the stack you wish to view.

