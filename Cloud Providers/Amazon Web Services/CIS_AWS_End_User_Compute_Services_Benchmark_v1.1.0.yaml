- id: '2.14'
  title: Ensure WorkSpaces that are not being utilized are removed.
  scoring: scored
  profile:
  - Level 1
  description: Identify and remove any WorkSpace instances available within your AWS account that are not being utilized.
  rationale: An AWS WorkSpaces instance is considered unused if has 0 (zero) known user connections registered within the
    past 30 days.
  impact: ''
  references:
  - 1. https://aws.amazon.com/workspaces/faqs/
  - 2. https://awscli.amazonaws.com/v2/documentation/api/latest/reference/workspace
  page_start: 52
  audit_raw: "Perform the following to ensure WorkSpaces not being utilized have been removed.\nFrom the Console:\n1. Log\
    \ in to the WorkSpaces dashboard at\nhttps://console.aws.amazon.com/workspaces/.\n2. In the left panel click WorkSpaces\n\
    3. Choose the WorkSpaces instance that you want to examine.\n4. Click on WorkSpace id link.\n-Verify the User Last Active\
    \ attribute value is less than 30 days old\n5. Repeat step 4 to verify the last user login, returned by the User Last\
    \ Active\nattribute value, for all WorkSpaces.\n6. Change the AWS region and repeat the audit process for other regions.\n\
    If the User Last Active was registered more than 30 days ago (e.g. Feb 16, 2017\n10:32:54 UTC), the selected WorkSpaces\
    \ instance is not in use anymore and can be\nsafely removed from your AWS account. Refer to the remediation procedure\
    \ below.\nFrom the Command line:\n1. Run the describe-workspaces command to list the IDs of all WorkSpaces\ninstances\
    \ available within the selected region:\naws workspaces describe-workspaces\n --region us-east-1\n --output table\n --query\
    \ 'Workspaces[*].WorkspaceId'\n2. The command should return a table with the requested WorkSpaces IDs:\n--------------------\n\
    |DescribeWorkspaces|\n+------------------+\n| ws-7cgsl2k65 |\n| ws-8d6il5kr3 |\n| ws-2dtyl1g47 |\n+------------------+\n\
    3. Run the describe-workspaces-connection-status command using the ID of the\nWorkSpaces instance in the table output\n\
    aws workspaces describe-workspaces-connection-status\n --region us-east-1\n --workspace-ids ws-7cgsl2k65\n --query\n'WorkspacesConnectionStatus[*].LastKnownUserConnectionTimestamp'\n\
    4. The command should return the timestamp of the User last active for the\nselected instance:\n[\n 1489139777.721\n]\n\
    5. Run the date command using the timestamp value returned at the previous step\nto convert it to a human readable date\
    \ value:\ndate -d @1489139777.721\n6. Verify the User Last Active attribute value is less than 30 days old\nFri Mar 10\
    \ 09:56:17 UTC 2017\nIf the User last active date returned is more than 30 days ago, the selected WorkSpaces\ninstance\
    \ is not utilized anymore and can be safely removed from your AWS account.\nRefer to the remediation procedure below to\
    \ remove the WorkSpaces.\n7. Repeat steps 3 – 6 to verify the User Last active date for the other WorkSpaces\ninstances\
    \ listed in the current region.\n8. Change the AWS region by updating the --region command parameter value and\nrepeat\
    \ steps no. 1 – 7 to perform the entire audit process for other regions.-"
  remediation: "Perform the following to remove unused WorkSpaces based on the output collected\nfrom the audit procedure\n\
    From the Console:\n1. Log in to WorkSpaces dashboard at\nhttps://console.aws.amazon.com/workspaces/.\n2. In the left panel\
    \ click WorkSpaces\n3. Select the WorkSpace ID that you have identified as not being used.\n4. Click Actions, Remove WorkSpaces\n\
    5. Confirm using the Audit that this is the WorkSpaces ID you should remove.\n6. Click Remove WorkSpaces\nFrom the Command\
    \ line:\nNote that running this command does not prompt you to confirm that you are\nremoving the correct WorkSpaces ID.\n\
    1. Run terminate-workspaces command using the ID of the WorkSpaces instance\nfrom the Audit that you want to delete:\n\
    aws workspaces terminate-workspaces\n --region us-east-1\n --terminate-workspace-requests ws-0cgsl1k23"
  checks:
  - type: manual_review
    info: 'Perform the following to ensure WorkSpaces not being utilized have been removed.

      From the Console:

      1. Log in to the WorkSpaces dashboard at

      https://console.aws.amazon.com/workspaces/.

      2. In the left panel click WorkSpaces

