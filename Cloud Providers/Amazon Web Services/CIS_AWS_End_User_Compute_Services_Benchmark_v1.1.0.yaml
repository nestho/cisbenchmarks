    WorkSpaces instances were launched using the approved bundle type.\n5. Change the AWS region from the navigation bar and\
    \ repeat step no. 4 for all\nother regions.\nIf the value listed in the Bundle column is not the same for all listed resources,\
    \ the\nWorkSpaces instances were not launched using the approved bundle type, refer to the\nremediation procedure below.\n\
    From the Command line:\n1. Run describe-workspaces command available within the selected region:\naws workspaces describe-workspaces\n\
    \ --region us-east-1\n --output table\n --query 'Workspaces[*].WorkspaceId'\n2 The command output should return a table\
    \ with the requested WorkSpaces IDs:\n--------------------\n|DescribeWorkspaces|\n+------------------+\n| ws-bbbdddeee\
    \ |\n| ws-aaabbbccc |\n| ws-ccceeefff |\n+------------------+\n3. Run describe-workspaces command again using the name\
    \ of the WorkSpaces\ninstance as identifier and custom query filters get the ID of the bundle used by\nthe selected instance:\n\
    aws workspaces describe-workspaces\n --region us-east-1\n --workspace-ids ws-bbbdddeee\n --query 'Workspaces[*].BundleId'\n\
    4. The command output should return the requested WorkSpaces bundle ID:\n[ \"wsb-ccc333fff\" ]\n5. Run describe-workspace-bundles\
    \ command to describe the type of the bundle\nutilized by the selected AWS WorkSpaces instance:\naws workspaces describe-workspace-bundles\n\
    \ --region us-east-1\n --bundle-ids wsb-ccc333fff\n --query 'Bundles[*].ComputeType.Name'\n6. The command output should\
    \ return the selected WorkSpaces bundle type:\n[\n \"PERFORMANCE\"\n]\n7. Repeat steps no. 3 – 6 to verify the bundle\
    \ type used by the rest of the AWS\nWorkSpaces instances created in the current region.\n8. If the value listed for the\
    \ Bundle is the same for all listed resources, the\nWorkSpaces instances were launched using the approved bundle type.\n\
    9. Repeat steps 1 – 8 to perform the entire audit process for all other AWS regions.\nIf the value listed in the Bundle\
    \ output is not the same for all listed resources, the\nWorkSpaces instances were not launched using the approved bundle\
    \ type, refer to the\nremediation procedure below."
