- id: '6.6'
  title: Ensure routing tables for VPC peering are "least access"
  scoring: manual
  profile:
  - Level 2
  description: Once a VPC peering connection is established, routing tables must be updated to enable any connections between
    the peered VPCs. These routes can be as specific as desired, even allowing for the peering of a VPC to only a single host
    on the other side of the connection.
  rationale: Being highly selective in peering routing tables is a very effective way to minimize the impact of a breach,
    as resources outside of these routes are inaccessible to the peered VPC.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/AmazonVPC/latest/PeeringGuide/peeringconfigurations-partial-access.html
