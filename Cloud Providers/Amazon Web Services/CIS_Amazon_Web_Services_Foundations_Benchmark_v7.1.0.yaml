- id: '6.8'
  title: Ensure VPC Endpoints are used for access to AWS Services
  scoring: manual
  profile:
  - Level 2
  description: Ensure that Amazon VPCs use VPC endpoints (gateway or interface endpoints) for access to AWS services such
    as Amazon S3 and DynamoDB, so that traffic from workloads to AWS services stays on the Amazon private network instead
    of traversing the public internet. VPC endpoints provide private connectivity between VPCs and supported AWS services
    without requiring an internet gateway, NAT gateway, or public IP addresses.
  rationale: Accessing AWS services over the public internet increases exposure to network-level threats, relies on internet
    routing, and makes it harder to tightly control egress paths. Using VPC endpoints allows workloads to reach AWS services
    over the Amazon private network, which reduces reliance on internet gateways and NAT gateways, simplifies egress filtering,
    and helps enforce data-perimeter and “private-only” patterns for sensitive workloads.
  impact: Enforcing the use of VPC endpoints may require changes to existing network architectures, including creating and
    managing endpoints in each VPC, updating route tables, adjusting security groups, and potentially removing or tightening
    some internet/NAT gateway paths. This can introduce additional operational overhead and cost (per-endpoint charges for
    interface endpoints) and may require updates to IaC templates and deployment pipelines. Page 320
  references:
  - 1. NIST SP 800-53:rev5:SC-7 c
  - '2. NIST CSF 2.0: PR.IR-01'
  page_start: 320
  audit_raw: "1. Identify in-scope VPCs and services.\n• Determine which VPCs host production or sensitive workloads that\
    \ should\naccess AWS services securely via endpoints.\n• For those VPCs, identify the AWS services they depend on (for\
    \ example, S3 for\ndata storage, DynamoDB for database, etc.).\n2. For each in-scope VPC, check for existing VPC endpoints.\n\
    aws ec2 describe-vpc-endpoints \\\n --region REGION \\\n --filters \"Name=vpc-id,Values=VPC_ID\" \\\n --query \"VpcEndpoints[*].[VpcEndpointId,VpcEndpointType,ServiceName,State]\"\
    \ \\\n --output table\n• Provide the REGION and VPC_ID\n• VpcEndpointType tells you whether the endpoint is Gateway or\
    \ Interface.\n• ServiceName shows which AWS service the endpoint is for (for example,\ncom.amazonaws.us-east-1.s3, com.amazonaws.us-east-1.dynamodb,\n\
    com.amazonaws.us-east-1.ssm).\n3. For each interface endpoint, verify subnet attachment across relevant\nAZs/subnets.\n\
    aws ec2 describe-vpc-endpoints \\\n --region REGION \\\n --vpc-endpoint-ids INTERFACE_ENDPOINT_ID \\\n --query \"VpcEndpoints[*].[VpcEndpointId,ServiceName,SubnetIds,State]\"\
    \ \\\n --output json\n• Provide the REGION and INTERFACE_ENDPOINT_ID\n4. For each gateway endpoint, verify that the route\
    \ tables for the relevant subnets\nsend traffic to the endpoint (via the AWS-managed prefix list), not via\ninternet/NAT\
    \ gateways.\n• Identify relevant subnets in the VPC that need to have a route to gateway\nendpoint:\naws ec2 describe-subnets\
    \ \\\n --region REGION \\\n --filters \"Name=vpc-id,Values=,VPC_ID\" \\\n --query \"Subnets[*].[SubnetId,AvailabilityZone,MapPublicIpOnLaunch,CidrBlock]\"\
    \ \\\n --output table\n• Provide the REGION and VPC_ID\n• For each relevant subnet, identify the route table associated\
    \ with it:\n Page 321\naws ec2 describe-route-tables \\\n --region REGION \\\n --filters \"Name=association.subnet-id,Values=SUBNET_ID\"\
    \ \\\n --query \"RouteTables[*].RouteTableId\" \\\n --output text\n• Provide the REGION and SUBNET_ID\n• For each route\
    \ table associated with relevant subnets, inspect routes:\naws ec2 describe-route-tables \\\n --region REGION \\\n --route-table-ids\
    \ ROUTE_TABLE_ID \\\n --query\n\"RouteTables[0].Routes[*].[DestinationPrefixListId,GatewayId,NatGatewayId,State]\" \\\n\
    \ --output table\n• Provide the REGION and ROUTE_TABLE_ID\nFor S3/DynamoDB gateway endpoints, you should see a DestinationPrefixListId\
    \ (for\nexample, pl-xxxxxxxx) with GatewayId equal to the endpoint (vpce-xxxx). If\nS3/DynamoDB are used by workloads\
    \ in those subnets but traffic is only routed via igwxxxx or nat-xxxx (and no prefix-list/endpoint route exists), then\
    \ VPC endpoints are not\nbeing used for securing network traffic for these services.\n Page 322"
  remediation: "In this example, we are going to add S3 gateway endpoint and SQS interface endpoint\nto a VPC. You can follow\
    \ similar remediation instructions for other services.\n1. Create S3 Gateway Endpoint\naws ec2 create-vpc-endpoint \\\n\
    \ --region REGION \\\n --route-table-ids ROUTE_TABLE_ID \\\n --vpc-id VPC_ID \\\n --service-name com.amazonaws.REGION.s3\
    \ \\\n --vpc-endpoint-type Gateway \\\n --query \"VpcEndpoint.VpcEndpointId\" \\\n --output text\n• Provide values for\
    \ REGION, ROUTE_TABLE_ID, VPC_ID\n• AWS automatically creates the routes for the AWS service in the route table\nprovided\
    \ as part of above command.\n2. Verify that the gateway routes have been adequately created\naws ec2 describe-route-tables\
    \ \\\n --region REGION --route-table-ids ROUTE_TABLE_ID \\\n --query \"RouteTables[0].Routes[?DestinationPrefixListId=='pl-xxxxxxxx']\"\
    \n• Provide values for REGION, ROUTE_TABLE_ID\n• pl-xxxxxxxx : replace with the specific prefix list for S3 in that region\n\
    3. Create an SQS Interface Endpoint\naws ec2 create-vpc-endpoint \\\n --vpc-id VPC_ID \\\n --service-name com.amazonaws.REGION.sqs\
    \ \\\n --vpc-endpoint-type Interface \\\n --subnet-ids PRIVATE_SUBNET_1_ID PRIVATE_SUBNET_2_ID \\\n --security-group-ids\
    \ SECURITY_GROUP_ID \\\n --vpc-endpoint-policy VPC_ENDPOINT_POLICY \\\n --query \"VpcEndpoint.VpcEndpointId\" \\\n --output\
    \ text\n• SECURITY_GROUP_ID: Update security groups for interface endpoint. Ensure\nthe interface endpoint security group\
    \ allows inbound traffic from your workloads.\n• VPC_ENDPOINT_POLICY: Create a restrictive Endpoint policy to ensure only\n\
    certain AWS services could be reached and only specific actions can be\nperformed.\n• AWS automatically creates Elastic\
    \ Network Interfaces (ENIs) for the interface\nendpoint which allows any traffic from <PRIVATE_SUBNET_1_ID>\n<PRIVATE_SUBNET_2_ID>\
    \ intended for SQS to be routed through the Interface\nGateway.\n4. Test and validate endpoint connectivity from an EC2\
    \ instance in a private subnet:\n Page 323\n• Test S3 (gateway endpoint)\naws s3 ls s3://your-test-bucket --region REGION\n\
    • Test SQS (interface endpoint)\naws sqs list-queues --region REGION"
  checks:
  - type: manual_review
    info: "1. Identify in-scope VPCs and services.\n• Determine which VPCs host production or sensitive workloads that should\n\
      access AWS services securely via endpoints.\n• For those VPCs, identify the AWS services they depend on (for example,\
      \ S3 for\ndata storage, DynamoDB for database, etc.).\n2. For each in-scope VPC, check for existing VPC endpoints.\n\
      aws ec2 describe-vpc-endpoints \\\n --region REGION \\\n --filters \"Name=vpc-id,Values=VPC_ID\" \\\n --query \"VpcEndpoints[*].[VpcEndpointId,VpcEndpointType,ServiceN"
    severity: medium
- id: 7.1.1
  title: Ensure least privilege IAM policies are used for generative AI model invocation
  scoring: manual
  profile:
  - Level 1
  description: IAM policies granting permission to invoke foundation models through AWS Bedrock (via InvokeModel, InvokeModelWithResponseStream,
    Converse or ConverseStream) should be scoped to specific model IDs or inference profile ARNs rather than using wildcard
    resource access to all available models.
  rationale: 'An IAM policy that grants Bedrock invocation actions against "Resource": "*" permits the holder of that credential
    to call any foundation model enabled in the account and region, not only the models a given workload was built and approved
    for. If that credential is compromised, the attacker''s reach is bounded by what the account has enabled overall, not
    by what the application actually needs. Constraining the resource element to explicit model ARNs keeps a compromised credential''s
    blast radius limited to the models that principal legitimately uses.'
  impact: Workloads that call multiple models interchangeably, or that onboard new models frequently, will need their IAM
    policies updated each time a new model is added. Build model onboarding as a step that includes a policy update rather
    than defaulting back to wildcard scope for convenience. Page 327
  references:
  - 1. https://docs.aws.amazon.com/serviceauthorization/latest/reference/list_amazonbedrock.html
  - 2. https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  page_start: 327
  audit_raw: 'Prerequisite: Please run this in each account and Region that operates Bedrock

    resources.

    Enumerate IAM roles in the account:

    aws iam list-roles --query ''Roles[].RoleName'' --output table

    For each role suspected of Bedrock invocation use, list and retrieve its attached

    policies:

    aws iam list-attached-role-policies --role-name <role-name> --output table

    aws iam get-policy-version --policy-arn <policy-arn> --version-id <version-id> --

    query ''PolicyVersion.Document'' --output json

    Review the returned Statement[].Resource values for any statement where

    Action includes bedrock:InvokeModel,

    bedrock:InvokeModelWithResponseStream, bedrock:Converse or

    bedrock:ConverseStream.

    The role passes when every such statement''s Resource is an explicit model or

    inference profile ARN. A statement with Resource: "*" on any of these actions fails.

    The environment passes for the account when every role used for Bedrock invocation

    passes this check.'
  remediation: "1. Identify which specific models or inference profiles each role requires.\n2. Edit the policy to replace\
    \ \"Resource\": \"*\" with the explicit model/inference profile\nARNs:\naws iam create-policy-version \\\n --policy-arn\
    \ <policy-arn> \\\n --policy-document file://scoped-policy.json \\\n --set-as-default\n3. Test the application against\
    \ the updated policy before deleting the prior version.\n4. Delete the prior wildcard version once confirmed:\naws iam\
    \ delete-policy-version --policy-arn <policy-arn> --version-id <old-versionid>"
  checks:
  - type: manual_review
    info: 'Prerequisite: Please run this in each account and Region that operates Bedrock

      resources.

      Enumerate IAM roles in the account:

      aws iam list-roles --query ''Roles[].RoleName'' --output table

      For each role suspected of Bedrock invocation use, list and retrieve its attached

      policies:

      aws iam list-attached-role-policies --role-name <role-name> --output table

      aws iam get-policy-version --policy-arn <policy-arn> --version-id <version-id> --

      query ''PolicyVersion.Document'' --output json

      Review the returned'
    severity: medium
- id: 7.1.2
  title: Ensure separation between generative AI model invocation and model management IAM roles
  scoring: manual
  profile:
  - Level 1
  description: IAM roles used by applications to invoke foundation models at runtime should be distinct from roles used to
    manage generative AI resources, including deploying custom models, fine-tuning or modifying guardrail and agent configurations.
  rationale: A role that carries both invocation and management permissions turns compromise of an application's runtime credentials
    into compromise of the environment itself. An attacker holding that combined role can disable guardrails, alter agent
    action groups, or deploy an unapproved custom model, not just misuse an existing model. Separating the two roles means
    a compromise of the lower-privilege invocation path does not, on its own, reach the higher-impact management actions.
  impact: Workloads currently using a single broad role for convenience will require two roles instead of one, adding IAM
    administrative overhead. CI/CD pipelines that both deploy and invoke models for testing will need separate credentials
    for each step rather than one shared role. Page 330
  references:
  - 1. https://docs.aws.amazon.com/serviceauthorization/latest/reference/list_amazonbedrock.html
  - 2. https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  page_start: 330
  audit_raw: 'Prerequisite: run this in each account and Region that operates Amazon Bedrock

    resources.

    Enumerate IAM roles used by Bedrock-related workloads:

    aws iam list-roles --query ''Roles[].RoleName'' --output table

    For each role, retrieve its attached policies and inspect the action set:

    aws iam list-attached-role-policies --role-name <role-name> --output table

    aws iam get-policy-version --policy-arn <policy-arn> --version-id <version-id> --

    query ''PolicyVersion.Document.Statement[].Action'' --output json

    Check the returned actions against the following two sets:

    • Invocation actions: bedrock:InvokeModel,

    bedrock:InvokeModelWithResponseStream, bedrock:Converse,

    bedrock:ConverseStream

    • Management actions: bedrock:CreateModelCustomizationJob,

    bedrock:CreateGuardrail, bedrock:UpdateGuardrail,

    bedrock:DeleteGuardrail, bedrock:CreateAgent,

    bedrock:UpdateAgent, bedrock:DeleteAgent

    A role fails if its combined action set includes actions from both lists. The environment

    passes for the account when every role in use contains actions from only one of the two

    sets.'
  remediation: '1. Create a role scoped only to invocation actions for application runtime use:

    aws iam create-role --role-name <invocation-role-name> --assume-role-policydocument file://trust-policy.json

    aws iam put-role-policy --role-name <invocation-role-name> --policy-name

    InvocationOnly --policy-document file://invocation-policy.json

    2. Create a separate role scoped only to management actions for administrative

    use.

    3. Update application configuration to assume the invocation-only role.

    4. Remove management actions from any role currently used for runtime

    invocation, or delete the combined policy and reattach the split versions.'
  checks:
  - type: manual_review
    info: 'Prerequisite: run this in each account and Region that operates Amazon Bedrock

      resources.

      Enumerate IAM roles used by Bedrock-related workloads:

      aws iam list-roles --query ''Roles[].RoleName'' --output table

      For each role, retrieve its attached policies and inspect the action set:

      aws iam list-attached-role-policies --role-name <role-name> --output table

      aws iam get-policy-version --policy-arn <policy-arn> --version-id <version-id> --

      query ''PolicyVersion.Document.Statement[].Action'' --output json'
    severity: medium
- id: 7.1.3
  title: Ensure Bedrock Agent execution roles are scoped to least privilege
  scoring: manual
  profile:
  - Level 1
  description: IAM roles assumed by Bedrock Agents during execution should be limited to only the specific actions and resources
    required by that agent's action groups, rather than broad or account-wide permissions.
  rationale: 'An agent''s execution role determines what it can actually do once invoked: which Lambda functions it can call,
    which data sources it can reach, which APIs it can act against. If that role is broader than the agent''s action groups
    require, a prompt injection or a reasoning failure that pushes the agent toward an unintended action is no longer contained
    at the IAM layer because the permission to carry it out already exists. Scoping the execution role to exactly what each
    action group needs turns an unintended action into a permission denial instead of a completed one.'
  impact: Agents under active development, whose action groups change frequently, will need corresponding IAM policy updates
    each time a capability is added. Treat execution role scope as part of the action group definition process, not a one-time
    setup step, or the role tends to drift broad as capabilities accumulate without policy review. Page 333
  references:
  - 1. https://docs.aws.amazon.com/serviceauthorization/latest/reference/list_amazonbedrock.html
  - 2. https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
  page_start: 333
  audit_raw: 'Prerequisite: run this in each account and Region that operates Amazon Bedrock

    Agents.

    Enumerate agents and retrieve each agent''s execution role and action groups:

    aws bedrock-agent list-agents --region <region> --query ''agentSummaries[].agentId''

    --output table

    aws bedrock-agent get-agent --region <region> --agent-id <agent-id> --query

    ''agent.agentResourceRoleArn'' --output text

    aws bedrock-agent list-agent-action-groups --region <region> --agent-id <agent-id>

    --agent-version <version> --output json

    For each action group returned, note the Lambda function ARN or API schema it

    invokes. Then retrieve the execution role''s policy:

    aws iam list-role-policies --role-name <execution-role-name> --output table

    aws iam get-role-policy --role-name <execution-role-name> --policy-name <policyname> --query ''PolicyDocument'' --output
    json

    Compare the role''s granted resources against the Lambda/API targets identified above.

    The role passes when its granted resources map one-to-one to what the agent''s action

    groups actually invoke. It fails if the role grants access to resources not referenced by

    any action group, or uses a wildcard resource on lambda:InvokeFunction or

    equivalent action-group-related permissions.'
  remediation: "1. Enumerate the specific Lambda functions, APIs, and data sources each action\ngroup calls.\n2. Rewrite the\
    \ execution role's policy to grant access only to those specific resource\nARNs:\naws iam put-role-policy \\\n --role-name\
    \ <execution-role-name> \\\n --policy-name ScopedActionGroupAccess \\\n --policy-document file://scoped-policy.json\n\
    3. Remove any broader or wildcard statements from the prior policy.\n4. Re-test each action group against the narrowed\
    \ role to confirm no required\nfunctionality broke."
  checks:
  - type: manual_review
