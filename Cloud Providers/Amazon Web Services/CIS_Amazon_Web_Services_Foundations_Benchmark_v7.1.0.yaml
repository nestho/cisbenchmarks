- id: '6.3'
  title: Ensure no security groups allow ingress from 0.0.0.0/0 to remote server administration ports
  scoring: scored
  profile:
  - Level 1
  description: Security groups provide stateful filtering of ingress and egress network traffic to AWS resources. It is recommended
    that no security group allows unrestricted ingress access to remote server administration ports, such as SSH on port 22
    and RDP on port 3389, using either the TCP (6), UDP (17), or ALL (-1) protocols.
  rationale: Public access to remote server administration ports, such as 22 (when used for SSH, not SFTP) and 3389, increases
    the attack surface of resources and unnecessarily raises the risk of resource compromise.
  impact: When updating an existing environment, ensure that administrators have access to remote server administration ports
    through another mechanism before removing access by deleting the 0.0.0.0/0 inbound rule. Page 302
  references:
  - 1. https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-securitygroups.html#deleting-security-group-rule
  - 2. NIST SP 800-53:rev5:SC-7 (11)
  page_start: 302
  audit_raw: "Perform the following to determine if the account is configured as prescribed:\n1. Login to the AWS VPC Console\
    \ at https://console.aws.amazon.com/vpc/home.\n2. In the left pane, click Security Groups.\n3. For each security group,\
    \ perform the following:\n• Select the security group.\n• Click the Inbound Rules tab.\n• Ensure that no rule exists which\
    \ has a port range including port 22 or\n3389, uses the protocols TCP (6), UDP (17), or ALL (-1), or other remote\nserver\
    \ administration ports for your environment, and has a Source of\n0.0.0.0/0.\nNote\nA port value of ALL or a port range\
    \ such as 0-3389 includes port 22, 3389, and\npotentially other remote server administration ports\nSecurity groups are\
    \ stateful and do not support explicit DENY rules. Therefore, an\n“effective ruleset” approach (e.g., allowing ANY/ANY\
    \ but denying specific ports) is not\napplicable. Any rule that allows 0.0.0.0/0 access to administrative ports is considered\n\
    non-compliant and must be removed or restricted\n Page 303"
  remediation: 'From Console:

    Perform the following to implement the prescribed state:

    1. Login to the AWS VPC Console at https://console.aws.amazon.com/vpc/home.

    2. In the left pane, click Security Groups.

    3. For each security group, perform the following:

    • Select the security group.

    • Click the Inbound Rules tab.

    • Click the Edit inbound rules button.

    4. Identify the rules to be edited or removed.

    5. Either: A) update the Source field to a range other than 0.0.0.0/0, or B) click

    Delete to remove the offending inbound rule.

    • Click Save rules.

    From Command Line:

    1. Check all security groups for insecure inbound rules allowing traffic from

    0.0.0.0/0:

    aws ec2 describe-security-group-rules --query ''SecurityGroupRules[?CidrIpv4 ==

    "0.0.0.0/0" && IsEgress == `false`]'' --output json

    2. Delete the insecure rule(s) based on their rule ID:

    aws ec2 delete-security-group-rules --group-id <security_group_id> --securitygroup-rule-ids <rule_id_to_delete>

    3. Recreate necessary security group rules:

    aws ec2 authorize-security-group-ingress --group-id <security_group_id> --protocol

    <tcp、udp、icmp or all> --port <port> --cidr <souce_cidr>'
  checks:
