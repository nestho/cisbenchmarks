    aws cloudtrail get-trail --region <region-name> --name <trail-name> \\ --query\n'Trail.IsMultiRegionTrail'\n4. Run the\
    \ get-event-selectors command using the name of a trail returned at\nthe previous step and custom query filters to determine\
    \ if data event logging is\nconfigured:\naws cloudtrail get-event-selectors --region <region-name> --trail-name <trail-name>\n\
    --query EventSelectors[*].DataResources[]\n Page 204\n5. The command output should be an array that includes the S3 bucket\
