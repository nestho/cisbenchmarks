- id: '4.5'
  title: Ensure CloudTrail logs are encrypted at rest using KMS CMKs
  scoring: scored
  profile:
  - Level 2
  description: AWS CloudTrail is a web service that records AWS API calls for an account and makes those logs available to
    users and resources in accordance with IAM policies. AWS Key Management Service (KMS) is a managed service that helps
    create and control the encryption keys used to encrypt account data, and uses Hardware Security Modules (HSMs) to protect
    the security of encryption keys. CloudTrail logs can be configured to leverage server side encryption (SSE) and KMS customer-created
    master keys (CMK) to further protect CloudTrail logs. It is recommended that CloudTrail be configured to use SSE-KMS.
  rationale: Configuring CloudTrail to use SSE-KMS provides additional confidentiality controls on log data, as a given user
    must have S3 read permission on the corresponding log bucket and must be granted decrypt permission by the CMK policy.
  impact: Customer-created keys incur an additional cost. See https://aws.amazon.com/kms/pricing/ for more information. Page
    184
  references:
  - 1. https://docs.aws.amazon.com/awscloudtrail/latest/userguide/encryptingcloudtrail-log-files-with-aws-kms.html
  - 2. https://docs.aws.amazon.com/kms/latest/developerguide/create-keys.html
  page_start: 184
  audit_raw: "Perform the following to determine if CloudTrail is configured to use SSE-KMS:\nFrom Console:\n1. Sign in to\
    \ the AWS Management Console and open the CloudTrail console at\nhttps://console.aws.amazon.com/cloudtrail.\n2. In the\
    \ left navigation pane, choose Trails.\n3. Select a trail.\n4. In the General details section, select Edit to edit the\
    \ trail configuration.\n5. Ensure the box at Log file SSE-KMS encryption is checked and that a\nvalid AWS KMS alias of\
    \ a KMS key is entered in the respective text box.\nFrom Command Line:\n1. Run the following command:\n aws cloudtrail\
    \ describe-trails\n2. For each trail listed, SSE-KMS is enabled if the trail has a KmsKeyId property\ndefined.\n Page\
    \ 185"
  remediation: 'Perform the following to configure CloudTrail to use SSE-KMS:

    From Console:

    1. Sign in to the AWS Management Console and open the CloudTrail console at

    https://console.aws.amazon.com/cloudtrail.

    2. In the left navigation pane, choose Trails.

    3. Click on a trail.

    4. Under the S3 section, click the edit button (pencil icon).

    5. Click Advanced.

    6. Select an existing CMK from the KMS key Id drop-down menu.

    • Note: Ensure the CMK is located in the same region as the S3 bucket.

    • Note: You will need to apply a KMS key policy on the selected CMK in order for

    CloudTrail, as a service, to encrypt and decrypt log files using the CMK provided.

    View the AWS documentation for editing the selected CMK Key policy.

    7. Click Save.

    8. You will see a notification message stating that you need to have decryption

    permissions on the specified KMS key to decrypt log files.

    9. Click Yes.

    From Command Line:

    Run the following command to specify a KMS key ID to use with a trail:

    aws cloudtrail update-trail --name <trail-name> --kms-key-id <cloudtrail-kms-key>

    Run the following command to attach a key policy to a specified KMS key:

    aws kms put-key-policy --key-id <cloudtrail-kms-key> --policy <cloudtrail-kms-keypolicy>'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if CloudTrail is configured to use SSE-KMS:

      From Console:

      1. Sign in to the AWS Management Console and open the CloudTrail console at

      https://console.aws.amazon.com/cloudtrail.

      2. In the left navigation pane, choose Trails.

      3. Select a trail.

      4. In the General details section, select Edit to edit the trail configuration.

      5. Ensure the box at Log file SSE-KMS encryption is checked and that a

      valid AWS KMS alias of a KMS key is entered in the respective text box.'
    severity: medium
- id: '4.6'
  title: Ensure rotation for customer-created symmetric CMKs is enabled
  scoring: scored
  profile:
  - Level 2
  description: AWS Key Management Service (KMS) allows customers to rotate the backing key, which is key material stored within
    the KMS that is tied to the key ID of the customercreated customer master key (CMK). The backing key is used to perform
    cryptographic operations such as encryption and decryption. Automated key rotation currently retains all prior backing
    keys so that decryption of encrypted data can occur transparently. It is recommended that CMK key rotation be enabled
    for symmetric keys. Key rotation cannot be enabled for any asymmetric CMK.
  rationale: Rotating encryption keys helps reduce the potential impact of a compromised key, as data encrypted with a new
    key cannot be accessed with a previous key that may have been exposed. Keys should be rotated every year or upon an event
    that could result in the compromise of that key.
  impact: Creation, management, and storage of CMKs may require additional time from an administrator. Page 190
  references:
  - 1. https://aws.amazon.com/kms/pricing/
  - 2. https://csrc.nist.gov/publications/detail/sp/800-57-part-1/rev-5/final
  page_start: 190
  audit_raw: "From Console:\n1. Sign in to the AWS Management Console and open the KMS console at:\nhttps://console.aws.amazon.com/kms.\n\
    2. In the left navigation pane, click Customer-managed keys.\n3. Select a customer-managed CMK where Key spec = SYMMETRIC_DEFAULT.\n\
    4. Select the Key rotation tab.\n5. Ensure the Automatically rotate this KMS key every year box is\nchecked.\n6. Repeat\
    \ steps 3–5 for all customer-managed CMKs where Key spec =\nSYMMETRIC_DEFAULT.\nFrom Command Line:\n1. Run the following\
    \ command to get a list of all keys and their associated KeyIds:\n aws kms list-keys\n2. For each key, note the KeyId\
    \ and run the following command:\naws kms describe-key --key-id <key-id>\n3. If the response contains \"KeySpec = SYMMETRIC_DEFAULT\"\
    , run the\nfollowing command:\n aws kms get-key-rotation-status --key-id <kms-key-id>\n4. Ensure KeyRotationEnabled is\
    \ set to true.\n5. Repeat steps 2–4 for all remaining CMKs.\n6. Alternatively, the following command can be used to check\
    \ all keys more\ncomprehensively:\nKEY_IDS=$(aws kms list-keys --query \"Keys[].KeyId\" --output text)\nfor KEY_ID in\
    \ $KEY_IDS; do\n aws kms get-key-rotation-status --key-id \"$KEY_ID\" --query\n\"{KeyId:KeyId,RotationEnabled:KeyRotationEnabled}\"\
    \ --output table\ndone"
  remediation: "From Console:\n1. Sign in to the AWS Management Console and open the KMS console at:\nhttps://console.aws.amazon.com/kms.\n\
    2. In the left navigation pane, click Customer-managed keys.\n Page 191\n3. Select a key with Key spec = SYMMETRIC_DEFAULT\
    \ that does not have\nautomatic rotation enabled.\n4. Select the Key rotation tab.\n5. Check the Automatically rotate\
    \ this KMS key every year box.\n6. Click Save.\n7. Repeat steps 3–6 for all customer-managed CMKs that do not have automatic\n\
    rotation enabled.\nFrom Command Line:\n1. Run the following command to enable key rotation:\n aws kms enable-key-rotation\
    \ --key-id <kms-key-id>"
  checks:
  - type: manual_review
    info: 'From Console:

      1. Sign in to the AWS Management Console and open the KMS console at:

      https://console.aws.amazon.com/kms.

      2. In the left navigation pane, click Customer-managed keys.

      3. Select a customer-managed CMK where Key spec = SYMMETRIC_DEFAULT.

      4. Select the Key rotation tab.

      5. Ensure the Automatically rotate this KMS key every year box is

      checked.

      6. Repeat steps 3–5 for all customer-managed CMKs where Key spec =

      SYMMETRIC_DEFAULT.

