- id: 7.1.4
  title: Ensure service control policies restrict generative AI model invocation to an approved model list
  scoring: manual
  profile:
  - Level 2
  description: Service control policies (SCPs) should be applied at the AWS Organizations level to deny invocation of foundation
    models not on an explicitly approved list, including calls made through the Converse/ConverseStream API. This provides
    enforcement independent of individual IAM role policies, so an unapproved model cannot be invoked even if application
    code specifies a different model ID directly.
  rationale: IAM policy scoping only holds if every role stays correctly configured. Since the Converse API lets a developer
    switch which model gets called just by changing a string in code, a role-level policy offers no protection against that
    kind of drift. An SCP enforces the approved-model boundary at the organization level, so even a misconfigured or newly
    created role cannot invoke a model outside the approved list.
  impact: Teams evaluating or adopting new models will need the approved list and the SCP updated before that model can be
    used anywhere in the affected accounts, adding a governance step ahead of model onboarding. An approved list that lags
    behind legitimate need can push teams toward requesting broad exceptions, which weakens the control if exceptions aren't
    managed deliberately. Page 336
  references:
  - 1. https://docs.aws.amazon.com/serviceauthorization/latest/reference/list_amazonbedrock.html
  - 2. https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_polici
  page_start: 336
  audit_raw: 'Prerequisite: run this at the AWS Organizations management account level.

    Enumerate service control policies and their targets:

    aws organizations list-policies --filter SERVICE_CONTROL_POLICY --query

    ''Policies[].{Id:Id,Name:Name}'' --output table

    aws organizations describe-policy --policy-id <policy-id> --query ''Policy.Content''

    --output text

    aws organizations list-targets-for-policy --policy-id <policy-id> --output table

    Review the returned policy document for a Deny statement on

    bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream,

    bedrock:Converse and bedrock:ConverseStream, with a condition (e.g.,

    StringNotLike on the resource ARN) restricting to an approved model list.

    Cross-reference the target list against the full account list for the organization:

    aws organizations list-accounts --query ''Accounts[].Id'' --output table

    The environment passes when the SCP exists, includes the deny condition against all

    four actions, and is attached to every organizational unit or account operating Bedrock.

    It fails if no such SCP exists or if any in-scope account is not covered by an attached

    target.'
  remediation: '1. Define the organization''s approved foundation model list by ARN or ARN pattern.

    2. Author an SCP JSON document with a Deny statement on the four Bedrock

    invocation actions, conditioned on the resource ARN not matching the approved

    list.

    3. Create the policy and attach it to the relevant organizational unit(s):

    aws organizations create-policy --name <policy-name> --type SERVICE_CONTROL_POLICY

    --content file://scp-approved-models.json

    aws organizations attach-policy --policy-id <policy-id> --target-id <ou-or-accountid>

    Test that invocation of an approved model succeeds and invocation of a non-approved

    model returns an AccessDeniedException.'
  checks:
  - type: manual_review
    info: 'Prerequisite: run this at the AWS Organizations management account level.

      Enumerate service control policies and their targets:

      aws organizations list-policies --filter SERVICE_CONTROL_POLICY --query

      ''Policies[].{Id:Id,Name:Name}'' --output table

      aws organizations describe-policy --policy-id <policy-id> --query ''Policy.Content''

      --output text

      aws organizations list-targets-for-policy --policy-id <policy-id> --output table

      Review the returned policy document for a Deny statement on

      bedrock:InvokeMo'
    severity: medium
- id: 7.1.5
  title: Ensure Bedrock service-role trust policies carry aws:SourceAccount and aws:SourceArn conditions
  scoring: scored
  profile:
  - Level 2
  description: 'Ensure that every customer-managed IAM service role whose trust policy allows a Bedrock service principal
    carries a condition block on each sts:AssumeRole statement that pins aws:SourceAccount to the customer''s account ID and
    aws:SourceArn to Bedrock resource ARNs in that account. Two service principals are in scope: bedrock.amazonaws.com (classic
    Amazon Bedrock — Agents, Flows, Knowledge Bases, model customization jobs, model import jobs, batch inference jobs, and
    model/RAG evaluation jobs) and bedrock-agentcore.amazonaws.com (Amazon Bedrock AgentCore — Runtime, Runtime Endpoint,
    Browser, Code Interpreter, Memory, Gateway, Evaluator, and Workload Identity). AWS service-linked roles, which carry the
    path prefix /aws-service-role/, are managed by AWS and are out of scope.'
  rationale: 'A trust policy that names a Bedrock service principal without aws:SourceAccount and aws:SourceArn conditions
    permits the service to assume the role on behalf of any AWS account''s Bedrock resource — the textbook cross-service confused
    deputy pattern. An attacker in another AWS account who learns the role ARN could induce Bedrock to use the victim''s role
    to perform Bedrock or AgentCore operations, exercising whatever permissions the role''s identity policy grants: reading
    indexed data, invoking foundation models against the victim''s account, writing to the victim''s vector stores, or invoking
    the victim''s Lambda functions through agent action groups. Pinning aws:SourceAccount to the customer''s own account ID
    and aws:SourceArn to a Bedrock ARN within that account enforces the authorization boundary, so the role is assumable only
    for legitimate resources the customer owns. AWS currently blocks cross-account role passing at the service layer on several
    Bedrock control-plane APIs — for example CreateModelInvocationJob, CreateModelCustomizationJob, CreateModelImportJob,
    and CreateAgentRuntime reject a passed role ARN in another account — but these service-side guards are AWS-controlled
    and may change without notice. The trust-policy conditions are the customer-controlled, authoritative defense and remain
    required as defense in depth. Page 339'
  impact: Adding aws:SourceAccount and aws:SourceArn conditions to an existing Bedrock service-role trust policy has no effect
    on same-account Bedrock resources already using the role legitimately, because the customer's own resources always match
    the conditions. It does break any workflow that intentionally shares a Bedrock service role across AWS accounts; teams
    relying on such a pattern must move to per-account service roles or replace the shared role with a resource-based policy
    on the Bedrock resource itself, such as a knowledge base resource policy. Page 340
  references:
  - 1. NIST SP 800-53:rev5:AC-3 (13)
  - '2. NIST CSF 2.0: PR.AA-05'
  page_start: 339
  audit_raw: "Pre-requisite: run these commands with credentials that hold iam:ListRoles and\niam:GetRole in the account being\
    \ audited.\n1. Enumerate every customer-managed role in the account, excluding AWS\nservice-linked roles:\naws iam list-roles\
    \ --query \"Roles[?!starts_with(Path, '/aws-servicerole/')].[RoleName,Arn]\" --output table\n2. For each role, retrieve\
    \ its trust policy and determine whether it is in scope:\naws iam get-role --role-name <role-name> --query 'Role.AssumeRolePolicyDocument'\
    \ --\noutput json\nA role is in scope if any statement has Effect Allow, an Action that includes\nsts:AssumeRole, and\
    \ a Principal.Service naming bedrock.amazonaws.com or bedrockagentcore.amazonaws.com. A role whose trust policy references\
    \ neither principal is out\nof scope and can be skipped.\n3. For every in-scope role, confirm that each statement allowing\
    \ a Bedrock service\nprincipal contains a condition block with both keys:\n• aws:SourceAccount — set to the account ID\
    \ that owns the role.\n• aws:SourceArn — set to an ARN whose service is bedrock or bedrock-agentcore\nand whose account\
    \ portion is the account that owns the role.\nA statement that names a Bedrock service principal but omits either key\
    \ fails.\n4. For every statement that has both keys, confirm the aws:SourceArn value is\npinned to a concrete resource\
    \ type in the role's owning account, and wherever\npossible to a specific resource ID:\n• arn:aws:bedrock:<region>:<account-id>:<resource-type>/<id-or-wildcard>,\
    \ where\nresource-type is one of agent, flow, knowledge-base, model-customization-job,\nmodel-import-job, model-invocation-job,\
    \ or evaluation-job.\nA value of * , arn:aws:bedrock:::, arn:aws:bedrock-agentcore:::, or any pattern that does\nnot restrict\
    \ the account portion to the role's owning account fails. A resource-type\nwildcard such as agent/* or runtime/* is acceptable\
    \ transitionally but should be replaced\nwith the specific resource ID after the resource is created.\nThe environment\
    \ passes this recommendation when, for every customer-managed role\nthat trusts a Bedrock service principal, the corresponding\
    \ sts:AssumeRole statement\ncarries both conditions, aws:SourceAccount is the role's owning account, and\naws:SourceArn\
    \ is a Bedrock ARN in that account pinned to a concrete resource type.\n Page 341"
  remediation: "1. For the role that needs remediation, author a trust policy that pins the service\nprincipal to your account\
    \ and the applicable resource-type ARN. For a classic\nBedrock role, save this as bedrock-trust-policy.json, substituting\
    \ your account ID,\nregion, and resource type:\n{\n \"Version\": \"2012-10-17\",\n \"Statement\": [\n {\n \"Sid\": \"\
    BedrockConfusedDeputyGuard\",\n \"Effect\": \"Allow\",\n \"Principal\": { \"Service\": \"bedrock.amazonaws.com\" },\n\
    \ \"Action\": \"sts:AssumeRole\",\n \"Condition\": {\n \"StringEquals\": { \"aws:SourceAccount\": \"<account-id>\" },\n\
    \ \"ArnLike\": { \"aws:SourceArn\": \"arn:aws:bedrock:<region>:<accountid>:<resource-type>/*\" }\n }\n }\n ]\n}\nThe two\
    \ condition operators differ by design: aws:SourceAccount is a fixed account ID\nmatched with StringEquals, while aws:SourceArn\
    \ uses ArnLike so a resource-type\nwildcard can be pinned to a specific resource ID later.\n2. Apply the trust policy\
    \ to the role:\naws iam update-assume-role-policy --role-name <role-name> --policy-document\nfile://bedrock-trust-policy.json\n\
    3. After the underlying Bedrock resource is created, tighten aws:SourceArn from the\nresource-type wildcard (for example\
    \ agent/* or runtime/*) to the specific resource\nID (for example agent/ABCD1234EF or runtime/cis-test-cm4FYnE6vx), then\
    \ reapply as in step 3."
  checks:
  - type: manual_review
    info: 'Pre-requisite: run these commands with credentials that hold iam:ListRoles and

      iam:GetRole in the account being audited.

      1. Enumerate every customer-managed role in the account, excluding AWS

      service-linked roles:

      aws iam list-roles --query "Roles[?!starts_with(Path, ''/aws-servicerole/'')].[RoleName,Arn]" --output table

      2. For each role, retrieve its trust policy and determine whether it is in scope:

      aws iam get-role --role-name <role-name> --query ''Role.AssumeRolePolicyDocument'' --

      output json

      A'
    severity: medium
- id: 7.1.6
  title: Ensure Amazon Bedrock long-term API keys are rotated every 90 days or less
  scoring: scored
  profile:
  - Level 1
  description: Ensure that every active Amazon Bedrock long-term API key in the account has an expiration date set and has
    been in service for no more than 90 days. Amazon Bedrock long-term API keys are static bearer credentials issued as IAM
    service-specific credentials for the bedrock.amazonaws.com service and tied to a persistent IAM user. They are distinct
    from Amazon Bedrock short-term API keys, which are minted clientside from an existing AWS session and expire automatically
    within 12 hours. Long-term keys can be issued with any expiration — including none at all — and remain valid until manually
    deactivated or deleted, so their operational lifetime must be bounded and rotated on the same cadence used for standard
    IAM access keys.
  rationale: 'A long-term Amazon Bedrock API key is a static bearer token that grants the Amazon Bedrock permissions of its
    backing IAM user to anyone who holds it, for as long as the key stays active. Because the bearer-token protocol requires
    no request signing, no timestamp validation, and no AWS SDK integration, a leaked key can be replayed by any HTTP client
    from any network, including environments outside the intended usage boundary. Long-lived tokens compound this exposure:
    a compromise that goes undetected persists indefinitely. Rotating every 90 days or less bounds the exposure window of
    a leaked or forgotten key and forces periodic review of whether the key is still required, and requiring an expiration
    date at creation adds a defense-in-depth cutoff that eventually invalidates the key even if a scheduled rotation is missed.'
  impact: Rotating a long-term Amazon Bedrock API key requires distributing the new value to every workload that consumes
    the old key and confirming those workloads have picked it up before the old key is deactivated — coordination that can
    span teams, services, or systems outside AWS that hold the key. Requiring an expiration at creation forces operators to
    plan for scheduled rollover rather than rely on indefinite validity, which may surface hidden dependencies on the credential.
    For most production workloads, avoid long-term API keys when possible. Amazon Bedrock short-term API keys refresh automatically
    through the AWS token generator SDK and expire within 12 hours. Standard IAM role sessions are another option. Both approaches
    reduce or eliminate the operational burden of manually rotating long-term keys. AWS generally positions long-term keys
    as a convenience for exploration rather than a preferred production authentication method. Page 344
  references:
  - 1. NIST SP 800-53:rev5:IA-5 f
  - '2. NIST CSF 2.0: PR.AA-01'
  page_start: 344
  audit_raw: "Pre-requisite: run this in each AWS account where Amazon Bedrock long-term API keys\nmay exist. IAM is global,\
    \ so no region need be specified.\n1. Enumerate every long-term Amazon Bedrock API key in the account. The allusers flag\
    \ lists credentials across every IAM user in a single call:\naws iam list-service-specific-credentials --all-users --service-name\n\
    bedrock.amazonaws.com\nThe response contains a ServiceSpecificCredentials array. If the array is empty, the\naccount has\
    \ no long-term Amazon Bedrock API keys and passes.\n2. For each entry, review three fields as returned in the JSON:\n\
    • Status — only Active credentials are in scope. An Inactive credential cannot\nauthenticate and can be ignored for rotation,\
    \ though it should still be deleted\nwhen no longer needed.\n• CreateDate — when the credential was issued. Its age is\
    \ today minus this date.\n• ExpirationDate — when the credential expires. This field is present only if the\ncredential\
    \ was created with an age limit (the credential-age-days option); if it is\nabsent, the credential never expires on its\
    \ own.\nThe environment passes this recommendation when every Active long-term Amazon\nBedrock API key both carries an\
    \ ExpirationDate and has a CreateDate no older than 90\ndays. Any Active credential missing an ExpirationDate, or older\
    \ than 90 days, fails this\nrecommendation.\n Page 345"
  remediation: 'Remediate a failing key by rotation (if the workload still needs it) or deletion (if it does

    not).

    1. Identify the failing credential from the audit output and record its UserName and

    ServiceSpecificCredentialId.

    2. If the workload no longer requires the key, deactivate it, confirm nothing breaks,

    then delete it. Deactivation is reversible; deletion is not, so observe for a suitable

    window before deleting:

    aws iam update-service-specific-credential --user-name <user-name> --servicespecific-credential-id <credential-id> --status
    Inactive

    aws iam delete-service-specific-credential --user-name <user-name> --servicespecific-credential-id <credential-id>

    3. If the workload still requires the key, rotate it. Create a replacement for the same

    IAM user with an expiration of 90 days or less:

    aws iam create-service-specific-credential --user-name <user-name> --service-name

    bedrock.amazonaws.com --credential-age-days 90

    The response returns a new ServiceApiKeyValue. Distribute it to the workload, confirm

    the workload has picked it up, then deactivate and delete the old credential as in step 2.'
  checks:
  - type: manual_review
    info: 'Pre-requisite: run this in each AWS account where Amazon Bedrock long-term API keys

      may exist. IAM is global, so no region need be specified.

      1. Enumerate every long-term Amazon Bedrock API key in the account. The allusers flag lists credentials across every
      IAM user in a single call:

      aws iam list-service-specific-credentials --all-users --service-name

      bedrock.amazonaws.com

      The response contains a ServiceSpecificCredentials array. If the array is empty, the

      account has no long-term Amazon Bedroc'
    severity: medium
- id: 7.2.1
  title: Ensure a guardrail is associated with every generative AI invocation point
  scoring: manual
  profile:
  - Level 1
  description: Amazon Bedrock applies no content filtering unless a guardrail is explicitly created and associated with the
    invocation path. This recommendation requires that every agent, knowledge base, prompt flow, and direct model invocation
    (InvokeModel, InvokeModelWithResponseStream, Converse, ConverseStream) carry an explicit guardrail association, rather
    than defaulting to unfiltered access at any of these surfaces.
  rationale: Guardrail association is configured per integration point, not inherited account-wide. An agent, knowledge base,
    or flow created without one processes and returns content with no protection against harmful output, injected instructions
    surfacing in a response, or sensitive data exposure. Because each new agent, knowledge base, or flow requires its own
    explicit association, coverage gaps commonly appear at the point a new integration is added, not at the original build.
  impact: Enabling guardrails on a previously unfiltered path may retroactively block requests that were passing through unfiltered,
    which can surface as unexpected denials until filter strengths are tuned for the workload. Page 348
  references:
  - 1. https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use.html
  - 2. https://docs.aws.amazon.com/serviceauthorization/latest/reference/list_amazonbedrock.html
  page_start: 348
  audit_raw: 'Pre-requisite: run this in each account and Region that operates Amazon Bedrock

    resources.

    Enumerate agents and check each for a guardrail association:

    aws bedrock-agent list-agents --region <region> --query ''agentSummaries[].agentId''

    --output table

    aws bedrock-agent get-agent --region <region> --agent-id <agent-id> --query

    ''agent.guardrailConfiguration'' --output json

    A null or empty result for guardrailConfiguration fails.

    Enumerate flows and inspect each node for guardrail association:

    aws bedrock-agent list-flows --region <region> --query ''flowSummaries[].id'' --

    output table

    aws bedrock-agent get-flow --region <region> --flow-identifier <flow-id> --output

    json

    Review the returned definition.nodes for prompt or knowledge-base nodes lacking

    a guardrailConfiguration block.

    For direct invocation, review application source or request logs to confirm

    guardrailIdentifier and guardrailVersion are set on every

    InvokeModel/Converse call. This step cannot be verified via AWS CLI alone since it

    depends on caller-side code.

    The environment passes for the Region when every agent, flow, and known invocation

    path returns a populated guardrail configuration.'
  remediation: "For an agent:\naws bedrock-agent update-agent \\\n --region <region> \\\n --agent-id <agent-id> \\\n --guardrail-configuration\
    \ '{\"guardrailIdentifier\":\"<guardrailid>\",\"guardrailVersion\":\"<version>\"}'\nFor a flow node, update the node's\
    \ guardrailConfiguration block in the flow\ndefinition and redeploy the flow version.\nFor direct invocation, update application\
    \ code to pass guardrailIdentifier and\nguardrailVersion as parameters on every InvokeModel/Converse call, and confirm\n\
    by re-sending a known-blocked test input.\n Page 349"
  checks:
  - type: manual_review
    info: 'Pre-requisite: run this in each account and Region that operates Amazon Bedrock

      resources.

      Enumerate agents and check each for a guardrail association:

      aws bedrock-agent list-agents --region <region> --query ''agentSummaries[].agentId''

      --output table

      aws bedrock-agent get-agent --region <region> --agent-id <agent-id> --query

      ''agent.guardrailConfiguration'' --output json

      A null or empty result for guardrailConfiguration fails.

      Enumerate flows and inspect each node for guardrail association:

      aws bed'
    severity: medium
- id: 7.2.2
  title: Ensure generative AI environments are monitored for invocation points operating without a guardrail
  scoring: manual
  profile:
  - Level 1
  description: Guardrail association can drift out of compliance after initial setup as new agents, flows, and knowledge bases
    are created, or as existing guardrail associations are removed during troubleshooting and not restored. This recommendation
    requires a recurring or continuous check that detects any agent, flow, knowledge base, or direct invocation path currently
    operating without an associated guardrail, rather than relying on a onetime audit at build time.
  rationale: 'Recommendation 7.2.1 establishes the baseline that every invocation point must carry a guardrail. That baseline
    decays without ongoing detection: guardrails get removed for debugging and not reattached, new agents get built by teams
    unaware of the requirement, or a guardrail gets deleted while still referenced. Without a recurring check, the environment
    can silently regress to unfiltered access at any of these points and go undetected until an incident surfaces it.'
  impact: Running this check on a schedule against every Region and account with Bedrock enabled adds a small operational
    task to existing compliance monitoring, and requires a defined owner and remediation SLA when a gap is found, or the finding
    accumulates without action. Page 351
  references:
  - 1. https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use.html
  - 2. https://docs.aws.amazon.com/serviceauthorization/latest/reference/list_amazonbedrock.html
  page_start: 351
  audit_raw: 'Pre-requisite: run this on a recurring schedule (recommended: daily) in each account

    and Region that operates Amazon Bedrock resources.

    Run the enumeration and check steps from 7.2.1 as a scheduled job rather than a

    manual one-time review, for example via AWS Config custom rule, a scheduled

    Lambda, or equivalent:

    aws bedrock-agent list-agents --region <region> --query ''agentSummaries[].agentId''

    --output json

    aws bedrock-agent list-flows --region <region> --query ''flowSummaries[].id'' --

    output json

    For each returned resource, retrieve its configuration and confirm

    guardrailConfiguration is populated, as in 7.2.1. Output should be delivered to a

    findings destination (Security Hub, SNS, ticketing system) rather than requiring manual

    review of raw CLI output.

    The environment passes when a monitoring job exists, runs on a defined schedule, and

    its most recent execution reports zero non-compliant resources, or all findings from the

    most recent run have been remediated.'
  remediation: '1. Implement a scheduled job (EventBridge-triggered Lambda, AWS Config custom

    rule, or third-party CSPM) that runs the 7.2.1 enumeration on a defined interval.

    2. Route findings to a monitored destination and assign an owner for triage.

    3. For any resource found without a guardrail, apply the remediation from 7.2.1 and

    confirm on the next scheduled run.'
  checks:
  - type: manual_review
    info: 'Pre-requisite: run this on a recurring schedule (recommended: daily) in each account

      and Region that operates Amazon Bedrock resources.

      Run the enumeration and check steps from 7.2.1 as a scheduled job rather than a

      manual one-time review, for example via AWS Config custom rule, a scheduled

      Lambda, or equivalent:

      aws bedrock-agent list-agents --region <region> --query ''agentSummaries[].agentId''

      --output json

      aws bedrock-agent list-flows --region <region> --query ''flowSummaries[].id'' --

      output js'
    severity: medium
- id: 7.2.3
  title: Ensure guardrail evaluation occurs independently of agent reasoning for agentic workloads
  scoring: manual
  profile:
  - Level 2
  description: For agentic generative AI workloads, guardrail evaluation should occur at a layer outside the agent's own reasoning
    process, such as a gateway or orchestration layer, so that content safety checks cannot be bypassed or reasoned around
    by the agent itself.
  rationale: A guardrail invoked as a step inside the agent's own reasoning loop depends on the agent choosing to call it.
    An agent manipulated through prompt injection, or one that reasons its way around an instruction to check content first,
    can skip that step entirely, since the check is not structurally separate from the thing being checked. Moving evaluation
    to a gateway layer the agent cannot see or influence means the check runs regardless of what the agent decides, closing
    that bypass path.
  impact: This requires an architecture where agent actions route through a gateway or orchestration layer rather than executing
    directly, which is a more significant infrastructure change than attaching a guardrail configuration value. Workloads
    not already built on such a layer may need architectural changes, not just a configuration update, to meet this control.
  references:
  - 1. https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use.html
  - 2. https://docs.aws.amazon.com/serviceauthorization/latest/reference/list_amazonbedrock.html
  page_start: 354
  audit_raw: "Pre-requisite: applicable primarily to agentic workloads using AgentCore or an\nequivalent gateway/orchestration\
    \ layer.\nReview the agent's architecture to identify where guardrail evaluation is invoked:\naws bedrock-agentcore-control\
    \ list-gateways --region <region> --output table\naws bedrock-agentcore-control get-gateway --region <region> --gateway-identifier\n\
    <gateway-id> --output json\nConfirm the gateway configuration includes guardrail or content-safety evaluation\napplied\
    \ to agent actions, rather than the agent's own code or prompt template being the\nonly place a guardrail is referenced.\n\
    The environment passes when guardrail evaluation is enforced at the\ngateway/orchestration layer for all agent actions.\
    \ It fails if guardrail evaluation exists\nonly as a step the agent's own prompt or code path invokes voluntarily.\n Page\
    \ 354"
  remediation: '1. Migrate agentic workloads to route actions through a gateway or orchestration

    layer supporting external guardrail enforcement (e.g., Bedrock AgentCore

    Gateway).

    2. Configure the gateway to apply guardrail evaluation to every agent action before

    execution.

    3. Remove reliance on in-prompt or in-code guardrail invocation as the sole

    enforcement point.

    4. Test by attempting a prompt-injection scenario designed to skip the in-agent

    check, and confirm the gateway-level check still blocks it.'
  checks:
  - type: manual_review
    info: 'Pre-requisite: applicable primarily to agentic workloads using AgentCore or an

      equivalent gateway/orchestration layer.

      Review the agent''s architecture to identify where guardrail evaluation is invoked:

      aws bedrock-agentcore-control list-gateways --region <region> --output table

      aws bedrock-agentcore-control get-gateway --region <region> --gateway-identifier

      <gateway-id> --output json

      Confirm the gateway configuration includes guardrail or content-safety evaluation

      applied to agent actions, rathe'
    severity: medium
- id: 7.2.4
  title: Ensure Amazon Bedrock guardrails enforce content and prompt-attack filters
  scoring: scored
  profile:
  - Level 1
  description: 'Ensure that every Amazon Bedrock guardrail configures content filters that actually enforce, rather than leaving
    them empty or disabled. A guardrail''s content policy holds a set of filters, one per category: the harmful-content categories
    Hate, Insults, Sexual, Violence, and Misconduct, plus Prompt Attack, which detects prompt injection and jailbreak attempts
    in the input. Each harmful-content filter has an input strength and an output strength drawn from none, low, medium, or
    high; the Prompt Attack filter operates on input only, so its output strength is always none. This recommendation requires
    that a guardrail''s content policy contain the harmful-content filters set to a real, organization-approved strength (not
    none) and the Prompt Attack filter enabled on input, and that the guardrail define non-empty blocked-input and blocked-output
    messaging.'
  rationale: 'A guardrail can be attached to a model yet filter nothing: if its content policy is empty or every filter strength
    is set to none, prompts and responses pass through unfiltered while the account still appears to have a guardrail in place.
    This enabled-but-ineffective state is the failure mode this recommendation closes. Content filters are the guardrail''s
    defense against two distinct threats that no other control covers at inference time: harmful or toxic content in either
    the prompt or the completion, and prompt-injection or jailbreak attempts that try to override the model''s instructions.
    Prompt Attack detection in particular is the primary in-band defense against a caller manipulating the model into ignoring
    its system prompt or safety instructions. Verifying that these filters exist and are set to a genuine strength — not none
    — is what makes the difference between a guardrail that is present and one that enforces.'
  impact: 'Content filters can produce false positives: a high strength setting is more likely to block benign prompts or
    responses that resemble the filtered categories, which can disrupt legitimate use cases. Operators should set each filter
    to the strength their workload has validated as an acceptable balance of protection and false-positive rate, rather than
    reflexively choosing the maximum. Page 356'
  references:
  - 1. NIST SP 800-53:rev5:SI-10
  - '2. NIST CSF 2.0: PR.DS'
  page_start: 356
  audit_raw: "Pre-requisite: run this in each account and Region that operates Amazon Bedrock\nguardrails.\n1. Enumerate the\
    \ guardrails in the Region:\naws bedrock list-guardrails --region <region> --query\n'guardrails[].{id:id,name:name}' --output\
    \ table\n2. For each guardrail, retrieve the full definition for the version in use:\naws bedrock get-guardrail --region\
    \ <region> --guardrail-identifier <guardrail-id> -\n-guardrail-version <numeric-version-or-omit-for-DRAFT> --output json\n\
    Review the returned contentPolicy.filters array against the pass criteria. A guardrail\npasses this recommendation when\
    \ all of the following hold:\n• A content policy is present with a non-empty filters array. A guardrail with no\ncontentPolicy,\
    \ or an empty filters array, fails.\n• Each harmful-content filter in use (Hate, Insults, Sexual, Violence, Misconduct)\n\
    has both its input strength and output strength set to a value other than none. A\ncategory left at none on input or output\
    \ is unfiltered in that direction and fails\nunless the workload has a documented reason to exclude that category.\n•\
    \ A Prompt Attack filter is present with an input strength other than none. Its output\nstrength is expected to be none,\
    \ because Prompt Attack applies to input only.\n• blockedInputMessaging and blockedOutputsMessaging are both non-empty.\n\
    The environment passes for the Region when every guardrail in use passes these\nchecks.\n Page 357"
  remediation: "Reconfigure the guardrail so its content policy enforces the harmful-content categories\nand Prompt Attack.\n\
    1. Apply the content policy. Substitute your guardrail ID and set each strength to\nyour organization-approved value:\n\
    aws bedrock update-guardrail \\\n --region <region> \\\n --guardrail-identifier <guardrail-id> \\\n --name <guardrail-name>\
    \ \\\n --blocked-input-messaging \"<message shown when a prompt is blocked>\" \\\n --blocked-outputs-messaging \"<message\
    \ shown when a response is blocked>\" \\\n --content-policy-config '{\n \"filtersConfig\": [\n {\"type\":\"HATE\",\"inputStrength\"\
    :\"HIGH\",\"outputStrength\":\"HIGH\"},\n {\"type\":\"INSULTS\",\"inputStrength\":\"HIGH\",\"outputStrength\":\"HIGH\"\
    },\n {\"type\":\"SEXUAL\",\"inputStrength\":\"HIGH\",\"outputStrength\":\"HIGH\"},\n {\"type\":\"VIOLENCE\",\"inputStrength\"\
    :\"HIGH\",\"outputStrength\":\"HIGH\"},\n {\"type\":\"MISCONDUCT\",\"inputStrength\":\"HIGH\",\"outputStrength\":\"HIGH\"\
    },\n {\"type\":\"PROMPT_ATTACK\",\"inputStrength\":\"HIGH\",\"outputStrength\":\"NONE\"}\n ]\n }'\nConfigurable options:\n\
    • Filter strength — set each input and output strength to low, medium, or high per\nyour validated false-positive tolerance;\
    \ do not leave a category at none unless its\nexclusion is documented. Prompt Attack takes an input strength only; its\
    \ output\nstrength must be none.\n• Safeguard tier — the default tier is CLASSIC. The STANDARD tier adds broader\nprompt-leakage\
    \ and code-domain coverage but requires cross-Region inference;\nto use it, add a tierName of STANDARD inside the content\
    \ policy and configure a\ncross-Region guardrail profile. Choose the tier your organization has approved.\nNote: an UpdateGuardrail\
    \ call that omits a filter category removes it, and omitting the\nsensitive-information or contextual-grounding policy\
    \ blocks in the same call leaves\nthose policies unchanged only if they are supplied separately — supply the complete\n\
    configuration for every policy the guardrail should carry."
