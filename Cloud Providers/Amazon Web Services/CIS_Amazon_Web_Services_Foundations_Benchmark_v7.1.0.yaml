- id: '4.2'
  title: Ensure CloudTrail log file validation is enabled
  scoring: scored
  profile:
  - Level 2
  description: CloudTrail log file validation creates a digitally signed digest file containing a hash of each log that CloudTrail
    writes to S3. These digest files can be used to determine whether a log file was changed, deleted, or remained unchanged
    after CloudTrail delivered the log. It is recommended that file validation be enabled for all CloudTrails.
  rationale: Enabling log file validation will provide additional integrity checks for CloudTrail logs.
  impact: ''
  references:
