- id: '2.7'
  title: Eliminate use of the 'root' user for administrative and daily tasks
  scoring: manual
  profile:
  - Level 1
  description: With the creation of an AWS account, a 'root user' is created that cannot be disabled or deleted. This user
    has unrestricted access to and control over all resources in the AWS account. It is highly recommended that the use of
    this account be avoided for everyday tasks.
  rationale: The 'root user' has unrestricted access to and control over all account resources. Use of this account is inconsistent
    with the principles of least privilege and separation of duties and can lead to unnecessary harm due to user error or
    account compromise.
  impact: Use of the root account for routine activities increases the risk of accidental or unauthorized changes, potentially
    resulting in full account compromise. Page 60
  references:
  - 1. https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
