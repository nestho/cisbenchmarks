  title: Ensure that encryption is enabled for EFS file systems
  scoring: scored
  profile:
  - Level 1
  description: EFS data should be encrypted at rest using AWS KMS (Key Management Service).
  rationale: Data should be encrypted at rest to reduce the risk of a data breach via direct access to the storage device.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/efs/latest/ug/encryption-at-rest.html
  - 2. https://awscli.amazonaws.com/v2/documentation/api/latest/reference/efs/index.ht
  page_start: 162
  audit_raw: "From Console:\n1. Login to the AWS Management Console and Navigate to the Elastic File System\n(EFS) dashboard.\n\
    2. Select File Systems from the left navigation panel.\n3. Each item on the list has a visible Encrypted field that displays\
    \ data at rest\nencryption status.\n4. Validate that this field reads Encrypted for all EFS file systems in all AWS\n\
    regions.\nFrom CLI:\n1. Run the describe-file-systems command using custom query filters to list\nthe identifiers of all\
    \ AWS EFS file systems currently available within the selected\nregion:\naws efs describe-file-systems --region --output\
    \ table --query\n'FileSystems[*].[FileSystemId,Encrypted]' --output table\n2. The command output should return a table\
    \ with the requested file system IDs.\n3. Run the describe-file-systems command using the ID of the file system\nthat\
    \ you want to examine as file-system-id and the necessary query filters:\naws efs describe-file-systems --region <region>\
    \ --file-system-id <file-system-id> -\n-query 'FileSystems[*].Encrypted'\n4. The command output should return the file\
    \ system encryption status as true or\nfalse. If the returned value is false, the selected AWS EFS file system is not\n\
    encrypted and if the returned value is true, the selected AWS EFS file system is\nencrypted.\n Page 162"
  remediation: "It is important to note that EFS file system data-at-rest encryption must be turned\non when creating the\
    \ file system. If an EFS file system has been created without\ndata-at-rest encryption enabled, then you must create another\
    \ EFS file system\nwith the correct configuration and transfer the data.\nSteps to create an EFS file system with data\
    \ encrypted at rest:\nFrom Console:\n1. Login to the AWS Management Console and Navigate to the Elastic File\nSystem (EFS)\
    \ dashboard.\n2. Select File Systems from the left navigation panel.\n3. Click the Create File System button from the\
    \ dashboard top menu to start\nthe file system setup process.\n4. On the Configure file system access configuration page,\
    \ perform the\nfollowing actions:\n• Choose an appropriate VPC from the VPC dropdown list.\n• Within the Create mount\
    \ targets section, check the boxes for all of the\nAvailability Zones (AZs) within the selected VPC. These will be your\
    \ mount\ntargets.\n• Click Next step to continue.\n5. Perform the following on the Configure optional settings page:\n\
    • Create tags to describe your new file system.\n• Choose performance mode based on your requirements.\n• Check the Enable\
    \ encryption box and choose aws/elasticfilesystem\nfrom the Select KMS master key dropdown list to enable encryption for\
    \ the\nnew file system, using the default master key provided and managed by AWS\nKMS.\n• Click Next step to continue.\n\
    6. Review the file system configuration details on the review and create page\nand then click Create File System to create\
    \ your new AWS EFS file system.\n7. Copy the data from the old unencrypted EFS file system onto the newly created\nencrypted\
    \ file system.\n8. Remove the unencrypted file system as soon as your data migration to the newly\ncreated encrypted file\
    \ system is completed.\n9. Change the AWS region from the navigation bar and repeat the entire process for\nthe other\
    \ AWS regions.\nFrom CLI:\n1. Run the describe-file-systems command to view the configuration\ninformation for the selected\
    \ unencrypted file system identified in the Audit steps:\n Page 163\naws efs describe-file-systems --region <region> --file-system-id\
    \ <file-system-id>\n2. The command output should return the configuration information.\n3. To provision a new AWS EFS\
    \ file system, you need to generate a universally\nunique identifier (UUID) to create the token required by the create-filesystem\
    \ command. To create the required token, you can use a randomly\ngenerated UUID from \"https://www.uuidgenerator.net\"\
    .\n4. Run the create-file-system command using the unique token created at the\nprevious step:\naws efs create-file-system\
    \ --region <region> --creation-token <uuid> --performancemode generalPurpose --encrypted\n5. The command output should\
    \ return the new file system configuration metadata.\n6. Run the create-mount-target command using the EFS file system\
    \ ID\nreturned from step 4 as the identifier and the ID of the Availability Zone (AZ) that\nwill represent the mount target:\n\
    aws efs create-mount-target --region <region> --file-system-id <file-system-id> --\nsubnet-id <subnet-id>\n7. The command\
    \ output should return the new mount target metadata.\n8. Now you can mount your file system from an EC2 instance.\n9.\
    \ Copy the data from the old unencrypted EFS file system to the newly created\nencrypted file system.\n10. Remove the\
    \ unencrypted file system as soon as your data migration to the\nnewly created encrypted file system is completed:\naws\
    \ efs delete-file-system --region <region> --file-system-id <unencrypted-filesystem-id>\n11. Change the AWS region by\
    \ updating the --region and repeat the entire\nprocess for the other AWS regions."
