- id: 6.1.2
  title: Ensure CIFS access is restricted to trusted networks to prevent unauthorized access
  scoring: scored
  profile:
  - Level 1
  description: Common Internet File System (CIFS) is a network file-sharing protocol that allows systems to share files over
    a network. However, unrestricted CIFS access can expose your data to unauthorized users, leading to potential security
    risks. It is important to restrict CIFS access to only trusted networks and users to prevent unauthorized access and data
    breaches.
  rationale: Allowing unrestricted CIFS access can lead to significant security vulnerabilities, as it may allow unauthorized
    users to access sensitive files and data. By restricting CIFS access to known and trusted networks, you can minimize the
    risk of unauthorized access and protect sensitive data from exposure to potential attackers. Implementing proper network
    access controls and permissions is essential for maintaining the security and integrity of your file-sharing systems.
  impact: Restricting CIFS access may require additional configuration and management effort. However, the benefits of enhanced
    security and reduced risk of unauthorized access to sensitive data far outweigh the potential challenges. Page 295
  references:
  - 1. NIST SP 800-53:rev5:SC-7 (11)
  - '2. NIST CSF 2.0: PR.IR-01'
  page_start: 295
  audit_raw: "From Console:\n1. Login to the AWS Management Console.\n2. Navigate to the EC2 Dashboard and select the Security\
    \ Groups section under\nNetwork & Security.\n3. Identify the security groups associated with instances or resources that\
    \ may be\nusing CIFS.\n4. Review the inbound rules of each security group to check for rules that allow\nunrestricted\
    \ access on port 445 (the port used by CIFS).\n• Specifically, look for inbound rules that allow access from 0.0.0.0/0\n\
    or ::/0 on port 445.\n5. Document any instances where unrestricted access is allowed and verify whether\nit is necessary\
    \ for the specific use case.\nFrom Command Line:\n1. Run the following command to list all security groups and identify\
    \ those\nassociated with CIFS:\naws ec2 describe-security-groups --region <region-name> --query\n'SecurityGroups[*].GroupId'\n\
    2. Check for any inbound rules that allow unrestricted access on port 445 using the\nfollowing command:\naws ec2 describe-security-groups\
    \ --region < region-name > --group-ids <\nsecurity-group-id > --query\n\"SecurityGroups[*].IpPermissions[?((IpProtocol=='-1')\
    \ || (FromPort<=\\`445\\`\n&&\nToPort>=\\`445\\`))].{IpProtocol:IpProtocol,FromPort:FromPort,ToPort:ToPort,CID\nRv4:IpRanges[*].CidrIp,CIDRv6:Ipv6Ranges[*].CidrIpv6}\"\
    \n• Look for 0.0.0.0/0 or ::/0 in the output, which indicates unrestricted\naccess.\n3. Repeat the audit for other regions\
    \ and security groups as necessary.\n Page 296"
  remediation: 'From Console:

    1. Login to the AWS Management Console.

    2. Navigate to the EC2 Dashboard and select the Security Groups section under

    Network & Security.

    3. Identify the security group that allows unrestricted ingress on port 445.

    4. Select the security group and click the Edit Inbound Rules button.

    5. Locate the rule allowing unrestricted access on port 445 (typically listed as

    0.0.0.0/0 or ::/0).

    6. Modify the rule to restrict access to specific IP ranges or trusted networks only.

    7. Save the changes to the security group.

    From Command Line:

    1. Run the following command to remove or modify the unrestricted rule for CIFS

    access:

    aws ec2 revoke-security-group-ingress --region <region-name> --group-id

    <security-group-id> --protocol tcp --port 445 --cidr 0.0.0.0/0

    • Optionally, run the authorise-security-group-ingress command

    to create a new rule, specifying a trusted CIDR range instead of

    0.0.0.0/0.

    2. Confirm the changes by describing the security group again and ensuring the

    unrestricted access rule has been removed or appropriately restricted:

    aws ec2 describe-security-groups --region <region-name> --group-ids

    <security-group-id> --query

    "SecurityGroups[*].IpPermissions[?((IpProtocol==''-1'') || (FromPort<=\`445\`

    &&

    ToPort>=\`445\`))].{IpProtocol:IpProtocol,FromPort:FromPort,ToPort:ToPort,CID

    Rv4:IpRanges[*].CidrIp,CIDRv6:Ipv6Ranges[*].CidrIpv6}"

    3. Repeat the remediation for other security groups and regions as necessary.'
