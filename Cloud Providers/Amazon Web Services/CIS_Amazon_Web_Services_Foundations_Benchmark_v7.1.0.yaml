- id: '4.1'
  title: Ensure CloudTrail is enabled in all regions
  scoring: manual
  profile:
  - Level 1
  description: AWS CloudTrail is a web service that records AWS API calls for your account and delivers log files to you.
    The recorded information includes the identity of the API caller, the time of the API call, the source IP address of the
    API caller, the request parameters, and the response elements returned by the AWS service. CloudTrail provides a history
    of AWS API calls for an account, including API calls made via the Management Console, SDKs, command line tools, and higher-level
    AWS services (such as CloudFormation).
  rationale: The AWS API call history produced by CloudTrail enables security analysis, resource change tracking, and compliance
    auditing. Additionally, • ensuring that a multi-region trail exists will help detect unexpected activity occurring in
    otherwise unused regions • ensuring that a multi-region trail exists will ensure that Global Service Logging is enabled
    for a trail by default to capture recordings of events generated on AWS global services • for a multi-region trail, ensuring
    that management events are configured for all types of Read/Writes ensures the recording of management operations that
    are performed on all resources in an AWS account
  impact: 'S3 lifecycle features can be used to manage the accumulation and management of logs over time. See the following
    AWS resource for more information on these features: 1. https://docs.aws.amazon.com/AmazonS3/latest/dev/object-lifecycle-mgmt.html
    Page 167'
  references:
  - 1. CCE-78913-1
  - 2. https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrailconcepts.html#cloudtrail-concepts-management-events
