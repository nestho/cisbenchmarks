- id: '4.10'
  title: Ensure all AWS-managed web front-end services have access logging enabled
  scoring: manual
  profile:
  - Level 1
  description: Ensure that access logging is enabled for all AWS-managed web front-end services that terminate or front HTTP(S)
    traffic, including Amazon CloudFront distributions, Application Load Balancers (ALB), Network Load Balancers (NLB), and
    Amazon API Gateway REST/HTTP API stages with public endpoints. Access logs must be enabled with delivery to a designated
    S3 bucket or CloudWatch Logs destination that is protected with appropriate access controls. This control requires logging
    of request details such as client IP address, timestamp, HTTP method, requested URI, response status code, bytes transferred,
    and user agent for every request processed by these services. CloudTrail provides management event logging for these resources,
    but access logs are required to capture the actual HTTP request/response activity at the network edge layers.
  rationale: AWS-managed web front-end services (CloudFront, ALB/NLB, API Gateway) represent the primary HTTP(S) ingress points
    into AWS accounts and are the first line of defense against web attacks, reconnaissance, and abuse attempts. CloudTrail
    logs management actions (create/update/delete) and data events but does not capture the content of HTTP requests/responses
    or client activity, leaving a critical visibility gap for security monitoring and incident response. Access logs from
    these services enable reconstruction of all web traffic, detection of anomalous patterns, forensic analysis of incidents,
    and compliance proof that internetfacing entry points were monitored. Without these logs, security teams cannot distinguish
    legitimate traffic from attacks or prove access patterns during audits.
  impact: Enabling access logging incurs additional storage costs for log delivery and retention, as well as minor configuration
    overhead for creating dedicated logging buckets, IAM roles, and retention policies. Costs can be managed through lifecycle
    policies, log sampling, and tiered storage classes. Page 207
  references:
  - 1. NIST SP 800-53:rev5:AU-12 a
  - '2. NIST CSF 2.0: PR.PS-04'
  page_start: 207
  audit_raw: 'As an example with CloudFront, verify following the below steps if access logging is

    enabled:

    1. Open the CloudFront console from the AWS Management Console.

    2. Click Distributions in the left navigation.

    3. For each Distribution ID (e.g., E123ABC...), click the Distribution ID and go to the

    "Logging" tab

    4. Check if one or more "Access log destinations" are present with a destination

    type of S3 or CloudWatch log group.'
  remediation: 'Following instructions enable standard access logging for CloudFront distributions using

    the AWS Management Console.

    1. Open the CloudFront console from the AWS Management Console.

    2. Click Distributions in the left navigation and click on the Distribution ID needing

    remediation.

    3. Go to the "Logging" tab and click on "Create access log delivery"

    • Select "Deliver to" for your preferred location: S3 or CloudWatch log group

    • Select the ARN of your log destination resource

    • Click on Submit

    4. Confirm if you see the access log destination in the logging tab'
  checks:
  - type: manual_review
    info: 'As an example with CloudFront, verify following the below steps if access logging is

      enabled:

      1. Open the CloudFront console from the AWS Management Console.

      2. Click Distributions in the left navigation.

