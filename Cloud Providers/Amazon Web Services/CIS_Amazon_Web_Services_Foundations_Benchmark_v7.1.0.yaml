- id: 3.1.5
  title: Ensure S3 Buckets Have Encryption at Rest Enabled with Appropriate Key Management
  scoring: manual
  profile:
  - Level 2
  description: Amazon S3 encrypts new objects by default using SSE-S3 which is AWS S3 managed keys. While this provides encryption
    at rest out of the box, many organizations are unaware this is the default or assume a customer managed key is in use
    when it is not. This recommendation ensures encryption at rest is explicitly configured and verified and that the choice
    between SSE-S3, SSE-KMS with an AWS managed key or SSE-KMS with a customer managed key is a deliberate decision rather
    than an assumption.
  rationale: S3 encrypts new objects by default using SSE-S3 but this is often mistaken for customer managed encryption since
    both simply show as "encrypted" with no visual distinction in daily use. The difference matters because SSE-S3 keys are
    fully managed by AWS, with no customer control over key policies, rotation or an audit trail of key usage. SSE-KMS with
    a customer managed key allows the organization to enforce its own access policy and generate CloudTrail records for every
    use. In regulated environments, this is often the actual compliance requirement, not just a best practice, since frameworks
    like PCI DSS and GLBA expect demonstrable control over encryption keys protecting sensitive data. Sibling services in
    this benchmark, RDS and EFS, already carry a dedicated encryption at rest recommendation. S3 should carry the same.
  impact: Migrating from SSE-S3 to SSE-KMS with a customer managed key introduces additional cost, since KMS charges per API
    call for encrypt and decrypt operations and existing objects encrypted under SSE-S3 must be re encrypted rather than automatically
    upgraded. Key policies must also be carefully designed so applications and services with a legitimate need to access the
    data are not inadvertently locked out. Page 134
  references:
  - 1. https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.
  - 2. NIST SP 800-53:rev5:SA-9 (6)
  page_start: 134
  audit_raw: '1. Open the target S3 bucket in the AWS Console

    2. Select the Properties tab and locate Default Encryption

    3. Confirm whether encryption is set to SSE-S3, SSE-KMS with an AWS

    managed key or SSE-KMS with a customer managed key

    4. If the organization''s data classification or regulatory requirements call for a

    customer managed key and the bucket is using SSE-S3 or an AWS managed

    key, the bucket is non compliant

    5. For buckets required to use a customer managed key, review the associated KMS

    key policy to confirm access is scoped to specific IAM principals rather than

    broadly granted'
  remediation: '1. Create or identify the appropriate customer managed KMS key, with a key

    policy restricting usage to the specific IAM roles or users that require it

    2. Open the target S3 bucket in the AWS Console

    3. Select the Properties tab and edit Default Encryption

    4. Choose SSE-KMS and select the customer managed key

    5. For existing objects encrypted under SSE-S3, use S3 Batch Operations or a copy

    in place operation to re encrypt them under the new key, since default encryption

    changes only apply to new objects going forward'
  checks:
  - type: manual_review
    info: '1. Open the target S3 bucket in the AWS Console

      2. Select the Properties tab and locate Default Encryption

      3. Confirm whether encryption is set to SSE-S3, SSE-KMS with an AWS

      managed key or SSE-KMS with a customer managed key

      4. If the organization''s data classification or regulatory requirements call for a

      customer managed key and the bucket is using SSE-S3 or an AWS managed

      key, the bucket is non compliant

      5. For buckets required to use a customer managed key, review the associated KMS

      key pol'
    severity: medium
- id: 3.2.1
  title: Ensure that encryption-at-rest is enabled for RDS instances
  scoring: scored
  profile:
  - Level 1
  description: Amazon RDS encrypted DB instances use the industry-standard AES-256 encryption algorithm to encrypt your data
    on the server that hosts your Amazon RDS DB instances. After your data is encrypted, Amazon RDS handles the authentication
    of access and the decryption of your data transparently, with minimal impact on performance.
  rationale: Databases are likely to hold sensitive and critical data; therefore, it is highly recommended to implement encryption
    to protect your data from unauthorized access or disclosure. With RDS encryption enabled, the data stored on the instance's
    underlying storage, the automated backups, read replicas, and snapshots are all encrypted. Page 138
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryptio
  - 2. https://aws.amazon.com/blogs/database/selecting-the-right-encryption-optionsfor-amazon-rds-and-amazon-aurora-databaseengines/#:~:text=With%20RDS%2Dencrypted%20resources%2C%20data,transp
  page_start: 138
  audit_raw: "From Console:\n1. Login to the AWS Management Console and open the RDS dashboard at\nhttps://console.aws.amazon.com/rds/.\n\
    2. In the navigation pane, under RDS dashboard, click Databases.\n3. Select the RDS instance that you want to examine.\n\
    4. Click Instance Name to see details, then select the Configuration tab.\n5. Under Configuration Details, in the Primary\
    \ Storage pane, search for the\nEncryption Enabled status.\n6. If the current status is set to Disabled, encryption is\
    \ not enabled for the\nselected RDS database instance.\n7. Repeat steps 2 to 6 to verify the encryption status of other\
    \ RDS instances in the\nsame region.\n8. Change the region from the top of the navigation bar, and repeat the audit steps\n\
    for other regions.\nFrom Command Line:\n1. Run the describe-db-instances command to list all the RDS database\ninstance\
    \ names available in the selected AWS region. The output will return each\ndatabase instance identifier (name):\naws rds\
    \ describe-db-instances --region --query\n'DBInstances[*].[DBInstanceIdentifier,StorageEncrypted]' --output table\n2.\
    \ Run the describe-db-instances command again, using an RDS instance\nidentifier returned from step 1, to determine if\
    \ the selected database instance is\nencrypted. The output should return the encryption status True or False:\naws rds\
    \ describe-db-instances --region <region-name> --db-instance-identifier <dbname> --query 'DBInstances[*].StorageEncrypted'\n\
    3. If the StorageEncrypted parameter value is False, encryption is not enabled for\nthe selected RDS database instance.\n\
    4. Repeat steps 1 to 3 to audit each RDS instance, and change the region to verify\nRDS instances in other regions.\n\
    \ Page 139"
  remediation: "From Console:\n1. Login to the AWS Management Console and open the RDS dashboard at\nhttps://console.aws.amazon.com/rds/.\n\
    2. In the left navigation panel, click on Databases.\n3. Select the Database instance that needs to be encrypted.\n4.\
    \ Click the Actions button placed at the top right and select Take Snapshot.\n5. On the Take Snapshot page, enter the\
    \ name of the database for which you want\nto take a snapshot in the Snapshot Name field and click on Take Snapshot.\n\
    6. Select the newly created snapshot, click the Action button placed at the top\nright, and select Copy snapshot from\
    \ the Action menu.\n7. On the Make Copy of DB Snapshot page, perform the following:\n• In the New DB Snapshot Identifier\
    \ field, enter a name for the new\nsnapshot.\n• Check Copy Tags. The new snapshot must have the same tags as the source\n\
    snapshot.\n• Select Yes from the Enable Encryption dropdown list to enable encryption.\nYou can choose to use the AWS\
    \ default encryption key or a custom key from the\nMaster Key dropdown list.\n8. Click Copy Snapshot to create an encrypted\
    \ copy of the selected instance's\nsnapshot.\n9. Select the new Snapshot Encrypted Copy and click the Action button located\
    \ at\nthe top right. Then, select the Restore Snapshot option from the Action menu.\nThis will restore the encrypted snapshot\
    \ to a new database instance.\n10. On the Restore DB Instance page, enter a unique name for the new\ndatabase instance\
    \ in the DB Instance Identifier field.\n11. Review the instance configuration details and click Restore DB Instance.\n\
    12. After the new instance is provisioned:\n• Update application configuration to use the new encrypted database endpoint\n\
    • Remove the unencrypted instance once migration is complete\nNote: This remediation procedure assumes that the database\
    \ has been taken offline (or\noperating in read-only mode) and is static when the snapshot is taken. If the database is\n\
    still in use, any changes made between the time the snapshot is made and the new\nencrypted database is brought online\
    \ will be lost.\nFor production databases, consider implementing replication or planned downtime to\nensure data consistency\
    \ during migration.\n Page 140\nFrom Command Line:\n1. List all RDS database instances:\naws rds describe-db-instances\
    \ --region <region-name> --query\n'DBInstances[*].DBInstanceIdentifier'\n2. Check if the instance is encrypted:\naws rds\
    \ describe-db-instances --region <region-name> --db-instance-identifier --\nquery 'DBInstances[*].StorageEncrypted'\n\
    3. Create a snapshot:\naws rds create-db-snapshot --region <region-name> --db-snapshot-identifier <dbsnapshot-name> --db-instance-identifier\
    \ <db-name>\n4. List KMS key aliases:\naws kms list-aliases --region <region-name>\n5. Create an encrypted copy of the\
    \ snapshot:\naws rds copy-db-snapshot --region <region> \\\n --source-db-snapshot-identifier <source-snapshot> \\\n --target-db-snapshot-identifier\
    \ <target-snapshot> \\\n --copy-tags \\\n --kms-key-id <kms-key-id>\n6. Restore the encrypted snapshot (default VPC):\n\
    aws rds restore-db-instance-from-db-snapshot --region <region> \\\n --db-instance-identifier <new-db-name> \\\n --db-snapshot-identifier\
    \ <snapshot-name>\n7. (Optional) Create a DB subnet group (if using custom VPC):\naws rds create-db-subnet-group \\\n\
    \ --db-subnet-group-name <name> \\\n --db-subnet-group-description <description> \\\n --subnet-ids '[\"subnet-1\",\"subnet-2\"\
    ,\"subnet-3\"]'\n8. Restore using the subnet group:\naws rds restore-db-instance-from-db-snapshot --region <region> \\\
    \n --db-subnet-group-name <subnet-group> \\\n --db-instance-identifier <new-db-name> \\\n --db-snapshot-identifier <snapshot-name>\n\
    9. Verify the new database instance:\n Page 141\naws rds describe-db-instances --region <region> --query\n'DBInstances[*].DBInstanceIdentifier'\n\
    10. Confirm encryption is enabled:\naws rds describe-db-instances --region <region> \\\n --db-instance-identifier <db-name>\
    \ \\\n --query 'DBInstances[*].StorageEncrypted'"
  checks:
  - type: manual_review
    info: 'From Console:

      1. Login to the AWS Management Console and open the RDS dashboard at

      https://console.aws.amazon.com/rds/.

      2. In the navigation pane, under RDS dashboard, click Databases.

      3. Select the RDS instance that you want to examine.

      4. Click Instance Name to see details, then select the Configuration tab.

      5. Under Configuration Details, in the Primary Storage pane, search for the

      Encryption Enabled status.

      6. If the current status is set to Disabled, encryption is not enabled for the

      select'
    severity: medium
- id: 3.2.2
  title: Ensure the Auto Minor Version Upgrade feature is enabled for RDS instances
  scoring: scored
  profile:
  - Level 1
  description: Ensure that RDS database instances have the Auto Minor Version Upgrade flag enabled to automatically receive
    minor engine upgrades during the specified maintenance window. This way, RDS instances can obtain new features, bug fixes,
    and security patches for their database engines.
  rationale: AWS RDS will occasionally deprecate minor engine versions and provide new ones for upgrades. When the last version
    number within a release is replaced, the changed version is considered minor. With the Auto Minor Version Upgrade feature
    enabled, version upgrades will occur automatically during the specified maintenance window, allowing your RDS instances
    to receive new features, bug fixes, and security patches for their database engines. Page 143
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_RDS_Mana
  - 2. https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDB
  page_start: 143
  audit_raw: "From Console:\n1. Log in to the AWS management console and navigate to the RDS dashboard at\nhttps://console.aws.amazon.com/rds/.\n\
    2. In the left navigation panel, click Databases.\n3. Select the RDS instance that you want to examine.\n4. Click on the\
    \ Maintenance and backups panel.\n5. Under the Maintenance section, search for the Auto Minor Version Upgrade\nstatus.\n\
    • If the current status is Disabled, it means that the feature is not enabled, and\nthe minor engine upgrades released\
    \ will not be applied to the selected RDS\ninstance.\nFrom Command Line:\n1. Run the describe-db-instances command to\
    \ list all RDS database names\navailable in the selected AWS region:\naws rds describe-db-instances --region --query\n\
    'DBInstances[*].[DBInstanceIdentifier,AutoMinorVersionUpgrade]' --output table\n2. The command output should return each\
    \ database instance identifier.\n3. Run the describe-db-instances command again using a RDS instance\nidentifier returned\
    \ earlier to determine the Auto Minor Version Upgrade status for\nthe selected instance:\naws rds describe-db-instances\
    \ --region <region-name> --db-instance-identifier <dbinstance-identifier> --query 'DBInstances[*].AutoMinorVersionUpgrade'\n\
    4. The command output should return the current status of the feature. If the current\nstatus is set to true, the feature\
    \ is enabled and the minor engine upgrades will\nbe applied to the selected RDS instance.\n Page 144"
  remediation: "From Console:\n1. Log in to the AWS management console and navigate to the RDS dashboard at\nhttps://console.aws.amazon.com/rds/.\n\
    2. In the left navigation panel, click Databases.\n3. Select the RDS instance that you want to update.\n4. Click on the\
    \ Modify button located at the top right side.\n5. On the Modify DB Instance: <instance identifier> page, In the\nMaintenance\
    \ section, select Auto minor version upgrade and click the\nYes radio button.\n6. At the bottom of the page, click Continue,\
    \ and check Apply Immediately to\napply the changes immediately, or select Apply during the next\nscheduled maintenance\
    \ window to avoid any downtime.\n7. Review the changes and click Modify DB Instance. The instance status\nshould change\
    \ from available to modifying and back to available. Once the\nfeature is enabled, the Auto Minor Version Upgrade status\
    \ should change\nto Yes.\nFrom Command Line:\n1. Run the describe-db-instances command to list all RDS database instance\n\
    names available in the selected AWS region:\naws rds describe-db-instances --region <region-name> --query\n'DBInstances[*].DBInstanceIdentifier'\n\
    2. The command output should return each database instance identifier.\n3. Run the modify-db-instance command to modify\
    \ the configuration of a\nselected RDS instance. This command will apply the changes immediately.\nRemove --apply-immediately\
    \ to apply changes during the next scheduled\nmaintenance window and avoid any downtime:\naws rds modify-db-instance --region\
    \ <region-name> --db-instance-identifier <dbinstance-identifier> --auto-minor-version-upgrade --apply-immediately\n4.\
    \ The command output should reveal the new configuration metadata for the RDS\ninstance, including the AutoMinorVersionUpgrade\
    \ parameter value.\n5. Run the describe-db-instances command to check if the Auto Minor\nVersion Upgrade feature has been\
    \ successfully enabled:\naws rds describe-db-instances --region <region-name> --db-instance-identifier <dbinstance-identifier>\
    \ --query 'DBInstances[*].AutoMinorVersionUpgrade'\n6. The command output should return the feature's current status set\
    \ to true,\nindicating that the feature is enabled, and that the minor engine upgrades will\nbe applied to the selected\
    \ RDS instance.\n Page 145"
  checks:
  - type: manual_review
    info: 'From Console:

      1. Log in to the AWS management console and navigate to the RDS dashboard at

      https://console.aws.amazon.com/rds/.

      2. In the left navigation panel, click Databases.

      3. Select the RDS instance that you want to examine.

      4. Click on the Maintenance and backups panel.

      5. Under the Maintenance section, search for the Auto Minor Version Upgrade

      status.

      • If the current status is Disabled, it means that the feature is not enabled, and

      the minor engine upgrades released will not be applied '
    severity: medium
- id: 3.2.3
  title: Ensure that RDS instances are not publicly accessible
  scoring: scored
  profile:
  - Level 1
  description: Ensure and verify that the RDS database instances provisioned in your AWS account restrict unauthorized access
    in order to minimize security risks. To restrict access to any RDS database instance, you must disable the Publicly Accessible
    flag for the database and update the VPC security group associated with the instance.
  rationale: Ensure that no public-facing RDS database instances are provisioned in your AWS account, and restrict unauthorized
    access in order to minimize security risks. When the RDS instance allows unrestricted access (0.0.0.0/0), anyone and anything
    on the Internet can establish a connection to your database, which can increase the opportunity for malicious activities
    such as brute force attacks, PostgreSQL injections, or DoS/DDoS attacks. Page 147
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.htm
  - 2. https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Scenario2.html
  page_start: 147
  audit_raw: "From Console:\n1. Log in to the AWS management console and navigate to the RDS dashboard at\nhttps://console.aws.amazon.com/rds/.\n\
    2. Under the navigation panel, on the RDS dashboard, click Databases.\n3. Select the RDS instance that you want to examine.\n\
    4. Click Instance Name from the dashboard, under Connectivity and\nSecurity.\n5. In the Security section, check if the\
    \ Publicly Accessible flag status is set to No.\n6. Follow the steps below to check database subnet access:\n• In the\
    \ networking section, click the subnet link under Subnets.\n• The link will redirect you to the VPC Subnets page.\n• Select\
    \ the subnet listed on the page and click the Route Table tab from the\ndashboard bottom panel.\n• If the route table\
    \ contains any entries with the destination CIDR block set to\n0.0.0.0/0 and an Internet Gateway attached, the selected\
    \ RDS database\ninstance was provisioned inside a public subnet; therefore, it is not running within\na logically isolated\
    \ environment and can be accessed from the Internet.\n7. Repeat steps 3-6 to determine the configuration of other RDS\
    \ database\ninstances provisioned in the current region.\n8. Change the AWS region from the navigation bar and repeat\
    \ the audit process for\nother regions.\nFrom Command Line:\n1. Run the describe-db-instances command to list all available\
    \ RDS database\nnames in the selected AWS region:\naws rds describe-db-instances --region <region-name> --query\n'DBInstances[*].DBInstanceIdentifier'\n\
    2. The command output should return each database instance identifier.\n3. Run the describe-db-instances command again,\
    \ using the\nPubliclyAccessible parameter as a query filter to reveal the status of the\ndatabase instance's Publicly\
    \ Accessible flag:\naws rds describe-db-instances --region us-east-1 --query\n'DBInstances[*].[DBInstanceIdentifier,PubliclyAccessible]'\
    \ --output table\n4. Check the Publicly Accessible parameter status. If the Publicly Accessible flag is\nset to Yes, then\
    \ the selected RDS database instance is publicly accessible and\ninsecure. Follow the steps mentioned below to check database\
    \ subnet access.\n Page 148\n5. Run the describe-db-instances command again using the RDS database\ninstance identifier\
    \ that you want to check, along with the appropriate filtering to\ndescribe the VPC subnet(s) associated with the selected\
    \ instance:\naws ec2 describe-route-tables --filters \"Name=association.subnet-id,Values=\" --\nquery \"RouteTables[].Routes[?GatewayId!='null']\"\
    \n• The command output should list the subnets available in the selected database\nsubnet group.\n6. Run the describe-route-tables\
    \ command using the ID of the subnet\nreturned in the previous step to describe the routes of the VPC route table\nassociated\
    \ with the selected subnet:\naws ec2 describe-route-tables --region <region-name> --filters\n\"Name=association.subnet-id,Values=<subnet-id>\"\
    \ --query 'RouteTables[*].Routes[]'\n• If the command returns the route table associated with the database instance\n\
    subnet ID, check the values of the GatewayId and DestinationCidrBlock\nattributes returned in the output. If the route\
    \ table contains any entries with the\nGatewayId value set to igw-xxxxxxxx and the DestinationCidrBlock\nvalue set to\
    \ 0.0.0.0/0, the selected RDS database instance was provisioned\nwithin a public subnet.\n• Or, if the command returns\
    \ empty results, the route table is implicitly associated\nwith the subnet; therefore, the audit process continues with\
    \ the next step.\n7. Run the describe-db-instances command again using the RDS database\ninstance identifier that you\
    \ want to check, along with the appropriate filtering to\ndescribe the VPC ID associated with the selected instance:\n\
    aws rds describe-db-instances --region <region-name> --db-instance-identifier <dbinstance-name> --query 'DBInstances[*].DBSubnetGroup.VpcId'\n\
    • The command output should show the VPC ID in the selected database subnet\ngroup.\n Page 149\n8. Now run the describe-route-tables\
    \ command using the ID of the VPC\nreturned in the previous step to describe the routes of the VPC's main route table\n\
    that is implicitly associated with the selected subnet:\naws ec2 describe-route-tables --region <region-name> --filters\
    \ \"Name=vpcid,Values=<vpc-id>\" \"Name=association.main,Values=true\" --query\n'RouteTables[*].Routes[]'\n• The command\
    \ output returns the VPC main route table implicitly associated with\nthe database instance subnet ID. Check the values\
    \ of the GatewayId and\nDestinationCidrBlock attributes returned in the output. If the route table\ncontains any entries\
    \ with the GatewayId value set to igw-xxxxxxxx and the\nDestinationCidrBlock value set to 0.0.0.0/0, the selected RDS\
    \ database\ninstance was provisioned inside a public subnet; therefore, it is not running within\na logically isolated\
    \ environment and does not adhere to AWS security best\npractices.\n Page 150"
  remediation: "From Console:\n1. Log in to the AWS management console and navigate to the RDS dashboard at\nhttps://console.aws.amazon.com/rds/.\n\
