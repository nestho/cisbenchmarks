- id: '5.14'
  title: Ensure VPC changes are monitored
  scoring: manual
  profile:
  - Level 1
  description: Real-time monitoring of API calls can be achieved by directing CloudTrail Logs to CloudWatch Logs or an external
    Security Information and Event Management (SIEM) environment, and establishing corresponding metric filters and alarms.
    It is possible to have more than one VPC within an account; additionally, it is also possible to create a peer connection
    between two VPCs, enabling network traffic to route between them. It is recommended that a metric filter and alarm be
    established for changes made to VPCs.
  rationale: CloudWatch is an AWS native service that allows you to observe and monitor resources and applications. CloudTrail
    logs can also be sent to an external Security Information and Event Management (SIEM) environment for monitoring and alerting.
    VPCs in AWS are logically isolated virtual networks that can be used to launch AWS resources. Monitoring changes to VPC
    configurations will help ensure that VPC traffic flow is not negatively impacted. Changes to VPCs can affect network accessibility
    from the public internet and additionally impact VPC traffic flow to and from the resources launched in the VPC. Page
    276
