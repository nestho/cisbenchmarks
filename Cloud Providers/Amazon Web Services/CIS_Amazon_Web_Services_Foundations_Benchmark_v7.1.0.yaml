    \ tables from a VPC and check if the \"GatewayId\" is pointing to a\n<peering-connection-id> (e.g., pcx-1a2b3c4d) and\
    \ if the\n\"DestinationCidrBlock\" is as specific as desired:\naws ec2 describe-route-tables --filter \"Name=vpc-id,Values=<vpc-id>\"\
    \ --query\n\"RouteTables[*].{RouteTableId:RouteTableId, VpcId:VpcId, Routes:Routes,\nAssociatedSubnets:Associations[*].SubnetId}\"\
