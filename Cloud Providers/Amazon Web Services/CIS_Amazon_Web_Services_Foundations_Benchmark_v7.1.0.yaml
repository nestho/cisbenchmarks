- id: '4.4'
  title: Ensure that server access logging is enabled on the CloudTrail S3 bucket
  scoring: manual
  profile:
  - Level 1
  description: Server access logging generates a log that contains access records for each request made to your S3 bucket.
    An access log record contains details about the request, such as the request type, the resources specified in the request
    worked, and the time and date the request was processed. It is recommended that server access logging be enabled on the
    CloudTrail S3 bucket.
  rationale: By enabling server access logging on target S3 buckets, it is possible to capture all events that may affect
    objects within any target bucket. Configuring the logs to be placed in a separate bucket allows access to log information
    that can be useful in security and incident response workflows. In some environments (e.g., AWS Control Tower), logs may
    be delivered to the same bucket with appropriate prefixes, which is also an acceptable configuration. Page 180
  impact: ''
  references:
  - 1. CCE-78918-0
  - 2. https://docs.aws.amazon.com/AmazonS3/latest/dev/ServerLogs.html
  page_start: 180
  audit_raw: "Perform the following ensure that the CloudTrail S3 bucket has access logging is\nenabled:\nFrom Console:\n\
    1. Go to the Amazon CloudTrail console at\nhttps://console.aws.amazon.com/cloudtrail/home.\n2. In the API activity history\
    \ pane on the left, click Trails.\n3. In the Trails pane, note the bucket names in the S3 bucket column.\n4. Sign in to\
    \ the AWS Management Console and open the S3 console at\nhttps://console.aws.amazon.com/s3.\n5. Under All Buckets click\
    \ on a target S3 bucket.\n6. Click on Properties in the top right of the console.\n7. Scroll down to Server access logging.\n\
    8. Ensure Server access logging is Enabled.\n9. Verify the Target bucket where logs are delivered.\nFrom Command Line:\n\
    1. Get the name of the S3 bucket that CloudTrail is logging to:\naws cloudtrail describe-trails --query 'trailList[*].S3BucketName'\n\
    2. Ensure logging is enabled on the bucket:\naws s3api get-bucket-logging --bucket <s3-bucket-for-cloudtrail>\nEnsure\
    \ the command does not return an empty output.\nSample output for a bucket with logging enabled:\n{\n \"LoggingEnabled\"\
    : {\n \"TargetPrefix\": \"<log-file-prefix>\",\n \"TargetBucket\": \"<logging-bucket>\"\n }\n}"
  remediation: "Perform the following to enable server access logging:\nFrom Console:\n1. Sign in to the AWS Management Console\
    \ and open the S3 console at\nhttps://console.aws.amazon.com/s3.\n2. Under All Buckets click on the target S3 bucket.\n\
    \ Page 181\n3. Click on Properties in the top right of the console.\n4. Under Server access logging, click Edit.\n5. Configure\
    \ bucket logging:\n• Check the Enabled box.\n• Select a Target Bucket from the list.\n• Enter a Target Prefix.\n6. Click\
    \ Save.\nFrom Command Line:\n1. Get the name of the S3 bucket that CloudTrail is logging to:\naws cloudtrail describe-trails\
    \ --region <region-name> --query\ntrailList[*].S3BucketName\n2. Create a logging configuration file and populate the following\
    \ values:\n{\n \"LoggingEnabled\": {\n \"TargetBucket\": \"<TargetBucket>\",\n \"TargetPrefix\": \"<TargetPrefix>\",\n\
    \ \"TargetGrants\": [\n {\n \"Grantee\": {\n \"Type\": \"AmazonCustomerByEmail\",\n \"EmailAddress\": \"\"\n },\n \"Permission\"\
    : \"FULL_CONTROL\"\n }\n ]\n }\n}\n3. Save the file as <file>.json\n4. Apply the logging configuration:\naws s3api put-bucket-logging\
    \ --bucket <bucket-name> --bucket-logging-status\nfile://<file>.json"
  checks:
  - type: manual_review
    info: 'Perform the following ensure that the CloudTrail S3 bucket has access logging is

