    \ AWS Management Console and open the CloudTrail console at\nhttps://console.aws.amazon.com/cloudtrail\n2. Click on Trails\
    \ in the left navigation pane\n• You will be presented with a list of trails across all regions\n3. Ensure that at least\
    \ one Trail has Yes specified in the Multi-region trail\ncolumn\n4. Click on a trail via the link in the Name column\n\
    5. Ensure Logging is set to ON\n6. Ensure Multi-region trail is set to Yes\n7. In the section Management Events, ensure\
    \ that API activity set to ALL\nFrom Command Line:\n1. List all trails:\n aws cloudtrail describe-trails\n2. Ensure IsMultiRegionTrail\
    \ is set to true:\naws cloudtrail get-trail-status --name <trail-name>\n3. Ensure IsLogging is set to true:\naws cloudtrail\
    \ get-event-selectors --trail-name <trail-name>\n4. Ensure there is at least one fieldSelector for a trail that equals\n\
    Management:\n• This should NOT output any results for Field: \"readOnly\". If either true or false\nis returned, one of\
