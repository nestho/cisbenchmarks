- id: '6.5'
  title: Ensure the default security group of every VPC restricts all traffic
  scoring: scored
  profile:
  - Level 2
  description: 'A VPC comes with a default security group whose initial settings deny all inbound traffic, allow all outbound
    traffic, and allow all traffic between instances assigned to the security group. If a security group is not specified
    when an instance is launched, it is automatically assigned to this default security group. Security groups provide stateful
    filtering of ingress/egress network traffic to AWS resources. It is recommended that the default security group restrict
    all traffic, both inbound and outbound. The default VPC in every region should have its default security group updated
    to comply with the following: • No inbound rules. • No outbound rules. Any newly created VPCs will automatically contain
    a default security group that will need remediation to comply with this recommendation. Note: When implementing this recommendation,
    VPC flow logging is invaluable in determining the least privilege port access required by systems to work properly, as
    it can log all packet acceptances and rejections occurring under the current security groups. This dramatically reduces
    the primary barrier to least privilege engineering by discovering the minimum ports required by systems in the environment.
    Even if the VPC flow logging recommendation in this benchmark is not adopted as a permanent security measure, it should
    be used during any period of discovery and engineering for least privileged security groups.'
  rationale: Configuring all VPC default security groups to restrict all traffic will encourage the development of least privilege
    security groups and promote the mindful placement of AWS resources into security groups, which will, in turn, reduce the
    exposure of those resources. Page 309
  impact: 'Implementing this recommendation in an existing VPC that contains operating resources requires extremely careful
    migration planning, as the default security groups are likely enabling many ports that are unknown. Enabling VPC flow
    logging (for accepted connections) in an existing environment that is known to be breach-free will reveal the current
    pattern of ports being used for each instance to communicate successfully. The migration process should include: • Analyzing
    VPC flow logs to understand current traffic patterns. • Creating least privilege security groups based on the analyzed
    data. • Testing the new security group rules in a staging environment before applying them to production.'
  references:
  - 1. CCE-79201-0
  - 2. https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-networksecurity.html
  page_start: 309
  audit_raw: "Perform the following to determine if the account is configured as prescribed:\nSecurity Group State\n1. Login\
    \ to the AWS VPC Console at https://console.aws.amazon.com/vpc/home.\n2. Repeat the following steps for all VPCs, including\
    \ the default VPC in each AWS\nregion:\n3. In the left pane, click Security Groups.\n4. For each default security group,\
    \ perform the following:\n• Select the default security group.\n• Click the Inbound Rules tab and ensure no rules exist.\n\
    • Click the Outbound Rules tab and ensure no rules exist.\nSecurity Group Members\n1. Login to the AWS VPC Console at\
    \ https://console.aws.amazon.com/vpc/home.\n2. Repeat the following steps for all default groups in all VPCs, including\
    \ the default\nVPC in each AWS region:\n3. In the left pane, click Security Groups.\n4. Copy the ID of the default security\
    \ group.\n5. Change to the EC2 Management Console at\nhttps://console.aws.amazon.com/ec2/v2/home.\n6. In the filter column\
    \ type Security Group ID : <security-group-idfrom-step-4>.\n Page 310"
  remediation: "Perform the following to implement the prescribed state:\nSecurity Group Members\n1. Identify AWS resources\
    \ that exist within the default security group.\n2. Create a set of least-privilege security groups for those resources.\n\
    3. Place the resources in those security groups, removing the resources noted in\nstep 1 from the default security group.\n\
    From Console:\n1. Login to the AWS VPC Console at https://console.aws.amazon.com/vpc/home.\n2. Repeat the following steps\
    \ for all VPCs, including the default VPC in each AWS\nregion:\n3. In the left pane, click Security Groups.\n4. For each\
    \ default security group, perform the following:\n• Select the default security group.\n• Click the Inbound Rules tab.\n\
    • Remove any inbound rules.\n• Click the Outbound Rules tab.\n• Remove any Outbound rules.\nFrom Command Line:\n1. List\
    \ all default security groups in the specified region\naws ec2 describe-security-groups --region <region-name> --query\n\
    'SecurityGroups[?GroupName == `default`]'\n2. Check if the inbound rules (IpPermissions) and outbound rules\n(IpPermissionsEgress)\
    \ of the default security group are empty. If the rules are not\nempty, proceed and note down the Security Group ID (GroupId)\
    \ of the security\ngroup with non-empty rules.\n3. List the inbound security group rule IDs (SecurityGroupRuleId)\naws\
    \ ec2 describe-security-group-rules --region <region-name> --query\n'SecurityGroupRules[?GroupId == `<default-security-group-id>`\
    \ && IsEgress ==\n`false`]'\n4. Delete the inbound security group rules based on their rule IDs\naws ec2 revoke-security-group-ingress\
