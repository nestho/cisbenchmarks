    2. In the left pane, click Credential Report\n3. Select Download Report\n4. Open or Save the file locally\n5. Locate the\
    \ root user under the user column\n6. Review:\n• password_last_used\n• access_key_1_last_used_date\n• access_key_2_last_used_date\n\
    7. Determine whether recent usage indicates frequent or inappropriate use of the\nroot account\n8. Ensure the mfa_active\
    \ field is set to TRUE or the password_enabled field is\nset to FALSE\nFrom Command Line:\n1. Run the following CLI commands\
    \ to provide a credential report for determining\nthe last time the 'root user' was used:\naws iam generate-credential-report\n\
