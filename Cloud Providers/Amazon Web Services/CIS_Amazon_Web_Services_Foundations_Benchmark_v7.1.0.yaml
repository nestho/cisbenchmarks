- id: 3.2.5
  title: Ensure Deletion Protection is Enabled for RDS Instances
  scoring: manual
  profile:
  - Level 2
  description: Amazon RDS provides a deletion protection setting that adds a required confirmation step before a database
    instance can be deleted, either through the console, CLI or API. This setting is not enabled by default and must be explicitly
    configured on a per instance basis.
  rationale: 'Deletion protection doesn''t replace IAM permissions, it adds a second layer that catches what access controls
    miss: accidental deletion. A mistyped CLI command, a bad automation script or a compromised pipeline with valid credentials
    can all delete a database just as easily as an unauthorized user. This setting forces a deliberate extra step before that
    can happen. It also matters for organizations with data retention or business continuity requirements, where losing a
    production database unexpectedly creates problems well beyond the immediate incident. RDS already has dedicated controls
    for encryption and Multi-AZ availability in this benchmark, deletion protection rounds that out by covering accidental
    loss of the resource itself.'
  impact: Once enabled, the instance can't be deleted through automation or infrastructure as code without first turning this
    setting off. Teams that tear down environments automatically, like temporary dev or test databases, should account for
    that in their teardown scripts. Page 158
  references:
  - 1. https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_DeleteInsta
  - 2. NIST SP 800-53:rev5:CM-3 (8)
  page_start: 158
  audit_raw: 'From Console:

    1. Open the target RDS instance in the AWS Console

    2. Select the Modify view, or review the instance''s Configuration tab

    3. Locate the Deletion Protection setting

    4. Confirm it is set to Enabled

    5. If it is set to Disabled, the instance is non compliant

    From Command Line:

    1. Run the following command to list all RDS instances in the selected AWS region:

    aws rds describe-db-instances --region <region-name> --query

    ''DBInstances[*].DBInstanceIdentifier''

    2. Run the following command using the instance identifier returned earlier to check

    the Deletion Protection status:

    aws rds describe-db-instances --region --query

    ''DBInstances[*].[DBInstanceIdentifier,DeletionProtection]'' --output table

    * If the output is True, Deletion Protection is enabled.

    * If the output is False, Deletion Protection is not enabled.

    3. Repeat steps 1 and 2 to audit each RDS instance, and change regions to verify

    in other regions.'
  remediation: "From Console:\n1. Open the target RDS instance in the AWS Console\n2. Select Modify\n3. Under Deletion Protection,\
    \ select Enable deletion protection\n4. Apply the change, either immediately or during the next maintenance window\ndepending\
    \ on operational preference\n5. Confirm the setting shows as Enabled on the instance's Configuration tab\nFrom Command\
    \ Line:\n1. For each instance, run the following command:\naws rds modify-db-instance --db-instance-identifier <db-instance-identifier>\
    \ --\ndeletion-protection\nBy adding the --apply-immediately parameter, the change will be applied without\nwaiting for\
    \ the next maintenance window, otherwise it will be applied during the next\nscheduled maintenance window.\n Page 159"
