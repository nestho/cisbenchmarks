- id: '2.20'
  title: Ensure access to AWSCloudShellFullAccess is restricted
  scoring: manual
  profile:
  - Level 1
  description: AWS CloudShell is a convenient way of running CLI commands against AWS services. The managed IAM policy AWSCloudShellFullAccess
    provides full access to CloudShell, including file upload and download capability between a user's local system and the
    CloudShell environment. Within the CloudShell environment, a user has sudo permissions and can access the internet. It
    is therefore possible to install software and transfer data to external systems.
  rationale: Access to this policy should be restricted, as it presents a potential channel for data exfiltration by privileged
    users. AWS documentation provides guidance on creating more restrictive policies that limit file transfer capabilities.
  impact: Unrestricted access to CloudShell may allow users to transfer data outside the AWS environment, increasing the risk
    of data exfiltration and loss of sensitive information. Page 106
  references:
  - 1. https://docs.aws.amazon.com/cloudshell/latest/userguide/sec-auth-withidentities.html
  - 2. NIST SP 800-53:rev5:AC-6
  page_start: 106
  audit_raw: "From Console\n1. Sign in to the AWS Management Console and open the IAM console at\nhttps://console.aws.amazon.com/iam\n\
    2. In the left pane, select Policies\n3. Search for and select AWSCloudShellFullAccess\n4. Select the Entities attached\
    \ tab\n5. Ensure that no users, groups, or roles are attached\nFrom Command Line\n1. Run the following command:\naws iam\
    \ list-entities-for-policy --policy-arn\narn:aws:iam::aws:policy/AWSCloudShellFullAccess\n2. In the output, ensure the\
    \ following are empty:\n• PolicyUsers\n• PolicyRoles\n• PolicyGroups\nExample:\nPolicyRoles: [ ]\n Page 107"
  remediation: "From Console\n1. Open the IAM console at https://console.aws.amazon.com/iam/\n2. In the left pane, select\
    \ Policies\n3. Search for and select AWSCloudShellFullAccess\n4. Select the Entities attached tab\n5. For each attached\
    \ entity:\n• Select the entity\n• Choose Detach\nFrom Command Line (optional automation):\nPOLICY_ARN=\"arn:aws:iam::aws:policy/AWSCloudShellFullAccess\"\
    \n# Detach from users\nfor u in $(aws iam list-entities-for-policy --policy-arn \"$POLICY_ARN\" --query\n\"PolicyUsers[].UserName\"\
    \ --output text); do\n echo \"Detaching from user: $u\"\n aws iam detach-user-policy --user-name \"$u\" --policy-arn \"\
    $POLICY_ARN\"\ndone\n# Detach from roles\nfor r in $(aws iam list-entities-for-policy --policy-arn \"$POLICY_ARN\" --query\n\
    \"PolicyRoles[].RoleName\" --output text); do\n echo \"Detaching from role: $r\"\n aws iam detach-role-policy --role-name\
    \ \"$r\" --policy-arn \"$POLICY_ARN\"\ndone\n# Detach from groups\nfor g in $(aws iam list-entities-for-policy --policy-arn\
    \ \"$POLICY_ARN\" --query\n\"PolicyGroups[].GroupName\" --output text); do\n echo \"Detaching from group: $g\"\n aws iam\
    \ detach-group-policy --group-name \"$g\" --policy-arn \"$POLICY_ARN\"\ndone"
  checks:
  - type: manual_review
    info: 'From Console

      1. Sign in to the AWS Management Console and open the IAM console at

      https://console.aws.amazon.com/iam

      2. In the left pane, select Policies

      3. Search for and select AWSCloudShellFullAccess

      4. Select the Entities attached tab

      5. Ensure that no users, groups, or roles are attached

      From Command Line

      1. Run the following command:

      aws iam list-entities-for-policy --policy-arn

      arn:aws:iam::aws:policy/AWSCloudShellFullAccess

      2. In the output, ensure the following are empty:

      • PolicyUsers

      '
    severity: medium
- id: '2.21'
  title: 'Ensure AWS resource policies do not allow unrestricted access using "Principal": "*"'
  scoring: manual
  profile:
  - Level 1
  description: 'Ensure AWS resource-based policies, such as Amazon S3 bucket policies, Amazon SQS queue policies, Amazon SNS
    topic policies, and AWS Lambda resource policies, do not grant unrestricted access using "Principal": "*" with "Effect":
    "Allow" unless the policy includes restrictive conditions that limit access to specific trusted identities, accounts,
    services, or network boundaries.'
  rationale: 'Resource-based policies are evaluated alongside identity-based IAM policies during authorization decisions.
    When a policy statement specifies "Principal": "*" with "Effect": "Allow", it grants the specified permissions to any
    AWS principal unless additional conditions restrict the request. This may unintentionally allow access from users, roles,
    or services in any AWS account. Such broad access significantly increases the risk of unauthorized data access, resource
    abuse, or data exfiltration.'
  impact: Unrestricted resource-based policies may expose data or services to unauthorized access, potentially leading to
    data breaches, service misuse, or unintended public exposure. Page 110
  references:
  - 1. NIST SP 800-53:rev5:AC-3
  - '2. NIST CSF 2.0: PR.AA-05'
  page_start: 110
  audit_raw: "1. Identify resources that support resource-based policies within the AWS account,\nsuch as S3 buckets, SQS\
    \ queues, SNS topics, and Lambda functions\n2. Retrieve the resource policies for each resource. Example CLI commands:\n\
    SQS Queue Policies\naws sqs get-queue-attributes \\\n--queue-url https://sqs.region.amazonaws.com/account/QUEUE \\\n--attribute-names\
    \ Policy\nS3 Bucket Policies\naws s3api get-bucket-policy \\\n--bucket YOUR-BUCKET-NAME\nSNS Topic Policies\naws sns get-topic-attributes\
    \ \\\n --topic-arn TOPIC-ARN \\\n --query \"Attributes.Policy\" \\\n --output text\n3. Inspect the retrieved policies\
    \ and identify statements containing:\n• \"Effect\": \"Allow\" AND \"Principal\": \"*\" OR\n• \"Principal\": {\"AWS\"\
    : \"*\"}\n4. Evaluate whether the statement includes restrictive conditions such as:\n• aws:SourceArn\n• aws:SourceAccount\n\
    • aws:PrincipalArn\n• Other service-specific condition keys\n5. Determine audit status:\n• Compliant: Wildcard principals\
    \ are present only when restrictive conditions limit\naccess to trusted principals or services\n• Non-Compliant: Wildcard\
    \ principals are used without sufficient restrictions\n Page 111"
  remediation: "If a resource policy contains \"Principal\": \"*\" with \"Effect\": \"Allow\" and\nlacks sufficient restrictions,\
    \ modify the policy to limit access.\nOPTION 1 – Restrict the Principal Replace the wildcard principal (\"Principal\"\
    : \"*\") with a\nspecific account, role, user, or service.\nExample: Non-Compliant Policy\n{\n \"Version\": \"2012-10-17\"\
    ,\n \"Statement\": [\n {\n \"Sid\": \"AllowPublicAccess\",\n \"Effect\": \"Allow\",\n \"Principal\": \"*\",\n \"Action\"\
    : \"sqs:SendMessage\",\n \"Resource\": \"arn:aws:sqs:us-east-1:123456789012:my-queue\"\n }\n ]\n}\nSteps:\n1. Retrieve\
    \ the current policy:\naws sqs get-queue-attributes \\\n --queue-url https://sqs.us-east-1.amazonaws.com/123456789012/my-queue\
    \ \\\n --attribute-names Policy \\\n --query 'Attributes.Policy'\n2. Update the policy with a specific principal:\naws\
    \ sqs set-queue-attributes \\\n --queue-url https://sqs.us-east-1.amazonaws.com/123456789012/my-queue \\\n --attributes\
    \ '{\n \"Policy\": \"{\\\"Version\\\":\\\"2012-1017\\\",\\\"Statement\\\":[{\\\"Sid\\\":\\\"AllowSpecificAccount\\\",\\\
    \"Effect\\\":\\\"Allow\\\",\\\"Princi\npal\\\":{\\\"AWS\\\":\\\"arn:aws:iam::345678901234:root\\\"},\\\"Action\\\":\\\"\
    sqs:SendMessage\\\",\\\n\"Resource\\\":\\\"arn:aws:sqs:us-east-1:123456789012:my-queue\\\"}]}\"\n }'\nResulting Compliant\
    \ Policy:\n Page 112\n{\n \"Version\": \"2012-10-17\",\n \"Statement\": [\n {\n \"Sid\": \"AllowSpecificAccount\",\n \"\
    Effect\": \"Allow\",\n \"Principal\": {\n \"AWS\": \"arn:aws:iam::345678901234:root\"\n },\n \"Action\": \"sqs:SendMessage\"\
    ,\n \"Resource\": \"arn:aws:sqs:us-east-1:123456789012:my-queue\"\n }\n ]\n}\nOPTION 2 – Restrict Using Conditions If\
    \ a wildcard principal is required, add restrictive\nconditions.\nExample compliant policy:\n{\n \"Version\": \"2012-10-17\"\
    ,\n \"Statement\": [\n {\n \"Sid\": \"AllowServiceIntegration\",\n \"Effect\": \"Allow\",\n \"Principal\": \"*\",\n \"\
    Action\": \"sqs:SendMessage\",\n \"Resource\": \"arn:aws:sqs:us-east-1:123456789012:my-queue\",\n \"Condition\": {\n \"\
    StringEquals\": {\n \"aws:SourceAccount\": \"345678901234\"\n }\n }\n }\n ]\n}"
  checks:
  - type: manual_review
    info: "1. Identify resources that support resource-based policies within the AWS account,\nsuch as S3 buckets, SQS queues,\
      \ SNS topics, and Lambda functions\n2. Retrieve the resource policies for each resource. Example CLI commands:\nSQS\
      \ Queue Policies\naws sqs get-queue-attributes \\\n--queue-url https://sqs.region.amazonaws.com/account/QUEUE \\\n--attribute-names\
      \ Policy\nS3 Bucket Policies\naws s3api get-bucket-policy \\\n--bucket YOUR-BUCKET-NAME\nSNS Topic Policies\naws sns\
      \ get-topic-attributes \\\n --topic-arn TOP"
    severity: medium
- id: 3.1.1
  title: Ensure S3 Bucket Policy is set to deny HTTP requests
  scoring: scored
  profile:
  - Level 2
  description: At the Amazon S3 bucket level, permissions can be configured through a bucket policy to ensure objects are
    accessible only through HTTPS.
  rationale: By default, Amazon S3 allows both HTTP and HTTPS requests. To ensure that access to S3 objects is only permitted
    through HTTPS, you must explicitly deny HTTP requests. Bucket policies that allow HTTPS requests without explicitly denying
    HTTP requests do not meet this requirement.
  impact: If HTTP access is not explicitly denied, data transmitted to and from S3 buckets may be exposed to interception
    or man-in-the-middle attacks. Page 117
  references:
  - 1. https://aws.amazon.com/premiumsupport/knowledge-center/s3-bucket-policy-forconfig-rule/
  - 2. https://aws.amazon.com/blogs/security/how-to-use-bucket-policies-and-applydefense-in-depth-to-help-secure-your-amazon-s3-data/
  page_start: 117
  audit_raw: "From Console:\n1. Login to the AWS Management Console and open the Amazon S3 console using\nhttps://console.aws.amazon.com/s3/\n\
    2. Select the target bucket\n3. Select the 'Permissions' tab\n4. Select Bucket policy\n5. Ensure a policy exists that\
    \ explicitly denies HTTP requests using one of the\nfollowing conditions:\nOption 1: Deny non-HTTPS requests\n{\n \"Sid\"\
    : <optional>,\n \"Effect\": \"Deny\",\n \"Principal\": \"*\",\n \"Action\": \"s3:*\",\n \"Resource\": \"arn:aws:s3:::<bucket_name>/*\"\
    ,\n \"Condition\": {\n \"Bool\": {\n \"aws:SecureTransport\": \"false\"\n }\n }\n}\nOption 2: Enforce minimum TLS version\n\
    {\n \"Sid\": \"<optional>\",\n \"Effect\": \"Deny\",\n \"Principal\": \"*\",\n \"Action\": \"s3:*\",\n \"Resource\": [\n\
    \ \"arn:aws:s3:::<bucket_name>\",\n \"arn:aws:s3:::<bucket_name>/*\"\n ],\n \"Condition\": {\n \"NumericLessThan\": {\n\
    \ \"s3:TlsVersion\": \"1.2\"\n }\n }\n}\n6. Repeat for all S3 buckets\nFrom Command Line:\n1. List all of the S3 Buckets:\n\
    \ Page 118\naws s3 ls\n2. For each bucket, run:\naws s3api get-bucket-policy --bucket <bucket_name> | grep aws:SecureTransport\n\
    or\naws s3api get-bucket-policy --bucket <bucket_name> | grep s3:TlsVersion\n3. Verify the policy includes either:\n•\
    \ \"aws:SecureTransport\": \"false\" with \"Effect\": \"Deny\"\n• or a TLS version restriction using \"s3:TlsVersion\"\
    \n4. If no policy is returned, the bucket allows both HTTP and HTTPS requests by\ndefault\n Page 119"
  remediation: "From Console:\n1. Sign in to the AWS Management Console and open the Amazon S3 console\n2. Select the bucket\n\
    3. Select the Permissions tab\n4. Select Bucket policy\n5. Add one of the following statements to the policy\nDeny HTTP\
    \ requests:\n{\n \"Sid\": <optional>,\n \"Effect\": \"Deny\",\n \"Principal\": \"*\",\n \"Action\": \"s3:*\",\n \"Resource\"\
    : \"arn:aws:s3:::<bucket_name>/*\",\n \"Condition\": {\n \"Bool\": {\n \"aws:SecureTransport\": \"false\"\n }\n }\n}\n\
    Enforce TLS version:\n{\n \"Sid\": \"<optional>\",\n \"Effect\": \"Deny\",\n \"Principal\": \"*\",\n \"Action\": \"s3:*\"\
    ,\n \"Resource\": [\n \"arn:aws:s3:::<bucket_name>\",\n \"arn:aws:s3:::<bucket_name>/*\"\n ],\n \"Condition\": {\n \"\
    NumericLessThan\": {\n \"s3:TlsVersion\": \"1.2\"\n }\n }\n}\n6. Save the policy\n7. Repeat for all relevant buckets\n\
    From Console\nUsing AWS Policy Generator:\n1. Repeat steps 1-4 above\n Page 120\n2. Click on Policy Generator at the bottom\
    \ of the Bucket Policy editor\n3. Select S3 Bucket Policy as the policy type\n4. Configure the statement:\n• Effect =\
    \ Deny\n• Principal = *\n• AWS Service = Amazon S3\n• Actions = *\n• Amazon Resource Name = <ARN of the S3 Bucket>\n5.\
    \ Select Generate Policy\n6. Copy the generated policy and add it to the bucket policy\nFrom Command Line:\n1. Export\
    \ the existing policy, if one exists:\naws s3api get-bucket-policy --bucket <bucket_name> --query Policy --output text\
    \ >\npolicy.json\nIf the bucket does not already have a policy, create a new policy.json file containing\na valid bucket\
    \ policy document.\n2. Modify policy.json to include one of the following deny statements within the\nStatement array.\n\
    Option 1: Deny HTTP requests\n{\n \"Sid\": <optional>,\n \"Effect\": \"Deny\",\n \"Principal\": \"*\",\n \"Action\": \"\
    s3:*\",\n \"Resource\": \"arn:aws:s3:::<bucket_name>/*\",\n \"Condition\": {\n \"Bool\": {\n \"aws:SecureTransport\":\
    \ \"false\"\n }\n }\n}\nOption 2: Enforce minimum TLS version\n Page 121\n{\n \"Sid\": \"<optional>\",\n \"Effect\": \"\
    Deny\",\n \"Principal\": \"*\",\n \"Action\": \"s3:*\",\n \"Resource\": [\n \"arn:aws:s3:::<bucket_name>\",\n \"arn:aws:s3:::<bucket_name>/*\"\
    \n ],\n \"Condition\": {\n \"NumericLessThan\": {\n \"s3:TlsVersion\": \"1.2\"\n }\n }\n}\n3. Apply the modified policy\
    \ back to the S3 bucket:\naws s3api put-bucket-policy --bucket <bucket_name> --policy file://policy.json"
  checks:
  - type: command
    command: aws s3api get-bucket-policy --bucket <bucket_name> | grep aws:SecureTransport && aws s3api get-bucket-policy
      --bucket <bucket_name> | grep s3:TlsVersion
    expected: ''
    severity: medium
    info: "From Console:\n1. Login to the AWS Management Console and open the Amazon S3 console using\nhttps://console.aws.amazon.com/s3/\n\
      2. Select the target bucket\n3. Select the 'Permissions' tab\n4. Select Bucket policy\n5. Ensure a policy exists that\
      \ explicitly denies HTTP requests using one of the\nfollowing conditions:\nOption 1: Deny non-HTTPS requests\n{\n \"\
      Sid\": <optional>,\n \"Effect\": \"Deny\",\n \"Principal\": "
- id: 3.1.2
  title: Ensure MFA Delete is enabled on S3 buckets
  scoring: manual
  profile:
  - Level 2
  description: Once MFA Delete is enabled on your sensitive and classified S3 bucket, it requires the user to provide two
    forms of authentication.
  rationale: Adding MFA delete to an S3 bucket requires additional authentication when you change the version state of your
    bucket or delete an object version, adding another layer of security in the event your security credentials are compromised
    or unauthorized access is granted.
  impact: 'Enabling MFA delete on an S3 bucket could require additional administrator oversight. Enabling MFA delete may impact
    other services that automate the creation and/or deletion of S3 buckets. Note: Versioning and MFA Delete should be applied
    based on data sensitivity and bucket purpose, since versioning retains every prior object version and can add real storage
    cost for high churn or logging buckets that don''t need full version history. Page 123'
  references:
  - 1. https://docs.aws.amazon.com/AmazonS3/latest/dev/Versioning.html#MultiFactor
  - 2. https://docs.aws.amazon.com/AmazonS3/latest/dev/UsingMFADelete.html
  page_start: 123
  audit_raw: "Perform the steps below to confirm that MFA delete is configured on an S3 bucket:\nFrom Console:\n1. Login to\
    \ the S3 console at https://console.aws.amazon.com/s3/.\n2. Click the check box next to the name of the bucket you want\
    \ to confirm.\n3. In the window under Properties:\n• Confirm that Versioning is Enabled\n• Confirm that MFA Delete is\
    \ Enabled\nFrom Command Line:\n1. Run the get-bucket-versioning command:\naws s3api get-bucket-versioning --bucket my-bucket\
    \ | grep MfaDelete\nExample output:\n<VersioningConfiguration xmlns=\"http://s3.amazonaws.com/doc/2006-03-01/\">\n <Status>Enabled</Status>\n\
    \ <MfaDelete>Enabled</MfaDelete>\n</VersioningConfiguration>\nIf the console or CLI output does not show that Versioning\
    \ and MFA Delete are\nenabled, please refer to the remediation below.\n Page 124"
  remediation: "Perform the steps below to enable MFA delete on an S3 bucket:\nNote:\n• You cannot enable MFA Delete using\
    \ the AWS Management Console; you must\nuse the AWS CLI or API.\n• You must use your 'root' account to enable MFA Delete\
    \ on S3 buckets.\nFrom Command line:\n1. Run the s3api put-bucket-versioning command:\naws s3api put-bucket-versioning\
    \ \\\n --bucket my-bucket \\\n --versioning-configuration Status=Enabled,MFADelete=Enabled \\\n --mfa \"arn:aws:iam::<account-id>:mfa/root-account-mfa-device\
    \ <MFA-code>\""
  checks:
  - type: command
    command: aws s3api get-bucket-versioning --bucket my-bucket | grep MfaDelete
    expected: ''
    severity: medium
    info: 'Perform the steps below to confirm that MFA delete is configured on an S3 bucket:

      From Console:

      1. Login to the S3 console at https://console.aws.amazon.com/s3/.

      2. Click the check box next to the name of the bucket you want to confirm.

      3. In the window under Properties:

      • Confirm that Versioning is Enabled

      • Confirm that MFA Delete is Enabled

      From Command Line:

      1. Run the get-bucket-versioning co'
- id: 3.1.3
  title: Ensure all data in Amazon S3 has been discovered, classified, and secured when necessary
  scoring: manual
  profile:
  - Level 2
  description: Amazon S3 buckets can contain sensitive data that, for security purposes, should be discovered, monitored,
    classified, and protected. Macie, along with other third-party tools, can automatically provide an inventory of Amazon
    S3 buckets.
  rationale: Using a cloud service or third-party software to continuously monitor and automate the process of data discovery
    and classification for S3 buckets through machine learning and pattern matching is a strong defense in protecting that
    information. Amazon Macie is a fully managed data security and privacy service that uses machine learning and pattern
    matching to discover and protect your sensitive data in AWS.
  impact: There is a cost associated with using Amazon Macie, and there is typically a cost associated with third-party tools
    that perform similar processes and provide protection.
  references:
  - 1. https://aws.amazon.com/macie/getting-started/
  - 2. https://docs.aws.amazon.com/workspaces/latest/adminguide/data-protection.html
  page_start: 126
  audit_raw: "Perform the following steps to determine if Macie is running:\nFrom Console:\n1. Login to the Macie console\
    \ at https://console.aws.amazon.com/macie/.\n2. In the left hand pane, click on By job under findings.\n3. Confirm that\
    \ you have a job set up for your S3 buckets.\nWhen you log into the Macie console, if you are not taken to the summary\
    \ page and do\nnot have a job set up and running, then refer to the remediation procedure below.\nIf you are using a third-party\
    \ tool to manage and protect your S3 data, you meet this\nrecommendation.\n Page 126"
  remediation: "Perform the steps below to enable and configure Amazon Macie:\nFrom Console:\n1. Log on to the Macie console\
    \ at\nhttps://console.aws.amazon.com/macie/.\n2. Click Get started.\n3. Click Enable Macie.\nSet up a repository for sensitive\
    \ data discovery results:\n1. In the left pane, under Settings, click Discovery results.\n2. Make sure Create bucket is\
    \ selected.\n3. Create a bucket and enter a name for it. The name must be unique across all S3\nbuckets, and it must start\
    \ with a lowercase letter or a number.\n4. Click Advanced.\n5. For block all public access, make sure Yes is selected.\n\
    6. For KMS encryption, specify the AWS KMS key that you want to use to encrypt\nthe results. The key must be a symmetric\
    \ customer master key (CMK) that is in\nthe same region as the S3 bucket.\n7. Click Save.\nCreate a job to discover sensitive\
    \ data:\n1. In the left pane, click S3 buckets. Macie displays a list of all the S3 buckets for\nyour account.\n2. Check\
    \ the box for each bucket that you want Macie to analyze as part of the job.\n3. Click Create job.\n4. Click Quick create.\n\
    5. For the Name and Description step, enter a name and, optionally, a description of\nthe job.\n6. Click Next.\n7. For\
    \ the Review and create step, click Submit.\nReview your findings:\n1. In the left pane, click Findings.\n2. To view the\
    \ details of a specific finding, choose any field other than the check\nbox for the finding.\n Page 127\nIf you are using\
    \ a third-party tool to manage and protect your S3 data, follow the vendor\ndocumentation for implementing and configuring\
    \ that tool."
  checks:
  - type: manual_review
    info: 'Perform the following steps to determine if Macie is running:

      From Console:

      1. Login to the Macie console at https://console.aws.amazon.com/macie/.

      2. In the left hand pane, click on By job under findings.

      3. Confirm that you have a job set up for your S3 buckets.

      When you log into the Macie console, if you are not taken to the summary page and do

      not have a job set up and running, then refer to the remediation procedure below.

      If you are using a third-party tool to manage and protect your S3 da'
    severity: medium
- id: 3.1.4
  title: Ensure that S3 is configured with 'Block Public Access' enabled
  scoring: scored
  profile:
  - Level 1
  description: Amazon S3 provides Block public access (bucket settings) and Block public access (account settings) to help
    you manage public access to Amazon S3 resources. By default, S3 buckets and objects are created with public access disabled.
    However, an IAM principal with sufficient S3 permissions can enable public access at the bucket and/or object level. While
    enabled, Block public access (bucket settings) prevents an individual bucket and its contained objects from becoming publicly
    accessible. Similarly, Block public access (account settings) prevents all buckets and their contained objects from becoming
    publicly accessible across the entire account.
  rationale: Amazon S3 Block public access (bucket settings) prevents the accidental or malicious public exposure of data
    contained within the respective bucket(s). Amazon S3 Block public access (account settings) prevents the accidental or
    malicious public exposure of data contained within all buckets of the respective AWS account. Whether to block public
    access to all or some buckets is an organizational decision that should be based on data sensitivity, least privilege,
    and use case.
  impact: When you apply Block Public Access settings to an account, the settings apply to all AWS regions globally. The settings
    may not take effect in all regions immediately or simultaneously, but they will eventually propagate to all regions. Page
    129
  references:
  - 1. https://docs.aws.amazon.com/AmazonS3/latest/user-guide/block-public-accessaccount.html
  - 2. NIST SP 800-53:rev5:AC-3
  page_start: 129
  audit_raw: "If utilizing Block Public Access (bucket settings)\nFrom Console:\n1. Login to the AWS Management Console and\
    \ open the Amazon S3 console using\nhttps://console.aws.amazon.com/s3/.\n2. Click Bucket name.\n3. Click on Permissions\
    \ tab and check \"Block public access (bucket settings)\".\n4. Ensure that the block public access settings are configured\
    \ appropriately for this\nbucket.\n5. Repeat for all the buckets in your AWS account.\nFrom Command Line:\n1. List all\
    \ of the S3 buckets:\naws s3 ls\n2. Find the public access settings for a specific bucket:\naws s3api get-public-access-block\
    \ --bucket <bucket-name>\nOutput if Block Public Access is enabled:\n{\n \"PublicAccessBlockConfiguration\": {\n \"BlockPublicAcls\"\
    : true,\n \"IgnorePublicAcls\": true,\n \"BlockPublicPolicy\": true,\n \"RestrictPublicBuckets\": true\n }\n}\nIf the\
    \ output reads false for the separate configuration settings, then proceed with the\nremediation.\nIf utilizing Block\
    \ Public Access (account settings)\nFrom Console:\n1. Login to the AWS Management Console and open the Amazon S3 console\
    \ using\nhttps://console.aws.amazon.com/s3/.\n2. Choose Block public access (account settings).\n3. Ensure that the block\
    \ public access settings are configured appropriately for your\nAWS account.\n Page 130\nFrom Command Line:\nTo check\
    \ the block public access settings for this account, run the following command:\naws s3control get-public-access-block\
    \ --account-id <account-id>\n--region <region-name>\nOutput if Block Public Access is enabled:\n{\n \"PublicAccessBlockConfiguration\"\
    : {\n \"IgnorePublicAcls\": true,\n \"BlockPublicPolicy\": true,\n \"BlockPublicAcls\": true,\n \"RestrictPublicBuckets\"\
    : true\n }\n}\nIf the output reads false for the separate configuration settings, then proceed with the\nremediation.\n\
    \ Page 131"
  remediation: "If utilizing Block Public Access (bucket settings)\nFrom Console:\n1. Login to the AWS Management Console\
    \ and open the Amazon S3 console using\nhttps://console.aws.amazon.com/s3/.\n2. Select the check box next to a bucket.\n\
    3. Click 'Edit public access settings'.\n4. Click 'Block all public access'\n5. Repeat for all the buckets in your AWS\
    \ account that contain sensitive data.\nFrom Command Line:\n1. List all of the S3 buckets:\naws s3 ls\n2. Enable Block\
    \ Public Access on a specific bucket:\naws s3api put-public-access-block --bucket <bucket-name> --public-access-blockconfiguration\n\
    \"BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBu\nckets=true\"\nIf utilizing Block\
    \ Public Access (account settings)\nFrom Console:\nIf the output reads true for the separate configuration settings, then\
    \ Block Public\nAccess is enabled on the account.\n1. Login to the AWS Management Console and open the Amazon S3 console\
    \ using\nhttps://console.aws.amazon.com/s3/.\n2. Click Block Public Access (account settings).\n3. Click Edit to change\
    \ the block public access settings for all the buckets in your\nAWS account.\n4. Update the settings and click Save.\n\
    5. When you're asked for confirmation, enter confirm. Then click Confirm to\nsave your changes.\nFrom Command Line:\n\
    To enable Block Public Access for this account, run the following command:\naws s3control put-public-access-block\n--public-access-block-configuration\
    \ BlockPublicAcls=true, IgnorePublicAcls=true,\nBlockPublicPolicy=true, RestrictPublicBuckets=true\n--account-id <account-id>\n\
    \ Page 132"
