- id: '4.8'
  title: Ensure that object-level logging for write events is enabled for S3 buckets
  scoring: scored
  profile:
  - Level 2
  description: S3 object-level API operations, such as GetObject, DeleteObject, and PutObject, are referred to as data events.
    By default, CloudTrail trails do not log data events, so it is recommended to enable object-level logging for S3 buckets.
  rationale: Enabling object-level logging will help you meet data compliance requirements within your organization, perform
    comprehensive security analyses, monitor specific patterns of user behavior in your AWS account, or take immediate actions
    on any object-level API activity within your S3 buckets using Amazon CloudWatch Events.
  impact: Enabling logging for these object-level events may significantly increase the number of events logged and may incur
    additional costs. Page 198
  references:
  - 1. https://docs.aws.amazon.com/AmazonS3/latest/user-guide/enable-cloudtrailevents.html
  - 2. NIST SP 800-53:rev5:AU-2 c
  page_start: 198
  audit_raw: "From Console:\n1. Login to the AWS Management Console and navigate to the CloudTrail\ndashboard at https://console.aws.amazon.com/cloudtrail/.\n\
    2. In the left panel, click Trails, and then click the name of the trail that you want\nto examine.\n3. Review General\
    \ details.\n4. Confirm that Multi-region trail is set to Yes.\n5. Scroll down to Data events and confirm the configuration:\n\
    • If advanced event selectors is being used, it should read:\nData Events: S3\nLog selector template\nLog all events\n\
    • If basic event selectors is being used, it should read:\nData events: S3\nBucket Name: All current and future S3 buckets\n\
    Write: Enabled\n6. Repeat steps 2-5 to verify that each trail has multi-region enabled and is\nconfigured to log data\
    \ events. If a trail does not have multi-region enabled and\ndata event logging configured, refer to the remediation steps.\n\
    From Command Line:\n1. Run the list-trails command to list all trails:\naws cloudtrail list-trails\n2. The command output\
    \ will be a list of trails:\n\"TrailARN\": \"arn:aws:cloudtrail:<region>:<account#>:trail/<trail-name>\",\n\"Name\": \"\
    <trail-name>\",\n\"HomeRegion\": \"<region>\"\n3. Run the get-trail command to determine whether a trail is a multi-region\
    \ trail:\naws cloudtrail get-trail --name <trail-name> --region <region-name>\n4. The command output should include: \"\
    IsMultiRegionTrail\": true.\n5. Run the get-event-selectors command, using the Name of the trail and the\nregion returned\
    \ in step 2, to determine if data event logging is configured:\naws cloudtrail get-event-selectors --region <home-region>\
    \ --trail-name <trail-name>\n--query EventSelectors[*].DataResources[]\n Page 199\n6. The command output should be an\
    \ array that includes the S3 bucket defined for\ndata event logging:\n\"Type\": \"AWS::S3::Object\",\n \"Values\": [\n\
    \ \"arn:aws:s3\"\n7. If the get-event-selectors command returns an empty array, data events\nare not included in the trail's\
    \ logging configuration; therefore, object-level API\noperations performed on S3 buckets within your AWS account are not\
    \ being\nrecorded.\n8. Repeat steps 1-7 to verify that each trail has multi-region enabled and is\nconfigured to log data\
    \ events. If a trail does not have multi-region enabled and\ndata event logging configured, refer to the remediation steps.\n\
    \ Page 200"
  remediation: 'From Console:

    1. Login to the AWS Management Console and navigate to the S3 dashboard at

    https://console.aws.amazon.com/s3/.

    2. In the left navigation panel, click buckets, and then click the name of the S3

    bucket you want to examine.

    3. Click the Properties tab to see the bucket configuration in detail.

    4. In the AWS CloudTrail data events section, select the trail name for

    recording activity. You can choose an existing trail or create a new one by

    clicking the Configure in CloudTrail button or navigating to the CloudTrail

    console.

    5. Once the trail is selected, select the Data Events check box.

    6. Select S3 from the Data event type drop-down.

    7. Select Log all events from the Log selector template drop-down.

    8. Repeat steps 2-7 to enable object-level logging of write events for other S3

    buckets.

    From Command Line:

    1. To enable object-level data events logging for S3 buckets within your AWS

    account, run the put-event-selectors command using the name of the trail

    that you want to reconfigure as identifier:

    aws cloudtrail put-event-selectors --region <region-name> --trail-name <trail-name>

    --event-selectors ''[{ "ReadWriteType": "WriteOnly", "IncludeManagementEvents":true,

