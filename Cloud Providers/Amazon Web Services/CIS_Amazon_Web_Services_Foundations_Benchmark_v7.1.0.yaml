- id: 7.2.5
  title: Ensure Amazon Bedrock guardrails filter sensitive information for workloads that handle personal data
  scoring: manual
  profile:
  - Level 2
  description: 'Ensure that every Amazon Bedrock guardrail serving a workload that processes personal or otherwise sensitive
    data configures a sensitive-information policy that detects and acts on that data in prompts and completions. A guardrail''s
    sensitiveinformation policy has two parts: a set of PII entities, each a built-in type (for example Email, Phone, Name,
    Social Security number, credit- or debit-card number, AWS access key) paired with an action of block or anonymize; and
    a set of customer-defined regex patterns, each with a name, a pattern, and an action, for organization-specific identifiers
    the built-in types do not cover. This recommendation applies to guardrails whose workloads handle personal data — customer
    support, document processing, retrieval over records that may contain identifiers, and similar. It requires that such
    a guardrail carry a sensitive-information policy covering the entity types relevant to the workload, each with an action
    of block or anonymize.'
  rationale: A workload that handles personal data can leak it in two ways. A user may include an identifier in a prompt.
    A model may also return one from the prompt, retrieved data, or training data. Without a sensitive-information policy,
    the guardrail allows this data through. It can then appear in logs, downstream systems, and user responses. This increases
    exposure of regulated data. Detecting these values at the guardrail, then blocking or anonymizing them, supports data-minimization
    requirements.
  impact: Sensitive-information filtering changes what the model receives or returns. Anonymize masks matched values before
    they reach the model or user. This can remove context the workload needs, such as when a support assistant must repeat
    a customer’s account number. Choose block or anonymize based on the entity and workload. Block rejects the full request
    when it detects a matched entity. This can disrupt normal workflows when the entity often appears in valid input. Broad
    regex patterns can also match harmless text and create false positives. Scope and test patterns against representative
    traffic. Page 360
  references:
  - 1. NIST SP 800-53:rev5:SC-7 (24)
  - '2. NIST CSF 2.0: PR.DS-02'
  page_start: 360
  audit_raw: "Pre-requisite: run this in each account and Region that operates Amazon Bedrock\nguardrails, and first identify\
    \ which guardrails serve workloads that handle personal or\nsensitive data — this recommendation applies to those. A guardrail\
    \ whose workload\nprovably handles no personal data is out of scope.\n1. Enumerate the guardrails in the Region:\naws\
    \ bedrock list-guardrails --region <region> --query\n'guardrails[].{id:id,name:name}' --output table\n2. For each in-scope\
    \ guardrail, retrieve the full definition for the version in use:\naws bedrock get-guardrail --region <region> --guardrail-identifier\
    \ <guardrail-id> -\n-guardrail-version <numeric-version-or-omit-for-DRAFT> --output json\nReview the returned sensitiveInformationPolicy\
    \ against the pass criteria. A guardrail\npasses this recommendation when all of the following hold:\n• A sensitiveInformationPolicy\
    \ is present. A guardrail with no such policy fails for\nan in-scope workload.\n• The piiEntities array covers the entity\
    \ types relevant to the workload's data, and\neach listed entity has an action of BLOCK or ANONYMIZE. An entity present\
    \ with\nno effective action, or a relevant type absent entirely, is a finding to review\nagainst the workload's data classification.\n\
    • Any organization-specific identifier the workload handles that no built-in type\ncovers is represented by a regex in\
    \ the regexes array, again with a BLOCK or\nANONYMIZE action.\nThe environment passes for the Region when every in-scope\
    \ guardrail covers the\npersonal-data types its workload handles with an effective action.\n Page 361"
  remediation: "Configure the guardrail's sensitive-information policy to cover the entity types the\nworkload handles.\n\
    1. Apply the sensitive-information policy. Substitute your guardrail ID; list the built-in\nPII types your workload handles\
    \ and any organization-specific regex patterns:\naws bedrock update-guardrail \\\n --region <region> \\\n --guardrail-identifier\
    \ <guardrail-id> \\\n --name <guardrail-name> \\\n --blocked-input-messaging \"<message shown when a prompt is blocked>\"\
    \ \\\n --blocked-outputs-messaging \"<message shown when a response is blocked>\" \\\n --sensitive-information-policy-config\
    \ '{\n \"piiEntitiesConfig\": [\n {\"type\":\"EMAIL\",\"action\":\"ANONYMIZE\"},\n {\"type\":\"PHONE\",\"action\":\"ANONYMIZE\"\
    },\n {\"type\":\"NAME\",\"action\":\"ANONYMIZE\"},\n {\"type\":\"US_SOCIAL_SECURITY_NUMBER\",\"action\":\"BLOCK\"},\n\
    \ {\"type\":\"CREDIT_DEBIT_CARD_NUMBER\",\"action\":\"BLOCK\"}\n ],\n \"regexesConfig\": [\n {\"name\":\"internal-account-id\"\
    ,\"pattern\":\"ACCT-[0-9]{8}\",\"action\":\"ANONYMIZE\"}\n ]\n }'\nConfigurable options:\n• Entity list — choose the built-in\
    \ PII types that match your workload's data. The\navailable types are listed in the guardrails sensitive-information documentation;\n\
    include only those the workload can encounter to limit false positives.\n• Action per entity — BLOCK rejects the whole\
    \ request when the entity is detected;\nANONYMIZE masks the matched value and lets the request proceed. Choose\nper entity:\
    \ block for data that must never appear, anonymize where the workload\ncan operate on masked values.\n• Regex patterns\
    \ — add a named pattern for each organization-specific identifier\nnot covered by a built-in type. Scope patterns tightly\
    \ and test them against\nrepresentative traffic to avoid matching benign text.\nNote: supplying the sensitive-information\
    \ policy on an UpdateGuardrail call does not\nalter the content or contextual-grounding policies, but any entity or regex\
    \ omitted from\nthis policy block is removed — provide the complete set the guardrail should carry."
