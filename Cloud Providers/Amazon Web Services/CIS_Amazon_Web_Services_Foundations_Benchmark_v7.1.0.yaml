    \ details.\n4. Confirm that Multi-region trail is set to Yes\n5. Scroll down to Data events\n6. Scroll down to Data events\
    \ and confirm the configuration:\n• If advanced event selectors is being used, it should read:\nData Events: S3\nLog selector\
    \ template\nLog all events\n• If basic event selectors is being used, it should read:\nData events: S3\nBucket Name: All\
    \ current and future S3 buckets\nRead: Enabled\n6. Repeat steps 2-5 to verify that each trail has multi-region enabled\
    \ and is\nconfigured to log data events. If a trail does not have multi-region enabled and\ndata event logging configured,\
    \ refer to the remediation steps.\nFrom Command Line:\n1. Run the describe-trails command to list all trail names:\naws\
    \ cloudtrail describe-trails --region <region-name> --output table --query\ntrailList[*].Name\n2. The command output will\
