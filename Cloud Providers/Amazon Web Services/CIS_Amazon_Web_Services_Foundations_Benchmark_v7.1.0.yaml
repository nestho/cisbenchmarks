- id: '6.2'
  title: Ensure no Network ACLs allow ingress from 0.0.0.0/0 to remote server administration ports
  scoring: scored
  profile:
  - Level 1
  description: The Network Access Control List (NACL) function provides stateless filtering of ingress and egress network
    traffic to AWS resources. It is recommended that no NACL allows unrestricted ingress access to remote server administration
    ports, such as SSH on port 22 and RDP on port 3389, using either the TCP (6), UDP (17), or ALL (-1) protocols.
  rationale: Public access to remote server administration ports, such as 22 (when used for SSH, not SFTP) and 3389, increases
    the attack surface of resources and unnecessarily raises the risk of resource compromise.
  impact: ''
  references:
  - 1. https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html
  - 2. https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Security.html#VPC_Sec
  page_start: 299
  audit_raw: "From Console:\nPerform the following steps to determine if the account is configured as prescribed:\n1. Login\
    \ to the AWS VPC Console at https://console.aws.amazon.com/vpc/home.\n2. In the left pane, click Network ACLs.\n3. For\
    \ each network ACL, check whether it is associated with one or more subnets.\n4. If it is associated, proceed to Step\
    \ 5\n5. If it is not associated, you may still review the rules, but note it has no effect until\nattached\n6. Select\
    \ the network ACL\n7. Click the Inbound Rules tab\n8. Ensure that no rule exists which has a port range that includes\
    \ port 22 or 3389,\nuses the protocols TCP (6), UDP (17), or ALL (-1), or other remote server\nadministration ports for\
    \ your environment, has a Source of 0.0.0.0/0, and shows\nALLOW\nNote:\n• A port value of ALL or a port range such as\
    \ 0-3389 includes port 22, 3389, and\npotentially other remote server administration ports\n• An effective ruleset that\
    \ explicitly DENIES access to these ports (e.g., a DENY\nrule for ports 22 and 3389 from 0.0.0.0/0 placed before a broader\
    \ ALLOW rule\nsuch as ANY/ANY) is considered acceptable, as NACLs are evaluated in order\nand the DENY rule will take\
    \ precedence\n Page 299"
  remediation: 'From Console:

    Perform the following steps to remediate a network ACL:

    1. Login to the AWS VPC Console at https://console.aws.amazon.com/vpc/home.

    2. In the left pane, click Network ACLs.

    3. For each network ACL that needs remediation, perform the following:

    4. Select the network ACL.

    5. Click the Inbound Rules tab.

    6. Click Edit inbound rules.

    7. Either A) update the Source field to a range other than 0.0.0.0/0 B) click Delete

    to remove the offending inbound rule or C) Add an explicit DENY rule for the

    affected ports (e.g., 22, 3389) from 0.0.0.0/0 with a lower rule number than any

    broader ALLOW rule

    8. Click Save'
  checks:
  - type: manual_review
    info: 'From Console:

      Perform the following steps to determine if the account is configured as prescribed:

      1. Login to the AWS VPC Console at https://console.aws.amazon.com/vpc/home.

      2. In the left pane, click Network ACLs.

