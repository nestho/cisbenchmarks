      provably handles no personal data is out of scope.

      1. Enumerate the guardrails in the Region:

      aws bedrock list-guardrails --region <region> --query

      ''guardrails[].{id:id,name:name}'' --output table

      2. For each in-scope guardrail, retrieve the full defi'
    severity: medium
- id: 7.2.6
  title: Ensure Bedrock guardrails serving retrieval-augmented workloads applies contextual grounding checks
  scoring: manual
  profile:
  - Level 2
  description: 'Ensure that every Amazon Bedrock guardrail serving a retrieval-augmented (RAG) or source-grounded workload
    configures a contextual grounding policy that checks whether the model''s response is supported by the provided source
    material and is relevant to the user''s query. A guardrail''s contextual grounding policy holds up to two filters: Grounding,
    which scores how well the response is grounded in the reference source passed with the request, and Relevance, which scores
    how well the response addresses the user''s query. Each filter carries a threshold between 0 and 1; a response whose score
    falls below the threshold is blocked. Contextual grounding only takes effect when the caller passes reference source content
    in the request, so this recommendation applies to guardrails serving workloads that supply such context — knowledge-base-backed
    agents, RAG applications, and document-question-answering flows. It requires that such a guardrail carry both grounding
    and relevance filters set to organization-approved thresholds.'
  rationale: 'A retrieval-augmented workload''s central risk is that the model answers from something other than the retrieved
    source — inventing facts, drifting off the question, or presenting unsupported claims as grounded — which is exactly the
    failure users are least equipped to catch, because the answer looks authoritative and cites a real workflow. Contextual
    grounding is the guardrail''s in-band defense against this: the grounding filter blocks responses that the provided source
    does not support, and the relevance filter blocks responses that do not address the query. Together they keep a source-grounded
    assistant from confidently returning fabricated or off-topic content. No other control detects this at inference time;
    without the policy, an ungrounded answer is returned to the user with no signal that it is unsupported.'
  impact: Grounding and relevance thresholds are a direct tradeoff between hallucination protection and false rejections.
    A high threshold blocks more unsupported responses but also rejects some correct answers whose phrasing diverges from
    the source, which can degrade the assistant's usefulness and frustrate users; too low a threshold lets ungrounded content
    through. The right values are workload-specific and found by testing against representative queries and sources, then
    tuned over time. Page 364
  references:
  - 1. NIST SP 800-53:rev5:SI-15
  - '2. NIST CSF 2.0: PR.DS'
  page_start: 364
  audit_raw: "Pre-requisite: run this in each account and Region that operates Amazon Bedrock\nguardrails, and first identify\
    \ which guardrails serve retrieval-augmented or sourcegrounded workloads — this recommendation applies to those. A guardrail\
    \ whose\nworkload passes no reference source is out of scope.\n1. Enumerate the guardrails in the Region:\naws bedrock\
    \ list-guardrails --region <region> --query\n'guardrails[].{id:id,name:name}' --output table\n2. For each in-scope guardrail,\
    \ retrieve the full definition for the version in use:\naws bedrock get-guardrail --region <region> --guardrail-identifier\
    \ <guardrail-id> -\n-guardrail-version <numeric-version-or-omit-for-DRAFT> --output json\nReview the returned contextualGroundingPolicy.filters\
    \ array against the pass criteria. A\nguardrail passes this recommendation when all of the following hold:\n• A contextualGroundingPolicy\
    \ is present with a non-empty filters array. A guardrail\nwith no such policy fails for an in-scope workload.\n• A Grounding\
    \ filter is present with a threshold greater than 0 and at or above the\norganization-approved minimum. A threshold of\
    \ 0 disables the check and fails.\n• A Relevance filter is present with a threshold greater than 0 and at or above the\n\
    organization-approved minimum.\nThe grounding and relevance filters carry a type and a threshold only; there is no\nseparate\
    \ enabled or action field to check — a filter present with a non-zero threshold is\nactive. The environment passes for\
    \ the Region when every in-scope guardrail carries\nboth filters at approved thresholds.\n Page 365"
  remediation: "Configure the guardrail's contextual grounding policy with grounding and relevance\nthresholds.\n1. Apply\
    \ the contextual grounding policy. Substitute your guardrail ID and set each\nthreshold to your organization-approved\
    \ value:\naws bedrock update-guardrail \\\n --region <region> \\\n --guardrail-identifier <guardrail-id> \\\n --name <guardrail-name>\
    \ \\\n --blocked-input-messaging \"<message shown when a prompt is blocked>\" \\\n --blocked-outputs-messaging \"<message\
    \ shown when a response is blocked>\" \\\n --contextual-grounding-policy-config '{\n \"filtersConfig\": [\n {\"type\"\
    :\"GROUNDING\",\"threshold\":0.75},\n {\"type\":\"RELEVANCE\",\"threshold\":0.75}\n ]\n }'\nConfigurable options:\n• Threshold\
    \ — a value from 0 to 1 for each filter. Do not set 0, which disables the\ncheck."
