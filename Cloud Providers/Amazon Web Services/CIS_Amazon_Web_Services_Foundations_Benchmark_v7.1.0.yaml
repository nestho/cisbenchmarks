- id: '4.3'
  title: Ensure AWS Config is enabled in all regions
  scoring: scored
  profile:
  - Level 2
  description: AWS Config is a web service that performs configuration management of supported AWS resources within your account
    and delivers log files to you. The recorded information includes the configuration items (AWS resources), relationships
    between configuration items (AWS resources), and any configuration changes between resources. It is recommended that AWS
    Config be enabled in all regions. In environments using AWS Control Tower or Landing Zone Accelerator (LZA), AWS Config
    may be centrally managed and automatically enabled across regions.
  rationale: The AWS configuration item history captured by AWS Config enables security analysis, resource change tracking,
    and compliance auditing.
  impact: Enabling AWS Config in all regions provides comprehensive visibility into resource configurations, enhancing security
    and compliance monitoring. However, this may incur additional costs and require proper configuration management. Page
    174
  references:
  - 1. CCE-78917-2
  - 2. https://awscli.amazonaws.com/v2/documentation/api/latest/reference/configservic
  page_start: 174
  audit_raw: "Process to evaluate AWS Config configuration per region:\nFrom Console:\n1. Sign in to the AWS Management Console\
    \ and open the AWS Config console at\nhttps://console.aws.amazon.com/config/.\n2. On the top right of the console select\
    \ the target region.\n3. If a Config Recorder is enabled in this region, you should navigate to the Settings\npage from\
    \ the navigation menu on the left-hand side. If a Config Recorder is not\nyet enabled in this region, proceed to the remediation\
    \ steps.\n4. Ensure \"Record all resources supported in this region\" is checked.\n5. Ensure \"Include global resources\
    \ (e.g., AWS IAM resources)\" is checked, unless\nit is enabled in another region (this is only required in one region).\n\
    6. Ensure the correct S3 bucket has been defined.\n7. Ensure the correct SNS topic has been defined.\n8. Repeat steps\
    \ 2 to 7 for each region.\nNote: In environments using AWS Control Tower or Landing Zone Accelerator (LZA),\nAWS Config\
    \ configuration may be managed centrally. Verify that AWS Config is\nenabled and recording through the centralized governance\
    \ solution.\nFrom Command Line:\n1. Run this command to show all AWS Config Recorders and their properties:\naws configservice\
    \ describe-configuration-recorders\n2. Evaluate the output to ensure that all recorders have a recordingGroup object\n\
    which includes \"allSupported\": true. Additionally, ensure that at least one\nrecorder has \"includeGlobalResourceTypes\"\
    : true.\nNote: There is one more parameter, \"ResourceTypes,\" in the recordingGroup object.\nWe don't need to check it,\
    \ as whenever we set \"allSupported\" to true, AWS enforces the\nresource types to be empty (\"ResourceTypes\": []).\n\
