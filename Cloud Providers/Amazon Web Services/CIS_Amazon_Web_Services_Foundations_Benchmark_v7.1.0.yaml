- id: 7.3.1
  title: Ensure Amazon Bedrock resources have encryption at rest with appropriate key management
  scoring: manual
  profile:
  - Level 2
  description: 'Amazon Bedrock encrypts every resource it stores at rest by default, using an AWSowned KMS key that AWS manages
    entirely. While this provides encryption at rest out of the box, many organizations are unaware this is the default or
    assume a customer managed key is in use when it is not. This recommendation ensures encryption at rest is explicitly configured
    and verified and that the choice between AWS-owned default key or a customer-managed KMS key is a deliberate decision
    rather than an assumption. The choice is made per resource and per Region, at creation time. When you create a Bedrock
    resource you may supply a KMS key ARN; if you supply none, the resource is encrypted with the AWS-owned default key, giving
    you no view into key usage and no control over the key lifecycle. This applies to the Bedrock resource types that accept
    a customer-specified key: guardrails, agents, flows, prompts, custom model customization jobs, model import jobs, evaluation
    jobs, automated reasoning policies, and Amazon Bedrock AgentCore memory stores and gateways.'
  rationale: 'Because Bedrock encrypts at rest by default, the risk this recommendation addresses is not missing encryption
    but misplaced assumptions about who controls the key. The AWS-owned default key is managed entirely by AWS: there is no
    customer-visible key policy, no control over rotation, and no CloudTrail audit trail of when the key is used to decrypt
    your data. A customer-managed KMS key gives the organization its own key policy over the data, control of the key lifecycle,
    and a CloudTrail record of every cryptographic operation — so it can review, restrict, or revoke the ability to decrypt
    a resource''s data independently of the IAM permissions on the resource itself. Amazon Bedrock resources persist proprietary
    and potentially sensitive material such as prompts store reusable instructions and guardrails store safety-policy definitions
    — so where that data is regulated or classified, demonstrable control over the encryption key is often the actual compliance
    requirement; frameworks such as PCI DSS and GLBA expect the organization to show it controls the keys protecting sensitive
    data. Page 368'
  impact: 'A customer-managed KMS key carries a recurring cost per key plus per-request charges for encrypt and decrypt operations,
    so moving a high-throughput resource onto one has a measurable cost that is weighed against the visibility and control
    it buys. The key policy must also be designed with care: applications, users, and the Bedrock service role that legitimately
    need the data must be granted the operations to generate a data key, decrypt, and describe the key, or they are locked
    out, and a missing grant surfaces as a resource-creation or invocation failure rather than a silent fallback.'
  references:
  - 1. NIST SP 800-53:rev5:SA-9 (6)
  - '2. NIST CSF 2.0: PR.DS-01'
  page_start: 368
  audit_raw: "Pre-requisite: run these checks in each AWS account and Region where Amazon\nBedrock resources are operated,\
    \ an account with no resources of a given type has\nnothing to check for that type. The check is the same for every Bedrock\
    \ resource type:\nretrieve the resource and read its encryption field, then determine which kind of key\nprotects it.\
    \ The steps below use guardrails as the worked example.\n1. List the guardrails in the Region:\naws bedrock list-guardrails\
    \ --region <region>\nEach entry under guardrails has an id. If the list is empty, this resource type does not\napply in\
    \ the Region.\n2. For each guardrail, retrieve it and read the encryption field:\naws bedrock get-guardrail --region <region>\
    \ --guardrail-identifier <guardrail-id>\nRead kmsKeyArn. If it is null or absent, the guardrail is on the AWS-owned default\
    \ key.\nIf a key ARN is present, the guardrail is encrypted with a KMS key you specified.\n3. Where a key ARN is present\
    \ and your classification calls for a customermanaged key, confirm the key is in fact customer-managed rather than an\
    \ AWSmanaged key by describing it:\naws kms describe-key --region <region> --key-id <kms-key-arn>\nIn the response, KeyMetadata.KeyManager\
    \ reads CUSTOMER for a customermanaged key and AWS for an AWS-managed key. For a resource required to use a\ncustomer-managed\
    \ key, also review that key's policy to confirm access is scoped to the\nspecific principals that need it rather than\
    \ granted broadly.\n Page 369"
  remediation: "Remediation moves an in-scope resource onto a customer-managed KMS key.\nGuardrails can be encrypted in place;\
    \ other type of bedrock resources may need to be\nrecreated with the key specified, because the key is maybe fixed at\
    \ creation time and\nexisting data is not re-encrypted automatically.\n1. Create or identify a customer-managed KMS key,\
    \ with a key policy that restricts\nuse to the specific IAM principals and the Bedrock service role that require it:\n\
    aws kms create-key --region <region> --key-usage ENCRYPT_DECRYPT --key-spec\nSYMMETRIC_DEFAULT --description \"Bedrock\
    \ resource encryption key\"\nNote the key ARN from the response.\n2. For a guardrail, update it in place. One caveat drives\
    \ the call: update-guardrail\nreplaces the guardrail's entire configuration rather than patching one field, so the\nrequest\
    \ must re-supply the existing name, messaging, and policy settings\nalongside the key, or those settings are cleared.\
    \ Retrieve the current\nconfiguration first:\naws bedrock get-guardrail --region <region> --guardrail-identifier <guardrail-id>\n\
    Then apply the key with the existing settings:\naws bedrock update-guardrail --region <region> \\\n --guardrail-identifier\
    \ <guardrail-id> \\\n --name <current-name> \\\n --blocked-input-messaging \"<current-blocked-input-message>\" \\\n --blocked-outputs-messaging\
    \ \"<current-blocked-outputs-message>\" \\\n --content-policy-config <current-content-policy> \\\n --kms-key-id <key-arn>"
  checks:
  - type: manual_review
    info: 'Pre-requisite: run these checks in each AWS account and Region where Amazon

      Bedrock resources are operated, an account with no resources of a given type has

      nothing to check for that type. The check is the same for every Bedrock resource type:

      retrieve the resource and read its encryption field, then determine which kind of key

      protects it. The steps below use guardrails as the worked example.

      1. List the guardrails in the Region:

      aws bedrock list-guardrails --region <region>

      Each entry under gu'
    severity: medium
- id: 7.3.2
  title: Ensure Amazon Bedrock account data retention matches the workload's data sensitivity
  scoring: manual
  profile:
  - Level 2
  description: 'Amazon Bedrock provides a data retention mode that governs whether the inputs and outputs of inference requests
    are retained by AWS after a request completes and whether they could be shared with the third-party model provider. A
    model is invocable only when the account''s effective mode is at or above the minimum the model requires; each model publishes
    the modes that satisfy it in an allowed_modes list, and a model whose requirement is not met reports status unavailable
    and its invocations are blocked. The mode is set per account and per Region through the control-plane PutAccountDataRetention
    API and read back with GetAccountDataRetention. It resolves to one of five values: • none — zero data retention. AWS writes
    no request inputs or outputs to durable storage and shares nothing with any model provider. • default — each model''s
    own retention policy applies. For most models this is zero retention, but for the models AWS subjects to automated abuse
    detection, inputs and outputs are retained within the AWS boundary for up to 30 days for AWS''s own safety review. Nothing
    is shared with the model provider. • aws_review — inputs and outputs are retained (up to 30 days) and may be read by AWS
    staff for human review, entirely within the AWS boundary. Some model providers require this human-review permission as
    a condition of access to their models. The provider does not receive the content. • provider_data_share — a legacy mode.
    Despite the name, Amazon Bedrock does not share content with model providers today, so this mode behaves like aws_review,
    and AWS recommends new configurations use aws_review instead. It remains the most permissive value. • inherit — express
    no opinion at this scope and defer to a broader scope. This is the default for a new account. This recommendation requires
    the account-wide mode to be none for accounts whose workloads process sensitive data, and permits a more retentive mode
    only where a specific business need — a specific model that mandates retention — is documented and approved. Page 371'
  rationale: 'Inference requests can carry sensitive prompt content — records retrieved from a knowledge base, source code
    under review, confidential context assembled by an agent — and responses inherit that sensitivity. The retention mode
    decides whether AWS keeps a copy after the request completes. Setting the account to none guarantees zero retention; any
    higher mode extends the data-handling boundary beyond the request''s original purpose — default retains inputs and outputs
    for up to 30 days for abusedetection models, and aws_review additionally lets AWS staff read them — in both cases creating
    a footprint, inside the AWS boundary, that the customer does not directly control. Leaving the account at inherit is not
    a safe default for a sensitive workload: it enforces nothing and lets each model''s own policy decide, so a model that
    defaults to retention silently retains. Affirmatively setting none — rather than relying on model defaults — is what makes
    zero data retention a property of the account rather than an accident of which models happen to be called. For workloads
    that are not sensitive, default is an acceptable posture; the requirement is that the mode be a deliberate match to the
    data the workload handles, not that every account be forced to none regardless of need.'
  impact: 'Setting the mode to none makes unavailable every model that requires retention as a condition of access. An account
    that genuinely needs one of these models has two paths that preserve a restrictive posture elsewhere: negotiate a zero-data-retention
    agreement with the AWS account team for the specific model — which adds none to that model''s satisfying modes for the
    approved account or set a more permissive mode narrowly, ideally on a dedicated project rather than account-wide. The
    setting is per Region, so a consistent posture requires applying it in every Region where the account invokes models.
    Changing the mode has no effect on data already retained and does not disrupt in-flight requests to models that remain
    available. Page 372'
  references:
  - 1. NIST SP 800-53:rev5:SI-12
  - '2. NIST CSF 2.0: PR.DS-01'
  page_start: 371
  audit_raw: "Pre-requisite: run these commands in each AWS account that invokes Amazon\nBedrock, and in each Region where\
    \ inference is invoked — the setting is per Region.\n1. Read the account data retention mode for the Region:\naws bedrock\
    \ get-account-data-retention --region <region>\nAn account that has never set the mode returns only the inherit value,\
    \ with no\ntimestamp:\n{\n \"mode\": \"inherit\"\n}\nAn account that has set the mode returns the value and the time it\
    \ was last changed:\n{\n \"mode\": \"none\",\n \"updatedAt\": \"2026-09-03T22:21:33.394000+00:00\"\n}\nInterpret the mode\
    \ against the sensitivity of the workloads in the account:\n• none — zero data retention. Passes.\n• default — AWS may\
    \ retain inputs and outputs for up to 30 days for the models\nsubject to abuse detection. A finding for a sensitive workload\
    \ unless documented\napproval, identifying the specific models that require it, is on file. Acceptable for a\nworkload\
    \ classified as non-sensitive.\n• aws_review or provider_data_share — AWS retains inputs and outputs and may\nreview them.\
    \ A finding unless documented approval identifying the specific\nhuman-review-required models is on file.\n• inherit —\
    \ the account enforces nothing and effective behavior falls through to\neach model's own default. A finding for a sensitive\
    \ workload, because it does not\naffirmatively enforce zero data retention.\n2. If the account uses Bedrock projects (the\
    \ Bedrock API-key interface), a projectlevel mode overrides the account mode for that project's traffic. Enumerate the\n\
    projects and confirm none sets a mode more permissive than the account\nposture permits.\nThe environment passes this\
    \ recommendation for the Region when the effective mode\nfor every workload is none, or when a more retentive mode is\
    \ documented and\napproved for a specific, named set of models that require it and the workloads in scope\nare classified\
    \ as tolerating that mode.\n Page 373"
  remediation: "1. Set the account mode to none:\naws bedrock put-account-data-retention --region <region> --mode none\nThe\
    \ response echoes the new mode and the update time:\n{\n \"mode\": \"none\",\n \"updatedAt\": \"2026-09-03T22:21:33.394000+00:00\"\
    \n}\nRepeat in every Region where the account invokes Amazon Bedrock."
  checks:
  - type: manual_review
    info: "Pre-requisite: run these commands in each AWS account that invokes Amazon\nBedrock, and in each Region where inference\
      \ is invoked — the setting is per Region.\n1. Read the account data retention mode for the Region:\naws bedrock get-account-data-retention\
      \ --region <region>\nAn account that has never set the mode returns only the inherit value, with no\ntimestamp:\n{\n\
      \ \"mode\": \"inherit\"\n}\nAn account that has set the mode returns the value and the time it was last changed:\n{\n\
      \ \"mode\": \"none\",\n \"updatedAt\""
    severity: medium
- id: 7.4.1
  title: Ensure CloudTrail captures Amazon Bedrock data-plane events
  scoring: scored
  profile:
  - Level 2
  description: Ensure that Amazon Bedrock data-plane activity is captured in AWS CloudTrail. AWS classifies a subset of Bedrock
    runtime operations, including agent invocations, knowledge base retrievals, prompt flow executions, and asynchronous inference,
    as CloudTrail data events, which are not recorded by default. Data-event capture is enabled per Bedrock resource type
    via an advanced event selector on a CloudTrail trail. AWS periodically adds new Bedrock resource types to CloudTrail as
    new Bedrock features become generally available; refer to the AWS Bedrock CloudTrail integration documentation for the
    current authoritative list of Bedrock data-event resource types and the specific API operations each covers.
  rationale: 'Bedrock data events are the only account-side record of who used a knowledge base, agent, or prompt flow, and
    when. With data-event capture turned off, this activity is invisible in CloudTrail: management-event logging records Bedrock
    configuration changes and direct model calls, but not these data-plane operations. A user acting outside policy, or an
    attacker using a compromised principal, could drive an agent to act on external systems, pull sensitive documents from
    a knowledge base, or run a prompt flow, and leave no trace of the invocation.'
  impact: Bedrock data-plane events are billed per event and their payloads are retained in S3 alongside other CloudTrail
    data, so enabling capture on a high-traffic Bedrock workload can measurably increase logging cost and the volume that
    downstream log consumers such as SIEM must process. Operators should enable coverage only for the Bedrock resource types
    actually in use in the account and can further narrow high-volume categories to specific operations or specific resource
    ARNs where cost is a concern. Enabling data-plane capture is also typically applied to an existing CloudTrail trail that
    already carries management-event or other data-event logging for the account; teams may need to coordinate the change
    with the trail's owner (often a central security or platform team) to preserve existing logging configuration and to review
    the resulting change in log volume before rolling the recommendation out broadly. Page 376
  references:
  - 1. https://docs.aws.amazon.com/awscloudtrail/latest/userguide/logging-data-eventswith-cloudtrail.html#logging-data-events-advanced
  - 2. https://docs.aws.amazon.com/bedrock/latest/userguide/logging-usingcloudtrail.html
  page_start: 376
  audit_raw: "Pre-requisite: run these CLI commands in each AWS account that operates Amazon\nBedrock resources or whose principals\
    \ invoke the Amazon Bedrock APIs. If the account\nhas a multi-region CloudTrail trail, one inspection covers every region;\
    \ if only singleregion trails exist, repeat the inspection in each region where Bedrock resources are\noperated.\n1. List\
    \ all trails visible from the region, including multi-region shadow trails, and note\nwhich are multi-region:\naws cloudtrail\
    \ describe-trails --region <region> --include-shadow-trails --query\n'trailList[].{Name:Name, ARN:TrailARN, HomeRegion:HomeRegion,\n\
    MultiRegion:IsMultiRegionTrail}' --output table\nIf the list is empty, the region has no trails and this recommendation\
    \ fails. Record the\ntrails to inspect. If at least one trail is multi-region, inspecting that single trail covers all\n\
    regions.\n2. For each trail, confirm it is actively logging:\naws cloudtrail get-trail-status --region <region> --name\
    \ <trail-name-or-arn> --\nquery 'IsLogging'\nA trail that returns false is stopped and cannot satisfy this recommendation\
    \ regardless\nof its selector configuration.\n3. For each trail, retrieve its event selectors and review the response:\n\
    aws cloudtrail get-event-selectors --region <region> --trail-name <trail-name-orarn>\nReview the returned JSON as follows:\n\
    • If the response contains only an EventSelectors field and no\nAdvancedEventSelectors field, the trail is using basic\
    \ event selectors. Basic\nselectors cannot reference the AWS::Bedrock namespace — they support only\nthe S3 object, Lambda\
    \ function, and DynamoDB table data resource types — so\nthe trail cannot capture Bedrock data events. This trail fails\
    \ this recommendation.\n• If the response contains an AdvancedEventSelectors field, examine each entry's\nfield selectors.\
    \ A Bedrock data-plane selector sets the eventCategory field to\nData in one clause and the resources.type field to a\
    \ Bedrock resource type value\n— any value in the AWS::Bedrock namespace, for example\nAWS::Bedrock::AgentAlias, AWS::Bedrock::KnowledgeBase,\
    \ or\nAWS::Bedrock::FlowAlias. Confirm at least one such selector exists. Refer to the\nAWS Bedrock CloudTrail integration\
    \ page for the current authoritative list of\nBedrock resource type values accepted by CloudTrail.\n Page 377\n4. Using\
    \ the account's own inventory of Bedrock resources in use, confirm that\nevery Bedrock resource type in use is covered\
    \ by an advanced event selector on\nthe trail. A selector for AWS::Bedrock::AgentAlias but no selector for\nAWS::Bedrock::KnowledgeBase\
    \ leaves knowledge-base retrieval unlogged even\nthough knowledge bases are operated in the account.\nThe environment\
    \ passes this recommendation if:\n• At least one trail visible from the region is actively logging (IsLogging is true),\
    \ and\n• That trail carries an advanced event selector with eventCategory set to Data and\nresources.type set to a Bedrock\
    \ data-plane resource type, and\n• Every Bedrock resource type in use in the account has a corresponding\nadvanced event\
    \ selector on that trail.\n Page 378"
  remediation: "Add a Bedrock data-event selector to a CloudTrail trail. The example uses knowledge\nbase retrieval (AWS::Bedrock::KnowledgeBase);\
    \ covering any other Bedrock resource\ntype follows the same steps, changing only the resources.type value.\nOne caveat\
    \ drives the procedure: put-event-selectors overwrites a trail's entire selector\nconfiguration in a single call — it\
    \ does not append. The payload you submit must\ntherefore include the trail's existing selectors alongside the new Bedrock\
    \ selector;\nsubmitting the Bedrock selector on its own would drop the logging the trail already\nperforms.\n1. If the\
    \ account has no trail, create a multi-region trail and start logging:\naws cloudtrail create-trail --region <region>\
    \ --name <trail-name> --s3-bucket-name\n<cloudtrail-s3-bucket> --is-multi-region-trail --include-global-service-events\
    \ --\nenable-log-file-validation\naws cloudtrail start-logging --region <region> --name <trail-name>\n2. Retrieve the\
    \ trail's current selectors so you can preserve them:\naws cloudtrail get-event-selectors --region <region> --trail-name\
    \ <trail-name-orarn>\n3. Build the payload by adding one Bedrock data-event selector to the trail's existing\nselectors,\
    \ and save it as selectors.json. In the example below the first block\npreserves all-management-event logging and the\
    \ second is the Bedrock selector\nbeing added:\n[\n { \"Name\": \"Log all management events\",\n \"FieldSelectors\": [\
    \ { \"Field\": \"eventCategory\", \"Equals\": [\"Management\"] } ] },\n { \"Name\": \"Bedrock KnowledgeBase data events\"\
    ,\n \"FieldSelectors\": [\n { \"Field\": \"eventCategory\", \"Equals\": [\"Data\"] },\n { \"Field\": \"resources.type\"\
    , \"Equals\": [\"AWS::Bedrock::KnowledgeBase\"] }\n ] }\n]\nA trail uses either advanced or basic event selectors, not\
    \ both. If the trail currently uses\nbasic selectors, re-express its existing logging as advanced selectors in this same\n\
    payload — the first block above (Log all management events) is the advanced-selector\nequivalent of basic all-management-event\
    \ logging.\n4. Apply the payload:\naws cloudtrail put-event-selectors --region <region> --trail-name <trail-name-orarn>\
    \ --advanced-event-selectors file://selectors.json\n Page 379\n5. To cover another Bedrock resource type in use in the\
    \ account, follow the same\nprocess: add another block of the identical shape to the payload, changing only\nthe resources.type\
    \ value, and re-apply. CloudTrail validates resources.type when\nthe selectors are applied and rejects any value it does\
    \ not recognize, so use the\nexact resource type strings from the integration page."
  checks:
  - type: manual_review
    info: 'Pre-requisite: run these CLI commands in each AWS account that operates Amazon

      Bedrock resources or whose principals invoke the Amazon Bedrock APIs. If the account

      has a multi-region CloudTrail trail, one inspection covers every region; if only singleregion trails exist, repeat the
      inspection in each region where Bedrock resources are

      operated.

      1. List all trails visible from the region, including multi-region shadow trails, and note

      which are multi-region:

      aws cloudtrail describe-trails --regio'
    severity: medium
- id: 7.4.2
  title: Ensure Amazon Bedrock model invocation logging is enabled in every operational Region
  scoring: scored
  profile:
  - Level 2
  description: 'Ensure that Amazon Bedrock model invocation logging is explicitly enabled in every AWS Region in which the
    account invokes Bedrock foundation models. Model invocation logging captures the full request data, response data, and
    metadata for the bedrock-runtime operations that AWS supports — Converse, ConverseStream, InvokeModel, and InvokeModelWithResponseStream
    — and delivers each record to a destination you configure. Two destination types are supported: an Amazon CloudWatch Logs
    log group and/or an Amazon S3 bucket; at least one must be configured, and both may be used together. Logging is enabled
    through the PutModelInvocationLoggingConfiguration API (or the Bedrock console Settings page) by supplying a logging configuration
    that names at least one destination and sets the per-modality delivery flags relevant to the workload — for text, image,
    embedding, and video — to true.'
  rationale: 'Without invocation logging there is no record of which models were invoked, with what inputs, or what they returned.
    This coverage is not provided by any other logging control: CloudTrail records the API activity envelope — who called,
    when, and from where — but never the prompt or the completion body. Model invocation logging is therefore the only source
    of the content of the direct model call and its response. Enabling it establishes that evidence layer: it lets investigators
    attribute a call to a principal, reconstruct the exact request and response, and monitor invocation volume and content
    for anomaly detection, insider-risk review, and compliance attestation. Because logging is disabled by default and set
    independently in each Region, a Region that is silently unconfigured — or a configuration that enables only a subset of
    the modalities the workload actually uses (for example, text-only logging while the workload also processes images) —
    drops evidence without any error surfacing at invocation time. All modality flags relevant to the workload must therefore
    be enabled in every operational Region. Page 381'
  impact: 'Model invocation logs record full request and response payloads, so enabling logging on a high-traffic Bedrock
    workload measurably increases log-storage growth and the volume that downstream log consumers must process. Enabling logging
    also requires standing up and maintaining the destination in each Region — a CloudWatch Logs log group plus an IAM role
    that Bedrock assumes, and/or an S3 bucket with a delivery bucket policy — which adds per-Region operational overhead.
    Most significantly, the delivered records contain the unmasked, pre-guardrail content of every logged invocation: any
    principal with read access to the log destination sees prompts and completions verbatim, including any PII, credentials,
    or other sensitive material they contain. Destinations must therefore be protected with appropriate destination-side controls
    (for example, a CloudWatch Logs data protection policy or a tightly scoped S3 bucket policy).'
  references:
  - 1. NIST SP 800-53:rev5:AU-12 a
  - '2. NIST CSF 2.0: PR.PS-04'
  page_start: 381
  audit_raw: "Pre-requisite: run these CLI commands in each AWS account that invokes Amazon\nBedrock foundation models. Because\
    \ the logging configuration is per account and per\nRegion, repeat the inspection in every Region where the account makes\
    \ bedrockruntime calls — unlike a multi-Region CloudTrail trail, there is no single-Region\ninspection that covers all\
    \ Regions.\n1. Retrieve the current model invocation logging configuration for the Region:\naws bedrock get-model-invocation-logging-configuration\
    \ --region <region>\n• A single response contains everything this recommendation checks — whether\nlogging is enabled,\
    \ the destination(s), and the per-modality delivery flags. When\nlogging is disabled, the command returns no output and\
    \ exits 0 (there is no\nlogging configuration). When logging is enabled, it returns a configuration object.\n2. Review\
    \ that response against the pass criteria. The environment passes this\nrecommendation for the Region if all of the following\
    \ hold:\n• Logging is enabled — the response contains a non-empty logging configuration\n(empty output means logging is\
    \ disabled and fails).\n• At least one destination is configured — a CloudWatch destination with both a log\ngroup name\
    \ and a role ARN, or an S3 destination with a bucket name (or both),\nin the same account and Region.\n• The required\
    \ modality flags are enabled — every delivery flag (text, image,\nembedding, video) that corresponds to a modality the\
    \ workload processes is set\nto true.\nThe account passes overall only when every Region in which it makes bedrock-runtime\n\
    calls passes these checks.\n Page 382"
  remediation: "Run once per operational Region. Substitute the placeholders for your Region, account\nID, and the log group\
    \ and role names. The steps below configure a CloudWatch Logs\ndestination, which is the most common choice. An Amazon\
    \ S3 bucket is a supported\nalternative (or additional) destination — see the configuration options in Step 3 — but is\n\
    not shown here.\n1. Create the CloudWatch Logs log group that will receive the invocation logs:\naws logs create-log-group\
    \ --log-group-name <log-group-name> --region <region>\n2. Create the IAM role Bedrock assumes to write to that log group.\
    \ The trust policy\nmust allow the bedrock.amazonaws.com service principal and carry\naws:SourceAccount and aws:SourceArn\
    \ conditions to prevent the confuseddeputy problem; Bedrock validates this role when logging is enabled in Step 3, so\n\
    the conditions and permissions must be correct before proceeding.\nTrust policy (bedrock-logging-trust-policy.json):\n\
    {\n \"Version\": \"2012-10-17\",\n \"Statement\": [\n {\n \"Effect\": \"Allow\",\n \"Principal\": { \"Service\": \"bedrock.amazonaws.com\"\
    \ },\n \"Action\": \"sts:AssumeRole\",\n \"Condition\": {\n \"StringEquals\": { \"aws:SourceAccount\": \"<account-id>\"\
    \ },\n \"ArnLike\": { \"aws:SourceArn\": \"arn:aws:bedrock:<region>:<account-id>:*\" }\n }\n }\n ]\n}\nCreate the role:\n\
    aws iam create-role --role-name <bedrock-logging-role> --assume-role-policydocument file://bedrock-logging-trust-policy.json\n\
    The permissions policy grants only the two CloudWatch Logs write actions (create log\nstream and put log events), scoped\
    \ to the fixed Bedrock log stream\naws/bedrock/modelinvocations inside the log group created in Step 1.\nPermissions policy\
    \ (bedrock-logging-permissions.json\n Page 383\n{\n \"Version\": \"2012-10-17\",\n \"Statement\": [\n {\n \"Effect\":\
    \ \"Allow\",\n \"Action\": [\"logs:CreateLogStream\", \"logs:PutLogEvents\"],\n \"Resource\": \"arn:aws:logs:<region>:<account-id>:log-group:<log-groupname>:log-stream:aws/bedrock/modelinvocations\"\
    \n }\n ]\n}\nAttach it to the role:\naws iam put-role-policy --role-name <bedrock-logging-role> --policy-name bedrocklogging-permissions\
    \ --policy-document file://bedrock-logging-permissions.json\n3. Enable model invocation logging, pointing at the CloudWatch\
    \ destination and\nsetting the modality delivery flags. Save the configuration as logging-config.json:\n{ \"cloudWatchConfig\"\
    : { \"logGroupName\": \"<log-group-name>\", \"roleArn\":\n\"arn:aws:iam::<account-id>:role/<bedrock-logging-role>\" },\
    \ \"textDataDeliveryEnabled\":\ntrue, \"imageDataDeliveryEnabled\": true, \"embeddingDataDeliveryEnabled\": true,\n\"\
    videoDataDeliveryEnabled\": true }\nThe logging configuration supports the following options — set them to match the\n\
    workload before applying:\n- Destination — supply a CloudWatch config (a log group name plus the role ARN from\nStep 2),\
    \ an S3 config (a bucket name, for delivery to Amazon S3 instead of or in\naddition to CloudWatch), or both. At least\
    \ one is required. S3 delivery requires a\nbucket policy that lets the Bedrock service principal write to the bucket;\
    \ if you\nchoose S3, configure that separately.\n- Large-data overflow — CloudWatch log events cap each request/response\
    \ body at 100\nKB. To capture larger payloads or binary image/video data when using the CloudWatch\ndestination, add an\
    \ optional large-data delivery S3 bucket inside the CloudWatch\nconfig; bodies over 100 KB are then delivered to that\
    \ bucket instead of being\ntruncated.\n- Modality flags — enable delivery for text, image, embedding, and video for every\n\
    modality the workload uses. Leave a modality disabled only if the workload does not\nprocess it, or if policy requires\
    \ that its content never be persisted in plain\ntext.\nApply the configuration:\naws bedrock put-model-invocation-logging-configuration\
    \ --region <region> --loggingconfig file://logging-config.json\n Page 384"
  checks:
  - type: manual_review
    info: 'Pre-requisite: run these CLI commands in each AWS account that invokes Amazon

      Bedrock foundation models. Because the logging configuration is per account and per

      Region, repeat the inspection in every Region where the account makes bedrockruntime calls — unlike a multi-Region CloudTrail
      trail, there is no single-Region

      inspection that covers all Regions.

      1. Retrieve the current model invocation logging configuration for the Region:

      aws bedrock get-model-invocation-logging-configuration --region '
    severity: medium
- id: 7.4.3
  title: Ensure Amazon Bedrock model invocation log destinations protect the sensitive data they receive
  scoring: manual
  profile:
  - Level 2
  description: Ensure that every destination configured for Amazon Bedrock model invocation logging protects the sensitive
    data those logs contain. Model invocation logging delivers the full request and response of each call — prompt and completion,
    in plain text — to a CloudWatch Logs log group and/or an Amazon S3 bucket, and that content must be protected at the destination
    independent of any guardrail masking applied during inference. Masking sensitive values at the destination is a native
    capability of CloudWatch Logs and has no equivalent in S3. A CloudWatch Logs data protection policy detects and masks
    matched values on read, whereas Bedrock writes the S3 log object verbatim and nothing redacts its content afterward. CloudWatch
    Logs is therefore the recommended destination for sensitive content. This recommendation requires that a CloudWatch Logs
    destination carry a data protection policy masking the organization's in-scope PII and credential types, together with
    tight control over who can read the group and who holds the unmask permission. An S3 destination, which cannot be masked,
    must instead either feed the logs through a downstream server-side redaction pipeline before they are exposed to readers,
    or restrict bucket access to a small, audited set of principals with the residual risk documented and accepted; the mechanics
    of bucket access restriction and encryption at rest are covered by the S3 access-control and encryption-at-rest recommendations.
  rationale: 'The invocation log holds the request and response of each call in the clear, so anything a caller places in
    a prompt — personal data, a pasted credential, an internal identifier — and anything the model emits sits in the destination
    as readable text. Guardrails do not close this gap: sensitive-information filtering hardens the response an application
    receives at inference time, but the stored log should not be assumed to be sanitized, so the destination itself is where
    the content has to be protected. Page 386'
  impact: 'CloudWatch Logs data protection is billed by the volume of data scanned, so enabling it on a high-traffic invocation-log
    group adds cost proportional to log volume; this is the most significant consideration. Masking takes effect only for
    data ingested after the policy is attached, so it does not retroactively protect logs already stored, and detection is
    best-effort — some sensitive values may pass through unmasked — so masking should be treated as one layer rather than
    a guarantee. On the S3 side, the two compliant paths carry different overhead: a downstream redaction pipeline is an additional
    system to build and operate, while the restrict-and-accept path is low-cost but leaves raw content readable to the permitted
    principals and requires a signed-off risk acceptance. Page 387'
  references:
  - 1. https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/protect-sensitivelog-data-types.html
  - 2. NIST SP 800-53:rev5:AU-9 a
  page_start: 386
  audit_raw: "Pre-requisite: perform these checks in each account and Region where model\ninvocation logging is enabled. If\
    \ logging is disabled in a Region, this recommendation\ndoes not apply there.\n1. Identify the destinations that invocation\
    \ logs are delivered to:\naws bedrock get-model-invocation-logging-configuration --region <region> --query\n'loggingConfig.{cloudWatchLogGroup:cloudWatchConfig.logGroupName,\n\
    cloudWatchOverflowBucket:cloudWatchConfig.largeDataDeliveryS3Config.bucketName,\ns3Bucket:s3Config.bucketName}'\nRecord\
    \ every non-null value. A CloudWatch log group, an S3 bucket, or both may be\npresent; a large-data overflow bucket, if\
    \ configured, is an S3 destination and must be\nprotected like any other. Empty output means logging is disabled — see\
    \ the prerequisite.\n2. For each CloudWatch Logs destination, retrieve its data protection policy:\naws logs get-data-protection-policy\
    \ --log-group-identifier <log-group-name> --\nregion <region>\nThe destination passes if the response contains a policy\
    \ with a Deidentify (mask)\nstatement whose data-identifier list covers the organization's in-scope PII and credential\n\
    types — equivalent to or a superset of the sensitive-information filters configured on the\nworkload's guardrails. Empty\
    \ output means no policy is attached and the destination\nfails. Separately, confirm through an IAM review that the unmask\
    \ permission\n(logs:Unmask) is granted only to a documented, minimal set of principals — a broad\ngrant defeats the masking.\n\
    3. For each S3 destination, confirm one of the two compliant paths is in place, since\nS3 log content cannot be masked:\n\
    • a documented, operating downstream redaction pipeline that removes sensitive\ndata before the logs are exposed to readers,\
    \ or\n• bucket access restricted to a small, audited set of principals, with the residual\nraw-content risk formally documented\
    \ and accepted.\nThe bucket access-restriction and encryption-at-rest mechanics are verified by the S3\naccess-control\
    \ and encryption-at-rest recommendations; you can confirm access is\nscoped with:\naws s3api get-bucket-policy --bucket\
    \ <bucket-name> --query 'Policy' --output text\nAn S3 destination with neither a redaction pipeline nor documented, restricted\
    \ access\nfails.\nThe environment passes this recommendation for the Region only when every\ndestination identified in\
    \ step 1 passes its corresponding check.\n Page 388"
  remediation: "Apply the protection appropriate to each destination type. Run per destination, in every\noperational Region.\n\
    Option A — CloudWatch Logs destination (recommended): attach a data protection\npolicy that masks in-scope data.\nSave\
    \ the policy as dp-policy.json. Set the data-identifier list to the sensitive-data types\nthe workload actually handles.\
    \ The policy carries two statements: the audit statement\nrecords a finding (and a free CloudWatch metric) when a match\
    \ is detected, and the\ndeidentify statement masks the match at read time.\n{\n \"Name\": \"bedrock-invocation-log-protection\"\
    ,\n \"Version\": \"2021-06-01\",\n \"Statement\": [\n {\n \"Sid\": \"audit\",\n \"DataIdentifier\": [\n \"arn:aws:dataprotection::aws:data-identifier/EmailAddress\"\
    ,\n \"arn:aws:dataprotection::aws:data-identifier/CreditCardNumber\",\n \"arn:aws:dataprotection::aws:data-identifier/Ssn-US\"\
    ,\n \"arn:aws:dataprotection::aws:data-identifier/AwsSecretKey\"\n ],\n \"Operation\": { \"Audit\": { \"FindingsDestination\"\
    : {} } }\n },\n {\n \"Sid\": \"deidentify\",\n \"DataIdentifier\": [\n \"arn:aws:dataprotection::aws:data-identifier/EmailAddress\"\
    ,\n \"arn:aws:dataprotection::aws:data-identifier/CreditCardNumber\",\n \"arn:aws:dataprotection::aws:data-identifier/Ssn-US\"\
    ,\n \"arn:aws:dataprotection::aws:data-identifier/AwsSecretKey\"\n ],\n \"Operation\": { \"Deidentify\": { \"MaskConfig\"\
    : {} } }\n }\n ]\n}\nConfiguration options to set before applying:\n• Data identifiers — list the managed data identifiers\
    \ that match the data your\nworkload processes, using the same list in both statements, and make the set\nequivalent to\
    \ or a superset of the sensitive-information filters configured on the\nworkload's guardrails. AWS validates these ARNs\
    \ when the policy is applied and\nrejects unknown values. The example covers email addresses, credit-card\nnumbers, US\
    \ social security numbers, and AWS secret keys; consult the\nmanaged-data-identifier reference for the full set.\n Page\
    \ 389\n• Findings destination — the audit statement above emits only the free\nCloudWatch metric. To also send audit findings\
    \ somewhere for review, populate\nFindingsDestination with a CloudWatch Logs, S3, or Firehose target.\nApply it:\naws\
    \ logs put-data-protection-policy --log-group-identifier <log-group-name> --\npolicy-document file://dp-policy.json --region\
    \ <region>\nThen grant logs:Unmask only to the minimal set of principals who legitimately need to\nread raw content, and\
    \ attach the policy before enabling logging so that data is masked\nfrom first ingestion.\nOption B — S3 destination:\
    \ because S3 log content cannot be masked, prefer moving\nsensitive content to a CloudWatch Logs destination (Option A)\
    \ where it can be masked.\nIf an S3 destination must be used, satisfy one of the two compliant paths:\n• Redact downstream\
    \ — route the delivered logs through a server-side redaction\npipeline that removes sensitive data before any reader can\
    \ access them.\n• Restrict and accept — limit bucket access to a small, audited set of principals\nand record a documented,\
    \ signed-off acceptance of the residual raw-content risk.\nApply the bucket access-restriction and encryption-at-rest\
    \ measures and\npreserve the delivery bucket policy that Bedrock requires to write the logs.\nOption C — alternative:\
    \ do not persist the sensitive content. If a workload's policy is that\nsensitive content must never be stored in plain\
    \ text, disable delivery for the modality that\ncarries it — for example, set the relevant modality delivery flag to false\
    \ in the logging\nconfiguration — or leave logging disabled, rather than relying solely on masking."
  checks:
  - type: manual_review
    info: 'Pre-requisite: perform these checks in each account and Region where model

      invocation logging is enabled. If logging is disabled in a Region, this recommendation

      does not apply there.

      1. Identify the destinations that invocation logs are delivered to:

      aws bedrock get-model-invocation-logging-configuration --region <region> --query

      ''loggingConfig.{cloudWatchLogGroup:cloudWatchConfig.logGroupName,

      cloudWatchOverflowBucket:cloudWatchConfig.largeDataDeliveryS3Config.bucketName,

      s3Bucket:s3Config.buc'
    severity: medium
- id: 7.4.4
  title: Ensure Amazon Bedrock knowledge base ingestion log delivery is enabled
  scoring: scored
  profile:
  - Level 1
  description: 'Ensure that every Amazon Bedrock knowledge base delivers its ingestion logs to a durable log destination.
    Ingestion is the process that turns an external data source into retrievable knowledge: Bedrock reads the source documents,
    chunks and embeds them, and writes the vectors into the knowledge base''s vector store. The ingestion log is a per-document
    record of that process — which documents were added, updated, deleted, or left unchanged on each sync, and which failed
    and why. These logs are delivered through CloudWatch vended log delivery, a mechanism separate from model invocation logging
    and from CloudTrail. Delivery is set per knowledge base and per Region, so every knowledge base in every operational Region
    must be covered; a knowledge base with several data sources reports all of them under its single delivery. This recommendation
    covers only the ingestion pipeline — who later queries the knowledge base at retrieval time is captured by the CloudTrail
    data-event logging recommendation, and the prompt and completion content of model calls is captured by the model invocation
    logging recommendations.'
  rationale: 'Ingestion is the only path by which outside content enters a knowledge base and becomes an answer the model
    will later ground on, so the ingestion log is the sole account-side record of what the knowledge base actually learned.
    It shows each document that was added, changed, or removed on a sync and whether indexing succeeded — the evidence needed
    to trace a specific retrieved answer back to the document that introduced it, to confirm a data source synced as expected,
    and to detect content that was injected, silently dropped, or failed to index. With ingestion log delivery disabled, that
    activity is invisible. No other log source records it: model invocation logging captures prompts and completions at inference
    time, and CloudTrail data events capture retrieval calls against the knowledge base, but neither reports the document-level
    outcome of an ingestion job. An attacker who poisons a data source so a malicious document is embedded, or a misconfiguration
    that quietly fails to ingest a corpus, would leave no trace — and a wrong or manipulated answer could not be attributed
    to the ingested content behind it. Enabling delivery closes that gap and gives the destination the durable evidence that
    after-the-fact review and alerting depend on. Page 392'
  impact: 'Ingestion logs are emitted only while an ingestion job runs, so the volume — and therefore the cost — is modest
    and scales with how often data sources are synced rather than with query traffic. The main operational overhead is configuration:
    one delivery source, destination, and delivery per knowledge base per Region, and a destination that must already exist
    and whose resource or IAM policy permits the delivery service to write to it. Enabling delivery is otherwise low-risk.
    The records identify source documents and their status rather than reproducing document contents, but the destination
    still holds an inventory of what a knowledge base contains and should be access-controlled and retained like any other
    audit log destination. Page 393'
  references:
  - 1. NIST SP 800-53:rev5:AU-12 a
  - '2. NIST CSF 2.0: PR.PS-04'
  page_start: 392
  audit_raw: "Pre-requisite: perform these checks in each account and Region that operates Amazon\nBedrock knowledge bases.\
    \ If an account or Region operates no knowledge bases, this\nrecommendation does not apply there.\n1. Enumerate the knowledge\
    \ bases in the Region:\naws bedrock-agent list-knowledge-bases --region <region> --query\n'knowledgeBaseSummaries[].knowledgeBaseId'\
    \ --output text\nFor each ID, the knowledge base ARN is arn:aws:bedrock:<region>:<accountid>:knowledge-base/<id>. An empty\
    \ list means there is nothing to audit in this Region —\nsee the pre-requisite.\n2. Retrieve every delivery source once\
    \ and every delivery once:\naws logs describe-delivery-sources --region <region> --query\n'deliverySources[].{name:name,\
    \ logType:logType, resource:resourceArns[0]}' --output\ntable\naws logs describe-deliveries --region <region> --query\n\
    'deliveries[].{source:deliverySourceName, destType:deliveryDestinationType,\ndest:deliveryDestinationArn}' --output table\n\
    3. Interpret the two listings against the knowledge base inventory from step 1. A\nknowledge base passes when both of\
    \ the following hold:\n• the delivery-source listing contains an entry whose resource is that knowledge\nbase's ARN and\
    \ whose logType is APPLICATION_LOGS, and\n• the delivery listing contains an entry whose source is that delivery source's\
    \ name\nand whose destination ARN is non-empty (a destination type of CWL, S3, or FH).\nA knowledge base with no matching\
    \ APPLICATION_LOGS delivery source, or with a\nsource that is not paired to a delivery, fails. A delivery source can be\
    \ bound only to a\nknowledge base ARN that exists and authorizes vended delivery — the bind operation\nvalidates this\
    \ when the source is created — so a present, paired source is reliable\nevidence that delivery is live rather than merely\
    \ declared.\nThe environment passes this recommendation for the Region only when every\nknowledge base enumerated in step\
    \ 1 passes.\n Page 394"
  remediation: "Enable ingestion log delivery for each knowledge base that lacks it. Run per knowledge\nbase, in every operational\
    \ Region.\nPrerequisite — grant the configuring principal permission to enable vended delivery for\nthe knowledge base\
    \ and to write the delivery configuration. Save as vended-logdelivery.json, substituting the knowledge base ARN:\n{\n\
    \ \"Version\": \"2012-10-17\",\n \"Statement\": [\n {\n \"Sid\": \"AuthorizeBedrockVendedDelivery\",\n \"Effect\": \"\
    Allow\",\n \"Action\": \"bedrock:AllowVendedLogDeliveryForResource\",\n \"Resource\": \"arn:aws:bedrock:<region>:<account-id>:knowledge-base/<id>\"\
    \n },\n {\n \"Sid\": \"ConfigureLogDelivery\",\n \"Effect\": \"Allow\",\n \"Action\": [\n \"logs:PutDeliverySource\",\n\
    \ \"logs:PutDeliveryDestination\",\n \"logs:CreateDelivery\"\n ],\n \"Resource\": \"*\"\n }\n ]\n}\nAttach it to the configuring\
    \ role:\naws iam put-role-policy --role-name <configuring-role-name> --policy-name bedrockkb-ingestion-log-delivery --policy-document\
    \ file://vended-log-delivery.json\n1. Bind a delivery source to the knowledge base ARN with the ingestion log type:\n\
    aws logs put-delivery-source --region <region> --name kb-ingestion-src --resourcearn arn:aws:bedrock:<region>:<account-id>:knowledge-base/<id>\
    \ --log-type\nAPPLICATION_LOGS\nThis call authorizes vended delivery for the knowledge base and fails with a\nValidationException\
    \ if the ARN does not exist or does not permit delivery, so a\nsuccessful call confirms the binding is valid.\n2. Ensure\
    \ a destination exists and register it as a delivery destination. The example\nuses a CloudWatch Logs log group, the simplest\
    \ destination — a log group name\nunder the /aws/vendedlogs/ prefix lets the delivery service manage the log\ngroup's\
    \ write permission for you, so no separate resource policy is needed:\n Page 395\naws logs create-log-group --log-group-name\
    \ /aws/vendedlogs/bedrock-kb-ingestion --\nregion <region>\naws logs put-delivery-destination --region <region> --name\
    \ kb-ingestion-dest --\ndelivery-destination-configuration\n'{\"destinationResourceArn\":\"arn:aws:logs:<region>:<account-id>:loggroup:/aws/vendedlogs/bedrock-kb-ingestion:*\"\
    }'\n3. Pair the source to the destination with a delivery:\naws logs create-delivery --region <region> --delivery-source-name\
    \ kb-ingestion-src\n--delivery-destination-arn arn:aws:logs:<region>:<account-id>:deliverydestination:kb-ingestion-dest"
  checks:
  - type: manual_review
    info: 'Pre-requisite: perform these checks in each account and Region that operates Amazon

      Bedrock knowledge bases. If an account or Region operates no knowledge bases, this

      recommendation does not apply there.

      1. Enumerate the knowledge bases in the Region:

      aws bedrock-agent list-knowledge-bases --region <region> --query

      ''knowledgeBaseSummaries[].knowledgeBaseId'' --output text

      For each ID, the knowledge base ARN is arn:aws:bedrock:<region>:<accountid>:knowledge-base/<id>. An empty list means
      there is '
    severity: medium
- id: 7.5.1
  title: Ensure Amazon Bedrock is accessed through interface VPC endpoints
  scoring: scored
  profile:
  - Level 2
  description: Ensure that workloads reach the Amazon Bedrock APIs over interface VPC endpoints (AWS PrivateLink) instead
    of the public internet, and that each endpoint carries a leastprivilege endpoint policy. An interface endpoint gives Bedrock
    a private IP address inside your VPC, so API calls stay on the Amazon private network with no internet gateway, NAT gateway,
    or public IP in the path. Bedrock exposes each of its API families as a separate PrivateLink service, so a workload needs
    an endpoint for each family it calls. Almost every workload uses the control plane (bedrock) and the model-invocation
    runtime (bedrock-runtime). Accounts that run knowledge bases or agents also use bedrock-agent and bedrock-agentruntime,
    and other capabilities such as data automation add families of their own. Endpoints are created per VPC and per Region,
    so every VPC and Region that reaches Bedrock must be covered, and regulated workloads can use the FIPS service variants
    (bedrock-fips, bedrock-runtime-fips) where they are offered. A new endpoint starts with a default policy that lets every
    principal take every action. This recommendation requires replacing that policy with one scoped to the principals and
    Bedrock actions the workload actually needs.
  rationale: Without an interface endpoint, calls to Bedrock leave the VPC over the public internet, and the prompts, completions,
    and documents they carry travel a public path that also forces the workload to keep an internet egress route open. An
    interface endpoint keeps that traffic on private addresses inside the AWS network and removes any need for an internet
    path to Bedrock. The endpoint policy adds a second control point at the network boundary, independent of identity. With
    the default allow-everything policy, anyone who can reach the endpoint can call any Bedrock action through it. A scoped
    policy means that even a caller inside the VPC with broad Bedrock IAM permissions can only do through the endpoint what
    the endpoint itself allows, which helps contain a compromised or over-privileged principal. Page 398
  impact: Enforcing the use of VPC endpoints may require changes to existing network architectures, including creating and
    managing endpoints in each VPC, updating route tables, adjusting security groups, and potentially removing or tightening
    some internet/NAT gateway paths. This can introduce additional operational overhead and cost (per-endpoint charges for
    interface endpoints) and may require updates to IaC templates and deployment pipelines.
  references:
  - 1. NIST SP 800-53:rev5:SC-7
  - '2. NIST CSF 2.0: PR.IR-01'
  page_start: 398
  audit_raw: "Pre-requisite: perform these checks in each account, Region, and VPC from which\nworkloads call Amazon Bedrock.\
    \ First determine which Bedrock API families the\nworkloads actually use the account uses. To see the family service names\
    \ PrivateLink\noffers in the Region:\naws ec2 describe-vpc-endpoint-services --region <region> --query\n\"ServiceDetails[?contains(ServiceName,\
    \ 'bedrock')].ServiceName\" --output text\n1. Retrieve every Bedrock interface endpoint in the VPC in one call:\naws ec2\
    \ describe-vpc-endpoints --region <region> --filters \"Name=vpcid,Values=<vpc-id>\" \"Name=vpc-endpoint-type,Values=Interface\"\
    \ --query\n\"VpcEndpoints[?contains(ServiceName, 'bedrock')].{Service:ServiceName, State:State,\nPrivateDns:PrivateDnsEnabled,\
    \ Policy:PolicyDocument}\" --output json\n2. Interpret the single response against the following checklist. The VPC passes\n\
    only when all three hold for every Bedrock API family the workloads use:\n• Endpoint present and ready — the response\
    \ contains an entry for the family's\nservice name whose State is available. A family with no entry is a fail.\n• Least-privilege\
    \ policy — the Policy field is returned as a JSON document (a\nstring). It fails if it is the default full-access policy:\
    \ a single Allow statement whose\nPrincipal and Action are both the wildcard. It passes when principals name\nspecific\
    \ accounts, roles, or users and actions are specific Bedrock actions.\n• Reachable over the private path — PrivateDnsEnabled\
    \ is true, so the standard\nhostname resolves to the endpoint. If it is false, that is acceptable only when the\ncallers\
    \ explicitly target the endpoint-specific DNS name (verify this in the\napplication or SDK configuration); otherwise traffic\
    \ still leaves over the public\ninternet and the family fails.\nAn endpoint that is present but still carries the default\
    \ wildcard policy, or a family in use\nwith no available endpoint, fails the recommendation for the VPC.\n Page 399"
  remediation: "Provision an interface endpoint, with a scoped policy and private DNS, for each Bedrock\nAPI family the workload\
    \ uses. Run per VPC, in every operational Region.\nPre-requisite: for private DNS, the VPC's DNS attributes must be enabled:\n\
    aws ec2 modify-vpc-attribute --region <region> --vpc-id <vpc-id> --enable-dnssupport\naws ec2 modify-vpc-attribute --region\
    \ <region> --vpc-id <vpc-id> --enable-dnshostnames\n1. Author a least-privilege endpoint policy for the family. Save as\
    \ bedrock-runtimeendpoint-policy.json. Name the principals that legitimately call Bedrock from the\nVPC and the specific\
    \ actions they need:\n{\n \"Version\": \"2012-10-17\",\n \"Statement\": [\n {\n \"Sid\": \"AllowScopedInvokeOnly\",\n\
    \ \"Effect\": \"Allow\",\n \"Principal\": { \"AWS\": \"arn:aws:iam::<account-id>:role/<caller-role>\" },\n \"Action\"\
    : [\n \"bedrock:InvokeModel\",\n \"bedrock:InvokeModelWithResponseStream\",\n \"bedrock:Converse\",\n \"bedrock:ConverseStream\"\
    \n ],\n \"Resource\": \"arn:aws:bedrock:<region>::foundation-model/*\"\n }\n ]\n}\n2. Create the endpoint for the family\
    \ with private DNS enabled and the policy\nattached. The endpoint's security group must admit HTTPS (TCP 443) from the\n\
    caller subnets:\naws ec2 create-vpc-endpoint --region <region> --vpc-endpoint-type Interface --vpcid <vpc-id> --service-name\
    \ com.amazonaws.<region>.bedrock-runtime --subnet-ids\n<subnet-id-az1> <subnet-id-az2> --security-group-ids <sg-id> --private-dns-enabled\n\
    --policy-document file://bedrock-runtime-endpoint-policy.json\nRepeat for each family in use — the control plane (service\
    \ name\ncom.amazonaws.<region>.bedrock), and where knowledge bases or agents are\noperated, com.amazonaws.<region>.bedrock-agent\
    \ and\ncom.amazonaws.<region>.bedrock-agent-runtime — and in each operational Region.\nRegulated workloads may substitute\
    \ the FIPS service variants\n(com.amazonaws.<region>.bedrock-fips and com.amazonaws.<region>.bedrockruntime-fips) where\
    \ offered.\n Page 400\n3. To bring an existing endpoint that still carries the default full-access policy into\ncompliance,\
    \ replace its policy in place:\naws ec2 modify-vpc-endpoint --region <region> --vpc-endpoint-id <vpce-id> --policydocument\
    \ file://bedrock-runtime-endpoint-policy.json\n4. If an existing endpoint was created without private DNS, enable it (after\n\
    confirming the VPC DNS attributes above):\naws ec2 modify-vpc-endpoint --region <region> --vpc-endpoint-id <vpce-id> --\n\
    private-dns-enabled"
  checks:
  - type: manual_review
    info: 'Pre-requisite: perform these checks in each account, Region, and VPC from which

      workloads call Amazon Bedrock. First determine which Bedrock API families the

      workloads actually use the account uses. To see the family service names PrivateLink

      offers in the Region:

      aws ec2 describe-vpc-endpoint-services --region <region> --query

      "ServiceDetails[?contains(ServiceName, ''bedrock'')].ServiceName" --output text

      1. Retrieve every Bedrock interface endpoint in the VPC in one call:

      aws ec2 describe-vpc-en'
    severity: medium
- id: 7.5.2
  title: Ensure Amazon Bedrock jobs run in a private VPC with no public egress
  scoring: scored
  profile:
  - Level 2
  description: Ensure that every Amazon Bedrock job that supports a VPC configuration runs in isolated private subnets with
    no public egress. Model customization, custom model import, and batch inference (model invocation) jobs are the common
    examples, and AWS adds more job types over time, so apply the same requirement to any job whose API exposes a vpcConfig
    field. These jobs retrieve input data from services such as Amazon S3 and write outputs and metrics back to such services.
    If no VPC configuration is specified, Amazon Bedrock runs the job using an AWS-managed network path that permits public
    egress. Configure network isolation at job creation by supplying the vpcConfig request parameter.
  rationale: Without a VPC configuration, a Bedrock job runs on an AWS-managed network and its training, validation, input,
    and output data can move to and from AWS services like S3 over public network paths. That widens the exposure surface
    for confidential prompts, model responses, and model artifacts, and gives the job a path off the private network. Pinning
    the job to isolated private subnets — no route to an internet gateway or NAT gateway — keeps that data on the private
    network for the life of the job and removes any public egress during execution.
  impact: Implementing this control requires creating isolated private subnets, ideally distributed across multiple Availability
    Zones, with route tables that do not allow access through an internet gateway or NAT gateway. The subnets must still provide
    private connectivity to the AWS services required by the job, such as Amazon S3 for input data, outputs, and metrics.
    This typically requires configuring the appropriate VPC endpoints—such as an S3 gateway endpoint or interface endpoints
    for other required AWS services. Without these private routes, a job may fail because it cannot access its required managed
    services, even though it is correctly isolated. Because Amazon Bedrock VPC configuration is defined only when a job is
    created, existing jobs cannot be updated in place. Jobs that were created without a VPC configuration must be resubmitted
    with the required VPC settings. Page 402
  references:
  - 1. NIST SP 800-53:rev5:SC-7 (21)
  - '2. NIST CSF 2.0: PR.IR-01'
  page_start: 402
  audit_raw: "Pre-requisite: perform these checks in each account and Region that runs Amazon\nBedrock jobs. Several Bedrock\
    \ job types support a VPC configuration; the steps below\nuse model customization, custom model import, and batch inference\
    \ (model invocation)\nas representative examples, and AWS adds more over time. Apply the same check to\nany other job\
    \ type in use whose create and get operations expose a vpcConfig field —\nconsult the AWS Bedrock VPC documentation for\
    \ the current set.\n1. List batch inference (model invocation) jobs and read the vpcConfig on each\nsummary:\naws bedrock\
    \ list-model-invocation-jobs --region <region>\nIn the response, every entry under invocationJobSummaries must have a\
    \ vpcConfig\nwith non-empty subnetIds and securityGroupIds. An entry whose vpcConfig is null or\nabsent is a job with\
    \ no VPC configuration and fails this recommendation.\n2. List model customization jobs, then retrieve each one (the list\
    \ summary does not\ncarry vpcConfig):\naws bedrock list-model-customization-jobs --region <region>\nFor each job ARN under\
    \ modelCustomizationJobSummaries:\naws bedrock get-model-customization-job --region <region> --job-identifier <jobarn>\n\
    Read the vpcConfig field in the response. A job whose vpcConfig is null fails this\nrecommendation.\n3. List custom model\
    \ import jobs, then retrieve each one the same way:\naws bedrock list-model-import-jobs --region <region>\nFor each job\
    \ ARN under modelImportJobSummaries:\naws bedrock get-model-import-job --region <region> --job-identifier <job-arn>\n\
    A job whose vpcConfig is null fails this recommendation.\n4. For each subnet listed in a job's vpcConfig, confirm the\
    \ subnet is isolated — its\nroute table has no route to the public internet:\naws ec2 describe-route-tables --region <region>\n\
    \ Page 403\nIn the output, find the route table whose Associations include the subnet. Inspect that\nroute table's Routes.\
    \ The subnet FAILS if any route has a DestinationCidrBlock of\n0.0.0.0/0 (or ::/0 for IPv6) whose target is an internet\
    \ gateway (a GatewayId beginning\nwith igw-) or a NAT gateway (a NatGatewayId beginning with nat-). Only local and other\n\
    private targets (for example a GatewayId of local, a VPC endpoint, or a VPC peering\nconnection) are acceptable.\nThe\
    \ environment passes this recommendation when both of the following hold:\n• Every job of a type that supports a VPC configuration\
    \ reports a non-empty\nvpcConfig containing at least one subnet.\n• Every subnet those jobs reference sits in a route\
    \ table with no default route\n(0.0.0.0/0 or ::/0) to an internet gateway or a NAT gateway.\n Page 404"
  remediation: 'A job''s VPC configuration can only be set when the job is created, so an existing job

    with no vpcConfig — or one pointing at a public subnet — cannot be fixed in place.

    Prepare the isolated network and the role permissions, then resubmit the job.

    1. Prepare isolated subnets. Use, or create, private subnets whose route tables

    have no default route to an internet gateway or a NAT gateway. The subnets

    must still have a private path to the backend services a job needs — example

    Amazon S3 for its input, output, and metrics — so establish that routing, typically

    a VPC endpoint reachable from the subnet''s route table. Without it the job cannot

    reach AWS services and will fail even though it is correctly isolated.

    2. Resubmit each job with a vpcConfig that references the isolated subnets and the

    security group. The examples below cover model customization, custom model

    import, and batch inference; any other job type that supports a VPC configuration

    takes the same --vpc-config parameter.

    • The job''s service role also needs EC2 permissions to create and delete

    the elastic network interfaces Bedrock places in the subnets, scoped to

    those subnets and security groups. Attach the policy with these

    permissions to the role before resubmitting.

    Model customization job:

    aws bedrock create-model-customization-job --region <region> --job-name <job-name>

    --custom-model-name <custom-model-name> --role-arn <role-arn> --base-modelidentifier <base-model-arn> --training-data-config
    ''{"s3Uri":"s3://<trainingbucket>/train/"}'' --output-data-config ''{"s3Uri":"s3://<output-bucket>/out/"}'' --

    vpc-config ''subnetIds=<subnet-az1>,<subnet-az2>,securityGroupIds=<sg-id>''

    Custom model import job:

    aws bedrock create-model-import-job --region <region> --job-name <job-name> --

    imported-model-name <imported-model-name> --role-arn <role-arn> --model-data-source

    ''s3DataSource={s3Uri=s3://<model-artifact-bucket>/model/}'' --vpc-config

    ''subnetIds=<subnet-az1>,<subnet-az2>,securityGroupIds=<sg-id>''

    Batch inference (model invocation) job:

    aws bedrock create-model-invocation-job --region <region> --job-name <job-name> --

    role-arn <role-arn> --model-id <model-id> --input-data-config

    ''s3InputDataConfig={s3InputFormat=JSONL,s3Uri=s3://<input-bucket>/in/}'' --outputdata-config ''s3OutputDataConfig={s3Uri=s3://<output-bucket>/out/}''
    --vpc-config

    ''subnetIds=<subnet-az1>,<subnet-az2>,securityGroupIds=<sg-id>'''
  checks:
  - type: manual_review
    info: 'Pre-requisite: perform these checks in each account and Region that runs Amazon

      Bedrock jobs. Several Bedrock job types support a VPC configuration; the steps below

      use model customization, custom model import, and batch inference (model invocation)

      as representative examples, and AWS adds more over time. Apply the same check to

      any other job type in use whose create and get operations expose a vpcConfig field —

      consult the AWS Bedrock VPC documentation for the current set.

      1. List batch inferen'
    severity: medium
- id: 7.5.3
  title: Ensure vector stores backing Amazon Bedrock knowledge bases are not Publicly accessible
  scoring: scored
  profile:
  - Level 2
  description: Ensure that the vector store used by each Amazon Bedrock knowledge base is not publicly accessible and is reachable
    only by Amazon Bedrock and approved private network sources. A knowledge base can use several vector store types, and
    the mechanism that makes an endpoint private differs by type, so the Audit and Remediation Procedures below are written
    for Amazon OpenSearch Serverless, the most common store, as the worked example; apply the equivalent configuration to
    whatever store a given knowledge base uses. For Amazon OpenSearch Serverless, configure the collection’s network policy
    with AllowFromPublic set to false, allow Amazon Bedrock through bedrock.amazonaws.com in SourceServices, and allow only
    required OpenSearch Serverless VPC endpoints through SourceVPCEs. Authentication and data access policies are separate
    controls and should continue to restrict access to vector-store data.
  rationale: 'A knowledge base''s vector store holds the embeddings derived from your source documents and serves the text
    chunks returned at retrieval time — sensitive material — regardless of which backend hosts it. When the store''s endpoint
    allows public access, it is reachable from the internet, so the only barriers between an attacker and that data are request
    authentication and the store''s own access controls. Making the endpoint private removes that internet-reachable network
    path entirely: the store becomes reachable only from Amazon Bedrock and from the private networks you designate, adding
    a network-layer barrier beneath authentication and authorization. If credentials leak or an access policy is misconfigured,
    a private endpoint is still not reachable from an arbitrary network, whereas a public one is directly exposed.'
  impact: Isolating a vector store changes only how its endpoint is reached, not how the data is authorized, and a knowledge
    base keeps working once the store grants Amazon Bedrock private access. The operational cost falls on any of your own
    tooling that previously reached the store over the public internet — dashboards, indexing scripts, or query clients —
    which must instead connect over a private path, typically an interface VPC endpoint; standing that up requires subnets,
    a security group, and private IP addresses, and is work a network team often owns. Page 407
  references:
  - 1. NIST SP 800-53:rev5:SC-7 (11)
  - '2. NIST CSF 2.0: PR.IR-01'
  page_start: 407
  audit_raw: "Pre-requisite: perform these checks in each account and Region that runs Amazon\nBedrock knowledge bases. The\
    \ steps below cover knowledge bases backed by\nOpenSearch Serverless; for a knowledge base on another store type, perform\
    \ the\nequivalent network-isolation check on that service. An account with no knowledge\nbases has nothing to check.\n\
    1. List the knowledge bases in the Region:\naws bedrock-agent list-knowledge-bases --region <region>\nEach entry under\
    \ knowledgeBaseSummaries has a knowledgeBaseId. If the list is\nempty, this recommendation does not apply in the Region.\n\
    2. For each knowledge base, read its storage configuration:\naws bedrock-agent get-knowledge-base --region <region> --knowledge-base-id\
    \ <kb-id>\nUnder knowledgeBase.storageConfiguration, read type. When it is\nOPENSEARCH_SERVERLESS, read the collection\
    \ ARN from\nstorageConfiguration.opensearchServerlessConfiguration.collectionArn and continue\nwith steps 3 and 4; the\
    \ collection identifier is the segment of that ARN after collection/.\nWhen it is another type, apply the equivalent check\
    \ for that store and record the result\nagainst the general pass condition below.\n3. Resolve the collection name from\
    \ its identifier:\naws opensearchserverless batch-get-collection --region <region> --ids <collectionid>\nRead the name\
    \ field under collectionDetails. Network policies match collections by this\nname.\n4. Retrieve the network policies that\
    \ govern the collection:\naws opensearchserverless list-security-policies --type network --resource\ncollection/<collection-name>\
    \ --region <region>\nThe summaries carry only the policy name and version, so retrieve each returned policy\nto read its\
    \ rules:\naws opensearchserverless get-security-policy --type network --region <region> --\nname <policy-name>\nThe response\
    \ returns securityPolicyDetail.policy as a JSON array of rules. This\nOpenSearch Serverless-backed knowledge base passes\
    \ this check if:\n Page 408\n• None of the policies returned for the collection sets AllowFromPublic to true on a\nrule\
    \ matching it. If any matching rule is public, the collection is public — where\nprivate and public rules overlap for\
    \ the same collection, public access wins —\nand this recommendation fails.\n• A matching rule sets AllowFromPublic to\
    \ false and lists bedrock.amazonaws.com\nunder SourceServices, which is how the managed service reaches a private\ncollection.\
    \ SourceVPCEs may also be present if your own workloads query the\ncollection directly, but it is not required for Bedrock,\
    \ and its absence is not a\nfailure.\nAs a quick visual cross-check, the OpenSearch Serverless console resolves the same\n\
    result on the collection's Network access panel, showing an associated network access\npolicy and an access type of Public\
    \ or Private.\nThe environment passes this recommendation when, for every knowledge base in the\nRegion, the backing vector\
    \ store's endpoint is reachable only from Amazon Bedrock\nand the private networks you designate, and not from the public\
    \ internet. For a\nknowledge base on another store type, the equivalent evidence is that the store's\nendpoint is private\
    \ on that service — for example a managed OpenSearch domain\nreporting VPC options, an Aurora cluster reporting that it\
    \ is not publicly accessible, or an\nS3 Vectors bucket with public access blocked.\n Page 409"
  remediation: "Make the backing store's endpoint private on whatever service hosts it. The steps below\ncover OpenSearch\
    \ Serverless; for a knowledge base on another store type, apply the\nanalogous private-network configuration on that service\
    \ and then re-audit.\nFor OpenSearch Serverless, a network policy matches collections by name and can be\nedited at any\
    \ time, so a collection whose endpoint is public is made private by updating\n— or, if none matches, creating — the network\
    \ policy that governs it; the collection and\nthe knowledge base are not recreated.\n1. Identify the network policy that\
    \ governs the collection, from the Audit Procedure,\nand retrieve its current version to supply on update:\naws opensearchserverless\
    \ get-security-policy --type network --region <region> --\nname <policy-name>\nNote the policyVersion in the response.\n\
    2. Author a private policy document, private-network-policy.json. Set\nAllowFromPublic to false, match the collection\
    \ by name, and grant Bedrock as a\nsource service so the knowledge base can still reach the collection. Omit any\npublic\
    \ dashboard rule.\n[\n {\n \"Description\": \"Private access for Bedrock knowledge base vector store\",\n \"Rules\": [\n\
    \ { \"ResourceType\": \"collection\", \"Resource\": [\"collection/<collectionname>\"] }\n ],\n \"AllowFromPublic\": false,\n\
    \ \"SourceServices\": [\"bedrock.amazonaws.com\"]\n }\n]\nIf your own workloads also query the collection directly, first\
    \ create an OpenSearch\nServerless-managed VPC endpoint and add its identifier under SourceVPCEs alongside\nSourceServices.\n\
    3. Apply the policy using the version captured in step 1:\naws opensearchserverless update-security-policy --type network\
    \ --region <region> --\nname <policy-name> --policy-version <policy-version> --policy file://privatenetwork-policy.json\n\
    If no network policy currently governs the collection, create one instead with the same\ndocument:\naws opensearchserverless\
    \ create-security-policy --type network --region <region> --\nname <policy-name> --policy file://private-network-policy.json\n\
    \ Page 410\n4. If any of your own tooling reached the collection over the public internet, repoint it\nthrough the VPC\
    \ endpoint before or alongside the change so it does not lose\naccess."
  checks:
  - type: manual_review
    info: 'Pre-requisite: perform these checks in each account and Region that runs Amazon

      Bedrock knowledge bases. The steps below cover knowledge bases backed by

      OpenSearch Serverless; for a knowledge base on another store type, perform the

      equivalent network-isolation check on that service. An account with no knowledge

      bases has nothing to check.

      1. List the knowledge bases in the Region:

      aws bedrock-agent list-knowledge-bases --region <region>

      Each entry under knowledgeBaseSummaries has a knowledgeBase'
