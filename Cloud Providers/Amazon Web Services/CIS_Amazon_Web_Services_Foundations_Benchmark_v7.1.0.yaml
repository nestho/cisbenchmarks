- id: 7.5.4
  title: Ensure Amazon Bedrock Marketplace model endpoints are network-isolated and deployed in a VPC
  scoring: scored
  profile:
  - Level 2
  description: Ensure that every Amazon Bedrock Marketplace model endpoint runs network-isolated and bound to a private VPC.
    Unlike Bedrock's serverless foundation models, which run inside the AWS-managed Bedrock service, a Marketplace model is
    deployed to a dedicated endpoint that runs on Amazon SageMaker infrastructure in your own account and is then invoked
    through the Bedrock APIs. This recommendation requires that the SageMaker model backing each such endpoint be created
    with network isolation enabled and with a VPC configuration.
  rationale: A Marketplace model runs third-party container code in your AWS account and processes your prompts and model
    responses. Without network isolation, the container may have network access outside your environment. If the model image
    is compromised or malicious, it could send sensitive prompt or inference data to external systems or communicate with
    attacker-controlled infrastructure. Enabling network isolation removes that external network path. Configuring the model
    to use your VPC also keeps SageMaker-related traffic, such as model-artifact retrieval, within subnets and security groups
    that you control rather than using a public network path.
  impact: Network isolation means the model container has no network access at runtime, so a model that expects to reach the
    internet or other AWS services during inference will not work isolated; confirm the model runs fully self-contained before
    enabling it. Because the container cannot fetch anything itself, the model artifacts must be staged where SageMaker can
    load them over the private path (for example an S3 bucket reachable through a VPC endpoint from the configured subnets).
    Both the isolation flag and the VPC binding are immutable on the SageMaker model, so an existing non-compliant endpoint
    cannot be patched — it must be redeployed and re-registered, which for a running endpoint means recreating the hosted
    instances. Validate the isolated deployment against real inference traffic before rolling it out broadly, since isolation
    can break a model that was silently relying on network egress. Page 412
  references:
  - 1. NIST SP 800-53:rev5:SC-7 (21)
  - '2. NIST CSF 2.0: PR.IR-01'
  page_start: 412
  audit_raw: "Pre-requisite: perform these checks in each account and Region that deploys Amazon\nBedrock Marketplace model\
    \ endpoints. Bedrock enumerates the endpoints, but the\nnetwork-isolation state lives only on the underlying SageMaker\
    \ model, so the audit\nresolves each endpoint to its model through the SageMaker endpoint and endpoint\nconfiguration.\
    \ An account that deploys no Marketplace endpoints has nothing to check.\n1. List the Bedrock Marketplace model endpoints\
    \ in the Region:\naws bedrock list-marketplace-model-endpoints --region <region>\nEach entry under marketplaceModelEndpoints\
    \ has an endpointArn — the ARN of the\nSageMaker endpoint hosting the model — and a modelSourceIdentifier. If the list\
    \ is\nempty, no Marketplace endpoints are deployed and this recommendation does not\napply in the Region. Otherwise, run\
    \ the remaining steps for each endpoint. The\nendpoint name is the segment of the endpointArn after endpoint/.\n2. Resolve\
    \ the endpoint's configuration:\naws sagemaker describe-endpoint --region <region> --endpoint-name <endpoint-name>\nRead\
    \ the EndpointConfigName field in the response.\n3. Resolve the model or models behind that configuration:\naws sagemaker\
    \ describe-endpoint-config --region <region> --endpoint-config-name\n<endpoint-config-name>\nRead each ModelName under\
    \ ProductionVariants.\n4. For each ModelName, read the network settings on the model itself:\naws sagemaker describe-model\
    \ --region <region> --model-name <model-name>\nIn the response, EnableNetworkIsolation must be true, and VpcConfig must\
    \ be present\nwith non-empty SecurityGroupIds and Subnets. A model whose EnableNetworkIsolation\nis false, or that has\
    \ no VpcConfig, fails this recommendation.\nThe environment passes this recommendation when, for every Marketplace model\n\
    endpoint in the Region:\n• The backing SageMaker model reports EnableNetworkIsolation set to true, and\n• That model has\
    \ a VpcConfig with at least one subnet and at least one security\ngroup.\n Page 413"
  remediation: 'Both the isolation flag and the VPC binding are immutable on the SageMaker model, so

    an existing non-compliant endpoint cannot be patched — it must be redeployed and reregistered, which for a running endpoint
    means recreating the hosted instances.

    1. Prepare the isolated network. Use, or create, private subnets and a security

    group for the endpoint. Because network isolation blocks the container from all

    network access, stage the model artifacts where SageMaker can load them over

    the private path — typically an S3 bucket reachable through an S3 VPC endpoint

    from the subnets — and confirm the model needs no network egress at inference

    time.

    2. Create the SageMaker model with network isolation enabled and a VPC

    configuration. Point the container at the Marketplace model''s image and staged

    artifacts:

    aws sagemaker create-model --region <region> --model-name <model-name> --executionrole-arn <role-arn> --primary-container
    Image=<container-image>,ModelDataUrl=<s3model-artifact-uri> --enable-network-isolation --vpc-config SecurityGroupIds=<sgid>,Subnets=<subnet-az1>,<subnet-az2>

    3. Create an endpoint configuration that references the model, then create the

    endpoint. For a model-based configuration the isolation and VPC settings come

    from the model, so they are not repeated here:

    aws sagemaker create-endpoint-config --region <region> --endpoint-config-name

    <endpoint-config-name> --production-variants

    VariantName=AllTraffic,ModelName=<modelname>,InitialInstanceCount=1,InstanceType=<ml.instancetype>,InitialVariantWeight=1.0

    aws sagemaker create-endpoint --region <region> --endpoint-name <endpoint-name> --

    endpoint-config-name <endpoint-config-name>

    4. Register the endpoint with Bedrock Marketplace so it can be invoked through the

    Bedrock APIs. The model-source identifier is the Marketplace model''s hubcontent ARN:

    aws bedrock register-marketplace-model-endpoint --region <region> --endpointidentifier <sagemaker-endpoint-arn> --model-source-identifier
    <marketplace-modelarn>

    5. Remove the endpoint being replaced. Deregister it from Bedrock Marketplace if it

    was registered, then delete the old SageMaker endpoint so it stops serving

    traffic.'
  checks:
  - type: manual_review
    info: 'Pre-requisite: perform these checks in each account and Region that deploys Amazon

      Bedrock Marketplace model endpoints. Bedrock enumerates the endpoints, but the

      network-isolation state lives only on the underlying SageMaker model, so the audit

      resolves each endpoint to its model through the SageMaker endpoint and endpoint

      configuration. An account that deploys no Marketplace endpoints has nothing to check.

      1. List the Bedrock Marketplace model endpoints in the Region:

      aws bedrock list-marketpla'
    severity: medium
