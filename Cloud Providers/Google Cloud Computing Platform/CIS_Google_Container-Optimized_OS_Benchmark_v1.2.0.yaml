- id: 4.1.2.1
  title: Ensure journald is configured to compress large log files
  scoring: scored
  profile:
  - Level 2 - Server
  description: The journald system includes the capability of compressing overly large files to avoid filling up the system
    with logs or making the logs unmanageably large.
  rationale: Uncompressed large files may unexpectedly fill a filesystem leading to resource unavailability. Compressing logs
    prior to write can prevent sudden, unexpected filesystem impacts.
  impact: ''
  references:
  - 1. https://github.com/konstruktoid/hardening/blob/master/systemd.adoc#etcsystemd
  page_start: 123
  audit_raw: 'Review /etc/systemd/journald.conf and verify that large files will be compressed:

    # grep -e Compress /etc/systemd/journald.conf

    # Compress=yes'
  remediation: 'Edit the /etc/systemd/journald.conf file and add the following line:

    Compress=yes

    Reload the configuration to be effective.

    # systemctl force-reload systemd-journald

    /etc is stateless on Container-Optimized OS. Therefore, /etc cannot be used to make

    these changes persistent across reboots. The steps mentioned above needs to be

    performed after every boot.'
  checks:
  - type: manual_review
    info: 'Review /etc/systemd/journald.conf and verify that large files will be compressed:

      # grep -e Compress /etc/systemd/journald.conf

      # Compress=yes'
    severity: medium
- id: 4.1.2.2
  title: Ensure journald is configured to write logfiles to persistent disk
  scoring: scored
  profile:
  - Level 1 - Server
  description: Data from journald may be stored in volatile memory or persisted locally on the server. Logs in memory will
    be lost upon a system reboot. By persisting logs to local disk on the server they are protected from loss.
  rationale: Writing log data to disk will provide the ability to forensically reconstruct events which may have impacted
    the operations or security of a system even after a system crash or reboot.
  impact: ''
  references:
  - 1. https://github.com/konstruktoid/hardening/blob/master/systemd.adoc#etcsystemd
  page_start: 125
  audit_raw: 'Review /etc/systemd/journald.conf and verify that logs are persisted to disk:

    # grep -e Storage /etc/systemd/journald.conf

    # Storage=persistent'
  remediation: 'Edit the /etc/systemd/journald.conf file and add the following line:

    Storage=persistent

    /etc is stateless on Container-Optimized OS. Therefore, /etc cannot be used to make

    these changes persistent across reboots. The steps mentioned above needs to be

    performed after every boot.'
  checks:
  - type: manual_review
    info: 'Review /etc/systemd/journald.conf and verify that logs are persisted to disk:

      # grep -e Storage /etc/systemd/journald.conf

      # Storage=persistent'
    severity: medium
