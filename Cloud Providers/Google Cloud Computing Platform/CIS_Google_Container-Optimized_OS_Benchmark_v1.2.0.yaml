- id: 1.1.13
  title: Disable Automounting
  scoring: scored
  profile:
  - Level 1 - Server
  description: autofs allows automatic mounting of devices, typically including CD/DVDs and USB drives.
  rationale: With automounting enabled anyone with physical access could attach a USB drive or disc and have its contents
    available in system even if they lacked permissions to mount it themselves.
  impact: The use of portable hard drives is very common for workstation users. If your organization allows the use of portable
    storage or media on workstations and physical access controls to workstations is considered adequate there is little value
    add in turning off automounting.
  references: []
  page_start: 34
  audit_raw: '# systemctl is-enabled autofs

    disabled

    Verify result is not "enabled".'
  remediation: 'Run the following command to disable autofs:

    # systemctl disable autofs'
  checks:
  - type: manual_review
    info: '# systemctl is-enabled autofs

      disabled

      Verify result is not "enabled".'
    severity: medium
- id: 1.2.1
  title: Ensure dm-verity is enabled
  scoring: scored
  profile:
  - Level 1 - Server
  description: device-mapper-verity (dm-verity) kernel feature feature provides transparent integrity checking of block devices
    using a cryptographic digest provided by the kernel crypto API. When a dm-verity device is configured, it is expected
    that the caller has been authenticated in some way (cryptographic signatures, etc). After instantiation, all hashes will
    be verified on-demand during disk access. If they cannot be verified up to the root node of the tree, the root hash, then
    the I/O will fail. This should detect tampering with any data on the device and the hash data.
  rationale: The Container-Optimized OS root filesystem is always mounted as read-only. Additionally, its checksum is computed
    at build time and verified by the kernel on each boot. This mechanism prevents against attackers from "owning" the machine
    through permanent local changes.
  impact: ''
  references:
  - '1. AIDE stable manual: http://aide.sourceforge.net/stable/manual.html'
  page_start: 37
  audit_raw: 'Verify dm-verity is enabled in kernel config with the following command:

    # zcat /proc/config.gz | grep CONFIG_DM_VERITY

    CONFIG_DM_VERITY=y'
  remediation: An OS image update that has the dm-verity enabled kernel is required.
  checks:
  - type: command
    command: '# zcat /proc/config.gz | grep CONFIG_DM_VERITY'
    expected: ''
    severity: medium
    info: 'Verify dm-verity is enabled in kernel config with the following command:

      # zcat /proc/config.gz | grep CONFIG_DM_VERITY

      CONFIG_DM_VERITY=y'
- id: 1.3.1
  title: Ensure authentication required for single user mode
  scoring: scored
  profile:
  - Level 1 - Server
  description: Single user mode (rescue mode) is used for recovery when the system detects an issue during boot or by manual
    selection from the bootloader.
  rationale: Requiring authentication in single user mode (rescue mode) prevents an unauthorized user from rebooting the system
    into single user to gain root privileges without credentials.
  impact: ''
  references: []
  page_start: 40
  audit_raw: 'Run the following commands and verify that /sbin/sulogin or /usr/sbin/sulogin is

    used as shown:

    # grep /systemd-sulogin-shell /usr/lib/systemd/system/rescue.service

    ExecStart=-/usr/lib/systemd/systemd-sulogin-shell rescue

    # grep /systemd-sulogin-shell /usr/lib/systemd/system/emergency.service

    ExecStart=-/usr/lib/systemd/systemd-sulogin-shell emergency'
  remediation: 'Rootfs is read-only file system. Therefore, update to an OS image which requires single

    user mode authentication.'
  checks:
  - type: manual_review
    info: 'Run the following commands and verify that /sbin/sulogin or /usr/sbin/sulogin is

      used as shown:

      # grep /systemd-sulogin-shell /usr/lib/systemd/system/rescue.service

      ExecStart=-/usr/lib/systemd/systemd-sulogin-shell rescue

      # grep /systemd-sulogin-shell /usr/lib/systemd/system/emergency.service

      ExecStart=-/usr/lib/systemd/systemd-sulogin-shell emergency'
    severity: medium
- id: '1.4'
  title: Additional Process Hardening 1.4.1 Ensure core dumps are restricted
  scoring: scored
  profile:
  - Level 2 - Server
  description: A core dump is the memory of an executable program. It is generally used to determine why a program aborted.
    It can also be used to glean confidential information from a core file. The system provides the ability to set a soft
    limit for core dumps, but this can be overridden by the user.
  rationale: Setting a hard limit on core dumps prevents users from overriding the soft variable. If core dumps are required,
    consider setting limits for user groups (see limits.conf(5) ). In addition, setting the fs.suid_dumpable variable to 0
    will prevent setuid programs from dumping core.
  impact: ''
  references: []
  page_start: 41
  audit_raw: 'Run the following commands and verify output matches:

    # grep "hard core" /etc/security/limits.conf /etc/security/limits.d/*

    * hard core 0

    # sysctl fs.suid_dumpable

    fs.suid_dumpable = 0

    Run the following commands to check if systemd-coredump is installed:

    # systemctl is-enabled systemd-coredump@.service

    # systemctl is-enabled systemd-coredump.socket

    if static is returned systemd-coredump is installed'
  remediation: 'Add the following line to /etc/security/limits.conf or a

    /etc/security/limits.d/* file:

    * hard core 0

    Run the following command to set the active kernel parameter:

    # sysctl -w fs.suid_dumpable=0

    If systemd-coredump@ is installed:

    edit /etc/systemd/coredump.conf and add/modify the following lines:

    Storage=none

    ProcessSizeMax=0

    Run the command:

    systemctl daemon-reload

    /etc is stateless on Container-Optimized OS. Therefore, /etc cannot be used to make

    these changes persistent across reboots. The steps mentioned above needs to be

    performed after every boot.'
  checks:
  - type: manual_review
    info: 'Run the following commands and verify output matches:

      # grep "hard core" /etc/security/limits.conf /etc/security/limits.d/*

      * hard core 0

      # sysctl fs.suid_dumpable

      fs.suid_dumpable = 0

      Run the following commands to check if systemd-coredump is installed:

      # systemctl is-enabled systemd-coredump@.service

      # systemctl is-enabled systemd-coredump.socket

      if static is returned systemd-coredump is installed'
    severity: medium
- id: 1.4.2
  title: Ensure XD/NX support is enabled
  scoring: scored
  profile:
  - Level 1 - Server
  description: The NX bit (no-execute) is a technology used in CPUs to segregate areas of memory for use by either storage
    of processor instructions or for storage of data. An operating system with support for the NX bit may mark certain areas
    of memory as nonexecutable. The processor will then refuse to execute any code residing in these areas of memory. This
    ability can help prevent exploitation of buffer overflow vulnerabilities and should be activated whenever possible. Recent
    processors in the x86 family support the ability to prevent code execution on a per memory page basis. On AMD processors,
    this ability is called No Execute (NX), on Intel processors it is called Execute Disable (XD) and on ARM processors it
    is called Execute Never (XN). Extra steps must be taken to ensure that this protection is enabled, particularly on 32-bit
    x86 systems. Other processors, such as Itanium and POWER, have included such support since inception and the standard
    kernel for those platforms supports the feature. Starting from ARMv6, the XN bit is supported by default and the kernel
    cannot disable it. For this reason, this recommend is not applicable for Container-Optimized OS ARM images.
  rationale: Enabling any feature that can protect against buffer overflow attacks enhances the security of the system.
  impact: ''
  references: []
  page_start: 44
  audit_raw: 'Run the following command and verify your kernel has identified and activated NX/XD

    protection.

    # journalctl | grep ''protection: active''

    kernel: NX (Execute Disable) protection: active

    OR

    on systems without journalctl

    [[ -n $(grep noexec[0-9]*=off /proc/cmdline) || -z $(grep -E -i '' (pae|nx) ''

    /proc/cpuinfo) || -n $(grep ''\sNX\s.*\sprotection:\s'' /var/log/dmesg | grep -

    v active) ]] && echo "NX Protection is not active"

    Nothing should be returned'
  remediation: 'On 32 bit systems install a kernel with PAE support, no installation is required on 64 bit

    systems:

    If necessary configure your bootloader to load the new kernel and reboot the system.

    You may need to enable NX or XD support in your bios.'
  checks:
  - type: command
    command: '# journalctl | grep ''protection: active'' && /proc/cpuinfo) || -n $(grep ''\sNX\s.*\sprotection:\s'' /var/log/dmesg
      | grep -'
    expected: ''
    severity: medium
    info: 'Run the following command and verify your kernel has identified and activated NX/XD

      protection.

      # journalctl | grep ''protection: active''

      kernel: NX (Execute Disable) protection: active

      OR

      on systems without journalctl

