- id: 5.3.4
  title: Ensure default user umask is 027 or more restrictive
  scoring: scored
  profile:
  - Level 2 - Server
  description: The default umask determines the permissions of files created by users. The user creating the file has the
    discretion of making their files and directories readable by others via the chmod command. Users who wish to allow their
    files and directories to be readable by others by default may choose a different default umask by inserting the umask
    command into the standard shell configuration files ( .profile , .bashrc , etc.) in their home directories.
  rationale: Setting a very secure default value for umask ensures that users make a conscious choice about their file permissions.
    A default umask setting of 077 causes files and directories created by users to not be readable by any other user on the
    system. A umask of 027 would make files and directories readable by users in the same Unix group, while a umask of 022
    would make files readable by every user on the system.
  impact: ''
  references: []
  page_start: 190
  audit_raw: 'Run the following commands and verify all umask lines returned are 027 or more

    restrictive.

    # grep "umask" /etc/bash/bashrc

    umask 027

    # grep "umask" /etc/profile /etc/profile.d/*.sh

    umask 027'
  remediation: 'Edit the /etc/bash/bashrc, /etc/profile and /etc/profile.d/*.sh files (and the

    appropriate files for any other shell supported on your system) and add or edit any

    umask parameters as follows:

    umask 027'
  checks:
  - type: manual_review
    info: 'Run the following commands and verify all umask lines returned are 027 or more

      restrictive.

      # grep "umask" /etc/bash/bashrc

      umask 027

      # grep "umask" /etc/profile /etc/profile.d/*.sh

      umask 027'
    severity: medium
