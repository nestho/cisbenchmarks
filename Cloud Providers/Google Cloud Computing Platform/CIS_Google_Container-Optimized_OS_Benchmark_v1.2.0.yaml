- id: '5.5'
  title: Ensure access to the su command is restricted
  scoring: scored
  profile:
  - Level 1 - Server
  description: The su command allows a user to run a command or shell as another user. The program has been superseded by
    sudo , which allows for more granular control over privileged access. Normally, the su command can be executed by any
    user. By uncommenting the pam_wheel.so statement in /etc/pam.d/su , the su command will only allow users in the wheel
    group to execute su .
  rationale: Restricting the use of su , and using sudo in its place, provides system administrators better control of the
    escalation of user privileges to execute privileged commands. The sudo utility also provides a better logging and audit
    mechanism, as it can log each command executed via sudo , whereas su can only record that a user executed the su program.
  impact: ''
  references: []
  page_start: 195
  audit_raw: 'Run the following command and verify output includes matching line:

    # grep pam_wheel.so /etc/pam.d/su

    auth required pam_wheel.so use_uid

    Run the following command and verify users in wheel group match site policy:

    # grep wheel /etc/group

    wheel:!:10:root,<user list>'
  remediation: 'Add the following line to the /etc/pam.d/su file:

    auth required pam_wheel.so use_uid

    Create a comma separated list of users in the wheel statement in the /etc/group file:

    wheel:!:10:root,<user list>

    /etc is stateless on Container-Optimized OS. Therefore, /etc cannot be used to make

    these changes persistent across reboots. The steps mentioned above needs to be

    performed after every boot.'
  checks:
  - type: manual_review
    info: 'Run the following command and verify output includes matching line:

      # grep pam_wheel.so /etc/pam.d/su

      auth required pam_wheel.so use_uid

      Run the following command and verify users in wheel group match site policy:

      # grep wheel /etc/group

      wheel:!:10:root,<user list>'
    severity: medium
