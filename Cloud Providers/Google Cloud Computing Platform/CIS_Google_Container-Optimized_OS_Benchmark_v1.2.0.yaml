controls:
- id: 1.1.1.1
  title: Ensure mounting of udf filesystems is disabled
  scoring: scored
  profile:
  - Level 2 - Server
  description: The udf filesystem type is the universal disk format used to implement ISO/IEC 13346 and ECMA-167 specifications.
    This is an open vendor filesystem type for data storage on a broad range of media. This filesystem type is necessary to
    support writing DVDs and newer optical disc formats.
  rationale: Removing support for unneeded filesystem types reduces the local attack surface of the system. If this filesystem
    type is not needed, disable it.
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'Run the following commands and verify the output is as indicated:

    # modprobe -n -v udf

    install /bin/true

    # lsmod | grep udf

    <No output>'
  remediation: 'Edit or create a file in the /etc/modprobe.d/ directory ending in .conf

    Example: vim /etc/modprobe.d/udf.conf

    and add the following line:

    install udf /bin/true

    Run the following command to unload the udf module:

    # rmmod udf'
  checks:
  - type: command
    command: '# lsmod | grep udf'
    expected: ''
    severity: medium
    info: 'Run the following commands and verify the output is as indicated:

      # modprobe -n -v udf

      install /bin/true

      # lsmod | grep udf

      <No output>'
- id: 1.1.2
  title: Ensure /tmp is configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: The /tmp directory is a world-writable directory used for temporary storage by all users and some applications.
  rationale: Making /tmp its own file system allows an administrator to set the noexec option on the mount, making /tmp useless
    for an attacker to install executable code. It would also prevent an attacker from establishing a hardlink to a system
    setuid program and wait for it to be updated. Once the program was updated, the hardlink would be broken and the attacker
    would have his own copy of the program. If the program happened to have a security vulnerability, the attacker could continue
    to exploit the known flaw. This can be accomplished by either mounting tmpfs to /tmp, or creating a separate partition
    for /tmp.
  impact: Since the /tmp directory is intended to be world-writable, there is a risk of resource exhaustion if it is not bound
    to a separate partition. Running out of /tmp space is a problem regardless of what kind of filesystem lies under it, but
    in a default installation a disk-based /tmp will essentially have the whole disk available, as it only creates a single
    / partition. On the other hand, a RAM-based /tmp as with tmpfs will almost certainly be much smaller, which can lead to
    applications filling up the filesystem much more easily. /tmp utilizing tmpfs can be resized using the size={size} parameter
    on the Options line on the tmp.mount file
  references:
  - 1. AJ Lewis, "LVM HOWTO", http://tldp.org/HOWTO/LVM-HOWTO/
  - 2. https://www.freedesktop.org/wiki/Software/systemd/APIFileSystems/
  page_start: 21
  audit_raw: 'Run the following command and verify output shows /tmp is mounted:

    # mount | grep -E ''\s/tmp\s''

    tmpfs on /tmp type tmpfs (rw,nosuid,nodev,noexec,relatime)

    Run the following command and verify that output shows static

    # systemctl is-enabled tmp.mount

    static'
  remediation: 'Run the following commands to configure mount options

    systemctl edit tmp.mount

    Edit the file to define the options that needs to be set. For example:

    [Mount]

    Options=

    Options=mode=1777,strictatime,noexec,nodev,nosuid

    Restart the tmp.mount

    systemctl daemon-reload # might be optional

    systemctl restart tmp.mount

    /etc is stateless on Container-Optimized OS. Therefore, /etc cannot be used to make

    these changes persistent across reboots. The steps mentioned above needs to be

    performed after every boot.'
  checks:
  - type: command
    command: '# mount | grep -E ''\s/tmp\s'''
    expected: Run the following command and verify that output shows static
    severity: medium
    info: 'Run the following command and verify output shows /tmp is mounted:

      # mount | grep -E ''\s/tmp\s''

      tmpfs on /tmp type tmpfs (rw,nosuid,nodev,noexec,relatime)

      Run the following command and verify that output shows static

      # systemctl is-enabled tmp.mount

      static'
- id: 1.1.3
  title: Ensure nodev option set on /tmp partition
  scoring: scored
  profile:
  - Level 1 - Server
  description: The nodev mount option specifies that the filesystem cannot contain special devices.
  rationale: Since the /tmp filesystem is not intended to support devices, set this option to ensure that users cannot attempt
    to create block or character special devices in /tmp .
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'Verify that the nodev option is set if a /tmp partition exists

    Run the following command and verify that nothing is returned:

    # mount | grep -E ''\s/tmp\s'' | grep -v nodev'
  remediation: 'Run the following command to remount /tmp :

    # mount -o remount,nodev /tmp

    /etc is stateless on Container-Optimized OS. Therefore, /etc cannot be used to make

    these changes persistent across reboots. The steps mentioned above needs to be

    performed after every boot.'
  checks:
  - type: command
    command: '# mount | grep -E ''\s/tmp\s'' | grep -v nodev'
    expected: Verify that the nodev option is set if a /tmp partition exists
    severity: medium
    info: 'Verify that the nodev option is set if a /tmp partition exists

      Run the following command and verify that nothing is returned:

      # mount | grep -E ''\s/tmp\s'' | grep -v nodev'
