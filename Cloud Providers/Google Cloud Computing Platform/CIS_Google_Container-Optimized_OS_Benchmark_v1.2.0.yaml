    and which files are to be used to log certain classes of messages. An image using fluent-bit uses /usr/share/fluent-bit/fluentbit.conf
    for the same purpose.
  rationale: A great deal of important security-related information is sent via logging (e.g., successful and failed su attempts,
    failed login attempts, root login attempts, etc.).
  impact: ''
  references:
  - 1. See the rsyslog.conf(5) man page for more information.
  page_start: 120
  audit_raw: 'Review the contents of the /etc/stackdriver/logging.config.d/*.conf if using an image with

    stackdriver or /usr/share/fluent-bit/fluent-bit.conf if using an image with fluent-bit to

    ensure appropriate logging is set. In addition, run the following command and verify that

    the log files are logging information:

    # ls -l /var/log/'
  remediation: 'Edit the contents of /etc/stackdriver/logging.config.d/*.conf if using an image

    with stackdriver or /usr/share/fluent-bit/fluent-bit.conf if using an image with

