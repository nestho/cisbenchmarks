- id: '7.17'
  title: Ensure default Service account is not used for Project access in Kubernetes Clusters
  scoring: scored
  profile:
  - Level 2
  description: A service account is an identity that an instance or an application can use to run API requests on your behalf.
    This identity is used to identify applications running on your virtual machine instances to other Google Cloud Platform
    services. By default, Kubernetes Engine nodes are given the Compute Engine default service account. This account has broad
    access by default, making it useful to a wide variety of applications, but it has more permissions than are required to
    run your Kubernetes Engine cluster.
  rationale: You should create and use a minimally privileged service account to run your Kubernetes Engine cluster instead
    of using the Compute Engine default service account. If you are not creating a separate service account for your nodes,
    you should limit the scopes of the node service account to reduce the possibility of a privilege escalation in an attack.
    Kubernetes Engine requires, at a minimum, the service account to have the monitoring.viewer, monitoring.metricWriter,
    and logging.logWriter roles. This ensures that your default service account does not have permissions beyond those necessary
    to run your cluster. While the default scopes are limited, they may include scopes beyond the minimally required scopes
    needed to run your cluster.
  impact: ''
  references:
