- id: '2.1'
  title: Ensure that Cloud Audit Logging is configured properly across all services and all users from a project
  scoring: scored
  profile:
  - Level 1
  description: It is recommended that Cloud Audit Logging is configured to track all Admin activities and read, write access
    to user data.
  rationale: 'Cloud Audit Logging maintains two audit logs for each project and organization: Admin Activity and Data Access.
    1. Admin Activity logs contain log entries for API calls or other administrative actions that modify the configuration
    or metadata of resources. Admin Activity audit logs are enabled for all services and cannot be configured. 2. Data Access
    audit logs record API calls that create, modify, or read user-provided data. These are disabled by default and should
    be enabled. There are three kinds of Data Access audit log information: o Admin read: Records operations that read metadata
    or configuration information. Admin Activity audit logs record writes of metadata and configuration information which
    cannot be disabled. o Data read: Records operations that read user-provided data. o Data write: Records operations that
    write user-provided data. It is recommended to have effective default audit config configured in such a way that: 1. logtype
    is set to DATA_READ (to logs user activity tracking) and DATA_WRITES (to log changes/tampering to user data) 2. audit
    config is enabled for all the services supported by Data Access audit logs feature 3. Logs should be captured for all
    users. i.e. there are no exempted users in any of the audit config section. This will ensure overriding audit config will
    not contradict the requirement.'
  impact: There is no charge for Admin Activity audit logs. Enabling the Data Access audit logs might result in your project
    being charged for the additional logs usage.
  references:
  - 1. https://cloud.google.com/logging/docs/audit/
  - 2. https://cloud.google.com/logging/docs/audit/https://cloud.google.com/logging/d
  page_start: 46
  audit_raw: "Using Command line:\n46 | P a g e\n1. Run command:\ngcloud projects get-iam-policy [PROJECT_ID]\n2. Policy should\
    \ have default auditConfigs section which should have logtype set to\nDATA_WRITES and DATA_READ for all services.\nSample\
    \ output for default audit configs may looks like this:\n auditConfigs:\n - auditLogConfigs:\n - logType: ADMIN_READ\n\
    \ - logType: DATA_WRITE\n - logType: DATA_READ\n service: allServices\n3. Any of the auditConfigs sections should not\
    \ have parameter \"exemptedMembers:\"\nset which will ensure that Logging is enabled for all users and no user is exempted."
  remediation: "Using Command Line:\n1. To Read project's IAM policy and store it in a file run a command:\ngcloud projects\
    \ get-iam-policy [PROJECT_ID] > /tmp/policy.yaml\n2. Edit policy in /tmp/policy.yaml, adding or changing only the audit\
    \ logs\nconfiguration to:\nauditConfigs:\n- auditLogConfigs:\n - logType: DATA_WRITE\n - logType: DATA_READ\n service:\
    \ allServices\nNote: exemptedMembers: is not set as audit logging should be enabled for all the users\n3. To write new\
