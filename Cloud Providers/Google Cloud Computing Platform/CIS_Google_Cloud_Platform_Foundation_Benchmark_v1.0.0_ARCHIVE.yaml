  description: Container-Optimized OS is an operating system image for your Compute Engine VMs that is optimized for running
    Docker containers. With Container-Optimized OS, you can bring up your Docker containers on Google Cloud Platform quickly,
    efficiently, and securely.
  rationale: 'The Container-Optimized OS node image is based on a recent version of the Linux kernel and is optimized to enhance
    node security. It is backed by a team at Google that can quickly patch it for security and iterate on features. The Container-Optimized
    OS image provides better support, security, and stability than previous images. Container-Optimized OS requires Kubernetes
    version 1.4.0 or higher. Enabling Container-Optimized OS provides the following benefits: • Run Containers Out of the
    Box: Container-Optimized OS instances come preinstalled with the Docker runtime and cloud-init. With a Container-Optimized
    OS instance, you can bring up your Docker container at the same time you create your VM, with no on-host setup required.
    • Smaller attack surface: Container-Optimized OS has a smaller footprint, reducing your instance''s potential attack surface.
    • Locked-down by default: Container-Optimized OS instances include a locked-down firewall and other security settings
    by default. • Automatic Updates: Container-Optimized OS instances are configured to automatically download weekly updates
    in the background; only a reboot is necessary to use the latest updates.'
  impact: Upgrade operation is long-running and will block other operations on the cluster (including delete) until it has
    run to completion.
