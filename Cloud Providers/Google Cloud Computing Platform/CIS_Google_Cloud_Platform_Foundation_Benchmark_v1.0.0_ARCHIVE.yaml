- id: '2.2'
  title: Ensure that sinks are configured for all Log entries
  scoring: scored
  profile:
  - Level 1
  description: It is recommended to create sink which will export copies of all the log entries.
  rationale: Log entries are held in Stackdriver Logging for a limited time known as the retention period. After that, the
    entries are deleted. To keep log entries longer, sink can export them outside of Stackdriver Logging. Exporting involves
    writing a filter that selects the log entries to export, and choosing a destination in Cloud Storage, BigQuery, or Cloud
    Pub/Sub. The filter and destination are held in an object called a sink. To ensure all log entries are exported using
    sink ensure that there is no filter configured for a sink. Sinks can be created in projects, organizations, folders, and
    billing accounts.
  impact: There are no costs or limitations in Stackdriver Logging for exporting logs, but the export destinations charge
    for storing or transmitting the log data.
  references:
  - 1. https://cloud.google.com/logging/docs/reference/tools/gcloudlogginghttps://cloud.google.com/logging/quotas
  - 2. https://cloud.google.com/logging/quotas
  page_start: 49
  audit_raw: 'From Console:

    1. Go to Logging/Exports by visiting

    https://console.cloud.google.com/logs/exports?

    2. For every sing, click 3 dot button for Menu option and select View Filter.

    3. Ensure that there is at least one sink with empty Sink Filter

    4. Additionally for Sink with empty sink filter, Ensure resource mentioned in

    Destination Exists.

    Via CLI gcloud:

    1. Ensure sink with empty filter exists:

    gcloud logging sinks list

    Output should list at least one sink with empty filter.

    2. Additionally Ensure that Destination for a sink with Empty filter exists.

    If sink is destined to a Specific Cloud Storage Bucket ensure Destination Storage

    bucket exists using CLI gsutils:

    gsutil list | grep <destination_Bucket_name>

    49 | P a g e

    should not return empty Output.'
  remediation: 'From Console:

