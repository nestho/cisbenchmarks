  title: Ensure Private Google Access is set on Kubernetes Engine Cluster Subnets
  scoring: scored
  profile:
  - Level 1
  description: Private Google Access enables your cluster hosts, which have only private IP addresses, to communicate with
    Google APIs and services using an internal IP address rather than an external IP address. External IP addresses are routable
    and reachable over the Internet. Internal (private) IP addresses are internal to Google Cloud Platform and are not routable
    or reachable over the Internet. You can use Private Google Access to allow VMs without Internet access to reach Google
    APIs, services, and properties that are accessible over HTTP/HTTPS.
  rationale: VPC networks and subnetworks provide logically isolated and secure network partitions where you can launch GCP
    resources. When Private Google Access is enabled, VM instances in a subnet can reach the Google Cloud and Developer APIs
    and services without needing an external IP address. Instead, VMs can use their internal IP addresses to access Google
    managed services. Instances with external IP addresses are not affected when you enable the ability to access Google services
    from internal IP addresses. These instances can still connect to Google APIs and managed services.
  impact: Instances with external IP addresses are not affected when you enable the ability to access Google services from
    internal IP addresses. These instances can still connect to Google APIs and managed services.
