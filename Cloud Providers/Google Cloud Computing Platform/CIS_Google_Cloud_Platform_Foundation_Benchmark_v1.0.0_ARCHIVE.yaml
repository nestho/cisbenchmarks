  title: Ensure Kubernetes Cluster is created with Alias IP ranges enabled
  scoring: scored
  profile:
  - Level 1
  description: Google Cloud Platform Alias IP Ranges lets you assign ranges of internal IP addresses as aliases to a virtual
    machine's network interfaces. This is useful if you have multiple services running on a VM and you want to assign each
    service a different IP address.
  rationale: 'With Alias IPs ranges enabled, Kubernetes Engine clusters can allocate IP addresses from a CIDR block known
    to Google Cloud Platform. This makes your cluster more scalable and allows your cluster to better interact with other
    GCP products and entities. Using Alias IPs has several benefits: • Pod IPs are reserved within the network ahead of time,
    which prevents conflict with other compute resources. • The networking layer can perform anti-spoofing checks to ensure
    that egress traffic is not sent with arbitrary source IPs. • Firewall controls for Pods can be applied separately from
    their nodes. • Alias IPs allow Pods to directly access hosted services without using a NAT gateway.'
  impact: You cannot currently migrate an existing cluster that uses routes for Pod routing to a cluster that uses Alias IPs.
    Cluster IPs for internal Services remain only available from within the cluster. If you want to access a Kubernetes Service
    from within the VPC, but from outside of the cluster, use an internal load balancer.
  references:
  - 1. https://cloud.google.com/kubernetes-engine/docs/how-to/alias-ips
  - 2. https://cloud.google.com/vpc/docs/alias-ip
