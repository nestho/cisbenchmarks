- id: '3.3'
  title: Ensure that DNSSEC is enabled for Cloud DNS
  scoring: scored
  profile:
  - Level 1
  description: Cloud DNS is a fast, reliable and cost-effective Domain Name System that powers millions of domains on the
    internet. DNSSEC in Cloud DNS enables domain owners to take easy steps to protect their domains against DNS hijacking
    and man-in-the-middle and other attacks.
  rationale: Domain Name System Security Extensions (DNSSEC) adds security to the Domain Name System (DNS) protocol by enabling
    DNS responses to be validated. Having a trustworthy Domain Name System (DNS) that translates a domain name like www.example.com
    into its associated IP address is an increasingly important building block of today’s web-based applications. Attackers
    can hijack this process of domain/IP lookup and redirect users to a malicious site through DNS hijacking and man-in-the-middle
    attacks. DNSSEC helps mitigate the risk of such attacks by cryptographically signing DNS records. As a result, it prevents
    attackers from issuing fake DNS responses that may misdirect browsers to nefarious websites.
  impact: ''
  references:
  - 1. https://cloudplatform.googleblog.com/2017/11/DNSSEC-now-available-in-CloudDNS.html
  - 2. https://cloud.google.com/dns/dnssec-config#enabling
  page_start: 99
  audit_raw: '• Go to Network services

    • For each Zone name in Cloud DNS

    • Ensure DNSSEC is set to On

    Via CLI :

    Ensure state property in below command''s output is on

    gcloud beta dns managed-zones describe <zoneName> --

    format="json(dnsName,dnssecConfig.state)"'
  remediation: '• Go to Network services

    • For each Zone name in Cloud DNS

    • Set DNSSEC to On

    Via CLI :

    Use the below command to enable DNSSEC for Cloud DNS Zone Name.

    99 | P a g e

    gcloud beta dns managed-zones update <zoneName> --dnssec-state on'
