    includes the identity of the API caller, the time of the API call, the source IP address of the API caller, the request
    parameters, and the response elements returned by the GCP services. Cloud Audit logging provides a history of AWS API
    calls for an account, including API calls made via the Console, SDKs, command line tools, and other GCP services.
