- id: '3.6'
  title: Ensure that SSH access is restricted from the internet
  scoring: scored
  profile:
  - Level 2
  description: GCP Firewall Rules are specific to a VPC Network. Each rule either allows or denies traffic when its conditions
    are met. Its conditions allow you to specify the type of traffic, such as ports and protocols, and the source or destination
    of the traffic, including IP addresses, subnets, and instances. Firewall rules are defined at the VPC network level, and
    are specific to the network in which they are defined. The rules themselves cannot be shared among networks. Firewall
    rules only support IPv4 traffic. When specifying a source for an ingress rule or a destination for an egress rule by address,
    you can only use an IPv4 address or IPv4 block in CIDR notation. Generic (0.0.0.0/0) incoming traffic from internet to
    VPC or VM instance using SSH on Port 22 can be avoided.
  rationale: GCP Firewall Rules within a VPC Network. These rules apply to outgoing (egress) traffic from instances and incoming
    (ingress) traffic to instances in the network. Egress and ingress traffic are controlled even if the traffic stays within
    the network (for example, instance-to-instance communication). For an instance to have outgoing Internet access, the network
    must have a valid Internet gateway route or custom route whose destination IP is specified. This route simply defines
    the path to the Internet, to avoid the most general (0.0.0.0/0) destination IP Range specified from Internet through SSH
    with default Port 22. We need to restrict generic access from Internet to specific IP Range.
  impact: All SSH connections from outside of the network to the concerned VPC(s) will be blocked. There could be a business
    need where ssh access is required from outside of the network to access resources associated with the VPC. In that case,
    specific source IP(s) should be mentioned in firewall rules to white-list access to SSH port for the concerned VPC(s).
  references:
  - 1. https://cloud.google.com/vpc/docs/firewalls#blockedtraffic
  page_start: 105
  audit_raw: 'From Console

    1. Go to VPC network.

    2. Go to the Firewall Rules.

    3. Ensure Port is not equal to 22 and Action is not Allow.

    4. Ensure IP Ranges is not equal to 0.0.0.0 under Source filters.

    Via CLI gcloud :

    gcloud compute firewall-rules list --

    format=table''(name,direction,sourceRanges,allowed.ports)''

    Ensure that SOURCE_RANGES column in the output of above command does not contan

    105 | P a g e

    0.0.0.0 or /0.

    If DIRECTION column is INGRESS, PORTS is set to 22 and Range includes 22 against any

    Firewall Rule.'
  remediation: 'From Console

    1. Go to VPC Network.

    2. Go to the Firewall Rules.

    3. Click the Firewall Rule you want to modify.

    4. Click Edit.

    5. Modify Source IP ranges to specific IP.

    6. Click Save.

    Via CLI gcloud :

    1.Update Firewall rule with new SOURCE_RANGE from below command:

    gcloud compute firewall-rules update FirewallName --allow=[PROTOCOL[:PORT[-

    PORT]],...] --source-ranges=[CIDR_RANGE,...]'
