  description: In Kubernetes, authorizers interact by granting a permission if any authorizer grants the permission. The legacy
    authorizer in Kubernetes Engine grants broad, statically defined permissions. To ensure that RBAC limits permissions correctly,
    you must disable the legacy authorizer. RBAC has significant security advantages, can help you ensure that users only
    have access to cluster resources within their own namespace and is now stable in Kubernetes.
  rationale: Enable Legacy Authorization for in-cluster permissions that support existing clusters or workflows. Disable legacy
    authorization for full RBAC support for in-cluster permissions. In Kubernetes, RBAC is used to grant permissions to resources
    at the cluster and namespace level. RBAC allows you to define roles with rules containing a set of permissions.
  impact: Once the cluster has the legacy authorizer disabled, you must grant your user the ability to create authorization
    roles to ensure that your role-based access control permissions take effect.
