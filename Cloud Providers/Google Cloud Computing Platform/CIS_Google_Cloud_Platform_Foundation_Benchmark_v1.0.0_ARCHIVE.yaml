- id: '4.4'
  title: Ensure 'Enable connecting to serial ports' is not enabled for VM Instance
  scoring: scored
  profile:
  - Level 1
  description: Interacting with a serial port is often referred to as the serial console, which is similar to using a terminal
    window, in that input and output is entirely in text mode and there is no graphical interface or mouse support. If you
    enable the interactive serial console on an instance, clients can attempt to connect to that instance from any IP address.
    Therefore interactive serial console support should be disabled.
  rationale: A virtual machine instance has four virtual serial ports. Interacting with a serial port is similar to using
    a terminal window, in that input and output is entirely in text mode and there is no graphical interface or mouse support.
    The instance's operating system, BIOS, and other system-level entities often write output to the serial ports, and can
    accept input such as commands or answers to prompts. Typically, these system-level entities use the first serial port
    (port 1) and serial port 1 is often referred to as the serial console. The interactive serial console does not support
    IP-based access restrictions such as IP whitelists. If you enable the interactive serial console on an instance, clients
    can attempt to connect to that instance from any IP address. This allows anybody to connect to that instance if they know
    the correct SSH key, username, project ID, zone, and instance name. Therefore interactive serial console support should
    be disabled.
  impact: ''
