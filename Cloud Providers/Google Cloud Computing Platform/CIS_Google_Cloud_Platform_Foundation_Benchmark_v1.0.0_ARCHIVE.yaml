controls:
- id: '1.1'
  title: Ensure that corporate login credentials are used instead of Gmail accounts
  scoring: scored
  profile:
  - Level 1
  description: Use corporate login credentials instead of Gmail accounts.
  rationale: Gmail accounts are personally created and controllable accounts. Organizations seldom have any control over them.
    Thus, it is recommended that you use fully managed corporate Google accounts for increased visibility, auditing, and control
    over access to Cloud Platform resources.
  impact: None.
  references:
  - 1. https://cloud.google.com/docs/enterprise/best-practices-for-enterpriseorganizations#use_corporate_login_credentials
  - 2. https://support.google.com/work/android/answer/6371476
  page_start: 12
  audit_raw: 'For each Google Cloud Platform project, list the accounts configured in that project:

    gcloud projects get-iam-policy <Project-ID> | grep gmail.com

    No Gmail accounts should be listed.'
  remediation: Follow the documentation and setup corporate login accounts.
  checks:
  - type: command
    command: gcloud projects get-iam-policy <Project-ID> | grep gmail.com
    expected: ''
    severity: medium
    info: 'For each Google Cloud Platform project, list the accounts configured in that project:

      gcloud projects get-iam-policy <Project-ID> | grep gmail.com

      No Gmail accounts should be listed.'
- id: '1.2'
  title: Ensure that multi-factor authentication is enabled for all non-service accounts
  scoring: scored
  profile:
  - Level 1
  description: Setup multi-factor authentication for Google Cloud Platform accounts.
  rationale: Multi-factor authentication requires more than one mechanism to authenticate a user. This secures your logins
    from attackers exploiting stolen or weak credentials.
  impact: None
  references:
  - 1. https://cloud.google.com/solutions/securing-gcp-account-u2f
  page_start: 14
  audit_raw: 'For each Google Cloud Platform project,

    Step 1: Identify the non-service accounts.

    Step 2: Manually verify that multi-factor authentication for each account is set.'
  remediation: 'For each Google Cloud Platform project,

    Step 1: Identify the non-service accounts.

    Step 2: Setup multi-factor authentication for each account.'
  checks:
  - type: manual_review
    info: 'For each Google Cloud Platform project,

      Step 1: Identify the non-service accounts.

      Step 2: Manually verify that multi-factor authentication for each account is set.'
    severity: medium
- id: '1.3'
  title: Ensure that there are only GCP-managed service account keys for each service account
  scoring: scored
  profile:
  - Level 1
  description: User managed service account should not have user managed keys.
  rationale: 'Anyone who has access to the keys will be able to access resources through the service account. GCP-managed
    keys are used by Cloud Platform services such as App Engine and Compute Engine. These keys cannot be downloaded. Google
    will keep the keys and automatically rotate them on an approximately weekly basis. User-managed keys are created, downloadable,
    and managed by users. They expire 10 years from creation. For user-managed keys, user have to take ownership of key management
    activities which includes: • Key storage • Key distribution • Key revocation • Key rotation • Protecting the keys from
    unauthorized users • Key recovery Even after owner''s precaution, keys can be easily leaked by common development malpractices
    like checking keys into the source code or leaving them in Downloads directory, or accidentally leaving them on support
    blogs/channels. It is recommended to prevent use of User-managed service account keys.'
  impact: Deleting User managed Service Account Keys may break communication with the applications using the corresponding
    keys
  references:
  - 1. https://cloud.google.com/iam/docs/understanding-serviceaccounts#managing_service_account_keys
  page_start: 16
  audit_raw: 'From CLI:

    List All the service accounts:

    gcloud iam service-accounts list

    Identify user managed service accounts as such account EMAIL ends with

    16 | P a g e

    iam.gserviceaccount.com

    For each user managed Service Account, list the keys managed by the user:

    gcloud iam service-accounts keys list --iam-account=<Service Account> --

    managed-by=user

    No keys should be listed.'
  remediation: 'From CLI:

    To delete User manages Service Account Key,

    gcloud iam service-accounts keys delete --iam-account=<user-managed-serviceaccount-EMAIL> <KEY-ID>'
  checks:
  - type: manual_review
    info: 'From CLI:

      List All the service accounts:

      gcloud iam service-accounts list

      Identify user managed service accounts as such account EMAIL ends with

      16 | P a g e

      iam.gserviceaccount.com

      For each user managed Service Account, list the keys managed by the user:

      gcloud iam service-accounts keys list --iam-account=<Service Account> --

      managed-by=user

      No keys should be listed.'
    severity: medium
- id: '1.4'
  title: Ensure that ServiceAccount has no Admin privileges.
  scoring: scored
  profile:
  - Level 1
  description: A service account is a special Google account that belongs to your application or a VM, instead of to an individual
    end user. Your application uses the service account to call the Google API of a service, so that the users aren't directly
    involved. It's recommended not to use admin access for ServiceAccount.
  rationale: 'Service accounts represent service-level security of the Resources (application or a VM) which can be determined
    by the roles assigned to it. Enrolling ServiceAccount with Admin rights gives full access to assigned application or a
    VM, ServiceAccount Access holder can perform critical actions like delete, update change settings etc. without the intervention
    of user, so It''s recommended not to have Admin rights. This recommendation is applicable only for User-Managed user created
    service account (Service account with nomenclature: SERVICE_ACCOUNT_NAME@PROJECT_ID.iam.gserviceaccount.com ).'
  impact: After removing *Admin or Editor or Owner role assignments from service accounts, may break functionality that uses
    impacted service accounts. Required role(s) should be assigned to impacted service accounts in order to restore broken
    functionalities.
  references:
  - 1. https://cloud.google.com/sdk/gcloud/reference/iam/service-accounts/
  - 2. https://cloud.google.com/iam/docs/understanding-roles
  page_start: 18
  audit_raw: "From Console\n1. Go to IAM & admin/IAM using https://console.cloud.google.com/iam-admin/iam\n2. Go to the Members\n\
    3. Ensure that there are no User-Managed user created service account(s) with\nroles containing *Admin or role matching\
    \ Editor or role matching Owner\nVia CLI gcloud :\n1. Get the policy that you want to modify, and write it to a JSON file:\n\
    gcloud projects get-iam-policy PROJECT_ID --format json > iam.json\n2. The contents of the JSON file will look similar\
    \ to the following. Note that role of\nmembers group associated with each serviceaccount does not contains *Admin or\n\
    does not matches roles/editor or does not matches roles/owner\nSample Json output:\n18 | P a g e\n{\n\"bindings\": [\n\
    {\n \"members\": [\n \"serviceAccount:our-project-123@appspot.gserviceaccount.com\",\n ],\n \"role\": \"roles/appengine.appAdmin\"\
    \n},\n{\n \"members\": [\n \"user:email1@gmail.com\"\n ],\n \"role\": \"roles/owner\"\n},\n{\n \"members\": [\n \"serviceAccount:our-project-123@appspot.gserviceaccount.com\"\
    ,\n \"serviceAccount:123456789012-compute@developer.gserviceaccount.com\"\n ],\n \"role\": \"roles/editor\"\n}\n],\n\"\
    etag\": \"BwUjMhCsNvY=\",\n\"version\": 1\n}"
  remediation: "From Console\n1. Go to IAM & admin/IAM using https://console.cloud.google.com/iam-admin/iam\n2. Go to the\
    \ Members\n3. Identify User-Managed user created service account with roles containing *Admin\nor role matching Editor\
    \ or role matching Owner\n4. Click Delete bin icon to remove role from member (service account in this case)\nVia CLI\
    \ gcloud :\n1. Using a text editor, Remove Role which contains roles/*Admin or matched\nroles/editor or matches 'roles/owner`.\
    \ Add a role to the bindings array that\ndefines the group members and the role for those members.\nFor example, to grant\
    \ the role roles/appengine.appViewer to the ServiceAccount which is\nroles/editor, you would change the example shown\
    \ below as follows:\n{\n\"bindings\": [\n{\n \"members\": [\n \"serviceAccount:our-project-123@appspot.gserviceaccount.com\"\
    ,\n ],\n \"role\": \"roles/appengine.appViewer\"\n19 | P a g e\n},\n{\n \"members\": [\n \"user:email1@gmail.com\"\n ],\n\
    \ \"role\": \"roles/owner\"\n },\n{\n \"members\": [\n \"serviceAccount:our-project-123@appspot.gserviceaccount.com\"\
    ,\n \"serviceAccount:123456789012-compute@developer.gserviceaccount.com\"\n ],\n \"role\": \"roles/editor\"\n}\n],\n\"\
    etag\": \"BwUjMhCsNvY=\"\n}\n2. Update the project's IAM policy:\ngcloud projects set-iam-policy PROJECT_ID iam.json"
  checks:
  - type: manual_review
    info: 'From Console

      1. Go to IAM & admin/IAM using https://console.cloud.google.com/iam-admin/iam

      2. Go to the Members

      3. Ensure that there are no User-Managed user created service account(s) with

      roles containing *Admin or role matching Editor or role matching Owner

      Via CLI gcloud :

      1. Get the policy that you want to modify, and write it to a JSON file:

      gcloud projects get-iam-policy PROJECT_ID --format json > iam.json

      2. The contents of the JSON file will look similar to the following. Note that role'
    severity: medium
- id: '1.5'
  title: Ensure that IAM users are not assigned Service Account User role at project level
  scoring: scored
  profile:
  - Level 1
  description: It is recommended to assign Service Account User (iam.serviceAccountUser) role to a user for a specific service
    account rather than assigning the role to a user at project level.
  rationale: A service account is a special Google account that belongs to application or a virtual machine (VM), instead
    of to an individual end user. Application/VM-Instance uses the service account to call the Google API of a service, so
    that the users aren't directly involved. In addition to being an identity, a service account is a resource which has IAM
    policies attached to it. These policies determine who can use the service account. Users with IAM roles to update the
    App Engine and Compute Engine instances (such as App Engine Deployer or Compute Instance Admin) can effectively run code
    as the service accounts used to run these instances, and indirectly gain access to all the resources for which the service
    accounts has access. Similarly, SSH access to a Compute Engine instance may also provide the ability to execute code as
    that instance/Service account. As per business needs, there could be multiple user-managed service accounts configured
    for a project. Granting the iam.serviceAccountUser role to a user for a project gives the user access to all service accounts
    in the project, including service accounts that may be created in the future. This can result into elevation of privileges
    by using service accounts and corresponding Compute Engine instances. In order to implement least privileges best practices,
    IAM users should not be assigned Service Account User role at project level. Instead iam.serviceAccountUser role should
    be assigned to a user for a specific service account giving a user access to the service account.
  impact: After revoking Service Account User role at project level from all impacted user account(s),Service Account User
    role should be assigned to a user(s) for specific service account(s) as per business needs.
  references:
  - 1. https://cloud.google.com/iam/docs/service-accounts
  - 2. https://cloud.google.com/iam/docs/granting-roles-to-service-accounts
  - 1. go to https://console.cloud.google.com/projectselector/iamadmin/serviceaccounts
  - 2. Select Target Project
  page_start: 22
  audit_raw: 'From Console:

    1. Go to the IAM page in the GCP Console using

    https://console.cloud.google.com/iam-admin/iam

    22 | P a g e

    2. Click on filter table text bar, Type Role: Service Account User

    3. Ensure no user is listed as a result of filter.

    Via CLI gcloud:

    To ensure IAM users are not assigned Service Account User role at project level

    gcloud projects get-iam-policy zeta-environs-192610 --format json | jq

    ''.bindings[].role'' | grep "roles/iam.serviceAccountUser"

    Command should not return any output.'
  remediation: "From Console:\n1. Go to the IAM page in the GCP Console using\nhttps://console.cloud.google.com/iam-admin/iam\n\
    2. Click on filter table text bar, Type Role: Service Account User\n3. Click Delete Bin icon in front of role Service\
    \ Account User for every user listed as\na result of a filter.\nVia CLI gcloud :\n1. Using a text editor, Remove Role\
    \ which contains roles/iam.serviceAccountUser. Add\na role to the bindings array that defines the group members and the\
    \ role for those\nmembers.\nFor example, you can use the iam.json file shown below as follows:\n{\n\"bindings\": [\n{\n\
    \ \"members\": [\n \"serviceAccount:our-project-123@appspot.gserviceaccount.com\",\n ],\n \"role\": \"roles/appengine.appViewer\"\
    \n},\n{\n \"members\": [\n \"user:email1@gmail.com\"\n ],\n \"role\": \"roles/owner\"\n },\n{\n \"members\": [\n \"serviceAccount:our-project-123@appspot.gserviceaccount.com\"\
    ,\n \"serviceAccount:123456789012-compute@developer.gserviceaccount.com\"\n ],\n \"role\": \"roles/editor\"\n}\n],\n23\
    \ | P a g e\n\"etag\": \"BwUjMhCsNvY=\"\n }\n2. Update the project's IAM policy:\ngcloud projects set-iam-policy PROJECT_ID\
    \ iam.json"
  checks:
  - type: command
    command: '''.bindings[].role'' | grep "roles/iam.serviceAccountUser"'
    expected: ''
    severity: medium
    info: 'From Console:

      1. Go to the IAM page in the GCP Console using

      https://console.cloud.google.com/iam-admin/iam

      22 | P a g e

      2. Click on filter table text bar, Type Role: Service Account User

      3. Ensure no user is listed as a result of filter.

      Via CLI gcloud:

      To ensure IAM users are not assigned Service Account User role at project level

      gcloud projects get-iam-policy zeta-environs-192610 --format json'
- id: '1.6'
  title: Ensure user-managed/external keys for service accounts are rotated every 90 days or less
  scoring: scored
  profile:
  - Level 1
  description: Service Account keys consist of a key ID (Private_key_Id) and Private key, which are used to sign programmatic
    requests that you make to Google cloud services accessible to that particular Service account. It is recommended that
    all Service Account keys are regularly rotated.
  rationale: Rotating Service Account keys will reduce the window of opportunity for an access key that is associated with
    a compromised or terminated account to be used. Service Account keys should be rotated to ensure that data cannot be accessed
    with an old key which might have been lost, cracked, or stolen. Each service account is associated with a key pair, which
    is managed by Google Cloud Platform (GCP). It is used for service-to-service authentication within GCP. Google rotates
    the keys daily. GCP provides option to create one or more user-managed (also called as external key pairs) key pairs for
    use from outside GCP (for example, for use with Application Default Credentials). When a new key pair is created, user
    is enforced download the private key (which is not retained by Google). With external keys, users are responsible for
    security of the private key and other management operations such as key rotation. External keys can be managed by the
    IAM API, gcloud command-line tool, or the Service Accounts page in the Google Cloud Platform Console. GCP facilitates
    up to 10 external service account keys per service account to facilitate key rotation.
  impact: Rotating service account key will break communication for depending applications. Dependent applications needs to
    configured manually with new key id displayed in section Service account keys and private key downloaded by user. 27 |
    P a g e
  references:
  - 1. https://cloud.google.com/iam/docs/understanding-serviceaccounts#managing_service_account_keys
  - 2. https://cloud.google.com/sdk/gcloud/reference/iam/service-accounts/keys/list
  page_start: 26
  audit_raw: 'From Console:

    1. Go to APIs & Services\Credentials using

    https://console.cloud.google.com/apis/credentials

    2. In Section Service Account Keys, for every External (user-managed) Service

    account key listed ensure creation date is less than past 90 days

    26 | P a g e

    via CLI gcloud:

    1. List all Service accounts from a project

    gcloud iam service-accounts list

    2. For every service account list service account keys

    gcloud iam service-accounts keys list --iam-account

    [Service_Account_Email_Id] --format=json

    3. Ensure every service account key for a service account has "validAfterTime" less

    than past 90 days'
  remediation: 'From Console:

    Delete external (user managed) Service Account Key older than 90 days:

    1. Go to APIs & Services\Credentials using

    https://console.cloud.google.com/apis/credentials

    2. In Section Service Account Keys, for every external (user managed) Service

    account key with creation date is more than or equal to past 90 days click Delete

    Bin Icon to Delete Service Account key

    Create New external (user managed) Service Account Key for a Service Account:

    1. Go to APIs & Services\Credentials using

    https://console.cloud.google.com/apis/credentials

    2. Click Create Credentials and Select Service Account Key

    3. Choose Service account in drop-down list for which External (user managed)

    Service Account key needs to be created

    4. Select desired key type format among JSON or P12

    5. Click Create. It will download private key. Keep it safe.

    6. Click Close if prompted

    7. It will redirect to APIs & Services\Credentials page. Make a note of New ID

    displayed in section Service account keys'
  checks:
  - type: manual_review
    info: 'From Console:

      1. Go to APIs & Services\Credentials using

      https://console.cloud.google.com/apis/credentials

      2. In Section Service Account Keys, for every External (user-managed) Service

      account key listed ensure creation date is less than past 90 days

      26 | P a g e

      via CLI gcloud:

      1. List all Service accounts from a project

      gcloud iam service-accounts list

      2. For every service account list service account keys

      gcloud iam service-accounts keys list --iam-account

      [Service_Account_Email_Id] --format='
    severity: medium
- id: '1.7'
  title: Ensure that Separation of duties is enforced while assigning service account related roles to users
  scoring: scored
  profile:
  - Level 2
  description: It is recommended that the principle of 'Separation of Duties' is enforced while assigning service account
    related roles to users.
  rationale: Built-in/Predefined IAM role Service Account admin allows user/identity to create, delete, manage service account(s).
    Built-in/Predefined IAM role Service Account User allows user/identity (with adequate privileges on Compute and App Engine)
    to assign service account(s) to Apps/Compute Instances. Separation of duties is the concept of ensuring that one individual
    does not have all necessary permissions to be able to complete a malicious action. In Cloud IAM - service accounts, this
    could be an action such as using a service account to access resources that user should not normally have access to. Separation
    of duties is a business control typically used in larger organizations, meant to help avoid security or privacy incidents
    and errors. It is considered best practice. Any user(s) should not have Service Account Admin and Service Account User,
    both roles assigned at a time.
  impact: Removed role should be assigned to some other user, as per business needs.
  references:
  - 1. https://cloud.google.com/iam/docs/service-accounts
  - 2. https://cloud.google.com/iam/docs/understanding-roles
  page_start: 29
  audit_raw: 'From Console:

    1. Go to IAM & Admin/IAM using https://console.cloud.google.com/iam-admin/iam

    2. Ensure no member has roles Service Account Admin and Service account User

    assigned.

    Via CLI gcloud:

    1. List all users and role assignments:

    gcloud projects get-iam-policy [Project_ID]

    29 | P a g e

    2. Ensure that there are no common users found in member section for roles

    roles/iam.serviceAccountAdmin and roles/iam.serviceAccountUser'
  remediation: 'From Console:

    1. Go to IAM & Admin/IAM using https://console.cloud.google.com/iam-admin/iam

    2. For member having Service Account Admin and Service account User both roles

    granted/assigned, click on the Delete Bin icon to remove any one role from

    member.

    Removal of a role should be done as per the business requirement.'
  checks:
  - type: manual_review
    info: 'From Console:

      1. Go to IAM & Admin/IAM using https://console.cloud.google.com/iam-admin/iam

      2. Ensure no member has roles Service Account Admin and Service account User

      assigned.

      Via CLI gcloud:

      1. List all users and role assignments:

      gcloud projects get-iam-policy [Project_ID]

      29 | P a g e

      2. Ensure that there are no common users found in member section for roles

      roles/iam.serviceAccountAdmin and roles/iam.serviceAccountUser'
    severity: medium
- id: '1.8'
  title: Ensure Encryption keys are rotated within a period of 365 days
  scoring: scored
  profile:
  - Level 1
  description: Google Cloud Key Management Service stores cryptographic keys in a hierarchical structure designed for useful
    and elegant access control management. Access to resources. The format for the rotation schedule depends on the client
    library that is used. For the gcloud command-line tool, the next rotation time must be in ISO or RFC3339 format, and the
    rotation period must be in the form INTEGER[UNIT], where units can be one of seconds (s), minutes (m), hours (h) or days
    (d).
  rationale: Set a key rotation period and starting time. A key can be created with a specified rotation period, which is
    the time between when new key versions are generated automatically. A key can also be created with a specified next rotation
    time. A key is a named object representing a cryptographic key used for a specific purpose. The key material, the actual
    bits used for encryption, can change over time as new key versions are created. A key is used to protect some corpus of
    data. You could encrypt a collection of files with the same key, and people with decrypt permissions on that key would
    be able to decrypt those files. Hence it's necessary to make sure rotation period is set to specific time.
  impact: After successful key rotation, older key version is required in order to decrypt the data encrypted by that specific
    key version.
  references:
  - 1. https://cloud.google.com/kms/docs/keyrotation#frequency_of_key_rotationhttps://cloud.google.com/kms/docs/reencrypt-data
  page_start: 31
  audit_raw: 'From Console

    1. Go to IAM & admin.

    2. Go to the Encryption keys.

    3. Click on key name Ensure Key Rotation is less than 365 days from the current date.

    Via CLI gcloud :

    1. Ensure rotation is scheduled by ROTATION_PERIOD and NEXT_ROTATION_TIME for each

    key :

    gcloud kms keys list --keyring=<KEY_RING> --location= --

    format=json''(rotationPeriod)''

    31 | P a g e

    Ensure outcome values for rotationPeriod and nextRotationTime satisfies the below

    criteria.

    rotationPeriod is <= 525600m

    rotationPeriod is <= 31536000s

    rotationPeriod is <= 8760h

    rotationPeriod is <= 365d

    nextRotationTime is <= 365days from current DATE'
  remediation: 'From Console

    1. Go to IAM & admin.

    2. Go to the Encryption keys.

    3. Click on Right side pop up blade (3 dots).

    4. Click on Edit rotation period.

    5. Select new rotationPeriod and nextRotationTime from drop down.

    Via CLI gcloud :

    1. Update and schedule rotation by ROTATION_PERIOD and NEXT_ROTATION_TIME for

    each key :

    gcloud kms keys update new --keyring=<KEY_RING> --location= --next-rotationtime=<NEXT_ROTATION_TIME> --rotation-period=<ROTATION_PERIOD>'
  checks:
  - type: manual_review
    info: 'From Console

      1. Go to IAM & admin.

      2. Go to the Encryption keys.

      3. Click on key name Ensure Key Rotation is less than 365 days from the current date.

      Via CLI gcloud :

      1. Ensure rotation is scheduled by ROTATION_PERIOD and NEXT_ROTATION_TIME for each

      key :

      gcloud kms keys list --keyring=<KEY_RING> --location= --

      format=json''(rotationPeriod)''

      31 | P a g e

      Ensure outcome values for rotationPeriod and nextRotationTime satisfies the below

      criteria.

      rotationPeriod is <= 525600m

      rotationPeriod is <= 3'
    severity: medium
- id: '1.9'
  title: Ensure that Separation of duties is enforced while assigning KMS related roles to users
  scoring: scored
  profile:
  - Level 2
  description: It is recommended that the principle of 'Separation of Duties' is enforced while assigning KMS related roles
    to users.
  rationale: Built-in/Predefined IAM role Cloud KMS Admin allows user/identity to create, delete, and manage service account(s).
    Built-in/Predefined IAM role Cloud KMS CryptoKey Encrypter/Decrypter allows user/identity (with adequate privileges on
    concerned resources) to encrypt and decrypt data at rest using encryption key(s). Built-in/Predefined IAM role Cloud KMS
    CryptoKey Encrypter allows user/identity (with adequate privileges on concerned resources) to encrypt data at rest using
    encryption key(s). Builtin/Predefined IAM role Cloud KMS CryptoKey Decrypter allows user/identity (with adequate privileges
    on concerned resources) to decrypt data at rest using encryption key(s). Separation of duties is the concept of ensuring
    that one individual does not have all necessary permissions to be able to complete a malicious action. In Cloud KMS, this
    could be an action such as using a key to access and decrypt data that that user should not normally have access to. Separation
    of duties is a business control typically used in larger organizations, meant to help avoid security or privacy incidents
    and errors. It is considered best practice. Any user(s) should not have Cloud KMS Admin and any of the Cloud KMS CryptoKey
    Encrypter/Decrypter, Cloud KMS CryptoKey Encrypter, Cloud KMS CryptoKey Decrypter roles assigned at a time.
  impact: Removed roles should be assigned to some other user, as per business needs.
  references:
  - 1. https://cloud.google.com/kms/docs/separation-of-duties
  page_start: 34
  audit_raw: 'From Console:

    1. Go to IAM & Admin/IAM using https://console.cloud.google.com/iam-admin/iam

    34 | P a g e

    2. Ensure no member has roles Cloud KMS Admin and any of the Cloud KMS CryptoKey

    Encrypter/Decrypter, Cloud KMS CryptoKey Encrypter, Cloud KMS CryptoKey

    Decrypter assigned.

    Via CLI gcloud:

    1. List all users and role assignments:

    gcloud projects get-iam-policy [Project_ID]

    2. Ensure that there are no common users found in member section for roles

    cloudkms.admin and any one of Cloud KMS CryptoKey Encrypter/Decrypter,

    Cloud KMS CryptoKey Encrypter, Cloud KMS CryptoKey Decrypter'
  remediation: 'From Console:

    1. Go to IAM & Admin/IAM using https://console.cloud.google.com/iam-admin/iam

    2. For member having Cloud KMS Admin and any of the Cloud KMS CryptoKey

    Encrypter/Decrypter, Cloud KMS CryptoKey Encrypter, Cloud KMS CryptoKey

    Decrypter roles granted/assigned, click on the Delete Bin icon to remove role from

    member.

    Note: Removal of a roles should be done as per the business requirement.'
  checks:
  - type: manual_review
