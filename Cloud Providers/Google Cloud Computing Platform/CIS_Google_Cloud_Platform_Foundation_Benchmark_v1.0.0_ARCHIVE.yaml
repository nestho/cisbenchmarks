  title: Ensure that RSASHA1 is not used for key-signing key in Cloud DNS DNSSEC
  scoring: scored
  profile:
  - Level 1
  description: DNSSEC algorithm numbers in this registry may be used in CERT RRs. Zone signing (DNSSEC) and transaction security
    mechanisms (SIG(0) and TSIG) make use of particular subsets of these algorithms. The algorithm used for key signing should
    be recommended one and it should not be weak.
  rationale: DNSSEC algorithm numbers in this registry may be used in CERT RRs. Zonesigning (DNSSEC) and transaction security
    mechanisms (SIG(0) and TSIG) make use of particular subsets of these algorithms. The algorithm used for key signing should
    be recommended one and it should not be weak. When enabling DNSSEC for a managed zone, or creating a managed zone with
    DNSSEC, you can select the DNSSEC signing algorithms and the denial-of-existence type. Changing the DNSSEC settings is
    only effective for a managed zone if DNSSEC is not already enabled. If you need to change the settings for a managed zone
    where it has been enabled, you can turn DNSSEC off and then re-enable it with different settings.
  impact: ''
  references:
  - 1. https://cloud.google.com/dns/dnssec-advanced#advanced_signing_options
  page_start: 101
  audit_raw: 'Currently there is no support to audit this setting through console.

    Via CLI : Ensure the property algorithm for keyType keySigning is not using RSASHA1.

    gcloud beta dns managed-zones describe <zoneName> —

    format="json(dnsName,dnssecConfig.state,dnssecConfig.defaultKeySpecs)"'
  remediation: 'Use the below command update Cloud DNS managed zone key signing key algorithm to

    recommended algorithm.

    Via CLI :

    gcloud beta dns managed-zones update EXAMPLE_ZONE --dnssec-state on --kskalgorithm ECDSAP256SHA256 --ksk-key-length 256

