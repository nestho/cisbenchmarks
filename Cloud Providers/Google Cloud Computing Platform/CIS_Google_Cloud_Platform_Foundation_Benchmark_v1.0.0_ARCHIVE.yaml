- id: '3.2'
  title: Ensure legacy networks does not exists for a project
  scoring: scored
  profile:
  - Level 1
  description: In order to prevent use of legacy networks, a project should not have a legacy network configured.
  rationale: Legacy networks have a single network IPv4 prefix range and a single gateway IP address for the whole network.
    The network is global in scope and spans all cloud regions. You cannot create subnetworks in a legacy network or switch
    from legacy to auto or custom subnet networks. Legacy networks can thus have an impact for high network traffic projects
    and subject to the single point of contention or failure.
  impact: None.
  references:
  - 1. https://cloud.google.com/compute/docs/networking#creating_a_legacy_network
  - 2. https://cloud.google.com/compute/docs/networking#legacy_non-subnet_network
  page_start: 97
  audit_raw: 'For each Google Cloud Platform project,

    1. Set the project name in the Google Cloud Shell:

    gcloud config set project <Project-ID>

    2. List the networks configured in that project:

    gcloud compute networks list

    None of the listed networks should be in the legacy mode.'
  remediation: 'For each Google Cloud Platform project,

    1. Follow the documentation and create a non-legacy network suitable for your

    requirements.

    2. Follow the documentation and delete the networks in the legacy mode.

    97 | P a g e'
