  profile:
  - Level 1
  description: Enabling OS login binds SSH certificates to IAM users and facilitates effective SSH certificate management.
  rationale: Enabling osLogin ensures that SSH keys used to connect to instances are mapped with IAM users. Revoking access
    to IAM user will revoke all the SSH keys associated with that particular user. It facilitates centralized and automated
    SSH key pair management which is useful in handling cases like response to compromised SSH key pairs and/or revocation
    of external/third-party/Vendor users.
  impact: Enabling OS Login on project disables metadata-based SSH key configurations on all instances from a project. Disabling
    OS Login restores SSH keys that you have configured in project or instance meta-data.
  references:
  - 1. https://cloud.google.com/compute/docs/instances/managing-instance-access
  - 2. https://cloud.google.com/compute/docs/instances/managing-instanceaccess#enable_oslogin
  - 1. In order to use osLogin, instance using Custom Images must have the latest version
  - 2. Project enable-oslogin can be over-ridden by setting enable-oslogin parameter to an
