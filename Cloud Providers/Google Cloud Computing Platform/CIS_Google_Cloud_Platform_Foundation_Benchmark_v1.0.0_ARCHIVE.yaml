- id: '2.3'
  title: Ensure that object versioning is enabled on log-buckets
  scoring: scored
  profile:
  - Level 1
  description: It is recommended to enable object versioning on log-buckets.
  rationale: Logs can be exported by creating one or more sinks that include a logs filter and a destination. As Stackdriver
    Logging receives new log entries, they are compared against each sink. If a log entry matches a sink's filter, then a
    copy of the log entry is written to the destination. Sinks can be configured to export logs in Storage buckets. To support
    the retrieval of objects that are deleted or overwritten, Object Versioning feature should be enabled on all such storage
    buckets where sinks are configured.
