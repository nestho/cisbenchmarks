- id: '4.2'
  title: Ensure "Block Project-wide SSH keys" enabled for VM instances
  scoring: scored
  profile:
  - Level 1
  description: It is recommended to user Instance specific SSH key(s) instead of using common/shared project-wide SSH key(s)
    to access Instances.
  rationale: Project-wide SSH keys are stored in Compute/Project-meta-data. Project wide SSH keys can be used to login into
    all the instances within project. Using project-wide SSH keys eases the SSH key management but if compromised, poses the
    security risk which can impact all the instances within project. It is recommended to use Instance specific SSH keys which
    can limit the attack surface if the SSH keys are compromised.
  impact: Users already having Project-wide ssh key pairs and using third party SSH clients will lose access to the impacted
    Instances. For Project users using gcloud or GCP Console based SSH option, no manual key creation and distribution is
    required and will be handled by GCE (Google compute Engine) itself. To access Instance using third party SSH clients Instance
    specific SSH key pairs needs to be created and distributed to the required users.
  references:
  - 1. https://cloud.google.com/compute/docs/instances/adding-removing-ssh-keys
  page_start: 119
  audit_raw: 'Using Console:

    1. Go to the VM instances page using

    https://console.cloud.google.com/compute/instances?. It will list all the

    instances from project.

    2. Click on the name of the instance

    3. Under SSH Keys, Ensure Block project-wide SSH keys is selected.

    4. Check for every Instance.

    via CLI gcloud:

    1. List all Instances from a project:

    gcloud compute instances list

    2. Get instance metadata

    gcloud compute instacnces describe [Instance_Name]

    3. for every instance Ensure key: block-project-ssh-keys set to value: ''true''

    119 | P a g e'
  remediation: 'Using Console:

    1. Go to the VM instances page using

    https://console.cloud.google.com/compute/instances?. It will list all the

    instances from project

    2. Click on the name of the Impacted instance

    3. Click Edit in the toolbar

    4. Under SSH Keys, go to the Block project-wide SSH keys checkbox

    5. To block users with project-wide SSH keys from connecting to this instance, select

    Block project-wide SSH keys

    6. click Save at the bottom of the page

    7. Repeat steps for every impacted Instance

    via CLI gcloud:

    Block project-wide public SSH keys, set the metadata value to TRUE:

    gcloud compute instances add-metadata [INSTANCE_NAME] --metadata blockproject-ssh-keys=TRUE

    where [INSTANCE_NAME] is the name of the instance that you want to block project-wide

    public SSH keys.'
