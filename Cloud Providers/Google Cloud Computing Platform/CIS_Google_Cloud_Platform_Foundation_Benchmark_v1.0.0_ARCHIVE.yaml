  description: A Pod Security Policy is a cluster-level resource that controls security sensitive aspects of the pod specification.
    The PodSecurityPolicy objects define a set of conditions that a pod must run with in order to be accepted into the system,
    as well as defaults for the related fields.
  rationale: The PodSecurityPolicy defines a set of conditions that Pods must meet to be accepted by the cluster; when a request
    to create or update a Pod does not meet the conditions in the PodSecurityPolicy, that request is rejected and an error
    is returned. The PodSecurityPolicy admission controller validates requests against available PodSecurityPolicies. PodSecurityPolicies
    specify a list of restrictions, requirements, and defaults for Pods created under the policy.
  impact: If you enable the PodSecurityPolicy controller without first defining and authorizing any actual policies, no users,
    controllers, or service accounts can create or update Pods. If you are working with an existing cluster, you should define
    and authorize policies before enabling the controller.
