  description: It is recommended to rotate API keys every 90 days.
  rationale: 'Security risks involved in using API-Keys are below: • API keys are a simple encrypted strings • API keys do
    not identify the user or the application making the API request • API keys are typically accessible to clients, making
    it easy to discover and steal an API key Because of this Google recommend using the standard authentication flow instead.
    However, there are limited cases where API keys are more appropriate. For example, if there is a mobile application that
    needs to use the Google Cloud Translation API, but doesn''t otherwise need a backend server, API keys are the simplest
    way to authenticate to that API. Once the key is stolen, it has no expiration, so it may be used indefinitely, unless
    the project owner revokes or regenerates the key. Rotating API keys will reduce the window of opportunity for an access
    key that is associated with a compromised or terminated account to be used. API keys should be rotated to ensure that
    data cannot be accessed with an old key which might have been lost, cracked, or stolen.'
