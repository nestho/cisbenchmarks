  title: Ensure Automatic node upgrades is enabled on Kubernetes Engine Clusters nodes
  scoring: scored
  profile:
  - Level 1
  description: Node auto-upgrades help you keep the nodes in your cluster or node pool up to date with the latest stable version
    of Kubernetes. Auto-Upgrades use the same update mechanism as manual node upgrades.
  rationale: 'Node pools with auto-upgrades enabled are automatically scheduled for upgrades when a new stable Kubernetes
    version becomes available. When the upgrade is performed, the node pool is upgraded to match the current cluster master
    version. Some benefits of using enabling auto-upgrades are: • Lower management overhead: You don''t have to manually track
    and update to the latest version of Kubernetes. • Better security: Sometimes new binaries are released to fix a security
    issue. With auto-upgrades, Kubernetes Engine automatically ensures that security updates are applied and kept up to date.
