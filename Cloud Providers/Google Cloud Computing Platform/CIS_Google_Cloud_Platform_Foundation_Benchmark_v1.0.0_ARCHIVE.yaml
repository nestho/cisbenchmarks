- id: '2.4'
  title: Ensure log metric filter and alerts exists for Project Ownership assignments/changes
  scoring: scored
  profile:
  - Level 1
  description: 'In order to prevent unnecessarily project ownership assignments to users/serviceaccounts and further misuses
    of project and resources, all roles/Owner assignments should be monitored. Members (users/Service-Accounts) with role
    assignment to primitive role roles/owner are Project Owners. Project Owner has all the privileges on a project it belongs
    to. These can be summarized as below: - All viewer permissions on All GCP Services part within the project - Permissions
    for actions that modify state of All GCP Services within the project - Manage roles and permissions for a project and
    all resources within the project - Set up billing for a project Granting owner role to a member (user/Service-Account)
    will allow members to modify the IAM policy. Therefore grant the owner role only if the member has a legitimate purpose
    to manage the IAM policy. This is because as project IAM policy contains sensitive access control data and having a minimal
    set of users manage it will simplify any auditing that you may have to do.'
  rationale: Project Ownership Having highest level of privileges on a project, to avoid misuse of project resources project
    ownership assignment/change actions mentioned should be monitored and alerted to concerned recipients. - Sending project
    ownership Invites - Acceptance/Rejection of project ownership invite by user - Adding `role\owner` to a user/service-account
    - Removing a user/Service account from `role\owner` 54 | P a g e
  impact: Based on Service Tiers, Stackdriver account may be charged.
  references:
  - 1. https://cloud.google.com/logging/docs/logs-based-metrics/
  - 2. https://cloud.google.com/monitoring/custom-metrics/
  - 1. Before considering this recommendation Ensure target GCP project is configured
  - 2. Project Ownership assignments for a user cannot be done using gcloud utility as
  page_start: 54
