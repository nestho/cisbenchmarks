  title: Ensure that there are no publicly accessible objects in storage buckets
  scoring: scored
  profile:
  - Level 1
  description: It is recommended that storage object ACL should not grant access to "allUsers".
  rationale: Allowing public access to objects allows anyone with an internet connection to access sensitive data that is
    important to your business. IAM is used to control access over an entire bucket however to customize access to individual
    objects within a bucket ACLs are used. Even if IAM applied on storage does not allow access to "allUsers" there could
    be object specific ACLs that allows public access to the specific objects inside the bucket. Hence it is important to
    check ACLs at individual object level.
  impact: There could be a business need to share/access certain objects publicly. By removing acl with entity "allUsers"
