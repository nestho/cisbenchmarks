    to 'off'
  scoring: scored
  profile:
  - Level 1
  description: It is recommended to set contained database authentication database flag for Cloud SQL on the SQL Server instance
    is set to off.
  rationale: A contained database includes all database settings and metadata required to define the database and has no configuration
    dependencies on the instance of the Database Engine where the database is installed. Users can connect to the database
    without authenticating a login at the Database Engine level. Isolating the database from the Database Engine makes it
    possible to easily move the database to another instance of SQL Server. Contained databases have some unique threats that
    should be understood and mitigated by SQL Server Database Engine administrators. Most of the threats are related to the
    USER WITH PASSWORD authentication process, which moves the authentication boundary from the Database Engine level to the
    database level, hence this is recommended to disable this flag. This recommendation is applicable to SQL Server database
    instances.
