- id: '2.1'
  title: Ensure that Cloud Audit Logging is configured properly across all services and all users from a project
  scoring: scored
  profile:
  - Level 1
  description: It is recommended that Cloud Audit Logging is configured to track all admin activities and read, write access
    to user data.
  rationale: 'Cloud Audit Logging maintains two audit logs for each project, folder, and organization: Admin Activity and
    Data Access. 1. Admin Activity logs contain log entries for API calls or other administrative actions that modify the
    configuration or metadata of resources. Admin Activity audit logs are enabled for all services and cannot be configured.
    2. Data Access audit logs record API calls that create, modify, or read user-provided data. These are disabled by default
    and should be enabled. There are three kinds of Data Access audit log information: o Admin read: Records operations that
    read metadata or configuration information. Admin Activity audit logs record writes of metadata and configuration information
    that cannot be disabled. o Data read: Records operations that read user-provided data. o Data write: Records operations
    that write user-provided data. It is recommended to have an effective default audit config configured in such a way that:
    1. logtype is set to DATA_READ (to log user activity tracking) and DATA_WRITES (to log changes/tampering to user data).
    2. audit config is enabled for all the services supported by the Data Access audit logs feature. 3. Logs should be captured
    for all users, i.e., there are no exempted users in any of the audit config sections. This will ensure overriding the
    audit config will not contradict the requirement. 53 | P a g e'
  impact: There is no charge for Admin Activity audit logs. Enabling the Data Access audit logs might result in your project
    being charged for the additional logs usage.
  references:
  - 1. https://cloud.google.com/logging/docs/audit/
  - 2. https://cloud.google.com/logging/docs/audit/configure-data-access
  page_start: 53
  audit_raw: "From Console:\n1. Go to Audit Logs by visiting https://console.cloud.google.com/iam-admin/audit.\n2. Ensure\
    \ that Admin Read, Data Write, and Data Read are enabled for all Google Cloud\nservices and that no exemptions are allowed.\n\
    From Command Line:\n1. List the Identity and Access Management (IAM) policies for the project, folder, or\norganization:\n\
    gcloud organizations get-iam-policy ORGANIZATION_ID\ngcloud resource-manager folders get-iam-policy FOLDER_ID\ngcloud\
    \ projects get-iam-policy PROJECT_ID\n2. Policy should have a default auditConfigs section which has the logtype set to\n\
    DATA_WRITES and DATA_READ for all services. Note that projects inherit settings\nfrom folders, which in turn inherit settings\
    \ from the organization. When called,\nprojects get-iam-policy, the result shows only the policies set in the project,\
    \ not the\npolicies inherited from the parent folder or organization. Nevertheless, if the parent\nfolder has Cloud Audit\
    \ Logging enabled, the project does as well.\nSample output for default audit configs may look like this:\n auditConfigs:\n\
    \ - auditLogConfigs:\n - logType: ADMIN_READ\n - logType: DATA_WRITE\n - logType: DATA_READ\n service: allServices\n3.\
    \ Any of the auditConfigs sections should not have parameter \"exemptedMembers:\"\nset, which will ensure that Logging\
    \ is enabled for all users and no user is exempted."
  remediation: "From Console:\n1. Go to Audit Logs by visiting https://console.cloud.google.com/iam-admin/audit.\n2. Follow\
    \ the steps at https://cloud.google.com/logging/docs/audit/configure-dataaccess to enable audit logs for all Google Cloud\
    \ services. Ensure that no exemptions\nare allowed.\n54 | P a g e\nFrom Command Line:\n1. To read the project's IAM policy\
    \ and store it in a file run a command:\ngcloud projects get-iam-policy PROJECT_ID > /tmp/project_policy.yaml\nAlternatively,\
    \ the policy can be set at the organization or folder level. If setting the policy at\nthe organization level, it is not\
    \ necessary to also set it for each folder or project.\ngcloud organizations get-iam-policy ORGANIZATION_ID > /tmp/org_policy.yaml\n\
    gcloud resource-manager folders get-iam-policy FOLDER_ID >\n/tmp/folder_policy.yaml\n2. Edit policy in /tmp/policy.yaml,\
    \ adding or changing only the audit logs\nconfiguration to:\nauditConfigs:\n- auditLogConfigs:\n - logType: DATA_WRITE\n\
    \ - logType: DATA_READ\n service: allServices\nNote: exemptedMembers: is not set as audit logging should be enabled for\
    \ all the users\n3. To write new IAM policy run command:\ngcloud organizations set-iam-policy ORGANIZATION_ID /tmp/org_policy.yaml\n\
    gcloud resource-manager folders set-iam-policy FOLDER_ID\n/tmp/folder_policy.yaml\ngcloud projects set-iam-policy PROJECT_ID\
    \ /tmp/project_policy.yaml\nIf the preceding command reports a conflict with another change, then repeat these steps,\n\
    starting with the first step."
  checks:
  - type: manual_review
    info: 'From Console:

      1. Go to Audit Logs by visiting https://console.cloud.google.com/iam-admin/audit.

      2. Ensure that Admin Read, Data Write, and Data Read are enabled for all Google Cloud

      services and that no exemptions are allowed.

      From Command Line:

      1. List the Identity and Access Management (IAM) policies for the project, folder, or

      organization:

      gcloud organizations get-iam-policy ORGANIZATION_ID

      gcloud resource-manager folders get-iam-policy FOLDER_ID

      gcloud projects get-iam-policy PROJECT_ID

      2. '
    severity: medium
- id: '2.2'
  title: Ensure that sinks are configured for all log entries
  scoring: scored
  profile:
  - Level 1
  description: It is recommended to create a sink that will export copies of all the log entries. This can help aggregate
    logs from multiple projects and export them to a Security Information and Event Management (SIEM).
  rationale: Log entries are held in Stackdriver Logging. To aggregate logs, export them to a SIEM. To keep them longer, it
    is recommended to set up a log sink. Exporting involves writing a filter that selects the log entries to export, and choosing
    a destination in Cloud Storage, BigQuery, or Cloud Pub/Sub. The filter and destination are held in an object called a
    sink. To ensure all log entries are exported to sinks, ensure that there is no filter configured for a sink. Sinks can
    be created in projects, organizations, folders, and billing accounts.
  impact: There are no costs or limitations in Stackdriver Logging for exporting logs, but the export destinations charge
    for storing or transmitting the log data.
  references:
  - 1. https://cloud.google.com/logging/docs/reference/tools/gcloud-logging
  - 2. https://cloud.google.com/logging/quotas
  page_start: 57
  audit_raw: 'From Console:

    1. Go to Logging/Exports by visiting https://console.cloud.google.com/logs/exports.

    2. For every sink, click the 3-dot button for Menu options and select View Filter.

    3. Ensure there is at least one sink with an empty sink filter.

    4. Additionally, ensure that the resource configured as Destination exists.

    From Command Line:

    1. Ensure that a sink with an empty filter exists. List the sinks for the project, folder

    or organization. If sinks are configured at a folder or organization level, they do not

    need to be configured for each project:

    gcloud logging sinks list --folder=FOLDER_ID | --organization=ORGANIZATION_ID

    | --project=PROJECT_ID

    The output should list at least one sink with an empty filter.

    2. Additionally, ensure that the resource configured as Destination exists.

    57 | P a g e

    See https://cloud.google.com/sdk/gcloud/reference/beta/logging/sinks/list for more

    information.'
  remediation: 'From Console:

    1. Go to Logging/Logs by visiting https://console.cloud.google.com/logs/viewer.

    2. Click the down arrow symbol on Filter Bar at the rightmost corner and select

    Convert to Advanced Filter.

    3. This step converts Filter Bar to Advanced Filter Bar.

    4. Clear any text from the Advanced Filter field. This ensures that the log-filter is

    set to empty and captures all the logs.

    5. Click Submit Filter and the result should display all logs.

    6. Click Create Sink, which opens a menu on the right.

    7. Fill out the fields and click Create Sink.

    For more information, see

    https://cloud.google.com/logging/docs/export/configure_export_v2#dest-create.

    From Command Line:

    To create a sink to export all log entries in a Google Cloud Storage bucket:

    gcloud logging sinks create <sink-name>

    storage.googleapis.com/DESTINATION_BUCKET_NAME

