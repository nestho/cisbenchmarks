- id: '4.8'
  title: Ensure Compute instances are launched with Shielded VM enabled
  scoring: scored
  profile:
  - Level 2
  description: To defend against against advanced threats and ensure that the boot loader and firmware on your VMs are signed
    and untampered, it is recommended that Compute instances are launched with Shielded VM enabled.
  rationale: Shielded VMs are virtual machines (VMs) on Google Cloud Platform hardened by a set of security controls that
    help defend against rootkits and bootkits. Shielded VM offers verifiable integrity of your Compute Engine VM instances,
    so you can be confident your instances haven't been compromised by boot- or kernel-level malware or rootkits. Shielded
    VM's verifiable integrity is achieved through the use of Secure Boot, virtual trusted platform module (vTPM)-enabled Measured
    Boot, and integrity monitoring. Shielded VM instances run firmware which is signed and verified using Google's Certificate
    Authority, ensuring that the instance's firmware is unmodified and establishing the root of trust for Secure Boot. Integrity
    monitoring helps you understand and make decisions about the state of your VM instances and the Shielded VM vTPM enables
    Measured Boot by performing the measurements needed to create a known good boot baseline, called the integrity policy
    baseline. The integrity policy baseline is used for comparison with measurements from subsequent VM boots to determine
    if anything has changed. Secure Boot helps ensure that the system only runs authentic software by verifying the digital
    signature of all boot components, and halting the boot process if signature verification fails.
  impact: None.
  references:
  - 1. https://cloud.google.com/compute/docs/instances/modifying-shielded-vm
  - 2. https://cloud.google.com/shielded-vm
  page_start: 145
  audit_raw: 'From Console:

    1. Go to the VM instances page by visiting:

    https://console.cloud.google.com/compute/instances.

    145 | P a g e

    2. Click on the instance name to see its VM instance details page.

    3. Under the section Shielded VM, ensure that Turn on vTPM and Turn on Integrity

    Monitoring are enabled.

    From Command Line:

    1. For each instance in your project, get its metadata:

    gcloud compute instances describe INSTANCE_NAME

    2. Ensure that there is a shieldedInstanceConfig configuration and that

    configuration has the enableIntegrityMonitoring and enableVtpm set to true. If

    the VM is not a Shield VM image, you will not see a shieldedInstanceConfig` in the

    output.'
  remediation: 'To be able turn on Shielded VM on an instance, your instance must use an image with

    Shielded VM support.

