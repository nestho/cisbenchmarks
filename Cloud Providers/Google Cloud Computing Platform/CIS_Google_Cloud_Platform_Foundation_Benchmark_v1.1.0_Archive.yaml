- id: '4.4'
  title: Ensure oslogin is enabled for a Project
  scoring: scored
  profile:
  - Level 1
  description: Enabling OS login binds SSH certificates to IAM users and facilitates effective SSH certificate management.
  rationale: Enabling osLogin ensures that SSH keys used to connect to instances are mapped with IAM users. Revoking access
    to IAM user will revoke all the SSH keys associated with that particular user. It facilitates centralized and automated
    SSH key pair management which is useful in handling cases like response to compromised SSH key pairs and/or revocation
    of external/third-party/Vendor users.
  impact: Enabling OS Login on project disables metadata-based SSH key configurations on all instances from a project. Disabling
    OS Login restores SSH keys that you have configured in project or instance meta-data.
  references:
  - 1. https://cloud.google.com/compute/docs/instances/managing-instance-access
  - 2. https://cloud.google.com/compute/docs/instances/managing-instanceaccess#enable_oslogin
  - 1. In order to use osLogin, instance using Custom Images must have the latest version
  - 2. Project enable-oslogin can be over-ridden by setting enable-oslogin parameter to an
  page_start: 132
  audit_raw: 'From Console:

    1. Go to the VM compute metadata page by visiting

    https://console.cloud.google.com/compute/metadata.

    2. Ensure that key enable-oslogin is present with value set to TRUE.

    3. Because instances can override project settings, ensure that no instance has custom

    metadata with key enable-oslogin and value FALSE.

    From Command Line:

    1. Ensure that OS login is enabled on the project:

    gcloud compute project-info describe

    2. Verify that the section commonInstanceMetadata has a key enable-oslogin set to

    value TRUE.

    3. Ensure that no instance in the project overrides the project setting:

    gcloud compute instances describe INSTANCE_NAME

    132 | P a g e'
  remediation: 'From Console:

    1. Go to the VM compute metadata page by visiting:

    https://console.cloud.google.com/compute/metadata.

    2. Click Edit.

    3. Add a metadata entry where the key is enable-oslogin and the value is TRUE.

    4. Click Save to apply the changes.

    5. For every instances that overrides the project setting, go to the VM Instances page

    at https://console.cloud.google.com/compute/instances.

    6. Click the name of the instance on which you want to remove the metadata value.

    7. At the top of the instance details page, click Edit to edit the instance settings.

    8. Under Custom metadata, remove any entry with key enable-oslogin and the value

    is FALSE

    9. At the bottom of the instance details page, click Save to apply your changes to the

    instance.

    From Command Line:

    1. Configure oslogin on the project:

    gcloud compute project-info add-metadata --metadata enable-oslogin=TRUE

    2. Remove instance metadata that overrides the project setting.

    gcloud compute instances remove-metadata INSTANCE_NAME --keys=enable-oslogin

