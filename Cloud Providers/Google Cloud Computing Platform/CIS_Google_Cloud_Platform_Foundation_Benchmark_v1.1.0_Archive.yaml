- id: '3.4'
  title: Ensure that RSASHA1 is not used for the key-signing key in Cloud DNS DNSSEC
  scoring: scored
  profile:
  - Level 1
  description: DNSSEC algorithm numbers in this registry may be used in CERT RRs. Zone signing (DNSSEC) and transaction security
    mechanisms (SIG(0) and TSIG) make use of particular subsets of these algorithms. The algorithm used for key signing should
    be a recommended one and it should be strong.
  rationale: Domain Name System Security Extensions (DNSSEC) algorithm numbers in this registry may be used in CERT RRs. Zonesigning
    (DNSSEC) and transaction security mechanisms (SIG(0) and TSIG) make use of particular subsets of these algorithms. The
    algorithm used for key signing should be a recommended one and it should be strong. When enabling DNSSEC for a managed
    zone, or creating a managed zone with DNSSEC, the user can select the DNSSEC signing algorithms and the denial-of-existence
    type. Changing the DNSSEC settings is only effective for a managed zone if DNSSEC is not already enabled. If there is
    a need to change the settings for a managed zone where it has been enabled, turn DNSSEC off and then re-enable it with
    different settings.
  impact: ''
  references:
  - 1. https://cloud.google.com/dns/dnssec-advanced#advanced_signing_options
  - 1. RSASHA1 key-signing support may be required for compatibility reasons.
  - 2. Remediation CLI works well with gcloud-cli version 221.0.0 and later.
  page_start: 104
  audit_raw: 'Currently there is no support to audit this setting through console.

    From Command Line: Ensure the property algorithm for keyType keySigning is not using

    RSASHA1.

    gcloud dns managed-zones describe ZONENAME --

    format="json(dnsName,dnssecConfig.state,dnssecConfig.defaultKeySpecs)"'
  remediation: '1. If it is necessary to change the settings for a managed zone where it has been

    enabled, NSSEC must be turned off and re-enabled with different settings. To turn

    off DNSSEC, run the following command:

    gcloud dns managed-zones update ZONE_NAME --dnssec-state off

    104 | P a g e

    2. To update key-signing for a reported managed DNS Zone, run the following

    command:

    gcloud dns managed-zones update ZONE_NAME --dnssec-state on --ksk-algorithm

    KSK_ALGORITHM --ksk-key-length KSK_KEY_LENGTH --zsk-algorithm ZSK_ALGORITHM -

    -zsk-key-length ZSK_KEY_LENGTH --denial-of-existence DENIAL_OF_EXISTENCE

    Supported algorithm options and key lengths are as follows.

    Algorithm KSK Length ZSK Length

    --------- ---------- ----------

    RSASHA1 1024,2048 1024,2048

    RSASHA256 1024,2048 1024,2048

    RSASHA512 1024,2048 1024,2048

    ECDSAP256SHA256 256 256

    ECDSAP384SHA384 384 384'
  checks:
  - type: manual_review
    info: 'Currently there is no support to audit this setting through console.

