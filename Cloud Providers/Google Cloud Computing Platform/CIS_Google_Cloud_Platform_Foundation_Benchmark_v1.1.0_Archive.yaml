  scoring: scored
  profile:
  - Level 1
  description: 'The log_min_error_statement flag defines the minimum message severity level that is considered as an error
    statement. Messages for error statements are logged with the SQL statement. Valid values include DEBUG5, DEBUG4, DEBUG3,
    DEBUG2, DEBUG1, INFO, NOTICE, WARNING, ERROR, LOG, FATAL, and PANIC. Each severity level includes the subsequent levels
    mentioned above. Note: To effectively turn off logging failing statements, set this parameter to PANIC. ERROR is considered
    the best practice setting. Changes should only be made in accordance with the organization''s logging policy.'
  rationale: Auditing helps in troubleshooting operational problems and also permits forensic analysis. If log_min_error_statement
    is not set to the correct value, messages may not be classified as error messages appropriately. Considering general log
    messages as error messages would make it difficult to find actual errors, while considering only stricter severity levels
    as error messages may skip actual errors to log their SQL statements. The log_min_error_statement flag should be set in
    accordance with the organization's logging policy. This recommendation is applicable to PostgreSQL database instances.
