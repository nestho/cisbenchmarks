- id: '4.6'
  title: Ensure that IP forwarding is not enabled on Instances
  scoring: scored
  profile:
  - Level 1
  description: Compute Engine instance cannot forward a packet unless the source IP address of the packet matches the IP address
    of the instance. Similarly, GCP won't deliver a packet whose destination IP address is different than the IP address of
    the instance receiving the packet. However, both capabilities are required if you want to use instances to help route
    packets. Forwarding of data packets should be disabled to prevent data loss or information disclosure.
  rationale: Compute Engine instance cannot forward a packet unless the source IP address of the packet matches the IP address
    of the instance. Similarly, GCP won't deliver a packet whose destination IP address is different than the IP address of
    the instance receiving the packet. However, both capabilities are required if you want to use instances to help route
    packets. To enable this source and destination IP check, disable the canIpForward field, which allows an instance to send
    and receive packets with non-matching destination or source IPs.
  impact: Deleting instance(s) acting as routers/packet forwarders may break the network connectivity.
  references:
