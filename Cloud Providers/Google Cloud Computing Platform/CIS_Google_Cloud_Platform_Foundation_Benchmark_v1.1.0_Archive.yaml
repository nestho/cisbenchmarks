controls:
- id: '1.1'
  title: Ensure that corporate login credentials are used
  scoring: scored
  profile:
  - Level 1
  description: Use corporate login credentials instead of personal accounts, such as Gmail accounts.
  rationale: It is recommended fully-managed corporate Google accounts be used for increased visibility, auditing, and controlling
    access to Cloud Platform resources. Email accounts based outside of the user's organization, such as personal accounts,
    should not be used for business purposes.
  impact: None.
  references:
  - 1. https://cloud.google.com/docs/enterprise/best-practices-for-enterpriseorganizations#manage-identities
  - 2. https://support.google.com/work/android/answer/6371476
  page_start: 13
  audit_raw: 'For each Google Cloud Platform project, list the accounts that have been granted access to

    that project:

    gcloud projects get-iam-policy PROJECT_ID

    Also list the accounts added on each folder:

    gcloud resource-manager folders get-iam-policy FOLDER_ID

    And list your organization''s IAM policy:

    gcloud organizations get-iam-policy ORGANIZATION_ID

    No email accounts outside the organization domain should be granted permissions in the

    IAM policies. This excludes Google-owned service accounts.'
  remediation: 'Follow the documentation and setup corporate login accounts.

    Prevention:

    To ensure that no email addresses outside the organization can be granted IAM

    permissions to its Google Cloud projects, folders or organization, turn on the Organization

    Policy for Domain Restricted Sharing. Learn more at:

    https://cloud.google.com/resource-manager/docs/organization-policy/restrictingdomains

    13 | P a g e'
  checks:
  - type: manual_review
    info: 'For each Google Cloud Platform project, list the accounts that have been granted access to

      that project:

      gcloud projects get-iam-policy PROJECT_ID

      Also list the accounts added on each folder:

      gcloud resource-manager folders get-iam-policy FOLDER_ID

      And list your organization''s IAM policy:

      gcloud organizations get-iam-policy ORGANIZATION_ID

      No email accounts outside the organization domain should be granted permissions in the

      IAM policies. This excludes Google-owned service accounts.'
    severity: medium
- id: '1.2'
  title: Ensure that multi-factor authentication is enabled for all non-service accounts
  scoring: scored
  profile:
  - Level 1
  description: Setup multi-factor authentication for Google Cloud Platform accounts.
  rationale: Multi-factor authentication requires more than one mechanism to authenticate a user. This secures user logins
    from attackers exploiting stolen or weak credentials.
  impact: None
  references:
  - 1. https://cloud.google.com/solutions/securing-gcp-account-u2f
  - 2. https://support.google.com/accounts/answer/185839
  page_start: 15
  audit_raw: 'For each Google Cloud Platform project, folder, or organization:

    Step 1: Identify non-service accounts.

    Step 2: Manually verify that multi-factor authentication for each account is set.'
  remediation: 'For each Google Cloud Platform project:

    Step 1: Identify non-service accounts.

    Step 2: Setup multi-factor authentication for each account.'
  checks:
  - type: manual_review
    info: 'For each Google Cloud Platform project, folder, or organization:

      Step 1: Identify non-service accounts.

      Step 2: Manually verify that multi-factor authentication for each account is set.'
    severity: medium
- id: '1.3'
  title: Ensure that Security Key Enforcement is enabled for all admin accounts
  scoring: scored
  profile:
  - Level 2
  description: Setup Security Key Enforcement for Google Cloud Platform admin accounts.
  rationale: 'Google Cloud Platform users with Organization Administrator roles have the highest level of privilege in the
    organization. These accounts should be protected with the strongest form of two-factor authentication: Security Key Enforcement.
    Ensure that admins use Security Keys to log in instead of weaker second factors like SMS or one-time passwords (OTP).
    Security Keys are actual physical keys used to access Google Organization Administrator Accounts. They send an encrypted
    signature rather than a code, ensuring that logins cannot be phished.'
  impact: If an organization administrator loses access to their security key, the user could lose access to their account.
    For this reason, it is important to set up backup security keys.
  references:
  - 1. https://cloud.google.com/security-key/
  - 2. https://gsuite.google.com/learnmore/key_for_working_smarter_faster_and_more_securely.html
  page_start: 17
  audit_raw: 'Step 1: Identify users with Organization Administrator privileges:

    gcloud organizations get-iam-policy ORGANIZATION_ID

    Look for members granted the role "roles/resourcemanager.organizationAdmin".

    Step 2: Manually verify that Security Key Enforcement has been enabled for each account.'
  remediation: 'Step 1: Identify users with the Organization Administrator role.

    Step 2: Setup Security Key Enforcement for each account. Learn more at:

    https://cloud.google.com/security-key/'
  checks:
  - type: manual_review
    info: 'Step 1: Identify users with Organization Administrator privileges:

      gcloud organizations get-iam-policy ORGANIZATION_ID

      Look for members granted the role "roles/resourcemanager.organizationAdmin".

      Step 2: Manually verify that Security Key Enforcement has been enabled for each account.'
    severity: medium
- id: '1.4'
  title: Ensure that there are only GCP-managed service account keys for each service account
  scoring: scored
  profile:
  - Level 1
  description: User managed service accounts should not have user-managed keys.
  rationale: 'Anyone who has access to the keys will be able to access resources through the service account. GCP-managed
    keys are used by Cloud Platform services such as App Engine and Compute Engine. These keys cannot be downloaded. Google
    will keep the keys and automatically rotate them on an approximately weekly basis. User-managed keys are created, downloadable,
    and managed by users. They expire 10 years from creation. For user-managed keys, the user has to take ownership of key
    management activities which include: • Key storage • Key distribution • Key revocation • Key rotation • Protecting the
    keys from unauthorized users • Key recovery Even with key owner precautions, keys can be easily leaked by common development
    malpractices like checking keys into the source code or leaving them in the Downloads directory, or accidentally leaving
    them on support blogs/channels. It is recommended to prevent user-managed service account keys.'
  impact: Deleting user-managed Service Account Keys may break communication with the applications using the corresponding
    keys.
  references:
  - 1. https://cloud.google.com/iam/docs/understanding-serviceaccounts#managing_service_account_keys
  - 2. https://cloud.google.com/resource-manager/docs/organization-policy/restrictingservice-accounts
  page_start: 19
  audit_raw: 'From Console:

    1. Go to the IAM page in the GCP Console using

    https://console.cloud.google.com/iam-admin/iam

    2. In the left navigation pane, click Service accounts. All service accounts and their

    corresponding keys are listed.

    3. Click the service accounts and check if keys exist.

    19 | P a g e

    From Command Line:

    List All the service accounts:

    gcloud iam service-accounts list

    Identify user-managed service accounts as such account EMAIL ends with

    iam.gserviceaccount.com

    For each user-managed service account, list the keys managed by the user:

    gcloud iam service-accounts keys list --iam-account=<Service Account> --

    managed-by=user

    No keys should be listed.'
  remediation: 'From Console:

    1. Go to the IAM page in the GCP Console using

    https://console.cloud.google.com/iam-admin/iam

    2. In the left navigation pane, click Service accounts. All service accounts and their

    corresponding keys are listed.

    3. Click the service account.

    4. Click the edit and delete the keys.

    From CLI:

    To delete a user managed Service Account Key,

    gcloud iam service-accounts keys delete --iam-account=<user-managed-serviceaccount-EMAIL> <KEY-ID>

    Prevention:

    You can disable service account key creation through the Disable service account key

    creation Organization policy by visiting https://console.cloud.google.com/iamadmin/orgpolicies/iam-disableServiceAccountKeyCreation.
    Learn more at:

    https://cloud.google.com/resource-manager/docs/organization-policy/restrictingservice-accounts

    In addition, if you do not need to have service accounts in your project, you can also

    prevent the creation of service accounts through the Disable service account creation

    Organization policy: https://console.cloud.google.com/iam-admin/orgpolicies/iamdisableServiceAccountCreation.

    20 | P a g e'
  checks:
  - type: manual_review
    info: 'From Console:

      1. Go to the IAM page in the GCP Console using

      https://console.cloud.google.com/iam-admin/iam

      2. In the left navigation pane, click Service accounts. All service accounts and their

      corresponding keys are listed.

      3. Click the service accounts and check if keys exist.

      19 | P a g e

      From Command Line:

      List All the service accounts:

      gcloud iam service-accounts list

      Identify user-managed service accounts as such account EMAIL ends with

      iam.gserviceaccount.com

      For each user-managed servic'
    severity: medium
- id: '1.5'
  title: Ensure that Service Account has no Admin privileges
  scoring: scored
  profile:
  - Level 1
  description: A service account is a special Google account that belongs to an application or a VM, instead of to an individual
    end-user. The application uses the service account to call the service's Google API so that users aren't directly involved.
    It's recommended not to use admin access for ServiceAccount.
  rationale: Service accounts represent service-level security of the Resources (application or a VM) which can be determined
    by the roles assigned to it. Enrolling ServiceAccount with Admin rights gives full access to an assigned application or
    a VM. A ServiceAccount Access holder can perform critical actions like delete, update change settings, etc. without user
    intervention. For this reason, it's recommended that service accounts not have Admin rights.
  impact: Removing *Admin or*adminorEditororOwner` role assignments from service accounts may break functionality that uses
    impacted service accounts. Required role(s) should be assigned to impacted service accounts in order to restore broken
    functionalities.
  references:
  - 1. https://cloud.google.com/sdk/gcloud/reference/iam/service-accounts/
  - 2. https://cloud.google.com/iam/docs/understanding-roles
  page_start: 22
  audit_raw: "From Console:\n1. Go to IAM & admin/IAM using https://console.cloud.google.com/iam-admin/iam\n2. Go to the Members\n\
    3. Ensure that there are no User-Managed user created service account(s) with\nroles containing *Admin or *admin or role\
    \ matching Editor or role matching Owner\nFrom Command Line:\n1. Get the policy that you want to modify, and write it\
    \ to a JSON file:\ngcloud projects get-iam-policy PROJECT_ID --format json > iam.json\n2. The contents of the JSON file\
    \ will look similar to the following. Note that role of\nmembers group associated with each serviceaccount does not contain\
    \ *Admin or\n*admin or does not match roles/editor or does not match roles/owner.\nThis recommendation is only applicable\
    \ to User-Managed user-created service accounts.\nThese accounts have the nomenclature:\nSERVICE_ACCOUNT_NAME@PROJECT_ID.iam.gserviceaccount.com\
    \ . Note that some Googlemanaged, Google-created service accounts have the same naming format, and should be\n22 | P a\
    \ g e\nexcluded (e.g., appsdev-apps-dev-script-auth@system.gserviceaccount.com which\nneeds the Owner role).\nSample Json\
    \ output:\n{\n\"bindings\": [\n{\n \"members\": [\n \"serviceAccount:our-project-123@appspot.gserviceaccount.com\",\n\
    \ ],\n \"role\": \"roles/appengine.appAdmin\"\n},\n{\n \"members\": [\n \"user:email1@gmail.com\"\n ],\n \"role\": \"\
    roles/owner\"\n},\n{\n \"members\": [\n \"serviceAccount:our-project-123@appspot.gserviceaccount.com\",\n \"serviceAccount:123456789012-compute@developer.gserviceaccount.com\"\
    \n ],\n \"role\": \"roles/editor\"\n}\n],\n\"etag\": \"BwUjMhCsNvY=\",\n\"version\": 1\n}"
  remediation: "From Console\n1. Go to IAM & admin/IAM using https://console.cloud.google.com/iam-admin/iam\n2. Go to the\
    \ Members\n3. Identify User-Managed user created service account with roles containing *Admin\nor *admin or role matching\
    \ Editor or role matching Owner\n4. Click the Delete bin icon to remove the role from the member (service account in\n\
    this case)\nFrom Command Line:\n1. Using a text editor, Remove Role which contains roles/*Admin or roles/*admin or\nmatched\
    \ roles/editor or matches 'roles/owner`. Add a role to the bindings array\nthat defines the group members and the role\
    \ for those members.\nFor example, to grant the role roles/appengine.appViewer to the ServiceAccount which is\nroles/editor,\
    \ you would change the example shown below as follows:\n23 | P a g e\n{\n\"bindings\": [\n{\n \"members\": [\n \"serviceAccount:our-project-123@appspot.gserviceaccount.com\"\
    ,\n ],\n \"role\": \"roles/appengine.appViewer\"\n},\n{\n \"members\": [\n \"user:email1@gmail.com\"\n ],\n \"role\":\
    \ \"roles/owner\"\n },\n{\n \"members\": [\n \"serviceAccount:our-project-123@appspot.gserviceaccount.com\",\n \"serviceAccount:123456789012-compute@developer.gserviceaccount.com\"\
