  title: Ensure that Cloud SQL database instances are not open to the world
  scoring: scored
  profile:
  - Level 1
  description: Database Server should accept connections only from trusted Network(s)/IP(s) and restrict access from the world.
  rationale: To minimize attack surface on a Database server instance, only trusted/known and required IP(s) should be white-listed
    to connect to it. An authorized network should not have IPs/networks configured to 0.0.0.0/0 which will allow access to
    the instance from anywhere in the world. Note that authorized networks apply only to instances with public IPs.
  impact: The Cloud SQL database instance would not be available to the world.
  references:
  - 1. https://cloud.google.com/sql/docs/mysql/configure-ip
  - 2. https://console.cloud.google.com/iam-admin/orgpolicies/sqlrestrictAuthorizedNetworks
  page_start: 200
  audit_raw: 'From Console:

    1. Go to the Cloud SQL Instances page in the Google Cloud Console by visiting

    https://console.cloud.google.com/sql/instances.

    2. Click the instance name to open its Instance details page.

    3. Under the Configuration section click Edit configurations

    4. Under Configuration options expand the Connectivity section.

    5. Ensure that no authorized network is configured to allow 0.0.0.0/0.

    From Command Line:

    1. List all Cloud SQL database Instances using the following command:

    gcloud sql instances list

    2. Get detailed configuration for every Cloud SQL database instance.

    gcloud sql instances describe INSTANCE_NAME

    Ensure that the section settings: ipConfiguration : authorizedNetworks does not

    have any parameter value containing 0.0.0.0/0.

    200 | P a g e'
  remediation: 'From Console:

    1. Go to the Cloud SQL Instances page in the Google Cloud Console by visiting

    https://console.cloud.google.com/sql/instances.

    2. Click the instance name to open its Instance details page.

    3. Under the Configuration section click Edit configurations

    4. Under Configuration options expand the Connectivity section.

    5. Click the delete icon for the authorized network 0.0.0.0/0.

    6. Click Save to update the instance.

    From Command Line:

    Update the authorized network list by dropping off any addresses.

    gcloud sql instances patch INSTANCE_NAME --authorizednetworks=IP_ADDR1,IP_ADDR2...

    Prevention:

    To prevent new SQL instances from being configured to accept incoming connections from

    any IP addresses, set up a Restrict Authorized Networks on Cloud SQL instances

    Organization Policy at: https://console.cloud.google.com/iam-admin/orgpolicies/sqlrestrictAuthorizedNetworks.'
  checks:
  - type: manual_review
    info: 'From Console:

      1. Go to the Cloud SQL Instances page in the Google Cloud Console by visiting

      https://console.cloud.google.com/sql/instances.

      2. Click the instance name to open its Instance details page.

      3. Under the Configuration section click Edit configurations

      4. Under Configuration options expand the Connectivity section.

      5. Ensure that no authorized network is configured to allow 0.0.0.0/0.

      From Command Line:

      1. List all Cloud SQL database Instances using the following command:

      gcloud sql in'
    severity: medium
- id: '6.6'
  title: Ensure that Cloud SQL database instances do not have public IPs
  scoring: scored
  profile:
  - Level 2
  description: It is recommended to configure Second Generation Sql instance to use private IPs instead of public IPs.
  rationale: To lower the organization's attack surface, Cloud SQL databases should not have public IPs. Private IPs provide
    improved network security and lower latency for your application.
  impact: Removing the public IP address on SQL instances may break some applications that relied on it for database connectivity.
  references:
  - 1. https://cloud.google.com/sql/docs/mysql/configure-private-ip
  - 2. https://cloud.google.com/sql/docs/mysql/private-ip
  page_start: 203
  audit_raw: 'From Console:

    1. Go to the Cloud SQL Instances page in the Google Cloud Console:

    https://console.cloud.google.com/sql/instances

    2. Ensure that every instance has a private IP address and no public IP address

    configured.

    From Command Line:

    1. List all Cloud SQL database instances using the following command:

    gcloud sql instances list

    2. For every instance of type instanceType: CLOUD_SQL_INSTANCE with backendType:

    SECOND_GEN, get detailed configuration. Ignore instances of type

    READ_REPLICA_INSTANCE because these instances inherit their settings from the

    primary instance. Also, note that first generation instances cannot be configured to

    have a private IP address.

    gcloud sql instances describe INSTANCE_NAME

    3. Ensure that the setting ipAddresses has an IP address configured of type: PRIVATE

    and has no IP address of type: PRIMARY. PRIMARY email addresses are public

    addresses. An instance can have both a private and public address at the same time.

    Note also that you cannot use private IP with First Generation instances.

    203 | P a g e'
  remediation: 'From Console:

    1. Go to the Cloud SQL Instances page in the Google Cloud Console:

    https://console.cloud.google.com/sql/instances

    2. Click the instance name to open its Instance details page.

    3. Select the Connections tab.

    4. Deselect the Public IP checkbox.

    5. Click Save to update the instance.

    From Command Line:

    1. For every instance remove its public IP and assign a private IP instead:

    gcloud beta sql instances patch INSTANCE_NAME --network=VPC_NETWOR_NAME --noassign-ip

    2. Confirm the changes using the following command::

    gcloud sql instances describe INSTANCE_NAME

    Prevention:

    To prevent new SQL instances from getting configured with public IP addresses, set up a

    Restrict Public IP access on Cloud SQL instances Organization policy at:

    https://console.cloud.google.com/iam-admin/orgpolicies/sql-restrictPublicIp.'
  checks:
  - type: manual_review
    info: 'From Console:

      1. Go to the Cloud SQL Instances page in the Google Cloud Console:

      https://console.cloud.google.com/sql/instances

      2. Ensure that every instance has a private IP address and no public IP address

      configured.

      From Command Line:

      1. List all Cloud SQL database instances using the following command:

      gcloud sql instances list

      2. For every instance of type instanceType: CLOUD_SQL_INSTANCE with backendType:

      SECOND_GEN, get detailed configuration. Ignore instances of type

      READ_REPLICA_INSTAN'
    severity: medium
- id: '6.7'
  title: Ensure that Cloud SQL database instances are configured with automated backups
  scoring: scored
  profile:
  - Level 1
  description: It is recommended to have all SQL database instances set to enable automated backups.
  rationale: Backups provide a way to restore a Cloud SQL instance to recover lost data or recover from a problem with that
    instance. Automated backups need to be set for any instance that contains data that should be protected from loss or damage.
    This recommendation is applicable for SQL Server, PostgreSql, MySql generation 1 and MySql generation 2 instances.
  impact: ''
  references:
  - 1. https://cloud.google.com/sql/docs/mysql/backup-recovery/backups
  - 2. https://cloud.google.com/sql/docs/postgres/backup-recovery/backing-up
  page_start: 206
  audit_raw: 'From Console:

    1. Go to the Cloud SQL Instances page in the Google Cloud Console by visiting

    https://console.cloud.google.com/sql/instances.

    2. Click the instance name to open its instance details page.

    3. Go to the Backups menu.

    4. Ensure that Automated backups is set to Enabled and Backup time is mentioned.

    From Command Line:

    1. List all Cloud SQL database instances using the following command:

    gcloud sql instances list

    2. Ensure that the below command returns True for every Cloud SQL database

    instance.

    gcloud sql instances describe INSTANCE_NAME --

    format="value(''Enabled'':settings.backupConfiguration.enabled)"

    206 | P a g e'
  remediation: 'From Console:

    1. Go to the Cloud SQL Instances page in the Google Cloud Console by visiting

    https://console.cloud.google.com/sql/instances.

    2. Select the instance where the backups need to be configured.

    3. Click Edit.

    4. In the Backups section, check `Enable automated backups'', and choose a backup

    window.

    5. Click Save.

    From Command Line:

    1. List all Cloud SQL database instances using the following command:

    gcloud sql instances list

    2. Enable Automated backups for every Cloud SQL database instance using the below

    command:

    gcloud sql instances patch INSTANCE_NAME --backup-start-time [HH:MM]

    The backup-start-time parameter is specified in 24-hour time, in the UTC±00 time zone,

    and specifies the start of a 4-hour backup window. Backups can start any time during the

    backup window.'
  checks:
  - type: manual_review
    info: 'From Console:

      1. Go to the Cloud SQL Instances page in the Google Cloud Console by visiting

      https://console.cloud.google.com/sql/instances.

      2. Click the instance name to open its instance details page.

      3. Go to the Backups menu.

      4. Ensure that Automated backups is set to Enabled and Backup time is mentioned.

