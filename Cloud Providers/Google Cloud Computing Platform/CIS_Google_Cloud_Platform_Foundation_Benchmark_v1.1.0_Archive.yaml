- id: '1.7'
  title: Ensure user-managed/external keys for service accounts are rotated every 90 days or less
  scoring: scored
  profile:
  - Level 1
  description: Service Account keys consist of a key ID (Private_key_Id) and Private key, which are used to sign programmatic
    requests users make to Google cloud services accessible to that particular service account. It is recommended that all
    Service Account keys are regularly rotated.
  rationale: Rotating Service Account keys will reduce the window of opportunity for an access key that is associated with
    a compromised or terminated account to be used. Service Account keys should be rotated to ensure that data cannot be accessed
    with an old key that might have been lost, cracked, or stolen. Each service account is associated with a key pair managed
    by Google Cloud Platform (GCP). It is used for service-to-service authentication within GCP. Google rotates the keys daily.
    GCP provides the option to create one or more user-managed (also called external key pairs) key pairs for use from outside
    GCP (for example, for use with Application Default Credentials). When a new key pair is created, the user is required
    to download the private key (which is not retained by Google). With external keys, users are responsible for keeping the
    private key secure and other management operations such as key rotation. External keys can be managed by the IAM API,
    gcloud command-line tool, or the Service Accounts page in the Google Cloud Platform Console. GCP facilitates up to 10
    external service account keys per service account to facilitate key rotation.
  impact: Rotating service account keys will break communication for dependent applications. Dependent applications need to
    be configured manually with the new key ID displayed in the Service account keyssection and the private key downloaded
    by the user. 31 | P a g e
  references:
  - 1. https://cloud.google.com/iam/docs/understanding-serviceaccounts#managing_service_account_keys
  - 2. https://cloud.google.com/sdk/gcloud/reference/iam/service-accounts/keys/list
  page_start: 30
  audit_raw: 'From Console:

    1. Go to APIs & Services\Credentials using

    https://console.cloud.google.com/apis/credentials

    2. In the section Service Account Keys, for every External (user-managed) service

    account key listed ensure the creation date is within the past 90 days.

    30 | P a g e

    From Command Line:

    1. List all Service accounts from a project.

    gcloud iam service-accounts list

    2. For every service account list service account keys.

    gcloud iam service-accounts keys list --iam-account

    [Service_Account_Email_Id] --format=json

    3. Ensure every service account key for a service account has a "validAfterTime"

    value within the past 90 days.'
  remediation: 'From Console:

    Delete any external (user-managed) Service Account Key older than 90 days:

    1. Go to APIs & Services\Credentials using

    https://console.cloud.google.com/apis/credentials

    2. In the Section Service Account Keys, for every external (user-managed) service

    account key where creation date is greater than or equal to the past 90 days, click

    Delete Bin Icon to Delete Service Account key

    Create a new external (user-managed) Service Account Key for a Service Account:

    1. Go to APIs & Services\Credentials using

    https://console.cloud.google.com/apis/credentials

    2. Click Create Credentials and Select Service Account Key.

    3. Choose the service account in the drop-down list for which an External (usermanaged) Service Account key needs to be
    created.

    4. Select the desired key type format among JSON or P12.

    5. Click Create. It will download the private key. Keep it safe.

    6. Click Close if prompted.

    7. The site will redirect to the APIs & Services\Credentials page. Make a note of the

    new ID displayed in the Service account keys section.'
  checks:
  - type: manual_review
    info: 'From Console:

      1. Go to APIs & Services\Credentials using

      https://console.cloud.google.com/apis/credentials

      2. In the section Service Account Keys, for every External (user-managed) service

      account key listed ensure the creation date is within the past 90 days.

      30 | P a g e

      From Command Line:

      1. List all Service accounts from a project.

      gcloud iam service-accounts list

      2. For every service account list service account keys.

      gcloud iam service-accounts keys list --iam-account

      [Service_Account_Emai'
    severity: medium
- id: '1.8'
  title: Ensure that Separation of duties is enforced while assigning service account related roles to users
  scoring: scored
  profile:
  - Level 2
  description: It is recommended that the principle of 'Separation of Duties' is enforced while assigning service-account
    related roles to users.
  rationale: The built-in/predefined IAM role Service Account admin allows the user/identity to create, delete, and manage
    service account(s). The built-in/predefined IAM role Service Account User allows the user/identity (with adequate privileges
    on Compute and App Engine) to assign service account(s) to Apps/Compute Instances. Separation of duties is the concept
    of ensuring that one individual does not have all necessary permissions to be able to complete a malicious action. In
    Cloud IAM - service accounts, this could be an action such as using a service account to access resources that user should
    not normally have access to. Separation of duties is a business control typically used in larger organizations, meant
    to help avoid security or privacy incidents and errors. It is considered best practice. No user should have Service Account
    Admin and Service Account Userroles assigned at the same time.
  impact: The removed role should be assigned to a different user based on business needs.
  references:
  - 1. https://cloud.google.com/iam/docs/service-accounts
  - 2. https://cloud.google.com/iam/docs/understanding-roles
  page_start: 33
  audit_raw: 'From Console:

    1. Go to IAM & Admin/IAM using https://console.cloud.google.com/iam-admin/iam.

    2. Ensure no member has the roles Service Account Admin and Service account

    User assigned together.

    From Command Line:

    1. List all users and role assignments:

    gcloud projects get-iam-policy [Project_ID]

    33 | P a g e

    2. Ensure that there are no common users found in the member section for roles

    roles/iam.serviceAccountAdmin and roles/iam.serviceAccountUser'
  remediation: 'From Console:

    1. Go to IAM & Admin/IAM using https://console.cloud.google.com/iam-admin/iam.

    2. For any member having both Service Account Admin and Service account User

    roles granted/assigned, click the Delete Bin icon to remove either role from the

    member.

    Removal of a role should be done based on the business requirements.'
  checks:
  - type: manual_review
    info: 'From Console:

      1. Go to IAM & Admin/IAM using https://console.cloud.google.com/iam-admin/iam.

      2. Ensure no member has the roles Service Account Admin and Service account

      User assigned together.

      From Command Line:

      1. List all users and role assignments:

      gcloud projects get-iam-policy [Project_ID]

      33 | P a g e

      2. Ensure that there are no common users found in the member section for roles

      roles/iam.serviceAccountAdmin and roles/iam.serviceAccountUser'
    severity: medium
- id: '1.9'
  title: Ensure that Cloud KMS cryptokeys are not anonymously or publicly accessible
  scoring: scored
  profile:
  - Level 1
  description: It is recommended that the IAM policy on Cloud KMS cryptokeys should restrict anonymous and/or public access.
  rationale: Granting permissions to allUsers or allAuthenticatedUsers allows anyone to access the dataset. Such access might
    not be desirable if sensitive data is stored at the location. In this case, ensure that anonymous and/or public access
    to a Cloud KMS cryptokey is not allowed.
  impact: Removing the binding for allUsers and allAuthenticatedUsers members denies accessing cryptokeys to anonymous or
    public users.
  references:
  - 1. https://cloud.google.com/sdk/gcloud/reference/kms/keys/remove-iam-policybinding
  - 2. https://cloud.google.com/sdk/gcloud/reference/kms/keys/set-iam-policy
  - 1. Open the Cryptographic Keys page in the Cloud Console.
  - 2. For the key ring whose resource ID you are retrieving, click the More icon (3
  - 1. Open the Cryptographic Keys page in the Cloud Console.
  - 2. Click the name of the key ring that contains the key.
  page_start: 35
  audit_raw: 'From Command Line:

    1. List all Cloud KMS Cryptokeys.

