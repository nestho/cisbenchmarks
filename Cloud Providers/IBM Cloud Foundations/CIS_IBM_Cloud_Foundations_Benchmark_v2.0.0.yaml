- id: 8.1.1.1
  title: Ensure IBM Key Protect has automated rotation for customer managed keys enabled
  scoring: scored
  profile:
  - Level 2
  description: IBM® Key Protect for IBM Cloud® allows you to rotate your root key (CRK) which is the key material created
    within the KMS Hardware Security Module (HSM) when you created the root key using KP APIs. This CRK is used to encrypt
    the Data Encryption Key (DEK) that is used to encrypt your data. By encrypting the DEK (wDEK), wDEK can be stored with
    the data. It is a best practice to rotate your CRK (that is, to create a new version of the key) on a regular basis. Regular
    rotations reduce what is known as the "cryptoperiod" of the key and can also be used in specific cases such as personnel
    turnover, process malfunctions, or the detection of a security issue. You can set a rotation interval on the CRK or manually
    rotate the CRK based on your organization policy. When it's time to rotate the key based on the rotation interval that
    you specify, Key Protect automatically creates a new root key in the HSM. Automated key rotation currently retains all
    prior CRK key versions so that only decryption of encrypted data with the older version of the CRK can take place transparently.
    Frequency of key rotation After you generate a root key in Key Protect, you decide the frequency of its rotation. You
    might want to rotate your keys due to personnel turnover, process malfunction, or according to your organization's internal
    key expiration policy. Rotate your keys regularly, for example every 30 days, to meet cryptographic best practices.
  rationale: 'Rotating keys on a regular basis helps you meet industry standards and cryptographic best practices. The following
    describes the main benefits of key rotation: • Cryptoperiod management for keys - Key rotation limits how long your information
    is protected by a single key. By rotating your root keys at regular intervals, you also shorten the cryptoperiod of the
    keys. The longer the lifetime of an encryption key, the higher the probability for a security breach. • Incident mitigation
    - If your organization detects a security issue, you can immediately rotate the key to mitigate or reduce costs that are
    associated with key compromise.'
  impact: After CRK is rotated, to secure your envelope encryption workflow, rewrap your DEKs after you rotate a root key
    so that your at-rest data is protected by the newest root key. Alternatively, if Key Protect detects that you're using
    retired key versions to unwrap a DEK, the service automatically re-encrypts the DEK and returns a wrapped data encryption
    key (WDEK) that's based on the latest root key.
  references:
  - 1. https://cloud.ibm.com/docs/key-protect?topic=key-protect-key-rotation
  - 2. https://cloud.ibm.com/docs/key-protect?topic=key-protect-set-rotation-policy
  page_start: 208
  audit_raw: 'Using Console:

    1. Log in to the IBM Cloud® console.

    2. Go to Menu, Resource List to view a list of your resources.

    3. From your IBM Cloud resource list, click on Security select your provisioned

    instance of Key Protect.

    4. On the left-hand panel, click on Policies and view the rotation policy

    enabled for the instance

    5. If the rotation policy is not enabled, you can view rotation policy set per key by

    clicking keys on the left-hand panel

    6. From the list of keys displayed, you can click on overflow menu (three dots) at

    the end of the key to view the rotation policy for the key

    Using API:

    You can view automatic rotation policy using GET call to the following endpoint.

    https://<region>.kms.cloud.ibm.com/api/v2/keys/{id}/policies

    API: For a high-level view, you can browse the rotation policies that are associated with

    a key by making a GET call to the following endpoint.

    https://<region>.kms.cloud.ibm.com/api/v2/keys/<key_ID>/policies

    1. Retrieve your service and authentication credentials.

    2. Retrieve the rotation policy for a specified key by running the following cURL

    command.

    $ curl -X GET \

    "https://<region>.kms.cloud.ibm.com/api/v2/keys/<key_ID>/policies" \

    -H "authorization: Bearer <IAM_token>" \

    -H "bluemix-instance: <instance_ID>" \

    -H "content-type: application/vnd.ibm.kms.policy+json" \ -H "correlation-id:

    <correlation_ID>"'
  remediation: "Using Console:\n1. Log in to the IBM Cloud console.\n2. Go to Menu, Resource List to view a list of your resources.\n\
    3. From your IBM Cloud resource list, select your provisioned instance of Key\nProtect.\n4. On the application details\
    \ page, use the Keys table to browse the keys in your\nservice. If you have many keys, you can narrow your search by using\
    \ the search\nbars to only search for enabled keys (since other kinds of keys cannot be\nrotated), keys in a particular\
    \ key ring, and keys with a particular alias.\n5. Once the key has been found, click the overflow menu (three dots) to\
    \ open a list\nof options for the key that you want to rotate.\n6. From the options menu, click Rotate to open the Rotation\
    \ side panel.\n7. If your rotation policy is Enabled, you can edit this policy by changing the number\nof months selected.\
    \ This will set the 30-day interval for your root key. If a key is\nset to be rotated every 2 months, for example, it\
    \ will be rotated every 60 days,\nregardless of the number of days in a particular month. If your rotation policy is\n\
    Disabled, and the key was created at a time when your instance had a rotation\npolicy, a rotation interval number can\
    \ be seen. This is the rotation policy that was\nwritten to your key in a Disabled state at key creation time. You can\
    \ also change\nthe rotation interval at this time.\n8. Click Set policy. The policy is now in effect.\nIf you want to\
    \ rotate the key immediately, click Rotate key. Note: these actions\nare not mutually exclusive. If your key has an existing\
    \ rotation policy, the\ninterface displays the key's existing rotation period.\nUsing API:\nCreate or update a rotation\
    \ policy for your root key by making a PUT call to the following\nendpoint. https://<region>.kms.cloud.ibm.com/api/v2/keys/<key_ID>/policies\n\
    Create or update a rotation policy for a specified key by running the following cURL\ncommand.\ncurl -X PUT\nhttps://<region>.kms.cloud.ibm.com/api/v2/keys/<key_ID_or_alias>/policies\
    \ -\nH 'authorization: Bearer <IAM_token>' -H 'bluemix-instance: <instance_ID>'\n-H 'content-type: application/vnd.ibm.kms.policy+json'\
    \ -d '{\n \"metadata\": {\n \"collectionType\": \"application/vnd.ibm.kms.policy+json\",\n \"collectionTotal\": 2\n },\n\
    \ \"resources\": [\n {\n \"type\": \"application/vnd.ibm.kms.policy+json\",\n \"rotation\": {\n \"enabled\": <true|false>,\n\
    \ \"interval_month\": <rotation_interval>\n }\n },\n {\n \"type\": \"application/vnd.ibm.kms.policy+json\",\n \"dualAuthDelete\"\
    : {\n \"enabled\": <true|false>\n }\n }\n ]\n }'"
