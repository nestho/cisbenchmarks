- id: '1.15'
  title: Ensure a support access group has been created to manage incidents with IBM Support
  scoring: manual
  profile:
  - Level 1
  description: If you experience problems with IBM Cloud®, you can use support cases to get help with technical, access (IAM),
    billing & usage, and invoice or sales inquiry issues. You can create and manage a support case by using the Support Center.
    Access to Support Center is governed via IAM roles. In order to access Support Center, a user must have viewer or higher
    on the Support Center service. To create or edit service cases, a user must have editor or higher on the Support Center
    service. After you submit a support case, the support team investigates the issue based on your type of support plan.
    The types of available support depends on the support level of the account. Your support plan also determines the severity
    level that you can assign to support cases. For more information, see Case severity and response time.
  rationale: Support cases are used to raise issues to IBM Cloud. Access to IBM Cloud Support Center is managed via IAM roles.
    IAM roles can be used to efficiently control which users in an organization can view support cases, which can view, edit,
    and delete support cases, and which have no access at all. You can configure different levels of Support Center access
    using Access Groups.
  impact: Users with access to IBM Cloud Support Center can create and/or manage support tickets based on their IAM role.
    Support Center access should be managed and assigned using Access Groups.
