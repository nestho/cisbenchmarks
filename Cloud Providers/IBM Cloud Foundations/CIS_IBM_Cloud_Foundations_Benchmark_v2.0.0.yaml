    6. If the Public access group setting is enabled, proceed to the Access groups page

    by clicking Access Groups.

    7. From the list of Access Groups, select Public Access by clicking on the Access

    Group name.

    8. Ensure that there are no access policies present in the list of access policies.

    9. To delete an access policy, click on the action menu icon for the access policy

    and click Remove.'
