- id: '4.3'
  title: Ensure incoming connections are limited to allowed sources
  scoring: manual
  profile:
  - Level 1
  description: Restrict incoming connections to database instances to approved sources, ensuring access is limited to authorized
    entities.
  rationale: IBM Cloud Databases supports Context-Based Restrictions (CBR) for both public and private endpoints. Context-based
    restrictions give account owners and administrators the ability to define and enforce access restrictions for resources
    based on a rule's criteria. The criteria include the network location of access requests, the endpoint type from where
    the request is sent, the multifactor authentication level of an identity, and sometimes the API that the request tries
    to access.
  impact: ''
  references: []
  page_start: 146
  audit_raw: 'Using Console:

    1. Log on to your IBM Cloud account

    2. On the top bar, click on Manage and then on Context-Based Restrictions

    3. On the left, click on Network zones and then on the Create button.

    4. Give the rule a name and fill out the other details as appropriate. Complete

    creation.

    5. On the left, click on Network rules and then on the Create button

    6. Select the appropriate database resource, such as Databases for

    PostgreSQL. Click on next.

    7. When asked for APIs to protect, deselect All and select Data Plane instead.

    Click on next.

    8. Under Resources, select Specific resources, and then in the dropdown, select

    instance

    9. Click on Select a value, and you can choose a database to match. Click on

    review and then on continue.

    Using CLI:

    1. Create a zone for IP 192.0.2.2

    ibmcloud cbr zone-create --addresses=192.0.2.2 --name=my_zone

    2. Note the ID of the zone from the response, or from the zones list

    ibmcloud cbr zones

    3. Create the rule that only allows the defined zone to connect to our PostgreSQL

    database

    ibmcloud cbr rule-create --enforcement-mode enabled --context-attributes

    networkZoneId=ac31d7c9911cd0b98bb77490b2254258 --service-name databases-forpostgresql --service-instance 8e4ce809-5edd-47c0-b4cd-8737f030f29d
    --apitypes crn:v1:bluemix:public:context-based-restrictions::::api-type:data-plane

    --description my_cbr_rule

    4. Examine the list of rules.

    ibmcloud cbr rules

    Note that the direct “Using IP Allowlists on your Deployment” mechanism, as described

    in https://cloud.ibm.com/docs/cloud-databases?topic=cloud-databasesallowlisting&interface=ui, has been deprecated in favor
    of CBR.'
  remediation: 'Configure restrictions using the following procedure:

    Using Console:

    1. Log on to your IBM Cloud account

    2. On the top bar, click on Manage and then on Context-Based Restrictions

    3. On the left, click on Network zones and then on the Create button.

    4. Give the rule a name and fill out the other details as appropriate. Complete

