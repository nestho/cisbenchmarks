    Granting S3 ACLs to buckets\nGrant the S3 ACLs via API or CLI. A Typical API call is shown:\ncurl -X \"PUT\" \"https://{endpoint}/{bucket-name}?acl\"\
    \ \\\n -H \"Authorization: Bearer {token}\" \\\n -H \"x-amz-acl: <scope>\""
