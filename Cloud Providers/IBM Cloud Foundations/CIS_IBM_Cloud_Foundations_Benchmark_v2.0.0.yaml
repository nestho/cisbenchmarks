- id: '9.1'
  title: Ensure the Default Network Security Group of Every Workspace Restricts All Traffic
  scoring: manual
  profile:
  - Level 1
  description: It is recommended that the default security group for every workspace restricts all inbound (ingress) traffic,
    to enforce a least-privilege security posture and reduce unintended exposure of PowerVS resources.
  rationale: Starting with a default security group configuration that restricts all inbound (ingress) traffic reduces the
    chance of exposing PowerVS resources to unintended risks.
  impact: ''
  references:
