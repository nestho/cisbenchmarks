- id: 2.1.1.2
  title: Ensure Cloud Object Storage Encryption is set to On with BYOK
  scoring: manual
  profile:
  - Level 2
  description: You can use IBM Cloud encryption key management service, for example Key Protect, to bring your own root key
    (BYOK) to IBM Cloud and use it to add envelope encryption for data that is stored in IBM Cloud Object Storage buckets.
  rationale: When it comes to encryption of data at rest in IBM Cloud, the best practice is to allow customers to manage customer
    root keys (CRK) that are used to protect customer data stored in data and storage services in IBM Cloud. Bring your Own
    Key (BYOK) allows customers to ensure no one outside of their organization has access to the root key and and with the
    support of BYOK, customers can manage the lifecycle of their customer root keys where they can create, rotate, delete
    those keys. This provides a significant level of control where those CRKs are managed by the customer, which in turn increases
    both security control as well as meet relevant compliance requirements. These CRKs can be used in turn to protect the
    data encryption keys used to encrypt the data.
  impact: For Bring your Own Key (BYOK) encryption with Cloud Object Storage integration and Key Protect key management service
    you will need to review and understand how you can leverage the integration to handle key lifecycle events (for example
    key rotation, deletion, restore). Refer to the Cloud Object Storage integration with Key Protect section to learn about
    key lifecycle management and Key Protect product page to find out more about the key lifecycle events.
  references:
  - '1. • Data encryption with IBM Cloud Object Storage:'
  - https://cloud.ibm.com/docs/cloud-object-storage?topic=cloud-object-storageencryption
  - '2. • Integrated service availability page: https://cloud.ibm.com/docs/services/cloudobject-storage/basics?topic=cloud-object-storage-service-availability'
  page_start: 66
  audit_raw: 'You can use the IBM Cloud Object Storage bucket configuration properties to verify

