  title: Ensure Cloud Object Storage bucket access is restricted by using IAM and S3 access control
  scoring: manual
  profile:
  - Level 1
  description: Access controls on the Cloud Object Storage buckets are governed via IBM Identity and Access Management (IAM).
    However, some permissions can also be granted (or restricted) via S3 access controls.
  rationale: Assign IAM access roles for users and Service IDs against buckets, by using either the UI or the CLI to create
    policies. The S3 Access Control is performed using ACLs granted against buckets and objects.
  impact: Organizations can use Cloud Object Storage to store sensitive data that may need to be restricted. Therefore, creation
    of a new Cloud Object Storage bucket requires careful review and planning around access controls provided by IBM Cloud
    environment to ensure data access can be restricted to only those having valid business need.
  references:
