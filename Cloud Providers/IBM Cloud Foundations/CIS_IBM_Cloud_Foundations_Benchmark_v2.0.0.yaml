  audit_raw: "Use the following checklist to ensure that events are collected and processed to identify\nanomalies or abnormal\
    \ events:\nThis checklist assumes that you have a different IBM Cloud account for development,\nstaging, Q&A, and production.\
    \ When you separate accounts by domain (for example,\nproduction versus development), you isolate events for each domain\
    \ and location. You\nuse IAM to define permissions to view and manage events in an instance.\nNote: When a user gets read\
    \ permissions to see events in an IBM Cloud Logs instance,\nthe user gets visibility of all events in the region. Therefore,\
    \ separate domains by\naccount to avoid exposing production logs to non-authorized users.\nChecklist\nThe checklist must\
    \ be applied to each environment independently.\n1. Ensure that events from core IBM Cloud core platform services, such\
    \ as IAM are\ncollected and available in the Cloud Logs instance where 'global' events have\nbeen routed to. Check that\
    \ each core service has one or more custom views to\nanalyze the data.\no Check that you see provisioning events\no Check\
    \ that you see IAM identity login events\no Check that you see IAM access group and policy events.\n2. Ensure that events\
    \ from enabled IBM Cloud services are collected in each region\nwhere you operate. Check that events are available in\
    \ the audit instance that is\navailable in the same region as your service instances.\no Check for additional configuration\
    \ steps that a service might require.\no Check that you have a custom view for each service.\no Check that events for\
    \ a specific service are available for analysis through\nthe custom view.\n3. Views can be classified in categories. For\
    \ example, a category might be aligned\nwith a line of business.\no Ensure that views are grouped in categories.\no Check\
    \ that each view belongs to the correct category.\n4. Check that custom views are defined for each service to monitor\
    \ events that\nhave an outcome of failure.\n5. Check that custom views are defined for each service to monitor events\
    \ that\nreport high level threat actions in your account. These events report deletion\nactions in the account.\n6. Check\
    \ that custom views are defined for each service to monitor events that\nreport changes to resources in the account. For\
    \ example, these events report\nactions that modify the state of a resource in your account.\n7. Check that custom views\
    \ are defined for each service to monitor events that\nreport unauthorized or forbidden access to run actions in the account.\n\
    8. Check that custom views are defined for each service to monitor events that\nreport user management actions in the\
    \ account.\n9. Check that custom views are defined for each service to monitor events that\nreport actions on user management\
    \ and related IAM actions.\nUI Instructions\nUI instructions that you can use to check that you have custom views to monitor\
    \ activity\nin your account:\n1. Log in to your IBM Cloud account at https://cloud.ibm.com.\n2. Go to the Menu icon. Then,\
    \ select Observability to access the\nObservability dashboard.\n3. Click Logging. By default Instances are displayed.\n\
    4. Click the Cloud Logs tab.\n5. The list of instances that are available on IBM Cloud is displayed.\nIf the instances\
    \ are not displayed, click Instances, Cloud Logs to display the\nlist of logging instances.\n6. Click Open dashboard for\
    \ your selected instance.\n7. Look for views that report events from core IBM Cloud core platform services,\nsuch as IAM.\
    \ Check that the search criteria of the views match the query\nindicated in the search criteria provided.\no Check that\
    \ each view displays events with actions listed in the Events that\nare generated section.\no Check the description of\
    \ each view and ensure that it is clear and reflects\nthe type of events that are available through the view.\no Name\
    \ your view according to your organization’s naming convention.\nService to check: IAM Identity\n Query: *_platform:iam-identity*\n\
    \ Events that are generated: [Events that are generated when a user or\napp logs in to the IBM\nCloud](https://cloud.ibm.com/docs/account?topic=accountat_events_iam#at_events_iam_login)\n\
    Service to check: IAM Access Management (IAM AM)\n Query: *_platform:iam-am*\n Events that are generated: [Events that\
    \ are generated when you manage\nIAM policies](https://cloud.ibm.com/docs/account?topic=accountat_events_iam#at_events_iam_policies)\n\
    Service to check: IAM Groups\n Query: *_platform:iam-groups*\n Events that are generated: [Events that are generated when\
    \ you manage\naccess groups](https://cloud.ibm.com/docs/account?topic=accountat_events_iam#at_events_iam_access)\n8. Look\
    \ for views that report events from enabled IBM Cloud services.\no Check that the search query to filter data in the custom\
    \ view is in the\nfollowing format:\n_platform:<Service Name>\no Check the description for each view.\no Check that the\
    \ name of each view follows your organization’s naming\nconvention.\nTo see the list of available services, see Cloud\
    \ services.\n9. Check that views are organized and grouped by category.\na. In the Cloud Logs web UI, select All Views\n\
    b. Check the views that are within each folder.\n10. Look for views that report events that fail from enabled IBM Cloud\
    \ services.\no Check that the search query to filter data in the custom view is in the\nfollowing format:\n_platform:<Service\
    \ Name> AND outcome:failure\no Check the description for each view.\no Check that the name of each view follows your organization’s\
    \ naming\nconvention.\nTo see the list of available services, see Cloud services.\n11. Look for views that report high\
    \ level of threat actions in your account.\no Check that the search query to filter data in the custom view is in the\n\
    following format:\n_platform:<Service Name> AND severity:critical\no Check the description for each view.\no Check that\
    \ the name of each view follows your organization’s naming\nconvention.\nTo see the list of available services, see Cloud\
    \ services.\n12. Look for views that report actions that modify the state of resources in your\naccount.\no Check that\
    \ the search query to filter data in the custom view is in the\nfollowing format:\n_platform:<Service Name> AND severity:warning\n\
    o Check the description for each view.\no Check the name of each view follows your organizations naming\nconvention.\n\
    To see the list of available services, see Cloud services.\n13. Look for views that report unauthorized or forbidden permissions\
    \ on in your\naccount.\no Use the following search query to check that the custom view reports\nunauthorized access to\
    \ run the action due to lack of permissions (RC\n401):\nreason.reasonCode:401\no Use the following search query to check\
    \ that the custom view reports\nforbidden access to run the action due to missing credentials (RC 403):\nreason.reasonCode:403\n\
    o Check the description for each view.\no Check that the name of each view follows your organization’s naming\nconvention.\n\
    14. Look for views that report user management actions in your account.\no Use the following search query to check that\
    \ the custom view reports user\nmanagement actions in the account:\n(_platform:BSS AND action:user-management)\no Use\
    \ the following search query to check user management and related\nIAM actions in your account:\n-(_platform:iam-identity\
    \ AND (action login)) AND (_platform:iam\nOR (_platform:BSS AND action:user-management))\no Check the description for\
    \ each view.\no Check that the name of each view follows your organization’s naming\nconvention.\n15. Look for views that\
    \ report successful logins in your account.\no Use the following search query to check the custom view:\n_platform:iam-identity\
    \ AND (action login)\no Check the description for each view.\no Check that the name of each view follows your organization’s\
    \ naming\nconvention.\n16. Look for views that report Security Advisor findings, that is, security incidents that\nare\
    \ monitored by IBM Cloud Security Advisor in your account.\no Check the description for each view.\no Check that the name\
    \ of each view follows your organization’s naming\nconvention.\nUse the following checklist to ensure alerts are defined\
    \ on custom views to notify of\nunauthorized requests, critical account actions, and high-impact operations in your\n\
    account.\nThis checklist assumes that you have a different IBM Cloud account for development,\nstaging, Q&A, and production.\
    \ The checklist must be applied to each environment\nindependently.\nIn IBM Cloud Logs, you configure alerts that define\
    \ the triggering conditions on filtered\ndata on which you want to be notified. In IBM Cloud Event Notifications, you\
    \ configure\nthe destinations where you want to be notified for an alert and the conditions that define\nto which destination\
    \ an event is routed. You can route events to one or more\ndestinations based on conditions that you configure. You can\
    \ notify to a service\ndestination such as a webhook or PagerDuty, or to a human destination such as email\nor slack.\n\
    To check and confirm that alerts are correctly configured, perform the following checks:\n1. Verify the outbound connection\
    \ from IBM Cloud Logs to the IBM Cloud Event\nNotifications service.\na. First, complete the following steps in the Event\
    \ Notifications instance:\ni. Verify the source with name IBM Cloud Logs - <CLOUD_LOGS_INSTANCE_ID>, that\nmatches your\
    \ integration name, is created in the IBM Cloud Event Notifications\ninstance.\n• Select Sources.\n• Look for the source\
    \ with name IBM Cloud Logs -\n<CLOUD_LOGS_INSTANCE_ID>.\nii. Create a topic that specifies this Cloud Logs instance as\
    \ the source and Event\ntype scoped to Test Event.\n• Select Topics. Then, click Create.\n• Enter a topic name, for example,\
    \ CloudLogsInstance-test.\n• Select the source IBM Cloud Logs - <CLOUD_LOGS_INSTANCE_ID> for the\ninstance whose integration\
    \ you want to test.\n• Select the Event type Test Event.\n• Select Add a condition, Save source.\n• Click Create.\niii.\
    \ Create a destination and verify the destination is configured. For example, you\ncan configure a Slack destination or\
    \ an email.\niv. Create a Subscription pairing the topic and the destination.\n• Enter a name, for example, Test integration.\n\
    • Select the topic CloudLogsInstance-test.\n• Select a destination.\n• Click Create.\nb. Next, in the IBM Cloud Logs UI,\
    \ complete the following steps:\ni. Edit the outbound integration.\nii. Click Test.\niii. Check your chosen destination\
    \ and verify the test event has been sent.\n2. Ensure all required alerts are defined in the IBM Cloud Logs instance.\
    \ Normal\nuse and behavior can vary depending on the workload that each client is running.\nEach client is encouraged\
    \ to develop and maintain a list of critical alert. Review\nthe configured alerts to ensure there is coverage for all\
    \ rules required by your\norganization.\n3. Ensure the IBM Cloud Event Notifications instance is configured to route event\n\
    notifications when an alert is triggered in IBM Cloud Logs to your target\ndestinations.\na. Ensure 1 or more topics are\
    \ defined.\n• A topic defines the alert conditions that you want to group together.\n• For example, if you have multiple\
    \ alert definitions in your IBM Cloud Logs\ninstance that notify through the same slack channel, you can configure these\n\
    alerts within the same topic.\n• Another example, if you have multiple alert definitions in your IBM Cloud Logs\ninstance\
    \ that notify through different slack channels, you must configure as many\ntopics as slack channels you use, and include\
    \ in a topic the alerts that notify\nthrough the same slack channel.\nb. Define 1 or more destinations.\n• A destination\
    \ defines a notification channel that you can use to notify when an\nalert is triggered.\n• For more information on destinations,\
    \ see Supported destinations.\nc. Define 1 or more subscriptions.\n• A subscription links 1 topic with 1 destination.\n\
    • You must add subscriptions to define the alerts configured in a topic are the ones\nnotified through the destination\
    \ selected in the subscription configuration.\n• A subscription correlates one topic with a notification channel.\n• You\
    \ can have multiple subscriptions with the same topic so you can alert through\nmultiple destination channels.\n4. For\
    \ each custom view in Cloud Logs, check the purpose of the view and ensure\nsuitable alerts have been created based on\
    \ the insights gained from that view\n5. Check that alerts have been configured for each of the following custom views:\n\
    • Custom views that are defined for each service to monitor events that have an\noutcome of failure.\n• Custom views that\
    \ are defined for each service to monitor events that have a\nseverity set to critical. These events report deletion actions\
    \ in the account.\n• Custom views that are defined for service to monitor events that have a severity\nset to warning.\
    \ These events report actions that modify the state of a resource in\nyour account.\n• Custom views that are defined for\
    \ each service to monitor events that have a\nreason code set to 403 or 409. These events report requests on a service\
    \ that\nare not authorized.\n• Custom views that are defined for each service to monitor events that report\nactions on\
    \ access groups, changes of policies, user management, service IDs.\nThese events report IAM actions in the account.\n\
    • Custom views that report Security Advisor findings, that is, security incidents that\nare monitored by IBM Cloud Security\
    \ Advisor in your account.\nUI instructions that you can use to check that alerts on custom views are defined\nand working.\n\
    This checklist assumes that you have a different IBM Cloud account for development,\nstaging, Q&A, and production. The\
    \ checklist must be applied to each environment\nindependently.\n1. Log in to IBM Cloud at https://cloud.ibm.com.\n2.\
    \ Go to the Menu icon. Then, select Observability to access the\nObservability dashboard.\n3. Click Logging. By default\
    \ Instances are displayed.\n4. Click the Cloud Logs tab.\n5. The list of instances that are available on IBM Cloud is\
    \ displayed. If the instances\nare not displayed, click Instances, Cloud Logs to display the list of logging\ninstances.\n\
    6. Click Open dashboard for your selected instance.\n7. Look for views that report events from core IBM Cloud core platform\
    \ services,\nsuch as IAM, as well as those related to the conditions described in the\nBenchmark section 3.3.\n8. Check\
    \ that alert definitions are defined. In the IBM Cloud Logs navigation, click\nthe Alerts icon, Alerts Management.\n9.\
    \ For each custom view and alert notification channel, verify that you see an alert\nnotification so that you can validate\
    \ that the alert is being generated."
  remediation: 'UI instructions that you can use to create custom views when one or more are missing

    in the account:

    1. Log in to your IBM Cloud account at https://cloud.ibm.com.

    2. Go to the Menu icon. Then, select Observability to access the

    Observability dashboard.

    3. Click Logging. By default Instances are displayed.

    4. Click the Cloud Logs tab.

    5. The list of instances that are available on IBM Cloud is displayed.

    If the instances are not displayed, click Instances, Cloud Logs to display the

    list of logging instances.

    6. Click Open dashboard for your selected instance.

    7. In the left navigation, click the Explore logs icon, Logs.

    8. The last view you had opened will be displayed. If no view was previously open,

    all views will be displayed.

    9. Select the fields to be included in the view. By default you can select

    Applications, Subsystems, and log Severities.

    10. (Optional) Add additional filters click + Add Filter and select and configure

    additional field and filter values.

    11. Select if you want you view to only include Priority Logs (those in the Priority

    insights pipeline) or All Logs, that is, logs that are stored in IBM Cloud Object

    Storage. Logs in IBM Cloud Object Storage includes logs collected through all

    the data pipelines.

    12. (Optional) Add a Lucene or DataPrime query to further filter your data.

    13. Specify the time interval for the view, for example Last 2 Days.

    14. Save your view by clicking the three dots ...

    a. Enter a name for your view.

    b. If you want to save the query and filter values you configured, check Save query

    and filters.

    c. If you want your view to be the default view, check Set as default view. This sets

    the view as the default for you as the user. It does not set the view as the default view

    for the entire account.

    d. Set the privacy of your view. Private views can only be seen by you. You can set a

    view as Private or Shared.

    15. If you are missing views to monitor events from core IBM Cloud core platform

    services, such as IAM, create custom views for each of the following services.

    Use the search criteria provided.

    o Check that each view displays events with actions listed in the Events that

    are generated section.

    o Check the description of each view and ensure that it is clear and reflects

    the type of events that are available through the view.

    o Name your view according to your organization’s naming convention.

    Service to check: IAM Identity

    Query: *_platform:iam-identity*

    Events that are generated: [Events that are generated when a user or

    app logs in to the IBM

    Cloud](https://cloud.ibm.com/docs/account?topic=accountat_events_iam#at_events_iam_login)

    Service to check: IAM Access Management (IAM AM)

    Query: *_platform:iam-am*

    Events that are generated: [Events that are generated when you manage

    IAM policies](https://cloud.ibm.com/docs/account?topic=accountat_events_iam#at_events_iam_policies)

    Service to check: IAM Groups

    Query: *_platform:iam-groups*

    Events that are generated: [Events that are generated when you manage

    access groups](https://cloud.ibm.com/docs/account?topic=accountat_events_iam#at_events_iam_access)

    16. If you are missing views to monitor events from enabled IBM Cloud services,

    create custom views for each one of them.

    o Use the following search query to filter data in the custom view:

    _platform:<Service Name>

    o Add a description to each view.

    o Name your view according to your organization’s naming convention.

    To see the list of available services, see Cloud services.

    17. If views are not organized and grouped by folder, create as many folders as you

    want, and assign views.

    1. In the Cloud Logs web UI, select All Views.

    2. To create a new folder, click the folder icon. Enter a folder name, and click

    Create.

    3. Move views to folders by dragging them to the folder.

    18. If you are missing views to monitor events from enabled IBM Cloud services that

    report failures, create custom views for each one of them.

    Use the following search query to filter data in the custom view:

    _platform:<Service Name> AND outcome:failure

    Add a description to each view.

    Name your view according to your organization’s naming convention.

    To see the list of available services, see Cloud services.

    19. If you are missing views to monitor events that report high level of threat actions

    in your account, create custom views for each one of them.

    Use the following search query to filter data in the custom view:

    _platform:<Service Name> AND severity:critical

    Add a description to each view.

    Name your view according to your organization’s naming convention.

    To see the list of available services, see Cloud services.

    20. If you are missing views to monitor events that report actions that modify the

    state of resources in your account, create custom views for each one of them.

    Use the following search query to filter data in the custom view:

    _platform:<Service Name> AND severity:warning

    Add a description to each view.

    Name your view according to your organization’s naming convention.

    To see the list of available services, see Cloud services.

    21. If you are missing views to monitor events that report unauthorized or forbidden

    permissions in your account, create custom views for each one of them.

    Use the following search query to filter data in the custom view that reports

    unauthorized access to run the action due to lack of permissions (RC 401):

    reason.reasonCode:401

    Use the following search query to filter data in the custom view that reports

    forbidden access to run the action due to missing credentials (RC 403):

    reason.reasonCode:403

    Add a description to each view.

    Name your view according to your organization’s naming convention.

    22. If you are missing views to monitor events that report user management actions

    in your account, create custom views for each one of them.

    Use the following search query to filter data in the custom view that report user

    management actions in the account:

    (_platform:BSS AND action:user-management)

    Use the following search query to filter data in the custom view to report user

    management and related IAM actions in your account:

    -(_platform:iam-identity AND (action login)) AND (_platform:iam OR

    (_platform:BSS AND action:user-management))

    Add a description to each view.

    Name your view according to your organization’s naming convention.

    23. If you are missing views to monitor events that report successful logins in your

    account, create a custom view.

    Use the following search query to filter data in the custom view:

    _platform:iam-identity AND (action login)

    Add a description to the view.

    Name your view according to your organization’s naming convention.

    UI instructions that you can use to create alerts on custom views:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. Go to the Menu icon. Then, select Observability to access the

    Observability dashboard.

    3. Click Logging. By default Instances are displayed.

    4. Click the Cloud Logs tab.

    5. The list of instances that are available on IBM Cloud is displayed. If the instances

    are not displayed, click Instances, Cloud Logs to display the list of logging

    instances.

    6. Click Open dashboard for your selected instance.

    7. Configure alerts for any missing alerts.

    UI Instructions that you can use to create missing outbound integration to

    connect IBM Cloud Logs with IBM Cloud Event Notifications:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. In the console, click the Navigation Menu icon, Resource list.

    3. Select your instance of IBM Cloud Logs.

    4. In the IBM Cloud Logs navigation, click the Integrations icon, Outbound

    integrations.

    5. In the outbound integrations section, find Event Notifications and click Add.

    6. On the Integrations page, click Add new.

    7. If an IAM authorization between IBM Cloud Logs and Event Notifications doesn''t

    exist in your account, you must configure one by clicking IAM Authorizations.

    Follow the prompts to grant access between the services. For more information,

    see Creating a S2S authorization to work with the IBM Cloud Event Notifications

    service.

    8. Enter a name for the integration.

    9. Select the Event Notifications service instance that you want to connect to your

    IBM Cloud Logs instance.

    10. Select the Endpoint Type as public or private. For more information, see

    Service endpoints for Event Notifications

    11. To confirm the connection, click Save.'
