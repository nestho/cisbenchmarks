- id: 2.1.2
  title: Ensure network access for Cloud Object Storage is restricted to specific IP range
  scoring: manual
  profile:
  - Level 2
  description: IBM Cloud Object Storage bucket level context-based restriction rules allow users to restricts all access to
    data unless the request originates from a list of allowed IP addresses. Context-based restrictions are recommended over
    legacy bucket Firewalls for restricting IP addresses that can be used to access buckets.
  rationale: Restrict access to the data stored in Cloud Object Storage buckets and enhance security controls by creating
    a context-based restriction that will only allow data to be accessed from specific IP addresses.
  impact: For any application(s) that depends upon or accesses data stored in Cloud Object Storage buckets to conduct its
    operation(s), administrators should ensure that the network used to access Cloud Object Storage buckets is trusted. This
    can be achieved through Cloud Object Storage context-based restriction rules. Allowing all network addresses to access
    Cloud Object Storage buckets could result unnecessary data exposure.
  references:
  - 1. https://cloud.ibm.com/docs/cloud-object-storage?topic=cloud-object-storagesetting-a-firewall
