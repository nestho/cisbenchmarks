    4. Click on the Access Policies tab.

    5. View the access policies assigned to the User to verify if that User has

    Administrator Role. assigned on all Platform Services or all IAM-enabled

    services.

    6. Review Access Groups and Trusted Profiles to determine which grant

    Administrator privileges.

    7. For Access Groups and Trusted Profiles that grant Administrator privileges,

