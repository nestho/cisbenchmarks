- id: '3.1'
  title: Ensure auditing is configured in the IBM Cloud account
  scoring: manual
  profile:
  - Level 1
  description: Collect audit events from IBM Cloud resources so that you can monitor activity in your IBM Cloud account.
  rationale: 'Use IBM Cloud® Activity Tracker Event Routing to configure how to route auditing events, both global and location-based
    event data, in your IBM Cloud. Auditing events are critical data for security operations and a key element for meeting
    compliance requirements. Control of the storage location is critical to building enterprise-grade solutions on the IBM
    Cloud. You can use Activity Tracker Event Routing, a platform service, to manage auditing events at the account-level
    by configuring targets and routes that define where auditing data is routed. Activity Tracker Event Routing can route
    events that are generated in supported regions. For example, you can use these audit events to investigate abnormal activity
    and critical actions, and comply with regulatory audit requirements. The audit events that are collected comply with the
    Cloud Auditing Data Federation (CADF) standard. Each audit event includes information about the initiator of the action,
    the action that is run, the target resource on which the action is requested, the observer, and the outcome of the action.
    For more information about the format, see Event fields. Activity Tracker events are collected as two types of events
    for audit-enabled services in the IBM Cloud: • Management events • Data events Data events access or modify customer data.
    Management events report on operational actions on IBM Cloud resources. Both types of events generate events for create,
    read, update, and delete (CRUD) actions. For the highest set of log analysis and monitoring capabilities, use IBM Cloud®
    Activity Tracker Event Routing to route all audit events to IBM Cloud Logs.'
  impact: Failure to meet this recommendation limits your ability to monitor activity in your IBM Cloud account. It also restricts
    your ability to identify the initiator of actions in your account, the resources affected, and details about the request.
  references:
  - 1. https://cloud.ibm.com/docs/atracker?topic=atracker-getting-started
  - 2. https://cloud.ibm.com/docs/atracker?topic=atracker-route_v2
  page_start: 103
  audit_raw: 'To check that you are collecting audit events from IBM Cloud resources so that you can

    monitor activity in your IBM Cloud account, you can use the following check list to

    ensure that auditing is configured in an IBM Cloud account:

    1. Ensure that routes and/or targets are defined for audit events in IBM Cloud®

    Activity Tracker Event Routing. Be sure to include Global events, as well as for

    each region that you operate within.

    2. Use the validate function within IBM Cloud® Activity Tracker Event Routing,

    which ensures the configured route or target are working and are able to

    authenticate to the specified destination.

    To check if routes and/or targets are defined for audit events in IBM Cloud® Activity

    Tracker Event Routing, complete the following steps:

    Note: To complete these steps, your IBM Cloud user ID (IBMid) must have the following

    roles:

    • A platform role with viewer role for the IBM Cloud® Activity Tracker Event

    Routing service for the account

    • A service role with reader role for the IBM Cloud® Activity Tracker Event Routing

    service for the account

    • Identity and Access Management (IAM) permissions to read and list targets and

    routes in the account, including the following IAM actions: atracker.target.read,

    atracker.target.list, atracker.route.read, atracker.route.list.

    Using Console:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. Go to the Menu icon. Then, select Observability to access the

    Observability dashboard.

    3. Select Activity Tracker from the page navigation menu

    4. Select Routing from the page navigation menu

    5. Select Routes from the page navigation menu

    6. All configured Routes will be listed. Review to ensure the routes cover all

    locations, including global.

    7. Select Targets from the page navigation menu

    8. All configured Targets will be listed. Ensure the Target Status is Active for all

    targets. If the target status is Error, the target is misconfigured and events will

    not be routed to the destination.

    Using CLI:

    1. Log in to IBM Cloud. Run the following command:

    ibmcloud login -a cloud.ibm.com

    For a federated account, run the following command:

    ibmcloud login -a cloud.ibm.com --sso

    2. List all routes that are configured in your account. Run the following command:

    ibmcloud atracker route ls

    3. Get the details of each configured route found in the list from the previous

    command:

    ibmcloud atracker route get --route ROUTE

    where ROUTE is the name or ID of the route.

    4. List all targets that are configured in your account. Run the following command:

    ibmcloud atracker target ls

    5. Get the details of each configured target found in the list from the previous

    command:

    ibmcloud atracker target get --target TARGET

    where TARGET is the name or ID of the route.

    6. Validate each target to ensure it is operating successfully Ensure the write status

    is "Success". Run the following command:

    ibmcloud atracker target validate --target TARGET

    where TARGET is the name or ID of the route.

    Using API:

    To make API calls to manage routes and targets, complete the following steps:

    • Get an IAM access token. For more information, see Retrieving IAM access

    tokens.

    • Identify the API endpoint in the region where you plan to configure or manage a

    route. For more information, see Endpoints.

    In this set of instructions, cURL will be used to execute the API calls.

    1. List all routes that are configured in your account. Run the following command:

    curl -X GET <ENDPOINT>/api/v2/routes -H "Authorization: $ACCESS_TOKEN"

    -H "content-type: application/json"

    where <ENDPOINT> is the API endpoint in the region where you plan to configure or

    manage a route.

    2. Get the details of each configured route found in the list from the previous

    command:

    curl -X GET <ENDPOINT>/api/v2/routes/<ROUTE_ID> -H "Authorization:

    $ACCESS_TOKEN" -H "content-type: application/json"

    where <ENDPOINT> is the API endpoint in the region where you plan to configure or

    manage a route and <ROUTE_ID> is the ID of the route.

    3. List all targets that are configured in your account. Run the following command:

    curl -X GET <ENDPOINT>/api/v2/targets -H "Authorization: $ACCESS_TOKEN" -H

    "content-type: application/json"

    where <ENDPOINT> is the API endpoint in the region where you plan to configure or

    manage a route.

    4. Get the details of each configured target found in the list from the previous

    command:

    curl -X GET <ENDPOINT>/api/v2/targets/<TARGET_ID> -H "Authorization:

    $ACCESS_TOKEN" -H "content-type: application/json"

    where <ENDPOINT> is the API endpoint in the region where you plan to configure or

    manage a route and <TARGET_ID> is the ID of the target.

    5. Validate each target to ensure it is operating successfully Ensure the write_status

    has a status of "success". Run the following command:

    curl -X POST <ENDPOINT>/api/v2/targets/<TARGET_ID>/validate -H

    "Authorization: $ACCESS_TOKEN" -H "content-type: application/json"

    where <ENDPOINT> is the API endpoint in the region where you plan to configure or

    manage a route and <TARGET_ID> is the ID of the target.'
  remediation: '1. If a route is not configured within IBM Cloud® Activity Tracker Event Routing for

    each of the locations where you operate in IBM Cloud (including global), you

    must create or update a route.

    To create a route, choose any of the following options:

    o Creating a route using the CONSOLE.

    o Creating a route using the CLI.

    o Creating a route using the API.

    2. If a target is not configured within IBM Cloud® Activity Tracker Event Routing for

    each of the locations where you which to receive your audit events, you must

    create or update a target.

    To create a target, choose any of the following options:

    o Creating a IBM Cloud Logs target using the CONSOLE.

    o Creating a IBM Cloud Logs target using the CLI.

    o Creating a IBM Cloud Logs target using the API.

    3. If any of the targets have a status or write status of ERROR, you must update the

    configured target to resolve the authentication issue with the destination.

    To update a target, choose any of the following options:

    o Updating a IBM Cloud Logs target using the CONSOLE.

    o Updating a IBM Cloud Logs target using the CLI.

    o Updating a IBM Cloud Logs target using the API.'
  checks:
  - type: sql
    command: select Observability to access the
    severity: medium
    info: 'To check that you are collecting audit events from IBM Cloud resources so that you can

      monitor activity in your IBM Cloud account, you can use the following check list to

      ensure that auditing is configured in an IBM Cloud account:

      1. Ensure that routes and/or targets are defined for audit events in IBM Cloud®

      Activity Tracker Event Routing. Be sure to include Global events, as well as for

      each reg'
- id: '3.2'
  title: Ensure data retention for audit events
  scoring: manual
  profile:
  - Level 2
  description: Create Cloud Object Storage buckets for long-term storage of all audit log events so that you have access to
    data for a longer period of time, you can comply with highly regulated environments, you can recover quickly in the eventuality
    of a disaster scenario, and you can adhere to internal data storage policies.
  rationale: 'When you provision an instance of IBM Cloud Logs, you must have an IBM Cloud Object Storage (COS) instance in
    the same account where your IBM Cloud Logs instance is provisioned. Cloud Logs supports having all logs go to the COS
    bucket, and also has Priority Insights, which provides enhanced interaction with the logs. However, Priority Insights
    does not provide long-term storage. As such, it is important to ensure that a Cloud Object Storage bucket has been created
    and that all data is stored there, in addition to any optional use of Priority Insights. The maximum number of days that
    data can be available for search within Priority Insights (90 days) is not sufficient and requires a long-term data storage
    solution. For example, highly regulated environments impose strict storage policies where they define the minimum number
    of days that log data must be saved for. Internal corporate regulations can also impose data storage policies. You might
    be affected by a natural disaster and you must recover fast. In any of these sample scenarios, you must implement a storage
    solution that allows you to keep data for long-term retention. Data that is managed by the IBM Cloud Logs service is encrypted
    at rest. Data that is stored in a bucket that is hosted in IBM Cloud Object Storage is encrypted by default using randomly
    generated keys and an all-or-nothing-transform. While this IBM Cloud Object Storage default encryption model provides
    at-rest security, some workloads need to be in possession of the encryption keys used. You can manage your keys manually
    by providing your own encryption keys - referred to as Server-Side Encryption with Customer-Provided Keys (SSE-C). With
    IBM Cloud Object Storage, you also have a choice to use IBM''s integration capabilities with IBM Cloud Key Management
    Services like IBM Key Protect and Hyper Protect Crypto Services. Depending on the security requirements, you can decide
    whether to use IBM Key Protect or IBM Hyper Protect Crypto Services for your IBM Cloud Object Storage buckets. • IBM Key
    Protect for IBM Cloud helps you provision encrypted keys for apps across IBM Cloud services. As you manage the lifecycle
    of your keys, you can benefit from knowing that your keys are secured by FIPS 140-2 Level 3 certified cloud-based hardware
    security modules (HSMs) that protect against the theft of information. • Hyper Protect Crypto Services is a single-tenant,
    dedicated HSM that is controlled by you. The service is built on FIPS 140-2 Level 4-certified hardware, the highest offered
    by any cloud provider in the industry. If you use IBM Cloud Logs, you can store data that is available through an audit
    instance in an IBM Cloud Object Storage bucket. You can configure the bucket to meet all your internal and external regulations.
    There are two types of data that you must consider retaining: events, and service instance metadata, such as views, templates,
    screens, and alerts. As guidance, events must be kept for as long as internal compliance requires. If no requirements
    exist, consider a minimum of 365 days.'
  impact: If you have regulatory or organizational requirements that determine the number of days that data must be available,
    failure to meet this control can result in breaching compliance. In addition, if data is corrupted or not archived, and
    you do not export it within the number of days that are available for Priority Insights, you can lose data. If you have
    requirements that define the bucket specification, policies, and encrypting requirements, you might be in breach of infrastructure
    compliance.
  references:
  - '1. IBM Cloud Logs: Managing COS Buckets: https://cloud.ibm.com/docs/cloudlogs?group=managing-cos-buckets'
  - '2. IBM Cloud Logs: TCO Data Pipelines: https://cloud.ibm.com/docs/cloudlogs?topic=cloud-logs-tco-data-pipelines'
  - https://cloud.ibm.com/docs/cloud-object-storage?topic=cloud-object-storageencryption
  page_start: 109
  audit_raw: 'Use the following check list to ensure that long-term retention is configured for each of

    your Cloud Logs instances:

    1. Ensure that IBM Cloud Logs instances are provisioned in a region that also

    contains one or more Cloud Object Storage buckets to configure long-term

    storage to an external storage service.

    2. Ensure that each IBM Cloud Logs has a COS bucket enabled and configured.

    a. Log in to IBM Cloud at https://cloud.ibm.com.

    b. From the Menu bar, select Observability.

    c. Select Logging, Instances. You might need to click the Cloud Logs tab to see your

    IBM Cloud Logs instances.

    d. Select the instance to which you want to verify a data bucket.

    e. In the Storage section, confirm the Bucket CRN, and the Bucket endpoint.

    3. Ensure that you have access to storage, for example, check that you have an

    instance of the IBM Cloud Object Storage service provisioned in your account.

    You must define a service to service (S2S) authorization between IBM Cloud

    Logs and IBM Cloud Object Storage to allow IBM Cloud Logs to read and write

    data into the data bucket. For more information, see Creating a S2S

    authorization to grant access to a bucket.

    4. Ensure that you have COS buckets available to retain your data. Separate

    buckets for the Data Bucket and Metrics bucket may be required, such as when

    you wish to apply separate data retention settings to each type of data. Check

    the bucket configuration to verify that it meets your corporate and external market

    regulations.

    Consider using a bucket for each Cloud Logs instance so that you can customize

    the bucket to meet security requirements. These requirements might be related

    to the type of data that is archived and to external regulations like EU-managed

    requirements, for example.

    5. Ensure that the bucket has the following features enabled:

    o A key management service is configured. For example, check IBM Cloud

    Key Protect is configured so that you can use your own key to encrypt

    data.

    o Auditing to IBM Cloud Object Storage is enabled and that the options read

    and data events are included for write and read operations.

    o Monitoring with IBM Cloud Monitoring with Sysdig is enabled.

    o Expiration rules are configured that define when audit logs are

    automatically deleted. As guidance, events must be kept for as long as

    internal compliance requires. If no requirements exist, consider a rule that

    keeps files for a minimum of 365 days.

    o [Optional] An archive policy is configured so that objects that are rarely

    accessed are moved from their default bucket storage class to the archive

    storage class after a certain period. Note that Cloud Logs cannot read or

    search objects which are archived within the Cloud Object Storage bucket,

    however the archived data can be restored within COS to re-enable Cloud

    Logs to read and search that data.'
  remediation: '1. If the Cloud Logs instance cannot connect to the Cloud Object Storage bucket,

    you must define a service to service (S2S) authorization between IBM Cloud

    Logs and IBM Cloud Object Storage to allow IBM Cloud Logs to read and write

    data into the data bucket. For more information, see Creating a S2S

    authorization to grant access to a bucket.

    2. If no Data Bucket is defined, you must define the Data Bucket within Cloud Logs

    as follows:

    a. Log in to IBM Cloud at https://cloud.ibm.com.

    b. From the Menu bar, select Observability.

    c. Select Logging, Instances. You might need to click the Cloud Logs tab to

    see your IBM Cloud Logs instances.

    d. Select the instance to which you want to configure a data bucket.

    e. In the Storage section, click edit.

    f. In the Logs data section, configure the Bucket CRN, and the Bucket endpoint.

    • Select Insert CRN from search to get the list of buckets in your account.

    You can choose a CRN from the list.

    • Select View endpoints in docs to find the endpoints per location. Choose

    the endpoint based on your bucket configuration.

    g. Click Save to save the configuration.

    3. If no Metrics Bucket is defined, you must define the Data Bucket within Cloud

    Logs as follows:

    a. Log in to IBM Cloud at https://cloud.ibm.com.

    b. From the Menu bar, select Observability.

    c. Select Logging, Instances. You might need to click the Cloud Logs tab to

    see your IBM Cloud Logs instances.

    d. Select the instance to which you want to configure a metrics bucket.

    e. In the Storage section, click edit.

    f. In the Events to metrics data section, configure the Bucket CRN, and the

    Bucket endpoint.

    • Select Insert CRN from search to get the list of buckets in your account.

    You can choose a CRN from the list.

    • Select View endpoints in docs to find the endpoints per location. Choose

    the endpoint based on your bucket configuration.

    g. Click Save to save the configuration.

    4. If you cannot find an instance of IBM Cloud Object Storage (COS) in your

    account, provision one.

    5. If you have a bucket that does not have full control over the data encryption keys,

    configure one of the supported options. IBM® Cloud Object Storage provides

    several options to encrypt your data.

    6. If you have a bucket that does not have an expiration rule to automatically delete

    objects, configure one for the bucket based on your compliance and

    organizational requirements. The minimum expiration must be 365 days. For

    more information, see Delete stale data with expiration rules.

    7. If you have a bucket that does not have an archive policy to store long-term data

    that is rarely accessed, configure one for the bucket based on your compliance

    and organizational requirements. For more information, see Archive cold data

    with transition rules.

    8. If you have a bucket that does not have Activity Tracker events enabled so that

    you can monitor any interaction of users and services with the bucket, enable

    Activity Tracker events for the bucket.

    9. If you have a bucket that does not enable monitoring with IBM Cloud Monitoring

    with Sysdig, configure the bucket.

    10. If you want to create a bucket, see create and configure a bucket.

    o Configure one of the supported options to add additional encryption

    capabilities. For more information, see IBM® Cloud Object Storage

    provides several options to encrypt your data.

    o Configure an expiration rule to automatically delete objects. Configure a

    rule for the bucket based on your compliance and organizational

    requirements. The minimum expiration must be 365 days. For more

    information, see Delete stale data with expiration rules.

    o Configure an archive policy to store long-term data that is rarely accessed.

    Configure a policy for the bucket based on your compliance and

    organizational requirements. For more information, see Archive cold data

    with transition rules.

    o Enable Activity Tracker events on the bucket so that you can monitor any

    interaction of users and services with the bucket. For more information,

    see enable Activity Tracker events for the bucket.

    o Enable monitoring for the bucket.

    o Define a service to service (S2S) authorization between IBM Cloud Logs

    and IBM Cloud Object Storage to allow IBM Cloud Logs to read and write

    data into the data bucket. For more information, see Creating a S2S

    authorization to grant access to a bucket.'
  checks:
  - type: manual_review
    info: 'Use the following check list to ensure that long-term retention is configured for each of

      your Cloud Logs instances:

      1. Ensure that IBM Cloud Logs instances are provisioned in a region that also

      contains one or more Cloud Object Storage buckets to configure long-term

      storage to an external storage service.

      2. Ensure that each IBM Cloud Logs has a COS bucket enabled and configured.

      a. Log in to IBM Cloud at https://cloud.ibm.com.

      b. From the Menu bar, select Observability.

      c. Select Logging, Inst'
    severity: medium
- id: '3.3'
  title: Ensure that events are collected and processed to identify anomalies or abnormal events
  scoring: manual
  profile:
  - Level 1
  - Level 2
  description: Events that you collect and centralize in the IBM Cloud Logs service provide information about actions that
    take place on your account. You can analyze this data to resolve problems, identify anomalies, and be notified of abnormal
    situations. Events that you collect and centralize in the IBM Cloud Logs service provide information about actions that
    take place on your account. You can define alerts to notify promptly of problems, anomalies, and abnormal situations.
  rationale: IBM Cloud Logs and IBM Cloud Activity Tracker Event Routing add audit capabilities to your IBM Cloud architecture.
