- id: 6.1.2
  title: Ensure Web application firewall is ENABLED in IBM Cloud Internet Services (CIS)
  scoring: manual
  profile:
  - Level 1
  description: 'A Web Application Firewall (WAF) is a security solution designed to protect web applications by monitoring,
    filtering, and blocking malicious HTTP/S (OSI Layer 7) traffic between a client (usually a browser) and a web server.
    What is a Web Application Firewall? A WAF sits between the internet and your web application, acting as a reverse proxy
    that inspects incoming and outgoing web traffic. It uses rule-based logic, machine learning, or behavioral analysis to
    detect and prevent common threats including the OWASP Top-10 attack techniques. A WAF may use one or more of the following
    detection methods: • Signature-based detection (matches known attack patterns) • Anomaly-based detection (flags behavior
    outside the baseline) • Policy-based rules (user-defined or vendor-supplied rules) Key benefits of a CIS WAF The IBM Cloud™
    Internet Services WAF is an easy way to set up, manage, and customize security rules to protect your web applications
    from common web threats. See the following list for key features: • Easy setup: The CIS WAF is part of our overall service,
    which takes just a few minutes to set up. After you redirect your DNS to us, you can switch on the WAF and set up the
    rules you need. • Always on protection: Once CIS WAF is deployed and enabled it will protect against some of the common
    web application attack patterns like o Zero-day vulnerabilities - o Top-10 attack techniques o Use of stolen/leaked credentials
    • Detailed reporting: See greater detail in the reporting, for example, threats blocked by rule/rule group.'
  rationale: A WAF or Web Application Firewall helps protect web applications by filtering and monitoring HTTP traffic between
    a web application and the client on the Internet. Types of attacks WAF can prevent A WAF typically protects web applications
    from attacks such as cross-site forgery, cross-site-scripting (XSS), file inclusion, and SQL injection, among others.
    A WAF usually is part of a suite of tools, which together can create a holistic defense against a range of attack vectors.
    How a WAF works WAF is a type of reverse-proxy that protects the server from exposure by having the client requests pass
    through the WAF before reaching the server. It acts as shield placed between the web application and the internet. A WAF
    operates through a set of rules often called policies. These policies aim to protect against vulnerabilities in the application
    by filtering out malicious traffic. The value of a WAF comes from the speed and ease with which its policy modifications
    can be implemented, thereby allowing a faster response to varying attack vectors. For example, for a zero-day vulnerability
    the WAF vendor can deploy a patch on that will prevent the expolitation of the vulnerability.
  impact: A WAF is an OSI protocol Layer-7 defense in the OSI model, and it is not designed to defend against all types of
    attacks. When a WAF is enabled on Cloud Internet Services the TLS traffic is terminated at the proxy, unencrypted, inspected
    for any attacks, and then re-encrypted and forwarded on to the application. Another thing to consider with WAF is that
    there may be false positives based on the application patterns and clients may get blocked or challenged. This can be
    mitigated by tuning the WAF or creating custom policies that would let traffic pass under certain conditions.
  references:
  - 1. https://cloud.ibm.com/docs/cis?topic=cis-manage-your-ibm-cis-for-optimalsecurity#best-practice-activate-waf-safely
  - 2. https://cloud.ibm.com/docs/cis?topic=cis-waf-q-and-a
  page_start: 161
  audit_raw: "The Web Application Firewall setting can be audited using the following mechanisms\nUsing Console:\n1. Login\
    \ to the IBM Cloud at https://cloud.ibm.com\n2. Click Menu icon, Resource list\n3. Select the Cloud Internet Service Instance\n\
    4. Select the domain that needs to be audited from the domains drop down\n5. Choose the Security section from the left\
    \ panel.\n6. Click on the WAF tab in the Security panel.\n7. Make sure the CIS Managed Ruleset and CIS OWASP Core Ruleset\
    \ are both\ndeployed and enabled\nUsing API:\n1. Run the curl command below. The value for $iam_token will be the IBM\
    \ Cloud\niam token retrieved by running the command\nibmcloud iam oauth-tokens\n Request:\n curl -s\nhttps://api.cis.cloud.ibm.com/v1/{crn}/zones/{zoneid}/rulesets/phases/http_re\n\
    quest_firewall_managed/entrypoint \\\n -H 'content-type: application/json' \\\n -H 'accept: application/json' \\\n -H\
    \ \"x-auth-user-token: Bearer $iam_token\" | jq '.result.rules[] |\n{ruleid: .action_parameters.id, enabled: .enabled}'\n\
    \ Response:\n {\n \"ruleid\": \"efb7b8c949ac4650a09736fc376e9aee\",\n \"enabled\": true\n }\n {\n \"ruleid\": \"4814384a9e5d4991b9815dcfc25d2f1f\"\
    ,\n \"enabled\": true\n }\nIn the above response rules map to the deployed ruleset ids as shown below\nCIS Managed Ruleset:\
    \ efb7b8c949ac4650a09736fc376e9aee\nCIS OWASP Core Ruleset: 4814384a9e5d4991b9815dcfc25d2f1f"
  remediation: 'The Web Application Firewall can be enabled in Cloud Internet Services using the

    following procedure

    Using Console

    1. Login to the IBM Cloud at https://cloud.ibm.com

    2. Click Menu icon, Resource list

    3. Select the Cloud Internet Service Instance

    4. Select the domain that needs to be audited from the domains drop down

    5. Choose the Security section from the left panel.

    6. Click on the WAF tab in the Security panel.

    7. Deploy the following WAF managed rulesets by clicking the Deploy button next

    to them

    o CIS Managed Ruleset

    o CIS OWASP Core Ruleset

    8. After rulesets are deployed or if they are already deployed, make sure they are

    enabled by clicking on the toggle under the Status column.

    Note: For WAF to be inline of the request flow, the DNS records or global load

    balancers need to have proxies enabled. Only when the records are proxied, the

    traffic will flow through the Cloud Internet Services reverse proxy and will get

    inspected.'
  checks:
  - type: sql
    command: Select the Cloud Internet Service Instance
    severity: medium
    info: 'The Web Application Firewall setting can be audited using the following mechanisms

      Using Console:

      1. Login to the IBM Cloud at https://cloud.ibm.com

      2. Click Menu icon, Resource list

      3. Select the Cloud Internet Service Instance

      4. Select the domain that needs to be audited from the domains drop down

      5. Choose the Security section from the left panel.

      6. Click on the WAF tab in the Security panel.'
- id: 6.1.3
  title: Ensure DDoS protection is Active on IBM Cloud Internet Services
  scoring: manual
  profile:
  - Level 1
  description: IBM Cloud Internet services provides automatic DDoS protection for any proxied DNS records or a Range Application.
    For an application to be protected against DDoS attacks the DNS records for the application should be proxied. If the
    application is accessed via a Cloud Internet Services global load balancer, the global load balancer should be proxied.
    In addition, it is required to allowlist only IPs from the Cloud Internet Services on your application ingress points.
    The list of ips to be allow listed is found here.
  rationale: 'A distributed denial of service (DDoS) attack is a malicious attempt to disrupt normal traffic of a server,
    service, or network by overwhelming the target or its surrounding infrastructure with a flood of internet traffic. DDoS
    attacks achieve effectiveness by utilizing many compromised computer systems as sources of attack traffic. Exploited machines
    can include computers and other networked resources such as IoT devices. From a high level, a DDoS attack is like a traffic
    jam clogging up a highway, preventing regular traffic from arriving at its destination. DDoS attack vectors target varying
    components of a network connection. While nearly all DDoS attacks involve overwhelming a target device or network with
    traffic, attacks can be divided into three categories. An attacker can use one or multiple attack vectors, and might even
    cycle through these attack vectors based on countermeasures taken by the target. Common types are: • Application layer
    attacks (Layer 7) • Protocol attacks (Layer 3 and Layer 4) • Volumetric attacks (amplification attacks) Application layer
    attacks An application layer attack is sometimes referred to as a Layer-7 DDoS attack (in reference to the 7th layer of
    the OSI model). The goal of these attacks is to exhaust the resources of the victim, by targeting the layer where web
    pages are generated on the server and delivered to the visitors in response to HTTP requests (that is, the application
    layer). Layer-7 attacks are challenging, because the traffic can be difficult to identify as malicious. Protocol attacks
    Protocol attacks utilize weaknesses in Layer 3 and Layer 4 of the ISO protocol stack to render the target inaccessible.
    These attacks, also known as a stateexhaustion attacks, cause a service disruption by consuming all the available state
    table capacity of web application servers, or of intermediate resources such as firewalls and load balancers. Volumetric
    attacks This category of attacks attempts to create congestion by consuming all available bandwidth between the target
    and the wider internet. Large amounts of data are sent to a target using a form of amplification, or by other means of
    creating massive traffic, such as requests from a botnet.'
  impact: Allowing proxy will route your data through the Cloud Internet Services proxy and will be decrypted and inspected
    for layer7 DDoS attacks.
  references:
  - 1. https://cloud.ibm.com/docs/cis?topic=cis-distributed-denial-of-service-ddosattack-concepts
  - 2. https://cloud.ibm.com/docs/cis?topic=cis-manage-your-ibm-cis-for-optimalsecurity#best-practice-activate-waf-safely
  page_start: 165
  audit_raw: "The different types of mechanisms to audit if DDoS is enabled are as follows:\nUsing Console:\n1. Log in to\
    \ IBM Cloud at https://cloud.ibm.com.\n2. Click Menu icon, Resource list\n3. Select the Cloud Internet Service Instance\n\
    4. Click on Reliability on the Left Navigation panel.\n5. Click on the Global Load Balancers tab.\n6. Verify each GLB\
    \ indicates that proxy is enabled by the green toggle.\n7. Click on the DNS tab.\n8. Verify each DNS record indicates\
    \ that proxy is enabled by the green toggle.\nUsing CLI:\nRun the following ibmcloud cli command and review the value\
    \ of the proxied property\nto verify it is set to true for any global load balancers. This ensures that the traffic is\n\
    inspected by the proxy and detect and layer 7 DDoS attacks.\nic cis glbs <DOMAIN_ID> --output JSON | jq '.[] | {Name:\
    \ .name, Proxied:\n.proxied}'\n{\n \"Name\": \"tt.advanced-cert-test.batflare.com\",\n \"Proxied\": true\n}\nRun the following\
    \ ibmcloud cli command and review the value of the proxied property\nto verify it is set to true for any DNS records that\
    \ are proxiable (that can be proxied).\nThis ensures that the traffic is inspected by the proxy and detect and layer 7\
    \ DDoS\nattacks.\nic cis dns-records <DOMAIN_ID> --output JSON | jq '.[] | {Name: .name, Type:\n.type, Content: .content,\
    \ Proxiable: .proxiable, Proxied: .proxied}'\n{\n \"Name\": \"advanced-cert-test.batflare.com\",\n \"Type\": \"A\",\n\
    \ \"Content\": \"1.2.3.4\",\n \"Proxiable\": true,\n \"Proxied\": true\n}\n{\n \"Name\": \"tanya.advanced-cert-test.batflare.com\"\
    ,\n \"Type\": \"A\",\n \"Content\": \"20.43.161.105\",\n \"Proxiable\": true,\n \"Proxied\": true\n}\n{\n \"Name\": \"\
    test.advanced-cert-test.batflare.com\",\n \"Type\": \"AAAA\",\n \"Content\": \"2001:db8::2:1\",\n \"Proxiable\": true,\n\
    \ \"Proxied\": true\n}\n{\n \"Name\": \"www.advanced-cert-test.batflare.com\",\n \"Type\": \"CNAME\",\n \"Content\": \"\
    www.google.com\",\n \"Proxiable\": true,\n \"Proxied\": true\n}"
  remediation: "The different types of mechanisms to set if DDoS is enabled are as follows:\nUsing Console:\n1. Log in to\
    \ IBM Cloud at https://cloud.ibm.com.\n2. Click Menu icon, Resource list\n3. Select the Cloud Internet Service Instance\n\
    4. Click on Reliability on the Left Navigation panel.\n5. Click on the Global Load Balancers tab.\n6. Change the toggle\
    \ for the Proxied column to green.\n7. Click on the DNS tab.\n8. Change the toggle for Proxy column for the relevant DNS\
    \ records to green.\nUsing CLI:\n1. Run the following ibmcloud cli commands to set the value of the proxied\nproperty\
    \ to true\n• Global Load Balancer\nibmcloud cis glb-update <DNS Domain Id> <DNS GLB ID> --json '{\n \"name\": \"tt.advanced-cert-test.batflare.com\"\
    ,\n \"fallback_pool\": \"9f3fa92d0c7c59d96b179450aff0fc8e\",\n \"default_pools\": [\"9f3fa92d0c7c59d96b179450aff0fc8e\"\
    ],\n \"proxied\": true\n}'\nUpdating GLB '8d9b09da038741ca319fa3ec0262bb19' in domain\n'681c5cf97f44e5da2f66924f5a4db5b2'\
