    Click on next.

    8. Under Resources, select Specific resources, and then in the dropdown, select

    instance

    9. Click on Select a value, and you can choose a database to match. Click on

    review and then on continue.

    10. Select the check mark for the zone that you want to give access to (the one

    created at the start of the process), then click on the Add button. You will see it

