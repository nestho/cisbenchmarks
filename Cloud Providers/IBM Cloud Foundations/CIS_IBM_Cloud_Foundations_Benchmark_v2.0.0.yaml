    4. Click on the Access Policies tab.

    View the access policies assigned to the User to verify if that User has

    Administrator Role assigned.

    5. Review Access Groups and Trusted Profiles to determine which grant

    Administrator privileges.

    6. For Access Groups and Trusted Profiles that grant Administrator.

    privileges, review which users are members of the Access Groups or allowed to

    assume the Trusted Profiles.

    7. Verify that all users who have Administrator privileges have a legitimate need for

    those privileges.'
