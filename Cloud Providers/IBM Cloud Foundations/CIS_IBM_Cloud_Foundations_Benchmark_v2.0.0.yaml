- id: 8.2.4
  title: Ensure secrets stored in the IBM Cloud® Secrets Manager are rotated periodically
  scoring: scored
  profile:
  - Level 2
  description: As you use Secrets Manager to design your secrets management strategy, consider how often you want to rotate
    your secrets based on the internal guidelines for your organization. Determine ahead of time which users or service IDs
    require access to rotate secrets, and how those secrets can be rotated to avoid interruptions to your applications. By
    scheduling automatic rotation of secrets at regular intervals, you reduce the likelihood of compromised credentials. When
    it's time to rotate the secret based on the rotation interval that you specify, Secrets Manager automatically creates
    a new version of your secret. You can safely delete old version of the secrets only after their newest versions are fully
    deployed to your applications. If any secrets are in use, you can use Secrets Manager LOCK feature to lock the secrets
    from getting deleted.
  rationale: Rotating secrets enables to meet your internal and external regulatory requirements. Compromised secrets can
    be removed by rotating secrets.
  impact: Rotated secrets (new version) need to be updated in the applications, services that are using the secrets to avoid
    interruptions to applications and services functioning. Additional cost may be incurred by scheduling automatic rotation
    of secrets
  references:
  - 1. https://cloud.ibm.com/docs/secrets-manager?topic=secrets-manager-automaticrotation&interface=ui
  - 2. https://cloud.ibm.com/docs/secrets-manager?topic=secrets-manager-manualrotation&interface=cli
