    6. Click on the TLS tab in the Security panel.\n7. Verify the Traffic Encryption - Minimum TLS Version is set to a value\
    \ of TLS\n1.2(default) or higher\nIBM Cloud CLI\n1. Verify min_tls_version must be set to 1.2 or higher\nibmcloud cis\
    \ tls-settings e476aba943b5d7d29b96135c78aa55c9 --output json\n{\n \"min_tls_version\": \"1.2\",\n \"ssl\": \"strict\"\
    ,\n \"tls_1_2_only\": \"off\",\n \"tls_1_3\": \"off\",\n \"universal\": true\n}"
