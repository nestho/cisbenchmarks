- id: 7.1.6
  title: Ensure IBM Cloud Kubernetes Service clusters have the logging service enabled
  scoring: manual
  profile:
  - Level 2
  description: 'The following recommendation should be considered optional, as while adhering to it would provide enhanced
    security, IBM Cloud Logs is a costed option. By default, logs are generated and written locally for all the following
    IBM Cloud Kubernetes Service cluster components: worker nodes, containers, applications, persistent storage, Ingress application
    load balancer, Kubernetes API, and the kubesystem namespace. IBM Cloud Logs supports integration with common workload
    environments on IBM Cloud - including IBM Cloud Kubernetes Service - and provides observability services so you can view,
    analyze, and alert on activity tracking events and logging activity. A logging agent collects logs with the extension
    *.log and extensionless files that are stored in the /var/log/containers directory of your pod from all namespaces, including
    kube-system. The agent then forwards the logs to your service IBM Cloud Logs instance. You can also track user-initiated
    administrative activity made in your cluster. Kubernetes Service automatically generates cluster management events and
    forwards these event logs to IBM Cloud Logs.'
  rationale: Logging is the foundation on which security monitoring and situational awareness are built, as logging is pivotal
    in identifying - and thus addressing - security risks. This is because logs record a richness of data about activity,
    changes, requests, interactions, connections, etc. In addition, logging data can be used to investigate performance issues,
    provide administrative alerts, and help verify that organisational policies are working as intended. However, as workloads
    generate an expanding amount of observability data, pressure is increasing on collection tools to process it all. The
    data becomes expensive to manage and makes it harder to detect signal in the noise and obtain actionable insights. IBM
    Cloud Logs is designed to help users take control of their observability data and expedite insights to reduce application
    downtime, recover quickly from incidents, and develop your defences.
  impact: While adhering to this recommendation would provide enhanced security, IBM Cloud Logs is a costed option. Standard
    pricing for IBM Cloud Logs applies.
