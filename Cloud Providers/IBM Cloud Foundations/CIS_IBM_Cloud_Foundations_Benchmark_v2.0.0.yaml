  title: Ensure no workspace security groups allow ingress from 0.0.0.0/0 to port 3389
  scoring: manual
  profile:
  - Level 1
  description: It is recommended that workspace security groups do not allow unrestricted ingress access from 0.0.0.0/0 to
    port 3389, which is the Remote Desktop Protocol (RDP) port used for remote server administration.
  rationale: Restricting access to the RDP port reduces the attack surface and lowers risk to PowerVS resources by preventing
    access to a critical administrative port.
  impact: ''
  references:
