- id: '4.2'
  title: Ensure network access to IBM Cloud Databases service is set to be exposed on “Private end points only”
  scoring: manual
  profile:
  - Level 1
  description: All Cloud Databases deployments offer integration with IBM Cloud Service Endpoints. It gives you the ability
    to enable connections to your deployments from the public internet and over the IBM Cloud Private network. Service Endpoints
    are available in all IBM Cloud Multi-Zone Regions and Single-Zone Regions. In other words, Deployments in all regions
    can utilize the available service endpoint options. Public endpoints provide a connection to your deployment on the public
    network. However, at provision time, a private endpoint is the default option for all deployments. Your environment needs
    to have internet access to connect to a deployment. A deployment with a service endpoint on the private network gets an
    endpoint that is not accessible from the public internet. All traffic is routed to hardware dedicated to Cloud Databases
    deployments and remains on the IBM Cloud Private network. All traffic to and from this endpoint is free and unmetered
    as long as the traffic remains in IBM Cloud. Once your environment has access to the IBM Cloud Private network, an internet
    connection is not required to connect to your deployment.
  rationale: The use of public endpoints exposes data that is contained in the database to unnecessary risk from the outside
    internet.
  impact: Some applications are not run in the IBM Cloud. Therefore, they cannot rely on the IBM Cloud network backbone to
    maintain communication from application to the database over the private network. In this case, the customer may choose
    to enable "Public" endpoints which allow access to the database from the internet. Customers that are required to do should
    IP Whitelist the database before enabling "Public" endpoints.
  references: []
  page_start: 143
