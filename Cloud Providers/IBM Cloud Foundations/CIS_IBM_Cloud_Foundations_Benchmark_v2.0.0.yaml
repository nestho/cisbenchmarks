- id: '1.16'
  title: Ensure Minimal Number of Users are Granted Administrative Privileges
  scoring: manual
  profile:
  - Level 1
  description: Comply with the principle of granting least privilege by using Access Groups or Trusted Profiles to manage
    admin privileges and by avoiding the use of broadly scoped access policies.
  rationale: The principle of granting least privilege mandates that a user must only be given access to the resources that
    are required to complete their task. This task can be hard to maintain when managing large numbers of users. Instead of
    assigning administrative privileges to individual users, create Access Groups with administrative privileges and add or
    remove users from these Access Groups as needed. Additionally, instead of using the Platform Administrator role for all
    Platform Services or all IAM-enabled services, IBM Cloud users can grant access to specific resources and account management
    services to better comply with the principle of granting least privilege.
  impact: Managing administrative access via Access Groups or Trusted Profiles simplifies the process of adding/removing admin
    privileges from users in the account. Having too many users with Administrative privileges goes against the principle
    of granting least privileges and mean many possible holes for any security attack.
  references:
  - 1. https://cloud.ibm.com/docs/account?topic=account-userroles
  page_start: 48
  audit_raw: 'Using Console:

