- id: 2.1.1.3
  title: Ensure Cloud Object Storage Encryption is set to On with KYOK
  scoring: manual
  profile:
  - Level 2
  description: You can use IBM Cloud encryption key management services, for example, Hyper Protect Crypto Services to keep
    and manage exclusive control over the root keys used to add envelop encryption for data that is stored in IBM Cloud Object
    Storage buckets.
  rationale: When it comes to encryption of data at rest in IBM Cloud, the best practice is to allow customers use encryption
    capabilities offered by Hardware Security Module crypto service. IBM Cloud Hyper Protect Crypto Services offers Keep your
    Own Key (KYOK) capabilities that allow customers to have exclusive key control over encryption keys. This provides a significant
    level of control over encryption keys where only authorized users have access (no privileged users included IBM Cloud
    Admins) to encryption keys, in turn increases both security control as well as meet relevant compliance requirements.
  impact: For Keep your Own Key (KYOK) encryption using IBM Cloud Hyper Protect Crypto Services key management service you
    will need to review and understand how key lifecycle events (for example key rotation) need to be handled. Refer to the
    Hyper Protect Crypto Services product page for details around the key lifecycle events supported.
  references:
  - '1. • Data encryption with IBM Cloud Object Storage:'
  - https://cloud.ibm.com/docs/cloud-object-storage?topic=cloud-object-storageencryption
  - '2. • Integrated service availability page: https://cloud.ibm.com/docs/services/cloudobject-storage/basics?topic=cloud-object-storage-service-availability'
