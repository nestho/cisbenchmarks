  impact: The recommended custom views allow you to monitor actions that take place in your account, the level of threat of
    those actions in your account, and abnormal situations. Missing any of these views and the ability to check that events
    are available through them, exposes a potential security risk by hiding a possible gap of events that are critical to
    control what happens in the account. In addition, views can have alerts attached to them so that you are notified quickly
    of abnormal situations. If you do not have the right views, you lose the ability to configure alerts and pre-empt situations
    that might require your attention. The recommended alerts on custom views allow you to monitor actions that take place
