- id: 8.1.1.2
  title: Ensure Keys in the IBM Cloud® Key Protect Service are configured for high availability
  scoring: manual
  profile:
  - Level 1
  description: 'IBM® Key Protect for IBM Cloud® is a highly available, regional service with multiple availability zones and
    automatic features that help keep your applications secure and operational. Within a region high availability is achieved
    through routing traffic to other availability zones if one zone is down. High Availability across regions can be achieved
    by two ways. Dynamic cross-region high availability: There are three regions, us-south (located in Dallas, Texas, United
    States), jp-tok (located in Tokyo, Japan), and eu-de (located in Frankfurt, Germany) where Key Protect has failover support
    into a separate region where data is replicated into standby infrastructure (fail-over region) if you select the Cross-region
    plan. This allows your keys are available in another region if the primary region goes down. In the event primary region
    goes down, your requests are routed to the fail-over region transparently, therefore you can continue to call same endpoint
    without any disruption. Manual cross-region high availability: In case if you cannot use any of these three regions, you
    can still achieve high availability, however it is your responsibility to own the process to achieve high availability
    for the keys. The process involves you creating a Key Protect instance in two different regions and import same root key
    in both regions. Because keys created using the same key material are effectively identical, either key can be used to
    wrap or unwrap any data encryption keys (DEKs). Note that the Key Protect endpoint, instance id and key id are different
    in each region, so you need to change the endpoint, instance id and key id when you switch using the other region. Also,
    every time a root key is rotated, new key material is added to the key, which creates a new version of the key. Therefore,
    import the rotated key into Key Protect in both regions. This process works only for Bring Your Own Key (root key).'
  rationale: Accessing your data requires decryption of the Data Encryption Key using Root Key, it is critical to have high
    availability feature for the root key. High availability of the key management service is necessary for both load balancing
    and fault tolerance. Disaster recovery is about surviving a catastrophic failure or loss of availability in a single location.
    Key Protect takes care of disaster recovery for your keys automatically in cross-regions supported Key Protect service.
  impact: By using high availability and disaster recovery feature, your application and services can run without disruption
    in the event of one region going down preventing denial of service.
  references:
  - 1. https://cloud.ibm.com/docs/key-protect?topic=key-protect-provision
  - 2. https://cloud.ibm.com/docs/key-protect?topic=key-protect-regions
