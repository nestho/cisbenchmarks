- id: '5.1'
  title: Ensure IBM Cloudant encryption is enabled with customer managed keys
  scoring: manual
  profile:
  - Level 2
  description: 'IBM Cloudant encrypts all client data at-rest by default. For customers using a Dedicated Hardware plan instance,
    it is optional to use the service''s integration with IBM Key Protect for customers to bring their own encryption key
    at provision time for the instance. To provision a Cloudant Dedicated Hardware plan instance using Bring-Your-Own-Key
    with Key Protect, first ensure you are logged into your IBM Cloud account at https://cloud.ibm.com/. Note a paid account
    is required to provision a Cloudant Dedicated Hardware plan instance. Before provisioning the Dedicated Hardware plan
    instance with BYOK with Key Protect, follow the authorization instructions between Key Protect and Cloudant: 1. Open your
    IBM Cloud dashboard. 2. From the menu bar, click Manage, Access (IAM). 3. In the side navigation, click Authorizations.
    4. Click Create. 5. In the Source service menu, select the Cloudant in Account. 6. In the Source service instance menu,
    select All instances. 7. In the Target service menu, select Key Protect in Account, and leave Instance ID of string equals
    All instances. 8. Enable the Reader role by checking the checkbox. 9. Click Authorize. Ensure the necessary encryption
    key(s) in Key Protect have been created. (See IBM Key Protect documentation for those steps.) Next provision a Cloudant
    Dedicated Hardware plan instance and choose the BYOK with Key Protect option during the provisioning process: Using Console:
    1. From the IBM Cloud Dashboard, click on Create resource. 2. Type Cloudant in the search bar and click the Cloudant tile
    to open it. 3. Select Cloudant offering. 4. Click the Dedicated tab. 5. Click Create Host. 6. Select the IBM Cloud region.
    7. Configure the Cloudant instance by specifying the Instance name and Resource group. 8. Under Configure Host, choose
    the Location for deployment to specify the physical location of the Dedicated Hardware plan instance. 9. Choose Yes or
    No for Will the data stored require HIPPA compliance?. 10. To use a customer-managed (BYOK) encryption key, choose the
    KMS instance under Key Management Service instance. 11. Under Disk encryption key, choose the name of the encryption key
    to use from the KMS instance in the previous step. 12. Click Create to provision the Dedicated Hardware plan instance.
    Note that during provisioning, a spinning wheel appears next to the instance in your IBM Cloud Dashboard. A request is
    sent to provision a Dedicated Hardware plan instance on bare metal servers. Provisioning time is asynchronous and can
    take up to 5 days. Using CLI: 1. Login to the IBM Cloud via the CLI. 2. Run the following command to provision a Cloudant
    Dedicated Hardware plan instance using a customer-managed encryption key stored in IBM Key Protect: ibmcloud resource
    service-instance-create <name> cloudantnosqldb dedicatedhardware <region> -p ''{"location":"<location>", "hipaa":"<hipaa>",
    "kms_instance_crn": "<kms_instance_crn>", "kms_key_crn": "<kms_key_crn>"}'' Where the customer parameters to enter are
    as follows: • name: An arbitrary name of the Cloudant Dedicated Hardware instance. • region: The major region where you
    want to deploy, for example us-south, useast, etc. • location: The actual physical location of the Dedicated Hardware
    plan instance, which might differ from the region. The location can be in any IBM Cloud location, including major regions
    and locations outside the major regions. • hipaa: Either true or false. • kms_instance_crn: An optional parameter that
    must be set to the CRN of the Key Protect instance housing the encryption key for BYOK. All IBM Cloudant environments
    are encrypted. If you would like to BYOK with Key Protect, supply the CRN of the Key Protect instance that holds the encryption
    key. Otherwise, don''t supply this parameter in the CLI, which means the environment is encrypted with an IBM Cloudant-managed
    key. • kms_key_crn: This parameter is required if you use the kms_instance_crn parameter. Otherwise, it must not be supplied
    in the CLI command. The kms_key_crn parameter is set to the CRN of the encryption key stored in the Key Protect instance
    defined by the kms_instance_crn parameter. Below is an example CLI command with the parameters populated with sample values:
    ibmcloud resource service-instance-create cloudant-dedicated-with-byok cloudantnosqldb dedicated-hardware us-south -p
    ''{"location":"dallas", "hipaa":"false", "kms_instance_crn": "crn:v1:bluemix:public:kms:ussouth:a/abcdefg7df5907a4ae72ad28d9f493d6:888a5a41-543c-4ca7-af8374da3bb8f711::",
    "kms_key_crn": "crn:v1:bluemix:public:kms:ussouth:a/abcdefg7df5907a4ae72ad28d9f493d6:888a5a41-543c-4ca7-af8374da3bb8f711:key:0123c653-f904-4fe7-9fdb-5097e1ed85db"}'''
  rationale: When it comes to encryption of data at rest in IBM Cloud, we recommend for customers to manage customer root
    keys that are used to protect customer data stored in data and storage services in IBM Cloud. With the support of Bring
    Your Own Key (BYOK), customers can manage lifecycle of their customer root keys where they can create, rotate, delete
    those keys. This provides a significant level of control where those CRKs are managed by the customer, which in turn increases
    both security control as well as meet relevant compliance requirements. These CRKs are used in turn to protect the data
    encryption keys used to encrypt the data.
  impact: Additional administrative time will be required for the creation, transport, storage, and management of keys when
    using customer managed keys. If a customer does not bring their own encryption key at provision time, they are not able
    to crypto-shred the data or revoke the database's access to the encryption key, which would render the database unable
    to read the data.
  references: []
  page_start: 151
  audit_raw: "Users can audit whether a Cloudant Dedicated Hardware environment is using a\ncustomer-managed key by viewing\
    \ associations between root keys and associated\ncloud services in the IBM Key Protect UI or API. Use the steps below\
    \ to see the\nassociations and verify that the Cloudant Dedicated Hardware plan instance(s) have the\nappropriate associations\
    \ listed to show the use of customer-managed encryption key in\nKey Protect.\nUsing Console:\n1. Log in to the IBM Cloud\
    \ console.\n2. Go to Menu, Resource List to view a list of your resources.\n3. From your IBM Cloud resource list, select\
    \ your provisioned instance of Key\nProtect.\n4. On the application details page, select the Associated Resources tab\
    \ on the\nleft side menu.\n5. On the Associated resources page, use the Associated Resources table to\nbrowse the registrations\
    \ in your service.\n6. Click the ^ icon under the Details column to view a list of details for a specific\nregistration.\n\
    7. Click Filter button to filter for resources by key ID, Cloud Resource Name\n(CRN), and retention policy.\nUsing API:\n\
    You can retrieve the registration details that are associated with a specific root key by\nmaking a GET call to the following\
    \ endpoint:\nhttps://<region>.kms.cloud.ibm.com/api/v2/keys/<key_ID>/registrations\nView the registrations that are associated\
    \ with a root key by running the following cURL\ncommand:\n $ curl -X GET \\\n \"https://<region>.kms.cloud.ibm.com/api/v2/keys/<key_ID>/registrations\"\
    \n\\\n -H \"authorization: Bearer <IAM_token>\" \\\n -H \"bluemix-instance: <instance_ID>\"\nwhere the variables are as\
    \ follows:\n• region: Required. The region abbreviation, such as us-south or eu-gb, that\nrepresents the geographic area\
    \ where your Key Protect instance resides.\n• key_ID: Required. The identifier for the root key that is associated with\
    \ the cloud\nresources that you want to view.\n• IAM_token: Required. Your IBM Cloud access token. Include the full contents\
    \ of\nthe IAM token, including the Bearer value, in the cURL request.\n• instance_ID: Required. The unique identifier\
    \ that is assigned to your Key\nProtect service instance."
  remediation: 'The process to remediate a configuration where there is no use of a customer-managed

    encryption is as follows:

    1. Provision a new Cloudant Dedicated Hardware plan instance using a customermanaged key as shown in details above.

