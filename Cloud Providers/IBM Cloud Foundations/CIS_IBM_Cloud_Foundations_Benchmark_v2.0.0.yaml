    instance that you have provisioned.

    4. Click on the appropriate bucket that you would like to check

    5. Click on Configuration and scroll down to Associated key management

    service to check/confirm if a Key Protect key management service is associated'
  remediation: 'You will not be able to add Key Protect as the key management service once data is

    already written to a Cloud Object Storage bucket. In order to ensure that objects are

    encrypted using Key Protect root keys you will need to create a new Cloud Object

    Storage bucket, set it to use Key Protect key management service and then

    upload/copy the existing objects to this new bucket.'
