    \ the number of\nactions show the actions available to the role.\n10. Click Assign\nUsing CLI:\nFrom a terminal run the\
    \ following command:\nibmcloud iam user-policy-create <user-name> \\\n --roles <role> \\\n --service-name cloud-object-storage\
    \ \\\n --service-instance <resource-instance-id> \\\n --resource-type bucket \\\n --resource <bucket-name>\nTo list existing\
    \ policies:\nibmcloud iam user-policies <user-name>\nTo edit an existing policy:\nibmcloud iam user-policy-update <user-name>\
    \ <policy-id> \\\n --roles <role> \\\n --service-name cloud-object-storage \\\n --service-instance <resource-instance-id>\
    \ \\\n --resource-type bucket \\\n --resource <bucket-name>\nThe same set of accesses can be assigned to a service id\
