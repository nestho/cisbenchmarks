- id: '1.11'
  title: Ensure Trusted Profiles are used in place of ServiceIDs wherever feasible
  scoring: manual
  profile:
  - Level 1
  description: IBM Cloud trusted profiles are used to securely manage identity and access for applications running on IBM
    Cloud without relying on static credentials like API keys. IBM Cloud Context-Based Restrictions are a security feature
    that allows administrators to control access to cloud resources based on the context of the request, such as the IP address
    the request is made from, not just the identity of the user or service.
  rationale: One use of Trusted Profiles is to allow an application running on an IBM Cloud compute resource to assume the
    Trusted Profile and its access based on the identity of the compute resource where it is running, eliminating the need
    for the application to store and manage an API key. Trusted Profiles are preferred over ServiceIDs because they offer
    a more secure, scalable, and maintainable approach to identity and access management. Unlike ServiceIDs, which are static
    and tied to specific credentials, Trusted Profiles leverage the built-in identities of compute resources to assign least
    privilege access to applications running on those compute resources. They reduce the risk of credential sprawl and simplify
    auditing and compliance. By using Trusted Profiles for application identities, organizations can reduce the need to store
    and rotate API keys, improving their security posture and streamlining management. IBM Cloud's Context-Based Restrictions
    (CBRs) provide an essential layer of defense by enforcing access conditions based on network location or type of endpoint,
    not just IAM roles. This means even if a user has the correct permissions, their request can be blocked if it originates
    from an untrusted context. By implementing CBRs, organizations can reduce the risk of unauthorized access, enforce compliance
    policies, and protect critical services like Cloud Object Storage, Key Protect, and Secrets Manager. In short, CBRs help
    turn identity-based access into context-aware security, which is vital in today’s hybrid and distributed environments.
  impact: When a Trusted Profile is created in IBM Cloud, you can assign compute resources a trust relationship, allowing
    them to assume the Trusted Profile, and configure access policies. Once a context-based restriction is enabled in IBM
    Cloud, you can enforce access controls that go beyond identity and role by evaluating the context of each request.
  references:
  - 1. https://cloud.ibm.com/docs/account?topic=account-create-trusted-profile
  - 1. https://cloud.ibm.com/docs/account?topic=account-cbr
  - 2. https://cloud.ibm.com/docs/account?topic=account-context-restrictionswhatis#cbr-adopters
  page_start: 38
  audit_raw: 'To check if you have trusted profiles set up in your IBM Cloud account

    1. Log in to the IBM Cloud Console

    2. Navigate to IAM, Trusted Profiles.

    This section displays all existing profiles, including those assigned to users, federated

    identities, or compute resources like Kubernetes clusters.

    To check if you have a Context-Based Restriction (CBR) set in IBM Cloud, follow these

    steps:

    1. Log in to the IBM Cloud Console:

    2. Navigate to IAM, Context-based restrictions in the left-hand menu

    3. Under the Rules tab, you''ll see a list of all active CBR rules in your account. Each

    rule will show:

    o The network zone it applies to (e.g., IP ranges, VPCs)

    o The target service or resource (e.g., Cloud Object Storage, Key Protect)

    o The action (allow or deny)

    o Any conditions or exceptions

    4. You can click on each rule to view its details, including which users or services it

    affects and when it was last modified.

    5. If no rules are listed, then no CBRs are currently enforced in your account.'
  remediation: 'To create new trusted profile, complete the following steps:

    1. Log in to the IBM Cloud Console

    2. Navigate to Manage, Access (IAM), Trusted profiles

    3. Click Create and define the profile’s name, description, trusted entity type (such

    as federated users or compute resources), and access conditions.

    To create new trusted profile, complete the following steps:

    1. Log in to the IBM Cloud Console:

    2. Navigate to Manage, Context-based restrictions, then select Network

    zones from the left navigation menu.

    3. click Create and define the network zone(s) you want to allow access from,

    using allowed or denied IP addresses, subnets, or ranges, VPCs, and IBM Cloud

    services.

    4. Select Rules from the left navigation menu

    5. Click Create and select the service, APIs, and resources you want the rule to

    apply to, select the context including the zone you defined, and specify whether

    to enable or report on this rule.'
  checks:
  - type: manual_review
    info: 'To check if you have trusted profiles set up in your IBM Cloud account

      1. Log in to the IBM Cloud Console

      2. Navigate to IAM, Trusted Profiles.

      This section displays all existing profiles, including those assigned to users, federated

      identities, or compute resources like Kubernetes clusters.

      To check if you have a Context-Based Restriction (CBR) set in IBM Cloud, follow these

      steps:

      1. Log in to the IBM Cloud Console:

      2. Navigate to IAM, Context-based restrictions in the left-hand menu

      3. Under '
    severity: medium
- id: '1.13'
  title: Ensure limitations on External Identity Interactions are Enabled
  scoring: manual
  profile:
  - Level 1
  description: Use IAM settings to restrict external identity interactions in your account. This will block all API calls
    if the calling userID is not authenticated to your account and has logged in using an API key in a different account.
    Simplify and secure the access management process by using access groups or Trusted Profiles when you assign access to
    groups of users with identical access needs.
  rationale: When a user authenticates using an API key in one account, that user can use their token to do actions in any
    account they are a member of providing they have access policy. You can create an access group or a Trusted Profile so
    that you can organize a set of users and service IDs into a single entity that makes it easy for you to assign access.
    You can assign a single policy to the group instead of assigning the same access multiple times for each individual user
    or service ID. Using access groups or Trusted Profiles reduces the number of policies that must be created and managed
    in the account and simplifies the process of adding new users or service IDs or modifying user and service IDs access.
  impact: A user’s exposed or unrotated API key in another account can’t be used to access that user’s resources in your account.
  references:
  - 1. https://cloud.ibm.com/docs/account?topic=account-cross-acct
  - 1. https://cloud.ibm.com/docs/account?topic=account-groups
  - 2. https://cloud.ibm.com/docs/account?topic=account-create-trusted-profile
  page_start: 42
  audit_raw: 'To check if you have the External identities interactions limitation set in IBM Cloud,

    follow these steps:

    1. Log in to the IBM Cloud Console

    2. Go to Manage, IAM

    3. Select Settings in the left-hand menu

    4. Select the Resources tab

    5. In the External identity interactions box, select Edit

    6. Ensure the Limited option is selected

    Using Console:

    Audit user access policies:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. From the Menu bar, click Manage, Access (IAM).

    3. Click Users and select a user by clicking on the username.

    4. Click Access Policies.

    ***If the user has individual access policies and you wish to remove them, complete the

    appropriate remediation steps.'
  remediation: '1. Log in to the IBM Cloud Console

    2. Go to Manage, IAM

    3. Select Settings in the left-hand menu

    4. Select the Resources tab

    5. In the External identity interactions box, select Edit

    6. When turning the setting on for the first time in an existing account, it is

