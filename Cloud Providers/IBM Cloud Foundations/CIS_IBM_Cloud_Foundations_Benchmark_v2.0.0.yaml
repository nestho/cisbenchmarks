    the resource on which the action was requested (target details), and outcome of the request. Each event is based on the
    Cloud Auditing Data Federation (CADF) standard. For more information about the IBM event definition, see Event types and
    Event fields. In IBM Cloud Activity Tracker Event Routing, events from core IBM Cloud platform services are collected
    automatically and can be routed to a destination for analysis such as the IBM Cloud Logs service instances in your account.
