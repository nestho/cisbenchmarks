    2. From the Menu bar, click Manage, Access (IAM).

    3. Click Settings.

    4. In the public access section of IAM Settings, observe the Public access group

    setting.

    5. If the Public access group setting is disabled, IAM is not providing public access.

    6. If the Public access group setting is enabled, proceed to the Access groups page

    by clicking Access Groups.

    7. From the list of Access Groups, select Public Access by clicking on the Access

    Group name.

    8. Ensure that there are no access policies present for services in the list of access

    policies.'
  remediation: 'Using Console:

