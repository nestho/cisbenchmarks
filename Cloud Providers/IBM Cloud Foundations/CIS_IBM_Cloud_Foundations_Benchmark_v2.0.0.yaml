- id: '9.3'
  title: Ensure no workspace network security groups allow ingress from 0.0.0.0/0 to port 22
  scoring: manual
  profile:
  - Level 1
  description: 'It is recommended that no workspace security groups allow unrestricted ingress access to SSH on port 22. It
    is recommended that inbound traffic from the Internet to high-risk ports is restricted, following the principle of least
    privilege access. The ports specified in this control are DNS (53), POP3 (110), SMTP (25). DHCP (67, 68), SNMP (161, 162).
    It is recommended that inbound traffic from the Internet to administrative ports is restricted, following the principle
    of least privilege access. These ports are RDP (3389), SSH (22), VNC (Listener: 5500, Server: 5900) and RPC (135, 111).
    It is recommended that inbound traffic from the Internet to file sharing application ports is restricted, following the
    principle of least privilege access. These ports are NetBIOS (139), SMB (445), FTP (21). It is recommended the inbound
    traffic from the Internet to telnet port (23) or remote shell (RSH, port 514) is restricted.'
  rationale: This control is intended to reduce the PowerVS resource attack surface and risk of compromise by preventing access
    to administrative ports, like SSH. Removing unrestricted inbound connectivity from the Internet to infrastructure ports
    and services, such as DNS and DHCP, reduces PowerVS resources’ exposure to risk. Removing unrestricted connectivity from
    the Internet to administrative services, such as SSH, reduces a PowerVS resources risk exposure. Removing uncontrolled
    connectivity from the Internet to file sharing services, such as SMB, reduces a PowerVS resources’ risk exposure. These
    protocols are insecure/deprecated and should not be used in general.
  impact: When updating an existing environment, care should be taken to ensure that administrators currently relying on an
    ingress from 0.0.0.0/0 have access to ports 22 through another, more restrictive, access control list, private network
    connection or VPN as a Service. When updating an existing environment, care should be taken to ensure that administrators
    currently relying on an ingress from 0.0.0.0/0 have access to administrative ports through another, more restrictive,
    access control list, private network connection or VPN as a Service.
  references:
  - 1. https://cloud.ibm.com/docs/power-iaas?topic=power-iaas-nsg
  - 2. https://cloud.ibm.com/apidocs/power-cloud#v1-networksecuritygroups-list
