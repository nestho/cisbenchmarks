- id: 7.1.1
  title: Ensure data in Kubernetes secrets is encrypted using a Key Management Service (KMS) provider
  scoring: manual
  profile:
  - Level 2
  description: 'Protect sensitive information in your IBM Cloud Kubernetes Service cluster to ensure data integrity and to
    prevent your data from being exposed to unauthorized users. Understanding Key Management Service (KMS) providers When
    you enable a key management service (KMS) provider for your cluster, you bring your own root key. The root key is used
    to encrypt the data encryption keys (DEKs) which are then used to encrypt the secrets in your cluster. The root key is
    stored in the KMS provider instance that you control. The encrypted DEKs are stored in etcd and can only be unencrypted
    using the root key from the KMS provider. Supported KMS providers IBM Cloud Kubernetes Service supports the following
    KMS providers: • IBM Key Protect for IBM Cloud. • Hyper Protect Crypto Services. Key Protect leverages FIPS 140-2 Level
    3 certified cloud-based hardware security modules. Hyper Protect Crypto Services is built on FIPS 140-2 Level 4 certified
    hardware. As adding a different KMS provider requires updating the managed master default configuration, you can have
    only one KMS provider and key enabled in the cluster at a time.'
  rationale: Kubernetes secrets are base64 encoded by default. You can further protect Kubernetes secrets and any credentials
    stored in your secrets by enabling a key management service (KMS) provider to encrypt secrets with encryption keys that
    you control. When it comes to encryption of data at rest, IBM Cloud recommend for customers to manage customer root keys
    (CRK) that are used to protect customer data stored in data and storage services in IBM Cloud. With the support of Bring
    Your Own Key (BYOK), customers can create, store, and manage the lifecycle of their root keys to achieve full control
    of other DEKs stored in the cloud.
  impact: Review the following notes about cluster secret encryption. • Standard pricing for Key Protect and Hyper Protect
    Crypto Services applies. • Cluster secrets are encrypted by using your KMS. • Cluster secrets are automatically updated
    after rotating root keys. • Clusters that use the root key are viewable from the KMS provider interface. • Clusters automatically
    respond if you disable, enable, rotate, or restore root keys. • Disabling a root key restricts cluster functionality until
    you reenable the key. • If a deleted root key cannot be restored, the cluster becomes unusable and unrecoverable. o Both
    Key Protect and Hyper Protect Crypto Services provide features that allow deleted keys to be restored for a period of
    time after deletion. • Deleting the KMS instance will delete the keys as well, making the cluster unstable and unrecoverable.
    • You can have only one KMS provider and key enabled in the cluster at a time. • You can switch the KMS provider and key.
    • You can't disable KMS provider encryption.
  references:
  - 1. https://cloud.ibm.com/docs/containers?topic=containers-encryption-secrets
  - 2. https://cloud.ibm.com/docs/containers?topic=containers-encryption#clustersecret-encryption
  page_start: 183
  audit_raw: '1. To check that KMS encryption is enabled, verify that the Key Management

    Service status is set to enabled in the output of the following command.

    ibmcloud ks cluster get -c <cluster_name_or_ID>

    2. Log in to your account. If applicable, target the appropriate resource group. Set

    the context for your cluster.

    3. Verify that you can list the secrets in your cluster

    kubectl get secrets --all-namespaces

    4. In your KMS instance, disable the root key that is used to encrypt your cluster.

    Note: the CRK can only be disabled from the account where it is located.

    5. Wait for the cluster to detect the change to your root key.

    6. Try to list your secrets. You will get a timeout error because you can no longer

    connect to your cluster. If you try to set the context for your cluster by running

    ibmcloud ks cluster config, the command fails.

    kubectl get secrets --all-namespaces

    7. Check that your cluster is in a warning state. Your cluster remains in this state

    and is unusable until you enable your root key again.

    ibmcloud ks cluster get -c <cluster_name_or_ID>

    8. In your KMS instance, enable the root key so that your cluster returns to a

    normal state and becomes usable again.'
  remediation: 'Using Console:

    The following remediation steps assume you are not using cross account KMS

    encryption.

    1. Create a KMS instance and root key.

    2. Log in to the IBM Cloud console.

    3. To view a list of your resources, go to Menu, Containers, Clusters.

    4. From the Clusters page, select your cluster.

    5. In the Cluster details section, under Cluster encryption click Enable. If you

    already enabled the KMS provider, click Update.

    6. Select the Root key that you want to use for the encryption, by KMS instance or

    Root key CRN.

    7. Click Enable (or Update).

    8. Verify that the KMS enablement process is finished. The process is finished

    when that the Master Status is Ready and Key management service is

    enabled.

    9. After the KMS provider is enabled in the cluster, all cluster secrets are

    automatically encrypted.

    Using Command Line:

    The following remediation steps assume you are not using cross account KMS

    encryption.

    1. Create a KMS instance and root key.

    2. Obtain the ID of the KMS instance that you previously created.

    ibmcloud ks kms instance ls

    3. Get the ID of the root key that you previously created.

    ibmcloud ks kms crk ls --instance-id <KMS_instance_ID>

    4. Enable the KMS provider to encrypt secrets in your cluster. Complete the options

    with the information that you previously retrieved. The KMS provider''s private

    cloud service endpoint is used by default to download the encryption keys. To

    use the public cloud service endpoint instead, include the --public-endpoint

    option. The enablement process can take some time to complete.

    ibmcloud ks kms enable -c <cluster_name_or_ID> --instance-id

    <kms_instance_ID> --crk <root_key_ID> [--public-endpoint]

    5. Verify that the KMS enablement process is finished. The process is finished

    when that the Master Status is Ready and Key management service is

    enabled.

    6. After the KMS provider is enabled in the cluster, all cluster secrets are

    automatically encrypted.'
  checks:
  - type: manual_review
    info: '1. To check that KMS encryption is enabled, verify that the Key Management

      Service status is set to enabled in the output of the following command.

      ibmcloud ks cluster get -c <cluster_name_or_ID>

      2. Log in to your account. If applicable, target the appropriate resource group. Set

      the context for your cluster.

      3. Verify that you can list the secrets in your cluster

      kubectl get secrets --all-namespaces

      4. In your KMS instance, disable the root key that is used to encrypt your cluster.

      Note: the CR'
    severity: medium
- id: 7.1.2
  title: Ensure TLS 1.2+ for all inbound traffic at IBM Cloud Kubernetes Service Ingress
  scoring: scored
  profile:
  - Level 1
  description: Ensure that all insecure (HTTP) client requests to applications and services hosted on IBM Cloud Kubernetes
    Service are redirected to secure TLS connections (HTTPS) and ensure that only TLS versions 1.2+ are supported. You set
    up Ingress application load balancers (ALBs) in your cluster to secure your domain with the IBM-provided TLS certificate
    or your custom TLS certificate. Some users might try to access your apps by using an insecure http request to your ALB
    domain, for example http://www.myingress.com, instead of using https. Update the worker nodes in a cluster to the latest
    patch version so that security fixes are applied to those worker nodes.
  rationale: 'Hypertext transfer protocol secure (HTTPS) is the secure version of HTTP and uses the Transport Layer Security
    (TLS) protocol to provide a secure, encrypted connection between the client and the server. This protocol encrypts communication
    to protect users from attack, for example, man in the middle attacks. IBM Cloud Kubernetes Service provides configuration
    options that redirect HTTP requests to HTTPS, and it is highly recommended to enable this. If you do not use this configuration,
    insecure HTTP requests are not converted into HTTPS requests by default and might expose unencrypted confidential information
    to the public. As security updates and patches are put in place for the API server and other master components, you must
    be sure that the worker nodes remain in sync. You can make two types of updates: updating only the patch version, or updating
    the major.minor version with the patch version. This benchmark is only in relation to updating the patch version, not
    the major or minor versions. Updating the patch version in a timely manner ensures patching of known vulnerabilities and
    will keep your worker nodes more secure.'
  impact: Incoming requests will not be able to use HTTP because all requests will be redirected to HTTPS. Legacy clients
    that require TLS 1.0 or 1.1 support will not be able to access your applications. The worker node update also updates
    the worker node to the same major.minor version as the master if a major.minor update is also available.
  references:
  - 1. https://cloud.ibm.com/docs/containers?topic=containers-encryption#keyprotect
  - 2. https://cloud.ibm.com/docs/hs-crypto
  - 1. https://cloud.ibm.com/docs/containers?topic=containersupdate&#vpc_worker_node
  - 2. https://cloud.ibm.com/docs/containers?topic=containerscs_versions#update_types
  page_start: 187
  audit_raw: "1. Obtain the configuration for the ibm-k8s-controller-config ConfigMap resource.\nkubectl get cm ibm-k8s-controller-config\
    \ -n kube-system -o yaml\n2. In the data section, ensure that the ssl-protocols key is not present, or if it is\npresent,\
    \ ensure that it only includes TLSv1.2 and/or TLSv1.3.\n3. In the data section, ensure that the ssl-redirect key is present\
    \ and is set to\ntrue.\napiVersion: v1\ndata:\n ssl-protocols: \"TLSv1.2 TLSv1.3\"\n ssl-redirect: “true”\nkind: ConfigMap\n\
    metadata:\n name: ibm-k8s-controller-config\n namespace: kube-system\n4. Obtain the configuration for your Ingress resource\
    \ by running the following\ncommand:\nkubectl get ingress <my_ingress> -n <my_namespace> -o yaml\n5. In the annotations\
    \ section, ensure that the\nnginx.ingress.kubernetes.io/ssl-redirect key is present and is set to\ntrue.\napiVersion:\
    \ networking.k8s.io/v1\nkind: Ingress\nmetadata:\n name: myingress\n annotations:\n nginx.ingress.kubernetes.io/ssl-redirect:\
    \ \"true\"\nspec:\n tls:\n - hosts:\n - myhost\n secretName: mytlssecret\n rules:\n - host: myhost\n http:\n paths:\n\
    \ - backend:\n service:\n name: myservice\n port:\n number: 8080\n path: /\nUsing Console:\n1. Log in to the IBM Cloud\
    \ console.\n2. To view a list of your clusters, go to Menu, Containers, Clusters.\n3. From the Clusters page, select your\
    \ cluster.\n4. Select the Worker Nodes tab.\n5. For each listed worker node, ensure that next to the Version no information\
    \ icon\nis present indicating that an update is available. If there is an information icon\nindicating there is an update\
    \ available, then the worker node is not running the\nlatest available image.\nUsing Command Line:\n1. List the clusters\
    \ in your IBM Cloud account\nibmcloud ks cluster ls\n2. List the workers for a given cluster.\nibmcloud ks workers -c\
    \ <cluster_name_or_ID>\n3. Ensure that next to the version for a worker node no asterisk (*) is present\nindicating that\
    \ an update is available.\nHere is an example output for a VPC cluster that shows that there is an available\nupdate for\
    \ a worker node:\nibmcloud ks worker -c mykubecluster\nOK\nID Primary IP\nFlavor State Status Zone Version Operating System\n\
    kube- btdsgk5d0t1lpluh7f40-mykubeclust-default-000000d1 12.345.678.90\ngx3.16x80.l4 normal Ready ca-tor-3 1.31.11_1559*\
    \ UBUNTU_24_64\n* To update to 1.31.11_1560 version, run 'ibmcloud ks worker replace'. Review\nand make any required version\
    \ changes before you update:\n'https://ibm.biz/upworker'"
  remediation: "1. Edit the configuration file for the ibm-k8s-controller-config ConfigMap\nresource by running the following\
    \ command:\nkubectl edit cm ibm-k8s-controller-config -n kube-system\n2. In the data section, remove the ssl-protocols\
    \ key, or ensure it is set to sslprotocols: \"TLSv1.2 TLSv1.3\".\n3. In the data section, add ssl-redirect: \"true\".\n\
    apiVersion: v1\ndata:\n ssl-protocols: \"TLSv1.2 TLSv1.3\"\n ssl-redirect: “true”\nkind: ConfigMap\nmetadata:\n name:\
    \ ibm-k8s-controller-config\n namespace: kube-system\n4. Edit the configuration for your Ingress resource by running the\
    \ following\ncommand:\nkubectl edit ingress <my_ingress> -n <my_namespace>\n5. In the annotations section, add nginx.ingress.kubernetes.io/sslredirect:\
    \ \"true\".\napiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n name: myingress\n annotations:\n nginx.ingress.kubernetes.io/ssl-redirect:\
    \ \"true\"\nspec:\n tls:\n - hosts:\n - myhost\n secretName: mytlssecret\n rules:\n - host: myhost\n http:\n paths:\n\
    \ - backend:\n service:\n name: myservice\n port:\n number: 8080\n path: /\nUsing Console:\n1. Complete the prerequisite\
    \ steps for VPC worker nodes.\n2. Log in to the IBM Cloud console.\n3. Optional: Add capacity to your cluster by resizing\
    \ the worker pool. The pods on\nthe worker node can be rescheduled and continue running on the added worker\nnodes during\
    \ the update.\n4. To view a list of your clusters, go to Menu, Containers, Clusters.\n5. From the clusters page, select\
    \ your cluster.\n6. Select the Worker Nodes tab.\n7. Select the checkbox for each worker node that you want to update.\
    \ An action bar\nis displayed over the table header row.\n8. From the action bar, click Update.\nUsing Command Line:\n\
    1. Complete the prerequisite steps for VPC worker nodes.\n2. Optional: Add capacity to your cluster by resizing the worker\
    \ pool. The pods on\nthe worker node can be rescheduled and continue running on the added worker\nnodes during the update.\n\
    3. List the worker nodes in your cluster and note the note the details of the worker\nnode that you want to update.\n\
    ibmcloud ks worker ls --cluster <cluster_name_or_ID>\n4. Replace the worker node to update the worker node to the latest\
    \ patch version at\nthe same major.minor version (such as from 1.31.8_1530 to 1.31.9_1533)..\nibmcloud ks worker replace\
    \ --cluster <cluster_name_or_ID> --worker\n<worker_node_ID>\nUsing the --update option will update the VPC worker node\
    \ to the same major.minor\nversion as the master (such as from 1.31 to 1.32).\nibmcloud ks worker replace --cluster <cluster_name_or_ID>\
    \ --worker\n<worker_node_ID> --update\n5. Repeat these steps for each worker node that you want to update.\n6. Optional:\
    \ After the replaced worker nodes are in a Ready status, resize the\nworker pool to meet the cluster capacity that you\
    \ want."
  checks:
  - type: manual_review
    info: "1. Obtain the configuration for the ibm-k8s-controller-config ConfigMap resource.\nkubectl get cm ibm-k8s-controller-config\
      \ -n kube-system -o yaml\n2. In the data section, ensure that the ssl-protocols key is not present, or if it is\npresent,\
      \ ensure that it only includes TLSv1.2 and/or TLSv1.3.\n3. In the data section, ensure that the ssl-redirect key is\
      \ present and is set to\ntrue.\napiVersion: v1\ndata:\n ssl-protocols: \"TLSv1.2 TLSv1.3\"\n ssl-redirect: “true”\n\
      kind: ConfigMap\nmetadata:\n name: ibm-k8s-"
    severity: medium
- id: 7.1.4
  title: Ensure IBM Cloud Kubernetes Service cluster has image pull secrets enabled
  scoring: scored
  profile:
  - Level 1
  description: To pull container images from a registry, your IBM Cloud Kubernetes Service cluster uses a special type of
    Kubernetes secret - an imagePullSecret. This image pull secret stores the credentials to access a container registry.
    By default, your cluster is set up to pull images from only your account's namespaces in IBM Cloud Container Registry
    and deploy containers from these images to the default Kubernetes namespace in your cluster.
  rationale: IBM Cloud Kubernetes Service clusters pull container images from container registries to run containers. If the
    registry is private, the cluster needs credentials to pull images from it. Because IBM Cloud Kubernetes Service and IBM
    Cloud Container Registry are often used in tandem, it is important to have image pull secrets for IBM Cloud Container
    Registry enabled in your cluster.
  impact: Pull secrets are created in the default namespace of your cluster. If you want to pull images to other Kubernetes
    namespaces, then you must copy the pull secrets to those other namespaces.
  references:
  - 1. https://cloud.ibm.com/docs/containers?topic=containersregistry#imagePullSecret_migrate_api_key
  - 2. https://cloud.ibm.com/docs/containers?topic=containersregistry#cluster_registry_auth
  page_start: 194
  audit_raw: '1. Login to your VPC cluster and check the image pull secrets by running:

    kubectl get secrets -n default | grep "icr-io"

    2. As image pull secrets are automatically added to clusters at creation time, if no

    icr secrets are listed, the person who created the cluster might not have had the

    required permissions to IBM Cloud Container Registry.'
  remediation: '1. Run the following command to create an IBM Cloud IAM service ID for the

    cluster, create a policy for the service ID that assigns the Reader service access

    role in IBM Cloud Container Registry, and then create an API key for the service

    ID. The API key is then stored in a Kubernetes image pull secret.

    Note: This process happens automatically when you create a cluster, but sometimes

    errors can occur during the cluster creation process.

    ibmcloud ks cluster pull-secret apply --cluster <cluster_name_or_ID>

    2. Verify that the image pull secrets are created in your cluster.

    kubectl get secrets | grep icr-io'
  checks:
  - type: command
    command: kubectl get secrets -n default | grep "icr-io"
    expected: ''
    severity: medium
    info: '1. Login to your VPC cluster and check the image pull secrets by running:

      kubectl get secrets -n default | grep "icr-io"

      2. As image pull secrets are automatically added to clusters at creation time, if no

      icr secrets are listed, the person who created the cluster might not have had the

      required permissions to IBM Cloud Container Registry.'
- id: 7.1.5
  title: Ensure IBM Cloud Kubernetes Service clusters have the monitoring service enabled
  scoring: scored
  profile:
  - Level 2
  description: The following recommendation should be considered optional, as while adhering to it would provide enhanced
    security, IBM Cloud Monitoring is a costed option. IBM Cloud services, such as IBM Cloud Kubernetes Service, generate
    platform metrics that you can use to gain operational visibility into the performance and health of the service in your
    account. Every Kubernetes master is continuously monitored by the IBM Cloud Kubernetes Service; however, you are responsible
    for monitoring the rest of your cluster components. IBM Cloud Monitoring is a cloud-native, container-intelligence management
    system that can be included as part of your IBM Cloud architecture. It offers administrators, DevOps teams, and developers
    full-stack telemetry with advanced features to monitor and troubleshoot, define alerts, and design custom dashboards.
    With IBM Cloud Monitoring, by deploying a monitoring agent to your worker nodes you can collect cluster and pod metrics,
    such as the CPU and memory usage of your worker nodes, incoming and outgoing HTTP traffic for your pods, and data about
    several infrastructure components. In addition, the agent can collect custom application metrics by using either a Prometheus-compatible
    scraper or a StatsD facade.
  rationale: Gaining operational visibility into the performance and health of your applications and clusters not only helps
    you maintain operational continuity but can also act as an early warning system for anomalies caused by security incidents.
    Monitoring can also help identify patterns of unexpected activity on your applications and clusters, which in turn provide
    indicators of compromise. IBM Cloud Monitoring includes alerts and multi-channel notifications that you can use to accelerate
    your reaction and response time to anomalies, downtime, and performance degradation.
  impact: While adhering to this recommendation would provide enhanced security, IBM Cloud Monitoring is a costed option.
    Standard pricing for IBM Cloud Monitoring applies.
  references:
  - 1. https://cloud.ibm.com/docs/containers?topic=containers-monitoring
  - 2. https://cloud.ibm.com/docs/monitoring?topic=monitoring-kubernetes_cluster
  page_start: 196
  audit_raw: 'From Console:

    1. Log in to the IBM Cloud console.

    2. To view a list of your clusters, go to Menu, Containers, Clusters.

    3. From the Clusters page, select your cluster.

    4. Select the Overview tab

    5. Under Integrations, the Monitoring item should have a button to Launch the

    IBM Cloud Monitoring dashboard. If instead the button is labelled Connect, then

    Cloud Monitoring is not enabled.

    From Command Line:

    1. Verify the status of the monitoring agent in your cluster. You should see one or

    more running sysdig-agent pods, with the number of sysdig-agent pods

    equal to the number of worker nodes in your cluster.

    kubectl get pods -n ibm-observe'
  remediation: "From Console:\n1. Log in to the IBM Cloud console.\n2. To view a list of your clusters, go to Menu, Containers,\
    \ Clusters.\n3. From the Clusters page, select your cluster.\n4. Select the Overview tab\n5. Under Integrations, go to\
    \ the Monitoring item and click Connect.\n6. Select the Monitoring checkbox and select the IBM Cloud Monitoring instance\n\
    that you want to use (or create a new instance). Click Save.\nFrom Command Line:\n1. If required, provision an IBM Cloud\
    \ Monitoring instance.\n2. Obtain the access key for the monitoring instance.\nibmcloud resource service-key APIKEY_NAME\n\
    3. Obtain the ingestion URL from the IBM Cloud Monitoring collector endpoints.\n4. If the ibm-observe namespace is not\
    \ available in your cluster, create it with:\nkubectl create namespace ibm-observe\n5. Add the Sysdig helm repository.\n\
    helm repo add sysdig https://charts.sysdig.com\n6. Update the repos to retrieve the latest versions of all Helm charts.\n\
    helm repo update\n7. Verify the Helm chart sysdig/sysdig-deploy is listed when listing the helm\ncharts for the sysdig\
    \ repo.\nhelm search repo sysdig\n8. Define a yaml file and include the values to deploy the IBM Cloud Monitoring\nagent.\
    \ The following yaml is a template that you can use, updating the fields as\nappropriate. More details available here.\n\
    global:\n clusterConfig:\n name: CLUSTER_NAME\n sysdig:\n accessKey: SERVICE_ACCESS_KEY\nagent:\n collectorSettings:\n\
    \ collectorHost: INGESTION_ENDPOINT\nnodeAnalyzer:\n enabled: false\n9. Run the following command to install the agent\
    \ by using the Helm chart and the\nvariables yaml file.\nhelm install -n ibm-observe sysdig-agent sysdig/sysdig-deploy\
    \ -f <agentvalues yaml file>\n10. Verify that the monitoring agent is created successfully.\nkubectl get pods -n ibm-observe"
  checks:
