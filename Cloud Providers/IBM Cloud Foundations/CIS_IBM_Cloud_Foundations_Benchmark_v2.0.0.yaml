controls:
- id: '1.1'
  title: Monitor account owner for frequent, unexpected, or unauthorized logins
  scoring: manual
  profile:
  - Level 1
  description: Monitor login activity of the account owner to prevent unauthorized usage of the privileged account.
  rationale: 'The owner of an IBM Cloud account by default has administrative privileges across the account. There may be
    other users also assigned administrative privileges to the account. To prevent unauthorized or unintended usage, login
    credentials should never be shared and users in an organization should be granted least privilege to complete their required
    tasks. To manage the account, administrators are granted permissions to manage services and Cloud resources. Therefore,
    access by the account owner to the account to run tasks should be minimum. By monitoring the number of times that the
    account owner and administrative users log in to the account, you can: • Monitor administrative access to the IBM Cloud
    account • Identify abnormal behavior • Enforce that administrators and operators of the services in your Cloud account
    are the ones managing the Cloud resources with their controlled and limited permissions. When a user logs in to the account,
    a security login event is generated. The event reports who has logged in successfully in the account. You can use these
    security events to monitor the number of times that administrative privilege users have logged in to the account and generate
    an alert if the number exceeds a threshold that you set in a period of time that you specify. Monitoring login activity
    of users with administrative privileges can help prevent unauthorized or unintended actions taken in the account. Account
    switching may result in multiple login events being logged and this should be taken into account.'
  impact: ''
  references:
  - 1. https://cloud.ibm.com/docs/cloud-logs
  page_start: 18
  audit_raw: 'Before you can monitor and manage IBM event data with IBM Cloud Logs, you must

    provision an instance of the IBM Cloud Logs service.

    Refer to the IBM Cloud Logs documentation to provision and start using an instance of

    IBM Cloud Logs https://cloud.ibm.com/docs/cloud-logs?topic=cloud-logs-getting-started.'
  remediation: 'Complete the following steps to monitor how many times an account owner logs in to

    the account:

    First, you need to identify the email of the account owner.

    1. In the Cloud UI, go to Manage, Access (IAM), then select Users.

    2. Identify the users identified with administrator privileges.

    3. Select the account owner. Then, click Details.

    4. Copy the email address of the account owner.

    Launch the Activity Tracker instance in Frankfurt. This is the instance where login

    security events are collected in the account. In the Views section, select the

    Everything view. Then, enter the following query in the search bar:

    (action login) AND initiator.name:<email address>

    Replace with the account owner''s email address. The view now reports all the login

    actions that are reported for the account owner.

    Next, you can define an alert on the view to get a notification when N number of events

    are received within a 24 hour period. The value of N depends on how you operate your

    cloud. You can start with a default value of 25 and increase or decrease depending on

    the tasks that the account administrator can perform in the account.'
  checks:
  - type: manual_review
    info: 'Before you can monitor and manage IBM event data with IBM Cloud Logs, you must

      provision an instance of the IBM Cloud Logs service.

      Refer to the IBM Cloud Logs documentation to provision and start using an instance of

      IBM Cloud Logs https://cloud.ibm.com/docs/cloud-logs?topic=cloud-logs-getting-started.'
    severity: medium
- id: '1.2'
  title: Ensure API keys unused for 180 days are detected and optionally disabled
  scoring: manual
  profile:
  - Level 1
  description: Monitor API key usage in your account and search for API keys that are unused or used infrequently.
  rationale: If an API key is unused for long period in your account, it must be suspended or disabled as a security best
    practice. All API keys, even those that are used infrequently, must be rotated periodically. To reduce the likelihood
    of accidental exposure or leaking, monitoring for infrequently used API keys can indicate that an API key can be suspended
    and even deleted, if there is no anticipated future usage.
  impact: ''
  references:
  - 1. https://cloud.ibm.com/docs/account?topic=account-id-inactive-identities
  page_start: 20
  audit_raw: 'Using Console:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. Click Manage, Access (IAM), and select Inactive Identities

    3. Click Update report to view the most recent report of inactive identities in your

    account

    4. Select the API keys tab to review a list of unused API keys'
  remediation: 'On the Inactive Identities report under API keys tab, review and remove the API

    keys no longer in use.

    To delete inactive identities that are no longer in use for over 180 days, click the

    Actions icon, Remove'
  checks:
  - type: manual_review
    info: 'Using Console:

      1. Log in to IBM Cloud at https://cloud.ibm.com.

      2. Click Manage, Access (IAM), and select Inactive Identities

      3. Click Update report to view the most recent report of inactive identities in your

      account

      4. Select the API keys tab to review a list of unused API keys'
    severity: medium
- id: '1.3'
  title: Ensure API keys are rotated every 90 days
  scoring: manual
  profile:
  - Level 1
  description: Replace production API keys with new API keys regularly, every 90 days for example, as a best practice to secure
    your account.
  rationale: API key rotation can help reduce the impact to your organization if an API key becomes exposed or compromised.
    If you suspect that a key might have been leaked or compromised, the key must be rotated out of production and deleted.
  impact: Any resource that is using an API key that has been rotated out of production will encounter errors until the API
    key has been updated.
  references:
  - 1. https://cloud.ibm.com/docs/account?topic=account-userapikey
  - 2. https://cloud.ibm.com/docs/secrets-manager?topic=secrets-manager-automaticrotation&interface=ui
  page_start: 22
  audit_raw: 'Using Console:

    To find out when an API key was created, complete the following steps:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. From the Menu bar, click Manage, Access(IAM), API keys.

    3. Identify an API key and from the Actions menu, select Details.

    4. View the date the API key was created.'
  remediation: 'Using Console:

    To create new API key, complete the following steps:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. From the Menu bar, click Manage, Access (IAM), API keys.

    3. Click Create an IBM Cloud API key.

    To rotate an API key, replace an old API key anywhere it is used with the newly

    created API key.

    Delete an old API key:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. From the Menu bar, click Manage, Access (IAM), API keys.

    3. Identify the API key you want to delete, and from the Actions menu, select

    Delete.

    You can also opt to use IBM Cloud Secrets Manager to auto-rotate keys -

    https://www.ibm.com/products/secrets-manager'
  checks:
  - type: manual_review
    info: 'Using Console:

      To find out when an API key was created, complete the following steps:

      1. Log in to IBM Cloud at https://cloud.ibm.com.

      2. From the Menu bar, click Manage, Access(IAM), API keys.

      3. Identify an API key and from the Actions menu, select Details.

      4. View the date the API key was created.'
    severity: medium
- id: '1.4'
  title: Restrict user API key creation and service ID creation in the account via IAM roles
  scoring: manual
  profile:
  - Level 1
  description: Use IAM settings to restrict user API key creation and service ID (and related API key) creation in the account.
    Enable both settings to restrict all users in the account from creating user API keys and service IDs except those with
    an IAM policy that explicitly allows it.
  rationale: API keys authenticate IBM Cloud identities. Once an API key has been created, an identity can use it to authenticate
    and perform any action the identity has access to in any account where that identity is valid and has access, even a different
    account from the one where the API key was created. Service IDs can be granted a subset of access that a user has, and
    then used to authenticate and perform actions in the account. Service IDs are intended to be used by applications and
    other programmatic entities, and so they persist in an account even after users who created them or had access to them
    have been deleted. Creating an unauthorized service ID or API key on an existing service ID could be a way for a user
    to gain unauthorized access to an account after they've been deleted, and so creation of service IDs and API keys should
    be limited to those users who have a legitimate need to do so.
  impact: This process involves two IAM controls. Enabling the restriction of user API keys will prevent users in an account
    from creating user API keys, except those with an explicit IAM policy to do so. Enabling the restriction of service ID
    creation will prevent users in an account from creating service IDs, except those with an explicit IAM policy to do so.
  references:
  - 1. https://cloud.ibm.com/docs/cloud-logs
  - 2. https://cloud.ibm.com/docs/account?topic=account-userapikey
  page_start: 24
  audit_raw: 'Using Console:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. Click Manage, Access (IAM).

    3. Click Settings.

    4. In the Account section of the Settings page, ensure that Restrict API key creation

    and Restrict service ID creation are enabled.'
  remediation: 'Using Console:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. Click Manage, Access (IAM).

    3. Click Settings.

    4. In the Account section of the Settings page, ensure that Restrict API key creation

    and Restrict service ID creation are enabled.

    5. Once enabled, only users with the correct IAM policies will be able to create user

    API keys and service IDs.'
  checks:
  - type: manual_review
    info: 'Using Console:

      1. Log in to IBM Cloud at https://cloud.ibm.com.

      2. Click Manage, Access (IAM).

      3. Click Settings.

      4. In the Account section of the Settings page, ensure that Restrict API key creation

      and Restrict service ID creation are enabled.'
    severity: medium
- id: '1.5'
  title: Ensure no owner account API key exists
  scoring: manual
  profile:
  - Level 1
  description: API keys by definition allow access to your account and resources in your account. The API key authenticates
    the identity and allows all access assigned to the identity for which it was created, therefore an API key created by
    user with administrative privileges has administrative level access to resources in the account.
  rationale: In accordance with the practice of granting least privilege, API keys should not be created by an account owner
    because of the level of privilege automatically granted to account-owner created API keys.
  impact: The API key authenticates the identity and allows all access assigned to the identity for which it was created,
    therefore an API key created by an account owner has accountowner level access to resources in the account.
  references:
  - 1. https://cloud.ibm.com/docs/account?topic=account-userapikey
  - 2. https://cloud.ibm.com/docs/account?topic=account-create-trusted-profile
  page_start: 26
  audit_raw: 'To check for the existence of an API key created by an administrative user, complete

    the following steps.

    1. Login as any administrative user at cloud.ibm.com

    2. Click Manage, Access (IAM)

    3. Click API keys

    4. Check for any API keys that appear under the My IBM Cloud API keys view'
  remediation: 'To delete an API key, complete the following steps:

    1. Login as the administrative user at cloud.ibm.com

    2. In the console, go to Manage, Access (IAM)

    3. Click on API keys

    4. Identify the row of the API key that you want to delete and select Delete from the

    Actions List of actions icon menu (found on the right hand side of the row).

    5. Then, confirm the deletion by clicking Delete.

    6. If you have scenarios where you need a higher level of access, then you should

    setup a Trusted Profile with these privileges and use it with a less privileged

    identity'
  checks:
  - type: manual_review
    info: 'To check for the existence of an API key created by an administrative user, complete

      the following steps.

      1. Login as any administrative user at cloud.ibm.com

      2. Click Manage, Access (IAM)

      3. Click API keys

      4. Check for any API keys that appear under the My IBM Cloud API keys view'
    severity: medium
- id: '1.6'
  title: Ensure multi-factor authentication (MFA) is enabled for all users in account
  scoring: manual
  profile:
  - Level 1
  description: Requires users to provide multiple factors of login credentials to authenticate their identity and gain access
    to IBM Cloud resources.
  rationale: Multifactor authentication (MFA) adds an additional layer of security to an account by requiring users to provide
    an additional login credential. This requirement helps protect accounts from stolen, phished, or weak password exploits.
  impact: Depending on the administrator’s selection, users might be required to provide an additional authentication factor
    prior to gaining access to IBM Cloud resources. API keys for users and service IDs continue to work after MFA is enabled.
  references:
  - 1. https://cloud.ibm.com/docs/account?topic=account-enablemfa
  page_start: 28
  audit_raw: 'Using Console:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. From the Menu bar, click Manage, Access (IAM).

    3. Click Settings, Account login.

    4. Verify Multifactor authentication does not say None'
  remediation: 'Using Console:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. From the Menu bar, click Manage, Access (IAM).

    3. Click Settings, Account login.

    4. Click Edit for the Account login setting.

    5. Select Non-federated users only, or All users depending on which type of

    authentication you want to require.

    6. Select the checkbox to confirm that you understand the impact of requiring MFA

    for users in your account, if you select the non-federated users only option.

    7. Click Update.'
  checks:
  - type: manual_review
    info: 'Using Console:

      1. Log in to IBM Cloud at https://cloud.ibm.com.

      2. From the Menu bar, click Manage, Access (IAM).

      3. Click Settings, Account login.

      4. Verify Multifactor authentication does not say None'
    severity: medium
