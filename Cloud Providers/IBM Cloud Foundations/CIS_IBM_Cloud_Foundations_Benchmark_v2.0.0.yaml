    \ +0000 UTC\nModified On 2024-12-13 23:37:35.834688 +0000 UTC\nName advanced-cert-test.batflare.com\nType A\nContent 1.2.3.4\n\
    Domain ID\nDomain Name\nProxied true\nTTL 1"
  checks:
  - type: manual_review
    info: 'The different types of mechanisms to audit if DDoS is enabled are as follows:

