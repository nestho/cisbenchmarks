- id: '4.1'
  title: Ensure IBM Cloud Databases disk encryption is enabled with customer managed keys
  scoring: manual
  profile:
  - Level 1
  description: 'IBM Cloud Databases provides automatic encryption at rest when provisioning the service. It is not an option
    to deploy a database service without encryption at rest. However, using the service''s integration with IBM Key Protect,
    customers can bring their own encryption key at the time of database provisioning. Furthermore, IBM Cloud Databases backups
    are also encrypted by default. Before any UI or CLI commands. Follow the authorization instructions between the HSM and
    Database service. 1. Open your IBM Cloud dashboard. 2. From the menu bar, click Manage, Access (IAM). 3. In the side navigation,
    click Authorizations. 4. Click Create. 5. In the Source service menu, select the service of the deployment. For example,
    Databases for PostgreSQL or Messages for RabbitMQ 6. In the Source service instance menu, select All instances. 7. In
    the Target service menu, select Key Protect. 8. Select or retain the default value Account as the resource group for the
    Target Service. 9. In the Target service Instance ID menu, select the service instances to authorize. 10. Under Service
    access, check the box to enable the Reader role. 11. Click Authorize. 12. Service Creation via UI or CLI with the appropriate
    encryption key from IBM Key Protect Using Console: 1. Head to the respective catalog page of the service you want to provision
    with a customer-managed encryption key (e.g., https://cloud.ibm.com/catalog/services/databases-for-postgresql) 2. Fill
    out the form with the desired region, RAM, CPU, Disk, Database version, and Networking settings. 3. Click Select a Key
    Protect instance, your authorized Key Protect instances will appear in the dropdown. Select the one you want to use. 4.
    Directly to the right, click Select a disk encryption key. A list of available encryption keys from the previously selected
    Key Protect instance will be selectable for encrypting your database at rest. Using CLI: Run the following command after
    logging into IBM Cloud via the CLI ibmcloud resource service-instance-create example-database <service-name> standard
    us-south \ -p \ ''{"disk_encryption_key_crn": "crn:v1:<...>:key:<id>"}'''
  rationale: When it comes to encryption of data at rest in IBM Cloud, we recommend for customers to manage customer root
    keys that are used to protect customer data stored in data and storage services in IBM Cloud. With the support of Bring
    Your Own Key (BYOK), customers can manage lifecycle of their customer root keys where they can create, rotate, delete
    those keys. This provides a significant level of control where those CRKs are managed by the customer, which in turn increases
    both security control as well as meet relevant compliance requirements. These CRKs are usd in turn to protect the data
    encryption keys used to encrypt the data.
  impact: If a customer does not bring their own encryption key at provision time, they are not able to cryptoshred the database
    or revoke the database's access to the encryption key rendering it unable to boot storage.
  references: []
  page_start: 139
  audit_raw: 'Using Console:

    1. Log on to your IBM Cloud account

    2. Go to the Menu icon, Resource List to access your list of account resources

    3. Click the Database service you are interested in to open the service dashboard.

    4. Ensure you are on the Manage page in the left pane.

    5. You should be on the Overview tab. Scroll down to the security section.

    6. The security section will show an Encryption Key section under Disks. If the

    value shown is Automatic Key this means the deployment does not have a

    customer-managed encryption key through IBM Key Protect

    Using CLI:

    1. At a minimum, have the Viewer role for the IBM Cloud Databases deployment.

    2. Run

    ibmcloud cdb deployment-about <CRN> [--all] [--json]

    This will return the Encryption Key Status, if the deployment is created with a customermanaged encryption key, the key
    CRN will display here.'
  remediation: 'There is no zero-downtime remediation procedure . Customer must restore a backup

    with a new encryption key or create a net new database instance with Bring Your Own

    Key enabled.

    To restore a backup with a new encryption key:

    1. Ensure you have the Viewer Privileges on the IBM Cloud Databases deployment

    to read a backup file and X privileges on IBM Cloud platform to create a resource

    2. Ensure you have service to service authorization set up between IBM Cloud

    Databases and IBM Key Protect, directions for granting this access can be found

    here

    3. Be sure to replace SERVICE_INSTANCE_NAME and KEY PROTECT KEY CRN

    with a new service instance name and your desired Key Protect key CRN

    respectively before running this command. For more information, please view our

    documentation.

    ibmcloud resource service-instance-create SERVICE_INSTANCE_NAME databasesfor-postgresql standard us-south -p ''{"backup_id":"xyz-initalbackup","disk_encryption_key_crn":"DISK_ENCRYPTION_KEY_CRN"}''

    4. This will create a new database instance from backup with the requested

    customer managed encryption key.'
