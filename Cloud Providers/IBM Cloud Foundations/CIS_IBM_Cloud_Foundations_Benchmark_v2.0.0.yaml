- id: 2.2.1.1
  title: Ensure IBM Cloud® Block Storage for Virtual Private Cloud is encrypted with BYOK
  scoring: manual
  profile:
  - Level 2
  description: By default, IBM Cloud® Block Storage for Virtual Private Cloud provides providermanaged encryption for all
    data. For enhanced security, customers can bring their own encryption keys and manage them through IBM Key Management
    Service – Key Protect. The customer can choose to use BYOK instead of provider-managed keys for enhanced security.
  rationale: When it comes to encryption of data at rest in IBM Cloud, the best practice is to allow customers to manage customer
    root keys(CRK) that are used to protect customer data stored in data and storage services in IBM Cloud. Bring your Own
    Key(BYOK) allows customers to ensure no one outside of their organization has access to the root key and with the support
    of BYOK, customers can manage the lifecycle of their customer root keys where they can create, rotate, delete those keys.
    This provides a significant level of control where those CRKs are managed by the customer, which in turn increases both
    security control as well as meet relevant compliance requirements. These CRKs can be used in turn to protect the data
    encryption keys used to encrypt the data.
  impact: With BYOK managed encryption, the customer manages their own encryption keys through IBM Key Management Service
    – Key Protect. This may create additional administrative overhead.
  references:
  - 1. https://cloud.ibm.com/docs/vpc?topic=vpc-block-storage-vpcencryption&interface=ui
  page_start: 85
  audit_raw: 'You can use the IBM® Cloud Block Storage for Virtual Private Cloud configuration

    properties to verify whether a block volume is enabled to use Key Protect. From

    Console, Navigate to your block volume resource:

    1. In the IBM Cloud console, go to the Menu icon, VPC Infrastructure, Storage,

    Block storage volumes. A list of all block storage volumes displays.

    2. For each of the volumes listed, ensure the encryption field specifies Key

    Protect.'
  remediation: 'You will not be able to add Key Protect as the key management service once data is

    already written to a Cloud Block Storage Volume. In order to ensure that the data is

    encrypted using Key Protect keys you will need to create a new Cloud Block Storage

    volume, set it to use Key Protect key management service and then upload/copy the

    existing data to this new volume.'
  checks:
  - type: manual_review
    info: 'You can use the IBM® Cloud Block Storage for Virtual Private Cloud configuration

      properties to verify whether a block volume is enabled to use Key Protect. From

      Console, Navigate to your block volume resource:

      1. In the IBM Cloud console, go to the Menu icon, VPC Infrastructure, Storage,

      Block storage volumes. A list of all block storage volumes displays.

      2. For each of the volumes listed, ensure the encryption field specifies Key

      Protect.'
    severity: medium
