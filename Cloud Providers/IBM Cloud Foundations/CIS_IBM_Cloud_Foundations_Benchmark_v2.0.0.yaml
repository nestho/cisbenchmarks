- id: '3.5'
  title: Ensure the account owner can login only from a list of authorized countries/IP ranges
  scoring: manual
  profile:
  - Level 1
  description: Monitor the account owner's access to the IBM Cloud account is done from authorized locations that are restricted
    by IP addresses.
  rationale: By default, a user can log in from any IP address. In IBM Cloud, you can restrict a user to log in only from
    specific IP addresses. Therefore, you can define for the account owner the list of IP addresses that are allowed. Other
    IP addresses will be restricted. This configuration feature per user allows you to restrict access from controlled locations
    and adds an additional level of security into your IBM Cloud account. When a user such as the account owner logs in, information
    about its IP address is included in the Activity Tracker security event. You can monitor and be notified when this event
    is generated in the account. You can obtain in the security event information about unauthorized location.
  impact: Failure to meet this recommendation limits your ability to control that the account manager can only access and
    operate in the account from locations that are authorized and allowed by your organization.
  references:
  - '1. Monitoring context-based restrictions:'
  - https://cloud.ibm.com/docs/account?topic=account-cbr-monitor
  - '2. IBM Cloud Logs: Create an alert: https://cloud.ibm.com/docs/cloudlogs?topic=cloud-logs-alerts-config'
  page_start: 132
  audit_raw: 'Complete the following steps to check if you monitor the locations from which the

    account owner logs in to the account:

    First, you need to identify the email of the account owner.

    1. In the Cloud UI, go to Manage, Access (IAM), then select Users.

    2. Identify the user that has the tag owner.

    3. Select the account owner. Then, click Details.

    4. Copy the email address of the account owner.

    Second, launch the IBM Cloud Logs instance in the region where Frankfurt and ''global''

    events are routed. This is the instance where login security events are collected in the

    account.

    In the All Views section, look for a view that monitors the account owner login

    attempts. The search query should be set to: (action login) AND

    initiator.name:<email address> AND -initiator.host.address:(<list of

    IP addresses>), where is the account owner email address, and <list of IP

    addresses> is the list of authorized IP addresses that are separated by OR, for example,

    (xxx.xxx.xxx.xxx OR xxx.xxx.xxx.xxx).

    Then, check that at least one alert has been configured for audit events that deviate

    from the expected source IPs.

    Additionally, context-based restrictions protect your resources by denying access to

    identities that don''t satisfy context requirements, such as making access requests from

    the network zones and endpoint types that you define. You can enable context-based

    restrictions upon creation, or choose to set the rule to report-only mode. Use IBM Cloud

    Logs to monitor enabled rules and report-only rules to view how the rule affects your

    users, applications, and workflows without enforcing the rule.

    Complete the following steps to check if you monitor for context-based restrictions

    violations that occur in report-only mode:

    1. In the IBM Cloud console, go to the Navigation Menu icon, Observability,

    Logging, Instances, Cloud Logs.

    2. Click Open dashboard on the dashboard that you use to monitor context-based

    restrictions.

    3. Use the search field to narrow the results to report-only context-based

    restrictions events.

    • To view potentially blocked access requests, search for action:contextbased-restrictions.policy.eval responseData.isEnforced:==false

    responseData.decision:Deny.

    • isEnforced:==false indicates that the rule is in report-only mode.

    • responseData.decision:Deny indicates that, if you enable the rule, this access

    request is blocked.

    4. Check that at least one alert has been configured for audit events that detect

    high volumes of context-based restriction violations that are not being enforced.

    5. Check that an alert is configured to trigger on any/all context-based restriction

    violations that are not being enforced which occur for the email address of the

    Account Owner.'
  remediation: 'Complete the following steps to monitor the locations from which the account owner

    logs in to the account:

    First, you need to identify the email of the account owner.

    1. In the Cloud UI, go to Manage, Access (IAM), then select Users.

    2. Identify the user that has the tag owner.

    3. Select the account owner. Then, click Details.

    4. Copy the email address of the account owner and the list of authorized IP

    addresses.

    5. Launch the IBM Cloud Logs instance in the region where Frankfurt and global

    events are routed. This is the instance where login security events are collected

    in the account.

    6. Create an alert based on any deviations where the Account Owner logs in from

    an unauthorized IP address. For example, use the following query: (action

    login) AND initiator.name:<email address> AND -

