- id: 8.1.1.3
  title: Ensure all data stores are encrypted in the IBM Cloud®
  scoring: manual
  profile:
  - Level 1
  description: When you provision any data services in the IBM Cloud, such as Cloud Object Storage, Databases such as PostGreSQL,
    MongoDB, database for ElasticSearch, ETCD, backups created for any data store, and data volumes for compute etc., you
    want to encrypt the data-at-rest with your root key that you created in Key Protect key management service. You can use
    Bring Your Own Key (CRK) or provider key to enable encryption of your data-at-rest in data store associated with any of
    the services in the IBM Cloud that is integrated with the Key Protect Service. You can use the IBM Cloud Secrets Manager
    service dashboard to set the renewable period for the certificates that you manage in the Secrets Manager service. Private
    certificates generated through Secrets Manger are rotated by replacing existing certificate value with new certificate
    version. Public certificates generated in Secrets Manager are moved to Active, Rotation Pending status to indicate that
    the request to renew the certificate is being processed. Secrets Manager does DNS validation to verify that you own the
    domain listed in the certificate, if succeeded, Secrets Manager gets a new certificate and status changes back to Active.
    if validation failed, the status of the certificate changes to Active, Rotation failed.
  rationale: By encrypting your data with your own root key or service provided root key, you are protecting your data from
    unwanted access to your data. Even if the data is accessed, attacker cannot view the data as the encryption key is not
    stored with the data Cloud applications and services running on the platform might use certificate for different purposes
    - TLS or mTLS, client/server authentication and more. Ensuring your certificates are stored securely, and renewed before
    they expired is crucial to maintaining high security posture.
  impact: Once you provide your root key (CRK) to the IBM Cloud Service where your data is stored, the service will use your
    root key to decrypt the Data Encryption Key, that is used to encrypt your data by the service, when you access your data.
    You need to have the required role to do this operation. Without proper Certificate Management practices in place organization
    risk to be vulnerable to impersonation attacks in case certificates used for authentication will be leaked and service
    outages in case certificates are not renewed on time.
  references:
  - 1. https://cloud.ibm.com/docs/solution-tutorials?topic=solution-tutorials-cloud-e2esecurity
  - 2. https://cloud.ibm.com/docs/key-protect?topic=key-protect-integrate-services
