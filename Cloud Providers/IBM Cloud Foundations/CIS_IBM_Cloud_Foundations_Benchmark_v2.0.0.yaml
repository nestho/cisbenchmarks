  title: Ensure Inactive User Accounts are Suspend
  scoring: manual
  profile:
  - Level 1
  description: Revoke access privileges for users in an IBM Cloud account that are inactive, typically defined as user accounts
    with no logins in a given time frame.
  rationale: Users and other identities can become inactive for a number of reasons, for example, vacation, parental leave,
    new roles within the company, or sick leave for user identities. If an identity's access needs to be temporarily revoked,
    you can suspend the user in the account to prevent access.
  impact: After a user’s status is updated to Suspended, the user is unable to gain access to any IBM Cloud resources.
  references:
  - 1. https://cloud.ibm.com/status
  - 2. https://cloud.ibm.com/apidocs/user-management#get-user-profile
