  rationale: As a security officer, auditor, or manager, you can use the IBM Cloud Activity Tracker with IBM Cloud Logs service
    to track how users and applications interact with IBM Cloud Identity and Access Management (IAM). You can use this service
    to investigate abnormal activity and critical actions and comply with regulatory audit requirements.
  impact: 'Activity Tracker with IBM Cloud Logs allows you to track the following IAM events: • Managing access groups by
    creating and deleting groups or adding and removing users • Creating, updating, or deleting service IDs • Creating, updating,
    or deleting API keys • Creating, updating, or deleting access policies • Logging in to IBM Cloud by using an API key,
    authorization code, passcode, password, or an API key that is associated with a service ID'
