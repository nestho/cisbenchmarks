- id: 7.1.3
  title: Ensure IBM Cloud Kubernetes Service worker nodes are updated to the latest image to ensure patching of vulnerabilities
  scoring: scored
  profile:
  - Level 1
  description: Update the worker nodes in a cluster to the latest patch version so that security fixes are applied to those
    worker nodes.
  rationale: 'As security updates and patches are put in place for the API server and other master components, you must be
    sure that the worker nodes remain in sync. You can make two types of updates: updating only the patch version, or updating
    the major.minor version with the patch version. This benchmark is only in relation to updating the patch version, not
    the major or minor versions. Updating the patch version in a timely manner ensures patching of known vulnerabilities and
    will keep your worker nodes more secure.'
  impact: The worker node update also updates the worker node to the same major.minor version as the master if a major.minor
    update is also available.
  references:
  - 1. https://cloud.ibm.com/docs/containers?topic=containersupdate#vpc_worker_node
  - 2. https://cloud.ibm.com/docs/containers?topic=containerscs_versions#update_types
  page_start: 181
  audit_raw: 'From Console:

    1. Log in to the IBM Cloud console.

    2. To view a list of your resources, go to Menu > Resource List.

    3. From your IBM Cloud resource list, select your cluster.

    4. Select the Worker Nodes tab.

    5. For each listed worker node, ensure that next to the Version no information icon is

    present indicating that an update is available. If there is an information icon

    indicating there is an update available, then the worker node is not running the

    latest available image.

    From Command Line:

    1. List the clusters in your IBM Cloud account

    ibmcloud ks cluster ls

    181 | P a g e

    2. List the workers for a given cluster.

    ibmcloud ks workers -c <cluster_name_or_ID>

    3. Ensure that next to the version for a worker node no asterisk (*) is present

    indicating that an update is available.

    a. Here is an example output that shows that there is an available update for a

    worker node

    ibmcloud ks workers -c mykubecluster-free

    OK

    ID Public IP

    Private IP Flavor State Status Zone Version

    kube-btdsgk5d0t1lpluh7f40-mykubeclust-default-000000d1 173.193.100.98

    10.76.216.200 free normal Ready hou02 1.17.11_1538*

    * To update to 1.17.12_1541 version, run ''ibmcloud ks worker update''. Review

    and make any required version changes before you update:

    ''https://ibm.biz/upworker''

    b. Here is an example output showing there are no available updates for a

    worker node

    ibmcloud ks workers -c mykubecluster-free

    OK

    ID Public IP

    Private IP Flavor State Status Zone Version

    kube-btdsgk5d0t1lpluh7f40-mykubeclust-default-000000d1 173.193.100.98

    10.76.216.200 free normal Ready hou02 1.17.12_1541'
  remediation: 'From Console:

    1. Log in to the IBM Cloud console.

    2. Optional: Add capacity to your cluster by resizing the worker pool. The pods on the

    worker node can be rescheduled and continue running on the added worker nodes

    during the update.

    3. To view a list of your resources, go to Menu > Resource List.

    4. From your IBM Cloud resource list, select your cluster.

    5. Select the Worker Nodes tab.

    6. Select the checkbox for each worker node that you want to update. An action bar is

    displayed over the table header row.

    7. From the action bar, click Update.

    From Command Line:

    1. Complete the prerequisite steps.

    182 | P a g e

    2. Optional: Add capacity to your cluster by resizing the worker pool. The pods on the

    worker node can be rescheduled and continue running on the added worker nodes

    during the update.

    3. List the worker nodes in your cluster and note the ID and Primary IP of the worker

