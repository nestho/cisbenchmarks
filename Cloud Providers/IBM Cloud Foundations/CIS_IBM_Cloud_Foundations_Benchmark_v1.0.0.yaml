- id: '3.6'
  title: Ensure Activity Tracker data is encrypted at rest
  scoring: manual
  profile:
  - Level 1
  description: Ensure Activity Tracker data is encrypted at rest.
  rationale: 'LogDNA uses encrypted storage for all its rest data. Customers can elect to archive the Activity Tracker data
    to an IBM Cloud Object Storage (COS) bucket for long-term storage. By default, all objects that are stored in COS are
    encrypted by using randomly generated keys and an all-or-nothing-transform (AONT). Cloud Object Storage further supports
    additional key management scenarios to encrypt your data. This encryption model is called customer-managed encryption:
    1. You can manage your keys manually by providing your own encryption keys - referred to as Server-Side Encryption with
    Customer-Provided Keys (SSE-C). 2. You can choose to use the integration capabilities with IBM Cloud® Key Management Services
    like IBM® Key Protect and Hyper Protect Crypto Services.'
  impact: Failure to adopt a customer-managed encryption model for audit data that is archived for long-term storage can breach
    infrastructure compliance where you are required to use your keys for encrypting data that you manage.
  references:
  - '1. IBM Cloud Object Storage: https://cloud.ibm.com/docs/cloud-objectstorage?topic=cloud-object-storage-getting-started'
  - '2. IBM Cloud Object Storage managing encryption: https://cloud.ibm.com/docs/cloudobject-storage?topic=cloud-object-storage-encryption'
  page_start: 116
  audit_raw: '1. Ensure that you need long-term storage of your audit data.

    2. Ensure that archiving is enabled on each of the Activity Tracker instances in your

    account.

    3. If archiving is enabled, ensure that you have access to storage, for example, check

    that you have an instance of the IBM Cloud Object Storage service provisioned in

    your account.

    4. Ensure that you have multiple COS buckets available to archive your data. Check the

    bucket configuration to verify that it meets your corporate and external market

    regulations.

    Consider using a bucket for each audit instance so that you can customize the bucket

    to meet security requirements. These requirements might be related to the type of

    116 | P a g e

    data that is archived and to external regulations like EU-managed requirements, for

    example.

    5. Ensure that the CIS control Ensure that archiving is enabled for audit

    events is met.'
  remediation: 'If you need long-term storage of your audit data and you do not have Cloud Object Storage

    configured to archive the data from your Activity Tracker instances, complete the following

    steps:

    1. If the option to configure archiving is not allowed, upgrade the instance’s service

    plan.

    2. If archiving is not enabled for an instance, review and define the archiving strategy.

    Then, configure archiving for an audit instance.

    3. If you cannot find an instance of IBM Cloud Object Storage (COS) in your account,

    provision one.

    4. If you have a bucket that does not have full control over the data encryption keys,

    configure one of the supported options. IBM® Cloud Object Storage provides

    several options to encrypt your data.'
