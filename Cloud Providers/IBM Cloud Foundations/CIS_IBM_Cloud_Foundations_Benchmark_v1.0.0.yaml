- id: '1.10'
  title: Ensure contact email is valid
  scoring: manual
  profile:
  - Level 1
  description: In order to receive emails and account alerts related to an IBM Cloud account, a valid email address should
    always be on record with IBM Cloud. If you lose access to an email address, you should update your email address on record
    to ensure continuity of correspondence.
  rationale: Maintaining a valid email address on record is important to make sure you receive important account related information.
  impact: Maintaining a valid email address on record allows you to receive correspondence from IBM Cloud about your account.
  references:
  - 1. https://cloud.ibm.com/docs/account?topic=account-usersettings
  page_start: 32
  audit_raw: 'Console:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. Click Avatar icon > Profile.

    3. Verify the Email field in the Contact information section contains your correct email

    address.'
