controls:
- id: '1.1'
  title: Monitor account owner for frequent, unexpected, or unauthorized logins
  scoring: manual
  profile:
  - Level 1
  description: Monitor login activity of the account owner to prevent unauthorized usage of the privileged account.
  rationale: 'The owner of an IBM Cloud account by default has administrative privileges across the account. To prevent unauthorized
    or unintended usage, login credentials should never be shared and users in an organization should be granted least privilege
    to complete their required tasks. To manage the account, administrators are granted permissions to manage services and
    Cloud resources. Therefore, access by the account owner to the account to run tasks should be minimum. By controlling
    the number of times that the account owner logs in to the account, you can:  Monitor owner''s access to the IBM Cloud
    account  Identify abnormal behavior  Enforce that administrators and operators of the services in your Cloud account
    are the ones managing the Cloud resources with their controlled and limited permissions. When a user log in to the account,
    a security login event in generated. The event reports who has logged in successfully in the account. You can use these
    security events to monitor the number of times that the account owner has logged in to the account, and generate an alert
    if the number exceeds a threshold that you set in a period of time that you specify. Monitoring login activity of the
    account owner can help prevent unauthorized or unintended actions taken in the account.'
  impact: ''
  references:
  - 1. https://cloud.ibm.com/docs/Activity-Tracker-with-LogDNA?topic=ActivityTracker-with-LogDNA-at_events_iam
  page_start: 13
  audit_raw: 'Before you can monitor and manage IAM event data with IBM Cloud Activity Tracker with

    LogDNA, you must provision an instance of the service in IBM Cloud in the Frankfurt (eu-

    13 | P a g e

    de) region.

    To provision an IBM Cloud Activity Tracker with LogDNA instance in a Public Cloud region,

    consider the following information:

     You must select the service plan that is associated with the instance, and the plan

    that determines the retention period for your events.

     You can choose from 7, 14, or 30-day retention periods.

    Alternatively, IBM Cloud Activity Tracker with LogDNA offers a Lite plan that you

    can use to view your events as they pass through the system. You can view events by

    using event tailing. You can also design filters to prepare for upgrading to a longer

    retention period plan. This plan has a 0-day retention period.

    Complete the following steps to launch the Activity Tracker with LogDNA web UI:

    1. Log in to your IBM Cloud account. After you log in with your user ID and password,

    the IBM Cloud dashboard opens.

    2. Click the Menu icon > Observability.

    3. Select Activity Tracker. The list of IBM Cloud Activity Tracker with LogDNA

    instances is displayed.

    4. Select the instance in the region where you want to view events. Then, click View

    LogDNA.

    The IBM Cloud Activity Tracker with LogDNA web UI opens and shows the Everything

    view. Through this view, you can see the events in your account for the region that you

    have selected.

    To ensure the owner of the account has not logged in more than # times the past 24 hours,

    complete the following steps:

    First, you need to identify the email of the account owner.

    1. In the Cloud UI, go to Manage > Access (IAM), then select Users.

    2. Identify the user that has the tag owner.

    3. Select the account owner. Then, click Details.

    4. Copy the email address of the account owner.

    Second, launch the Activity Tracker instance in Frankfurt. This is the instance where login

    security events are collected in the account.

    In the Views section, look for a view that monitors the account owner login attempts. The

    search query should be set to: (action login) AND initiator.name:<email address>,

    where is the account owner''s email address.

    Then, check that the view has configured an alert and 1 or more notification channels.

    14 | P a g e'
  remediation: 'Complete the following steps to monitor how many times an account owner logs in to the

    account:

    First, you need to identify the email of the account owner.

    1. In the Cloud UI, go to Manage > Access (IAM), then select Users.

    2. Identify the user that has the tag owner.

    3. Select the account owner. Then, click Details.

    4. Copy the email address of the account owner.

    Launch the Activity Tracker instance in Frankfurt. This is the instance where login security

    events are collected in the account. In the Views section, select the Everything view. Then,

    enter the following query in the search bar: (action login) AND initiator.name:<email

    address>. Replace with the account owner''s email address.

    The view now reports all the login actions that are reported for the account owner.

    Next, you can define an alert on the view to get a notification when N number of events are

    received within a 24 hour period. The value of N depends on how you operate your cloud.

    You can start with a default value of 25 and increase or decrease depending on the tasks

    that the account administrator cam perform in the account.'
  checks:
  - type: manual_review
    info: 'Before you can monitor and manage IAM event data with IBM Cloud Activity Tracker with

      LogDNA, you must provision an instance of the service in IBM Cloud in the Frankfurt (eu-

      13 | P a g e

      de) region.

      To provision an IBM Cloud Activity Tracker with LogDNA instance in a Public Cloud region,

      consider the following information:

       You must select the service plan that is associated with the instance, and the plan

      that determines the retention period for your events.

       You can choose from 7, 14, or 30'
    severity: medium
- id: '1.2'
  title: Ensure API keys unused for 180 days are detected and optionally disabled
  scoring: manual
  profile:
  - Level 1
  description: Monitor API key usage in your account and search for API keys that are unused or used infrequently.
  rationale: If an API key is unused for long period in your account, it must be disabled (locked) as a security best practice.
    All API keys, even those that are used infrequently, must be rotated periodically.
  impact: To reduce the likelihood of accidental exposure or leaking, monitoring for infrequently used API keys can indicate
    that an API key can be locked and even deleted, if there is no anticipated future usage.
  references:
  - 1. https://cloud.ibm.com/docs/services/Activity-Tracker-withLogDNA?topic=logdnaat-tutorial_iam_apikeys
  - 2. https://cloud.ibm.com/docs/services/Activity-Tracker-withLogDNA?topic=logdnaat-at_events_iam#at_events_iam_apikeys
  page_start: 16
  audit_raw: 'Console:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. Go to the Menu icon. Then, select Observability to access the Observability

    dashboard.

    3. Select Activity Tracker from the page navigation menu

    4. Check for instances of IBM Cloud Activity Tracker with LogDNA

    5. Generate events and configure a view in Activity Tracker with LogDNA, see

    https://cloud.ibm.com/docs/services/Activity-Tracker-withLogDNA?topic=logdnaat-tutorial_iam_apikeys#tutorial_iam_apikeys_step2

    API:N/A'
  remediation: 'You must create an instance of the Activity Tracker with LogDNA service in the Frankfurt

    region to start tracking IAM events. Use a minimum of a 7-day event search.

    16 | P a g e'
  checks:
  - type: sql
    command: select Observability to access the Observability
    severity: medium
    info: 'Console:

      1. Log in to IBM Cloud at https://cloud.ibm.com.

      2. Go to the Menu icon. Then, select Observability to access the Observability

      dashboard.

      3. Select Activity Tracker from the page navigation menu

      4. Check for instances of IBM Cloud Activity Tracker with LogDNA

      5. Generate events and configure a view in Activity Tracker with LogDNA, see

      https://cloud.ibm.com/docs/services/Activity-Tracker-'
- id: '1.3'
  title: Ensure API keys are rotated every 90 days
  scoring: manual
  profile:
  - Level 1
  description: Replace production API keys with new API keys regularly, every 90 days for example, as a best practice to secure
    your account.
  rationale: API key rotation can help reduce the impact to your organization if an API key becomes exposed or compromised.
    If you suspect that a key might have been leaked or compromised, the key must be rotated out of production and deleted.
  impact: Any resource that is using an API key that has been rotated out of production will encounter errors until the API
    key has been updated.
  references:
  - 1. https://cloud.ibm.com/docs/iam?topic=iam-userapikey
  page_start: 18
  audit_raw: 'Console:

    To find out when an API key was created, complete the following steps:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. From the Menu bar, click Manage > Access(IAM) > API keys.

    3. Identify an API key and from the Actions menu, select Details.

    4. View the date the API key was created.

    API:N/A'
  remediation: 'To create new API key, complete the following steps:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. From the Menu bar, click Manage > Access (IAM) > API keys.

    3. Click Create an IBM Cloud API key.

    To rotate an API key, replace an old API key anywhere it is used with the newly

    created API key.

    Delete an old API key:

    18 | P a g e

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. From the Menu bar, click Manage > Access (IAM) > API keys.

    3. Identify the API key you want to delete, and from the Actions menu, select Delete.'
  checks:
  - type: manual_review
    info: 'Console:

      To find out when an API key was created, complete the following steps:

      1. Log in to IBM Cloud at https://cloud.ibm.com.

      2. From the Menu bar, click Manage > Access(IAM) > API keys.

      3. Identify an API key and from the Actions menu, select Details.

      4. View the date the API key was created.

      API:N/A'
    severity: medium
- id: '1.4'
  title: Restrict user API key creation and service ID creation in the account via IAM roles
  scoring: manual
  profile:
  - Level 1
  description: Use IAM settings to restrict user API key creation and service ID (and related API key) creation in the account.
    Enable both settings to restrict all users in the account from creating user API keys and service IDs except those with
    an IAM policy that explicitly allows it.
  rationale: API keys allow access to an IBM Cloud account. The API key inherits all assigned access for the user or service
    identity for which it is created, and the access is not limited to just the account where the API key is created because
    it inherits any policies assigned to the user. So, if the identity has access to resources from multiple accounts, then
    the API key inherits the access from all accounts. Therefore, it is possible that a user's API key can be used to generate
    a token and access resources that a user has access to outside of the account where the API key was created. In order
    to prevent the creation of unauthorized API keys and service IDs, it is recommended that only users with a need for this
    action be given the privilege to do so.
  impact: This process involves two IAM controls. Enabling the restriction of user API keys will prevent users in an account
    from creating user API keys, except those with an explicit IAM policy to do so. Enabling the restriction of service ID
    creation will prevent users in an account from creating service IDs, except those with an explicit IAM policy to do so.
  references:
  - 1. https://cloud.ibm.com/docs/Activity-Tracker-with-LogDNA?topic=ActivityTracker-with-LogDNA-at_events_iam#at_events_iam_apikeys
  - 2. https://cloud.ibm.com/docs/account?topic=account-userapikey
  page_start: 20
  audit_raw: '1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. Click Manage -> Access (IAM).

    3. Click Settings.

    4. In the Account section of the Settings page, ensure that Restrict API key creation and

    Restrict service ID creation are enabled.

    20 | P a g e'
  remediation: '1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. Click Manage -> Access (IAM).

    3. Click Settings.

    4. In the Account section of the Settings page, ensure that Restrict API key creation and

    Restrict service ID creation are enabled.

    5. Once enabled, only users with the correct IAM policies will be able to create user API

    keys and service IDs.'
  checks:
  - type: manual_review
    info: '1. Log in to IBM Cloud at https://cloud.ibm.com.

      2. Click Manage -> Access (IAM).

      3. Click Settings.

      4. In the Account section of the Settings page, ensure that Restrict API key creation and

      Restrict service ID creation are enabled.

      20 | P a g e'
    severity: medium
- id: '1.5'
  title: Ensure no owner account API key exists
  scoring: manual
  profile:
  - Level 1
  description: API keys by definition allow access to your account and resources in your account. The API key inherits all
    assigned access for the user identity for which it is created, therefore an API key created by an account owner has account-owner
    level access to resources in the account.
  rationale: In accordance with the practice of granting least privilege, API keys should not be created by an account owner
    because of the level of privilege automatically granted to accountowner created API keys.
  impact: The API key inherits all assigned access for the user identity for which it is created, therefore an API key created
    by an account owner has account-owner level access to resources in the account.
  references:
  - 1. https://cloud.ibm.com/docs/account?topic=account-userapikey
  page_start: 22
  audit_raw: 'To check for the existence of an API key created by the account owner, complete the

    following steps.

    1. Login as the account owner at cloud.ibm.com

    2. Click Manage -> Access (IAM)

    3. Click API keys

    4. Check for any API keys that appear under the "My IBM Cloud API keys" view'
  remediation: 'To delete an API key, complete the following steps:

    1. Login as the account owner at cloud.ibm.com

    2. In the console, go to Manage -> Access (IAM)

    3. Click on API keys

    4. Identify the row of the API key that you want to delete and select Delete from the

    Actions List of actions icon menu (found on the right hand side of the row).

    22 | P a g e

    5. Then, confirm the deletion by clicking Delete.'
  checks:
  - type: manual_review
    info: 'To check for the existence of an API key created by the account owner, complete the

      following steps.

      1. Login as the account owner at cloud.ibm.com

      2. Click Manage -> Access (IAM)

      3. Click API keys

      4. Check for any API keys that appear under the "My IBM Cloud API keys" view'
    severity: medium
- id: '1.6'
  title: Ensure compliance with IBM Cloud password requirements
  scoring: manual
  profile:
  - Level 1
  description: 'A strong password is a very important step towards account security and safety. Passwords should never be
    shared with anyone, and must follow the strong password requirements as follow.  Password must contain at least one uppercase
    letter  Password must contain at least one lowercase letter  Password must contain at least one number  Password must
    contain at least 8 characters  Passwords should not be reused  Password must only contain ASCII characters  Password
    cannot contain: spaces, or any of these characters- `;:{"?)<>  Ensure the usage of a password meter which coaches user
    to create a stronger password than the minimum'
  rationale: A strong password can help prevent unauthorized access to an IBM Cloud account.
  impact: IBM Cloud automatically prevents the usage of any passwords that do not meet password requirements, when the users
    are created in IBMid system. When enterprises integrate through enterprise federation (using SAML), then enterprise identity
    system is responsible for enforcing password strength.
  references:
  - 1. https://cloud.ibm.com/docs/account?topic=account-ts_logintoibm
  page_start: 24
  audit_raw: 'IBM Cloud automatically prevents the usage of passwords that do not meet password

    requirements, when the users are created in IBMid system. When enterprises integrate

    through enterprise federation (using SAML), then enterprise identity system is responsible

    for enforcing password strength.'
  remediation: 'IBM Cloud automatically prevents the usage of any passwords that do not meet password

    requirements, when the users are created in IBMid system. When enterprises integrate

    24 | P a g e

    through enterprise federation (using SAML), then enterprise identity system is responsible

    for enforcing password strength.'
  checks:
  - type: manual_review
    info: 'IBM Cloud automatically prevents the usage of passwords that do not meet password

      requirements, when the users are created in IBMid system. When enterprises integrate

      through enterprise federation (using SAML), then enterprise identity system is responsible

