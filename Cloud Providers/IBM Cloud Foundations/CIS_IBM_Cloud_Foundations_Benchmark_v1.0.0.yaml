- id: '1.12'
  title: Ensure IAM users are members of access groups and IAM policies are assigned only to access groups
  scoring: manual
  profile:
  - Level 1
  description: Simplify and secure the access management process by using access groups when you assign access to groups of
    users with identical access needs.
  rationale: You can create an access group so that you can organize a set of users and service IDs into a single entity that
    makes it easy for you to assign access. You can assign a single policy to the group instead of assigning the same access
    multiple times for each individual user or service ID.
  impact: Using access groups reduces the number of policies that must be created and managed in the account and simplifies
    the process of adding new users or service IDs or modifying user and service IDs access.
  references:
  - 1. https://cloud.ibm.com/docs/iam?topic=iam-groups#groups
  page_start: 36
  audit_raw: 'Console:

    Audit user access policies:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. From the Menubar, click Manage > Access (IAM).

    3. Click Users and select a user by clicking on the username.

    4. Click Access Policies.

    ***If the user has individual access policies and you wish to remove them, complete

    the following steps.

    5. Locate the row containing the access policy you wish to remove. Click the actions

    icon corresponding to that row and click Remove.

    API:N/A'
  remediation: 'Assign an access policy to an Access Group:

    36 | P a g e

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. From the Menubar, click Manage > Access(IAM).

    3. Click Access Groups.

    4. Click an Access Group name, then click the Access Policies tab

    5. Click Assign access.

    Add members to an Access Group:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. From the Menubar, click Manage > Access(IAM).

    3. Click Access Groups.

    4. Click an Access Group name.

    5. Click Add Users.

    Delete an access policy for a user:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. From the Menubar, click Manage > Access(IAM).

    3. Click Users.

    4. Click on a user name.

    5. Click the Access Policies tab

    6. Locate the row containing the access policy you wish to remove. Click the actions

    icon corresponding to that row and click Remove.'
  checks:
  - type: manual_review
    info: 'Console:

      Audit user access policies:

      1. Log in to IBM Cloud at https://cloud.ibm.com.

      2. From the Menubar, click Manage > Access (IAM).

      3. Click Users and select a user by clicking on the username.

      4. Click Access Policies.

      ***If the user has individual access policies and you wish to remove them, complete

      the following steps.

      5. Locate the row containing the access policy you wish to remove. Click the actions

      icon corresponding to that row and click Remove.

