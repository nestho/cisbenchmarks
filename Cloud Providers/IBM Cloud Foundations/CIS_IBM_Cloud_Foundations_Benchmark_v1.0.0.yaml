- id: '1.14'
  title: Minimize the number of users with admin privileges in the account
  scoring: manual
  profile:
  - Level 1
  description: Comply with the principle of granting least privilege by using Access Groups to manage admin privileges and
    by avoiding the use of broadly scoped access policies.
  rationale: The principle of granting least privilege mandates that a user must only be given access to the resources that
    are required to complete their task. This task can be hard to maintain when managing large numbers of users. Instead of
    assigning administrative privileges to individual users, create Access Groups with administrative privileges and add or
    remove users from these Access Groups as needed. Additionally, instead of using the Platform Administrator role for all
    IAM-enabled services, IBM Cloud users can grant access to specific resources and account management services to better
    comply with the principle of granting least privilege.
  impact: Managing administrative access via Access Groups simplifies the process of adding/removing admin privileges from
    users in the account. Having too many users with Administrative privileges goes against the principle of granting least
    privileges and mean many possible holes for any security attack.
  references:
  - 1. https://cloud.ibm.com/docs/iam?topic=iam-userroles
  page_start: 40
  audit_raw: 'Console:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. From the Menu bar, click Manage > Access(IAM).

