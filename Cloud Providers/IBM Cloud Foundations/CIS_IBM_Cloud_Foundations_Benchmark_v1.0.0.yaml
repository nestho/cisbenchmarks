- id: 7.1.1.1
  title: Ensure Kubernetes secrets data is encrypted with bring your own key (BYOK)
  scoring: manual
  profile:
  - Level 1
  description: IBM® Key Protect for IBM Cloud™ helps you provision encrypted keys for apps across IBM Cloud services. Use
    the IBM Key Protect for IBM Cloud key management service (KMS) to encrypt data in Kubernetes secrets and prevent unauthorized
    users from accessing sensitive app information (for example, credentials and keys). Keys are generated by FIPS 140-2 Level
    3 certified hardware security modules (HSMs) that are located in secure IBM Cloud data centers.
  rationale: You can encrypt data with customer managed keys in Kubernetes secrets to prevent unauthorized users from accessing
    sensitive app information. Using your own encryption root key adds a layer of security to your etcd data and Kubernetes
    secrets and gives you more granular control of who can access sensitive cluster information. When it comes to encryption
    of data at rest in IBM Cloud, we recommend for customers to manage customer root keys (CRK) that are used to protect customer
    data stored in data and storage services in IBM Cloud. With the support of Bring Your Own Key (BYOK), customers can manage
    lifecycle of their customer root keys where they can create, rotate, delete those keys. This provides a significant level
    of control where those CRKs are managed by the customer, which in turn increases both security control as well as meet
    relevant compliance requirements. These CRKs are used in turn to protect the data encryption keys (DEK) used to encrypt
    the data.
  impact: You cannot disable KMS provider encryption. Do not delete root keys in your KMS instance, even if you rotate to
    use a new key. If you delete a root key that a cluster uses, the cluster becomes unusable, loses all its data, and cannot
    be recovered. Similarly, if you disable a root key, operations that rely on reading secrets fail. Unlike deleting a root
    key, however, you can reenable a disabled key to make your cluster usable again. 169 | P a g e If you lose your key, you
    will not be able to recover the data. Standard pricing for Key Protect applies.
  references:
  - 1. https://cloud.ibm.com/docs/containers?topic=containers-encryption#keyprotect
  - 2. https://cloud.ibm.com/docs/containers?topic=containers-encryption#kms
  page_start: 169
  audit_raw: '1. Install the etcd CLI (etcdctl) version 3 or later. See https://github.com/etcdio/etcd/releases.

    2. Set your terminal session context to use the appropriate etcdctl API version.

    export ETCDCTL_API=3

    3. Run the ibmcloud ks cluster config command and include the --admin option,

    which downloads the etcd certificates and keys for your cluster, and the --output

    zip > <cluster_name_or_ID>.zip option, which saves your cluster configuration

    files to a compressed folder.

    ibmcloud ks cluster config -c <cluster_name_or_ID> --admin --output zip >

    <cluster_name_or_ID>.zip

    4. Decompress the compressed folder.

    5. Get the server field for your cluster. In the output, copy only the master URL,

    without https:// and the node port.

    cat ./<cluster_name_or_ID>/kube-config.yaml | grep server

    6. Get the etcdPort for your cluster.

    ibmcloud ks cluster get -c <cluster_name_or_ID> --output json | grep etcdPort

    7. Get the name of a secret in your cluster.

    kubectl get secrets [-n <namespace>]

    8. Confirm that the Kubernetes secrets for the cluster are encrypted. Replace the

    secret_name, master_url, and etcd_port fields with the values that you previously

    retrieved, and replace <cluster_name_or_ID> with the name of the cluster in your

    compressed folder file path.

    etcdctl get /registry/secrets/<secret_namespace>/<secret_name> --endpoints

    https://<master_url>:<etcd_port> --key="./<cluster_name_or_ID>/admin-key.pem"

    --cert="./<cluster_name_or_ID>/admin.pem" --

    cacert="./<cluster_name_or_ID>/ca.pem"

    9. Ensure the output is unreadable and scrambled, indicating that it is encrypted.'
  remediation: '170 | P a g e

    From Console:

    1. Log in to your IBM Cloud account.

    2. To view the list of services that are available on IBM Cloud, click Catalog.

    3. From the All Categories navigation pane, click the Security and Identity category.

    4. From the list of services, click the Key Protect tile.

    5. Select a service plan, and click Create to provision an instance of Key Protect in the

    account, region, and resource group where you are logged in.

    6. To view a list of your resources, go to Menu > Resource List.

    7. From your IBM Cloud resource list, select your provisioned instance of Key Protect.

    8. To create a new key, click Add key and select the Create a key window. Specify the

    key''s name and key type.

    9. When you are finished filling out the key''s details, click Create key to confirm.

    10. From the Clusters console, select the cluster that you want to enable encryption for.

    11. From the Overview tab, in the Summary > Key management service section, click

    Enable.

    12. Select the Key management service instance and Root key that you want to use

    for the encryption.

    13. Click Enable.

    14. Verify that the KMS enablement process is finished. From the Summary > Master

    status section, you can check the progress.

    15. After the KMS provider is enabled in the cluster, data in etcd and new secrets that

    are created in the cluster are automatically encrypted by using your root key.

    16. To encrypt existing secrets with the root key, rewrite the secrets. This cannot be

    done from the console. See the From Command Line section.

    From Command Line:

    1. Log in to IBM Cloud through the IBM Cloud CLI.

    ibmcloud login [--sso]

    2. Select the region and resource group where you want to create a Key Protect

    instance.

    ibmcloud target -r <region_name> -g <resource_group_name>

    3. Provision a public or private Key Protect instance.

    ibmcloud resource service-instance-create <instance_name> kms tiered-pricing

    <region> [-p ''{"allowed_network": "private-only"}'']

    4. Create a customer root key (CRK) in your KMS instance. You can''t use the CLI for

    this action; you must use the GUI or API. See the above From Console section.

    5. Get the ID of the KMS instance that you previously created.

    171 | P a g e

    ibmcloud ks kms instance ls

    6. Get the ID of the root key that you previously created.

    ibmcloud ks kms crk ls --instance-id <KMS_instance_ID>

    7. Enable the KMS provider to encrypt secrets in your cluster. Fill in the options with

    the information that you previously retrieved. The KMS provider''s private service

    endpoint is used by default to download the encryption keys. To use the public

    service endpoint instead, include the --public-endpoint option. The enablement

    process can take some time to complete.

    ibmcloud ks kms enable -c <cluster_name_or_ID> --instance-id

    <kms_instance_ID> --crk <root_key_ID> [--public-endpoint]

    8. Verify that the KMS enablement process is finished. The process is finished when

    the Master Status is Ready.

    9. After the KMS provider is enabled in the cluster, data in etcd and new secrets that

    are created in the cluster are automatically encrypted by using your root key.

    10. Set the context for your cluster.

    ibmcloud ks cluster config -c <cluster_name_or_ID>

    11. With cluster-admin access, rewrite the secrets to encrypt them.

    kubectl get secrets --all-namespaces -o json | kubectl replace -f -'
