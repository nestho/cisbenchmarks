- id: '3.7'
  title: Ensure Activity Tracker trails are integrated with LogDNA Logs
  scoring: manual
  profile:
  - Level 1
  description: Check whether Activity Tracker trails are integrated with LogDNA Logs.
  rationale: IBM Cloud™ Activity Tracker with LogDNA is a Cloud service that you can use to monitor the activity of your IBM
    Cloud account. IBM Log Analysis with LogDNA is a service that you can use to analyze and monitor operational logs. Both
    services offer the same features to manage audit events and logs. However, Activity Tracker trails are not integrated
    with LogDNA Logs.  The data that is collected and processed by the IBM Cloud Activity Tracker with LogDNA service is
    associated with that location and not visible to the other regions by virtue of this association.  The data that is collected
    and processed by the IBM Log Analysis with LogDNA service is associated with that location and not visible to the other
    regions by virtue of this association.  Within a service instance, data is isolated per LogDNA instance within a region.
    The IBM Cloud Activity Tracker with LogDNA service offers soft isolation for data storage. Data is mixed together in the
    same data stores and segmented by tags that are associated with each of the records to enforce access control policies.
    When audit data and logs are archived for long-term storage, archives of your operational logs and auditing events can
    be archived to the same IBM Cloud Object Storage (COS) location.
  impact: Failure to meet this control will prevent you from managing long-term data, logs and audit events, from a common
    location.
  references: []
  page_start: 118
  audit_raw: 'Use the following checklist to ensure Activity Tracker trails are integrated with LogDNA

    Logs:

    118 | P a g e

    1. Ensure that IBM Cloud Activity Tracker with LogDNA instances are provisioned with

    a service plan that includes the ability to configure archiving to an external storage

    service.

    2. Ensure that IBM Log Analysis with LogDNA instances are provisioned with a service

    plan that includes the ability to configure archiving to an external storage service.

    3. Ensure that you have access to storage, for example, check that you have an instance

    of the IBM Cloud Object Storage service provisioned in your account.

    4. Ensure that you have 1 COS bucket available to archive your data. Check the bucket

    configuration to verify that it meets your corporate and external market regulations.

    5. Ensure that each audit instance has archiving enabled and configured to the bucket

    identified in step 4.

    6. Ensure that each logging instance has archiving enabled and configured to the

    bucket identified in step 4.

    To check if audit and logging instances are provisioned and configured in the account,

    complete the following steps:

    Note: To complete these steps, your IBM Cloud user ID (IBMid) must have the following

    roles:

     A platform role with viewer role for the IBM Cloud Activity Tracker with LogDNA

    service and the IBM Log Analysis with LogDNA service for the account

     A service role with reader role for the IBM Cloud Activity Tracker with LogDNA

    service and the IBM Log Analysis with LogDNA service for the account

     A platform role with viewer role for the IBM Cloud Object Storage service for the

    account

     Identity and Access Management (IAM) permissions to view access groups in the

    account

    UI instructions:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. Go to the Menu icon. Then, select Observability to access the Observability

    dashboard.

    3. Select Activity Tracker from the page navigation menu to see the auditing

    instances. Select Logging from the page navigation menu to see the logging

    instances.

    4. Check that you can see an Activity Tracker instance in Frankfurt and one instance

    for each location where you operate in the IBM Cloud.

    5. To launch the LogDNA web UI, for each instance, select View LogDNA.

    6. In the LogDNA web UI, verify that you can see audit events.

    7. Identify the LogDNA instance ID in the LogDNA URL. This ID is used as part of the

    name of the archive file.

    119 | P a g e

    CLI instructions:

    1. Log in to IBM Cloud.

    Run the following command:

    ibmcloud login -a cloud.ibm.com

    For a federated account, run the following command:

    ibmcloud login -a cloud.ibm.com --sso

    2. List all the audit instances that are provisioned in your account.

    Run the following command:

    ibmcloud resource service-instances --service-name logdnaat --allresource-groups

    List all the logging instances that are provisioned in your account. Run the following

    command:

    ibmcloud resource service-instances --service-name logdna --allresource-groups

    3. For Activity Tracker, check that you have one instance in Frankfurt, and one

    instance for each location where you operate in the IBM Cloud.

    4. Get the LogDNA instance ID. This value is used as part of the archive file name. Run

    the following command:

    ibmcloud resource service-instance INSTANCE_NAME --output JSON | grep

    dashboard_url

    To check the COS instance and bucket in the account where logs and events are archived,

    complete the following steps:

    1. Identify the CRN of the COS instance where archived data must be located.

    Run the following command to get the list of instances that are available in the

    account and their CRNs:

    ibmcloud resource service-instances --type service_instance --servicename cloud-object-storage --all-resource-groups --output
    JSON

    2. Identify the bucket.

    Run the following command to list all the buckets that are available in the COS

    instance:

    ic cos list-buckets --ibm-service-instance-id <INSTANCE-CRN>

    3. For each LogDNA instance, identify the corresponding archive files for that instance.

    Run the following command:

    ic cos list-objects --bucket <BUCKET-NAME> --region <REGION-NAME>

    Note: You must see archive files that include the LogDNA instance ID. If you cannot

    see any files for that instance, then that instance is not being archived to the bucket.

    To verify that archiving is enabled in a LogDNA instance, complete the following steps:

    Note: To complete these steps, your IBM Cloud user ID (IBMid) needs the following roles in

    addition to the ones specified earlier:

     A platform role with operator role for the IBM Cloud Object Storage service for the

    account

    120 | P a g e

     A service role with manager role for the IBM Cloud Activity Tracker with LogDNA

    service and the IBM Log Analysis with LogDNA service for the account, so that you

