- id: '3.2'
  title: Ensure that archiving is enabled for audit events
  scoring: manual
  profile:
  - Level 2
  description: Archive events for long-term storage so that you have access to data for a longer period of time, you can comply
    with highly regulated environments, you can recover quickly in the eventuality of a disaster scenario, and you can adhere
    to internal data storage policies.
  rationale: 'When you provision an instance of IBM Cloud Activity Tracker with LogDNA, you associate a service plan that
    defines the number of days that data is available for search, troubleshooting, and analysis. In specific scenarios, the
    maximum number of days that data is available for search (30 days) is not sufficient and requires a long-term data storage
    solution. For example, highly regulated environments impose strict storage policies where they define the minimum number
    of days that log data must be saved for. Internal corporate regulations can also impose data storage policies. You might
    be affected by a natural disaster and you must recover fast. In any of these sample scenarios, you must implement an archiving
    solution that allows you to keep data for long-term storage. Data that is managed by the IBM Cloud Activity Tracker with
    LogDNA service is encrypted at rest. Data that is archived to a bucket that is hosted in IBM Cloud Object Storage is encrypted
    by default using randomly generated keys and an all-or-nothing-transform. While this IBM Cloud Object Storage default
    encryption model provides at-rest security, some workloads need to be in possession of the encryption keys used. You can
    manage your keys manually by providing your own encryption keys - referred to as Server-Side Encryption with Customer-Provided
    Keys (SSE-C). With IBM Cloud Object Storage, you also have a choice to use IBM''s integration capabilities with IBM Cloud
    Key Management Services like IBM Key Protect and Hyper Protect Crypto Services. Depending on the security requirements,
    you can decide whether to use IBM Key Protect or IBM Hyper Protect Crypto Services for your IBM Cloud Object Storage buckets.
     IBM Key Protect for IBM Cloud helps you provision encrypted keys for apps across IBM Cloud services. As you manage the
    lifecycle of your keys, you can benefit from knowing that your keys are secured by FIPS 140-2 Level 3 certified cloud-based
    hardware security modules (HSMs) that protect against the theft of information. 93 | P a g e  Hyper Protect Crypto Services
    is a single-tenant, dedicated HSM that is controlled by you. The service is built on FIPS 140-2 Level 4-certified hardware,
    the highest offered by any cloud provider in the industry. If you use IBM Cloud Activity Tracker with LogDNA, you can
    archive data that is available through an audit instance to an IBM Cloud Object Storage bucket, for example. You can configure
    the bucket to meet all your internal and external regulations. There are two types of data that you must consider archiving:
    events, and service instance metadata, such as views, templates, screens, and alerts. As guidance, events must be kept
    for as long as internal compliance requires. If no requirements exist, consider a minimum of 365 days.'
  impact: If you have regulatory or organizational requirements that determine the number of days that data must be available,
    failure to meet this control can result in breaching compliance. In addition, if data is corrupted or not archived, and
    you do not claim it within the number of days that are available for search, you can lose data. If you have requirements
    that define the bucket specification, policies, and encrypting requirements, you might be in breach of infrastructure
    compliance.
  references:
  - '1. IBM Cloud Activity Tracker with LogDNA: Adoption guidelines for regulated and'
  - '2. IBM Cloud Activity Tracker with LogDNA service plans:'
  - https://cloud.ibm.com/docs/Activity-Tracker-with-LogDNA?topic=logdnaatservice_plan
  page_start: 93
  audit_raw: 'Use the following check list to ensure that archiving is configured for each of your audit

    instances:

    1. Ensure that IBM Cloud Activity Tracker with LogDNA instances are provisioned with

    a service plan that includes the ability to configure archiving to an external storage

    service.

    2. Ensure that each audit instance has archiving enabled and configured.

    3. Ensure that you have access to storage, for example, check that you have an instance

    of the IBM Cloud Object Storage service provisioned in your account.

    Consider using IBM Cloud Object Storage (COS) with IBM Log Analysis with LogDNA.

    Connectivity is done via private endpoints within the IBM Cloud private network,

    making the connection and transfer more secure. This integration reduces latency,

    benefits from IBM Cloud network security, and offers faster archive response times.

    4. Ensure that you have multiple COS buckets available to archive your data. Check the

    bucket configuration to verify that it meets your corporate and external market

    regulations.

    Consider using a bucket for each audit instance so that you can customize the bucket

    to meet security requirements. These requirements might be related to the type of

    94 | P a g e

    data that is archived and to external regulations like EU-managed requirements, for

    example.

    5. Ensure that the bucket has the following features enabled:

    o A key management service is configured. For example, check IBM Cloud Key

    Protect is configured so that you can use your own key to encrypt data.

    o Auditing to IBM Cloud Object Storage is enabled and that the options read

    and data events are included for write and read operations.

    o Monitoring with IBM Cloud Monitoring with Sysdig is enabled.

    o Expiration rules that define when archive files are automatically deleted are

    configured. As guidance, events must be kept for as long as internal

    compliance requires. If no requirements exist, consider a rule that keeps files

    for a minimum of 365 days.

    o [Optional] A retention policy is configured so that objects are protected from

    deletion or overwriting for a specified amount of time.

    Note: A retention policy is not supported when Key Protect is enabled.

    o [Optional] An archive policy is configured so that objects that are rarely

    accessed are moved from their default bucket storage class to the archive

    storage class after a certain period.

    6. Ensure that you use different credentials to archive data from your audit instance to

    your bucket.

    o Consider using a service ID for each audit instance to configure the archiving

    of data so that you can manage authentication and authorization permissions

    for each audit instance in your account.

    o A service ID is used by IBM Log Analysis with LogDNA to authenticate and

    access the IBM Cloud Object Storage instance.

    7. Ensure that each service ID has only write permission to the bucket where you plan

    to archive the events.

    8. Ensure that archive files are not corrupted.

    To verify that archiving is configured for an audit instance in your account, complete the

    following steps:

    Repeat these steps for all the audit instances in the account.

    Note: To complete these steps, your IBM Cloud user ID (IBMid) must have the following

    roles:

     A platform role with viewer role for the IBM Cloud Activity Tracker with LogDNA

    service for the account

     A platform role with operator role for the IBM Cloud Object Storage service for the

    account

     A service role with manager role for the IBM Cloud Activity Tracker with LogDNA

    service for the account so that you can verify that archiving is configured

    UI instructions:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    95 | P a g e

    2. Go to the Menu icon. Then, select Observability to access the Observability

    dashboard.

    3. Select Activity Tracker from the page navigation menu

    4. For each audit instance, complete the following steps:

    o Check the service plan is one that includes search days.

    o Check that archiving is configured for each audit instance.

     To launch the LogDNA web UI, select View LogDNA.

     In the LogDNA web UI, select Settings. Then, select Archiving.

     Verify that archiving is configured for the audit instance.

     Check the bucket name.

     Check the endpoint value to make sure that the private

    endpoints are configured. To verify the correct value, you must

    check the bucket configuration in IBM Cloud Object Storage.

     Check the permissions granted to the API key, limit write

    access to the audit instance only. To verify the permissions,

    you must identify the credential (service ID) on which you

    restricted permissions.

     Check that the Cloud Object Storage instance ID is the one

    where data should be archived. You might have different COS

    instances to archive data.

    5. Expand the Navigation Menu and select Resource list. Find the COS instance where

    the bucket that is configured for archiving is available.

    o Open the COS console, and select the bucket.

    o Check the bucket configuration. Check for compatibility of policies and how

    the ones that are configured for a bucket meet your requirements:

     Check that a key management service is configured.

     Check that Activity Tracker is configured.

     Check that monitoring is configured.

     Check each expiration.

     Check the retention policy is configured.

     Check the archive policy is configured.

    o Check that events are archived and the archive files are not corrupted:

     Download a subset of files, preferably with different dates and sizes.

     Open the files and verify that you can read the content.

    6. From the Menu bar, click Manage > Access (IAM).

    7. Check the service ID policies:

    o Select Service IDs.

    o Find the service ID that is configured in the LogDNA instance.

    o To open the Service ID dashboard, select the service ID.

    o Verify the service ID has write permission on the COS bucket.

     Select Access Groups. Verify that the permissions the service ID gets

    through each access group are valid.

     Select Access Policies. Verify that the permissions are valid.

    96 | P a g e'
  remediation: '1. If the option to configure archiving is not allowed, upgrade the instance’s service

    plan.

    2. If archiving is not enabled for an instance, review and define the archiving strategy.

    Then, configure archiving for an audit instance.

    3. If you cannot find an instance of IBM Cloud Object Storage (COS) in your account,

    provision one.

    4. If you have a bucket that does not have full control over the data encryption keys,

    configure one of the supported options. IBM® Cloud Object Storage provides

    several options to encrypt your data.

    5. If you have a bucket that does not have an expiration rule to automatically delete

    objects, configure one for the bucket based on your compliance and organizational

    requirements. The minimum expiration must be 365 days. For more information,

    see Delete stale data with expiration rules.

    6. If you have a bucket that does not have an archive policy to store long-term data

    that is rarely accessed, configure one for the bucket based on your compliance and

    organizational requirements. For more information, see Archive cold data with

    transition rules.

    7. If you have a bucket that does not have Activity Tracker events enabled so that you

    can monitor any interaction of users and services with the bucket, enable Activity

    Tracker events for the bucket.

    8. If you have a bucket that does not enable monitoring with IBM Cloud Monitoring

    with Sysdig, configure the bucket.

    9. If you want to create a bucket, see create and configure a bucket.

    o Configure one of the supported options to add additional encryption

    capabilities. For more information, see IBM® Cloud Object Storage provides

    several options to encrypt your data.

    o Configure an expiration rule to automatically delete objects. Configure a rule

    for the bucket based on your compliance and organizational requirements.

    The minimum expiration must be 365 days. For more information, see Delete

    stale data with expiration rules.

    o Configure an archive policy to store long-term data that is rarely accessed.

    Configure a policy for the bucket based on your compliance and

    organizational requirements. For more information, see Archive cold data

    with transition rules.

    o Enable Activity Tracker events on the bucket so that you can monitor any

    interaction of users and services with the bucket. For more information, see

    enable Activity Tracker events for the bucket.

    o Enable monitoring for the bucket.

    o If the service ID that is used to archive events from a LogDNA instance to a

    COS bucket does not have restricted permissions to be able to write only to

    the bucket that is specified in the configuration, modify the permissions.

    Ensure that the policies that are granted to the service ID only grant

    permissions to write to the bucket defined in the LogDNA archiving

    configuration.

    97 | P a g e

    o If the file is corrupted or an archive file is not available in your bucket, open a

    ticket with IBM. Make sure that you claim the data before reaching the

    maximum number of search days that is indicated in the service plan. Data is

    lost after it reaches the maximum number of search days.'
