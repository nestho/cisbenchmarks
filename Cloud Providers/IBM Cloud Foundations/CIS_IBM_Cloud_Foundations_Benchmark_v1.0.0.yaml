- id: 2.2.1.1
  title: Ensure Block Storage is encrypted with customer managed keys
  scoring: manual
  profile:
  - Level 2
  description: By default, IBM Cloud Block Storage provides provider-managed encryption for all data. For enhanced security,
    customers can bring their own encryption keys and manage them through IBM Key Management Services – Key Protect or Hyper
    Protect Crypto Services (HPCS). Provider-managed encryption is turned on by default and cannot be turned off.
  rationale: With customer-managed keys, only customers can access and manage their master root keys, giving them full control
    over their data security.
  impact: ''
  references:
  - 1. https://cloud.ibm.com/vpc-ext
  page_start: 74
  audit_raw: 'You can use the IBM Cloud Block Storage configuration properties to verify whether a

    Cloud Object Storage bucket is enabled to use Key Protect.

    From Console, Navigate to your Cloud Object Storage instance:

    1. In the IBM Cloud console, go to Menu icon > VPC Infrastructure > Storage > Block

    storage volumes. A list of all block storage volumes displays.

    2. For each of the volumes listed, ensure the encryption field is Not pointing to

    "Provider Managed"'
  remediation: 'You will not be able to change encryption option once data is already written to a Cloud

    Block Storage Volume. In order to ensure that objects are encrypted using customer

    managed keys you will need to create a new Cloud Block Storage volume, set it to use either

    Key Protect or Hyper Protect key management service and then upload/copy the existing

    objects to this new volume.'
