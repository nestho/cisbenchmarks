  - https://cloud.ibm.com/docs/Activity-Tracker-with-LogDNA?topic=logdnaatservice_plan
  - '1. IBM Cloud Activity Tracker with LogDNA: Adoption guidelines for regulated and'
  - '2. IBM Cloud Activity Tracker with LogDNA service plans:'
  - https://cloud.ibm.com/docs/Activity-Tracker-with-LogDNA?topic=logdnaatservice_plan
  page_start: 99
  audit_raw: "Use the following checklist to ensure that events are collected and processed to identify\nanomalies or abnormal\
    \ events:\nThis checklist assumes that you have a different IBM Cloud account for development,\nstaging, Q&A, and production.\
    \ When you separate accounts by domain (for example,\nproduction versus development), you isolate events for each domain\
    \ and location. You can\nonly have one Activity Tracker instance in each region and each account. You use IAM to\ndefine\
    \ permissions to view and manage events in an instance.\nNote: When a user gets read permissions to see events in an Activity\
    \ Tracker instance, the\nuser gets visibility of all events in the region. Therefore, separate domains by account to\n\
    avoid exposing production logs to non-authorized users.\nChecklist\nThe checklist must be applied to each environment\
    \ independently.\n1. Ensure that events from core IBM Cloud core platform services, such as IAM are\ncollected and available\
    \ through the audit instance in Frankfurt. Check that each core\nservice has one or more custom views to analyze the data.\n\
    Note: These types of events are only available for the search period. You might have\nto pull archive data to verify these\
    \ events, or run a test to see that they are being\ngenerated properly.\no Check that you see provisioning events\no Check\
    \ that you see IAM identity login events\no Check that you see IAM access group and policy events.\n2. Ensure that events\
    \ from enabled IBM Cloud services are collected in each region\nwhere you operate. Check that events are available in\
    \ the audit instance that is\navailable in the same region as your service instances.\no Check for additional configuration\
    \ steps that a service might require.\no Check that you have a custom view for each service.\n100 | P a g e\no Check that\
    \ events for a specific service are available for analysis through the\ncustom view.\n3. Views can be classified in categories.\
    \ For example, a category might be aligned with\na line of business.\no Ensure that views are grouped in categories.\n\
    o Check that each view belongs to the correct category.\n4. Check that custom views are defined for each service to monitor\
    \ events that have an\noutcome of failure.\n5. Check that custom views are defined for each service to monitor events\
    \ that report\nhigh level threat actions in your account. These events report deletion actions in the\naccount.\n6. Check\
    \ that custom views are defined for each service to monitor events that report\nchanges to resources in the account. For\
    \ example, these events report actions that\nmodify the state of a resource in your account.\n7. Check that custom views\
    \ are defined for each service to monitor events that report\nunauthorized or forbidden access to run actions in the account.\n\
    8. Check that custom views are defined for each service to monitor events that report\nuser management actions in the\
    \ account.\n9. Check that custom views are defined for each service to monitor events that report\nactions on user management\
    \ and related IAM actions.\nUI Instructions\nUI instructions that you can use to check that you have custom views to monitor\
    \ activity in\nyour account:\n1. Log in to IBM Cloud at https://cloud.ibm.com.\n2. Go to the Menu icon. Then, select Observability\
    \ to access the Observability\ndashboard.\n3. Click Activity Tracker.\n4. Look for views that report events from core\
    \ IBM Cloud core platform services, such\nas IAM. Check that the search criteria of the views match the query indicated\
    \ in the\nsearch criteria provided.\no Check that each view displays events with actions listed in the Events that\nare\
    \ generated section.\no Check the description of each view and ensure that it is clear and reflects the\ntype of events\
    \ that are available through the view.\no Name your view according to your organization’s naming convention.\nService\
    \ to check: IAM Identity\n Query: *_platform:iam-identity*\n Events that are generated: [Events that are generated when\
    \ a user or\napp logs in to the IBM Cloud](https://cloud.ibm.com/docs/Activity-\n101 | P a g e\nTracker-with-LogDNA?topic=Activity-Tracker-with-LogDNAat_events_iam#at_events_iam_login)\n\
    \ Activity Tracker instance location: *Frankfurt*\nService to check: IAM Access Management (IAM AM)\n Query: *_platform:iam-am*\n\
    \ Events that are generated: [Events that are generated when you manage\nIAM policies](https://cloud.ibm.com/docs/Activity-Tracker-withLogDNA?topic=Activity-Tracker-with-LogDNAat_events_iam#at_events_iam_policies)\n\
    \ Activity Tracker instance location: *Frankfurt*\nService to check: IAM Groups\n Query: *_platform:iam-groups*\n Events\
    \ that are generated: [Events that are generated when you manage\naccess groups](https://cloud.ibm.com/docs/Activity-Tracker-withLogDNA?topic=Activity-Tracker-with-LogDNAat_events_iam#at_events_iam_access)\n\
    \ Activity Tracker instance location: *Frankfurt*\n5. Look for views that report events from enabled IBM Cloud services.\n\
    o Check that the search query to filter data in the custom view is in the\nfollowing format:\n_platform:<Service Name>\n\
    o Check the description for each view.\no Check that the name of each view follows your organization’s naming\nconvention.\n\
    To see the list of available services, see Cloud services.\nTo see where events are available for analysis, see Cloud\
    \ services locations.\n6. Check that views are organized and grouped by category.\na. In the LogDNA web UI, select Settings.\
    \ Then, select Categories.\nb. Select Views.\nc. Check the views that are within each category.\n7. Look for views that\
