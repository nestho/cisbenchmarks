- id: '3.3'
  title: Ensure that events are collected and processed to identify anomalies or abnormal events
  scoring: manual
  profile:
  - Level 1
  - Level 2
  description: Events that you collect and centralize in the IBM Cloud Activity Tracker with LogDNA service provide information
    about actions that take place on your account. You can analyze this data to resolve problems, identify anomalies, and
    be notified of abnormal situations. Events that you collect and centralize in the IBM Cloud Activity Tracker with LogDNA
    service provide information about actions that take place on your account. You can define alerts to notify promptly of
    problems, anomalies, and abnormal situations.
  rationale: 'IBM Cloud Activity Tracker with LogDNA adds audit capabilities to your IBM Cloud architecture. Each event reports
    information about who requested an action on your account (initiator details), what action was requested, the resource
    on which the action was requested (target details), and outcome of the request. Each event is based on the Cloud Auditing
    Data Federation (CADF) standard. For more information about the IBM event definition, see Event types and Event fields.
    In IBM Cloud Activity Tracker with LogDNA (AT), events from core IBM Cloud platform services are collected automatically
    and available for analysis through the audit instances in your account. Events are also collected automatically for enabled-AT
    services. However, some services might require an upgrade of the service plan, a configuration setting, or both, for you
    to be able to collect and analyze them. Core platform Activity Tracker events are available for all IBM Cloud services.
    These events include provisioning and deletion of service instances, tagging, and IAM management. Through an audit instance,
    you can troubleshoot events in real time to diagnose issues and identify problems. By using the live streaming tail feature
    in the Everything view, you can diagnose issues, analyze stack traces and exceptions, identify the source of errors, and
    monitor different event sources through a single view. By using custom views, you can show a subset of data by applying
    pre-defined filters and natural language queries to the Everything View. 99 | P a g e IBM Cloud Activity Tracker with
    LogDNA adds audit capabilities to your IBM Cloud architecture. Each event reports information about who requested an action
    on your account (initiator details), what action was requested, the resource on which the action was requested (target
    details), and outcome of the request. Each event is based on the Cloud Auditing Data Federation (CADF) standard. For more
    information about the IBM event definition, see Event types and Event fields. Events from enabled IBM Cloud services and
    core IBM Cloud platform services are collected automatically and available for analysis through the audit instances in
    your account. Check out the services that send events to the platform service events instance. Core platform Activity
    Tracker events are available for all IBM Cloud services. These events include provisioning and deletion of service instances,
    tagging, and IAM management. By using the live streaming tail feature through the Everything view, you can diagnose issues,
    analyze stack traces and exceptions, identify the source of errors, and monitor different event sources through a single
    view. By using custom views, you can show a subset of data by applying pre-defined filters and natural language queries
    to the Everything view. On custom views, you can issue alerts to be notified of important actions. To act promptly on
    events that you identify as critical or warning, DevOps teams can configure alert notification integrations to the following
    systems: email, Slack, web hook, and PagerDuty. 109 | P a g e'
  impact: The recommended custom views allow you to monitor actions that take place in your account, the level of threat of
    those actions in your account, and abnormal situations. If you are missing any of these views and the ability to check
    that events are available through them, exposes a potential security risk by hiding a possible gap of events that are
    critical to control what happens in the account. In addition, views can have alerts attached to them so that you are notified
    quickly of abnormal situations. If you do not have the right views, you lose the ability to configure alerts and pre-empt
    situations that might require your attention. The recommended alerts on custom views allow you to monitor actions that
    take place in your account, the level of threat of those actions in your account, and abnormal situations. If you are
    missing any of these views and the ability to check that events are available through them, exposes a potential security
    risk by hiding a possible gap of events that are critical to control what happens in the account. In addition, views can
    have alerts attached to them so that you are notified quickly about abnormal situations. If you do not have the right
    views, you lose the ability to configure alerts and pre-empt situations that might require your attention.
