    \ key.\n6. From the options menu, click Manage policy to manage the rotation policy for the\nkey.\n7. From the list of\
    \ rotation options, if your key has an existing rotation policy, the\ninterface displays the key's existing rotation period.\n\
    API:\nFor a high-level view, you can browse the rotation policies that are associated with a root\nkey by making a GET\
    \ call to the following endpoint.\nhttps://<region>.kms.cloud.ibm.com/api/v2/keys/<key_ID>/policies\n1. Retrieve your\
    \ service and authentication credentials.\n2. Retrieve the rotation policy for a specified key by running the following\
    \ cURL\ncommand.\n $ curl -X GET \\\n \"https://<region>.kms.cloud.ibm.com/api/v2/keys/<key_ID>/policies\" \\\n203 | P\
    \ a g e\n -H \"authorization: Bearer <IAM_token>\" \\\n -H \"bluemix-instance: <instance_ID>\" \\\n -H \"content-type:\
    \ application/vnd.ibm.kms.policy+json\" \\\n -H \"correlation-id: <correlation_ID>\"\nReplace the variables in the example\
    \ request according to the following table.\nVariable Description\nkey_ID Required. The unique identifier for the root\
    \ key that has an existing\nrotation policy.\nregion Required. The region abbreviation, such as us-south or eu-gb, that\n\
    represents the geographic area where your Key Protect instance resides.\nFor more information, see Regional service endpoints.\n\
    IAM_token Required. Your IBM Cloud access token. Include the full\ncontents of the IAM token, including the Bearer value,\
    \ in the cURL request.\nFor more information, see Retrieving an access token.\ninstance_ID Required. The unique identifier\
    \ that is assigned to your Key\nProtect service instance.\nFor more information, see Retrieving an instance ID.\ncorrelation_ID\
    \ The unique identifier that is used to track and correlate\ntransactions.\nA successful GET api/v2/keys/{id}/policies\
    \ response returns policy details\nthat are associated with your key.\nCLI:\nRun the following command to get a list of\
    \ all the keys and their associated KeyIDs\nFor each key, note the keyID and run the following command to get the key\
    \ rotation status:\nibmcloud kp key policies KEY_ID\n -i, --instance-id INSTANCE_ID\n [-d, --dual-auth]\n [-o, --output\
    \ OUTPUT]\n [-r, --rotation]\nRequired parameters\nKEY_ID The ID of the key that you want to query. To retrieve a list\
    \ of\nyour available keys, run the kp keys command.\n-i, --instance-id The IBM Cloud instance ID that identifies your\
    \ Key\nProtect instance. You can export KP_INSTANCE_ID=INSTANCE_ID instead of\nspecifying -i.\nOptional parameters\n-d,\
    \ --dual-auth Show policies that have a dual-auth-delete policy.\n-o, --output Set the CLI output format. By default,\
    \ all commands print in\ntable format. To change the output format to JSON, use --output json.\n-r, --rotation Show policies\
    \ that have a rotation policy.\n204 | P a g e"
  remediation: "Console:\n1. Log in to the IBM Cloud console.\n2. Go to Menu > Resource List to view a list of your resources.\n\
