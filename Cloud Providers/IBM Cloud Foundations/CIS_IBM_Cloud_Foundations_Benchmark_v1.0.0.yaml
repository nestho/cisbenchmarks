- id: 8.1.2
  title: Ensure the IBM Key Protect service has high availability
  scoring: manual
  profile:
  - Level 1
  description: IBM® Key Protect for IBM Cloud™ is a regional key management service with automatic features that help keep
    your applications secure and operational. Key Protect can be configured to provide high availability capabilities, such
    as IBM-owned infrastructure in multizone regions, to meet local access and low latency requirements for each supported
    region. Additionally, it can be configured to continuously back up keys in the region that the service operates in, and
    automatically recover and restart service components after any disaster event. You are responsible to plan for availability
    configuration on the different regions, and copying keys into a backup instance of Key Protect on a periodic basis.
  rationale: Applications that communicate over networks are subject to transient faults. You should design your application
    to interact with Key Protect by using modern resiliency techniques, such as Exponential backoff. High availability of
    the key management service is necessary for both load balancing and fault tolerance. Disaster recovery is about surviving
    a catastrophic failure or loss of availability in a single location. For the console and platform services, there are
    no actions that you need to take to prepare for an event of a catastrophic failure in a region.
  impact: High availability and disaster recovery are available for the Key Management Service. Customers are responsible
    to use and configure the high availability approach according to their needs, and to backup the keys on a regular basis.
  references:
  - 1. https://cloud.ibm.com/docs/key-protect?topic=key-protect-provision
  - 2. https://cloud.ibm.com/docs/key-protect?topic=key-protect-shared-responsibilities
  page_start: 208
  audit_raw: 'Console:

    To get a list of Key Protect instances from the IBM Cloud console, complete the following

    steps.

    1. Log in to your IBM Cloud account.

    2. Click Catalog to view the list of services that are available on IBM Cloud.

    208 | P a g e

    3. From the All Categories navigation pane, click the Security and Identity category.

    4. From the list of services, click the Key Protect tile.

    5. Review the instance of Key Protect in the account, region, and resource group where

    you are logged in.

    API: N/A'
  remediation: 'Console:

    To get a list of Key Protect instances from the IBM Cloud console, complete the following

    steps.

    1. Log in to your IBM Cloud account.

    2. Click Catalog to view the list of services that are available on IBM Cloud.

    3. From the All Categories navigation pane, click the Security and Identity category.

    4. From the list of services, click the Key Protect tile.

    5. Select a service plan, and click Create to provision an instance of Key Protect in the

    account, region, and resource group where you are logged in.'
