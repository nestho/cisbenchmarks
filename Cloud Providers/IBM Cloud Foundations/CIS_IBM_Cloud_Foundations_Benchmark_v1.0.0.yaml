    \ update a rotation policy for your root key by making a PUT call to the following\nendpoint.\nhttps://<region>.kms.cloud.ibm.com/api/v2/keys/<key_ID>/policies\n\
    1. Retrieve your service and authentication credentials.\n2. Create or update a rotation policy for a specified key by\
    \ running the following cURL\ncommand.\n $ curl -X PUT \\\n \"https://<region>.kms.cloud.ibm.com/api/v2/keys/<key_ID>/policies\"\
    \ \\\n -H \"authorization: Bearer <IAM_token>\" \\\n -H \"bluemix-instance: <instance_ID>\" \\\n -H \"content-type: application/vnd.ibm.kms.policy+json\"\
    \ \\\n -H \"correlation-id: <correlation_ID>\" \\\n -d '{\n \"metadata\": {\n \"collectionType\": \"application/vnd.ibm.kms.policy+json\"\
    ,\n \"collectionTotal\": 1\n },\n \"resources\": [\n {\n \"type\": \"application/vnd.ibm.kms.policy+json\",\n \"rotation\"\
    : {\n \"interval_month\": <rotation_interval>\n }\n }\n ]\n }'\nReplace the variables in the example request according\
    \ to the following table.\n205 | P a g e\nVariable Description\nkey_ID Required. The unique identifier for the root key\
    \ that you want to\ncreate a rotation policy for.\nregion Required. The region abbreviation, such as us-south or eu-gb,\
    \ that\nrepresents the geographic area where your Key Protect instance resides.\nFor more information, see Regional service\
    \ endpoints.\nIAM_token Required. Your IBM Cloud access token. Include the full\ncontents of the IAM token, including\
    \ the Bearer value, in the cURL request.\nFor more information, see Retrieving an access token.\ninstance_ID Required.\
    \ The unique identifier that is assigned to your Key\nProtect service instance.\nFor more information, see Retrieving\
    \ an instance ID.\ncorrelation_ID The unique identifier that is used to track and correlate\ntransactions.\nrotation_interval\
    \ Required. An integer value that determines the key\nrotation interval time in months. The minimum is 1 and the maximum\
    \ is 12.\nThis can also overwrite an existing rotation interval for an update.\nA successful PUT api/v2/keys/{id}/policies\
    \ response returns policy details\nthat are associated with your key.\nCLI:\nRun the following command to enable key rotation\
    \ by updating the key rotation policy:\nibmcloud kp key policy-update rotation KEY_ID\n -i, --instance-id INSTANCE_ID\n\
    \ [-m, --monthly-interval MONTHS]\n [-o, --output OUTPUT]\nRequired parameters\nKEY_ID The ID of the key that you want\
    \ to query. To retrieve a list of\nyour available keys, run the kp keys command.\nOptional parameters\n-m, --monthly-interval\
    \ Set the key rotation interval in months. The\ndeault is 1 (one) month. The rotation interval must be 1 to 12 months.\n\
    -o, --output Set the CLI output format. By default, all commands print in\ntable format. To change the output format to\
    \ JSON, use --output json."
