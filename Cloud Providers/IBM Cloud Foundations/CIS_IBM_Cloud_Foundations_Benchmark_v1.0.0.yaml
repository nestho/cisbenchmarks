- id: '4.2'
  title: Ensure IBM Cloud Databases are only accessible via HTTPS or TLS Connections
  scoring: manual
  profile:
  - Level 1
  description: The IBM Cloud Databases services can only be connected to over TLS or HTTPS connections. This behavior is by
    default and is non-configurable. Customers are provided self-signed certificates and most appropriately configure driver
    or application to utilize these certificates and encryption in motion. To connect to the database with a self-signed certificate
    for TLS, follow the following steps Via UI 1. Driver you use to connect needs to be able to support encryption. 2. Copy
    the certificate information from the Connections panel or the Base64 field of the connection information on the IBM Cloud
    Databases UI. 3. If needed, decode the Base64 string into text. 4. Save the certificate to a file. (You can use the Name
    that is provided or your own file name). 5. Provide the path to the certificate to the driver or client. 6. Connect to
    database Via CLI 1. ibmcloud login 2. ibmcloud cdb 3. ibmcloud cdb deployment-ca-cert "CRN" 4. Copy and save the command's
    output (it will be text decoded from Base64) to a file and provide the file's path to the driver.
  rationale: IBM Cloud databases are typically used by our customers to store business-critical data. When these kinds of
    data are uploaded or accessed, it is highly recommended and required to keep the channel encrypted to ensure data cannot
    be accessed by a bad actor or incorrect entity 127 | P a g e
  impact: Any lack in protecting this data in motion using strong encryption could result in a bad actor accessing the data
    and possibly causing damage to the relevant organizations.
  references: []
  page_start: 127
  audit_raw: ''
  remediation: 'There is no remediation procedure available on database side. If client side is having issues

    connecting to the database, the client must ensure that they are using TLS 1.2> or HTTPS

    from application or client library.'
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: '4.3'
  title: Ensure network access to IBM Cloud Databases service is set to be exposed on “Private end points only”
  scoring: manual
  profile:
  - Level 1
  description: All Cloud Databases deployments offer integration with IBM Cloud Service Endpoints. It gives you the ability
    to enable connections to your deployments from the public internet and over the IBM Cloud Private network. Service Endpoints
    are available in all IBM Cloud Multi-Zone Regions and some Single-Zone Regions. If your deployments are in Osl01, you
    aren't able to use private endpoints. Deployments in all other regions are able to use Service Endpoints. Public endpoints
    provide a connection to your deployment on the public network. At provision time, a public endpoint is the default option
    for all deployments. Your environment needs to have internet access to connect to a deployment. A deployment with a service
    endpoint on the private network gets an endpoint that is not accessible from the public internet. All traffic is routed
    to hardware dedicated to Cloud Databases deployments and remains on the IBM Cloud Private network. All traffic to and
    from this endpoint is free and unmetered as long as the traffic remains in IBM Cloud. Once your environment has access
    to the IBM Cloud Private network, an internet connection is not required to connect to your deployment.
  rationale: The use of public endpoints exposes data that is contained in the database to unnecessary risk from the outside
    internet.
  impact: Some applications are not run in the IBM Cloud. Therefore, they cannot rely on the IBM Cloud network backbone to
    maintain communication from application to the database over the private network. In this case, the customer may choose
    to enable "Public" endpoints which allow access to the database from the internet. Customers that are required to do should
    IP Whitelist the database before enabling "Public" endpoints. 129 | P a g e
  references: []
  page_start: 129
  audit_raw: "From the Console:\n1. Log on to your IBM Cloud account\n2. Go to the Menu icon > Resource List to access your\
    \ list of account resources\n3. Click the Database service you are interested in to open the service dashboard.\n4. Ensure\
    \ you are on the Manage page in the left pane.\n5. Click the Settings tab in the middle of the page and scroll down to\
    \ Service endpoints\n6. Review the toggle that displays the status of Private endpoint and Public endpoint\nenablement.\
    \ Ensure, Public is toggled off and Private is toggled on.\nFrom the API:\n1. Access to the API uses token authentication,\
    \ by using the header Authorization:\nBearer . The token must be IAM-issued. You can send in an IAM API key directly as\n\
    the token or use the API key to generate an IAM Bearer Token.\n2. Insert the region your deployment is in and the CRN\
    \ of your deployment as\nindicated by {}\ncurl -X GET\nhttps://api.{region}.databases.cloud.ibm.com/v4/ibm/deployments/{id}\
    \ -H\n'Authorization: Bearer <>' \\\nThis will return something like:\n{\n \"deployment\": {\n \"id\": \"crn\",\n \"name\"\
    : \"crn\",\n \"type\": \"database\",\n \"platform_options\": {\n \"key_protect_key_id\": \"\"\n },\n \"version\": \"x.y\"\
    ,\n \"admin_username\": \"admin\",\n \"enable_private_endpoints\": true,\n \"enable_public_endpoints\": false\n }\n}\n\
    Ensure that enable_private_endpoints is true and that enable_public_endpoints is false."
  remediation: 'From the Console:

    1. Log on to your IBM Cloud account

    2. Go to the Menu icon > Resource List to access your list of account resources

    3. Click the Database service you are interested in to open the service dashboard.

    130 | P a g e

    4. Ensure you are on the Manage page in the left pane.

    5. Click the Settings tab in the middle of the page and scroll down to Service endpoints

    6. Select Private endpoint toggle to be turned on and Public endpoint to be turned off.

    7. Click Update Endpoints

    From the CLI:

    You can use the ibmcloud resource service-instance-update command in the CLI, specifying

    the endpoint with the --service-endpoints flag. This can be done online with no downtime

    ibmcloud resource service-instance-update <service-name> --service-endpoints

    <endpoint-type>

    Changing the type of endpoints available on your deployment does not cause any

    downtime from a database perspective. However, if you disable an endpoint that is being

    used by you or your applications, those connections are dropped.

    From the API:

    You can use the Resource Controller API, with a PATCH request to the

    /resource_instances/{id} endpoint.

    **Figure out more detail here, should be copy and paste for every service

    **'
  checks:
  - type: manual_review
    info: 'From the Console:

      1. Log on to your IBM Cloud account

      2. Go to the Menu icon > Resource List to access your list of account resources

      3. Click the Database service you are interested in to open the service dashboard.

      4. Ensure you are on the Manage page in the left pane.

      5. Click the Settings tab in the middle of the page and scroll down to Service endpoints

