    \ -H\n'Authorization: Bearer <>' \\\n4. The response will show something like\n{\n \"deployment\": {\n \"id\": \"crn:v1:staging:public:databases-for-enterprisedb:ussouth:a/b9552134280015ebfde430a819fa4bb3:5589ecbf-de5f-4eac-9917df0dd7e706c8::\"\
    ,\n \"name\": \"crn:v1:staging:public:databases-for-enterprisedb:ussouth:a/b9552134280015ebfde430a819fa4bb3:5589ecbf-de5f-4eac-9917df0dd7e706c8::\"\
    ,\n \"type\": \"enterprisedb\",\n \"platform_options\": {\n \"disk_encryption_key_crn\": \"\",\n \"backup_encryption_key_crn\"\
