- id: '1.7'
  title: Ensure multi-factor authentication (MFA) is enabled for all users in account
  scoring: manual
  profile:
  - Level 1
  description: Requires users to provide multiple factors of login credentials to authenticate their identity and gain access
    to IBM Cloud resources.
  rationale: Multifactor authentication (MFA) adds an additional layer of security to an account by requiring users to provide
    an additional login credential. This requirement helps protect accounts from stolen, phished, or weak password exploits.
  impact: Depending on the administrator’s selection, users might be required to provide an additional authentication factor
    prior to gaining access to IBM Cloud resources. API keys for users and service IDs continue to work after MFA is enabled.
  references:
  - 1. https://cloud.ibm.com/docs/iam?topic=iam-enablemfa
  page_start: 26
  audit_raw: 'Console:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. From the Menubar, click Manage > Access (IAM).

    3. Click Settings > Account login.

    4. Verify Multifactor authentication does not say None

    API:N/A'
  remediation: '1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. From the Menubar, click Manage > Access (IAM).

    3. Click Settings > Account login.

    4. Click Edit for the Account login setting.

    5. Select None, Non-federated users only, or All users depending on which type of

    authentication you want to require.

    26 | P a g e

    6. Select the checkbox to confirm that you understand the impact of requiring MFA for

    users in your account, if you select the non-federated users only option.

    7. Click Update.'
  checks:
  - type: manual_review
    info: 'Console:

      1. Log in to IBM Cloud at https://cloud.ibm.com.

      2. From the Menubar, click Manage > Access (IAM).

      3. Click Settings > Account login.

      4. Verify Multifactor authentication does not say None

      API:N/A'
    severity: medium
