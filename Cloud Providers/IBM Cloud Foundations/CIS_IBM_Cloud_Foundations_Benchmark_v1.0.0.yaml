- id: 6.1.2
  title: Ensure Web application firewall is set to ON in IBM Cloud Internet Services (CIS)
  scoring: manual
  profile:
  - Level 1
  description: 'The Web Application Firewall (WAF) protects against ISO Layer-7 attacks, which can be some of the most tricky.
    What is a Web Application Firewall? A WAF helps protect web applications by filtering and monitoring HTTP traffic between
    a web application and the internet. A WAF is an OSI protocol Layer-7 defense in the OSI model, and it is not designed
    to defend against all types of attacks. Deploying a WAF in front of a web application is like placing a shield between
    the web application and the internet. A proxy server protects a client machine’s identity by using an intermediary (for
    outgoing traffic), but a WAF is a type of reverse-proxy that protects the server from exposure by having the client''s
    traffic pass through the WAF before reaching the server (for incoming traffic). Key benefits of a CIS WAF The IBM Cloud™
    Internet Services WAF is an easy way to set up, manage, and customize security rules to protect your web applications
    from common web threats. See the following list for key features:  Easy setup: The CIS WAF is part of our overall service,
    which takes just a few minutes to set up. After you redirect your DNS to us, you can switch on the WAF and set up the
    rules you need.  Detailed reporting See greater detail in the reporting, for example, threats blocked by rule/rule group.'
  rationale: A WAF or Web Application Firewall helps protect web applications by filtering and monitoring HTTP traffic between
    a web application and the Internet. Types of attacks WAF can prevent 148 | P a g e A WAF typically protects web applications
    from attacks such as cross-site forgery, crosssite-scripting (XSS), file inclusion, and SQL injection, among others. A
    WAF usually is part of a suite of tools, which together can create a holistic defense against a range of attack vectors.
    How a WAF works WAF is a type of reverse-proxy that protects the server from exposure by having the client requests pass
    through the WAF before reaching the server. It acts as shield placed between the web application and the internet. A WAF
    operates through a set of rules often called policies. These policies aim to protect against vulnerabilities in the application
    by filtering out malicious traffic. The value of a WAF comes from the speed and ease with which its policy modifications
    can be implemented, thereby allowing a faster response to varying attack vectors. For example, during a DDoS attack, rate
    limiting can be implemented by modifying WAF policies.
  impact: A WAF is an OSI protocol Layer-7 defense in the OSI model, and it is not designed to defend against all types of
    attacks. When a WAF is enabled on Cloud Internet Services the TLS traffic is terminated at the proxy, unencrypted, inspected
    for any attacks, and then reencrypted and forwarded on to the application. Another thing to consider with WAF is that
    there may be false positives based on the application patterns and clients may get blocked or challenged. This can be
    mitigated by tuning WAF.
  references:
  - 1. https://cloud.ibm.com/docs/cis?topic=cis-manage-your-ibm-cis-for-optimalsecurity#best-practice-activate-waf-safely
  - 2. https://cloud.ibm.com/docs/cis?topic=cis-waf-q-and-a
  page_start: 148
  audit_raw: "The Web Application Firewall setting can be audited using the following mechanisms\nIBM Cloud Console\n1. Log\
    \ in to IBM Cloud at https://cloud.ibm.com.\n2. Click Menu icon --> Resource list\n3. Select the Cloud Internet Service\
    \ Instance\n4. Select the domain that needs to be audited from the domains drop down\n5. Choose the Overview from the\
    \ left panel (this should be the default landing page)\n6. Under Security section Web Application Firewall should show\
    \ up as Enabled\nIBM Cloud CLI\n ibmcloud cis waf-setting <DNS_DOMAIN_ID> -i Instance-Name\n Displaying WAF setting of\
    \ domain 'DNS_DOMAIN_ID' ...\n OK\n149 | P a g e\n ID waf\n Mode On"
  remediation: "The Web Application Firewall can be enabled using the following mechanisms\nIBM Cloud Console\n1. Log in to\
    \ IBM Cloud at https://cloud.ibm.com.\n2. Click Menu icon --> Resource list\n3. Select the Cloud Internet Service Instance\n\
    4. Select the domain that needs to be audited from the domains drop down\n5. Choose the Security section from the left\
    \ panel.\n6. Click on the WAF tab in the Security panel.\n7. Switch the toggle to On\nIBM Cloud CLI\n ibmcloud cis waf-setting-update\
    \ <DNS_DOMAIN_ID> waf-enable -i InstanceName\n Updating WAF setting of domain 'e476aba943b5d7d29b96135c78aa55c9' ...\n\
    \ OK\n WAF setting was updated successfully.\n ID waf\n Mode On"
