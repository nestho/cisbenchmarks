- id: '3.5'
  title: Ensure the account owner can login only from a list of authorized countries/IP ranges
  scoring: manual
  profile:
  - Level 1
  description: Monitor the account owner's access to the IBM Cloud account is done from authorized locations that are restricted
    by IP addresses.
  rationale: By default, a user can log in from any IP address. In IBM Cloud, you can restrict a user to log in only from
    specific IP addresses. Therefore, you can define for the account owner the list of IP addresses that are allowed. Other
    IP addresses will be restricted. This configuration feature per user allows you to restrict access from controlled locations
    and adds an additional level of security into your IBM Cloud account. When a user such as the account owner logs in, information
    about its IP address is included in the Activity Tracker security event. You can monitor and be notified when this event
    is generated in the account. You can obtain in the security event information about unauthorized location.
  impact: Failure to meet this control limits your ability to control that the account manager can only access and operate
    in the account from locations that are authorized and allowed by your organization.
  references: []
  page_start: 114
  audit_raw: 'Complete the following steps to check if you monitor the locations from which the account

    owner logs in to the account:

    First, you need to identify the email of the account owner.

    1. In the Cloud UI, go to Manage > Access (IAM), then select Users.

    2. Identify the user that has the tag owner.

    3. Select the account owner. Then, click Details.

    4. Copy the email address of the account owner.

    114 | P a g e

    Second, launch the Activity Tracker instance in Frankfurt. This is the instance where login

    security events are collected in the account.

    In the Views section, look for a view that monitors the account owner login attempts. The

    search query should be set to: (action login) AND initiator.name:<email address>

    AND -initiator.host.address:(<list of IP addresses>), where is the account owner

    email address, and is the list of authorized IP addresses that are separated by OR, for

    example, (xxx.xxx.xxx.xxx OR xxx.xxx.xxx.xxx).

    Then, check that the view has configured an alert and 1 or more notification channels.'
  remediation: 'Complete the following steps to monitor the locations from which the account owner logs

    in to the account:

    First, you need to identify the email of the account owner.

    1. In the Cloud UI, go to Manage > Access (IAM), then select Users.

    2. Identify the user that has the tag owner.

    3. Select the account owner. Then, click Details.

    4. Copy the email address of the account owner and the list of authorized IP addresses.

    Launch the Activity Tracker instance in Frankfurt. This is the instance where login security

    events are collected in the account. In the Views section, select the Everything view. Then,

    enter the following query in the search bar: (action login) AND initiator.name:<email

    address> AND -initiator.host.address:(<list of IP addresses>). Replace with the

    account owner''s email address. Replace with the list of IP addresses that are separated by

    OR, for example, (xxx.xxx.xxx.xxx OR xxx.xxx.xxx.xxx) and configured for the account owner.

    The view now reports all the events that are reported when the account owner tries to

    login from an unauthorized location.

    Next, you can define an alert on the view to get a notification immediately after 1 event is

    received.'
