- id: '3.1'
  title: Ensure auditing is configured in the IBM Cloud account
  scoring: manual
  profile:
  - Level 1
  description: Collect audit events from IBM Cloud resources so that you can monitor activity in your IBM Cloud account.
  rationale: 'IBM Cloud™ Activity Tracker with LogDNA is a Cloud service that you can use to monitor the activity of your
    IBM Cloud account. For example, you can use this service to investigate abnormal activity and critical actions, and comply
    with regulatory audit requirements. The audit events that are collected comply with the Cloud Auditing Data Federation
    (CADF) standard. Each audit event includes information about the initiator of the action, the action that is run, the
    target resource on which the action is requested, the observer, and the outcome of the action. For more information about
    the format, see Event fields. Activity Tracker collects two types of events for audit-enabled services in the IBM Cloud:
     Management events  Data events Data events access or modify customer data. Management events report on operational
    actions on IBM Cloud resources. Both types of events generate events for create, read, update, and delete (CRUD) actions.
    Every user that accesses the IBM Cloud Activity Tracker with LogDNA service in your account must be assigned an access
    policy with an IAM user role defined. The policy determines what actions the user can perform within the context of the
    service or instance that you select. The allowable actions are customized and defined as operations that are allowed to
    be performed on the service. The actions are then mapped to IAM user roles. Tip: To organize a set of users and service
    IDs into a single entity that makes it easy for you to manage IAM permissions, use access groups. You can assign a single
    policy to the group instead of assigning the same access multiple times for each individual user or service ID. The following
    types of roles are available in IBM Cloud:  Platform management roles enable users to perform tasks on service resources
    at the platform level, for example, assign user access for the service, create or delete 87 | P a g e service IDs, create
    instances, assign policies for your service to other users, and bind instances to applications.  Service access roles
    enable users to be assigned varying levels of permission for calling the service''s API, such as viewing data and configuring
    alerts.'
  impact: Failure to meet this control limits your ability to monitor activity in your IBM Cloud account. It also restricts
    your ability to identify the initiator of actions in your account, the resources affected, and details about the request.
    In addition, if IAM permissions are not set properly, you can expose your organization’s audit information to non-authorized
    users.
  references:
  - '1. IBM Cloud Activity Tracker with LogDNA: Adoption guidelines for regulated and'
  - '2. IBM Cloud Activity Tracker with LogDNA service plans:'
  - https://cloud.ibm.com/docs/Activity-Tracker-with-LogDNA?topic=logdnaatservice_plan
  - https://cloud.ibm.com/docs/Activity-Tracker-with-LogDNA?topic=logdnaat-iam
  page_start: 87
  audit_raw: 'To check that you are collecting audit events from IBM Cloud resources so that you can

    monitor activity in your IBM Cloud account, you can use the following check list to ensure

    that auditing is configured in an IBM Cloud account:

    1. Ensure that service instances of the IBM Cloud Activity Tracker with LogDNA

    service are provisioned in each region where you operate in the Cloud. Only one

    Activity Tracker instance is allowed in each IBM Cloud location where the service is

    available.

    2. Ensure that an Activity Tracker instance is provisioned in Frankfurt. This instance

    acts as a global domain and collects audit events that report user actions in the IBM

    Cloud where the scope expands beyond a single region, such as managing users.

    3. Ensure that access control groups (ACG) are configured in your account to manage

    user access.

    a. Check that you have multiple access groups to manage permissions to operate

    audit service instances in IBM Cloud, and to view and manage audit data.

    b. Check each access group documents the scope of the type of access users get

    when they are added to the group.

    c. Check the policies and roles that are configured in each access group. They must

    restrict access to users or service IDs taking into account the scope of the access

    group.

    d. Check that the users that are added to each access group are correct taking into

    account their role in the Cloud account.

    To check if audit instances are provisioned and configured in the account, complete the

    following steps:

    Note: To complete these steps, your IBM Cloud user ID (IBMid) must have the following

    roles:

     A platform role with viewer role for the IBM Cloud Activity Tracker with LogDNA

    service for the account

    88 | P a g e

     A service role with reader role for the IBM Cloud Activity Tracker with LogDNA

    service for the account

     Identity and Access Management (IAM) permissions to view access groups in the

    account

    UI instructions:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. Go to the Menu icon. Then, select Observability to access the Observability

    dashboard.

    3. Select Activity Tracker from the page navigation menu

    4. Check that you can see an Activity Tracker instance in Frankfurt and one instance

    for each location where you operate in the IBM Cloud.

    5. To launch the LogDNA web UI, for each instance, select View LogDNA.

    6. In the LogDNA web UI, verify that you can see audit events, and that they comply

    with the IBM event format that is documented. For more information about the

    format, see Event fields.

    CLI instructions:

    1. Log in to IBM Cloud.

    Run the following command:

    ibmcloud login -a cloud.ibm.com

    For a federated account, run the following command:

    ibmcloud login -a cloud.ibm.com --sso

    2. List all the audit instances that are provisioned in your account. Run the following

    command:

    ibmcloud resource service-instances --service-name logdnaat --allresource-groups

    3. Check that you have one instance in Frankfurt, and one instance for each location

    where you operate in the IBM Cloud.

    Note: You can view events through the LogDNA web UI only. Therefore, you must launch

    the LogDNA web UI from the IBM Cloud console to verify that events are being collected.

    To verify that access groups are available in the account to manage permissions working

    with audit service instances, complete the following steps:

    UI instructions:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. From the Menu bar, select Manage > Access (IAM).

    3. Select Access groups from the page navigation menu.

    4. Find the access groups that grant permissions to work with the IBM Cloud Activity

    Tracker with LogDNA service.

    5. Check the description to identify the scope.

    89 | P a g e

    6. Check the list of users and service IDs. Verify that they should be members of the

    group.

    7. Check that policies and roles are aligned with the scope of the access group.

    CLI instructions:

    1. Log in to IBM Cloud.

    Run the following command:

    ibmcloud login -a cloud.ibm.com

    For a federated account, run the following command:

    ibmcloud login -a cloud.ibm.com --sso

    2. List the access groups in the account. Run the following command:

    ibmcloud iam access-groups

    Repeat the following steps for each access group that you identify.

    3. Get information about each access group.

    Run the following command to list the details of an access group:

    ibmcloud iam access-group {Access Group Name} --output JSON

    Check the description to identify the scope.

    4. Check the list of users and service IDs. Verify that they should be members of the

    group.

    To get the list of users that belong to an access group, run the following command:

    ibmcloud iam access-group-users {Access Group Name}--output JSON

    To get the list of service IDs that belong to an access group, run the following

