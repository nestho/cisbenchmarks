- id: 6.1.3
  title: Ensure DDoS protection is Active on IBM Cloud Internet Services
  scoring: manual
  profile:
  - Level 1
  description: IBM Cloud Internet services provides automatic DDoS protection for any proxied DNS records or a Range Application.
    For an application to be protected against DDoS attacks the DNS records or the Global Load Balancer should be proxied.
    It is recommended that the DNS records in Cloud Internet Services for any networks or applications that need to be protected
    must be proxied. In addition it is required to allowlist only IPs from the Cloud Internet Services on your application
    ingress points. The list of ips to be allow listed is found here.
  rationale: 'A distributed denial of service (DDoS) attack is a malicious attempt to disrupt normal traffic of a server,
    service, or network by overwhelming the target or its surrounding infrastructure with a flood of internet traffic. DDoS
    attacks achieve effectiveness by utilizing many compromised computer systems as sources of attack traffic. Exploited machines
    can include computers and other networked resources such as IoT devices. From a high level, a DDoS attack is like a traffic
    jam clogging up a highway, preventing regular traffic from arriving at its destination. DDoS attack vectors target varying
    components of a network connection. While nearly all DDoS attacks involve overwhelming a target device or network with
    traffic, attacks can be divided into three categories. An attacker can use one or multiple attack vectors, and might even
    cycle through these attack vectors based on countermeasures taken by the target. Common types are:  Application layer
    attacks (Layer 7)  Protocol attacks (Layer 3 and Layer 4)  Volumetric attacks (amplification attacks) Application layer
    attacks An application layer attack is sometimes referred to as a Layer7 DDoS attack (in reference to the 7th layer of
    the OSI model). The goal of these attacks is to exhaust the resources of the victim, by targeting the layer where web
    pages are generated on the server and delivered to the visitors in response to HTTP requests (that is, the 152 | P a g
    e application layer). Layer-7 attacks are challenging, because the traffic can be difficult to identify as malicious.
    Protocol attacks Protocol attacks utilize weaknesses in Layer 3 and Layer 4 of the ISO protocol stack to render the target
    inaccessible. These attacks, also known as a stateexhaustion attacks, cause a service disruption by consuming all the
    available state table capacity of web application servers, or of intermediate resources such as firewalls and load balancers.
    Volumetric attacks This category of attacks attempts to create congestion by consuming all available bandwidth between
    the target and the wider internet. Large amounts of data are sent to a target using a form of amplification, or by other
    means of creating massive traffic, such as requests from a botnet.'
  impact: Allowing proxy will route your data through the Cloud Internet Services proxy and will be decrypted and inspected
    for layer7 DDoS attacks.
  references:
  - 1. https://cloud.ibm.com/docs/cis?topic=cis-distributed-denial-of-service-ddosattack-concepts
  - 2. https://cloud.ibm.com/docs/cis?topic=cis-manage-your-ibm-cis-for-optimalsecurity#best-practice-activate-waf-safely
  page_start: 152
  audit_raw: "The different types of mechanisms to audit if DDoS is enabled are as follows:\nIBM Cloud Console\n1. Log in\
    \ to IBM Cloud at https://cloud.ibm.com.\n2. Click Menu icon --> Resource list\n3. Select the Cloud Internet Service Instance\n\
    4. Click on Reliability on the Left Navigation panel.\n5. Click on the Global Load Balancers tab.\n6. Verify each GLB\
    \ indicates that proxy is enabled by the green toggle.\n7. Click on the DNS tab.\n8. Verify each DNS record indicates\
    \ that proxy is enabled by the green toggle.\nIBM Cloud CLI\n1. Run the following ibmcloud cli command and review the\
    \ value of the proxied\nproperty to verify it is set to true\n ibmcloud cis glbs <DOMAIN_ID> --output json\n[\n {\n \"\
    id\": \"9f46452de6eaa7473ac0ba6b7e7b9502\",\n \"created_on\": \"2020-07-20T14:45:34.982552Z\",\n \"modified_on\": \"2020-09-16T23:48:50.391727Z\"\
    ,\n \"name\": \"hrtrt.test.com\",\n \"fallback_pool\": \"56290bfc54621463c89e493189c055f6\",\n153 | P a g e\n \"enabled\"\
    : true,\n \"default_pools\": [\n \"56290bfc54621463c89e493189c055f6\"\n ],\n \"proxied\": true,\n \"session_affinity\"\
    : \"none\",\n \"steering_policy\": \"off\",\n \"AvailablePools\": \"0/1\"\n }\n]\nibmcloud cis dns-records <DOMAIN_ID>\n\
    Getting DNS Records in domain 'e476aba943b5d7d29b96135c78aa55c9' for service\ninstance 'Test' ...\nOK\nID Name Type Content\n\
    Proxied TTL\n8f2e55e8d471d79e17e8abb6907a04fb test.test.com A 9.9.88.7\ntrue 1\n150f601ac48c22c2bc2b0521b72c96aa www.test.com\
    \ A 169.5.9.12\nfalse 1"
