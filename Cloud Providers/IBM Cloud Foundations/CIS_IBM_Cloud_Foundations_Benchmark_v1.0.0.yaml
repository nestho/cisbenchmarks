- id: 6.1.1
  title: Enable TLS 1.2 at minimum for all inbound traffic on IBM Cloud Internet Services Proxy
  scoring: manual
  profile:
  - Level 1
  description: The Transport Layer Security (TLS) options let you control whether visitors can browse your website over a
    secure connection, and when they do, how IBM Cloud™ Internet Services connects to your origin server. Ensure minimum TLS
    level for TLS termination is set to TLS 1.2. Use the latest version of the TLS protocol (TLS 1.3) for improved security
    and performance by switching from Disabled to Enabled or Enabled+ORTT in the list. TLS encryption modes Set the TLS mode
    by selecting one of the following options from the Mode list. These options are listed in the order from the least secure
    (Off) to the most secure (End-toEnd CA signed).  Off (not recommended)  Client-to-Edge (edge to origin not encrypted,
    self-signed certificates are not supported)  End-to-End flexible (edge to origin certificates can be self-signed)  End-to-End
    CA signed (default and recommended)  HTTPS only origin pull (Enterprise only) Traffic encryption - Minimum TLS version
    Set the minimum TLS version for traffic trying to connect to your site by selecting one of the versions from the list.
    By default, this is set to 1.2. Higher TLS versions provide additional security, but might not be supported by all browsers.
    This could result in some customers being unable to connect to your site. The minimum TLS version applies to whichever
    TLS encryption mode is selected.
  rationale: Use the latest version of the TLS protocol for improved security and performance. TLS1.1 is now considered obsolete
