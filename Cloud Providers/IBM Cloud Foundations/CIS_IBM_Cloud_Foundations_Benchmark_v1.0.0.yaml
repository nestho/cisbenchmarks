- id: 7.1.2
  title: Ensure TLS 1.2 for all inbound traffic at IBM Cloud Kubernetes Service Ingress
  scoring: scored
  profile:
  - Level 1
  description: Ensure that all insecure (HTTP) client requests to applications and services hosted on IBM Cloud Kubernetes
    Service are redirected to secure TLS connections (HTTPS), and ensure that only TLS versions 1.2+ are supported. You set
    up your Ingress ALB to secure your domain with the IBM-provided TLS certificate or your custom TLS certificate. Some users
    might try to access your apps by using an insecure http request to your ALB domain, for example http://www.myingress.com,
    instead of using https. You can use the redirect annotation to always convert insecure HTTP requests to HTTPS.
  rationale: HTTPS uses the TLS protocol to provide a secure, encrypted connection between the client and the server. This
    protocol secures incoming requests to protect users from attack, for example, man in the middle attacks. IBM Cloud Kubernetes
    Service allows HTTPS to be configured, and it is highly recommended to do so. If you do not use this annotation, insecure
    HTTP requests are not converted into HTTPS requests by default and might expose unencrypted confidential information to
    the public.
  impact: Incoming requests will not be able to use HTTP because all incoming requests will be redirected to HTTPS. Legacy
    clients that require TLS 1.0 or 1.1 support will not be able to access your apps.
  references:
  - 1. https://cloud.ibm.com/docs/containers?topic=containersingress_annotation#ssl_protocols_ciphers
  - 2. https://cloud.ibm.com/docs/containers?topic=containersingress_annotation#redirect-to-https
  page_start: 178
  audit_raw: "1. Get the configuration for the ibm-cloud-provider-ingress-cm configmap resource.\nkubectl get cm ibm-cloud-provider-ingress-cm\
    \ -n kube-system -o yaml\n2. In the data section, ensure that the ssl-protocols key is not present, or if it is\npresent,\
    \ ensure that it does not include TLSv1 or TLSv1.1.\n3. Get the configuration for your Ingress resource. by running the\
    \ following command:\n178 | P a g e\nkubectl get ingress <my_ingress> -n <my_namespace> -o yaml\n4. In the annotations\
    \ section, ensure that the ingress.bluemix.net/redirect-tohttps key is set to \"True\".\napiVersion: networking.k8s.io/v1beta1\n\
    kind: Ingress\nmetadata:\n name: myingress\n annotations:\n ingress.bluemix.net/redirect-to-https: \"True\"\nspec:\n tls:\n\
    \ - hosts:\n - mydomain\n secretName: mytlssecret\n rules:\n - host: mydomain\n http:\n paths:\n - path: /\n backend:\n\
    \ serviceName: myservice\n servicePort: 8080"
  remediation: "1. Edit the configuration file for the ibm-cloud-provider-ingress-cm configmap\nresource by running the following\
    \ command:\nkubectl edit cm ibm-cloud-provider-ingress-cm -n kube-system\n2. In the data section, remove the ssl-protocols\
    \ key, or remove TLSv1 and TLSv1.1\nfrom the value.\n3. Edit the configuration for your Ingress resource by running the\
    \ following command:\nkubectl edit ingress <my_ingress> -n <my_namespace>\n4. In the annotations section, add ingress.bluemix.net/redirect-to-https:\n\
    \"True\".\napiVersion: networking.k8s.io/v1beta1\nkind: Ingress\nmetadata:\n name: myingress\n annotations:\n ingress.bluemix.net/redirect-to-https:\
