- id: '1.16'
  title: Ensure IAM does not allow public access to Cloud Object Storage
  scoring: manual
  profile:
  - Level 1
  description: IBM Cloud features the capability for users with specific access roles to create access policies that allow
    all users (authenticated and non-authenticated) to access resources in the account. This “all users” access in turn ends
    up in public (including non-authenticated) access to resources. Determine if this capability is required by your organization
    and disable if not required.
  rationale: Some customer use cases require that certain files or data are made available for all users to access, both authenticated
    and non-authenticated. Even if the public access setting is enabled, resources in your account are not publicly accessible
    unless an administrator level user has explicitly created a policy to create public access for a resource. As a best practice,
    if this capability is not required by your organization, it must be disabled to prevent unintentional misuse.
  impact: If the public access setting is enabled in the account, an administrator level user can create access policies to
    make resources publicly accessible. Resources are not publicly accessible unless an administrator creates an access policy,
    regardless of setting.
  references:
  - 1. https://cloud.ibm.com/docs/iam?topic=iam-public
  page_start: 44
  audit_raw: 'Console:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. From the Menu bar, click Manage > Access (IAM).

    3. Click Settings.

    4. In the public access section of IAM Settings, observe the Public access group setting.

    5. If the Public access group setting is disabled, IAM is not providing public access to

    COS.

    6. If the Public access group setting is enabled, proceed to the Access groups page by

    clicking Access Groups.

    44 | P a g e

    7. From the list of Access Groups, select Public Access by clicking on the Access Group

    name.

    8. Ensure that there are no access policies present for COS in the list of access policies.'
