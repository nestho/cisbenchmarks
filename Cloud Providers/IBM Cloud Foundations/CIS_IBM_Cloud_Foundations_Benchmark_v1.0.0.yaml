- id: '9.1'
  title: Ensure alerts are enabled for vulnerabilities discovered in container images in Container Registry
  scoring: scored
  profile:
  - Level 1
  description: 'With IBM Cloud™ Security Advisor, you can instantly view the security posture of your IBM Cloud services through
    a single, centralized dashboard. The service receives security information from various sources and displays any security
    alerts or vulnerabilities that require your attention in the service dashboard. Out of the box, there are several pre-populated
    cards in your dashboard. These findings are from security services in IBM Cloud, but you can also add cards or custom
    partner solutions so that all of your security tools can be accessed from the same location. Through pre-integrated findings,
    you can monitor:  Certificates that you manage with IBM Cloud Certificate Manager  Vulnerabilities in container images
    that are stored in IBM Cloud Container Registry Monitoring vulnerabilities in container images With Container Registry,
    you have access to Vulnerability Advisor, which continuously scans the images in your Container Registry instance for
    potential security issues. If issues are found, you are alerted and can view a comprehensive report in your Security Advisor
    dashboard. Enable alerts for critical/high/medium vulnerabilities discovered in container images in Container Registry
    to ensure that workload vulnerabilities are addressed in a timely manner and not deployed to a production environment.'
  rationale: Security Insights in the IBM Cloud Security and Compliance Center offers notification alerts in Vulnerability
    Advisor to identify vulnerabilities in developer owned and base container images which are often overlooked. This feature
    alerts for vulnerabilities in images used explicitly and implicitly. It is recommended alerts for critical/high/medium
    vulnerable container images in Container Registry be enabled for every image. 211 | P a g e
  impact: 'A significant percentage of data breaches are caused by users who have forgotten to update their dependency and
    runs a more vulnerable version in production. If the control of alerts is not utilized, vulnerable images will likely
    be written into production more often than desired and will quickly be vulnerable to a cyberattack. With Security Advisor
    alerts in place, you are notified and can start resolving issues immediately. Before you begin Before you get started
    with alerts, you must have the following prerequisites:  The Manager IAM role.  A configured webhook. If you don''t
    have one already, try using Cloud Functions.'
  references:
  - 1. https://nvd.nist.gov/800-53/Rev4/control/RA-5
  - 2. https://cloud.ibm.com/docs/security-advisor?topic=security-advisor-gettingstarted
  page_start: 211
  audit_raw: 'Console:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. Click Menu icon > Security and Compliance.

    3. In the Gain insight section of the navigation, click Configure-->Alerts.

    4. Verify that at least one channel is listed and is set to Enabled.'
  remediation: 'All remediation steps must be applied to the vulnerability in the container image by image

    owners.

    Console:

    1. Log in to IBM Cloud at https://cloud.ibm.com.

    2. Click Menu icon > Security and Compliance.

    3. In the Gain insight section of the navigation, click Configure-->Alerts.

    4. Click Create channel.

    5. Provide a Name, optional Description, and Channel endpoint.

    6. Under Severity for notifications, Select Critical, High, and Medium

    7. Click Save'
  checks:
  - type: manual_review
    info: 'Console:

      1. Log in to IBM Cloud at https://cloud.ibm.com.

      2. Click Menu icon > Security and Compliance.

      3. In the Gain insight section of the navigation, click Configure-->Alerts.

      4. Verify that at least one channel is listed and is set to Enabled.'
    severity: medium
- id: '10.1'
  title: Ensure certificates generated through IBM Cloud Certificate Manager are automatically renewed before expiration
  scoring: scored
  profile:
  - Level 1
  description: You can use the IBM Cloud™ Certificate Manager service dashboard to manage certificates that you obtain from
    third-party issuers, or order from Certificate Manager, to use with your IBM cloud-based apps or services. You can manually
    or automatically renew certificates that you order through Certificate Manager. You can also disable the auto-renewal
    feature after you enable it. You can set a certificate to automatically renew while you're ordering. Or, you can enable
    auto-renewal after it's configured.
  rationale: Cloud applications and services running on the platform might use certificate for different purposes - TLS or
    mTLS, client/server authentication and more. Ensuring your certificates are stored securely, and renewed before they expired
    is crucial to maintaining high security posture.
  impact: Without proper Certificate Management practices in place organization risk to be vulnerable to impersonation attacks
    in case certificates used for authentication will be leaked and service outages in case certificates are not renewed on
    time.
  references:
  - 1. http://cloud.ibm.com/docs/certificate-manager
  page_start: 215
  audit_raw: '1. Log in to IBM Cloud at https://cloud.ibm.com

    2. Click the Menu icon and select Resource List

    3. On the Resource List page under Services, perform the following for each

    Certificate Manager instance that you have provisioned.

    a. Click on the Certificate Manager instance to view the configuration for the service.

    b. Click on Your certificates.

    c. Examine the Expires In column and verify that none of the certificates have

    expired

    d. Verify the auto renew toggle is set to on

    215 | P a g e'
  remediation: '1. Log in to IBM Cloud at https://cloud.ibm.com

    2. Click the Menu icon and select Resource List

    3. On the Resource List page under Services, perform the following for each

    Certificate Manager instance that you have provisioned.

    a. Click on the Certificate Manager instance to view the configuration for the service.

    b. In order to renew the certificate manually click on the options menu and select

    Renew.

    c. Note certificates manually imported into Certificate Manager cannot be

    automatically renewed. In order to renew those certificates click the options menu

    and select Reimport.

    The process can be automated by configuring Slack or Webhook based expiration

    notifications in the Notifications section of Certificate Manager Dashboard. From the

    Certificate Manager instance configuration screen,

    1. Click Notifications.

    2. Click the Create button.

    3. Select the Channel type and enter in the Channel endpoint URL.

    4. Ensure the Enable/Disable toggle is set to On.

    5. Click the Save icon'
  checks:
  - type: manual_review
    info: '1. Log in to IBM Cloud at https://cloud.ibm.com

      2. Click the Menu icon and select Resource List

      3. On the Resource List page under Services, perform the following for each

      Certificate Manager instance that you have provisioned.

      a. Click on the Certificate Manager instance to view the configuration for the service.

      b. Click on Your certificates.

      c. Examine the Expires In column and verify that none of the certificates have

      expired

      d. Verify the auto renew toggle is set to on

      215 | P a g e'
    severity: medium
