- id: 8.1.1
  title: Ensure IBM Key Protect has automated rotation for customer managed keys enabled
  scoring: scored
  profile:
  - Level 2
  description: 'In Key Protect, you can set a rotation policy for a key or manually rotate the key. IBM Cloud Key Management
    Service (KMS): Key Protect (KP) allows customers to rotate the Data Encryption Key (DEK) which is key material stored
    within the KMS Hardware Security Module (HSM), which is tied to the key ID of the Customer Created customer master key
    (CMK). It is the DEK that is used to perform cryptographic operations such as encryption and decryption. When it''s time
    to rotate the key based on the rotation interval that you specify, Key Protect automatically replaces the root key with
    new key material. Automated key rotation currently retains all prior DEK keys so that decryption of encrypted data can
    take place transparently. How key rotation works Key rotation works by securely transitioning key material from an Active
    to a Deactivated key state. To replace the deactivated or retired key version, the new key version moves into the Active
    state and becomes available for cryptographic operations. Frequency of key rotation After you generate a root key in Key
    Protect, you decide the frequency of its rotation. You might want to rotate your keys due to personnel turnover, process
    malfunction, or according to your organization''s internal key expiration policy. Rotate your keys regularly, for example
    every 30 days, to meet cryptographic best practices.'
  rationale: 'Rotating keys on a regular basis helps you meet industry standards and cryptographic best practices. The following
    describes the main benefits of key rotation:  Cryptoperiod management for keys - Key rotation limits how long your information
    is protected by a single key. By rotating your root keys at regular intervals, you also shorten the cryptoperiod of the
    keys. The longer the lifetime of an encryption key, the higher the probability for a security breach. 202 | P a g e 
    Incident mitigation - If your organization detects a security issue, you can immediately rotate the key to mitigate or
    reduce costs that are associated with key compromise.'
  impact: After a rotation completes, a new key version becomes available for protecting data encryption keys (DEKs) with
    envelope encryption. Retired root key versions moves to the Deactivated state, where they can only be used to unwrap and
    access older DEKs that aren't yet protected by the latest root key. To secure your envelope encryption workflow, rewrap
    your DEKs after you rotate a root key so that your at-rest data is protected by the newest root key. Alternatively if
    Key Protect detects that you're using retired key versions to unwrap a DEK, the service automatically reencrypts the DEK
    and returns a wrapped data encryption key (WDEK) that's based on the latest root key.
  references:
  - 1. https://cloud.ibm.com/docs/key-protect?topic=key-protect-key-rotation
  - 2. https://cloud.ibm.com/docs/key-protect?topic=key-protect-set-rotation-policy
  page_start: 202
  audit_raw: "Console:\n1. Log in to the IBM Cloud console.\n2. Go to Menu > Resource List to view a list of your resources.\n\
    3. From your IBM Cloud resource list, select your provisioned instance of Key Protect.\n4. On the application details\
