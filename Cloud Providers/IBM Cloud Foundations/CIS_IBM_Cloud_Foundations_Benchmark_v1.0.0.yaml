- id: 7.2.1
  title: Block deployments of vulnerable images to Kubernetes clusters
  scoring: scored
  profile:
  - Level 1
  description: Vulnerability Advisor provides security management for IBM Cloud Container Registry, generating a security
    status report that includes suggested fixes and best practices. Images for which Vulnerability Advisor reports vulnerabilities
    should not be deployed to Kubernetes clusters. Container Image Security Enforcement (CISE) retrieves information from
    Vulnerability Advisor to block deployments of vulnerable images.
  rationale: Container images contain various packages that can be vulnerable to common vulnerabilities and exposures (CVEs).
    If an image contains such vulnerable packages, it is at risk of being exploited by malicious actors. Vulnerability Advisor
    scans images for CVEs to identify any potential issues with your container images. If an issue is detected in one of your
    images, that image should not be deployed to a Kubernetes cluster, to prevent exposure.
  impact: If the Container Image Security Enforcement admission controller is deployed in a cluster and is configured to enforce
    Vulnerability Advisor policies, deployments of images that have not passed the Vulnerability Advisor scan are blocked.
  references:
  - 1. https://cloud.ibm.com/docs/Registry?topic=Registry-security_enforce
  - 2. https://cloud.ibm.com/docs/containers?topic=containers-helm#helm
  page_start: 198
  audit_raw: "1. Set the cluster as the context for this session.\nibmcloud ks cluster config --cluster <cluster_name_or_ID>\n\
    2. Set up Helm in your cluster.\n3. Use Helm to list releases.\nhelm list\n198 | P a g e\n4. Check the output for a release\
    \ for which the chart is ibmcloud-image-enforcement.\nA version is appended to that name, for example, ibmcloud-image-enforcement0.2.10.\n\
    5. When CISE is installed, it creates a cluster-wide default policy. Get this default\npolicy.\nkubectl get clusterimagepolicies.securityenforcement.admission.cloud.ibm.com\n\
    ibmcloud-default-cluster-image-policy -o yaml\n6. In the repositories array, check for the following output. This configuration\
    \ will\nblock the deployment of images that have not passed the Vulnerability Advisor scan.\nSpecifically, in the va section,\
    \ ensure enabled is true\n- name: '*'\n policy:\n va:\n enabled: true"
  remediation: '1. Set the cluster as the context for this session.

