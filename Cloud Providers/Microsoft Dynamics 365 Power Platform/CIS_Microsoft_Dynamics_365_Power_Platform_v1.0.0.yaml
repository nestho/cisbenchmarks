  rationale: Alerting on the creation of apps allows for administrators to look for risky apps that users have created that
    could cause data spillage or accidental elevation of privilege.
  impact: 'Alerts will be sent to an individual(s) and could be high in volume. Note: Audit logging must be enabled.'
