controls:
- id: '1.1'
  title: (L1) Ensure 'User access to environments is controlled with Security Groups'
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: If the organization has multiple Microsoft Dataverse environments, security groups can be used to control which
    licensed users can be a member of a particular environment.
  rationale: Limiting the access and permissions for the accounts that needs access to the information, reduces the risk of
    having users with improper access to data in the environment.
  impact: Users with legitimate needs to an environment might not be able to access the environment if they are not part of
    the correct security group.
  references:
  - 1. https://docs.microsoft.com/en-us/power-platform/admin/control-user-access
  page_start: 13
  audit_raw: 'Verify that user access to environments is controlled with security groups.

    In the Power Platform Admin Center:

    1. Log in to https://admin.powerplatform.microsoft.com and select the

    appropriate environment.

    2. Select Edit on the Details pane of the environment.

    3. Select the pencil icon under Security group.

    4. Ensure the appropriate group(s) are selected.'
  remediation: 'Ensure that user access to environments is controlled with security groups.

    In the Power Platform Admin Center:

    1. Log in to https://admin.powerplatform.microsoft.com and select the

    appropriate environment.

    2. Select Edit on the Details pane of the environment.

    3. Select the pencil icon under Security group.

    4. Select the appropriate security group.

    5. Select Done followed by Save.'
  checks:
  - type: manual_review
    info: 'Verify that user access to environments is controlled with security groups.

      In the Power Platform Admin Center:

      1. Log in to https://admin.powerplatform.microsoft.com and select the

      appropriate environment.

      2. Select Edit on the Details pane of the environment.

      3. Select the pencil icon under Security group.

      4. Ensure the appropriate group(s) are selected.'
    severity: medium
- id: '1.2'
  title: (L1) Ensure 'User sessions are terminated upon time limit exceeded and user logoff'
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'The Dynamics 365 platform can be configured with a user session expiration time and inactivity timeout. The
    recommended state for this setting is: 120 minutes.'
  rationale: By default, the timeout for a user’s session is set to 24 hours which means the user is not required to re-enter
    their login details for up to 24 hours. Whenever a Dynamics 365 user sessions is started, a unique session ID and other
    session information are generated. Such information can be used be a malicious user to hijack the session. By terminating
    sessions upon user logoff and idle time limit, the underlying session information is invalidated. Therefore, the potential
    for the session to be hijacked is removed.
  impact: User session will be terminated after two hours.
  references:
  - 1. https://docs.microsoft.com/en-us/power-platform/admin/user-sessionmanagement
  page_start: 15
  audit_raw: 'Verify that user sessions are terminated upon user logoff and when the idle time limit is

    exceeded.

    In the Power Platform Admin Center:

    1. Log in to https://admin.powerplatform.microsoft.com and select the

    appropriate environment.

    2. Select Settings.

    3. Expand Product then select Privacy + Security.

    4. Under Session Expiration ensure the slider is set to On.

    Confirm the length and timeout as determined by organizational policy.

    5. Under Inactivity timeout ensure the slider is set to On.

    Confirm the duration for timeout and warning as determined by organizational policy.

    6. Click Save.'
  remediation: 'Ensure that user sessions are terminated upon user logoff and when the idle time limit

    is exceeded.

    In the Power Platform Admin Center:

    1. Log in to https://admin.powerplatform.microsoft.com and select the

    appropriate environment.

    2. Select Settings.

    3. Expand Product then select Privacy + Security.

    4. Under Session Expiration move the slider to On.

    Enter the session length and timeout as determined by organizational policy.

    5. Under Inactivity timeout move the slider to On.

    Enter the duration for timeout and warning as determined by organizational policy.

    6. Click Save.

    Note: These settings apply to all users in the environment.'
  checks:
  - type: manual_review
    info: 'Verify that user sessions are terminated upon user logoff and when the idle time limit is

      exceeded.

      In the Power Platform Admin Center:

      1. Log in to https://admin.powerplatform.microsoft.com and select the

      appropriate environment.

      2. Select Settings.

      3. Expand Product then select Privacy + Security.

      4. Under Session Expiration ensure the slider is set to On.

      Confirm the length and timeout as determined by organizational policy.

      5. Under Inactivity timeout ensure the slider is set to On.

      Confirm '
    severity: medium
- id: '1.3'
  title: (L1) Ensure 'Administrative accounts are separate, unassigned, and cloud-only'
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: Administrative accounts are special privileged accounts that could have varying levels of access to data, users,
    and settings. Each system administrator should utilize two (2) separate accounts, an administrator account to perform
    administrative tasks and a separate account for daily activities such as checking email. Users should only sign in with
    system administrator account to perform administrative tasks in the environment.
  rationale: Users with the system administrator role automatically have access to records, system, and custom entities. Creating
    separate administrative accounts can reduce the risk of credential theft and other types of attacks.
  impact: Administrative users will have to switch accounts utilizing the login/logout functionality when performing administrative
    tasks.
  references:
  - 1. https://docs.microsoft.com/en-us/power-platform/admin/create-users#create-auser-account
  - 2. https://docs.microsoft.com/en-us/power-platform/admin/prevent-elevationsecurity-role-privilege
  page_start: 18
  audit_raw: 'Verify there are separate administrative accounts being utilized.

    In the Microsoft 365 Admin Center:

    1. Log in to https://admin.microsoft.com as a Global Administrator.

    2. Select Users > Active users then sort by the User type column.

    3. Verify that Administrators have a dedicated administrative and regular user

    account.'
  remediation: 'Ensure each administrator has an administrative and regular user account.

    In the Microsoft 365 Admin Center:

    1. Log in to https://admin.microsoft.com as a Global Administrator.

    2. Go to Users and then Active users and select Add a user.

    3. Fill out the appropriate fields for Name, user, domain, password etc.

    4. When prompted to assign licenses select Create user without product license

    (not recommended), then click Next.

    5. Under the Option settings choose Admin center access followed by the

    appropriate role then click Next.

    6. Select Finish adding.

    Note: Take into account the proper and valid licensing requirements and attribute the

    security roles inside power platform with the least privilege approach.'
  checks:
  - type: manual_review
    info: 'Verify there are separate administrative accounts being utilized.

      In the Microsoft 365 Admin Center:

      1. Log in to https://admin.microsoft.com as a Global Administrator.

      2. Select Users > Active users then sort by the User type column.

      3. Verify that Administrators have a dedicated administrative and regular user

      account.'
    severity: medium
- id: '1.4'
  title: (L2) Ensure 'Multifactor authentication for all users' is 'Enabled'
  scoring: manual
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'Enable multifactor authentication (MFA) for all users in the Microsoft 365 tenant. MFA is an authentication
    method which requires the user to provide two (or more) pieces of information to gain access to the system or application.
    There are several options for MFA within the Microsoft 365 tenant: • Authentication code received via text message to
    a registered mobile phone number. • Mobile authentication application like Microsoft Authenticator.'
  rationale: Multifactor authentication requires an individual to present a minimum of two separate forms of authentication
    before access is granted. Multifactor authentication provides additional assurance that the individual attempting to gain
    access is who they claim to be. With multifactor authentication, an attacker would need to compromise at least two different
    authentication mechanisms, increasing the difficulty of compromise and thus reducing the risk. Users will be prompted
    to authenticate with a second factor upon logging in to Microsoft 365 services.
  impact: Implementation of multifactor authentication for all users will necessitate a change to users' routine. All users
    will be required to enroll in multifactor authentication using a mobile phone or an authentication application. After
    enrollment, use of multifactor authentication will be required for future authentication to the environment.
  references:
  - 1. https://docs.microsoft.com/en-us/microsoft-365/admin/security-andcompliance/set-up-multi-factor-authentication?view=o365-worldwide
  page_start: 21
  audit_raw: 'Verify the multifactor authentication is configured for all users.

    In the Microsoft 365 Admin Center:

    1. Log in to https://admin.microsoft.com as a Global Administrator.

    2. Go to Admin centers and click on Azure Active Directory.

    3. Select Enterprise applications then, under Security, select Conditional

    Access.

    4. Review the list of policies and ensure that there is a policy that requires the Grant

    access control with Require multi-factor authentication for All users under

    Users and groups

    Verify the multifactor authentication configuration for administrators, using the M365

    SecureScore service:

    1. Log in to the Secure Score portal https://security.microsoft.com as a Global

    Administrator or another custom admin role.

    2. Click on Require MFA for all users policy to check MFA for all users.

    3. It will show the number of users who do not have MFA configured.

    This information is also available via the Microsoft Graph Security API:

    GET https://graph.microsoft.com/beta/security/secureScores'
  remediation: 'Enable multifactor authentication for all users.

    In the Microsoft 365 Admin Center:

    1. Log in to https://admin.microsoft.com as a Global Administrator.

    2. Go to Admin centers and click on Azure Active Directory.

    3. Select Enterprise applications then, under Security, select Conditional

    Access.

    4. Click New policy

    5. Select Cloud apps or actions > All cloud apps (and don''t exclude any apps)

    6. Go to Assignments > Users and groups > Include > select All users (and do not

    exclude any user).

    7. Access Controls > Grant > Require multi-factor authentication (and nothing

    else)

    8. Conditions > Client Apps > Configure (Yes) > Explicitly select Browser, Mobile

    apps and desktop clients, Modern authentication clients, Exchange

    ActiveSync clients, and Other clients

    9. Leave all other conditions blank

    10. Make sure the policy is enabled

    11. Create'
  checks:
  - type: sql
    command: Select Enterprise applications then, under Security, select Conditional
    severity: medium
    info: 'Verify the multifactor authentication is configured for all users.

      In the Microsoft 365 Admin Center:

      1. Log in to https://admin.microsoft.com as a Global Administrator.

      2. Go to Admin centers and click on Azure Active Directory.

      3. Select Enterprise applications then, under Security, select Conditional

      Access.

      4. Review the list of policies and ensure that there is a policy that requires the Gran'
- id: '2.1'
  title: (L1) Ensure 'Creation of new trial, production, and sandbox environments' is restricted to 'Administrators'
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: An environment is a space to store, manage, and share organizational data, apps, and flows. It also serves
    as a container to separate apps that may have different roles, security requirements, or target audiences. Power Apps
    automatically creates a single default environment for each tenant, which is shared by all users in that tenant. For managing
    environments centrally and to prevent environment sprawl, it is suggested to limit the ability of environment creation
    to specific users.
  rationale: Any PowerApps licensed user can create an environment. If someone in the organization is on a Power Apps or Power
    Automate per-user plan, they may have permission to create their own environment. These environments can be used and shared
    by Dynamics 365, Power Apps portals and apps, and Power Automate flows. Environments can store multiple Dataverse tables.
    Power Platform apps and Dynamics 365 can then connect to, read from, and write to these tables, which would likely be
    shared across multiple applications/processes. It is suggested to restrict the power platform environment creation for
    just administrators and restrict the access for this feature for a limited number of users.
  impact: 'Enabling this feature may slow the user’s individual productivity, but could also prevent duplicated efforts, inconsistent
    data, scattered naming conventions, and data leakage. Note: After enabling this feature, only the Tenant Admin or members
    of the Power Platform Admin Group will be able to create new environments (if non-admins are disabled). Each environment
    requires 1GB of space before provisioning a new environment.'
  references:
  - 1. https://docs.microsoft.com/en-us/power-platform/admin/control-environmentcreation#control-environment-creation-through-powershell
  - 2. https://docs.microsoft.com/en-us/power-platform/admin/create-environment
  page_start: 25
  audit_raw: 'Verify that the creation of new trial, production, and sandbox environment is restricted to

    administrators.

    In the Power Platform Admin Center:

    1. Log in to https://admin.powerplatform.microsoft.com and select the

    appropriate environment.

    2. Select the gear icon in the top right corner then select Power Platform

    Settings.

    3. Under Who can create production and sandbox environments ensure that Only

    specific admins is selected.

    Note: This restricts creation to Global admins, Dynamics 365 service admins,

    Power Platform service admins, and Delegated admins.

    4. Under Who can create trial environments ensure that Only specific admins

    is selected.

    Note: This restricts creation to Global admins, Dynamics 365 service admins,

    Power Platform service admins, and Delegated admins.'
  remediation: 'Ensure that the creation of new trial, production, and sandbox environment is restricted

    to administrators.

    In the Power Platform Admin Center:

    1. Log in to https://admin.powerplatform.microsoft.com and select the

    appropriate environment.

    2. Select the gear icon in the top right corner then select Power Platform

    Settings.

    3. Under Who can create production and sandbox environments select Only

    specific admins.

    Note: This restricts creation to Global admins, Dynamics 365 service admins,

    Power Platform service admins, and Delegated admins

    4. Under Who can create trial environments select Only specific admins.

    Note: This restricts creation to Global admins, Dynamics 365 service admins,

    Power Platform service admins, and Delegated admins

    5. Click Save'
  checks:
  - type: manual_review
    info: 'Verify that the creation of new trial, production, and sandbox environment is restricted to

      administrators.

      In the Power Platform Admin Center:

      1. Log in to https://admin.powerplatform.microsoft.com and select the

      appropriate environment.

      2. Select the gear icon in the top right corner then select Power Platform

      Settings.

      3. Under Who can create production and sandbox environments ensure that Only

      specific admins is selected.

      Note: This restricts creation to Global admins, Dynamics 365 service a'
    severity: medium
- id: '2.2'
  title: (L1) Ensure 'Security roles provide access to the minimum amount of business data required'
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: Users should only have access to data that they really require access to. Make use of the predefined security
    roles whenever possible and assure the minimum privileges required for the roles and for the users to perform their activities.
  rationale: Microsoft Dynamics 365 makes use of the Dataverse and role-based security model to help secure the access. It
    also comes with predefined security roles that can be used for granting user access. If the permission for a predefined
    role requires customization, copy one that exists and work under the copied role, keeping the integrity of the original
    role. It is important to apply the least privilege and need-to-know principle when customizing and granting users and
    roles permissions. Details in the reference links. Limiting the access and permissions for the accounts that needs access
    to the information, reduces the risk of having users with improper access to data in the environment and compromising
    the integrity/confidentiality of the data.
  impact: If not configured correctly, users with need-to-know might not have access to business data.
  references:
  - 1. https://learn.microsoft.com/en-us/dynamics365/customerengagement/onpremises/developer/security-dev/how-role-based-security-control-accessentities?view=op-9-1
  page_start: 29
  audit_raw: 'Ensure that user access to the environment is controlled with security groups.

    In the Power Platform Admin Center:

    1. Log in to https://admin.powerplatform.microsoft.com and select the

    appropriate environment.

    2. Select Settings.

    3. Expand Users + permissions then select Security roles.

    4. Analyze the predefined Security Roles to determine which fits the environmental

    needs.

    5. Under the More actions click the 3 dots and select copy to audit the roles.'
  remediation: 'Change user roles to meet environment needs via security groups.

    In the Power Platform Admin Center:

    1. Log in to https://admin.powerplatform.microsoft.com and select the

    appropriate environment.

    2. Select Settings.

    3. Expand Users + permissions then select Security roles.

    4. Edit the Security Role to fit environmental needs.'
  checks:
  - type: manual_review
    info: 'Ensure that user access to the environment is controlled with security groups.

      In the Power Platform Admin Center:

      1. Log in to https://admin.powerplatform.microsoft.com and select the

      appropriate environment.

      2. Select Settings.

      3. Expand Users + permissions then select Security roles.

      4. Analyze the predefined Security Roles to determine which fits the environmental

      needs.

      5. Under the More actions click the 3 dots and select copy to audit the roles.'
    severity: medium
- id: '2.3'
  title: (L1) Ensure 'Set blocked file extensions' is configured to match the enterprise block list
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: This setting prevents the upload or download of certain attachment types that are considered dangerous.
  rationale: Dynamics 365 comes with a predefined extensions list that is blocked in the tool; it is required to have it as
    restricted as possible, allowing just the extensions that are required for business purposes. Consider updating the blocked
    extensions periodically.
  impact: File types that are legitimate might be blocked.
  references:
  - 1. https://docs.microsoft.com/en-us/power-platform/admin/settings-privacy-security
  page_start: 31
  audit_raw: 'Verify the ''Set blocked file extensions'' is configured to match the organizations block

    list.

    In the Power Platform Admin Center:

    1. Log in to https://admin.powerplatform.microsoft.com and select the

    appropriate environment.

    2. Select Settings.

    3. Expand Product then select Privacy + Security.

    4. Review the list extensions to ensure it matches the organizations block list.'
  remediation: 'Ensure the ''Set blocked file extensions'' is configured to match the organizations block

    list.

    In the Power Platform Admin Center:

    1. Log in to https://admin.powerplatform.microsoft.com and select the

    appropriate environment.

    2. Select Settings.

    3. Expand Product then select Privacy + Security.

    4. Add extensions as relevant to the organization.'
  checks:
  - type: manual_review
    info: 'Verify the ''Set blocked file extensions'' is configured to match the organizations block

      list.

      In the Power Platform Admin Center:

      1. Log in to https://admin.powerplatform.microsoft.com and select the

      appropriate environment.

      2. Select Settings.

      3. Expand Product then select Privacy + Security.

      4. Review the list extensions to ensure it matches the organizations block list.'
    severity: medium
- id: '2.4'
  title: (L2) Ensure 'Access to the environment is restricted by location'
  scoring: manual
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: Location condition in Azure AD Conditional Access, controls access to cloud apps based on the network location
    of a user. The location condition is commonly used to block access from countries/regions where organizations know traffic
    should not come from. Restrict access to users by location to reduce unauthorized access.
  rationale: Conditional access policies controls access to cloud apps based on the network location of a user. It then blocks
    access from countries/regions where it knows traffic should not come from reducing the risk of a breach.
  impact: 'When location restrictions are set in a user’s profile and the user tries to sign in from a blocked location, access
    to customer engagement apps (Dynamics 365 Sales, Dynamics 365 Customer Service, Dynamics 365 Field Service, Dynamics 365
    Marketing, Dynamics 365 Project Service Automation), and Finance and Operations apps are denied. Requirements for using
    conditional access: • A subscription to Azure Active Directory Premium. • A federated Azure Active Directory tenant.'
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/conditionalaccess/howto-conditional-access-policy-location#create-a-conditional-accesspolicy
  - 2. https://docs.microsoft.com/en-us/power-platform/admin/restrict-access-onlinetrusted-ip-rules
  page_start: 33
  audit_raw: 'Verify that access to the environment is restricted by location.

    In the Microsoft 365 Admin Center:

    1. Log in to https://admin.microsoft.com as a Global Administrator or

    Conditional Access administrator.

    2. Go to Admin centers and click on Azure Active Directory.

    3. Select Enterprise applications then, under Security, select Conditional

    Access.

    4. Ensure a policy exists to restrict location.'
  remediation: 'Ensure access to the environment is restricted by location.

    In the Microsoft 365 Admin Center:

    1. Log in to https://admin.microsoft.com as a Global Administrator or

    Conditional Access administrator.

    2. Go to Admin centers and click on Azure Active Directory.

    3. Select Enterprise applications then, under Security, select Conditional

    Access.

    4. Click New policy and create a name.

    5. Go to Assignments > Users or workload identity > Users and groups >

    6. Under Include > select All users (and do not exclude any user).

    7. Under Exclude, select Users and groups, add the organizations emergency

    access or break-glass accounts.

    8. Select Cloud apps or actions > Include and click Select apps

    9. Choose Microsoft Dataverse Application or Microsoft Dynamics ERP for

    Finance and Operations application.

    10. Select Conditions > Location configure to Yes

    11. Under Include select Selected locations

    a. Select the blocked location created for the organization.

    b. Click Select.

    12. Select Access controls > click Block Access and click Select.

    13. Confirm the settings and set Enable policy to Report-only.

    14. Click Create to create and enable the policy.'
  checks:
  - type: manual_review
    info: 'Verify that access to the environment is restricted by location.

      In the Microsoft 365 Admin Center:

      1. Log in to https://admin.microsoft.com as a Global Administrator or

      Conditional Access administrator.

      2. Go to Admin centers and click on Azure Active Directory.

      3. Select Enterprise applications then, under Security, select Conditional

      Access.

      4. Ensure a policy exists to restrict location.'
    severity: medium
- id: '2.5'
  title: (L1) Ensure 'Cross-tenant isolation is enabled for Power Platform Apps and Flows'
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'Microsoft Power Platform has a rich ecosystem of connectors based on Azure Active Directory (Azure AD) that
    allow authorized Azure AD users to build compelling apps and flows establishing connections to the business data available
    through these data stores. Tenant isolation makes it easy for administrators to ensure that these connectors can be harnessed
    in a safe and secure way within the tenant while minimizing the risk of data exfiltration outside the tenant. Tenant isolation
    allows admins to effectively govern the movement of tenant data from Azure AD authorized data sources to and from their
    tenant. With tenant isolation On, all tenants are restricted. Inbound (connections to the tenant from external tenants)
    and outbound (connections from the tenant to external tenants) cross-tenant connections are blocked by Power Platform
    even if the user presents valid credentials to the Azure AD-secured data source. Rules can be used to add exceptions.
    Note: Power Platform tenant isolation is different from Azure AD-wide tenant restriction. It doesn''t impact Azure AD-based
    access outside of Power Platform. Power Platform tenant isolation only works for connectors using Azure AD-based authentication
    such as Office 365 Outlook or SharePoint.'
  rationale: Cross-tenant isolation restricts how other tenants connect. Applied at the connector level, cross-tenant isolation
    blocks inbound or outbound connections for canvas apps and flows. An attacker can compromise an account and create a connection
    in order to maintain persistent access to the user’s account.
  impact: 'Restricting outbound connections means that a user is blocked from connecting to a third-party tenant. (Restricting
    outbound cross-tenant connections can be done using tenant restrictions that apply to all Azure Active Directory (Azure
    AD) software as a service (SaaS) cloud apps, or at the connector level, which would block outbound connections just for
    canvas apps and flows.) Restricting inbound connections means that a user in a third-party tenant is blocked from creating
    a connection to the tenant. (Restricting inbound cross-tenant connections requires a support ticket—this restriction then
    only applies to Power Apps and Power Automate.) Enable the configurations below will prevent communication with any other
    tenant. Warning: Perform an impact analysis before implementation. Requirements for using cross-tenant isolation: • A
    subscription to Azure Active Directory Premium. • A federated Azure Active Directory tenant. Admins can specify an explicit
    allowlist of tenants that they want to enable inbound, outbound, or both, which will bypass tenant isolation controls
    when configured. Admins can use a special pattern “*” to allow all tenants in a specific direction when tenant isolation
    is turned on. All other cross-tenant connections except the ones in the allowlist are rejected by Power Platform.'
  references:
  - 1. https://docs.microsoft.com/en-us/power-platform/admin/cross-tenant-restrictions
  - 2. https://docs.microsoft.com/en-us/azure/active-directory/manage-apps/tenantrestrictions
  page_start: 35
  audit_raw: 'Verify that cross-tenant isolation is enabled.

    In the Power Platform Admin Center:

    • Log in to https://admin.powerplatform.microsoft.com and select the

    appropriate environment.

    • Select Tenant isolation (preview).

    • Confirm that tenant isolation is on.'
  remediation: 'Ensure that tenant restrictions for outbound connections are setup:

    There are two steps to get started with tenant restrictions. First, make sure that clients

    can connect to the right addresses. Second, configure proxy infrastructure.

    1. URLs and IP addresses:

    a) To use tenant restrictions, clients must be able to connect to the following

    Azure AD URLs to authenticate: login.microsoftonline.com,

    login.microsoft.com, and login.windows.net.

    b) Additionally, to access Office 365, clients must also be able to connect to

    the fully qualified domain names (FQDNs), URLs, and IP addresses

    defined in Office 365 URLs and IP address ranges.

    2. Proxy configuration and requirements:

    a) The following configuration is required to enable tenant restrictions

    through the proxy infrastructure. This guidance is generic, refer to the

    proxy vendor'' documentation for specific implementation steps.

    b) Prerequisites:

    1. The proxy must be able to perform TLS interception, HTTP header

    insertion, and filter destinations using FQDNs/URLs.

    2. Clients must trust the certificate chain presented by the proxy for

    TLS communications. For example, if certificates from an internal

    public key infrastructure (PKI) are used, the internal issuing root

    certificate authority certificate must be trusted.

    3. Azure AD Premium 1 licenses are required for use of Tenant

    Restrictions.

    c) Configuration:

    1. For each outgoing request to login.microsoftonline.com,

    login.microsoft.com, and login.windows.net, insert two HTTP

    headers: Restrict-Access-To-Tenants and Restrict-AccessContext.

    Note: Do not include subdomains under *.login.microsoftonline.com in the proxy

    configuration. Doing so will include device.login.microsoftonline.com and will interfere

    with Client Certificate authentication, which is used in Device Registration and Devicebased Conditional Access scenarios.
    Configure the proxy server to exclude

    device.login.microsoftonline.com and enterpriseregistration.windows.net from

    TLS break-and-inspect and header injection.

    3. The headers should include the following elements:

    1. For Restrict-Access-To-Tenants, use a value of permitted tenant list,

    which is a comma-separated list of tenants that allow users to access. Any

    domain that is registered with a tenant can be used to identify the tenant in

    this list, as well as the directory ID itself. For an example of all three ways

    of describing a tenant, the name/value pair to allow Contoso, Fabrikam,

    and Microsoft looks like: Restrict-Access-To-Tenants:

    contoso.com,fabrikam.onmicrosoft.com,72f988bf-86f1-41af-91ab2d7cd011db47

    2. For Restrict-Access-Context, use a value of a single directory ID,

    declaring which tenant is setting the tenant restrictions.

    Example: Declare Contoso as the tenant that set the tenant restrictions policy, the

    name/value pair looks like: Restrict-Access-Context: 456ff232-35l2-5h23-b3b33236w0826f3d. Use the environments directory
    ID here to get logs for these

    authentications. If any directory ID other than the environments being set up, those

    sign-in logs will appear in another tenant, with all personal information removed. For

    more information, see Admin experience.

    To prevent users from inserting their own HTTP header with non-approved tenants, the

    proxy needs to replace the Restrict-Access-To-Tenants header if it is already present in

    the incoming request.

    Clients must be forced to use the proxy for all requests to login.microsoftonline.com,

    login.microsoft.com, and login.windows.net. For example, if PAC files are used to

    direct clients to use the proxy, end users shouldn''t be able to edit or disable the PAC

    files.

    4. Inbound Connections:

    1. Browse to the Power Platform admin center, select Help + support.

    2. Under the New support request option, fill out the information required

    regarding the environment.'
  checks:
  - type: manual_review
    info: 'Verify that cross-tenant isolation is enabled.

      In the Power Platform Admin Center:

      • Log in to https://admin.powerplatform.microsoft.com and select the

      appropriate environment.

      • Select Tenant isolation (preview).

      • Confirm that tenant isolation is on.'
    severity: medium
- id: '3.1'
  title: (L2) Ensure 'Environments with Critical Data are Encrypted with Customer Managed Keys'
  scoring: manual
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'All environments of Microsoft Dataverse use SQL Server Transparent Data Encryption (TDE) to perform real-time
    encryption of data when written to disk, also known as encryption at rest. By default, Microsoft stores and manages the
    database encryption key for environments. The manage keys feature in the Microsoft Power Platform admin center gives administrators
    the ability to self-manage the database encryption key that is associated with the Dataverse tenant. Enable sensitive
    data encryption at rest using Customer Managed Keys rather than Microsoft Managed keys. Note: This feature is only available
    in tenants with 1,000 or more users. An exception to this recommendation will be needed for those tenants that have under
    1,000 users.'
  rationale: By default, Microsoft stores and manages the database encryption key for organizational environments, so administrators
    don't have to. The manage keys feature in the Microsoft Power Platform admin center gives administrators the ability to
    selfmanage the database encryption key that is associated with the Dataverse tenant.
  impact: 'Using Customer Managed Keys may also incur additional man-hour requirements to create, store, manage, and protect
    the keys as needed. Note: It is strongly recommended that a copy of the encryption key is made and stored in a safe place.
    The key may need to be entered again to ensure that certain features keep working and the data is retrievable. For more
    information, see Data Encryption. Changing the encryption key can take a long time in a large database. Run this operation
    during off-peak hours if the system is busy or when working with a large amount of data. Note #2: This feature is only
    available in tenants with 1,000 or more users. An exception to this recommendation will be needed for those tenants that
    have under 1,000 users.'
  references:
  - 1. https://docs.microsoft.com/en-us/power-platform/admin/data-encryption
  - 2. https://docs.microsoft.com/en-us/power-platform/admin/manage-encryption-key
  page_start: 41
  audit_raw: 'Ensure that Customer Managed Keys are utilized.

    In the Power Platform Admin Center:

    1. Log in to https://admin.powerplatform.microsoft.com and select the

    appropriate environment.

    2. Select Settings at the top of the screen.

    3. Expand Encryption then select Data encryption

    A new window will open and may be slow to load

    4. Ensure Encryption status is set to Active

    5. Ensure self-managed encryption keys are utilized.

    6. Click Close (data will not be re-encrypted).'
  remediation: 'Configure Customer Managed Keys.

    In the Power Platform Admin Center:

    1. Log in to https://admin.powerplatform.microsoft.com and select the

    appropriate environment.

    2. Select Settings at the top of the screen.

    3. Expand Encryption then select Data encryption

    A new window will open and may be slow to load

    4. Ensure Encryption status is set to Active

    5. Under Change Encryption Key insert the new key followed by Change

    Note: It is important to safeguard the encryption key.

    6. Click Close'
  checks:
  - type: manual_review
    info: 'Ensure that Customer Managed Keys are utilized.

      In the Power Platform Admin Center:

      1. Log in to https://admin.powerplatform.microsoft.com and select the

      appropriate environment.

      2. Select Settings at the top of the screen.

      3. Expand Encryption then select Data encryption

      A new window will open and may be slow to load

      4. Ensure Encryption status is set to Active

      5. Ensure self-managed encryption keys are utilized.

      6. Click Close (data will not be re-encrypted).'
    severity: medium
