  title: (L1) Ensure 'Environment Activity logging is Enabled'
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: Activity logging track changes to organizational data and maintain a log of those changes.
  rationale: Enabling Power Platform Activity logging helps the security teams to investigate activities for regular security
    operational or forensic purposes. The auditing feature is designed to meet the auditing, compliance, security, and governance
    policies of many regulated enterprises.
  impact: It is required to plan and evaluate the log size for impact to storage/costs.
  references:
  - 1. https://docs.microsoft.com/en-us/power-platform/admin/enable-usecomprehensive-auditing#enable-auditing
  - 2. https://docs.microsoft.com/en-us/power-platform/admin/system-settings-dialogbox-auditing-tab
  page_start: 54
