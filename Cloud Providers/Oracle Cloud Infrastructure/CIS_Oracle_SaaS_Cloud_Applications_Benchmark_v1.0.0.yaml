  title: Ensure Unused Business Setups Are Disabled
  scoring: manual
  profile:
  - Level 1
  description: The purpose of this recommendation is to ensure that unused business setups are disabled, or if they cannot
    or should not be disabled, that the actions they allow are monitored. Business setups could include ledgers, suppliers,
    and customers, to name only a few.
  rationale: An unused setup could be discovered by a user, then used either erroneously or maliciously. For example, journal
    entries could be made to unused ledgers, with subsequent impact on financial reporting accuracy; purchase orders, invoices
    and payments could be attributed to unused suppliers, resulting in lost cash; and goods or services could be attributed
