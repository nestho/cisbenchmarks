controls:
- id: '1.1'
  title: Ensure Password Policy Enforces Length and Rotation
  scoring: manual
  profile:
  - Level 1
  description: 'A strong password policy helps protect Oracle Fusion and EPM SaaS environments against unauthorized access
    by enforcing minimum standards for password length, rotation, and reuse prevention for both user and administrative accounts.
    Administrators can configure password policies in: • Fusion SaaS (pre-upgrade environments): Security Console Administration
    Password Policy • Fusion SaaS (upgraded environments) and Oracle EPM: OCI IAM Identity Domain Console Recommended Configuration:
    • Require passwords to be at least 14 characters in length. • Prevent reuse of the last five passwords. • Require administrative
    passwords to expire and be changed at least every 365 days. • Lock accounts after five failed login attempts. These parameters
    are available and enforceable in both pre-upgrade and post-upgrade identity configurations across Oracle Fusion and EPM
    SaaS applications.'
  rationale: Enforcing password length and rotation reduces the likelihood that weak or compromised passwords are exploited
    to gain unauthorized access. Overly frequent password changes can lead to insecure workarounds such as predictable patterns
    or insecure storage. Use of longer password utilizing passphrases should be encouraged to make passwords easier for users
    to remember. Balance password policy strictness with usability, and complement with multi-factor authentication (MFA)
    to minimize reliance on passwords alone.
  impact: ''
  references:
  - 1. https://docs.oracle.com/en/cloud/saas/human-resources/ochus/passwordpolicy.html
  - 2. https://docs.oracle.com/en/cloud/saas/enterprise-performance-managementcommon/cgsad/setting_password_policies.html
  page_start: 17
  audit_raw: 'For pre-upgrade environments:

    1. Sign in as a Security Administrator or IT Security Manager.

    2. Navigate to Tools, Security Console, Administration, Password Policy.

    3. Verify that:

    • Minimum length is ≥ 14 characters.

    • Password expiration is ≤ 365 days.

    • Password reuse prevention is ≥ 5 previous passwords.

    • Account lockout triggers after ≤ 5 failed login attempts.

    For EPM and post-upgrade environments (OCI IAM Identity Domain):

    1. In the OCI Console, go to Identity & Security, Domains, Security,

    Password Policy.

    2. Confirm the equivalent settings:

    • Minimum length ≥ 14.

    • Expiration ≤ 365 days.

    • Password history ≥ 5.

    • Account lockout ≤ 5 failed attempts.

    3. Ensure lockout duration and auto-unlock timing meet organizational

    requirements.'
  remediation: 'Pre-upgrade (Security Console):

    1. Navigate to Navigator Tools, Security Console, Administration, Password

    Policy.

    2. Configure the following values:

    • Minimum Length: 14

    • Require Numbers: No

    • Require Special Characters: No

    • Password Expiration (Days): 365

    • Prevent Reuse of Last Passwords: 5

    • Failed Sign-In Attempts Before Lockout: 5

    3. Save and communicate changes to all users.

    EPM & Post-upgrade (OCI IAM Identity Domain):

    1. In the OCI Console, open the Identity Domain Security, Password Policy.

    2. Configure equivalent parameters for length, complexity, expiration, reuse

    prevention, and lockout.

    3. Save policy updates; they take immediate effect for all users.'
  checks:
  - type: manual_review
    info: 'For pre-upgrade environments:

      1. Sign in as a Security Administrator or IT Security Manager.

      2. Navigate to Tools, Security Console, Administration, Password Policy.

      3. Verify that:

      • Minimum length is ≥ 14 characters.

      • Password expiration is ≤ 365 days.

      • Password reuse prevention is ≥ 5 previous passwords.

      • Account lockout triggers after ≤ 5 failed login attempts.

      For EPM and post-upgrade environments (OCI IAM Identity Domain):

      1. In the OCI Console, go to Identity & Security, Domains, Secur'
    severity: medium
- id: '1.2'
  title: Ensure MFA is Enforced for All SaaS Users
  scoring: manual
  profile:
  - Level 1
  description: Multi-Factor Authentication (MFA) requires users to present an additional verification factor beyond username
    and password. In Oracle Fusion environments, native MFA enforcement via Identity Domain sign-on policies functions only
    after the environment’s identity service is upgraded to OCI IAM. For environments not yet upgraded, MFA must remain delegated
    to an external IdP or await the identity upgrade. Where supported, phishing-resistant factors (for example, FIDO2/WebAuthn
    passkeys or hardware security keys) are preferred over SMS or email OTP.
  rationale: MFA protects against credential theft and password reuse attacks. Enforcing MFA across all SaaS users - whether
    they authenticate through the Fusion Identity Domain, an external OCI IAM domain, or another IdP—provides consistent protection
    and centralized policy control.
  impact: After enabling native MFA, some SaaS users may face login friction or need guidance to enroll. Legacy integrations
    or non-interactive accounts may require updates. Before the identity upgrade, users must rely on IdP enforcement or delay
    MFA enforcement in the environment itself.
  references:
  - 1. https://docs.oracle.com/en/cloud/saas/applications-common/25d/faser/enablemultifactor-authentication.html
  - 2. https://docs.oracle.com/en-us/iaas/Content/Identity/Tasks/usingmfa.htm
  page_start: 20
  audit_raw: '1. Check if the Fusion environment is upgraded to OCI IAM or uses an external IdP.

    2. If on OCI IAM, review Security Console, User Categories, Two-Factor

    Authentication and confirm all user categories have MFA enabled.

    3. If identity upgrade is not yet performed, verify that MFA is enforced via the

    external IdP for all users.

    4. Test login with a standard SaaS user account and confirm MFA is required

    (native or via IdP).'
  remediation: '1. If the Fusion environment is upgraded to OCI IAM:

    • In Fusion Security Console User Categories, Two-Factor Authentication,

    enable MFA for all categories.

    2. If the environment is not upgraded or uses a federated IdP:

    • Enable MFA in the external IdP or external OCI IAM domain and ensure it

    applies to all users accessing Fusion.

    3. Communicate enrollment instructions and verify MFA enrollment via Fusion My

    Profile, Manage Secure Verification.

    4. Perform test logins to confirm MFA prompts are consistently applied.'
  checks:
  - type: manual_review
    info: '1. Check if the Fusion environment is upgraded to OCI IAM or uses an external IdP.

      2. If on OCI IAM, review Security Console, User Categories, Two-Factor

      Authentication and confirm all user categories have MFA enabled.

      3. If identity upgrade is not yet performed, verify that MFA is enforced via the

      external IdP for all users.

      4. Test login with a standard SaaS user account and confirm MFA is required

      (native or via IdP).'
    severity: medium
- id: '1.3'
  title: Ensure Phishing-Resistant MFA Is Enforced for SaaS Administrators and Privileged Accounts
  scoring: manual
  profile:
  - Level 1
  description: Multi-Factor Authentication (MFA) requires users to present an additional verification factor beyond username
    and password. In Oracle Fusion environments, native MFA enforcement via Identity Domain sign-on policies functions only
    after the environment’s identity service is upgraded to OCI IAM or an external IdP. For environments not yet upgraded,
    MFA must be delegated to an external IdP or await the identity upgrade. SaaS Administrators and other SaaS privileged
    accounts must authenticate using phishing-resistant MFA methods such as FIDO2/WebAuthn security keys, platform passkeys,
    or passwordless authentication. Weaker factors such as SMS OTP or email OTP should be disabled for administrative and
    privileged accounts.
  rationale: Privileged accounts are high-value targets. Enforcing MFA with phishing resistant factors reduces the risk of
    unauthorized administrative access even if credentials are compromised. To use native MFA, the identity service must be
    on OCI IAM, which provides the required support for enforcing sign-on policies and MFA natively.
  impact: Enabling native MFA with phishing resistant post-upgrade may cause disruption if SaaS users do not enroll or if
    legacy integrations require reconfiguration. Until the identity upgrade is complete, SaaS administrators must rely on
    IdP-based MFA or delay enforcement.
  references:
  - 1. docs.oracle.com/en/cloud/saas/applications-common/25c/oacpr/set-upmultifactor-authentication-methods.html
  - 2. https://docs.oracle.com/en-us/iaas/Content/Identity/Tasks/usingmfa.htm
  page_start: 22
  audit_raw: '1. Determine if the Fusion environment has been upgraded to use OCI IAM (check

    Fusion environment’s maintenance/upgrade status) or is using an external IdP

    for MFA.

    2. Access the Security Console User Categories Two-Factor Authentication

    and confirm SaaS administrators/privileged categories have MFA enabled. Only

    enable factors that are considered phishing resistant.

    3. If identity upgrade has not occurred, verify that MFA is enforced via the external

    IdP for privileged accounts.

    4. Test login with a privileged account and confirm MFA prompt is required (native

    or via IdP).'
  remediation: '1. If identity upgrade is not finalized implement MFA via the external IdP.

    2. After the upgrade, in the Security Console open User Categories Two-Factor

    Authentication and enable MFA for administrator/privileged categories.

    3. Define valid phishing resistant MFA factors (mobile authenticator, FIDO, etc.).

    4. Save settings and ensure SaaS users enroll in MFA during their next login.

    5. Test that privileged accounts require MFA (OCI IAM) and fallback to IdP

    enrollment where needed.'
  checks:
  - type: manual_review
    info: '1. Determine if the Fusion environment has been upgraded to use OCI IAM (check

      Fusion environment’s maintenance/upgrade status) or is using an external IdP

      for MFA.

      2. Access the Security Console User Categories Two-Factor Authentication

      and confirm SaaS administrators/privileged categories have MFA enabled. Only

      enable factors that are considered phishing resistant.

      3. If identity upgrade has not occurred, verify that MFA is enforced via the external

      IdP for privileged accounts.

      4. Test login w'
    severity: medium
- id: '1.4'
  title: Ensure Fusion Applications Administrators Have Access Only to Fusion Applications Resources
  scoring: manual
  profile:
  - Level 2
  description: Ensure that Fusion Applications Administrators are granted Console access only to Fusion Applications resources.
    Their IAM policies must be scoped exclusively to the fusion-applications-family resource type, without granting access
    to other OCI services.
  rationale: Fusion Applications Administrators are responsible for managing SaaS environments, not the broader OCI infrastructure.
    Granting them access to additional OCI services (for example, Compute, Networking, Object Storage) is unnecessary and
    increases the attack surface. Restricting their access to Fusion Applications resources enforces least privilege, reduces
    risk of accidental or malicious changes to unrelated services, and aligns with compliance requirements for segregation
    of duties.
  impact: Fusion Applications Administrators will not be able to manage or view non-Fusion OCI services in the Console. Separate
    administrative groups must be established for infrastructure or cross-service management. Organizations must ensure that
    Fusiononly administrators are properly segregated from broader OCI admin groups.
  references:
  - 1. https://docs.oracle.com/en-us/iaas/Content/fusion-applications/managingaccess.htm#iam-resource-type
  - 2. https://docs.oracle.com/en-us/iaas/Content/Identity/Concepts/policyoverview.htm
  page_start: 24
  audit_raw: '1. Navigate to Identity & Security Policies.

    2. Review policies attached to groups containing Fusion Applications

    Administrators.

    3. Confirm that:

    • Policies use the fusion-applications-family resource type.

    • No broad tenancy-wide permissions (such as manage all-resources or unrelated

    service resource types) are present.

    4. Verify that Console access for Fusion Administrators shows only Fusion

    Applications in the navigation menu.'
  remediation: '1. Identify the group(s) used for Fusion Applications Administrators (e.g.,

    FusionAdmins).

    2. Remove any existing policies that provide access to non-Fusion OCI services.

    3. Create or update the policy to restrict privileges to Fusion Applications only:

    • For administrators:

    Allow group FusionAdmins to manage fusion-applications-family in

    tenancy

    • For read-only roles (if needed):

    Allow group FusionViewers to read fusion-applications-family in

    tenancy'
  checks:
  - type: manual_review
    info: '1. Navigate to Identity & Security Policies.

      2. Review policies attached to groups containing Fusion Applications

      Administrators.

      3. Confirm that:

      • Policies use the fusion-applications-family resource type.

      • No broad tenancy-wide permissions (such as manage all-resources or unrelated

      service resource types) are present.

      4. Verify that Console access for Fusion Administrators shows only Fusion

      Applications in the navigation menu.'
    severity: medium
- id: '1.5'
  title: Ensure OCI Console Access Is Restricted to Administrative Accounts
  scoring: manual
  profile:
  - Level 1
  description: Ensure that only designated administrative accounts are allowed to log in to the Oracle Cloud Infrastructure
    (OCI) Console. All non-admin user accounts must have the console password capability disabled, and sign-on policies must
    restrict Console application access to administrative groups only.
  rationale: The OCI Console provides broad administrative access. Restricting console login exclusively to administrative
    accounts minimizes the risk of unauthorized changes and reduces the attack surface in case of credential compromise. Non-administrative
    users can still interact with OCI through APIs, SDKs, or federated identity providers without requiring console access.
  impact: Users without console access must rely on alternate methods (API, SDK, CLI, or federated IdP). Organizations must
    maintain a secure break-glass account to avoid lockouts.
  references:
  - 1. https://docs.oracle.com/en-us/iaas/Content/Identity/users/edit-userscapabilities.htm
  - 2. https://docs.oracle.com/en/learn/access-to-oci-console/index.html
  page_start: 26
  audit_raw: '1. Navigate to Identity & Security Domains Users.

    • For each non-admin user, confirm that Can use Console password is unchecked

    under Edit User Capabilities.

    2. Navigate to Domains Security Sign-On Policies.

    • Verify there is a policy rule that allows Console access only for designated

    administrative groups.

    • Confirm that a deny rule is in place for all other users.'
  remediation: '1. For each non-admin user:

    • Navigate to Identity & Security Domains Edit User Capabilities.

    • Uncheck Can use Console password.

    • Save changes.

    2. Update the Sign-On Policy for the identity domain:

    • Add a rule that allows Console login only for users in an Admin group.

    • Add a default deny rule for all other users.

    3. Test the configuration by attempting Console login with both an admin and a nonadmin account.'
  checks:
  - type: manual_review
    info: '1. Navigate to Identity & Security Domains Users.

      • For each non-admin user, confirm that Can use Console password is unchecked

      under Edit User Capabilities.

      2. Navigate to Domains Security Sign-On Policies.

      • Verify there is a policy rule that allows Console access only for designated

      administrative groups.

      • Confirm that a deny rule is in place for all other users.'
    severity: medium
- id: '1.6'
  title: Ensure Privileged and Administrative Roles Are Restricted to Known IP Addresses
  scoring: manual
  profile:
  - Level 1
  description: When Location-Based Access Control (LBAC) is enabled in Oracle Fusion Applications, administrative and privileged
    roles must not be configured for unrestricted access. In the Fusion Security Console, privileged roles such as IT Security
    Manager and Application Implementation Consultant include the option “Enable Role for Access from All IP Addresses.” This
    setting should remain disabled, ensuring these roles can only be accessed from known and approved IP ranges defined within
    the LBAC configuration or associated network perimeter.
  rationale: Restricting administrative and privileged access to known IP ranges prevents unauthorized or high-risk logins
    from untrusted networks. This measure reduces the attack surface for high-privilege accounts and aligns with the principle
    of least privilege by ensuring elevated functions are only available from managed corporate networks or approved secure
    endpoints.
  impact: Enforcing IP restrictions may require administrators to connect through approved corporate networks, VPNs, or bastion
    environments. Improperly configured IP ranges could temporarily block administrative access until corrected, so changes
    should be planned and verified in advance.
  references:
  - 1. https://docs.oracle.com/en/cloud/saas/human-resources/ochus/overview-oflocation-based-access.html
  - 2. https://docs.oracle.com/en/cloud/saas/human-resources/ochus/enable-anddisable-location-based-access.html
  page_start: 28
  audit_raw: '1. Confirm that LBAC is enabled for the Fusion environment.

    2. Sign in to Fusion Security Console with appropriate privileges.

    3. Navigate to Roles, Search, IT Security Manager (and other privileged roles).

    4. Open the role and go to the Administration tab.

    5. Verify that the checkbox Enable Role for Access from All IP Addresses

    is not selected.

    6. Confirm that privileged roles are associated with the intended network perimeter

    or known IP range within LBAC configuration.'
  remediation: '1. Sign in to Fusion Security Console with an administrative account.

    2. Navigate to Roles, Search, IT Security Manager (or equivalent privileged

    roles).

    3. Go to the Administration tab and ensure the checkbox Enable Role for

    Access from All IP Addresses is cleared.

    4. Verify that the role is correctly assigned to the appropriate network perimeter

    under LBAC settings, restricting access to known IP ranges.

    5. Test access from a trusted IP and confirm the role remains functional; test from

    an unapproved IP to confirm access is denied.'
  checks:
  - type: manual_review
    info: '1. Confirm that LBAC is enabled for the Fusion environment.

      2. Sign in to Fusion Security Console with appropriate privileges.

      3. Navigate to Roles, Search, IT Security Manager (and other privileged roles).

      4. Open the role and go to the Administration tab.

      5. Verify that the checkbox Enable Role for Access from All IP Addresses

      is not selected.

      6. Confirm that privileged roles are associated with the intended network perimeter

      or known IP range within LBAC configuration.'
    severity: medium
- id: '1.7'
  title: Ensure Privileged Access is Certified Periodically
  scoring: manual
  profile:
  - Level 1
  description: The purpose of this recommendation is to ensure that only authorized users retain elevated access, by reviewing
    users' abilities periodically - monthly for IT administrators and quarterly for others.
  rationale: Users could accumulate roles and data access as their responsibilities change, giving them elevated or unintended
    abilities that they could use erroneously or maliciously with substantial impact on operations and finances.
  impact: If users are allowed to retain those abilities, and the consequences are not reviewed, the responsibility for being
    aware of the consequences must be accomplished through another means. Fusion Application performance is not impacted.
  references:
  - 1. https://community.oracle.com/customerconnect/discussion/551382/digitizeaccess-certification-workflows
  - 2. https://community.oracle.com/customerconnect/discussion/579152/continuouslymonitor-transactions
  page_start: 30
  audit_raw: 'Review users'' abilities

    Manual method:

    1. Navigate to Tools Scheduled Processes

    2. Review User and Role Access Audit Report and User Role Membership

    Report (or schedule them, then review them).

    Automated method:

    1. Initiate one or more Access Certification campaigns in Fusion Cloud Applications

    Risk Management using the instructions in Digitize Access Certification

    Workflows.

    2. For example, initiate campaigns to review users with unauthorized access; detect

    privilege creep (accumulation of access no longer required); or detect users,

    organizations or roles recently added or not included in the reviews.'
  remediation: 'When a role should be removed from a user either:

    • Remove unwanted role.

    • Leave role and monitor the transactions performed by the user (see below).

    1. Review the user''s actions since the previous review:

    Manual method:

    1. Navigate to Tools Reports and Analytics.

    2. Select the appropriate dashboards or reports.

    3. Review the transactions that the role allows.

    Automated method: 1.Create Transaction Controls in Fusion Cloud Applications Risk

    Management that continuously monitor those transactions and initiate investigation

    workflows when unwanted activity occurs.

    1. Deploy the appropriate controls using the instructions in Continuously Monitor

    Transactions.'
  checks:
  - type: manual_review
    info: 'Review users'' abilities

      Manual method:

      1. Navigate to Tools Scheduled Processes

      2. Review User and Role Access Audit Report and User Role Membership

      Report (or schedule them, then review them).

      Automated method:

      1. Initiate one or more Access Certification campaigns in Fusion Cloud Applications

      Risk Management using the instructions in Digitize Access Certification

      Workflows.

      2. For example, initiate campaigns to review users with unauthorized access; detect

      privilege creep (accumulation of acce'
    severity: medium
- id: '1.8'
  title: Ensure Oracle Break Glass for Fusion Cloud Service Is Enabled
  scoring: manual
  profile:
  - Level 2
  description: Oracle Break Glass for Fusion Cloud Service provides a customer-controlled workflow that governs Oracle personnel’s
    emergency access to the Fusion Cloud database and middleware tiers. When enabled, Oracle cannot access customer data without
    explicit approval from your designated administrators for each one-off service activity.
  rationale: Activating and monitoring the Break Glass service ensures that privileged Oracle support access occurs only under
    strict governance, audit logging, and time-bound approvals, reducing insider and third-party access risk.
  impact: Minimal operational impact and a one time fee. Requires process awareness among administrators to review and approve
    Oracle access requests promptly when raised.
  references:
  - 1. Oracle Break Glass for Fusion Cloud Service -
  - https://docs.oracle.com/en/cloud/get-started/subscriptions-cloud/mmocs/oraclebreak-glass-fusion-cloud-service.html
  - 2. https://www.oracle.com/latam/a/ocom/docs/corporate/pricing/oracle-fusion-cloudglobal-price-list.pdf
  page_start: 32
  audit_raw: 'In console:

    1. Go to: Access Oracle Cloud Console

    2. Select My Services → Subscriptions → Fusion Cloud Service

    3. Verify that Break Glass status is Enabled

    4. Verify that designated approvers are defined in the workflow

    5. Verify that post-access revocation and audit logs are retained'
  remediation: 'In console:

    1. Activate Break Glass service via Oracle Cloud Subscription management.

    2. Define approvers (Fusion Cloud Administrators).

    3. Enable notifications for Break Glass request/approval activities.

    4. Enable post-access revocation and audit logs are retained'
  checks:
  - type: manual_review
    info: 'In console:

      1. Go to: Access Oracle Cloud Console

      2. Select My Services → Subscriptions → Fusion Cloud Service

      3. Verify that Break Glass status is Enabled

      4. Verify that designated approvers are defined in the workflow

      5. Verify that post-access revocation and audit logs are retained'
    severity: medium
- id: '1.9'
  title: Ensure Basic Authentication Is Blocked for SOAP and REST API Integrations
  scoring: manual
  profile:
  - Level 2
  description: Organizations must block the use of Basic Authentication for all SOAP and REST API integrations with Oracle
    SaaS Applications. This can be achieved by disabling Basic Authentication at the Fusion Applications layer and enforcing
    OAuth 2.0 as the only supported authentication method. Automated monitoring of Fusion audit logs and OCI IAM authentication
    logs should also be configured to detect and alert on attempted Basic Authentication use.
  rationale: Blocking Basic Authentication prevents insecure clients from connecting, even if misconfigured. Combined with
    monitoring, this ensures that only OAuth tokens are accepted, reducing exposure to replay attacks, credential theft, and
    non-compliant integrations.
  impact: Blocking Basic Authentication may cause disruptions for legacy integrations that have not yet been migrated. Organizations
    must ensure migration to OAuth is complete before disabling Basic Authentication globally.
  references:
  - 1. https://blogs.oracle.com/cloud-infrastructure/post/secure-api-access-in-oraclefusion-applications
  - 2. https://blogs.oracle.com/ateam/post/implement-jwt-token-authentication-withfusion-cloud-application-restsoap-extend-in-nodejs-based-applications
  page_start: 34
  audit_raw: '1. Review your Service Request history with Oracle to confirm a request has been

    submitted to disable Basic Auth for APIs.

    2. Confirm Oracle’s response/documentation showing that Basic Auth is disabled in

    the environment.

    3. Attempt API calls using Basic Authentication and verify they fail.

    4. Use supported authentication (JWT, SAML, OAuth) to confirm the API works with

    secure methods.'
  remediation: '1. Submit a Service Request to Oracle SaaS Operations asking to disable Basic

    Authentication for APIs in your Fusion instance.

    2. Include details of your current integrations (endpoints, methods) that rely on

    Basic Auth.

    3. Confirm with Oracle that Basic Auth has been disabled in your environment.

    4. Update all integrations to use supported methods (JWT, OAuth, SAML) per

    Oracle guidance.

    5. Test all APIs to validate they function correctly under the new authentication

    method.'
  checks:
  - type: manual_review
    info: '1. Review your Service Request history with Oracle to confirm a request has been

      submitted to disable Basic Auth for APIs.

      2. Confirm Oracle’s response/documentation showing that Basic Auth is disabled in

      the environment.

      3. Attempt API calls using Basic Authentication and verify they fail.

      4. Use supported authentication (JWT, SAML, OAuth) to confirm the API works with

      secure methods.'
    severity: medium
- id: '1.10'
  title: Ensure All API Based Integrations Use OAuth Authentication
  scoring: manual
  profile:
  - Level 1
  description: All API based integrations with Oracle SaaS Applications must use OAuth 2.0 authentication configured through
    the Fusion Identity Domain. Basic Authentication, long-lived static passwords, or legacy authentication mechanisms must
    not be used for API or integration access. OAuth provides secure, token-based authentication with support for scopes,
    expiration, and revocation.
  rationale: Basic Authentication and static credentials present significant risks, including credential theft, replay attacks,
    and the inability to enforce least-privilege access. Modern integrations require stronger controls to protect sensitive
    business transactions and data. Enforcing OAuth for all API and integration access aligns with industry standards and
    provides stronger security controls, including token expiration, scoped access, and easier revocation.
  impact: Migrating legacy SOAP or REST integrations from Basic Authentication to OAuth may require reconfiguration and development
    effort. This transition ensures greater security and long-term supportability.
  references:
  - 1. https://docs.oracle.com/en/cloud/saas/applications-common/25d/oaext/configureoauth.html
  - 2. https://blogs.oracle.com/cloud-infrastructure/post/secure-api-access-in-oraclefusion-applications
  page_start: 36
  audit_raw: '1. Review all configured SOAP and REST integrations in Fusion Applications and

    Oracle Integration Cloud.

    2. Confirm that integration clients are registered as OAuth clients in the Fusion

    Identity Domain and that Basic Authentication credentials are not in use.

    3. Examine Fusion audit logs to identify API requests authenticated with Basic

    Authentication.

    4. Review OCI IAM Identity Domain authentication logs to confirm that API access

    tokens are issued via OAuth flows only.

    5. Validate that no unscoped or legacy credentials are present in active

    integrations.'
  remediation: '1. Identify integrations currently using Basic Authentication by reviewing Fusion

    audit logs and OCI IAM authentication records.

    2. Register OAuth clients in the Fusion Identity Domain for each integration,

    assigning only the required scopes and authorized resources.

    3. Reconfigure integrations to use OAuth tokens in place of Basic Authentication

    credentials.

    4. Disable or revoke Basic Authentication credentials in Fusion Applications and

    IAM domains.

    5. Establish a recurring process to review Fusion and IAM logs to detect any

    attempted Basic Authentication use.'
  checks:
  - type: manual_review
    info: '1. Review all configured SOAP and REST integrations in Fusion Applications and

      Oracle Integration Cloud.

      2. Confirm that integration clients are registered as OAuth clients in the Fusion

      Identity Domain and that Basic Authentication credentials are not in use.

      3. Examine Fusion audit logs to identify API requests authenticated with Basic

      Authentication.

      4. Review OCI IAM Identity Domain authentication logs to confirm that API access

      tokens are issued via OAuth flows only.

      5. Validate that no uns'
    severity: medium
- id: '1.11'
  title: Ensure Integration Account Secrets Are Rotated on a Regular Schedule
  scoring: manual
  profile:
  - Level 1
  description: Oracle SaaS environments often integrate with external systems using service accounts, OAuth clients, JWT signing
    keys, and X.509 certificates. These credentials are typically long-lived and, if not rotated regularly, may be compromised
    or reused by unauthorized parties. Organizations should enforce a policy to rotate all integration account secrets on
    a defined schedule, for example every 90 or 180 days, and update dependent integrations accordingly.
  rationale: Long-lived credentials represent a significant risk if stolen, exposed in logs, or left unmanaged. Regular rotation
    reduces the risk window for credential misuse and aligns with best practices for key management. Scheduled rotation ensures
    that even if a secret is compromised, it cannot be abused indefinitely.
  impact: Rotating integration secrets requires careful planning and coordination, as dependent applications and partners
    must update their configurations. Failure to update all endpoints may result in temporary service disruptions. Organizations
    must balance operational overhead with security benefits.
  references:
  - 1. https://docs.oracle.com/en/cloud/saas/applications-common/25c/oaext/configureoauth.html
  - 2. https://docs.oracle.com/en/cloud/saas/applications-common/25d/faser/overviewof-certificates.html
  page_start: 38
  audit_raw: '1. Review integration accounts in Oracle Fusion Applications and identify all OAuth

    clients, JWT keys, and certificates in use.

    2. Confirm that each credential has a documented rotation policy, including

    expiration and renewal dates.

    3. Validate logs or change records to confirm that credentials have been rotated

    within the organization’s defined schedule (for example, within the past 180

    days).

    4. Check for expired or inactive credentials and confirm they are removed from

    production environments.'
  remediation: '1. Develop an inventory of all integration account secrets, including OAuth

    credentials, JWT keys, and certificates.

    2. Define a rotation schedule (for example, 90 or 180 days) aligned with

    organizational policy and compliance requirements.

    3. Rotate each credential according to the schedule, updating dependent

    integrations and notifying stakeholders.

    4. Remove or revoke any unused or expired credentials to reduce the attack

    surface.

    5. Document the process and maintain records of all credential rotations for audit

    purposes.'
  checks:
  - type: manual_review
    info: '1. Review integration accounts in Oracle Fusion Applications and identify all OAuth

      clients, JWT keys, and certificates in use.

      2. Confirm that each credential has a documented rotation policy, including

