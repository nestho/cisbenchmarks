- id: '4.4'
  title: Ensure Uploaded Files Are Scanned for Viruses and Restricted by Extension Policy
  scoring: manual
  profile:
  - Level 1
  description: In Oracle EPM Cloud, you can enable pre-upload virus scanning using the setVirusScanOnFileUploads command so
    that files with malware are blocked before upload. In addition, enforce a file extension policy to restrict potentially
    dangerous file types (executables, scripts) from being uploaded.
  rationale: Automatically scanning files before upload prevents malicious content from entering the environment. Combined
    with extension restrictions, this defense-in-depth approach reduces the risk from malware, ransomware, or embedded scripts
    being introduced via file upload.
  impact: Enabling scanning may slow upload processes slightly, and extension restrictions may block business-required files
    that are uncommon. An exception approval process may be needed.
  references:
  - 1. https://docs.oracle.com/en/cloud/saas/enterprise-performance-managementcommon/cepma/epm_auto_set_virus_scan_onfile_uploads.html
  - 2. https://docs.oracle.com/en/cloud/saas/enterprise-performance-managementcommon/cepma/epm_auto_upload_file.html
  page_start: 89
  audit_raw: '1. Run epmautomate getVirusScanOnFileUploads to check whether scanning is

    enabled. If it returns false, scanning is not enforced. ￼

    2. Confirm that the file upload behavior prevents known malicious signatures (e.g.

    test with EICAR file) or rejects infected files.

    3. Review documentation or environment settings that disallow certain binary file

    types (e.g. .exe, .bat, .msi, .vbs) as indicated in the uploadFile command spec.

    4. Ensure that only Service Administrators have permission to run

    setVirusScanOnFileUploads.

    5. Verify that any exceptions to the extension allow/deny policy are documented

    and reviewed.'
  remediation: '• Use epmautomate setVirusScanOnFileUploads true to enable virus

    scanning before files are uploaded. ￼

    • If needed, define or refine a policy of allowed and disallowed extension types to

    block risky formats.

    • Test uploads to validate scanning and blocking is working as expected.

    • Ensure that role assignment is controlled so only trusted Service Administrators

    can modify scan settings.

    • Document exception handling (for business-justified file types) and apply

    compensating controls.'
  checks:
  - type: manual_review
    info: '1. Run epmautomate getVirusScanOnFileUploads to check whether scanning is

      enabled. If it returns false, scanning is not enforced. ￼

      2. Confirm that the file upload behavior prevents known malicious signatures (e.g.

