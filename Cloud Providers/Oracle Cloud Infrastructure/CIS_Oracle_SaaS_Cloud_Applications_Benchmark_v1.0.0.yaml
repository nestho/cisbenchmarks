      within the organization’s defined schedule (for example, within the past 180

      days).

      4. Check for expired or inactive credentials and confirm they are removed from

      production environment'
    severity: medium
- id: '1.12'
  title: Ensure EPM Automate Credentials Are Protected via Secure Storage
  scoring: manual
  profile:
  - Level 1
  description: EPM Automate requires credentials to execute commands such as data load, snapshot management, or audit log
    export. These credentials must never be stored in plaintext within scripts or configuration files. Instead, credentials
    must be secured using Oracle’s encrypted password file (created with the encrypt command) or by integrating with secure
    enterprise credential vaults and OS-level key stores.
  rationale: Storing credentials in plaintext exposes privileged accounts to theft and misuse. EPM Automate is commonly executed
    with Service Administrator-level rights, making it a high-value target. Using the encrypted password file or secure storage
    mechanisms significantly reduces the risk of credential exposure and aligns with security best practices.
  impact: Adopting encrypted storage introduces operational overhead (managing encrypted files, updating scripts, rotating
    credentials). However, the risks of not securing credentials - including unauthorized access, privilege escalation, and
    data breaches — far outweigh the effort required.
  references:
  - 1. https://docs.oracle.com/en/cloud/saas/enterprise-performance-managementcommon/cgsad/3_info_security_secure_cred_storage.html
  - 2. https://docs.oracle.com/en/cloud/saas/enterprise-performance-managementcommon/cgsad/3_info_security_epm_cloud_pword.html
  page_start: 40
  audit_raw: '1. Review all automation scripts, scheduled jobs, and CI/CD processes invoking

    EPM Automate.

    2. Verify that credentials are not stored in cleartext (e.g. in batch files, shell scripts,

    or parameters).

    3. Confirm that either:

    • The Oracle encrypted password file is being used, or

    • Credentials are retrieved securely from an OS-level key store (e.g. Windows

    Credential Manager, Linux keyring) or an enterprise vault (e.g. CyberArk,

    HashiCorp Vault, OCI Vault).

    4. Validate that credential rotation is in place and documented.'
  remediation: '• Use the EPM Automate encrypt command to generate an encrypted password

    file and update scripts to reference it instead of plaintext arguments.

    • Alternatively, configure integration with an enterprise password vault or OS

    secure key store to inject credentials at runtime.

    • Regularly rotate credentials and regenerate encrypted storage files.

    • Audit existing automation jobs to ensure compliance and remove any residual

    plaintext credentials.'
  checks:
  - type: manual_review
    info: '1. Review all automation scripts, scheduled jobs, and CI/CD processes invoking

      EPM Automate.

      2. Verify that credentials are not stored in cleartext (e.g. in batch files, shell scripts,

      or parameters).

      3. Confirm that either:

      • The Oracle encrypted password file is being used, or

      • Credentials are retrieved securely from an OS-level key store (e.g. Windows

      Credential Manager, Linux keyring) or an enterprise vault (e.g. CyberArk,

      HashiCorp Vault, OCI Vault).

      4. Validate that credential rotation is'
    severity: medium
- id: '1.13'
  title: Ensure Dormant Accounts and Orphaned Identities Are Automatically Detected and Disabled
  scoring: manual
  profile:
  - Level 2
  description: Dormant accounts and orphaned identities should be detected and disabled using automated identity governance
    capabilities. Policies should be configured in OCI Identity Domains or integrated identity governance platforms to automatically
    flag and disable accounts that have not logged in within a defined period, or that have no role assignments or ownership.
  rationale: Automated detection and disabling reduces reliance on manual reviews, minimizes human error, and ensures consistent
    enforcement. This strengthens the organization’s security posture and reduces the window of opportunity for account misuse.
  impact: Automation requires integration with identity governance tooling and careful configuration to avoid unintended lockouts.
    Exceptions may need to be defined for service or integration accounts.
  references:
  - 1. https://docs.oracle.com/en/cloud/saas/human-resources/ochus/manage-hcmuser-accounts.html
  - 2. https://docs.oracle.com/en-us/iaas/Content/identity/domains/managing.htm
  page_start: 42
  audit_raw: '1. Verify that identity governance policies are configured to automatically detect

    dormant and orphaned accounts.

    2. Review policy logs to confirm detection and disabling actions have occurred.

    3. Check for exceptions or exclusions and validate that they are documented and

    approved.'
  remediation: '1. Implement identity governance tooling in OCI Identity Domains or an integrated

    IAM solution.

    2. Configure policies to flag accounts inactive for more than 90 days or lacking

    ownership/role assignments.

    3. Set policies to disable such accounts automatically while notifying administrators.

    4. Define exceptions for service accounts and apply compensating monitoring

    controls.

    5. Periodically review policy effectiveness and adjust thresholds as needed.'
  checks:
  - type: manual_review
    info: '1. Verify that identity governance policies are configured to automatically detect

      dormant and orphaned accounts.

      2. Review policy logs to confirm detection and disabling actions have occurred.

      3. Check for exceptions or exclusions and validate that they are documented and

      approved.'
    severity: medium
- id: '1.14'
  title: Ensure Dormant Accounts and Orphaned Identities Are Reviewed and Disabled
  scoring: manual
  profile:
  - Level 1
  description: Dormant accounts and orphaned identities should be identified and disabled on a regular schedule. Dormant accounts
    are active accounts that have not been used for a defined period, such as 90 days. Orphaned identities are accounts with
    no associated owner or role assignment. Manual reviews of account activity in Fusion Applications and OCI Identity Domains
    should be conducted at least quarterly to detect such accounts.
  rationale: Inactive or orphaned accounts present unnecessary risk, as they may still be accessible but not actively monitored.
    Regular reviews reduce the chance that attackers exploit forgotten accounts to gain unauthorized access.
  impact: Manual review and disabling requires administrative effort and careful validation to avoid mistakenly removing accounts
    that are still needed. A process to re-enable accounts upon business justification should be defined to limit disruption.
  references:
  - 1. https://docs.oracle.com/en/cloud/saas/human-resources/ochus/manage-hcmuser-accounts.html
  - 2. https://docs.oracle.com/en-us/iaas/Content/identity/domains/managing.htm
  page_start: 44
  audit_raw: '1. Generate user activity reports for Fusion Applications or OCI Identity Domains.

    2. Identify accounts with no sign-in activity for at least 90 days.

    3. Identify accounts without assigned roles, groups, or owners.

    4. Confirm that such accounts are reviewed and, if appropriate, disabled or

    removed.'
  remediation: '1. Establish a policy defining thresholds for dormant accounts (for example, 90 days

    inactivity).

    2. Schedule quarterly reports of user activity and ownership.

    3. Review results with application owners.

    4. Disable or delete dormant and orphaned accounts once confirmed unnecessary.

    5. Document results and keep evidence for audit purposes.'
  checks:
  - type: manual_review
    info: '1. Generate user activity reports for Fusion Applications or OCI Identity Domains.

      2. Identify accounts with no sign-in activity for at least 90 days.

      3. Identify accounts without assigned roles, groups, or owners.

      4. Confirm that such accounts are reviewed and, if appropriate, disabled or

      removed.'
    severity: medium
- id: '2.1'
  title: Ensure Network Perimeters are Configured in IAM or the Identity Provider
  scoring: manual
  profile:
  - Level 2
  description: Network Perimeters restrict where users can sign in to Oracle SaaS applications by enforcing trusted IP ranges
    or network sources. For upgraded environments, this is configured natively in Oracle Identity Domains. For environments
    that have not yet been upgraded, equivalent controls should be configured in the external identity provider (IdP).
  rationale: Restricting access to approved IPs or network locations at the identity layer reduces the risk of compromised
    credentials being used from untrusted or malicious networks. By placing the enforcement at the authentication layer, even
    valid credentials cannot be misused outside authorized locations.
  impact: Configuring network perimeters may block legitimate users from signing in if they connect from locations or IP ranges
    not included in the allow-list, such as when traveling or working remotely, so organizations must keep ranges current
    and provide secure remote access options to balance security with usability.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/Identity/networkperimeters/overview.htm
  - 2. https://docs.oracle.com/en-us/iaas/Content/fusion-applications/identity-migrationoverview.htm
  page_start: 47
  audit_raw: '1. For upgraded environments:

    • Sign in to the Oracle Cloud Console.

    • Navigate to Identity & Security, Domains, Security, Network Perimeters.

    • Verify that at least one Network Perimeter is defined with authorized IP ranges

    and attached to sign-on policies.

    2. For non-upgraded environments:

    • Review conditional access or equivalent policies in the IdP.

    • Confirm that rules are applied to restrict authentication attempts to approved IP

    ranges or network locations.'
  remediation: '1. Upgraded environments (OCI IAM):

    • Go to Identity & Security, Domains, Security, Network Perimeters.

    • Create a perimeter with approved IP ranges.

    • Attach the perimeter to sign-on policies.

    2. Non-upgraded environments (external IdP):

    • Configure conditional access rules in the IdP (Azure AD, Okta, etc.).

    • Define approved IP ranges or geolocation-based conditions.

    • Apply these rules to authentication policies used by Oracle SaaS.'
  checks:
  - type: manual_review
    info: '1. For upgraded environments:

      • Sign in to the Oracle Cloud Console.

      • Navigate to Identity & Security, Domains, Security, Network Perimeters.

      • Verify that at least one Network Perimeter is defined with authorized IP ranges

      and attached to sign-on policies.

      2. For non-upgraded environments:

      • Review conditional access or equivalent policies in the IdP.

      • Confirm that rules are applied to restrict authentication attempts to approved IP

      ranges or network locations.'
    severity: medium
- id: '2.2'
  title: Ensure OCI Console Access Is Restricted to Trusted Networks
  scoring: manual
  profile:
  - Level 1
  description: Ensure that access to the Oracle Cloud Infrastructure (OCI) Console is restricted to trusted networks (secure
    VPNs or private network endpoints) by configuring IAM Network Sources
  rationale: The OCI Console provides administrative access. If user credentials are compromised, unrestricted access from
    any IP address increases the attack surface. Restricting console login to approved IP ranges or VCN subnets enforces defense
    in depth and reduces the likelihood of unauthorized access.
  impact: Restricting access may prevent legitimate users outside trusted networks from logging in. Organizations must maintain
    a secure break-glass account and carefully test network rules before enforcing them.
  references:
  - 1. https://docs.oracle.com/en/learn/access-to-oci-console/index.html
  - 2. https://docs.oracle.com/enus/iaas/Content/Identity/Tasks/managingnetworksources.htm
  - https://www.ateam-oracle.com/post/part-1-restrict-public-access-of-fusion-cloudapplications-and-enable-access-to-oci-resources-using-vcn-customer-onpremnetwork
  page_start: 49
  audit_raw: '1. Navigate to Identity & Security, Domains, Security, Sign-On Policies.

    • Confirm that console login rules reference a defined network source (for

    example, request.networkSource.name = <TrustedSource>).

    • Verify that there is no policy rule permitting console access from any network.

    2. Navigate to Identity & Security, Network Sources.

    • Confirm that the trusted network source contains only approved IP addresses,

    CIDR blocks, or VCN subnets.'
  remediation: '1. Define a Network Source with trusted IP ranges or VCN subnets:

    • Navigate to Identity & Security, Network Sources, Create Network

    Source.

    • Add approved IPs or CIDRs.

    2. Update the Sign-On Policy for the identity domain:

    • Add a rule that allows console login only if request.networkSource.name

    matches the trusted network source.

    • Add a default deny rule for all other networks.

    3. Test access from both inside and outside the trusted network.

    4. Maintain a secure break-glass account exempt from the restriction.'
  checks:
  - type: manual_review
    info: '1. Navigate to Identity & Security, Domains, Security, Sign-On Policies.

      • Confirm that console login rules reference a defined network source (for

      example, request.networkSource.name = <TrustedSource>).

      • Verify that there is no policy rule permitting console access from any network.

      2. Navigate to Identity & Security, Network Sources.

      • Confirm that the trusted network source contains only approved IP addresses,

      CIDR blocks, or VCN subnets.'
    severity: medium
- id: '2.3'
  title: Ensure Access to Fusion is restricted via Access Control List (ACL)
  scoring: manual
  profile:
  - Level 1
  description: An Access Control List (ACL) restricts connections to Oracle Fusion SaaS environments by allowing access only
    from defined public IP addresses, CIDR ranges, or Oracle Cloud Infrastructure (OCI) Virtual Cloud Networks (VCNs). This
    ensures that access is limited to approved enterprise networks and private connectivity options such as FastConnect or
    VPN, while blocking all other traffic by default.
  rationale: Enabling ACLs enforces strict network perimeter controls around Oracle Fusion environments. By limiting access
    to trusted IPs or VCNs, ACLs protect against unauthorized access attempts from the public internet and reduce the risk
    of brute force, credential stuffing, and other network-based attacks. ACLs also align with zero-trust principles by ensuring
    SaaS applications are not broadly exposed.
  impact: Restricting Fusion access through ACLs may block legitimate users or integrations if required IP addresses or VCNs
    are not properly registered. This can cause downtime for business processes until the ACL is updated.
  references:
  - 1. https://docs.oracle.com/en-us/iaas/Content/fusion-applications/networksetup.htm
  - 2. https://blogs.oracle.com/cloud-infrastructure/post/expand-fusion-cloud-securityipbased-filtering-1
  page_start: 51
  audit_raw: '1. Sign in to the Oracle Cloud Infrastructure Console with the appropriate

    administrator privileges

    2. Navigate to the Fusion SaaS environment’s network settings and locate the

    Access Control List configuration

    3. Verify that ACLs are enabled for the environment

    4. Confirm that the ACL contains only trusted public IP addresses, CIDR ranges, or

    OCI Virtual Cloud Networks (VCNs)

    5. Check that the allowlist excludes overly broad ranges such as 0.0.0.0/0

    6. Validate that exceptions are documented and limited to approved use cases (for

    example, supplier portal or integrations that must be accessible from external

    networks)

    7. Attempt access from an unlisted IP or VCN to confirm that connections are

    blocked'
  remediation: '1. In the Oracle Cloud Infrastructure Console, access the Fusion SaaS

    environment’s network configuration

    2. Enable the Access Control List feature if not already active

    3. Add the organization’s trusted public IP addresses, CIDR ranges, and/or OCI

    Virtual Cloud Networks (VCNs) to the ACL

    4. Save the configuration and confirm that the ACL is enforced

    5. Remove any broad or unnecessary ranges that could allow access from

    untrusted sources

    6. Document any exceptions that must remain open, including justification and

    approval

    7. Validate the changes by testing access from both allowed and disallowed

    networks to ensure enforcement is functioning as expected'
  checks:
  - type: manual_review
    info: '1. Sign in to the Oracle Cloud Infrastructure Console with the appropriate

      administrator privileges

      2. Navigate to the Fusion SaaS environment’s network settings and locate the

      Access Control List configuration

      3. Verify that ACLs are enabled for the environment

      4. Confirm that the ACL contains only trusted public IP addresses, CIDR ranges, or

      OCI Virtual Cloud Networks (VCNs)

      5. Check that the allowlist excludes overly broad ranges such as 0.0.0.0/0

      6. Validate that exceptions are documented an'
    severity: medium
- id: '2.4'
  title: Ensure Location-Based Access Control (LBAC) is enabled
  scoring: manual
  profile:
  - Level 1
  description: Location-Based Access Control (LBAC) restricts user access to Oracle Fusion SaaS products based on network
    location. It applies to both user interface (UI) and API signins. Access is allowed only from registered IP ranges, such
    as corporate offices or VPN gateways. Users connecting from unregistered networks receive only generic or limited access
    unless explicitly permitted.
  rationale: Enabling LBAC enforces a perimeter-based restriction on where users and integrations can connect from. This complements
    authentication and role-based authorization by ensuring that even valid credentials cannot be used from untrusted or malicious
    networks. Implementing LBAC reduces the attack surface and aligns with the principle of least privilege.
  impact: Enabling LBAC may prevent users from accessing Oracle Fusion Applications if they connect from networks not included
    in the allowlist, such as home offices, mobile connections, or partner sites. Administrators must carefully manage IP
    entries to avoid service disruption.
  references:
  - 1. https://docs.oracle.com/en/cloud/saas/human-resources/ochus/overview-oflocation-based-access.html
  - 2. https://docs.oracle.com/en-us/iaas/Content/fusion-applications/networksetup.htm
  page_start: 53
  audit_raw: '1. Confirm that the IT Security Manager role is assigned

    2. In a test or non-production environment, validate LBAC configuration before

    enabling in production

    3. Navigate to Navigator, Tools, Security Console, Location Based Access

    4. Verify that Enable Location Based Access is selected

    5. Review the IP Address Allowlist to ensure it contains valid IPv4 or CIDR

    ranges for trusted networks

    6. Confirm that the IT Security Manager role is designated as public to preserve

    administrative access

    7. If LBAC is disabled, check that allowlist entries are retained in read-only mode for

    later use

    8. Test login from a disallowed IP to confirm access is restricted, and from an

    allowed IP to confirm access works'
  remediation: '1. Use an account with the IT Security Manager role to configure LBAC

    2. In the Security Console, open the Location Based Access tab and select Enable

    Location Based Access

    3. Add trusted IP addresses or CIDR ranges, including the administrator’s current

    IP to avoid lockout

    4. Save the configuration and confirm the change

    5. Mark the IT Security Manager role as public to preserve console access even

    from unregistered networks

    6. If disabling LBAC, deselect the option; allowlist entries remain stored for reuse

    7. Validate by testing login from both trusted and untrusted IPs'
  checks:
  - type: manual_review
    info: '1. Confirm that the IT Security Manager role is assigned

      2. In a test or non-production environment, validate LBAC configuration before

      enabling in production

      3. Navigate to Navigator, Tools, Security Console, Location Based Access

      4. Verify that Enable Location Based Access is selected

      5. Review the IP Address Allowlist to ensure it contains valid IPv4 or CIDR

      ranges for trusted networks

      6. Confirm that the IT Security Manager role is designated as public to preserve

      administrative access

      7. If'
    severity: medium
- id: '2.5'
  title: Ensure Geolocation Filtering with WAF for SaaS is enforced
  scoring: manual
  profile:
  - Level 2
  description: Geolocation filtering in WAF for Oracle Fusion Applications restricts access based on the source country or
    region of incoming requests. WAF policies can be configured to allow or block traffic from selected geographies, helping
    organizations limit access to regions where legitimate users are located. This control must be enabled and validated through
    a Service Request with Oracle SaaS Operations.
  rationale: Restricting access to only the countries or regions where the organization operates reduces unnecessary exposure
    to malicious traffic. Many automated attacks originate from outside business-relevant regions, and filtering them at the
    WAF layer prevents unwanted traffic from reaching the application.
  impact: Enabling geolocation filtering may prevent legitimate users from connecting if they travel or work outside of approved
    regions. Organizations must balance security restrictions with user mobility and ensure that business-critical access
    is not unintentionally blocked.
  references:
  - 1. https://blogs.oracle.com/cloud-infrastructure/post/expand-fusion-cloud-securityipbased-filtering-2
  - 2. https://community.oracle.com/customerconnect/discussion/673419/webapplication-firewall-waf-for-fusion-applications-a-managed-service-from-saassecurity
  page_start: 55
  audit_raw: '1. Review Service Request (SR) records with Oracle SaaS Operations to confirm

    that geolocation filtering has been enabled.

    2. Verify the countries or regions included in the allow or block lists match

    organizational requirements.

    3. Optionally log a new Service Request with Oracle SaaS Operations to confirm

    the current WAF policy configuration.

    4. Validate functionality by attempting access from at least one blocked country and

    confirming that requests are denied.'
  remediation: '1. Submit a Service Request to Oracle SaaS Operations requesting geolocation

    filtering to be enabled for the Fusion environment.

    2. Provide Oracle with the list of countries or regions that should be allowed or

    blocked.

    3. After configuration by Oracle, confirm that the rules are applied and enforced.

    4. Test by accessing Fusion from both allowed and blocked regions to ensure

    expected behavior.

    5. Document exceptions if broader access must remain temporarily enabled.'
  checks:
  - type: manual_review
    info: '1. Review Service Request (SR) records with Oracle SaaS Operations to confirm

      that geolocation filtering has been enabled.

      2. Verify the countries or regions included in the allow or block lists match

      organizational requirements.

      3. Optionally log a new Service Request with Oracle SaaS Operations to confirm

      the current WAF policy configuration.

      4. Validate functionality by attempting access from at least one blocked country and

      confirming that requests are denied.'
    severity: medium
- id: '2.6'
  title: Ensure IP-Based Filtering with WAF for SaaS is Enforced
  scoring: manual
  profile:
  - Level 2
  description: IP-based filtering in WAF for Oracle Fusion Applications restricts access to trusted public IP addresses or
    CIDR ranges. WAF rules can allow or block specific IP ranges so that only authorized enterprise networks (such as corporate
    offices, VPN gateways, or partner networks) can reach Fusion Applications. This control must be enabled and validated
    through a Service Request with Oracle SaaS Operations.
  rationale: Restricting access by IP address or CIDR reduces the exposure of Fusion Applications to unauthorized traffic
    from the public internet. By ensuring only trusted network sources can connect, IP-based filtering helps protect against
    brute force attempts, scanning, and other malicious activity.
  impact: Enabling IP-based filtering may inadvertently block legitimate users or integrations if their IP addresses are not
    registered in the allowlist. This requires ongoing maintenance of IP entries, especially for users with dynamic addresses
    or business partners with changing network ranges.
  references:
  - 1. https://blogs.oracle.com/cloud-infrastructure/post/expand-fusion-cloud-securityipbased-filtering-2
  - 2. https://community.oracle.com/customerconnect/discussion/673419/webapplication-firewall-waf-for-fusion-applications-a-managed-service-from-saassecurity
  page_start: 57
  audit_raw: '1. Review Service Request (SR) records with Oracle SaaS Operations to confirm

    that IP-based filtering has been enabled.

    2. Verify that the allowlist includes only approved public IP addresses or CIDR

    ranges corresponding to trusted networks.

    3. Ensure no overly broad ranges, such as 0.0.0.0/0, are permitted.

    4. Optionally log a Service Request with Oracle SaaS Operations to confirm the

    current WAF policy configuration.

    5. Test connectivity from both an allowed and a disallowed IP address to confirm

    enforcement.'
  remediation: '1. Submit a Service Request to Oracle SaaS Operations requesting IP-based

    filtering to be enabled for the Fusion environment.

    2. Provide Oracle with a list of approved IP addresses or CIDR ranges representing

    trusted enterprise or VPN networks.

    3. Review and approve Oracle’s implementation of the filtering policy.

    4. Remove any unnecessary or overly broad ranges.

    5. Validate enforcement by testing API and UI access from both allowed and

    disallowed IP addresses.

    6. Document exceptions if temporary external access is required.'
  checks:
  - type: manual_review
    info: '1. Review Service Request (SR) records with Oracle SaaS Operations to confirm

      that IP-based filtering has been enabled.

      2. Verify that the allowlist includes only approved public IP addresses or CIDR

      ranges corresponding to trusted networks.

      3. Ensure no overly broad ranges, such as 0.0.0.0/0, are permitted.

      4. Optionally log a Service Request with Oracle SaaS Operations to confirm the

      current WAF policy configuration.

      5. Test connectivity from both an allowed and a disallowed IP address to conf'
    severity: medium
- id: '2.7'
  title: Ensure Qualified Target Filtering with WAF for SaaS is Enforced
  scoring: manual
  profile:
  - Level 2
  description: 'Qualified Target Filtering in WAF for Oracle Fusion Applications enables differentiated access control at
    the module or endpoint level. This allows organizations to apply stricter policies for sensitive internal modules while
    permitting broader access to externally facing modules, such as Supplier Portal and Oracle Recruiting Cloud Candidate
    Experience (ORC). Filtering rules can be defined per qualified target to separate external user traffic (e.g., suppliers,
    applicants) from internal corporate traffic. This control must be enabled and validated through a Service Request with
    Oracle SaaS Operations. Capture all user authentication lifecycle events (successful and failed logins, logouts, session
    creation/termination, token refresh, and session invalidation) from Fusion Applications and ensure these events are exported
    to OCI Audit/Logging and forwarded to your centralized SIEM or log repository for retention, correlation, and alerting.
    Sample alerts/detection rules: • Multiple failed logins from same account or IP within short window. • Login from new
    Geo-location or anonymized IP. • Successful login immediately after password reset / privilege change. • Concurrent sessions
    from geographically dispersed IPs for same user.'
  rationale: Not all Fusion modules require the same level of exposure. Internal corporate modules should be tightly restricted,
    while external-facing portals must allow controlled access for third parties. Qualified Target Filtering provides the
    flexibility to enforce strong network restrictions for corporate use while preserving access for suppliers and applicants,
    minimizing unnecessary risk while supporting business functions. Authentication lifecycle events are fundamental telemetry
    for detecting account compromise, brute-force attacks, anomalous logins (time/location), and unauthorized session reuse.
    Centralizing these events enables correlation with other security data (privilege changes, API activity) and supports
    incident detection and forensic investigations.
  impact: Enabling Qualified Target Filtering introduces configuration complexity. If policies are misconfigured, legitimate
    external users (e.g., suppliers or job applicants) or internal users may be blocked from accessing required modules. Organizations
    must carefully maintain allowlists and country policies to prevent business disruption. Enabling detailed session auditing
    increases log volume and storage/ingestion costs. Minimal performance impact on Fusion, integration work required to establish
    exports/pipelines and SIEM parsers.
  references:
  - 1. https://blogs.oracle.com/cloud-infrastructure/post/waf-saas-supports-fusionsupplier-portal-security
  - 2. https://blogs.oracle.com/cloud-infrastructure/post/job-applicant-corporate-trafficfusion-cloud-waf
