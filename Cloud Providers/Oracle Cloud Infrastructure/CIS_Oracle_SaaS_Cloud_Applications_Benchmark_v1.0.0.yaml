- id: '3.2'
  title: Ensure EPM Audit Data is Exported and Centrally Stored
  scoring: manual
  profile:
  - Level 2
  description: EPM Cloud Applications generate audit data that records user sign-ins, administrative actions, and configuration
    changes. This audit data should be exported regularly from the EPM environment to ensure it is retained outside of the
    application. To ensure audit integrity and long-term availability, these audit records should be periodically exported
    from the service and stored in a centralized repository for example on Object Storage.
  rationale: Audit data retained only inside EPM is limited by default retention policies and is vulnerable to loss or deletion.
    Exporting ensures durability and independence, while forwarding into OCI Logging Analytics or a SIEM enables consolidated
    monitoring, alerting, and compliance reporting across enterprise systems.
  impact: Enabling regular export of EPM audit data introduces operational overhead for scheduling, storage, and monitoring
    of the export process. Not exporting audit data increases the risk of losing historical records once retention limits
    are reached, which may hinder forensic investigations, weaken compliance posture, and reduce visibility into unauthorized
    activities.
  references:
  - 1. https://docs.oracle.com/en/cloud/saas/enterprise-performance-managementcommon/cgsad/integration_with_custom_siem_tools.html
  - 2. https://docs.oracle.com/en/cloud/saas/enterprise-performance-managementcommon/cepma/sample_script_8_download_files.html
  page_start: 64
  audit_raw: '1. Confirm that EPM audit data exports are scheduled and active.

    2. Verify that audit data files contain expected details, such as user ID, login time,

    IP address, and executed functions.

    3. Check that exported data is securely stored in an external location, like Object

    Storage.'
  remediation: '• Configure automated export of EPM audit data (for example, with EPM Automate

    Access Log downloads).

    • Store exported files securely outside the transactional environment.

    • Test and validate that exports and any forwarding pipelines complete

    successfully, without data loss.'
  checks:
