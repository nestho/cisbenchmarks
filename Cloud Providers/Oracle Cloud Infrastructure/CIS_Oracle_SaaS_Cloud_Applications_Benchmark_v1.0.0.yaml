    reporting activity within Oracle Fusion Applications. This includes audit of report executions, catalog object creations,
    deletions, updates, and access control changes, as well as performance and concurrency usage metrics. Centralize this
    audit data for anomaly detection, insider-threat monitoring, and compliance reporting.
  rationale: Reports and dashboards in Fusion Applications can access or export large volumes of sensitive operational and
    financial data. Auditing report execution and modification provides visibility into who viewed, changed, or extracted
