    info: '1. Confirm that EPM audit data exports are scheduled and active.

      2. Verify that audit data files contain expected details, such as user ID, login time,

      IP address, and executed functions.

      3. Check that exported data is securely stored in an external location, like Object

      Storage.'
    severity: medium
