- id: 4.1.1
  title: Ensure Changes to Audit Policy Settings Are Monitored
  scoring: manual
  profile:
  - Level 1
  description: The purpose of this recommendation is to ensure that changes to Audit Policies are appropriate. Audit Policies
    record the changes made to Fusion Application configuration settings, which in turn determine the applications' behaviors.
    Each Audit Policy records changes to specific settings. Administrators enable each Audit Policy separately. Once an Audit
    Policy is enabled, audit information is stored without any intervention of the user or any explicit user action. Administrators
    can also disable any Audit Policy separately - i.e., specify that specific settings' changes will no longer be recorded
    - and re-enable them later.
  rationale: Changes to Audit Policies impact the ability to detect changes to Fusion Application configurations, and consequent
    changes to the applications' behaviors. This control ensures that changes are recorded, reviewed, and if necessary, reversed.
    If an Audit Policy is disabled erroneously, the ability to monitor changes to Fusion Application configurations is lost;
    those changes will alter the applications' behaviors without appropriate oversight. If an Audit Policy is disabled maliciously,
    Fusion Application configurations can be changed in unauthorized ways - a potential exploit is to disable an Audit Policy,
    change an application configuration setting, abuse the changed behavior of the application, then restore the original
    configuration setting and re-enable the Audit Policy.
  impact: Changes to Audit Policies are always recorded. If changes and their consequences are not reviewed, the responsibility
    for being aware of the changes' consequences must be accomplished through another means. Fusion Application performance
    is not impacted.
  references:
  - 1. https://docs.oracle.com/en/cloud/saas/applications-common/25c/facia/auditpolicies.html
