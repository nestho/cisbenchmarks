- id: '3.5'
  title: Ensure Logging Pipelines are Monitored for Failures to Prevent Silent Loss of Audit Events
  scoring: manual
  profile:
  - Level 2
  description: Audit and monitoring data from Oracle SaaS Applications is often exported and ingested into downstream systems
    such as Centralized Log Management (CLM) or Security Information and Event Management (SIEM) Platforms. If the export
    or ingestion pipelines fail, audit data may silently stop flowing, leaving security teams unaware of missing records.
    Monitoring and alerting should be enabled on all logging pipelines to detect failures and disruptions in log collection
    or forwarding. In Oracle SaaS Connector Hub is the recommended log routing services. Organizations leveraging multi-cloud
    or hybrid environments may also use third-party log forwarding and observability agents to ensure reliable audit data
    delivery.
  rationale: Audit data is critical for detecting malicious activity, ensuring accountability, and meeting compliance requirements.
    Pipeline failures can result in gaps that prevent accurate forensic investigations and weaken monitoring effectiveness.
    By actively monitoring the health of logging pipelines, organizations can ensure continuous visibility into user and administrative
    activity.
  impact: Additional configuration and monitoring effort is required to track pipeline health. Alerts must be tuned to avoid
    noise, and storage costs may increase if diagnostic logs are retained for extended periods. However, the impact of silent
    audit data loss is far greater, as it can leave incidents undetected.
  references:
  - 1. https://www.ateam-oracle.com/post/methods-to-extract-audit-monitoring-datafrom-fusion-applications
  - 2. https://docs.oracle.com/en-us/iaas/Content/service-connector-hub/overview.htm
  page_start: 71
  audit_raw: '1. If using OCI Service Connector Hub, open the OCI Console, review OCI Service

    Connector Hub to confirm monitoring is enabled on log collection and forwarding

    pipelines.

    2. Check whether alarms exist in OCI Monitoring for connector errors, ingestion

    failures, or delivery delays.

    3. Validate that alerts are directed to responsible administrators via email, pager, or

    incident management systems.

    4. Inspect recent alarm history to confirm that test failures are detected and

    reported.'
  remediation: '1. Configure OCI Monitoring alarms on Service Connector Hub pipelines to trigger

    when ingestion or forwarding fails.

    2. Establish alert rules in Centralized Log Management (CLM) or SIEM Platform to

    detect periods with no incoming audit events.

    3. Route alarms to administrators via Notifications, email, or ticketing systems.

    4. Test the monitoring setup by intentionally pausing or misconfiguring a pipeline

    and verifying that alerts are generated.

    5. Document the monitoring and escalation process in the organization’s

    operational runbooks.'
  checks:
  - type: manual_review
    info: '1. If using OCI Service Connector Hub, open the OCI Console, review OCI Service

      Connector Hub to confirm monitoring is enabled on log collection and forwarding

