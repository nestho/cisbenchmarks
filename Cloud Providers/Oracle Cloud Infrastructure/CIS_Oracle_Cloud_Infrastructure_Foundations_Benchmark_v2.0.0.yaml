- id: '1.15'
  title: Ensure storage service-level admins cannot delete resources they manage.
  scoring: manual
  profile:
  - Level 2
  description: 'To apply the separation of duties security principle, one can restrict service-level administrators from being
    able to delete resources they are managing. It means servicelevel administrators can only manage resources of a specific
    service but not delete resources for that specific service. Example policies for global/tenant level for block volume
    service-administrators: Allow group VolumeUsers to manage volumes in tenancy where request.permission!=''VOLUME_DELETE''
    Allow group VolumeUsers to manage volume-backups in tenancy where request.permission!=''VOLUME_BACKUP_DELETE'' Example
    policies for global/tenant level for file storage system service-administrators: Allow group FileUsers to manage file-systems
    in tenancy where request.permission!=''FILE_SYSTEM_DELETE'' Allow group FileUsers to manage mount-targets in tenancy where
    request.permission!=''MOUNT_TARGET_DELETE'' Allow group FileUsers to manage export-sets in tenancy where request.permission!=''EXPORT_SET_DELETE''
    Example policies for global/tenant level for object storage system serviceadministrators: Allow group BucketUsers to manage
    objects in tenancy where request.permission!=''OBJECT_DELETE'' Allow group BucketUsers to manage buckets in tenancy where
    request.permission!=''BUCKET_DELETE'''
  rationale: Creating service-level administrators without the ability to delete the resource they are managing helps in tightly
    controlling access to Oracle Cloud Infrastructure (OCI) services by implementing the separation of duties security principle.
  impact: ''
  references:
  - 1. https://docs.oracle.com/en/solutions/oci-best-practices/protect-datarest1.html#GUID-939A5EA1-3057-48E0-9E02-ADAFCB82BA3E
  - 2. https://docs.oracle.com/enus/iaas/Content/Identity/policyreference/policyreference.htm
  page_start: 59
  audit_raw: "From Console:\n1. Login to OCI console.\n2. Go to Identity -> Policies, In the compartment dropdown, choose\
    \ the\ncompartment.\n3. Open each policy to view the policy statements.\n4. Verify the policies to ensure that the policy\
    \ statements that grant access to\nstorage service-level administrators have a condition that excludes access to\ndelete\
    \ the service they are the administrator for.\nFrom CLI:\n1. Execute the following command:\nfor compid in `oci iam compartment\
    \ list --compartment-id-in-subtree TRUE\n2>/dev/null | jq -r '.data[] | .id'`\n do\n for policy in `oci iam policy list\
    \ --compartment-id $compid\n2>/dev/null | jq -r '.data[] | .id'`\n do\n output=`oci iam policy list --compartment-id $compid\n\
    2>/dev/null | jq -r '.data[] | .id, .name, .statements'`\n if [ ! -z \"$output\" ]; then echo $output; fi\n done\n done\n\
    2. Verify the policies to ensure that the policy statements that grant access to\nstorage service-level administrators\
    \ have a condition that excludes access to\ndelete the service they are the administrator for."
  remediation: 'From Console:

