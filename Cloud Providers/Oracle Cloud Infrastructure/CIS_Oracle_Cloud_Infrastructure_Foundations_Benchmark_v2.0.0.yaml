- id: '1.4'
  title: Ensure IAM password policy requires minimum length of 14 or greater
  scoring: scored
  profile:
  - Level 1
  description: Password policies are used to enforce password complexity requirements. IAM password policies can be used to
    ensure passwords are at least a certain length and are composed of certain characters. It is recommended the password
    policy require a minimum password length 14 characters and contain 1 non-alphabetic character (Number or “Special Character”).
  rationale: In keeping with the overall goal of having users create a password that is not overly weak, an eight-character
    minimum password length is recommended for an MFA account, and 14 characters for a password only account. In addition,
    maximum password length should be made as long as possible based on system/software capabilities and not restricted by
    policy. In general, it is true that longer passwords are better (harder to crack), but it is also true that forced password
    length requirements can cause user behavior that is predictable and undesirable. For example, requiring users to have
    a minimum 16-character password may cause them to choose repeating patterns like fourfourfourfour or passwordpassword
    that meet the requirement but aren’t hard to guess. Additionally, length requirements increase the chances that users
    will adopt other insecure practices, like writing them down, re-using them or storing them unencrypted in their documents.
    Password composition requirements are a poor defense against guessing attacks. Forcing users to choose some combination
    of upper-case, lower-case, numbers, and special characters has a negative impact. It places an extra burden on users and
    many will use predictable patterns (for example, a capital letter in the first position, followed by lowercase letters,
    then one or two numbers, and a “special character” at the end). Attackers know this, so dictionary attacks will often
    contain these common patterns and use the most common substitutions like, $ for s, @ for a, 1 for l, 0 for o. Passwords
    that are too complex in nature make it harder for users to remember, leading to bad practices. In addition, composition
    requirements provide no defense against common attack types such as social engineering or insecure storage of passwords.
  impact: ''
  references:
  - 1. https://www.cisecurity.org/white-papers/cis-password-policy-guide/
  page_start: 22
  audit_raw: 'OCI IAM without Identity Domains

    From Console:

    1. Login to the OCI Console

    2. Go to Identity in the Services menu.

    3. Select Authentication Settings from the Identity menu.

    4. Click Edit in the middle of the page.

    5. Ensure the number 14 is entered into the box below the text: MINIMUM PASSWORD

    LENGTH (IN CHARACTERS).

    6. Ensure that one (1) of the checkboxes is selected for MUST CONTAIN AT LEAST 1

    SPECIAL CHARACTER OR MUST CONTAIN AT LEAST 1 NUMERIC CHARACTER

    From CLI:

    Run the following command

    oci iam authentication-policy get --compartment-id --query ''data."passwordpolicy"."minimum-password-length"''

    Result should return a value of 14 or greater

    OCI IAM without Identity Domains - Identity Cloud Service (IDCS)

    If you use IDCS to login to OCI, verify the password policy settings in IDCS

    1. Login to IDCS Admin Console

    2. Expand the Navigation Drawer, click Settings, and then click Password Policy.

    3. Verify the Password length min size setting.

    4. Under The password must contain these characters section, ensure that the

    number given in Numeric min setting is 1, or the Special min setting is 1.

    OCI IAM with Identity Domains

    1. Go to Identity Domains: https://cloud.oracle.com/identity/domains/

    2. Select the Compartment your Domain to review is in

    3. Click on the Domain to review

    4. Click on Settings

    5. Click on Password policy

    6. Click each Password policy in the domain

    7. Ensure Password length (minimum) is greater than or equal to 14

    8. Under The The following criteria apply to passwords section, ensure that

    the number given in Numeric (minimum) setting is 1, or the Special (minimum)

    setting is 1.

    The following criteria apply to passwords:

    6. Ensure that 1 or more is selected for Numeric (minimum) OR Special (minimum)

    From Cloud Guard:

    To Enable Cloud Guard Auditing:

    Ensure Cloud Guard is enabled in the root compartment of the tenancy. For more

    information about enabling Cloud Guard, please look at the instructions included in

    "Ensure Cloud Guard is enabled in the root compartment of the tenancy"

    Recommendation in the "Logging and Monitoring" section.

    From Console:

    1. Type Cloud Guard into the Search box at the top of the Console.

    2. Click Cloud Guard from the “Services” submenu.

    3. Click Detector Recipes in the Cloud Guard menu.

    4. Click OCI Configuration Detector Recipe (Oracle Managed) under the Recipe

    Name column.

    5. Find Password policy does not meet complexity requirements in the Detector

    Rules column.

    6. Select the vertical ellipsis icon and chose Edit on the Password policy does not

    meet complexity requirements row.

    7. In the Edit Detector Rule window, find the Input Setting box and verify/change the

    Required password length setting to 14.

    8. Click the Save button.

    From CLI:

    1. Update the Password policy does not meet complexity requirements Detector

    Rule in Cloud Guard to generate Problems if IAM password policy isn’t

    configured to enforce a password length of at least 14 characters with the

    following command:

    oci cloud-guard detector-recipe-detector-rule update --detector-recipe-id

    <insert detector recipe ocid> --detector-rule-id PASSWORD_POLICY_NOT_COMPLEX

    --details ''{"configurations":[{ "configKey" : "passwordPolicyMinLength",

    "name" : "Required password length", "value" : "14", "dataType" : null,

    "values" : null }]}'''
  remediation: 'OCI IAM without Identity Domains

    From Console:

    1. Login to the OCI Console

    2. Go to Identity in the Services menu.

    3. Select Authentication Settings from the Identity menu.

    4. Click Edit in the middle of the page.

    5. Type the number 14 into the box below the text: MINIMUM PASSWORD LENGTH (IN

    CHARACTERS).

    6. Select checkbox next to MUST CONTAIN AT LEAST 1 SPECIAL CHARACTER OR MUST

    CONTAIN AT LEAST 1 NUMERIC CHARACTER

    OCI IAM without Identity Domains - Identity Cloud Service (IDCS)

    1. Login to IDCS Admin Console

    2. Expand the Navigation Drawer, click Settings, and then click Password Policy.

    3. Click on Change Your Password Policy button.

    4. Update the Password length min size setting to 14 or greater

    5. Click Save.

    6. Under The password must contain these characters section, update the

    number given in Special min setting to 1

    or

    Under The password must contain these characters section, update the number

    given in Numeric min setting to 1

    7. Click Save

    OCI IAM with Identity Domains

    1. Go to Identity Domains: https://cloud.oracle.com/identity/domains/

    2. Select the Compartment the Domain to remediate is in

    3. Click on the Domain to remediate

    4. Click on Settings

    5. Click on Password policy to remediate

    6. Click Edit password rules

    7. Update the Password length (minimum) setting to 14 or greater

    8. Under The Passwords must meet the following character requirements

    section, update the number given in Special (minimum) setting to 1 or greater

    or

    Under The Passwords must meet the following character requirements section,

    update the number given in Numeric (minimum) setting to 1 or greater

    7. Click Save changes'
  checks:
  - type: sql
    command: Select Authentication Settings from the Identity menu.
    severity: medium
