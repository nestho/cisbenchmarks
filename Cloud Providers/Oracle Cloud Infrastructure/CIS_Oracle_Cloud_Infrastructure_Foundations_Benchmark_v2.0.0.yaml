- id: '2.5'
  title: Ensure the default security list of every VCN restricts all traffic except ICMP
  scoring: scored
  profile:
  - Level 1
  description: A default security list is created when a Virtual Cloud Network (VCN) is created. Security lists provide stateful
    filtering of ingress and egress network traffic to OCI resources. It is recommended no security list allows unrestricted
    ingress access to resources such as Secure Shell (SSH) via port 22.
  rationale: Removing unfettered connectivity to remote console services, such as SSH on port 22, reduces a server's exposure
    to unauthorized access.
  impact: For updating an existing environment, care should be taken to ensure that administrators currently relying on an
    existing ingress from 0.0.0.0/0 have access to port 22 through another security group.
  references: []
  page_start: 76
  audit_raw: 'From Console:

