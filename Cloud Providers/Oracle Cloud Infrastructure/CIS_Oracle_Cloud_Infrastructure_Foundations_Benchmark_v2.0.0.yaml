    \ output=`oci network nsg rules list --nsg-id=$nsgid --all\n2>/dev/null | jq -r '.data[] | select(.source == \"0.0.0.0/0\"\
    \ and .direction\n== \"INGRESS\" and ((.\"tcp-options\".\"destination-port-range\".max >= 22 and\n.\"tcp-options\".\"\
