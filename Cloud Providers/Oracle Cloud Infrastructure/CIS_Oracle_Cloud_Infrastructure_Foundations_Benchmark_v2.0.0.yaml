- id: '4.1'
  title: Ensure default tags are used on resources
  scoring: scored
  profile:
  - Level 1
  description: Using default tags is a way to ensure all resources that support tags are tagged during creation. Tags can
    be based on static or computed values. It is recommended to set up default tags early after root compartment creation
    to ensure all created resources will get tagged. Tags are scoped to Compartments and are inherited by Child Compartments.
    The recommendation is to create default tags like “CreatedBy” at the Root Compartment level to ensure all resources get
    tagged. When using Tags it is important to ensure that Tag Namespaces are protected by IAM Policies otherwise this will
    allow users to change tags or tag values. Depending on the age of the OCI Tenancy there may already be Tag defaults setup
    at the Root Level and no need for further action to implement this action.
  rationale: In the case of an incident having default tags like “CreatedBy” applied will provide info on who created the
    resource without having to search the Audit logs.
  impact: There is no performance impact when enabling the above described features.
  references: []
  page_start: 97
  audit_raw: 'From Console:

    1. Login to OCI Console.

    2. From the navigation menu, select Identity & Security.

    3. Under Identity, select Compartments.

    4. Click the name of the root compartment.

    5. Under Resources, select Tag Defaults.

    6. In the Tag Defaults table, verify that there is a Tag with a value of

    ${iam.principal.name} and a Tag Key Status of Active.

    Note:

