- id: '3.1'
  title: Ensure Compute Instance Legacy Metadata service endpoint is disabled
  scoring: scored
  profile:
  - Level 2
  description: Compute Instances that utilize Legacy MetaData service endpoints (IMDSv1) are susceptible to potential SSRF
    attacks. To bolster security measures, it is strongly advised to reconfigure Compute Instances to adopt Instance Metadata
    Service v2, aligning with the industry's best security practices.
  rationale: Enabling Instance Metadata Service v2 enhances security and grants precise control over metadata access. Transitioning
    from IMDSv1 reduces the risk of SSRF attacks, bolstering system protection. IMDv1 poses security risks due to its inferior
    security measures and limited auditing capabilities. Transitioning to IMDv2 ensures a more secure environment with robust
    security features and improved monitoring capabilities.
  impact: 'If you disable IMDSv1 on an instance that does not support IMDSv2, you might not be able to connect to the instance
    when you launch it. IMDSv2 is supported on the following platform images: • Oracle Autonomous Linux 8.x images • Oracle
    Autonomous Linux 7.x images released in June 2020 or later • Oracle Linux 8.x, Oracle Linux 7.x, and Oracle Linux 6.x
    images released in July 2020 or later Other platform images, most custom images, and most Marketplace images do not support
    IMDSv2. Custom Linux images might support IMDSv2 if cloud-init is updated to version 20.3 or later and Oracle Cloud Agent
    is updated to version 0.0.19 or later. Custom Windows images might support IMDSv2 if Oracle Cloud Agent is updated to
    version 1.0.0.0 or later; cloudbase-init does not support IMDSv2.'
  references:
  - 1. https://docs.oracle.com/en-us/iaas/Content/Compute/Tasks/gettingmetadata.htm
  page_start: 88
