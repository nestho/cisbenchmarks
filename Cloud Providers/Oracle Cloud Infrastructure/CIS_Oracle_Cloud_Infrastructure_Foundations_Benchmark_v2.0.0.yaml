    \ the following query in the query box:\nquery\n compartment resources\nwhere\n(compartmentId='<tenancy-id>' && lifecycleState='ACTIVE')\n\
    6. Ensure query returns at least one compartment in addition to the\nManagedCompartmentForPaaS compartment\nFrom CLI:\n\
    1. Execute the following command\noci search resource structured-search --query-text \"query\n compartment resources\n\
