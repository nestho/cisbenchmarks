  scoring: scored
  profile:
  - Level 1
  description: Tenancy administrator users have full access to the organization's OCI tenancy. API keys associated with user
    accounts are used for invoking the OCI APIs via custom programs or clients like CLI/SDKs. The clients are typically used
    for performing day-today operations and should never require full tenancy access. Service-level administrative users with
    API keys should be used instead.
  rationale: For performing day-to-day operations tenancy administrator access is not needed. Service-level administrative
    users with API keys should be used to apply privileged security principle.
  impact: ''
  references: []
  page_start: 49
  audit_raw: 'OCI IAM without Identity Domains

