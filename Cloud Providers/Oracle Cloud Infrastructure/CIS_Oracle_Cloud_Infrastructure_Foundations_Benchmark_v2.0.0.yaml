- id: '4.2'
  title: Create at least one notification topic and subscription to receive monitoring alerts
  scoring: scored
  profile:
  - Level 1
  description: Notifications provide a multi-channel messaging service that allow users and applications to be notified of
    events of interest occurring within OCI. Messages can be sent via eMail, HTTPs, PagerDuty, Slack or the OCI Function service.
    Some channels, such as eMail require confirmation of the subscription before it becomes active.
  rationale: Creating one or more notification topics allow administrators to be notified of relevant changes made to OCI
    infrastructure.
  impact: There is no performance impact when enabling the above described features but depending on the amount of notifications
    sent per month there may be a cost associated.
  references: []
  page_start: 100
  audit_raw: 'From Console:

    1. Go to the Notifications Service page: https://console.us-ashburn1.oraclecloud.com/notification/topics

    2. Select the Compartment that hosts the notifications

    3. Find and click the Topic relevant to your monitoring alerts.

    4. Ensure a valid active subscription is shown.

    From CLI:

    1. List the topics in the Compartment that hosts the notifications

    oci ons topic list --compartment-id <compartment OCID> --all

    2. Note the OCID of the monitoring topic(s) using the topic-id field of the returned

    JSON and use it to list the subscriptions

    oci ons subscription list --compartment-id <compartment OCID> --topic-id

    <topic OCID> --all

    3. Ensure at least one active subscription is returned'
  remediation: 'From Console:

    1. Go to the Notifications Service page: https://console.us-ashburn1.oraclecloud.com/notification/topics

    2. Select the Compartment that hosts the notifications

    3. Click Create Topic

    4. Set the name to something relevant

    5. Set the description to describe the purpose of the topic

    6. Click Create

    7. Click the newly created topic

    8. Click Create Subscription

    9. Choose the correct protocol

    10. Complete the correct parameter, for instance email address

    11. Click Create

    From CLI:

    1. Create a topic in a compartment

    oci ons topic create --name <topic name> --description <topic description> --

    compartment-id <compartment OCID>

    2. Note the OCID of the topic using the topic-id field of the returned JSON and use

    it to create a new subscription

    oci ons subscription create --compartment-id <compartment OCID> --topic-id

    <topic OCID> --protocol <protocol> --subscription-endpoint <subscription

    endpoint>

    3. The returned JSON includes the id of the subscription.'
