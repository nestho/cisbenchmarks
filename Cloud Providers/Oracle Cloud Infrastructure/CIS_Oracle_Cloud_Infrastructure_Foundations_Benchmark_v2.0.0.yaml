  - Level 2
  description: Oracle Cloud Infrastructure Block Volume service lets you dynamically provision and manage block storage volumes.
    By default, the Oracle service manages the keys that encrypt block volumes. Block Volumes can also be encrypted using
    a customer managed key. Terminated Block Volumes cannot be recovered and any data on a terminated volume is permanently
    lost. However, Block Volumes can exist in a terminated state within the OCI Portal and CLI for some time after deleting.
    As such, any Block Volumes in this state should not be considered when assessing this policy.
  rationale: Encryption of block volumes provides an additional level of security for your data. Management of encryption
    keys is critical to protecting and accessing protected data. Customers should identify block volumes encrypted with Oracle
    service managed keys in order to determine if they want to manage the keys for certain volumes and then apply their own
    key lifecycle management to the selected block volumes.
