- id: '2.6'
  title: Ensure Oracle Integration Cloud (OIC) access is restricted to allowed sources.
  scoring: manual
  profile:
  - Level 1
  description: Oracle Integration (OIC) is a complete, secure, but lightweight integration solution that enables you to connect
    your applications in the cloud. It simplifies connectivity between your applications and connects both your applications
    that live in the cloud and your applications that still live on premises. Oracle Integration provides secure, enterprisegrade
    connectivity regardless of the applications you are connecting or where they reside. OIC instances are created within
    an Oracle managed secure private network with each having a public endpoint. The capability to configure ingress filtering
    of network traffic to protect your OIC instances from unauthorized network access is included. It is recommended that
    network access to your OIC instances be restricted to your approved corporate IP Addresses or Virtual Cloud Networks (VCN)s.
    Oracle Analytics Cloud (OAC) is a scalable and secure public cloud service that provides a full set of capabilities to
    explore and perform collaborative analytics for you, your workgroup, and your enterprise. OAC instances provide ingress
    filtering of network traffic or can be deployed with in an existing Virtual Cloud Network VCN. It is recommended that
    all new OAC instances be deployed within a VCN and that the Access Control Rules are restricted to your corporate IP Addresses
    or VCNs for existing OAC instances. Oracle Autonomous Database Shared (ADB-S) automates database tuning, security, backups,
    updates, and other routine management tasks traditionally performed by DBAs. ADB-S provide ingress filtering of network
    traffic or can be deployed within an existing Virtual Cloud Network (VCN). It is recommended that all new ADB-S databases
    be deployed within a VCN and that the Access Control Rules are restricted to your corporate IP Addresses or VCNs for existing
    ADB-S databases.
  rationale: Restricting connectivity to OIC Instances reduces an OIC instance’s exposure to risk. Restricting connectivity
    to Oracle Analytics Cloud instances reduces an OAC instance’s exposure to risk. Restricting connectivity to ADB-S Databases
    reduces an ADB-S database’s exposure to risk.
  impact: When updating ingress filters for an existing environment, care should be taken to ensure that IP addresses and
    VCNs currently used by administrators, users, and services to access your OIC instances are included in the updated filters.
    When updating ingress filters for an existing environment, care should be taken to ensure that IP addresses and VCNs currently
    used by administrators, users, and services to access your OAC instances are included in the updated filters. Also, these
    changes will temporarily bring the OAC instance offline. When updating ingress filters for an existing environment, care
    should be taken to ensure that IP addresses and VCNs currently used by administrators, users, and services to access your
    ADB-S instances are included in the updated filters.
