      5. Click on Password policy

      6. Click '
    severity: medium
- id: '1.6'
  title: Ensure IAM password policy prevents password reuse
  scoring: manual
  profile:
  - Level 1
  description: IAM password policies can prevent the reuse of a given password by the same user. It is recommended the password
    policy prevent the reuse of passwords.
  rationale: Enforcing password history ensures that passwords are not reused in for a certain period of time by the same
    user. If a user is not allowed to use last 24 passwords, that window of time is greater. This helps maintain the effectiveness
    of password security.
  impact: ''
  references: []
  page_start: 30
