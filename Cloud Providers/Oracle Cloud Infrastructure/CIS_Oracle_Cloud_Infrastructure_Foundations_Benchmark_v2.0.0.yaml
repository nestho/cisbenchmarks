    : \"ONS\",\n \"isEnabled\": true,\n \"topicId\": \"<topic-id>\"\n }]\n },\n \"condition\":\n\"{\\\"eventType\\\":[\\\"\
    com.oraclecloud.identitycontrolplane.createidentityprovide\nr\\\",\\\" com.oraclecloud.identitycontrolplane.deleteidentityprovider\\\
