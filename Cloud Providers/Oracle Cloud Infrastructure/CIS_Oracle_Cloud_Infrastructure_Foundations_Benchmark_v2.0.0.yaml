    with the visibility to resolve these issues. Upon detection, Cloud Guard generates a Problem. It is recommended to setup
    an Event Rule and Notification that gets triggered when Oracle Cloud Guard Problems are created, dismissed or remediated.
    Event Rules are compartment scoped and will detect events in child compartments. It is recommended to create the Event
    rule at the root compartment level.
  rationale: Cloud Guard provides an automated means to monitor a tenancy for resources that are configured in an insecure
    manner as well as risky network activity from these resources. Monitoring and alerting on Problems detected by Cloud Guard
    will help in identifying changes to the security posture.
  impact: There is no performance impact when enabling the above described features but depending on the amount of notifications
    sent per month there may be a cost associated.
