  title: Ensure no security lists allow ingress from 0.0.0.0/0 to port 22
  scoring: scored
  profile:
  - Level 1
  description: Security lists provide stateful and stateless filtering of ingress and egress network traffic to OCI resources
    on a subnet level. It is recommended that no security list allows unrestricted ingress access to port 22.
  rationale: Removing unfettered connectivity to remote console services, such as Secure Shell (SSH), reduces a server's exposure
    to risk.
  impact: For updating an existing environment, care should be taken to ensure that administrators currently relying on an
    existing ingress from 0.0.0.0/0 have access to ports 22 and/or 3389 through another network security group or security
    list.
  references: []
  page_start: 63
  audit_raw: 'From Console:

    1. Login to the OCI Console.

    2. Click the search bar at the top of the screen.

    3. Type Advanced Resource Query and hit enter.

    4. Click the Advanced Resource Query button in the upper right corner of the screen.

    5. Enter the following query in the query box:

    query SecurityList resources where

    (IngressSecurityRules.source = ''0.0.0.0/0'' &&

    IngressSecurityRules.protocol = 6 &&

    IngressSecurityRules.tcpOptions.destinationPortRange.max >= 22 &&

    IngressSecurityRules.tcpOptions.destinationPortRange.min =<= 22)

    6. Ensure the query returns no results.

    From CLI:

    1. Execute the following command:

    oci search resource structured-search --query-text "query SecurityList

    resources where

    (IngressSecurityRules.source = ''0.0.0.0/0'' &&

    IngressSecurityRules.protocol = 6 &&

    IngressSecurityRules.tcpOptions.destinationPortRange.max >= 22 &&

    IngressSecurityRules.tcpOptions.destinationPortRange.min <= 22)

    "

    2. Ensure the query returns no results.

    Cloud Guard

    Ensure Cloud Guard is enabled in the root compartment of the tenancy. For more

    information about enabling Cloud Guard, please look at the instructions included in

    Recommendation 3.15.

    From Console:

    1. Type Cloud Guard into the Search box at the top of the Console.

    2. Click Cloud Guard from the “Services” submenu.

    3. Click Detector Recipes in the Cloud Guard menu.

    4. Click OCI Configuration Detector Recipe (Oracle Managed) under the Recipe

    Name column.

    5. Find VCN Security list allows traffic to non-public port from all sources (0.0.0.0/0)

    in the Detector Rules column.

    6. Select the vertical ellipsis icon and chose Edit on the VCN Security list allows

    traffic to non-public port from all sources (0.0.0.0/0) row.

    7. In the Edit Detector Rule window find the Input Setting box and verify/add to the

    Restricted Protocol: Ports List setting to TCP:[22], UDP:[22].

    8. Click the Save button.

