- id: '4.13'
  title: Ensure VCN flow logging is enabled for all subnets
  scoring: scored
  profile:
  - Level 2
  description: VCN flow logs record details about traffic that has been accepted or rejected based on the security list rule.
  rationale: Enabling VCN flow logs enables you to monitor traffic flowing within your virtual network and can be used to
    detect anomalous traffic.
  impact: Enabling VCN flow logs will not affect the performance of your virtual network but it will generate additional use
    of object storage that should be controlled via object lifecycle management. By default, VCN flow logs are stored for
    30 days in object storage. Users can specify a longer retention period.
  references: []
  page_start: 141
  audit_raw: 'From Console:

    1. Go to the Virtual Cloud Network (VCN) page

    (https://cloud.oracle.com/networking/vcns)

    2. Click on the name of each VCN

    3. Click on each subnet within the VCN

    4. Under Resources click on Logs

    5. Verify that there is a log enabled for the subnet

    From CLI:

    1. Find the OCID of the specific Subnet based on Display Name and Compartment

    OCID

    oci network subnet list --compartment-id <compartment-ocid> --query "data

    [?\"display-name\"==''<subnet-display-name>'']".{"id:id"} --output table

    2. Find the OCID of the LogGroup used for FlowLogs

    oci logging log-group list --compartment-id <compartment-ocid> --query "data

    [?\"display-name\"==''<log-group-display-name>'']"

    3. List the logs associated with the OCID of the subnet.

    oci logging log list --log-group-id <log-group-ocid> --query "data

    [?configuration.source.resource==''<subnet-ocid>'']"

    4. Ensure a log is listed for this subnet'
  remediation: "From Console:\nFirst, if a log group for holding these logs has not already been created, create a log\ngroup\
    \ by the following steps:\n1. Go to the Log Groups page (https://cloud.oracle.com/logging/log-groups)\n2. Click the Create\
    \ Log Groups button in the middle of the screen.\n3. Select the relevant compartment to place these logs.\n4. Type a name\
    \ for the log group in the Name box.\n5. Add an optional description in the Description box.\n6. Click the Create button\
    \ in the lower left-hand corner.\nSecond, enable VCN flow logging for your subnet(s) by the following steps:\n1. Go to\
    \ the Logs page (https://cloud.oracle.com/logging/logs)\n2. Click the Enable Service Log button in the middle of the screen.\n\
    3. Select the relevant resource compartment.\n4. Select Virtual Cloud Networks (subnets) from the Service drop down menu.\n\
    5. Select the relevant resource from the resource drop down menu.\n6. Select Flow Logs (all records) from the Log Category\
    \ drop down menu.\n7. Type a name for your flow logs in the Log Name drop down menu.\n8. Click the Enable Log button in\
    \ the lower left-hand corner.\nFrom CLI:\n1. Create a log group:\noci logging log-group create --compartment-id <compartment-ocid>\
    \ --displayname \"<display-name>\" --description \"<description>\"\nThe output of the command gives you a work request\
    \ id. You can query the work\nrequest to see the status of the job by issuing the following command:\noci logging work-request\
    \ get --work-request-id <work-request-id>\nLook for the status filed to be SUCCEEDED.\n2. Get the Log group ID, needed\
    \ for creating the Log:\noci logging log-group list --compartment-id <compartment-ocid> --query\n'data[?contains(\"display-name\"\
    , `'\"<display-name>\"'`)].id|join(`\\n`, @)' --\nraw-output\n3. Create a JSON file called config.json with the following\
    \ content:\n{\n \"source\": {\n \"service\": \"flowlogs\",\n \"source-type\": \"OCISERVICE\",\n \"category\": \"all\"\n\
    \ }\n}\nThe compartment-id is the Compartment OCID of where the subnet resource is present.\nThe resource value is the\
    \ OCID of subnet for which flowlogs is enabled.\n4. Create the Service Log:\noci logging log create --log-group-id <log-group-ocid>\
    \ --display-name\n\"<display-name>\" --log-type SERVICE --is-enabled TRUE --configuration\nfile://config.json\nThe output\
    \ of the command gives you a work request id. You can query the work\nrequest to see that status of the job by issuing\
    \ the following command:\n oci logging work-request get --work-request-id <work-request-id>\nLook for the status filed\
    \ to be SUCCEEDED."
  checks:
  - type: manual_review
    info: 'From Console:

      1. Go to the Virtual Cloud Network (VCN) page

      (https://cloud.oracle.com/networking/vcns)

      2. Click on the name of each VCN

      3. Click on each subnet within the VCN

      4. Under Resources click on Logs

      5. Verify that there is a log enabled for the subnet

      From CLI:

      1. Find the OCID of the specific Subnet based on Display Name and Compartment

      OCID

      oci network subnet list --compartment-id <compartment-ocid> --query "data

      [?\"display-name\"==''<subnet-display-name>'']".{"id:id"} --output table

      2'
    severity: medium
- id: '4.14'
  title: Ensure Cloud Guard is enabled in the root compartment of the tenancy
  scoring: scored
  profile:
  - Level 1
  description: Cloud Guard detects misconfigured resources and insecure activity within a tenancy and provides security administrators
    with the visibility to resolve these issues. Upon detection, Cloud Guard can suggest, assist, or take corrective actions
    to mitigate these issues. Cloud Guard should be enabled in the root compartment of your tenancy with the default configuration,
    activity detectors and responders.
  rationale: Cloud Guard provides an automated means to monitor a tenancy for resources that are configured in an insecure
    manner as well as risky network activity from these resources.
  impact: There is no performance impact when enabling the above described features, but additional IAM policies will be required.
  references:
  - 1. https://docs.oracle.com/en-us/iaas/Content/General/Concepts/regions.htm
  page_start: 145
  audit_raw: 'From Console:

    1. Type Cloud Guard into the Search box at the top of the Console.

    2. Click Cloud Guard from the "Services" submenu.

    3. View if Cloud Guard is enabled

    From CLI:

    1. Retrieve the Cloud Guard status from the console

    oci cloud-guard configuration get --compartment-id <tenancy-ocid> --query

    ''data.status''

    2. Ensure the returned value is "ENABLED"`'
  remediation: "From Console:\n1. Type Cloud Guard into the Search box at the top of the Console.\n2. Click Cloud Guard from\
    \ the \"Services\" submenu.\n3. Click Enable Cloud Guard.\n4. Click Create Policy.\n5. Click Next.\n6. Under Reporting\
    \ Region, select a region.\n7. Under Compartments To Monitor, choose Select Compartment.\n8. Under Select Compartments,\
    \ select the root compartment.\n9. Under Configuration Detector Recipe, select OCI Configuration Detector\nRecipe (Oracle\
    \ Managed).\n10. Under Activity Detector Recipe, select OCI Activity Detector Recipe\n(Oracle Managed).\n11. Click Enable.\n\
    From CLI:\n1. Create OCI IAM Policy for Cloud Guard\noci iam policy create --compartment-id '<tenancy-id>' --name\n'CloudGuardPolicies'\
    \ --description 'Cloud Guard Access Policy' --statements\n'[\n \"allow service cloudguard to read vaults in tenancy\"\
    ,\n \"allow service cloudguard to read keys in tenancy\",\n \"allow service cloudguard to read compartments in tenancy\"\
    ,\n \"allow service cloudguard to read tenancies in tenancy\",\n \"allow service cloudguard to read audit-events in tenancy\"\
    ,\n \"allow service cloudguard to read compute-management-family in tenancy\",\n \"allow service cloudguard to read instance-family\
    \ in tenancy\",\n \"allow service cloudguard to read virtual-network-family in tenancy\",\n \"allow service cloudguard\
    \ to read volume-family in tenancy\",\n \"allow service cloudguard to read database-family in tenancy\",\n \"allow service\
    \ cloudguard to read object-family in tenancy\",\n \"allow service cloudguard to read load-balancers in tenancy\",\n \"\
    allow service cloudguard to read users in tenancy\",\n \"allow service cloudguard to read groups in tenancy\",\n \"allow\
    \ service cloudguard to read policies in tenancy\",\n \"allow service cloudguard to read dynamic-groups in tenancy\",\n\
    \ \"allow service cloudguard to read authentication-policies in tenancy\"\n ]'\n2. Enable Cloud Guard in root compartment\n\
    oci cloud-guard configuration update --reporting-region '<region-name>' --\ncompartment-id '<tenancy-id>' --status 'ENABLED'"
  checks:
  - type: manual_review
    info: 'From Console:

      1. Type Cloud Guard into the Search box at the top of the Console.

      2. Click Cloud Guard from the "Services" submenu.

      3. View if Cloud Guard is enabled

      From CLI:

      1. Retrieve the Cloud Guard status from the console

      oci cloud-guard configuration get --compartment-id <tenancy-ocid> --query

      ''data.status''

      2. Ensure the returned value is "ENABLED"`'
    severity: medium
- id: '4.15'
