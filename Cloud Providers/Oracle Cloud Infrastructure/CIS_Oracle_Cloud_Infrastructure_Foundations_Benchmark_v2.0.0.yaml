    <insert detector recipe ocid> --detector-rule-id API_KEY_TOO_OLD --details

    ''{"configurations":[{ "configKey" : "apiKeyTooOldConfig", "name" : "Days",

    "value" : "90", "dataType" : null, "values" : null }]}''

