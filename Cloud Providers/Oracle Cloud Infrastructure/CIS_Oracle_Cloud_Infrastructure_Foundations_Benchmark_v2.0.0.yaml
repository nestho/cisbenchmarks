- id: '1.7'
  title: Ensure MFA is enabled for all users with a console password
  scoring: scored
  profile:
  - Level 1
  description: Multi-factor authentication is a method of authentication that requires the use of more than one factor to
    verify a user’s identity. With MFA enabled in the IAM service, when a user signs in to Oracle Cloud Infrastructure, they
    are prompted for their user name and password, which is the first factor (something that they know). The user is then
    prompted to provide a verification code from a registered MFA device, which is the second factor (something that they
    have). The two factors work together, requiring an extra layer of security to verify the user’s identity and complete
    the sign-in process. OCI IAM supports two-factor authentication using a password (first factor) and a device that can
    generate a time-based one-time password (TOTP) (second factor). See OCI documentation for more details.
  rationale: Multi factor authentication adds an extra layer of security during the login process and makes it harder for
    unauthorized users to gain access to OCI resources.
  impact: ''
  references:
  - 1. https://docs.cloud.oracle.com/en-us/iaas/Content/Identity/Tasks/usingmfa.htm
  - 2. https://docs.oracle.com/enus/iaas/Content/Security/Reference/iam_security_topic-IAM_MFA.htm
  page_start: 32
  audit_raw: "OCI IAM without Identity Domains\nFrom Console:\n1. Login into OCI Console.\n2. Select Identity & Security from\
    \ Services menu\n3. Select Users from Identity menu.\n4. Click on an individual user.\n5. Ensure the word Enabled is next\
    \ to Multi-factor authentication.\nFrom CLI:\n1. Set up the OCI CLI with an IAM administrator user who has access to read\
    \ IAM\npolicies.\n2. Run OCI CLI command providing the root compartment OCID\noci iam user list --query 'data[].[\"id\"\
    ,\"name\",\"is-mfa-activated\", \"can-useconsole-password\"]' --output table\n3. Verify that the values in Column3 are\
    \ not false\nFrom Cloud Guard:\nTo Enable Cloud Guard Auditing:\nEnsure Cloud Guard is enabled in the root compartment\
    \ of the tenancy. For more\ninformation about enabling Cloud Guard, please look at the instructions included in\nRecommendation\
    \ 3.15.\nFrom Console:\n1. Type Cloud Guard into the Search box at the top of the Console\n2. Click Cloud Guard from the\
