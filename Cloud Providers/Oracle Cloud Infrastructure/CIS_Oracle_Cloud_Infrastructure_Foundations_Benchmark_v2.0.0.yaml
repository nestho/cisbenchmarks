- id: '1.13'
  title: Ensure all OCI IAM user accounts have a valid and current email address
  scoring: manual
  profile:
  - Level 1
  description: All OCI IAM local user accounts have an email address field associated with the account. It is recommended
    to specify an email address that is valid and current. If you have an email address in your user profile, you can use
    the Forgot Password link on the sign on page to have a temporary password sent to you. OCI instances, OCI database and
    OCI functions can access other OCI resources either via an OCI API key associated to a user or via Instance Principal.
    Instance Principal authentication can be achieved by inclusion in a Dynamic Group that has an IAM policy granting it the
    required access or using an OCI IAM policy that has request.principal added to the where clause. Access to OCI Resources
    refers to making API calls to another OCI resource like Object Storage, OCI Vaults, etc.
  rationale: Having a valid and current email address associated with an OCI IAM local user account allows you to tie the
    account to identity in your organization. It also allows that user to reset their password if it is forgotten or lost.
    Instance Principal reduces the risks related to hard-coded credentials. Hard-coded API keys can be shared and require
    rotation, which can open them up to being compromised. Compromised credentials could allow access to OCI services outside
    of the expected radius.
  impact: For an OCI instance that contains embedded credential audit the scripts and environment variables to ensure that
    none of them contain OCI API Keys or credentials.
  references:
  - 1. https://docs.oracle.com/enus/iaas/Content/Identity/Tasks/managingdynamicgroups.htm
  page_start: 52
  audit_raw: 'OCI IAM without Identity Domains

    From Console:

    1. Login into OCI Console.

    2. Select Identity & Security from Services menu

    3. Select Users from the Identity menu.

    4. Click on an individual user.

    5. Check if they are local OCI IAM local user account, the word No is next to

    Federated.

    6. Ensure a valid and current email address is next to email.

    From CLI:

    1. Execute the following:

    oci iam user list --output table --query "data [?\"externalidentifier\"==null].{Name:name,Email:email,OCID:id}"

    2. Ensure that the column named Email has a valid and current email address.

    OCI IAM with Identity Domains

    From Console:

    1. Login to OCI Console.

    2. Select Identity & Security from the Services menu.

    3. Select Domains from the Identity menu.

    4. For each domain listed, click on the name and select Users.

    5. Click on an individual user under the Username heading.

    6. Ensure a valid and current email address is next to Email and Recovery email.

    OCI IAM without Identity Domains

    From Console (Dynamic Groups):

    1. Go to https://cloud.oracle.com/identity/dynamicgroups

    2. Click on a Dynamic Group.

    3. Check if the Matching Rules includes the instances accessing your OCI

    resources.

    From Console (request.principal):

    1. Go to https://cloud.oracle.com/identity/policies

    2. Select a Compartment

