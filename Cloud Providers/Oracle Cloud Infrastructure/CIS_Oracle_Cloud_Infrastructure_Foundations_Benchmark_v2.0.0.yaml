    : true,\n \"topicId\": \"<topic id>\"\n }]\n },\n \"condition\":\n\"{\\\"eventType\\\":[\\\" com.oraclecloud.cloudguard.problemdetected\\\
    \",\\\"\ncom.oraclecloud.cloudguard.problemdismissed\\\",\\\"\ncom.oraclecloud.cloudguard.problemremediated\\\"],\\\"\
    data\\\":{}}\",\n \"displayName\": \"<display name>\",\n \"description\": \"<description>\",\n \"isEnabled\": true,\n\
    \ \"compartmentId\": \"compartment OCID\"\n}\n1. Create the actual event rule\noci events rule create --from-json file://event_rule.json\n\
    1. Note in the JSON returned that it lists the parameters specified in the JSON file\nprovided and that there is an OCID\
