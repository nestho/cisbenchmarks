    \ output=`oci compute instance list --compartment-id $compid --\nregion $region --all 2>/dev/null | jq -r '.data[] | select(.\"\
    instanceoptions\".\"are-legacy-imds-endpoints-disabled\" == false )'`\n if [ ! -z \"$output\" ]; then echo $output; fi\n\
    \ done\n done\n2. No results should be returned"
  remediation: 'From Console:

