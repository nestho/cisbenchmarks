- id: '3.2'
  title: Ensure Secure Boot is enabled on Compute Instance
  scoring: scored
  profile:
  - Level 2
  description: Shielded Instances with Secure Boot enabled prevents unauthorized boot loaders and operating systems from booting.
    This prevent rootkits, bootkits, and unauthorized software from running before the operating system loads. Secure Boot
    verifies the digital signature of the system's boot software to check its authenticity. The digital signature ensures
    the operating system has not been tampered with and is from a trusted source. When the system boots and attempts to execute
    the software, it will first check the digital signature to ensure validity. If the digital signature is not valid, the
    system will not allow the software to run. Secure Boot is a feature of UEFI(Unified Extensible Firmware Interface) that
    only allows approved operating systems to boot up.
  rationale: A Threat Actor with access to the operating system may seek to alter boot components to persist malware or rootkits
    during system initialization. Secure Boot helps ensure that the system only runs authentic software by verifying the digital
    signature of all boot components.
  impact: 'An existing instance cannot be changed to a Shielded instance with Secure boot enabled. Shielded Secure Boot not
    available on all instance shapes and Operating systems. Additionally the following limitations exist: Thus to enable you
    have to terminate the instance and create a new one. Also, Shielded instances do not support live migration. During an
    infrastructure maintenance event, Oracle Cloud Infrastructure live migrates supported VM instances from the physical VM
    host that needs maintenance to a healthy VM host with minimal disruption to running instances. If you enable Secure Boot
    on an instance, the instance cannot be migrated, because the hardware TPM is not migratable. This may result in an outage
    because the TPM can''t be migrate from a unhealthy host to healthy host.'
  references:
  - 1. https://docs.oracle.com/en-us/iaas/Content/Compute/References/shieldedinstances.htm
  - 2. https://uefi.org/sites/default/files/resources/UEFI_Secure_Boot_in_Modern_Com
  page_start: 91
  audit_raw: "From Console:\n1. Login to the OCI Console\n2. Select compute instance in your compartment.\n3. Click on each\
    \ instance name.\n4. In the Launch Options section,\n5. Check if Secure Boot is Enabled.\nFrom CLI:\nRun command:\nfor\
    \ region in `oci iam region-subscription list | jq -r '.data[] | .\"regionname\"'`;\n do\n for compid in `oci iam compartment\
    \ list --compartment-id-in-subtree\nTRUE 2>/dev/null | jq -r '.data[] | .id'`\n do\n output=`oci compute instance list\
    \ --compartment-id $compid --\nregion $region --all 2>/dev/null | jq -r '.data[] | select(.\"platform-config\"\n== null\
    \ or \"platform-config\".\"is-secure-boot-enabled\" == false )'`\n if [ ! -z \"$output\" ]; then echo $output; fi\n done\n\
    \ done\nIn response, check if platform-config are not null and is-secure-boot-enabled is set\nto true"
