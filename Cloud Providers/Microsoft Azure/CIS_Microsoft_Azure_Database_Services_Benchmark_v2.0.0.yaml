- id: '6.1'
  title: Ensure Azure Database for PostgreSQL uses Customer Managed Keys for Encryption at Rest
  scoring: manual
  profile:
  - Level 2
  description: Enable sensitive data encryption at rest using Customer Managed Keys (CMK) rather than Microsoft Managed keys
    (MMK).
  rationale: 'By default, data in Azure Database for PostgreSQL is encrypted using Microsoft Service Managed Keys (''SMK''
    or ''MMK'') which constitutes an implied trust. If an organization wishes to control and manage encryption keys, however,
    customer-managed keys (CMK) can be supplied. The provided key is used to protect and control access to the key that encrypts
    the data. You can also choose to automatically update the key version used for Azure Database for MySQL encryption whenever
    a new version is available in the associated Key Vault. NOTE: This is primarily recommended where control of encryption
    keys is specified by compliance or security framework requirements. In many circumstances, Microsoft Managed Key encryption
    is an acceptable method of accomplishing encryption at rest.'
  impact: If the key expires by setting the 'activation date' and 'expiration date', the user must rotate the key manually.
    Using Customer Managed Keys may also incur additional man-hour requirements to create, store, manage, and protect the
    keys as needed.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/postgresql/security/security-dataencryption
  page_start: 108
  audit_raw: 'Audit from Azure Portal

    1. From Azure Database for PostgreSQL select the server you wish to audit.

    2. In the left column expand > Security.

    3. Select Data Encryption.

    4. Determine if Customer-managed key is selected.

