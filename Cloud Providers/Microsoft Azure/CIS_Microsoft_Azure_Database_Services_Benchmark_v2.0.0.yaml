    • Policy ID: 12c74c95-0efd-48da-b8d9-2a7d68470c92 - Name: ''PostgreSQL

    flexible servers should use customer-managed keys to encrypt data at rest'''
  remediation: 'Remediate from Azure Portal

    1. From Azure Database for PostgreSQL select the server you wish to audit.

    2. In the left column expand > Security.

    3. Select Data Encryption.

    4. Select Customer-managed key.

    5. In the window that opens, use a User assigned managed identity by either

    creating or selecting one.

    6. Choose a key selection method. For Enter a key identifier, enter the for

    URL for the key in Azure Key vault. For Select a key, navigate through the

    menu and choose the location of your key store by subscription, and whether it is

    a key vault or managed HSM.

    7. Once a key is chosen, select Save. Verify on the next window that your changes

    have taken effect.'
  checks:
