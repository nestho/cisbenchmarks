- id: '4.1'
  title: Ensure Data Factory is encrypted using Customer Managed Keys
  scoring: manual
  profile:
  - Level 2
  description: Customer-managed keys introduce additional depth to security by providing a means to manage access control
    for encryption keys. Where compliance and security frameworks indicate the need, and organizational capacity allows, sensitive
    data at rest can be encrypted using customer-managed keys (CMK) rather than Microsoft-managed keys.
  rationale: By default in Azure, data at rest tends to be encrypted using Microsoft-managed keys. If your organization wants
    to control and manage encryption keys for compliance and defense-in-depth, customer-managed keys can be established. Configuring
    the storage account with the activity log export container to use CMKs provides additional confidentiality controls on
    log data, as a given user must have read permission on the corresponding storage account and must be granted decrypt permission
    by the CMK. While it is possible to automate the assessment of this recommendation, the assessment status for this recommendation
    remains 'Manual' due to ideally limited scope. The scope of application—which workloads CMK is applied to—should be carefully
    considered to account for organizational capacity and targeted to workloads with specific need for CMK.
  impact: If the key expires due to setting the 'activation date' and 'expiration date', the key must be rotated manually.
    Using customer-managed keys may also incur additional man-hour requirements to create, store, manage, and protect the
    keys as needed.
