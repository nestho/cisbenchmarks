    \ = New-AzPrivateEndpoint `\n -Name $privateEndpointName `\n -ResourceGroupName $resourceGroup `\n -Location $location\
    \ `\n -Subnet $subnet `\n -PrivateLinkServiceConnection $privateLinkConnection"
