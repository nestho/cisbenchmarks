- id: '9.3'
  title: Ensure no Azure SQL Database firewall rule is overly permissive
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: Ensure that no SQL Databases have overly permissive firewall rules (e.g. rule allowing traffic with start IP
    address of 0.0.0.0 and end IP address of 255.255.255.255, or other combinations allowing large swathes of IP addresses).
    Transparent Data Encryption (TDE) with Customer-managed key support provides increased transparency and control over the
    TDE Protector, increased security with an HSM-backed external service, and promotion of separation of duties. With TDE,
    data is encrypted at rest with a symmetric key (called the database encryption key) stored in the database or data warehouse
    distribution. To protect this data encryption key (DEK) in the past, only a certificate that the Azure SQL Service managed
    could be used. Now, with Customer-managed key support for TDE, the DEK can be protected with an asymmetric key that is
    stored in the Azure Key Vault. The Azure Key Vault is a highly available and scalable cloud-based key store which offers
    central key management, leverages FIPS 140-2 Level 2 validated hardware security modules (HSMs), and allows separation
    of management of keys and data for additional security. Based on business needs or criticality of data/databases hosted
    on a SQL server, it is recommended that the TDE protector is encrypted by a key that is managed by the data owner (Customer-managed
    key).
  rationale: 'The preferred setting for Public Network Access is disabled. If Public Network Access is disabled, this recommendation
    is moot. In general, the use of well architected Private Endpoints for network traffic management is strongly preferred
    to allowing any public network access. Where Public Network Access must be allowed as an exception, Azure SQL Server provides
    a firewall to explicitly define traffic allowance and denial. In order to reduce the potential attack surface for a SQL
    server, firewall rules should be reviewed from time to time to ensure that no rule is overly permissive, and all included
    rules are justified through association with known and trusted sources and destinations. NOTE: For some Azure services
    to work with Azure SQL databases, the Allow Azure services and resource to access this server exception may need to be
    allowed. This exception creates a firewall rule named AllowAllWindowsAzureIps that may be considered overly permissive.
    It should be noted that this exception places implicit trust on a rule which is defined and managed by Microsoft. This
    rule can be viewed in the SQL database''s master database under sys.firewall_rules (more details here: https://learn.microsoft.com/en-us/sql/relational-databases/system-catalogviews/sys-firewall-rules-azure-sql-database?view=azuresqldb-current).
    Customer-managed key support for Transparent Data Encryption (TDE) allows user control of TDE encryption keys and restricts
    who can access them and when. Azure Key Vault, Azure’s cloud-based external key management system, is the first key management
    service where TDE has integrated support for Customer-managed keys. With Customer-managed key support, the database encryption
    key is protected by an asymmetric key stored in the Key Vault. The asymmetric key is set at the server level and inherited
    by all databases under that server.'
  impact: Managing firewall rules will require some consideration from a network architecture perspective to ensure appropriate
    traffic is allowed. Once TDE protector is encrypted with a Customer-managed key, it transfers entire responsibility of
    respective key management on to you, and hence you should be more careful about doing any operations on the particular
    key in order to keep data from corresponding SQL server and Databases hosted accessible. When deploying Customer Managed
    Keys, it is prudent to ensure that you also deploy an automated toolset for managing these keys (this should include discovery
    and key rotation), and Keys should be stored in an HSM or hardware backed keystore, such as Azure Key Vault. As far as
    toolsets go, check with your cryptographic key provider, as they may well provide one as an add-on to their service.
  references:
  - 1. https://docs.microsoft.com/en-us/sql/database-engine/configurewindows/configure-a-windows-firewall-for-database-engine-access?view=sqlserver-2017
  - 2. https://docs.microsoft.com/en-us/powershell/module/azurerm.sql/getazurermsqlserverfirewallrule?view=azurermps-5.2.0
  - 1. https://docs.microsoft.com/en-us/sql/relationaldatabases/security/encryption/transparent-data-encryption-byok-azure-sql
  - 2. https://azure.microsoft.com/en-in/blog/preview-sql-transparent-data-encryptiontde-with-bring-your-own-key-support/
