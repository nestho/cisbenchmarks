  rationale: Logging of changes, events, and information related to Cosmos DB provides a diagnostic tool and a forensic record
    of activity. An effective set of logs help provide integrity and availability to the service and contribute to the effectiveness
    of detective systems such as a SIEM.
  impact: There may be additional storage costs for logging a large amount of events. Potentially only keep logs for a certain
    timeframe before they are deleted.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/azure-monitor/logs/quick-createworkspace
  - 2. https://learn.microsoft.com/en-us/azure/cosmos-db/monitor
  page_start: 70
  audit_raw: 'NOTE: This procedure assumes a Log Analytics Workspace or other logging

    destination already exists. Please see attached resources on this setup.

    Audit from Azure Portal

    1. From Azure CosmosDB, select the database you wish to audit.

    2. Scroll down in the left column and select > Monitoring.

    3. Select Diagnostic Settings.

    4. Determine if there are any diagnostic settings that are being sent to a logging

    location. You will need to open each listed and determine if allLogs under

    Category groups is checked.

    Audit from PowerShell

    1. Get the CosmosDB accounts for a specific resource group. Repeat for each

    resource group as necessary.

    Get-AzCosmosDBAccount -ResourceGroupName <resource group name>

    2. For each CosmosDB, determine which log categories are enabled for each

    account using the Id of each CosmosDB Account.

    Get-AzDiagnosticSetting -ResourceId <CosmosDB Account Id>

    3. Within the output of the above command, ensure the log categories have

    Enabled set to true'
  remediation: "NOTE: This procedure assumes a Log Analytics Workspace or other logging\ndestination already exists. Please\
    \ see attached resources on this setup.\nRemediate from Azure Portal\n1. From Azure CosmosDB, select the database you\
    \ wish to audit.\n2. Scroll down in the left column and select > Monitoring.\n3. Select Diagnostic Settings.\n4. Select\
    \ + Add Diagnostic Setting\n5. Enter your name for this setting in Diagnostic Setting Name.\n6. Select allLogs under Category\
    \ groups\n7. Select Send to Log Analytics workspace or other logging solution under\nDestination details.\n8. Select your\
    \ Azure subscription, and your log analytics workspace, or other\nconnection details depending on your logging solution.\n\
    9. Select Save in the top left corner.\nRemediate from PowerShell For each CosmosDB account out of compliance, enable\n\
