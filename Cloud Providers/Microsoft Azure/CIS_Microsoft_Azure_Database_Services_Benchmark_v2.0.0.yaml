    Get-AzPrivateEndpoint-ResourceGroupName <ResourceGroupName> |

    Where-Object{

    $_.PrivateLinkServiceConnections.PrivateLinkServiceId -eq

    <AzureCacheforRedisName>

    }

    2. View the private endpoints associated with the cache.

