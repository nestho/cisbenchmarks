- id: '5.9'
  title: Ensure server parameter 'tls_version' is set to 'TLSv1.2' (or higher) for MySQL flexible server
  scoring: scored
  profile:
  - Level 1
  description: Ensure tls_version on MySQL flexible servers is set to use TLS version 1.2 or higher.
  rationale: The Secure Sockets Layer (SSL) protocol encrypts network traffic transiting between server and client. Using
    only the most recent versions of SSL protocols (TLS version 1.2 and higher) eliminates susceptibility to known exploited
    vulnerabilities of outdated versions of TLS. If TLS 1.2 does not provide additional granular configuration options for
    supported cipher suites, there's a chance that default ciphers which employ Cipher Block Chaining (CBC) mode may be enabled
    which would introduce Padding Oracle types of vulnerabilities. TLS 1.3 does not support CBC mode ciphers by default and
    by default supports GCM ciphers which include an extra authentication step during the clear text to cipher text encryption
    process. TLS version 1.3 is preferable where it is possible to implement. Versions 1.0 and 1.1 of TLS are no longer considered
    secure. These versions should not be used or permitted where data integrity and confidentiality are required.
  impact: ''
  references:
  - 1. https://learn.microsoft.com/en-us/azure/mysql/flexible-server/conceptsnetworking#tls-and-ssl
  - 2. https://learn.microsoft.com/en-us/azure/mysql/flexible-server/how-to-connect-tlsssl
  page_start: 104
  audit_raw: "Audit from Azure Portal\n1. Login to Azure Portal using https://portal.azure.com.\n2. Go to Azure Database for\
    \ MySQL flexible servers.\n3. For each database, under Settings, click Server parameters.\n4. In the filter bar, type\
    \ tls_version.\n5. Ensure tls_version is set to TLSv1.2 (or higher).\nAudit from Azure CLI\nEnsure the value of the below\
    \ command contains TLSv1.2 or higher, and does not\ncontain anything lower than TLSv1.2:\naz mysql flexible-server parameter\
    \ show --resource-group <resourceGroup> --\nserver-name <serverName> --name tls_version\nExample output:\n{\n \"allowedValues\"\
    : \"TLSv1,TLSv1.1,TLSv1.2\",\n \"dataType\": \"Set\",\n \"defaultValue\": \"TLSv1.2\",\n \"description\": \"Which protocols\
    \ the server permits for encrypted\nconnections. By default, TLS 1.2 is enforced\",\n \"id\":\n\"/subscriptions/<subscriptionId>/resourceGroups/<resourceGroupName>/providers\n\
    /Microsoft.DBforMySQL/flexibleServers/<serverName>/configurations/tls_version\n\",\n \"isConfigPendingRestart\": \"False\"\
    ,\n \"isDynamicConfig\": \"False\",\n \"isReadOnly\": \"False\",\n \"name\": \"tls_version\",\n \"resourceGroup\": \"\
    <resourceGroupName>\",\n \"source\": \"system-default\",\n \"systemData\": null,\n \"type\": \"Microsoft.DBforMySQL/flexibleServers/configurations\"\
    ,\n \"value\": \"TLSv1.2\"\n}\nAudit from PowerShell\nEnsure the Value of the below command contains TLSv1.2 or higher,\
    \ and does not\ncontain anything lower than TLSv1.2:\nGet-AzMySqlFlexibleServerConfiguration -ResourceGroupName <resourceGroup>\
    \ -\nServerName <ServerName> -Name tls_version"
  remediation: 'Remediate from Azure Portal

    1. Login to Azure Portal using https://portal.azure.com.

    2. Go to Azure Database for MySQL flexible servers.

    3. For each database, under Settings, click Server parameters.

    4. In the filter bar, type tls_version.

    5. Click on the VALUE dropdown next to tls_version, and check TLSv1.2 (or

    higher).

    6. Uncheck anything lower than TLSv1.2.

    7. Click Save.

    Remediate from Azure CLI

    Use the below command to update MySQL flexible servers to use TLS version 1.2:

    az mysql flexible-server parameter set --resource-group <resourceGroup> --

    server-name <serverName> --name tls_version --value TLSv1.2

    Remediate from PowerShell

    Use the below command to update MySQL flexible servers to use TLS version 1.2:

    Update-AzMySqlFlexibleServerConfiguration -ResourceGroupName <resourceGroup>

    -ServerName <serverName> -Name tls_version -Value TLSv1.2'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Login to Azure Portal using https://portal.azure.com.

      2. Go to Azure Database for MySQL flexible servers.

      3. For each database, under Settings, click Server parameters.

