- id: '2.8'
  title: Ensure that Azure Cache for Redis is Using CustomerManaged Keys
  scoring: manual
  profile:
  - Level 2
  description: Customer Managed Keys allow you more granular control over the encryption of your information.
  rationale: Customer Managed Keys increase security of your disk encryption by offering features like custom managed expiration
    dates, allowing you to set your own key lifecycle.
  impact: This comes with an increased cost, as only Enterprise tier Azure Cache for Redis supports customer managed keys.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/azure-cache-for-redis/cache-how-toencryption
  - 2. https://learn.microsoft.com/enus/powershell/module/az.redisenterprisecache/get-azredisenterprisecache
  page_start: 42
  audit_raw: 'Audit From Azure Portal

    1. Select your Redis Cache.

    2. In the left column select Encryption.

    3. View the keys listed, and determine if the checkbox for ''Customer Managed Key''

    is selected.

    Audit From Powershell

    1. Run the following command to determine if your Azure Cache for Redis is using

    a Customer Managed Key.

    Get-AzRedisEnterpriseCache -ResourceGroupName "<resourcegroupname>" -Name

    "<azurecacheforredisname" | Select-Object -ExpandProperty

    EnableCustomerManagedKey

    2. If the command returns true, you are using a customer managed key.

    Audit From Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 09aa11bb-87ec-409f-bf0b-49b7c1561a87 - Name: ''Azure Cache for

    Redis Enterprise should use customer-managed keys for encrypting disk data'''
  remediation: 'Remediate From Azure Portal

    1. Select your Redis Cache.

    2. In the left column select Encryption.

    3. Select the checkbox to enable Customer Managed keys.

    4. Select Add to assign a user managed identity with permissions to access your

    Azure key vault.

    5. Select your subscription and Azure Key vault that contains your customer

    managed key. Ensure this is in the same region as your Azure Cache for Redis.

    6. Select your customer managed key.

    7. Click Save.

    Remediate From Powershell

    1. In Azure Key Vault find the full URL for a key you have created. Then run the

    following command with the information for your environment.

    Update-AzRedisEnterpriseCache -ClusterName "<yourclustername>"

    =ResourceGroupName "<yourresourcegroupname>" -

    CustomerManagedKeyEncryptionKeyUrl "<thekeyinazurekeyvaultURL>"'
  checks:
  - type: manual_review
    info: 'Audit From Azure Portal

      1. Select your Redis Cache.

      2. In the left column select Encryption.

      3. View the keys listed, and determine if the checkbox for ''Customer Managed Key''

      is selected.

      Audit From Powershell

      1. Run the following command to determine if your Azure Cache for Redis is using

      a Customer Managed Key.

      Get-AzRedisEnterpriseCache -ResourceGroupName "<resourcegroupname>" -Name

      "<azurecacheforredisname" | Select-Object -ExpandProperty

      EnableCustomerManagedKey

      2. If the command returns tr'
    severity: medium
- id: '2.9'
  title: Ensure 'Access Keys Authentication' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Ensure access key authentication is disabled for Azure Cache for Redis instances. Use Microsoft Entra for secure
    cache authentication.
  rationale: Access keys introduce security risks and management challenges, as they are longlived secrets vulnerable to expose
    or misuse. Microsoft Entra authentication provides centralized identity and access management, reducing risk and improving
    overall security.
  impact: Disabling access key authentication terminates all existing client connections. Ensure retry mechanisms are in place
    for reconnection via Microsoft Entra. Ensure Microsoft Entra authentication is enabled and configured before disabling
    access key authentication. Refer to the recommendation in this section titled "Ensure 'Microsoft Entra Authentication'
    is 'Enabled'" for details.
  references:
  - 1. https://learn.microsoft.com/en-gb/azure/azure-cache-for-redis/cache-azureactive-directory-for-authentication
  page_start: 45
  audit_raw: 'Audit from Azure Portal

    1. Go to Azure Cache for Redis.

    2. Select the name of a cache.

    3. Under Settings, select Authentication.

    4. Select Access keys.

    5. Ensure Disable Access Keys Authentication is checked.

    6. Repeat steps 1-5 for each cache.

    Audit from Azure CLI

    Run the following command to list caches:

    az redis list

    For each cache, run the following command to get the

    disableAccessKeyAuthentication setting:

    az redis show --resource-group <resource-group> --name <cache> --query

    disableAccessKeyAuthentication

    Ensure true is returned.

    Audit from PowerShell

    Run the following command to list caches:

    Get-AzRedisCache

    Run the following command to get the cache in a resource group with a given name:

    $cache = Get-AzRedisCache -ResourceGroupName <resource-group> -Name <cache>

    Run the following command to get the DisableAccessKeyAuthentication setting:

    $cache.DisableAccessKeyAuthentication

    Ensure True is returned.

    Repeat for each cache.

    Audit From Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 3827af20-8f80-4b15-8300-6db0873ec901 - Name: ''Azure Cache for

    Redis should not use access keys for authentication'''
  remediation: 'Remediate from Azure Portal

    1. Go to Azure Cache for Redis.

    2. Select the name of a cache.

    3. Under Settings, select Authentication.

    4. Select Access keys.

    5. Check Disable Access Keys Authentication.

    6. Select Save.

    7. Select Yes to confirm.

    8. Repeat steps 1-7 for each cache.

    Remediate from Azure CLI

    For each cache requiring remediation, run the following command to disable access key

    authentication:

    az redis update --resource-group <resource-group> --name <cache> --set

    "disableAccessKeyAuthentication=true"

    Remediate from PowerShell

    For each cache requiring remediation, run the following command to disable access key

    authentication:

    Set-AzRedisCache -ResourceGroupName <resource-group> -Name <cache> -

    DisableAccessKeyAuthentication $true'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Azure Cache for Redis.

      2. Select the name of a cache.

      3. Under Settings, select Authentication.

      4. Select Access keys.

      5. Ensure Disable Access Keys Authentication is checked.

      6. Repeat steps 1-5 for each cache.

      Audit from Azure CLI

      Run the following command to list caches:

      az redis list

      For each cache, run the following command to get the

