  title: Ensure that Data Factory is using RBAC to manage privilege assignment
  scoring: manual
  profile:
  - Level 2
  description: Role Based Access Control (RBAC) is setting permissions to the role that a user occupies. Often the user is
    added to a group which the account inherits permissions from. This is different than Access Policies which are used on
    an individual case by case basis for each user.
  rationale: RBAC enhances security by limiting user privilege to only what is necessary for a job role, reducing the risk
    of unauthorized access. Additionally, RBAC aids compliance with regulations and provides clear accountability by tracking
    access activities linked to specific roles.
  impact: There will be a slight increase in technical overhead in that user permissions will need to be manually assigned.
    However once added to a group, permissions may be edited for every account in the group at one time.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/data-factory/concepts-roles-permissions
