    as it provides stronger security through managed credentials, multi-factor authentication (MFA), centralized access control,
    and seamless integration with Azure RBAC.
  rationale: Disabling key-based authorization ensures that access to your Azure Cosmos DB account relies on the more secure
    Microsoft Entra ID authentication, reducing the risk of credential misuse and unauthorized access.
  impact: Administrative overhead in configuring, managing, and monitoring Entra ID authentication and role-based access.
