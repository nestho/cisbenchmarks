    database accounts should have local authentication methods disabled'''
  remediation: 'Map all the resources that currently have access to the Azure Cosmos DB account with

    keys or access tokens.

    Create an Entra ID identity for each of these resources:

    • For Azure resources, you can create a managed identity. You may choose

    between system-assigned and user-assigned managed identities.

    • For non-Azure resources, create Entra ID service principals. Grant each Entra ID

    service principal the minimum permissions it requires. We recommend using one

    of the two built-in role definitions: Cosmos DB Built-in Data Reader or Cosmos

    DB Built-in Data Contributor. Validate that the new resource is functioning

    correctly. After new permissions are granted to identities, it may take a few hours

    for them to propagate.

    When all resources work correctly with the new identities, continue to the next step.

