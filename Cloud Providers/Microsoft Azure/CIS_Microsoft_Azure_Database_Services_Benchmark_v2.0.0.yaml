    disableLocalAuth to True:

    $cosmosdb = Get-AzResource -ResourceType

    Microsoft.DocumentDB/databaseAccounts -ResourceGroupName <resource-group> -

    ResourceName <cosmosdb-account>

    $cosmosdb.Properties.disableLocalAuth = "True"

    $cosmosdb | Set-AzResource -Force'
