    (MMK).
  rationale: 'By default, data in Azure Database for MySQL is encrypted using Microsoft ServiceManaged Keys (MMK) which constitutes
    an implied trust. If an organization wishes to control and manage encryption keys, however, customer-managed keys (CMK)
    can be supplied. The provided key is used to protect and control access to the key that encrypts the data. You can also
    choose to automatically update the key version used for Azure Database for MySQL encryption whenever a new version is
    available in the associated Key Vault. NOTE: This is primarily recommended where control of encryption keys is specified
    by compliance or security framework requirements. In many circumstances, Microsoft Managed Key encryption is an acceptable
    method of accomplishing encryption at rest.'
  impact: If the key expires by setting the 'activation date' and 'expiration date', the user must rotate the key manually.
