- id: 5.2.1
  title: Ensure that Activity Log Alert exists for Create Policy Assignment
  scoring: scored
  profile:
  - Level 1
  description: Create an activity log alert for the Create Policy Assignment event.
  rationale: Monitoring for create policy assignment events gives insight into changes done in "azure policy - assignments"
    and can reduce the time it takes to detect unsolicited changes.
  impact: ''
  references:
  - 1. https://azure.microsoft.com/en-us/updates/classic-alerting-monitoring-retirement
  - 2. https://docs.microsoft.com/en-in/azure/azure-monitor/platform/alerts-activitylog
  page_start: 199
  audit_raw: "From Azure Console\n1. Navigate to Monitor' and then 'Alerts\n2. Select Manage alert rules\n3. Click on the\
    \ Alert Name where Condition contains operationName equals\nMicrosoft.Security/policyAssignments/write\n4. Hover a mouse\
    \ over Condition to ensure it is set to Whenever the Administrative\nActivity Log \"Create policy assignment (policyAssignments)\"\
    \ has \"any\"\nlevel with \"any\" status and event is initiated by \"any\"\nUsing Azure Command Line Interface\naz account\
    \ get-access-token --query\n\"{subscription:subscription,accessToken:accessToken}\" --out tsv | xargs -L1\nbash -c 'curl\
    \ -X GET -H \"Authorization: Bearer $1\" -H \"Content-Type:\napplication/json\"\nhttps://management.azure.com/subscriptions/$0/providers/microsoft.insights/ac\n\
    tivityLogAlerts?api-version=2017-04-01' | jq\n'.|.value[]|{location:.location,scopes:.properties.scopes,\"condition\"\
    :.proper\nties.condition.allOf|.[]|select(.field==\"operationName\" and\n.equals==\"microsoft.authorization/policyassignments/write\"\
    ),enabled:.properti\nes.enabled}'\nEnsure that an alert exists where:\n• location is set to Global\n• Scopes is set to\
    \ entire subscription that is /subscriptions/<Subscription_ID>\n• Enabled set to True\n• Condition Matches:\n199 | P a\
    \ g e\n {\n \"location\": \"Global\",\n \"scopes\": [\n \"/subscriptions/<Subscription_ID>\"\n ],\n \"condition\": {\n\
    \ \"field\": \"operationName\",\n \"equals\": \"microsoft.authorization/policyassignments/write\",\n \"containsAny\":\
    \ null\n },\n \"enabled\": true\n}"
  remediation: "From Azure Console\n1. Go to Monitor\n2. Select Alerts\n3. Click On New Alert Rule\n4. Under Scope, click\
    \ Select resource\n5. Select the appropriate subscription under Filter by subscription\n6. Select Policy Assignment under\
    \ Filter by resource type\n7. Select All for Filter by location\n8. Click on the subscription resource from the entries\
    \ populated under Resource\n9. Verify Selection preview shows All Policy assignment (policyAssignments) and your\nselected\
    \ subscription name\n10. Click Done\n11. Under Condition click Add Condition\n12. Select Create policy assignment signal\n\
    13. Click Done\n14. Under Action group, select Add action groups and complete creation process or\nselect appropriate\
    \ action group\n15. Under Alert rule details, enter Alert rule name and Description\n16. Select appropriate resource group\
    \ to save the alert to\n17. Check Enable alert rule upon creation checkbox\n18. Click Create alert rule\nUsing Azure Command\
    \ Line Interface\nUse the below command to create an Activity Log Alert for Create policy assignment\naz account get-access-token\
    \ --query\n\"{subscription:subscription,accessToken:accessToken}\" --out tsv | xargs -L1\nbash -c 'curl -X PUT -H \"Authorization:\
    \ Bearer $1\" -H \"Content-Type:\napplication/json\"\nhttps://management.azure.com/subscriptions/$0/resourceGroups/<Resource_Group_\n\
    To\nCreate_Alert_In>/providers/microsoft.insights/activityLogAlerts/<Unique_Alert\n_Name>?api-version=2017-04-01 -d@\"\
    input.json\"'\n200 | P a g e\nWhere input.json contains the Request body JSON data as mentioned below.\n{\n \"location\"\
    : \"Global\",\n \"tags\": {},\n \"properties\": {\n \"scopes\": [\n \"/subscriptions/<Subscription_ID>\"\n ],\n \"enabled\"\
    : true,\n \"condition\": {\n \"allOf\": [\n {\n \"containsAny\": null,\n \"equals\": \"Administrative\",\n \"field\":\
    \ \"category\"\n },\n {\n \"containsAny\": null,\n \"equals\": \"Microsoft.Authorization/policyAssignments/write\",\n\
    \ \"field\": \"operationName\"\n }\n ]\n },\n \"actions\": {\n \"actionGroups\": [\n {\n \"actionGroupId\":\n\"/subscriptions/<Subscription_ID>/resourceGroups/<Resource_Group_For_Alert_Gr\n\
    oup>/providers/microsoft.insights/actionGroups/<Alert_Group>\",\n \"webhookProperties\": null\n }\n ]\n },\n }\n}\nConfigurable\
    \ Parameters for command line:\n<Resource_Group_To Create_Alert_In>\n<Unique_Alert_Name>\nConfigurable Parameters for\
    \ input.json:\n<Subscription_ID> in scopes\n<Subscription_ID> in actionGroupId\n<Resource_Group_For_Alert_Group> in actionGroupId\n\
    <Alert_Group> in actionGroupId"
  checks:
  - type: manual_review
    info: 'From Azure Console

      1. Navigate to Monitor'' and then ''Alerts

      2. Select Manage alert rules

      3. Click on the Alert Name where Condition contains operationName equals

      Microsoft.Security/policyAssignments/write

      4. Hover a mouse over Condition to ensure it is set to Whenever the Administrative

      Activity Log "Create policy assignment (policyAssignments)" has "any"

      level with "any" status and event is initiated by "any"

      Using Azure Command Line Interface

      az account get-access-token --query

      "{subscription:'
    severity: medium
