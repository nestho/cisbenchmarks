- id: '9.10'
  title: Ensure FTP deployments are disabled
  scoring: scored
  profile:
  - Level 1
  description: By default, Azure Functions, Web and API Services can be deployed over FTP. If FTP is required for an essential
    deployment workflow, FTPS should be required for FTP login for all App Service Apps and Functions.
  rationale: Azure FTP deployment endpoints are public. An attacker listening to traffic on a wifi network used by a remote
    employee or a corporate network could see login traffic in cleartext which would then grant them full control of the code
    base of the app or service. This finding is more severe if User Credentials for deployment are set at the subscription
    level rather than using the default Application Credentials which are unique per App.
  impact: Any deployment workflows that rely on FTP or FTPs rather than the WebDeploy or HTTPs endpoints may be affected.
  references:
  - 1. [Azure Web Service Deploy via FTP](https://docs.microsoft.com/en-us/azure/appservice/deploy-ftp)
  - 2. [Azure Web Service Deployment](https://docs.microsoft.com/en-us/azure/appservice/overview-security)
  page_start: 304
  audit_raw: "From Azure Console 2.0 For Web Apps\n1. Go to the Azure Portal\n2. Select App Services\n3. Click on an App\n\
    4. Select Settings > Configuration\n5. Select General Settings\n6. Under Platform Settings, FTP state should not be All\
    \ allowed\nFrom Azure Console 2.0 For Function Apps\n1. Go to the Azure Portal\n2. Select App Services\n3. Click on an\
    \ App Function\n4. Select Platform Features\n5. Select Configuration\n6. Select General Settings\n304 | P a g e\n7. Under\
    \ Platform Settings, FTP state should not be All allowed\nUsing Azure CLI 2.0\nList webapps to obtain the ids.\naz webapp\
    \ list\nList the publish profiles to obtain the username, password\nand ftp server url.\naz webapp deployment list-publishing-profiles\
    \ --ids <ids>\n{\n \"publishUrl\": \"ftp://waws-prod-dm1129.ftp.azurewebsites.windows.net/site/wwwroot\",\n \"userName\"\
    : \"engineer-webapp-test\\\\$engineer-webapp-test\",\n \"userPWD\": \"dHwjxxxxxxxxxxxxxxxxxxxxxxxxxxisdk6xMgeswoqg\",\n\
    }\nThe correct username to user for FTP would be\nengineer-webapp-test in the output above."
  remediation: 'From Azure Console

    1. Go to the Azure Portal

    2. Select App Services

    3. Click on an App

    4. Select Settings > Configuration

    5. Under Platform Settings, FTP state should be Disabled

    or FTPS Only'
  checks:
  - type: manual_review
    info: 'From Azure Console 2.0 For Web Apps

      1. Go to the Azure Portal

      2. Select App Services

      3. Click on an App

      4. Select Settings > Configuration

      5. Select General Settings

      6. Under Platform Settings, FTP state should not be All allowed

      From Azure Console 2.0 For Function Apps

      1. Go to the Azure Portal

      2. Select App Services

      3. Click on an App Function

      4. Select Platform Features

      5. Select Configuration

      6. Select General Settings

      304 | P a g e

      7. Under Platform Settings, FTP state should not be All all'
    severity: medium
- id: '9.11'
  title: Ensure Azure Keyvaults are used to store secrets
  scoring: manual
  profile:
  - Level 2
  description: Encryption keys ,Certificate thumbprints and Managed Identity Credentials can be coded into the APP service,
    this renders them visible as part of the configuration, to maintain security of these keys it is better to store in an
    Azure Keyvault and reference them from the Keyvault.
  rationale: App secrets control access to the application and thus need to be secured externally to the app configuration,
    storing the secrets externally and referencing them in the configuration also enables key rotation without having to redeploy
    the app service.
  impact: Impact is primarily during the initial setup of the application or redeploying an old app to include this functionality.
    This will require configuration effort to setup the keyvault and then to configure the app service to use the keyvault.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/app-service/app-service-key-vaultreferences
  - 2. https://docs.microsoft.com/en-us/azure/security/benchmarks/security-controlsv2-identity-management#im-2-manage-application-identities-securely-andautomatically
  page_start: 307
  audit_raw: 'From Azure Console

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to Key Vaults

    3. Ensure that key vault exists and keys are listed'
  remediation: "Remediation has 2 steps\n1. Setup the keyvault\n2. setup the app service to use the keyvault\nSet up the keyvault\n\
    Using Azure CLI\n307 | P a g e\n`az keyvault create --name \"myKV\" --resource-group \"myResourceGroup\" --location\n\
    myLocation\nUsing Azure Powershell\n`New-AzKeyvault -name MyKV -ResourceGroupName myResourceGroup -Location\nmyLocation\n\
    Set up the App Service to use the keyvault\nSample JSON Template for App Service Configuration\n{\n //...\n \"resources\"\
    : [\n {\n \"type\": \"Microsoft.Storage/storageAccounts\",\n \"name\": \"[variables('storageAccountName')]\",\n //...\n\
    \ },\n {\n \"type\": \"Microsoft.Insights/components\",\n \"name\": \"[variables('appInsightsName')]\",\n //...\n },\n\
    \ {\n \"type\": \"Microsoft.Web/sites\",\n \"name\": \"[variables('functionAppName')]\",\n \"identity\": {\n \"type\"\
    : \"SystemAssigned\"\n },\n //...\n \"resources\": [\n {\n \"type\": \"config\",\n \"name\": \"appsettings\",\n //...\n\
    \ \"dependsOn\": [\n \"[resourceId('Microsoft.Web/sites',\nvariables('functionAppName'))]\",\n \"[resourceId('Microsoft.KeyVault/vaults/',\n\
    variables('keyVaultName'))]\",\n \"[resourceId('Microsoft.KeyVault/vaults/secrets',\nvariables('keyVaultName'), variables('storageConnectionStringName'))]\"\
    ,\n \"[resourceId('Microsoft.KeyVault/vaults/secrets',\nvariables('keyVaultName'), variables('appInsightsKeyName'))]\"\
    \n ],\n \"properties\": {\n \"AzureWebJobsStorage\":\n\"[concat('@Microsoft.KeyVault(SecretUri=',\nreference(variables('storageConnectionStringResourceId')).secretUriWithVersio\n\
    n, ')')]\",\n \"WEBSITE_CONTENTAZUREFILECONNECTIONSTRING\":\n\"[concat('@Microsoft.KeyVault(SecretUri=',\n308 | P a g\
    \ e\nreference(variables('storageConnectionStringResourceId')).secretUriWithVersio\nn, ')')]\",\n \"APPINSIGHTS_INSTRUMENTATIONKEY\"\
    :\n\"[concat('@Microsoft.KeyVault(SecretUri=',\nreference(variables('appInsightsKeyResourceId')).secretUriWithVersion,\n\
    ')')]\",\n \"WEBSITE_ENABLE_SYNC_UPDATE_SITE\": \"true\"\n //...\n }\n },\n {\n \"type\": \"sourcecontrols\",\n \"name\"\
    : \"web\",\n //...\n \"dependsOn\": [\n \"[resourceId('Microsoft.Web/sites',\nvariables('functionAppName'))]\",\n \"[resourceId('Microsoft.Web/sites/config',\n\
    variables('functionAppName'), 'appsettings')]\"\n ],\n }\n ]\n },\n {\n \"type\": \"Microsoft.KeyVault/vaults\",\n \"\
    name\": \"[variables('keyVaultName')]\",\n //...\n \"dependsOn\": [\n \"[resourceId('Microsoft.Web/sites',\nvariables('functionAppName'))]\"\
    \n ],\n \"properties\": {\n //...\n \"accessPolicies\": [\n {\n \"tenantId\":\n\"[reference(concat('Microsoft.Web/sites/',\
    \ variables('functionAppName'),\n'/providers/Microsoft.ManagedIdentity/Identities/default'), '2015-08-31PREVIEW').tenantId]\"\
    ,\n \"objectId\":\n\"[reference(concat('Microsoft.Web/sites/', variables('functionAppName'),\n'/providers/Microsoft.ManagedIdentity/Identities/default'),\
    \ '2015-08-31PREVIEW').principalId]\",\n \"permissions\": {\n \"secrets\": [ \"get\" ]\n }\n }\n ]\n },\n \"resources\"\
    : [\n {\n \"type\": \"secrets\",\n \"name\": \"[variables('storageConnectionStringName')]\",\n //...\n \"dependsOn\":\
    \ [\n \"[resourceId('Microsoft.KeyVault/vaults/',\nvariables('keyVaultName'))]\",\n309 | P a g e\n \"[resourceId('Microsoft.Storage/storageAccounts',\n\
    variables('storageAccountName'))]\"\n ],\n \"properties\": {\n \"value\":\n\"[concat('DefaultEndpointsProtocol=https;AccountName=',\n\
    variables('storageAccountName'), ';AccountKey=',\nlistKeys(variables('storageAccountResourceId'),'2015-05-01-preview').key1)]\"\
    \n }\n },\n {\n \"type\": \"secrets\",\n \"name\": \"[variables('appInsightsKeyName')]\",\n //...\n \"dependsOn\": [\n\
    \ \"[resourceId('Microsoft.KeyVault/vaults/',\nvariables('keyVaultName'))]\",\n \"[resourceId('Microsoft.Insights/components',\n\
    variables('appInsightsName'))]\"\n ],\n \"properties\": {\n \"value\":\n\"[reference(resourceId('microsoft.insights/components/',\n\
    variables('appInsightsName')), '2015-05-01').InstrumentationKey]\"\n }\n }\n ]\n }\n ]\n}"
  checks:
  - type: manual_review
    info: 'From Azure Console

      1. Login to Azure Portal using https://portal.azure.com

      2. Go to Key Vaults

      3. Ensure that key vault exists and keys are listed'
    severity: medium
