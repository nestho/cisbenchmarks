  title: Ensure default network access rule for Storage Accounts is set to deny
  scoring: scored
  profile:
  - Level 2
  description: Restricting default network access helps to provide a new layer of security, since storage accounts accept
    connections from clients on any network. To limit access to selected networks, the default action must be changed.
  rationale: Storage accounts should be configured to deny access to traffic from all networks (including internet traffic).
    Access can be granted to traffic from specific Azure Virtual networks, allowing a secure network boundary for specific
    applications to be built. Access can also be granted to public internet IP address ranges, to enable connections from
    specific internet or on-premises clients. When network rules are configured, only applications from allowed networks can
    access a storage account. When calling from an allowed network, applications continue to require proper authorization
    (a valid access key or SAS token) to access the storage account.
  impact: ''
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/storage-networksecurity
  - 2. https://docs.microsoft.com/en-us/azure/security/benchmarks/security-controlsv2-governance-strategy#gs-2-define-enterprise-segmentation-strategy
  page_start: 123
  audit_raw: "From Azure Console\n1. Go to Storage Accounts\n2. For each storage account, Click on the settings menu called\
    \ Firewalls and\nvirtual networks.\n3. Ensure that Allow access from All networks is not selected.\nUsing Azure Command\
    \ Line Interface 2.0\nEnsure defaultAction is not set to Allow.\n az storage account list --query '[*].networkRuleSet'"
  remediation: "From Azure Console\n1. Go to Storage Accounts\n123 | P a g e\n2. For each storage account, Click on the settings\
    \ menu called Firewalls and virtual\nnetworks.\n3. Ensure that you have elected to allow access from Selected networks.\n\
    4. Add rules to allow traffic from specific network.\n5. Click Save to apply your changes.\nUsing Azure Command Line Interface\
    \ 2.0\nUse the below command to update default-action to Deny.\n az storage account update --name <StorageAccountName>\
    \ --resource-group\n<resourceGroupName> --default-action Deny"
