    encryption will be applied to the account.

    If you select customer managed key it will ask for the location of the key (The default is an

    Azure Keyvault) and the key name.

    Once these are captured, save the configuration and the account will be encrypted using the

    provided key.

    Using Azure Command Line Interface:

    Create the Keyvault

    az keyvault create --name "myKV" --resource-group "myResourceGroup" --

    location eastus --enabled-for-disk-encryption

    Encrypt the disk and store the key in keyvault

    az vm encryption enable -g MyResourceGroup --name MyVM --disk-encryptionkeyvault myKV

    Using Azure Powershell

    This process uses a keyvault to store the keys

