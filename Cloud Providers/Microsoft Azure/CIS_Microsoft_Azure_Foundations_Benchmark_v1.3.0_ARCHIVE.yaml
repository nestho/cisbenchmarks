  title: Ensure 'Trusted Microsoft Services' is enabled for Storage Account access
  scoring: manual
  profile:
  - Level 2
  description: 'Some Microsoft services that interact with storage accounts operate from networks that can''t be granted access
    through network rules. To help this type of service work as intended, allow the set of trusted Microsoft services to bypass
    the network rules. These services will then use strong authentication to access the storage account. If the Allow trusted
    Microsoft services exception is enabled, the following services: Azure Backup, Azure Site Recovery, Azure DevTest Labs,
    Azure Event Grid, Azure Event Hubs, Azure Networking, Azure Monitor and Azure SQL Data Warehouse (when registered in the
    subscription), are granted access to the storage account.'
  rationale: Turning on firewall rules for storage account will block access to incoming requests for data, including from
    other Azure services. This includes using the Portal, writing logs, etc. We can re-enable functionality. The customer
    can get access to services like Monitor, Networking, Hubs, and Event Grid by enabling "Trusted Microsoft Services" through
    exceptions. Also, Backup and Restore of Virtual Machines using unmanaged disks in storage accounts with network rules
    applied is supported via creating an exception.
