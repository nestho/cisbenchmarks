- id: '6.2'
  title: Ensure that SSH access is restricted from the internet
  scoring: scored
  profile:
  - Level 1
  description: Disable SSH access on network security groups from the Internet. Ensure that no SQL Databases allow ingress
    from 0.0.0.0/0 (ANY IP).
  rationale: The potential security problem with using SSH over the Internet is that attackers can use various brute force
    techniques to gain access to Azure Virtual Machines. Once the attackers gain access, they can use a virtual machine as
    a launch point for compromising other machines on the Azure Virtual Network or even attack networked devices outside of
    Azure. SQL Server includes a firewall to block access to unauthorized connections. More granular IP addresses can be defined
    by referencing the range of addresses available from specific datacenters. By default, for a SQL server, a Firewall exists
    with StartIp of 0.0.0.0 and EndIP of 0.0.0.0 allowing access to all the Azure services. Additionally, a custom rule can
    be set up with StartIp of 0.0.0.0 and EndIP of 255.255.255.255 allowing access from ANY IP over the Internet. In order
    to reduce the potential attack surface for a SQL server, firewall rules should be defined with more granular IP addresses
    by referencing the range of addresses available from specific datacenters.
  impact: server and Hosted Databases unless custom IP specific rules are not added in Firewall Policy.
  references:
