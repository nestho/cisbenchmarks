    Set-AzVMDiskEncryptionExtension -ResourceGroupName MyResourceGroup -VMName

    MyVM -DiskEncryptionKeyVaultUrl $KeyVault.VaultUri -DiskEncryptionKeyVaultId

    $KeyVault.ResourceId'
