- id: '9.1'
  title: Ensure App Service Authentication is set on Azure App Service
  scoring: scored
  profile:
  - Level 2
  description: Azure App Service Authentication is a feature that can prevent anonymous HTTP requests from reaching the API
    app, or authenticate those that have tokens before they reach the API app. If an anonymous request is received from a
    browser, App Service will redirect to a logon page. To handle the logon process, a choice from a set of identity providers
    can be made, or a custom authentication mechanism can be implemented.
  rationale: By Enabling App Service Authentication, every incoming HTTP request passes through it before being handled by
    the application code. It also handles authentication of users with the specified provider(Azure Active Directory, Facebook,
    Google, Microsoft Account, and Twitter), validation, storing and refreshing of tokens, managing the authenticated sessions
    and injecting identity information into request headers.
  impact: This is only required for App Services which require authentication. Enabling on site like a marketing or support
    website will prevent unauthenticated access which would be undesirable. Adding Authentication requirement will increase
    cost of App Service and require additional security components to facilitate the authentication.
