    2. Set Use your own key to YES

    3. Browse through your key vaults to Select an existing key or create a new key in

    Key Vault.

    4. Check Make selected key the default TDE protector

    182 | P a g e

    Using Azure CLI:

    Use the below command to encrypt SQL server''s TDE protector with a Customer-managed

    key

    az sql server tde-key >> Set --resource-group <resourceName> --server

    <dbServerName> --server-key-type {AzureKeyVault} [--kid <keyIdentifier>]```'
