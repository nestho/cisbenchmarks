- id: '1.9'
  title: Ensure that 'Users can consent to apps accessing company data on their behalf' is set to 'No'
  scoring: manual
  profile:
  - Level 2
  description: Require administrators to provide consent for the apps before use.
  rationale: Unless Azure Active Directory is running as an identity provider for third-party applications, do not allow users
    to use their identity outside of the cloud environment. User profiles contain private information such as phone numbers
    and email addresses which could then be sold off to other third parties without requiring any further consent from the
    user.
  impact: It might be an additional request that administrators need to fulfill quite often.
  references:
  - 1. https://blogs.msdn.microsoft.com/exchangedev/2014/06/05/managing-userconsent-for-applications-using-office-365-apis/
