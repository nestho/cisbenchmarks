    NOTE: Most modern browsers support HTTP 2.0 protocol over TLS only, while nonencrypted traffic continues to use HTTP 1.1.
    To ensure that client browsers connect to your

    app with HTTP/2, either buy an App Service Certificate for your app''s custom domain or

    bind a third party certificate.

    Using Azure Command Line Interface

    To set HTTP 2.0 version for an existing app, run the following command:

    az webapp config set --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME>

    --http20-enabled true'
