- id: '5.3'
  title: Configuring Application Insights 5.3.1 Ensure Application Insights are Configured
  scoring: scored
  profile:
  - Level 2
  description: Application Insights within Azure act as an Application Performance Monitoring solution providing valuable
    data into how well an application performs and additional information when performing incident response. The types of
    log data collected include application metrics, telemetry data, and application trace logging data providing organizations
    with detailed information about application activity and application transactions. Both data sets help organizations adopt
    a proactive and retroactive means to handle security and performance related metrics within their modern applications.
  rationale: Configuring Application Insights provides additional data not found elsewhere within Azure as part of a much
    larger logging and monitoring program within an organization's Information Security practice. The types and contents of
    these logs will act as both a potential cost saving measure (application performance) and a means to potentially confirm
    the source of a potential incident (trace logging). Metrics and Telemetry data provide organizations with a proactive
    approach to cost savings by monitoring an application's performance, while the trace logging data provides necessary details
    in a reactive incident response scenario by helping organizations identify the potential source of an incident within
    their application.
  impact: Because Application Insights relies on a Log Analytics Workspace, an organization will incur additional expenses
    when using this service.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/azure-monitor/app/app-insights-overview
  page_start: 358
  audit_raw: 'From Azure Portal

    1. Navigate to Application Insights

    2. Ensure an Application Insights service is configured and exists.

    From Azure CLI

    Note: The application-insights extension to Azure CLI is currently in Preview

    Add the application-insights extension.

    az extension add --name application-insights

    az monitor app-insights component show --query "[].{ID:appId, Name:name,

    Tenant:tenantId, Location:location, Provisioning_State:provisioningState}"

    Ensure the above command produces output, otherwise Application Insights has not

    been configured.

    From PowerShell

    Get-AzApplicationInsights|select

    location,name,appid,provisioningState,tenantid

    From Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: fa9cd53d-cb8f-464e-84f1-7b1490fd21c6 - Name: ''Deploy Diagnostic

    Settings for Application Insights to Log Analytics workspace'''
  remediation: 'From Azure Portal

    1. Navigate to Application Insights

    2. Under the Basics tab within the PROJECT DETAILS section, select the

    Subscription

    3. Select the Resource group

    4. Within the INSTANCE DETAILS, enter a Name

    5. Select a Region

    6. Next to Resource Mode, select Workspace-based

    7. Within the WORKSPACE DETAILS, select the Subscription for the log analytics

    workspace

    8. Select the appropriate Log Analytics Workspace

    9. Click Next:Tags >

    10. Enter the appropriate Tags as Name, Value pairs.

    11. Click Next:Review+Create

    12. Click Create

