    \ PowerShell\nConnect-AzAccount\nSet-AzContext -Subscription <subscription ID>\nGet-AzStorageAccountNetworkRuleset -ResourceGroupName\
    \ <resource group> -Name\n<storage account name> |Select-Object DefaultAction\nPowerShell Result - Non-Compliant\nDefaultAction\
    \ : Allow\nPowerShell Result - Compliant\nDefaultAction : Deny\nFrom Azure Policy\nIf referencing a digital copy of this\
    \ Benchmark, clicking a Policy ID will open a link to the\nassociated Policy definition in Azure.\nIf referencing a printed\
    \ copy, you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: 34c877ad-507e-4c82-993e-3452a6e0ad3c - Name: 'Storage accounts\nshould restrict network access'\n• Policy\
