- id: 5.1.2
  title: Ensure Diagnostic Setting captures appropriate categories
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: 'Prerequisite: A Diagnostic Setting must exist. If a Diagnostic Setting does not exist, the navigation and
    options within this recommendation will not be available. Please review the recommendation at the beginning of this subsection
    titled: "Ensure that a ''Diagnostic Setting'' exists." The diagnostic setting should be configured to log the appropriate
    activities from the control/management plane. Storage accounts with the activity log exports can be configured to use
    Customer Managed Keys (CMK).'
  rationale: A diagnostic setting controls how the diagnostic log is exported. Capturing the diagnostic setting categories
    for appropriate control/management plane activities allows proper alerting. Configuring the storage account with the activity
    log export container to use CMKs provides additional confidentiality controls on log data, as a given user must have read
    permission on the corresponding storage account and must be granted decrypt permission by the CMK.
  impact: 'NOTE: You must have your key vault setup to utilize this. All Audit Logs will be encrypted with a key you provide.
    You will need to set up customer managed keys separately, and you will select which key to use via the instructions here.
    You will be responsible for the lifecycle of the keys, and will need to manually replace them at your own determined intervals
    to keep the data secure.'
