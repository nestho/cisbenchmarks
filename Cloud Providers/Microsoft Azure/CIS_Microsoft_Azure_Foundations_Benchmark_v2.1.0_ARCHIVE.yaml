      az keyvault private-endpoint-c'
- id: '8.8'
  title: Ensure Automatic Key Rotation is Enabled Within Azure Key Vault for the Supported Services
  scoring: manual
  profile:
  - Level 2
  description: Automatic Key Rotation is available in Public Preview. The currently supported applications are Key Vault,
    Managed Disks, and Storage accounts accessing keys within Key Vault. The number of supported applications will incrementally
    increased.
  rationale: Once set up, Automatic Private Key Rotation removes the need for manual administration when keys expire at intervals
    determined by your organization's policy. The recommended key lifetime is 2 years. Your organization should determine
    its own key expiration policy.
  impact: There are an additional costs per operation in running the needed applications.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/key-vault/keys/how-to-configure-keyrotation
  - 2. https://docs.microsoft.com/en-us/azure/storage/common/customer-managedkeys-overview#update-the-key-version
  page_start: 441
  audit_raw: 'From Azure Portal

    1. From Azure Portal select the Portal Menu in the top left.

    2. Select Key Vaults.

    3. Select a Key Vault to audit.

    4. Under Objects select Keys.

    5. Select a key to audit.

    6. In the top row select Rotation policy.

    7. Ensure Enable auto rotation is set to Enabled.

    8. Repeat steps 3-7 for each Key Vault and Key.

    From Azure CLI

    Run the following command:

    az keyvault key rotation-policy show --vaultname <vaultName> --name <keyName>

    From PowerShell

    Run the following command:

    Get-AzKeyVaultKeyRotationPolicy -VaultName <vaultName> -Name <keyName>

    From Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: d8cf8476-a2ec-4916-896e-992351803c44 - Name: ''Keys should have

    a rotation policy ensuring that their rotation is scheduled within the specified

    number of days after creation.'''
  remediation: "Note:\nAzure CLI and Powershell use ISO8601 flags to input timespans. Every timespan input\nwill be in the\
    \ format P<timespanInISO8601Format>(Y,M,D). The leading P is required\nwith it denoting period. The (Y,M,D) are for the\
    \ duration of Year, Month,and Day\nrespectively. A time frame of 2 years, 2 months, 2 days would be (P2Y2M2D).\nFrom Azure\
    \ Portal\n1. From Azure Portal select the Portal Menu in the top left.\n2. Select Key Vaults.\n3. Select a Key Vault to\
    \ audit.\n4. Under Objects select Keys.\n5. Select a key to audit.\n6. In the top row select Rotation policy.\n7. Select\
    \ an Expiry time.\n8. Set Enable auto rotation to Enabled.\n9. Set an appropriate Rotation option and Rotation time.\n\
    10. Optionally set the Notification time.\n11. Select Save.\n12. Repeat steps 3-11 for each Key Vault and Key.\nFrom Azure\
    \ CLI\nRun the following command for each key to update its policy to be auto-rotated:\naz keyvault key rotation-policy\
    \ update -n <keyName> --vault-name <vaultName>\n--value <path/to/policy.json>\nNote: It is easiest to supply the policy\
    \ flags in a .json file. An example\njson file would be:\n{\n \"lifetimeActions\": [\n {\n \"trigger\": {\n \"timeAfterCreate\"\
    : \"<timespanInISO8601Format>\",\n \"timeBeforeExpiry\" : null\n },\n \"action\": {\n \"type\": \"Rotate\"\n }\n },\n\
    \ {\n \"trigger\": {\n \"timeBeforeExpiry\" : \"<timespanInISO8601Format>\"\n },\n \"action\": {\n \"type\": \"Notify\"\
    \n }\n }\n ],\n \"attributes\": {\n \"expiryTime\": \"<timespanInISO8601Format>\"\n }\n}\nFrom PowerShell\nRun the following\
    \ command for each key to update its policy:\nSet-AzKeyVaultKeyRotationPolicy -VaultName test-kv -Name test-key -PolicyPath\n\
    rotation_policy.json\nNote: It is easiest to supply the policy flags in a .json file. An example json file would be:\n\
    <#\nrotation_policy.json\n{\n \"lifetimeActions\": [\n {\n \"trigger\": {\n \"timeAfterCreate\": \"P<timespanInISO8601Format>M\"\
    ,\n \"timeBeforeExpiry\": null\n },\n \"action\": {\n \"type\": \"Rotate\"\n }\n },\n {\n \"trigger\": {\n \"timeBeforeExpiry\"\
    : \"P<timespanInISO8601Format>D\"\n },\n \"action\": {\n \"type\": \"Notify\"\n }\n }\n ],\n \"attributes\": {\n \"expiryTime\"\
    : \"P<timespanInISO8601Format>Y\"\n }\n }\n#>"
  checks:
  - type: manual_review
    info: 'From Azure Portal

      1. From Azure Portal select the Portal Menu in the top left.

      2. Select Key Vaults.

      3. Select a Key Vault to audit.

      4. Under Objects select Keys.

      5. Select a key to audit.

      6. In the top row select Rotation policy.

      7. Ensure Enable auto rotation is set to Enabled.

      8. Repeat steps 3-7 for each Key Vault and Key.

      From Azure CLI

      Run the following command:

      az keyvault key rotation-policy show --vaultname <vaultName> --name <keyName>

      From PowerShell

      Run the following command:

      Get-AzKe'
    severity: medium
- id: '9.1'
  title: Ensure App Service Authentication is set up for apps in Azure App Service
  scoring: scored
  profile:
  - Level 2
  description: Azure App Service Authentication is a feature that can prevent anonymous HTTP requests from reaching a Web
    Application or authenticate those with tokens before they reach the app. If an anonymous request is received from a browser,
    App Service will redirect to a logon page. To handle the logon process, a choice from a set of identity providers can
    be made, or a custom authentication mechanism can be implemented.
  rationale: By Enabling App Service Authentication, every incoming HTTP request passes through it before being handled by
    the application code. It also handles authentication of users with the specified provider (Entra ID, Facebook, Google,
    Microsoft Account, and Twitter), validation, storing and refreshing of tokens, managing the authenticated sessions and
    injecting identity information into request headers. Disabling HTTP Basic Authentication functionality further ensures
    legacy authentication methods are disabled within the application.
  impact: This is only required for App Services which require authentication. Enabling on site like a marketing or support
    website will prevent unauthenticated access which would be undesirable. Adding Authentication requirement will increase
    cost of App Service and require additional security components to facilitate the authentication.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/app-service/app-service-authenticationoverview
  - 2. https://docs.microsoft.com/en-us/azure/role-based-access-control/built-inroles#website-contributor
  page_start: 447
  audit_raw: 'From Azure Portal

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. Click on each App

    4. Under Settings section, Click on Authentication

    5. Ensure that App Service authentication set to Enabled (Will only appear once

    an Identity provider is set up/selected)

    6. Navigate back to the application blade

    7. Under Settings, click on Configuration

    8. Click on the ''General Settings'' tab

    9. Under Platform settings, ensure Basic Auth Publishing Credentials is set to

    Off

    From Azure CLI

    To check App Service Authentication status for an existing app, run the following

    command (using authV1 extension),

    az webapp auth show --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME>

    The output should return true if App Service authentication is set to On.

    If using the authV2 extension for the az webapp auth CLI, run the following command,

    az webapp auth show --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME>

    Ensure that the enabled setting under azureActiveDirectory is set to true.

    To check whether the Basic Auth Publishing Credentials are disabled, issue the

    following commands,

    az resource show --resource-group <RESOURCE GROUP NAME> --name scm --

    namespace Microsoft.Web --resource-type basicPublishingCredentialsPolicies --

    parent sites/<APPLICATION NAME>

    az resource show --resource-group <RESOURCE GROUP NAME> --name ftp --

    namespace Microsoft.Web --resource-type basicPublishingCredentialsPolicies --

    parent sites/<APPLICATION NAME>

    Ensure allow is set to false under properties within the output of each of the above

    commands.

    From Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: c75248c1-ea1d-4a9c-8fc9-29a6aabd5da8 - Name: ''Function apps

    should have authentication enabled''

    • Policy ID: 95bccee9-a7f8-4bec-9ee9-62c3473701fc - Name: ''App Service apps

    should have authentication enabled'''
  remediation: 'From Azure Portal

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. Click on each App

    4. Under Setting section, click on Authentication

    5. If no identity providers are set up, then click Add identity provider

    6. Choose other parameters as per your requirements and click on Add

    To disable the Basic Auth Publishing Credentials setting, perform the following

    steps:

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. Click on each App

    4. Under Settings, click on Configuration

    5. Click on the ''General Settings'' tab

    6. Under Platform settings, ensure Basic Auth Publishing Credentials is set to

    Off

    From Azure CLI

    To set App Service Authentication for an existing app, run the following command:

    az webapp auth update --resource-group <RESOURCE_GROUP_NAME> --name

    <APP_NAME> --enabled true

    Note

    In order to access App Service authentication settings for Web app using Microsoft

    API requires Website contributor permission at subscription level. A custom role can

    be created in place of Website contributor to provide more specific permission and

    maintain the principle of least privileged access.'
  checks:
  - type: manual_review
    info: 'From Azure Portal

