- id: 5.2.1
  title: Ensure that Activity Log Alert exists for Create Policy Assignment
  scoring: scored
  profile:
  - Level 1
  description: Create an activity log alert for the Create Policy Assignment event.
  rationale: Monitoring for create policy assignment events gives insight into changes done in "Azure policy - assignments"
    and can reduce the time it takes to detect unsolicited changes.
  impact: ''
  references:
  - 1. https://azure.microsoft.com/en-us/updates/classic-alerting-monitoring-retirement
  - 2. https://docs.microsoft.com/en-in/azure/azure-monitor/platform/alerts-activity-log
  page_start: 323
  audit_raw: 'From Azure Portal

    1. Navigate to the Monitor blade.

    2. Click on Alerts.

    3. In the Alerts window, click on Alert rules.

    4. Ensure an alert rule exists where the Condition column contains Operation

    name=Microsoft.Authorization/policyAssignments/write.

    5. Click on the Alert Name associated with the previous step.

    6. Ensure the Condition panel displays the text Whenever the Activity Log has

    an event with Category=''Administrative'', Operation name=''Create policy

    assignment'' and does not filter on Level, Status or Caller.

    7. Ensure the Actions panel displays an Action group is assigned to notify the

    appropriate personnel in your organization.

    From Azure CLI

    az monitor activity-log alert list --subscription <subscription ID> --query

    "[].{Name:name,Enabled:enabled,Condition:condition.allOf,Actions:actions}"

    Look for Microsoft.Authorization/policyAssignments/write in the output. If it''s

    missing, generate a finding.

    From PowerShell

    Get-AzActivityLogAlert -SubscriptionId <subscription ID>|where-object

    {$_.ConditionAllOf.Equal -match

    "Microsoft.Authorization/policyAssignments/write"}|select-object

    Location,Name,Enabled,ResourceGroupName,ConditionAllOf

    If the output is empty, an alert rule for Create Policy Assignments is not configured.

    From Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: c5447c04-a4d7-4ba8-a263-c9ee321a6858 - Name: ''An activity log

    alert should exist for specific Policy operations'''
  remediation: 'From Azure Portal

    1. Navigate to the Monitor blade.

    2. Select Alerts.

    3. Select Create.

    4. Select Alert rule.

    5. Choose a subscription.

    6. Select Apply.

    7. Select the Condition tab.

    8. Click See all signals.

    9. Select Create policy assignment (Policy assignment).

    10. Click Apply.

    11. Select the Actions tab.

    12. Click Select action groups to select an existing action group, or Create action

    group to create a new action group.

    13. Follow the prompts to choose or create an action group.

    14. Select the Details tab.

    15. Select a Resource group, provide an Alert rule name and an optional Alert

    rule description.

    16. Click Review + create.

    17. Click Create.

    From Azure CLI

    az monitor activity-log alert create --resource-group "<resource group name>"

    --condition category=Administrative and

    operationName=Microsoft.Authorization/policyAssignments/write and

    level=<verbose | information | warning | error | critical> --scope

    "/subscriptions/<subscription ID>" --name "<activity log rule name>" --

    subscription <subscription ID> --action-group <action group ID>

    From PowerShell

    Create the conditions object.

    $conditions = @()

    $conditions += New-AzActivityLogAlertAlertRuleAnyOfOrLeafConditionObject -

    Equal Administrative -Field category

    $conditions += New-AzActivityLogAlertAlertRuleAnyOfOrLeafConditionObject -

    Equal Microsoft.Authorization/policyAssignments/write -Field operationName

