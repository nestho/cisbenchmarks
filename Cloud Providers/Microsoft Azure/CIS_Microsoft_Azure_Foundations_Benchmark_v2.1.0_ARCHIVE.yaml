- id: '8.5'
  title: Ensure the Key Vault is Recoverable
  scoring: scored
  profile:
  - Level 1
  description: 'The Key Vault contains object keys, secrets, and certificates. Accidental unavailability of a Key Vault can
    cause immediate data loss or loss of security functions (authentication, validation, verification, non-repudiation, etc.)
    supported by the Key Vault objects. It is recommended the Key Vault be made recoverable by enabling the "Do Not Purge"
    and "Soft Delete" functions. This is in order to prevent loss of encrypted data, including storage accounts, SQL databases,
    and/or dependent services provided by Key Vault objects (Keys, Secrets, Certificates) etc. This may happen in the case
    of accidental deletion by a user or from disruptive activity by a malicious user. WARNING: A current limitation is that
    role assignments disappearing when Key Vault is deleted. All role assignments will need to be recreated after recovery.'
  rationale: 'There could be scenarios where users accidentally run delete/purge commands on Key Vault or an attacker/malicious
    user deliberately does so in order to cause disruption. Deleting or purging a Key Vault leads to immediate data loss,
    as keys encrypting data and secrets/certificates allowing access/services will become non-accessible. There is a Key Vault
    property that plays a role in permanent unavailability of a Key Vault: enablePurgeProtection: Setting this parameter to
    "true" for a Key Vault ensures that even if Key Vault is deleted, Key Vault itself or its objects remain recoverable for
    the next 90 days. Key Vault/objects can either be recovered or purged (permanent deletion) during those 90 days. If no
    action is taken, the key vault and its objects will subsequently be purged. Enabling the enablePurgeProtection parameter
    on Key Vaults ensures that Key Vaults and their objects cannot be deleted/purged permanently.'
  impact: Once purge-protection and soft-delete are enabled for a Key Vault, the action is irreversible.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/key-vault/key-vault-soft-delete-cli
  - 2. https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
  page_start: 430
  audit_raw: 'From Azure Portal

    1. Go to Key Vaults

    2. For each Key Vault

    3. Click Properties

    4. Ensure the "Enable purge protection (enforce a mandatory retention period for

    deleted vaults and vault objects)" is selected for Purge protection option on this

    key vault`

    From Azure CLI

    1. List all Resources of type Key Vaults:

    az resource list --query "[?type==''Microsoft.KeyVault/vaults'']"

    2. For Every Key Vault ID ensure check parameters enablePurgeProtection is set

    to true.

    az resource show --id /subscriptions/xxxxxx-xxxx-xxxx-xxxxxxxxxxxxxxxx/resourceGroups/<resourceGroupName>/providers/Microsoft.KeyVault

    /vaults/<keyVaultName>

    From PowerShell

    Get all Key Vaults.

    Get-AzKeyVault

    For each Key Vault run the following command.

    Get-AzKeyVault -VaultName <Vault Name>

    Examine the results of the above command for the EnablePurgeProtection setting.

    Make sure enablePurgeProtection is set to True.'
  remediation: 'To enable "Do Not Purge" and "Soft Delete" for a Key Vault:

    From Azure Portal

    1. Go to Key Vaults

    2. For each Key Vault

    3. Click Properties

    4. Ensure the status of Purge protection reads Enable purge protection (enforce

    a mandatory retention period for deleted vaults and vault objects).

    Note, once enabled you cannot disable it.

    From Azure CLI

    az resource update --id /subscriptions/xxxxxx-xxxx-xxxx-xxxxxxxxxxxxxxxx/resourceGroups/<resourceGroupName>/providers/Microsoft.KeyVault

    /vaults/<keyVaultName> --set properties.enablePurgeProtection=true

    From PowerShell

    Update-AzKeyVault -VaultName <vaultName -ResourceGroupName <resourceGroupName

    -EnablePurgeProtection'
  checks:
  - type: manual_review
    info: 'From Azure Portal

      1. Go to Key Vaults

      2. For each Key Vault

      3. Click Properties

      4. Ensure the "Enable purge protection (enforce a mandatory retention period for

      deleted vaults and vault objects)" is selected for Purge protection option on this

      key vault`

