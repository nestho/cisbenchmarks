- id: '1.5'
  title: Ensure That 'Number of methods required to reset' is set to '2'
  scoring: manual
  profile:
  - Level 1
  description: Ensures that two alternate forms of identification are provided before allowing a password reset.
  rationale: A Self-service Password Reset (SSPR) through Azure Multi-factor Authentication (MFA) ensures the user's identity
    is confirmed using two separate methods of identification. With multiple methods set, an attacker would have to compromise
    both methods before they could maliciously reset a user's password.
  impact: There may be administrative overhead, as users who lose access to their secondary authentication methods will need
    an administrator with permissions to remove it. There will also need to be organization-wide security policies and training
    to teach administrators to verify the identity of the requesting user so that social engineering can not render this setting
    useless.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/authentication/tutorialenable-sspr
  - 2. https://docs.microsoft.com/en-us/azure/active-directory/authentication/conceptregistration-mfa-sspr-combined
