- id: 5.1.5
  title: Ensure that Network Security Group Flow logs are captured and sent to Log Analytics
  scoring: manual
  profile:
  - Level 2
  description: Ensure that network flow logs are captured and fed into a central log analytics workspace.
  rationale: Network Flow Logs provide valuable insight into the flow of traffic around your network and feed into both Azure
    Monitor and Azure Sentinel (if in use), permitting the generation of visual flow diagrams to aid with analyzing for lateral
    movement, etc.
  impact: The impact of configuring NSG Flow logs is primarily one of cost and configuration. If deployed, it will create
    storage accounts that hold minimal amounts of data on a 5-day lifecycle before feeding to Log Analytics Workspace. This
    will increase the amount of data stored and used by Azure Monitor.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/network-watcher/network-watcher-nsgflow-logging-portal
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-logging-threatdetection#lt-4-enable-network-logging-for-security-investigation
  page_start: 317
