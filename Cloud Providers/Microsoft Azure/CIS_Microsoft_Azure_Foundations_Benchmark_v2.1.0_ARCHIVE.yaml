- id: '3.11'
  title: Ensure Soft Delete is Enabled for Azure Containers and Blob Storage
  scoring: scored
  profile:
  - Level 1
  description: The Azure Storage blobs contain data like ePHI or Financial, which can be secret or personal. Data that is
    erroneously modified or deleted by an application or other storage account user will cause data loss or unavailability.
    It is recommended that both Azure Containers with attached Blob Storage and standalone containers with Blob Storage be
    made recoverable by enabling the soft delete configuration. This is to save and recover data when blobs or blob snapshots
    are deleted.
  rationale: Containers and Blob Storage data can be incorrectly deleted. An attacker/malicious user may do this deliberately
    in order to cause disruption. Deleting an Azure Storage blob causes immediate data loss. Enabling this configuration for
    Azure storage ensures that even if blobs/data were deleted from the storage account, Blobs/data objects are recoverable
    for a particular time which is set in the "Retention policies," ranging from 7 days to 365 days.
  impact: Additional storage costs may be incurred as snapshots are retained.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/blobs/storage-blob-soft-delete
  - 2. https://docs.microsoft.com/en-us/azure/storage/blobs/soft-delete-containeroverview
  page_start: 214
  audit_raw: "From Azure Portal:\n1. From the Azure home page, open the hamburger menu in the top left or click on\nthe arrow\
    \ pointing right with 'More services' underneath.\n2. Select Storage.\n3. Select Storage Accounts.\n4. For each Storage\
    \ Account, navigate to Data protection in the left scroll column.\n5. Ensure that soft delete is checked for both blobs\
    \ and containers. Also check if\nthe retention period is a sufficient length for your organization.\nFrom Azure CLI\n\
    Blob Storage: Ensure that the output of the below command contains enabled status as\ntrue and days is not empty or null\n\
    az storage blob service-properties delete-policy show --account-name\n<StorageAccountName> --account-key <accountkey>\n\
    Azure Containers: Make certain that the --enable-container-delete-retention is 'true'.\naz storage account blob-service-properties\
    \ show\n --account-name <StorageAccountName>\n --account-key <accountkey>\n --resource-group <resource_group>\nFrom Azure\
    \ Policy\nIf referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the\nassociated Policy\
    \ definition in Azure.\nIf referencing a printed copy, you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: ea39f60f-9f00-473c-8604-be5eac4bb088 - Name: 'Configure blob soft\ndelete on a storage account'"
  remediation: "From Azure Portal\n1. From the Azure home page, open the hamburger menu in the top left or click on\nthe arrow\
