  rationale: Global Administrator accounts are sensitive. Any password reset activity notification, when sent to all Global
    Administrators, ensures that all Global administrators can passively confirm if such a reset is a common pattern within
    their group. For example, if all Global Administrators change their password every 30 days, any password reset activity
    before that may require administrator(s) to evaluate any unusual activity and confirm its origin.
  impact: All Global Administrators will receive a notification from Azure every time a password is reset. This is useful
