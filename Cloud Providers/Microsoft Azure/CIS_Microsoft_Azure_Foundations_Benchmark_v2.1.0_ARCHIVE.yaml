  audit_raw: "From Azure Portal\n1. Go to Key vaults.\n2. For each Key vault.\n3. Go to Diagnostic settings.\n4. Click Edit\
    \ setting.\n5. Ensure that a destination is configured.\n6. Under Category groups, ensure that audit and allLogs are checked.\n\
