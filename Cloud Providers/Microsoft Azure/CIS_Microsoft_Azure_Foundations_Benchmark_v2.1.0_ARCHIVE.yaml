- id: '1.6'
  title: Ensure that a Custom Bad Password List is set to 'Enforce' for your Organization
  scoring: manual
  profile:
  - Level 1
  description: Microsoft Azure provides a Global Banned Password policy that applies to Azure administrative and normal user
    accounts. This is not applied to user accounts that are synced from an on-premise Active Directory unless Microsoft Entra
    ID Connect is used and you enable EnforceCloudPasswordPolicyForPasswordSyncedUsers. Please see the list in default values
    on the specifics of this policy. To further password security, it is recommended to further define a custom banned password
    policy.
  rationale: Enabling this gives your organization further customization on what secure passwords are allowed. Setting a bad
    password list enables your organization to fine-tune its password policy further, depending on your needs. Removing easy-to-guess
    passwords increases the security of access to your Azure resources.
  impact: Increasing needed password complexity might increase overhead on administration of user accounts. Licensing requirement
    for Global Banned Password List and Custom Banned Password list requires Microsoft Entra ID P1 or P2. On-premises Active
    Directory Domain Services users that are not synchronized to Microsoft Entra ID also benefit from Microsoft Entra ID Password
    Protection based on existing licensing for synchronized users.
  references:
  - 1. https://learn.microsoft.com/en-us/entra/identity/authentication/concept-passwordban-bad-combined-policy
  - 2. https://learn.microsoft.com/en-us/entra/identity/authentication/concept-passwordban-bad
