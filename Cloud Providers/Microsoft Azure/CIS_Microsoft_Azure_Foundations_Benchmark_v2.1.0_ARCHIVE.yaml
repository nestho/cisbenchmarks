    Run below command to list network security groups:

    az network nsg list --subscription <subscription-id> --output table

    1. For each network security group, run below command to list the rules associated

    with the specified port:

    az network nsg rule list --resource-group <resource-group> --nsg-name

    <nsg-name> --query "[?destinationPortRange==''80 or 443'']"

    2. Run the below command to delete the rule with:

    o Port = 80/443 OR [port range containing 80/443]

    o Protocol = TCP OR "*"

    o Source = Any (*) OR IP Addresses(0.0.0.0/0) OR Service Tag(Internet)

    o Action = Allow

    az network nsg rule delete --resource-group <resource-group> --nsg-name

    <nsg-name> --name <rule-name>'
