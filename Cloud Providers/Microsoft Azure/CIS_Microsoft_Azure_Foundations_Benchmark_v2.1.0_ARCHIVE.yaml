- id: '5.4'
  title: Ensure that Azure Monitor Resource Logging is Enabled for All Services that Support it
  scoring: manual
  profile:
  - Level 1
  - Level 2
  description: Resource Logs capture activity to the data access plane while the Activity log is a subscription-level log
    for the control plane. Resource-level diagnostic logs provide insight into operations that were performed within that
    resource itself; for example, reading or updating a secret from a Key Vault. Currently, 95 Azure resources support Azure
    Monitoring (See the more information section for a complete list), including Network Security Groups, Load Balancers,
    Key Vault, AD, Logic Apps, and CosmosDB. The content of these logs varies by resource type. A number of back-end services
    were not configured to log and store Resource Logs for certain activities or for a sufficient length. It is crucial that
    monitoring is correctly configured to log all relevant activities and retain those logs for a sufficient length of time.
    Given that the mean time to detection in an enterprise is 240 days, a minimum retention period of two years is recommended.
    The use of Basic or Free SKUs in Azure whilst cost effective have significant limitations in terms of what can be monitored
    and what support can be realized from Microsoft. Typically, these SKU’s do not have a service SLA and Microsoft may refuse
    to provide support for them. Consequently Basic/Free SKUs should never be used for production workloads.
  rationale: A lack of monitoring reduces the visibility into the data plane, and therefore an organization's ability to detect
    reconnaissance, authorization attempts or other malicious activity. Unlike Activity Logs, Resource Logs are not enabled
    by default. Specifically, without monitoring it would be impossible to tell which entities had accessed a data store that
    was breached. In addition, alerts for failed attempts to access APIs for Web Services or Databases are only possible when
    logging is enabled. Typically, production workloads need to be monitored and should have an SLA with Microsoft, using
    Basic SKUs for any deployed product will mean that that these capabilities do not exist. The following resource types
    should use standard SKUs as a minimum. • Public IP Addresses • Network Load Balancers • REDIS Cache • SQL PaaS Databases
    • VPN Gateways
  impact: Costs for monitoring varies with Log Volume. Not every resource needs to have logging enabled. It is important to
    determine the security classification of the data being processed by the given resource and adjust the logging based on
    which events need to be tracked. This is typically determined by governance and compliance requirements. The impact of
    enforcing Standard SKU's is twofold 1. There will be a cost increase 2. The monitoring and service level agreements will
    be available and will support the production service. All resources should be either tagged or in separate Management
    Groups/Subscriptions
  references:
  - 1. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-logging-threatdetection#lt-3-enable-logging-for-security-investigation
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-logging-threatdetection#lt-5-centralize-security-log-management-and-analysis
  - 1. https://azure.microsoft.com/en-us/support/plans
  - 2. https://azure.microsoft.com/en-us/support/plans/response/
  page_start: 362
  audit_raw: 'From Azure Portal

    The specific steps for configuring resources within the Azure

    console vary depending on resource, but typically the steps are:

    1. Go to the resource

    2. Click on Diagnostic settings

    3. In the blade that appears, click "Add diagnostic setting"

    4. Configure the diagnostic settings

    5. Click on Save

    From Azure CLI

    List all resources for a subscription

    az resource list --subscription <subscription id>

    For each resource run the following

    az monitor diagnostic-settings list --resource <resource ID>

    An empty result means a diagnostic settings is not configured for that resource. An

    error message means a diagnostic settings is not supported for that resource.

    From PowerShell

    Get a list of resources in a subscription context and store in a variable

    $resources = Get-AzResource

    Loop through each resource to determine if a diagnostic setting is configured or not.

    foreach ($resource in $resources) {$diagnosticSetting = GetAzDiagnosticSetting -ResourceId $resource.id -ErrorAction "SilentlyContinue";

    if ([string]::IsNullOrEmpty($diagnosticSetting)) {$message = "Diagnostic

    Settings not configured for resource: " + $resource.Name;Write-Output

    $message}else{$diagnosticSetting}}

    A result of Diagnostic Settings not configured for resource: <resource name>

    means a diagnostic settings is not configured for that resource. Otherwise, the output

    of the above command will show configured Diagnostic Settings for a resource.

    From Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: cf820ca0-f99e-4f3e-84fb-66e913812d21 - Name: ''Resource logs in

    Key Vault should be enabled''

    • Policy ID: 91a78b24-f231-4a8a-8da9-02c35b2b6510 - Name: ''App Service apps

    should have resource logs enabled''

    • Policy ID: 428256e6-1fac-4f48-a757-df34c2b3336d - Name: ''Resource logs in

    Batch accounts should be enabled''

    • Policy ID: 057ef27e-665e-4328-8ea3-04b3122bd9fb - Name: ''Resource logs in

    Azure Data Lake Store should be enabled''

    • Policy ID: c95c74d9-38fe-4f0d-af86-0c7d626a315c - Name: ''Resource logs in

    Data Lake Analytics should be enabled''

    • Policy ID: 83a214f7-d01a-484b-91a9-ed54470c9a6a - Name: ''Resource logs in

    Event Hub should be enabled''

