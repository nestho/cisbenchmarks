      6. Navigate back to the application blade

      7. Under Settings, click on Configuration

      8. Click on the ''General Settings'' tab

      9. Under Platform settings, ensure Basic Auth Publishing Credentials is set to

      Off

      From '
    severity: medium
- id: '9.2'
  title: Ensure Web App Redirects All HTTP traffic to HTTPS in Azure App Service
  scoring: scored
  profile:
  - Level 1
  description: Azure Web Apps allows sites to run under both HTTP and HTTPS by default. Web apps can be accessed by anyone
    using non-secure HTTP links by default. Non-secure HTTP requests can be restricted and all HTTP requests redirected to
    the secure HTTPS port. It is recommended to enforce HTTPS-only traffic.
  rationale: Enabling HTTPS-only traffic will redirect all non-secure HTTP requests to HTTPS ports. HTTPS uses the TLS/SSL
    protocol to provide a secure connection which is both encrypted and authenticated. It is therefore important to support
    HTTPS for the security benefits.
  impact: When it is enabled, every incoming HTTP request is redirected to the HTTPS port. This means an extra level of security
    will be added to the HTTP requests made to the app.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/app-service/app-service-web-tutorialcustom-ssl#enforce-https
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-dataprotection#dp-3-encrypt-sensitive-data-in-transit
  page_start: 451
  audit_raw: 'From Azure Portal

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. Click on each App

    4. Click on configuration

    5. Ensure that the HTTPS Only setting is toggled to On

    From Azure CLI

    To check HTTPS-only traffic value for an existing app, run the following command,

    az webapp show --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME> --

    query httpsOnly

    The output should return true if HTTPS-only traffic value is set to On.

    From PowerShell

    List all the web apps configured within the subscription.

    Get-AzWebApp | Select-Object ResourceGroup, Name, HttpsOnly

    For each web app review the HttpsOnly setting and make sure it is set to True.

    From Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: a4af4a39-4135-47fb-b175-47fbdf85311d - Name: ''App Service apps

    should only be accessible over HTTPS'''
  remediation: 'From Azure Portal

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. Click on each App

    4. Click on configuration

    5. Under the HTTPS Only heading select ''On'' to enable https only

    6. Click Save at the top

    From Azure CLI

    To set HTTPS-only traffic value for an existing app, run the following command:

    az webapp update --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME> --

    set httpsOnly=true

    From PowerShell

    Set-AzWebApp -ResourceGroupName <RESOURCE_GROUP_NAME> -Name <APP_NAME> -

    HttpsOnly $true'
  checks:
