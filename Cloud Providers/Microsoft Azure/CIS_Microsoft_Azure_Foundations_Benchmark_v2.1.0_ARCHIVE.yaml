    This needs to be audited by Azure Policy (one for each resource type) and denied for

    each artifact that is production.

    From Azure Portal

    1. Open Azure Resource Graph Explorer

    2. Click New query

    3. Paste the following into the query window:

    Resources

    | where sku contains ''Basic'' or sku contains ''consumption''

    | order by type

    4. Click Run query then evaluate the results in the results window.

