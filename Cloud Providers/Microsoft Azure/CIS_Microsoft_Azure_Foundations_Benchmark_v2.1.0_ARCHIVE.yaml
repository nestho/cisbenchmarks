    \ create \\\n --name <storage-account> \\\n --resource-group <resource-group> \\\n --location <location> \\\n --sku Standard_RAGRS\
    \ \\\n --kind StorageV2 \\\n --require-infrastructure-encryption\nFrom PowerShell\nReplace the information within <> with\
