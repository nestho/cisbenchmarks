- id: '1.23'
  title: Ensure a Custom Role is Assigned Permissions for Administering Resource Locks
  scoring: manual
  profile:
  - Level 2
  description: Resource locking is a powerful protection mechanism that can prevent inadvertent modification/deletion of resources
    within Azure subscriptions/Resource Groups and is a recommended NIST configuration. Users who are set as subscription
    owners are able to make administrative changes to the subscriptions and move them into and out of Microsoft Entra ID.
  rationale: Given the resource lock functionality is outside of standard Role Based Access Control(RBAC), it would be prudent
    to create a resource lock administrator role to prevent inadvertent unlocking of resources. Permissions to move subscriptions
    in and out of Microsoft Entra ID directory must only be given to appropriate administrative personnel. A subscription
    that is moved into an Microsoft Entra ID directory may be within a folder to which other users have elevated permissions.
    This prevents loss of data or unapproved changes of the objects within by potential bad actors.
  impact: By adding this role, specific permissions may be granted for managing just resource locks rather than needing to
    provide the wide Owner or User Access Administrator role, reducing the risk of the user being able to do unintentional
    damage. Subscriptions will need to have these settings turned off to be moved.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/role-based-access-control/custom-roles
  - 2. https://docs.microsoft.com/en-us/azure/role-based-access-control/check-access
  - 1. https://docs.microsoft.com/en-us/azure/cost-managementbilling/manage/manage-azure-subscription-policy
  - 2. https://docs.microsoft.com/en-us/azure/active-directory/fundamentals/activedirectory-how-subscriptions-associated-directory
  page_start: 106
  audit_raw: 'From Azure Portal

    1. In the Azure portal, open a subscription or resource group where you want to

    view assigned roles.

    2. Select Access control (IAM)

    3. Select Roles

    4. Search for the custom role named <role_name> Ex. from remediation Resource

    Lock Administrator

    5. Ensure that the role is assigned to the appropriate users.

    From Azure Portal

    1. From the Azure Portal Home select the portal menu

    2. Select Subscriptions

    3. In the Advanced options drop-down menu, select Manage Policies

    4. Ensure Subscription leaving Microsoft Entra ID directory and

    Subscription entering Microsoft Entra ID directory are set to Permit no

    one'
  remediation: 'From Azure Portal

    1. In the Azure portal, open a subscription or resource group where you want the

    custom role to be assigned.

    2. Select Access control (IAM).

    3. Click Add.

    4. Select Add custom role.

    5. In the Custom Role Name field enter Resource Lock Administrator.

    6. In the Description field enter Can Administer Resource Locks.

    7. For Baseline permissions select Start from scratch

    8. Select next.

    9. In the Permissions tab select Add permissions.

    10. In the Search for a permission box, type in Microsoft.Authorization/locks to

    search for permissions.

    11. Select the check box next to the permission Microsoft.Authorization/locks.

    12. Select Add.

    13. Select Review + create.

    14. Select Create.

    15. Assign the newly created role to the appropriate user.

    From PowerShell:

    Below is a power shell definition for a resource lock administrator role created at an

    Azure Management group level

    Import-Module Az.Accounts

    Connect-AzAccount

    $role = Get-AzRoleDefinition "User Access Administrator"

    $role.Id = $null

    $role.Name = "Resource Lock Administrator"

    $role.Description = "Can Administer Resource Locks"

    $role.Actions.Clear()

    $role.Actions.Add("Microsoft.Authorization/locks/*")

    $role.AssignableScopes.Clear()

    * Scope at the Management group level Management group

    $role.AssignableScopes.Add("/providers/Microsoft.Management/managementGroups/

    MG-Name")

    New-AzRoleDefinition -Role $role

    Get-AzureRmRoleDefinition "Resource Lock Administrator"

    From Azure Portal

    1. From the Azure Portal Home select the portal menu

    2. Select Subscriptions

    3. In the Advanced options drop-down menu, select Manage Policies

    4. Under Subscription leaving Microsoft Entra ID directory and Subscription

    entering Microsoft Entra ID directory select Permit no one'
  checks:
