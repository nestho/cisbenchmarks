    \ -Location <location> `\n -SkuName \"Standard_RAGRS\" `\n -Kind StorageV2 `\n -RequireInfrastructureEncryption\nEnabling\
    \ Infrastructure Encryption after Storage Account Creation\nIf infrastructure encryption was not enabled on blob storage\
    \ creation, there is no official\nway to enable it. Please see the additional information section."
