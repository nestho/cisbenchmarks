    \ follows in the sample outputs below.\n\"logs\": [\n{\n \"categoryGroup\": \"audit\",\n \"enabled\": true,\n},\n{\n \"\
    categoryGroup\": \"allLogs\",\n \"enabled\": true,\n}\nFrom PowerShell\nList the key vault(s) in the subscription\nGet-AzKeyVault\n\
