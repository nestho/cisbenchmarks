- id: 4.1.2
  title: Ensure no Azure SQL Databases allow ingress from 0.0.0.0/0 (ANY IP)
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: Ensure that no SQL Databases allow ingress from 0.0.0.0/0 (ANY IP). Transparent Data Encryption (TDE) with
    Customer-managed key support provides increased transparency and control over the TDE Protector, increased security with
    an HSM-backed external service, and promotion of separation of duties. With TDE, data is encrypted at rest with a symmetric
    key (called the database encryption key) stored in the database or data warehouse distribution. To protect this data encryption
    key (DEK) in the past, only a certificate that the Azure SQL Service managed could be used. Now, with Customer-managed
    key support for TDE, the DEK can be protected with an asymmetric key that is stored in the Azure Key Vault. The Azure
    Key Vault is a highly available and scalable cloud-based key store which offers central key management, leverages FIPS
    140-2 Level 2 validated hardware security modules (HSMs), and allows separation of management of keys and data for additional
    security. Based on business needs or criticality of data/databases hosted on a SQL server, it is recommended that the
    TDE protector is encrypted by a key that is managed by the data owner (Customer-managed key).
  rationale: Azure SQL Server includes a firewall to block access to unauthorized connections. More granular IP addresses
    can be defined by referencing the range of addresses available from specific datacenters. By default, for a SQL server,
    a Firewall exists with StartIp of 0.0.0.0 and EndIP of 0.0.0.0 allowing access to all the Azure services. Additionally,
    a custom rule can be set up with StartIp of 0.0.0.0 and EndIP of 255.255.255.255 allowing access from ANY IP over the
    Internet. In order to reduce the potential attack surface for a SQL server, firewall rules should be defined with more
    granular IP addresses by referencing the range of addresses available from specific datacenters. Customer-managed key
    support for Transparent Data Encryption (TDE) allows user control of TDE encryption keys and restricts who can access
    them and when. Azure Key Vault, Azure’s cloud-based external key management system, is the first key management service
    where TDE has integrated support for Customer-managed keys. With Customer-managed key support, the database encryption
    key is protected by an asymmetric key stored in the Key Vault. The asymmetric key is set at the server level and inherited
    by all databases under that server.
  impact: Disabling Allow Azure services and resources to access this server will break all connections to SQL server and
    Hosted Databases unless custom IP specific rules are added in Firewall Policy. Once TDE protector is encrypted with a
    Customer-managed key, it transfers entire responsibility of respective key management on to you, and hence you should
    be more careful about doing any operations on the particular key in order to keep data from corresponding SQL server and
    Databases hosted accessible. When deploying Customer Managed Keys, it is prudent to ensure that you also deploy an automated
    toolset for managing these keys (this should include discovery and key rotation), and Keys should be stored in an HSM
    or hardware backed keystore, such as Azure Key Vault. As far as toolsets go, check with your cryptographic key provider,
    as they may well provide one as an add-on to their service.
  references:
  - 1. https://docs.microsoft.com/en-us/sql/database-engine/configurewindows/configure-a-windows-firewall-for-database-engine-access?view=sqlserver-2017
  - 2. https://docs.microsoft.com/en-us/powershell/module/azurerm.sql/getazurermsqlserverfirewallrule?view=azurermps-5.2.0
  - 1. https://docs.microsoft.com/en-us/sql/relationaldatabases/security/encryption/transparent-data-encryption-byok-azure-sql
  - 2. https://azure.microsoft.com/en-in/blog/preview-sql-transparent-data-encryptiontde-with-bring-your-own-key-support/
  page_start: 239
