  rationale: 'It is recommended to only allow an administrator to register custom-developed applications. This ensures that
    the application undergoes a formal security review and approval process prior to exposing Microsoft Entra ID data. Certain
    users like developers or other high-request users may also be delegated permissions to prevent them from waiting on an
    administrative user. Your organization should review your policies and decide your needs. Limiting guest access ensures
    that guest accounts do not have permission for certain directory tasks, such as enumerating users, groups or other directory
    resources, and cannot be assigned to administrative roles in your directory. Guest access has three levels of restriction.
    1. Guest users have the same access as members (most inclusive), 2. Guest users have limited access to properties and
    memberships of directory objects (default value), 3. Guest user access is restricted to properties and memberships of
    their own directory objects (most restrictive). The recommended option is the 3rd, most restrictive: "Guest user access
    is restricted to their own directory object".'
  impact: Enforcing this setting will create additional requests for approval that will need to be addressed by an administrator.
    If permissions are delegated, a user may approve a malevolent third party application, potentially giving it access to
    your data. This may create additional requests for permissions to access resources that administrators will need to approve.
    According to https://learn.microsoft.com/en-us/azure/active-directory/enterpriseusers/users-restrict-guest-permissions#services-currently-not-supported
