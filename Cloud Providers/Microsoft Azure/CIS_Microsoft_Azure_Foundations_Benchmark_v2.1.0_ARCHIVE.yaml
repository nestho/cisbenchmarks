    \ top of the networking\nwindow\n5. Click the +Private endpoint button\n6. In the 1 - Basics tab/step:\no\nEnter a name\
    \ that will be easily recognizable as associated with the\nStorage Account (Note: The \"Network Interface Name\" will\
    \ be\nautomatically completed, but you can customize it if needed.)\no Ensure that the Region matches the region of the\
    \ Storage Account\no Click Next\n7. In the 2 - Resource tab/step:\no Select the target sub-resource based on what type\
    \ of storage resource\nis being made available\no Click Next\n8. In the 3 - Virtual Network tab/step:\no Select the Virtual\
    \ network that your Storage Account will be connecting\nto\no Select the Subnet that your Storage Account will be connecting\
    \ to\no (Optional) Select other network settings as appropriate for your\nenvironment\no Click Next\n9. In the 4 - DNS\
