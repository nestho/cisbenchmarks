- id: 3.2.8
  title: Ensure private endpoints are configured for Recovery Services Vaults
  scoring: scored
  profile:
  - Level 2
  description: 'Azure Private Link enables connectivity between clients in a virtual network and Azure Recovery Services vaults
    by routing backup and restore traffic over the Azure backbone network rather than the public internet. A private endpoint
    for the AzureBackup subresource deploys a network interface with a private IP address in the specified virtual network,
    so backup agents and workload extensions communicate with the vault without traversing the public internet. Note: Private
    endpoints for Azure Site Recovery operations on the same vault require the AzureSiteRecovery sub-resource and are not
    in scope for this recommendation. Configure at least one approved private endpoint targeting the AzureBackup subresource
    on each Recovery Services Vault used for backup.'
  rationale: A Recovery Services vault whose backup traffic flows over the public internet is accessible from any host with
    internet connectivity, exposing backup and restore operations to interception and unauthorized access attempts. Private
    endpoints confine vault traffic to clients within the virtual network and connected networks (ExpressRoute, VPN, peered
    VNets), eliminating public-endpoint exposure for backup operations. When combined with disabling public network access
    on the vault, private endpoints ensure that backup data does not traverse the public internet, reducing the risk of data
    exfiltration and unauthorized restore operations from outside the network perimeter.
  impact: Backup agents, workload extensions, and the MARS agent must operate from a virtual network that contains an approved
    private endpoint for the vault, or from a network connected to it via ExpressRoute or VPN. Clients outside these networks
    cannot perform backup or restore operations if public network access is also denied on the vault. Creating a primary private
    endpoint is supported only on vaults with no registered or previously protected items; vaults with existing protected
    items require provisioning a new vault before private endpoints can be applied. A maximum of 12 private endpoints can
    be configured per vault. Private endpoints for DPM and MABS scenarios require DPM 2022 (10.22.123.0) or later and MABS
    v4 (14.0.30.0) or later.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/backup/backup-azure-private-endpointsconcept
  - 2. https://learn.microsoft.com/en-us/azure/backup/backup-azure-private-endpointsconfigure-manage
  page_start: 72
  audit_raw: 'Audit from Azure Portal

    1. In the Azure portal, navigate to Recovery Services vaults and select the

    vault.

    2. Under Settings, select Networking.

    3. Select the Private access tab.

    4. Review the Private endpoint connections list.

    Verify that at least one entry is present with a Sub-resource of AzureBackup and a

    Connection state of Approved. If no such connection exists, the vault is noncompliant. Repeat for each Recovery Services
    Vault in scope.

    Audit from Azure CLI

    For each vault, run:

    az network private-endpoint-connection list --id

    /subscriptions/<subscription-id>/resourceGroups/<resource-groupname>/providers/Microsoft.RecoveryServices/vaults/<vault-name>

    Verify that the output contains at least one object where

    properties.privateLinkServiceConnectionState.status equals Approved,

    properties.provisioningState equals Succeeded, and the id field contains

    .backup. If the output is an empty array or no entry meets all three conditions, the vault

    is non-compliant.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: deeddb44-9f94-4903-9fa0-081d524406e3 - Name: ''[Preview]: Azure

    Recovery Services vaults should use private link for backup''

    Note: This policy definition is currently in preview (version 2.0.0-preview). The

    underlying Azure Private Link feature for Recovery Services vaults is generally

    available.'
  remediation: 'Remediate from Azure Portal

    Note: A primary private endpoint can only be created on a vault with no registered or

    previously protected items. If the vault already has protected items, provision a new

    vault and configure a private endpoint before migrating workloads to it.

    1. In the Azure portal, navigate to Recovery Services vaults and select the

    vault.

    2. Under Settings, select Networking.

    3. On the Private access tab, select + Private endpoint.

    4. On the Basics tab, provide a name for the private endpoint and confirm the

    Region matches the vault''s region.

    5. On the Resource tab, set Resource type to

    Microsoft.RecoveryServices/vaults, set Resource to the vault name, and

    set Target sub-resource to AzureBackup.

    6. On the Virtual network tab, select the virtual network and subnet where the

    private endpoint will be deployed.

    7. On the DNS tab, select Yes for Integrate with private DNS zone to

    automatically create and link the required DNS zones, or select No and add the

    required DNS records manually.

    8. Select Review + create, then select Create.

    9. If the connection is not auto-approved (non-owner scenario), navigate to

    Private endpoint connections on the vault and select Approve for the

    pending connection.

    Remediate from Azure CLI

    Note: A primary private endpoint can only be created on a vault with no registered or

    previously protected items.

    1. Create the private endpoint with --group-id AzureBackup:

    az network private-endpoint create --name <private-endpoint-name> --resourcegroup <resource-group-name> --vnet-name <vnet-name>
    --subnet <subnet-name> --

    private-connection-resource-id /subscriptions/<subscriptionid>/resourceGroups/<resource-groupname>/providers/Microsoft.RecoveryServices/vaults/<vault-name>
    --group-id

    AzureBackup --connection-name <connection-name>

    2. Check the connection state:

    az network private-endpoint-connection list --id

    /subscriptions/<subscription-id>/resourceGroups/<resource-groupname>/providers/Microsoft.RecoveryServices/vaults/<vault-name>

    3. If properties.privateLinkServiceConnectionState.status is Pending,

    approve the connection:

    az network private-endpoint-connection approve --id <private-endpointconnection-id>'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. In the Azure portal, navigate to Recovery Services vaults and select the

      vault.

      2. Under Settings, select Networking.

      3. Select the Private access tab.

      4. Review the Private endpoint connections list.

      Verify that at least one entry is present with a Sub-resource of AzureBackup and a

      Connection state of Approved. If no such connection exists, the vault is noncompliant. Repeat for each Recovery Services
      Vault in scope.

      Audit from Azure CLI

      For each vault, run:

      az network'
    severity: medium
- id: '4.1'
  title: Ensure 'Key encryption key' is set to a customer-managed key for Azure Managed Lustre file systems
  scoring: scored
  profile:
  - Level 2
  description: Enable customer-managed encryption keys (CMEK) for Azure Managed Lustre file systems to enhance data security
    and provide greater control over encryption processes. By using CMEK, organizations can manage their own encryption keys
    within Azure Key Vault, allowing them to rotate, revoke, or otherwise control access to these keys in accordance with
    their security policies.
  rationale: Using customer-managed encryption keys (CMEK) gives organizations complete control over encryption keys, ensuring
    compliance and enhancing data security. CMEK allows for key rotation, revocation, and lifecycle management, thus improving
    data protection and facilitating immediate control over data access in Azure Managed Lustre file systems.
  impact: There are costs and configuration overhead associated with setting up and managing customer-managed keys.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/azure-managed-lustre/customermanaged-encryption-keys
  - 2. https://learn.microsoft.com/en-us/cli/azure/amlfs
  page_start: 77
  audit_raw: 'Audit from Azure Portal

    1. Go to Azure Managed Lustre.

    2. Click the name of a file system.

    3. Under Settings, click Properties.

    4. Under Encryption settings, ensure that the value next to Key encryption

    key is View value as JSON.

    5. Repeat steps 1-4 for each file system.

    Audit from Azure CLI

    Run the following command to lust Azure Managed Lustre file systems:

    az amlfs list

    For each file system, run the following command:

    az amlfs show --resource-group <resource-group> --name <file-system>

    Ensure that under encryptionSettings > keyEncryptionKey, keyUrl is set to a

    customer-managed key URL.

    Audit from PowerShell

    Run the following command to install the Az.StorageCache module:

    Install-Module Az.StorageCache

    Enter Y when prompted.

    Run the following command to list Azure Managed Lustre file systems:

    Get-AzStorageCacheAmlFileSystem

    Run the following command to get the file system in a resource group with a given

    name:

    $filesystem = Get-AzStorageCacheAmlFileSystem -ResourceGroupName <resourcegroup> -Name <file-system>

    Run the following command to get the key encryption key URL for the file system:

    $filesystem.KeyEncryptionKeyUrl

    Ensure that the command returns a customer-managed key URL.

    Repeat for each file system.'
  remediation: 'To create an Azure Managed Lustre file system that uses a customer-managed

    encryption key:

    Remediate from Azure Portal

    1. Go to Azure Managed Lustre.

    2. Click + Create.

    3. Provide the required information on the Basics tab.

    4. Configure the Advanced tab if necessary.

    5. Click the Disk encryption keys tab.

    6. Next to Disk encryption key type, select the radio button next to Customer

    managed.

    7. Next to Key vault, key and version, click Select or create a key

    vault, key, or version.

    8. Select a key vault, key, and version.

    9. Click Select.

    10. Next to User assigned identities, click Add user assigned managed

    identities.

    11. In the filter box, type to filter by identity name and/or resource group name.

    12. Check the box next to a managed identity.

    13. Click Add.

    14. Click Review + create.

    15. Click Create.

    Remediate from Azure CLI

    Run the following command to create an Azure Managed Lustre file system with a

    customer-managed encryption key:

    az amlfs create --resource-group <resource-group> --name <file-system> --sku

    <sku> --storage-capacity <size-in-tib> --zones [<availability-zone>] --

    maintenance-window "{dayOfWeek:<day>,timeOfDayUtc:''<time>''}" --mi-userassigned "<user-assigned-identity-id>" --filesystem-subnet
    "<subnet-id>" --

    encryption-setting "{''keyUrl'': ''<key-url>'', ''sourceVault'': {''id'': ''<keyvault>''}}"

    Remediate from PowerShell

    Run the following command to install the Az.StorageCache module:

    Install-Module Az.StorageCache

    Enter Y when prompted.

    Run the following command to create an Azure Manage Lustre file system with a

    customer-managed encryption key:

    New-AzStorageCacheAmlFileSystem -ResourceGroupName <resource-group> -Name

    <file-system> -Location <location> -MaintenanceWindowDayOfWeek ''<day>'' -

    MaintenanceWindowTimeOfDayUtc "<time>" -FilesystemSubnet "<subnet-id>" -

    SkuName "<sku>" -StorageCapacityTiB <size-in-tib> -Zone <availability-zone> -

    IdentityType ''UserAssigned'' -IdentityUserAssignedIdentity @{"<user-assignedidentity-id>" = @{}} -KeyEncryptionKeyUrl
    "<key-url>" -SourceVaultId "<keyvault>"'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Azure Managed Lustre.

      2. Click the name of a file system.

      3. Under Settings, click Properties.

      4. Under Encryption settings, ensure that the value next to Key encryption

      key is View value as JSON.

      5. Repeat steps 1-4 for each file system.

      Audit from Azure CLI

      Run the following command to lust Azure Managed Lustre file systems:

      az amlfs list

      For each file system, run the following command:

      az amlfs show --resource-group <resource-group> --name <file-system>

      Ensure'
    severity: medium
- id: 7.1.1
  title: Ensure root squash for NFS file shares is configured (Microsoft.FileShares)
  scoring: scored
  profile:
  - Level 1
  description: 'Note: This recommendation applies to NFS file shares created with the Microsoft.FileShares provider. For NFS
    file shares hosted in a storage account (the Microsoft.Storage provider), see the corresponding Classic File Shares recommendation.
    Permissions for NFS file shares are enforced by the client OS rather than by the Azure Files service. Root squash is an
    administrative security feature in NFS that prevents unauthorized root-level access to the NFS server by client machines.
    This functionality is an important part of protecting user data and system settings from manipulation by untrusted or
    compromised clients.'
  rationale: Administrators should enable root squash in environments where multiple users or systems access the NFS share,
    especially in scenarios where client machines are not fully trusted. By converting root users to anonymous users, root
    squash ensures that even if a client machine is compromised, the attacker cannot exploit root privileges to access or
    modify critical files on the NFS server.
  impact: There is no additional cost associated with enabling root squash; however, there may be some minor administrative
    overhead involved in configuring and managing permissions with root squash enabled.
  references:
  - 1. https://learn.microsoft.com/azure/storage/files/nfs-root-squash
  - 2. https://learn.microsoft.com/azure/storage/files/modify-file-share
  page_start: 85
  audit_raw: 'Audit from Azure Portal

    1. In the Azure portal, search for and select File shares.

    2. Select the NFS file share to audit.

    3. Under Settings, select Configuration.

    4. Ensure that Root squash is set to Root squash.

    5. Repeat for each Microsoft.FileShares NFS file share.

    Audit from Azure CLI

    If the file shares extension is not installed, add it:

    az extension add --name fileshares

    For each file share, run the following command and ensure rootSquash returns

    RootSquash:

    az fileshare show --resource-group <resource-group> --name <file-share-name>

    --query rootSquash

    Audit from Azure PowerShell

    If the Az.FileShare module is not installed, install it:

    Install-Module -Name Az.FileShare -Repository PSGallery

    For each file share, run the following command and ensure

    NfProtocolPropertyRootSquash returns RootSquash:

    Get-AzFileShare -ResourceGroupName <resource-group> -ResourceName <fileshare-name> | Select-Object -ExpandProperty NfProtocolPropertyRootSquash'
  remediation: 'Remediate from Azure Portal

    1. In the Azure portal, search for and select File shares.

    2. Select the NFS file share to remediate.

    3. Under Settings, select Configuration.

    4. Set Root squash to Root squash.

    5. Select Save.

    6. Repeat for each file share requiring remediation.

    Remediate from Azure CLI

    If the file shares extension is not installed, add it:

    az extension add --name fileshares

    For each file share requiring remediation, run:

    az fileshare update --resource-group <resource-group> --name <file-sharename> --root-squash RootSquash

    Remediate from Azure PowerShell

    If the Az.FileShare module is not installed, install it:

    Install-Module -Name Az.FileShare -Repository PSGallery

    For each file share requiring remediation, run:

    Update-AzFileShare -ResourceName <file-share-name> -ResourceGroupName

    <resource-group> -NfProtocolPropertyRootSquash RootSquash'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. In the Azure portal, search for and select File shares.

      2. Select the NFS file share to audit.

      3. Under Settings, select Configuration.

      4. Ensure that Root squash is set to Root squash.

      5. Repeat for each Microsoft.FileShares NFS file share.

      Audit from Azure CLI

      If the file shares extension is not installed, add it:

      az extension add --name fileshares

      For each file share, run the following command and ensure rootSquash returns

      RootSquash:

      az fileshare show --resource-gr'
    severity: medium
- id: 7.1.2
  title: Ensure encryption in transit is required for File Shares (Microsoft.FileShares)
  scoring: scored
  profile:
  - Level 1
  description: 'Note: This recommendation applies to NFS file shares created with the Microsoft.FileShares provider. Encryption
    in transit protects data moving between NFS clients and the file share from interception and tampering. On Microsoft.FileShares,
    NFS traffic is encrypted with TLS (via the AZNFS/stunnel mount helper) when encryption in transit is required on the share.'
  rationale: NFS has no built-in user authentication; access is governed at the network layer, so unencrypted NFS traffic
    is exposed to eavesdropping and man-in-the-middle attacks on the path between client and share. Requiring encryption in
    transit ensures mount traffic is protected with TLS, preserving the confidentiality and integrity of data in motion.
  impact: Clients must mount the share over the encrypted (TLS) path using a supported mount helper (AZNFS). Mount configurations
    that do not support encrypted NFS will fail to connect until updated.
  references:
  - 1. https://learn.microsoft.com/azure/storage/files/encryption-in-transit-for-nfs-shares
  - 2. https://learn.microsoft.com/azure/storage/files/files-nfs-protocol
  page_start: 88
  audit_raw: 'Audit from Azure Portal

    1. In the Azure portal, search for and select File shares.

    2. Select the NFS file share to audit.

    3. Under the share''s Settings, select Configuration.

    4. Confirm that Encryption in transit is Enabled. If it is Disabled, the file

    share is non-compliant.

    5. Repeat for each Microsoft.FileShares NFS file share.

    Audit from Azure CLI

    If the file share extension is not installed, add it:

    az extension add --name fileshare

    For each file share, run the following command:

    az fileshare show --resource-group <resource-group> --name <file-share-name>

    --query encryptionInTransitRequired

    A compliant share returns Enabled. Any other value (for example, Disabled) is noncompliant.

    Audit from PowerShell

    If the Az.FileShare module is not installed, install it:

    Install-Module -Name Az.FileShare -Repository PSGallery

    For each file share, run the following command:

    Get-AzFileShare -ResourceGroupName <resource-group> -ResourceName <fileshare-name> | Select-Object -ExpandProperty EncryptionInTransitRequired

    A compliant share returns Enabled. Any other value (for example, Disabled) is noncompliant.'
  remediation: 'Remediate from Azure Portal

    1. In the Azure portal, search for and select File shares.

    2. Select the NFS file share to remediate.

    3. Under the share''s Settings, select Configuration.

    4. Set Encryption in transit to Enabled.

    5. Select Save.

    6. Repeat for each file share requiring remediation.

    Remediate from Azure CLI

    If the file share extension is not installed, add it:

    az extension add --name fileshare

    For each file share requiring remediation, run:

    az fileshare update --resource-group <resource-group> --name <file-sharename> --encryption-in-transit-required Enabled

    Remediate from PowerShell

    If the Az.FileShare module is not installed, install it:

    Install-Module -Name Az.FileShare -Repository PSGallery

    For each file share requiring remediation, run:

    Update-AzFileShare -ResourceName <file-share-name> -ResourceGroupName

    <resource-group> -EncryptionInTransitRequired Enabled'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. In the Azure portal, search for and select File shares.

      2. Select the NFS file share to audit.

      3. Under the share''s Settings, select Configuration.

      4. Confirm that Encryption in transit is Enabled. If it is Disabled, the file

      share is non-compliant.

      5. Repeat for each Microsoft.FileShares NFS file share.

      Audit from Azure CLI

      If the file share extension is not installed, add it:

      az extension add --name fileshare

      For each file share, run the following command:

      az filesha'
    severity: medium
- id: 7.1.3
  title: Ensure 'Public Endpoint Access' for File Shares is restricted to selected virtual networks (Microsoft.FileShares)
  scoring: scored
  profile:
  - Level 1
  description: 'Note: This recommendation applies to NFS file shares created with the Microsoft.FileShares provider. An NFS
    file share is reachable over its public endpoint only when that endpoint is restricted to specific virtual network subnets
    (service endpoints). Restricting public network access to selected virtual networks ensures the share accepts traffic
    only from approved subnets rather than from all networks, narrowing the network attack surface. Disabling the public endpoint
    entirely and using private endpoints are stronger, followon controls.'
  rationale: A file share whose public endpoint is not constrained to specific virtual networks is exposed to a broader network
    range than necessary, increasing the risk of unauthorized access and network-based attack. Restricting access to defined
    virtual-network subnets ensures only traffic from approved networks can reach the share over the public endpoint.
  impact: Clients on subnets that are not in the allowed set lose access to the share over the public endpoint. Confirm that
    every legitimate client originates from an allowed subnet (or reaches the share through a private endpoint) before applying
    the restriction. Each allowed subnet is specified by its resource ID.
  references:
  - 1. https://learn.microsoft.com/azure/storage/files/storage-files-networking-overview
  - 2. https://learn.microsoft.com/azure/storage/files/storage-files-networking-endpoints
  page_start: 91
  audit_raw: 'Audit from Azure Portal

    1. In the Azure portal, search for and select File shares.

    2. Select the NFS file share to audit.

    3. Under the share''s Settings, select Networking.

    4. Confirm Public network access is set to Enabled from selected virtual

    networks with at least one virtual network/subnet listed, or to Disabled. If

    Public network access is enabled with no virtual networks listed, the file share

    is non-compliant.

    5. Repeat for each Microsoft.FileShares NFS file share.

    Audit from Azure CLI

    If the file share extension is not installed, add it:

    az extension add --name fileshare

    For each file share, run the following command:

    az fileshare show --resource-group <resource-group> --name <file-share-name>

    --query "{publicNetworkAccess:publicNetworkAccess,

    allowedSubnets:allowedSubnets}"

    A compliant share returns publicNetworkAccess of Disabled, or

    publicNetworkAccess of Enabled with a non-empty allowedSubnets list. A share

    with publicNetworkAccess Enabled and an empty allowedSubnets is non-compliant.

    Audit from PowerShell

    If the Az.FileShare module is not installed, install it:

    Install-Module -Name Az.FileShare -Repository PSGallery

    For each file share, run the following command:

    Get-AzFileShare -ResourceGroupName <resource-group> -ResourceName <fileshare-name> | Select-Object PublicNetworkAccess,
    AllowedSubnet

    A compliant share returns PublicNetworkAccess of Disabled, or Enabled with a nonempty AllowedSubnet. Enabled with no AllowedSubnet
    is non-compliant.'
  remediation: 'Remediate from Azure Portal

    1. In the Azure portal, search for and select File shares.

    2. Select the NFS file share to remediate.

    3. Under the share''s Settings, select Networking.

    4. Set Public network access to Enabled from selected virtual networks,

    then add the virtual networks and subnets allowed to reach the share.

    5. Select Save.

    6. Repeat for each file share requiring remediation.

    Remediate from Azure CLI

    If the file share extension is not installed, add it:

    az extension add --name fileshare

    For each file share requiring remediation, run:

    az fileshare update --resource-group <resource-group> --name <file-sharename> --allowed-subnets <subnet-resource-id>

    Remediate from PowerShell

    If the Az.FileShare module is not installed, install it:

    Install-Module -Name Az.FileShare -Repository PSGallery

    For each file share requiring remediation, run:

    Update-AzFileShare -ResourceName <file-share-name> -ResourceGroupName

    <resource-group> -AllowedSubnet <subnet-resource-id>'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. In the Azure portal, search for and select File shares.

      2. Select the NFS file share to audit.

      3. Under the share''s Settings, select Networking.

      4. Confirm Public network access is set to Enabled from selected virtual

