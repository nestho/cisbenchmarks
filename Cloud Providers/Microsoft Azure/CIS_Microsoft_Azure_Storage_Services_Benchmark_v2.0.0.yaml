- id: '14.2'
  title: Ensure customer-managed keys (CMK) are used to encrypt data at rest on Azure Elastic SAN volume groups
  scoring: scored
  profile:
  - Level 2
  description: 'Azure Elastic SAN volume groups offer two encryption options: Microsoft-managed keys, which provide automatic
    encryption without user intervention, and customermanaged keys (CMK), which allow organizations to retain full control
    over their encryption keys for enhanced security and compliance.'
  rationale: Using customer-managed keys (CMKs) to encrypt Azure Elastic SAN volume groups enhances security by granting organizations
    complete control over their encryption keys.
  impact: There are costs and configuration overhead associated with setting up and managing customer-managed keys.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/elastic-san/elastic-san-configurecustomer-managed-keys
  - 2. https://learn.microsoft.com/en-us/cli/azure/elastic-san/volume-group
  page_start: 148
  audit_raw: 'Audit from Azure Portal

    1. Go to Elastic SANs.

    2. Click the name of an Elastic SAN.

