- id: '9.1'
  title: Ensure 'Encryption key source' is set to 'Customer Managed Key' for Azure NetApp Files accounts
  scoring: scored
  profile:
  - Level 2
  description: Customer-managed keys (CMK) for Azure NetApp Files volume encryption enable organizations to use their own
