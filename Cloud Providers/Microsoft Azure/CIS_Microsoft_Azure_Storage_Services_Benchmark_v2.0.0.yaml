    2. Click the name of a storage account.

    3. Under Data storage, click File shares.

    4. Under File share settings, click the link next to Security.

    5. Under SMB channel encryption, ensure that AES-256-GCM, or higher, is the

    only checked SMB channel encryption setting.

    6. Repeat steps 1-5 for each storage account.

    Audit from Azure CLI

    Run the following command to list storage accounts:

    az storage account list

    For each storage account, run the following command:

    az storage account file-service-properties show --resource-group <resourcegroup> --account-name <storage-account>

    Ensure that under protocolSettings > smb, channelEncryption is set to AES-256GCM;, or higher, only.

    Audit from PowerShell

