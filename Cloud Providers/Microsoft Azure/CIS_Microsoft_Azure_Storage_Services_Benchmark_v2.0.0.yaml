  rationale: Using customer-managed keys (CMKs) to encrypt Azure NetApp Files volumes enhances security by granting organizations
    complete control over their encryption keys.
  impact: There are costs and configuration overhead associated with setting up and managing customer-managed keys.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/azure-netapp-files/configure-customermanaged-keys
  - 2. https://learn.microsoft.com/en-us/cli/azure/netappfiles
  page_start: 118
  audit_raw: 'Audit from Azure Portal

