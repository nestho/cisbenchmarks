    \ scope. (Premium accounts support only LRS/ZRS and cannot use a geo-redundant\nSKU - see Impact.)\nAudit from PowerShell\n\
    (Get-AzStorageAccount -ResourceGroupName <resource-group> -Name <storageaccount>).Sku.Name\nCompliant if it returns Standard_GRS,\
    \ Standard_RAGRS, Standard_GZRS, or\nStandard_RAGZRS.\nAudit from Azure Policy\nIf referencing a digital copy of this\
