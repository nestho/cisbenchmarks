      az dataprotection backup-vault show --resource-group <resource-group> --

      vault-name <backup-vault>

      Ensur'
    severity: medium
- id: 3.1.6
  title: Ensure 'Cross Subscription Restore' is set to 'Disabled' or 'Permanently Disabled' on Backup vaults
  scoring: scored
  profile:
  - Level 1
  description: Disable cross subscription restore for Backup vaults to ensure that backup data can only be restored within
    the same subscription as the Backup vault, preventing restoration to targets in other subscriptions.
  rationale: Cross subscription restores increases security risks by widening access to sensitive backup data, potentially
    leading to accidental or intentional exposure, unauthorized access, or data exfiltration across environments.
  impact: Organizations may need to consider alternatives for disaster recovery scenarios, and if utilizing multiple subscriptions,
    may need to make adjustments or consider alternatives for data access. Costs could be incurred if alternative or additional
    backup infrastructure is required to account for the disabling of cross subscription restore.
  references:
  - 1. https://learn.microsoft.com/en-us/cli/azure/dataprotection/backup-vault
  - 2. https://learn.microsoft.com/en-us/powershell/module/az.dataprotection/getazdataprotectionbackupvault
  page_start: 43
  audit_raw: 'Audit from Azure Portal

    1. Go to Backup vaults.

    2. Click the name of a Backup vault.

    3. Under Manage, click Properties.

    4. Under Vault Settings, ensure that Cross Subscription Restore is set to

    Disabled or Permanently Disabled.

    5. Repeat steps 1-4 for each Backup vault.

    Audit from Azure CLI

    Run the following command to list Backup vaults:

    az dataprotection backup-vault list

    For each Backup vault, run the following command:

    az dataprotection backup-vault show --resource-group <resource-group> --

