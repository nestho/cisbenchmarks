    -VaultName <backup-vault>

    Run the following command to get the cross subscription restore setting for the Backup

    vault:

    $vault.CrossSubscriptionRestoreState

    Ensure that the command returns Disabled or PermanentlyDisabled.

    Repeat for each Backup vault.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 4d479a11-f2b5-4f0a-bb1e-d2332aa95cda - Name: ''[Preview]: Disable

    Cross Subscription Restore for Backup Vaults'''
  remediation: 'Remediate from Azure Portal

    1. Go to Backup vaults.

    2. Click the name of a Backup vault.

    3. Under Manage, click Properties.

    4. Under Vault Settings, next to Cross Subscription Restore, click Update.

    5. Select the radio button next to Disable Cross Subscription Restore or

    Permanently disable Cross Subscription Restore on this vault.

    6. If selecting to permanently disable cross subscription restore, check the box next

    to Are you sure you want to permanently disable Cross Subscription

    Restore? Once disabled, it cannot be re-enabled.

    7. Click Update.

    8. Repeat steps 1-7 for each Backup vault requiring remediation.

    Remediate from Azure CLI

    For each Backup vault requiring remediation, run the following command to disable

    cross subscription restore:

    az dataprotection backup-vault update --resource-group <resource-group> --

    vault-name <backup-vault> --cross-subscription-restore-state Disabled

    Note: Use --cross-subscription-restore-state PermanentlyDisabled with the

    above command to permanently disable cross subscription restore.

    Remediate from PowerShell

    For each Backup vault requiring remediation, run the following command to disable

    cross subscription restore:

    Update-AzDataProtectionBackupVault -ResourceGroupName <resource-group> -

    VaultName <backup-vault> -CrossSubscriptionRestoreState Disabled

    Note: Use -CrossSubscriptionRestoreState PermanentlyDisabled with the

    above command to permanently disable cross subscription restore.'
