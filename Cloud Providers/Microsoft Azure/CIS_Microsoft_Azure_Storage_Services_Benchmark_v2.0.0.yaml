- id: 7.1.5
  title: Ensure private endpoints are configured for File Shares (Microsoft.FileShares)
  scoring: scored
  profile:
  - Level 2
  description: 'Note: This recommendation applies to NFS file shares created with the Microsoft.FileShares provider. A private
    endpoint gives the file share a private, static IP address inside a virtual network, so client traffic reaches the share
    over the Microsoft backbone and peered virtual networks instead of the public internet. With Microsoft.FileShares, the
    private endpoint is created at the file-share level (sub-resource FileShare), and each share has its own private endpoint.'
  rationale: Accessing an NFS file share through a private endpoint keeps traffic off the public internet and confines it
    to approved virtual networks, removing exposure of the share's public endpoint and reducing the risk of interception or
    unauthorized network access. Private endpoints are also the prerequisite for disabling public endpoint access entirely
    (a follow-on control).
  impact: Configuring a private endpoint requires a virtual network and subnet, a private endpoint resource (with its network
    interface and a private IP address), and - for name resolution - integration with the privatelink.file.core.windows.net
    private DNS zone. Onpremises and cross-network clients require DNS forwarding to that zone. Private endpoints incur Private
    Link data-processing charges. Once public access is restricted or disabled, clients must reach the share through the private
    endpoint.
  references:
  - 1. https://learn.microsoft.com/azure/storage/files/storage-files-networking-endpoints
  - 2. https://learn.microsoft.com/azure/storage/files/storage-files-networking-overview
  page_start: 97
  audit_raw: 'Audit from Azure Portal

    1. In the Azure portal, search for and select File shares.

    2. Select the NFS file share to audit.

    3. Under the share''s Settings, select Networking, then Private endpoint

    connections.

    4. Confirm at least one private endpoint connection exists in an Approved state. If

    none exist, the file share is non-compliant.

    5. Repeat for each Microsoft.FileShares NFS file share.

    Audit from Azure CLI

    If the file share extension is not installed, add it:

    az extension add --name fileshare

    For each file share, run the following command:

    az fileshare private-endpoint-connection list --resource-group <resourcegroup> --resource-name <file-share-name>

    A compliant share returns at least one connection in an Approved state. A share with no

    private endpoint connections is non-compliant.

    Audit from PowerShell

    If the Az.FileShare module is not installed, install it:

    Install-Module -Name Az.FileShare -Repository PSGallery

    For each file share, run the following command:

    Get-AzFileShare -ResourceGroupName <resource-group> -ResourceName <fileshare-name> | Select-Object -ExpandProperty PrivateEndpointConnection

    A compliant share returns at least one private endpoint connection in an Approved

    state. No connections is non-compliant.'
  remediation: 'Remediate from Azure Portal

    1. In the Azure portal, search for and select File shares.

    2. Select the NFS file share to remediate.

    3. Under the share''s Settings, select Networking, then select + Create private

    endpoint.

    4. Choose the target sub-resource FileShare, select the virtual network and

    subnet, and enable Private DNS Integration

    (privatelink.file.core.windows.net).

    5. Select Add, then complete the wizard with Review + create and Create.

    6. Repeat for each file share requiring remediation.

    Remediate from Azure CLI

    If the file share extension is not installed, add it:

    az extension add --name fileshare

    For each file share requiring remediation, create a private endpoint targeting the share

    (group ID FileShare):

    az network private-endpoint create --resource-group <resource-group> --name

    <private-endpoint-name> --vnet-name <vnet-name> --subnet <subnet-name> --

    private-connection-resource-id <file-share-resource-id> --group-id FileShare

    --connection-name <connection-name>

    Then integrate the privatelink.file.core.windows.net private DNS zone and add

    an A record for the share''s host-name prefix.

    Remediate from PowerShell

    If the Az.FileShare module is not installed, install it:

    Install-Module -Name Az.FileShare -Repository PSGallery

    For each file share requiring remediation, run:

    $connection = New-AzPrivateLinkServiceConnection -Name <connection-name> -

    PrivateLinkServiceId <file-share-resource-id> -GroupId FileShare

    New-AzPrivateEndpoint -Name <private-endpoint-name> -ResourceGroupName

    <resource-group> -Location <region> -Subnet <subnet-object> -

    PrivateLinkServiceConnection $connection

    Then configure the privatelink.file.core.windows.net private DNS zone and A

    record.'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. In the Azure portal, search for and select File shares.

      2. Select the NFS file share to audit.

      3. Under the share''s Settings, select Networking, then Private endpoint

      connections.

      4. Confirm at least one private endpoint connection exists in an Approved state. If

      none exist, the file share is non-compliant.

      5. Repeat for each Microsoft.FileShares NFS file share.

      Audit from Azure CLI

      If the file share extension is not installed, add it:

      az extension add --name fileshare'
    severity: medium
- id: 7.2.1
  title: Ensure soft delete for Azure File Shares is Enabled (Classic File Shares)
  scoring: scored
  profile:
  - Level 1
  description: 'Note: This recommendation applies to Classic File Shares (Azure file shares hosted in a storage account, the
    Microsoft.Storage provider). Azure Files offers soft delete for file shares, allowing you to recover a file share that
    is mistakenly deleted by an application or another storage account user. Soft delete is configured at the storage account
    level, so the setting applies to all file shares in the account. When a file share is deleted, it is retained in a soft-deleted
    state for the configured retention period before being permanently purged; during this period the share and its snapshots
    can be restored.'
  rationale: Important data could be accidentally deleted or removed by a malicious actor. With soft delete enabled, the data
    is retained for the defined retention period before permanent deletion, allowing for recovery of the data. Lower values
    for the number of rention days weakens the control because there are less days to detect issue and initiate a restore.
    The default of 7 is the lowest recommended value.
  impact: When a file share is soft-deleted, the used portion of the storage is charged for the indicated soft-deleted period.
    All other meters are not charged unless the share is restored. Longer retention periods may increase costs associated
    with the storage account.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/files/storage-files-enable-softdelete
  - 2. https://learn.microsoft.com/en-us/cli/azure/storage/account/file-service-properties
  page_start: 102
  audit_raw: 'Soft delete for file shares is a storage account-level setting; verify it on each storage

    account that hosts classic file shares.

    Audit from Azure Portal

    1. Go to Storage accounts.

    2. For each storage account, under Data storage, select Classic file shares.

    3. Locate the Soft delete setting. A compliant storage account shows Soft

    delete for all file shares set to Enabled with a retention period between

    7 and 365 days; if it is Disabled or Enabled with a retention period less than 7

    days, the storage account is non-compliant.

    Audit from Azure CLI

    Run the following command to list storage accounts:

    az storage account list

    For each storage account, run the following command:

    az storage account file-service-properties show --resource-group <resourcegroup> --account-name <storage-account>

    A compliant result shows shareDeleteRetentionPolicy.enabled set to true with

    days between 7 and 365, inclusive. If enabled is false, or if enabled is true but days

    is less than 7, the storage account is non-compliant.

    Audit from PowerShell

    Run the following command to list storage accounts:

    Get-AzStorageAccount -ResourceGroupName <resource-group>

    For each storage account, run the following command:

    Get-AzStorageFileServiceProperty -ResourceGroupName <resource-group> -

    AccountName <storage-account>

    A compliant result shows ShareDeleteRetentionPolicy.Enabled set to True with

    ShareDeleteRetentionPolicy.Days between 7 and 365, inclusive. If Enabled is

    False, or if Enabled is True but Days is less than 7, the storage account is noncompliant.'
  remediation: 'Remediate from Azure Portal

    1. Go to Storage Accounts.

    2. For each storage account with file shares, under Data storage, click File

    shares.

    3. Under File share settings, click the value next to Soft delete.

    4. Under Soft delete for all file shares, click the toggle to set it to

    Enabled.

    5. Under Retention policies, set an appropriate number of days to retain soft

    deleted data between 7 and 365, inclusive.

    6. Click Save.

    Remediate from Azure CLI

    For each storage account requiring remediation, run the following command to enable

    soft delete for file shares and set an appropriate number of days for deleted data to be

    retained, between 7 and 365, inclusive:

    az storage account file-service-properties update --account-name <storageaccount> --enable-delete-retention true --delete-retention-days
    <retentiondays>

    Remediate from PowerShell

    For each storage account requiring remediation, run the following command to enable

    soft delete for file shares and set an appropriate number of days for deleted data to be

    retained, between 7 and 365, inclusive:

    Update-AzStorageFileServiceProperty -ResourceGroupName <resource-group> -

    AccountName <storage-account> -EnableShareDeleteRetentionPolicy $true -

    ShareRetentionDays <retention-days>'
  checks:
  - type: manual_review
    info: 'Soft delete for file shares is a storage account-level setting; verify it on each storage

      account that hosts classic file shares.

      Audit from Azure Portal

      1. Go to Storage accounts.

      2. For each storage account, under Data storage, select Classic file shares.

      3. Locate the Soft delete setting. A compliant storage account shows Soft

      delete for all file shares set to Enabled with a retention period between

      7 and 365 days; if it is Disabled or Enabled with a retention period less than 7

      days, the sto'
