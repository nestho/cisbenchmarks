controls:
- id: 3.1.1
  title: Ensure soft delete on Backup vaults is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Soft delete provides additional protection for Backup vault data. With soft delete enabled, deleted backup
    data can be recovered within the retention period.
  rationale: Important backup data could be accidentally deleted or removed by a malicious actor. With soft delete enabled,
    data is retained for at least 14 days before permanent deletion, allowing for the recovery of the backup data.
  impact: There is no additional cost for backup data in the soft delete state for up to and including 14 days. However, retention
    beyond 14 days may incur additional charges.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/backup/backup-vault-overview
  - 2. https://learn.microsoft.com/en-us/azure/backup/backup-azure-enhanced-softdelete-about
  page_start: 27
  audit_raw: 'Audit from Azure Portal

    1. Go to Backup vaults.

    2. Click the name of a Backup vault.

    3. Under Manage, click Properties.

    4. Ensure Soft delete is set to Enabled or Enabled with Always-On.

    5. Next to Soft delete, click Update.

    6. Ensure that the Retention period is set to an appropriate value between 14

    and 180, inclusive.

    7. Repeat steps 1-6 for each Backup vault.

    Audit from Azure CLI

    Run the following command to list Backup vaults:

    az dataprotection backup-vault list

    For each Backup vault, run the following command:

    az dataprotection backup-vault show --resource-group <resource-group> --

    vault-name <backup-vault>

    Ensure that under softDeleteSettings, state is set to on or alwayson, and

    retentionDurationInDays is set to an appropriate value between 14 and 180,

    inclusive.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 9798d31d-6028-4dee-8643-46102185c016 - Name: ''[Preview]: Soft

    delete should be enabled for Backup Vaults'''
  remediation: 'Remediate from Azure Portal

    1. Go to Backup vaults.

    2. Click the name of a Backup vault.

    3. Under Manage, click Properties.

    4. Next to Soft delete, click Update.

    5. Check the box next to Soft delete.

    6. In the box next to Retention period, set an appropriate number of days for

    deleted data to be retained, between 14 and 180, inclusive.

    7. If it is appropriate for your organization, check the box next to Enable alwayson soft delete. Note: Once enabled,
    this setting cannot be disabled.

    8. Click Update.

    9. Repeat steps 1-8 for each Backup vault requiring remediation.

    Remediate from Azure CLI

    Run the following command to list Backup vaults:

    az dataprotection backup-vault list

    For each Backup vault requiring remediation, run the following command to enable soft

    delete and set an appropriate number of days for deleted data to be retained, between

    14 and 180, inclusive:

    az dataprotection backup-vault update --resource-group <resource-group> --

    vault-name <backup-vault> --soft-delete-state On --retention-duration-in-days

    <retention-duration>

    Note: To enable always-on soft delete, the above command can be executed with --

    soft-delete-state AlwaysOn. Once enabled, this setting cannot be disabled.'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Backup vaults.

      2. Click the name of a Backup vault.

      3. Under Manage, click Properties.

      4. Ensure Soft delete is set to Enabled or Enabled with Always-On.

      5. Next to Soft delete, click Update.

      6. Ensure that the Retention period is set to an appropriate value between 14

      and 180, inclusive.

      7. Repeat steps 1-6 for each Backup vault.

      Audit from Azure CLI

      Run the following command to list Backup vaults:

      az dataprotection backup-vault list

      For each Backup vault, run t'
    severity: medium
- id: 3.1.2
  title: Ensure immutability for Backup vaults is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Immutable vaults safeguard backup data by preventing any operations that could result in the loss of recovery
    points. The immutable vault setting can be locked, making it irreversible and preventing malicious actors from disabling
    it and deleting backups.
  rationale: Enabling the immutable vault ensures that backup data is protected from unauthorized or accidental deletion.
    By locking the setting and making it irreversible, malicious actors are prevented from disabling the setting and deleting
    backups.
  impact: There is no additional cost for enabling vault immutability; however, a vault with locked immutability cannot be
    deleted without contacting Azure support and will incur the standard vault costs.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/backup/backup-azure-immutable-vaultconcept?tabs=backup-vault
  - 2. https://learn.microsoft.com/en-us/azure/backup/backup-azure-immutable-vaulthow-to-manage?tabs=backup-vault
  page_start: 30
  audit_raw: 'Audit from Azure Portal

    1. Go to Backup vaults.

    2. From the list of vaults, ensure that the value in the Immutability column for

    each vault is Not locked or Locked.

    Audit from Azure CLI

    Run the following command to list Backup vaults:

    az dataprotection backup-vault list

    For each Backup vault, run the following command:

    az dataprotection backup-vault show --resource-group <resource-group> --

    vault-name <backup-vault>

    Ensure that under immutabilitySettings, state is set to Unlocked or Locked.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 2514263b-bc0d-4b06-ac3e-f262c0979018 - Name: ''[Preview]:

    Immutability must be enabled for backup vaults'''
  remediation: 'Remediate from Azure Portal

    1. Go to Backup vaults.

    2. Click the name of a Backup vault.

    3. Under Manage, click Properties.

    4. Under the Immutable vault setting value, click Settings.

    5. Check the box under Enable vault immutability. Note: It is not possible to

    lock immutability until immutability has been enabled.

    6. Click Apply.

    7. If it is appropriate for your organization to lock immutability, under the Immutable

    vault setting value, click Settings.

    8. Click the toggle under Lock immutability for this vault to set it to

    Locked.

    9. Check the box next to Confirm locking immutability.

    10. Click Apply.

    11. Repeat steps 1-10 for each Backup vault requiring remediation.

    Remediate from Azure CLI

    Run the following command to list Backup vaults:

    az dataprotection backup-vault list

    For each Backup vault requiring remediation, run the following command to enable vault

    immutability:

    az dataprotection backup-vault update --resource-group <resource-group> --

    vault-name <backup-vault> --immutability-state Unlocked

    Note: To lock the Backup vault immutability state, the above command can be executed

    with --immutability-state Locked. Once enabled, this setting cannot be disabled

    and it will not be possible to delete the vault.'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Backup vaults.

      2. From the list of vaults, ensure that the value in the Immutability column for

      each vault is Not locked or Locked.

      Audit from Azure CLI

      Run the following command to list Backup vaults:

      az dataprotection backup-vault list

      For each Backup vault, run the following command:

      az dataprotection backup-vault show --resource-group <resource-group> --

      vault-name <backup-vault>

      Ensure that under immutabilitySettings, state is set to Unlocked or Locked.

      Audi'
    severity: medium
- id: 3.1.3
  title: Ensure backup data in Backup vaults is encrypted using customer-managed keys (CMK)
  scoring: scored
  profile:
  - Level 2
  description: 'Backup vaults offer two encryption options: Microsoft-managed keys, which provide automatic encryption without
    user intervention, and customer-managed keys (CMK), which allow organizations to retain full control over their encryption
    keys for enhanced security and compliance.'
  rationale: Using customer-managed keys (CMKs) to encrypt Backup vaults enhances security by granting organizations complete
    control over their encryption keys.
  impact: There are costs and configuration overhead associated with setting up and managing customer-managed keys.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/backup/encryption-at-rest-with-cmk-forbackup-vault
  - 2. https://learn.microsoft.com/en-us/cli/azure/dataprotection/backup-vault
  page_start: 33
  audit_raw: 'Audit from Azure Portal

    1. Go to Backup vaults.

    2. Click the name of a Backup vault.

    3. Under Manage, click Properties.

    4. Ensure Encryption Settings is set to Using ''Customer-managed keys''.

    5. Repeat steps 1-4 for each Backup vault.

    Audit from Azure CLI

    Run the following command to list Backup vaults:

    az dataprotection backup-vault list

    For each Backup vault, run the following command:

    az dataprotection backup-vault show --resource-group <resource-group> --

    vault-name <backup-vault>

    Ensure that under properties > securitySettings > encryptionSettings >

    keyVaultProperties, a key keyUri exists with the value set to a customer-managed

    key URI.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: d6588149-9f06-462c-a076-56aece45b5ba - Name: ''[Preview]: Azure

    Backup Vaults should use customer-managed keys for encrypting backup data.

    Also an option to enforce Infra Encryption.'''
  remediation: 'Note: Once encryption is configured to use a customer-managed key, this setting

    cannot be reversed.

    Remediate from Azure Portal

    1. Go to Backup vaults.

    2. Click the name of a Backup vault.

    3. Under Manage, click Properties.

    4. Under Using ''Microsoft-managed keys'', click Update.

    5. Check the box next to Use your own key.

    6. Under Encryption key, click the radio button next to Enter key URI to provide

    a known key URI, or click the radio button next to Select from Key Vault to

    select a key from a Key Vault.

    7. If entering a key URI, provide the key URI in the text box under Key URI.

    8. If selecting a key from a Key Vault, click select key from Key Vault.

    1. Select Key vault or Managed HSM.

    2. Select a key vault or managed HSM.

    3. Select a key.

    4. Click Select.

    9. Select a managed identity to use for the encryption key.

    10. Click Update.

    11. Repeat steps 1-10 for each Backup vault.

    Remediate from Azure CLI

    For each Backup vault requiring remediation, run the following command to assign a

    customer-managed encryption key:

    az dataprotection backup-vault update --resource-group <resource-group> --

    vault-name <backup-vault> --cmk-encryption-key-uri <cmk-uri> --cmkencryption-state "Enabled" --cmk-identity-type "SystemAssigned"

    Note: Use --cmk-identity-type "UserAssigned" --cmk-user-assignedidentity-id <user-assigned-identity-id> with the above
    command to provide a

    UserAssigned Identity Id.'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Backup vaults.

      2. Click the name of a Backup vault.

      3. Under Manage, click Properties.

      4. Ensure Encryption Settings is set to Using ''Customer-managed keys''.

      5. Repeat steps 1-4 for each Backup vault.

      Audit from Azure CLI

      Run the following command to list Backup vaults:

      az dataprotection backup-vault list

      For each Backup vault, run the following command:

      az dataprotection backup-vault show --resource-group <resource-group> --

      vault-name <backup-vault>

      Ensure that'
    severity: medium
- id: 3.1.4
  title: Ensure 'Use infrastructure encryption for this vault' is enabled on Backup vaults
  scoring: scored
  profile:
  - Level 2
  description: In addition to using customer-managed keys for encryption at rest in the Backup vault, you can enable an additional
    layer of platform-managed infrastructure encryption. This dual-layer approach enhances the protection of your backup data.
  rationale: Enabling infrastructure encryption on a Backup vault adds a second layer of protection to backup data, enhancing
    security and ensuring compliance for sensitive data storage. This dual-layer strategy reduces the risk of unauthorized
    access by keeping data encrypted even if one layer is compromised.
  impact: Enabling infrastructure encryption on a backup vault does not incur additional costs; however, infrastructure encryption
    must be configured when creating the vault and requires customer-managed keys for encryption at rest. This recommendation
    is linked to Ensure backup data in Backup vaults is encrypted using customermanaged keys (CMK) and should be applied alongside
    it if you choose to implement this recommendation.
  references:
  - 1. https://learn.microsoft.com/en-us/cli/azure/dataprotection/backup-vault
  - 2. https://learn.microsoft.com/en-us/powershell/module/az.dataprotection/getazdataprotectionbackupvault
  page_start: 36
  audit_raw: 'Audit from Azure Portal

    1. Go to Backup vaults.

    2. Click the name of a Backup vault.

    3. Under Manage, click Properties.

    4. Under Encryption Settings, click Update.

    5. Under Infrastructure encryption, ensure the box next to Use

    infrastructure encryption for this vault is checked.

    6. Repeat steps 1-5 for each Backup vault.

    Audit from Azure CLI

    Run the following command to list Backup vaults:

    az dataprotection backup-vault list

    For each Backup vault, run the following command:

    az dataprotection backup-vault show --resource-group <resource-group> --

    vault-name <backup-vault>

    Ensure that under properties > securitySettings > encryptionSettings,

    infrastructureEncryption is set to Enabled.

    Audit from PowerShell

    Run the following command to list Backup vaults:

    Get-AzDataProtectionBackupVault

    Run the following command to get the Backup vault in a resource group with a given

    name:

    $vault = Get-AzDataProtectionBackupVault -ResourceGroupName <resource-group>

    -VaultName <backup-vault>

    Run the following command to get the infrastructure encryption setting for the Backup

    vault:

    $vault.EncryptionSetting.CmkInfrastructureEncryption

    Ensure that the command returns Enabled.

    Repeat for each Backup vault.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: d6588149-9f06-462c-a076-56aece45b5ba - Name: ''[Preview]: Azure

    Backup Vaults should use customer-managed keys for encrypting backup data.

    Also an option to enforce Infra Encryption.'''
  remediation: "Remediate from Azure CLI\nRun the following command to create a locally redundant Backup vault with a customermanaged\
    \ encryption key and infrastructure encryption enabled:\naz dataprotection backup-vault create --resource-group <resource-group>\
    \ --\nvault-name <backup-vault> --location <location> --storage-setting\n\"[{type:'LocallyRedundant',datastore-type:'VaultStore'}]\"\
    \ --type\n\"UserAssigned\" --user-assigned-identities '{\"<user-assigned-identityid>\":{}}' --cmk-encryption-key-uri <cmk-uri>\
    \ --cmk-encryption-state Enabled -\n-cmk-identity-type \"UserAssigned\" --cmk-user-assigned-identity-id <cmk-userassigned-identity-id>\
    \ --cmk-infrastructure-encryption Enabled\nRemediate from PowerShell\nRun the following commands to create a locally redundant\
    \ Backup vault with a\ncustomer-managed encryption key and infrastructure encryption enabled:\n$sub = \"<subscription-id>\"\
    \n$storagesetting = New-AzDataProtectionBackupVaultStorageSettingObject -\nDataStoreType VaultStore -Type LocallyRedundant\n\
    $userAssignedIdentity = @{\n \"<user-assigned-identity-id>\" = @{\n clientId = \"<user-assigned-identity-client-id>\"\n\
    \ principalId = \"<user-assigned-identity-principal-id>\"\n }\n}\n$cmkIdentityId = \"<cmk-user-assigned-identity-id>\"\
    \n$cmkKeyUri = \"<cmk-uri>\"\nNew-AzDataProtectionBackupVault -SubscriptionId $sub -ResourceGroupName\n<resource-group>\
    \ -VaultName <backup-vault> -Location <location> -\nStorageSetting $storagesetting -IdentityType UserAssigned -\nUserAssignedIdentity\
    \ $userAssignedIdentity -CmkEncryptionState Enabled -\nCmkIdentityType UserAssigned -CmkUserAssignedIdentityId $cmkIdentityId\
    \ -\nCmkEncryptionKeyUri $cmkKeyUri -CmkInfrastructureEncryption Enabled"
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Backup vaults.

      2. Click the name of a Backup vault.

      3. Under Manage, click Properties.

      4. Under Encryption Settings, click Update.

      5. Under Infrastructure encryption, ensure the box next to Use

      infrastructure encryption for this vault is checked.

      6. Repeat steps 1-5 for each Backup vault.

      Audit from Azure CLI

      Run the following command to list Backup vaults:

      az dataprotection backup-vault list

      For each Backup vault, run the following command:

      az dataprotection bac'
    severity: medium
- id: 3.1.5
  title: Ensure 'Cross Region Restore' is set to 'Enabled' on Backup vaults
  scoring: scored
  profile:
  - Level 2
  description: Cross region restore enables data restoration in a secondary Azure paired region, even when the primary region
    is fully operational. This allows organizations to conduct drills and validate regional resiliency, thereby ensuring preparedness
    for potential outages.
  rationale: Enabling cross region restore facilitates proactive resilience testing and disaster recovery planning by allowing
    data restoration drills in a secondary region without needing a primary region outage. This capability helps organizations
    validate recovery processes, identify gaps in regional failover, and ensures critical data can be accessed and restored
    during real disruptions.
  impact: Enabling cross region restore on a Backup vault incurs additional costs, and once it is enabled, it cannot be disabled.
    • Cross region restore is an irreversible storage property. • Cross region restore is currently supported for limited
    workloads. • Cross region restore can only be enabled if the redundancy of the vault is GRS.
  references:
  - 1. https://learn.microsoft.com/en-gb/azure/backup/backup-vault-overview#crossregion-restore-support-for-postgresql-using-azure-backup
  - 2. https://learn.microsoft.com/en-us/azure/backup/tutorial-cross-region-restore
  page_start: 40
  audit_raw: 'Audit from Azure Portal

    1. Go to Backup vaults.

    2. Click the name of a Backup vault.

    3. Under Manage, click Properties.

    4. Under Vault Settings, ensure that Cross Region Restore is set to Enabled.

    5. Repeat steps 1-4 for each Backup vault.

    Audit from Azure CLI

    Run the following command to list Backup vaults:

    az dataprotection backup-vault list

    For each Backup vault, run the following command:

    az dataprotection backup-vault show --resource-group <resource-group> --

    vault-name <backup-vault>

    Ensure that under properties > featureSettings > crossRegionRestoreSettings,

    state is set to Enabled.

    Audit from PowerShell

    Run the following command to list Backup vaults:

    Get-AzDataProtectionBackupVault

    Run the following command to get the Backup vault in a resource group with a given

    name:

    $vault = Get-AzDataProtectionBackupVault -ResourceGroupName <resource-group>

    -VaultName <backup-vault>

    Run the following command to get the cross region restore setting for the Backup vault:

    $vault.CrossRegionRestoreState

    Ensure that the command returns Enabled.

    Repeat for each Backup vault.'
  remediation: 'Remediate from Azure Portal

    1. Go to Backup vaults.

    2. Click the name of a Backup vault.

    3. Under Manage, click Properties.

    4. Under Vault Settings, next to Cross Region Restore, click Update.

    5. Click the toggle switch under Cross Region Restore to set it to Enable.

    6. Click Apply.

    7. Repeat steps 1-6 for each Backup vault requiring remediation.

    Remediate from Azure CLI

    For each Backup vault requiring remediation, run the following command to enable

    cross region restore:

    az dataprotection backup-vault update --resource-group <resource-group> --

    vault-name <backup-vault> --cross-region-restore-state Enabled

    Remediate from PowerShell

    For each Backup vault requiring remediation, run the following command to enable

    cross region restore:

    Update-AzDataProtectionBackupVault -ResourceGroupName <resource-group> -

    VaultName <backup-vault> -CrossRegionRestoreState Enabled'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Backup vaults.

      2. Click the name of a Backup vault.

      3. Under Manage, click Properties.

      4. Under Vault Settings, ensure that Cross Region Restore is set to Enabled.

