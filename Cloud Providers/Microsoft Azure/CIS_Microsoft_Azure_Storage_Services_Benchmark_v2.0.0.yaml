    • Policy ID: c349d81b-9985-44ae-a8da-ff98d108ede8

    • Name: ''Azure Data Box jobs should enable double encryption for data at rest on

    the device'''
  remediation: 'Remediate from Azure Portal

    When creating a new Azure Data Box order, on the Security page, under Double

    encryption, check the box next to Enable double encryption for the order.'
  checks:
