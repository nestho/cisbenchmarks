- id: 7.1.4
  title: Ensure 'Public Endpoint Access' is set to 'Disabled' for File Shares (Microsoft.FileShares)
  scoring: scored
  profile:
  - Level 2
  description: 'Note: This recommendation applies to NFS file shares created with the Microsoft.FileShares provider. Public
    Endpoint Access (Public Network Access) controls whether the file share is reachable from the public internet. Disabling
    it limits connectivity to private endpoints, reducing the share''s exposure.'
  rationale: A file share reachable over the public internet presents a larger attack surface and is exposed to unauthorized
    access attempts and network-based attacks. Disabling public network access and using private endpoints only ensures that
    only trusted networks can reach the share.
  impact: 'Note: Private endpoint infrastructure is required before Public Endpoint Access (Public Network Access) can be
    disabled. Clients on networks that are not explicitly allowed (no private endpoint and not in a permitted subnet) will
    lose connectivity to the share. Confirm that every legitimate client reaches the share over an allowed subnet or a private
    endpoint before disabling public network access.'
  references:
  - 1. https://learn.microsoft.com/azure/storage/files/files-nfs-protocol
  - 2. https://learn.microsoft.com/azure/storage/files/storage-files-networking-overview
  page_start: 94
  audit_raw: 'Audit from Azure Portal

    1. In the Azure portal, search for and select File shares.

    2. Select the NFS file share to audit.

    3. Under the share''s Settings, select Networking.

    4. Confirm that Public endpoint access is Disabled. If it is Enabled, the file

    share is non-compliant.

    5. Repeat for each Microsoft.FileShares NFS file share.

    Audit from Azure CLI

    If the file share extension is not installed, add it:

    az extension add --name fileshare

    For each file share, run the following command:

