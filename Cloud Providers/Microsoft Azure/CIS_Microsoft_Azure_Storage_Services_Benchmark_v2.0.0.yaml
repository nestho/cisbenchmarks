- id: 3.2.4
  title: Ensure 'Use infrastructure encryption for this vault' is enabled on Recovery Services vaults
  scoring: scored
  profile:
  - Level 2
  description: In addition to using customer-managed keys for encryption at rest in the Recovery Services vault, you can enable
    an additional layer of platform-managed infrastructure encryption. This dual-layer approach enhances the protection of
    your backup data.
  rationale: Enabling infrastructure encryption on an Azure Recovery Services vault adds a second layer of protection to backup
    data, enhancing security and ensuring compliance for sensitive data storage. This dual-layer strategy reduces the risk
    of unauthorized access by keeping data encrypted even if one layer is compromised.
  impact: Enabling infrastructure encryption on an Azure Recovery Services vault does not incur additional costs; however
    infrastructure encryption must be set when configuring the encryption of the vault for the first time and requires customer-managed
    keys for encryption at rest. Once configured, the infrastructure encryption setting cannot be changed. This recommendation
    is linked to Ensure that backup data in Recovery Services vaults is encrypted using customer-managed keys (CMK) and should
    be applied alongside it if you choose to implement this recommendation.
