- id: '16.8'
  title: Ensure storage logging is Enabled for Queue Service for 'Read', 'Write', and 'Delete' requests
  scoring: scored
  profile:
  - Level 2
  description: 'The Storage Queue service stores messages that may be read by any client who has access to the storage account.
    A queue can contain an unlimited number of messages, each of which can be up to 64KB in size using version 2011-08-18
    or newer. Storage Logging happens server-side and allows details for both successful and failed requests to be recorded
    in the storage account. These logs allow users to see the details of read, write, and delete operations against the queues.
    Storage Logging log entries contain the following information about individual requests: Timing information such as start
    time, end-to-end latency, and server latency, authentication details, concurrency information, and the sizes of the request
    and response messages.'
  rationale: Storage Analytics logs contain detailed information about successful and failed requests to a storage service.
    This information can be used to monitor individual requests and to diagnose issues with a storage service. Requests are
    logged on a best-effort basis. Storage Analytics logging is not enabled by default for your storage account.
  impact: Enabling this setting can have a high impact on the cost of the log analytics service and data storage used by logging
    more data per each request. Do not enable this without determining your need for this level of logging, and do not forget
    to check in on data usage and projected cost. Some users have seen their logging costs increase from $10 per month to
    $10,000 per month.
  references:
  - 1. https://docs.microsoft.com/en-us/rest/api/storageservices/about-storageanalytics-logging
  - 2. https://docs.microsoft.com/en-us/cli/azure/storage/logging?view=azure-cli-latest
  page_start: 212
  audit_raw: "Audit from Azure Portal\n1. Go to Storage accounts.\n2. For each storage account, under Monitoring, select Diagnostic\
    \ settings.\n3. Select the queue resource listed beneath the storage account.\n4. Confirm at least one diagnostic setting\
    \ has StorageRead, StorageWrite, and\nStorageDelete selected under Logs, routed to an appropriate destination (Log\nAnalytics\
    \ workspace, storage account, or event hub).\nAudit from Azure CLI\nThe Audit must check the same Azure Monitor diagnostic\
    \ settings the Portal configures.\nThe previously used classic Storage Analytics logging mechanism was retired in August\n\
    2023 and does not reflect diagnostic settings. For each storage account, list the\ndiagnostic settings on the queue service:\n\
    az monitor diagnostic-settings list \\\n --resource \"/subscriptions/<subscription-id>/resourceGroups/<resourcegroup>/providers/Microsoft.Storage/storageAccounts/<storageaccount>/queueServices/default\"\
    \nThe output should contain a setting whose logs array enables StorageRead,\nStorageWrite, and StorageDelete (enabled:\
    \ true). No diagnostic setting, or any of\nthe three categories disabled or absent, is non-compliant."
  remediation: "Remediate from Azure Portal\n1. Go to Storage accounts.\n2. For each storage account, under Monitoring, select\
    \ Diagnostic settings.\n3. Select the queue resource listed beneath the storage account.\n4. Select + Add diagnostic setting\
    \ (or Edit setting on an existing one).\n5. Check StorageRead, StorageWrite, and StorageDelete.\n6. Select an appropriate\
    \ destination and select Save.\nRemediate from Azure CLI\nCreate a diagnostic setting on the queue service enabling all\
    \ three log categories\n(example routes to a Log Analytics workspace):\naz monitor diagnostic-settings create \\\n --name\
    \ <diagnostic-setting-name> \\\n --resource \"/subscriptions/<subscription-id>/resourceGroups/<resourcegroup>/providers/Microsoft.Storage/storageAccounts/<storageaccount>/queueServices/default\"\
    \ \\\n --workspace <log-analytics-workspace-resource-id> \\\n --logs\n'[{\"category\":\"StorageRead\",\"enabled\":true},{\"\
    category\":\"StorageWrite\",\"enabl\ned\":true},{\"category\":\"StorageDelete\",\"enabled\":true}]'"
