- id: 7.2.4
  title: Ensure root squash for NFS file shares is configured (Classic File Shares)
  scoring: scored
  profile:
  - Level 1
  description: 'Note: This recommendation applies to Classic File Shares (Azure file shares hosted in a storage account, the
    Microsoft.Storage provider). Permissions for NFS file shares are enforced by the client OS rather than by the Azure Files
    service. Root squash is an administrative security feature in NFS that prevents unauthorized root-level access to the
    NFS server by client machines. This functionality is an important part of protecting user data and system settings from
    manipulation by untrusted or compromised clients.'
  rationale: Administrators should enable root squash in environments where multiple users or systems access the NFS share,
    especially in scenarios where client machines are not fully trusted. By converting root users to anonymous users, root
    squash ensures that even if a client machine is compromised, the attacker cannot exploit root privileges to access or
    modify critical files on the NFS server.
  impact: There is no additional cost associated with enabling root squash; however, there may be some minor administrative
    overhead involved in configuring and managing permissions with root squash enabled.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/files/nfs-root-squash
  - 2. https://learn.microsoft.com/en-us/cli/azure/storage/account
  page_start: 112
  audit_raw: 'Audit from Azure Portal

