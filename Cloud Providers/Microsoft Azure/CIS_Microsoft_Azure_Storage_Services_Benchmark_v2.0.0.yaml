- id: '14.1'
  title: Ensure 'Public network access' is set to 'Disabled' on Azure Elastic SAN
  scoring: scored
  profile:
  - Level 2
  description: Azure Elastic SAN is a scalable, high-performance cloud-based storage solution. Disabling public network access
    at the SAN level ensures that Elastic SAN resources are accessible only through private networks.
  rationale: Disabling public network access for Azure Elastic SAN at the SAN level enhances security by preventing unauthorized
    external access to sensitive storage resources.
  impact: 'NOTE: Prior to disabling public network access, it is strongly recommended that, for each Elastic SAN, either:
    • virtual network integration is completed OR • private endpoints/links are set up. Disabling public network access restricts
    access to the service. This enhances security but will require the configuration of a virtual network and/or private endpoints
    for any services or users needing access within trusted networks. While there is no direct cost associated with disabling
    public network access at the SAN level, private network configuration may incur additional costs.'
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/elastic-san/elastic-sannetworking
  - 2. https://learn.microsoft.com/en-us/cli/azure/elastic-san
  page_start: 145
  audit_raw: 'Audit from Azure Portal

    1. Go to Elastic SANs.

    2. Click the name of an Elastic SAN.

    3. Under Settings, click Networking.

    4. Ensure that Public network access is set to Disabled.

    5. Repeat steps 1-4 for each Elastic SAN.

    Audit from Azure CLI

    Run the following command to list Elastic SANs:

    az elastic-san list

    For each Elastic SAN, run the following command:

    az elastic-san show --resource-group <resource-group> --name <elastic-san>

    Ensure that publicNetworkAccess is set to Disabled.

    Audit from PowerShell

    Run the following command to list Elastic SANs:

    Get-AzElasticSan

    Run the following command to get the Elastic SAN in a resource group with a given

    name:

    $elasticsan = Get-AzElasticSan -ResourceGroupName <resource-group> -Name

    <elastic-san>

    Run the following command to get the public network access setting for the Elastic

    SAN:

    $elasticsan.PublicNetworkAccess

    Ensure that the command returns Disabled.'
  remediation: 'Remediate from Azure Portal

    1. Go to Elastic SANs.

    2. Click the name of an Elastic SAN.

    3. Under Settings, click Networking.

    4. Under Public network access, click the radio button next to Disabled.

    5. Click Apply.

    6. Repeat steps 1-5 for each Elastic SAN.

    Remediate from Azure CLI

    For each Elastic SAN requiring remediation, run the following command to disable

    public network access:

    az elastic-san update --resource-group <resource-group> --name <elastic-san>

    --public-network-access Disabled

    Remediate from PowerShell

    For each Elastic SAN requiring remediation, run the following command to disable

    public network access:

    Update-AzElasticSan -ResourceGroupName <resource-group> -Name <elastic-san> -

    PublicNetworkAccess Disabled'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Elastic SANs.

      2. Click the name of an Elastic SAN.

