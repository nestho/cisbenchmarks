    • Policy ID: 6edd7eda-6dd8-40f7-810d-67160c639cd9 - Name: ''Storage accounts

    should use private link'''
  remediation: "Remediate from Azure Portal\n1. Open the Storage Accounts blade.\n2. Select the Storage Account to remediate.\n\
    3. Under Security + networking, click Networking.\n4. Select the Private endpoint connections tab at the top of the networking\n\
    window.\n5. Click + Private endpoint.\n6. On the Basics tab, enter a name easily recognizable as associated with the\n\
    Storage Account, confirm the Region matches the Storage Account, then click\nNext. (Note: the Network Interface Name is\
    \ completed automatically and can\nbe customized if needed.)\n7. On the Resource tab, select the target sub-resource for\
    \ the storage service\nbeing exposed (for example blob, file, queue, or table), then click Next.\n8. On the Virtual Network\
    \ tab, select the Virtual network and Subnet the\nStorage Account will be reached through, adjust any other network settings\
    \ as\nappropriate, then click Next.\n9. On the DNS tab, adjust DNS settings as appropriate for your environment, then\n\
    click Next.\n10. On the Tags tab, set any tags relevant to your organization, then click Next.\n11. On the Review + create\
    \ tab, wait for Validation Passed, then click Create\nand allow a few minutes for deployment. If validation fails, correct\
    \ the flagged\nsettings before retrying.\n12. Repeat for each Private Endpoint required, and for each Storage Account.\n\
    Remediate from PowerShell\n$storageAccount = Get-AzStorageAccount -ResourceGroupName\n'<ResourceGroupName>' -Name '<storageaccountname>'\n\
    $privateEndpointConnection = @{\n Name = 'connectionName'\n PrivateLinkServiceId = $storageAccount.Id\n GroupID =\n\"\
    blob|blob_secondary|file|file_secondary|table|table_secondary|queue|queue_se\ncondary|web|web_secondary|dfs|dfs_secondary\"\
    \n}\n$privateLinkServiceConnection = New-AzPrivateLinkServiceConnection\n@privateEndpointConnection\n$virtualNetDetails\
