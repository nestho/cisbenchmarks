- id: '16.14'
  title: Ensure Azure Resource Manager Delete locks are applied to Azure Storage Accounts
  scoring: manual
  profile:
  - Level 1
  description: Azure Resource Manager CannotDelete (Delete) locks prevent users from accidentally or maliciously deleting
    a storage account. With a Delete lock in place the account remains modifiable and usable, but deleting the account resource
    first requires a user with the appropriate permissions to remove the lock. A Delete lock protects the account resource
    itself; it does not protect the blob, queue, table, or file data inside the account - data-plane deletions performed with
    account keys, SAS, or RBAC still succeed.
  rationale: Applying a Delete lock prevents accidental or unauthorized deletion of the entire storage account resource -
    a fundamental protective control against loss of the account. The lock guards the account resource, not the data within
    it.
  impact: '• Prevents deletion of the storage account resource, and of the parent resource group that contains it, until the
    lock is removed. • Does not prevent other control-plane operations (configuration, network settings, container management,
    access changes) or deletion of containers and objects within the account. • Is a guardrail, not a hard barrier: any principal
    with Microsoft.Authorization/locks permissions (for example, Owner) can remove the lock and then delete. • A lock scoped
    at the resource group or subscription is inherited by child resources and can have side effects (blocking role-assignment
    deletion, Resource Manager deployment-history cleanup at the 800-entry limit, and Azure Backup restore-point cleanup)
    - prefer account-level scope.'
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/common/lock-account-resource
  - 2. https://learn.microsoft.com/en-us/azure/azure-resourcemanager/management/lock-resources
  page_start: 230
  audit_raw: "Audit from Azure Portal\n1. Navigate to the storage account in the Azure Portal.\n2. Under Settings, select\
    \ Locks.\n3. Confirm a Delete lock exists on the storage account.\nAudit from Azure CLI\naz lock list \\\n --resource-group\
    \ <resource-group> \\\n --resource-name <storage-account> \\\n --resource-type \"Microsoft.Storage/storageAccounts\"\n\
    The output should list a lock with \"level\": \"CanNotDelete\"; the absence of such a\nlock is non-compliant.\nAudit from\
    \ PowerShell\nGet-AzResourceLock -ResourceGroupName <resource-group> -ResourceName\n<storage-account> -ResourceType \"\
    Microsoft.Storage/storageAccounts\"\nA lock whose Properties.level is CanNotDelete should be returned.\nNote: there is\
    \ no built-in Azure Policy that audits resource locks on storage accounts; a\ncustom or community policy can check for\
    \ a Microsoft.Authorization/locks\nresource with an AuditIfNotExists effect."
  remediation: "Remediate from Azure Portal\n1. Navigate to the storage account in the Azure portal.\n2. Under the Settings\
    \ section, select Locks.\n3. Select Add.\n4. Provide a Name, and choose Delete for the type of lock.\n5. Add a note about\
    \ the lock if desired.\nRemediate from Azure CLI\nReplace the information within <> with appropriate values:\naz lock\
    \ create --name <lock> \\\n --resource-group <resource-group> \\\n --resource <storage-account> \\\n --lock-type CanNotDelete\
    \ \\\n --resource-type Microsoft.Storage/storageAccounts\nRemediate from PowerShell\nReplace the information within <>\
    \ with appropriate values:\nNew-AzResourceLock -LockLevel CanNotDelete `\n -LockName <lock> `\n -ResourceName <storage-account>\
    \ `\n -ResourceType Microsoft.Storage/storageAccounts `\n -ResourceGroupName <resource-group>"
  checks:
  - type: manual_review
    info: "Audit from Azure Portal\n1. Navigate to the storage account in the Azure Portal.\n2. Under Settings, select Locks.\n\
