- id: '16.7'
  title: Ensure Soft Delete is Enabled for Azure Containers and Blob Storage
  scoring: scored
  profile:
  - Level 1
  description: The Azure Storage blobs contain data like ePHI or Financial, which can be secret or personal. Data that is
    erroneously modified or deleted by an application or other storage account user will cause data loss or unavailability.
    It is recommended that both Azure Containers with attached Blob Storage and standalone containers with Blob Storage be
    made recoverable by enabling the soft delete configuration. This is to save and recover data when blobs or blob snapshots
    are deleted.
  rationale: Containers and Blob Storage data can be incorrectly deleted. An attacker/malicious user may do this deliberately
    in order to cause disruption. Deleting an Azure Storage blob causes immediate data loss. Enabling this configuration for
    Azure storage ensures that even if blobs/data were deleted from the storage account, Blobs/data objects are recoverable
    for a particular time which is set in the "Retention policies," ranging from 7 days to 365 days.
  impact: Additional storage costs may be incurred as snapshots are retained.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/blobs/storage-blob-soft-delete
  - 2. https://docs.microsoft.com/en-us/azure/storage/blobs/soft-delete-containeroverview
  page_start: 209
  audit_raw: "Audit from Azure Portal\n1. Go to Storage accounts.\n2. For each storage account, under Data management, select\
    \ Data protection.\n3. Verify Enable soft delete for blobs is checked and Days to retain\ndeleted blobs is at least 7.\n\
    4. Verify Enable soft delete for containers is checked and Days to retain\ndeleted containers is at least 7.\nAudit from\
    \ Azure CLI\nFor each storage account, run the following and verify both deleteRetentionPolicy\n(blobs) and containerDeleteRetentionPolicy\
    \ (containers) report enabled as true\nwith days of 7 or greater:\naz storage account blob-service-properties show \\\n\
    \ --account-name <storage-account> \\\n --resource-group <resource-group> \\\n --query \"{blobSoftDelete:deleteRetentionPolicy,\n\
    containerSoftDelete:containerDeleteRetentionPolicy}\"\nAn empty/null policy, enabled: false, or days less than 7 for either\
    \ blobs or\ncontainers is non-compliant.\nAudit from PowerShell\nFor each storage account, retrieve the blob service properties\
    \ and verify both retention\npolicies:\n$props = Get-AzStorageBlobServiceProperty -ResourceGroupName <resource-group>\n\
    -StorageAccountName <storage-account>\n$props.DeleteRetentionPolicy\n$props.ContainerDeleteRetentionPolicy\nEach policy\
    \ should report Enabled : True with Days of 7 or greater."
  remediation: "Remediate from Azure Portal\n1. Go to Storage accounts.\n2. For each storage account, under Data management,\
    \ select Data protection.\n3. Check Enable soft delete for blobs and set Days to retain deleted\nblobs to at least 7.\n\
    4. Check Enable soft delete for containers and set Days to retain\ndeleted containers to at least 7.\n5. Select Save.\n\
    Remediate from Azure CLI\nEnable both blob and container soft delete with a retention of at least 7 days:\naz storage\
    \ account blob-service-properties update \\\n --account-name <storage-account> \\\n --resource-group <resource-group>\
    \ \\\n --enable-delete-retention true \\\n --delete-retention-days <days (>= 7)> \\\n --enable-container-delete-retention\
    \ true \\\n --container-delete-retention-days <days (>= 7)>\nRemediate from PowerShell\nEnable-AzStorageBlobDeleteRetentionPolicy\
    \ -ResourceGroupName <resource-group>\n-StorageAccountName <storage-account> -RetentionDays <days (>= 7)>\nEnable-AzStorageContainerDeleteRetentionPolicy\
    \ -ResourceGroupName <resourcegroup> -StorageAccountName <storage-account> -RetentionDays <days (>= 7)>"
