- id: 16.1.4
  title: Ensure that a shared access signature (SAS) expiration policy is configured
  scoring: scored
  profile:
  - Level 1
  description: Shared access signature (SAS) tokens grant delegated, time-bound access to data in a storage account. A SAS
    expiration policy is a storage-account-level setting that specifies a recommended upper limit (a maximum validity period)
    for the lifetime of those SAS tokens. When the policy is enabled, Azure evaluates every new SAS against the limit and
    either records (the default Log action) or rejects (the Block action) any SAS whose requested expiry exceeds it. This
    recommendation ensures that a SAS expiration policy is configured on the storage account so that a maximum SAS token validity
    is defined.
  rationale: SAS tokens grant time-bound, delegated access to storage data, and a leaked or overshared token remains usable
    until it expires. Without an expiration policy, tokens can be minted with arbitrarily long lifetimes, widening the window
    in which a compromised token can be abused. Defining an account-level maximum SAS validity establishes a governance baseline
    that bounds token lifetime across all SAS types (account, service, and user delegation SAS), so that even an unnoticed
    token leak is automatically timelimited.
  impact: With the default Log expiration action, out-of-policy SAS are recorded for monitoring but are not blocked, so enabling
    the policy has no functional impact. If the action is set to Block, requests to create or use a SAS whose expiry exceeds
    the configured limit are rejected, which can disrupt applications or integrations that rely on long-lived SAS (for example,
    Azure File Sync requires a minimum interval of 3 days, and a user delegation SAS is capped at 7 days regardless of the
    policy). Configuring the policy may first require rotating both storage account access keys if their creation time has
    never been set.
  references:
  - 1. https://learn.microsoft.com/azure/storage/common/sas-expiration-policy
  - 2. https://learn.microsoft.com/azure/storage/common/storage-sas-overview
  page_start: 171
  audit_raw: "Audit from Azure Portal\n1. Go to Storage accounts.\n2. For each storage account, under Settings, select Configuration.\n\
    3. Locate Shared access signature (SAS) expiration policy and confirm it\nis set to Enabled.\n4. Confirm that a value\
    \ is specified for Upper limit for SAS expiry interval\n(the maximum SAS validity period).\nAudit from Azure CLI\nFor\
    \ each storage account, run the following and confirm that sasPolicy is present and\nthat sasExpirationPeriod is non-null.\
    \ An empty or null sasPolicy indicates that no\nexpiration policy is configured.\naz storage account show \\\n --name\
    \ <storage-account> \\\n --resource-group <resource-group> \\\n --query \"{SasPolicy:sasPolicy}\"\nAudit from PowerShell\n\
    For each storage account, run the following and confirm that the\nSasExpirationPeriod property is populated.\n(Get-AzStorageAccount\
    \ -ResourceGroupName <resource-group> -Name <storageaccount>).SasPolicy\nAudit from Azure Policy\nIf referencing a digital\
    \ copy of this Benchmark, clicking a Policy ID will open a link to the\nassociated Policy definition in Azure.\nIf referencing\
    \ a printed copy, you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: bc1b984e-ddae-40cc-801a-050a030e4fbe - Name: 'Storage accounts\nshould have shared access signature (SAS)\
    \ policies configured'"
  remediation: "Remediate from Azure Portal\n1. Go to Storage accounts.\n2. For each storage account, under Settings, select\
    \ Configuration.\n3. Set Shared access signature (SAS) expiration policy to Enabled. If the\ncontrol is unavailable, rotate\
    \ both account access keys once (see Additional\nInformation), then return here.\n4. Under Upper limit for SAS expiry\
    \ interval, specify the maximum SAS\nvalidity period appropriate for your organization, in\ndays.hours:minutes:seconds\
    \ format.\n5. Optionally set the expiration action to Block to enforce the limit; the default Log\naction only records\
    \ out-of-policy SAS.\n6. Select Save.\nRemediate from Azure CLI\nFor each storage account, run the following, substituting\
    \ the desired maximum validity\nperiod (in days.hours:minutes:seconds format) and action (Log or Block):\naz storage account\
