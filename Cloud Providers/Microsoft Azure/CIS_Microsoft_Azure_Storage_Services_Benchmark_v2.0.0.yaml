  title: Ensure public network access on Recovery Services vaults is Disabled
  scoring: scored
  profile:
  - Level 1
  description: Disable public network access on Recovery Services vaults to prevent exposure to the internet and reduce the
    risk of unauthorized access. Use private endpoints and Azure Role-Based Access Control (RBAC) to securely manage access
    within trusted networks.
  rationale: Disabling public network access improves security by ensuring that a Recovery Services vault is not exposed on
    the public internet.
  impact: 'NOTE: Prior to disabling public network access, it is strongly recommended that, for each Recovery Services vault,
    either: • virtual network integration is completed OR • private endpoints/links are set up. Disabling public network access
    on Recovery Services vaults restricts access to the vault. This enhances security but will require the configuration of
    a virtual network and/or private endpoints for any services or users needing access within trusted networks.'
  references:
  - 1. https://learn.microsoft.com/en-us/azure/backup/private-endpoints#deny-publicnetwork-access-to-the-vault
