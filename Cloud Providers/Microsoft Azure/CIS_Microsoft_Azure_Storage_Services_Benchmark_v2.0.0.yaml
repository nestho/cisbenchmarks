- id: 7.2.2
  title: Ensure 'SMB channel encryption' is set to 'AES-256-GCM' or higher for SMB file shares (Classic File Shares)
  scoring: scored
  profile:
  - Level 1
  description: 'Note: This recommendation applies to Classic File Shares (Azure file shares hosted in a storage account, the
    Microsoft.Storage provider). Implement SMB channel encryption with AES-256-GCM for SMB file shares to ensure data confidentiality
    and integrity in transit. This method offers strong protection against eavesdropping and man-in-the-middle attacks, safeguarding
    sensitive information.'
  rationale: AES-256-GCM encryption enhances the security of data transmitted over SMB channels by safeguarding it from unauthorized
    interception and tampering.
  impact: Restricting SMB channel encryption to AES-256-GCM prevents clients that negotiate only AES-128-CCM or AES-128-GCM
    (the other algorithms allowed by default, used by some older SMB clients) from connecting to the file share. Confirm that
    every client supports AES-256-GCM before enforcing this setting; otherwise those clients will lose access.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/well-architected/service-guides/azurefiles#recommendations-for-smb-file-shares
  - 2. https://learn.microsoft.com/en-us/azure/storage/files/files-smbprotocol?tabs=azure-portal#smb-security-settings
  page_start: 106
