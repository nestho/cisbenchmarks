    the contents. An attacker can enumerate a blob using methods, such as brute force, and access them. Exfiltration of data
    by brute force enumeration of items from a storage account may occur if this setting is set to 'Enabled'.
  impact: Additional consideration may be required for exceptional circumstances where elements of a storage account require
    public accessibility. In these circumstances, it is highly recommended that all data stored in the public facing storage
    account be reviewed for sensitive or potentially compromising data, and that sensitive or compromising data is never stored
    in these storage accounts.
