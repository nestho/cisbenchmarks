    disable cross subscription restore:

    Update-AzRecoveryServicesVault -ResourceGroupName <resource-group> -Name

    <rescovery-services-vault> -CrossSubscriptionRestoreState Disabled

    Note: Use -CrossSubscriptionRestoreState PermanentlyDisabled with the

    above command to permanently disable cross subscription restore.'
