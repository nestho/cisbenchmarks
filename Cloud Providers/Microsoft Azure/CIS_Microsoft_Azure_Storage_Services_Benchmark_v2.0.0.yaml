- id: 16.1.5
  title: Ensure the shared access signature (SAS) expiration policy action is set to 'Block'
  scoring: scored
  profile:
  - Level 2
  description: 'A shared access signature (SAS) expiration policy on a storage account defines an action that is taken when
    a SAS is created or used with a validity interval that exceeds the configured upper limit (or that has no signed start).
    The action is one of two values: Log (the default) records the out-of-policy SAS for auditing but still allows it, while
    Block denies the out-of-policy SAS. This recommendation ensures the action is set to Block so that the configured maximum
    SAS validity is enforced rather than only logged.'
  rationale: With the default Log action, out-of-policy SAS remain fully usable and the expiration policy is advisory only.
    Setting the action to Block makes the storage account reject out-of-policy SAS at request time, so a leaked or over-long
    SAS cannot be used beyond the organization's maximum validity. This converts the SAS expiration policy from a monitoring
    signal into an enforced access control.
  impact: 'Block denies, at use time, any SAS whose validity exceeds the configured maximum or that lacks a signed start,
    which can break applications or integrations that rely on longlived SAS. Note service constraints: Azure File Sync requires
    a minimum SAS expiry interval of 3 days, a user delegation SAS is capped at 7 days regardless of the policy, and SAS Expiration
    Action is not supported for a user delegation SAS through the HDFS endpoint or for a service-level SAS that uses a stored
    access policy. Confirm no required workflow depends on out-of-policy SAS before enabling Block - this is why the recommendation
    is Level 2.'
  references:
  - 1. https://learn.microsoft.com/azure/storage/common/sas-expiration-policy
  - 2. https://learn.microsoft.com/azure/storage/common/storage-sas-overview
  page_start: 175
