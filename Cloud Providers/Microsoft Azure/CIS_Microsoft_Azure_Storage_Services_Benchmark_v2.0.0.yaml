    SMB channel encryption:

    az storage account file-service-properties update --resource-group <resourcegroup> --account-name <storage-account> --channel-encryption
    AES-256-GCM

    Remediate from PowerShell

    For each storage account requiring remediation, run the following command to set the

    SMB channel encryption:

    Update-AzStorageFileServiceProperty -ResourceGroupName <resource-group> -

    StorageAccountName <storage-account> -SmbChannelEncryption AES-256-GCM'
  checks:
