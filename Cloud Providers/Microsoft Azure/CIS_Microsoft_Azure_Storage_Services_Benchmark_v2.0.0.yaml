- id: '16.5'
  title: Ensure that 'Enable Infrastructure Encryption' for Each Storage Account in Azure Storage is Set to 'Enabled'
  scoring: scored
  profile:
  - Level 2
  description: 'Enabling encryption at the hardware level on top of the default software encryption for Storage Accounts accessing
    Azure storage solutions. NOTE: This recommendation assumes that the Public network access parameter is set to Enabled
    from selected virtual networks and IP addresses. Please ensure the prerequisite recommendation has been implemented before
    proceeding: • Ensure Default Network Access Rule for Storage Accounts is Set to Deny Some Azure services that interact
    with storage accounts operate from networks that can''t be granted access through network rules. To help this type of
    service work as intended, allow the set of trusted Azure services to bypass the network rules. These services will then
    use strong authentication to access the storage account. If the Allow Azure services on the trusted services list to access
    this storage account exception is enabled, the following services are granted access to the storage account: Azure Backup,
    Azure Data Box, Azure DevTest Labs, Azure Event Grid, Azure Event Hubs, Azure File Sync, Azure HDInsight, Azure Import/Export,
    Azure Monitor, Azure Networking Services, and Azure Site Recovery (when registered in the subscription).'
  rationale: Azure Storage automatically encrypts all data in a storage account at the network level using 256-bit AES encryption,
    which is one of the strongest, FIPS 140-2-compliant block ciphers available. Customers who require higher levels of assurance
    that their data is secure can also enable 256-bit AES encryption at the Azure Storage infrastructure level for double
    encryption. Double encryption of Azure Storage data protects against a scenario where one of the encryption algorithms
    or keys may be compromised. Similarly, data is encrypted even before network transmission and in all backups. In this
    scenario, the additional layer of encryption continues to protect your data. For the most secure implementation of key
    based encryption, it is recommended to use a Customer Managed asymmetric RSA 2048 Key in Azure Key Vault. Turning on firewall
    rules for a storage account will block access to incoming requests for data, including from other Azure services. We can
    re-enable this functionality by allowing access to trusted Azure services through networking exceptions.
  impact: The read and write speeds to the storage will be impacted if both default encryption and Infrastructure Encryption
    are checked, as a secondary form of encryption requires more resource overhead for the cryptography of information. This
    performance impact should be considered in an analysis for justifying use of the feature in your environment. Customer-managed
    keys are recommended for the most secure implementation, leading to overhead of key management. The key will also need
    to be backed up in a secure location, as loss of the key will mean loss of the information in the storage. This creates
    authentication credentials for services that need access to storage resources so that services will no longer need to
    communicate via network request. There may be a temporary loss of communication as you set each Storage Account. It is
    recommended to not do this on mission-critical resources during business hours.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/blobs/storage-blob-encryptionstatus
  - 2. https://docs.microsoft.com/en-us/azure/storage/common/storage-serviceencryption
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/storage-networksecurity
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-networksecurity#ns-2-secure-cloud-native-services-with-network-controls
  page_start: 202
  audit_raw: "Audit from Azure Portal\n1. Go to Storage accounts.\n2. For each storage account, under Security + networking\
    \ (or the account\nOverview > Properties), confirm Infrastructure encryption is Enabled.\nAudit from Azure CLI\nFor each\
    \ storage account, verify the account-level infrastructure-encryption flag is true:\naz storage account show \\\n --name\
    \ <storage-account> \\\n --resource-group <resource-group> \\\n --query \"encryption.requireInfrastructureEncryption\"\
    \nA result of true is compliant; false or null is non-compliant. Do not audit blob-level\nserverEncrypted - it reports\
    \ ordinary service-side encryption, which is always true\neven when infrastructure (double) encryption is off.\nAudit\
    \ from PowerShell\n(Get-AzStorageAccount -ResourceGroupName <resource-group> -Name <storageaccount>).Encryption.RequireInfrastructureEncryption\n\
    True is compliant; False or empty is non-compliant.\nAudit from Azure Policy\nIf referencing a digital copy of this Benchmark,\
    \ clicking a Policy ID will open a link to the\nassociated Policy definition in Azure.\nIf referencing a printed copy,\
