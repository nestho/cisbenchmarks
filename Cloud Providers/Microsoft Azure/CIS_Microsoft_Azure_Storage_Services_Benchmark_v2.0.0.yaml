    • Policy ID: bf045164-79ba-4215-8f95-f8048dc1780b - Name: 'Geo-redundant\nstorage should be enabled for Storage Accounts'"
  remediation: 'Remediate from Azure Portal

    1. Go to Storage accounts.

    2. For each storage account, under Data management, select Redundancy.

    3. From the Redundancy drop-down, select a geo-redundant option (GRS, RAGRS, GZRS, or RA-GZRS).

    4. Select Save.

