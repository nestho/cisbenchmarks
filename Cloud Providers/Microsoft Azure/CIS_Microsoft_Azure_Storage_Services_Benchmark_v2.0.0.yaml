      \ \\\n --resource-name <storage-account> \\\n --resource-type \"Microsoft.Storage/storageAccounts\"\nThe output should\
      \ list a lock with \"level\": \"CanNotDelete\"; the absence of such a\nlock is non-compliant.\nAudit from PowerShell\n\
      Get-AzResourceLock -ResourceGroupName <re"
    severity: medium
- id: '16.15'
  title: Ensure Azure Resource Manager ReadOnly locks are considered for Azure Storage Accounts
  scoring: manual
  profile:
  - Level 2
  description: An Azure Resource Manager ReadOnly lock prevents users from deleting a storage account, modifying its properties
    or containers, or creating access assignments, until the lock is removed - more protection than a CannotDelete lock. A
    ReadOnly lock blocks POST operations to the Azure Resource Manager control plane (management.azure.com), including listKeys,
    so clients can no longer obtain the account's shared access keys. As with a Delete lock, it protects the account resource
    at the management plane; it does not protect blob, queue, table, or file data from deletion or modification via the data
    plane. Microsoft does not recommend ReadOnly locks for storage accounts used with Azure Files or the Table service.
  rationale: Applying a ReadOnly lock protects the confidentiality and availability of the account by preventing accidental
    or unauthorized deletion of the account and modification of its properties, containers, or access permissions. It offers
    enhanced protection for blob and queue workloads, with usability and compatibility tradeoffs for clients that rely on
    account shared access keys. Locks act only on the management plane and do not protect the data within the account.
  impact: • Blocks listKeys, so clients can no longer obtain the account's shared access keys; key-based and Portal data access
    then require Microsoft Entra credentials. • Data in Azure Files or the Table service may become inaccessible to clients
    that use account shared access keys (Microsoft recommends moving such workloads off a ReadOnly-locked account). • Prevents
    deletion of the storage account resource and the parent resource group, and modification of account properties, network
    settings, containers, and RBAC assignments. • Does not prevent access using shared access keys already issued, and does
    not prevent data-plane deletion of containers or objects within the account. • Can be removed by any principal with Microsoft.Authorization/locks
    permissions; resource-group/subscription-scoped locks are inherited by child resources.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/common/lock-account-resource
  - 2. https://learn.microsoft.com/en-us/azure/azure-resourcemanager/management/lock-resources
  page_start: 233
  audit_raw: "Audit from Azure Portal\n1. Navigate to the storage account in the Azure Portal.\n2. Under Settings, select\
    \ Locks.\n3. Confirm a Read-only lock exists on the storage account.\nAudit from Azure CLI\naz lock list \\\n --resource-group\
    \ <resource-group> \\\n --resource-name <storage-account> \\\n --resource-type \"Microsoft.Storage/storageAccounts\"\n\
    The output should list a lock with \"level\": \"ReadOnly\"; the absence of such a lock is\nnon-compliant.\nAudit from\
    \ PowerShell\nGet-AzResourceLock -ResourceGroupName <resource-group> -ResourceName\n<storage-account> -ResourceType \"\
    Microsoft.Storage/storageAccounts\"\nA lock whose Properties.level is ReadOnly should be returned.\nNote: there is no\
    \ built-in Azure Policy that audits resource locks on storage accounts; a\ncustom or community policy can check for a\
    \ Microsoft.Authorization/locks\nresource with an AuditIfNotExists effect."
  remediation: "Remediate from Azure Portal\n1. Navigate to the storage account in the Azure portal.\n2. Under the Settings\
    \ section, select Locks.\n3. Select Add.\n4. Provide a Name, and choose ReadOnly for the type of lock.\n5. Add a note\
    \ about the lock if desired.\nRemediate from Azure CLI\nReplace the information within <> with appropriate values:\naz\
    \ lock create --name <lock> \\\n --resource-group <resource-group> \\\n --resource <storage-account> \\\n --lock-type\
    \ ReadOnly \\\n --resource-type Microsoft.Storage/storageAccounts\nRemediate from PowerShell\nReplace the information\
    \ within <> with appropriate values:\nNew-AzResourceLock -LockLevel ReadOnly `\n -LockName <lock> `\n -ResourceName <storage-account>\
    \ `\n -ResourceType Microsoft.Storage/storageAccounts `\n -ResourceGroupName <resource-group>"
  checks:
  - type: manual_review
    info: "Audit from Azure Portal\n1. Navigate to the storage account in the Azure Portal.\n2. Under Settings, select Locks.\n\
      3. Confirm a Read-only lock exists on the storage account.\nAudit from Azure CLI\naz lock list \\\n --resource-group\
      \ <resource-group> \\\n --resource-name <storage-account> \\\n --resource-type \"Microsoft.Storage/storageAccounts\"\
      \nThe output should list a lock with \"level\": \"ReadOnly\"; the absence of such a lock is\nnon-compliant.\nAudit from\
      \ PowerShell\nGet-AzResourceLock -ResourceGroupName <res"
    severity: medium
- id: '16.16'
  title: Ensure Redundancy is set to a geo-redundant option on critical Azure Storage Accounts
  scoring: scored
  profile:
  - Level 2
  description: Geo-redundant storage replicates a storage account's data to a secondary Azure region hundreds of miles away,
    so the data survives a region-wide outage. Azure offers four geo-redundant SKUs - GRS, read-access GRS (RA-GRS), geo-zone-redundant
    storage (GZRS), and read-access GZRS (RA-GZRS) - all of which replicate across regions; the read-access variants additionally
    allow the secondary copy to be read. This recommendation ensures critical storage accounts use a geo-redundant SKU.
  rationale: A regional outage can make a non-geo-redundant (LRS or ZRS) account and its data unavailable. A geo-redundant
    SKU keeps a copy in a separate region, supporting disaster recovery and business continuity. Note that with the non-read-access
    variants (GRS, GZRS) the secondary copy is not readable until a failover; account failover is customer-initiated; and
    replication is asynchronous, so a failover has a recovery-point objective (data written but not yet replicated since the
    last sync time may be lost).
  impact: A geo-redundant SKU roughly doubles the stored-data cost versus locally redundant storage and adds geo-replication
    (egress) charges. Premium storage accounts (premium block blob, file share, or page blob) support only LRS/ZRS and cannot
    use a geo-redundant SKU. An account with the large file shares feature enabled can only be LRS/ZRS and cannot be converted
    to a geo-redundant SKU.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
  - 2. https://learn.microsoft.com/en-us/azure/storage/common/redundancy-migration
  page_start: 236
