  description: 'Note: This recommendation applies to Classic File Shares (Azure file shares hosted in a storage account, the
    Microsoft.Storage provider). Ensure that SMB file shares are configured to use the latest supported SMB protocol version.
    Keeping the SMB protocol updated helps mitigate risks associated with older SMB versions, which may contain vulnerabilities
