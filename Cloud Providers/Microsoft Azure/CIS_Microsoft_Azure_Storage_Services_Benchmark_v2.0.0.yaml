    select Maximum security or Custom.

    6. If selecting Custom, under SMB channel encryption, uncheck the boxes next

    to AES-128-CCM and AES-128-GCM.

    7. Click Save.

    8. Repeat steps 1-7 for each storage account requiring remediation.

