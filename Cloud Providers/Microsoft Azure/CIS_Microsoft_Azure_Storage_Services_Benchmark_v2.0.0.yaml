- id: 3.2.6
  title: Ensure 'Cross Region Restore' is set to 'Enabled' on Recovery Services vaults
  scoring: scored
  profile:
  - Level 2
  description: Cross region restore enables data restoration in a secondary Azure paired region, even when the primary region
    is fully operational. This allows organizations to conduct drills and validate regional resiliency, thereby ensuring preparedness
    for potential outages.
  rationale: Enabling cross region restore facilitates proactive resilience testing and disaster recovery planning by allowing
    data restoration drills in a secondary region without needing a primary region outage. This capability helps organizations
    validate recovery processes, identify gaps in regional failover, and ensures critical data can be accessed and restored
    during real disruptions.
  impact: Enabling cross region restore on a Recovery Services vault incurs additional costs, and once it is enabled, it cannot
    be disabled. • Cross region restore can only be enabled on Recovery Services vaults using the GRS replication type. •
    Cross region restore is available for Azure Virtual Machines, SQL/SAP HANA databases running inside Azure VMs, and Recovery
    Services Agent (Preview) in the vault. There is no support for classic VMs. • Cross region restore is currently an irreversible
    storage property. • When cross region restore is enabled, Azure upgrades backup storage from GRS to read-access geo-redundant
    storage (RA-GRS). Pricing is updated accordingly.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-servicesvault#set-cross-region-restore
  - 2. https://learn.microsoft.com/en-us/cli/azure/backup/vault
