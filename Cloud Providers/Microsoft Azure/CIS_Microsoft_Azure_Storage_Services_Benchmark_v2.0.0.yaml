- id: 3.2.1
  title: Ensure soft delete on Recovery Services vaults is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Soft delete provides additional protection for Recovery Services vault data. With soft delete enabled, deleted
    backup data can be recovered within the retention period.
  rationale: Important backup data could be accidentally deleted or removed by a malicious actor. With soft delete enabled,
    data is retained for at least 14 days before permanent deletion, allowing for the recovery of the backup data.
  impact: There is no additional cost for backup data in the soft delete state for up to and including 14 days. However, retention
    beyond 14 days may incur additional charges.
