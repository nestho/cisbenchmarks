    \ storage (RA-GRS), Geo-zoneredundant storage (GZRS), or Read-access geo-zone-redundant storage\n(RA-GZRS).\nAudit from\
    \ Azure CLI\nFor each storage account, verify the SKU is a geo-redundant SKU:\naz storage account show \\\n --name <storage-account>\
