- id: 16.1.7
  title: Ensure 'Allow storage account key access' for Azure Storage Accounts is 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Every secure request to an Azure Storage account must be authorized. By default, requests can be authorized
    with either Microsoft Entra credentials or by using the account access key for Shared Key authorization.
  rationale: Microsoft Entra ID provides superior security and ease of use compared to Shared Key and is recommended by Microsoft.
    To require clients to use Microsoft Entra ID for authorizing requests, you can disallow requests to the storage account
    that are authorized with Shared Key.
  impact: When you disallow Shared Key authorization for a storage account, any requests to the account that are authorized
    with Shared Key, including shared access signatures (SAS), will be denied. Client applications that currently access the
    storage account using the Shared Key will no longer function.
  references:
