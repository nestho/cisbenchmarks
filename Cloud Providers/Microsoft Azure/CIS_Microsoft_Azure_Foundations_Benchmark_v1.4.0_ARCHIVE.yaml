  title: Ensure that 'Guest invite restrictions' is set to "Only users assigned to specific admin roles can invite guest users"
  scoring: manual
  profile:
  - Level 2
  description: Restrict invitations to users with specific admin roles only.
  rationale: Restricting invitations to users with specific administrator roles ensures that only authorised accounts have
    access to cloud resources. This helps to maintain "Need to Know" permissions and prevents inadvertent access to data.
    By default the setting Guest invite restrictions is set to Anyone in the organization can invite guest users including
    guests and non-admins. This would allow anyone within the organisation to invite guests and non-admins to the tenant,
    posing a security risk.
  impact: With the option of Only users assigned to specific admin roles can invite guest users selected, users with specific
    admin roles will be in charge of sending invitations to the Azure Workspace, requiring additional overhead by them to
    manage user accounts. This will mean coordinating with other departments as they are onboarding new users, and manually
    removing access from users who no longer need it.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/active-directory-b2bdelegate-invitations
