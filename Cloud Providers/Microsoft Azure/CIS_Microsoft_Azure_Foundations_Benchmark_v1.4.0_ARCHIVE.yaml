- id: 4.1.1
  title: Ensure that 'Auditing' is set to 'On'
  scoring: scored
  profile:
  - Level 1
  description: Enable auditing on SQL Servers.
  rationale: The Azure platform allows a SQL server to be created as a service. Enabling auditing at the server level ensures
    that all existing and newly created databases on the SQL server instance are audited. Auditing policy applied on the SQL
    database does not override auditing policy and settings applied on the particular SQL server where the database is hosted.
    Auditing tracks database events and writes them to an audit log in the Azure storage account. It also helps to maintain
    regulatory compliance, understand database activity, and gain insight into discrepancies and anomalies that could indicate
    business concerns or suspected security violations.
  impact: ''
  references:
