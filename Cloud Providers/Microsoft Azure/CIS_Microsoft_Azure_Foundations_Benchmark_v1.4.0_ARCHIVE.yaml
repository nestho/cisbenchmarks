    severity: medium
- id: '1.5'
  title: Ensure That 'Number of methods required to reset' is set to '2'
  scoring: manual
  profile:
  - Level 1
  description: Ensures that two alternate forms of identification are provided before allowing a password reset.
  rationale: With a Self-service Password Reset (SSPR) that uses Azure Multi-factor Authentication (MFA) ensures the user's
    identity is confirmed using two separate methods of identification. With multiple methods set, an attacker would have
    to compromise both methods before they could maliciously reset a user's password.
  impact: There may be administrative overhead as users who lose access to their secondary authentication methods will need
    an administrator with permissions to remove it. There will also need to be an organization wide security policy and training
    to teach administrators to verify the identity of the requesting user, so that social engineering can not render this
    setting useless.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/authentication/tutorialenable-sspr
  - 2. https://docs.microsoft.com/en-us/azure/active-directory/authentication/conceptregistration-mfa-sspr-combined
  page_start: 27
  audit_raw: 'From Azure Console

    1. Go to Azure Active Directory

    2. Go to Users

    3. Go to Password reset

    4. Go to Authentication methods

    5. Ensure that Number of methods required to reset is set to 2

    Please note that at this point of time, there is no API/CLI mechanism available to

    programmatically conduct security assessment for this recommendation.

    27 | P a g e'
  remediation: 'From Azure Console

    1. Go to Azure Active Directory

    2. Go to Users

    3. Go to Password reset

    4. Go to Authentication methods

    5. Set the Number of methods required to reset to 2'
  checks:
