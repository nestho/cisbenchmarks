- id: '1.6'
  title: Ensure that 'Number of days before users are asked to re-confirm their authentication information' is not set to
    '0'
  scoring: manual
  profile:
  - Level 1
  description: Ensure that the number of days before users are asked to re-confirm their authentication information is not
    set to 0.
  rationale: This setting is necessary if you have setup 'Require users to register when signing in option'. If authentication
    re-confirmation is disabled, registered users will never be prompted to re-confirm their existing authentication information.
    If the authentication information for a user, such as a phone number or email changes, then the password reset information
    for that user reverts to the previously registered authentication information.
  impact: ''
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/active-directorypasswords-how-it-works#registration
  - 2. https://docs.microsoft.com/en-us/azure/active-directory/authentication/howtosspr-deployment
  page_start: 29
  audit_raw: 'From Azure Console

    1. Go to Azure Active Directory

    2. Go to Users

    3. Go to Password reset

    4. Go to Registration

    5. Ensure that Number of days before users are asked to re-confirm their

    authentication information is not set to 0

    Please note that at this point of time, there is no API/CLI mechanism available to

    programmatically conduct security assessment for this recommendation.'
  remediation: 'From Azure Console

    1. Go to Azure Active Directory

    2. Go to Users

    3. Go to Password reset

    4. Go to Registration

    5. Set the Number of days before users are asked to re-confirm their

    authentication information to your organization defined frequency

