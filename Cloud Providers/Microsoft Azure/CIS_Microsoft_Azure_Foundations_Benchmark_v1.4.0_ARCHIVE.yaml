- id: '5.3'
  title: Ensure that Diagnostic Logs Are Enabled for All Services that Support it.
  scoring: manual
  profile:
  - Level 1
  description: 'Diagnostic Logs capture activity to the data access plane while the Activity log is a subscription-level log
    for the control plane. Resource-level diagnostic logs provide insight into operations that were performed within that
    resource itself, for example, getting a secret from a Key Vault. Currently, 32 Azure resources support Diagnostic Logging
    (See the references section for a complete list), including Network Security Groups, Load Balancers, Key Vault, AD, Logic
    Apps and CosmosDB. The content of these logs varies by resource type. For example, Windows event system logs are a category
    of diagnostics logs for VMs, and blob, table, and queue logs are categories of diagnostics logs for storage accounts.
    A number of back-end services were not configured to log and store Diagnostic Logs for certain activities or for a sufficient
    length. It is crucial that logging systems are correctly configured to log all relevant activities and retain those logs
    for a sufficient length of time. By default, Diagnostic Logs are not enabled. Given that the mean time to detection in
    an enterprise is 240 days, a minimum retention period of two years is recommended. Note: The CIS Benchmark covers some
    specific Diagnostic Logs separately. 3.3 - Ensure Storage logging is enabled for Queue service for read, write, and delete
    requests 6.4 Ensure that Network Security Group Flow Log retention period is ''greater than 90 days'''
  rationale: A lack of Diagnostic Logs reduces the visibility into the data plane and therefore an organization's ability
    to detect reconnaissance, authorization attempts or other malicious activity. Unlike Activity Logs, Diagnostic Logs are
    not enabled by default. Specifically, without Diagnostic Logs it would be impossible to tell which entities had accessed
    a data store that which was breached. In addition, alerts for failed attempts to access APIs for Web Services or Databases
    are only possible when Diagnostic Logging is enabled. 258 | P a g e
  impact: Costs for Log Analytics Workspaces varies with Log Volume. Not every resource need to have logging enabled. It's
    important to determine the security classification of the data being processed by the given resource and adjust the logging
    based on which events need to be tracked. This is typically determined by governance and compliance requirements.
  references:
  - '1. [Azure: Logs and Audit - Fundamentals](https://docs.microsoft.com/enus/azure/security/fundamentals/log-audit)[Azure:
    Collecting'
  - 2. https://docs.microsoft.com/en-us/azure/security/benchmarks/security-controlsv2-logging-threat-detection#lt-4-enable-logging-for-azure-resources
  page_start: 258
  audit_raw: "From Azure Console\nThe specific steps for configuring resources within the Azure\nconsole vary depending on\
    \ resource, but typically the steps are:\n1. Go to the resource\n2. Click on Diagnostic settings\n3. In the blade that\
    \ appears, click \"Add diagnostic setting\"\n4. Configure the diagnostic settings\n5. Click on Save\nUsing Azure Command\
    \ Line Interface\nUse the following command to list the resource\nmanager resources.\naz resource list | jq '.[].id' |\
    \ sed 's/\\\"//g' > resources.txt\nCheck if diagnostic logging was present.\nfor resource in `cat resources.txt`; do\n\
    \ echo $resource && az monitor diagnostic-settings list --resource\n$resource 2>/dev/null| jq '.value'\ndone\nThe output\
    \ from above will give the resource id followed\nby [] if a diagnostic log is available but not present."
  remediation: "Azure Subscriptions should log every access and operation for all resources.\nLogs should be sent to Storage\
    \ and a Log Analytics Workspace or equivalent third-party\nsystem.\nLogs should be kept in readily accessible storage\
    \ for a minimum of one year, and then\nmoved to inexpensive cold storage for a duration of time as necessary. If retention\
    \ policies\nare set but storing logs in a Storage Account is disabled (for example, if only Event Hubs or\n259 | P a g\
    \ e\nLog Analytics options are selected), the retention policies have no effect.\nEnable all logging at first, and then\
    \ be more aggressive moving data to cold storage if the\nvolume of data\nbecomes a cost concern.\nFrom Azure Console\n\
    The specific steps for configuring resources within the Azure console vary depending on\nresource, but typically the steps\
    \ are:\n1. Go to the resource\n2. Click on Diagnostic settings\n3. In the blade that appears, click \"Add diagnostic setting\"\
    \n4. Configure the diagnostic settings\n5. Click on Save\nUsing Azure Command Line Interface\nEnable logging for all resources\
    \ which support Diagnostic Logs to ensure interactions\nwithin the resource are logged and available. The skeleton command\
    \ for creating\nlogs and metrics with unlimited retention on a\ngeneric resource are shown below.\naz monitor diagnostic-settings\
    \ create --resource {ID} -n {name}\n --event-hub-rule {eventHubRuleID} --storageaccount {storageAccount}\n --logs '[\n\
    \ {\n \"category\": \"WorkflowRuntime\",\n \"enabled\": true,\n \"retentionPolicy\": {\n \"enabled\": false,\n \"days\"\
    : 0\n }\n }\n ]'\n --metrics '[\n {\n \"category\": \"WorkflowRuntime\",\n \"enabled\": true,\n \"retentionPolicy\": {\n\
    \ \"enabled\": false,\n \"days\": 0\n }\n }\n ]'\n260 | P a g e"
  checks:
  - type: manual_review
    info: 'From Azure Console

      The specific steps for configuring resources within the Azure

      console vary depending on resource, but typically the steps are:

      1. Go to the resource

      2. Click on Diagnostic settings

      3. In the blade that appears, click "Add diagnostic setting"

