- id: '7.2'
  title: Ensure that 'OS and Data' disks are encrypted with Customer Managed Key (CMK)
  scoring: scored
  profile:
  - Level 2
  description: Ensure that OS disks (boot volumes) and data disks (non-boot volumes) are encrypted with CMK (Customer Managed
    Keys). Customer Managed keys can be either ADE or Server Side Encryption(SSE)
  rationale: Encrypting the IaaS VM's OS disk (boot volume), Data disks (non-boot volume) ensures that the entire content
    is fully unrecoverable without a key and thus protects the volume from unwanted reads. PMK (Platform Managed Keys) are
    enabled by default in Azure managed disks and allow encryption at rest. CMK is the recommended because it gives the customer
    the option to control which specific keys are used for the encryption and decryption of the disk. The customer can then
    change keys and disable them increasing security, instead of relying on the PMK key that remains unchanging. There is
    also the option to increase security further by using automatically rotating keys, so that access to disk is ensured to
    be limited. However organizations should evaluate what their security requirements are for the data stored on the disk.
    For high risk data using CMK is a must, as it is extra steps of security. If the data is low risk, PMK is enabled by default,
    and provides sufficient data security.
  impact: 'Using CMK/BYOK will entail additional management of keys. NOTE: You must have your key vault setup to utilize this.'
  references:
  - 1. https://docs.microsoft.com/azure/security/fundamentals/azure-disk-encryptionvms-vmss
  - 2. https://docs.microsoft.com/en-us/azure/security-center/security-center-diskencryption?toc=%2fazure%2fsecurity%2ftoc.json
  page_start: 281
  audit_raw: 'From Azure Console

    1. Go to Virtual machines

    2. For each virtual machine, go to Settings

    3. Click on Disks

    4. Ensure that the OS disk and Data disks have encryption set to CMK.

    281 | P a g e

    Using PowerShell

    $ResourceGroupName="yourResourceGroupName"

    $DiskName="yourDiskName"

    $disk=Get-AzDisk -ResourceGroupName $ResourceGroupName -DiskName $DiskName

    $disk.Encryption.Type'
  remediation: "From Azure Console\nNote: Disks must be detached from VMs to have encryption changed.\n1. Go to Virtual machines\n\
    2. For each virtual machine, go to Settings\n3. Click on Disks\n4. Click the X to detach the disk from the VM\n5. Now\
    \ search for Disks and locate the unattached disk\n6. Click the disk then select Encryption\n7. Change your encryption\
    \ type, then select your encryption set\n8. Click Save\n9. Go back to the VM and re-attach the disk\nUsing PowerShell\n\
    $KVRGname = 'MyKeyVaultResourceGroup';\n $VMRGName = 'MyVirtualMachineResourceGroup';\n $vmName = 'MySecureVM';\n $KeyVaultName\
    \ = 'MySecureVault';\n $KeyVault = Get-AzKeyVault -VaultName $KeyVaultName -ResourceGroupName\n$KVRGname;\n $diskEncryptionKeyVaultUrl\
    \ = $KeyVault.VaultUri;\n $KeyVaultResourceId = $KeyVault.ResourceId;\n Set-AzVMDiskEncryptionExtension -ResourceGroupName\
    \ $VMRGname -VMName $vmName\n-DiskEncryptionKeyVaultUrl $diskEncryptionKeyVaultUrl -\nDiskEncryptionKeyVaultId $KeyVaultResourceId;\n\
    NOTE: During encryption it is likely that a reboot will be required, it may take up to 15\nminutes to complete the process.\n\
    NOTE 2: This may differ for Linux Machines as you may need to set the -skipVmBackup\nparameter"
  checks:
  - type: manual_review
    info: 'From Azure Console

      1. Go to Virtual machines

      2. For each virtual machine, go to Settings

      3. Click on Disks

      4. Ensure that the OS disk and Data disks have encryption set to CMK.

      281 | P a g e

      Using PowerShell

      $ResourceGroupName="yourResourceGroupName"

      $DiskName="yourDiskName"

      $disk=Get-AzDisk -ResourceGroupName $ResourceGroupName -DiskName $DiskName

      $disk.Encryption.Type'
    severity: medium
