- id: '9.2'
  title: Ensure Web App Redirects All HTTP traffic to HTTPS in Azure App Service
  scoring: scored
  profile:
  - Level 1
  description: Azure Web Apps allows sites to run under both HTTP and HTTPS by default. Web apps can be accessed by anyone
    using non-secure HTTP links by default. Non-secure HTTP requests can be restricted and all HTTP requests redirected to
    the secure HTTPS port. It is recommended to enforce HTTPS-only traffic.
  rationale: Enabling HTTPS-only traffic will redirect all non-secure HTTP request to HTTPS ports. HTTPS uses the TLS/SSL
    protocol to provide a secure connection, which is both encrypted and authenticated. So it is important to support HTTPS
    for the security benefits.
  impact: When it is enabled, every incoming HTTP requests are redirected to the HTTPS port. It means an extra level of security
    will be added to the HTTP requests made to the app.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/app-service/app-service-web-tutorialcustom-ssl#enforce-https
