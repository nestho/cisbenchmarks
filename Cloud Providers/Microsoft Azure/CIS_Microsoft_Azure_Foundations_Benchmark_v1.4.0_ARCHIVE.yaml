- id: '3.6'
  title: Ensure Default Network Access Rule for Storage Accounts is Set to Deny
  scoring: scored
  profile:
  - Level 2
  description: Restricting default network access helps to provide a new layer of security, since storage accounts accept
    connections from clients on any network. To limit access to selected networks, the default action must be changed.
  rationale: Storage accounts should be configured to deny access to traffic from all networks (including internet traffic).
    Access can be granted to traffic from specific Azure Virtual networks, allowing a secure network boundary for specific
    applications to be built. Access can also be granted to public internet IP address ranges, to enable connections from
    specific internet or on-premises clients. When network rules are configured, only applications from allowed networks can
    access a storage account. When calling from an allowed network, applications continue to require proper authorization
    (a valid access key or SAS token) to access the storage account.
  impact: All allowed networks will need to be whitelisted on each specific network, creating administrative overhead. This
    may result in loss of network connectivity, so do not turn on for critical resources during business hours.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/storage-networksecurity
  - 2. https://docs.microsoft.com/en-us/azure/security/benchmarks/security-controlsv2-governance-strategy#gs-2-define-enterprise-segmentation-strategy
  page_start: 128
  audit_raw: "From Azure Console\n1. Go to Storage Accounts\n2. For each storage account, Click on the Networking blade.\n\
    3. Click the Firewalls and virtual networks heading.\n4. Ensure that Allow access from All networks is not selected.\n\
    Using Azure Command Line Interface 2.0\nEnsure defaultAction is not set to Allow.\n az storage account list --query '[*].networkRuleSet'\n\
    128 | P a g e"
  remediation: "From Azure Console\n1. Go to Storage Accounts\n2. For each storage account, Click on the Networking blade\n\
    3. Click the Firewalls and virtual networks heading.\n4. Ensure that you have elected to allow access from Selected networks\n\
    5. Add rules to allow traffic from specific network.\n6. Click Save to apply your changes.\nUsing Azure Command Line Interface\
    \ 2.0\nUse the below command to update default-action to Deny.\n az storage account update --name <StorageAccountName>\
    \ --resource-group\n<resourceGroupName> --default-action Deny"
  checks:
  - type: manual_review
    info: "From Azure Console\n1. Go to Storage Accounts\n2. For each storage account, Click on the Networking blade.\n3.\
      \ Click the Firewalls and virtual networks heading.\n4. Ensure that Allow access from All networks is not selected.\n\
      Using Azure Command Line Interface 2.0\nEnsure defaultAction is not set to Allow.\n az storage account list --query\
      \ '[*].networkRuleSet'\n128 | P a g e"
    severity: medium
- id: '3.7'
  title: Ensure 'Trusted Microsoft Services' are Enabled for Storage Account Access
  scoring: scored
  profile:
  - Level 2
  description: 'Some Microsoft services that interact with storage accounts operate from networks that can''t be granted access
    through network rules. To help this type of service work as intended, allow the set of trusted Microsoft services to bypass
    the network rules. These services will then use strong authentication to access the storage account. If the Allow trusted
    Microsoft services exception is enabled, the following services: Azure Backup, Azure Site Recovery, Azure DevTest Labs,
    Azure Event Grid, Azure Event Hubs, Azure Networking, Azure Monitor and Azure SQL Data Warehouse (when registered in the
    subscription), are granted access to the storage account.'
  rationale: Turning on firewall rules for storage account will block access to incoming requests for data, including from
    other Azure services. This includes using the Portal, writing logs, etc. We can re-enable functionality. The customer
    can get access to services like Monitor, Networking, Hubs, and Event Grid by enabling "Trusted Microsoft Services" through
    exceptions. Also, Backup and Restore of Virtual Machines using unmanaged disks in storage accounts with network rules
    applied is supported via creating an exception.
  impact: This creates authentication credentials for services that need access to storage resources, so that services will
    no longer need to communicate via network request. There may be a temporary loss of communication as you set each Storage
    Account. It is recommended to not do this on mission critical resources during business hours.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/storage-networksecurity
  - 2. https://docs.microsoft.com/en-us/azure/security/benchmarks/security-controlsv2-network-security#ns-1-implement-security-for-internal-traffic
