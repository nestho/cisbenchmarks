  title: Ensure that 'Public access level' is set to Private for blob containers
  scoring: scored
  profile:
  - Level 1
  description: Disable anonymous access to blob containers and disallow blob public access on storage account.
  rationale: Anonymous, public read access to a container and its blobs can be enabled in Azure Blob storage. It grants read-only
    access to these resources without sharing the account key, and without requiring a shared access signature. It is recommended
    not to provide anonymous access to blob containers until, and unless, it is strongly desired. A shared access signature
    token should be used for providing controlled and timed access to blob containers. If no anonymous access is needed on
    the storage account, it’s recommended to set allowBlobPublicAccess false.
  impact: Access using shared access signatures will have to be managed.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/blobs/storage-manage-access-toresources
