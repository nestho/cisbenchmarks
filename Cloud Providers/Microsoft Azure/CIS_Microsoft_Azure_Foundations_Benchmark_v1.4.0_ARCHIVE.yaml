- id: '1.8'
  title: Ensure That 'Notify all admins when other admins reset their password?' is set to 'Yes'
  scoring: manual
  profile:
  - Level 2
  description: Ensure that all administrators are notified if any other administrator resets their password.
  rationale: Administrator accounts are sensitive. Any password reset activity notification, when sent to all administrators,
    ensures that all administrators can passively confirm if such a reset is a common pattern within their group. For example,
    if all administrators change their password every 30 days, any password reset activity before that may require administrator(s)
    to evaluate any unusual activity and confirm its origin.
  impact: All other Admins will receive a notification to however they are set up to receive notifications from Azure every
    time a password is reset. This is useful for auditing procedures to confirm that there aren't any out of the ordinary
    password resets for Admins. However, there is additional overhead in the time of Admins required to audit the notifications.
    This setting is only useful if all Admins pay attention to the notifications, and audit each one.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/active-directorypasswords-how-it-works#notifications
  - 2. https://docs.microsoft.com/en-us/azure/active-directory/authentication/howtosspr-deployment
  page_start: 33
