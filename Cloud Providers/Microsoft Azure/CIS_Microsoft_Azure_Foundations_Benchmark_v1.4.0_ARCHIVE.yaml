    Using Azure Powershell

    To get the minimum TLS version, run the following command:

    (Get-AzStorageAccount -Name <STORAGEACCOUNTNAME> -ResourceGroupName

    <RESOURCEGROUPNAME>).MinimumTlsVersion'
