  title: Ensure Bot Protection is Enabled in Azure Web Application Firewall Policy on Azure Application Gateway
  scoring: scored
  profile:
  - Level 2
  description: Enable bot protection on the Web Application Firewall to block or log requests from known malicious IP addresses
    identified through the Microsoft Threat Intelligence feed.
  rationale: Internet traffic from bots can scrape, scan, and search for application vulnerabilities. Enabling bot protection
    stops requests from known malicious IP addresses and enhances the overall security of your application by reducing exposure
    to automated attacks.
  impact: May require monitoring to identify false positives.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/botprotection-overview
  - 2. https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/bot-protection
  page_start: 262
  audit_raw: 'Audit from Azure Portal

    1. Go to Application gateways.

    2. Click the name of an application gateway.

    3. Under Settings, click Web application firewall.

    4. Under Associated web application firewall policy, click the policy

    name.

    5. Under Settings, click Managed rules.

    6. Ensure a Rule Id containing Microsoft_BotManagerRuleSet is listed.

    7. Click the > to expand the row.

    8. Ensure the Status for Malicious Bots is set to Enabled.

    9. Repeat steps 1-8 for each application gateway.

    Audit from Azure CLI

    Run the following command to list application gateways:

    az network application-gateway list

    For each application gateway, run the following command to get the firewall policy id:

    az network application-gateway show --resource-group <resource-group> --name

    <application-gateway> --query firewallPolicy.id

    For each firewall policy, run the following command to get the managed rule sets:

    az network application-gateway waf-policy show --ids <firewall-policy> --

    query managedRules.managedRuleSets

    Ensure a managed rule set with ruleSetType of Microsoft_BotManagerRuleSet is

    returned, and that no ruleGroupOverrides for ruleGroupName KnownBadBots with

    state Disabled are returned.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

