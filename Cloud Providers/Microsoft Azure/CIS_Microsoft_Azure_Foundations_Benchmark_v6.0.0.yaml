- id: 8.3.5
  title: Ensure 'Purge protection' is Set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'Key vaults contain object keys, secrets, and certificates. Deletion of a key vault can cause immediate data
    loss or loss of security functions (authentication, validation, verification, non-repudiation, etc.) supported by the
    key vault objects. It is recommended the key vault be made recoverable by enabling the "purge protection" function. This
    is to prevent the loss of encrypted data, including storage accounts, SQL databases, and/or dependent services provided
    by key vault objects (keys, secrets, certificates, etc.). NOTE: In February 2025, Microsoft enabled soft delete protection
    on all key vaults. Users can no longer opt out of or turn off soft delete. WARNING: A current limitation is that role
    assignments disappear when a key vault is deleted. All role assignments will need to be recreated after recovery.'
  rationale: Users may accidentally run delete/purge commands on a key vault, or an attacker or malicious user may do so deliberately
    in order to cause disruption. Deleting or purging a key vault leads to immediate data loss, as keys encrypting data and
    secrets/certificates allowing access/services will become inaccessible. Enabling purge protection ensures that even if
    a key vault is deleted, the key vault and its objects remain recoverable during the configurable retention period. If
    no action is taken, the key vault and its objects will be purged once the retention period elapses.
  impact: Once purge protection is enabled for a key vault, it cannot be disabled.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/key-vault/general/key-vault-recovery
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-governancestrategy#gs-8-define-and-implement-backup-and-recovery-strategy
  page_start: 375
  audit_raw: 'Requisite Permissions - read section overview!

    Data-plane access not required. Can be audited and remediated with Azure Resource

    Manager permissions.

    Audit from Azure Portal

    1. Go to Key Vaults.

    2. Click the name of a key vault.

    3. Under Settings, click Properties.

    4. Next to Purge protection, ensure that Enable purge protection (enforce

    a mandatory retention period for deleted vaults and vault

    objects) is selected.

    5. Repeat steps 1-4 for each key vault.

    Audit from Azure CLI

    Run the following command to list key vaults:

    az resource list --query "[?type==''Microsoft.KeyVault/vaults'']"

    For each key vault, run the following command to get the purge protection setting:

    az resource show --resource-group <resource-group> --name <key-vault> --

    resource-type "Microsoft.KeyVault/vaults" --query

    properties.enablePurgeProtection

    Ensure that true is returned.

    Audit from PowerShell

    Run the following command to list key vaults:

    Get-AzKeyVault

    For each key vault, run the following command to get the key vault details:

    Get-AzKeyVault -ResourceGroupName <resource-group> -VaultName <key-vault>

    Ensure Purge Protection Enabled? is set to True.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 0b60c0b2-2dc2-4e1c-b5c9-abbed971de53 - Name: ''Key vaults should

    have deletion protection enabled'''
  remediation: 'Requisite Permissions - read section overview!

    Data-plane access not required. Can be audited and remediated with Azure Resource

    Manager permissions.

    Note: Once enabled, purge protection cannot be disabled.

    Remediate from Azure Portal

    1. Go to Key Vaults.

    2. Click the name of a key vault.

    3. Under Settings, click Properties.

    4. Select the radio button next to Enable purge protection (enforce a

    mandatory retention period for deleted vaults and vault objects).

    5. Click Save.

    6. Repeat steps 1-5 for each key vault requiring remediation.

    Remediate from Azure CLI

    For each key vault requiring remediation, run the following command to enable purge

    protection:

    az resource update --resource-group <resource-group> --name <key-vault> --

    resource-type "Microsoft.KeyVault/vaults" --set

    properties.enablePurgeProtection=true

    Remediate from PowerShell

    For each key vault requiring remediation, run the following command to enable purge

    protection:

    Update-AzKeyVault -ResourceGroupName <resource-group> -VaultName <key-vault>

    -EnablePurgeProtection'
