- id: '7.3'
  title: Ensure that UDP Port Access from the Internet is Evaluated and Restricted
  scoring: scored
  profile:
  - Level 1
  description: Network security groups should be periodically evaluated for port misconfigurations. Where UDP is not explicitly
    required and narrowly configured for resources attached to a network security group, Internet-level access to Azure resources
    should be restricted or eliminated.
  rationale: The potential security problem with broadly exposing UDP services over the Internet is that attackers can use
    DDoS amplification techniques to reflect spoofed UDP traffic from Azure Virtual Machines. The most common types of these
    attacks exploit exposed DNS, NTP, SSDP, SNMP, CLDAP, and other UDP-based services as amplification sources to disrupt
    services on other machines within the Azure Virtual Network, or even attack networked devices outside of Azure.
  impact: ''
  references:
  - 1. https://learn.microsoft.com/en-us/azure/security/fundamentals/network-bestpractices#secure-your-critical-azure-service-resources-to-only-your-virtualnetworks
  - 2. https://learn.microsoft.com/en-us/azure/ddos-protection/fundamental-bestpractices
