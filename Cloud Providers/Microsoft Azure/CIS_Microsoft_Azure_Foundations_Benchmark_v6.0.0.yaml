- id: 8.3.7
  title: Ensure Public Network Access is Disabled
  scoring: scored
  profile:
  - Level 1
  description: Disable public network access to prevent exposure to the internet and reduce the risk of unauthorized access.
    Use private endpoints to securely manage access within trusted networks. When a private endpoint is configured on a key
    vault, connections from Azure resources within the same subnet will use its private IP address. However, network traffic
    from the public internet can still connect to the key vault's public endpoint (mykeyvault.vault.azure.net) using its public
    IP address unless public network access is disabled. Disabling public network access removes the vault's public endpoint
    from Azure public DNS, reducing its exposure to the public internet. With a private endpoint configured, network traffic
    will use the vault's private endpoint IP address for all requests (mykeyvault.vault.privatelink.azure.net).
  rationale: Disabling public network access improves security by ensuring that a service is not exposed on the public internet.
    Removing a point of interconnection from the internet edge to your key vault can strengthen the network security boundary
    of your system and reduce the risk of exposing the control plane or vault objects to untrusted clients. Although Azure
    resources are never truly isolated from the public internet, disabling the public endpoint removes a line of sight from
    the public internet and increases the effort required for an attack.
  impact: 'NOTE: Prior to disabling public network access, it is strongly recommended that, for each key vault, either: •
    virtual network integration is completed OR • private endpoints/links are set up as described in "Ensure Private Endpoints
    are used to access Azure Key Vault." Disabling public network access restricts access to the service. This enhances security
    but will require the configuration of a virtual network and/or private endpoints for any services or users needing access
    within trusted networks.'
  references:
  - 1. https://learn.microsoft.com/en-us/azure/key-vault/general/network-security
  - 2. https://learn.microsoft.com/en-us/azure/key-vault/general/private-link-service
