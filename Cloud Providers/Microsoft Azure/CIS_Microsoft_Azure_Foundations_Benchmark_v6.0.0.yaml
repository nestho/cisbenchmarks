    • Policy ID: a7aca53f-2ed4-4466-a25e-0b45ade68efd - Name: ''Azure DDoS

    Protection should be enabled'''
  remediation: 'Remediate from Azure Portal

    1. Go to Virtual networks.

    2. Click the name of a virtual network.

    3. Under Settings, click DDoS protection.

    4. Next to DDoS Network Protection, click Enable.

    5. Provide a DDoS protection plan resource ID, or select a DDoS protection plan

    from the drop-down menu.

    6. Click Save.

    7. Repeat steps 1-6 for each virtual network requiring remediation.

    Remediate from Azure CLI

    For each virtual network requiring remediation, run the following command to enable

    DDoS protection:

    az network vnet update --resource-group <resource-group> --name <virtualnetwork> --ddos-protection true --ddos-protection-plan
    <ddos-protection-plan>'
