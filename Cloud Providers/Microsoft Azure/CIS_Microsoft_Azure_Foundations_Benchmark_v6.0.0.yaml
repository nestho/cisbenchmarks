    • Policy ID: fbb99e8e-e444-4da0-9ff1-75c92f5a85b2 - Name: ''Storage account

    containing the container with activity logs must be encrypted with BYOK'''
  remediation: 'Remediate from Azure Portal

    1. Go to Monitor.

