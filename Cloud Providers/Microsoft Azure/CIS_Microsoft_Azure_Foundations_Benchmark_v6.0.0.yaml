    get-mguser -All | where {$_.StrongAuthenticationMethods.Count -eq 0} |

    Select-Object -Property UserPrincipalName

    If the output contains any UserPrincipalName, then this recommendation is noncompliant.'
  remediation: 'Remediate from Azure Portal

