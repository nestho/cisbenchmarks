- id: 2.1.11
  title: Ensure Private Endpoints are used to access Azure Databricks workspaces
  scoring: scored
  profile:
  - Level 2
  description: Use private endpoints for Azure Databricks workspaces to allow clients and services to securely access data
    located over a network via an encrypted Private Link. To do this, the private endpoint uses an IP address from the VNet
    for each service. Network traffic between disparate services securely traverses encrypted over the VNet. This VNet can
    also link addressing space, extending your network and accessing resources on it. Similarly, it can be a tunnel through
    public networks to connect remote infrastructures together. This creates further security through segmenting network traffic
    and preventing outside sources from accessing it.
  rationale: Using private endpoints for Azure Databricks workspaces ensures that all communication between clients, services,
    and data sources occurs over a secure, private IP space within an Azure Virtual Network (VNet). This approach eliminates
    exposure to the public internet, significantly reducing the attack surface and aligning with Zero Trust principles. Additionally,
    integrating Databricks with a VNet enables network segmentation, fine-grained access control, and hybrid connectivity
    through VNet peering or VPN/ExpressRoute.
  impact: 'If an Azure Virtual Network is not implemented correctly, this may result in the loss of critical network traffic.
    Private endpoints are charged per hour of use. Refer to https://azure.microsoft.com/enus/pricing/details/private-link/
    and https://azure.microsoft.com/en-us/pricing/calculator/ to estimate potential costs. Before a private endpoint can be
    configured, Azure Databricks workspaces: • must be deployed in a customer-managed virtual network (VNet injection)—refer
    to the recommendation Ensure that Azure Databricks is deployed in a customer-managed virtual network (VNet) • must have
    secure cluster connectivity enabled—refer to the recommendation Ensure ''Enable No Public IP'' is set to ''Yes'' • must
    be on the Premium pricing tier Ensure the requirements and concepts are considered carefully before applying this recommendation.
    Refer to https://learn.microsoft.com/enus/azure/databricks/security/network/classic/private-link for more information.'
  references:
  - 1. https://learn.microsoft.com/enus/azure/databricks/security/network/classic/private-link
  - 2. https://learn.microsoft.com/en-us/cli/azure/databricks/workspace
  page_start: 59
