    • Policy ID: 258823f2-4595-4b52-b333-cc96192710d8 - Name: ''Azure Databricks

    Workspaces should use private link'''
  remediation: 'Remediate from Azure Portal

    1. Go to Azure Databricks.

    2. Click the name of a workspace.

    3. Under Settings, click Networking.

    4. Click Private endpoint connections.

    5. Click + Private endpoint.

    6. Under Project details, select a Subscription and a Resource group.

    7. Under Instance details, provide a Name, Network Interface Name, and

