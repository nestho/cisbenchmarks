- id: '7.16'
  title: Ensure Azure Network Security Perimeter is Used to Secure Azure Platform-as-a-service Resources
  scoring: manual
  profile:
  - Level 2
  description: Azure Network Security Perimeter creates a logical boundary around Azure platform-asa-service (PaaS) resources
    outside of virtual networks. By default, the network security perimeter denies public access to associated PaaS resources,
    with the ability to define explicit rules for inbound and outbound traffic. While an automated assessment procedure exists
    for this recommendation, the assessment status remains manual. Determining appropriate network security perimeter profiles
    and resource assignments depends on the context and requirements of each organization and environment.
  rationale: Network security perimeter denies public access to PaaS resources, reducing exposure and mitigating data exfiltration
    risks.
  impact: Implementation requires administrative effort to configure and maintain network security perimeter profiles and
    resource assignments. Azure does not list any additional charges for using network security perimeters.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/private-link/network-security-perimeterconcepts
  - 2. https://learn.microsoft.com/en-us/azure/private-link/create-network-securityperimeter-portal
  page_start: 265
