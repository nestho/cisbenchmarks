- id: 8.1.16
  title: Ensure that Microsoft Defender External Attack Surface Monitoring (EASM) is Enabled
  scoring: manual
  profile:
  - Level 2
  description: An organization's attack surface is the collection of assets with a public network identifier or URI that an
    external threat actor can see or access from outside your cloud. It is the set of points on the boundary of a system,
    a system element, system component, or an environment where an attacker can try to enter, cause an effect on, or extract
    data from, that system, system element, system component, or environment. The larger the attack surface, the harder it
    is to protect. This tool can be configured to scan your organization's online infrastructure such as specified domains,
    hosts, CIDR blocks, and SSL certificates, and store them in an Inventory. Inventory items can be added, reviewed, approved,
    and removed, and may contain enrichments ("insights") and additional information collected from the tool's different scan
    engines and open-source intelligence sources. A Defender EASM workspace will generate an Inventory of publicly exposed
    assets by crawling and scanning the internet using Seeds you provide when setting up the tool. Seeds can be FQDNs, IP
    CIDR blocks, and WHOIS records. Defender EASM will generate Insights within 24-48 hours after Seeds are provided, and
    these insights include vulnerability data (CVEs), ports and protocols, and weak or expired SSL certificates that could
    be used by an attacker for reconnaissance or exploitation. Results are classified High/Medium/Low and some of them include
    proposed mitigations.
  rationale: This tool can monitor the externally exposed resources of an organization, provide valuable insights, and export
    these findings in a variety of formats (including CSV) for use in vulnerability management operations and red/purple team
    exercises.
  impact: Microsoft Defender EASM workspaces are currently available as Azure Resources with a 30-day free trial period but
    can quickly accrue significant charges. The costs are calculated daily as (Number of "billable" inventory items) x (item
    cost per day). Estimated cost is not provided within the tool, and users are strongly advised to contact their Microsoft
    sales representative for pricing and set a calendar reminder for the end of the trial period. If the workspace is deleted
    by the last day of a free trial period, no charges are billed.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/external-attack-surface-management/
  - 2. https://learn.microsoft.com/en-us/azure/external-attack-surfacemanagement/deploying-the-defender-easm-azure-resource
  page_start: 351
  audit_raw: 'Audit from Azure Portal

    1. Go to Microsoft Defender EASM.

    2. Ensure that at least one Microsoft Defender EASM workspace is listed.

