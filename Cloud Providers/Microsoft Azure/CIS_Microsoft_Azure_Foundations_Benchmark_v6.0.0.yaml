- id: '5.7'
  title: Ensure there are between 2 and 3 Subscription Owners
  scoring: scored
  profile:
  - Level 1
  description: The Owner role in Azure grants full control over all resources in a subscription, including the ability to
    assign roles to others.
  rationale: Limit the number of security principals (users, groups, service principals, and managed identities) assigned
    the Owner role to between 2 and 3. If groups are used, ensure their membership is tightly controlled and regularly reviewed
    to avoid privilege sprawl.
  impact: 'Implementation may require changes in administrative workflows or the redistribution of roles and responsibilities.
    The recommendation to have between 2 and 3 Owners per subscription must account for all security principals that can be
    assigned the Owner role, not just individual users. This includes: • User accounts • Entra ID groups • Service principals
    (used by applications or automation) • Managed identities (system-assigned or user-assigned)'
