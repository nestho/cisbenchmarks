      az network application-gateway list

      For each application gateway, run the following command to get the SSL policy:

      az network application-gateway ssl-policy sh'
    severity: medium
- id: '7.13'
  title: Ensure 'HTTP2' is Set to 'Enabled' on Azure Application Gateway
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: Enable HTTP/2 for improved performance, efficiency, and security. HTTP/2 protocol support is available to clients
    that connect to application gateway listeners only. Communication with backend server pools is always HTTP/1.1. Enable
    request body inspection so that the Web Application Firewall evaluates the contents of HTTP message bodies for potential
    threats.
  rationale: Enabling HTTP/2 supports use of modern encrypted connections. Enabling request body inspection strengthens security
    by allowing the Web Application Firewall to detect common attacks, such as SQL injection and cross-site scripting.
  impact: Clients and backend services that do not support HTTP/2 will fall back to HTTP/1.1. Minor performance impact on
    the Web Application Firewall. Additional effort may be required to monitor findings.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/application-gateway/features#websocketand-http2-traffic
