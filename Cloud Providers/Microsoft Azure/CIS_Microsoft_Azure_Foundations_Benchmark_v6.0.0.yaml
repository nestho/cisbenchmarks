  audit_raw: 'Audit from Azure Portal

    1. Go to Microsoft Defender for Cloud.

    2. Under Management, click Environment Settings.

    3. Expand the Tenant Root Group(s) to reveal subscriptions.

    For each subscription listed:

    1. Click the subscription name to open the Defender Plans settings

    2. In the settings on the left, click Continuous Export

    Ensure that Export enabled is set to On and delivering at least Security Alerts

    (Medium and High) to an Event Hub or Log Analytics Workspace which is tied to a

    SIEM that is configured to monitor and alert for security alerts.'
  remediation: 'Connect Microsoft Defender for Cloud to a SIEM such as Microsoft Sentinel or another

    log analytics solution.

