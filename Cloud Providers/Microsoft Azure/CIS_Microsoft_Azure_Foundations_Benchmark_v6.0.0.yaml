    any subscription or management group level within the tenant. Due to its high privilege level, this role assignment should
    be removed immediately after completing the necessary changes at the root scope to minimize security risks.
  rationale: The User Access Administrator role provides extensive access control privileges. Unnecessary assignments heighten
    the risk of privilege escalation and unauthorized access. Removing the role immediately after use minimizes security exposure.
  impact: Increased administrative effort to manage and remove role assignments appropriately.
  references:
