- id: 6.1.5
  title: Ensure Basic, Free, and Consumption SKUs are not used on Production artifacts requiring monitoring and SLA
  scoring: manual
  profile:
  - Level 2
  description: The use of Basic, Free, or Consumption SKUs in Azure, whilst cost effective, have significant limitations in
    terms of what can be monitored and what support can be realized from Microsoft. Typically, these SKUs do not have a service
    SLA and Microsoft may refuse to provide support for them. Furthermore, they offer reduced or no high availability guarantees
    and have limited observability and diagnostic capabilities. As a result, Microsoft may limit or refuse support for workloads
    running on these SKUs. Consequently Basic, Free, or Consumption SKUs should never be used for production workloads unless
    your organization explicitly approved it as an exception. While an automated assessment procedure exists for this recommendation,
    the assessment status remains manual. Determining appropriate SKUs depends on the context and requirements of each organization
    and environment.
  rationale: 'Typically, production workloads need to be continuously monitored and have high availability and resilience,
    and they should have an SLA with Microsoft. Using Basic, Free, or Consumption SKUs for deployed Azure services generally
    prevents these requirements from being met. Therefore, production workloads must use Standard or higher SKUs to ensure
    operational reliability, and supportability. The following Azure resource types must use Standard SKUs (or higher) at
    a minimum when deployed in production environments: • Public IP Addresses • Network Load Balancers • Azure Cache for Redis
    • Azure SQL (PaaS Databases) • VPN Gateways • Azure Bastion • Application Gateway • Virtual Network Gateway (VPN) • Azure
    Container Registry • Event Hubs • Service Bus • API Management • Azure Monitor (Log Analytics) Using Basic, Free, or Consumption
    SKUs for any of the above services typically removes SLA guarantees, high availability, and operational visibility such
    as monitoring and diagnostics, which are usually considered mandatory requirements for production environments.'
  impact: 'Enforcing Standard (or higher) SKUs for production environments has the following impacts: 1. There will be a cost
    increase compared to Basic or Free SKUs. 2. Improved reliability, monitoring, and Microsoft SLA coverage will be available
    and will provide enterprise-grade support for the production service and compliance with production readiness standards.
    All Azure resources must be clearly classified as Production or Non-Production by one or more of the following mechanisms:
    • Mandatory tags (e.g., Environment=Production) • Separation via Management Groups • Dedicated Subscriptions'
  references:
  - 1. https://azure.microsoft.com/en-us/support/plans
  - 2. https://azure.microsoft.com/en-us/support/plans/response/
  page_start: 206
  audit_raw: "This needs to be audited by Azure Policy (one for each resource type) and denied for\neach artifact that is\
    \ production.\nAudit from Azure Portal\n1. Open Azure Resource Graph Explorer\n2. Click New query\n3. Paste the following\
    \ into the query window:\nResources\n| where isnotnull(sku)\n| where sku.name =~ 'Basic'\n or sku.tier =~ 'Basic'\n or\
    \ sku.name =~ 'Free'\n or sku.tier =~ 'Free'\n or sku.name =~ 'Consumption'\n or sku.tier =~ 'Consumption'\n| order by\
    \ type\n4. Click Run query then evaluate the results in the results window.\n5. Ensure that no production artifacts are\
    \ returned.\nIf production workload or environment tags exist, use the following query and edit the\ntag name and value\
    \ in Environment and Production to reflect your tagging standard:\nResources\n| where tostring(tags.Environment) =~ 'Production'\n\
    | where isnotnull(sku)\n| where sku.name =~ 'Basic'\n or sku.tier =~ 'Basic'\n or sku.name =~ 'Free'\n or sku.tier =~\
    \ 'Free'\n or sku.name =~ 'Consumption'\n or sku.tier =~ 'Consumption'\n| order by type\nAudit from Azure CLI\naz graph\
    \ query -q \"\nResources\n| where isnotnull(sku)\n| where sku.name =~ 'Basic'\n or sku.tier =~ 'Basic'\n or sku.name =~\
    \ 'Free'\n or sku.tier =~ 'Free'\n or sku.name =~ 'Consumption'\n or sku.tier =~ 'Consumption'\n| order by type\n\"\n\
    Alternatively, to filter on a specific resource group:\naz graph query -q \"\nResources\n| where resourceGroup == '<resourceGroupName>'\n\
    | where isnotnull(sku)\n| where sku.name =~ 'Basic'\n or sku.tier =~ 'Basic'\n or sku.name =~ 'Free'\n or sku.tier =~\
    \ 'Free'\n or sku.name =~ 'Consumption'\n or sku.tier =~ 'Consumption'\n| order by type\n\"\nEnsure that no production\
    \ artifacts are returned.\nIf production workload or environment tags exist, use the following query and edit the\ntag\
    \ name and value in Environment and Production to reflect your tagging standard:\naz graph query -q \"\nResources\n| where\
    \ tostring(tags.Environment) =~ 'Production'\n| where isnotnull(sku)\n| where sku.name =~ 'Basic'\n or sku.tier =~ 'Basic'\n\
    \ or sku.name =~ 'Free'\n or sku.tier =~ 'Free'\n or sku.name =~ 'Consumption'\n or sku.tier =~ 'Consumption'\n| order\
    \ by type\n\"\nAudit from PowerShell\nGet-AzResource |\nWhere-Object {\n $_.Sku -and (\n $_.Sku.Name -in @(\"Basic\",\"\
    Free\",\"Consumption\") -or\n $_.Sku.Tier -in @(\"Basic\",\"Free\",\"Consumption\")\n )\n}\nIf production workload or\
    \ environment tags exist, use the following query and edit the\ntag name and value in Environment and Production to reflect\
    \ your tagging standard:\nGet-AzResource |\nWhere-Object {\n $_.Tags.Environment -eq \"Production\" -and\n $_.Sku -and\
    \ (\n $_.Sku.Name -in @(\"Basic\",\"Free\",\"Consumption\") -or\n $_.Sku.Tier -in @(\"Basic\",\"Free\",\"Consumption\"\
    )\n )\n}\nEnsure that no production artifacts are returned."
  remediation: 'Each resource has its own process for upgrading from Basic/Free/Consumption to

    Standard (or higher) SKUs. Follow the official Microsoft documentation for the relevant

    service.

    • Public IP Address: https://learn.microsoft.com/en-us/azure/virtual-network/ipservices/public-ip-upgrade.

    • Basic Load Balancer: https://learn.microsoft.com/en-us/azure/load-balancer/loadbalancer-basic-upgrade-guidance.

    • Azure Cache for Redis: https://learn.microsoft.com/en-us/azure/azure-cache-forredis/cache-how-to-scale.

    • Azure SQL Database: https://learn.microsoft.com/en-us/azure/azuresql/database/scale-resources.

    • VPN Gateway: https://learn.microsoft.com/en-us/azure/vpn-gateway/gatewaysku-resize.

    • Virtual Network Gateway (VPN): https://learn.microsoft.com/azure/vpngateway/gateway-sku-resize

    • Azure Bastion: https://learn.microsoft.com/azure/bastion/bastion-faq#is-there-abasic-sku (No Basic SKU exists; upgrade
    = redeploy with Standard SKU.

    Developer tier is not supported for production; deploy using Standard SKU.)

    • Application Gateway: https://learn.microsoft.com/azure/applicationgateway/upgrade-application-gateway

    • Azure Container Registry: https://learn.microsoft.com/azure/containerregistry/container-registry-skus

    • Event Hubs: https://learn.microsoft.com/azure/event-hubs/event-hubs-scale

    • Service Bus: https://learn.microsoft.com/azure/service-bus-messaging/servicebus-scaling

    • API Management: https://learn.microsoft.com/azure/api-management/upgradeand-scale

    • Azure Monitor (Log Analytics Workspace):

    https://learn.microsoft.com/azure/azure-monitor/logs/cost-logs#pricing-tiers (The

    legacy Free tier cannot be upgraded. A new workspace must be created using

    the Pay-As-You-Go or Commitment Tier pricing model.)'
  checks:
  - type: manual_review
    info: "This needs to be audited by Azure Policy (one for each resource type) and denied for\neach artifact that is production.\n\
      Audit from Azure Portal\n1. Open Azure Resource Graph Explorer\n2. Click New query\n3. Paste the following into the\
      \ query window:\nResources\n| where isnotnull(sku)\n| where sku.name =~ 'Basic'\n or sku.tier =~ 'Basic'\n or sku.name\
      \ =~ 'Free'\n or sku.tier =~ 'Free'\n or sku.name =~ 'Consumption'\n or sku.tier =~ 'Consumption'\n| order by type\n\
      4. Click Run query then evaluate the results in"
    severity: medium
- id: '6.2'
  title: Ensure that Resource Locks are set for Mission-Critical Azure Resources
  scoring: manual
  profile:
  - Level 2
  description: Resource Manager Locks provide a way for administrators to lock down Azure resources to prevent deletion of,
    or modifications to, a resource. These locks sit outside of the Role Based Access Controls (RBAC) hierarchy and, when
    applied, will place restrictions on the resource for all users. These locks are very useful when there is an important
    resource in a subscription that users should not be able to delete or change. Locks can help prevent accidental and malicious
    changes or deletion. While an automated assessment procedure exists for this recommendation, the assessment status remains
    manual. Determining resources that require resource locks depends on the context and requirements of each organization
    and environment.
  rationale: As an administrator, it may be necessary to lock a subscription, resource group, or resource to prevent other
    users in the organization from accidentally deleting or modifying critical resources. The lock level can be set to to
    CanNotDelete or ReadOnly to achieve this purpose. • CanNotDelete means authorized users can still read and modify a resource,
    but they cannot delete the resource. • ReadOnly means authorized users can read a resource, but they cannot delete or
    update the resource. Applying this lock is similar to restricting all authorized users to the permissions granted by the
    Reader role.
  impact: There can be unintended outcomes of locking a resource. Applying a lock to a parent service will cause it to be
    inherited by all resources within. Conversely, applying a lock to a resource may not apply to connected storage, leaving
    it unlocked. Please see the documentation for further information.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/azure-resourcemanager/management/lock-resources
  - 2. https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landingzone/design-area/management-platform#inventory-and-visibilityrecommendations
  page_start: 212
  audit_raw: "Audit from Azure Portal\n1. Navigate to the specific Azure Resource or Resource Group.\n2. Click on Locks.\n\
    3. Ensure the lock is defined with name and description, with type Read-only or\nDelete as appropriate.\nAudit from Azure\
    \ CLI\nReview the list of all locks set currently:\naz lock list --resource-group <resourcegroupname> --resource-name\n\
    <resourcename> --namespace <Namespace> --resource-type <type> --parent \"\"\nAudit from PowerShell\nRun the following\
    \ command to list all resources and loop through those resources to\ncheck for applied locks. Requires Az PowerShell Module\
    \ (not supported in Graph\nPowerShell at this time).\nConnect-AzAccount\n$resources = Get-AzResource\n$complianceResults\
    \ = @()\nforeach ($resource in $resources) {\n $locks = Get-AzResourceLock -ResourceName $resource.Name `\n -ResourceType\
    \ $resource.ResourceType `\n -ResourceGroupName\n$resource.ResourceGroupName\n foreach ($lock in $locks) {\n $isCompliant\
    \ = $false\n if ($lock.Properties.Level -eq \"CanNotDelete\" -or\n$lock.Properties.Level -eq \"ReadOnly\") {\n $isCompliant\
    \ = $true\n }\n $complianceResults += [PSCustomObject]@{\n ResourceName = $resource.Name\n ResourceGroup = $resource.ResourceGroupName\n\
    \ ResourceType = $resource.ResourceType\n LockName = $lock.Name\n LockLevel = $lock.Properties.Level\n Compliant = $isCompliant\n\
    \ }\n }\n}\n$complianceResults | Format-Table -AutoSize\nReview the output of the Properties setting. Compliant settings\
    \ will have the\nCanNotDelete or ReadOnly value."
  remediation: 'Remediate from Azure Portal

    1. Navigate to the specific Azure Resource or Resource Group.

    2. For each mission critical resource, click on Locks.

    3. Click Add.

    4. Give the lock a name and a description, then select the type, Read-only or

    Delete as appropriate.

    5. Click OK.

    Remediate from Azure CLI

    To lock a resource, provide the name of the resource, its resource type, and its

    resource group name.

    az lock create --name <LockName> --lock-type <CanNotDelete/Read-only> --

    resource-group <resourceGroupName> --resource-name <resourceName> --resourcetype <resourceType>

    Remediate from PowerShell

    Get-AzResourceLock -ResourceName <Resource Name> -ResourceType <Resource

    Type> -ResourceGroupName <Resource Group Name> -Locktype <CanNotDelete/Readonly>'
