  title: Ensure 'SMB protocol version' is Set to 'SMB 3.1.1' or Higher for SMB file shares
  scoring: scored
  profile:
  - Level 1
  description: Ensure that SMB file shares are configured to use the latest supported SMB protocol version. Keeping the SMB
    protocol updated helps mitigate risks associated with older SMB versions, which may contain vulnerabilities and lack essential
    security controls.
  rationale: Using the latest supported SMB protocol version enhances the security of SMB file shares by preventing the exploitation
    of known vulnerabilities in outdated SMB versions.
  impact: Using the latest SMB protocol version may impact client compatibility.
  references:
