- id: '7.8'
  title: Ensure that Virtual Network Flow Log Retention Days is Set to Greater than or Equal to 90
  scoring: scored
  profile:
  - Level 2
  description: Ensure that virtual network flow logs are retained for greater than or equal to 90 days. Enable only 'Azure
    Active Directory' (Microsoft Entra ID) authentication for Azure VPN Gateway point-to-site connections.
  rationale: Virtual network flow logs provide critical visibility into traffic patterns. Logs can be used to check for anomalies
    and give insight into suspected breaches. Microsoft Entra ID authentication provides strong security and centralized identity
    management, and reduces risks associated with static credentials and certificate management.
  impact: • Virtual network flow logs are charged per gigabyte of network flow logs collected and come with a free tier of
    5 GB/month per subscription. • If traffic analytics is enabled with virtual network flow logs, traffic analytics pricing
    applies at per gigabyte processing rates. • The storage of logs is charged separately, and the cost will depend on the
    amount of logs and the retention period. Azure VPN Gateways incur hourly charges, with additional costs for point-to-site
    connections and data transfer. Pricing varies by SKU and usage. Refer to https://azure.microsoft.com/en-us/pricing/details/vpn-gateway/
    for details.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-manage
  - 2. https://learn.microsoft.com/en-us/cli/azure/network/watcher/flow-log
  - 1. https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-aboutvpngateways
  - 2. https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-entra-gateway
  page_start: 240
  audit_raw: 'Audit from Azure Portal

    1. Go to Network Watcher.

    2. Under Logs, select Flow logs.

    3. Click Add filter.

    4. From the Filter drop-down menu, select Flow log type.

    5. From the Value drop-down menu, check Virtual network only.

    6. Click Apply.

    7. Click the name of a virtual network flow log.

    8. Under Storage Account, ensure that Retention days is set to 0, 90, or a

    number greater than 90. If Retention days is set to 0, the logs are retained

    indefinitely with no retention policy.

    9. Repeat steps 7 and 8 for each virtual network flow log.

    Audit from Azure CLI

    Run the following command to list network watchers:

    az network watcher list

    Run the following command to list the name and retention policy of flow logs in a

    network watcher:

    az network watcher flow-log list --location <location> --query

    [*].[name,retentionPolicy]

    For each flow log, ensure that days is set to 0, 90, or a number greater than 90. If days

    is set to 0, the logs are retained indefinitely with no retention policy.

    Repeat for each network watcher.

    Audit from Azure Portal

    1. Go to Virtual network gateways.

    2. Under VPN gateway, click VPN gateways.

    3. Click the name of a VPN gateway.

    4. Under Settings, click Point-to-site configuration.

    5. Ensure Authentication type is set to Azure Active Directory only.

    6. Repeat steps 1-5 for each VPN gateway.

    Audit from CLI

    az network vnet-gateway show -g <rg> -n <name> --query

    "vpnClientConfiguration.vpnAuthenticationTypes"

    Each gateway''s vpnClientConfiguration.vpnAuthenticationTypes array tells you the auth

    method. The check passes when it equals ["AAD"] (Azure Active Directory only).

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 21a6bc25-125e-4d13-b82d-2e19b7208ab7 - Name: ''VPN gateways

    should use only Azure Active Directory (Azure AD) authentication for point-to-site

    users'''
  remediation: 'Remediate from Azure Portal

    1. Go to Network Watcher.

    2. Under Logs, select Flow logs.

    3. Click Add filter.

    4. From the Filter drop-down menu, select Flow log type.

    5. From the Value drop-down menu, check Virtual network only.

    6. Click Apply.

    7. Click the name of a virtual network flow log.

    8. Under Storage Account, set Retention days to 0, 90, or a number greater

    than 90. If Retention days is set to 0, the logs are retained indefinitely with no

    retention policy.

    9. Repeat steps 7 and 8 for each virtual network flow log requiring remediation.

    Remediate from Azure CLI

    Run the following command update the retention policy for a flow log in a network

    watcher, setting retention to 0, 90, or a number greater than 90:

    az network watcher flow-log update --location <location> --name <flow-log> --

    retention <number-of-days>

    Repeat for each virtual network flow log requiring remediation.

    Remediate from Azure Portal

    1. Go to Virtual network gateways.

    2. Under VPN gateway, click VPN gateways.

    3. Click the name of a VPN gateway.

    4. Under Settings, click Point-to-site configuration.

    5. Ensure Authentication type click to expand the drop-down menu.

    6. Check the box next to Azure Active Directory, and uncheck the boxes next

    to Azure certificate and RADIUS authentication.

    7. Provide a Tenant, Audience, and Issuer for the Azure Active Directory

    configuration.

    8. Click Save.

    9. Repeat steps 1-8 for each VPN gateway requiring remediation.'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

