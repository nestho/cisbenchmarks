- id: 8.1.5.2
  title: Ensure Advanced Threat Protection Alerts for Storage Accounts Are Monitored
  scoring: manual
  profile:
  - Level 2
  description: After enabling Microsoft Defender for Storage, configure an alert monitoring and response process to ensure
    that alerts are actioned in a timely manner. Integrate with SIEM solutions like Microsoft Sentinel, or configure email/webhook
    notifications to security teams.
  rationale: Enabling Microsoft Defender for Storage without a monitoring process limits its value. Continuous monitoring
    and alert triage ensure that detected threats are acted upon quickly, reducing risk exposure.
  impact: 'Requires integration effort with SIEM or alerting tools and a defined incident response process. The amount of
    data logged and, thus, the cost incurred can vary significantly depending on the tenant size and the applications in your
    tenant that interact with the Microsoft Graph APIs. See the following pricing calculations for respective services: •
    Log Analytics: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/costlogs#pricing-model. • Azure Storage: https://azure.microsoft.com/en-us/pricing/details/storage/blobs/.
    • Event Hubs: https://azure.microsoft.com/en-us/pricing/details/event-hubs/.'
  references:
