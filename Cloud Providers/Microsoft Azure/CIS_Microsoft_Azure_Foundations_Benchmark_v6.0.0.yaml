- id: 9.3.9
  title: Ensure Azure Resource Manager Delete Locks are Applied to Azure Storage Accounts
  scoring: manual
  profile:
  - Level 1
  description: Azure Resource Manager CannotDelete (Delete) locks can prevent users from accidentally or maliciously deleting
    a storage account. This feature ensures that while the Storage account can still be modified or used, deletion of the
    Storage account resource requires removal of the lock by a user with appropriate permissions. This feature is a protective
    control for the availability of data. By ensuring that a storage account or its parent resource group cannot be deleted
    without first removing the lock, the risk of data loss is reduced. While an automated assessment procedure exists for
    this recommendation, the assessment status remains manual. Determining storage accounts that require CannotDelete locks
    depends on the context and requirements of each organization and environment.
  rationale: Applying a Delete lock on storage accounts protects the availability of data by preventing the accidental or
    unauthorized deletion of the entire storage account. It is a fundamental protective control that can prevent data loss
  impact: • Prevents the deletion of the Storage account Resource entirely. • Prevents the deletion of the parent Resource
    Group containing the locked Storage account resource. • Does not prevent other control plane operations, including modification
    of configurations, network settings, containers, and access. • Does not prevent deletion of containers or other objects
    within the storage account.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/common/lock-account-resource
  - 2. https://learn.microsoft.com/en-us/azure/azure-resourcemanager/management/lock-resources
  page_start: 476
  audit_raw: "Audit from Azure Portal\n1. Navigate to the storage account in the Azure portal.\n2. For each storage account,\
    \ under Settings, click Locks.\n3. Ensure that a Delete lock exists on the storage account.\nAudit from Azure CLI\naz\
    \ lock list --resource-group <resource-group> \\\n --resource-name <storage-account> \\\n --resource-type \"Microsoft.Storage/storageAccounts\"\
    \nAudit from PowerShell\nGet-AzResourceLock -ResourceGroupName <RESOURCEGROUPNAME> `\n -ResourceName <STORAGEACCOUNTNAME>\
    \ `\n -ResourceType \"Microsoft.Storage/storageAccounts\"\nAudit from Azure Policy\nThere is currently no built-in Microsoft\
    \ policy to audit resource locks on storage\naccounts. Custom and community policy definitions can check for the existence\
    \ of a\n“Microsoft.Authorization/locks” resource with an AuditIfNotExists effect."
  remediation: "Remediate from Azure Portal\n1. Navigate to the storage account in the Azure portal.\n2. Under the Settings\
    \ section, select Locks.\n3. Select Add.\n4. Provide a Name, and choose Delete for the type of lock.\n5. Add a note about\
    \ the lock if desired.\nRemediate from Azure CLI\nReplace the information within <> with appropriate values:\naz lock\
    \ create --name <lock> \\\n --resource-group <resource-group> \\\n --resource <storage-account> \\\n --lock-type CanNotDelete\
    \ \\\n --resource-type Microsoft.Storage/storageAccounts\nRemediate from PowerShell\nReplace the information within <>\
    \ with appropriate values:\nNew-AzResourceLock -LockLevel CanNotDelete `\n -LockName <lock> `\n -ResourceName <storage-account>\
    \ `\n -ResourceType Microsoft.Storage/storageAccounts `\n -ResourceGroupName <resource-group>"
