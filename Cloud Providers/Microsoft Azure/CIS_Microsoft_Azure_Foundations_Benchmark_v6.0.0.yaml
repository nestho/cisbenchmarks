- id: '5.5'
  title: Ensure that a Custom Role is Assigned Permissions for Administering Resource Locks
  scoring: manual
  profile:
  - Level 2
  description: Resource locking is a powerful protection mechanism that can prevent inadvertent modification or deletion of
    resources within Azure subscriptions and resource groups, and it is a recommended NIST configuration. Users who are set
    as subscription owners are able to make administrative changes to the subscriptions and move them into and out of Microsoft
    Entra ID.
  rationale: Given that the resource lock functionality is outside of standard Role-Based Access Control (RBAC), it would
    be prudent to create a resource lock administrator role to prevent inadvertent unlocking of resources. Permissions to
    move subscriptions in and out of a Microsoft Entra tenant must only be given to appropriate administrative personnel.
    A subscription that is moved into a Microsoft Entra tenant may be within a folder to which other users have elevated permissions.
    This prevents loss of data or unapproved changes of the objects within by potential bad actors.
  impact: By adding this role, specific permissions may be granted for managing only resource locks rather than needing to
    provide the broad Owner or User Access Administrator role, reducing the risk of the user being able to cause unintentional
    damage. Subscriptions will need to have these settings turned off to be moved.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/role-based-access-control/custom-roles
  - 2. https://learn.microsoft.com/en-us/azure/role-based-access-control/check-access
  - 1. https://learn.microsoft.com/en-us/azure/cost-managementbilling/manage/manage-azure-subscription-policy
  - 2. https://learn.microsoft.com/en-us/entra/fundamentals/how-subscriptionsassociated-directory
  page_start: 108
  audit_raw: 'Audit from Azure Portal

    1. In the Azure portal, navigate to a subscription or resource group.

    2. Click Access control (IAM).

    3. Click Roles.

    4. Click Type : All.

