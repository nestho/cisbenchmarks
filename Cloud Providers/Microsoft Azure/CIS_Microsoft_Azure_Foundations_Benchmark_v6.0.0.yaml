- id: 6.1.1.2
  title: Ensure Diagnostic Setting Captures Appropriate Categories
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: 'Prerequisite: A Diagnostic Setting must exist. If a Diagnostic Setting does not exist, the navigation and
    options within this recommendation will not be available. Please review the recommendation at the beginning of this subsection
    titled: "Ensure that a ''Diagnostic Setting'' exists." The diagnostic setting should be configured to log the appropriate
    activities from the control/management plane. Customer-managed keys introduce additional depth to security by providing
    a means to manage access control for encryption keys. Where compliance and security frameworks indicate the need, and
    organizational capacity allows, sensitive data at rest can be encrypted using customer-managed keys (CMK) rather than
    Microsoft-managed keys.'
  rationale: A diagnostic setting controls how the diagnostic log is exported. Capturing the diagnostic setting categories
    for appropriate control/management plane activities allows proper alerting. By default in Azure, data at rest tends to
    be encrypted using Microsoft-managed keys. If your organization wants to control and manage encryption keys for compliance
    and defense-in-depth, customer-managed keys can be established. Configuring the storage account with the activity log
    export container to use CMKs provides additional confidentiality controls on log data, as a given user must have read
    permission on the corresponding storage account and must be granted decrypt permission by the CMK. While it is possible
    to automate the assessment of this recommendation, the assessment status for this recommendation remains 'Manual' due
    to ideally limited scope. The scope of application—which workloads CMK is applied to—should be carefully considered to
    account for organizational capacity and targeted to workloads with specific need for CMK.
  impact: If the key expires due to setting the 'activation date' and 'expiration date', the key must be rotated manually.
    Using customer-managed keys may also incur additional man-hour requirements to create, store, manage, and protect the
    keys as needed.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/diagnosticsettings
  - 2. https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/resourcemanager-diagnostic-settings
  - 1. https://learn.microsoft.com/en-us/azure/security/fundamentals/data-encryptionbest-practices#protect-data-at-rest
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-dataprotection#dp-5-use-customer-managed-key-option-in-data-at-rest-encryptionwhen-required
  page_start: 125
