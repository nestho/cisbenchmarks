- id: 8.3.2
  title: Ensure that the Expiration Date is set for All Keys in Key Vaults using access policies (legacy)
  scoring: scored
  profile:
  - Level 1
  description: 'Ensure that all Keys in Azure Key Vaults with access policies have an expiration date set. Note: Using access
    policies is a legacy method. For improved security, use the RoleBased Access Control (RBAC) permission model instead of
    access policies when managing Azure Key Vault. RBAC restricts permission management to only the Owner and User Access
    Administrator roles, ensuring a clear separation between security and administrative tasks. With the Access Policy permission
    model, users with the Contributor, Key Vault Contributor, or any role that includes Microsoft.KeyVault/vaults/write permissions
    can grant themselves data plane access by configuring a Key Vault access policy. This can result in unauthorized access
    and management of your key vaults, keys, secrets, and certificates. To reduce this risk, limit Contributor role access
    to key vaults when using the Access Policy model.'
  rationale: Azure Key Vault enables users to store and use cryptographic keys within the Microsoft Azure environment. The
    exp (expiration date) attribute identifies the expiration date on or after which the key MUST NOT be used for a cryptographic
    operation. By default, keys never expire. It is thus recommended that keys be rotated in the key vault and set an explicit
    expiration date for all keys. This ensures that the keys cannot be used beyond their assigned lifetimes.
  impact: Keys cannot be used beyond their assigned expiration dates respectively. Keys need to be rotated periodically wherever
    they are used.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/key-vault/general/basic-concepts
  - 2. https://learn.microsoft.com/en-us/azure/key-vault/general/about-keys-secretscertificates
