- id: 2.1.9
  title: Ensure 'No Public IP' is Set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: Enable secure cluster connectivity (also known as no public IP) on Azure Databricks workspaces to ensure that
    clusters do not have public IP addresses and communicate with the control plane over a secure connection.
  rationale: Enabling secure cluster connectivity limits exposure to the public internet, improving security and reducing
    the risk of external attacks.
  impact: Enabling secure cluster connectivity requires careful network configuration. Before secure cluster connectivity
    can be enabled, Azure Databricks workspaces must be deployed in a customer-managed virtual network (VNet injection)—refer
    to the recommendation Ensure that Azure Databricks is deployed in a customermanaged virtual network (VNet).
  references:
  - 1. https://learn.microsoft.com/enus/azure/databricks/security/network/classic/secure-cluster-connectivity
  - 2. https://learn.microsoft.com/en-us/cli/azure/databricks/workspace
