    • Policy ID: 51c1490f-3319-459c-bbbc-7f391bbed753 - Name: ''Azure Databricks

    Clusters should disable public IP'''
  remediation: 'Remediate from Azure Portal

    1. Go to Azure Databricks.

    2. Click the name of a workspace.

    3. Under Settings, click Networking.

    4. Under Network access, next to Deploy Azure Databricks workspace with

    Secure Cluster Connectivity (No Public IP), click the radio button next

    to Enabled.

    5. Click Save.

    6. Repeat steps 1-5 for each workspace requiring remediation.

