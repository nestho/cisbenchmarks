- id: '3.10'
  title: Ensure Private Endpoints are used to access Storage Accounts
  scoring: manual
  profile:
  - Level 1
  description: Use private endpoints for your Azure Storage accounts to allow clients and services to securely access data
    located over a network via an encrypted Private Link. To do this, the private endpoint uses an IP address from the VNet
    for each service. Network traffic between disparate services securely traverses encrypted over the VNet. This VNet can
    also link addressing space, extending your network and accessing resources on it. Similarly, it can be a tunnel through
    public networks to connect remote infrastructures together. This creates further security through segmenting network traffic
    and preventing outside sources from accessing it.
  rationale: Securing traffic between services through encryption protects the data from easy interception and reading.
  impact: There is no cost in deploying VNets between Azure resources. If improperly implemented, it may result in loss of
    critical network traffic.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/storage-privateendpoints
  - 2. https://docs.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview
  page_start: 217
  audit_raw: 'From Azure Portal

    1. Open the Storage Accounts blade.

    2. For each list Storage Account, perform the following check:

    3. Under the Security + networking heading, click on Networking.

    4. Click on the Private Endpoint Connections tab at the top of the networking

    window.

    5. Ensure that for each VNet that the Storage Account must be accessed from, a

    unique Private Endpoint is deployed and the Connection State for each Private

    Endpoint is Approved

    Repeat the procedure for each Storage Account.'
  remediation: 'From Azure Portal

