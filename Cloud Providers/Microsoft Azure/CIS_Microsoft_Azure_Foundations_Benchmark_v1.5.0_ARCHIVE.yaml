      \ opens up, view under the Security heading whether\n'Infrastructure Encryption' is set to 'Enabled'.\nFrom Azure CLI\n\
      az storage blob show \\\n --account-name <storage-account> \\\n --container-name <container> \\\n --name <blob> \\\n\
      \ --query \"properties.serverEncrypted\"\nFrom Powersh"
