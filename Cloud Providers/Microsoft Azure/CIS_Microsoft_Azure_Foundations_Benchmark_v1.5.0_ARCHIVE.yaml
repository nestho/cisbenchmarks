- id: '1.22'
  title: Ensure that 'Require Multi-Factor Authentication to register or join devices with Azure AD' is set to 'Yes'
  scoring: manual
  profile:
  - Level 1
  description: Joining or registering devices to the active directory should require Multi-factor authentication.
  rationale: 'Multi-factor authentication is recommended when adding devices to Azure AD. When set to Yes, users who are adding
    devices from the internet must first use the second method of authentication before their device is successfully added
    to the directory. This ensures that rogue devices are not added to the domain using a compromised user account. Note:
    Some Microsoft documentation suggests to use conditional access policies for joining a domain from certain whitelisted
    networks or devices. Even with these in place, using Multi-Factor Authentication is still recommended, as it creates a
    process for review before joining the domain.'
  impact: A slight impact of additional overhead, as Administrators will now have to approve every access to the domain.
