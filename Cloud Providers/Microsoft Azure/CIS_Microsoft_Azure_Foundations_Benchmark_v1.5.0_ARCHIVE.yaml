- id: '3.2'
  title: Ensure that ‘Enable Infrastructure Encryption’ for Each Storage Account in Azure Storage is Set to ‘enabled’
  scoring: manual
  profile:
  - Level 2
  description: Enabling double encryption at the hardware level on top of the default software encryption for Storage Accounts
    accessing Azure storage solutions.
  rationale: Azure Storage automatically encrypts all data in a storage account at the network level using 256-bit AES encryption,
    which is one of the strongest, FIPS 140-2-compliant block ciphers available. Customers who require higher levels of assurance
    that their data is secure can also enable 256-bit AES encryption at the Azure Storage infrastructure level for double
    encryption. Double encryption of Azure Storage data protects against a scenario where one of the encryption algorithms
    or keys may be compromised. Similarly, data is encrypted even before network transmission and in all backups. In this
    scenario, the additional layer of encryption continues to protect your data. For the most secure implementation of key
    based encryption, it is recommended to use a Customer Managed asymmetric RSA 2048 Key in Azure Key Vault.
  impact: The read and write speeds to the storage will be impacted if both default encryption and Infrastructure Encryption
    are checked, as a secondary form of encryption requires more resource overhead for the cryptography of information. This
    performance impact should be considered in an analysis for justifying use of the feature in your environment. Customer-managed
    keys are recommended for the most secure implementation, leading to overhead of key management. The key will also need
    to be backed up in a secure location, as loss of the key will mean loss of the information in the storage.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/blobs/storage-blob-encryptionstatus
  - 2. https://docs.microsoft.com/en-us/azure/storage/common/storage-serviceencryption
  page_start: 194
  audit_raw: "From Azure Portal\n1. From Azure Portal select the portal menu in the top left. Find 'Storage Accounts'\nand\
    \ select it.\n2. Click on each storage account within each resource group you wish to audit.\n3. In the overview screen\
    \ that opens up, view under the Security heading whether\n'Infrastructure Encryption' is set to 'Enabled'.\nFrom Azure\
    \ CLI\naz storage blob show \\\n --account-name <storage-account> \\\n --container-name <container> \\\n --name <blob>\
    \ \\\n --query \"properties.serverEncrypted\"\nFrom Powershell\n$account = Get-AzStorageAccount -ResourceGroupName <resource-group>\
    \ `\n -Name <storage-account>\n$blob = Get-AzStorageBlob -Context $account.Context `\n -Container <container> `\n -Blob\
    \ <blob>\n$blob.ICloudBlob.Properties.IsServerEncrypted"
  remediation: "From Azure Portal\n1. When creating a storage account, proceed as normal, but stop on the 'Advanced'\ntab.\n\
    2. Select 'Enabled' next to Infrastructure Encryption.\nFrom Azure CLI\nReplace the information within <> with your values.\n\
    az storage account create \\\n --name <storage-account> \\\n --resource-group <resource-group> \\\n --location <location>\
    \ \\\n --sku Standard_RAGRS \\\n --kind StorageV2 \\\n --require-infrastructure-encryption\nFrom Powershell\nNew-AzStorageAccount\
    \ -ResourceGroupName <resource_group> `\n -AccountName <storage-account> `\n -Location <location> `\n -SkuName \"Standard_RAGRS\"\
    \ `\n -Kind StorageV2 `\n -RequireInfrastructureEncryption\nEnabling Infrastructure Encryption after Storage Account Creation\n\
    If a infrastructure encryption was not enabled on blob storage creation, there is no\nofficial way to enable it. Please\
    \ see the additional information section."
