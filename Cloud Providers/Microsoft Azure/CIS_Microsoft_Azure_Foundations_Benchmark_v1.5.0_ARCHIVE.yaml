- id: '7.6'
  title: '[Legacy] Ensure that VHDs are Encrypted'
  scoring: manual
  profile:
  - Level 2
  description: 'NOTE: This is a legacy recommendation. Managed Disks are encrypted by default and recommended for all new
    VM implementations. VHD (Virtual Hard Disks) are stored in blob storage and are the old-style disks that were attached
    to Virtual Machines. The blob VHD was then leased to the VM. By default, storage accounts are not encrypted, and Microsoft
    Defender will then recommend that the OS disks should be encrypted. Storage accounts can be encrypted as a whole using
    PMK or CMK. This should be turned on for storage accounts containing VHDs.'
  rationale: While it is recommended to use Managed Disks which are encrypted by default, "legacy" VHDs may exist for a variety
    of reasons and may need to remain in VHD format. VHDs are not encrypted by default, so this recommendation intends to
    address the security of these disks. In these niche cases, VHDs should be encrypted using the procedures in this recommendation
    to encrypt and protect the data content. If a virtual machine is using a VHD and can be converted to a managed disk, instructions
    for this procedure can be found in the resources section of this recommendation under the title "Convert VHD to Managed
    Disk."
  impact: Depending on how the encryption is implemented will change the size of the impact. If provider-managed keys(PMK)
    are utilized, the impact is relatively low, but processes need to be put in place to regularly rotate the keys. If Customer-managed
    keys(CMK) are utilized, a key management process needs to be implemented to store and manage key rotation, thus the impact
    is medium to high depending on user maturity with key management.
  references:
  - '1. CLI: https://docs.microsoft.com/en-us/azure/virtual-machines/windows/diskencryption-cli-quickstart'
  - '2. Powershell: https://docs.microsoft.com/en-us/azure/virtualmachines/windows/disk-encryption-powershell-quickstart'
  page_start: 396
  audit_raw: 'From Azure CLI

    For each virtual machine identify if the VM is using a legacy VHD by reviewing the VHD

    parameter in the output of the following command. The VHD parameter will contain the

    Storage Account name used for the VHD.

    az vm show --name <MyVM> --resource-group <MyResourceGroup>

    Next, identify if the storage account from the VHD parameter is encrypted by reviewing

    the encryption --> services --> blob --> enabled within the output of the following

    command and make sure its value is True.

    az storage account show --name <storage account name> --resource-group

    <resource group>

    From PowerShell:

    Determine whether the VM is using a VHD for the OS Disk and any Data disks.

    $virtualMachine = Get-AzVM --Name <vm name> --ResourceGroup <resource group

    name> |Select-Object -ExpandProperty StorageProfile

    $virtualMachine.OsDisk

    $virtualMachine.DataDisks

    Next, use the value from VHD to see if the storage blob holding the VHD is encrypted.

    $storageAccount = Get-AzStorageAccount -Name <storage account name from VHD

    setting> -ResourceGroupName <resource group name>

    $storageAccount.Encryption.Services.Blob'
  remediation: 'From Azure Portal

    1. Navigate to the storage account that you wish to encrypt

    2. Select encryption

    3. Select the encryption type that you wish to use

    If you wish to use a Microsoft-managed key (the default), you can save at this point and

    encryption will be applied to the account.

    If you select Customer-managed keys, it will ask for the location of the key (The default is

    an Azure Key Vault) and the key name.

    Once these are captured, save the configuration and the account will be encrypted

    using the provided key.

    From Azure CLI:

    Create the Key Vault

    az keyvault create --name <name> --resource-group <resourceGroup> --location

    <location> --enabled-for-disk-encryption

    Encrypt the disk and store the key in Key Vault

    az vm encryption enable -g <resourceGroup> --name <name> --disk-encryptionkeyvault myKV

    From PowerShell

    This process uses a Key Vault to store the keys

    Create the Key Vault

    New-AzKeyvault -name <name> -ResourceGroupName <resourceGroup> -Location

    <location> -EnabledForDiskEncryption

    Encrypt the disk and store the key in Key Vault

    $KeyVault = Get-AzKeyVault -VaultName <name> -ResourceGroupName

    <resourceGroup>

    Set-AzVMDiskEncryptionExtension -ResourceGroupName <resourceGroup> -VMName

    <name> -DiskEncryptionKeyVaultUrl $KeyVault.VaultUri -

    DiskEncryptionKeyVaultId $KeyVault.ResourceId'
  checks:
  - type: manual_review
    info: 'From Azure CLI

      For each virtual machine identify if the VM is using a legacy VHD by reviewing the VHD

      parameter in the output of the following command. The VHD parameter will contain the

      Storage Account name used for the VHD.

      az vm show --name <MyVM> --resource-group <MyResourceGroup>

      Next, identify if the storage account from the VHD parameter is encrypted by reviewing

      the encryption --> services --> blob --> enabled within the output of the following

      command and make sure its value is True.

      az'
    severity: medium
- id: '8.1'
  title: Ensure that the Expiration Date is set for all Keys in RBAC Key Vaults
  scoring: scored
  profile:
  - Level 1
  description: Ensure that all Keys in Role Based Access Control (RBAC) Azure Key Vaults have an expiration time set.
  rationale: Azure Key Vault enables users to store and use cryptographic keys within the Microsoft Azure environment. The
    exp (expiration time) attribute identifies the expiration time on or after which the key MUST NOT be used for encryption
    of new data, wrapping of new keys, and signing. By default, keys never expire. It is thus recommended that keys be rotated
    in the key vault and set an explicit expiration time for all keys to help enforce the key rotation. This ensures that
    the keys cannot be used beyond their assigned lifetimes.
  impact: Keys cannot be used beyond their assigned expiration times respectively. Keys need to be rotated periodically wherever
    they are used.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/key-vault/key-vault-whatis
  - 2. https://docs.microsoft.com/en-us/rest/api/keyvault/about-keys--secrets-andcertificates#key-vault-keys
  page_start: 401
  audit_raw: 'From Azure Portal

    1. Go to Key vaults

    2. For each Key vault, click on Keys.

    3. Under the Settings section, Make sure Enabled? is set to Yes

    4. Then ensure that each key in the vault has EXPIRATION DATE set as appropriate

    From Azure CLI

    Get a list of all the keyvaults in your Azure environment by running the following

    command:

    az keyvault list

    Then for each keyvault listed ensure that the output of the below command contains

    Key ID (kid), enabled status as true and Expiration date (expires) is not empty or null:

    az keyvault key list --vault-name <KEYVAULTNAME> --query

    ''[*].{"kid":kid,"enabled":attributes.enabled,"expires":attributes.expires}''

    From Powershell

    Retrieve a list of Azure Key Vaults

    Get-AzKeyVault

    For each Key Vault run the following command to determine which vaults are configured

    to use RBAC.

    Get-AzKeyVault -VaultName <Vault Name>

    For each Key Vault with the EnableRbacAuthorizatoin setting set to True, run the

    following command.

    Get-AzKeyVaultKey -VaultName <Vault Name>

    Make sure the Expires setting is configured with a value as appropriate wherever the

    Enabled setting is set to True.'
  remediation: 'From Azure Portal

    1. Go to Key vaults

    2. For each Key vault, click on Keys.

    3. Under the Settings section, Make sure Enabled? is set to Yes

    4. Set an appropriate EXPIRATION DATE on all keys.

    From Azure CLI

    Update the EXPIRATION DATE for the key using below command.

    az keyvault key set-attributes --name <keyName> --vault-name <vaultName> --

    expires Y-m-d''T''H:M:S''Z''

    Note:

    In order to access expiration time on all keys in Azure Key Vault using Microsoft API

    requires "List" Key permission.

    To provide required access follow below steps,

    For Key Vaults using "Key Vault Access Policy"

    1. Go to Key vaults

    2. For each Key vault, click on Access Policy.

    3. Add access policy with Key permission as List

    For Key Vaults using "Role Based Access Control"

    Assign the role of "Key Vault Secrets Officer" to the appropriate user

    From Powershell

    Set-AzKeyVaultKeyAttribute -VaultName <Vault Name> -Name <Key Name> -Expires

    <DateTime>'
  checks:
