- id: '9.10'
  title: Ensure FTP deployments are Disabled
  scoring: scored
  profile:
  - Level 1
  description: By default, Azure Functions, Web, and API Services can be deployed over FTP. If FTP is required for an essential
    deployment workflow, FTPS should be required for FTP login for all App Service Apps and Functions.
  rationale: Azure FTP deployment endpoints are public. An attacker listening to traffic on a wifi network used by a remote
    employee or a corporate network could see login traffic in clear-text which would then grant them full control of the
    code base of the app or service. This finding is more severe if User Credentials for deployment are set at the subscription
    level rather than using the default Application Credentials which are unique per App.
  impact: Any deployment workflows that rely on FTP or FTPs rather than the WebDeploy or HTTPs endpoints may be affected.
  references:
  - 1. [Azure Web Service Deploy via FTP](https://docs.microsoft.com/enus/azure/app-service/deploy-ftp)
  - 2. [Azure Web Service Deployment](https://docs.microsoft.com/en-us/azure/appservice/overview-security)
  page_start: 457
  audit_raw: "From Azure Portal\n1. Go to the Azure Portal\n2. Select App Services\n3. Click on an app\n4. Select Settings\
    \ and then Configuration\n5. Under General Settings, for the Platform Settings, the FTP state should not\nbe set to All\
    \ allowed\nFrom Azure CLI\nList webapps to obtain the ids.\naz webapp list\nList the publish profiles to obtain the username,\
    \ password\nand ftp server url.\naz webapp deployment list-publishing-profiles --ids <ids>\n{\n \"publishUrl\": <URL_FOR_WEB_APP>,\n\
    \ \"userName\": <USER_NAME>,\n \"userPWD\": <USER_PASSWORD>,\n}\nFrom PowerShell\nList all Web Apps:\nGet-AzWebApp\nFor\
    \ each app:\nGet-AzWebApp -ResourceGroupName <resource group name> -Name <app name> |\nSelect-Object -ExpandProperty SiteConfig\n\
    In the output, look for the value of FtpsState. If its value is AllAllowed the setting is out\nof compliance. Any other\
    \ value is considered in compliance with this check."
  remediation: 'From Azure Portal

    1. Go to the Azure Portal

    2. Select App Services

    3. Click on an app

    4. Select Settings and then Configuration

    5. Under General Settings, for the Platform Settings, the FTP state should be

    set to Disabled or FTPS Only

    From Azure CLI

    For each out of compliance application, run the following choosing either ''disabled'' or

    ''FtpsOnly'' as appropriate:

    az webapp config set --resource-group <resource group name> --name <app name>

    --ftps-state [disabled|FtpsOnly]

    From PowerShell

    For each out of compliance application, run the following:

    Set-AzWebApp -ResourceGroupName <resource group name> -Name <app name> -

    FtpsState <Disabled or FtpsOnly>'
