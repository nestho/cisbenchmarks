- id: 5.1.3
  title: Ensure the Storage Container Storing the Activity Logs is not Publicly Accessible
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: The storage account container containing the activity log export should not be publicly accessible. Storage
    accounts with the activity log exports can be configured to use Customer Managed Keys (CMK).
  rationale: Allowing public access to activity log content may aid an adversary in identifying weaknesses in the affected
    account's use or configuration. Configuring the storage account with the activity log export container to use CMKs provides
    additional confidentiality controls on log data, as a given user must have read permission on the corresponding storage
    account and must be granted decrypt permission by the CMK.
  impact: 'Configuring container Access policy to private will remove access from the container for everyone except owners
    of the storage account. Access policy needs to be set explicitly in order to allow access to other desired users. NOTE:
    You must have your key vault setup to utilize this. All Audit Logs will be encrypted with a key you provide. You will
    need to set up customer managed keys separately, and you will select which key to use via the instructions here. You will
    be responsible for the lifecycle of the keys, and will need to manually replace them at your own determined intervals
    to keep the data secure.'
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/blobs/anonymous-read-accessconfigure
  - 2. https://docs.microsoft.com/en-us/security/benchmark/azure/security-controls-v3network-security#ns-2-secure-cloud-services-with-network-controls
  - 1. https://docs.microsoft.com/en-us/security/benchmark/azure/security-controls-v3data-protection#dp-5-encrypt-sensitive-data-at-rest
  page_start: 314
  audit_raw: 'From Azure Portal

