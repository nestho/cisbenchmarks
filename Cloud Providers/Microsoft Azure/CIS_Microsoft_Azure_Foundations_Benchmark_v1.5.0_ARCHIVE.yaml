- id: '1.10'
  title: Ensure That 'Notify all admins when other admins reset their password?' is set to 'Yes'
  scoring: manual
  profile:
  - Level 1
  - Level 2
  description: Ensure that all administrators are notified if any other administrator resets their password. Allow users to
    provide consent for selected permissions when a request is coming from a verified publisher.
  rationale: Administrator accounts are sensitive. Any password reset activity notification, when sent to all administrators,
    ensures that all administrators can passively confirm if such a reset is a common pattern within their group. For example,
    if all administrators change their password every 30 days, any password reset activity before that may require administrator(s)
    to evaluate any unusual activity and confirm its origin. Unless Azure Active Directory is running as an identity provider
    for third-party applications, do not allow users to use their identity outside of the cloud environment. User profiles
    contain private information such as phone numbers and email addresses which could then be sold off to other third parties
    without requiring any further consent from the user.
