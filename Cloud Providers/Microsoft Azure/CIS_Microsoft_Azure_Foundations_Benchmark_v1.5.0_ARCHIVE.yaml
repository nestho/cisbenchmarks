- id: '1.14'
  title: Ensure That ‘Users Can Register Applications’ Is Set to ‘No’
  scoring: manual
  profile:
  - Level 1
  description: 'Require administrators or appropriately delegated users to register third-party applications. Limit guest
    user permissions. authorization related settings across the company. DisplayName : Authorization Policy EnabledPreviewFeatures
    : {} GuestUserRoleId : 10dae51f-b6af-4016-8d668c2a99b929b3 PermissionGrantPolicyIdsAssignedToDefaultUserRole : {user-default-legacy}
    If the GuestUserRoleID property does not equal 2af84b1e-32c8-42b7-82bcdaa82404023b then it is not set to most restrictive.'
  rationale: 'It is recommended to only allow an administrator to register custom-developed applications. This ensures that
    the application undergoes a formal security review and approval process prior to exposing Azure Active Directory data.
    Certain users like developers or other high-request users may also be delegated permissions to prevent them from waiting
    on an administrative user. Your organization should review your policies and decide your needs. Limiting guest access
    ensures that guest accounts do not have permission for certain directory tasks, such as enumerating users, groups or other
    directory resources, and cannot be assigned to administrative roles in your directory. Guest access has three levels of
    restriction. 1. Guest users have the same access as members (most inclusive), 2. Guest users have limited access to properties
    and memberships of directory objects (default value), 3. Guest user access is restricted to properties and memberships
    of their own directory objects (most restrictive). The recommended option is the 3rd, most restrictive: "Guest user access
    is restricted to their own directory object".'
  impact: Enforcing this setting will create additional requests for approval that will need to be addressed by an administrator.
    If permissions are delegated, a user may approve a malevolent third party application, potentially giving it access to
    your data. This may create additional requests for permissions to access resources that administrators will need to approve.
