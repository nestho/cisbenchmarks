- id: '8.5'
  title: Ensure the Key Vault is Recoverable
  scoring: scored
  profile:
  - Level 1
  description: 'The Key Vault contains object keys, secrets, and certificates. Accidental unavailability of a Key Vault can
    cause immediate data loss or loss of security functions (authentication, validation, verification, non-repudiation, etc.)
    supported by the Key Vault objects. It is recommended the Key Vault be made recoverable by enabling the "Do Not Purge"
    and "Soft Delete" functions. This is in order to prevent loss of encrypted data, including storage accounts, SQL databases,
    and/or dependent services provided by Key Vault objects (Keys, Secrets, Certificates) etc. This may happen in the case
    of accidental deletion by a user or from disruptive activity by a malicious user. WARNING: A current limitation of the
    soft-delete feature across all Azure services is role assignments disappearing when Key Vault is deleted. All role assignments
    will need to be recreated after recovery.'
  rationale: 'There could be scenarios where users accidentally run delete/purge commands on Key Vault or an attacker/malicious
    user deliberately does so in order to cause disruption. Deleting or purging a Key Vault leads to immediate data loss,
    as keys encrypting data and secrets/certificates allowing access/services will become non-accessible. There are 2 Key
    Vault properties that play a role in permanent unavailability of a Key Vault: 1. enableSoftDelete: Setting this parameter
    to "true" for a Key Vault ensures that even if Key Vault is deleted, Key Vault itself or its objects remain recoverable
    for the next 90 days. Key Vault/objects can either be recovered or purged (permanent deletion) during those 90 days. If
    no action is taken, key vault and its objects will subsequently be purged. 2. enablePurgeProtection: enableSoftDelete
    only ensures that Key Vault is not deleted permanently and will be recoverable for 90 days from date of deletion. However,
    there are scenarios in which the Key Vault and/or its objects are accidentally purged and hence will not be recoverable.
    Setting enablePurgeProtection to "true" ensures that the Key Vault and its objects cannot be purged. Enabling both the
    parameters on Key Vaults ensures that Key Vaults and their objects cannot be deleted/purged permanently.'
  impact: Once purge-protection and soft-delete are enabled for a Key Vault, the action is irreversible.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/key-vault/key-vault-soft-delete-cli
  - 2. https://blogs.technet.microsoft.com/kv/2017/05/10/azure-key-vault-recoveryoptions/
  page_start: 413
  audit_raw: 'From Azure Portal

    1. Go to Key Vaults

