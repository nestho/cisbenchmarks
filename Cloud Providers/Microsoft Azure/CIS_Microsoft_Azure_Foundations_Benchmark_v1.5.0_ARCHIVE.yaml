- id: '1.16'
  title: Ensure that 'Guest invite restrictions' is set to "Only users assigned to specific admin roles can invite guest users"
  scoring: manual
  profile:
  - Level 2
  description: Restrict invitations to users with specific administrative roles only.
  rationale: Restricting invitations to users with specific administrator roles ensures that only authorized accounts have
    access to cloud resources. This helps to maintain "Need to Know" permissions and prevents inadvertent access to data.
    By default the setting Guest invite restrictions is set to Anyone in the organization can invite guest users including
    guests and non-admins. This would allow anyone within the organization to invite guests and non-admins to the tenant,
    posing a security risk.
  impact: With the option of Only users assigned to specific admin roles can invite guest users selected, users with specific
    admin roles will be in charge of sending invitations to the Azure Workspace, requiring additional overhead by them to
    manage user accounts. This will mean coordinating with other departments as they are onboarding new users, and manually
    removing access from users who no longer need it.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/active-directory-b2bdelegate-invitations
  - 2. https://docs.microsoft.com/en-us/security/benchmark/azure/security-controls-v3governance-strategy#gs-6-define-identity-and-privileged-access-strategy
  page_start: 93
  audit_raw: 'From Azure Portal

    1. From Azure Home select the Portal Menu

    2. Select Azure Active Directory

    3. Then External Identities

    4.

    External collaboration settings

    5. Under Guest invite settings, for Guest invite restrictions, ensure that that

    Only users assigned to specific admin roles can invite guest users is

    selected

    Please note that at this point of time, there is no API/CLI mechanism available to

    programmatically conduct security assessment for this recommendation.

    Note: This setting has 4 levels of restriction, which include:

    • Anyone in the organization can invite guest users including guests and nonadmins (most inclusive),

    • Member users and users assigned to specific admin roles can invite guest users

    including guests with member permissions,

    • Only users assigned to specific admin roles can invite guest users,

    • No one in the organization can invite guest users including admins (most

    restrictive).'
  remediation: 'From Azure Portal

