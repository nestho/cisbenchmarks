controls:
- id: 1.1.1
  title: Ensure Security Defaults is enabled on Azure Active Directory
  scoring: manual
  profile:
  - Level 1
  description: Security defaults in Azure Active Directory (Azure AD) make it easier to be secure and help protect your organization.
    Security defaults contain preconfigured security settings for common attacks. Microsoft is making security defaults available
    to everyone. The goal is to ensure that all organizations have a basic level of security enabled at no extra cost. You
    may turn on security defaults in the Azure portal.
  rationale: 'Security defaults provide secure default settings that we manage on behalf of organizations to keep customers
    safe until they are ready to manage their own identity security settings. For example, doing the following: • Requiring
    all users and admins to register for MFA. • Challenging users with MFA - mostly when they show up on a new device or app,
    but more often for critical roles and tasks. • Disabling authentication from legacy authentication clients, which can’t
    do MFA.'
  impact: Enabling security defaults may negatively impact the functionality of other Microsoft services, such as MS365. This
    recommendation should be implemented initially and then may be overridden by other service/product specific CIS Benchmarks.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/fundamentals/conceptfundamentals-security-defaults
  - 2. https://techcommunity.microsoft.com/t5/azure-active-directoryidentity/introducing-security-defaults/ba-p/1061414
  page_start: 21
  audit_raw: 'From Azure Portal

    To ensure security defaults is enabled in your directory:

    1. From Azure Home select the Portal Menu.

    2. Browse to Azure Active Directory > Properties.

    3. Select Manage security defaults.

    4. Verify the Enable security defaults toggle is Yes.

    Please note that at this point of time, there is no Azure CLI or other API commands

    available to programmatically conduct security assessment for this recommendation.'
  remediation: 'From Azure Portal

    To enable security defaults in your directory:

    1. From Azure Home select the Portal Menu.

    2. Browse to Azure Active Directory > Properties

    3. Select Manage security defaults

    4. Set the Enable security defaults toggle to Yes

    5. Select Save

    Please note that at this point of time, there is no Azure CLI or other API commands

    available to programmatically conduct security configuration for this recommendation.'
  checks:
  - type: manual_review
    info: 'From Azure Portal

      To ensure security defaults is enabled in your directory:

      1. From Azure Home select the Portal Menu.

      2. Browse to Azure Active Directory > Properties.

      3. Select Manage security defaults.

      4. Verify the Enable security defaults toggle is Yes.

      Please note that at this point of time, there is no Azure CLI or other API commands

      available to programmatically conduct security assessment for this recommendation.'
    severity: medium
- id: 1.1.2
  title: Ensure that 'Multi-Factor Auth Status' is 'Enabled' for all Privileged Users
  scoring: manual
  profile:
  - Level 1
  description: Enable multi-factor authentication for all roles, groups, and users that have write access or permissions to
    Azure resources. These include custom created objects or built-in roles such as; • Service Co-Administrators • Subscription
    Owners • Contributors
  rationale: Multi-factor authentication requires an individual to present a minimum of two separate forms of authentication
    before access is granted. Multi-factor authentication provides additional assurance that the individual attempting to
    gain access is who they claim to be. With multi-factor authentication, an attacker would need to compromise at least two
    different authentication mechanisms, increasing the difficulty of compromise and thus reducing the risk.
  impact: Users would require two forms of authentication before any access is granted. Additional administrative time will
    be required for managing dual forms of authentication when enabling multi-factor authentication.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/multi-factor-authentication/multi-factorauthentication
  - 2. https://stackoverflow.com/questions/41156206/azure-active-directory-premiummfa-attributes-via-graph-api
  page_start: 24
  audit_raw: 'From Azure Portal

    1. From Azure Home select the Portal Menu

    2. Select the Azure Active Directory blade

    3. Then Users

    4.

    All Users

    5. Click on the Per-User MFA button in the top row menu

    6. Ensure that MULTI-FACTOR AUTH STATUS is Enabled for all users who are Service

    Co-Administrators, Owners, OR Contributors.

    From REST API

    For Every Subscription, For Every Tenant

    Step 1: Identify Users with Administrative Access

    1. List All Users Using Microsoft Graph API:

    GET https://graph.microsoft.com/v1.0/users

    Capture id and corresponding userPrincipalName (''$uid'', ''$userPrincipalName'')

    2. List all Role Definitions Using Azure management API:

    https://management.azure.com/subscriptions/:subscriptionId/providers/Microsof

    t.Authorization/roleDefinitions?api-version=2017-05-01

    Capture Role Definition IDs/Name (''$name'') and role names (''$properties/roleName'')

    where "properties/roleName" contains (Owner or *contributor or admin )

    3. List All Role Assignments (Mappings $A.uid to $B.name) Using Azure

    Management API:

    GET

    https://management.azure.com/subscriptions/:subscriptionId/providers/Microsof

    t.Authorization/roleassignments?api-version=2017-10-01-preview

    Find all administrative roles ($B.name) in "Properties/roleDefinitionId" mapped with

    user ids ($A.id) in "Properties/principalId" where "Properties/principalType" ==

    "User"

    4. Now Match ($CProperties/principalId) with $A.uid and get

    $A.userPrincipalName save this as D.userPrincipalName

    Step 2: Run MSOL Powershell command:

    Get-MsolUser -All | where {$_.StrongAuthenticationMethods.Count -eq 0} |

    Select-Object -Property UserPrincipalName

    If the output contains any of the $D.userPrincipalName, then this recommendation is

    non-compliant.

    Please note that at the time of writing, there is no API, Azure CLI or Powershell

    mechanism available to programmatically conduct security assessment or remediation

    for this recommendation. The only option is MSOL.'
  remediation: 'From Azure Portal

    1. From Azure Home select the Portal Menu

    2. Select Azure Active Directory blade

    3. Then Users

    4. Select All Users

    5. Click on the Per-User MFA button in the top row menu

    6. Select each user individually with the role Service Co-Administrators, Owners,

    OR Contributors in the column MULTI-FACTOR AUTH STATUS

    7. In the information box on the right side under the title quick steps click enable

    Other Options within Azure Portal

    Follow Microsoft Azure documentation and enable multi-factor authentication in your

    environment.

    https://docs.microsoft.com/en-us/azure/active-directory/authentication/tutorial-enableazure-mfa

    Enabling and configuring MFA with conditional access policy is a multi-step process.

    Here are some additional resources on the process within Azure AD to enable multifactor authentication for users within
    your subscriptions with conditional access policy.

    https://docs.microsoft.com/en-us/azure/active-directory/conditional-access/howtoconditional-access-policy-admin-mfa

    https://docs.microsoft.com/en-us/azure/active-directory/authentication/howto-mfagetstarted#enable-multi-factor-authentication-with-conditional-access

    https://docs.microsoft.com/en-us/azure/active-directory/authentication/howto-mfamfasettings

    Please note that at the time of writing, there is no API, Azure CLI or Powershell

    mechanism available to programmatically conduct security assessment or remediation

    for this recommendation. The only option is MSOL.'
  checks:
  - type: manual_review
    info: 'From Azure Portal

