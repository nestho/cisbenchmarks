    Get-AzKeyVault -VaultName <Vault Name>

    Examine the results of the above command for the EnablePurgeProtection setting and

    the EnableSoftDelete setting. Make sure both settigns are set to True.'
  remediation: 'To enable "Do Not Purge" and "Soft Delete" for a Key Vault:

    From Azure Portal

    1. Go to Key Vaults

    2. For each Key Vault

    3. Click Properties

    4. Ensure the status of soft-delete reads Soft delete has been enabled on this

    key vault.

