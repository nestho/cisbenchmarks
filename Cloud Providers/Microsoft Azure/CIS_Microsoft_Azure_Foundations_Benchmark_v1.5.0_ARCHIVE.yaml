- id: '1.23'
  title: Ensure That No Custom Subscription Owner Roles Are Created
  scoring: scored
  profile:
  - Level 1
  description: Subscription ownership should not include permission to create custom owner roles. The principle of least privilege
    should be followed and only necessary privileges should be assigned instead of allowing full administrative access.
  rationale: Classic subscription admin roles offer basic access management and include Account Administrator, Service Administrator,
    and Co-Administrators. It is recommended the least necessary permissions be given initially. Permissions can be added
    as needed by the account holder. This ensures the account holder cannot perform actions which were not intended.
  impact: Subscriptions will need to be handled by Administrators with permissions.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/billing/billing-add-change-azuresubscription-administrator
  - 2. https://docs.microsoft.com/en-us/security/benchmark/azure/security-controls-v3governance-strategy#gs-2-define-enterprise-segmentation-strategy
