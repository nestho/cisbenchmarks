- id: '1.5'
  title: Ensure that 'Allow users to remember multi-factor authentication on devices they trust' is 'Disabled'
  scoring: manual
  profile:
  - Level 1
  description: Do not allow users to remember multi-factor authentication on devices.
  rationale: Remembering Multi-Factor Authentication (MFA) for devices and browsers allows users to have the option to bypass
    MFA for a set number of days after performing a successful sign-in using MFA. This can enhance usability by minimizing
    the number of times a user may need to perform two-step verification on the same device. However, if an account or device
    is compromised, remembering MFA for trusted devices may affect security. Hence, it is recommended that users not be allowed
    to bypass MFA.
  impact: For every login attempt, the user will be required to perform multi-factor authentication.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/multi-factor-authentication/multi-factorauthentication-whats-next#remember-multi-factor-authentication-for-devices-thatusers-trust
  - 2. https://docs.microsoft.com/en-us/security/benchmark/azure/security-controls-v3identity-management#im-6-use-strong-authentication-controls
