  scoring: scored
  profile:
  - Level 2
  description: Network Security Group Flow Logs should be enabled and the retention period set to greater than or equal to
    90 days.
  rationale: Flow logs enable capturing information about IP traffic flowing in and out of network security groups. Logs can
    be used to check for anomalies and give insight into suspected breaches.
  impact: This will keep IP traffic logs for longer than 90 days. As a level 2, first determine your need to retain data,
    then apply your selection here. As this is data stored for longer, your monthly storage costs will increase depending
    on your data use.
