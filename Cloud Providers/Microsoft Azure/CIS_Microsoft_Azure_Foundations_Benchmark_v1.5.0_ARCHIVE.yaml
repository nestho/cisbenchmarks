    6. Click on the storage account name noted in step 4. This will open blade specific

    to that storage account

    7. In Section Blob Service click Containers. It will list all the containers in next

    blade

    8. Look for a record with container named as insight-operational-logs. Click ...

    from right most column to open Context menu

    9. Click Access Policy from Context Menu and ensure Public Access Level is set

    to Private (no anonymous access)

    From Azure CLI

    1. Get storage account id configured with log profile:

    az monitor log-profiles list --query [*].storageAccountId

    2. Ensure the container storing activity logs (insights-operational-logs) is not

    publicly accessible:

    az storage container list --account-name <Storage Account Name> --query

    "[?name==''insights-operational-logs'']"

    In command output ensure publicAccess is set to null

    From Azure Portal

