  rationale: Enabling Microsoft Defender for SQL server does not enables Vulnerability Assessment capability for individual
    SQL databases unless storage account is set to store the scanning data and reports. The Vulnerability Assessment service
    scans databases for known security vulnerabilities and highlights deviations from best practices, such as misconfigurations,
    excessive permissions, and unprotected sensitive data. Results of the scan include actionable steps to resolve each issue
    and provide customized remediation scripts where applicable. Additionally, an assessment report can be customized by setting
    an acceptable baseline for permission configurations, feature configurations, and database settings.
  impact: Enabling the Microsoft Defender for SQL features will incur additional costs for each SQL server.
  references:
