- id: '3.6'
  title: Ensure that Shared Access Signature Tokens Expire Within an Hour
  scoring: manual
  profile:
  - Level 1
  description: Expire shared access signature tokens within an hour.
  rationale: A shared access signature (SAS) is a URI that grants restricted access rights to Azure Storage resources. A shared
    access signature can be provided to clients who should not be trusted with the storage account key but for whom it may
    be necessary to delegate access to certain storage account resources. Providing a shared access signature URI to these
    clients allows them access to a resource for a specified period of time. This time should be set as low as possible and
    preferably no longer than an hour.
  impact: ''
  references:
  - 1. https://docs.microsoft.com/en-us/rest/api/storageservices/delegating-accesswith-a-shared-access-signature
  - 2. https://docs.microsoft.com/en-us/azure/storage/common/storage-sas-overview
  page_start: 206
  audit_raw: 'Currently, SAS token expiration times cannot be audited. Until Microsoft makes token

    expiration time a setting rather than a token creation parameter, this recommendation

    would require a manual verification.'
  remediation: 'When generating shared access signature tokens, use start and end time such that it

    falls within an hour.

    From Azure Portal

    1. Go to Storage Accounts

    2. For each storage account, go to Shared access signature

    3. Set Start and expiry date/time within an hour

    note At this point of time, there is no API/CLI mechanism available to programmatically

    conduct security assessment for this recommendation.'
  checks:
  - type: manual_review
    info: 'Currently, SAS token expiration times cannot be audited. Until Microsoft makes token

      expiration time a setting rather than a token creation parameter, this recommendation

      would require a manual verification.'
    severity: medium
- id: '3.7'
  title: Ensure that 'Public access level' is disabled for storage accounts with blob containers
  scoring: scored
  profile:
  - Level 1
  description: Disallowing public access for a storage account overrides the public access settings for individual containers
    in that storage account.
  rationale: The default configuration for a storage account permits a user with appropriate permissions to configure public
    (anonymous) access to containers and blobs in a storage account. Keep in mind that public access to a container is always
    turned off by default and must be explicitly configured to permit anonymous requests. It grants readonly access to these
    resources without sharing the account key, and without requiring a shared access signature. It is recommended not to provide
    anonymous access to blob containers until, and unless, it is strongly desired. A shared access signature token or Azure
    AD RBAC should be used for providing controlled and timed access to blob containers. If no anonymous access is needed
    on any container in the storage account, it’s recommended to set allowBlobPublicAccess false at the account level, which
    forbids any container to accept anonymous access in the future.
  impact: Access will have to be managed using shared access signatures or via Azure AD RBAC.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/blobs/storage-manage-access-toresources
  - 2. https://docs.microsoft.com/en-us/azure/storage/blobs/anonymous-read-accessprevent
  page_start: 208
  audit_raw: 'From Azure Console

    1. Go to Storage Accounts

    2. For each storage account, go to the ''Configuration'' setting under ''Settings''

    3. Check if Blob public access is Disabled.

    From Azure CLI

    Ensure allowBlobPublicAccess is false

    az storage account show --name <storage-account> --resource-group <resourcegroup> --query allowBlobPublicAccess --output
    tsv'
  remediation: 'From Azure Console

    First, follow Microsoft documentation and create shared access signature tokens for

    your blob containers. Then,

    1. Go to Storage Accounts

    2. For each storage account, go to Allow Blob public access in Configuration

    3. Set Disabled if no anonymous access is needed on the storage account

    Alternatively, if some containers must be made public (so ''Allow Blob public access'' is

    enabled) ,

    1. For each storage account, go to Containers under the Data Storage heading

    2. For each private container, click Access policy

    3. Set Public access level to Private (no anonymous access)

    From Azure CLI

    First, follow Microsoft documentation and created shared access signature tokens for

    your blob containers. Then, if no anonymous access is wanted (as recommended here),

    1. Set ''Allow Blob Public Access'' to false on the storage account

    az storage account update --name <storage-account> --resource-group

    <resource-group> --allow-blob-public-access false

    Alternatively, if some containers must be made public (so ''Allow Blob public access'' is

    enabled) ,

    1. Identify the container name from the audit command

    2. Set the permission for public access to private(off) for the above container

    name, using the below command

    az storage container set-permission --name <containerName> --public-access

    off --account-name <accountName> --account-key <accountKey>'
  checks:
  - type: manual_review
    info: 'From Azure Console

      1. Go to Storage Accounts

      2. For each storage account, go to the ''Configuration'' setting under ''Settings''

      3. Check if Blob public access is Disabled.

      From Azure CLI

      Ensure allowBlobPublicAccess is false

      az storage account show --name <storage-account> --resource-group <resourcegroup> --query allowBlobPublicAccess --output
      tsv'
    severity: medium
- id: '3.8'
  title: Ensure Default Network Access Rule for Storage Accounts is Set to Deny
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: 'Restricting default network access helps to provide a new layer of security, since storage accounts accept
    connections from clients on any network. To limit access to selected networks, the default action must be changed. Some
    Azure services that interact with storage accounts operate from networks that can''t be granted access through network
    rules. To help this type of service work as intended, allow the set of trusted Azure services to bypass the network rules.
    These services will then use strong authentication to access the storage account. If the Allow trusted Azure services
    exception is enabled, the following services are granted access to the storage account: Azure Backup, Azure Site Recovery,
    Azure DevTest Labs, Azure Event Grid, Azure Event Hubs, Azure Networking, Azure Monitor, and Azure SQL Data Warehouse
    (when registered in the subscription).'
  rationale: Storage accounts should be configured to deny access to traffic from all networks (including internet traffic).
    Access can be granted to traffic from specific Azure Virtual networks, allowing a secure network boundary for specific
    applications to be built. Access can also be granted to public internet IP address ranges to enable connections from specific
    internet or on-premises clients. When network rules are configured, only applications from allowed networks can access
    a storage account. When calling from an allowed network, applications continue to require proper authorization (a valid
    access key or SAS token) to access the storage account. Turning on firewall rules for storage account will block access
    to incoming requests for data, including from other Azure services. We can re-enable this functionality by enabling "Trusted
    Azure Services" through networking exceptions.
  impact: All allowed networks will need to be whitelisted on each specific network, creating administrative overhead. This
    may result in loss of network connectivity, so do not turn on for critical resources during business hours. This creates
    authentication credentials for services that need access to storage resources so that services will no longer need to
    communicate via network request. There may be a temporary loss of communication as you set each Storage Account. It is
    recommended to not do this on mission-critical resources during business hours.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/storage-networksecurity
  - 2. https://docs.microsoft.com/en-us/security/benchmark/azure/security-controls-v3governance-strategy#gs-2-define-and-implement-enterprisesegmentationseparation-of-duties-strategy
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/storage-networksecurity
  - 2. https://docs.microsoft.com/en-us/security/benchmark/azure/security-controls-v3network-security#ns-2-secure-cloud-services-with-network-controls
  page_start: 211
  audit_raw: "From Azure Console\n1. Go to Storage Accounts\n2. For each storage account, Click on the Networking blade.\n\
    3. Click the Firewalls and virtual networks heading.\n4. Ensure that Allow access from All networks is not selected.\n\
    From Azure CLI\nEnsure defaultAction is not set to Allow.\n az storage account list --query '[*].networkRuleSet'\nFrom\
    \ PowerShell\nConnect-AzAccount\nSet-AzContext -Subscription <subscription ID>\nGet-AzStorageAccountNetworkRuleset -ResourceGroupName\
    \ <resource group> -Name\n<storage account name> |Select-Object DefaultAction\nPowerShell Result - Non-Compliant\nDefaultAction\
    \ : Allow\nPowerShell Result - Compliant\nDefaultAction : Deny\nFrom Azure Portal\n1. Go to Storage Accounts\n2. For each\
    \ storage account, Click on the Networking blade\n3. Click on the Firewalls and virtual networks heading.\n4. Ensure that\
    \ Enabled from selected virtual networks and IP addresses is\nselected.\n5. Ensure that Allow Azure services on the trusted\
    \ services list to access\nthis storage account is checked in Exceptions.\nFrom Azure CLI\nEnsure bypass contains AzureServices\n\
    az storage account list --query '[*].networkRuleSet'\nFrom PowerShell\nConnect-AzAccount\nSet-AzContext -Subscription\
    \ <subscription ID>\nGet-AzStorageAccountNetworkRuleset -ResourceGroupName <resource group> -Name\n<storage account name>\
    \ |Select-Object Bypass\nIf the resultant output from the above command shows 'NULL', that storage account\nconfiguration\
    \ is out of compliance with this check. If the result of the above command\nshows 'AzureServices', that storage account\
    \ configuration is in compliance with this\ncheck."
  remediation: "From Azure Console\n1. Go to Storage Accounts\n2. For each storage account, Click on the Networking blade\n\
    3. Click the Firewalls and virtual networks heading.\n4. Ensure that you have elected to allow access from Selected networks\n\
