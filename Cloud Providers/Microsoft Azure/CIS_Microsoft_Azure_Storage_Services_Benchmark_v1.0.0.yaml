- id: '17.4'
  title: Ensure that 'Secure transfer required' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: Enable data encryption in transit.
  rationale: The secure transfer option enhances the security of a storage account by only allowing requests to the storage
    account by a secure connection. For example, when calling REST APIs to access storage accounts, the connection must use
    HTTPS. Any requests using HTTP will be rejected when 'secure transfer required' is enabled. When using the Azure files
    service, connection without encryption will fail, including scenarios using SMB 2.1, SMB 3.0 without encryption, and some
    flavors of the Linux SMB client. Because Azure storage doesn’t support HTTPS for custom domain names, this option is not
    applied when using a custom domain name.
  impact: ''
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/blobs/securityrecommendations#encryption-in-transit
  - 2. https://docs.microsoft.com/en-us/cli/azure/storage/account?view=azure-clilatest#az_storage_account_list
  page_start: 195
  audit_raw: 'Audit from Azure Portal

    1. Go to Storage Accounts.

    2. For each storage account, under Settings, click Configuration.

    3. Ensure that Secure transfer required is set to Enabled.

