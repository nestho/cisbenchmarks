    6. Check the box next to Enable soft delete and security settings for

    hybrid workloads.

    7. In the box next to Soft delete retention period, set an appropriate number

    of days for deleted data to be retained, between 14 and 180, inclusive.

    8. If it is appropriate for your organization, check the box next to Enable alwayson soft delete. Note: Once enabled,
    this setting cannot be disabled.

