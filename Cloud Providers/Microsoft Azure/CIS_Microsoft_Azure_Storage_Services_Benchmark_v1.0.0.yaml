    retained, between 14 and 180, inclusive:

    az backup vault backup-properties set --resource-group <resource-group> --

    name <recovery-services-vault> --soft-delete-feature-state Enable --hybridbackup-security-features Enable --soft-delete-duration
    <retention-duration>

    Note: To enable always-on soft delete, the above command can be executed with --

    soft-delete-feature-state AlwaysOn. Once enabled, this setting cannot be

    disabled.'
