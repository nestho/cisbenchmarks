controls:
- id: 2.1.1.1
  title: Ensure 'Allowed Protocols' for shared access signature (SAS) tokens is set to 'HTTPS Only'
  scoring: manual
  profile:
  - Level 1
  description: Shared access signatures (SAS) can be used to grant limited access to Azure Storage resources. When generating
    a SAS, it is possible to specify the allowed protocols for a request made with the SAS. It is recommended to allow requests
    over HTTPS only.
  rationale: If a SAS is passed over HTTP and intercepted, an attacker performing a man-in-themiddle attack can read the SAS.
    Then, they can use that SAS just as the intended user could have. This can potentially compromise sensitive data or allow
    for data corruption by the malicious user.
  impact: SAS can pose security risks if they are not managed carefully.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview
  - 2. https://learn.microsoft.com/en-us/azure/storage/common/storage-account-keysmanage
  page_start: 26
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 2.1.1.2
  title: Ensure that shared access signature (SAS) tokens expire within an hour
  scoring: manual
  profile:
  - Level 1
  description: Shared access signature (SAS) tokens provide restricted access to Azure Storage resources (such as blobs, files,
    queues, or tables) for a defined time period with specific permissions. It enables users to interact with the resources
    without exposing account keys, offering precise control over the permitted actions (e.g., read, write) and the duration
    of access. To minimize security risks, SAS tokens should be configured with the shortest possible lifespan, ideally lasting
    no longer than an hour.
  rationale: A short lifespan for SAS tokens is recommended to minimize the risk of unauthorized access. SAS tokens grant
    time-limited access to resources, and a longer duration increases the opportunity for misuse if the token is compromised.
    By setting a shorter lifespan, the potential for security breaches is reduced.
  impact: SAS can pose security risks if they are not managed carefully.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/storage-sas-overview
  - 2. https://docs.microsoft.com/en-us/rest/api/storageservices/delegating-accesswith-a-shared-access-signature
  page_start: 28
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 2.1.1.3
  title: Ensure stored access policies (SAP) are used when generating shared access signature (SAS) tokens
  scoring: manual
  profile:
  - Level 1
  description: Use stored access policies (SAP) when generating shared access signature (SAS) tokens in Azure to centrally
    manage permissions, expiration, and revocation settings for resource access. Stored access policies can be applied to
    blob containers, file shares, queues, and tables.
  rationale: Stored access policies provide centralized control over SAS token access, allowing administrators to update permissions
    or revoke access. This approach strengthens security by reducing the risk of unauthorized access to storage resources.
  impact: There is no cost for creating stored access policies, however there is some administrative overhead involved in
    managing these policies.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/common/storage-sasoverview#best-practices-when-using-sas
  - 2. https://learn.microsoft.com/en-us/rest/api/storageservices/define-stored-accesspolicy
  page_start: 30
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 2.1.2.1.1
  title: Ensure Critical Data is Encrypted with Microsoft Managed Keys (MMK)
  scoring: manual
  profile:
  - Level 1
  description: Microsoft Managed Keys (MMK) [also known as Platform-managed keys (PMK)] provides a very low overhead method
    of encrypting data at rest and implementing encryption key management. Keys maintained in an MMK implementation are automatically
    managed by Azure and require no customer interaction.
  rationale: The encryption of data at rest is a foundational component of data security. Data at rest without encryption
    is easily compromised through loss or theft. Encrypting data at rest introduces confidentiality to the data by obfuscating
    the data contents with a cipher algorithm and provides an authentication requirement through the use of cryptographic
    keys. MMK makes the encryption of data at rest very easy to implement and maintain.
  impact: ''
  references:
  - 1. https://docs.microsoft.com/en-us/azure/security/fundamentals/data-encryptionbest-practices#protect-data-at-rest
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-dataprotection#dp-5-use-customer-managed-key-option-in-data-at-rest-encryptionwhen-required
  page_start: 34
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 2.1.2.2.1
  title: Ensure Critical Data is Encrypted with Customer Managed Keys (CMK)
  scoring: manual
  profile:
  - Level 2
  description: Customer Managed Keys introduce additional depth to security by providing a means to manage access control
    for encryption keys. Where compliance and security frameworks indicate the need, and organizational capacity allows, sensitive
    data at rest can be encrypted using Customer Managed Keys (CMK) rather than Microsoft Managed keys.
  rationale: By default in Azure, data at rest tends to be encrypted using Microsoft Managed Keys. If your organization want
    to control and manage encryption keys for compliance and defense-in-depth, Customer Managed Keys can be established. While
    it is possible to automate the assessment of this recommendation, the assessment status for this recommendation remains
    'Manual' due to ideally limited scope. The scope of application - which workloads CMK is applied to - should be carefully
    considered to account for organizational capacity and targeted to workloads with specific need for CMK.
  impact: If the key expires due to setting the 'activation date' and 'expiration date', the key must be rotated manually.
    Using Customer Managed Keys may also incur additional man-hour requirements to create, store, manage, and protect the
    keys as needed.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/security/fundamentals/data-encryptionbest-practices#protect-data-at-rest
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-dataprotection#dp-5-use-customer-managed-key-option-in-data-at-rest-encryptionwhen-required
  page_start: 37
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 2.2.1.1
  title: Ensure public network access is Disabled
  scoring: scored
  profile:
  - Level 1
  description: Disable public network access to prevent exposure to the internet and reduce the risk of unauthorized access.
    Use private endpoints and Azure Role-Based Access Control (RBAC) to securely manage access within trusted networks.
  rationale: Disabling public network access improves security by ensuring that a service is not exposed on the public internet.
  impact: Disabling public network access restricts access to the service. This enhances security but may require the configuration
    of private endpoints for any services or users needing access within trusted networks.
  references: []
  page_start: 42
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 2.2.1.2
  title: Ensure Network Access Rules are set to Deny-by-default
  scoring: scored
  profile:
  - Level 1
  description: Restricting default network access provides a foundational level of security to networked resources. To limit
    access to selected networks, the default action must be changed.
  rationale: Resources using Virtual Network interfaces should be configured to deny-by-default all access from all networks
    (including internet traffic). Access can be granted to traffic from specific Azure Virtual networks, allowing a secure
    network boundary for specific applications to be built. If necessary, access can also be granted to public internet IP
    address ranges to enable connections from specific internet or on-premises clients. For all traffic inbound from- and
    outbound to- the internet, a NAT Gateway is recommended at minimum, and ideally all traffic flows through a security gateway
    device such as a firewall. Security gateway devices will provide an additional level of visibility to inbound and outbound
    traffic and usually perform advanced monitoring and response activity such as intrusion detection and prevention (IDP),
    and deep packet inspection (DPI) which help detect activity indicating vulnerabilities and threats.
  impact: All allowed networks and protocols will need to be allow-listed which creates some administrative overhead. Implementing
    a deny-by-default rule may result in a loss of network connectivity. Careful planning and a scheduled implementation window
    allowing for downtime is highly recommended.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/storage-networksecurity
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-governancestrategy#gs-2-define-and-implement-enterprise-segmentationseparation-ofduties-strategy
  page_start: 44
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 2.2.2.1
  title: Ensure Private Endpoints are used to access {service}
  scoring: scored
  profile:
  - Level 2
  description: Use private endpoints to allow clients and services to securely access data located over a network via an encrypted
    Private Link. To do this, the private endpoint uses an IP address from the VNet for each service. Network traffic between
    disparate services securely traverses encrypted over the VNet. This VNet can also link addressing space, extending your
    network and accessing resources on it. Similarly, it can be a tunnel through public networks to connect remote infrastructures
    together. This creates further security through segmenting network traffic and preventing outside sources from accessing
    it.
  rationale: Securing traffic between services through encryption protects the data from easy interception and reading.
  impact: A Private Endpoint costs approximately US$7.30 per month. If an Azure Virtual Network is not implemented correctly,
    this may result in the loss of critical network traffic.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview
  - 2. https://docs.microsoft.com/en-us/azure/private-link/create-private-endpoint-portal
  page_start: 47
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: '4.1'
  title: Ensure 'Key encryption key' is set to a customer-managed key for Azure Managed Lustre file systems
  scoring: scored
  profile:
  - Level 2
  description: Enable customer-managed encryption keys (CMEK) for Azure Managed Lustre file systems to enhance data security
    and provide greater control over encryption processes. By using CMEK, organizations can manage their own encryption keys
    within Azure Key Vault, allowing them to rotate, revoke, or otherwise control access to these keys in accordance with
    their security policies.
  rationale: Using customer-managed encryption keys (CMEK) gives organizations complete control over encryption keys, ensuring
    compliance and enhancing data security. CMEK allows for key rotation, revocation, and lifecycle management, thus improving
    data protection and facilitating immediate control over data access in Azure Managed Lustre file systems.
  impact: There are costs and configuration overhead associated with setting up and managing customer-managed keys.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/azure-managed-lustre/customermanaged-encryption-keys
  - 2. https://learn.microsoft.com/en-us/cli/azure/amlfs
  page_start: 54
  audit_raw: 'Audit from Azure Portal

    1. Go to Azure Managed Lustre.

    2. Click the name of a file system.

    3. Under Settings, click Properties.

    4. Under Encryption settings, ensure that the value next to Key encryption

    key is View value as JSON.

    5. Repeat steps 1-4 for each file system.

    Audit from Azure CLI

    Run the following command to lust Azure Managed Lustre file systems:

    az amlfs list

    For each file system, run the following command:

    az amlfs show --resource-group <resource-group> --name <file-system>

    Ensure that under encryptionSettings > keyEncryptionKey, keyUrl is set to a

    customer-managed key URL.

    Audit from PowerShell

    Run the following command to install the Az.StorageCache module:

    Install-Module Az.StorageCache

    Enter Y when prompted.

    Run the following command to list Azure Managed Lustre file systems:

    Get-AzStorageCacheAmlFileSystem

    Run the following command to get the file system in a resource group with a given

    name:

    $filesystem = Get-AzStorageCacheAmlFileSystem -ResourceGroupName <resourcegroup> -Name <file-system>

    Run the following command to get the key encryption key URL for the file system:

    $filesystem.KeyEncryptionKeyUrl

    Ensure that the command returns a customer-managed key URL.

    Repeat for each file system.'
  remediation: 'To create an Azure Managed Lustre file system that uses a customer-managed

    encryption key:

    Remediate from Azure Portal

    1. Go to Azure Managed Lustre.

    2. Click + Create.

    3. Provide the required information on the Basics tab.

    4. Configure the Advanced tab if necessary.

    5. Click the Disk encryption keys tab.

    6. Next to Disk encryption key type, select the radio button next to Customer

    managed.

    7. Next to Key vault, key and version, click Select or create a key

    vault, key, or version.

    8. Select a key vault, key, and version.

    9. Click Select.

    10. Next to User assigned identities, click Add user assigned managed

    identities.

    11. In the filter box, type to filter by identity name and/or resource group name.

    12. Check the box next to a managed identity.

    13. Click Add.

    14. Click Review + create.

    15. Click Create.

    Remediate from Azure CLI

    Run the following command to create an Azure Managed Lustre file system with a

    customer-managed encryption key:

    az amlfs create --resource-group <resource-group> --name <file-system> --sku

    <sku> --storage-capacity <size-in-tib> --zones [<availability-zone>] --

    maintenance-window "{dayOfWeek:<day>,timeOfDayUtc:''<time>''}" --mi-userassigned "<user-assigned-identity-id>" --filesystem-subnet
    "<subnet-id>" --

    encryption-setting "{''keyUrl'': ''<key-url>'', ''sourceVault'': {''id'': ''<keyvault>''}}"

    Remediate from PowerShell

    Run the following command to install the Az.StorageCache module:

    Install-Module Az.StorageCache

    Enter Y when prompted.

    Run the following command to create an Azure Manage Lustre file system with a

    customer-managed encryption key:

    New-AzStorageCacheAmlFileSystem -ResourceGroupName <resource-group> -Name

    <file-system> -Location <location> -MaintenanceWindowDayOfWeek ''<day>'' -

    MaintenanceWindowTimeOfDayUtc "<time>" -FilesystemSubnet "<subnet-id>" -

    SkuName "<sku>" -StorageCapacityTiB <size-in-tib> -Zone <availability-zone> -

    IdentityType ''UserAssigned'' -IdentityUserAssignedIdentity @{"<user-assignedidentity-id>" = @{}} -KeyEncryptionKeyUrl
    "<key-url>" -SourceVaultId "<keyvault>"'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Azure Managed Lustre.

      2. Click the name of a file system.

      3. Under Settings, click Properties.

      4. Under Encryption settings, ensure that the value next to Key encryption

      key is View value as JSON.

      5. Repeat steps 1-4 for each file system.

      Audit from Azure CLI

      Run the following command to lust Azure Managed Lustre file systems:

      az amlfs list

      For each file system, run the following command:

      az amlfs show --resource-group <resource-group> --name <file-system>

      Ensure'
    severity: medium
- id: 5.1.1
  title: Ensure soft delete on Backup vaults is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Soft delete provides additional protection for Backup vault data. With soft delete enabled, deleted backup
    data can be recovered within the retention period.
  rationale: Important backup data could be accidentally deleted or removed by a malicious actor. With soft delete enabled,
    data is retained for at least 14 days before permanent deletion, allowing for the recovery of the backup data.
  impact: There is no additional cost for backup data in the soft delete state for up to and including 14 days. However, retention
    beyond 14 days may incur additional charges.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/backup/backup-vault-overview
  - 2. https://learn.microsoft.com/en-us/azure/backup/backup-azure-enhanced-softdelete-about
  page_start: 60
  audit_raw: 'Audit from Azure Portal

    1. Go to Backup vaults.

    2. Click the name of a Backup vault.

    3. Under Manage, click Properties.

    4. Ensure Soft delete is set to Enabled or Enabled with Always-On.

    5. Next to Soft delete, click Update.

    6. Ensure that the Retention period is set to an appropriate value between 14

    and 180, inclusive.

    7. Repeat steps 1-6 for each Backup vault.

    Audit from Azure CLI

    Run the following command to list Backup vaults:

    az dataprotection backup-vault list

    For each Backup vault, run the following command:

    az dataprotection backup-vault show --resource-group <resource-group> --

    vault-name <backup-vault>

    Ensure that under softDeleteSettings, state is set to on or alwayson, and

    retentionDurationInDays is set to an appropriate value between 14 and 180,

    inclusive.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 9798d31d-6028-4dee-8643-46102185c016

    • Name: ''[Preview]: Soft delete should be enabled for Backup Vaults'''
  remediation: 'Remediate from Azure Portal

    1. Go to Backup vaults.

    2. Click the name of a Backup vault.

    3. Under Manage, click Properties.

    4. Next to Soft delete, click Update.

    5. Check the box next to Soft delete.

    6. In the box next to Retention period, set an appropriate number of days for

    deleted data to be retained, between 14 and 180, inclusive.

    7. If it is appropriate for your organization, check the box next to Enable alwayson soft delete. Note: Once enabled,
    this setting cannot be disabled.

    8. Click Update.

    9. Repeat steps 1-8 for each Backup vault requiring remediation.

    Remediate from Azure CLI

    Run the following command to list Backup vaults:

    az dataprotection backup-vault list

    For each Backup vault requiring remediation, run the following command to enable soft

    delete and set an appropriate number of days for deleted data to be retained, between

    14 and 180, inclusive:

    az dataprotection backup-vault update --resource-group <resource-group> --

    vault-name <backup-vault> --soft-delete-state On --retention-duration-in-days

    <retention-duration>

    Note: To enable always-on soft delete, the above command can be executed with --

    soft-delete-state AlwaysOn. Once enabled, this setting cannot be disabled.'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Backup vaults.

      2. Click the name of a Backup vault.

      3. Under Manage, click Properties.

      4. Ensure Soft delete is set to Enabled or Enabled with Always-On.

      5. Next to Soft delete, click Update.

      6. Ensure that the Retention period is set to an appropriate value between 14

      and 180, inclusive.

      7. Repeat steps 1-6 for each Backup vault.

      Audit from Azure CLI

      Run the following command to list Backup vaults:

      az dataprotection backup-vault list

      For each Backup vault, run t'
    severity: medium
- id: 5.1.2
  title: Ensure immutability for Backup vaults is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Immutable vaults safeguard backup data by preventing any operations that could result in the loss of recovery
    points. The immutable vault setting can be locked, making it irreversible and preventing malicious actors from disabling
    it and deleting backups.
  rationale: Enabling the immutable vault ensures that backup data is protected from unauthorized or accidental deletion.
    By locking the setting and making it irreversible, malicious actors are prevented from disabling the setting and deleting
    backups.
  impact: There is no additional cost for enabling vault immutability; however, a vault with locked immutability cannot be
    deleted without contacting Azure support and will incur the standard vault costs.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/backup/backup-azure-immutable-vaultconcept?tabs=backup-vault
  - 2. https://learn.microsoft.com/en-us/azure/backup/backup-azure-immutable-vaulthow-to-manage?tabs=backup-vault
  page_start: 63
  audit_raw: 'Audit from Azure Portal

    1. Go to Backup vaults.

    2. From the list of vaults, ensure that the value in the Immutability column for

    each vault is Not locked or Locked.

    Audit from Azure CLI

    Run the following command to list Backup vaults:

    az dataprotection backup-vault list

    For each Backup vault, run the following command:

    az dataprotection backup-vault show --resource-group <resource-group> --

    vault-name <backup-vault>

    Ensure that under immutabilitySettings, state is set to Unlocked or Locked.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 2514263b-bc0d-4b06-ac3e-f262c0979018

    • Name: ''[Preview]: Immutability must be enabled for backup vaults'''
  remediation: 'Remediate from Azure Portal

    1. Go to Backup vaults.

    2. Click the name of a Backup vault.

    3. Under Manage, click Properties.

    4. Under the Immutable vault setting value, click Settings.

    5. Check the box under Enable vault immutability. Note: It is not possible to

    lock immutability until immutability has been enabled.

    6. Click Apply.

    7. If it is appropriate for your organization to lock immutability, under the Immutable

    vault setting value, click Settings.

    8. Click the toggle under Lock immutability for this vault to set it to

    Locked.

    9. Check the box next to Confirm locking immutability.

    10. Click Apply.

    11. Repeat steps 1-10 for each Backup vault requiring remediation.

    Remediate from Azure CLI

    Run the following command to list Backup vaults:

    az dataprotection backup-vault list

    For each Backup vault requiring remediation, run the following command to enable vault

    immutability:

    az dataprotection backup-vault update --resource-group <resource-group> --

    vault-name <backup-vault> --immutability-state Unlocked

    Note: To lock the Backup vault immutability state, the above command can be executed

    with --immutability-state Locked. Once enabled, this setting cannot be disabled

    and it will not be possible to delete the vault.'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Backup vaults.

      2. From the list of vaults, ensure that the value in the Immutability column for

      each vault is Not locked or Locked.

      Audit from Azure CLI

      Run the following command to list Backup vaults:

      az dataprotection backup-vault list

      For each Backup vault, run the following command:

      az dataprotection backup-vault show --resource-group <resource-group> --

      vault-name <backup-vault>

      Ensure that under immutabilitySettings, state is set to Unlocked or Locked.

      Audi'
    severity: medium
- id: 5.1.3
  title: Ensure backup data in Backup vaults is encrypted using customer-managed keys (CMK)
  scoring: scored
  profile:
  - Level 2
  description: 'Backup vaults offer two encryption options: Microsoft-managed keys, which provide automatic encryption without
    user intervention, and customer-managed keys (CMK), which allow organizations to retain full control over their encryption
    keys for enhanced security and compliance.'
  rationale: Using customer-managed keys (CMKs) to encrypt Backup vaults enhances security by granting organizations complete
    control over their encryption keys.
  impact: There are costs and configuration overhead associated with setting up and managing customer-managed keys.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/backup/encryption-at-rest-with-cmk-forbackup-vault
  - 2. https://learn.microsoft.com/en-us/cli/azure/dataprotection/backup-vault
  page_start: 66
  audit_raw: 'Audit from Azure Portal

    1. Go to Backup vaults.

    2. Click the name of a Backup vault.

    3. Under Manage, click Properties.

    4. Ensure Encryption Settings is set to Using ''Customer-managed keys''.

    5. Repeat steps 1-4 for each Backup vault.

    Audit from Azure CLI

    Run the following command to list Backup vaults:

    az dataprotection backup-vault list

    For each Backup vault, run the following command:

    az dataprotection backup-vault show --resource-group <resource-group> --

    vault-name <backup-vault>

    Ensure that under properties > securitySettings > encryptionSettings >

    keyVaultProperties, a key keyUri exists with the value set to a customer-managed

    key URI.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: d6588149-9f06-462c-a076-56aece45b5ba

    • Name: ''[Preview]: Azure Backup Vaults should use customer-managed keys for

    encrypting backup data. Also an option to enforce Infra Encryption.'''
  remediation: 'Note: Once encryption is configured to use a customer-managed key, this setting

    cannot be reversed.

    Remediate from Azure Portal

    1. Go to Backup vaults.

    2. Click the name of a Backup vault.

    3. Under Manage, click Properties.

    4. Under Using ''Microsoft-managed keys'', click Update.

    5. Check the box next to Use your own key.

    6. Under Encryption key, click the radio button next to Enter key URI to provide

    a known key URI, or click the radio button next to Select from Key Vault to

    select a key from a Key Vault.

    7. If entering a key URI, provide the key URI in the text box under Key URI.

    8. If selecting a key from a Key Vault, click select key from Key Vault.

    1. Select Key vault or Managed HSM.

    2. Select a key vault or managed HSM.

    3. Select a key.

    4. Click Select.

    9. Select a managed identity to use for the encryption key.

    10. Click Update.

    11. Repeat steps 1-10 for each Backup vault.

    Remediate from Azure CLI

    For each Backup vault requiring remediation, run the following command to assign a

    customer-managed encryption key:

    az dataprotection backup-vault update --resource-group <resource-group> --

    vault-name <backup-vault> --cmk-encryption-key-uri <cmk-uri> --cmkencryption-state "Enabled" --cmk-identity-type "SystemAssigned"

    Note: Use --cmk-identity-type "UserAssigned" --cmk-user-assignedidentity-id <user-assigned-identity-id> with the above
