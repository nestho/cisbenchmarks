- id: '11.1'
  title: Ensure 'Allowed Protocols' for shared access signature (SAS) tokens is set to 'HTTPS Only'
  scoring: manual
  profile:
  - Level 1
  description: Shared access signatures (SAS) can be used to grant limited access to Azure Storage resources. When generating
    a SAS, it is possible to specify the allowed protocols for a request made with the SAS. It is recommended to allow requests
    over HTTPS only.
  rationale: If a SAS is passed over HTTP and intercepted, an attacker performing a man-in-themiddle attack can read the SAS.
    Then, they can use that SAS just as the intended user could have. This can potentially compromise sensitive data or allow
    for data corruption by the malicious user.
  impact: SAS can pose security risks if they are not managed carefully.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview
  - 2. https://learn.microsoft.com/en-us/azure/storage/common/storage-account-keysmanage
  page_start: 126
  audit_raw: It is not possible to audit generated SAS.
  remediation: 'Remediate from Azure Portal

    If SAS have been created to allow HTTP and were created with a stored access policy

    (SAP), the SAS can be revoked by deleting the SAP or updating the SAP expiration

    time to a time in the past:

    1. Go to Storage accounts.

    2. Click on a storage account.

    3. Under Data storage, click Containers.

    4. Click the three dots next to a container.

    5. Click Access policy.

    6. Click the three dots next to an access policy.

    7. Click Delete.

    8. Click Save.

    9. Repeat steps 1-8 as needed to revoke SAS created with SAP.

    If SAS have been created to allow HTTP and were not created with a SAP, the SAS can

    be revoked by regenerating the storage account access keys:

    Note: Regenerating access keys can affect any applications or Azure services that are

    dependent on the storage account key.

    1. Go to Storage accounts.

    2. Click on a storage account.

    3. Under Security + networking, click Access keys.

    4. Next to each key, click Rotate key.

    5. Click Yes to confirm.

    6. Repeat steps 1-5 as needed to revoke SAS.'
  checks:
  - type: manual_review
    info: It is not possible to audit generated SAS.
    severity: medium
- id: '11.2'
  title: Ensure that shared access signature (SAS) tokens expire within an hour
  scoring: manual
  profile:
  - Level 1
  description: Shared access signature (SAS) tokens provide restricted access to Azure Storage resources (such as blobs, files,
    queues, or tables) for a defined time period with specific permissions. It enables users to interact with the resources
    without exposing account keys, offering precise control over the permitted actions (e.g., read, write) and the duration
    of access. To minimize security risks, SAS tokens should be configured with the shortest possible lifespan, ideally lasting
    no longer than an hour.
  rationale: A short lifespan for SAS tokens is recommended to minimize the risk of unauthorized access. SAS tokens grant
    time-limited access to resources, and a longer duration increases the opportunity for misuse if the token is compromised.
    By setting a shorter lifespan, the potential for security breaches is reduced.
  impact: SAS can pose security risks if they are not managed carefully.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/storage-sas-overview
  - 2. https://docs.microsoft.com/en-us/rest/api/storageservices/delegating-accesswith-a-shared-access-signature
  page_start: 128
  audit_raw: 'Currently, SAS token expiration times cannot be audited. Until Microsoft makes the

    token expiration time a setting rather than a token creation parameter, this

    recommendation will require manual verification.'
  remediation: 'Remediate from Azure Portal

    If SAS have been created without a short lifespan and were created with a stored

    access policy (SAP), the SAS can be revoked by deleting the SAP or updating the SAP

    expiration time to a time in the past:

    1. Go to Storage accounts.

    2. Click on a storage account.

    3. Under Data storage, click Containers.

    4. Click the three dots next to a listed item.

    5. Click Access policy.

    6. Click the three dots next to an access policy.

    7. Click Delete.

    8. Click Save.

    9. Repeat steps 1-8 as needed to revoke SAS created with SAP.

    If SAS have been created without a short lifespan and were not created with a SAP, the

    SAS can be revoked by regenerating the storage account access keys:

    Note: Regenerating access keys can affect any applications or Azure services that are

    dependent on the storage account key.

    1. Go to Storage accounts.

    2. Click on a storage account.

    3. Under Security + networking, click Access keys.

    4. Next to each key, click Rotate key.

    5. Click Yes to confirm.

    6. Repeat steps 1-5 as needed to revoke SAS.'
  checks:
  - type: manual_review
    info: 'Currently, SAS token expiration times cannot be audited. Until Microsoft makes the

      token expiration time a setting rather than a token creation parameter, this

      recommendation will require manual verification.'
    severity: medium
- id: '11.3'
  title: Ensure that soft delete for blobs on Azure Blob Storage storage accounts is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Blobs in Azure storage accounts may contain sensitive or personal data, such as ePHI or financial information.
    Data that is erroneously modified or deleted by an application or a user can lead to data loss or unavailability. It is
    recommended that soft delete be enabled on Azure storage accounts with blob storage to allow for the preservation and
    recovery of data when blobs or blob snapshots are deleted.
  rationale: Blobs can be deleted incorrectly. An attacker or malicious user may do this deliberately in order to cause disruption.
    Deleting an Azure storage blob results in immediate data loss. Enabling this configuration for Azure storage accounts
    ensures that even if blobs are deleted from the storage account, the blobs are recoverable for a specific period of time,
    which is defined in the "Retention policies," ranging from 7 to 365 days.
  impact: All soft-deleted data is billed at the same rate as active data. Additional costs may be incurred for deleted blobs
    until the soft delete period ends and the data is permanently removed.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/blobs/soft-delete-blob-overview
  page_start: 130
  audit_raw: 'Audit from Azure Portal

    1. Go to Storage Accounts.

    2. For each Storage Account with blob storage, under Data management, go to

    Data protection.

    3. Ensure that Enable soft delete for blobs is checked.

    4. Ensure that the retention period is a sufficient length for your organization.

    Audit from Azure CLI

    Run the following command to list storage accounts:

    az storage account list

    Run the following command to determine if a storage account has containers:

    az storage container list --account-name <storage-account>

    For each storage account with containers, ensure that the output of the below command

    contains "enabled": true and days is not null:

    az storage blob service-properties delete-policy show --account-name

    <storage-account>'
  remediation: 'Remediate from Azure Portal

    1. Go to Storage Accounts.

    2. For each Storage Account with blob storage, under Data management, go to

    Data protection.

    3. Check the box next to Enable soft delete for blobs.

    4. Set the retention period to a sufficient length for your organization.

    5. Click Save.

    Remediate from Azure CLI

    For each storage account requiring remediation, run the following command to enable

    soft delete for blobs:

    az storage blob service-properties delete-policy update --days-retained

    <retention-days> --account-name <storage-account> --enable true'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Storage Accounts.

      2. For each Storage Account with blob storage, under Data management, go to

      Data protection.

      3. Ensure that Enable soft delete for blobs is checked.

      4. Ensure that the retention period is a sufficient length for your organization.

      Audit from Azure CLI

      Run the following command to list storage accounts:

      az storage account list

      Run the following command to determine if a storage account has containers:

      az storage container list --account-name <sto'
    severity: medium
- id: '11.4'
  title: Ensure stored access policies (SAP) are used when generating shared access signature (SAS) tokens
  scoring: manual
  profile:
  - Level 1
  description: Use stored access policies (SAP) when generating shared access signature (SAS) tokens in Azure to centrally
    manage permissions, expiration, and revocation settings for resource access. Stored access policies can be applied to
    blob containers, file shares, queues, and tables.
  rationale: Stored access policies provide centralized control over SAS token access, allowing administrators to update permissions
    or revoke access. This approach strengthens security by reducing the risk of unauthorized access to storage resources.
  impact: There is no cost for creating stored access policies, however there is some administrative overhead involved in
    managing these policies.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/common/storage-sasoverview#best-practices-when-using-sas
  - 2. https://learn.microsoft.com/en-us/rest/api/storageservices/define-stored-accesspolicy
  page_start: 132
  audit_raw: 'It is not currently possible to retrieve a list of all generated SAS tokens to check if they

    were associated with a SAP during creation.

    An SAS token that has been created with a SAP will contain an si parameter that

    references the stored access policy identifier associated with the SAS, e.g.

    si=<stored-access-policy-identifier>.

    The si parameter will be absent from an SAS token created without a SAP.'
  remediation: 'Remediate from Azure Portal

    To create a SAP for a blob container:

    1. Go to Storage accounts.

    2. Click on a storage account.

    3. Under Data storage, click Containers.

    4. Click the name of a container.

    5. Under Settings, click Access policy.

    6. Under Stored access policies, click + Add policy.

    7. Enter an Identifier.

    8. From the Permissions drop-down, select appropriate permissions for the policy.

    9. Set an appropriate Start time for the policy.

    10. Set an appropriate Expiry time for the policy.

    11. Click OK.

    12. Click Save.

    13. Repeat steps 1-12 as needed to create SAP.

    When generating SAS, select a SAP from the Stored access policy drop-down.

    If SAS have been created without a SAP, the SAS can be revoked by regenerating the

    storage account access keys:

    Note: Regenerating access keys can affect any applications or Azure services that are

    dependent on the storage account key.

    1. Go to Storage accounts.

    2. Click on a storage account.

    3. Under Security + networking, click Access keys.

    4. Next to each key, click Rotate key.

    5. Click Yes to confirm.

    6. Repeat steps 1-5 as needed to revoke SAS.'
  checks:
  - type: manual_review
    info: 'It is not currently possible to retrieve a list of all generated SAS tokens to check if they

      were associated with a SAP during creation.

      An SAS token that has been created with a SAP will contain an si parameter that

      references the stored access policy identifier associated with the SAS, e.g.

      si=<stored-access-policy-identifier>.

      The si parameter will be absent from an SAS token created without a SAP.'
    severity: medium
- id: '11.5'
  title: Ensure 'Versioning' is set to 'Enabled' on Azure Blob Storage storage accounts
  scoring: scored
  profile:
  - Level 2
  description: Enabling blob versioning allows for the automatic retention of previous versions of objects. With blob versioning
    enabled, earlier versions of a blob are accessible for data recovery in the event of modifications or deletions.
  rationale: Blob versioning safeguards data integrity and enables recovery by retaining previous versions of stored objects,
    facilitating quick restoration from accidental deletion, modification, or malicious activity.
  impact: Enabling blob versioning for a storage account creates a new version with each write operation to a blob, which
    can increase storage costs. To control these costs, a lifecycle management policy can be applied to automatically delete
    older versions.
  references:
  - 1. https://learn.microsoft.com/en-us/cli/azure/storage/account
  - 2. https://learn.microsoft.com/en-us/cli/azure/storage/account/blob-serviceproperties
  page_start: 135
  audit_raw: 'Audit from Azure Portal

    1. Go to Storage accounts.

    2. Click the name of a storage account with blob storage.

    3. In the Overview page, on the Properties tab, under Blob service, ensure

    Versioning is set to Enabled.

    4. Repeat steps 1-3 for each storage account with blob storage.

    Audit from Azure CLI

    Run the following command to list storage accounts:

    az storage account list

    Run the following command to determine if a storage account has containers:

    az storage container list --account-name <storage-account>

    For each storage account with containers, ensure that the output of the below command

    contains "isVersioningEnabled": true:

    az storage account blob-service-properties show --account-name <storageaccount>

    Audit from PowerShell

    Run the following command to list storage accounts:

    Get-AzStorageAccount

    Run the following command to create an Azure Storage context for a storage account:

    $context = New-AzStorageContext -StorageAccountName <storage-account>

    Run the following command to list containers for the storage account:

    Get-AzStorageContainer -Context $context

    If the storage account has containers, run the following command to get the blob service

    properties of the storage account:

    $account = Get-AzStorageBlobServiceProperty -ResourceGroupName <resourcegroup> -AccountName <storage-account>

    Run the following command to get the blob versioning setting for the storage account:

    $account.IsVersioningEnabled

    Ensure that the command returns True.

    Repeat for each storage account.'
  remediation: 'Remediate from Azure Portal

    1. Go to Storage accounts.

    2. Click the name of a storage account with blob storage.

    3. In the Overview page, on the Properties tab, under Blob service, click

    Disabled next to Versioning.

    4. Under Tracking, check the box next to Enable versioning for blobs.

    5. Select the radio button next to Keep all versions or Delete versions after

    (in days).

    6. If selecting to delete versions, enter a number of in the box after which to delete

    blob versions.

    7. Click Save.

    8. Repeat steps 1-7 for each storage account with blob storage.

    Remediate from Azure CLI

    For each storage account requiring remediation, run the following command to enable

    blob versioning:

    az storage account blob-service-properties update --account-name <storageaccount> --enable-versioning true

    Remediate from PowerShell

    For each storage account requiring remediation, run the following command to enable

    blob versioning:

    Update-AzStorageBlobServiceProperty -ResourceGroupName <resource-group> -

    StorageAccountName <storage-account> -IsVersioningEnabled $true'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Storage accounts.

      2. Click the name of a storage account with blob storage.

      3. In the Overview page, on the Properties tab, under Blob service, ensure

      Versioning is set to Enabled.

      4. Repeat steps 1-3 for each storage account with blob storage.

      Audit from Azure CLI

      Run the following command to list storage accounts:

      az storage account list

      Run the following command to determine if a storage account has containers:

      az storage container list --account-name <storage'
    severity: medium
- id: '11.6'
  title: Ensure locked immutability policies are used for containers storing business-critical blob data
  scoring: scored
  profile:
  - Level 2
  description: Require locked immutability policies for all containers that store business-critical blob data. This measure
    protects the data from modifications or deletions, ensuring that critical information remains intact and unaltered, regardless
    of user actions or access permissions.
  rationale: Implementing a locked immutability policy creates a Write Once, Read Many (WORM) storage model that safeguards
    critical data from accidental or malicious changes and deletions. Enforcing immutability minimizes data loss and tampering
    risks, enhancing data security and supporting regulatory requirements for data retention and integrity.
  impact: Enforcing locked immutability policies for blob storage may increase long-term retention costs and require additional
    administrative effort for policy management. Once the policy is locked, the container cannot be deleted or edited, and
    the storage account cannot be deleted until the retention period has elapsed.
  references:
  - 1. https://learn.microsoft.com/en-gb/azure/storage/blobs/immutable-storageoverview
  - 2. https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-policyconfigure-container-scope
  page_start: 139
  audit_raw: 'Audit from Azure Portal

    1. Go to Storage accounts.

    2. Click the name of a storage account.

    3. Under Data storage, click Containers.

    4. Click the three dots next to a container.

    5. Click Access policy.

    6. Ensure a locked policy is listed under Immutable blob storage.

    7. Repeat steps 1-6 for each blob container with business-critical blob data.

    Audit from Azure CLI

    Run the following command to list storage accounts:

    az storage account list

    Run the following command to determine if a storage account has containers:

    az storage container list --account-name <storage-account>

    For each container, run the following command to view immutability policies:

    az storage container immutability-policy show --account-name <storageaccount> --container <blob-container>

    Ensure that an immutability policy is listed with "state": "Locked" for each blob

    container with business-critical blob data.'
  remediation: 'Remediate from Azure Portal

    1. Go to Storage accounts.

    2. Click the name of a storage account.

    3. Under Data storage, click Containers.

    4. Click the three dots next to a container.

    5. Click Access policy.

    6. Under Immutable blob storage, click + Add policy.

    7. From the Policy type drop-down, select Legal hold or Time-based

    retention.

    8. If selecting legal hold:

    1. Provide at least one tag for the policy.

    2. Under Allow protected append writes to, select None or Block and

    append blobs.

    9. If selecting time-based retention:

    1. Under Set retention period for, enter a number of days for retention.

    2. Check the box next to Enable version-level immutability if

    appropriate. Versioning must be enabled for this option to be available.

    3. Under Allow protected append writes to, select None, Append

    blobs, or Block and append blobs.

    10. Click Save.

    11. Click the three dots next to the policy.

    12. Click Lock policy.

    13. Enter yes to confirm.

    14. Click OK.

    15. Repeat steps 1-14 for each blob container requiring remediation.

    Remediate from Azure CLI

    For each blob container requiring remediation, run the following command to create an

    immutability policy:

    az storage container immutability-policy create --account-name <storageaccount> --container-name <blob-container> --period
    <retention-period-indays>

    For each blob container requiring remediation, run the following command to lock an

    immutability policy:

    az storage container immutability-policy lock --account-name <storageaccount> --container-name <blob-container> --if-match
