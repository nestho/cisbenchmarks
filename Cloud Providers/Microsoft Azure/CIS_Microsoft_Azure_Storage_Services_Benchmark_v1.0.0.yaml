  title: Ensure the 'Minimum TLS version' for storage accounts is set to 'Version 1.2'
  scoring: scored
  profile:
  - Level 1
  description: In some cases, Azure Storage sets the minimum TLS version to be version 1.0 by default. TLS 1.0 is a legacy
    version and has known vulnerabilities. This minimum TLS version can be configured to be later protocols such as TLS 1.2.
  rationale: TLS 1.0 has known vulnerabilities and has been replaced by later versions of the TLS protocol. Continued use
    of this legacy protocol affects the security of data in transit.
  impact: When set to TLS 1.2 all requests must leverage this version of the protocol. Applications leveraging legacy versions
    of the protocol will fail.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/transport-layer-securityconfigure-minimum-version?tabs=portal
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-dataprotection#dp-3-encrypt-sensitive-data-in-transit
