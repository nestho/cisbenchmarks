- id: '17.7'
  title: Ensure Soft Delete is Enabled for Azure Containers and Blob Storage
  scoring: scored
  profile:
  - Level 1
  description: The Azure Storage blobs contain data like ePHI or Financial, which can be secret or personal. Data that is
    erroneously modified or deleted by an application or other storage account user will cause data loss or unavailability.
    It is recommended that both Azure Containers with attached Blob Storage and standalone containers with Blob Storage be
    made recoverable by enabling the soft delete configuration. This is to save and recover data when blobs or blob snapshots
    are deleted.
  rationale: Containers and Blob Storage data can be incorrectly deleted. An attacker/malicious user may do this deliberately
    in order to cause disruption. Deleting an Azure Storage blob causes immediate data loss. Enabling this configuration for
    Azure storage ensures that even if blobs/data were deleted from the storage account, Blobs/data objects are recoverable
    for a particular time which is set in the "Retention policies," ranging from 7 days to 365 days.
  impact: Additional storage costs may be incurred as snapshots are retained.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/blobs/storage-blob-soft-delete
  - 2. https://docs.microsoft.com/en-us/azure/storage/blobs/soft-delete-containeroverview
  page_start: 203
  audit_raw: "Audit from Azure Portal\n1. Go to Storage Accounts.\n2. For each Storage Account, under Data management, go\
    \ to Data protection.\n3. Ensure that Enable soft delete for blobs is checked.\n4. Ensure that Enable soft delete for\
    \ containers is checked.\n5. Ensure that the retention period for both is a sufficient length for your\norganization.\n\
    Audit from Azure CLI\nBlob Storage: Ensure that the output of the below command contains enabled status as\ntrue and days\
    \ is not empty or null\naz storage blob service-properties delete-policy show\n --account-name <storageAccount>\n --account-key\
    \ <accountkey>\nAzure Containers: Ensure that within containerDeleteRetentionPolicy, the\nenabled property is set to true.\n\
    az storage account blob-service-properties show\n --account-name <storageAccount>\n --resource-group <resourceGroup>"
  remediation: "Remediate from Azure Portal\n1. Go to Storage Accounts.\n2. For each Storage Account, under Data management,\
    \ go to Data protection.\n3. Check the box next to Enable soft delete for blobs.\n4. Check the box next to Enable soft\
    \ delete for containers.\n5. Set the retention period for both to a sufficient length for your organization.\n6. Click\
    \ Save.\nRemediate from Azure CLI\nUpdate blob storage retention days in below command\naz storage blob service-properties\
    \ delete-policy update --days-retained\n<RetentionDaysValue> --account-name <StorageAccountName> --account-key\n<AccountKey>\
    \ --enable true\nUpdate container retention with the below command\naz storage account blob-service-properties update\n\
    \ --enable-container-delete-retention true\n --container-delete-retention-days <days>\n --account-name <storageAccount>\n\
    \ --resource-group <resourceGroup>"
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Storage Accounts.

      2. For each Storage Account, under Data management, go to Data protection.

      3. Ensure that Enable soft delete for blobs is checked.

      4. Ensure that Enable soft delete for containers is checked.

      5. Ensure that the retention period for both is a sufficient length for your

      organization.

      Audit from Azure CLI

      Blob Storage: Ensure that the output of the below command contains enabled status as

      true and days is not empty or null

      az storage blob service-p'
    severity: medium
- id: '17.8'
  title: Ensure Storage Logging is Enabled for Queue Service for 'Read', 'Write', and 'Delete' requests
  scoring: scored
  profile:
  - Level 2
  description: 'The Storage Queue service stores messages that may be read by any client who has access to the storage account.
    A queue can contain an unlimited number of messages, each of which can be up to 64KB in size using version 2011-08-18
    or newer. Storage Logging happens server-side and allows details for both successful and failed requests to be recorded
    in the storage account. These logs allow users to see the details of read, write, and delete operations against the queues.
    Storage Logging log entries contain the following information about individual requests: Timing information such as start
    time, end-to-end latency, and server latency, authentication details, concurrency information, and the sizes of the request
    and response messages.'
  rationale: Storage Analytics logs contain detailed information about successful and failed requests to a storage service.
    This information can be used to monitor individual requests and to diagnose issues with a storage service. Requests are
    logged on a best-effort basis. Storage Analytics logging is not enabled by default for your storage account.
  impact: Enabling this setting can have a high impact on the cost of the log analytics service and data storage used by logging
    more data per each request. Do not enable this without determining your need for this level of logging, and do not forget
    to check in on data usage and projected cost. Some users have seen their logging costs increase from $10 per month to
    $10,000 per month.
  references:
  - 1. https://docs.microsoft.com/en-us/rest/api/storageservices/about-storageanalytics-logging
  - 2. https://docs.microsoft.com/en-us/cli/azure/storage/logging?view=azure-cli-latest
  page_start: 206
  audit_raw: 'Audit from Azure Portal

    1. Go to Storage Accounts.

    2. For each storage account, under Monitoring, click Diagnostics settings.

    3. Select the queue tab indented below the storage account.

    4. Ensure that at least one diagnostic setting is listed.

    5. Click Edit setting on a diagnostic setting.

    6. Ensure that at least one diagnostic setting has StorageRead, StorageWrite,

    and StorageDelete options selected under the Logs section and that they are

    sent to an appropriate destination.

    Audit from Azure CLI

    Ensure the below command''s output contains properties delete, read and write set to

    true.

    az storage logging show --services q --account-name <storageAccountName>

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 7bd000e3-37c7-4928-9f31-86c4b77c5c45 - Name: ''Configure

    diagnostic settings for Queue Services to Log Analytics workspace'''
  remediation: 'Remediate from Azure Portal

    1. Go to Storage Accounts.

    2. For each storage account, under Monitoring, click Diagnostics settings.

    3. Select the queue tab indented below the storage account.

    4. To create a new diagnostic setting, click + Add diagnostic setting. To

    update an existing diagnostic setting, click Edit setting on the diagnostic

    setting.

    5. Check the boxes next to StorageRead, StorageWrite, and StorageDelete.

    6. Select an appropriate destination.

    7. Click Save.

    Remediate from Azure CLI

    Use the below command to enable the Storage Logging for Queue service.

    az storage logging update --account-name <storageAccountName> --account-key

    <storageAccountKey> --services q --log rwd --retention 90'
  checks:
