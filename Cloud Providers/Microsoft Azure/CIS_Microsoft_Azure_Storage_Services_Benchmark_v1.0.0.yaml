- id: '17.14'
  title: Ensure Azure Resource Manager Delete locks are applied to Azure Storage Accounts
  scoring: manual
  profile:
  - Level 1
  description: Azure Resource Manager CannotDelete (Delete) locks can prevent users from accidentally or maliciously deleting
    a storage account. This feature ensures that while the Storage account can still be modified or used, deletion of the
    Storage account resource requires removal of the lock by a user with appropriate permissions. This feature is a protective
    control for the availability of data. By ensuring that a storage account or its parent resource group cannot be deleted
    without first removing the lock, the risk of data loss is reduced.
  rationale: Applying a Delete lock on storage accounts protects the availability of data by preventing the accidental or
    unauthorized deletion of the entire storage account. It is a fundamental protective control that can prevent data loss
  impact: • Prevents the deletion of the Storage account Resource entirely. • Prevents the deletion of the parent Resource
    Group containing the locked Storage account resource. • Does not prevent other control plane operations, including modification
    of configurations, network settings, containers, and access. • Does not prevent deletion of containers or other objects
    within the storage account.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/common/lock-account-resource
  - 2. https://learn.microsoft.com/en-us/azure/azure-resourcemanager/management/lock-resources
  page_start: 223
  audit_raw: "Audit from Azure Portal\n1. Navigate to the storage account in the Azure portal.\n2. For each storage account,\
    \ under Settings, click Locks.\n3. Ensure that a Delete lock exists on the storage account.\nAudit from Azure CLI\naz\
    \ lock list --resource-group <resource-group> \\\n --resource-name <storage-account> \\\n --resource-type \"Microsoft.Storage/storageAccounts\"\
    \nAudit from PowerShell\nGet-AzResourceLock -ResourceGroupName <RESOURCEGROUPNAME> `\n -ResourceName <STORAGEACCOUNTNAME>\
    \ `\n -ResourceType \"Microsoft.Storage/storageAccounts\"\nAudit from Azure Policy\nThere is currently no built-in Microsoft\
    \ policy to audit resource locks on storage\naccounts.\nCustom and community policy definitions can check for the existence\
    \ of a\n“Microsoft.Authorization/locks” resource with an AuditIfNotExists effect."
  remediation: "Remediate from Azure Portal\n1. Navigate to the storage account in the Azure portal.\n2. Under the Settings\
    \ section, select Locks.\n3. Select Add.\n4. Provide a Name, and choose Delete for the type of lock.\n5. Add a note about\
    \ the lock if desired.\nRemediate from Azure CLI\nReplace the information within <> with appropriate values:\naz lock\
    \ create --name <lock> \\\n --resource-group <resource-group> \\\n --resource <storage-account> \\\n --lock-type CanNotDelete\
    \ \\\n --resource-type Microsoft.Storage/storageAccounts\nRemediate from PowerShell\nReplace the information within <>\
    \ with appropriate values:\nNew-AzResourceLock -LockLevel CanNotDelete `\n -LockName <lock> `\n -ResourceName <storage-account>\
    \ `\n -ResourceType Microsoft.Storage/storageAccounts `\n -ResourceGroupName <resource-group>"
  checks:
  - type: manual_review
    info: "Audit from Azure Portal\n1. Navigate to the storage account in the Azure portal.\n2. For each storage account,\
      \ under Settings, click Locks.\n3. Ensure that a Delete lock exists on the storage account.\nAudit from Azure CLI\n\
      az lock list --resource-group <resource-group> \\\n --resource-name <storage-account> \\\n --resource-type \"Microsoft.Storage/storageAccounts\"\
      \nAudit from PowerShell\nGet-AzResourceLock -ResourceGroupName <RESOURCEGROUPNAME> `\n -ResourceName <STORAGEACCOUNTNAME>\
      \ `\n -ResourceType \"Micros"
    severity: medium
- id: '17.15'
  title: Ensure Azure Resource Manager ReadOnly locks are considered for Azure Storage Accounts
  scoring: manual
  profile:
  - Level 2
  description: Adding an Azure Resource Manager ReadOnly lock can prevent users from accidentally or maliciously deleting
    a storage account, modifying its properties and containers, or creating access assignments. The lock must be removed before
    the storage account can be deleted or updated. It provides more protection than a CannotDelete-type of resource manager
    lock. This feature prevents POST operations on a storage account and containers to the Azure Resource Manager control
    plane, management.azure.com. Blocked operations include listKeys which prevents clients from obtaining the account shared
    access keys. Microsoft does not recommend ReadOnly locks for storage accounts with Azure Files and Table service containers.
    This Azure Resource Manager REST API documentation (spec) provides information about the control plane POST operations
    for Microsoft.Storage resources.
  rationale: Applying a ReadOnly lock on storage accounts protects the confidentiality and availability of data by preventing
    the accidental or unauthorized deletion of the entire storage account and modification of the account, container properties,
    or access permissions. It can offer enhanced protection for blob and queue workloads with tradeoffs in usability and compatibility
    for clients using account shared access keys.
  impact: • Prevents the deletion of the Storage account Resource entirely. • Prevents the deletion of the parent Resource
    Group containing the locked Storage account resource. • Prevents clients from obtaining the storage account shared access
    keys using a listKeys operation. • Requires Entra credentials to access blob and queue data in the Portal. • Data in Azure
    Files or the Table service may be inaccessible to clients using the account shared access keys. • Prevents modification
    of account properties, network settings, containers, and RBAC assignments. • Does not prevent access using existing account
    shared access keys issued to clients. • Does not prevent deletion of containers or other objects within the storage account.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/common/lock-account-resource
  - 2. https://learn.microsoft.com/en-us/azure/azure-resourcemanager/management/lock-resources
  page_start: 226
  audit_raw: "Audit from Azure Portal\n1. Navigate to the storage account in the Azure portal.\n2. For each storage account,\
    \ under Settings, click Locks.\n3. Ensure that a ReadOnly lock exists on the storage account.\nAudit from Azure CLI\n\
    az lock list --resource-group <resource-group> \\\n --resource-name <storage-account> \\\n --resource-type \"Microsoft.Storage/storageAccounts\"\
    \nAudit from PowerShell\nGet-AzResourceLock -ResourceGroupName <RESOURCEGROUPNAME> `\n -ResourceName <STORAGEACCOUNTNAME>\
    \ `\n -ResourceType \"Microsoft.Storage/storageAccounts\"\nAudit from Azure Policy\nThere is currently no built-in Microsoft\
    \ policy to audit resource locks on storage\naccounts.\nCustom and community policy definitions can check for the existence\
    \ of a\n“Microsoft.Authorization/locks” resource with an AuditIfNotExists effect."
  remediation: "Remediate from Azure Portal\n1. Navigate to the storage account in the Azure portal.\n2. Under the Settings\
    \ section, select Locks.\n3. Select Add.\n4. Provide a Name, and choose ReadOnly for the type of lock.\n5. Add a note\
    \ about the lock if desired.\nRemediate from Azure CLI\nReplace the information within <> with appropriate values:\naz\
    \ lock create --name <lock> \\\n --resource-group <resource-group> \\\n --resource <storage-account> \\\n --lock-type\
    \ ReadOnly \\\n --resource-type Microsoft.Storage/storageAccounts\nRemediate from PowerShell\nReplace the information\
    \ within <> with appropriate values:\nNew-AzResourceLock -LockLevel ReadOnly `\n -LockName <lock> `\n -ResourceName <storage-account>\
    \ `\n -ResourceType Microsoft.Storage/storageAccounts `\n -ResourceGroupName <resource-group>"
  checks:
  - type: manual_review
    info: "Audit from Azure Portal\n1. Navigate to the storage account in the Azure portal.\n2. For each storage account,\
      \ under Settings, click Locks.\n3. Ensure that a ReadOnly lock exists on the storage account.\nAudit from Azure CLI\n\
      az lock list --resource-group <resource-group> \\\n --resource-name <storage-account> \\\n --resource-type \"Microsoft.Storage/storageAccounts\"\
      \nAudit from PowerShell\nGet-AzResourceLock -ResourceGroupName <RESOURCEGROUPNAME> `\n -ResourceName <STORAGEACCOUNTNAME>\
      \ `\n -ResourceType \"Micr"
    severity: medium
- id: '17.16'
  title: Ensure Redundancy is set to 'geo-redundant storage (GRS)' on critical Azure Storage Accounts
  scoring: scored
  profile:
  - Level 2
  description: Geo-redundant storage (GRS) in Azure replicates data three times within the primary region using locally redundant
    storage (LRS) and asynchronously copies it to a secondary region hundreds of miles away. This setup ensures high availability
    and resilience by providing 16 nines (99.99999999999999%) durability over a year, safeguarding data against regional outages.
  rationale: Enabling GRS protects critical data from regional failures by maintaining a copy in a geographically separate
    location. This significantly reduces the risk of data loss, supports business continuity, and meets high availability
    requirements for disaster recovery.
  impact: Enabling geo-redundant storage on Azure storage accounts increases costs due to cross-region data replication.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
  - 2. https://learn.microsoft.com/en-us/azure/storage/common/redundancy-migration
  page_start: 230
  audit_raw: 'Audit from Azure Portal

    1. Go to Storage accounts.

    2. Click on a storage account.

    3. Under Data management, click Redundancy.

    4. Ensure that Redundancy is set to Geo-redundant storage (GRS).

    5. Repeat steps 1-4 for each storage account.

    Audit from Azure CLI

    Run the following command to list storage accounts:

    az storage account list

    For each storage account, run the following command:

    az storage account show --resource-group <resource-group> --name <storageaccount>

    Under sku, ensure that name is set to Standard_GRS.

    Audit from PowerShell

    Run the following command to list storage accounts:

    Get-AzStorageAccount

    Run the following command to get the storage account in a resource group with a given

    name:

    $storageAccount = Get-AzStorageAccount -ResourceGroupName <resource-group> -

    Name <storage-account>

    Run the following command to get the redundancy setting for the storage account:

    $storageAccount.SKU.Name

    Ensure that the command returns Standard_GRS.

    Repeat for each storage account.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: bf045164-79ba-4215-8f95-f8048dc1780b

    • Name: ''Geo-redundant storage should be enabled for Storage Accounts'''
  remediation: 'Remediate from Azure Portal

    1. Go to Storage accounts.

    2. Click on a storage account.

    3. Under Data management, click Redundancy.

    4. From the Redundancy drop-down menu, select Geo-redundant storage

    (GRS).

    5. Click Save.

    6. Repeat steps 1-5 for each storage account requiring remediation.

    Remediate from Azure CLI

    For each storage account requiring remediation, run the following command to enable

    geo-redundant storage:

    az storage account update --resource-group <resource-group> --name <storageaccount> --sku Standard_GRS

    Remediate from PowerShell

    For each storage account requiring remediation, run the following command to enable

    geo-redundant storage:

    Set-AzStorageAccount -ResourceGroupName <resource-group> -Name <storageaccount> -SkuName "Standard_GRS"'
  checks:
