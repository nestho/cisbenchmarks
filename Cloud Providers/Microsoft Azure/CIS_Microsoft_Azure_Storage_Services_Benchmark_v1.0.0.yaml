    checked.

    6. Ensure the box next to Enable soft delete and security settings for

    hybrid workloads is checked.

    7. Ensure that the Soft delete retention period is set to an appropriate value

    between 14 and 180, inclusive.

    8. Repeat steps 1-7 for each Recovery Services vault.

