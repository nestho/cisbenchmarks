    For each Recovery Services vault requiring remediation, run the following command to

    assign a customer-managed encryption key:

    Set-AzRecoveryServicesVaultProperty -VaultId <recovery-services-vault-id> -

    EncryptionKeyId <cmk-uri> -UseSystemAssignedIdentity $true

    Note: Use -UseSystemAssignedIdentity $false with the above command and -

