  title: Ensure backup data in Recovery Services vaults is encrypted using customer-managed keys (CMK)
  scoring: scored
  profile:
  - Level 2
  description: 'Recovery Services vaults offer two encryption options: Microsoft-managed keys, which provide automatic encryption
    without user intervention, and customer-managed keys (CMK), which allow organizations to retain full control over their
    encryption keys for enhanced security and compliance.'
  rationale: Using customer-managed keys (CMKs) to encrypt Recovery Services vaults enhances security by granting organizations
    complete control over their encryption keys.
  impact: There are costs and configuration overhead associated with setting up and managing customer-managed keys.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/backup/encryption-at-rest-with-cmk
  - 2. https://learn.microsoft.com/en-us/cli/azure/backup/vault
