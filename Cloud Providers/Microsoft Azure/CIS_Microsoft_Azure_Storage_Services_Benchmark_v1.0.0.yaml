  title: Ensure 'Public network access' is set to 'Disabled' on Azure Elastic SAN
  scoring: scored
  profile:
  - Level 2
  description: Azure Elastic SAN is a scalable, high-performance cloud-based storage solution. Disabling public network access
    at the SAN level ensures that Elastic SAN resources are accessible only through private networks.
  rationale: Disabling public network access for Azure Elastic SAN at the SAN level enhances security by preventing unauthorized
    external access to sensitive storage resources.
  impact: Disabling public network access at the SAN level incurs no direct cost. However, there may be costs and configuration
    overhead associated with setting up and managing private network access to securely connect to Azure Elastic SAN resources.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/elastic-san/elastic-sannetworking
  - 2. https://learn.microsoft.com/en-us/cli/azure/elastic-san
