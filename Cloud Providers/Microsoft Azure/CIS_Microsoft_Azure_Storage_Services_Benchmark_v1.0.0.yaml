- id: 17.1.4
  title: Ensure that shared access signature (SAS) tokens expire within an hour
  scoring: manual
  profile:
  - Level 1
  description: Shared access signature (SAS) tokens provide restricted access to Azure Storage resources (such as blobs, files,
    queues, or tables) for a defined time period with specific permissions. It enables users to interact with the resources
    without exposing account keys, offering precise control over the permitted actions (e.g., read, write) and the duration
    of access. To minimize security risks, SAS tokens should be configured with the shortest possible lifespan, ideally lasting
    no longer than an hour.
  rationale: A short lifespan for SAS tokens is recommended to minimize the risk of unauthorized access. SAS tokens grant
    time-limited access to resources, and a longer duration increases the opportunity for misuse if the token is compromised.
    By setting a shorter lifespan, the potential for security breaches is reduced.
  impact: SAS can pose security risks if they are not managed carefully.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/storage-sas-overview
  - 2. https://docs.microsoft.com/en-us/rest/api/storageservices/delegating-accesswith-a-shared-access-signature
  page_start: 173
  audit_raw: 'Currently, SAS token expiration times cannot be audited. Until Microsoft makes the

    token expiration time a setting rather than a token creation parameter, this

    recommendation will require manual verification.'
  remediation: 'Remediate from Azure Portal

    If SAS have been created without a short lifespan and were created with a stored

    access policy (SAP), the SAS can be revoked by deleting the SAP or updating the SAP

    expiration time to a time in the past:

    1. Go to Storage accounts.

    2. Click on a storage account.

    3. Under Data storage, click Containers, File shares, Queues, or Tables.

    4. Click the three dots next to a listed item.

    5. Click Access policy.

    6. Click the three dots next to an access policy.

    7. Click Delete.

    8. Click Save.

    9. Repeat steps 1-8 as needed to revoke SAS created with SAP.

    If SAS have been created without a short lifespan and were not created with a SAP, the

    SAS can be revoked by regenerating the storage account access keys:

    Note: Regenerating access keys can affect any applications or Azure services that are

    dependent on the storage account key.

    1. Go to Storage accounts.

    2. Click on a storage account.

    3. Under Security + networking, click Access keys.

    4. Next to each key, click Rotate key.

    5. Click Yes to confirm.

    6. Repeat steps 1-5 as needed to revoke SAS.'
  checks:
  - type: manual_review
    info: 'Currently, SAS token expiration times cannot be audited. Until Microsoft makes the

      token expiration time a setting rather than a token creation parameter, this

      recommendation will require manual verification.'
    severity: medium
- id: 17.1.5
  title: Ensure 'Allow storage account key access' for Azure Storage Accounts is 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Every secure request to an Azure Storage account must be authorized. By default, requests can be authorized
    with either Microsoft Entra credentials or by using the account access key for Shared Key authorization.
  rationale: Microsoft Entra ID provides superior security and ease of use compared to Shared Key and is recommended by Microsoft.
    To require clients to use Microsoft Entra ID for authorizing requests, you can disallow requests to the storage account
    that are authorized with Shared Key.
  impact: When you disallow Shared Key authorization for a storage account, any requests to the account that are authorized
    with Shared Key, including shared access signatures (SAS), will be denied. Client applications that currently access the
    storage account using the Shared Key will no longer function.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/storage/common/shared-keyauthorization-prevent
  - 2. https://learn.microsoft.com/en-us/cli/azure/storage/account
  page_start: 175
  audit_raw: 'Audit from Azure Portal

    1. Go to Storage accounts.

    2. Click on a storage account.

    3. Under Settings, click Configuration.

    4. Under Allow storage account key access, ensure that the radio button next

    to Disabled is selected.

    5. Repeat steps 1-4 for each storage account.

    Audit from Azure CLI

    Run the following command to list storage accounts:

    az storage account list

    For each storage account, run the following command:

    az storage account show --resource-group <resource-group> --name <storageaccount>

    Ensure that allowSharedKeyAccess is set to false.

    Audit from PowerShell

    Run the following command to list storage accounts:

    Get-AzStorageAccount

    Run the following command to get the storage account in a resource group with a given

    name:

    $storageAccount = Get-AzStorageAccount -ResourceGroupName <resource-group> -

    Name <storage-account>

    Run the following command to get the shared key access setting for the storage

    account:

    $storageAccount.allowSharedKeyAccess

    Ensure that the command returns False.

    Repeat for each storage account.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 8c6a50c6-9ffd-4ae7-986f-5fa6111f9a54

    • Name: ''Storage accounts should prevent shared key access'''
  remediation: 'Remediate from Azure Portal

    1. Go to Storage accounts.

    2. Click on a storage account.

    3. Under Settings, click Configuration.

    4. Under Allow storage account key access, click the radio button next to

    Disabled.

    5. Click Save.

    6. Repeat steps 1-5 for each storage account requiring remediation.

    Remediate from Azure CLI

    For each storage account requiring remediation, run the following command to disallow

    shared key authorization:

    az storage account update --resource-group <resource-group> --name <storageaccount> --allow-shared-key-access false

    Remediate from PowerShell

    For each storage account requiring remediation, run the following command to disallow

    shared key authorization:

    Set-AzStorageAccount -ResourceGroupName <resource-group> -Name <storageaccount> -AllowSharedKeyAccess $false'
