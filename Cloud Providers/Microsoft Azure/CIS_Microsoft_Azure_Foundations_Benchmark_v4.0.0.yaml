- id: '6.7'
  title: Ensure that account 'Lockout duration in seconds' is greater than or equal to '60'
  scoring: manual
  profile:
  - Level 1
  description: The account lockout duration value determines how long an account retains the status of lockout, and therefore
    how long before a user can continue to attempt to login after passing the lockout threshold.
  rationale: Account lockout is a method of protecting against brute-force and password spray attacks. Once the lockout threshold
    has been exceeded, the account enters a lockedout state which prevents all login attempts for a variable duration. The
    lockout in combination with a reasonable duration reduces the total number of failed login attempts that a malicious actor
    can execute in a given period of time.
  impact: If account lockout duration is set too low (less than 60 seconds), malicious actors can perform more password spray
    and brute-force attempts over a given period of time. If the account lockout duration is set too high (more than 300 seconds)
    users may experience inconvenient delays during lockout.
  references:
  - 1. https://learn.microsoft.com/en-us/entra/identity/authentication/howto-passwordsmart-lockout#manage-microsoft-entra-smart-lockout-values
  page_start: 128
  audit_raw: 'Audit from Azure Portal

