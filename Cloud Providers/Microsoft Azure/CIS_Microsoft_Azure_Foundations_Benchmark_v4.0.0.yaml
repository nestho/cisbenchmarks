      az ad user list --query "[?userType==''Guest'']"

      Ensure all users listed are still required and not inactive.

      Audit from Azure'
- id: 6.3.3
  title: Ensure that use of the 'User Access Administrator' role is restricted
  scoring: scored
  profile:
  - Level 1
  description: The User Access Administrator role grants the ability to view all resources and manage access assignments at
    any subscription or management group level within the tenant. Due to its high privilege level, this role assignment should
    be removed immediately after completing the necessary changes at the root scope to minimize security risks.
  rationale: The User Access Administrator role provides extensive access control privileges. Unnecessary assignments heighten
    the risk of privilege escalation and unauthorized access. Removing the role immediately after use minimizes security exposure.
  impact: Increased administrative effort to manage and remove role assignments appropriately.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
  - 2. https://learn.microsoft.com/en-us/azure/role-based-access-control/elevateaccess-global-admin
  page_start: 118
  audit_raw: 'Audit from Azure Portal

    1. From Azure Home select the Portal Menu.

    2. Select Subscriptions.

    3. Select a subscription.

    4. Select Access control (IAM).

    5. Look for the following banner at the top of the page: Action required: X

    users have elevated access in your tenant. You should take

    immediate action and remove all role assignments with elevated

    access. If the banner is displayed, the User Access Administrator is

    assigned.

    Audit from Azure CLI

    Run the following command:

    az role assignment list --role "User Access Administrator" --scope "/"

    Ensure that the command does not return any User Access Administrator role

    assignment information.'
  remediation: 'Remediate from Azure Portal

    1. From Azure Home select the Portal Menu.

    2. Select Subscriptions.

    3. Select a subscription.

    4. Select Access control (IAM).

    5. Look for the following banner at the top of the page: Action required: X

    users have elevated access in your tenant. You should take

    immediate action and remove all role assignments with elevated

    access.

    6. Click View role assignments.

    7. Click Remove.

