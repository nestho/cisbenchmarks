    Tenant:tenantId, Location:location, Provisioning_State:provisioningState}"

    Ensure the above command produces output, otherwise Application Insights has

    not been configured.

    Audit from PowerShell

    Get-AzApplicationInsights|select

    location,name,appid,provisioningState,tenanted'
