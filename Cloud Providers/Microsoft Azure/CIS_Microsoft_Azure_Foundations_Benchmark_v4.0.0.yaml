- id: '6.11'
  title: Ensure that 'Notify all admins when other admins reset their password?' is set to 'Yes'
  scoring: manual
  profile:
  - Level 1
  description: Ensure that all Global Administrators are notified if any other administrator resets their password.
  rationale: Administrator accounts are sensitive. Any password reset activity notification, when sent to all Administrators,
    ensures that all Global Administrators can passively confirm if such a reset is a common pattern within their group. For
    example, if all Administrators change their password every 30 days, any password reset activity before that may require
    administrator(s) to evaluate any unusual activity and confirm its origin.
  impact: All Global Administrators will receive a notification from Azure every time a password is reset. This is useful
    for auditing procedures to confirm that there are no out of the ordinary password resets for Administrators. There is
    additional overhead, however, in the time required for Global Administrators to audit the notifications. This setting
    is only useful if all Global Administrators pay attention to the notifications and audit each one.
  references:
  - 1. https://learn.microsoft.com/en-us/entra/identity/authentication/concept-ssprhowitworks#notifications
