    resource <key_vault_id> --logs

    "[{category:audit,enabled:true},{category:allLogs,enabled:true}]" --metrics

    "[{category:AllMetrics,enabled:true}]" <[--event-hub <event_hub_ID> --eventhub-rule <event_hub_auth_rule_ID> | --storage-account
