- id: '6.24'
  title: Ensure that a custom role is assigned permissions for administering resource locks
  scoring: manual
  profile:
  - Level 2
  description: Resource locking is a powerful protection mechanism that can prevent inadvertent modification or deletion of
    resources within Azure subscriptions and resource groups, and it is a recommended NIST configuration. Users who are set
    as subscription owners are able to make administrative changes to the subscriptions and move them into and out of Microsoft
    Entra ID.
  rationale: Given that the resource lock functionality is outside of standard Role-Based Access Control (RBAC), it would
    be prudent to create a resource lock administrator role to prevent inadvertent unlocking of resources. Permissions to
    move subscriptions in and out of a Microsoft Entra tenant must only be given to appropriate administrative personnel.
    A subscription that is moved into a Microsoft Entra tenant may be within a folder to which other users have elevated permissions.
    This prevents loss of data or unapproved changes of the objects within by potential bad actors.
  impact: By adding this role, specific permissions may be granted for managing only resource locks rather than needing to
    provide the broad Owner or User Access Administrator role, reducing the risk of the user being able to cause unintentional
    damage. Subscriptions will need to have these settings turned off to be moved.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/role-based-access-control/custom-roles
  - 2. https://docs.microsoft.com/en-us/azure/role-based-access-control/check-access
  - 1. https://docs.microsoft.com/en-us/azure/cost-managementbilling/manage/manage-azure-subscription-policy
  - 2. https://learn.microsoft.com/en-us/entra/fundamentals/how-subscriptionsassociated-directory
  page_start: 169
  audit_raw: 'Audit from Azure Portal

    1. In the Azure portal, navigate to a subscription or resource group.

    2. Click Access control (IAM).

    3. Click Roles.

    4. Click Type : All.

    5. Click to view the drop-down menu.

    6. Select Custom role.

    7. Click View in the Details column of a custom role.

    8. Review the role permissions.

    9. Click Assignments and review the assignments.

    10. Click the X to exit the custom role details page.

    11. Repeat steps 7-10. Ensure that at least one custom role exists that assigns the

    Microsoft.Authorization/locks permission to appropriate members.

    12. Repeat steps 1-11 for each subscription or resource group.

    Audit from Azure Portal

    1. From the Azure Portal Home select the portal menu

    2. Select Subscriptions

    3. In the Advanced options drop-down menu, select Manage Policies

    4. Ensure Subscription leaving Microsoft Entra tenant and Subscription

    entering Microsoft Entra tenant are set to Permit no one'
  remediation: 'Remediate from Azure Portal

    1. In the Azure portal, navigate to a subscription or resource group.

    2. Click Access control (IAM).

    3. Click + Add.

    4. Click Add custom role.

    5. In the Custom role name field enter Resource Lock Administrator.

    6. In the Description field enter Can Administer Resource Locks.

    7. For Baseline permissions select Start from scratch.

    8. Click Next.

    9. Click Add permissions.

    10. In the Search for a permission box, type

    Microsoft.Authorization/locks.

    11. Click the result.

    12. Check the box next to Permission.

    13. Click Add.

    14. Click Review + create.

    15. Click Create.

    16. Click OK.

    17. Click + Add.

    18. Click Add role assignment.

    19. In the Search by role name, description, permission, or ID box, type

    Resource Lock Administrator.

    20. Select the role.

    21. Click Next.

    22. Click + Select members.

    23. Select appropriate members.

    24. Click Select.

    25. Click Review + assign.

    26. Click Review + assign again.

    27. Repeat steps 1-26 for each subscription or resource group requiring remediation.

    Remediate from PowerShell:

    Below is a PowerShell definition for a resource lock administrator role created at an

    Azure Management group level

    Import-Module Az.Accounts

    Connect-AzAccount

    $role = Get-AzRoleDefinition "User Access Administrator"

    $role.Id = $null

    $role.Name = "Resource Lock Administrator"

    $role.Description = "Can Administer Resource Locks"

    $role.Actions.Clear()

    $role.Actions.Add("Microsoft.Authorization/locks/*")

    $role.AssignableScopes.Clear()

    * Scope at the Management group level Management group

    $role.AssignableScopes.Add("/providers/Microsoft.Management/managementGroups/

    MG-Name")

    New-AzRoleDefinition -Role $role

    Get-AzureRmRoleDefinition "Resource Lock Administrator"

    Remediate from Azure Portal

    1. From the Azure Portal Home select the portal menu

    2. Select Subscriptions

    3. In the Advanced options drop-down menu, select Manage Policies

    4. Set Subscription leaving Microsoft Entra tenant and Subscription

    entering Microsoft Entra tenant to Permit no one

    5. Click Save changes'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. In the Azure portal, navigate to a subscription or resource group.

      2. Click Access control (IAM).

      3. Click Roles.

      4. Click Type : All.

      5. Click to view the drop-down menu.

      6. Select Custom role.

      7. Click View in the Details column of a custom role.

      8. Review the role permissions.

      9. Click Assignments and review the assignments.

      10. Click the X to exit the custom role details page.

      11. Repeat steps 7-10. Ensure that at least one custom role exists that assigns the

      Micro'
    severity: medium
- id: '6.26'
  title: Ensure fewer than 5 users have global administrator assignment
  scoring: manual
  profile:
  - Level 1
  description: This recommendation aims to maintain a balance between security and operational efficiency by ensuring that
    a minimum of 2 and a maximum of 4 users are assigned the Global Administrator role in Microsoft Entra ID. Having at least
    two Global Administrators ensures redundancy, while limiting the number to four reduces the risk of excessive privileged
    access.
  rationale: The Global Administrator role has extensive privileges across all services in Microsoft Entra ID. The Global
    Administrator role should never be used in regular daily activities; administrators should have a regular user account
    for daily activities, and a separate account for administrative responsibilities. Limiting the number of Global Administrators
    helps mitigate the risk of unauthorized access, reduces the potential impact of human error, and aligns with the principle
    of least privilege to reduce the attack surface of an Azure tenant. Conversely, having at least two Global Administrators
    ensures that administrative functions can be performed without interruption in case of unavailability of a single admin.
  impact: Implementing this recommendation may require changes in administrative workflows or the redistribution of roles
    and responsibilities. Adequate training and awareness should be provided to all Global Administrators.
  references:
  - 1. https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/bestpractices#5-limit-the-number-of-global-administrators-to-less-than-5
  - 2. https://learn.microsoft.com/en-us/microsoft-365/admin/add-users/about-adminroles?view=o365-worldwide#security-guidelines-for-assigning-roles
  page_start: 175
  audit_raw: 'Audit from Azure Portal

    1. From Azure Home select the Portal Menu

    2. Select Microsoft Entra ID

    3. Under Manage, select Roles and administrators

    4. Under Administrative Roles, select Global Administrator

    5. Ensure less than 5 users are actively assigned the role.

    6. Ensure that at least 2 users are actively assigned the role.'
  remediation: 'Remediate from Azure Portal

    1. From Azure Home select the Portal Menu

    2. Select Microsoft Entra ID

    3. Under Manage, select Roles and administrators

    4. Under Administrative Roles, select Global Administrator

    If more than 4 users are assigned:

    1. Remove Global Administrator role for users which do not or no longer require the

    role.

    2. Assign Global Administrator role via PIM which can be activated when required.

    3. Assign more granular roles to users to conduct their duties.

    If only one user is assigned:

    1. Provide the Global Administrator role to a trusted user or create a break glass

    admin account.'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. From Azure Home select the Portal Menu

      2. Select Microsoft Entra ID

      3. Under Manage, select Roles and administrators

      4. Under Administrative Roles, select Global Administrator

      5. Ensure less than 5 users are actively assigned the role.

      6. Ensure that at least 2 users are actively assigned the role.'
    severity: medium
- id: 7.1.1.1
  title: Ensure that a 'Diagnostic Setting' exists for Subscription Activity Logs
  scoring: manual
  profile:
  - Level 1
  description: Enable Diagnostic settings for exporting activity logs. Diagnostic settings are available for each individual
    resource within a subscription. Settings should be configured for all appropriate resources for your environment.
  rationale: A diagnostic setting controls how a diagnostic log is exported. By default, logs are retained only for 90 days.
    Diagnostic settings should be defined so that logs can be exported and stored for a longer duration to analyze security
    activities within an Azure subscription.
  impact: ''
  references:
  - 1. https://docs.microsoft.com/en-us/azure/monitoring-and-diagnostics/monitoringoverview-activity-logs#export-the-activity-log-with-a-log-profile
  - 2. https://learn.microsoft.com/en-us/cli/azure/monitor/diagnosticsettings?view=azure-cli-latest
  page_start: 180
  audit_raw: 'Audit from Azure Portal

    To identify Diagnostic Settings on a subscription:

    1. Go to Monitor

    2. Click Activity Log

    3. Click Export Activity Logs

    4. Select a Subscription

    5. Ensure a Diagnostic setting exists for the selected Subscription

    To identify Diagnostic Settings on specific resources:

    1. Go to Monitoring

    2. Click Diagnostic settings

    3. Ensure a Diagnostic setting exists for all appropriate resources.

    Audit from Azure CLI

    To identify Diagnostic Settings on a subscription:

    az monitor diagnostic-settings subscription list --subscription <subscription

    ID>

    To identify Diagnostic Settings on a resource

    az monitor diagnostic-settings list --resource <resource Id>

    Audit from PowerShell

    To identify Diagnostic Settings on a Subscription:

    Get-AzDiagnosticSetting -SubscriptionId <subscription ID>

    To identify Diagnostic Settings on a specific resource:

    Get-AzDiagnosticSetting -ResourceId <resource ID>'
  remediation: 'Remediate from Azure Portal

    To enable Diagnostic Settings on a Subscription:

    1. Go to Monitor

    2. Click on Activity log

    3. Click on Export Activity Logs

    4. Click + Add diagnostic setting

    5. Enter a Diagnostic setting name

    6. Select Categories for the diagnostic setting

    7. Select the appropriate Destination details (this may be Log Analytics,

    Storage Account, Event Hub, or Partner solution)

    8. Click Save

    To enable Diagnostic Settings on a specific resource:

    1. Go to Monitoring

    2. Click Diagnostic settings

    3. Select Add diagnostic setting

    4. Enter a Diagnostic setting name

    5. Select the appropriate log, metric, and destination (this may be Log Analytics,

    Storage Account, Event Hub, or Partner solution)

    6. Click Save

    Repeat these step for all resources as needed.

    Remediate from Azure CLI

    To configure Diagnostic Settings on a Subscription:

    az monitor diagnostic-settings subscription create --subscription

    <subscription id> --name <diagnostic settings name> --location <location> <[-

    -event-hub <event hub ID> --event-hub-auth-rule <event hub auth rule ID>] [--

    storage-account <storage account ID>] [--workspace <log analytics workspace

    ID>] --logs "<JSON encoded categories>" (e.g.

    [{category:Security,enabled:true},{category:Administrative,enabled:true},{cat

    egory:Alert,enabled:true},{category:Policy,enabled:true}])

    To configure Diagnostic Settings on a specific resource:

    az monitor diagnostic-settings create --subscription <subscription ID> --

    resource <resource ID> --name <diagnostic settings name> <[--event-hub <event

    hub ID> --event-hub-rule <event hub auth rule ID>] [--storage-account

    <storage account ID>] [--workspace <log analytics workspace ID>] --logs

    <resource specific JSON encoded log settings> --metrics <metric settings

    (shorthand|json-file|yaml-file)>

    Remediate from PowerShell

    To configure Diagnostic Settings on a subscription:

    $logCategories = @();

    $logCategories += New-AzDiagnosticSettingSubscriptionLogSettingsObject -

    Category Administrative -Enabled $true

    $logCategories += New-AzDiagnosticSettingSubscriptionLogSettingsObject -

    Category Security -Enabled $true

    $logCategories += New-AzDiagnosticSettingSubscriptionLogSettingsObject -

    Category ServiceHealth -Enabled $true

    $logCategories += New-AzDiagnosticSettingSubscriptionLogSettingsObject -

    Category Alert -Enabled $true

    $logCategories += New-AzDiagnosticSettingSubscriptionLogSettingsObject -

    Category Recommendation -Enabled $true

    $logCategories += New-AzDiagnosticSettingSubscriptionLogSettingsObject -

    Category Policy -Enabled $true

    $logCategories += New-AzDiagnosticSettingSubscriptionLogSettingsObject -

    Category Autoscale -Enabled $true

    $logCategories += New-AzDiagnosticSettingSubscriptionLogSettingsObject -

    Category ResourceHealth -Enabled $true

    New-AzSubscriptionDiagnosticSetting -SubscriptionId <subscription ID> -Name

    <Diagnostic settings name> <[-EventHubAuthorizationRule <event hub auth rule

    ID> -EventHubName <event hub name>] [-StorageAccountId <storage account ID>]

    [-WorkSpaceId <log analytics workspace ID>] [-MarketplacePartner ID <full ARM

    Marketplace resource ID>]> -Log $logCategories

    To configure Diagnostic Settings on a specific resource:

    $logCategories = @()

    $logCategories += New-AzDiagnosticSettingLogSettingsObject -Category

    <resource specific log category> -Enabled $true

    Repeat command and variable assignment for each Log category specific to the

    resource where this Diagnostic Setting will get configured.

    $metricCategories = @()

    $metricCategories += New-AzDiagnosticSettingMetricSettingsObject -Enabled

    $true [-Category <resource specific metric category | AllMetrics>] [-

    RetentionPolicyDay <Integer>] [-RetentionPolicyEnabled $true]

    Repeat command and variable assignment for each Metric category or use the

    ''AllMetrics'' category.

    New-AzDiagnosticSetting -ResourceId <resource ID> -Name <Diagnostic settings

    name> -Log $logCategories -Metric $metricCategories [-

    EventHubAuthorizationRuleId <event hub auth rule ID> -EventHubName <event hub

    name>] [-StorageAccountId <storage account ID>] [-WorkspaceId <log analytics

    workspace ID>] [-MarketplacePartnerId <full ARM marketplace resource ID>]>'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      To identify Diagnostic Settings on a subscription:

      1. Go to Monitor

      2. Click Activity Log

      3. Click Export Activity Logs

      4. Select a Subscription

      5. Ensure a Diagnostic setting exists for the selected Subscription

      To identify Diagnostic Settings on specific resources:

      1. Go to Monitoring

      2. Click Diagnostic settings

      3. Ensure a Diagnostic setting exists for all appropriate resources.

      Audit from Azure CLI

      To identify Diagnostic Settings on a subscription:

      az monitor diagnos'
    severity: medium
- id: 7.1.1.2
  title: Ensure Diagnostic Setting captures appropriate categories
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: 'Prerequisite: A Diagnostic Setting must exist. If a Diagnostic Setting does not exist, the navigation and
    options within this recommendation will not be available. Please review the recommendation at the beginning of this subsection
    titled: "Ensure that a ''Diagnostic Setting'' exists." The diagnostic setting should be configured to log the appropriate
    activities from the control/management plane. Storage accounts with the activity log exports can be configured to use
    Customer Managed Keys (CMK).'
  rationale: A diagnostic setting controls how the diagnostic log is exported. Capturing the diagnostic setting categories
    for appropriate control/management plane activities allows proper alerting. Configuring the storage account with the activity
    log export container to use CMKs provides additional confidentiality controls on log data, as a given user must have read
    permission on the corresponding storage account and must be granted decrypt permission by the CMK.
  impact: 'NOTE: You must have your key vault setup to utilize this. All Audit Logs will be encrypted with a key you provide.
    You will need to set up customer managed keys separately, and you will select which key to use via the instructions here.
    You will be responsible for the lifecycle of the keys, and will need to manually replace them at your own determined intervals
    to keep the data secure.'
  references:
