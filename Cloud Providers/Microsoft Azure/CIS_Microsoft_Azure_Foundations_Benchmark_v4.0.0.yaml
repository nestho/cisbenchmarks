      can utilize the provided notebook that lists all PATs not rotated or updated in the last 90

      days, allowin'
    severity: medium
- id: 3.1.7
  title: Ensure that diagnostic log delivery is configured for Azure Databricks
  scoring: manual
  profile:
  - Level 1
  description: 'Azure Databricks Diagnostic Logging provides insights into system operations, user activities, and security
    events within a Databricks workspace. Enabling diagnostic logs helps organizations: • Detect security threats by logging
    access, job executions, and cluster activities. • Ensure compliance with industry regulations such as SOC 2, HIPAA, and
    GDPR. • Monitor operational performance and troubleshoot issues proactively.'
  rationale: Diagnostic logging provides visibility into security and operational activities within Databricks workspaces
    while maintaining an audit trail for forensic investigations, and it supports compliance with regulatory standards that
    require logging and monitoring.
  impact: Logs consume storage and may require additional monitoring tools, leading to increased operational overhead and
    costs. Incomplete log configurations may result in missing critical events, reducing monitoring effectiveness.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/databricks/admin/account-settings/auditlog-delivery
  - 2. https://learn.microsoft.com/en-us/troubleshoot/azure/azure-monitor/loganalytics/billing/configure-data-retention
  page_start: 62
  audit_raw: 'Audit from Azure Portal

    Check if diagnostic logging is enabled for the Databricks workspace:

    1. Go to Azure Databricks.

    2. Select a workspace.

    3. In the left-hand menu, select Monitoring > Diagnostic settings.

    4. Verify if a diagnostic setting is configured. If not, diagnostic logging is not

    enabled.

    Ensure that logging is enabled for the following categories:

    • Audit Logs: User and system activities.

    • Cluster Logs: Cluster state changes and errors.

    • Notebook Logs: Execution events.

    • Jobs Logs: Job execution tracking.

    Verify that logs are being sent to one or more of the following destinations:

    • Azure Log Analytics workspace: For analysis and querying.

    • Azure Storage Account: For long-term retention.

    • Azure Event Hubs: For integration with SIEM tools.

    Audit from Azure CLI

    Check if diagnostic logging is enabled for the Databricks workspace:

    az monitor diagnostic-settings list --resource <databricks-resource-id>

    If the output is empty, no diagnostic settings are configured.

    Verify log categories being collected:

    az monitor diagnostic-settings show --name <setting-name> --resource

    <databricks-resource-id>

    Review the output to confirm that the necessary log categories are enabled.

    Check if logs are stored securely in an approved location:

    az monitor diagnostic-settings list --resource <databricks-resource-id>

    Review the storageAccountId, workspaceId, and eventHubAuthorizationRuleId fields in

    the output to confirm the log destinations.

    Audit from PowerShell

    Check if diagnostic logging is enabled for the Databricks workspace:

    Get-AzDiagnosticSetting -ResourceId <databricks-resource-id>

    An empty result indicates that diagnostic logging is not enabled.'
  remediation: 'Remediate from Azure Portal

    Enable diagnostic logging for Azure Databricks:

    1. Navigate to your Azure Databricks workspace.

    2. In the left-hand menu, select Monitoring > Diagnostic settings.

    3. Click + Add diagnostic setting.

    4. Under Category details, select the log categories you wish to capture, such

    as AuditLogs, Clusters, Notebooks, and Jobs.

    5. Choose a destination for the logs:

    o Log Analytics workspace: For advanced querying and monitoring.

    o Storage account: For long-term retention.

    o Event Hub: For integration with third-party systems.

    6. Provide a Name for the diagnostic setting.

    7. Click Save.

    Implement log retention policies:

    1. Navigate to your Log Analytics workspace.

    2. Under General, select Usage and estimated costs.

    3. Click Data Retention.

    4. Adjust the retention period slider to the desired number of days (up to 730 days).

    5. Click OK.

    Monitor logs for anomalies:

    1. Navigate to Azure Monitor.

    2. Select Alerts > + New alert rule.

    3. Under Scope, specify the Databricks resource.

    4. Define Condition based on log queries that identify anomalies (e.g.

    unauthorized access attempts).

    5. Configure Actions to notify stakeholders or trigger automated responses.

    6. Provide an Alert rule name and description.

    7. Click Create alert rule.

    Remediate from Azure CLI

    Enable diagnostic logging for Azure Databricks:

    az monitor diagnostic-settings create --name "DatabricksLogging" --resource

    <databricks-resource-id> --logs ''[{"category": "AuditLogs", "enabled": true},

    {"category": "Clusters", "enabled": true}, {"category": "Notebooks",

    "enabled": true}, {"category": "Jobs", "enabled": true}]'' --workspace <loganalytics-id>

    Implement log retention policies:

    az monitor log-analytics workspace update --resource-group <resource-group> -

    -name <log-analytics-name> --retention-time 365

    Monitor logs for anomalies:

    az monitor activity-log alert create --name "DatabricksAnomalyAlert" --

    resource-group <resource-group> --scopes <databricks-resource-id> --condition

    "contains ''UnauthorizedAccess''"'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      Check if diagnostic logging is enabled for the Databricks workspace:

      1. Go to Azure Databricks.

      2. Select a workspace.

      3. In the left-hand menu, select Monitoring > Diagnostic settings.

      4. Verify if a diagnostic setting is configured. If not, diagnostic logging is not

      enabled.

      Ensure that logging is enabled for the following categories:

      • Audit Logs: User and system activities.

      • Cluster Logs: Cluster state changes and errors.

      • Notebook Logs: Execution events.

      • Jobs Log'
    severity: medium
- id: 3.1.8
  title: Ensure that data at rest and in transit is encrypted in Azure Databricks using customer managed keys (CMK)
  scoring: scored
  profile:
  - Level 2
  description: Azure Databricks encrypts data in transit using TLS 1.2+ to secure API, workspace, and cluster communications.
    By default, data at rest is encrypted using Microsoft-managed keys.
  rationale: 'Organizations with stricter needs for control of encryption keys should enable customermanaged keys (CMK) for
    greater control over data encryption, auditing, and regulatory compliance. Azure Key Vault should be used to store and
    manage CMKs. Enforcing encryption at rest and in transit in Azure Databricks: • Protects sensitive data from unauthorized
    access. • Ensures regulatory compliance (ISO 27001, GDPR, HIPAA, SOC 2). • Allows key revocation and rotation control
    with customer-managed keys (CMK). • Mitigates insider threats by preventing unauthorized access to raw storage.'
  impact: Enabling CMK encryption requires additional configuration. Key management introduces maintenance overhead (rotation,
    revocation, lifecycle management). Potential access issues will be encountered if keys are deleted or rotated incorrectly.
  references: []
  page_start: 66
  audit_raw: 'Audit from Azure Portal

    1. Go to Azure Portal → Databricks Workspaces.

    2. Select a Databricks Workspace and go to Encryption settings.

    3. Check if customer-managed keys (CMK) are enabled under "Managed Disk

    Encryption".

    4. If CMK is not enabled, the workspace is non-compliant.

    Audit from Azure CLI

    Run the following command to check encryption settings for Databricks workspace:

    az databricks workspace show --name <databricks-workspace-name> --resourcegroup <resource-group-name> --query encryption

    Ensure that keySource is set to Microsoft.KeyVault.

    Audit from PowerShell

    Get-AzDatabricksWorkspace -ResourceGroupName "<resource-group-name>" -Name

    "<databricks-workspace-name>" | Select-Object Encryption

    Verify that encryption is set to Customer-Managed Keys (CMK).

    Audit from Databricks CLI

    databricks workspace get-metadata --workspace-id <workspace-id>

    Ensure that encryption settings reflect a CMK setup.'
  remediation: 'NOTE: These remediations assume that an Azure KeyVault already exists in the

    subscription.

    Remediate from Azure CLI

    1. Create a dedicated key:

    az keyvault key create --vault-name <keyvault-name> --name <key-name> --

    protection <"software" or "hsm">

    2. Assign permissions to Databricks:

    az keyvault set-policy --name <keyvault-name> --resource-group <resourcegroup-name> --spn <databricks-spn> --key-permissions
    get wrapKey unwrapKey

    3. Enable encryption with CMK:

    az databricks workspace update --name <databricks-workspace-name> --resourcegroup <resource-group-name> --key-source "Microsoft.KeyVault"
    --key-name

    <key-name> --keyvault-uri <keyvault-uri>

    Remediate from PowerShell

    $Key = Add-AzKeyVaultKey -VaultName <keyvault-name> -Name <key-name> -

    Destination <"software" or "hsm">

    Set-AzDatabricksWorkspace -ResourceGroupName "<resource-group-name>" -

    WorkspaceName "<databricks-workspace-name>" -EncryptionKeySource

    "Microsoft.KeyVault" -KeyVaultUri $Key.Id'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Azure Portal → Databricks Workspaces.

      2. Select a Databricks Workspace and go to Encryption settings.

      3. Check if customer-managed keys (CMK) are enabled under "Managed Disk

      Encryption".

      4. If CMK is not enabled, the workspace is non-compliant.

      Audit from Azure CLI

      Run the following command to check encryption settings for Databricks workspace:

      az databricks workspace show --name <databricks-workspace-name> --resourcegroup <resource-group-name> --query encryption'
    severity: medium
- id: 4.1.1
  title: Ensure only MFA enabled identities can access privileged Virtual Machine
  scoring: manual
  profile:
  - Level 2
  description: Verify identities without MFA that can log in to a privileged virtual machine using separate login credentials.
    An adversary can leverage the access to move laterally and perform actions with the virtual machine's managed identity.
    Make sure the virtual machine only has necessary permissions, and revoke the admin-level permissions according to the
    principle of least privilege.
  rationale: Integrating multi-factor authentication (MFA) as part of the organizational policy can greatly reduce the risk
    of an identity gaining control of valid credentials that may be used for additional tactics such as initial access, lateral
    movement, and collecting information. MFA can also be used to restrict access to cloud resources and APIs. An Adversary
    may log into accessible cloud services within a compromised environment using Valid Accounts that are synchronized to
    move laterally and perform actions with the virtual machine's managed identity. The adversary may then perform management
    actions or access cloud-hosted resources as the logged-on managed identity.
  impact: This recommendation requires the Entra ID P2 license to implement. Ensure that identities provisioned to a virtual
    machine utilize an RBAC/ABAC group and are allocated a role using Azure PIM, and that the role settings require MFA or
    use another third-party PAM solution for accessing virtual machines.
  references: []
  page_start: 72
  audit_raw: 'Audit from Azure Portal

    1. Log in to the Azure portal.

    2. Select the Subscription, then click on Access control (IAM).

    3. Click Role : All and click All to display the drop-down menu.

    4. Type Virtual Machine Administrator Login and select Virtual Machine

    Administrator Login.

    5. Review the list of identities that have been assigned the Virtual Machine

    Administrator Login role.

    6. Go to Microsoft Entra ID.

    7. For Per-user MFA:

    a) Under Manage, click Users.

    b) Click Per-user MFA.

    c) Ensure that none of the identities assigned the Virtual Machine

    Administrator Login role from step 4 have Status set to disabled.

    8. For Conditional Access:

    a) Under Manage, click Security.

    b) Under Protect, click Conditional Access.

    c) Ensure that none of the identities assigned the Virtual Machine

    Administrator Login role from step 4 are exempt from a Conditional

    Access policy requiring MFA for all users.'
  remediation: 'Remediate from Azure Portal

    1. Log in to the Azure portal.

    2. This can be remediated by enabling MFA for user, Removing user access or

    Reducing access of managed identities attached to virtual machines.

    Case I : Enable MFA for users having access on virtual machines.

    1. Go to Microsoft Entra ID.

    2. For Per-user MFA:

    a) Under Manage, click Users.

    b) Click Per-user MFA.

    c) For each user requiring remediation, check the box next to their

    name.

    d) Click Enable MFA, then Click Enable.

    3. For Conditional Access:

    a) Under Manage, click Security.

    b) Under Protect, click Conditional Access.

    c) Update the Conditional Access policy requiring MFA for all users,

    removing each user requiring remediation from the Exclude list.

    Case II : Removing user access on a virtual machine.

    1. Select the Subscription, then click on Access control (IAM).

    2. Select Role assignments and search for Virtual Machine

    Administrator Login or Virtual Machine User Login or any role

    that provides access to log into virtual machines.

    3. Click on Role Name, Select Assignments, and remove identities with no

    MFA configured.

    Case III : Reducing access of managed identities attached to virtual machines.

    1. Select the Subscription, then click on Access control (IAM).

    2. Select Role Assignments from the top menu and apply filters on

    Assignment type as Privileged administrator roles and Type as

    Virtual Machines.

    3. Click on Role Name, Select Assignments, and remove identities access

    make sure this follows the least privileges principal.'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Log in to the Azure portal.

      2. Select the Subscription, then click on Access control (IAM).

      3. Click Role : All and click All to display the drop-down menu.

      4. Type Virtual Machine Administrator Login and select Virtual Machine

      Administrator Login.

      5. Review the list of identities that have been assigned the Virtual Machine

      Administrator Login role.

      6. Go to Microsoft Entra ID.

      7. For Per-user MFA:

      a) Under Manage, click Users.

      b) Click Per-user MFA.

      c) Ensure that non'
