- id: 6.1.1
  title: Ensure that 'security defaults' is enabled in Microsoft Entra ID
  scoring: manual
  profile:
  - Level 1
  description: '[IMPORTANT - Please read the section overview: If your organization pays for Microsoft Entra ID licensing
    (included in Microsoft 365 E3, E5, F5, or Business Premium, and EM&S E3 or E5 licenses) and CAN use Conditional Access,
    ignore the recommendations in this section and proceed to the Conditional Access section.] Security defaults in Microsoft
    Entra ID make it easier to be secure and help protect your organization. Security defaults contain preconfigured security
    settings for common attacks. Security defaults is available to everyone. The goal is to ensure that all organizations
    have a basic level of security enabled at no extra cost. You may turn on security defaults in the Azure portal.'
  rationale: 'Security defaults provide secure default settings that we manage on behalf of organizations to keep customers
    safe until they are ready to manage their own identity security settings. For example, doing the following: • Requiring
    all users and admins to register for MFA. • Challenging users with MFA - when necessary, based on factors such as location,
    device, role, and task. • Disabling authentication from legacy authentication clients, which can’t do MFA.'
  impact: This recommendation should be implemented initially and then may be overridden by other service/product specific
    CIS Benchmarks. Administrators should also be aware that certain configurations in Microsoft Entra ID may impact other
    Microsoft services such as Microsoft 365.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/fundamentals/conceptfundamentals-security-defaults
  - 2. https://techcommunity.microsoft.com/t5/azure-active-directoryidentity/introducing-security-defaults/ba-p/1061414
