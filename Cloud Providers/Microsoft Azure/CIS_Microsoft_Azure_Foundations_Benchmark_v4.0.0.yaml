    \ name>\n$account = Get-AzStorageAccount -ResourceGroupName $rgName -Name $accountName\nif ($account.KeyCreationTime.Key1\
    \ -eq $null -or $account.KeyCreationTime.Key2\n-eq $null){\n Write-output (\"You must regenerate both keys at least once\
    \ before\nsetting expiration policy\")\n} else {\n $account = Set-AzStorageAccount -ResourceGroupName $rgName -Name\n\
    $accountName -KeyExpirationPeriodInDay 90\n}\n$account.KeyPolicy.KeyExpirationPeriodInDays"
