- id: 7.1.1.7
  title: Ensure that virtual network flow logs are captured and sent to Log Analytics
  scoring: manual
  profile:
  - Level 2
  description: Ensure that virtual network flow logs are captured and fed into a central log analytics workspace. Ensure that
    a Microsoft Entra diagnostic setting is configured to send Microsoft Graph activity logs to a suitable destination, such
    as a Log Analytics workspace, storage account, or event hub. This enables centralized monitoring and analysis of all HTTP
    requests that the Microsoft Graph service receives and processes for a tenant. Ensure that a Microsoft Entra diagnostic
    setting is configured to send Microsoft Entra activity logs to a suitable destination, such as a Log Analytics workspace,
    storage account, or event hub. This enables centralized monitoring and analysis of Microsoft Entra activity logs.
  rationale: Virtual network flow logs provide critical visibility into traffic patterns. Sending logs to a Log Analytics
    workspace enables centralized analysis, correlation, and alerting for faster threat detection and response. Microsoft
    Graph activity logs provide visibility into HTTP requests made to the Microsoft Graph service, helping detect unauthorized
    access, suspicious activity, and security threats. Configuring diagnostic settings in Microsoft Entra ensures these logs
    are collected and sent to an appropriate destination for monitoring, analysis, and retention. Microsoft Entra activity
    logs enables you to assess many aspects of your Microsoft Entra tenant. Configuring diagnostic settings in Microsoft Entra
    ensures these logs are collected and sent to an appropriate destination for monitoring, analysis, and retention.
  impact: '• Virtual network flow logs are charged per gigabyte of network flow logs collected and come with a free tier of
    5 GB/month per subscription. • If traffic analytics is enabled with virtual network flow logs, traffic analytics pricing
    applies at per gigabyte processing rates. • The storage of logs is charged separately. A Microsoft Entra ID P1 or P2 tenant
    license is required to access the Microsoft Graph activity logs. The amount of data logged and, thus, the cost incurred
    can vary significantly depending on the tenant size and the applications in your tenant that interact with the Microsoft
    Graph APIs. See the following pricing calculations for respective services: • Log Analytics: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/costlogs#pricing-model.
    • Azure Storage: https://azure.microsoft.com/en-gb/pricing/details/storage/blobs/. • Event Hubs: https://azure.microsoft.com/en-gb/pricing/details/event-hubs/
    To export sign-in data, your organization needs an Azure AD P1 or P2 license. The amount of data logged and, thus, the
    cost incurred can vary significantly depending on the tenant size. See the following pricing calculations for respective
    services: • Log Analytics: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/costlogs#pricing-model. • Azure
    Storage: https://azure.microsoft.com/en-gb/pricing/details/storage/blobs/. • Event Hubs: https://azure.microsoft.com/en-gb/pricing/details/event-hubs/'
  references:
