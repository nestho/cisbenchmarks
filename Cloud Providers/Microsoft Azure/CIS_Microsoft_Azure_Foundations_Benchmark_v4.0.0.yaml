- id: 6.2.6
  title: Ensure that multifactor authentication is required for Windows Azure Service Management API
  scoring: manual
  profile:
  - Level 2
  description: This recommendation ensures that users accessing the Windows Azure Service Management API (i.e. Azure Powershell,
    Azure CLI, Azure Resource Manager API, etc.) are required to use multi-factor authentication (MFA) credentials when accessing
    resources through the Windows Azure Service Management API.
  rationale: 'Administrative access to the Windows Azure Service Management API should be secured with a higher level of scrutiny
    to authenticating mechanisms. Enabling multifactor authentication is recommended to reduce the potential for abuse of
    Administrative actions, and to prevent intruders or compromised admin credentials from changing administrative settings.
    IMPORTANT: While this recommendation allows exceptions to specific Users or Groups, they should be very carefully tracked
    and reviewed for necessity on a regular interval through an Access Review process. It is important that this rule be built
    to include "All Users" to ensure that all users not specifically excepted will be required to use MFA to access the Azure
    Service Management API.'
  impact: Conditional Access policies require Microsoft Entra ID P1 or P2 licenses. Similarly, they may require additional
    overhead to maintain if users lose access to their MFA. Any users or groups which are granted an exception to this policy
    should be carefully tracked, be granted only minimal necessary privileges, and conditional access exceptions should be
    regularly reviewed or investigated.
  references:
  - 1. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-identitymanagement#im-7-restrict-resource-access-based-on--conditions
  - 2. https://docs.microsoft.com/en-us/azure/active-directory/conditionalaccess/concept-conditional-access-users-groups
