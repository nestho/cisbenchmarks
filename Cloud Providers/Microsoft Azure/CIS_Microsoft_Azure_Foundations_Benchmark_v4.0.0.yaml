    \ ensure that audit and allLogs are checked.\nAudit from Azure CLI\nList all key vaults\naz keyvault list\nFor each keyvault\
    \ id\naz monitor diagnostic-settings list --resource <id>\nEnsure that storageAccountId reflects your desired destination\
    \ and that\ncategoryGroup and enabled are set as follows in the sample outputs below.\n\"logs\": [\n{\n \"categoryGroup\"\
    : \"audit\",\n \"enabled\": true,\n},\n{\n \"categoryGroup\": \"allLogs\",\n \"enabled\": true,\n}\nAudit from PowerShell\n\
