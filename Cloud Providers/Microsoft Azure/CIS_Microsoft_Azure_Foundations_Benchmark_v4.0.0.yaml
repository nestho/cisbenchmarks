- id: 9.3.9
  title: Ensure automatic key rotation is enabled within Azure Key Vault
  scoring: scored
  profile:
  - Level 2
  description: Automated cryptographic key rotation in Key Vault allows users to configure Key Vault to automatically generate
    a new key version at a specified frequency. A key rotation policy can be defined for each individual key.
  rationale: 'Automatic key rotation reduces risk by ensuring that keys are rotated without manual intervention. Azure and
    NIST recommend that keys be rotated every two years or less. Refer to ''Table 1: Suggested cryptoperiods for key types''
    on page 46 of the following document for more information: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-57pt1r5.pdf.'
  impact: There is an additional cost for each scheduled key rotation.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/key-vault/keys/how-to-configure-keyrotation
  - 2. https://docs.microsoft.com/en-us/azure/storage/common/customer-managedkeys-overview#update-the-key-version
  page_start: 405
  audit_raw: 'Audit from Azure Portal

    1. Go to Key Vaults.

    2. Select a Key Vault.

    3. Under Objects, select Keys.

    4. Select a key.

    5. From the top row, select Rotation policy.

    6. Ensure Enable auto rotation is set to Enabled.

    7. Ensure the Rotation time is set to an appropriate value.

    8. Repeat steps 1-7 for each Key Vault and Key.

    Audit from Azure CLI

    Run the following command:

    az keyvault key rotation-policy show --vault-name <vault-name> --name <keyname>

    Ensure that the response contains a lifetimeAction of Rotate and that

    timeAfterCreate is set to an appropriate value.

    Audit from PowerShell

    Run the following command:

    Get-AzKeyVaultKeyRotationPolicy -VaultName <vault-name> -Name <key-name>

    Ensure that the response contains a LifetimeAction of Rotate and that

    TimeAfterCreate is set to an appropriate value.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: d8cf8476-a2ec-4916-896e-992351803c44 - Name: ''Keys should have

    a rotation policy ensuring that their rotation is scheduled within the specified

    number of days after creation.'''
  remediation: "Note: Azure CLI and PowerShell use the ISO8601 duration format for time spans. The\nformat is P<timespanInISO8601Format>(Y,M,D).\
    \ The leading P is required and is\nreferred to as period. The (Y,M,D) are for the duration of Year, Month, and Day,\n\
    respectively. A time frame of 2 years, 2 months, 2 days would be P2Y2M2D. For Azure\nCLI and PowerShell, it is easiest\
    \ to supply the policy flags in a .json file, for\nexample:\n{\n \"lifetimeActions\": [\n {\n \"trigger\": {\n \"timeAfterCreate\"\
    : \"P<timespanInISO8601Format>(Y,M,D)\",\n \"timeBeforeExpiry\" : null\n },\n \"action\": {\n \"type\": \"Rotate\"\n }\n\
    \ },\n {\n \"trigger\": {\n \"timeBeforeExpiry\" : \"P<timespanInISO8601Format>(Y,M,D)\"\n },\n \"action\": {\n \"type\"\
    : \"Notify\"\n }\n }\n ],\n \"attributes\": {\n \"expiryTime\": \"P<timespanInISO8601Format>(Y,M,D)\"\n }\n}\nRemediate\
    \ from Azure Portal\n1. Go to Key Vaults.\n2. Select a Key Vault.\n3. Under Objects, select Keys.\n4. Select a key.\n\
    5. From the top row, select Rotation policy.\n6. Select an appropriate Expiry time.\n7. Set Enable auto rotation to Enabled.\n\
    8. Set an appropriate Rotation option and Rotation time.\n9. Optionally, set a Notification time.\n10. Click Save.\n11.\
    \ Repeat steps 1-10 for each Key Vault and Key.\nRemediate from Azure CLI\nRun the following command for each key to enable\
    \ automatic rotation:\naz keyvault key rotation-policy update --vault-name <vault-name> --name <keyname> --value <path/to/policy.json>\n\
    Remediate from PowerShell\nRun the following command for each key to enable automatic rotation:\nSet-AzKeyVaultKeyRotationPolicy\
    \ -VaultName <vault-name> -Name <key-name> -\nPolicyPath <path/to/policy.json>"
