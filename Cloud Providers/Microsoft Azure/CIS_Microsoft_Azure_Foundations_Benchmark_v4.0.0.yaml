- id: 6.1.2
  title: Ensure that 'multifactor authentication' is 'enabled' for all users
  scoring: manual
  profile:
  - Level 1
  description: '[IMPORTANT - Please read the section overview: If your organization pays for Microsoft Entra ID licensing
    (included in Microsoft 365 E3, E5, F5, or Business Premium, and EM&S E3 or E5 licenses) and CAN use Conditional Access,
    ignore the recommendations in this section and proceed to the Conditional Access section.] Enable multifactor authentication
    for all users. Note: Since 2024, Azure has been rolling out mandatory multifactor authentication. For more information:
    • https://azure.microsoft.com/en-us/blog/announcing-mandatory-multi-factorauthentication-for-azure-sign-in • https://learn.microsoft.com/en-us/entra/identity/authentication/conceptmandatory-multifactor-authentication'
  rationale: Multifactor authentication requires an individual to present a minimum of two separate forms of authentication
    before access is granted. Multifactor authentication provides additional assurance that the individual attempting to gain
    access is who they claim to be. With multifactor authentication, an attacker would need to compromise at least two different
    authentication mechanisms, increasing the difficulty of compromise and thus reducing the risk.
  impact: Users would require two forms of authentication before any access is granted. Additional administrative time will
    be required for managing dual forms of authentication when enabling multifactor authentication.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/multi-factor-authentication/multi-factorauthentication
  - 2. https://learn.microsoft.com/en-us/entra/identity/authentication/conceptmandatory-multifactor-authentication
  page_start: 81
  audit_raw: 'Audit from Azure Portal

    1. Go to Microsoft Entra ID.

