- id: 6.2.4
  title: Ensure that a multifactor authentication policy exists for all users
  scoring: manual
  profile:
  - Level 2
  description: 'A Conditional Access policy can be enabled to ensure that users are required to use Multifactor Authentication
    (MFA) to login. Note: Since 2024, Azure has been rolling out mandatory multifactor authentication. For more information:
    • https://azure.microsoft.com/en-us/blog/announcing-mandatory-multi-factorauthentication-for-azure-sign-in • https://learn.microsoft.com/en-us/entra/identity/authentication/conceptmandatory-multifactor-authentication'
  rationale: Multifactor authentication is strongly recommended to increase the confidence that a claimed identity can be
    proven to be the subject of the identity. This results in a stronger authentication chain and reduced likelihood of exploitation.
  impact: There is an increased cost associated with Conditional Access policies because of the requirement of Microsoft Entra
    ID P1 or P2 licenses. Additional support overhead may also need to be considered.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/conditionalaccess/howto-conditional-access-policy-all-users-mfa
  - 2. https://docs.microsoft.com/en-us/azure/active-directory/conditionalaccess/troubleshoot-conditional-access-what-if
