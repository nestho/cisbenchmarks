    Remediate from PowerShell

    1. Enter the following to update the policy ID:

    Update-MgPolicyAuthorizationPolicy -GuestUserRoleId "2af84b1e-32c8-42b7-82bcdaa82404023b"

    1. Check the GuestUserRoleId again:

    (Get-MgPolicyAuthorizationPolicy).GuestUserRoleId

    1. Ensure that the GuestUserRoleId is equal to the earlier entered value of

    2af84b1e-32c8-42b7-82bc-daa82404023b.

    Remediate from Azure Portal

    1. From Azure Home select the Portal Menu

    2. Select Microsoft Entra ID

    3. Under Manage, select External Identities

    4. Select External collaboration settings

    5. Under Guest invite settings, set Guest invite restrictions, to Only

    users assigned to specific admin roles can invite guest users

    6. Click Save

    Remediate from Powershell

    Enter the following:

    Connect-MgGraph

    Update-MgPolicyAuthorizationPolicy -AllowInvitesFrom "adminsAndGuestInviters"'
