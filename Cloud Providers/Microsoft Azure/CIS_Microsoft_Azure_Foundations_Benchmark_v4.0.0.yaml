  scoring: manual
  profile:
  - Level 1
  description: Ensure that the number of days before users are asked to re-confirm their authentication information is not
    set to 0.
  rationale: This setting is necessary if 'Require users to register when signing in' is enabled. If authentication re-confirmation
    is disabled, registered users will never be prompted to reconfirm their existing authentication information. If the authentication
    information for a user changes, such as a phone number or email, then the password reset information for that user reverts
    to the previously registered authentication information.
  impact: Users will be prompted to re-confirm their authentication information after the number of days specified.
  references:
  - 1. https://learn.microsoft.com/en-us/entra/identity/authentication/concept-ssprhowitworks#registration
  - 2. https://support.microsoft.com/en-us/account-billing/reset-your-work-or-schoolpassword-using-security-info-23dde81f-08bb-4776-ba72-e6b72b9dda9e
