- id: 2.1.1.1.1
  title: Ensure Critical Data is Encrypted with Microsoft Managed Keys (MMK)
  scoring: manual
  profile:
  - Level 1
  description: Microsoft Managed Keys (MMK) (also known as Platform-managed keys (PMK)) provides a very low overhead method
    of encrypting data at rest and implementing encryption key management. Keys maintained in an MMK implementation are automatically
    managed by Azure and require no customer interaction.
  rationale: The encryption of data at rest is a foundational component of data security. Data at rest without encryption
    is easily compromised through loss or theft. Encrypting data at rest introduces confidentiality to the data by obfuscating
    the data contents with a cipher algorithm and provides an authentication requirement through the use of cryptographic
    keys. MMK makes the encryption of data at rest very easy to implement and maintain.
  impact: ''
  references:
  - 1. https://docs.microsoft.com/en-us/azure/security/fundamentals/data-encryptionbest-practices#protect-data-at-rest
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-dataprotection#dp-5-use-customer-managed-key-option-in-data-at-rest-encryptionwhen-required
  page_start: 30
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 2.1.1.2.1
  title: Ensure Critical Data is Encrypted with Customer Managed Keys (CMK)
  scoring: manual
  profile:
  - Level 2
  description: Customer Managed Keys introduce additional depth to security by providing a means to manage access control
    for encryption keys. Where compliance and security frameworks indicate the need, and organizational capacity allows, sensitive
    data at rest can be encrypted using Customer Managed Keys (CMK) rather than Microsoft Managed keys.
  rationale: By default in Azure, data at rest tends to be encrypted using Microsoft Managed Keys. If your organization wants
    to control and manage encryption keys for compliance and defense-in-depth, Customer Managed Keys can be established. While
    it is possible to automate the assessment of this recommendation, the assessment status for this recommendation remains
    'Manual' due to ideally limited scope. The scope of application - which workloads CMK is applied to - should be carefully
    considered to account for organizational capacity and targeted to workloads with specific need for CMK.
  impact: If the key expires due to setting the 'activation date' and 'expiration date', the key must be rotated manually.
    Using Customer Managed Keys may also incur additional man-hour requirements to create, store, manage, and protect the
    keys as needed.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/security/fundamentals/data-encryptionbest-practices#protect-data-at-rest
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-dataprotection#dp-5-use-customer-managed-key-option-in-data-at-rest-encryptionwhen-required
  page_start: 33
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 2.2.1.1
  title: Ensure public network access is Disabled
  scoring: scored
  profile:
  - Level 1
  description: Disable public network access to prevent exposure to the internet and reduce the risk of unauthorized access.
    Use private endpoints to securely manage access within trusted networks.
  rationale: Disabling public network access improves security by ensuring that a service is not exposed on the public internet.
  impact: Disabling public network access restricts access to the service. This enhances security but may require the configuration
    of private endpoints for any services or users needing access within trusted networks.
  references: []
  page_start: 36
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 2.2.1.2
  title: Ensure Network Access Rules are set to Deny-by-default
  scoring: scored
  profile:
  - Level 1
  description: Restricting default network access provides a foundational level of security to networked resources. To limit
    access to selected networks, the default action must be changed.
  rationale: Resources using Virtual Network interfaces should be configured to deny-by-default all access from all networks
    (including internet traffic). Access can be granted to traffic from specific Azure Virtual networks, allowing a secure
    network boundary for specific applications to be built. If necessary, access can also be granted to public internet IP
    address ranges to enable connections from specific internet or on-premises clients. For all traffic inbound from- and
    outbound to- the internet, a NAT Gateway is recommended at minimum, and ideally all traffic flows through a security gateway
    device such as a firewall. Security gateway devices will provide an additional level of visibility to inbound and outbound
    traffic and usually perform advanced monitoring and response activity such as intrusion detection and prevention (IDP),
    and deep packet inspection (DPI) which help detect activity indicating vulnerabilities and threats.
  impact: All allowed networks and protocols will need to be allow-listed which creates some administrative overhead. Implementing
    a deny-by-default rule may result in a loss of network connectivity. Careful planning and a scheduled implementation window
    allowing for downtime is highly recommended.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/storage-networksecurity
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-governancestrategy#gs-2-define-and-implement-enterprise-segmentationseparation-ofduties-strategy
  page_start: 38
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 2.2.2.1
  title: Ensure Private Endpoints are used to access {service}
  scoring: scored
  profile:
  - Level 2
  description: Use private endpoints to allow clients and services to securely access data located over a network via an encrypted
    Private Link. To do this, the private endpoint uses an IP address from the VNet for each service. Network traffic between
    disparate services securely traverses encrypted over the VNet. This VNet can also link addressing space, extending your
    network and accessing resources on it. Similarly, it can be a tunnel through public networks to connect remote infrastructures
    together. This creates further security through segmenting network traffic and preventing outside sources from accessing
    it.
  rationale: Securing traffic between services through encryption protects the data from easy interception and reading.
  impact: If an Azure Virtual Network is not implemented correctly, this may result in the loss of critical network traffic.
    Private endpoints are charged per hour of use. Refer to https://azure.microsoft.com/enus/pricing/details/private-link/
    and https://azure.microsoft.com/en-us/pricing/calculator/ to estimate potential costs.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview
  - 2. https://docs.microsoft.com/en-us/azure/private-link/create-private-endpoint-portal
  page_start: 41
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: '3.1'
  title: Azure Databricks 3.1.1 Ensure that Azure Databricks is deployed in a customermanaged virtual network (VNet)
  scoring: scored
  profile:
  - Level 1
  description: Networking for Azure Databricks can be set up in a few different ways. Using a customer-managed Virtual Network
    (VNet) (also known as VNet Injection) ensures that compute clusters and control planes are securely isolated within the
    organization’s network boundary. By default, Databricks creates a managed VNet, which provides limited control over network
    security policies, firewall configurations, and routing.
  rationale: 'Using a customer-managed VNet ensures better control over network security and aligns with zero-trust architecture
    principles. It allows for: • Restricted outbound internet access to prevent unauthorized data exfiltration. • Integration
    with on-premises networks via VPN or ExpressRoute for hybrid connectivity. • Fine-grained NSG policies to restrict access
    at the subnet level. • Private Link for secure API access, avoiding public internet exposure.'
  impact: • Requires additional configuration during Databricks workspace deployment. • Might increase operational overhead
    for network maintenance. • May impact connectivity if misconfigured (e.g., restrictive NSG rules or missing routes).
  references: []
  page_start: 44
  audit_raw: 'Audit from Azure Portal

    1. Go to Azure Portal → Search for Databricks Workspaces.

    2. Select the Databricks Workspace to audit.

    3. Under Networking, check if the workspace is deployed in a Customer-Managed

    VNet.

    4. If the Virtual Network field shows Databricks-Managed VNet, it is non-compliant.

    5. Verify NSG rules and Private Endpoints for fine-grained access control.

    Audit from Azure CLI

    Run the following command to check if Databricks is using a customer-managed VNet:

    az network vnet show --resource-group <resource-group-name> --name <vnetname>

    Ensure that Databricks subnets are present in the VNet configuration.

    Validate NSG rules attached to the Databricks subnets.

    Audit from PowerShell

    Get-AzDatabricksWorkspace -ResourceGroupName <resource-group-name> -Name

    <databricks-workspace-name> | Select-Object VirtualNetworkId

    If VirtualNetworkId is null or shows a Databricks-Managed VNet, it is non-compliant.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 9c25c9e4-ee12-4882-afd2-11fb9d87893f - Name: ''Azure Databricks

    Workspaces should be in a virtual network'''
  remediation: "Remediate from Azure Portal\n1. Delete the existing Databricks workspace (migration required).\n2. Create\
    \ a new Databricks workspace with VNet Injection:\n3. Go to Azure Portal → Create Databricks Workspace.\n4. Select Advanced\
    \ Networking.\n5. Choose Deploy into your own Virtual Network.\n6. Specify a customer-managed VNet and associated subnets.\n\
    7. Enable Private Link for secure API access.\nRemediate from Azure CLI\nDeploy a new Databricks workspace in a custom\
    \ VNet:\naz databricks workspace create --name <databricks-workspace-name> \\\n --resource-group <resource-group-name>\
    \ \\\n --location <region> \\\n --managed-resource-group <managed-rg-name> \\\n --enable-no-public-ip true \\\n --network-security-group-rule\
    \ \"NoAzureServices\" \\\n --public-network-access Disabled \\\n --custom-virtual-network-id /subscriptions/<subscriptionid>/resourceGroups/<resource-groupname>/providers/Microsoft.Network/virtualNetworks/<vnet-name>\n\
    Ensure NSG Rules are correctly configured:\naz network nsg rule create --resource-group <resource-group-name> \\\n --nsg-name\
    \ <nsg-name> \\\n --name \"DenyAllOutbound\" \\\n --direction Outbound \\\n --access Deny \\\n --priority 4096\nRemediate\
    \ from PowerShell\nNew-AzDatabricksWorkspace -ResourceGroupName <resource-group-name> -Name\n<databricks-workspace-name>\
    \ -Location <region> -ManagedResourceGroupName\n<managed-rg-name> -CustomVirtualNetworkId \"/subscriptions/<subscriptionid>/resourceGroups/<resource-groupname>/providers/Microsoft.Network/virtualNetworks/<vnet-name>\""
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Azure Portal → Search for Databricks Workspaces.

      2. Select the Databricks Workspace to audit.

      3. Under Networking, check if the workspace is deployed in a Customer-Managed

      VNet.

      4. If the Virtual Network field shows Databricks-Managed VNet, it is non-compliant.

      5. Verify NSG rules and Private Endpoints for fine-grained access control.

      Audit from Azure CLI

      Run the following command to check if Databricks is using a customer-managed VNet:

      az network vnet show --res'
    severity: medium
- id: 3.1.2
  title: Ensure that network security groups are configured for Databricks subnets
  scoring: manual
  profile:
  - Level 1
  description: Network Security Groups (NSGs) should be implemented to control inbound and outbound traffic to Azure Databricks
    subnets, ensuring only authorized communication. NSGs should be configured with deny rules to block unwanted traffic and
    restrict communication to essential sources only.
  rationale: ''
  impact: • NSGs require periodic maintenance to ensure rule accuracy. • Misconfigured NSGs could inadvertently block required
    traffic.
  references:
  - 1. https://learn.microsoft.com/en-us/security/benchmark/azure/baselines/azuredatabricks-security-baseline
  - 2. https://learn.microsoft.com/en-us/azure/databricks/security/network/classic/vnetinject#network-security-group-rules
  page_start: 48
  audit_raw: 'Audit from Azure Portal

    1. Navigate to Virtual Networks > Subnets, and review NSG assignments.

    Audit from Azure CLI

    az network nsg list --query "[].{Name:name, Rules:securityRules}"

    Audit from PowerShell

    Get-AzNetworkSecurityGroup -ResourceGroupName <resource-group-name>'
  remediation: 'Remediate from Azure Portal

    1. Assign NSG to Databricks subnets under Networking > NSG Settings.'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Navigate to Virtual Networks > Subnets, and review NSG assignments.

      Audit from Azure CLI

      az network nsg list --query "[].{Name:name, Rules:securityRules}"

      Audit from PowerShell

      Get-AzNetworkSecurityGroup -ResourceGroupName <resource-group-name>'
    severity: medium
- id: 3.1.3
  title: Ensure that traffic is encrypted between cluster worker nodes
  scoring: manual
  profile:
  - Level 2
  description: By default, data exchanged between worker nodes in an Azure Databricks cluster is not encrypted. To ensure
    that data is encrypted at all times, whether at rest or in transit, you can create an initialization script that configures
    your clusters to encrypt traffic between worker nodes using AES 256-bit encryption over a TLS 1.3 connection.
  rationale: • Protects sensitive data during transit between cluster nodes, mitigating risks of data interception or unauthorized
    access. • Aligns with organizational security policies and compliance requirements that mandate encryption of data in
    transit. • Enhances overall security posture by ensuring that all inter-node communications within the cluster are encrypted.
  impact: • Enabling encryption may introduce a performance penalty due to the computational overhead associated with encrypting
    and decrypting traffic. This can result in longer query execution times, especially for data-intensive operations. • Implementing
    encryption requires creating and managing init scripts, which adds complexity to cluster configuration and maintenance.
    • The shared encryption secret is derived from the hash of the keystore stored in DBFS. If the keystore is updated or
    rotated, all running clusters must be restarted to prevent authentication failures between Spark workers and drivers.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/databricks/security/keys/encrypt-otw
  page_start: 50
  audit_raw: 'Audit from Azure Portal

    Review cluster init scripts:

    1. Navigate to your Azure Databricks workspace, go to the "Clusters" section, select

    a cluster, and check the "Advanced Options" for any init scripts that configure

    encryption settings.

    Verify spark configuration:

    2. Ensure that the following Spark configurations are set:

    spark.authenticate true

    spark.authenticate.enableSaslEncryption true

    spark.network.crypto.enabled true

    spark.network.crypto.keyLength 256

    spark.network.crypto.keyFactoryAlgorithm PBKDF2WithHmacSHA1

    spark.io.encryption.enabled true

    These settings can be found in the cluster''s Spark configuration properties.

    Check keystone management:

    3. Verify that the Java KeyStore (JKS) file is securely stored in DBFS and that its

    integrity is maintained.

    4. Ensure that the keystore password is securely managed and not hardcoded in

    scripts.'
  remediation: "Create a JKS keystore:\n1. Generate a Java KeyStore (JKS) file that will be used for SSL/TLS encryption.\n\
    2. Upload the keystore file to a secure directory in DBFS (e.g.\n/dbfs//jetty_ssl_driver_keystore.jks).\nDevelop an init\
    \ script:\n3. Create an init script that performs the following tasks:\no Retrieves the JKS keystore file and password.\n\
    o Derives a shared encryption secret from the keystore.\no Configures Spark driver and executor settings to enable encryption.\n\
    4. Example init script: [next page]\n#!/bin/bash\nset -euo pipefail\nkeystore_dbfs_file=\"/dbfs/<keystoredirectory>/jetty_ssl_driver_keystore.jks\"\
    \nmax_attempts=30\nwhile [ ! -f ${keystore_dbfs_file} ]; do\n if [ \"$max_attempts\" == 0 ]; then\n echo \"ERROR: Unable\
    \ to find the file : $keystore_dbfs_file. Failing\nthe script.\"\n exit 1\n fi\n sleep 2s\n ((max_attempts--))\ndone\n\
    sasl_secret=$(sha256sum $keystore_dbfs_file | cut -d' ' -f1)\nif [ -z \"${sasl_secret}\" ]; then\n echo \"ERROR: Unable\
    \ to derive the secret. Failing the script.\"\n exit 1\nfi\nlocal_keystore_file=\"$DB_HOME/keys/jetty_ssl_driver_keystore.jks\"\
    \nlocal_keystore_password=\"gb1gQqZ9ZIHS\"\nif [[ $DB_IS_DRIVER = \"TRUE\" ]]; then\n driver_conf=${DB_HOME}/driver/conf/spark-branch.conf\n\
    \ echo \"Configuring driver conf at $driver_conf\"\n if [ ! -e $driver_conf ]; then\n echo \"spark.authenticate true\"\
    \ >> $driver_conf\n echo \"spark.authenticate.secret $sasl_secret\" >> $driver_conf\n echo \"spark.authenticate.enableSaslEncryption\
    \ true\" >> $driver_conf\n echo \"spark.network.crypto.enabled true\" >> $driver_conf\n echo \"spark.network.crypto.keyLength\
    \ 256\" >> $driver_conf\n echo \"spark.network.crypto.keyFactoryAlgorithm PBKDF2WithHmacSHA1\"\n>> $driver_conf\n echo\
    \ \"spark.io.encryption.enabled true\" >> $driver_conf\n echo \"spark.ssl.enabled true\" >> $driver_conf\n echo \"spark.ssl.keyPassword\
    \ $local_keystore_password\" >>\n$driver_conf\n echo \"spark.ssl.keyStore $local_keystore_file\" >> $driver_conf\n echo\
    \ \"spark.ssl.keyStorePassword $local_keystore_password\" >>\n$driver_conf\n echo \"spark.ssl.protocol TLSv1.3\" >> $driver_conf\n\
    \ fi\nfi\nexecutor_conf=${DB_HOME}/conf/spark.executor.extraJavaOptions\necho \"Configuring executor conf at $executor_conf\"\
    \nif [ ! -e $executor_conf ]; then\n echo \"-Dspark.authenticate=true\" >> $executor_conf\n echo \"-Dspark.authenticate.secret=$sasl_secret\"\
    \ >> $executor_conf\n echo \"-Dspark.authenticate.enableSaslEncryption=true\" >>\n$executor_conf\n echo \"-Dspark.network.crypto.enabled=true\"\
    \ >> $executor_conf\n echo \"-Dspark.network.crypto.keyLength=256\" >> $executor_conf\n echo \"-Dspark.network.crypto.keyFactoryAlgorithm=PBKDF2WithHmacSHA1\"\
    \n>> $executor_conf\n echo \"-Dspark.io.encryption.enabled=true\" >> $executor_conf\n echo \"-Dspark.ssl.enabled=true\"\
    \ >> $executor_conf\n echo \"-Dspark.ssl.keyPassword=$local_keystore_password\" >>\n$executor_conf\n echo \"-Dspark.ssl.keyStore=$local_keystore_file\"\
    \ >> $executor_conf\n echo \"-Dspark.ssl.keyStorePassword=$local_keystore_password\" >>\n$executor_conf\n echo \"-Dspark.ssl.protocol=TLSv1.3\"\
    \ >> $executor_conf\nfi\n5. Save."
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      Review cluster init scripts:

      1. Navigate to your Azure Databricks workspace, go to the "Clusters" section, select

      a cluster, and check the "Advanced Options" for any init scripts that configure

      encryption settings.

      Verify spark configuration:

      2. Ensure that the following Spark configurations are set:

      spark.authenticate true

      spark.authenticate.enableSaslEncryption true

      spark.network.crypto.enabled true

      spark.network.crypto.keyLength 256

      spark.network.crypto.keyFactoryAlgor'
    severity: medium
- id: 3.1.4
  title: Ensure that users and groups are synced from Microsoft Entra ID to Azure Databricks
  scoring: manual
  profile:
  - Level 1
  description: To ensure centralized identity and access management, users and groups from Microsoft Entra ID should be synchronized
    with Azure Databricks. This is achieved through SCIM provisioning, which automates the creation, update, and deactivation
    of users and groups in Databricks based on Entra ID assignments. Enabling this integration ensures that access controls
    in Databricks remain consistent with corporate identity governance policies, reducing the risk of orphaned accounts, stale
    permissions, and unauthorized access.
  rationale: Syncing users and groups from Microsoft Entra ID centralizes access control, enforces the least privilege principle
    by automatically revoking unnecessary access, reduces administrative overhead by eliminating manual user management, and
    ensures auditability and compliance with industry regulations.
  impact: SCIM provisioning requires role mapping to avoid misconfigured user privileges.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/databricks/administration-guide/usersgroups/scim/aad
  page_start: 54
  audit_raw: 'Audit from Azure Portal

    Verify SCIM provisioning is enabled:

    1. Go to Microsoft Entra ID.

    2. Under Manage, click Enterprise applications.

    3. Click the name of the Azure Databricks SCIM application.

    4. Under Provisioning, confirm that SCIM provisioning is enabled and running.

    Check user sync status in Azure Portal:

    5. Under Provisioning Logs, verify the last successful sync and any failed

    entries.

    Check user sync status in Databricks:

    6. Go to Admin Console > Identity and Access Management.

    7. Confirm that Users and Groups match those assigned in Microsoft Entra ID.

    Ensure role-based access control (RBAC) mapping is correct:

    8. Verify that users are assigned appropriate Databricks roles (e.g. Admin, User,

    Contributor).

    9. Confirm that groups are mapped to workspace access roles.'
  remediation: 'Remediate from Azure Portal

    Enable provisioning in Azure Portal:

    1. Go to Microsoft Entra ID.

    2. Under Manage, click Enterprise applications.

    3. Click the name of the Azure Databricks SCIM application.

    4. Under Provisioning, select Automatic and enter the SCIM endpoint and API

    token from Databricks.

    Enable provisioning in Databricks:

    5. Navigate to Admin Console > Identity and Access Management.

    6. Enable SCIM provisioning and generate an API token.

    Configure role assignments:

    7. Ensure groups from Entra ID are mapped to appropriate Databricks roles.

    8. Restrict administrative privileges to designated security groups.

    Regularly monitor sync logs:

    9. Periodically review sync logs in Microsoft Entra ID and Databricks Admin

    Console.

    10. Configure Azure Monitor alerts for provisioning failures.

    Disable manual user creation in Databricks:

    11. Ensure that all user management is controlled via SCIM sync from Entra ID.

    12. Disable personal access token usage for authentication.

    Remediate from Azure CLI

    Enable SCIM User and Group Provisioning in Azure Databricks:

    az ad app update --id <databricks-app-id> --set

    provisioning.provisioningMode=Automatic'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      Verify SCIM provisioning is enabled:

      1. Go to Microsoft Entra ID.

      2. Under Manage, click Enterprise applications.

      3. Click the name of the Azure Databricks SCIM application.

      4. Under Provisioning, confirm that SCIM provisioning is enabled and running.

      Check user sync status in Azure Portal:

      5. Under Provisioning Logs, verify the last successful sync and any failed

      entries.

      Check user sync status in Databricks:

      6. Go to Admin Console > Identity and Access Management.

      7. Co'
    severity: medium
- id: 3.1.5
  title: Ensure that Unity Catalog is configured for Azure Databricks
  scoring: manual
  profile:
  - Level 1
  description: Unity Catalog is a centralized governance model for managing and securing data in Azure Databricks. It provides
    fine-grained access control to databases, tables, and views using Microsoft Entra ID identities. Unity Catalog also enhances
    data lineage, audit logging, and compliance monitoring, making it a critical component for security and governance.
  rationale: • Enforces centralized access control policies and reduces data security risks. • Enables identity-based authentication
    via Microsoft Entra ID. • Improves compliance with industry regulations (e.g. GDPR, HIPAA, SOC 2) by providing audit logs
    and access visibility. • Prevents unauthorized data access through table-, row-, and column-level security (RLS & CLS).
  impact: • Improperly configured permissions may lead to data exfiltration or unauthorized access. • Unity Catalog requires
    structured governance policies to be effective and prevent overly permissive access.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/databricks/data-governance/unitycatalog/
  - 2. https://learn.microsoft.com/en-us/azure/databricks/admin/users-groups/
  page_start: 57
  audit_raw: 'Method 1: Verify unity catalog deployment:

    1. As an Azure Databricks account admin, log into the account console.

    2. Click Workspaces.

    3. Find your workspace and check the Metastore column. If a metastore name is

    present, your workspace is attached to a Unity Catalog metastore and therefore

    enabled for Unity Catalog.

    Method 2: Run a SQL query to confirm Unity Catalog enablement

    Run the following SQL query in the SQL query editor or a notebook that is attached to a

    Unity Catalog-enabled compute resource. No admin role is required.

    SELECT CURRENT_METASTORE();

    If the query returns a metastore ID like the following, then your workspace is attached to

    a Unity Catalog metastore and therefore enabled for Unity Catalog.'
  remediation: 'Use the remediation procedure written in this article: https://learn.microsoft.com/enus/azure/databricks/data-governance/unity-catalog/get-started.'
  checks:
  - type: manual_review
    info: 'Method 1: Verify unity catalog deployment:

      1. As an Azure Databricks account admin, log into the account console.

      2. Click Workspaces.

      3. Find your workspace and check the Metastore column. If a metastore name is

      present, your workspace is attached to a Unity Catalog metastore and therefore

      enabled for Unity Catalog.

      Method 2: Run a SQL query to confirm Unity Catalog enablement

      Run the following SQL query in the SQL query editor or a notebook that is attached to a

      Unity Catalog-enabled compute r'
    severity: medium
- id: 3.1.6
  title: Ensure that usage is restricted and expiry is enforced for Databricks personal access tokens
  scoring: manual
  profile:
  - Level 1
  description: 'Databricks personal access tokens (PATs) provide API-based authentication for users and applications. By default,
    users can generate API tokens without expiration, leading to potential security risks if tokens are leaked, improperly
    stored, or not rotated regularly. To mitigate these risks, administrators should: • Restrict token creation to approved
    users and service principals. • Enforce expiration policies to prevent long-lived tokens. • Monitor token usage and revoke
    unused or compromised tokens.'
  rationale: Restricting usage and enforcing expiry for personal access tokens reduces exposure to long-lived tokens, minimizes
    the risk of API abuse if compromised, and aligns with security best practices through controlled issuance and enforced
    expiry.
  impact: If revoked improperly, applications relying on these tokens may fail, requiring a remediation plan for token rotation.
    Increased administrative effort is required to track and manage API tokens effectively.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/databricks/administration-guide/accesscontrol/tokens
  - 2. https://learn.microsoft.com/en-us/azure/databricks/dev-tools/auth/
  page_start: 59
  audit_raw: 'Azure Databricks administrators can monitor and revoke personal access tokens within

    their workspace. Detailed instructions are available in the "Monitor and Revoke

    Personal Access Tokens" section of the Microsoft documentation:

    https://learn.microsoft.com/en-us/azure/databricks/admin/access-control/tokens.

    To evaluate the usage of personal access tokens in your Azure Databricks account, you

    can utilize the provided notebook that lists all PATs not rotated or updated in the last 90

    days, allowing you to identify tokens that may require revocation. This process is

    detailed here: https://docs.azure.cn/en-us/databricks/security/auth/oauth-pat-usage.

    Implementing diagnostic logging provides a comprehensive reference of audit log

    services and events, enabling you to track activities related to personal access tokens.

    More information can be found in the diagnostic log reference section:

    https://docs.azure.cn/en-us/databricks/security/auth/oauth-pat-usage.'
  remediation: 'Remediate from Azure Portal

    Disable personal access tokens:

    If your workspace does not require PATs, you can disable them entirely to prevent their

    use.

    1. Navigate to your Azure Databricks workspace.

    2. Click the Settings icon and select Admin Console.

    3. Go to the Advanced tab.

    4. Under Personal Access Tokens, toggle the setting to Disabled.

    Databricks CLI:

    databricks workspace-conf set-status --json ''{"enableTokens": "false"}''

    Control who can create and use personal access tokens:

    Define which users or groups are authorized to create and utilize PATs.

    1. Navigate to your Azure Databricks workspace.

    2. Click the Settings icon and select Admin Console.

    3. Go to the Advanced tab.

    4. Click on Personal Access Tokens and then Permissions.

    5. Assign the appropriate permissions (e.g. No Permissions, Can Use, Can

    Manage) to users or groups.

    Set maximum lifetime for new personal access tokens:

    Limit the validity period of new tokens to reduce potential misuse.

    Databricks CLI:

    databricks workspace-conf set-status --json ''{"maxTokenLifetimeDays": "90"}''

    Monitor and revoke personal access tokens:

    Periodically review active tokens and revoke any that are unnecessary or potentially

    compromised.

    Databricks CLI:

    databricks token list

    databricks token delete --token-id <token-id>

    Transition to OAuth for enhanced security:

    Utilize OAuth tokens for authentication, offering improved security features over PATs.'
