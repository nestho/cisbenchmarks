- id: 6.3.4
  title: Ensure that all 'privileged' role assignments are periodically reviewed
  scoring: manual
  profile:
  - Level 1
  description: Periodic review of privileged role assignments is performed to ensure that the privileged roles assigned to
    users are accurate and appropriate.
  rationale: 'Privileged roles are crown jewel assets that can be used by malicious insiders, threat actors, and even through
    mistake to significantly damage an organization in numerous ways. These roles should be periodically reviewed to: • identify
    lingering permissions assignment (e.g. an administrator has been terminated, the administrator account is being retained,
    but the permissions are no longer necessary and has not been properly addressed by process) • detect lateral movement
    through privilege escalation (e.g. an account with administrative permission has been compromised and is elevating other
    accounts in an attempt to circumvent detection mechanisms)'
  impact: Increased administrative effort to manage and remove role assignments appropriately.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
