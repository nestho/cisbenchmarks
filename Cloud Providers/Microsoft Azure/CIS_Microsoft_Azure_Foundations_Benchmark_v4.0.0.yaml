- id: 10.2.2
  title: Ensure 'Versioning' is set to 'Enabled' on Azure Blob Storage storage accounts
  scoring: scored
  profile:
  - Level 2
  description: Enabling blob versioning allows for the automatic retention of previous versions of objects. With blob versioning
    enabled, earlier versions of a blob are accessible for data recovery in the event of modifications or deletions.
  rationale: Blob versioning safeguards data integrity and enables recovery by retaining previous versions of stored objects,
    facilitating quick restoration from accidental deletion, modification, or malicious activity.
  impact: Enabling blob versioning for a storage account creates a new version with each write operation to a blob, which
    can increase storage costs. To control these costs, a lifecycle management policy can be applied to automatically delete
    older versions.
  references:
  - 1. https://learn.microsoft.com/en-us/cli/azure/storage/account
  - 2. https://learn.microsoft.com/en-us/cli/azure/storage/account/blob-serviceproperties
  page_start: 432
  audit_raw: 'Audit from Azure Portal

