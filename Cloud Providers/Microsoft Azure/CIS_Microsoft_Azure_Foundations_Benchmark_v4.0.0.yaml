- id: 10.3.4
  title: Ensure that 'Secure transfer required' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: 'Enable data encryption in transit. NOTE: This recommendation assumes that the Public network access parameter
    is set to Enabled from selected virtual networks and IP addresses. Please ensure the prerequisite recommendation has been
    implemented before proceeding: • Ensure Default Network Access Rule for Storage Accounts is Set to Deny Some Azure services
    that interact with storage accounts operate from networks that can''t be granted access through network rules. To help
    this type of service work as intended, allow the set of trusted Azure services to bypass the network rules. These services
    will then use strong authentication to access the storage account. If the Allow Azure services on the trusted services
    list to access this storage account exception is enabled, the following services are granted access to the storage account:
    Azure Backup, Azure Data Box, Azure DevTest Labs, Azure Event Grid, Azure Event Hubs, Azure File Sync, Azure HDInsight,
    Azure Import/Export, Azure Monitor, Azure Networking Services, and Azure Site Recovery (when registered in the subscription).'
  rationale: The secure transfer option enhances the security of a storage account by only allowing requests to the storage
    account by a secure connection. For example, when calling REST APIs to access storage accounts, the connection must use
    HTTPS. Any requests using HTTP will be rejected when 'secure transfer required' is enabled. When using the Azure files
    service, connection without encryption will fail, including scenarios using SMB 2.1, SMB 3.0 without encryption, and some
    flavors of the Linux SMB client. Because Azure storage doesn’t support HTTPS for custom domain names, this option is not
    applied when using a custom domain name. Turning on firewall rules for a storage account will block access to incoming
    requests for data, including from other Azure services. We can re-enable this functionality by allowing access to trusted
    Azure services through networking exceptions.
  impact: This creates authentication credentials for services that need access to storage resources so that services will
    no longer need to communicate via network request. There may be a temporary loss of communication as you set each Storage
    Account. It is recommended to not do this on mission-critical resources during business hours.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/blobs/securityrecommendations#encryption-in-transit
  - 2. https://docs.microsoft.com/en-us/cli/azure/storage/account?view=azure-clilatest#az_storage_account_list
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/storage-networksecurity
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-networksecurity#ns-2-secure-cloud-native-services-with-network-controls
  page_start: 464
