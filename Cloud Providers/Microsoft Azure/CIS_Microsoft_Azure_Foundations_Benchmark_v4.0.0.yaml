    Kubernetes clusters, nodes, workloads, container registries, and images—across multi-cloud and on-premises environments.
    By default, when enabling the plan through the Azure Portal, Microsoft Defender for Containers automatically configures
    the following components: • Agentless scanning for machines • Defender sensor for runtime protection • Azure Policy for
    enforcing security best practices • K8S API access for monitoring and threat detection • Registry access for vulnerability
    assessment Note: Microsoft Defender for Container Registries (''ContainerRegistry'') is deprecated and has been replaced
    by Microsoft Defender for Containers (''Containers'').'
  rationale: Enabling Microsoft Defender for Containers enhances defense-in-depth by providing advanced threat detection,
    vulnerability assessment, and security monitoring for containerized environments, leveraging insights from the Microsoft
    Security Response Center (MSRC).
  impact: Microsoft Defender for Containers incurs a charge per vCore. Refer to https://azure.microsoft.com/en-us/pricing/details/defender-for-cloud/
    and https://azure.microsoft.com/en-us/pricing/calculator/ to estimate potential costs.
  references:
  - 1. https://learn.microsoft.com/en-us/cli/azure/security/pricing
  - 2. https://learn.microsoft.com/en-us/powershell/module/az.security/getazsecuritypricing
  page_start: 319
  audit_raw: 'Audit from Azure Portal

    1. Go to Microsoft Defender for Cloud.

    2. Under Management, click Environment settings.

    3. Click the name of a subscription.

    4. Under Settings, click Defender plans.

    5. Under Cloud Workload Protection (CWP), in the row for Containers, ensure

    that the Status is set to On and Monitoring coverage displays Full.

    6. Repeat steps 1-5 for each subscription.

    Audit from Azure CLI

    For Microsoft Defender for Container Registries (deprecated), run the following

    command:

    az security pricing show --name "ContainerRegistry" --query pricingTier

    Ensure that the command returns Standard.

    For Microsoft Defender for Containers, run the following command:

    az security pricing show --name "Containers" --query

    [pricingTier,extensions[*].[name,isEnabled]]

    Ensure that the command returns Standard, and that each of the extensions

    (ContainerRegistriesVulnerabilityAssessments, AgentlessDiscoveryForKubernetes,

    AgentlessVmScanning, ContainerSensor) returns True.

    Repeat for each subscription.

    Audit from PowerShell

    For Microsoft Defender for Container Registries (deprecated), run the following

    command:

    Get-AzSecurityPricing -Name ''ContainerRegistry'' | Select-Object

    Name,PricingTier

    Ensure the command returns PricingTier Standard.

    For Microsoft Defender for Containers, run the following command:

    Get-AzSecurityPricing -Name ''Containers''

    Ensure that PricingTier is set to Standard, and that each of the extensions

    (ContainerRegistriesVulnerabilityAssessments, AgentlessDiscoveryForKubernetes,

    AgentlessVmScanning, ContainerSensor) has isEnabled set to True.

    Repeat for each subscription.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 1c988dd6-ade4-430f-a608-2a3e5b0a6d38 - Name: ''Microsoft

    Defender for Containers should be enabled'''
  remediation: 'Remediate from Azure Portal

    1. Go to Microsoft Defender for Cloud.

    2. Under Management, click Environment settings.

    3. Click the name of a subscription.

    4. Under Settings, click Defender plans.

    5. Under Cloud Workload Protection (CWP), in the row for Containers, click

    On in the Status column.

    6. If Monitoring coverage displays Partial, click Settings under Partial.

    7. Set the status of each of the components to On.

    8. Click Continue.

    9. Click Save.

    10. Repeat steps 1-9 for each subscription.

    Remediate from Azure CLI

    Note: Microsoft Defender for Container Registries (''ContainerRegistry'') is deprecated

    and has been replaced by Microsoft Defender for Containers (''Containers'').

    Run the below command to enable the Microsoft Defender for Containers plan and its

    components:

    az security pricing create -n ''Containers'' --tier ''standard'' --extensions

    name=ContainerRegistriesVulnerabilityAssessments isEnabled=True --extensions

    name=AgentlessDiscoveryForKubernetes isEnabled=True --extensions

    name=AgentlessVmScanning isEnabled=True --extensions name=ContainerSensor

    isEnabled=True

    Remediate from PowerShell

    Note: Microsoft Defender for Container Registries (''ContainerRegistry'') is deprecated

    and has been replaced by Microsoft Defender for Containers (''Containers'').

    Run the below command to enable the Microsoft Defender for Containers plan and its

    components:

    Set-AzSecurityPricing -Name ''Containers'' -PricingTier ''Standard'' -Extension

    ''[{"name":"ContainerRegistriesVulnerabilityAssessments","isEnabled":"True"},{

    "name":"AgentlessDiscoveryForKubernetes","isEnabled":"True"},{"name":"Agentle

    ssVmScanning","isEnabled":"True"},{"name":"ContainerSensor","isEnabled":"True

    "}]'''
