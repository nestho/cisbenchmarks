- id: 10.3.1.2
  title: Ensure that Storage Account access keys are periodically regenerated
  scoring: manual
  profile:
  - Level 1
  description: For increased security, regenerate storage account access keys periodically.
  rationale: When a storage account is created, Azure generates two 512-bit storage access keys which are used for authentication
    when the storage account is accessed. Rotating these keys periodically ensures that any inadvertent access or exposure
    does not result from the compromise of these keys. Cryptographic key rotation periods will vary depending on your organization's
    security requirements and the type of data which is being stored in the Storage Account. For example, PCI DSS mandates
    that cryptographic keys be replaced or rotated 'regularly,' and advises that keys for static data stores be rotated every
    'few months.' For the purposes of this recommendation, 90 days will be prescribed for the reminder. Review and adjustment
    of the 90 day period is recommended, and may even be necessary. Your organization's security requirements should dictate
    the appropriate setting.
  impact: Regenerating access keys can affect services in Azure as well as the organization's applications that are dependent
    on the storage account. All clients who use the access key to access the storage account must be updated to use the new
    key.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/storage-create-storageaccount#regenerate-storage-access-keys
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-privilegedaccess#pa-1-separate-and-limit-highly-privilegedadministrative-users
  page_start: 442
