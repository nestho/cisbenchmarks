- id: 9.3.10
  title: Ensure that Azure Key Vault Managed HSM is used when required
  scoring: manual
  profile:
  - Level 2
  description: 'Azure Key Vault Managed HSM is a fully managed, highly available, single-tenant cloud service that safeguards
    cryptographic keys using FIPS 140-2 Level 3 validated HSMs. Note: This recommendation to use Managed HSM applies only
    to scenarios where specific regulatory and compliance requirements mandate the use of a dedicated hardware security module.'
  rationale: Managed HSM is a fully managed, highly available, single-tenant service that ensures FIPS 140-2 Level 3 compliance.
    It provides centralized key management, isolated access control, and private endpoints for secure access. Integrated with
    Azure services, it supports migration from Key Vault, ensures data residency, and offers monitoring and auditing for enhanced
    security.
  impact: Managed HSM incurs a cost of $0.40 to $5 per month for each actively used HSMprotected key, depending on the key
    type and quantity. Each key version is billed separately. Additionally, there is an hourly usage fee of $3.20 per Managed
    HSM pool.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/security/fundamentals/key-managementchoose
  - 2. https://learn.microsoft.com/en-us/azure/key-vault/managed-hsm/overview
  page_start: 409
  audit_raw: 'Audit from Azure CLI

    Run the following command to list key vaults:

    az keyvault list --query [*].[name,type]

    Ensure that at least one key vault with type Microsoft.KeyVault/managedHSMs exists.'
  remediation: 'Remediate from Azure CLI

    Run the following command to set oid to be the OID of the signed-in user:

    $oid = az ad signed-in-user show --query id -o tsv

    Alternatively, prepare a space-separated list of OIDs to be provided as the

    administrators of the HSM.

    Run the following command to create a Managed HSM:

    az keyvault create --resource-group <resource-group> --hsm-name <hsm-name> --

    retention-days <retention-days> --administrators $oid

    The command can take several minutes to complete.

    After the HSM has been created, it must be activated before it can be used. Activation

    requires providing a minimum of three and a maximum of ten RSA key pairs, as well as

    the minimum number of keys required to decrypt the security domain (called a quorum).

    OpenSSL can be used to generate the self-signed certificates, for example:

    openssl req -newkey rsa:2048 -nodes -keyout cert_1.key -x509 -days 365 -out

    cert_1.cer

    Run the following command to download the security domain and activate the Managed

    HSM:

    az keyvault security-domain download --hsm-name <managed-hsm> --sd-wrappingkeys <key-1> <key-2> <key-3> --sd-quorum <quorum>
    --security-domain-file

    <managed-hsm-security-domain>.json

    Store the security domain file and the RSA key pairs securely. They will be required for

    disaster recovery or for creating another Managed HSM that shares the same security

    domain so that the two can share keys.

    The Managed HSM will now be in an active state and ready for use.'
  checks:
  - type: manual_review
    info: 'Audit from Azure CLI

      Run the following command to list key vaults:

      az keyvault list --query [*].[name,type]

      Ensure that at least one key vault with type Microsoft.KeyVault/managedHSMs exists.'
    severity: medium
- id: '9.4'
  title: Azure Bastion 9.4.1 Ensure an Azure Bastion Host Exists
  scoring: scored
  profile:
  - Level 2
  description: The Azure Bastion service allows secure remote access to Azure Virtual Machines over the Internet without exposing
    remote access protocol ports and services directly to the Internet. The Azure Bastion service provides this access using
    TLS over 443/TCP, and subscribes to hardened configurations within an organization's Azure Active Directory service.
  rationale: The Azure Bastion service allows organizations a more secure means of accessing Azure Virtual Machines over the
    Internet without assigning public IP addresses to those Virtual Machines. The Azure Bastion service provides Remote Desktop
    Protocol (RDP) and Secure Shell (SSH) access to Virtual Machines using TLS within a web browser, thus preventing organizations
    from opening up 3389/TCP and 22/TCP to the Internet on Azure Virtual Machines. Additional benefits of the Bastion service
    includes Multi-Factor Authentication, Conditional Access Policies, and any other hardening measures configured within
    Azure Active Directory using a central point of access.
  impact: The Azure Bastion service incurs additional costs and requires a specific virtual network configuration. The Standard
    tier offers additional configuration options compared to the Basic tier and may incur additional costs for those added
    features.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/bastion/bastion-overview#sku
  - 2. https://learn.microsoft.com/en-us/powershell/module/az.network/getazbastion?view=azps-9.2.0
