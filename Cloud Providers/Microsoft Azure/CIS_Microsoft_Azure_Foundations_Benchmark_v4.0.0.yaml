    6. Click Enable.

    7. Repeat steps 1-6 for each user requiring remediation.

    Other options within Azure Portal

    • https://docs.microsoft.com/en-us/azure/active-directory/authentication/tutorialenable-azure-mfa

    • https://docs.microsoft.com/en-us/azure/active-directory/authentication/howtomfa-mfasettings

    • https://docs.microsoft.com/en-us/azure/active-directory/conditionalaccess/howto-conditional-access-policy-admin-mfa

    • https://docs.microsoft.com/en-us/azure/active-directory/authentication/howtomfa-getstarted#enable-multi-factor-authentication-with-conditional-access'
