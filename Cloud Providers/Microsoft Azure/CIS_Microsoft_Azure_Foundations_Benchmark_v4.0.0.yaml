- id: '6.14'
  title: Ensure that 'Users can register applications' is set to 'No'
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: 'Require administrators or appropriately delegated users to register third-party applications. Limit guest
    user permissions. authorization related settings across the company. DisplayName : Authorization Policy EnabledPreviewFeatures
    : {} GuestUserRoleId : 10dae51f-b6af-4016-8d668c2a99b929b3 PermissionGrantPolicyIdsAssignedToDefaultUserRole : {user-default-legacy}
    If the GuestUserRoleID property does not equal 2af84b1e-32c8-42b7-82bcdaa82404023b then it is not set to most restrictive.
    Restrict invitations to users with specific administrative roles only.'
  rationale: 'It is recommended to only allow an administrator to register custom-developed applications. This ensures that
    the application undergoes a formal security review and approval process prior to exposing Microsoft Entra ID data. Certain
    users like developers or other high-request users may also be delegated permissions to prevent them from waiting on an
    administrative user. Your organization should review your policies and decide your needs. Limiting guest access ensures
    that guest accounts do not have permission for certain directory tasks, such as enumerating users, groups or other directory
    resources, and cannot be assigned to administrative roles in your directory. Guest access has three levels of restriction.
    1. Guest users have the same access as members (most inclusive), 2. Guest users have limited access to properties and
    memberships of directory objects (default value), 3. Guest user access is restricted to properties and memberships of
    their own directory objects (most restrictive). The recommended option is the 3rd, most restrictive: "Guest user access
    is restricted to their own directory object". Restricting invitations to users with specific administrator roles ensures
    that only authorized accounts have access to cloud resources. This helps to maintain "Need to Know" permissions and prevents
    inadvertent access to data. By default the setting Guest invite restrictions is set to Anyone in the organization can
    invite guest users including guests and non-admins. This would allow anyone within the organization to invite guests and
    non-admins to the tenant, posing a security risk.'
  impact: Enforcing this setting will create additional requests for approval that will need to be addressed by an administrator.
    If permissions are delegated, a user may approve a malevolent third party application, potentially giving it access to
    your data. This may create additional requests for permissions to access resources that administrators will need to approve.
    According to https://learn.microsoft.com/en-us/azure/active-directory/enterpriseusers/users-restrict-guest-permissions#services-currently-not-supported
    Service without current support might have compatibility issues with the new guest restriction setting. • Forms • Project
    • Yammer • Planner in SharePoint With the option of Only users assigned to specific admin roles can invite guest users
    selected, users with specific admin roles will be in charge of sending invitations to the external users, requiring additional
    overhead by them to manage user accounts. This will mean coordinating with other departments as they are onboarding new
    users.
  references:
  - 1. https://learn.microsoft.com/en-us/entra/identity/role-based-accesscontrol/delegate-app-roles#restrict-who-can-create-applications
  - 2. https://learn.microsoft.com/en-us/entra/identity-platform/how-applications-areadded#who-has-permission-to-add-applications-to-my-azure-ad-instance
  - 1. https://learn.microsoft.com/en-us/entra/fundamentals/users-defaultpermissions#member-and-guest-users
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-privilegedaccess#pa-3-manage-lifecycle-of-identities-and-entitlements
  - 1. https://learn.microsoft.com/en-us/entra/external-id/external-collaboration-settingsconfigure
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-governancestrategy#gs-6-define-and-implement-identity-and-privileged-access-strategy
  page_start: 145
  audit_raw: 'Audit from Azure Portal

    1. From Azure Home select the Portal Menu

    2. Select Microsoft Entra ID

    3. Under Manage, select Users

    4. Under Manage, select User settings

    5. Ensure that Users can register applications is set to No

    Audit from PowerShell

    (Get-MgPolicyAuthorizationPolicy).DefaultUserRolePermissions | Format-List

    AllowedToCreateApps

    Command should return the value of False

    Audit from Azure Portal

    1. From Azure Home select the Portal Menu

    2. Select Microsoft Entra ID

    3. Under Manage, select External Identities

    4. Select External collaboration settings

    5. Under Guest user access, ensure that Guest user access restrictions is

    set to Guest user access is restricted to properties and

    memberships of their own directory objects

    Audit from PowerShell

    1. Enter the following:

    Connect-MgGraph

    (Get-MgPolicyAuthorizationPolicy).GuestUserRoleId

    Which will give a result like:

    Id : authorizationPolicy

    OdataType :

    Audit from Azure Portal

    1. From Azure Home select the Portal Menu

    2. Select Microsoft Entra ID

    3. Under Manage, select External Identities

    4. Select External collaboration settings

    5. Under Guest invite settings, for Guest invite restrictions, ensure that

    Only users assigned to specific admin roles can invite guest

    users is selected

    Note: This setting has 4 levels of restriction, which include:

    • Anyone in the organization can invite guest users including guests and nonadmins (most inclusive),

    • Member users and users assigned to specific admin roles can invite guest users

    including guests with member permissions,

    • Only users assigned to specific admin roles can invite guest users,

    • No one in the organization can invite guest users including admins (most

    restrictive).

    Audit from Powershell

    Enter the following:

    Connect-MgGraph

    (Get-MgPolicyAuthorizationPolicy).AllowInvitesFrom

    If the resulting value is adminsAndGuestInviters the configuration complies.'
  remediation: 'Remediate from Azure Portal

