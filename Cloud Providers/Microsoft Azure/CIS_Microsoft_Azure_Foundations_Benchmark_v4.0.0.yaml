- id: 6.2.3
  title: Ensure that an exclusionary device code flow policy is considered
  scoring: manual
  profile:
  - Level 2
  description: Conditional Access Policies can be used to prevent the Device code authentication flow. Device code flow should
    be permitted only for users that regularly perform duties that explicitly require the use of Device Code to authenticate,
    such as utilizing Azure with PowerShell.
  rationale: Attackers use Device code flow in phishing attacks and, if successful, results in the attacker gaining access
    tokens and refresh tokens which are scoped to "user_impersonation", which can perform any action the user has permission
    to perform.
  impact: Microsoft Entra ID P1 or P2 is required. This policy should be tested using the Report-only mode before implementation.
    Without a full and careful understanding of the accounts and personnel who require Device code authentication flow, implementing
    this policy can block authentication for users and devices who rely on Device code flow. For users and devices that rely
    on device code flow authentication, more secure alternatives should be implemented wherever possible.
  references:
  - 1. https://learn.microsoft.com/en-us/entra/identity/conditional-access/conceptauthentication-flows#device-code-flow
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-identitymanagement#im-7-restrict-resource-access-based-on--conditions
