- id: '6.8'
  title: Ensure that a 'Custom banned password list' is set to 'Enforce'
  scoring: manual
  profile:
  - Level 1
  description: Microsoft Azure applies a default global banned password list to all user and admin accounts that are created
    and managed directly in Microsoft Entra ID. The Microsoft Entra password policy does not apply to user accounts that are
    synchronized from an on-premises Active Directory environment, unless Microsoft Entra ID Connect is used and EnforceCloudPasswordPolicyForPasswordSyncedUsers
    is enabled. Review the Default Value section for more detail on the password policy. For increased password security,
    a custom banned password list is recommended
  rationale: Implementing a custom banned password list gives your organization further control over the password policy.
    Disallowing easy-to-guess passwords increases the security of your Azure resources.
  impact: Increasing password complexity may increase user account administration overhead. Utilizing the default global banned
    password list and a custom list requires a Microsoft Entra ID P1 or P2 license. On-premises Active Directory Domain Services
    users who aren't synchronized to Microsoft Entra ID still benefit from Microsoft Entra ID Password Protection based on
    the existing licensing of synchronized users.
  references:
  - 1. https://learn.microsoft.com/en-us/entra/identity/authentication/concept-passwordban-bad-combined-policy
  - 2. https://learn.microsoft.com/en-us/entra/identity/authentication/concept-passwordban-bad
