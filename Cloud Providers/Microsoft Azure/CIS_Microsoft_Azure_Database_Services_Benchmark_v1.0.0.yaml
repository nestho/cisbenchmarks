controls:
- id: '2.1'
  title: Ensure 'Microsoft Entra Authentication' is 'Enabled'
  scoring: manual
  profile:
  - Level 1
  description: Ensuring that Microsoft Entra Authentication is ‘Enabled’ provides a natively integrated use of identities
    already defined with Microsoft Entra ID.
  rationale: The use of a centralized Identity and Access Management (IAM) solution such as Microsoft Entra ID is highly recommended
    for all activity related to Identity, Authentication, Authorization, and Accountability. Decentralized IAM – such as local
    authentication methods – may present additional vulnerability and introduce avoidable administrative complexity.
  impact: Free tiers exist for the licensing of Microsoft Entra ID if required.
  references:
  - 1. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-identitymanagement
  - 2. https://learn.microsoft.com/en-us/azure/azure-cache-for-redis/cache-azureactive-directory-for-authentication
  page_start: 19
  audit_raw: 'From Azure Portal

    1. Search for and open the Azure Cache for Redis service

    2. For each instance, repeat the remaining steps

    3. Click on the name of the instance

    4. In the blade menu on the left, click on Authentication

    5. Review the checkbox next to Enable Microsoft Entra Authentication

    If the checkbox is Checked, the configuration for that instance is compliant.'
  remediation: 'From Azure Portal

    1. Search for and open the Azure Cache for Redis service

    2. For each instance, repeat the remaining steps

    3. Click on the name of the instance

    4. In the blade menu on the left, click on Authentication

    5. Check the checkbox next to Enable Microsoft Entra Authentication'
  checks:
  - type: manual_review
    info: 'From Azure Portal

      1. Search for and open the Azure Cache for Redis service

      2. For each instance, repeat the remaining steps

      3. Click on the name of the instance

      4. In the blade menu on the left, click on Authentication

      5. Review the checkbox next to Enable Microsoft Entra Authentication

      If the checkbox is Checked, the configuration for that instance is compliant.'
    severity: medium
- id: '2.2'
  title: Ensure that 'Allow access only via SSL' is set to 'Yes'
  scoring: scored
  profile:
  - Level 1
  description: Setting ‘Allow access only via SSL’ to ‘Yes’ ensures that data in transit to and from Azure Cache for Redis
    is encrypted using TLS.
  rationale: Data in transit which is not encrypted is vulnerable to attacks including adversary-in-themiddle (AITM or MITM),
    eavesdropping, or session hijack. These attacks can result in the compromise and exfiltration of data.
  impact: No additional cost is required to implement this recommendation. Aside from expected network changes (no unencrypted
    communications), performance should not be impacted.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/azure-cache-for-redis/cache-bestpractices-development
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/baselines/azurecache-for-redis-security-baseline#microsoft-defender-for-cloud-monitoring-1
  page_start: 21
  audit_raw: 'From Azure Portal

    1. Search for and open the Azure Cache for Redis service

    2. For each instance, repeat the remaining steps

    3. Click on the name of the instance

    4. In the blade menu on the left, under Settings, click on Advanced Settings

    5. Review the setting under Allow access only via SSL

    If Yes is selected, the configuration for that instance is compliant.

    From Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 22bee202-a82f-4305-9a2a-6d7f44d4dedb - Name: ''Only secure

    connections to your Azure Cache for Redis should be enabled'''
  remediation: 'From Azure Portal

    1. Search for and open the Azure Cache for Redis service

    2. For each instance, repeat the remaining steps

    3. Click on the name of the instance

    4. In the blade menu on the left, under Settings, click on Advanced Settings

    5. Select Yes under the Allow access only via SSL heading'
  checks:
  - type: manual_review
    info: 'From Azure Portal

      1. Search for and open the Azure Cache for Redis service

      2. For each instance, repeat the remaining steps

      3. Click on the name of the instance

      4. In the blade menu on the left, under Settings, click on Advanced Settings

      5. Review the setting under Allow access only via SSL

      If Yes is selected, the configuration for that instance is compliant.

      From Azure Policy

      If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

      associated Policy definiti'
    severity: medium
- id: '2.3'
  title: Ensure that 'Minimum TLS version' is set to TLS v1.2 (or higher)
  scoring: manual
  profile:
  - Level 1
  description: Setting the 'Minimum TLS version' helps reduce (but not eliminate) TLS protocol vulnerabilities by preventing
    the use of significantly outdated versions of TLS.
  rationale: Older versions of the TLS protocol have demonstrated vulnerabilities and should be avoided where possible. While
    TLS Protocol Version 1.3 is the most recent and preferred version in cases where it is available, version 1.2 is most
    broadly available and implemented by vendors. When it is configured to avoid specific vulnerable features of the protocol,
    version 1.2 of TLS can provide a secure implementation. Versions 1.0 and 1.1 of TLS are no longer considered secure. These
    versions should not be used or permitted where data integrity and confidentiality are required.
  impact: This configuration setting should not result in any perceptible changes to cost or performance.
  references:
  - 1. https://www.rfc-editor.org/rfc/pdfrfc/rfc8446.txt.pdf
  - 2. https://nvd.nist.gov/vuln/detail/CVE-2016-0701
  page_start: 23
  audit_raw: 'From Azure Portal

    1. Search for and open the Azure Cache for Redis service

    2. For each instance listed, repeat the remaining steps

    3. Click on the name of the instance

    4. In the blade menu on the left, under Settings, click on Advanced Settings

    5. Review the setting under Minimum TLS version

    If 1.2 (Recommended) (or a higher version) is selected, the configuration for that

    instance is compliant.'
  remediation: 'From Azure Portal

    1. Search for and open the Azure Cache for Redis service

    2. For each instance listed, repeat the remaining steps

    3. Click on the name of the instance

    4. In the blade menu on the left, under Settings, click on Advanced Settings

    5. Click the drop-down menu under Minimum TLS version

    6. Select 1.2 (Recommended) (higher versions are preferred when available)'
  checks:
  - type: manual_review
    info: 'From Azure Portal

      1. Search for and open the Azure Cache for Redis service

      2. For each instance listed, repeat the remaining steps

      3. Click on the name of the instance

      4. In the blade menu on the left, under Settings, click on Advanced Settings

      5. Review the setting under Minimum TLS version

      If 1.2 (Recommended) (or a higher version) is selected, the configuration for that

      instance is compliant.'
    severity: medium
- id: '2.4'
  title: Ensure that 'Access Policies' are implemented and reviewed periodically
  scoring: manual
  profile:
  - Level 2
  description: Access Policies provide an Access Control List (ACL) functionality allowing administrators to define which
    identities or identity groups have access to what data and commands. This is an implementation of the Role Based Access
    Control (RBAC) concept and will require careful consideration to deploy and maintain.
  rationale: Role Based Access Control (RBAC) using Access Control Lists (ACLs) is a method of implementing the principle
    of least privilege by ensuring that users and user groups with differing needs are presented with the privilege that fulfills
    their needs and any unnecessary access or functionality is prevented.
  impact: Implementing RBAC for any system requires a careful analysis of 'who' needs access to the system, and 'what' privileges
    or functionality they need to perform. The time required to implement RBAC will increase based on the complexity and size
    of an environment. If RBAC is deployed without careful analysis, it may prevent users from accessing data or functionality
    that they require from the system. Conversely, it may present privilege which is unnecessary and introduce vulnerability
    to a system. Once RBAC has been deployed, there should be periodically scheduled access review. During the access review,
    all entries in the Access Control List and all identities are reviewed for fitness and necessity.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/azure-cache-for-redis/cache-configurerole-based-access-control
  page_start: 25
  audit_raw: 'From Azure Portal

    1. Search for and open the Azure Cache for Redis service

    2. For each instance, repeat the remaining steps

    3. Click on the name of the instance

    4. In the blade menu on the left, under Settings, click on Data Access

    Configuration

    5. Click on the tab titled Access Policies and review the access policies for

    fitness and necessity.

    Please note: No more specific definition can be presented here because the definitions

    of fitness and necessity are judgments that must be made by the administrators and

    security personnel with knowledge of the identities and functionality required of the

    system being evaluated.'
  remediation: 'No prescriptive remediation is available due to the specific and unique nature of

    implementing RBAC for any given system. Implementing RBAC for any system requires

    a careful analysis of ''who'' needs access to the system, and ''what'' privileges or

    functionality they require. The time required to implement RBAC will increase based on

    the complexity and size of an environment.'
  checks:
  - type: manual_review
    info: 'From Azure Portal

      1. Search for and open the Azure Cache for Redis service

      2. For each instance, repeat the remaining steps

      3. Click on the name of the instance

      4. In the blade menu on the left, under Settings, click on Data Access

      Configuration

      5. Click on the tab titled Access Policies and review the access policies for

      fitness and necessity.

      Please note: No more specific definition can be presented here because the definitions

      of fitness and necessity are judgments that must be made by the ad'
    severity: medium
- id: '2.5'
  title: Ensure that 'System Assigned Managed Identity' is set to 'On'
  scoring: manual
  profile:
  - Level 1
  description: System Assigned Managed Identities provide the Azure Cache for Redis instance with a unique account like a
    service principle but automatically assigned and managed by Azure. These identities are unique to the resource instance
    they are created for, and removed when the resource is deleted.
  rationale: The System Assigned Managed Identity is authenticated with Entra ID, and allows for privileges required for the
    instance of Azure Cache for Redis to be granted or restricted using Azure Role Based Access Control (RBAC). Additionally,
    the managed identity provides a means for the Azure Cache for Redis instance to authenticate without storing credentials
    in code.
  impact: ''
  references:
  - 1. https://learn.microsoft.com/en-us/azure/azure-cache-for-redis/cache-managedidentity
  page_start: 27
  audit_raw: 'From Azure Portal

    1. Search for and open the Azure Cache for Redis service

    2. For each instance, repeat the remaining steps

    3. Click on the name of the instance

    4. In the blade menu on the left, under Settings, click on Identity

    5. Under the System assigned tab, ensure that Status is set to On.

    If Yes is selected and Object (principal) ID is populated, the configuration for that

    instance is compliant.'
  remediation: 'From Azure Portal

    1. Search for and open the Azure Cache for Redis service

    2. For each instance, repeat the remaining steps

    3. Click on the name of the instance

    4. In the blade menu on the left, under Settings, click on Identity

    5. Under the System assigned tab, toggle the status to On

    6. Click the Save button

    7. In the pop-up dialog titled Enable system assigned managed identity that

    appears after clicking save, click the Yes button.'
  checks:
  - type: manual_review
    info: 'From Azure Portal

      1. Search for and open the Azure Cache for Redis service

      2. For each instance, repeat the remaining steps

      3. Click on the name of the instance

      4. In the blade menu on the left, under Settings, click on Identity

      5. Under the System assigned tab, ensure that Status is set to On.

      If Yes is selected and Object (principal) ID is populated, the configuration for that

      instance is compliant.'
    severity: medium
- id: '2.6'
  title: Ensure that 'Public Network Access' is 'Disabled'
  scoring: manual
  profile:
  - Level 1
  description: Disabling public network access restricts the service from accessing public networks.
  rationale: A secure network architecture requires carefully constructed network segmentation. Public Network Access tends
    to be overly permissive and introduces unintended vectors for threat activity.
  impact: 'Some architectural consideration may be necessary to ensure that required network connectivity is still made available.
    No additional cost or performance impact is required to deploy this recommendation. IMPORTANT NOTE: If Azure Cache for
    Redis has been deployed in a VNet, this recommendation cannot be implemented. See additional information below for more
    detail.'
  references:
  - 1. https://learn.microsoft.com/en-us/security/benchmark/azure/security-controls-v3network-security#ns-2-secure-cloud-services-with-network-controls
  - 2. https://learn.microsoft.com/en-us/azure/azure-cache-for-redis/cache-networkisolation
  page_start: 29
  audit_raw: 'From Azure Portal

    NOTE: This procedure applies only to instances that are not using VNets.

    1. Search for and open the Azure Cache for Redis service

    2. For each instance, repeat the remaining steps

    3. Click on the name of the instance

    4. In the blade menu on the left, click on Private Endpoint

    5. Review the button to the right of + Private Endpoint

    If the button is titled enable public network access, the configuration for that

    instance is currently disabled and compliant.'
  remediation: 'From Azure Portal

    NOTE: A Private Endpoint must exist before the “Disable public network access” button

    allows the configuration change to be performed via Portal.

    1. Search for and open the Azure Cache for Redis service

    2. For each instance, repeat the remaining steps

    3. Click on the name of the instance

    4. In the blade menu on the left, click on Private Endpoint

    5. Click the Disable public network access button.'
  checks:
  - type: manual_review
    info: 'From Azure Portal

      NOTE: This procedure applies only to instances that are not using VNets.

      1. Search for and open the Azure Cache for Redis service

      2. For each instance, repeat the remaining steps

      3. Click on the name of the instance

      4. In the blade menu on the left, click on Private Endpoint

      5. Review the button to the right of + Private Endpoint

      If the button is titled enable public network access, the configuration for that

      instance is currently disabled and compliant.'
    severity: medium
- id: '3.1'
  title: Ensure That 'Firewalls & Networks' Is Limited to Use Selected Networks Instead of All Networks
  scoring: scored
  profile:
  - Level 2
  description: Limiting your Cosmos DB to only communicate on whitelisted networks lowers its attack footprint.
  rationale: Selecting certain networks for your Cosmos DB to communicate restricts the number of networks including the internet
    that can interact with what is stored within the database.
  impact: 'WARNING: Failure to whitelist the correct networks will result in a connection loss. WARNING: Changes to Cosmos
    DB firewalls may take up to 15 minutes to apply. Ensure that sufficient time is planned for remediation or changes to
    avoid disruption.'
  references:
  - 1. https://docs.microsoft.com/en-us/azure/cosmos-db/how-to-configure-privateendpoints
  - 2. https://docs.microsoft.com/en-us/azure/cosmos-db/how-to-configure-vnetservice-endpoint
  page_start: 32
  audit_raw: 'From Azure Portal

    1. Open the portal menu.

    2. Select the Azure Cosmos DB blade

    3. Select a Cosmos DB to audit.

    4. Select Networking.

    5. Under Public network access, ensure Selected networks is selected.

    6. Under Virtual networks, ensure appropriate virtual networks are configured.

    From Azure CLI

    Retrieve a list of all CosmosDB database names:

    az cosmosdb list

    For each database listed, run the following command:

    az cosmosdb show <database id>

    For each database, ensure that isVirtualNetworkFilterEnabled is set to true

    From Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

