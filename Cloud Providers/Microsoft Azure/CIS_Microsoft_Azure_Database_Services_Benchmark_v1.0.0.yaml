    7. For existing networks, select subscription, virtual network, subnet and click Add.

    For new networks, provide a name, update the default values if required, and

    click Create.

    8. Click Save.'
  checks:
  - type: manual_review
    info: 'From Azure Portal

      1. Open the portal menu.

      2. Select the Azure Cosmos DB blade

      3. Select a Cosmos DB to audit.

      4. Select Networking.

      5. Under Public network access, ensure Selected networks is selected.

      6. Under Virtual networks, ensure appropriate virtual networks are configured.

      From Azure CLI

      Retrieve a list of all CosmosDB database names:

      az cosmosdb list

      For each database listed, run the following command:

      az cosmosdb show <database id>

      For each database, ensure that isVirtualNetworkFilterE'
    severity: medium
- id: '3.2'
  title: Ensure That Private Endpoints Are Used Where Possible
  scoring: scored
  profile:
  - Level 2
  description: Private endpoints limit network traffic to approved sources.
  rationale: For sensitive data, private endpoints allow granular control of which services can communicate with Cosmos DB
    and ensure that this network traffic is private. You set this up on a case by case basis for each service you wish to
    be connected.
  impact: Only whitelisted services will have access to communicate with the Cosmos DB.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/cosmos-db/how-to-configure-privateendpoints
  - 2. https://docs.microsoft.com/en-us/azure/private-link/tutorial-private-endpointcosmosdb-portal
  page_start: 35
  audit_raw: 'From Azure Portal

    1. Open the portal menu.

    2. Select the Azure Cosmos DB blade.

    3. Select the Azure Cosmos DB account.

    4. Select Networking.

    5. Ensure Public network access is set to Selected networks.

    6. Ensure the listed networks are set appropriately.

    7. Select Private access.

    8. Ensure a private endpoint exists and Connection state is Approved.

    From Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    •

    Policy ID: 58440f8a-10c5-4151-bdce-dfbaad4a20b7 - Name: ''CosmosDB

    accounts should use private link'''
  remediation: 'From Azure Portal

    1. Open the portal menu.

    2. Select the Azure Cosmos DB blade.

    3. Select the Azure Cosmos DB account.

    4. Select Networking.

    5. Select Private access.

    6. Click + Private Endpoint.

    7. Provide a Name.

    8. Click Next.

    9. From the Resource type drop down, select

    Microsoft.AzureCosmosDB/databaseAccounts.

    10. From the Resource drop down, select the Cosmos DB account.

    11. Click Next.

    12. Provide appropriate Virtual Network details.

    13. Click Next.

    14. Provide appropriate DNS details.

    15. Click Next.

    16. Optionally provide Tags.

    17. Click Next : Review + create.

    18. Click Create.'
  checks:
  - type: manual_review
    info: 'From Azure Portal

      1. Open the portal menu.

      2. Select the Azure Cosmos DB blade.

      3. Select the Azure Cosmos DB account.

      4. Select Networking.

      5. Ensure Public network access is set to Selected networks.

      6. Ensure the listed networks are set appropriately.

      7. Select Private access.

      8. Ensure a private endpoint exists and Connection state is Approved.

      From Azure Policy

      If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

      associated Policy definition in Azure'
    severity: medium
- id: '3.3'
  title: Use Entra ID Client Authentication and Azure RBAC where possible.
  scoring: manual
  profile:
  - Level 1
  description: Cosmos DB can use tokens or Entra ID for client authentication which in turn will use Azure RBAC for authorization.
    Using Entra ID is significantly more secure because Entra ID handles the credentials and allows for MFA and centralized
    management, and the Azure RBAC better integrated with the rest of Azure.
  rationale: Entra ID client authentication is considerably more secure than token-based authentication because the tokens
    must be persistent at the client. Entra ID does not require this.
  impact: ''
  references:
  - 1. https://learn.microsoft.com/en-us/azure/cosmos-db/role-based-access-control
  page_start: 38
  audit_raw: 'From Powershell:

    $cosmosdbname = "<your-cosmos-db-account-name>"

    $resourcegroup = "<your-resource-group-name>"

    az cosmosdb show --name $cosmosdbname --resource-group $resourcegroup |

    ConvertFrom-Json

    In the resulting output, disableLocalAuth should be true'
  remediation: 'Map all the resources that currently access to the Azure Cosmos DB account with keys

    or access tokens.

    Create an Entra ID identity for each of these resources:

    • For Azure resources, you can create a managed identity. You may choose

    between system-assigned and user-assigned managed identities.

    • For non-Azure resources, create an Entra ID identity. Grant each Entra ID

    identity the minimum permission it requires. When possible, we recommend you

    use one of the 2 built-in role definitions: Cosmos DB Built-in Data Reader or

    Cosmos DB Built-in Data Contributor. Validate that the new resource is

    functioning correctly. After new permissions are granted to identities, it may take

    a few hours until they propagate. When all resources are working correctly with

    the new identities, continue to the next step.

    From Powershell:

    $cosmosdbname = "<your-cosmos-db-account-name>"

    $resourcegroup = "<your-resource-group-name>"

    az cosmosdb show --name $cosmosdbname --resource-group $resourcegroup |

    ConvertFrom-Json

    az resource update --ids $cosmosdb.id --set properties.disableLocalAuth=true

    --latest-include-preview'
  checks:
  - type: manual_review
    info: 'From Powershell:

      $cosmosdbname = "<your-cosmos-db-account-name>"

      $resourcegroup = "<your-resource-group-name>"

      az cosmosdb show --name $cosmosdbname --resource-group $resourcegroup |

      ConvertFrom-Json

      In the resulting output, disableLocalAuth should be true'
    severity: medium
- id: '6.1'
  title: Ensure 'Enforce SSL connection' is set to 'Enabled' for Standard MySQL Database Server
  scoring: scored
  profile:
  - Level 1
  description: Enable SSL connection on MYSQL Servers.
  rationale: SSL connectivity helps to provide a new layer of security by connecting database server to client applications
    using Secure Sockets Layer (SSL). Enforcing SSL connections between database server and client applications helps protect
    against "man in the middle" attacks by encrypting the data stream between the server and application.
  impact: ''
  references:
  - 1. https://docs.microsoft.com/en-us/azure/mysql/single-server/concepts-sslconnection-security
  - 2. https://docs.microsoft.com/en-us/azure/mysql/single-server/how-to-configure-ssl
  page_start: 43
  audit_raw: "From Azure Portal\n1. Login to Azure Portal using https://portal.azure.com\n2. Go to Azure Database for MySQL\
    \ servers\n3. For each database, click on Connection security\n4. In SSL settings, ensure Enforce SSL connection is set\
    \ to ENABLED.\nFrom Azure CLI\nEnsure the output of the below command returns ENABLED.\n az mysql server show --resource-group\
    \ <resourceGroupName> --name\n<serverName> --query sslEnforcement\nFrom Azure Policy\nIf referencing a digital copy of\
    \ this Benchmark, clicking a Policy ID will open a link to the\nassociated Policy definition in Azure.\nIf referencing\
    \ a printed copy, you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: e802a67a-daf5-4436-9ea6-f6d821dd0c5d - Name: 'Enforce SSL\nconnection should be enabled for MySQL database\
    \ servers'"
  remediation: "From Azure Portal\n1. Login to Azure Portal using https://portal.azure.com\n2. Go to Azure Database for MySQL\
    \ servers\n3. For each database, click on Connection security\n4. In SSL settings, click on ENABLED to Enforce SSL connections\n\
    From Azure CLI\nUse the below command to set MYSQL Databases to Enforce SSL connection.\n az mysql server update --resource-group\
    \ <resourceGroupName> --name\n<serverName> --ssl-enforcement Enabled"
  checks:
  - type: manual_review
    info: "From Azure Portal\n1. Login to Azure Portal using https://portal.azure.com\n2. Go to Azure Database for MySQL servers\n\
      3. For each database, click on Connection security\n4. In SSL settings, ensure Enforce SSL connection is set to ENABLED.\n\
      From Azure CLI\nEnsure the output of the below command returns ENABLED.\n az mysql server show --resource-group <resourceGroupName>\
      \ --name\n<serverName> --query sslEnforcement\nFrom Azure Policy\nIf referencing a digital copy of this Benchmark, clicking\
      \ a Policy ID wil"
    severity: medium
- id: '6.2'
  title: Ensure 'TLS Version' is set to 'TLSV1.2' (or higher) for MySQL flexible Database Server
  scoring: scored
  profile:
  - Level 1
  description: Ensure TLS version on MySQL flexible servers is set to use TLS version 1.2 or higher.
  rationale: TLS connectivity helps to provide a new layer of security by connecting database server to client applications
    using Transport Layer Security (TLS). Enforcing TLS connections between database server and client applications helps
    protect against "man in the middle" attacks by encrypting the data stream between the server and application.
  impact: ''
  references:
  - 1. https://docs.microsoft.com/en-us/azure/mysql/concepts-ssl-connection-security
  - 2. https://docs.microsoft.com/en-us/azure/mysql/howto-configure-ssl
  page_start: 45
  audit_raw: "From Azure Portal\n1. Login to Azure Portal using https://portal.azure.com\n2. Go to Azure Database for MySQL\
    \ flexible servers\n3. For each database, click on Server parameters under Settings\n4. In the search box, type in tls_version\n\
    5. Ensure tls_version is set to TLSV1.2 (or higher)\nFrom Azure CLI\nEnsure the output of the below command contains the\
    \ key value pair \"values\":\n\"TLSV1.2\" (or higher).\n az mysql flexible-server parameter show --name tls_version --resourcegroup\
    \ <resourceGroupName> --server-name <serverName>\nExample output (next page):\n{\n \"allowedValues\": \"TLSv1,TLSv1.1,TLSv1.2\"\
    ,\n \"dataType\": \"Set\",\n \"defaultValue\": \"TLSv1.2\",\n \"description\": \"Which protocols the server permits for\
    \ encrypted\nconnections. By default, TLS 1.2 is enforced\",\n \"id\":\n\"/subscriptions/<subscriptionId>/resourceGroups/<resourceGroupName>/providers\n\
