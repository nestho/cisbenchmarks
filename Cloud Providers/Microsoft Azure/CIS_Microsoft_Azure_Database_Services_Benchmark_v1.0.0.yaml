- id: '10.7'
  title: Ensure Public Network Access is Disabled
  scoring: manual
  profile:
  - Level 1
  description: Disabling public network access restricts the service from accessing public networks.
  rationale: A secure network architecture requires carefully constructed network segmentation. Public Network Access tends
    to be overly permissive and introduces unintended vectors for threat activity.
  impact: Some architectural consideration may be necessary to ensure that required network connectivity is still made available.
    No additional cost or performance impact is required to deploy this recommendation.
  references:
  - 1. https://learn.microsoft.com/en-us/security/benchmark/azure/security-controls-v3network-security#ns-2-secure-cloud-services-with-network-controls
  - 2. https://learn.microsoft.com/en-us/azure/azure-sql/database/connectivitysettings?view=azuresql&tabs=azure-portal#deny-public-network-access
  page_start: 100
  audit_raw: 'From Azure Portal

    1. Search for and open the SQL Server service

    2. For each SQL Server listed, repeat the remaining steps

    3. Click on the name of the SQL Server

    4. In the blade menu on the left, expand the Security section

    5. Under the expanded Security section, click on Networking

    6. Review the Public access tab in the networking window.

    If the radio button under Public network access setting is set to Disable, the

    configuration for that SQL Server is compliant.'
  remediation: 'From Azure Portal

