    • Policy ID: 862e97cf-49fc-4a5c-9de4-40d4e2e7c8eb - Name: ''Azure Cosmos DB

    accounts should have firewall rules'''
  remediation: 'From Azure Portal

    1. Open the portal menu.

    2. Select the Azure Cosmos DB blade.

    3. Select a Cosmos DB account to audit.

    4. Select Networking.

    5. Under Public network access, select Selected networks.

    6. Under Virtual networks, select + Add existing virtual network or + Add

