  audit_raw: 'Take note of currently supported versions of Java here:

    https://www.oracle.com/java/technologies/java-se-support-roadmap.html

    Audit from Azure Portal

    1. Go to App Services.

    2. Click the name of an app.

    3. Under Settings, click Configuration.

    4. In the General settings pane, ensure that for a Stack of Java, the Major

    Version and Minor Version reflect a currently supported release, and that the

    Java web server version is set to the auto-update option.

    5. Repeat steps 1-4 for each app.

    NOTE: No action is required if Java version is set to Off, as Java is not used by your

    app.

    Audit from Azure CLI

    Run the following command to list apps:

    az webapp list

    For each app, run the following command to check the Java version:

    az webapp config show --resource-group <resource-group-name> --name <appname> --query "{LinuxFxVersion:linuxFxVersion,

    WindowsFxVersion:windowsFxVersion, JavaVersion:javaVersion,

    JavaContainerVersion:javaContainerVersion, JavaContainer:javaContainer}"

    If Java is in use, ensure the version is currently supported.

    Audit from PowerShell

    For each application, store the application information within an object, and then

    interrogate the SiteConfig information for that application object:

    $app = Get-AzWebApp -Name <app-name> -ResourceGroup <resource-group-name>

    $app.SiteConfig |Select-Object LinuxFXVersion, WindowsFxVersion, JavaVersion,

    JavaContainerVersion, JavaContainer

    If Java is in use, ensure the version is currently supported.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 496223c3-ad65-4ecd-878a-bae78737e9ed - Name: ''App Service

    apps that use Java should use a specified ''Java version''''

    Take note of the currently supported versions (given a status of "security") of Python

    here: https://devguide.python.org/versions/

    Audit from Azure Portal

    1. Go to App Services.

    2. Click the name of an app.

    3. Under Settings, click Configuration.

    4. In the General settings pane, ensure that for a Stack of Python, the Major

    version and Minor version reflect a currently supported release.

    5. Repeat steps 1-4 for each app.

    Audit from Azure CLI

    Run the following command to list apps:

    az webapp list

    For each app, run the following command to get the Python version:

    az webapp config show --resource-group <resource-group-name> --name <appname> --query

    "{LinuxFxVersion:linuxFxVersion,WindowsFxVersion:windowsFxVersion,PythonVersi

    on:pythonVersion}"

    If Python is in use, ensure the version is currently supported.

    Audit from PowerShell

    $app = Get-AzWebApp -Name <app-name> -ResourceGroup <resource-group-name>

    $app.SiteConfig |Select-Object LinuxFXVersion, WindowsFxVersion,

    PythonVersion

    If Python is in use, ensure the version is currently supported.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 7008174a-fd10-4ef0-817e-fc820a951d73 - Name: ''App Service apps

    that use Python should use a specified ''Python version''''

    Take note of the currently supported versions of PHP here:

    https://www.php.net/supported-versions.php

    Audit from Azure Portal

    1. Go to App Services.

    2. Click the name of an app.

    3. Under Settings, click Configuration.

    4. In the General settings pane, ensure that for a Stack of PHP, the Major

    version and Minor version reflect a currently supported release.

    5. Repeat steps 1-4 for each app.

    Audit from Azure CLI

    Run the following command to list apps:

    az webapp list

    For each app, run the following command to get the PHP version:

    az webapp config show --resource-group <resource-group-name> --name <appname> --query "{LinuxFxVersion:linuxFxVersion,PhpVersion:phpVersion}"

    If PHP is in use, ensure the version is currently supported.

    Audit from PowerShell

    Run the following command to list apps:

    Get-AzWebApp

    Run the following command to get the app in a resource group with a given name:

    $app = Get-AzWebApp -ResourceGroupName <resource-group-name> -Name <app-name>

    Run the following command to get the PHP version:

    $app.SiteConfig | select-object LinuxFXVersion, PhpVersion

    If PHP is in use, ensure the version is currently supported.

    Repeat for each app.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 7261b898-8a84-4db8-9e04-18527132abb3 - Name: ''App Service

    apps that use PHP should use a specified ''PHP version'''''
  remediation: 'Remediate from Azure Portal

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. Click on each App

    4. Under Settings section, click on Configuration

    5. Click on the General settings pane and ensure that for a Stack of Java the

    Major Version and Minor Version reflect a currently supported release, and

    that the Java web server version is set to the auto-update option.

    NOTE: No action is required if Java version is set to Off, as Java is not used by your

    app.

    Remediate from Azure CLI

    To see the list of supported runtimes:

    az webapp list-runtimes

    To set a currently supported Java version for an existing app, run the following

    command:

    az webapp config set --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME>

    [--java-version <JAVA_VERSION> --java-container <JAVA_CONTAINER> --javacontainer-version <JAVA_CONTAINER_VERSION> [--windows-fx-version

    <JAVA_RUNTIME_VERSION>] [--linux-fx-version <JAVA_RUNTIME_VERSION>]

    If creating a new application to use a currently supported version of Java, run the

    following commands.

    To create an app service plan:

    az appservice plan create --resource-group <RESOURCE_GROUP_NAME> --name

    <PLAN_NAME> --location <LOCATION> [--is-linux --number-of-workers <INT> --sku

    <PRICING_TIER>] [--hyper-v --sku <PRICING_TIER>]

    Get the app service plan ID:

    az appservice plan list --query "[].{Name:name, ID:id, SKU:sku,

    Location:location}"

    To create a new Java web application using the retrieved app service ID:

    az webapp create --resource-group <RESOURCE_GROUP_NAME> --plan

    <APP_SERVICE_PLAN_ID> --name <app name> [--linux-fx-version

    <JAVA_RUNTIME_VERSION>] [--windows-fx-version <JAVA_RUNTIME_VERSION>]

    Remediate from PowerShell

    As of this writing, there is no way to update an existing application''s SiteConfig or set

    a new application''s SiteConfig settings during creation via PowerShell.

    Note: No action is required if Python is not in use.

    Remediate from Azure Portal

    1. Go to App Services.

    2. Click the name of an app.

    3. Under Settings, click Configuration.

    4. In the General settings pane, for a Stack of Python, set the Major version

    and Minor version to a currently supported release.

    5. Click Save.

    6. Click Continue.

    7. Repeat steps 1-6 for each app requiring remediation.

    Remediate from Azure CLI

    Run the following command to list supported runtimes:

    az webapp list-runtimes

    For each app requiring remediation, run the following command with the appropriate

    parameters to update the Python version:

    az webapp config set --resource-group <resource-group-name> --name <app-name>

    [--windows-fx-version "PYTHON|<version>"] [--linux-fx-version

    "PYTHON|<version>"]

    Note: No action is required if PHP is not in use.

    Remediate from Azure Portal

    1. Go to App Services.

    2. Click the name of an app.

    3. Under Settings, click Configuration.

    4. In the General settings pane, for a Stack of PHP, set the Major version and

    Minor version to a currently supported release.

    5. Click Save.

    6. Click Continue.

    7. Repeat steps 1-6 for each app requiring remediation.

    Remediate from Azure CLI

    Run the following command to list supported runtimes:

    az webapp list-runtimes

    For each app requiring remediation, run the following command with the appropriate

    parameters to update the PHP version:

    az webapp config set --resource-group <resource-group-name> --name <app-name>

    [--linux-fx-version <php-runtime-version>][--php-version <php-version>]

    Remediate from PowerShell

    For each app requiring remediation, run the following command to update the PHP

    version:

    Set-AzWebApp -ResourceGroupName <resource-group-name> -Name <app-name> -

    phpVersion <php-version>

    Note: Currently, there is no way to update an app''s Linux FX Version setting using

    PowerShell.'
  checks:
  - type: manual_review
    info: 'Take note of currently supported versions of Java here:

