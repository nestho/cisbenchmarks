- id: 2.1.17
  title: Ensure private endpoints used to access App Service apps use private DNS zones
  scoring: manual
  profile:
  - Level 2
  description: Use private DNS zones to override DNS resolution for a private endpoint. A private DNS zone links a virtual
    network to an App Service app. This recommendation assumes application of, and should be applied in conjunction with,
    the recommendation titled "Ensure private endpoints are used to access App Service apps."
  rationale: It’s important to correctly configure DNS settings to ensure that the fully qualified domain name (FQDN) of the
    App Service app resolves to the private endpoint IP address.
  impact: Incorrectly configured DNS settings may result in unintentional exposure of traffic to the public internet.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/app-service/overview-privateendpoint#dns
  - 2. https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
