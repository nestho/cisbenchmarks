  description: Install endpoint protection for all virtual machines.
  rationale: Installing endpoint protection systems (like anti-malware for Azure) provides for realtime protection capability
    that helps identify and remove viruses, spyware, and other malicious software. These also offer configurable alerts when
    known-malicious or unwanted software attempts to install itself or run on Azure systems.
  impact: Endpoint protection will incur an additional cost to you.
  references:
