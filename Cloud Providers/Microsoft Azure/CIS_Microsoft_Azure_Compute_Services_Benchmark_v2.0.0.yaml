- id: 2.4.12
  title: Ensure public network access is disabled
  scoring: scored
  profile:
  - Level 1
  description: Disable public network access to prevent exposure to the internet and reduce the risk of unauthorized access.
    Use private endpoints to securely manage access within trusted networks. This recommendation applies to function apps
    using the Consumption, Premium, or Dedicated (App Service) plans, which support deployment slots.
  rationale: Disabling public network access improves security by ensuring that the service is not directly exposed to the
    public Internet. This has the added benefit of providing more granular control over security settings and configurations
    for those additional layers of separation.
  impact: 'NOTE: Prior to disabling public network access, it is strongly recommended that, for each function app deployment
    slot, either: • complete virtual network integration as described in "Ensure app is integrated with a virtual network"
    OR • set up private endpoints/links as described in "Ensure private endpoints are used to access App Service apps." Disabling
    public network access restricts direct access to the service. This enhances security but will require the configuration
    of a virtual network and/or private endpoints for any services or users needing access within trusted networks.'
