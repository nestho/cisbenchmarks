- id: 2.1.4
  title: Ensure 'Basic Authentication Publishing Credentials' are 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Basic Authentication Publishing Credentials provides the ability to publish—or deploy to—an App Service app
    without a centralized Identity Provider. For a more effective, capable, and secure solution for Identity, Authentication,
    Authorization, and Accountability, a centralized Identity Provider such as Entra ID is strongly advised.
  rationale: Basic Authentication introduces an identity silo for privileged access to a resource and produces logging which
    may not provide a full chain of accountability. This can be exploited in numerous ways and represents a significant vulnerability
    and attack vector.
  impact: 'Disabling ''Basic Auth Publishing Credentials'' will prevent the following deployment methods from working: FTP
    Basic Auth Publishing Credentials: • FTP • FTPS SCM Basic Auth Publishing Credentials: • Local Git • GitHub • Azure Repos
    • Bitbucket • Visual Studio (Version 17.12 and earlier) If this recommendation cannot be implemented because one of the
    above listed deployment methods is necessary and cannot be adapted, compensating controls (e.g. using FTPS Only and disabling
    only "SCM Basic Auth Publishing Credentials") are recommended to reduce potential attack surface. An Identity Provider
    that can be used by the App Service app for authenticating users is required.'
  references:
  - 1. https://learn.microsoft.com/en-us/azure/app-service/configure-basic-auth-disable
  - 2. https://learn.microsoft.com/en-us/cli/azure/webapp
  page_start: 36
  audit_raw: 'Audit from Azure Portal

    1. Search for, and open App Services from the search bar.

    2. For each App Service listed:

    3. Click on the App Service name.

    4. Under the Settings menu item, click on Configuration

    5. Under the General settings tab, scroll down to locate the two Basic Auth

    settings:

    • SCM Basic Auth Publishing Credentials

    • FTP Basic Auth Publishing Credentials

    Both radio buttons should indicate a status of Off.

    Repeat this procedure for each App Service.

    Audit from Azure CLI

    Run the following command to list apps:

    az webapp list

    For each app, run the following command to get the basic authentication for FTP

    setting:

    az resource show --resource-group <resource-group-name> --name ftp --

    namespace Microsoft.Web --resource-type basicPublishingCredentialsPolicies --

    parent sites/<app-name> --query properties.allow

    Ensure that false is returned.

    For each app, run the following command to get the basic authentication for SCM

    setting:

    az resource show --resource-group <resource-group-name> --name scm --

    namespace Microsoft.Web --resource-type basicPublishingCredentialsPolicies --

    parent sites/<app-name> --query properties.allow

    Ensure that false is returned.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 871b205b-57cf-4e1e-a234-492616998bf7 - Name: ''App Service apps

    should have local authentication methods disabled for FTP deployments''

    • Policy ID: aede300b-d67f-480a-ae26-4b3dfb1a1fdc - Name: ''App Service apps

    should have local authentication methods disabled for SCM site deployments'''
  remediation: 'Remediate from Azure Portal

    1. Search for, and open App Services from the search bar.

    2. For each App Service listed:

    3. Click on the App Service name.

    4. Under the Settings menu item, click on Configuration

    5. Under the General settings tab, scroll down to locate the two Basic Auth

    settings:

    • Set the SCM Basic Auth Publishing Credentials radio button to Off

    • Set the FTP Basic Auth Publishing Credentials radio button to Off

    CAUTION: The new settings are not yet applied. Applying them may cause your App

    Service resource to restart - proceed with caution. Click the Save button, then click

    Continue to apply the updated configuration.

    Repeat this procedure for each App Service.

    Remediate from Azure CLI

    For each app requiring remediation, run the following command to disable basic

    authentication for FTP:

    az resource update --resource-group <resource-group-name> --name ftp --

    namespace Microsoft.Web --resource-type basicPublishingCredentialsPolicies --

    parent sites/<app-name> --set properties.allow=false

    For each app requiring remediation, run the following command to disable basic

    authentication for SCM:

    az resource update --resource-group <resource-group-name> --name scm --

    namespace Microsoft.Web --resource-type basicPublishingCredentialsPolicies --

    parent sites/<app-name> --set properties.allow=false'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

