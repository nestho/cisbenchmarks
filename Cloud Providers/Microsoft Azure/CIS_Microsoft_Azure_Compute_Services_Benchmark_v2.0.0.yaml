  remediation: 'Remediate from Azure Portal

    1. Go to App Services or Function App.

    2. Click the name of a function app.

    3. Under Settings, click Networking.

    4. Under Outbound traffic configuration, next to Virtual network

    integration, click Not configured.

    5. Click Add virtual network integration.

    6. Select an existing App Service Plan connection, or select New connection and

    select a subscription, virtual network, and subnet.

