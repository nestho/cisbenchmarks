- id: 2.2.17
  title: Ensure cross-origin resource sharing does not allow all origins
  scoring: scored
  profile:
  - Level 2
  - Level 1
  description: Cross-origin resource sharing (CORS) is a security feature that controls how applications interact with resources
    hosted on different domains. Periodically, older versions of Java may be deprecated and no longer supported. Using a supported
    version of Java for function apps is recommended to avoid potential unpatched vulnerabilities. Periodically, older versions
    of Python may be deprecated and no longer supported. Using a supported version of Python for function apps is recommended
    to avoid potential unpatched vulnerabilities.
  rationale: Restrict CORS to only trusted origins to help enforce proper access control and reduce exposure to malicious
    cross-origin requests. Deprecated and unsupported versions of programming and scripting languages can present vulnerabilities
    which may not be addressed or may not be addressable. Deprecated and unsupported versions of programming and scripting
    languages can present vulnerabilities which may not be addressed or may not be addressable.
  impact: Configuration is required to ensure that the appropriate origins have access. Setting up a proper CORS policy can
    be fairly complex and an incorrect setting could permit Cross-Site Request Forgery (CSRF). The "caveat" is that if the
    app being deployed is a PUBLIC API, a wildcard "*" CORS policy is absolutely necessary. If your app is written using version-dependent
    features or libraries, they may not be available on more recent versions. If you wish to update, research the impact thoroughly.
    If your app is written using version-dependent features or libraries, they may not be available on more recent versions.
    If you wish to update, research the impact thoroughly.
  references:
  - 1. https://learn.microsoft.com/en-gb/azure/app-service/app-service-web-tutorialrest-api
  - 2. https://learn.microsoft.com/en-us/cli/azure/webapp
  - 1. https://learn.microsoft.com/en-us/azure/app-service/configure-language-javadeploy-run
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-posturevulnerability-management#pv-3-define-and-establish-secure-configurations-forcompute-resources
  - 1. https://learn.microsoft.com/en-us/azure/app-service/configurecommon#configure-language-stack-settings
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/security-controls-v3posture-vulnerability-management#pv-7-rapidly-and-automatically-remediatesoftware-vulnerabilities
