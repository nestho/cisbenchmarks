    For each Batch account perform the following:\n1. Expand the Features section then click on Pools\n2. For each Pool ID,\
    \ click the name to open the pool\n3. Under the Configuration section, check Disk Encryption\nIf the pool is encrypted,\
    \ it should display \"OS disk\" and/or \"Temporary disk\" encryption\nenabled.\nAudit from Azure CLI\nRun the following\
    \ commands:\n# List all pools and their encryption status\naz batch pool list \\\n --account-name <batch-account-name>\
    \ \\\n --query \"[].{id:id,\nencryption:deploymentConfiguration.virtualMachineConfiguration.diskEncryption\nConfiguration}\"\
    \ \\\n --output table\nExpected Output: \"OsDisk\" and/or \"TemporaryDisk\" should be listed under\nencryption.targets.\n\
    Audit from PowerShell\nRun the following command:\n# Get Batch account context\n$batchContext = Get-AzBatchAccount -AccountName\
    \ \"<batch-account-name>\"\n# List all pools and check encryption\nGet-AzBatchPool -BatchContext $batchContext | ForEach-Object\
    \ {\n $pool = $_\n $encryptionConfig =\n$pool.DeploymentConfiguration.VirtualMachineConfiguration.DiskEncryptionConfi\n\
    guration\n [PSCustomObject]@{\n PoolId = $pool.Id\n OsDiskEncrypted = $encryptionConfig.Targets -contains \"OsDisk\"\n\
    \ TempDiskEncrypted = $encryptionConfig.Targets -contains\n\"TemporaryDisk\"\n }\n}\nExpected Output: OsDiskEncrypted\
    \ and TempDiskEncrypted should be True\nAudit from Azure Policy\nIf referencing a digital copy of this Benchmark, clicking\
    \ a Policy ID will open a link to the\nassociated Policy definition in Azure.\nIf referencing a printed copy, you can\
    \ search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: 1760f9d4-7206-436e-a28f-d9f3a5c8a227 - Name: 'Azure Batch pools\nshould have disk encryption enabled'"
  remediation: "NOTE: Encrypted pools must be created as replacements for unencrypted pools.\nPlease ensure that necessary\
    \ precautions are taken to backup and restore data from\npersistent disk pools.\nRemediate from Azure Portal\n1. Navigate\
    \ to Azure Batch accounts\n2. Select your Batch account\n3. Click Pools in the left menu\n4. For each unencrypted pool,\
    \ click Create new pool\n5. Under Advanced settings, enable Disk encryption and select OS disk\nor All disks\n6. Configure\
    \ all other settings to match your existing pool\n7. Click Create to deploy the encrypted pool\n8. Resize the old unencrypted\
    \ pool to 0 nodes after verifying the new pool is\noperational\nRepeat steps 4-8 for each unencrypted pool\nRemediate\
    \ from Azure CLI\n1. Get pool configuration\nconfig=$(az batch pool show --pool-id <pool-name> --query\n\"{vmSize:vmSize,image:virtualMachineConfiguration.imageReference,nodeCount:ta\n\
    rgetDedicatedNodes}\")\n2. Create encrypted replacement\naz batch pool create \\\n --id \"<pool-name>-encrypted\" \\\n\
    \ --vm-size $(jq -r '.vmSize' <<< \"$config\") \\\n --image-reference \"$(jq -r '.image.publisher + \":\" + .image.offer\
    \ + \":\" +\n.image.sku + \":\" + .image.version' <<< \"$config\")\" \\\n --node-count $(jq -r '.nodeCount' <<< \"$config\"\
    ) \\\n --disk-encryption-target OsDisk\n3. Decommission old pool\naz batch pool resize --pool-id <pool-name> --target-dedicated-nodes\
    \ 0\nRemediate from PowerShell\n1. Get pool configuration\n$pool = Get-AzBatchPool -Id \"<pool-name>\" -BatchContext $context\n\
    2. Create encrypted replacement\n$newConfig = New-Object\nMicrosoft.Azure.Commands.Batch.Models.PSPoolConfiguration\n\
    $newConfig.VirtualMachineConfiguration =\n$pool.VirtualMachineConfiguration.Clone()\n$newConfig.VirtualMachineConfiguration.DiskEncryptionConfiguration\
    \ = NewObject Microsoft.Azure.Commands.Batch.Models.PSDiskEncryptionConfiguration\n$newConfig.VirtualMachineConfiguration.DiskEncryptionConfiguration.Targets\
    \ =\n\"OsDisk\"\nNew-AzBatchPool -Id \"<pool-name>-encrypted\" -PoolConfiguration $newConfig -\nBatchContext $context\n\
    3. Decommission old pool\nSet-AzBatchPool -Id \"<pool-name>\" -TargetDedicatedComputeNodes 0 -\nBatchContext $context\n\
    Expected Output: Disk encryption Enabled"
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Login to Azure portal https://portal.azure.com

      2. Navigate to Batch Accounts

      For each Batch account perform the following:

      1. Expand the Features section then click on Pools

