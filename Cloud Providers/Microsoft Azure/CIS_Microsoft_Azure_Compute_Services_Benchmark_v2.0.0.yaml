    ).Id\nNew-AzDiagnosticSetting -Name \"BatchLogs\" -ResourceId $batchAccountId -Log\n@(@{Category=\"AuditLog\";Enabled=$true},\n\
    @{Category=\"ServiceLog\";Enabled=$true}) -WorkspaceId (GetAzOperationalInsightsWorkspace -Name \"<workspace_name>\").ResourceId"
