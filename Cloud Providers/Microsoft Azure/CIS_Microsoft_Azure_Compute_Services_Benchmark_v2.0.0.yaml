- id: 2.1.12
  title: Ensure 'App Service authentication' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 2
  description: App Service authentication can prevent anonymous HTTP requests from reaching an app, or authenticate those
    with tokens before they reach the app. If an anonymous request is received from a browser, App Service will redirect to
    a login page. To handle the login process, a choice from a set of identity providers can be made, or a custom authentication
    mechanism can be implemented.
  rationale: By enabling authentication, every incoming HTTP request passes through it before being handled by the application
    code. It also handles authentication of users with the specified provider (Entra ID, Facebook, Google, Microsoft Account,
    and Twitter), validation, storage and refreshing of tokens, managing the authenticated sessions, and injecting identity
    information into request headers.
  impact: This is only required for apps that require authentication. Enabling it on a site like a marketing or support website
    will prevent unauthenticated access, which would be undesirable. Adding an authentication requirement will increase costs
    and require additional security components to facilitate the authentication.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/app-service/overview-authenticationauthorization
  - 2. https://learn.microsoft.com/en-us/azure/role-based-access-control/built-inroles#website-contributor
