    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: c75248c1-ea1d-4a9c-8fc9-29a6aabd5da8 - Name: ''Function apps

    should have authentication enabled'''
  remediation: 'Remediate from Azure Portal

    1. Go to App Services or Function App.

    2. Click the name of a function app.

    3. Under Settings, click Authentication.

    4. If an identity provider is not configured:

    1. Click Add identity provider.

    2. Provide appropriate configuration for an identity provider and click Add.

    5. If App Service authentication is set to Disabled:

    1. Click Enable authentication.

    6. Repeat steps 1-5 for each function app requiring remediation.

    Remediate from Azure CLI

    For each function app requiring remediation, run the following command to enable

    authentication:

    az webapp auth update --resource-group <resource-group-name> --name

    <function-app-name> --enabled true

    Note: In order to access App Service authentication settings for an app using the

    Microsoft API, the Website Contributor permission at the subscription level is

    required. A custom role can be created instead of Website Contributor to provide

    more specific permissions and maintain the principle of least privileged access.'
  checks:
