- id: '2.10'
  title: Ensure App Service Environment has TLS cipher suite ordering configured
  scoring: scored
  profile:
  - Level 1
  description: 'App Service Environment supports changing the cipher suite from the default. The default set of ciphers is
    the same set that is used in the multi-tenant App Service. Changing the cipher suite is only possible with App Service
    Environment, the singletenant offering, not the multi-tenant offering, because changing it affects the entire App Service
    deployment. There are two cipher suites that are required for an App Service Environment: TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    and TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256. Additionally, you should include the following cipher suites, which are required
    for TLS 1.3: TLS_AES_256_GCM_SHA384 and TLS_AES_128_GCM_SHA256.'
  rationale: Configuring your App Service Environment to use only the ciphers it requires helps to keep the environment secure.
  impact: If incorrect values are set for the cipher suite that SChannel cannot understand, all TLS communication to your
    server might stop functioning.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/app-service/environment/app-serviceapp-service-environment-custom-settings
  - 2. https://learn.microsoft.com/en-us/cli/azure/appservice/ase
