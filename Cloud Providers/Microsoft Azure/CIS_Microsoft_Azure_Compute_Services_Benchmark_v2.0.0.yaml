- id: 2.4.7
  title: Ensure 'Minimum Inbound TLS Version' is set to '1.2' or higher
  scoring: scored
  profile:
  - Level 1
  description: The TLS (Transport Layer Security) protocol secures the transmission of data over the internet using standard
    encryption technology. Function app deployment slots use TLS 1.2 for the Minimum Inbound TLS Version by default and allow
    for the use of TLS versions 1.0, 1.1, and 1.3. NIST strongly suggests the use of TLS 1.2 and recommends the adoption of
    TLS 1.3.
  rationale: TLS 1.0 and 1.1 are outdated and vulnerable to security risks. Since TLS 1.2 and TLS 1.3 provide enhanced security
    and improved performance, it is highly recommended to use TLS 1.2 or higher whenever possible.
  impact: Using the latest TLS version may affect compatibility with clients and backend services.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/app-service/configure-ssl-bindings#howcan-i-change-the-minimum-tls-versions-for-the-app
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-dataprotection#dp-3-encrypt-sensitive-data-in-transit
