- id: '20.5'
  title: Ensure that 'Enable Data Access Authentication Mode' is 'Checked'
  scoring: scored
  profile:
  - Level 1
  description: Data Access Authentication Mode provides a method of uploading or exporting Virtual Machine Disks.
  rationale: Enabling data access authentication mode adds a layer of protection using an Entra ID role to further restrict
    users from creating and using Secure Access Signature (SAS) tokens for exporting a detached managed disk or virtual machine
    state. Users will need the Data operator for managed disk role within Entra ID in order to download a VHD or VM Guest
    state using a secure URL.
  impact: 'To apply this setting, the virtual machine to which the disk or disks are attached will need to be powered down
    and have its disk detached. Users without the Data operator for managed disk role within Entra ID will not be able to
    export VHD or VM guest state using the secure download URL. The following restrictions apply and must be considered when
    determining if this recommendation is appropriate for your environment: • VHDs can''t be uploaded to empty snapshots.
    • Azure Backup doesn''t currently support disks secured with Microsoft Entra ID. • Azure Site Recovery doesn''t currently
    support disks secured with Microsoft Entra ID.'
  references:
