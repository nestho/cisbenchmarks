- id: '20.1'
  title: Ensure Virtual Machines are utilizing Managed Disks
  scoring: scored
  profile:
  - Level 1
  description: 'Migrate blob-based VHDs to Managed Disks on Virtual Machines to exploit the default features of this configuration.
    The features include: 1. Default Disk Encryption 2. Resilience, as Microsoft will managed the disk storage and move around
    if underlying hardware goes faulty 3. Reduction of costs over storage accounts'
  rationale: Managed disks are by default encrypted on the underlying hardware, so no additional encryption is required for
    basic protection. It is available if additional encryption is required. Managed disks are by design more resilient that
    storage accounts. For ARM-deployed Virtual Machines, Azure Adviser will at some point recommend moving VHDs to managed
    disks both from a security and cost management perspective.
  impact: There are additional costs for managed disks based off of disk space allocated. When converting to managed disks,
    VMs will be powered off and back on.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/virtual-machines/windows/convertunmanaged-to-managed-disks
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-dataprotection#dp-4-enable-data-at-rest-encryption-by-default
