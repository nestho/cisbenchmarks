- id: '15.6'
  title: Ensure private DNS zones for private endpoints that connect to Batch accounts are configured.
  scoring: manual
  profile:
  - Level 2
  description: Private DNS zones for Azure Batch private endpoints provide secure internal name resolution, preventing public
    internet exposure. When a private endpoint is created for a Batch account, Azure requires a private DNS zone (privatelink..batch.azure.com)
    to map the Batch service’s domain name to a private IP address within your virtual network (VNet).
  rationale: To enable secure and private access to Azure Batch accounts, private DNS zones must be properly configured for
    private endpoints so as not to expose them publicly and allow for internal name resolution. Proper configuration of DNS
    provides assurance that DNS resolves to private IPs, reducing data exposure risk and support for security policy adherence.
    In the absence of proper DNS configuration, Batch services are open to connectivity failure, job interruption, or misconfigured
    public internet routing. Wellmeshed private DNS zones hold traffic within the virtual network as intended, as a Zero Trust
    architecture and regulatory standard would dictate. Organizations need to audit and automate the configurations for secure
    and stable Batch processing.
  impact: 'NOTE: This recommendation assumes that a Private DNS Zone already exists. If one has not yet been created for Batch
