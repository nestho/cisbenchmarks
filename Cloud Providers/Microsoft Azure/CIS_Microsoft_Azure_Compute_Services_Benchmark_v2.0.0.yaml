  scoring: scored
  profile:
  - Level 1
  description: This recommendation disables local authentication and ensures that a centralized identity provider is used.
  rationale: Identity and Authentication silos with stale or persistent keys and tokens can increase vulnerability and risk
    by preventing detection mechanisms from capturing anomalous activity and may not produce an auditable trail of evidence
    that can be used for pattern detection and forensic investigation. Centralized Identity providers such as Microsoft Entra
    ID are strongly preferred for all identity, authentication, authorization, and accountability (IAAA) systems and activities.
