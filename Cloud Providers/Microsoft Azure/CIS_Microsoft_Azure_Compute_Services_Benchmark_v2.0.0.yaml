    az monitor diagnostic-settings create \\\n --name \"<batch_logs_name>\" \\\n --resource $(az batch account show --name\
    \ <batch_account_name> --resourcegroup <resource_group_name> --query id -o tsv) \\\n --logs '[{\"category\": \"AuditLog\"\
    , \"enabled\": true}, {\"category\":\n\"ServiceLog\", \"enabled\": true}]' \\\n --workspace $(az monitor log-analytics\
