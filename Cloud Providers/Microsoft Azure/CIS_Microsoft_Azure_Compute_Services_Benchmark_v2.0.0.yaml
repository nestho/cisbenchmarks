    \ modes\n3. In the main window, click the Authentication Mode drop-down list, and review\nwhich options are checked.\n\
    Expected Output: Only Microsoft Entra ID should be checked.\nAudit from Azure CLI\nCheck Local Authentication Status for\
    \ Batch Accounts\naz batch account list \\\n--query \"[].{name:name, resourceGroup:resourceGroup,\nauthModes:allowedAuthenticationModes}\"\
