- id: '2.8'
  title: Ensure App Service Environment has internal encryption enabled
  scoring: scored
  profile:
  - Level 2
  description: The App Service Environment operates as a black box system where you cannot see the internal components or
    the communication within the system. To enable higher throughput, encryption is not enabled by default between internal
    components. The system is secure as the traffic is inaccessible to being monitored or accessed. However, if you have a
    compliance requirement that requires complete encryption of the data path from end to end, you can enable encryption of
    the complete data path with a clusterSetting.
  rationale: Setting InternalEncryption to true encrypts internal network traffic in your App Service Environment between
    the front ends and workers, encrypts the pagefile, and also encrypts the worker disks.
  impact: At the point that this setting becomes desirable, an architectural review to evaluate a move to Azure Confidential
    Computing should be considered. After the InternalEncryption clusterSetting is enabled, there can be an impact to your
    system performance and the additional resource demand will likely also increase the associated cost. When you make the
    change to enable InternalEncryption, your App Service Environment will be in an unstable state until the change is fully
    propagated. Complete propagation of the change can take a few hours to complete, depending on how many instances you have
    in your App Service Environment. Azure recommends that you do not enable InternalEncryption on an App Service Environment
    while it is in use. If you need to enable InternalEncryption on an actively used App Service Environment, Azure recommends
    that you divert traffic to a backup environment until the operation completes.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/app-service/environment/app-serviceapp-service-environment-custom-settings
  - 2. https://learn.microsoft.com/en-us/cli/azure/appservice/ase
  page_start: 248
