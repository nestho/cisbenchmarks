    o For a System Assigned identity, click the System Assigned tab then set

    status to On.

    o For User Assigned identities, click the User Assigned tab then click the

    Add button. Search for the required user managed identity, then click the

    Add button at the bottom of the window.

    Remediate from Azure CLI

    To assign Managed Identities to Container Instances by CLI, the Managed Identity will

