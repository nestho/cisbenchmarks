- id: '3.1'
  title: Ensure Private Virtual Networks are used for Container Instances
  scoring: manual
  profile:
  - Level 1
  description: Private Virtual Networks (vNets) ensure that services and hosts within the subscription environment are appropriately
    segmented in private subnets. Public IP addressing for container instances should be handled through a NAT gateway and/or
    Firewall. In addition to the use of a private vNet for container instances, ensure that a Network Security Group (NSG)
    is configured and applied to your container instance vNet. The NSG will need to be configured with inbound and outbound
    TCP/UDP traffic rules which reflect the needs of the services running in your container instance.
  rationale: Network segmentation reduces threat surface and limits potential lateral movement in the case of breach. Container
    instances with Public IP addresses present significant threat surface and should be avoided.
  impact: A well-architected Cloud network will require documentation and consideration for subnetting. The use of vNets and
    NSGs have a minimal impact on cost, but the use of Firewalls and public-facing gateways will increase that cost.
  references:
  - 1. https://learn.microsoft.com/en-us/security/benchmark/azure/baselines/containerinstances-security-baseline?toc=%2Fazure%2Fcontainerinstances%2FTOC.json
  - 2. https://learn.microsoft.com/en-us/azure/container-instances/container-instancesvnet
  page_start: 257
  audit_raw: 'Audit from Azure Portal

    1. Go to Container Instances.

    2. Select a named container instance.

    3. Click on Properties under the Settings section.

    4. Ensure the IP address property indicates (Private).

    5. Repeat these steps for each named container instance.

    Audit from Azure CLI

    Run the following command:

    az container list

    For each Container Instance, ensure "type": "Private" is indicated under the

    "ipAddress" section.'
