- id: 2.2.11
  title: Ensure incoming client certificates are enabled and required (if in use)
  scoring: scored
  profile:
  - Level 2
  description: Client certificates allow for the deployment slot to request a certificate for incoming requests. Only clients
    that have a valid certificate will be able to reach the deployment slot.
  rationale: The TLS mutual authentication technique in enterprise environments ensures the authenticity of clients to the
    server. If incoming client certificates are enabled, then only an authenticated client with valid certificates can access
    the deployment slot.
  impact: 'Utilizing and maintaining client certificates will require additional work to obtain and manage replacement and
    key rotation. NOTE: This recommendation cannot be implemented if following the recommendation titled "Ensure ''HTTP Version''
    is set to ''2.0'' (if in use)." This recommendation should only be considered for scenarios where HTTP versions prior
    to 2.0 are required for a deployment slot, and mutual certificate authentication is desired for validating clients.'
  references:
  - 1. https://learn.microsoft.com/en-us/security/benchmark/azure/security-controls-v3identity-management#im-4-authenticate-server-and-services
  - 2. https://learn.microsoft.com/en-gb/azure/app-service/app-service-web-configuretls-mutual-auth
