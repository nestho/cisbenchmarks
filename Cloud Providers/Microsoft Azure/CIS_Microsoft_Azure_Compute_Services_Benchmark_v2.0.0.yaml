- id: 2.3.4
  title: Ensure 'FTP state' is set to 'FTPS only' or 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: By default, App Service supports deployment over FTP. If FTP is essential for a deployment workflow, FTPS should
    be enforced for all function apps. If FTPS is not explicitly required, the recommended setting is Disabled.
  rationale: FTP is an unencrypted network protocol that transmits data—including passwords—in clear text. The use of this
    protocol can lead to both data and credential compromise and can present opportunities for exfiltration, persistence,
    and lateral movement.
  impact: Deployment workflows that rely on FTP or FTPS rather than WebDeploy or HTTPS endpoints may be affected.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/app-service/deploy-ftp
  - 2. https://learn.microsoft.com/en-us/azure/app-service/overview-security
