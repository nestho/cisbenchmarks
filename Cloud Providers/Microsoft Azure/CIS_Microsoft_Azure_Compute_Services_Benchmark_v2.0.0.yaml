- id: 2.4.3
  title: Ensure 'Basic Authentication Publishing Credentials' are 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Basic Authentication Publishing Credentials provides the ability to publish—or deploy to—a function app deployment
    slot without a centralized Identity Provider. For a more effective, capable, and secure solution for Identity, Authentication,
    Authorization, and Accountability, a centralized Identity Provider such as Entra ID is strongly advised. This recommendation
    applies to function apps using the Consumption, Premium, or Dedicated (App Service) plans, which support deployment slots.
  rationale: Basic Authentication introduces an identity silo for privileged access to a resource and produces logging which
    may not provide a full chain of accountability. This can be exploited in numerous ways and represents a significant vulnerability
    and attack vector.
  impact: 'Disabling ''Basic Auth Publishing Credentials'' will prevent the following deployment methods from working: FTP
    Basic Auth Publishing Credentials: • FTP • FTPS SCM Basic Auth Publishing Credentials: • Local Git • GitHub • Azure Repos
    • Bitbucket • Visual Studio (Version 17.12 and earlier) If this recommendation cannot be implemented because one of the
    above listed deployment methods is necessary and cannot be adapted, compensating controls (e.g. using FTPS Only and disabling
    only "SCM Basic Auth Publishing Credentials") are recommended to reduce potential attack surface. An Identity Provider
    that can be used by the function app deployment slot for authenticating users is required.'
  references:
