- id: '15.7'
  title: Ensure Diagnostics settings logs for Batch accounts are enabled
  scoring: scored
  profile:
  - Level 1
  description: Azure Batch resource logs give important operational data such as job scheduling, pool management, and node
    communication. Having these logs enabled is necessary for monitoring, troubleshooting, and compliance auditing.
  rationale: 'Enable resource logging for: • Operational Visibility — Keep track of any job failures, node allocation issues,
    or API activities. • Security Compliance — Needed for audits (ISO 27001, SOC 2, GDPR). • Forensic Investigations — Acts
    as evidence in case of security incidents or performance bottlenecks.'
  impact: Costs for monitoring varies with Log Volume and storage destination. Not every resource needs to have logging enabled.
    It is important to determine the security classification of the data being processed by the given resource and adjust
    the logging based on which events need to be tracked. This is typically determined by governance and compliance requirements.
    Retention is not addressed in this recommendation and should be considered depending on the needs of your organization.
    A 30-day minimum is recommended and longer may be required depending on the security or compliance framework your organization
    is following.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/batch/monitoring-overview#diagnosticlogs
  - 2. https://learn.microsoft.com/en-us/azure/batch/batch-diagnostics#service-logs
