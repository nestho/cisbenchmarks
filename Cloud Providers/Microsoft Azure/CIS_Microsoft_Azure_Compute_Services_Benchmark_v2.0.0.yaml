- id: 2.1.7
  title: Ensure 'HTTPS Only' is set to 'On'
  scoring: scored
  profile:
  - Level 1
  description: Azure App Service allows apps to run under both HTTP and HTTPS by default. Apps can be accessed by anyone using
    non-secure HTTP links by default. Non-secure HTTP requests can be restricted and all HTTP requests redirected to the secure
    HTTPS port. It is recommended to enforce HTTPS-only traffic.
  rationale: Enabling HTTPS-only traffic will redirect all non-secure HTTP requests to HTTPS ports. HTTPS uses the TLS/SSL
    protocol to provide a secure connection which is both encrypted and authenticated. It is therefore important to support
    HTTPS for the security benefits.
  impact: When it is enabled, every incoming HTTP request is redirected to the HTTPS port. This means an extra level of security
    will be added to the HTTP requests made to the app.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/app-service/overview-security#https-andcertificates
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/security-controls-v3data-protection#dp-3-encrypt-sensitive-data-in-transit
