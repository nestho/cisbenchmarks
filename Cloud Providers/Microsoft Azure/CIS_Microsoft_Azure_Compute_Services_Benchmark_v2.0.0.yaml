- id: 2.4.8
  title: Ensure end-to-end TLS encryption is enabled
  scoring: scored
  profile:
  - Level 1
  description: End-to-end (E2E) TLS encryption ensures that front-end to worker communication within function app deployment
    slots is encrypted using TLS. Without this feature, while incoming HTTPS requests are encrypted to the front ends, the
    traffic from front ends to workers running the application workloads would travel unencrypted inside Azure’s infrastructure.
    This recommendation applies to function apps using the Consumption, Premium, or Dedicated (App Service) plans, which support
    deployment slots.
  rationale: 'E2E TLS helps ensure full encryption of traffic between: • Clients and front ends • Front ends and worker processes
    hosting the application'
  impact: Enabling end-to-end TLS encryption may introduce minimal latency and require additional configuration of certificates
    and HTTPS settings to ensure compatibility.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/app-service/overview-tls#end-to-end-tlsencryption
  - 2. https://learn.microsoft.com/en-us/cli/azure/functionapp
