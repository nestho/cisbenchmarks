- id: '4.1'
  title: Ensure SSL is configured for CycleCloud
  scoring: manual
  profile:
  - Level 1
  description: The use of SSL ensures that data in transit to and from the Azure CycleCloud server is encrypted.
  rationale: Encryption of data in transit provides integrity and confidentiality to that data. If unencrypted data is intercepted
    in transit it is highly vulnerable to exposure and exploitation.
  impact: If using self-signed certificates, users accessing CycleCloud will receive a warning that the SSL certificate is
    untrusted; they will need to accept the certificate to access the web console. Depending on your environment and use of
    CycleCloud, you may wish to procure a signed and trusted certificate from a Certificate Authority.
  references:
