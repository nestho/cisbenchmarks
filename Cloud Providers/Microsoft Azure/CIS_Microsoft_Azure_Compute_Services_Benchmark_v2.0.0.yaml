- id: 2.4.16
  title: Ensure cross-origin resource sharing does not allow all origins
  scoring: scored
  profile:
  - Level 2
  description: Cross-origin resource sharing (CORS) is a security feature that controls how applications interact with resources
    hosted on different domains. This recommendation applies to function apps using the Consumption, Premium, or Dedicated
    (App Service) plans, which support deployment slots.
  rationale: Restrict CORS to only trusted origins to help enforce proper access control and reduce exposure to malicious
    cross-origin requests.
  impact: Configuration is required to ensure that the appropriate origins have access. Setting up a proper CORS policy can
    be fairly complex and an incorrect setting could permit Cross-Site Request Forgery (CSRF). The "caveat" is that if the
    app being deployed is a PUBLIC API, a wildcard "*" CORS policy is absolutely necessary.
  references:
  - 1. https://learn.microsoft.com/en-gb/azure/app-service/app-service-web-tutorialrest-api
  - 2. https://learn.microsoft.com/en-us/cli/azure/functionapp
  page_start: 236
  audit_raw: 'Audit from Azure Portal

    1. Go to App Service or Function App.

    2. Click the name of a function app.

    3. Under Deployment, click Deployment slots.

    4. Click the name of deployment slot.

    5. Under API, click CORS.

    6. Ensure Allowed Origins does not include *.

    7. Repeat steps 1-6 for each function app and deployment slot.

    Audit from Azure CLI

    Run the following command to list function apps:

    az functionapp list

    For each function app, run the following command to list deployment slots:

    az functionapp deployment slot list --resource-group <resource-group-name> --

    name <function-app-name>

    For each deployment slot, run the following command to get the CORS allowed origins

    setting:

    az resource show --name web --resource-group <resource-group-name> --

    namespace Microsoft.Web --resource-type config --parent sites/<function-appname>/slots/<deployment-slot-name> --query
    properties.cors.allowedOrigins

