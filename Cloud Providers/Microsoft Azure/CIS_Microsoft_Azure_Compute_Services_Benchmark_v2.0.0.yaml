- id: '2.5'
  title: Ensure Azure Key Vaults are Used to Store Secrets
  scoring: manual
  profile:
  - Level 2
  description: Azure Key Vault will store multiple types of sensitive information such as encryption keys, certificate thumbprints,
    and Managed Identity Credentials. Access to these 'Secrets' can be controlled through granular permissions.
  rationale: The credentials given to an application have permissions to create, delete, or modify data stored within the
    systems they access. If these credentials are stored within the application itself, anyone with access to the application
    or a copy of the code has access to them. Storing within Azure Key Vault as secrets increases security by controlling
    access. This also allows for updates of the credentials without redeploying the entire application.
  impact: Integrating references to secrets within the key vault are required to be specifically integrated within the application
    code. This will require additional configuration to be made during the writing of an application, or refactoring of an
    already written one. There are also additional costs that are charged per 10000 requests to the Key Vault.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/app-service/app-service-key-vaultreferences
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-identitymanagement#im-3-manage-application-identities-securely-and-automatically
  page_start: 239
  audit_raw: 'Audit from Azure Portal

    1. Login to Azure Portal.

    2. In the expandable menu on the left go to Key Vaults.

    3. View the Key Vaults listed.

    Audit from Azure CLI

    To list key vaults and/or HSMs within a subscription run the following command:

    az keyvault list [--resource-type] --subscription

    <id_or_name_of_target_subscription>

    --resource-type could be either __vault__ or __hsm__ . When parameter is

    missing all types of vaults will be listed.

    To list the secrets within a target key vaults run the following command:

