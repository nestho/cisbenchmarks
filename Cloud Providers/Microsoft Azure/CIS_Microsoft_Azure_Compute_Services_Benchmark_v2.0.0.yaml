- id: 2.3.9
  title: Ensure 'Remote debugging' is set to 'Off'
  scoring: scored
  profile:
  - Level 1
  description: Remote debugging allows a function app to be debugged in real-time directly in the Azure environment. When
    remote debugging is enabled, it opens a communication channel that could potentially be exploited by unauthorized users
    if not properly secured.
  rationale: Disabling remote debugging on a function app is primarily about enhancing security. Remote debugging opens a
    communication channel that can be exploited by attackers. By disabling it, you reduce the number of potential entry points
    for unauthorized access. If remote debugging is enabled without proper access controls, it can allow unauthorized users
    to connect to your function app, potentially leading to data breaches or malicious code execution. During a remote debugging
    session, sensitive information might be exposed. Disabling remote debugging helps ensure that such data remains secure.
    This minimizes the use of remote access tools to reduce risk.
  impact: You will not be able to connect to your function app from a remote location to diagnose and fix issues in real-time.
    You will not be able to step through code, set breakpoints, or inspect variables and the call stack while the function
    app is running on the server. Remote debugging is particularly useful for diagnosing issues that only occur in the production
    environment. Without it, you will need to rely on logs and other diagnostic tools.
  references:
  - 1. https://learn.microsoft.com/en-us/visualstudio/debugger/remote-debuggingazure-app-service
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-posturevulnerability-management#pv-2-audit-and-enforce-secure-configurations
