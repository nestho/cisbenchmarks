- id: 2.1.5
  title: Ensure 'FTP State' is set to 'FTPS only' or 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: By default, App Service supports deployment over FTP. If FTP is essential for a deployment workflow, FTPS should
    be enforced for all App Service apps. If FTPS is not explicitly required, the recommended setting is Disabled.
  rationale: FTP is an unencrypted network protocol that transmits data—including passwords—in clear text. The use of this
    protocol can lead to both data and credential compromise and can present opportunities for exfiltration, persistence,
    and lateral movement.
  impact: Deployment workflows that rely on FTP or FTPS rather than WebDeploy or HTTPS endpoints may be affected.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/app-service/deploy-ftp
  - 2. https://learn.microsoft.com/en-us/azure/app-service/overview-security
  page_start: 40
  audit_raw: "Audit from Azure Portal\n1. Go to the Azure Portal\n2. Select App Services\n3. Click on an app\n4. Select Settings\
    \ and then Configuration\n5. Under General Settings, for the Platform Settings, the FTP state should\nnot be set to All\
    \ allowed\nAudit from Azure CLI\nList webapps to obtain the ids.\naz webapp list\nList the publish profiles to obtain\
    \ the username, password, and ftp server url.\naz webapp deployment list-publishing-profiles --ids <ids>\n{\n \"publishUrl\"\
    : <URL_FOR_WEB_APP>,\n \"userName\": <USER_NAME>,\n \"userPWD\": <USER_PASSWORD>,\n}\nAudit from PowerShell\nList all\
    \ Web Apps:\nGet-AzWebApp\nFor each app:\nGet-AzWebApp -ResourceGroupName <resource group name> -Name <app name> |\nSelect-Object\
    \ -ExpandProperty SiteConfig\nIn the output, look for the value of FtpsState. If its value is AllAllowed the setting is\
    \ out\nof compliance. Any other value is considered in compliance with this check.\nAudit from Azure Policy\nIf referencing\
    \ a digital copy of this Benchmark, clicking a Policy ID will open a link to the\nassociated Policy definition in Azure.\n\
    If referencing a printed copy, you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: 4d24b6d4-5e53-4a4f-a7f4-618fa573ee4b - Name: 'App Service apps\nshould require FTPS only'"
  remediation: 'Remediate from Azure Portal

    1. Go to the Azure Portal

    2. Select App Services

    3. Click on an app

    4. Select Settings and then Configuration

    5. Under General Settings, for the Platform Settings, the FTP state should

    be set to Disabled or FTPS Only

    Remediate from Azure CLI

    For each out of compliance application, run the following choosing either ''disabled'' or

    ''FtpsOnly'' as appropriate:

    az webapp config set --resource-group <resource group name> --name <app name>

    --ftps-state [disabled|FtpsOnly]

    Remediate from PowerShell

    For each out of compliance application, run the following:

    Set-AzWebApp -ResourceGroupName <resource group name> -Name <app name> -

    FtpsState <Disabled or FtpsOnly>'
  checks:
  - type: manual_review
    info: "Audit from Azure Portal\n1. Go to the Azure Portal\n2. Select App Services\n3. Click on an app\n4. Select Settings\
      \ and then Configuration\n5. Under General Settings, for the Platform Settings, the FTP state should\nnot be set to\
      \ All allowed\nAudit from Azure CLI\nList webapps to obtain the ids.\naz webapp list\nList the publish profiles to obtain\
      \ the username, password, and ftp server url.\naz webapp deployment list-publishing-profiles --ids <ids>\n{\n \"publishUrl\"\
      : <URL_FOR_WEB_APP>,\n \"userName\": <USER_NAME"
    severity: medium
- id: 2.1.6
  title: Ensure 'HTTP version' is set to '2.0' (if in use)
  scoring: scored
  profile:
  - Level 1
  description: Periodically, newer versions are released for HTTP, either due to security flaws or to include additional functionalities.
    Using the latest HTTP version allows apps to take advantage of security fixes, if any, and/or new functionalities of the
    newer version.
  rationale: Newer versions may contain security enhancements and additional functionalities. Using the latest version is
    recommended in order to take advantage of enhancements and new capabilities. With each software installation, organizations
    need to determine if a given update meets their requirements. They must also verify the compatibility and support provided
    for any additional software against the update revision that is selected. HTTP 2.0 has additional performance improvements
    for the head-of-line blocking problem of the old HTTP version, header compression, and request prioritization. HTTP 2.0
    no longer supports HTTP 1.1's chunked transfer encoding mechanism, as it provides its own, more efficient mechanisms for
    data streaming.
  impact: 'Most modern browsers support the HTTP/2 protocol over TLS only, while non-encrypted traffic continues to use HTTP/1.1.
    To ensure that client browsers connect to your app with HTTP/2, either purchase an App Service Certificate for your app''s
    custom domain or bind a third-party certificate. NOTE: HTTP/2 cannot be used in tandem with mutual authentication or client
    certificates.'
  references:
  - 1. https://learn.microsoft.com/en-us/azure/app-service/configure-common#generalsettings
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-posturevulnerability-management#pv-3-define-and-establish-secure-configurations-forcompute-resources
  page_start: 43
  audit_raw: 'Audit from Azure Portal

    1. Go to App Services.

    2. Click the name of an app.

    3. Under Settings, click Configuration.

    4. In the General settings pane, under Platform settings, ensure that HTTP

    version is set to 2.0.

    5. Repeat steps 1-4 for each app.

    Audit from Azure CLI

    Run the following command to list apps:

    az webapp list

    For each app, run the following command to get the http20Enabled setting:

    az webapp config show --resource-group <resource-group-name> --name <appname> --query http20Enabled

    Ensure that true is returned.

    Audit from PowerShell

    Run the following command to list apps:

    Get-AzWebApp

    Run the following command to get the app in a resource group with a given name:

    $app = Get-AzWebApp -ResourceGroupName <resource-group-name> -Name <app-name>

    Run the following command to get the Http20Enabled setting:

    $app.SiteConfig.Http20Enabled

    Ensure that True is returned.

    Repeat for each app.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 8c122334-9d20-4eb8-89ea-ac9a705b74ae - Name: ''App Service

    apps should use latest ''HTTP Version'''''
  remediation: 'Remediate from Azure Portal

    1. Go to App Services.

    2. Click the name of an app.

    3. Under Settings, click Configuration.

    4. In the General settings pane, under Platform settings, set HTTP version

    to 2.0.

    5. Click Save.

    6. Click Continue.

    7. Repeat steps 1-6 for each app requiring remediation.

    Remediate from Azure CLI

    For each app requiring remediation, run the following command to enable

    http20Enabled:

    az webapp config set --resource-group <resource-group-name> --name <app-name>

    --http20-enabled true'
