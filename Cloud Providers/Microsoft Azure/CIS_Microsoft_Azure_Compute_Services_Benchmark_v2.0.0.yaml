  title: Ensure app is integrated with a virtual network
  scoring: scored
  profile:
  - Level 1
  description: Integrate App Service apps with a virtual network to enable access to resources in or through a non-internet-routable
    virtual network.
  rationale: Integrate App Service apps with a virtual network for increased security and control.
