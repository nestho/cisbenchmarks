- id: '20.2'
  title: Ensure that 'OS and Data' disks are encrypted with Customer Managed Key (CMK)
  scoring: scored
  profile:
  - Level 2
  description: Ensure that OS disks (boot volumes) and data disks (non-boot volumes) are encrypted with CMK (Customer Managed
    Keys). Customer Managed keys can be either ADE or Server Side Encryption (SSE).
  rationale: Encrypting the IaaS VM's OS disk (boot volume) and Data disks (non-boot volume) ensures that the entire content
    is fully unrecoverable without a key, thus protecting the volume from unwanted reads. PMK (Platform Managed Keys) are
    enabled by default in Azure-managed disks and allow encryption at rest. CMK is recommended because it gives the customer
    the option to control which specific keys are used for the encryption and decryption of the disk. The customer can then
    change keys and increase security by disabling them instead of relying on the PMK key that remains unchanging. There is
    also the option to increase security further by using automatically rotating keys so that access to disk is ensured to
    be limited. Organizations should evaluate what their security requirements are, however, for the data stored on the disk.
    For high-risk data using CMK is a must, as it provides extra steps of security. If the data is low risk, PMK is enabled
    by default and provides sufficient data security.
  impact: 'Using CMK/BYOK will entail additional management of keys. NOTE: You must have your key vault set up to utilize
    this.'
  references:
  - 1. https://docs.microsoft.com/azure/security/fundamentals/azure-disk-encryptionvms-vmss
  - 2. https://docs.microsoft.com/en-us/azure/security-center/security-center-diskencryption?toc=%2fazure%2fsecurity%2ftoc.json
  page_start: 311
  audit_raw: 'Audit from Azure Portal

    1. Go to Virtual machines.

    2. For each virtual machine, go to Settings.

    3. Click on Disks.

    4. Ensure that the OS disk and Data disks have encryption set to CMK.

    Audit from PowerShell

    $ResourceGroupName="yourResourceGroupName"

    $DiskName="yourDiskName"

    $disk=Get-AzDisk -ResourceGroupName $ResourceGroupName -DiskName $DiskName

    $disk.Encryption.Type

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: ca88aadc-6e2b-416c-9de2-5a0f01d1693f - Name: ''Linux virtual

    machines should enable Azure Disk Encryption or EncryptionAtHost''

    • Policy ID: 3dc5edcd-002d-444c-b216-e123bbfa37c0 - Name: ''Windows virtual

    machines should enable Azure Disk Encryption or EncryptionAtHost'''
  remediation: "Remediate from Azure Portal\nNote: Disks must be detached from VMs to have encryption changed.\n1. Go to Virtual\
    \ machines\n2. For each virtual machine, go to Settings\n3. Click on Disks\n4. Click the ellipsis (...), then click Detach\
    \ to detach the disk from the VM\n5. Now search for Disks and locate the unattached disk\n6. Click the disk then select\
    \ Encryption\n7. Change your encryption type, then select your encryption set\n8. Click Save\n9. Go back to the VM and\
    \ re-attach the disk\nRemediate from PowerShell\n$KVRGname = 'MyKeyVaultResourceGroup';\n $VMRGName = 'MyVirtualMachineResourceGroup';\n\
    \ $vmName = 'MySecureVM';\n $KeyVaultName = 'MySecureVault';\n $KeyVault = Get-AzKeyVault -VaultName $KeyVaultName -ResourceGroupName\n\
    $KVRGname;\n $diskEncryptionKeyVaultUrl = $KeyVault.VaultUri;\n $KeyVaultResourceId = $KeyVault.ResourceId;\n Set-AzVMDiskEncryptionExtension\
    \ -ResourceGroupName $VMRGname -VMName $vmName\n-DiskEncryptionKeyVaultUrl $diskEncryptionKeyVaultUrl -\nDiskEncryptionKeyVaultId\
    \ $KeyVaultResourceId;\nNOTE:\nDuring encryption it is likely that a reboot will be required. It may take up to 15 minutes\n\
    to complete the process.\nFor Linux machines you may need to set the -skipVmBackup parameter."
