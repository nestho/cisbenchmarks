- id: '20.8'
  title: '[Legacy] Ensure that VHDs are Encrypted'
  scoring: manual
  profile:
  - Level 2
  description: 'NOTE: This is a legacy recommendation. Managed Disks are encrypted by default and recommended for all new
    VM implementations. VHD (Virtual Hard Disks) are stored in blob storage and are the old-style disks that were attached
    to Virtual Machines. The blob VHD was then leased to the VM. By default, storage accounts are not encrypted, and Microsoft
    Defender will then recommend that the OS disks should be encrypted. Storage accounts can be encrypted as a whole using
    PMK or CMK. This should be turned on for storage accounts containing VHDs.'
  rationale: While it is recommended to use Managed Disks which are encrypted by default, "legacy" VHDs may exist for a variety
    of reasons and may need to remain in VHD format. VHDs are not encrypted by default, so this recommendation intends to
    address the security of these disks. In these niche cases, VHDs should be encrypted using the procedures in this recommendation
    to encrypt and protect the data content. If a virtual machine is using a VHD and can be converted to a managed disk, instructions
    for this procedure can be found in the resources section of this recommendation under the title "Convert VHD to Managed
    Disk."
  impact: Depending on how the encryption is implemented will change the size of the impact. If provider-managed keys(PMK)
    are utilized, the impact is relatively low, but processes need to be put in place to regularly rotate the keys. If Customer-managed
    keys(CMK) are utilized, a key management process needs to be implemented to store and manage key rotation, thus the impact
    is medium to high depending on user maturity with key management.
  references:
  - '1. CLI: https://docs.microsoft.com/en-us/azure/virtual-machines/windows/diskencryption-cli-quickstart'
  - '2. Powershell: https://docs.microsoft.com/en-us/azure/virtualmachines/windows/disk-encryption-powershell-quickstart'
  page_start: 329
  audit_raw: 'Audit from Azure CLI

    For each virtual machine identify if the VM is using a legacy VHD by reviewing the VHD

    parameter in the output of the following command. The VHD parameter will contain the

    Storage Account name used for the VHD.

    az vm show --name <MyVM> --resource-group <MyResourceGroup>

    Next, identify if the storage account from the VHD parameter is encrypted by reviewing

    the encryption --> services --> blob --> enabled within the output of the following

    command and make sure its value is True.

    az storage account show --name <storage account name> --resource-group

    <resource group>

    Audit from PowerShell:

    Determine whether the VM is using a VHD for the OS Disk and any Data disks.

    $virtualMachine = Get-AzVM --Name <vm name> --ResourceGroup <resource group

    name> |Select-Object -ExpandProperty StorageProfile

    $virtualMachine.OsDisk

    $virtualMachine.DataDisks

    Next, use the value from VHD to see if the storage blob holding the VHD is encrypted.

    $storageAccount = Get-AzStorageAccount -Name <storage account name from VHD

    setting> -ResourceGroupName <resource group name>

    $storageAccount.Encryption.Services.Blob

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 702dd420-7fcc-42c5-afe8-4026edd20fe0 - Name: ''OS and data disks

    should be encrypted with a customer-managed key'''
  remediation: 'Remediate from Azure Portal

    1. Navigate to the storage account that you wish to encrypt

    2. Select encryption

    3. Select the encryption type that you wish to use

    If you wish to use a Microsoft-managed key (the default), you can save at this point and

    encryption will be applied to the account.

    If you select Customer-managed keys, it will ask for the location of the key (The default

    is an Azure Key Vault) and the key name.

    Once these are captured, save the configuration and the account will be encrypted

    using the provided key.

    Remediate from Azure CLI:

    Create the Key Vault

    az keyvault create --name <name> --resource-group <resourceGroup> --location

    <location> --enabled-for-disk-encryption

    Encrypt the disk and store the key in Key Vault

    az vm encryption enable -g <resourceGroup> --name <name> --disk-encryptionkeyvault myKV

    Remediate from PowerShell

    This process uses a Key Vault to store the keys

    Create the Key Vault

    New-AzKeyvault -name <name> -ResourceGroupName <resourceGroup> -Location

    <location> -EnabledForDiskEncryption

    Encrypt the disk and store the key in Key Vault

    $KeyVault = Get-AzKeyVault -VaultName <name> -ResourceGroupName

    <resourceGroup>

    Set-AzVMDiskEncryptionExtension -ResourceGroupName <resourceGroup> -VMName

    <name> -DiskEncryptionKeyVaultUrl $KeyVault.VaultUri -

    DiskEncryptionKeyVaultId $KeyVault.ResourceId'
  checks:
  - type: manual_review
    info: 'Audit from Azure CLI

      For each virtual machine identify if the VM is using a legacy VHD by reviewing the VHD

      parameter in the output of the following command. The VHD parameter will contain the

      Storage Account name used for the VHD.

      az vm show --name <MyVM> --resource-group <MyResourceGroup>

      Next, identify if the storage account from the VHD parameter is encrypted by reviewing

      the encryption --> services --> blob --> enabled within the output of the following

      command and make sure its value is Tr'
    severity: medium
- id: '20.9'
  title: Ensure only MFA enabled identities can access privileged Virtual Machine
  scoring: manual
  profile:
  - Level 2
  description: Verify identities without MFA that can log in to a privileged virtual machine using separate login credentials.
    An adversary can leverage the access to move laterally and perform actions with the virtual machine's managed identity.
    Make sure the virtual machine only has necessary permissions, and revoke the admin-level permissions according to the
    least privileges principal
  rationale: Integrating multi-factor authentication (MFA) as part of the organizational policy can greatly reduce the risk
    of an identity gaining control of valid credentials that may be used for additional tactics such as initial access, lateral
    movement, and collecting information. MFA can also be used to restrict access to cloud resources and APIs. An Adversary
    may log into accessible cloud services within a compromised environment using Valid Accounts that are synchronized to
    move laterally and perform actions with the virtual machine's managed identity. The adversary may then perform management
    actions or access cloud-hosted resources as the logged-on managed identity.
  impact: This recommendation requires the Entra ID P2 license to implement. Ensure that identities that are provisioned to
    a virtual machine utilizes an RBAC/ABAC group and is allocated a role using Azure PIM, and the Role settings require MFA
    or use another third-party PAM solution for accessing Virtual Machines.
  references: []
  page_start: 332
  audit_raw: 'Audit from Azure Portal

    1. Log in to the Azure portal.

    2. Select the Subscription, then click on Access control (IAM).

    3. Click Role : All and click All to display the drop-down menu.

    4. Type Virtual Machine Administrator Login and select Virtual Machine

    Administrator Login.

    5. Review the list of identities that have been assigned the Virtual Machine

    Administrator Login role.

    6. Go to Microsoft Entra ID.

    7. For Per-user MFA:

    1. Under Manage, click Users.

    2. Click Per-user MFA.

    3. Ensure that none of the identities assigned the Virtual Machine

    Administrator Login role from step 4 have Status set to disabled.

    8. For Conditional Access:

    1. Under Manage, click Security.

    2. Under Protect, click Conditional Access.

    3. Ensure that none of the identities assigned the Virtual Machine

    Administrator Login role from step 4 are exempt from a Conditional

    Access policy requiring MFA for all users.'
  remediation: 'Remediate from Azure Portal

    1. Log in to the Azure portal.

    2. This can be remediated by enabling MFA for user, Removing user access or

    Reducing access of managed identities attached to virtual machines.

    • Case I : Enable MFA for users having access on virtual machines.

    1. Go to Microsoft Entra ID.

    2. For Per-user MFA:

    1. Under Manage, click Users.

    2. Click Per-user MFA.

    3. For each user requiring remediation, check the box next to their

    name.

    4. Click Enable MFA.

    5. Click Enable.

    3. For Conditional Access:

    1. Under Manage, click Security.

    2. Under Protect, click Conditional Access.

    3. Update the Conditional Access policy requiring MFA for all users,

    removing each user requiring remediation from the Exclude list.

    • Case II : Removing user access on a virtual machine.

    1. Select the Subscription, then click on Access control (IAM).

    2. Select Role assignments and search for Virtual Machine

    Administrator Login or Virtual Machine User Login or any role

    that provides access to log into virtual machines.

    3. Click on Role Name, Select Assignments, and remove identities with no

    MFA configured.

    • Case III : Reducing access of managed identities attached to virtual machines.

    1. Select the Subscription, then click on Access control (IAM).

    2. Select Role Assignments from the top menu and apply filters on

    Assignment type as Privileged administrator roles and Type as

    Virtual Machines.

    3. Click on Role Name, Select Assignments, and remove identities access

    make sure this follows the least privileges principal.'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Log in to the Azure portal.

