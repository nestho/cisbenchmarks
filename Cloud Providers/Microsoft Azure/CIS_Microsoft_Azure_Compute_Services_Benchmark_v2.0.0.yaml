- id: '15.2'
  title: Ensure Batch pools disk encryption is set enabled
  scoring: scored
  profile:
  - Level 1
  description: Azure Batch pools must have disk encryption enabled to protect data at rest on both OS and temporary disks,
    using Azure-managed encryption keys by default.
  rationale: Enabling disk encryption meets compliance requirements, follows security best practices, and safeguards against
    unauthorized access to cached data and task outputs stored on VM disks.
  impact: This ensures automatic encryption with minimal performance impact, though it requires pool recreation and is unsupported
    on Basic A-series VMs.
  references:
