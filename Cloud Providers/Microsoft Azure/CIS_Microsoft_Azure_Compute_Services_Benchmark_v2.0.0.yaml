    2. Click the name of a function app.

    3. Under Deployment, click Deployment slots.

    4. Click the name of a deployment slot.

    5. Under Settings, click Configuration.

    6. In the General settings pane, for a Stack of Python, set the Python Version

    to a currently supported release.

    7. Click Save.

    8. Click Continue.

    9. Repeat steps 1-8 for each function app and deployment slot requiring

    remediation.

    Remediate from Azure CLI

    Run the following command to list supported runtimes:

    az functionapp list-runtimes

    For each deployment slot requiring remediation, run the following command with the

