    • Policy ID: 22730e10-96f6-4aac-ad84-9383d35b5917 - Name: ''Management

    ports should be closed on your virtual machines'''
  remediation: 'Where RDP is not explicitly required and narrowly configured for resources attached to

    the Network Security Group, Internet-level access to your Azure resources should be

    restricted or eliminated.

