- id: 5.2.8
  title: '[LEGACY] Ensure ''Infrastructure double encryption'' for PostgreSQL single server is ''Enabled'''
  scoring: scored
  profile:
  - Level 1
  description: 'Azure Database for PostgreSQL servers should be created with ''infrastructure double encryption'' enabled.
    NOTE: This recommendation currently only applies to Single Server, not Flexible Server. See additional information below
    for details about the planned retirement of Azure PostgreSQL Single Server.'
  rationale: If Double Encryption is enabled, another layer of encryption is implemented at the hardware level before the
    storage or network level. Information will be encrypted before it is even accessed, preventing both interception of data
    in motion if the network layer encryption is broken and data at rest in system resources such as memory or processor cache.
    Encryption will also be in place for any backups taken of the database, so the key will secure access the data in all
    forms. For the most secure implementation of key based encryption, it is recommended to use a Customer Managed asymmetric
    RSA 2048 Key in Azure Key Vault.
  impact: The read and write speeds to the database will be impacted if both default encryption and Infrastructure Encryption
    are checked, as a secondary form of encryption requires more resource overhead for the cryptography of information. This
    cost is justified for information security. Customer managed keys are recommended for the most secure implementation,
    leading to overhead of key management. The key will also need to be backed up in a secure location, as loss of the key
    will mean loss of the information in the database.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/postgresql/howto-double-encryption
  - 2. https://docs.microsoft.com/en-us/azure/postgresql/concepts-infrastructuredouble-encryption
  page_start: 339
  audit_raw: 'Audit from Azure Portal

    1. From Azure Home, click on more services.

