- id: '4.3'
  title: Ensure that 'Enable key rotation reminders' is enabled for each Storage Account
  scoring: manual
  profile:
  - Level 1
  description: Access Keys authenticate application access requests to data contained in Storage Accounts. A periodic rotation
    of these keys is recommended to ensure that potentially compromised keys cannot result in a long-term exploitable credential.
    The "Rotation Reminder" is an automatic reminder feature for a manual procedure.
  rationale: Reminders such as those generated by this recommendation will help maintain a regular and healthy cadence for
    activities which improve the overall efficacy of a security program. Cryptographic key rotation periods will vary depending
    on your organization's security requirements and the type of data which is being stored in the Storage Account. For example,
    PCI DSS mandates that cryptographic keys be replaced or rotated 'regularly,' and advises that keys for static data stores
    be rotated every 'few months.' For the purposes of this recommendation, 90 days will prescribed for the reminder. Review
    and adjustment of the 90 day period is recommended, and may even be necessary. Your organization's security requirements
    should dictate the appropriate setting.
  impact: This recommendation only creates a periodic reminder to regenerate access keys. Regenerating access keys can affect
    services in Azure as well as the organization's applications that are dependent on the storage account. All clients that
    use the access key to access the storage account must be updated to use the new key.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/storage-create-storageaccount#regenerate-storage-access-keys
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-privilegedaccess#pa-1-separate-and-limit-highly-privilegedadministrative-users
  page_start: 247
  audit_raw: 'Audit from Azure Portal

    1. Go to Storage Accounts

    2. For each Storage Account, under Security + networking, go to Access keys

    3. If the button Edit rotation reminder is displayed, the Storage Account is

    compliant. Click Edit rotation reminder and review the Remind me every

    field for a desirable periodic setting that fits your security program''s needs. If the

    button Set rotation reminder is displayed, the Storage Account is not

    compliant.

    Audit from Powershell

    $rgName = <resource group name for the storage>

    $accountName = <storage account name>

    $account = Get-AzStorageAccount -ResourceGroupName $rgName -Name $accountName

    Write-Output $accountName ->

    Write-Output "Expiration Reminder set to:

    $($account.KeyPolicy.KeyExpirationPeriodInDays) Days"

    Write-Output "Key1 Last Rotated:

    $($account.KeyCreationTime.Key1.ToShortDateString())"

    Write-Output "Key2 Last Rotated:

    $($account.KeyCreationTime.Key2.ToShortDateString())"

    Key rotation is recommended if the creation date for any key is empty.

    If the reminder is set, the period in days will be returned. The recommended period is 90

    days.'
  remediation: "Remediate from Azure Portal\n1. Go to Storage Accounts\n2. For each Storage Account that is not compliant,\
    \ under Security +\nnetworking, go to Access keys\n3. Click Set rotation reminder\n4. Check Enable key rotation reminders\n\
    5. In the Send reminders field select Custom, then set the Remind me every field\nto 90 and the period drop down to Days\n\
    6. Click Save\nRemediate from Powershell\n$rgName = <resource group name for the storage>\n$accountName = <storage account\
    \ name>\n$account = Get-AzStorageAccount -ResourceGroupName $rgName -Name $accountName\nif ($account.KeyCreationTime.Key1\
    \ -eq $null -or $account.KeyCreationTime.Key2\n-eq $null){\n Write-output (\"You must regenerate both keys at least once\
    \ before\nsetting expiration policy\")\n} else {\n $account = Set-AzStorageAccount -ResourceGroupName $rgName -Name\n\
    $accountName -KeyExpirationPeriodInDay 90\n}\n$account.KeyPolicy.KeyExpirationPeriodInDays"
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Storage Accounts

      2. For each Storage Account, under Security + networking, go to Access keys

      3. If the button Edit rotation reminder is displayed, the Storage Account is

