    services securely without the need for usernames and passwords.
  rationale: App Service provides a highly scalable, self-patching web hosting service in Azure. It also provides a managed
    identity for apps, which is a turn-key solution for securing access to Azure SQL Database and other Azure services.
  impact: ''
  references:
  - 1. https://docs.microsoft.com/en-gb/azure/app-service/app-service-web-tutorialconnect-msi
