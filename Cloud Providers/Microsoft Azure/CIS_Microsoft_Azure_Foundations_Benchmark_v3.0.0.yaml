- id: 2.2.4
  title: Ensure that A Multi-factor Authentication Policy Exists for Administrative Groups
  scoring: manual
  profile:
  - Level 2
  description: For designated users, they will be prompted to use their multi-factor authentication (MFA) process on login.
  rationale: Enabling multi-factor authentication is a recommended setting to limit the use of Administrative accounts to
    authenticated personnel.
  impact: 'There is an increased cost, as Conditional Access policies require Microsoft Entra ID P1. Similarly, MFA may require
    additional overhead to maintain. There is also a potential scenario in which the multi-factor authentication method can
    be lost, and administrative users are no longer able to log in. For this scenario, there should be an emergency access
    account. Please see References for creating this. NOTE: Starting July 2024, Microsoft will begin requiring MFA for All
    Users - including Break Glass Accounts. By the end of October 2024, this requirement will be enforced. Physical FIDO2
    security keys, or a certificate kept on secure removable storage can fulfill this MFA requirement. If opting for a physical
    device, that device should be kept in a very secure, documented physical location.'
  references:
  - 1. https://learn.microsoft.com/en-us/entra/identity/conditional-access/howtoconditional-access-policy-admin-mfa
  - 2. https://learn.microsoft.com/en-us/entra/identity/role-based-accesscontrol/security-emergency-access
