- id: 2.1.4
  title: Ensure that 'Allow users to remember multi-factor authentication on devices they trust' is Disabled
  scoring: manual
  profile:
  - Level 1
  description: '[IMPORTANT - Please read the section overview: If your organization pays for Microsoft Entra ID licensing
    (included in Microsoft 365 E3, E5, or F5, and EM&S E3 or E5 licenses) and CAN use Conditional Access, ignore the recommendations
    in this section and proceed to the Conditional Access section.] Do not allow users to remember multi-factor authentication
    on devices.'
  rationale: Remembering Multi-Factor Authentication (MFA) for devices and browsers allows users to have the option to bypass
    MFA for a set number of days after performing a successful sign-in using MFA. This can enhance usability by minimizing
    the number of times a user may need to perform two-step verification on the same device. However, if an account or device
    is compromised, remembering MFA for trusted devices may affect security. Hence, it is recommended that users not be allowed
    to bypass MFA.
  impact: For every login attempt, the user will be required to perform multi-factor authentication.
  references:
  - 1. https://learn.microsoft.com/en-us/entra/identity/authentication/howto-mfamfasettings#remember-multi-factor-authentication-for-devices-that-users-trust
  - 2. https://docs.microsoft.com/en-us/security/benchmark/azure/security-controls-v3identity-management#im-4-use-strong-authentication-controls-for-all-azureactive-directory-based-access
  page_start: 38
  audit_raw: 'Audit from Azure Portal

    1. From Azure Home select the Portal Menu

    2. Select Microsoft Entra ID

    3. Under Manage, click Users

    4. Click the Per-user MFA button on the top bar

    5. Click on Service settings

    6. Ensure that Allow users to remember multi-factor authentication on

    devices they trust is not enabled'
  remediation: 'Remediate from Azure Portal

    1. From Azure Home select the Portal Menu

    2. Select Microsoft Entra ID

    3. Under Manage, click Users

    4. Click the Per-user MFA button on the top bar

    5. Click on Service settings

    6. Uncheck the box next to Allow users to remember multi-factor

    authentication on devices they trust

    7. Click Save'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. From Azure Home select the Portal Menu

      2. Select Microsoft Entra ID

      3. Under Manage, click Users

      4. Click the Per-user MFA button on the top bar

      5. Click on Service settings

      6. Ensure that Allow users to remember multi-factor authentication on

      devices they trust is not enabled'
    severity: medium
- id: 2.2.1
  title: Ensure Trusted Locations Are Defined
  scoring: manual
  profile:
  - Level 2
  description: Microsoft Entra ID Conditional Access allows an organization to configure Named locations and configure whether
    those locations are trusted or untrusted. These settings provide organizations the means to specify Geographical locations
    for use in conditional access policies, or define actual IP addresses and IP ranges and whether or not those IP addresses
    and/or ranges are trusted by the organization.
  rationale: Defining trusted source IP addresses or ranges helps organizations create and enforce Conditional Access policies
    around those trusted or untrusted IP addresses and ranges. Users authenticating from trusted IP addresses and/or ranges
    may have less access restrictions or access requirements when compared to users that try to authenticate to Microsoft
    Entra ID from untrusted locations or untrusted source IP addresses/ranges.
  impact: 'When configuring Named locations, the organization can create locations using Geographical location data or by
    defining source IP addresses or ranges. Configuring Named locations using a Country location does not provide the organization
    the ability to mark those locations as trusted, and any Conditional Access policy relying on those Countries location
    setting will not be able to use the All trusted locations setting within the Conditional Access policy. They instead will
    have to rely on the Select locations setting. This may add additional resource requirements when configuring and will
    require thorough organizational testing. In general, Conditional Access policies may completely prevent users from authenticating
    to Microsoft Entra ID, and thorough testing is recommended. To avoid complete lockout, a ''Break Glass'' account with
    full Global Administrator rights is recommended in the event all other administrators are locked out of authenticating
    to Microsoft Entra ID. This ''Break Glass'' account should be excluded from Conditional Access Policies and should be
    configured with the longest pass phrase feasible in addition to a FIDO2 security key or certificate kept in a very secure
    physical location. This account should only be used in the event of an emergency and complete administrator lockout. NOTE:
    Starting July 2024, Microsoft will begin requiring MFA for All Users - including Break Glass Accounts. By the end of October
    2024, this requirement will be enforced. Physical FIDO2 security keys, or a certificate kept on secure removable storage
    can fulfill this MFA requirement. If opting for a physical device, that device should be kept in a very secure, documented
    physical location.'
  references:
  - 1. https://learn.microsoft.com/en-us/entra/identity/conditional-access/conceptassignment-network
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-identitymanagement#im-7-restrict-resource-access-based-on--conditions
  page_start: 41
  audit_raw: 'Audit from Azure Portal

    1. In the Azure Portal, navigate to Microsoft Entra ID

    2. Under Manage, click Security

    3. Under Protect, click Conditional Access

    4. Under Manage, click Named locations

    Ensure there are IP ranges location settings configured and marked as Trusted

    Audit from PowerShell

    Get-MgIdentityConditionalAccessNamedLocation

    In the output from the above command, for each Named location group, make sure at

    least one entry contains the IsTrusted parameter with a value of True. Otherwise, if

    there is no output as a result of the above command or all of the entries contain the

    IsTrusted parameter with an empty value, a NULL value, or a value of False, the

    results are out of compliance with this check.'
  remediation: 'Remediate from Azure Portal

    1. In the Azure Portal, navigate to Microsoft Entra ID

    2. Under Manage, click Security

    3. Under Protect, click Conditional Access

    4. Under Manage, click Named locations

    5. Within the Named locations blade, click on IP ranges location

    6. Enter a name for this location setting in the Name text box

    7. Click on the + sign

    8. Add an IP Address Range in CIDR notation inside the text box that appears

    9. Click on the Add button

    10. Repeat steps 7 through 9 for each IP Range that needs to be added

    11. If the information entered are trusted ranges, select the Mark as trusted

    location check box

    12. Once finished, click on Create

    Remediate from PowerShell

    Create a new trusted IP-based Named location policy

    [System.Collections.Generic.List`1[Microsoft.Open.MSGraph.Model.IpRange]]$ipR

    anges = @()

    $ipRanges.Add("<first IP range in CIDR notation>")

    $ipRanges.Add("<second IP range in CIDR notation>")

    $ipRanges.Add("<third IP range in CIDR notation>")

    New-MgIdentityConditionalAccessNamedLocation -dataType

    "#microsoft.graph.ipNamedLocation" -DisplayName "<name of IP Named location

    policy>" -IsTrusted $true -IpRanges $ipRanges

    Set an existing IP-based Named location policy to trusted

    Update-MgIdentityConditionalAccessNamedLocation -PolicyId "<ID of the

    policy>" -dataType "#microsoft.graph.ipNamedLocation" -IsTrusted $true'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. In the Azure Portal, navigate to Microsoft Entra ID

      2. Under Manage, click Security

      3. Under Protect, click Conditional Access

      4. Under Manage, click Named locations

      Ensure there are IP ranges location settings configured and marked as Trusted

      Audit from PowerShell

      Get-MgIdentityConditionalAccessNamedLocation

      In the output from the above command, for each Named location group, make sure at

      least one entry contains the IsTrusted parameter with a value of True. Otherwise'
    severity: medium
- id: 2.2.2
  title: Ensure that an exclusionary Geographic Access Policy is considered
  scoring: manual
  profile:
  - Level 2
  description: 'CAUTION: If these policies are created without first auditing and testing the result, misconfiguration can
    potentially lock out administrators or create undesired access issues. Conditional Access Policies can be used to block
    access from geographic locations that are deemed out-of-scope for your organization or application. The scope and variables
    for this policy should be carefully examined and defined.'
  rationale: 'Conditional Access, when used as a deny list for the tenant or subscription, is able to prevent ingress or egress
    of traffic to countries that are outside of the scope of interest (e.g.: customers, suppliers) or jurisdiction of an organization.
    This is an effective way to prevent unnecessary and long-lasting exposure to international threats such as APTs.'
  impact: Microsoft Entra ID P1 or P2 is required. Limiting access geographically will deny access to users that are traveling
    or working remotely in a different part of the world. A point-tosite or site to site tunnel such as a VPN is recommended
    to address exceptions to geographic access policies.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/conditionalaccess/howto-conditional-access-policy-location
  - 2. https://docs.microsoft.com/en-us/azure/active-directory/conditionalaccess/concept-conditional-access-report-only
  page_start: 44
  audit_raw: 'Audit from Azure Portal

    1. From Azure Home open the Portal menu in the top left, and select Microsoft

    Entra ID.

    2. Scroll down in the menu on the left, and select Security.

    3. Select on the left side Conditional Access.

    4. Select Policies.

    5. Select the policy you wish to audit, then:

    o Under Assignments > Users, review the users and groups for the

    personnel the policy will apply to

    o Under Assignments > Target resources, review the cloud apps or

    actions for the systems the policy will apply to

    o Under Conditions > Locations, Review the Include locations for those

    that should be blocked

    o Under Conditions > Locations, Review the Exclude locations for those

    that should be allowed (Note: locations set up in the previous

    recommendation for Trusted Location should be in the Exclude list.)

    o Under Access Controls > Grant - Confirm that Block access is

    selected.

    Audit from Azure CLI

    As of this writing there are no subcommands for Conditional Access Policies

    within the Azure CLI

    Audit from PowerShell

    $conditionalAccessPolicies = Get-MgIdentityConditionalAccessPolicy

    foreach($policy in $conditionalAccessPolicies) {$policy | Select-Object

    @{N=''Policy ID''; E={$policy.id}}, @{N="Included Locations";

    E={$policy.Conditions.Locations.IncludeLocations}}, @{N="Excluded Locations";

    E={$policy.Conditions.Locations.ExcludeLocations}}, @{N="BuiltIn

    GrantControls"; E={$policy.GrantControls.BuiltInControls}}}

    Make sure there is at least 1 row in the output of the above PowerShell command that

    contains Block under the BuiltIn GrantControls column and location IDs under the

    Included Locations and Excluded Locations columns. If not, a policy containing

    these options has not been created and is considered a finding.'
  remediation: 'Remediate from Azure Portal

    Part 1 of 2 - Create the policy and enable it in Report-only mode.

    1. From Azure Home open the portal menu in the top left, and select Microsoft

    Entra ID.

    2. Scroll down in the menu on the left, and select Security.

    3. Select on the left side Conditional Access.

    4. Select Policies.

    5. Click the + New policy button, then:

    6. Provide a name for the policy.

    7. Under Assignments, select Users then:

    o Under Include, select All users

    o Under Exclude, check Users and groups and only select emergency

    access accounts and service accounts (NOTE: Service accounts are

    excluded here because service accounts are non-interactive and cannot

    complete MFA)

    8. Under Assignments, select Target resources then:

    o Under Include, select All cloud apps

    o Leave Exclude blank unless you have a well defined exception

    9. Under Conditions, select Locations then:

    o Select Include, then add entries for locations for those that should be

    blocked

    o Select Exclude, then add entries for those that should be allowed

    (IMPORTANT: Ensure that all Trusted Locations are in the Exclude list.)

    10. Under Access Controls, select Grant select Block Access.

    11. Set Enable policy to Report-only.

    12. Click Create.

    Allow some time to pass to ensure the sign-in logs capture relevant conditional access

    events. These events will need to be reviewed to determine if additional considerations

    are necessary for your organization (e.g. legitimate locations are being blocked and

    investigation is needed for exception).

    NOTE: The policy is not yet ''live,'' since Report-only is being used to audit the effect of

    the policy.

    Part 2 of 2 - Confirm that the policy is not blocking access that should be granted, then

    toggle to On.

    1. With your policy now in report-only mode, return to the Microsoft Entra blade and

    click on Sign-in logs.

    2. Review the recent sign-in events - click an event then review the event details

    (specifically the Report-only tab) to ensure:

    o The sign-in event you''re reviewing occurred after turning on the policy in

    report-only mode

    o The policy name from step 6 above is listed in the Policy Name column

    o The Result column for the new policy shows that the policy was Not

    applied (indicating the location origin was not blocked)

    3. If the above conditions are present, navigate back to the policy name in

    Conditional Access and open it.

    4. Toggle the policy from Report-only to On.

    5. Click Save.

    Remediate from PowerShell

    First, set up the conditions objects values before updating an existing conditional

    access policy or before creating a new one. You may need to use additional PowerShell

    cmdlets to retrieve specific IDs such as the GetMgIdentityConditionalAccessNamedLocation which outputs the Location IDs
    for

    use with conditional access policies.

    $conditions = New-Object -TypeName

    Microsoft.Open.MSGraph.Model.ConditionalAccessConditionSet

    $conditions.Applications = New-Object -TypeName

    Microsoft.Open.MSGraph.Model.ConditionalAccessApplicationCondition

    $conditions.Applications.IncludeApplications = <"All" | "Office365" | "app

    ID" | @("app ID 1", "app ID 2", etc...>

    $conditions.Applications.ExcludeApplications = <"Office365" | "app ID" |

    @("app ID 1", "app ID 2", etc...)>

    $conditions.Users = New-Object -TypeName

    Microsoft.Open.MSGraph.Model.ConditionalAccessUserCondition

    $conditions.Users.IncludeUsers = <"All" | "None" | "GuestsOrExternalUsers" |

    "Specific User ID" | @("User ID 1", "User ID 2", etc.)>

    $conditions.Users.ExcludeUsers = <"GuestsOrExternalUsers" | "Specific User

    ID" | @("User ID 1", "User ID 2", etc.)>

    $conditions.Users.IncludeGroups = <"group ID" | "All" | @("Group ID 1",

    "Group ID 2", etc...)>

    $conditions.Users.ExcludeGroups = <"group ID" | @("Group ID 1", "Group ID 2",

    etc...)>

    $conditions.Users.IncludeRoles = <"Role ID" | "All" | @("Role ID 1", "Role ID

    2", etc...)>

    $conditions.Users.ExcludeRoles = <"Role ID" | @("Role ID 1", "Role ID 2",

    etc...)>

    $conditions.Locations = New-Object -TypeName

    Microsoft.Open.MSGraph.Model.ConditionalAccessLocationCondition

    $conditions.Locations.IncludeLocations = <"Location ID" | @("Location ID 1",

    "Location ID 2", etc...) >

    $conditions.Locations.ExcludeLocations = <"AllTrusted" | "Location ID" |

    @("Location ID 1", "Location ID 2", etc...)>

    $controls = New-Object -TypeName

    Microsoft.Open.MSGraph.Model.ConditionalAccessGrantControls

    $controls._Operator = "OR"

    $controls.BuiltInControls = "block"

    Next, update the existing conditional access policy with the condition set options

    configured with the previous commands.

    Update-MgIdentityConditionalAccessPolicy -PolicyId <policy ID> -Conditions

    $conditions -GrantControls $controls

    To create a new conditional access policy that complies with this best practice, run the

    following commands after creating the condition set above

    New-MgIdentityConditionalAccessPolicy -Name "Policy Name" -State

    <enabled|disabled> -Conditions $conditions -GrantControls $controls'
