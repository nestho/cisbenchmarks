- id: '4.5'
  title: Ensure that Shared Access Signature Tokens Expire Within an Hour
  scoring: manual
  profile:
  - Level 1
  description: Expire shared access signature tokens within an hour.
  rationale: A shared access signature (SAS) is a URI that grants restricted access rights to Azure Storage resources. A shared
    access signature can be provided to clients who should not be trusted with the storage account key but for whom it may
    be necessary to delegate access to certain storage account resources. Providing a shared access signature URI to these
    clients allows them access to a resource for a specified period of time. This time should be set as low as possible and
    preferably no longer than an hour.
  impact: ''
  references:
  - 1. https://docs.microsoft.com/en-us/rest/api/storageservices/delegating-accesswith-a-shared-access-signature
  - 2. https://docs.microsoft.com/en-us/azure/storage/common/storage-sas-overview
  page_start: 253
  audit_raw: 'Currently, SAS token expiration times cannot be audited. Until Microsoft makes token

    expiration time a setting rather than a token creation parameter, this recommendation

    would require a manual verification.'
  remediation: 'When generating shared access signature tokens, use start and end time such that it

    falls within an hour.

    Remediate from Azure Portal

    1. Go to Storage Accounts

    2. For each storage account where a shared access signature is required, under

    Security + networking, go to Shared access signature

    3. Select the appropriate Allowed resource types

    4. Set the Start and expiry date/time to be within one hour

    5. Click Generate SAS and connection string'
  checks:
  - type: manual_review
    info: 'Currently, SAS token expiration times cannot be audited. Until Microsoft makes token

      expiration time a setting rather than a token creation parameter, this recommendation

      would require a manual verification.'
    severity: medium
- id: '4.6'
  title: Ensure that 'Public Network Access' is 'Disabled' for storage accounts
  scoring: scored
  profile:
  - Level 1
  description: Disallowing public network access for a storage account overrides the public access settings for individual
    containers in that storage account for Azure Resource Manager Deployment Model storage accounts. Azure Storage accounts
    that use the classic deployment model will be retired on August 31, 2024.
  rationale: The default network configuration for a storage account permits a user with appropriate permissions to configure
    public network access to containers and blobs in a storage account. Keep in mind that public access to a container is
    always turned off by default and must be explicitly configured to permit anonymous requests. It grants read-only access
    to these resources without sharing the account key, and without requiring a shared access signature. It is recommended
    not to provide public network access to storage accounts until, and unless, it is strongly desired. A shared access signature
    token or Azure AD RBAC should be used for providing controlled and timed access to blob containers.
  impact: Access will have to be managed using shared access signatures or via Azure AD RBAC.
