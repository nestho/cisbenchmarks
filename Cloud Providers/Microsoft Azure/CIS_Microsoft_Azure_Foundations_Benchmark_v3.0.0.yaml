- id: '4.7'
  title: Ensure Default Network Access Rule for Storage Accounts is Set to Deny
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: 'Restricting default network access helps to provide a new layer of security, since storage accounts accept
    connections from clients on any network. To limit access to selected networks, the default action must be changed. NOTE:
    This recommendation assumes that the Public network access parameter is set to Enabled from selected virtual networks
    and IP addresses. Please ensure the prerequisite recommendation has been implemented before proceeding: • Ensure Default
    Network Access Rule for Storage Accounts is Set to Deny Some Azure services that interact with storage accounts operate
    from networks that can''t be granted access through network rules. To help this type of service work as intended, allow
    the set of trusted Azure services to bypass the network rules. These services will then use strong authentication to access
    the storage account. If the Allow Azure services on the trusted services list to access this storage account exception
    is enabled, the following services are granted access to the storage account: Azure Backup, Azure Data Box, Azure DevTest
    Labs, Azure Event Grid, Azure Event Hubs, Azure File Sync, Azure HDInsight, Azure Import/Export, Azure Monitor, Azure
    Networking Services, and Azure Site Recovery (when registered in the subscription).'
  rationale: Storage accounts should be configured to deny access to traffic from all networks (including internet traffic).
    Access can be granted to traffic from specific Azure Virtual networks, allowing a secure network boundary for specific
    applications to be built. Access can also be granted to public internet IP address ranges to enable connections from specific
    internet or on-premises clients. When network rules are configured, only applications from allowed networks can access
    a storage account. When calling from an allowed network, applications continue to require proper authorization (a valid
    access key or SAS token) to access the storage account. Turning on firewall rules for a storage account will block access
    to incoming requests for data, including from other Azure services. We can re-enable this functionality by allowing access
    to trusted Azure services through networking exceptions.
  impact: All allowed networks will need to be whitelisted on each specific network, creating administrative overhead. This
    may result in loss of network connectivity, so do not turn on for critical resources during business hours. This creates
    authentication credentials for services that need access to storage resources so that services will no longer need to
    communicate via network request. There may be a temporary loss of communication as you set each Storage Account. It is
    recommended to not do this on mission-critical resources during business hours.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/storage-networksecurity
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-governancestrategy#gs-2-define-and-implement-enterprise-segmentationseparation-ofduties-strategy
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/storage-networksecurity
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-networksecurity#ns-2-secure-cloud-native-services-with-network-controls
  page_start: 258
