  remediation: "Note: Azure CLI and Powershell use ISO8601 flags to input timespans. Every timespan\ninput will be in the\
    \ format P<timespanInISO8601Format>(Y,M,D). The leading P is\nrequired with it denoting period. The (Y,M,D) are for the\
    \ duration of Year, Month,and\nDay respectively. A time frame of 2 years, 2 months, 2 days would be (P2Y2M2D).\nRemediate\
    \ from Azure Portal\n1. From Azure Portal select the Portal Menu in the top left.\n2. Select Key Vaults.\n3. Select a\
    \ Key Vault to audit.\n4. Under Objects select Keys.\n5. Select a key to audit.\n6. In the top row select Rotation policy.\n\
    7. Select an Expiry time.\n8. Set Enable auto rotation to Enabled.\n9. Set an appropriate Rotation option and Rotation\
    \ time.\n10. Optionally set the Notification time.\n11. Select Save.\n12. Repeat steps 3-11 for each Key Vault and Key.\n\
    Remediate from Azure CLI\nRun the following command for each key to update its policy to be auto-rotated:\naz keyvault\
    \ key rotation-policy update -n <keyName> --vault-name <vaultName>\n--value <path/to/policy.json>\nNote: It is easiest\
    \ to supply the policy flags in a .json file. An example\njson file would be:\n{\n \"lifetimeActions\": [\n {\n \"trigger\"\
    : {\n \"timeAfterCreate\": \"<timespanInISO8601Format>\",\n \"timeBeforeExpiry\" : null\n },\n \"action\": {\n \"type\"\
    : \"Rotate\"\n }\n },\n {\n \"trigger\": {\n \"timeBeforeExpiry\" : \"<timespanInISO8601Format>\"\n },\n \"action\": {\n\
    \ \"type\": \"Notify\"\n }\n }\n ],\n \"attributes\": {\n \"expiryTime\": \"<timespanInISO8601Format>\"\n }\n}\nRemediate\
    \ from PowerShell\nRun the following command for each key to update its policy:\nSet-AzKeyVaultKeyRotationPolicy -VaultName\
    \ test-kv -Name test-key -PolicyPath\nrotation_policy.json\nNote: It is easiest to supply the policy flags in a .json\
    \ file. An example json file would be:\n<#\nrotation_policy.json\n{\n \"lifetimeActions\": [\n {\n \"trigger\": {\n \"\
    timeAfterCreate\": \"P<timespanInISO8601Format>M\",\n \"timeBeforeExpiry\": null\n },\n \"action\": {\n \"type\": \"Rotate\"\
    \n }\n },\n {\n \"trigger\": {\n \"timeBeforeExpiry\": \"P<timespanInISO8601Format>D\"\n },\n \"action\": {\n \"type\"\
    : \"Notify\"\n }\n }\n ],\n \"attributes\": {\n \"expiryTime\": \"P<timespanInISO8601Format>Y\"\n }\n }\n#>"
