- id: '2.23'
  title: Ensure That No Custom Subscription Administrator Roles Exist
  scoring: scored
  profile:
  - Level 1
  description: The principle of least privilege should be followed and only necessary privileges should be assigned instead
    of allowing full administrative access.
  rationale: Custom roles in Azure with administrative access can obfuscate the permissions granted and introduce complexity
    and blind spots to the management of privileged identities. For less mature security programs without regular identity
    audits, the creation of Custom roles should be avoided entirely. For more mature security programs with regular identity
    audits, Custom Roles should be audited for use and assignment, used minimally, and the principle of least privilege should
    be observed when granting permissions
  impact: Subscriptions will need to be handled by Administrators with permissions.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/billing/billing-add-change-azuresubscription-administrator
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-privilegedaccess#pa-1-separate-and-limit-highly-privilegedadministrative-users
  page_start: 114
