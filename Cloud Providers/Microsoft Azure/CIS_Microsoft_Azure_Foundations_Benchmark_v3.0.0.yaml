    \ Infrastructure encryption is set to\nEnabled.\nAudit from Azure CLI\naz storage blob show \\\n --account-name <storage-account>\
    \ \\\n --container-name <container> \\\n --name <blob> \\\n --query \"properties.serverEncrypted\"\nAudit from PowerShell\n\
    $account = Get-AzStorageAccount -ResourceGroupName <resource-group> `\n -Name <storage-account>\n$blob = Get-AzStorageBlob\
    \ -Context $account.Context `\n -Container <container> `\n -Blob <blob>\n$blob.ICloudBlob.Properties.IsServerEncrypted\n\
    Audit from Azure Policy\nIf referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the\n\
    associated Policy definition in Azure.\nIf referencing a printed copy, you can search Policy IDs from this URL:\nhttps://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions\n\
    • Policy ID: 4733ea7b-a883-42fe-8cac-97454c2a9e4a - Name: 'Storage accounts\nshould have infrastructure encryption'"
  remediation: "Remediate from Azure Portal\n1. During Storage Account creation, in the Encryption tab, check the box next\
