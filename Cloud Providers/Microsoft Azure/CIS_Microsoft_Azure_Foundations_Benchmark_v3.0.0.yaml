- id: 6.1.1
  title: Ensure that a 'Diagnostic Setting' exists for Subscription Activity Logs
  scoring: manual
  profile:
  - Level 1
  description: Enable Diagnostic settings for exporting activity logs. Diagnostic settings are available for each individual
    resource within a subscription. Settings should be configured for all appropriate resources for your environment.
  rationale: A diagnostic setting controls how a diagnostic log is exported. By default, logs are retained only for 90 days.
    Diagnostic settings should be defined so that logs can be exported and stored for a longer duration in order to analyze
    security activities within an Azure subscription.
  impact: ''
  references:
  - 1. https://docs.microsoft.com/en-us/azure/monitoring-and-diagnostics/monitoringoverview-activity-logs#export-the-activity-log-with-a-log-profile
  - 2. https://learn.microsoft.com/en-us/cli/azure/monitor/diagnosticsettings?view=azure-cli-latest
