  description: Network security groups should be periodically evaluated for port misconfigurations. Where certain ports and
    protocols may be exposed to the Internet, they should be evaluated for necessity and restricted wherever they are not
    explicitly required.
  rationale: The potential security problem with broadly exposing UDP services over the Internet is that attackers can use
    DDoS amplification techniques to reflect spoofed UDP traffic from Azure Virtual Machines. The most common types of these
    attacks use exposed DNS, NTP, SSDP, SNMP, CLDAP and other UDP-based services as amplification sources for disrupting services
    of other machines on the Azure Virtual Network or even attack networked devices outside of Azure.
