- id: 2.2.6
  title: Ensure Multi-factor Authentication is Required for Risky Sign-ins
  scoring: manual
  profile:
  - Level 2
  description: Entra ID tracks the behavior of sign-in events. If the Entra ID domain is licensed with P2, the sign-in behavior
    can be used as a detection mechanism for additional scrutiny during the sign-in event. If this policy is set up, then
    Risky Sign-in events will prompt users to use multi-factor authentication (MFA) tokens on login for additional verification.
  rationale: Enabling multi-factor authentication is a recommended setting to limit the potential of accounts being compromised
    and limiting access to authenticated personnel. Enabling this policy allows Entra ID's risk-detection mechanisms to force
    additional scrutiny on the login event, providing a deterrent response to potentially malicious sign-in events, and adding
    an additional authentication layer as a reaction to potentially malicious behavior.
  impact: Risk Policies for Conditional Access require Microsoft Entra ID P2. Additional overhead to support or maintain these
    policies may also be required if users lose access to their MFA tokens.
  references:
  - 1. https://learn.microsoft.com/en-us/entra/identity/conditional-access/howtoconditional-access-policy-risk
  - 2. https://learn.microsoft.com/en-us/entra/identity/conditional-access/troubleshootconditional-access-what-if
