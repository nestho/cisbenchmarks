    \ ID>\nGet-AzStorageAccountNetworkRuleset -ResourceGroupName <resource group> -Name\n<storage account name> |Select-Object\
    \ DefaultAction\nPowerShell Result - Non-Compliant\nDefaultAction : Allow\nPowerShell Result - Compliant\nDefaultAction\
    \ : Deny\nAudit from Azure Policy\nIf referencing a digital copy of this Benchmark, clicking a Policy ID will open a link\
