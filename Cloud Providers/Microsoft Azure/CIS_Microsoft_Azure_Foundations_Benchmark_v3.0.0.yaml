- id: 3.3.7
  title: Ensure that Private Endpoints are Used for Azure Key Vault
  scoring: scored
  profile:
  - Level 2
  description: Private endpoints will secure network traffic from Azure Key Vault to the resources requesting secrets and
    keys.
  rationale: Private endpoints will keep network requests to Azure Key Vault limited to the endpoints attached to the resources
    that are whitelisted to communicate with each other. Assigning the Key Vault to a network without an endpoint will allow
    other resources on that network to view all traffic from the Key Vault to its destination. In spite of the complexity
    in configuration, this is recommended for high security secrets.
  impact: Incorrect or poorly-timed changing of network configuration could result in service interruption. There are also
    additional costs tiers for running a private endpoint per petabyte or more of networking traffic.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/private-link/private-endpoint-overview
  - 2. https://docs.microsoft.com/en-us/azure/storage/common/storage-privateendpoints
  page_start: 231
  audit_raw: 'Audit from Azure Portal

    1. From Azure Home open the Portal Menu in the top left.

    2. Select Key Vaults.

