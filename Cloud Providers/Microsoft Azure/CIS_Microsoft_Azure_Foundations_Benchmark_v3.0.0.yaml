- id: '9.11'
  title: Ensure Azure Key Vaults are Used to Store Secrets
  scoring: manual
  profile:
  - Level 2
  description: Azure Key Vault will store multiple types of sensitive information such as encryption keys, certificate thumbprints,
    and Managed Identity Credentials. Access to these 'Secrets' can be controlled through granular permissions.
  rationale: The credentials given to an application have permissions to create, delete, or modify data stored within the
    systems they access. If these credentials are stored within the application itself, anyone with access to the application
    or a copy of the code has access to them. Storing within Azure Key Vault as secrets increases security by controlling
    access. This also allows for updates of the credentials without redeploying the entire application.
  impact: Integrating references to secrets within the key vault are required to be specifically integrated within the application
    code. This will require additional configuration to be made during the writing of an application, or refactoring of an
    already written one. There are also additional costs that are charged per 10000 requests to the Key Vault.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/app-service/app-service-key-vaultreferences
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-identitymanagement#im-3-manage-application-identities-securely-and-automatically
  page_start: 517
  audit_raw: 'Audit from Azure Portal

    1. Login to Azure Portal.

    2. In the expandable menu on the left go to Key Vaults.

    3. View the Key Vaults listed.

    Audit from Azure CLI

    To list key vaults within a subscription run the following command:

    Get-AzKeyVault

    To list the secrets within these key vaults run the following command:

    Get-AzKeyVaultSecret [-VaultName] <vault name>

    Audit from PowerShell

    To list key vaults within a subscription run the following command:

    Get-AzKeyVault

    To list all secrets in a key vault run the following command:

    Get-AzKeyVaultSecret -VaultName ''<vaultName'''
  remediation: "Remediation has 2 steps\n1. Setup the Key Vault\n2. Setup the App Service to use the Key Vault\nStep 1: Set\
    \ up the Key Vault\nRemediate from Azure CLI\naz keyvault create --name \"<name>\" --resource-group \"<myResourceGroup>\"\
    \ --\nlocation myLocation\nRemediate from PowerShell\nNew-AzKeyvault -name <name> -ResourceGroupName <myResourceGroup>\
    \ -Location\n<myLocation>\nStep 2: Set up the App Service to use the Key Vault\nSample JSON Template for App Service Configuration\
    \ (starting next page):\n{\n //...\n \"resources\": [\n {\n \"type\": \"Microsoft.Storage/storageAccounts\",\n \"name\"\
    : \"[variables('storageAccountName')]\",\n //...\n },\n {\n \"type\": \"Microsoft.Insights/components\",\n \"name\": \"\
    [variables('appInsightsName')]\",\n //...\n },\n {\n \"type\": \"Microsoft.Web/sites\",\n \"name\": \"[variables('functionAppName')]\"\
    ,\n \"identity\": {\n \"type\": \"SystemAssigned\"\n },\n //...\n \"resources\": [\n {\n \"type\": \"config\",\n \"name\"\
    : \"appsettings\",\n //...\n \"dependsOn\": [\n \"[resourceId('Microsoft.Web/sites',\nvariables('functionAppName'))]\"\
    ,\n \"[resourceId('Microsoft.KeyVault/vaults/',\nvariables('keyVaultName'))]\",\n \"[resourceId('Microsoft.KeyVault/vaults/secrets',\n\
    variables('keyVaultName'), variables('storageConnectionStringName'))]\",\n \"[resourceId('Microsoft.KeyVault/vaults/secrets',\n\
    variables('keyVaultName'), variables('appInsightsKeyName'))]\"\n ],\n \"properties\": {\n \"AzureWebJobsStorage\":\n\"\
    [concat('@Microsoft.KeyVault(SecretUri=',\nreference(variables('storageConnectionStringResourceId')).secretUriWithVersio\n\
    n, ')')]\",\n \"WEBSITE_CONTENTAZUREFILECONNECTIONSTRING\":\n\"[concat('@Microsoft.KeyVault(SecretUri=',\nreference(variables('storageConnectionStringResourceId')).secretUriWithVersio\n\
    n, ')')]\",\n \"APPINSIGHTS_INSTRUMENTATIONKEY\":\n\"[concat('@Microsoft.KeyVault(SecretUri=',\nreference(variables('appInsightsKeyResourceId')).secretUriWithVersion,\n\
    ')')]\",\n \"WEBSITE_ENABLE_SYNC_UPDATE_SITE\": \"true\"\n //...\n }\n },\n {\n \"type\": \"sourcecontrols\",\n \"name\"\
    : \"web\",\n //...\n \"dependsOn\": [\n \"[resourceId('Microsoft.Web/sites',\nvariables('functionAppName'))]\",\n \"[resourceId('Microsoft.Web/sites/config',\n\
    variables('functionAppName'), 'appsettings')]\"\n ],\n }\n ]\n },\n {\n \"type\": \"Microsoft.KeyVault/vaults\",\n \"\
    name\": \"[variables('keyVaultName')]\",\n //...\n \"dependsOn\": [\n \"[resourceId('Microsoft.Web/sites',\nvariables('functionAppName'))]\"\
    \n ],\n \"properties\": {\n //...\n \"accessPolicies\": [\n {\n \"tenantId\":\n\"[reference(concat('Microsoft.Web/sites/',\
    \ variables('functionAppName'),\n'/providers/Microsoft.ManagedIdentity/Identities/default'), '2015-08-31PREVIEW').tenantId]\"\
    ,\n \"objectId\":\n\"[reference(concat('Microsoft.Web/sites/', variables('functionAppName'),\n'/providers/Microsoft.ManagedIdentity/Identities/default'),\
    \ '2015-08-31PREVIEW').principalId]\",\n \"permissions\": {\n \"secrets\": [ \"get\" ]\n }\n }\n ]\n },\n \"resources\"\
    : [\n {\n \"type\": \"secrets\",\n \"name\": \"[variables('storageConnectionStringName')]\",\n //...\n \"dependsOn\":\
    \ [\n \"[resourceId('Microsoft.KeyVault/vaults/',\nvariables('keyVaultName'))]\",\n \"[resourceId('Microsoft.Storage/storageAccounts',\n\
    variables('storageAccountName'))]\"\n ],\n \"properties\": {\n \"value\":\n\"[concat('DefaultEndpointsProtocol=https;AccountName=',\n\
    variables('storageAccountName'), ';AccountKey=',\nlistKeys(variables('storageAccountResourceId'),'2015-05-01-preview').key1)]\"\
    \n }\n },\n {\n \"type\": \"secrets\",\n \"name\": \"[variables('appInsightsKeyName')]\",\n //...\n \"dependsOn\": [\n\
    \ \"[resourceId('Microsoft.KeyVault/vaults/',\nvariables('keyVaultName'))]\",\n \"[resourceId('Microsoft.Insights/components',\n\
    variables('appInsightsName'))]\"\n ],\n \"properties\": {\n \"value\":\n\"[reference(resourceId('microsoft.insights/components/',\n\
    variables('appInsightsName')), '2015-05-01').InstrumentationKey]\"\n }\n }\n ]\n }\n ]\n}"
