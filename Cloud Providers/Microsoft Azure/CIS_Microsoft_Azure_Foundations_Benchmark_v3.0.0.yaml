  rationale: Monitoring how and when key vaults are accessed, and by whom, enables an audit trail of interactions with confidential
    information, keys, and certificates managed by Azure Key Vault. Enabling logging for Key Vault saves information in a
    user provided destination of either an Azure storage account or Log Analytics workspace. The same destination can be used
    for collecting logs for multiple Key Vaults.
