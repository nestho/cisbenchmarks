- id: '2.4'
  title: Ensure Guest Users Are Reviewed on a Regular Basis
  scoring: manual
  profile:
  - Level 1
  description: Microsoft Entra ID has native and extended identity functionality allowing you to invite people from outside
    your organization to be guest users in your cloud account and sign in with their own work, school, or social identities.
  rationale: Guest users are typically added outside your employee on-boarding/off-boarding process and could potentially
    be overlooked indefinitely. To prevent this, guest users should be reviewed on a regular basis. During this audit, guest
    users should also be determined to not have administrative privileges.
  impact: Before removing guest users, determine their use and scope. Like removing any user, there may be unforeseen consequences
    to systems if an account is removed without careful consideration.
