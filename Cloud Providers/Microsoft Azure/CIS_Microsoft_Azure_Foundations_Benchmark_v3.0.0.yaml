    • Policy ID: 24fba194-95d6-48c0-aea7-f65bf859c598 - Name: ''Infrastructure

    encryption should be enabled for Azure Database for PostgreSQL servers'''
  remediation: 'It is not possible to enable ''infrastructure double encryption'' on an existing Azure

    Database for PostgreSQL server.

    The remediation steps detail the creation of a new Azure Database for PostgreSQL

    server with ''infrastructure double encryption'' enabled.

