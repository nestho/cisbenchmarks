  references:
  - 1. https://docs.microsoft.com/en-us/azure/key-vault/general/howto-logging
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-dataprotection#dp-8-ensure-security-of-key-and-certificate-repository
  page_start: 376
