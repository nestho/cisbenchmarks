- id: '9.6'
  title: Ensure that 'Basic Authentication' is 'Disabled'
  scoring: manual
  profile:
  - Level 1
  description: Basic Authentication provides the ability to create identities and authentication for an App Service without
    a centralized Identity Provider. For a more effective, capable, and secure solution for Identity, Authentication, Authorization,
    and Accountability, a centralized Identity Provider such as Entra ID is strongly advised. Periodically, older versions
    of PHP may be deprecated and no longer supported. Using a supported version of PHP for app services is recommended to
    avoid potential unpatched vulnerabilities. Periodically, older versions of Python may be deprecated and no longer supported.
    Using a supported version of Python for app services is recommended to avoid potential unpatched vulnerabilities. Periodically,
    older versions of Java may be deprecated and no longer supported. Using a supported version of Java for app services is
    recommended to avoid potential unpatched vulnerabilities. Periodically, newer versions are released for HTTP either due
    to security flaws or to include additional functionality. Using the latest HTTP version for apps to take advantage of
    security fixes, if any, and/or new functionalities of the newer version.
  rationale: Basic Authentication introduces an identity silo which can produce privileged access to a resource. This can
    be exploited in numerous ways and represents a significant vulnerability and attack vector. Deprecated and unsupported
    versions of programming and scripting languages can present vulnerabilities which may not be addressed or may not be addressable.
    Deprecated and unsupported versions of programming and scripting languages can present vulnerabilities which may not be
    addressed or may not be addressable. Deprecated and unsupported versions of programming and scripting languages can present
    vulnerabilities which may not be addressed or may not be addressable. Newer versions may contain security enhancements
    and additional functionality. Using the latest version is recommended in order to take advantage of enhancements and new
    capabilities. With each software installation, organizations need to determine if a given update meets their requirements.
    They must also verify the compatibility and support provided for any additional software against the update revision that
    is selected. HTTP 2.0 has additional performance improvements on the head-of-line blocking problem of old HTTP version,
    header compression, and prioritization of requests. HTTP 2.0 no longer supports HTTP 1.1's chunked transfer encoding mechanism,
    as it provides its own, more efficient, mechanisms for data streaming.
  impact: An Identity Provider that can be used by the App Service for authenticating users is required. If your app is written
    using version-dependent features or libraries, they may not be available on more recent versions. If you wish to update,
    research the impact thoroughly. If your app is written using version-dependent features or libraries, they may not be
    available on more recent versions. If you wish to update, research the impact thoroughly. If your app is written using
    version-dependent features or libraries, they may not be available on more recent versions. If you wish to update, research
    the impact thoroughly. Most modern browsers support HTTP 2.0 protocol over TLS only, while non-encrypted traffic continues
    to use HTTP 1.1. To ensure that client browsers connect to your app with HTTP/2, either buy an App Service Certificate
    for your app's custom domain or bind a third-party certificate.
  references:
