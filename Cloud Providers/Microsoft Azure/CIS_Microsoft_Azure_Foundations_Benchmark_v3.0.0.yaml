- id: '4.9'
  title: Ensure Private Endpoints are used to access Storage Accounts
  scoring: scored
  profile:
  - Level 2
  description: Use private endpoints for your Azure Storage accounts to allow clients and services to securely access data
    located over a network via an encrypted Private Link. To do this, the private endpoint uses an IP address from the VNet
    for each service. Network traffic between disparate services securely traverses encrypted over the VNet. This VNet can
    also link addressing space, extending your network and accessing resources on it. Similarly, it can be a tunnel through
    public networks to connect remote infrastructures together. This creates further security through segmenting network traffic
    and preventing outside sources from accessing it.
  rationale: Securing traffic between services through encryption protects the data from easy interception and reading.
  impact: A Private Endpoint costs approximately US$7.30 per month. If an Azure Virtual Network is not implemented correctly,
    this may result in the loss of critical network traffic.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/storage-privateendpoints
  - 2. https://docs.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview
  page_start: 264
  audit_raw: 'Audit from Azure Portal

    1. Open the Storage Accounts blade.

    2. For each listed Storage Account, perform the following check:

    3. Under the Security + networking heading, click on Networking.

    4. Click on the Private endpoint connections tab at the top of the networking

    window.

    5. Ensure that for each VNet that the Storage Account must be accessed from, a

    unique Private Endpoint is deployed and the Connection state for each Private

    Endpoint is Approved.

    Repeat the procedure for each Storage Account.

    Audit from PowerShell

    $storageAccount = Get-AzStorageAccount -ResourceGroup ''<ResourceGroupName>'' -

    Name ''<storageaccountname>''

    Get-AzPrivateEndpoint -ResourceGroup ''<ResourceGroupName>''|Where-Object

    {$_.PrivateLinkServiceConnectionsText -match $storageAccount.id}

    If the results of the second command returns information, the Storage Account is using

    a Private Endpoint and complies with this Benchmark, otherwise if the results of the

    second command are empty, the Storage Account generates a finding.

    Audit from Azure CLI

    az storage account show --name ''<storage account name>'' --query

    "privateEndpointConnections[0].id"

    If the above command returns data, the Storage Account complies with this Benchmark,

    otherwise if the results are empty, the Storage Account generates a finding.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: 6edd7eda-6dd8-40f7-810d-67160c639cd9 - Name: ''Storage accounts

    should use private link'''
  remediation: "Remediate from Azure Portal\n1. Open the Storage Accounts blade\n2. For each listed Storage Account, perform\
    \ the following:\n3. Under the Security + networking heading, click on Networking\n4. Click on the Private endpoint connections\
    \ tab at the top of the networking\nwindow\n5. Click the + Private endpoint button\n6. In the 1 - Basics tab/step:\no\n\
    Enter a name that will be easily recognizable as associated with the\nStorage Account (Note: The \"Network Interface Name\"\
    \ will be\nautomatically completed, but you can customize it if needed.)\no Ensure that the Region matches the region\
    \ of the Storage Account\no Click Next\n7. In the 2 - Resource tab/step:\no Select the target sub-resource based on what\
    \ type of storage\nresource is being made available\no Click Next\n8. In the 3 - Virtual Network tab/step:\no Select the\
    \ Virtual network that your Storage Account will be connecting\nto\no Select the Subnet that your Storage Account will\
    \ be connecting to\no (Optional) Select other network settings as appropriate for your\nenvironment\no Click Next\n9.\
    \ In the 4 - DNS tab/step:\no (Optional) Select other DNS settings as appropriate for your environment\no Click Next\n\
    10. In the 5 - Tags tab/step:\no (Optional) Set any tags that are relevant to your organization\no Click Next\n11. In\
    \ the 6 - Review + create tab/step:\no A validation attempt will be made and after a few moments it should\nindicate Validation\
    \ Passed - if it does not pass, double-check your\nsettings before beginning more in depth troubleshooting.\no If validation\
    \ has passed, click Create then wait for a few minutes for the\nscripted deployment to complete.\nRepeat the above procedure\
    \ for each Private Endpoint required within every Storage\nAccount.\nRemediate from PowerShell\n$storageAccount = Get-AzStorageAccount\
    \ -ResourceGroupName\n'<ResourceGroupName>' -Name '<storageaccountname>'\n$privateEndpointConnection = @{\n Name = 'connectionName'\n\
    \ PrivateLinkServiceId = $storageAccount.Id\n GroupID =\n\"blob|blob_secondary|file|file_secondary|table|table_secondary|queue|queue_se\n\
    condary|web|web_secondary|dfs|dfs_secondary\"\n}\n$privateLinkServiceConnection = New-AzPrivateLinkServiceConnection\n\
    @privateEndpointConnection\n$virtualNetDetails = Get-AzVirtualNetwork -ResourceGroupName\n'<ResourceGroupName>' -Name\
    \ '<name>'\n$privateEndpoint = @{\n ResourceGroupName = '<ResourceGroupName>'\n Name = '<PrivateEndpointName>'\n Location\
    \ = '<location>'\n Subnet = $virtualNetDetails.Subnets[0]\n PrivateLinkServiceConnection =\n$privateLinkServiceConnection\n\
    }\nNew-AzPrivateEndpoint @privateEndpoint\nRemediate from Azure CLI\naz network private-endpoint create --resource-group\
    \ <ResourceGroupName --\nlocation <location> --name <private endpoint name> --vnet-name <VNET Name> --\nsubnet <subnet\
    \ name> --private-connection-resource-id <storage account ID> --\nconnection-name <private link service connection name>\
    \ --group-id\n<blob|blob_secondary|file|file_secondary|table|table_secondary|queue|queue_se\ncondary|web|web_secondary|dfs|dfs_secondary>"
