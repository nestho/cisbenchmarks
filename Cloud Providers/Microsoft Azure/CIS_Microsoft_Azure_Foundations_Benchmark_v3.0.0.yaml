    \ values:\naz storage account create \\\n --name <storage-account> \\\n --resource-group <resource-group> \\\n --location\
    \ <location> \\\n --sku Standard_RAGRS \\\n --kind StorageV2 \\\n --require-infrastructure-encryption\nRemediate from\
    \ PowerShell\nReplace the information within <> with appropriate values:\nNew-AzStorageAccount -ResourceGroupName <resource_group>\
    \ `\n -AccountName <storage-account> `\n -Location <location> `\n -SkuName \"Standard_RAGRS\" `\n -Kind StorageV2 `\n\
    \ -RequireInfrastructureEncryption\nEnabling Infrastructure Encryption after Storage Account Creation\nIf infrastructure\
    \ encryption was not enabled on blob storage creation, there is no official\nway to enable it. Please see the additional\
    \ information section."
