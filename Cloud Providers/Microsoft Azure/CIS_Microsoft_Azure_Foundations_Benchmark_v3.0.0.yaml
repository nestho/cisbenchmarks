      2. For each listed Storage Account, perform the following check:

      3. Under the Security + networking heading, click on Networking.

      4. Click on the Private endpoint connections tab at the top of the networking

      window.

      5. Ensure that for each VNet that the Storage Account must be accessed from, a

      unique Private Endpoint is deployed and the Connection state for each Private

      Endpoint is Approved.

      Repeat the procedure for each Storage Account'
    severity: medium
- id: '4.10'
  title: Ensure Soft Delete is Enabled for Azure Containers and Blob Storage
  scoring: scored
  profile:
  - Level 1
  description: The Azure Storage blobs contain data like ePHI or Financial, which can be secret or personal. Data that is
    erroneously modified or deleted by an application or other storage account user will cause data loss or unavailability.
    It is recommended that both Azure Containers with attached Blob Storage and standalone containers with Blob Storage be
    made recoverable by enabling the soft delete configuration. This is to save and recover data when blobs or blob snapshots
    are deleted.
  rationale: Containers and Blob Storage data can be incorrectly deleted. An attacker/malicious user may do this deliberately
    in order to cause disruption. Deleting an Azure Storage blob causes immediate data loss. Enabling this configuration for
    Azure storage ensures that even if blobs/data were deleted from the storage account, Blobs/data objects are recoverable
    for a particular time which is set in the "Retention policies," ranging from 7 days to 365 days.
  impact: Additional storage costs may be incurred as snapshots are retained.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/blobs/storage-blob-soft-delete
  - 2. https://docs.microsoft.com/en-us/azure/storage/blobs/soft-delete-containeroverview
  page_start: 269
  audit_raw: "Audit from Azure Portal\n1. Go to Storage Accounts.\n2. For each Storage Account, under Data management, go\
    \ to Data protection.\n3. Ensure that Enable soft delete for blobs is checked.\n4. Ensure that Enable soft delete for\
    \ containers is checked.\n5. Ensure that the retention period for both is a sufficient length for your\norganization.\n\
    Audit from Azure CLI\nBlob Storage: Ensure that the output of the below command contains enabled status as\ntrue and days\
    \ is not empty or null\naz storage blob service-properties delete-policy show\n --account-name <storageAccount>\n --account-key\
    \ <accountkey>\nAzure Containers: Ensure that within containerDeleteRetentionPolicy, the\nenabled property is set to true.\n\
    az storage account blob-service-properties show\n --account-name <storageAccount>\n --resource-group <resourceGroup>"
  remediation: "Remediate from Azure Portal\n1. Go to Storage Accounts.\n2. For each Storage Account, under Data management,\
    \ go to Data protection.\n3. Check the box next to Enable soft delete for blobs.\n4. Check the box next to Enable soft\
    \ delete for containers.\n5. Set the retention period for both to a sufficient length for your organization.\n6. Click\
    \ Save.\nRemediate from Azure CLI\nUpdate blob storage retention days in below command\naz storage blob service-properties\
    \ delete-policy update --days-retained\n<RetentionDaysValue> --account-name <StorageAccountName> --account-key\n<AccountKey>\
    \ --enable true\nUpdate container retention with the below command\naz storage account blob-service-properties update\n\
    \ --enable-container-delete-retention true\n --container-delete-retention-days <days>\n --account-name <storageAccount>\n\
    \ --resource-group <resourceGroup>"
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Go to Storage Accounts.

      2. For each Storage Account, under Data management, go to Data protection.

      3. Ensure that Enable soft delete for blobs is checked.

      4. Ensure that Enable soft delete for containers is checked.

      5. Ensure that the retention period for both is a sufficient length for your

      organization.

      Audit from Azure CLI

      Blob Storage: Ensure that the output of the below command contains enabled status as

      true and days is not empty or null

      az storage blob service-p'
    severity: medium
- id: '4.11'
  title: Ensure Storage for Critical Data are Encrypted with Customer Managed Keys (CMK)
  scoring: manual
  profile:
  - Level 2
  description: Enable sensitive data encryption at rest using Customer Managed Keys (CMK) rather than Microsoft Managed keys.
  rationale: By default, data in the storage account is encrypted using Microsoft Managed Keys at rest. All Azure Storage
    resources are encrypted, including blobs, disks, files, queues, and tables. All object metadata is also encrypted. If
    you want to control and manage this encryption key yourself, however, you can specify a customer-managed key. That key
    is used to protect and control access to the key that encrypts your data. You can also choose to automatically update
    the key version used for Azure Storage encryption whenever a new version is available in the associated Key Vault. While
    it is possible to automate the assessment of this recommendation, the assessment status for this recommendation remains
    'Manual.' This is because the recommendation pertains to storage accounts that store critical data and is therefore not
    applicable to all storage accounts.
  impact: If the key expires by setting the 'activation date' and 'expiration date', the user must rotate the key manually.
    Using Customer Managed Keys may also incur additional man-hour requirements to create, store, manage, and protect the
    keys as needed.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/storage/common/storage-serviceencryption
  - 2. https://docs.microsoft.com/en-us/azure/security/fundamentals/data-encryptionbest-practices#protect-data-at-rest
  page_start: 272
  audit_raw: 'Audit from Azure Portal

