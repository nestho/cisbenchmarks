- id: '8.6'
  title: Ensure that 'Enable Data Access Authentication Mode' is 'Checked'
  scoring: scored
  profile:
  - Level 1
  description: Data Access Authentication Mode provides a method of uploading or exporting Virtual Machine Disks.
  rationale: Enabling data access authentication mode adds a layer of protection using an Entra ID role to further restrict
    users from creating and using Secure Access Signature (SAS) tokens for exporting a detached managed disk or virtual machine
    state. Users will need the Data operator for managed disk role within Entra ID in order to download a VHD or VM Guest
    state using a secure URL.
  impact: In order to apply this setting, the virtual machine to which the disk or disks are attached will need to be powered
    down and have their disk detached. Users without the Data operator for managed disk role within Entra ID will not be able
    to export VHD or VM Guest state using the secure download URL.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/virtual-machines/windows/downloadvhd?tabs=azure-portal#secure-downloads-and-uploads-with-microsoft-entra-id
  - 2. https://learn.microsoft.com/en-us/azure/virtual-machines/windows/downloadvhd?tabs=azure-portal#secure-downloads-and-uploads-with-microsoft-entra-id
