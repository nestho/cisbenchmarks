- id: '9.2'
  title: Ensure App Service Authentication is set up for apps in Azure App Service
  scoring: scored
  profile:
  - Level 2
  description: Azure App Service Authentication is a feature that can prevent anonymous HTTP requests from reaching a Web
    Application or authenticate those with tokens before they reach the app. If an anonymous request is received from a browser,
    App Service will redirect to a logon page. To handle the logon process, a choice from a set of identity providers can
    be made, or a custom authentication mechanism can be implemented.
  rationale: By Enabling App Service Authentication, every incoming HTTP request passes through it before being handled by
    the application code. It also handles authentication of users with the specified provider (Entra ID, Facebook, Google,
    Microsoft Account, and Twitter), validation, storing and refreshing of tokens, managing the authenticated sessions and
    injecting identity information into request headers. Disabling HTTP Basic Authentication functionality further ensures
    legacy authentication methods are disabled within the application.
  impact: This is only required for App Services which require authentication. Enabling on site like a marketing or support
    website will prevent unauthenticated access which would be undesirable. Adding Authentication requirement will increase
    cost of App Service and require additional security components to facilitate the authentication.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/app-service/app-service-authenticationoverview
  - 2. https://docs.microsoft.com/en-us/azure/role-based-access-control/built-inroles#website-contributor
  page_start: 488
  audit_raw: 'Audit from Azure Portal

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. Click on each App

    4. Under Settings section, Click on Authentication

    5. Ensure that App Service authentication set to Enabled (Will only appear

    once an Identity provider is set up/selected)

    6. Navigate back to the application blade

    7. Under Settings, click on Configuration

    8. Click on the ''General Settings'' tab

    9. Under Platform settings, ensure Basic Auth Publishing Credentials is

    set to Off

    Audit from Azure CLI

    To check App Service Authentication status for an existing app, run the following

    command (using authV1 extension),

    az webapp auth show --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME>

    --query enabled

    The output should return true if App Service authentication is set to On.

    If using the authV2 extension for the az webapp auth CLI, run the following command,

    az webapp auth show --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME>

    Ensure that the enabled setting under platform is set to true.

    To check whether the Basic Auth Publishing Credentials are disabled, issue the

    following commands,

    az resource show --resource-group <RESOURCE GROUP NAME> --name scm --

    namespace Microsoft.Web --resource-type basicPublishingCredentialsPolicies --

    parent sites/<APPLICATION NAME>

    az resource show --resource-group <RESOURCE GROUP NAME> --name ftp --

    namespace Microsoft.Web --resource-type basicPublishingCredentialsPolicies --

    parent sites/<APPLICATION NAME>

    Ensure allow is set to false under properties within the output of each of the above

    commands.

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

    associated Policy definition in Azure.

    If referencing a printed copy, you can search Policy IDs from this URL:

    https://portal.azure.com/#view/Microsoft_Azure_Policy/PolicyMenuBlade/~/Definitions

    • Policy ID: c75248c1-ea1d-4a9c-8fc9-29a6aabd5da8 - Name: ''Function apps

    should have authentication enabled''

    • Policy ID: 95bccee9-a7f8-4bec-9ee9-62c3473701fc - Name: ''App Service apps

    should have authentication enabled'''
  remediation: 'Remediate from Azure Portal

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. Click on each App

    4. Under Setting section, click on Authentication

    5. If no identity providers are set up, then click Add identity provider

    6. Choose other parameters as per your requirements and click on Add

    To disable the Basic Auth Publishing Credentials setting, perform the following

    steps:

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. Click on each App

    4. Under Settings, click on Configuration

    5. Click on the ''General Settings'' tab

    6. Under Platform settings, ensure Basic Auth Publishing Credentials is

    set to Off

    Remediate from Azure CLI

    To set App Service Authentication for an existing app, run the following command:

    az webapp auth update --resource-group <RESOURCE_GROUP_NAME> --name

    <APP_NAME> --enabled true

    Note

    In order to access App Service authentication settings for Web app using Microsoft

    API requires Website contributor permission at subscription level. A custom role can

    be created in place of Website contributor to provide more specific permission and

    maintain the principle of least privileged access.'
  checks:
  - type: manual_review
    info: 'Audit from Azure Portal

      1. Login to Azure Portal using https://portal.azure.com

      2. Go to App Services

      3. Click on each App

      4. Under Settings section, Click on Authentication

      5. Ensure that App Service authentication set to Enabled (Will only appear

      once an Identity provider is set up/selected)

      6. Navigate back to the application blade

      7. Under Settings, click on Configuration

      8. Click on the ''General Settings'' tab

      9. Under Platform settings, ensure Basic Auth Publishing Credentials is

      set to Off'
    severity: medium
- id: '9.3'
  title: Ensure 'FTP State' is set to 'FTPS Only' or 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: By default, App Services can be deployed over FTP. If FTP is required for an essential deployment workflow,
    FTPS should be required for FTP login for all App Services. If FTPS is not expressly required for the App, the recommended
    setting is Disabled.
  rationale: FTP is an unencrypted network protocol that will transmit data - including passwords - in clear-text. The use
    of this protocol can lead to both data and credential compromise, and can present opportunities for exfiltration, persistence,
    and lateral movement.
  impact: Any deployment workflows that rely on FTP or FTPs rather than the WebDeploy or HTTPs endpoints may be affected.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/app-service/deploy-ftp
  - 2. https://docs.microsoft.com/en-us/azure/app-service/overview-security
