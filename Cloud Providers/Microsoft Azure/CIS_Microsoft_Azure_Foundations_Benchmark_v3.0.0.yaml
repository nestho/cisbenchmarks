- id: '7.1'
  title: Ensure that RDP access from the Internet is evaluated and restricted
  scoring: scored
  profile:
  - Level 1
  description: Network security groups should be periodically evaluated for port misconfigurations. Where certain ports and
    protocols may be exposed to the Internet, they should be evaluated for necessity and restricted wherever they are not
    explicitly required.
  rationale: The potential security problem with using RDP over the Internet is that attackers can use various brute force
    techniques to gain access to Azure Virtual Machines. Once the attackers gain access, they can use a virtual machine as
    a launch point for compromising other machines on an Azure Virtual Network or even attack networked devices outside of
    Azure.
  impact: ''
  references:
  - 1. https://docs.microsoft.com/en-us/azure/security/azure-security-network-securitybest-practices#disable-rdpssh-access-to-azure-virtual-machines
  - 2. https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-networksecurity#ns-1-establish-network-segmentation-boundaries
  page_start: 432
  audit_raw: 'Audit from Azure Portal

    1. For each VM, open the Networking blade

    2. Verify that the INBOUND PORT RULES does not have a rule for RDP such as

    o port = 3389,

    o protocol = TCP OR ANY,

    o Source = Any OR Internet

    Audit from Azure CLI

    List Network security groups with corresponding non-default Security rules:

    az network nsg list --query [*].[name,securityRules]

    Ensure that none of the NSGs have security rule as below

    "access" : "Allow"

    "destinationPortRange" : "3389" or "*" or "[port range containing 3389]"

    "direction" : "Inbound"

    "protocol" : "TCP" or "*"

    "sourceAddressPrefix" : "*" or "0.0.0.0" or "<nw>/0" or "/0" or "internet" or

    "any"

    Audit from Azure Policy

    If referencing a digital copy of this Benchmark, clicking a Policy ID will open a link to the

