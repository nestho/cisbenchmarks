  description: Require administrators or appropriately delegated users to create new tenants.
  rationale: It is recommended to only allow an administrator to create new tenants. This prevent users from creating new
    Microsoft Entra ID or Azure AD B2C tenants and ensures that only authorized users are able to do so.
  impact: Enforcing this setting will ensure that only authorized users are able to create new tenants.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/active-directory/fundamentals/usersdefault-permissions
