    Location:location}"

    To create a new Java web application using the retrieved app service ID:

    az webapp create --resource-group <resource group name> --plan <app service

    plan ID> --name <app name> [--linux-fx-version <java run time version>] [--

    windows-fx-version <java run time version>]

    From PowerShell

    As of this writing, there is no way to update an existing application''s SiteConfig or set a

    new application''s SiteConfig settings during creation via PowerShell.

    From Azure Portal

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. Click on each App

    4. Under Setting section, Click on Configuration

    5. Set HTTP version to 2.0 under General settings

    NOTE: Most modern browsers support HTTP 2.0 protocol over TLS only, while nonencrypted traffic continues to use HTTP 1.1.
    To ensure that client browsers connect to

    your app with HTTP/2, either buy an App Service Certificate for your app''s custom

    domain or bind a third party certificate.

