- id: '3.4'
  title: Ensure the principle of least privilege is used when assigning roles to a Managed Identity
  scoring: manual
  profile:
  - Level 1
  description: When using either a user-assigned or system-assigned managed identity, those identities may require a role
    or privilege assignment to perform a desired function. The roles or privileges assigned to that identity should be assigned
    with the principle of least privilege in mind - the identity is given the minimum levels of access or permissions needed
    to perform the job.
  rationale: Threat actors may attempt to compromise service accounts as anomalous activity on these accounts can sometimes
    be more challenging to detect. Limiting the permissions or roles available to a managed identity or service account assists
    in mitigating the systemic exploitation that a service account can perform if compromised.
  impact: All service accounts should be inventoried and reviewed from time to time for necessity and role or privilege assignment.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/container-instances/container-instancesmanaged-identity
  - 2. https://learn.microsoft.com/en-us/azure/role-based-access-control/roleassignments-portal
