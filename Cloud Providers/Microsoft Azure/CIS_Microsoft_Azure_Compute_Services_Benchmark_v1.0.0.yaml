    [--windows-fx-version "PYTHON|<VERSION>"] [--linux-fx-version

    "PYTHON|<VERSION>"]

    From PowerShell

    As of this writing, there is no way to update an existing application''s SiteConfig or set

    the a new application''s SiteConfig settings during creation via PowerShell.

    From Azure Portal

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. Click on each App

    4. Under Settings section, click on Configuration

    5. Click on the General settings pane and ensure that for a Stack of Java the

    Major Version and Minor Version reflect a currently supported release, and that

    the Java web server version is set to the auto-update option.

    NOTE: No action is required if Java version is set to Off, as Java is not used by your

    web app.

    From Azure CLI

    To see the list of supported runtimes:

    az webapp list-runtimes

    To set a currently supported Java version for an existing app, run the following

    command:

    az webapp config set --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME>

    [--java-version <JAVA_VERSION> --java-container <JAVA_CONTAINER> --javacontainer-version <JAVA_CONTAINER_VERSION> [--windows-fx-version
    <java

    runtime version>] [--linux-fx-version <java runtime version version>]

    If creating a new web application to use a currently supported version of Java, run the

    following commands.

