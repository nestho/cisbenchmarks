- id: '21.5'
  title: Ensure that Only Approved Extensions Are Installed
  scoring: manual
  profile:
  - Level 1
  description: For added security, only install organization-approved extensions on VMs.
  rationale: Azure virtual machine extensions are small applications that provide post-deployment configuration and automation
    tasks on Azure virtual machines. These extensions run with administrative privileges and could potentially access anything
    on a virtual machine. The Azure Portal and community provide several such extensions. Each organization should carefully
    evaluate these extensions and ensure that only those that are approved for use are actually implemented.
  impact: Functionality by unsupported extensions will be disabled.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/virtual-machines/windows/extensionsfeatures
  - 2. https://docs.microsoft.com/en-us/powershell/module/az.compute/?view=azps7.5.0#vm-extensions
  page_start: 82
  audit_raw: 'From Azure Portal

    1. Go to Virtual machines.

    2. For each virtual machine, click on the server name to select it go to

    3. In the new column menu, under Settings Click on Extensions + applications.

    4. Ensure that all the listed extensions are approved by your organization for use.

    From Azure CLI

    Use the below command to list the extensions attached to a VM, and ensure the listed

    extensions are approved for use.

    az vm extension list --vm-name <vmName> --resource-group <sourceGroupName> --

    query [*].name

    From PowerShell

    Get a list of VMs.

    Get-AzVM

    For each VM run the following command.

    Get-AzVMExtension -ResourceGroupName <VM Resource Group> -VMName <VM Name>

    Review each Name, ExtensionType, and ProvisioningState to make sure no

    unauthorized extensions are installed on any virtual machines.'
  remediation: 'From Azure Portal

    1. Go to Virtual machines

    2. For each virtual machine, go to Settings

    3. Click on Extensions + applications

    4. If there are unapproved extensions, uninstall them.

    From Azure CLI

    From the audit command identify the unapproved extensions, and use the below CLI

    command to remove an unapproved extension attached to VM.

    az vm extension delete --resource-group <resourceGroupName> --vm-name

    <vmName> --name <extensionName>

    From PowerShell

    For each VM and each insecure extension from the Audit Procedure run the following

    command.

    Remove-AzVMExtension -ResourceGroupName <ResourceGroupName> -Name

    <ExtensionName> -VMName <VirtualMachineName>'
