  - 2. https://docs.microsoft.com/en-us/security/benchmark/azure/security-controls-v3posture-vulnerability-management#pv-3-establish-secure-configurations-forcompute-resources
  - 1. https://docs.microsoft.com/en-us/azure/app-service/web-sites-configure#generalsettings
  - 2. https://docs.microsoft.com/en-us/security/benchmark/azure/security-controls-v3posture-vulnerability-management#pv-7-rapidly-and-automatically-remediatesoftware-vulnerabilities
  page_start: 30
  audit_raw: 'From Azure Portal

    1. From Azure Portal open the Portal Menu in the top left

    2. Go to App Services

    3. Click on each App

    4. Under the Setting section, Click on Identity

    5. Under the System assigned pane, ensure that Status set to On

    From Azure CLI

    To check Register with Azure Active Directory feature status for an existing app, run the

    following command,

    az webapp identity show --resource-group <RESOURCE_GROUP_NAME> --name

    <APP_NAME> --query principalId

    The output should return unique Principal ID.

    If no output for the above command then Register with Azure Active Directory is not set.

    From PowerShell

    List the web apps.

    Get-AzWebApp

    For each web app run the following command.

    Get-AzWebapp -ResourceGroupName <app resource group> -Name <app name>

    Make sure the Identity setting contains a unique Principal ID

    Take note of the currently supported versions of PHP here:

    https://www.php.net/supported-versions.php

    From Azure Portal

    1. From Azure Home open the Portal Menu in the top left

    2. Go to App Services

    3. Click on each App

    4. Under Settings section, click on Configuration

    5. Click on the General settings pane, ensure that for a Stack of PHP the Major

    Version and Minor Version reflect a currently supported release.

    NOTE: No action is required If PHP version is set to Off as PHP is not used by your

    web app.

    From Azure CLI

    To check PHP version for an existing app, run the following command,

    az webapp config show --resource-group <RESOURCE_GROUP_NAME> --name

    <APP_NAME> --query "{LinuxFxVersion:linuxFxVersion,PHP_Version:phpVersion}"

    From PowerShell

    $application = Get-AzWebApp -ResourceGroupName <resource group name> -Name

    <app name>

    $application.SiteConfig | select-object LinuxFXVersion, phpVersion

    The output should return a currently supported version of PHP. Any other version of

    PHP would be considered a finding.

    NOTE: No action is required, If the output is empty as PHP is not used by your web

    app.

    Take note of the currently supported versions (given a status of "security") of Python

    here: https://devguide.python.org/versions/

    From Azure Console

    1. From Azure Home open the Portal Menu in the top left

    2. Go to App Services

    3. Click on each App

    4. Under Settings section, click on Configuration

    5. Click on the General settings pane and ensure that for a Stack of Python the

    Major version and Minor version reflect a currently supported release

    NOTE: No action is required if Python version is set to Off, as Python is not used by

    your web app.

    From Azure CLI

    To check Python version for an existing app, run the following command

    az webapp config show --resource-group <RESOURCE_GROUP_NAME> --name

    <APP_NAME> --query

    "{LinuxFxVersion:linuxFxVersion,WindowsFxVersion:windowsFxVersion,PythonVersi

    on:pythonVersion}

    The output should return the a currently supported version of Python.

    NOTE: No action is required if the output is empty, as Python is not used by your web

    app.

    From PowerShell

    $app = Get-AzWebApp -Name <app name> -ResourceGroup <resource group name>

    $app.SiteConfig |Select-Object LinuxFXVersion, WindowsFxVersion,

    PythonVersion

    Ensure the output of the above command shows a currently supported of Python.

    NOTE: No action is required if the output is empty, as Python is not used by your web

    app.

    Take note of currently supported version of Java here:

    https://www.oracle.com/java/technologies/java-se-support-roadmap.html

    From Azure Portal

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. Click on each App

    4. Under Settings section, click on Configuration

    5. Click on the General settings pane and ensure that for a Stack of Java the

    Major Version and Minor Version reflect a currently supported release, and that

    the Java web server version is set to the auto-update option.

    NOTE: No action is required if Java version is set to Off, as Java is not used by your

    web app.

    From Azure CLI

    To check Java version for an existing app, run the following command,

    az webapp config show --resource-group <RESOURCE_GROUP_NAME> --name

    <APP_NAME> --query "{LinuxFxVersion:linuxFxVersion,

    WindowsFxVersion:windowsFxVersion, JavaVersion:javaVersion,

    JavaContainerVersion:javaContainerVersion, JavaContainer:javaContainer}"

    The output should return a currently supported version of Java.

    From PowerShell

    For each application, store the application information within an object, and then

    interrogate the SiteConfig information for that application object.

    $app = Get-AzWebApp -Name <app name> -ResourceGroup <resource group name>

    $app.SiteConfig |Select-Object LinuxFXVersion, WindowsFxVersion, JavaVersion,

    JavaContainerVersion, JavaContainer

    Ensure the Java version used within the application is a currently supported version.

    From Azure Portal

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. Click on each App

    4. Under Setting section, Click on Configuration

    5. Ensure that HTTP Version set to 2.0 version under General settings

    NOTE: Most modern browsers support HTTP 2.0 protocol over TLS only, while nonencrypted traffic continues to use HTTP 1.1.
    To ensure that client browsers connect to

    your app with HTTP/2, either buy an App Service Certificate for your app''s custom

    domain or bind a third party certificate.

    From Azure CLI

    To check HTTP 2.0 version status for an existing app, run the following command,

    az webapp config show --resource-group <RESOURCE_GROUP_NAME> --name

    <APP_NAME> --query http20Enabled

    The output should return true if HTTPS 2.0 traffic value is set to On.

    From PowerShell

    For each application, run the following command:

    Get-AzWebApp -ResourceGroupName <app resource group> -Name <app name>

    |Select-Object -ExpandProperty SiteConfig

    If the value of the Http20Enabled setting is true, the application is compliant.

    Otherwise if the value of the Http20Enabled setting is false, the application is noncompliant.'
  remediation: 'From Azure Portal

