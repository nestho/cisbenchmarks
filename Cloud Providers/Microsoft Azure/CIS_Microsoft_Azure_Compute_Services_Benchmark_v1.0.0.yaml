- id: '3.3'
  title: Ensure a Managed Identity is used for interactions with other Azure services
  scoring: manual
  profile:
  - Level 1
  description: 'For containers that require access to other resources, or other resources accessing a container, an identity/credential
    may be required. The Managed Identity prevents needing to store credentials in code within the Container Instance. There
    are two types of Managed Identities for Container Instances: 1. System Assigned: System Assigned Managed Identities provide
    an infrastructure integrated identity which is unique to the resource. It assigned to the Container Instance and persists
    for the lifecycle of the resource. Permissions can be assigned, revoked, and tuned using Azure role-based access control.
    2. User Assigned: User Assigned Managed Identities are not unique to the resource, and exist as independent Azure resources
    with their own lifecycle. If a Container Identity is decommissioned, the User Assigned Managed Identity will need to be
    decommissioned separately. User Assigned Managed Identities are not necessarily unique, and can be used across multiple
    resources.'
  rationale: Identities or credentials stored within a Container Instance or the code running on the Container Instance introduce
    a risk of compromise. If that identity or credential is stored in plain text, the risk is further amplified.
  impact: To ensure that a Managed Identity is able to access a destination resource, the permissions and/or role assigned
    to that Managed Identity will need to be evaluated.
  references:
  - 1. https://learn.microsoft.com/en-us/security/benchmark/azure/baselines/containerinstances-security-baseline?toc=%2Fazure%2Fcontainerinstances%2FTOC.json#identity-management
  - 2. https://learn.microsoft.com/en-us/azure/container-instances/using-azurecontainer-registry-mi
  page_start: 55
  audit_raw: 'From Azure Portal

    For each Container Instance that uses an identity or credential:

    1. Open the Container Instances blade.

    2. Select a named container instance.

    3. Click on Identity under the Settings section.

    4. Review the System Assigned and User Assigned tabs for assigned identities:

    o If using System Assigned identities, ensure status is set to On.

    o If using User Assigned identities, ensure only necessary user identities are

    assigned.

    From Azure CLI

    Run the following command:

    az container list

    For each Container Instance that uses an identity or credential, ensure "identity": is

    not "null"'
