controls:
- id: '2.1'
  title: Ensure 'HTTPS Only' is set to `On`
  scoring: scored
  profile:
  - Level 1
  description: Azure App Service allows apps to run under both HTTP and HTTPS by default. Apps can be accessed by anyone using
    non-secure HTTP links by default. Non-secure HTTP requests can be restricted and all HTTP requests redirected to the secure
    HTTPS port. It is recommended to enforce HTTPS-only traffic.
  rationale: Enabling HTTPS-only traffic will redirect all non-secure HTTP requests to HTTPS ports. HTTPS uses the TLS/SSL
    protocol to provide a secure connection which is both encrypted and authenticated. It is therefore important to support
    HTTPS for the security benefits.
  impact: ''
  references:
  - 1. https://learn.microsoft.com/en-us/azure/app-service/overviewsecurity?source=recommendations#https-and-certificates
  - 2. https://docs.microsoft.com/en-us/security/benchmark/azure/security-controls-v3data-protection#dp-3-encrypt-sensitive-data-in-transit
  page_start: 17
  audit_raw: 'From Azure Portal

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. For each App Service

    4. Under Setting section, click on Configuration

    5. Under the General Settings tab, ensure that HTTPS Only is set to On under

    Platform Settings

    From Azure CLI

    To check HTTPS-only traffic value for an existing app, run the following command,

    az webapp show --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME> --

    query httpsOnly

    The output should return true if HTTPS-only traffic value is set to On.

    From PowerShell

    List all the web apps configured within the subscription.

    Get-AzWebApp | Select-Object ResourceGroup, Name, HttpsOnly

    For each web app review the HttpsOnly setting and make sure it is set to True.'
  remediation: 'From Azure Portal

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. For each App Service

    4. Under Setting section, click on Configuration

    5. Under the General Settings tab, set HTTPS Only to On under Platform Settings

    From Azure CLI

    To set HTTPS-only traffic value for an existing app, run the following command:

    az webapp update --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME> --

    set httpsOnly=true

    From PowerShell

    Set-AzWebApp -ResourceGroupName <RESOURCE_GROUP_NAME> -Name <APP_NAME> -

    HttpsOnly $true'
  checks:
  - type: manual_review
    info: 'From Azure Portal

      1. Login to Azure Portal using https://portal.azure.com

      2. Go to App Services

      3. For each App Service

      4. Under Setting section, click on Configuration

      5. Under the General Settings tab, ensure that HTTPS Only is set to On under

      Platform Settings

      From Azure CLI

      To check HTTPS-only traffic value for an existing app, run the following command,

      az webapp show --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME> --

      query httpsOnly

      The output should return true if HTTPS-only traf'
    severity: medium
- id: '2.2'
  title: Ensure App Service Authentication is set up for apps in Azure App Service
  scoring: scored
  profile:
  - Level 2
  description: Azure App Service Authentication is a feature that can prevent anonymous HTTP requests from reaching a Web
    Application or authenticate those with tokens before they reach the app. If an anonymous request is received from a browser,
    App Service will redirect to a logon page. To handle the logon process, a choice from a set of identity providers can
    be made, or a custom authentication mechanism can be implemented.
  rationale: By Enabling App Service Authentication, every incoming HTTP request passes through it before being handled by
    the application code. It also handles authentication of users with the specified provider (Azure Active Directory, Facebook,
    Google, Microsoft Account, and Twitter), validation, storing and refreshing of tokens, managing the authenticated sessions
    and injecting identity information into request headers.
  impact: This is only required for App Services which require authentication. Enabling on site like a marketing or support
    website will prevent unauthenticated access which would be undesirable. Adding Authentication requirement will increase
    cost of App Service and require additional security components to facilitate the authentication.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/app-service/app-service-authenticationoverview
  - 2. https://docs.microsoft.com/en-us/azure/role-based-access-control/built-inroles#website-contributor
  page_start: 19
  audit_raw: 'From Azure Portal

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. Click on each App

    4. Under Setting section, Click on Authentication

    5. Ensure that App Service authentication set to Enabled (Will only appear once

    an Identity provider is set up/selected)

    From Azure CLI

    To check App Service Authentication status for an existing app, run the following

    command,

    az webapp auth show --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME>

    --query enabled

    The output should return true if App Service authentication is set to On.'
  remediation: 'From Azure Portal

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. Click on each App

    4. Under Setting section, click on Authentication

    5. If no identity providers are set up, then click Add identity provider

    6. Choose other parameters as per your requirements and click on Add

    From Azure CLI

    To set App Service Authentication for an existing app, run the following command:

    az webapp auth update --resource-group <RESOURCE_GROUP_NAME> --name

    <APP_NAME> --enabled true

    Note

    In order to access App Service authentication settings for Web app using Microsoft

    API requires Website contributor permission at subscription level. A custom role can

    be created in place of Website contributor to provide more specific permission and

    maintain the principle of least privileged access.'
  checks:
  - type: manual_review
    info: 'From Azure Portal

      1. Login to Azure Portal using https://portal.azure.com

      2. Go to App Services

      3. Click on each App

      4. Under Setting section, Click on Authentication

      5. Ensure that App Service authentication set to Enabled (Will only appear once

      an Identity provider is set up/selected)

      From Azure CLI

      To check App Service Authentication status for an existing app, run the following

      command,

      az webapp auth show --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME>

      --query enabled

      The output sh'
    severity: medium
- id: '2.3'
  title: Ensure 'FTP State' is set to 'FTPS Only' or 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: By default, App Services can be deployed over FTP. If FTP is required for an essential deployment workflow,
    FTPS should be required for FTP login for all App Services. If FTPS is not expressly required for the App, the recommended
    setting is Disabled.
  rationale: FTP is an unencrypted network protocol that will transmit data - including passwords - in clear-text. The use
    of this protocol can lead to both data and credential compromise, and can present opportunities for exfiltration, persistence,
    and lateral movement.
  impact: Any deployment workflows that rely on FTP or FTPs rather than the WebDeploy or HTTPs endpoints may be affected.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/app-service/deploy-ftp
  - 2. https://docs.microsoft.com/en-us/azure/app-service/overview-security
  page_start: 22
  audit_raw: "From Azure Portal\n1. Go to the Azure Portal\n2. Select App Services\n3. Click on an app\n4. Select Settings\
    \ and then Configuration\n5. Under General Settings, for the Platform Settings, the FTP state should not\nbe set to All\
    \ allowed\nFrom Azure CLI\nList webapps to obtain the ids.\naz webapp list\nList the publish profiles to obtain the username,\
    \ password\nand ftp server url.\naz webapp deployment list-publishing-profiles --ids <ids>\n{\n \"publishUrl\": <URL_FOR_WEB_APP>,\n\
    \ \"userName\": <USER_NAME>,\n \"userPWD\": <USER_PASSWORD>,\n}\nFrom PowerShell\nList all Web Apps:\nGet-AzWebApp\nFor\
    \ each app:\nGet-AzWebApp -ResourceGroupName <resource group name> -Name <app name> |\nSelect-Object -ExpandProperty SiteConfig\n\
    In the output, look for the value of FtpsState. If its value is AllAllowed the setting is out\nof compliance. Any other\
    \ value is considered in compliance with this check."
  remediation: 'From Azure Portal

    1. Go to the Azure Portal

    2. Select App Services

    3. Click on an app

    4. Select Settings and then Configuration

    5. Under General Settings, for the Platform Settings, the FTP state should be

    set to Disabled or FTPS Only

    From Azure CLI

    For each out of compliance application, run the following choosing either ''disabled'' or

    ''FtpsOnly'' as appropriate:

    az webapp config set --resource-group <resource group name> --name <app name>

    --ftps-state [disabled|FtpsOnly]

    From PowerShell

    For each out of compliance application, run the following:

    Set-AzWebApp -ResourceGroupName <resource group name> -Name <app name> -

    FtpsState <Disabled or FtpsOnly>'
  checks:
  - type: manual_review
    info: "From Azure Portal\n1. Go to the Azure Portal\n2. Select App Services\n3. Click on an app\n4. Select Settings and\
      \ then Configuration\n5. Under General Settings, for the Platform Settings, the FTP state should not\nbe set to All\
      \ allowed\nFrom Azure CLI\nList webapps to obtain the ids.\naz webapp list\nList the publish profiles to obtain the\
      \ username, password\nand ftp server url.\naz webapp deployment list-publishing-profiles --ids <ids>\n{\n \"publishUrl\"\
      : <URL_FOR_WEB_APP>,\n \"userName\": <USER_NAME>,\n \"userPWD\""
    severity: medium
- id: '2.4'
  title: Ensure Web App is using the latest version of TLS encryption
  scoring: scored
  profile:
  - Level 1
  description: The TLS (Transport Layer Security) protocol secures transmission of data over the internet using standard encryption
    technology. Encryption should be set with the latest version of TLS. App service allows TLS 1.2 by default, which is the
    recommended TLS level by industry standards such as PCI DSS.
  rationale: App service currently allows the web app to set TLS versions 1.0, 1.1 and 1.2. It is highly recommended to use
    the latest TLS 1.2 version for web app secure connections.
  impact: ''
  references:
  - 1. https://docs.microsoft.com/en-us/azure/app-service/app-service-web-tutorialcustom-ssl#enforce-tls-versions
  - 2. https://docs.microsoft.com/en-us/security/benchmark/azure/security-controls-v3data-protection#dp-3-encrypt-sensitive-data-in-transit
  page_start: 25
  audit_raw: 'From Azure Portal

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. Click on each App

    4. Under Setting section, Click on TLS/SSL settings

    5. Under the Bindings pane, ensure that Minimum TLS Version set to 1.2 under

    Protocol Settings

    From Azure CLI

    To check TLS Version for an existing app, run the following command,

    az webapp config show --resource-group <RESOURCE_GROUP_NAME> --name

    <APP_NAME> --query minTlsVersion

    The output should return 1.2 if TLS Version is set to 1.2 (Which is currently the latest

    version).

    From PowerShell

    List all web apps.

    Get-AzWebApp

    For each web app run the following command.

    Get-AzWebApp -ResourceGroupName <RESOURCE_GROUP_NAME> -Name <APP_NAME>

    |Select-Object -ExpandProperty SiteConfig

    Make sure the minTlsVersion is set to at least 1.2.'
  remediation: 'From Azure Portal

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. Click on each App

    4. Under Setting section, Click on SSL settings

    5. Under the Bindings pane, set Minimum TLS Version to 1.2 under Protocol

    Settings section

    From Azure CLI

    To set TLS Version for an existing app, run the following command:

    az webapp config set --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME>

    --min-tls-version 1.2

    From PowerShell

    Set-AzWebApp -ResourceGroupName <RESOURCE_GROUP_NAME> -Name <APP_NAME> -

    MinTlsVersion 1.2'
  checks:
  - type: manual_review
    info: 'From Azure Portal

      1. Login to Azure Portal using https://portal.azure.com

      2. Go to App Services

      3. Click on each App

      4. Under Setting section, Click on TLS/SSL settings

      5. Under the Bindings pane, ensure that Minimum TLS Version set to 1.2 under

      Protocol Settings

      From Azure CLI

      To check TLS Version for an existing app, run the following command,

      az webapp config show --resource-group <RESOURCE_GROUP_NAME> --name

      <APP_NAME> --query minTlsVersion

      The output should return 1.2 if TLS Version is set '
    severity: medium
- id: '2.5'
  title: Ensure the web app has 'Client Certificates (Incoming client certificates)' set to 'On'
  scoring: scored
  profile:
  - Level 2
  description: Client certificates allow for the app to request a certificate for incoming requests. Only clients that have
    a valid certificate will be able to reach the app.
  rationale: The TLS mutual authentication technique in enterprise environments ensures the authenticity of clients to the
    server. If incoming client certificates are enabled, then only an authenticated client who has valid certificates can
    access the app.
  impact: Utilizing and maintaining client certificates will require additional work to obtain and manage replacement and
    key rotation.
  references:
  - 1. https://docs.microsoft.com/en-us/security/benchmark/azure/security-controls-v3identity-management#im-4-authenticate-server-and-services
  page_start: 28
  audit_raw: 'From Azure Portal

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. Click on each App

    4. Under the Settings section, Click on Configuration, then General settings

    5. Ensure that the option Client certificate mode located under Incoming client

    certificates is set to Require

    From Azure CLI

    To check Incoming client certificates value for an existing app, run the following

    command,

    az webapp show --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME> --

    query clientCertEnabled

    The output should return true if Incoming client certificates value is set to On.

    From PowerShell

    List all web apps.

    Get-AzWebApp

    For each web app run the following command.

    Get-AzWebApp -ResourceGroup <app resource group> -Name <app name>

    Make sure the ClientCertEnabled is set to True.'
  remediation: 'From Azure Portal

    1. Login to Azure Portal using https://portal.azure.com

    2. Go to App Services

    3. Click on each App

    4. Under the Settings section, Click on Configuration, then General settings

    5. Set the option Client certificate mode located under Incoming client

    certificates to Require

    From Azure CLI

    To set Incoming client certificates value for an existing app, run the following command:

    az webapp update --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME> --

    set clientCertEnabled=true'
  checks:
  - type: manual_review
    info: 'From Azure Portal

      1. Login to Azure Portal using https://portal.azure.com

      2. Go to App Services

      3. Click on each App

      4. Under the Settings section, Click on Configuration, then General settings

      5. Ensure that the option Client certificate mode located under Incoming client

      certificates is set to Require

      From Azure CLI

      To check Incoming client certificates value for an existing app, run the following

      command,

      az webapp show --resource-group <RESOURCE_GROUP_NAME> --name <APP_NAME> --

      query clientC'
    severity: medium
- id: '2.6'
  title: Ensure that Register with Azure Active Directory is enabled on App Service
  scoring: scored
  profile:
  - Level 1
  description: Managed service identity in App Service provides more security by eliminating secrets from the app, such as
    credentials in the connection strings. When registering with Azure Active Directory in App Service, the app will connect
    to other Azure services securely without the need for usernames and passwords. Periodically, older versions of PHP may
    be deprecated and no longer supported. Using a supported version of PHP for web apps is recommended to avoid potential
    unpatched vulnerabilities. Periodically, older versions of Python may be deprecated and no longer supported. Using a supported
    version of Python for web apps is recommended to avoid potential unpatched vulnerabilities. Periodically, older versions
    of Java may be deprecated and no longer supported. Using a supported version of Java for web apps is recommended to avoid
    potential unpatched vulnerabilities. Periodically, older versions of HTTP may be deprecated and no longer supported. Using
    a supported version of HTTP for web apps is recommended to avoid vulnerabilities from outdated protocols. HTTP 2.0 has
    additional performance improvements on the head-of-line blocking problem of old HTTP version, header compression, and
    prioritization of requests. HTTP 2.0 no longer supports HTTP 1.1's chunked transfer encoding mechanism, as it provides
    its own, more efficient, mechanisms for data streaming.
  rationale: App Service provides a highly scalable, self-patching web hosting service in Azure. It also provides a managed
    identity for apps, which is a turn-key solution for securing access to Azure SQL Database and other Azure services. Deprecated
    and unsupported versions of programming and scripting languages can present vulnerabilities which may not be addressed
    or may not be addressable. Deprecated and unsupported versions of programming and scripting languages can present vulnerabilities
    which may not be addressed or may not be addressable. Deprecated and unsupported versions of programming and scripting
    languages can present vulnerabilities which may not be addressed or may not be addressable. Deprecated and unsupported
    versions of protocols such as HTTP can present vulnerabilities which may not be addressed or may not be addressable.
  impact: If your app is written using version-dependent features or libraries, they may not be available on more recent versions.
    If you wish to update, research the impact thoroughly. If your app is written using version-dependent features or libraries,
    they may not be available on more recent versions. If you wish to update, research the impact thoroughly. If your app
    is written using version-dependent features or libraries, they may not be available on more recent versions. If you wish
    to update, research the impact thoroughly. Most modern browsers support HTTP 2.0 protocol over TLS only, while non-encrypted
    traffic continues to use HTTP 1.1. To ensure that client browsers connect to your app with HTTP/2, either buy an App Service
    Certificate for your app's custom domain or bind a third party certificate.
  references:
