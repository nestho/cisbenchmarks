      Get-AdminAuditL'
    severity: medium
- id: 3.1.2
  title: (L1) Ensure user role group changes are reviewed at least weekly
  scoring: manual
  profile:
  - E3 Level 1
  description: Role-Based Access Control allows for permissions to be assigned to users based on their roles within an organization.
    It is a more manageable form of access control that is less prone to errors. These user roles can be audited inside of
    Microsoft Purview to provide a security auditor insight into user privilege change.
  rationale: Weekly reviews provide an opportunity to identify rights changes in an organization and are a large part of maintaining
    Least Privilege and preventing Privilege creep. Insider Threats, either intentional or unintentional, can occur when a
    user has higher than needed privileges. Maintaining accountability of role membership will keep insiders and malicious
    actors limited in the scope of potential damaging activities.
  impact: By performing regular reviews, the Administrators assigning rights to users will need to inevitably provide justification
    for those changes to security auditors. Documentation that includes detailed policies, procedures, and change requests
    will need to be considered to keep a secure organization functioning within its planned operational level.
  references:
  - 1. https://learn.microsoft.com/en-us/powershell/module/exchange/searchunifiedauditlog?view=exchange-ps
  page_start: 126
  audit_raw: 'To verify user role group changes are being reviewed at least weekly, confirm that the

    necessary procedures are in place and being followed.'
  remediation: 'To review user role group changes:

    1. Navigate to Microsoft Purview https://compliance.microsoft.com/.

    2. Under Solutions click on Audit then select New Search.

    3. In Activities find Added member to Role under the Role administration

    activities section and select it.

    4. Set a valid Start Date and End Date within the last week.

    5. Click Search.

    6. Review once the search is completed.

    To review user role group changes using PowerShell:

    1. Connect to Exchange Online using Connect-ExchangeOnline

    2. Run the following Exchange Online PowerShell command:

    $startDate = ((Get-date).AddDays(-7)).ToShortDateString()

    $endDate = (Get-date).ToShortDateString()

    Search-UnifiedAuditLog -StartDate $startDate -EndDate $endDate -RecordType

    AzureActiveDirectory -Operations "Add member to role."

    3. Review the output.'
  checks:
  - type: manual_review
    info: 'To verify user role group changes are being reviewed at least weekly, confirm that the

      necessary procedures are in place and being followed.'
    severity: medium
- id: '3.2'
  title: Data loss protection 3.2.1 (L1) Ensure DLP policies are enabled
  scoring: manual
  profile:
  - E3 Level 1
  description: Data Loss Prevention (DLP) policies allow Exchange Online and SharePoint Online content to be scanned for specific
    types of data like social security numbers, credit card numbers, or passwords.
  rationale: Enabling DLP policies alerts users and administrators that specific types of data should not be exposed, helping
    to protect the data from accidental exposure.
  impact: Enabling a Teams DLP policy will allow sensitive data in Exchange Online and SharePoint Online to be detected or
    blocked. Always ensure to follow appropriate procedures during testing and implementation of DLP policies based on organizational
    standards.
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/compliance/dlp-learn-aboutdlp?view=o365-worldwide
  page_start: 128
  audit_raw: 'Ensure DLP policies are enabled:

