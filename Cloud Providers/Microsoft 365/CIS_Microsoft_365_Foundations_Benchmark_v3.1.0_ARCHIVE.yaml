- id: 7.2.1
  title: (L1) Ensure modern authentication for SharePoint applications is required
  scoring: scored
  profile:
  - E3 Level 1
  description: Modern authentication in Microsoft 365 enables authentication features like multifactor authentication (MFA)
    using smart cards, certificate-based authentication (CBA), and third-party SAML identity providers.
  rationale: Strong authentication controls, such as the use of multifactor authentication, may be circumvented if basic authentication
    is used by SharePoint applications. Requiring modern authentication for SharePoint applications ensures strong authentication
    mechanisms are used when establishing sessions between these applications, SharePoint, and connecting users.
  impact: Implementation of modern authentication for SharePoint will require users to authenticate to SharePoint using modern
    authentication. This may cause a minor impact to typical user behavior. This may also prevent third-party apps from accessing
    SharePoint Online resources. Also, this will also block apps using the SharePointOnlineCredentials class to access SharePoint
    Online resources.
