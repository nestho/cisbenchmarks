    , \"mst\", \"ocx\", \"odt\", \"ops\", \"oxps\", \"pcd\",\n \"pif\", \"plg\", \"pot\", \"potm\", \"ppa\", \"ppam\", \"\
    ppkg\", \"pps\", \"ppsm\", \"ppt\",\n \"pptm\", \"prf\", \"prg\", \"ps1\", \"ps11\", \"ps11xml\", \"ps1xml\", \"ps2\"\
    ,\n \"ps2xml\", \"psc1\", \"psc2\", \"pub\", \"py\", \"pyc\", \"pyo\", \"pyw\", \"pyz\",\n \"pyzw\", \"rar\", \"reg\"\
    , \"rev\", \"rtf\", \"scf\", \"scpt\", \"scr\", \"sct\",\n \"searchConnector-ms\", \"service\", \"settingcontent-ms\"\
    , \"sh\", \"shb\", \"shs\",\n \"shtm\", \"shtml\", \"sldm\", \"slk\", \"so\", \"spl\", \"stm\", \"svg\", \"swf\", \"sys\"\
    ,\n \"tar\", \"theme\", \"themepack\", \"timer\", \"uif\", \"url\", \"uue\", \"vb\", \"vbe\",\n \"vbs\", \"vhd\", \"vhdx\"\
