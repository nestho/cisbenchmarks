- id: 6.2.1
  title: (L1) Ensure all forms of mail forwarding are blocked and/or disabled
  scoring: scored
  profile:
  - E3 Level 1
  description: 'Exchange Online offers several methods of managing the flow of email messages. These are Remote domain, Transport
    Rules, and Anti-spam outbound policies. These methods work together to provide comprehensive coverage for potential automatic
    forwarding channels: • Outlook forwarding using inbox rules. • Outlook forwarding configured using OOF rule. • OWA forwarding
    setting (ForwardingSmtpAddress). • Forwarding set by the admin using EAC (ForwardingAddress). • Forwarding using Power
    Automate / Flow. Ensure a Transport rule and Anti-spam outbound policy are used to block mail forwarding. NOTE: Any exclusions
    should be implemented based on organizational policy.'
  rationale: Attackers often create these rules to exfiltrate data from your tenancy, this could be accomplished via access
    to an end-user account or otherwise. An insider could also use one of these methods as a secondary channel to exfiltrate
    sensitive data.
  impact: Care should be taken before implementation to ensure there is no business need for case-by-case auto-forwarding.
    Disabling auto-forwarding to remote domains will affect all users and in an organization. Any exclusions should be implemented
    based on organizational policy.
  references:
  - 1. https://learn.microsoft.com/en-us/exchange/policy-and-compliance/mail-flowrules/mail-flow-rule-procedures?view=exchserver-2019
  - 2. https://techcommunity.microsoft.com/t5/exchange-team-blog/all-you-need-toknow-about-automatic-email-forwarding-in/bap/2074888#:~:text=%20%20%20Automatic%20forwarding%20option%20%20,%
  page_start: 260
  audit_raw: 'Note: Audit is a two step procedure as follows:

    STEP 1: Transport rules

    To verify the mail transport rules do not forward email to external domains using

    the UI:

    1. Select Exchange to open the Exchange admin center.

    2. Select Mail Flow then Rules.

    3. Review the rules and verify that none of them are forwards or redirects e-mail to

    external domains.

    To audit using PowerShell:

    1. Connect to Exchange online using Connect-ExchangeOnline.

    2. Run the following PowerShell command to review the Transport Rules that are

    redirecting email:

    Get-TransportRule | Where-Object {$_.RedirectMessageTo -ne $null} | ft

    Name,RedirectMessageTo

    3. Verify that none of the addresses listed belong to external domains outside of the

    organization. If nothing returns then there are no transport rules set to redirect

    messages.

    STEP 2: Anti-spam outbound policy

    Ensure an anti-spam outbound policy is properly configured using the UI:

    1. Navigate to Microsoft 365 Defender https://security.microsoft.com/

    2. Expand E-mail & collaboration then select Policies & rules.

    3. Select Threat policies > Anti-spam.

    4. Inspect Anti-spam outbound policy (default) and ensure Automatic

    forwarding is set to Off - Forwarding is disabled

    5. Inspect any additional custom outbound policies and ensure Automatic

    forwarding is set to Off - Forwarding is disabled, in accordance with the

    organization''s exclusion policies.

    To audit using PowerShell:

    1. Connect to Exchange online using Connect-ExchangeOnline.

    2. Run the following PowerShell cmdlet:

    Get-HostedOutboundSpamFilterPolicy | ft Name, AutoForwardingMode

    3. In each outbound policy verify AutoForwardingMode is Off.

    Note: According to Microsoft if a recipient is defined in multiple policies of the same

    type (anti-spam, anti-phishing, etc.), only the policy with the highest priority is applied to

    the recipient. Any remaining policies of that type are not evaluated for the recipient

    (including the default policy). However, it is our recommendation to audit the default

    policy as well in the case a higher priority custom policy is removed. This will keep the

    organization''s security posture strong.'
  remediation: 'Note: Remediation is a two step procedure as follows:

    STEP 1: Transport rules

    To alter the mail transport rules so they do not forward email to external domains

    using the UI:

    1. Select Exchange to open the Exchange admin center.

    2. Select Mail Flow then Rules.

    3. For each rule that redirects email to external domains, select the rule and click

    the ''Delete'' icon.

    To remediate using PowerShell:

    1. Connect to Exchange Online using Connect-ExchangeOnline.

    2. Run the following PowerShell command:

    Remove-TransportRule {RuleName}

    STEP 2: Anti-spam outbound policy

    To configure an anti-spam outbound policy using the UI:

    1. Navigate to Microsoft 365 Defender https://security.microsoft.com/

    2. Expand E-mail & collaboration then select Policies & rules.

    3. Select Threat policies > Anti-spam.

    4. Select Anti-spam outbound policy (default)

    5. Click Edit protection settings

    6. Set Automatic forwarding rules dropdown to Off - Forwarding is disabled

    and click Save

    7. Repeat steps 4-6 for any additional higher priority, custom policies.

    To remediate using PowerShell:

    1. Connect to Exchange Online using Connect-ExchangeOnline.

    2. Run the following PowerShell command:

    Set-HostedOutboundSpamFilterPolicy -Identity {policyName} -AutoForwardingMode

    Off

    3. To remove AutoForwarding from all outbound policies you can also run:

    Get-HostedOutboundSpamFilterPolicy | Set-HostedOutboundSpamFilterPolicy -

    AutoForwardingMode Off'
  checks:
  - type: manual_review
    info: 'Note: Audit is a two step procedure as follows:

      STEP 1: Transport rules

