- id: 7.2.2
  title: (L1) Ensure SharePoint and OneDrive integration with Azure AD B2B is enabled
  scoring: scored
  profile:
  - E3 Level 1
  description: 'Entra ID B2B provides authentication and management of guests. Authentication happens via one-time passcode
    when they don''t already have a work or school account or a Microsoft account. Integration with SharePoint and OneDrive
    allows for more granular control of how guest user accounts are managed in the organization''s AAD, unifying a similar
    guest experience already deployed in other Microsoft 365 services such as Teams. Note: Global Reader role currently can''t
    access SharePoint using PowerShell.'
  rationale: External users assigned guest accounts will be subject to Entra ID access policies, such as multi-factor authentication.
    This provides a way to manage guest identities and control access to SharePoint and OneDrive resources. Without this integration,
    files can be shared without account registration, making it more challenging to audit and manage who has access to the
    organization's data.
  impact: B2B collaboration is used with other Entra services so should not be new or unusual. Microsoft also has made the
    experience seamless when turning on integration on SharePoint sites that already have active files shared with guest users.
    The referenced Microsoft article on the subject has more details on this.
  references:
  - 1. https://learn.microsoft.com/en-us/sharepoint/sharepoint-azureb2bintegration#enabling-the-integration
  - 2. https://learn.microsoft.com/en-us/azure/active-directory/external-identities/whatis-b2b
  page_start: 291
  audit_raw: 'To audit using PowerShell:

    1. Connect to SharePoint Online using Connect-SPOService

    2. Run the following command:

    Get-SPOTenant | ft EnableAzureADB2BIntegration

    3. Ensure the returned value is True.'
  remediation: 'To remediate using PowerShell:

    1. Connect to SharePoint Online using Connect-SPOService

    2. Run the following command:

    Set-SPOTenant -EnableAzureADB2BIntegration $true'
  checks:
  - type: manual_review
    info: 'To audit using PowerShell:

      1. Connect to SharePoint Online using Connect-SPOService

      2. Run the following command:

      Get-SPOTenant | ft EnableAzureADB2BIntegration

      3. Ensure the returned value is True.'
    severity: medium
- id: 7.2.3
  title: (L1) Ensure external content sharing is restricted
  scoring: scored
  profile:
  - E3 Level 1
  description: The external sharing settings govern sharing for the organization overall. Each site has its own sharing setting
    that can be set independently, though it must be at the same or more restrictive setting as the organization. The new
    and existing guests option requires people who have received invitations to sign in with their work or school account
    (if their organization uses Microsoft 365) or a Microsoft account, or to provide a code to verify their identity. Users
    can share with guests already in your organization's directory, and they can send invitations to people who will be added
    to the directory if they sign in. The recommended state is New and existing guests or less permissive.
  rationale: Forcing guest authentication on the organization's tenant enables the implementation of controls and oversight
    over external file sharing. When a guest is registered with the organization, they now have an identity which can be accounted
    for. This identity can also have other restrictions applied to it through group membership and conditional access rules.
  impact: When using B2B integration, Entra ID external collaboration settings, such as guest invite settings and collaboration
    restrictions apply.
  references:
  - 1. https://learn.microsoft.com/en-US/sharepoint/turn-external-sharing-on-oroff?WT.mc_id=365AdminCSH_spo
  - 2. https://learn.microsoft.com/en-us/powershell/module/sharepoint-online/setspotenant?view=sharepoint-ps
  page_start: 293
  audit_raw: 'To audit using the UI:

    1. Navigate to SharePoint admin center https://admin.microsoft.com/sharepoint

    2. Click to expand Policies > Sharing.

    3. Locate the External sharing section.

    4. Under SharePoint, ensure the slider bar is set to New and existing guests or a

    less permissive level.

    To audit using PowerShell:

    1. Connect to SharePoint Online service using Connect-SPOService.

    2. Run the following cmdlet:

    Get-SPOTenant | fl SharingCapability

    3. Ensure SharingCapability is set to one of the following values:

    o Value1: ExternalUserSharingOnly

    o Value2: ExistingExternalUserSharingOnly

    o Value3: Disabled'
  remediation: 'To remediate using the UI:

    1. Navigate to SharePoint admin center https://admin.microsoft.com/sharepoint

    2. Click to expand Policies > Sharing.

    3. Locate the External sharing section.

    4. Under SharePoint, move the slider bar to New and existing guests or a less

    permissive level.

    o OneDrive will also be moved to the same level and can never be more

    permissive than SharePoint.

    To remediate using PowerShell:

    1. Connect to SharePoint Online service using Connect-SPOService.

    2. Run the following cmdlet to establish the minimum recommended state:

    Set-SPOTenant -SharingCapability ExternalUserSharingOnly

    Note: Other acceptable values for this parameter that are more restrictive include:

    Disabled and ExistingExternalUserSharingOnly.'
  checks:
  - type: manual_review
    info: 'To audit using the UI:

      1. Navigate to SharePoint admin center https://admin.microsoft.com/sharepoint

      2. Click to expand Policies > Sharing.

      3. Locate the External sharing section.

      4. Under SharePoint, ensure the slider bar is set to New and existing guests or a

      less permissive level.

      To audit using PowerShell:

      1. Connect to SharePoint Online service using Connect-SPOService.

      2. Run the following cmdlet:

      Get-SPOTenant | fl SharingCapability

      3. Ensure SharingCapability is set to one of the followi'
    severity: medium
- id: 7.2.4
  title: (L2) Ensure OneDrive content sharing is restricted
  scoring: scored
  profile:
  - E3 Level 2
  description: This setting governs the global permissiveness of OneDrive content sharing in the organization. OneDrive content
    sharing can be restricted independent of SharePoint but can never be more permissive than the level established with SharePoint.
    The recommended state is Only people in your organization.
  rationale: OneDrive, designed for end-user cloud storage, inherently provides less oversight and control compared to SharePoint,
    which often involves additional content overseers or site administrators. This autonomy can lead to potential risks such
    as inadvertent sharing of privileged information by end users. Restricting external OneDrive sharing will require users
    to transfer content to SharePoint folders first which have those tighter controls.
  impact: Users will be required to take additional steps to share OneDrive content or use other official channels.
  references:
  - 1. https://learn.microsoft.com/en-us/sharepoint/dev/embedded/concepts/appconcepts/sharing-and-perm#container-partition
  page_start: 296
  audit_raw: 'To audit using the UI:

    1. Navigate to SharePoint admin center https://admin.microsoft.com/sharepoint

    2. Click to expand Policies > Sharing.

    3. Locate the External sharing section.

    4. Under OneDrive, ensure the slider bar is set to Only people in your

    organization.

    To audit using PowerShell:

    1. Connect to SharePoint Online service using Connect-SPOService.

    2. Run the following cmdlet:

    Get-SPOTenant | fl OneDriveSharingCapability

    3. Ensure the returned value is Disabled.

    Alternative audit method using PowerShell:

    1. Connect to SharePoint Online.

    2. Use one of the following methods:

    # Replace [tenant] with your tenant id

    Get-SPOSite -Identity https://[tenant]-my.sharepoint.com/ | fl

    Url,SharingCapability

    # Or run this to filter to the specific site without supplying the tenant

    name.

    $OneDriveSite = Get-SPOSite -Filter { Url -like "*-my.sharepoint.com/" }

    Get-SPOSite -Identity $OneDriveSite | fl Url,SharingCapability

    2. Ensure the returned value for SharingCapability is Disabled

    Note: As of March 2024, using Get-SPOSite with Where-Object or filtering against the

    entire site and then returning the SharingCapability parameter can result in a different

    value as opposed to running the cmdlet specifically against the OneDrive specific site

    using the -Identity switch as shown in the example.

    Note 2: The parameter OneDriveSharingCapability may not be yet fully available in all

    tenants. It is demonstrated in official Microsoft documentation as linked in the

    references section but not in the Set-SPOTenant cmdlet itself. If the parameter is

    unavailable, then either use the UI method or alternative PowerShell audit method.'
  remediation: 'To remediate using the UI:

    1. Navigate to SharePoint admin center https://admin.microsoft.com/sharepoint

    2. Click to expand Policies > Sharing.

    3. Locate the External sharing section.

    4. Under OneDrive, set the slider bar to Only people in your organization.

    To remediate using PowerShell:

