- id: 5.1.5.3
  title: (L1) Ensure the admin consent workflow is enabled
  scoring: manual
  profile:
  - E3 Level 1
  description: The admin consent workflow gives admins a secure way to grant access to applications that require admin approval.
    When a user tries to access an application but is unable to provide consent, they can send a request for admin approval.
    The request is sent via email to admins who have been designated as reviewers. A reviewer takes action on the request,
    and the user is notified of the action.
  rationale: The admin consent workflow (Preview) gives admins a secure way to grant access to applications that require admin
    approval. When a user tries to access an application but is unable to provide consent, they can send a request for admin
    approval. The request is sent via email to admins who have been designated as reviewers. A reviewer acts on the request,
    and the user is notified of the action.
  impact: To approve requests, a reviewer must be a global administrator, cloud application administrator, or application
    administrator. The reviewer must already have one of these admin roles assigned; simply designating them as a reviewer
    doesn't elevate their privileges.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/active-directory/manage-apps/configureadmin-consent-workflow
  page_start: 166
  audit_raw: 'Ensure the admin consent workflow is enabled:

    1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/.

