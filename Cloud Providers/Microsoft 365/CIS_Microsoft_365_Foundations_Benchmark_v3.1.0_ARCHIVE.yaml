- id: 5.1.5.2
  title: (L2) Ensure user consent to apps accessing company data on their behalf is not allowed
  scoring: scored
  profile:
  - E3 Level 2
  description: Control when end users and group owners are allowed to grant consent to applications, and when they will be
    required to request administrator review and approval. Allowing users to grant apps access to data helps them acquire
    useful applications and be productive but can represent a risk in some situations if it's not monitored and controlled
    carefully.
  rationale: Attackers commonly use custom applications to trick users into granting them access to company data. Disabling
    future user consent operations setting mitigates this risk, and helps to reduce the threat-surface. If user consent is
    disabled previous consent grants will still be honored but all future consent operations must be performed by an administrator.
  impact: If user consent is disabled, previous consent grants will still be honored but all future consent operations must
    be performed by an administrator. Tenant-wide admin consent can be requested by users through an integrated administrator
    consent request workflow or through organizational support processes.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/active-directory/manage-apps/configureuser-consent?tabs=azure-portal&pivots=portal
