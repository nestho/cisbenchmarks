  title: (L2) Enable Azure AD Identity Protection user risk policies
  scoring: manual
  profile:
  - E5 Level 2
  description: 'Microsoft Entra ID Protection user risk policies detect the probability that a user account has been compromised.
    Note: While Identity Protection also provides two risk policies with limited conditions, Microsoft highly recommends setting
    up risk-based policies in Conditional Access as opposed to the "legacy method" for the following benefits: • Enhanced
    diagnostic data • Report-only mode integration • Graph API support • Use more Conditional Access attributes like sign-in
    frequency in the policy'
  rationale: With the user risk policy turned on, Entra ID protection detects the probability that a user account has been
    compromised. Administrators can configure a user risk conditional access policy to automatically respond to a specific
    user risk level.
  impact: Upon policy activation, account access will be either blocked or the user will be required to use multi-factor authentication
    (MFA) and change their password. Users without registered MFA will be denied access, necessitating an admin to recover
    the account. To avoid inconvenience, it is advised to configure the MFA registration policy for all users under the User
    Risk policy. Additionally, users identified in the Risky Users section will be affected by this policy. To gain a better
    understanding of the impact on the organization's environment, the list of Risky Users should be reviewed before enforcing
    the policy.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/active-directory/identity-protection/howtoidentity-protection-risk-feedback
