- id: 5.2.3.2
  title: (L1) Ensure custom banned passwords lists are used
  scoring: manual
  profile:
  - E3 Level 1
  description: 'With Entra Password Protection, default global banned password lists are automatically applied to all users
    in an Entra ID tenant. To support business and security needs, custom banned password lists can be defined. When users
    change or reset their passwords, these banned password lists are checked to enforce the use of strong passwords. A custom
    banned password list should include some of the following examples: • Brand names • Product names • Locations, such as
    company headquarters • Company-specific internal terms • Abbreviations that have specific company meaning'
  rationale: Creating a new password can be difficult regardless of one's technical background. It is common to look around
    one's environment for suggestions when building a password, however, this may include picking words specific to the organization
    as inspiration for a password. An adversary may employ what is called a 'mangler' to create permutations of these specific
    words in an attempt to crack passwords or hashes making it easier to reach their goal.
  impact: If a custom banned password list includes too many common dictionary words, or short words that are part of compound
    words, then perfectly secure passwords may be blocked. The organization should consider a balance between security and
    usability when creating a list.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/active-directory/authentication/conceptpassword-ban-bad#custom-banned-password-list
  - 2. https://learn.microsoft.com/en-us/azure/active-directory/authentication/tutorialconfigure-custom-password-protection
  page_start: 211
  audit_raw: 'Ensure a custom banned password list is in place:

    1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/

    2. Click to expand Protection > Authentication methods

    3. Select Password protection

    4. Verify Enforce custom list is set to Yes

    5. Verify Custom banned password list contains entries specific to the organization

    or matches a pre-determined list.'
  remediation: 'Create a custom banned password list:

    1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/

    2. Click to expand Protection > Authentication methods

    3. Select Password protection

    4. Set Enforce custom list to Yes

    5. In Custom banned password list create a list using suggestions outlined in this

    document.

    6. Click Save

    NOTE: Below is a list of examples that can be used as a starting place. The references

    section contains more suggestions.

    • Brand names

    • Product names

    • Locations, such as company headquarters

    • Company-specific internal terms

    • Abbreviations that have specific company meaning'
  checks:
  - type: manual_review
    info: 'Ensure a custom banned password list is in place:

      1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/

      2. Click to expand Protection > Authentication methods

      3. Select Password protection

      4. Verify Enforce custom list is set to Yes

      5. Verify Custom banned password list contains entries specific to the organization

      or matches a pre-determined list.'
    severity: medium
- id: 5.2.3.3
  title: (L1) Ensure password protection is enabled for on-prem Active Directory
  scoring: manual
  profile:
  - E3 Level 1
  description: 'Microsoft Entra Password Protection provides a global and custom banned password list. A password change request
    fails if there''s a match in these banned password list. To protect on-premises Active Directory Domain Services (AD DS)
    environment, install and configure Entra Password Protection. Note: This recommendation applies to Hybrid deployments
    only and will have no impact unless working with on-premises Active Directory.'
  rationale: This feature protects an organization by prohibiting the use of weak or leaked passwords. In addition, organizations
    can create custom banned password lists to prevent their users from using easily guessed passwords that are specific to
    their industry. Deploying this feature to Active Directory will strengthen the passwords that are used in the environment.
  impact: The potential impact associated with implementation of this setting is dependent upon the existing password policies
    in place in the environment. For environments that have strong password policies in place, the impact will be minimal.
    For organizations that do not have strong password policies in place, implementation of Microsoft Entra Password Protection
    may require users to change passwords and adhere to more stringent requirements than they have been accustomed to.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/active-directory/authentication/howtopassword-ban-bad-on-premises-operations
  page_start: 214
  audit_raw: 'To audit using the UI:

