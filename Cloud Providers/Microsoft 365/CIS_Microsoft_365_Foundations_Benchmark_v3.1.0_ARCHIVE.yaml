- id: 5.1.3.1
  title: (L1) Ensure a dynamic group for guest users is created
  scoring: scored
  profile:
  - E3 Level 1
  description: A dynamic group is a dynamic configuration of security group membership for Microsoft Entra ID. Administrators
    can set rules to populate groups that are created in Entra ID based on user attributes (such as userType, department,
    or country/region). Members can be automatically added to or removed from a security group based on their attributes.
    The recommended state is to create a dynamic group that includes guest accounts.
  rationale: Dynamic groups allow for an automated method to assign group membership. Guest user accounts will be automatically
    added to this group and through this existing conditional access rules, access controls and other security measures will
    ensure that new guest accounts are restricted in the same manner as existing guest accounts.
  impact: ''
  references:
  - 1. https://learn.microsoft.com/en-us/azure/active-directory/enterprise-users/groupscreate-rule
  - 2. https://learn.microsoft.com/en-us/azure/active-directory/enterprise-users/groupsdynamic-membership
  page_start: 157
  audit_raw: 'Ensure a dynamic guest group is created:

    1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/.

    2. Click to expand Identity > Groups select All groups.

    3. On the right of the search field click Add filter.

    4. Set Filter to Membership type and Value to Dynamic then apply.

    5. Identify a dynamic group and select it.

    6. Under manage, select Dynamic membership rules and ensure the rule syntax

    contains (user.userType -eq "Guest")

    7. If necessary, inspect other dynamic groups for the value above.

    Using PowerShell:

    1. Connect to Microsoft Graph using Connect-MgGraph -Scopes "Group.Read.All"

    2. Run the following commands:

    $groups = Get-MgGroup | Where-Object { $_.GroupTypes -contains

    "DynamicMembership" }

    $groups | ft DisplayName,GroupTypes,MembershipRule

    3. Look for a dynamic group containing the rule (user.userType -eq "Guest")'
  remediation: "Create a dynamic guest group:\n1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/.\n\
    2. Click to expand Identity > Groups select All groups.\n3. Select New group and assign the following values:\no Group\
    \ type: Security\no Microsoft Entra roles can be assigned to the group: No\no Membership type: Dynamic User\n4. Select\
    \ Add dynamic query.\n5. Above the Rule syntax text box, select Edit.\n6. Place the following expression in the box:\n\
    (user.userType -eq \"Guest\")\n7. Select OK and Save\nUsing PowerShell:\n1. Connect to Microsoft Graph using Connect-MgGraph\
    \ -Scopes\n\"Group.ReadWrite.All\"\n2. In the script below edit DisplayName and MailNickname as needed and run:\n$params\
    \ = @{\n DisplayName = \"Dynamic Test Group\"\n MailNickname = \"DynGuestUsers\"\n MailEnabled = $false\n SecurityEnabled\
    \ = $true\n GroupTypes = \"DynamicMembership\"\n MembershipRule = '(user.userType -eq \"Guest\")'\n MembershipRuleProcessingState\
    \ = \"On\"\n}\nNew-MgGroup @params"
  checks:
  - type: manual_review
    info: 'Ensure a dynamic guest group is created:

      1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/.

      2. Click to expand Identity > Groups select All groups.

      3. On the right of the search field click Add filter.

      4. Set Filter to Membership type and Value to Dynamic then apply.

      5. Identify a dynamic group and select it.

      6. Under manage, select Dynamic membership rules and ensure the rule syntax

      contains (user.userType -eq "Guest")

      7. If necessary, inspect other dynamic groups for the'
    severity: medium
