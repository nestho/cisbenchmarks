      1. Log in to the server that hosts the Microsoft Entra Connect tool.

      2. Run Azure AD Connect, and then click Configure and View or export current

      configuration.

      3. Determine whether PASSWORD HASH S'
    severity: medium
- id: 5.2.2.1
  title: (L1) Ensure multifactor authentication is enabled for all users in administrative roles
  scoring: manual
  profile:
  - E3 Level 1
  description: Multifactor authentication is a process that requires an additional form of identification during the sign-in
    process, such as a code from a mobile device or a fingerprint scan, to enhance security. Ensure users in administrator
    roles have MFA capabilities enabled.
  rationale: Multifactor authentication requires an individual to present a minimum of two separate forms of authentication
    before access is granted. Multifactor authentication provides additional assurance that the individual attempting to gain
    access is who they claim to be. With multifactor authentication, an attacker would need to compromise at least two different
    authentication mechanisms, increasing the difficulty of compromise and thus reducing the risk.
  impact: Implementation of multifactor authentication for all users in administrative roles will necessitate a change to
    user routine. All users in administrative roles will be required to enroll in multifactor authentication using phone,
    SMS, or an authentication application. After enrollment, use of multifactor authentication will be required for future
    access to the environment.
  references:
  - 1. https://learn.microsoft.com/en-us/graph/api/resources/security-apioverview?view=graph-rest-beta
  page_start: 178
  audit_raw: 'To audit using the UI:

    1. Navigate to the Microsoft Entra admin center https://entra.microsoft.com.

    2. Click to expand Protection > Conditional Access select Policies.

    3. Review the list of policies and ensure that there is a policy meeting at least the

    following criteria:

    o Users: Include: Directory roles specific to administrators are selected.

    o Target resources: All cloud apps.

    o Grant: Grant access with Require multifactor authentication checked.

    4. Ensure Enable policy is set to On.

    To audit using SecureScore:

    1. Navigate to Microsoft 365 Defender https://security.microsoft.com.

    2. Select Secure score.

    3. Select Recommended actions.

    4. Click on Ensure multifactor authentication is enabled for all users in

    administrative roles.

    5. Review the number of Admin users who do not have MFA configured.

    This information is also available via the Microsoft Graph Security API:

    GET https://graph.microsoft.com/beta/security/secureScores

    Note: A list of required Directory roles can be found in the Remediation section.'
  remediation: 'To remediate using the UI:

    1. Navigate to the Microsoft Entra admin center https://entra.microsoft.com.

    2. Click expand Protection > Conditional Access select Policies.

    3. Click New policy.

    4. Go to Assignments > Users and groups > Include > Select users and groups >

    check Directory roles.

    5. At a minimum, select the Directory roles listed below in this section of the

    document.

    6. Go to Cloud apps or actions > Cloud apps > Include > select All cloud apps

    (and don''t exclude any apps).

    7. Under Access controls > Grant > select Grant access > check Require multifactor authentication.

    8. Set Enable policy to Report-only or On.

    9. Create.

    At minimum these directory roles should be included for MFA:

    • Application administrator

    • Authentication administrator

    • Billing administrator

    • Cloud application administrator

    • Conditional Access administrator

    • Exchange administrator

    • Global administrator

    • Global reader

    • Helpdesk administrator

    • Password administrator

    • Privileged authentication administrator

    • Privileged role administrator

    • Security administrator

    • SharePoint administrator

    • User administrator

    Note: Report-only is an acceptable first stage when introducing any CA policy. The

    control, however, is not complete until the policy is on.'
  checks:
  - type: manual_review
    info: 'To audit using the UI:

      1. Navigate to the Microsoft Entra admin center https://entra.microsoft.com.

      2. Click to expand Protection > Conditional Access select Policies.

      3. Review the list of policies and ensure that there is a policy meeting at least the

      following criteria:

      o Users: Include: Directory roles specific to administrators are selected.

      o Target resources: All cloud apps.

      o Grant: Grant access with Require multifactor authentication checked.

      4. Ensure Enable policy is set to On.

      To aud'
    severity: medium
- id: 5.2.2.2
  title: (L1) Ensure multifactor authentication is enabled for all users
  scoring: manual
  profile:
  - E3 Level 1
  description: Enable multifactor authentication for all users in the Microsoft 365 tenant. Users will be prompted to authenticate
    with a second factor upon logging in to Microsoft 365 services. The second factor is most commonly a text message to a
    registered mobile phone number where they type in an authorization code, or with a mobile application like Microsoft Authenticator.
  rationale: Multifactor authentication requires an individual to present a minimum of two separate forms of authentication
    before access is granted. Multifactor authentication provides additional assurance that the individual attempting to gain
    access is who they claim to be. With multifactor authentication, an attacker would need to compromise at least two different
    authentication mechanisms, increasing the difficulty of compromise and thus reducing the risk.
  impact: 'Implementation of multifactor authentication for all users will necessitate a change to user routine. All users
    will be required to enroll in multifactor authentication using phone, SMS, or an authentication application. After enrollment,
    use of multifactor authentication will be required for future authentication to the environment. Note: Organizations that
    have difficulty enforcing MFA globally due lack of the budget to provide company owned mobile devices to every user, or
    equally are unable to force end users to use their personal devices due to regulations, unions, or policy have another
    option. FIDO2 Security keys may be used as a stand in for this recommendation. They are more secure, phishing resistant,
    and are affordable for an organization to issue to every end user.'
