- id: 5.2.2.8
  title: (L1) Ensure admin center access is limited to administrative roles
  scoring: manual
  profile:
  - E3 Level 1
  description: 'When a Conditional Access policy targets the Microsoft Admin Portals cloud app, the policy is enforced for
    tokens issued to application IDs of the following Microsoft administrative portals: • Azure portal • Exchange admin center
    • Microsoft 365 admin center • Microsoft 365 Defender portal • Microsoft Entra admin center • Microsoft Intune admin center
    • Microsoft Purview compliance portal • Power Platform admin center • SharePoint admin center • Microsoft Teams admin
    center Microsoft Admin Portals should be restricted to specific pre-determined administrative roles.'
  rationale: By default, users can sign into the various portals but are restricted by what they can view. Blocking sign-in
    to Microsoft Admin Portals enhances security of sensitive data by restricting access to privileged users. This mitigates
    potential exposure due to administrative errors or software vulnerabilities introduced by a CSP, as well as acting as
    a defense in depth measure against security breaches.
  impact: PIM functionality will be impacted unless non-privileged users are first assigned to a permanent group or role that
    is excluded from this policy. When attempting to checkout a role in the Entra ID PIM area they will receive the message
    "You don't have access to this Your sign-in was successful but you don't have permission to access this resource."
  references:
  - 1. https://learn.microsoft.com/en-us/entra/identity/conditional-access/conceptconditional-access-cloud-apps#microsoft-admin-portals
  page_start: 203
  audit_raw: 'To audit using the UI:

