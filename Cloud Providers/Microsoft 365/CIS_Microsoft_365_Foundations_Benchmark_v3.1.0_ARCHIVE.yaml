      4. Select User tags

      5. Select the PRIORITY ACCOUNT tag and click Edit

      6. Verify the assigned members match the organization''s defined priority ac'
    severity: medium
- id: 2.4.2
  title: (L1) Ensure Priority accounts have 'Strict protection' presets applied
  scoring: manual
  profile:
  - E5 Level 1
  description: 'Preset security policies have been established by Microsoft, utilizing observations and experiences within
    datacenters to strike a balance between the exclusion of malicious content from users and limiting unwarranted disruptions.
    These policies can apply to all, or select users and encompass recommendations for addressing spam, malware, and phishing
    threats. The policy parameters are pre-determined and non-adjustable. Strict protection has the most aggressive protection
    of the 3 presets. • EOP: Anti-spam, Anti-malware and Anti-phishing • Defender: Spoof protection, Impersonation protection
    and Advanced phishing • Defender: Safe Links and Safe Attachments NOTE: The preset security polices cannot target Priority
    account TAGS currently, groups should be used instead.'
  rationale: Enabling priority account protection for users in Microsoft 365 is necessary to enhance security for accounts
    with access to sensitive data and high privileges, such as CEOs, CISOs, CFOs, and IT admins. These priority accounts are
    often targeted by spear phishing or whaling attacks and require stronger protection to prevent account compromise. The
    implementation of stringent, pre-defined policies may result in instances of false positive, however, the benefit of requiring
    the end-user to preview junk email before accessing their inbox outweighs the potential risk of mistakenly perceiving
    a malicious email as safe due to its placement in the inbox.
  impact: Strict policies are more likely to cause false positives in anti-spam, phishing, impersonation, spoofing and intelligence
    responses.
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/security/office-365security/preset-security-policies?view=o365-worldwide
  - 2. https://learn.microsoft.com/en-us/microsoft-365/security/office-365security/security-recommendations-for-priority-accounts
  page_start: 114
  audit_raw: 'Verify strict preset security policies have been applied to Priority accounts:

    1. Navigate to Microsoft 365 Defender https://security.microsoft.com/

    2. Select to expand E-mail & collaboration.

    3. Select Policies & rules > Threat policies.

    4. From here visit each section in turn: Anti-phishing Anti-spam Anti-malware Safe

    Attachments Safe Links

    5. Ensure in each there is a policy named Strict Preset Security Policy which

    includes the organization''s priority Accounts/Groups.'
  remediation: 'Enable strict preset security policies for Priority accounts:

    1. Navigate to Microsoft 365 Defender https://security.microsoft.com/

    2. Select to expand E-mail & collaboration.

    3. Select Policies & rules > Threat policies > Preset security policies.

    4. Click to Manage protection settings for Strict protection preset.

    5. For Apply Exchange Online Protection select at minimum Specific recipients

    and include the Accounts/Groups identified as Priority Accounts.

    6. For Apply Defender for Office 365 Protection select at minimum Specific

    recipients and include the Accounts/Groups identified as Priority Accounts.

    7. For Impersonation protection click Next and add valid e-mails or priority

    accounts both internal and external that may be subject to impersonation.

    8. For Protected custom domains add the organization''s domain name, along side

    other key partners.

    9. Click Next and finally Confirm'
  checks:
  - type: manual_review
    info: 'Verify strict preset security policies have been applied to Priority accounts:

      1. Navigate to Microsoft 365 Defender https://security.microsoft.com/

      2. Select to expand E-mail & collaboration.

      3. Select Policies & rules > Threat policies.

      4. From here visit each section in turn: Anti-phishing Anti-spam Anti-malware Safe

      Attachments Safe Links

      5. Ensure in each there is a policy named Strict Preset Security Policy which

      includes the organization''s priority Accounts/Groups.'
    severity: medium
- id: 2.4.3
  title: (L2) Ensure Microsoft Defender for Cloud Apps is enabled and configured
  scoring: manual
  profile:
  - E5 Level 2
  description: 'Microsoft Defender for Cloud Apps is a Cloud Access Security Broker (CASB). It provides visibility into suspicious
    activity in Microsoft 365, enabling investigation into potential security issues and facilitating the implementation of
    remediation measures if necessary. Some risk detection methods provided by Entra Identity Protection also require Microsoft
    Defender for Cloud Apps: • Suspicious manipulation of inbox rules • Suspicious inbox forwarding • New country detection
    • Impossible travel detection • Activity from anonymous IP addresses • Mass access to sensitive files'
  rationale: Security teams can receive notifications of triggered alerts for atypical or suspicious activities, see how the
    organization's data in Microsoft 365 is accessed and used, suspend user accounts exhibiting suspicious activity, and require
    users to log back in to Microsoft 365 apps after an alert has been triggered.
  impact: ''
  references:
  - 1. https://learn.microsoft.com/en-us/defender-cloud-apps/connect-office-365
  - 2. https://learn.microsoft.com/en-us/defender-cloud-apps/connect-azure
  page_start: 117
  audit_raw: 'Ensure Microsoft Defender for Cloud Apps is enabled and configured:

    1. Navigate to Microsoft 365 Defender https://security.microsoft.com/

    2. Select Settings > Cloud apps.

    3. Scroll to Connected apps and select App connectors.

    4. Ensure that Microsoft 365 and Microsoft Azure both show in the list as

    Connected.

    5. Go to Cloud Discovery > Microsoft Defender for Endpoint and check if the

    integration is enabled.

    6. Go to Information Protection > Files and verify Enable file monitoring is

    checked.'
  remediation: 'Configure Information Protection and Cloud Discovery:

    1. Navigate to Microsoft 365 Defender https://security.microsoft.com/

    2. Select Settings > Cloud apps.

    3. Scroll to Information Protection and select Files.

    4. Check Enable file monitoring.

    5. Scroll up to Cloud Discovery and select Microsoft Defender for Endpoint.

    6. Check Enforce app access, configure a Notification URL and Save.

    Note: Defender for Endpoint requires a Defender for Endpoint license.

    Configure App Connectors:

    1. Scroll to Connected apps and select App connectors.

    2. Click on Connect an app and select Microsoft 365.

    3. Check all Azure and Office 365 boxes then click Connect Office 365.

    4. Repeat for the Microsoft Azure application.'
