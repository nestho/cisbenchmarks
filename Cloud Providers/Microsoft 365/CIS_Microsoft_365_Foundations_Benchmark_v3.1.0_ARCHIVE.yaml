    in attendance. Anonymous users and dial-in callers must wait in the lobby until the meeting is started by someone in the
    organization or an external user from a trusted organization. Anonymous participants are classified as: • Participants
    who are not logged in to Teams with a work or school account. • Participants from non-trusted organizations (as configured
    in external access). • Participants from organizations where there is not mutual trust. Note: This setting only applies
    when Who can bypass the lobby is set to Everyone. If the anonymous users can join a meeting organization-level setting
    or meeting policy is Off, this setting only applies to dial-in callers.'
  rationale: Not allowing anonymous participants to automatically join a meeting reduces the risk of meeting spamming.
  impact: Anonymous participants will not be able to start a Microsoft Teams meeting.
