    3. Under Security select Consent and permissions.

    4. Under Manage select Admin consent settings.

    5. Verify that Users can request admin consent to apps they are unable to

    consent to is set to Yes.'
  remediation: 'To enable the admin consent workflow, use the Microsoft 365 Admin Center:

    1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/.

    2. Click to expand Identity > Applications select Enterprise applications.

    3. Under Security select Consent and permissions.

    4. Under Manage select Admin consent settings.

    5. Set Users can request admin consent to apps they are unable to consent

    to to Yes under Admin consent requests.

    6. Under the Reviewers choose the Roles and Groups that will review user

    generated app consent requests.

    7. Set Selected users will receive email notifications for requests to Yes

    8. Select Save at the top of the window.'
