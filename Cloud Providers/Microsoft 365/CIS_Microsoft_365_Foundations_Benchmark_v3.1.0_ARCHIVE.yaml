- id: 5.2.2.3
  title: (L1) Enable Conditional Access policies to block legacy authentication
  scoring: manual
  profile:
  - E3 Level 1
  description: 'Entra ID supports the most widely used authentication and authorization protocols including legacy authentication.
    This authentication pattern includes basic authentication, a widely used industry-standard method for collecting username
    and password information. The following messaging protocols support legacy authentication: • Authenticated SMTP - Used
    to send authenticated email messages. • Autodiscover - Used by Outlook and EAS clients to find and connect to mailboxes
    in Exchange Online. • Exchange ActiveSync (EAS) - Used to connect to mailboxes in Exchange Online. • Exchange Online PowerShell
    - Used to connect to Exchange Online with remote PowerShell. If you block Basic authentication for Exchange Online PowerShell,
    you need to use the Exchange Online PowerShell Module to connect. For instructions, see Connect to Exchange Online PowerShell
    using multifactor authentication. • Exchange Web Services (EWS) - A programming interface that''s used by Outlook, Outlook
    for Mac, and third-party apps. • IMAP4 - Used by IMAP email clients. • MAPI over HTTP (MAPI/HTTP) - Primary mailbox access
    protocol used by Outlook 2010 SP2 and later. • Offline Address Book (OAB) - A copy of address list collections that are
    downloaded and used by Outlook. • Outlook Anywhere (RPC over HTTP) - Legacy mailbox access protocol supported by all current
    Outlook versions. • POP3 - Used by POP email clients. • Reporting Web Services - Used to retrieve report data in Exchange
    Online. • Universal Outlook - Used by the Mail and Calendar app for Windows 10. • Other clients - Other protocols identified
    as utilizing legacy authentication.'
  rationale: 'Legacy authentication protocols do not support multi-factor authentication. These protocols are often used by
    attackers because of this deficiency. Blocking legacy authentication makes it harder for attackers to gain access. NOTE:
    As of October 2022 Microsoft began disabling basic authentication in all tenants, except for those who requested special
    exceptions it should no longer be available in most tenants beyond Dec 31, 2022. Despite this CIS recommends the CA policy
    to remain in place to act as a defense in depth measure.'
  impact: 'Enabling this setting will prevent users from connecting with older versions of Office, ActiveSync or using protocols
    like IMAP, POP or SMTP and may require upgrades to older versions of Office, and use of mobile mail clients that support
    modern authentication. This will also cause multifunction devices such as printers from using scan to e-mail function
    if they are using a legacy authentication method. Microsoft has mail flow best practices in the link below which can be
    used to configure a MFP to work with modern authentication: https://learn.microsoft.com/en-us/exchange/mail-flow-best-practices/how-to-set-up-amultifunction-device-or-application-to-send-email-using-microsoft-365-or-office-365'
  references:
  - 1. https://learn.microsoft.com/en-us/exchange/clients-and-mobile-in-exchangeonline/disable-basic-authentication-in-exchange-online
  - 2. https://learn.microsoft.com/en-us/exchange/mail-flow-best-practices/how-to-setup-a-multifunction-device-or-application-to-send-email-using-microsoft-365-oroffice-365
  page_start: 185
