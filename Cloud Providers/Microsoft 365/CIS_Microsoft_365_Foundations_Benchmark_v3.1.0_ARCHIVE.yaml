- id: 2.4.4
  title: (L1) Ensure Zero-hour auto purge for Microsoft Teams is on
  scoring: scored
  profile:
  - E5 Level 1
  description: Zero-hour auto purge (ZAP) is a protection feature that retroactively detects and neutralizes malware and high
    confidence phishing. When ZAP for Teams protection blocks a message, the message is blocked for everyone in the chat.
    The initial block happens right after delivery, but ZAP occurs up to 48 hours after delivery.
  rationale: ZAP is intended to protect users that have received zero-day malware messages or content that is weaponized after
    being delivered to users. It does this by continually monitoring spam and malware signatures taking automated retroactive
    action on messages that have already been delivered.
  impact: As with any anti-malware or anti-phishing product false positives may occur.
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/security/office-365-security/zerohour-auto-purge?view=o365-worldwide#zero-hour-auto-purge-zap-in-microsoftteams
  - 2. https://learn.microsoft.com/en-us/microsoft-365/security/office-365-security/mdosupport-teams-about?view=o365-worldwide#configure-zap-for-teams-protectionin-defender-for-office-365-plan-2
  page_start: 120
  audit_raw: 'To audit using the UI:

    1. Navigate to Microsoft Defender https://security.microsoft.com/

    2. Click Settings > Email & collaboration > Microsoft Teams protection.

    3. Ensure Zero-hour auto purge (ZAP) is set to On (Default)

    4. Under Exclude these participants review the list of exclusions and ensure they

    are justified and within tolerance for the organization.

    To audit using PowerShell:

    1. Connect to Exchange Online using Connect-ExchangeOnline.

    2. Run the following cmdlets:

    Get-TeamsProtectionPolicy | fl ZapEnabled

    Get-TeamsProtectionPolicyRule | fl ExceptIf*

    3. Ensure ZapEnabled is True.

    4. Review the list of exclusions and ensure they are justified and within tolerance for

    the organization. If nothing returns from the 2nd cmdlet then there are no

    exclusions defined.'
  remediation: 'To remediate using the UI:

    1. Navigate to Microsoft Defender https://security.microsoft.com/

    2. Click Settings > Email & collaboration > Microsoft Teams protection.

    3. Set Zero-hour auto purge (ZAP) to On (Default)

    To remediate using PowerShell:

    1. Connect to Exchange Online using Connect-ExchangeOnline.

    2. Run the following cmdlet:

    Set-TeamsProtectionPolicy -Identity "Teams Protection Policy" -ZapEnabled

    $true'
  checks:
  - type: manual_review
    info: 'To audit using the UI:

      1. Navigate to Microsoft Defender https://security.microsoft.com/

      2. Click Settings > Email & collaboration > Microsoft Teams protection.

      3. Ensure Zero-hour auto purge (ZAP) is set to On (Default)

      4. Under Exclude these participants review the list of exclusions and ensure they

      are justified and within tolerance for the organization.

      To audit using PowerShell:

      1. Connect to Exchange Online using Connect-ExchangeOnline.

      2. Run the following cmdlets:

      Get-TeamsProtectionPoli'
    severity: medium
- id: 3.1.1
  title: (L1) Ensure Microsoft 365 audit log search is Enabled
  scoring: scored
  profile:
  - E3 Level 1
  description: When audit log search is enabled in the Microsoft Purview compliance portal, user and admin activity within
    the organization is recorded in the audit log and retained for 90 days. However, some organizations may prefer to use
    a third-party security information and event management (SIEM) application to access their auditing data. In this scenario,
    a global admin can choose to turn off audit log search in Microsoft 365.
  rationale: Enabling audit log search in the Microsoft Purview compliance portal can help organizations improve their security
    posture, meet regulatory compliance requirements, respond to security incidents, and gain valuable operational insights.
  impact: ''
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/compliance/audit-log-enabledisable?view=o365-worldwide
  - 2. https://learn.microsoft.com/en-us/powershell/module/exchange/setadminauditlogconfig?view=exchange-ps
  page_start: 124
  audit_raw: 'Ensure Microsoft 365 audit log search is Enabled:

    1. Navigate to Microsoft Purview https://compliance.microsoft.com.

    2. Select Audit to open the audit search.

    3. Choose a date and time frame in the past 30 days.

    4. Verify search capabilities (e.g. try searching for Activities as Accessed file and

    results should be displayed).

    To verify audit log search is enabled using PowerShell:

    1. Connect to Exchange Online using Connect-ExchangeOnline.

    2. Run the following PowerShell command:

    Get-AdminAuditLogConfig | Select-Object UnifiedAuditLogIngestionEnabled

    3. Ensure UnifiedAuditLogIngestionEnabled is set to True.'
  remediation: 'To enable Microsoft 365 audit log search:

    1. Navigate to Microsoft Purview https://compliance.microsoft.com.

    2. Select Audit to open the audit search.

    3. Click Start recording user and admin activity next to the information warning

    at the top.

    4. Click Yes on the dialog box to confirm.

    To enable Microsoft 365 audit log search using PowerShell:

    1. Connect to Exchange Online using Connect-ExchangeOnline.

    2. Run the following PowerShell command:

    Set-AdminAuditLogConfig -UnifiedAuditLogIngestionEnabled $true'
  checks:
  - type: manual_review
    info: 'Ensure Microsoft 365 audit log search is Enabled:

