- id: 8.1.1
  title: (L2) Ensure external file sharing in Teams is enabled for only approved cloud storage services
  scoring: scored
  profile:
  - E3 Level 2
  description: 'Microsoft Teams enables collaboration via file sharing. This file sharing is conducted within Teams, using
    SharePoint Online, by default; however, third-party cloud services are allowed as well. Note: Skype for business is deprecated
    as of July 31, 2021 although these settings may still be valid for a period of time. See the link in the references section
    for more information.'
  rationale: Ensuring that only authorized cloud storage providers are accessible from Teams will help to dissuade the use
    of non-approved storage providers.
  impact: The impact associated with this change is highly dependent upon current practices in the tenant. If users do not
    use other storage providers, then minimal impact is likely. However, if users do regularly utilize providers outside of
    the tenant this will affect their ability to continue to do so.
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/enterprise/manage-skype-forbusiness-online-with-microsoft-365-powershell?view=o365-worldwide
  page_start: 327
  audit_raw: 'To audit using the UI:

    1. Navigate to Microsoft Teams admin center https://admin.teams.microsoft.com.

    2. Click to expand Teams select Teams settings.

    3. Under files verify that only authorized cloud storage options are set to On and all

    others Off.

    To audit using PowerShell:

    1. Connect to Teams PowerShell using Connect-MicrosoftTeams

    2. Run the following to verify the recommended state:

    Get-CsTeamsClientConfiguration | fl

    AllowDropbox,AllowBox,AllowGoogleDrive,AllowShareFile,AllowEgnyte

    3. Verify that only authorized providers are set to True and all others False.'
  remediation: "To set external file sharing in Teams:\n1. Navigate to Microsoft Teams admin center https://admin.teams.microsoft.com.\n\
    2. Click to expand Teams select Teams settings.\n3. Set any unauthorized providers to Off.\nTo set cloud sharing options\
    \ using PowerShell:\n1. Connect to Teams PowerShell using Connect-MicrosoftTeams\n2. Run the following PowerShell command\
    \ to disable external providers that are not\nauthorized. (the example disables Citrix Files, DropBox, Box, Google Drive\
    \ and\nEgnyte)\n$storageParams = @{\n AllowGoogleDrive = $false\n AllowShareFile = $false\n AllowBox = $false\n AllowDropBox\
    \ = $false\n AllowEgnyte = $false\n}\nSet-CsTeamsClientConfiguration @storageParams"
