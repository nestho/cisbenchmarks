- id: 3.2.2
  title: (L1) Ensure DLP policies are enabled for Microsoft Teams
  scoring: manual
  profile:
  - E5 Level 1
  description: The default Teams Data Loss Prevention (DLP) policy rule in Microsoft 365 is a preconfigured rule that is automatically
    applied to all Teams conversations and channels. The default rule helps prevent accidental sharing of sensitive information
    by detecting and blocking certain types of content that are deemed sensitive or inappropriate by the organization. By
    default, the rule includes a check for the sensitive info type Credit Card Number which is pre-defined by Microsoft.
  rationale: Enabling the default Teams DLP policy rule in Microsoft 365 helps protect an organization's sensitive information
    by preventing accidental sharing or leakage Credit Card information in Teams conversations and channels. DLP rules are
    not one size fits all, but at a minimum something should be defined. The organization should identify sensitive information
    important to them and seek to intercept it using DLP.
  impact: End-users may be prevented from sharing certain types of content, which may require them to adjust their behavior
    or seek permission from administrators to share specific content. Administrators may receive requests from end-users for
    permission to share certain types of content or to modify the policy to better fit the needs of their teams.
  references:
  - 1. https://learn.microsoft.com/en-us/powershell/exchange/connect-to-sccpowershell?view=exchange-ps
  - 2. https://learn.microsoft.com/en-us/purview/dlp-teams-default-policy?view=o365worldwide%2F1000
  page_start: 131
  audit_raw: "To audit the using the UI:\n1. Navigate to Microsoft Purview compliance portal\nhttps://compliance.microsoft.com.\n\
    2. Under Solutions select Data loss prevention then Policies.\n3. Locate the Default policy for Teams.\n4. Verify the\
    \ Status is On.\n5. Verify Locations include Teams chat and channel messages - All accounts.\n6. Verify Policy settings\
    \ incudes the Default Teams DLP policy rule or one\nspecific to the organization.\nNote: If there is not a default policy\
    \ for teams inspect existing policies starting with step\n4. DLP rules are specific to the organization and each organization\
    \ should take steps to\nprotect the data that matters to them. The default teams DLP rule will only alert on\nCredit Card\
    \ matches.\nTo audit using PowerShell:\n1. Connect to the Security & Compliance PowerShell using Connect-IPPSSession.\n\
    2. Run the following to return policies that include Teams chat and channel\nmessages:\n$DlpPolicy = Get-DlpCompliancePolicy\n\
    $DlpPolicy | Where-Object {$_.Workload -match \"Teams\"} |\n ft Name,Mode,TeamsLocation*\n3. If nothing returns then there\
    \ are no policies that include Teams and remediation\nis required.\n4. For any returned policy verify Mode is set to Enable.\n\
    5. Verify TeamsLocation includes All.\n6. Verify TeamsLocationException includes only permitted exceptions.\nNote: Some\
    \ tenants may not have a default policy for teams as Microsoft started\ncreating these by default at a particular point\
    \ in time. In this case a new policy will have\nto be created that includes a rule to protect data important to the organization\
    \ such as\ncredit cards and PII."
  remediation: 'To remediate using the UI:

    1. Navigate to Microsoft Purview compliance portal

    https://compliance.microsoft.com.

    2. Under Solutions select Data loss prevention then Policies.

    3. Click Policies tab.

    4. Check Default policy for Teams then click Edit policy.

    5. The edit policy window will appear click Next

    6. At the Choose locations to apply the policy page, turn the status toggle to On

    for Teams chat and channel messages location and then click Next.

    7. On Customized advanced DLP rules page, ensure the Default Teams DLP

    policy rule Status is On and click Next.

    8. On the Policy mode page, select the radial for Turn it on right away and click

    Next.

    9. Review all the settings for the created policy on the Review your policy and

    create it page, and then click submit.

    10. Once the policy has been successfully submitted click Done.

    Note: Some tenants may not have a default policy for teams as Microsoft started

    creating these by default at a particular point in time. In this case a new policy will have

    to be created that includes a rule to protect data important to the organization such as

    credit cards and PII.'
  checks:
  - type: manual_review
    info: 'To audit the using the UI:

      1. Navigate to Microsoft Purview compliance portal

      https://compliance.microsoft.com.

      2. Under Solutions select Data loss prevention then Policies.

      3. Locate the Default policy for Teams.

      4. Verify the Status is On.

      5. Verify Locations include Teams chat and channel messages - All accounts.

      6. Verify Policy settings incudes the Default Teams DLP policy rule or one

      specific to the organization.

      Note: If there is not a default policy for teams inspect existing policies st'
    severity: medium
- id: 3.3.1
  title: (L1) Ensure SharePoint Online Information Protection policies are set up and used
  scoring: manual
  profile:
  - E3 Level 1
  description: SharePoint Online Data Classification Policies enables organizations to classify and label content in SharePoint
    Online based on its sensitivity and business impact. This setting helps organizations to manage and protect sensitive
    data by automatically applying labels to content, which can then be used to apply policy-based protection and governance
    controls.
  rationale: By categorizing and applying policy-based protection, SharePoint Online Data Classification Policies can help
    reduce the risk of data loss or exposure and enable more effective incident response if a breach does occur.
  impact: The creation of data classification policies is unlikely to have a significant impact on an organization. However,
    maintaining long-term adherence to policies may require ongoing training and compliance efforts across the organization.
    Therefore, organizations should include training and compliance planning as part of the data classification policy creation
    process.
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/compliance/data-classificationoverview?view=o365-worldwide#top-sensitivity-labels-applied-to-content
  - 2. https://learn.microsoft.com/en-us/purview/sensitivity-labels-sharepoint-onedrivefiles
