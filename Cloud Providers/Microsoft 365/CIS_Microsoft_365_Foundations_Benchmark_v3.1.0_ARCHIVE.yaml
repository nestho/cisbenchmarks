- id: 5.2.3.4
  title: (L1) Ensure all member users are 'MFA capable'
  scoring: manual
  profile:
  - E3 Level 1
  description: Microsoft defines Multifactor authentication capable as being registered and enabled for a strong authentication
    method. The method must also be allowed by the authentication methods policy. Ensure all member users are MFA capable.
  rationale: Multifactor authentication requires an individual to present a minimum of two separate forms of authentication
    before access is granted. Users who are not MFA Capable have never registered a strong authentication method for multifactor
    authentication that is within policy and may not be using MFA. This could be a result of having never signed in, exclusion
    from a Conditional Access (CA) policy requiring MFA, or a CA policy does not exist. Reviewing this list of users will
    help identify possible lapses in policy or procedure.
  impact: When using the UI audit method guest users will appear in the report and unless the organization is applying MFA
    rules to guests then they will need to be manually filtered. Accounts that provide on-premises directory synchronization
    also appear in these reports.
  references:
  - 1. https://learn.microsoft.com/enus/powershell/module/microsoft.graph.reports/updatemgreportauthenticationmethoduserregistrationdetail?view=graph-powershell1.0#-ismfacapable
  - 2. https://learn.microsoft.com/en-us/entra/identity/monitoring-health/how-to-viewapplied-conditional-access-policies
  page_start: 216
  audit_raw: "To audit using the UI:\n1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/.\n2. Click\
    \ to expand Protection select Authentication methods.\n3. Select User registration details.\n4. Set the filter option\
    \ Multifactor authentication capable to Not Capable.\n5. Review the non-guest users in this list.\n6. Excluding any exceptions\
    \ users found in this report may require remediation.\nTo audit using PowerShell:\n1. Connect to Graph using Connect-MgGraph\
    \ -Scopes\n\"UserAuthenticationMethod.Read.All,AuditLog.Read.All\"\n2. Run the following:\nGet-MgReportAuthenticationMethodUserRegistrationDetail\
    \ `\n -Filter \"IsMfaCapable eq false and UserType eq 'Member'\" |\n ft UserPrincipalName,IsMfaCapable,IsAdmin\n3. Ensure\
    \ IsMfaCapable is set to True.\n4. Excluding any exceptions users found in this report may require remediation.\nNote:\
    \ The CA rule must be in place for a successful deployment of Multifactor\nAuthentication. This policy is outlined in\
    \ the conditional access section 5.2.2\nNote 2: Possible exceptions include on-premises synchronization accounts."
  remediation: 'Remediation steps will depend on the status of the personnel in question or

    configuration of Conditional Access policies and will not be covered in detail.

    Administrators should review each user identified on a case-by-case basis using the

    conditions below.

    User has never signed on:

    • Employment status should be reviewed, and appropriate action taken on the user

    account''s roles, licensing and enablement.

    Conditional Access policy applicability:

    • Ensure a CA policy is in place requiring all users to use MFA.

    • Ensure the user is not excluded from the CA MFA policy.

    • Ensure the policy''s state is set to On.

    • Use What if to determine applicable CA policies. (Protection > Conditional

    Access > Policies)

    • Review the user account in Sign-in logs. Under the Activity Details pane

    click the Conditional Access tab to view applied policies.

    Note: Conditional Access is covered step by step in section 5.2.2'
  checks:
  - type: manual_review
    info: 'To audit using the UI:

      1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/.

      2. Click to expand Protection select Authentication methods.

      3. Select User registration details.

      4. Set the filter option Multifactor authentication capable to Not Capable.

      5. Review the non-guest users in this list.

      6. Excluding any exceptions users found in this report may require remediation.

      To audit using PowerShell:

      1. Connect to Graph using Connect-MgGraph -Scopes

      "UserAuthenticationMethod.Re'
    severity: medium
- id: 5.2.4.1
  title: (L1) Ensure 'Self service password reset enabled' is set to 'All'
  scoring: manual
  profile:
  - E3 Level 1
  description: 'Enabling self-service password reset allows users to reset their own passwords in Entra ID. When users sign
    in to Microsoft 365, they will be prompted to enter additional contact information that will help them reset their password
    in the future. If combined registration is enabled additional information, outside of multi-factor, will not be needed.
    NOTE: Effective Oct. 1st, 2022, Microsoft will begin to enable combined registration for all users in Entra ID tenants
    created before August 15th, 2020. Tenants created after this date are enabled with combined registration by default.'
  rationale: Users will no longer need to engage the helpdesk for password resets, and the password reset mechanism will automatically
    block common, easily guessable passwords.
  impact: 'Users will be required to provide additional contact information to enroll in self-service password reset. Additionally,
    minor user education may be required for users that are used to calling a help desk for assistance with password resets.
    NOTE: This is unavailable if using Entra Connect / Sync in a hybrid environment.'
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/admin/add-users/let-users-resetpasswords?view=o365-worldwide
  - 2. https://learn.microsoft.com/en-us/azure/active-directory/authentication/tutorialenable-sspr
