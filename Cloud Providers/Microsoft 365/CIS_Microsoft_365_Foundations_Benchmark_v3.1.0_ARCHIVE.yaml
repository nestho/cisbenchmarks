- id: 2.1.14
  title: (L2) Ensure comprehensive attachment filtering is applied
  scoring: scored
  profile:
  - E3 Level 2
  description: The Common Attachment Types Filter lets a user block known and custom malicious file types from being attached
    to emails. The policy provided by Microsoft covers 53 extensions, and an additional custom list of extensions can be defined.
    The list of 187 extensions provided in this recommendation is comprehensive but not exhaustive.
  rationale: Blocking known malicious file types can help prevent malware-infested files from infecting a host or performing
    other malicious attacks such as phishing and data extraction. Defining a comprehensive list of attachments can help protect
    against additional unknown and known threats. Many legacy file formats, binary files and compressed files have been used
    as delivery mechanisms for malicious software. Organizations can protect themselves from Business E-mail Compromise (BEC)
    by allow-listing only the file types relevant to their line of business and blocking all others.
  impact: For file types that are business necessary users will need to use other organizationally approved methods to transfer
    blocked extension types between business partners.
  references:
  - 1. https://learn.microsoft.com/en-us/powershell/module/exchange/getmalwarefilterpolicy?view=exchange-ps
  - 2. https://learn.microsoft.com/en-us/microsoft-365/security/office-365-security/antimalware-policies-configure?view=o365-worldwide
  page_start: 98
  audit_raw: "Note: Utilizing the UI for auditing Anti-malware policies can be very time consuming so\nit is recommended to\
    \ use a script like the one supplied below.\nTo Audit using PowerShell:\n1. Connect to Exchange Online using Connect-ExchangeOnline.\n\
    2. Run the following script:\n# Evaluate each Malware policy containing over 120 extensions\n# Output a report showing\
    \ a list of missing extensions and other params.\n$L2Extensions = @(\n \"7z\", \"a3x\", \"ace\", \"ade\", \"adp\", \"\
    ani\", \"app\", \"appinstaller\",\n \"applescript\", \"application\", \"appref-ms\", \"appx\", \"appxbundle\", \"arj\"\
    ,\n \"asd\", \"asx\", \"bas\", \"bat\", \"bgi\", \"bz2\", \"cab\", \"chm\", \"cmd\", \"com\",\n \"cpl\", \"crt\", \"cs\"\
    , \"csh\", \"daa\", \"dbf\", \"dcr\", \"deb\",\n \"desktopthemepackfile\", \"dex\", \"diagcab\", \"dif\", \"dir\", \"\
    dll\", \"dmg\",\n \"doc\", \"docm\", \"dot\", \"dotm\", \"elf\", \"eml\", \"exe\", \"fxp\", \"gadget\", \"gz\",\n \"hlp\"\
    , \"hta\", \"htc\", \"htm\", \"htm\", \"html\", \"html\", \"hwpx\", \"ics\", \"img\",\n \"inf\", \"ins\", \"iqy\", \"\
    iso\", \"isp\", \"jar\", \"jnlp\", \"js\", \"jse\", \"kext\",\n \"ksh\", \"lha\", \"lib\", \"library-ms\", \"lnk\", \"\
    lzh\", \"macho\", \"mam\", \"mda\",\n \"mdb\", \"mde\", \"mdt\", \"mdw\", \"mdz\", \"mht\", \"mhtml\", \"mof\", \"msc\"\
    , \"msi\",\n \"msix\", \"msp\", \"msrcincident\", \"mst\", \"ocx\", \"odt\", \"ops\", \"oxps\", \"pcd\",\n \"pif\", \"\
    plg\", \"pot\", \"potm\", \"ppa\", \"ppam\", \"ppkg\", \"pps\", \"ppsm\", \"ppt\",\n \"pptm\", \"prf\", \"prg\", \"ps1\"\
    , \"ps11\", \"ps11xml\", \"ps1xml\", \"ps2\",\n \"ps2xml\", \"psc1\", \"psc2\", \"pub\", \"py\", \"pyc\", \"pyo\", \"\
    pyw\", \"pyz\",\n \"pyzw\", \"rar\", \"reg\", \"rev\", \"rtf\", \"scf\", \"scpt\", \"scr\", \"sct\",\n \"searchConnector-ms\"\
    , \"service\", \"settingcontent-ms\", \"sh\", \"shb\", \"shs\",\n \"shtm\", \"shtml\", \"sldm\", \"slk\", \"so\", \"spl\"\
    , \"stm\", \"svg\", \"swf\", \"sys\",\n \"tar\", \"theme\", \"themepack\", \"timer\", \"uif\", \"url\", \"uue\", \"vb\"\
    , \"vbe\",\n \"vbs\", \"vhd\", \"vhdx\", \"vxd\", \"wbk\", \"website\", \"wim\", \"wiz\", \"ws\", \"wsc\",\n \"wsf\",\
    \ \"wsh\", \"xla\", \"xlam\", \"xlc\", \"xll\", \"xlm\", \"xls\", \"xlsb\", \"xlsm\",\n \"xlt\", \"xltm\", \"xlw\", \"\
    xml\", \"xnk\", \"xps\", \"xsl\", \"xz\", \"z\"\n)\n$MissingCount = 0\n$ExtensionPolicies = $null\n$RLine = $ExtensionReport\
    \ = @()\n$FilterRules = Get-MalwareFilterRule\n$DateTime = $(((Get-Date).ToUniversalTime()).ToString(\"yyyyMMddTHHmmssZ\"\
    ))\n$OutputFilePath = \"$PWD\\CIS-Report_$($DateTime).txt\"\n$RLine += \"$(Get-Date)`n\"\nfunction Test-MalwarePolicy\
    \ {\n param (\n $PolicyId\n )\n # Find the matching rule for custom policies\n $FoundRule = $null\n $FoundRule = $FilterRules\
    \ |\n Where-Object { $_.MalwareFilterPolicy -eq $PolicyId }\n if ($PolicyId.EnableFileFilter -eq $false) {\n $script:RLine\
    \ += \"WARNING: Common attachments filter is disabled.\"\n }\n if ($FoundRule.State -eq 'Disabled') {\n $script:RLine\
    \ += \"WARNING: The Anti-malware rule is disabled.\"\n }\n $script:RLine += \"`nManual review needed - Domains, inclusions\
    \ and\nexclusions must be valid:\"\n $script:RLine += $FoundRule |\n Format-List Name, RecipientDomainIs, Sent*, Except*\n\
    }\n# Match any policy that has over 120 extensions defined\n$ExtensionPolicies = Get-MalwareFilterPolicy |\n Where-Object\
    \ {$_.FileTypes.Count -gt 120 }\nif (!$ExtensionPolicies) {\n Write-Host \"`nFAIL: A policy containing the minimum number\
    \ of extensions\nwas not found.\" -ForegroundColor Red\n Write-Host \"Only policies with over 120 extensions defined will\
    \ be\nevaluated.\" -ForegroundColor Red\n Exit\n}\n# Check each policy for missing extensions\nforeach ($policy in $ExtensionPolicies)\
    \ {\n $MissingExtensions = $L2Extensions |\n Where-Object {\n $extension = $_; -not $policy.FileTypes.Contains($extension)\n\
    \ }\n if ($MissingExtensions.Count -eq 0) {\n $RLine += \"-\" * 60\n $RLine += \"[FOUND] $($policy.Identity)\"\n $RLine\
    \ += \"-\" * 60\n $RLine += \"PASS: Policy contains all extensions\"\n Test-MalwarePolicy -PolicyId $policy\n } else {\n\
    \ $MissingCount++\n $ExtensionReport += @{\n Identity = $policy.Identity\n MissingExtensions = $MissingExtensions -join\
    \ ', '\n }\n }\n}\nif ($MissingCount -gt 0) {\n foreach ($fpolicy in $ExtensionReport) {\n $RLine += \"-\" * 60\n $RLine\
    \ += \"[PARTIAL] $($fpolicy.Identity)\"\n $RLine += \"-\" * 60\n $RLine += \"NOTICE - The following extensions were not\
    \ found:`n\"\n $RLine += \"$($fpolicy.MissingExtensions)`n\"\n Test-MalwarePolicy -PolicyId $fpolicy.Identity\n }\n}\n\
    # Output the report to a text file\nOut-File -FilePath $OutputFilePath -InputObject $RLine\nGet-Content $OutputFilePath\n\
    Write-Host \"`nLog file exported to\" $OutputFilePath\n3. Review the exported results which are stored in the present\
    \ working directory.\n4. A pass for this recommendation is made when an active policy is in place that\ncovers all extensions\
    \ except for those explicitly defined as an exception by the\norganization. A passing policy must also be enabled and\
    \ have the\nEnableFileFilter parameter enabled.\n5. Review any manual steps listed in the output, exceptions and inclusions\
    \ are\norganizational specific.\nNote: Weighting by individual extension risk is beyond the scope of this document.\n\
    Organizations should evaluate these both independently and based on business need."
  remediation: "To Remediate using PowerShell:\n1. Connect to Exchange Online using Connect-ExchangeOnline.\n2. Run the following\
    \ script:\n# Create an attachment policy and associated rule. The rule is\n# intentionally disabled allowing the org to\
    \ enable it when ready\n$Policy = @{\n Name = \"CIS L2 Attachment Policy\"\n EnableFileFilter = $true\n ZapEnabled = $true\n\
    \ EnableInternalSenderAdminNotifications = $true\n InternalSenderAdminAddress = 'admin@contoso.com' # Change this.\n}\n\
    $L2Extensions = @(\n \"7z\", \"a3x\", \"ace\", \"ade\", \"adp\", \"ani\", \"app\", \"appinstaller\",\n \"applescript\"\
    , \"application\", \"appref-ms\", \"appx\", \"appxbundle\", \"arj\",\n \"asd\", \"asx\", \"bas\", \"bat\", \"bgi\", \"\
    bz2\", \"cab\", \"chm\", \"cmd\", \"com\",\n \"cpl\", \"crt\", \"cs\", \"csh\", \"daa\", \"dbf\", \"dcr\", \"deb\",\n\
