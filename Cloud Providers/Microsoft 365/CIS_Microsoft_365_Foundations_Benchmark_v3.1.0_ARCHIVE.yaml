controls:
- id: 1.1.1
  title: (L1) Ensure Administrative accounts are separate and cloud-only
  scoring: manual
  profile:
  - E3 Level 1
  description: Administrative accounts are special privileged accounts that could have varying levels of access to data, users,
    and settings. Regular user accounts should never be utilized for administrative tasks and care should be taken, in the
    case of a hybrid environment, to keep Administrative accounts separated from on-prem accounts. Administrative accounts
    should not have applications assigned so that they have no access to potentially vulnerable services (EX. email, Teams,
    SharePoint, etc.) and only access to perform tasks as needed for administrative purposes. Ensure administrative accounts
    are licensed without attached applications and cloud-only.
  rationale: Ensuring administrative accounts are cloud-only, without applications assigned to them will reduce the attack
    surface of high privileged identities in your environment. In order to participate in Microsoft 365 security services
    such as Identity Protection, PIM and Conditional Access an administrative account will need a license attached to it.
    Ensure that the license used does not include any applications with potentially vulnerable services by using either Microsoft
    Entra ID P1 or Microsoft Entra ID P2 for the cloudonly account with administrator roles. In a hybrid environment, having
    separate accounts will help ensure that in the event of a breach in the cloud, that the breach does not affect the on-prem
    environment and vice versa.
  impact: 'Administrative users will have to switch accounts and utilizing login/logout functionality when performing administrative
    tasks, as well as not benefiting from SSO. Note: Alerts will be sent to the TenantAdmins, including Global Administrators,
    by default. To ensure proper receipt, configure alerts to be sent to security or operations staff with valid email addresses
    or a security operations center. Otherwise, after adoption of this recommendation, alerts sent to TenantAdmins may go
    unreceived due to the lack of an application-based license assigned to the Global Administrator accounts.'
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/admin/add-users/addusers?view=o365-worldwide
  - 2. https://learn.microsoft.com/en-us/microsoft-365/enterprise/protect-your-globaladministrator-accounts?view=o365-worldwide
  page_start: 17
  audit_raw: 'Ensure Administrative accounts are separate and cloud-only:

    1. Navigate to Microsoft 365 admin center https://admin.microsoft.com.

    2. Click to expand Users select Active users.

    3. Sort by the Licenses column.

    4. For each user account in an administrative role verify the following:

    o The account is Cloud only (not synced)

    o The account is assigned a license that is not associated with applications

    i.e. (Microsoft Entra ID P1, Microsoft Entra ID P2)'
  remediation: 'To created licensed, separate Administrative accounts for Administrative users:

    1. Navigate to Microsoft 365 admin center https://admin.microsoft.com.

    2. Click to expand Users select Active users

    3. Click Add a user.

    4. Fill out the appropriate fields for Name, user, etc.

    5. When prompted to assign licenses select as needed Microsoft Entra ID P1 or

    Microsoft Entra ID P2, then click Next.

    6. Under the Option settings screen you may choose from several types of

    Administrative access roles. Choose Admin center access followed by the

    appropriate role then click Next.

    7. Select Finish adding.'
  checks:
  - type: manual_review
    info: 'Ensure Administrative accounts are separate and cloud-only:

      1. Navigate to Microsoft 365 admin center https://admin.microsoft.com.

      2. Click to expand Users select Active users.

      3. Sort by the Licenses column.

      4. For each user account in an administrative role verify the following:

      o The account is Cloud only (not synced)

      o The account is assigned a license that is not associated with applications

      i.e. (Microsoft Entra ID P1, Microsoft Entra ID P2)'
    severity: medium
- id: 1.1.2
  title: (L1) Ensure two emergency access accounts have been defined
  scoring: manual
  profile:
  - E3 Level 1
  description: 'Emergency access or "break glass" accounts are limited for emergency scenarios where normal administrative
    accounts are unavailable. They are not assigned to a specific user and will have a combination of physical and technical
    controls to prevent them from being accessed outside a true emergency. These emergencies could be due to several things,
    including: • Technical failures of a cellular provider or Microsoft related service such as MFA. • The last remaining
    Global Administrator account is inaccessible. Ensure two Emergency Access accounts have been defined. Note: Microsoft
    provides several recommendations for these accounts and how to configure them. For more information on this, please refer
    to the references section. The CIS Benchmark outlines the more critical things to consider.'
  rationale: In various situations, an organization may require the use of a break glass account to gain emergency access.
    In the event of losing access to administrative functions, an organization may experience a significant loss in its ability
    to provide support, lose insight into its security posture, and potentially suffer financial losses.
  impact: If care is not taken in properly implementing an emergency access account this could weaken security posture. Microsoft
    recommends to exclude at least one of these accounts from all conditional access rules therefore passwords must have sufficient
    entropy and length to protect against random guesses. FIDO2 security keys may be used instead of a password for secure
    passwordless solution.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/active-directory/roles/securityplanning#stage-1-critical-items-to-do-right-now
  - 2. https://learn.microsoft.com/en-us/azure/active-directory/roles/securityemergency-access
  page_start: 20
  audit_raw: 'Step 1 - Ensure a policy and procedure is in place at the organization:

    • In order for accounts to be effectively used in a break-glass situation the proper

    policies and procedures must be authorized and distributed by senior

    management.

    • FIDO2 Security Keys, if used, should be locked in a secure separate fireproof

    location.

    • Passwords should be at least 16 characters, randomly generated and MAY be

    separated in multiple pieces to be joined on emergency.

    Step 2 - Ensure two emergency access accounts are defined:

    1. Navigate to Microsoft 365 admin center https://admin.microsoft.com

    2. Expand Users > Active Users

    3. Inspect the designated emergency access accounts and ensure the following:

    • The accounts are named correctly, and do NOT identify with a particular

    person.

    • The accounts use the default .onmicrosoft.com domain and not the

    organization''s.

    • The accounts are cloud-only.

    • The accounts are unlicensed.

    • The accounts are assigned the Global Administrator directory role.

    Step 3 - Ensure at least one account is excluded from all conditional access

    rules:

    1. Navigate Microsoft Entra admin center https://entra.microsoft.com/

    2. Expand Protection > Conditional Access.

    3. Inspect the conditional access rules.

    4. Ensure one of the emergency access accounts is excluded from all rules.'
  remediation: 'Step 1 - Create two emergency access accounts:

    1. Navigate to Microsoft 365 admin center https://admin.microsoft.com

    2. Expand Users > Active Users

    3. Click Add user and create a new user with this criteria:

    • Name the account in a way that does NOT identify it with a particular person.

    • Assign the account to the default .onmicrosoft.com domain and not the

    organization''s.

    • The password must be at least 16 characters and generated randomly.

    • Do not assign a license.

    • Assign the user the Global Administrator role.

    4. Repeat the above steps for the second account.

    Step 2 - Exclude at least one account from conditional access policies:

    1. Navigate Microsoft Entra admin center https://entra.microsoft.com/

    2. Expand Protection > Conditional Access.

    3. Inspect the conditional access policies.

    4. For each rule add an exclusion for at least one of the emergency access

    accounts.

    5. Users > Exclude > Users and groups and select one emergency access account.

    Step 3 - Ensure the necessary procedures and policies are in place:

    • In order for accounts to be effectively used in a break glass situation the proper

    policies and procedures must be authorized and distributed by senior

    management.

    • FIDO2 Security Keys, if used, should be locked in a secure separate fireproof

    location.

    • Passwords should be at least 16 characters, randomly generated and MAY be

    separated in multiple pieces to be joined on emergency.

    Note: Additional suggestions for emergency account management:

    • Create access reviews for these users.

    • Exclude users from conditional access rules.

    Warning: If CA (conditional access) exclusion is managed by a group, this group should

    be added to PIM for groups (licensing required) or be created as a role-assignable

    group. If it is a regular security group, then users with the Group Administrators role are

    able to bypass CA entirely.'
  checks:
  - type: manual_review
    info: 'Step 1 - Ensure a policy and procedure is in place at the organization:

      • In order for accounts to be effectively used in a break-glass situation the proper

      policies and procedures must be authorized and distributed by senior

      management.

      • FIDO2 Security Keys, if used, should be locked in a secure separate fireproof

      location.

      • Passwords should be at least 16 characters, randomly generated and MAY be

      separated in multiple pieces to be joined on emergency.

      Step 2 - Ensure two emergency access acc'
    severity: medium
- id: 1.1.3
  title: (L1) Ensure that between two and four global admins are designated
  scoring: scored
  profile:
  - E3 Level 1
  description: More than one global administrator should be designated so a single admin can be monitored and to provide redundancy
    should a single admin leave an organization. Additionally, there should be no more than four global admins set for any
    tenant. Ideally global administrators will have no licenses assigned to them.
  rationale: If there is only one global tenant administrator, he or she can perform malicious activity without the possibility
    of being discovered by another admin. If there are numerous global tenant administrators, the more likely it is that one
    of their accounts will be successfully breached by an external attacker.
  impact: The potential impact associated with ensuring compliance with this requirement is dependent upon the current number
    of global administrators configured in the tenant. If there is only one global administrator in a tenant, an additional
    global administrator will need to be identified and configured. If there are more than four global administrators, a review
    of role requirements for current global administrators will be required to identify which of the users require global
    administrator access.
  references:
  - 1. https://learn.microsoft.com/enus/powershell/module/microsoft.graph.identity.directorymanagement/getmgdirectoryrole?view=graph-powershell-1.0
  - 2. https://learn.microsoft.com/en-us/azure/active-directory/roles/permissionsreference#role-template-ids
  page_start: 24
  audit_raw: 'Ensure that between two and four global admins are designated:

    1. Navigate to the Microsoft 365 admin center https://admin.microsoft.com

    2. Select Users > Active Users.

    3. Select Filter then select Global Admins.

    4. Review the list of Global Admins to confirm there are from two to four such

    accounts.

    To verify the number of global tenant administrators using PowerShell:

    1. Connect to Microsoft Graph using Connect-MgGraph -Scopes

    Directory.Read.All

    2. Run the following PowerShell script:

    # Determine Id of role using the immutable RoleTemplateId value.

    $globalAdminRole = Get-MgDirectoryRole -Filter "RoleTemplateId eq ''62e9039469f5-4237-9190-012177145e10''"

    $globalAdmins = Get-MgDirectoryRoleMember -DirectoryRoleId

    $globalAdminRole.Id

    Write-Host "*** There are" $globalAdmins.AdditionalProperties.Count "Global

    Administrators assigned."

    This information is also available via the Microsoft Graph Security API:

    GET https://graph.microsoft.com/beta/security/secureScores

    Note: When tallying the number of Global Administrators the above does not account

    for Partner relationships. Those are located under Settings > Partner Relationships

    and should be reviewed on a reoccurring basis.'
  remediation: 'To correct the number of global tenant administrators:

    1. Navigate to the Microsoft 365 admin center https://admin.microsoft.com

    2. Select Users > Active Users.

    3. In the Search field enter the name of the user to be made a Global Administrator.

    4. To create a new Global Admin:

    1. Select the user''s name.

    2. A window will appear to the right.

    3. Select Manage roles.

    4. Select Admin center access.

    5. Check Global Administrator.

    6. Click Save changes.

    5. To remove Global Admins:

    1. Select User.

    2. Under Roles select Manage roles

    3. De-Select the appropriate role.

    4. Click Save changes.'
  checks:
  - type: manual_review
    info: 'Ensure that between two and four global admins are designated:

      1. Navigate to the Microsoft 365 admin center https://admin.microsoft.com

      2. Select Users > Active Users.

      3. Select Filter then select Global Admins.

      4. Review the list of Global Admins to confirm there are from two to four such

      accounts.

      To verify the number of global tenant administrators using PowerShell:

      1. Connect to Microsoft Graph using Connect-MgGraph -Scopes

      Directory.Read.All

      2. Run the following PowerShell script:

      # Determ'
    severity: medium
- id: 1.1.4
  title: (L1) Ensure Guest Users are reviewed at least biweekly
  scoring: manual
  profile:
  - E3 Level 1
  description: 'Guest users can be set up for those users not in the organization to still be granted access to resources.
    It is important to maintain visibility for what guest users are established in the tenant. Ensure Guest Users are reviewed
    no less frequently than biweekly. Note: With the E5 license an access review can be configured to review guest accounts
    automatically on a reoccurring basis. This is the preferred method if the licensing is available.'
  rationale: Periodic review of guest users ensures proper access to resources.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'To verify the report is being reviewed at least biweekly, confirm that the necessary

    procedures are in place and being followed.'
  remediation: "To review guest users in the UI:\n1. Navigate to Microsoft 365 admin center https://admin.microsoft.com/.\n\
    2. Click to expand Users and select Guest Users.\n3. Review the list of users.\nTo verify Microsoft 365 audit log search\
    \ is enabled using Microsoft Graph\nPowerShell:\n1. Connect using Connect-MgGraph -Scopes \"User.Read.All\"\n2. Run the\
    \ following PowerShell command:\nGet-MgUser -All -Property UserType,UserPrincipalName |\n Where {$_.UserType -ne \"Member\"\
    } |\n Format-Table UserPrincipalName, UserType\n3. Review the list of users. If nothing is returned then there are no\
    \ guest users."
  checks:
  - type: manual_review
    info: 'To verify the report is being reviewed at least biweekly, confirm that the necessary

      procedures are in place and being followed.'
    severity: medium
- id: 1.2.1
  title: (L2) Ensure that only organizationally managed/approved public groups exist
  scoring: scored
  profile:
  - E3 Level 2
  description: Microsoft 365 Groups is the foundational membership service that drives all teamwork across Microsoft 365.
    With Microsoft 365 Groups, you can give a group of people access to a collection of shared resources. While there are
    several different group types this recommendation concerns Microsoft 365 Groups. In the Administration panel, when a group
    is created, the default privacy value is "Public".
  rationale: 'Ensure that only organizationally managed and approved public groups exist. When a group has a "public" privacy,
    users may access data related to this group (e.g. SharePoint), through three methods: • By using the Azure portal, and
    adding themselves into the public group • By requesting access to the group from the Group application of the Access Panel
    • By accessing the SharePoint URL Administrators are notified when a user uses the Azure Portal. Requesting access to
    the group forces users to send a message to the group owner, but they still have immediate access to the group. The SharePoint
    URL is usually guessable and can be found from the Group application of the Access Panel. If group privacy is not controlled,
    any user may access sensitive information, according to the group they try to access. Note: Public in this case means
    public to the identities within the organization.'
  impact: If the recommendation is applied, group owners could receive more access requests than usual, especially regarding
    groups originally meant to be public.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/active-directory/enterprise-users/groupsself-service-management
  - 2. https://learn.microsoft.com/en-us/microsoft-365/admin/create-groups/comparegroups?view=o365-worldwide
  page_start: 30
  audit_raw: 'Ensure only organizationally managed/approved public groups exist:

    1. Navigate to Microsoft 365 admin center https://admin.microsoft.com.

    2. Click to expand Teams & groups select Active teams & groups.

    3. On the Active teams and groups page, check that no groups have the status

    ''Public'' in the privacy column.

    Using the Microsoft Graph PowerShell module:

    1. Connect to the Microsoft Graph service using Connect-MgGraph -Scopes

    "Group.Read.All".

    2. Run the following Microsoft Graph PowerShell command:

    Get-MgGroup | where {$_.Visibility -eq "Public"} | select

    DisplayName,Visibility

    3. Ensure Visibility is Private for each group.'
  remediation: 'To enable only organizationally managed/approved public groups exist:

    1. Navigate to Microsoft 365 admin center https://admin.microsoft.com.

    2. Click to expand Teams & groups select Active teams & groups..

    3. On the Active teams and groups page, select the group''s name that is public.

    4. On the popup groups name page, Select Settings.

    5. Under Privacy, select Private.'
  checks:
  - type: manual_review
    info: 'Ensure only organizationally managed/approved public groups exist:

      1. Navigate to Microsoft 365 admin center https://admin.microsoft.com.

      2. Click to expand Teams & groups select Active teams & groups.

      3. On the Active teams and groups page, check that no groups have the status

      ''Public'' in the privacy column.

      Using the Microsoft Graph PowerShell module:

      1. Connect to the Microsoft Graph service using Connect-MgGraph -Scopes

      "Group.Read.All".

      2. Run the following Microsoft Graph PowerShell comman'
    severity: medium
- id: 1.2.2
  title: (L1) Ensure sign-in to shared mailboxes is blocked
  scoring: scored
  profile:
  - E3 Level 1
  description: Shared mailboxes are used when multiple people need access to the same mailbox, such as a company information
    or support email address, reception desk, or other function that might be shared by multiple people. Users with permissions
    to the group mailbox can send as or send on behalf of the mailbox email address if the administrator has given that user
    permissions to do that. This is particularly useful for help and support mailboxes because users can send emails from
    "Contoso Support" or "Building A Reception Desk." Shared mailboxes are created with a corresponding user account using
    a system generated password that is unknown at the time of creation. The recommended state is Sign in blocked for Shared
    mailboxes.
  rationale: The intent of the shared mailbox is the only allow delegated access from other mailboxes. An admin could reset
    the password, or an attacker could potentially gain access to the shared mailbox allowing the direct sign-in to the shared
    mailbox and subsequently the sending of email from a sender that does not have a unique identity. To prevent this, block
    sign-in for the account that is associated with the shared mailbox.
  impact: ''
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/admin/email/about-sharedmailboxes?view=o365-worldwide
  - 2. https://learn.microsoft.com/en-us/microsoft-365/admin/email/create-a-sharedmailbox?view=o365-worldwide#block-sign-in-for-the-shared-mailbox-account
  page_start: 33
  audit_raw: "Review Shared mailboxes in the UI:\n1. Navigate to Microsoft 365 admin center https://admin.microsoft.com/\n\
    2. Click to expand Teams & groups and select Shared mailboxes.\n3. Take note of all shared mailboxes.\n4. Click to expand\
    \ Users and select Active users.\n5. Select a shared mailbox account to open its properties pane, and review.\n6. Ensure\
    \ the option reads Unblock sign-in.\n7. Repeat for any additional shared mailboxes.\nNote: If sign-in is not blocked it\
    \ will read Block sign-in.\nAudit in PowerShell using 2 modules:\n1. Connect to Exchange Online using Connect-ExchangeOnline\n\
    2. Connect to Microsoft Graph using Connect-MgGraph -Scopes \"Policy.Read.All\"\n3. Run the following PowerShell commands:\n\
    $MBX = Get-EXOMailbox -RecipientTypeDetails SharedMailbox\n$MBX | ForEach-Object { Get-MgUser -UserId $_.ExternalDirectoryObjectId\
    \ `\n -Property DisplayName, UserPrincipalName, AccountEnabled } |\n Format-Table DisplayName, UserPrincipalName, AccountEnabled\n\
    4. Ensure AccountEnabled is set to False for all Shared Mailboxes."
  remediation: 'Block sign-in to shared mailboxes in the UI:

    1. Navigate to Microsoft 365 admin center https://admin.microsoft.com/

    2. Click to expand Teams & groups and select Shared mailboxes.

    3. Take note of all shared mailboxes.

    4. Click to expand Users and select Active users.

    5. Select a shared mailbox account to open it''s properties pane and then select

    Block sign-in.

    6. Check the box for Block this user from signing in.

    7. Repeat for any additional shared mailboxes.

    Remediate in PowerShell using 2 modules:

    1. Connect to Microsoft Graph using Connect-MgGraph -Scopes

    "User.ReadWrite.All"

    2. Connect to Exchange Online using Connect-ExchangeOnline.

    3. To disable sign-in for a single account:

    $MBX = Get-EXOMailbox -Identity TestUser@example.com

    Update-MgUser -UserId $MBX.ExternalDirectoryObjectId -AccountEnabled:$false

    3. The following will block sign-in to all Shared Mailboxes.

    $MBX = Get-EXOMailbox -RecipientTypeDetails SharedMailbox

    $MBX | ForEach-Object { Update-MgUser -UserId $_.ExternalDirectoryObjectId -

    AccountEnabled:$false }'
  checks:
  - type: manual_review
    info: 'Review Shared mailboxes in the UI:

      1. Navigate to Microsoft 365 admin center https://admin.microsoft.com/

      2. Click to expand Teams & groups and select Shared mailboxes.

      3. Take note of all shared mailboxes.

      4. Click to expand Users and select Active users.

      5. Select a shared mailbox account to open its properties pane, and review.

      6. Ensure the option reads Unblock sign-in.

      7. Repeat for any additional shared mailboxes.

      Note: If sign-in is not blocked it will read Block sign-in.

      Audit in PowerSh'
    severity: medium
- id: 1.3.1
  title: (L1) Ensure the 'Password expiration policy' is set to 'Set passwords to never expire (recommended)'
  scoring: scored
  profile:
  - E3 Level 1
  description: Microsoft cloud-only accounts have a pre-defined password policy that cannot be changed. The only items that
    can change are the number of days until a password expires and whether or whether passwords expire at all.
  rationale: Organizations such as NIST and Microsoft have updated their password policy recommendations to not arbitrarily
    require users to change their passwords after a specific amount of time, unless there is evidence that the password is
    compromised, or the user forgot it. They suggest this even for single factor (Password Only) use cases, with a reasoning
    that forcing arbitrary password changes on users actually make the passwords less secure. Other recommendations within
    this Benchmark suggest the use of MFA authentication for at least critical accounts (at minimum), which makes password
    expiration even less useful as well as password protection for Entra ID.
  impact: When setting passwords not to expire it is important to have other controls in place to supplement this setting.
    See below for related recommendations and user guidance. • Ban common passwords. • Educate users to not reuse organization
    passwords anywhere else. • Enforce Multi-Factor Authentication registration for all users.
  references:
  - 1. https://pages.nist.gov/800-63-3/sp800-63b.html
  - 2. https://www.cisecurity.org/white-papers/cis-password-policy-guide/
  page_start: 37
  audit_raw: 'Ensure that Office 365 passwords are set to never expire:

    1. Navigate to Microsoft 365 admin center https://admin.microsoft.com.

    2. Click to expand Settings select Org Settings.

    3. Click on Security & privacy.

    4. Select Password expiration policy ensure that Set passwords to never

    expire (recommended) has been checked.

    To verify Office 365 Passwords Are Not Set to Expire, use the Microsoft Graph

    PowerShell module:

    1. Connect to the Microsoft Graph service using Connect-MgGraph -Scopes

    "Domain.Read.All".

    2. Run the following Microsoft Online PowerShell command:

    Get-MgDomain -DomainId <Domain Name> | ft PasswordValidityPeriodInDays'
  remediation: 'To set Office 365 passwords are set to never expire:

    1. Navigate to Microsoft 365 admin center https://admin.microsoft.com.

    2. Click to expand Settings select Org Settings.

    3. Click on Security & privacy.

    4. Check the Set passwords to never expire (recommended) box.

    5. Click Save.

    To set Office 365 Passwords Are Not Set to Expire, use the Microsoft Graph

    PowerShell module:

    1. Connect to the Microsoft Graph service using Connect-MgGraph -Scopes

    "Domain.ReadWrite.All".

    2. Run the following Microsoft Graph PowerShell command:

    Update-MgDomain -DomainId <Domain> -PasswordValidityPeriodInDays 2147483647 -

    PasswordNotificationWindowInDays 30'
  checks:
  - type: manual_review
    info: 'Ensure that Office 365 passwords are set to never expire:

      1. Navigate to Microsoft 365 admin center https://admin.microsoft.com.

      2. Click to expand Settings select Org Settings.

      3. Click on Security & privacy.

      4. Select Password expiration policy ensure that Set passwords to never

      expire (recommended) has been checked.

      To verify Office 365 Passwords Are Not Set to Expire, use the Microsoft Graph

      PowerShell module:

      1. Connect to the Microsoft Graph service using Connect-MgGraph -Scopes

      "Domain.Re'
    severity: medium
- id: 1.3.2
  title: (L1) Ensure 'Idle session timeout' is set to '3 hours (or less)' for unmanaged devices
  scoring: manual
  profile:
  - E3 Level 1
  description: 'Idle session timeout allows the configuration of a setting which will timeout inactive users after a pre-determined
    amount of time. When a user reaches the set idle timeout session, they''ll get a notification that they''re about to be
    signed out. They have to select to stay signed in or they''ll be automatically signed out of all Microsoft 365 web apps.
    Combined with a Conditional Access rule this will only impact unmanaged devices. A managed device is considered a device
    managed by Intune MDM. The following Microsoft 365 web apps are supported. • Outlook Web App • OneDrive for Business •
    SharePoint Online (SPO) • Office.com and other start pages • Office (Word, Excel, PowerPoint) on the web • Microsoft 365
    Admin Center NOTE: Idle session timeout doesn''t affect Microsoft 365 desktop and mobile apps. The recommended setting
    is 3 hours (or less) for unmanaged devices.'
  rationale: Ending idle sessions through an automatic process can help protect sensitive company data and will add another
    layer of security for end users who work on unmanaged devices that can potentially be accessed by the public. Unauthorized
    individuals onsite or remotely can take advantage of systems left unattended over time. Automatic timing out of sessions
    makes this more difficult.
  impact: If step 2 in the Audit/Remediation procedure is left out then there is no issue with this from a security standpoint.
    However, it will require users on trusted devices to sign in more frequently which could result in credential prompt fatigue.
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/admin/manage/idle-sessiontimeout-web-apps?view=o365-worldwide
  page_start: 40
  audit_raw: 'Step 1 - Ensure Idle session timeout is configured:

    1. Navigate to the Microsoft 365 admin center https://admin.microsoft.com/.

    2. Click to expand Settings Select Org settings.

    3. Click Security & Privacy tab.

    4. Select Idle session timeout.

    5. Verify Turn on to set the period of inactivity for users to be signed off

    of Microsoft 365 web apps is set to 3 hours (or less).

    Step 2 - Ensure the Conditional Access policy is in place:

    1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/

    2. Expand Protect > Conditional Access.

    3. Inspect existing conditional access rules for one that meets the below conditions:

    • Users is set to All users

    • Cloud apps or actions > Select apps is set to Office 365.

    • Conditions > Client apps is Browser and nothing else.

    • Session is set to Use app enforced restrictions.

    • Enable Policy is set to On

    NOTE: To ensure that idle timeouts affect only unmanaged devices, both steps must be

    completed.'
  remediation: 'To configure Idle session timeout:

    1. Navigate to the Microsoft 365 admin center https://admin.microsoft.com/.

    2. Click to expand Settings Select Org settings.

    3. Click Security & Privacy tab.

    4. Select Idle session timeout.

    5. Check the box Turn on to set the period of inactivity for users to be

    signed off of Microsoft 365 web apps

    6. Set a maximum value of 3 hours.

    7. Click save.

    Step 2 - Ensure the Conditional Access policy is in place:

