  scoring: manual
  profile:
  - E3 Level 1
  description: This setting allows business-to-business (B2B) guests access to Microsoft Fabric, and contents that they have
    permissions to. With the setting turned off, B2B guest users receive an error when trying to access Power BI. The recommended
    state is Enabled for a subset of the organization or Disabled.
  rationale: Establishing and enforcing a dedicated security group prevents unauthorized access to Microsoft Fabric for guests
    collaborating in Azure that are new or assigned guest status from other applications. This upholds the principle of least
    privilege and uses role-based access control (RBAC). These security groups can also be used for tasks like conditional
    access, enhancing risk management and user accountability across the organization.
  impact: Security groups will need to be more closely tended to and monitored.
  references:
