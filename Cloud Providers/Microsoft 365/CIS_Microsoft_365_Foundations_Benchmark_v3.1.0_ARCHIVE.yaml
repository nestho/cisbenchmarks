    , \"HardDelete\", \"Move\",\n \"MoveToDeletedItems\", \"SendAs\", \"SendOnBehalf\", \"SoftDelete\", \"Update\",\n \"UpdateFolderPermissions\"\
    , \"UpdateInboxRules\"\n)\n$OwnerActions = @(\n \"ApplyRecord\", \"Create\", \"HardDelete\", \"MailboxLogin\", \"Move\"\
    ,\n \"MoveToDeletedItems\", \"SoftDelete\", \"Update\", \"UpdateCalendarDelegation\",\n \"UpdateFolderPermissions\", \"\
