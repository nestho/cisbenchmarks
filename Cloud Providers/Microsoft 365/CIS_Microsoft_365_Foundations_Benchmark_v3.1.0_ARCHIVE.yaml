    o Under Assignments and Users and groups ensure the Exclude is set to

    least one low risk account or directory role. This is required as a best

    practice.

    This information is also available via the Microsoft Graph Security API:

    GET https://graph.microsoft.com/beta/security/secureScores'
  remediation: 'To setup a conditional access policy to block legacy authentication, use the

    following steps:

