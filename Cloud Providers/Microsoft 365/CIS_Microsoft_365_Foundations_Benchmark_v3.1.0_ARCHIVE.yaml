  title: (L1) Ensure the 'Restricted entities' report is reviewed weekly
  scoring: manual
  profile:
  - E3 Level 1
  description: Microsoft 365 Defender reviews of Restricted Entities will provide a list of user accounts restricted from
    sending e-mail. If a user exceeds one of the outbound sending limits as specified in the service limits or in outbound
    spam policies, the user is restricted from sending email, but they can still receive email.
  rationale: Users who are found on the restricted users list have a high probability of having been compromised. Review of
    this list will allow an organization to remediate these user accounts, and then unblock them.
  impact: ''
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/security/office-365security/responding-to-a-compromised-email-account?view=o365-worldwide
  - 2. https://learn.microsoft.com/en-us/microsoft-365/security/office-365security/removing-user-from-restricted-users-portal-after-spam?view=o365worldwide
  page_start: 94
  audit_raw: 'To verify the report is being reviewed at least weekly, confirm that the necessary

