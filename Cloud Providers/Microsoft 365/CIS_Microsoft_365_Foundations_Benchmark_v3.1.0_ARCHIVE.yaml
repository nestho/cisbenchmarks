- id: 5.1.1.1
  title: (L1) Ensure Security Defaults is disabled on Azure Active Directory
  scoring: manual
  profile:
  - E3 Level 1
  description: Security defaults in Microsoft Entra ID make it easier to be secure and help protect the organization. Security
    defaults contain preconfigured security settings for common attacks. By default, Microsoft enables security defaults.
    The goal is to ensure that all organizations have a basic level of security enabled. The security default setting is manipulated
    in the Azure Portal. The use of security defaults, however, will prohibit custom settings which are being set with more
    advanced settings from this benchmark.
  rationale: 'Security defaults provide secure default settings that are managed on behalf of organizations to keep customers
    safe until they are ready to manage their own identity security settings. For example, doing the following: • Requiring
    all users and admins to register for MFA. • Challenging users with MFA - mostly when they show up on a new device or app,
    but more often for critical roles and tasks. • Disabling authentication from legacy authentication clients, which can’t
    do MFA.'
  impact: The potential impact associated with disabling of Security Defaults is dependent upon the security controls implemented
    in the environment. It is likely that most organizations disabling Security Defaults plan to implement equivalent controls
    to replace Security Defaults. It may be necessary to check settings in other Microsoft products, such as Azure, to ensure
    settings and functionality are as expected when disabling security defaults for MS365.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/active-directory/fundamentals/conceptfundamentals-security-defaults
  - 2. https://techcommunity.microsoft.com/t5/azure-active-directoryidentity/introducing-security-defaults/ba-p/1061414
  page_start: 140
  audit_raw: 'Ensure security defaults is disabled:

    1. Navigate to Microsoft Entra admin center https://entra.microsoft.com.

    2. Click to expand Identity select Overview

    3. Click Properties.

    4. Review the section Security Defaults near the bottom

    5. If Manage security defaults appears clickable then proceed to the remediation

    section, otherwise read the note below.

    NOTE: If Manage Conditional Access appears in blue then Security defaults are already

    disabled, and CA is in use. The audit can be considered a Pass.

    To verify security defaults is disabled using Microsoft Graph PowerShell:

    1. Connect to the Microsoft Graph service using Connect-MgGraph -Scopes

    "Policy.Read.All".

    2. Run the following Microsoft Graph PowerShell command:

    Get-MgPolicyIdentitySecurityDefaultEnforcementPolicy | ft IsEnabled

    3. If the value is false then Security Defaults is disabled.'
  remediation: 'To disable security defaults:

    1. Navigate to the Microsoft Entra admin center https://entra.microsoft.com.

    2. Click to expand Identity select Overview

    3. Click Properties.

    4. Click Manage security defaults.

    5. Set the Security defaults dropdown to Disabled.

    6. Select Save.

    To configure security defaults using Microsoft Graph PowerShell:

    1. Connect to the Microsoft Graph service using Connect-MgGraph -Scopes

    "Policy.ReadWrite.ConditionalAccess".

    2. Run the following Microsoft Graph PowerShell command:

    $params = @{ IsEnabled = $false }

    Update-MgPolicyIdentitySecurityDefaultEnforcementPolicy -BodyParameter

    $params

    Warning: It is recommended not to disable security defaults until you are ready to

    implement conditional access rules in the benchmark. Rules such as requiring MFA for

    all users and blocking legacy protocols are required in CA to make up for the gap

    created by disabling defaults. Plan accordingly. See the reference section for more

    details on what coverage Security Defaults provide.'
  checks:
  - type: manual_review
    info: 'Ensure security defaults is disabled:

      1. Navigate to Microsoft Entra admin center https://entra.microsoft.com.

      2. Click to expand Identity select Overview

      3. Click Properties.

      4. Review the section Security Defaults near the bottom

      5. If Manage security defaults appears clickable then proceed to the remediation

      section, otherwise read the note below.

      NOTE: If Manage Conditional Access appears in blue then Security defaults are already

      disabled, and CA is in use. The audit can be considered a Pas'
    severity: medium
- id: 5.1.2
  title: Users 5.1.2.1 (L1) Ensure 'Per-user MFA' is disabled
  scoring: manual
  profile:
  - E3 Level 1
  description: Legacy per-user Multi-Factor Authentication (MFA) can be configured to require individual users to provide
    multiple authentication factors, such as passwords and additional verification codes, to access their accounts. It was
    introduced in earlier versions of Office 365, prior to the more comprehensive implementation of Conditional Access (CA).
  rationale: Both security defaults and conditional access with security defaults turned off are not compatible with per-user
    multi-factor authentication (MFA), which can lead to undesirable user authentication states. The CIS Microsoft 365 Benchmark
    explicitly employs Conditional Access for MFA as an enhancement over security defaults and as a replacement for the outdated
    per-user MFA. To ensure a consistent authentication state disable per-user MFA on all accounts.
  impact: Accounts using per-user MFA will need to be migrated to use CA. Prior to disabling per-user MFA the organization
    must be prepared to implement conditional access MFA to avoid security gaps and allow for a smooth transition. This will
    help ensure relevant accounts are covered by MFA during the change phase from disabling per-user MFA to enabling CA MFA.
    Section 5.2.2 in this document covers creating of a CA rule for both administrators and all users in the tenant. Microsoft
    has documentation on migrating from per-user MFA Convert users from peruser MFA to Conditional Access based MFA
  references:
  - 1. https://learn.microsoft.com/en-us/azure/active-directory/authentication/howtomfa-userstates#convert-users-from-per-user-mfa-to-conditional-access
  - 2. https://learn.microsoft.com/en-us/microsoft-365/admin/security-andcompliance/set-up-multi-factor-authentication?view=o365-worldwide#useconditional-access-policies
  page_start: 143
  audit_raw: 'To audit per-user MFA using the UI:

    1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/.

    2. Click to expand Identity > Users select All users.

    3. Click on Per-user MFA on the top row.

    4. Ensure under the column Multi-factor Auth Status that each account is set to

    Disabled'
  remediation: 'Disable per-user MFA using the UI:

    1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/.

    2. Click to expand Identity > Users select All users.

    3. Click on Per-user MFA on the top row.

    4. Click the empty box next to Display Name to select all accounts.

    5. On the far right under quick steps click Disable.'
  checks:
  - type: manual_review
    info: 'To audit per-user MFA using the UI:

      1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/.

      2. Click to expand Identity > Users select All users.

      3. Click on Per-user MFA on the top row.

      4. Ensure under the column Multi-factor Auth Status that each account is set to

      Disabled'
    severity: medium
- id: 5.1.2.2
  title: (L2) Ensure third party integrated applications are not allowed
  scoring: scored
  profile:
  - E3 Level 2
  description: App registration allows users to register custom-developed applications for use within the directory.
  rationale: Third-party integrated applications connection to services should be disabled unless there is a very clear value
    and robust security controls are in place. While there are legitimate uses, attackers can grant access from breached accounts
    to third party applications to exfiltrate data from your tenancy without having to maintain the breached account.
  impact: Implementation of this change will impact both end users and administrators. End users will not be able to integrate
    third-party applications that they may wish to use. Administrators are likely to receive requests from end users to grant
    them permission to necessary third-party applications.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/active-directory/develop/active-directoryhow-applications-are-added
  page_start: 146
  audit_raw: 'To audit using the UI:

    1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/.

    2. Click to expand Identity > Users select Users settings.

    3. Verify Users can register applications is set to No.

    To audit using PowerShell:

    1. Connect to Microsoft Graph using Connect-MgGraph -Scopes "Policy.Read.All"

    2. Run the following command:

    (Get-MgPolicyAuthorizationPolicy).DefaultUserRolePermissions | fl

    AllowedToCreateApps

    3. Ensure the returned value is False.'
  remediation: 'To remediate using the UI:

    1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/.

    2. Click to expand Identity > Users select Users settings.

    3. Set Users can register applications to No.

    4. Click Save.

    To remediate using PowerShell:

    1. Connect to Microsoft Graph using Connect-MgGraph -Scopes

    "Policy.ReadWrite.Authorization"

    2. Run the following commands:

    $param = @{ AllowedToCreateApps = "$false" }

    Update-MgPolicyAuthorizationPolicy -DefaultUserRolePermissions $param'
  checks:
  - type: manual_review
    info: 'To audit using the UI:

      1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/.

      2. Click to expand Identity > Users select Users settings.

      3. Verify Users can register applications is set to No.

      To audit using PowerShell:

      1. Connect to Microsoft Graph using Connect-MgGraph -Scopes "Policy.Read.All"

      2. Run the following command:

      (Get-MgPolicyAuthorizationPolicy).DefaultUserRolePermissions | fl

      AllowedToCreateApps

      3. Ensure the returned value is False.'
    severity: medium
- id: 5.1.2.3
  title: (L1) Ensure 'Restrict non-admin users from creating tenants' is set to 'Yes'
  scoring: scored
  profile:
  - E3 Level 1
  description: Non-privileged users can create tenants in the Entra administration portal under Manage tenant. The creation
    of a tenant is recorded in the Audit log as category "DirectoryManagement" and activity "Create Company". Anyone who creates
    a tenant becomes the Global Administrator of that tenant. The newly created tenant doesn't inherit any settings or configurations.
  rationale: Restricting tenant creation prevents unauthorized or uncontrolled deployment of resources and ensures that the
    organization retains control over its infrastructure. User generation of shadow IT could lead to multiple, disjointed
    environments that can make it difficult for IT to manage and secure the organization's data, especially if other users
    in the organization began using these tenants for business purposes under the misunderstanding that they were secured
    by the organization's security team.
  impact: Non-admin users will need to contact I.T. if they have a valid reason to create a tenant.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/active-directory/fundamentals/usersdefault-permissions#restrict-member-users-default-permissions
  page_start: 148
  audit_raw: "To audit using the UI:\n1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/\n2. Click to\
    \ expand Identity> Users > User settings.\n3. Ensure Restrict non-admin users from creating tenants is set to Yes\nTo\
    \ audit using PowerShell:\n1. Connect to Microsoft Graph using Connect-MgGraph -Scopes \"Policy.Read.All\"\n2. Run the\
    \ following commands:\n(Get-MgPolicyAuthorizationPolicy).DefaultUserRolePermissions |\n Select-Object AllowedToCreateTenants\n\
    3. Ensure the returned value is False"
  remediation: 'To remediate using the UI:

    1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/

    2. Click to expand Identity> Users > User settings.

    3. Set Restrict non-admin users from creating tenants to Yes then Save.

    To remediate using PowerShell:

    1. Connect to Microsoft Graph using Connect-MgGraph -Scopes

    "Policy.ReadWrite.Authorization"

    2. Run the following commands.

    # Create hashtable and update the auth policy

    $params = @{ AllowedToCreateTenants = $false }

    Update-MgPolicyAuthorizationPolicy -DefaultUserRolePermissions $params'
  checks:
  - type: manual_review
    info: "To audit using the UI:\n1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/\n2. Click to expand\
      \ Identity> Users > User settings.\n3. Ensure Restrict non-admin users from creating tenants is set to Yes\nTo audit\
      \ using PowerShell:\n1. Connect to Microsoft Graph using Connect-MgGraph -Scopes \"Policy.Read.All\"\n2. Run the following\
      \ commands:\n(Get-MgPolicyAuthorizationPolicy).DefaultUserRolePermissions |\n Select-Object AllowedToCreateTenants\n\
      3. Ensure the returned value is False"
