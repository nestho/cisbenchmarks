    7. Grant > Grant Access with Require authentication strength (Preview):

    Phishing-resistant MFA

    8. Click `Select''

    9. Set Enable policy to Report-only and click Create

    At minimum these directory roles should be included for the policy:

    • Application administrator

    • Authentication administrator

    • Billing administrator

    • Cloud application administrator

    • Conditional Access administrator

    • Exchange administrator

    • Global administrator

    • Global reader

    • Helpdesk administrator

    • Password administrator

    • Privileged authentication administrator

    • Privileged role administrator

    • Security administrator

    • SharePoint administrator

    • User administrator

    Warning: Ensure administrators are pre-registered with strong authentication before

    enforcing the policy. After which the policy must be set to On.'
