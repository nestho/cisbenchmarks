- id: 9.1.9
  title: (L1) Ensure 'Block ResourceKey Authentication' is 'Enabled'
  scoring: manual
  profile:
  - E3 Level 1
  description: This setting blocks the use of resource key based authentication. The Block ResourceKey Authentication setting
    applies to streaming and PUSH datasets. If blocked users will not be allowed send data to streaming and PUSH datasets
    using the API with a resource key. The recommended state is Enabled.
  rationale: Resource keys are a form of authentication that allows users to access Power BI resources (such as reports, dashboards,
    and datasets) without requiring individual user accounts. While convenient, this method bypasses the organization's centralized
    identity and access management controls. Enabling ensures that access to Power BI resources is tied to the organization's
    authentication mechanisms, providing a more secure and controlled environment.
  impact: Developers will need to request a special exception in order to use this feature.
  references:
  - 1. https://learn.microsoft.com/en-us/power-bi/admin/service-admin-portal-developer
  - 2. https://learn.microsoft.com/en-us/power-bi/connect-data/service-real-timestreaming
  page_start: 388
  audit_raw: 'Ensure ResourceKey Authentication is Enabled:

    1. Navigate to Microsoft Fabric https://app.powerbi.com/admin-portal

    2. Select Tenant settings.

    3. Scroll to Developer settings.

    4. Ensure that Block ResourceKey Authentication is Enabled'
  remediation: 'Ensure ResourceKey Authentication is Enabled:

    1. Navigate to Microsoft Fabric https://app.powerbi.com/admin-portal

    2. Select Tenant settings.

    3. Scroll to Developer settings.

    4. Set Block ResourceKey Authentication to Enabled'
  checks:
  - type: manual_review
    info: 'Ensure ResourceKey Authentication is Enabled:

