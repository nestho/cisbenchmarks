- id: 5.1.2.5
  title: (L2) Ensure the option to remain signed in is hidden
  scoring: manual
  profile:
  - E3 Level 2
  description: The option for the user to Stay signed in, or the Keep me signed in option, will prompt a user after a successful
    login. When the user selects this option, a persistent refresh token is created. The refresh token lasts for 90 days by
    default and does not prompt for sign-in or multifactor.
  rationale: Allowing users to select this option presents risk, especially if the user signs into their account on a publicly
    accessible computer/web browser. In this case it would be trivial for an unauthorized person to gain access to any associated
    cloud data from that account.
  impact: 'Once this setting is hidden users will no longer be prompted upon sign-in with the message Stay signed in?. This
    may mean users will be forced to sign in more frequently. Important: some features of SharePoint Online and Office 2010
    have a dependency on users remaining signed in. If you hide this option, users may get additional and unexpected sign
    in prompts.'
  references:
  - 1. https://learn.microsoft.com/en-us/entra/identity/authentication/concepts-azuremulti-factor-authentication-prompts-session-lifetime?source=recommendations
