- id: 6.4.1
  title: (L1) Ensure mail forwarding rules are reviewed at least weekly
  scoring: manual
  profile:
  - E3 Level 1
  description: The Exchange Online environment can be configured in a way that allows for automatic forwarding of e-mail.
    This can be done using Transport Rules in the Admin Center, Auto Forwarding per mailbox, and client-based rules in Outlook.
    Administrators and users both are given several methods to automatically and quickly send e-mails outside of your organization.
  rationale: Reviewing mail forwarding rules will provide the Messaging Administrator with insight into possible attempts
    to exfiltrate data from the organization. Weekly review helps create a recognition of baseline, legitimate activity of
    users. This will aid in helping identify the more malicious activity of bad actors when/if they choose to use this sidechannel.
  impact: There is no impact to reviewing these reports.
  references: []
  page_start: 275
  audit_raw: 'To verify mail forwarding rules are being reviewed at least weekly, confirm that the

    necessary procedures are in place and being followed by the assigned employee.'
  remediation: "To review mail forwarding rules:\n1. Navigate to Exchange admin center https://admin.exchange.microsoft.com.\n\
    2. Expand Reports then select Mail flow.\n3. Click on Auto forwarded messages report.\n4. Review.\nNote: Mail flow reports\
    \ cannot be viewed from the Classic Exchange Admin Center\nTo review mail forwarding rules using PowerShell:\n1. Connect\
    \ to Exchange Online PowerShell using Connect-ExchangeOnline\n# Uses the administrator user credential to export Mail\
    \ forwarding rules,\nUser Delegates\n# and SMTP Forwarding policies to multiple csv files.\n$allUsers = Get-User -ResultSize\
    \ Unlimited -Filter {RecipientTypeDetails -eq\n\"UserMailbox\" } |\n Where-Object {$_.AccountDisabled -like \"False\"\
    }\n$UserInboxRules = @()\n$UserDelegates = @()\nforeach ($User in $allUsers) {\n Write-Host \"Checking inbox rules and\
    \ delegates for user: \"\n$User.UserPrincipalName\n $UserInboxRules += Get-InboxRule -Mailbox $User.UserPrincipalName\
    \ |\n Select-Object Name, Description, Enabled, Priority, ForwardTo,\nForwardAsAttachmentTo, RedirectTo, DeleteMessage\
    \ |\n Where-Object { ($_.ForwardTo -ne $null) -or ($_.ForwardAsAttachmentTo -ne\n$null) -or ($_.RedirectsTo -ne $null)\
    \ }\n $UserDelegates += Get-MailboxPermission -Identity $User.UserPrincipalName |\n Where-Object { ($_.IsInherited -ne\
    \ \"True\") -and ($_.User -notlike\n\"*SELF*\") }\n}\n$SMTPForwarding = Get-Mailbox -ResultSize Unlimited |\n Select-Object\
    \ DisplayName, ForwardingAddress, ForwardingSMTPAddress,\nDeliverToMailboxandForward |\n Where-Object {$_.ForwardingSMTPAddress\
    \ -ne $null}\n# Export list of inbox rules, delegates, and SMTP forwards\n$UserInboxRules | Export-Csv MailForwardingRulesToExternalDomains.csv\
    \ -\nNoTypeInformation\n$UserDelegates | Export-Csv MailboxDelegatePermissions.csv -NoTypeInformation\n$SMTPForwarding\
    \ | Export-Csv Mailboxsmtpforwarding.csv -NoTypeInformation"
  checks:
  - type: manual_review
    info: 'To verify mail forwarding rules are being reviewed at least weekly, confirm that the

      necessary procedures are in place and being followed by the assigned employee.'
    severity: medium
- id: 6.5.1
  title: (L1) Ensure modern authentication for Exchange Online is enabled
  scoring: scored
  profile:
  - E3 Level 1
  description: Modern authentication in Microsoft 365 enables authentication features like multifactor authentication (MFA)
    using smart cards, certificate-based authentication (CBA), and third-party SAML identity providers. When you enable modern
    authentication in Exchange Online, Outlook 2016 and Outlook 2013 use modern authentication to log in to Microsoft 365
    mailboxes. When you disable modern authentication in Exchange Online, Outlook 2016 and Outlook 2013 use basic authentication
    to log in to Microsoft 365 mailboxes. When users initially configure certain email clients, like Outlook 2013 and Outlook
    2016, they may be required to authenticate using enhanced authentication mechanisms, such as multifactor authentication.
    Other Outlook clients that are available in Microsoft 365 (for example, Outlook Mobile and Outlook for Mac 2016) always
    use modern authentication to log in to Microsoft 365 mailboxes.
  rationale: Strong authentication controls, such as the use of multifactor authentication, may be circumvented if basic authentication
    is used by Exchange Online email clients such as Outlook 2016 and Outlook 2013. Enabling modern authentication for Exchange
    Online ensures strong authentication mechanisms are used when establishing sessions between email clients and Exchange
    Online.
  impact: Users of older email clients, such as Outlook 2013 and Outlook 2016, will no longer be able to authenticate to Exchange
    using Basic Authentication, which will necessitate migration to modern authentication practices.
  references:
  - 1. https://learn.microsoft.com/en-us/exchange/clients-and-mobile-in-exchangeonline/enable-or-disable-modern-authentication-in-exchange-online
  page_start: 279
  audit_raw: 'To audit using PowerShell:

    1. Run the Microsoft Exchange Online PowerShell Module.

    2. Connect to Exchange Online using Connect-ExchangeOnline.

    3. Run the following PowerShell command:

    Get-OrganizationConfig | Format-Table -Auto Name, OAuth*

    4. Verify OAuth2ClientProfileEnabled is True.'
  remediation: 'To remediate using PowerShell:

    1. Run the Microsoft Exchange Online PowerShell Module.

    2. Connect to Exchange Online using Connect-ExchangeOnline.

    3. Run the following PowerShell command:

    Set-OrganizationConfig -OAuth2ClientProfileEnabled $True'
  checks:
  - type: manual_review
    info: 'To audit using PowerShell:

      1. Run the Microsoft Exchange Online PowerShell Module.

      2. Connect to Exchange Online using Connect-ExchangeOnline.

      3. Run the following PowerShell command:

      Get-OrganizationConfig | Format-Table -Auto Name, OAuth*

      4. Verify OAuth2ClientProfileEnabled is True.'
    severity: medium
- id: 6.5.2
  title: (L1) Ensure MailTips are enabled for end users
  scoring: scored
  profile:
  - E3 Level 1
  description: MailTips are informative messages displayed to users while they're composing a message. While a new message
    is open and being composed, Exchange analyzes the message (including recipients). If a potential problem is detected,
    the user is notified with a MailTip prior to sending the message. Using the information in the MailTip, the user can adjust
    the message to avoid undesirable situations or non-delivery reports (also known as NDRs or bounce messages).
  rationale: Setting up MailTips gives a visual aid to users when they send emails to large groups of recipients or send emails
    to recipients not within the tenant.
  impact: Not applicable.
  references:
  - 1. https://learn.microsoft.com/en-us/exchange/clients-and-mobile-in-exchangeonline/mailtips/mailtips
  - 2. https://learn.microsoft.com/en-us/powershell/module/exchange/setorganizationconfig?view=exchange-ps
  page_start: 281
  audit_raw: 'To audit using PowerShell:

    1. Connect to Exchange Online using Connect-ExchangeOnline.

    2. Run the following PowerShell command:

    Get-OrganizationConfig | fl MailTips*

    3. Verify the values for MailTipsAllTipsEnabled,

    MailTipsExternalRecipientsTipsEnabled, and MailTipsGroupMetricsEnabled

    are set to True and MailTipsLargeAudienceThreshold is set to an acceptable

    value; 25 is the default value.'
  remediation: "To remediate using PowerShell:\n1. Connect to Exchange Online using Connect-ExchangeOnline.\n2. Run the following\
    \ PowerShell command:\n$TipsParams = @{\n MailTipsAllTipsEnabled = $true\n MailTipsExternalRecipientsTipsEnabled = $true\n\
    \ MailTipsGroupMetricsEnabled = $true\n MailTipsLargeAudienceThreshold = '25'\n}\nSet-OrganizationConfig @TipsParams"
  checks:
  - type: manual_review
    info: 'To audit using PowerShell:

      1. Connect to Exchange Online using Connect-ExchangeOnline.

      2. Run the following PowerShell command:

      Get-OrganizationConfig | fl MailTips*

      3. Verify the values for MailTipsAllTipsEnabled,

      MailTipsExternalRecipientsTipsEnabled, and MailTipsGroupMetricsEnabled

      are set to True and MailTipsLargeAudienceThreshold is set to an acceptable

      value; 25 is the default value.'
    severity: medium
- id: 6.5.3
  title: (L2) Ensure additional storage providers are restricted in Outlook on the web
  scoring: scored
  profile:
  - E3 Level 2
  description: This setting allows users to open certain external files while working in Outlook on the web. If allowed, keep
    in mind that Microsoft doesn't control the use terms or privacy policies of those third-party services. Ensure AdditionalStorageProvidersAvailable
    are restricted.
  rationale: By default additional storage providers are allowed in Office on the Web (such as Box, Dropbox, Facebook, Google
    Drive, OneDrive Personal, etc.). This could lead to information leakage and additional risk of infection from organizational
    non-trusted storage providers. Restricting this will inherently reduce risk as it will narrow opportunities for infection
    and data leakage.
  impact: Impact associated with this change is highly dependent upon current practices in the tenant. If users do not use
    other storage providers, then minimal impact is likely. However, if users do regularly utilize providers outside of the
    tenant this will affect their ability to continue to do so.
  references:
  - 1. https://learn.microsoft.com/en-us/powershell/module/exchange/setowamailboxpolicy?view=exchange-ps
  - 2. https://support.microsoft.com/en-us/topic/3rd-party-cloud-storage-servicessupported-by-office-apps-fce12782-eccc-4cf5-8f4b-d1ebec513f72
  page_start: 283
  audit_raw: 'To audit using PowerShell:

