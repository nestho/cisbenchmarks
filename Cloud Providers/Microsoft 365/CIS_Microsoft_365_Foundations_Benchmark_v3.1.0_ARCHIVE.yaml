- id: 9.1.8
  title: (L1) Ensure enabling of external data sharing is restricted
  scoring: manual
  profile:
  - E3 Level 1
  description: Power BI admins can specify which users or user groups can share datasets externally with guests from a different
    tenant through the in-place mechanism. Disabling this setting prevents any user from sharing datasets externally by restricting
    the ability of users to turn on external sharing for datasets they own or manage. The recommended state is Enabled for
    a subset of the organization or Disabled.
  rationale: Establishing and enforcing a dedicated security group prevents unauthorized access to Microsoft Fabric for guests
    collaborating in Azure that are new or from other applications. This upholds the principle of least privilege and uses
    role-based access control (RBAC). These security groups can also be used for tasks like conditional access, enhancing
    risk management and user accountability across the organization.
  impact: Security groups will need to be more closely tended to and monitored.
  references:
  - 1. https://learn.microsoft.com/en-us/power-bi/admin/service-admin-portal-exportsharing
