    outlined below.

    5. Scroll down the pane and click on Edit Protection settings (Global Readers

    will look for on or off values)

    6. Ensure the following protection settings are set as outlined:

    Email

    o Checked On: Safe Links checks a list of known, malicious links

    when users click links in email. URLs are rewritten by default

    o Checked Apply Safe Links to email messages sent within the

    organization

    o Checked Apply real-time URL scanning for suspicious links and

    links that point to files

    o Checked Wait for URL scanning to complete before delivering the

    message

    o Unchecked Do not rewrite URLs, do checks via Safe Links API only.

    Teams

    o Checked On: Safe Links checks a list of known, malicious links

    when users click links in Microsoft Teams. URLs are not rewritten

    Office 365 Apps

    o Checked On: Safe Links checks a list of known, malicious links

    when users click links in Microsoft Office apps. URLs are not

    rewritten

    Click protection settings

    o Checked Track user clicks

    o Unchecked Let users click through the original URL

    7. There is no recommendation for organization branding.

    8. Click close

    To verify the Safe Links policy is enabled, use the Exchange Online PowerShell

    Module:

    1. Connect using Connect-ExchangeOnline.

