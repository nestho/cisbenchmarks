- id: 6.1.4
  title: (L1) Ensure 'AuditBypassEnabled' is not enabled on mailboxes
  scoring: manual
  profile:
  - E3 Level 1
  description: When configuring a user or computer account to bypass mailbox audit logging, the system will not record any
    access, or actions performed by the said user or computer account on any mailbox. Administratively this was introduced
    to reduce the volume of entries in the mailbox audit logs on trusted user or computer accounts. Ensure AuditBypassEnabled
    is not enabled on accounts without a written exception.
  rationale: If a mailbox audit bypass association is added for an account, the account can access any mailbox in the organization
    to which it has been assigned access permissions, without generating any mailbox audit logging entries for such access
    or recording any actions taken, such as message deletions. Enabling this parameter, whether intentionally or unintentionally,
    could allow insiders or malicious actors to conceal their activity on specific mailboxes. Ensuring proper logging of user
    actions and mailbox operations in the audit log will enable comprehensive incident response and forensics.
  impact: None - this is the default behavior.
  references:
  - 1. https://learn.microsoft.com/en-us/powershell/module/exchange/getmailboxauditbypassassociation?view=exchange-ps
  page_start: 257
  audit_raw: 'Ensure Audit Bypass is not enabled using PowerShell:

    1. Connect to Exchange Online using Connect-ExchangeOnline.

    2. Run the following PowerShell command:

    $MBX = Get-MailboxAuditBypassAssociation -ResultSize unlimited

    $MBX | where {$_.AuditBypassEnabled -eq $true} | Format-Table

    Name,AuditBypassEnabled

    3. If nothing is returned, then there are no accounts with Audit Bypass enabled.'
  remediation: "Disable Audit Bypass on all mailboxes using PowerShell:\n1. Connect to Exchange Online using Connect-ExchangeOnline.\n\
    2. The following example PowerShell script will disable AuditBypass for all\nmailboxes which currently have it enabled:\n\
    # Get mailboxes with AuditBypassEnabled set to $true\n$MBXAudit = Get-MailboxAuditBypassAssociation -ResultSize unlimited\
    \ | WhereObject { $_.AuditBypassEnabled -eq $true }\nforeach ($mailbox in $MBXAudit) {\n $mailboxName = $mailbox.Name\n\
    \ Set-MailboxAuditBypassAssociation -Identity $mailboxName -\nAuditBypassEnabled $false\n Write-Host \"Audit Bypass disabled\
    \ for mailbox Identity: $mailboxName\" -\nForegroundColor Green\n}"
  checks:
  - type: manual_review
    info: 'Ensure Audit Bypass is not enabled using PowerShell:

      1. Connect to Exchange Online using Connect-ExchangeOnline.

      2. Run the following PowerShell command:

      $MBX = Get-MailboxAuditBypassAssociation -ResultSize unlimited

