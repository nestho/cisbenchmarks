- id: 6.2.3
  title: (L1) Ensure email from external senders is identified
  scoring: scored
  profile:
  - E3 Level 1
  description: 'External callouts provide a native experience to identify emails from senders outside the organization. This
    is achieved by presenting a new tag on emails called "External" (the string is localized based on the client language
    setting) and exposing related user interface at the top of the message reading view to see and verify the real sender''s
    email address. Once this feature is enabled via PowerShell, it might take 24-48 hours for users to start seeing the External
    sender tag in email messages received from external sources (outside of your organization), providing their Outlook version
    supports it. The recommended state is ExternalInOutlook set to Enabled True Note: Mail flow rules are often used by Exchange
    administrators to accomplish the External email tagging by appending a tag to the front of a subject line. There are limitations
    to this outlined here. The preferred method in the CIS Benchmark is to use the native experience.'
  rationale: 'Tagging emails from external senders helps to inform end users about the origin of the email. This can allow
    them to proceed with more caution and make informed decisions when it comes to identifying spam or phishing emails. Note:
    Existing emails in a user''s inbox from external senders are not tagged retroactively.'
  impact: 'Mail flow rules using external tagging will need to be disabled before enabling this to avoid duplicate [External]
    tags. The Outlook desktop client is the last to receive this update and the feature is only available for certain versions
    see below: Outlook for Windows: Update 4/26/23: External Tag view in Outlook for Windows (matching other clients) released
    to production for Current Channel and Monthly Enterprise Channel in Version 2211 for builds 15831.20190 and higher. We
    anticipate the External tag to reach Semi-Annual Preview Channel with Version 2308 on the September 12th 2023 public update
    and reach Semi-Annual Enterprise Channel with Version 2308 with the January 9th 2024 public update.'
  references:
  - 1. https://techcommunity.microsoft.com/t5/exchange-team-blog/native-externalsender-callouts-on-email-in-outlook/ba-p/2250098
  - 2. https://learn.microsoft.com/en-us/powershell/module/exchange/setexternalinoutlook?view=exchange-ps
  page_start: 267
  audit_raw: 'To verify external sender tagging using PowerShell:

    1. Connect to Exchange online using Connect-ExchangeOnline.

    2. Run the following PowerShell command:

    Get-ExternalInOutlook

    3. For each identity verify Enabled is set to True and the AllowList only contains

    email addresses the organization has permitted to bypass external tagging.'
  remediation: 'To enable external tagging using PowerShell:

    1. Connect to Exchange online using Connect-ExchangeOnline.

    2. Run the following PowerShell command:

    Set-ExternalInOutlook -Enabled $true'
  checks:
