  title: (L1) Ensure Exchange Online Spam Policies are set to notify administrators
  scoring: scored
  profile:
  - E3 Level 1
  description: In Microsoft 365 organizations with mailboxes in Exchange Online or standalone Exchange Online Protection (EOP)
    organizations without Exchange Online mailboxes, email messages are automatically protected against spam (junk email)
    by EOP. Configure Exchange Online Spam Policies to copy emails and notify someone when a sender in the organization has
    been blocked for sending spam emails.
  rationale: A blocked account is a good indication that the account in question has been breached and an attacker is using
    it to send spam emails to other people.
  impact: Notification of users that have been blocked should not cause an impact to the user.
  references: []
  page_start: 76
  audit_raw: 'Ensure Exchange Online Spam Policies are set to notify administrators:

    1. Navigate to Microsoft 365 Defender https://security.microsoft.com.

    2. Click to expand Email & collaboration select Policies & rules > Threat

    policies.

    3. Under Policies select Anti-spam.

    4. Click on the Anti-spam outbound policy (default).

    5. Verify that Send a copy of outbound messages that exceed these limits to

    these users and groups is set to On, ensure the email address is correct.

    To verify the Exchange Online Spam Policies are set correctly using PowerShell:

    1. Connect to Exchange Online using Connect-ExchangeOnline.

    2. Run the following PowerShell command:

    Get-HostedOutboundSpamFilterPolicy | Select-Object Bcc*, Notify*

    3. Verify both BccSuspiciousOutboundMail and NotifyOutboundSpam are set to True

    and the email addresses to be notified are correct.

    Note: Audit and Remediation guidance may focus on the Default policy however, if a

    Custom Policy exists in the organization''s tenant then ensure the setting is set as

    outlined in the highest priority policy listed.'
  remediation: 'To set the Exchange Online Spam Policies:

    1. Navigate to Microsoft 365 Defender https://security.microsoft.com.

    2. Click to expand Email & collaboration select Policies & rules> Threat

    policies.

    3. Under Policies select Anti-spam.

    4. Click on the Anti-spam outbound policy (default).

    5. Select Edit protection settings then under Notifications

    6. Check Send a copy of outbound messages that exceed these limits to

    these users and groups then enter the desired email addresses.

    7. Check Notify these users and groups if a sender is blocked due to

    sending outbound spam then enter the desired email addresses.

    8. Click Save.

    To set the Exchange Online Spam Policies correctly using PowerShell:

    1. Connect to Exchange Online using Connect-ExchangeOnline.

    2. Run the following PowerShell command:

    $BccEmailAddress = @("<INSERT-EMAIL>")

    $NotifyEmailAddress = @("<INSERT-EMAIL>")

    Set-HostedOutboundSpamFilterPolicy -Identity Default -

    BccSuspiciousOutboundAdditionalRecipients $BccEmailAddress -

    BccSuspiciousOutboundMail $true -NotifyOutboundSpam $true -

    NotifyOutboundSpamRecipients $NotifyEmailAddress

    Note: Audit and Remediation guidance may focus on the Default policy however, if a

    Custom Policy exists in the organization''s tenant then ensure the setting is set as

    outlined in the highest priority policy listed.'
