- id: 8.6.1
  title: (L1) Ensure users can report security concerns in Teams
  scoring: scored
  profile:
  - E3 Level 1
  description: 'User reporting settings allow a user to report a message as malicious for further analysis. This recommendation
    is composed of 3 different settings and all be configured to pass: • In the Teams admin center: On by default and controls
    whether users are able to report messages from Teams. When this setting is turned off, users can''t report messages within
    Teams, so the corresponding setting in the Microsoft 365 Defender portal is irrelevant. • In the Microsoft 365 Defender
    portal: On by default for new tenants. Existing tenants need to enable it. If user reporting of messages is turned on
    in the Teams admin center, it also needs to be turned on the Defender portal for user reported messages to show up correctly
    on the User reported tab on the Submissions page. • Defender - Report message destinations: This applies to more than
    just Microsoft Teams and allows for an organization to keep their reports contained. Due to how the parameters are configured
    on the backend it is included in this assessment as a requirement.'
  rationale: 'Users will be able to more quickly and systematically alert administrators of suspicious malicious messages
    within Teams. The content of these messages may be sensitive in nature and therefore should be kept within the organization
    and not shared with Microsoft without first consulting company policy. Note: • The reported message remains visible to
    the user in the Teams client. • Users can report the same message multiple times. • The message sender isn''t notified
    that messages were reported.'
  impact: Enabling message reporting has an impact beyond just addressing security concerns. When users of the platform report
    a message, the content could include messages that are threatening or harassing in nature, possibly stemming from colleagues.
    Due to this the security staff responsible for reviewing and acting on these reports should be equipped with the skills
    to discern and appropriately direct such messages to the relevant departments, such as Human Resources (HR).
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/security/office-365security/submissions-teams?view=o365-worldwide
  page_start: 363
  audit_raw: 'To audit using the UI:

    1. Navigate to Microsoft Teams admin center https://admin.teams.microsoft.com.

    2. Click to expand Messaging select Messaging policies.

    3. Click Global (Org-wide default).

    4. Ensure Report a security concern is On.

    5. Next, navigate to Microsoft 365 Defender https://security.microsoft.com/

    6. Click on Settings > Email & collaboration > User reported settings.

    7. Scroll to Microsoft Teams.

    8. Ensure Monitor reported messages in Microsoft Teams is checked.

    9. Ensure Send reported messages to: is set to My reporting mailbox only with

    report email addresses defined for authorized staff.

    To audit using PowerShell:

    1. Connect to Teams PowerShell using Connect-MicrosoftTeams.

    2. Connect to Exchange Online PowerShell using Connect-ExchangeOnline.

    3. Run the following cmdlet for to assess Teams:

    Get-CsTeamsMessagingPolicy -Identity Global | fl

    AllowSecurityEndUserReporting

    4. Ensure the value returned is True.

    5. Run this cmdlet to assess Defender:

    Get-ReportSubmissionPolicy | fl Report*

    6. Ensure the output matches the following values with organization specific email

    addresses:

    ReportJunkToCustomizedAddress : True

    ReportNotJunkToCustomizedAddress : True

    ReportPhishToCustomizedAddress : True

    ReportJunkAddresses : {SOC@contoso.com}

    ReportNotJunkAddresses : {SOC@contoso.com}

    ReportPhishAddresses : {SOC@contoso.com}

    ReportChatMessageEnabled : False

    ReportChatMessageToCustomizedAddressEnabled : True'
  remediation: "To remediate using the UI:\n1. Navigate to Microsoft Teams admin center https://admin.teams.microsoft.com.\n\
    2. Click to expand Messaging select Messaging policies.\n3. Click Global (Org-wide default).\n4. Set Report a security\
    \ concern to On.\n5. Next, navigate to Microsoft 365 Defender https://security.microsoft.com/\n6. Click on Settings >\
    \ Email & collaboration > User reported settings.\n7. Scroll to Microsoft Teams.\n8. Check Monitor reported messages in\
    \ Microsoft Teams and Save.\n9. Set Send reported messages to: to My reporting mailbox only with reports\nconfigured to\
    \ be sent to authorized staff.\nTo remediate using PowerShell:\n1. Connect to Teams PowerShell using Connect-MicrosoftTeams.\n\
    2. Connect to Exchange Online PowerShell using Connect-ExchangeOnline.\n3. Run the following cmdlet:\nSet-CsTeamsMessagingPolicy\
    \ -Identity Global -AllowSecurityEndUserReporting\n$true\n4. To configure the Defender reporting policies, edit and run\
    \ this script:\n$usersub = \"userreportedmessages@fabrikam.com\" # Change this.\n$params = @{\n Identity = \"DefaultReportSubmissionPolicy\"\
    \n EnableReportToMicrosoft = $false\n ReportChatMessageEnabled = $false\n ReportChatMessageToCustomizedAddressEnabled\
    \ = $true\n ReportJunkToCustomizedAddress = $true\n ReportNotJunkToCustomizedAddress = $true\n ReportPhishToCustomizedAddress\
    \ = $true\n ReportJunkAddresses = $usersub\n ReportNotJunkAddresses = $usersub\n ReportPhishAddresses = $usersub\n}\n\
    Set-ReportSubmissionPolicy @params\nNew-ReportSubmissionRule -Name DefaultReportSubmissionRule -\nReportSubmissionPolicy\
    \ DefaultReportSubmissionPolicy -SentTo $usersub"
  checks:
  - type: manual_review
    info: 'To audit using the UI:

      1. Navigate to Microsoft Teams admin center https://admin.teams.microsoft.com.

      2. Click to expand Messaging select Messaging policies.

      3. Click Global (Org-wide default).

      4. Ensure Report a security concern is On.

      5. Next, navigate to Microsoft 365 Defender https://security.microsoft.com/

      6. Click on Settings > Email & collaboration > User reported settings.

      7. Scroll to Microsoft Teams.

      8. Ensure Monitor reported messages in Microsoft Teams is checked.

      9. Ensure Send repo'
    severity: medium
