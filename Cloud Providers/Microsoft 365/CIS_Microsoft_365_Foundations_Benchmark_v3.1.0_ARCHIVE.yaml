- id: 7.3.2
  title: (L2) Ensure OneDrive sync is restricted for unmanaged devices
  scoring: scored
  profile:
  - E3 Level 2
  description: 'Microsoft OneDrive allows users to sign in their cloud tenant account and begin syncing select folders or
    the entire contents of OneDrive to a local computer. By default, this includes any computer with OneDrive already installed,
    whether it is Azure Domain Joined or Active Directory Domain joined. The recommended state for this setting is Allow syncing
    only on computers joined to specific domains Enabled: Specify the AD domain GUID(s)'
  rationale: 'Unmanaged devices pose a risk, since their security cannot be verified through existing security policies, brokers
    or endpoint protection. Allowing users to sync data to these devices takes that data out of the control of the organization.
    This increases the risk of the data either being intentionally or accidentally leaked. Note: This setting is only applicable
    to Active Directory domains when operating in a hybrid configuration. It does not apply to Entra ID domains. If there
    are devices which are only Entra ID joined, consider using a Conditional Access Policy instead.'
  impact: Enabling this feature will prevent users from using the OneDrive for Business Sync client on devices that are not
    joined to the domains that were defined.
  references:
  - 1. https://learn.microsoft.com/en-US/sharepoint/allow-syncing-only-on-specificdomains?WT.mc_id=365AdminCSH_spo
  - 2. https://learn.microsoft.com/en-us/powershell/module/sharepoint-online/setspotenantsyncclientrestriction?view=sharepoint-ps
  page_start: 316
