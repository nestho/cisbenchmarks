    o EnableSafeLinksForTeams: True

    o EnableSafeLinksForOffice: True

    o TrackClicks: True

    o AllowClickThrough: False

    o ScanUrls: True

    o EnableForInternalSenders: True

    o DeliverMessageAfterScan: True

    o DisableUrlRewrite: False'
  remediation: "To create a Safe Links policy:\n1. Navigate to Microsoft 365 Defender https://security.microsoft.com\n2. Under\
    \ Email & collaboration select Policies & rules\n3. Select Threat policies then Safe Links\n4. Click on +Create\n5. Name\
    \ the policy then click Next\n6. In Domains select all valid domains for the organization and Next\n7. Ensure the following\
    \ URL & click protection settings are defined:\nEmail\no Checked On: Safe Links checks a list of known, malicious links\n\
    when users click links in email. URLs are rewritten by default\no Checked Apply Safe Links to email messages sent within\
    \ the\norganization\no Checked Apply real-time URL scanning for suspicious links and\nlinks that point to files\no Checked\
    \ Wait for URL scanning to complete before delivering the\nmessage\no Unchecked Do not rewrite URLs, do checks via Safe\
    \ Links API only.\nTeams\no Checked On: Safe Links checks a list of known, malicious links\nwhen users click links in\
    \ Microsoft Teams. URLs are not rewritten\nOffice 365 Apps\no Checked On: Safe Links checks a list of known, malicious\
    \ links\nwhen users click links in Microsoft Office apps. URLs are not\nrewritten\nClick protection settings\no Checked\
    \ Track user clicks\no Unchecked Let users click through the original URL\no There is no recommendation for organization\
    \ branding.\n8. Click Next twice and finally Submit\nTo create a Safe Links policy using the Exchange Online PowerShell\
    \ Module:\n1. Connect using Connect-ExchangeOnline.\n2. Run the following PowerShell script to create a policy at highest\
    \ priority that will\napply to all valid domains on the tenant:\n# Create the Policy\n$params = @{\n Name = \"CIS SafeLinks\
    \ Policy\"\n EnableSafeLinksForEmail = $true\n EnableSafeLinksForTeams = $true\n EnableSafeLinksForOffice = $true\n TrackClicks\
    \ = $true\n AllowClickThrough = $false\n ScanUrls = $true\n EnableForInternalSenders = $true\n DeliverMessageAfterScan\
    \ = $true\n DisableUrlRewrite = $false\n}\nNew-SafeLinksPolicy @params\n# Create the rule for all users in all valid domains\
    \ and associate with\nPolicy\nNew-SafeLinksRule -Name \"CIS SafeLinks\" -SafeLinksPolicy \"CIS SafeLinks\nPolicy\" -RecipientDomainIs\
    \ (Get-AcceptedDomain).Name -Priority 0"
