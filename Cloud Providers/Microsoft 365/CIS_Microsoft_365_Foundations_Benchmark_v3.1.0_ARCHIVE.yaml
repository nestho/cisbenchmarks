- id: 6.3.1
  title: (L2) Ensure users installing Outlook add-ins is not allowed
  scoring: scored
  profile:
  - E3 Level 2
  description: Specify the administrators and users who can install and manage add-ins for Outlook in Exchange Online By default,
    users can install add-ins in their Microsoft Outlook Desktop client, allowing data access within the client application.
  rationale: Attackers exploit vulnerable or custom add-ins to access user data. Disabling userinstalled add-ins in Microsoft
    Outlook reduces this threat surface.
  impact: Implementing this change will impact both end users and administrators. End users will be unable to integrate third-party
    applications they desire, and administrators may receive requests to grant permission for necessary third-party apps.
  references:
  - 1. https://learn.microsoft.com/en-us/exchange/clients-and-mobile-in-exchangeonline/add-ins-for-outlook/specify-who-can-install-and-manage-addins?source=recommendations
  - 2. https://learn.microsoft.com/en-us/exchange/permissions-exo/role-assignmentpolicies
  page_start: 270
  audit_raw: "To audit using the UI:\n1. Navigate to Exchange admin center https://admin.exchange.microsoft.com.\n2. Click\
    \ to expand Roles select User roles.\n3. Select Default Role Assignment Policy.\n4. In the properties pane on the right\
    \ click on Manage permissions.\n5. Under Other roles verify My Custom Apps, My Marketplace Apps and My\nReadWriteMailboxApps\
    \ are unchecked.\nTo audit using PowerShell:\n1. Connect to Exchange Online using Connect-ExchangeOnline.\n2. Run the\
    \ following command:\nGet-EXOMailbox | Select-Object -Unique RoleAssignmentPolicy |\nForEach-Object {\n Get-RoleAssignmentPolicy\
    \ -Identity $_.RoleAssignmentPolicy |\n Where-Object {$_.AssignedRoles -like \"*Apps*\"}\n} | Select-Object Identity,\
    \ @{Name=\"AssignedRoles\"; Expression={\n Get-Mailbox | Select-Object -Unique RoleAssignmentPolicy |\n ForEach-Object\
    \ {\n Get-RoleAssignmentPolicy -Identity $_.RoleAssignmentPolicy |\n Select-Object -ExpandProperty AssignedRoles |\n Where-Object\
    \ {$_ -like \"*Apps*\"}\n }\n}}\n3. Verify My Custom Apps, My Marketplace Apps and My ReadWriteMailboxApps are\nnot present.\n\
    Note: As of the current release the manage permissions link no longer displays\nanything when a user assigned the Global\
    \ Reader role clicks on it. Global Readers as\nan alternative can inspect the Roles column or use the PowerShell method\
    \ to perform\nthe audit."
  remediation: "To remediate using the UI:\n1. Navigate to Exchange admin center https://admin.exchange.microsoft.com.\n2.\
    \ Click to expand Roles select User roles.\n3. Select Default Role Assignment Policy.\n4. In the properties pane on the\
    \ right click on Manage permissions.\n5. Under Other roles uncheck My Custom Apps, My Marketplace Apps and My\nReadWriteMailboxApps.\n\
    6. Click Save changes.\nTo remediate using PowerShell:\n1. Connect to Exchange Online using Connect-ExchangeOnline.\n\
    2. Run the following command:\n$policy = \"Role Assignment Policy - Prevent Add-ins\"\n$roles = \"MyTextMessaging\", \"\
    MyDistributionGroups\", `\n \"MyMailSubscriptions\", \"MyBaseOptions\", \"MyVoiceMail\", `\n \"MyProfileInformation\"\
    , \"MyContactInformation\",\n\"MyRetentionPolicies\", `\n \"MyDistributionGroupMembership\"\nNew-RoleAssignmentPolicy\
    \ -Name $policy -Roles $roles\nSet-RoleAssignmentPolicy -id $policy -IsDefault\n# Assign new policy to all mailboxes\n\
    Get-EXOMailbox -ResultSize Unlimited | Set-Mailbox -RoleAssignmentPolicy\n$policy\nIf you have other Role Assignment Policies\
    \ modify the last line to filter out your\ncustom policies"
  checks:
  - type: manual_review
    info: 'To audit using the UI:

      1. Navigate to Exchange admin center https://admin.exchange.microsoft.com.

      2. Click to expand Roles select User roles.

      3. Select Default Role Assignment Policy.

      4. In the properties pane on the right click on Manage permissions.

      5. Under Other roles verify My Custom Apps, My Marketplace Apps and My

      ReadWriteMailboxApps are unchecked.

      To audit using PowerShell:

      1. Connect to Exchange Online using Connect-ExchangeOnline.

      2. Run the following command:

      Get-EXOMailbox | Select-'
