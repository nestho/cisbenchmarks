- id: 5.3.2
  title: (L1) Ensure 'Access reviews' for Guest Users are configured
  scoring: manual
  profile:
  - E5 Level 1
  description: Access reviews enable administrators to establish an efficient automated process for reviewing group memberships,
    access to enterprise applications, and role assignments. These reviews can be scheduled to recur regularly, with flexible
    options for delegating the task of reviewing membership to different members of the organization. Ensure Access reviews
    for Guest Users are configured to be performed no less frequently than monthly.
  rationale: Access to groups and applications for guests can change over time. If a guest user's access to a particular folder
    goes unnoticed, they may unintentionally gain access to sensitive data if a member adds new files or data to the folder
    or application. Access reviews can help reduce the risks associated with outdated assignments by requiring a member of
    the organization to conduct the reviews. Furthermore, these reviews can enable a fail-closed mechanism to remove access
    to the subject if the reviewer does not respond to the review.
  impact: Access reviews that are ignored may cause guest users to lose access to resources temporarily.
  references:
  - 1. https://learn.microsoft.com/en-us/azure/active-directory/governance/createaccess-review
  - 2. https://learn.microsoft.com/en-us/azure/active-directory/governance/accessreviews-overview
  page_start: 234
  audit_raw: 'Verify an access review for Guest Users is in place:

    1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/

    2. Click to expand Identity Governance and select Access reviews

    3. Inspect the access reviews, and ensure an access review is created with the

    following criteria:

    o Overview: Scope is set to Guest users only and status is Active

    o Reviewers: Ensure appropriate reviewer(s) are designated.

    o Settings > General: Mail notifications and Reminders are set to Enable

    o Reviewers: Require reason on approval is set to Enable

    o Scheduling: Frequency is Monthly or more frequent.

    o When completed: Auto apply results to resource is set to Enable

    o When completed: If reviewers don''t respond is set to Remove access'
  remediation: 'Create an access review for Guest Users:

    1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/

    2. Click to expand Identity Governance and select Access reviews

    3. Click New access review.

    4. Select what to review choose Teams + Groups.

    5. Review Scope set to All Microsoft 365 groups with guest users, do not

    exclude groups.

    6. Scope set to Guest users only then click Next: Reviews.

    7. Select reviewers an appropriate user that is NOT the guest user themselves.

    8. Duration (in days) at most 3.

    9. Review recurrence is Monthly or more frequent.

    10. End is set to Never, then click Next: Settings.

    11. Check Auto apply results to resource.

    12. Set If reviewers don''t respond to Remove access.

    13. Check the following: Justification required, E-mail notifications,

    Reminders.

    14. Click Next: Review + Create and finally click Create.'
  checks:
  - type: manual_review
    info: 'Verify an access review for Guest Users is in place:

      1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/

      2. Click to expand Identity Governance and select Access reviews

      3. Inspect the access reviews, and ensure an access review is created with the

      following criteria:

      o Overview: Scope is set to Guest users only and status is Active

      o Reviewers: Ensure appropriate reviewer(s) are designated.

      o Settings > General: Mail notifications and Reminders are set to Enable

      o Reviewers'
    severity: medium
- id: 5.3.3
  title: (L1) Ensure 'Access reviews' for high privileged Azure AD roles are configured
  scoring: manual
  profile:
  - E5 Level 1
  description: 'Access reviews enable administrators to establish an efficient automated process for reviewing group memberships,
    access to enterprise applications, and role assignments. These reviews can be scheduled to recur regularly, with flexible
    options for delegating the task of reviewing membership to different members of the organization. Ensure Access reviews
    for high privileged Entra ID roles are done no less frequently than weekly. These reviews should include at a minimum
    the roles listed below: • Global Administrator • Exchange Administrator • SharePoint Administrator • Teams Administrator
    • Security Administrator NOTE: An access review is created for each role selected after completing the process.'
  rationale: Regular review of critical high privileged roles in Entra ID will help identify role drift, or potential malicious
    activity. This will enable the practice and application of "separation of duties" where even non-privileged users like
    security auditors can be assigned to review assigned roles in an organization. Furthermore, if configured these reviews
    can enable a fail-closed mechanism to remove access to the subject if the reviewer does not respond to the review.
  impact: ''
  references:
  - 1. https://learn.microsoft.com/en-us/azure/active-directory/privileged-identitymanagement/pim-create-azure-ad-roles-and-resource-roles-review
  - 2. https://learn.microsoft.com/en-us/azure/active-directory/governance/accessreviews-overview
  page_start: 237
  audit_raw: 'Verify access reviews for high privileged roles is in place:

    1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/

    2. Click to expand Identity Governance and select Privileged Identity

    Management

    3. Select Microsoft Entra Roles under Manage

    4. Select Access reviews

    5. Ensure there are access reviews configured for each high privileged roles and

    each meets the criteria laid out below:

    o Scope - Everyone

    o Status - Active

    o Reviewers - Role reviewers should be designated personnel. Preferably

    not a self-review.

    o Mail notifications - Enable

    o Reminders - Enable

    o Require reason on approval - Enable

    o Frequency - Monthly or more frequent

    o Duration (in days) - 4 at most

    o Auto apply results to resource - Enable

    o If reviewers don''t respond - No change

    Any remaining settings are discretionary.

    NOTE: Reviewers will have the ability to revoke roles should be trusted individuals who

    understand the impact of the access reviews. The principal of separation of duties

    should be considered so that no one administrator is reviewing their own access levels.

    NOTE2: The setting If reviewers don''t respond is recommended to be set to Remove

    access due to the potential of all Global Administrators being unassigned if the review is

    not addressed.'
  remediation: 'Create an access review for high privileged roles:

    1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/

    2. Click to expand Identity Governance and select Privileged Identity

    Management

    3. Select Microsoft Entra Roles under Manage

    4. Select Access reviews and click New access review.

    5. Provide a name and description.

    6. Frequency set to Weekly or more frequent.

    7. Duration (in days) is set to at most 3.

    8. End set to Never.

    9. Role select these roles: Global Administrator,Exchange

    Administrator,SharePoint Administrator,Teams Administrator,Security

    Administrator

    10. Assignment type set to All active and eligible assignments.

    11. Reviewers set to Selected user(s) or group(s)

    12. Select reviewers are member(s) responsible for this type of review.

    13. Auto apply results to resource set to Enable

    14. If reviewers don''t respond is set to No change

    15. Show recommendations set to Enable

    16. Require reason or approval set to Enable

    17. Mail notifications set to Enable

    18. Reminders set to Enable

    19. Click Start to save the review.

    NOTE: Reviewers will have the ability to revoke roles should be trusted individuals who

    understand the impact of the access reviews. The principle of separation of duties

    should be considered so that no one administrator is reviewing their own access levels.'
  checks:
  - type: manual_review
    info: 'Verify access reviews for high privileged roles is in place:

      1. Navigate to Microsoft Entra admin center https://entra.microsoft.com/

      2. Click to expand Identity Governance and select Privileged Identity

      Management

      3. Select Microsoft Entra Roles under Manage

      4. Select Access reviews

      5. Ensure there are access reviews configured for each high privileged roles and

      each meets the criteria laid out below:

      o Scope - Everyone

      o Status - Active

      o Reviewers - Role reviewers should be designated personn'
    severity: medium
- id: 6.1.1
  title: (L1) Ensure 'AuditDisabled' organizationally is set to 'False'
  scoring: scored
  profile:
  - E3 Level 1
  description: 'The value False indicates that mailbox auditing on by default is turned on for the organization. Mailbox auditing
    on by default in the organization overrides the mailbox auditing settings on individual mailboxes. For example, if mailbox
    auditing is turned off for a mailbox (the AuditEnabled property on the mailbox is False), the default mailbox actions
    are still audited for the mailbox, because mailbox auditing on by default is turned on for the organization. Turning off
    mailbox auditing on by default ($true) has the following results: • Mailbox auditing is turned off for your organization.
    • From the time you turn off mailbox auditing on by default, no mailbox actions are audited, even if mailbox auditing
    is enabled on a mailbox (the AuditEnabled property on the mailbox is True). • Mailbox auditing isn''t turned on for new
    mailboxes and setting the AuditEnabled property on a new or existing mailbox to True is ignored. • Any mailbox audit bypass
    association settings (configured by using the SetMailboxAuditBypassAssociation cmdlet) are ignored. • Existing mailbox
    audit records are retained until the audit log age limit for the record expires. The recommended state for this setting
    is False at the organization level. This will enable auditing and enforce the default.'
