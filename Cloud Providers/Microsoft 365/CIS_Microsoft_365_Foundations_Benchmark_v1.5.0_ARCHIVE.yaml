    organizations without Exchange Online mailboxes, email messages are automatically protected against spam (junk email)
    by EOP. Configure Exchange Online Spam Policies to copy emails and notify someone when a sender in your tenant has been
    blocked for sending spam emails.
  rationale: 'A blocked account is a good indication that the account in question has been breached and an attacker is using
    it to send spam emails to other people. Note: Audit and Remediation guidance may focus on the Default policy however,
    if a Custom Policy exists in the organization''s tenant then ensure the setting is set as outlined in the highest priority
    policy listed.'
  impact: Notification of users that have been blocked should not cause an impact to the user.
  references: []
