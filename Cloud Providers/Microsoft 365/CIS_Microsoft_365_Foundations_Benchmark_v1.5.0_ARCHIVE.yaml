- id: 1.1.12
  title: (L2) Ensure that only organizationally managed/approved public groups exist
  scoring: manual
  profile:
  - E3 Level 2
  description: Microsoft 365 Groups is the foundational membership service that drives all teamwork across Microsoft 365.
    With Microsoft 365 Groups, you can give a group of people access to a collection of shared resources. While there are
    several different types of group types this recommendation is concerned with Microsoft 365 Groups. In the Administration
    panel, when a group is created, the default privacy value is "Public".
  rationale: 'Ensure that only organizationally managed and approved public groups exist. When a group has a "public" privacy,
    users may access data related to this group (e.g. SharePoint), through three methods: • By using the Azure portal, and
    adding themselves into the public group • By requesting access to the group from the Group application of the Access Panel
    • By accessing the SharePoint URL Administrators are notified when a user uses the Azure Portal. Requesting access to
    the group forces users to send a message to the group owner, but they still have immediately access to the group. The
    SharePoint URL is usually guessable, and can be found from the Group application of the Access Panel. If group privacy
    is not controlled, any user may access sensitive information, according to the group they try to access. NOTE: Public
    in this case meaning public to the identities within organization.'
  impact: If the recommendation is applied, group owners could receive more access requests than usual, especially regarding
    groups originally meant to be public.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/users-groupsroles/groups-self-service-management#self-service-group-membership-defaults
  - 2. https://docs.microsoft.com/en-us/microsoft-365/admin/create-groups/comparegroups?view=o365-worldwide
  page_start: 46
  audit_raw: 'Using the Microsoft 365 Administration portal:

    In the Microsoft 365 Administration portal, go to:

    1. Teams & groups

    2. Active teams & groups

    3. Check that no groups have the status ''Public'' in the privacy column

    Using the Microsoft.Graph PowerShell module:

    To get the list of public groups, run the following.

    Connect-Graph -Scopes "Group.Read.All"

    Get-MgGroup | where {$_.Visibility -eq "Public"} | select

    DisplayName,Visibility'
  remediation: 'In the Microsoft 365 Administration portal, go to:

    1. Teams & groups

    2. Active teams & groups

    3. Select a Public group

    4. Go to ''Settings''

    5. Set Privacy to ''Private'''
  checks:
  - type: manual_review
    info: 'Using the Microsoft 365 Administration portal:

      In the Microsoft 365 Administration portal, go to:

      1. Teams & groups

      2. Active teams & groups

      3. Check that no groups have the status ''Public'' in the privacy column

      Using the Microsoft.Graph PowerShell module:

      To get the list of public groups, run the following.

      Connect-Graph -Scopes "Group.Read.All"

      Get-MgGroup | where {$_.Visibility -eq "Public"} | select

      DisplayName,Visibility'
    severity: medium
