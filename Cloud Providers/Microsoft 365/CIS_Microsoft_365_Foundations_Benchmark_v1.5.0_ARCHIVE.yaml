- id: '1.2'
  title: (L1) Ensure modern authentication for Exchange Online is enabled
  scoring: scored
  profile:
  - E3 Level 1
  description: Modern authentication in Microsoft 365 enables authentication features like multifactor authentication (MFA)
    using smart cards, certificate-based authentication (CBA), and third-party SAML identity providers. When you enable modern
    authentication in Exchange Online, Outlook 2016 and Outlook 2013 use modern authentication to log in to Microsoft 365
    mailboxes. When you disable modern authentication in Exchange Online, Outlook 2016 and Outlook 2013 use basic authentication
    to log in to Microsoft 365 mailboxes. When users initially configure certain email clients, like Outlook 2013 and Outlook
    2016, they may be required to authenticate using enhanced authentication mechanisms, such as multifactor authentication.
    Other Outlook clients that are available in Microsoft 365 (for example, Outlook Mobile and Outlook for Mac 2016) always
    use modern authentication to log in to Microsoft 365 mailboxes.
  rationale: Strong authentication controls, such as the use of multifactor authentication, may be circumvented if basic authentication
    is used by Exchange Online email clients such as Outlook 2016 and Outlook 2013. Enabling modern authentication for Exchange
    Online ensures strong authentication mechanisms are used when establishing sessions between email clients and Exchange
    Online.
  impact: Users of older email clients, such as Outlook 2013 and Outlook 2016, will no longer be able to authenticate to Exchange
    using Basic Authentication, which will necessitate migration to modern authentication practices.
  references:
  - 1. https://support.office.com/en-gb/article/enable-or-disable-modern-authenticationin-exchange-online-58018196-f918-49cd-8238-56f57f38d662
  page_start: 58
  audit_raw: 'To verify modern authentication is enabled, use the Exchange Online PowerShell

    Module:

    1. Run the Microsoft Exchange Online PowerShell Module.

    2. Connect to Exchange Online using Connect-ExchangeOnline.

    3. Run the following PowerShell command:

    Get-OrganizationConfig | Format-Table -Auto Name, OAuth*

    4. Verify OAuth2ClientProfileEnabled is True.'
  remediation: 'To enable modern authentication, use the Exchange Online PowerShell Module:

    1. Run the Microsoft Exchange Online PowerShell Module.

    2. Connect to Exchange Online using Connect-ExchangeOnline.

    3. Run the following PowerShell command:

    Set-OrganizationConfig -OAuth2ClientProfileEnabled $True'
  checks:
  - type: manual_review
    info: 'To verify modern authentication is enabled, use the Exchange Online PowerShell

      Module:

      1. Run the Microsoft Exchange Online PowerShell Module.

      2. Connect to Exchange Online using Connect-ExchangeOnline.

      3. Run the following PowerShell command:

      Get-OrganizationConfig | Format-Table -Auto Name, OAuth*

      4. Verify OAuth2ClientProfileEnabled is True.'
    severity: medium
