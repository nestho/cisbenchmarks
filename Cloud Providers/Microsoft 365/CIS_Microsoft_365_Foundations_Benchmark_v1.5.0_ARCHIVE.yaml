- id: '2.3'
  title: (L2) Ensure Safe Links for Office Applications is Enabled
  scoring: scored
  profile:
  - E5 Level 2
  description: 'Enabling Safe Links policy for Office applications allows URL''s that exist inside of Office documents and
    email applications opened by Office, Office Online and Office mobile to be processed against Defender for Office time-of-click
    verification and rewritten if required. Note: E5 Licensing includes a number of Built-in Protection policies. When auditing
    policies note which policy you are viewing, and keep in mind CIS recommendations often extend the Default or Build-in
    Policies provided by MS. In order to Pass the highest priority policy must match all settings recommended.'
  rationale: Safe Links for Office applications extends phishing protection to documents and emails that contain hyperlinks,
    even after they have been delivered to a user.
  impact: User impact associated with this change is minor - users may experience a very short delay when clicking on URLs
    in Office documents before being directed to the requested site. Users should be informed of the change as, in the event
    a link is unsafe and blocked, they will receive a message that it has been blocked.
  references:
  - 1. https://docs.microsoft.com/en-us/microsoft-365/security/office-365-security/setup-safe-links-policies?view=o365-worldwide
  - 2. https://docs.microsoft.com/en-us/powershell/module/exchange/setsafelinkspolicy?view=exchange-ps
  page_start: 73
  audit_raw: 'To verify Defender for Office Safe Links policy for Office is enabled, use the

    Microsoft 365 Admin Center:

    1. Under Admin centers click Security.

    2. Under Email & collaboration select Policies & rules

    3. Select Threat policies then Safe Links

    4. Click on the policy, a new pane should open on the right hand side.

    5. Scroll down the pane and click on Edit Protection settings

    6. Ensure the following boxes are checked in the section URL & Click protection

    settings:

    •

    On: Safe Links checks a list of known, malicious links when users click

    links in email. URLs are rewritten by default

    •

    Apply Safe Links to email messages sent within the organization

    •

    Apply real-time URL scanning for suspicious links and links that point

    to files

    •

    Wait for URL scanning to complete before delivering the message

    •

    On: Safe Links checks a list of known, malicious links when users click

    links in Microsoft Teams. URLs are not rewritten

    •

    On: Safe Links checks a list of known, malicious links when users click

    links in Microsoft Office apps. URLs are not rewritten

    7. Under Click protection settings the setting Let users click through to the

    original URL should be unchecked.

    To verify the Safe Links policy is enabled, use the Exchange Online PowerShell

    Module:

    1. Connect using Connect-ExchangeOnline.

    2. Run the following PowerShell command:

    Get-SafeLinksPolicy | Format-Table Name

    3. Once this returns the list of policies run the following command to view the

    policies.

    Get-SafeLinksPolicy -Identity "Policy Name"

    4. Verify the value for the following.

    o

    EnableSafeLinksForEmail: True

    o

    EnableSafeLinksForTeams: True

    o

    EnableSafeLinksForOffice: True

    o

    AllowClickThrough: False

    o

    ScanUrls: True

    o

    EnableForInternalSenders: True

    o

    DeliverMessageAfterScan: True'
  remediation: 'To enable Defender for Office Safe Links policy for Office, use the Microsoft 365

    Admin Center:

    1. Under Admin centers click Security.

    2. Under Email & collaboration select Policies & rules

    3. Select Threat policies then Safe Links

    4. Click on the policy, a new pane should open on the right hand side.

    5. Under Protection settings click Edit protection settings

    6. Ensure the follow boxes are checked:

    •

    On: Safe Links checks a list of known, malicious links when users click

    links in email. URLs are rewritten by default

    •

    Apply Safe Links to email messages sent within the organization

    •

    Apply real-time URL scanning for suspicious links and links that point

    to files

    •

    Wait for URL scanning to complete before delivering the message

    •

    On: Safe Links checks a list of known, malicious links when users click

    links in Microsoft Teams. URLs are not rewritten

    •

    On: Safe Links checks a list of known, malicious links when users click

    links in Microsoft Office apps. URLs are not rewritten

    7. Under Click protection settings check Track user clicks and uncheck Let

    users click through to the original URL

    8. Select Save

    To enable the Safe Links policy for Office 365, use the Exchange Online

    PowerShell Module:

    1. Connect using Connect-ExchangeOnline.

    2. Run the following PowerShell command:

    New-SafeLinksPolicy -Name "My SafeLinks Policy" -EnableSafeLinksForEmail

    $true -EnableSafeLinksForTeams $true -EnableSafeLinksForOffice $true -

    ScanUrls $true -DeliverMessageAfterScan $true -EnableForInternalSenders $true

    -AllowClickThrough $false'
  checks:
  - type: manual_review
    info: 'To verify Defender for Office Safe Links policy for Office is enabled, use the

      Microsoft 365 Admin Center:

      1. Under Admin centers click Security.

      2. Under Email & collaboration select Policies & rules

