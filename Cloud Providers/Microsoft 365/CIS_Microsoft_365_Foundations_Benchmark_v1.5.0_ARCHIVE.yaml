  - E3 Level 2
  description: You should control sharing of documents to external domains by either blocking domains or only allowing sharing
    with specific named domains.
  rationale: Attackers will often attempt to expose sensitive information to external entities through sharing, and restricting
    the domains that your users can share documents with will reduce that surface area.
  impact: Enabling this feature will prevent users from sharing documents with domains outside of the organization unless
    allowed.
  references: []
