  page_start: 144
  audit_raw: 'To verify audit log search is enabled, use the Microsoft 365 Admin Center:

    1. Log in as an administrator.

    2. Navigate to the Microsoft Purview compliance portal by going to

    https://compliance.office.com

    3. Under Solutions, select Audit then select an applicable time frame.

    4. Verify that you are able to do searches (e.g. try searching for Activities as

    Accessed file and results should be displayed).

    To verify audit log search is enabled, use the Exchange Online PowerShell

    Module:

    1. Connect to Exchange Online using Connect-ExchangeOnline.

    2. Run the following PowerShell command:

    Get-AdminAuditLogConfig | FL UnifiedAuditLogIngestionEnabled

    3. Verify the resulting value is UnifiedAuditLogIngestionEnabled : True.'
  remediation: 'To enable Microsoft 365 audit log search, use the Microsoft 365 Admin Center:

    1. Log in as an administrator.

    2. Navigate to the Microsoft Purview compliance portal by going to

    https://compliance.office.com

    3. Under Solutions, select Audit.

    4. Click Start recording user and admin activity next to the information warning

    at the top.

    5. Click Yes on the dialog box to confirm.

    To enable Microsoft 365 audit log search via Exchange Online PowerShell:

    1. Connect to Exchange Online using Connect-ExchangeOnline.

    2. Run the following PowerShell command:

    Set-AdminAuditLogConfig -UnifiedAuditLogIngestionEnabled $true'
  checks:
  - type: manual_review
    info: 'To verify audit log search is enabled, use the Microsoft 365 Admin Center:

      1. Log in as an administrator.

      2. Navigate to the Microsoft Purview compliance portal by going to

      https://compliance.office.com

