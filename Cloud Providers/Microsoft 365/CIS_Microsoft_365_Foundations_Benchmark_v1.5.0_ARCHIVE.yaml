controls:
- id: 1.1.1
  title: (L1) Ensure multifactor authentication is enabled for all users in administrative roles
  scoring: scored
  profile:
  - E3 Level 1
  description: 'Enable multifactor authentication for all users who are members of administrative roles in the Microsoft 365
    tenant. These include roles such as: • Global Administrator • Billing Administrator • Exchange Administrator • SharePoint
    Administrator • Password Administrator • Skype for Business Administrator • Service Support Administrator • User Administrator
    • Dynamics 365 Service Administrator • Power BI Administrator'
  rationale: Multifactor authentication requires an individual to present a minimum of two separate forms of authentication
    before access is granted. Multifactor authentication provides additional assurance that the individual attempting to gain
    access is who they claim to be. With multifactor authentication, an attacker would need to compromise at least two different
    authentication mechanisms, increasing the difficulty of compromise and thus reducing the risk.
  impact: Implementation of multifactor authentication for all users in administrative roles will necessitate a change to
    user routine. All users in administrative roles will be required to enroll in multifactor authentication using phone,
    SMS, or an authentication application. After enrollment, use of multifactor authentication will be required for future
    access to the environment.
  references:
  - 1. https://docs.microsoft.com/en-us/graph/api/resources/security-apioverview?view=graph-rest-beta
  page_start: 14
  audit_raw: 'To verify the multifactor authentication configuration for administrators, use the

    Microsoft 365 Admin Center:

    1. Log in to https://admin.microsoft.com as a Global Administrator.

    2. Go to Admin centers and click on Azure Active Directory.

    3. Select Enterprise applications then, under Security, select Conditional

    Access.

    4. Review the list of policies and ensure that there is a policy that requires the Grant

    access control with Require multi-factor authentication for the appropriate

    Directory roles under Users and groups

    To verify the multifactor authentication configuration for administrators, use the

    M365 SecureScore service:

    1. Log in to the Secure Score portal (https://security.microsoft.com) using admin

    permissions (global admin or a custom admin role) for an Office 365 Enterprise,

    Microsoft 365 Business, or Office 365 Business Premium subscription.

    2. Click on Require MFA for Azure AD privileged roles policy to check MFA for

    admin users.

    3. It will show the number of Admin users who do not have MFA configured.

    This information is also available via the Microsoft Graph Security API:

    GET https://graph.microsoft.com/beta/security/secureScores'
  remediation: 'To enable multifactor authentication for administrators, use the Microsoft 365

    Admin Center:

    1. Log in to https://admin.microsoft.com as a Global Administrator.

    2. Go to Admin centers and click on Azure Active Directory.

    3. Select Enterprise applications then, under Security, select Conditional

    Access.

    4. Click New policy

    5. Go to Assignments > Users and groups > Include > Select users and groups >

    check Directory roles.

    6. At a minimum, select the following roles: Billing admin, Conditional Access

    admin, Exchange admin, Global admin, Helpdesk admin, Security admin,

    SharePoint admin, and User admin.

    7. Go to Cloud apps or actions > Cloud apps > Include > select All cloud apps

    (and don''t exclude any apps).

    8. Under Access controls > Grant > select Grant access > check Require multifactor authentication (and nothing else).

    9. Leave all other conditions blank.

    10. Make sure the policy is enabled.

    11. Create.'
  checks:
  - type: sql
    command: Select Enterprise applications then, under Security, select Conditional
    severity: medium
    info: 'To verify the multifactor authentication configuration for administrators, use the

      Microsoft 365 Admin Center:

      1. Log in to https://admin.microsoft.com as a Global Administrator.

      2. Go to Admin centers and click on Azure Active Directory.

      3. Select Enterprise applications then, under Security, select Conditional

      Access.

      4. Review the list of policies and ensure that there is a policy that requires'
- id: 1.1.2
  title: (L2) Ensure multifactor authentication is enabled for all users in all roles
  scoring: manual
  profile:
  - E3 Level 2
  description: Enable multifactor authentication for all users in the Microsoft 365 tenant. Users will be prompted to authenticate
    with a second factor upon logging in to Microsoft 365 services. The second factor is most commonly a text message to a
    registered mobile phone number where they type in an authorization code, or with a mobile application like Microsoft Authenticator.
  rationale: Multifactor authentication requires an individual to present a minimum of two separate forms of authentication
    before access is granted. Multifactor authentication provides additional assurance that the individual attempting to gain
    access is who they claim to be. With multifactor authentication, an attacker would need to compromise at least two different
    authentication mechanisms, increasing the difficulty of compromise and thus reducing the risk.
  impact: Implementation of multifactor authentication for all users will necessitate a change to user routine. All users
    will be required to enroll in multifactor authentication using phone, SMS, or an authentication application. After enrollment,
    use of multifactor authentication will be required for future authentication to the environment.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/conditionalaccess/howto-conditional-access-policy-admin-mfa
  - 2. https://docs.microsoft.com/en-us/azure/active-directory/conditionalaccess/howto-conditional-access-policy-all-users-mfa
  page_start: 17
  audit_raw: 'To verify the multifactor authentication configuration for all users, use the

    Microsoft 365 Admin Center:

    1. Log in to https://admin.microsoft.com as a Global Administrator.

    2. Go to Admin centers and click on Azure Active Directory.

    3. Select Enterprise applications then, under Security, select Conditional

    Access.

    4. Review the list of policies and ensure that there is a policy that requires the Grant

    access control with Require multi-factor authentication for All users under

    Users and groups

    To verify the multifactor authentication configuration for administrators, use the

    M365 SecureScore service:

    1. Log in to the Secure Score portal (https://security.microsoft.com/securescore)

    using admin permissions (global admin or a custom admin role) for an Office 365

    Enterprise, Microsoft 365 Business, or Office 365 Business Premium

    subscription.

    2. Click on Ensure all users can complete multi-factor authentication for

    secure access recommended action to check MFA for all users.

    3. It will show the number of users who do not have MFA configured.

    This information is also available via the Microsoft Graph Security API:

    GET https://graph.microsoft.com/beta/security/secureScores'
  remediation: 'To enable multifactor authentication for all users, use the Microsoft 365 Admin

    Center:

    1. Log in to https://admin.microsoft.com as a Global Administrator.

    2. Go to Admin centers and click on Azure Active Directory.

    3. Select Enterprise applications then, under Security, select Conditional

    Access.

    4. Click New policy

    5. Go to Assignments > Users and groups > Include > select All users (and do not

    exclude any user).

    6. Select Cloud apps or actions > All cloud apps (and don''t exclude any apps)

    7.

    Access Controls > Grant > Require multi-factor authentication (and nothing

    else)

    8. Leave all other conditions blank

    9. Make sure the policy is Enabled/On

    10. Create'
