    severity: medium
- id: '6.4'
  title: (L2) Ensure external storage providers available in Outlook on the Web are restricted
  scoring: scored
  profile:
  - E3 Level 2
  description: You should restrict storage providers that are integrated with Outlook on the Web.
  rationale: By default additional storage providers are allowed in Outlook on the Web (such as Box, Dropbox, Facebook, Google
    Drive, OneDrive Personal, etc.). This could lead to information leakage and additional risk of infection from organizational
    non-trusted storage providers. Restricting this will inherently reduce risk as it will narrow opportunities for infection
    and data leakage.
  impact: Impact associated with this change is highly dependent upon current practices in the tenant. If users do not use
    other storage providers, then minimal impact is likely. However, if users do regularly utilize providers outside of the
    tenant this will affect their ability to continue to do so.
  references:
  - 1. https://docs.microsoft.com/en-us/powershell/module/exchange/client-access/setowamailboxpolicy?view=exchange-ps
  page_start: 179
  audit_raw: 'To verify external storage providers are disabled, use the Exchange Online

    PowerShell Module:

    1. Connect to Exchange Online using Connect-ExchangeOnline.

    2. Run the following PowerShell command:

    Get-OwaMailboxPolicy | Format-Table Name, AdditionalStorageProvidersAvailable

    3. Verify that the value returned is False.'
  remediation: 'To disable external storage providers, use the Exchange Online PowerShell

    Module:

    1. Connect to Exchange Online using Connect-ExchangeOnline.

    2. Run the following PowerShell command:

    Set-OwaMailboxPolicy -Identity OwaMailboxPolicy-Default -

    AdditionalStorageProvidersAvailable $false

    3. Run the following Powershell command to verify that the value is now False:

    Get-OwaMailboxPolicy | Format-Table Name, AdditionalStorageProvidersAvailable'
  checks:
  - type: manual_review
    info: 'To verify external storage providers are disabled, use the Exchange Online

      PowerShell Module:

      1. Connect to Exchange Online using Connect-ExchangeOnline.

      2. Run the following PowerShell command:

      Get-OwaMailboxPolicy | Format-Table Name, AdditionalStorageProvidersAvailable

      3. Verify that the value returned is False.'
    severity: medium
- id: '7.1'
  title: (L1) Ensure mobile device management policies are set to require advanced security configurations
  scoring: manual
  profile:
  - E3 Level 1
  description: You should configure your mobile device management policies to require advanced security configurations. If
    you do not require this, users will be able to connect from devices that are vulnerable to basic exploits, leading to
    potential breaches of accounts and data.
  rationale: Managing mobile devices in your organization, helps provide a basic level of security to protect against attacks
    from these platforms. For example ensure that the device is up to date on patches or is not rooted. These configurations
    open those devices to vulnerabilities that are addressed in patched versions of the mobile OS.
  impact: The impact associated with this change is dependent upon the settings specified in the mobile device configuration
    profile.
  references: []
