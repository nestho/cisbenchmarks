- id: '4.3'
  title: (L1) Ensure all forms of mail forwarding are blocked and/or disabled
  scoring: scored
  profile:
  - E3 Level 1
  description: 'You should set your Exchange Online mail transport rules to not forward email to domains outside of your organization.
    Automatic forwarding to prevent users from autoforwarding mail via Outlook or Outlook on the web should also be disabled.
    Alongside this Client Rules Forwarding Block, which prevents the use of any client-side rules that forward email to an
    external domain, should also be enabled. NOTE: Any exclusions should be implemented based on organizational policy.'
  rationale: Attackers often create these rules to exfiltrate data from your tenancy, this could be accomplished via access
    to an end-user account or otherwise.
  impact: Care should be taken before implementation to ensure there is no business need for case-by-case auto-forwarding.
    Disabling auto-forwarding to remote domains will affect all users and in an organization. Any exclusions should be implemented
    based on organizational policy.
  references:
  - 1. https://docs.microsoft.com/en-us/exchange/policy-and-compliance/mail-flowrules/mail-flow-rule-procedures?view=exchserver-2019
  - 2. https://docs.microsoft.com/en-us/archive/blogs/exovoice/disable-automaticforwarding-in-office-365-and-exchange-server-to-prevent-information-leakage
  page_start: 120
  audit_raw: 'NOTE: Audit is a three step procedure as follows:

    STEP 1: Transport rules

    To verify the mail transport rules do not forward email to external domains, use

    the Microsoft 365 Admin Center:

    1. Select Exchange.

    2. Select Mail Flow and Rules.

    3. Review the rules and verify that none of them are forwards to external domains.

    To verify that no rules are forwarding the email to external domains, you can also

    use the Exchange Online PowerShell module:

    1. Connect to Exchange online using Connect-ExchangeOnline.

    2. Run the following PowerShell command to review the Transport Rules that are

    redirecting email:

    Get-TransportRule | Where-Object {$_.RedirectMessageTo -ne $null} | ft

    Name,RedirectMessageTo

    3. Verify that none of the addresses are going to external domains

    STEP 2: Automatic forwarding

    To verify automatic forwarding is disabled using the Microsoft 365 Admin Center:

    1. Select Exchange under Admin centers

    2. Under Mail flow select Remote domains

    3. Click on the default policy.

    4. Click Edit reply types in the pane on the right

    5. Ensure Allow automatic forwarding is not checked.

    To verify that automatic forwarding is disabled, you may use the Exchange Online

    PowerShell:

    1. Connect to Exchange online using Connect-ExchangeOnline.

    2. Run the following PowerShell to find if auto-forwarding is enabled to remote

    domains:

    Get-RemoteDomain Default | fl AllowedOOFType, AutoForwardEnabled

    3. Review the AutoForwardEnabled parameter, and verify it is set to False.

    STEP 3: Block client rules for forwarding

    To verify the Client Rules Forwarding Block is enabled, use the Microsoft 365

    Admin Center:

    1. Go to Exchange Admin Center.

    2. Select mail flow.

    3. Select Rules.

    4. Verify that ''Client Rules To External Block'' exists.

    To verify the Client Rules Forwarding Block is enabled, use the Exchange Online

    PowerShell Module:

    1. Connect to Exchange Online using Connect-ExchangeOnline.

    2. Run the following Exchange Online PowerShell command:

    Get-TransportRule | where { $_.Identity -like ''*Client Rules To External

    Block*'' }

    • Note that Client Rules To External Block is a placeholder for the name of said

    rule.

    3. Verify that ''Client Rules To External Block'' state is set to Enabled.'
  remediation: 'NOTE: Remediation is a three step procedure as follows:

    STEP 1: Transport rules

    To alter the mail transport rules so they do not forward email to external domains,

    use the Microsoft 365 Admin Center:

    1. Select Exchange.

    2. Select Mail Flow and Rules.

    3. For each rule that forwards email to external domains, select the rule and click

    the ''Delete'' icon.

    To perform remediation you may also use the Exchange Online PowerShell

    Module:

    1. Connect to Exchange Online user Connect-ExchangeOnline.

    2. Run the following PowerShell command:

    Remove-TransportRule {RuleName}

    3. To verify this worked you may re-run the audit command as follows:

    Get-TransportRule | Where-Object {$_.RedirectMessageTo -ne $null} | ft

    Name,RedirectMessageTo

    STEP 2: Automatic forwarding

    To verify disable automatic forwarding using the Microsoft 365 Admin Center:

    1. Select Exchange under Admin centers

    2. Under Mail flow select Remote domains

    3. Click on the default policy.

    4. Click Edit reply types in the pane on the right

    5. Ensure Allow automatic forwarding is not checked.

    To perform remediation you may use the Exchange Online PowerShell Module:

    1. Connect to Exchange online using Connect-ExchangeOnline.

    2. Run the following PowerShell to disable auto-forwarding to remote domains:

    Set-RemoteDomain Default -AutoForwardEnabled $false

    3. Run the following PowerShell to verify AutoForwardEnabled is now set to False.

    Get-RemoteDomain Default | fl AllowedOOFType, AutoForwardEnabled

    STEP 3: Block client rules for forwarding

    To create the Client Rules Forwarding Block, use the Exchange Online

    PowerShell Module:

    1. Connect to Exchange Online using Connect-ExchangeOnline.

    2. Run the following Exchange Online PowerShell commands to create a rule:

    $rejectMessageText = "To improve security, auto-forwarding rules to external

    addresses have been disabled. Please contact your Microsoft Partner if you''d

    like to set up an exception."

    New-TransportRule -name "Client Rules To External Block" -Priority 0 -

    SentToScope NotInOrganization -FromScope InOrganization -MessageTypeMatches

    AutoForward -RejectMessageEnhancedStatusCode 5.7.1 -RejectMessageReasonText

    $rejectMessageText

    • Note that Client Rules To External Block is a placeholder name, this may be

    named based on preference.

    3. Verify that Client Rules To External Block or other named preference rule is

    created.'
  checks:
  - type: manual_review
    info: 'NOTE: Audit is a three step procedure as follows:

      STEP 1: Transport rules

      To verify the mail transport rules do not forward email to external domains, use

      the Microsoft 365 Admin Center:

      1. Select Exchange.

      2. Select Mail Flow and Rules.

