      Module:

      1. Connect to E'
    severity: medium
- id: '5.2'
  title: (L1) Ensure mailbox auditing for all users is Enabled
  scoring: scored
  profile:
  - E3 Level 1
  description: By turning on mailbox auditing, Microsoft 365 back office teams can track logons to a mailbox as well as what
    actions are taken while the user is logged on. After you turn on mailbox audit logging for a mailbox, you can search the
    audit log for mailbox activity. Additionally, when mailbox audit logging is turned on, some actions performed by administrators,
    delegates, and owners are logged by default.
  rationale: 'Starting in January 2019, Microsoft is turning on mailbox audit logging by default for all organizations. This
    means that certain actions performed by mailbox owners, delegates, and admins are automatically logged, and the corresponding
    mailbox audit records will be available when you search for them in the mailbox audit log. When mailbox auditing on by
    default is turned on for the organization, the AuditEnabled property for affected mailboxes won''t be changed from False
    to True. In other words, mailbox auditing on by default ignores the AuditEnabled property on mailboxes. However, only
    certain mailbox types support default auditing On • User Mailboxes • Shared Mailboxes • Microsoft 365 Group Mailboxes
    The remaining mailbox types require auditing be turned on at the mailbox level: • Resource Mailboxes • Public Folder Mailboxes
    • DiscoverySearch Mailbox Whether it is for regulatory compliance or for tracking unauthorized configuration changes in
    Microsoft 365, enabling mailbox auditing allows for Microsoft 365 back office teams to run security operations, forensics
    or general investigations on mailbox activities. NOTE: Without advanced auditing (E5 function) the logs are limited to
    90 days.'
  impact: ''
  references:
  - 1. https://docs.microsoft.com/en-us/microsoft-365/compliance/enable-mailboxauditing?view=o365-worldwide
  page_start: 146
  audit_raw: 'To verify mailbox auditing is enabled by default, use the Exchange Online

    PowerShell Module:

    1. Run Microsoft Exchange Online PowerShell Module.

    2. Connect using Connect-ExchangeOnline.

    3. Run the following PowerShell command:

    Get-OrganizationConfig | Format-List AuditDisabled

    4. Verify AuditDisabled is set to False.

    To verify mailbox auditing is enabled for all mailboxes that don''t support default

    auditing, use the Exchange Online PowerShell Module:

    1. Run Microsoft Exchange Online PowerShell Module.

    2. Connect using Connect-ExchangeOnline.

    3. Run the following PowerShell command:

    Get-Mailbox -ResultSize Unlimited | Where-Object {$_.AuditEnabled -ne $true -

    and ($_.RecipientTypeDetails -ne "UserMailbox" -or $_.RecipientTypeDetails -

    ne "SharedMailbox")}

    Alternatively you may run the following command:

    Get-mailbox | Where AuditEnabled -Match ''False'' | select UserPrincipalName,

    auditenabled

    4. Verify AuditEnabled is set to True for all mailboxes that are not a user, shared, or

    group mailbox.'
  remediation: 'To enable mailbox auditing for all users, use the Exchange Online PowerShell

    Module:

    1. Run Microsoft Exchange Online PowerShell Module.

    2. Connect using Connect-ExchangeOnline.

    3. Run the following PowerShell commands:

    $AuditAdmin = @("Copy", "Create", "FolderBind",

    "HardDelete", "MessageBind", "Move", "MoveToDeletedItems", "SendAs",

    "SendOnBehalf", "SoftDelete", "Update", "UpdateCalendarDelegation",

    "UpdateFolderPermissions", "UpdateInboxRules")

    $AuditDelegate =

    @("Create", "FolderBind", "HardDelete", "Move", "MoveToDeletedItems", "SendAs

    ", "SendOnBehalf", "SoftDelete", "Update", "UpdateFolderPermissions", "Update

    InboxRules")

    $AdminOwner =

    @("Create", "HardDelete", "MailboxLogin", "Move", "MoveToDeletedItems", "Soft

    Delete", "Update", "UpdateCalendarDelegation",

    "UpdateFolderPermissions", "UpdateInboxRules")

    Get-Mailbox -ResultSize Unlimited | Set-Mailbox -AuditEnabled $true -

    AuditLogAgeLimit 180 -AuditAdmin $AuditAdmin -AuditDelegate $AuditDelegate -

    AuditOwner $AuditOwner'
  checks:
  - type: manual_review
    info: 'To verify mailbox auditing is enabled by default, use the Exchange Online

      PowerShell Module:

      1. Run Microsoft Exchange Online PowerShell Module.

      2. Connect using Connect-ExchangeOnline.

      3. Run the following PowerShell command:

      Get-OrganizationConfig | Format-List AuditDisabled

      4. Verify AuditDisabled is set to False.

      To verify mailbox auditing is enabled for all mailboxes that don''t support default

      auditing, use the Exchange Online PowerShell Module:

      1. Run Microsoft Exchange Online PowerShell M'
    severity: medium
- id: '5.3'
  title: (L1) Ensure the Azure AD 'Risky sign-ins' report is reviewed at least weekly
  scoring: manual
  profile:
  - E3 Level 1
  description: 'This report contains records of accounts that have had activity that could indicate they are compromised,
    such as accounts that have: • successfully signed in after multiple failures, which is an indication that the accounts
    have cracked passwords • signed in to your tenant from a client IP address that has been recognized by Microsoft as an
    anonymous proxy IP address (such as a TOR network) • successful sign-ins from users where two sign-ins appeared to originate
    from different regions and the time between sign-ins makes it impossible for the user to have traveled between those regions'
  rationale: Reviewing this report on a regular basis allows for identification and remediation of compromised accounts.
  impact: ''
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/reportsmonitoring/concept-user-at-risk
  - 2. https://docs.microsoft.com/en-us/azure/active-directory/reports-monitoring/howtoremediate-users-flagged-for-risk
  page_start: 150
  audit_raw: 'To verify the report is being reviewed at least weekly, confirm that the necessary

    procedures are in place and being followed.'
  remediation: 'To review the report, perform the following steps using the Azure Portal:

    1. Go to portal.azure.com.

    2. Click Azure Active Directory.

    3. Under Manage click on Security

    4. Under Report click on Risky sign-ins

    5. Review by Risk level (aggregate).

    To get risky sign-ins event report programmatically, use following graph API:

    https://graph.microsoft.com/beta/identityRiskEvents?$filter=riskEventDateTime

    gt < 7 days older datetime > and riskEventStatus eq ''active'''
  checks:
  - type: manual_review
    info: 'To verify the report is being reviewed at least weekly, confirm that the necessary

      procedures are in place and being followed.'
    severity: medium
