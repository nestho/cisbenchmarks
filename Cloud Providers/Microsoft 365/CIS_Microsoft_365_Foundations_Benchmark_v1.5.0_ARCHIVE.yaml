- id: '6.3'
  title: (L1) Ensure expiration time for external sharing links is set
  scoring: scored
  profile:
  - E3 Level 1
  description: The external sharing features of Microsoft SharePoint let users in your organization share content with people
    outside the organization (such as partners, vendors, clients, or customers). External sharing in SharePoint is part of
    secure collaboration with Microsoft 365.
  rationale: An attacker can compromise a user account for a short period of time, send anonymous sharing links to an external
    account, then take their time accessing the data. They can also compromise external accounts and steal the anonymous sharing
    links sent to those external entities well after the data has been shared. Restricting how long the links are valid can
    reduce the window of opportunity for attackers.
  impact: Enabling this feature will ensure that link expire within the defined number of days. This will have an affect on
    links that were previously not set with an expiration.
  references:
  - 1. https://docs.microsoft.com/en-us/sharepoint/turn-external-sharing-on-or-off
  page_start: 177
  audit_raw: 'To verify anonymous access links are correctly set to expire, use the Microsoft

    365 Admin Center:

    1. Select Admin Centers and SharePoint.

    2. Expand Polices then click Sharing.

    3. Under Choose expiration and permissions options for Anyone links. verify if

    These links must expire within this many days is checked.

    4. Confirm the number of days is set to the desired value, such as 30.

    To verify anonymous links are correctly set to expire, you can also use

    SharePoint Online PowerShell:

    1. Connect to SharePoint Online using Connect-SPOService

    2. Run the following PowerShell command:

    Get-SPOTenant | fl RequireAnonymousLinksExpireInDays

    3. Verify that the returned value is at most 30 days but is not set to -1'
  remediation: 'To set expiration for anonymous access links, use the Microsoft 365 Admin

    Center

    1. Select Admin Centers and SharePoint

    2. Expand Polices then click Sharing

    3. Under Choose expiration and permissions options for Anyone links. check

    the These links must expire within this many days

    4. Set to the desired number of days, such as 30

    5. Click Save

    To set expiration for anonymous access links, you can also use SharePoint

    Online PowerShell:

    1. Connect to SharePoint Online using Connect-SPOService

    2. Run the following PowerShell command:

    set-SPOTenant -RequireAnonymousLinksExpireInDays 30'
  checks:
  - type: manual_review
    info: 'To verify anonymous access links are correctly set to expire, use the Microsoft

      365 Admin Center:

      1. Select Admin Centers and SharePoint.

      2. Expand Polices then click Sharing.

      3. Under Choose expiration and permissions options for Anyone links. verify if

      These links must expire within this many days is checked.

      4. Confirm the number of days is set to the desired value, such as 30.

