- id: '6.2'
  title: (L2) Block OneDrive for Business sync from unmanaged devices
  scoring: scored
  profile:
  - E3 Level 2
  description: Microsoft OneDrive allows users to sign in their cloud tenant account, and begin syncing select folders or
    the entire contents of OneDrive to a local computer. By default this includes any computer with OneDrive already installed,
    whether or not it is Azure Domain Joined or Active Directory Domain joined.
  rationale: 'Unmanaged devices pose a risk, since their security cannot be verified through existing security policies, brokers
    or endpoint protection. Allowing users to sync data to these devices takes that data out of the control of the organization.
    This increases the risk of the data either being intentionally or accidentally leaked. Note: This setting is only applicable
    to Active Directory domains when operating in a hybrid configuration. It does not apply to Azure AD domains. If you have
    devices which are only Azure AD joined, consider using a Conditional Access Policy instead.'
  impact: Enabling this feature will prevent users from using the OneDrive for Business Sync client on devices that are not
    joined to the domains that were defined.
  references:
  - 1. https://docs.microsoft.com/en-us/powershell/module/sharepoint-online/setspotenantsyncclientrestriction?view=sharepoint-ps
  - 2. https://docs.microsoft.com/en-US/onedrive/allow-syncing-only-on-specificdomains?WT.mc_id=365AdminCSH_spo
  page_start: 174
  audit_raw: 'To verify sync settings on unmanaged devices, use the Microsoft 365 Admin

    Center:

    1. Navigate to Microsoft 365 administration portal (https://admin.microsoft.com),

    Click on All Admin Centers and then Show All, then SharePoint.

    2. Now click Settings followed by OneDrive - Sync

    3. Verify that Allow syncing only on computers joined to specific domains is

    checked

    4. Verify that the Active Directory domain GUIDS are listed in the box.

    • Use the Get-ADDomain PowerShell command to obtain the GUID for each onpremises domain

    To verify sync settings on unmanaged devices, you can also use SharePoint

    Online PowerShell:

    1. Connect to SharePoint Online using Connect-SPOService

    2. Run the following PowerShell command:

    Get-SPOTenantSyncClientRestriction | fl

    TenantRestrictionEnabled,AllowedDomainList

    3. Verify TenantRestrictionEnabled is set to True and AllowedDomainList is

    populated and valid.'
  remediation: 'To block the sync client on unmanaged devices, use the Microsoft 365 Admin

    Center:

    1. Navigate to Microsoft 365 administration portal (https://admin.microsoft.com),

    Click on All Admin Centers and then Show All, then SharePoint.

    2. Now click Settings followed by OneDrive - Sync

    3. Check the Allow syncing only on computers joined to specific domains

    4. Use the Get-ADDomain PowerShell command to obtain the GUID from each

    domain then add them to the box.

    5. Click Save

    To block the sync client on unmanaged devices, you can also use SharePoint

    Online PowerShell:

    1. Connect to SharePoint Online using Connect-SPOService

    2. Run the following PowerShell command and provide the DomainGuids from the

    Get-AADomain command:

    Set-SPOTenantSyncClientRestriction -Enable -DomainGuids "786548DD-877B-4760A749-6B1EFBC1190A; 877564FF-877B-4760-A749-6B1EFBC1190A"

    NOTE: Utilize the -BlockMacSync:$true parameter if you are not using conditional

    access to ensure Macs cannot sync.'
