    o Under Access Controls select Grant then in the right pane click Grant

    access then select Require password change.

    7. Click Select

    8. You may opt to begin in a state of Report Only as you step through

    implementation however, the policy will need to be set to On to be in effect.

    9. Click Create.

    NOTE: for more information regarding risk levels refer to Microsoft''s Identity Protection

    & Risk Doc'
