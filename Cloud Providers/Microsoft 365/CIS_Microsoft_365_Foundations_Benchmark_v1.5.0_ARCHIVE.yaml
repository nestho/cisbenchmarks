  title: (L1) Ensure that mobile device password reuse is prohibited
  scoring: manual
  profile:
  - E3 Level 1
  description: You should not allow your users to reuse the same password on their mobile devices.
  rationale: Devices without this protection are vulnerable to being accessed by attackers who can then steal account credentials,
    data, or install malware on the device. Choosing unique and unused passwords every time a password changes on mobile devices
    lessens the likelihood that the password can be guessed by an attacker.
  impact: This change will have a moderate user impact
  references: []
