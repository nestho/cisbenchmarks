- id: '1.5'
  title: (L1) Ensure Administrative accounts are separate and cloudonly
  scoring: manual
  profile:
  - E3 Level 1
  description: Administrative accounts are special privileged accounts that could have varying levels of access to data, users,
    and settings. Regular user accounts should never be utilized for Administrative tasks and care should be taken, in the
    case of a hybrid environment, to keep Administrative accounts separated from on-prem accounts. Administrative accounts
    should not have applications assigned so that they have no access to potentially vulnerable services (EX. email, Teams,
    SharePoint, etc.) and only access to perform tasks as needed for Administrative purposes.
  rationale: Ensuring administrative accounts are cloud-only, without applications assigned to them will reduce the attack
    surface of high privileged identities in your environment. In order to participate in Microsoft 365 security services
    such as Identity Protection, PIM and Conditional Access an administrative account will need a license attached to it.
    Ensure that the license used does not include any applications with potentially vulnerable services by using either Azure
    Premium P1 or Azure Premium P2 for the cloud-only account with administrator roles. In a hybrid environment, having separate
    accounts will help ensure that in the event of a breach in the cloud, that the breach does not affect the on-prem environment
    and viceversa.
  impact: Administrative users will have to switch accounts and utilizing login/logout functionality when performing Administrative
    tasks, as well as not benefiting from SSO.
  references:
  - 1. https://docs.microsoft.com/en-us/microsoft-365/admin/add-users/addusers?view=o365-worldwide
  page_start: 66
  audit_raw: 'To verify appropriately licensed, separate Administrative accounts are being

    utilized, use the Microsoft 365 Admin Center:

    1. Log in to https://admin.microsoft.com as a Global Administrator.

    2. Select Users > Active users then sort by the Licenses column.

    3. For each user account in an administrative role verify the following:

    o The account is Cloud only (not synced)

    o The account is assigned a license that is not associated with applications

    (Azure Premium P1, Azure Premium P2)'
  remediation: 'To created licensed, separate Administrative accounts for Administrative users,

    using the Microsoft 365 Admin Center:

    1. Log in to https://admin.microsoft.com as a Global Administrator.

    2. Go to Admin centers and click on Azure Active Directory.

    3. Select Users > Active users then click Add a user.

    4. Fill out the appropriate fields for Name, user, etc.

    5. When prompted to assign licenses select as needed Azure Premium P1 or Azure

    Premium P2, then click Next.

    6. Under the Option settings screen you may choose from several types of

    Administrative access roles. Choose Admin center access followed by the

    appropriate role then click Next.

    7. Select Finish adding.'
  checks:
  - type: manual_review
    info: 'To verify appropriately licensed, separate Administrative accounts are being

      utilized, use the Microsoft 365 Admin Center:

      1. Log in to https://admin.microsoft.com as a Global Administrator.

      2. Select Users > Active users then sort by the Licenses column.

      3. For each user account in an administrative role verify the following:

      o The account is Cloud only (not synced)

      o The account is assigned a license that is not associated with applications

      (Azure Premium P1, Azure Premium P2)'
    severity: medium
