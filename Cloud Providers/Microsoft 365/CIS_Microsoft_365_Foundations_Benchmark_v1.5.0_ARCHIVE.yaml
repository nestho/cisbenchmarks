- id: '2.8'
  title: (L2) - Ensure users installing Outlook add-ins is not allowed
  scoring: scored
  profile:
  - E3 Level 2
  description: By default, users can install add-ins in their Microsoft Outlook Desktop client, allowing data access within
    the client application. Do not allow users to install add-ins in Outlook.
  rationale: Attackers commonly use vulnerable and custom-built add-ins to access data in user applications. While allowing
    users to install add-ins by themselves does allow them to easily acquire useful add-ins that integrate with Microsoft
    applications, it can represent a risk if not used and monitored carefully. Disable future user's ability to install add-ins
    in Microsoft Outlook helps reduce your threat-surface and mitigate this risk.
  impact: Implementation of this change will impact both end users and administrators. End users will not be able to integrate
    third-party applications that they may wish to use. Administrators are likely to receive requests from end users to grant
    them permission to necessary third-party applications.
  references: []
  page_start: 87
  audit_raw: 'To verify that users installing Outlook add-ins is not allowed, use the Microsoft

    365 Admin Center:

    1. Select Admin Centers and Exchange.

    2. Click on the Classic Exchange admin center at the bottom.

    3. Select permissions from the Exchange navigation pane.

    4. Select user roles.

    5. Double click Default Role Assignment to open it and verify My Custom Apps My

    Marketplace Apps and My ReadWriteMailboxApps are Not Checked.

    To verify that users installing Outlook add-ins is not allowed, use the Microsoft

    Online PowerShell Module:

    1. Connect to Microsoft Online service using Connect-ExchangeOnline.

    2. Run the following Microsoft Online PowerShell command:

    Get-EXOMailbox | Select-Object -Unique RoleAssignmentPolicy | ForEach-Object

    { Get-RoleAssignmentPolicy -Identity $_.RoleAssignmentPolicy | Where-Object

    {$_.AssignedRoles -like "*Apps*"}} | Select-Object Identity,

    @{Name="AssignedRoles"; Expression={Get-Mailbox | Select-Object -Unique

    RoleAssignmentPolicy | ForEach-Object { Get-RoleAssignmentPolicy -Identity

    $_.RoleAssignmentPolicy | Select-Object -ExpandProperty AssignedRoles |

    Where-Object {$_ -like "*Apps*"}}}}

    3. Verify My Custom Apps My Marketplace Apps and My ReadWriteMailboxApps are

    not present.'
  remediation: 'To prohibit users installing Outlook add-ins, use the Microsoft 365 Admin Center:

    1. Select Admin Centers and Exchange.

    2. Click on the Classic Exchange admin center at the bottom.

    3. Select permissions from the Exchange navigation pane.

    4. Select user roles.

    5. Double click Default Role Assignment and deselect My Custom Apps My

    Marketplace Apps and My ReadWriteMailboxApps.

    To prohibit users installing Outlook add-ins, use the Microsoft Online PowerShell

    Module:

    1. Connect to Microsoft Online service using Connect-MSOLService.

    2. Run the following Microsoft Online PowerShell command:

    $newPolicyName = "Role Assignment Policy - Prevent Add-ins"

    $revisedRoles = "MyTeamMailboxes", "MyTextMessaging", "MyDistributionGroups",

    "MyMailSubscriptions", "MyBaseOptions", "MyVoiceMail",

    "MyProfileInformation", "MyContactInformation", "MyRetentionPolicies",

    "MyDistributionGroupMembership"

    New-RoleAssignmentPolicy -Name $newPolicyName -Roles $revisedRoles

    Set-RoleAssignmentPolicy -id $newPolicyName -IsDefault

    Get-Mailbox -ResultSize Unlimited | Set-Mailbox -RoleAssignmentPolicy

    $newPolicyName

    If you have other Role Assignment Policies modify the last line to filter out your

    custom policies'
