    severity: medium
- id: '1.4'
  title: (L1) Ensure that Office 365 Passwords Are Not Set to Expire
  scoring: scored
  profile:
  - E3 Level 1
  description: Microsoft cloud-only accounts have a pre-defined password policy that cannot be changed. The only items that
    can change are the number of days until a password expires and whether or not passwords expire at all.
  rationale: Organizations such as NIST and Microsoft have updated their password policy recommendations to not arbitrarily
    require users to change their passwords after a specific amount of time, unless there is evidence that the password is
    compromised or the user forgot it. They suggest this even for single factor (Password Only) use cases, with a reasoning
    that forcing arbitrary password changes on users actually make the passwords less secure. Other recommendations within
    this Benchmark suggest the use of MFA authentication for at least critical accounts (at minimum), which makes password
    expiration even less useful as well as password protection for Azure AD.
  impact: When setting passwords not to expire it is important to have other controls in place to supplement this setting.
    See below for related recommendations and user guidance. • Ban common passwords • Educate users to not reuse organization
    passwords anywhere else • Enforce Multi-Factor Authentication registration for all users • Enforce Multi-Factor Authentication
    registration
  references:
  - 1. https://pages.nist.gov/800-63-3/sp800-63b.html
  - 2. https://www.cisecurity.org/white-papers/cis-password-policy-guide/
  page_start: 63
  audit_raw: 'To verify Office 365 Passwords Are Not Set to Expire, use the Microsoft 365

    Admin Center:

    1. Expand Settings then select the Org Settings subcategory.

    2. Click on Security & privacy.

    3. Select Password expiration policy ensure that Set passwords to never

    expire (recommended) has been checked.

    To verify Office 365 Passwords Are Not Set to Expire, use the Microsoft Online

    PowerShell Module:

    1. Connect to Microsoft Online service using Connect-MSOLService.

    2. Run the following Microsoft Online PowerShell command:

    Get-MsolPasswordPolicy -DomainName <DomainName> | ft ValidityPeriod'
  remediation: 'To set Office 365 Passwords to Expire, use the Microsoft 365 Admin Center:

    1. Expand Settings then select the Org Settings subcategory.

    2. Click on Security & privacy.

    3. Select Password expiration policy.

    4. If the Set passwords to never expire (recommended) box is unchecked, check

    it.

    5. Click Save.

    To set Office 365 Passwords Are Not Set to Expire, use the Microsoft Online

    PowerShell Module:

    1. Connect to Microsoft Online service using Connect-MSOLService.

    2. Run the following Microsoft Online PowerShell command:

    Set-MsolPasswordPolicy -ValidityPeriod 2147483647 -DomainName <DomainName> -

    NotificationDays 30'
  checks:
  - type: manual_review
