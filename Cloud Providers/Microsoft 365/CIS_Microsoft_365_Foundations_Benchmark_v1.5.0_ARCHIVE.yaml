- id: '5.6'
  title: (L1) Ensure user role group changes are reviewed at least weekly
  scoring: manual
  profile:
  - E3 Level 1
  description: Role-Based Access Control allows for permissions to be assigned to users based on their roles within an organization.
    It is more manageable form of access control that is less prone to errors. These user roles can be audited inside of Microsoft
    Purview to provide a security auditor insight into user privilege change.
  rationale: Weekly reviews provide an opportunity to identify rights changes in an organization and is a large part of maintaining
    Least Privilege and preventing Privilege creep. Insider Threats, either intentional or unintentional can occur when a
    user has higher than needed privileges. Maintaining accountability of role membership will keep Insiders and malicious
    actors limited in the scope of potential damaging activities.
  impact: By performing regular reviews the Administrators assigning rights to users will need to inevitably provide justification
    for those changes to security auditors. Documentation that includes detailed policies, procedures, and change requests
    will need to be considered in order to keep a secure organization functioning within it's planned operational level.
  references:
  - 1. https://docs.microsoft.com/en-us/powershell/module/exchange/searchunifiedauditlog?view=exchange-ps
  page_start: 154
  audit_raw: 'To verify user role group changes are being reviewed at least weekly, confirm that the

    necessary procedures are in place and being followed.'
  remediation: 'To review user role group changes, perform the following steps using the

    Microsoft 365 Admin Center:

    1. Beneath Admin centers Click on Compliance to be redirected to Microsoft

    Purview.

    2. Click on Audit then select Search.

    3. In Activities find Added member to Role under the Role administration

    activities section.

    4. Set Start Date and End Date.

    5. Click Search.

    6. Review.

    To review user role group changes, perform the following steps using Exchange

    Online PowerShell Module:

    1. Connect to Exchange Online using Connect-ExchangeOnline

    2. Run the following Exchange Online PowerShell command:

    $startDate = ((Get-date).AddDays(-7)).ToShortDateString()

    $endDate = (Get-date).ToShortDateString()

    Search-UnifiedAuditLog -StartDate $startDate -EndDate $endDate | Where-Object

    { $_.Operations -eq "Add member to role." }

    3. Review the output'
  checks:
  - type: manual_review
    info: 'To verify user role group changes are being reviewed at least weekly, confirm that the

      necessary procedures are in place and being followed.'
    severity: medium
- id: '5.7'
  title: (L1) Ensure mail forwarding rules are reviewed at least weekly
  scoring: manual
  profile:
  - E3 Level 1
  description: The Exchange Online environment can be configured in a way that allows for automatic forwarding of e-mail.
    This can be done using Transport Rules in the Admin Center, Auto Forwarding per mailbox, and client-based rules in Outlook.
    Administrators and users both are given several methods to automatically and quickly send e-mails outside of your organization.
  rationale: Reviewing mail forwarding rules will provide the Messaging Administrator insight into possible attempts to exfiltrate
    data from the organization. Weekly review helps create a recognition of baseline, legitimate activity of users. This will
    aide in helping identify the more malicious activity of bad actors when/if they choose to use this side-channel.
  impact: There is no impacting to reviewing these reports.
  references: []
  page_start: 156
  audit_raw: 'To verify mail forwarding rules are being reviewed at least weekly, confirm that the

    necessary procedures are in place and being followed by the assigned employee.'
  remediation: "To review mail forwarding rules, use the Microsoft 365 Admin Center:\n1. Go to Exchange admin center.\n2.\
    \ Expand Reports then select Mail flow.\n3. Click on Auto forwarded messages report.\n4. Review\nNote: Mail flow reports\
    \ cannot be viewed from the Classic Exchange Admin Center\nTo review mail forwarding rules, use the following PowerShell\
    \ script:\nUses the administrator user credential to export Mail forwarding rules, User Delegates\nand SMTP Forwarding\
    \ policies to multiple csv files. First connect to Exchange Online\nand Azure Active Directory by using both Connect-ExchangeOnline\
    \ and ConnectMsolService\n$allUsers = @()\n$AllUsers = Get-MsolUser -All -EnabledFilter EnabledOnly | select ObjectID,\n\
    UserPrincipalName, FirstName, LastName, StrongAuthenticationRequirements,\nStsRefreshTokensValidFrom, StrongPasswordRequired,\n\
    LastPasswordChangeTimestamp | Where-Object {($_.UserPrincipalName -notlike\n\"*#EXT#*\")}\n$UserInboxRules = @()\n$UserDelegates\
    \ = @()\nforeach ($User in $allUsers)\n{\n Write-Host \"Checking inbox rules and delegates for user: \"\n$User.UserPrincipalName;\n\
    \ $UserInboxRules += Get-InboxRule -Mailbox $User.UserPrincipalname |\nSelect Name, Description, Enabled, Priority, ForwardTo,\n\
    ForwardAsAttachmentTo, RedirectTo, DeleteMessage | Where-Object\n{($_.ForwardTo -ne $null) -or ($_.ForwardAsAttachmentTo\
    \ -ne $null) -or\n($_.RedirectsTo -ne $null)}\n $UserDelegates += Get-MailboxPermission -Identity $User.UserPrincipalName\n\
    | Where-Object {($_.IsInherited -ne \"True\") -and ($_.User -notlike \"*SELF*\")}\n}\n$SMTPForwarding = Get-Mailbox -ResultSize\
    \ Unlimited | select\nDisplayName,ForwardingAddress,ForwardingSMTPAddress,DeliverToMailboxandForwar\nd | where {$_.ForwardingSMTPAddress\
    \ -ne $null}\n# Export list of inboxRules, Delegates and SMTP Forwards\n$UserInboxRules | Export-Csv MailForwardingRulesToExternalDomains.csv\n\
    $UserDelegates | Export-Csv MailboxDelegatePermissions.csv\n$SMTPForwarding | Export-Csv Mailboxsmtpforwarding.csv"
  checks:
  - type: manual_review
    info: 'To verify mail forwarding rules are being reviewed at least weekly, confirm that the

      necessary procedures are in place and being followed by the assigned employee.'
    severity: medium
