      4. Verify that either the policy Baseline policy: Block legacy authentication

      (Preview) is enabled or find another with the following settings enabled:

      o Under Client apps (preview) ensure that Mobile apps and desk'
    severity: medium
- id: 1.1.7
  title: (L1) Ensure that password hash sync is enabled for resiliency and leaked credential detection
  scoring: scored
  profile:
  - E3 Level 1
  description: Ensure that password hash sync is enabled for resiliency and leaked credential detection.
  rationale: Password hash synchronization is one of the sign-in methods used to accomplish hybrid identity. Azure AD Connect
    synchronizes a hash, of the hash, of a user's password from an on-premises Active Directory instance to a cloud-based
    Azure AD instance. Password hash synchronization helps by reducing the number of passwords your users need to maintain
    to just one. Enabling password hash synchronization also allows for leaked credential reporting. It can also be used as
    a backup authentication method when federation is used, if the federation provider fails.
  impact: Enabling this setting will prevent users from connecting with older versions of Office, ActiveSync or using protocols
    like IMAP, POP or SMTP. 27 | P a g e
  references: []
  page_start: 26
  audit_raw: 'To verify if Password Hash Sync is enabled, use the Azure AD Connect tool:

    1. Log in to the server that hosts the Azure AD Connect tool

    2. Run Azure AD Connect, and then click View current configuration. In the details

    pane, check whether Password synchronization is enabled on your tenant.

    This information is also available via the Microsoft Graph Security API:

    GET https://graph.microsoft.com/beta/security/secureScores

    26 | P a g e'
  remediation: 'To setup Password Hash Sync, use the following steps:

    1. Log in to the server that hosts the Azure AD Connect tool

    2. Double-click the Azure AD Connect icon that was created on the desktop

    3. Click Configure.

    4. On the Additional tasks page, select Customize synchronization options and

    click Next.

    5. Enter the username and password for your global administrator.

    6. On the Connect your directories screen, click Next.

    7. On the Domain and OU filtering screen, click Next.

    8. On the Optional features screen, check Password hash synchronization and

    click Next.

    9. On the Ready to configure screen click Configure.

    10. Once the configuration completes, click Exit.'
  checks:
  - type: manual_review
    info: 'To verify if Password Hash Sync is enabled, use the Azure AD Connect tool:

      1. Log in to the server that hosts the Azure AD Connect tool

      2. Run Azure AD Connect, and then click View current configuration. In the details

      pane, check whether Password synchronization is enabled on your tenant.

      This information is also available via the Microsoft Graph Security API:

      GET https://graph.microsoft.com/beta/security/secureScores

      26 | P a g e'
    severity: medium
- id: 1.1.8
  title: (L1) Enabled Identity Protection to identify anomalous logon behavior
  scoring: scored
  profile:
  - E5 Level 1
  - E5 Level 2
  description: Azure Active Directory Identity Protection monitors account behaviors and enables organizations to configure
    automated responses to detected suspicious actions related to user identities. Azure Active Directory Identity Protection
    sign-in risk detects risks in real-time and offline. A risky sign-in is an indicator for a sign-in attempt that might
    not have been performed by the legitimate owner of a user account. Azure Active Directory Identity Protection user risk
    policies detect the probability that a user account has been compromised. Azure Active Directory Privileged Identity Management
    can be used to audit roles, allow just in time activation of roles and allow for periodic role attestation. Organizations
    should remove permanent members from privileged Office 365 roles and instead make them eligible, through a JIT activation
    workflow.
  rationale: Azure Active Directory Identity Protection helps to discover at risk or compromised accounts in your environment.
    Identity based attacks continue to be a top source for breaches. Enabling Identity Protection not only helps to monitor
    and provide reporting, but also helps to automatically respond to identity based risks. Turning on the sign-in risk policy
    ensures that suspicious sign-ins are challenged for multifactor authentication. With the user risk policy turned on, Azure
    AD detects the probability that a user account has been compromised. As an administrator, you can configure a user risk
    conditional access policy to automatically respond to a specific user risk level. For example, you can block access to
    your resources or require a password change to get a user account back into a clean state. Organizations want to minimize
    the number of people who have access to secure information or resources, because that reduces the chance of a malicious
    actor getting that access, or an authorized user inadvertently impacting a sensitive resource. However, users still need
    to carry out privileged operations in Azure AD and Office 365. Organizations can give users just-in-time (JIT) privileged
    access to roles. There is a need for oversight for what those users are doing with their administrator privileges. PIM
    helps to mitigate the risk of excessive, unnecessary, or misused access rights. 33 | P a g e
  impact: When the policy triggers, the user will need MFA to access the account. In the case of a user who hasn't registered
    MFA on their account, they would be blocked from accessing their account. 30 | P a g e 1.1.10 (L2) Enable Azure AD Identity
    Protection user risk policies (Not Scored) When the policy triggers, access to the account will either be blocked or the
    user would be required to use multi-factor authentication and change their password. Users who haven't registered MFA
    on their account will be blocked from accessing it. If account access is blocked, an admin would need to recover the account.
    Thus, it is important to configure the MFA registration policy for all users who are a part of the user risk policy to
    ensure that they have registered MFA. 32 | P a g e 1.1.11 (L2) Use Just In Time privileged access to Office 365 roles
    (Not Scored) When the policy triggers, access to the account will either be blocked or the user would be required to use
    multi-factor authentication and change their password. Users who haven't registered MFA on their account will be blocked
    from accessing it. If account access is blocked, an admin would need to recover the account. Thus, it is important to
    configure the MFA registration policy for all users who are a part of the user risk policy to ensure that they have registered
    MFA. 35 | P a g e
  references: []
  page_start: 28
