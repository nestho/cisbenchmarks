  title: (L1) Ensure expiration time for external sharing links is set
  scoring: scored
  profile:
  - E3 Level 1
  description: You should restrict the length of time that anonymous access links are valid. You should configure your mobile
    device management policies to require advanced security configurations. If you do not require this, users will be able
    to connect from devices that are vulnerable to basic internet attacks, leading to potential breaches of accounts and data.
    You should not allow your users to reuse the same password on their mobile devices.
  rationale: An attacker can compromise a user account for a short period of time, send anonymous sharing links to an external
    account, then take their time accessing the data. They can also compromise external accounts and steal the anonymous sharing
    links sent to those external entities well after the data has been shared. Restricting how long the links are valid can
    reduce the window of opportunity for attackers. Managing mobile devices in your organization, helps provide a basic level
    of security to protect against attacks from these platforms. For example ensure that the device is up to date on patches
    or is not rooted. These configurations open those devices to vulnerabilities that are addressed in patched versions of
    the mobile OS. Devices without this protection are vulnerable to being accessed by attackers who can then steal account
    credentials, data, or install malware on the device. Choosing unique and unused passwords every time a password changes
    on mobile devices lessens the likelihood that the password can be guessed by an attacker.
