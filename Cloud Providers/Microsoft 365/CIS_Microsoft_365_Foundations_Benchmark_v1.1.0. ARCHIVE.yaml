- id: 1.1.3
  title: (L1) Ensure that between two and four global admins are designated
  scoring: scored
  profile:
  - E3 Level 1
  description: More than one global administrator should be designated so a single admin can be monitored and to provide redundancy
    should a single admin leave an organization. Additionally, there should be no more than four global admins set for any
    tenant.
  rationale: If there is only one global tenant administrator, he or she can perform malicious activity without the possibility
    of being discovered by another admin. If there are numerous global tenant administrators, the more likely it is that one
    of their accounts will be successfully breached by an external attacker.
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'To verify the number of global tenant administrators, use the Microsoft 365 Admin

    Center:

    1. Select Users > Active Users.

    2. Set Views to Global Admins.

    3. Review the list of Global Admins to confirm there are from two to four such

    accounts.

    To verify the number of global tenant administrators, you can also use the Office 365

    PowerShell MSOL:

    1. Connect to Microsoft 365 using Connect-MSOLService

    2. Run the following PowerShell commands:

    $role = Get-MsolRole -RoleName "Company Administrator"

    Get-MsolRoleMember -RoleObjectId $role.objectid

    This information is also available via the Microsoft Graph Security API:

    GET https://graph.microsoft.com/beta/security/secureScores

    18 | P a g e'
  remediation: 'To correct the number of global tenant administrators, use the Microsoft 365 Admin

    Center:

    1. Select Users > Active Users.

    2. Set Views to Global Admins.

    3. To create a new Global Admin:

    1. Select Add Users.

    2. Enter User Information.

    3. Select Roles.

    4. Select Global Administrator.

    5. Click Add.

    4. To remove Global Admins:

    1. Select User.

    2. Select Edit under Roles.

    3. Select Customized administrator and chose appropriate role.

    4. Click Save.'
  checks:
  - type: manual_review
    info: 'To verify the number of global tenant administrators, use the Microsoft 365 Admin

      Center:

      1. Select Users > Active Users.

      2. Set Views to Global Admins.

      3. Review the list of Global Admins to confirm there are from two to four such

      accounts.

      To verify the number of global tenant administrators, you can also use the Office 365

      PowerShell MSOL:

      1. Connect to Microsoft 365 using Connect-MSOLService

      2. Run the following PowerShell commands:

      $role = Get-MsolRole -RoleName "Company Administrator"

      Get-'
    severity: medium
- id: 1.1.4
  title: (L1) Ensure self-service password reset is enabled
  scoring: scored
  profile:
  - E3 Level 1
  description: Enabling self-service password reset allows users to reset their own passwords in Azure AD. When your users
    sign in to Microsoft 365, they will be prompted to enter additional contact information that will help them reset their
    password in the future.
  rationale: Users will no longer need to engage the helpdesk for password resets, and the password reset mechanism will automatically
    block common, easily guessable passwords.
  impact: ''
  references:
  - 1. https://support.office.com/en-us/article/let-users-reset-their-own-passwords-inoffice-365-5bc3f460-13cc-48c0-abd6-b80bae72d04a
  - 2. https://gallery.technet.microsoft.com/office/Enable-Self-Service-59846d88
  page_start: 20
  audit_raw: 'To verify self-service password reset is enabled, use the Microsoft 365 Admin Center:

    1. Under Admin centers choose Azure Active Directory.

    2. Choose Users from the left hand navigation.

    3. Choose Password reset under Users - All users.

    4. On the Properties page, ensure that All is selected under Self service password

    reset enabled.

    This information is also available via the Microsoft Graph Security API:

    GET https://graph.microsoft.com/beta/security/secureScores'
  remediation: 'To enable self-service password reset, use the Microsoft 365 Admin Center:

    1. Choose Settings > Security & privacy.

    2. Choose the link to go to the Azure admin center.

    3. Choose Users and groups > Password reset.

    4. On the Properties page, set the value to All is selected under Self service

    password reset enabled, and then choose Save.

    20 | P a g e'
  checks:
  - type: manual_review
    info: 'To verify self-service password reset is enabled, use the Microsoft 365 Admin Center:

      1. Under Admin centers choose Azure Active Directory.

      2. Choose Users from the left hand navigation.

      3. Choose Password reset under Users - All users.

      4. On the Properties page, ensure that All is selected under Self service password

      reset enabled.

      This information is also available via the Microsoft Graph Security API:

      GET https://graph.microsoft.com/beta/security/secureScores'
    severity: medium
- id: 1.1.5
  title: (L1) Ensure that password protection is enabled for Active Directory in hybrid environments
  scoring: scored
  profile:
  - E3 Level 1
  description: Enable Azure Active Directory Password Protection to Active Directory to protect against the use of common
    passwords.
  rationale: Azure Active Directory protects an organization by prohibiting the use of weak or leaked passwords. In addition,
    organizations can create custom banned password lists to prevent their users from using easily guessed passwords that
    are specific to their industry. Deploying this feature to Active Directory will strengthen the passwords that are used
    in the environment.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'To verify that Azure Active Directory Password Protection is enabled, use the

    Microsoft 365 Admin Center:

    1. Log in to https://admin.microsoft.com as a Global Administrator.

    2. Go to Admin centers and click on Azure Active Directory.

    3. Select Authentication methods under Security on the left side navigation.

    4. Select Password protection and ensure that Enable password protection on

    Windows Server Active Directory is set to Yes and also that Mode is set to

    Enforced

    5. Verify that the Domain Controller Agent and Proxy''s are deployed to the Domain

    Controllers in the environment

    22 | P a g e'
  remediation: 'To setup Azure Active Directory Password Protection, use the following steps:

    1. Download and install the Azure AD Password Proxies and DC Agents from the

    following location: https://www.microsoft.com/download/details.aspx?id=57071

    2. After the installation is complete, login to https://admin.microsoft.com as a

    Global Administrator.

    3. Go to Admin centers and click on Azure Active Directory.

    4. Select Authentication methods under Security on the left side navigation.

    5. Select Password protection and toggle Enable password protection on Windows

    Server Active Directory to Yes and Mode to Enforced

    23 | P a g e'
  checks:
  - type: manual_review
    info: 'To verify that Azure Active Directory Password Protection is enabled, use the

