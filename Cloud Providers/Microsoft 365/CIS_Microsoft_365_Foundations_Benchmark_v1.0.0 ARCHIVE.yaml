  scoring: scored
  profile:
  - Level 2
  description: Enabling the Advanced Threat Protection (ATP) Safe Links policy for Office applications allows URL's that existing
    inside of Office documents opened by Office, Office Online and Office mobile to be processed against ATP time-of-click
    verification.
  rationale: ATP Safe Links for Office applications extends phishing protection to documents that contain hyperlinks, even
    after they have been delivered to a user.
