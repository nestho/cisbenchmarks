controls:
- id: '1.1'
  title: (L1) Ensure multifactor authentication is enabled for all users in administrative roles
  scoring: scored
  profile:
  - Level 1
  description: 'Enable multifactor authentication for all users who are members of administrative roles in the Microsoft 365
    tenant. These include roles such as: • Global Administrator • Billing Administrator • Exchange Administrator • SharePoint
    Administrator • Password Administrator • Skype for Business Administrator • Service Administrator • User Management Administrator
    • Dynamics 365 Service Administrator • Power BI Administrator'
  rationale: Multifactor authentication requires an individual to present a minimum of two separate forms of authentication
    before access is granted. Multifactor authentication provides additional assurance that the individual attempting to gain
    access is who they claim to be. With multifactor authentication, an attacker would need to compromise at least two different
    authentication mechanisms, increasing the difficulty of compromise and thus reducing the risk.
  impact: ''
  references:
  - 1. https://docs.microsoft.com/en-us/graph/api/resources/security-apioverview?view=graph-rest-beta
  page_start: 11
  audit_raw: 'To verify the multifactor authentication configuration for administrators, use the

    Microsoft 365 Admin Center:

    1. Log in as a Global Administrator.

    11 | P a g e

    2. Go to Users > Active Users.

    3. Click on More > Multifactor Authentication Setup.

    4. Using the View Option, select the appropriate administrator role to review.

    5. Review Users for Multifactor authentication status.

    To verify the multifactor authentication configuration for administrators, use the

    Office 365 PowerShell MSOL:

    1. Connect to Microsoft 365 using Connect-MSOLService.

    2. Run the following PowerShell command:

    Get-MsolRole | Where-Object {$_.Name -like "*Administrator*"} | ForEachObject { Get-MsolRoleMember -RoleObjectId $_.ObjectId
    } | Select-Object

    EmailAddress, @{N="MFA Status";

    e={$_.StrongAuthenticationRequirements.state}} -Unique

    3. Ensure that MFA Status equals Enforced.

    To verify the multifactor authentication configuration for administrators, use the

    M365 SecureScore service:

    1. Log in to the securescore portal (https://securescore.office.com) using admin

    permissions (global admin or a custom admin role) for an Office 365 Enterprise,

    Microsoft 365 Business, or Office 365 Business Premium subscription.

    2. Click on Require MFA for Azure AD privileged roles policy to check MFA for

    admin users.

    3. It will show the number of Admin users who do not have MFA configured.

    This information is also available via the Microsoft Graph Security API:

    GET https://graph.microsoft.com/beta/security/secureScores'
  remediation: 'To enable multifactor authentication for administrators, use the Azure Portal:

    1. Sign in to the Azure Portal as a Global Administrator, Security Administrator, or

    Conditional Access Administrator.

    2. In the Azure Portal, on the left navbar, click Azure Active Directory.

    3. On the Azure Active Directory page, in the Security section, click Conditional

    access.

    4. In the list of policies, click the policy named Baseline policy: Require MFA for

    admins.

    5. To enable the policy, select Use policy immediately.

    6. Click Save.

    12 | P a g e

    To enable multifactor authentication for administrators, use the Office 365

    PowerShell MSOL:

    1. Connect to Microsoft 365 using Connect-MSOLService.

    2. Run the following PowerShell command:

    $Auth = New-Object -TypeName

    Microsoft.Online.Administration.StrongAuthenticationRequirement -Property

    @{RelyingParty = "*"; State = "Enabled"}

    Get-MsolRole | Where-Object {$_.Name -like "*Administrator*"} | ForEachObject { Get-MsolRoleMember -RoleObjectId $_.ObjectId
    } | Select-Object -

    Unique | ForEach-Object { Set-MsolUser -ObjectId $_.ObjectId -

    StrongAuthenticationRequirements $Auth }'
  checks:
  - type: sql
    command: select the appropriate administrator role to review.
    severity: medium
    info: 'To verify the multifactor authentication configuration for administrators, use the

      Microsoft 365 Admin Center:

      1. Log in as a Global Administrator.

      11 | P a g e

      2. Go to Users > Active Users.

      3. Click on More > Multifactor Authentication Setup.

      4. Using the View Option, select the appropriate administrator role to review.

      5. Review Users for Multifactor authentication status.

      To verify the multifa'
- id: '1.2'
  title: (L2) Ensure multifactor authentication is enabled for all users in all roles
  scoring: scored
  profile:
  - Level 2
  description: Enable multifactor authentication for all users in the Microsoft 365 tenant. Users will be prompted to authenticate
    with a second factor upon logging in to Microsoft 365 services each day. The second factor is most commonly a text message
    to a registered mobile phone number where they type in an authorization code, or with a mobile application like Microsoft
    Authenticator.
  rationale: Multifactor authentication requires an individual to present a minimum of two separate forms of authentication
    before access is granted. Multifactor authentication provides additional assurance that the individual attempting to gain
    access is who they claim to be. With multifactor authentication, an attacker would need to compromise at least two different
    authentication mechanisms, increasing the difficulty of compromise and thus reducing the risk.
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'To verify the multifactor authentication configuration for all users, use the Microsoft

    365 Admin Center:

    1. Log in as a Global Administrator.

    2. Go to Users > Active Users.

    3. Click on More > Multifactor Authentication Setup.

    4. Using the View Option, select Sign-in allowed users.

    5. Confirm there are no users with an MFA Status set to Disabled.

    To verify the multifactor authentication configuration for all users, use the Office

    365 PowerShell MSOL:

    1. Connect to Microsoft 365 using Connect-MSOLService.

    2. Run the following PowerShell command:

    Get-MsolUser –All | Select-Object UserPrincipalName, @{N="MFA Status";

    e={$_.StrongAuthenticationRequirements.State}}

    14 | P a g e

    3. Ensure that MFA Status equals Enforced.'
  remediation: 'To enable multifactor authentication for all users, use the Microsoft 365 Admin

    Center:

    1. Log in as a Global Administrator.

    2. Go to Users > Active Users.

    3. Click on More > Multifactor Authentication Setup.

    4. Using the View Option, select Sign-in allowed users.

    5. Select all users with MFA Status set to Disabled.

    6. Click Enable.

    To enable multifactor authentication for all users, use the Office 365 PowerShell

    MSOL:

    1. Connect to Microsoft 365 using Connect-MSOLService.

    2. Run the following PowerShell command:

    $Auth = New-Object -TypeName

    Microsoft.Online.Administration.StrongAuthenticationRequirement -Property

    @{RelyingParty = "*"; State = "Enabled"}

    Get-MsolUser –All | ForEach-Object { Set-MsolUser -UserPrincipalName

    $_.UserPrincipalName -StrongAuthenticationRequirements $Auth }'
  checks:
  - type: manual_review
    info: 'To verify the multifactor authentication configuration for all users, use the Microsoft

      365 Admin Center:

      1. Log in as a Global Administrator.

      2. Go to Users > Active Users.

      3. Click on More > Multifactor Authentication Setup.

      4. Using the View Option, select Sign-in allowed users.

      5. Confirm there are no users with an MFA Status set to Disabled.

      To verify the multifactor authentication configuration for all users, use the Office

      365 PowerShell MSOL:

      1. Connect to Microsoft 365 using Connect-MSO'
    severity: medium
- id: '1.3'
  title: (L1) Ensure that between two and four global admins are designated
  scoring: scored
  profile:
  - Level 1
  description: More than one global administrator should be designated so a single admin can be monitored and to provide redundancy
    should a single admin leave an organization. Additionally, there should be no more than four global admins set for any
    tenant.
  rationale: If there is only one global tenant administrator, he or she can perform malicious activity without the possibility
    of being discovered by another admin. If there are numerous global tenant administrators, the more likely it is that one
    of their accounts will be successfully breached by an external attacker.
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'To verify the number of global tenant administrators, use the Microsoft 365 Admin

    Center:

    1. Select Users > Active Users.

    2. Set Views to Global Admins.

    3. Review the list of Global Admins to confirm there are from two to four such

    accounts.

    To verify the number of global tenant administrators, you can also use the Office 365

    PowerShell MSOL:

    1. Connect to Microsoft 365 using Connect-MSOLService

    2. Run the following PowerShell commands:

    $role = Get-MsolRole -RoleName "Company Administrator"

    Get-MsolRoleMember -RoleObjectId $role.objectid'
  remediation: 'To correct the number of global tenant administrators, use the Microsoft 365 Admin

    Center:

    16 | P a g e

    1. Select Users > Active Users.

    2. Set Views to Global Admins.

    3. To create a new Global Admin:

    1. Select Add Users.

    2. Enter User Information.

    3. Select Roles.

    4. Select Global Administrator.

    5. Click Add.

    4. To remove Global Admins:

    1. Select User.

    2. Select Edit under Roles.

    3. Select Customized administrator and chose appropriate role.

    4. Click Save.'
  checks:
  - type: manual_review
    info: 'To verify the number of global tenant administrators, use the Microsoft 365 Admin

      Center:

      1. Select Users > Active Users.

      2. Set Views to Global Admins.

      3. Review the list of Global Admins to confirm there are from two to four such

      accounts.

      To verify the number of global tenant administrators, you can also use the Office 365

      PowerShell MSOL:

      1. Connect to Microsoft 365 using Connect-MSOLService

      2. Run the following PowerShell commands:

      $role = Get-MsolRole -RoleName "Company Administrator"

      Get-'
    severity: medium
- id: '1.4'
  title: (L1) Ensure self-service password reset is enabled
  scoring: scored
  profile:
  - Level 1
  description: Enabling self-service password reset allows users to reset their own passwords in Azure AD. When your users
    sign in to Microsoft 365, they will be prompted to enter additional contact information that will help them reset their
    password in the future. Self-service password reset is free for cloud users with Microsoft 365 business, non-profit or
    education plans. It doesn't work with trial subscriptions. If you are using On-premise AD and syncing your users, it requires
    a paid subscription to Azure AD Premium.
  rationale: Users will no longer need to engage the helpdesk for password resets, and the password reset mechanism will automatically
    block common, easily guessable passwords.
  impact: ''
  references:
  - 1. https://support.office.com/en-us/article/let-users-reset-their-own-passwords-inoffice-365-5bc3f460-13cc-48c0-abd6-b80bae72d04a
  - 2. https://gallery.technet.microsoft.com/office/Enable-Self-Service-59846d88
  page_start: 18
  audit_raw: 'To verify self-service password reset is enabled, use the Microsoft 365 Admin Center:

    1. Choose Settings > Security & privacy.

    2. Choose the link to go to the Azure admin center.

    3. Choose Users and groups > Password reset.

    4. On the Properties page, check the selected option.'
  remediation: 'To enable self-service password reset, use the Microsoft 365 Admin Center:

    1. Choose Settings > Security & privacy.

    2. Choose the link to go to the Azure admin center.

    3. Choose Users and groups > Password reset.

    4. On the Properties page, choose All to enable it for everyone in your business, and

    then choose Save.'
  checks:
  - type: manual_review
    info: 'To verify self-service password reset is enabled, use the Microsoft 365 Admin Center:

      1. Choose Settings > Security & privacy.

      2. Choose the link to go to the Azure admin center.

      3. Choose Users and groups > Password reset.

      4. On the Properties page, check the selected option.'
    severity: medium
- id: '1.5'
  title: (L1) Ensure modern authentication for Exchange Online is enabled
  scoring: scored
  profile:
  - Level 1
  description: Modern authentication in Microsoft 365 enables authentication features like multifactor authentication (MFA)
    using smart cards, certificate-based authentication (CBA), and thirdparty SAML identity providers. When you enable modern
    authentication in Exchange Online, Outlook 2016 and Outlook 2013 use modern authentication to log in to Microsoft 365
    mailboxes. When you disable modern authentication in Exchange Online, Outlook 2016 and Outlook 2013 use basic authentication
    to log in to Microsoft 365 mailboxes. When users initially configure certain email clients, like Outlook 2013 and Outlook
    2016, they may be required to authenticate using enhanced authentication mechanisms, such as multifactor authentication.
    Other Outlook clients that are available in Microsoft 365 (for example, Outlook Mobile and Outlook for Mac 2016) always
    use modern authentication to log in to Microsoft 365 mailboxes.
  rationale: Strong authentication controls, such as the use of multifactor authentication, may be circumvented if basic authentication
    is used by Exchange Online email clients such as Outlook 2016 and Outlook 2013. Enabling modern authentication for Exchange
    Online ensures strong authentication mechanisms are used when establishing sessions between email clients and Exchange
    Online.
  impact: ''
  references:
  - 1. https://support.office.com/en-gb/article/enable-or-disable-modernauthentication-in-exchange-online-58018196-f918-49cd-8238-56f57f38d662
  page_start: 20
  audit_raw: 'To verify modern authentication is enabled, use the Exchange Online PowerShell

    Module:

    1. Run the Microsoft Exchange Online PowerShell Module.

    2. Connect to Exchange Online using Connect-EXOPSSession.

    3. Run the following PowerShell command:

    Get-OrganizationConfig | Format-Table -Auto Name, OAuth*

    4. Verify OAuth2ClientProfileEnabled is True.

    20 | P a g e'
  remediation: 'To enable modern authentication, use the Exchange Online PowerShell Module:

    1. Run the Microsoft Exchange Online PowerShell Module.

    2. Connect to Exchange Online using Connect-EXOPSSession.

    3. Run the following PowerShell command:

    Set-OrganizationConfig -OAuth2ClientProfileEnabled $True'
  checks:
  - type: manual_review
    info: 'To verify modern authentication is enabled, use the Exchange Online PowerShell

      Module:

      1. Run the Microsoft Exchange Online PowerShell Module.

      2. Connect to Exchange Online using Connect-EXOPSSession.

      3. Run the following PowerShell command:

      Get-OrganizationConfig | Format-Table -Auto Name, OAuth*

      4. Verify OAuth2ClientProfileEnabled is True.

      20 | P a g e'
    severity: medium
