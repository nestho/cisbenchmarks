    using smart cards, certificate-based authentication (CBA), and thirdparty SAML identity providers. When you enable modern
    authentication in Skype for Business, the Skype for Business client uses modern authentication to log in to Skype for
    Business Online.
  rationale: Strong authentication controls, such as the use of multifactor authentication, may be circumvented if basic authentication
    is used by Skype for Business Online clients. Enabling modern authentication for Skype for Business Online ensures strong
    authentication mechanisms are used when establishing sessions between clients and Skype for Business Online.
  impact: ''
  references:
  - 1. https://social.technet.microsoft.com/wiki/contents/articles/34339.skype-forbusiness-online-enable-your-tenant-for-modern-authentication.aspx
  page_start: 24
  audit_raw: 'To verify modern authentication is enabled, use the Skype for Business Online

    PowerShell Module:

    1. Connect to Skype for Business Online using the following Powershell commands:

    Import-Module SkypeOnlineConnector

    $sfbSession = New-CsOnlineSession

    Import-PSSession $sfbSession

    2. Run the following PowerShell command to verify that modern authentication is

    enabled:

    Get-CsOAuthConfiguration |fl ClientAdalAuthOverride

    3. Verify that ClientAdalAuthOverride is set to Allowed.

    24 | P a g e'
  remediation: 'To enable modern authentication, use the Skype for Business Online PowerShell

