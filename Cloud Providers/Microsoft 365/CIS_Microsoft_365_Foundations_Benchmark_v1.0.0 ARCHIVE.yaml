- id: '1.8'
  title: (L1) Ensure that Office 365 Passwords Are Not Set to Expire
  scoring: scored
  profile:
  - Level 1
  description: Review the password expiration policy, to ensure that user passwords in Office 365 are not set to expire.
  rationale: NIST has updated their recommendation to not arbitrarily require users to change their passwords after a specific
    amount of time, unless there is evidence that the password is compromised or the user forgot it.
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'To verify Office 365 Passwords Are Not Set to Expire, use the Microsoft 365 Admin

    Center:

    1. Go to Settings > Security & Privacy.

    2. Click Edit next to Password Policy.

    3. Ensure that Set user passwords to never expire is set to On.

    To verify Office 365 Passwords Are Not Set to Expire, use the Microsoft Online

    PowerShell Module:

    1. Connect to Microsoft Online service using Connect-MSOLService.

    2. Run the following Microsoft Online PowerShell command:

    Get-MsolPasswordPolicy -DomainName <DomainName> | ft ValidityPeriod

    26 | P a g e'
  remediation: 'To set Office 365 Passwords to Expire, use the Microsoft 365 Admin Center:

    1. Go to Settings>Security & Privacy.

    2. Click Edit next to Password Policy.

    3. Ensure that Set user passwords to never expire is set to On.

    To set Office 365 Passwords Are Not Set to Expire, use the Microsoft Online

    PowerShell Module:

    1. Connect to Microsoft Online service using Connect-MSOLService.

    2. Run the following Microsoft Online PowerShell command:

    Set-MsolPasswordPolicy -ValidityPeriod 2147483647 -DomainName <DomainName> -

    NotificationDays 30

    27 | P a g e

    2 Application Permissions'
  checks:
  - type: manual_review
    info: 'To verify Office 365 Passwords Are Not Set to Expire, use the Microsoft 365 Admin

      Center:

      1. Go to Settings > Security & Privacy.

      2. Click Edit next to Password Policy.

      3. Ensure that Set user passwords to never expire is set to On.

      To verify Office 365 Passwords Are Not Set to Expire, use the Microsoft Online

      PowerShell Module:

      1. Connect to Microsoft Online service using Connect-MSOLService.

      2. Run the following Microsoft Online PowerShell command:

      Get-MsolPasswordPolicy -DomainName <DomainNam'
    severity: medium
- id: '2.1'
  title: (L2) Ensure third party integrated applications are not allowed
  scoring: scored
  profile:
  - Level 2
  description: Do not allow third party integrated applications to connect to your services.
  rationale: You should not allow third party integrated applications to connect to your services unless there is a very clear
    value and you have robust security controls in place. While there are legitimate uses, attackers can grant access from
    breached accounts to third party applications to exfiltrate data from your tenancy without having to maintain the breached
    account.
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'To verify that third party integrated applications are not allowed, use the Microsoft

    365 Admin Center:

    1. Click Security and Compliance.

    2. Select Admin Centers and Azure Active Directory.

    3. Select Users Settings.

    4. Verify App Registrations is set to No.'
  remediation: 'To prohibit third party integrated applications, use the Microsoft 365 Admin Center:

    1. Click Security and Compliance.

    2. Select Admin Centers and Azure Active Directory.

    3. Select Users Settings.

    4. Set App Registrations to No.'
  checks:
  - type: manual_review
    info: 'To verify that third party integrated applications are not allowed, use the Microsoft

      365 Admin Center:

      1. Click Security and Compliance.

      2. Select Admin Centers and Azure Active Directory.

