    severity: medium
- id: '2.2'
  title: (L2) Ensure calendar details sharing with external users is disabled
  scoring: scored
  profile:
  - Level 2
  description: You should not allow your users to share the full details of their calendars with external users.
  rationale: Attackers often spend time learning about your organization before launching an attack. Publicly available calendars
    can help attackers understand organizational relationships and determine when specific users may be more vulnerable to
    an attack, such as when they are traveling.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'To verify calendar details sharing with external users is disabled, use the Microsoft

    365 Admin Center:

    1. Select Admin Center and Click Settings.

    2. Click Services and add-ins.

    3. Click Calendar.

    4. Verify Let your users share their calendars with external users who have

    O365 or Exchange is set to Off.

    To verify calendar details sharing with external users is disabled, use the Exchange

    Online PowerShell Module:

    1. Connect to Exchange Online using Connect-EXOPSSession.

    2. Run the following Exchange Online PowerShell command:

    Get-SharingPolicy | Where-Object { $_.Domains -like ''*CalendarSharing*'' }

    3. Verify Enabled is set to False

    30 | P a g e'
  remediation: 'To disable calendar details sharing with external users, use the Microsoft 365 Admin

    Center:

    1. Select Admin Center and Click Settings.

    2. Click Services and add-ins.

    3. Click Calendar.

    4. Set Let your users share their calendars with external users who have

    O365 or Exchange to Off.

    5. Click Save.

    To disabled calendar details sharing with external users policy, use the Exchange

    Online PowerShell Module:

    1. Connect to Exchange Online using Connect-EXOPSSession.

    2. Run the following Exchange Online PowerShell command:

    Set-SharingPolicy -Identity "Name of the policy" -Enabled $False'
