- id: '2.6'
  title: (L2) Ensure user consent to apps accessing company data on their behalf is not allowed
  scoring: scored
  profile:
  - E3 Level 2
  description: By default, users can consent to applications accessing your organization's data, although only for some permissions.
    For example, by default a user can consent to allow an app to access their own mailbox or the Teams conversations for
    a team the user owns, but cannot consent to allow an app unattended access to read and write to all SharePoint sites in
    your organization. Do not allow users to grant consent to apps accessing company data on their behalf.
  rationale: Attackers commonly use custom applications to trick users into granting them access to company data. While allowing
    users to consent by themselves does allow users to easily acquire useful applications that integrate with Microsoft 365,
    Azure and other services, it can represent a risk if not used and monitored carefully. Disable future user consent operations
    to help reduce your threat-surface and mitigate this risk. If user consent is disabled, previous consent grants will still
    be honored but all future consent operations must be performed by an administrator.
  impact: If user consent is disabled, previous consent grants will still be honored but all future consent operations must
    be performed by an administrator. Tenant-wide admin consent can be requested by users through an integrated administrator
