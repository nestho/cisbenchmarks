  title: (L2) Ensure basic authentication for Exchange Online is disabled
  scoring: scored
  profile:
  - E3 Level 2
  description: Basic authentication may allow users to access Exchange Online using legacy or unapproved email clients that
    do not support modern authentication mechanisms, such as multifactor authentication.
  rationale: Disabling basic authentication prevents use of legacy and unapproved email clients with weaker authentication
    mechanisms that would increase the risk of email account credential compromise.
  impact: 'Blocking basic authentication will block the following legacy Exchange Online features: • App passwords: An app
    password is a code that gives an app or device permission to access your Microsoft 365 account. If multi-factor authentication
    is enabled for your organization and you''re using apps that connect to your Microsoft 365 account, you''ll need to generate
    an app password so the app can connect to Microsoft 365. For example, if you''re using Outlook 2016 or earlier with Microsoft
    365, an app password is required. • Availability address spaces: These contain a service account that''s used to share
    calendar free/busy information in hybrid and federated deployments. The service account authenticates with a username
    and password, so blocking Basic authentication blocks the authentication flow. Blocking basic authentication may also
    be accomplished via other methods such as conditional access. 131 | P a g e'
