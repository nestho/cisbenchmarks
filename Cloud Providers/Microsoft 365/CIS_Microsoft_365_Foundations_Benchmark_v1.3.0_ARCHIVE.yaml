- id: 1.1.9
  title: (L2) Enable Azure AD Identity Protection sign-in risk policies
  scoring: manual
  profile:
  - E5 Level 2
  description: Azure Active Directory Identity Protection sign-in risk detects risks in real-time and offline. A risky sign-in
    is an indicator for a sign-in attempt that might not have been performed by the legitimate owner of a user account.
  rationale: Turning on the sign-in risk policy ensures that suspicious sign-ins are challenged for multifactor authentication.
  impact: When the policy triggers, the user will need MFA to access the account. In the case of a user who hasn't registered
    MFA on their account, they would be blocked from accessing their account. It is therefore recommended that the MFA registration
    policy be configured for all users who are a part of the Sign-in Risk policy.
  references: []
  page_start: 34
  audit_raw: 'To verify if a Sign-In risk policy is enabled, use the following steps:

    1. Sign-on to your Azure portal as global administrator by going to

    https://portal.azure.com

    2. In the Azure portal, click Services and search for and click on Azure AD Identity

    Protection.

    3. Under Configure click on Sign-in risk policy.

    4. Review the settings and ensure that Enforce Policy is set to On

    This information is also available via the Microsoft Graph Security API:

    GET https://graph.microsoft.com/beta/security/secureScores

    34 | P a g e'
  remediation: 'To configure a Sign-In risk policy, use the following steps:

    1. Sign-on to your Azure portal as global administrator by going to

    https://portal.azure.com

    2. In the Azure portal, click Services and search for and click on Azure AD Identity

    Protection.

    3. Under Configure click on Sign-in risk policy.

    4. Under Assignments ensure that policy is applied to All users or the scope of users

    appropriate

    5. Under Assignments choose Conditions and the appropriate Sign-in risk level

    6. Under Controls, select Access and choose Allow access and Require multifactor authentication

    7. Ensure that Enforce Policy is set to On'
  checks:
  - type: manual_review
    info: 'To verify if a Sign-In risk policy is enabled, use the following steps:

