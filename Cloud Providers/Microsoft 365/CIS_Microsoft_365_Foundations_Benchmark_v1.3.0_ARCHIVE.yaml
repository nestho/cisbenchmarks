- id: 1.1.3
  title: (L1) Ensure that between two and four global admins are designated
  scoring: scored
  profile:
  - E3 Level 1
  description: More than one global administrator should be designated so a single admin can be monitored and to provide redundancy
    should a single admin leave an organization. Additionally, there should be no more than four global admins set for any
    tenant. Ideally global administrators will have no licenses assigned to them.
  rationale: If there is only one global tenant administrator, he or she can perform malicious activity without the possibility
    of being discovered by another admin. If there are numerous global tenant administrators, the more likely it is that one
    of their accounts will be successfully breached by an external attacker.
  impact: The potential impact associated with ensuring compliance with this requirement is dependent upon the current number
    of global administrators configured in the tenant. If there is only one global administrator in a tenant, an additional
    global administrator will need to be identified and configured. If there are more than four global administrators, a review
    of role requirements for current global administrators will be required to identify which of the users require global
    administrator access. 21 | P a g e
  references:
  - 1. https://docs.microsoft.com/en-us/office365/enterprise/powershell/assign-rolesto-user-accounts-with-office-365-powershell
  page_start: 21
  audit_raw: 'To verify the number of global tenant administrators, use the Microsoft 365 Admin

    Center:

    1. Log in to https://admin.microsoft.com as a Global Administrator.

    2. Select Users > Active Users.

    3. Select Filter then select Global Admins.

    4. Review the list of Global Admins to confirm there are from two to four such

    accounts.

    To verify the number of global tenant administrators, you can also use the Office 365

    PowerShell MSOL:

    1. Connect to Microsoft 365 using Connect-MSOLService

    2. Run the following PowerShell commands:

    $role = Get-MsolRole -RoleName "Company Administrator"

    Get-MsolRoleMember -RoleObjectId $role.objectid

    This information is also available via the Microsoft Graph Security API:

    GET https://graph.microsoft.com/beta/security/secureScores'
  remediation: 'To correct the number of global tenant administrators, use the Microsoft 365 Admin

    Center:

    1. Log in to https://admin.microsoft.com as a Global Administrator.

    2. Select Users > Active Users.

    3. In the Searchfield enter the name of the user to be made a Global Administrator.

    4. To create a new Global Admin:

    1. Select the user''s name.

    2. A window will appear to the right.

    3. Select Manage roles.

    4. Select Admin center access.

    5. Check Global Administrator.

    6. Click Save changes.

    5. To remove Global Admins:

    1. Select User.

    2. Under Roles select Manage roles

    3. De-Select the appropriate role.

    4. Click Save changes.

    22 | P a g e

    To correct the number of global tenant administrators, you can also use the Office

    365 PowerShell MSOL:

    1. Connect to Microsoft 365 using Connect-MSOLService

    2. Store the variables with the following Powershell

    $dispName="<The Display Name of the account>"

    $roleName="<The role name you want to assign to the account>"

    3. Run the following PowerShell command:

    Add-MsolRoleMember -RoleMemberEmailAddress (Get-MsolUser -All | Where

    DisplayName -eq $dispName).UserPrincipalName -RoleName $roleName'
  checks:
  - type: manual_review
    info: 'To verify the number of global tenant administrators, use the Microsoft 365 Admin

      Center:

      1. Log in to https://admin.microsoft.com as a Global Administrator.

      2. Select Users > Active Users.

      3. Select Filter then select Global Admins.

      4. Review the list of Global Admins to confirm there are from two to four such

      accounts.

      To verify the number of global tenant administrators, you can also use the Office 365

      PowerShell MSOL:

      1. Connect to Microsoft 365 using Connect-MSOLService

      2. Run the following'
    severity: medium
- id: 1.1.4
  title: (L1) Ensure self-service password reset is enabled
  scoring: scored
  profile:
  - E3 Level 1
  description: Enabling self-service password reset allows users to reset their own passwords in Azure AD. When your users
    sign in to Microsoft 365, they will be prompted to enter additional contact information that will help them reset their
    password in the future.
  rationale: Users will no longer need to engage the helpdesk for password resets, and the password reset mechanism will automatically
    block common, easily guessable passwords.
  impact: The impact associated with this setting is that users will be required to provide additional contact information
    to enroll in self-service password reset. Additionally, minor user education may be required for users that are used to
    calling a help desk for assistance with password resets.
  references:
  - 1. https://support.office.com/en-us/article/let-users-reset-their-own-passwords-inoffice-365-5bc3f460-13cc-48c0-abd6-b80bae72d04a
  - 2. https://gallery.technet.microsoft.com/office/Enable-Self-Service-59846d88
  page_start: 24
  audit_raw: 'To verify self-service password reset is enabled, use the Microsoft 365 Admin Center:

    1. Under Admin centers choose Azure Active Directory.

    2. Choose Users from the left hand navigation.

    3. Choose Password reset.

    4. On the Properties page, ensure that All is selected under Self service password

    reset enabled.

    This information is also available via the Microsoft Graph Security API:

    GET https://graph.microsoft.com/beta/security/secureScores

    24 | P a g e'
  remediation: 'To enable self-service password reset, use the Microsoft 365 Admin Center:

    1. Under Admin centers choose Azure Active Directory.

    2. Choose Users from the left hand navigation.

    3. Choose Password reset.

    4. On the Properties page, select All under Self service password reset enabled.

    5. Select Save.'
  checks:
  - type: manual_review
    info: 'To verify self-service password reset is enabled, use the Microsoft 365 Admin Center:

      1. Under Admin centers choose Azure Active Directory.

      2. Choose Users from the left hand navigation.

      3. Choose Password reset.

      4. On the Properties page, ensure that All is selected under Self service password

      reset enabled.

      This information is also available via the Microsoft Graph Security API:

      GET https://graph.microsoft.com/beta/security/secureScores

      24 | P a g e'
    severity: medium
- id: 1.1.5
  title: (L1) Ensure that password protection is enabled for Active Directory
  scoring: manual
  profile:
  - E3 Level 1
  description: Enable Azure Active Directory Password Protection to Active Directory to protect against the use of common
    passwords.
  rationale: Azure Active Directory protects an organization by prohibiting the use of weak or leaked passwords. In addition,
    organizations can create custom banned password lists to prevent their users from using easily guessed passwords that
    are specific to their industry. Deploying this feature to Active Directory will strengthen the passwords that are used
    in the environment.
  impact: The potential impact associated with implementation of this setting is dependent upon the existing password policies
    in place in the environment. For environments that have strong password policies in place, the impact will be minimal.
    For organizations that do not have strong password policies in place, implementation of Azure Active Directory Password
    Protection may require users to change passwords, and adhere to more stringent requirements than they have been accustomed
    to.
  references: []
  page_start: 26
  audit_raw: 'To verify that Azure Active Directory Password Protection is enabled, use the

    Microsoft 365 Admin Center:

    1. Log in to https://admin.microsoft.com as a Global Administrator.

    2. Go to Admin centers and click on Azure Active Directory.

    3. Select Azure Active Directory then Security on the left side navigation followed

    by Authentication methods.

    4. Select Password protection and ensure that Enable password protection on

    Windows Server Active Directory is set to Yes and also that Mode is set to

    Enforced

    5. Verify that the Domain Controller Agent and Proxy''s are deployed to the Domain

    Controllers in the environment

    26 | P a g e'
  remediation: 'To setup Azure Active Directory Password Protection, use the following steps:

    1. Download and install the Azure AD Password Proxies and DC Agents from the

    following location: https://www.microsoft.com/download/details.aspx?id=57071

    2. After the installation is complete, login to https://admin.microsoft.com as a

    Global Administrator.

    3. Go to Admin centers and click on Azure Active Directory.

    4. Select Azure Active Directory then Security on the left side navigation followed

    by Authentication methods.

    5. Select Password protection and toggle Enable password protection on Windows

    Server Active Directory to Yes and Mode to Enforced

    6. Click Save at the top of the right pane.'
  checks:
  - type: manual_review
    info: 'To verify that Azure Active Directory Password Protection is enabled, use the

      Microsoft 365 Admin Center:

      1. Log in to https://admin.microsoft.com as a Global Administrator.

      2. Go to Admin centers and click on Azure Active Directory.

      3. Select Azure Active Directory then Security on the left side navigation followed

      by Authentication methods.

      4. Select Password protection and ensure that Enable password protection on

      Windows Server Active Directory is set to Yes and also that Mode is set to

      Enfo'
    severity: medium
- id: 1.1.6
  title: (L1) Enable Conditional Access policies to block legacy authentication
  scoring: scored
  profile:
  - E3 Level 1
  description: Use Conditional Access to block legacy authentication protocols in Office 365.
  rationale: Legacy authentication protocols do not support multi-factor authentication. These protocols are often used by
    attackers because of this deficiency. Blocking legacy authentication makes it harder for attackers to gain access.
  impact: Enabling this setting will prevent users from connecting with older versions of Office, ActiveSync or using protocols
    like IMAP, POP or SMTP and may require upgrades to older versions of Office, and use of mobile mail clients that support
    modern authentication.
  references: []
  page_start: 28
  audit_raw: 'To verify that legacy authentication is blocked, use the Microsoft 365 Admin Center:

    1. Log in to https://admin.microsoft.com as a Global Administrator.

    2. Go to Admin centers and click on Azure Active Directory.

    3. Select Azure Active Directory then Security.

    4. Select Conditional Access.

    5. Verify that either the policy Baseline policy: Block legacy authentication is

    set to On or find another with the following settings enabled:

    o Under Conditions then Client apps ensure the settings are enabled for and

    Exchange ActiveSync clients and other clients.

    o Under Access controls ensure the Grant is set to Block access

    o Under Assignments ensure All users is enabled

    o Under Assignments and Users and groups ensure the Exclude is set to least

    one low risk account or directory role. This is required as a best practice.

    This information is also available via the Microsoft Graph Security API:

    GET https://graph.microsoft.com/beta/security/secureScores

    28 | P a g e'
  remediation: 'To setup a conditional access policy to block legacy authentication, use the following

    steps:

    1. Log in to https://admin.microsoft.com as a Global Administrator.

    2. Go to Admin centers and click on Azure Active Directory.

    3. Select Azure Active Directory then Security.

    4. Select Conditional Access.

    5. Create a new policy by selecting New policy.

    6. Set the following conditions within the policy.

    o Select Conditions then Client apps enable the settings for and Exchange

    ActiveSync clients and other clients.

    o Under Access controls set the Grant section to Block access

    o Under Assignments enable All users

    o Under Assignments and Users and groups set the Exclude to be at least one

    low risk account or directory role. This is required as a best practice.'
  checks:
  - type: manual_review
    info: 'To verify that legacy authentication is blocked, use the Microsoft 365 Admin Center:

      1. Log in to https://admin.microsoft.com as a Global Administrator.

      2. Go to Admin centers and click on Azure Active Directory.

      3. Select Azure Active Directory then Security.

      4. Select Conditional Access.

      5. Verify that either the policy Baseline policy: Block legacy authentication is

      set to On or find another with the following settings enabled:

      o Under Conditions then Client apps ensure the settings are enabl'
    severity: medium
- id: 1.1.7
  title: (L1) Ensure that password hash sync is enabled for resiliency and leaked credential detection
  scoring: manual
  profile:
  - E3 Level 1
  description: Ensure that password hash sync is enabled for resiliency and leaked credential detection.
  rationale: Password hash synchronization is one of the sign-in methods used to accomplish hybrid identity. Azure AD Connect
    synchronizes a hash, of the hash, of a user's password from an on-premises Active Directory instance to a cloud-based
    Azure AD instance. Password hash synchronization helps by reducing the number of passwords your users need to maintain
    to just one. Enabling password hash synchronization also allows for leaked credential reporting. It can also be used as
    a backup authentication method when federation is used, if the federation provider fails.
  impact: Enabling password hash sync should not impact end users.
  references: []
  page_start: 30
  audit_raw: 'To verify if Password Hash Sync is enabled, use the Azure AD Connect tool:

    1. Log in to the server that hosts the Azure AD Connect tool

    2. Run Azure AD Connect, and then click View current configuration. In the details

    pane, check whether Password synchronization is enabled on your tenant.

    This information is also available via the Microsoft Graph Security API:

    GET https://graph.microsoft.com/beta/security/secureScores

    30 | P a g e'
  remediation: 'To setup Password Hash Sync, use the following steps:

    1. Log in to the server that hosts the Azure AD Connect tool

    2. Double-click the Azure AD Connect icon that was created on the desktop

    3. Click Configure.

    4. On the Additional tasks page, select Customize synchronization options and

    click Next.

    5. Enter the username and password for your global administrator.

    6. On the Connect your directories screen, click Next.

    7. On the Domain and OU filtering screen, click Next.

    8. On the Optional features screen, check Password hash synchronization and

    click Next.

    9. On the Ready to configure screen click Configure.

    10. Once the configuration completes, click Exit.'
  checks:
  - type: manual_review
    info: 'To verify if Password Hash Sync is enabled, use the Azure AD Connect tool:

      1. Log in to the server that hosts the Azure AD Connect tool

      2. Run Azure AD Connect, and then click View current configuration. In the details

      pane, check whether Password synchronization is enabled on your tenant.

      This information is also available via the Microsoft Graph Security API:

      GET https://graph.microsoft.com/beta/security/secureScores

      30 | P a g e'
    severity: medium
- id: 1.1.8
  title: (L1) Enable Identity Protection to identify anomalous logon behavior
  scoring: manual
  profile:
  - E5 Level 1
  description: Azure Active Directory Identity Protection monitors account behaviors and enables organizations to configure
    automated responses to detected suspicious actions related to user identities.
  rationale: Azure Active Directory Identity Protection helps to discover at risk or compromised accounts in your environment.
    Identity based attacks continue to be a top source for breaches. Enabling Identity Protection not only helps to monitor
    and provide reporting, but also helps to automatically respond to identity based risks.
  impact: The impacts associated with implementation of this setting are highly dependent upon the specific response actions
    configured in Identity Protection.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/identityprotection/concept-identity-protection-risks
  page_start: 32
  audit_raw: 'To verify if Azure Active Directory Identity Protection is enabled, use the following

    steps:

    1. Sign-on to your Azure portal as global administrator by going to

    https://portal.azure.com

    2. In the search enter Azure AD Identity Protection, then click on the result.

    3. Select the User risk policy followed by the Sign-in risk policy and ensure they

    are enabled.

    4. At the bottom of the page will be a toggle for Enforce policy, this should be set to

    On.

    32 | P a g e'
  remediation: 'To setup Azure Active Directory Identity Protection, use the following steps:

    1. Sign-on to your Azure portal as global administrator by going to

    https://portal.azure.com

    2. In the search enter Azure AD Identity Protection, then click on the result.

    3. Select the User risk policy followed by the Sign-in risk policy and enable

    each.

    4. At the bottom of the page will be a toggle for Enforce policy, also set this to On.'
  checks:
  - type: manual_review
    info: 'To verify if Azure Active Directory Identity Protection is enabled, use the following

      steps:

      1. Sign-on to your Azure portal as global administrator by going to

      https://portal.azure.com

      2. In the search enter Azure AD Identity Protection, then click on the result.

