  description: You should configure your mobile device management policies to require the policy to manage the email profile
    of the user.
  rationale: If you do not require this, users will be able to setup and configure email accounts without the protections
    of the mobile device management policy, leading to potential breaches of accounts and data.
  impact: This setting will have a moderate impact on users
