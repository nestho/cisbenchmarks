- id: '1.5'
  title: (L1) Ensure that Office 365 Passwords Are Not Set to Expire
  scoring: scored
  profile:
  - E3 Level 1
  description: Review the password expiration policy, to ensure that user passwords in Office 365 are not set to expire.
  rationale: NIST has updated their password policy recommendations to not arbitrarily require users to change their passwords
    after a specific amount of time, unless there is evidence that the password is compromised or the user forgot it. They
    suggest this even for single factor (Password Only) use cases, with a reasoning that forcing arbitrary password changes
    on users actually make the passwords less secure. Other recommendations within this Benchmark suggest the use of MFA authentication
    for at least critical accounts (at minimum), which makes password expiration even less useful as well as password protection
    for Azure AD.
  impact: The primary impact associated with this change is ensuring that users understand the process for making or requesting
    a password change when required.
  references:
  - 1. https://pages.nist.gov/800-63-3/sp800-63b.html
  page_start: 61
