    severity: medium
- id: '7.11'
  title: (L1) Ensure that devices connecting have AV and a local firewall enabled
  scoring: manual
  profile:
  - E3 Level 1
  description: You should configure your mobile device management policies to require the PC to have anti-virus and have a
    firewall enabled.
  rationale: If you do not require this, users will be able to connect from devices that are vulnerable to basic internet
    attacks, leading to potential breaches of accounts and data.
  impact: Impact should be minimal however, in the event that a device is not running appropriate protection it will be blocked
    from connecting.
  references: []
  page_start: 210
  audit_raw: 'To verify mobile device management policies, use the Microsoft 365 Admin Center:

    1. Under Admin Centers select Endpoint Management.

    2. Select Devices and then select Compliance policies

    3. Review the list of policies. Ensure that a policy exists for each Platform.

    4. Review the Properties section of each policy. Under Settings and System

    Security verify the value for Firewall, Antivirus, and Antispyware are all set to

    Require.

    210 | P a g e'
  remediation: 'To set mobile device management policies, use the Microsoft 365 Admin Center:

    1. Under Admin Centers select Endpoint Management.

    2. Select Devices and then select Compliance policies

    3. Select Create Policy

    4. Set a Name for the policy, choose the appropriate PC Platform

    5. Select System Security under Settings.

    6. Under Device Security set the values for Firewall, Antivirus, and Antispyware

    all to Require.'
