  rationale: You should not allow third party integrated applications to connect to your services unless there is a very clear
    value and you have robust security controls in place. While there are legitimate uses, attackers can grant access from
    breached accounts to third party applications to exfiltrate data from your tenancy without having to maintain the breached
    account.
