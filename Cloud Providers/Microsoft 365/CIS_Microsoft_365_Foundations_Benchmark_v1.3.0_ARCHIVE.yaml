  description: When temporary groups are created (e.g. a subcontractors group created for a given mission), expiration settings
    should be configured.
  rationale: If Microsoft 365 temporary groups are not automatically deleted and are not well managed, they may not be manually
    deleted. Thus, data associated to the group (e.g. SharePoint) would be out of surveillance, and would lead to a poor governance.
  impact: If this recommendation is applied, group owners (or group contact if no owners) will receive periodic email to be
    informed of the incoming group self-deletion. In addition, the group deletion also delete all associated resource. Thus,
