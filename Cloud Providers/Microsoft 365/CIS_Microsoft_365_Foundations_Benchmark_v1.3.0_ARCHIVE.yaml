- id: 1.1.11
  title: (L2) Use Just In Time privileged access to Office 365 roles
  scoring: manual
  profile:
  - E5 Level 2
  description: Azure Active Directory Privileged Identity Management can be used to audit roles, allow just in time activation
    of roles and allow for periodic role attestation. Organizations should remove permanent members from privileged Office
    365 roles and instead make them eligible, through a JIT activation workflow.
  rationale: Organizations want to minimize the number of people who have access to secure information or resources, because
    that reduces the chance of a malicious actor getting that access, or an authorized user inadvertently impacting a sensitive
    resource. However, users still need to carry out privileged operations in Azure AD and Office 365. Organizations can give
    users just-in-time (JIT) privileged access to roles. There is a need for oversight for what those users are doing with
    their administrator privileges. PIM helps to mitigate the risk of excessive, unnecessary, or misused access rights.
  impact: Implementation of Just in Time privileged access is likely to necessitate changes to administrator routine. Administrators
    will only be granted access to administrative roles when required. When administrators request role activation, they will
    need to document the reason for requiring role access, anticipated time required to have the access, and to reauthenticate
    to enable role access. 38 | P a g e
