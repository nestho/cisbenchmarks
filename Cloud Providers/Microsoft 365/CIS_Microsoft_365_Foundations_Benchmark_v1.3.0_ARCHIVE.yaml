- id: 1.1.12
  title: (L1) Ensure Security Defaults is disabled on Azure Active Directory
  scoring: manual
  profile:
  - E3 Level 1
  description: Security defaults in Azure Active Directory (Azure AD) make it easier to be secure and help protect your organization.
    Security defaults contain preconfigured security settings for common attacks. Microsoft is making security defaults available
    to everyone. The goal is to ensure that all organizations have a basic level of security-enabled at no extra cost. You
    turn on security defaults in the Azure portal. The use of Security Defaults however will prohibit custom settings which
    are being set with more advanced settings from this benchmark
  rationale: 'Security defaults provide secure default settings that we manage on behalf of organizations to keep customers
    safe until they are ready to manage their own identity security settings. For example doing the following: • Requiring
    all users and admins to register for MFA. • Challenging users with MFA - mostly when they show up on a new device or app,
    but more often for critical roles and tasks. • Disabling authentication from legacy authentication clients, which can’t
    do MFA.'
  impact: The potential impact associated with disabling of Security Defaults is dependent upon the security controls implemented
    in the environment. It is likely that most organizations disabling Security Defaults plan to implement equivalent controls
    to replace Security Defaults. It may be necessary to check settings in other Microsoft products, such as Azure, to ensure
    settings and functionality are as expected when disabling security defaults for MS365. 42 | P a g e
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/fundamentals/conceptfundamentals-security-defaults
  - 2. https://techcommunity.microsoft.com/t5/azure-active-directoryidentity/introducing-security-defaults/ba-p/1061414
  page_start: 42
  audit_raw: 'To ensure security defaults is disabled in your directory:

    1. Sign in to the Azure portal as a security administrator, Conditional Access

    administrator, or global administrator.

    2. Browse to Azure Active Directory > Properties.

    3. Select Manage security defaults.

    4. Verify the Enable security defaults toggle to No.'
  remediation: 'To disable security defaults in your directory:

    1. Sign in to the Azure portal as a security administrator, Conditional Access

    administrator, or global administrator.

    2. Browse to Azure Active Directory > Properties.

    3. Select Manage security defaults.

    4. Set the Enable security defaults toggle to No.

    5. Select Save.'
  checks:
