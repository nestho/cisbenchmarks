  profile:
  - E3 Level 1
  description: You should require your users to use a complex password to unlock their mobile devices.
  rationale: Devices without this protection are vulnerable to being accessed physically by attackers who can then steal account
    credentials, data, or install malware on the device.
  impact: This has a moderate impact on users
  references: []
  page_start: 208
  audit_raw: 'To verify mobile device management profiles, use the Microsoft 365 Admin Center:

    1. Under Admin Centers select Endpoint Management.

    2. Select Devices and then select Configuration profiles

    3. Review the list of profiles. Ensure that a profile exists for each Platform.

    4. Review the Password section under Device restrictions and verify Simple

    Passwords is set to Blocked.'
  remediation: 'To set mobile device management profiles, use the Microsoft 365 Admin Center:

    1. Under Admin Centers select Endpoint Management.

    2. Select Devices and then select Configuration profiles

    3. Select Create profile

    4. Set a Name for the policy, choose the appropriate Platform and select Device

    restrictions

    5. In the Password section, ensure that Simple Passwords is set to Blocked.

    208 | P a g e'
  checks:
