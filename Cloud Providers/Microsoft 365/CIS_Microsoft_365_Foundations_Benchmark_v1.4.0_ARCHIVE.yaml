- id: '3.1'
  title: (L2) Ensure the customer lockbox feature is enabled
  scoring: scored
  profile:
  - E5 Level 2
  description: You should enable the Customer Lockbox feature. It requires Microsoft to get your approval for any datacenter
    operation that grants a Microsoft support engineer or other employee direct access to any of your data. For example, in
    some cases a Microsoft support engineer might need access to your Microsoft 365 content in order to help troubleshoot
    and fix an issue for you. Customer lockbox requests also have an expiration time, and content access is removed after
    the support engineer has fixed the issue.
  rationale: Enabling this feature protects your data against data spillage and exfiltration.
  impact: The impact associated with this setting is a requirement to grant Microsoft access to the tenant environment prior
    to a Microsoft engineer accessing the environment for support or troubleshooting. 100 | P a g e
  references: []
  page_start: 100
  audit_raw: 'To verify the Customer Lockbox feature is enabled, use the Microsoft 365 Admin

    Portal:

    1. Browse to the Microsoft 365 admin center.

    2. Expand Settings then select Org settings

    3. Choose Security & privacy in the right pane.

    4. Click Customer lockbox.

    5. Ensure the box labeled Require approval for all data access requests is

    checked.

    To verify the Customer Lockbox feature is enabled, use the Microsoft 365

    SecureScore Portal:

    1. Log in to the Microsoft 365 SecureScore portal (https://securescore.microsoft.com)

    using admin permissions (global admin or a custom admin role) for an Office 365

    Enterprise, Microsoft 365 Business, or Office 365 Business Premium subscription.

    2. Search for Turn on customer lockbox feature under Improvement actions

    To verify the Customer Lockbox feature is enabled, use the REST API:

    GET https://graph.microsoft.com/beta/security/secureScores

    To verify the Customer Lockbox feature is enabled, use the Exchange Online

    PowerShell Module:

    1. Run Exchange Online PowerShell Module.

    2. Connect using Connect-ExchangeOnline.

    3. Run the following PowerShell command:

    Get-OrganizationConfig |Select-Object CustomerLockBoxEnabled

    4. Verify the value is set to True

    101 | P a g e'
  remediation: 'To enable the Customer Lockbox feature, use the Microsoft 365 Admin Portal:

    1. Browse to the Microsoft 365 admin center.

    2. Expand Settings then select Org settings

    3. Choose Security & privacy in the right pane.

    4. Click Customer Lockbox.

    5. Check the box Require approval for all data access requests.

    6. Click Save.

    To set the Customer Lockbox feature to enabled, use the Exchange Online PowerShell

    Module:

    1. Run Exchange Online PowerShell Module.

    2. Connect using Connect-ExchangeOnline.

    3. Run the following PowerShell command:

    Set-OrganizationConfig -CustomerLockBoxEnabled $true'
