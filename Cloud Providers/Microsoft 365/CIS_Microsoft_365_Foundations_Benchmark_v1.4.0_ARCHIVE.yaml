- id: 1.1.14
  title: (L2) Ensure that LinkedIn contact synchronization is disabled.
  scoring: scored
  profile:
  - E3 Level 2
  description: You should disable integration with LinkedIn as a measure to help prevent phishing scams.
  rationale: Office 365 is the prime target of phishing scams. Phishing attacks are a subset of social engineering strategy
    that imitate a trusted source and concoct a seemingly logical scenario for handing over sensitive information. Social
    networking sites have made social engineering attacks easier to conduct. LinkedIn integration is enabled by default in
    Office 365 that could lead to a risk scenario where an external party could be accidentally disclosed sensitive information.
  impact: Users will not be able to sync contacts or use LinkedInintegration.
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/enterpriseusers/linkedin-integration
  page_start: 50
