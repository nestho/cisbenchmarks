  rationale: Safe Links extends phishing protection to include redirecting all email hyperlinks through a forwarding service
    which will block malicious ones even after the email has been delivered to the end user.
  impact: When enabling and configuring Safe Links impact to the end-user should be low. Users should be informed of the change
