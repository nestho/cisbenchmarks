    o Note: If organizational policy allows select any allowed external domains.

    4. Under Teams accounts not managed by an organization ensure the slider is set

    to Off.

    5. Under Skype users ensure the slider is set to Off.'
  remediation: 'To prohibit user communication with external Teams organizations, use the

    Microsoft 365 Admin Center:

    1. Select Admin Centers and Teams.

    2. Under Users select External access

    3. Under Teams and Skype for Business users in external organizations Select

    Block all external domains

    o Note: If organizational policy allows select any allowed external domains.

