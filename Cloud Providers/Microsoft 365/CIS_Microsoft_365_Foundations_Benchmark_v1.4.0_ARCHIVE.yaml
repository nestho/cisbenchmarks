    SharePoint admin, and User admin.

    • Targeting any role with the word admin will ensure that any users with additional

    privileges will be targeted.

    7. Go to Cloud apps or actions > Cloud apps > Include > select All cloud apps

    (and don''t exclude any apps).

    8. Under Access controls > Grant > select Grant access > check Require multifactor authentication (and nothing else).

    9. Under Session check Sign-in frequency and enter the value determined by your

    organization.

    10. Check Persistent browser session then select Never persistent in the dropdown menu.

    11. Create.

    NOTE: After creation ensure that the policy is set to enabled.

    53 | P a g e'
  checks:
