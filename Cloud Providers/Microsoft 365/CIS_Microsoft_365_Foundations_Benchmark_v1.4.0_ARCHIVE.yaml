- id: 1.1.11
  title: (L1) Ensure Security Defaults is disabled on Azure Active Directory
  scoring: manual
  profile:
  - E3 Level 1
  description: Security defaults in Azure Active Directory (Azure AD) make it easier to be secure and help protect your organization.
    Security defaults contain preconfigured security settings for common attacks. Microsoft is making security defaults available
    to everyone. The goal is to ensure that all organizations have a basic level of security-enabled at no extra cost. You
    turn on security defaults in the Azure portal. The use of security defaults however will prohibit custom settings which
    are being set with more advanced settings from this benchmark.
  rationale: 'Security defaults provide secure default settings that we manage on behalf of organizations to keep customers
    safe until they are ready to manage their own identity security settings. For example doing the following: • Requiring
    all users and admins to register for MFA. • Challenging users with MFA - mostly when they show up on a new device or app,
    but more often for critical roles and tasks. • Disabling authentication from legacy authentication clients, which can’t
    do MFA.'
  impact: The potential impact associated with disabling of Security Defaults is dependent upon the security controls implemented
    in the environment. It is likely that most organizations disabling Security Defaults plan to implement equivalent controls
    to replace Security Defaults. It may be necessary to check settings in other Microsoft products, such as Azure, to ensure
    settings and functionality are as expected when disabling security defaults for MS365. 43 | P a g e
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/fundamentals/conceptfundamentals-security-defaults
  - 2. https://techcommunity.microsoft.com/t5/azure-active-directoryidentity/introducing-security-defaults/ba-p/1061414
  page_start: 43
  audit_raw: 'To ensure security defaults is disabled in your directory:

    1. Sign in to the Azure portal as a security administrator, Conditional Access

    administrator, or global administrator.

    2. Browse to Azure Active Directory > Properties.

    3. Select Manage security defaults.

    4. Verify the Enable security defaults toggle to No.'
  remediation: 'To disable security defaults in your directory:

    1. Sign in to the Azure portal as a security administrator, Conditional Access

    administrator, or global administrator.

    2. Browse to Azure Active Directory > Properties.

    3. Select Manage security defaults.

    4. Set the Enable security defaults toggle to No.

    5. Select Save.'
  checks:
  - type: manual_review
    info: 'To ensure security defaults is disabled in your directory:

      1. Sign in to the Azure portal as a security administrator, Conditional Access

      administrator, or global administrator.

      2. Browse to Azure Active Directory > Properties.

      3. Select Manage security defaults.

      4. Verify the Enable security defaults toggle to No.'
    severity: medium
- id: 1.1.12
  title: (L2) Ensure that only organizationally managed/approved public groups exist
  scoring: manual
  profile:
  - E3 Level 2
  description: Ensure that only organizationally managed and approved public groups exist.
  rationale: 'In the Microsoft 365 Administration panel, when a group is created, the default privacy value is "Public". Make
    sure that public groups are willfully created. When a group has a "public" privacy, users may access data related to this
    group (e.g. SharePoint), through three methods : By using the Azure portal, and adding themselves into the public group.
    In this case, administrators are not notified. By requiring access to the group from the Group application of the Access
    Panel. This method forces users to send a message to the group owner, but they still have immediately access to the group.
    By accessing the SharePoint URL. The SharePoint URL is usually guessable, and can be found from the Group application
    of the Access Panel. If group privacy is not controlled, any user may access sensitive information, according to the group
    they try to access. NOTE: Public in this case meaning public to the organization.'
  impact: If the recommendation is applied, group owners could receive more access requests than usual, especially regarding
    groups originally meant to be public. 45 | P a g e
  references:
  - 1. https://docs.microsoft.com/en-us/azure/active-directory/users-groupsroles/groups-self-service-management#self-service-group-membership-defaults
  page_start: 45
  audit_raw: 'Using the Microsoft 365 Administration portal:

    In the Microsoft 365 Administration portal, go to:

    1. Teams & groups

    2. Active teams & groups

    3. Check that no groups have the status ''Public'' in the privacy column

    Using the Microsoft.Graph Powershell module:

    To get the list of public groups, run the following.

    Connect-Graph -Scopes "Group.Read.All"

    Get-MgGroup | where {$_.Visibility -eq "Public"} | select

    DisplayName,Visibility'
  remediation: 'In the Microsoft 365 Administration portal, go to:

    1. Teams & groups

    2. Active teams & groups

    3. Select a Public group

    4. Go to ''Settings''

    5. Set Privacy to ''Private'''
  checks:
  - type: manual_review
    info: 'Using the Microsoft 365 Administration portal:

      In the Microsoft 365 Administration portal, go to:

      1. Teams & groups

      2. Active teams & groups

      3. Check that no groups have the status ''Public'' in the privacy column

      Using the Microsoft.Graph Powershell module:

      To get the list of public groups, run the following.

      Connect-Graph -Scopes "Group.Read.All"

      Get-MgGroup | where {$_.Visibility -eq "Public"} | select

      DisplayName,Visibility'
    severity: medium
