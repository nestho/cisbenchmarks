  profile:
  - E3 Level 1
  description: Ensure that users passwords on their mobile devices, never expire.
  rationale: 'While this is not the most intuitive recommendation, research has found that when periodic password resets are
    enforced, passwords become weaker as users tend to pick something weaker and then use a pattern of it for rotation. If
    a user creates a strong password: long, complex and without any pragmatic words present, it should remain just as strong
    is 60 days as it is today. It is Microsoft''s official security position to not expire passwords periodically without
    a specific reason.'
