  title: (L2) Ensure the admin consent workflow is enabled
  scoring: scored
  profile:
  - E3 Level 2
  description: Without an admin consent workflow (Preview), a user in a tenant where user consent is disabled will be blocked
    when they try to access any app that requires permissions to access organizational data. The user sees a generic error
    message that says they're unauthorized to access the app and they should ask their admin for help.
  rationale: The admin consent workflow (Preview) gives admins a secure way to grant access to applications that require admin
    approval. When a user tries to access an application but is unable to provide consent, they can send a request for admin
    approval. The request is sent via email to admins who have been designated as reviewers. A reviewer takes action on the
    request, and the user is notified of the action.
  impact: To approve requests, a reviewer must be a global administrator, cloud application administrator, or application
    administrator. The reviewer must already have one of these admin roles assigned; simply designating them as a reviewer
    doesn't elevate their privileges.
