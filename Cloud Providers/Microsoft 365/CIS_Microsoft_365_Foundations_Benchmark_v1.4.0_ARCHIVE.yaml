- id: '1.6'
  title: (L1) Ensure Administrative accounts are separate, unassigned, and cloud-only
  scoring: manual
  profile:
  - E3 Level 1
  description: Administrative accounts are special privileged accounts that could have varying levels of access to data, users,
    and settings. Regular user accounts should never be utilized for Administrative tasks and care should be taken, in the
    case of a hybrid environment, to keep Administrative accounts separated from on-prem accounts. Administrative accounts
    should not have applications assigned so that they have no access to potentially vulnerable services (EX. email, Teams,
    Sharepoint, etc.) and only access to perform tasks as needed for Administrative purposes.
  rationale: Creating separate, unassigned (not have applications assigned), cloud-only Administrative accounts will help
    ensure that accounts are less susceptible to attacks than a lesser privileged account. In a hybrid environment, having
    separate accounts will help ensure that in the event of a breach in the cloud, that the breach does not affect the on-prem
    environment and vice-versa.
  impact: Since there are no license assignments required for Administrative accounts performing admin-level duties there
    is no financial impact. Administrative users will have to switch accounts and utilizing login/logout functionality when
    performing Administrative tasks.
  references:
  - 1. https://docs.microsoft.com/en-us/microsoft-365/admin/add-users/addusers?view=o365-worldwide
