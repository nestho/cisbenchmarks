  scoring: manual
  profile:
  - E3 Level 1
  description: You should review mail forwarding rules to external domains at least every week.
  rationale: While there are lots of legitimate uses of mail forwarding rules, they are also a popular data exfiltration tactic
    for attackers. You should review them regularly to ensure your users' email is not being exfiltrated.
  impact: ''
  references: []
  page_start: 170
  audit_raw: 'To verify mail forwarding rules are being reviewed at least weekly, confirm that the

    necessary procedures are in place and being followed.'
  remediation: "To review mail forwarding rules, use the Microsoft 365 Admin Center:\n1. Go to Exchange admin center.\n2.\
    \ Expand Reports then select Mail flow.\n3. Click on Auto forwarded messages report.\n4. Review\n170 | P a g e\nTo review\
    \ mail forwarding rules, use the following Powershell script:\nUses the administrator user credential to export Mail forwarding\
    \ rules, User Delegates and\nSMTP Forwarding policies to multiple csv files. First connect to Exchange Online by using\n\
    connect-exopssession\n$allUsers = @()\n$AllUsers = Get-MsolUser -All -EnabledFilter EnabledOnly | select ObjectID,\nUserPrincipalName,\
    \ FirstName, LastName, StrongAuthenticationRequirements,\nStsRefreshTokensValidFrom, StrongPasswordRequired,\nLastPasswordChangeTimestamp\
    \ | Where-Object {($_.UserPrincipalName -notlike\n\"*#EXT#*\")}\n$UserInboxRules = @()\n$UserDelegates = @()\nforeach\
    \ ($User in $allUsers)\n{\n Write-Host \"Checking inbox rules and delegates for user: \"\n$User.UserPrincipalName;\n $UserInboxRules\
    \ += Get-InboxRule -Mailbox $User.UserPrincipalname |\nSelect Name, Description, Enabled, Priority, ForwardTo,\nForwardAsAttachmentTo,\
    \ RedirectTo, DeleteMessage | Where-Object\n{($_.ForwardTo -ne $null) -or ($_.ForwardAsAttachmentTo -ne $null) -or\n($_.RedirectsTo\
    \ -ne $null)}\n $UserDelegates += Get-MailboxPermission -Identity $User.UserPrincipalName\n| Where-Object {($_.IsInherited\
    \ -ne \"True\") -and ($_.User -notlike \"*SELF*\")}\n}\n$SMTPForwarding = Get-Mailbox -ResultSize Unlimited | select\n\
    DisplayName,ForwardingAddress,ForwardingSMTPAddress,DeliverToMailboxandForwar\nd | where {$_.ForwardingSMTPAddress -ne\
    \ $null}\n# Export list of inboxRules, Delegates and SMTP Forwards\n$UserInboxRules | Export-Csv MailForwardingRulesToExternalDomains.csv\n\
    $UserDelegates | Export-Csv MailboxDelegatePermissions.csv\n$SMTPForwarding | Export-Csv Mailboxsmtpforwarding.csv\n171\
    \ | P a g e"
  checks:
  - type: manual_review
    info: 'To verify mail forwarding rules are being reviewed at least weekly, confirm that the

      necessary procedures are in place and being followed.'
    severity: medium
