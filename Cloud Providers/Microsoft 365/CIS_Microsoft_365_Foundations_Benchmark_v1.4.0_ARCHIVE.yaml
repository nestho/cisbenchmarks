  title: (L1) Ensure Sign-in frequency is enabled and browser sessions are not persistent for Administrative users.
  scoring: manual
  profile:
  - E3 Level 1
  description: 'Forcing a time out for MFA will help ensure that sessions are not kept alive for an indefinite period of time,
    ensuring that browser sessions are not persistent will help in prevention of drive-by attacks in web browsers, this also
    prevents creation and saving of session cookies leaving nothing for an attacker to take. Administrative roles this should
    apply to include those such as. • Global Administrator • Billing Administrator • Exchange Administrator • SharePoint Administrator
    • Password Administrator • Skype for Business Administrator • Service Support Administrator • User Administrator • Dynamics
    365 Service Administrator • Power BI Administrator NOTE: The frequency at which MFA is prompted will be determined by
    your organization''s policy and need.'
  rationale: Ensuring these additional controls are present for Administrative users adds an additional layer of defense against
