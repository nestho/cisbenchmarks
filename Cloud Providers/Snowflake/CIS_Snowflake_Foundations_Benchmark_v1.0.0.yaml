- id: '2.1'
  title: Ensure monitoring and alerting exist for ACCOUNTADMIN and SECURITYADMIN role grants
  scoring: manual
  profile:
  - Level 1
  description: By default, ACCOUNTADMIN is the most powerful role in a Snowflake account and users with SECURITYADMIN role
    grant can trivially escalate their privileges to that of ACCOUNTADMIN. Following the principle of least privilege that
    prescribes limiting user's privileges to those that are strictly required to do their jobs, the ACCOUNTADMIN and SECURITYADMIN
    roles should be assigned to a limited number of designated users. Any new ACCOUNTADMIN and SECURITYADMIN role grants should
    be scrutinized.
  rationale: Every new ACCOUNTADMIN and SECURITYADMIN role assignment increases the attack surface of a Snowflake environment.
    It may also indicate unauthorized privilege escalation performed by a threat actor. If monitoring for ACCOUNTADMIN role
    assignments is not configured, inappropriate or unauthorized ACCOUNTADMIN role access grants may be missed. The latter
    can lead to eventual security posture degradation or late detection of an ongoing security incident. The same logic applies
    to the SECURITYADMIN role.
  impact: If the principle of least privilege is not strictly applied and ACCOUNTADMIN and SECURITYADMIN role assignments
    happen frequently, monitoring and alerting on this event may generate undue load on the detection and response team.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/ui-snowsight-activity.html
  - 2. https://docs.snowflake.com/en/user-guide/security-access-controlconsiderations.html
  page_start: 67
  audit_raw: 'Confirm that your security monitoring and alerting solution is configured to generate

    alerts on new ACCOUNTADMIN and SECURITYADMIN role assignments.'
  remediation: 'Programmatically:

    In a Snowsight worksheet or through the SnowSQL CLI:

    1. Configure your monitoring task to alert on ACCOUNTADMIN and SECURITYADMIN role

    grants. You can find those grants with the following query:

    SELECT *

    FROM SNOWFLAKE.ACCOUNT_USAGE.GRANTS_TO_ROLES

    WHERE NAME IN (''ACCOUNTADMIN'', ''SECURITYADMIN'');'
  checks:
  - type: manual_review
    info: 'Confirm that your security monitoring and alerting solution is configured to generate

      alerts on new ACCOUNTADMIN and SECURITYADMIN role assignments.'
    severity: medium
- id: '2.2'
  title: Ensure monitoring and alerting exist for MANAGE GRANTS privilege grants
  scoring: manual
  profile:
  - Level 1
  description: The MANAGE GRANTS privilege is one of the most powerful privileges in the Snowflake environment. This privilege
    gives the ability to grant or revoke privileges on any object as if the invoking role were the owner of the object. A
    custom role with the MANAGE GRANTS privilege on account level will not be able to grant privileges on the account level
    as that privilege is implicitly reserved for the ACCOUNTADMIN and SECURITYADMIN roles. However, such custom roles will
    be able to grant any privileges on any objects below the account level. Following the principle of least privilege and
    given how powerful the MANAGE GRANTS privilege is, any new MANAGE GRANTS privilege grants should be scrutinized.
  rationale: Every new role granted the MANAGE GRANTS privilege increases the attack surface of a Snowflake environment. It
    may also indicate unauthorized privilege escalation performed by a threat actor. If monitoring for MANAGE GRANTS privilege
    grants is not configured, inappropriate or unauthorized MANAGE GRANTS privilege grants may be missed. The latter can lead
    to eventual security posture degradation or late detection of an ongoing security incident.
  impact: If MANAGE GRANTS privilege grants happen frequently, monitoring and alerting on this event may generate undue load
    on the detection and response team.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/ui-snowsight-activity.html
  - 2. https://docs.snowflake.com/en/user-guide/security-access-control-privileges.html
  page_start: 69
  audit_raw: 'Confirm that your security monitoring and alerting solution is configured to generate

    alerts on new MANAGE GRANTS privilege grants.'
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Configure your monitoring task\
    \ to alert on manage grants privilege grants.\nselect end_time, query_type\n query_text,\n user_name,\n role_name\nfrom\
    \ snowflake.account_usage.query_history\nwhere execution_status = 'SUCCESS'\n and query_type = 'GRANT'\n and regexp_instr(query_text,\
    \ 'manage\\\\s*grants', 1, 1, 0, 'i') > 0\n order by end_time desc;"
  checks:
  - type: manual_review
    info: 'Confirm that your security monitoring and alerting solution is configured to generate

      alerts on new MANAGE GRANTS privilege grants.'
    severity: medium
- id: '2.3'
  title: Ensure monitoring and alerting exist for password sign-ins of SSO users
  scoring: manual
  profile:
  - Level 1
  description: The security benefit of SSO is to relieve users from having to set up and manage distinct sets of credentials
    for distinct applications and services. It also allows security administrators to focus on hardening and defending only
    one identity storage and limited number of user credentials.
  rationale: Allowing users to sign in with Snowflake passwords in the presence of a configured third-party identity provider
    SSO may undermine mandatory security controls configured on the SSO and degrade security posture of the account. For example,
    the SSO sign-in flow may be configured to require multi-factor authentication (MFA), where Snowflake password sign-in
    flow may not. Every Snowflake password-based sign-in may indicate an unapproved authentication flow taking place.
  impact: If password sign-in events happen frequently, monitoring and alerting on this event may generate undue load on the
    detection and response team.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/ui-snowsight-activity.html
  - 2. https://docs.snowflake.com/en/user-guide/admin-security-fed-auth.html
  page_start: 71
  audit_raw: 'Confirm that your security monitoring and alerting solution is configured to generate

    alerts on new password sign-in events.'
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Configure your security monitoring\
    \ solution to alert on password sign-ins of SSO\nusers. The following query can be run periodically.\nselect event_timestamp,\n\
    \ user_name,\n client_ip,\n reported_client_type,\n reported_client_version,\n first_authentication_factor,\n second_authentication_factor\n\
    from snowflake.account_usage.login_history\nwhere first_authentication_factor = 'PASSWORD'\norder by event_timestamp desc;"
  checks:
  - type: manual_review
    info: 'Confirm that your security monitoring and alerting solution is configured to generate

      alerts on new password sign-in events.'
    severity: medium
- id: '2.4'
  title: Ensure monitoring and alerting exist for password sign-in without MFA
  scoring: manual
  profile:
  - Level 1
  description: Multi-factor authentication (MFA) is a security control used to add an additional layer of login security.
    It works by requiring the user to present two or more proofs (factors) of user identity. An MFA example would be requiring
    a password and a verification code delivered to the user's phone during user sign-in. The MFA feature for Snowflake users
    is powered by the Duo Security service.
  rationale: MFA mitigates security threats of users creating weak passwords and user passwords being stolen or accidentally
    leaked.
  impact: If password sign-in events without MFA happen frequently, monitoring and alerting on this event may generate undue
    load on the detection and response team.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/security-access-control-configure.html
  - 2. https://docs.snowflake.com/en/user-guide/security-mfa.html
  page_start: 73
  audit_raw: 'Confirm that your security monitoring and alerting solution is configured to generate

    alerts on new password sign-in without MFA events.'
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Configure your security monitoring\
    \ solution to alert on password sign-ins without\nMFA. The following query can be run periodically.\nselect event_timestamp,\n\
    \ user_name,\n client_ip,\n reported_client_type,\n reported_client_version,\n first_authentication_factor,\n second_authentication_factor\n\
    from snowflake.account_usage.login_history\nwhere first_authentication_factor = 'PASSWORD'\n and second_authentication_factor\
    \ is null\norder by event_timestamp desc;"
  checks:
  - type: manual_review
    info: 'Confirm that your security monitoring and alerting solution is configured to generate

      alerts on new password sign-in without MFA events.'
    severity: medium
- id: '2.5'
  title: Ensure monitoring and alerting exist for creation, update and deletion of security integrations
  scoring: manual
  profile:
  - Level 1
  description: Security integration object is used to configure SSO and SCIM integrations.
  rationale: Creation of an unauthorized security integration, in case of SCIM, can lead to creation of rogue Snowflake users.
    Incase of SSO, it can lead to hijacking of existing Snowflake users through rogue authentication flow. Update or deletion
    of an existing security integration can lead to weakening security posture of that integration or denial of service, e.g.
    when users cannot sign into Snowflake accounts due to broken SSO authentication flow.
  impact: If security integration creation, update and deletion events happen frequently, monitoring and alerting on this
    event may generate undue load on the detection and response team.
  references:
  - 1. https://docs.snowflake.com/en/sql-reference/sql/create-security-integration.html
  - 2. https://docs.snowflake.com/en/user-guide/ui-snowsight-activity.html
  page_start: 75
  audit_raw: 'Confirm that your security monitoring and alerting solution is configured to generate

    alerts on new security integration creation, update and deletion events.'
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Configure your security monitoring\
    \ solution to alert on creation, update and\ndeletion of security integrations.\nselect end_time,\n query_type,\n query_text,\n\
    \ user_name,\n role_name\nfrom snowflake.account_usage.query_history\nwhere execution_status = 'SUCCESS'\n and query_type\
    \ in ('CREATE', 'ALTER', 'DROP')\n and query_text ilike '%security integration%'\norder by end_time desc;"
  checks:
  - type: manual_review
    info: 'Confirm that your security monitoring and alerting solution is configured to generate

      alerts on new security integration creation, update and deletion events.'
    severity: medium
- id: '2.6'
  title: Ensure monitoring and alerting exist for changes to network policies and associated objects
  scoring: manual
  profile:
  - Level 1
  description: Network policies allow restricting access to a Snowflake account based on source IP addresses. A network policy
    can be configured either on the account level, for all users of the account, or on the user level, for a specific user.
    In the presence of both accountlevel and user-level policies the latter takes precedence. A network policy can also be
    configured on the SCIM and Snowflake OAuth security integrations to restrict the list of source IP addresses allowed when
    exchanging an authorization code for an access or refresh token and when using a refresh token to obtain a new access
    token. If network policy is not set on the security integration of the aforementioned types, the account-level network
    policy, if any, is used.
  rationale: Creation and application of unauthorized network policies can weaken access control through expansion of the
    allowed source IP addresses, or lead to a denial of service through blocklisting legitimate source IP addresses. Unauthorized
    changes and deletions of existing network policies can lead to the same undesirable results.
  impact: If network policy creation, update, deletion and object association events happen frequently, monitoring and alerting
    on this event may generate undue load on the detection and response team.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/network-policies.html
  - 2. https://docs.snowflake.com/en/sql-reference/sql/create-security-integrationoauth-snowflake.html
  page_start: 77
  audit_raw: 'Confirm that your security monitoring and alerting solution is configured to generate

    alerts on new security integration creation, update and deletion events.'
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Configure your security monitoring\
    \ solution to alert on changes to network\npolicies.\nselect end_time,\n query_type,\n query_text,\n user_name,\n role_name\n\
    from snowflake.account_usage.query_history\nwhere execution_status = 'SUCCESS'\n and (\n query_type in ('CREATE_NETWORK_POLICY',\
    \ 'ALTER_NETWORK_POLICY',\n 'DROP_NETWORK_POLICY')\n or (query_text ilike '%set%network_policy%'\n or query_text ilike\
    \ '%unset%network_policy%')\n)\norder by end_time desc;"
  checks:
  - type: manual_review
    info: 'Confirm that your security monitoring and alerting solution is configured to generate

      alerts on new security integration creation, update and deletion events.'
    severity: medium
- id: '2.7'
  title: Ensure monitoring and alerting exist for SCIM token creation
  scoring: manual
  profile:
  - Level 1
  description: The System for Cross-domain Identity Management (SCIM) is an open specification designed to help facilitate
    the automated management of user identities and groups (i.e. roles) in cloud applications using RESTful APIs. Snowflake
    supports SCIM 2.0 integration with Okta, Microsoft Azure AD and custom identity providers. Users and groups from the identity
    provider can be provisioned into Snowflake, which functions as the service provider. SCIM access token is a bearer token
    used by SCIM clients to authenticate to Snowflake SCIM server.
  rationale: SCIM access tokens generated without proper authorization may be used for configuring rogue SCIM integrations.
    Such SCIM integrations can then be used for provisioning rogue users that through existing roles are granted unauthorized
    access to Snowflake data and other objects.
  impact: If SCIM access token creation events happen frequently, monitoring and alerting on this event may generate undue
    load on the detection and response team. That said, a SCIM access token is valid for 6 months and there is usually only
    one SCIM integration per account. Frequent SCIM access token creation would likely be an unusual event.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/scim-intro.html#scim-overview
  - 2. https://docs.snowflake.com/en/user-guide/scim-custom.html#create-a-customscim-security-integration-and-api-token
  page_start: 79
  audit_raw: 'Confirm that your security monitoring and alerting solution is configured to generate

    alerts on new security SCIM access token events.'
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Configure your security monitoring\
    \ solution to alert on SCIM token creation. The\nfollowing query can be run periodically.\nselect end_time,\n query_type,\n\
    \ query_text,\n user_name,\n role_name\nfrom snowflake.account_usage.query_history\nwhere execution_status = 'SUCCESS'\n\
    \ and query_type = 'SELECT'\n and regexp_instr(query_text,\n'system\\\\$generate_scim_access_token\\\\s*\\\\(', 1, 1,\
    \ 0, 'i') > 0\norder by end_time desc;"
  checks:
  - type: manual_review
    info: 'Confirm that your security monitoring and alerting solution is configured to generate

      alerts on new security SCIM access token events.'
    severity: medium
- id: '2.8'
  title: Ensure monitoring and alerting exists for new share exposures
  scoring: manual
  profile:
  - Level 1
  - Level 2
  description: Snowflake tables, views and UDFs can be shared across Snowflake accounts using share objects created by data
    providers and imported by data consumers. To expose a share to another account, the share provider account needs to add
    or set consumer accounts on a share using the ALTER SHARE command. The consumer account can then import the share using
    the CREATE DATABASE FROM SHARE command. Snowflake provides client software (drivers, connectors, etc.) for connecting
    to Snowflake and using certain Snowflake features (e.g. Apache Kafka for loading data, Apache Hive metadata for external
    tables). The clients must be installed on each local workstation or system from which you wish to connect. The Snowflake
    Connector for Python, JDBC and ODBC drivers are some of the most used Snowflake clients. Old versions of drivers and connectors
    may contain security vulnerabilities that have been fixed in the latest version. To ensure that only up-to-date software
    is used, you should actively monitor session logins coming from unsupported clients and upgrade those to the latest available
    versions. Network policies allow restricting access to a Snowflake account based on source IP addresses. A network policy
    can be configured either on the account level, for all users of the account, or on the user level, for a specific user.
    In the presence of both accountlevel and user-level policies, the user-level policies take precedence. A network policy
    can also be configured on the SCIM and Snowflake OAuth security integrations to restrict the list of source IP addresses
    allowed when exchanging an authorization code for an access or refresh token and when using a refresh token to obtain
    a new access token. If network policy is not set on the security integration of the aforementioned types, the account-level
    network policy is set, if used.
  rationale: A share exposed to another Snowflake account can be used for data exfiltration. Using out-of-date Snowflake clients
    can expose your account to security risks. You should monitor for connections from unsupported Snowflake Connector for
    Python and JDBC and ODBC drivers and upgrade to the latest versions available. Network policies help mitigate the threat
    of leaked user credentials. If an account network policy is not configured limiting source IP addresses, leaked Snowflake
    credentials can be used from anywhere in the world. Network policies are especially useful when there is a heightened
    risk of leaking credentials. For example, if instead of using SSO, users authenticate to Snowflake using Snowflake passwords.
    Network policy set on the account level can serve as a coarse-grained baseline for the majority of the Snowflake users
    and can be further tightened on the specific highly privileged user, service account, and security integration level.
  impact: If exposing shares to another account event happens frequently, monitoring and alerting on this event may generate
    undue load on the detection and response team. None. If a network policy is misconfigured to disallow IP addresses from
    which users usually access Snowflake, their productivity may be impacted. If a network policy is misconfigured to disallow
    IP addresses from which services and automation usually access Snowflake, reliability of those services and automation
    may be impacted. If a network policy is misconfigured to disallow IP addresses used by one of the Snowflake security integrations
    that support network policies, those integrations will be broken. If a user with permissions to configure network policies
    on the account accidentally locks themselves and everybody else with such permission out, they will need to contact Snowflake
    customer support to restore access to their account.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/data-sharing-intro
  - 2. https://docs.snowflake.com/en/sql-reference/sql/alter-share
  - 1. https://docs.snowflake.com/en/release-notes/requirements
  - 2. https://community.snowflake.com/s/article/how-to-report-on-the-clientsconnecting-to-a-snowflake-account
  - 1. https://docs.snowflake.com/en/user-guide/network-policies.html
  page_start: 81
  audit_raw: 'Confirm that your security monitoring and alerting solution is configured to generate

    alerts on new share exposures.

    Confirm that your security monitoring and alerting solution is configured to generate

    alerts on sessions coming from unsupported Snowflake connectors and drivers.

    From the UI:

    1. Go to https://app.snowflake.com/ and sign into your Snowflake account.

    2. On the left side navigation bar, click on Admin.

    3. Under Admin, click on Security.

    4. Under the Network Policies tab, ensure that a network policy is configured

    properly and set to Active.

    Programmatically:

    In a Snowsight worksheet or through the SnowSQL CLI:

    1. List the network policies active at the account level.

    SHOW PARAMETERS LIKE ''NETWORK_POLICY'' IN ACCOUNT;

    2. Ensure that the query returns a result.

    3. Note the name of the network policy and replace <policy_name> in the query

    below with your network policy name:

    DESCRIBE NETWORK POLICY <policy_name>;

    4. Ensure that ALLOWED_IP_LIST is set for the network policy and that it contains

    only trusted IP address ranges.'
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Configure your security monitoring\
    \ solution to alert on new share exposures. The\nfollowing query can be run periodically.\nselect end_time,\n query_type,\n\
    \ query_text,\n user_name,\n role_name\nfrom snowflake.account_usage.query_history\nwhere execution_status = 'SUCCESS'\n\
    \ and query_type = 'ALTER'\n and regexp_instr(query_text,\n'^alter\\\\s*share.*(add|set)\\\\s*accounts\\\\s*=', 1, 1,\
    \ 0, 'is') > 0\norder by end_time desc;\nProgrammatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Check\
    \ the Recommended Client Versions documentation and note the minimum\nversions of the Snowflake Connector for Python,\
    \ JDBC driver and ODBC driver.\n2. Create a UDF to help you compare version numbers:\nCREATE OR REPLACE FUNCTION compare_versions(v1\
    \ VARCHAR, v2 VARCHAR)\n-- result compares v1 and v2\n-- result == lower means that v1 is lower than v2\n RETURNS VARCHAR\n\
    \ AS\n $$\n case\n when CAST(SPLIT(v1, '.')[0] AS NUMBER) < CAST(SPLIT(v2, '.')[0]\nAS NUMBER) then 'lower'\n when CAST(SPLIT(v1,\
    \ '.')[0] AS NUMBER) > CAST(SPLIT(v2, '.')[0]\nAS NUMBER) then 'higher'\n when CAST(SPLIT(v1, '.')[1] AS NUMBER) < CAST(SPLIT(v2,\
    \ '.')[1]\nAS NUMBER) then 'lower'\n when CAST(SPLIT(v1, '.')[1] AS NUMBER) > CAST(SPLIT(v2, '.')[1]\nAS NUMBER) then\
    \ 'higher'\n when CAST(SPLIT(v1, '.')[2] AS NUMBER) < CAST(SPLIT(v2, '.')[2]\nAS NUMBER) then 'lower'\n when CAST(SPLIT(v1,\
    \ '.')[2] AS NUMBER) > CAST(SPLIT(v2, '.')[2]\nAS NUMBER) then 'higher'\n else 'equal'\n end\n $$\n ;\n3. Configure your\
    \ security monitoring solution to alert on sessions from unsupported\nversions. Replace the version numbers below with\
    \ the latest versions from the\nprevious step. The following query can be run periodically.\nSELECT CREATED_ON, USER_NAME,\n\
    \ SPLIT(CLIENT_APPLICATION_ID, ' ')[0]::varchar AS \"CLIENT_APP\",\n CLIENT_APPLICATION_VERSION,\n CLIENT_ENVIRONMENT\n\
    FROM SNOWFLAKE.ACCOUNT_USAGE.SESSIONS\nWHERE (\"CLIENT_APP\" = 'JDBC' AND\nCOMPARE_VERSIONS(CLIENT_APPLICATION_VERSION,\
    \ '3.13.6') = 'lower')\n OR (\"CLIENT_APP\" = 'ODBC' AND\nCOMPARE_VERSIONS(CLIENT_APPLICATION_VERSION, '2.23.3') = 'lower')\n\
    \ OR (\"CLIENT_APP\" = 'PythonConnector' AND\nCOMPARE_VERSIONS(CLIENT_APPLICATION_VERSION, '2.5.0') = 'lower')\nORDER\
    \ BY CLIENT_APPLICATION_ID;\n4. When detecting the use of unsupported clients, upgrade to the latest,\nrecommended version.\n\
    From the UI:\n1. Go to https://app.snowflake.com/ and sign into your Snowflake account.\n2. On the left side navigation\
    \ bar, click on Admin.\n3. Under Admin, click on Security.\n4. Under the Network Policies tab, click the + Network Policy\
    \ button on the top\nright side.\n5. Enter a Policy Name and list of Allowed IP Addresses.\n6. Click Create network policy.\n\
    7. Find your policy in the list of network policies and click Activate policy. This will\nset the network policy at the\
    \ account level.\nProgrammatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Create a network policy.\
    \ Replace <policy_name> with the name you want to give\nthe policy, and customize the list of allowed and blocked IP addresses:\n\
    CREATE NETWORK POLICY <policy_name> ALLOWED_IP_LIST=('192.168.1.0/24');\n2. Set the network policy at the account level:\n\
    ALTER ACCOUNT SET NETWORK_POLICY = <policy_name>;\nFor more information, see the documentation on creating network policies.\n\
    Note:\n• When a network policy includes values for both ALLOWED_IP_LIST and\nBLOCKED_IP_LIST, Snowflake applies the blocked\
    \ list first.\n• Do not add 0.0.0.0/0 to BLOCKED_IP_LIST. Because Snowflake applies the\nblocked list first, this would\
    \ block your own access. Additionally, in order to block\nall IP addresses except a select list, you only need to add\
    \ IP addresses to\nALLOWED_IP_LIST. Snowflake automatically blocks all IP addresses not included\nin the allowed list.\n\
    • You can create and set a network policy on a security integration to configure\nallowed IP addresses from your IdP used\
    \ to exchange an authorization code for\nan access or refresh token and when using a refresh token to obtain a new\naccess\
    \ token."
