controls:
- id: '1.1'
  title: Ensure single sign-on (SSO) is configured for your account / organization
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: 'Federated authentication enables users to connect to Snowflake using secure SSO (single sign-on). With SSO
    enabled, users authenticate through an external (SAML 2.0compliant or OAuth 2.0) identity provider (IdP). Once authenticated
    by an IdP, users can access their Snowflake account for the duration of their IdP session without having to authenticate
    to Snowflake again. Users can choose to initiate their sessions from within the interface provided by the IdP or directly
    in Snowflake. Snowflake offers native support for federated authentication and SSO through Okta and Microsoft ADFS. Snowflake
    also supports most SAML 2.0-compliant vendors as an IdP, including Google G Suite, Microsoft Azure Active Directory, OneLogin,
    and Ping Identity PingOne. To use an IdP other than Okta or ADFS, you must define a custom application for Snowflake in
    the IdP. There are two ways to configure SAML: • By creating the security integration (recommended) • By setting the SAML_IDENTITY_PROVIDER
    account parameter (deprecated) The System for Cross-domain Identity Management (SCIM) is an open specification designed
    to help facilitate the automated management of user identities and groups (i.e. roles) in cloud applications using RESTful
    APIs. Snowflake supports SCIM 2.0 integration with Okta, Microsoft Azure AD and custom identity providers. Users and groups
    from the identity provider can be provisioned into Snowflake, which functions as the service provider.'
  rationale: Configuring your Snowflake authentication so that users can log in using SSO reduces the attack surface for your
    organization because users only log in once across multiple applications and do not have to manage a separate set of credentials
    for their Snowflake account. While SSO enables seamless authentication with a federated identity to the Snowflake application,
    user accounts still need to be created, managed, and deprovisioned. Operations like adding and deleting users, changing
    permissions, and adding new types of accounts usually take up valuable admin time and when done manually may be errorprone.
    With SCIM, user identities can be created either directly in your identity provider, or imported from external systems
    like HR software or Active Directory. SCIM enables IT departments to automate the user provisioning and deprovisioning
    process while also having a single system to manage permissions and groups. Since data is transferred automatically, risk
    of error is reduced.
  impact: There may be costs associated with provisioning and using an IdP service. None.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/admin-security-fed-auth.html
  - 2. https://docs.snowflake.com/en/user-guide/admin-security-fed-auth-configureidp.html
  - 1. https://docs.snowflake.com/en/user-guide/scim-intro.html
  page_start: 14
  audit_raw: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. List all the security integrations\
    \ in your account.\nSHOW SECURITY INTEGRATIONS;\n2. Ensure that there are security integrations of type SAML2 and EXTERNAL_OAUTH\n\
    configured for an account.\nSELECT *\nFROM TABLE(RESULT_SCAN(LAST_QUERY_ID()))\nWHERE (\"type\" LIKE 'EXTERNAL_OAUTH%'\
    \ OR \"type\" LIKE 'SAML2')\n AND \"enabled\" = TRUE;\n3. Ensure that there is an SSO integration configured for the account.\n\
    Note: The presence of a configured security integration does not mean that it is\nconfigured correctly and working. Configuration\
    \ correctness should be explicitly\ntested\nRequired privileges:\nTo be able to execute the above audit query above, the\
    \ caller needs the USAGE privilege\non every security integration in your Snowflake account.\nProgrammatically:\nIn a\
    \ Snowsight worksheet or through the SnowSQL CLI:\n1. List the security integrations in your account:\nSHOW SECURITY INTEGRATIONS;\n\
    2. Ensure that a SCIM integration is configured. The output of the following\ncommand shows all SCIM security integrations\
    \ configured for an account. No\noutput means no SCIM integration has been configured for the account.\n3. Ensure that\
    \ there are security integrations of type SCIM% with enabled set to true.\nSELECT *\nFROM TABLE(result_scan(last_query_id()))\n\
    WHERE (\"type\" like 'SCIM%') AND \"enabled\" = true;\nNote: The presence of a SCIM security integration does not mean\
    \ that it is\nconfigured correctly and working.\nRequired privileges:\nTo be able to execute the above audit query above,\
    \ the caller needs the USAGE privilege\non every security integration in an account."
  remediation: 'The steps for configuring an IdP differ depending on whether you choose SAML2 or

    OAuth. They further differ depending on what identity provider you choose: Okta, AD

    FS, Ping Identity, Azure AD, or custom. For specific instructions, see Snowflake

    documentation on SAML and External OAuth.

    Note: If your SAML integration is configured using the deprecated account parameter

    SAML_IDENTITY_PROVIDER, you should migrate to creating a security integration using the

    system$migrate_saml_idp_registration function. For more information, see the

    Migrating to a SAML2 Security Integration documentation.

    Follow the instructions in the Snowflake documentation to set up SCIM configuration for

    Okta, Azure AD, or configure a custom SCIM integration.'
  checks:
  - type: sql
    command: SHOW SECURITY INTEGRATIONS;
    severity: medium
    info: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. List all the security integrations\
      \ in your account.\nSHOW SECURITY INTEGRATIONS;\n2. Ensure that there are security integrations of type SAML2 and EXTERNAL_OAUTH\n\
      configured for an account.\nSELECT *\nFROM TABLE(RESULT_SCAN(LAST_QUERY_ID()))\nWHERE (\"type\" LIKE 'EXTERNAL_OAUTH%'\
      \ OR \"type\" LIKE 'SAML2')\n AND \"enabled\" = TRUE;\n3. En"
- id: '1.3'
  title: Ensure that Snowflake password is unset for SSO users
  scoring: manual
  profile:
  - Level 1
  description: Ensure that Snowflake password is unset for SSO users.
  rationale: 'Allowing users to sign in with Snowflake passwords in the presence of a configured third-party identity provider
    SSO may undermine mandatory security controls configured on the SSO and degrade the security posture of the account. For
    example, the SSO sign-in flow may be configured to require multi-factor authentication (MFA), whereas the Snowflake password
    sign-in flow may not. Note: • This benchmark does not preclude configuration of key pair authentication for SSO users.
    Key pair authentication may be necessary for users to interact with Snowflake programmatically or through third party
    tools. • To mitigate the risk of users not being able to sign-in due to SSO provider outage, ensure that at least one
    SSO break-glass user exists with Snowflake password reset privileges for account users. This break-glass user should be
    able to sign in using a Snowflake native password (coupled with MFA) or a key pair.'
  impact: Users will not be able to sign into their Snowflake accounts if SSO sign-in flow breaks, for example due to SSO
    provider outage.
  references:
  - 1. https://docs.snowflake.com/en/sql-reference/sql/create-user.html
  - 2. https://docs.snowflake.com/en/user-guide/scim-okta.html#features
  page_start: 20
  audit_raw: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Show all users in an account that\
    \ have a password set:\nSELECT NAME, HAS_PASSWORD\nFROM SNOWFLAKE.ACCOUNT_USAGE.USERS\nWHERE HAS_PASSWORD\n AND DELETED_ON\
    \ IS NULL\n AND NOT DISABLED;\n2. Check your IdP configurations and ensure that, if there are users with\npasswords, these\
    \ users are not SSO users. An exception should be allowed for a\nthe break-glass SSO user which needs to be able to log-in\
    \ with a Snowflake\npassword and MFA (or with a key pair).\nRequired privileges:\nRunning the query requires the SECURITY_VIEWER\
    \ role on the Snowflake database."
  remediation: "Programmatically:\nFor each SSO user <username> with a password, run the following command to set\npassword\
    \ to null:\nALTER USER <username>\n SET PASSWORD = NULL;"
  checks:
  - type: sql
    command: 'Show all users in an account that have a password set:'
    severity: medium
    info: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Show all users in an account that have\
      \ a password set:\nSELECT NAME, HAS_PASSWORD\nFROM SNOWFLAKE.ACCOUNT_USAGE.USERS\nWHERE HAS_PASSWORD\n AND DELETED_ON\
      \ IS NULL\n AND NOT DISABLED;\n2. Check your IdP configurations and ensure that, if there are users with\npasswords,\
      \ these users are not SSO users. An exception should be allowed f"
- id: '1.4'
  title: Ensure multi-factor authentication (MFA) is turned on for all human users with password-based authentication
  scoring: scored
  profile:
  - Level 1
  description: Multi-factor authentication (MFA) is a security control used to add an additional layer of login security.
    It works by requiring the user to present two or more proofs (factors) of user identity. An MFA example would be requiring
    a password and a verification code delivered to the user's phone during user sign-in. The MFA feature for Snowflake users
    is powered by the Duo Security service.
  rationale: MFA mitigates security threats of users creating weak passwords and user passwords being stolen or accidentally
    leaked.
  impact: If users lose access to the second factor of authentication, an account admin may need to reset their access.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/security-access-control-configure.html
  - 2. https://docs.snowflake.com/en/user-guide/security-mfa.html
  page_start: 23
  audit_raw: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. List all active users with passwords\
    \ and no MFA enabled:\nSELECT NAME, EXT_AUTHN_DUO AS MFA_ENABLED\nFROM SNOWFLAKE.ACCOUNT_USAGE.USERS\nWHERE DELETED_ON\
    \ IS NULL\n AND NOT DISABLED\n AND HAS_PASSWORD;\n2. Ensure that the query above does not return any results.\nNote: If\
    \ users have SSO enabled, the MFA authentication will be handled by the\nIdentity Provider and does not reflect in the\
    \ query above. For SSO users,\nconfigure and check MFA status on your Identity Provider.\nRequired privileges:\nRunning\
    \ the query requires the SECURITY_VIEWER role on the Snowflake database."
  remediation: 'Users have to individually enroll into MFA using the Snowflake web UI.

    From the UI:

    1. Each user with a password should go to https://app.snowflake.com/ and sign into

    their Snowflake account.

    2. Click on the username on the top left side.

    3. Click on Profile.

    4. Next to Multi-factor authentication click Enroll.

    5. Click Start setup.

    6. Select the type of device and click Continue.

    7. Follow the steps to finish the enrollment.

    If MFA needs to be enabled for a large population of users, consider prioritizing users

    with ACCOUNTADMIN, SECURITYADMIN or other highly privileged roles.

    For specific instructions, see the documentation page Enrolling in MFA (Multi-Factor

    Authentication).

    Note: If you use SSO authentication, you will have to check and configure MFA with

    your Identity Provider.'
  checks:
  - type: sql
    command: SELECT NAME, EXT_AUTHN_DUO AS MFA_ENABLED
    severity: medium
    info: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. List all active users with passwords\
      \ and no MFA enabled:\nSELECT NAME, EXT_AUTHN_DUO AS MFA_ENABLED\nFROM SNOWFLAKE.ACCOUNT_USAGE.USERS\nWHERE DELETED_ON\
      \ IS NULL\n AND NOT DISABLED\n AND HAS_PASSWORD;\n2. Ensure that the query above does not return any results.\nNote:\
      \ If users have SSO enabled, the MFA authentication will be handle"
- id: '1.5'
  title: Ensure minimum password length is set to 14 characters or more
  scoring: scored
  profile:
  - Level 1
  description: 'To mitigate the risk of unauthorized access to a Snowflake account through easily guessable password, Snowflake
    enforces the following password policy as a minimum requirement while using the ALTER USER command and the web interface:
    • Must be at least 8 characters long. • Must contain at least 1 digit. • Must contain at least 1 uppercase letter and
    1 lowercase letter. Snowflake password policies can be used to specify and enforce further constraints on password length
    and complexity. Snowflake supports setting a password policy for your Snowflake account and for individual users. Only
    one password policy can be set at any given time for your Snowflake account or a user. If a password policy exists for
    the Snowflake account and another password policy is set for a user in the same Snowflake account, the user-level password
    policy takes precedence over the account-level password policy. The password policy applies to new passwords that are
    set in your Snowflake account. To ensure that users with existing passwords meet the password policy requirements, require
    users to change their password during their next login to Snowflake as shown in Step 6: Require a Password Change.'
  rationale: While Snowflake recommends configuring SSO authentication for users and ensuring that SSO users do not have a
    password set, there may be exceptions when users still need to log in with a password (e.g., setting up a break-glass
    user with password login to recover from SSO outages). For those few users that still need to have a password, setting
    a password policy can help ensure that, throughout subsequent password changes, the passwords used remain complex and
    therefore harder to guess or bruteforce.
  impact: None.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/admin-user-management#passwordpolicies
  page_start: 26
  audit_raw: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. List account-level password policies\
    \ that enforce a minimum password length of\n14 characters.\nWITH PWDS_WITH_MIN_LEN AS (\n SELECT ID\n FROM SNOWFLAKE.ACCOUNT_USAGE.PASSWORD_POLICIES\n\
    \ WHERE PASSWORD_MIN_LENGTH >= 14\n AND DELETED IS NULL\n)\nSELECT A.*\nFROM SNOWFLAKE.ACCOUNT_USAGE.POLICY_REFERENCES\
    \ AS A\n LEFT JOIN PWDS_WITH_MIN_LEN AS B ON A.POLICY_ID = B.ID\nWHERE A.REF_ENTITY_DOMAIN = 'ACCOUNT'\n AND A.POLICY_KIND\
    \ = 'PASSWORD_POLICY'\n AND A.POLICY_STATUS = 'ACTIVE'\n AND B.ID IS NOT NULL;\n2. Ensure that the query above returns\
    \ a password policy.\n3. List all user-level password policies. All password policies applied on the user\nlevel also\
    \ need to be checked, therefore a password policy set for a user\noverrides a password policy set on an account.\nWITH\
    \ PWDS_WITH_MIN_LEN AS (\n SELECT ID\n FROM SNOWFLAKE.ACCOUNT_USAGE.PASSWORD_POLICIES\n WHERE PASSWORD_MIN_LENGTH >= 14\n\
    \ AND DELETED IS NULL\n)\nSELECT A.*\nFROM SNOWFLAKE.ACCOUNT_USAGE.POLICY_REFERENCES AS A\n LEFT JOIN PWDS_WITH_MIN_LEN\
    \ AS B ON A.POLICY_ID = B.ID\nWHERE A.REF_ENTITY_DOMAIN = 'USER'\n AND A.POLICY_STATUS = 'ACTIVE'\n AND B.ID IS NULL;\n\
    4. Ensure that the query above does not return any results."
  remediation: "Follow the following steps to set and enforce a password policy:\n1. Create the password policy if it does\
    \ not exist:\nCREATE PASSWORD POLICY <password_policy>\n PASSWORD_MIN_LENGTH = 14\n PASSWORD_MAX_AGE_DAYS = 0;\n2. Set\
    \ password policy on the account level:\nALTER ACCOUNT\n SET PASSWORD POLICY <password_policy>;\nNote: It may take up\
    \ to 2 hours for the password policies created to show up in\nthe account usage view. For more information on latency,\
    \ see the Data latency\nfor Account Usage documentation."
  checks:
  - type: sql
    command: SELECT ID
    severity: medium
    info: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. List account-level password policies\
      \ that enforce a minimum password length of\n14 characters.\nWITH PWDS_WITH_MIN_LEN AS (\n SELECT ID\n FROM SNOWFLAKE.ACCOUNT_USAGE.PASSWORD_POLICIES\n\
      \ WHERE PASSWORD_MIN_LENGTH >= 14\n AND DELETED IS NULL\n)\nSELECT A.*\nFROM SNOWFLAKE.ACCOUNT_USAGE.POLICY_REFERENCES\
      \ AS A\n LEFT JOIN PWDS_WITH_MIN_L"
- id: '1.6'
  title: Ensure that service accounts use key pair authentication
  scoring: scored
  profile:
  - Level 1
  description: Service account is an identity used by scripts, jobs, applications, pipelines, etc. to talk to Snowflake. It
    is also sometimes known as "application user", "service principal", "system account", or "daemon user". On the platform
    level Snowflake does not differentiate between Snowflake users created for and used by humans and Snowflake users created
    for and used by services. Password-based authentication used by humans can be augmented by a second factor (MFA), e.g.
    a hardware token, or a security code pushed to a mobile device. Services and automation cannot be easily configured to
    authenticate with a second factor. Instead, for such use cases, Snowflake supports using key pair authentication as a
    more secure alternative to password-based authentication. Note that password-based authentication for a service account
    can be enabled along with a key-based authentication. To ensure that only key-based authentication is enabled for a service
    account, the PASSWORD parameter for that Snowflake user must be set to null.
  rationale: 'Password-based authentication has a set of disadvantages that increase probability of a security incident, especially
    when used without MFA: • Passwords created by humans are generally more predictable and less random than keys generated
    by a computer. Consequently, passwords are easier to brute force both online (against a live service) or offline (against
    a hashed password database). • Passwords are usually transmitted over the network and can be leaked when the transmission
    channel is insecure or when an application is accidentally misconfigured to log passwords. • Passwords are easier to leak
    by writing them down on a sticky note attached to the back of a keyboard. • It is easier to trick (phish) a user into
    revealing their password to an unauthorized party. Using key-based authentication for service accounts helps with mitigating
    the aforementioned issues.'
  impact: Snowflake authentication for existing automation and services that use service accounts with password-based authentication
    will be broken if corresponding configuration is not updated before service accounts passwords are set to null.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/key-pair-auth.html
  page_start: 29
  audit_raw: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. If Snowflake service account users\
    \ are marked with ACCOUNT_TYPE=service tag,\nthen all non-compliant service account users that either have a password\
    \ or do\nnot have key authentication enabled can be identified with the following query:\n-- The query assumes that service\
    \ accounts are tagged with\nACCOUNT_TYPE=service tag.\nselect tr.object_name\nfrom snowflake.account_usage.tag_references\
    \ tr\nleft join snowflake.account_usage.users u on tr.object_name = u.name\nwhere tr.tag_name = 'ACCOUNT_TYPE'\n and tr.tag_value\
    \ = 'service'\n and tr.domain = 'USER'\n and u.deleted_on is null\n and (u.has_password = true OR has_rsa_public_key =\
    \ false);\n2. Ensure that the query above does not return any results.\nRequired privileges:\nThe query requires the following\
    \ privileges:\n• Database role snowflake.security_viewer.\n• Database role snowflake.governance_viewer."
  remediation: "Programmatically:\nFor every non-compliant service account:\n1. Follow the Configuring Key Pair Authentication\
    \ instructions to generate the key\n<rsa_public_key>.\n2. In a Snowsight worksheet or through the SnowSQL CLI, run the\
    \ following\ncommand:\nALTER USER <service_account_name>\n SET RSA_PUBLIC_KEY='<rsa_public_key>';\n3. Update configuration\
    \ of the automation and services that rely on the service\naccount to use key-based authentication. This is going to be\
    \ specific to the\nservice in question.\n4. Disable password-based authentication:\nALTER USER <service_account_name>\
    \ SET PASSWORD = null;"
  checks:
  - type: sql
    command: select tr.object_name
    severity: medium
    info: 'Programmatically:

      In a Snowsight worksheet or through the SnowSQL CLI:

      1. If Snowflake service account users are marked with ACCOUNT_TYPE=service tag,

      then all non-compliant service account users that either have a password or do

      not have key authentication enabled can be identified with the following query:

      -- The query assumes that service accounts are tagged with

      ACCOUNT_TYPE=service tag.

      selec'
- id: '1.7'
  title: Ensure authentication key pairs are rotated every 180 days
  scoring: scored
  profile:
  - Level 1
  description: Snowflake supports using RSA key pair authentication as an alternative to password authentication and as a
    primary way to authenticate service accounts. Authentication key pair rotation is a process of replacing an existing authentication
    key pair with a freshly generated key pair. Snowflake supports two active authentication key pairs to allow for uninterrupted
    key rotation. Rotate and replace your authentication key pairs based on the expiration schedule at least once every 180
    days.
  rationale: Periodic authentication key pair rotation mitigates the threat of compromised or leaked keys. It reduces the
    window of opportunity during which a given key is valid and can be used by a threat actor.
  impact: Existing automation and services that rely on key pair authentication may break if they are not updated to use a
    new authentication key before the old key is inactivated.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/key-pair-auth.html#configuring-keypair-rotation
  page_start: 32
  audit_raw: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Parse the account query history\
    \ and output all users and key pair names for key\npairs that were set more than 180 days ago.\nWITH FILTERED_QUERY_HISTORY\
    \ AS (\n -- Extract necessary fields and apply initial filters\n SELECT END_TIME AS SET_TIME,\n UPPER(REGEXP_SUBSTR(QUERY_TEXT,\
    \ 'USER\\\\s+\"?([\\\\w]+)\"?', 1, 1,\n'i', 1)) AS PROCESSED_USERNAME,\n QUERY_TEXT\n FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY\n\
    \ WHERE EXECUTION_STATUS = 'SUCCESS'\n AND QUERY_TYPE IN ('ALTER_USER', 'CREATE_USER')\n AND TO_DATE(SET_TIME) < DATEADD(day,\
    \ -180, CURRENT_DATE())\n AND (QUERY_TEXT ILIKE '%rsa_public_key%' OR QUERY_TEXT ILIKE\n'%rsa_public_key_2%')\n),\nEXTRACTED_KEYS\
    \ AS (\n SELECT SET_TIME,\n PROCESSED_USERNAME,\n CASE\n WHEN POSITION('rsa_public_key' IN LOWER(QUERY_TEXT)) > 0\nTHEN\
    \ 'rsa_public_key'\n WHEN POSITION('rsa_public_key_2' IN LOWER(QUERY_TEXT)) > 0\nTHEN 'rsa_public_key_2'\n ELSE NULL\n\
    \ END AS RSA_KEY_NAME\n FROM FILTERED_QUERY_HISTORY\n WHERE POSITION('rsa_public_key' IN LOWER(QUERY_TEXT)) > 0 OR\nPOSITION('rsa_public_key_2'\
    \ IN LOWER(QUERY_TEXT)) > 0\n),\nRECENT_KEYS AS (\n SELECT EK.SET_TIME,\n EK.PROCESSED_USERNAME AS USERNAME,\n EK.RSA_KEY_NAME\
    \ AS RSA_PUBLIC_KEY,\n ROW_NUMBER() OVER (PARTITION BY ek.processed_username,\nek.rsa_key_name ORDER BY ek.set_time DESC)\
    \ AS rnum\n FROM EXTRACTED_KEYS EK\n INNER JOIN SNOWFLAKE.ACCOUNT_USAGE.USERS AU ON\nEK.PROCESSED_USERNAME = AU.NAME\n\
    \ WHERE AU.DELETED_ON IS NULL\n AND AU.DISABLED = FALSE\n AND EK.RSA_KEY_NAME IS NOT NULL\n)\n-- Select the most recent\
    \ RSA key name for each user\nSELECT SET_TIME,\n USERNAME,\n RSA_PUBLIC_KEY\nFROM RECENT_KEYS\nWHERE RNUM = 1;\n2. Ensure\
    \ that the query above does not return any results.\nNote: This query above is limited by the query history length that\
    \ goes back to 360 days\nonly. Key pairs set more than 360 days ago will not be surfaced by this query.\nRequired privileges:\n\
    To run the query above, the caller needs the:\n• The SECURITY_VIEWER role on the Snowflake database.\n• The GOVERNANCE_VIEWER\
    \ role on the Snowflake database."
  remediation: 'Programmatically:

    In a Snowsight worksheet or through the SnowSQL CLI:

    1. For every Snowflake service account whose authentication key pair age is >=

    180 days, generate a new RSA authentication keypair.

    2. Update either RSA_PUBLIC_KEY and RSA_PUBLIC_KEY_2 properties of a user,

    whichever is currently unset.

    ALTER USER <username> SET RSA_PUBLIC_KEY_2=''JERUEHtcve...'';

    3. Identify all services and automation that authenticate using existing keypair and

    update them to authenticate using freshly generated keypair.

    4. Unset either RSA_PUBLIC_KEY or RSA_PUBLIC_KEY_2 properties of a user,

    whichever is assigned the old public key.

    ALTER USER <username> UNSET RSA_PUBLIC_KEY;

    For more information, see Configuring Key Pair Rotation.'
  checks:
  - type: manual_review
    info: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Parse the account query history and\
      \ output all users and key pair names for key\npairs that were set more than 180 days ago.\nWITH FILTERED_QUERY_HISTORY\
      \ AS (\n -- Extract necessary fields and apply initial filters\n SELECT END_TIME AS SET_TIME,\n UPPER(REGEXP_SUBSTR(QUERY_TEXT,\
      \ 'USER\\\\s+\"?([\\\\w]+)\"?', 1, 1,\n'i', 1)) AS PROCESSED_USERNAME,\n QUERY_TEXT\n FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY\n\
      \ WHERE EXECUTION_STATUS = 'SUCCES"
    severity: medium
- id: '1.8'
  title: Ensure that users who did not log in for 90 days are disabled
  scoring: scored
  profile:
  - Level 1
  description: Access grants tend to accumulate over time unless explicitly set to expire. Regularly revoking unused access
    grants and disabling inactive user accounts is a good countermeasure to this dynamic. If credentials of an inactive user
    account are leaked or stolen, it may take longer to discover the compromise. In Snowflake an user account can be disabled
    by users with the ACCOUNTADMIN role. A session begins when a user connects to Snowflake and authenticates successfully
    using a Snowflake programmatic client, Snowsight, or the classic web interface. A session is maintained indefinitely with
    continued user activity. After a period of inactivity in the session, known as the idle session timeout, the user must
    authenticate to Snowflake again. Session policies can be used to modify the idle session timeout period. The idle session
    timeout has a maximum value of four hours.
  rationale: Disabling inactive user accounts supports the principle of least privilege and generally reduces attack surface.
    Tightening up the idle session timeout reduces sensitive data exposure risk when users forget to sign out of Snowflake
    and an unauthorized person gains access to their device.
  impact: There is a chance of disabling users or service accounts that are used consistently, but very infrequently, e.g.
    once or twice a year. Such users should be tagged and filtered out in the audit query. Too short idle session timeout
    may result in poor user experience due to users continuously being logged out of their accounts.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/admin-usermanagement.html#disabling-enabling-a-user
  - 1. https://docs.snowflake.com/en/user-guide/session-policies
  - 2. https://docs.snowflake.com/en/user-guide/session-policies#step-3-create-a-newsession-policy
  page_start: 35
