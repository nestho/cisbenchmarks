- id: '1.10'
  title: Limit the number of users with ACCOUNTADMIN and SECURITYADMIN
  scoring: scored
  profile:
  - Level 1
  description: By default, ACCOUNTADMIN is the most powerful role in a Snowflake account. Users with the SECURITYADMIN role
    grant can trivially escalate their privileges to that of ACCOUNTADMIN. Following the principle of least privilege that
    prescribes limiting user's privileges to those that are strictly required to do their jobs, the ACCOUNTADMIN and SECURITYADMIN
    roles should be assigned to a limited number of designated users (e.g., less than 10, but at least 2 to ensure that access
    can be recovered if one ACCOUNTAMIN user is having login difficulties).
  rationale: While it is important to apply the principle of least privilege to all access grants, it is especially important
    to apply it to highly privileged roles. Examples of such roles are ACCOUNTADMIN, SECURITYADMIN and their equivalents.
    The fewer users with full administrator privileges, the smaller the attack surface and the probability of a full account
    compromise.
  impact: Users who lose the ACCOUNTADMIN or SECURITYADMIN role grant and are not granted a more scoped down role appropriate
    to their job function may lose certain privileges required to do their job.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/security-access-controlconsiderations.html
  page_start: 42
  audit_raw: "From the UI:\n1. Go to https://app.snowflake.com/ and sign into your Snowflake account.\n2. On the left side\
    \ navigation bar, click on Admin.\n3. Under Admin, click on Users & Roles.\n4. Ensure that a limited number of users have\
    \ the ACCOUNTADMIN or SECURITYADMIN\nroles.\nProgrammatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n\
    1. List all the users granted the ACCOUNTADMIN or SECURITYADMIN roles:\nSELECT DISTINCT A.GRANTEE_NAME AS NAME,\n A.ROLE\n\
    FROM SNOWFLAKE.ACCOUNT_USAGE.GRANTS_TO_USERS AS A\n LEFT JOIN SNOWFLAKE.ACCOUNT_USAGE.USERS AS B ON A.GRANTEE_NAME =\n\
    B.NAME\nWHERE A.ROLE IN ('ACCOUNTADMIN', 'SECURITYADMIN')\n AND A.DELETED_ON IS NULL\n AND B.DELETED_ON IS NULL\n AND\
    \ NOT B.DISABLED\nORDER BY A.ROLE;\n2. Ensure that the query above returns a small number of users (e.g., less than 10).\n\
    To ensure that access is not being lost, the number of account users should be\nat least 2.\nPrivileges required:\nTo\
    \ be able to execute the query above, the caller must have the role SECURITY_VIEWER\non the Snowflake databases."
  remediation: 'Programmatically:

    In a Snowsight worksheet or through the SnowSQL CLI:

    1. For each user <username> that does not need all the privileges a role provides to

    fulfill their job responsibilities, revoke the ACCOUNTADMIN or all equivalently

    privileged roles.

    REVOKE ROLE ACCOUNTADMIN FROM USER <username>

    2. For each user <username> that does not need all the privileges a role provides to

    fulfill their job responsibilities, revoke the SECURITYADMIN or all equivalently

    privileged roles.

    REVOKE ROLE SECURITYADMIN FROM USER <username>'
  checks:
  - type: manual_review
    info: "From the UI:\n1. Go to https://app.snowflake.com/ and sign into your Snowflake account.\n2. On the left side navigation\
      \ bar, click on Admin.\n3. Under Admin, click on Users & Roles.\n4. Ensure that a limited number of users have the ACCOUNTADMIN\
      \ or SECURITYADMIN\nroles.\nProgrammatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. List all the\
      \ users granted the ACCOUNTADMIN or SECURITYADMIN roles:\nSELECT DISTINCT A.GRANTEE_NAME AS NAME,\n A.ROLE\nFROM SNOWFLAKE.ACCOUNT_USAGE.GRANTS_TO_USERS"
    severity: medium
- id: '1.11'
  title: Ensure that all users granted the ACCOUNTADMIN role have an email address assigned
  scoring: scored
  profile:
  - Level 1
  description: Every Snowflake user can be assigned an email address. The email addresses are then used by Snowflake features
    like notification integration, resource monitor and support cases to deliver email notifications to Snowflake users. In
    trial Snowflake accounts these email addresses are used for password reset functionality. The email addresses assigned
    to ACCOUNTADMIN users are used by Snowflake to notify administrators about important events related to their accounts.
    For example, ACCOUNTADMIN users are notified about impending expiration of SAML2 certificates or SCIM access tokens.
  rationale: If users with the ACCOUNTADMIN role are not assigned working email addresses that are being monitored and if
    SAML2 certificate used in SSO integration is not proactively renewed, expiration of SAML2 certificate may break the SSO
    authentication flow. Similarly, uncaught expiration of SCIM access token may break the SCIM integration. Additionally,
    emails assigned to ACCOUNTADMIN users can be used by Snowflake Support to contact account administrators in urgent situations.
  impact: None.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/admin-usermanagement.html#resetting-the-password-for-an-administrator
  page_start: 45
  audit_raw: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. List users with no email address\
    \ set:\nSELECT DISTINCT a.grantee_name as name, b.email\nFROM snowflake.account_usage.grants_to_users AS a\nLEFT JOIN\
    \ snowflake.account_usage.users AS b\n ON a.grantee_name = b.name\nWHERE a.role = 'ACCOUNTADMIN'\n AND a.deleted_on IS\
    \ NULL\n AND b.email IS NULL\n AND b.deleted_on IS NULL\n AND NOT b.disabled;\n2. Ensure that the query above does not\
    \ return any results.\nRequired privileges:\nTo be able to execute the above audit query, the caller must have the SECURITY_VIEWER\n\
    role on the SNOWFLAKE database."
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. For every ACCOUNTADMIN user <username>\
    \ that does not have email assigned run\nthe following command to assign it:\nALTER USER <username>\n SET EMAIL = <email_address>;"
  checks:
  - type: sql
    command: SELECT DISTINCT a.grantee_name as name, b.email
    severity: medium
    info: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. List users with no email address set:\n\
