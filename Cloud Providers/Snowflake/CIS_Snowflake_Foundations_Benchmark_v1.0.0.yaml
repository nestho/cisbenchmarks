- id: '1.12'
  title: Ensure that no users have ACCOUNTADMIN or SECURITYADMIN as the default role
  scoring: scored
  profile:
  - Level 1
  description: The ACCOUNTADMIN system role is the most powerful role in a Snowflake account and is intended for performing
    initial setup and managing account-level objects. SECURITYADMIN role can trivially escalate their privileges to that of
    ACCOUNTADMIN. Neither of these roles should be used for performing daily non-administrative tasks in a Snowflake account.
    Instead, users should be assigned custom roles containing only those privileges that are necessary for successfully completing
    their job responsibilities.
  rationale: When ACCOUNTADMIN is not set as a default user role, it forces account administrators to explicitly change their
    role to ACCOUNTADMIN each time they log in. This can help make account administrators aware of the purpose of roles in
    the system, prevent them from inadvertently using the ACCOUNTADMIN role for non-administrative tasks, and encourage them
    to change to the appropriate role for a given task. Same logic applies to the SECURITYADMIN role.
  impact: None.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/security-access-control-configure.html
  page_start: 48
  audit_raw: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. List users with ACCOUNTADMIN or\
    \ SECURITYADMIN as the default role:\nSELECT NAME, DEFAULT_ROLE\nFROM SNOWFLAKE.ACCOUNT_USAGE.USERS\nWHERE DEFAULT_ROLE\
    \ IN ('ACCOUNTADMIN', 'SECURITYADMIN')\n AND DELETED_ON IS NULL\n AND NOT DISABLED;\n2. Ensure that the query above does\
    \ not return any users.\nRequired privileges:\nRunning the query above requires the security_viewer role on the Snowflake\
    \ database"
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. For each user <user_name> who\
