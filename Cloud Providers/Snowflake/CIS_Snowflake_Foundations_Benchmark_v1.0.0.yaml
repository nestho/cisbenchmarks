    for their daily job responsibilities and run the following query:\nALTER USER <user_name>\n SET DEFAULT_ROLE = <job_appropriate_role>;\n\
    Note: You could also unset the default role, thus forcing users to explicitly\nassume a role every time they log in."
  checks:
  - type: sql
    command: SELECT NAME, DEFAULT_ROLE
    severity: medium
    info: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. List users with ACCOUNTADMIN or SECURITYADMIN\
