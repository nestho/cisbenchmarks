- id: '3.2'
  title: Ensure that user-level network policies have been configured for service accounts
  scoring: manual
  profile:
  - Level 1
  description: Network policies allow restricting access to a Snowflake account based on source IP addresses. A network policy
    can be configured either on the account level, for all users of the account, or on the user level, for a specific user.
    In the presence of both accountlevel and user-level policies, the user-level policies take precedence. A service account
    is a Snowflake user whose credentials are used by scripts, jobs, applications, pipelines, etc. to talk to Snowflake. Other
    names include "application user", "service principal", "system account", or "daemon user". Service account is not a Snowflake
    specific term.
  rationale: Network policies help mitigate the threat of leaked user credentials. If network policies are not configured
    limiting source IP addresses, leaked Snowflake credentials can be used from anywhere in the world. Service accounts often
    have direct access to raw sensitive data not appropriate for most human users. Service accounts are also generally deployed
    in production environments with source IP address ranges distinct from the IP address ranges used by the human users.
    To decrease the risk of inappropriate data access with service account credentials, user-level network policies can be
    applied to service accounts.
  impact: If a network policy is misconfigured to disallow IP addresses from which service accounts access Snowflake, it can
    cause a reliability impact. If a user with permissions to configure network policies on the account accidentally locks
    themselves and everybody else with such permission out, they will need to contact Snowflake customer support to restore
    access to their account.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/network-policies.html
  page_start: 91
  audit_raw: 'Programmatically:

    In a Snowsight worksheet or through the SnowSQL CLI:

    1. Get the list of users in the account.

    SELECT object_name

    FROM snowflake.account_usage.users

    WHERE domain = ''USER'' AND u.deleted_on IS NULL;

    2. Identify the users that are used to run tasks, also known as service accounts.

    3. For each service account <service_account_name>, check if there is a network

    policy associated with it:

    SHOW PARAMETERS LIKE ''NETWORK_POLICY'' FOR USER <service_account_name>;

    Note: The name of the network policy from the value field.

    4. Describe the policy. Replace <policy_name> in the query below with your network

    policy name from above:

    DESCRIBE NETWORK POLICY <policy_name>;

    5. Ensure that ALLOWED_IP_LIST is set for the network policy and that it contains

    only trusted IP address ranges.

    Required Privileges:

    To run the queries above, the caller needs:

    •

    OWNERSHIP privilege on every network policy in an account.

    •

    SECURITY_VIEWER role on the Snowflake database

    •

    GOVERNANCE_VIEWER role on the Snowflake database'
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL ALI:\n1. Create a network policy. Replace\
    \ <policy_name> with the name you want to give\nthe policy, and customize the list of allowed and blocked IP addresses:\n\
    CREATE NETWORK POLICY <policy_name> ALLOWED_IP_LIST=('192.168.1.0/24');\n2. For each service account user <service_account_name>,\
    \ set the desired network\npolicy <policy_name>:\nALTER USER <service_account_name>\n SET NETWORK_POLICY = <policy_name>;\n\
    For more information, see the documentation on creating network policies.\nNote:\n• When a network policy includes values\
    \ for both ALLOWED_IP_LIST and\nBLOCKED_IP_LIST, Snowflake applies the blocked list first.\n• Do not add 0.0.0.0/0 to\
    \ BLOCKED_IP_LIST. Because Snowflake applies the\nblocked list first, this would block your own access. Additionally,\
    \ in order to block\nall IP addresses except a select list, you only need to add IP addresses to\nALLOWED_IP_LIST. Snowflake\
    \ automatically blocks all IP addresses not included\nin the allowed list."
  checks:
  - type: sql
    command: SELECT object_name
    severity: medium
    info: 'Programmatically:

      In a Snowsight worksheet or through the SnowSQL CLI:

      1. Get the list of users in the account.

      SELECT object_name

      FROM snowflake.account_usage.users

      WHERE domain = ''USER'' AND u.deleted_on IS NULL;

      2. Identify the users that are used to run tasks, also known as service accounts.

      3. For each service account <service_account_name>, check if there is a network

      policy associated with i'
- id: '4.1'
  title: Ensure yearly rekeying is enabled for a Snowflake account
  scoring: scored
  profile:
  - Level 2
  description: All Snowflake customer data is encrypted by default using the latest security standards and best practices.
    Snowflake uses strong AES 256-bit encryption with a hierarchical key model rooted in a hardware security module. All Snowflake-managed
    keys are automatically rotated when they are more than 30 days old. Furthermore, data can be automatically re-encrypted
    ("rekeyed") on a yearly basis. Data encryption and key rotation is entirely transparent and requires no configuration
    or management. Key rotation transitions an active encryption key to a retired state. Practically this means transitioning
    of the active encryption key from being used for encrypting new data and decrypting data encrypted with that key to only
    decrypting data encrypted with that key. Rekeying transitions a retired encryption key to being destroyed. Practically
    this means re-encryption of the data encrypted by a retired key with a new key and destroying the disposing of the retired
    key.
  rationale: Rekeying constrains the total duration in which a key is used for recipient usage, following NIST recommendations.
    Furthermore, when rekeying data, Snowflake can increase encryption key sizes and utilize better encryption algorithms
    that may be standardized since the previous key generation was created. Rekeying, therefore, ensures that all customer
    data, new and old, is encrypted with the latest security technology.
  impact: None.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/security-encryption-manage.html
  - 2. https://docs.snowflake.com/en/sql-reference/parameters.html#periodic-datarekeying
  page_start: 96
  audit_raw: 'Programmatically:

    In a Snowsight worksheet or from the SnowSQL CLI:

    1. List the value of the PERIODIC_DATA_REKEYING parameter:

    SHOW PARAMETERS LIKE ''PERIODIC_DATA_REKEYING'' IN ACCOUNT;

    2. Ensure that the parameter is set to true.'
  remediation: "Programmatically:\nSet parameter value to true:\nALTER ACCOUNT\n SET PERIODIC_DATA_REKEYING=true;"
  checks:
  - type: sql
    command: SHOW PARAMETERS LIKE 'PERIODIC_DATA_REKEYING' IN ACCOUNT;
    severity: medium
    info: 'Programmatically:

      In a Snowsight worksheet or from the SnowSQL CLI:

      1. List the value of the PERIODIC_DATA_REKEYING parameter:

      SHOW PARAMETERS LIKE ''PERIODIC_DATA_REKEYING'' IN ACCOUNT;

      2. Ensure that the parameter is set to true.'
- id: '4.2'
  title: Ensure AES encryption key size used to encrypt files stored in internal stages is set to 256 bits
  scoring: scored
  profile:
  - Level 1
  description: All ingested data stored in Snowflake tables is encrypted using 256-bit long AES encryption keys. However,
    data uploaded to internal stages is by default encrypted with 128-bit long AES encryption keys.
  rationale: The field of cryptanalysis is continuously advancing and new vulnerabilities and attacks are discovered that
    obsolete cryptographic primitives that once were considered secure. The 128-bit long AES encryption keys are still considered
    secure today and there are no strong reasons to believe this will change soon. Usage of the 256-bit long AES encryption
    keys today is generally recommended out of an abundance of caution.
  impact: None.
  references:
  - 1. https://docs.snowflake.com/en/sql-reference/parameters#client-encryption-keysize
  page_start: 98
  audit_raw: 'Programmatically:

    In a Snowsight worksheet or using the SnowSQL CLI:

    1. Check length of the AES encryption keys used to encrypt data uploaded to

    internal stages:

    SHOW PARAMETERS LIKE ''CLIENT_ENCRYPTION_KEY_SIZE'' IN ACCOUNT;

    2. Ensure that value is set to 256.'
  remediation: "Programmatically:\nTo set the length of the AES encryption keys used to encrypt data uploaded to internal\n\
    stages, run the following command:\nALTER ACCOUNT\n SET CLIENT_ENCRYPTION_KEY_SIZE=256;"
  checks:
  - type: sql
    command: SHOW PARAMETERS LIKE 'CLIENT_ENCRYPTION_KEY_SIZE' IN ACCOUNT;
    severity: medium
    info: 'Programmatically:

      In a Snowsight worksheet or using the SnowSQL CLI:

      1. Check length of the AES encryption keys used to encrypt data uploaded to

      internal stages:

      SHOW PARAMETERS LIKE ''CLIENT_ENCRYPTION_KEY_SIZE'' IN ACCOUNT;

      2. Ensure that value is set to 256.'
- id: '4.3'
  title: Ensure that the DATA_RETENTION_TIME_IN_DAYS parameter is set to 90 for critical data
  scoring: manual
  profile:
  - Level 2
  description: Snowflake Time Travel enables accessing historical data (i.e., data that has been changed or deleted) at any
    point within a defined period. It relies on configuring a data retention period for your critical data assets. The DATA_RETENTION_TIME_IN_DAYS
    object parameter is used to set data retention period on the account, database, schema, or table level. When the MIN_DATA_RETENTION_TIME_IN_DAYS
    parameter is set at the account level, the effective minimum data retention period for an object is determined by MAX(DATA_RETENTION_TIME_IN_DAYS,
    MIN_DATA_RETENTION_TIME_IN_DAYS).
  rationale: Time Travel can be used to recover critical data that was maliciously destroyed or encrypted by ransomware.
  impact: Data retention requires additional storage which will be reflected in the monthly storage charges. For more information
    about storage charges, see Storage Costs for Time Travel and Fail-safe.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/data-time-travel.html
  - 2. https://docs.snowflake.com/en/user-guide/data-cdp-storage-costs.html
  page_start: 100
  audit_raw: "Programmatically:\nFrom a Snowsight worksheet or from the SnowSQL CLI:\n1. For each table <table_name>, list\
    \ the DATA_RETENTION_TIME_IN_DAYS value:\nSHOW PARAMETERS\n LIKE 'DATA_RETENTION_TIME_IN_DAYS'\nIN TABLE <table_name>;\n\
    2. Ensure that the parameter value is set to 90."
  remediation: "An organization's compliance, legal and privacy groups may have important inputs on\nhow long certain data\
    \ should and can be retained for. For example, in the context of\nGDPR. It is important to take those inputs into account\
    \ when data retention periods are\ndetermined for critical data.\nProgrammatically:\nFor every non-compliant table with\
    \ critical data set the retention period to 90 days:\nALTER TABLE <table_name>\n SET DATA_RETENTION_TIME_IN_DAYS=90;\n\
    If all tables within a given schema or database contain critical data, the data retention\nperiod can be set on the schema\
    \ or database level correspondingly."
  checks:
  - type: sql
    command: SHOW PARAMETERS
    severity: medium
    info: "Programmatically:\nFrom a Snowsight worksheet or from the SnowSQL CLI:\n1. For each table <table_name>, list the\
      \ DATA_RETENTION_TIME_IN_DAYS value:\nSHOW PARAMETERS\n LIKE 'DATA_RETENTION_TIME_IN_DAYS'\nIN TABLE <table_name>;\n\
      2. Ensure that the parameter value is set to 90."
- id: '4.4'
  title: Ensure that the MIN_DATA_RETENTION_TIME_IN_DAYS account parameter is set to 7 or higher
