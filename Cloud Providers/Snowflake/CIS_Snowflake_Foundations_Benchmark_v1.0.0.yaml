    Note: To avoid disruption of existing workflow relying on creation of external stages not\nreferencing a storage integration,\
    \ all such workflows should be identified and migrated\nto creation of external stages referencing storage integrations.\n\
    Programmatically:\nSet the REQUIRE_STORAGE_INTEGRATION_FOR_STAGE_OPERATION on the account level to\ntrue:\nALTER ACCOUNT\n\
    \ SET REQUIRE_STORAGE_INTEGRATION_FOR_STAGE_OPERATION=true;\nNOTE:\nTo avoid disruption of existing workflow relying on\
    \ external stages not referencing a\nstorage integration, all such workflows should be identified and migrated to external\n\
    stages referencing storage integrations."
  checks:
  - type: sql
    command: SHOW PARAMETERS LIKE 'MIN_DATA_RETENTION_TIME_IN_DAYS' IN ACCOUNT;
    severity: medium
    info: 'Programmatically:

      In a Snowsight worksheet or from the SnowSQL CLI:

