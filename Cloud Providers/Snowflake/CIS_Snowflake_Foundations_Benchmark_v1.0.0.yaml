  - Level 1
  description: The MIN_DATA_RETENTION_TIME_IN_DAYS account parameter can be set by users with the ACCOUNTADMIN role to set
    a minimum retention period for the account. This parameter does not alter or replace the DATA_RETENTION_TIME_IN_DAYS parameter
    value. However it may change the effective data retention time. When this parameter is set at the account level, the effective
    minimum data retention period for an object is determined by MAX(DATA_RETENTION_TIME_IN_DAYS, MIN_DATA_RETENTION_TIME_IN_DAYS).
    Ensure that creating an external stage to access a private cloud storage location requires referencing a storage integration
    object as cloud credentials. Ensure that loading data from or unloading data to a private cloud storage location requires
    using a named external stage that references a storage integration object. If this parameter is not set, then users can
    specify the explicit cloud provider credentials directly in the COPY statement.
  rationale: Setting the MIN_DATA_RETENTION_TIME_IN_DAYS to 7 helps restore data-related objects (tables, schemas, and databases)
    that might have been accidentally or intentionally deleted. Using storage integration removes the need to supply credentials
    when creating external stages or when loading or unloading data. This reduces the risk of those credentials being leaked
    and data compromised. Requiring a storage integration when creating a new stage reduces the risk or data exfiltration
    by accidentally exporting sensitive data to an external stage that does not have the appropriate network security, access
    control, or encryption security and is not approved by the organization’s security team. Using storage integration removes
    the need to supply credentials when loading and unloading data from external stages or when loading or unloading data
    to a private cloud storage location. This reduces the risk of data exfiltration by accidentally exporting sensitive data
    to an external stage that does not have the appropriate network security, access control, or encryption security and is
    not approved by the organization’s security team.
  impact: Data retention requires additional storage which will be reflected in the monthly storage charges. For more information
    about storage charges, see Storage Costs for Time Travel and Fail-safe. Setting the REQUIRE_STORAGE_INTEGRATION_FOR_STAGE_CREATION
    account level parameter to true can break existing manual and automated flows relying on creation of external stages not
    backed by a storage integration. Setting the REQUIRE_STORAGE_INTEGRATION_FOR_STAGE_OPERATION account level parameter to
    true can break existing manual and automated flows relying on loading or unloading data to external stages not backed
    by a storage integration.
  references:
