- id: '2.1'
  title: Ensure monitoring and alerting exist for ACCOUNTADMIN and SECURITYADMIN role grants
  scoring: manual
  profile:
  - Level 1
  description: By default, ACCOUNTADMIN is the most powerful role in a Snowflake account and users with SECURITYADMIN role
    grant can trivially escalate their privileges to that of ACCOUNTADMIN. Following the principle of least privilege that
    prescribes limiting user's privileges to those that are strictly required to do their jobs, the ACCOUNTADMIN and SECURITYADMIN
    roles should be assigned to a limited number of designated users. Any new ACCOUNTADMIN and SECURITYADMIN role grants should
    be scrutinized.
  rationale: Every new ACCOUNTADMIN and SECURITYADMIN role assignment increases the attack surface of a Snowflake environment.
    It may also indicate unauthorized privilege escalation performed by a threat actor. If monitoring for ACCOUNTADMIN role
    assignments is not configured, inappropriate or unauthorized ACCOUNTADMIN role access grants may be missed. The latter
    can lead to eventual security posture degradation or late detection of an ongoing security incident. The same logic applies
    to the SECURITYADMIN role.
  impact: If the principle of least privilege is not strictly applied and ACCOUNTADMIN and SECURITYADMIN role assignments
    happen frequently, monitoring and alerting on this event may generate undue load on the detection and response team.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/ui-snowsight-activity.html
  - 2. https://docs.snowflake.com/en/user-guide/security-access-controlconsiderations.html
  page_start: 79
  audit_raw: 'Confirm that Trust Center, or your security monitoring and alerting solution is configured

    to generate alerts on new ACCOUNTADMIN and SECURITYADMIN role assignments.'
  remediation: 'Programmatically:

    In a Snowsight worksheet or through the SnowSQL CLI:

    1. Configure your monitoring task to alert on ACCOUNTADMIN and SECURITYADMIN

    role grants. You can find those grants with the following query:

    SELECT *

    FROM SNOWFLAKE.ACCOUNT_USAGE.GRANTS_TO_ROLES

    WHERE NAME IN (''ACCOUNTADMIN'', ''SECURITYADMIN'');'
  checks:
  - type: manual_review
    info: 'Confirm that Trust Center, or your security monitoring and alerting solution is configured

      to generate alerts on new ACCOUNTADMIN and SECURITYADMIN role assignments.'
    severity: medium
- id: '2.2'
  title: Ensure monitoring and alerting exist for MANAGE GRANTS privilege grants
  scoring: manual
  profile:
  - Level 1
  description: The MANAGE GRANTS privilege is one of the most powerful privileges in the Snowflake environment. This privilege
    gives the ability to grant or revoke privileges on any object as if the invoking role were the owner of the object. A
    custom role with the MANAGE GRANTS privilege on account level will not be able to grant privileges on the account level
    as that privilege is implicitly reserved for the ACCOUNTADMIN and SECURITYADMIN roles. However, such custom roles will
    be able to grant any privileges on any objects below the account level. Following the principle of least privilege and
    given how powerful the MANAGE GRANTS privilege is, any new MANAGE GRANTS privilege grants should be scrutinized.
  rationale: Every new role granted the MANAGE GRANTS privilege increases the attack surface of a Snowflake environment. It
    may also indicate unauthorized privilege escalation performed by a threat actor. If monitoring for MANAGE GRANTS privilege
    grants is not configured, inappropriate or unauthorized MANAGE GRANTS privilege grants may be missed. The latter can lead
    to eventual security posture degradation or late detection of an ongoing security incident.
  impact: If MANAGE GRANTS privilege grants happen frequently, monitoring and alerting on this event may generate undue load
    on the detection and response team.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/ui-snowsight-activity.html
  - 2. https://docs.snowflake.com/en/user-guide/security-access-control-privileges.html
  page_start: 81
  audit_raw: 'Confirm that Trust Center, or your security monitoring and alerting solution is configured

    to generate alerts on new MANAGE GRANTS privilege grants.'
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Configure your monitoring task\
    \ to alert on manage grants privilege grants. Note\nthat this query will return grants even if they have since been revoked,\
    \ as these\nmay still be worth investigating.\n set last_scan_time = '<last scan time>';\n select\n grantee_name as role_name,\n\
    \ granted_by,\n created_on,\n deleted_on\n from snowflake.account_usage.grants_to_roles\n where privilege = 'MANAGE GRANTS'\n\
    \ and created_on > $last_scan_time\n order by created_on desc;"
  checks:
  - type: manual_review
    info: 'Confirm that Trust Center, or your security monitoring and alerting solution is configured

      to generate alerts on new MANAGE GRANTS privilege grants.'
    severity: medium
- id: '2.3'
  title: Ensure monitoring and alerting exist for password sign-in without MFA
  scoring: manual
  profile:
  - Level 1
  description: Multi-factor authentication (MFA) is a security control used to add an additional layer of login security.
    It works by requiring the user to present two or more proofs (factors) of user identity. An MFA example would be requiring
    a password and a verification code delivered to the user's phone during user sign-in. Snowflake offers several forms of
    MFA, including passkeys, authenticator apps, and Duo.
  rationale: MFA mitigates security threats of users creating weak passwords and user passwords being stolen or accidentally
    leaked.
  impact: If password sign-in events without MFA happen frequently, monitoring and alerting on this event may generate undue
    load on the detection and response team.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/security-access-control-configure.html
  - 2. https://docs.snowflake.com/en/user-guide/security-mfa.html
  page_start: 83
  audit_raw: 'Confirm that Trust Center, or your security monitoring and alerting solution is configured

    to generate alerts on new password sign-in without MFA events.'
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Configure your security monitoring\
    \ solution to alert on password sign-ins without\nMFA. The following query can be run periodically.\nselect event_timestamp,\n\
    \ user_name,\n client_ip,\n reported_client_type,\n reported_client_version,\n first_authentication_factor,\n second_authentication_factor\n\
    from snowflake.account_usage.login_history\nwhere first_authentication_factor = 'PASSWORD'\n and second_authentication_factor\
    \ is null\norder by event_timestamp desc;"
  checks:
  - type: manual_review
    info: 'Confirm that Trust Center, or your security monitoring and alerting solution is configured

      to generate alerts on new password sign-in without MFA events.'
    severity: medium
- id: '2.4'
  title: Ensure monitoring and alerting exist for creation, update and deletion of security integrations
  scoring: manual
  profile:
  - Level 1
  description: Security integration object is used to configure SSO and SCIM integrations.
  rationale: Creation of an unauthorized security integration, in case of SCIM, can lead to creation of rogue Snowflake users.
    Incase of SSO, it can lead to hijacking of existing Snowflake users through rogue authentication flow. Update or deletion
    of an existing security integration can lead to weakening security posture of that integration or denial of service, e.g.
    when users cannot sign into Snowflake accounts due to broken SSO authentication flow.
  impact: If security integration creation, update and deletion events happen frequently, monitoring and alerting on this
    event may generate undue load on the detection and response team.
  references:
  - 1. https://docs.snowflake.com/en/sql-reference/sql/create-security-integration.html
  - 2. https://docs.snowflake.com/en/user-guide/ui-snowsight-activity.html
  page_start: 85
  audit_raw: 'Confirm that Trust Center, or your security monitoring and alerting solution is configured

    to generate alerts on new security integration creation, update and deletion events.'
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Configure your security monitoring\
    \ solution to alert on creation, update and\ndeletion of security integrations.\nselect end_time,\n query_type,\n query_text,\n\
    \ user_name,\n role_name\nfrom snowflake.account_usage.query_history\nwhere execution_status = 'SUCCESS'\n and query_type\
    \ in ('CREATE', 'ALTER', 'DROP')\n and query_text ilike '%security integration%'\norder by end_time desc;"
  checks:
  - type: manual_review
    info: 'Confirm that Trust Center, or your security monitoring and alerting solution is configured

      to generate alerts on new security integration creation, update and deletion events.'
    severity: medium
- id: '2.5'
  title: Ensure monitoring and alerting exist for changes to network policies and associated objects
  scoring: manual
  profile:
  - Level 1
  description: Network policies allow restricting access to a Snowflake account based on source IP addresses. A network policy
    can be configured either on the account level, for all users of the account, or on the user level, for a specific user.
    In the presence of both accountlevel and user-level policies the latter takes precedence. A network policy can also be
    configured on the SCIM and Snowflake OAuth security integrations to restrict the list of source IP addresses allowed when
    exchanging an authorization code for an access or refresh token and when using a refresh token to obtain a new access
    token. If network policy is not set on the security integration of the aforementioned types, the account-level network
    policy, if any, is used.
  rationale: Creation and application of unauthorized network policies can weaken access control through expansion of the
    allowed source IP addresses, or lead to a denial of service through blocklisting legitimate source IP addresses. Unauthorized
    changes and deletions of existing network policies can lead to the same undesirable results.
  impact: If network policy creation, update, deletion and object association events happen frequently, monitoring and alerting
    on this event may generate undue load on the detection and response team.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/network-policies.html
  - 2. https://docs.snowflake.com/en/sql-reference/sql/create-security-integrationoauth-snowflake.html
  page_start: 87
  audit_raw: 'Confirm that Trust Center, or your security monitoring and alerting solution is configured

    to generate alerts on new network policy creation, update and deletion events.'
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Configure your security monitoring\
    \ solution to alert on changes to network\npolicies.\nselect end_time,\n query_type,\n query_text,\n user_name,\n role_name\n\
    from snowflake.account_usage.query_history\nwhere execution_status = 'SUCCESS'\n and (\n query_type in ('CREATE_NETWORK_POLICY',\
    \ 'ALTER_NETWORK_POLICY',\n 'DROP_NETWORK_POLICY')\n or (query_text ilike '%set%network_policy%'\n or query_text ilike\
    \ '%unset%network_policy%')\n)\norder by end_time desc;"
  checks:
  - type: manual_review
    info: 'Confirm that Trust Center, or your security monitoring and alerting solution is configured

      to generate alerts on new network policy creation, update and deletion events.'
    severity: medium
- id: '2.6'
  title: Ensure monitoring and alerting exist for SCIM token creation
  scoring: manual
  profile:
  - Level 1
  description: The System for Cross-domain Identity Management (SCIM) is an open specification designed to help facilitate
    the automated management of user identities and groups (i.e. roles) in cloud applications using RESTful APIs. Snowflake
    supports SCIM 2.0 integration with Okta, Microsoft Azure AD and custom identity providers. Users and groups from the identity
    provider can be provisioned into Snowflake, which functions as the service provider. SCIM access token is a bearer token
    used by SCIM clients to authenticate to Snowflake SCIM server.
  rationale: SCIM access tokens generated without proper authorization may be used for configuring rogue SCIM integrations.
    Such SCIM integrations can then be used for provisioning rogue users that through existing roles are granted unauthorized
    access to Snowflake data and other objects.
  impact: If SCIM access token creation events happen frequently, monitoring and alerting on this event may generate undue
    load on the detection and response team. That said, a SCIM access token is valid for 6 months and there is usually only
    one SCIM integration per account. Frequent SCIM access token creation would likely be an unusual event.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/scim-intro.html#scim-overview
  - 2. https://docs.snowflake.com/en/user-guide/scim-custom.html#create-a-customscim-security-integration-and-api-token
  page_start: 90
  audit_raw: 'Confirm that Trust Center, or your security monitoring and alerting solution is configured

    to generate alerts on new security SCIM access token events.'
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Configure your security monitoring\
    \ solution to alert on SCIM token creation. The\nfollowing query can be run periodically.\nselect end_time,\n query_type,\n\
    \ query_text,\n user_name,\n role_name\nfrom snowflake.account_usage.query_history\nwhere execution_status = 'SUCCESS'\n\
    \ and query_type = 'SELECT'\n and regexp_instr(query_text,\n'system\\\\$generate_scim_access_token\\\\s*\\\\(', 1, 1,\
    \ 0, 'i') > 0\norder by end_time desc;"
  checks:
  - type: manual_review
    info: 'Confirm that Trust Center, or your security monitoring and alerting solution is configured

      to generate alerts on new security SCIM access token events.'
    severity: medium
- id: '2.7'
  title: Ensure monitoring and alerting exists for new share exposures
  scoring: manual
  profile:
  - Level 1
  description: Snowflake tables, views and UDFs can be shared across Snowflake accounts using share objects created by data
    providers and imported by data consumers. To expose a share to another account, the share provider account needs to add
    or set consumer accounts on a share using the ALTER SHARE command. The consumer account can then import the share using
    the CREATE DATABASE FROM SHARE command.
  rationale: A share exposed to another Snowflake account can be used for data exfiltration.
  impact: If exposing shares to another account event happens frequently, monitoring and alerting on this event may generate
    undue load on the detection and response team.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/data-sharing-intro
  - 2. https://docs.snowflake.com/en/sql-reference/sql/alter-share
  page_start: 92
  audit_raw: 'Confirm that Trust Center, or your security monitoring and alerting solution is configured

    to generate alerts on new share exposures.'
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Configure your security monitoring\
    \ solution to alert on new share exposures. The\nfollowing query can be run periodically.\nselect end_time,\n query_type,\n\
    \ query_text,\n user_name,\n role_name\nfrom snowflake.account_usage.query_history\nwhere execution_status = 'SUCCESS'\n\
    \ and query_type = 'ALTER'\n and regexp_instr(query_text,\n'^alter\\\\s*share.*(add|set)\\\\s*accounts\\\\s*=', 1, 1,\
    \ 0, 'is') > 0\norder by end_time desc;"
  checks:
  - type: manual_review
    info: 'Confirm that Trust Center, or your security monitoring and alerting solution is configured

