      1. List all the users granted the ACCOUNTADMIN or SECURITYADMIN roles:\nSELECT DISTINCT A.GRANTEE_NAME AS NAME,\n A.ROLE\n\
      FROM SNOWFLAKE.ACCOUNT_USAGE.GRANTS_T"
    severity: medium
- id: '1.11'
  title: Ensure that all users granted the ACCOUNTADMIN role have a verified email address assigned
  scoring: scored
  profile:
  - Level 1
  description: Every Snowflake user can be assigned an email address. The email addresses are then used by Snowflake features
    like notification integration, resource monitor and support cases to deliver email notifications to Snowflake users. In
    trial Snowflake accounts these email addresses are used for password reset functionality. The email addresses assigned
    to ACCOUNTADMIN users are used by Snowflake to notify administrators about important events related to their accounts.
    For example, ACCOUNTADMIN users are notified about impending expiration of SAML2 certificates or SCIM access tokens. Email
    addresses must be verified before Snowflake will send notifications to the email address.
  rationale: If users with the ACCOUNTADMIN role are not assigned working email addresses that are being monitored and if
    SAML2 certificate used in SSO integration is not proactively renewed, expiration of SAML2 certificate may break the SSO
    authentication flow. Similarly, uncaught expiration of SCIM access token may break the SCIM integration. Additionally,
    emails assigned to ACCOUNTADMIN users can be used by Snowflake Support to contact account administrators in urgent situations.
  impact: None.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/admin-usermanagement.html#resetting-the-password-for-an-administrator
  page_start: 49
  audit_raw: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. List users with no email address\
    \ set:\nSELECT DISTINCT a.grantee_name as name, b.email is not null as\nhas_email\nFROM snowflake.account_usage.grants_to_users\
    \ AS a\nLEFT JOIN snowflake.account_usage.users AS b\n ON a.grantee_name = b.name\nWHERE a.role = 'ACCOUNTADMIN'\n AND\
    \ a.deleted_on IS NULL\n AND b.deleted_on IS NULL\n AND NOT b.disabled;\n2. Ensure that the query above does not return\
    \ any results where has_email is\nfalse.\n3. For each user with has_email set to true, describe the user:\n DESCRIBE USER\
    \ <user_name>;\n4. Ensure that the value of IS_EMAIL_VERIFIED is true.\nRequired privileges:\nTo be able to execute the\
    \ above audit query, the caller must have the\nSECURITY_VIEWER role on the SNOWFLAKE database."
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. For every ACCOUNTADMIN user <username>\
    \ that does not have email assigned\nrun the following command to assign it:\nALTER USER <username>\n SET EMAIL = <email_address>;\n\
    2. Start email verification for each ACCOUNTADMIN user <username>. Each user will\nthen receive an email to validate their\
    \ email address:\n SELECT SYSTEM$START_USER_EMAIL_VERIFICATION( '<username>' );"
  checks:
  - type: manual_review
    info: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. List users with no email address set:\n\
      SELECT DISTINCT a.grantee_name as name, b.email is not null as\nhas_email\nFROM snowflake.account_usage.grants_to_users\
