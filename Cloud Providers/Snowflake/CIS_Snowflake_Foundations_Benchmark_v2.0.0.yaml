  remediation: 'Programmatically:

    In a Snowsight worksheet or through the SnowSQL CLI:

    1. For each task <task_name> that runs with ACCOUNTADMIN or SECURITYADMIN

    privileges, create a new role <task_specific_role> and assign it to the tasks:

    CREATE ROLE <task_specific_role>;

    GRANT OWNERSHIP ON TASK <task_name> TO ROLE <task_specific_role>;

