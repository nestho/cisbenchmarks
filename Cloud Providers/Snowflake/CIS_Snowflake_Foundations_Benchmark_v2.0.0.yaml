- id: '1.14'
  title: Ensure that Snowflake tasks are not owned by the ACCOUNTADMIN or SECURITYADMIN roles
  scoring: scored
  profile:
  - Level 1
  description: The ACCOUNTADMIN system role is the most powerful role in a Snowflake account and is intended for performing
    initial setup and managing account-level objects. SECURITYADMIN role can trivially escalate their privileges to that of
    ACCOUNTADMIN. Neither of these roles should be used for running Snowflake tasks. A task should be running using a custom
    role containing only those privileges that are necessary for successful execution of the task. Snowflake executes tasks
    with the privileges of the task owner. The role that has OWNERSHIP privilege on the task owns the task. To avoid granting
    a task inappropriate privileges, the OWNERSHIP privilege on the task run as owner should be assigned to a custom role
    containing only those privileges that are necessary for successful execution of the task. The ACCOUNTADMIN system role
    is the most powerful role in a Snowflake account and is intended for performing initial setup and managing account-level
    objects. SECURITYADMIN role can trivially escalate their privileges to that of ACCOUNTADMIN. Neither of these roles should
    be used for running Snowflake tasks. A task should be running using a custom role containing only those privileges that
    are necessary for successful execution of the task.
  rationale: The principle of least privilege requires that every identity, including service identities, is only given privileges
    that are necessary to complete its job. If a threat actor finds a way to influence or hijack the task execution flow,
    they may be able to exploit privileges given to the task. In the case of an ACCOUNTADMIN or SECURITYADMIN roles, that
    may lead to a full account takeover. Additionally, a mistake in the task implementation coupled with excessive privileges
    may lead to a reliability incident, e.g. accidentally dropping database objects. The principle of least privilege requires
