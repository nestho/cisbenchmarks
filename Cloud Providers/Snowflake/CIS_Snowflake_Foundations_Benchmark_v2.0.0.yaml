controls:
- id: '1.1'
  title: Ensure single sign-on (SSO) is configured for your account / organization
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: 'Federated authentication enables users to connect to Snowflake using secure SSO (single sign-on). With SSO
    enabled, users authenticate through an external (SAML 2.0compliant or OAuth 2.0) identity provider (IdP). Once authenticated
    by an IdP, users can access their Snowflake account for the duration of their IdP session without having to authenticate
    to Snowflake again. Users can choose to initiate their sessions from within the interface provided by the IdP or directly
    in Snowflake. Snowflake offers native support for federated authentication and SSO through Okta and Microsoft ADFS. Snowflake
    also supports most SAML 2.0-compliant vendors as an IdP, including Google G Suite, Microsoft Azure Active Directory, OneLogin,
    and Ping Identity PingOne. To use an IdP other than Okta or ADFS, you must define a custom application for Snowflake in
    the IdP. There are two ways to configure SAML: • By creating the security integration (recommended) • By setting the SAML_IDENTITY_PROVIDER
    account parameter (deprecated) The System for Cross-domain Identity Management (SCIM) is an open specification designed
    to help facilitate the automated management of user identities and groups (i.e. roles) in cloud applications using RESTful
    APIs. Snowflake supports SCIM 2.0 integration with Okta, Microsoft Azure AD and custom identity providers. Users and groups
    from the identity provider can be provisioned into Snowflake, which functions as the service provider.'
  rationale: Configuring your Snowflake authentication so that users can log in using SSO reduces the attack surface for your
    organization because users only log in once across multiple applications and do not have to manage a separate set of credentials
    for their Snowflake account. While SSO enables seamless authentication with a federated identity to the Snowflake application,
    user accounts still need to be created, managed, and deprovisioned. Operations like adding and deleting users, changing
    permissions, and adding new types of accounts usually take up valuable admin time and when done manually may be errorprone.
    With SCIM, user identities can be created either directly in your identity provider, or imported from external systems
    like HR software or Active Directory. SCIM enables IT departments to automate the user provisioning and deprovisioning
    process while also having a single system to manage permissions and groups. Since data is transferred automatically, risk
    of error is reduced.
  impact: There may be costs associated with provisioning and using an IdP service. None.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/admin-security-fed-auth.html
  - 2. https://docs.snowflake.com/en/user-guide/admin-security-fed-auth-configureidp.html
  - 1. https://docs.snowflake.com/en/user-guide/scim-intro.html
  page_start: 17
  audit_raw: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. List all the security integrations\
    \ in your account.\nSHOW SECURITY INTEGRATIONS;\n2. Ensure that there are security integrations of type SAML2 and EXTERNAL_OAUTH\n\
    configured for an account.\nSELECT *\nFROM TABLE(RESULT_SCAN(LAST_QUERY_ID()))\nWHERE (\"type\" LIKE 'EXTERNAL_OAUTH%'\
    \ OR \"type\" LIKE 'SAML2')\n AND \"enabled\" = TRUE;\n3. Ensure that there is an SSO integration configured for the account.\n\
    Note: The presence of a configured security integration does not mean that it is\nconfigured correctly and working. Configuration\
    \ correctness should be explicitly\ntested\nRequired privileges:\nTo be able to execute the above audit query above, the\
    \ caller needs the USAGE privilege\non every security integration in your Snowflake account.\nProgrammatically:\nIn a\
    \ Snowsight worksheet or through the SnowSQL CLI:\n1. List the security integrations in your account:\nSHOW SECURITY INTEGRATIONS;\n\
    2. Ensure that a SCIM integration is configured. The output of the following\ncommand shows all SCIM security integrations\
    \ configured for an account. No\noutput means no SCIM integration has been configured for the account.\n3. Ensure that\
    \ there are security integrations of type SCIM% with enabled set to\ntrue.\nSELECT *\nFROM TABLE(result_scan(last_query_id()))\n\
    WHERE (\"type\" like 'SCIM%') AND \"enabled\" = true;\n4. For the security integration returned from the previous query,\
    \ ensure that\npassword sync is disabled. This is disabled by default, but older integrations may\nhave it enabled by\
    \ default. Snowflake discourages password-only sign-in and will\nsoon block it:\nDESCRIBE INTEGRATION <integration_name>;\n\
    5. Ensure the value of sync_password is set to false.\nNote: The presence of a SCIM security integration does not mean\
    \ that it is configured\ncorrectly and working.\nRequired privileges:\nTo be able to execute the above audit query above,\
    \ the caller needs the USAGE privilege\non every security integration in an account."
  remediation: 'The steps for configuring an IdP differ depending on whether you choose SAML2 or

    OAuth. They further differ depending on what identity provider you choose: Okta, AD

    FS, Ping Identity, Azure AD, or custom. For specific instructions, see Snowflake

    documentation on SAML and External OAuth.

    Note: If your SAML integration is configured using the deprecated account parameter

    SAML_IDENTITY_PROVIDER, you should migrate to creating a security integration using

    the system$migrate_saml_idp_registration function. For more information, see the

    Migrating to a SAML2 Security Integration documentation.

    Follow the instructions in the Snowflake documentation to set up SCIM configuration for

    Okta, Azure AD, or configure a custom SCIM integration.

    NOTE: If password sign-in is not necessary and configuring SCIM via Okta, under

    “Sync Password”, uncheck the setting “Generate a new random password whenever the

    user’s Okta password changes”. When creating the security integration, specify

    sync_password=false.'
  checks:
  - type: sql
    command: SHOW SECURITY INTEGRATIONS;
    severity: medium
    info: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. List all the security integrations\
      \ in your account.\nSHOW SECURITY INTEGRATIONS;\n2. Ensure that there are security integrations of type SAML2 and EXTERNAL_OAUTH\n\
      configured for an account.\nSELECT *\nFROM TABLE(RESULT_SCAN(LAST_QUERY_ID()))\nWHERE (\"type\" LIKE 'EXTERNAL_OAUTH%'\
      \ OR \"type\" LIKE 'SAML2')\n AND \"enabled\" = TRUE;\n3. En"
- id: '1.3'
  title: Ensure that Snowflake password is unset for SCIM-managed users
  scoring: manual
  profile:
  - Level 1
  description: Ensure that Snowflake password is unset for SCIM-managed users.
  rationale: 'Allowing users to sign in with Snowflake passwords in the presence of a configured third-party identity provider
    SSO may undermine mandatory security controls configured on the SSO and degrade the security posture of the account. For
    example, the SSO sign-in flow may be configured to require multi-factor authentication (MFA), whereas the Snowflake password
    sign-in flow may not. Note: • This benchmark does not preclude configuration of key pair authentication for SSO users.
    Key pair authentication may be necessary for users to interact with Snowflake programmatically or through third party
    tools. • To mitigate the risk of users not being able to sign-in due to SSO provider outage, ensure that at least one
    SSO break-glass user exists with Snowflake password reset privileges for account users. This break-glass user should be
    able to sign in using a Snowflake native password (coupled with MFA) or a key pair.'
  impact: Users will not be able to sign into their Snowflake accounts if SSO sign-in flow breaks, for example due to SSO
    provider outage.
  references:
  - 1. https://docs.snowflake.com/en/sql-reference/sql/create-user.html
  - 2. https://docs.snowflake.com/en/user-guide/scim-okta.html#features
  page_start: 23
  audit_raw: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Identify the SCIM security integration\
    \ in your account:\nSHOW SECURITY INTEGRATIONS ->> SELECT \"name\" FROM $1 WHERE \"type\" ILIKE\n'SCIM%';\n2. Ensure that\
    \ the query above returns a result.\n3. Show all users managed through the SCIM integration identified in the previous\n\
    query that have a password set:\nDESCRIBE SECURITY INTEGRATION <security_integration>\n ->> SELECT \"property_value\"\
    \ AS SCIM_ROLE FROM $1 WHERE \"property\" =\n'RUN_AS_ROLE'\n ->>\nSELECT NAME\nFROM SNOWFLAKE.ACCOUNT_USAGE.USERS\nWHERE\n\
    \ HAS_PASSWORD\n AND OWNER IN (SELECT SCIM_ROLE FROM $1)\n AND DELETED_ON IS NULL\n AND NOT DISABLED;\n4. Ensure that\
    \ the query above does not return any results. An exception should be\nallowed for a the break-glass SSO user which needs\
    \ to be able to log-in with a\nSnowflake password and MFA (or with a key pair).\nRequired privileges:\nRunning the query\
    \ requires the SECURITY_VIEWER role on the Snowflake database."
  remediation: "Programmatically:\nFor each SSO user <username> with a password, run the following command to set\npassword\
    \ to null:\nALTER USER <username>\n SET PASSWORD = NULL;\nIf your IdP configuration automatically generates passwords\
    \ for SCIM-managed users,\nconsider disabling this functionality such that new SCIM-managed users will not have\npasswords\
    \ generated by default."
  checks:
  - type: sql
    command: SHOW SECURITY INTEGRATIONS ->> SELECT "name" FROM $1 WHERE "type" ILIKE
    severity: medium
    info: 'Programmatically:

      In a Snowsight worksheet or through the SnowSQL CLI:

      1. Identify the SCIM security integration in your account:

      SHOW SECURITY INTEGRATIONS ->> SELECT "name" FROM $1 WHERE "type" ILIKE

      ''SCIM%'';

      2. Ensure that the query above returns a result.

      3. Show all users managed through the SCIM integration identified in the previous

      query that have a password set:

      DESCRIBE SECURITY INTEGRAT'
- id: '1.4'
  title: Ensure that person users do not use password-only authentication
  scoring: scored
  profile:
  - Level 1
  description: 'Multi-factor authentication (MFA) is a security control used to add an additional layer of login security.
    It works by requiring the user to present two or more proofs (factors) of user identity. An MFA example would be requiring
    a password and a verification code delivered to the user''s phone during user sign-in. Snowflake supports multiple forms
    of MFA, with passkeys and authenticator apps being preferred, in addition to Duo. NOTE: Person users are those with their
    TYPE set to PERSON or null.'
  rationale: MFA mitigates security threats of users creating weak passwords and user passwords being stolen or accidentally
    leaked.
  impact: An authentication policy requiring MFA may break existing automation connecting to Snowflake using only passwords.
    Be sure that all users in the account are correctly tagged as PERSON or SERVICE to avoid disruption to essential services.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/security-access-control-configure.html
  - 2. https://docs.snowflake.com/en/user-guide/security-mfa.html
  page_start: 26
  audit_raw: 'From the UI:

    1. Go to https://app.snowflake.com/ and sign into your Snowflake account.

    2. On the left side navigation bar, hover over Governance & security, then click on

    Trust Center.

    3. On the Strong authentication progress tile, click on View hub.

    4. Under Prioritize your remediation efforts, select By user. Under the User type

    filter, select Person.

    5. Ensure that no users are listed.

    Required privileges:

    Running the above requires the SNOWFLAKE.TRUST_CENTER_VIEWER application

    role on the Snowflake database'
  remediation: "Programmatically:\nFor active users, create or update an authentication policy at the account level to\nenforce\
    \ MFA for all password-based logins across all Snowflake interfaces.\n CREATE AUTHENTICATION POLICY enforce_password_mfa\n\
    \ -- Require MFA enrollment when logging in with username and password\n MFA_ENROLLMENT = REQUIRED;\n ALTER ACCOUNT SET\
    \ AUTHENTICATION POLICY enforce_password_mfa;\nFor inactive users, consider disabling or dropping the user if they are\
    \ no longer in use. If\nthe user is being used for break-glass scenarios, enable OTP as a second factor.\nIf the user\
    \ is using their password to connect to Snowflake via an application, upgrade\nthe user's connection with the app to use\
    \ a strong, preferred authentication method.\nConsult the Overview of Snowflake Authentication guidance for details on\n\
    recommended authentication methods.\nFrom the UI:\n1. Go to https://app.snowflake.com/ and sign into your Snowflake account.\n\
    2. On the left side navigation bar, hover over Governance & security, then click on\nTrust Center.\n3. On the Strong authentication\
    \ progress tile, click on View hub.\n4. Under Prioritize your remediation efforts, select By user. Under the User type\n\
    filter, select Person.\n5. For each user listed, click on the user name and follow the recommended\nremediation instructions."
  checks:
  - type: manual_review
    info: 'From the UI:

      1. Go to https://app.snowflake.com/ and sign into your Snowflake account.

      2. On the left side navigation bar, hover over Governance & security, then click on

      Trust Center.

      3. On the Strong authentication progress tile, click on View hub.

      4. Under Prioritize your remediation efforts, select By user. Under the User type

      filter, select Person.

      5. Ensure that no users are listed.

      Required privileges:

      Running the above requires the SNOWFLAKE.TRUST_CENTER_VIEWER application

      role on the Sn'
    severity: medium
- id: '1.5'
  title: Ensure minimum password length is set to 14 characters or more
  scoring: scored
  profile:
  - Level 1
  description: 'To mitigate the risk of unauthorized access to a Snowflake account through easily guessable password, Snowflake
    enforces the following password policy as a minimum requirement while using the ALTER USER command and the web interface:
    • Must be at least 14 characters long. • Must contain at least 1 digit. • Must contain at least 1 uppercase letter and
    1 lowercase letter. Snowflake password policies can be used to specify and enforce further constraints on password length
    and complexity. Snowflake supports setting a password policy for your Snowflake account and for individual users. Only
    one password policy can be set at any given time for your Snowflake account or a user. If a password policy exists for
    the Snowflake account and another password policy is set for a user in the same Snowflake account, the user-level password
    policy takes precedence over the account-level password policy. The password policy applies to new passwords that are
    set in your Snowflake account. To ensure that users with existing passwords meet the password policy requirements, require
    users to change their password during their next login to Snowflake as shown in Step 6: Require a Password Change.'
  rationale: While Snowflake recommends configuring SSO authentication for users and ensuring that SSO users do not have a
    password set, there may be exceptions when users still need to log in with a password (e.g., setting up a break-glass
    user with password login to recover from SSO outages). For those few users that still need to have a password, setting
    a password policy can help ensure that, throughout subsequent password changes, the passwords used remain complex and
    therefore harder to guess or bruteforce. While the minimum password length is already set to 14 by default, password policies
    can override this behavior to as low as 8 characters, which would result in weaker passwords.
  impact: None.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/admin-user-management#passwordpolicies
  page_start: 29
  audit_raw: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. List all users in the account alongside\
    \ their effective password policy. Users need\nto be checked individually as any password policy set at the user-level\
    \ overrides\na password policy set on the account.\n WITH\n POLICY_REFERENCES AS (\n SELECT\n POLICY_DB AS POLICY_DATABASE,\n\
    \ POLICY_SCHEMA AS POLICY_SCHEMA,\n POLICY_ID AS POLICY_ID,\n POLICY_NAME AS POLICY_NAME,\n REF_ENTITY_NAME AS REF_ENTITY_NAME,\n\
    \ REF_ENTITY_DOMAIN AS REF_ENTITY_DOMAIN\n FROM SNOWFLAKE.ACCOUNT_USAGE.POLICY_REFERENCES\n WHERE POLICY_KIND = 'PASSWORD_POLICY'\n\
    \ AND REF_ENTITY_DOMAIN IN ('USER', 'ACCOUNT')\n ),\n PASSWORD_POLICIES AS (\n SELECT\n POLICIES.NAME AS NAME,\n POLICIES.PASSWORD_MIN_LENGTH\
    \ AS PASSWORD_MIN_LENGTH,\n REFS.REF_ENTITY_NAME AS REF_ENTITY_NAME,\n REFS.REF_ENTITY_DOMAIN AS REF_ENTITY_DOMAIN\n FROM\
    \ SNOWFLAKE.ACCOUNT_USAGE.PASSWORD_POLICIES POLICIES\n LEFT OUTER JOIN POLICY_REFERENCES REFS\n ON REFS.POLICY_DATABASE\
    \ = POLICIES.DATABASE\n AND REFS.POLICY_SCHEMA = POLICIES.SCHEMA\n AND REFS.POLICY_NAME = POLICIES.NAME\n WHERE POLICIES.DELETED\
    \ IS NULL\n )\n SELECT\n U.NAME,\n ACCOUNT_POLICIES.NAME AS ACCOUNT_POLICY_NAME,\n ACCOUNT_POLICIES.PASSWORD_MIN_LENGTH\
    \ AS ACCOUNT_POLICY_MIN_LENGTH,\n USER_POLICIES.NAME AS USER_POLICY_NAME,\n USER_POLICIES.PASSWORD_MIN_LENGTH AS USER_POLICY_MIN_LENGTH\n\
    \ FROM SNOWFLAKE.ACCOUNT_USAGE.USERS U\n LEFT OUTER JOIN PASSWORD_POLICIES USER_POLICIES\n ON U.NAME = USER_POLICIES.REF_ENTITY_NAME\
    \ AND\nUSER_POLICIES.REF_ENTITY_DOMAIN = 'USER'\n LEFT OUTER JOIN PASSWORD_POLICIES ACCOUNT_POLICIES\n ON ACCOUNT_POLICIES.REF_ENTITY_DOMAIN\
    \ = 'ACCOUNT'\n WHERE\n IFNULL(USER_POLICIES.PASSWORD_MIN_LENGTH,\nIFNULL(ACCOUNT_POLICIES.PASSWORD_MIN_LENGTH, 14)) <\
    \ 14\n AND U.DELETED_ON IS NULL\n AND U.HAS_PASSWORD\n AND NOT U.DISABLED;\n2. Ensure that the query above does not return\
    \ any results."
  remediation: "Follow the following steps to set and enforce a password policy:\n1. Create the password policy if it does\
    \ not exist:\nCREATE PASSWORD POLICY <password_policy>\n PASSWORD_MIN_LENGTH = 14\n PASSWORD_MAX_AGE_DAYS = 0;\n2. Set\
    \ password policy on the account level:\nALTER ACCOUNT\n SET PASSWORD POLICY <password_policy>;\nNote: It may take up\
    \ to 2 hours for the password policies created to show up in\nthe account usage view. For more information on latency,\
    \ see the Data latency\nfor Account Usage documentation."
  checks:
  - type: manual_review
    info: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. List all users in the account alongside\
      \ their effective password policy. Users need\nto be checked individually as any password policy set at the user-level\
      \ overrides\na password policy set on the account.\n WITH\n POLICY_REFERENCES AS (\n SELECT\n POLICY_DB AS POLICY_DATABASE,\n\
      \ POLICY_SCHEMA AS POLICY_SCHEMA,\n POLICY_ID AS POLICY_ID,\n POLICY_NAME AS POLICY_NAME,\n REF_ENTITY_NAME AS REF_ENTITY_NAME,\n\
      \ REF_ENTITY_DOMAIN AS REF_ENT"
    severity: medium
- id: '1.6'
  title: Ensure that legacy service users are migrated to service users
  scoring: scored
  profile:
  - Level 1
  description: Service users are used by scripts, jobs, applications, pipelines, etc. to talk to Snowflake. Snowflake distinguishes
    between person and service users through the ‘type’ property. Service users can have their type set to ‘SERVICE’ or ‘LEGACY_SERVICE.’
    Legacy service users, unlike service users, are allowed to use password-based authentication. Snowflake is deprecating
    the LEGACY_SERVICE user type, and all users should move away from password-based authentication.
  rationale: 'Password-based authentication has a set of disadvantages that increase probability of a security incident, especially
    when used without MFA: • Passwords created by humans are generally more predictable and less random than keys generated
    by a computer. Consequently, passwords are easier to brute force both online (against a live service) or offline (against
    a hashed password database). • Passwords are usually transmitted over the network and can be leaked when the transmission
    channel is insecure or when an application is accidentally misconfigured to log passwords. • Passwords are easier to leak
    by writing them down on a sticky note attached to the back of a keyboard. • It is easier to trick (phish) a user into
    revealing their password to an unauthorized party. Using more secure authentication options, such as Workload Identity
    Federation, and OAuth helps with mitigating the aforementioned issues.'
  impact: An authentication policy requiring MFA may break existing automation connecting to Snowflake using only passwords.
    Be sure that all users in the account are correctly tagged as PERSON or SERVICE to avoid disruption to essential services.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/key-pair-auth.html
  - 2. https://docs.snowflake.com/en/user-guide/security-authentication-overview
  page_start: 33
  audit_raw: 'From the UI:

    1. Go to https://app.snowflake.com/ and sign into your Snowflake account.

    2. On the left side navigation bar, hover over Governance & security, then click on

    Trust Center.

    3. On the Strong authentication progress tile, click on View hub.

    4. Under Prioritize your remediation efforts, select By user. Under the User type

    filter, select Legacy Service.

    5. Ensure that no users are listed.

    Required privileges:

    Running the above requires the SNOWFLAKE.TRUST_CENTER_VIEWER application

    role on the Snowflake database.'
  remediation: 'Programmatically:

    For users connecting through cloud workloads running in GCP, Azure, or AWS, we

    strongly recommend using secretless authentication through Workload Identity

    Federation.

    For users connecting through other applications, upgrade the user''s connection in these

    applications to use a strong, preferred authentication method. Consult the application

    authentication support guidance and learn about preferred authentication methods to

    connect to Snowflake.

    For inactive users, consider disabling or dropping the user if they are no longer in use. If

    the user is being used for break-glass scenarios, enable OTP as a second factor.

    From the UI:

    1. Go to https://app.snowflake.com/ and sign into your Snowflake account.

    2. On the left side navigation bar, hover over Governance & security, then click on

    Trust Center.

    3. On the Strong authentication progress tile, click on View hub.

    4. Under Prioritize your remediation efforts, select By user. Under the User type

    filter, select Legacy Service.

    5. For each user listed, click on the user name and follow the recommended

    remediation instructions.'
  checks:
  - type: manual_review
    info: 'From the UI:

      1. Go to https://app.snowflake.com/ and sign into your Snowflake account.

      2. On the left side navigation bar, hover over Governance & security, then click on

      Trust Center.

      3. On the Strong authentication progress tile, click on View hub.

      4. Under Prioritize your remediation efforts, select By user. Under the User type

      filter, select Legacy Service.

      5. Ensure that no users are listed.

      Required privileges:

      Running the above requires the SNOWFLAKE.TRUST_CENTER_VIEWER application

      role o'
    severity: medium
- id: '1.7'
  title: Ensure authentication key pairs are rotated at least every 90 days
  scoring: scored
  profile:
  - Level 1
  description: Snowflake supports using RSA key pair authentication as an alternative to password authentication and as a
    primary way to authenticate service accounts. Authentication key pair rotation is a process of replacing an existing authentication
    key pair with a freshly generated key pair. Snowflake supports two active authentication key pairs to allow for uninterrupted
    key rotation. Rotate and replace your authentication key pairs based on the expiration schedule at least once every 180
    days.
  rationale: Periodic authentication key pair rotation mitigates the threat of compromised or leaked keys. It reduces the
    window of opportunity during which a given key is valid and can be used by a threat actor.
  impact: Existing automation and services that rely on key pair authentication may break if they are not updated to use a
    new authentication key before the old key is inactivated.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/key-pair-auth.html#configuring-keypair-rotation
  page_start: 36
  audit_raw: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Parse the account query history\
    \ and output all users and key pair names for key\npairs that were set more than 180 days ago.\nWITH FILTERED_QUERY_HISTORY\
    \ AS (\n -- Extract necessary fields and apply initial filters\n SELECT END_TIME AS SET_TIME,\n UPPER(REGEXP_SUBSTR(REGEXP_REPLACE((QUERY_TEXT,\n\
    'IF\\\\s+(NOT)?\\\\s*EXISTS', ''), 'USER\\\\s+\"?([\\\\w]+)\"?', 1, 1, 'i', 1))\nAS PROCESSED_USERNAME,\n QUERY_TEXT\n\
    \ FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY\n WHERE EXECUTION_STATUS = 'SUCCESS'\n AND QUERY_TYPE IN ('ALTER_USER', 'CREATE_USER')\n\
    \ AND TO_DATE(SET_TIME) < DATEADD(day, -90, CURRENT_DATE())\n AND (QUERY_TEXT ILIKE '%rsa_public_key%' OR QUERY_TEXT ILIKE\n\
    '%rsa_public_key_2%')\n),\nEXTRACTED_KEYS AS (\n SELECT SET_TIME,\n PROCESSED_USERNAME,\n CASE\n WHEN POSITION('rsa_public_key'\
    \ IN LOWER(QUERY_TEXT)) > 0\nTHEN 'rsa_public_key'\n WHEN POSITION('rsa_public_key_2' IN LOWER(QUERY_TEXT)) > 0\nTHEN\
    \ 'rsa_public_key_2'\n ELSE NULL\n END AS RSA_KEY_NAME\n FROM FILTERED_QUERY_HISTORY\n WHERE POSITION('rsa_public_key'\
    \ IN LOWER(QUERY_TEXT)) > 0 OR\nPOSITION('rsa_public_key_2' IN LOWER(QUERY_TEXT)) > 0\n),\nRECENT_KEYS AS (\n SELECT EK.SET_TIME,\n\
    \ EK.PROCESSED_USERNAME AS USERNAME,\n EK.RSA_KEY_NAME AS RSA_PUBLIC_KEY,\n ROW_NUMBER() OVER (PARTITION BY ek.processed_username,\n\
    ek.rsa_key_name ORDER BY ek.set_time DESC) AS rnum\n FROM EXTRACTED_KEYS EK\n INNER JOIN SNOWFLAKE.ACCOUNT_USAGE.USERS\
    \ AU ON\nEK.PROCESSED_USERNAME = AU.NAME\n WHERE AU.DELETED_ON IS NULL\n AND AU.HAS_RSA_PUBLIC_KEY = true\n AND AU.DISABLED\
    \ = FALSE\n AND EK.RSA_KEY_NAME IS NOT NULL\n)\n-- Select the most recent RSA key name for each user\nSELECT SET_TIME,\n\
    \ USERNAME,\n RSA_PUBLIC_KEY\nFROM RECENT_KEYS\nWHERE RNUM = 1;\n2. Ensure that the query above does not return any results.\n\
    Note: This query above is limited by the query history length that goes back to 360 days\nonly. Key pairs set more than\
    \ 360 days ago will not be surfaced by this query.\nRequired privileges:\nTo run the query above, the caller needs the:\n\
    • The SECURITY_VIEWER role on the Snowflake database.\n• The GOVERNANCE_VIEWER role on the Snowflake database."
  remediation: 'Programmatically:

    In a Snowsight worksheet or through the SnowSQL CLI:

    1. For every Snowflake service account whose authentication key pair age is >=

    180 days, generate a new RSA authentication keypair.

    2. Update either RSA_PUBLIC_KEY and RSA_PUBLIC_KEY_2 properties of a user,

    whichever is currently unset.

    ALTER USER <username> SET RSA_PUBLIC_KEY_2=''JERUEHtcve...'';

    3. Identify all services and automation that authenticate using existing keypair and

    update them to authenticate using freshly generated keypair.

    4. Unset either RSA_PUBLIC_KEY or RSA_PUBLIC_KEY_2 properties of a user,

    whichever is assigned the old public key.

    ALTER USER <username> UNSET RSA_PUBLIC_KEY;

    For more information, see Configuring Key Pair Rotation.'
