    severity: medium
- id: '2.8'
  title: Ensure monitoring and alerting exists for sessions from unsupported and vulnerable driver versions
  scoring: manual
  profile:
  - Level 2
  description: Snowflake provides client software (drivers, connectors, etc.) for connecting to Snowflake and using certain
    Snowflake features (e.g. Apache Kafka for loading data, Apache Hive metadata for external tables). The clients must be
    installed on each local workstation or system from which you wish to connect. The Snowflake Connector for Python, JDBC
    and ODBC drivers are some of the most used Snowflake clients. Old versions of drivers and connectors may contain security
    vulnerabilities that have been fixed in the latest version. To ensure that only up-to-date software is used, you should
    actively monitor session logins coming from unsupported clients and upgrade those to the latest available versions.
  rationale: Using out-of-date Snowflake clients can expose your account to security risks. You should monitor for connections
    from unsupported Snowflake Connector drivers and upgrade to the latest versions available.
  impact: None.
  references:
  - 1. https://docs.snowflake.com/en/release-notes/requirements
  - 2. https://community.snowflake.com/s/article/how-to-report-on-the-clientsconnecting-to-a-snowflake-account
  page_start: 94
  audit_raw: 'Confirm that your security monitoring and alerting solution is configured to generate

    alerts on sessions coming from unsupported Snowflake connectors and drivers.'
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Create a UDF to help you compare\
    \ version numbers:\n CREATE OR REPLACE FUNCTION COMPARE_VERSIONS(v1 VARCHAR, v2 VARCHAR)\n RETURNS NUMERIC\n AS\n $$\n\
    \ SELECT\n CASE\n WHEN TRY_CAST(split(v1, '.')[0]::string AS NUMBER) <\nTRY_CAST(split(v2, '.')[0]::string as number)\
    \ then -1\n WHEN TRY_CAST(split(v1, '.')[0]::string AS NUMBER) >\nTRY_CAST(split(v2, '.')[0]::string as number) then 1\n\
    \ WHEN TRY_CAST(split(v1, '.')[1]::string AS NUMBER) <\nTRY_CAST(split(v2, '.')[1]::string as number) then -1\n WHEN TRY_CAST(split(v1,\
    \ '.')[1]::string AS NUMBER) >\nTRY_CAST(split(v2, '.')[1]::string as number) then 1\n WHEN TRY_CAST(split(v1, '.')[2]::string\
    \ AS NUMBER) <\nTRY_CAST(split(v2, '.')[2]::string as number) then -1\n WHEN TRY_CAST(split(v1, '.')[2]::string AS NUMBER)\
    \ >\nTRY_CAST(split(v2, '.')[2]::string AS NUMBER) then 1\n ELSE 0\n END\n $$;\n2. Configure your security monitoring\
    \ solution to alert on sessions from unsupported\nor vulnerable driver versions. The following query can be run periodically.\n\
    SELECT\n ARRAY_AGG(\nOBJECT_CONSTRUCT(\n'cve', CVE,\n'severity', SEVERITY,\n'min_affected', MIN_AFFECTED,\n'max_affected',\
    \ MAX_AFFECTED)\n) AS CVE_INFO,\n USER_NAME,\n CREATED_ON,\n CLIENT_APP,\n CLIENT_APPLICATION_VERSION,\n MINIMUM_SUPPORTED_VERSION,\n\
    \ RECOMMENDED_VERSION,\n IS_UNSUPPORTED_VERSION,\n BOOLOR_AGG(VULNERABLE_VERSION) AS IS_VULNERABLE_VERSION\nFROM\n(\n\
    \ WITH CVE AS (\n SELECT\n DRIVER_DATA.value:clientId::varchar AS CLIENT_ID,\n VULNERABILITY.value:cve::varchar AS CVE,\n\
    \ VULNERABILITY.value:severity::varchar AS SEVERITY,\n VULNERABILITY.value:minAffected::varchar AS MIN_AFFECTED,\n VULNERABILITY.value:maxAffected::varchar\
    \ AS MAX_AFFECTED\n from (\n SELECT PARSE_JSON(SYSTEM$CLIENT_VULNERABILITY_INFO()) AS\nJSON_COLUMN\n ) AS JSON_TABLE,\n\
    \ LATERAL FLATTEN(input => json_table.json_column) AS\nDRIVER_DATA,\n LATERAL FLATTEN(input => driver_data.value:vulnerabilities)\
    \ AS\nVULNERABILITY\n )\n SELECT\n MAX(S.CREATED_ON) AS CREATED_ON,\n S.USER_NAME,\n SPLIT(S.CLIENT_APPLICATION_ID, '\
    \ ')[0]::VARCHAR AS\nCLIENT_APP,\n S.CLIENT_APPLICATION_VERSION,\n V.value:\"minimumSupportedVersion\"::string AS\nMINIMUM_SUPPORTED_VERSION,\n\
    \ V.value:\"recommendedVersion\"::string AS RECOMMENDED_VERSION,\n FALSE AS STATUS,\n CVE.*,\n COMPARE_VERSIONS(S.CLIENT_APPLICATION_VERSION,\n\
    V.value:\"minimumSupportedVersion\") < 0 AS UNSUPPORTED_VERSION,\n COMPARE_VERSIONS(S.CLIENT_APPLICATION_VERSION, CVE.MIN_AFFECTED)\n\
    >= 0\n AND COMPARE_VERSIONS(S.CLIENT_APPLICATION_VERSION,\nCVE.MAX_AFFECTED) <= 0 AS VULNERABLE_VERSION,\n COUNT(*) AS\
    \ NUM_SESSIONS\n FROM SNOWFLAKE.ACCOUNT_USAGE.SESSIONS S\n LEFT JOIN TABLE(FLATTEN(INPUT =>\nPARSE_JSON(SYSTEM$CLIENT_VERSION_INFO())))\
    \ V\n ON CLIENT_APP = V.value:\"clientId\"\n LEFT JOIN CVE\n ON CLIENT_APP = CVE.CLIENT_ID\n WHERE MINIMUM_SUPPORTED_VERSION\
    \ IS NOT NULL\n AND S.CLIENT_APPLICATION_VERSION IS NOT NULL\n AND LEN(S.CLIENT_APPLICATION_VERSION) > 0\n AND (IS_UNSUPPORTED_VERSION\
    \ OR IS_VULNERABLE_VERSION)\n GROUP BY ALL\n)\nGROUP BY ALL;\n3. If you identify sessions from an outdated driver version,\
    \ you can configure your\nauthentication policy to require a minimum version for that driver using the query:\nALTER AUTHENTICATION\
    \ POLICY <policy_name> SET CLIENT_POLICY =\n<client_type> = (MINIMUM_VERSION = '<version>');\n4. When detecting the use\
    \ of unsupported clients, upgrade to the latest,\nrecommended version."
  checks:
  - type: manual_review
    info: 'Confirm that your security monitoring and alerting solution is configured to generate

      alerts on sessions coming from unsupported Snowflake connectors and drivers.'
    severity: medium
- id: '2.9'
  title: Ensure monitoring and alerting exists for changes to authentication policies and associated objects
  scoring: manual
  profile:
  - Level 1
  description: 'Authentication policies allow restricting authentication constraints such as: Whether person users must enroll
    in MFA Which authentication methods require MFA The allowed authentication methods, such as SAML, passwords, OAuth, key
    pair authentication, and programmatic access tokens. The allowed SAML2 security integrations The types of clients allowed
    to connect to Snowflake Whether network policies are required when using programmatic access tokens Snowflake supports
    setting an authentication policy for your Snowflake account and for individual users. If an authentication policy exists
    for the account and a user in the same account, the user-level authentication policy takes precedence over the account-level
    authentication policy.'
  rationale: Changes to authentication policies could weaken the account’s authentication requirements, such as relaxing restrictions
    on allowed driver versions and client applications and requirements when authenticating with Programmatic Access Tokens
    or Workload Identity Federation.
  impact: If authentication policy creation, update, deletion and object association events happen frequently, monitoring
    and alerting on this event may generate undue load on the detection and response team.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/authentication-policies
  - 2. https://docs.snowflake.com/en/sql-reference/sql/create-authentication-policy
  page_start: 98
  audit_raw: 'Confirm that Trust Center, or your own security monitoring and alerting solution, is

    configured to generate alerts on authentication policy changes.'
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. Configure your security monitoring\
    \ solution to alert on changes to authentication\npolicies.\n SELECT END_TIME,\n QUERY_TYPE,\n QUERY_TEXT,\n USER_NAME,\n\
    \ ROLE_NAME\n FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY\n WHERE EXECUTION_STATUS = \\'SUCCESS\\'\n AND (QUERY_TYPE IN\
    \ (\\'CREATE_AUTHENTICATION_POLICY\\',\n\\'ALTER_AUTHENTICATION_POLICY\\',\n \\'DROP_AUTHENTICATION_POLICY\\')\n OR (QUERY_TEXT\
    \ ILIKE \\'%SET%AUTHENTICATION_POLICY%\\'\n OR QUERY_TEXT ILIKE \\'%UNSET%AUTHENTICATION_POLICY%\\')\n )\n ORDER BY END_TIME\
    \ DESC;"
  checks:
  - type: manual_review
    info: 'Confirm that Trust Center, or your own security monitoring and alerting solution, is

      configured to generate alerts on authentication policy changes.'
    severity: medium
- id: '3.1'
  title: Ensure that all users are covered by a network policy to only allow access from trusted IP addresses
  scoring: manual
  profile:
  - Level 2
  description: Network policies allow restricting access to a Snowflake account based on source IP addresses. A network policy
    can be configured either on the account level, for all users of the account, or on the user level, for a specific user.
    In the presence of both accountlevel and user-level policies, the user-level policies take precedence. A network policy
    can also be configured on the SCIM and Snowflake OAuth security integrations to restrict the list of source IP addresses
    allowed when exchanging an authorization code for an access or refresh token and when using a refresh token to obtain
    a new access token. If network policy is not set on the security integration of the aforementioned types, the account-level
    network policy is set, if used. Network rules provide a mechanism to build reusable lists of IPs and CIDR ranges across
    multiple policies. Snowflake manages default rules for certain SaaS providers, which can also be used for supported services.
    These network rules will automatically update when the corresponding service’s IPs change.
  rationale: Network policies help mitigate the threat of leaked user credentials. If an account network policy is not configured
    limiting source IP addresses, leaked Snowflake credentials can be used from anywhere in the world. Network policies are
    especially useful when there is a heightened risk of leaking credentials. For example, if instead of using SSO, users
    authenticate to Snowflake using Snowflake passwords. Network policy set on the account level can serve as a coarse-grained
    baseline for the majority of the Snowflake users and can be further tightened on the specific highly privileged user,
    service account, and security integration level.
  impact: If a network policy is misconfigured to disallow IP addresses from which users usually access Snowflake, their productivity
    may be impacted. If a network policy is misconfigured to disallow IP addresses from which services and automation usually
    access Snowflake, reliability of those services and automation may be impacted. If a network policy is misconfigured to
    disallow IP addresses used by one of the Snowflake security integrations that support network policies, those integrations
    will be broken. If a user with permissions to configure network policies on the account accidentally locks themselves
    and everybody else with such permission out, they will need to contact Snowflake customer support to restore access to
    their account.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/network-policies.html
  - 2. https://docs.snowflake.com/en/user-guide/network-rules
  page_start: 101
  audit_raw: 'From the UI:

    1. Go to https://app.snowflake.com/ and sign into your Snowflake account.

    2. On the left side navigation bar, select Governance & security, then Network

    policies.

    3. Ensure that a network policy is configured properly with a status of Active on

    account, or the number of policies active on users equals the total number of

    users in the account.

    Programmatically:

    Note: if you specify user-level rather than account-level network policies, the same audit

    procedure can be followed, but must be done for each user returned from show users

    In a Snowsight worksheet or through the SnowSQL CLI:

    1. List the network policies active at the account level.

    SHOW PARAMETERS LIKE ''NETWORK_POLICY'' IN ACCOUNT;

    2. Ensure that the query returns a result.

    3. Note the name of the network policy and replace <policy_name> in the query

    below with your network policy name:

    DESCRIBE NETWORK POLICY <policy_name>;

    4. Ensure that ALLOWED_NETWORK_RULES_LIST or ALLOWED_IP_LIST is set for the

    network policy.

    5. If ALLOWED_IP_LIST is set, ensure that it contains only trusted IP address

    ranges. If ALLOWED_NETWORK_RULES_LIST is set, ensure that each network

    rule only contains trusted IP addresses by checking each

    fullyQualifiedRuleName:

    DESCRIBE NETWORK RULE <fullyQualifiedRuleName>;'
  remediation: 'From the UI:

    1. Go to https://app.snowflake.com/ and sign into your Snowflake account.

    2. On the left side navigation bar, select Governance & security, then Network

    policies.

    3. Click the + Network Policy button on the top right side.

    4. Enter a Policy Name and list of Allowed IP Addresses.

    5. Click Create network policy.

    6. Find your policy in the list of network policies and click Activate On Account.

    This will set the network policy at the account level.

    Programmatically:

    In a Snowsight worksheet or through the SnowSQL CLI:

    1. Create one or more network rules to define a list of allowed or blocked IP

    addresses. At least one network rule listing allowed IP addresses should be

    used, and should not include 0.0.0.0/0 (allow-all):

    CREATE NETWORK RULE <rule_name>

    TYPE = IPV4

    VALUE_LIST = (''<ip_to_allow>''[, ...]);

    2. Create a network policy. Replace with the name you want to give the policy, and

    customize the list of allowed and blocked network rules:

    CREATE NETWORK POLICY <policy_name>

    ALLOWED_NETWORK_RULE_LIST= (<rule_name>);

    3. Set the network policy at the account level:

    ALTER ACCOUNT SET NETWORK_POLICY = <policy_name>;

    For more information, see the documentation on creating network policies.

    Note:

    • When a network policy includes values for both ALLOWED_IP_LIST and

    BLOCKED_IP_LIST, Snowflake applies the blocked list first.

    • Do not add 0.0.0.0/0 to BLOCKED_IP_LIST. Because Snowflake applies the

    blocked list first, this would block your own access. Additionally, in order to block

    all IP addresses except a select list, you only need to add IP addresses to

    ALLOWED_IP_LIST. Snowflake automatically blocks all IP addresses not included

    in the allowed list.

    • You can create and set a network policy on a security integration to configure

    allowed IP addresses from your IdP used to exchange an authorization code for

    an access or refresh token and when using a refresh token to obtain a new

    access token.'
  checks:
  - type: sql
    command: select Governance & security, then Network
    severity: medium
    info: 'From the UI:

      1. Go to https://app.snowflake.com/ and sign into your Snowflake account.

      2. On the left side navigation bar, select Governance & security, then Network

      policies.

      3. Ensure that a network policy is configured properly with a status of Active on

      account, or the number of policies active on users equals the total number of

      users in the account.

      Programmatically:

      Note: if you specify use'
- id: '4.1'
  title: Ensure yearly rekeying is enabled for a Snowflake account
  scoring: scored
  profile:
  - Level 2
  description: All Snowflake customer data is encrypted by default using the latest security standards and best practices.
    Snowflake uses strong AES 256-bit encryption with a hierarchical key model rooted in a hardware security module. All Snowflake-managed
    keys are automatically rotated when they are more than 30 days old. Furthermore, data can be automatically re-encrypted
    ("rekeyed") on a yearly basis. Data encryption and key rotation is entirely transparent and requires no configuration
    or management. Key rotation transitions an active encryption key to a retired state. Practically this means transitioning
    of the active encryption key from being used for encrypting new data and decrypting data encrypted with that key to only
    decrypting data encrypted with that key. Rekeying transitions a retired encryption key to being destroyed. Practically
    this means re-encryption of the data encrypted by a retired key with a new key and destroying the disposing of the retired
    key.
  rationale: Rekeying constrains the total duration in which a key is used for recipient usage, following NIST recommendations.
    Furthermore, when rekeying data, Snowflake can increase encryption key sizes and utilize better encryption algorithms
    that may be standardized since the previous key generation was created. Rekeying, therefore, ensures that all customer
    data, new and old, is encrypted with the latest security technology.
  impact: None.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/security-encryption-manage.html
  - 2. https://docs.snowflake.com/en/sql-reference/parameters.html#periodic-datarekeying
  page_start: 107
  audit_raw: 'Programmatically:

    In a Snowsight worksheet or from the SnowSQL CLI:

    1. List the value of the PERIODIC_DATA_REKEYING parameter:

    SHOW PARAMETERS LIKE ''PERIODIC_DATA_REKEYING'' IN ACCOUNT;

    2. Ensure that the parameter is set to true.'
  remediation: "Programmatically:\nSet parameter value to true:\nALTER ACCOUNT\n SET PERIODIC_DATA_REKEYING=true;"
  checks:
  - type: sql
    command: SHOW PARAMETERS LIKE 'PERIODIC_DATA_REKEYING' IN ACCOUNT;
    severity: medium
    info: 'Programmatically:

      In a Snowsight worksheet or from the SnowSQL CLI:

      1. List the value of the PERIODIC_DATA_REKEYING parameter:

      SHOW PARAMETERS LIKE ''PERIODIC_DATA_REKEYING'' IN ACCOUNT;

      2. Ensure that the parameter is set to true.'
- id: '4.2'
  title: Ensure AES encryption key size used to encrypt files stored in internal stages is set to 256 bits
  scoring: scored
  profile:
  - Level 1
  description: All ingested data stored in Snowflake tables is encrypted using 256-bit long AES encryption keys. However,
    data uploaded to internal stages is by default encrypted with 128-bit long AES encryption keys.
  rationale: The field of cryptanalysis is continuously advancing and new vulnerabilities and attacks are discovered that
    obsolete cryptographic primitives that once were considered secure. The 128-bit long AES encryption keys are still considered
    secure today and there are no strong reasons to believe this will change soon. Usage of the 256-bit long AES encryption
    keys today is generally recommended out of an abundance of caution.
  impact: None.
  references:
  - 1. https://docs.snowflake.com/en/sql-reference/parameters#client-encryption-keysize
  page_start: 110
  audit_raw: 'Programmatically:

    In a Snowsight worksheet or using the SnowSQL CLI:

    1. Check length of the AES encryption keys used to encrypt data uploaded to

    internal stages:

    SHOW PARAMETERS LIKE ''CLIENT_ENCRYPTION_KEY_SIZE'' IN ACCOUNT;

    2. Ensure that value is set to 256.'
  remediation: "Programmatically:\nTo set the length of the AES encryption keys used to encrypt data uploaded to internal\n\
    stages, run the following command:\nALTER ACCOUNT\n SET CLIENT_ENCRYPTION_KEY_SIZE=256;"
  checks:
  - type: sql
    command: SHOW PARAMETERS LIKE 'CLIENT_ENCRYPTION_KEY_SIZE' IN ACCOUNT;
