- id: '4.8'
  title: Ensure that the PREVENT_UNLOAD_TO_INLINE_URL account parameter is set to true
  scoring: scored
  profile:
  - Level 1
  description: Prevent ad hoc data unload operations to external cloud storage by enabling the PREVENT_UNLOAD_TO_INLINE_URL
    account parameter.
  rationale: Direct data unloading can be employed by threat actors to exfiltrate sensitive data from Snowflake to a supported
    external storage location of their choice. A well-intended employee with a legitimate business task can unknowingly unload
    data to publicly available storage locations and unintentionally leak it. Prevention of the direct data unloading reduces
    risk of data exfiltration and leakage. Setting the PREVENT_UNLOAD_TO_INLINE_URL account parameter to true will prevent
    ad hoc data unload operations to external cloud storage locations (i.e. through COPY INTO <location> statements that specify
    the cloud storage URL and access settings directly in the statement).
  impact: Setting the PREVENT_UNLOAD_TO_INLINE_URL account level parameter to true can break existing manual and automated
    flows relying on direct unloading data to external storage locations.
  references:
  - 1. https://docs.snowflake.com/en/sql-reference/sql/copy-into-location
  - 2. https://docs.snowflake.com/en/sql-reference/parameters#prevent-unload-toinline-url
  page_start: 124
  audit_raw: 'Programmatically:

    From a Snowsight worksheet or from the SnowSQL CLI:

    1. List the value of the PREVENT_UNLOAD_TO_INLINE_URL account level parameter:

    SHOW PARAMETERS LIKE ''PREVENT_UNLOAD_TO_INLINE_URL'' IN ACCOUNT;

    2. Ensure that PREVENT_UNLOAD_TO_INLINE_URL is set to true;'
  remediation: "Programmatically:\nSet the PREVENT_UNLOAD_TO_INLINE_URL on the account level to true:\nALTER ACCOUNT\n SET\
    \ PREVENT_UNLOAD_TO_INLINE_URL=true;\nNOTE: To avoid disruption of existing workflow relying on direct unloading data\
    \ to\nexternal storage locations, all such workflows should be identified and migrated to\nunloading data to external\
    \ stages referencing storage integrations."
  checks:
  - type: sql
    command: SHOW PARAMETERS LIKE 'PREVENT_UNLOAD_TO_INLINE_URL' IN ACCOUNT;
    severity: medium
    info: 'Programmatically:

      From a Snowsight worksheet or from the SnowSQL CLI:

      1. List the value of the PREVENT_UNLOAD_TO_INLINE_URL account level parameter:

      SHOW PARAMETERS LIKE ''PREVENT_UNLOAD_TO_INLINE_URL'' IN ACCOUNT;

      2. Ensure that PREVENT_UNLOAD_TO_INLINE_URL is set to true;'
- id: '4.9'
  title: Ensure that Tri-Secret Secure is enabled for the Snowflake account
  scoring: manual
  profile:
  - Level 2
  description: Tri-Secret Secure is the combination of a Snowflake-maintained key and a customermanaged key in the cloud provider
    platform that hosts your Snowflake account to create a composite master key to protect your Snowflake data. The composite
    master key acts as an account master key and wraps all of the keys in the hierarchy; however, the composite master key
    never encrypts raw data.
  rationale: If the customer-managed key in the composite master key hierarchy is revoked, your data can no longer be decrypted
    by Snowflake, providing a level of security and control above Snowflake’s standard encryption.
  impact: 'This feature relies on the customer managing and providing an encryption key. There is a reliability risk associated
    with it: If the key is lost, all data encrypted within the Snowflake account will be lost.'
  references:
  - 1. https://docs.snowflake.com/en/user-guide/security-encryption-manage#tri-secretsecure
  - 2. https://community.snowflake.com/s/article/How-to-test-Tri-Secret-Secure-isenabled
  page_start: 126
  audit_raw: 'Follow the instructions in the How To: Validate Tri-Secret Secure is configured for your

    Snowflake account successfully documentation.'
  remediation: 'To enable Snowflake Tri-Secret Secure for your Business Critical (or higher) account,

    follow the Self-service instructions to enable Tri-Secret Secure.'
  checks:
  - type: manual_review
    info: 'Follow the instructions in the How To: Validate Tri-Secret Secure is configured for your

      Snowflake account successfully documentation.'
    severity: medium
- id: '4.10'
  title: Ensure that data masking is enabled for sensitive data
  scoring: manual
  profile:
  - Level 2
  description: Data masking policy is a fine-grained access control used to protect sensitive data from unauthorized access
    by selectively masking plain-text data in table and view columns at query time.
  rationale: Masking policy allows for a wide range of use cases where data can be queried, aggregated and analyzed in a privacy
    preserving manner.
  impact: Manual and automated workflows relying on querying unmasked data may be broken unless updated prior to application
    of a masking policy.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/security-column-intro
  - 2. https://docs.snowflake.com/en/user-guide/security-column-ddm-intro
  page_start: 128
  audit_raw: 'Ensure appropriate masking policies are applied to columns with sensitive data across

    all tables and views in a Snowflake account.

    Ensure appropriate row access policies are applied to rows with special access

    requirements across all tables and views in a Snowflake account.

    From the UI:

    1. Go to https://app.snowflake.com/ and sign into your Snowflake account.

    2. On the left side navigation bar, hover over Governance and Security, then click

    on Tags & Policies.

    3. Ensure that Columns with a masking policy shows a value greater than 0.

    Programmatically:

    In a Snowsight worksheet or through the SnowSQL CLI:

    1. List all the configured row access policies:

    SHOW MASKING POLICIES IN ACCOUNT;

    2. Ensure that the query returns at least one result.'
  remediation: 'Identify columns with sensitive data across all account tables and views and apply

