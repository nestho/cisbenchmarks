- id: '1.16'
  title: Ensure that Snowflake stored procedures are not owned by the ACCOUNTADMIN or SECURITYADMIN roles
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: The ACCOUNTADMIN system role is the most powerful role in a Snowflake account and is intended for performing
    initial setup and managing account-level objects. SECURITYADMIN role can trivially escalate their privileges to that of
    ACCOUNTADMIN. Neither of these roles should be used for running Snowflake stored procedures. A stored procedure should
    be running using a custom role containing only those privileges that are necessary for successful execution of the stored
    procedure. Snowflake executes stored procedures with the privileges of the stored procedure owner or the caller. Role
    that has OWNERSHIP privilege on the stored procedure owns it. To avoid granting a stored procedure inappropriate privileges,
    the OWNERSHIP privilege on the stored procedure run as owner should be assigned to a custom role containing only those
    privileges that are necessary for successful execution of the stored procedure. The ACCOUNTADMIN system role is the most
    powerful role in a Snowflake account; it is intended for performing initial setup and managing account-level objects.
    Users and stored procedures with the SECURITYADMIN role can escalate their privileges to ACCOUNTADMIN. Snowflake stored
    procedures should not run with the ACCOUNTADMIN or SECURITYADMIN roles. Instead, stored procedures should be run using
    a custom role containing only those privileges that are necessary for successful execution of the stored procedure. Snowflake
    supports Programmatic Access Tokens (PATs) as a time-limited alternative to passwords, with additional security mitigations
    such as requiring a network policy. A network policy is required by default to use PATs to log in, but this behavior is
    configurable through authentication policies. Snowflake supports Programmatic Access Tokens (PATs) as a time-limited alternative
    to passwords. PATs expire after 15 days by default, but can be configured to remain active for up to the account’s maximum
    expiration time, which defaults to 365 days. The MAX_EXPIRY_IN_DAYS property can be specified in an authentication policy
    to reduce the maximum allowed expiration time to less than 365 days. PATs can be rotated to extend the expiration time.
    Snowflake also allows a single user to have multiple active PATs to avoid service disruption. Workload identity federation
    is a service-to-service authentication method that lets workloads, such as applications, services, or containers, authenticate
    with Snowflake using their cloud provider’s native identity system, such as AWS Identity and Access Management (AWS IAM)
    roles, Microsoft Entra ID, and Google Cloud service accounts to get an attestation that Snowflake can use and validate.
    WIF is a more secure alternative to passwords, as end users do not have to manage and store their own credentials to Snowflake.
    You can use an authentication policy to control which Snowflake service users can authenticate with workload identity
    federation. You can also create and set the authentication policy so that a workload can authenticate only if it uses
    a specified identity provider, or an account within that provider.
  rationale: The principle of least privilege requires that every identity, including service identities, is only given privileges
    that are necessary to complete its job. If a threat actor finds a way to influence or hijack the stored procedure execution
    flow, they may be able to exploit privileges given to the stored procedure. In the case of an ACCOUNTADMIN or SECURITYADMIN
    roles, that may lead to a full account takeover. Additionally, a mistake in the stored procedure implementation coupled
    with excessive privileges may lead to a reliability incident, e.g. accidentally dropping database objects. The principle
    of least privilege requires that every identity, including service identities, is only given privileges that are necessary
    to complete its job. If a threat actor finds a way to influence or hijack the stored procedure execution flow, they may
    be able to exploit privileges given to the stored procedure. In the case of an ACCOUNTADMIN or SECURITYADMIN roles, that
    may lead to a full account takeover. Additionally, a mistake in the stored procedure implementation coupled with excessive
    privileges may lead to a reliability incident, e.g. accidentally dropping database objects. While PATs are more secure
    than passwords due to their ephemeral nature, PATs are at risk of being accidentally leaked and used by a threat actor
    to log in. A network policy provides a second line of defense to ensure that logins to the user only come from known,
    trusted IP addresses. More frequent rotation of credentials mitigates the risk of a compromised or leaked PAT. It reduces
    the window of opportunity during which a given PAT is valid and can be used by a threat actor. Restricting access to a
    specific cloud provider or a specific list of issuer accounts within that cloud provider can help mitigate risk of misconfiguration
    or insider access attacks. For example, restricting WIF usage to a specific AWS account would prevent a different Azure
    account from accessing the Snowflake account. Additionally, restricting WIF providers can help ensure compliance with
    regulations that dictate where data can be accessed from, particularly concerning specific cloud providers or geographical
    regions.
  impact: Existing stored procedures that are owned by the ACCOUNTADMIN or SECURITYADMIN roles and run with their privileges
    will need to be updated to use a stored procedure specific custom role. If that role does not have all the privileges
    required by the stored procedure, the stored procedure execution may fail. Existing stored procedures that are owned by
    the ACCOUNTADMIN or SECURITYADMIN roles and run with their privileges will need to be updated to use a stored procedure
    specific custom role. If that role does not have all the privileges required by the stored procedure, the stored procedure
    execution may fail. If network policies are not currently required in the account, existing automation that uses PATs
    to connect to users that are not subject to a network policy will fail until the user is assigned a network policy. Existing
    automation and services that rely on PATs may break if they are not updated to use a new PAT before the old PAT expires.
    If the allowed providers or issuers are incorrectly configured, automation from cloud providers or issuer accounts outside
