- id: '1.13'
  title: Ensure that the ACCOUNTADMIN or SECURITYADMIN role is not granted to any custom role
  scoring: scored
  profile:
  - Level 1
  description: The principle of least privilege requires that every identity is only given privileges that are necessary to
    complete its tasks. The ACCOUNTADMIN system role is the most powerful role in a Snowflake account and is intended for
    performing initial setup and managing account-level objects. SECURITYADMIN role can trivially escalate their privileges
    to that of ACCOUNTADMIN. Neither of these roles should be used for performing daily non-administrative tasks in a Snowflake
    account.
  rationale: Granting ACCOUNTADMIN role to any custom role effectively elevates privileges of that role to the ACCOUNTADMIN
    role privileges. Roles that include the ACCOUNTADMIN role can then be mistakenly used in access grants that do not require
    ACCOUNTADMIN privileges thus violating the principle of least privilege and increasing the attack surface. The same logic
    applies to the SECURITYADMIN role.
  impact: Users who lose the ACCOUNTADMIN or SECURITYADMIN privileges granted to them indirectly through a custom role may
    not be able to perform their job duties until they regain privileges they legitimately require through a more scoped down
    role.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/security-access-control-configure.html
  page_start: 55
  audit_raw: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\n1. List all custom roles granted ACCOUNTADMIN\
    \ or SECURITYADMIN(excluding the\nSECURITYADMIN grant to ACCOUNTADMIN):\nSELECT GRANTEE_NAME AS CUSTOM_ROLE,\n PRIVILEGE\
    \ AS GRANTED_PRIVILEGE,\n NAME AS GRANTED_ROLE\nFROM SNOWFLAKE.ACCOUNT_USAGE.GRANTS_TO_ROLES\nWHERE GRANTED_ON = 'ROLE'\n\
    \ AND NAME IN ('ACCOUNTADMIN','SECURITYADMIN')\n AND DELETED_ON IS NULL\n -- ACCOUNTADMIN is always granted SECURITYADMIN\n\
    \ AND NOT (GRANTEE_NAME='ACCOUNTADMIN' AND NAME='SECURITYADMIN');\n2. Ensure that the query above returns no results.\n\
    Required privileges:\nThe query requires the SECURITY_VIEWER role on the Snowflake database."
  remediation: 'Programmatically:

    In a Snowsight worksheet or through the SnowSQL CLI, find all custom roles that are

    granted ACCOUNTADMIN role and revoke that grant.

    REVOKE SECURITYADMIN ON ACCOUNT FROM ROLE <custom_role>;

    REVOKE ACCOUNTADMIN ON ACCOUNT FROM ROLE <custom_role>;'
