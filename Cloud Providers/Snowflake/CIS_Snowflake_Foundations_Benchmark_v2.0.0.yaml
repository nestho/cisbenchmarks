      FROM SNOWFLAKE.ACCOUNT_USAGE.STAGES\nWHERE STAGE_TYPE ILIKE 'External Named'\n AND STORAGE_INTEGRATION IS NULL\n AND\
      \ DELETED IS NULL\nORDER BY STAGE_NAME;\n2. Ensure that the query above returns no results.\nRequired privileges:\n\
      To run the query above, the caller needs the:\n• USAGE pr"
