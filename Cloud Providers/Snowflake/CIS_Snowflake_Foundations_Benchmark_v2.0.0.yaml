- id: '4.11'
  title: Ensure that row-access policies are configured for sensitive data
  scoring: manual
  profile:
  - Level 2
  description: Row access policies are used to determine which rows to return in the query result. Row access policies can
    include conditions and functions in the policy expression to transform the data at query runtime when those conditions
    are met.
  rationale: Row-access policy is a fine-grained access control used to protect table and view rows with special access requirements
    from unauthorized access at query time. It can be used to control access to certain data rows even if a user has access
    to query a table or view.
  impact: Manual and automated workflows relying on having access to all rows in a table or view may be broken unless updated
    prior to application of a row access policy.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/security-row-intro
  - 2. https://docs.snowflake.com/en/user-guide/security-row-using
  page_start: 130
  audit_raw: 'Ensure appropriate row access policies are applied to rows with special access

