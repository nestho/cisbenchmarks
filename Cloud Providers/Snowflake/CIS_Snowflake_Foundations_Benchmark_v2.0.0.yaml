- id: '1.8'
  title: Ensure that users who did not log in for 90 days are disabled
  scoring: scored
  profile:
  - Level 1
  description: Access grants tend to accumulate over time unless explicitly set to expire. Regularly revoking unused access
    grants and disabling inactive user accounts is a good countermeasure to this dynamic. If credentials of an inactive user
    account are leaked or stolen, it may take longer to discover the compromise. In Snowflake an user account can be disabled
    by users with the ACCOUNTADMIN role. A session begins when a user connects to Snowflake and authenticates successfully
    using a Snowflake programmatic client, Snowsight, or the classic web interface. A session is maintained indefinitely with
    continued user activity. After a period of inactivity in the session, known as the idle session timeout, the user must
    authenticate to Snowflake again. Session policies can be used to modify the idle session timeout period. The idle session
    timeout has a maximum value of four hours.
  rationale: Disabling inactive user accounts supports the principle of least privilege and generally reduces attack surface.
    Tightening up the idle session timeout reduces sensitive data exposure risk when users forget to sign out of Snowflake
    and an unauthorized person gains access to their device.
  impact: There is a chance of disabling users or service accounts that are used consistently, but very infrequently, e.g.
    once or twice a year. Such users should be tagged and filtered out in the audit query. Too short idle session timeout
    may result in poor user experience due to users continuously being logged out of their accounts.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/admin-user-management#disabling-orenabling-a-user
  - 1. https://docs.snowflake.com/en/user-guide/session-policies
  - 2. https://docs.snowflake.com/en/user-guide/session-policies-using
  page_start: 40
  audit_raw: "From the UI:\n1. Go to https://app.snowflake.com/ and sign into your Snowflake account.\n2. On the left side\
    \ navigation bar, hover over Governance & security, then click on\nUsers & roles.\n3. Under the Users tab, sort by LAST\
    \ LOGIN.\n4. Ensure that all users whose last login is older than 90 days have STATUS set to\nDisabled.\nProgrammatically:\n\
    In a Snowsight worksheet or through the SnowSQL CLI:\n1. List all users in the account who have not logged in in the past\
    \ 90 days\nSELECT NAME, CREATED_ON, LAST_SUCCESS_LOGIN\nFROM SNOWFLAKE.ACCOUNT_USAGE.USERS\nWHERE DELETED_ON IS NULL\n\
    \ AND NOT DISABLED\n AND CREATED_ON < CURRENT_DATE() - INTERVAL '90 day'\n AND (LAST_SUCCESS_LOGIN IS NULL OR LAST_SUCCESS_LOGIN\
    \ <\nCURRENT_DATE() - INTERVAL '90 day')\n AND NAME != 'SNOWFLAKE';\n2. Ensure the query above does not return any results.\n\
    Programmatically:\nIn the Snowsight UI or from the SnowSQL CLI:\n1. Identify all users with the ACCOUNTADMIN and SECURITYADMIN\
    \ roles with session\ntimeout greater than 15 minutes or not explicitly set, thus defaulting to 240\nminutes. Users need\
    \ to be checked individually as any session policy set at the\nuser-level overrides a session policy set on the account.\n\
    WITH SESSION_POLICIES AS (\n SELECT *\n FROM SNOWFLAKE.ACCOUNT_USAGE.POLICY_REFERENCES A\n JOIN SNOWFLAKE.ACCOUNT_USAGE.SESSION_POLICIES\
    \ B\n ON A.POLICY_ID = B.ID\n WHERE B.DELETED IS NULL\n ),\n USER_SESSION_POLICIES AS (\n SELECT *\n FROM SESSION_POLICIES\n\
    \ WHERE REF_ENTITY_DOMAIN = 'USER'\n ),\n ACCOUNT_SESSION_POLICIES as (\n SELECT *\n FROM SESSION_POLICIES\n WHERE REF_ENTITY_DOMAIN\
    \ = 'ACCOUNT'\n ),\n ADMIN_USERS as (\n SELECT\n DISTINCT\n GRANTEE_NAME\n FROM\n SNOWFLAKE.ACCOUNT_USAGE.GRANTS_TO_USERS\n\
    \ WHERE\n DELETED_ON IS NULL\n AND NOT DISABLED\n AND ROLE IN ('ACCOUNTADMIN','SECURITYADMIN')\n )\n SELECT\n U.GRANTEE_NAME\
    \ AS USER_NAME,\n P_ACC.NAME AS ACCOUNT_POLICY,\n P_ACC.SESSION_IDLE_TIMEOUT_MINS AS ACCOUNT_TIMEOUT_MINS,\n P_ACC.SESSION_UI_IDLE_TIMEOUT_MINS\
    \ AS ACCOUNT_UI_TIMEOUT_MINS,\n P_USER.NAME AS USER_POLICY,\n P_USER.SESSION_IDLE_TIMEOUT_MINS AS USER_TIMEOUT_MINS,\n\
    \ P_USER.SESSION_UI_IDLE_TIMEOUT_MINS AS USER_UI_TIMEOUT_MINS\n FROM ACCOUNT_SESSION_POLICIES P_ACC\n FULL OUTER JOIN\
    \ ADMIN_USERS U ON (1=1)\n LEFT JOIN USER_SESSION_POLICIES P_USER ON (U.GRANTEE_NAME =\nP_USER.REF_ENTITY_NAME)\n WHERE\n\
    \ CASE\n WHEN USER_POLICY IS NULL THEN (ACCOUNT_POLICY IS NULL OR\nACCOUNT_TIMEOUT_MINS > 15 OR ACCOUNT_UI_TIMEOUT_MINS\
    \ > 15)\n ELSE (USER_TIMEOUT_MINS > 15 OR USER_UI_TIMEOUT_MINS)\n END;\n1. Ensure that the query above does not return\
    \ any users.\nNote: Latency for the session policy view can be up to 2 hours."
  remediation: "Programmatically:\nIn a Snowsight worksheet or through the SnowSQL CLI:\nFor each user <user_name> that has\
    \ not logged in in the last 90 days, run the following\nquery to disable their account:\nALTER USER <user_name> SET DISABLED\
    \ = true;\nIf there is a need for re-enabling an account, a user must contact one of the Snowflake\naccount administrative\
    \ users.\nProgrammatically:\nIn the Snowsight UI or from the SnowSQL CLI:\n1. Create the session policy if it does not\
    \ exist yet. Execute the following commands\nto create and set the idle session timeout for highly privileged users in\
    \ your\nSnowflake account:\nCREATE SESSION POLICY <session_policy>\n SESSION_IDLE_TIMEOUT_MINS = 15,\n SESSION_UI_IDLE_TIMEOUT_MINS\
    \ = 15;\n2. Set session policy for every highly privileged user, or for the entire Snowflake\naccount.\n ALTER USER <username>\
    \ SET SESSION POLICY <session_policy>;\n ALTER ACCOUNT SET SESSION POLICY <session_policy>;"
  checks:
  - type: sql
    command: SELECT NAME, CREATED_ON, LAST_SUCCESS_LOGIN
    severity: medium
