- id: '4.3'
  title: Ensure that the DATA_RETENTION_TIME_IN_DAYS parameter is set to 90 for critical data
  scoring: manual
  profile:
  - Level 2
  description: Snowflake Time Travel enables accessing historical data (i.e., data that has been changed or deleted) at any
    point within a defined period. It relies on configuring a data retention period for your critical data assets. The DATA_RETENTION_TIME_IN_DAYS
    object parameter is used to set data retention period on the account, database, schema, or table level. When the MIN_DATA_RETENTION_TIME_IN_DAYS
    parameter is set at the account level, the effective minimum data retention period for an object is determined by MAX(DATA_RETENTION_TIME_IN_DAYS,
    MIN_DATA_RETENTION_TIME_IN_DAYS).
  rationale: Time Travel can be used to recover critical data that was maliciously destroyed or encrypted by ransomware.
  impact: Data retention requires additional storage which will be reflected in the monthly storage charges. For more information
    about storage charges, see Storage Costs for Time Travel and Fail-safe.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/data-time-travel.html
  - 2. https://docs.snowflake.com/en/user-guide/data-cdp-storage-costs.html
  page_start: 112
  audit_raw: "Programmatically:\nFrom a Snowsight worksheet or from the SnowSQL CLI:\n1. List the retention time in days for\
    \ each table:\nSELECT\n TABLE_CATALOG DATABASE,\n TABLE_SCHEMA SCHEMA,\n TABLE_NAME NAME,\n RETENTION_TIME RETENTION_DAYS\n\
    FROM SNOWFLAKE.ACCOUNT_USAGE.TABLES\nWHERE DELETED IS NULL;\n2. Ensure that all tables holding critical data have a RETENTION_DAYS\
    \ value set\nto at least 90."
  remediation: "An organization's compliance, legal and privacy groups may have important inputs on\nhow long certain data\
    \ should and can be retained for. For example, in the context of\nGDPR. It is important to take those inputs into account\
    \ when data retention periods are\ndetermined for critical data.\nProgrammatically:\nFor every non-compliant table with\
    \ critical data set the retention period to 90 days:\nALTER TABLE <table_name>\n SET DATA_RETENTION_TIME_IN_DAYS=90;\n\
    If all tables within a given schema or database contain critical data, the data retention\nperiod can be set on the schema\
    \ or database level correspondingly."
  checks:
  - type: manual_review
    info: "Programmatically:\nFrom a Snowsight worksheet or from the SnowSQL CLI:\n1. List the retention time in days for\
      \ each table:\nSELECT\n TABLE_CATALOG DATABASE,\n TABLE_SCHEMA SCHEMA,\n TABLE_NAME NAME,\n RETENTION_TIME RETENTION_DAYS\n\
      FROM SNOWFLAKE.ACCOUNT_USAGE.TABLES\nWHERE DELETED IS NULL;\n2. Ensure that all tables holding critical data have a\
      \ RETENTION_DAYS value set\nto at least 90."
    severity: medium
- id: '4.4'
  title: Ensure that the MIN_DATA_RETENTION_TIME_IN_DAYS account parameter is set to 7 or higher
  scoring: scored
  profile:
  - Level 2
  - Level 1
  description: The MIN_DATA_RETENTION_TIME_IN_DAYS account parameter can be set by users with the ACCOUNTADMIN role to set
    a minimum retention period for the account. This parameter does not alter or replace the DATA_RETENTION_TIME_IN_DAYS parameter
    value. However it may change the effective data retention time. When this parameter is set at the account level, the effective
    minimum data retention period for an object is determined by MAX(DATA_RETENTION_TIME_IN_DAYS, MIN_DATA_RETENTION_TIME_IN_DAYS).
    Ensure that creating an external stage to access a private cloud storage location requires referencing a storage integration
    object as cloud credentials. Ensure that loading data from or unloading data to a private cloud storage location requires
    using a named external stage that references a storage integration object. If this parameter is not set, then users can
    specify the explicit cloud provider credentials directly in the COPY statement.
  rationale: Setting the MIN_DATA_RETENTION_TIME_IN_DAYS to 7 helps restore data-related objects (tables, schemas, and databases)
    that might have been accidentally or intentionally deleted. Using storage integration removes the need to supply credentials
    when creating external stages or when loading or unloading data. This reduces the risk of those credentials being leaked
    and data compromised. Requiring a storage integration when creating a new stage reduces the risk or data exfiltration
    by accidentally exporting sensitive data to an external stage that does not have the appropriate network security, access
    control, or encryption security and is not approved by the organization’s security team. Using storage integration removes
    the need to supply credentials when loading and unloading data from external stages or when loading or unloading data
    to a private cloud storage location. This reduces the risk of data exfiltration by accidentally exporting sensitive data
    to an external stage that does not have the appropriate network security, access control, or encryption security and is
    not approved by the organization’s security team.
  impact: Data retention requires additional storage which will be reflected in the monthly storage charges. For more information
    about storage charges, see Storage Costs for Time Travel and Fail-safe. Setting the REQUIRE_STORAGE_INTEGRATION_FOR_STAGE_CREATION
    account level parameter to true can break existing manual and automated flows relying on creation of external stages not
    backed by a storage integration. Setting the REQUIRE_STORAGE_INTEGRATION_FOR_STAGE_OPERATION account level parameter to
    true can break existing manual and automated flows relying on loading or unloading data to external stages not backed
    by a storage integration.
  references:
  - 1. https://docs.snowflake.com/en/user-guide/data-time-travel.html
  - 2. https://docs.snowflake.com/en/user-guide/data-cdp-storage-costs.html
  - 1. https://docs.snowflake.com/en/sql-reference/parameters#require-storageintegration-for-stage-creation
  - 2. https://www.snowflake.com/blog/how-to-configure-a-snowflake-account-toprevent-data-exfiltration/
  - 1. https://docs.snowflake.com/en/sql-reference/parameters#require-storageintegration-for-stage-operation
  - 2. https://www.snowflake.com/blog/how-to-configure-a-snowflake-account-toprevent-data-exfiltration/
  page_start: 115
  audit_raw: 'Programmatically:

    In a Snowsight worksheet or from the SnowSQL CLI:

    1. List the value of the parameter:

    SHOW PARAMETERS LIKE ''MIN_DATA_RETENTION_TIME_IN_DAYS'' IN ACCOUNT;

    2. Ensure that the parameter is set to 7 or higher.

    Programmatically:

    In the Snowsight UI or from the SnowSQL CLI:

    1. List the value of the REQUIRE_STORAGE_INTEGRATION_FOR_STAGE_CREATION

    parameter:

    SHOW PARAMETERS LIKE ''REQUIRE_STORAGE_INTEGRATION_FOR_STAGE_CREATION''

    IN ACCOUNT;

    2. Ensure that the parameter is set to true;

    Programmatically:

    In a Snowsight worksheet or from the SnowSQL CLI:

    1. List the value of the REQUIRE_STORAGE_INTEGRATION_FOR_STAGE_OPERATION

    parameter:

    SHOW PARAMETERS LIKE ''REQUIRE_STORAGE_INTEGRATION_FOR_STAGE_OPERATION''

    IN ACCOUNT;

    2. Ensure that the parameter is set to true.'
  remediation: "Programmatically:\nSet the MIN_DATA_RETENTION_TIME_IN_DAYS on the account level to 7 or higher:\nALTER ACCOUNT\n\
