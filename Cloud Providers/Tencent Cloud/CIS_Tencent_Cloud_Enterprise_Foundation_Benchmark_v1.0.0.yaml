  title: Ensure that Deployment Groups Are Isolated by Projects for Different Tenants (Cloud Task [TCT])
  scoring: manual
  profile:
  - Level 1
  description: Failure to isolate deployment groups across tenants may result in cross-tenant data exposure, resource contention,
    or unintended modification of tasks and workflows. Lack of isolation between tenants or services may result in data exposure,
    transaction conflicts, resource contention, or difficulty attributing operational activities during audits.
  rationale: Associating deployment groups with projects ensures tenant-level separation of tasks and instances, reducing
