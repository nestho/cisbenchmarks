- id: '2.10'
  title: Ensure that Login Protection Is Enabled for Root Accounts (Cloud Access Management [CAM])
  scoring: manual
  profile:
  - Level 1
  description: Ensure that login protection (multi-factor authentication or equivalent) is enabled for root accounts. The
    root account typically has full administrative permissions over all resources under the account. If a root account is
    compromised, all associated cloud assets are at very high risk. Enabling login protection adds a second step to the login
    process and reduces the likelihood of successful malicious logins.
  rationale: Enabling multi-factor authentication (MFA) for root account login significantly reduces the risk of account takeover.
    Even if the password is compromised, an attacker cannot gain access without the second factor (for example, MFA device
    or SMS code). This additional verification step blocks the vast majority of automated and credential-based attacks against
    high-privilege accounts.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1813256727106
  page_start: 70
  audit_raw: '1. Log in to the tenant console and navigate to Account Center using an

