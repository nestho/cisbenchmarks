    clearer audit trails for tenant-specific operation. Configuring transaction groups or DTF cluster isolation ensures that
    data, transactions, and resources are restricted to authorized tenants or services. This supports leastprivilege access,
    prevents resource interference, and improves fault isolation and audit traceability.
