- id: '4.3'
  title: Ensure that Encryption Is Enabled for CBS (Cloud Block Storage [CBS])
  scoring: manual
  profile:
  - Level 2
  description: Ensure that Cloud Block Storage (CBS) volumes are encrypted to protect data at rest. Encrypted volumes help
    prevent unauthorized access, data leakage, and tampering, thereby strengthening the confidentiality and integrity of stored
    data.
  rationale: Enabling encryption for CBS volumes improves data security by ensuring that data at rest cannot be accessed or
    modified by unauthorized parties. Encryption mitigates risks such as data leakage, unauthorized retrieval, and exposure
    arising from improper handling or compromised storage resources.
  impact: • Using SSE-KMS encryption will incur additional costs. • Once encrypted, cloud disks cannot be reverted to a non-encrypted
    state.
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1895651662717
  page_start: 110
  audit_raw: '1. Log in to the tenant console and navigate to Cloud Virtual Machine.

    2. In the navigation pane, choose Cloud Block Storage.

    3. Locate the target CBS volume and click its ID/name.

    4. Click the Parameter tab, locate the Encrypt parameter, and verify that:

    • The encryption feature is enabled.

    • The selected encryption algorithm meets organizational security

    requirements.'
  remediation: '1. Log in to the tenant console and navigate to Cloud Block Storage.

    2. Click Create to create a new CBS volume.

    3. In the displayed dialog box, select Enable Cloud Disk Encryption, choose an

    appropriate encryption method, and click OK.

    4. For existing unencrypted volumes, create a new encrypted volume and migrate

    data according to operational requirements, as encryption cannot be enabled

    directly on an existing unencrypted disk.'
