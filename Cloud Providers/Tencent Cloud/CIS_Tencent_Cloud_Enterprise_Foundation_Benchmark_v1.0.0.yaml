- id: '2.1'
  title: Ensure that API Keys Are Not Enabled for High-privilege Subaccounts (Cloud Access Management [CAM])
  scoring: manual
  profile:
  - Level 1
  description: Ensure that high-privilege sub-accounts (for example, sub-accounts with super administrator-level permissions)
    do not have active API keys. API keys are used for programmatic access and are often stored in codes, scripts, or configuration
    files, making them prone to leakage. If a high-privilege API key is compromised, an attacker may gain control over a wide
    range of cloud resources.
  rationale: Disabling API keys for high-privilege sub-accounts reduces the risk that leaked or stolen keys can be used to
    take over or manipulate critical cloud assets. Restricting programmatic access for such accounts supports the principle
    of least privilege and simplifies management and control of high-risk identities.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1813256727106
  page_start: 51
  audit_raw: '1. Log in to the tenant console and navigate to Account Center.

    2. Go to Cloud Access Management > User Management > User.

    3. Locate the target high-privilege sub-account (e.g. users with super administrative

    or similar elevated permissions) and click the username to enter the user details

    page.

    4. Go to the API Key Management tab and verify that no active API keys exist for

    the high-privilege sub-account and all existing API keys have been disabled.'
  remediation: '1. Log in to the tenant console and navigate to Account Center.

    2. Go to Cloud Access Management > User Management > User.

    3. Locate the target high-privilege sub-account and click the username to enter the

    user details page.

    4. Go to the API Key Management tab.

    5. For each existing API key associated with the high-privilege sub-account:

    • Disable the API key, or

    • Delete the API key, if programmatic access is not required.

    6. If programmatic access is required, consider:

    • Using lower-privilege service or automation accounts with scoped

    permissions.

    • Applying key rotation and strong lifecycle management controls to those

    lower-privilege accounts.'
  checks:
  - type: manual_review
    info: '1. Log in to the tenant console and navigate to Account Center.

      2. Go to Cloud Access Management > User Management > User.

      3. Locate the target high-privilege sub-account (e.g. users with super administrative

      or similar elevated permissions) and click the username to enter the user details

      page.

      4. Go to the API Key Management tab and verify that no active API keys exist for

      the high-privilege sub-account and all existing API keys have been disabled.'
    severity: medium
- id: '2.2'
  title: Ensure that Sub-account Passwords Expire Within 365 Days or Less (Cloud Access Management [CAM])
  scoring: manual
  profile:
  - Level 1
  description: Ensure that sub-account password policies enforce periodic password changes. Subaccount passwords are primary
    credentials for interactive access. If passwords are not changed for extended periods (for example, more than 365 days),
    the risk of password compromise and long-term unauthorized use increases. Ensure that sub-accounts are not granted both
    programmatic access (API keys) and user interface (console) access at the same time, unless there is a clearly justified
    business need. Simultaneously enabling both access methods expands the account’s attack surface and can blur the distinction
    between human users and machine/automation accounts, increasing the risk of misuse if credentials are compromised.
  rationale: Regularly updating sub-account passwords reduces the likelihood that compromised credentials can be used for
    extended periods. Enforcing a maximum password validity period (for example, 365 days or less), combined with appropriate
    password complexity and reuse restrictions, strengthens overall account security and limits the impact of credential exposure.
    Allowing both API key access and console password access for the same sub-account increases the scope of permissions that
    can be abused if any credential is leaked or stolen. Separating machine access (API keys) and human access (console) into
    different accounts and limiting each sub-account to a single access method reduces the impact of credential compromise
    and supports better access governance and least privilege.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1813256727106
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1813256727106
  - 2. https://www.tencentcloud.com/document/privatecloud/document/1813256727106
  page_start: 54
  audit_raw: '1. Log in to the tenant console and navigate to Account Center.

    2. Go to Cloud Access Management > User Management > User Settings.

    3. On the User Settings page, verify that:

    • The password validity period is 365 days or less.

    • Other password rules (for example, complexity and reuse limits) comply with

    internal security requirements, if applicable.

    1. Log in to the tenant console and navigate to Account Center.

    2. Go to Cloud Access Management > User Management > User.

    3. For each sub-account to be reviewed, click the username to enter its details

    page.

    4. Verify that only one of the following is enabled:

    • Programmatic access (API Keys): Choose the API Key Management tab and

    at least one key exist and is in Enabled status, or

    • Console (UI) Access: Choose the Security Settings tab and Console

    Password is Enabled.'
  remediation: '1. Log in to the tenant console and navigate to Account Center.

    2. Go to Cloud Access Management > User Management > User Settings to

    enter the security settings page.

    3. In the Password Rule Setting module, click Modify to modify the password

    policy, including:

    • Include At Least: Require the password to contain at least two of the

    following character types: uppercase letters, lowercase letters, digits, or

    special characters. (By default, uppercase and lowercase letters are

    mandatory.)

    • Minimum Password Length: Set the minimum password length. The

    recommended value is 14 characters at least. (Default is 10 characters,

    maximum is 32 characters.)

    • Password Period: Set the password validity period to 365 days or less (a

    value of 0 indicates no restriction; the maximum configurable value is 365

    days).

    • Repeated Limit: Configure password reuse restrictions (default is 1,

    maximum is 24) to prevent reuse of recent passwords. The recommended

    repetition is 5 times or more.

    • Password Blacklist: Configure a blacklist of disallowed strings (up to 10

    entries) to prevent use of easily guessed or sensitive terms.

    4. Click Confirm to save the password rule settings. After these settings take effect,

    sub-account passwords must be reset upon expiration, calculated from the last

    password change.

    1. Log in to the tenant console and navigate to Account Center.

    2. Go to Cloud Access Management > User Management > User.

    3. For each affected sub-account, click the username to enter its details page.

    4. Go to Security Settings > Manage Password to open the Console Access

    window.

    5. Decide on the intended use of the account:

    • Machine/automation account: Keep API keys enabled, and disable console

