- id: '2.4'
  title: Ensure that No API Keys Are Enabled for Root Accounts (Cloud Access Management [CAM])
  scoring: manual
  profile:
  - Level 2
  description: Ensure that API keys are not created or enabled for root accounts. Root accounts typically have full administrative
    permissions over all resources under the account, and API keys provide programmatic access that is often embedded in code,
    scripts, or configuration files, making them prone to leakage. If a root account API key is compromised, an attacker could
    gain extensive control over cloud assets.
  rationale: Disabling API keys for root accounts reduces the risk that leaked or stolen keys can be used to take over or
    manipulate critical cloud resources. Restricting programmatic access for the root account limits the potential impact
    of credential compromise and supports the principle of least privilege by encouraging the use of lower-privilege identities
    for automation.
  impact: Disabling or deleting the root account's API key may cause the root account to be unable to call cloud APIs.
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1813256727106
  page_start: 58
  audit_raw: '1. Log in to the tenant console and navigate to Account Center.

    2. Go to Cloud Access Management > User Management > User.

    3. For each root account, click the username to enter its details page.

    4. Go to the API Key Management tab, and verify that:

    • No API keys exist for the root account, or

    • Any existing keys are in Disabled status.'
  remediation: '1. Log in to the tenant console and navigate to Account Center.

    2. Go to Cloud Access Management > User Management > User.

    3. Click the target root account to enter its details page.

    4. Go to the API Key Management tab.

    5. For each existing API key associated with the root account:

    • Click Disable to disable the key.

    • (Recommended) After disabling, click Delete to permanently delete the key if

    programmatic access is no longer required.'
  checks:
  - type: manual_review
    info: '1. Log in to the tenant console and navigate to Account Center.

      2. Go to Cloud Access Management > User Management > User.

      3. For each root account, click the username to enter its details page.

      4. Go to the API Key Management tab, and verify that:

      • No API keys exist for the root account, or

      • Any existing keys are in Disabled status.'
    severity: medium
- id: '2.5'
  title: Ensure that MFA Is Enabled for Sub-account Operation Protection (Cloud Access Management [CAM])
  scoring: manual
  profile:
  - Level 1
  description: Ensure that sub-accounts are bound to an MFA device and that Operation Protection is configured to require
    MFA verification for sensitive operations. Without MFA binding, sub-accounts cannot use MFA for secondary verification
    during critical operations, increasing the risk of unauthorized or high-impact changes.
  rationale: Requiring MFA for operation protection adds a strong second factor for high-risk actions (such as security configuration
    changes, permission modifications, or asset deletions). This reduces the likelihood of accidental or incorrect operations
    and raises the attack threshold for attackers, thereby limiting the potential impact of destructive actions.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1813256727106
  page_start: 60
  audit_raw: '1. Log in to the tenant console and navigate to Account Center.

    2. Go to Cloud Access Management > User Management > User.

    3. Click the username of the sub-account to be reviewed to enter its details page.

    4. Go to the Security Settings tab and verify that Operation Protection is set

    to MFA Verification Enabled.'
  remediation: '1. Log in to the tenant console and navigate to Account Center.

    2. Go to Cloud Access Management > User Management > User.

    3. Click the username of the sub-account to be configured to enter its details page.

    4. Go to the Security Settings tab, click the modification icon next to Operation

    Protection.

    5. Select Enable MFA Device Verification and follow the prompts to bind an

    MFA device to the sub-account.

    6. Click OK to confirm.'
  checks:
