  title: Ensure that API Keys Are Removed from Unused Accounts (Cloud Access Management [CAM])
  scoring: manual
  profile:
  - Level 1
  description: Ensure that API keys (AK/SK) are not retained for accounts that have never been used to log in and provide
    no operational value. Leaving such unused API keys enabled unnecessarily expands the attack surface and may provide attackers
    with additional entry points if the keys are exposed.
  rationale: Deleting API keys for accounts that have never logged in and are not actively used reduces the risk of data leakage,
    resource abuse, or unauthorized operations performed via compromised credentials. Removing unused keys is a key part of
    good credential hygiene and supports the principle of least privilege.
