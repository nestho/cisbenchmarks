  title: Ensure that Server-Side Encryption Is Enabled for COS Buckets (Cloud Object Storage [COS])
  scoring: manual
  profile:
  - Level 2
  description: Ensure that server-side encryption is enabled for Cloud Object Storage (COS) buckets. Server-side encryption
    protects data at rest by automatically encrypting objects upon upload and decrypting them during access, reducing the
    risk of unauthorized access or data exposure.
  rationale: Enabling server-side encryption ensures that data stored in COS buckets is encrypted before being written to
    disk, enhancing confidentiality and reducing the likelihood of data leakage resulting from unauthorized access or misconfigurations.
  impact: • Using SSE-KMS encryption will incur additional costs. • If SSE-KMS encryption is used, deleting a KMS master key
    may cause irreversible data loss.
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1923792773051
  page_start: 116
  audit_raw: '1. Log in to the tenant console and navigate to Cloud Object Storage.

    2. Choose Bucket List, locate the target bucket, and click Configuration

    Management.

    3. In the navigation pane, choose Security Management > Server-Side

    Encryption, and verify that:

    • Server-side encryption is enabled; and

    • Encryption Method is set to SSE-COS or SSE-KMS.'
  remediation: '1. Log in to the tenant console and navigate to Cloud Object Storage.

    2. Choose Bucket List, locate the target bucket, click its name, and go to the

    details page.

    3. Choose Security Management > Server-Side Encryption, click Modify,

    select the required encryption method (SSE-COS or SSE-KMS), and click Save.'
