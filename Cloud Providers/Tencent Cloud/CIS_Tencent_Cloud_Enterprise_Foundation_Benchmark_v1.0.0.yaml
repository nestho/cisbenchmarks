- id: '1.8'
  title: Ensure that SSH Key-based Authentication Is Used for Linux CVM Login (Cloud Virtual Machine [CVM])
  scoring: manual
  profile:
  - Level 2
  - Level 1
  description: Ensure that SSH key-based authentication is used for logging in to Linux CVM instances instead of traditional
    password authentication. SSH key authentication is more secure and convenient, and helps prevent unauthorized access caused
    by weak or compromised passwords. (Only applicable for Linux machines) Ensure that each CVM instance is bound to an appropriate
    security group and that the security group rules are configured based on the principle of least privilege. Trusted IP
    ranges should be explicitly allowed for required service ports to ensure secure access, and unnecessary or broad access
    must be avoided.
  rationale: SSH key-based login provides stronger authentication than password-based login and is resistant to brute-force
    attacks. By eliminating the need to enter a password during login and relying on cryptographic key pairs, the risk of
    credential guessing and credential stuffing is significantly reduced, thereby enhancing the overall security of CVM instances.
    Security groups act as virtual firewalls that control network traffic to and from CVM instances. Configuring security
    group rules according to the principle of least privilege can reduce exposure to malicious or unauthorized IP addresses,
    lowering the risk of network attacks and unauthorized access to hosts.
  impact: Enabling SSH key-based login for Linux CVM will disable password login by default. After a CVM instance is bound
    to a security group, IP addresses that are not permitted by the security group rules will be unable to access the instance.
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1446556478517
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1446556478517
  page_start: 32
  audit_raw: '1. Log in to the tenant console and navigate to Cloud Virtual Machine.

    2. Go to Instances and identify the Linux CVM instances that require SSH access.

    3. Verify that an SSH key is associated with the instance (for example, on the

    instance details page under Login Information or SSH Key).

    4. From an administrator workstation, attempt to log in to a target Linux CVM

    instance using SSH key authentication:

    • Run

    ssh -i <private_key_file_path> <user>@<host>

    • Verify that login using the SSH key is successful.

    1. Log in to the tenant console and navigate to Cloud Virtual Machine.

    2. On the Instances page, click the ID or name of the target CVM instance to enter

    the instance details page.

    3. On the instance details page, click More > Configure Security Group in the

    upper-right corner to verify that the CVM instance is bound to at least one

    security group.

    4. Review the rules of the bound security group(s) and verify that:

    • Only trusted IP address ranges are allowed to access required service ports.

    • Unnecessary or overly broad rules (e.g. wide-open access to all ports or

    0.0.0.0/0 where it is not required) are not configured.'
  remediation: 'Creating SSH Keys

    1. Log in to the tenant console and navigate to Cloud Virtual Machine.

    2. In the left navigation pane, click SSH Key.

    3. Select Create Key.

    4. Choose one of the following methods:

    • Create Key Pair: Enter the key name and click Confirm.

    • Use an existing public key: Enter the key name and paste the existing public

    key, then click Confirm.

    5. In the pop-up window, click Download to download the private key. Download

    must be completed within 10 minutes. Store the private key securely.

    Binding Keys to CVM Instances/Unbinding Keys from CVM Instances

    1. Log in to the tenant console and navigate to Cloud Virtual Machine.

    2. In the left navigation pane, go to SSH Key.

    3. Select an SSH key and click Bind/Unbind CVM.

    4. Select a region, then:

    • For binding, select the CVM instances to which the SSH key should be

    bound.

    • For unbinding, deselect (cancel) the CVM instances from the list on the right.

    5. Click Confirm.

    6. Wait for the delivery of the SSH key to complete, and verify the prompt indicating

    whether the operation completed successfully.

    Creating a Security Group

    1. Log in to the tenant console and navigate to Cloud Virtual Machine.

    2. In the left navigation pane, go to Security Group.

    3. Click Create, then select Custom for Template, enter a security group name,

    and click OK.

    4. Click Set Rule Now and configure rules as follows:

    • Add policies to deny access from all IP address to all ports by default.

    • Add allow rules for trusted IP address ranges and required service ports

    based on business needs.

    Binding an Instance to a Security Group

    1. Log in to the tenant console and navigate to Cloud Virtual Machine.

    2. In the left navigation pane, go to Instances, then click the ID or name of a CVM

    instance to enter the instance details page.

    3. On the instance details page, click More > Configure Security Group in the

    upper-right corner.

    4. In the pop-up window, select the new security group name(s) (multiple selections

    are allowed), and click Confirm.'
  checks:
  - type: manual_review
    info: '1. Log in to the tenant console and navigate to Cloud Virtual Machine.

      2. Go to Instances and identify the Linux CVM instances that require SSH access.

      3. Verify that an SSH key is associated with the instance (for example, on the

      instance details page under Login Information or SSH Key).

      4. From an administrator workstation, attempt to log in to a target Linux CVM

      instance using SSH key authentication:

      • Run

      ssh -i <private_key_file_path> <user>@<host>

      • Verify that login using the SSH key is s'
    severity: medium
- id: '1.10'
  title: Ensure that MariaDB Instances Are Bound to Security Groups with Least-Privilege Rules (MariaDB [MariaDB])
  scoring: manual
  profile:
  - Level 1
  description: Ensure that each MariaDB instance is bound to an appropriate security group and that the security group rules
    are configured based on the principle of least privilege. Trusted IP address ranges should be explicitly allowed for required
    database service ports, and unnecessary or broad access must be avoided. Ensure that each TDSQL for MySQL instance is
    bound to an appropriate security group and that the security group rules are configured based on the principle of least
    privilege. Trusted IP addresses should be explicitly allowed for required database service ports, and unnecessary or broad
    access must be avoided. Ensure that intrusion prevention policies are configured and enabled in CWP, including file (virus/Trojan)
    scanning rules and network attack detection rules. Proper configuration helps detect and block malicious files and network
    attacks on protected hosts in a timely manner. Ensure that scheduled vulnerability scanning policies are configured and
    enabled in CWP. Properly configured policies allow hosts to be scanned at regular intervals so that security vulnerabilities
    can be identified and addressed in a timely manner. Ensure that security baseline check policies are configured and enabled
    in CWP. Security baseline checks evaluate host configuration against defined baseline requirements and help identify configuration
    compliance issues in a timely manner. Ensure that security groups are created and used to control network access to CVM
    instances. Security group rules must be configured based on the principle of least privilege so that only trusted IP address
    ranges and required ports are allowed, reducing unnecessary exposure of CVM assets.
  rationale: Security groups act as virtual firewalls that control network traffic to and from MariaDB instances. Configuring
    the allowlist policy for security groups according to the principle of least privilege limits access to trusted IP addresses
    only, reducing exposure to malicious or unauthorized sources and lowering the risk of network attacks against the database
    service. Security groups act as virtual firewalls that control network traffic to and from TDSQL for MySQL instances.
    Configuring the allowlist policy for security groups according to the principle of least privilege limits access to trusted
    IP addresses only, reducing exposure to malicious or unauthorized sources and lowering the risk of network attacks against
    the database service. Intrusion prevention policies in CWP provide file-based and network-based protection by scanning
    for malicious files (such as Trojans and viruses), monitoring critical paths in real time, and detecting attempted network
    attacks. Correctly configured and enabled policies improve the ability to identify and respond to security threats early,
    reducing the risk of compromise and lateral movement within the environment. Scheduled vulnerability scanning helps detect
    known vulnerabilities in operating systems, middleware, and applications before they can be exploited. Enabling regular
    scanning and vulnerability protection improves visibility into the security posture of hosts, supports timely remediation,
    and reduces the risk of compromise due to unpatched vulnerabilities. Security baseline check policies provide continuous
    visibility into whether hosts comply with defined security configuration standards (for example, system hardening, service
    configuration, and account policies). Enabling and properly configuring these policies helps detect deviations from the
    required baseline early, supports remediation, and reduces the risk of compromise caused by insecure configurations. Security
    groups act as virtual firewalls that control inbound and outbound traffic to CVM instances. Configuring allowlist-based
    security group policies according to the principle of least privilege limits access to trusted sources and required services
    only, thereby reducing the risk of network attacks and unauthorized access to CVM instances.
  impact: After a MariaDB instance is bound to a security group, IP addresses that are not permitted by the security group
    rules will be unable to access the instance. After a TDSQL for MySQL instance is bound to a security group, IP addresses
    that are not permitted by the security group rules will be unable to access the instance. Enabling intrusion prevention
    may cause legitimate files to be incorrectly quarantined, but they can be restored from the isolation list. Enabling scheduled
    vulnerability scanning may generate additional network traffic, potentially causing fluctuations in traffic patterns.
    Enabling baseline check may generate additional network traffic, potentially causing fluctuations in traffic patterns.
    After binding a security group, IP addresses that are not permitted by the security group rules will be unable to access
    the corresponding resources.
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1447389562602
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1447505175378
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1447254798889
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1447254798889
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1447254798889
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1446556478517
  page_start: 36
  audit_raw: '1. Log in to the tenant console and navigate to MariaDB (TDSQL).

    2. In the left navigation pane, click Instance List.

    3. Click the ID/name of an instance or click Manage under Operation, and then go

    to Data Security > Security Group.

    4. Verify that the instance is bound to at least one security group.

    5. Review the rules of the bound security group(s) and verify that:

