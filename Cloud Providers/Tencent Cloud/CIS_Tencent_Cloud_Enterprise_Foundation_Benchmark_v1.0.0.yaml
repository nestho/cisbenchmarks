    Replication and verify that:

    • Cross-region replication is enabled; and

    • At least one rule exists under Inter-Cloud Replication or Cross-Cloud

    Replication.'
  remediation: '1. Log in to the tenant console and navigate to Cloud Object Storage.

    2. Choose Bucket List, locate the target bucket, and click its name go to the

    details page.

    3. Choose Fault Tolerance and Disaster Recovery Management >

    Versioning, click Modify, enable Current Status, and click Save.

