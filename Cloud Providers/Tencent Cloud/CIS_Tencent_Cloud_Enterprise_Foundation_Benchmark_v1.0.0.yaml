- id: '5.3'
  title: Ensure that High-Risk Script and Command Detection Is Enabled (Application Operations Platform)
  scoring: manual
  profile:
  - Level 2
  - Level 1
  description: Delivering high-risk commands (such as shutdown, reboot, or delete operations) through scripts without interception
    may result in unintended changes or service impact. Verification is required to ensure that command detection and blocking
    rules are properly configured. Lack of independent roles and granular access control for producers and consumers may lead
    to unauthorized access, data disorder, or invalid business data across Kafka topics. Configuring independent roles for
    each producer and consumer can largely avoid issues such as data disorder and invalid business data caused by unclear
    permissions. Absence of independent roles and granular permissions for producers and consumers may lead to unauthorized
    access, data disorder, or invalid business data within namespace resources. Lack of separate user accounts and explicit
    permissions for producers and consumers may lead to unauthorized access, data disorder, or invalid business data within
    designated cluster.
  rationale: Enabling high-risk command detection helps prevent accidental or unauthorized execution of commands that may
    lead to service disruption, data loss, or other operational risks. Configuring distinct roles and ACL policies enforces
    permission isolation, supports multi-team collaboration, and upholds the principle of least privilege. This minimizes
    unauthorized operations and protects the integrity of messaging data. This mechanism effectively achieves permission isolation
    between different business units, ensuring the security of the messaging system while meeting resource management requirements
    in multi-team collaboration scenarios. By adhering to the principle of least privilege, it fundamentally avoids data disorder
    caused by unauthorized access. Configuring separate roles with explicit production and consumption permissions enforces
    isolation between business units and supports the principle of least privilege. This reduces the risk of unauthorized
    operations and helps maintain messaging integrity. Configuring distinct user accounts with clearly defined permissions
    enforces isolation between different business units and supports the principle of least privilege. This reduces the risk
    of unauthorized operations and helps maintain the stability and integrity of messaging workloads.
  impact: If not enabled, unauthorized access or incorrect permission usage may lead to data tampering, message loss, or service
    instability.
