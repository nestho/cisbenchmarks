  - Level 2
  description: Ensure that cross-region replication is enabled for Cloud Object Storage (COS) buckets. Cross-region replication
    automatically and asynchronously copies new and updated objects—including metadata and version information—from a source
    bucket to a destination bucket in another region. Replication helps maintain identical object copies and supports disaster
    recovery by ensuring data redundancy across geographically separated locations.
  rationale: Enabling cross-region replication enhances data durability and disaster recovery readiness. Maintaining synchronized
    replicas across regions reduces the risk of data loss and helps minimize service disruption during regional failures,
    outages, or accidental deletions.
  impact: Enabling bucket replication will incur additional costs due to cross-region data replication and storage.
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1923792773051
