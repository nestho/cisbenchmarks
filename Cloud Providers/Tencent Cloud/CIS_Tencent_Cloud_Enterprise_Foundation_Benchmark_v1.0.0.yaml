    • Mobile Verification Code, or

    • Enable MFA Device Verification

    4. Follow the prompts to bind an MFA device or mobile number to complete the

    setup.

    5. Confirm that Login Protection now shows MFA Verification Enabled or

    SMS Code Verification Enabled.'
