  scoring: manual
  profile:
  - Level 1
  description: Ensure that sub-accounts are bound to an MFA device and that Login Protection is configured to require MFA
    verification during login. Without MFA binding, sub-accounts cannot use MFA for secondary verification at login, increasing
    the risk of account compromise through stolen or guessed passwords. Ensure that sub-account API keys that have not been
