    3. Click on the username to go to the user details.

    4. Click on the Associate Policy tab and for each attached policy:

    • If needed, click Associate Policy and attach more granular or restricted

    policies that align with the principle of least privilege.

    • Unassociate policies for any permissions that are unnecessary or exceed the

    user''s job requirements.

    5. Validate that the resulting policy set grants only the minimum required

    permissions for that sub-account.

    1. Log in to the tenant console and navigate to Cloud Load Balancer.

    2. Choose LB Instance List and locate the abnormal CLB instance.

    3. Click Configure in the Health Status column.

    4. Click Create.

    5. Select a protocol, enter a port number, and then click OK.'
  checks:
  - type: manual_review
    info: '1. Log in to the tenant console and choose Account Center.

      2. Go to Cloud Access Management > User Management > User.

      3. For each sub-account to be reviewed, click the username to enter the user

      details page.

      4. Go to the Associated Policy tab.

      5. Review all attached permission policies and verify that:

      • Only policies required for the user''s current job role are associated.

      • No broad, high-privilege, or unnecessary policies (for example, full-admin or

      wide resource access) are attached.

      1. Log'
    severity: medium
- id: '3.2'
  title: Ensure that CLB Does Not Forward High-Risk Ports (Cloud Load Balancer [CLB])
  scoring: manual
  profile:
  - Level 1
  description: Ensure that Cloud Load Balancer (CLB) instances do not expose high-risk management or internal service ports
    to the public network. CLB listeners should only forward required public service ports (for example, 80 and 443), and
    must not forward administrative or internal ports (for example, SSH, RDP, and database ports) directly to the internet.
  rationale: Blocking high-risk port forwarding on CLBs reduces the exposure of internal management and sensitive services
    to the public network. This lowers the likelihood of malicious scanning, brute-force attacks, and exploitation attempts
    against management interfaces or backend services, and supports the principle of minimal service exposure.
  impact: ''
  references: []
  page_start: 83
  audit_raw: '1. Log in to the tenant console and navigate to Cloud Load Balancer.

    2. Choose LB Instance List and click the link of a desired instance.

    3. Click the Listener Management tab for each listener configured on the CLB

    instance:

    • Review the listening port and identify any ports classified as high-risk (for

    example, SSH, RDP, and database ports).

    • Verify that only necessary public service ports are exposed to the internet.'
  remediation: '1. Log in to the tenant console and navigate to Cloud Load Balancer.

    2. Choose LB Instance List, locate the target CLB instance, and click

    Configure in the Health Status column.

    3. For each listener exposing high risk or unnecessary ports:

    • Delete the listener if not required, or

    • Modify the listener to use only organization-approved service ports.

    4. To create a listener, click Create. Select a protocol, enter a port number (only

    service ports are allowed), and click OK.'
  checks:
  - type: manual_review
    info: '1. Log in to the tenant console and navigate to Cloud Load Balancer.

      2. Choose LB Instance List and click the link of a desired instance.

      3. Click the Listener Management tab for each listener configured on the CLB

      instance:

      • Review the listening port and identify any ports classified as high-risk (for

      example, SSH, RDP, and database ports).

      • Verify that only necessary public service ports are exposed to the internet.'
    severity: medium
- id: '3.3'
  title: Ensure that No CLB Listeners Allow Ingress from 0.0.0.0/0 to Non-Service Ports (Cloud Load Balancer [CLB])
  scoring: manual
  profile:
  - Level 1
  description: Ensure that Cloud Load Balancer (CLB) instances do not allow unrestricted (0.0.0.0/0) access to non-service
    ports. CLB listeners and access control settings should be configured so that only required service ports (for example,
    80 and 443, or other approved application ports) are accessible, and non-service or internal ports are not exposed to
    all IP address ranges.
  rationale: Allowing all IP addresses (0.0.0.0/0) to access non-service ports on CLB instances increases the attack surface
    and exposes internal or sensitive services to malicious scanning and exploitation attempts. Applying an allowlist based
    on the principle of least privilege ensures that only trusted sources can reach specific ports, thereby reducing the risk
    of network attacks and unauthorized access.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1955713987269
  page_start: 85
  audit_raw: '1. Log in to the tenant console and navigate to Cloud Load Balancer.

    2. Choose LB Instance List and click the link of a desired instance.

    3. Choose Listener Management and verify that non-service ports in the listener

    are not open to all IP addresses.'
  remediation: '1. Log in to the tenant console and navigate to Cloud Load Balancer.

    2. Choose LB Instance List and click Configure in the Health Status column.

    3. Remove unrestricted access to non-service ports.

    4. Click Create. Select a protocol, enter a port number (only service ports are

    allowed), and click OK.'
  checks:
  - type: manual_review
    info: '1. Log in to the tenant console and navigate to Cloud Load Balancer.

      2. Choose LB Instance List and click the link of a desired instance.

      3. Choose Listener Management and verify that non-service ports in the listener

      are not open to all IP addresses.'
    severity: medium
- id: '3.4'
  title: Ensure that the Certificate Associated with CLB Is Within the Validity Period (Cloud Load Balancer [CLB])
  scoring: manual
  profile:
  - Level 1
  description: Certificates managed within the CLB service should be monitored for expiration and removed or updated promptly
    once they expire. Ensure that each Cloud File Storage (CFS) file system is associated with an appropriate permission group
    and that the permission group rules are configured according to the principle of least privilege. Only trusted IP address
    ranges should be allowed to access required service ports, and unnecessary or overly broad access (for example, allowing
    all IP addresses) must be avoided. Ensure that each CloudDB for Redis® instance is associated with an appropriate security
    group and the security group rules are configured according to the principle of least privilege. Only trusted IP address
    ranges should be allowed to access the required Redis service ports, and broad or unnecessary access (for example, allowing
    all IP addresses) must be avoided. Ensure that security groups do not contain overly permissive inbound rules (for example,
    allowing all IP ranges such as 0.0.0.0/0 or all ports). Overly broad security group rules can expose internal services
    directly to the internet and significantly increase the risk of unauthorized access and attack.
  rationale: 'Ensure that the certificate associated with the CLB is within its validity period to reduce service interruptions
    caused by certificate expiration and prevent situations where users cannot access the website normally. CFS permission
    groups function as virtual firewalls controlling network access to file systems. Configuring allowlist rules based on
    the principle of least privilege helps to: • Limit access to only trusted IP address ranges and required ports. • Reduce
    exposure to malicious or unauthorized access attempts. • Lower the risk of data leakage, tampering, or abuse of shared
    file resources. Security groups act as virtual firewalls controlling network traffic to and from Redis® instances. Configuring
    allowlist rules based on the principle of least privilege helps to: • Restrict access to only trusted IP addresses ranges
    and required ports. • Reduce exposure to malicious or unauthorized access attempts. • Lower the risk of data leakage,
    data tampering, or service abuse. Security groups act as virtual firewalls controlling network traffic to and from cloud
    resources. Applying the principle of least privilege to security group rules helps to: • Prevent unrestricted exposure
    of services to the public internet. • Limit access to trusted IP address ranges and required ports only. • Reduce the
    likelihood of malicious scanning, exploitation, or unauthorized access.'
  impact: After a permission group is associated with a CFS file system, applications or users may have their requests blocked
    and error code 403 is returned if they lack necessary permissions required for accessing the file system.
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1955713987269
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1895695660852
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1814651321835
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1446556478517
  page_start: 87
  audit_raw: '1. Log in to the tenant console and navigate to Cloud Load Balancer.

    2. Choose Certificate Management.

    3. In the certificate list, locate the Expiration At column for each certificate.

    4. Verify that:

    • Each certificate is currently valid.

    • The remaining validity period meets the organization certificate management

    policy (e.g. the certificate is valid for at least 15 days).

    1. Log in to the tenant console and navigate to Cloud File Storage.

    2. Choose File System List and click the file system ID to be reviewed to open

    its details page.

    3. Click Mount Point Info and verify that for every mount point:

    • A permission group is configured within the Permission Group parameter.

    • The associated permission group''s rules comply with the principle of least

    privilege (e.g. only trusted IP address ranges are allowed and only required

    service ports are open).

    1. Log in to the tenant console and navigate to CloudDB for Redis®.

    2. Choose Instance List, locate the corresponding instance, and click More on

    the right.

    3. Click Security Group and verify that:

    • At least one security group is associated with the instance.

    • The rules in the associated security groups comply with the principle of least

    privilege (e.g. only trusted IP address ranges are allowed and only required

    service ports are open).

    1. Log in to the tenant console and navigate to Cloud Virtual Machine.

    2. For each security group to be reviewed, click on the security group name to enter

    its details page.

    3. Review all inbound rules and verify that:

    • No rule allows all IP ranges (for example, 0.0.0.0/0 or ::/0) to access all ports.

    • Where public access is required, rules are restricted to specific IP ranges and

    necessary service ports only.'
  remediation: '1. Log in to the tenant console and navigate to Cloud Load Balancer.

    2. Choose Certificate Management.

    3. For each expired or about to expire certificate:

    • Click Update on the right of the corresponding certificate.

    • In the displayed Update Certificate dialog box, complete the required

    certificate information.

    • Click Update to replace the certificate.

    Creating a New Permission Group

    1. Log in to the tenant console and navigate to Cloud File Storage.

    2. Go to Permission Group and click Create.

    3. Enter a permission group name and remarks and click OK.

    4. Click the newly created permission group and then click Add Rule to:

    • Allow only trusted IP address ranges.

    • Restrict access to the minimum required ports and protocols.

    Associating a New Permission Group with the CFS File System

    1. Go to File System List and click the ID for the target CFS file system.

    2. Click Mount Point Info, locate Permission Group, and select the appropriate

    permission group.

    3. Click Save.

    Creating a Security Group:

    1. Log in to the tenant console and navigate to Cloud Virtual Machine.

    2. In the navigation pane, choose Security Group.

    3. Click Create, select Custom for Template, enter a security group name, and

    click OK.

    4. Click Set Rules Now and configure rules as follows:

    • Add default deny rules so that access from all IP addresses to all ports is

    blocked by default.

    • Add allow rules for trusted IP address ranges and the required service ports

    based on business needs.

    Associating the Security Group with the Instance:

    1. For new instances, during creation, select an existing or newly created security

    group to associate with the instance.

    2. For existing instances, go to CloudDB for Redis® > Instance List, locate the

    target instance, click More > Security Group, and select the appropriate

    security groups.

    3. Click OK to save the configuration.

    1. Log in to the tenant console and navigate to Cloud Virtual Machine.

    2. Choose Security Group and click on the target security group to enter its

    details page.

    3. On the Inbound Rule tab, identify any rule that:

    • Allows all IP ranges (for example, 0.0.0.0/0 or ::/0).

    • Grants access to all ports or unnecessary ports.

    4. Delete or modify such rules as follows:

    • Replace overly broad IP ranges with specific trusted IP address ranges or

    subnets.

    • Restrict allowed ports to only the required service ports.

    5. Save the updated security group configuration and confirm that no inbound rule

    allows unrestricted access from all IP ranges.'
  checks:
  - type: manual_review
    info: '1. Log in to the tenant console and navigate to Cloud Load Balancer.

      2. Choose Certificate Management.

      3. In the certificate list, locate the Expiration At column for each certificate.

      4. Verify that:

      • Each certificate is currently valid.

      • The remaining validity period meets the organization certificate management

      policy (e.g. the certificate is valid for at least 15 days).

      1. Log in to the tenant console and navigate to Cloud File Storage.

      2. Choose File System List and click the file system '
    severity: medium
- id: '3.8'
  title: Ensure that No Security Groups Allow Ingress from 0.0.0.0/0 to Non-Service Ports (Cloud Virtual Machine [CVM])
  scoring: manual
  profile:
  - Level 1
  description: Ensure that security group rules do not allow open access from all IP segments (for example, 0.0.0.0/0) to
    non-service ports on CVM instances. Security groups act as virtual firewalls and should be configured according to the
    principle of least privilege so that only trusted IP addresses and required service ports are allowed.
  rationale: Restricting inbound access in security groups to only necessary service ports and trusted IP ranges helps prevent
    exposure of internal or administrative ports (for example, database or management ports) to the public internet, reduces
    the attack surface available to malicious scanners and exploit attempts, and limits the impact of unauthorized access
    attempts, thereby improving overall network security for CVM instances.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1446556478517
  page_start: 95
  audit_raw: '1. Log in to the tenant console and navigate to Cloud Virtual Machine.

    2. Choose Security Group.

    3. For each security group associated with CVM instances, click on the security

    group ID or name to open its details page.

    4. Click the Inbound Rule tab.

    5. Verify that:

    • There are no inbound rules that allow 0.0.0.0/0 (or other "any" IP ranges,

    such as ::/0) to access non-service ports.

    • Any rules using 0.0.0.0/0 are strictly limited to approved public service ports

    only (for example, HTTP/HTTPS if required by business needs).'
  remediation: '1. Log in to the tenant console and navigate to Cloud Virtual Machine.

    2. Choose Security Group and click on the security group ID or name to go to its

    details page.

    3. On the Inbound Rule tab, identify any rule that:

    • Uses 0.0.0.0/0 (or equivalent "any" IP range), and

    • Allows access to non-service ports or a wide range of ports (for example, all

    ports).

    4. Modify or delete such rules as follows:

    • Restrict the allowed ports to only necessary service ports; and

    • Where possible, replace 0.0.0.0/0 with specific trusted IP address ranges or

    subnets.

    5. Save the updated security group configuration and confirm that no inbound rule

    permits open access from all IP segments to non-service ports.'
  checks:
  - type: manual_review
    info: '1. Log in to the tenant console and navigate to Cloud Virtual Machine.

      2. Choose Security Group.

      3. For each security group associated with CVM instances, click on the security

      group ID or name to open its details page.

      4. Click the Inbound Rule tab.

      5. Verify that:

      • There are no inbound rules that allow 0.0.0.0/0 (or other "any" IP ranges,

      such as ::/0) to access non-service ports.

      • Any rules using 0.0.0.0/0 are strictly limited to approved public service ports

      only (for example, HTTP/HTTPS i'
    severity: medium
- id: '3.9'
  title: Ensure Default Domain Names Are Set for HTTP/HTTPS Listeners (Cloud Load Balancer [CLB])
  scoring: manual
  profile:
  - Level 1
  description: 'Ensure that a default domain (Default Server) is configured for each HTTP/HTTPS listener on CLB instances.
    When a client request does not match any configured domain name for that listener, CLB forwards the request to the default
    domain. By defining forwarding rules for the default domain, unmatched or potentially illegitimate requests can be directed
    to a blackhole route or other non-sensitive target, preventing them from reaching backend real servers (RS). Ensure that
    network ACLs associated with subnets do not contain inbound rules that allow unrestricted traffic from any source. Inbound
    rules that permit all protocols and all ports from 0.0.0.0/0 (action: Allow) expose the subnet to unnecessary risk and
    broad external access. Network ACLs should be configured according to the principle of least privilege, allowing only
    required traffic from trusted IP ranges.'
  rationale: Configuring a default domain for CLB listeners ensures that requests with unmatched or malformed host headers
    are not accidentally routed to production backend servers. Redirecting such traffic to a blackhole route or controlled
    endpoint reduces the risk of unauthorized access, information leakage, or misuse of backend services caused by unexpected
    or malicious requests. Network ACLs provide subnet-level access control. Allowing all inbound traffic from 0.0.0.0/0 removes
    meaningful access restrictions and increases the likelihood of malicious scanning, exploitation, and unauthorized access
    to resources within the subnet. Restricting inbound rules to specific protocols, ports, and trusted source IP ranges (allowlist
    model) aligns with the principle of least privilege and reduces the attack surface for workloads hosted in the VPC.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1955713987269
  page_start: 97
  audit_raw: '1. Log in to the tenant console and navigate to Cloud Load Balancer.

    2. Choose LB Instance List. Locate the CLB instance to be reviewed and click

    its ID to go to the details page.

    3. Click Listener Management.

    4. In the HTTP/HTTPS Listener area, for each HTTP/HTTPS listener:

    • Verify that the default domain name has been configured.

    • Review the forwarding rule for the default domain and confirm that

    unmatched/illegal requests are not directed to production backend RS.

    1. Log in to the tenant console and navigate to Virtual Private Cloud.

    2. Choose Subnet. Locate and click the subnet to be reviewed to open the subnet

    details page.

    3. Click the ACL Rule tab (or equivalent network ACL configuration view).

    4. Review the inbound rules and verify that:

    • No rule allows all traffic from 0.0.0.0/0 (for example, all protocols, all ports,

    action = Allow).

    • Inbound rules are restricted to required protocols, ports, and trusted source IP

    ranges.'
  remediation: '1. Log in to the tenant console and navigate to Cloud Load Balancer.

    2. Choose LB Instance List. Locate the CLB instance to be reviewed and click

    its ID to go to the details page.

    3. Click Listener Management.

    4. In the HTTP/HTTPS Listener area:

    • If there are no listeners, create an HTTP/HTTPS listener as required.

    • For each HTTP/HTTPS listener, enable the default domain feature (for

    example, set Default Domain Name to Enable).

    • Configure a default domain name and define forwarding rules so that

    unmatched or illegal requests are sent to a blackhole route or an appropriate

    non-sensitive target backend.

