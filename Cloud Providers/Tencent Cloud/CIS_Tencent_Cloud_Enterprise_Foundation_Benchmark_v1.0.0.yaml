  title: Ensure that Sub-account API Keys Are Rotated Every 90 Days or Less (Cloud Access Management [CAM])
  scoring: manual
  profile:
  - Level 1
  description: Ensure that sub-account API keys (AK/SK) are rotated regularly (for example, at least every 90 days). Sub-account
    API keys are primary credentials for programmatic access. If keys are not changed for an extended period, the likelihood
    and impact of key compromise increase.
  rationale: Periodic rotation of sub-account API keys reduces the window of opportunity for attackers to exploit exposed
    or leaked credentials. Regular key updates help mitigate risks such as data leakage, resource abuse, and unauthorized
    operations, and form an important part of secure credential lifecycle management.
  impact: Rotating a sub-user's API key will cause the original API key to become invalid and unusable.
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1813256727106
