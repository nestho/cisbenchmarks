- id: '2.11'
  title: Ensure that No More Than One Active Access Key Exists per Sub-account (Cloud Access Management [CAM])
  scoring: manual
  profile:
  - Level 2
  description: Ensure that each sub-account has no more than one active API key (AK/SK). Maintaining multiple API keys for
    the same sub-account increases the credential exposure surface and complicates management. If any of these keys are leaked,
    attackers gain additional opportunities to abuse programmatic access.
  rationale: Limiting each sub-account to a single API key (or none, where not required) reduces the risk of key leakage,
    simplifies key lifecycle management, and improves traceability of API usage. Fewer active keys per identity aligns with
    the principle of least privilege and helps contain potential compromise.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1813256727106
  page_start: 72
  audit_raw: '1. Log in to the tenant console and navigate to Account Center.

    2. Go to Cloud Access Management > User Management > User.

    3. For each sub-account to be reviewed, click the username whose API key count

    needs to be checked.

    4. Go to the API Key Management tab and review the list of API keys.

    5. Verify that the total number of API keys (enabled or existing) for the target subaccount is no more than one.'
  remediation: '1. Log in to the tenant console and navigate to Account Center.

    2. Go to Cloud Access Management > User Management > User.

    3. Click the username of the target sub-account.

    4. Go to the API Key Management tab.

    5. For each additional API key that is not strictly required:

    • Click Disable to immediately prevent further use of the key.

    • Click Delete after confirmation that it is no longer required for business

    purposes.

    6. Ensure that no more than one API key remains for the sub-account after cleanup.'
  checks:
  - type: manual_review
    info: '1. Log in to the tenant console and navigate to Account Center.

      2. Go to Cloud Access Management > User Management > User.

      3. For each sub-account to be reviewed, click the username whose API key count

      needs to be checked.

      4. Go to the API Key Management tab and review the list of API keys.

      5. Verify that the total number of API keys (enabled or existing) for the target subaccount is no more than one.'
    severity: medium
- id: '2.12'
  title: Ensure that MFA Is Enabled for Root Account Operation Protection (Cloud Access Management [CAM])
  scoring: manual
  profile:
  - Level 1
  description: Ensure that multi-factor authentication (MFA) is enabled for operation protection on the root account. The
    root account typically has full administrative privileges over all resources under the account. If a root account is misused—either
    through human error or malicious compromise—critical cloud assets may be affected. Enabling MFA for sensitive operations
    adds an extra verification step beyond username and password, reducing the likelihood and impact of unauthorized or erroneous
    changes.
  rationale: Operation protection with MFA helps prevent high-risk actions from being performed without additional verification.
    This reduces the probability of unintentional configuration changes and raises the difficulty for attackers attempting
    destructive operations, thereby enhancing the overall security of the root account and associated resources.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1813256727106
  page_start: 74
  audit_raw: '1. Log in to the tenant console and navigate to Account Center.

    2. Go to Security Settings.

    3. Verify that Operation Protection for the root account is set to MFA

    Verification Enabled.'
  remediation: '1. Log in to the tenant console and navigate to Account Center.

    2. Go to Security Settings and click the edit icon next to Operation

    Protection.

    3. Select Enable MFA Device Verification.

    4. Follow the prompts to bind the MFA device.

    5. Click OK.'
  checks:
  - type: manual_review
    info: '1. Log in to the tenant console and navigate to Account Center.

      2. Go to Security Settings.

      3. Verify that Operation Protection for the root account is set to MFA

      Verification Enabled.'
    severity: medium
- id: '2.13'
  title: Ensure that Sub-accounts Unused for 45 Days or Longer Are Disabled (Cloud Access Management [CAM])
  scoring: manual
  profile:
  - Level 1
  description: Ensure that sub-accounts which have been inactive for an extended period (for example, 45 days or more) and
    are no longer required are identified and deleted. Deprecated or unused sub-accounts may still retain permissions and
    credentials, increasing the risk of unauthorized access, asset unavailability, or data breaches if they are abused by
    former users or attackers.
  rationale: Deleting deprecated sub-accounts reduces the risk of misuse of residual credentials (such as passwords or API
    keys) and limits the number of identities with access to cloud resources. This supports the principle of least privilege,
    simplifies identity lifecycle management, and improves overall account security.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1813256727106
  page_start: 76
  audit_raw: '1. Log in to the tenant console and navigate to Account Center.

    2. Go to Cloud Access Management > User Management > User.

    3. Identify sub-accounts that:

    • Have not logged in or have been inactive for 45 days or longer, and

    • Are no longer required for business or operational purposes.

    4. Verify that such deprecated sub-accounts have been disabled or deleted.'
  remediation: '1. Log in to the tenant console and navigate to Account Center.

    2. Go to Cloud Access Management > User Management > User.

    3. Identify sub-accounts that have been inactive for an extended period (e.g. more

    than 45 days) and are no longer required.

    4. For each sub-account:

    • If API keys exist, go to API Key Management tab for that user. Disable and

    delete all these API keys.

    • Return to the User list and click Delete next to the sub-account entry.

    • If Operation Protection is enabled, complete any verification step as

    prompted to confirm the deletion.'
  checks:
  - type: manual_review
    info: '1. Log in to the tenant console and navigate to Account Center.

      2. Go to Cloud Access Management > User Management > User.

      3. Identify sub-accounts that:

      • Have not logged in or have been inactive for 45 days or longer, and

      • Are no longer required for business or operational purposes.

      4. Verify that such deprecated sub-accounts have been disabled or deleted.'
    severity: medium
- id: '2.14'
  title: Ensure that CAM Policies Comply with the Principle of Least Privilege (Cloud Access Management [CAM])
  scoring: manual
  profile:
  - Level 2
  - Level 1
  description: Ensure that sub-accounts are granted only the minimum permissions required to perform their duties. Assigning
    excessive or high-level permissions to sub-accounts significantly increases security risk; if such an account is compromised,
    an attacker may gain broad control over cloud resources and sensitive data. Ensure that Cloud Load Balancer (CLB) instances
    are operating in a normal state. Abnormal CLB instances may forward requests to incorrect backend targets or fail to forward
    traffic, resulting in service unavailability, request failures, or degraded performance.
  rationale: Applying the principle of least privilege limits each sub-account to only the actions and resources necessary
    for its role. This reduces the likelihood of sensitive data exposure, unauthorized changes, and abuse of elevated privileges,
    whether due to compromise or incorrect use. Ensure normal CLB health checks and status metrics to reduce the risk of undetected
    production service failures. Regularly identifying and troubleshooting abnormal CLB instances helps prevent traffic interruption,
    misrouting of requests, and service degradation.
  impact: After associating an account with a least privilege policy, applications or users may be unable to access certain
    resources due to missing specific permissions.
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1813256727106
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1955713987269
