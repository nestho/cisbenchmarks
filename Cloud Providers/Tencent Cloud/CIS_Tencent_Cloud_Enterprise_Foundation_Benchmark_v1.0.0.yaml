- id: '3.11'
  title: Ensure that No Network ACLs Allow Ingress from 0.0.0.0/0 to Non-Service Ports (Virtual Private Cloud [VPC])
  scoring: manual
  profile:
  - Level 1
  description: Ensure that network ACLs associated with subnets do not contain overly permissive inbound rules for non-service
    ports. For the purpose of this control, service ports are defined as TCP ports 80 and 443. Any inbound rule that allows
    traffic from 0.0.0.0/0 to ports other than 80 and 443 with action Allow can unnecessarily expose the subnet and its assets
    to the public network and is considered non-compliant. Ensure that access from VPC networks to the Underlay network (for
    example, to public services or PaaS products deployed in the Underlay) is explicitly controlled and limited to the minimum
    required scope. Access policies must restrict the VPCs, subnets, destination VIPs, and ports according to specific business
    requirements, rather than allowing broad or unrestricted connectivity.
  rationale: Network ACLs provide subnet-level access control. Allowing unrestricted inbound access from 0.0.0.0/0 to non-service
    ports exposes internal services to scanning, exploitation, and unauthorized access. Configuring inbound rules according
    to the principle of least privilege—restricting traffic to required service ports and trusted source IP ranges—reduces
    the attack surface and lowers the risk of malicious activity against workloads in the VPC. Access mappings from VPC networks
    to the Underlay network extend the reachable attack surface beyond the VPC itself. Configuring these mappings according
    to the principle of least privilege—limiting which VPCs and subnets can access which Underlay services and ports—helps
    prevent unauthorized access, lateral movement, and abuse of shared Underlay services. Tight control over these routes
    and ports improves overall network segmentation and reduces the risk of misconfiguration leading to unintended exposure.
  impact: ''
  references: []
