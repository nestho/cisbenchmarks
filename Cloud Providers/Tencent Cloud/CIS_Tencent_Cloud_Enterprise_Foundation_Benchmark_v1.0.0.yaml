- id: '4.1'
  title: Ensure that Scheduled Snapshot Policies Are Configured for CBS Volumes (Cloud Block Storage [CBS])
  scoring: manual
  profile:
  - Level 1
  description: It is recommended that automatic scheduled snapshot policies are configured for CBS volumes according to their
    business criticality. Periodic creation of snapshots improves data durability and supports low-cost, high-efficiency disaster
    recovery.
  rationale: Enabling scheduled snapshots for CBS volumes enhances data protection and disaster recovery capabilities. Regular
    snapshots help minimize data loss and reduce business downtime by providing multiple recovery points in the event of accidental
    deletion, corruption, or infrastructure failures.
  impact: Enabling snapshots for CBS may incur additional costs.
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1895651662717
  page_start: 106
  audit_raw: '1. Log in to the tenant console and navigate to Cloud Virtual Machine.

    2. Choose Cloud Block Storage.

    3. For each CBS volume in scope, verify that:

    • A scheduled snapshot policy is associated with the volume; and

    • The policy schedule (frequency and retention) meets organizational backup

    and recovery requirements.'
  remediation: '1. Log in to the tenant console and navigate to Cloud Block Storage.

    2. Locate the CBS volume that requires a scheduled snapshot policy and, in the

    Operation column, choose More > Set Scheduled Snapshot Policy.

    3. Click Create Policy, configure the schedule (for example, execution time,

    frequency, and retention period) according to business and recovery

    requirements, and click OK.

    4. Click Set Scheduled Snapshot Policy again, select the newly created policy,

    and click OK to associate it with the target volume.'
  checks:
  - type: manual_review
    info: '1. Log in to the tenant console and navigate to Cloud Virtual Machine.

      2. Choose Cloud Block Storage.

      3. For each CBS volume in scope, verify that:

      • A scheduled snapshot policy is associated with the volume; and

      • The policy schedule (frequency and retention) meets organizational backup

      and recovery requirements.'
    severity: medium
