controls:
- id: '1.1'
  title: Ensure that Image Repositories Are Configured with Appropriate Permissions (Kubernetes Engine [TKE])
  scoring: manual
  profile:
  - Level 1
  description: Repositories can be public or private. Public repositories allow all users on the internet to access and download
    images. If an image contains sensitive information, you are advised to configure the repository as private to prevent
    information leakage.
  rationale: Images in public repositories that contain sensitive information (such as keys or user data) are directly exposed
    to the internet, allowing attackers to easily access the data. Restricting such repositories to private reduces the risk
    of unauthorized access and information leakage.
  impact: Setting the image type to private will cause all image pull operations to require login authentication first. Operations
    without configured credentials will fail directly.
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1446603314066
  page_start: 18
  audit_raw: '1. Log in to the tenant console and navigate to Kubernetes Engine.

    2. In the left navigation pane, choose Image Repository > My Images.

    3. On the Image List tab, review the Type field for each repository and verify that

    all repositories which store images containing or likely to contain sensitive

    information are configured as Private.'
  remediation: 'Enabling the Image Repository (if not already enabled)

    1. Log in to the tenant console and navigate to Kubernetes Engine.

    2. In the left navigation pane, choose Image Repository > My Images.

    3. Fill in the relevant information as prompted and click Activate to start

    initialization of an image repository service.

    Creating a Namespace (if needed)

    1. In the left navigation pane, choose Image Repository > My Images to enter the

    My Images page.

    2. On the My Images page, choose the Namespace tab and click Create.

    3. In the pop-up window, enter a namespace name and click OK.

    Creating a Private Image

    1. In the left navigation pane, choose My Images > Image List.

    2. Click Create, followed by entering the image name, and set Type to Private.

    3. Click OK to confirm.

    Changing the Image Type from Public to Private

    1. Log in to the tenant console and navigate to Kubernetes Engine.

    2. In the left navigation pane, choose Image Repository > My Images.

    3. Locate the target image in the image list and click the image name to open the

    image details page.

    4. On the Image Details tab, set Type to Private, and click OK to save the

    change.'
  checks:
  - type: manual_review
    info: '1. Log in to the tenant console and navigate to Kubernetes Engine.

      2. In the left navigation pane, choose Image Repository > My Images.

      3. On the Image List tab, review the Type field for each repository and verify that

      all repositories which store images containing or likely to contain sensitive

      information are configured as Private.'
    severity: medium
- id: '1.2'
  title: Ensure that TKE Clusters Are Bound to Security Groups with Least-Privilege Rules (Kubernetes Engine [TKE])
  scoring: scored
  profile:
  - Level 1
  description: Ensure that each TKE cluster is bound to an appropriate security group and that the security group rules enforce
    the principle of least privilege for network access to the cluster.
  rationale: If TKE clusters are associated with overly permissive security group rules (for example, allowing unrestricted
    inbound access), the attack surface of the cluster is significantly increased. Binding clusters to security groups with
    minimal, business-justified ingress and egress rules helps ensure that only authorized IP addresses and services can access
    the cluster control plane and worker nodes, thereby reducing the risk of unauthorized access and compromise.
  impact: After a TKE cluster is bound to a security group, IP addresses that are not within the scope of the security group
    may be unable to access the cluster normally.
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1446603314066
  page_start: 20
  audit_raw: '1. Log in to the tenant console and navigate to Kubernetes Engine.

    2. Go to Cluster, click the cluster ID you want to review, and verify that a security

    group is associated with the cluster.

    3. Review the inbound and outbound rules of the associated security group on the

    cloud firewall / security group management page and verify that:

    • Only required IP ranges and ports (based on business and operational needs)

    are allowed to access the cluster.

    • Unnecessary broad rules (for example, 0.0.0.0/0 for sensitive ports) are not

    present.

    4. Optionally, validate that the IP addresses not permitted by the security group

    rules cannot access the cluster endpoints.'
  remediation: 'Adjusting Security Group Rules for Existing Clusters

    1. Log in to the tenant console and navigate to Kubernetes Engine.

    2. Select the target cluster and identify the bound security group.

    3. Navigate to the security group management page, and review and update the

    rules to:

    • Restrict source IP ranges to trusted IPs or networks.

    • Restrict open ports to only those required by the cluster and applications.

    • Remove any unnecessary or overly broad rules (for example, public exposure

    where not required).'
  checks:
  - type: manual_review
    info: '1. Log in to the tenant console and navigate to Kubernetes Engine.

      2. Go to Cluster, click the cluster ID you want to review, and verify that a security

      group is associated with the cluster.

      3. Review the inbound and outbound rules of the associated security group on the

      cloud firewall / security group management page and verify that:

      • Only required IP ranges and ports (based on business and operational needs)

      are allowed to access the cluster.

      • Unnecessary broad rules (for example, 0.0.0.0/0 '
    severity: medium
- id: '1.3'
  title: Ensure that CLB Instances Are Bound to Security Groups with Least-Privilege Rules (Cloud Load Balancer [CLB])
  scoring: manual
  profile:
  - Level 1
  description: Ensure that each CLB instance is bound to an appropriate security group and that the security group rules enforce
    the principle of least privilege, for example, restricting inbound access on service ports to trusted IP address ranges.
  rationale: Security groups function as virtual firewalls for CLB instances. If CLB instances are associated with overly
    permissive rules (such as allowing 0.0.0.0/0 where restriction is expected), the instances are exposed to potential attacks
    from any internet source. Binding CLB instances to security groups with minimal, business-justified ingress rules and
    trusted IP allowlists reduces exposure to malicious traffic and lowers the risk of unauthorized access and compromise.
  impact: After a CLB is bound to a security group, IP addresses that are not within the scope of the security group may be
    unable to normally access the resources associated with that CLB.
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1955713987269
  page_start: 22
  audit_raw: '1. Log in to the tenant console and navigate to Cloud Load Balancer.

    2. Go to LB Instance List, locate the target CLB instance, and click More to

    open the details page.

    3. Click Configure Security Group and verify that:

    • The CLB instance is bound to at least one security group.

    • The bound security group does not allow unrestricted access from source IP

    0.0.0.0/0 on ports that should be restricted to trusted IP ranges and are only

    limited to business-justified IP ranges and ports.'
  remediation: '1. Log in to the tenant console and navigate to Cloud Load Balancer.

    2. Go to LB Instance List, locate the target CLB instance, then click More to

    open the details page.

    3. Click Configure Security Group > Security Group.

    4. Click Bind, select an appropriate security group, and click OK.

    5. On the security group management page, review and update the rules for the

    bound security group to:

    • Allow only trusted and business-required IP ranges.

    • Limit open ports to those strictly required by the services behind the CLB.

    • Remove any unnecessary or overly broad rules, especially the rules allowing

    0.0.0.0/0 where not strictly required by design.'
  checks:
  - type: manual_review
    info: '1. Log in to the tenant console and navigate to Cloud Load Balancer.

      2. Go to LB Instance List, locate the target CLB instance, and click More to

      open the details page.

      3. Click Configure Security Group and verify that:

      • The CLB instance is bound to at least one security group.

      • The bound security group does not allow unrestricted access from source IP

      0.0.0.0/0 on ports that should be restricted to trusted IP ranges and are only

      limited to business-justified IP ranges and ports.'
    severity: medium
- id: '1.4'
  title: Ensure that Least-Privilege Policies Are Configured for COS Buckets (Cloud Object Storage [COS] )
  scoring: manual
  profile:
  - Level 2
  description: Ensure that bucket policies for COS buckets are configured according to the principle of least privilege. Buckets
    must not be configured to allow unrestricted read access (for example, read access for any user on the internet), as this
    can expose object names and data to unauthorized parties.
  rationale: 'Bucket policies control which users or services can access a COS bucket and its contents, and what operations
    they can perform. If a bucket policy grants broad read access (such as anonymous or public read), attackers can: • List
    object names (traversal of file names). • Download files directly. • Access sensitive information stored in the bucket.
    Configuring bucket policies with minimal, business-justified permissions reduces the risk of unauthorized access and sensitive
    data leakage.'
  impact: After a permission policy is configured for a COS storage bucket, applications or users may encounter a 403 error
    when they lack a specific required permission.
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1923792773051
  page_start: 24
  audit_raw: '1. Log in to the tenant console and navigate to Cloud Object Storage.

    2. Go to Bucket List, locate the bucket to be reviewed, and click the bucket name

    or Configuration Management to enter the configuration management page.

    3. Go to Permission Management > Policy Permission Settings, and review

    the configured bucket policy. Verify that:

    • Access is restricted to specific, authorized users, roles, and/or services.

    • There is no policy granting public or anonymous read access.

    • Permissions granted are limited to the minimum required (least privilege).'
  remediation: '1. Log in to the tenant console and navigate to Cloud Object Storage.

    2. Go to Bucket List, locate the target bucket, then click the bucket name or

    Configuration Management to enter the configuration management page.

    3. Click Permission Management > Policy Permission Settings.

    4. Click Graphic Settings > Add Policy.

    5. Review and configure the policy to:

    • Grant access only to specific, authorized accounts, roles, or services.

    • Avoid any statements that allow public or anonymous read access.

    • Limit allowed actions to those strictly required.'
  checks:
  - type: manual_review
    info: '1. Log in to the tenant console and navigate to Cloud Object Storage.

      2. Go to Bucket List, locate the bucket to be reviewed, and click the bucket name

      or Configuration Management to enter the configuration management page.

      3. Go to Permission Management > Policy Permission Settings, and review

      the configured bucket policy. Verify that:

      • Access is restricted to specific, authorized users, roles, and/or services.

      • There is no policy granting public or anonymous read access.

      • Permissions grante'
    severity: medium
- id: '1.5'
  title: Ensure that Hotlink Protection Is Enabled for COS Buckets (Cloud Object Storage [COS])
  scoring: manual
  profile:
  - Level 1
  description: Ensure that hotlink protection is enabled for COS buckets that are accessed over the public network. Configure
    hotlink protection with an appropriate allowlist (and optional blocklist) so that only trusted domains or IP addresses
    can directly reference COS resources.
  rationale: Enabling hotlink protection and restricting access to a controlled set of allowed domains or IPs helps prevent
    malicious traffic consumption and reduces the risk of financial loss.
  impact: Enabling hotlink protection may result in IP addresses that are not on the allow list being unable to access the
    storage bucket.
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1923792773051
  page_start: 26
  audit_raw: '1. Log in to the tenant console and navigate to Cloud Object Storage.

    2. Go to Bucket List, locate the bucket you want to review, and click the bucket

    name or Configuration Management at the end of the bucket to enter the

    configuration management page.

    3. Go to Security Management > Hotlink Protection Settings and verify that:

    • The hotlink protection feature is enabled.

    • A Whitelist is configured with the trusted domain names or IP addresses that

    are allowed to reference the bucket resources.

    • Allow Empty Referer is set according to the least privilege principle

    (typically Denied for internet-facing bucket).'
  remediation: '1. Log in to the tenant console and navigate to Cloud Object Storage.

    2. Go to Bucket List, locate the target bucket, and click the bucket name or

    Configuration Management to enter the configuration management page.

    3. Go to Security Management > Hotlink Protection Settings to enter the

    Hotlink Protection Settings page.

    4. Click Modify, and toggle Current Status to On to enable the hotlink protection.

    5. Configure the following:

    • Set Type to Whitelist.

    • Set Allow Empty Referer to Deny (unless there are justified business

    requirements).

    • Enter the trusted domain names or IP addresses that are permitted to

    reference bucket resources.

    6. Click Save.'
  checks:
  - type: manual_review
    info: '1. Log in to the tenant console and navigate to Cloud Object Storage.

      2. Go to Bucket List, locate the bucket you want to review, and click the bucket

      name or Configuration Management at the end of the bucket to enter the

      configuration management page.

      3. Go to Security Management > Hotlink Protection Settings and verify that:

      • The hotlink protection feature is enabled.

      • A Whitelist is configured with the trusted domain names or IP addresses that

      are allowed to reference the bucket resources.

      '
    severity: medium
- id: '1.6'
  title: Ensure that Logging Is Enabled for COS Buckets (Cloud Object Storage [COS])
  scoring: manual
  profile:
  - Level 1
  description: Ensure that logging is enabled for COS buckets. Configure the log management feature so that detailed access
    logs for a source bucket are written to a designated destination bucket in the same region.
  rationale: 'COS bucket logging records detailed access information (for example, requester, accessed object, time, and operation
    type) and stores it as log files in a specified destination bucket. Enabling logging: • Provides traceability for access
    to sensitive data; • Supports investigation of abnormal or suspicious access patterns; • Aids in incident response and
    forensic analysis; • Improves operational visibility and compliance reporting. Without logging, it is difficult to detect
    or investigate unauthorized access or misuse of COS resources.'
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1923792773051
  page_start: 28
  audit_raw: '1. Log in to the tenant console and navigate to Cloud Object Storage.

    2. Go to Bucket List, then locate the bucket to be reviewed, and click the bucket

    name or Configuration Management at the end of the bucket to enter the

    configuration management page.

    3. Go to Log Management, and verify that:

    • The current logging status is enabled.

    • A valid destination bucket in the same region is configured.

    • (Optional) A path prefix is set to organize log files in the destination bucket.'
  remediation: '1. Log in to the tenant console and navigate to Cloud Object Storage.

    2. Go to Bucket List, then locate the target bucket, and click the bucket name or

    Configuration Management to enter the configuration management page.

    3. Go to Log Management.

    4. Click Modify, toggle Current Status to On to enable logging.

    5. Select a destination bucket in the same region as the source bucket.

    6. (Optional) Enter a path prefix to define where log files will be stored within the

    destination bucket.

    7. Click Save.'
  checks:
  - type: manual_review
    info: '1. Log in to the tenant console and navigate to Cloud Object Storage.

      2. Go to Bucket List, then locate the bucket to be reviewed, and click the bucket

      name or Configuration Management at the end of the bucket to enter the

      configuration management page.

      3. Go to Log Management, and verify that:

      • The current logging status is enabled.

      • A valid destination bucket in the same region is configured.

      • (Optional) A path prefix is set to organize log files in the destination bucket.'
    severity: medium
- id: '1.7'
  title: Ensure that Cloud Workload Protection Platform Is Installed on All CVM Instances (Cloud Virtual Machine [CVM])
  scoring: manual
  profile:
  - Level 1
  description: Ensure that the Cloud Workload Protection Platform (CWP) agent is installed and running on all CVM instances.
    CWP provides security capabilities such as Trojan detection and removal, password cracking interception, login behavior
    audit, vulnerability management, and asset component identification. Failure to install the CWP agent will expose CVM
    instances to network security threats and increase the risk of data leakage.
  rationale: CWP provides continuous, real-time monitoring of the security status of CVM instances, helping to protect against
    network attacks and enhancing overall host security. Without the CWP agent, it is more difficult to detect attacks, abnormal
    activities, and vulnerabilities on CVM instances, increasing the likelihood of data compromise.
  impact: Installing CWP may incur additional costs.
  references:
  - 1. https://www.tencentcloud.com/document/privatecloud/document/1447254798889
  page_start: 30
  audit_raw: '1. Log in to the tenant console and navigate to CWP.

    2. In the left navigation pane, choose Asset Management > Server List to enter

    the Server List page.

    3. Select All Servers and verify that all CVM hosts are shown as protected by

    CWP.

    4. On each CVM host, execute the following command to verify the CWP agent is

    running normally:

    • Execute the command

    ps -ef | grep YD

    • and verify that both YDService and YDLive processes are running.'
  remediation: '1. Log in to the tenant console and navigate to CWP.

    2. In the left navigation pane, go to Asset Management > Server List.

    3. Click Install CWP Agent for the target CVM instance to view the installation

    instructions.

    4. After installation, verify on the target CVM instance that both YDService and

    YDLive processes are running.'
  checks:
  - type: command
    command: ps -ef | grep YD
    expected: 3. Select All Servers and verify that all CVM hosts are shown as protected by
