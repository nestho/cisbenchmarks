  title: Ensure that Public Access Is Disabled for COS Buckets (Cloud Object Storage [COS])
  scoring: manual
  profile:
  - Level 1
  - Level 2
  description: Ensure that Cloud Object Storage (COS) buckets do not allow public read or public read/write access. Public
    access settings permit anonymous users to read or modify bucket data, resulting in significant data exposure and integrity
    risks. Buckets should be configured with private read/write permissions unless a specific, approved business need exists.
    For CSP buckets that are configured with full access permissions, it is strongly recommended to enable server-side encryption
    using KMS-managed keys (SSE-KMS). Unencrypted sensitive data stored in buckets is at risk of unauthorized access, tampering,
    and regulatory non-compliance, especially when broad access controls are granted.
  rationale: Restricting bucket access based on the principle of least privilege reduces the risk of unauthorized access,
    data leakage, and malicious tampering. Buckets with full access permissions present a higher inherent risk of data exposure.
    Enabling server-side encryption with a KMS key ensures that stored data remains protected even if access permissions are
    misconfigured or exposed. Encryption mitigates the risk of data leakage and strengthens overall data security posture.
  impact: • Using SSE-KMS encryption will incur additional costs. • If SSE-KMS encryption is used, deleting a KMS master key
    may cause irreversible data loss.
