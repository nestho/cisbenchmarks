controls:
- id: '1.1'
  title: Avoid the use of the "root" account
  scoring: manual
  profile:
  - Level 1
  description: The root account in Tencent Cloud (the initial account created during registration) should only be used for
    the minimal necessary operations. Ensure that the root account is not used for routine daily operations and administrative
    tasks within Tencent Cloud.
  rationale: The root account is the initial account created during registration in Tencent Cloud which requires the owners'
    identity. This account holds unrestricted privileges across the Tencent Cloud platform, encompassing billing, service
    management, and user management. Any compromise or misuse of the root account poses significan risks to the entire cloud
    environment, potentially leading to accidental or intentional destructive actions.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/598/34899
  page_start: 18
  audit_raw: 'You can review CloudAudit logs for actions performed by the root account (i.e., the main

    account uin). In the Tencent Cloud Console, navigate to CloudAudit and identify

    operations performed by the root user.'
  remediation: 'Using the management Console:

    1. Login in to CAM console

    2. Create CAM users and groups.

    3. Assign appropriate permissions via policies. Reserve root account access for

    critical operations only.'
  checks:
  - type: manual_review
    info: 'You can review CloudAudit logs for actions performed by the root account (i.e., the main

      account uin). In the Tencent Cloud Console, navigate to CloudAudit and identify

      operations performed by the root user.'
    severity: medium
- id: '1.2'
  title: Ensure no root account access key exists
  scoring: manual
  profile:
  - Level 1
  description: Confirm that no programmatic access credentials (SecretId/SecretKey) are associated with the root account.
  rationale: Access keys for the root account provide full programmatic access to all Tencent Cloud resources. If these keys
    are leaked, the entire cloud environment may be exposed to unauthorized access and exploitation. It is highly recommended
    that all access keys associated with the root account should not be generated.
  impact: Programs that already use root account access keys may stop working if you disable or delete the access keys without
    replacing them with other CAM user access keys in your program.
  references:
  - 1. https://www.tencentcloud.com/document/product/598/34228
  page_start: 20
  audit_raw: 'Perform the following to determine if the ''root'' user account has access keys:

    Using the management Console:

    1. Login in to CAM console.

    2. In the left-side navigation pane, click Access Key.

    3. Review the list of access keys for the root account. Ensure list is empty.'
  remediation: 'Immediately delete any active access keys for the root account via the console.

    Using the management Console:

    1. Login in to CAM console.

    2. In the left-side navigation pane, click Access Key to review the list of access

    keys for the root account.

    3. Click Disable to disable any activated access keys (temporarily disable key - for

    those keys that may still be needed), and/or click Delete to delete them (deleted

    keys cannot be recovered).

    4. Ensure that neither the access key is generated or activated.

    5. Enforce a policy prohibiting the issuance of root account access keys.'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the ''root'' user account has access keys:

      Using the management Console:

      1. Login in to CAM console.

      2. In the left-side navigation pane, click Access Key.

      3. Review the list of access keys for the root account. Ensure list is empty.'
    severity: medium
- id: '1.3'
  title: Ensure Multi-factor Authentication is enabled for the "root" account
  scoring: manual
  profile:
  - Level 1
  description: Ensure that Multi-Factor Authentication (MFA) for the root account is enabled to enhance its security.
  rationale: MFA introduces an additional authentication factor (such as OTP generation via a hardware or software device),
    significantly lowering the risk of unauthorized access in the event of password compromise.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/598/10592
  page_start: 22
  audit_raw: 'Using the management Console:

    1. Login in to Account Center.

    2. Click Security Settings in the left-side navigation bar.

    3. Verify that the MFA device is bound to the root account by checking under Basic

    Settings > MFA Device.'
  remediation: 'Using the management Console to bind an MFA Device:

    1. Login in to Account Center.

    2. Click Security Settings in the left navigation bar.

    3. Go to Basic Settings > MFA Device and click Bind.

    4. Complete the identity authentication as prompted on the authentication window

    that pops up.

    5. Select a binding method: Virtual MFA Device (for example, Google

    Authenticator or Microsoft Authenticator) or U2F Security Key (for example,

    Yubikey), and follow the on-screen instructions to proceed with the binding

    operation.

    6. Click Submit to complete the binding of the MFA device.'
  checks:
  - type: manual_review
    info: 'Using the management Console:

      1. Login in to Account Center.

      2. Click Security Settings in the left-side navigation bar.

      3. Verify that the MFA device is bound to the root account by checking under Basic

      Settings > MFA Device.'
    severity: medium
- id: '1.4'
  title: Ensure that multi-factor authentication is enabled for all CAM users that have a console password
  scoring: manual
  profile:
  - Level 1
  description: Mandate that all CAM users with access to the Console have multi-factor authentication (MFA) enabled.
  rationale: Implementing MFA for all console users safeguards against risks posed by compromised login credentials and adds
    another layer of defense against unauthorized access.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/598/32657
  page_start: 24
  audit_raw: 'Using the management Console:

    1. Login in to CAM console

    2. Click Users > User List.

    3. Inspect the “MFA Status” column for each user.'
  remediation: 'Using the management Console:

    1. Login in to CAM console

    2. Click Users > User List.

    3. Inspect the “MFA Status” column for each user.

    4. Click the Username with the MFA Status is Not Enabled.

    5. In the User Details page, click ''security'' > MFA Authentication Settings ''Manage''

    to Indetity Security page.

    6. In Identity Security page, Step 1, Login Protection, select Enable virtual MFA

    device verification.

    7. Click OK to save.

    8. The user will be asked to bind MFA next time they log in.'
  checks:
  - type: manual_review
    info: 'Using the management Console:

      1. Login in to CAM console

      2. Click Users > User List.

      3. Inspect the “MFA Status” column for each user.'
    severity: medium
- id: '1.5'
  title: Ensure users not logged on for 90 days or longer are disabled for console logon
  scoring: manual
  profile:
  - Level 1
  description: Restrict CAM console login for any user account that has not authenticated for 90 days or more.
  rationale: Inactive accounts are prime targets for attackers seeking to exploit forgotten or abandoned access points. Disabling
    them reduces the potential attack surface.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/598/61851
  page_start: 26
  audit_raw: 'Use the CAM console to generate a report from User Management. See each user’s

    last login time. Or, query CloudAudit logs for user activity.

    Using the CAM console:

    1. Login in to CAM console

    2. Click Dashboard > Download user credential report.

    3. Check the LastConsoleLoginTime column to see if there are any time records

    older than 90 days.'
  remediation: 'In the User Management page, disable console access or delete stalled user accounts.

    Establish automated workflows to periodically review and address dormant accounts.

    Using the CAM console:

    1. Login in to CAM console

    2. Click Dashboard > Download user credential report.

    3. Check the LastConsoleLoginTime column to see if there are any time records

    older than 90 days.

    4. Click Users > User List, select the Username who meet the above rule.

    5. In the Operation column, click More Actions > Disable or Delete the user.'
  checks:
  - type: manual_review
    info: 'Use the CAM console to generate a report from User Management. See each user’s

      last login time. Or, query CloudAudit logs for user activity.

      Using the CAM console:

      1. Login in to CAM console

      2. Click Dashboard > Download user credential report.

      3. Check the LastConsoleLoginTime column to see if there are any time records

      older than 90 days.'
    severity: medium
- id: '1.6'
  title: Ensure access keys are rotated every 90 days or less
  scoring: manual
  profile:
  - Level 1
  description: Implement a policy requiring the rotation of all CAM access keys (SecretId/SecretKey) at least every 90 days.
  rationale: Regular rotation limits the exposure window of a potentially compromised key, and supports compliance with industry
    frameworks (such as ISO 27001).
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/598/34228
  page_start: 28
  audit_raw: 'Perform the following to determine if access keys are rotated within 90 days:

    Using the management console:

    1. Login in to CAM console.

    2. Click Users > User List.

    3. Click each Username > API Key, check the Create time that a key was created.

    4. Make sure that no user has a key created earlier than 90 days ago.'
  remediation: 'Perform the following to disable and delete access keys:

    Using the management console:

    1. Login in to CAM console.

    2. Click Users > User List and click the username of the target CAM user.

    3. Click Username > API Key > Create Key to create new AccessKey.

    4. Click OK to create a new key for rotation.

    5. Update all applications and systems to use the new AccessKey pair.

    6. Disable the original AccessKey pair.

    7. Confirm that your applications and systems are working.

    8. Delete the original AccessKey pair.'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if access keys are rotated within 90 days:

      Using the management console:

      1. Login in to CAM console.

      2. Click Users > User List.

      3. Click each Username > API Key, check the Create time that a key was created.

      4. Make sure that no user has a key created earlier than 90 days ago.'
    severity: medium
- id: '1.7'
  title: Ensure CAM password policy requires at least one uppercase letter
  scoring: manual
  profile:
  - Level 1
  description: Enforce password policy standards requiring at least one uppercase letter in all CAM user passwords.
  rationale: Password complexity, including uppercase characters, increases resistance against brute force and dictionary
    attacks.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/598/32649
  page_start: 30
  audit_raw: 'Using the management console:

    1. Login in to CAM console.

    2. Click Users > User Settings.

    3. Under the Password rule, ensure Uppercase letters is selected in the At

    least contain setting.'
  remediation: 'Using the management console:

    1. Login in to CAM console.

    2. Click Users > User Settings.

    3. In the Password rule > At least contain > Select Uppercase letters.

    4. Click Apply modification.'
  checks:
  - type: manual_review
    info: 'Using the management console:

      1. Login in to CAM console.

      2. Click Users > User Settings.

      3. Under the Password rule, ensure Uppercase letters is selected in the At

      least contain setting.'
    severity: medium
- id: '1.8'
  title: Ensure CAM password policy requires at least one lowercase letter
  scoring: manual
  profile:
  - Level 1
  description: Enforce password policy standards requiring at least one lowercase letter in all CAM user passwords.
  rationale: The use of mixed character cases increases overall password complexity, reducing predictability.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/598/32649
  page_start: 32
  audit_raw: 'Using the management console:

    1. Login in to CAM console.

    2. Click Users > User Settings.

    3. Under the Password rule, ensure Lowercase letters is selected in the At

    least contain setting.'
  remediation: 'Using the management console:

    1. Login in to CAM console.

    2. Click Users > User Settings.

    3. In the Password rule > At least contain > Select Lowercase letters.

    4. Click Apply modification.'
  checks:
  - type: manual_review
    info: 'Using the management console:

      1. Login in to CAM console.

      2. Click Users > User Settings.

      3. Under the Password rule, ensure Lowercase letters is selected in the At

      least contain setting.'
    severity: medium
- id: '1.9'
  title: Ensure CAM password policy require at least one special character
  scoring: manual
  profile:
  - Level 1
  description: Requires at least one special character (e.g., !$%&) in all user passwords.
  rationale: Special symbols increase password entropy and heighten defense against targeted guessing attacks.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/598/32649
  page_start: 34
  audit_raw: 'Using the management console:

    1. Login in to CAM console.

    2. Click Users > User Settings.

    3. Under the Password rule, ensure Special characters (excluding space) is

    selected in the At least contain setting.'
  remediation: 'Using the management console:

    1. Login in to CAM console.

    2. Click Users > User Settings.

    3. In the Password rule > At least contain > Select Special characters

    (excluding space).

    4. Click Apply modification.'
  checks:
  - type: manual_review
    info: 'Using the management console:

      1. Login in to CAM console.

      2. Click Users > User Settings.

      3. Under the Password rule, ensure Special characters (excluding space) is

      selected in the At least contain setting.'
    severity: medium
- id: '1.10'
  title: Ensure CAM password policy require at least one digit
  scoring: manual
  profile:
  - Level 1
  description: Mandate the inclusion of numeric digits in user passwords.
  rationale: Including numbers adds an additional layer of complexity to passwords
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/598/32649
  page_start: 36
  audit_raw: 'Using the management console:

    1. Login in to CAM console.

    2. Click Users > User Settings.

    3. Under the Password rule, ensure Digit is selected in the At least contain

    setting.'
  remediation: 'Using the management console:

    1. Login in to CAM console.

    2. Click Users > User Settings.

    3. In the Password rule > At least contain > Select Digit.

    4. Click Apply modification.'
  checks:
  - type: manual_review
    info: 'Using the management console:

      1. Login in to CAM console.

      2. Click Users > User Settings.

      3. Under the Password rule, ensure Digit is selected in the At least contain

      setting.'
    severity: medium
- id: '1.11'
  title: Ensure CAM password policy requires minimum length of 14 or greater
  scoring: manual
  profile:
  - Level 1
  description: Passwords are recommended to be configured to have a minimum length of no less than 14 characters.
  rationale: Longer passwords are exponentially harder to compromise via brute force methods and align with leading security
    frameworks.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/598/32649
  page_start: 38
  audit_raw: 'Using the management console:

    1. Login in to CAM console.

    2. Click Users > User Settings.

    3. Under the Password rule, ensure that the value of Minimum password length is

    set between 14 and 32.'
  remediation: 'Using the management console:

    1. Login in to CAM console.

    2. Click Users > User Settings.

    3. In the Password rule > Minimum password length > set between 14 and 32.

    4. Click Apply modification.'
  checks:
  - type: manual_review
    info: 'Using the management console:

      1. Login in to CAM console.

      2. Click Users > User Settings.

      3. Under the Password rule, ensure that the value of Minimum password length is

      set between 14 and 32.'
    severity: medium
- id: '1.12'
  title: Ensure CAM password policy prevents password reuse
  scoring: scored
  profile:
  - Level 1
  description: Enable restrictions that prevent users from reusing a defined number of previous passwords.
  rationale: Prevents cyclical or repeated password use, mitigating risks associated with credentials previously leaked or
    reused across systems.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/598/32649
  page_start: 40
  audit_raw: 'Using the management console:

    1. Login in to CAM console.

    2. Click Users > User Settings.

    3. Under the Password rule, ensure that the value of Limitation on

    duplications is set between 1 and 24.'
  remediation: 'Using the management console:

    1. Login in to CAM console.

    2. Click Users > User Settings.

    3. In the Password rule > Limitation on duplications > set between 14 and

    32.

    4. Click Apply modification.'
  checks:
  - type: manual_review
    info: 'Using the management console:

      1. Login in to CAM console.

      2. Click Users > User Settings.

      3. Under the Password rule, ensure that the value of Limitation on

      duplications is set between 1 and 24.'
    severity: medium
- id: '1.13'
  title: Ensure CAM password policy expires passwords in 365 days
  scoring: manual
  profile:
  - Level 1
  description: Configure user passwords to expire after a period not exceeding 365 days.
  rationale: CAM password policies can require passwords to be expired after a given number of days. Mandating password changes
    at regular intervals decreases the probability of long-term credential compromise.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/598/32649
  page_start: 42
  audit_raw: 'Using the management console:

    1. Login in to CAM console.

    2. Click Users > User Settings.

    3. Under the Password rule, ensure that the value of Periodically invalid is set

    to 365 days or less.'
  remediation: 'Using the management console:

    1. Login in to CAM console.

    2. Click Users > User Settings.

    3. In the Password rule > Periodically invalid > set to 365 days or less.

    4. Click Apply modification.'
  checks:
  - type: manual_review
    info: 'Using the management console:

      1. Login in to CAM console.

      2. Click Users > User Settings.

      3. Under the Password rule, ensure that the value of Periodically invalid is set

      to 365 days or less.'
    severity: medium
- id: '1.14'
  title: Ensure CAM password policy temporarily blocks logon after 5 incorrect logon attempts within an hour
  scoring: scored
  profile:
  - Level 1
  description: Enable account lockout to temporarily block user accounts after five consecutive unsuccessful login attempts
    within an hour.
  rationale: Immediate lockout after repeated failures is an effective deterrent against brute-force and credential stuffing
    attacks.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/598/32649
  page_start: 44
  audit_raw: 'Using the management console:

    1. Login in to CAM console.

    2. Click Users > User Settings.

    3. Under the Password rule, ensure that the value of Retry constraints is set to

    5.'
  remediation: 'Using the management console:

    1. Login in to CAM console.

    2. Click Users > User Settings.

    3. In the Password rule > Retry constraints > set to 5.

    4. Click Apply modification.'
  checks:
  - type: manual_review
    info: 'Using the management console:

      1. Login in to CAM console.

      2. Click Users > User Settings.

      3. Under the Password rule, ensure that the value of Retry constraints is set to

      5.'
    severity: medium
- id: '1.15'
  title: Ensure CAM policies that allow full "*:*" administrative privileges are not created
  scoring: manual
  profile:
  - Level 1
  description: Prohibit any policy creation that grants full administrative privileges.
  rationale: 'Permissive ":" policies violate the principle of least privilege and dramatically increase organizational risk
    in the event of account compromise or administrative error. It is highly recommended to start with a minimum set of permissions
    and grant additional permissions as necessary. Least privilege principle: granting only the permissions required to perform
    tasks. Determine what users need to do and then create policies with permissions only fits those tasks, instead of allowing
    full administrative privileges.'
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/598/35596
  page_start: 46
  audit_raw: 'Using the management console:

    1. Login in to CAM console.

    2. Click Policies.

    3. In the Policy page, click Custom Policy .

    4. Review custom policies and make sure that no policy has a statement that

    includes "Effect": Allow, "Action": *, and "Resource": *, or any policy with such

    statement is not attached to any CAM identities (including CAM users, user

    groups, or roles).'
  remediation: 'Using the management console:

    1. Login in to CAM console.

    2. Click Policies.

    3. In the Policy page, click Custom Policy .

    4. Click Create a custom policy. > Create by policy builder.

    5. Review and modify any policy set with statements that includes "Effect": Allow,

    "Action": *, and "Resource" to the minimum necessary privileges.'
  checks:
  - type: manual_review
    info: 'Using the management console:

      1. Login in to CAM console.

      2. Click Policies.

      3. In the Policy page, click Custom Policy .

      4. Review custom policies and make sure that no policy has a statement that

      includes "Effect": Allow, "Action": *, and "Resource": *, or any policy with such

      statement is not attached to any CAM identities (including CAM users, user

      groups, or roles).'
    severity: medium
- id: '1.16'
  title: Ensure CAM policies are attached only to groups or roles
  scoring: manual
  profile:
  - Level 1
  description: Enforce policy that restricts assignment of permissions directly to individual users. Policies should be assigned
    to groups or roles instead.
  rationale: Group-based and role-based assignments streamline permission management, make audits more efficient, and reduce
    the risk of excessive or outdated permissions.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/598/32666
  - 2. https://www.tencentcloud.com/document/product/598/10602
  page_start: 48
  audit_raw: 'In the CAM Console, review policy assignment details and identify any policies linked

    directly to user accounts.

    Alternatively, Using the management console:

    1. Login in to CAM console.

    2. Click Users > User List.

    3. Click on each username under User List, Username > Permissions >

    Permission Policy , ensure no policy is selected.'
  remediation: 'Perform the following to create a CAM user group and assign a policy to it:

    Using the management console:

    1. Login in to CAM console.

    2. Click User Groups.

    3. Click Create User Group > set User Group Name > click Next > Select the

    policy to be attached > Next > Completed.

    4. In User Group page, find the target "User Goup Name" , click Group name > click

    Associate Policies > Select the policy to be attached > click OK.

    5. In User Groups page, find the target "User Goup Name" > click Add user >

    Select the users to add > click OK.

    Perform the following to assign policies to user groups: Using the management

    console:

    1. Login in to CAM console.

    2. Click Policies.

    3. On the Policies page, select the policy to be associated > click Associate

    Users/Group/Role in the Operation column.

    4. In the Associate Users/User Groups/Roles pop-up window, switch to User

    Group in the Operation column and select the user group to associate with

    policy.

    5. Click OK to complete the association.'
  checks:
  - type: manual_review
    info: 'In the CAM Console, review policy assignment details and identify any policies linked

      directly to user accounts.

      Alternatively, Using the management console:

      1. Login in to CAM console.

      2. Click Users > User List.

      3. Click on each username under User List, Username > Permissions >

      Permission Policy , ensure no policy is selected.'
    severity: medium
- id: '2.1'
  title: Ensure that CloudAudit is configured to export all operational log records
  scoring: manual
  profile:
  - Level 1
  description: CloudAudit is used to perform supervision, compliance check, operation review, and risk review for your Tencent
    Cloud account. It records logs, and monitors and records account activities associated with operations performed through
    Tencent Cloud console, APIs, command line tools, and other services in the Tencent Cloud infrastructure. The records will
    help you conduct security analysis, resource change tracking, and troubleshooting.
  rationale: CloudAudit will be enabled when you create a Tencent Cloud account. An activity under your Tencent Cloud account
    will be recorded as an event by CloudAudit. You can view event records on the Operation Record page of the CloudAudit
    console. On this page, you can view and search for your Tencent Cloud account activities in the last 30 days. You can
    also create a CloudAudit tracking set to archive, analyze, and respond to changes in your Tencent Cloud resources. A tracking
    set is used to specify a COS bucket to store recorded events. You can create a tracking set via CloudAudit console or
    APIs.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/1021/37598
  page_start: 51
  audit_raw: 'Perform the following to determine if CloudAudit is enabled for all regions:

    Using the management Console:

    1. Login to CloudAudit Console.

    2. Click on Tracking Set on the left navigation pane, you will be presented with a

    list of Tracking Set.

    3. Ensure at least one Tracking Set has All in the Resource type and All in the

    Event Type.

    4. Ensure Shipping Location is configured to export events to COS for storage.'
  remediation: 'Perform the following to enable all-resource-type CloudAudit logging:

    Using the management Console:

    1. Login to CloudAudit Console.

    2. Click on Tracking Set on the left navigation pane.

    3. Click Create to create new Tracking Set.

    a. Enter a trail name in the Tracking Set Name.

    b. Set Event Type to All .

    c. In the Shipping Location, select COS under ‘Ship the event to’ setting and

    specify the COS (either existing buckets or to create a new bucket under the

    current account).

    d. In the Delivery location, select Log Service CLS and specify a CLS project

    name.

    e. Click Creation Completed.'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if CloudAudit is enabled for all regions:

      Using the management Console:

      1. Login to CloudAudit Console.

      2. Click on Tracking Set on the left navigation pane, you will be presented with a

      list of Tracking Set.

      3. Ensure at least one Tracking Set has All in the Resource type and All in the

      Event Type.

      4. Ensure Shipping Location is configured to export events to COS for storage.'
    severity: medium
- id: '2.2'
  title: Ensure the COS used to store CloudAudit logs is not publicly accessible
  scoring: manual
  profile:
  - Level 1
  description: CloudAudit logs a record of every API call made in your Tencent Cloud account. These logs file are stored in
    a designated COS bucket. It is recommended that the access control list (ACL) of this COS bucket, which CloudAudit logs
    to, be configured to deny public access to prevent exposure of sensitive operational and security data.
  rationale: Allowing public access to COS containing CloudAudit log content may aid an adversary in identifying weaknesses
    in the affected account's use or configuration.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/436/12470
  page_start: 53
  audit_raw: 'Perform the following to determine if any public access is granted to the COS bucket via

    an ACL:

    Using the Management Console:

    1. Login to CloudAudit Console.

    2. In the API activity history pane on the left, click Trails.

