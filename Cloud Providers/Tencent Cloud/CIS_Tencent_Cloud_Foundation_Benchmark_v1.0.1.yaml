benchmark:
  id: cis-tencent-cloud-foundation-benchmark
  title: CIS Tencent Cloud Foundation Benchmark
  version: 1.0.1
  technology: Tencent Cloud
  category: Cloud Providers
  os: Tencent Cloud
  source_pdf: CIS_Tencent_Cloud_Foundation_Benchmark_v1.0.1.pdf
  total_pages: 260
