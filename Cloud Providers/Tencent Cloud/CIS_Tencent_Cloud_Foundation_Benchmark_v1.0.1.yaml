    These logs are stored in JSON format and can be searched or used to generate configurable policies. These logs capture
    activities performed by users, administrators, and system components that impact the cluster, including metadata (such
    as the request initiator, source, and accessed URI) and, depending on audit level, request and response objects.
  rationale: 'Enabling Cluster Audit provides visibility into Kubernetes cluster’s operations from an auditing perspective,
    such as: • Activities that occur in the cluster • Activity occurrence times and objects • Activity triggering times, triggering
    positions, and observation points • Activity results and subsequent processing. This ensures accountability, supports
    compliance requirements, and provides reliable evidence for incident investigation and forensic analysis.'
