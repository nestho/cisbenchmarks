- id: '6.6'
  title: Ensure Basic Authentication is not ‘Enabled’ on Kubernetes Engine Clusters
  scoring: scored
  profile:
  - Level 1
  description: Basic authentication allows users access the Kubernetes cluster with a username and password, which are stored
    in plain text without any encryption. This creates security risks, such as intercepted credentials and brute-force attacks.
    Disabling Basic authentication reduces these risks.
  rationale: Basic Authentication creates security risks, such as intercepted credentials and bruteforce attacks. Disabling
    Basic authentication reduces these risks. It is recommended to disable Basic Authentication and use client certificate
    to securely access Kubernetes cluster. A client certificate is a base 64-encoded public certificate used by clients to
    authenticate to the cluster endpoint, providing stronger security than Basic Authentication.
  impact: ''
  references: []
  page_start: 167
  audit_raw: '1. ssh into any master node in cluster

    2. Make sure the basic-auth-file not exist in apiserver manifest with below

    command:

    cat /etc/kubernetes/manifests/kube-apiserver.yaml | grep basic-auth-file'
  remediation: '1. ssh into any master node in cluster.

    2. Make sure the basic-auth-file not exist in apiserver manifest with below

    command:

    cat /etc/kubernetes/manifests/kube-apiserver.yaml | grep basic-auth-file

    3. If you found basic-auth-file existing in apiserver manitfest, please override the

    manifest file with new manifest content to not include the basic-auth-file and then

    restart the apiserver, you need repeat the action on all of the master nodes'
  checks:
  - type: command
