- id: '2.3'
  title: Ensure audit logs for multiple cloud resources are integrated with Cloud Log Service
  scoring: manual
  profile:
  - Level 1
  description: 'Tencent Cloud Log Service (CLS) provides log collection and real-time analysis across multiple cloud resources.
    By integrating logs from different sources, enterprises can achieve large-scale security governance and monitor all their
    resources. CLS supports log collection from the following sources: • CloudAudit: Records all API calls made within a Tencent
    Cloud account, including user identity, request time, API operations, request parameters, response content, and other
    details. This facilitates operation audits, risk tracking, and security monitoring. • MySQL : Records database operation
    logs, covering all Data Manipulation Language (DML) and Data Definition Language (DDL) operations. Log fields include
    executed SQL statements, operation types, operation times, database names, table names, user information, and more. With
    minimal impact on system performance, this enables users in auditing database operations and enhancing database security.
    • COS : Records detailed information on all COS interactions, including operation types (such as upload, download, file
    deletion), access times, requested storage buckets, requested file names, visitor IP addresses, request results, and more,
    providing users with a comprehensive view of COS access and operations. • CLB : Records detailed information about all
    HTTP(S) traffic, including request times, client IPs, request URIs, request methods, response times, backend server addresses,
    response status codes, and request/response byte counts. These logs enable monitoring of traffic conditions, server health,
    and request handling. • API Gateway: Records detailed access logs for each API request, including API name, caller IP
    address, request method, requested URL, response status code, response/byte counts, and response time. These logs enable
    monitoring of API performance, request analysis, and usage tracking. These logs can be centrally collected and stored
    in Tencent Cloud Log Service (CLS), supporting real-time analysis, alert configuration, and dashboard visualization to
    help users to continuously monitor and audit their cloud resources.'
  rationale: After sending the audit logs to CLS, real-time and historical activity records based on users, APIs, resources,
    and IP addresses can be generated. This allows logs from multiple cloud products to be centrally collected in CLS, supporting
    the creation of alert and notification mechanisms to quickly detect anomalies or sensitive records.Additionally, the log
    retention period can be extended to 180 days.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/614/38200
  page_start: 55
  audit_raw: 'Perform the following to ensure the logs are integrated with CLoud Log Services:

    1. In the CLS cloud product access list, find the operation guidelines for the cloud

    products that need to deliver logs.

    2. Log in to the respective cloud product console and follow the guidelines to enable

    log delivery to CLS.

    3. After enabling log delivery to CLS, go to the CLS console to view the detailed

    logs.'
  remediation: 'Perform the following to ensure the logs are integrated with CLoud Log Services:

    1. Log in to the CLS console.

    2. Click Log Topic on the left sidebar > Log Topic.

    3. Check the corresponding log topic for the logs delivered by the respective

    product. The cloud product label will appear on the right of the Log Topic name.

    4. Click on the target Log Topic name to see the detailed content of the cloud

    product’s log topic. To change the retention period, click Edit under the

    Operation column.

    5. Under Log retention policy > Storage Period > configure the log retention

    duration.

    6. Click OK to save the modifications.'
