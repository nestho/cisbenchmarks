  title: Ensure that COS bucket is not anonymously or publicly accessible
  scoring: scored
  profile:
  - Level 1
  description: Cloud Object Storage (COS) uses buckets as containers to store objects. Each object is associated with a bucket,
    where access is managed through ACLs and bucket policies. It is recommended that COS buckets are not configured to allow
    anonymous and/or public access.
  rationale: Allowing anonymous and/or public access permits anyone to read and/or modify bucket content, which may expose
    sensitive or business-critical data. Restricting access ensures that only authorized accounts and identities can interact
    with COS buckets, thereby reducing the risk of data leakage or misuse.
  impact: Buckets that are intentionally configured to allow anonymous and/or public access due to business requirements may
    be impacted.
  references:
  - 1. https://www.tencentcloud.com/document/product/436/13315
  page_start: 122
