- id: '5.1'
  title: Ensure TencentDB for MySQL instance requires all incoming connections to use SSL
  scoring: scored
  profile:
  - Level 1
  description: SSL (Secure Sockets Layer) authentication secures connections between the client and the TencentDB for MySQL
    instances through authenticating both the user and the server.When SSL encryption is enabled, a CA certificate is obtained
    and uploaded to the server.When the client connects to the database, the SSL protocol establishes a secure SSL channel
    that encrypts data in transit, preventing interception, tampering, or eavesdropping, ensuring the secure exchange of information.
  rationale: 'When SSL, all information transferred over the network will be in plaintext, making it vulnerable to eavesdropping,
    tampering, and impersonation by malicious users. Enabling SSL addresses these risks and provides the following protections:
    • Data in transit is encrypted preventing eavesdropping. • Communication integrity is verified, allowing immediate detection
    of tampering detection. • Identity certificates authenticate the server and client, ensuring secure and trusted connections.'
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/236/48452
  page_start: 143
  audit_raw: 'Using the management console:

    1. Log in to the TencentDB for MySQL console.

    2. In the Instance List, click an Instance ID or Manage in the Operation

    column to enter the instance management page.

    3. On the Instance Management page, select the Data Security > SSL tab.

    4. Check whether the button after Status is enabled, and if so, SSL is enabled for

    the instance.'
  remediation: 'Using the management console:

    1. Log in to the TencentDB for MySQL console.

    2. In the Instance List, click an Instance ID or Manage in the Operation

    column to enter the instance management page.

    3. On the Instance Management page, select the Data Security > SSL tab.

    4. The default status of this function is not enabled, turn on the button after "Status",

    and then click OK to enable SSL.

    5. Click Download to download the SSL CA certificate.The certificate has a validity

    period of 20 years.

    The downloaded file is a compressed package (TencentDB-CA-Chain.zip), which

    contains the following three files:

    • .p7b file: It is used to import the CA certificate into Windows.

    • jks file: A storage file for truststore and keystore in Java with a unified password

    of tencentdb, used for importing the CA certificate chain in Java programs.

    • .pem file: It is used to import the CA certificate into other systems or applications.'
  checks:
  - type: manual_review
    info: 'Using the management console:

      1. Log in to the TencentDB for MySQL console.

      2. In the Instance List, click an Instance ID or Manage in the Operation

      column to enter the instance management page.

      3. On the Instance Management page, select the Data Security > SSL tab.

      4. Check whether the button after Status is enabled, and if so, SSL is enabled for

      the instance.'
    severity: medium
- id: '5.2'
  title: Ensure TencentDB for MySQL instance does not allow public access
  scoring: scored
  profile:
  - Level 1
  description: TencentDB instances use Security Groups to control inbound and outbound network access. It is recommended that
    TencentDB for MySQL instances are not configured to allow public access.
  rationale: Allowing public access exposes database instances to the internet, increasing the risk of unauthorized access,
    data leakage, or malicious activity. Restricting access ensures that only trusted networks or clients can connect to the
    database, reducing the attack surface and protecting sensitive data.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/236/14470
  page_start: 145
  audit_raw: 'Perform the following to check:

    Using the TencentDB for MySQL Console:

    1. Log in to the TencentDB for MySQL console.

    2. In the Instance List, click an Instance ID or Manage in the Operation

    column to enter the instance management page.

    3. On the Instance Management page, choose the Security Group page.

    4. On the Security Group page, check whether a security group is configured for the

    current instance, and that the inbound rules of the security group DO NOT open

    all ports.'
  remediation: 'Create a security group, configure inbound rule and bind it to the TencentDB for MySQL

    instance to restrict public access to the database:

    Using the Security Group Console:

    1. Log in to the Security Group Console.

    2. select a region, and click Create.

    3. In the pop-up dialog window, complete the configuration as needed (do not select

    "Open all ports" for the template), and click OK.

    4. Find the newly created security group in the security group list and click Modify

    Rule in its Operation column.

    5. Under Security group rules > Inbound rules, click Add rule, configure the

    source, protocol:port, and policy as needed, and click OK to complete the

    creation of the security group.

    Using the TencentDB for MySQL Console:

    1. Log in to the TencentDB for MySQL console.

    2. In the Instance List, click an Instance ID or Manage in the Operation

    column to enter the instance management page.

    3. On the Instance Management page, choose the Security Group page.

    4. On the Security Groups page, click Configure Security Group, and then

    check the security group created above in the pop-up window. If the current

    instance has selected security groups that open all ports, you need to uncheck

    them accordingly, and finally click OK.'
  checks:
  - type: manual_review
    info: 'Perform the following to check:

      Using the TencentDB for MySQL Console:

      1. Log in to the TencentDB for MySQL console.

      2. In the Instance List, click an Instance ID or Manage in the Operation

      column to enter the instance management page.

      3. On the Instance Management page, choose the Security Group page.

      4. On the Security Group page, check whether a security group is configured for the

      current instance, and that the inbound rules of the security group DO NOT open

      all ports.'
    severity: medium
