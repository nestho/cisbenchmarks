  title: Ensure that Logstore data retention period is set 365 days or greater
  scoring: scored
  profile:
  - Level 2
  description: Configure Log Service logstore retention to a minimum of 365 days to meet compliance requirements and support
    long-term log analysis and troubleshooting.
  rationale: 'Setting a retention period of 365 days or longer ensures: • Compliance with regulatory requirements such as
    financial industry standards (typically mandating log retention for ≥6 months) • Availability of complete log evidence
    for security incident investigations • Support for multi-dimensional retrospective analysis of business anomalies'
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/614/34239
  page_start: 104
  audit_raw: 'Using the management console:

    1. Log in to the CLS console.

    2. Select Log Topic on the left sidebar to enter the Log Topic list page.

    3. Check each log topic in the list to verify whether the Retention Time is greater

    than or equal to 365 days.

    Using the TCCLI:

    Run the following command to obtain the list of CLS log topics, then check whether the

    log retention period is >=365 days based on the Period parameter in TopicInfo.

    tccli cls DescribeTopics --region <your topic region>'
  remediation: 'Using the management console:

    1. Log in to the CLS console.

    2. Select Log Topic on the left sidebar to enter the Log Topic list page.

    3. Locate the log topics with a retention period of less than 365 days, click Edit to

    open the editing page.

    4. Find the Storage Period configuration and modify it to 365 days.

    5. Click OK.

    Using the TCCLI:

    Run the following command to get the topic list and check the topic retention period

    tccli cls DescribeTopics --region <your topic region>

    Run the following command to modify the log topic retention period to 365 days

    tccli cls ModifyTopic --TopicId <your topicID> --Period 365'
