  scoring: scored
  profile:
  - Level 1
  description: Tencent Kubernetes Engine (TKE) provides a cluster health check feature to evaluate the status and health of
    cluster resources. The resulting report displays the detailed information on the components, nodes, workloads, and other
    items. If an exception is detected, this feature will provide insights on the issue, automatically analyze its severity,
    cause, and impact, and propose rectification suggestions.
  rationale: 'The main check Items of cluster health check: • Check whether the component is running. • Check whether the
    node status is Ready and free of issues, such as insufficient memory and insufficient disk space. • Check whether the
    number of available pods meets the workload expectations. • Check whether the current cluster is a single-node deployment.
    • Check whether containers in workload are configured with resource limits. • Check whether affinity or anti-affinity
    is configured for workload. • Check whether PDB is configured for workload to maintain availability during eviction. •
    Check whether health checks are configured for workloads. • Check whether remaining pod IP addresses are sufficient for
    HPA scale-out.'
