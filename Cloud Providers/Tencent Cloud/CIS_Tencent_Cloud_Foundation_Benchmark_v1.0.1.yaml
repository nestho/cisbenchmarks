    Topic Name.

    d. Click Create completed.

    4. Login to CLS Console.

    5. Click Monitoring Alarm >Alarm Policy in the left navigation pane.

    6. Click Create.

    a. Enter a name in the "Alert Name" box.

    b. Select the Log Topic where the log is located in the Monitoring Object.

    c. enter the following query statements in the Query statement section.

    eventName:(CreateRole OR UpdateAssumeRolePolicy OR DeleteRole OR

    AttachRolePolicy OR DetachRolePolicy) AND resourceType:cam | select count(*)

    as log_count limit 100

    7. Set Alarm severtiy:Alarm, Query state:Results , > ,0 as in Trigger Condition.

