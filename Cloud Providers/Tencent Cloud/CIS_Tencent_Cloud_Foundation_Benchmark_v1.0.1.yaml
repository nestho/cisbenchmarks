  title: Ensure routing tables for VPC peering are "least access"
  scoring: manual
  profile:
  - Level 1
  description: After a VPC is associated with a peering connection, it is necessary to add routing policies to direct traffic
    to the peering connection. By default, routing policy is empty. Users can configure routing policies as needed to enable
    communication between different network segments or different hosts in VPCs. The configuration of policies should follow
    the “principle of least access" to minimize unnecessary or unintended network intercommunication between business traffic.
  rationale: Overly broad routing rules may expose sensitive traffic or enable lateral movements across VPCs. Restricting
    routes to the minimal subnets or hosts adheres to the principle of "least access", reducing the risk of data leakage,
    misrouting or unauthorized access.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/553
  page_start: 111
  audit_raw: '1. Log in to the VPC console.

