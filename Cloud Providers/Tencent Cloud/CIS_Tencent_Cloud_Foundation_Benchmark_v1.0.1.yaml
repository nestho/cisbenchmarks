    Control List (ACL) in addition to the bucket ACL. It is recommended that object-level ACLs are not configured to allow
    public access.
  rationale: Allowing public access to objects allows anyone on the internet to access sensitive business data. Even if a
    bucket ACL does not allow public access, individual objects may still be publicly accessible if their ACLs allow public
    access. Hence it is important to check ACLs at both the bucket and object levels.
  impact: Objects that are intentionally configured to allow public access due to business requirements may be impacted.
  references:
  - 1. https://www.tencentcloud.com/document/product/436/13327
