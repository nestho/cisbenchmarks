    container IP addresses are ENI IP addresses allocated by the IPAMD component.
  rationale: 'The VPC-CNI mode supports the shared and exclusive ENI modes for different scenarios, which can be selected
    based on workload requirements. • Shared ENI mode: Pods share an ENI, with the IPAMD component allocating multiple ENI
    IP addresses across Pods. Pod IP addresses can be fixed. For more information, see Static IP Address Features. • Exclusive
    ENI mode: Each Pod uses an exclusive ENI for higher performance. The number of ENIs available per node varies depending
    on model, with fewer numbers for single-node cluster. .'
