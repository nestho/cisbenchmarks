    Access Control List (ACL) and Bucket Policy.

    Using the Bucket ACL:

    1. Logon to COS console.

    2. In the Bucket List pane, click on a target COS bucket.

    3. Click Permission Management.

    4. Under Bucket ACL(Access Control List) section, ensure the Bucket ACL is

    set to Private Read/Write.

    Using the Bucket Policy:

    1. Logon to COS console.

    2. In the Bucket List pane, click on a target COS bucket.

    3. Click Permission Management.

    4. Under Permission Policy Settings section, ensure that when Everyone (*)

    is selected under User and Allow is not selected under Effect.'
  remediation: 'The anonymous or public access to COS bucket can be restricted through both Bucket

    ACL and Bucket Policy.

    Using the Bucket ACL:

    1. Logon to COS console.

    2. In the Bucket List pane, click on a target COS bucket.

    3. Click Permission Management.

    4. Under Bucket ACL(Access Control List) section, select Private

    Read/Write.

    5. Click Save.

    Using the Bucket Policy:

    1. Logon to COS console.

    2. In the Bucket List pane, click on a target COS bucket.

    3. Click Permission Management.

    4. Under Permission Policy Settings section, if Everyone (*) is selected

    under User and Allow is selected under Effect in a strategy,delete the

    strategy.'
  checks:
