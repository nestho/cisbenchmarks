  scoring: manual
  profile:
  - Level 1
  description: It is recommended to configure metric filters and alarms to monitor Tencent Cloud Access Management (CAM) Role
    creation, deletion and updating activities.
  rationale: CAM offers predefined and custom roles to enforce least-privilege access to resources. By leveraging Log Service
    to monitor CAM role lifecycle activities in real time, users can promptly identify any potential malicious actions, enhancing
    overall identity and access governance.
  impact: ''
  references:
  - 1. https://www.tencentcloud.com/document/product/614/39574
  - 2. https://www.tencentcloud.com/document/product/1021/42145
  page_start: 70
  audit_raw: 'Perform the following to ensure the log monitoring and alerts are set up for CAM

    Role Changes:

    1. Login to CloudAudit Console.

    2. Click on Tracking Set on the left navigation bar, you will be presented with a

    list of trails.

    3. Ensure at least one Tracking Set has CAM in the Resource type,and include

    the following events: CreateRole, UpdateAssumeRolePolicy, DeleteRole,

    AttachRolePolicy, DetachRolePolicy.

    4. Click on a tracking set name in the Name column.

    5. Make sure Enable Logging is turned on and Shipping Location is ship the

    event to CLS for storage.

    6. Login to CLS Console.

    7. Click Monitoring Alarm > Alarm Policy on the left navigation bar to enter the

    alarm policy list page.

    8. Search for the Alarm Policy using the Monitoring Object ID in the search

    box at the top right. The Monitoring Object ID is the log topic ID of the log.

    9. Check whether the alarm policy includes the following query statements.

    eventName:(CreateRole OR UpdateAssumeRolePolicy OR DeleteRole OR

    AttachRolePolicy OR DetachRolePolicy) AND resourceType:cam | select count(*)

    as log_count limit 100'
