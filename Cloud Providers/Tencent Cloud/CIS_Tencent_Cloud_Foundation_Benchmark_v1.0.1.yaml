  title: Ensure that remote access is restricted from the internet
  scoring: manual
  profile:
  - Level 2
  description: The security group has a stateful packet filtering function, which is used to set network access control for
    cloud servers, load balancing, cloud databases and other instances, to control the inbound and outbound traffic at the
    CVM instance level. To minimize exposure, it is recommended that the inbound rule should not allow unrestricted remote
    access. Access should only be limited to specific trusted IP ranges or managed through bastion hosts.
  rationale: Limit unrestricted SSH and RDP access reduces attack surface by preventing unauthorized or brute-force attempts
    from the public internet.
  impact: All SSH and RDP connections from outside the network to the target VPC(s) will be blocked. If legitimate business
    requirements necessitate external ssh access, specific trusted source IP(s) must be explicitly whitelisted in the security
    group or firewall rules to permit access to the relevant VPC resources.
