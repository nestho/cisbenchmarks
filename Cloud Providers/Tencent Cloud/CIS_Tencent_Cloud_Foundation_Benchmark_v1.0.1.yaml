- id: '5.5'
  title: Ensure TencentDB for MySQL instance has TDE (Transparent Data Encryption) set to ‘Enabled’
  scoring: manual
  profile:
  - Level 1
  - Level 2
  description: TencentDB for MySQL supports Transparent Data Encryption (TDE), which encrypts and decrypts data files automatically,
    without user intervention. Data is encrypted before being written to disk and decrypted when read into memory. It is recommended
    to enable TDE to ensure data at rest is protected and compliance requirements are met. TencentDB for MySQL’s Transparent
    Data Encryption (TDE) relies on encryption keys managed by Tencent Cloud’s Key Management Service (KMS). It is recommended
    to enable BYOK (Bring Your Own Key), allowing users to provide or generate their own encryption keys for TDE, giving them
    full control over key management and encryption.
  rationale: Enabling TDE ensures that sensitive data stored in TencentDB for MySQL is encrypted, reducing the risk of unauthorized
    access in case of storage compromise. Users may also use their own certificates to manage encryption keys, providing additional
    control over data security. Using BYOK ensures that sensitive data is encrypted with keys managed by the user, providing
    enhanced control over data security and compliance. This reduces reliance on platform-managed keys and allows organizations
    to meet internal or regulatory requirements for key ownership.
  impact: ''
  references:
  - 1. https://cloud.tencent.com/document/product/236/41101
  - 1. https://cloud.tencent.com/document/product/236/41101
  page_start: 152
