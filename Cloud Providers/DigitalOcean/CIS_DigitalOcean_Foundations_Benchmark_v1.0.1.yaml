- id: '5.1'
  title: Ensure Security History is Reviewed Regularly
  scoring: manual
  profile:
  - Level 1
  description: Your team’s security history shows a record of actions that have been taken by team members within your Team
    (e.g.,Creating resources, deleting resources, amending API tokens, etc). Specifically, the history includes the action,
    the user who performed the action, the originating IP address, and how long ago the action happened. If you need data
    older than what is available in your security history, open a Support ticket. For account activity, like logging in or
    joining a team, view your account’s Activity tab.
  rationale: 'Review the security history for your Team is important for many reasons, including: • Maintaining accountability:
    Security history tracks when changes were made as well as the individual who orchestrated the change. This information
    is essential in troubleshooting. • Detect unauthorized actions: Provided the security history is a log of account activity,
    team owners can identify actions taken by team members unauthorized to perform said action or unauthorized third parties
    with ease.'
  impact: There are no adverse consequences to reviewing security history.
  references:
  - 1. https://cloud.digitalocean.com/account/activity
  - 2. https://cloud.digitalocean.com/account/security
