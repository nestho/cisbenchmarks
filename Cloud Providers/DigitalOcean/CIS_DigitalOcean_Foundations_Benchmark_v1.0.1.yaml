controls:
- id: '2.1'
  title: Ensure Secure Sign In for Teams is Enabled
  scoring: manual
  profile:
  - Level 1
  description: At DigitalOcean, when a team owner requires team members to use a secure sign-in method, only team members
    who log in to DigitalOcean via Google or GitHub or a DigitalOcean account with two-factor authentication (2FA) can access
    the team. This functionality can be enabled during team creation or anytime thereafter.
  rationale: 'Ensuring team members leverage secure sign in methodologies is important for: • Enhanced Security: Secure sign-in
    methods, such as two-factor authentication (2FA) via Google, GitHub, or DigitalOcean''s own 2FA, add an extra layer of
    protection against unauthorized access. • Access Control: By requiring secure sign-in, team owners introduce a control
    which limits access to team resources to authorized members, thereby reducing the risk of unauthorized access and misuse
    of resources. • Risk Mitigation: Enforcing secure sign-in mitigates risks associated with weak passwords or compromised
    accounts.'
  impact: There are no major adverse consequences to enabling secure sign on for Teams.
  references:
  - 1. https://docs.digitalocean.com/platform/accounts/settings/#sign-in-method
  - 2. https://docs.digitalocean.com/platform/accounts/2fa/
  page_start: 19
  audit_raw: "1. Click the profile icon in the top right of the Control Panel\nhttps://cloud.digitalocean.com/ to open the\
    \ drop-down menu.\n2. Click Switch Teams.\n3. Click the name of the team you want to audit for secure sign-in.\n4. On\
    \ the left menu of the Control Panel, click Settings to go to the Team\nSettings page.\n5. View the status of secure sign-in\
    \ in the Secure sign-in section within the\nTeam tab.\n Page 19"
  remediation: '1. To require secure sign-in for a team, first switch to the team in the Control Panel

    https://cloud.digitalocean.com/. Click the profile icon in the top right to open the

    drop-down menu, click Switch Teams, then click the name of team you want to

    update.

    2. In the left menu of the control panel, click Settings to go to the team

    settings page [https://cloud.digitalocean.com/account/team]

    (https://cloud.digitalocean.com/account/team). In the Secure sign-in section,

    click Enable.

    3. In the window that opens, click Enable Secure Sign-In. This notifies all

    team members via email that secure sign-in is now required.

    If your DigitalOcean account doesn’t use a secure sign-in, you are then prompted to

    update your sign-in method.

    Similarly, when a team member without an accepted sign-in method tries to access the

    team, they are prompted to update their sign-in method to regain access to the team.

    This prevents team members from accessing the team until they switch to Google or

    GitHub or enable 2FA on their DigitalOcean account.'
  checks:
  - type: manual_review
    info: "1. Click the profile icon in the top right of the Control Panel\nhttps://cloud.digitalocean.com/ to open the drop-down\
      \ menu.\n2. Click Switch Teams.\n3. Click the name of the team you want to audit for secure sign-in.\n4. On the left\
      \ menu of the Control Panel, click Settings to go to the Team\nSettings page.\n5. View the status of secure sign-in\
      \ in the Secure sign-in section within the\nTeam tab.\n Page 19"
    severity: medium
- id: '2.2'
  title: Ensure Two Factor Authentication for all Accounts/ Teams is Enabled
  scoring: manual
  profile:
  - Level 1
  description: 'To understand two-factor authentication (2FA), we must first understand authentication factors. An authentication
    factor is a piece of information used to verify that you’re allowed to do something, like a keycard used to unlock a hotel
    door. The following list presents a non-exhaustive list of authentication factors: • Something you know: Private knowledge
    that only you have(e.g. Password or PIN). • Something you have: Physical object that only you have(e.g. phone, a key,
    or a bank card). • Something you are: Physical characteristic that only you have(e.g. Fingerprint or your voice). With
    that in mind, consider that 2FA is a form of verification that requires two authentication factors. An example of this,
    in practice, is a bank requiring your bank card (something you have) and your PIN (something you know) before allowing
    you to withdraw funds. When you first create your account, 2FA is disabled by default; but, enabling and subsequently
    auditing the functionality is simple.'
  rationale: 'Enabling two-factor authentication is important for: • Enhanced Security: 2FA adds an extra layer of protection
    by requiring not just a password (something you know), but also a second form of verification, such as a code sent to
    your phone (something you have). • Compliance: Implementing 2FA promotes an organization’s adherence to many regulatory
    and cybersecurity frameworks (e.g. HIPAA, PCI DSS, etc.)'
  impact: Provided Two-factor authentication relies on device ownership, there is a risk of exploitation should the device
    be confiscated by a bad actor. Page 21
  references:
  - 1. https://en.wikipedia.org/wiki/Keycard_lock
  - 2. https://cloud.digitalocean.com/account/profile
  page_start: 21
  audit_raw: "1. Log in to the Control Panel https://cloud.digitalocean.com/.\n2. Click the profile icon in the top right\
    \ corner.\n3. In the menu that opens, click My Account to go to your My Account page.\n4. View the Sign-in method row.\n\
    a. If you used Google or Github as your Sign-in method, Two-factor\nauthentication is enabled, but the section will not\
    \ appear.\nb. If you used email as your Sign-in method, the Two-factor authentication\nsection will appear below the Sign-in\
    \ method. The section will have a button\nlabeled Set Up 2FA if it has not already been set up.\n5. Scroll to the bottom\
    \ of the page to view a listing of your team members. The\nfourth column shows each member’s sign-in method and indicates\
    \ if they\nenabled 2FA.\n Page 22"
  remediation: "1. Log in to the Control Panel https://cloud.digitalocean.com/ and click the profile\nicon in the top right\
    \ corner.\n2. In the menu that opens, click My Account to go to your My Account page.\nThen, in the Two-factor authentication\
    \ section, click Set Up 2FA.\n3. When you click the Set Up 2FA button, the Set up two factor\nauthentication window opens\
    \ on the Choose Methodstep. You need to\nchoose your authentication method: either using an authentication app or using\n\
    SMS.\nUsing an Authentication App (Recommended)\nAuthenticator apps like Google Authenticator, Authy, 1Password, Microsoft\n\
    Authenticator, and Duo are small, free mobile applications used to generate\nsecurity codes. They work globally and are\
    \ more secure than SMS because they\ndon’t transmit the security codes across the network.\nWhen you choose this method,\
    \ you need to scan the provided QR code using the\nauthenticator app on your phone or tablet. This links your device to\
    \ your\nDigitalOcean account.\nIf you’re unable to scan the QR code, click the Try this instead link directly\nunderneath\
    \ it to get a numerical code which you can enter manually. Follow the\ndirections in your specific authenticator app to\
    \ enter the code, then enter the PIN\nthat the app gives you in the space provided. Once you’ve entered the PIN, the\n\
    app links with your DigitalOcean account.\nOnce your DigitalOcean account and 2FA app are linked, when you log in to\n\
    DigitalOcean, you need to open the app and enter the code provided in the\ncontrol panel to finish logging in.\nSome authenticator\
    \ apps have features like backups and syncing to help you\nrestore access to the app if you lose your device. We recommend\
    \ using these\nfeatures for added reliability.\nUsing SMS\nIf you select SMS, your mobile carrier must be able to deliver\
    \ a text message,\nwhich means you need mobile signal or an internet connection. This may be\ninconvenient when traveling\
    \ internationally. In addition, because SMS messages\nare vulnerable to being intercepted by hackers, they’re not as secure\
    \ as an app.\nHowever, using SMS for 2FA still provides much stronger security for your\naccount than not enabling 2FA\
    \ at all.\nWhen you select SMS, you are prompted for the phone number. You cannot use\nVoIP or Telephony telephone numbers\
    \ from services like Google Voice or Ooma.\n Page 23\nOnce you enter the code, DigitalOcean sends a code via SMS. When\
    \ you receive\nit, enter the code to link your phone and your account. From then on, you receive\ncodes via SMS to enter\
    \ into the control panel to complete your login.\n4. Once you’ve configured your primary method for 2FA, you need to add\
    \ a backup\nmethod. This is how you can regain access to your account if your 2FA device is\nlost or stolen. You can use\
    \ backup codes or an authenticator app. We\nrecommend using backup codes.\nBackup Codes (Recommended)\nBackup codes act\
    \ like a second password, so store them in a secure place that\nyou can access without your phone.\nBackup codes are visible\
    \ on-screen when you enable 2FA. You can also\ndownload a .txt file called digitalocean_backupcodes.txt.\nBackup codes\
    \ are single use, so it can be helpful to delete or cross out a backup\ncode once you use it. If you only have a few valid\
    \ backup codes left, you can\ngenerate more. When you regenerate backup codes, any remaining codes from\nbefore are no\
    \ longer valid.\nAuthenticator App\nYou can use an authenticator app like Google Authenticator or Duo as your\nbackup\
    \ solution.\nWe do not recommend this because it is phone-based, and only selectable as a\nbackup option if you select\
    \ SMS as your primary 2FA solution. In the scenario\nwhere you can’t access your SMS messages and need to use a backup\
    \ method,\nyour phone might not be a valid option to use due to whatever is preventing SMS\naccess.\nFor this reason,\
    \ we recommend using an authenticator app as your primary 2FA\nmethod with backup codes."
  checks:
  - type: manual_review
    info: '1. Log in to the Control Panel https://cloud.digitalocean.com/.

      2. Click the profile icon in the top right corner.

      3. In the menu that opens, click My Account to go to your My Account page.

      4. View the Sign-in method row.

      a. If you used Google or Github as your Sign-in method, Two-factor

      authentication is enabled, but the section will not appear.

      b. If you used email as your Sign-in method, the Two-factor authentication

      section will appear below the Sign-in method. The section will have a button'
    severity: medium
- id: '2.3'
  title: Ensure SSH Keys are Audited
  scoring: scored
  profile:
  - Level 1
  description: Secure Shell (SSH) keys are a pair of cryptographic keys that operate as a more secure method to authenticate
    to a server as opposed to a password. Technically, SSH is a network protocol used to securely access and manage machines
    over an unsecured network. SSH keys must be added prior to Droplet creation and cannot be retroactively added to Droplets
    when other keys are added. When the authorized keys are placed on a Droplet, they control access to the root account only,
    not named users accounts. Access for named users must be set up individually on the Droplet operating system, not via
    the DigitalOcean cloud platform. Auditing SSH keys is a process that involves reviewing and verifying the security and
    appropriateness of SSH keys used within an organization. This process is crucial for maintaining security and compliance,
    especially in environments where SSH is used extensively for remote access and authentication. Some important aspects
    of SSH key use are ensuring the key is generated using a secure algorithm, ensuring the private key is securely stored,
    and verifying the public and private keys are correctly paired.
  rationale: 'Auditing SSH keys is important for several reasons. including: • Compliance with Regulatory Requirements: Implementing
    SSH keys promotes an organization’s adherence to cybersecurity frameworks (e.g. SOC 2). • Prevention of Unauthorized Access:
    If compromised or unmanaged, SSH keys can provide unauthorized access to systems. As such, auditing helps identify and
    mitigate this risk by ensuring all keys are accounted for and properly secured.'
  impact: There are no major adverse consequences to auditing SSH keys. Page 26
  references:
  - 1. https://cloud.digitalocean.com/account/profile
  - 2. https://www.digitalocean.com/community/tutorials/ssh-essentials-working-withssh-servers-clients-and-keys
  page_start: 26
  audit_raw: 'To check if your DigitalOcean account has an SSH key associated:

    1. Log into your Control Panel.

    2. Select Settings in the bottom left of the panel.

    3. Select the Security tab in the settings menu.

    4. In the SSH Keys section, you should see a list of all the SSH keys associated

    with your DigitalOcean account. Each SSH key is typically identified by a name

    you provided when you added it. If there are SSH keys listed, it means you have

    SSH keys associated with your account.

    5. Verify the key details by clicking on each SSH key to view its details, including

    the name, fingerprint, and the date it was added. This can help you confirm the

    existence of your SSH key.

    If you do not see any SSH keys listed in this section, it means that there are no SSH

    keys associated with your DigitalOcean account. In that case, follow the steps outlined

    in the remediation.'
  remediation: "Page 27\nAdd SSH Keys to a Team\nUsing the Control Panel\n1. Log in to the Control Panel and switch to the\
    \ team you want to use.\n2. In the left menu, click Settings, then click the Security tab to go to the team\nsecurity\
    \ settings page.\n3. In the SSH Keys section, click Add SSH Key to open the New SSH key\nwindow.\n4. Copy your public\
    \ key into the Public Key field. It’s safe to freely share your\npublic SSH keys because you cannot recreate a private\
    \ key using a public key.\nYou can only use a public key to validate the user who holds the associated\nprivate key.\n\
    5. Enter a name in the Key Name field, which lets you identify this key in the\nControl Panel. We recommend using the\
    \ name of the machine you copied the\npublic key from.\n6. Finally, click Add SSH Key to add the key to your team.\nUsing\
    \ the API or CLI\nCLI\n1. Install doctl, the official DigitalOcean CLI.\n2. Create a personal access token and save it\
    \ for use with doctl.\n3. Use the token to grant doctl access to your DigitalOcean account.\ndoctl auth init\n4. Finally,\
    \ run\ndoctl compute ssh-key create\nBasic usage looks like this, but you can read the usage docs for more details:\n\
    doctl compute ssh-key create <key-name> [flags]\nAPI\n1. Create a personal access token and save it for use with the API.\n\
    2. Send a POST request to https://api.digitalocean.com/v2/account/keys.\n Page 28\ncURL\nUsing cURL:\ncurl -X POST \\\n\
    \ -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\" \\\n -d '{\"name\":\"My\
    \ SSH Public Key\",\"public_key\":\"ssh-rsa\nAEXAMPLEaC1yc2EAAAADAQABAAAAQQDDHr/jh2Jy4yALcK4JyWbVkPRaWmhck3IgCoeOO3z1e2dBowLh64Q\n\
    AM+Qb72pxekALga2oi4GvT+TlWNhzPH4V example\"}' \\\n \"https://api.digitalocean.com/v2/account/keys\"\nGo\nUsing Godo, the\
    \ official DigitalOcean API client for Go:\nimport (\n \"context\"\n \"os\"\n \"github.com/digitalocean/godo\"\n)\nfunc\
    \ main() {\n token := os.Getenv(\"DIGITALOCEAN_TOKEN\")\n client := godo.NewFromToken(token)\n ctx := context.TODO()\n\
    \ createRequest := &godo.KeyCreateRequest{\n Name: \"My SSH Public Key\",\n PublicKey: \"ssh-rsa\nAEXAMPLEaC1yc2EAAAADAQABAAAAQQDDHr/jh2Jy4yALcK4JyWbVkPRaWmhck3IgCoeOO3z1e2dBowLh64Q\n\
    AM+Qb72pxekALga2oi4GvT+TlWNhzPH4V example\",\n }\n transfer, _, err := client.Keys.Create(ctx, createRequest)\n}\n Page\
    \ 29\nRuby\nUsing DropletKit, the official DigitalOcean API client for Ruby:\nrequire 'droplet_kit'\ntoken = ENV['DIGITALOCEAN_TOKEN']\n\
    client = DropletKit::Client.new(access_token: token)\nssh_key = DropletKit::SSHKey.new(\n name: 'My SSH Public Key',\n\
    \ public_key: 'ssh-rsa\nAEXAMPLEaC1yc2EAAAADAQABAAAAQQDDHr/jh2Jy4yALcK4JyWbVkPRaWmhck3IgCoeOO3z1e2dBowLh64Q\nAM+Qb72pxekALga2oi4GvT+TlWNhzPH4V\
    \ example'\n)\nclient.ssh_keys.create(ssh_key)\nPython\nUsing PyDo, the official DigitalOcean API client for Python:\n\
    import os\nfrom pydo import Client\nclient = Client(token=os.environ.get(\"DIGITALOCEAN_TOKEN\"))\nreq = {\n \"public_key\"\
    : \"ssh-rsa\nAEXAMPLEaC1yc2EAAAADAQABAAAAQQDDHr/jh2Jy4yALcK4JyWbVkPRaWmhck3IgCoeOO3z1e2dBowLh64Q\nAM+Qb72pxekALga2oi4GvT+TlWNhzPH4V\
    \ example\",\n \"name\": \"My SSH Public Key\"\n}\nresp = client.ssh_keys.create(body=req)\nRemove SSH Keys from a Team\
    \ with the Control Panel\n1. Log in to the Control Panel and switch to the team you want to use.\n2. In the left menu,\
    \ click Settings, then click the Security tab to go to the\nteam security settings page. The SSH keys section lists any\
    \ keys already added\nto the team.\n3. In the (…) menu next to each key in the table, you can edit the key or delete it\n\
    entirely. Deleting an SSH key from a team only removes the ability to create new\nDroplets with that key already added.\
    \ It does not remove that SSH key from any\nDroplet’s SSH configuration.\nPlease refer to the following sources for additional\
    \ information on working with SSH\nkeys on DigitalOcean:\n1. SSH Essentials: Working with SSH Servers, Clients, and Keys\n\
    \ Page 30\n2. Understanding the SSH Encryption and Connection Process"
  checks:
  - type: manual_review
    info: 'To check if your DigitalOcean account has an SSH key associated:

      1. Log into your Control Panel.

      2. Select Settings in the bottom left of the panel.

      3. Select the Security tab in the settings menu.

      4. In the SSH Keys section, you should see a list of all the SSH keys associated

      with your DigitalOcean account. Each SSH key is typically identified by a name

      you provided when you added it. If there are SSH keys listed, it means you have

      SSH keys associated with your account.

      5. Verify the key detai'
    severity: medium
- id: '2.4'
  title: Ensure a Distribution List is used as the Team Contact Email
  scoring: manual
  profile:
  - Level 1
  description: 'The team contact email is where DigitalOcean sends operational alerts and maintenance notices. By default,
    the team contact email is the email address of the person who created the team. Everyone on a team can view the team contact
    email, but only owners can change it on the team settings page. Emails that are sent exclusively to the team contact email
    include: • Resource alerts, like deployment failures and failovers • Alert policy notifications • Emergency migration
    or reboot notices • SSL certificate renewal notices Additionally, some team emails are sent only to people with specific
    roles: • Billing emails are sent to owners and billers. • Droplet password emails are sent to whoever created the related
    Droplet. • Support ticket emails are sent to everyone who participated in the support ticket. Using a distribution list
    email instead of an individual’s as the team contact prevents a single point of failure for account access if that person
    becomes unavailable.'
  rationale: 'Using a distribution list as the email contact email is important for several reasons, including: • Ensures
    multiple people receive communications: A distribution list sends emails to a defined group of recipients, so all relevant
    team members get important notifications simultaneously without relying on a single individual. • Streamlines communication:
    Distribution lists simplify sending emails to groups without typing each address individually, saving time and reducing
    errors. • Reduces risk: If the contact email is tied to one person who leaves or is unavailable, critical messages could
    be missed. A distribution list avoids this by having multiple recipients who can respond or escalate as needed.'
  impact: There are no adverse consequences with using a distribution list as the team contact email. Page 33
  references:
  - 1. https://cloud.digitalocean.com/account/team
  - 2. https://cloud.digitalocean.com/
  page_start: 33
  audit_raw: '1. Log into the Control Panel.

    2. Select Settings in the lower left hand corner.

    3. Find Team Contact Email in the Team tab.

    4. Confirm it is the distribution list email address. If not, follow the remediation

    steps.'
  remediation: '1. Create a distribution email list according to your email service provider’s

    instructions.

    2. Log in to the Control Panel.

    3. Select Settings.

    4. Find Team Contact Email in the Team tab and select Edit.

    5. Change the email address to the distribution list email address.

    6. Select Update.'
  checks:
  - type: manual_review
    info: '1. Log into the Control Panel.

      2. Select Settings in the lower left hand corner.

      3. Find Team Contact Email in the Team tab.

      4. Confirm it is the distribution list email address. If not, follow the remediation

      steps.'
    severity: medium
- id: '3.1'
  title: Ensure Legacy Tokens are Replaced with Scoped Tokens
  scoring: manual
  profile:
  - Level 1
  description: A token is a secure string used to authenticate and authorize access to an API or service (e.g. DigitalOcean’s
    API). When you include a token in your API requests, it proves your identity and grants you permissions to perform certain
    actions on your resources. Legacy tokens were the original personal access tokens that granted broad access (either full
    read/write or read-only) to all team resources. Custom scoped tokens allow more fine-grained permission control when compared
    to legacy tokens. You can assign specific scopes (permissions) like creating droplets, reading databases, or updating
    firewalls to custom scoped tokens, which allows you to grant only the exact access needed. Migrating to custom scoped
    tokens is essential for maintaining the security of your DigitalOcean resources.
  rationale: 'Replacing legacy tokens with custom scoped tokens is important for many reasons, including: Granular Control:
    Scoped tokens provide fine-grained control over API access. You can tailor the token''s permissions to the specific tasks
    it needs to perform. Token Management: Scoped tokens are easier to manage and revoke if they are compromised or no longer
    needed. Improved Security: By limiting token permissions to only what is necessary, scoped tokens reduce the risk and
    impact of token compromise. If a scoped token is compromised, the attacker’s capabilities are confined to the token’s
    limited scope, unlike legacy tokens which could allow full access.'
  impact: Applications or integrations built assuming legacy tokens’ broad access might require significant updates to work
    with scoped tokens, causing temporary disruptions or additional development effort during migration. Transitioning from
    legacy to scoped tokens requires updating all systems, scripts, and integrations that use the legacy tokens. Page 36
  references:
  - 1. https://cloud.digitalocean.com/login
  - 2. https://docs.digitalocean.com/reference/api/create-personal-accesstoken/#creating-a-token
  page_start: 36
  audit_raw: '1. Log in to your Control Panel.

    2. Navigate to API in the lower left hand corner

    3. Locate the Tokens tab.

    4. Review your tokens. If a token has no scopes or only broad read/write access

    and was created before March 31, 2023, it is a legacy token.

    5. Tokens with detailed scopes (e.g. droplet:create, firewall:update) are scoped

    tokens.'
  remediation: 'This process requires knowledge of any associated scripts, services, or applications

    that use the legacy token.

    1. Log in to your Control Panel.

    2. Navigate to API in the lower left hand corner.

    3. Locate the Tokens tab.

    4. Review your tokens. If a token has no scopes or only broad read/write access

    and was created before March 31, 2023, it is a legacy token.

    5. Select Generate New Token and follow the guidance in our How to Create a

    Personal Access Token documentation.

    6. Apply the new scoped token to the scripts and applications to which the legacy

    token was applied.

    7. Once the scoped token has been applied, delete the legacy token.'
  checks:
  - type: manual_review
    info: '1. Log in to your Control Panel.

      2. Navigate to API in the lower left hand corner

      3. Locate the Tokens tab.

      4. Review your tokens. If a token has no scopes or only broad read/write access

      and was created before March 31, 2023, it is a legacy token.

      5. Tokens with detailed scopes (e.g. droplet:create, firewall:update) are scoped

      tokens.'
    severity: medium
- id: '3.2'
  title: Ensure Access Tokens Do Not Have Over-Provisioned Scopes
  scoring: manual
  profile:
  - Level 1
  description: Over-provisioned scoped tokens are personal access tokens that have been granted permissions in excess of what
    is needed for their intended use. Over-provisioned scoped tokens not only allow broader access than is necessary; but,
    broadens the organization’s risk footprint unnecessarily.
  rationale: 'Checking for over-provisioned scoped tokens is important for many reasons, including: • Reduced Attack Surface:
    Over-provisioned tokens grant more permissions than needed, creating a larger attack surface. If a token is compromised,
    the attacker can exploit these excessive permissions to cause greater harm. • Better Management and Auditability: Scoped
    tokens with only the required permissions are easier to manage, track, and audit, reducing the risk of misuse or accidental
    changes. • Proactive Security: Regularly reviewing token permissions allows you to identify and correct over-provisioned
    tokens, strengthening your security posture.'
  impact: There are no adverse consequences to checking for over-provisioned scoped tokens.
  references:
  - 1. https://cloud.digitalocean.com/login
  - 2. NIST SP 800-53:rev5:AC-6 (7)
  page_start: 38
  audit_raw: "This process requires knowledge of internal access controls.\n1. Log in to your Control Panel.\n2. Navigate\
    \ to API then Tokens.\n3. Select Scopes next to the token to be reviewed.\n4. Review the scope of your tokens in accordance\
    \ with your internal access\ncontrols.\n Page 38"
  remediation: 'This process requires knowledge of internal access controls.

    1. Log in to your Control Panel.

    2. Navigate to API then Tokens.

    3. Review the scope of your tokens in accordance with your internal access

    controls.

    4. If a token’s scope is not in accordance with your internal access controls, select

    Generate New Token.

    5. Create the token in accordance with your internal access controls.

    6. Apply the newly generated token to scripts and/or applications associated with

    the out of scope token.

    7. Delete the out of scope token.'
  checks:
  - type: manual_review
    info: "This process requires knowledge of internal access controls.\n1. Log in to your Control Panel.\n2. Navigate to\
      \ API then Tokens.\n3. Select Scopes next to the token to be reviewed.\n4. Review the scope of your tokens in accordance\
      \ with your internal access\ncontrols.\n Page 38"
    severity: medium
- id: '3.3'
  title: Ensure OAuth and Authorized Third-Party Applications are Appropriate
  scoring: scored
  profile:
  - Level 1
  description: OAuth 2 is an open standard for authorization that enables third-party applications to obtain limited access
    to DigitalOcean users accounts without requiring the user to share their credentials with the third-party application.
    Reviewing OAuth applications for appropriateness involves evaluating whether an application’s use of OAuth aligns with
    security policies. This process aims to ensure that only trustworthy applications are granted access to sensitive user
    or organizational data.
  rationale: 'Reviewing OAuth applications for appropriateness is important for many reasons, including: • Preventing Unauthorized
    Access: OAuth tokens can grant third-party applications access to sensitive data, including user accounts and customer
    data. If an untrusted or malicious app is authorized, the application could access, misuse, or leak sensitive information.
    • Limiting Scope and Permissions: Reviewing third-party applications’ permissions ensures that each application only receives
    the permissions necessary to perform their function. Overly broad permissions increase the organization’s risk footprint
    as, if compromised, the third-party application could have unauthorized access to sensitive information.'
  impact: There are no adverse consequences to reviewing OAuth applications for appropriateness.
  references:
  - 1. https://cloud.digitalocean.com/login
