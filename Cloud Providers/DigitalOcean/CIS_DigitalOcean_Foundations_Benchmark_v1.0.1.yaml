- id: '4.1'
  title: Ensure Role-Based Access Controls are Implemented
  scoring: manual
  profile:
  - Level 1
  description: 'Role-Based Access Control (RBAC) is a method of regulating access to computer or network resources based on
    the roles of individual users within an organization. It involves assigning permissions to specific roles, rather than
    directly to individual users, and then assigning individual users to those specific roles. In doing so, the organization
    creates a layer of abstraction between users and permissions, making it easier to manage access rights across the organization.
    The simplification of management access rights is achieved by grouping similar users together and defining what actions
    they can perform on specific resources. RBAC allows organizations to enforce security policies more efficiently, reduce
    administrative work, and ensure users have appropriate access to perform their job functions without excessive privileges.
    DigitalOcean supports a customer’s ability to enable RBAC by way of six predefined roles innate to all teams. In assigning
    these roles, customers are able to issue specific permissions at scale in a manner that upholds the principle of least
    privilege. The following list outlines the predefined roles as well as their affiliated permissions: • Owner: Permits
    users full access to shared resources, billing information, and team settings. • Member: Permits users full access to
    shared resources; but, does not allow them to change team settings. This user has no access to billing information. •
    Biller: Permits the user full access to billing information; but, does not allow them to view team settings or shared
    resources. • Modifier: Permits users to update; but, does not allow them to delete resources. This role is ideal for teams
    who wish to protect sensitive resources from deletion while still allowing members to manage them. • Billing viewer: Permits
    read-only access to billing information only, giving users insight into billing details for cost analysis, transparency,
    and governance without exposing sensitive operational controls. • Resource viewer: Permits read-only access to resources,
    ideal for audit or compliance purposes. Users with this role will not have permission to create, update, or delete resources.
    Page 43'
  rationale: 'Implementing RBAC is important for many reasons, including: • Better security: RBAC reduces the risk of unauthorized
    access to sensitive data and systems. By assigning permissions based on roles rather than individuals, it ensures that
    users only have access to the resources necessary for their jobs. • Simplified administration: Managing user access is
    more streamlined with RBAC. Instead of adjusting permissions for each user individually, administrators can assign or
    modify roles, saving time and reducing the likelihood of errors. • Improved compliance: RBAC helps organizations meet
    regulatory requirements by providing clear audit trails and access controls, which aids in compliance reporting.'
  impact: Implementing RBAC can have several negative effects and challenges, especially as organizations grow and their access
    control needs become more complex. If permissions are too restrictive, users may be unable to perform necessary tasks
    efficiently, leading to unauthorized workarounds or requests for elevated access that can cause delays. Without routine
    RBAC access reviews, users may accumulate permissions which exceed their needs. While RBAC aims to prevent this, the circumstance
    is difficult to avoid without automation.
