    \ the invitation to join the team.\nChange Team Members’ Roles\nIf a team member is assigned a role no longer congruent\
    \ with their needs, the role\nshould be changed through the following steps:\n1. From the Team Settings page, locate the\
    \ team members’ name in the\nMembership table and select the (...) at the far right.\n2. Select Change Role.\nSelect the\
    \ role which matches the team members’ needs.\nWhen an Owner changes someone else’s role to Owner, the original owner\
    \ receives an\nemail with a link to confirm the change. After the original Owner confirms the change,\nthe invited Owner\
