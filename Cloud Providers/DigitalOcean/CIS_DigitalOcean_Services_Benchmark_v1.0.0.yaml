- id: '2.3'
  title: Ensure the Droplet is Connected to a Firewall
  scoring: scored
  profile:
  - Level 1
  description: 'A firewall is a security system that monitors and controls network traffic based on a set of security rules,
    deciding whether to allow incoming and outgoing traffic to pass through to the systems behind the firewall. Firewalls
    usually sit between a trusted network and an untrusted network; oftentimes the untrusted network is the Internet. DigitalOcean
    Droplets, by default, sit on the public internet making firewalls especially critical (note: this does not apply to VPC
    droplets). DigitalOcean offers a firewall product that you can use and we will discuss the usage of that product below.
    However, you can also use Linux provided firewall tooling like iptables, ufw, etc. Host-based firewalls are not covered
    here.'
  rationale: 'A few benefits of connecting a firewall to your Droplet are: • Isolation Between Droplets: Firewalls can enforce
    security policies that isolate Droplets from each other. This is crucial for preventing a compromised Droplet from affecting
    others or accessing data it shouldn’t. • External Threat Protection: Firewalls can be configured to monitor and filter
    incoming and outgoing traffic to and from Droplets, protecting them from external threats.'
  impact: If firewall rules are too strict or incorrectly configured, legitimate traffic such as client requests, administrative
    access, or inter-service communication might be blocked, leading to service disruptions or degraded performance.
  references: []
  page_start: 41
  audit_raw: 'Using the Control Panel to Verify Your Droplet has a Firewall

    1. Log in to your DigitalOcean account at https://cloud.digitalocean.com/login.

    2. In the DigitalOcean Control Panel, click on Droplets in the sidebar to access

    your Droplets.

    3. Find the Droplet you want to check for a firewall and click on its name to go to the

    Droplet’s detail page.

    4. In the Droplet detail page, click on the Networking tab.

    5. Scroll down to the Firewalls section. If a firewall is configured for this Droplet, it

    will be listed here, along with its name and any associated rules.

    Using the Command Line

    1. Connect to your Droplet using SSH. You can do this using the following

    command, replacing your-droplet-ip with your Droplet’s IP address and

    your-ssh-key with your SSH private key file:

    ssh -i /path/to/your-ssh-key root@your-droplet-ip

    2. Once logged in, you can run the following command:

    doctl compute firewall list

    If a firewall is enabled and has rules, you will see output similar to the following:

    | Status:Active | | |

    |--------------- |-------- |--------------- |

    | To | Action | From |

    | OpenSSH | Allow | Anywhere |

    | 80/TCP | Allow | Anywhere |

    If no firewall is configured, the output will indicate that the firewall is inactive or not

    installed.'
  remediation: "Add Droplets from a Firewall Using the Control Panel\n1. Log in to the control panel, choose Networking from\
    \ the top menu, then\nFirewalls.\n2. Select the firewall you want to check or modify, then navigate to its Droplets\n\
    tab. A firewall’s Droplets tab lists all of the Droplets protected by the firewall.\nDroplets added individually are shown\
    \ on their own line, and Droplets added with\na tag are shown below the tag.\n3. To add another Droplet or tag to the\
    \ firewall, use the Add Droplets button.\nUsing the CLI\nThe commands to add Droplets from a firewall require the Droplet’s\
    \ ID. To retrieve a list\nof Droplets and their IDs, use the command:\ndoctl compute droplet list\n1. Install doctl, the\
    \ official DigitalOcean CLI.\n2. Create a personal access token and save it for use with doctl.\n3. Use the token to grant\
    \ doctl access to your DigitalOcean account.\ndoctl auth init\n4. Finally, run\ndoctl compute firewall add-droplets\n\
    Basic usage looks like this, but you can read the usage docs for more details:\ndoctl compute firewall add-droplets <firewall-id>\
    \ [flags]\nUsing the API\nThe API calls to add and remove Droplets from a firewall require the Droplet’s ID. To\nretrieve\
    \ a list of Droplets and their IDs, use the /v2/droplets endpoint.\n1. Create a personal access token and save it for\
    \ use with the API.\n2. Send a POST request to\nhttps://api.digitalocean.com/v2/firewalls/{firewall_id}/droplets.\nUsing\
    \ cURL\ncurl -X POST \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\"\
    \ \\\n -d '{\"droplet_ids\":[49696269]}' \\\n \"https://api.digitalocean.com/v2/firewalls/bb4b2611-3d72-467b-8602280330ecd65c/droplets\"\
    \nGo\nUsing Godo, the official DigitalOcean API client for Go:\nimport (\n \"context\"\n \"os\"\n \"github.com/digitalocean/godo\"\
    \n)\nfunc main() {\n token := os.Getenv(\"DIGITALOCEAN_TOKEN\")\n client := godo.NewFromToken(token)\n ctx := context.TODO()\n\
    \ _, err := client.Firewalls.AddDroplets(ctx, 'bb4b2611-3d72-467b-8602280330ecd65c', 49696269)\n}\nRuby\nUsing DropletKit,\
    \ the official DigitalOcean API client for Ruby:\nrequire 'droplet_kit'\ntoken = ENV['DIGITALOCEAN_TOKEN']\nclient = DropletKit::Client.new(access_token:\
    \ token)\nclient.firewalls.add_droplets([49696269], id: 'bb4b2611-3d72-467b-8602280330ecd65c')\nPython\nUsing PyDo, the\
    \ official DigitalOcean API client for Python:\nimport os\nfrom pydo import Client\nclient = Client(token=os.environ.get(\"\
    DIGITALOCEAN_TOKEN\"))\nreq = {\n \"droplet_ids\": [\n 49696269\n ]\n}\nresp = client.firewalls.assign_droplets(firewall_id=\"\
    39fa4gz\", body=req)"
