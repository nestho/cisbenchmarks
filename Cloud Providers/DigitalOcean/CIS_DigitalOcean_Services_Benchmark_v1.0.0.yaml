controls:
- id: '2.1'
  title: Ensure Backups are Enabled
  scoring: manual
  profile:
  - Level 2
  description: Droplet backup is a service provided by DigitalOcean to help users protect their data by creating automatic,
    system-level backups of their Droplets. These backups enable users to have access to recent copies of their data, which
    can be crucial for disaster recovery and minimizing downtime in case of accidental deletion, system failures, or other
    data loss scenarios.
  rationale: 'A few benefits of enabling backups for your Droplet are: • Data Loss Prevention: Backups act as a safety net
    in case of data loss, accidental file deletion, or corruption. With a backup, you can restore your Droplet to a previous
    state. • Disaster Recovery: In the event of a misconfiguration of your droplet, a hardware, software, or other significant
    error which renders your Droplet unusable, backups provide a method to minimize downtime by quickly recovering and rebuilding
    your system. • Easy Migration: Backups make it easier to migrate your Droplet to a different data center or region within
    DigitalOcean’s ecosystem. With a backup, you can spin up a new Droplet and load the backup into the new resource, thus
    replicating your server in a new location. • Security: Regular backups can help mitigate the impact of security incidents,
    stemming from malware, system or app compromise, etc. Should your Droplet be compromised, you can restore the resource
    from a clean backup created prior to the infection rather than trying to clean a compromised system.'
  impact: In the event that you do not enable backups on your Droplet, the backup process is not properly configured or encounters
    issues during execution, you run the risk of having incomplete or corrupt backups, which can complicate data restoration.
  references:
  - 1. https://docs.digitalocean.com/products/custom-images/how-to/create-droplets/
  - 2. https://workbench.cisecurity.org/benchmarks/11511
  page_start: 19
  audit_raw: 'Using the DigitalOcean Control Panel to View Existing Backups

    1. Sign in to your DigitalOcean account.

    2. Select Droplets in the side panel.

    3. Select a Droplet from the list.

    4. Click Backups in the side panel to view all backups.

    Using an API to List Backups for a Droplet

    1. To retrieve any backups associated with a Droplet, send a GET request to

    /v2/droplets/$DROPLET_ID/backups

    2. You will get back a JSON object that has a backups key. This will be set to an

    array of backup objects, each of which contain the standard Droplet backup

    attributes.

    Please review List Backups for a Droplet of the DigitalOcean API reference for more

    details.'
  remediation: "Enable Backups during Droplet Creation\nUsing the Control Panel\n1. Log in to the DigitalOcean Control Panel,\
    \ open the Create menu and select\nDroplets.\n2. Fill out the fields following the normal Droplet creation process. n\
    \ the section,\ncheck Enable automated backups.\n3. Here, you can select Weekly Backups or Daily Backups.\n4. The backup\
    \ window is a 4-hour window of time during which the Droplet\nautomatically initiates a new backup. In the Backup Window\
    \ section, use the\ndrop-down menus to customize your Droplet’s backup window by choosing a\ntime of day and, for weekly\
    \ backups, a day of the week.\nUsing Automation\nYou can enable backups during Droplet creation by setting the backups\
    \ field to true\nwhen using the Droplet creation command or endpoint.\nUsing the DigitalOcean CLI\n1. Install doctl, the\
    \ official DigitalOcean CLI.\n2. Create a personal access token and save it for use with doctl.\n3. Use the token to grant\
    \ doctl access to your DigitalOcean account.\ndoctl auth init\n4. Finally, run\ndoctl compute droplet create\nBasic usage\
    \ looks like this, but you can read the usage docs for more details:\ndoctl compute droplet create <droplet-name> --enable-backups\
    \ true\nUsing the DigitalOcean API\n1. Create a personal access token and save it for use with the API.\n2. Send a POST\
    \ request to https://api.digitalocean.com/v2/droplets.\nUsing cURL\ncurl -X POST \\\n -H \"Content-Type: application/json\"\
    \ \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\" \\\n -d '{\"name\":\"example.com\",\"region\":\"nyc3\",\"size\"\
    :\"s-1vcpu1gb\",\"image\":\"ubuntu-20-04x64\",\"ssh_keys\":[289794,\"3b:16:e4:bf:8b:00:8b:b8:59:8c:a9:d3:f0:19:fa:45\"\
    ],\"b\nackups\":true,\"ipv6\":true,\"monitoring\":true,\"tags\":[\"env:prod\",\"web\"],\"user_da\nta\":\"#cloud-config\\\
    nruncmd:\\n - touch /test.txt\\n\",\"vpc_uuid\":\"760e09efdc84-11e8-981e-3cfdfeaae000\"}' \\\n \"https://api.digitalocean.com/v2/droplets\"\
    \nUsing Go\nUsing Godo, the official DigialOcean API client for Go:\nimport (\n \"context\"\n \"os\"\n \"github.com/digitalocean/godo\"\
    \n)\nfunc main() {\n token := os.Getenv(\"DIGITALOCEAN_TOKEN\")\n client := godo.NewFromToken(token)\n ctx := context.TODO()\n\
    \ createRequest := &godo.DropletCreateRequest{\n Name: \"example.com\",\n Region: \"nyc3\",\n Size: \"s-1vcpu-1gb\",\n\
    \ Image: godo.DropletCreateImage{\n Slug: \"ubuntu-20-04-x64\",\n },\n SSHKeys: []godo.DropletCreateSSHKey{\n godo.DropletCreateSSHKey{ID:\
    \ 289794},\n godo.DropletCreateSSHKey{Fingerprint:\n\"3b:16:e4:bf:8b:00:8b:b8:59:8c:a9:d3:f0:19:fa:45\"}\n },\n Backups:\
    \ true,\n IPv6: true,\n Monitoring: true,\n Tags: []string{\"env:prod\",\"web\"},\n UserData: \"#cloud-config\\nruncmd:\\\
    n - touch /test.txt\\n\",\n VPCUUID: \"760e09ef-dc84-11e8-981e-3cfdfeaae000\",\n }\nRuby\nUsing DropletKit, the official\
    \ DigitalOcean API client for Ruby:\nrequire 'droplet_kit'\ntoken = ENV['DIGITALOCEAN_TOKEN']\nclient = DropletKit::Client.new(access_token:\
    \ token)\ndroplet = DropletKit::Droplet.new(\n name: 'example.com',\n region: 'nyc3',\n size: 's-1vcpu-1gb',\n image:\
    \ 'ubuntu-20-04-x64',\n ssh_keys: [289794,\"3b:16:e4:bf:8b:00:8b:b8:59:8c:a9:d3:f0:19:fa:45\"],\n backups: true,\n ipv6:\
    \ true,\n monitoring: true,\n tags: [\"env:prod\",\"web\"],\n user_data: \"#cloud-config\\nruncmd:\\n - touch /test.txt\\\
    n\",\n vpc_uuid: \"760e09ef-dc84-11e8-981e-3cfdfeaae000\",\n)\nclient.droplets.create(droplet)\nPython\nUsing PyDo, the\
    \ official DigitalOcean API client for Python:\nimport os\nfrom pydo import Client\nclient = Client(token=os.environ.get(\"\
    DIGITALOCEAN_TOKEN\"))\nreq = {\n \"name\": \"example.com\",\n \"region\": \"nyc3\",\n \"size\": \"s-1vcpu-1gb\",\n \"\
    image\": \"ubuntu-20-04-x64\",\n \"ssh_keys\": [\n 289794,\n \"3b:16:e4:bf:8b:00:8b:b8:59:8c:a9:d3:f0:19:fa:45\"\n ],\n\
    \ \"backups\": True,\n \"ipv6\": True,\n \"monitoring\": True,\n \"tags\": [\n \"env:prod\",\n \"web\"\n ],\n \"user_data\"\
    : \"#cloud-config\\nruncmd:\\n - touch /test.txt\\n\",\n \"vpc_uuid\": \"760e09ef-dc84-11e8-981e-3cfdfeaae000\"\n}\nresp\
    \ = client.droplets.create(body=req)\nEnable Backups on an Existing Droplet\nUsing the Control Panel\n1. Log in to the\
    \ DigitalOcean Control Panel, select Droplets and click the Droplet\nyou want to enable backups on. Then, click Backups\
    \ in the left menu of the\nDroplet page.\n2. If the Droplet already has backups enabled, click the Edit Settings button.\
    \ If the\nDroplet does not already have backups enabled, click the Setup Automated\nBackups button.\n3. Here, you can\
    \ select Weekly Backups or Daily Backups.\n4. The backup window is a 4-hour window of time during which the Droplet\n\
    automatically initiates a new backup. In the Backup Window section, use the\ndrop-down menus to customize your Droplet’s\
    \ backup window by choosing a\ntime of day and, for weekly backups, a day of the week.\n5. To confirm your changes, click\
    \ Enable Backups or Save Backup Settings.\nUsing Automation\nYou can enable Droplet backups using the following doctl\
    \ command, or by sending a\nrequest to the Droplet action endpoint and setting the enable_backups field to true.\nUsing\
    \ the DigitalOcean CLI\n1. Install doctl, the official DigitalOcean CLI.\n2. Create a personal access token and save it\
    \ for use with doctl.\n3. Use the token to grant doctl access to your DigitalOcean account.\ndoctl auth init\n4. Finally,\
    \ run\ndoctl compute droplet-action enable-backups\nBasic usage looks like this, but you can read the usage docs for more\
    \ details:\ndoctl compute droplet-action enable-backups <droplet-id> [flags]\nThe following example enables backups on\
    \ a Droplet with the ID 386734086 with a\nbackup policy flag:\ndoctl compute droplet-action enable-backups 386734086 --backup-policy-plan\n\
    weekly --backup-policy-weekday SUN --backup-policy-hour 4\nUsing the DigitalOcean API\n1. Create a personal access token\
    \ and save it for use with the API.\n2. Send a POST request to\nhttps://api.digitalocean.com/v2/droplets/{droplet_id}/actions.\n\
    Using cURL\n# Enable Backups\ncurl -X POST \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer\
    \ $DIGITALOCEAN_TOKEN\" \\\n -d '{\"type\":\"enable_backups\"}' \\\n \"https://api.digitalocean.com/v2/droplets/3164450/actions\"\
    \n# Disable Backups\ncurl -X POST \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\"\
    \ \\\n -d '{\"type\":\"disable_backups\"}' \\\n \"https://api.digitalocean.com/v2/droplets/3164450/actions\"\n# Reboot\
    \ a Droplet\ncurl -X POST \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\"\
    \ \\\n -d '{\"type\":\"reboot\"}' \\\n \"https://api.digitalocean.com/v2/droplets/3164450/actions\"\n# Power cycle a Droplet\n\
    curl -X POST \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\" \\\n -d\
    \ '{\"type\":\"power_cycle\"}' \\\n \"https://api.digitalocean.com/v2/droplets/3164450/actions\"\n# Shutdown and Droplet\n\
    curl -X POST \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\" \\\n -d\
    \ '{\"type\":\"shutdown\"}' \\\n \"https://api.digitalocean.com/v2/droplets/3067649/actions\"\n# Power off a Droplet\n\
    curl -X POST \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\" \\\n -d\
    \ '{\"type\":\"power_off\"}' \\\n \"https://api.digitalocean.com/v2/droplets/3164450/actions\"\n# Power on a Droplet\n\
    curl -X POST \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\" \\\n -d\
    \ '{\"type\":\"power_on\"}' \\\n \"https://api.digitalocean.com/v2/droplets/3164450/actions\"\n# Restore a Droplet\ncurl\
    \ -X POST \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\" \\\n -d '{\"\
    type\":\"restore\", \"image\": 12389723 }' \\\n \"https://api.digitalocean.com/v2/droplets/3067649/actions\"\n# Password\
    \ Reset a Droplet\ncurl -X POST \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\"\
    \ \\\n -d '{\"type\":\"password_reset\"}' \\\n \"https://api.digitalocean.com/v2/droplets/3164450/actions\"\n# Resize\
    \ a Droplet\ncurl -X POST \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\"\
    \ \\\n -d '{\"type\":\"resize\",\"size\":\"1gb\"}' \\\n \"https://api.digitalocean.com/v2/droplets/3164450/actions\"\n\
    # Rebuild a Droplet\ncurl -X POST \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\"\
    \ \\\n -d '{\"type\":\"rebuild\",\"image\":\"ubuntu-16-04-x64\"}' \\\n \"https://api.digitalocean.com/v2/droplets/3164450/actions\"\
    \n# Rename a Droplet\ncurl -X POST \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\"\
    \ \\\n -d '{\"type\":\"rename\",\"name\":\"nifty-new-name\"}' \\\n \"https://api.digitalocean.com/v2/droplets/3164450/actions\"\
    \n# Change the Kernel\ncurl -X POST \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\"\
    \ \\\n -d '{\"type\":\"change_kernel\",\"kernel\":991}' \\\n \"https://api.digitalocean.com/v2/droplets/3164450/actions\"\
    \n# Enable IPv6\ncurl -X POST \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\"\
    \ \\\n -d '{\"type\":\"enable_ipv6\"}' \\\n \"https://api.digitalocean.com/v2/droplets/3164450/actions\"\n# Enable Private\
    \ Networking\ncurl -X POST \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\"\
    \ \\\n -d '{\"type\":\"enable_private_networking\"}' \\\n \"https://api.digitalocean.com/v2/droplets/3164450/actions\"\
    \n# Snapshot a Droplet\ncurl -X POST \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\"\
    \ \\\n -d '{\"type\":\"snapshot\",\"name\":\"Nifty New Snapshot\"}' \\\n \"https://api.digitalocean.com/v2/droplets/3164450/actions\"\
    \n# Acting on Tagged Droplets\ncurl -X POST \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer\
    \ $DIGITALOCEAN_TOKEN\" \\\n -d '{\"type\":\"enable_backups\"}' \\\n \"https://api.digitalocean.com/v2/droplets/actions?tag_name=awesome\"\
    \n# Retrieve a Droplet Action\ncurl -X GET \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer\
    \ $DIGITALOCEAN_TOKEN\" \\\n \"https://api.digitalocean.com/v2/droplets/3164444/actions/36804807\"\nGo\nUsing Godo, the\
    \ official DigitalOcean API client for Go:\nimport (\n \"context\"\n \"os\"\n \"github.com/digitalocean/godo\"\n)\nfunc\
    \ main() {\n token := os.Getenv(\"DIGITALOCEAN_TOKEN\")\n client := godo.NewFromToken(token)\n ctx := context.TODO()\n\
    // Enable Backups\n action, _, err := client.DropletActions.EnableBackups(ctx, 3164450)\n// Disable Backups\n// action,\
