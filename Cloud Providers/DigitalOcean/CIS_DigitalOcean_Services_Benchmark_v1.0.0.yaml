- id: '2.4'
  title: Ensure Operating System on Droplet is Upgraded
  scoring: manual
  profile:
  - Level 2
  description: Upgrading an operating system is crucial for maintaining an efficient, secure, and compatible computing environment.
    The upgrades may provide enhanced security, improved performance, and access to new features. Regularly upgrading ensures
    that users can take full advantage of technological advancements while keeping their systems secure against evolving threats.
  rationale: 'A few benefits of upgrading/patching the operating system on a Droplet are: • Security: Newer versions of operating
    systems come with updated security patches which address vulnerabilities discovered in older versions. • Extended Support:
    Older operating systems eventually reach their end-of-life, after which they no longer receive updates or support from
    the developers. Upgrading ensures continued support, which is crucial for maintaining a secure and stable server environment.
    • Improved Performance via Enhanced Resource Utilization: Newer operating systems often have better mechanisms for resource
    allocation and management, which can lead to more efficient use of the Droplet’s resources like CPU, RAM, and storage.
    Upgraded operating systems often come with enhancements in performance, including better memory management and faster
    processing. This can lead to more efficient running of applications and services hosted on the Droplet.'
  impact: Upgrades to any operating system carry an inherent risk of failure, data loss, or broken software configuration.
    Comprehensive backups and extensive testing are strongly advised.
  references:
  - 1. https://endoflife.date/
  page_start: 45
  audit_raw: 'DigitalOcean supports a fixed set of operating systems: Ubuntu, AlmaLinux, Fedora,

    Debian, CentOS and Rocky Linux). The End of Life.Date project gives a good idea

    which versions of what operating system are going to expire.'
  remediation: 'Please note that the specific commands may vary depending on the Linux distribution

    you are using. The following instructions are for a typical Ubuntu-based system (such as

    Ubuntu, Debian, or a similar distribution).

    1. SSH into your Droplet:

    Open your terminal or SSH client and connect to your Droplet using its IP

    address or hostname. Replace with your Droplet''s actual IP address:

    ssh username@your-droplet-ip

    If you are using a non-root user with sudo privileges, you can log in with that user and

    use sudo for administrative commands.

    2. Check OS Version:

    • Debian/Ubuntu OS:

    lsb_release -a

    • Fedora/CentOS/RedHat

    cat /etc/os-release

    cat /etc/redhat-release

    • Other Linux Distributions

    uname -a'
