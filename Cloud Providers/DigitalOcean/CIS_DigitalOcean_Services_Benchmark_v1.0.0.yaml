- id: '2.2'
  title: Ensure a Firewall is Created
  scoring: scored
  profile:
  - Level 2
  description: 'A firewall is a security system that monitors and controls network traffic based on a set of security rules,
    deciding whether to allow incoming and outgoing traffic to pass through to the systems behind the firewall. Firewalls
    usually sit between a trusted network and an untrusted network; oftentimes the untrusted network is the Internet. DigitalOcean
    Droplets, by default, sit on the public internet making firewalls especially critical (note: this does not apply to VPC
    droplets). DigitalOcean offers a firewall product that you can use and we will discuss the usage of that product below.
    However, you can also use Linux provided firewall tooling like iptables, ufw, etc. Host-based firewalls are not covered
    here.'
  rationale: 'A few benefits of creating a firewall for your Droplet are: • Security: Firewalls act as a bidirectional barrier
    between your server, a trusted network, and untrusted networks, such as the Internet. Firewalls filter incoming and outgoing
    network traffic based on a set of predefined rules, allowing only authorized connections to reach your Droplet. • Access
    Control: Firewalls provide granular control over which services and ports are accessible from the Internet, therein reducing
    your server’s attack surface. • Protection Against Common Attacks: Firewalls can help mitigate common network-based attacks,
    such as Distributed Denial of Service (DDoS) attacks, port scanning, and brute force attacks. By blocking traffic, you
    can reduce the impact of these attacks on your server’s performance and availability. • Compliance: Many security regulations
    and compliance standards require the use of firewalls as a basic security measure.'
  impact: If firewall rules are too strict or incorrectly configured, legitimate traffic such as client requests, administrative
    access, or inter-service communication might be blocked, leading to service disruptions or degraded performance.
  references:
  - 1. https://cloud.digitalocean.com/login
  - 2. https://docs.digitalocean.com/products/networking/firewalls/how-to/create/
  page_start: 33
  audit_raw: "Using the Control Panel\n1. Log in to your DigitalOcean account at https://cloud.digitalocean.com/login.\n2.\
    \ In the DigitalOcean Control Panel, click on Droplets in the left sidebar to access\nyour Droplets.\n3. Find the Droplet\
    \ you want to check for a firewall and click on its name to go to the\nDroplet's detail page.\n4. In the Droplet detail\
    \ page, click on the Networking tab.\n5. Scroll down to the Firewalls section. If a firewall is configured for this Droplet,\
    \ it\nwill be listed here, along with its name and any associated rules.\nUsing the Command Line\n1. Connect to your Droplet\
    \ using SSH. You can do this using the following\ncommand, replacing your-droplet-ip with your Droplet's IP address and\n\
    your-ssh-key with your SSH private key file:\nssh -i /path/to/your-ssh-key root@your-droplet-ip\n2. Once logged in, you\
    \ can check if a firewall is configured. Run the following\ncommands:\ndoctl compute firewall list\ndoctl compute firewall\
    \ list-by-droplet\nIf a firewall is enabled and has rules, you will see output similar to the following:\n Status: active\n\
    \ To Action From\n -- ------ ----\n OpenSSH ALLOW Anywhere\n 80/tcp ALLOW Anywhere\nIf no firewall is configured, the\
    \ output will indicate that the firewall is inactive or not\ninstalled."
  remediation: "Create a Firewall Using the Control Panel\n1. Log in to the Control Panel.\n2. Open the Create menu in the\
    \ upper-right and choose Cloud Firewalls.\n3. On the creation form, choose a name for your firewall in the Name field\
    \ and then\ndefine at least one rule.\nWhen you first create a cloud firewall, there are four inbound and outbound rules\n\
    defined by default that allow some fundamental traffic. You can keep, modify, or delete\nthese rules, and create new ones.\n\
    • Default Inbound Rule: SSH\nBecause the compromise of a server typically begins over an inbound\nconnection, the default\
    \ inbound connections remain entirely restricted with one\nexception. The suggested rule allows SSH connections on port\
    \ 22 from\nanywhere so that users can to administer the server from a terminal.\n• Default Outbound Rules: Permit All\
    \ Traffic\nMany fundamental services rely on outbound communication. Utilities like ping\nrequire outbound ICMP. DNS lookups,\
    \ VoIP and NTP all rely on outbound UDP.\nTasks like data synchronization, package list updates, web requests and email\n\
    require outbound TCP connections.\nBecause of this, the suggested outbound rules permit all traffic to any destination\
    \ on\nany port. These defaults make it easier to set up a new server without introducing\nrestrictions that could block\
    \ expected functionality.\n4. Apply to Droplets\nAfter configuring the firewall’s rules, apply the firewall to the Droplets\
    \ you want to\nsecure using the Apply to Droplets field. You can also leave this field blank\nand assign Droplets later.\n\
    In the Apply to Droplets field, type the name of a Droplet or resource tag into the\nfield. A drop-down populates with\
    \ a applicable resources. Choose Droplets by name,\ntag, or a combination of both. You can also search for Droplets by\
    \ IP address.\nThere are limits on the number of Droplets and tags that can be added to a firewall, but\nthere are no\
    \ limits to the number of Droplets that can be associated with a tag. Using\ntags allows you to exceed the individual\
    \ Droplet limit for firewalls. You can also tag a\nDroplet when you create it, which means you can apply firewall rules\
    \ immediately.\nDroplets can be protected by more than one cloud firewall. When they are, a union of\nthe rules is applied.\
    \ For example, if one rule allows TCP from any source and another\nallows TCP from a restricted range, the union of the\
    \ two means that TCP traffic is\nallowed from anywhere.\n5. Create the Firewall\nOnce you’ve defined the firewall’s rules\
    \ and added Droplets to it, click Create\nFirewall.\nAfter you’ve created a firewall, you can manage its rules and the\
    \ resources that it\nprotects from the Firewalls tab in the Networking section of the control panel.\nUsing the CLI\n\
    You can provide the --droplet-ids flag a list of Droplet IDs to automatically assign\nexisting Droplets to a firewall\
    \ during its creation. To retrieve a list of Droplets and their\nIDs, use the doctl compute droplet list command.\n1.\
    \ Install doctl, the official DigitalOcean CLI.\n2. Create a personal access token and save it for use with doctl.\n3.\
    \ Use the token to grant doctl access to your DigitalOcean account.\ndoctl auth init\n4. Finally, run\ndoctl compute firewall\
    \ create\nBasic usage looks like this, but you can read the usage docs for more details:\ndoctl compute firewall create\
    \ [flags]\nThe following example creates a cloud firewall named example-firewall that contains\nan inbound rule and an\
    \ outbound rule and applies them to the specified Droplets:\ndoctl compute firewall create --name \"example-firewall\"\
    \ --inbound-rules\n\"protocol:tcp,ports:22,droplet_id:386734086\" --outbound-rules\n\"protocol:tcp,ports:22,address:0.0.0.0/0\"\
    \ --droplet-ids \"386734086,391669331\"\n--tag-names \"frontend,backend,k8s:f81d4fae-7dec-11d0-a765-00a0c91e6bf6\"\nUsing\
    \ the API\nYou can provide the droplet_ids field with an array of Droplet IDs to automatically\nassign existing Droplets\
    \ to a firewall during its creation. To retrieve a list of Droplets and\ntheir IDs, use the /v2/droplets endpoint.\n1.\
    \ Create a personal access token and save it for use with the API.\n2. Send a POST request to https://api.digitalocean.com/v2/firewalls.\n\
    Using cURL\ncurl -X POST \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\"\
    \ \\\n -d\n'{\"name\":\"firewall\",\"inbound_rules\":[{\"protocol\":\"tcp\",\"ports\":\"80\",\"sources\"\n:{\"load_balancer_uids\"\
    : [\"4de7ac8b-495b-4884-9a691050c6793cd6\"]}},{\"protocol\": \"tcp\",\"ports\": \"22\",\"sources\":{\"tags\":\n[\"gateway\"\
    ],\"addresses\":\n[\"18.0.0.0/8\"]}}],\"outbound_rules\":[{\"protocol\":\"tcp\",\"ports\":\"80\",\"destinati\nons\":{\"\
    addresses\":[\"0.0.0.0/0\",\"::/0\"]}}],\"droplet_ids\":[8043964]}' \\\n \"https://api.digitalocean.com/v2/firewalls\"\
    \nGO\nUsing Godo, the official DigitalOcean API client for Go:\nimport (\n \"context\"\n \"os\"\n \"github.com/digitalocean/godo\"\
    \n)\nfunc main() {\n token := os.Getenv(\"DIGITALOCEAN_TOKEN\")\n client := godo.NewFromToken(token)\n ctx := context.TODO()\n\
    \ createRequest := &godo.FirewallRequest{\n Name: 'firewall',\n InboundRules: []godo.InboundRule{\n {\n Protocol: 'tcp',\n\
    \ PortRange: '80',\n Sources: &godo.Sources{\n LoadBalancerUIDs: []string{'4de7ac8b-495b-4884-9a691050c6793cd6'},\n },\n\
    \ },\n {\n Protocol: 'tcp',\n PortRange: '22',\n Sources: &godo.Sources{\n Addresses: []string{'18.0.0.0/8'},\n Tags:\
    \ []string{'gateway'},\n },\n },\n },\n OutboundRules: []godo.OutboundRule{\n {\n Protocol: 'tcp',\n PortRange: '80',\n\
    \ Destinations: &godo.Destinations{\n Addresses: []string{'0.0.0.0/0', '::/0'},\n },\n },\n },\n DropletIDs: []int{8043964},\n\
    \ }\n firewall, req, err := client.Firewalls.Create(ctx, createRequest)\n}\nRuby\nUsing DropletKit, the official DigitalOcean\
    \ API client for Ruby:\nrequire 'droplet_kit'\ntoken = ENV['DIGITALOCEAN_TOKEN']\nclient = DropletKit::Client.new(access_token:\
    \ token)\nfirewall = DropletKit::Firewall.new(\n name: 'firewall',\n inbound_rules: [\n DropletKit::FirewallInboundRule.new(\n\
    \ protocol: 'tcp',\n ports: '80',\n sources: {\n load_balancer_uids: ['4de7ac8b-495b-4884-9a69-1050c6793cd6']\n }\n ),\n\
    \ DropletKit::FirewallInboundRule.new(\n protocol: 'tcp',\n ports: '22',\n sources: {\n tags: ['gateway'],\n addresses:\
    \ ['18.0.0.0/8']\n }\n )\n ],\n outbound_rules: [\n DropletKit::FirewallOutboundRule.new(\n protocol: 'tcp',\n ports:\
    \ '80',\n destinations: {\n addresses: ['0.0.0.0/0', '::/0'],\n }\n )\n ],\n droplet_ids: [8043964]\n)\nclient.firewalls.create(firewall)\n\
    Python\nUsing PyDo, the official DigitalOcean API client for Python:\nimport os\nfrom pydo import Client\nclient = Client(token=os.environ.get(\"\
    DIGITALOCEAN_TOKEN\"))\nreq = {\n \"name\": \"firewall\",\n \"inbound_rules\": [\n {\n \"protocol\": \"tcp\",\n \"ports\"\
    : \"80\",\n \"sources\": {\n \"load_balancer_uids\": [\n \"4de7ac8b-495b-4884-9a69-1050c6793cd6\"\n ]\n }\n },\n {\n \"\
    protocol\": \"tcp\",\n \"ports\": \"22\",\n \"sources\": {\n \"tags\": [\n \"gateway\"\n ],\n \"addresses\": [\n \"18.0.0.0/8\"\
    \n ]\n }\n }\n ],\n \"outbound_rules\": [\n {\n \"protocol\": \"tcp\",\n \"ports\": \"80\",\n \"destinations\": {\n \"\
    addresses\": [\n \"0.0.0.0/0\",\n \"::/0\"\n ]\n }\n }\n ],\n \"droplet_ids\": [\n 8043964\n ]\n}\nresp = client.firewalls.create(body=req)"
