- id: '2.6'
  title: Ensure Auditd is Enabled
  scoring: scored
  profile:
  - Level 2
  description: 'Auditd is a user-space component of the Linux Auditing System, mainly used for collecting and writing audit
    logs to the disk. It helps system administrators monitor security incidents by logging various system events like file
    accesses and user activities. Auditd can be configured to track detailed system activity, facilitating the identification
    of patterns and anomalies that may be indicative of malicious behavior. The system’s flexibility allows for the creation
    of custom rules tailored to the specific monitoring needs of an organization. When the auditd service starts, it reads
    the audit.rules file to load its configuration. The audit.rules file contains specific rules that tell auditd what to
    log. These rules can specify which system calls to track, which files to watch for changes, and what types of user activity
    to monitor. Please refer to Red Hat’s Defining Audit Rules guide to determine which rules are appropriate for your organization.
    Refer to this list for audit record types: Audit Record Types'
  rationale: 'A few benefits of service auditing for a Droplet are: • Security: Auditd produces logs that can help recreate
    events on your Droplet. This is a critically important part of recovery after a security incident or understanding events
    on your Droplet in a security lens. • Fault Detection: Auditing helps in early detection of faults and errors in services.
    It allows you to identify and troubleshoot issues such as service crashes, failures, or unexpected behavior, preventing
    downtime and service disruptions. • Compliance: For businesses and organizations that need to adhere to specific regulatory
    requirements or compliance standards, regular service auditing helps ensure that services are configured and operated
    in accordance with those standards.'
  impact: Auditd can have performance impacts if incorrectly configured. For example you may not want to audit all filesystem
    writes if you’re running a database service. Auditd can generate a large volume of logs, especially if configured to track
    a wide range of activities. This logging can consume considerable system resources (CPU, memory, and disk I/O), potentially
    affecting the performance of the Droplet, especially if it has limited resources. The logs generated by auditd can quickly
    consume disk space. Without proper log rotation strategy and management, this can lead to disk space issues, affecting
    the Droplet’s stability and performance. When auditing, it is important to carefully configure the storage requirements
    for audit logs. By default, auditd will max out the log files at 5MB and retain only 4 copies of them. Older versions
    will be deleted. It is possible on a system that the 20 MBs of audit logs may fill up the system causing loss of audit
    data. While the recommendations here provide guidance, be sure to understand the context of your specific environment
    for audit storage requirements.
  references:
  - 1. https://access.redhat.com/documentation/enus/red_hat_enterprise_linux/7/html/security_guide/secdefining_audit_rules_and_controls#secDefining_Audit_Rules_and_Controls_in_the_audit.rules_file
  - 2. https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/6/html/securi
  page_start: 49
  audit_raw: 'To check if service auditing is set up on your DigitalOcean Droplet, you can follow these

    steps:

    1. Log in to your DigitalOcean Droplet console using SSH.

    2. DigitalOcean uses the auditd daemon for auditing. Refer to the Audit Procedure

    section of the Benchmark for your specific Linux distribution to test whether

    auditd is installed. We provide recommendations for the following distributions:

    • AlmaLinux

    • CentOS

    • Debian

    • Fedora

    • RockyLinux

    • Ubuntu'
  remediation: 'Follow the steps below to install and configure auditd for your operating system. Consult

    the Benchmark for your Linux distribution for detailed instructions

    1. SSH into your Droplet by opening your terminal or SSH client and connecting to

    your Droplet using its IP address or hostname:

    ssh username@your-droplet-ip

    Replace username with your username, and your-droplet-ip with your Droplet’s IP

    address.

    2. Install auditd using the Remediation Procedure appropriate for your Linux

    distribution.

    3. Ensure auditd is enabled and active. Please refer to the CIS Benchmark guide

    for your Linux distribution.

    4. Enable auditd service at bootup. Audit events need to be captured on processes

    that start up prior to auditd, so that potential malicious activity cannot go

    undetected. Please refer to the CIS Benchmark guide for your Linux distribution.

    5. Ensure the audit backlog limit is sufficient. If audit=1 during boot, then the

    backlog will hold 64 records. If more that 64 records are created during boot,

    auditd records will be lost and potential malicious activity could go undetected.

    The recommended audit backlog limit value is 8192 or larger. Please refer to the

    CIS Benchmark guide for your Linux distribution.

    6. Configure data retention. Once the log reaches the maximum size, it will be

    rotated and a new log file will be started. It is important that an appropriate size is

    determined for log files so that they do not impact the system and audit data is

    not lost. Please refer to the CIS Benchmark guide for your Linux distribution.

    7. Configure and test auditd rules. The Audit system operates on a set of rules that

    define what is to be captured in the log files. The following types of Audit rules

    can be specified:

    • Control rules: Allow the Audit system’s behavior and some of its configuration to

    be modified.

    • File system rules: Allow the auditing of access to a particular file or a directory.

    (Also known as file watches)

    • System call rules: Allow logging of system calls that any specified program

    makes.

    Audit rules can be set on the command line using the auditctl utility (note: these rules

    are not persistent across reboots). They can also be set in a file ending in .rules in the

    /etc/audit/audit.d/ directory. To define Audit rules that are persistent across

    reboots, you must either directly include them in the /etc/audit/audit.rules file or

    use the augenrules program that reads rules located in the /etc/audit/rules.d/

    directory.

    Find the rule set right for your Droplet and use case. Refer to Red Hat’s Defining Audit

    Rules guide and the CIS Benchmark for your Linux distribution.

    8. Test the rules using the following command. No output implies correct syntax.

    sudo auditctl -t < THE FILEPATH FOR YOUR AUDIT.RULES FILE

    9. Configure logrotate. The system includes the capability of rotating log files

    regularly to avoid filling up the system with logs or making the logs

    unmanageably large. The file /etc/logrotate.d/syslog is the configuration

    file used to rotate log files created by syslog or rsyslog. By keeping the log files

    smaller and more manageable, a system administrator can easily archive these

    files to another system and spend less time looking through inordinately large log

    files. Please refer to the CIS Benchmark guide for your Linux distribution.'
  checks:
  - type: manual_review
    info: 'To check if service auditing is set up on your DigitalOcean Droplet, you can follow these

      steps:

      1. Log in to your DigitalOcean Droplet console using SSH.

      2. DigitalOcean uses the auditd daemon for auditing. Refer to the Audit Procedure

      section of the Benchmark for your specific Linux distribution to test whether

      auditd is installed. We provide recommendations for the following distributions:

      • AlmaLinux

      • CentOS

      • Debian

      • Fedora

      • RockyLinux

      • Ubuntu'
    severity: medium
- id: '2.7'
  title: Ensure SSH Keys are Used to Authenticate
  scoring: scored
  profile:
  - Level 2
  description: SSH keys are a pair of cryptographic keys that can be used to authenticate to an SSH server as an alternative
    to password-based logins. SSH, which stands for Secure Shell, is a network protocol used to securely access and manage
    machines over an unsecured network. SSH keys offer a more secure way of logging into a server with SSH than using a password
    alone. SSH keys must be added prior to Droplet set up. They cannot be retroactively added to Droplets when other keys
    are added. When the authorized keys are placed on a Droplet, they control access to the root account only, not named users.
    Access for named users must be setup individually on the Droplet operating system itself and not via DigitalOcean cloud
    platform.
  rationale: 'Reasons why SSH key authentication is considered more secure than password authentication: • Strong Encryption:
    SSH key pairs are typically generated using strong encryption algorithms, such as RSA or Ed25519, which are significantly
    more secure than passwords. Keys are stronger than passwords because of the asymmetric encryption key pair. A well generated
    key pair is much harder to brute force than a password. • No Passwords: With SSH key authentication, there are no passwords
    involved in the authentication process. Passwords can be vulnerable to various attacks, including brute force attacks,
    phishing, and credential leaks. Since SSH keys are cryptographically secure, they are not susceptible to these types of
    attacks. • Lowers Probability of Credential Theft: SSH keys are not easily stolen or intercepted because the private key
    is never transmitted over the network. Even if an attacker gains access to the server, they won’t have access to your
    private key unless it’s stored on the server (which is not recommended). In contrast, passwords are sent over the network
    during authentication and can be intercepted if the connection is not secure. • Logging and Accountability: SSH key-based
    authentication allows for better auditing and accountability. When someone uses an SSH key to log in, their actions are
    associated with that key, making it easier to trace who did what on a server. Revocation and Rotation: If you suspect
    that your private key has been compromised, you can easily revoke it and generate a new one.'
  impact: SSH keys do not have an inherent expiration date like some other authentication methods. This means that old, possibly
    forgotten keys can remain valid indefinitely unless manually removed, potentially leading to unauthorized access if those
    keys are compromised. The security of SSH key authentication relies on the private key remaining confidential. If a user’s
    private key is exposed or stolen, an attacker can gain access to all systems where the corresponding public key is authorized.
    This risk necessitates careful handling, protection (e.g., with a passphrase), and secure storage of private keys.
  references:
  - 1. https://www.digitalocean.com/community/tutorials/how-to-set-up-ssh-keys-oncentos-8
  - 2. https://www.digitalocean.com/community/tutorials/how-to-set-up-ssh-keys-ondebian-11
  page_start: 53
  audit_raw: 'To check if your DigitalOcean account has an SSH key associated:

    1. Log into your DigitalOcean Control Panel.

    2. Select Settings in the bottom left of the panel.

    3. Select the Security tab in the settings menu.

    4. In the SSH Keys section, you should see a list of all the SSH keys associated

    with your DigitalOcean account. Each SSH key is typically identified by a name

    you provided when you added it. If there are SSH keys listed, it means you have

    SSH keys associated with your account.

    5. Verify the key details by clicking on each SSH key to view its details, including

    the name, fingerprint, and the date it was added. This can help you confirm the

    existence of your SSH key.

    If you do not see any SSH keys listed in this section, it means that there are no SSH

    keys associated with your DigitalOcean account. In that case, follow the steps outlined

    in the remediation.'
  remediation: 'Creating an SSH Key Before Droplet Creation

    Open a terminal and run the following command (macOS example):

    ssh-keygen

    You will be prompted to save and name the key.

    Generating public/private rsa key pair. Enter file in which to save the key

    (/Users/USER/.ssh/id_rsa):

    Next you will be asked to create and confirm a passphrase for the key (highly

    recommended):

    Enter passphrase (empty for no passphrase): Enter same passphrase again:

    Copy the contents of the .pub file, typically id_rsa.pub.

    cat ~/.ssh/id_rsa.pub

    Next,

    1. Go to the Settings section of your DigitalOcean dashboard.

    2. Select the Security tab.

    3. Click the Add SSH Key button.

    4. Paste the public key into the Public Key box and name your key.

    5. Click the blue Add SSH Key button.

    This SSH key can be selected during the Choose Authentication Method step of

    Droplet creation.

    For extra security on Ubuntu, Debian, and CentOS droplets, disable Password-based

    SSH authentication with the following steps:

    1. Open up the SSH configuration file. It is typically found at one of the following

    locations, depending on your operating system:

    sudo nano /etc/ssh/sshd_config

    sudo vi /etc/ssh/sshd_config

    2. This command will open up the file within the text editor. Find the line in the file

    that includes PasswordAuthentication (or create the line if it doesn’t exist), make

    sure it is not commented out with a # at the beginning of the line, and change it to

    no:

    Password Authentication no

    3. Save and close the file when you are finished.

    • In nano, use CTRL+O to save, hit ENTER to confirm the filename, then CTRL+X

    to exit.

    • In vi, press ESC and then :wq to write the changes to the file and quit.

    4. Reload the sshd service to put these changes into effect:

    sudo systemctl reload sshd

    5. Before exiting your current SSH session, make a test connection in another

    terminal to verify you can still connect.

    Password-based authentication for newly created Alma 9, Rocky 8, and Fedora

    Droplets has been disabled due to an incompatibility between the operating system’s

    password authentication mechanism and DigitalOcean’s provisioning system. SSHbased login will remain available.

    Creating an SSH Key After Droplet Creation

    Please select the link for your Linux distribution to learn how to create a key pair,

    authenticate keys, and disable password authentication for your server.

    • CentOS

    • Debian

    • Ubuntu'
