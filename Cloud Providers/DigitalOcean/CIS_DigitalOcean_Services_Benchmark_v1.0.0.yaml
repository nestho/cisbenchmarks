- id: '3.1'
  title: Ensure Log Forwarding is Enabled
  scoring: manual
  profile:
  - Level 1
  description: Log forwarding allows you to transmit log data from various databases and applications to the log management
    provider of your choice, including OpenSearch, which is required for this recommendation.
  rationale: 'As listed in our Log Forwarding is Now Available for DOKS blog, some benefits to enabling log forwarding include:
    • Centralized log management: Log forwarding allows customers to aggregate events across Kubernetes data plane into a
    centralized system. This makes it easier to manage and access cluster event logs across a distributed Kubernetes environment,
    rather than searching through individual nodes or containers for log data. • Improved monitoring and simplified troubleshooting:
    With a centralized log management system, this feature allows you to consolidate logs from multiple sources, including
    DOKS, making it easier to monitor application performance and troubleshoot issues. Logs are crucial for identifying issues
    in Kubernetes clusters, and a centralized service helps users to pinpoint and resolve errors, performance bottlenecks,
    or configuration issues by providing a unified view of system activity. • Improved altering: By forwarding logs to a log
    management provider, customers can set up alerts for specific log patterns or errors. This allows them to proactively
    respond to potential problems or threats before they impact production environments, helping to ensure better reliability.
    • Optimized resource usage: Combining Managed OpenSearch with DOKS helps to ensure that logs are processed, stored, and
    queries efficiently within a managed system optimized for performance. Both the combination and compatibility alone between
    DOKS and OpenSearch allows users to offload resource-intensive log aggregation and analysis to a specialized service (OpenSearch),
    which frees up Kubernetes resources for application workloads.'
  impact: Log forwarding has no adverse impacts.
  references:
  - 1. https://docs.digitalocean.com/products/kubernetes/concepts/best-practices/
  - 2. https://www.digitalocean.com/blog/log-forwarding-for-doks
  page_start: 61
  audit_raw: '1. Log into your DigitalOcean Control Panel.

    2. Go to the Kubernetes section, select the cluster, and click the Settings tab.

    Log forwarding is not enabled if no destinations are listed.'
  remediation: '1. Go to the Kubernetes section of the control panel, select the cluster, and click the

    Settings tab. In the Event log forwarding section, click Edit.

    2. If you do not have an existing managed OpenSearch cluster, click Create a

    database to open the Create Managed Database screen. Choose a datacenter

    region, specify OpenSearch as the database engine, and other cluster settings

    as described in Create OpenSearch Clusters.

    3. After you create the managed OpenSearch cluster or want to select an existing

    cluster, click Managed OpenSearch to open the Forward logs to Managed

    OpenSearch window. Specify the following values:

    • Destination Name: Name for the destination. Provide a descriptive name for the

    destination.

    • Select DigitalOcean OpenSearch database: OpenSearch cluster to forward

    logs to. Select the cluster from the drop-down list.

    • User: The username you use to access the cluster. Use the default doadmin

    user or select another user from the drop-down list.

    • Index name: The name of the OpenSearch index to forward the logs to. Specify

    a lowercase index name or use the default value of logs. Indexes with uppercase

    characters in their names may not appear in the dashboard. For more

    information on indexes, see OpenSearch’s documentation.

    4. Click Add destination to add the managed OpenSearch cluster as a log

    forwarding destination.

    5. If you want to change the destination, click the … menu and select Edit

    destination to open the Edit Managed OpenSearch destination window.

    Update the settings you want and click Save Destination.

    6. To remove the log forwarding destination, click the … menu and select Remove.

    Then, click Remove destination to confirm removing the destination.'
  checks:
  - type: manual_review
    info: '1. Log into your DigitalOcean Control Panel.

      2. Go to the Kubernetes section, select the cluster, and click the Settings tab.

      Log forwarding is not enabled if no destinations are listed.'
    severity: medium
- id: '3.2'
  title: Ensure an Upgrade Window is Defined
  scoring: scored
  profile:
  - Level 2
  description: 'You can upgrade DigitalOcean Kubernetes clusters to newer patch versions (for example, 1.20.1 to 1.20.2) as
    well as new minor versions (for example, 1.19.1 to 1.20.1) in the DigitalOcean Control Panel or in doctl, the command
    line interface (CLI) tool. There are two ways to upgrade: • On demand. When an upgrade becomes available for DigitalOcean
    Kubernetes, you can manually trigger the upgrade process. You can upgrade to a new minor version using the manual process,
    provided you first perform all available patchlevel upgrades for your current minor version. • Automatically. You can
    enable automatic upgrades for a cluster that happen within a maintenance window you specify. Automatic updates trigger
    on new patch versions of Kubernetes and new point releases of DigitalOcean Kubernetes subsystems with non-breaking updates.
    However, your cluster is not automatically upgraded to new minor Kubernetes versions (for example, 1.19.1 to 1.20.1).
    Required Upgrades When a required upgrade is scheduled for your cluster, a notification appears in the control panel indicating
    the target version and when the required upgrade is scheduled to occur. You can configure the weekday and time required
    upgrades occur in the Upgrade window in the Settings tab of the cluster. You can upgrade the cluster yourself before this
    date. When a minor version becomes unsupported, we schedule an upgrade to the latest patch version of the next supported
    minor version. We notify you via email 30 days prior to the scheduled upgrade. We notify you again 7 days and the day
    before the upgrade starts. DigitalOcean may schedule an upgrade to the latest patch version of the cluster’s current minor
    version if a serious security vulnerability is identified in the version your cluster is running. We notify you at least
    7 days before the upgrade, as well as the day before the upgrade starts. DigitalOcean runs a cluster linter check before
    each required upgrade. A subset of the errors are included in the 30-day notice email and also appear in the control panel.
    If cluster linter errors are present, you must fix the issues. The Upgrade Process During an upgrade, the control plane
    (Kubernetes main) is replaced with a new control plane running the new version of Kubernetes. This process takes a few
    minutes, during which API access to the cluster is unavailable but workloads are not impacted. Once the control plane
    is replaced, the worker nodes are replaced in a rolling fashion, one worker pool at a time. DOKS uses the following replacement
    process for the worker nodes: 1. Identify a number of nodes to drain. 2. Perform the following steps for each node concurrently:
    a. Generate the list of pods running on it. This does not include DaemonSets or mirrored pods. b. Mark the beginning of
    the drain start time as an annotation on the node. Eviction timeout is 15 minutes and drain (node deletion) timeout is
    30 minutes. c. Evict as many pods concurrently as the PodDisruptionBudget (PDB) policies allow. If the process hits the
    eviction timeout while draining a node, it switches to deleting the pods. If it hits the drain timeout while draining
    a node, it switches to deleting the node. d. Wait a bit to allow for pod disruption budget to recover. e. Repeat the above
    steps until all pods are drained. As nodes are upgraded, workloads may experience downtime if there is no additional capacity
    to host the node’s workload during the replacement. If you enable surge upgrades, then up to 10 new nodes for a given
    node pool are created up front before the existing nodes of that node pool start getting drained. Since everything happens
    concurrently, one node stalling the drain process doesn’t stop the other nodes from proceeding. However, since one pool
    is upgraded at a time, it means that DOKS doesn’t move to the next node pool until the current node pool finishes. When
    you enable surge upgrades, Kubernetes reschedules each worker node’s workload, then replaces the node with a new node
    running the new version and reattaches any DigitalOcean Volumes Block Storage to the new nodes. The new worker nodes have
    new IP addresses. Surge Upgrades Surge upgrades create duplicate upgraded nodes while, in parallel, draining workloads
    from old nodes to the new nodes and removing the old nodes. Surge upgrades create up to 10 duplicate nodes. As a result,
    larger cluster nodes are upgraded with at most 10 nodes at a time. Surge upgrades are available at no additional cost
    and are enabled by default when you create a new Kubernetes cluster. We recommend enabling surge upgrades when upgrading
    an existing cluster for a faster and more stable upgrade. To enable surge upgrades, in the Surge upgrades section of the
    Settings tab of your cluster, click Edit. Select the Enable surge upgrades option and click Save. To use surge upgrades
    for the entire upgrade duration, your Droplet limit must be at least n + min(10, num_nodes), where num_nodes is the number
    of nodes in your cluster and n is your current Droplet count. For example, if you have a 12-node cluster and 5 Droplets,
    your Droplet limit must at least be 15. You can request a Droplet limit increase at any time. If an upgrade starts with
    less than the required number of Droplets or the limit is reached during the upgrade, then a partial upgrade is done using
    the available Droplets and the remaining upgrade happens without the surge enabled. To minimize the disruptive impact
    of upgrades, for critical applications, we recommend setting Pod Disruption Budgets.'
  rationale: 'Setting a cluster upgrade window has several benefits, including: • Alignment with business needs: Businesses
    can align upgrade schedules with operational priorities to avoid updates during high-traffic times. • Improved security:
    Scheduled upgrades ensure clusters are up-to-date with the latest patches and bug fixes.'
  impact: Some applications and dependencies may not be compatible with the latest upgrade. Upgrading your cluster can cause
    disruptions in the availability of services running in your workloads. Any data stored on the local disks of the worker
    nodes are lost in the upgrade process. We recommend using persistent volumes for data storage, and not relying on local
    disk for anything other than temporary data
  references:
  - 1. https://cloud.digitalocean.com/kubernetes
  - 2. https://docs.digitalocean.com/products/kubernetes/how-to/upgrade-cluster/
  page_start: 64
  audit_raw: 'Go to the Kubernetes section of the control panel, select the cluster, and click the

    Settings tab. The Automatically upgrade minor version patches section will

    say Disabled if you do not have them installed.

    Please visit the How to Upgrade DOKS Clusters to New Versions documentation for

    more information.'
  remediation: "The default upgrade window is chosen by the DigitalOcean Kubernetes backend to\nguarantee an even workload\
    \ across all maintenance windows for optimal processing.\nYou can specify a different maintenance window in the Settings\
    \ tab of a cluster. In the\nUpgrade window section, click Edit to specify a different start time. Upgrade windows\nare\
    \ made up of two parts: a time of day and, optionally, a day of the week. For example,\nyou can set your upgrade window\
    \ to 5 AM any day of the week or to 8 PM on Mondays.\nUsing the Control Panel\nUpgrading On Demand\nTo update a cluster\
    \ manually, visit the Overview tab of the cluster in the control panel.\nYou see a View Available Upgrade button if there\
    \ is a new version available for your\ncluster. Click this button to begin the upgrade process.\nOnce an upgrade starts,\
    \ you can see its progress in the Overview and Resources tabs.\nUpgrading to a New Minor Version\nThe on-demand process\
    \ is required when upgrading your cluster to a new minor version\nof Kubernetes. During this process, you can run our\
    \ cluster linter before upgrading. This\nautomatically checks the cluster to ensure it’s conforming to some common best\n\
    practices, and links to the fixes recommended in our documentation, to help mitigate\nissues that might affect your cluster’s\
    \ compatibility with the newer version of\nKubernetes. Click Run Linter on the upgrade window to begin.\nUpgrading to\
    \ New Control Plane\nDigitalOcean Kubernetes clusters originally created with version 1.20 or older have a\nversion of\
    \ the control plane architecture which does not allow you to enable high\navailability. However, you can now upgrade your\
    \ control plane to the new version. This\nupgrade option is available for Kubernetes versions currently 1.22 and later.\n\
    In the cluster’s Overview page or the View Available Upgrade pop-up list, follow the\nupgrade process to get the new control\
    \ plane.\nThe upgrade process may disrupt your cluster’s operations for up to approximately 2\nminutes. This is because\
    \ the upgrade involves a significant Cilium configuration change;\nso, during the migration, many worker nodes are on\
    \ different configurations and\ntherefore cannot communicate with each other until all the pods have rapidly restarted.\n\
    In addition to following the steps to minimize disruptions during upgrades, we\nrecommend you do not create any new workloads\
    \ during the upgrade. This includes\ncreating new deployments and increasing replica count for existing processes manually\n\
    or automatically (such as with replica-adjusting controllers like HPA).\nUpgrading Automatically\nTo enable automatic\
    \ upgrades for a cluster, visit the Settings tab of the cluster. In the\nAutomatically upgrade minor version patches section,\
    \ click the Automatically\ninstall minor version patches checkbox.\nAutomatic upgrades occur during a cluster’s 4-hour\
    \ upgrade window. The default\nupgrade window is chosen by the DigitalOcean Kubernetes backend to guarantee an\neven workload\
    \ across all maintenance windows for optimal processing.\nYou can specify a different maintenance window in the Settings\
    \ tab of a cluster. In the\nUpgrade window section, click Edit to specify a different start time. Upgrade windows\nare\
    \ made up of two parts: a time of day and, optionally, a day of the week. For example,\nyou can set your upgrade window\
    \ to 5 AM any day of the week or to 8 PM on Mondays.\nYou receive a notification email 30 days, 7 days, and 1 day before\
    \ an automatic\nupgrade.\nEven if you have auto upgrades enabled, you can still upgrade on-demand by clicking\nthe View\
    \ Available Upgrade button in the Overview tab.\nUpgrade Using Automation\nIf you do not provide a version in the version\
    \ field, the cluster upgrades to the next\nminor version of Kubernetes (for example, 1.28.1 to 1.29.1). You can retrieve\
    \ a list of\navailable version using the /v2/kubernetes/options endpoint or the doctl\nkubernetes options command.\nUpgrade\
    \ Using the DigialOcean CLI\n1. Install doctl, the official DigitalOcean CLI.\n2. Create a personal access token and save\
    \ it for use with doctl.\n3. Use the token to grant doctl access to your DigitalOcean account.\ndoctl auth init\n4. Finally,\
    \ run doctl kubernetes cluster upgrade. Basic usage looks like this,\nbut you can read the usage docs for more details:\n\
    doctl kubernetes cluster upgrade <id|name> [flags]\nThe following example upgrades a cluster named example-cluster to\
    \ version 1.28.2:\ndoctl kubernetes cluster upgrade example-cluster --version 1.28.2-do.0\nUpgrade Using the DigialOcean\
    \ API\n1. Create a personal access token and save it for use with the API.\n2. Send a POST request to\nhttps://api.digitalocean.com/v2/kubernetes/clusters/{cluster_id}/\n\
    upgrade.\ncURL\nUsing cURL:\ncurl -X GET \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\"\
    \ \\\n \"https://api.digitalocean.com/v2/kubernetes/clusters/bd5f5959-5e1e-4205a714-a914373942af/upgrades\"\nGo\nUsing\
    \ Godo, the official DigitalOcean API client for Go:\nimport (\n \"context\"\n \"os\"\n \"github.com/digitalocean/godo\"\
    \n)\nfunc main() {\n token := os.Getenv(\"DIGITALOCEAN_TOKEN\")\n client := godo.NewFromToken(token)\n ctx := context.TODO()\n\
    \ upgradeRequest := &godo.KubernetesClusterUpgradeRequest{\n VersionSlug: \"1.12.3-do.1\",\n }\n}\nPython\nUsing PyDo,\
    \ the official DigitalOcean API client for Python:\nimport os\nfrom pydo import Client\nclient = Client(token=os.environ.get(\"\
    DIGITALOCEAN_TOKEN\"))\nreq = {\n \"version\": \"1.16.13-do.0\"\n}\nresp = client.kubernetes.upgrade_cluster(cluster_id=\"\
    1fd32a\", body=req)\nUpgrading to a Specific Version\nTo upgrade to a specific Kubernetes version, rather than automatically\
    \ upgrading to the\nlatest version, you must first use your cluster ID to get a list of available upgrades for\nthat cluster:\n\
    doctl kubernetes cluster get-upgrades <cluster-id>\nThen, use the slug value returned by the get-upgrades call to perform\
    \ the upgrade:\ndoctl kubernetes cluster upgrade <cluster-id> --version 1.20.2-do.0"
  checks:
  - type: manual_review
    info: 'Go to the Kubernetes section of the control panel, select the cluster, and click the

      Settings tab. The Automatically upgrade minor version patches section will

      say Disabled if you do not have them installed.

      Please visit the How to Upgrade DOKS Clusters to New Versions documentation for

      more information.'
    severity: medium
- id: '3.3'
  title: Ensure High Availability Control Plane is Enabled
  scoring: scored
  profile:
  - Level 1
  description: DigitalOcean Kubernetes provides a high availability (HA) option that increases uptime and provides 99.95%
    SLA uptime for control planes. If you enable high availability for a cluster, multiple replicas of each control plane
    component are created, ensuring that a redundant replica is available when a failure occurs. This results in additional
    increased uptime.
  rationale: 'Enabling the High Availability Control Plane increases performance and offers several benefits, including: •
    Minimized downtime: The redundancy and failover mechanisms of high availability ensure services remain operational. •
    Improved performance: High availability optimizes resource utilization. • Resiliency: High Availability automatically
    detects and replaces unhealthy components and dynamically allocates CPU and memory resources on demand.'
  impact: Enabling the High Availability Control Plane offers better resilience, but may increase costs. Once enabled, you
    cannot disable high availability.
  references:
  - 1. https://docs.digitalocean.com/products/kubernetes/details/managed/#managedelements-of-the-control-plane
  - 2. https://cloud.digitalocean.com/kubernetes
  page_start: 71
  audit_raw: 'Go to the Kubernetes section of the control panel, and click the Overview tab. Scroll

    down to the Control Pane. The High Availability status will say Not Enabled or

    Enabled, depending on your settings.'
  remediation: "Using the Control Panel\nTo enable high availability on an existing cluster, go to the control panel and click\
    \ the\ncluster you want to enable high availability on. Then, in the Overview tab, scroll down\nand find the Control Plane\
    \ card.\nIn the card, click Add high availability. This opens a pop-up window where you\ncan confirm your change. Once\
    \ enabled, you cannot disable high availability in the\nfuture.\nDigitalOcean Kubernetes clusters originally created with\
    \ version 1.20 or older have a\nversion of the control plane which does not allow you to enable high availability. If\
    \ you\ncannot find this card, upgrade your control plane.\nTo check whether you can upgrade your cluster to the new control\
    \ plane, see\nUpgrading to New Control Plane.\nUsing Automation\nYou can enable high availability using the DigitalOcean\
    \ Kubernetes doctl update\ncommand or API endpoint by setting the ha value to true.\nHow to Update a Kubernetes Cluster\
    \ Using the DigitalOcean CLI\n1. Install doctl, the official DigitalOcean CLI.\n2. Create a personal access token and\
    \ save it for use with doctl.\n3. Use the token to grant doctl access to your DigitalOcean account.\ndoctl auth init\n\
    4. Finally, run doctl kubernetes cluster update. Basic usage looks like this,\nbut you can read the usage docs for more\
    \ details:\ndoctl kubernetes cluster update <id|name> [flags]\nHow to Update a Kubernetes Cluster Using the DigitalOcean\
    \ API\n1. Create a personal access token and save it for use with the API.\n2. Send a PUT request to\nhttps://api.digitalocean.com/v2/kubernetes/clusters/{cluster_id}.\n\
    cURL\nUsing cURL:\ncurl -X PUT \\\n -H \"Content-Type: application/json\" \\\n -H \"Authorization: Bearer $DIGITALOCEAN_TOKEN\"\
    \ \\\n -d '{\"name\": \"stage-cluster-01\", \"tags\":[\"staging\", \"web-team\"]}' \\\n \"https://api.digitalocean.com/v2/kubernetes/clusters/bd5f5959-5e1e-4205a714-a914373942af\"\
    \nGo\nUsing Godo, the official DigitalOcean API client for Go:\nimport (\n \"context\"\n \"os\"\n \"github.com/digitalocean/godo\"\
    \n)\nfunc main() {\n token := os.Getenv(\"DIGITALOCEAN_TOKEN\")\n client := godo.NewFromToken(token)\n ctx := context.TODO()\n\
    \ updateRequest := &godo.KubernetesClusterUpdateRequest{\n Name: \"stage-cluster-01\",\n Tags: []string{\"staging\", \"\
    web-team\"},\n }\n cluster, _, err := client.Kubernetes.Update(ctx, \"bd5f5959-5e1e-4205a714-a914373942af\", updateRequest)\n\
    }\nRuby\nUsing DropletKit, the official DigitalOcean API client for Ruby:\nrequire 'droplet_kit'\ntoken = ENV['DIGITALOCEAN_TOKEN']\n\
    client = DropletKit::Client.new(access_token: token)\ncluster = DropletKit::KubernetesCluster.new(\n name: 'foo',\n tags:\
    \ ['staging', 'web-team']\n)\nclient.kubernetes_clusters.update(cluster, id: 'bd5f5959-5e1e-4205-a714a914373942af')\n\
    Python\nUsing PyDo, the official DigitalOcean API client for Python:\nimport os\nfrom pydo import Client\nclient = Client(token=os.environ.get(\"\
    DIGITALOCEAN_TOKEN\"))\nreq = {\n \"name\": \"prod-cluster-01\",\n \"tags\": [\n \"k8s\",\n \"k8s:bd5f5959-5e1e-4205-a714-a914373942af\"\
    ,\n \"production\",\n \"web-team\"\n ],\n \"maintenance_policy\": {\n \"start_time\": \"12:00\",\n \"day\": \"any\"\n\
    \ },\n \"auto_upgrade\": True,\n \"surge_upgrade\": True,\n \"ha\": True\n}\nresp = client.kubernetes.update_cluster(cluster_id=\"\
    1fd32a\", body=req)"
  checks:
  - type: manual_review
    info: 'Go to the Kubernetes section of the control panel, and click the Overview tab. Scroll

      down to the Control Pane. The High Availability status will say Not Enabled or

      Enabled, depending on your settings.'
    severity: medium
- id: '4.1'
  title: Ensure Security History is Monitored
  scoring: manual
  profile:
  - Level 1
  description: The security history of your Droplet shows a record of actions that have been taken in an account. Within the
    history, users can find a record of actions taken within your account, such as user logins, password changes, and resource
    creation, augmentation, and deletion. Each record includes the IP address of the device where the action originated and
    a correlative time stamp.
  rationale: Monitoring supports the detection of unusual activities that might indicate a security breach.
  impact: There are no adverse consequences by monitoring security history.
  references:
  - 1. https://cloud.digitalocean.com/
  page_start: 76
  audit_raw: 'As of publication date, the only way to access the security history is through the cloud

    UI.

    1. Sign in to your DigitalOcean dashboard.

    2. Go to the Settings menu.

    3. Click the Security tab.

    4. The bottom of the page will have a table of your account’s security history. It will

    list the action taken, the user’s name, email address, and IP address, and the

    time the action was taken.'
  remediation: Security History can not be turned off.
  checks:
  - type: manual_review
    info: 'As of publication date, the only way to access the security history is through the cloud

      UI.

      1. Sign in to your DigitalOcean dashboard.

      2. Go to the Settings menu.

      3. Click the Security tab.

      4. The bottom of the page will have a table of your account’s security history. It will

      list the action taken, the user’s name, email address, and IP address, and the

      time the action was taken.'
