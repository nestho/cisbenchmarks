- id: '2.8'
  title: Ensure Unused SSH Keys are Deleted
  scoring: scored
  profile:
  - Level 2
  description: SSH keys are a pair of cryptographic keys that can be used to authenticate to an SSH server as an alternative
    to password-based logins. SSH, which stands for Secure Shell, is a network protocol used to securely access and manage
    machines over an unsecured network. SSH keys offer a more secure way of logging into a server with SSH than using a password
    alone.
  rationale: 'Deleting SSH keys are important for: • Preventing Unauthorized Access If an SSH key is no longer needed—such
    as for an employee who has left the company or a device that’s been decommissioned—leaving it active could open a security
    vulnerability. Removing old or unused keys reduces the attack surface. • Audit Trails For auditing and monitoring purposes,
    it’s important to track who has access to what. Deleting keys of former users or devices ensures that audit logs are accurate
    and reflect actual access privileges. • Key Rotation: Regularly deleting old keys and rotating them (changing to new ones)
    is part of good security hygiene. If a key becomes stale or compromised, attackers may exploit it, so keeping only current,
    active keys ensures better control over access.'
  impact: Deleting or rotating SSH keys is essential for maintaining strong security, but if not managed properly, it can
    lead to several issues. The most significant risk is losing access to servers if keys are deleted or rotated without properly
    configuring the new keys first. Automated processes and services that rely on SSH keys may break if they aren’t updated,
    leading to disruptions. Additionally, if keys are deleted or rotated without proper documentation or communication, it
    could result in confusion or accidental removal of critical access.
  references: []
  page_start: 57
  audit_raw: 'Using the Control Panel

    1. Log in to your DigitalOcean Account.

    2. Select Settings.

    3. Click the Security tab.

    4. The tab shows a table of created SSH keys. Review this table and ensure listed

    SSH keys are valid.

    Using the Command Line

    To get information about a key, send a GET request to

    /v2/account/keys/$KEY_ID

    or

    /v2/account/keys/$KEY_FINGERPRINT

    A 404 status will be returned if the key does not exist.'
  remediation: 'Using the Control Panel

    1. Log in to your DigitalOcean Account.

    2. Select Settings.

    3. Click the Security tab.

    4. The tab shows a table of created SSH keys. Select the three dots at the end of

    the row of the key you want to delete.

    5. Select Delete.

    Using the Command Line

    To destroy a public SSH key that you have in your account, send a DELETE request to

    /v2/account/keys/$KEY_ID

    or

    /v2/account/keys/$KEY_FINGERPRINT

    A 204 status will be returned, indicating that the action was successful and that the

    response body is empty.

    Please refer to the API documentation for deleting an SSH key from your account:

    https://docs.digitalocean.com/reference/api/api-reference/#operation/sshKeys_delete

    These methods delete the SSH key from the account and prevent it from being used on

    new Droplets, but it does not remove the SSH key from existing Droplets.

    To ensure the security of existing assets, review each Droplet and either

    • Delete the departing user’s account or

    • Remove keys from appropriate authorized_keys file and change the user

    account’s password.

    For each Droplet in your team account:

    • Delete the departing user’s user’s account

    If the system has configured authorized_keys in a different way, please remove them

    from however your system manages keys.

    If it is necessary to keep the user account, please:

    1. Change the password

    2. Remove all appropriate entries from

    /home/$departing_user_username/.ssh/authorized_keys

    If your team’s Droplets are using password auth you must:

    1. Remove the user account all together; or

    2. If the account must persist, change the password of the account to a complex

    string 18+ characters in length.

    3. If the user had knowledge of the root password, and root logins are allowed in

    /etc/ssh/sshd_config, you must change the root password on all Droplets

    that have that password and sshd config.'
