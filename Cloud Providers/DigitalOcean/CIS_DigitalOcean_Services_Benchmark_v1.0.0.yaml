    \ 3164450)\n// Power Cycle a Droplet\n// action, _, err := client.DropletActions.PowerCycle(ctx, 3164450)\n// Shutdown\
    \ a Droplet\n// action, _, err := client.DropletActions.Shutdown(ctx, 3067649)\n// Power Off a Droplet\n// action, _,\
    \ err := client.DropletActions.PowerOff(ctx, 3164450)\n// Power On a Droplet\n// action, _, err := client.DropletActions.PowerOn(ctx,\
    \ 3164450)\n// Restore a Droplet\n// action, _, err := client.DropletActions.Restore(ctx, 3164449, 12389723)\n// Password\
    \ Reset a Droplet\n// action, _, err := client.DropletActions.PasswordReset(ctx, 3164450)\n// Resize a Droplet\n// action,\
    \ _, err := client.DropletActions.Resize(ctx, 3164450, \"1gb\", true)\n// Rebuild a Droplet\n// action, _, err := client.DropletActions.RebuildByImageSlug(ctx,\
    \ 3164450,\n\"ubuntu-16-04-x64\")\n// Rename a Droplet\n// action, _, err := client.DropletActions.Rename(ctx, 3164450,\
    \ \"nifty-newname\")\n// Change the Kernel\n// action, _, err := client.DropletActions.ChangeKernel(ctx, 3164450, 991)\n\
    // Enable IPv6\n// action, _, err := client.DropletActions.EnableIPv6(ctx, 3164450)\n// Enable Private Networking\n//\
    \ action, _, err := client.DropletActions.EnablePrivateNetworking(ctx,\n3164450)\n// Snapshot a Droplet\n// action, _,\
    \ err := client.DropletActions.Snapshot(ctx, 3164450, \"Nifty New\nSnapshot\")\n// Retrieve a Droplet Action\n// action,\
    \ _, err := client.DropletActions.Get(ctx, 3164450, 36804807)\nRuby\nUsing DropletKit, the official DigitalOcean API client\
    \ for Ruby:\nrequire 'droplet_kit'\ntoken = ENV['DIGITALOCEAN_TOKEN']\nclient = DropletKit::Client.new(access_token: token)\n\
    # Enable Backups\nclient.droplet_actions.enable_backups(droplet_id: 3164450)\n# Disable Backups\n# client.droplet_actions.disable_backups(droplet_id:\
    \ 3164450)\n# Reboot a Droplet\n# client.droplet_actions.reboot(droplet_id: 3164450)\n# Power Cycle a Droplet\n# client.droplet_actions.power_cycle(droplet_id:\
    \ 3164450)\n# Shutdown a Droplet\n# client.droplet_actions.shutdown(droplet_id: 3067649)\n# Power Off a Droplet\n# client.droplet_actions.power_off(droplet_id:\
    \ 3164450)\n# Power On a Droplet\n# client.droplet_actions.power_on(droplet_id: 3164450)\n# Restore a Droplet\n# client.droplet_actions.restore(droplet_id:\
