- id: '4.2'
  title: Ensure Resource Monitoring is Enabled
  scoring: scored
  profile:
  - Level 1
  description: DigitalOcean Monitoring is a free, opt-in service that gathers metrics about Droplet-level resource utilization.
    It provides additional Droplet graphs and supports configurable metrics alert policies with integrated email Slack notifications
    to help you track the operational health of your infrastructure.
  rationale: 'Resource monitoring in important for many reasons, including: • Real-time Insights: Monitoring provides real-time
    information on utilization and performance, enabling swift responses to anomalies or outages and supporting faster diagnosis
    and mitigation of security-related problems to minimize downtime and reduce the window of vulnerability. • Performance
    Optimization: By analyzing metrics such as CPU utilization and memory usage, customers can optimize their applications
    for better speed and responsiveness. • Audit Support: Retaining monitoring data for 14 days allows security teams to review
    historical performance and usage patterns, facilitating forensic analysis to understand the timeline and impact of security
    events.'
  impact: Metrics agents typically consume system resources like CPU, memory, and network bandwidth to collect and transmit
    data. While usually minimal, this overhead can impact the performance of the server, especially if the server is already
    under heavy load or has limited resources.
  references:
  - 1. https://cloud.digitalocean.com/
  - 2. https://docs.digitalocean.com/products/monitoring/how-to/install-agent/
  page_start: 78
  audit_raw: 'Follow these steps to ensure monitoring is activated:

    1. Sign in to your DigitalOcean account.

    2. Select Droplets under the Manage menu.

    3. Click on the name of the Droplet.

    The security monitoring page will display graphs of CPU percentages, memory

    use, disk input/output, and other metrics.'
  remediation: "Installing the Metrics Agent on a New Droplet\nUsing the Control Panel\nTo install the metrics agent during\
    \ Droplet creation with the control panel, find the We\nrecommend these options section and click Enable Monitoring. The\
    \ metrics agent will\nbe automatically installed and enabled during the Droplet creation process.\nUsing the API or CLI\n\
    If you are using the DigitalOcean API to create Droplets, set the monitoring attribute to\ntrue in the creation parameters\
    \ to automatically install the metrics agent on the Droplet\nduring creation. The Droplet creation section of the API\
    \ documentation contains\nadditional details.\n{\n \"name\": \"example.com\",\n \"region\": \"nyc3\",\n \"size\": \"s-1vcpu-1gb\"\
    ,\n \"image\": \"ubuntu-20-04-x64\",\n \"ssh_keys\": [\n 289794,\n \"3b:16:e4:bf:8b:00:8b:b8:59:8c:a9:d3:f0:19:fa:45\"\
    \n ],\n \"backups\": true,\n \"ipv6\": true,\n \"monitoring\": true,\n \"tags\": [\n \"env:prod\",\n \"web\"\n ],\n \"\
    user_data\": \"#cloud-config\\nruncmd:\\n - touch /test.txt\\n\",\n \"vpc_uuid\": \"760e09ef-dc84-11e8-981e-3cfdfeaae000\"\
    \n}\nIf you are using doctl, the DigitalOcean command line client, to create Droplets with\nthe doctl compute droplet\
    \ create command, use the –enable-monitoring flag to\nenable monitoring.\nInstalling the Metrics Manually\nYou can also\
    \ install the metrics agent manually on supported operating systems and\nversions. There is an installation script available\
    \ that automatically detects the client\noperating system and configures repositories to install the agent.\nPlease refer\
    \ to the How to Install the DigitalOcean Metric Agent guide for instructions.\nSet up Resource Alerts\nSet up resource\
    \ alerts after installing the metrics agent to track the operational health of\nyour infrastructure."
  checks:
  - type: manual_review
    info: 'Follow these steps to ensure monitoring is activated:

      1. Sign in to your DigitalOcean account.

      2. Select Droplets under the Manage menu.

      3. Click on the name of the Droplet.

      The security monitoring page will display graphs of CPU percentages, memory

      use, disk input/output, and other metrics.'
    severity: medium
- id: '5.1'
  title: Ensure Access Control to Spaces are Set
  scoring: manual
  profile:
  - Level 2
  description: 'Spaces owners can create, destroy, and read all content in all the Spaces buckets for an account. They also
    make decisions and manage what everyone else can see. If an owner wants to allow one or more people to co-manage buckets,
    there are two options: Access Keys and DigitalOcean Teams. Access Keys Users who connect with access keys can create,
    destroy, read, and write to all of the buckets for the account. However, the privileges granted by Spaces access keys
    do not provide access to the control panel and do not extend to other DigitalOcean resources. DigitalOcean Teams Teams
    allow members to use the control panel, including creating, managing, and destroying buckets associated with the Team
    account.Team members can also create, delete, and regenerate access keys for buckets. Unlike Spaces access keys, members
    of a Team can also access other Team resources like Droplets, Firewalls, and more.'
  rationale: 'Managing access to your DigitalOcean Spaces Object Storage is important for: -Data Security: Unauthorized access
    can lead to data breaches, exposure of sensitive information, and potential manipulation or deletion of critical data.
    -Compliance Regulations: Many organizations are subject to regulations such as GDPR, HIPAA, or PCI-DSS, which require
    strict data protection controls and protocols. -Insider Threat Protection: Insider threats, either malicious or accidental,
    can be as dangerous as external attacks. Properly managing access helps mitigate the risks posed by insiders by ensuring
    that individuals only have access to the data and resources necessary for their job functions.'
  impact: Misconfigured permissions can either expose sensitive data or lock users out of the data they need to perform their
    jobs. Frequent changes in team structures or project scopes can exacerbate these risks as updates to access controls may
    not keep pace.
  references:
  - 1. https://docs.digitalocean.com/products/spaces/how-to/manage-access/
  page_start: 82
  audit_raw: '1. Sign into your DigitalOcean account.

    2. Navigate to the Spaces Object Storage page.

    3. Select the Access Keys tab.

    4. Review the relationships between key permissions and buckets.

    5. Review our "How to Manage Administrative Access to Spaces" guide to learn

    more.'
  remediation: '1. Sign into your DigitalOcean account.

    2. Navigate to the Spaces Object Storage page.

    3. Select the Access Keys tab.

    4. Review the relationships between key permissions and buckets.

    5. If changes are necessary, review our How to Manage Administrative Access to

    Spaces guide to learn more.'
  checks:
  - type: manual_review
    info: '1. Sign into your DigitalOcean account.

      2. Navigate to the Spaces Object Storage page.

      3. Select the Access Keys tab.

      4. Review the relationships between key permissions and buckets.

      5. Review our "How to Manage Administrative Access to Spaces" guide to learn

      more.'
    severity: medium
- id: '5.2'
  title: Ensure Access and Secret Keys are Created
  scoring: manual
  profile:
  - Level 2
  description: 'DigitalOcean Spaces Object Storage uses access and secret keys to control and manage access to data. Access
    and secret keys are used for authentication and authorization when accessing the Spaces service. The access key is a public
    identifier for your account. It is used to identify the user making the request to a Spaces bucket. The secret key is
    a private key associated with your access key. It should be kept confidential and secure. This key is used in conjunction
    with the access key to sign requests to the Spaces API, ensuring that the request is authorized. There are two scope options
    for access keys: • Limited, which grants access to specific buckets with read or read/write/delete permissions. • Full
    Access, which grants unrestricted access to all supported S3 APIs, including bucket creation and configuration (lifecycle,
    bucket policies, versioning, CORS, and website), and listing all buckets.'
  rationale: 'Creating access and secret keys is important for the following reasons: • Security: Access and secret keys allow
    you to securely access your DigitalOcean Spaces. They function similarly to a username and password, ensuring that only
    authorized users and applications can access your data. • Authentication: Access and secret keys are used to authenticate
    your requests to the Spaces API. Without proper authentication, your requests will be denied, preventing unauthorized
    access.'
  impact: While creating access and secret keys are considered a best Security practice, there are considerations to remain
    abreast of. For instance, if access keys are hard-coded into applications or stored insecurely, they can be exposed through
    source code repositories, configuration files, or logs, which increases the risk of unauthorized access. In addition,
    rotating or revoking keys without proper planning can lead to service disruptions. Furthermore, applications or users
    relying on the old keys might lose access until updated keys are deployed.
  references:
  - 1. https://docs.digitalocean.com/products/spaces/reference/s3-compatibility/
  - 2. https://docs.digitalocean.com/products/spaces/how-to/manage-access/
  page_start: 84
  audit_raw: '1. Sign in to your DigitalOcean account.

    2. Navigate to the Spaces Access Key page.

    3. Review Access Key permissions relative to their affiliated buckets and

    Read/Write/Delete capabilities.

    4. If augmentations are necessary, follow the steps outlined in the Description or

    in the Remediation Procedure.'
  remediation: 'Create Spaces Access Key

    1. Sign in to your DigitalOcean account.

    2. Navigate to the Spaces Object Storage page.

    3. Select the Access Keys tab.

    4. If necessary, select Create Access Key to open the New Spaces Access Key

    window.

    5. Select the key’s access scope:

    a. Full access: Allows all S3 API commands on all buckets

    b. Limited access: Permits more specific Read or Read/Write/Delete permissions

    for each bucket.

    6. If limited access was selected, check the boxes for the buckets the key should

    have access to. For each bucket, use the drop down menu to designate Read or

    Read/Write/Delete permissions.

    7. Name the key and click Create Access Key.

    8. Immediately copy the Secret Key to a secure location as it will not be shown

    again.

    Edit Limited Access Spaces Key Permissions

    1. Sign in to your DigitalOcean account.

    2. Navigate to the Spaces Access Keys page.

    3. Locate the key and select More (…).

    4. Select Edit Permissions to open the Edit Permissions window.

    5. Select the boxes for the buckets they key should have access to.

    6. If necessary, change the permissions level via the provided dropdown.

    For more information on creating and managing access to Access Keys, please visit our

    How to Manage Access Keys documentation.'
  checks:
  - type: manual_review
    info: '1. Sign in to your DigitalOcean account.

      2. Navigate to the Spaces Access Key page.

      3. Review Access Key permissions relative to their affiliated buckets and

      Read/Write/Delete capabilities.

      4. If augmentations are necessary, follow the steps outlined in the Description or

      in the Remediation Procedure.'
    severity: medium
- id: '5.3'
  title: Ensure Spaces Bucket Lifecycle Policy is Set
  scoring: scored
  profile:
  - Level 1
  description: A lifecycle configuration rule is a policy or rule set to manage the lifecycle of objects in a storage bucket.
    These rules automate the process of transitioning objects through different storage classes or deleting them after they
    are no longer needed. The objective is to optimize costs and manage data efficiently without manual intervention. There
    are several cross-platform command-line tools available to tools for managing S3 and S3-compatible stores, but this example
    offers guidance on s3cmd. For more information on S3, including local installation instructions, refer to DigitalOcean’s
    Setting Up s3cmd 2.x with DigitalOcean Spaces reference.
  rationale: 'Creating a lifecycle configuration rule is important for the following reasons: • Data management: Lifecycle
    rules automate the management process, ensuring that data is handled systematically according to predefined policies.
    This reduces the likelihood of human error and the administrative burden associated with manual data management. • Risk
    Mitigation: Proper data lifecycle management helps in mitigating risks associated with data breaches. By ensuring that
    data is only stored as long as necessary, lifecycle rules reduce the volume of sensitive data at risk. • Compliance: Many
    industries are governed by regulations that require data to be retained for certain periods and deleted thereafter. Lifecycle
    rules help ensure compliance with such regulations automatically, reducing the risk of costly legal or regulatory penalties.'
  impact: A significant risk associated with lifecycle configuration rules is unintended data loss. For example, if the expiration
    period is set too short, data might be deleted before its utility has expired. Another potential risk is not aligning
    lifecycle rules with compliance and security policies as that presents the risk of violating legal or regulatory requirements.
    A lifecycle rule that deletes a large amount of objects can take hours or days to finish running. During this process,
    you are still billed for any objects that have not been deleted yet. To delete objects faster, use the S3 DeleteObject
    or DeleteObjects commands.
  references:
  - 1. https://docs.digitalocean.com/products/spaces/reference/s3cmd/
  - 2. https://docs.digitalocean.com/products/spaces/reference/s3-compatibility/
  page_start: 87
  audit_raw: '1. List your Spaces.

    s3cmd ls

    2. Get the lifecycle policy for your selected Space.

    s3cmd getlifecycle s3://selected-space

    3. If no lifecycle configurations exist, the following message will be displayed

    ERROR: S3 error: 404 (NoSuchLifecycleConfiguration)'
  remediation: 'Lifecycle rules can be used to perform different actions on objects in a Spaces bucket

    over the course of their “life.” For example, a Spaces bucket may be configured so that

    objects in it expire and are automatically deleted after a certain length of time. Lifecycle

    rules based on tagging are not supported.

    Before creating lifecycle rules, set up s3cmd 2.x with DigitalOcean Spaces.

    Follow these steps after setting up s3cmd:

    Set an Expiration Rule

    To automatically delete objects after a set number of days, run the following command,

    substituting <your-space-name> with the name of your Spaces bucket:

    s3cmd expire --expiry-days=30 --expiry-prefix= s3://<your-space-name>

    In this command, the lifecycle rule rule expires all objects in your specified Space 30

    days after their creation.

    Remove Incomplete Multipart Uploads

    To automatically remove incomplete multipart uploads after a set number of days, run

    the following command, substituting <your-space-name> with the name of your Spaces

    bucket:

    s3cmd expire --expiry-mpu-days=1 s3://your-space-name

    This command prevents abandoned multipart uploads from consuming storage

    unnecessarily after 1 day.

    For more details, see the s3cmd documentation.'
  checks:
  - type: manual_review
    info: '1. List your Spaces.

      s3cmd ls

      2. Get the lifecycle policy for your selected Space.

      s3cmd getlifecycle s3://selected-space

      3. If no lifecycle configurations exist, the following message will be displayed

      ERROR: S3 error: 404 (NoSuchLifecycleConfiguration)'
    severity: medium
- id: '5.4'
  title: Ensure File Listing Permissions are Set
  scoring: manual
  profile:
  - Level 1
  description: 'A Spaces bucket’s file listing is a list of the bucket’s contents in XML. It displays the names (called keys)
    of every file in the bucket as well as other file information, like the file sizes and last modified dates. Owners of
    a bucket set the visibility permissions of this file listing, which can be: • Public: Anyone on the internet can view
    the listing by visiting the base URL of the bucket, even if the contents of individual files are set to Private. • Private:
    Only users who connect to the bucket using access keys can see the contents. You can set the visibility of the file listing
    when creating a bucket. On existing buckets, you can view and edit the permissions on the bucket’s Settings tab. The bucket’s
    Settings tab can be found by selecting the individual bucket from the Spaces Access Keys landing page.'
  rationale: 'Setting the file listing permission is important for several reasons, including: • Preventing Unauthorized Access:
    Public file listings can give attackers insight into the structure and contents of your storage. If they can see files
    that should remain private, they might attempt to access them. Properly setting file listing permissions can help reduce
    this risk. • Resource Control: Public file listings can lead to unnecessary or unintended traffic, as users or bots may
    try to access files they don’t need. By restricting file listing access, you have more control over who can access your
    resources, helping to reduce unnecessary bandwidth usage and avoid overloading your systems with irrelevant requests.'
  impact: Setting the file listing to Public exposes individual files you may want to keep private. To keep files private,
    store them in a private bucket. Setting the file listing to Private requires careful access policy design and ongoing
    management.
  references:
  - 1. https://docs.digitalocean.com/products/spaces/how-to/create/
  - 2. https://cloud.digitalocean.com/spaces/access_keys?i=0b04d4
  page_start: 90
  audit_raw: '1. From the control panel, select Spaces Object Storage.

    2. Navigate to the bucket’s detail page by clicking the name of the bucket.

    3. Click the Settings tab.

    4. Locate the listing permission in the File Listing row.'
  remediation: "You can set the visibility of the list of contents when creating a bucket. On existing\nbuckets, you can view\
    \ and edit it on the bucket’s Settings tab, in the File Listing\nsection.\nThe Spaces file listing looks similar to this:\n\
    <ListBucketResult xmlns=\"http://s3.amazonaws.com/doc/2006-03-01/\">\n <Name>permissions</Name>\n <Prefix/>\n <Marker/>\n\
    \ <MaxKeys>1000</MaxKeys>\n <IsTruncated>false</IsTruncated>\n <Contents>\n <Key>example-file.txt</Key>\n <LastModified>2017-09-17T19:20:21.360Z</LastModified>\n\
    \ <ETag>\"39365ac292b6471ef008d1099bf99963\"</ETag>\n <Size>42</Size>\n <StorageClass>STANDARD</StorageClass>\n <Owner>\n\
    \ <ID>2900818</ID>\n <DisplayName>2900818</DisplayName>\n </Owner>\n </Contents>\n <Contents>\n <Key>image.png</Key>\n\
    \ <LastModified>2017-09-17T23:19:53.222Z</LastModified>\n <ETag>\"00d3c043c2e54e99712d6e526932bb76\"</ETag>\n <Size>95607</Size>\n\
    \ <StorageClass>STANDARD</StorageClass>\n <Owner>\n <ID>2900818</ID>\n <DisplayName>2900818</DisplayName>\n </Owner>\n\
    \ </Contents>\n </ListBucketResult>"
  checks:
  - type: manual_review
    info: '1. From the control panel, select Spaces Object Storage.

      2. Navigate to the bucket’s detail page by clicking the name of the bucket.

      3. Click the Settings tab.

      4. Locate the listing permission in the File Listing row.'
    severity: medium
- id: '5.5'
  title: Ensure Spaces CDN is Enabled
  scoring: manual
  profile:
  - Level 2
  description: Spaces provides a built-in content delivery network (CDN), which is a network of edge servers that deliver
    content to users. Each point of presence (PoP), the location of a group of edge servers, sends content to the users that
    are physically closest to it. CDNs help deliver static and dynamic online content faster and more reliably, and provides
    a layer of redundancy for websites.
  rationale: 'Enabling the Spaces CDN is important for several reasons, including: • DDoS Protection: CDNs help protect against
    distributed denial-of-service (DDoS) attacks by mitigating malicious traffic over a network. • Built-in Bot Management:
    CDNs can block malicious bots to prevent scraping and spam attacks, among other threats. • Improved Performance and Speed:
    The CDN caches your content in multiple locations, reducing the distance between your users and the server hosting your
    data. This results in faster load times for your content. • Reliability and Redundancy: The CDN provides redundancy and
    fault tolerance by distributing your content across multiple servers. If one server or data center fails, traffic is automatically
    rerouted to another, ensuring your content remains accessible without downtime.'
  impact: We do not recommend or support using multiple CDNs from separate vendors with your Spaces buckets (such as the Spaces
    built-in CDN and another vendor’s CDN), as it can cause performance issues and be complex to manage.
  references:
  - 1. https://cloud.digitalocean.com/spaces/new
  - 2. https://docs.digitalocean.com/products/spaces/how-to/customize-cdn-endpoint/
  page_start: 93
  audit_raw: '1. From the control panel, select Spaces Object Storage.

    2. Navigate to the bucket’s detail page by clicking the name of the bucket.

    3. Click the Settings tab.

    4. Locate the CDN’s classification in the CDN (Content Delivery Network)

    section.

    5. If Disabled, follow the steps in the Description to Enable the CDN.'
  remediation: 'Enable the CDN during Bucket Creation

    The Spaces CDN can be enabled during bucket creation by identifying the CDN

    (Content Delivery Network) section on the Spaces create page.

    Click Enable CDN. An Edge Cache TTL drop-down menu will appear. This setting

    determines the amount of time that the content is cached. You can keep the default of 1

    hour or choose another value. You can also customize the CDN endpoint with a secure

    subdomain you own.

    Finish choosing the rest of the settings for the bucket, then click Create a Space.

    Once the bucket is created, you can modify the edge cache TTL setting and custom

    subdomain at any time on the bucket’s Settings page.

    Enable the CDN for an Existing Bucket

    1. The Spaces CDN can be enabled for an existing bucket. From the Control

    Panel, navigate to the bucket’s detail page by selecting Spaces Object

    Storage and subsequently, selecting the name of the bucket.

    2. Click the Settings tab. The text in the CDN (Content Delivery Network) section

    will tell you if the CDN is currently Enabled or Disabled for the bucket.

    3. To enable the CDN, in the same CDN (Content Delivery Network) section, click

    Edit.

    4. In the options that open, click Enable CDN. When you do, several options for the

    CDN will appear. You can customize the CDN endpoint with a secure subdomain

    you own using the Use a custom subdomain menu. The Edge Cache TTL

    determines the amount of time that the content is cached. You can keep the

    default of 1 hour or choose another value.

    5. When you’re done choosing options, click Save. Once the CDN is enabled, you

    can return to this page to modify the edge cache TTL setting and custom

    subdomain.'
  checks:
  - type: manual_review
    info: '1. From the control panel, select Spaces Object Storage.

      2. Navigate to the bucket’s detail page by clicking the name of the bucket.

      3. Click the Settings tab.

      4. Locate the CDN’s classification in the CDN (Content Delivery Network)

      section.

      5. If Disabled, follow the steps in the Description to Enable the CDN.'
    severity: medium
- id: '5.6'
  title: Ensure CORS is Enabled
  scoring: manual
  profile:
  - Level 2
  description: Client web applications loaded in one domain can interact with resources in a Spaces bucket with Cross-Origin
    Resource Sharing (CORS) configured.
  rationale: 'Configuring CORS for a Spaces bucket is important for several reasons, including: • Improved Content Delivery:
    If your web app needs to serve static assets from a Spaces bucket, CORS enables these assets to be used in your application
    even when they reside in different origins. It helps in delivering these assets efficiently across different domains without
    encountering browser restrictions. • Access Control: With CORS, you can set specific policies on which domains are allowed
    to interact with your Spaces bucket, which HTTP methods are allowed, and which headers can be used. This provides control
    over who can access your data and under what conditions, helping you maintain security while enabling cross-origin resource
    sharing.'
  impact: Overly permissive CORS can expose your data to unauthorized applications.
  references:
  - 1. https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS
  - 2. https://cloud.digitalocean.com/
  page_start: 95
  audit_raw: '1. From the control panel, select Spaces Object Storage.

    2. Navigate to the bucket’s detail page by clicking the name of the bucket.

    3. Click the Settings tab.

    4. Locate the applicable configurations within the CORS Configurations section.'
  remediation: "1. From the control panel, navigating to the designated bucket’s Settings page.\n2. In the CORS Configuration\
    \ row, click Add.\nThis opens the Advanced CORS Options window.\nWithin the Advanced CORS Options window, the following\
    \ can be completed:\n• Origin: Specifies the complete domain of the client you want to access your\nbucket’s resources.\
    \ The domain should start with a protocol identifier, such as\nhttp, end with a hostname or hostname and port, and optionally\
    \ include a\nwildcard character () at the start of the hostname. For example,\n**https://.example.com**. All other settings\
    \ are only applied to requests from this\nOrigin.\n• Allowed Methods: Determines which API methods can interact with your\
    \ bucket.\nYou can allow or prohibit the following methods:\n• GET: Downloads a resource.\n• PUT: Updates a resource’s\
    \ properties or information.\n• DELETE: Deletes a resource.\n• POST: Creates a new resource.\n• HEAD: Retrieves a resource’s\
    \ metadata, such as its file size.\n• Allowed Headers: Determines which non-default headers are accepted in your\nbucket.\
    \ To verify that an incoming HTTP request abides by your CORS settings,\nyour bucket checks the request’s list of headers.\
    \ Each header describes a\nproperty of the request. For example, Content-Length and Content-Type are\nsome of the default\
    \ headers that CORS automatically accepts. However, if your\nclient sends any non-default headers, you must first add\
    \ them in your CORS\nconfiguration.\n• Access Control Max Age: Determines how long a request’s verification is\ncached,\
    \ in seconds. While verification is cached, the bucket can accept more\nrequests from the same origin without needing\
    \ to be verified, which improves\nperformance. The recommended value is 5 seconds. Lower values may be\nuseful during\
    \ development, and higher values may be useful if a single browser\nis issuing many requests at once. Some browsers may\
    \ also limit this value to as\nhigh as 10 minutes.\nCORS configurations unavailable via the control panel, such as ExposeHeaders,\
    \ can be\nimplemented by uploading a configuration XML file via s3cmd. Please visit this tutorial\nfor more information\
    \ about setting up s3cmd.\nFor example, the following XML file sets ExposeHeaders to ETag, alongside other\nconfiguration\
    \ options:\n <CORSConfiguration xmlns=\"http://s3.amazonaws.com/doc/2006-03-01/\">\n <CORSRule>\n <AllowedOrigin>*</AllowedOrigin>\n\
    \ <AllowedMethod>POST</AllowedMethod>\n <AllowedMethod>PUT</AllowedMethod>\n <AllowedMethod>DELETE</AllowedMethod>\n <MaxAgeSeconds>3000</MaxAgeSeconds>\n\
    \ <ExposeHeader>ETag</ExposeHeader>\n <AllowedHeader>*</AllowedHeader>\n </CORSRule>\n </CORSConfiguration>\nYou can then\
    \ upload an XML configuration file to your bucket with the following s3cmd\ncommand:\ns3cmd setcors /path/to/config.xml\
    \ s3://BUCKET_NAME"
  checks:
  - type: manual_review
    info: '1. From the control panel, select Spaces Object Storage.

      2. Navigate to the bucket’s detail page by clicking the name of the bucket.

      3. Click the Settings tab.

      4. Locate the applicable configurations within the CORS Configurations section.'
    severity: medium
- id: '5.7'
  title: Ensure Unneeded Spaces Bucket are Destroyed
  scoring: manual
  profile:
  - Level 2
  description: Destroying a Spaces bucket permanently and irrecoverably destroys the bucket and all of its objects. When you
    confirm the destruction of your last bucket, your Spaces subscription ends automatically and you are no longer charged.
  rationale: 'Destroying a Spaces bucket is important for several reasons, including: • Data leak prevention: Deleting buckets
    that are no longer needed ensures that old or sensitive data is not accidentally exposed or accessed by unauthorized parties.
    • Cost control: Spaces buckets incur storage costs, so destroying unused buckets can help minimize expenses. Your Spaces
    subscription automatically ends when you destroy all your buckets.'
  impact: In the event buckets targeted for destruction no longer need to be destroyed, not cancelling bucket destruction
    before its destruction time leads to permanent data loss.
  references:
  - 1. https://cloud.digitalocean.com/spaces
  - 2. https://cloud.digitalocean.com/
  page_start: 98
  audit_raw: '1. From the control panel, select Spaces Object Storage.

    2. Locate the bucket which has been targeted for deletion.

    3. Confirm the designated bucket is greyed out, which means the bucket is pending

    destruction and the Overview page and More menu are not viewable.'
  remediation: 'Destroying a Spaces bucket permanently and irrecoverably destroys the bucket and all

    of its objects. When you confirm the destruction of your last bucket, your Spaces

    subscription ends automatically and you are no longer charged.

    1. To destroy a bucket, click its name on the Spaces page to go to its detail page,

    then click the Settings tab.

    2. In the Destroy this Space section, click Destroy to open the Destroy Space

    configuration window. Enter the name of the bucket and click Destroy to confirm.

    When you confirm the destruction, the bucket goes into a pending destruction stage.

    The bucket remains listed in the control panel with an estimated time of destruction, and

    it is greyed out so you can’t view its overview page or open its More menu.

    The bucket’s scheduled destruction time is 2 weeks or more, depending on the size of

    the bucket. While a bucket is pending destruction, you cannot use it, it no longer counts

    towards your billing charges, and you cannot reuse its name.

    To cancel the destruction and regain access to your bucket, click Cancel Deletion

    before the scheduled deletion time.'
  checks:
  - type: manual_review
    info: '1. From the control panel, select Spaces Object Storage.

      2. Locate the bucket which has been targeted for deletion.

      3. Confirm the designated bucket is greyed out, which means the bucket is pending

      destruction and the Overview page and More menu are not viewable.'
    severity: medium
- id: '6.1'
  title: Ensure Drive is Encrypted with LUKS on Top of Volume
  scoring: manual
  profile:
  - Level 2
  description: DigitalOcean Volumes are scalable, SSD-based block storage devices. Volumes allow you to create and expand
    your infrastructure’s storage capacity without needing to resize your Droplets. Volumes are encrypted at rest, which means
    that the data on a Volume is not readable outside of its storage cluster. When you attach a Volume to a Droplet, the Droplet
    is presented with a decrypted block storage device and all data is transmitted over isolated networks. For additional
    security, you can also create a file system in a LUKS (Linux Unified Key Setup) encrypted disk on your Volume. This means
    that the disk will need to be decrypted by the operating system on your Droplet in order to read any data.
  rationale: 'Encrypting the file system of your Volume Block Storage is important for several reasons: • Data Protection:
    Encryption ensures that data is protected from unauthorized access, both during storage and transit. • Security Compliance:
    It helps meet regulatory and compliance requirements that mandate data encryption. • Mitigation of Data Breaches: In the
    event of a security breach, encrypted data remains inaccessible without the encryption keys. • Confidentiality: Sensitive
    information remains confidential, ensuring privacy and trust.'
  impact: 'This process is destructive to any data on the Volume. Be sure to either start with a new Volume or back up your
    data before reformatting an existing Volume. Encryption and decryption processes can introduce latency, impacting read/write
    speeds and overall system performance. Good practices for preventing data loss are: • Always back up your data before
    encrypting or modifying any partition. • If you’re new to encryption, test on a non-critical partition or virtual disk
    first. • Double-check commands before executing them to avoid accidental data loss.-'
  references:
  - 1. https://en.wikipedia.org/wiki/XFS
  - 2. https://www.digitalocean.com/community/tutorials/how-to-partition-and-formatdigitalocean-block-storage-volumes-in-linux#mounting-the-filesystems
  page_start: 101
  audit_raw: 'Use the following script to check if the disk is encrypted:

    cryptsetup status secure-volume

    Expected output for an inactive device will look similar to this:

    /dev/mapper/secure-volume is inactive

    Expected output for an active device will look similar to this:

    /dev/mapper/secure-volume is active and is in use.

    type: LUKS2

    cipher: aes-xts-plain64

    keysize: 512 bits

    key location: keyring

    device: /dev/sda

    sector size: 512

    offset: 32768 sectors

    size: 209682432 sectors

    mode: read/write'
  remediation: "Install Cryptsetup\ncryptsetup is a utility used to manage LUKS volumes in addition to other encrypted\nformats.\n\
    Debian/Ubuntu\nsudo apt-get install cryptsetup\nsudo apt install cryptsetup\nCentOS\nsudo yum install cryptsetup\nFedora\n\
    sudo dnf install cryptsetup\nCreating the Encrypted Disk\n1. Use cryptsetup to initialize an encrypted disk on your Volume.\n\
    sudo cryptsetup -y -v luksFormat /dev/disk/by-id/scsi-0DO_Volume_<volumelon1-01>\nMake sure to replace volume-lon1-01\
    \ with the name of your Volume. The -y flag will\nrequire you to enter your passphrase twice when you’re prompted to create\
    \ it. The -v\nflag adds additional human-readable output to verify the success of the command.\nThe output will ask you\
    \ to confirm overwriting the data on the Volume. Type YES in all\ncaps, then press ENTER to continue.\nWARNING!\n========\n\
    This will overwrite data on /dev/disk/by-id/scsi-0DO_Volume_volume-lon1-01\nirrevocably.\nAre you sure? (Type uppercase\
    \ yes): YES\n2. Next, the output will prompt you to create a passphrase for the encrypted disk.\nEnter a unique, strong\
    \ passphrase and verify it by entering it a second time. This\npassphrase is not recoverable, so keep it recorded in a\
    \ safe place.\n. . .\nEnter passphrase:\nVerify passphrase:\nCommand successful.\nIf you need to, you can change this\
    \ passphrase in the future with the cryptsetup\nluksChangeKey command. You can also add up to 8 additional passphrases\
    \ per device\nwith cryptsetup luksAddKey.\n3. At this point, your disk is created and encrypted. Next, decrypt it and\
    \ map it to a\nlabel for easier referencing. Here, we’re labeling it name-of-volume, but you can\nlabel it with anything\
    \ you like.\nsudo cryptsetup luksOpen /dev/disk/by-id/scsi-0DO_Volume_volume-lon1-01 nameof-volume\nYou’ll be prompted\
    \ for the passphrase. Once you enter it, the Volume will now be\nmapped to /dev/mapper/name-of-volume.\n4. To make sure\
    \ everything worked, verify the details of the encrypted disk.\ncryptsetup status name-of-volume\nYou’ll see output like\
    \ this indicating the Volume label and type:\n/dev/mapper/name-of-volume is active.\n type: LUKS1\n cipher: aes-xts-plain64\n\
    \ keysize: 256 bits\n device: /dev/sda\n offset: 4096 sectors\n size: 209711104 sectors\n mode: read/write\nAt this point,\
    \ you have a passphrase-protected encrypted disk. The next step is to\ncreate a file system on that disk so the operating\
    \ system can use it to store files.\nCreating and Mounting the File System\n1. Look at the current available disk space\
    \ on the Droplet.\ndf -h\nYou’ll see output similar to this, depending on your Droplet configuration:\nFilesystem Size\
    \ Used Avail Use% Mounted on\nudev 2.0G 0 2.0G 0% /dev\ntmpfs 396M 5.6M 390M 2% /run\n/dev/vda1 78G 877M 77G 2% /\ntmpfs\
    \ 2.0G 0 2.0G 0% /dev/shm\ntmpfs 5.0M 0 5.0M 0% /run/lock\ntmpfs 2.0G 0 2.0G 0% /sys/fs/cgroup\n/dev/vda15 105M 3.4M 101M\
    \ 4% /boot/efi\ntmpfs 396M 0 396M 0% /run/user/1000\nAt this point, /dev/mapper/name-of-volume doesn’t show up on this\
    \ list because the\nVolume isn’t yet accessible to the Droplet. To make it accessible, you need to create\nand mount the\
    \ file system.\n2. Use the mkfs.xfs utility (make file system) to create an XFS file system on the\nvolume.\nsudo mkfs.xfs\
    \ /dev/mapper/name-of-volume\nOnce the file system is created, you can mount it, which means making it available to\n\
    the operating system on your Droplet.\n3. Create a mount point, which is where the file system will be attached. A good\n\
    recommendation for a mount point is an empty directory in the /mnt directory, so\nwe’ll use /mnt/secure.\nsudo mkdir /mnt/secure\n\
    4. Mount the file system.\nsudo mount /dev/mapper/name-of-volume /mnt/secure\n5. To make sure it worked, check the available\
    \ disk space on your Droplet again:\ndf -h\n6. You’ll now see /dev/mapper/name-of-volume listed.\nOutput\nFilesystem Size\
    \ Used Avail Use% Mounted on\nudev 2.0G 0 2.0G 0% /dev\ntmpfs 396M 5.6M 390M 2% /run\n/dev/vda1 78G 877M 77G 2% /\ntmpfs\
    \ 2.0G 0 2.0G 0% /dev/shm\ntmpfs 5.0M 0 5.0M 0% /run/lock\ntmpfs 2.0G 0 2.0G 0% /sys/fs/cgroup\n/dev/vda15 105M 3.4M 101M\
    \ 4% /boot/efi\ntmpfs 396M 0 396M 0% /run/user/1000\n/dev/mapper/name-of-volume 100G 33M 100G 1% /mnt/secure\nThis means\
    \ your encrypted file system is attached and available for use.\nWhen you no longer need to access the data on the Volume,\
    \ you can unmount the file\nsystem and lock the encrypted disk.\nYou can verify with df -h that the file system is no\
    \ longer available. In order to make\nthe data on the Volume accessible again, you would run through the steps to open\
    \ the\ndisk (cryptsetup luksOpen ...), create a mount point, and mount the file system.\nTo avoid going through this manual\
    \ process every time you want use the Volume, you\ncan instead configure the file system to mount automatically when your\
    \ Droplet boots.\nAutomatically Mounting the File System on Boot\nThe encrypted disk can have up to 8 passphrases. In\
    \ this final step, we’ll create a key\nand add it as a passphrase, then use that key to configure the Volume to be decrypted\n\
    and mounted as the Droplet is booting.\n1. Create a key file at /root/.secure_key. This command will make a 4 KB file\n\
    with random contents:\nsudo dd if=/dev/urandom of=/root/.secure-key bs=1024 count=4\n2. Adjust the permissions of this\
    \ key file so it’s only readable by the root user.\nsudo chmod 0400 /root/.secure-key\n3. Add the key as a passphrase\
    \ for the encrypted disk.\ncryptsetup luksAddKey /dev/disk/by-id/scsi-0DO_Volume_volume-lon1-01\n/root/.secure-key\nYou’ll\
    \ be prompted for a passphrase. You can enter the one you set when you first\ncreated the encrypted disk.\n4. /etc/crypttab\
    \ is a configuration file that defines encrypted disks to set up when\nthe system starts. Open this file with nano or\
    \ your favorite text editor.\nsudo nano /etc/crypttab\n5. Add the following line to the bottom of the file to map the\
    \ Volume at boot:\nname-of-volume /dev/disk/by-id/scsi-0DO_Volume_volume-lon1-01 /root/.securekey luks\nThe format of\
    \ the lines in /etc/crypttab is device_name device_path key_path\noptions. Here, the device name is name-of-volume (or\
    \ the name you chose instead),\nthe path is /dev/disk/by-id/..., the key file is what we just created at\n/root/.secure_key,\
    \ and the options specify luks encryption.\n6. Save and close the file.\n7. /etc/fstab is a configuration file to automate\
    \ mounting. Open this file for\nediting.\nsudo nano /etc/fstab\n8. Add the following line to the bottom of the file to\
    \ automatically mount the disk at\nboot:\n/dev/mapper/name-of-volume /mnt/secure xfs defaults,nofail 0 0\nThe first three\
    \ arguments of the lines in /etc/fstab are always device_path\nmount_point file_system_type. Here, we have the same device\
    \ path and mount\npoint as in Step 2, and we specify the XFS file system. You can read about the other\nfields in fstab’s\
    \ man page (man fstab).\n9. Save and close the file. Your encrypted file system is now set to automatically\nmount when\
    \ your Droplet boots. You can test this by rebooting your Droplet, but\nbe cautious with any running services."
  checks:
  - type: manual_review
    info: 'Use the following script to check if the disk is encrypted:

      cryptsetup status secure-volume

      Expected output for an inactive device will look similar to this:

      /dev/mapper/secure-volume is inactive

      Expected output for an active device will look similar to this:

      /dev/mapper/secure-volume is active and is in use.

      type: LUKS2

      cipher: aes-xts-plain64

      keysize: 512 bits

      key location: keyring

      device: /dev/sda

      sector size: 512

      offset: 32768 sectors

      size: 209682432 sectors

      mode: read/write'
    severity: medium
