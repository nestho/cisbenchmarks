  description: 'The Cisco switch must enable Unidirectional Link Detection (UDLD) to protect against one-way connections.
    GROUP ID: V-220665 RULE ID: SV-220665r539671'
  rationale: In topologies where fiber optic interconnections are used, physical misconnections can occur that allow a link
    to appear to be up when there is a mismatched set of transmit/receive pairs. When such a physical misconfiguration occurs,
    protocols such as STP can cause network instability. UDLD is a layer 2 protocol that can detect these physical misconfigurations
    by verifying that traffic is flowing bidirectional between neighbors. Ports with UDLD enabled periodically transmit packets
    to neighbor devices. If the packets are not echoed back within a specific time frame, the link is flagged as unidirectional
    and the interface is shut down.
  impact: ''
  references: []
  page_start: 40
  audit_raw: "If any of the switch ports have fiber optic interconnections with neighbors, review the\nswitch configuration\
    \ to verify that UDLD is enabled globally or on a per-interface basis\nas shown in the examples below:\nhostname SW2\n\
    …\n…\n…\nudld enable\nor\ninterface GigabitEthernet0/1\n udld port\nNote: An alternative implementation when UDLD is not\
    \ supported by connected device\nis to deploy a single member Link Aggregation Group (LAG) via IEEE 802.3ad Link\nAggregation\
    \ Control Protocol (LACP).\nIf the switch has fiber optic interconnections with neighbors and UDLD is not enabled,\nthis\
    \ is a finding."
  remediation: 'Configure the switch to enable Unidirectional Link Detection (UDLD) to protect against

    one-way connections.

    SW2(config)#udld enable

    or

    SW2(config)#int g0/1

    SW2(config-if)#udld port'
  checks:
  - type: manual_review
    info: "If any of the switch ports have fiber optic interconnections with neighbors, review the\nswitch configuration to\
      \ verify that UDLD is enabled globally or on a per-interface basis\nas shown in the examples below:\nhostname SW2\n\
      …\n…\n…\nudld enable\nor\ninterface GigabitEthernet0/1\n udld port\nNote: An alternative implementation when UDLD is\
