    \ vlan 11\n negotiation auto\n!\ninterface GigabitEthernet0/3\n switchport access vlan 12\n negotiation auto\n!\nIf any\
    \ access switch ports have been assigned to the same VLAN ID as the native\nVLAN, this is a finding."
  remediation: Configure all access switch ports to a VLAN other than the native VLAN.
