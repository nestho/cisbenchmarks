- id: '1.1'
  title: CISC-L2-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco switch must uniquely identify and authenticate all network-connected endpoint devices before establishing
    any connection. GROUP ID: V-220649 RULE ID: SV-220649r863283'
  rationale: Controlling LAN access via 802.1x authentication can assist in preventing a malicious user from connecting an
    unauthorized PC to a switch port to inject or receive data from the network without detection.
  impact: ''
  references: []
  page_start: 11
  audit_raw: "Verify if the switch configuration has 802.1x authentication implemented for all access\nswitch ports connecting\
    \ to LAN outlets (i.e., RJ-45 wall plates) or devices not located in\nthe telecom room, wiring closets, or equipment rooms.\
    \ MAC Authentication Bypass\n(MAB) must be configured on those switch ports connected to devices that do not\nsupport\
    \ an 802.1x supplicant.\nStep 1: Verify that 802.1x is configured on all host-facing interfaces as shown in the\nexample\
    \ below:\ninterface GigabitEthernet1/0\n switchport access vlan 12\n switchport mode access\n authentication port-control\
    \ auto\n dot1x pae authenticator\n!\ninterface GigabitEthernet1/1\n switchport access vlan 13\n switchport mode access\n\
    \ authentication port-control auto\n dot1x pae authenticator\n!\ninterface GigabitEthernet1/2\n switchport access vlan\
    \ 13\n switchport mode access\n authentication port-control auto\n dot1x pae authenticator\nStep 2: Verify that 802.1x\
    \ authentication is configured on the switch as shown in the\nexample below:\naaa new-model\n!\n!\naaa group server radius\
    \ RADIUS_SERVERS\n server name RADIUS_1\n server name RADIUS_2\n!\naaa authentication dot1x default group RADIUS_SERVERS\n\
    …\n…\n…\ndot1x system-auth-control\nStep 3: Verify that the radius servers have been defined.\nSW1#show radius server-group\
    \ RADIUS_SERVERS\nNote: Single-host is the default. Host-mode multi-domain (for VoIP phone + PC) or\nmulti-auth (multiple\
    \ PCs connected to a hub) can be configured as alternatives. Hostmode multi-host is not compliant with this requirement.\n\
    If 802.1x authentication or MAB is not configured on all access switch ports connecting\nto LAN outlets or devices not\
    \ located in the telecom room, wiring closets, or equipment\nrooms, this is a finding."
  remediation: 'Configure 802.1 x authentications on all host-facing access switch ports. To

    authenticate those devices that do not support 802.1x, MAC Authentication Bypass

    must be configured.

    Step 1: Configure the radius servers as shown in the example below:

    SW1(config)#radius server RADIUS_1

    SW1(config-radius-server)#address ipv4 10.1.22.3

    SW1(config-radius-server)#key xxxxxx

    SW1(config-radius-server)#exit

    SW1(config)#radius server RADIUS_2

    SW1(config-radius-server)#address ipv4 10.1.14.5

    SW1(config-radius-server)#key xxxxxx

    SW1(config-radius-server)#exit

    Step 2: Enable 802.1x authentication on the switch.

    SW1(config)#aaa new-model

    SW1(config)#aaa group server radius RADIUS_SERVERS

    SW1(config-sg-radius)#server name RADIUS_1

    SW1(config-sg-radius)#server name RADIUS_2

    SW1(config-sg-radius)#exit

    SW1(config)#aaa authentication dot1x default group RADIUS_SERVERS

    SW1(config)#dot1x system-auth-control

    Step 3: Enable 802.1x on all host-facing interfaces as shown in the example below:

    SW1(config)#int range g1/0 - 8

    SW1(config-if-range)#switchport mode access

    SW1(config-if-range)#authentication host-mode single-host

    SW1(config-if-range)#dot1x pae authenticator

    SW1(config-if-range)#authentication port-control auto

    SW1(config-if-range)#end

    Note: Single-host is the default. Host-mode multi-domain (for VoIP phone + PC) or

    multi-auth (multiple PCs connected to a hub) can be configured as alternatives.'
  checks:
  - type: sql
    command: show radius server-group RADIUS_SERVERS
    severity: medium
    info: 'Verify if the switch configuration has 802.1x authentication implemented for all access

      switch ports connecting to LAN outlets (i.e., RJ-45 wall plates) or devices not located in

      the telecom room, wiring closets, or equipment rooms. MAC Authentication Bypass

      (MAB) must be configured on those switch ports connected to devices that do not

      support an 802.1x supplicant.

      Step 1: Verify that 802.1x is c'
- id: '1.2'
  title: CISC-L2-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must authenticate all VLAN Trunk Protocol (VTP) messages with a hash function using the most
    secured cryptographic algorithm available. GROUP ID: V-220650 RULE ID: SV-220650r539671'
  rationale: VLAN Trunk Protocol (VTP) provides central management of VLAN domains, thus reducing administration in a switched
    network. When configuring a new VLAN on a VTP server, the VLAN is distributed through all switches in the domain. This
    reduces the need to configure the same VLAN everywhere. VTP pruning preserves bandwidth by preventing VLAN traffic (unknown
    MAC, broadcast, multicast) from being sent down trunk links when not needed, that is, there are no access switch ports
    in neighboring switches belonging to such VLANs. An attack can force a digest change for the VTP domain enabling a rogue
    device to become the VTP server, which could allow unauthorized access to previously blocked VLANs or allow the addition
    of unauthorized switches into the domain. Authenticating VTP messages with a cryptographic hash function can reduce the
    risk of the VTP domain's being compromised.
  impact: ''
  references: []
  page_start: 14
  audit_raw: "Review the switch configuration to verify if VTP is enabled using the show vtp status\ncommand as shown in the\
    \ example below:\nSwitch#show vtp status\nVTP Version capable : 1 to 3\nVTP version running : 1\nVTP Domain Name :\nVTP\
    \ Pruning Mode : Disabled\nVTP Traps Generation : Disabled\nDevice ID : 5e00.0000.8000\nFeature VLAN:\n--------------\n\
    VTP Operating Mode : Off\nMaximum VLANs supported locally : 1005\nNumber of existing VLANs : 5\nConfiguration Revision\
    \ : 0\nMD5 digest : 0x57 0xCD 0x40 0x65 0x63 0x59 0x47 0xBD\n 0x56 0x9D 0x4A 0x3E 0xA5 0x69 0x35 0xBC\nSwitch#\nIf mode\
    \ is set to anything other than off, verify that a password has been configured\nusing the show vtp password command.\n\
    Note: VTP authenticates all messages using an MD5 hash that consists of the VTP\nversion + The VTP Password + VTP Domain\
    \ + VTP Configuration Revision.\nIf VTP is enabled on the switch and is not authenticating VTP messages with a hash\n\
    function using a configured password, this is a finding."
  remediation: 'Configure the switch to authenticate all VLAN Trunk Protocol (VTP) messages with a

    hash function using a configured password as shown in the example below:

    SW1(config)#vtp password xxxxxxxxx'
  checks:
  - type: sql
    command: show vtp status
    severity: medium
    info: 'Review the switch configuration to verify if VTP is enabled using the show vtp status

      command as shown in the example below:

      Switch#show vtp status

      VTP Version capable : 1 to 3

      VTP version running : 1

      VTP Domain Name :

      VTP Pruning Mode : Disabled

      VTP Traps Generation : Disabled

      Device ID : 5e00.0000.8000

      Feature VLAN:

      --------------

      VTP Operating Mode : Off

      Maximum VLANs supported locally : 1005

      N'
- id: '1.3'
  title: CISC-L2-000040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must manage excess bandwidth to limit the effects of packet flooding types of denial-of-service
    (DoS) attacks. GROUP ID: V-220651 RULE ID: SV-220651r1107171'
  rationale: Denial of service is a condition when a resource is not available for legitimate users. Packet flooding distributed
    DoS (DDoS) attacks are referred to as volumetric attacks and have the objective of overloading a network or circuit to
    deny or seriously degrade performance, which denies access to the services that normally traverse the network or circuit.
    Volumetric attacks have become relatively easy to launch by using readily available tools such as Low Orbit Ion Cannon
    or by using botnets. Measures to mitigate the effects of a successful volumetric attack must be taken to ensure that sufficient
    capacity is available for mission-critical traffic. Managing capacity may include, for example, establishing selected
    network usage priorities or quotas and enforcing them using rate limiting, Quality of Service (QoS), or other resource
    reservation control methods. These measures may also mitigate the effects of sudden decreases in network capacity that
    are the result of accidental or intentional physical damage to telecommunications facilities (such as cable cuts or weather-related
    outages).
  impact: ''
  references: []
  page_start: 16
  audit_raw: "Step 1: Verify that the class-maps are configured to match on DSCP values as shown in\nthe configuration example\
    \ below:\nclass-map match-all C2_VOICE\n match ip dscp 47\nclass-map match-all VOICE\n match ip dscp ef\nclass-map match-all\
    \ VIDEO\n match ip dscp af41\nclass-map match-all PREFERRED_DATA\n match ip dscp af33\nStep 2: Verify that the policy\
    \ map reserves the bandwidth for each traffic type as shown\nin the following example:\npolicy-map QOS_POLICY_SWITCHPORT\n\
    class C2_VOICE\n priority level 1 10\n class VOICE\n priority level 2 15\n class VIDEO\n bandwidth percent 25\nclass PREFERRED_DATA\n\
    \ bandwidth percent 25\n class class-default\n bandwidth percent 25\nverone\ninterface GigabitEthernet1/1\n switchport\
    \ trunk allowed vlan 100,110,200\nswitchport mode trunk\n service-policy output QOS_POLICY_SWITCHPORT\n!\ninterface GigabitEthernet1/2\n\
    \ switchport access vlan 100\n switchport mode access\n switchport voice vlan 200\n trust device cisco-phone\n service-policy\
    \ output QOS_POLICY_SWITCHPORT\n!\ninterface GigabitEthernet1/2\n switchport access vlan 110\n switchport mode access\n\
    \ switchport voice vlan 200\n trust device cisco-phone\n service-policy output QOS_POLICY_SWITCHPORT\nIf quality of service\
    \ (QoS) has not been enabled, this is a finding."
  remediation: 'Step 1: Configure class-maps to match on DSCP values as shown in the configuration

    example below:

    SW1(config-cmap)#class-map match-all C2_VOICE

    SW1(config-cmap)# match ip dscp 47

    SW1(config-cmap)#class-map match-all VOICE

    SW1(config-cmap)# match ip dscp ef

    SW1(config-cmap)#class-map match-all VIDEO

    SW1(config-cmap)# match ip dscp af41

    SW1(config)#class-map match-all PREFERRED_DATA

    SW1(config-cmap)# match ip dscp af33

    SW1(config-cmap)#exit

    Step 2: Configure a policy map to be applied to the core-layer-facing interface that

    reserves the bandwidth for each traffic type as shown in the example below:

    SW1(config)#policy-map QOS_POLICY_SWITCHPORT

    SW1(config-pmap-c)#class C2_VOICE

    SW1(config-pmap-c)# priority level 1 10

    SW1(config-pmap-c)#class VOICE

    SW1(config-pmap-c)# priority level 2 15

    SW1(config-pmap-c)#class VIDEO

    SW1(config-pmap-c)#bandwidth percent 25

    SW1(config-pmap-c)#class PREFERRED_DATA

    SW1(config-pmap-c)#bandwidth percent 25

    SW1(config-pmap-c)#class class-default

    SW1(config-pmap-c)#bandwidth percent 25

    SW1(config-pmap-c)#exit

    SW1(config-pmap)#exit

    Step 3: Apply the output service policy to the core-layer-facing interface as shown in the

    configuration example below:

    SW1(config)#int g1/1

    SW1(config-if)#service-policy output QOS_POLICY_SWITCHPORT

    SW1(config-if)#exit

    SW1(config)#int g1/2

    SW1(config-if)#service-policy output QOS_POLICY_SWITCHPORT

    SW1(config-if)#exit

    SW1(config)#int g1/3

    SW1(config-if)#service-policy output QOS_POLICY_SWITCHPORT

    SW1(config-if)#end.'
  checks:
  - type: manual_review
    info: "Step 1: Verify that the class-maps are configured to match on DSCP values as shown in\nthe configuration example\
      \ below:\nclass-map match-all C2_VOICE\n match ip dscp 47\nclass-map match-all VOICE\n match ip dscp ef\nclass-map match-all\
      \ VIDEO\n match ip dscp af41\nclass-map match-all PREFERRED_DATA\n match ip dscp af33\nStep 2: Verify that the policy\
      \ map reserves the bandwidth for each traffic type as shown\nin the following example:\npolicy-map QOS_POLICY_SWITCHPORT\n\
      class C2_VOICE\n priority level 1 10\n clas"
    severity: medium
- id: '1.4'
  title: CISC-L2-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco switch must have Root Guard enabled on all switch ports connecting to access layer switches. GROUP
    ID: V-220655 RULE ID: SV-220655r917683'
  rationale: Spanning Tree Protocol (STP) does not provide any means for the network administrator to securely enforce the
    topology of the switched network. Any switch can be the root bridge in a network. However, a more optimal forwarding topology
    places the root bridge at a specific predetermined location. With the standard STP, any bridge in the network with a lower
    bridge ID takes the role of the root bridge. The administrator cannot enforce the position of the root bridge but can
    set the root bridge priority to 0 in an effort to secure the root bridge position. The root guard feature provides a way
    to enforce the root bridge placement in the network. If the bridge receives superior STP Bridge Protocol Data Units (BPDUs)
    on a root guard-enabled port, root guard moves this port to a root-inconsistent STP state and no traffic can be forwarded
    across this port while it is in this state. To enforce the position of the root bridge it is imperative that root guard
    is enabled on all ports where the root bridge should never appear.
  impact: ''
  references: []
  page_start: 20
  audit_raw: "Review the switch topology as well as the configuration to verify that Root Guard is\nenabled on all switch\
    \ ports connecting to access layer switches.\ninterface GigabitEthernet0/0\n spanning-tree guard root\n!\ninterface GigabitEthernet0/1\n\
    \ spanning-tree guard root\n…\n…\n…\ninterface GigabitEthernet0/9\n spanning-tree guard root\nIf the switch has not enabled\
    \ Root Guard on all switch ports connecting to access layer\nswitches, this is a finding."
  remediation: 'Configure the switch to have Root Guard enabled on all ports connecting to access

    layer switches.

    SW1(config)#int range g0/0 - 9

    SW1(config-if-range)#spanning-tree guard root'
  checks:
  - type: manual_review
    info: "Review the switch topology as well as the configuration to verify that Root Guard is\nenabled on all switch ports\
      \ connecting to access layer switches.\ninterface GigabitEthernet0/0\n spanning-tree guard root\n!\ninterface GigabitEthernet0/1\n\
      \ spanning-tree guard root\n…\n…\n…\ninterface GigabitEthernet0/9\n spanning-tree guard root\nIf the switch has not\
      \ enabled Root Guard on all switch ports connecting to access layer\nswitches, this is a finding."
    severity: medium
- id: '1.5'
  title: CISC-L2-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must have BPDU Guard enabled on all user-facing or untrusted access switch ports. GROUP ID:
    V-220656 RULE ID: SV-220656r856278'
  rationale: If a rogue switch is introduced into the topology and transmits a Bridge Protocol Data Unit (BPDU) with a lower
    bridge priority than the existing root bridge, it will become the new root bridge and cause a topology change, rendering
    the network in a suboptimal state. The STP PortFast BPDU guard enhancement allows network designers to enforce the STP
    domain borders and keep the active topology predictable. The devices behind the ports that have STP PortFast enabled are
    not able to influence the STP topology. At the reception of BPDUs, the BPDU guard operation disables the port that has
    PortFast configured. The BPDU guard transitions the port into errdisable state and sends a log message.
  impact: ''
  references: []
  page_start: 22
  audit_raw: "Review the switch configuration to verify that BPDU Guard is enabled on all user-facing\nor untrusted access\
    \ switch ports as shown in the configuration example below:\ninterface GigabitEthernet0/0\n spanning-tree bpduguard enable\n\
    !\ninterface GigabitEthernet0/1\n spanning-tree bpduguard enable\n…\n…\n…\ninterface GigabitEthernet0/9\n spanning-tree\
    \ bpduguard enable\nIf the switch has not enabled BPDU Guard, this is a finding."
  remediation: 'Ensure that BPDU Guard is enabled on all user-facing or untrusted access switch ports

    as shown in the configuration example below:

    SW1(config)#int range g0/0 - 9

    SW1(config-if-range)#spanning-tree bpduguard enable

    Note: BPDU guard can also be enabled globally on all Port Fast-enabled ports by using

    the spanning-tree portfast bpduguard default command.'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify that BPDU Guard is enabled on all user-facing\nor untrusted access switch\
      \ ports as shown in the configuration example below:\ninterface GigabitEthernet0/0\n spanning-tree bpduguard enable\n\
      !\ninterface GigabitEthernet0/1\n spanning-tree bpduguard enable\n…\n…\n…\ninterface GigabitEthernet0/9\n spanning-tree\
      \ bpduguard enable\nIf the switch has not enabled BPDU Guard, this is a finding."
    severity: medium
- id: '1.6'
  title: CISC-L2-000110
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must have STP Loop Guard enabled. GROUP ID: V-220657 RULE ID: SV-220657r856279'
  rationale: The Spanning Tree Protocol (STP) loop guard feature provides additional protection against STP loops. An STP
    loop is created when an STP blocking port in a redundant topology erroneously transitions to the forwarding state. In
    its operation, STP relies on continuous reception and transmission of BPDUs based on the port role. The designated port
    transmits BPDUs, and the non-designated port receives BPDUs. When one of the ports in a physically redundant topology
    no longer receives BPDUs, the STP conceives that the topology is loop free. Eventually, the blocking port from the alternate
    or backup port becomes a designated port and moves to a forwarding state. This situation creates a loop. The loop guard
    feature makes additional checks. If BPDUs are not received on a non-designated port and loop guard is enabled, that port
    is moved into the STP loop-inconsistent blocking state.
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'Review the switch configuration to verify that STP Loop Guard is enabled as shown in

    the configuration example below:

    hostname SW2

    …

    …

    …

    spanning-tree mode pvst

    spanning-tree loopguard default

    If STP Loop Guard is not enabled, this is a finding.'
  remediation: 'Configure the switch to have STP Loop Guard enabled via the spanning-tree loopguard

    default global command.'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to verify that STP Loop Guard is enabled as shown in

      the configuration example below:

      hostname SW2

      …

      …

      …

      spanning-tree mode pvst

      spanning-tree loopguard default

      If STP Loop Guard is not enabled, this is a finding.'
    severity: medium
- id: '1.7'
  title: CISC-L2-000120
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must have Unknown Unicast Flood Blocking (UUFB) enabled. GROUP ID: V-220658 RULE ID: SV-220658r856280'
  rationale: Access layer switches use the Content Addressable Memory (CAM) table to direct traffic to specific ports based
    on the VLAN number and the destination MAC address of the frame. When a router has an Address Resolution Protocol (ARP)
    entry for a destination host and forwards it to the access layer switch and there is no entry corresponding to the frame's
    destination MAC address in the incoming VLAN, the frame will be sent to all forwarding ports within the respective VLAN,
    which causes flooding. Large amounts of flooded traffic can saturate low-bandwidth links, causing network performance
    issues or complete connectivity outage to the connected devices. Unknown unicast flooding has been a nagging problem in
    networks that have asymmetric routing and default timers. To mitigate the risk of a connectivity outage, the Unknown Unicast
    Flood Blocking (UUFB) feature must be implemented on all access layer switches. The UUFB feature will block unknown unicast
    traffic flooding and only permit egress traffic with MAC addresses that are known to exit on the port.
  impact: ''
  references: []
  page_start: 26
  audit_raw: "Review the switch configuration to verify that UUFB is enabled on all access switch\nports as shown in the configuration\
    \ example below:\ninterface GigabitEthernet0/0\n switchport block unicast\n!\ninterface GigabitEthernet0/1\n switchport\
    \ block unicast\n…\n…\n…\ninterface GigabitEthernet0/9\n switchport block unicast\nIf any access switch ports do not have\
    \ UUFB enabled, this is a finding."
  remediation: 'Configure the switch to have Unknown Unicast Flood Blocking (UUFB) enabled as

    shown in the configuration example below:

    SW1(config)#int range g0/0 - 9

    SW1(config-if-range)#switchport block unicast'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify that UUFB is enabled on all access switch\nports as shown in the configuration\
      \ example below:\ninterface GigabitEthernet0/0\n switchport block unicast\n!\ninterface GigabitEthernet0/1\n switchport\
      \ block unicast\n…\n…\n…\ninterface GigabitEthernet0/9\n switchport block unicast\nIf any access switch ports do not\
      \ have UUFB enabled, this is a finding."
    severity: medium
- id: '1.8'
  title: CISC-L2-000130
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must have DHCP snooping for all user VLANs to validate DHCP messages from untrusted sources.
    GROUP ID: V-220659 RULE ID: SV-220659r928999'
  rationale: In an enterprise network, devices under administrative control are trusted sources. These devices include the
    switches, routers, and servers in the network. Host ports and unknown DHCP servers are considered untrusted sources. An
    unknown DHCP server on the network on an untrusted port is called a spurious DHCP server, any device (PC, Wireless Access
    Point) that is loaded with DHCP server enabled. The DHCP snooping feature determines whether traffic sources are trusted
    or untrusted. The potential exists for a spurious DHCP server to respond to DHCPDISCOVER messages before the real server
    has time to respond. DHCP snooping allows switches on the network to trust the port a DHCP server is connected to and
    not trust the other ports. The DHCP snooping feature validates DHCP messages received from untrusted sources and filters
    out invalid messages as well as rate-limits DHCP traffic from trusted and untrusted sources. DHCP snooping feature builds
    and maintains a binding database, which contains information about untrusted hosts with leased IP addresses, and it utilizes
    the database to validate subsequent requests from untrusted hosts. Other security features, such as IP Source Guard and
    Dynamic Address Resolution Protocol (ARP) Inspection (DAI), also use information stored in the DHCP snooping binding database.
    Hence, it is imperative that the DHCP snooping feature is enabled on all VLANs.
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'Review the switch configuration and verify that DHCP snooping is enabled on all user

    VLANs as shown in the example below:

    hostname SW2

    …

    …

    …

    ip dhcp snooping vlan 2,4-8,11

    ip dhcp snooping

    Note: Switchports assigned to a user VLAN would have drops in the area where the

    user community would reside; hence, the "untrusted" term is used. Server and printer

    VLANs would not be applicable.

    If the switch does not have DHCP snooping enabled for all user VLANs to validate

    DHCP messages from untrusted sources, this is a finding.'
  remediation: 'Configure the switch to have DHCP snooping for all user VLANs to validate DHCP

    messages from untrusted sources as shown in the example below:

    SW2(config)#ip dhcp snooping

    SW2(config)#ip dhcp snooping vlan 2,4-8,11'
  checks:
  - type: manual_review
    info: 'Review the switch configuration and verify that DHCP snooping is enabled on all user

      VLANs as shown in the example below:

      hostname SW2

      …

      …

      …

      ip dhcp snooping vlan 2,4-8,11

      ip dhcp snooping

      Note: Switchports assigned to a user VLAN would have drops in the area where the

      user community would reside; hence, the "untrusted" term is used. Server and printer

      VLANs would not be applicable.

      If the switch does not have DHCP snooping enabled for all user VLANs to validate

      DHCP messages from untrusted sour'
    severity: medium
- id: '1.9'
  title: CISC-L2-000140
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must have IP Source Guard enabled on all user-facing or untrusted access switch ports. GROUP
    ID: V-220660 RULE ID: SV-220660r929001'
  rationale: IP Source Guard provides source IP address filtering on a Layer 2 port to prevent a malicious host from impersonating
    a legitimate host by assuming the legitimate host's IP address. The feature uses dynamic DHCP snooping and static IP source
    binding to match IP addresses to hosts on untrusted Layer 2 access ports. Initially, all IP traffic on the protected port
    is blocked except for DHCP packets. After a client receives an IP address from the DHCP server, or after static IP source
    binding is configured by the administrator, all traffic with that IP source address is permitted from that client. Traffic
    from other hosts is denied. This filtering limits a host's ability to attack the network by claiming a neighbor host's
    IP address.
  impact: ''
  references: []
  page_start: 30
  audit_raw: "Review the switch configuration to verify that IP Source Guard is enabled on all userfacing or untrusted access\
    \ switch ports as shown in the example below:\ninterface GigabitEthernet0/0\n ip verify source\n!\ninterface GigabitEthernet0/1\n\
    \ ip verify source\n…\n…\n…\ninterface GigabitEthernet0/9\n ip verify source\nNote: The IP Source Guard feature depends\
