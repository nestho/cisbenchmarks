- id: '1.20'
  title: CISC-L2-000260
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must have the native VLAN assigned to an ID other than the default VLAN for all 802.1q trunk
    links. GROUP ID: V-220672 RULE ID: SV-220672r991909'
  rationale: VLAN hopping can be initiated by an attacker who has access to a switch port belonging to the same VLAN as the
    native VLAN of the trunk link connecting to another switch that the victim is connected to. If the attacker knows the
    victim’s MAC address, it can forge a frame with two 802.1q tags and a layer 2 header with the destination address of the
    victim. Since the frame will ingress the switch from a port belonging to its native VLAN, the trunk port connecting to
    the victim’s switch will simply remove the outer tag because native VLAN traffic is to be untagged. The switch will forward
    the frame on to the trunk link unaware of the inner tag with a VLAN ID of which the victim’s switch port is a member.
  impact: ''
  references: []
  page_start: 50
  audit_raw: "Review the switch configurations and examine all trunk links. Verify the native VLAN\nhas been configured to\
    \ a VLAN ID other than the ID of the default VLAN (i.e. VLAN 1)\nas shown in the example below:\ninterface GigabitEthernet0/1\n\
    \ switchport trunk encapsulation dot1q\n switchport trunk native vlan 44\n switchport mode trunk\n negotiation auto\n\
    Note: An alternative to configuring a dedicated native VLAN is to ensure that all native\nVLAN traffic is tagged. This\
    \ will mitigate the risk of VLAN hopping since there will\nalways be an outer tag for native traffic as it traverses an\
    \ 802.1q trunk link.\nIf the native VLAN has the same VLAN ID as the default VLAN, this is a finding."
  remediation: 'To ensure the integrity of the trunk link and prevent unauthorized access, the ID of the

    native VLAN of the trunk port must be changed from the default VLAN (i.e., VLAN 1) to

    its own unique VLAN ID.

    SW1(config)#int g0/1

    SW1(config-if)#switchport trunk native vlan 44

    Note: The native VLAN ID must be the same on both ends of the trunk link; otherwise,

    traffic could accidentally leak between broadcast domains.'
  checks:
  - type: manual_review
    info: "Review the switch configurations and examine all trunk links. Verify the native VLAN\nhas been configured to a\
