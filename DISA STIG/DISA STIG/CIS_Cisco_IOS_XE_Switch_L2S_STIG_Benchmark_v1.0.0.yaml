- id: '1.13'
  title: CISC-L2-000180
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must implement Rapid STP where VLANs span multiple switches with redundant links. GROUP ID:
    V-220664 RULE ID: SV-220664r539671'
  rationale: Spanning Tree Protocol (STP) is implemented on bridges and switches to prevent layer 2 loops when a broadcast
    domain spans multiple bridges and switches and when redundant links are provisioned to provide high availability in case
    of link failures. Convergence time can be significantly reduced using Rapid STP (802.1w) instead of STP (802.1d), resulting
    in improved availability. Rapid STP should be deployed by implementing either Rapid Per-VLAN-Spanning-Tree (Rapid-PVST)
    or Multiple Spanning-Tree Protocol (MSTP), the latter scales much better when there are many VLANs.
  impact: ''
  references: []
  page_start: 38
  audit_raw: 'In cases where VLANs do not span multiple switches, it is a best practice to not

    implement STP. Avoiding the use of STP will provide the most deterministic and highly

    available network topology. If STP is required, then review the switch configuration to

    verify that Rapid STP has been implemented.

    hostname SW2

    …

    …

    …

    spanning-tree mode rapid-pvst

    Note: Multiple STP (MSTP) can be configured as an alternate mode. MSTP which uses

    RSTP for rapid convergence and enables multiple VLANs to be grouped into and

    mapped to the same spanning-tree instance; thereby reducing the number of spanningtree instances needed to support a large
    number of VLANs.

    If either RSTP or MSTP has not been implemented where STP is required, this is a

    finding.'
  remediation: 'Configure Rapid STP or MSTP to be implemented at the access and distribution layers

    where VLANs span multiple switches as shown in the examples below:

    SW2(config)#spanning-tree mode rapid-pvst

    or

    SW1(config)#spanning-tree mode mst'
  checks:
  - type: manual_review
    info: 'In cases where VLANs do not span multiple switches, it is a best practice to not

