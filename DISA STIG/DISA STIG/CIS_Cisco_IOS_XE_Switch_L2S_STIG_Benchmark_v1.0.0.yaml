- id: '1.10'
  title: CISC-L2-000150
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must have Dynamic Address Resolution Protocol (ARP) Inspection (DAI) enabled on all user
    VLANs. GROUP ID: V-220661 RULE ID: SV-220661r929003'
  rationale: DAI intercepts Address Resolution Protocol (ARP) requests and verifies that each of these packets has a valid
    IP-to-MAC address binding before updating the local ARP cache and before forwarding the packet to the appropriate destination.
    Invalid ARP packets are dropped and logged. DAI determines the validity of an ARP packet based on valid IP-to-MAC address
    bindings stored in the DHCP snooping binding database. If the ARP packet is received on a trusted interface, the switch
    forwards the packet without any checks. On untrusted interfaces, the switch forwards the packet only if it is valid.
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'Review the switch configuration to verify that Dynamic Address Resolution Protocol

    (ARP) Inspection (DAI) feature is enabled on all user VLANs.

    hostname SW2

    …

    …

    …

    ip arp inspection vlan 2,4-8,11

    Note: DAI depends on the entries in the DHCP snooping binding database to verify IPto-MAC address bindings in incoming
    ARP requests and ARP responses.

    If DAI is not enabled on all user VLANs, this is a finding.'
  remediation: 'Configure the switch to have Dynamic Address Resolution Protocol (ARP) Inspection

    (DAI) enabled on all user VLANs as shown in the example below:

    SW2(config)#ip arp inspection vlan 2,4-8,11'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to verify that Dynamic Address Resolution Protocol

      (ARP) Inspection (DAI) feature is enabled on all user VLANs.

      hostname SW2

      …

      …

      …

      ip arp inspection vlan 2,4-8,11

      Note: DAI depends on the entries in the DHCP snooping binding database to verify IPto-MAC address bindings in incoming
      ARP requests and ARP responses.

      If DAI is not enabled on all user VLANs, this is a finding.'
    severity: medium
- id: '1.11'
  title: CISC-L2-000160
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco switch must have Storm Control configured on all host-facing switchports. GROUP ID: V-220662 RULE
    ID: SV-220662r648766'
  rationale: A traffic storm occurs when packets flood a LAN, creating excessive traffic and degrading network performance.
    Traffic storm control prevents network disruption by suppressing ingress traffic when the number of packets reaches a
    configured threshold levels. Traffic storm control monitors ingress traffic levels on a port and drops traffic when the
    number of packets reaches the configured threshold level during any onesecond interval.
  impact: ''
  references: []
  page_start: 34
  audit_raw: 'Review the switch configuration to verify that storm control is enabled on all host-facing

    interfaces as shown in the example below:

    interface GigabitEthernet0/3

    switchport access vlan 12

    storm-control unicast level bps 62000000

    storm-control broadcast level bps 20000000

    Note: Bandwidth percentage thresholds (via level parameter) can be used in lieu of PPS

    rate.

    If storm control is not enabled at a minimum for broadcast traffic, this is a finding.'
  remediation: 'Configure storm control for each host-facing interface as shown in the example below:

    SW1(config)#int range g0/2 - 8

    SW1(config-if-range)#storm-control unicast bps 62000000

    SW1(config-if-range)#storm-control broadcast level bps 20000000

    Note: The acceptable range is 10000000 -1000000000 for a gigabit Ethernet interface,

    and 100000000-10000000000 for a ten gigabit interface. Storm control is not supported

    on most FastEthernet interfaces.'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to verify that storm control is enabled on all host-facing

