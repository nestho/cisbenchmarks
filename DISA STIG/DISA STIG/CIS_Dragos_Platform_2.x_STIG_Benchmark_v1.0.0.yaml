- id: '1.1'
  title: DRAG-OT-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Dragos must configure idle timeouts at 10 minutes. GROUP ID: V-270904 RULE ID: SV-270904r1058027'
  rationale: 'A session time-out lock is a temporary action taken when a user stops work and moves away from the immediate
    physical vicinity of the information system but does not log out because of the temporary nature of the absence. The session
    lock is implemented at the point where session activity can be determined. This is typically at the operating system level
    but may be at Dragos level. When Dragos design specifies Dragos rather than the operating system will determine when to
    lock the session, Dragos session lock event must include an obfuscation of the display screen to prevent other users from
    reading what was previously displayed. Publicly viewable images can include static or dynamic images, for example, patterns
    used with screen savers, photographic images, solid colors, a clock, a battery life indicator, or a blank screen, with
    the additional caveat that none of the images convey sensitive information. Satisfies: SRG-APP-000002, SRG-APP-000003,
    SRG-APP-000190, SRG-APP-000295, SRG-APP-000389'
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'Verify session timeout is configured.

    In the UI, navigate to Admin >> SiteStore Management >> Advanced Settings.

    Click "Configurations".

    If Idle Auto-Logout Minutes is not set to 10 minutes, this is a finding.

    If Re-Authenticate User Device (Inactive) is not set to 1h, this is a finding.'
  remediation: 'Set session timeout configurations.

    In the UI, navigate to Admin >> SiteStore Management >> Advanced Settings.

    Click "Configurations".

    Set Idle Auto-Logout Minutes to 10.

    Set Re-Authenticate User Device (Inactive) to 1h.

    Click "Save & Apply".'
  checks:
  - type: manual_review
    info: 'Verify session timeout is configured.

      In the UI, navigate to Admin >> SiteStore Management >> Advanced Settings.

      Click "Configurations".

      If Idle Auto-Logout Minutes is not set to 10 minutes, this is a finding.

      If Re-Authenticate User Device (Inactive) is not set to 1h, this is a finding.'
    severity: medium
- id: '1.2'
  title: DRAG-OT-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Dragos Platform must use an Identity Provider (IDP) for authentication and authorization processes. GROUP
    ID: V-270910 RULE ID: SV-270910r1057994'
  rationale: 'Enterprise environments make application account management challenging and complex. A manual process for account
    management functions adds the risk of a potential oversight or other error. A comprehensive application account management
    process that includes automation helps to ensure accounts designated as requiring attention are consistently and promptly
    addressed. Examples include, but are not limited to, using automation to take action on multiple accounts designated as
    inactive, suspended, or terminated or by disabling accounts located in noncentralized account stores such as multiple
    servers. This requirement applies to all account types, including individual/user, shared, group, system, guest/anonymous,
    emergency, developer/manufacturer/vendor, temporary, and service. Dragos Platform must be configured to automatically
    provide account management functions and these functions must immediately enforce the organization''s current account
    policy. The automated mechanisms may reside within Dragos Platform itself or may be offered by the operating system or
    other infrastructure providing automated account management capabilities. Automated mechanisms may be comprised of differing
    technologies that when placed together contain an overall automated mechanism supporting an organization''s automated
    account management requirements. Account management functions include: assignment of group or role membership; identifying
    account type; specifying user access authorizations (i.e., privileges); account removal, update, or termination; and administrative
    alerts. The use of automated mechanisms can include, for example: using email or text messaging to automatically notify
    account managers when users are terminated or transferred; using the information system to monitor account usage; and
    using automated telephonic notification to report atypical system account usage. Satisfies: SRG-APP-000023, SRG-APP-000025,
    SRG-APP-000065, SRG-APP-000149, SRG-APP-000150, SRG-APP-000151, SRG-APP-000152, SRG-APP-000163, SRGAPP-000165, SRG-APP-000170,
    SRG-APP-000173, SRG-APP-000233, SRG-APP000345, SRG-APP-000317, SRG-APP-000318'
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'Review the authentication method being used by the Platform.

    In the UI, navigate to Admin >> SiteStore Management >> Authentication Providers.

    If the Platform does not have an Authentication Provider configured, this is a finding.'
  remediation: 'Configure LDAP.

    In the UI, navigate to Admin >> SiteStore Management >> Authentication Providers.

    Next to LDAP/Active Directory, click "ADD PROVIDER".

    Fill in the configuration in the "Add New LDAP Provider" form.

    Click "Save".'
  checks:
  - type: manual_review
    info: 'Review the authentication method being used by the Platform.

      In the UI, navigate to Admin >> SiteStore Management >> Authentication Providers.

      If the Platform does not have an Authentication Provider configured, this is a finding.'
    severity: medium
- id: '1.3'
  title: DRAG-OT-000200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Dragos Platform must display the Standard Mandatory DOD Notice and Consent Banner before granting local
    or remote access to the system. GROUP ID: V-270916 RULE ID: SV-270916r1057996'
  rationale: 'Display of a standardized and approved use notification before granting access to the operating system ensures
    privacy and security notification verbiage used is consistent with applicable federal laws, Executive Orders, directives,
    policies, regulations, standards, and guidance. System use notifications are required only for access via logon interfaces
    with human users and are not required when such human interfaces do not exist. The banner must be formatted in accordance
    with applicable DOD policy. Use the following verbiage for operating systems that can accommodate banners of 1300 characters:
    "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only. By using
    this IS (which includes any device attached to this IS), you consent to the following conditions: - The USG routinely
    intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC
    monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI)
    investigations. - At any time, the USG may inspect and seize data stored on this IS. - Communications using, or data stored
    on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used
    for any USG-authorized purpose. - This IS includes security measures (e.g., authentication and access controls) to protect
    USG interests--not for your personal benefit or privacy. - Notwithstanding the above, using this IS does not constitute
    consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product,
    related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications
    and work product are private and confidential. See User Agreement for details." Use the following verbiage for operating
    systems that have severe limitations on the number of characters that can be displayed in the banner: "I''ve read & consent
    to terms in IS user agreem''t." Satisfies: SRG-APP-000068, SRG-APP-000069'
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'Verify the Dragos Platform displays the Standard Mandatory DOD Notice and Consent

    Banner before granting access to the system when login in via SSH.

    If the banner does not exist or is not formatted in accordance with applicable DOD

    policy, this is a finding.'
  remediation: 'Configure the Dragos Platform to display the Standard Mandatory DOD Notice and

    Consent Banner before granting access to the system:

    1. Log in to the SiteStore or Sensor via SSH.

    2. Input "config banner pre_login" into the CLI.

    3. Input the banner text shown below, pressing "Enter" after each line. Press config

    appl CTRL-D to save the text or CTRL-C to quit without saving.

    4. Apply the banner by executing the following:

    5. config apply

    The banner must be formatted in accordance with applicable DOD policy. Use the

    following verbiage for operating systems that can accommodate banners of 1300

    characters:

    "You are accessing a U.S. Government (USG) Information System (IS) that is

    provided for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent

    to the following conditions:

    - The USG routinely intercepts and monitors communications on this IS for

    purposes including, but not limited to, penetration testing, COMSEC

    monitoring, network operations and defense, personnel misconduct (PM), law

    enforcement (LE), and counterintelligence (CI) investigations.

    - At any time, the USG may inspect and seize data stored on this IS.

    - Communications using, or data stored on, this IS are not private, are

    subject to routine monitoring, interception, and search, and may be disclosed

    or used for any USG-authorized purpose.

    - This IS includes security measures (e.g., authentication and access

    controls) to protect USG interests--not for your personal benefit or privacy.

    - Notwithstanding the above, using this IS does not constitute consent to PM,

    LE or CI investigative searching or monitoring of the content of privileged

    communications, or work product, related to personal representation or

    services by attorneys, psychotherapists, or clergy, and their assistants.

    Such communications and work product are private and confidential. See User

    Agreement for details."

    Use the following verbiage for operating systems that have severe limitations on the

    number of characters that can be displayed in the banner:

    "I''ve read & consent to terms in IS user agreem''t."'
  checks:
  - type: manual_review
    info: 'Verify the Dragos Platform displays the Standard Mandatory DOD Notice and Consent

      Banner before granting access to the system when login in via SSH.

      If the banner does not exist or is not formatted in accordance with applicable DOD

      policy, this is a finding.'
    severity: medium
- id: '1.4'
  title: DRAG-OT-000220
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The publicly accessible Dragos Platform application must display the Standard Mandatory DOD Notice and Consent
    Banner before granting access to Dragos Platform. GROUP ID: V-270917 RULE ID: SV-270917r1058026'
  rationale: 'Display of a standardized and approved use notification before granting access to the publicly accessible application
