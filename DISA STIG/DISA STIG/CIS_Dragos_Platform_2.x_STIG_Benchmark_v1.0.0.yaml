  rationale: 'Once an attacker establishes access to an application, the attacker often attempts to create a persistent method
    of re-establishing access. One way to accomplish this is for the attacker to simply create a new account. Sending notification
    of account creation events to the system administrator and ISSO is one method for mitigating this risk. Satisfies: SRG-APP-000291,
    SRG-APP-000292, SRG-APP-000293, SRG-APP-000294'
