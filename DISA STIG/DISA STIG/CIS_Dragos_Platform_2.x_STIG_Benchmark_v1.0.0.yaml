- id: '1.8'
  title: DRAG-OT-000500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Dragos Platform must have disk encryption enabled on a virtual machines (VMs). GROUP ID: V-270945 RULE
    ID: SV-270945r1107130'
  rationale: Enabling disk encryption on VMs running the Dragos Platform is a critical security measure to protect sensitive
    data, ensure compliance with regulations, and provide a robust defense against various threats, including unauthorized
    access, data breaches, and insider threats. Disk encryption ensures that the data stored on the VM's disk is unreadable
    to unauthorized users. This is crucial for protecting sensitive information, such as security logs, configurations, and
    other operational data, from being accessed if the disk is physically stolen or if unauthorized access is obtained. In
    the event of a security breach, encrypted disks prevent attackers from easily accessing the data stored on the VMs. This
    is particularly important for mitigating the risks associated with data breaches, including the potential exposure of
    sensitive operational technology (OT) and industrial control system (ICS) data. VMs can be snapshotted or cloned, creating
    exact copies of the VM, including its data. Disk encryption ensures that even if a snapshot or clone is made, the data
    remains protected and cannot be accessed without the appropriate decryption keys. Disk encryption protects data at rest,
    which is data stored on the disk when the system is not in use. This is a critical aspect of data security, as it ensures
    that the data remains protected even if the VM is powered off or in a dormant state. For organizations using both on-premises
    and cloud environments, disk encryption provides a consistent approach to data security. This helps maintain uniform security
    policies and practices across different infrastructure setups. In multi-tenant environments, where multiple virtual machines
    run on the same physical hardware, disk encryption ensures that data on one VM cannot be accessed by other tenants or
    compromised VMs on the same host.
  impact: ''
  references: []
  page_start: 34
  audit_raw: 'If Dragos is running on an appliance, this check is Not Applicable.

    If the hypervisor is using full disk encryption, this check is Not Applicable.

    Check for disk encryption in a VM.

    Log into the VM and access the VM using remote access method, such as SSH.

    Use Built-in Tools or Commands:

    Linux:

    1. Open a terminal window.

    2. Use the following command to check if any encrypted partitions exist:

    3. lsblk -o NAME,FSTYPE,LABEL,UUID,SIZE,MOUNTPOINT,TYPE

    4. Check for partitions with the filesystem type crypto_LUKS or similar.

    5. Use the following command to list encrypted volumes:

    6. cryptsetup luksDump /dev/sdX

    (Replace /dev/sdX with the appropriate device name)

    If volumes are not encrypted, this is a finding.'
  remediation: 'If Dragos is running on an appliance, this check is Not Applicable.

    If the hypervisor is using full disk encryption, this check is Not Applicable.

    LUKS (Linux Unified Key Setup):

    During the installation process, most Linux distributions provide an option to encrypt the

    disk. Select this option to set up encryption.

    To encrypt an existing installation, use tools such as cryptsetup to set up encryption

    manually. Here is a general guide:

    Execute the following (Replace /dev/sdX with the appropriate device name):

    sudo cryptsetup luksFormat /dev/sdX

    sudo cryptsetup open /dev/sdX encrypted_disk

    sudo mkfs.ext4 /dev/mapper/encrypted_disk

    sudo mount /dev/mapper/encrypted_disk /mnt'
  checks:
  - type: manual_review
    info: 'If Dragos is running on an appliance, this check is Not Applicable.

      If the hypervisor is using full disk encryption, this check is Not Applicable.

      Check for disk encryption in a VM.

      Log into the VM and access the VM using remote access method, such as SSH.

      Use Built-in Tools or Commands:

      Linux:

      1. Open a terminal window.

      2. Use the following command to check if any encrypted partitions exist:

      3. lsblk -o NAME,FSTYPE,LABEL,UUID,SIZE,MOUNTPOINT,TYPE

      4. Check for partitions with the filesystem type'
    severity: medium
- id: '1.9'
  title: DRAG-OT-000520
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Dragos Platforms must limit privileges and not allow the ability to run shell. GROUP ID: V-270947 RULE ID:
    SV-270947r1058031'
  rationale: 'If Dragos Platform were to allow any user to make changes to software libraries, then those changes might be
    implemented without undergoing the appropriate testing and approvals that are part of a robust change management process.
    This requirement applies to applications with software libraries that are accessible and configurable, as in the case
    of interpreted languages. Software libraries also include privileged programs which execute with escalated privileges.
    Only qualified and authorized individuals must be allowed to obtain access to information system components for purposes
    of initiating changes, including upgrades and modifications. Satisfies: SRG-APP-000133, SRG-APP-000206, SRG-APP-000246,
    SRG-APP-000340, SRG-APP-000342, SRG-APP-000384'
  impact: ''
  references: []
  page_start: 36
  audit_raw: 'Verify shell environment:

    Log in to the Dragos Platform CLI.

    Execute the following command:

    run shell

    If the option "run shell" executes successfully and places the terminal session into a

    shell environment, this is a finding.

    Note: A shell environment will be noticeable because the terminal line will be in the

    format user@dragos:~$ compared to dragoscmd, which would be <dragos>. If shell is

    properly uninstalled, the return will be Error: No such command ''shell''.'
  remediation: 'Uninstall shell environment:

    Log in to the Dragos Platform CLI.

    Execute the following command:

    run ushell

    Once this is done, users cannot initiate communications outside low threshold (nonuser

    configurable) ICMP packets. Nonsigned installation packages cannot be added to the

    Dragos Platform. This command removes the shell from the Platform; it cannot be

    reinstalled without installing Dragos Platform from baseline images.'
  checks:
  - type: manual_review
    info: 'Verify shell environment:

      Log in to the Dragos Platform CLI.

      Execute the following command:

      run shell

      If the option "run shell" executes successfully and places the terminal session into a

      shell environment, this is a finding.

      Note: A shell environment will be noticeable because the terminal line will be in the

      format user@dragos:~$ compared to dragoscmd, which would be <dragos>. If shell is

      properly uninstalled, the return will be Error: No such command ''shell''.'
    severity: medium
