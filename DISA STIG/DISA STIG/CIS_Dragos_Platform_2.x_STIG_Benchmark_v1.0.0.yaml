  - 'SEVERITY: CAT II'
  description: 'The Syslog client must use TCP connections. GROUP ID: V-271027 RULE ID: SV-271027r1057724'
  rationale: Removal of unneeded or nonsecure functions, ports, protocols, and services mitigate the risk of unauthorized
    connection of devices, unauthorized transfer of information, or other exploitation of these resources. The organization
    must perform a periodic scan/review of Dragos (as required by CCI000384) and disable functions, ports, protocols, and
    services deemed to be unneeded or nonsecure.
