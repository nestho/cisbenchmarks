  title: DRAG-OT-002120
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Dragos Platform must alert the information system security officer (ISSO), information system security
    manager (ISSM), and other individuals designated by the local organization when events are detected that indicate a compromise
    or potential for compromise. GROUP ID: V-271070 RULE ID: SV-271070r1107133'
  rationale: When a security event occurs, Dragos Platform must immediately notify the appropriate support personnel so they
    can respond appropriately. Alerts may be generated from a variety of sources, including audit records or inputs from malicious
    code protection mechanisms, intrusion detection mechanisms, or prevention mechanisms. IOCs are forensic artifacts from
    intrusions that are identified on organizational information systems (at the host or network level). IOCs provide organizations
