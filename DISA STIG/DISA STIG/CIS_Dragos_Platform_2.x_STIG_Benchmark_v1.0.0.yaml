- id: '1.17'
  title: DRAG-OT-001910
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Dragos Platform must only allow the use of DOD PKI established certificate authorities for verification
    of the establishment of protected sessions. GROUP ID: V-271049 RULE ID: SV-271049r1057790'
  rationale: 'Untrusted Certificate Authorities (CA) can issue certificates, but they may be issued by organizations or individuals
    that seek to compromise DOD systems or by organizations with insufficient security controls. If the CA used for verifying
    the certificate is not a DOD-approved CA, trust of this CA has not been established. The DOD will only accept PKI certificates
    obtained from a DOD-approved internal or external certificate authority. Reliance on CAs for the establishment of secure
    sessions includes, for example, the use of TLS certificates. This requirement focuses on communications protection for
    Dragos Platform session rather than for the network packet. This requirement applies to applications that use communications
    sessions. This includes, but is not limited to, web-based applications and Service-Oriented Architectures (SOA). Satisfies:
    SRG-APP-000427, SRG-APP-000605'
  impact: ''
  references: []
