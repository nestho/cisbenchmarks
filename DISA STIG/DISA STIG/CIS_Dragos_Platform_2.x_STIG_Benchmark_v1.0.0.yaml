  audit_raw: 'Use the netstat command to display active UDP connections:

    netstat -n -p UDP

    If the syslog client is using a UDP connection, this is a finding.'
  remediation: 'Changing UDP ports to TCP ports and using TCP instead involves modifying the

    configuration of the application or service that uses UDP for communication.

    Modify the syslog client configuration to specify TCP instead of UDP. This may involve

    changing port numbers or selecting TCP as the communication protocol.

    After making the necessary changes, restart the application or service to apply the new

    configuration settings. This ensures that the syslog client starts using TCP ports instead

    of UDP ports.'
