  title: DRAG-OT-001430
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Dragos Platform must allocate audit record storage retention length. GROUP ID: V-271008 RULE ID: SV-271008r1057667'
  rationale: In order to ensure applications have a sufficient storage capacity in which to write the audit logs, applications
    need to be able to allocate audit record storage capacity. The task of allocating audit record storage capacity is usually
    performed during initial installation of Dragos Platform and is closely associated with the database administrator (DBA)
    and system administrator (SA) roles. The DBA or SA will usually coordinate the allocation of physical drive space with
    Dragos Platform owner/installer and Dragos Platform will prompt the installer to provide the capacity information, the
    physical location of the disk, or both.
