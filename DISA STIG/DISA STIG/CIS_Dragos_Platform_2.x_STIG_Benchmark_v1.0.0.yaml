    logon interfaces with human users and are not required when such human interfaces do not exist. The banner must be formatted
    in accordance with DTM-08-060. Use the following verbiage for desktops, laptops, and other devices accommodating banners
    of 1300 characters: "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized
    use only. By using this IS (which includes any device attached to this IS), you consent to the following conditions: -
    The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration
    testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence
    (CI) investigations. - At any time, the USG may inspect and seize data stored on this IS. - Communications using, or data
    stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed
    or used for any USG-authorized purpose. - This IS includes security measures (e.g., authentication and access controls)
    to protect USG interests--not for your personal benefit or privacy. - Notwithstanding the above, using this IS does not
    constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications,
    or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants.
    Such communications and work product are private and confidential. See User Agreement for details." Use the following
    verbiage for operating systems that have severe limitations on the number of characters that can be displayed in the banner:
    "I''ve read & consent to terms in IS user agreem''t."'
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'Verify that the Standard Mandatory DOD Notice and Consent Banner appears before

    being granted access to Dragos Platform UI.

    If the Standard Mandatory DOD Notice is not presented, this is a finding.'
  remediation: "1. Download the following script and put it in the /root directory on the sitestore\nwhere the DOD Banner\
    \ is to be applied (see below).\n2. Run the script with the following syntax: python3\nDOD_Banner_Config_Utility.py, and\
    \ go to the sitestore login page to verify\nthe banner is present.\n3. Schedule the cron with the following syntax to\
    \ ensure the change survives\nreboots:\n5 * * * * python3 /root/DOD_Banner_Config_Utility.py --persist-banner\nDOD_Banner_Config_Utility.py\n\
    Utility: import os, json, sys, time\n# Created by bdudley@dragos.com to assist with Dragos STIG implementation\n# specifically\
    \ related to DoD Banner for web UI before login\nos.chdir(\"/root\")\n# version compatibility check\nif 'Platform Version:\
    \ 2.4.' not in os.popen(\"dragoscmd version\").read():\n print(\"This version of the Dragos platform is incompatible with\
    \ this\nscript.\")\n exit()\nDOD_BANNER_JS = \"alert('You are accessing a U.S. Government (USG) Information\nSystem (IS)\
    \ that is provided for USG-authorized use only.\\\\nBy using this IS\n(which includes any device attached to this IS),\
    \ you consent to the following\nconditions:\\\\n-The USG routinely intercepts and monitors communications on this\nIS\
    \ for purposes including, but not limited to, penetration testing, COMSEC\nmonitoring, network operations and defense,\
    \ personnel misconduct (PM), law\nenforcement (LE), and counterintelligence (CI) investigations.\\\\n-At any time,\nthe\
    \ USG may inspect and seize data stored on this IS.\\\\n-Communications using,\nor data stored on, this IS are not private,\
    \ are subject to routine monitoring,\ninterception, and search, and may be disclosed or used for any USG-authorized\n\
    purpose.\\\\n-This IS includes security measures (e.g., authentication and access\ncontrols) to protect USG interests--not\
    \ for your personal benefit or\nprivacy.\\\\n-Notwithstanding the above, using this IS does not constitute\nconsent to\
    \ PM, LE or CI investigative searching or monitoring of the content of\nprivileged communications, or work product, related\
    \ to personal representation\nor services by attorneys, psychotherapists, or clergy, and their assistants.\nSuch communications\
    \ and work product are private and confidential. See User\nAgreement for details.');\"\nfstream = open('banner.js', 'w')\n\
    fstream.write(DOD_BANNER_JS)\nfstream.close()\n# get the platform-ui container id\nplatformui = os.popen(\"kubectl get\
    \ pods | grep platform-ui | grep -v platformui-logger | awk '{print $1}'\").read().strip()\nBANNER_DIR = '/usr/share/nginx/html/source/'\n\
    HTML_DIR = '/usr/share/nginx/html/'\nif \"--restore-defaults\" in sys.argv:\n print(\"Restoring to default, no banner.\"\
    )\n os.system(\"kubectl -n dragos-sitestore cp ./index.html.bak\n\"+platformui+\":\"+HTML_DIR+\"index.html\")\n print(\"\
    Done, reload the page to test changes.\")\n exit()\n# this will check periodically to make sure the banner changes persisted,\
    \ and\nre-apply them if not\nif \"--persist-banner\" in sys.argv:\n # check the current settings\n current_html = os.popen(\"\
    curl -k https://localhost\").read()\n if \"./source/banner.js\" in current_html:\n print(\"Banner is currently set, taking\
    \ no action.\")\n exit()\n else:\n fstream = open(\"banner.log\", \"a\")\n fstream.write(\"[\"+time.ctime().replace(\"\
    \ \", \"\")+\"] banner was not set,\nsetting banner now.\\n\")\n fstream.close()\n # put the banner js file in the appropriate\
    \ directory\n os.system(\"kubectl -n dragos-sitestore cp ./banner.js\n\"+platformui+\":\"+BANNER_DIR+\"banner.js\")\n\
    \ # update the current version of index.html in the pod\n os.system(\"kubectl -n dragos-sitestore cp ./index.html.patched\n\
    \"+platformui+\":\"+HTML_DIR+\"index.html\")\n exit()\n# is the sitestore up and running?\nif \"System is ready.\" not\
    \ in os.popen(\"dragoscmd system k3s status\").read():\n print(\"System is not ready, wait until all pods are started\
    \ before\nconfiguring banner.\")\n exit()\n# is there a backup of the old index.html file\nif os.path.exists('index.html.bak')\
    \ == False:\n print(\"Creating an index.html backup...\")\n os.system(\"kubectl -n dragos-sitestore cp\n\"+platformui+\"\
    :\"+HTML_DIR+\"index.html ./index.html.bak\")\n print(\"Done.\")\n# put the banner js file in the appropriate directory\n\
    os.system(\"kubectl -n dragos-sitestore cp ./banner.js\n\"+platformui+\":\"+BANNER_DIR+\"banner.js\")\n# perform appropriate\
    \ patching on the index.html backup\nfstream = open(\"index.html.bak\", \"r\")\nhtml = fstream.read()\nfstream.close()\n\
    original = '<script nonce=\"**CSP_NONCE**\" type=\"module\" crossorigin'\nreplacement = '<script src=\"./source/banner.js\"\
    \nnonce=\"**CSP_NONCE**\"></script><script nonce=\"**CSP_NONCE**\" type=\"module\"\ncrossorigin'\nfstream = open(\"index.html.patched\"\
    , \"w\")\nfstream.write(html.replace(original, replacement))\nfstream.close()\n# update the current version of index.html\
    \ in the pod\nos.system(\"kubectl -n dragos-sitestore cp ./index.html.patched\n\"+platformui+\":\"+HTML_DIR+\"index.html\"\
    )\nprint(\"Banner configuration changes complete, reload the login page (or logout)\nto see the popup. If the formatting\
    \ for the popup needs to be adjusted, make\nthe changes in the banner block above and re-run this script.\")\nprint(\"\
    \\nUse the below format to create a cron that makes the banner persist\nthrough reboots:\\n\\n*/5 * * * * python3 /root/DOD_Banner_Config_Utility.py\
    \ --\npersist-banner\\n\\n\")"
  checks:
  - type: manual_review
    info: 'Verify that the Standard Mandatory DOD Notice and Consent Banner appears before

      being granted access to Dragos Platform UI.

      If the Standard Mandatory DOD Notice is not presented, this is a finding.'
    severity: medium
- id: '1.5'
  title: DRAG-OT-000240
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Dragos Platform must only allow local administrative and service user accounts. GROUP ID: V-270919 RULE
    ID: SV-270919r1107124'
  rationale: 'Only two default accounts facilitate the initial setup and configuration of the Platform. These accounts provide
    immediate access to the system, allowing administrators to quickly get the system up and running without needing to create
    new user accounts during the initial installation phase. During maintenance, updates, or support operations, default accounts
    allow vendor support teams to access the system without needing to manage a variety of customerspecific accounts. This
    can streamline support activities and reduce downtime. Default accounts passwords need to be protected so they cannot
    be exploited by attackers to gain unauthorized access to the system. Satisfies: SRG-APP-000080, SRG-APP-000234'
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'Verify local user accounts.

    While logged in to the Dragos Platform with a user account with administrative

    privileges, navigate to Admin >> User Management >> Users.

    If any local user except the UI Administrator and DragOS CLI Service Account exists,

    this is a finding.'
  remediation: 'Remove users except the UI Administrator and DragOS CLI Service Account.

    While logged in to the Dragos Platform with a user account with administrative

    privileges, navigate to Admin >> User Management >> Users.

    Click the kebab menu next to the user and select "Delete User".

    Click "DELETE" in the verification window.'
  checks:
  - type: manual_review
    info: 'Verify local user accounts.

      While logged in to the Dragos Platform with a user account with administrative

      privileges, navigate to Admin >> User Management >> Users.

      If any local user except the UI Administrator and DragOS CLI Service Account exists,

      this is a finding.'
    severity: medium
- id: '1.6'
  title: DRAG-OT-000370
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Dragos Platform must have notification and audit services installed. GROUP ID: V-270932 RULE ID: SV-270932r1058029'
  rationale: Installing the Knowledge Pack(s) is essential for the Dragos Platform to provide comprehensive security monitoring,
    compliance, and operational visibility within industrial environments. It enhances the Platform's capabilities in detecting
    and responding to threats, ensuring regulatory compliance, and maintaining the overall security. It is critical for the
    appropriate personnel to be aware if a system is at risk of failing to process audit logs as required. The pack provides
    enhanced visibility into the operations of the Dragos Platform. This includes monitoring user activities, changes to system
    configurations, and other critical events. Improved visibility helps in identifying potential security issues and operational
    anomalies before they escalate into significant problems.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'Ensure all notification and audit services are functional.

    Log in to the SiteStore CLI and execute the following command:

    system k3s status

    If the message does not return "system is ready", this is a finding.

    (Note that for approximately 15–20 minutes after system startup or reboot, system will

    not be ready. Additionally, until the sensor is paired with a SiteStore, one pod on the

    sensor will not be ready).'
  remediation: 'If a notification does not appear, install KP-CW-24-001. This knowledge pack will add

    this and other notifications relevant to the STIG to the Dragos Platform.

    To add Knowledge Pack:

    While logged in to the Dragos Platform with a user account with administrative

    privileges, navigate to Admin >> SiteStore Management >> Knowledge Packs.

    Locate all STIG-KP_Plus Knowledge Pack(s).

    Click "Deploy" button next to the Knowledge Pack(s).

    Fill in the form and click "DEPLOY".'
  checks:
  - type: manual_review
    info: 'Ensure all notification and audit services are functional.

