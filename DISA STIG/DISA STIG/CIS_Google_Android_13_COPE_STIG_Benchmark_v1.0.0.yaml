  title: GOOG-13-010400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Google Android 13 work profile must be configured to disable automatic completion of work space internet
    browser text input. GROUP ID: V-254791 RULE ID: SV-254791r959010'
  rationale: 'The autofill functionality in the web browser allows the user to complete a form that contains sensitive information,
    such as personally identifiable information (PII), without previous knowledge of the information. By allowing the use
    of autofill functionality, an adversary who learns a user''s Android 13 device password, or who otherwise is able to unlock
    the device, may be able to further breach other systems by relying on the autofill feature to provide information unknown
    to the adversary. By disabling the autofill functionality, the risk of an adversary gaining further information about
    the device''s user or compromising other systems is significantly mitigated. SFR ID: FMT_SMF_EXT.1.1 #47'
  impact: ''
  references: []
