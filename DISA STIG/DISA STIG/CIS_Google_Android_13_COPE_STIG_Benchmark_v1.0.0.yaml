    that users are prevented from adding personal email accounts to the work email app.

    This procedure is performed on both the EMM Administrator console and the managed

    Google Android 13 device.

    COPE:

    On the EMM console:

    1. Open "Set user restrictions".

    2. Verify "Disallow modify accounts" is toggled to "ON".

    On the managed Google Android 13 device:

    1. Open Settings.

    2. Tap "Passwords & accounts".

    3. Select "Work".

    4. Tap "Add account".

    5. Verify a message is displayed to the user stating "Action not allowed".

    If on the EMM console the restriction to "Disallow modify accounts" is not set, or on the

    managed Android 13 device the user is able to add an account in the Work section, this

    is a finding.'
  remediation: 'Configure the Google Android 13 device to prevent users from adding personal email

    accounts to the work email app.

    On the EMM console:

    COPE:

    1. Open "Set user restrictions".

    2. Toggle "Disallow modify accounts" to "ON".

    Refer to the EMM documentation to determine how to provision users'' work email

    accounts for the work email app.'
