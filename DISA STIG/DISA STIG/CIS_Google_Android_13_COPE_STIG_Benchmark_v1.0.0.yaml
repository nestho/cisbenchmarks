  profile:
  - 'SEVERITY: CAT II'
  description: 'The Google Android 13 work profile must be configured to prevent users from adding personal email accounts
    to the work email app. GROUP ID: V-254788 RULE ID: SV-254788r959010'
  rationale: 'If the user is able to add a personal email account (POP3, IMAP, EAS) to the work email app, it could be used
    to forward sensitive DOD data to unauthorized recipients. Restricting email account addition to the administrator or restricting
    email account addition to allowlisted accounts mitigates this vulnerability. SFR ID: FMT_SMF_EXT.1.1 #47'
  impact: ''
  references: []
