- id: '1.22'
  title: GOOG-13-009800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 13 users must complete required training. GROUP ID: V-254785 RULE ID: SV-254785r1042507'
  rationale: 'The security posture of Google devices requires the device user to configure several required policy rules on
    their device. User-Based Enforcement (UBE) is required for these controls. In addition, if the authorizing official (AO)
    has approved the use of an unmanaged personal space, the user must receive training on risks. If a user is not aware of
    their responsibilities and does not comply with UBE requirements, the security posture of the Google mobile device may
    become compromised, and DOD sensitive data may become compromised. SFR ID: NA'
  impact: ''
  references: []
  page_start: 58
  audit_raw: 'Review a sample of site User Agreements for Google Android 13 device users or similar

    training records and training course content.

    Verify that the Google Android 13 device users have completed the required training.

    The intent is that required training is renewed on a periodic basis in a time period

    determined by the AO.

    If any Google Android 13 device user has not completed the required training, this is a

    finding.'
  remediation: 'All Google Android 13 device users must complete training on the following training

    topics (users must acknowledge that they have reviewed training via a signed User

    Agreement or similar written record):

    • Operational security concerns introduced by unmanaged

    applications/unmanaged personal space, including applications using global

    positioning system (GPS) tracking.

    • Need to ensure no DOD data is saved to the personal space or transmitted from

    a personal app (for example, from personal email).

    • If the Purebred key management app is used, users are responsible for

    maintaining positive control of their credentialed device at all times. The DOD

    PKI certificate policy requires subscribers to maintain positive control of the

    devices that contain private keys and to report any loss of control so the

    credentials can be revoked. Upon device retirement, turn-in, or reassignment,

    ensure that a factory data reset is performed prior to device handoff. Follow

    mobility service provider decommissioning procedures as applicable.

    • How to configure the following UBE controls (users must configure the control)

    on the Google device:

    • **Secure use of Calendar Alarm.

    • **Local screen mirroring and Mirroring procedures (authorized/not authorized for

    use).

    • **Do not upload DOD contacts via smart call and caller ID services.

    • **Do not remove DOD intermediate and root PKI digital certificates.

    • **Disable Wi-Fi Sharing.

    • **Do not configure a DOD network (work) VPN profile on any third-party VPN

    client installed in the personal space.

    • **If Bluetooth connections are approved for mobile device, types of allowed

    connections (for example car hands-free, but not Bluetooth wireless keyboard).

    • **How to perform a full device wipe.

    • **Use default Wi-Fi hotspot password: 15-character complex Wi-Fi hotspot

    preshared password enabled ("WPA2/WPA3-personal").

    • AO guidance on acceptable use and restrictions, if any, on downloading and

    installing personal apps and data (music, photos, etc.) in the Google device

    personal space.'
  checks:
  - type: manual_review
    info: 'Review a sample of site User Agreements for Google Android 13 device users or similar

      training records and training course content.

      Verify that the Google Android 13 device users have completed the required training.

      The intent is that required training is renewed on a periodic basis in a time period

      determined by the AO.

      If any Google Android 13 device user has not completed the required training, this is a

      finding.'
    severity: medium
- id: '1.23'
  title: GOOG-13-009900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 13 must be configured to enforce that Wi-Fi Sharing is disabled. GROUP ID: V-254786 RULE ID:
    SV-254786r959010'
  rationale: 'Wi-Fi Sharing is an optional configuration of Wi-Fi Tethering/Mobile Hotspot, which allows the device to share
    its Wi-Fi connection with other wirelessly connected devices instead of its mobile (cellular) connection. Wi-Fi Sharing
    grants the "other" device access to a corporate Wi-Fi network and may possibly bypass the network access control mechanisms.
    This risk can be partially mitigated by requiring the use of a preshared key for personal hotspots. SFR ID: FMT_SMF_EXT.1.1
    #47'
  impact: ''
  references: []
  page_start: 60
  audit_raw: 'Review device configuration settings to confirm Wi-Fi Sharing is disabled.

    Mobile Hotspot must be enabled to enable Wi-Fi Sharing. If the Authorizing Official (AO)

    has not approved Mobile Hotspot, and it has been verified as disabled on the EMM

    console, no further action is needed.

    If Mobile Hotspot is being used, use the following procedure to verify Wi-Fi Sharing is

    disabled:

    On the EMM console:

    COBO:

    1. Open "Set user restrictions".

    2. Verify "Disallow config tethering" is toggled to "ON".

    COPE:

    1. Open "Set user restrictions on parent".

    2. Toggle "Disallow config tethering" to "ON".

    On the managed Google Android 13 device:

    COBO and COPE:

    1. Go to Settings >> Network & Internet.

    2. Verify "Hotspot & tethering" is "Controlled by admin".

    3. Verify that tapping "Hotspot & tethering" provides a prompt to the user specifying

    "Action not allowed".

    If on the managed Google Android 13 device "Hotspot & tethering" is enabled, this is a

    finding.'
  remediation: 'Configure the Google Android 13 device to disable Wi-Fi Sharing.

    Mobile Hotspot must be enabled to enable Wi-Fi Sharing. If the AO has not approved

    Mobile Hotspot, and it has been disabled on the EMM console, no further action is

    needed.

    If Mobile Hotspot is being used, use the following procedure to disable Wi-Fi Sharing:

    On the EMM console:

    COBO:

    1. Open "Set user restrictions".

    2. Toggle "Disallow config tethering" to "ON".

    COPE:

    1. Open "Set user restrictions on parent".

    2. Toggle "Disallow config tethering" to "ON".'
  checks:
  - type: manual_review
    info: 'Review device configuration settings to confirm Wi-Fi Sharing is disabled.

