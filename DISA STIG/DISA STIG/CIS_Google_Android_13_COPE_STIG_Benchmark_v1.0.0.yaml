- id: '1.1'
  title: GOOG-13-002800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 13 must be configured to enable audit logging. GROUP ID: V-254764 RULE ID: SV-254764r959010'
  rationale: 'Audit logs enable monitoring of security-relevant events and subsequent forensics when breaches occur. To be
    useful, administrators must have the ability to view the audit logs. SFR ID: FMT_SMF_EXT.1.1 #32'
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'Inspect the configuration on the managed Google Android 13 device to enable audit

    logging.

    This validation procedure is performed only on the EMM Administration Console.

    On the EMM console:

    COBO and COPE:

    1. Open "Device owner management" section.

    2. Verify that "Enable security logging" is toggled to "ON".

    If the EMM console device policy is not set to enable audit logging, this is a finding.'
  remediation: 'Configure the Google Android 13 device to enable audit logging.

    On the EMM console:

    COBO and COPE:

    1. Open "Device owner management" section.

    2. Toggle "Enable security logging" to "ON".'
  checks:
  - type: manual_review
    info: 'Inspect the configuration on the managed Google Android 13 device to enable audit

      logging.

      This validation procedure is performed only on the EMM Administration Console.

      On the EMM console:

      COBO and COPE:

      1. Open "Device owner management" section.

      2. Verify that "Enable security logging" is toggled to "ON".

      If the EMM console device policy is not set to enable audit logging, this is a finding.'
    severity: medium
- id: '1.2'
  title: GOOG-13-006000
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 13 must be configured to enforce a minimum password length of six characters. GROUP ID: V-254765
    RULE ID: SV-254765r1015723'
  rationale: 'Password strength is a measure of the effectiveness of a password in resisting guessing and brute force attacks.
    The ability to crack a password is a function of how many attempts an adversary is permitted, how quickly an adversary
    can do each attempt, and the size of the password space. The longer the minimum length of the password is, the larger
    the password space. Having a too-short minimum password length significantly reduces password strength, increasing the
    chance of password compromise and resulting device and data compromise. SFR ID: FMT_SMF_EXT.1.1 #1a'
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'Review managed Google Android 13 device configuration settings to determine if the

    mobile device is enforcing a minimum password length of six characters.

    This validation procedure is performed on both the EMM Administration Console and

    the managed Google Android 13 device.

    On the EMM console:

    COBO:

    1. Open "Lock screen" settings.

    2. Open "Password constraints".

    3. Open "Minimum password quality".

    4. Verify Numeric Complex, Alphabetic, Alphanumeric, or Complex is selected.

    5. Open "Minimum password length".

    6. Verify "6" is set for number of characters.

    COPE:

    1. Open "Lock screen" settings.

    2. Open "Password constraints".

    3. Select "Personal Profile".

    4. Verify "Minimum password quality" is set to Numeric Complex, Alphabetic,

    Alphanumeric, or Complex.

    5. Open "Minimum password length".

    6. Verify the number of characters is set to "6" or higher.

    On the managed Google Android 13 device:

    COBO and COPE:

    1. Open Settings >> Security >> Screen lock.

    2. Enter current password.

    3. Tap "Pin or Password".

    4. Verify Password length required is at least "6".

    If the device password length is not set to six characters or more on EMM console or on

    the managed Google Android 13 device, this is a finding.'
  remediation: 'Configure the Google Android 13 device to enforce a minimum password length of six

    characters.

    On the EMM console:

    COBO:

    1. Open "Lock screen" settings.

    2. Open "Password constraints".

    3. Open "Minimum password quality".

    4. Choose Numeric Complex, Alphabetic, Alphanumeric, or Complex.

    5. Open "Minimum password length".

    6. Enter in the number of characters as "6".

    COPE:

    1. Open "Lock screen" settings.

    2. Open "Password constraints".

    3. Select "Personal Profile".

    4. Open "Minimum password quality".

    5. Choose Numeric Complex, Alphabetic, Alphanumeric, or Complex.

    6. Open "Minimum password length".

    7. Enter in the number of characters as "6".'
  checks:
  - type: manual_review
    info: 'Review managed Google Android 13 device configuration settings to determine if the

      mobile device is enforcing a minimum password length of six characters.

      This validation procedure is performed on both the EMM Administration Console and

      the managed Google Android 13 device.

      On the EMM console:

      COBO:

      1. Open "Lock screen" settings.

      2. Open "Password constraints".

      3. Open "Minimum password quality".

      4. Verify Numeric Complex, Alphabetic, Alphanumeric, or Complex is selected.

      5. Open "Minimum passw'
    severity: medium
- id: '1.3'
  title: GOOG-13-006100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 13 must be configured to not allow passwords that include more than four repeating or sequential
    characters. GROUP ID: V-254766 RULE ID: SV-254766r959010'
  rationale: 'Password strength is a measure of the effectiveness of a password in resisting guessing and brute force attacks.
    Passwords that contain repeating or sequential characters are significantly easier to guess than those that do not contain
    repeating or sequential characters. Therefore, disallowing repeating or sequential characters increases password strength
    and decreases risk. SFR ID: FMT_SMF_EXT.1.1 #1b'
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Review managed Google Android 13 device configuration settings to determine if the

    mobile device is prohibiting passwords with more than four repeating or sequential

    characters.

    This validation procedure is performed on both the EMM Administration Console and

    the managed Google Android 13 device.

    On the EMM console:

    COBO:

    1. Open "Lock screen" settings.

    2. Open "Password constraints".

    3. Verify that quality is set to "Numeric (Complex)" or higher.

    COPE:

    1. Open "Lock screen" settings.

    2. Open "Password constraints".

    3. Select "Personal Profile".

    4. Verify that quality is set to "Numeric (Complex)" or higher.

    On the managed Google Android 13 device:

    COBO and COPE:

    1. Open Settings >> Security >> Screen lock.

    2. Enter current password.

    3. Select "PIN".

    4. Try to enter a new PIN with repeating numbers.

    5. Verify Password complexity requirements are listed: Ascending, descending, or

    repeated sequence of digits is not allowed.

    If the EMM console device policy is set to a password with more than two repeating or

    sequential characters or on the managed Google Android 13 device, the device policy is

    set to a password with more than two repeating or sequential characters, this is a

    finding.

    Note: Alphabetic, Alphanumeric, and Complex are also acceptable selections, but these

    selections will cause the user to select a complex password, which is not required by

    the STIG.'
  remediation: 'Configure the Google Android 13 device to prevent passwords from containing more

    than four repeating or sequential characters.

    On the EMM console:

    COBO:

    1. Open "Lock screen" settings.

    2. Open "Password constraints".

    3. Set password quality to "Numeric (Complex)".

    COPE:

    1. Open "Password constraints".

    2. Select "Personal Profile".

    3. Set password quality to "Numeric (Complex)".

    Note: Alphabetic, Alphanumeric, and Complex are also acceptable selections, but these

    selections will cause the user to select a complex password, which is not required by

    the STIG.'
  checks:
  - type: manual_review
    info: 'Review managed Google Android 13 device configuration settings to determine if the

      mobile device is prohibiting passwords with more than four repeating or sequential

      characters.

      This validation procedure is performed on both the EMM Administration Console and

      the managed Google Android 13 device.

      On the EMM console:

      COBO:

      1. Open "Lock screen" settings.

      2. Open "Password constraints".

      3. Verify that quality is set to "Numeric (Complex)" or higher.

      COPE:

      1. Open "Lock screen" settings.

      2. Open "P'
    severity: medium
- id: '1.4'
  title: GOOG-13-006200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 13 must be configured to enable a screen-lock policy that will lock the display after a period
    of inactivity. GROUP ID: V-254767 RULE ID: SV-254767r958402'
  rationale: 'The screen-lock timeout helps protect the device from unauthorized access. Devices without a screen-lock timeout
    provide an opportunity for adversaries who gain physical access to the mobile device through loss, theft, etc. Such devices
    are much more likely to be in an unlocked state when acquired by an adversary, thus granting immediate access to the data
    on the mobile device and possibly access to DOD networks. SFR ID: FMT_SMF_EXT.1.1 #2a'
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'Review managed Google Android 13 device configuration settings to determine if the

    mobile device is enforcing a screen-lock policy that will lock the display after a period of

    inactivity.

    This validation procedure is performed on both the EMM Administration Console and

    the managed Google Android 13 device.

    On the EMM Console:

    COBO:

    1. Open "Lock screen" settings.

    2. Open "Lock screen restrictions".

    3. Verify that "Max time to screen lock" is set to any number desired, the units are in

    seconds.

    COPE:

    1. Open "Lock screen" settings.

    2. Open "Lock screen restrictions".

    3. Select "Personal Profile".

    4. Verify that "Max time to screen lock" is set to any number desired, the units are in

    seconds.

    On the managed Google Android 13 device:

    COBO and COPE:

    1. Open Settings >> Display.

    2. Tap "Screen timeout".

    3. Ensure the Screen timeout value is set to the desired value and cannot be set to

    a larger value.

    If the EMM console device policy is not set to enable a screen-lock policy that will lock

    the display after a period of inactivity or on the managed Google Android 13 device, the

    device policy is not set to enable a screen-lock policy that will lock the display after a

    period of inactivity, this is a finding.'
  remediation: 'Configure the Google Android 13 device to enable a screen-lock policy that will lock the

    display after a period of inactivity.

    On the EMM Console:

    COBO:

    1. Open "Lock screen" settings.

    2. Open "Lock screen restrictions".

    3. Set "Max time to screen lock" to any number desired.

    4. Note: The units are in seconds.

    COPE:

    1. Open "Lock screen" settings.

    2. Open "Lock screen restrictions".

    3. Select "Personal Profile".

    4. Set "Max time to screen lock" to any number desired.

    5. Note: The units are in seconds.'
  checks:
  - type: manual_review
    info: 'Review managed Google Android 13 device configuration settings to determine if the

      mobile device is enforcing a screen-lock policy that will lock the display after a period of

      inactivity.

      This validation procedure is performed on both the EMM Administration Console and

      the managed Google Android 13 device.

      On the EMM Console:

      COBO:

      1. Open "Lock screen" settings.

      2. Open "Lock screen restrictions".

      3. Verify that "Max time to screen lock" is set to any number desired, the units are in

      seconds.

      C'
    severity: medium
- id: '1.5'
  title: GOOG-13-006300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 13 must be configured to lock the display after 15 minutes (or less) of inactivity. GROUP ID:
    V-254768 RULE ID: SV-254768r958402'
  rationale: 'The screen lock timeout must be set to a value that helps protect the device from unauthorized access. Having
    a too-long timeout would increase the window of opportunity for adversaries who gain physical access to the mobile device
    through loss, theft, etc. Such devices are much more likely to be in an unlocked state when acquired by an adversary,
    thus granting immediate access to the data on the mobile device. The maximum timeout period of 15 minutes has been selected
    to balance functionality and security; shorter timeout periods may be appropriate depending on the risks posed to the
    mobile device. SFR ID: FMT_SMF_EXT.1.1 #2b'
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Review managed Google Android device configuration settings to determine if the

    mobile device is enforcing a screen-lock policy that will lock the display after a period of

    15 minutes or less of inactivity.

    Note: Google Android 13 does not support the 15 minute increment. The available

    allowable selection is 10 mins then increases to 30 minutes. Therefore, the control

    should be set to 10 minutes.

    This validation procedure is performed on both the EMM Administration Console and

    the Android 13 device.

    On the EMM Console:

    COBO:

    1. Open "Lock screen restrictions".

    2. Verify that "Max time to screen lock" is set to "600".

    3. Note: The units are in seconds.

    COPE:

    1. Open "Lock screen restrictions".

    2. Select "Personal Profile".

    3. Verify that "Max time to screen lock" is set to "600".

    4. Note: The units are in seconds.

    On the managed Google Android 13 device:

    COBO and COPE:

    1. Open Settings >> Display.

    2. Tap "Screen timeout".

    3. Ensure the Screen timeout value is set to "600" seconds.

    If the EMM console device policy is not set to enable a screen-lock policy that will lock

    the display after a period of inactivity of 600 seconds, this is a finding.'
  remediation: 'Configure the Google Android 13 device to enable a screen-lock policy of 15 minutes for

    the max period of inactivity.

    Note: Google Android 13 does not support the 15 minute increment. The available

    allowable selection is 10 mins then increases to 30 minutes. Therefore, the control will

    be set to 10 minutes.

    On the EMM Console:

    COBO:

    1. Open "Lock screen restrictions".

    2. Set "Max time to screen lock" to "600".

    3. Note: The units are in seconds.

    COPE:

    1. Open "Lock screen restrictions".

    2. Select "Personal Profile".

    3. Set "Max time to screen lock" to "600".

    4. Note: The units are in seconds.'
  checks:
  - type: manual_review
    info: 'Review managed Google Android device configuration settings to determine if the

      mobile device is enforcing a screen-lock policy that will lock the display after a period of

      15 minutes or less of inactivity.

      Note: Google Android 13 does not support the 15 minute increment. The available

      allowable selection is 10 mins then increases to 30 minutes. Therefore, the control

      should be set to 10 minutes.

      This validation procedure is performed on both the EMM Administration Console and

      the Android 13 dev'
    severity: medium
- id: '1.6'
  title: GOOG-13-006400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 13 must be configured to not allow more than 10 consecutive failed authentication attempts.
    GROUP ID: V-254769 RULE ID: SV-254769r958388'
  rationale: 'The more attempts an adversary has to guess a password, the more likely the adversary will enter the correct
    password and gain access to resources on the device. Setting a limit on the number of attempts mitigates this risk. Setting
    the limit at 10 or less gives authorized users the ability to make a few mistakes when entering the password but still
    provides adequate protection against dictionary or brute force attacks on the password. SFR ID: FMT_SMF_EXT.1.1 #2c, FIA_AFL_EXT.1.5'
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'Review managed Google Android 13 device configuration settings to determine if the

    mobile device has the maximum number of consecutive failed authentication attempts

    set at 10 or fewer.

    This validation procedure is performed on both the EMM Administration Console and

    the managed Google Android 13 device.

    On the EMM Console:

    COBO:

    1. Open "Lock screen" settings.

    2. Open "Lock screen restrictions".

    3. Verify that "Max password failures for local wipe" is set to a number between 1

    and 10.

    COPE:

    1. Open "Lock screen" settings.

    2. Open "Lock screen restrictions".

    3. Select "Personal Profile".

    4. Verify that "Max password failures for local wipe" is set to a number between 1

    and 10.

    On the managed Google Android 13 device:

    COBO and COPE:

    1. Lock the device screen.

    2. Attempt to unlock the screen and validate that the device autowipes after

    specified number of invalid entries. Note: Perform this verification only with a test

    phone set up with a production profile.

    If the EMM console device policy is not set to the maximum number of consecutive

    failed authentication attempts at 10 or fewer, or if on the managed Google Android 13

    device the device policy is not set to the maximum number of consecutive failed

    authentication attempts at 10 or fewer, this is a finding.'
  remediation: 'Configure the Google Android 13 device to allow only 10 or fewer consecutive failed

    authentication attempts.

    On the EMM Console:

    COBO:

    1. Open "Lock screen" settings.

    2. Open "Lock screen restrictions".

    3. Set "Max password failures for local wipe" to a number between 1 and 10.

    COPE:

    1. Open "Lock screen" settings.

    2. Open "Lock screen restrictions".

    3. Select "Personal Profile".

    4. Set "Max password failures for local wipe" to a number between 1 and 10.'
  checks:
  - type: manual_review
    info: 'Review managed Google Android 13 device configuration settings to determine if the

      mobile device has the maximum number of consecutive failed authentication attempts

      set at 10 or fewer.

      This validation procedure is performed on both the EMM Administration Console and

      the managed Google Android 13 device.

      On the EMM Console:

      COBO:

      1. Open "Lock screen" settings.

      2. Open "Lock screen restrictions".

      3. Verify that "Max password failures for local wipe" is set to a number between 1

      and 10.

      COPE:

      1. '
    severity: medium
- id: '1.7'
  title: GOOG-13-006500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 13 must be configured to enforce an application installation policy by specifying one or more
    authorized application repositories, including [selection: DODapproved commercial app repository, MDM server, mobile application
    store]. GROUP ID: V-254770 RULE ID: SV-254770r959010'
  rationale: 'Forcing all applications to be installed from authorized application repositories can prevent unauthorized and
    malicious applications from being installed and executed on mobile devices. Allowing such installations and executions
    could cause a compromise of DOD data accessible by these unauthorized/malicious applications. SFR ID: FMT_SMF_EXT.1.1
    #8a'
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'Review managed Google Android 13 device configuration settings to determine if the

    mobile device has only approved application repositories (DOD-approved commercial

    app repository, EMM server, and/or mobile application store).

    This validation procedure is performed on both the EMM Administration Console and

    the managed Google Android 13 device.

    On the EMM Console:

    COBO and COPE:

    1. Open "Set user restrictions".

    2. Verify that "Disallow install unknown sources" is toggled to "ON".

    3. Verify that "Disallow installs from unknown sources globally" is toggled to "ON".

    On the Google Android 13 device:

    COBO and COPE:

    1. Open Settings >> Apps >> Special app access.

    2. Open Install unknown apps.

    3. Ensure the list of apps is blank or if an app is on the list, "Disabled by admin" is

    listed under the app name.

    If the EMM console device policy is not set to allow connections to only approved

    application repositories or on the managed Google Android 13 device, the device policy

    is not set to allow connections to only approved application repositories, this is a finding.'
  remediation: 'Configure the Google Android 13 device to disable unauthorized application

    repositories.

    On the EMM Console:

    COBO and COPE:

    1. Open "Set user restrictions".

    2. Toggle "Disallow install unknown sources" to "ON".

    3. Toggle "Disallow installs from unknown sources globally" to "ON".'
  checks:
  - type: manual_review
    info: 'Review managed Google Android 13 device configuration settings to determine if the

      mobile device has only approved application repositories (DOD-approved commercial

      app repository, EMM server, and/or mobile application store).

      This validation procedure is performed on both the EMM Administration Console and

