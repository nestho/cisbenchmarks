  references: []
  page_start: 54
  audit_raw: 'Determine if the AO has approved the use of Bluetooth at the site.

    If the AO has not approved the use of Bluetooth, verify Bluetooth has been disabled.

    On the EMM console:

    COBO:

    1. Open "User restrictions" section.

    2. Verify "Disallow Bluetooth" is toggled to "ON".

    COPE:

    1. Open "User restrictions on parent" section.

    2. Verify "Disallow Bluetooth" is toggled to "ON".

    On the managed Google Android 13 device:

    COBO and COPE:

    1. Go to Settings >> Connected Devices >> Connection Preferences >> Bluetooth.

    2. Verify "Use Bluetooth" is set to OFF and cannot be toggled to "ON".

    If the AO has approved the use of Bluetooth, on the managed Android 13 device:

    1. Go to Settings >> Connected Devices.

    2. Verify only approved Bluetooth connected devices using approved profiles are

    listed.

    If the AO has not approved the use of Bluetooth, and Bluetooth use is not disabled via

    an EMM-managed device policy, this is a finding.

    If the AO has approved the use of Bluetooth, and Bluetooth devices using unauthorized

    Bluetooth profiles are listed on the device under "Connected devices", this is a finding.'
  remediation: 'Configure the Google Android 13 device to disable Bluetooth or if the AO has approved

    the use of Bluetooth (for example, for car hands-free use), train the user to connect to

    only authorized Bluetooth devices using only HSP, HFP, or SPP Bluetooth capable

    devices (UBE).

    To disable Bluetooth use the following procedure:

    On the EMM Console:

    COBO:

    1. Open "User restrictions" section.

    2. Toggle "Disallow Bluetooth" to "ON".

    COPE:

    1. Open "User restrictions on parent" section.

    2. Toggle "Disallow Bluetooth" to "ON".

    The user training requirement is satisfied in requirement GOOG-13-009800.'
