  description: 'Google Android 13 must be configured to disallow configuration of date and time. GROUP ID: V-254793 RULE ID:
    SV-254793r959010'
  rationale: 'Determining the correct time a particular application event occurred on a system is critical when conducting
    forensic analysis and investigating system events. Periodically synchronizing internal clocks with an authoritative time
    source is necessary to correctly correlate the timing of events that occur across the enterprise. The three authoritative
    time sources for Google Android 13 are an authoritative time server that is synchronized with redundant United States
    Naval Observatory (USNO) time servers as designated for the appropriate DOD network (NIPRNet or SIPRNet), or the Global
    Positioning System (GPS), or the wireless carrier. Time stamps generated by the audit system in Google Android 13 must
    include both date and time. The time may be expressed in Coordinated Universal Time (UTC), a modern continuation of Greenwich
    Mean Time (GMT), or local time with an offset from UTC. SFR ID: FMT_SMF_EXT.1.1 #47'
