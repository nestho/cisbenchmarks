  audit_raw: 'Review the Google Android 13 work profile configuration settings to confirm that autofill

    services are disabled.

    This procedure is performed only on the EMM Administration console.

    On the EMM console:

    COPE:

    1. Open "Set user restrictions".

    2. Verify "Disable autofill" is toggled to "ON".

    If on the EMM console "disallow autofill" is not selected, this is a finding.'
  remediation: 'Configure the Google Android 13 device work profile to disable the autofill services.

