- id: '1.29'
  title: GOOG-13-010500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Google Android 13 work profile must be configured to disable the autofill services. GROUP ID: V-254792
    RULE ID: SV-254792r959010'
  rationale: 'The autofill services allow the user to complete text inputs that could contain sensitive information, such
    as personally identifiable information (PII), without previous knowledge of the information. By allowing the use of autofill
    services, an adversary who learns a user''s Android 13 device password, or who otherwise is able to unlock the device,
    may be able to further breach other systems by relying on the autofill services to provide information unknown to the
    adversary. By disabling the autofill services, the risk of an adversary gaining further information about the device''s
    user or compromising other systems is significantly mitigated. Examples of apps that offer autofill services include Samsung
    Pass, Google, Dashlane, LastPass, and 1Password. SFR ID: FMT_SMF_EXT.1.1 #47'
  impact: ''
  references: []
