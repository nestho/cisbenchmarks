  title: GOOG-13-006800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 13 must be configured to not display the following (work profile) notifications when the device
    is locked: [selection: a. email notifications b. calendar appointments c. contact associated with phone call notification
    d. text message notification e. other application-based notifications f. all notifications]. GROUP ID: V-254773 RULE ID:
    SV-254773r959010'
  rationale: 'Many mobile devices display notifications on the lock screen so that users can obtain relevant information in
    a timely manner without having to frequently unlock the phone to determine if there are new notifications. However, in
    many cases, these notifications can contain sensitive information. When they are available on the lock screen, an adversary
    can see them merely by being in close physical proximity to the device. Configuring the mobile operating system (MOS)
    to not send notifications to the lock screen mitigates this risk. SFR ID: FMT_SMF_EXT.1.1 #18'
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'Review managed Google Android 13 device settings to determine if the Google Android

