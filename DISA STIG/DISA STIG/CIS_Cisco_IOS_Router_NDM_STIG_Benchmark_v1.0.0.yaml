      If the Cisco router is not configured to terminate all network connections associated with

      a device management after five minutes of inactivity, this is a fi'
    severity: medium
- id: '1.26'
  title: CISC-ND-000880
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to automatically audit account enabling actions. GROUP ID: V-215689 RULE
    ID: SV-215689r879696'
  rationale: Once an attacker establishes initial access to a system, the attacker often attempts to create a persistent method
    of reestablishing access. One way to accomplish this is for the attacker to simply enable a new or disabled account. Notification
    of account enabling is one method for mitigating this risk. A comprehensive account management process will ensure an
    audit trail which documents the creation of application user accounts and notifies administrators and Information System
    Security Officers (ISSO). Such a process greatly reduces the risk that accounts will be surreptitiously created and provides
    logging that can be used for forensic purposes.
  impact: ''
  references: []
  page_start: 57
  audit_raw: 'Review the router configuration to determine if it automatically audits account enabling.

    The configuration should look similar to the example below:

    archive

    log config

    logging enable

    Note: Configuration changes can be viewed using the show archive log config all

    command.

    If account enabling is not automatically audited, this is a finding.'
