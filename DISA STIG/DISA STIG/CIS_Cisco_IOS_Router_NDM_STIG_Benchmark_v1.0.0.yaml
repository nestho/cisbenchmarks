    severity: medium
- id: '1.18'
  title: CISC-ND-000550
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to enforce a minimum 15-character password length. GROUP ID: V-215681
    RULE ID: SV-215681r879601'
  rationale: Password complexity or strength is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. Password length is one of several that helps to determine strength and how long it takes to crack
    a password. The shorter the password, the lower the number of possible combinations that need to be tested before the
    password is compromised. Use of more characters in a password helps to exponentially increase the time and/or resources
    required to compromise the password.
  impact: ''
  references: []
  page_start: 41
  audit_raw: 'Review the Cisco router configuration to verify that it is compliant with this requirement

    as shown in the example below.

    aaa new-model

    !

    !

    aaa common-criteria policy PASSWORD_POLICY

    min-length 15

    If the Cisco router is not configured to enforce a minimum 15-character password

    length, this is a finding.'
  remediation: 'Configure the Cisco router to enforce a minimum 15-character password length as

    shown in the example below.

    R1(config)#aaa common-criteria policy PASSWORD_POLICY

    R1(config-cc-policy)#min-length 15

    R1(config-cc-policy)#exit'
  checks:
  - type: manual_review
    info: 'Review the Cisco router configuration to verify that it is compliant with this requirement

      as shown in the example below.

      aaa new-model

      !

      !

      aaa common-criteria policy PASSWORD_POLICY

