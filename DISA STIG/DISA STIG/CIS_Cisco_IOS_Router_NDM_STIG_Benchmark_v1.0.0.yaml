      ip http secure-server

      …

      …

      …

      radius-server host x.x.x.x auth-port 1812 acct-port 1813 key xxxxxxx

      radius-server host x.'
    severity: medium
- id: '1.40'
  title: CISC-ND-001410
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to back up the configuration when changes occur. GROUP ID: V-215710 RULE
    ID: SV-215710r916221'
  rationale: System-level information includes default and customized settings and security attributes, including ACLs that
    relate to the network device configuration, as well as software required for the execution and operation of the device.
    Information system backup is a critical step in ensuring system integrity and availability. If the system fails and there
    is no backup of the system-level information, a denial of service condition is possible for all who utilize this critical
    network component. This control requires the network device to support the organizational central backup process for system-level
    information associated with the network device. This function may be provided by the network device itself; however, the
    preferred best practice is a centralized backup rather than each network device performing discrete backups.
  impact: ''
  references: []
  page_start: 85
  audit_raw: 'Review the Cisco router configuration to verify that it is compliant with this requirement.

    The example configuration below will send the configuration to a TFTP server when a

    configuration change occurs.

    event manager applet BACKUP_CONFIG

    event syslog pattern "%SYS-5-CONFIG_I"

    action 1 info type routername

    action 2 cli command "enable"

    action 3 cli command "copy run tftp" pattern "remote host"

    action 4 cli command "x.x.x.x" pattern "filename"

    action 5 cli command "$_info_routername-config"

    action 6 syslog priority informational msg "Configuration backup was executed"

    If the Cisco router is not configured to conduct backups of the configuration when

    changes occur, this is a finding.'
  remediation: 'Configure the Cisco router to send the configuration to an TFTP or FTP server when a

    configuration change occurs as shown in the example below.

    R4(config)#event manager applet BACKUP_CONFIG

    R4(config-applet)#event syslog pattern "%SYS-5-CONFIG_I"

    R4(config-applet)#action 1 cli command "enable"

    R4(config-applet)#action 2 info type routername

    R4(config-applet)#action 3 cli command "copy run tftp" pattern "remote host"

    R4(config-applet)#action 4 cli command "x.x.x.x" pattern "filename"

    R4(config-applet)#action 5 cli command "$_info_routername-config"

    R4(config-applet)#action 6 syslog priority informational msg "Configuration backup was

    executed"

    R4(config-applet)#end'
  checks:
  - type: manual_review
    info: 'Review the Cisco router configuration to verify that it is compliant with this requirement.

      The example configuration below will send the configuration to a TFTP server when a

      configuration change occurs.

      event manager applet BACKUP_CONFIG

      event syslog pattern "%SYS-5-CONFIG_I"

      action 1 info type routername

      action 2 cli command "enable"

      action 3 cli command "copy run tftp" pattern "remote host"

      action 4 cli command "x.x.x.x" pattern "filename"

      action 5 cli command "$_info_routername-config"

      acti'
    severity: medium
