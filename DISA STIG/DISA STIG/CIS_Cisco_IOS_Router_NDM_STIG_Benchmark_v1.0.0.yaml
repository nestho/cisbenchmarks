  title: CISC-ND-001450
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco router must be configured to send log data to at least two syslog servers for the purpose of forwarding
    alerts to the administrators and the ISSO. GROUP ID: V-220136 RULE ID: SV-220136r916114'
  rationale: The aggregation of log data kept on a syslog server can be used to detect attacks and trigger an alert to the
    appropriate security personnel. The stored log data can used to detect weaknesses in security that enable the network
    IA team to find and address these weaknesses before breaches can occur. Reviewing these logs, whether before or after
    a security breach, are important in showing whether someone is an internal employee or an outside threat.
