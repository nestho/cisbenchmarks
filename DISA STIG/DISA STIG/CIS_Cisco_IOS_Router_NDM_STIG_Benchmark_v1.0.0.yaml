- id: '1.6'
  title: CISC-ND-000140
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to enforce approved authorizations for controlling the flow of management
    information within the device based on control policies. GROUP ID: V-215667 RULE ID: SV-215667r879533'
  rationale: A mechanism to detect and prevent unauthorized communication flow must be configured or provided as part of the
    system design. If management information flow is not enforced based on approved authorizations, the network device may
    become compromised. Information flow control regulates where management information is allowed to travel within a network
    device. The flow of all management information must be monitored and controlled so it does not introduce any unacceptable
    risk to the network device or data. Application-specific examples of enforcement occur in systems that employ rule sets
    or establish configuration settings that restrict information system services or messagefiltering capability based on
    message content (e.g., implementing key word searches or using document characteristics). Applications providing information
    flow control must be able to enforce approved authorizations for controlling the flow of management information within
    the system in accordance with applicable policy.
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'Review the Cisco router configuration to verify that it is compliant with this requirement.

    Step 1: Verify that the line vty has an ACL inbound applied as shown in the example

    below.

    line vty 0 1

    access-class MANAGEMENT_NET in

    transport input ssh

    Step 2: Verify that the ACL permits only hosts from the management network to access

    the router.

    ip access-list extended MANAGEMENT_NET

    permit ip x.x.x.0 0.0.0.255 any

    deny ip any any log-input

    If the Cisco router is not configured to enforce approved authorizations for controlling

    the flow of management information within the device based on control policies, this is a

    finding.'
  remediation: 'Configure the Cisco router to restrict management access to specific IP addresses via

    SSH as shown in the example below.

    SW2(config)#ip access-list standard MANAGEMENT_NET

    SW2(config-std-nacl)#permit x.x.x.0 0.0.0.255

    SW2(config-std-nacl)#exit

    SW2(config)#line vty 0 1

    SW2(config-line)#transport input ssh

    SW2(config-line)#access-class MANAGEMENT_NET in

    SW2(config-line)#end'
  checks:
  - type: manual_review
    info: 'Review the Cisco router configuration to verify that it is compliant with this requirement.

      Step 1: Verify that the line vty has an ACL inbound applied as shown in the example

      below.

      line vty 0 1

      access-class MANAGEMENT_NET in

      transport input ssh

      Step 2: Verify that the ACL permits only hosts from the management network to access

      the router.

      ip access-list extended MANAGEMENT_NET

      permit ip x.x.x.0 0.0.0.255 any

      deny ip any any log-input

      If the Cisco router is not configured to enforce approved a'
    severity: medium
- id: '1.7'
  title: CISC-ND-000150
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to enforce the limit of three consecutive invalid logon attempts, after
    which time it must lock out the user account from accessing the device for 15 minutes. GROUP ID: V-215668 RULE ID: SV-215668r879546'
  rationale: By limiting the number of failed logon attempts, the risk of unauthorized system access via user password guessing,
    otherwise known as brute-forcing, is reduced.
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'Review the Cisco router configuration to verify that it enforces the limit of three

    consecutive invalid logon attempts as shown in the example below.

    login block-for 900 attempts 3 within 120

    Note: The configuration example above will block any login attempt for 15 minutes after

    three consecutive invalid logon attempts within a two-minute period.

    If the Cisco router is not configured to enforce the limit of three consecutive invalid

    logon attempts, this is a finding.'
  remediation: 'Configure the Cisco router to enforce the limit of three consecutive invalid logon

    attempts as shown in the example below.

    R2(config)#login block-for 900 attempts 3 within 120'
  checks:
  - type: manual_review
    info: 'Review the Cisco router configuration to verify that it enforces the limit of three

      consecutive invalid logon attempts as shown in the example below.

      login block-for 900 attempts 3 within 120

      Note: The configuration example above will block any login attempt for 15 minutes after

      three consecutive invalid logon attempts within a two-minute period.

      If the Cisco router is not configured to enforce the limit of three consecutive invalid

      logon attempts, this is a finding.'
    severity: medium
- id: '1.8'
  title: CISC-ND-000160
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to display the Standard Mandatory DoD Notice and Consent Banner before
    granting access to the device. GROUP ID: V-215669 RULE ID: SV-215669r879547'
  rationale: Display of the DoD-approved use notification before granting access to the network device ensures privacy and
    security notification verbiage used is consistent with applicable federal laws, Executive Orders, directives, policies,
    regulations, standards, and guidance. System use notifications are required only for access via logon interfaces with
    human users.
