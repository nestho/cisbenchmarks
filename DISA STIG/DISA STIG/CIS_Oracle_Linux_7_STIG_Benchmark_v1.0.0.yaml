  description: 'The Oracle Linux operating system must be configured to off-load audit logs onto a different system or storage
    media from the system being audited. GROUP ID: V-221767 RULE ID: SV-221767r958754'
  rationale: 'Information stored in one location is vulnerable to accidental or incidental deletion or alteration. Off-loading
    is a common process in information systems with limited audit storage capacity. One method of off-loading audit logs in
    Oracle Linux is with the use of the audispremote dameon. Without the configuration of the "au-remote" plugin, the audisp-remote
    daemon will not off load the logs from the system being audited. Satisfies: SRG-OS-000342-GPOS-00133, SRG-OS-000479-GPOS-00224'
  impact: ''
  references: []
  page_start: 262
  audit_raw: 'Verify the "au-remote" plugin is configured to always off-load audit logs using the

    audisp-remote daemon:

    # cat /etc/audisp/plugins.d/au-remote.conf | grep -v "^#"

    active = yes

    direction = out

    path = /sbin/audisp-remote

    type = always

    format = string

    If "active" is not set to "yes", "direction" is not set to "out", "path" is not set to

    "/sbin/audisp-remote", "type is not set to "always", or any of the lines are commented

    out, ask the System Administrator to indicate how the audit logs are off-loaded to a

    different system or storage media.

    If there is no evidence that the system is configured to off-load audit logs to a different

    system or storage media, this is a finding.'
  remediation: 'Edit the /etc/audisp/plugins.d/au-remote.conf file and add or update the following

    values:

    active = yes

    direction = out

    path = /sbin/audisp-remote

    type = always

    The audit daemon must be restarted for changes to take effect:

    # service auditd restart'
  checks:
  - type: command
    command: '# cat /etc/audisp/plugins.d/au-remote.conf | grep -v "^#"'
    expected: ''
    severity: medium
    info: 'Verify the "au-remote" plugin is configured to always off-load audit logs using the

