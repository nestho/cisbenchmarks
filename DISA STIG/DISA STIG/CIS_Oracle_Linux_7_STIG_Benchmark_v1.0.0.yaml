- id: '1.36'
  title: OL07-00-010280
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must be configured so that passwords are a minimum of 15 characters in length.
    GROUP ID: V-221686 RULE ID: SV-221686r1015181'
  rationale: The shorter the password, the lower the number of possible combinations that need to be tested before the password
    is compromised. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts
    at guessing and brute-force attacks. Password length is one factor of several that helps to determine strength and how
    long it takes to crack a password. Use of more characters in a password helps to increase exponentially the time and/or
    resources required to compromise the password.
  impact: ''
  references: []
  page_start: 89
  audit_raw: 'Verify the operating system enforces a minimum 15-character password length. The

    "minlen" option sets the minimum number of characters in a new password.

    Check for the value of the "minlen" option in "/etc/security/pwquality.conf" with the

    following command:

    # grep minlen /etc/security/pwquality.conf

    minlen = 15

    If the command does not return a "minlen" value of 15 or greater, this is a finding.'
  remediation: 'Configure operating system to enforce a minimum 15-character password length.

    Add the following line to "/etc/security/pwquality.conf" (or modify the line to have the

    required value):

    minlen = 15'
  checks:
  - type: manual_review
    info: 'Verify the operating system enforces a minimum 15-character password length. The

      "minlen" option sets the minimum number of characters in a new password.

      Check for the value of the "minlen" option in "/etc/security/pwquality.conf" with the

      following command:

      # grep minlen /etc/security/pwquality.conf

      minlen = 15

      If the command does not return a "minlen" value of 15 or greater, this is a finding.'
    severity: medium
- id: '1.37'
  title: OL07-00-010290
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Oracle Linux operating system must not allow accounts configured with blank or null passwords. GROUP ID:
    V-221687 RULE ID: SV-221687r991589'
  rationale: If an account has an empty password, anyone could log on and run commands with the privileges of that account.
    Accounts with empty passwords should never be used in operational environments.
  impact: ''
  references: []
  page_start: 91
  audit_raw: "To verify that null passwords cannot be used, run the following command:\n # grep nullok /etc/pam.d/system-auth\
    \ /etc/pam.d/password-auth\nIf this produces any output, it may be possible to log on with accounts with empty\npasswords.\n\
    If null passwords can be used, this is a finding."
  remediation: 'If an account is configured for password authentication but does not have an assigned

    password, it may be possible to log on to the account without authenticating.

    Remove any instances of the "nullok" option in "/etc/pam.d/system-auth" and

    "/etc/pam.d/password-auth" to prevent logons with empty passwords.

    Note: Per requirement OL07-00-010199, Oracle Linux 7 must be configured to not

    overwrite custom authentication configuration settings while using the authconfig utility,

    otherwise manual changes to the listed files will be overwritten whenever the authconfig

    utility is used.'
  checks:
  - type: manual_review
    info: "To verify that null passwords cannot be used, run the following command:\n # grep nullok /etc/pam.d/system-auth\
      \ /etc/pam.d/password-auth\nIf this produces any output, it may be possible to log on with accounts with empty\npasswords.\n\
      If null passwords can be used, this is a finding."
    severity: medium
