    the following command:

    # grep gpgcheck /etc/yum.conf

    gpgcheck=1

    If "gpgcheck" is not set to "1", or if options are missing or commented out, ask the

    System Administrator how the certificates for patches and other operating system

    components are verified.

    If there is no process to validate certificates that is approved by the organization, this is

    a finding.'
  remediation: 'Configure the operating system to verify the signature of packages from a repository

    prior to install by setting the following option in the "/etc/yum.conf" file:

    gpgcheck=1'
