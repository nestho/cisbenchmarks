  description: 'The Oracle Linux operating system must be configured so that all world-writable directories are group-owned
    by root, sys, bin, or an application group. GROUP ID: V-221748 RULE ID: SV-221748r991589'
  rationale: If a world-writable directory is not group-owned by root, sys, bin, or an application Group Identifier (GID),
    unauthorized users may be able to modify files created by others. The only authorized public directories are those temporary
    directories supplied with the system or those designed to be temporary file repositories. The setting is normally reserved
    for directories used by the system and by users for temporary file storage, (e.g., /tmp), and for directories requiring
    global read/write access.
  impact: ''
  references: []
