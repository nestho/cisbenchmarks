    info: 'Verify the operating system enabled an application firewall.

      Check to see if "firewalld" is installed with the following command:

      # yum list installed firewalld

      firewalld-0.3.9-11.el7.noarch.rpm

      If the "firewalld" package is not installed, ask the System Administrator if another firewall

      application (such as iptables) is installed.

      If an application firewall is not installed, this is a finding.

      Ch'
