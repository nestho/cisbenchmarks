- id: '1.81'
  title: OL07-00-020230
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Oracle Linux operating system must be configured so that the x86 Ctrl-Alt-Delete key sequence is disabled
    on the command line. GROUP ID: V-221717 RULE ID: SV-221717r991589'
  rationale: A locally logged-on user who presses Ctrl-Alt-Delete when at the console, can reboot the system. If accidentally
    pressed, as could happen in the case of a mixed OS environment, this can create the risk of short-term loss of availability
    of systems due to unintentional reboot. In the graphical environment, risk of unintentional reboot from the Ctrl-Alt-Delete
    sequence is reduced because the user will be prompted before any action is taken.
  impact: ''
  references: []
  page_start: 177
  audit_raw: "Verify the operating system is not configured to reboot the system when Ctrl-Alt-Delete\nis pressed.\nCheck\
    \ that the ctrl-alt-del.target is masked and not active with the following command:\n # systemctl status ctrl-alt-del.target\n\
    \ ctrl-alt-del.target\n Loaded: masked (/dev/null; bad)\n Active: inactive (dead)\nIf the ctrl-alt-del.target is not masked,\
    \ this is a finding.\nIf the ctrl-alt-del.target is active, this is a finding."
  remediation: "Configure the system to disable the Ctrl-Alt-Delete sequence for the command line with\nthe following commands:\n\
    \ $ sudo systemctl disable ctrl-alt-del.target\n $ sudo systemctl mask ctrl-alt-del.target"
  checks:
  - type: manual_review
    info: "Verify the operating system is not configured to reboot the system when Ctrl-Alt-Delete\nis pressed.\nCheck that\
      \ the ctrl-alt-del.target is masked and not active with the following command:\n # systemctl status ctrl-alt-del.target\n\
      \ ctrl-alt-del.target\n Loaded: masked (/dev/null; bad)\n Active: inactive (dead)\nIf the ctrl-alt-del.target is not\
      \ masked, this is a finding.\nIf the ctrl-alt-del.target is active, this is a finding."
    severity: medium
