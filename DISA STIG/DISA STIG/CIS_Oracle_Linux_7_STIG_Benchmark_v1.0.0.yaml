- id: '1.47'
  title: OL07-00-010343
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must require re-authentication when using the "sudo" command. GROUP ID:
    V-237629 RULE ID: SV-237629r1050789'
  rationale: Without re-authentication, users may access resources or perform tasks for which they do not have authorization.
    When operating systems provide the capability to escalate a functional capability, it is critical the organization requires
    the user to re-authenticate when using the "sudo" command. If the value is set to an integer less than 0, the user's time
    stamp will not expire and the user will not have to re-authenticate for privileged actions until the user's session is
    terminated.
  impact: ''
  references: []
  page_start: 108
  audit_raw: 'Verify the operating system requires re-authentication when using the "sudo" command

    to elevate privileges.

    $ sudo grep -ir ''timestamp_timeout'' /etc/sudoers /etc/sudoers.d

    /etc/sudoers:Defaults timestamp_timeout=0

    If conflicting results are returned, this is a finding.

    If "timestamp_timeout" is set to a negative number, is commented out, or no results are

    returned, this is a finding.'
  remediation: 'Configure the "sudo" command to require re-authentication.

    Edit the /etc/sudoers file:

    $ sudo visudo

    Add or modify the following line:

    Defaults timestamp_timeout=[value]

    Note: The "[value]" must be a number that is greater than or equal to "0".

    Remove any duplicate or conflicting lines from /etc/sudoers and /etc/sudoers.d/ files.'
  checks:
  - type: manual_review
    info: 'Verify the operating system requires re-authentication when using the "sudo" command

      to elevate privileges.

      $ sudo grep -ir ''timestamp_timeout'' /etc/sudoers /etc/sudoers.d

      /etc/sudoers:Defaults timestamp_timeout=0

      If conflicting results are returned, this is a finding.

      If "timestamp_timeout" is set to a negative number, is commented out, or no results are

      returned, this is a finding.'
    severity: medium
