  description: 'The Oracle Linux operating system must audit all executions of privileged functions. GROUP ID: V-221777 RULE
    ID: SV-221777r958732'
  rationale: Misuse of privileged functions, either intentionally or unintentionally by authorized users, or by unauthorized
    external entities that have compromised information system accounts, is a serious and ongoing concern and can have significant
    adverse impacts on organizations. Auditing the use of privileged functions is one way to detect such misuse and identify
    the risk from insider threats and the advanced persistent threat.
  impact: ''
  references: []
  page_start: 282
  audit_raw: 'Verify the operating system audits the execution of privileged functions using the

    following command:

    # grep -iw execve /etc/audit/audit.rules

    -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k setuid

    -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k setuid

    -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k setgid

    -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k setgid

