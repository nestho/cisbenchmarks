- id: '1.166'
  title: OL07-00-030805
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'OL 7 must audit any script or executable called by cron as root or by any privileged user. GROUP ID: V-274875
    RULE ID: SV-274875r1101859'
  rationale: Any script or executable called by cron as root or by any privileged user must be owned by that user and must
    have the permissions 755 or more restrictive and should have no extended rights that allow any nonprivileged user to modify
    the script or executable.
  impact: ''
  references: []
  page_start: 337
  audit_raw: 'Verify that OL 7 is configured to audit the execution of any system call made by cron as

    root or as any privileged user.

    $ sudo auditctl -l | grep /etc/cron.d

    -w /etc/cron.d -p wa -k cronjobs

    $ sudo auditctl -l | grep /var/spool/cron

    -w /var/spool/cron -p wa -k cronjobs

    If either of these commands do not return the expected output, or the lines are

    commented out, this is a finding.'
  remediation: 'Configure OL 7 to audit the execution of any system call made by cron as root or as any

    privileged user.

    Add or update the following file system rules to "/etc/audit/rules.d/audit.rules":

    auditctl -w /etc/cron.d/ -p wa -k cronjobs

    auditctl -w /var/spool/cron/ -p wa -k cronjobs

    To load the rules to the kernel immediately, use the following command:

    $ sudo augenrules --load'
  checks:
  - type: command
    command: $ sudo auditctl -l | grep /etc/cron.d && $ sudo auditctl -l | grep /var/spool/cron
    expected: Verify that OL 7 is configured to audit the execution of any system call made by cron as
    severity: medium
