      g'
    severity: medium
- id: '1.87'
  title: OL07-00-020300
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Oracle Linux operating system must be configured so that all Group Identifiers (GIDs) referenced in the
    /etc/passwd file are defined in the /etc/group file. GROUP ID: V-221722 RULE ID: SV-221722r958482'
  rationale: If a user is assigned the GID of a group not existing on the system, and a group with the GID is subsequently
    created, the user may have unintended rights to any files associated with the group.
  impact: ''
  references: []
  page_start: 187
  audit_raw: 'Verify all GIDs referenced in the "/etc/passwd" file are defined in the "/etc/group" file.

    Check that all referenced GIDs exist with the following command:

    # pwck -r

    If GIDs referenced in then "/etc/passwd" file are returned as not defined in the

    "/etc/group" file, this is a finding.'
  remediation: 'Configure the system to define all GIDs found in the "/etc/passwd" file by modifying the

    "/etc/group" file to add any non-existent group referenced in the "/etc/passwd" file, or

    change the GIDs referenced in the "/etc/passwd" file to a group that exists in

    "/etc/group".'
  checks:
  - type: manual_review
    info: 'Verify all GIDs referenced in the "/etc/passwd" file are defined in the "/etc/group" file.

      Check that all referenced GIDs exist with the following command:

      # pwck -r

      If GIDs referenced in then "/etc/passwd" file are returned as not defined in the

      "/etc/group" file, this is a finding.'
    severity: medium
- id: '1.88'
  title: OL07-00-020310
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Oracle Linux operating system must be configured so that the root account must be the only account having
    unrestricted access to the system. GROUP ID: V-221723 RULE ID: SV-221723r991589'
  rationale: If an account other than root also has a User Identifier (UID) of "0", it has root authority, giving that account
    unrestricted access to the entire operating system. Multiple accounts with a UID of "0" afford an opportunity for potential
    intruders to guess a password for a privileged account.
  impact: ''
  references: []
  page_start: 188
  audit_raw: 'Check the system for duplicate UID "0" assignments with the following command:

    # awk -F: ''$3 == 0 {print $1}'' /etc/passwd

    If any accounts other than root have a UID of "0", this is a finding.'
  remediation: 'Change the UID of any account on the system, other than root, that has a UID of "0".

    If the account is associated with system commands or applications, the UID should be

    changed to one greater than "0" but less than "1000". Otherwise, assign a UID of

    greater than "1000" that has not already been assigned.'
  checks:
  - type: manual_review
    info: 'Check the system for duplicate UID "0" assignments with the following command:

      # awk -F: ''$3 == 0 {print $1}'' /etc/passwd

      If any accounts other than root have a UID of "0", this is a finding.'
    severity: medium
