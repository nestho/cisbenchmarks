- id: '1.127'
  title: OL07-00-030000
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must be configured so that auditing is configured to produce records containing
    information to establish what type of events occurred, where the events occurred, the source of the events, and the outcome
    of the events. These audit records must also identify individual identities of group account users. GROUP ID: V-221764
    RULE ID: SV-221764r1015189'
  rationale: 'Without establishing what type of events occurred, it would be difficult to establish, correlate, and investigate
    the events leading up to an outage or attack. Audit record content that may be necessary to satisfy this requirement includes,
    for example, time stamps, source and destination addresses, user/process identifiers, event descriptions, success/fail
    indications, filenames involved, and access control or flow control rules invoked. Associating event types with detected
    events in the operating system audit logs provides a means of investigating an attack; recognizing resource utilization
    or capacity thresholds, or identifying an improperly configured operating system. Satisfies: SRG-OS-000038-GPOS-00016,
    SRG-OS-000039-GPOS-00017, SRG-OS000042-GPOS-00021, SRG-OS-000254-GPOS-00095, SRG-OS-000365-GPOS-00152, SRG-OS-000255-GPOS-00096'
  impact: ''
  references: []
  page_start: 256
  audit_raw: 'Verify the operating system produces audit records containing information to establish

    when (date and time) the events occurred.

    Check to see if auditing is active by issuing the following command:

    # systemctl is-active auditd.service

    active

    If the "auditd" status is not active, this is a finding.'
  remediation: 'Configure the operating system to produce audit records containing information to

    establish when (date and time) the events occurred.

    Enable the auditd service with the following command:

    # systemctl start auditd.service'
  checks:
  - type: manual_review
    info: 'Verify the operating system produces audit records containing information to establish

      when (date and time) the events occurred.

      Check to see if auditing is active by issuing the following command:

      # systemctl is-active auditd.service

      active

      If the "auditd" status is not active, this is a finding.'
    severity: medium
- id: '1.128'
  title: OL07-00-030010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must shut down upon audit processing failure, unless availability is an
    overriding concern. If availability is a concern, the system must alert the designated staff (System Administrator [SA]
    and Information System Security Officer [ISSO] at a minimum) in the event of an audit processing failure. GROUP ID: V-221765
    RULE ID: SV-221765r958424'
  rationale: 'It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit
    logs as required. Without this notification, the security personnel may be unaware of an impending failure of the audit
    capability, and system operation may be adversely affected. Audit processing failures include software/hardware errors,
    failures in the audit capturing mechanisms, and audit storage capacity being reached or exceeded. This requirement applies
    to each audit data storage repository (i.e., distinct information system component where audit records are stored), the
    centralized audit storage capacity of organizations (i.e., all audit data storage repositories combined), or both. Satisfies:
    SRG-OS-000046-GPOS-00022, SRG-OS-000047-GPOS-00023'
  impact: ''
  references: []
  page_start: 259
  audit_raw: "Confirm the audit configuration regarding how auditing processing failures are handled.\nCheck to see what level\
    \ \"auditctl\" is set to with following command:\n # auditctl -s | grep -i \"fail\"\n failure 2\nNote: If the value of\
    \ \"failure\" is set to \"2\", the system is configured to panic (shut down)\nin the event of an auditing failure. If\
    \ the value of \"failure\" is set to \"1\", the system will not\nshut down and instead will record the audit failure in\
    \ the kernel log. If the system is\nconfigured per requirement OL07-00-031000, the kernel log will be sent to a log\n\
    aggregation server and generate an alert.\nIf the \"failure\" setting is set to any value other than \"1\" or \"2\", this\
    \ is a finding.\nIf the \"failure\" setting is not set, this must be upgraded to a CAT I finding.\nIf the \"failure\"\
    \ setting is set to \"1\" but the availability concern is not documented or there\nis no monitoring of the kernel log,\
    \ this must be downgraded to a CAT III finding."
  remediation: "Configure the operating system to shut down in the event of an audit processing failure.\nAdd or correct the\
    \ option to shut down the operating system with the following\ncommand:\n # auditctl -f 2\nEdit the \"/etc/audit/rules.d/audit.rules\"\
    \ file and add the following line:\n -f 2\nIf availability has been determined to be more important, and this decision\
    \ is\ndocumented with the ISSO, configure the operating system to notify system\nadministration staff and ISSO staff in\
    \ the event of an audit processing failure with the\nfollowing command:\n # auditctl -f 1\nEdit the \"/etc/audit/rules.d/audit.rules\"\
    \ file and add the following line:\n -f 1\nKernel log monitoring must also be configured to properly alert designated\
    \ staff.\nThe audit daemon must be restarted for the changes to take effect."
  checks:
  - type: command
    command: '# auditctl -s | grep -i "fail"'
    expected: ''
    severity: medium
    info: "Confirm the audit configuration regarding how auditing processing failures are handled.\nCheck to see what level\
      \ \"auditctl\" is set to with following command:\n # auditctl -s | grep -i \"fail\"\n failure 2\nNote: If the value\
      \ of \"failure\" is set to \"2\", the system is configured to panic (shut down)\nin the event of an auditing failure.\
      \ If the value of \"failure\" is set to \"1\", the system will not\nshut down"
