- id: '1.180'
  title: OL07-00-032000
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Oracle Linux operating system must use a virus scan program. GROUP ID: V-221837 RULE ID: SV-221837r991589'
  rationale: Virus scanning software can be used to protect a system from penetration from computer viruses and to limit their
    spread through intermediate systems. The virus scanning software should be configured to perform scans dynamically on
    accessed files. If this capability is not available, the system must be configured to scan, at a minimum, all altered
    files on the system on a daily basis. If the system processes inbound SMTP mail, the virus scanner must be configured
    to scan all received mail.
  impact: ''
  references: []
  page_start: 365
  audit_raw: 'Verify an anti-virus solution is installed on the system. The anti-virus solution may be

    bundled with an approved host-based security solution.

    If there is no anti-virus solution installed on the system, this is a finding.'
  remediation: Install an antivirus solution on the system.
  checks:
  - type: manual_review
