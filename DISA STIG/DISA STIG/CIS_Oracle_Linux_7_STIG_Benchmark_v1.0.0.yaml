    may be named differently or be in a different location if using a version of SSH that is

    provided by a third-party vendor) and set the value to "no":

    KerberosAuthentication no

    The SSH service must be restarted for changes to take effect.

    If Kerberos authentication is required, it must be documented, to include the location of

    the configuration file, with the ISSO.'
  checks:
  - type: manual_review
    info: 'Verify the SSH daemon does not permit Kerberos to authenticate passwords unless

