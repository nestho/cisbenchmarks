  description: 'The Oracle Linux operating system must uniquely identify and must authenticate users using multifactor authentication
    via a graphical user logon. GROUP ID: V-221658 RULE ID: SV-221658r1015163'
  rationale: 'To assure accountability and prevent unauthenticated access, users must be identified and authenticated to prevent
    potential misuse and compromise of the system. Multifactor solutions that require devices separate from information systems
    gaining access include, for example, hardware tokens providing time-based or challengeresponse authenticators and smart
    cards such as the U.S. Government Personal Identity Verification card and the DoD Common Access Card. Satisfies: SRG-OS-000375-GPOS-00161,
    SRG-OS-000377-GPOS-00162'
  impact: ''
  references: []
  page_start: 36
  audit_raw: 'Verify the operating system uniquely identifies and authenticates users using multifactor

    authentication via a graphical user logon.

    Note: If the system does not have GNOME installed, this requirement is Not Applicable.

    Determine which profile the system database is using with the following command:

    # grep system-db /etc/dconf/profile/user

