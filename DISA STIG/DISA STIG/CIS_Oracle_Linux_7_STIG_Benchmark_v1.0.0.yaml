- id: '1.208'
  title: OL07-00-040500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must, for networked systems, synchronize clocks with a server that is synchronized
    to one of the redundant United States Naval Observatory (USNO) time servers, a time server designated for the appropriate
    DoD network (NIPRNet/SIPRNet), and/or the Global Positioning System (GPS). GROUP ID: V-221866 RULE ID: SV-221866r1038944'
  rationale: 'Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining
    the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating
    system events. Sources outside the configured acceptable allowance (drift) may be inaccurate. Synchronizing internal information
    system clocks provides uniformity of time stamps for information systems with multiple system clocks and systems connected
    over a network. Organizations should consider endpoints that may not have regular access to the authoritative time server
    (e.g., mobile, teleworking, and tactical endpoints). Satisfies: SRG-OS-000355-GPOS-00143, SRG-OS-000356-GPOS-00144'
  impact: ''
  references: []
  page_start: 418
  audit_raw: 'Check to see if NTP is running in continuous mode.

    # ps -ef | grep ntp

    If NTP is not running, check to see if "chronyd" is running in continuous mode:

    # ps -ef | grep chronyd

    If NTP or "chronyd" is not running, this is a finding.

    If the NTP process is found, then check the "ntp.conf" file for the "maxpoll" option

    setting:

    # grep maxpoll /etc/ntp.conf

    server 0.rhel.pool.ntp.org iburst maxpoll 16

    If the "maxpoll" option is set to a number greater than 16 or the line is commented out,

    this is a finding.

    If the file does not exist, check the "/etc/cron.daily" subdirectory for a crontab file

    controlling the execution of the "ntpd -q" command.

    # grep -i "ntpd -q" /etc/cron.daily/*

    # ls -al /etc/cron.* | grep ntp

    ntp

    If a crontab file does not exist in the "/etc/cron.daily" that executes the "ntpd -q"

    command, this is a finding.

    If the "chronyd" process is found, then check the "chrony.conf" file for the "maxpoll"

    option setting:

    # grep maxpoll /etc/chrony.conf

    server 0.rhel.pool.ntp.org iburst maxpoll 16

    If the option is not set or the line is commented out, this is a finding.'
  remediation: 'Edit the "/etc/ntp.conf" or "/etc/chrony.conf" file and add or update an entry to define

    "maxpoll" to "16" as follows:

    server 0.rhel.pool.ntp.org iburst maxpoll 16

    If NTP was running and "maxpoll" was updated, the NTP service must be restarted:

    # systemctl restart ntpd

    If NTP was not running, it must be started:

    # systemctl start ntpd

    If "chronyd" was running and "maxpoll" was updated, the service must be restarted:

    # systemctl restart chronyd.service

    If "chronyd" was not running, it must be started:

    # systemctl start chronyd.service'
  checks:
  - type: command
    command: '# ps -ef | grep ntp && # ps -ef | grep chronyd && # ls -al /etc/cron.* | grep ntp'
    expected: ''
    severity: medium
    info: 'Check to see if NTP is running in continuous mode.

      # ps -ef | grep ntp

      If NTP is not running, check to see if "chronyd" is running in continuous mode:

      # ps -ef | grep chronyd

      If NTP or "chronyd" is not running, this is a finding.

      If the NTP process is found, then check the "ntp.conf" file for the "maxpoll" option

      setting:

      # grep maxpoll /etc/ntp.conf

      server 0.rhel.pool.ntp.org iburst maxpoll 16

      If'
- id: '1.209'
  title: OL07-00-040510
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must protect against or limit the effects of Denial of Service (DoS) attacks
    by validating the operating system is implementing rate-limiting measures on impacted network interfaces. GROUP ID: V-221867
    RULE ID: SV-221867r958902'
  rationale: DoS is a condition when a resource is not available for legitimate users. When this occurs, the organization
    either cannot accomplish its mission or must operate at degraded capacity. This requirement addresses the configuration
    of the operating system to mitigate the impact of DoS attacks that have occurred or are ongoing on system availability.
    For each system, known and potential DoS attacks must be identified and solutions for each type implemented. A variety
    of technologies exists to limit or, in some cases, eliminate the effects of DoS attacks (e.g., limiting processes or establishing
    memory partitions). Employing increased capacity and bandwidth, combined with service redundancy, may reduce the susceptibility
    to some DoS attacks.
  impact: ''
  references: []
  page_start: 421
  audit_raw: 'Verify the operating system protects against or limits the effects of DoS attacks by

    ensuring the operating system is implementing rate-limiting measures on impacted

    network interfaces.

    # grep -r net.ipv4.tcp_invalid_ratelimit /run/sysctl.d/* /etc/sysctl.d/*

    /usr/local/lib/sysctl.d/* /usr/lib/sysctl.d/* /lib/sysctl.d/*

    /etc/sysctl.conf 2> /dev/null

    /etc/sysctl.conf:net.ipv4.tcp_invalid_ratelimit = 500

    If "net.ipv4.tcp_invalid_ratelimit" is not configured in the /etc/sysctl.conf file or in any of

    the other sysctl.d directories, is commented out this is a finding.

    Check that the operating system implements the value of the "tcp_invalid_ratelimit"

    variable with the following command:

    # /sbin/sysctl -a | grep net.ipv4.tcp_invalid_ratelimit

    net.ipv4.tcp_invalid_ratelimit = 500

    If "net.ipv4.tcp_invalid_ratelimit" has a value of "0", this is a finding.

    If "net.ipv4.tcp_invalid_ratelimit" has a value greater than "1000" and is not documented

    with the Information System Security Officer (ISSO), this is a finding.

    If conflicting results are returned, this is a finding.'
  remediation: 'Set the system to implement rate-limiting measures by adding the following line to

    "/etc/sysctl.conf" or a configuration file in the /etc/sysctl.d/ directory (or modify the line to

    have the required value):

    net.ipv4.tcp_invalid_ratelimit = 500

    Issue the following command to make the changes take effect:

    # sysctl --system'
  checks:
  - type: command
    command: '# /sbin/sysctl -a | grep net.ipv4.tcp_invalid_ratelimit'
    expected: ''
    severity: medium
    info: 'Verify the operating system protects against or limits the effects of DoS attacks by

      ensuring the operating system is implementing rate-limiting measures on impacted

      network interfaces.

      # grep -r net.ipv4.tcp_invalid_ratelimit /run/sysctl.d/* /etc/sysctl.d/*

      /usr/local/lib/sysctl.d/* /usr/lib/sysctl.d/* /lib/sysctl.d/*

      /etc/sysctl.conf 2> /dev/null

      /etc/sysctl.conf:net.ipv4.tcp_invalid_ratelimit ='
