- id: '1.78'
  title: OL07-00-020200
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Oracle Linux operating system must remove all software components after updated versions have been installed.
    GROUP ID: V-221715 RULE ID: SV-221715r958936'
  rationale: Previous versions of software components that are not removed from the information system after updates have
    been installed may be exploited by adversaries. Some information technology products may remove older versions of software
    automatically from the information system.
  impact: ''
  references: []
  page_start: 172
  audit_raw: 'Verify the operating system removes all software components after updated versions

    have been installed.

    Check if yum is configured to remove unneeded packages with the following command:

    # grep -i clean_requirements_on_remove /etc/yum.conf

    clean_requirements_on_remove=1

    If "clean_requirements_on_remove" is not set to "1", "True", or "yes", or is not set in

    "/etc/yum.conf", this is a finding.'
  remediation: 'Configure the operating system to remove all software components after updated

    versions have been installed.

    Set the "clean_requirements_on_remove" option to "1" in the "/etc/yum.conf" file:

    clean_requirements_on_remove=1'
  checks:
  - type: manual_review
    info: 'Verify the operating system removes all software components after updated versions

      have been installed.

      Check if yum is configured to remove unneeded packages with the following command:

      # grep -i clean_requirements_on_remove /etc/yum.conf

      clean_requirements_on_remove=1

      If "clean_requirements_on_remove" is not set to "1", "True", or "yes", or is not set in

      "/etc/yum.conf", this is a finding.'
    severity: medium
- id: '1.79'
  title: OL07-00-020210
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must enable SELinux. GROUP ID: V-221716 RULE ID: SV-221716r958944'
  rationale: Without verification of the security functions, security functions may not operate correctly and the failure
    may go unnoticed. Security function is defined as the hardware, software, and/or firmware of the information system responsible
    for enforcing the system security policy and supporting the isolation of code and data on which the protection is based.
    Security functionality includes, but is not limited to, establishing system accounts, configuring access authorizations
    (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters. This requirement
    applies to operating systems performing security function verification/testing and/or systems and environments that require
    this functionality.
  impact: ''
  references: []
  page_start: 173
  audit_raw: "Verify the operating system verifies correct operation of all security functions.\nCheck if \"SELinux\" is active\
    \ and in \"Enforcing\" mode with the following command:\n # getenforce\n Enforcing\nIf \"SELinux\" is not active and not\
    \ in \"Enforcing\" mode, this is a finding."
  remediation: "Configure the operating system to verify correct operation of all security functions.\nSet the \"SELinux\"\
    \ status and the \"Enforcing\" mode by modifying the \"/etc/selinux/config\"\nfile to have the following line:\n SELINUX=enforcing\n\
    A reboot is required for the changes to take effect."
  checks:
  - type: manual_review
