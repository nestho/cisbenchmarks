- id: '1.238'
  title: OL07-00-040830
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must not forward IPv6 source-routed packets. GROUP ID: V-221894 RULE ID:
    SV-221894r991589'
  rationale: Source-routed packets allow the source of the packet to suggest that routers forward the packet along a different
    path than configured on the router, which can be used to bypass network security measures. This requirement applies only
    to the forwarding of source-routed traffic, such as when IPv6 forwarding is enabled and the system is functioning as a
    router.
  impact: ''
  references: []
  page_start: 475
  audit_raw: "If IPv6 is not enabled, the key will not exist, and this is Not Applicable.\nVerify the system does not accept\
    \ IPv6 source-routed packets.\n # grep -r net.ipv6.conf.all.accept_source_route /run/sysctl.d/*\n/etc/sysctl.d/* /usr/local/lib/sysctl.d/*\
    \ /usr/lib/sysctl.d/* /lib/sysctl.d/*\n/etc/sysctl.conf 2> /dev/null\n net.ipv6.conf.all.accept_source_route = 0\nIf \"\
    net.ipv6.conf.all.accept_source_route\" is not configured in the /etc/sysctl.conf file or\nin any of the other sysctl.d\
    \ directories, is commented out or does not have a value of\n\"0\", this is a finding.\nCheck that the operating system\
    \ implements the accept source route variable with the\nfollowing command:\n # /sbin/sysctl -a | grep net.ipv6.conf.all.accept_source_route\n\
    \ net.ipv6.conf.all.accept_source_route = 0\nIf the returned lines do not have a value of \"0\", this is a finding.\n\
    If conflicting results are returned, this is a finding."
  remediation: "Set the system to the required kernel parameter, if IPv6 is enabled, by adding the\nfollowing line to \"/etc/sysctl.conf\"\
    \ or a configuration file in the /etc/sysctl.d/ directory (or\nmodify the line to have the required value):\n net.ipv6.conf.all.accept_source_route\
    \ = 0\nIssue the following command to make the changes take effect:\n # sysctl --system"
  checks:
  - type: command
    command: '# /sbin/sysctl -a | grep net.ipv6.conf.all.accept_source_route'
    expected: ''
    severity: medium
    info: "If IPv6 is not enabled, the key will not exist, and this is Not Applicable.\nVerify the system does not accept\
      \ IPv6 source-routed packets.\n # grep -r net.ipv6.conf.all.accept_source_route /run/sysctl.d/*\n/etc/sysctl.d/* /usr/local/lib/sysctl.d/*\
