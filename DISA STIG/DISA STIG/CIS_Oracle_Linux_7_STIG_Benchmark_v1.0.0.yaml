      /etc/pam.d/password-auth-local

      lrwxrwxrwx. 1 root root 28 Apr 1 11:59 /etc/pam.d/system-auth ->

      /etc/pam.d/system-auth-local

      If system-auth and password-auth files are not symbolic links, this is a finding.

      If system-auth and password-auth are symbolic links but'
    severity: medium
- id: '1.28'
  title: OL07-00-010200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must be configured so that the PAM system service is configured to store
    only encrypted representations of passwords. GROUP ID: V-221677 RULE ID: SV-221677r1015174'
  rationale: Passwords need to be protected at all times, and encryption is the standard method for protecting passwords.
    If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised. Passwords encrypted
    with a weak algorithm are no more protected than if they are kept in plain text.
  impact: ''
  references: []
  page_start: 75
  audit_raw: 'Verify the PAM system service is configured to store only encrypted representations of

    passwords. The strength of encryption that must be used to hash passwords for all

    accounts is SHA512.

    Check that the system is configured to create SHA512 hashed passwords with the

    following command:

    # grep password /etc/pam.d/system-auth /etc/pam.d/password-auth

    Outcome should look like following:

    /etc/pam.d/system-auth-ac:password sufficient pam_unix.so sha512 shadow

    try_first_pass use_authtok

    /etc/pam.d/password-auth:password sufficient pam_unix.so sha512 shadow

    try_first_pass use_authtok

    If the "/etc/pam.d/system-auth" and "/etc/pam.d/password-auth" configuration files allow

    for password hashes other than SHA512 to be used, this is a finding.'
  remediation: 'Configure the operating system to store only SHA512 encrypted representations of

    passwords.

    Add the following line in "/etc/pam.d/system-auth":

    password sufficient pam_unix.so sha512 shadow try_first_pass

    use_authtok

    Add the following line in "/etc/pam.d/password-auth":

    password sufficient pam_unix.so sha512 shadow try_first_pass

    use_authtok

    Note: Per requirement OL07-00-010199, Oracle Linux 7 must be configured to not

    overwrite custom authentication configuration settings while using the authconfig utility;

    otherwise, manual changes to the listed files will be overwritten whenever the

    authconfig utility is used.'
  checks:
  - type: manual_review
    info: 'Verify the PAM system service is configured to store only encrypted representations of

      passwords. The strength of encryption that must be used to hash passwords for all

      accounts is SHA512.

      Check that the system is configured to create SHA512 hashed passwords with the

      following command:

      # grep password /etc/pam.d/system-auth /etc/pam.d/password-auth

      Outcome should look like following:

      /etc/pam.d/system-auth-ac:password sufficient pam_unix.so sha512 shadow

      try_first_pass use_authtok

      /etc/pam.d/pas'
    severity: medium
