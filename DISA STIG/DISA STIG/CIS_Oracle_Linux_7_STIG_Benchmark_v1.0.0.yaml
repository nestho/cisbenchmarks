- id: '1.179'
  title: OL07-00-031010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must be configured so that the rsyslog daemon does not accept log messages
    from other servers unless the server is being used for log aggregation. GROUP ID: V-221836 RULE ID: SV-221836r991589'
  rationale: Unintentionally running a rsyslog server accepting remote messages puts the system at increased risk. Malicious
    rsyslog messages sent to the server could exploit vulnerabilities in the server software itself, could introduce misleading
    information in to the system's logs, or could fill the system's storage leading to a denial of service. If the system
    is intended to be a log aggregation server its use must be documented with the ISSO.
  impact: ''
  references: []
  page_start: 363
  audit_raw: 'Verify that the system is not accepting "rsyslog" messages from other systems unless it

    is documented as a log aggregation server.

    Check the configuration of "rsyslog" with the following command:

    # grep imtcp /etc/rsyslog.conf

    $ModLoad imtcp

    # grep imudp /etc/rsyslog.conf

    $ModLoad imudp

    # grep imrelp /etc/rsyslog.conf

    $ModLoad imrelp

    If any of the above modules are being loaded in the "/etc/rsyslog.conf" file, ask to see

    the documentation for the system being used for log aggregation.

    If the documentation does not exist, or does not specify the server as a log aggregation

    system, this is a finding.'
  remediation: 'Modify the "/etc/rsyslog.conf" file to remove the "ModLoad imtcp", "ModLoad imudp",

    and "ModLoad imrelp" configuration lines, or document the system as being used for log

    aggregation.'
