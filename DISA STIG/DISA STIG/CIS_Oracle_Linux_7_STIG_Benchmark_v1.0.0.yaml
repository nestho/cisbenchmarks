    ID: SV-221868r991589'
  rationale: 'Firewalls protect computers from network attacks by blocking or limiting access to open network ports. Application
    firewalls limit which applications are allowed to communicate over the network. Satisfies: SRG-OS-000480-GPOS-00227, SRG-OS-000480-GPOS-00231,
    SRG-OS000480-GPOS-00232'
