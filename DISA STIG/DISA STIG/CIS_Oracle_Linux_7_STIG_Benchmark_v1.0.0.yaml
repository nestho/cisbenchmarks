  audit_raw: 'Verify the operating system generates audit records when successful/unsuccessful

    attempts to use the "mount" command and syscall occur.

    Check that the following system call is being audited by performing the following series

    of commands to check the file system rules in "/etc/audit/audit.rules":

    $ sudo grep -w "mount" /etc/audit/audit.rules

    -a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=unset -k

    privileged-mount

    -a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=unset -k

    privileged-mount

    -a always,exit -F path=/usr/bin/mount -F perm=x -F auid>=1000 -F auid!=unset

    -k privileged-mount

    If both the "b32" and "b64" audit rules are not defined for the "mount" syscall, this is a

    finding.

    If the use of the "mount" command and syscall are not being audited, this is a finding.'
  remediation: 'Configure the operating system to generate audit records when successful/unsuccessful

    attempts to use the "mount" command and syscall occur.

    Add or update the following rules in "/etc/audit/rules.d/audit.rules":

    -a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=unset -k

    privileged-mount

    -a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=unset -k

    privileged-mount

    -a always,exit -F path=/usr/bin/mount -F perm=x -F auid>=1000 -F auid!=unset

    -k privileged-mount

    The audit daemon must be restarted for the changes to take effect.'
  checks:
  - type: manual_review
    info: 'Verify the operating system generates audit records when successful/unsuccessful

      attempts to use the "mount" command and syscall occur.

      Check that the following system call is being audited by performing the following series

      of commands to check the file system rules in "/etc/audit/audit.rules":

      $ sudo grep -w "mount" /etc/audit/audit.rules

      -a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=unset -k

      privileged-mount

      -a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=unset -k

      priv'
    severity: medium
