  audit_raw: 'Verify the operating system displays the approved Standard Mandatory DoD Notice and

    Consent Banner before granting access to the operating system via a graphical user

    logon.

    Note: If the system does not have a Graphical User Interface installed, this requirement

    is Not Applicable.

    Check that the operating system displays the exact approved Standard Mandatory DoD

    Notice and Consent Banner text with the command:

    # grep banner-message-text /etc/dconf/db/local.d/*

    banner-message-text=

    ''You are accessing a U.S. Government (USG) Information System (IS) that is

    provided for USG-authorized use only.\nBy using this IS (which includes any

