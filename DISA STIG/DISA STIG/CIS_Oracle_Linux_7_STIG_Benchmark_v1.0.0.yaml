    deletion. GROUP ID: V-221899 RULE ID: SV-221899r958434'
  rationale: 'If audit information were to become compromised, then forensic analysis and discovery of the true source of
    potentially malicious system activity is impossible to achieve. To ensure the veracity of audit information, the operating
    system must protect audit information from unauthorized modification. Audit information includes all information (e.g.,
    audit records, audit settings, audit reports) needed to successfully audit information system activity. Satisfies: SRG-OS-000057-GPOS-00027,
