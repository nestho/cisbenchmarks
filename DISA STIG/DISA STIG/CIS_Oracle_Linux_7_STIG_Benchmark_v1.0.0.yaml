- id: '1.239'
  title: OL07-00-041001
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must have the required packages for multifactor authentication installed.
    GROUP ID: V-221895 RULE ID: SV-221895r1015191'
  rationale: 'Using an authentication device, such as a CAC or token that is separate from the information system, ensures
    that even if the information system is compromised, that compromise will not affect credentials stored on the authentication
    device. Multifactor solutions that require devices separate from information systems gaining access include, for example,
    hardware tokens providing time-based or challengeresponse authenticators and smart cards such as the U.S. Government Personal
    Identity Verification card and the DoD Common Access Card. A privileged account is defined as an information system account
    with authorizations of a privileged user. Remote access is access to DoD nonpublic information systems by an authorized
    user (or an information system) communicating through an external, non-organizationcontrolled network. Remote access methods
    include, for example, dial-up, broadband, and wireless. This requirement only applies to components where this is specific
    to the function of the device or has the concept of an organizational user (e.g., VPN, proxy capability). This does not
    apply to authentication for the purpose of configuring the device itself (management). Satisfies: SRG-OS-000375-GPOS-00160,
    SRG-OS-000375-GPOS-00161, SRG-OS000377-GPOS-00162'
  impact: ''
  references: []
  page_start: 477
  audit_raw: 'Verify the operating system has the packages required for multifactor authentication

    installed.

    Check for the presence of the packages required to support multifactor authentication

    with the following commands:

    # yum list installed pam_pkcs11

    pam_pkcs11-0.6.2-14.el7.noarch.rpm

    If the "pam_pkcs11" packages is not installed, this is a finding.'
  remediation: 'Configure the operating system to implement multifactor authentication by installing the

    required packages.

    Install the "pam_pkcs11" package with the following command:

    # yum install pam_pkcs11'
  checks:
  - type: manual_review
    info: 'Verify the operating system has the packages required for multifactor authentication

      installed.

      Check for the presence of the packages required to support multifactor authentication

      with the following commands:

      # yum list installed pam_pkcs11

      pam_pkcs11-0.6.2-14.el7.noarch.rpm

      If the "pam_pkcs11" packages is not installed, this is a finding.'
    severity: medium
