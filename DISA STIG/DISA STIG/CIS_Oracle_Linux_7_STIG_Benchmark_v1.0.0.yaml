    \ pam_pwquality.so retry=3\nIf the command does not return an uncommented line containing the value\n\"pam_pwquality.so\"\
    \ as shown, this is a finding.\nIf the value of \"retry\" is set to \"0\" or greater than \"3\", this is a finding."
