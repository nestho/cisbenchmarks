- id: '1.85'
  title: OL07-00-020260
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system security patches and updates must be installed and up to date. GROUP ID:
    V-221720 RULE ID: SV-221720r991589'
  rationale: Timely patching is critical for maintaining the operational availability, confidentiality, and integrity of information
    technology (IT) systems. However, failure to keep operating system and application software patched is a common mistake
    made by IT professionals. New patches are released daily, and it is often difficult for even experienced System Administrators
    to keep abreast of all the new patches. When new weaknesses in an operating system exist, patches are usually made available
    by the vendor to resolve the problems. If the most recent security patches and updates are not installed, unauthorized
    users may take advantage of weaknesses in the unpatched software. The lack of prompt attention to patching could result
    in a system compromise.
  impact: ''
  references: []
  page_start: 183
  audit_raw: 'Verify the operating system security patches and updates are installed and up to date.

    Updates are required to be applied with a frequency determined by the site or Program

    Management Office (PMO).

    Obtain the list of available package security updates from Oracle. The URL for updates

    is https://linux.oracle.com/errata/. It is important to note that updates provided by Oracle

    may not be present on the system if the underlying packages are not installed.

    Check that the available package security updates have been installed on the system

    with the following command:

    # yum history list | more

    Loaded plugins: langpacks, product-id, subscription-manager

    ID | Command line | Date and time | Action(s) | Altered

    -----------------------------------------------------------------------------

    --

    70 | install aide | 2016-05-05 10:58 | Install | 1

    69 | update -y | 2016-05-04 14:34 | Update | 18 EE

    68 | install vlc | 2016-04-21 17:12 | Install | 21

    67 | update -y | 2016-04-21 17:04 | Update | 7 EE

    66 | update -y | 2016-04-15 16:47 | E, I, U | 84 EE

    If package updates have not been performed on the system within the timeframe

    required by the site/program documentation, this is a finding.

    Typical update frequency may be overridden by Information Assurance Vulnerability

    Alert (IAVA) notifications from CYBERCOM.

    If the operating system is in non-compliance with the Information Assurance

    Vulnerability Management (IAVM) process, this is a finding.'
  remediation: 'Install the operating system patches or updated packages available from Oracle within

    30 days or sooner as local policy dictates.'
  checks:
  - type: manual_review
    info: 'Verify the operating system security patches and updates are installed and up to date.

      Updates are required to be applied with a frequency determined by the site or Program

      Management Office (PMO).

      Obtain the list of available package security updates from Oracle. The URL for updates

      is https://linux.oracle.com/errata/. It is important to note that updates provided by Oracle

      may not be present on the system if the underlying packages are not installed.

      Check that the available package security u'
    severity: medium
- id: '1.86'
  title: OL07-00-020270
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must not have unnecessary accounts. GROUP ID: V-221721 RULE ID: SV-221721r991589'
  rationale: Accounts providing no operational purpose provide additional opportunities for system compromise. Unnecessary
    accounts include user accounts for individuals not requiring access to the system and application accounts for applications
    not installed on the system.
  impact: ''
  references: []
  page_start: 185
  audit_raw: 'Verify all accounts on the system are assigned to an active system, application, or user

    account.

    Obtain the list of authorized system accounts from the Information System Security

    Officer (ISSO).

    Check the system accounts on the system with the following command:

    # more /etc/passwd

    root:x:0:0:root:/root:/bin/bash

    bin:x:1:1:bin:/bin:/sbin/nologin

    daemon:x:2:2:daemon:/sbin:/sbin/nologin

    sync:x:5:0:sync:/sbin:/bin/sync

    shutdown:x:6:0:shutdown:/sbin:/sbin/shutdown

    halt:x:7:0:halt:/sbin:/sbin/halt

    games:x:12:100:games:/usr/games:/sbin/nologin

    gopher:x:13:30:gopher:/var/gopher:/sbin/nologin

    Accounts such as "games" and "gopher" are not authorized accounts as they do not

    support authorized system functions.

    If the accounts on the system do not match the provided documentation, or accounts

    that do not support an authorized system function are present, this is a finding.'
  remediation: 'Configure the system so all accounts on the system are assigned to an active system,

    application, or user account.

    Remove accounts that do not support approved system activities or that allow for a

    normal user to perform administrative-level actions.

    Document all authorized accounts on the system.'
  checks:
  - type: manual_review
    info: 'Verify all accounts on the system are assigned to an active system, application, or user

      account.

      Obtain the list of authorized system accounts from the Information System Security

      Officer (ISSO).

      Check the system accounts on the system with the following command:

      # more /etc/passwd

      root:x:0:0:root:/root:/bin/bash

      bin:x:1:1:bin:/bin:/sbin/nologin

      daemon:x:2:2:daemon:/sbin:/sbin/nologin

      sync:x:5:0:sync:/sbin:/bin/sync

      shutdown:x:6:0:shutdown:/sbin:/sbin/shutdown

