- id: '1.58'
  title: OL07-00-010483
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Oracle Linux operating systems version 7.2 or newer booted with a BIOS must have a unique name for the grub
    superusers account when booting into single-user and maintenance modes. GROUP ID: V-244555 RULE ID: SV-244555r958472'
  rationale: If the system does not require valid authentication before it boots into single-user or maintenance mode, anyone
    who invokes single-user or maintenance mode is granted privileged access to all files on the system. GRUB 2 is the default
    boot loader for Oracle Linux 7 and is designed to require a password to boot into single-user mode or make modifications
    to the boot menu. The GRUB 2 superuser account is an account of last resort. Establishing a unique username for this account
    hardens the boot loader against brute force attacks. Due to the nature of the superuser account database being distinct
    from the OS account database, this allows the use of a username that is not among those within the OS account database.
    Examples of non-unique superusers names are root, superuser, unlock, etc.
  impact: ''
  references: []
  page_start: 128
  audit_raw: 'For systems that use UEFI, this is Not Applicable.

    For systems that are running a version of Oracle Linux prior to 7.2, this is Not

    Applicable.

    Verify that a unique name is set as the "superusers" account:

    $ sudo grep -iw "superusers" /boot/grub2/grub.cfg

    set superusers="[someuniquestringhere]"

    export superusers

    If "superusers" is identical to any OS account name or is missing a name, this is a

    finding.'
  remediation: 'Configure the system to have a unique name for the grub superusers account.

    Edit the /etc/grub.d/01_users file and add or modify the following lines:

    set superusers="[someuniquestringhere]"

    export superusers

    password_pbkdf2 [someuniquestringhere] ${GRUB2_PASSWORD}

    Generate a new grub.cfg file with the following command:

    $ sudo grub2-mkconfig -o /boot/grub2/grub.cfg'
  checks:
  - type: manual_review
    info: 'For systems that use UEFI, this is Not Applicable.

      For systems that are running a version of Oracle Linux prior to 7.2, this is Not

      Applicable.

      Verify that a unique name is set as the "superusers" account:

      $ sudo grep -iw "superusers" /boot/grub2/grub.cfg

      set superusers="[someuniquestringhere]"

      export superusers

      If "superusers" is identical to any OS account name or is missing a name, this is a

      finding.'
    severity: medium
