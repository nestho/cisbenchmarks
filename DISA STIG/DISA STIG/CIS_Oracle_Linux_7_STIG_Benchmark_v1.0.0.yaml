    Note: The "\n" characters are for formatting only. They will not be displayed on the

    Graphical User Interface.

    Run the following command to update the database:

    # dconf update'
  checks:
  - type: manual_review
    info: 'Verify the operating system displays the approved Standard Mandatory DoD Notice and

      Consent Banner before granting access to the operating system via a graphical user

