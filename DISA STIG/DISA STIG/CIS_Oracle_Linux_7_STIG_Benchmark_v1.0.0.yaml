  description: 'The Oracle Linux operating system must be configured so that all network connections associated with SSH traffic
    are terminated after 10 minutes of becoming unresponsive. GROUP ID: V-221849 RULE ID: SV-221849r970703'
  rationale: 'Terminating an unresponsive SSH session within a short time period reduces the window of opportunity for unauthorized
    personnel to take control of a management session enabled on the console or console port that has been left unattended.
    In addition, quickly terminating an idle SSH session will also free up resources committed by the managed network element.
    Terminating network connections associated with communications sessions includes, for example, deallocating associated
    TCP/IP address/port pairs at the operating system level and deallocating networking assignments at the application level
    if multiple application sessions are using a single operating system-level network connection. This does not mean the
    operating system terminates all sessions or network access; it only ends the unresponsive session and releases the resources
    associated with that session. Satisfies: SRG-OS-000163-GPOS-00072, SRG-OS-000279-GPOS-00109'
  impact: ''
  references: []
  page_start: 392
  audit_raw: "Verify the SSH server automatically terminates a user session after the SSH client has\nbeen unresponsive for\
    \ 10 minutes.\nCheck for the value of the \"ClientAliveInterval\" keyword with the following command:\n # grep -iw clientaliveinterval\
    \ /etc/ssh/sshd_config\n ClientAliveInterval 600\nIf \"ClientAliveInterval\" is not configured, is commented out, or has\
    \ a value of \"0\", this is\na finding.\nIf \"ClientAliveInterval\" has a value that is greater than \"600\" and is not\
    \ documented with\nthe information system security officer (ISSO) as an operational requirement, this is a\nfinding."
  remediation: "Note: This setting must be applied in conjunction with OL07-00-040340 to function\ncorrectly.\nConfigure the\
    \ SSH server to terminate a user session automatically after the SSH client\nhas become unresponsive.\nAdd the following\
    \ line (or modify the line to have the required value) to the\n\"/etc/ssh/sshd_config\" file (this file may be named differently\
    \ or be in a different location\nif using a version of SSH that is provided by a third-party vendor):\n ClientAliveInterval\
    \ 600\nThe SSH service must be restarted for changes to take effect."
  checks:
  - type: manual_review
    info: "Verify the SSH server automatically terminates a user session after the SSH client has\nbeen unresponsive for 10\
