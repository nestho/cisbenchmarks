    have a gid lower than 1000. Run it once for each local partition [PART]:

    # find [PART] -xdev -type d -perm -0002 -gid +999 -print

    If there is output, this is a finding.'
  remediation: 'All directories in local partitions which are world-writable should be group-owned by root

    or another system account. If any world-writable directories are not group-owned by a

    system account, this should be investigated. Following this, the directories should be

    deleted or assigned to an appropriate group.'
