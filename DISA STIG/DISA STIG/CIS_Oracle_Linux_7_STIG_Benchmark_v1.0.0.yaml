- id: '1.183'
  title: OL07-00-040110
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux 7 operating system must implement DoD-approved encryption to protect the confidentiality
    of SSH connections. GROUP ID: V-221840 RULE ID: SV-221840r958408'
  rationale: 'Unapproved mechanisms for authentication to the cryptographic module are not verified, and therefore cannot
    be relied upon to provide confidentiality or integrity, resulting in the compromise of DoD data. Operating systems using
    encryption are required to use FIPS-compliant mechanisms for authenticating to cryptographic modules. FIPS 140-2 is the
    current standard for validating mechanisms used to access cryptographic modules utilize authentication that meets DoD
    requirements. This allows for Security Levels 1, 2, 3, or 4 for use on a general-purpose computing system. The system
    will attempt to use the first cipher presented by the client that matches the server list. Listing the values "strongest
    to weakest" is a method to ensure the use of the strongest cipher available to secure the SSH connection. Satisfies: SRG-OS-000033-GPOS-00014,
    SRG-OS-000120-GPOS-00061, SRG-OS000125-GPOS-00065, SRG-OS-000250-GPOS-00093, SRG-OS-000393-GPOS00173,SRG-OS-000394-GPOS-00174'
  impact: ''
  references: []
  page_start: 370
  audit_raw: 'Verify the operating system uses mechanisms that meet the requirements of applicable

    federal laws, Executive orders, directives, policies, regulations, standards, and guidance

    for authentication to a cryptographic module.

    The location of the "sshd_config" file may vary if a different daemon is in use.

    Inspect the "Ciphers" configuration with the following command:

    # grep -i ciphers /etc/ssh/sshd_config

    Ciphers aes256-ctr,aes192-ctr,aes128-ctr

    If any ciphers other than "aes256-ctr", "aes192-ctr", or "aes128-ctr" are listed, the order

    differs from the example above, the "Ciphers" keyword is missing, or the returned line is

    commented out, this is a finding.'
  remediation: 'Configure SSH to use FIPS 140-2 approved cryptographic algorithms.

    Add the following line (or modify the line to have the required value) to the

    "/etc/ssh/sshd_config" file (this file may be named differently or be in a different location

    if using a version of SSH that is provided by a third-party vendor).

    Ciphers aes256-ctr,aes192-ctr,aes128-ctr

    The SSH service must be restarted for changes to take effect.'
  checks:
  - type: manual_review
    info: 'Verify the operating system uses mechanisms that meet the requirements of applicable

      federal laws, Executive orders, directives, policies, regulations, standards, and guidance

      for authentication to a cryptographic module.

      The location of the "sshd_config" file may vary if a different daemon is in use.

      Inspect the "Ciphers" configuration with the following command:

      # grep -i ciphers /etc/ssh/sshd_config

      Ciphers aes256-ctr,aes192-ctr,aes128-ctr

      If any ciphers other than "aes256-ctr", "aes192-ctr",'
    severity: medium
- id: '1.184'
  title: OL07-00-040160
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must be configured so that all network connections associated with a communication
    session are terminated at the end of the session or after 15 minutes of inactivity from the user at a command prompt,
    except to fulfill documented and validated mission requirements. GROUP ID: V-221841 RULE ID: SV-221841r1014784'
  rationale: Terminating an idle session within a short time period reduces the window of opportunity for unauthorized personnel
    to take control of a management session enabled on the console or console port that has been left unattended. In addition,
    quickly terminating an idle session will also free up resources committed by the managed network element. Terminating
    network connections associated with communications sessions includes, for example, de-allocating associated TCP/IP address/port
    pairs at the operating system level and de-allocating networking assignments at the application level if multiple application
    sessions are using a single operating system-level network connection. This does not mean that the operating system terminates
    all sessions or network access; it only ends the inactive session and releases the resources associated with that session.
  impact: ''
  references: []
  page_start: 373
  audit_raw: 'Verify the operating system terminates all network connections associated with a

    communications session at the end of the session or based on inactivity.

    Check the value of the system inactivity timeout with the following command:

    $ sudo grep -irw tmout /etc/profile /etc/bashrc /etc/profile.d

    etc/profile.d/tmout.sh:declare -xr TMOUT=600

    If conflicting results are returned, this is a finding.

    If "TMOUT" is not set to "600" or less to enforce session termination after inactivity, this

    is a finding.'
  remediation: 'Configure the operating system to terminate all network connections associated with a

    communications session at the end of the session or after a period of inactivity.

    Create a script to enforce the inactivity timeout (for example /etc/profile.d/tmout.sh) such

    as:

    #!/bin/bash

    declare -xr TMOUT=600'
  checks:
  - type: manual_review
    info: 'Verify the operating system terminates all network connections associated with a

      communications session at the end of the session or based on inactivity.

      Check the value of the system inactivity timeout with the following command:

      $ sudo grep -irw tmout /etc/profile /etc/bashrc /etc/profile.d

      etc/profile.d/tmout.sh:declare -xr TMOUT=600

      If conflicting results are returned, this is a finding.

      If "TMOUT" is not set to "600" or less to enforce session termination after inactivity, this

      is a finding'
    severity: medium
- id: '1.185'
  title: OL07-00-040170
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must display the Standard Mandatory DoD Notice and Consent Banner immediately
    prior to, or as part of, remote access logon prompts. GROUP ID: V-221842 RULE ID: SV-221842r958390'
  rationale: 'Display of a standardized and approved use notification before granting access to the publicly accessible operating
    system ensures privacy and security notification verbiage used is consistent with applicable federal laws, Executive Orders,
    directives, policies, regulations, standards, and guidance. System use notifications are required only for access via
    logon interfaces with human users and are not required when such human interfaces do not exist. The banner must be formatted
    in accordance with applicable DoD policy. Use the following verbiage for operating systems that can accommodate banners
    of 1300 characters: "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized
    use only. By using this IS (which includes any device attached to this IS), you consent to the following conditions: -The
    USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration
    testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence
    (CI) investigations. -At any time, the USG may inspect and seize data stored on this IS. -Communications using, or data
    stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed
    or used for any USGauthorized purpose. -This IS includes security measures (e.g., authentication and access controls)
    to protect USG interests--not for your personal benefit or privacy. -Notwithstanding the above, using this IS does not
    constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications,
    or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants.
    Such communications and work product are private and confidential. See User Agreement for details." Satisfies: SRG-OS-000023-GPOS-00006,
    SRG-OS-000024-GPOS-00007 , SRG-OS000228-GPOS-00088'
  impact: ''
  references: []
  page_start: 375
  audit_raw: 'Verify any publicly accessible connection to the operating system displays the Standard

    Mandatory DoD Notice and Consent Banner before granting access to the system.

    Check for the location of the banner file being used with the following command:

    # grep -i banner /etc/ssh/sshd_config

    banner /etc/issue

    This command will return the banner keyword and the name of the file that contains the

    ssh banner (in this case "/etc/issue").

    If the line is commented out, this is a finding.

    View the file specified by the banner keyword to check that it matches the text of the

    Standard Mandatory DoD Notice and Consent Banner:

    "You are accessing a U.S. Government (USG) Information System (IS) that is

    provided for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent

    to the following conditions:

    -The USG routinely intercepts and monitors communications on this IS for

    purposes including, but not limited to, penetration testing, COMSEC

    monitoring, network operations and defense, personnel misconduct (PM), law

    enforcement (LE), and counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are

    subject to routine monitoring, interception, and search, and may be disclosed

    or used for any USG-authorized purpose.

    -This IS includes security measures (e.g., authentication and access

    controls) to protect USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM,

    LE or CI investigative searching or monitoring of the content of privileged

    communications, or work product, related to personal representation or

    services by attorneys, psychotherapists, or clergy, and their assistants.

    Such communications and work product are private and confidential. See User

    Agreement for details."

    If the system does not display a graphical logon banner or the banner does not match

    the Standard Mandatory DoD Notice and Consent Banner, this is a finding.

    If the text in the file does not match the Standard Mandatory DoD Notice and Consent

    Banner, this is a finding.'
  remediation: 'Configure the operating system to display the Standard Mandatory DoD Notice and

    Consent Banner before granting access to the system via the ssh.

    Edit the "/etc/ssh/sshd_config" file to uncomment the banner keyword and configure it to

    point to a file that will contain the logon banner (this file may be named differently or be

    in a different location if using a version of SSH that is provided by a third-party vendor).

    An example configuration line is:

    banner /etc/issue

    Either create the file containing the banner or replace the text in the file with the

    Standard Mandatory DoD Notice and Consent Banner. The DoD required text is:

    "You are accessing a U.S. Government (USG) Information System (IS) that is

    provided for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent

    to the following conditions:

    -The USG routinely intercepts and monitors communications on this IS for

    purposes including, but not limited to, penetration testing, COMSEC

    monitoring, network operations and defense, personnel misconduct (PM), law

    enforcement (LE), and counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are

    subject to routine monitoring, interception, and search, and may be disclosed

    or used for any USG-authorized purpose.

    -This IS includes security measures (e.g., authentication and access

    controls) to protect USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM,

    LE or CI investigative searching or monitoring of the content of privileged

    communications, or work product, related to personal representation or

    services by attorneys, psychotherapists, or clergy, and their assistants.

    Such communications and work product are private and confidential. See User

    Agreement for details."

    The SSH service must be restarted for changes to take effect.'
  checks:
  - type: manual_review
    info: 'Verify any publicly accessible connection to the operating system displays the Standard

      Mandatory DoD Notice and Consent Banner before granting access to the system.

      Check for the location of the banner file being used with the following command:

      # grep -i banner /etc/ssh/sshd_config

      banner /etc/issue

      This command will return the banner keyword and the name of the file that contains the

      ssh banner (in this case "/etc/issue").

      If the line is commented out, this is a finding.

      View the file specifi'
    severity: medium
- id: '1.186'
  title: OL07-00-040180
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must implement cryptography to protect the integrity of Lightweight Directory
    Access Protocol (LDAP) authentication communications. GROUP ID: V-221843 RULE ID: SV-221843r991554'
  rationale: Without cryptographic integrity protections, information can be altered by unauthorized users without detection.
    Cryptographic mechanisms used for protecting the integrity of information include, for example, signed hash functions
    using asymmetric cryptography enabling distribution of the public key to verify the hash information while maintaining
    the confidentiality of the key used to generate the hash.
  impact: ''
  references: []
  page_start: 380
  audit_raw: "If LDAP is not being utilized, this requirement is Not Applicable.\nVerify the operating system implements cryptography\
    \ to protect the integrity of remote\nLDAP authentication sessions.\nTo determine if LDAP is being used for authentication,\
    \ use the following command:\n # systemctl status sssd.service\n sssd.service - System Security Services Daemon\n Loaded:\
    \ loaded (/usr/lib/systemd/system/sssd.service; enabled; vendor\npreset: disabled)\n Active: active (running) since Wed\
    \ 2018-06-27 10:58:11 EST; 1h 50min ago\nIf the \"sssd.service\" is \"active\", then LDAP is being used.\nDetermine the\
    \ \"id_provider\" the LDAP is currently using:\n # grep -ir id_provider /etc/sssd/sssd.conf /etc/sssd/conf.d/*.conf\n\
    \ id_provider = ad\nIf \"id_provider\" is set to \"ad\", this is Not Applicable.\nEnsure LDAP is configured to use TLS,\
    \ by using the following command:\n # grep -ir start_tls /etc/sssd/sssd.conf /etc/sssd/conf.d/*.conf\n ldap_id_use_start_tls\
    \ = true\nIf the \"ldap_id_use_start_tls\" option is not \"true\", this is a finding."
  remediation: "Configure the operating system to implement cryptography to protect the integrity of\nLDAP authentication\
    \ sessions.\nAdd or modify the following line in \"/etc/sssd/sssd.conf\":\n ldap_id_use_start_tls = true"
  checks:
  - type: manual_review
    info: "If LDAP is not being utilized, this requirement is Not Applicable.\nVerify the operating system implements cryptography\
      \ to protect the integrity of remote\nLDAP authentication sessions.\nTo determine if LDAP is being used for authentication,\
      \ use the following command:\n # systemctl status sssd.service\n sssd.service - System Security Services Daemon\n Loaded:\
      \ loaded (/usr/lib/systemd/system/sssd.service; enabled; vendor\npreset: disabled)\n Active: active (running) since\
      \ Wed 2018-06-27 10:58:11 EST; 1h "
    severity: medium
