- id: '1.11'
  title: OL07-00-010070
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must initiate a screensaver after a 15-minute period of inactivity for graphical
    user interfaces. GROUP ID: V-221660 RULE ID: SV-221660r958402'
  rationale: A session time-out lock is a temporary action taken when a user stops work and moves away from the immediate
    physical vicinity of the information system, but does not log out because of the temporary nature of the absence. Rather
    than relying on the user to lock the operating system session manually prior to leaving the workstation, operating systems
    must be able to identify when a user's session has idled, and take action to initiate the session lock. The session lock
    is implemented at the point where session activity can be determined and/or controlled.
  impact: ''
  references: []
  page_start: 40
  audit_raw: "Verify the operating system initiates a screensaver after a 15-minute period of inactivity\nfor graphical user\
    \ interfaces.\nNote: If the system does not have GNOME installed, this requirement is Not Applicable.\nCheck to see if\
    \ GNOME is configured to display a screensaver after a 15 minute delay\nwith the following command:\n # grep -i idle-delay\
    \ /etc/dconf/db/local.d/*\n idle-delay=uint32 900\nIf the \"idle-delay\" setting is missing or is not set to \"900\" or\
    \ less, this is a finding."
  remediation: "Configure the operating system to initiate a screensaver after a 15-minute period of\ninactivity for graphical\
    \ user interfaces.\nCreate a database to contain the system-wide screensaver settings (if it does not\nalready exist)\
    \ with the following command:\n # touch /etc/dconf/db/local.d/00-screensaver\nEdit /etc/dconf/db/local.d/00-screensaver\
    \ and add or update the following lines:\n [org/gnome/desktop/session]\n # Set the lock time out to 900 seconds before\
    \ the session is considered idle\n idle-delay=uint32 900\nYou must include the \"uint32\" along with the integer key values\
    \ as shown.\nUpdate the system databases:\n # dconf update\nUsers must log out and then log in again before the system-wide\
    \ settings take effect."
  checks:
  - type: manual_review
    info: "Verify the operating system initiates a screensaver after a 15-minute period of inactivity\nfor graphical user\
      \ interfaces.\nNote: If the system does not have GNOME installed, this requirement is Not Applicable.\nCheck to see\
      \ if GNOME is configured to display a screensaver after a 15 minute delay\nwith the following command:\n # grep -i idle-delay\
      \ /etc/dconf/db/local.d/*\n idle-delay=uint32 900\nIf the \"idle-delay\" setting is missing or is not set to \"900\"\
      \ or less, this is a finding."
    severity: medium
