  description: 'The Oracle Linux operating system must be configured so that the SSH daemon is configured to only use Message
    Authentication Codes (MACs) employing FIPS 140-2 approved cryptographic hash algorithms. GROUP ID: V-221857 RULE ID: SV-221857r991554'
  rationale: DoD information systems are required to use FIPS 140-2 approved cryptographic hash functions. The only SSHv2
    hash algorithm meeting this requirement is SHA. The system will attempt to use the first hash presented by the client
    that matches the server list. Listing the values "strongest to weakest" is a method to ensure the use of the strongest
    hash available to secure the SSH connection.
  impact: ''
  references: []
  page_start: 406
  audit_raw: 'Verify the SSH daemon is configured to only use MACs employing FIPS 140-2approved hashes.

    Note: If OL07-00-021350 is a finding, this is automatically a finding, as the system

    cannot implement FIPS 140-2-approved cryptographic algorithms and hashes.

    Check that the SSH daemon is configured to only use MACs employing FIPS 140-2approved hashes with the following command:

    # grep -i macs /etc/ssh/sshd_config

    MACs hmac-sha2-512,hmac-sha2-256

    If any ciphers other than "hmac-sha2-512" or "hmac-sha2-256" are listed, the order

    differs from the example above, they are missing, or the returned line is commented out,

    this is a finding.'
  remediation: 'Edit the "/etc/ssh/sshd_config" file to uncomment or add the line for the "MACs"

    keyword and set its value to "hmac-sha2-512" and/or "hmac-sha2-256" (this file may be

    named differently or be in a different location if using a version of SSH that is provided

    by a third-party vendor):

    MACs hmac-sha2-512,hmac-sha2-256

    The SSH service must be restarted for changes to take effect.'
  checks:
  - type: manual_review
    info: 'Verify the SSH daemon is configured to only use MACs employing FIPS 140-2approved hashes.

      Note: If OL07-00-021350 is a finding, this is automatically a finding, as the system

      cannot implement FIPS 140-2-approved cryptographic algorithms and hashes.

