- id: '1.182'
  title: OL07-00-040100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must be configured to prohibit or restrict the use of functions, ports,
    protocols, and/or services, as defined in the Ports, Protocols, and Services Management Component Local Service Assessment
    (PPSM CLSA) and vulnerability assessments. GROUP ID: V-221839 RULE ID: SV-221839r958480'
  rationale: 'In order to prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized
    tunneling (i.e., embedding of data types within data types), organizations must disable or restrict unused or unnecessary
    physical and logical ports/protocols on information systems. Operating systems are capable of providing a wide variety
    of functions and services. Some of the functions and services provided by default may not be necessary to support essential
    organizational operations. Additionally, it is sometimes convenient to provide multiple services from a single component
    (e.g., VPN and IPS); however, doing so increases risk over limiting the services provided by any one component. To support
    the requirements and principles of least functionality, the operating system must support the organizational requirements,
    providing only essential capabilities and limiting the use of ports, protocols, and/or services to only those required,
    authorized, and approved to conduct official business or to address authorized quality of life issues. Satisfies: SRG-OS-000096-GPOS-00050,
    SRG-OS-000297-GPOS-00115'
  impact: ''
  references: []
  page_start: 368
  audit_raw: 'Inspect the firewall configuration and running services to verify that it is configured to

    prohibit or restrict the use of functions, ports, protocols, and/or services that are

    unnecessary or prohibited.

    Check which services are currently active with the following command:

    # firewall-cmd --list-all

    public (default, active)

    interfaces: enp0s3

    sources:

    services: dhcpv6-client dns http https ldaps rpc-bind ssh

    ports:

    masquerade: no

    forward-ports:

    icmp-blocks:

    rich rules:

    Ask the System Administrator for the site or program PPSM CLSA. Verify the services

    allowed by the firewall match the PPSM CLSA.

    If there are additional ports, protocols, or services that are not in the PPSM CLSA, or

    ports, protocols, or services prohibited by the PPSM Category Assurance List (CAL),

    this is a finding.'
  remediation: 'Update the host''s firewall settings and/or running services to comply with the PPSM

    CLSA for the site or program and the PPSM CAL.'
  checks:
  - type: manual_review
    info: 'Inspect the firewall configuration and running services to verify that it is configured to

      prohibit or restrict the use of functions, ports, protocols, and/or services that are

