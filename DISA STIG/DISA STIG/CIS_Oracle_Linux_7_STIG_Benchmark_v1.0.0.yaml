controls:
- id: '1.1'
  title: OL07-00-010010
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Oracle Linux operating system must be configured so that the file permissions, ownership, and group membership
    of system files and commands match the vendor values. GROUP ID: V-221652 RULE ID: SV-221652r991557'
  rationale: 'Discretionary access control is weakened if a user or group has access permissions to system files and directories
    greater than the default. Satisfies: SRG-OS-000257-GPOS-00098, SRG-OS-000278-GPOS-00108'
  impact: ''
  references: []
  page_start: 15
  audit_raw: "Verify the file permissions, ownership, and group membership of system files and\ncommands match the vendor\
    \ values.\nCheck the default file permissions, ownership, and group membership of system files\nand commands with the\
    \ following command:\n # for i in `rpm -Va | grep -E '^.{1}M|^.{5}U|^.{6}G' | cut -d \" \" -f 4,5`;do\nfor j in `rpm -qf\
    \ $i`;do rpm -ql $j --dump | cut -d \" \" -f 1,5,6,7 | grep\n$i;done;done\n /var/log/gdm 040755 root root\n /etc/audisp/audisp-remote.conf\
    \ 0100640 root root\n /usr/bin/passwd 0104755 root root\nFor each file returned, verify the current permissions, ownership,\
    \ and group\nmembership:\n# ls -la\n -rw-------. 1 root root 2017 Nov 1 10:03 /etc/audisp/audisp-remote.conf\nIf the file\
    \ is more permissive than the default permissions, this is a finding.\nIf the file is not owned by the default owner and\
    \ is not documented with the Information\nSystem Security Officer (ISSO), this is a finding.\nIf the file is not a member\
    \ of the default group and is not documented with the ISSO,\nthis is a finding."
  remediation: "Run the following command to determine which package owns the file:\n # rpm -qf <filename>\nReset the user\
    \ and group ownership of files within a package with the following\ncommand:\n # rpm --setugids <packagename>\nReset the\
    \ permissions of files within a package with the following command:\n # rpm --setperms <packagename>"
  checks:
  - type: command
    command: '# for i in `rpm -Va | grep -E ''^.{1}M|^.{5}U|^.{6}G'' | cut -d " " -f 4,5`;do'
    expected: ''
    severity: medium
    info: "Verify the file permissions, ownership, and group membership of system files and\ncommands match the vendor values.\n\
      Check the default file permissions, ownership, and group membership of system files\nand commands with the following\
      \ command:\n # for i in `rpm -Va | grep -E '^.{1}M|^.{5}U|^.{6}G' | cut -d \" \" -f 4,5`;do\nfor j in `rpm -qf $i`;do\
      \ rpm -ql $j --dump | cut -d \" \" -f 1,5,6,7 | grep\n$i;done;"
- id: '1.2'
  title: OL07-00-010019
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must ensure cryptographic verification of vendor software packages. GROUP
    ID: V-256975 RULE ID: SV-256975r1015198'
  rationale: Cryptographic verification of vendor software packages ensures that all software packages are obtained from a
    valid source and protects against spoofing that could lead to installation of malware on the system. Oracle cryptographically
    signs all software packages, which includes updates, with a GPG key to verify that they are valid.
  impact: ''
  references: []
  page_start: 17
  audit_raw: "Confirm Oracle package-signing key is installed on the system and verify its fingerprint\nmatches vendor value.\n\
    Note: The GPG key is defined in key file \"/etc/pki/rpm-gpg/RPM-GPG-KEY-oracle\" by\ndefault.\nList Oracle GPG keys installed\
    \ on the system:\n $ sudo rpm -q --queryformat \"%{SUMMARY}\\n\" gpg-pubkey | grep -i \"oracle\"\n gpg(Oracle OSS group\
    \ (Open Source Software group) <build@oss.oracle.com>)\nIf Oracle GPG key is not installed, this is a finding.\nList key\
    \ fingerprint of installed Oracle GPG key:\n $ sudo gpg -q --with-fingerprint /etc/pki/rpm-gpg/RPM-GPG-KEY-oracle\nIf\
    \ key file \"/etc/pki/rpm-gpg/RPM-GPG-KEY-oracle\" is missing, this is a finding.\nExample output:\n pub 2048R/EC551F03\
    \ 2010-07-01 Oracle OSS group (Open Source Software group)\n<build@oss.oracle.com>\n Key fingerprint = 4214 4123 FECF\
    \ C55B 9086 313D 72F9 7B74 EC55 1F03\nCompare key fingerprint of installed Oracle GPG key with fingerprint listed for\
    \ OL 7 on\nOracle verification webpage at https://linux.oracle.com/security/gpg/#gpg.\nIf key fingerprint does not match,\
    \ this is a finding."
  remediation: "Install Oracle package-signing key on the system and verify its fingerprint matches\nvendor value.\nInsert\
    \ OL 7 installation disc or attach OL 7 installation image to the system. Mount the\ndisc or image to make the contents\
    \ accessible inside the system.\nAssuming the mounted location is \"/media/cdrom\", use the following command to copy\n\
    Oracle GPG key file onto the system:\n $ sudo cp /media/cdrom/RPM-GPG-KEY-oracle /etc/pki/rpm-gpg/\nImport Oracle GPG\
    \ keys from key file into system keyring:\n $ sudo rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-oracle\nUsing the steps listed\
    \ in the Check Text, confirm the newly imported key shows as\ninstalled on the system and verify its fingerprint matches\
    \ vendor value."
  checks:
  - type: command
    command: $ sudo rpm -q --queryformat "%{SUMMARY}\n" gpg-pubkey | grep -i "oracle"
    expected: ''
    severity: medium
    info: "Confirm Oracle package-signing key is installed on the system and verify its fingerprint\nmatches vendor value.\n\
      Note: The GPG key is defined in key file \"/etc/pki/rpm-gpg/RPM-GPG-KEY-oracle\" by\ndefault.\nList Oracle GPG keys\
      \ installed on the system:\n $ sudo rpm -q --queryformat \"%{SUMMARY}\\n\" gpg-pubkey | grep -i \"oracle\"\n gpg(Oracle\
      \ OSS group (Open Source Software group) <build@oss.oracle.com>)\nIf "
- id: '1.3'
  title: OL07-00-010020
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Oracle Linux operating system must be configured so that the cryptographic hash of system files and commands
    matches vendor values. GROUP ID: V-221653 RULE ID: SV-221653r1015161'
  rationale: Without cryptographic integrity protections, system command and files can be altered by unauthorized users without
    detection. Cryptographic mechanisms used for protecting the integrity of information include, for example, signed hash
    functions using asymmetric cryptography enabling distribution of the public key to verify the hash information while maintaining
    the confidentiality of the key used to generate the hash.
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'Verify the cryptographic hash of system files and commands match the vendor values.

    Check the cryptographic hash of system files and commands with the following

    command:

    Note: System configuration files (indicated by a "c" in the second column) are expected

    to change over time. Unusual modifications should be investigated through the system

    audit log.

    # rpm -Va --noconfig | grep ''^..5''

    If there is any output from the command for system files or binaries, this is a finding.'
  remediation: 'Run the following command to determine which package owns the file:

    # rpm -qf <filename>

    The package can be reinstalled from a yum repository using the command:

    # sudo yum reinstall <packagename>

    Alternatively, the package can be reinstalled from trusted media using the command:

    # sudo rpm -Uvh <packagename>'
  checks:
  - type: command
    command: '# rpm -Va --noconfig | grep ''^..5'''
    expected: ''
    severity: medium
    info: 'Verify the cryptographic hash of system files and commands match the vendor values.

      Check the cryptographic hash of system files and commands with the following

      command:

      Note: System configuration files (indicated by a "c" in the second column) are expected

      to change over time. Unusual modifications should be investigated through the system

      audit log.

      # rpm -Va --noconfig | grep ''^..5''

      If there is'
- id: '1.4'
  title: OL07-00-010030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must display the Standard Mandatory DoD Notice and Consent Banner before
    granting local or remote access to the system via a graphical user logon. GROUP ID: V-221654 RULE ID: SV-221654r958390'
  rationale: 'The display of a standardized and approved use notification before granting access to the operating system ensures
    privacy and security notification verbiage used is consistent with applicable federal laws, Executive Orders, directives,
    policies, regulations, standards, and guidance. System use notifications are required only for access via logon interfaces
    with human users and are not required when such human interfaces do not exist. The banner must be formatted in accordance
    with applicable DoD policy. Use the following verbiage for operating systems that can accommodate banners of 1300 characters:
    "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only. By using
    this IS (which includes any device attached to this IS), you consent to the following conditions: -The USG routinely intercepts
    and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring,
    network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.
    -At any time, the USG may inspect and seize data stored on this IS. -Communications using, or data stored on, this IS
    are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USGauthorized
    purpose. -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not
    for your personal benefit or privacy. -Notwithstanding the above, using this IS does not constitute consent to PM, LE
    or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal
    representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work
    product are private and confidential. See User Agreement for details." Satisfies: SRG-OS-000023-GPOS-00006, SRG-OS-000024-GPOS-00007,
    SRG-OS000228-GPOS-00088'
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Verify the operating system displays the Standard Mandatory DoD Notice and Consent

    Banner before granting access to the operating system via a graphical user logon.

    Note: If the system does not have GNOME installed, this requirement is Not Applicable.

    Check to see if the operating system displays a banner at the logon screen with the

    following command:

    # grep banner-message-enable /etc/dconf/db/local.d/*

    banner-message-enable=true

    If "banner-message-enable" is set to "false" or is missing, this is a finding.'
  remediation: 'Configure the operating system to display the Standard Mandatory DoD Notice and

    Consent Banner before granting access to the system.

    Note: If the system does not have GNOME installed, this requirement is Not Applicable.

    Create a database to contain the system-wide graphical user logon settings (if it does

    not already exist) with the following command:

    # touch /etc/dconf/db/local.d/01-banner-message

    Add the following line to the [org/gnome/login-screen] section of the

    "/etc/dconf/db/local.d/01-banner-message":

    [org/gnome/login-screen]

    banner-message-enable=true

    Update the system databases:

    # dconf update

    Users must log out, and then log in again before the system-wide settings take effect.'
  checks:
  - type: manual_review
    info: 'Verify the operating system displays the Standard Mandatory DoD Notice and Consent

      Banner before granting access to the operating system via a graphical user logon.

      Note: If the system does not have GNOME installed, this requirement is Not Applicable.

      Check to see if the operating system displays a banner at the logon screen with the

      following command:

      # grep banner-message-enable /etc/dconf/db/local.d/*

      banner-message-enable=true

      If "banner-message-enable" is set to "false" or is missing, this '
    severity: medium
