- id: '1.7'
  title: OL07-00-010060
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must enable a user session lock until that user reestablishes access using
    established identification and authentication procedures. GROUP ID: V-221657 RULE ID: SV-221657r1015162'
  rationale: 'A session lock is a temporary action taken when a user stops work and moves away from the immediate physical
    vicinity of the information system but does not want to log out because of the temporary nature of the absence. The session
    lock is implemented at the point where session activity can be determined. Regardless of where the session lock is determined
    and implemented, once invoked, the session lock must remain in place until the user reauthenticates. No other activity
    aside from reauthentication must unlock the system. Satisfies: SRG-OS-000028-GPOS-00009, SRG-OS-000030-GPOS-00011'
  impact: ''
  references: []
  page_start: 32
  audit_raw: "Verify the operating system enables a user's session lock until that user re-establishes\naccess using established\
    \ identification and authentication procedures.\nNote: If the system does not have GNOME installed, this requirement is\
    \ Not Applicable.\nCheck to see if the screen lock is enabled with the following command:\n # grep -i lock-enabled /etc/dconf/db/local.d/*\n\
    \ lock-enabled=true\nIf the \"lock-enabled\" setting is missing or is not set to \"true\", this is a finding."
  remediation: "Configure the operating system to enable a user's session lock until that user reestablishes access using\
    \ established identification and authentication procedures.\nCreate a database to contain the system-wide screensaver\
    \ settings (if it does not\nalready exist) with the following example:\n # touch /etc/dconf/db/local.d/00-screensaver\n\
    Edit the \"[org/gnome/desktop/screensaver]\" section of the database file and add or\nupdate the following lines:\n #\
    \ Set this to true to lock the screen when the screensaver activates\n lock-enabled=true\nUpdate the system databases:\n\
    \ # dconf update\nUsers must log out and then log in again before the system-wide settings take effect."
  checks:
  - type: manual_review
    info: "Verify the operating system enables a user's session lock until that user re-establishes\naccess using established\
      \ identification and authentication procedures.\nNote: If the system does not have GNOME installed, this requirement\
      \ is Not Applicable.\nCheck to see if the screen lock is enabled with the following command:\n # grep -i lock-enabled\
      \ /etc/dconf/db/local.d/*\n lock-enabled=true\nIf the \"lock-enabled\" setting is missing or is not set to \"true\"\
      , this is a finding."
    severity: medium
