- id: '1.224'
  title: OL07-00-040670
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Network interfaces configured on The Oracle Linux operating system must not be in promiscuous mode. GROUP
    ID: V-221882 RULE ID: SV-221882r991589'
  rationale: Network interfaces in promiscuous mode allow for the capture of all network traffic visible to the system. If
    unauthorized individuals can access these applications, it may allow them to collect information such as logon IDs, passwords,
    and key exchanges between systems. If the system is being used to perform a network troubleshooting function, the use
    of these tools must be documented with the Information System Security Officer (ISSO) and restricted to authorized personnel
    only.
  impact: ''
  references: []
  page_start: 449
  audit_raw: 'Verify network interfaces are not in promiscuous mode unless approved by the ISSO

    and documented.

    Check for the status with the following command:

