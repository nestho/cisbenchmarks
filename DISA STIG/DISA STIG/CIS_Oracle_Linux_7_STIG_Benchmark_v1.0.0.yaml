- id: '1.72'
  title: OL07-00-020050
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Oracle Linux operating system must prevent the installation of software, patches, service packs, device
    drivers, or operating system components from a repository without verification they have been digitally signed using a
    certificate that is issued by a Certificate Authority (CA) that is recognized and approved by the organization. GROUP
    ID: V-221710 RULE ID: SV-221710r1015187'
  rationale: Changes to any software components can have significant effects on the overall security of the operating system.
    This requirement ensures the software has not been tampered with and that it has been provided by a trusted vendor. Accordingly,
    patches, service packs, device drivers, or operating system components must be signed with a certificate recognized and
    approved by the organization. Verifying the authenticity of the software prior to installation validates the integrity
    of the patch or upgrade received from a vendor. This verifies the software has not been tampered with and that it has
    been provided by a trusted vendor. Self-signed certificates are disallowed by this requirement. The operating system should
    not have to verify the software again. This requirement does not mandate DoD certificates for this purpose; however, the
    certificate used to verify the software must be from an approved CA.
  impact: ''
  references: []
  page_start: 158
  audit_raw: 'Verify the operating system prevents the installation of patches, service packs, device

    drivers, or operating system components from a repository without verification that they

    have been digitally signed using a certificate that is recognized and approved by the

    organization.

