- id: '1.64'
  title: OL07-00-020020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must prevent nonprivileged users from executing privileged functions to
    include disabling, circumventing, or altering implemented security safeguards/countermeasures. GROUP ID: V-221707 RULE
    ID: SV-221707r958726'
  rationale: Preventing nonprivileged users from executing privileged functions mitigates the risk that unauthorized individuals
    or processes may gain unnecessary access to information or privileges. Privileged functions include, for example, establishing
    accounts, performing system integrity checks, or administering cryptographic key management activities. Nonprivileged
    users are individuals who do not possess appropriate authorizations. Circumventing intrusion detection and prevention
    mechanisms or malicious code protection mechanisms are examples of privileged functions that require protection from nonprivileged
    users.
  impact: ''
  references: []
  page_start: 140
  audit_raw: "Verify the operating system prevents nonprivileged users from executing privileged\nfunctions to include disabling,\
    \ circumventing, or altering implemented security\nsafeguards/countermeasures.\nObtain a list of authorized users for\
    \ the system.\nCheck the list against the system by using the following command:\n $ sudo semanage login -l | more\n Login\
    \ Name SELinux User MLS/MCS Range Service\n __default__ user_u s0-s0:c0.c1023 *\n root unconfined_u s0-s0:c0.c1023 *\n\
    \ system_u system_u s0-s0:c0.c1023 *\n joe staff_u s0-s0:c0.c1023 *\nAll administrators must be mapped to the \"staff_u\"\
    , or an appropriately tailored confined\nSELinux user as defined by the organization.\nAll authorized nonadministrative\
    \ users must be mapped to the \"user_u\" SELinux user.\nIf they are not mapped in this way, this is a finding.\nIf administrator\
    \ accounts are mapped to the \"sysadm_u\" SELinux user and are not\ndocumented as an operational requirement with the\
    \ information system security officer\n(ISSO), this is a finding.\nIf administrator accounts are mapped to the \"sysadm_u\"\
    \ SELinux user and are\ndocumented as an operational requirement with the ISSO, this can be downgraded to a\nCAT III."
  remediation: "Configure the operating system to prevent nonprivileged users from executing privileged\nfunctions to include\
    \ disabling, circumventing, or altering implemented security\nsafeguards/countermeasures.\nUse the following command to\
    \ map a new user to the \"staff_u\" SELinux user:\n $ sudo semanage login -a -s staff_u <username>\nUse the following\
    \ command to map an existing user to the \"staff_u\" SELinux user:\n $ sudo semanage login -m -s staff_u <username>\n\
    Use the following command to map a new user to the \"user_u\" SELinux user:\n $ sudo semanage login -a -s user_u <username>\n\
    Use the following command to map an existing user to the \"user_u\" SELinux user:\n $ sudo semanage login -m -s user_u\
    \ <username>"
  checks:
