- id: '1.228'
  title: OL07-00-040710
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Oracle Linux operating system must be configured so that remote X connections are disabled, unless to
    fulfill documented and validated mission requirements. GROUP ID: V-221886 RULE ID: SV-221886r991589'
  rationale: The security risk of using X11 forwarding is that the client's X11 display server may be exposed to attack when
    the SSH client requests forwarding. A system administrator may have a stance in which they want to protect clients that
    may expose themselves to attack by unwittingly requesting X11 forwarding, which can warrant a ''no'' setting. X11 forwarding
    should be enabled with caution. Users with the ability to bypass file permissions on the remote host (for the user's X11
    authorization database) can access the local X11 display through the forwarded connection. An attacker may then be able
    to perform activities such as keystroke monitoring if the ForwardX11Trusted option is also enabled. If X11 services are
    not required for the system's intended function, they should be disabled or restricted as appropriate to the system’s
    needs.
  impact: ''
  references: []
  page_start: 455
  audit_raw: 'Determine if X11Forwarding is disabled with the following command:

    # grep -i x11forwarding /etc/ssh/sshd_config | grep -v "^#"

    X11Forwarding no

    If the "X11Forwarding" keyword is set to "yes" and is not documented with the

    Information System Security Officer (ISSO) as an operational requirement or is missing,

    this is a finding.'
  remediation: 'Edit the "/etc/ssh/sshd_config" file to uncomment or add the line for the

    "X11Forwarding" keyword and set its value to "no" (this file may be named differently or

    be in a different location if using a version of SSH that is provided by a third-party

    vendor):

    X11Forwarding no

    The SSH service must be restarted for changes to take effect:

    # systemctl restart sshd'
  checks:
  - type: command
    command: '# grep -i x11forwarding /etc/ssh/sshd_config | grep -v "^#"'
    expected: ''
    severity: medium
    info: 'Determine if X11Forwarding is disabled with the following command:

