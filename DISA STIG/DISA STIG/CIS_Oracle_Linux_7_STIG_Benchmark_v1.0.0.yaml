  description: 'The Oracle Linux operating system must be configured so that all files and directories have a valid owner.
    GROUP ID: V-221724 RULE ID: SV-221724r991589'
  rationale: Unowned files and directories may be unintentionally inherited if a user is assigned the same User Identifier
    (UID) as the UID of the un-owned files.
  impact: ''
  references: []
  page_start: 189
  audit_raw: 'Verify all files and directories on the system have a valid owner.

