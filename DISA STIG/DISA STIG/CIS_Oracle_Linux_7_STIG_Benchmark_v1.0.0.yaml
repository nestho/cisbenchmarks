    being used.

    # grep enable-smartcard-authentication /etc/dconf/db/local.d/*

    enable-smartcard-authentication=true

    If "enable-smartcard-authentication" is set to "false" or the keyword is missing, this is a

    finding.'
  remediation: 'Configure the operating system to uniquely identify and authenticate users using

    multifactor authentication via a graphical user logon.

    Note: If the system does not have GNOME installed, this requirement is Not Applicable.

    Create a database to contain the system-wide screensaver settings (if it does not

    already exist) with the following command:

    Note: The example is using the local system database, so if the system is using another

    database in "/etc/dconf/profile/user", create the file under the appropriate subdirectory.

    # touch /etc/dconf/db/local.d/00-defaults

