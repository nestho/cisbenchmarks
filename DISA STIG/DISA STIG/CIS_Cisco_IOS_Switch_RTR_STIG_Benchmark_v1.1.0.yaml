- id: '1.18'
  title: CISC-RT-000240
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco perimeter switch must be configured to deny network traffic by default and allow network traffic
    by exception. GROUP ID: V-220440 RULE ID: SV-220440r622190'
  rationale: A deny-all, permit-by-exception network communications traffic policy ensures that only connections that are
    essential and approved are allowed. This requirement applies to both inbound and outbound network communications traffic.
    All inbound and outbound traffic must be denied by default. Firewalls and perimeter switches should only allow traffic
    through that is explicitly permitted. The initial defense for the internal network is to block any traffic at the perimeter
    that is attempting to make a connection to a host residing on the internal network. In addition, allowing unknown or undesirable
    outbound traffic by the firewall or switch will establish a state that will permit the return of this undesirable traffic
    inbound.
  impact: ''
  references: []
  page_start: 47
  audit_raw: "Review the switch configuration to verify that the inbound access control list (ACL)\napplied to all external\
    \ interfaces is configured to allow specific ports and protocols and\ndeny all other traffic.\nStep 1: Verify that an\
    \ inbound ACL is applied to all external interfaces as shown in the\nexample below:\ninterface GigabitEthernet0/2\n ip\
    \ address x.11.1.2 255.255.255.254\n ip access-group EXTERNAL_ACL in\nStep 2: Review the inbound ACL to verify that it\
    \ is configured to deny all other traffic that\nis not explicitly allowed.\nip access-list extended EXTERNAL_ACL\n permit\
    \ tcp any any established\n permit icmp host x.11.1.1 host x.11.1.2 echo\n permit icmp host x.11.1.1 host x.11.1.2 echo-reply\n\
    …\n…\n…\ndeny ip any any log-input\nIf the ACL is not configured to allow specific ports and protocols and deny all other\n\
    traffic, this is a finding.\nIf the ACL is not configured inbound on all external interfaces, this is a finding."
  remediation: 'Step 1: Configure an inbound ACL to deny all other traffic by default as shown in the

    example below:

    SW1(config)#ip access-list extended EXTERNAL_ACL

    SW1(config-ext-nacl)#permit tcp any any established

    SW1(config-ext-nacl)#permit icmp host x.11.1.1 host x.11.1.2 echo

