- id: '1.33'
  title: CISC-RT-000393
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco perimeter switch must be configured drop IPv6 packets with a Routing Header type 0, 1, or 3-255.
    GROUP ID: V-237763 RULE ID: SV-237763r856665'
  rationale: The routing header can be used maliciously to send a packet through a path where less robust security is in place,
    rather than through the presumably preferred path of routing protocols. Use of the routing extension header has few legitimate
    uses other than as implemented by Mobile IPv6. The Type 0 Routing Header (RFC 5095) is dangerous because it allows attackers
    to spoof source addresses and obtain traffic in response, rather than the real owner of the address. Secondly, a packet
    with an allowed destination address could be sent through a Firewall using the Routing Header functionality, only to bounce
    to a different node once inside. The Type 1 Routing Header is defined by a specification called "Nimrod Routing", a discontinued
    project funded by DARPA. Assuming that most implementations will not recognize the Type 1 Routing Header, it must be dropped.
    The Type 3–255 Routing Header values in the routing type field are currently undefined and should be dropped inbound and
    outbound.
  impact: ''
  references: []
  page_start: 75
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the switch configuration to determine if\
    \ it is configured to drop IPv6 packets\ncontaining a Routing Header of type 0, 1, or 3-255.\nStep 1: Verify that an inbound\
    \ IPv6 ACL has been configured on the external interface.\ninterface gigabitethernet1/0\n ipv6 address 2001::1:0:22/64\n\
    \ ipv6 traffic-filter FILTER_IPV6 in\nStep 2: Verify that the ACL drops IPv6 packets with a Routing Header type 0, 1,\
    \ or 3255 as shown in the example below.\nipv6 access-list FILTER_IPV6\n permit ipv6 any host 2001:DB8::1:1:1234 routing-type\
    \ 2\n deny ipv6 any any log routing\n permit ipv6 …\n …\n …\n …\ndeny ipv6 any any log\nNote: The example above allows\
    \ routing-type 2 in the event Mobility IPv6 is deployed.\nIf the switch is not configured to drop IPv6 packets containing\
    \ a Routing Header of type\n0, 1, or 3-255, this is a finding."
  remediation: 'Configure the switch to drop IPv6 packets with Routing Header of type 0, 1, or 3-255 as

    shown in the example below. SW1(config)#ipv6 access-list FILTER_IPV6 SW1(configipv6-acl)#permit ipv6 any host 2001:DB8::0:1:1:1234
    routing-type 2 SW1(config-ipv6acl)#deny ipv6 any any routing log SW1(config-ipv6-acl)#permit … … … … SW1(configipv6-acl)#deny
    ipv6 any any log SW1(config-ipv6-acl)#exit SW1(config)#int g1/0

    SW1(config-if)#ipv6 traffic-filter FILTER_IPV6'
  checks:
  - type: manual_review
    info: "This requirement is not applicable for the DODIN Backbone.\nReview the switch configuration to determine if it\
