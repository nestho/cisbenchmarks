      \ OSPF\nis the routing protocol used within the network.\ninterface GigabitEthernet0/1\n no switchport\n ip address\
      \ 10.2.1.1 255.255.255.252\n ip access-group FI"
    severity: medium
- id: '1.2'
  title: CISC-RT-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to enable routing protocol authentication using FIPS 198-1 algorithms
    with keys not exceeding 180 days of lifetime. GROUP ID: V-220423 RULE ID: SV-220423r929046'
  rationale: A rogue router could send a fictitious routing update to convince a site's perimeter router to send traffic to
    an incorrect or even a rogue destination. This diverted traffic could be analyzed to learn confidential information about
    the site's network or used to disrupt the network's ability to communicate with other networks. This is known as a "traffic
    attraction attack" and is prevented by configuring neighbor router authentication using FIPS 198-1 algorithms for routing
    updates. If the keys used for authentication are guessed, the malicious user could create havoc within the network by
    advertising incorrect routes and redirecting traffic. Some routing protocols allow the use of key chains for authentication.
    A key chain is a set of keys that is used in succession, with each having a lifetime of no more than 180 days. Changing
    the keys frequently reduces the risk of them eventually being guessed. If a time period occurs during which no key is
    activated, neighbor authentication cannot occur, and therefore routing updates will fail.
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'Review the switch configuration using the configuration examples below for BGP and

    OSPF.

    EIGRP, RIP, and IS-IS only support MD5 and will incur a permanent finding for those

    protocols.

    Note: The 180-day key lifetime is Not Applicable for the DODIN Backbone. The

    remainder of the requirement still applies.

    Verify that neighbor router authentication is enabled for all routing protocols. If neighbor

    authentication is not enabled this is a finding.

    Verify that authentication is configured to use FIPS 198-1 message authentication

    algorithms. If the routing protocol authentication is not configured to use FIPS 198-1

    algorithms this is a finding.

    Verify that the protocol key lifetime is configured to not exceed 180 days. If any protocol

    key lifetime is configured to exceed 180 days this is a finding.

    BGP Example:

    key chain <KEY-CHAIN-NAME> tcp

    key <KEY-ID>

    send-id <ID>

    recv-id <ID>

    cryptographic-algorithm hmac-sha256

    key-string <KEY>

    accept-lifetime 00:00:00 Jan 1 2022 duration 180

    send-lifetime 00:00:00 Jan 1 2022 duration 180

    !

    !

    router bgp <ASN>

    no synchronization

    bgp log-neighbor-changes

    neighbor x.x.x.x remote-as <ASN>

    neighbor x.x.x.x ao <KEY-CHAIN-NAME>

    Note: TCP-AO is used to replace MD5 in BGP authentication.

    OSPF Example:

    key chain OSPF_KEY_CHAIN

    key 1

    key-string xxxxxxx

    send-lifetime 00:00:00 Jan 1 2018 23:59:59 Mar 31 2018

    accept-lifetime 00:00:00 Jan 1 2018 01:05:00 Apr 1 2018

    cryptographic-algorithm hmac-sha-256

    key 2

    key-string yyyyyyy

    send-lifetime 00:00:00 Apr 1 2018 23:59:59 Jun 30 2018

    accept-lifetime 23:55:00 Mar 31 2018 01:05:00 Jul 1 2018

    cryptographic-algorithm hmac-sha-256

    …

    …

    …

    interface GigabitEthernet0/1

    ip address x.x.x.x 255.255.255.0

    ip ospf authentication key-chain OSPF_KEY_CHAIN'
  remediation: 'Configure routing protocol authentication to use a NIST-validated FIPS 198-1 message

    authentication code algorithm with keys not exceeding 180 days of lifetime as shown in

    the examples.

    BGP Example:

    Step 1: Configure a keychain using a FIPS 198-1 algorithm with a key duration not

    exceeding 180 days.

    key chain <KEY-CHAIN-NAME> tcp

    key <KEY-ID>

    send-id <ID>

    recv-id <ID>

    cryptographic-algorithm hmac-sha256

    key-string <KEY>

    accept-lifetime 00:00:00 Jan 1 2022 duration 180

    send-lifetime 00:00:00 Jan 1 2022 duration 180

    !

    Step 2: Configure BGP autonomous system to use the keychain for authentication.

    router bgp <ASN>

    no synchronization

    bgp log-neighbor-changes

    neighbor x.x.x.x remote-as <ASN>

    neighbor x.x.x.x ao <KEY-CHAIN-NAME>

    OSPF Example:

    Step 1: Configure a keychain using a FIPS 198-1 algorithm with a key duration not

    exceeding 180 days.

    key chain OSPF_KEY_CHAIN

    key 1

    key-string xxxxxxx

    send-lifetime 00:00:00 Jan 1 2018 23:59:59 Mar 31 2018

    accept-lifetime 00:00:00 Jan 1 2018 01:05:00 Apr 1 2018

    cryptographic-algorithm hmac-sha-256

    key 2

    key-string yyyyyyy

    send-lifetime 00:00:00 Apr 1 2018 23:59:59 Jun 30 2018

    accept-lifetime 23:55:00 Mar 31 2018 01:05:00 Jul 1 2018

    cryptographic-algorithm hmac-sha-256

    Step 2: Configure OSPF to use the keychain for authentication.

    interface GigabitEthernet0/1

    ip address x.x.x.x 255.255.255.0

    ip ospf authentication key-chain OSPF_KEY_CHAIN'
  checks:
  - type: manual_review
    info: 'Review the switch configuration using the configuration examples below for BGP and

      OSPF.

      EIGRP, RIP, and IS-IS only support MD5 and will incur a permanent finding for those

      protocols.

      Note: The 180-day key lifetime is Not Applicable for the DODIN Backbone. The

      remainder of the requirement still applies.

      Verify that neighbor router authentication is enabled for all routing protocols. If neighbor

      authentication is not enabled this is a finding.

      Verify that authentication is configured to use FIPS '
    severity: medium
- id: '1.3'
  title: CISC-RT-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco switch must be configured to have all inactive Layer 3 interfaces disabled. GROUP ID: V-220424 RULE
    ID: SV-220424r622190'
  rationale: An inactive interface is rarely monitored or controlled and may expose a network to an undetected attack on that
    interface. Unauthorized personnel with access to the communication facility could gain access to a switch by connecting
    to a configured interface that is not in use. If an interface is no longer used, the configuration must be deleted and
    the interface disabled. For sub-interfaces, delete sub-interfaces that are on inactive interfaces and delete sub-interfaces
    that are inactive. If the sub-interface is no longer necessary for authorized communications, it must be deleted.
  impact: ''
  references: []
  page_start: 18
  audit_raw: "Review the switch configuration and verify that inactive interfaces have been disabled\nas shown below:\ninterface\
    \ GigabitEthernet3\n no switchport\n shutdown\n!\ninterface GigabitEthernet4\n no switchport\n shutdown\nIf an interface\
    \ is not being used but is configured or enabled, this is a finding."
  remediation: 'Disable all inactive interfaces as shown below:

    SW1(config)#interface GigabitEthernet3

    SW1(config-if)#shutdown

    SW1(config)#interface GigabitEthernet4

    SW1(config-if)#shutdown'
  checks:
  - type: manual_review
    info: "Review the switch configuration and verify that inactive interfaces have been disabled\nas shown below:\ninterface\
      \ GigabitEthernet3\n no switchport\n shutdown\n!\ninterface GigabitEthernet4\n no switchport\n shutdown\nIf an interface\
      \ is not being used but is configured or enabled, this is a finding."
    severity: medium
- id: '1.4'
  title: CISC-RT-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must not be configured to have any zero-touch deployment feature enabled when connected to
    an operational network. GROUP ID: V-220427 RULE ID: SV-220427r856231'
  rationale: Network devices that are configured via a zero-touch deployment or auto-loading feature can have their startup
    configuration or image pushed to the device for installation via TFTP or Remote Copy (rcp). Loading an image or configuration
    file from the network is taking a security risk because the file could be intercepted by an attacker who could corrupt
    the file, resulting in a denial of service.
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'Review the device configuration to determine if auto-configuration or zero-touch

    deployment via Cisco Networking Services (CNS) is enabled.

    Auto-configuration example:

    version 15.0

    service config

    …

    …

    …

    boot-start-marker

    boot network tftp://x.x.x.x/R5-config

    boot-end-marker

    CNS Zero-Touch example:

    cns trusted-server config x.x.x.x

    cns trusted-server image x.x.x.x

    cns config initial x.x.x.x 80

    cns exec 80

    cns image

    If a configuration auto-loading feature or zero-touch deployment feature is enabled, this

    is a finding.

    Note: Auto-configuration or zero-touch deployment features can be enabled when the

    switch is offline for the purpose of image loading or building out the configuration. In

    addition, this would not be applicable to the provisioning of virtual switches via a

    software-defined network (SDN) orchestration system.'
  remediation: 'Disable configuration auto-loading if enabled using the following commands:

    SW1(config)#no boot network

    SW1(config)#no service config

    Disable CNS zero-touch deployment if enabled as shown in the example below:

    SW2(config)#no cns config initial

    SW2(config)#no cns exec

    SW2(config)#no cns image

    SW2(config)#no cns trusted-server config x.x.x.x

    SW2(config)#no cns trusted-server image x.x.x.x'
  checks:
  - type: manual_review
    info: 'Review the device configuration to determine if auto-configuration or zero-touch

      deployment via Cisco Networking Services (CNS) is enabled.

      Auto-configuration example:

      version 15.0

      service config

      …

      …

      …

      boot-start-marker

      boot network tftp://x.x.x.x/R5-config

      boot-end-marker

      CNS Zero-Touch example:

      cns trusted-server config x.x.x.x

      cns trusted-server image x.x.x.x

      cns config initial x.x.x.x 80

      cns exec 80

      cns image

      If a configuration auto-loading feature or zero-touch deployment feature is enabled'
    severity: medium
- id: '1.5'
  title: CISC-RT-000120
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco switch must be configured to protect against or limit the effects of denial-ofservice (DoS) attacks
    by employing control plane protection. GROUP ID: V-220428 RULE ID: SV-220428r991872'
  rationale: The Route Processor (RP) is critical to all network operations because it is the component used to build all
    forwarding paths for the data plane via control plane processes. It is also instrumental with ongoing network management
    functions that keep the routers and links available for providing network services. Any disruption to the RP or the control
    and management planes can result in mission-critical network outages. A DoS attack targeting the RP can result in excessive
    CPU and memory utilization. To maintain network stability and RP security, the router must be able to handle specific
    control plane and management plane traffic that is destined to the RP. In the past, one method of filtering was to use
    ingress filters on forwarding interfaces to filter both forwarding path and receiving path traffic, as well as limiting
    traffic destined to the device. However, this method does not scale well as the number of interfaces grows and the size
    of the ingress filters grows. Control plane policing increases the security of routers and multilayer switches by protecting
    the RP from unnecessary or malicious traffic. Filtering and rate limiting the traffic flow of control plane packets can
    be implemented to protect routers against reconnaissance and DoS attacks, allowing the control plane to maintain packet
    forwarding and protocol states despite an attack or heavy load on the router or multilayer switch.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'Review the Cisco switch configuration to verify that is protects against known types of

    DoS attacks by employing organization-defined security safeguards.

    Step 1: Verify traffic types have been classified based on importance levels. The

    following is an example configuration:

    class-map match-all CoPP_CRITICAL

    match access-group name CoPP_CRITICAL

    class-map match-any CoPP_IMPORTANT

    match access-group name CoPP_IMPORTANT

    match protocol arp

    class-map match-all CoPP_NORMAL

    match access-group name CoPP_NORMAL

    class-map match-any CoPP_UNDESIRABLE

    match access-group name CoPP_UNDESIRABLE

    class-map match-all CoPP_DEFAULT

    match access-group name CoPP_DEFAULT

    Step 2: Review the access control lists (ACLs) referenced by the class maps to

    determine if the traffic is being classified appropriately. The following is an example

    configuration:

    ip access-list extended CoPP_CRITICAL

    remark our control plane adjacencies are critical

    permit ospf host [OSPF neighbor A] any

    permit ospf host [OSPF neighbor B] any

    permit pim host [PIM neighbor A] any

    permit pim host [PIM neighbor B] any

    permit pim host [RP addr] any

    permit igmp any 224.0.0.0 15.255.255.255

    deny ip any any

    ip access-list extended CoPP_IMPORTANT

    permit tcp host [TACACS server] eq tacacs any

    permit tcp [management subnet] 0.0.0.255 any eq 22

    permit udp host [SNMP manager] any eq snmp

    permit udp host [NTP server] eq ntp any

    deny ip any any

    ip access-list extended CoPP_NORMAL

    remark we will want to rate limit ICMP traffic

    deny icmp any host x.x.x.x fragments

    permit icmp any any echo

    permit icmp any any echo-reply

    permit icmp any any time-exceeded

    permit icmp any any unreachable

    deny ip any any

    ip access-list extended CoPP_UNDESIRABLE

    remark other management plane traffic that should not be received

    permit udp any any eq ntp

    permit udp any any eq snmp

    permit tcp any any eq 22

    permit tcp any any eq 23

    remark other control plane traffic not configured on switch

    permit eigrp any any

    permit udp any any eq rip

    deny ip any any

    ip access-list extended CoPP_DEFAULT

    permit ip any any

    Note: Explicitly defining undesirable traffic with ACL entries enables the network

    operator to collect statistics. Excessive ARP packets can potentially monopolize Route

    Processor resources, starving other important processes. Currently, ARP is the only

    Layer 2 protocol that can be specifically classified using the match protocol command.

    Step 3: Review the policy-map to determine if the traffic is being policed appropriately

    for each classification. The following is an example configuration:

    policy-map CONTROL_PLANE_POLICY

    class CoPP_CRITICAL

    police 512000 8000 conform-action transmit exceed-action transmit

    class CoPP_IMPORTANT

    police 256000 4000 conform-action transmit exceed-action drop

    class CoPP_NORMAL

    police 128000 2000 conform-action transmit exceed-action drop

    class CoPP_UNDESIRABLE

    police 8000 1000 conform-action drop exceed-action drop

    class CoPP_DEFAULT

    police 64000 1000 conform-action transmit exceed-action drop

    Step 4: Verify that the Control Plane Policing (CoPP) policy is enabled. The following is

    an example configuration:

    control-plane

    service-policy input CONTROL_PLANE_POLICY

    Note: Control Plane Protection (CPPr) can be used to filter as well as police control

    plane traffic destined to the RP. CPPr is very similar to CoPP and has the ability to filter

    and police traffic using finer granularity by dividing the aggregate control plane into

    three separate categories: 1) host, 2) transit, and 3) CEF-exception. Hence, a separate

    policy-map could be configured for each traffic category.

    If the Cisco switch is not configured to protect against known types of DoS attacks by

    employing organization-defined security safeguards, this is a finding.'
  remediation: 'Configure the Cisco switch to protect against known types of DoS attacks on the route

    processor. Implementing a CoPP policy as shown in the example below is a best

    practice method:

    Step 1: Configure ACL specific traffic types.

    SW1(config)#ip access-list extended CoPP_CRITICAL

    SW1(config-ext-nacl)#remark our control plane adjacencies are critical

    SW1(config-ext-nacl)#permit ospf host x.x.x.x any

    SW1(config-ext-nacl)#permit ospf host x.x.x.x any

    SW1(config-ext-nacl)#permit pim host x.x.x.x any

    SW1(config-ext-nacl)#permit pim host x.x.x.x any

    SW1(config-ext-nacl)#permit igmp any 224.0.0.0 15.255.255.255

    SW1(config-ext-nacl)#deny ip any any

    SW1(config-ext-nacl)#exit

    SW1(config)#ip access-list extended CoPP_IMPORTANT

    SW1(config-ext-nacl)#permit tcp host x.x.x.x eq tacacs any

    SW1(config-ext-nacl)#permit tcp x.x.x.x 0.0.0.255 any eq 22

    SW1(config-ext-nacl)#permit udp host x.x.x.x any eq snmp

    SW1(config-ext-nacl)#permit udp host x.x.x.x eq ntp any

    SW1(config-ext-nacl)#deny ip any any

    SW1(config-ext-nacl)#exit

    SW1(config)#ip access-list extended CoPP_NORMAL

    SW1(config-ext-nacl)#remark we will want to rate limit ICMP traffic

    SW1(config-ext-nacl)#deny icmp any host x.x.x.x fragments

    SW1(config-ext-nacl)#permit icmp any any echo

    SW1(config-ext-nacl)#permit icmp any any echo-reply

    SW1(config-ext-nacl)#permit icmp any any time-exceeded

    SW1(config-ext-nacl)#permit icmp any any unreachable

    SW1(config-ext-nacl)#deny ip any any

    SW1(config-ext-nacl)#exit

    SW1(config)#ip access-list extended CoPP_UNDESIRABLE

    SW1(config-ext-nacl)#remark management plane traffic that should not be

    received

    SW1(config-ext-nacl)#permit udp any any eq ntp

    SW1(config-ext-nacl)#permit udp any any eq snmp

    SW1(config-ext-nacl)#permit tcp any any eq 22

    SW1(config-ext-nacl)#permit tcp any any eq 23

    SW1(config-ext-nacl)#remark control plane traffic not configured on switch

    SW1(config-ext-nacl)#permit eigrp any any

    SW1(config-ext-nacl)#permit udp any any eq rip

    SW1(config-ext-nacl)#deny ip any any

    SW1(config-ext-nacl)#exit

    SW1(config)#ip access-list extended CoPP_DEFAULT

    SW1(config-ext-nacl)#permit ip any any

    SW1(config-ext-nacl)#exit

    Step 2: Configure class-maps referencing each of the ACLs.

    SW1(config)#class-map match-all CoPP_CRITICAL

    SW1(config-cmap)#match access-group name CoPP_CRITICAL

    SW1(config-cmap)#class-map match-any CoPP_IMPORTANT

    SW1(config-cmap)#match access-group name CoPP_IMPORTANT

    SW1(config-cmap)#match protocol arp

    SW1(config-cmap)#class-map match-all CoPP_NORMAL

    SW1(config-cmap)#match access-group name CoPP_NORMAL

    SW1(config-cmap)#class-map match-any CoPP_UNDESIRABLE

    SW1(config-cmap)#match access-group name CoPP_UNDESIRABLE

    SW1(config-cmap)#class-map match-all CoPP_DEFAULT

    SW1(config-cmap)#match access-group name CoPP_DEFAULT

    SW1(config-cmap)#exit

    Step 3: Configure a policy-map referencing the configured class-maps and apply

    appropriate bandwidth allowance and policing attributes.

    SW1(config)#policy-map CONTROL_PLANE_POLICY

    SW1(config-pmap)#class CoPP_CRITICAL

    SW1(config-pmap-c)#police 512000 8000 conform-action transmit exceed-action

    transmit

    SW1(config-pmap-c-police)#class CoPP_IMPORTANT

    SW1(config-pmap-c)#police 256000 4000 conform-action transmit exceed-action

    drop

    SW1(config-pmap-c-police)#class CoPP_NORMAL

    SW1(config-pmap-c)#police 128000 2000 conform-action transmit exceed-action

    drop

    SW1(config-pmap-c-police)#class CoPP_UNDESIRABLE

    SW1(config-pmap-c)#police 8000 1000 conform-action drop exceed-action drop

    SW1(config-pmap-c-police)#class CoPP_DEFAULT

    SW1(config-pmap-c)#police 64000 1000 conform-action transmit exceed-action

    drop

    SW1(config-pmap-c-police)#exit

    SW1(config-pmap-c)#exit

    SW1(config-pmap)#exit

    Step 4: Apply the policy-map to the control plane.

    SW1(config)#control-plane

    SW1(config-cp)#service-policy input CONTROL_PLANE_POLICY

    SW1(config-cp)#end'
  checks:
  - type: manual_review
    info: 'Review the Cisco switch configuration to verify that is protects against known types of

      DoS attacks by employing organization-defined security safeguards.

      Step 1: Verify traffic types have been classified based on importance levels. The

      following is an example configuration:

      class-map match-all CoPP_CRITICAL

      match access-group name CoPP_CRITICAL

      class-map match-any CoPP_IMPORTANT

      match access-group name CoPP_IMPORTANT

      match protocol arp

      class-map match-all CoPP_NORMAL

