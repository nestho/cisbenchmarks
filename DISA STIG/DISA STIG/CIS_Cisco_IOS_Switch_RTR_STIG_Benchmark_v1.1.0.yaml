- id: '1.28'
  title: CISC-RT-000370
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco perimeter switch must be configured to have Cisco Discovery Protocol (CDP) disabled on all external
    interfaces. GROUP ID: V-220450 RULE ID: SV-220450r856241'
  rationale: CDP is a Cisco proprietary neighbor discovery protocol used to advertise device capabilities, configuration information,
    and device identity. CDP is media-and-protocolindependent as it runs over Layer 2; therefore, two network nodes that support
    different Layer 3 protocols can still learn about each other. Allowing CDP messages to reach external network nodes provides
    an attacker a method to obtain information of the network infrastructure that can be useful to plan an attack.
  impact: ''
  references: []
  page_start: 66
  audit_raw: "Step 1: Verify if CDP is enabled globally as shown below:\ncdp run\nBy default, CDP is not enabled globally\
    \ or on any interface. If CDP is enabled globally,\nproceed to Step 2.\nStep 2: Verify CDP is not enabled on any external\
    \ interface as shown in the example\nbelow:\ninterface GigabitEthernet2\n ip address z.1.24.4 255.255.255.252\n…\n …\n\
    \ …\ncdp enable\nIf CDP is enabled on any external interface, this is a finding."
  remediation: 'Disable CDP on all external interfaces via no cdp enable command or disable CDP

    globally via no cdp run command.'
  checks:
  - type: manual_review
    info: "Step 1: Verify if CDP is enabled globally as shown below:\ncdp run\nBy default, CDP is not enabled globally or\
      \ on any interface. If CDP is enabled globally,\nproceed to Step 2.\nStep 2: Verify CDP is not enabled on any external\
      \ interface as shown in the example\nbelow:\ninterface GigabitEthernet2\n ip address z.1.24.4 255.255.255.252\n…\n …\n\
      \ …\ncdp enable\nIf CDP is enabled on any external interface, this is a finding."
    severity: medium
- id: '1.29'
  title: CISC-RT-000380
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco perimeter switch must be configured to have Proxy ARP disabled on all external interfaces. GROUP
    ID: V-220451 RULE ID: SV-220451r856242'
  rationale: When Proxy ARP is enabled on a switch, it allows that switch to extend the network (at Layer 2) across multiple
    interfaces (LAN segments). Because proxy ARP allows hosts from different LAN segments to look like they are on the same
    segment, proxy ARP is only safe when used between trusted LAN segments. Attackers can leverage the trusting nature of
    proxy ARP by spoofing a trusted host and then intercepting packets. Proxy ARP should always be disabled on switch interfaces
    that do not require it unless the switch is being used as a LAN bridge.
  impact: ''
  references: []
  page_start: 68
  audit_raw: "Review the switch configuration to determine if IP Proxy ARP is disabled on all external\ninterfaces as shown\
    \ in the example below:\ninterface GigabitEthernet0/1\n description link to DISN\n ip address x.1.12.2 255.255.255.252\n\
    \ no ip proxy-arp\nNote: By default, Proxy ARP is enabled on all interfaces; hence, if enabled, it will not be\nshown\
    \ in the configuration.\nIf IP Proxy ARP is enabled on any external interface, this is a finding."
  remediation: 'Disable Proxy ARP on all external interfaces as shown in the example below:

    SW1(config)#int g0/1

    SW1(config-if)#no ip proxy-arp'
  checks:
  - type: manual_review
    info: "Review the switch configuration to determine if IP Proxy ARP is disabled on all external\ninterfaces as shown in\
      \ the example below:\ninterface GigabitEthernet0/1\n description link to DISN\n ip address x.1.12.2 255.255.255.252\n\
      \ no ip proxy-arp\nNote: By default, Proxy ARP is enabled on all interfaces; hence, if enabled, it will not be\nshown\
      \ in the configuration.\nIf IP Proxy ARP is enabled on any external interface, this is a finding."
    severity: medium
- id: '1.30'
  title: CISC-RT-000390
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco perimeter switch must be configured to block all outbound management traffic. GROUP ID: V-220452
    RULE ID: SV-220452r945857'
  rationale: For in-band management, the management network must have its own subnet in order to enforce control and access
    boundaries provided by Layer 3 network nodes, such as switches and firewalls. Management traffic between the managed network
    elements and the management network is routed via the same links and nodes as that used for production or operational
    traffic. Safeguards must be implemented to ensure that the management traffic does not leak past the perimeter of the
    managed network.
  impact: ''
  references: []
  page_start: 70
  audit_raw: "Verify that the perimeter switch of the managed network is configured with an outbound\nACL on the egress interface\
    \ to block all management traffic as shown in the example\nbelow:\nStep 1: Verify that all external interfaces has been\
    \ configured with an outbound ACL as\nshown in the example below:\ninterface GigabitEthernet0/2\n description link to\
    \ DISN\n ip address x.11.1.2 255.255.255.254\n ip access-group EXTERNAL_ACL_OUTBOUND out\nStep 2: Verify that the outbound\
    \ ACL discards management traffic as shown in the\nexample below:\nip access-list extended EXTERNAL_ACL_OUTBOUND\n deny\
    \ tcp any any eq tacacs log-input\n deny tcp any any eq 22 log-input\n deny udp any any eq snmp log-input\n deny udp any\
    \ any eq snmptrap log-input\n deny udp any any eq syslog log-input\n permit tcp any any eq www log-input\n deny ip any\
    \ any log-input\nIf management traffic is not blocked at the perimeter, this is a finding."
  remediation: 'Configure the perimeter switch of the managed network with an outbound ACL on the

    egress interface to block all management traffic.

    Step 1: Configure an ACL to block egress management traffic.

    SW1(config)#ip access-list extended EXTERNAL_ACL_OUTBOUND

    SW1(config-ext-nacl)#deny tcp any any eq tacacs log-input

    SW1(config-ext-nacl)#deny tcp any any eq 22 log-input

    SW1(config-ext-nacl)#deny udp any any eq snmp log-input

    SW1(config-ext-nacl)#deny udp any any eq snmptrap log-input

    SW1(config-ext-nacl)#deny udp any any eq syslog log-input

    SW1(config-ext-nacl)#permit tcp any any eq www

    SW1(config-ext-nacl)#deny ip any any log-input

    SW1(config-ext-nacl)#exit

    Note: Permit commands would be configured to allow applicable outbound traffic. The

    example above is allowing web traffic.

    Step 2: Configure the external interfaces with the outbound ACL.

    SW1(config)#int g0/2

    SW1(config-if)#ip access-group EXTERNAL_ACL_OUTBOUND out'
  checks:
  - type: manual_review
    info: "Verify that the perimeter switch of the managed network is configured with an outbound\nACL on the egress interface\
      \ to block all management traffic as shown in the example\nbelow:\nStep 1: Verify that all external interfaces has been\
      \ configured with an outbound ACL as\nshown in the example below:\ninterface GigabitEthernet0/2\n description link to\
      \ DISN\n ip address x.11.1.2 255.255.255.254\n ip access-group EXTERNAL_ACL_OUTBOUND out\nStep 2: Verify that the outbound\
      \ ACL discards management traffic as sho"
    severity: medium
