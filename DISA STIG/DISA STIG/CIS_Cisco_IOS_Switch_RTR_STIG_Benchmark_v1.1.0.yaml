- id: '1.50'
  title: CISC-RT-000860
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco multicast Designated switch (DR) must be configured to filter the Internet Group Management Protocol
    (IGMP) and Multicast Listener Discovery (MLD) Report messages to allow hosts to join only multicast groups that have been
    approved by the organization. GROUP ID: V-220464 RULE ID: SV-220464r864160'
  rationale: Real-time multicast traffic can entail multiple large flows of data. Large unicast flows tend to be fairly isolated
    (i.e., someone doing a file download here or there), whereas multicast can have broader impact on bandwidth consumption,
    resulting in extreme network congestion. Hence, it is imperative that there is multicast admission control to restrict
    which multicast group's hosts are allowed to join via IGMP or MLD.
  impact: ''
  references: []
  page_start: 118
  audit_raw: "Review the configuration of the DR to verify that it is filtering IGMP or MLD Membership\nReport messages, allowing\
    \ hosts to join only groups that have been approved.\nStep 1: Verify that all host-facing Layer 3 and VLAN interfaces\
    \ are configured to filter\nIGMP Membership Report messages (IGMP joins) as shown in the example below:\ninterface Vlan3\n\
    \ ip address 10.3.3.3 255.255.255.0\n ip pim sparse-mode\n ip igmp access-group IGMP_JOIN_FILTER\n ip igmp version 3\n\
    Step 2: Verify that the ACL denies unauthorized groups or permits only authorized\ngroups. The example below denies all\
