- id: '1.52'
  title: CISC-RT-000880
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco multicast Designated switch (DR) must be configured to limit the number of mroute states resulting
    from Internet Group Management Protocol (IGMP) and Multicast Listener Discovery (MLD) Host Membership Reports. GROUP ID:
    V-220466 RULE ID: SV-220466r856246'
  rationale: The current multicast paradigm can let any host join any multicast group at any time by sending an IGMP or MLD
    membership report to the DR. In a Protocol Independent Multicast (PIM) Sparse Mode network, the DR will send a PIM Join
    message for the group to the RP. Without any form of admission control, this can pose a security risk to the entire multicast
    domain, specifically the multicast switches along the shared tree from the DR to the RP that must maintain the mroute
    state information for each group join request. Hence, it is imperative that the DR is configured to limit the number of
    mroute state information that must be maintained to mitigate the risk of IGMP or MLD flooding.
  impact: ''
  references: []
  page_start: 122
  audit_raw: "Review the DR configuration to verify that it is limiting the number of mroute states via\nIGMP or MLD.\nVerify\
    \ IGMP limits have been configured globally or on each host-facing Layer 3 and\nVLAN interface via the ip igmp limit command\
    \ as shown in the example below:\ninterface Vlan3\n ip address 10.3.3.3 255.255.255.0\n…\n …\n …\nip igmp limit nn\nIf\
    \ the DR is not limiting multicast join requests via IGMP or MLD on a global or\ninterfaces basis, this is a finding."
  remediation: 'Configure the DR on a global or interface basis to limit the number of mroute states

    resulting from IGMP or MLD membership reports.

    SW2(config)#int vlan3

    SW2(config-if)#ip igmp limit 2'
  checks:
  - type: manual_review
    info: "Review the DR configuration to verify that it is limiting the number of mroute states via\nIGMP or MLD.\nVerify\
      \ IGMP limits have been configured globally or on each host-facing Layer 3 and\nVLAN interface via the ip igmp limit\
      \ command as shown in the example below:\ninterface Vlan3\n ip address 10.3.3.3 255.255.255.0\n…\n …\n …\nip igmp limit\
      \ nn\nIf the DR is not limiting multicast join requests via IGMP or MLD on a global or\ninterfaces basis, this is a\
