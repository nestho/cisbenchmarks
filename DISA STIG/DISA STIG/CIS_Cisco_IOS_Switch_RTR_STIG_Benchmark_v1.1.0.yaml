    severity: medium
- id: '1.17'
  title: CISC-RT-000237
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must not be configured to use IPv6 Site Local Unicast addresses. GROUP ID: V-237755 RULE
    ID: SV-237755r648786'
  rationale: As currently defined, site local addresses are ambiguous and can be present in multiple sites. The address itself
    does not contain any indication of the site to which it belongs. The use of site-local addresses has the potential to
    adversely affect network security through leaks, ambiguity, and potential misrouting as documented in section 2 of RFC3879.
    RFC3879 formally deprecates the IPv6 site-local unicast prefix FEC0::/10 as defined in RFC3513.
  impact: ''
  references: []
  page_start: 46
  audit_raw: 'Review the switch configuration to ensure FEC0::/10 IPv6 addresses are not defined.

    If IPv6 Site Local Unicast addresses are defined, this is a finding.'
