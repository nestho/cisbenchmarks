- id: '1.7'
  title: CISC-RT-000160
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco switch must be configured to have IP directed broadcast disabled on all interfaces. GROUP ID: V-220432
    RULE ID: SV-220432r856234'
  rationale: An IP directed broadcast is a datagram sent to the broadcast address of a subnet that is not directly attached
    to the sending machine. The directed broadcast is routed through the network as a unicast packet until it arrives at the
    target subnet, where it is converted into a link-layer broadcast. Because of the nature of the IP addressing architecture,
    only the last switch in the chain, which is connected directly to the target subnet, can conclusively identify a directed
    broadcast. IP directed broadcasts are used in the extremely common and popular smurf, or denialof-service (DoS), attacks.
    In a smurf attack, the attacker sends Internet Control Message Protocol (ICMP) echo requests from a falsified source address
    to a directed broadcast address, causing all the hosts on the target subnet to send replies to the falsified source. By
    sending a continuous stream of such requests, the attacker can create a much larger stream of replies, which can completely
    inundate the host whose address is being falsified. This service should be disabled on all interfaces when not needed
    to prevent smurf and DoS attacks. Directed broadcast can be enabled on internal-facing interfaces to support services
    such as Wake-On-LAN. Case scenario may also include support for legacy applications where the content server and the clients
    do not support multicast. The content servers send streaming data using UDP broadcast. Used in conjunction with the IP
    multicast helper-map feature, broadcast data can be sent across a multicast topology. The broadcast streams are converted
    to multicast and vice versa at the first-hop switches and last-hop switches before entering and leaving the multicast
    transit area respectively. The last-hop switch must convert the multicast to broadcast. Hence, this interface must be
    configured to forward a broadcast packet (i.e., a directed broadcast address is converted to the all nodes broadcast address).
  impact: ''
  references: []
  page_start: 30
  audit_raw: "Review the switch configuration to determine if IP directed broadcast is disabled. The IP\ndirected broadcast\
    \ command must not be found on any interface as shown in the\nexample below:\ninterface GigabitEthernet0/1\n no switchport\n\
    \ ip address x.x.x.x 255.255.255.0\n ip directed-broadcast\n…\n…\n…\nInterface Vlan11\nno switchport\n ip address x.x.x.x\
    \ 255.255.255.0\n ip directed-broadcast\nIf IP directed broadcast is not disabled on all interfaces, this is a finding."
  remediation: 'Disable IP directed broadcast on all interfaces as shown in the example below:

    SW1(config)#int g0/1

    SW1(config-if)#no ip directed-broadcast

    SW1(config)#int vlan11

    SW1(config-if)#no ip directed-broadcast'
  checks:
  - type: manual_review
    info: "Review the switch configuration to determine if IP directed broadcast is disabled. The IP\ndirected broadcast command\
      \ must not be found on any interface as shown in the\nexample below:\ninterface GigabitEthernet0/1\n no switchport\n\
      \ ip address x.x.x.x 255.255.255.0\n ip directed-broadcast\n…\n…\n…\nInterface Vlan11\nno switchport\n ip address x.x.x.x\
      \ 255.255.255.0\n ip directed-broadcast\nIf IP directed broadcast is not disabled on all interfaces, this is a finding."
    severity: medium
- id: '1.8'
  title: CISC-RT-000170
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to have Internet Control Message Protocol (ICMP) unreachable messages
    disabled on all external interfaces. GROUP ID: V-220433 RULE ID: SV-220433r856235'
  rationale: The ICMP supports IP traffic by relaying information about paths, routes, and network conditions. Switches automatically
    send ICMP messages under a wide variety of conditions. Host unreachable ICMP messages are commonly used by attackers for
    network mapping and diagnosis.
  impact: ''
  references: []
  page_start: 32
  audit_raw: "Review the configuration to verify the no ip unreachables command has been\nconfigured on all external interfaces\
    \ as shown in the configuration example below:\ninterface GigabitEthernet0/1\n ip address x.x.x.x 255.255.255.0\n no ip\
    \ unreachables\nIf ICMP unreachable notifications are sent from any external or null0 interface, this is a\nfinding.\n\
    Alternative - DODIN Backbone:\nVerify that the PE switch is configured to rate limit ICMP unreachable messages as\nshown\
    \ in the example below:\nip icmp rate-limit unreachable 60000 ip icmp rate-limit unreachable DF 1000\nNote: In the example\
    \ above, packet-too-big message (ICMP Type 3 Code 4) can be\nsent once every second, while all other destination unreachable\
    \ messages can be sent\nonce every minute. This will avoid disrupting Path MTU Discovery for traffic traversing\nthe backbone\
    \ while mitigating the risk of an ICMP unreachable DoS attack.\nIf the PE switch is not configured to rate limit ICMP\
    \ unreachable messages, this is a\nfinding."
  remediation: 'Step 1: Disable ip unreachables on all external interfaces.

    SW1(config)#int g0/1

    SW1(config-if)#no ip unreachables

    Step 2: Disable ip unreachables on the Null0 interface if it is used to backhole packets.

    SW1(config-if)#int null 0

    SW1(config-if)#no ip unreachables

    Alternative - DODIN Backbone:

    Configure the PE switch to rate limit ICMP unreachable messages as shown in the

    example below:

    SW1(config)#ip icmp rate-limit unreachable df 100 SW1(config)#ip icmp rate-limit

    unreachable 100000 SW1(config)#end

    Alternative - Non-DODIN Backbone:

    An alternative for non-backbone networks (e.g., enclave, base, camp, etc.) is to filter

    messages generated by the switch and silently drop ICMP Administratively Prohibited

    and Host Unreachable messages using the following configuration steps:

    Step 1: Configure ACL to include ICMP Type 3 Code 1 (Host Unreachable) and Code

    13 (Administratively Prohibited) as shown in the example below:

    SW1(config)#ip access-list ext ICMP_T3C1C13 SW1(config-ext-nacl)#permit icmp any

    any host-unreachable SW1(config-ext-nacl)#permit icmp any any administrativelyprohibited SW1(config-ext-nacl)#exit

    Step 2: Create a route-map to forward these ICMP messages to the Null0 interface.

    SW1(config)#route-map LOCAL_POLICY SW1(config-route-map)#match ip address

    ICMP_T3C1C13 SW1(config-route-map)#set interface Null0 SW1(config-routemap)#exit

    Step 3: Configure no ip unreachables on the Null0 interface.

    SW1(config)#int null 0 SW1(config-if)#no ip unreachables SW1(config-if)#exit

    Step 4: Apply the policy to filter messages generated by the switch.

    SW1(config)#ip local policy route-map LOCAL_POLICY SW1(config)#end'
  checks:
  - type: manual_review
    info: "Review the configuration to verify the no ip unreachables command has been\nconfigured on all external interfaces\
      \ as shown in the configuration example below:\ninterface GigabitEthernet0/1\n ip address x.x.x.x 255.255.255.0\n no\
      \ ip unreachables\nIf ICMP unreachable notifications are sent from any external or null0 interface, this is a\nfinding.\n\
      Alternative - DODIN Backbone:\nVerify that the PE switch is configured to rate limit ICMP unreachable messages as\n\
      shown in the example below:\nip icmp rate-limit"
    severity: medium
