- id: '1.39'
  title: CISC-RT-000450
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to only permit management traffic that ingresses and egresses the out-of-band
    management (OOBM) interface. GROUP ID: V-220453 RULE ID: SV-220453r991873'
  rationale: The OOBM access switch will connect to the management interface of the managed network elements. The management
    interface can be a true OOBM interface or a standard interface functioning as the management interface. In either case,
    the management interface of the managed network element will be directly connected to the OOBM network. An OOBM interface
    does not forward transit traffic, thereby providing complete separation of production and management traffic. Since all
    management traffic is immediately forwarded into the management network, it is not exposed to possible tampering. The
    separation also ensures that congestion or failures in the managed network do not affect the management of the device.
    If the device does not have an OOBM port, the interface functioning as the management interface must be configured so
    that management traffic does not leak into the managed network and production traffic does not leak into the management
    network.
  impact: ''
  references: []
  page_start: 88
  audit_raw: "This requirement is only applicable where management access to the switch is via an\nOOBM interface, which is\
    \ not a true OOBM interface.\nStep 1: Verify that the managed interface has an inbound and outbound access control\nlist\
    \ (ACL) configured.\ninterface GigabitEthernet0/7\n no switchport\n description link to OOBM access switch\n ip address\
    \ 10.11.1.22 255.255.255.0\n ip access-group INGRESS_MANAGEMENT_ACL in\n ip access-group EGRESS_MANAGEMENT_ACL in\nStep\
    \ 2: Verify that the ingress ACL only allows management and ICMP traffic.\nip access-list extended INGRESS_MANAGEMENT_ACL\n\
    \ permit tcp any host 10.11.1.22 eq tacacs\n permit tcp any host 10.11.1.22 eq 22\n permit udp any host 10.11.1.22 eq\
    \ snmp\n permit udp any host 10.11.1.22 eq snmptrap\n permit udp any host 10.11.1.22 eq ntp\n permit icmp any host 10.11.1.22\n\
    \ deny ip any any log-input\nStep 3: Verify that the egress ACL blocks any transit traffic.\nip access-list extended EGRESS_MANAGEMENT_ACL\n\
    \ deny ip any any log-input\nNote: On Cisco switches, local generated packets are not inspected by outgoing\ninterface\
    \ access lists. Hence, the above configuration would drop any packets not\ngenerated by the switch, blocking any transit\
    \ traffic.\nIf the switch does not restrict traffic that ingresses and egresses the management\ninterface, this is a finding."
  remediation: 'If the management interface is not a dedicated OOBM interface, it must be configured

    with both an ingress and egress ACL.

    Step 1: Configure an ingress ACL as shown in the example below:

    SW1(config)#ip access-list extended INGRESS_MANAGEMENT_ACL

    SW1(config-ext-nacl)#permit tcp any host 10.11.1.22 eq tacacs

    SW1(config-ext-nacl)#permit tcp any host 10.11.1.22 eq 22

    SW1(config-ext-nacl)#permit udp any host 10.11.1.22 eq snmp

    SW1(config-ext-nacl)#permit udp any host 10.11.1.22 eq snmptrap

    SW1(config-ext-nacl)#permit udp any host 10.11.1.22 eq ntp

    SW1(config-ext-nacl)#permit icmp any host 10.11.1.22

    SW1(config-ext-nacl)#deny ip any any log-input

    SW1(config-ext-nacl)#exit

    Step 2: Configure an egress ACL as shown in the example below:

    SW1(config)#ip access-list extended EGRESS_MANAGEMENT_ACL

    SW1(config-ext-nacl)#deny ip any any log-input

    SW1(config-ext-nacl)#exit

    Step 3: Apply the ACLs to the OOBM interfaces.

    SW1(config)#int g0/7

    SW1(config-if)#ip access-group INGRESS_MANAGEMENT_ACL in

    SW1(config-if)#ip access-group EGRESS_MANAGEMENT_ACL out'
  checks:
  - type: manual_review
    info: "This requirement is only applicable where management access to the switch is via an\nOOBM interface, which is not\
      \ a true OOBM interface.\nStep 1: Verify that the managed interface has an inbound and outbound access control\nlist\
      \ (ACL) configured.\ninterface GigabitEthernet0/7\n no switchport\n description link to OOBM access switch\n ip address\
      \ 10.11.1.22 255.255.255.0\n ip access-group INGRESS_MANAGEMENT_ACL in\n ip access-group EGRESS_MANAGEMENT_ACL in\n\
      Step 2: Verify that the ingress ACL only allows ma"
    severity: medium
- id: '1.40'
  title: CISC-RT-000660
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco PE switch providing MPLS Layer 2 Virtual Private Network (L2VPN) services must be configured to
    authenticate targeted Label Distribution Protocol (LDP) sessions used to exchange virtual circuit (VC) information using
    a FIPS-approved message authentication code algorithm. GROUP ID: V-220454 RULE ID: SV-220454r864159'
  rationale: LDP provides the signaling required for setting up and tearing down pseudowires (virtual circuits used to transport
    Layer 2 frames) across an MPLS IP core network. Using a targeted LDP session, each PE switch advertises a virtual circuit
    label mapping that is used as part of the label stack imposed on the frames by the ingress PE switch during packet forwarding.
    Authentication provides protection against spoofed TCP segments that can be introduced into the LDP sessions.
  impact: ''
  references: []
  page_start: 91
  audit_raw: 'The Cisco switch is not compliant with this requirement; hence, it is a finding. However,

    the severity level can be downgraded to a CAT III if the switch is configured to

    authenticate targeted LDP sessions using MD5 as shown in the configuration example

    below:

    mpls ldp neighbor 10.1.1.2 password xxxxxxx

    mpls label protocol ldp

    If the switch is not configured to authenticate targeted LDP sessions using MD5, the

    finding will remain as a CAT II.'
  remediation: 'The severity level can be downgraded to a CAT III if the switch is configured to

    authenticate targeted LDP sessions using MD5 as shown in the example below:

    SW1(config)#mpls ldp neighbor 10.1.1.2 password xxxxxxxx'
  checks:
  - type: manual_review
    info: 'The Cisco switch is not compliant with this requirement; hence, it is a finding. However,

      the severity level can be downgraded to a CAT III if the switch is configured to

      authenticate targeted LDP sessions using MD5 as shown in the configuration example

