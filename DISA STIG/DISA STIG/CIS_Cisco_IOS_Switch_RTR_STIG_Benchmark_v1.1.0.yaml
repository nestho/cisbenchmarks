      \ as shown in the example\nbelow:\nip access-list standard PIM_NEIGHBORS\n permit 10.1.2.6\nIf PIM neighbor ACLs are\
      \ not bound to all interfaces that have PIM e"
    severity: medium
- id: '1.49'
  title: CISC-RT-000810
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco multicast edge switch must be configured to establish boundaries for administratively scoped multicast
    traffic. GROUP ID: V-220463 RULE ID: SV-220463r622190'
  rationale: If multicast traffic is forwarded beyond the intended boundary, it is possible that it can be intercepted by
    unauthorized or unintended personnel. Administrative scoped multicast addresses are locally assigned and are to be used
    exclusively by the enterprise network or enclave. Administrative scoped multicast traffic must not cross the enclave perimeter
    in either direction. Restricting multicast traffic makes it more difficult for a malicious user to access sensitive traffic.
    Admin-Local scope is encouraged for any multicast traffic within a network intended for network management, as well as
    for control plane traffic that must reach beyond linklocal destinations.
  impact: ''
  references: []
  page_start: 116
  audit_raw: "Review the switch configuration and verify that admin-scope multicast traffic is blocked\nat the external edge\
    \ as shown in the example below:\ninterface GigabitEthernet1/2\n no switchport\n ip address x.1.12.2 255.255.255.252\n\
    \ ip pim sparse-mode\n ip multicast boundary MULTICAST_SCOPE\n…\n…\n…\nip access-list standard MULTICAST_SCOPE\n deny\
    \ 239.0.0.0 0.255.255.255\n permit any\nIf the switch is not configured to establish boundaries for administratively scoped\n\
    multicast traffic, this is a finding."
  remediation: 'Step 1: Configure the ACL to deny packets with multicast administratively scoped

    destination addresses as shown in the example below:

    SW2(config)#ip access-list standard MULTICAST_SCOPE

    SW2(config-std-nacl)#deny 239.0.0.0 0.255.255.255

    SW2(config-std-nacl)#permit any

    SW2(config-std-nacl)#exit

    Step 2: Apply the multicast boundary at the appropriate interfaces as shown in the

    example below:

    SW2(config)#int g1/2

    SW2(config-if)#ip multicast boundary MULTICAST_SCOPE

    SW2(config-if)#end'
  checks:
  - type: manual_review
    info: "Review the switch configuration and verify that admin-scope multicast traffic is blocked\nat the external edge\
