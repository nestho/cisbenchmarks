- id: '1.27'
  title: CISC-RT-000360
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco perimeter switch must be configured to have Link Layer Discovery Protocol (LLDP) disabled on all
    external interfaces. GROUP ID: V-220449 RULE ID: SV-220449r856240'
  rationale: LLDP is a neighbor discovery protocol used to advertise device capabilities, configuration information, and device
    identity. LLDP is media-and-protocol-independent as it runs over Layer 2; therefore, two network nodes that support different
    Layer 3 protocols can still learn about each other. Allowing LLDP messages to reach external network nodes provides an
    attacker a method to obtain information of the network infrastructure that can be useful to plan an attack.
  impact: ''
  references: []
  page_start: 64
