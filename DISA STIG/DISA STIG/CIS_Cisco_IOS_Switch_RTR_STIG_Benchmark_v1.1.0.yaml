      mpls ldp neighbor 10.1.1.2 password xxxxxxx

      mpls label protocol ldp

      If the switch is not configured to authenticate targeted LDP sessions using MD5, the

      finding will remain as a CAT II.'
    severity: medium
- id: '1.41'
  title: CISC-RT-000730
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco PE switch must be configured to block any traffic that is destined to the IP core infrastructure.
    GROUP ID: V-220455 RULE ID: SV-220455r622190'
  rationale: IP addresses can be guessed. Core network elements must not be accessible from any external host. Protecting
    the core from any attack is vital for the integrity and privacy of customer traffic as well as the availability of transit
    services. A compromise of the IP core can result in an outage or, at a minimum, non-optimized forwarding of customer traffic.
    Protecting the core from an outside attack also prevents attackers from using the core to attack any customer. Hence,
    it is imperative that all switches at the edge deny traffic destined to any address belonging to the IP core infrastructure.
  impact: ''
  references: []
  page_start: 93
  audit_raw: "Step 1: Review the switch configuration to verify that an ingress ACL is applied to all\nexternal or CE-facing\
    \ interfaces.\ninterface GigabitEthernet0/2\n no switchport\n ip address x.1.12.2 255.255.255.252\n ip access-group BLOCK_TO_CORE\
    \ in\nStep 2: Verify that the ingress ACL discards and logs packets destined to the IP core\naddress space.\nip access-list\
    \ extended BLOCK_TO_CORE\n deny ip any 10.1.x.0 0.0.255.255 log-input\n permit ip any any\nIf the PE switch is not configured\
    \ to block any traffic with a destination address assigned\nto the IP core infrastructure, this is a finding.\nNote: Internet\
    \ Control Message Protocol (ICMP) echo requests and traceroutes will be\nallowed to the edge from external adjacent neighbors."
  remediation: 'Configure protection for the IP core to be implemented at the edges by blocking any

    traffic with a destination address assigned to the IP core infrastructure.

    Step 1: Configure an ingress ACL to discard and log packets destined to the IP core

    address space.

    SW2(config)#ip access-list extended BLOCK_TO_CORE SW2(config-ext-nacl)#deny ip

    any 10.1.x.0 0.0.255.255 log-input SW2(config-ext-nacl)#exit

    Step 2: Apply the ACL inbound to all external or CE-facing interfaces.

    SW2(config)#int SW1(config)#int g0/2 SW2(config-if)#ip access-group

    BLOCK_TO_CORE in SW2(config-if)#end'
  checks:
  - type: manual_review
    info: "Step 1: Review the switch configuration to verify that an ingress ACL is applied to all\nexternal or CE-facing\
      \ interfaces.\ninterface GigabitEthernet0/2\n no switchport\n ip address x.1.12.2 255.255.255.252\n ip access-group\
      \ BLOCK_TO_CORE in\nStep 2: Verify that the ingress ACL discards and logs packets destined to the IP core\naddress space.\n\
      ip access-list extended BLOCK_TO_CORE\n deny ip any 10.1.x.0 0.0.255.255 log-input\n permit ip any any\nIf the PE switch\
      \ is not configured to block any traffic with "
    severity: medium
- id: '1.42'
  title: CISC-RT-000740
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco PE switch must be configured with Unicast Reverse Path Forwarding (uRPF) loose mode enabled on all
    CE-facing interfaces. GROUP ID: V-220456 RULE ID: SV-220456r622190'
  rationale: The uRPF feature is a defense against spoofing and denial-of-service (DoS) attacks by verifying if the source
    address of any ingress packet is reachable. To mitigate attacks that rely on forged source addresses, all provider edge
    switches must enable uRPF loose mode to guarantee that all packets received from a CE switch contain source addresses
    that are in the route table.
  impact: ''
  references: []
  page_start: 95
  audit_raw: "Review the switch configuration to determine if uRPF loose mode is enabled on all CEfacing interfaces.\ninterface\
    \ GigabitEthernet0/2\n no switchport\n ip address x.1.12.2 255.255.255.252\n ip access-group BLOCK_TO_CORE in\n ip verify\
    \ unicast source reachable-via any\nIf uRPF loose mode is not enabled on all CE-facing interfaces, this is a finding."
  remediation: 'Configure uRPF loose mode on all CE-facing interfaces as shown in the example

    below:

    SW2(config)#int SW1(config)#int g0/2

    SW2(config-if)#ip verify unicast source reachable-via any

    SW2(config-if)#end'
  checks:
  - type: manual_review
    info: "Review the switch configuration to determine if uRPF loose mode is enabled on all CEfacing interfaces.\ninterface\
      \ GigabitEthernet0/2\n no switchport\n ip address x.1.12.2 255.255.255.252\n ip access-group BLOCK_TO_CORE in\n ip verify\
      \ unicast source reachable-via any\nIf uRPF loose mode is not enabled on all CE-facing interfaces, this is a finding."
    severity: medium
- id: '1.43'
  title: CISC-RT-000750
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco PE switch must be configured to ignore or drop all packets with any IP options. GROUP ID: V-220473
    RULE ID: SV-220473r945860'
  rationale: Packets with IP options are not fast-switched and therefore must be punted to the switch processor. Hackers who
    initiate denial-of-service (DoS) attacks on switches commonly send large streams of packets with IP options. Dropping
    the packets with IP options reduces the load of IP options packets on the switch. The end result is a reduction in the
    effects of the DoS attack on the switch and on downstream switches.
  impact: ''
  references: []
  page_start: 97
  audit_raw: 'Review the switch configuration to determine if it will ignore or drop all packets with IP

    options as shown in the examples below:

    ip options drop

    or

    ip options ignore

    If the switch is not configured to drop or block all packets with IP options, this is a

    finding.'
  remediation: 'Configure the switch to ignore or drop all packets with IP options as shown in the

    examples below:

    SW1(config)#ip options ignore

    or

    SW1(config)#ip options drop'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to determine if it will ignore or drop all packets with IP

      options as shown in the examples below:

      ip options drop

      or

      ip options ignore

      If the switch is not configured to drop or block all packets with IP options, this is a

      finding.'
    severity: medium
- id: '1.44'
  title: CISC-RT-000760
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco PE switch must be configured to enforce a Quality-of-Service (QoS) policy to provide preferred treatment
    for mission-critical applications. GROUP ID: V-220458 RULE ID: SV-220458r917423'
  rationale: Different applications have unique requirements and toleration levels for delay, jitter, bandwidth, packet loss,
    and availability. To manage the multitude of applications and services, a network requires a QoS framework to differentiate
    traffic and provide a method to manage network congestion. The Differentiated Services Model (DiffServ) is based on per-hop
    behavior by categorizing traffic into different classes and enabling each node to enforce a forwarding treatment to each
    packet as dictated by a policy. Packet markings such as IP Precedence and its successor, Differentiated Services Code
    Points (DSCP), were defined along with specific per-hop behaviors for key traffic types to enable a scalable QoS solution.
    DiffServ QoS categorizes network traffic, prioritizes it according to its relative importance, and provides priority treatment
    based on the classification. It is imperative that end-to-end QoS is implemented within the IP core network to provide
    preferred treatment for mission-critical applications.
  impact: ''
  references: []
  page_start: 99
  audit_raw: "Review the switch configuration and verify that a QoS policy has been configured to\nprovide preferred treatment\
    \ for mission-critical applications.\nStep 1: Verify that the class-maps are configured to match on DSCP values as shown\
    \ in\nthe configuration example below:\nclass-map match-all C2_VOICE\n match ip dscp af47\nclass-map match-all VOICE\n\
    \ match ip dscp ef\nclass-map match-all VIDEO\n match ip dscp af41\nclass-map match-all CONTROL_PLANE\n match ip dscp\
    \ cs6\nclass-map match-all PREFERRED_DATA\n match ip dscp af33\nStep 2: Verify that the policy map reserves the bandwidth\
    \ for each traffic type as shown\nin the example below:\npolicy-map QOS_POLICY\nclass C2_VOICE\n priority percent 10\n\
    \ class VOICE\n priority percent 15\n class VIDEO\n bandwidth percent 25\nclass CONTROL_PLANE\n priority percent 10\n\
    \ class PREFERRED_DATA\n bandwidth percent 25\n class class-default\n bandwidth percent 15\nStep 3: Verify that an output\
    \ service policy is bound to all interfaces as shown in the\nconfiguration example below:\ninterface GigabitEthernet1/1\n\
    \ no switchport\n ip address 10.1.15.1 255.255.255.252\n service-policy output QOS_POLICY\n!\ninterface GigabitEthernet1/2\n\
    \ no switchport\n ip address 10.1.15.4 255.255.255.252\n service-policy output QOS_POLICY\nNote: Enclaves must mark or\
    \ re-mark their traffic to be consistent with the DODIN\nbackbone admission criteria to gain the appropriate level of\
    \ service. A general DiffServ\nprinciple is to mark or trust traffic as close to the source as administratively and\n\
    technically possible. However, certain traffic types might need to be re-marked before\nhandoff to the DODIN backbone\
    \ to gain admission to the correct class. If such remarking is required, it is recommended that the re-marking be performed\
    \ at the CE\negress edge.\nNote: The GTP QOS document (GTP-0009) can be downloaded via the following link:\nhttps://intellipedia.intelink.gov/wiki/Portal:GIG_Technical_Guidance/GTG_GTPs/GTP_D\n\
    evelopment_List\nIf the switch is not configured to enforce a QoS policy in accordance with the QoS GIG\nTechnical Profile,\
    \ this is a finding."
  remediation: 'Configure to enforce a QoS policy to provide preferred treatment for mission-critical

    applications.

    Step 1: Configure class-maps to match on DSCP values as shown in the configuration

    example below:

    SW1(config)#class-map match-all PREFERRED_DATA

    SW1(config-cmap)#match ip dscp af33

    SW1(config-cmap)#class-map match-all CONTROL_PLANE

    SW1(config-cmap)#match ip dscp cs6

    SW1(config-cmap)#class-map match-all VIDEO

    SW1(config-cmap)#match ip dscp af41

    SW1(config-cmap)#class-map match-all VOICE

    SW1(config-cmap)#match ip dscp ef

    SW1(config-cmap)#class-map match-all C2_VOICE

    SW1(config-cmap)#match ip dscp 47

    SW1(config-cmap)#exit

    Step 2: Configure a policy map to be applied to the core-layer-facing interface that

    reserves the bandwidth for each traffic type as shown in the example below:

    SW1(config)#policy-map QOS_POLICY

    SW1(config-pmap)#class CONTROL_PLANE

    SW1(config-pmap-c)#priority percent 10

    SW1(config-pmap-c)#class C2_VOICE

    SW1(config-pmap-c)#priority percent 10

    SW1(config-pmap-c)#class VOICE

    SW1(config-pmap-c)#priority percent 15

    SW1(config-pmap-c)#class VIDEO

    SW1(config-pmap-c)#bandwidth percent 25

    SW1(config-pmap-c)#class PREFERRED_DATA

    SW1(config-pmap-c)#bandwidth percent 25

    SW1(config-pmap-c)#class class-default

    SW1(config-pmap-c)#bandwidth percent 15

    SW1(config-pmap-c)#exit

    SW1(config-pmap)#exit

    Step 3: Apply the output service policy to all interfaces as shown in the configuration

    example below:

    SW1(config)#int g1/1

    SW1(config-if)#service-policy output QOS_POLICY

    SW1(config-if)#exit

    SW1(config)#int g1/2

    SW1(config-if)#service-policy output QOS_POLICY

    SW1(config-if)#end'
  checks:
  - type: manual_review
    info: "Review the switch configuration and verify that a QoS policy has been configured to\nprovide preferred treatment\
      \ for mission-critical applications.\nStep 1: Verify that the class-maps are configured to match on DSCP values as shown\
      \ in\nthe configuration example below:\nclass-map match-all C2_VOICE\n match ip dscp af47\nclass-map match-all VOICE\n\
      \ match ip dscp ef\nclass-map match-all VIDEO\n match ip dscp af41\nclass-map match-all CONTROL_PLANE\n match ip dscp\
      \ cs6\nclass-map match-all PREFERRED_DATA\n match "
    severity: medium
- id: '1.45'
  title: CISC-RT-000770
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco P switch must be configured to enforce a Quality-of-Service (QoS) policy to provide preferred treatment
    for mission-critical applications. GROUP ID: V-220459 RULE ID: SV-220459r917426'
  rationale: Different applications have unique requirements and toleration levels for delay, jitter, bandwidth, packet loss,
    and availability. To manage the multitude of applications and services, a network requires a QoS framework to differentiate
    traffic and provide a method to manage network congestion. The Differentiated Services Model (DiffServ) is based on per-hop
    behavior by categorizing traffic into different classes and enabling each node to enforce a forwarding treatment to each
    packet as dictated by a policy. Packet markings such as IP Precedence and its successor, Differentiated Services Code
    Points (DSCP), were defined along with specific per-hop behaviors for key traffic types to enable a scalable QoS solution.
    DiffServ QoS categorizes network traffic, prioritizes it according to its relative importance, and provides priority treatment
    based on the classification. It is imperative that end-to-end QoS is implemented within the IP core network to provide
    preferred treatment for mission-critical applications.
  impact: ''
  references: []
  page_start: 104
  audit_raw: "Review the switch configuration and verify that a QoS policy has been configured to\nprovide preferred treatment\
    \ for mission-critical applications.\nStep 1: Verify that the class-maps are configured to match on DSCP values as shown\
    \ in\nthe configuration example below:\nclass-map match-all PREFERRED_DATA\n match ip dscp af33\nclass-map match-all CONTROL_PLANE\n\
    \ match ip dscp cs6\nclass-map match-all VIDEO\n match ip dscp af41\nclass-map match-all VOICE\n match ip dscp ef\nclass-map\
    \ match-all C2_VOICE\n match ip dscp 47\nStep 2: Verify that the policy map reserves the bandwidth for each traffic type\
    \ as shown\nin the example below:\npolicy-map QOS_POLICY\n class CONTROL_PLANE\n priority percent 10\n class C2_VOICE\n\
    \ priority percent 10\n class VOICE\n priority percent 15\n class VIDEO\n bandwidth percent 25\n class PREFERRED_DATA\n\
    \ bandwidth percent 25\n class class-default\n bandwidth percent 15\nStep 3: Verify that an output service policy is bound\
    \ to all interfaces as shown in the\nconfiguration example below:\ninterface GigabitEthernet1/1\n no switchport\n ip address\
    \ 10.1.15.5 255.255.255.252\n service-policy output QOS_POLICY\n!\ninterface GigabitEthernet1/2\n no switchport\n ip address\
    \ 10.1.15.8 255.255.255.252\n service-policy output QOS_POLICY\nNote: The GTP QOS document (GTP-0009) can be downloaded\
    \ via the following link:\nhttps://intellipedia.intelink.gov/wiki/Portal:GIG_Technical_Guidance/GTG_GTPs/GTP_D\nevelopment_List\n\
    If the switch is not configured to enforce a QoS policy in accordance with the QoS GIG\nTechnical Profile, this is a finding."
  remediation: 'Configure to enforce a QoS policy to provide preferred treatment for mission-critical

    applications.

    Step 1: Configure class-maps to match on DSCP values as shown in the configuration

    example below:

    SW1(config)#class-map match-all PREFERRED_DATA

    SW1(config-cmap)#match ip dscp af33

    SW1(config-cmap)#class-map match-all CONTROL_PLANE

    SW1(config-cmap)#match ip dscp cs6

    SW1(config-cmap)#class-map match-all VIDEO

    SW1(config-cmap)#match ip dscp af41

    SW1(config-cmap)#class-map match-all VOICE

    SW1(config-cmap)#match ip dscp ef

    SW1(config-cmap)#class-map match-all C2_VOICE

    SW1(config-cmap)#match ip dscp 47

    SW1(config-cmap)#exit

    Step 2: Configure a policy map to be applied to the core-layer-facing interface that

    reserves the bandwidth for each traffic type as shown in the example below:

    SW1(config)#policy-map QOS_POLICY

    SW1(config-pmap)#class CONTROL_PLANE

    SW1(config-pmap-c)#priority percent 10

    SW1(config-pmap-c)#class C2_VOICE

    SW1(config-pmap-c)#priority percent 10

    SW1(config-pmap-c)#class VOICE

    SW1(config-pmap-c)#priority percent 15

    SW1(config-pmap-c)#class VIDEO

    SW1(config-pmap-c)#bandwidth percent 25

    SW1(config-pmap-c)#class PREFERRED_DATA

    SW1(config-pmap-c)#bandwidth percent 25

    SW1(config-pmap-c)#class class-default

    SW1(config-pmap-c)#bandwidth percent 15

    SW1(config-pmap-c)#exit

    SW1(config-pmap)#exit

    Step 3: Apply the output service policy to all interfaces as shown in the configuration

    example below:

    SW1(config)#int g1/1

    SW1(config-if)#service-policy output QOS_POLICY

    SW1(config-if)#exit

    SW1(config)#int g1/2

    SW1(config-if)#service-policy output QOS_POLICY

    SW1(config-if)#end'
  checks:
  - type: manual_review
    info: "Review the switch configuration and verify that a QoS policy has been configured to\nprovide preferred treatment\
      \ for mission-critical applications.\nStep 1: Verify that the class-maps are configured to match on DSCP values as shown\
      \ in\nthe configuration example below:\nclass-map match-all PREFERRED_DATA\n match ip dscp af33\nclass-map match-all\
      \ CONTROL_PLANE\n match ip dscp cs6\nclass-map match-all VIDEO\n match ip dscp af41\nclass-map match-all VOICE\n match\
      \ ip dscp ef\nclass-map match-all C2_VOICE\n match "
    severity: medium
- id: '1.46'
  title: CISC-RT-000780
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to enforce a Quality-of-Service (QoS) policy to limit the effects of packet
    flooding denial-of-service (DoS) attacks. GROUP ID: V-220460 RULE ID: SV-220460r622190'
  rationale: DoS is a condition when a resource is not available for legitimate users. Packet flooding distributed denial-of-service
    (DDoS) attacks are referred to as volumetric attacks and have the objective of overloading a network or circuit to deny
    or seriously degrade performance, which denies access to the services that normally traverse the network or circuit. Volumetric
    attacks have become relatively easy to launch using readily available tools such as Low Orbit Ion Cannon or botnets. Measures
    to mitigate the effects of a successful volumetric attack must be taken to ensure that sufficient capacity is available
    for mission-critical traffic. Managing capacity may include, for example, establishing selected network usage priorities
    or quotas and enforcing them using rate limiting, Quality of Service (QoS), or other resource reservation control methods.
    These measures may also mitigate the effects of sudden decreases in network capacity that are the result of accidental
    or intentional physical damage to telecommunications facilities (such as cable cuts or weather-related outages).
  impact: ''
  references: []
  page_start: 109
  audit_raw: "Review the switch configuration to determine if it is configured to enforce a QoS policy\nto limit the effects\
    \ of packet flooding DoS attacks.\nStep 1: Verify that a class-map has been configured for the Scavenger class as shown\n\
    in the example below:\nclass-map match-all SCAVENGER\n match ip dscp cs1\nStep 2: Verify that the policy-map includes\
    \ the SCAVENGER class with low priority as\nshown in the example below:\npolicy-map QOS_POLICY\n class CONTROL_PLANE\n\
    \ priority percent 10\n class C2_VOICE\n priority percent 10\n class VOICE\n priority percent 15\n class VIDEO\n bandwidth\
    \ percent 25\n class PREFERRED_DATA\n bandwidth percent 25\nclass SCAVENGER\n bandwidth percent 5\n class class-default\n\
    \ bandwidth percent 10\nNote: Traffic out of profile must be marked at the customer access layer or CE egress\nedge.\n\
    If the switch is not configured to enforce a QoS policy to limit the effects of packet\nflooding DoS attacks, this is\
    \ a finding."
  remediation: 'Step 1: Configure a class-map for the SCAVENGER class.

    SW1(config)#class-map match-all SCAVENGER

    SW1(config-cmap)#match ip dscp cs1

    Step 2: Add the SCAVENGER class to the policy-map as shown in the example below:

    SW1(config)#policy-map QOS_POLICY

    SW1(config-pmap-c)#no class class-default

    SW1(config-pmap)#class SCAVENGER

    SW1(config-pmap-c)#bandwidth percent 5

    SW1(config-pmap-c)#class class-default

    SW1(config-pmap-c)#bandwidth percent 10

    SW1(config-pmap-c)#end'
  checks:
  - type: manual_review
    info: "Review the switch configuration to determine if it is configured to enforce a QoS policy\nto limit the effects\
      \ of packet flooding DoS attacks.\nStep 1: Verify that a class-map has been configured for the Scavenger class as shown\n\
      in the example below:\nclass-map match-all SCAVENGER\n match ip dscp cs1\nStep 2: Verify that the policy-map includes\
      \ the SCAVENGER class with low priority as\nshown in the example below:\npolicy-map QOS_POLICY\n class CONTROL_PLANE\n\
      \ priority percent 10\n class C2_VOICE\n priority"
    severity: medium
- id: '1.47'
  title: CISC-RT-000790
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco multicast switch must be configured to disable Protocol Independent Multicast (PIM) on all interfaces
    that are not required to support multicast routing. GROUP ID: V-220461 RULE ID: SV-220461r622190'
  rationale: If multicast traffic is forwarded beyond the intended boundary, it is possible that it can be intercepted by
    unauthorized or unintended personnel. Limiting where, within the network, a given multicast group's data is permitted
    to flow is an important first step in improving multicast security. A scope zone is an instance of a connected region
    of a given scope. Zones of the same scope cannot overlap, while zones of a smaller scope will fit completely within a
    zone of a larger scope. For example, Admin-local scope is smaller than Site-local scope, so the administratively configured
    boundary fits within the bounds of a site. According to RFC 4007 IPv6 Scoped Address Architecture (section 5), scope zones
    are also required to be "convex from a routing perspective"; that is, packets routed within a zone must not pass through
    any links that are outside of the zone. This requirement forces each zone to be one contiguous island rather than a series
    of separate islands. As stated in the DoD IPv6 IA Guidance for MO3, "One should be able to identify all interfaces of
    a zone by drawing a closed loop on their network diagram, engulfing some switches and passing through some switches to
    include only some of their interfaces." Therefore, it is imperative that the network engineers have documented their multicast
    topology and know which interfaces are enabled for multicast. Once this is done, the zones can be scoped as required.
  impact: ''
  references: []
  page_start: 112
  audit_raw: "Step 1: Review the network's multicast topology diagram.\nStep 2: Review the switch configuration to verify\
    \ that only the PIM interfaces as shown\nin the multicast topology diagram are enabled for PIM as shown in the example\
    \ below:\ninterface GigabitEthernet1/1\n no switchport\n ip address 10.1.3.3 255.255.255.0\n ip pim sparse-mode\nIf an\
    \ interface is not required to support multicast routing and it is enabled, this is a\nfinding."
  remediation: 'Document all enabled interfaces for PIM in the network''s multicast topology diagram.

    Disable support for PIM on interfaces that are not required to support it.

    SW1(config)#int g1/1

    SW1(config-if)#no ip pim sparse-mode'
  checks:
  - type: manual_review
    info: "Step 1: Review the network's multicast topology diagram.\nStep 2: Review the switch configuration to verify that\
      \ only the PIM interfaces as shown\nin the multicast topology diagram are enabled for PIM as shown in the example below:\n\
      interface GigabitEthernet1/1\n no switchport\n ip address 10.1.3.3 255.255.255.0\n ip pim sparse-mode\nIf an interface\
      \ is not required to support multicast routing and it is enabled, this is a\nfinding."
    severity: medium
- id: '1.48'
  title: CISC-RT-000800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco multicast switch must be configured to bind a Protocol Independent Multicast (PIM) neighbor filter
    to interfaces that have PIM enabled. GROUP ID: V-220462 RULE ID: SV-220462r622190'
  rationale: PIM is a routing protocol used to build multicast distribution trees for forwarding multicast traffic across
    the network infrastructure. PIM traffic must be limited to only known PIM neighbors by configuring and binding a PIM neighbor
    filter to interfaces that have PIM enabled. If a PIM neighbor filter is not applied to interfaces that have PIM enabled,
    unauthorized switches can join the PIM domain, discover and use the rendezvous points, and advertise their rendezvous
    points into the domain. This can result in a denial of service by traffic flooding or in the unauthorized transfer of
    data.
  impact: ''
  references: []
  page_start: 114
  audit_raw: "Step 1: Verify that all interfaces enabled for PIM have a neighbor access control list\n(ACL) bound to the interface\
    \ as shown in the example below:\ninterface GigabitEthernet1/1\n no switchport\n ip address 10.1.2.2 255.255.255.0\n ip\
    \ pim neighbor-filter PIM_NEIGHBORS\n ip pim sparse-mode\nStep 2: Review the configured ACL for filtering PIM neighbors\
    \ as shown in the example\nbelow:\nip access-list standard PIM_NEIGHBORS\n permit 10.1.2.6\nIf PIM neighbor ACLs are not\
    \ bound to all interfaces that have PIM enabled, this is a\nfinding."
  remediation: 'Configure neighbor ACLs to only accept PIM control plane traffic from documented PIM

    neighbors. Bind neighbor ACLs to all PIM-enabled interfaces.

    Step 1: Configure ACL for PIM neighbors.

    SW2(config)#ip access-list standard PIM_NEIGHBORS

    SW2(config-std-nacl)#permit 10.1.2.6

    SW2(config-std-nacl)#exit

    Step 2: Apply the ACL to all interfaces enabled for PIM.

    SW2(config)#int g1/1

    SW2(config-if)#ip pim neighbor-filter PIM_NEIGHBORS'
  checks:
  - type: manual_review
    info: "Step 1: Verify that all interfaces enabled for PIM have a neighbor access control list\n(ACL) bound to the interface\
