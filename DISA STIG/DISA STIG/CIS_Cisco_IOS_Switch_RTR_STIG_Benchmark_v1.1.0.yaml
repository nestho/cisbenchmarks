- id: '1.15'
  title: CISC-RT-000235
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to have Cisco Express Forwarding enabled. GROUP ID: V-237749 RULE ID:
    SV-237749r648775'
  rationale: The Cisco Express Forwarding (CEF) switching mode replaces the traditional Cisco routing cache with a data structure
    that mirrors the entire system routing table. Because there is no need to build cache entries when traffic starts arriving
    for new destinations, CEF behaves more predictably when presented with large volumes of traffic addressed to many destinations
    such as a SYN flood attacks that. Because many SYN flood attacks use randomized source addresses to which the hosts under
    attack will reply to, there can be a substantial amount of traffic for a large number of destinations that the switch
    will have to handle. Consequently, switches configured for CEF will perform better under SYN floods directed at hosts
    inside the network than switches using the traditional cache.
  impact: ''
  references: []
  page_start: 44
  audit_raw: 'Review the switch to verify that CEF is enabled.

    IPv4 Example: ip cef

    IPv6 Example: ipv6 cef

    If the switch is not configured to have CEF enabled, this is a finding.'
  remediation: 'Enable CEF

    IPv4 Example: ip cef

    IPv6 Example: ipv6 cef'
  checks:
  - type: manual_review
    info: 'Review the switch to verify that CEF is enabled.

      IPv4 Example: ip cef

      IPv6 Example: ipv6 cef

      If the switch is not configured to have CEF enabled, this is a finding.'
    severity: medium
- id: '1.16'
  title: CISC-RT-000236
  scoring: scored
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco switch must be configured to advertise a hop limit of at least 32 in Switch Advertisement messages
    for IPv6 stateless auto-configuration deployments. GROUP ID: V-237751 RULE ID: SV-237751r648779'
  rationale: The Neighbor Discovery protocol allows a hop limit value to be advertised by routers in a Router Advertisement
    message being used by hosts instead of the standardized default value. If a very small value was configured and advertised
    to hosts on the LAN segment, communications would fail due to the hop limit reaching zero before the packets sent by a
    host reached its destination.
  impact: ''
  references: []
  page_start: 45
  audit_raw: 'Review the switch configuration to determine if the hop limit has been configured for

    Router Advertisement messages as shown in the example.

    ipv6 hop-limit 128

    If hop-limit has been configured and has not been set to at least 32, it is a finding.'
  remediation: 'Configure the switch to advertise a hop limit of at least 32 in Router Advertisement

    messages as shown in the example.

