  description: 'Firefox fingerprinting protection must be enabled. GROUP ID: V-251567 RULE ID: SV-251567r960963'
  rationale: The Content Blocking/Tracking Protection feature stops Firefox from loading content from malicious sites. The
    content might be a script or an image, for example. If a site is on one of the tracker lists that Firefox is set to use,
    the fingerprinting script (or other tracking script/image) will not be loaded from that site. Fingerprinting scripts collect
    information about browser and device configuration, such as operating system, screen resolution, and other settings. By
    compiling these pieces of data, fingerprinters create a unique profile that can be used to track the user around the web.
