benchmark:
  id: cis-mozilla-firefox-stig-benchmark
  title: CIS Mozilla Firefox STIG Benchmark
  version: 1.0.0
  technology: DISA STIG
  category: DISA STIG
  os: DISA STIG
  source_pdf: CIS_Mozilla_Firefox_STIG_Benchmark_v1.0.0.pdf
  total_pages: 82
  controls_count: 34
controls:
- id: '1.1'
  title: FFOX-00-000001
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The installed version of Firefox must be supported. GROUP ID: V-251545 RULE ID: SV-251545r961683'
  rationale: Using versions of an application that are not supported by the vendor is not permitted. Vendors respond to security
    flaws with updates and patches. These updates are not available for unsupported versions, which can leave the application
    vulnerable to attack.
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'Run Firefox. Click the ellipsis button >> Help >> About Firefox, and view the version

    number.

    If the Firefox version is not a supported version, this is a finding.'
  remediation: 'Upgrade the version of the browser to an approved version by obtaining software from

    the vendor or other trusted source.'
  checks:
  - type: manual_review
    info: 'Run Firefox. Click the ellipsis button >> Help >> About Firefox, and view the version

      number.

      If the Firefox version is not a supported version, this is a finding.'
    severity: medium
- id: '1.2'
  title: FFOX-00-000002
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Firefox must be configured to allow only TLS 1.2 or above. GROUP ID: V-251546 RULE ID: SV-251546r961869'
  rationale: Use of versions prior to TLS 1.2 are not permitted. SSL 2.0 and SSL 3.0 contain a number of security flaws. These
    versions must be disabled in compliance with the Network Infrastructure and Secure Remote Computing STIGs.
  impact: ''
  references: []
  page_start: 12
  audit_raw: 'Type "about:policies" in the browser window.

    If "SSLVersionMin" is not displayed under Policy Name or the Policy Value is not "tls1.2"

    or "tls1.3", this is a finding.'
  remediation: 'Windows group policy:

    1. Open the group policy editor tool with "gpedit.msc".

    2. Navigate to Policy Path: Computer Configuration\Administrative

    Templates\Mozilla\Firefox

    1. Policy Name: Minimum SSL version enabled

    2. Policy State: Enabled

    3. Policy Value: TLS 1.2 (or TLS 1.3)

    macOS "plist" file:

    Add the following:

    <key>SSLVersionMin</key>

    <string>tls1.2</string> (or <string>tls1.3</string>)

    Linux "policies.json" file:

    Add the following in the policies section:

    "SSLVersionMin": "tls1.2" or ("SSLVersionMin": "tls1.3")'
  checks:
  - type: manual_review
    info: 'Type "about:policies" in the browser window.

      If "SSLVersionMin" is not displayed under Policy Name or the Policy Value is not "tls1.2"

      or "tls1.3", this is a finding.'
    severity: medium
- id: '1.3'
  title: FFOX-00-000003
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Firefox must be configured to ask which certificate to present to a website when a certificate is required.
    GROUP ID: V-251547 RULE ID: SV-251547r1067550'
  rationale: When a website asks for a certificate for user authentication, Firefox must be configured to have the user choose
    which certificate to present. Websites within DOD require user authentication for access, which increases security for
    DOD information. Access will be denied to the user if certificate management is not configured.
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'Type "about:policies" in the browser address bar.

    If "Preferences" is not displayed under Policy Name and the Policy Value does not

    include "security.default_personal_cert" with a value of "Ask Every Time" and status of

    "locked", this is a finding.'
  remediation: "Windows group policy:\n1. Open the group policy editor tool with \"gpedit.msc\".\n2. Navigate to Policy Path:\
    \ Computer Configuration\\Administrative\nTemplates\\Mozilla\\Firefox\n3.\n4. Policy Name: Preferences\n5. Policy State:\
    \ Enabled\n6. Policy Value:\n{\n \"security.default_personal_cert\": {\n \"Value\": \"Ask Every Time\",\n \"Status\":\
    \ \"locked\"\n }\n}\nmacOS \"plist\" file:\nAdd the following:\n<key>Preferences</key>\n<dict>\n <key>security.default_personal_cert</key>\n\
    \ <dict>\n <key>Value</key>\n <string>Ask Every Time</string>\n <key>Status</key>\n <string>locked</string>\n </dict>\n\
    </dict>\nLinux \"policies.json\" file:\nAdd the following in the policies section:\n\"Preferences\": {\n \"security.default_personal_cert\"\
    : {\n \"Value\": \"Ask Every Time\",\n \"Status\": \"locked\"\n }\n}"
  checks:
  - type: manual_review
    info: 'Type "about:policies" in the browser address bar.

      If "Preferences" is not displayed under Policy Name and the Policy Value does not

      include "security.default_personal_cert" with a value of "Ask Every Time" and status of

      "locked", this is a finding.'
    severity: medium
- id: '1.4'
  title: FFOX-00-000004
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Firefox must be configured to not automatically check for updated versions of installed search plugins. GROUP
    ID: V-251548 RULE ID: SV-251548r1067552'
  rationale: Updates must be controlled and installed from authorized and trusted servers. This setting overrides a number
    of other settings that may direct the application to access external URLs.
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Type "about:policies" in the browser address bar.

    If "Preferences" is not displayed under Policy Name or the Policy Value does not

    include "browser.search.update" with a value of "false" and status of "locked", this is a

    finding.'
  remediation: "Windows group policy:\n1. Open the group policy editor tool with \"gpedit.msc\".\n2. Navigate to Policy Path:\
    \ Computer Configuration\\Administrative\nTemplates\\Mozilla\\Firefox\n1. Policy Name: Preferences\n2. Policy State: Enabled\n\
    3. Policy Value:\n{\n \"browser.search.update\": {\n \"Value\": false,\n \"Status\": \"locked\"\n }\n}\nmacOS \"plist\"\
    \ file:\nAdd the following:\n<key>Preferences</key>\n<dict>\n <key>browser.search.update</key>\n <dict>\n <key>Value</key>\n\
    \ <false/>\n <key>Status</key>\n <string>locked</string>\n </dict>\n</dict>\nLinux \"policies.json\" file:\nAdd the following\
    \ in the policies section:\n\"Preferences\": {\n \"browser.search.update\": {\n \"Value\": false,\n \"Status\": \"locked\"\
    \n }\n}"
  checks:
  - type: manual_review
    info: 'Type "about:policies" in the browser address bar.

      If "Preferences" is not displayed under Policy Name or the Policy Value does not

      include "browser.search.update" with a value of "false" and status of "locked", this is a

      finding.'
    severity: medium
- id: '1.5'
  title: FFOX-00-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Firefox must be configured to not automatically update installed add-ons and plugins. GROUP ID: V-251549 RULE
    ID: SV-251549r960963'
  rationale: Set this to false to disable checking for updated versions of the Extensions/Themes. Automatic updates from untrusted
    sites puts the enclave at risk of attack and may override security settings.
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'Type "about:policies" in the browser window.

    If "ExtensionUpdate" is not displayed under Policy Name or the Policy Value is not

    "false", this is a finding.'
  remediation: 'Windows group policy:

    1. Open the group policy editor tool with "gpedit.msc".

    2. Navigate to Policy Path: Computer Configuration\Administrative

    Templates\Mozilla\Firefox\Extensions

    1. Policy Name: Extension Update

    2. Policy State: Disabled

    macOS "plist" file:

    Add the following:

    <key>ExtensionUpdate</key>

    <false/>

    Linux "policies.json" file:

    Add the following in the policies section:

    "ExtensionUpdate": false'
  checks:
  - type: manual_review
    info: 'Type "about:policies" in the browser window.

      If "ExtensionUpdate" is not displayed under Policy Name or the Policy Value is not

      "false", this is a finding.'
    severity: medium
- id: '1.6'
  title: FFOX-00-000006
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Firefox must be configured to not automatically execute or download MIME types that are not authorized for
    auto-download. GROUP ID: V-251550 RULE ID: SV-251550r961194'
  rationale: Some files can be downloaded or execute without user interaction. This setting ensures these files are not downloaded
    and executed.
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'Type "about:preferences" in the browser address bar.

    Type "Applications" in the Find bar in the upper-right corner.

    Determine if any of the following file extensions are listed: HTA, JSE, JS, MOCHA,

    SHS, VBE, VBS, SCT, WSC, FDF, XFDF, LSL, LSO, LSS, IQY, RQY, DOS, BAT, PS,

    EPS, WCH, WCM, WB1, WB3, WCH, WCM, AD.

    If the entry exists and the "Action" is "Save File" or "Always Ask", this is not a finding.

    If an extension exists and the entry in the Action column is associated with an

    application that does/can execute the code, this is a finding.'
  remediation: Remove any unauthorized extensions from the auto-download list.
  checks:
  - type: manual_review
    info: 'Type "about:preferences" in the browser address bar.

      Type "Applications" in the Find bar in the upper-right corner.

      Determine if any of the following file extensions are listed: HTA, JSE, JS, MOCHA,

      SHS, VBE, VBS, SCT, WSC, FDF, XFDF, LSL, LSO, LSS, IQY, RQY, DOS, BAT, PS,

      EPS, WCH, WCM, WB1, WB3, WCH, WCM, AD.

      If the entry exists and the "Action" is "Save File" or "Always Ask", this is not a finding.

      If an extension exists and the entry in the Action column is associated with an

      application tha'
    severity: medium
- id: '1.7'
  title: FFOX-00-000007
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Firefox must be configured to disable form fill assistance. GROUP ID: V-251551 RULE ID: SV-251551r960963'
  rationale: To protect privacy and sensitive data, Firefox provides the ability to configure the program so that data entered
    into forms is not saved. This mitigates the risk of a website gleaning private information from prefilled information.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Type "about:policies" in the browser window.

    If "DisableFormHistory" is not displayed under Policy Name or the Policy Value is not

    "true", this is a finding.'
  remediation: 'Windows group policy:

    1. Open the group policy editor tool with "gpedit.msc".

    2. Navigate to Policy Path: Computer Configuration\Administrative

    Templates\Mozilla\Firefox

    1. Policy Name: Disable Form History

    2. Policy State: Enabled

    macOS "plist" file:

    Add the following:

    <key>DisableFormHistory</key>

    <true/>

    Linux "policies.json" file:

    Add the following in the policies section:

    "DisableFormHistory": true'
  checks:
  - type: manual_review
    info: 'Type "about:policies" in the browser window.

      If "DisableFormHistory" is not displayed under Policy Name or the Policy Value is not

      "true", this is a finding.'
    severity: medium
- id: '1.8'
  title: FFOX-00-000008
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Firefox must be configured to not use a password store with or without a master password. GROUP ID: V-251552
    RULE ID: SV-251552r960963'
  rationale: Firefox can be set to store passwords for sites visited by the user. These individual passwords are stored in
    a file and can be protected by a master password. Autofill of the password can then be enabled when the site is visited.
    This feature could also be used to autofill the certificate PIN, which could lead to compromise of DoD information.
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'Type "about:policies" in the browser window.

    If "PasswordManagerEnabled" is not displayed under Policy Name or the Policy Value

    is not "false", this is a finding.'
  remediation: 'Windows group policy:

    1. Open the group policy editor tool with "gpedit.msc".

    2. Navigate to Policy Path: Computer Configuration\Administrative

    Templates\Mozilla\Firefox

    1. Policy Name: PasswordManager

    2. Policy State: Disabled

    macOS "plist" file:

    Add the following:

    <key>PasswordManagerEnabled</key>

    <false/>

    Linux "policies.json" file:

    Add the following in the policies section:

    "PasswordManagerEnabled": false'
  checks:
  - type: manual_review
    info: 'Type "about:policies" in the browser window.

      If "PasswordManagerEnabled" is not displayed under Policy Name or the Policy Value

      is not "false", this is a finding.'
    severity: medium
- id: '1.9'
  title: FFOX-00-000009
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Firefox must be configured to block pop-up windows. GROUP ID: V-251553 RULE ID: SV-251553r960963'
  rationale: Pop-up windows may be used to launch an attack within a new browser window with altered settings. This setting
    blocks pop-up windows created while the page is loading.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'Type "about:policies" in the browser address bar.

    If "PopupBlocking" is not displayed under Policy Name or the Policy Value is not

    "Default" "true", this is a finding.

    If "PopupBlocking" is not displayed under Policy Name or the Policy Value is not

    "Locked" "true", this is a finding.

    "PopupBlocking" "Enabled" may be used to specify an allowlist of sites where pop-ups

    are desired, this is optional.'
  remediation: "Windows group policy:\n1. Open the group policy editor tool with \"gpedit.msc\".\n2. Navigate to Policy Path:\
    \ Computer Configuration\\Administrative\nTemplates\\Mozilla\\Firefox\\Popups\n1. Policy Name: Block pop-ups from websites\n\
    2. Policy State: Enabled\n3. Policy Name: Do not allow preferences to be changed\n4. Policy State: Enabled\n5. Optional:\n\
    6. Policy Name: Allowed Sites\n7. Policy State: Enabled\nClick \"Show...\" and enter a list of websites to be allowlisted.\n\
    macOS \"plist\" file:\nAdd the following:\n<key>PopupBlocking</key>\n <dict>\n <key>Allow</key>\n <array>\n <string>http://example.mil</string>\n\
    \ <string>http://example.gov</string>\n </array>\n <key>Default</key>\n <true/>\n <key>Locked</key>\n <true/>\n </dict>\n\
    Linux \"policies.json\" file:\nAdd the following in the policies section:\n\"PopupBlocking\": {\n \"Allow\": [\"http://example.mil/\"\
    ,\n \"http://example.gov/\"],\n \"Default\": true,\n \"Locked\": true}"
  checks:
  - type: manual_review
    info: 'Type "about:policies" in the browser address bar.

      If "PopupBlocking" is not displayed under Policy Name or the Policy Value is not

      "Default" "true", this is a finding.

      If "PopupBlocking" is not displayed under Policy Name or the Policy Value is not

      "Locked" "true", this is a finding.

      "PopupBlocking" "Enabled" may be used to specify an allowlist of sites where pop-ups

      are desired, this is optional.'
    severity: medium
- id: '1.10'
  title: FFOX-00-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Firefox must be configured to prevent JavaScript from moving or resizing windows. GROUP ID: V-251554 RULE
    ID: SV-251554r1067554'
  rationale: JavaScript can make changes to the browser's appearance. This activity can help disguise an attack taking place
    in a minimized background window. Configure the browser setting to prevent scripts on visited websites from moving and
    resizing browser windows.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'Type "about:policies" in the browser address bar.

    If "Preferences" is not displayed under Policy Name or the Policy Value does not

    include "dom.disable_window_move_resize" with a value of "true" and status of

    "locked", this is a finding.'
  remediation: "Windows group policy:\n1. Open the group policy editor tool with \"gpedit.msc\".\n2. Navigate to Policy Path:\
    \ Computer Configuration\\Administrative\nTemplates\\Mozilla\\Firefox\n1. Policy Name: Preferences\n2. Policy State: Enabled\n\
    3. Policy Value:\n{\n \"dom.disable_window_move_resize\": {\n \"Value\": true,\n \"Status\": \"locked\"\n }\n}\nmacOS\
    \ \"plist\" file:\nAdd the following:\n<key>Preferences</key>\n<dict>\n <key>dom.disable_window_move_resize</key>\n <dict>\n\
    \ <key>Value</key>\n <true/>\n <key>Status</key>\n <string>locked</string>\n </dict>\n</dict>\nLinux \"policies.json\"\
    \ file:\nAdd the following in the policies section:\n\"Preferences\": {\n \"dom.disable_window_move_resize\": {\n \"Value\"\
    : true,\n \"Status\": \"locked\"\n }\n}"
  checks:
  - type: manual_review
    info: 'Type "about:policies" in the browser address bar.

      If "Preferences" is not displayed under Policy Name or the Policy Value does not

      include "dom.disable_window_move_resize" with a value of "true" and status of

      "locked", this is a finding.'
    severity: medium
- id: '1.11'
  title: FFOX-00-000011
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Firefox must be configured to prevent JavaScript from raising or lowering windows. GROUP ID: V-251555 RULE
    ID: SV-251555r1067556'
  rationale: JavaScript can raise and lower browser windows to cause improper input. Configure the browser setting to prevent
    scripts on visited websites from raising and lowering browser windows.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'Type "about:policies" in the browser address bar.

    If "Preferences" is not displayed under Policy Name or the Policy Value does not

    include "dom.disable_window_flip" with a value of "true" and status of "locked", this is a

    finding.'
  remediation: "Windows group policy:\n1. Open the group policy editor tool with \"gpedit.msc\".\n2. Navigate to Policy Path:\
    \ Computer Configuration\\Administrative\nTemplates\\Mozilla\\Firefox\n1. Policy Name: Preferences\n2. Policy State: Enabled\n\
    3. Policy Value:\n{\n \"dom.disable_window_flip\": {\n \"Value\": true,\n \"Status\": \"locked\"\n }\n}\nmacOS \"plist\"\
    \ file:\nAdd the following:\n<key>Preferences</key>\n<dict>\n <key>dom.disable_window_flip</key>\n <dict>\n <key>Value</key>\n\
    \ <true/>\n <key>Status</key>\n <string>locked</string>\n </dict>\n</dict>\nLinux \"policies.json\" file:\nAdd the following\
    \ in the policies section:\n\"Preferences\": {\n \"dom.disable_window_flip\": {\n \"Value\": true,\n \"Status\": \"locked\"\
    \n }\n}"
  checks:
  - type: manual_review
    info: 'Type "about:policies" in the browser address bar.

      If "Preferences" is not displayed under Policy Name or the Policy Value does not

      include "dom.disable_window_flip" with a value of "true" and status of "locked", this is a

      finding.'
    severity: medium
- id: '1.12'
  title: FFOX-00-000013
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Firefox must be configured to disable the installation of extensions. GROUP ID: V-251557 RULE ID: SV-251557r960963'
  rationale: A browser extension is a program that has been installed into the browser to add functionality. Where a plug-in
    interacts only with a web page and usually a third-party external application (e.g., Flash, Adobe Reader), an extension
    interacts with the browser program itself. Extensions are not embedded in web pages and must be downloaded and installed
    in order to work. Extensions allow browsers to avoid restrictions that apply to web pages. For example, an extension can
    be written to combine data from multiple domains and present it when a certain page is accessed, which can be considered
    cross-site scripting. If a browser is configured to allow unrestricted use of extensions, plug-ins can be loaded and installed
    from malicious sources and used on the browser.
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'Type "about:policies" in the browser address bar.

    If "InstallAddonsPermission" is not displayed under Policy Name or the Policy Value is

    not "Default" "false", this is a finding.'
  remediation: "Windows group policy:\n1. Open the group policy editor tool with \"gpedit.msc\".\n2. Navigate to Policy Path:\
    \ Computer Configuration\\Administrative\nTemplates\\Mozilla\\Firefox\\Addons\n1. Policy Name: Allow add-on installs from\
    \ websites\n2. Policy State: Disabled\nmacOS \"plist\" file:\nAdd the following:\n<key>InstallAddonsPermission</key>\n\
    <false/>\nLinux \"policies.json\" file:\nAdd the following in the policies section:\n\"InstallAddonsPermission\": {\n\
    \ \"Default\": false\n}"
  checks:
  - type: manual_review
    info: 'Type "about:policies" in the browser address bar.

      If "InstallAddonsPermission" is not displayed under Policy Name or the Policy Value is

      not "Default" "false", this is a finding.'
    severity: medium
- id: '1.13'
  title: FFOX-00-000014
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Background submission of information to Mozilla must be disabled. GROUP ID: V-251558 RULE ID: SV-251558r960963'
  rationale: Firefox by default sends information about Firefox to Mozilla servers. There should be no background submission
    of technical and other information from DoD computers to Mozilla with portions posted publicly.
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'Type "about:policies" in the browser window.

    If "DisableTelemetry" is not displayed under Policy Name or the Policy Value is not

    "true", this is a finding.'
  remediation: 'Windows group policy:

    1. Open the group policy editor tool with "gpedit.msc".

    2. Navigate to Policy Path: Computer Configuration\Administrative

    Templates\Mozilla\Firefox

    1. Policy Name: Disable Telemetry

    2. Policy State: Enabled

    macOS "plist" file:

    Add the following:

    <key>DisableTelemetry</key>

    <true/>

    Linux "policies.json" file:

    Add the following in the policies section:

    "DisableTelemetry": true'
  checks:
  - type: manual_review
    info: 'Type "about:policies" in the browser window.

      If "DisableTelemetry" is not displayed under Policy Name or the Policy Value is not

      "true", this is a finding.'
    severity: medium
- id: '1.14'
  title: FFOX-00-000015
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Firefox development tools must be disabled. GROUP ID: V-251559 RULE ID: SV-251559r961167'
  rationale: Information needed by an attacker to begin looking for possible vulnerabilities in a web browser includes any
    information about the web browser and plug-ins or modules being used. When debugging or trace information is enabled in
    a production web browser, information about the web browser, such as web browser type, version, patches installed, plug-ins
    and modules installed, type of code being used by the hosted application, and any back ends being used for data storage
    may be displayed. Because this information may be placed in logs and general messages during normal operation of the web
    browser, an attacker does not have to cause an error condition to gain this information.
  impact: ''
  references: []
  page_start: 35
  audit_raw: 'Type "about:policies" in the browser window.

    If "DisableDeveloperTools" is not displayed under Policy Name or the Policy Value is

    not "true", this is a finding.'
  remediation: 'Windows group policy:

    1. Open the group policy editor tool with "gpedit.msc".

    2. Navigate to Policy Path: Computer Configuration\Administrative

    Templates\Mozilla\Firefox

    1. Policy Name: Disable Developer Tools

    2. Policy State: Enabled

    macOS "plist" file:

    Add the following:

    <key>DisableDeveloperTools</key>

    <true/>

    Linux "policies.json" file:

    Add the following in the policies section:

    "DisableDeveloperTools": true'
  checks:
  - type: manual_review
    info: 'Type "about:policies" in the browser window.

      If "DisableDeveloperTools" is not displayed under Policy Name or the Policy Value is

      not "true", this is a finding.'
    severity: medium
- id: '1.15'
  title: FFOX-00-000016
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Firefox must have the DOD root certificates installed. GROUP ID: V-251560 RULE ID: SV-251560r1067559'
  rationale: The DOD root certificates will ensure that the trust chain is established for server certificates issued from
    the DOD Certificate Authority (CA).
  impact: ''
  references: []
  page_start: 37
  audit_raw: 'Type "about:preferences#privacy" in the browser window.

    Scroll down to the bottom and select "View Certificates...".

    In the Certificate Manager window, select the "Authorities" tab.

    Scroll through the Certificate Name list to the U.S. Government heading. Look for the

    entries for DOD Root CA 3, DOD Root CA 4, and DOD Root CA 5.

    If there are entries for DOD Root CA 3, DOD Root CA 4, and DOD Root CA 5, select

    them individually.

    Click "View".

    Verify the issuer name is "US Government".

    If there are no entries for the appropriate DOD root certificates, this is a finding. If other

    AO-approved certificates are used, this is not a finding. If SIPRNet-specific certificates

    are used, this is not a finding.

    Note: In a Windows environment, use of policy setting

    "security.enterprise_roots.enabled=true" will point Firefox to the Windows Trusted Root

    Certification Authority Store. This is not a finding. It can also be set via the policy

    Certificates >> ImportEnterpriseRoots, which can be verified via "about:policies".'
  remediation: 'Install the DOD root certificates. Other AO-approved certificates may also be used.

    Certificates designed for SIPRNet may be used as appropriate.

    On Windows, import certificates from the operating system by using Certificates >>

