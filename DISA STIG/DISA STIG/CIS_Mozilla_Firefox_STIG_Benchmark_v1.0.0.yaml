- id: '1.32'
  title: FFOX-00-000037
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Firefox encrypted media extensions must be disabled. GROUP ID: V-251581 RULE ID: SV-251581r960963'
  rationale: Enable or disable Encrypted Media Extensions and optionally lock it. If "Enabled" is set to "false", Firefox
    does not download encrypted media extensions (such as Widevine) unless the user consents to installing them. If "Locked"
    is set to "true" and "Enabled" is set to "false", Firefox will not download encrypted media extensions (such as Widevine)
    or ask the user to install them. It is detrimental for applications to provide, or install by default, functionality exceeding
    requirements or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may
    remain unsecured. They increase the risk to the platform by providing additional attack vectors. Applications are capable
    of providing a wide variety of functions and services. Some of the functions and services, provided by default, may not
    be necessary to support essential organizational operations (e.g., key missions, functions). Examples of non-essential
    capabilities include but are not limited to advertising software or browser plug-ins that are not related to requirements
    or provide a wide array of functionality not required for every mission but that cannot be disabled.
  impact: ''
  references: []
  page_start: 74
  audit_raw: 'Type "about:policies" in the browser address bar.

    If "EncryptedMediaExtensions" is not displayed under Policy Name or the Policy Value

    does not have "Enabled" set to "false" or the Policy Value does not have "Locked" set to

    "true", this is a finding.'
  remediation: "Windows group policy:\n1. Open the group policy editor tool with \"gpedit.msc\".\n2. Navigate to Policy Path:\
    \ Computer Configuration\\Administrative\nTemplates\\Mozilla\\Firefox\\Encrypted Media Extensions\n3. Policy Name: Enable\
    \ Encrypted Media Extensions\n1. Policy State: Disabled\n2. Policy Name: Lock Encrypted Media Extensions\n3. Policy State:\
    \ Enabled\nmacOS \"plist\" file:\n<key>EncryptedMediaExtensions</key>\n <dict>\n <key>Enabled</key>\n <false/>\n <key>Locked</key>\n\
    \ <true/>\nLinux \"policies.json\" file:\nAdd the following in the policies section:\n\"EncryptedMediaExtensions\": {\n\
    \ \"Enabled\": false,\n \"Locked\": true\n}"
  checks:
  - type: manual_review
    info: 'Type "about:policies" in the browser address bar.

      If "EncryptedMediaExtensions" is not displayed under Policy Name or the Policy Value

      does not have "Enabled" set to "false" or the Policy Value does not have "Locked" set to

      "true", this is a finding.'
    severity: medium
