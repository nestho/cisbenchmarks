    2. Policy State: Enabled\nmacOS \"plist\" file:\nAdd the following:\n<key>EnableTrackingProtection</key>\n <dict>\n <key>Fingerprinting</key>\n\
    \ <true/>\n </dict>\nLinux \"policies.json\" file:\nAdd the following in the policies section:\n\"EnableTrackingProtection\"\
    : {\n \"Fingerprinting\": true\n}"
