      If the output does not match the expected result, this is a finding.'
- id: '1.15'
  title: VCPG-70-000015
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VMware Postgres must not allow schema access to unauthorized accounts. GROUP ID: V-256605 RULE ID: SV-256605r887601'
  rationale: Database management systems typically separate security functionality from nonsecurity functionality via separate
    databases or schemas. Database objects or code implementing security functionality should not be commingled with objects
    or code implementing application logic. When security and nonsecurity functionality are commingled, users who have access
    to nonsecurity functionality may be able to access security functionality. VMware Postgres contains a number of system
    configuration schemas for which access must be strictly limited. By default, the "pg_catalog" and "information_schema"
    objects are configured to only be accessible in a read-only manner publicly and otherwise only accessible by the Postgres
    user. This configuration must be verified and maintained.
  impact: ''
  references: []
  page_start: 39
  audit_raw: 'At the command prompt, run the following command:

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "\dp .*.;" |grep -E

    "information_schema|pg_catalog"|awk -F ''|'' ''{print $4}''|awk -F ''/'' ''{print

    $1}''|grep -v "=r" | grep -v "^[[:space:]]*$" | grep -v "postgres"

    If any lines are returned, this is a finding.'
  remediation: 'At the command prompt, run the following command:

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "REVOKE ALL

    PRIVILEGES ON <name> FROM <user>;"

    Replace <name> and <user> with the Access Privilege name and account, respectively,

    discovered during the check.'
  checks:
  - type: command
    command: $1}'|grep -v "=r" | grep -v "^[[:space:]]*$" | grep -v "postgres"
    expected: ''
    severity: medium
    info: 'At the command prompt, run the following command:

      # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "\dp .*.;" |grep -E

      "information_schema|pg_catalog"|awk -F ''|'' ''{print $4}''|awk -F ''/'' ''{print

      $1}''|grep -v "=r" | grep -v "^[[:space:]]*$" | grep -v "postgres"

      If any lines are returned, this is a finding.'
- id: '1.16'
  title: VCPG-70-000016
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VMware Postgres must provide nonprivileged users with minimal error information. GROUP ID: V-256606 RULE ID:
    SV-256606r887604'
  rationale: 'Any database management system (DBMS) or associated application providing too much information in error messages
    on the screen or printout risks compromising the data and security of the system. The structure and content of error messages
    must contain the minimal amount of information. Databases can inadvertently provide a wealth of information to an attacker
    through improperly handled error messages. In addition to sensitive business or personal information, database errors
    can provide host names, IP addresses, user names, and other system information not required for troubleshooting but very
    useful to someone targeting the system. Satisfies: SRG-APP-000266-DB-000162, SRG-APP-000267-DB-000163'
  impact: ''
  references: []
