- id: '1.19'
  title: VCPG-70-000019
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: '"Rsyslog" must be configured to monitor VMware Postgres logs. GROUP ID: V-256609 RULE ID: SV-256609r887613'
  rationale: 'For performance reasons, "rsyslog" file monitoring is preferred over configuring VMware Postgres to send events
    to a "syslog" facility. Without ensuring that logs are created, that "rsyslog" configs are created, and that those configs
    are loaded, the log file monitoring and shipping will not be effective. Satisfies: SRG-APP-000359-DB-000319, SRG-APP-000360-DB-000320,
    SRG-APP000515-DB-000318'
  impact: ''
  references: []
  page_start: 47
  audit_raw: 'At the command prompt, run the following command:

    # rpm -V VMware-Postgres-cis-visl-scripts|grep -E "vmware-services-vmwarevpostgres.conf|vmware-services-vmware-postgres-archiver.conf"
    | grep

    If the command returns any output, this is a finding.'
  remediation: "Navigate to and open:\n/etc/vmware-syslog/vmware-services-vmware-vpostgres.conf\nCreate the file if it does\
    \ not exist.\nSet the contents of the file as follows:\n# vmware-vpostgres first logs, before loading configuration\n\
    input(type=\"imfile\"\n File=\"/var/log/vmware/vpostgres/serverlog.std*\"\n Tag=\"vpostgres-first\"\n Severity=\"info\"\
    \n Facility=\"local0\")\n# vmware-vpostgres logs\ninput(type=\"imfile\"\n File=\"/var/log/vmware/vpostgres/postgresql-*.log\"\
    \n Tag=\"vpostgres\"\n Severity=\"info\"\n Facility=\"local0\")\nNavigate to and open:\n/etc/vmware-syslog/vmware-services-vmware-postgres-archiver.conf\n\
    Create the file if it does not exist.\nSet the contents of the file as follows:\n# vmware-postgres-archiver logs\ninput(type=\"\
    imfile\"\n File=\"/var/log/vmware/vpostgres/pg_archiver.log.std*\"\n Tag=\"postgres-archiver\"\n Severity=\"info\"\n Facility=\"\
    local0\")"
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # rpm -V VMware-Postgres-cis-visl-scripts|grep -E "vmware-services-vmwarevpostgres.conf|vmware-services-vmware-postgres-archiver.conf"
      | grep

      If the command returns any output, this is a finding.'
    severity: medium
- id: '1.20'
  title: VCPG-70-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VMware Postgres must use Coordinated Universal Time (UTC) for log timestamps. GROUP ID: V-256610 RULE ID:
    SV-256610r887616'
  rationale: If time stamps are not consistently applied and there is no common time reference, it is difficult to perform
    forensic analysis. Time stamps generated by VMware Postgres must include date and time expressed in UTC, a modern continuation
    of Greenwich Mean Time (GMT).
  impact: ''
