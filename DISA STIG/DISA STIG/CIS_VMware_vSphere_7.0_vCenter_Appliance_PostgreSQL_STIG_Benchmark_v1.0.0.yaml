benchmark:
  id: cis-vmware-vsphere-7-0-vcenter-appliance-postgresql-stig-benchmark
  title: CIS VMware vSphere 7.0 vCenter Appliance PostgreSQL STIG Benchmark
  version: 1.0.0
  technology: DISA STIG
  category: DISA STIG
  os: DISA STIG
  source_pdf: CIS_VMware_vSphere_7.0_vCenter_Appliance_PostgreSQL_STIG_Benchmark_v1.0.0.pdf
  total_pages: 53
  controls_count: 20
controls:
- id: '1.1'
  title: VCPG-70-000001
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VMware Postgres must limit the number of connections. GROUP ID: V-256591 RULE ID: SV-256591r887559'
  rationale: Database management includes the ability to control the number of users and user sessions utilizing a database
    management system (DBMS). Unlimited concurrent connections to the DBMS could allow a successful denial-of-service (DoS)
    attack by exhausting connection resources, and a system can also fail or be degraded by an overload of legitimate users.
    Limiting the number of concurrent sessions per user is helpful in reducing these risks. VMware Postgres as deployed on
    the vCenter Service Appliance (VCSA) comes preconfigured with a "max_connections" limit that is appropriate for all tested,
    supported scenarios. The out-of-the-box configuration is dynamic, based on a lower limit plus allowances for the resources
    assigned to VCSA and the deployment size. However, this number will always be between 100 and 1000 (inclusive).
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'At the command prompt, run the following command:

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW

    max_connections;"

    If the returned number is not greater than or equal to 100 and less than or equal to

    1000, this is a finding.'
  remediation: 'At the command prompt, run the following command:

    # vmon-cli --restart vmware-vpostgres

    Note: Restarting the service runs the "pg_tuning" script that will configure

    "max_connections" to the appropriate value based on the allocated memory for

    vCenter.'
  checks:
  - type: sql
    command: 'SHOW

      max_connections;'
    severity: medium
    info: 'At the command prompt, run the following command:

      # /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW

      max_connections;"

      If the returned number is not greater than or equal to 100 and less than or equal to

      1000, this is a finding.'
- id: '1.2'
  title: VCPG-70-000002
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VMware Postgres log files must contain required fields. GROUP ID: V-256592 RULE ID: SV-256592r887562'
  rationale: 'Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate
    the events relating to an incident or identify those responsible for one. As an embedded database that is only accessible
    via "localhost", VMware Postgres on the vCenter Server Appliance (VCSA) does not implement robust auditing. However, it
    can and must be configured to log reasonable levels of information relating to user actions to enable proper troubleshooting.
    Satisfies: SRG-APP-000089-DB-000064, SRG-APP-000095-DB-000039, SRG-APP000096-DB-000040, SRG-APP-000097-DB-000041, SRG-APP-000098-DB-000042,
    SRG-APP-000099-DB-000043, SRG-APP-000100-DB-000201, SRG-APP-000101-DB000044, SRG-APP-000375-DB-000323'
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'At the command prompt, run the following command:

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW

    log_line_prefix;"

    Expected result:

    %m %c %x %d %u %r %p %l

    If the output does not match the expected result, this is a finding.'
  remediation: 'At the command prompt, run the following commands:

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "ALTER SYSTEM SET

    log_line_prefix TO ''%m %c %x %d %u %r %p %l '';"

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "SELECT

    pg_reload_conf();"'
  checks:
  - type: sql
    command: 'SHOW

      log_line_prefix;'
    severity: medium
    info: 'At the command prompt, run the following command:

      # /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW

      log_line_prefix;"

      Expected result:

      %m %c %x %d %u %r %p %l

      If the output does not match the expected result, this is a finding.'
- id: '1.3'
  title: VCPG-70-000003
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VMware Postgres configuration files must not be accessible by unauthorized users. GROUP ID: V-256593 RULE
    ID: SV-256593r887565'
  rationale: 'VMware Postgres has a few configuration files that directly control the security posture of the database management
    system (DBMS). Protecting these files from unauthorized access and modification is fundamental to ensuring the security
    of VMware Postgres. Satisfies: SRG-APP-000090-DB-000065, SRG-APP-000121-DB-000202, SRG-APP000122-DB-000203, SRG-APP-000123-DB-000204,
    SRG-APP-000380-DB-000360'
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'At the command prompt, run the following command:

    # find /storage/db/vpostgres/*conf* -xdev -type f -a ''('' -not -perm 600 -o -

    not -user vpostgres -o -not -group vpgmongrp '')'' -exec ls -ld {} \;

    If any files are returned, this is a finding.'
  remediation: 'At the command prompt, run the following commands:

    # chmod 600 <file>

    # chown vpostgres:vpgmongrp <file>

    Note: Replace with the file that has incorrect permissions.'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # find /storage/db/vpostgres/*conf* -xdev -type f -a ''('' -not -perm 600 -o -

      not -user vpostgres -o -not -group vpgmongrp '')'' -exec ls -ld {} \;

      If any files are returned, this is a finding.'
    severity: medium
- id: '1.4'
  title: VCPG-70-000004
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VMware Postgres must be configured to overwrite older logs when necessary. GROUP ID: V-256594 RULE ID: SV-256594r887568'
  rationale: Without proper configuration, log files for VMware Postgres can grow without bound, filling the partition and
    potentially affecting the availability of the vCenter Server Appliance (VCSA). One part of this configuration is to ensure
    the logging subsystem overwrites, rather than appends to, any previous logs that would share the same name. This is avoided
    in other configuration steps, but this best practice should be followed for good measure.
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'At the command prompt, run the following command:

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW

    log_truncate_on_rotation;"

    Expected result:

    on

    If the output does not match the expected result, this is a finding.'
  remediation: 'At the command prompt, run the following commands:

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "ALTER SYSTEM SET

    log_truncate_on_rotation TO ''on'';"

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "SELECT

    pg_reload_conf();"'
  checks:
  - type: sql
    command: 'SHOW

      log_truncate_on_rotation;'
    severity: medium
    info: 'At the command prompt, run the following command:

      # /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW

      log_truncate_on_rotation;"

      Expected result:

      on

      If the output does not match the expected result, this is a finding.'
- id: '1.5'
  title: VCPG-70-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The VMware Postgres database must protect log files from unauthorized access and modification. GROUP ID: V-256595
    RULE ID: SV-256595r887571'
  rationale: 'If audit data were to become compromised, competent forensic analysis and discovery of the true source of potentially
    malicious system activity would be difficult, if not impossible, to achieve. In addition, access to audit records provides
    information an attacker could use to their advantage. To ensure the veracity of audit data, the information system and/or
    the application must protect audit information from all unauthorized access. This includes read, write, copy, etc. Satisfies:
    SRG-APP-000118-DB-000059, SRG-APP-000119-DB-000060, SRG-APP000120-DB-000061'
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'At the command prompt, run the following command:

    # find /var/log/vmware/vpostgres/* -xdev -type f -a ''('' -not -perm 600 -o -

    not -user vpostgres -o -not -group vpgmongrp '')'' -exec ls -ld {} \;

    If any files are returned, this is a finding.'
  remediation: 'At the command prompt, run the following commands:

    # chmod 600 <file>

    # chown vpostgres:vpgmongrp <file>

    Note: Replace <file> with the file that has incorrect permissions.

    At the command prompt, run the following commands:

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "ALTER SYSTEM SET

    log_file_mode TO ''0600'';"

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "SELECT

    pg_reload_conf();"'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # find /var/log/vmware/vpostgres/* -xdev -type f -a ''('' -not -perm 600 -o -

      not -user vpostgres -o -not -group vpgmongrp '')'' -exec ls -ld {} \;

      If any files are returned, this is a finding.'
    severity: medium
- id: '1.6'
  title: VCPG-70-000006
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'All vCenter database (VCDB) tables must be owned by the "vc" user account. GROUP ID: V-256596 RULE ID: SV-256596r918971'
  rationale: Within the database, object ownership implies full privileges to the owned object, including the privilege to
    assign access to the owned objects to other subjects. Database functions and procedures can be coded using definer's rights.
    This allows anyone who uses the object to perform the actions if they are the owner. If not properly managed, this can
    lead to privileged actions being taken by unauthorized individuals. VCDB is configured out of the box to be owned by the
    "vc" Postgres user. This configuration must be verified and maintained.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'At the command prompt, run the following command:

    # /opt/vmware/vpostgres/current/bin/psql -d VCDB -U postgres -t -A -c "\dt;"

    | grep -v ''table|vc''

    If any tables are returned, this is a finding.

    Note: Upgrades may introduce new tables that are owned by the "postgres" user and

    can be updated to be owned by the "vc" user.'
  remediation: 'At the command prompt, run the following command:

    # /opt/vmware/vpostgres/current/bin/psql -d VCDB -U postgres -c "ALTER TABLE

    <tablename> OWNER TO vc;"

    Replace <tablename> with the name of the table discovered during the check.'
  checks:
  - type: command
    command: '| grep -v ''table|vc'''
    expected: ''
    severity: medium
    info: 'At the command prompt, run the following command:

      # /opt/vmware/vpostgres/current/bin/psql -d VCDB -U postgres -t -A -c "\dt;"

      | grep -v ''table|vc''

      If any tables are returned, this is a finding.

      Note: Upgrades may introduce new tables that are owned by the "postgres" user and

      can be updated to be owned by the "vc" user.'
- id: '1.7'
  title: VCPG-70-000007
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VMware Postgres must limit modify privileges to authorized accounts. GROUP ID: V-256597 RULE ID: SV-256597r887577'
  rationale: If VMware Postgres were to allow any user to make changes to database structure or logic, those changes might
    be implemented without undergoing the appropriate testing and approvals that are part of a robust change management process.
    Only qualified and authorized individuals must be allowed to obtain access to information system components to initiate
    changes, including upgrades and modifications. Unmanaged changes that occur to the database software libraries or configuration
    can lead to unauthorized or compromised installations.
  impact: ''
  references: []
  page_start: 23
  audit_raw: "At the command prompt, run the following command:\n# /opt/vmware/vpostgres/current/bin/psql -U postgres -c \"\
    \\du;\"|grep \"Create\"\nExpected result:\n postgres | Superuser, Create role, Create DB, Replication, Bypass RLS | {}\n\
    \ vc | Create DB | {}\n vlcmuser | Create DB | {}\nIf accounts other than \"postgres\",\"vc\", and \"vlcmuser\" have any\
    \ \"Create\" privileges, this\nis a finding."
  remediation: 'At the command prompt, run the following command:

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "REVOKE ALL

    PRIVILEGES FROM <user>;"

    Replace <user> with the account discovered during the check.'
  checks:
  - type: manual_review
    info: "At the command prompt, run the following command:\n# /opt/vmware/vpostgres/current/bin/psql -U postgres -c \"\\\
      du;\"|grep \"Create\"\nExpected result:\n postgres | Superuser, Create role, Create DB, Replication, Bypass RLS | {}\n\
      \ vc | Create DB | {}\n vlcmuser | Create DB | {}\nIf accounts other than \"postgres\",\"vc\", and \"vlcmuser\" have\
      \ any \"Create\" privileges, this\nis a finding."
    severity: medium
- id: '1.8'
  title: VCPG-70-000008
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VMware Postgres must be configured to use the correct port. GROUP ID: V-256598 RULE ID: SV-256598r887580'
  rationale: 'To prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized tunneling
    (i.e., embedding of data types within data types), organizations must disable or restrict unused or unnecessary physical
    and logical ports, protocols, and services on information systems. Applications are capable of providing a wide variety
    of functions and services. Some of the functions and services provided by default may not be necessary to support essential
    organizational operations. Additionally, it is sometimes convenient to provide multiple services from a single component
    (e.g., email and web services); however, doing so increases risk over limiting the services provided by any one component.
    To support the requirements and principles of least functionality, the application must support the organizational requirements
    providing only essential capabilities and limiting the use of ports, protocols, and/or services to only those required,
    authorized, and approved to conduct official business or to address authorized quality of life issues. Database Management
    Systems using ports, protocols, and services deemed unsafe are open to attack through those ports, protocols, and services.
    This can allow unauthorized access to the database and through the database to other components of the information system.
    Satisfies: SRG-APP-000142-DB-000094, SRG-APP-000383-DB-000364'
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'At the command prompt, run the following command:

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW port;"

    Expected result:

    5432

    If the output does not match the expected result, this is a finding.'
  remediation: 'At the command prompt, run the following commands:

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "ALTER SYSTEM SET

    port TO ''5432'';"

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "SELECT

    pg_reload_conf();"'
  checks:
  - type: sql
    command: SHOW port;
    severity: medium
    info: 'At the command prompt, run the following command:

      # /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW port;"

      Expected result:

      5432

      If the output does not match the expected result, this is a finding.'
- id: '1.9'
  title: VCPG-70-000009
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'VMware Postgres must require authentication on all connections. GROUP ID: V-256599 RULE ID: SV-256599r887583'
  rationale: To ensure accountability and prevent unauthenticated access, organizational users must be identified and authenticated
    to prevent potential misuse and compromise of the system. VMware Postgres client authentication configuration is configured
    in "pg_hba.conf". In this file are a number of lines that specify who can connect to the service, from where, and using
    what authentication methods. In Postgres there is a concept of a trusted connection where a specific network mask can
    connect without any authentication to any account. This connection is termed "trust" in "pg_hba.conf", and it must not
    be present. Out of the box, VMware Postgres requires standard password authentication for all connections.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'At the command prompt, run the following command:

    # grep -v "^#" /storage/db/vpostgres/pg_hba.conf|grep -z --color=always

    "trust"

    If any lines are returned, this is a finding.'
  remediation: 'Navigate to and open /storage/db/pgdata/pg_hba.conf.

    Find and remove the line that has a method of "trust" in the far-right column.

    A correct, typical line will look like the following:

    # TYPE DATABASE USER ADDRESS METHOD

    host all all 127.0.0.1/32 md5'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep -v "^#" /storage/db/vpostgres/pg_hba.conf|grep -z --color=always

      "trust"

      If any lines are returned, this is a finding.'
    severity: medium
- id: '1.10'
  title: VCPG-70-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vPostgres database must use "md5" for authentication. GROUP ID: V-256600 RULE ID: SV-256600r887586'
  rationale: The DOD standard for authentication is DOD-approved public key infrastructure (PKI) certificates. Authentication
    based on user ID and password may be used only when it is not possible to employ a PKI certificate, and requires authorizing
    official approval. In such cases, database passwords stored in clear text, using reversible encryption or unsalted hashes,
    would be vulnerable to unauthorized disclosure. Database passwords must always be in the form of one-way, salted hashes
    when stored internally or externally to the database management system (DBMS).
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'At the command prompt, run the following command:

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW

    password_encryption;"

    Expected result:

    md5

    If the output does not match the expected result, this is a finding.'
  remediation: 'At the command prompt, run the following commands:

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "ALTER SYSTEM SET

    password_encryption TO ''md5'';"

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "SELECT

    pg_reload_conf();"'
  checks:
  - type: sql
    command: 'SHOW

      password_encryption;'
    severity: medium
    info: 'At the command prompt, run the following command:

      # /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW

      password_encryption;"

      Expected result:

      md5

      If the output does not match the expected result, this is a finding.'
- id: '1.11'
  title: VCPG-70-000011
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'VMware Postgres must be configured to use Transport Layer Security (TLS). GROUP ID: V-256601 RULE ID: SV-256601r887589'
  rationale: 'The DOD standard for authentication is DOD-approved public key infrastructure (PKI) certificates. Authentication
    based on user ID and password may be used only when it is not possible to employ a PKI certificate. In such cases, passwords,
    must be protected at all times, and encryption is the standard method for protecting passwords during transmission. VMware
    Postgres is configured out of the box to require TLS connections with remote clients. As an embedded database and available
    only on "localhost" for standalone vCenter Server Appliances (VCSAs), TLS connections are used only in high-availability
    deployments for connections between a primary and a standby. This configuration must be verified and maintained. Satisfies:
    SRG-APP-000172-DB-000075, SRG-APP-000442-DB-000379'
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'At the command prompt, run the following command:

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW ssl;"

    Expected result:

    on

    If the output does not match the expected result, this is a finding.'
  remediation: 'At the command prompt, run the following commands:

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "ALTER SYSTEM SET ssl

    TO ''on'';"

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "SELECT

    pg_reload_conf();"'
  checks:
  - type: sql
    command: SHOW ssl;
    severity: medium
    info: 'At the command prompt, run the following command:

      # /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW ssl;"

      Expected result:

      on

      If the output does not match the expected result, this is a finding.'
- id: '1.12'
  title: VCPG-70-000012
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'VMware Postgres must enforce authorized access to all public key infrastructure (PKI) private keys. GROUP
    ID: V-256602 RULE ID: SV-256602r887592'
  rationale: The DOD standard for authentication is DOD-approved PKI certificates. PKI certificatebased authentication is
    performed by requiring the certificate holder to cryptographically prove possession of the corresponding private key.
    If a private key is stolen, an attacker can use it to impersonate the certificate holder. In cases where the database
    management system (DBMS)-stored private keys are used to authenticate the DBMS to the system's clients, loss of the corresponding
    private keys would allow an attacker to successfully perform undetected man-in-the-middle attacks against the DBMS system
    and its clients. All access to the private key(s) of the DBMS must be restricted to authorized and authenticated users.
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'At the command prompt, run the following command:

    # stat -c "%a:%U:%G" /storage/db/vpostgres_ssl/server.key

    Expected result:

    600:vpostgres:vpgmongrp

    If the output does not match the expected result, this is a finding.'
  remediation: 'At the command prompt, run the following commands:

    # chmod 600 /storage/db/vpostgres_ssl/server.key

    # chown vpostgres:vpgmongrp /storage/db/vpostgres_ssl/server.key'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # stat -c "%a:%U:%G" /storage/db/vpostgres_ssl/server.key

      Expected result:

      600:vpostgres:vpgmongrp

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.13'
  title: VCPG-70-000013
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'VMware Postgres must use FIPS 140-2 approved Transport Layer Security (TLS) ciphers. GROUP ID: V-256603 RULE
    ID: SV-256603r887595'
  rationale: 'Use of weak or unvalidated cryptographic algorithms undermines the purposes of using encryption and digital
    signatures to protect data. Weak algorithms can be broken, and unvalidated cryptographic modules may not implement algorithms
    correctly. Unapproved cryptographic modules or algorithms should not be relied on for authentication, confidentiality,
    or integrity. Weak cryptography could allow an attacker to gain access to and modify data stored in the database as well
    as the administration settings of the database management system (DBMS). VMware Postgres does not currently implement
    FIPS-validated cryptographic modules. This is planned but, in the interim, Postgres can be configured with strong ciphers
    from the FIPS-140 approved suite. Additionally, as an embedded database available only on "localhost" for a standalone
    vCenter Server Appliance, TLS connections are used only in high-availability deployments for connections between a primary
    and a standby. Satisfies: SRG-APP-000179-DB-000114, SRG-APP-000514-DB-000381, SRG-APP000514-DB-000382, SRG-APP-000514-DB-000383'
  impact: ''
  references: []
  page_start: 35
  audit_raw: 'At the command prompt, run the following command:

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW

    ssl_ciphers;"

    Expected result:

    !aNULL:kECDH+AES:ECDH+AES:RSA+AES:@STRENGTH

    If the output does not match the expected result, this is a finding.'
  remediation: 'At the command prompt, run the following commands:

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "ALTER SYSTEM SET

    ssl_ciphers TO ''!aNULL:kECDH+AES:ECDH+AES:RSA+AES:@STRENGTH'';"

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "SELECT

    pg_reload_conf();"'
  checks:
  - type: sql
    command: 'SHOW

      ssl_ciphers;'
    severity: medium
    info: 'At the command prompt, run the following command:

      # /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW

      ssl_ciphers;"

      Expected result:

      !aNULL:kECDH+AES:ECDH+AES:RSA+AES:@STRENGTH

      If the output does not match the expected result, this is a finding.'
- id: '1.14'
  title: VCPG-70-000014
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VMware Postgres must write log entries to disk prior to returning operation success or failure. GROUP ID:
    V-256604 RULE ID: SV-256604r887598'
  rationale: Failure to a known secure state helps prevent a loss of confidentiality, integrity, or availability in the event
    of a failure of the information system or a component of the system. Preserving system state information helps to facilitate
    system restart and return to the operational mode of the organization with less disruption of mission/business processes.
    Aggregating log writes saves on performance but leaves a window for log data loss. The logging system inside VMware Postgres
    is capable of writing logs to disk fully and completely before the associated operation is returned to the client. This
    ensures database activity is always captured, even in the event of a system crash during or immediately after a given
    operation.
  impact: ''
  references: []
  page_start: 37
  audit_raw: 'At the command prompt, run the following command:

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SELECT

    name,setting FROM pg_settings WHERE name IN

    (''fsync'',''full_page_writes'',''synchronous_commit'');"

    Expected result:

    fsync | on

    full_page_writes | on

    synchronous_commit | on

    If the output does not match the expected result, this is a finding.'
  remediation: 'At the command prompt, run the following commands for each setting returned as "off"

    in the check:

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "ALTER SYSTEM SET

    <name> TO ''on'';"

    # /opt/vmware/vpostgres/current/bin/psql -U postgres -c "SELECT

    pg_reload_conf();"

    Note: Substitute with the incorrectly set parameter (fsync, full_page_writes,

    synchronous_commit).'
  checks:
  - type: sql
    command: 'SELECT

      name,setting FROM pg_settings WHERE name IN'
    severity: medium
    info: 'At the command prompt, run the following command:

      # /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SELECT

      name,setting FROM pg_settings WHERE name IN

      (''fsync'',''full_page_writes'',''synchronous_commit'');"

      Expected result:

      fsync | on

