    severity: medium
- id: '1.76'
  title: JUNI-RT-000730
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper PE router must be configured to ignore or block all packets with any IP options. GROUP ID: V-217078
    RULE ID: SV-217078r604135'
  rationale: Packets with IP options are not fast switched and therefore must be punted to the router processor. Hackers who
    initiate denial-of-service (DoS) attacks on routers commonly send large streams of packets with IP options. Dropping the
    packets with IP options reduces the load of IP options packets on the router. The end result is a reduction in the effects
    of the DoS attack on the router and on downstream routers.
  impact: ''
  references: []
  page_start: 229
  audit_raw: "Review the router configuration to determine if it will block all packets with IP options.\nfirewall {\n family\
    \ inet {\n filter INGRESS_FILTER {\n term BLOCK_TO_CORE {\n from {\n destination-address {\n x.x.x.x/8;\n }\n }\n then\
    \ {\n log;\n discard;\n }\n }\n term BLOCK_IP_OPTIONS {\n from {\n ip-options any;\n }\n then {\n discard;\n }\n }\n term\
    \ ALLOW_TRANSIT_TRAFFIC {\n then accept;\n }\n }\n }\nIf the router is not configured to drop all packets with IP options,\
    \ this is a finding."
  remediation: 'Configure the router to drop all packets with IP options.

    [edit firewall family inet filter INGRESS_FILTER]

    set term BLOCK_IP_OPTIONS from ip-options any

    set term BLOCK_IP_OPTIONS then discard

    insert term BLOCK_IP_OPTIONS before term ALLOW_TRANSIT_TRAFFIC'
  checks:
