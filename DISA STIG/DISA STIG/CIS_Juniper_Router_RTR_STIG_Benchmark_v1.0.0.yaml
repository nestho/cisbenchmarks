  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router providing connectivity to the NOC must be configured to forward all in-band management
    traffic via an IPsec tunnel. GROUP ID: V-217050 RULE ID: SV-217050r604135'
  rationale: When the production network is managed in-band, the management network could be housed at a NOC that is located
    remotely at single or multiple interconnected sites. NOC interconnectivity, as well as connectivity between the NOC and
    the managed network, must be enabled using IPsec tunnels to provide the separation and integrity of the managed traffic.
  impact: ''
  references: []
  page_start: 153
  audit_raw: "This requirement is not applicable for the DoDIN Backbone.\nVerify that all traffic from the managed network\
    \ to the management network and viceversa is secured via IPsec tunnel.\nReview the security association within the IPsec\
    \ configuration to be used for\nencapsulating the management traffic and verify that it is in tunnel mode. Also note the\n\
    security association to be used.\nsecurity {\n ipsec {\n proposal IPSEC_PHASE2_PROPOSAL {\n protocol esp;\n authentication-algorithm\
    \ hmac-sha1-96;\n encryption-algorithm aes-128-cbc;\n }\n policy IPSEC_POLICY {\n perfect-forward-secrecy {\n keys group14;\n\
    \ }\n proposals IPSEC_PHASE2_PROPOSAL;\n }\n security-association IPSEC-SA_XYZ {\n description \"For XYZ\";\n mode transport;\n\
    \ manual {\n direction bidirectional {\n protocol ah;\n spi 256;\n authentication {\n algorithm hmac-sha1-96;\n key ascii-text\
    \ \"$8$oPJjH.P5F69mSHqPQn6u0RhSreWdsZGi8XYoZDmP\"; ## SECRET-DATA\n }\n }\n }\n }\n security-association IPSEC_SA_MGMT\
    \ {\n description \"IPsec Tunnel for Mgmt Traffic\";\n mode tunnel;\n dynamic {\n ipsec-policy IPSEC_POLICY;\n }\n }\n\
    \ }\n ike {\n proposal IKE_PHASE1_PROPOSAL {\n authentication-method pre-shared-keys;\n dh-group group14;\n authentication-algorithm\
    \ sha-256;\n encryption-algorithm aes-128-cbc;\n }\n policy 10.1.25.2 {\n mode main;\n proposals IKE_PHASE1_PROPOSAL;\n\
    \ pre-shared-key ascii-text \"$8$J4UDkCA01IcHqEy\"; ## SECRET-DATA\n }\n }\nVerify there is a filter to direct the management\
    \ traffic to the IPsec tunnel by verifying\nthe name of the IPsec SA referenced in the then statement as shown in the\
    \ example\nbelow.\nfirewall {\n family inet {\n …\n …\n …\n filter MGMT_TRAFFIC {\n term ALLOW_SNMP {\n from {\n protocol\
    \ udp;\n port [ snmp snmptrap ];\n }\n then ipsec-sa IPSEC_SA_MGMT;\n }\n term ALLOW_TACACS {\n from {\n protocol tcp;\n\
    \ port tacacs;\n }\n then ipsec-sa IPSEC_SA_MGMT;\n }\n term ALLOW_NETFLOW {\n from {\n protocol udp;\n port [ 2055 9995\
    \ 9996 ];\n }\n then ipsec-sa IPSEC_SA_MGMT;\n }\n term OTHER {\n then accept;\n }\n }\n }\nIf the management traffic\
    \ is not secured via IPsec tunnel, this is a finding."
  remediation: 'This requirement is not applicable for the DoDIN Backbone.

    Ensure that all traffic from the managed network to the management network is secured

    via IPsec tunnel as shown in the configuration examples below.

    Configure an IPsec tunnel to be used to transport the management traffic.

    [edit security]

    set ike proposal IKE_PHASE1_PROPOSAL authentication-method pre-shared-keys

    set ike proposal IKE_PHASE1_PROPOSAL authentication-algorithm sha-256

    set ike proposal IKE_PHASE1_PROPOSAL dh-group group14

    set ike proposal IKE_PHASE1_PROPOSAL encryption-algorithm aes-128-cbc

    set ike policy 10.1.25.2 proposals IKE_PHASE1_PROPOSAL

    set ike policy 10.1.25.2 mode main

    set ike policy 10.1.25.2 pre-shared-key ascii-text xxxxxxxxx

    set ipsec proposal IPSEC_PHASE2_PROPOSAL protocol esp

    set ipsec proposal IPSEC_PHASE2_PROPOSAL authentication-algorithm hmac-sha196

    set ipsec proposal IPSEC_PHASE2_PROPOSAL encryption-algorithm aes-128-cbc

    set policy IPSEC_POLICY perfect-forward-secrecy keys group14

    set policy IPSEC_POLICY proposals xxxxx

    set ipsec security-association IPSEC_SA_MGMT mode tunnel

    set ipsec security-association IPSEC_SA_MGMT dynamic ipsec-policy

    IPSEC_POLICY

    Configure a filter that will select which traffic to be forwarded via the IPsec tunnel by

    specifying the security association bound to the tunnel.

    [edit firewall family inet]

    set filter MGMT_TRAFFIC term ALLOW_SNMP from protocol udp port [snmp

    snmptrap]

    set filter MGMT_TRAFFIC term ALLOW_SNMP then ipsec-sa IPSEC_SA_MGMT

    set filter MGMT_TRAFFIC term ALLOW_TACACS from protocol tcp port tacacs

    set filter MGMT_TRAFFIC term ALLOW_TACACS then ipsec-sa IPSEC_SA_MGMT

    set filter MGMT_TRAFFIC term ALLOW_NETFLOW from protocol udp port [2055 9995

    9996]

    set filter MGMT_TRAFFIC term ALLOW_NETFLOW then ipsec-sa IPSEC_SA_MGMT

    set filter MGMT_TRAFFIC term OTHER then accept'
