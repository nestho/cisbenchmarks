      \ not been configured, this is a finding."
    severity: medium
- id: '1.74'
  title: JUNI-RT-000710
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper PE router must be configured to block any traffic that is destined to IP core infrastructure.
    GROUP ID: V-217076 RULE ID: SV-217076r604135'
  rationale: IP/MPLS networks providing VPN and transit services must provide, at the least, the same level of protection
    against denial-of-service (DoS) attacks and intrusions as Layer 2 networks. Although the IP core network elements are
    hidden, security should never rely entirely on obscurity. IP addresses can be guessed. Core network elements must not
    be accessible from any external host. Protecting the core from any attack is vital for the integrity and privacy of customer
    traffic as well as the availability of transit services. A compromise of the IP core can result in an outage or, at a
    minimum, non-optimized forwarding of customer traffic. Protecting the core from an outside attack also prevents attackers
    from using the core to attack any customer. Hence, it is imperative that all routers at the edge deny traffic destined
    to any address belonging to the IP core infrastructure.
  impact: ''
  references: []
  page_start: 224
  audit_raw: "Review the router configuration to verify that an ingress filter is applied to all CE-facing\ninterfaces.\n\
    interfaces {\n ge-0/1/0 {\n description \"link to Customer 2\";\n unit 0 {\n family inet {\n filter {\n input INGRESS_FILTER;\n\
    \ }\n address x.x.x.x/30;\n }\n }\n }\nVerify that the ingress filter discards and logs packets destined to the IP core\
    \ address\nspace.\nfirewall {\n family inet {\n filter INGRESS_FILTER {\n term BLOCK_TO_CORE {\n from {\n destination-address\
    \ {\n x.x.x.x/8;\n }\n }\n then {\n log;\n discard;\n }\n }\n term ALLOW_TRANSIT_TRAFFIC {\n then accept;\n }\n }\n }\n\
    If the PE router is not configured to block any traffic with a destination address assigned\nto the IP core infrastructure,\
    \ this is a finding.\nNote: Internet Control Message Protocol (ICMP) echo requests and traceroutes will be\nallowed to\
    \ the edge from external adjacent neighbors."
  remediation: 'Configure protection for the IP core to be implemented at the edges by blocking any

    traffic with a destination address assigned to the IP core infrastructure.

    Configure an ingress filter to discard and log packets destined to the IP core address

    space.

    [edit firewall family inet]

    set filter INGRESS_FILTER term BLOCK_TO_CORE from destination-address

    x.x.x.x/8

    set filter INGRESS_FILTER term BLOCK_TO_CORE then log discard

    set filter INGRESS_FILTER term ALLOW_TRANSIT_TRAFFIC then accept

    Apply the filter inbound to all CE-facing interfaces.

    [edit interfaces ge-0/1/0 unit 0]

    set family inet filter input INGRESS_FILTER'
  checks:
  - type: manual_review
    info: "Review the router configuration to verify that an ingress filter is applied to all CE-facing\ninterfaces.\ninterfaces\
