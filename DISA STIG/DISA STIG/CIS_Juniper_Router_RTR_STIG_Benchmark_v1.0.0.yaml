- id: '1.73'
  title: JUNI-RT-000700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper PE router must be configured to limit the number of MAC addresses it can learn for each Virtual
    Private LAN Services (VPLS) bridge domain. GROUP ID: V-217075 RULE ID: SV-217075r604135'
  rationale: VPLS defines an architecture that delivers Ethernet multipoint services over an MPLS network. Customer Layer
    2 frames are forwarded across the MPLS core via pseudowires using IEEE 802.1q Ethernet bridging principles. A pseudowire
    is a virtual bidirectional connection between two attachment circuits (virtual connections between PE and CE routers).
    A pseudowire contains two unidirectional label-switched paths (LSP). Each MAC forwarding table instance is interconnected
    using domain-specific LSPs, thereby maintaining privacy and logical separation between each VPLS domain. When a frame
    arrives on a bridge port (pseudowire or attachment circuit) and the source MAC address is unknown to the receiving PE
    router, the source MAC address is associated with the pseudowire or attachment circuit and the forwarding table is updated
    accordingly. Frames are forwarded to the appropriate pseudowire or attachment circuit according to the forwarding table
    entry for the destination MAC address. Ethernet frames sent to broadcast and unknown destination addresses must be flooded
    out to all interfaces for the bridge domain; hence, a PE router must replicate packets across both attachment circuits
    and pseudowires. A malicious attacker residing in a customer network could launch a source MAC address spoofing attack
    by flooding packets to a valid unicast destination, each with a different MAC source address. The PE router receiving
    this traffic would try to learn every new MAC address and would quickly run out of space for the VFI forwarding table.
    Older, valid MAC addresses would be removed from the table, and traffic sent to them would have to be flooded until the
    storm threshold limit is reached. Hence, it is essential that a limit is established to control the number of MAC addresses
    that will be learned and recorded into the forwarding table for each bridge domain.
  impact: ''
  references: []
  page_start: 222
  audit_raw: "Review the PE router configuration to determine if a MAC address limit has been set for\neach VPLS bridge domain.\n\
    routing-instances {\n VPLS_CUST2 {\n instance-type vpls;\n interface ge-0/1/0.0;\n route-distinguisher 22:22;\n vrf-target\
    \ target:22:22;\n protocols {\n vpls {\n site-range 9;\n mac-table-size {\n nnnn;\n }\n no-tunnel-services;\n site R8\
    \ {\n site-identifier 8;\n interface ge-0/1/0.0;\n }\n vpls-id 102;\n neighbor 8.8.8.8;\n }\n }\n }\n}\nIf a limit has\
    \ not been configured, this is a finding."
  remediation: 'Configure a MAC address learning limit for each VPLS bridge domain.

    [edit routing-instances VPLS_CUST2 protocols vpls]

    set mac-table-size nnnn'
  checks:
  - type: manual_review
    info: "Review the PE router configuration to determine if a MAC address limit has been set for\neach VPLS bridge domain.\n\
      routing-instances {\n VPLS_CUST2 {\n instance-type vpls;\n interface ge-0/1/0.0;\n route-distinguisher 22:22;\n vrf-target\
