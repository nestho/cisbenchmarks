    \ {\n any any;\n }\n }\n}\nIf the router is not configured to produce audit records containing information to\nestablish\
    \ to establish where the events occurred, this is a finding."
  remediation: 'Configure the router to log events containing information to establish where the events

    occurred as shown in the example below.

