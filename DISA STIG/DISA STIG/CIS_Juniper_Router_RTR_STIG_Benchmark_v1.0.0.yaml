      0x2F, and 0x31 – 0xFF.

      The following example will block any inbound IPv6 packet containing either a Hop-byHo'
    severity: medium
- id: '1.42'
  title: JUNI-RT-000390
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper out-of-band management (OOBM) gateway router must be configured to transport management traffic
    to the Network Operations Center (NOC) via dedicated circuit, MPLS/VPN service, or IPsec tunnel. GROUP ID: V-217044 RULE
    ID: SV-217044r604135'
  rationale: Using dedicated paths, the OOBM backbone connects the OOBM gateway routers located at the edge of the managed
    network and at the NOC. Dedicated links can be deployed using provisioned circuits or MPLS Layer 2 and Layer 3 VPN services
    or implementing a secured path with gateway-to-gateway IPsec tunnels. The tunnel mode ensures that the management traffic
    will be logically separated from any other traffic traversing the same path.
  impact: ''
  references: []
  page_start: 130
  audit_raw: "This requirement is not applicable for the DoDIN Backbone.\nReview the network topology diagram to determine\
    \ connectivity between the managed\nnetwork and the NOC. Review the OOBM gateway router configuration to validate the\n\
    path and interface that the management traffic traverses. If an IPsec tunnel is used to\ntransport the management traffic\
    \ between the NOC and the managed network, review\nthe configuration following the steps below.\nReview the security association\
    \ within the IPsec configuration to be used for\nencapsulating the management traffic and verify that it is in tunnel\
    \ mode. Also note the\nsecurity association to be used.\nsecurity {\n ipsec {\n proposal IPSEC_PHASE2_PROPOSAL {\n protocol\
    \ esp;\n authentication-algorithm hmac-sha1-96;\n encryption-algorithm aes-128-cbc;\n }\n policy IPSEC_POLICY {\n perfect-forward-secrecy\
    \ {\n keys group14;\n }\n proposals IPSEC_PHASE2_PROPOSAL;\n }\n security-association IPSEC-SA_XYZ {\n description \"\
    For XYZ\";\n mode transport;\n manual {\n direction bidirectional {\n protocol ah;\n spi 256;\n authentication {\n algorithm\
    \ hmac-sha1-96;\n key ascii-text \"$8$oPJjH.P5F69mSHqPQn6u0RhSreWdsZGi8XYoZDmP\"; ## SECRET-DATA\n }\n }\n }\n }\n security-association\
    \ IPSEC_SA_MGMT {\n description \"IPsec Tunnel for Mgmt Traffic\";\n mode tunnel;\n dynamic {\n ipsec-policy IPSEC_POLICY;\n\
    \ }\n }\n }\n ike {\n proposal IKE_PHASE1_PROPOSAL {\n authentication-method pre-shared-keys;\n dh-group group14;\n authentication-algorithm\
    \ sha-256;\n encryption-algorithm aes-128-cbc;\n }\n policy 10.1.25.2 {\n mode main;\n proposals IKE_PHASE1_PROPOSAL;\n\
    \ pre-shared-key ascii-text \"$8$J4UDkCA01IcHqEy\"; ## SECRET-DATA\n }\n }\nVerify there is a filter to direct the management\
    \ traffic to the IPsec tunnel by verifying\nthe name of the IPsec SA referenced in the then statement as shown in the\
    \ example\nbelow.\nfirewall {\n family inet {\n …\n …\n …\n filter MGMT_TRAFFIC {\n term ALLOW_SNMP {\n from {\n protocol\
    \ udp;\n port [ snmp snmptrap ];\n }\n then ipsec-sa IPSEC_SA_MGMT;\n }\n term ALLOW_TACACS {\n from {\n protocol tcp;\n\
    \ port tacacs;\n }\n then ipsec-sa IPSEC_SA_MGMT;\n }\n term ALLOW_NETFLOW {\n from {\n protocol udp;\n port [ 2055 9995\
    \ 9996 ];\n }\n then ipsec-sa IPSEC_SA_MGMT;\n }\n term OTHER {\n then accept;\n }\n }\n }\nIf management traffic is not\
    \ transported between the managed network and the NOC\nvia dedicated circuit, MPLS/VPN service, or IPsec tunnel, this\
    \ is a finding."
  remediation: 'This requirement is not applicable for the DoDIN Backbone.

    Ensure that a dedicated circuit, MPLS/VPN service, or IPsec tunnel is deployed to

    transport management traffic between the managed network and the NOC. If an IPsec

    tunnel is to be used, the steps below can be used as a guideline.

    Configure an IPsec tunnel using commands similar to the example below.

    [edit security]

    set ike proposal IKE_PHASE1_PROPOSAL authentication-method pre-shared-keys

    set ike proposal IKE_PHASE1_PROPOSAL authentication-algorithm sha-256

    set ike proposal IKE_PHASE1_PROPOSAL dh-group group14

    set ike proposal IKE_PHASE1_PROPOSAL encryption-algorithm aes-128-cbc

    set ike policy 10.1.25.2 proposals IKE_PHASE1_PROPOSAL

    set ike policy 10.1.25.2 mode main

    set ike policy 10.1.25.2 pre-shared-key ascii-text xxxxxxxxx

    set ipsec proposal IPSEC_PHASE2_PROPOSAL protocol esp

    set ipsec proposal IPSEC_PHASE2_PROPOSAL authentication-algorithm hmac-sha196

    set ipsec proposal IPSEC_PHASE2_PROPOSAL encryption-algorithm aes-128-cbc

    set ipsec security-association IPSEC_SA_MGMT mode tunnel

    set ipsec security-association IPSEC_SA_MGMT dynamic ipsec-policy

    IPSEC_POLICY

    Configure a filter to define the management traffic to be forwarded into the IPsec tunnel.

    [edit firewall family inet]

    set filter MGMT_TRAFFIC term ALLOW_SNMP from protocol udp port [snmp

    snmptrap]

    set filter MGMT_TRAFFIC term ALLOW_SNMP then ipsec-sa IPSEC_SA_MGMT

    set filter MGMT_TRAFFIC term ALLOW_TACACS from protocol tcp port tacacs

    set filter MGMT_TRAFFIC term ALLOW_TACACS then ipsec-sa IPSEC_SA_MGMT

    set filter MGMT_TRAFFIC term ALLOW_NETFLOW from protocol udp port [2055 9995

    9996]

    set filter MGMT_TRAFFIC term ALLOW_NETFLOW then ipsec-sa IPSEC_SA_MGMT

    set filter MGMT_TRAFFIC term OTHER then accept'
