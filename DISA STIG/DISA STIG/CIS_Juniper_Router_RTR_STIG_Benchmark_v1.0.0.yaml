      \ ge-0/0/0.0 {\n authentication {\n simple-password \"$8$NHVb2mPQ3nCYg/t\"; ## SECRET-DATA\n }\n }\n interface ge-0/1/0.0\
      \ {\n authentication {\n simple-password \"$8$Lgb7"
    severity: medium
- id: '1.3'
  title: JUNI-RT-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to use keys with a duration not exceeding 180 days for authenticating
    routing protocol messages. GROUP ID: V-217013 RULE ID: SV-217013r604135'
  rationale: If the keys used for routing protocol authentication are guessed, the malicious user could create havoc within
    the network by advertising incorrect routes and redirecting traffic. Some routing protocols allow the use of key chains
    for authentication. A key chain is a set of keys that is used in succession, with each having a lifetime of no more than
    180 days. Changing the keys frequently reduces the risk of them eventually being guessed. Keys cannot be used during time
    periods for which they are not activated. If a time period occurs during which no key is activated, neighbor authentication
    cannot occur, and therefore routing updates will fail. Therefore, ensure that for a given key chain, key activation times
    overlap to avoid any period of time during which no key is activated.
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'This requirement is not applicable for the DoDIN Backbone.

    Review the start times for each key within the configured key chains used for routing

    protocol authentication as shown in the examples below.

    security {

    …

    …

    …

    authentication-key-chains {

    key-chain BGP_KEY {

    key 1 {

    secret "$8$PTQnhclvMX3687"; ## SECRET-DATA

    start-time "2018-5-1.12:00:00 +0000";

    }

    key 2 {

    secret "$8$iq.5OBESyKfTlM"; ## SECRET-DATA

    start-time "2018-9-1.12:00:00 +0000";

    }

    key 3 {

    secret "$8$ZADjqAtOIRSk.hr"; ## SECRET-DATA

    start-time "2019-1-1.12:00:00 +0000";

    }

    }

    }

    }

    ospf {

    area 0.0.0.0 {

    interface ge-0/0/0.0 {

    authentication {

    md5 1 key "$8$P5T36/t0ORDi.5F3tp" start-time "2018-1-1.01:01:00 +0000"; ##

    SECRET-DATA

    md5 2 key "$8$S.oevLbwg4aUvWxn" start-time "2018-4-1.01:01:00 +0000"; ##

    SECRET-DATA

    md5 3 key "$8$SInrWxbO1hcYg4ajH" start-time "2018-8-1.01:01:00 +0000"; ##

    SECRET-DATA

    }

    }

    }

    }

    If each key used for routing protocol authentication does not have a lifetime

    of no more than 180 days, this is a finding.'
  remediation: "This requirement is not applicable for the DoDIN Backbone.\nConfigure each key used for routing protocol authentication\
    \ to have a lifetime of no\nmore than 180 days as shown in the example below.\n[edit security authentication-key-chains]\n\
    set key-chain BGP_KEY key 1 start-time 2018-05-01.12:00 secret xxxxxxxxxxxxx\nset key-chain BGP_KEY key 2 start-time 2018-09-01.12:00\
    \ secret xxxxxxxxxxxxx\nset key-chain BGP_KEY key 3 start-time 2019-01-01.12:00 secret xxxxxxxxxxxxx\n }\n[edit protocols\
    \ ospf area 0.0.0.0 interface ge-0/0/0.0]\nset authentication md5 1 key xxxxxxxx start-time 2018-01-01.01:01\nset authentication\
    \ md5 2 key xxxxxxxx start-time 2018-04-01.01:01\nset authentication md5 3 key xxxxxxxx start-time 2018-08-01.01:01\n\
    Note: Currently Junos does not support key chains for RIP."
  checks:
  - type: manual_review
    info: 'This requirement is not applicable for the DoDIN Backbone.

      Review the start times for each key within the configured key chains used for routing

      protocol authentication as shown in the examples below.

      security {

      …

