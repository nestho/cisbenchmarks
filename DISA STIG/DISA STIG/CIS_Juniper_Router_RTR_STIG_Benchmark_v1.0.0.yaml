    \ from {\n protocol tcp;\n port tacacs;\n }\n then {\n syslog;\n discard;\n }\n }\n term BLOCK_SNMP {\n from {\n protocol\
    \ udp;\n port [ snmp snmptrap ];\n }\n then {\n syslog;\n discard;\n }\n }\n term BLOCK_NETFLOW {\n from {\n protocol\
    \ udp;\n port [ 2055 9995 9996 ];\n }\n }\n term ALLOW_OTHER {\n then accept;\n }\n }\n }\nIf management traffic is not\
    \ blocked at the perimeter, this is a finding."
  remediation: 'This requirement is not applicable for the DoDIN Backbone.

