- id: '1.11'
  title: JUNI-RT-000150
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to have Gratuitous ARP disabled on all external interfaces. GROUP ID:
    V-217021 RULE ID: SV-217021r604135'
  rationale: A gratuitous ARP is an ARP broadcast in which the source and destination MAC addresses are the same. It is used
    to inform the network about a host IP address. A spoofed gratuitous ARP message can cause network mapping information
    to be stored incorrectly, causing network malfunction.
  impact: ''
  references: []
  page_start: 53
  audit_raw: 'Review the configuration to determine if gratuitous ARP is disabled on all external

    interfaces. The following command should not be set to any interface: gratuitous-arpreply

    If gratuitous ARP is enabled on any external interface, this is a finding.'
  remediation: 'Disable gratuitous ARP on all external interfaces using the following command.

    [edit interfaces ge-1/1/0 ]

    delete gratuitous-arp-reply'
  checks:
  - type: manual_review
    info: 'Review the configuration to determine if gratuitous ARP is disabled on all external

      interfaces. The following command should not be set to any interface: gratuitous-arpreply

      If gratuitous ARP is enabled on any external interface, this is a finding.'
    severity: medium
- id: '1.12'
  title: JUNI-RT-000170
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to have Internet Control Message Protocol (ICMP) unreachable messages
    disabled on all external interfaces. GROUP ID: V-217022 RULE ID: SV-217022r604135'
  rationale: The ICMP supports IP traffic by relaying information about paths, routes, and network conditions. Routers automatically
    send ICMP messages under a wide variety of conditions. Host unreachable ICMP messages are commonly used by attackers for
    network mapping and diagnosis.
  impact: ''
  references: []
  page_start: 54
  audit_raw: "Review the firewall hierarchy configuration to verify that all packets that are not\npermitted are silently\
    \ dropped using the discard parameter as shown in the\nconfiguration example below.\nfirewall {\n family inet {\n …\n\
    \ …\n …\n }\n filter FILTER_INBOUND {\n term ALLOW_XYZ {\n from {\n protocol xyz;\n }\n then accept;\n }\n …\n …\n …\n\
    \ }\n term DENY_BY_DEFAULT {\n then {\n log;\n discard;\n }\n }\n }\n }\nIf ICMP unreachable notifications are sent for\
    \ packets that are dropped, this is a finding."
  remediation: '[edit firewall family inet]

    set filter FILTER_INBOUND term DENY_BY_DEFAULT then log discard'
  checks:
  - type: manual_review
    info: "Review the firewall hierarchy configuration to verify that all packets that are not\npermitted are silently dropped\
      \ using the discard parameter as shown in the\nconfiguration example below.\nfirewall {\n family inet {\n …\n …\n …\n\
      \ }\n filter FILTER_INBOUND {\n term ALLOW_XYZ {\n from {\n protocol xyz;\n }\n then accept;\n }\n …\n …\n …\n }\n term\
      \ DENY_BY_DEFAULT {\n then {\n log;\n discard;\n }\n }\n }\n }\nIf ICMP unreachable notifications are sent for packets\
      \ that are dropped, this is a finding."
    severity: medium
- id: '1.13'
  title: JUNI-RT-000180
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to have Internet Control Message Protocol (ICMP) mask reply messages
    disabled on all external interfaces. GROUP ID: V-217023 RULE ID: SV-217023r604135'
  rationale: The ICMP supports IP traffic by relaying information about paths, routes, and network conditions. Routers automatically
    send ICMP messages under a wide variety of conditions. Mask Reply ICMP messages are commonly used by attackers for network
    mapping and diagnosis.
  impact: ''
  references: []
  page_start: 56
  audit_raw: "JUNOS has no interface command to not reply to an ICMP Mask Request message\ndestined to the router. Consequently,\
    \ to ensure that the router does not send any ICMP\nMask Reply message in response to an ICMP Mask Request, include a\
    \ term statement\nin the routing engine filter to silently drop any ICMP Masks Requests sent to it as shown\nin the example\
    \ below.\nfirewall {\n family inet {\n …\n …\n …\n }\n filter DESTINED_TO_RE {\n term ALLOW_XYZ {\n from {\n protocol\
    \ xyz;\n }\n then accept;\n }\n …\n …\n …\n }\n term DENY_MASK_REQUEST {\n from {\n protocol icmp;\n icmp-type mask-request;\n\
    \ }\n then {\n discard;\n }\n }\n term ICMP_ANY {\n from {\n protocol icmp;\n }\n then accept;\n }\n term DENY_BY_DEFAULT\
    \ {\n then {\n log;\n discard;\n }\n }\n }\n }\nIf the router is not configured to silently drop all ICMP Mask Reply messages\
    \ destined\nto the router, this is a finding."
  remediation: 'Configure the filter protecting the routing engine to silently drop all ICMP Mask Request

    messages destined to the router.

    [edit firewall family inet filter DESTINED_TO_RP]

    set term DENY_MASK_REQUEST from protocol icmp icmp-type mask-request

    insert term DENY_MASK_REQUEST before term ALLOW_ICMP'
  checks:
  - type: manual_review
    info: "JUNOS has no interface command to not reply to an ICMP Mask Request message\ndestined to the router. Consequently,\
      \ to ensure that the router does not send any ICMP\nMask Reply message in response to an ICMP Mask Request, include\
      \ a term statement\nin the routing engine filter to silently drop any ICMP Masks Requests sent to it as shown\nin the\
      \ example below.\nfirewall {\n family inet {\n …\n …\n …\n }\n filter DESTINED_TO_RE {\n term ALLOW_XYZ {\n from {\n\
      \ protocol xyz;\n }\n then accept;\n }\n …\n …\n …\n }\n term DE"
    severity: medium
- id: '1.14'
  title: JUNI-RT-000190
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to have Internet Control Message Protocol (ICMP) redirect messages disabled
    on all external interfaces. GROUP ID: V-217024 RULE ID: SV-217024r604135'
  rationale: The ICMP supports IP traffic by relaying information about paths, routes, and network conditions. Routers automatically
    send ICMP messages under a wide variety of conditions. Redirect ICMP messages are commonly used by attackers for network
    mapping and diagnosis.
  impact: ''
  references: []
  page_start: 59
  audit_raw: "Review the device configuration to determine if it has been configured to ensure the\nrouter does not send ICMP\
    \ Redirect messages out to any external interface.\ninterfaces {\n ge-1/0/0 {\n unit 0 {\n family inet {\n no-redirects;\n\
    \ address 11.1.12.2/24;\n }\n }\n }\n ge-1/1/0 {\n unit 0 {\n family inet {\n no-redirects;\n address 11.1.23.2/24;\n\
    \ }\n }\n }\nIf ICMP Redirect messages are enabled on any external interfaces, this is a finding."
  remediation: 'Disable ICMP redirects on all external interfaces as shown in the example below.

