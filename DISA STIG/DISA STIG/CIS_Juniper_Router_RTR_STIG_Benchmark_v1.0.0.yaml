  title: JUNI-RT-000720
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper PE router must be configured with Unicast Reverse Path Forwarding (uRPF) loose mode enabled on
    all CE-facing interfaces. GROUP ID: V-217077 RULE ID: SV-217077r604135'
  rationale: The uRPF feature is a defense against spoofing and denial-of-service (DoS) attacks by verifying if the source
    address of any ingress packet is reachable. To mitigate attacks that rely on forged source addresses, all provider edge
    routers must enable uRPF loose mode to guarantee that all packets received from a CE router contain source addresses that
    are in the route table.
  impact: ''
  references: []
  page_start: 227
  audit_raw: "Review the router configuration to determine if uRPF loose mode is enabled on all CEfacing interfaces.\ninterfaces\
    \ {\n ge-0/1/0 {\n description \"link to Customer 2\";\n unit 0 {\n family inet {\n rpf-check {\n mode loose;\n }\n address\
    \ x.x.x.x/30;\n }\n }\n }\nIf uRPF loose mode is not enabled on all CE-facing interfaces, this is a finding."
  remediation: 'Configure uRPF loose mode on all CE-facing interfaces as shown in the example.

    [edit interfaces ge-0/1/0 unit 0 family inet]

    set rpf-check mode loose'
