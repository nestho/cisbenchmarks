  rationale: Without establishing where events occurred, it is impossible to establish, correlate, and investigate the events
    leading up to an outage or attack. In order to compile an accurate risk assessment and provide forensic analysis, it is
    essential for security personnel to know where events occurred, such as router components, modules, device identifiers,
    node names, and functionality. Associating information about where the event occurred within the network provides a means
    of investigating an attack, recognizing resource utilization or capacity thresholds, or identifying an improperly configured
    router.
  impact: ''
  references: []
  page_start: 64
  audit_raw: "Review the router configuration to verify that events are logged containing information to\nestablish where\
