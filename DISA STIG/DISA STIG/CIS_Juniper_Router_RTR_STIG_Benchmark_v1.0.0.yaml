- id: '1.49'
  title: JUNI-RT-000460
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper BGP router must be configured to enable the Generalized TTL Security Mechanism (GTSM). GROUP ID:
    V-217051 RULE ID: SV-217051r604135'
  rationale: GTSM is designed to protect a router's IP-based control plane from DoS attacks. Many attacks focused on CPU load
    and line-card overload can be prevented by implementing GTSM on all Exterior Border Gateway Protocol speaking routers.
    GTSM is based on the fact that the vast majority of control plane peering is established between adjacent routers; that
    is, the Exterior Border Gateway Protocol peers are either between connecting interfaces or between loopback interfaces.
    Since TTL spoofing is considered nearly impossible, a mechanism based on an expected TTL value provides a simple and reasonably
    robust defense from infrastructure attacks based on forged control plane traffic.
  impact: ''
  references: []
  page_start: 157
  audit_raw: "Verify that a filter has been configured to only allow BGP packets with a TTL of 255 as\nshown in the example\
    \ below.\nfirewall {\n …\n …\n …\n filter GTSM_FILTER {\n term TTL_SECURITY {\n from {\n protocol tcp;\n ttl-except 255;\n\
    \ port bgp;\n }\n then {\n syslog;\n discard;\n }\n }\n term ELSE_ACCEPT {\n then accept;\n }\n }\n}\nVerify that the\
    \ filter is applied to all interfaces connecting to eBGP peers.\ninterfaces {\n…\n…\n…\n ge-0/0/0 {\n unit 0 {\n family\
    \ inet {\n filter {\n input-list [INBOUND_FILTER GTSM_FILTER];\n }\n address x.x.x.x/30;\n }\n }\n }\n}\nConfigure the\
    \ router to send all BGP packets with a TTL of 255 as shown in the\nexample below.\nIf the router is not configured to\
    \ use GTSM for all Exterior Border Gateway Protocol\npeering sessions, this is a finding."
  remediation: 'Configure a filter to only accept bgp packets with a TTL of 255 as shown in the example

    below.

    [edit firewall]

    set filter GTSM_FILTER term TTL_SECURITY from protocol tcp port bgp ttlexcept 255

    set filter GTSM_FILTER term TTL_SECURITY then syslog discard

    set filter GTSM_FILTER term ELSE_ACCEPT then accept

    Apply the firewall filter to the inbound interface for all eBGP single-hop peer as shown in

    the example below.

    [edit interfaces ge-0/0/0 unit 0 family inet]

    set filter input-list INBOUND_FILTER

    set filter input-list GTSM_FILTER'
  checks:
  - type: manual_review
    info: "Verify that a filter has been configured to only allow BGP packets with a TTL of 255 as\nshown in the example below.\n\
      firewall {\n …\n …\n …\n filter GTSM_FILTER {\n term TTL_SECURITY {\n from {\n protocol tcp;\n ttl-except 255;\n port\
      \ bgp;\n }\n then {\n syslog;\n discard;\n }\n }\n term ELSE_ACCEPT {\n then accept;\n }\n }\n}\nVerify that the filter\
