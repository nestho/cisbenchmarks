- id: '1.29'
  title: JUNI-RT-000330
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper perimeter router must be configured to filter ingress traffic at the external interface on an
    inbound direction. GROUP ID: V-217038 RULE ID: SV-217038r604135'
  rationale: 'Access lists are used to separate data traffic into that which it will route (permitted packets) and that which
    it will not route (denied packets). Secure configuration of routers makes use of access lists for restricting access to
    services on the router itself as well as for filtering traffic passing through the router. Inbound versus Outbound: It
    should be noted that some operating systems default access lists are applied to the outbound queue. The more secure solution
    is to apply the access list to the inbound queue for three reasons: • The router can protect itself before damage is inflicted.
    • The input port is still known and can be filtered upon. • It is more efficient to filter packets before routing them.'
  impact: ''
  references: []
