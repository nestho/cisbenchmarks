    severity: medium
- id: '1.50'
  title: JUNI-RT-000470
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper BGP router must be configured to use a unique key for each autonomous system (AS) that it peers
    with. GROUP ID: V-217052 RULE ID: SV-217052r604135'
  rationale: If the same keys are used between eBGP neighbors, the chance of a hacker compromising any of the BGP sessions
    increases. It is possible that a malicious user exists in one autonomous system who would know the key used for the eBGP
    session. This user would then be able to hijack BGP sessions with other trusted neighbors.
  impact: ''
  references: []
  page_start: 160
  audit_raw: "Review the BGP configuration to determine if it is peering with multiple autonomous\nsystems.\nInterview the\
    \ ISSM and router administrator to determine if unique keys are being used.\nprotocols {\n bgp {\n group AS44 {\n type\
    \ external;\n peer-as 44;\n neighbor x.x.x.x {\n authentication-key \"$8$tBga0ORx7VsYoIEgJ\"; ## SECRET-DATA\n }\n }\n\
    \ group AS66 {\n type external;\n peer-as 66;\n neighbor x.x.x.x {\n authentication-key \"$8$Q4953nCrlMLX-9A7V\"; ## SECRET-DATA\n\
    \ }\n }\n }\nIf unique keys are not being used, this is a finding."
  remediation: 'Configure the router to use unique keys for each AS that it peers with as shown in the

    example below.

    [edit protocols bgp]

    set group GROUP_AS66 authentication-key abc123

    set group GROUP_AS44 authentication-key xyz123'
