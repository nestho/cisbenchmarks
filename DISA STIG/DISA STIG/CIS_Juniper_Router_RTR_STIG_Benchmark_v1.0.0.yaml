- id: '1.54'
  title: JUNI-RT-000510
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper BGP router must be configured to reject outbound route advertisements for any prefixes that do
    not belong to any customers or the local autonomous system (AS). GROUP ID: V-217056 RULE ID: SV-217056r604135'
  rationale: Advertisement of routes by an autonomous system for networks that do not belong to any of its customers pulls
    traffic away from the authorized network. This causes a denial of service (DoS) on the network that allocated the block
    of addresses and may cause a DoS on the network that is inadvertently advertising it as the originator. It is also possible
    that a misconfigured or compromised router within the GIG IP core could redistribute IGP routes into BGP, thereby leaking
    internal routes.
  impact: ''
  references: []
  page_start: 172
  audit_raw: "This requirement is not applicable for the DODIN Backbone.”\nReview the router configuration to verify that\
    \ there is a filter defined to only advertise\nroutes for prefixes that belong to any customers or the local AS.\nVerify\
    \ that a policy has been configured to filter prefixes for BGP advertisement as\nshown in the example below.\n}\npolicy-options\
    \ {\n …\n …\n …\n policy-statement BGP_ADVERTISE_POLICY {\n term INCLUDE_LOCAL {\n from {\n prefix-list OUR_PREFIXES;\n\
    \ }\n then accept;\n }\n term INCLUDE_CUST1 {\n from {\n prefix-list CUST1_PREFIXES;\n }\n then accept;\n }\n term INCLUDE_CUST2\
    \ {\n from {\n prefix-list CUST2_PREFIXES;\n }\n then accept;\n }\n term REJECT_OTHER {\n then reject;\n }\n }\nVerify\
    \ that the export statement as shown below references the advertise policy.\nprotocols {\n bgp {\n group AS4 {\n type\
    \ external;\n import FILTER_ROUTES;\n export BGP_ADVERTISE_POLICY;\n peer-as 4;\n neighbor x.x.x.x;\n }\n group CUST1\
    \ {\n type external;\n import FILTER_CUST1_ROUTES;\n export BGP_ADVERTISE_POLICY;\n peer-as 55;\n neighbor x.x.x.x;\n\
    \ neighbor x.x.x.x;\n }\n group CUST2 {\n type external;\n import FILTER_CUST2_ROUTES;\n export BGP_ADVERTISE_POLICY;\n\
    \ peer-as 44;\n neighbor x.x.x.x;\n neighbor x.x.x.x;\n }\n }\n …\n …\n …\n}\nNote: The prefix lists should have already\
    \ been configured per the previous\nrequirements.\nIf the router is not configured to reject outbound route advertisements\
    \ that do not belong\nto any customers or the local AS, this is a finding."
  remediation: 'Configure the router to filter outbound route advertisements for prefixes that are not

    allocated to or belong to any customer or the local autonomous system.

    Configure a policy-statement to filter BGP route advertisements that will only include the

    local and customer prefixes.

    [edit policy-options]

    set policy-statement BGP_ADVERTISE_POLICY term INCLUDE_LOCAL from prefix-list

