  title: JUNI-RT-000680
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper PE router providing Virtual Private LAN Services (VPLS) must be configured to have traffic storm
    control thresholds on CE-facing interfaces. GROUP ID: V-217073 RULE ID: SV-217073r604135'
  rationale: A traffic storm occurs when packets flood a VPLS bridge, creating excessive traffic and degrading network performance.
    Traffic storm control prevents VPLS bridge disruption by suppressing traffic when the number of packets reaches configured
    threshold levels. Traffic storm control monitors incoming traffic levels on a port and drops traffic when the number of
    packets reaches the configured threshold level during any one-second interval.
  impact: ''
  references: []
  page_start: 215
  audit_raw: "Review the router configuration to verify that storm control is enabled on CE-facing\ninterfaces deploying VPLS.\n\
    Verify that a flood filter has been configured for each VPLS routing instances as shown\nin the example below.\nrouting-instances\
    \ {\n VPLS_CUST2 {\n instance-type vpls;\n interface ge-0/1/0.0;\n route-distinguisher 22:22;\n vrf-target target:22:22;\n\
    \ forwarding-options {\n family vpls {\n flood {\n input VPLS_FLOOD_FILTER;\n }\n }\n }\n protocols {\n vpls {\n site-range\
    \ 9;\n no-tunnel-services;\n site R8 {\n site-identifier 8;\n interface ge-0/1/0.0;\n }\n vpls-id 102;\n neighbor 8.8.8.8;\n\
    \ }\n }\n }\n}\nReview the filter configured for the VPLS routing instances to verify it defines traffic\ntypes associated\
    \ with storm control (i.e. broadcast, multicast, and unknown unicast\nstorms).\nfirewall {\n …\n …\n …\n family vpls {\n\
    \ filter VPLS_FLOOD_FILTER {\n term BROADCAST_TRAFFIC {\n from {\n traffic-type broadcast;\n }\n then {\n policer STORM_POLICER;\n\
    \ accept;\n }\n }\n term MULTICAST_TRAFFIC {\n from {\n traffic-type multicast;\n }\n then {\n policer STORM_POLICER;\n\
    \ accept;\n }\n }\n term UNKNOWN_UNICAST_TRAFFIC {\n from {\n traffic-type unknown-unicast;\n }\n then {\n policer STORM_POLICER;\n\
