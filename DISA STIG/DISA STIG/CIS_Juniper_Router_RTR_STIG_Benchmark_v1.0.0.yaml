  description: 'The Juniper out-of-band management (OOBM) gateway router must be configured to have separate IGP instances
    for the managed network and management network. GROUP ID: V-217046 RULE ID: SV-217046r604135'
  rationale: If the gateway router is not a dedicated device for the OOBM network, implementation of several safeguards for
    containment of management and production traffic boundaries must occur. Since the managed and management network are separate
    routing domains, configuration of separate Interior Gateway Protocol routing instances is critical on the router to segregate
    traffic from each network.
  impact: ''
  references: []
  page_start: 139
  audit_raw: "This requirement is not applicable for the DoDIN Backbone.\nVerify that the OOBM interface is an adjacency in\
    \ the IGP domain for the management\nnetwork via separate VRF as shown in the example below.\n}\nprotocols {\n ospf {\n\
    \ area 0.0.0.0 {\n interface ge-2/0/0;\n interface ge-2/1/0;\n }\n }\n}\nrouting-instances {\n VRF_MGMT {\n instance-type\
    \ vrf;\n interface ge-1/0/0;\n interface ge-1/1/0;\n route-distinguisher 10.1.12.0:12;\n vrf-target {\n import target:1234:4567;\n\
    \ export target:1234:4567;\n }\n routing-options {\n router-id 11.11.11.11;\n }\n protocols {\n ospf {\n area 0.0.0.0\
    \ {\n interface ge-1/0/0;\n interface ge-1/1/0;\n }\n }\n }\n }\n}\nIf the router is not configured to have separate IGP\
    \ instances for the managed network\nand management network, this is a finding."
  remediation: 'This requirement is not applicable for the DoDIN Backbone.

    Configure the router to have a separate IGP instance for the management network as

    shown in the example below.

    [edit routing-instances]

