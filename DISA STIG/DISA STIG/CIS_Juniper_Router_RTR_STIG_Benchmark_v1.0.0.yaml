- id: '1.36'
  title: JUNI-RT-000382
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper perimeter router must be configured drop IPv6 packets with a Routing Header type 0, 1, or 3255.
    GROUP ID: V-233294 RULE ID: SV-233294r604135'
  rationale: The routing header can be used maliciously to send a packet through a path where less robust security is in place,
    rather than through the presumably preferred path of routing protocols. Use of the routing extension header has few legitimate
    uses other than as implemented by Mobile IPv6. The Type 0 Routing Header (RFC 5095) is dangerous because it allows attackers
    to spoof source addresses and obtain traffic in response, rather than the real owner of the address. Secondly, a packet
    with an allowed destination address could be sent through a Firewall using the Routing Header functionality, only to bounce
    to a different node once inside. The Type 1 Routing Header is defined by a specification called "Nimrod Routing", a discontinued
    project funded by DARPA. Assuming that most implementations will not recognize the Type 1 Routing Header, it must be dropped.
    The Type 3–255 Routing Header values in the routing type field are currently undefined and should be dropped inbound and
    outbound.
  impact: ''
  references: []
  page_start: 111
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to determine if\
    \ it is configured to drop IPv6 packets\ncontaining a Routing Header of type 0, 1, or 3-255.\nStep 1: Verify that all\
    \ external IPv6-enabled interfaces have an IPv6 filter as shown in\nthe example below.\ninterfaces {\n ge-0/0/0 {\n unit\
    \ 0 {\n family inet6 {\n filter {\n input IPV6-INGRESS-FILTER;\n }\n address 2001:1:0:146::1/64;\n }\n }\n }\n}\nStep\
    \ 2: Verify that the IPV6 filter blocks all packets with a routing header as shown in\nthe example below.\nfirewall {\n\
    \ family inet6 {\n filter IPV6-INGRESS-FILTER {\n term ROUTING_HEADER {\n from {\n next-header routing;\n }\n then {\n\
    \ syslog;\n discard;\n }\n }\n term ALLOW_TCP_ESTABLISHED {\n from {\n next-header tcp;\n tcp-established;\n }\n then\
    \ accept;\n }\n term DENY_BY_DEFAULT {\n then {\n syslog;\n discard;\n }\n }\n }\n }\n}\nNote: Currently JUNOS has no\
    \ method to filter option type within a routing header.\nHence, all packets with a routing header must be dropped.\nIf\
    \ the router is not configured to drop IPv6 packets containing a Routing Header of type\n0, 1, or 3-255, this is a finding."
  remediation: 'Step 1: Configure a filter to block packets with a routing header as shown in the

    example.

    user@R1# edit firewall family inet6

    user@R1# edit filter IPV6-INGRESS-FILTER

    user@R1# set term ROUTING_HEADER from next-header routing

    user@R1# set term ROUTING_HEADER then discard syslog

    user@R1# top

    Step 2: Apply the filter inbound on all external IPv6-enabled interfaces.

    user@R1# edit interfaces ge-0/0/0 unit 0 family inet6

    user@R1# set filter input IPV6-INGRESS-FILTER

    user@R1# commit'
  checks:
  - type: manual_review
    info: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to determine if it\
      \ is configured to drop IPv6 packets\ncontaining a Routing Header of type 0, 1, or 3-255.\nStep 1: Verify that all external\
