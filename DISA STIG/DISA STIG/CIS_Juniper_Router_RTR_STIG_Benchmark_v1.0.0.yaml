- id: '1.22'
  title: JUNI-RT-000260
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper perimeter router must be configured to only allow incoming communications from authorized sources
    to be routed to authorized destinations. GROUP ID: V-217031 RULE ID: SV-217031r604135'
  rationale: Unrestricted traffic may contain malicious traffic that poses a threat to an enclave or to other connected networks.
    Additionally, unrestricted traffic may transit a network, which uses bandwidth and other resources. Traffic can be restricted
    directly by an access control list (ACL), which is a firewall function, or by Policy Routing. Policy Routing is a technique
    used to make routing decisions based on a number of different criteria other than just the destination network, including
    source or destination network, source or destination address, source or destination port, protocol, packet size, and packet
    classification. This overrides the router's normal routing procedures used to control the specific paths of network traffic.
    It is normally used for traffic engineering but can also be used to meet security requirements; for example, traffic that
    is not allowed can be routed to the Null0 or discard interface. Policy Routing can also be used to control which prefixes
    appear in the routing table. This requirement is intended to allow network administrators the flexibility to use whatever
    technique is most effective.
  impact: ''
  references: []
  page_start: 77
  audit_raw: "This requirement is not applicable for the DoDIN Backbone.\nReview the router configuration to determine if\
    \ the router allows only incoming\ncommunications from authorized sources to be routed to authorized destinations. The\n\
    hypothetical example below allows inbound NTP from host x.3.12.33 only to host\nx.1.22.4.\nfilter INBOUND_FILTER {\n term\
    \ ALLOW_NTP {\n from {\n source-address {\n x.3.12.33/32;\n }\n destination-address {\n x.1.22.4/32; <<< change to global\
    \ address\n }\n protocol udp;\n destination-port ntp;\n }\n }\n}\nIf the router does not restrict incoming communications\
    \ to allow only authorized sources\nand destinations, this is a finding."
  remediation: 'This requirement is not applicable for the DoDIN Backbone.

    Configure the router to allow only incoming communications from authorized sources to

    be routed to authorized destinations.'
  checks:
  - type: manual_review
    info: "This requirement is not applicable for the DoDIN Backbone.\nReview the router configuration to determine if the\
      \ router allows only incoming\ncommunications from authorized sources to be routed to authorized destinations. The\n\
      hypothetical example below allows inbound NTP from host x.3.12.33 only to host\nx.1.22.4.\nfilter INBOUND_FILTER {\n\
      \ term ALLOW_NTP {\n from {\n source-address {\n x.3.12.33/32;\n }\n destination-address {\n x.1.22.4/32; <<< change\
      \ to global address\n }\n protocol udp;\n destination-port "
    severity: medium
- id: '1.23'
  title: JUNI-RT-000270
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper perimeter router must be configured to block inbound packets with source Bogon IP address prefixes.
    GROUP ID: V-217032 RULE ID: SV-217032r604135'
  rationale: Packets with Bogon IP source addresses should never be allowed to traverse the IP core. Bogon IP networks are
    RFC1918 addresses or address blocks that have never been assigned by the IANA or have been reserved.
  impact: ''
  references: []
  page_start: 79
  audit_raw: "This requirement is not applicable for the DoDIN Backbone.\nReview the router configuration to verify that an\
    \ ingress filter applied to all external\ninterfaces is blocking packets with Bogon source addresses.\nVerify a prefix\
    \ list has been configured containing the current Bogon prefixes as shown\nin the example below.\npolicy-options {\n prefix-list\
    \ BOGON_PREFIXES {\n 0.0.0.0/8;\n 10.0.0.0/8;\n 100.64.0.0/10;\n 127.0.0.0/8;\n 169.254.0.0/16;\n 172.16.0.0/12;\n 192.0.0.0/24;\n\
    \ 192.0.2.0/24;\n 192.168.0.0/16;\n 198.18.0.0/15;\n 198.51.100.0/24;\n 203.0.113.0/24;\n 224.0.0.0/4;\n 240.0.0.0/4;\n\
    \ }\n}\nVerify that the inbound filter applied to all external interfaces will block all traffic from\nBogon source addresses.\n\
    interfaces {\n ge-0/0/0 {\n unit 0 {\n family inet {\n filter {\n input INBOUND_FILTER;\n }\n address 11.1.12.2/24;\n\
    \ }\n }\n }\n…\n…\n…\nfirewall {\n family inet {\n filter INBOUND_FILTER {\n term BLOCK_BOGONS {\n from {\n source-prefix-list\
    \ {\n BOGON_PREFIXES;\n }\n }\n then {\n syslog;\n discard;\n }\n }\n term ALLOW_BGP {\n from {\n protocol tcp;\n destination-port\
    \ bgp;\n }\n then accept;\n }\n term ALLOW_XYZ {\n from {\n protocol xyz;\n }\n then accept;\n }\n term DENY_ALL_OTHER\
    \ {\n then {\n syslog;\n reject;\n }\n }\n }\n}\nExternal Interfaces connected to the NIPRNet or SIPRNet\nReview the inbound\
    \ ACLs on external facing interfaces attached to the NIPRnet or\nSIPRnet to validate access control lists are configured\
    \ to block inbound packets with IP\nsources addresses as documented in RFC5735 and RFC6598.\nExternal Interfaces connected\
    \ to a commercial ISP or other non-DoD network\nReview the inbound ACLs on external facing interfaces validate access\
    \ control lists are\nconfigured to block inbound packets with IP sources addresses as documented in\nRFC5735 and RFC6598,\
    \ as well as address space that has been allocated to the RIRs\nbut not assigned by the RIR to an ISP or other enterprise\
    \ network. The full list of bogons\ncan be found at the following link: https://www.teamcymru.org/Services/Bogons/fullbogons-ipv4.txt\n\
    If the router is not configured to block inbound packets with source Bogon IP address\nprefixes, this is a finding."
  remediation: 'This requirement is not applicable for the DoDIN Backbone.

    Configure the perimeter to block inbound packets with Bogon source addresses.

    Configure a prefix list containing the current Bogon prefixes as shown below.

    [edit policy-options]

    set prefix-list BOGON_PREFIXES 0.0.0.0/8

    set prefix-list BOGON_PREFIXES 10.0.0.0/8

    set prefix-list BOGON_PREFIXES 100.64.0.0/10

    set prefix-list BOGON_PREFIXES 127.0.0.0/8

    set prefix-list BOGON_PREFIXES 169.254.0.0/16

    set prefix-list BOGON_PREFIXES 172.16.0.0/12

    set prefix-list BOGON_PREFIXES 192.0.0.0/24

    set prefix-list BOGON_PREFIXES 192.0.2.0/24

    set prefix-list BOGON_PREFIXES 192.168.0.0/16

    set prefix-list BOGON_PREFIXES 198.18.0.0/15

    set prefix-list BOGON_PREFIXES 198.51.100.0/24

    set prefix-list BOGON_PREFIXES 203.0.113.0/24

    set prefix-list BOGON_PREFIXES 224.0.0.0/4

    set prefix-list BOGON_PREFIXES 240.0.0.0/4

    Add a term to the inbound filter to block the Bogon prefixes.

