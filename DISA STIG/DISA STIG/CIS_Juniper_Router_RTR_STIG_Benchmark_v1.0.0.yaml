- id: '1.89'
  title: JUNI-RT-000870
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper multicast Designated Router (DR) must be configured to limit the number of mroute states resulting
    from Internet Group Management Protocol (IGMP) and Multicast Listener Discovery (MLD) Host Membership Reports. GROUP ID:
    V-217091 RULE ID: SV-217091r604135'
  rationale: The current multicast paradigm can let any host join any multicast group at any time by sending an IGMP or MLD
    membership report to the DR. In a Protocol Independent Multicast (PIM) Sparse Mode network, the DR will send a PIM Join
    message for the group to the RP. Without any form of admission control, this can pose a security risk to the entire multicast
    domain - specifically the multicast routers along the shared tree from the DR to the RP that must maintain the mroute
    state information for each group join request. Hence, it is imperative that the DR is configured to limit the number of
    mroute state information that must be maintained to mitigate the risk of IGMP or MLD flooding.
  impact: ''
  references: []
  page_start: 267
  audit_raw: "Review the DR configuration to verify that it is limiting the number of mroute states via\nIGMP or MLD.\nprotocols\
    \ {\n igmp {\n interface ge-1/0/1.0 {\n group-limit nnn;\n }\n }\nIf the DR is not limiting multicast join requests via\
    \ IGMP or MLD, this is a finding."
  remediation: 'Configure the DR on a global or interface basis to limit the number of mroute states

    resulting from IGMP or MLD membership reports.

    [edit protocols igmp]

    set interface ge-1/0/1.0 group-limit nnn'
  checks:
  - type: manual_review
    info: "Review the DR configuration to verify that it is limiting the number of mroute states via\nIGMP or MLD.\nprotocols\
      \ {\n igmp {\n interface ge-1/0/1.0 {\n group-limit nnn;\n }\n }\nIf the DR is not limiting multicast join requests\
      \ via IGMP or MLD, this is a finding."
    severity: medium
- id: '1.90'
  title: JUNI-RT-000880
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper multicast Designated Router (DR) must be configured to set the shortestpath tree (SPT) threshold
    to infinity to minimalize source-group (S, G) state within the multicast topology where Any Source Multicast (ASM) is
    deployed. GROUP ID: V-217092 RULE ID: SV-217092r604135'
  rationale: ASM can have many sources for the same groups (many-to-many). For many receivers, the path via the RP may not
    be ideal compared with the shortest path from the source to the receiver. By default, the last-hop router will initiate
    a switch from the shared tree to a source-specific SPT to obtain lower latencies. This is accomplished by the last-hop
    router sending an (S, G) Protocol Independent Multicast (PIM) Join toward S (the source). When the last-hop router begins
    to receive traffic for the group from the source via the SPT, it will send a PIM Prune message to the RP for the (S, G).
    The RP will then send a Prune message toward the source. The SPT switchover becomes a scaling issue for large multicast
    topologies that have many receivers and many sources for many groups because (S, G) entries require more memory than (*,
    G). Hence, it is imperative to minimize the amount of (S, G) state to be maintained by increasing the threshold that determines
    when the SPT switchover occurs.
  impact: ''
  references: []
  page_start: 269
  audit_raw: "Review the multicast last-hop router configuration to verify that the SPT switchover\nthreshold is set to infinity\
    \ for all or specific multicast groups and sources.\nVerify that an infinity policy has been enabled for PIM.\nprotocols\
    \ {\n …\n …\n …\n }\n pim {\n spt-threshold {\n infinity SPT_INFINITY;\n }\n }\n}\nVerify that the infinity policy defines\
    \ specific multicast groups and sources or all\nmulticast groups and sources as shown in the example below.\npolicy-options\
    \ {\n …\n …\n …\n }\n policy-statement SPT_INFINITY {\n term ALL_GROUPS {\n from {\n route-filter 234.0.0.0/8 orlonger;\n\
    \ }\n then accept;\n }\n }\n}\nIf any multicast router is not configured to set the SPT threshold to infinity to minimalize\n\
    (S, G) state, this is a finding."
  remediation: 'Configure the multicast router to increase the SPT threshold or set it to infinity to

    minimalize (S, G) state within the multicast topology where ASM is deployed.

    Configure a policy statement to set SPT threshold to infinity for all multicast groups or

    only specific groups and sources.

    [edit policy-options]

    set policy-statement SPT_INFINITY term ALL_GROUPS from route-filter

    234.0.0.0/8 orlonger

    set policy-statement SPT_INFINITY term ALL_GROUPS then accept

    Apply the SPT infinity policy.

    [edit protocols pim]

    set spt-threshold infinity SPT_INFINITY'
  checks:
  - type: manual_review
    info: "Review the multicast last-hop router configuration to verify that the SPT switchover\nthreshold is set to infinity\
      \ for all or specific multicast groups and sources.\nVerify that an infinity policy has been enabled for PIM.\nprotocols\
      \ {\n …\n …\n …\n }\n pim {\n spt-threshold {\n infinity SPT_INFINITY;\n }\n }\n}\nVerify that the infinity policy defines\
      \ specific multicast groups and sources or all\nmulticast groups and sources as shown in the example below.\npolicy-options\
      \ {\n …\n …\n …\n }\n policy-statement SPT_INF"
    severity: medium
