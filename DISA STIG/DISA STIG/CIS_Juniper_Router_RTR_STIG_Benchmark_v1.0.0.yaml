- id: '1.47'
  title: JUNI-RT-000440
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to only permit management traffic that ingresses and egresses the OOBM
    interface. GROUP ID: V-217049 RULE ID: SV-217049r604135'
  rationale: The OOBM access switch will connect to the management interface of the managed network elements. The management
    interface can be a true OOBM interface or a standard interface functioning as the management interface. In either case,
    the management interface of the managed network element will be directly connected to the OOBM network. An OOBM interface
    does not forward transit traffic, thereby providing complete separation of production and management traffic. Since all
    management traffic is immediately forwarded into the management network, it is not exposed to possible tampering. The
    separation also ensures that congestion or failures in the managed network do not affect the management of the device.
    If the device does not have an OOBM port, the interface functioning as the management interface must be configured so
    that management traffic does not leak into the managed network and that production traffic does not leak into the management
    network.
  impact: ''
  references: []
  page_start: 147
  audit_raw: "Verify that the managed interface has an inbound and outbound filter configured.\ninterfaces {\n …\n …\n …\n\
    \ ge-0/0/0 {\n description \"OOBM Network\";\n unit 0 {\n family inet {\n filter {\n input OOBM_INBOUND;\n output OOBM_OUTBOUND;\n\
    \ }\n address 10.2.14.1/24;\n }\n }\n }\nVerify that the ingress filter only allows management and ICMP traffic.\nVerify\
    \ that the ingress filter only allows management and ICMP traffic.\nfirewall {\n family inet {\n …\n …\n …\n filter OOBM_INBOUND\
    \ {\n term ALLOW_SNMP {\n from {\n protocol udp;\n port snmp;\n }\n then accept;\n }\n term ALLOW_TACACS {\n from {\n\
    \ protocol tcp;\n port tacacs;\n }\n then accept;\n }\n term ALLOW_ICMP {\n from {\n protocol icmp;\n }\n then accept;\n\
    \ }\n term ALLOW_SSH {\n from {\n protocol tcp;\n port ssh;\n }\n then accept;\n }\n term ALLOW_NTP {\n from {\n protocol\
    \ tcp;\n port ntp;\n }\n then accept;\n }\n term DENY_OTHER {\n then {\n syslog;\n discard;\n }\n }\n }\n }\n}\nVerify\
    \ that the ingress filter only allows management and ICMP traffic.\nfirewall {\n family inet {\n …\n …\n …\n filter OOBM_OUTBOUND\
    \ {\n term ALLOW_SNMP {\n from {\n protocol udp;\n port [ snmp snmptrap ];\n }\n then accept;\n }\n term ALLOW_TACACS\
    \ {\n from {\n protocol tcp;\n port tacacs;\n }\n then accept;\n }\n term ALLOW_SSH {\n from {\n protocol tcp;\n port\
    \ ssh;\n }\n then accept;\n }\n term ALLOW_NTP {\n from {\n protocol udp;\n port ntp;\n }\n then accept;\n }\n term ALLOW_SYSLOG\
    \ {\n from {\n protocol udp;\n port syslog;\n }\n then accept;\n }\n term ALLOW_NETFLOW {\n from {\n protocol udp;\n port\
    \ [ 2055 9995 9996 ];\n }\n then accept;\n }\n term DENY_OTHER {\n then {\n syslog;\n discard;\n }\n }\n }\n }\n}\nCaveat:\
    \ If the management interface is a true OOBM interface, this requirement is not\napplicable.\nIf the router does not restrict\
    \ traffic that ingresses and egresses the management\ninterface, this is a finding."
  remediation: 'If the management interface is not a dedicated OOBM interface, it must be configured

    with both an ingress and egress filter.

    Configure an inbound filter a shown in the example below.

    [edit firewall family inet]

    set filter OOBM_INBOUND term ALLOW_SNMP from protocol udp port snmp

    set filter OOBM_INBOUND term ALLOW_SNMP then accept

    set filter OOBM_INBOUND term ALLOW_TACACS from protocol tcp port tacacs

    set filter OOBM_INBOUND term ALLOW_TACACS then accept

    set filter OOBM_INBOUND term ALLOW_SSH from protocol tcp port ssh

    set filter OOBM_INBOUND term ALLOW_SSH then accept

    set filter OOBM_INBOUND term ALLOW_NTP from protocol udp port ntp

    set filter OOBM_INBOUND term ALLOW_NTP then accept

    set filter OOBM_INBOUND term ALLOW_ICMP from protocol icmp

