- id: '1.70'
  title: JUNI-RT-000660
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper PE router providing Virtual Private LAN Services (VPLS) must be configured to have all attachment
    circuits defined to the routing instance with the globally unique VPLS ID assigned for each customer VLAN. GROUP ID: V-217072
    RULE ID: SV-217072r604135'
  rationale: VPLS defines an architecture that delivers Ethernet multipoint services over an MPLS network. Customer Layer
    2 frames are forwarded across the MPLS core via pseudowires using IEEE 802.1q Ethernet bridging principles. A pseudowire
    is a virtual bidirectional connection between two attachment circuits (virtual connections between PE and CE routers).
    A pseudowire contains two unidirectional label-switched paths (LSP) between two PE routers. Each MAC virtual forwarding
    table instance is interconnected using pseudowires provisioned for the bridge domain, thereby maintaining privacy and
    logical separation between each VPLS bridge domain. The forwarding table instance specifies the pseudowires associated
    with connecting PE routers and the customer-facing attachment circuits belonging to a given VLAN. Resembling a Layer 2
    switch, the forwarding table instance is responsible for learning MAC addresses and providing loop-free forwarding of
    customer traffic to the appropriate end nodes. Each VPLS domain is identified by a globally unique VPN ID; hence, VFIs
    of the same VPLS domain must be configured with the same VPLS ID on all participating PE routers. To guarantee traffic
    separation for all customer VLANs and that all packets are forwarded to the correct destination, it is imperative that
    the correct attachment circuits are associated with the appropriate forwarding table instance and that each forwarding
    table instance is associated to the unique VPLS ID assigned to the customer VLAN.
  impact: ''
  references: []
  page_start: 212
  audit_raw: "Review the implementation plan and the VPLS IDs assigned to customer VLANs for the\nVPLS deployment.\nReview\
    \ the PE router configuration to verify that customer attachment circuits are\nassociated to the appropriate routing instance\
    \ configured for the customers VPLS ID.\ninterfaces {\n ge-0/1/0.0 {\n encapsulation ethernet-vpls;\n unit 0 {\n }\n }\n\
