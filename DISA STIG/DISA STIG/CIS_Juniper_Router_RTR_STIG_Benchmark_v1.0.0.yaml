  title: JUNI-RT-000350
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper perimeter router must be configured to block all packets with any IP options. GROUP ID: V-217040
    RULE ID: SV-217040r604135'
  rationale: Packets with IP options are not fast switched and henceforth must be punted to the router processor. Hackers
    who initiate denial-of-service (DoS) attacks on routers commonly send large streams of packets with IP options. Dropping
    the packets with IP options reduces the load of IP options packets on the router. The end result is a reduction in the
    effects of the DoS attack on the router and on downstream routers.
