      \ the network.\ninterfaces {\n ge-0/0/0 {\n uni"
    severity: medium
- id: '1.2'
  title: JUNI-RT-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to implement message authentication for all control plane protocols.
    GROUP ID: V-217012 RULE ID: SV-217012r604135'
  rationale: A rogue router could send a fictitious routing update to convince a site's perimeter router to send traffic to
    an incorrect or even a rogue destination. This diverted traffic could be analyzed to learn confidential information about
    the site's network or used to disrupt the network's ability to communicate with other networks. This is known as a "traffic
    attraction attack" and is prevented by configuring neighbor router authentication for routing updates. This requirement
    applies to all IPv4 and IPv6 protocols that are used to exchange routing or packet forwarding information; this includes
    all Interior Gateway Protocols (such as OSPF, EIGRP, and IS-IS) and Exterior Gateway Protocols (such as BGP), MPLS-related
    protocols (such as LDP), and multicast-related protocols.
  impact: ''
  references: []
  page_start: 16
  audit_raw: "Review the router configuration. Verify that neighbor router authentication is enabled for\nall routing protocols\
    \ as shown in the example configuration below.\nprotocols {\n bgp {\n group AS_5 {\n type external;\n peer-as 5;\n neighbor\
    \ x.x.x.x {\n authentication-key \"$8$tBga0ORx7VsYoIEgJ\"; ## SECRET-DATA\n }\n }\n }\n ospf {\n area 0.0.0.0 {\n interface\
    \ ge-0/0/0.0 {\n authentication {\n simple-password \"$8$NHVb2mPQ3nCYg/t\"; ## SECRET-DATA\n }\n }\n interface ge-0/1/0.0\
    \ {\n authentication {\n simple-password \"$8$Lgb7NbHkPTQnVwF/\"; ## SECRET-DATA\n }\n }\n interface lo0.0;\n interface\
    \ ge-0/2/0.0 {\n authentication {\n simple-password \"$8$7DdVY.mTF39s26A\"; ## SECRET-DATA\n }\n }\n }\n }\n isis {\n\
    \ level 1 {\n authentication-key \"$8$n2OT9CuvMXN-wp0VY\"; ## SECRET-DATA\n authentication-type md5;\n }\n level 2 {\n\
    \ authentication-key \"$8$8G9x7ViHm5T3dbz6\"; ## SECRET-DATA\n authentication-type md5;\n }\n interface ge-0/0/0.0;\n\
    \ interface ge-0/0/1.0;\n }\n ldp {\n interface ge-0/0/0.0;\n interface ge-0/0/1.0;\n session 10.3.3.3 {\n authentication-key\
    \ \"$8$3hus/u1ylMNVYX7qf\"; ## SECRET-DATA\n }\n session 10.1.2.2 {\n authentication-key \"$8$Qq0I3nCrlMLX-9A7V\"; ##\
    \ SECRET-DATA\n }\n }\n rip {\n authentication-type md5;\n authentication-key \"$8$34fM/u1ylMNVYX7qf\"; ## SECRET-DATA\n\
    \ group RIP_GROUP {\n neighbor ge-1/0/1.0;\n }\n }\n}\nIf authentication is not enabled for all control plane protocols,\
    \ this is a finding."
  remediation: 'Configure authentication to be enabled for all control plane protocols as shown in the

    example below.

    [edit protocols ospf area 0.0.0.0]

    set interface ge-0/0/0 authentication simple-password xxxxxxxxxxxx

    set interface ge-0/1/0 authentication simple-password xxxxxxxxxxxx

    set interface ge-0/2/0 authentication simple-password xxxxxxxxxxxx

    [edit protocols isis]

    set level 1 authentication-type md5

    set level 1 authentication-key xxxxxxxx

    set level 2 authentication-type md5

    set level 2 authentication-key xxxxxxxx

    [edit protocols rip]

    set authentication-type md5

    set authentication-key xxxxxxxx

    [edit protocols bgp group AS_2 neighbor x.x.x.x]

    set authentication-key xxxxxxxxxxxxxxx

    [edit protocols ldp]

    set session 10.1.2.2 authentication-key xxxxxxxxxx'
  checks:
  - type: manual_review
    info: "Review the router configuration. Verify that neighbor router authentication is enabled for\nall routing protocols\
      \ as shown in the example configuration below.\nprotocols {\n bgp {\n group AS_5 {\n type external;\n peer-as 5;\n neighbor\
