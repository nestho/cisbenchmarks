- id: '1.18'
  title: JUNI-RT-000230
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper router must be configured to disable the auxiliary port unless it is connected to a secured modem
    providing encryption and authentication. GROUP ID: V-217028 RULE ID: SV-217028r604135'
  rationale: The use of POTS lines to modems connecting to network devices provides clear text of authentication traffic over
    commercial circuits that could be captured and used to compromise the network. Additional war dial attacks on the device
    could degrade the device and the production network. Secured modem devices must be able to authenticate users and must
    negotiate a key exchange before full encryption takes place. The modem will provide full encryption capability (Triple
    DES) or stronger. The technician who manages these devices will be authenticated using a key fob and granted access to
    the appropriate maintenance port; thus, the technician will gain access to the managed device (router, switch, etc.).
    The token provides a method of strong (two-factor) user authentication. The token works in conjunction with a server to
    generate one-time user passwords that will change values at second intervals. The user must know a personal identification
    number (PIN) and possess the token to be allowed access to the device.
  impact: ''
  references: []
  page_start: 68
  audit_raw: "Review the configuration and verify that the auxiliary port is disabled unless a secured\nmodem providing encryption\
    \ and authentication is connected to it.\nIf the auxiliary port has never been configured or has been removed from the\n\
    configuration this is Not Applicable.\nsystem {\n host-name XYZ;\n …\n …\n …\n ports {\n auxiliary {\n disable;\n type\
    \ xterm;\n }\n }\nIf the auxiliary port is not disabled or is not connected to a secured modem when it is\nenabled, this\
    \ is a finding."
  remediation: 'Disable the auxiliary port.

    [edit system ports]

    set auxiliary disable

    Note: If used for out-of-band administrative access, the port must be connected to a

    secured modem providing encryption and authentication.'
  checks:
  - type: manual_review
    info: "Review the configuration and verify that the auxiliary port is disabled unless a secured\nmodem providing encryption\
      \ and authentication is connected to it.\nIf the auxiliary port has never been configured or has been removed from the\n\
      configuration this is Not Applicable.\nsystem {\n host-name XYZ;\n …\n …\n …\n ports {\n auxiliary {\n disable;\n type\
      \ xterm;\n }\n }\nIf the auxiliary port is not disabled or is not connected to a secured modem when it is\nenabled,\
      \ this is a finding."
    severity: medium
- id: '1.19'
  title: JUNI-RT-000235
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must not be configured to use IPv6 Site Local Unicast addresses. GROUP ID: V-233293 RULE
    ID: SV-233293r604135'
  rationale: As currently defined, site local addresses are ambiguous and can be present in multiple sites. The address itself
    does not contain any indication of the site to which it belongs. The use of site-local addresses has the potential to
    adversely affect network security through leaks, ambiguity, and potential misrouting as documented in section 2 of RFC3879.
    RFC3879 formally deprecates the IPv6 site-local unicast prefix FEC0::/10 as defined in RFC3513.
  impact: ''
  references: []
  page_start: 70
  audit_raw: 'Review the router configuration to ensure FEC0::/10 IP addresses are not defined.

    If FEC0::/10 IP addresses are defined, this is a finding.'
