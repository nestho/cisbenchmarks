    \ …\n }\n lo0 {\n unit 0 {\n family inet {\n address 2.2.2.2/32;\n }\n }\n }\n}\nVerify that the loopback interface is\
    \ used as the source address for all iBGP sessions.\nprotocols {\n bgp {\n …\n …\n …\n }\ngroup IBGP_PEERS {\n type internal;\n\
    \ local-address 2.2.2.2;\n neighbor x.x.x.x;\n}\nIf the router does not use its loopback address as the source address\
