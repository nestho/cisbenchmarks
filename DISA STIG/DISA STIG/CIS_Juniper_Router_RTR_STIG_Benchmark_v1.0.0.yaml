  title: JUNI-RT-000580
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper MPLS router must be configured to synchronize IGP and LDP to minimize packet loss when an IGP
    adjacency is established prior to LDP peers completing label exchange. GROUP ID: V-217064 RULE ID: SV-217064r604135'
  rationale: Packet loss can occur when an IGP adjacency is established and the router begins forwarding packets using the
    new adjacency before the LDP label exchange completes between the peers on that link. Packet loss can also occur if an
    LDP session closes and the router continues to forward traffic using the link associated with the LDP peer rather than
    an alternate pathway with a fully synchronized LDP session. The MPLS LDP-IGP Synchronization feature provides a means
    to synchronize LDP with OSPF or IS-IS to minimize MPLS packet loss. When an IGP adjacency is established on a link but
    LDPIGP synchronization is not yet achieved or is lost, the IGP will advertise the max-metric on that link.
