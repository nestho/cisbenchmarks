  rationale: Accepting route advertisements for Bogon prefixes can result in the local autonomous system (AS) becoming a transit
    for malicious traffic as it will in turn advertise these prefixes to neighbor autonomous systems.
  impact: ''
  references: []
  page_start: 162
  audit_raw: "Review the router configuration to verify that it will reject BGP routes for any Bogon\nprefixes.\nVerify a\
    \ prefix list has been configured containing the current Bogon prefixes as shown\nin the example below.\npolicy-options\
    \ {\n prefix-list BOGON_PREFIXES {\n 0.0.0.0/8;\n 10.0.0.0/8;\n 100.64.0.0/10;\n 127.0.0.0/8;\n 169.254.0.0/16;\n 172.16.0.0/12;\n\
    \ 192.0.0.0/24;\n 192.0.2.0/24;\n 192.168.0.0/16;\n 198.18.0.0/15;\n 198.51.100.0/24;\n 203.0.113.0/24;\n 224.0.0.0/4;\n\
    \ 240.0.0.0/4;\n }\n}\nVerify that a policy has been configured to reject the Bogon prefixes.\npolicy-options {\n…\n…\n\
    …\npolicy-statement FILTER_ROUTES {\nterm REJECT_BOGONS {\nfrom {\nprefix-list BOGON_PREFIXES;\n}\nthen reject;\n}\nterm\
