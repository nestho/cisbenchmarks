    \ }\n }\n }\nIf the router is not configured to filter traffic entering the network at all external interfaces\nin an\
    \ inbound direction, this is a finding."
  remediation: 'This requirement is not applicable for the DoDIN Backbone.

    Configure the router to use an inbound filter on all external interfaces as shown in the

    example below.

    [edit interfaces ge-0/0/0 unit 0 family inet]

    set filter input INBOUND_FILTER'
  checks:
  - type: manual_review
    info: "This requirement is not applicable for the DoDIN Backbone.\nReview the router configuration to verify that an inbound\
