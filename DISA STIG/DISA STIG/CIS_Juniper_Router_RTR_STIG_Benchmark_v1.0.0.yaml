- id: '1.32'
  title: JUNI-RT-000360
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper perimeter router must be configured to have Link Layer Discovery Protocol (LLDP) disabled on all
    external interfaces. GROUP ID: V-217041 RULE ID: SV-217041r604135'
  rationale: LLDPs are primarily used to obtain protocol addresses of neighboring devices and discover platform capabilities
    of those devices. Use of SNMP with the LLDP Management Information Base (MIB) allows network management applications to
    learn the device type and the SNMP agent address of neighboring devices, thereby enabling the application to send SNMP
    queries to those devices. LLDPs are also media- and protocol-independent as they run over the data link layer; therefore,
    two systems that support different network-layer protocols can still learn about each other. Allowing LLDP messages to
    reach external network nodes is dangerous as it provides an attacker a method to obtain information of the network infrastructure
    that can be useful to plan an attack.
  impact: ''
  references: []
  page_start: 102
  audit_raw: "This requirement is not applicable for the DoDIN Backbone.\nReview all router configurations to ensure LLDP\
    \ is not enabled external interface.\nprotocols {\n …\n …\n …\n lldp {\n advertisement-interval 30;\n interface all;\n\
    \ }\n}\nIf LLDP is configured globally or on any external interface, this is a finding."
  remediation: 'This requirement is not applicable for the DoDIN Backbone.

    Disable LLDP on all external interfaces. If necessary, remove the interface all parameter

    and define all internal interfaces as shown in the example below.

    [edit protocols lldp]

    delete interface all

    set interface ge-0/1/0

    set interface ge-0/1/1'
  checks:
  - type: manual_review
    info: "This requirement is not applicable for the DoDIN Backbone.\nReview all router configurations to ensure LLDP is\
      \ not enabled external interface.\nprotocols {\n …\n …\n …\n lldp {\n advertisement-interval 30;\n interface all;\n\
      \ }\n}\nIf LLDP is configured globally or on any external interface, this is a finding."
    severity: medium
- id: '1.33'
  title: JUNI-RT-000370
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper perimeter router must be configured to have Proxy ARP disabled on all external interfaces. GROUP
    ID: V-217042 RULE ID: SV-217042r604135'
  rationale: When Proxy ARP is enabled on a router, it allows that router to extend the network (at Layer 2) across multiple
    interfaces (LAN segments). Because proxy ARP allows hosts from different LAN segments to look like they are on the same
    segment, proxy ARP is only safe when used between trusted LAN segments. Attackers can leverage the trusting nature of
    proxy ARP by spoofing a trusted host and then intercepting packets. Proxy ARP should always be disabled on router interfaces
    that do not require it, unless the router is being used as a LAN bridge.
  impact: ''
  references: []
  page_start: 104
  audit_raw: "Review the router configuration to determine if IP Proxy ARP is disabled on all external\ninterfaces.\ninterfaces\
    \ {\n description \"NIPRNet\";\n ge-0/0/0 {\n unit 0 {\n proxy-arp restricted;\n family inet {\nIf IP Proxy ARP is enabled\
    \ on any external interface, this is a finding."
  remediation: 'This requirement is not applicable for the DoDIN Backbone.

    Disable Proxy ARP on all external interfaces as shown in the example below.

    [edit interfaces em0 unit 0]

    delete proxy-arp restricted'
  checks:
