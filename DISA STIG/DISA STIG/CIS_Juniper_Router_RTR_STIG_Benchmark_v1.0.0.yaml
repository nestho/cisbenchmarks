      If J-web is not used for administrative access, the web-management services must not\nbe configured as shown below.\n\
      If DHCP server is not being deployed on the router, the command dhcp-local-server\nmust not be configured as shown below.\n\
      system {\n …\n …\n …\n services {\n web-man"
    severity: medium
- id: '1.8'
  title: JUNI-RT-000120
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to protect against or limit the effects of denial-ofservice (DoS) attacks
    by employing control plane protection. GROUP ID: V-217018 RULE ID: SV-217018r604135'
  rationale: The Routing Engine (RE) is critical to all network operations because it is the component used to build all forwarding
    paths for the data plane via control plane processes. It is also instrumental with ongoing network management functions
    that keep the routers and links available for providing network services. Any disruption to the RP or the control and
    management planes can result in mission-critical network outages. A DoS attack targeting the RE can result in excessive
    CPU and memory utilization. To maintain network stability and RP security, the router must be able to handle specific
    control plane and management plane traffic that is destined to the RE. In the past, one method of filtering was to use
    ingress filters on forwarding interfaces to filter both forwarding path and receiving path traffic. However, this method
    does not scale well as the number of interfaces grows and the size of the ingress filters grows. Control plane policing
    increases the security of routers and multilayer switches by protecting the RE from unnecessary or malicious traffic.
    Filtering and rate limiting the traffic flow of control plane packets can be implemented to protect routers against reconnaissance
    and DoS attacks, allowing the control plane to maintain packet forwarding and protocol states despite an attack or heavy
    load on the router or multilayer switch.
  impact: ''
  references: []
  page_start: 40
  audit_raw: "Determine whether control plane protection has been implemented on the router.\nVerify that a CoPP policy has\
    \ been configured that classifies traffic types into levels of\nimportance.\nfirewall {\n family inet {\n…\n…\n…\n }\n\
    \ filter CoPP_Policy {\n term CRITICAL {\n from {\n protocol [ ospf pim tcp ];\n source-port bgp;\n destination-port bgp;\n\
    \ }\n then policer CRITICAL_POLICER;\n }\n term IMPORTANT {\n from {\n protocol [ tcp udp ];\n destination-port [ ssh\
    \ tacacs snmp ntp ];\n }\n then {\n policer IMPORTANT_POLICER;\n }\n }\n term NORMAL {\n from {\n protocol icmp;\n icmp-type\
    \ [ echo-reply echo-request ];\n icmp-code [ port-unreachable ttl-eq-zero-during-transit ];\n }\n then policer NORMAL_POLICER;\n\
    \ }\n term UNDESIRABLE {\n from {\n protocol udp;\n }\n then policer UNDESIRABLE_POLICER;\n }\n term ALL-OTHER {\n from\
    \ {\n address {\n 0.0.0.0/0;\n }\n }\n then policer ALL-OTHER_POLICER;\n }\n }\n}\nVerify that policers have been configured\
    \ to rate limit traffic types.\nfirewall {\n family inet {\n…\n…\n…\n }\n policer CRITICAL_POLICER {\n filter-specific;\n\
    \ if-exceeding {\n bandwidth-limit 3m;\n burst-size-limit 4k;\n }\n then discard;\n }\n policer IMPORTANT_POLICER {\n\
    \ filter-specific;\n if-exceeding {\n bandwidth-limit 400k;\n burst-size-limit 1500;\n }\n then discard;\n }\n policer\
    \ NORMAL_POLICER {\n filter-specific;\n if-exceeding {\n bandwidth-limit 55k;\n burst-size-limit 1500;\n }\n then discard;\n\
    \ }\n policer UNDESIRABLE_POLICER {\n filter-specific;\n if-exceeding {\n bandwidth-limit 32k;\n burst-size-limit 1500;\n\
    \ }\n then discard;\n }\n policer ALL-OTHER_POLICER {\n filter-specific;\n if-exceeding {\n bandwidth-limit 40k;\n burst-size-limit\
    \ 1500;\n }\n then discard;\n }\nVerify that the CoPP policy has been applied to the loopback interface as\nshown in the\
    \ example below.\ninterfaces {\n…\n…\n…\n lo0 {\n unit 0 {\n family inet {\n filter {\n input CoPP_Policy;\n }\n address\
    \ 2.2.2.2/32;\n }\n }\n }\n}\nNote: Several Juniper router platforms provide a DDoS Protection feature that is\nconfigured\
    \ at the system hierarchy via set ddos-protection commands.\nIf the router does not have control plane protection implemented,\
    \ this is a finding."
  remediation: 'Implement control plane protection by classifying traffic types based on importance and

    rate limit the traffic accordingly as shown in the example below.

    Create filters for critical, important, normal, and undesirable traffic.

    set firewall filter CoPP_Policy term CRITICAL from protocol ospf

    set firewall filter CoPP_Policy term CRITICAL from protocol pim

    set firewall filter CoPP_Policy term CRITICAL from protocol tcp destinationport bgp

    set firewall filter CoPP_Policy term CRITICAL from protocol tcp source-port

    bgp

    set firewall filter CoPP_Policy term CRITICAL then policer CRITICAL_POLICER

    set firewall filter CoPP_Policy term IMPORTANT from protocol tcp destinationport ssh

    set firewall filter CoPP_Policy term IMPORTANT from protocol tcp destinationport tacacs

    set firewall filter CoPP_Policy term IMPORTANT from protocol tcp destinationport snmp

    set firewall filter CoPP_Policy term IMPORTANT from protocol tcp destinationport ntp

    set firewall filter CoPP_Policy term IMPORTANT then policer IMPORTANT_POLICER

    set firewall filter CoPP_Policy term NORMAL from protocol icmp icmp-code ttleq-zero-during-transit

    set firewall filter CoPP_Policy term NORMAL from protocol icmp icmp-code

    port-unreachable

    set firewall filter CoPP_Policy term NORMAL from protocol icmp icmp-type

    echo-reply

    set firewall filter CoPP_Policy term NORMAL from protocol icmp icmp-type

    echo-request

    set firewall filter CoPP_Policy term NORMAL then policer NORMAL_POLICER

    set firewall filter CoPP_Policy term UNDESIRABLE from protocol udp

    set firewall filter CoPP_Policy term UNDESIRABLE then policer

    UNDESIRABLE_POLICER

    set firewall filter CoPP_Policy term ALL-OTHER from address 0.0.0.0/0

    set firewall filter CoPP_Policy term ALL-OTHER then policer ALL-OTHER_POLICER

    Create policers for each traffic type to limit bandwidth.

    set firewall policer CRITICAL_POLICER filter-specific

    set firewall policer CRITICAL_POLICER if-exceeding bandwidth-limit 3000000

    burst-size-limit 4000

    set firewall policer CRITICAL_POLICER then discard

    set firewall policer IMPORTANT_POLICER filter-specific

    set firewall policer IMPORTANT_POLICER if-exceeding bandwidth-limit 400000

    burst-size-limit 1500

    set firewall policer IMPORTANT_POLICER then discard

    set firewall policer NORMAL_POLICER filter-specific

    set firewall policer NORMAL_POLICER if-exceeding bandwidth-limit 55000 burstsize-limit 150000

    set firewall policer NORMAL_POLICER then discard

    set firewall policer UNDESIRABLE_POLICER filter-specific

    set firewall policer UNDESIRABLE_POLICER if-exceeding bandwidth-limit 32000

    burst-size-limit 1500

    set firewall policer UNDESIRABLE_POLICER then discard

    set firewall policer ALL-OTHER_POLICER filter-specific

    set firewall policer ALL-OTHER_POLICER if-exceeding bandwidth-limit 40000

    burst-size-limit 1500

    set firewall policer ALL-OTHER_POLICER then discard

    Apply the CoPP policy to the loopback interface.

    set interface lo0 unit 0 family inet filter input CoPP_Policy

    Note: Several Juniper router platforms provide a DDoS Protection feature that is

    configured at the system hierarchy via set ddos-protection commands.'
  checks:
  - type: manual_review
    info: "Determine whether control plane protection has been implemented on the router.\nVerify that a CoPP policy has been\
      \ configured that classifies traffic types into levels of\nimportance.\nfirewall {\n family inet {\n…\n…\n…\n }\n filter\
      \ CoPP_Policy {\n term CRITICAL {\n from {\n protocol [ ospf pim tcp ];\n source-port bgp;\n destination-port bgp;\n\
      \ }\n then policer CRITICAL_POLICER;\n }\n term IMPORTANT {\n from {\n protocol [ tcp udp ];\n destination-port [ ssh\
      \ tacacs snmp ntp ];\n }\n then {\n policer IMPORTANT_POLICER"
    severity: medium
- id: '1.9'
  title: JUNI-RT-000130
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper router must be configured to restrict traffic destined to itself. GROUP ID: V-217019 RULE ID:
    SV-217019r604135'
  rationale: The Routing Engine handles traffic destined to the router—the key component used to build forwarding paths and
    is instrumental with all network management functions. Hence, any disruption or DoS attack to the Routing Engine can result
    in mission critical network outages.
  impact: ''
  references: []
  page_start: 46
  audit_raw: "Review the filter for the router’s receive path and verify that it will only allow specific\nmanagement plane\
    \ traffic from specific sources.\nVerify filter has been configured as shown in the example below.\nfirewall {\n family\
    \ inet {\n …\n …\n …\n }\n filter DESTINED_TO_RE {\n term ALLOW_OSPF {\n from {\n protocol ospf;\n }\n then accept;\n\
    \ }\n term ALLOW_BGP {\n from {\n source-address {\n 11.1.12.1/32;\n 11.1.23.3/32;\n 11.1.25.5/32;\n }\n protocol tcp;\n\
    \ port bgp;\n }\n }\n term FILTER_TCP {\n from {\n destination-address {\n 11.1.12.0/24;\n }\n protocol tcp;\n destination-port\
    \ [ ssh tacacs telnet ];\n }\n then accept;\n }\n term FILTER_UDP {\n from {\n destination-address {\n 11.1.12.0/24;\n\
    \ }\n protocol udp;\n destination-port [ntp snmp ];\n }\n then accept;\n }\n term ICMP_ANY {\n from {\n protocol icmp;\n\
    \ }\n then accept;\n }\n term DENY_BY_DEFAULT {\n then {\n log;\n discard;\n }\n }\n }\n }\nVerify that the input filter\
    \ has been applied to loopback interface as shown\nin the example below.\ninterfaces {\n…\n…\n…\n lo0 {\n unit 0 {\n family\
    \ inet {\n filter {\n input-list [ DESTINED_TO_RE CoPP_Policy ];\n }\n address 2.2.2.2/32;\n }\n }\n }\n}\nIf the router\
    \ is not configured with a receive-path filter to restrict traffic destined to itself,\nthis is a finding"
  remediation: 'Configure the router’s receive path filters to restrict traffic destined to the router.

    Configure a filter to define what traffic should be received by the Routing Engine.

    [edit firewall family inet]

    set filter DESTINED_TO_RP term FILTER_TCP from destination-address

    11.1.12.0/24

    set filter DESTINED_TO_RP term FILTER_TCP from protocol tcp destination-port

    ssh

    set filter DESTINED_TO_RP term FILTER_TCP from protocol tcp destination-port

    tacacs

    set filter DESTINED_TO_RP term FILTER_TCP then accept

    set filter DESTINED_TO_RP term FILTER_UDP from destination-address

    11.1.12.0/24

    set filter DESTINED_TO_RP term FILTER_UDP from protocol udp destination-port

    ntp

    set filter DESTINED_TO_RP term FILTER_UDP from protocol udp destination-port

    snmp

    set filter DESTINED_TO_RP term FILTER_UDP then accept

    set filter DESTINED_TO_RP term ICMP_ANY from protocol icmp

    set filter DESTINED_TO_RP term ICMP_ANY from protocol icmp then accept

    set filter DESTINED_TO_RP term DENY_BY_DEFAULT then log discard

    Apply the filter to the loopback interface.

    [edit interfaces lo0 unit 0 family inet]

    set filter input-list DESTINED_TO_RP.'
  checks:
  - type: manual_review
    info: "Review the filter for the router’s receive path and verify that it will only allow specific\nmanagement plane traffic\
      \ from specific sources.\nVerify filter has been configured as shown in the example below.\nfirewall {\n family inet\
      \ {\n …\n …\n …\n }\n filter DESTINED_TO_RE {\n term ALLOW_OSPF {\n from {\n protocol ospf;\n }\n then accept;\n }\n\
