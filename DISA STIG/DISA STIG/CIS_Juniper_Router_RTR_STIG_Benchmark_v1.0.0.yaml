    set filter FILTER_INBOUND term DENY_BY_DEFAULT then syslog discard

    Configure logging to record packets being dropped by firewall filters as shown in the

    example below.

    [edit system syslog]

    set file LOG_FILE firewall any

    Note: The “any” parameter can be configured in lieu of the “firewall” parameter.'
  checks:
  - type: manual_review
    info: "Review all filters to verify that packets that are discarded or rejected are logged as\nshown in the configuration\
      \ below.\nfirewall {\n family inet {\n filter XYZ\n …\n …\n …\n }\n term DENY_BY_DEFAULT {\n then {\n syslog;\n discard;\n\
      \ }\n }\n }\n }\nVerify that logging is enabled to capture packets that are dropped as shown\nin the configuration below.\n\
      system {\n host-name XYZ;\n …\n …\n …\n }\n syslog {\n file LOG_FILE {\n firewall any;\n }\n }\n}\nNote: The “any” parameter\
      \ can be configured in lieu of the “firewall” param"
    severity: medium
- id: '1.16'
  title: JUNI-RT-000210
