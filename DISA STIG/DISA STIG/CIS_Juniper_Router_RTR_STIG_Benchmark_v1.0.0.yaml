- id: '1.53'
  title: JUNI-RT-000500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper BGP router must be configured to reject inbound route advertisements from a customer edge (CE)
    Juniper router for prefixes that are not allocated to that customer. GROUP ID: V-217055 RULE ID: SV-217055r604135'
  rationale: As a best practice, a service provider should only accept customer prefixes that have been assigned to that customer
    and any peering autonomous systems. A multi-homed customer with BGP speaking routers connected to the Internet or other
    external networks could be breached and used to launch a prefix de-aggregation attack. Without ingress route filtering
    of customers, the effectiveness of such an attack could impact the entire IP core and its customers.
  impact: ''
  references: []
  page_start: 168
  audit_raw: "Review the router configuration to verify that there are filters defined to only accept\nroutes for prefixes\
    \ that belong to specific customers.\nVerify prefix list has been configured containing prefixes belonging to each customer\
    \ as\nshown in the example below.\npolicy-options {\n …\n …\n …\n prefix-list CUST1_PREFIXES {\n x.x.x.x/24;\n x.x.x.x/24;\n\
    \ }\n prefix-list CUST2_PREFIXES {\n x.x.x.x/24;\n }\nVerify that a policy has been configured to only accept routes belonging\
    \ to the\ncustomer.\npolicy-options {\n …\n …\n …\n policy-statement FILTER_CUST1_ROUTES {\n term ACCEPT-ROUTES {\n from\
    \ {\n prefix-list CUST1_PREFIXES;\n }\n then accept;\n }\n term REJECT_OTHER {\n then reject;\n }\n }\n policy-statement\
    \ FILTER_CUST2_ROUTES {\n term ACCEPT_ROUTES {\n from {\n prefix-list CUST2_PREFIXES;\n }\n then accept;\n }\n term REJECT_OTHER\
    \ {\n then reject;\n }\n }\n}\nVerify that the configured policy to filter customer prefixes has been applied to customer\n\
    BGP peers as shown in the example below.\nprotocols {\n bgp {\n …\n …\n …\n }\n group CUST1 {\n type external;\n import\
    \ FILTER_CUST1_ROUTES;\n peer-as 55;\n neighbor x.x.x.x;\n neighbor x.x.x.x;\n }\n group CUST2 {\n type external;\n import\
    \ FILTER_CUST2_ROUTES;\n peer-as 44;\n neighbor x.x.x.x;\n neighbor x.x.x.x;\n }\n }\n …\n …\n …\n}\nNote: Routes to PE-CE\
    \ links within a VPN are needed for troubleshooting end-to-end\nconnectivity across the MPLS/IP backbone. Hence, these\
    \ prefixes are an exception to\nthis requirement.\nIf the router is not configured to reject inbound route advertisements\
    \ from each CE\nrouter for prefixes that are not allocated to that customer, this is a finding."
  remediation: 'Configure the router to reject inbound route advertisements from a CE router for

    prefixes that are not allocated to that customer.

    Configure a prefix list containing prefixes belonging to the customers.

    [edit policy-options]

    set prefix-list CUST1_PREFIXES x.x.x.x/24

    set prefix-list CUST1_PREFIXES x.x.x.x/24

    set prefix-list CUST2_PREFIXES x.x.x.x/24

    set prefix-list CUST2_PREFIXES x.x.x.x/24

    Configure a policy-statement to filter customer routes.

    set policy-statement FILTER_CUST1_ROUTES term ACCEPT_ROUTES from prefix-list

    CUST1_PREFIXES

    set policy-statement FILTER_CUST1_ROUTES term then accept

    set policy-statement FILTER_CUST1_ROUTES term REJECT_OTHER then reject

    set policy-statement FILTER_CUST2_ROUTES term ACCEPT_ROUTES from prefix-list

    CUST2_PREFIXES

    set policy-statement FILTER_CUST2_ROUTES term then accept

    set policy-statement FILTER_CUST2_ROUTES term REJECT_OTHER then reject

    Apply the import policy to filter received routes for each customer group.

    [edit protocols bgp group CUST1]

    set import FILTER_CUST1_ROUTES

    [edit protocols bgp group CUST2]

    set import FILTER_CUST2_ROUTES'
