- id: '1.34'
  title: JUNI-RT-000380
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper perimeter router must be configured to block all outbound management traffic. GROUP ID: V-217043
    RULE ID: SV-217043r604135'
  rationale: For in-band management, the management network must have its own subnet in order to enforce control and access
    boundaries provided by Layer 3 network nodes, such as routers and firewalls. Management traffic between the managed network
    elements and the management network is routed via the same links and nodes as that used for production or operational
    traffic. Safeguards must be implemented to ensure that the management traffic does not leak past the perimeter of the
    managed network.
  impact: ''
  references: []
  page_start: 106
  audit_raw: "This requirement is not applicable for the DoDIN Backbone.\nThe perimeter router of the managed network must\
    \ be configured with an outbound filter\non the egress interface to block all management traffic as shown in the example\
    \ below.\nVerify that the router has been configured with an outbound filter as shown in the\nexample below.\ninterfaces\
    \ {\n description \"NIPRNet\";\n ge-0/0/0 {\n unit 0 {\n family inet {\n no-redirects;\n filter {\n output OUTBOUND_FILTER;\n\
    \ }\n address 10.1.12.2/24;\n }\n }\n }\nVerify that the outbound filter discard or rejects management traffic as shown\
