- id: '1.28'
  title: JUNI-RT-000320
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper perimeter router must be configured to filter traffic destined to the enclave in accordance with
    the guidelines contained in DoD Instruction 8551.1. GROUP ID: V-217037 RULE ID: SV-217037r604135'
  rationale: Vulnerability assessments must be reviewed by the System Administrator, and protocols must be approved by the
    Information Assurance (IA) staff before entering the enclave. Access control lists (ACLs) are the first line of defense
    in a layered security approach. They permit authorized packets and deny unauthorized packets based on port or service
    type. They enhance the posture of the network by not allowing packets to reach a potential target within the security
    domain. The lists provided are highly susceptible ports and services that should be blocked or limited as much as possible
    without adversely affecting customer requirements. Auditing packets attempting to penetrate the network but that are stopped
    by an ACL will allow network administrators to broaden their protective ring and more tightly define the scope of operation.
    If the perimeter is in a Deny-by-Default posture and what is allowed through the filter is in accordance with DoD Instruction
    8551.1, and if the permit rule is explicitly defined with explicit ports and protocols allowed, then all requirements
    related to PPS being blocked would be satisfied.
  impact: ''
  references: []
  page_start: 92
  audit_raw: "This requirement is not applicable for the DoDIN Backbone.\nReview the router configuration to verify that the\
    \ ingress filter is in accordance with DoD\n8551.\nVerify that an inbound filter is configured on all external interfaces.\n\
    interfaces {\n ge-0/0/0 {\n unit 0 {\n family inet {\n filter {\n input INBOUND_FILTER;\n }\n address 11.1.12.2/24;\n\
    \ }\n }\n }\nReview the inbound filter to verify that it is filtering traffic in accordance with DoD 8551.\nfirewall {\n\
    \ family inet {\n filter INBOUND_FILTER {\n term ALLOW_ABC {\n from {\n protocol tcp;\n destination-port abc;\n }\n then\
    \ accept;\n }\n term ALLOW_XYZ {\n from {\n protocol xyz;\n }\n then accept;\n }\n term DENY_ALL_OTHER {\n then {\n syslog;\n\
    \ reject;\n }\n }\n }\n}\nIf the router does not filter traffic in accordance with the guidelines contained in DoD\n8551,\
    \ this is a finding."
  remediation: 'This requirement is not applicable for the DoDIN Backbone.

    Configure the router to use an inbound filter on all external interfaces as shown in the

    example below to restrict traffic in accordance with the guidelines contained in DOD

    Instruction 8551.1.

