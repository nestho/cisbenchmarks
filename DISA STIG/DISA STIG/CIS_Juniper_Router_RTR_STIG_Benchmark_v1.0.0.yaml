- id: '1.69'
  title: JUNI-RT-000650
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper PE router providing MPLS Virtual Private Wire Service (VPWS) must be configured to have the appropriate
    virtual circuit identification (VC ID) for each attachment circuit. GROUP ID: V-217071 RULE ID: SV-217071r604135'
  rationale: VPWS is an L2VPN technology that provides a virtual circuit between two PE routers to forward Layer 2 frames
    between two customer-edge routers or switches through an MPLS-enabled IP core. The ingress PE router (virtual circuit
    head-end) encapsulates Ethernet frames inside MPLS packets using label stacking and forwards them across the MPLS network
    to the egress PE router (virtual circuit tail-end). During a virtual circuit setup, the J-PE routers exchange VC label
    bindings for the specified VC ID. The VC ID specifies a pseudowire associated with an ingress and egress PE router and
    the customer-facing attachment circuits. To guarantee that all frames are forwarded onto the correct pseudowire and to
    the correct customer and attachment circuits, it is imperative that the correct VC ID is configured for each attachment
    circuit.
  impact: ''
  references: []
  page_start: 210
  audit_raw: "Review the ingress and egress PE router configuration for each virtual circuit that has\nbeen provisioned.\n\
