    severity: medium
- id: '1.15'
  title: JUNI-RT-000200
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper router must be configured to log all packets that have been dropped. GROUP ID: V-217025 RULE ID:
    SV-217025r604135'
  rationale: Auditing and logging are key components of any security architecture. It is essential for security personnel
    to know what is being done or attempted to be done, and by whom, to compile an accurate risk assessment. Auditing the
    actions on network devices provides a means to recreate an attack or identify a configuration mistake on the device.
  impact: ''
  references: []
  page_start: 61
  audit_raw: "Review all filters to verify that packets that are discarded or rejected are logged as\nshown in the configuration\
    \ below.\nfirewall {\n family inet {\n filter XYZ\n …\n …\n …\n }\n term DENY_BY_DEFAULT {\n then {\n syslog;\n discard;\n\
    \ }\n }\n }\n }\nVerify that logging is enabled to capture packets that are dropped as shown\nin the configuration below.\n\
    system {\n host-name XYZ;\n …\n …\n …\n }\n syslog {\n file LOG_FILE {\n firewall any;\n }\n }\n}\nNote: The “any” parameter\
    \ can be configured in lieu of the “firewall” parameter.\nIf packets being dropped are not logged, this is a finding."
  remediation: 'Configure the firewall terms that discards or rejects packets to log the action as shown

    in the example below.

