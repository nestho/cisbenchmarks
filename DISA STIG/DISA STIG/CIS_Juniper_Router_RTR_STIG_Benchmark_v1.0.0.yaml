  checks:
  - type: manual_review
    info: 'Review the router configuration to ensure FEC0::/10 IP addresses are not defined.

      If FEC0::/10 IP addresses are defined, this is a finding.'
    severity: medium
- id: '1.20'
  title: JUNI-RT-000240
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper perimeter router must be configured to deny network traffic by default and allow network traffic
    by exception. GROUP ID: V-217029 RULE ID: SV-217029r604135'
  rationale: A deny-all, permit-by-exception network communications traffic policy ensures that only connections that are
    essential and approved are allowed. This requirement applies to both inbound and outbound network communications traffic.
    All inbound and outbound traffic must be denied by default. Firewalls and perimeter routers should only allow traffic
    through that is explicitly permitted. The initial defense for the internal network is to block any traffic at the perimeter
    that is attempting to make a connection to a host residing on the internal network. In addition, allowing unknown or undesirable
    outbound traffic by the firewall or router will establish a state that will permit the return of this undesirable traffic
    inbound.
  impact: ''
  references: []
  page_start: 71
  audit_raw: "This requirement is not applicable for the DoDIN Backbone.\nReview the router configuration to verify that the\
    \ inbound filter applied to all external\ninterfaces is configured to allow specific ports and protocols and deny all\
    \ other traffic.\nVerify that an inbound filter is applied to all external interfaces as shown in the example\nbelow.\n\
    interfaces {\n ge-0/0/0 {\n unit 0 {\n family inet {\n filter {\n input FILTER_INBOUND_TRAFFIC;\n }\n address 11.1.12.2/24;\n\
    \ }\n }\n }\nReview inbound filters to verify that the ending term is configured to deny all other traffic\nthat is not\
    \ explicitly allowed.\nfirewall {\n family inet {\n filter FILTER_INBOUND_TRAFFIC {\n term ALLOW_BGP {\n from {\n destination-address\
    \ {\n 11.1.24.0/24;\n }\n protocol tcp;\n destination-port bgp;\n }\n then accept;\n }\n …\n …\n …\n term ALLOW_XYZ {\n\
    \ from {\n protocol xyz;\n }\n then accept;\n }\n term DENY_ALL_OTHER {\n then {\n syslog;\n discard;\n }\n }\n }\nIf\
    \ the filter is not configured to allow specific ports and protocols and deny all other\ntraffic, this is a finding.\n\
    If the filter is not configured inbound on all external interfaces, this is a finding."
  remediation: 'This requirement is not applicable for the DoDIN Backbone.

    Configure a term at the end of the inbound filter to deny all other traffic by default as

    shown in the example below.

    [edit firewall family inet]

    set filter FILTER_INBOUND_TRAFFIC term DENY_ALL_OTHER then syslog discard'
  checks:
  - type: manual_review
    info: "This requirement is not applicable for the DoDIN Backbone.\nReview the router configuration to verify that the\
      \ inbound filter applied to all external\ninterfaces is configured to allow specific ports and protocols and deny all\
      \ other traffic.\nVerify that an inbound filter is applied to all external interfaces as shown in the example\nbelow.\n\
      interfaces {\n ge-0/0/0 {\n unit 0 {\n family inet {\n filter {\n input FILTER_INBOUND_TRAFFIC;\n }\n address 11.1.12.2/24;\n\
      \ }\n }\n }\nReview inbound filters to verify th"
    severity: medium
- id: '1.21'
  title: JUNI-RT-000250
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper perimeter router must be configured to enforce approved authorizations for controlling the flow
    of information between interconnected networks in accordance with applicable policy. GROUP ID: V-217030 RULE ID: SV-217030r604135'
  rationale: Information flow control regulates authorized information to travel within a network and between interconnected
    networks. Controlling the flow of network traffic is critical so it does not introduce any unacceptable risk to the network
    infrastructure or data. An example of a flow control restriction is blocking outside traffic claiming to be from within
    the organization. For most routers, internal information flow control is a product of system design.
  impact: ''
  references: []
  page_start: 74
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to verify that filters\
    \ are configured to allow or deny traffic\nfor specific source and destination addresses as well as ports and protocols.\
    \ In the\nexample below, the router is peering BGP with DISN. ICMP echo and echo-reply\npackets are allowed for troubleshooting\
    \ connectivity. WWW traffic is permitted inbound\nto the NIPRnet host-facing web server (x.12.1.22).\nStep 1: Verify that\
    \ external interface has an inbound filter configured as shown in the\nexample below:\ninterfaces {\n ge-0/0/0 {\n unit\
    \ 0 {\n family inet {\n filter {\n input FILTER_INBOUND_TRAFFIC;\n }\n address x.1.12.2/30;\n }\n }\n }\nStep 2: Verify\
    \ that the inbound filter allows only traffic that is to be permitted into the\nnetwork as shown in the example below:\n\
    firewall {\n family inet {\n filter FILTER_INBOUND_TRAFFIC {\n term TCP_ESTABLISHED {\n from {\n tcp-established;\n }\n\
    \ then accept;\n }\n term ALLOW_BGP {\n from {\n source-address {\n x.1.12.1/32;\n }\n protocol tcp;\n destination-port\
    \ bgp;\n }\n then accept;\n }\n term ALLOW_PING {\n from {\n protocol icmp;\n icmp-type [ echo-reply echo-request ];\n\
    \ }\n then accept;\n }\n term ALLOW_WWW {\n from {\n destination-address {\n x.12.1.22/32;\n }\n protocol tcp;\n destination-port\
    \ http;\n }\n then accept;\n }\n term DENY_ALL_OTHER {\n then {\n syslog;\n reject;\n }\n }\n }\n }\n}\nIf the router\
    \ is not configured to enforce approved authorizations for controlling the flow\nof information within the network based\
    \ on organization-defined information flow control\npolicies, this is a finding."
  remediation: 'This requirement is not applicable for the DODIN Backbone.

    [edit firewall family inet]

    set filter FILTER_INBOUND_TRAFFIC term TCP_ESTABLISHED from tcp-established

    set filter FILTER_INBOUND_TRAFFIC term TCP_ESTABLISHED then accept

    set filter FILTER_INBOUND_TRAFFIC term ALLOW_BGP from source-address

    x.1.12.1/32

    set filter FILTER_INBOUND_TRAFFIC term ALLOW_BGP from protocol tcp

    set filter FILTER_INBOUND_TRAFFIC term ALLOW_BGP from destination-port bgp

    set filter FILTER_INBOUND_TRAFFIC term ALLOW_BGP then accept

    set filter FILTER_INBOUND_TRAFFIC term ALLOW_PING from protocol icmp

    set filter FILTER_INBOUND_TRAFFIC term ALLOW_PING from icmp-type echo-reply

    set filter FILTER_INBOUND_TRAFFIC term ALLOW_PING from icmp-type echo-request

    set filter FILTER_INBOUND_TRAFFIC term ALLOW_PING then accept

    set filter FILTER_INBOUND_TRAFFIC term ALLOW_WWW from destination-address

    x.12.1.22/32

    set filter FILTER_INBOUND_TRAFFIC term ALLOW_WWW from protocol tcp

    set filter FILTER_INBOUND_TRAFFIC term ALLOW_WWW from destination-port http

    set filter FILTER_INBOUND_TRAFFIC term ALLOW_WWW then accept

    set filter FILTER_INBOUND_TRAFFIC term DENY_ALL_OTHER then syslog

    set filter FILTER_INBOUND_TRAFFIC term DENY_ALL_OTHER then reject

    Step 2: Apply the filter inbound on all applicable interfaces.

    [edit interfaces ge-0/0/0 unit 0 family inet]

    set filter input FILTER_INBOUND_TRAFFIC'
  checks:
  - type: manual_review
    info: 'This requirement is not applicable for the DODIN Backbone.

      Review the router configuration to verify that filters are configured to allow or deny traffic

