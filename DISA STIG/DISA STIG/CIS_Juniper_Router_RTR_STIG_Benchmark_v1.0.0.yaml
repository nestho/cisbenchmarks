  description: 'The Juniper BGP router must be configured to reject inbound route advertisements for any prefixes belonging
    to the local autonomous system (AS). GROUP ID: V-217054 RULE ID: SV-217054r604135'
  rationale: Accepting route advertisements belonging to the local AS can result in traffic looping or being black holed,
    or at a minimum using a non-optimized path.
  impact: ''
  references: []
  page_start: 165
  audit_raw: "Review the router configuration to verify that it will reject routes belonging to the local\nAS.\nVerify a prefix\
