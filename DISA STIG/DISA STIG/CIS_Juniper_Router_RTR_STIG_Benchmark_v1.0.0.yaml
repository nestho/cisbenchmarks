      key-chain BGP_KEY {

      key 1 {

      secret "$8$PTQnhclvMX3687"; ## SECRET-DATA

      start-time "2018-5-1.12:00:00 +0000";

      }

      key 2 {

      secret "$8$iq.5OBESyKfTlM"; ## SECRET-DATA

      start-time "2018-9-1.12:00:00 +0000";

      }

      key 3 {

      secret "$8$ZADjqAtOIRSk.hr"; ## SECRET-DATA

      '
    severity: medium
- id: '1.4'
  title: JUNI-RT-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to authenticate all routing protocol messages using NIST-validated FIPS
    140-2 message authentication code algorithm. GROUP ID: V-217015 RULE ID: SV-217015r604135'
  rationale: A rogue router could send a fictitious routing update to convince a site's perimeter router to send traffic to
    an incorrect or even a rogue destination. This diverted traffic could be analyzed to learn confidential information about
    the site's network or used to disrupt the network's ability to communicate with other networks. This is known as a "traffic
    attraction attack" and is prevented by configuring neighbor router authentication for routing updates. However, using
    clear-text authentication provides little benefit since an attacker can intercept traffic and view the authentication
    key. This would allow the attacker to use the authentication key in an attack. Since MD5 is vulnerable to "birthday" attacks
    and may be compromised, routing protocol authentication must use FIPS 140-2 validated algorithms and modules to encrypt
    the authentication key. This requirement applies to all IPv4 and IPv6 protocols that are used to exchange routing or packet
    forwarding information; this includes all Interior Gateway Protocols (such as OSPF, EIGRP, and IS-IS) and Exterior Gateway
    Protocols (such as BGP), MPLS-related protocols (such as LDP), and multicast-related protocols.
  impact: ''
  references: []
  page_start: 23
  audit_raw: "Review the router configuration to verify it is using a NIST-validated FIPS 140-2\nmessage authentication code\
    \ algorithm to authenticate routing protocol messages.\nIS-IS Example:\nsecurity {\n …\n …\n …\n }\n authentication-key-chains\
    \ {\n key-chain ISIS_KEY {\n key 1 {\n secret \"$8$W8oXxdji.f5F-VQn\"; ## SECRET-DATA\n start-time \"2018-5-1.12:00:00\
    \ +0000\";\n algorithm hmac-sha-1;\n options isis-enhanced;\n }\n key 2 {\n secret \"$8$Q4953nCrlMLX-9A7V\"; ## SECRET-DATA\n\
    \ start-time \"2018-9-1.12:00:00 +0000\";\n algorithm hmac-sha-1;\n options isis-enhanced;\n }\n key 3 {\n secret \"$8$UeiHmpu1Ehr.PSe\"\
    ; ## SECRET-DATA\n start-time \"2019-1-1.12:00:00 +0000\";\n algorithm hmac-sha-1;\n options isis-enhanced;\n }\n }\n\
    \ }\n}\nprotocols {\n …\n …\n …\n isis {\n level 1 authentication-key-chain ISIS_KEY;\n level 2 authentication-key-chain\
    \ ISIS_KEY;\n interface ge-0/0/0 {\n level 1 hello-authentication-key-chain ISIS_KEY;\n level 2 hello-authentication-key-chain\
    \ ISIS_KEY;\n }\n interface lo0.0;\n }\nBGP Example:\n}\nsecurity {\n …\n …\n …\n }\n authentication-key-chains {\n key-chain\
    \ BGP_KEY {\n key 1 {\n secret \"$8$PTQnhclvMX3687\"; ## SECRET-DATA\n start-time \"2018-5-1.12:00:00 +0000\";\n }\n key\
    \ 2 {\n secret \"$8$iq.5OBESyKfTlM\"; ## SECRET-DATA\n start-time \"2018-9-1.12:00:00 +0000\";\n }\n key 3 {\n secret\
    \ \"$8$ZADjqAtOIRSk.hr\"; ## SECRET-DATA\n start-time \"2019-1-1.12:00:00 +0000\";\n }\n }\nprotocols {\n bgp {\n group\
    \ AS_2 {\n type external;\n peer-as 2;\n neighbor 11.1.25.2 {\n authentication-algorithm hmac-sha-1-96;\n authentication-key-chain\
    \ BGP_KEY;\n }\n neighbor 11.1.1.1 {\n authentication-algorithm hmac-sha-1-96;\n authentication-key-chain BGP_KEY;\n }\n\
    \ }\n }\nOSPF Example:\nIPsec authentication must be used to authenticate OSPF messages with a FIPS\n140-2 message authentication\
    \ code algorithm.\nStep 1: Verify the authentication algorithm in the IPsec security association\nas shown in the example\
    \ below.\nsecurity {\n …\n …\n …\n ipsec {\n security-association IPSEC-SA1 {\n mode transport;\n manual {\n direction\
    \ bidirectional {\n protocol ah;\n spi 256;\n authentication {\n algorithm hmac-sha1-96;\n key ascii-text \"$8$u6M6OEcrevL7YaZUjHmF39B1hP5CuBRle\"\
    ; ## SECRET-DATA\n }\n }\n }\n }\n }\nStep 2: Verify that an IPsec security association has been configured on the\ninterfaces\
    \ as shown in the following example:\nprotocols {\n …\n …\n …\n ospf {\n area 0.0.0.0 {\n interface ge-0/0/0 {\n ipsec-sa\
    \ IPSEC-SA1;\n }\n interface ge-0/1/0 {\n ipsec-sa IPSEC-SA1;\n }\n interface lo0.0;\n interface ge-0/2/0 {\n ipsec-sa\
    \ IPSEC-SA1;\n }\n }\n }\n ospf3 {\n area 0.0.0.0 {\n interface ge-1/2/0 {\n ipsec-sa IPSEC-SA1;\n }\n }\n }\n}\nIf a\
    \ NIST-validated FIPS 140-2 message authentication code algorithm is not being\nused to authenticate routing protocol\
    \ messages, this is a finding.\nNote: Juniper does not support FIPS 140-2 message authentication code algorithm for\n\
    RIP."
  remediation: 'Configure routing protocol authentication to use a NIST-validated FIPS 140-2 message

    authentication code algorithm.

    IS-IS Example:

    [edit security authentication-key-chains]

    set key-chain ISIS_KEY key 1 options isis-enhanced

    set key-chain ISIS_KEY key 2 options isis-enhanced

    set key-chain ISIS_KEY key 3 options isis-enhanced

    set key-chain ISIS_KEY key 1 start-time 2018-05-01.12:00 algorithm hmac-sha-1

    secret xxxxxxxxxxxxx

    set key-chain ISIS_KEY key 2 start-time 2018-09-01.12:00 algorithm hmac-sha-1

    secret xxxxxxxxxxxxx

    set key-chain ISIS_KEY key 3 start-time 2019-01-01.12:00 algorithm hmac-sha-1

    secret xxxxxxxxxxxxx

    [edit protocols]

    set isis level 1 authentication-key-chain ISIS_KEY

    set isis interface ge-0/0/0 level 1 hello-authentication-key-chain ISIS_KEY

    set isis interface ge-0/0/0 level 2 hello-authentication-key-chain ISIS_KEY

    BGP Example:

    [edit security authentication-key-chains]

    set key-chain BGP_KEY key 1 start-time 2018-05-01.12:00 secret xxxxxxxxxxxxx

    set key-chain BGP_KEY key 2 start-time 2018-09-01.12:00 secret xxxxxxxxxxxxx

    set key-chain BGP_KEY key 3 start-time 2019-01-01.12:00 secret xxxxxxxxxxxxx

    [edit protocols bgp group AS_5]

    set neighbor 11.1.25.5 authentication-algorithm hmac-sha-1-96

    set neighbor 11.1.25.5 authentication-key-chain BGP_KEY

    set neighbor 11.1.1.1 authentication-algorithm hmac-sha-1-96

    set neighbor 11.1.1.1 authentication-key-chain BGP_KEY

    OSPF Example:

    Configure IPsec Security Association

    [edit security ipsec]

    set security-association IPSEC-SA1

    set security-association IPSEC-SA1 mode transport

    set security-association IPSEC-SA1 manual direction bidirectional

    set security-association IPSEC-SA1 manual direction bidirectional protocol ah

    set security-association IPSEC-SA1 manual direction bidirectional spi 256

    set security-association IPSEC-SA1 manual direction bidirectional

    authentication algorithm hmac-sha1-96 key ascii-text 1234567890abcdefghij

    [edit protocols ospf area 0.0.0.0]

    set interface ge-0/0/0 ipsec-sa IPSEC-SA1

    set interface ge-0/1/0 ipsec-sa IPSEC-SA1

    set interface ge-0/2/0 ipsec-sa IPSEC-SA1

    [edit protocols ospf area 0.0.0.0]

    set interface ge-1/2/0 ipsec-sa IPSEC-SA1'
  checks:
  - type: manual_review
    info: "Review the router configuration to verify it is using a NIST-validated FIPS 140-2\nmessage authentication code\
      \ algorithm to authenticate routing protocol messages.\nIS-IS Example:\nsecurity {\n …\n …\n …\n }\n authentication-key-chains\
      \ {\n key-chain ISIS_KEY {\n key 1 {\n secret \"$8$W8oXxdji.f5F-VQn\"; ## SECRET-DATA\n start-time \"2018-5-1.12:00:00\
      \ +0000\";\n algorithm hmac-sha-1;\n options isis-enhanced;\n }\n key 2 {\n secret \"$8$Q4953nCrlMLX-9A7V\"; ## SECRET-DATA\n\
      \ start-time \"2018-9-1.12:00:00 +0000\";\n algorith"
    severity: medium
- id: '1.5'
  title: JUNI-RT-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper router must be configured to have all inactive interfaces disabled. GROUP ID: V-217016 RULE ID:
    SV-217016r604135'
  rationale: An inactive interface is rarely monitored or controlled and may expose a network to an undetected attack on that
    interface. Unauthorized personnel with access to the communication facility could gain access to a router by connecting
    to a configured interface that is not in use. If an interface is no longer used, the configuration must be deleted and
    the interface disabled. For sub-interfaces, delete sub-interfaces that are on inactive interfaces and delete sub-interfaces
    that are themselves inactive. If the sub-interface is no longer necessary for authorized communications, it must be deleted.
  impact: ''
  references: []
  page_start: 30
  audit_raw: "Review the router configuration and verify that inactive interfaces have been disabled as\nshown below.\ninterfaces\
    \ {\n ge-1/1/0 {\n disable;\n unit 0 {\n }\n }\nIf an interface is not being used but is configured or enabled, this is\
    \ a finding."
  remediation: 'Disable all inactive interfaces as shown below.

    [edit interfaces]

    set ge-1/1/0 disable'
  checks:
  - type: manual_review
    info: "Review the router configuration and verify that inactive interfaces have been disabled as\nshown below.\ninterfaces\
      \ {\n ge-1/1/0 {\n disable;\n unit 0 {\n }\n }\nIf an interface is not being used but is configured or enabled, this\
      \ is a finding."
    severity: medium
