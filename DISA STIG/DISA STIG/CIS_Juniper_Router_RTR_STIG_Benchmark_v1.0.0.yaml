- id: '1.45'
  title: JUNI-RT-000420
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper out-of-band management (OOBM) gateway router must be configured to not redistribute routes between
    the management network routing domain and the managed network routing domain. GROUP ID: V-217047 RULE ID: SV-217047r604135'
  rationale: If the gateway router is not a dedicated device for the OOBM network, several safeguards must be implemented
    for containment of management and production traffic boundaries; otherwise, it is possible that management traffic will
    not be separated from production traffic. Since the managed network and the management network are separate routing domains,
    separate Interior Gateway Protocol routing instances must be configured on the router, one for the managed network and
    one for the OOBM network. In addition, the routes from the two domains must not be redistributed to each other.
  impact: ''
  references: []
  page_start: 142
  audit_raw: "This requirement is not applicable for the DoDIN Backbone.\nVerify the Interior Gateway Protocol (IGP) instance\
    \ used for the managed network does\nnot redistribute routes into the IGP instance used for the management network, and\
    \ vice\nversa. The example below imports routes from the global route table (inet.0) in the route\ntable for the management\
    \ VRF.\n}\nrouting-options {\n interface-routes {\n rib-group inet INET0_GROUP;\n }\n rib-groups {\n INET0_GROUP {\n import-rib\
    \ [ VRF_MGMT.inet.0 inet.0 ];\n }\n }\n}\nIf the IGP instance used for the managed network redistributes routes into the\
    \ IGP\ninstance used for the management network, or vice versa, this is a finding."
  remediation: 'This requirement is not applicable for the DoDIN Backbone.

    Remove the configuration that imports routes from the management network into the

    managed network or vice versa as shown in the example below.

    [edit routing-options]

    delete rib-groups INET0_GROUP

    delete interface-routes rib-group inet INET0_GROUP'
