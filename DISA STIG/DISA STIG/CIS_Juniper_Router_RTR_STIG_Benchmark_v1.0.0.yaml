- id: '1.72'
  title: JUNI-RT-000690
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper PE router must be configured to implement Protocol Independent Multicast (PIM) snooping for each
    Virtual Private LAN Services (VPLS) bridge domain. GROUP ID: V-217074 RULE ID: SV-217074r604135'
  rationale: PIM snooping provides a way to constrain multicast traffic at Layer 2. By monitoring PIM join and prune packets
    on each interface, the PE router is able to determine interested multicast receivers and hence will populate the layer
    2 multicast-forwarding table. This enables the PE router to deliver traffic only to ports with at least one interested
    member within the VPLS bridge, thereby significantly reducing the volume of multicast traffic that would otherwise flood
    an entire VPLS bridge domain. The PIM snooping operation applies to both access circuits and pseudowires within a VPLS
    bridge domain.
  impact: ''
  references: []
  page_start: 220
