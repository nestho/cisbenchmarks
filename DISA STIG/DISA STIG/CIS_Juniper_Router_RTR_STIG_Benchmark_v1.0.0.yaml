- id: '1.79'
  title: JUNI-RT-000770
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper PE router must be configured to enforce a Quality-of-Service (QoS) policy to limit the effects
    of packet flooding denial-of-service (DoS) attacks. GROUP ID: V-217081 RULE ID: SV-217081r604135'
  rationale: DoS is a condition when a resource is not available for legitimate users. Packet flooding distributed denial-of-service
    (DDoS) attacks are referred to as volumetric attacks and have the objective of overloading a network or circuit to deny
    or seriously degrade performance, which denies access to the services that normally traverse the network or circuit. Volumetric
    attacks have become relatively easy to launch using readily available tools such as Low Orbit Ion Cannon or botnets. Measures
    to mitigate the effects of a successful volumetric attack must be taken to ensure that sufficient capacity is available
    for mission-critical traffic. Managing capacity may include, for example, establishing selected network usage priorities
    or quotas and enforcing them using rate limiting, Quality of Service (QoS), or other resource reservation control methods.
    These measures may also mitigate the effects of sudden decreases in network capacity that are the result of accidental
    or intentional physical damage to telecommunications facilities (such as cable cuts or weather-related outages).
  impact: ''
  references: []
  page_start: 237
  audit_raw: "Verify that a forwarding class has been configured for the Scavenger class. CS1 has\nbeen adopted as the forwarding\
    \ class; hence, the example below will define class CS1\nto be used.\nclass-of-service {\n …\n …\n …\n }\n forwarding-classes\
    \ {\n class CS1 queue-num 7 priority low;\n }\nThe Scavenger class is marked at the access layer with DSCP CS1. Hence,\
    \ the router\nmust maintain the marking and assign the packet to the configured forwarding class\nCS1.\nPE Router only\
    \ - Verify that the Multifield (MF) classifier has provisioned for this class\nas shown in the example below.\nfirewall\
    \ {\n family inet {\n filter CLASSIFY_TRAFFIC {\n …\n …\n …\n }\n term SCAVENGER {\n from {\n dscp cs1;\n }\n then {\n\
    \ forwarding-class CS1;\n accept;\n }\n }\n term ACCEPT_OTHER {\n then {\n forwarding-class best-effort;\n accept;\n }\n\
    \ }\n }\n }\n}\nPE and P router - Verify that a Behavior aggregate (BA) classifier has been configured\nto match the Scavenger\
    \ class (CS1) as shown in the example below.\nclass-of-service {\n classifiers {\n dscp CLASSIFIER {\n import default;\n\
    \ forwarding-class CS1 {\n loss-priority high code-points 001000;\n }\n }\n }\nNote: A proactive approach to mitigating\
    \ DoS and worm flooding attacks within the\nbase/camp/agency enclaves is to respond immediately to out-of-profile network\n\
    behavior indicative of a DoS or worm attack via access-Layer policers. Such policers\ncan meter traffic rates received\
    \ from endpoint devices. When these traffic flows exceed\nspecified rates, they no longer are considered normal flows\
    \ and henceforth can be set\nto the Scavenger class marking (DSCP CS1).\nP router – Verify that the BA classifier has\
    \ been applied to all interfaces as shown in the\nexample below.\nclass-of-service {\n …\n …\n …\n }\n interfaces {\n\
    \ ge-0/0/1 {\n unit 0 {\n classifiers {\n dscp CLASSIFIER;\n }\n }\n }\n ge-0/1/1 {\n unit 0 {\n classifiers {\n dscp\
    \ CLASSIFIER;\n }\n }\n }\n }\n}\nRemaining steps only apply to the PE router.\nVerify that a scheduler has been configured\
    \ for the Scavenger class as shown in the\nexample below.\nclass-of-service {\n …\n …\n …\n }\n schedulers {\n …\n …\n\
    \ …\n }\n SCAVENGER_SCHED {\n transmit-rate percent 5;\n buffer-size percent 5;\n priority low;\n }\n }\n}\nVerify that\
    \ the scheduler has been added to the scheduler map.\nclass-of-service {\n …\n …\n …\n }\n scheduler-maps {\n QOS_SCHED_MAP\
    \ {\n forwarding-class expedited-forwarding scheduler VOIP_SCHED;\n forwarding-class network-control scheduler CONTROL_PLANE_SCHED;\n\
    \ forwarding-class assured-forwarding scheduler MGMT_SCHED;\n forwarding-class best-effort scheduler BEST_EFFORT_SCHED;\n\
    \ forwarding-class CS1 scheduler SCAVENGER_SCHED;\n }\n }\nVerify that rewrite rules have been created to mark DSCP CS1\
    \ for those packets\nassigned to the Scavenger class with the appropriate code points.\nclass-of-service {\n …\n …\n …\n\
    \ }\n rewrite-rules {\n dscp REWRITE_DSCP {\n import default;\n forwarding-class CS1 {\n loss-priority high code-point\
    \ 001000;\n }\n }\n }\nVerify that the scheduler map, rewrite rules, and the BA classifier has been applied to all\ncore-facing\
    \ interfaces.\nclass-of-service {\n …\n …\n …\n }\n interfaces {\n ge-2/1/1 {\n scheduler-map QOS_SCHED_MAP;\n unit 0\
    \ {\n classifiers {\n dscp CLASSIFIER;\n }\n rewrite-rules {\n dscp REWRITE_DSCP;\n }\n }\n }\n ge-2/0/1 {\n scheduler-map\
    \ QOS_SCHED_MAP;\n unit 0 {\n rewrite-rules {\n dscp REWRITE_DSCP;\n }\n }\n }\n }\nIf QoS policy to limit the effects\
    \ of packet flooding denial-of-service (DoS) attacks has\nnot been configured, this is a finding."
  remediation: 'Configure a forwarding class has been configured for the Scavenger class as shown in

    the example below.

    [edit class-of-service forwarding-classes]

    set class CS1 queue-num 7 priority low

    The Scavenger class is marked at the access layer with DSCP CS1. Hence, the router

    must maintain the marking and assign the packet to the configured forwarding class

    CS1.

    PE Router only – Configure a Multifield (MF) classifier to provision for the Scavenger

    class as shown in the example below.

    [edit firewall family inet filter CLASSIFY_TRAFFIC]

    set term SCAVENGER from dscp cs1

    set term SCAVENGER then forwarding-class CS1 accept

    insert term SCAVENGER before term ACCEPT_OTHER

    PE and P Router – Configure a Behavior aggregate (BA) classifier to match on the

    packets marked with DSCP CS1.

    [edit class-of-service classifiers]

    set dscp CLASSIFIER import default forwarding-class CS1 loss-priority high

    code-points 001000

    P router only – Apply the BA classifier to all interfaces.

    [edit class-of-service interfaces]

    set ge-0/0/1 unit 0 classifiers dscp CLASSIFIER

    set ge-0/1/1 unit 0 classifiers dscp CLASSIFIER

    Remaining steps are only applicable to the PE router.

    Configure a scheduler for the Scavenger class.

    [edit class-of-service schedulers]

    set SCAVENGER_SCHED transmit-rate percent 5

    set SCAVENGER_SCHED buffer-size percent 5

    set SCAVENGER_SCHED priority low

    set BEST_EFFORT_SCHED transmit-rate percent 55

    Add the Scavenger scheduler to the scheduler map.

    [edit class-of-service scheduler-maps QOS_SCHED_MAP]

    set forwarding-class CS1 scheduler SCAVENGER_SCHED

    Apply the scheduler map to all core-facing interfaces.

