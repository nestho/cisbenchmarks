- id: '1.1'
  title: JUNI-RT-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to enforce approved authorizations for controlling the flow of information
    within the network based on organization-defined information flow control policies. GROUP ID: V-217011 RULE ID: SV-217011r604135'
  rationale: Information flow control regulates where information is allowed to travel within a network and between interconnected
    networks. The flow of all network traffic must be monitored and controlled so it does not introduce any unacceptable risk
    to the network infrastructure or data. Information flow control policies and enforcement mechanisms are commonly employed
    by organizations to control the flow of information between designated sources and destinations (e.g., networks, individuals,
    and devices) within information systems. Enforcement occurs, for example, in boundary protection devices (e.g., gateways,
    routers, guards, encrypted tunnels, and firewalls) that employ rule sets or establish configuration settings that restrict
    information system services, provide a packet filtering capability based on header information, or provide a message filtering
    capability based on message content (e.g., implementing key word searches or using document characteristics).
  impact: ''
  references: []
  page_start: 12
  audit_raw: "This requirement is not applicable for the DoDIN Backbone.\nReview the router configuration to verify that firewall\
    \ filters are configured to allow or\ndeny traffic for specific source and destination addresses as well as ports and\
    \ protocols.\nFor example, the configuration below will allow only printer traffic into subnet\n11.1.23.0/24 and SQL traffic\
    \ into subnet 11.1.24.0/24. ICMP is allowed for\ntroubleshooting and OSPF is the routing protocol used within the network.\n\
    interfaces {\n ge-0/0/0 {\n unit 0 {\n family inet {\n filter {\n input FILTER_SERVER_TRAFFIC;\n }\n address 11.1.12.2/24;\n\
    \ }\n }\n }\n…\n…\n…\nfirewall {\n family inet {\n filter FILTER_SERVER_TRAFFIC {\n term PRINT_FILTER {\n from {\n destination-address\
    \ {\n 11.1.23.0/24;\n }\n protocol tcp;\n destination-port [ 515 631 9100 ];\n }\n then accept;\n }\n term SQL_FILTER\
    \ {\n from {\n destination-address {\n 11.1.24.0/24;\n }\n protocol tcp;\n destination-port [ 1433 1434 4022 ];\n }\n\
    \ then accept;\n }\n term ALLOW_OSPF {\n from {\n protocol ospf;\n }\n then accept;\n }\n term ALLOW_ICMP {\n from {\n\
    \ protocol icmp;\n }\n then accept;\n }\n term DENY_ALL_OTHER {\n then {\n log;\n syslog;\n reject;\n }\n }\n }\nIf the\
    \ router is not configured to enforce approved authorizations for controlling the flow\nof information within the network\
    \ based on organization-defined information flow control\npolicies, this is a finding."
  remediation: 'This requirement is not applicable for the DoDIN Backbone.

    Configure firewall filters to allow or deny traffic for specific source and destination

    addresses as well as ports and protocols between various subnets as required. The

    commands used below were used to create the configuration as shown in the check

    content.

    [edit firewall family inet]

    set filter FILTER_SERVER_TRAFFIC term PRINT_FILTER from destination-address

    11.1.23.0/24

    set filter FILTER_SERVER_TRAFFIC term PRINT_FILTER from protocol tcp

    destination-port [515 631 9100]

    set filter FILTER_SERVER_TRAFFIC term PRINT_FILTER then accept

    set filter FILTER_SERVER_TRAFFIC term SQL_FILTER from destination-address

    11.1.24.0/24

    set filter FILTER_SERVER_TRAFFIC term SQL_FILTER from protocol tcp

    destination-port [1433 1434 4022]

    set filter FILTER_SERVER_TRAFFIC term SQL_FILTER then accept

    set filter FILTER_SERVER_TRAFFIC term ALLOW_OSPF from protocol ospf

    set filter FILTER_SERVER_TRAFFIC term ALLOW_OSPF then accept

    set filter FILTER_SERVER_TRAFFIC term ALLOW_ICMP from protocol icmp

    set filter FILTER_SERVER_TRAFFIC term ALLOW_ICMP then accept

    set filter FILTER_SERVER_TRAFFIC term DENY_ALL_OTHER then log reject

    [edit interfaces ge-0/0/0 unit 0 family inet]

    set filter input FILTER_SERVER_TRAFFIC'
  checks:
  - type: manual_review
    info: "This requirement is not applicable for the DoDIN Backbone.\nReview the router configuration to verify that firewall\
