- id: '1.7'
  title: JUNI-RT-000070
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper router must be configured to have all non-essential capabilities disabled. GROUP ID: V-217017
    RULE ID: SV-217017r604135'
  rationale: A compromised router introduces risk to the entire network infrastructure, as well as data resources that are
    accessible via the network. The perimeter defense has no oversight or control of attacks by malicious users within the
    network. Preventing network breaches from within is dependent on implementing a comprehensive defense-in-depth strategy,
    including securing each device connected to the network. This is accomplished by following and implementing all security
    guidance applicable for each node type. A fundamental step in securing each router is to enable only the capabilities
    required for operation.
  impact: ''
  references: []
  page_start: 37
  audit_raw: "Review the router configuration to determine if services not required for operation are\nenabled. Services such\
    \ as finger, ftp, telnet must never be enabled; hence, they should\nnot be shown under the system services hierarchy.\n\
    If J-web is not used for administrative access, the web-management services must not\nbe configured as shown below.\n\
    If DHCP server is not being deployed on the router, the command dhcp-local-server\nmust not be configured as shown below.\n\
    system {\n …\n …\n …\n services {\n web-management {\n https {\n interface ge-0/0/0.0;\n }\n }\n finger;\n ftp;\n ssh\
    \ {\n protocol-version v2;\n macs [ hmac-sha1-96 hmac-sha2-256 hmac-sha2-512 ];\n }\n telnet;\n netconf {\n ssh;\n }\n\
    \ dhcp-local-server {\n group DHCP_GROUP {\n interface ge-0/1/0.0;\n }\n }\n }\nIf unnecessary services and functions\
    \ are enabled on the router, this is a finding."
  remediation: 'Remove unneeded services and functions from the router as shown below.

    [edit system services]

    delete telnet

    [edit system services]

    delete finger

    [edit system services]

    delete ftp'
  checks:
  - type: manual_review
    info: "Review the router configuration to determine if services not required for operation are\nenabled. Services such\
