  description: Local administrator accounts must have their privileged token filtered to prevent elevated privileges from
    being used over the network on domain systems. GROUP ID:V-225008 RULE ID:SV-225008r958518
  rationale: A compromised local administrator account can provide means for an attacker to move laterally between domain
    systems. With User Account Control enabled, filtering the privileged token for local administrator accounts will prevent
    the elevated privileges of these accounts from being used over the network.
