  title: WN16-CC-000030
  scoring: scored
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: WDigest Authentication must be disabled on Windows Server 2016. GROUP ID:V-224915 RULE ID:SV-224915r958478
  rationale: When the WDigest Authentication protocol is enabled, plain-text passwords are stored in the Local Security Authority
    Subsystem Service (LSASS), exposing them to theft. WDigest is disabled by default in Windows Server 2016. This setting
    ensures this is enforced.
  impact: ''
  references:
  - '1. CIS Recommendation: WDigest Authentication'
  - '2. GRID: MS-00000248'
  page_start: 209
  audit_raw: 'If the following registry value does not exist or is not configured as specified, this is a

    finding.

