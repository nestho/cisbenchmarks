  - '2. GRID: MS-00000243'
  page_start: 92
  audit_raw: 'Different methods are available to disable SMBv1 on Windows 2016, if V-73299 is

    configured, this is NA.

    If the following registry value does not exist or is not configured as specified, this is a

    finding:

    Registry Hive: HKEY_LOCAL_MACHINE

    Registry Path: \SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\

    Value Name: SMB1

    Type: REG_DWORD

    Value: 0x00000000 (0)'
  remediation: 'Configure the policy value for

    Computer Configuration >> Administrative Templates >> MS Security Guide >>

    "Configure SMBv1 Server" to "Disabled"

    The system must be restarted for the change to take effect.

    This policy setting requires the installation of the SecGuide custom templates included

    with the STIG package. "SecGuide.admx" and "SecGuide.adml" must be copied to the

    \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US directories

    respectively.'
