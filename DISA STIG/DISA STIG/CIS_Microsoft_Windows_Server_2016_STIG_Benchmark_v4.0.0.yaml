  title: WN16-00-000250
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: Non-system-created file shares on a system must limit access to groups that require it. GROUP ID:V-224841 RULE
    ID:SV-224841r958524
  rationale: Shares on a system provide network access. To prevent exposing sensitive information, where shares are necessary,
    permissions must be reconfigured to give the minimum access to accounts that require it.
  impact: ''
  references: []
  page_start: 61
  audit_raw: 'If only system-created shares such as "ADMIN$", "C$", and "IPC$" exist on the system,

    this is NA. (System-created shares will display a message that it has been shared for

    administrative purposes when "Properties" is selected.)

    Run "Computer Management".

    Navigate to System Tools >> Shared Folders >> Shares.

    Right-click any non-system-created shares.

    Select "Properties".

    Select the "Share Permissions" tab.

    If the file shares have not been configured to restrict permissions to the specific groups

    or accounts that require access, this is a finding.

    Select the "Security" tab.

    If the permissions have not been configured to restrict permissions to the specific

    groups or accounts that require access, this is a finding.'
  remediation: 'If a non-system-created share is required on a system, configure the share and NTFS

    permissions to limit access to the specific groups or accounts that require it.

    Remove any unnecessary non-system-created shares.'
  checks:
  - type: manual_review
    info: 'If only system-created shares such as "ADMIN$", "C$", and "IPC$" exist on the system,

      this is NA. (System-created shares will display a message that it has been shared for

      administrative purposes when "Properties" is selected.)

