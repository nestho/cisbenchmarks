    on unclassified systems. GROUP ID: V-225022 RULE ID: SV-225022r958448'
  rationale: 'To ensure users do not experience denial of service when performing certificate-based authentication to DoD
    websites due to the system chaining to a root other than DoD Root CAs, the DoD Interoperability Root CA cross-certificates
    must be installed in the Untrusted Certificate Store. This requirement only applies to unclassified systems. Satisfies:
    SRG-OS-000066-GPOS-00034, SRG-OS-000403-GPOS-00182'
