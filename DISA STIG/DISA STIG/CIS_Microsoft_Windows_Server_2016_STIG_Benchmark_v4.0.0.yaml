  description: Secure Boot must be enabled on Windows Server 2016 systems. GROUP ID:V-224864 RULE ID:SV-224864r991589
  rationale: Secure Boot is a standard that ensures systems boot only to a trusted operating system. Secure Boot is required
    to support additional security features in Windows Server 2016, including Virtualization Based Security and Credential
    Guard. If Secure Boot is turned off, these security features will not function.
  impact: ''
  references: []
  page_start: 107
  audit_raw: 'Some older systems may not have UEFI firmware. This is currently a CAT III; it will be

    raised in severity at a future date when broad support of Windows hardware and

    firmware requirements are expected to be met. Devices that have UEFI firmware must

    have Secure Boot enabled.

    Run "System Information".

    Under "System Summary", if "Secure Boot State" does not display "On", this is a

    finding.'
  remediation: Enable Secure Boot in the system firmware.
  checks:
  - type: manual_review
    info: 'Some older systems may not have UEFI firmware. This is currently a CAT III; it will be

      raised in severity at a future date when broad support of Windows hardware and

