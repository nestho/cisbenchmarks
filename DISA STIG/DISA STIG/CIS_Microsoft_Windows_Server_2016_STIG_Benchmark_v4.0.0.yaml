    \ such as the Enabled status and LastLogonDate.\nMember servers and standalone or nondomain-joined systems:\nCopy or enter\
    \ the lines below to the PowerShell window and enter. (Entering twice may\nbe required. Do not include the quotes at the\
    \ beginning and end of the query.)\n\"([ADSI]('WinNT://{0}' -f $env:COMPUTERNAME)).Children | Where {\n$_.SchemaClassName\
    \ -eq 'user' } | ForEach {\n $user = ([ADSI]$_.Path)\n $lastLogin = $user.Properties.LastLogin.Value\n $enabled = ($user.Properties.UserFlags.Value\
    \ -band 0x2) -ne 0x2\n if ($lastLogin -eq $null) {\n $lastLogin = 'Never'\n }\n Write-Host $user.Name $lastLogin $enabled\n\
    }\"\nThis will return a list of local accounts with the account name, last logon, and if the\naccount is enabled (True/False).\n\
    For example: User1 10/31/2015 5:49:56 AM True\nReview the list of accounts returned by the above queries to determine\
    \ the finding\nvalidity for each account reported.\nExclude the following accounts:\n• Built-in administrator account\
    \ (Renamed, SID ending in 500)\n• Built-in guest account (Renamed, Disabled, SID ending in 501)\n• Built-in default account\
    \ (Renamed, Disabled, SID ending in 503)\n• Application accounts\nIf any enabled accounts have not been logged on to within\
    \ the past 35 days, this is a\nfinding.\nInactive accounts that have been reviewed and deemed to be required must be\n\
    documented with the ISSO."
  remediation: 'Regularly review accounts to determine if they are still active. Remove or disable

