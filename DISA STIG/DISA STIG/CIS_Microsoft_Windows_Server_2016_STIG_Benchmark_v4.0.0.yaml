    If the following registry value does not exist or is not configured as specified, this is a

    finding.

    Registry Hive: HKEY_LOCAL_MACHINE

    Registry Path: \SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System

    Value Name: LocalAccountTokenFilterPolicy

    Type: REG_DWORD

    Value: 0x00000000 (0)

    This setting may cause issues with some network scanning tools if local administrative

    accounts are used remotely. Scans should use domain accounts where possible. If a

    local administrative account must be used, temporarily enabling the privileged token by

    configuring the registry value to "1" may be required.'
  remediation: 'Configure the policy value for

    Computer Configuration >> Administrative Templates >> MS Security Guide >>

    "Apply UAC restrictions to local accounts on network logons"

    to "Enabled".

    This policy setting requires the installation of the SecGuide custom templates included

    with the STIG package. "SecGuide.admx" and "SecGuide.adml" must be copied to the

    \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US directories

    respectively.'
  checks:
  - type: manual_review
    info: 'This applies to member servers. For domain controllers and standalone or nondomainjoined systems, this is NA.

