- id: '1.168'
  title: WN16-DC-000230
  scoring: scored
  profile:
  - 'DC SEVERITY: CAT II'
  description: 'Windows Server 2016 must be configured to audit Account Management - Computer Account Management successes.
    GROUP ID: V-224986 RULE ID: SV-224986r958368'
  rationale: 'Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot service
    disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are necessary to provide
    a trail of evidence in case the system or network is compromised. Collecting this data is essential for analyzing the
    security of information assets and detecting signs of suspicious and unexpected behavior. Computer Account Management
    records events such as creating, changing, deleting, renaming, disabling, or enabling computer accounts. Satisfies: SRG-OS-000004-GPOS-00004,
    SRG-OS-000239-GPOS-00089, SRG-OS000240-GPOS-00090, SRG-OS-000241-GPOS-00091, SRG-OS-000303-GPOS-00120, SRG-OS-000476-GPOS-00221'
  impact: ''
  references:
  - '1. CIS Recommendation: Audit Computer Account Management'
  - '2. GRID: MS-00000200'
  page_start: 373
  audit_raw: 'This applies to domain controllers. It is NA for other systems.

    Security Option "Audit: Force audit policy subcategory settings (Windows Vista or later)

    to override audit policy category settings" must be set to "Enabled" (WN16-SO-000050)

    for the detailed auditing subcategories to be effective.

    Use the AuditPol tool to review the current Audit Policy configuration:

    Open an elevated "Command Prompt" (run as administrator).

    Enter

    "AuditPol /get /category:*"

    Compare the AuditPol settings with the following.

    If the system does not audit the following, this is a finding.

    Account Management >> Computer Account Management - Success'
  remediation: 'Configure the policy value for

    Computer Configuration >> Windows Settings >> Security Settings >> Advanced

    Audit Policy Configuration >> System Audit Policies >> Account Management >>

    "Audit Computer Account Management"

    with "Success" selected.'
