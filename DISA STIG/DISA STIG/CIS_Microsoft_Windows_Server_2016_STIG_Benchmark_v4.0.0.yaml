  title: WN16-DC-000200
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  description: 'The Active Directory Domain Controllers Organizational Unit (OU) object must be configured with proper audit
    settings. GROUP ID: V-224983 RULE ID: SV-224983r958732'
  rationale: 'When inappropriate audit settings are configured for directory service database objects, it may be possible
    for a user or process to update the data without generating any tracking data. The impact of missing audit data is related
    to the type of object. A failure to capture audit data for objects used by identification, authentication, or authorization
    functions could degrade or eliminate the ability to track changes to access policy for systems or data. For Active Directory
    (AD), there are a number of critical object types in the domain naming context of the AD database for which auditing is
    essential. This includes the Domain Controller OU object. Because changes to these objects can significantly impact access
    controls or the availability of systems, the absence of auditing data makes it impossible to identify the source of changes
    that impact the confidentiality, integrity, and availability of data and systems throughout an AD domain. The lack of
    proper auditing can result in insufficient forensic evidence needed to investigate an incident and prosecute the intruder.
    Satisfies: SRG-OS-000327-GPOS-00127, SRG-OS-000458-GPOS-00203, SRG-OS000463-GPOS-00207, SRG-OS-000468-GPOS-00212'
