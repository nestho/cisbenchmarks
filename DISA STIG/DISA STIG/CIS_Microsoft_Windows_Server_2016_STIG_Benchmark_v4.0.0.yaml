- id: '1.158'
  title: WN16-DC-000130
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  description: 'Domain controllers must run on a machine dedicated to that function. GROUP ID: V-224976 RULE ID: SV-224976r958478'
  rationale: Executing application servers on the same host machine with a directory server may substantially weaken the security
    of the directory server. Web or database server applications usually require the addition of many programs and accounts,
    increasing the attack surface of the computer. Some applications require the addition of privileged accounts, providing
    potential sources of compromise. Some applications (such as Microsoft Exchange) may require the use of network ports or
    services conflicting with the directory server. In this case, non-standard ports might be selected, and this could interfere
    with intrusion detection or prevention services.
  impact: ''
  references: []
  page_start: 338
  audit_raw: 'This applies to domain controllers, It is NA for other systems.

    Review the installed roles the domain controller is supporting.

    Start "Server Manager".

    Select "AD DS" in the left pane and the server name under "Servers" to the right.

    Select "Add (or Remove) Roles and Features" from "Tasks" in the "Roles and Features"

    section. (Cancel before any changes are made.)

    Determine if any additional server roles are installed. A basic domain controller setup

    will include the following:

    • Active Directory Domain Services

    • DNS Server

    • File and Storage Services

    If any roles not requiring installation on a domain controller are installed, this is a

    finding.

    A Domain Name System (DNS) server integrated with the directory server (e.g., ADintegrated DNS) is an acceptable application.
    However, the DNS server must comply

    with the DNS STIG security requirements.

    Run "Programs and Features".

    Review installed applications.

    If any applications are installed that are not required for the domain controller, this is a

    finding.'
  remediation: 'Remove additional roles or applications such as web, database, and email from the

    domain controller.'
