- id: '1.41'
  title: WN16-00-000420
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: Windows PowerShell 2.0 must not be installed. GROUP ID:V-224859 RULE ID:SV-224859r958478
  rationale: Windows PowerShell 5.0 added advanced logging features that can provide additional detail when malware has been
    run on a system. Disabling the Windows PowerShell 2.0 mitigates against a downgrade attack that evades the Windows PowerShell
    5.0 script block logging feature.
  impact: ''
  references: []
  page_start: 96
  audit_raw: 'Open "PowerShell".

    Enter

    "Get-WindowsFeature | Where Name -eq PowerShell-v2"

    If "Installed State" is "Installed", this is a finding.

    An Installed State of "Available" or "Removed" is not a finding.'
  remediation: 'Uninstall the "Windows PowerShell 2.0 Engine".

    Start "Server Manager".

    Select the server with the feature.

    Scroll down to "ROLES AND FEATURES" in the right pane.

    Select "Remove Roles and Features" from the drop-down "TASKS" list.

    Select the appropriate server on the "Server Selection" page and click "Next".

    Deselect "Windows PowerShell 2.0 Engine" under "Windows PowerShell" on the

    "Features" page.

    Click "Next" and "Remove" as prompted.'
  checks:
  - type: manual_review
    info: 'Open "PowerShell".

      Enter

      "Get-WindowsFeature | Where Name -eq PowerShell-v2"

      If "Installed State" is "Installed", this is a finding.

      An Installed State of "Available" or "Removed" is not a finding.'
    severity: medium
- id: '1.42'
  title: WN16-00-000430
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: FTP servers must be configured to prevent anonymous logons. GROUP ID:V-224860 RULE ID:SV-224860r991589
  rationale: The FTP service allows remote users to access shared files and directories. Allowing anonymous FTP connections
    makes user auditing difficult. Using accounts that have administrator privileges to log on to FTP risks that the userid
    and password will be captured on the network and give administrator access to an unauthorized user.
  impact: ''
  references: []
  page_start: 98
  audit_raw: 'If FTP is not installed on the system, this is NA.

    Open "Internet Information Services (IIS) Manager".

    Select the server.

    Double-click "FTP Authentication".

    If the "Anonymous Authentication" status is "Enabled", this is a finding.'
  remediation: 'Configure the FTP service to prevent anonymous logons.

    Open "Internet Information Services (IIS) Manager".

    Select the server.

    Double-click "FTP Authentication".

    Select "Anonymous Authentication".

    Select "Disabled" under "Actions".'
  checks:
  - type: manual_review
    info: 'If FTP is not installed on the system, this is NA.

      Open "Internet Information Services (IIS) Manager".

      Select the server.

      Double-click "FTP Authentication".

      If the "Anonymous Authentication" status is "Enabled", this is a finding.'
    severity: medium
- id: '1.43'
  title: WN16-00-000440
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: FTP servers must be configured to prevent access to the system drive. GROUP ID:V-224861 RULE ID:SV-224861r991589
  rationale: The FTP service allows remote users to access shared files and directories that could provide access to system
    resources and compromise the system, especially if the user can gain access to the root directory of the boot drive.
  impact: ''
  references: []
  page_start: 100
  audit_raw: 'If FTP is not installed on the system, this is NA.

    Open "Internet Information Services (IIS) Manager".

    Select "Sites" under the server name.

    For any sites with a Binding that lists FTP, right-click the site and select "Explore".

    If the site is not defined to a specific folder for shared FTP resources, this is a finding.

    If the site includes any system areas such as root of the drive, Program Files, or

    Windows directories, this is a finding.'
  remediation: 'Configure the FTP sites to allow access only to specific FTP shared resources. Do not

    allow access to other areas of the system.'
  checks:
  - type: manual_review
    info: 'If FTP is not installed on the system, this is NA.

      Open "Internet Information Services (IIS) Manager".

      Select "Sites" under the server name.

      For any sites with a Binding that lists FTP, right-click the site and select "Explore".

      If the site is not defined to a specific folder for shared FTP resources, this is a finding.

      If the site includes any system areas such as root of the drive, Program Files, or

