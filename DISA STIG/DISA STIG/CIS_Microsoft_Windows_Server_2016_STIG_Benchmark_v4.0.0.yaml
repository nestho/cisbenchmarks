- id: '1.25'
  title: WN16-00-000280
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT I'
  - 'MS SEVERITY: CAT I'
  description: Systems requiring data at rest protections must employ cryptographic mechanisms to prevent unauthorized disclosure
    and modification of the information at rest. GROUP ID:V-224843 RULE ID:SV-224843r958552
  rationale: 'This requirement addresses protection of user-generated data as well as operating system-specific configuration
    data. Organizations may choose to employ different mechanisms to achieve confidentiality and integrity protections, as
    appropriate, in accordance with the security category and/or classification of the information. Selection of a cryptographic
    mechanism is based on the need to protect the integrity of organizational information. The strength of the mechanism is
    commensurate with the security category and/or classification of the information. Organizations have the flexibility to
    either encrypt all information on storage devices (i.e., full disk encryption) or encrypt specific data structures (e.g.,
    files, records, or fields). Satisfies: SRG-OS-000185-GPOS-00079, SRG-OS-000404-GPOS-00183, SRG-OS000405-GPOS-00184'
  impact: ''
  references: []
  page_start: 64
  audit_raw: 'Verify systems that require additional protections due to factors such as inadequate

    physical protection or sensitivity of the data employ encryption to protect the

    confidentiality and integrity of all information at rest.

    If they do not, this is a finding.'
  remediation: 'Configure systems that require additional protections due to factors such as inadequate

    physical protection or sensitivity of the data to employ encryption to protect the

    confidentiality and integrity of all information at rest.'
  checks:
  - type: manual_review
    info: 'Verify systems that require additional protections due to factors such as inadequate

      physical protection or sensitivity of the data employ encryption to protect the

      confidentiality and integrity of all information at rest.

      If they do not, this is a finding.'
    severity: medium
- id: '1.26'
  title: WN16-00-000290
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: Protection methods such as TLS, encrypted VPNs, or IPsec must be implemented if the data owner has a strict
    requirement for ensuring data integrity and confidentiality is maintained at every step of the data transfer and handling
    process. GROUP ID:V-224844 RULE ID:SV-224844r958912
  rationale: 'Information can be either unintentionally or maliciously disclosed or modified during preparation for transmission,
    for example, during aggregation, at protocol transformation points, and during packing/unpacking. These unauthorized disclosures
    or modifications compromise the confidentiality or integrity of the information. Ensuring the confidentiality of transmitted
    information requires the operating system to take measures in preparing information for transmission. This can be accomplished
    via access control and encryption. Use of this requirement will be limited to situations where the data owner has a strict
    requirement for ensuring data integrity and confidentiality is maintained at every step of the data transfer and handling
    process. When transmitting data, operating systems need to support transmission protection mechanisms such as TLS, encrypted
    VPNs, or IPsec. Satisfies: SRG-OS-000425-GPOS-00189, SRG-OS-000426-GPOS-00190'
  impact: ''
  references: []
  page_start: 66
  audit_raw: 'If the data owner has a strict requirement for ensuring data integrity and confidentiality

    is maintained at every step of the data transfer and handling process, verify protection

    methods such as TLS, encrypted VPNs, or IPsec have been implemented.

    If protection methods have not been implemented, this is a finding.'
  remediation: 'Configure protection methods such as TLS, encrypted VPNs, or IPsec when the data

    owner has a strict requirement for ensuring data integrity and confidentiality is

    maintained at every step of the data transfer and handling process.'
  checks:
  - type: manual_review
    info: 'If the data owner has a strict requirement for ensuring data integrity and confidentiality

