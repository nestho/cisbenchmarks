  title: WN16-DC-000140
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  description: 'Separate, NSA-approved (Type 1) cryptography must be used to protect the directory data in transit for directory
    service implementations at a classified confidentiality level when replication data traverses a network cleared to a lower
    level than the data. GROUP ID: V-224977 RULE ID: SV-224977r987791'
  rationale: Directory data that is not appropriately encrypted is subject to compromise. Commercial-grade encryption does
    not provide adequate protection when the classification level of directory data in transit is higher than the level of
    the network.
  impact: ''
  references: []
  page_start: 340
  audit_raw: 'This applies to domain controllers. It is NA for other systems.

    Review the organization network diagram(s) or documentation to determine the level of

    classification for the network(s) over which replication data is transmitted.

    Determine the classification level of the Windows domain controller.

    If the classification level of the Windows domain controller is higher than the level of the

    networks, review the organization network diagram(s) and directory implementation

    documentation to determine if NSA-approved encryption is used to protect the

    replication network traffic.

    If the classification level of the Windows domain controller is higher than the level of the

    network traversed and NSA-approved encryption is not used, this is a finding.'
  remediation: 'Configure NSA-approved (Type 1) cryptography to protect the directory data in transit

    for directory service implementations at a classified confidentiality level that transfer

    replication data through a network cleared to a lower level than the data.'
