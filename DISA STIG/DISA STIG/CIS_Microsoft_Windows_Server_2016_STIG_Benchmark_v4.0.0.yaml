    Execute the following command:

    Get-ChildItem -Path Cert:Localmachine\disallowed | Where {$_.Issuer -Like

    "*DoD Interoperability*" -and $_.Subject -Like "*DoD*"} | FL Subject, Issuer,

    Thumbprint, NotAfter

