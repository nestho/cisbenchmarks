- id: '1.44'
  title: WN16-00-000450
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT III'
  - 'MS SEVERITY: CAT III'
  description: The time service must synchronize with an appropriate DoD time source. GROUP ID:V-224862 RULE ID:SV-224862r1038944
  rationale: The Windows Time Service controls time synchronization settings. Time synchronization is essential for authentication
    and auditing purposes. If the Windows Time Service is used, it must synchronize with a secure, authorized time source.
    Domain-joined systems are automatically configured to synchronize with domain controllers. If an NTP server is configured,
    it must synchronize with a secure, authorized time source.
  impact: ''
  references: []
  page_start: 101
  audit_raw: 'Review the Windows time service configuration.

    Open an elevated "Command Prompt" (run as administrator).

    Enter

    "W32tm /query /configuration"

    Domain-joined systems (excluding the domain controller with the PDC emulator role):

    If the value for "Type" under "NTP Client" is not "NT5DS", this is a finding.

    Other systems:

    If systems are configured with a "Type" of "NTP", including standalone or nondomainjoined systems and the domain controller
    with the PDC Emulator role, and do not have

    a DoD time server defined for "NTPServer", this is a finding.

    To determine the domain controller with the PDC Emulator role:

    Open "PowerShell".

    Enter

    "Get-ADDomain | FT PDCEmulator"'
  remediation: 'Configure the system to synchronize time with an appropriate DoD time source.

    Domain-joined systems use NT5DS to synchronize time from other systems in the

    domain by default.

    If the system needs to be configured to an NTP server, configure the system to point to

    an authorized time server by setting the policy value for Computer Configuration >>

    Administrative Templates >> System >> Windows Time Service >> Time Providers >>

    "Configure Windows NTP Client" to "Enabled", and configure the "NtpServer" field to

    point to an appropriate DoD time server.

    The US Naval Observatory operates stratum 1 time servers, which are identified at:

    https://www.cnmoc.usff.navy.mil/Our-Commands/United-States-NavalObservatory/Precise-Time-Department/Network-Time-Protocol-NTP/

    Time synchronization will occur through a hierarchy of time servers down to the local

    level. Clients and lower-level servers will synchronize with an authorized time server in

    the hierarchy.'
  checks:
  - type: manual_review
    info: 'Review the Windows time service configuration.

      Open an elevated "Command Prompt" (run as administrator).

      Enter

      "W32tm /query /configuration"

      Domain-joined systems (excluding the domain controller with the PDC emulator role):

      If the value for "Type" under "NTP Client" is not "NT5DS", this is a finding.

      Other systems:

      If systems are configured with a "Type" of "NTP", including standalone or nondomainjoined systems and the domain controller
      with the PDC Emulator role, and do not have

      a DoD time ser'
    severity: medium
- id: '1.45'
  title: WN16-00-000460
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: Orphaned security identifiers (SIDs) must be removed from user rights on Windows 2016. GROUP ID:V-224863 RULE
    ID:SV-224863r991589
  rationale: Accounts or groups given rights on a system may show up as unresolved SIDs for various reasons including deletion
    of the accounts or groups. If the account or group objects are reanimated, there is a potential they may still have rights
    no longer intended. Valid domain accounts or groups may also show up as unresolved SIDs if a connection to the domain
    cannot be established for some reason.
  impact: ''
  references: []
  page_start: 104
  audit_raw: 'Review the effective User Rights setting in Local Group Policy Editor.

    Run "gpedit.msc".

    Navigate to

    Local Computer Policy >> Computer Configuration >> Windows Settings >>

    Security Settings >> Local Policies >> User Rights Assignment

    Review each User Right listed for any unresolved SIDs to determine whether they are

    valid, such as due to being temporarily disconnected from the domain. (Unresolved

    SIDs have the format of "*S-1-…".)

    If any unresolved SIDs exist and are not for currently valid accounts or groups, this is a

    finding.

    For server core installations, run the following command:

    Secedit /export /areas USER_RIGHTS /cfg c:\path\UserRights.txt

    The results in the file identify user right assignments by SID instead of group name.

    Review the SIDs for unidentified ones. A list of typical SIDs \ Groups is below, search

    Microsoft for articles on well-known SIDs for others.

    If any unresolved SIDs exist and are not for currently valid accounts or groups, this is a

    finding.

    SID - Group

    • S-1-5-11 - Authenticated Users

    • S-1-5-113 - Local account

    • S-1-5-114 - Local account and member of Administrators group

    • S-1-5-19 - Local Service

    • S-1-5-20 - Network Service

    • S-1-5-32-544 - Administrators

    • S-1-5-32-546 - Guests

    • S-1-5-6 - Service

    • S-1-5-9 - Enterprise Domain Controllers

    • S-1-5-domain-512 - Domain Admins

    • S-1-5-root domain-519 - Enterprise Admins

    • S-1-5-80-3139157870-2983391045-3678747466-658725712-1809340420 - NT

    Service\WdiServiceHost'
  remediation: 'Remove any unresolved SIDs found in User Rights assignments and determined to not

    be for currently valid accounts or groups by removing the accounts or groups from the

    appropriate group policy.'
  checks:
  - type: manual_review
    info: 'Review the effective User Rights setting in Local Group Policy Editor.

      Run "gpedit.msc".

      Navigate to

      Local Computer Policy >> Computer Configuration >> Windows Settings >>

      Security Settings >> Local Policies >> User Rights Assignment

      Review each User Right listed for any unresolved SIDs to determine whether they are

      valid, such as due to being temporarily disconnected from the domain. (Unresolved

      SIDs have the format of "*S-1-…".)

      If any unresolved SIDs exist and are not for currently valid acco'
    severity: medium
