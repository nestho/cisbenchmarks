- id: '1.18'
  title: SQL6-D0-002400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must provide non-privileged users with error messages that provide information necessary for corrective
    actions without revealing information that could be exploited by adversaries. GROUP ID: V-213917 RULE ID: SV-213917r961167'
  rationale: Any DBMS or associated application providing too much information in error messages on the screen or printout
    risks compromising the data and security of the system. The structure and content of error messages need to be carefully
    considered by the organization and development team. Databases can inadvertently provide a wealth of information to an
    attacker through improperly handled error messages. In addition to sensitive business or personal information, database
    errors can provide host names, IP addresses, user names, and other system information not required for troubleshooting
    but very useful to someone targeting the system. Carefully consider the structure/content of error messages. The extent
    to which information systems are able to identify and handle error conditions is guided by organizational policy and operational
    requirements. Information that could be exploited by adversaries includes, for example, logon attempts with passwords
    entered by mistake as the username, mission/business information that can be derived from (if not stated explicitly by)
    information recorded, and personal information, such as account numbers, social security numbers, and credit card numbers.
  impact: ''
  references: []
  page_start: 47
  audit_raw: 'Review application behavior and custom database code (stored procedures, triggers),

    to determine whether error messages contain information beyond what is needed for

    explaining the issue to general users.

    If database error messages contain PII data, sensitive business data, or information

    useful for identifying the host system or database structure, this is a finding.'
  remediation: 'Adjust database code to remove any information not required for explaining the error to

    an end user.

    Consider enabling trace flag 3625 to mask certain system-level error information

    returned to non-administrative users.

    Launch SQL Server Configuration Manager >> Click SQL Services >> Open the

    instance properties >> Click the Service Parameters tab >> Enter "-T3625" >> Click Add

    >> Click OK >> Restart SQL instance.'
  checks:
  - type: manual_review
    info: 'Review application behavior and custom database code (stored procedures, triggers),

      to determine whether error messages contain information beyond what is needed for

      explaining the issue to general users.

      If database error messages contain PII data, sensitive business data, or information

      useful for identifying the host system or database structure, this is a finding.'
    severity: medium
- id: '1.19'
  title: SQL6-D0-002500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must associate organization-defined types of security labels having organization-defined security
    label values with information in storage. GROUP ID: V-213918 RULE ID: SV-213918r961269'
  rationale: Without the association of security labels to information, there is no basis for SQL Server to make security-related
    access-control decisions. Security labels are abstractions representing the basic properties or characteristics of an
    entity (e.g., subjects and objects) with respect to safeguarding information. These labels are typically associated with
    internal data structures (e.g., tables, rows) within the database and are used to enable the implementation of access
    control and flow control policies; reflect special dissemination, handling, or distribution instructions; or support other
    aspects of the information security policy. One example includes marking data as classified or FOUO. These security labels
    may be assigned manually or during data processing, but, either way, it is imperative these assignments are maintained
    while the data is in storage. If the security labels are lost when the data is stored, there is the risk of a data compromise.
    The mechanism used to support security labeling may be a feature of SQL Server, a third-party product, or custom application
    code.
  impact: ''
  references: []
