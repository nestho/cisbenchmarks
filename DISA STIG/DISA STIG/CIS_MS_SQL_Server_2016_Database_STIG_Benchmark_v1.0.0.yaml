    \ of use in making this determination:\n;with objects_cte as\n(SELECT o.name, o.type_desc,\n CASE\n WHEN o.principal_id\
    \ is null then s.principal_id\n ELSE o.principal_id\n END as principal_id\n FROM sys.objects o\n INNER JOIN sys.schemas\
    \ s\n ON o.schema_id = s.schema_id\n WHERE o.is_ms_shipped = 0\n)\nSELECT cte.name, cte.type_desc, dp.name as ObjectOwner\n\
    FROM objects_cte cte\nINNER JOIN sys.database_principals dp\nON cte.principal_id = dp.principal_id\nORDER BY dp.name,\
    \ cte.name\nIf any of the listed owners is not authorized, this is a finding."
  remediation: 'Add and/or update system documentation to include any accounts authorized for object

    ownership and remove any account not authorized.

    To change the schema owning a database object in SQL Server, use this code as an

    example:

    USE AdventureWorks2012;

    GO

    ALTER SCHEMA HumanResources TRANSFER Person.Address;

    GO

    Caution: This can break code. This Fix should be implemented in conjunction with

    corrections to such code. Test before deploying in production. Deploy during a

    scheduled maintenance window.'
