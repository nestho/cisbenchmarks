      \ DP.state_desc, DP.permission_name\nFRO"
    severity: medium
- id: '1.11'
  title: SQL6-D0-001500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'In the event of a system failure, hardware loss or disk failure, SQL Server must be able to restore necessary
    databases with least disruption to mission processes. GROUP ID: V-213910 RULE ID: SV-213910r961125'
  rationale: Failure to a known state can address safety or security in accordance with the mission/business needs of the
    organization. Failure to a known secure state helps prevent a loss of confidentiality, integrity, or availability in the
    event of a failure of the information system or a component of the system. In the event of a system failure, SQL Server
    must be able to bring the database back to a consistent state.
  impact: ''
  references: []
  page_start: 33
  audit_raw: "Review the system security plan (SSP) to determine whether the database is static, the\nrecovery model to be\
    \ used, the backup schedule, and the plan for testing database\nrestoration.\nIf the SSP does not state that the database\
    \ is static, assume that it is not static. If any of\nthe other information is absent, this is a finding.\nIf the database\
    \ is not static, and the documented recovery model is Bulk Logged, but\nthe justification and authorization for this are\
    \ not documented, this is a finding.\nRun the following to determine Recovery Model:\nUSE [master]\nGO\nSELECT name, recovery_model_desc\n\
    FROM sys.databases\nORDER BY name\nIf the recovery model description does not match the documented recovery model, this\n\
    is a finding.\nReview the jobs set up to implement the backup plan. If they are absent, this is a\nfinding.\nCheck the\
    \ history of the backups by running the following query. It checks the last 30\ndays of backups by database.\nUSE [msdb]\n\
    GO\nSELECT database_name,\n CASE type\n WHEN 'D' THEN 'Full'\n WHEN 'I' THEN 'Differential'\n WHEN 'L' THEN 'Log'\n ELSE\
    \ type\n END AS backup_type,\n is_copy_only,\n backup_start_date, backup_finish_date\nFROM dbo.backupset\nWHERE backup_start_date\
    \ >= dateadd(day, - 30, getdate())\nORDER BY database_name, backup_start_date DESC\nIf the history indicates a pattern\
    \ of job failures by missing or gaps in backups, this is a\nfinding.\nReview evidence that database recovery is tested\
    \ annually or more often, and that the\nmost recent test was successful. If not, this is a finding."
  remediation: 'Modify the system security plan, to include whether the database is static, the correct

    recovery model to be used, the backup schedule, and the plan for testing database

    restoration.

    In SQL Server Management Studio, Object Explorer, right-click on the name of the

    database; select Properties. Select the Options page. Set the Recovery Model field,

    near the top of the page, to the correct value.

    In Object Explorer, expand >> SQL Server Agent >> Jobs. Create, modify, and delete

    jobs to implement the backup schedule. (Alternatively, this may done using T-SQL code

    or Third-party Backup software.)

    Correct any issues that have been causing backups to fail.

    Test the restoration of the database at least once a year; correct any issues that cause

    it to fail. Maintain a record of these tests.'
  checks:
  - type: sql
    command: SELECT name, recovery_model_desc
    severity: medium
    info: 'Review the system security plan (SSP) to determine whether the database is static, the

      recovery model to be used, the backup schedule, and the plan for testing database

      restoration.

      If the SSP does not state that the database is static, assume that it is not static. If any of

      the other information is absent, this is a finding.

      If the database is not static, and the documented recovery model is Bul'
- id: '1.12'
  title: SQL6-D0-001600
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Database Master Key encryption password must meet DOD password complexity requirements. GROUP ID: V-213911
    RULE ID: SV-213911r961128'
  rationale: Weak passwords may be easily guessed. When passwords are used to encrypt keys used for encryption of sensitive
    data, then the confidentiality of all data encrypted using that key is at risk.
  impact: ''
  references: []
  page_start: 35
  audit_raw: 'From the query prompt:

    SELECT name

    FROM [master].sys.databases

    WHERE state = 0

    Repeat for each database:

    From the query prompt:

    USE [database name]

    SELECT COUNT(name)

    FROM sys.symmetric_keys s, sys.key_encryptions k

    WHERE s.name = ''##MS_DatabaseMasterKey##''

    AND s.symmetric_key_id = k.key_id

    AND k.crypt_type in (''ESKP'', ''ESP2'', ''ESP3'')

    If the value returned is zero, this is not applicable.

    If the value returned is greater than zero, a Database Master Key exists and is

    encrypted with a password.

    Review procedures and evidence of password requirements used to encrypt Database

    Master Keys.

    If the passwords are not required to meet DoD password standards, currently a

    minimum of 15 characters with at least 1 upper-case character, 1 lower-case character,

    1 special character, and 1 numeric character, and at least 8 characters changed from

    the previous password, this is a finding.'
  remediation: 'Assign an encryption password to the Database Master Key that is a minimum of 15

    characters with at least 1 upper-case character, 1 lower-case character, 1 special

    character, and 1 numeric character, and at least 8 characters changed from the

    previous password.

    To change the Database Master Key encryption password:

    USE [database name];

    ALTER MASTER KEY REGENERATE WITH ENCRYPTION BY PASSWORD = ''[new password]'';

    Note: The Database Master Key encryption method should not be changed until the

    effects are thoroughly reviewed. Changing the master key encryption causes all

    encryption using the Database Master Key to be decrypted and re-encrypted. This

    action should not be taken during a high-demand time. Please see the MS SQL Server

    documentation prior to re-encrypting the Database Master Key for detailed information.'
  checks:
  - type: sql
    command: SELECT name
    severity: medium
    info: 'From the query prompt:

      SELECT name

      FROM [master].sys.databases

      WHERE state = 0

