- id: '1.10'
  title: SQL6-D0-001400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The role(s)/group(s) used to modify database structure (including but not necessarily limited to tables, indexes,
    storage, etc.) and logic modules (stored procedures, functions, triggers, links to software external to SQL Server, etc.)
    must be restricted to authorized users. GROUP ID: V-213909 RULE ID: SV-213909r960960'
  rationale: If SQL Server were to allow any user to make changes to database structure or logic, then those changes might
    be implemented without undergoing the appropriate testing and approvals that are part of a robust change management process.
    Accordingly, only qualified and authorized individuals shall be allowed to obtain access to information system components
    for purposes of initiating changes, including upgrades and modifications. Unmanaged changes that occur to the database
    software libraries or configuration can lead to unauthorized or compromised installations.
  impact: ''
  references: []
  page_start: 31
  audit_raw: "Obtain a listing of users and roles who are authorized to modify database structure and\nlogic modules from\
    \ the server documentation.\nExecute the following query:\nSELECT P.type_desc AS principal_type, P.name AS principal_name,\
    \ O.type_desc,\n CASE class\n WHEN 0 THEN DB_NAME()\n WHEN 1 THEN OBJECT_SCHEMA_NAME(major_id) + '.' + OBJECT_NAME(major_id)\n\
    \ WHEN 3 THEN SCHEMA_NAME(major_id)\n ELSE class_desc + '(' + CAST(major_id AS nvarchar) + ')'\n END AS securable_name,\
    \ DP.state_desc, DP.permission_name\nFROM sys.database_permissions DP\nJOIN sys.database_principals P ON DP.grantee_principal_id\
    \ = P.principal_id\nLEFT OUTER JOIN sys.all_objects O ON O.object_id = DP.major_id AND O.type IN\n('TR','TA','P','X','RF','PC','IF','FN','TF','U')\n\
    WHERE DP.type IN ('AL','ALTG') AND DP.class IN (0, 1, 53)\nSELECT R.name AS role_name, M.type_desc AS principal_type,\
    \ M.name AS\nprincipal_name\nFROM sys.database_principals R\nJOIN sys.database_role_members DRM ON R.principal_id = DRM.role_principal_id\n\
    JOIN sys.database_principals M ON DRM.member_principal_id = M.principal_id\nWHERE R.name IN ('db_ddladmin','db_owner')\n\
    AND M.name != 'dbo'\nIf any users or role permissions returned are not authorized to modify the specified\nobject or type,\
    \ this is a finding.\nIf any user or role membership is not authorized, this is a finding."
  remediation: 'Document and obtain approval for any non-administrative users who require the ability

    to modify database structure and logic modules.

    REVOKE ALTER ON [<Object Name>] TO [<Principal Name>]'
