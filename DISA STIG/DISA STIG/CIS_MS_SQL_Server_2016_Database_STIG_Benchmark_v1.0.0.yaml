      \ != 1\nObjects owned by an individual principal:\nSELECT obj"
- id: '1.23'
  title: SQL6-D0-002900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Execution of stored procedures and functions that utilize execute as must be restricted to necessary cases
    only. GROUP ID: V-213922 RULE ID: SV-213922r961359'
  rationale: In certain situations, to provide required functionality, a DBMS needs to execute internal logic (stored procedures,
    functions, triggers, etc.) and/or external code modules with elevated privileges. However, if the privileges required
    for execution are at a higher level than the privileges assigned to organizational users invoking the functionality applications/programs,
    those users are indirectly provided with greater privileges than assigned by organizations. Privilege elevation must be
    utilized only where necessary and protected from misuse.
  impact: ''
  references: []
  page_start: 57
  audit_raw: "Review the system documentation to obtain a listing of stored procedures and functions\nthat utilize impersonation.\
    \ Execute the following query:\nSELECT S.name AS schema_name, O.name AS module_name,\nUSER_NAME(\nCASE M.execute_as_principal_id\n\
    WHEN -2 THEN COALESCE(O.principal_id, S.principal_id)\nELSE M.execute_as_principal_id\nEND\n) AS execute_as\nFROM sys.sql_modules\
    \ M\nJOIN sys.objects O ON M.object_id = O.object_id\nJOIN sys.schemas S ON O.schema_id = S.schema_id\nWHERE execute_as_principal_id\
    \ IS NOT NULL\nand o.name not in\n(\n'fn_sysdac_get_username',\n 'fn_sysutility_ucp_get_instance_is_mi',\n 'sp_send_dbmail',\n\
    \ 'sp_SendMailMessage',\n 'sp_syscollector_create_collection_set',\n 'sp_syscollector_delete_collection_set',\n 'sp_syscollector_disable_collector',\n\
    \ 'sp_syscollector_enable_collector',\n'sp_syscollector_get_collection_set_execution_status',\n 'sp_syscollector_run_collection_set',\n\
    \ 'sp_syscollector_start_collection_set',\n 'sp_syscollector_update_collection_set',\n 'sp_syscollector_upload_collection_set',\n\
    \ 'sp_syscollector_verify_collector_state',\n 'sp_syspolicy_add_policy',\n 'sp_syspolicy_add_policy_category_subscription',\n\
    \ 'sp_syspolicy_delete_policy',\n'sp_syspolicy_delete_policy_category_subscription',\n 'sp_syspolicy_update_policy',\n\
    \ 'sp_sysutility_mi_add_ucp_registration',\n 'sp_sysutility_mi_disable_collection',\n 'sp_sysutility_mi_enroll',\n 'sp_sysutility_mi_initialize_collection',\n\
    \ 'sp_sysutility_mi_remove',\n 'sp_sysutility_mi_remove_ucp_registration',\n 'sp_sysutility_mi_upload',\n'sp_sysutility_mi_validate_enrollment_preconditions',\n\
    \ 'sp_sysutility_ucp_add_mi',\n 'sp_sysutility_ucp_add_policy',\n'sp_sysutility_ucp_calculate_aggregated_dac_health',\n\
    'sp_sysutility_ucp_calculate_aggregated_mi_health',\n 'sp_sysutility_ucp_calculate_computer_health',\n'sp_sysutility_ucp_calculate_dac_file_space_health',\n\
    \ 'sp_sysutility_ucp_calculate_dac_health',\n'sp_sysutility_ucp_calculate_filegroups_with_policy_violations',\n 'sp_sysutility_ucp_calculate_health',\n\
    'sp_sysutility_ucp_calculate_mi_file_space_health',\n 'sp_sysutility_ucp_calculate_mi_health',\n 'sp_sysutility_ucp_configure_policies',\n\
    \ 'sp_sysutility_ucp_create',\n 'sp_sysutility_ucp_delete_policy',\n 'sp_sysutility_ucp_delete_policy_history',\n 'sp_sysutility_ucp_get_policy_violations',\n\
    \ 'sp_sysutility_ucp_initialize',\n 'sp_sysutility_ucp_initialize_mdw',\n 'sp_sysutility_ucp_remove_mi',\n 'sp_sysutility_ucp_update_policy',\n\
    'sp_sysutility_ucp_update_utility_configuration',\n 'sp_sysutility_ucp_validate_prerequisites',\n 'sp_validate_user',\n\
    'syscollector_collection_set_is_running_update_trigger',\n 'sysmail_help_status_sp'\n)\nORDER BY schema_name, module_name\n\
    If any procedures or functions are returned that are not documented, this is a finding."
  remediation: Alter stored procedures and functions to remove the EXECUTE AS statement.
  checks:
  - type: manual_review
    info: 'Review the system documentation to obtain a listing of stored procedures and functions

      that utilize impersonation. Execute the following query:

      SELECT S.name AS schema_name, O.name AS module_name,

      USER_NAME(

      CASE M.execute_as_principal_id

      WHEN -2 THEN COALESCE(O.principal_id, S.principal_id)

      ELSE M.execute_as_principal_id

      END

      ) AS execute_as

      FROM sys.sql_modules M

      JOIN sys.objects O ON M.object_id = O.object_id

      JOIN sys.schemas S ON O.schema_id = S.schema_id

      WHERE execute_as_principal_id IS NOT '
    severity: medium
- id: '1.24'
  title: SQL6-D0-003000
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must prohibit user installation of logic modules (stored procedures, functions, triggers, views,
    etc.) without explicit privileged status. GROUP ID: V-213923 RULE ID: SV-213923r1018608'
  rationale: Allowing regular users to install software, without explicit privileges, creates the risk that untested or potentially
    malicious software will be installed on the system. Explicit privileges (escalated or administrative privileges) provide
    the regular user with explicit capabilities and control that exceed the rights of a regular user. DBMS functionality and
    the nature and requirements of databases will vary; so while users are not permitted to install unapproved software, there
    may be instances where the organization allows the user to install approved software packages such as from an approved
    software repository. The requirements for production servers will be more restrictive than those used for development
    and research. SQL Server must enforce software installation by users based upon what types of software installations are
    permitted (e.g., updates and security patches to existing software) and what types of installations are prohibited (e.g.,
    software whose pedigree with regard to being potentially malicious is unknown or suspect) by the organization. In the
    case of a database management system, this requirement covers stored procedures, functions, triggers, views, etc.
  impact: ''
  references: []
  page_start: 60
  audit_raw: 'If the SQL Server instance supports only software development, experimentation,

    and/or developer-level testing (i.e., excluding production systems, integration testing,

    stress testing, and user acceptance testing), this is not a finding.

    Obtain a listing of users and roles who are authorized to create, alter, or replace logic

    modules from the server documentation.

    In each user database, execute the following query:

    SELECT P.type_desc AS principal_type, P.name AS principal_name,

    O.type_desc,

    CASE class

    WHEN 0 THEN DB_NAME()

    WHEN 1 THEN OBJECT_SCHEMA_NAME(major_id) + ''.'' + OBJECT_NAME(major_id)

    WHEN 3 THEN SCHEMA_NAME(major_id)

    ELSE class_desc + ''('' + CAST(major_id AS nvarchar) + '')''

    END AS securable_name, DP.state_desc, DP.permission_name

    FROM sys.database_permissions DP

    JOIN sys.database_principals P ON DP.grantee_principal_id = P.principal_id

    LEFT OUTER JOIN sys.all_objects O ON O.object_id = DP.major_id AND O.type IN

    (''TR'',''TA'',''P'',''X'',''RF'',''PC'',''IF'',''FN'',''TF'',''U'')

    WHERE DP.type IN (''AL'',''ALTG'') AND DP.class IN (0, 1, 53)

    SELECT R.name AS role_name, M.type_desc AS principal_type, M.name AS

    principal_name

    FROM sys.database_principals R

    JOIN sys.database_role_members DRM ON R.principal_id = DRM.role_principal_id

    JOIN sys.database_principals M ON DRM.member_principal_id = M.principal_id

    WHERE R.name IN (''db_ddladmin'',''db_owner'')

    AND M.name != ''dbo''

    If any users or role permissions returned are not authorized to modify the specified

    object or type, this is a finding.

    If any user or role membership is not authorized, this is a finding.'
  remediation: 'Document and obtain approval for any nonadministrative users who require the ability to

    create, alter, or replace logic modules.

    Revoke the ALTER permission from unauthorized users and roles:

    REVOKE ALTER ON [<Object Name>] TO [<Principal Name>]'
  checks:
  - type: manual_review
    info: 'If the SQL Server instance supports only software development, experimentation,

      and/or developer-level testing (i.e., excluding production systems, integration testing,

      stress testing, and user acceptance testing), this is not a finding.

      Obtain a listing of users and roles who are authorized to create, alter, or replace logic

      modules from the server documentation.

      In each user database, execute the following query:

      SELECT P.type_desc AS principal_type, P.name AS principal_name,

      O.type_desc,

      CASE'
    severity: medium
- id: '1.25'
  title: SQL6-D0-003100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must enforce access restrictions associated with changes to the configuration of the database(s).
    GROUP ID: V-213924 RULE ID: SV-213924r961461'
  rationale: Failure to provide logical access restrictions associated with changes to configuration may have significant
    effects on the overall security of the system. When dealing with access restrictions pertaining to change control, it
    should be noted that any changes to the hardware, software, and/or firmware components of the information system can potentially
    have significant effects on the overall security of the system. Accordingly, only qualified and authorized individuals
    should be allowed to obtain access to system components for the purposes of initiating changes, including upgrades and
    modifications.
  impact: ''
  references: []
  page_start: 62
  audit_raw: "Execute the following query to obtain a listing of user databases whose owner is a\nmember of a fixed server\
    \ role:\nSELECT\n D.name AS database_name, SUSER_SNAME(D.owner_sid) AS owner_name,\n FRM.is_fixed_role_member\nFROM sys.databases\
    \ D\nOUTER APPLY (\n SELECT MAX(fixed_role_member) AS is_fixed_role_member\n FROM (\n SELECT IS_SRVROLEMEMBER(R.name,\
    \ SUSER_SNAME(D.owner_sid))\nAS fixed_role_member\n FROM sys.server_principals R\n WHERE is_fixed_role = 1\n ) A\n) FRM\n\
    WHERE D.database_id > 4\n AND (FRM.is_fixed_role_member = 1\n OR FRM.is_fixed_role_member IS NULL)\nORDER BY database_name\n\
    If no databases are returned, this is not a finding.\nFor each database/login returned, review the Server Role memberships\n\
    1. In SQL Server Management Studio, Expand “Logins”\n2. Double-click the name of the Login\n3. Click the “Server Roles”\
    \ tab\nIf any server roles are selected, but not documented and authorized, this is a finding."
  remediation: 'Remove unauthorized users from roles:

    ALTER ROLE DROP MEMBER user;

    https://msdn.microsoft.com/en-us/library/ms189775.aspx

    Set the owner of the database to an authorized login:

    ALTER AUTHORIZATION ON database::DatabaseName TO login;

    https://msdn.microsoft.com/en-us/library/ms187359.aspx'
  checks:
  - type: sql
    command: "SELECT\n D.name AS database_name, SUSER_SNAME(D.owner_sid) AS owner_name,"
    severity: medium
    info: "Execute the following query to obtain a listing of user databases whose owner is a\nmember of a fixed server role:\n\
      SELECT\n D.name AS database_name, SUSER_SNAME(D.owner_sid) AS owner_name,\n FRM.is_fixed_role_member\nFROM sys.databases\
      \ D\nOUTER APPLY (\n SELECT MAX(fixed_role_member) AS is_fixed_role_member\n FROM (\n SELECT IS_SRVROLEMEMBER(R.name,\
      \ SUSER_SNAME(D.owner_sid))\nAS fixed_role_member\n FROM sys"
- id: '1.26'
  title: SQL6-D0-003200
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'SQL Server must use NSA-approved cryptography to protect classified information in accordance with the data
    owners requirements. GROUP ID: V-251040 RULE ID: SV-251040r962034'
  rationale: Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect data.
    The application must implement cryptographic modules adhering to the higher standards approved by the federal government
    since this provides assurance they have been tested and validated. It is the responsibility of the data owner to assess
    the cryptography requirements in light of applicable federal laws, Executive Orders, directives, policies, regulations,
    and standards. NSA-approved cryptography for classified networks is hardware based. This requirement addresses the compatibility
    of a DBMS with the encryption devices.
  impact: ''
  references: []
  page_start: 64
  audit_raw: 'Detailed information on the NIST Cryptographic Module Validation Program (CMVP) is

    available at the following website: http://csrc.nist.gov/groups/STM/cmvp/index.html.

    Review system documentation to determine whether cryptography for classified or

    sensitive information is required by the information owner.

    If the system documentation does not specify the type of information hosted on SQL

    Server as classified, sensitive, and/or unclassified, this is a finding.

    If neither classified nor sensitive information exists within SQL Server databases or

    configuration, this is not a finding.

    Verify that Windows is configured to require the use of FIPS-compliant algorithms.

    Click "Start", enter "Local Security Policy", and then press "Enter". Expand "Local

    Policies", select "Security Options", and then locate "System Cryptography: Use FIPS

    compliant algorithms for encryption, hashing, and signing".

    If the Security Setting for this option is "Disabled", this is a finding.

    Note: The list of acceptable algorithms is "AES 256" and "Triple DES".

    If cryptography is being used by SQL Server, verify that the cryptography is NIST FIPS

    140-2 or 140-3 certified by running the following SQL query:

    SELECT DISTINCT name, algorithm_desc

    FROM sys.symmetric_keys

    WHERE key_algorithm NOT IN (''D3'',''A3'')

    ORDER BY name

    If any items listed show an uncertified NIST FIPS 140-2 algorithm type, this is a finding.'
  remediation: "Configure cryptographic functions to use NSA-approved cryptography compliant\nalgorithms.\nUse DoD code-signing\
    \ certificates to create asymmetric keys stored in the database\nused to encrypt sensitive data stored in the database.\n\
    Run the following SQL script to create a certificate:\nUSE\nCREATE CERTIFICATE\n ENCRYPTION BY PASSWORD = <'password'>\n\
    \ FROM FILE = <'path/file_name'>\n WITH SUBJECT = 'name of person creating key',\n EXPIRY_DATE = '<'expiration date: yyyymmdd'>'\n\
    Run the following SQL script to create a symmetric key and assign an existing\ncertificate:\nUSE\nCREATE SYMMETRIC KEY\
    \ <'key name'>\n WITH ALGORITHM = AES_256\n ENCRYPTION BY CERTIFICATE\nFor Transparent Data Encryption (TDE):\nUSE master;\n\
    CREATE MASTER KEY ENCRYPTION BY PASSWORD = '';\nCREATE CERTIFICATE . . .;\nUSE ;\nCREATE DATABASE ENCRYPTION KEY\nWITH\
    \ ALGORITHM = AES_256\nENCRYPTION BY SERVER CERTIFICATE ;\nALTER DATABASE\nSET ENCRYPTION ON;"
  checks:
  - type: sql
    command: 'select "Security Options", and then locate "System Cryptography: Use FIPS'
    severity: medium
    info: 'Detailed information on the NIST Cryptographic Module Validation Program (CMVP) is

      available at the following website: http://csrc.nist.gov/groups/STM/cmvp/index.html.

      Review system documentation to determine whether cryptography for classified or

      sensitive information is required by the information owner.

      If the system documentation does not specify the type of information hosted on SQL

      Server as'
- id: '1.27'
  title: SQL6-D0-003300
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'SQL Server must implement cryptographic mechanisms to prevent unauthorized modification of organization-defined
    information at rest (to include, at a minimum, PII and classified information) on organization-defined information system
    components. GROUP ID: V-213926 RULE ID: SV-213926r1018576'
  rationale: DBMSs handling data requiring "data at rest" protections must employ cryptographic mechanisms to prevent unauthorized
    disclosure and modification of the information at rest. These cryptographic mechanisms may be native to SQL Server or
    implemented via additional software or operating system/file system settings, as appropriate to the situation. Selection
    of a cryptographic mechanism is based on the need to protect the integrity of organizational information. The strength
    of the mechanism is commensurate with the security category and/or classification of the information. Organizations have
    the flexibility to either encrypt all information on storage devices (i.e., full disk encryption) or encrypt specific
    data structures (e.g., files, records, or fields). The decision whether and what to encrypt rests with the data owner
    and is also influenced by the physical measures taken to secure the equipment and media on which the information resides.
  impact: ''
  references: []
  page_start: 66
  audit_raw: 'Review the system documentation to determine whether the organization has defined

    the information at rest that is to be protected from modification, which must include, at a

    minimum, PII and classified information.

    If no information is identified as requiring such protection, this is not a finding.

    Review the configuration of SQL Server, Windows, and additional software as relevant.

    If full-disk encryption is required, and Windows or the storage system is not configured

    for this, this is a finding.

    If database transparent data encryption (TDE) is called for, check whether it is enabled:

    SELECT

    DB_NAME(database_id) AS [Database Name], CASE encryption_state WHEN 0 THEN

    ''No database encryption key present, no encryption''

    WHEN 1 THEN ''Unencrypted''

    WHEN 2 THEN ''Encryption in progress''

    WHEN 3 THEN ''Encrypted''

    WHEN 4 THEN ''Key change in progress''

    WHEN 5 THEN ''Decryption in progress''

    WHEN 6 THEN ''Protection change in progress''

    END AS [Encryption State]

    FROM sys.dm_database_encryption_keys

    For each user database for which encryption is called for and it is marked Unencrypted,

