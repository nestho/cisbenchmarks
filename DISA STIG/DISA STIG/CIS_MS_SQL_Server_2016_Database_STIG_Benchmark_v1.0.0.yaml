- id: '1.22'
  title: SQL6-D0-002800
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'SQL Server must enforce discretionary access control policies, as defined by the data owner, over defined
    subjects and objects. GROUP ID: V-213921 RULE ID: SV-213921r961317'
  rationale: Discretionary Access Control (DAC) is based on the notion that individual users are "owners" of objects and therefore
    have discretion over who should be authorized to access the object and in which mode (e.g., read or write). Ownership
    is usually acquired as a consequence of creating the object or via specified ownership assignment. DAC allows the owner
    to determine who will have access to objects they control. An example of DAC includes user-controlled table permissions.
    When discretionary access control policies are implemented, subjects are not constrained with regard to what actions they
    can take with information for which they have already been granted access. Thus, subjects that have been granted access
    to information are not prevented from passing (i.e., the subjects have the discretion to pass) the information to other
    subjects or objects. A subject that is constrained in its operation by Mandatory Access Control policies is still able
    to operate under the less rigorous constraints of this requirement. Thus, while Mandatory Access Control imposes constraints
    preventing a subject from passing information to another subject operating at a different sensitivity level, this requirement
    permits the subject to pass the information to any subject at the same sensitivity level. The policy is bounded by the
    information system boundary. Once the information is passed outside of the control of the information system, additional
    means may be required to ensure the constraints remain in effect. While the older, more traditional definitions of discretionary
    access control require identity-based access control, that limitation is not required for this use of discretionary access
    control.
  impact: ''
  references: []
  page_start: 55
  audit_raw: "Review system documentation to determine requirements for object ownership and\nauthorization delegation.\n\
    Use the following query to discover database object ownership:\nSchemas not owned by the schema or dbo:\nSELECT name AS\
    \ schema_name, USER_NAME(principal_id) AS schema_owner\nFROM sys.schemas\nWHERE schema_id != principal_id\n AND principal_id\
    \ != 1\nObjects owned by an individual principal:\nSELECT object_id, name AS securable,\n USER_NAME(principal_id) AS object_owner,\n\
    \ type_desc\nFROM sys.objects\nWHERE is_ms_shipped = 0 AND principal_id IS NOT NULL\nORDER BY type_desc, securable, object_owner\n\
    Use the following query to discover database users who have been delegated the right\nto assign additional permissions:\n\
    SELECT U.type_desc, U.name AS grantee,\n DP.class_desc AS securable_type,\n CASE DP.class\n WHEN 0 THEN DB_NAME()\n WHEN\
    \ 1 THEN OBJECT_NAME(DP.major_id)\n WHEN 3 THEN SCHEMA_NAME(DP.major_id)\n ELSE CAST(DP.major_id AS nvarchar)\n END AS\
    \ securable,\n permission_name, state_desc\nFROM sys.database_permissions DP\nJOIN sys.database_principals U ON DP.grantee_principal_id\
    \ = U.principal_id\nWHERE DP.state = 'W'\nORDER BY grantee, securable_type, securable\nIf any of these rights are not\
    \ documented and authorized, this is a finding."
  remediation: 'To correct object ownership:

    ALTER AUTHORIZATION ON <Securable> TO <Principal>

    To revoke any unauthorized permissions:

    REVOKE [Permission] ON <Securable> TO <Principal>'
  checks:
  - type: sql
    command: SELECT name AS schema_name, USER_NAME(principal_id) AS schema_owner
    severity: medium
    info: "Review system documentation to determine requirements for object ownership and\nauthorization delegation.\nUse\
