- id: '1.14'
  title: SQL6-D0-001800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Certificate used for encryption must be backed up and stored in a secure location that is not on the SQL
    Server. GROUP ID: V-213913 RULE ID: SV-213913r961128'
  rationale: Backup and recovery of the Certificate used for encryption is critical to the complete recovery of the database.
    Not having this key can lead to loss of data during recovery.
  impact: ''
  references: []
  page_start: 39
  audit_raw: 'If the application owner and authorizing official have determined that encryption of data

    at rest is not required, this is not a finding.

    Review procedures for and evidence of backup of the Certificate used for encryption in

    the System Security Plan.

    If the procedures or evidence does not exist, this is a finding.

    If the procedures do not indicate that a backup of the Certificate used for encryption is

    stored in a secure location that is not on the SQL Server, this is a finding.

    If procedures do not indicate access restrictions to the Certificate backup, this is a

    finding.'
  remediation: 'Document and implement procedures to safely back up and store the Certificate used

    for encryption in a secure location that is not on the SQL Server. Include in the

    procedures to establish evidence of backup and storage as well as careful, restricted

    access and restoration of the Certificate.

    BACKUP CERTIFICATE ''CertificateName'' TO FILE = ''path_to_file''

    WITH PRIVATE KEY (FILE = ''path_to_pvk'', ENCRYPTION BY PASSWORD = ''password'');

    As this requires a password, ensure it is not exposed to unauthorized persons or stored

    as plain text.'
