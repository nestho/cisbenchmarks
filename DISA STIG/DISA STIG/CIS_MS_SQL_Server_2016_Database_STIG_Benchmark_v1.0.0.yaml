- id: '1.1'
  title: SQL6-D0-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'SQL Server databases must integrate with an organization-level authentication/access mechanism providing account
    management and automation for all users, groups, roles, and any other principals. GROUP ID: V-213900 RULE ID: SV-213900r1043176'
  rationale: 'Enterprise environments make account management for applications and databases challenging and complex. A manual
    process for account management functions adds the risk of a potential oversight or other error. Managing accounts for
    the same person in multiple places is inefficient and prone to problems with consistency and synchronization. A comprehensive
    application account management process that includes automation helps to ensure that accounts designated as requiring
    attention are consistently and promptly addressed. Examples include, but are not limited to, using automation to take
    action on multiple accounts designated as inactive, suspended, or terminated, or by disabling accounts located in noncentralized
    account stores, such as multiple servers. Account management functions can also include: assignment of group or role membership;
    identifying account type; specifying user access authorizations (i.e., privileges); account removal, update, or termination;
    and administrative alerts. The use of automated mechanisms can include, for example: using email or text messaging to
    notify account managers when users are terminated or transferred; using the information system to monitor account usage;
    and using automated telephone notification to report atypical system account usage. SQL Server must be configured to automatically
    utilize organization-level account management functions, and these functions must immediately enforce the organization''s
    current account policy. Automation may be comprised of differing technologies that when placed together, contain an overall
    mechanism supporting an organization''s automated account management requirements.'
  impact: ''
  references: []
  page_start: 11
  audit_raw: "Determine if SQL Server is configured to allow the use of contained databases, if it is,\ntake the appropriate\
    \ precautions to limit their risk.\n1. In the Object Explorer in SQL Server Management Studio (SSMS), right-click on\n\
    the server instance, select \"Properties\", and then select the \"Advanced\" page.\nIf \"Enabled Contained Databases\"\
    \ is \"False\", this is not a finding.\n2. If \"Enabled Contained Databases\" is \"True\", then in a query interface such\
    \ as the\nSSMS Transact-SQL editor, run the statement: EXEC sp_configure 'contained\ndatabase authentication' If the returned\
    \ value in the config_value and/or\nrun_value column is 0, this is not a finding.\n3. Determine whether SQL Server is\
    \ configured to use only Windows\nauthentication. In a query interface such as the SSMS Transact-SQL editor, run\nthe\
    \ statement:\nSELECT CASE SERVERPROPERTY('IsIntegratedSecurityOnly')\n WHEN 1 THEN 'Windows Authentication'\n WHEN 0 THEN\
    \ 'Windows and SQL Server Authentication'\nEND as [Authentication Mode]\nIf the returned value in the \"Authentication\
    \ Mode\" column is \"Windows Authentication\",\nthis is not a finding.\nIf mixed mode (both SQL Server authentication\
    \ and Windows authentication) is in use,\nthen it must be documented and approved.\nFrom the documentation, obtain the\
    \ list of accounts authorized to be managed by SQL\nServer.\nDetermine the accounts (SQL Logins) actually managed by SQL\
    \ Server.\nRun the statement:\nSELECT name\nFROM sys.database_principals\nWHERE type_desc = 'SQL_USER'\nAND authentication_type_desc\
    \ = 'DATABASE';\nIf any accounts listed by the query are not listed in the documentation, this is a finding.\nDocumentation\
    \ must be approved by the information system security officer (ISSO)/\ninformation system security manager (ISSM)."
  remediation: 'If mixed mode is required, document the need and justification; describe the measures

    taken to ensure the use of SQL Server authentication is kept to a minimum; describe

    the measures taken to safeguard passwords; list or describe the SQL Logins used; and

    obtain official approval.

    If mixed mode is not required, disable it as follows:

    In the SSMS Object Explorer, right-click on the server instance, select Properties >>

    Security page. Click the radio button for "Windows Authentication Mode", and then click

    "OK".

    Restart the SQL Server instance.

    OR

    Run the statement:

    USE [master]

    EXEC xp_instance_regwrite N''HKEY_LOCAL_MACHINE'',

    N''Software\Microsoft\MSSQLServer\MSSQLServer'', N''LoginMode'', REG_DWORD, 2

    GO

    Restart the SQL Server instance.

    For each account being managed by SQL Server but not requiring it, drop or disable the

    SQL Database user. Replace it with an appropriately configured account, as needed.

    To drop a User in the SSMS Object Explorer:

    Navigate to Databases >> Security Users. Right-click on the User name, and then click

    "Delete".

    To drop a User via a query:

    USE database_name;

    DROP USER <user_name>;'
  checks:
  - type: sql
    command: select "Properties", and then select the "Advanced" page.
    severity: medium
    info: 'Determine if SQL Server is configured to allow the use of contained databases, if it is,

      take the appropriate precautions to limit their risk.

      1. In the Object Explorer in SQL Server Management Studio (SSMS), right-click on

      the server instance, select "Properties", and then select the "Advanced" page.

      If "Enabled Contained Databases" is "False", this is not a finding.

      2. If "Enabled Contained Data'
- id: '1.2'
  title: SQL6-D0-000300
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'SQL Server must enforce approved authorizations for logical access to database information and system resources
    in accordance with applicable access control policies. GROUP ID: V-213901 RULE ID: SV-213901r1112497'
  rationale: Authentication with a DoD-approved PKI certificate does not necessarily imply authorization to access SQL Server.
    To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates by
    DoD-approved PKIs, all DoD systems, including databases, must be properly configured to implement access control policies.
    Successful authentication must not automatically give an entity access to an asset or security boundary. Authorization
    procedures and controls must be implemented to ensure each authenticated entity also has a validated and current authorization.
    Authorization is the process of determining whether an entity, once authenticated, is permitted to access a specific asset.
    Information systems use access control policies and enforcement mechanisms to implement this requirement. Access control
    policies include identity-based policies, role-based policies, and attribute-based policies. Access enforcement mechanisms
    include access control lists, access control matrices, and cryptography. These policies and mechanisms must be employed
    by the application to control access between users (or processes acting on behalf of users) and objects (e.g., devices,
    files, records, processes, programs, and domains) in the information system. This requirement is applicable to access
    control enforcement applications, a category that includes database management systems. If SQL Server does not follow
    applicable policy when approving access, it may be in conflict with networks or other applications in the information
    system. This may result in users either gaining or being denied access inappropriately and in conflict with applicable
    policy.
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'Review the system documentation to determine the required levels of protection for

    securables in the database by type of login.

    If the database is tempdb, this is not applicable.

    Review the permissions actually in place in the database.

    If the actual permissions do not match the documented requirements, this is a finding.

    Use the supplemental file "Database permission assignments to users and roles.sql".'
  remediation: 'Use GRANT, REVOKE, DENY, ALTER ROLE ... ADD MEMBER ... and/or ALTER ROLE

    ... DROP MEMBER statements to add and remove permissions on database-level

    securables, bringing them into line with the documented requirements.'
  checks:
  - type: manual_review
    info: 'Review the system documentation to determine the required levels of protection for

      securables in the database by type of login.

      If the database is tempdb, this is not applicable.

      Review the permissions actually in place in the database.

      If the actual permissions do not match the documented requirements, this is a finding.

      Use the supplemental file "Database permission assignments to users and roles.sql".'
    severity: medium
- id: '1.3'
  title: SQL6-D0-000400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must protect against a user falsely repudiating by ensuring only clearly unique Active Directory
    user accounts can connect to the database. GROUP ID: V-213902 RULE ID: SV-213902r960864'
  rationale: Non-repudiation of actions taken is required in order to maintain data integrity. Examples of particular actions
    taken by individuals include creating information, sending a message, approving information (e.g., indicating concurrence
    or signing a contract), and receiving a message. Non-repudiation protects against later claims by a user of not having
    created, modified, or deleted a particular data item or collection of data in the database. In designing a database, the
    organization must define the types of data and the user actions that must be protected from repudiation. The implementation
    must then include building audit features into the application data tables and configuring the DBMS's audit tools to capture
    the necessary audit trail. Design and implementation also must ensure that applications pass individual user identification
    to the DBMS, even where the application connects to the DBMS with a standard, shared account. If the computer account
    of a remote computer is granted access to a SQL Server database, any service or scheduled task running as NT AUTHORITY\SYSTEM
    or NT AUTHORITY\NETWORK SERVICE can log into the instance and perform actions. These actions cannot be traced back to
    a specific user or process.
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Execute the following query:

    SELECT name

    FROM sys.database_principals

    WHERE type in (''U'',''G'')

    AND name LIKE ''%$''

    If no users are returned, this is not a finding.

    If users are returned, determine whether each user is a computer account.

    Launch PowerShell.

    Execute the following code:

    Note: represents the username portion of the user. For example; if the user is

    CONTOSO\user1$, the username is user1.

    ([ADSISearcher]"(&(ObjectCategory=Computer)(Name=<name>))").FindAll()

    If no account information is returned, this is not a finding.

    If account information is returned, this is a finding.'
  remediation: 'Remove all users that were returned in the check SQL Statement:

    SELECT name

    FROM sys.database_principals

    WHERE type in (''U'',''G'')

    AND name LIKE ''%$''

    To remove users:

    Run the following command for each user:

    DROP USER [ IF EXISTS ] <user_name>;'
  checks:
  - type: sql
    command: SELECT name
    severity: medium
    info: 'Execute the following query:

      SELECT name

      FROM sys.database_principals

      WHERE type in (''U'',''G'')

      AND name LIKE ''%$''

      If no users are returned, this is not a finding.

      If users are returned, determine whether each user is a computer account.

      Launch PowerShell.

      Execute the following code:

      Note: represents the username portion of the user. For example; if the user is

      CONTOSO\user1$, the username is user1.'
- id: '1.4'
  title: SQL6-D0-000500
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'SQL Server must protect against a user falsely repudiating by use of system-versioned tables (Temporal Tables).
    GROUP ID: V-213903 RULE ID: SV-213903r960864'
  rationale: Non-repudiation of actions taken is required in order to maintain data integrity. Examples of particular actions
    taken by individuals include creating information, sending a message, approving information (e.g., indicating concurrence
    or signing a contract), and receiving a message. Non-repudiation protects against later claims by a user of not having
    created, modified, or deleted a particular data item or collection of data in the database. In designing a database, the
    organization must define the types of data and the user actions that must be protected from repudiation. The implementation
    must then include building audit features into the application data tables and configuring SQL Server's audit tools to
    capture the necessary audit trail. Design and implementation also must ensure that applications pass individual user identification
    to SQL Server, even where the application connects to SQL Server with a standard, shared account. Applications should
    use temporal tables to track the changes and history of sensitive data.
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'Check the server documentation to determine if collecting and keeping historical

    versions of a table is required.

    If collecting and keeping historical versions of a table is NOT required, this is not a

    finding.

    Find all of the temporal tables in the database using the following query:

    SELECT SCHEMA_NAME(T.schema_id) AS schema_name, T.name AS table_name,

    T.temporal_type_desc, SCHEMA_NAME(H.schema_id) + ''.'' + H.name AS

    history_table

    FROM sys.tables T

    JOIN sys.tables H ON T.history_table_id = H.object_id

    WHERE T.temporal_type != 0

    ORDER BY schema_name, table_name

    Using the system documentation, determine which tables are required to be temporal

    tables.

    If any tables listed in the documentation are not in the list created by running the above

    statement, this is a finding.

    Ensure a field exists documenting the login and/or user who last modified the record.

    If this does not exist, this is a finding.'
  remediation: 'Alter sensitive tables to utilize system versioning.

    Alter non-temporal table to define periods for system versioning .

    ALTER TABLE InsurancePolicy

    ADD PERIOD FOR SYSTEM_TIME (SysStartTime, SysEndTime),

    SysStartTime datetime2 GENERATED ALWAYS AS ROW START HIDDEN NOT NULL DEFAULT

    GETUTCDATE(),

    SysEndTime datetime2 GENERATED ALWAYS AS ROW END HIDDEN NOT NULL DEFAULT

    CONVERT(DATETIME2, ''9999-12-31 23:59:59.99999999'');

    ALTER TABLE InsurancePolicy SET (SYSTEM_VERSIONING = ON

    (HISTORY_TABLE=dbo.InsurancePolicyHistory));

    https://docs.microsoft.com/sql/t-sql/statements/alter-table-transact-sql?view=sql-server2016#system_versionin'
  checks:
  - type: manual_review
    info: 'Check the server documentation to determine if collecting and keeping historical

      versions of a table is required.

      If collecting and keeping historical versions of a table is NOT required, this is not a

      finding.

      Find all of the temporal tables in the database using the following query:

      SELECT SCHEMA_NAME(T.schema_id) AS schema_name, T.name AS table_name,

      T.temporal_type_desc, SCHEMA_NAME(H.schema_id) + ''.'' + H.name AS

      history_table

      FROM sys.tables T

      JOIN sys.tables H ON T.history_table_id = H.obj'
    severity: medium
- id: '1.5'
  title: SQL6-D0-000600
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must protect against a user falsely repudiating by ensuring databases are not in a trust relationship.
    GROUP ID: V-213904 RULE ID: SV-213904r960864'
  rationale: Non-repudiation of actions taken is required in order to maintain data integrity. Examples of particular actions
    taken by individuals include creating information, sending a message, approving information (e.g., indicating concurrence
    or signing a contract), and receiving a message. Non-repudiation protects against later claims by a user of not having
    created, modified, or deleted a particular data item or collection of data in the database. SQL Server provides the ability
    for high privileged accounts to impersonate users in a database using the TRUSTWORTHY feature. This will allow members
    of the fixed database role to impersonate any user within the database.
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'If the database being reviewed is MSDB, trustworthy is required to be enabled, and

    therefore this is not a finding.

    Execute the following query:

    SELECT SUSER_SNAME(d.owner_sid) AS DatabaseOwner,

    CASE

    WHEN d.is_trustworthy_on = 0 THEN ''No''

    WHEN d.is_trustworthy_on = 1 THEN ''Yes''

    END AS IsTrustworthy,

    CASE

    WHEN role.name IN (''sysadmin'',''securityadmin'')

    OR permission.permission_name = ''CONTROL SERVER''

    THEN ''YES''

    ELSE ''No''

    END AS ''IsOwnerPrivileged''

    FROM sys.databases d

    LEFT JOIN sys.server_principals login ON d.owner_sid = login.sid

    LEFT JOIN sys.server_role_members rm ON login.principal_id =

    rm.member_principal_id

    LEFT JOIN sys.server_principals role ON rm.role_principal_id =

    role.principal_id

    LEFT JOIN sys.server_permissions permission ON login.principal_id =

    permission.grantee_principal_id

    WHERE d.name = DB_NAME()

    If trustworthy is not enabled, this is not a finding.

    If trustworthy is enabled and the database owner is not a privileged account, this is not

    a finding.

    If trustworthy is enabled and the database owner is a privileged account, review the

    system documentation to determine if the trustworthy property is required and

    authorized. If this is not documented, this is a finding.'
  remediation: 'Disable trustworthy on the database.

    ALTER DATABASE [<database name>] SET TRUSTWORTHY OFF'
  checks:
  - type: manual_review
    info: 'If the database being reviewed is MSDB, trustworthy is required to be enabled, and

      therefore this is not a finding.

      Execute the following query:

      SELECT SUSER_SNAME(d.owner_sid) AS DatabaseOwner,

      CASE

      WHEN d.is_trustworthy_on = 0 THEN ''No''

      WHEN d.is_trustworthy_on = 1 THEN ''Yes''

      END AS IsTrustworthy,

      CASE

      WHEN role.name IN (''sysadmin'',''securityadmin'')

      OR permission.permission_name = ''CONTROL SERVER''

      THEN ''YES''

      ELSE ''No''

      END AS ''IsOwnerPrivileged''

      FROM sys.databases d

      LEFT JOIN sys.server_principa'
    severity: medium
- id: '1.6'
  title: SQL6-D0-000700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must allow only the ISSM (or individuals or roles appointed by the ISSM) to select which auditable
    events are to be audited. GROUP ID: V-213905 RULE ID: SV-213905r960882'
  rationale: Without the capability to restrict which roles and individuals can select which events are audited, unauthorized
    personnel may be able to prevent or interfere with the auditing of critical events. Suppression of auditing could permit
    an adversary to evade detection. Misconfigured audits can degrade the system's performance by overwhelming the audit log.
    Misconfigured audits may also make it more difficult to establish, correlate, and investigate the events relating to an
    incident or identify those responsible for one.
  impact: ''
  references: []
  page_start: 22
  audit_raw: "Obtain the list of approved audit maintainers from the system documentation.\nUse the following query to review\
    \ database roles and their membership, all of which\nenable the ability to create and maintain audit specifications.\n\
    SELECT\n R.name AS role_name,\n RM.name AS role_member_name,\n RM.type_desc\nFROM sys.database_principals R\nJOIN sys.database_role_members\
    \ DRM ON\n R.principal_id = DRM.role_principal_id\nJOIN sys.database_principals RM ON\n DRM.member_principal_id = RM.principal_id\n\
    WHERE R.type = 'R'\n AND R.name = 'db_owner'\nORDER BY\n role_member_name\nIf any role memberships are not documented\
    \ and authorized, this is a finding.\nReview the database roles and individual users that have the following permissions,\
    \ all\nof which enable the ability to create and maintain audit definitions.\nALTER ANY DATABASE AUDIT\nCONTROL\nUse the\
    \ following query to determine the roles and users that have the listed\npermissions:\nSELECT\n PERM.permission_name,\n\
    \ DP.name AS principal_name,\n DP.type_desc AS principal_type,\n DBRM.role_member_name\nFROM sys.database_permissions\
    \ PERM\nJOIN sys.database_principals DP ON PERM.grantee_principal_id =\nDP.principal_id\nLEFT OUTER JOIN (\n SELECT\n\
    \ R.principal_id AS role_principal_id,\n R.name AS role_name,\n RM.name AS role_member_name\n FROM sys.database_principals\
    \ R\n JOIN sys.database_role_members DRM ON R.principal_id =\nDRM.role_principal_id\n JOIN sys.database_principals RM\
    \ ON DRM.member_principal_id =\nRM.principal_id\n WHERE R.type = 'R'\n) DBRM ON DP.principal_id = DBRM.role_principal_id\n\
    WHERE PERM.permission_name IN ('CONTROL','ALTER ANY DATABASE AUDIT')\nORDER BY\n permission_name,\n principal_name,\n\
    \ role_member_name\nIf any of the roles or users returned have permissions that are not documented, or the\ndocumented\
    \ audit maintainers do not have permissions, this is a finding."
  remediation: 'Create a database role specifically for audit maintainers, and give it permission to

    maintain audits, without granting it unnecessary permissions (The role name used here

    is an example; other names may be used.):

    CREATE ROLE DATABASE_AUDIT_MAINTAINERS;

    GO

    GRANT ALTER ANY DATABASE AUDIT TO DATABASE_AUDIT_MAINTAINERS;

    GO

    Use REVOKE and/or DENY and/or ALTER ROLE ... DROP MEMBER ... statements to

    remove the ALTER ANY DATABASE AUDIT permission from all users. Then, for each

    authorized database user, run the statement:

    ALTER ROLE DATABASE_AUDIT_MAINTAINERS ADD MEMBER;

    GO

    Use REVOKE and/or DENY and/or ALTER SERVER ROLE ... DROP MEMBER ...

    statements to remove CONTROL DATABASE permission from logins that do not need it.'
  checks:
  - type: manual_review
    info: "Obtain the list of approved audit maintainers from the system documentation.\nUse the following query to review\
      \ database roles and their membership, all of which\nenable the ability to create and maintain audit specifications.\n\
      SELECT\n R.name AS role_name,\n RM.name AS role_member_name,\n RM.type_desc\nFROM sys.database_principals R\nJOIN sys.database_role_members\
      \ DRM ON\n R.principal_id = DRM.role_principal_id\nJOIN sys.database_principals RM ON\n DRM.member_principal_id = RM.principal_id\n\
      WHERE R.type = "
    severity: medium
- id: '1.7'
  title: SQL6-D0-001100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must limit privileges to change software modules, to include stored procedures, functions, and
    triggers. GROUP ID: V-213906 RULE ID: SV-213906r960960'
  rationale: If the system were to allow any user to make changes to software libraries, then those changes might be implemented
    without undergoing the appropriate testing and approvals that are part of a robust change management process. Accordingly,
    only qualified and authorized individuals shall be allowed to obtain access to information system components for purposes
    of initiating changes, including upgrades and modifications. Unmanaged changes that occur to the database software libraries
    or configuration can lead to unauthorized or compromised installations.
  impact: ''
  references: []
  page_start: 25
  audit_raw: "Obtain a listing of users and roles who are authorized to change stored procedures,\nfunctions, and triggers\
    \ from the server documentation.\nIn each user database, execute the following query:\nSELECT P.type_desc AS principal_type,\
    \ P.name AS principal_name, O.type_desc,\n CASE class\n WHEN 0 THEN DB_NAME()\n WHEN 1 THEN OBJECT_SCHEMA_NAME(major_id)\
    \ + '.' + OBJECT_NAME(major_id)\n WHEN 3 THEN SCHEMA_NAME(major_id)\n ELSE class_desc + '(' + CAST(major_id AS nvarchar)\
    \ + ')'\n END AS securable_name, DP.state_desc, DP.permission_name\nFROM sys.database_permissions DP\nJOIN sys.database_principals\
    \ P ON DP.grantee_principal_id = P.principal_id\nLEFT OUTER JOIN sys.all_objects O ON O.object_id = DP.major_id AND O.type\
    \ IN\n('TR','TA','P','X','RF','PC','IF','FN','TF','U')\nWHERE DP.type IN ('AL','ALTG') AND DP.class IN (0, 1, 53)\nSELECT\
    \ R.name AS role_name, M.type_desc AS principal_type, M.name AS\nprincipal_name\nFROM sys.database_principals R\nJOIN\
    \ sys.database_role_members DRM ON R.principal_id = DRM.role_principal_id\nJOIN sys.database_principals M ON DRM.member_principal_id\
    \ = M.principal_id\nWHERE R.name IN ('db_ddladmin','db_owner')\n AND M.name != 'dbo'\nIf any users or role permissions\
    \ returned are not authorized to modify the specified\nobject or type, this is a finding.\nIf any user or role membership\
    \ is not authorized, this is a finding."
  remediation: 'Revoke the ALTER permission from unauthorized users and roles.

    REVOKE ALTER ON [<Object Name>] TO [<Principal Name>]'
  checks:
  - type: manual_review
    info: "Obtain a listing of users and roles who are authorized to change stored procedures,\nfunctions, and triggers from\
      \ the server documentation.\nIn each user database, execute the following query:\nSELECT P.type_desc AS principal_type,\
      \ P.name AS principal_name, O.type_desc,\n CASE class\n WHEN 0 THEN DB_NAME()\n WHEN 1 THEN OBJECT_SCHEMA_NAME(major_id)\
      \ + '.' + OBJECT_NAME(major_id)\n WHEN 3 THEN SCHEMA_NAME(major_id)\n ELSE class_desc + '(' + CAST(major_id AS nvarchar)\
      \ + ')'\n END AS securable_name, DP.state"
    severity: medium
- id: '1.8'
  title: SQL6-D0-001200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must limit privileges to change software modules, to include stored procedures, functions, and
    triggers, and links to software external to SQL Server. GROUP ID: V-213907 RULE ID: SV-213907r960960'
  rationale: If the system were to allow any user to make changes to software libraries, then those changes might be implemented
    without undergoing the appropriate testing and approvals that are part of a robust change management process. Accordingly,
    only qualified and authorized individuals shall be allowed to obtain access to information system components for purposes
    of initiating changes, including upgrades and modifications. Unmanaged changes that occur to the database software libraries
    or configuration can lead to unauthorized or compromised installations.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'Obtain a listing of schema ownership from the server documentation.

    Execute the following query to obtain a current listing of schema ownership.

    SELECT S.name AS schema_name, P.name AS owning_principal

    FROM sys.schemas S

    JOIN sys.database_principals P ON S.principal_id = P.principal_id

    ORDER BY schema_name

    If any schema is owned by an unauthorized database principal, this is a finding.'
  remediation: 'Transfer ownership of database schemas to authorized database principals.

    ALTER AUTHORIZATION ON SCHEMA::[<Schema Name>] TO [<Principal Name>]'
  checks:
  - type: sql
    command: SELECT S.name AS schema_name, P.name AS owning_principal
    severity: medium
    info: 'Obtain a listing of schema ownership from the server documentation.

      Execute the following query to obtain a current listing of schema ownership.

      SELECT S.name AS schema_name, P.name AS owning_principal

      FROM sys.schemas S

      JOIN sys.database_principals P ON S.principal_id = P.principal_id

      ORDER BY schema_name

      If any schema is owned by an unauthorized database principal, this is a finding.'
- id: '1.9'
  title: SQL6-D0-001300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Database objects (including but not limited to tables, indexes, storage, stored procedures, functions, triggers,
    links to software external to SQL Server, etc.) must be owned by database/DBMS principals authorized for ownership. GROUP
    ID: V-213908 RULE ID: SV-213908r960960'
  rationale: Within the database, object ownership implies full privileges to the owned object, including the privilege to
    assign access to the owned objects to other subjects. Database functions and procedures can be coded using definer's rights.
    This allows anyone who utilizes the object to perform the actions if they were the owner. If not properly managed, this
    can lead to privileged actions being taken by unauthorized individuals. Conversely, if critical tables or other objects
    in SQL Server rely on unauthorized owner accounts, these objects may be lost when an account is removed.
  impact: ''
  references: []
  page_start: 29
  audit_raw: "Review system documentation to identify SQL Server accounts authorized to own\ndatabase objects.\nIf the SQL\
