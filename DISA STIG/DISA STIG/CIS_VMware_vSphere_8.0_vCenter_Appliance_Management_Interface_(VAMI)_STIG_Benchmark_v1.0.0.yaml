      ssl.engine = "enable"

      If "ssl.engine" is not set to "enable", this is a finding.

      Note: The command must be run from a bash shell and not from a shell generated by

      the "appliance shell". Use the "chsh" command to change the shell for the account to

      "/bin/bash". Refer to KB Article 2100508 for more details:

      https://k'
    severity: medium
- id: '1.3'
  title: VCLD-80-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter VAMI service must generate information to monitor remote access. GROUP ID: V-259139 RULE ID: SV-259139r1003691'
  rationale: Remote access can be exploited by an attacker to compromise the server. By recording all remote access activities,
    it will be possible to determine the attacker's location, intent, and degree of success. VAMI uses the "mod_accesslog"
    module to log information relating to remote requests. These logs can then be piped to external monitoring systems.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'At the command prompt, run the following command:

    /opt/vmware/cap_lighttpd/sbin/lighttpd -p -f /var/lib/vmware/cap-lighttpd/lighttpd.conf

    2>/dev/null|awk ''/server.modules/,/)/''|grep mod_accesslog

    Example result:

    "mod_accesslog",

    If the "mod_accesslog" is not present, this is a finding.

    Note: The command must be run from a bash shell and not from a shell generated by

    the "appliance shell". Use the "chsh" command to change the shell for the account to

    "/bin/bash". Refer to KB Article 2100508 for more details:

    https://kb.vmware.com/s/article/2100508'
  remediation: 'Navigate to and open:

    /opt/vmware/etc/lighttpd/applmgmt-lighttpd.conf

    Add the following value in the "server.modules" section:

    mod_accesslog

    The result should be similar to the following:

    server.modules += ("mod_accesslog", "mod_cgi", "mod_magnet", "mod_rewrite")

    Restart the service with the following command:

    systemctl restart cap-lighttpd'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      /opt/vmware/cap_lighttpd/sbin/lighttpd -p -f /var/lib/vmware/cap-lighttpd/lighttpd.conf

      2>/dev/null|awk ''/server.modules/,/)/''|grep mod_accesslog

      Example result:

      "mod_accesslog",

      If the "mod_accesslog" is not present, this is a finding.

      Note: The command must be run from a bash shell and not from a shell generated by

      the "appliance shell". Use the "chsh" command to change the shell for the account to

      "/bin/bash". Refer to KB Article 2100508 for m'
    severity: medium
- id: '1.4'
  title: VCLD-80-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter VAMI service must produce log records containing sufficient information to establish what type
    of events occurred. GROUP ID: V-259140 RULE ID: SV-259140r1003694'
  rationale: 'Web server logging capability is critical for accurate forensic analysis. Without sufficient and accurate information,
    a correct replay of the events cannot be determined. Ascertaining the correct type of event that occurred is important
    during forensic analysis. The correct determination of the event and when it occurred is important in relation to other
    events that happened at that same time. Without sufficient information establishing what type of log event occurred, investigation
    into the cause of event is severely hindered. Log record content that may be necessary to satisfy the requirement of this
    control includes, but is not limited to, time stamps, source and destination IP addresses, user/process identifiers, event
    descriptions, application-specific events, success/fail indications, file names involved, access control, or flow control
    rules invoked. Satisfies: SRG-APP-000095-WSR-000056, SRG-APP-000096-WSR-000057, SRGAPP-000097-WSR-000058, SRG-APP-000098-WSR-000059,
    SRG-APP-000099-WSR000061, SRG-APP-000100-WSR-000064, SRG-APP-000374-WSR-000172, SRG-APP000375-WSR-000171'
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'At the command prompt, run the following command:

    /opt/vmware/cap_lighttpd/sbin/lighttpd -p -f /var/lib/vmware/cap-lighttpd/lighttpd.conf

    2>/dev/null|grep "accesslog.format"

    The default commented, accesslog format is acceptable for this requirement. No output

    should be returned.

    If the command returns any output, this is a finding.

    Note: The command must be run from a bash shell and not from a shell generated by

    the "appliance shell". Use the "chsh" command to change the shell for the account to

    "/bin/bash". Refer to KB Article 2100508 for more details:

    https://kb.vmware.com/s/article/2100508'
  remediation: 'Navigate to and open:

    /var/lib/vmware/cap-lighttpd/lighttpd.conf

    Comment any existing accesslog.format lines by adding a "" at the beginning of the line.

    Restart the service with the following command:

    systemctl restart cap-lighttpd'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      /opt/vmware/cap_lighttpd/sbin/lighttpd -p -f /var/lib/vmware/cap-lighttpd/lighttpd.conf

      2>/dev/null|grep "accesslog.format"

