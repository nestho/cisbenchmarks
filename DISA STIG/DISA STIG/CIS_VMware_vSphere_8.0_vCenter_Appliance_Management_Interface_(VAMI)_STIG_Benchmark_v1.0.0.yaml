- id: '1.21'
  title: VCLD-80-000101
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter VAMI service must protect against MIME sniffing. GROUP ID: V-259159 RULE ID: SV-259159r1003736'
  rationale: MIME sniffing was, and still is, a technique used by some web browsers to examine the content of a particular
    asset. This is done for the purpose of determining an asset's file format. This technique is useful in the event that
    there is not enough metadata information present for a particular asset, thus leaving the possibility that the browser
    interprets the asset incorrectly. Although MIME sniffing can be useful to determine an asset's correct file format, it
    can also cause a security vulnerability. This vulnerability can be quite dangerous both for site owners as well as site
    visitors. This is because an attacker can leverage MIME sniffing to send an XSS (Cross Site Scripting) attack.
  impact: ''
