controls:
- id: '1.1'
  title: VCLD-80-000001
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter VAMI service must limit the number of allowed simultaneous session requests. GROUP ID: V-259137
    RULE ID: SV-259137r1003685'
  rationale: Denial of service (DoS) is one threat against web servers. Many DoS attacks attempt to consume web server resources
    in such a way that no more resources are available to satisfy legitimate requests. Mitigation against these threats is
    to take steps to limit the number of resources that can be consumed in certain ways. VAMI provides the "maxConnections"
    attribute of the <Connector Elements> to limit the number of concurrent Transmission Control Protocol (TCP) connections.
    This comes preconfigured with a tested, supported value that must be verified and maintained.
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'At the command prompt, run the following command:

    /opt/vmware/cap_lighttpd/sbin/lighttpd -p -f /var/lib/vmware/cap-lighttpd/lighttpd.conf

    2>/dev/null |grep "server.max-connections"

    Example result:

    server.max-connections = 1024

    If "server.max-connections" is not configured to 1024 or less, this is a finding.

    Note: The command must be run from a bash shell and not from a shell generated by

    the "appliance shell". Use the "chsh" command to change the shell for the account to

    "/bin/bash". Refer to KB Article 2100508 for more details:

    https://kb.vmware.com/s/article/2100508'
  remediation: 'Navigate to and open:

    /var/lib/vmware/cap-lighttpd/lighttpd.conf

    Add or reconfigure the following value:

    server.max-connections = 1024

    Restart the service with the following command:

    systemctl restart cap-lighttpd'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      /opt/vmware/cap_lighttpd/sbin/lighttpd -p -f /var/lib/vmware/cap-lighttpd/lighttpd.conf

      2>/dev/null |grep "server.max-connections"

      Example result:

      server.max-connections = 1024

      If "server.max-connections" is not configured to 1024 or less, this is a finding.

      Note: The command must be run from a bash shell and not from a shell generated by

      the "appliance shell". Use the "chsh" command to change the shell for the account to

      "/bin/bash". Refer to KB'
    severity: medium
- id: '1.2'
  title: VCLD-80-000004
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter VAMI service must use cryptography to protect the integrity of remote sessions. GROUP ID: V-259138
    RULE ID: SV-259138r1003688'
  rationale: 'Data exchanged between the user and the web server can range from static display data to credentials used to
    log in the hosted application. Even when data appears to be static, the nondisplayed logic in a web page may expose business
    logic or trusted system relationships. The integrity of all the data being exchanged between the user and web server must
    always be trusted. To protect the integrity and trust, encryption methods should be used to protect the complete communication
    session. To protect the integrity and confidentiality of the remote sessions, VAMI uses Secure Sockets Layer (SSL)/Transport
    Layer Security (TLS). Satisfies: SRG-APP-000015-WSR-000014, SRG-APP-000315-WSR-000003'
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'At the command prompt, run the following command:

    /opt/vmware/cap_lighttpd/sbin/lighttpd -p -f /var/lib/vmware/cap-lighttpd/lighttpd.conf

    2>/dev/null|grep "ssl.engine"

    Example result:

    ssl.engine = "enable"

    If "ssl.engine" is not set to "enable", this is a finding.

    Note: The command must be run from a bash shell and not from a shell generated by

    the "appliance shell". Use the "chsh" command to change the shell for the account to

    "/bin/bash". Refer to KB Article 2100508 for more details:

    https://kb.vmware.com/s/article/2100508'
  remediation: 'Navigate to and open:

    /opt/vmware/etc/lighttpd/applmgmt-lighttpd.conf

    Add or reconfigure the following value:

    ssl.engine = "enable"

    Restart the service with the following command:

    systemctl restart cap-lighttpd'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      /opt/vmware/cap_lighttpd/sbin/lighttpd -p -f /var/lib/vmware/cap-lighttpd/lighttpd.conf

