- id: '1.17'
  title: VCLD-80-000097
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter VAMI service must disable client initiated TLS renegotiation. GROUP ID: V-259155 RULE ID: SV-259155r1003724'
  rationale: All versions of the Secure Sockets Layer (SSL) and TLS protocols (up to and including TLS 1.2) are vulnerable
    to a man-in-the-middle attack (CVE-2009-3555) during a renegotiation. This vulnerability allows an attacker to "prefix"
    a chosen plaintext to the HTTP request as seen by the web server. The protocols have since been amended by RFC 5746, but
    the fix must be supported by both client and server to be effective. While Lighttpd and the underlying OpenSSL libraries
    are no longer vulnerable, steps must be taken to account for older clients that do not support RFC 5746. To this end,
    Lighttpd disables client-initiated renegotiation entirely by default. This configuration must be validated and maintained.
  impact: ''
  references: []
  page_start: 53
  audit_raw: 'At the command prompt, run the following command:

    /opt/vmware/cap_lighttpd/sbin/lighttpd -p -f /var/lib/vmware/cap-lighttpd/lighttpd.conf

    2>/dev/null|grep "ssl.disable-client-renegotiation"

    If no line is returned, this is not a finding.

    If "ssl.disable-client-renegotiation" is set to "disabled", this is a finding.

    Note: The command must be run from a bash shell and not from a shell generated by

    the "appliance shell". Use the "chsh" command to change the shell for the account to

    "/bin/bash". Refer to KB Article 2100508 for more details:

    https://kb.vmware.com/s/article/2100508'
  remediation: 'Navigate to and open:

    /var/lib/vmware/cap-lighttpd/lighttpd.conf

    Remove any setting for "ssl.disable-client-renegotiation".

    Restart the service with the following command:

