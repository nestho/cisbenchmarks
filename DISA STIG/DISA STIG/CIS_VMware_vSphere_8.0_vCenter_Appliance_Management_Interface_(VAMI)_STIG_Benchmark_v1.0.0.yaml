      If any files are returned, this is a finding.'
- id: '1.6'
  title: VCLD-80-000022
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter VAMI service must off-load log records onto a different system or media from the system being
    logged. GROUP ID: V-259142 RULE ID: SV-259142r960948'
  rationale: 'Protection of log data includes assuring log data is not accidentally lost or deleted. Backing up log records
    to an unrelated system or onto separate media than the system the web server is actually running on helps to assure that,
    in the event of a catastrophic system failure, the log records will be retained. Satisfies: SRG-APP-000125-WSR-000071,
    SRG-APP-000358-WSR-000063, SRGAPP-000358-WSR-000163'
  impact: ''
  references: []
  page_start: 22
