      should be returned.

      If the command returns any output, this is a finding.

      Note: The command must be run from a bash shell and not from a shell generated by

      the "appliance shell". Use the "chsh" command to change the shell for the account to'
    severity: medium
- id: '1.5'
  title: VCLD-80-000019
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter VAMI service log files must only be accessible by privileged users. GROUP ID: V-259141 RULE ID:
    SV-259141r960930'
  rationale: 'Log data is essential in the investigation of events. If log data were to become compromised, then competent
    forensic analysis and discovery of the true source of potentially malicious system activity would be difficult, if not
    impossible, to achieve. In addition, access to log records provides information an attacker could potentially use to their
    advantage since each event record might contain communication ports, protocols, services, trust relationships, user names,
    etc. The web server must protect the log data from unauthorized read, write, copy, etc. This can be done by the web server
    if the web server is also doing the logging function. The web server may also use an external log system. In either case,
    the logs must be protected from access by nonprivileged users. Satisfies: SRG-APP-000118-WSR-000068, SRG-APP-000119-WSR-000069,
    SRGAPP-000120-WSR-000070'
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'At the command prompt, run the following commands:

    find /var/log/vmware/applmgmt/ /var/log/vmware/applmgmt-audit/ -xdev -type f -a ''('' -

    perm -o+w -o -not -user root -o -not -group root '')'' -exec ls -ld {} ;

    find /opt/vmware/var/log/lighttpd/ -xdev -type f -a ''('' -perm -o+w -o -not -user lighttpd -o -

    not -group lighttpd '')'' -exec ls -ld {} ;

    If any files are returned, this is a finding.'
  remediation: 'At the command prompt, run the following commands for log files under

    /opt/vmware/var/log/lighttpd/:

    chmod o-w

    chown lighttpd:lighttpd

    At the command prompt, run the following commands for all other log files:

    chmod o-w

    chown root:root

    Note: Substitute with the listed file.'
  checks:
  - type: command
    command: find /var/log/vmware/applmgmt/ /var/log/vmware/applmgmt-audit/ -xdev -type f -a '(' - && find /opt/vmware/var/log/lighttpd/
      -xdev -type f -a '(' -perm -o+w -o -not -user lighttpd -o -
    expected: ''
    severity: medium
    info: 'At the command prompt, run the following commands:

      find /var/log/vmware/applmgmt/ /var/log/vmware/applmgmt-audit/ -xdev -type f -a ''('' -

