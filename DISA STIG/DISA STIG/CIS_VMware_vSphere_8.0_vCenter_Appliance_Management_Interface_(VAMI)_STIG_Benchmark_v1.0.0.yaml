- id: '1.20'
  title: VCLD-80-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter VAMI service must implement prevent rendering inside a frame or iframe on another site. GROUP
    ID: V-259158 RULE ID: SV-259158r1003733'
  rationale: Clickjacking, also known as a “UI redress attack”, is when an attacker uses multiple transparent or opaque layers
    to trick a user into clicking on a button or link on another page when they were intending to click on the top level page.
    Thus, the attacker is “hijacking” clicks meant for their page and routing them to another page, most likely owned by another
    application, domain, or both. Using a similar technique, keystrokes can also be hijacked. With a carefully crafted combination
    of stylesheets, iframes, and text boxes, a user can be led to believe they are typing in the password to their email or
    bank account but are instead typing into an invisible frame controlled by the attacker.
  impact: ''
  references: []
