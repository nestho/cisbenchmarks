  remediation: 'The JES2. resource must be owned in the OPERCMDS class.

    NOTE: JES2 is typically the name of the JES2 subsystem. Refer to the SUBSYS report

    and locate the entry with the description of PRIMARY JOB ENTRY SUBSYSTEM. The

    SUBSYSTEM NAME of this entry is the name of the JES2 subsystem.

    Extended MCS support allows the installation to control the use of JES2 system

    commands through the ACP. These commands are subject to various types of potential

    abuse. For this reason, it is necessary to place restrictions on the JES2 system

    commands that can be entered by particular operators. To control access to JES2

    system commands, the following recommendations will be applied when implementing

    security:

