- id: '1.144'
  title: TSS0-OS-000170
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IBM z/OS system administrator (SA) must develop a process to notify appropriate personnel when accounts
    are created. GROUP ID: V-224013 RULE ID: SV-224013r998500'
  rationale: Once an attacker establishes access to a system, the attacker often attempts to create a persistent method of
    reestablishing access. One way to accomplish this is for the attacker to create a new account. Notification of account
    creation is one method for mitigating this risk. A comprehensive account management process will ensure an audit trail
    which documents the creation of operating system user accounts and notifies administrators and information system security
    officers (ISSOs) that it exists. Such a process greatly reduces the risk that accounts will be surreptitiously created
    and provides logging that can be used for forensic purposes. To address access requirements, many operating systems can
    be integrated with enterprise-level authentication/access/auditing mechanisms that meet or exceed access control policy
    requirements.
  impact: ''
  references: []
  page_start: 310
  audit_raw: 'Ask the SA for the documented process to notify appropriate personnel when accounts

    are created.

    If there is no documented process, this is a finding.'
  remediation: 'Develop a documented process to notify appropriate personnel when accounts are

    created.'
  checks:
  - type: manual_review
    info: 'Ask the SA for the documented process to notify appropriate personnel when accounts

      are created.

      If there is no documented process, this is a finding.'
    severity: medium
