    NOTE: The use of CHAUDIT commands in /etc/rc may not be necessary. If none are\nfound, there is not a finding.\nThe possible\
    \ audit bits settings are as follows:\nf log for failed access attempts\na log for failed and successful access\n• no\
    \ auditing\nIf the _BPX_JOBNAME variable is appropriately set (i.e., to match daemon name) as\neach daemon (e.g., syslogd,\
    \ inetd) is started in /etc/rc, this is not a finding.\nNOTE: If _BPX_JOBNAME is not specified, the started address space\
    \ will be named\nusing an inherited value. This could result in reduced security in terms of operator\ncommand access.\n\
    \ SYSTEM DIRECTORY SECURITY SETTINGS\nDIRECTORY PERMISSION BITS USER AUDIT BITS FUNCTION\n/ [root] 755 faf Root level\
