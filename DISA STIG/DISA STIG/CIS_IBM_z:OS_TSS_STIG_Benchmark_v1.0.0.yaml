- id: '1.58'
  title: TSS0-ES-000580
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS Started tasks must be properly defined to CA-TSS. GROUP ID: V-223931 RULE ID: SV-223931r991591'
  rationale: Started procedures have system generated job statements that do not contain the user, group, or password statements.
    To enable the started procedure to access the same protected resources that users and groups access, started procedures
    must have an associated USERID. If a USERID is not associated with the started procedure, the started procedure will not
    have access to the resources. To ensure accountability and prevent unauthenticated access, organizational users must be
    identified and authenticated to prevent potential misuse and compromise of the system.
  impact: ''
  references: []
  page_start: 136
  audit_raw: 'Refer to the site security plan, the system administrator, and system libraries to

    determine list of stated tasks available on the system.

    If the following guidance is true, this is not a finding.

    -All started tasks are assigned a unique user ACID or STC ACIDs that will be unique

    per product and function if supported by vendor documentation.

    -Every ACID with the STC Facility has a corresponding entry defined in the STC record.

    -Every ACID defined in the STC record has a corresponding user ACID defined to TSS

    with the STC Facility.

    -All STC ACIDs will have a password generated in accordance with STIG requirements.

    -All STC ACIDs will be sourced to the internal reader (e.g., ADD(stc-acid)

    SOURCE(INTRDR).

    -The STC ACIDs may have the NOSUSPEND attribute.'
  remediation: 'Review the STC record and all associated ACIDs. Ensure STCs and associated ACIDs

    are defined to the STC record. Restrict access to required resources only. Evaluate the

    impact of correcting the deficiency. Ensure TSS started task table record contains an

    entry for each Started Proc that maps the proc to a unique userid, or STC ACIDs will be

    unique per product and function if supported by vendor documentation. Develop a plan

    of action and implement the changes as specified:

    All STC ACIDs will have the STC facility. An STC also may be granted the

    FAC(BATCH) if it requires the capability to submit batch jobs to the internal reader. It

    should be noted, however, that this also will allow the STC itself to be executed as a

    batch job.

    TSS ADD(stc-acid) FACILITY(STC BATCH)

    Each STC ACID will be defined with a password following the password requirement

    guidelines. The only exception is that these passwords will be defined as non-expiring.

    In addition, each STC will have its own unique password. Defining a password for

    started tasks prevents a user from logging onto a system with the STC ACID.

    TSS REP(stc-acid) PASSWORD(xxxxxxxx,0)

    Ensure the OPTIONS control option specifies a value of 4 to disable password checking

    for STCs. Otherwise operators will be forced to supply a password when STCs are

    started.

    All STC ACIDs will be sourced to the internal reader. This control will further protect the

    unauthorized use of STC ACIDs.

    TSS ADD(stc-acid) SOURCE(INTRDR)

    Every STC will be defined to the STC table, associated with a specific procedure, and

    granted minimum access.

    TSS ADD(STC) PROCNAME(stc-proc) ACID(stc-acid)

    Note: The STC ACIDs may have the NOSUSPEND attribute to exempt an STC ACID

    from suspension for excessive violations. Review the STC record and all associated

    ACIDs. Ensure STCs and associated ACIDs are defined to the STC record. Restrict

    access to required resources only. Evaluate the impact of correcting the deficiency.

    Ensure TSS started task table record contains an entry for each Started Proc that maps

    the proc to a unique userid, or STC ACIDs will be unique per product and function if

    supported by vendor documentation. Develop a plan of action and implement the

    changes as specified:

    All STC ACIDs will have the STC facility. An STC also may be granted the

    FAC(BATCH) if it requires the capability to submit batch jobs to the internal reader. It

    should be noted, however, that this also will allow the STC itself to be executed as a

    batch job.

    TSS ADD(stc-acid) FACILITY(STC BATCH)

    Each STC ACID will be defined with a password following the password requirement

    guidelines. The only exception is that these passwords will be defined as non-expiring.

    In addition, each STC will have its own unique password. Defining a password for

    started tasks prevents a user from logging onto a system with the STC ACID.

    TSS REP(stc-acid) PASSWORD(xxxxxxxx,0)

    Ensure the OPTIONS control option specifies a value of 4 to disable password checking

    for STCs. Otherwise operators will be forced to supply a password when STCs are

    started.

    All STC ACIDs will be sourced to the internal reader. This control will further protect the

    unauthorized use of STC ACIDs.

    TSS ADD(stc-acid) SOURCE(INTRDR)

    Every STC will be defined to the STC table, associated with a specific procedure, and

    granted minimum access.

    TSS ADD(STC) PROCNAME(stc-proc) ACID(stc-acid)

    Note: The STC ACIDs may have the NOSUSPEND attribute to exempt an STC ACID

    from suspension for excessive violations.'
