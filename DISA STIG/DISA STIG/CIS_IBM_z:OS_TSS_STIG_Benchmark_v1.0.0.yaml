    domain level security administrators, this is a finding.

    If data set rules for SYS1.LINKLIB do not restrict READ access to only system Level

    Started Tasks, authorized Data Center personnel, and auditors, this is a finding.

    If data set rules for SYS1.LINKLIB do not specify that all (i.e., failures and successes)

    WRITE or greater access will be logged, this is a finding.'
  remediation: 'Configure the ESM rules for SYS1.LINKLIB limit access to system programmers only

    and all WRITE or greater access is logged.'
  checks:
  - type: manual_review
    info: 'Execute a data set list of access to SYS1.LINKLIB.

