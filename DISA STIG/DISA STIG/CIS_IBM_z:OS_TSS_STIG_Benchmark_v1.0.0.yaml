- id: '1.103'
  title: TSS0-FT-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS user exits for the FTP server must not be used without proper approval and documentation. GROUP ID:
    V-223978 RULE ID: SV-223978r958480'
  rationale: In order to prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized
    tunneling (i.e., embedding of data types within data types), organizations must disable or restrict unused or unnecessary
    physical and logical ports/protocols on information systems. Operating systems are capable of providing a wide variety
    of functions and services. Some of the functions and services provided by default may not be necessary to support essential
    organizational operations. Additionally, it is sometimes convenient to provide multiple services from a single component
    (e.g., VPN and IPS); however, doing so increases risk over limiting the services provided by any one component. To support
    the requirements and principles of least functionality, the operating system must support the organizational requirements,
    providing only essential capabilities and limiting the use of ports, protocols, and/or services to only those required,
    authorized, and approved to conduct official business or to address authorized quality of life issues.
  impact: ''
  references: []
  page_start: 218
  audit_raw: 'Refer to the Data configuration file specified on the SYSFTPD DD statement in the FTP

    started task JCL.

    Refer to the file(s) allocated by the STEPLIB DD statement in the FTP started task JCL.

    Refer to the libraries specified in the system Linklist and LPA.

    If any FTP Server exits are in use, identify them and validate that they were reviewed

    for integrity and approved by the site AO.

    Refer to the following items are in effect for FTP Server user exits:

    The FTCHKCMD, FTCHKIP, FTCHKJES, FTCHKPWD, FTPSMFEX and FTPOSTPR

    modules are not located in the FTP daemon''s STEPLIB, Linklist, or LPA.

    NOTE: The ISPF ISRFIND utility can be used to search the system Linklist and LPA for

    specific modules.

    If both of the above are true, this is not a finding.

    If any FTP Server user exits are implemented and the site has not had the site systems

    programmer verify the exit was securely written and installed, this is a finding.'
  remediation: 'Review the configuration statements in the FTP.DATA file. Review the FTP daemon

    STEPLIB, system Linklist, and Link Pack Area libraries. If FTP Server exits are enabled

