    If either of the following is included, this is not a finding.

    AES_ENCRYPTION(Active,128)

    AES_ENCRYPTION(Active,256)'
  remediation: 'Evaluate the impact associated with implementation of the control option.

    Develop a plan of action to implement the control option as specified below:

    Convert passwords/password phrases from Triple-DES encryption to 128-bit AES or

    256-bit encryption by running TSSMAINT (with the AESENCRYPT option specified) and

    then running TSSXTEND to copy the old security file to the new security file.

    Please consult CA-TSS Installation guide for more information.'
