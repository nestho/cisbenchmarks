- id: '1.133'
  title: TSS0-OS-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS must specify SMF data options to ensure appropriate activation. GROUP ID: V-224001 RULE ID: SV-224001r958414'
  rationale: 'Without establishing when events occurred, it is impossible to establish, correlate, and investigate the events
    leading up to an outage or attack. In order to compile an accurate risk assessment and provide forensic analysis, it is
    essential for security personnel to know when events occurred (date and time). Associating event types with detected events
    in the operating system audit logs provides a means of investigating an attack; recognizing resource utilization or capacity
    thresholds; or identifying an improperly configured operating system. Satisfies: SRG-OS-000038-GPOS-00016, SRG-OS-000039-GPOS-00017,
    SRG-OS000040-GPOS-00018, SRG-OS-000041-GPOS-00019, SRG-OS-000042-GPOS-00021, SRG-OS-000254-GPOS-00095, SRG-OS-000269-GPOS-00103,
    SRG-OS-000368GPOS-00154'
  impact: ''
  references: []
  page_start: 290
  audit_raw: 'Refer to IEASYS00 member in SYS1.PARMLIB Concatenation. Determine proper

    SMFPRMxx member.

    SUBSYS(STC,EXITS(IEFU29,IEFU83,IEFU84,IEFUJP,IEFUSO),

    INTERVAL(SMF,SYNC),NODETAIL)

    If the SMF collection options are specified as stated below with exception of those

    specified in the above NOTEs, this is not a finding.

    The settings for several parameters are critical to the collection process:

    ACTIVE Activates the collection of SMF data.

    MAXDORM(0500) Specifies the amount of real time that SMF allows data to remain in

    an SMF buffer before it is written to a recording data set. Value is site defined.

    SID Specifies the system ID to be recorded in all SMF records.

    SYS(DETAIL) Controls the level of detail recorded.

    SYS(INTERVAL) Ensures the periodic recording of data for long running jobs.

    SYS Specifies the types and sub types of SMF records that are to be collected.

    SYS(TYPE) indicates that the supplied list is inclusive (i.e., specifies the record types to

    be collected). Record types not listed are not collected. SYS(NOTYPE) indicates that

    the supplied list is exclusive (i.e., specifies those record types not to be collected).

    Record types listed are not collected. The site may use either form of this parameter to

    specify SMF record type collection. However, at a minimum, all record types are listed.'
  remediation: 'Ensure that collection options for SMF Data are consistent with options specified below.

    Review all SMF recording specifications found in SMFPRMxx members. Ensure that

    SMF recording options used are consistent with those outlined below.

    The settings for several parameters are critical to the collection process:

    ACTIVE Activates the collection of SMF data.

    MAXDORM(mmss) Specifies the amount of real time that SMF allows data to remain in

    an SMF buffer before it is written to a recording data set. Use the MAXDORM

    parameter to minimize the amount of data lost because of system failure. This value is

    site determined and should be carefully configured.

    SID Specifies the system ID to be recorded in all SMF records.

    SYS(DETAIL) Controls the level of detail recorded.

    SYS(INTERVAL) Ensures the periodic recording of data for long running jobs.

    SYS Specifies the types and sub types of SMF records that are to be collected.

    SYS(TYPE) indicates that the supplied list is inclusive (i.e., specifies the record types to

    be collected). Record types not listed are not collected. SYS(NOTYPE) indicates that

    the supplied list is exclusive (i.e., specifies those record types not to be collected).

    Record types not listed are not collected. The site may use either form of this parameter

    to specify SMF record type collection. However, at a minimum all record types are

    listed.'
  checks:
  - type: manual_review
    info: 'Refer to IEASYS00 member in SYS1.PARMLIB Concatenation. Determine proper

      SMFPRMxx member.

      SUBSYS(STC,EXITS(IEFU29,IEFU83,IEFU84,IEFUJP,IEFUSO),

      INTERVAL(SMF,SYNC),NODETAIL)

      If the SMF collection options are specified as stated below with exception of those

