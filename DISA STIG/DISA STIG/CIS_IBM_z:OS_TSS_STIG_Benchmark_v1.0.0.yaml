  audit_raw: 'From the ISPF Command Shell enter:

    TSS LIST(ACIDS) SEGMENT(OMVS)

    If UID(0) is assigned only to system tasks such as the z/OS/ UNIX kernel (i.e., OMVS),

    z/OS UNIX daemons (e.g., inetd, syslogd, ftpd), and other system software daemons,

    this is not a finding.

