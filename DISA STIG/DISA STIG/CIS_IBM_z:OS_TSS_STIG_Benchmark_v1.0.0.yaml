- id: '1.3'
  title: TSS0-CE-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS must have Certificate Name Filtering implemented with appropriate authorization and documentation.
    GROUP ID: V-223873 RULE ID: SV-223873r958482'
  rationale: 'To assure accountability and prevent unauthenticated access, organizational users must be identified and authenticated
    to prevent potential misuse and compromise of the system. Organizational users include organizational employees or individuals
    the organization deems to have equivalent status of employees (e.g., contractors). Organizational users (and processes
    acting on behalf of users) must be uniquely identified and authenticated to all accesses, except for the following: 1.
    Accesses explicitly identified and documented by the organization. Organizations document specific user actions that can
    be performed on the information system without identification or authentication; and 2. Accesses that occur through authorized
    use of group authenticators without individual authentication. Organizations may require unique identification of individuals
    in group accounts (e.g., shared privilege accounts) or for detailed accountability of individual activity.'
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'If certificate name filtering is in use, the ISSM should document each active filter rule

    and have written approval to use the rule.

    Issue the following TSS command to list any certificate name filters defined to TSS:

    TSS LIST(SDT) CERTMAP(ALL)

    If there is nothing to list, this is not a finding.

    NOTE: Certificate name filters are only valid when their Status is TRUST. Therefore,

    you may ignore filters with the NOTRUST status.

    If certificate name filters are defined and they have a Status of TRUST, certificate name

    filtering is in use.

    If certificate name filtering is in use and filtering rules have been documented and

    approved by the ISSM, this is not a finding.

    If certificate name filtering is in use and filtering rules have not been documented and

    approved by the ISSM, this is a finding.'
  remediation: 'Ensure any certificate name filtering rules in use are documented and approved by the

    ISSM.'
  checks:
  - type: manual_review
    info: 'If certificate name filtering is in use, the ISSM should document each active filter rule

      and have written approval to use the rule.

      Issue the following TSS command to list any certificate name filters defined to TSS:

      TSS LIST(SDT) CERTMAP(ALL)

      If there is nothing to list, this is not a finding.

      NOTE: Certificate name filters are only valid when their Status is TRUST. Therefore,

      you may ignore filters with the NOTRUST status.

      If certificate name filters are defined and they have a Status of TRUS'
    severity: medium
- id: '1.4'
  title: TSS0-ES-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'CA-TSS Security control ACIDs must be limited to the administrative authorities authorized and that require
    these privileges to perform their job duties. GROUP ID: V-223874 RULE ID: SV-223874r958472'
  rationale: The use of security policy filters provides protection for the confidentiality of data by restricting the flow
    of data. A crucial part of any flow control solution is the ability to configure policy filters. This allows the operating
    system to enforce multiple and different security policies. Policy filters serve to enact and enforce the organizational
    policy as it pertains to controlling data flow.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'From the ISPF Command Shell enter:

    TSS LIST(ACIDS) DATA(ADMIN, BASIC)

    If any ACIDs other than TYPE=CENTRAL (SCA/MSCA) has the following administrative

    authority, this is a finding.

    FACILITIES(ALL)

    PROGRAM(ALL)

    PROGRAM(OWN)

    RESOURCE(ALL)

    ROSRES(ALL)

    VOLUME(ALL)

    VOLUME(OWN)

    MISC1(ALL)

    MISC1(LCF)

    MISC1(LTIME)

    MISC1(RDT)

    MISC1(USER)

    MISC2(ALL)

    MISC2(DLF)

    MISC2(NDT)

    MISC2(SMS)

    MISC4(ALL)

    MISC8(ALL)

    MISC8(LISTAPLU)

    MISC8(LISTRDT)

    MISC8(LISTSDT)

    MISC8(LISTSTC)

    MISC8(MCS)

    MISC9(ALL)

    MISC9(BYPASS)

    MISC9(CONSOLE)

    MISC9(GLOBAL)

    MISC9(MASTFAC)

    MISC9(MODE)

    MISC9(STC)

    MISC9(TRACE)'
  remediation: 'Review all security administrator ACIDs. Evaluate the impact of limiting the amount of

    excessive administrative authorities. Develop a plan of action and implement the

    changes.

    The following are examples for other types (DCA, VCA, ZCA, LSCA) that require

    administrative authorities: (note: these are examples and does not mean everyone

    should have all of these levels).

    data set(ALL)ACC(ALL)

    data set(XAUTH,OWN,REPORT,AUDIT,INFO)ACC(ALL)

    OTRAN(ALL)ACC(ALL)

    ACID(ALL)

    ACID(INFO,MAINTAIN)

    MISC1(INSTDATA,SUSPEND,TSSSIM,NOATS)

    MISC2(TSO,TARGET)

    MISC8(PWMAINT,REMASUSP)

    MISC9(GENERIC)

    FACILITY(BATCH, TSO, ROSCOE, CICS, xxxx)

    Where "xxxx" is a facility the application security team grants access into for their

    application users. This must not be STC, CA1, DFHSM, or other domain level

    mastfac/facility. This is only for those "onlines" that users truly log in to for access to

    their applications/data such as TSO, CICS regions, IDMS, ROSCOE, FTP, etc.

    TSS ADMIN(acid)RESOURCE(REPORT,INFO,AUDIT) can be allowed and is required

    to run TSSUTIL reports.

    Note: "RESOURCE" can specify a more specific Resource Class, such as "OTRAN",

    "data set", "IDMSGON", "PROGRAM" for non SCA/MSCA type of accounts. These

    administrators will not have "RESOURCE" specified in administrative authority.

    Note: "ALL" will display as "ALL" but also means approved for any single administrative

    authority under that specific item.'
  checks:
  - type: manual_review
    info: 'From the ISPF Command Shell enter:

      TSS LIST(ACIDS) DATA(ADMIN, BASIC)

      If any ACIDs other than TYPE=CENTRAL (SCA/MSCA) has the following administrative

      authority, this is a finding.

      FACILITIES(ALL)

      PROGRAM(ALL)

      PROGRAM(OWN)

      RESOURCE(ALL)

      ROSRES(ALL)

      VOLUME(ALL)

      VOLUME(OWN)

      MISC1(ALL)

      MISC1(LCF)

      MISC1(LTIME)

      MISC1(RDT)

      MISC1(USER)

      MISC2(ALL)

      MISC2(DLF)

      MISC2(NDT)

      MISC2(SMS)

      MISC4(ALL)

      MISC8(ALL)

      MISC8(LISTAPLU)

      MISC8(LISTRDT)

      MISC8(LISTSDT)

      MISC8(LISTSTC)

      MISC8(MCS)

      MISC9(ALL)

      MISC9(BYPASS)

      MISC9('
    severity: medium
