      by ensuring the operating system is implementing rate-limiting

      measures on impacted network interfaces, this is not a finding.'
    severity: medium
- id: '1.158'
  title: TSS0-OS-000320
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The IBM z/OS systems requiring data at rest protection must properly employ IBM DS8880 or equivalent hardware
    solutions for full disk encryption. GROUP ID: V-251108 RULE ID: SV-251108r1028298'
  rationale: 'This control addresses the confidentiality and integrity of information at rest and covers user information
    and system information. Information at rest refers to the state of information when it is located on storage devices as
    specific components of information systems. Operating systems handling data requiring "data at rest" protections must
    employ cryptographic mechanisms to prevent unauthorized disclosure and modification of the information at rest. Selection
    of a cryptographic mechanism is based on the need to protect the integrity of organizational information. The strength
    of the mechanism is commensurate with the security category and/or classification of the information. Organizations have
    the flexibility to either encrypt all information on storage devices (i.e., full disk encryption) or encrypt specific
    data structures (e.g., files, records, or fields). Use of weak or untested encryption algorithms undermines the purposes
    of utilizing encryption to protect data. The operating system must implement cryptographic modules adhering to the higher
    standards approved by the federal government since this provides assurance they have been tested and validated. Satisfies:
    SRG-OS-000185-GPOS-00079, SRG-OS-000405-GPOS-00184, SRG-OS000404-GPOS-00183, SRG-OS-000396-GPOS-00176'
  impact: ''
  references: []
  page_start: 330
  audit_raw: 'Determine if IBM''s DS880 Disks or equivalent hardware solutions are in use.

    If IBMs DS880 Disks or equivalent hardware solutions are not in use for systems that

    require "data at rest", this is a finding.'
  remediation: 'Employ IBM''s DS8880 hardware or equivalent hardware solutions to ensure full disk

    encryption.'
  checks:
  - type: manual_review
    info: 'Determine if IBM''s DS880 Disks or equivalent hardware solutions are in use.

      If IBMs DS880 Disks or equivalent hardware solutions are not in use for systems that

      require "data at rest", this is a finding.'
    severity: medium
- id: '1.159'
  title: TSS0-OS-000350
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS must configure system wait times to protect resource availability based on site priorities. GROUP
    ID: V-224031 RULE ID: SV-224031r991589'
  rationale: To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates
    by DoD-approved PKIs, all DoD systems (e.g., web servers and web portals) must be properly configured to incorporate access
    control methods that do not rely solely on the possession of a certificate for access. Successful authentication must
    not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must be
    implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the process
    of determining whether an entity, once authenticated, is permitted to access a specific asset. Information systems use
    access control policies and enforcement mechanisms to implement this requirement.
  impact: ''
  references: []
  page_start: 332
  audit_raw: 'Refer to IEASYS00 member in SYS1.PARMLIB Concatenation. Determine proper

    SMFPRMxx member.

    Examine the JWT, SWT, and TWT values.

    If the JWT parameter is greater than "15" minutes, and the system is processing

    unclassified information, review the following items.

    If any of these items is true, this is not a finding.

    -If a session is not terminated, but instead is locked out after 15 minutes of inactivity, a

    process must be in place that requires user identification and authentication before the

    session is unlocked. Session lock-out will be implemented through system controls or

    terminal screen protections.

    -A system''s default time for terminal lock-out or session termination may be lengthened

    to 30 minutes at the discretion of the ISSM or ISSO. The ISSM and/or ISSO will

    maintain the documentation for each system with a time-out adjusted beyond the 15minute recommendation to explain the
    basis for this decision.

    -The ISSM and/or ISSO may set selected userids to have a time-out of up to 60 minutes

    in order to complete critical reports or transactions without timing out. Each exception

    must meet the following criteria:

    -The time-out exception cannot exceed 60 minutes.

    -A letter of justification fully documenting the user requirement(s) must be submitted and

    approved by the site ISSM or ISSO. In addition, this letter must identify an alternate

    means of access control for the terminal(s) involved (e.g., a room that is locked at all

    times, a room with a cipher lock to limit access, a password protected screen saver set

    to 30 minutes or less, etc.).

    -The requirement must be revalidated on an annual basis.

    If the TWT and SWT values are equal or less than the JWT value, this is not a finding.'
  remediation: 'Configure the SMFPRMxx JWT to "15" minutes for classified systems.

    The JWT parameter can be greater than "15" minutes if the system is processing

    unclassified information and the following items are reviewed.

    -If a session is not terminated, but instead is locked out after "15" minutes of inactivity, a

    process must be in place that requires user identification and authentication before the

    session is unlocked. Session lock-out will be implemented through system controls or

    terminal screen protections.

    -A system''s default time for terminal lock-out or session termination may be lengthened

    to "30" minutes at the discretion of the ISSM or ISSO. The ISSM and/or ISSO will

    maintain the documentation for each system with a time-out adjusted beyond the 15minute recommendation to explain the
    basis for this decision.

    -The ISSM and/or ISSO may set selected userids to have a time-out of up to "60"

    minutes in order to complete critical reports or transactions without timing out. Each

    exception must meet the following criteria:

    -The time-out exception cannot exceed "60" minutes.

    -A letter of justification fully documenting the user requirement(s) must be submitted and

    approved by the site ISSM or ISSO. In addition, this letter must identify an alternate

    means of access control for the terminal(s) involved (e.g., a room that is locked at all

    times, a room with a cipher lock to limit access, a password protected screen saver set

    to 30 minutes or less, etc.).

    -The requirement must be revalidated on an annual basis.

    Configure any TWT and or SWT to be equal or less than the JWT.'
  checks:
  - type: manual_review
    info: 'Refer to IEASYS00 member in SYS1.PARMLIB Concatenation. Determine proper

      SMFPRMxx member.

      Examine the JWT, SWT, and TWT values.

      If the JWT parameter is greater than "15" minutes, and the system is processing

