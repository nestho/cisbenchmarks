    in the execute portion of the owner permissions. For example, a display of the

    permissions of a file with the setuid bit on could be "-rwsrwxrwx".

    All directories that have the other write permission bit set on do not contain any files

    with the setgid bit set on.

    NOTE: In the symbolic permission bit display, the setgid bit is indicated as an "s" or "S"

    in the execute portion of the group permissions. For example, a display of the

    permissions of a file with the setgid bit on could be "-rwxrwsrwx".'
