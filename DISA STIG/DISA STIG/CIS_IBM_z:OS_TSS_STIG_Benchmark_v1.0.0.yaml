- id: '1.167'
  title: TSS0-OS-000460
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS system administrator must develop a procedure to shut down the information system, restart the information
    system, and/or notify the system administrator when anomalies in the operation of any security functions are discovered.
    GROUP ID: V-224041 RULE ID: SV-224041r958948'
  rationale: If anomalies are not acted upon, security functions may fail to secure the system. Security function is defined
    as the hardware, software, and/or firmware of the information system responsible for enforcing the system security policy
    and supporting the isolation of code and data on which the protection is based. Security functionality includes, but is
    not limited to, establishing system accounts, configuring access authorizations (i.e., permissions, privileges), setting
    events to be audited, and setting intrusion detection parameters. Notifications provided by information systems include
    messages to local computer consoles, and/or hardware indications, such as lights. This capability must take into account
    operational requirements for availability for selecting an appropriate response. The organization may choose to shut down
    or restart the information system upon security function anomaly detection.
  impact: ''
  references: []
