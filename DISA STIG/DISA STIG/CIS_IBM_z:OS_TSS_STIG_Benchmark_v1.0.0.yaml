  page_start: 121
  audit_raw: 'Refer to the SYS1.UADS.

    Ask the System Administrator for list of all emergency ACIDs available to the site along

    with the associated function of each.

    If there are no emergency ACIDs defined ask the system administrator for an alternate

    documented procedure to handle emergencies.

    If there are no emergency ACIDs and no documented emergency procedure, this is a

    finding.

    If at a minimum, an emergency ACID exists with the security administration attributes

    specified in accordance with the following requirements, this is not a finding.

    For emergency IDs with security administration privileges, but which cannot access and

    update system data sets:

    ADMIN Authority:

    ACID(ALL)

    DATA(ALL)

    OTRAN(ALL)

    MISC1(INSTDATA,SUSPEND,TSSSIM,NOATS)

    MISC2(TSO,TARGET)

    MISC8(PWMAINT,REMASUSP)

    MISC9(GENERIC) FACILITY(BATCH, TSO, ROSCOE, CICS, xxxx)

    Where ''xxxx'' is a facility the application security team grants access into for their

    application users.

    An additional class of userids can exist to perform all operating system functions except

    ESM administration.

    These emergency ACID(s) will have ability to access and update all system data sets

    but will not have security administration privileges. See the following requirements:

    Data set permissions for the emergency ACIDs will be permitted as follows:

    TSS PER(acid) DSN(*****) ACCESS(ALL) ACTION(AUDIT)

    Security Bypass Attributes NODSNCHK, NOVOLCHK, and NORESCHK will not be

    given to the Emergency ACIDs.

    All emergency ACID(s) are to be implemented with logging to provide an audit trail of

    their activities.

    All emergency ACID(s) are to be maintained in both the ESM and SYS1.UADS to

    ensure they are available in the event that the ESM is not functional.

    All emergency ACID(s) will have distinct, different passwords in SYS1.UADS and in the

    ACP, and the site is to establish procedures to ensure that the passwords differ. The

    password for any ID in SYS1.UADS is never to match the password for the same ID in

    the ACP.

    All emergency ACID(s) will have documented procedures to provide a mechanism for

    the use of the IDs. Their release for use is to be logged, and the log is to be maintained

    by the ISSO. When an emergency ACID is released for use, its password is to be reset

    by the ISSO within 12 hours.

    1. Review the access authorizations for all emergency ACIDs to ensure that all

    access permitted to these ACIDs is reviewed and approved by the ISSO.

    2. If emergency ACIDs are utilized, ensure they are restricted to performing only the

    operating system recovery functions or the ESM administration functions.

    If these emergency ACID(s) have ability to ACCESS and UPDATE all system data sets,

    but do not have security administration privileges, this is not a finding.

    Note: If running Quest NC-Pass, validate that the Emergency ACIDS are identified to

    have the FACILITY of NCPASS and SECURID resource in the ABSTRACT resource

    class.'
  remediation: 'Configure any emergency ACID to have only access to resources required to support

    the specific functions of the owning department and that access to these resources is

    audited. Evaluate the impact of correcting the deficiency. Develop a plan of action and

    implement the changes.

    TSS PER(acid) DSN(*****) ACCESS(ALL) ACTION(AUDIT)

    Security Bypass Attributes NODSNCHK, NOVOLCHK, and NORESCHK will not be

    given to the Emergency ACIDs.

    All emergency ACID(s) are to be implemented with logging to provide an audit trail of

    their activities.

    All emergency ACID(s) are to be maintained in both the ACP and SYS1.UADS to

    ensure they are available in the event that the ACP is not functional.

    All emergency ACID(s) will have distinct, different passwords in SYS1.UADS and in the

    ACP, and the site is to establish procedures to ensure that the passwords differ. The

    password for any ID in SYS1.UADS is never to match the password for the same ID in

    the ACP.

    All emergency ACID(s) will have documented procedures to provide a mechanism for

    the use of the IDs. Their release for use is to be logged, and the log is to be maintained

    by the ISSO. When an emergency ACID is released for use, its password is to be reset

    by the ISSO within 12 hours.

    If no emergency userids are in use on the system, develop and document a procedure

    to manage emergency access to the system.'
