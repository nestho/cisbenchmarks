- id: '1.69'
  title: TSS0-ES-000690
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS must properly configure CONSOLxx members. GROUP ID: V-223942 RULE ID: SV-223942r958480'
  rationale: In order to prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized
    tunneling (i.e., embedding of data types within data types), organizations must disable or restrict unused or unnecessary
    physical and logical ports/protocols on information systems. Operating systems are capable of providing a wide variety
    of functions and services. Some of the functions and services provided by default may not be necessary to support essential
    organizational operations. Additionally, it is sometimes convenient to provide multiple services from a single component
    (e.g., VPN and IPS); however, doing so increases risk over limiting the services provided by any one component. To support
    the requirements and principles of least functionality, the operating system must support the organizational requirements,
    providing only essential capabilities and limiting the use of ports, protocols, and/or services to only those required,
    authorized, and approved to conduct official business or to address authorized quality of life issues.
  impact: ''
  references: []
  page_start: 154
  audit_raw: 'Review each CONSOLxx parmlib member.

    If the following guidance is true, this is not a finding.

    The "DEFAULT" statement for each CONSOLxx member specifies

    "LOGON(REQUIRED)" or "LOGON(AUTO)".

    The "CONSOLE" statement for each console assigns a unique name using the "NAME"

    parameter.

    The "CONSOLE" statement for each console specifies "AUTH(INFO)". Exceptions are

    the "AUTH" parameter is not valid for consoles defined with "UNIT(PRT)" and specifying

    "AUTH(MASTER)" is permissible for the system console.

    Note: The site should be able to determine the system consoles. However, it is

    imperative that the site adhere to the "DEFAULT" statement requirement.'
  remediation: 'Configure the "DEFAULT" statement to specify "LOGON(REQUIRED)" so that all

    operators are required to log on prior to entering z/OS system commands. At the

    discretion of the ISSO, "LOGON(AUTO)" may be used. If "LOGON(AUTO)" is used

    assure that the console userids are defined with minimal access. See ACP00292.

    Configure each "CONSOLE" statement to specify an explicit console NAME. And that

    "AUTH(INFO)" is specified, this also including extended MCS consoles.

    "AUTH(MASTER)" may be specified for systems console.

    Note: The site should be able to determine the system consoles. However, it is

    imperative that the site adhere to the "DEFAULT" statement requirement.'
  checks:
  - type: manual_review
    info: 'Review each CONSOLxx parmlib member.

      If the following guidance is true, this is not a finding.

      The "DEFAULT" statement for each CONSOLxx member specifies

      "LOGON(REQUIRED)" or "LOGON(AUTO)".

      The "CONSOLE" statement for each console assigns a unique name using the "NAME"

      parameter.

      The "CONSOLE" statement for each console specifies "AUTH(INFO)". Exceptions are

      the "AUTH" parameter is not valid for consoles defined with "UNIT(PRT)" and specifying

      "AUTH(MASTER)" is permissible for the system console'
    severity: medium
- id: '1.70'
  title: TSS0-ES-000700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS must properly protect MCS console userid(s). GROUP ID: V-223943 RULE ID: SV-223943r958480'
  rationale: In order to prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized
    tunneling (i.e., embedding of data types within data types), organizations must disable or restrict unused or unnecessary
    physical and logical ports/protocols on information systems. Operating systems are capable of providing a wide variety
    of functions and services. Some of the functions and services provided by default may not be necessary to support essential
    organizational operations. Additionally, it is sometimes convenient to provide multiple services from a single component
    (e.g., VPN and IPS); however, doing so increases risk over limiting the services provided by any one component. To support
    the requirements and principles of least functionality, the operating system must support the organizational requirements,
    providing only essential capabilities and limiting the use of ports, protocols, and/or services to only those required,
    authorized, and approved to conduct official business or to address authorized quality of life issues.
  impact: ''
  references: []
  page_start: 156
  audit_raw: 'Refer to IEASYS00 to determine correct CONSOLxx member.

    Examine the CONSOLxx member.

    If the following guidance is true, this is not a finding.

    Each console defined in the currently active CONSOLxx parmlib member in

    EXAM.RPT(PARMLIB) is associated with a valid TSS ACID.

    Each console ACID has no special privileges and/or attributes (e.g., BYPASSING,

    CONSOLE, etc.; excluding VTAM SMCS consoles).

    Each console ACID has no accesses to interactive on-line facilities (e.g., TSO, CICS,

    etc.; excluding VTAM SMCS consoles). Each console can have the Facility of

    CONSOLE.

    Each console ACID will be restricted from accessing all data sets and resources except

    MVS.MCSOPER.consolename in the OPERCMDS resource class and consolename in

    the CONSOLE resource class.

    NOTE: If LOGON(AUTO) is specified in the currently active CONSOLxx parmlib

    member, additional access may be required. Permissions for the console ACIDs and/or

    console profile may be given with access READ to MVS.CONTROL, MVS.DISPLAY,

    MVS.MONITOR, and MVS.STOPMN OPERCMDS resource.'
  remediation: 'Review the MCS console resources defined to z/OS and the ACP, and ensure they

    conform to those outlined below.

    Each console defined in the currently active CONSOLxx parmlib member in

    EXAM.RPT(PARMLIB) is associated with a valid TSS ACID.

    Each console ACID has no special privileges and/or attributes (e.g., BYPASSING,

    CONSOLE, etc.).

    Each console ACID has no accesses to interactive on-line facilities (e.g., TSO, CICS,

    etc.; excluding VTAM SMCS consoles).

    Each console can have the Facility of CONSOLE.

    Each console ACID will be restricted from accessing all data sets and resources except

    MVS.MCSOPER.consolename in the OPERCMDS resource class and consolename in

    the CONSOLE resource class.

    NOTE: If LOGON(AUTO) is specified in the currently active CONSOLxx parmlib

    member, additional access may be required. Permissions for the console ACIDs and/or

    console profile may be given with access READ to MVS.CONTROL, MVS.DISPLAY,

    MVS.MONITOR, and MVS.STOPMN OPERCMDS resource.

    Example: (These are only examples, not requirements.)

    TSS CREATE(consnoautolog) TYPE(PROFILE)

    NAME(''MCS consoles with no autolog'')

    DEPT(''SYS1'')

    TSS CREATE(consautolog) TYPE(PROFILE) -

    NAME(''MCS consoles with autolog'') -

    DEPT(''SYS1'')

    TSS CREATE(consname) NAME(''MCS console name'') -

    FACILITY(CONSOLE) PASSWORD(password,0) -

    PROFILE(consgroup)

    TSS PER(consautolog) OPERCMDS(MVS.CONTROL) ACCESS(READ)

    TSS PER(consautolog) OPERCMDS(MVS.DISPLAY) ACCESS(READ)

    TSS PER(consautolog) OPERCMDS(MVS.MONITOR) ACCESS(READ)

    TSS PER(consautolog) OPERCMDS(MVS.STOPMN) ACCESS(READ)

    TSS PER(consname) SYSCONS(consname) ACCESS(READ)'
  checks:
  - type: manual_review
    info: 'Refer to IEASYS00 to determine correct CONSOLxx member.

      Examine the CONSOLxx member.

      If the following guidance is true, this is not a finding.

      Each console defined in the currently active CONSOLxx parmlib member in

      EXAM.RPT(PARMLIB) is associated with a valid TSS ACID.

      Each console ACID has no special privileges and/or attributes (e.g., BYPASSING,

      CONSOLE, etc.; excluding VTAM SMCS consoles).

      Each console ACID has no accesses to interactive on-line facilities (e.g., TSO, CICS,

      etc.; excluding VT'
    severity: medium
