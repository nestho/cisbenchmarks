    \ including dynamic link libraries and files for\nstatic linking\n/samples 1755 fff Sample configuration and other files\n\
    /tmp 1777 fff Temporary data used by daemons, servers, and users. Note: /tmp\nmust have the sticky bit on to restrict\
    \ file renames and deletions.\n/u 1755 fff Mount point for user home directories and optionally for thirdparty software\
