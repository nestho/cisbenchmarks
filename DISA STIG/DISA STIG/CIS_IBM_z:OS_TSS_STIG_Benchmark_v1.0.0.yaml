  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM Z/OS TSOAUTH resources must be restricted to authorized users. GROUP ID: V-224072 RULE ID: SV-224072r958472'
  rationale: 'To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates
