    parameters for RJE node definitions by searching for "RMT(" in the report.

    Note 4: RDRnn, where nn is the number of the reader. Review the JES2 parameters for

    reader definitions by searching for "RDR(" in the report.

    Ensure all of the defined resources above are owned by generic and/or fully qualified

    entries in the JESINPUT resource class.

