- id: '1.82'
  title: TSS0-ES-000830
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'CA-TSS DOWN Control Option values must be properly specified. GROUP ID: V-223956 RULE ID: SV-223956r958550'
  rationale: Failure to a known safe state helps prevent systems from failing to a state that may cause loss of data or unauthorized
    access to system resources. Operating systems that fail suddenly and with no incorporated failure state planning may leave
    the system available but with a reduced security protection capability. Preserving operating system state information
    also facilitates system restart and return to the operational mode of the organization with less disruption to mission-essential
    processes. Abort refers to stopping a program or function before it has finished naturally. The term abort refers to both
    requested and unexpected terminations.
  impact: ''
  references: []
  page_start: 178
  audit_raw: 'From the ISPF Command Shell enter:

    TSS MODIFY STATUS

