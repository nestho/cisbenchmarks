    TSS PERMIT(icsfusrs) DSN(SYS1.CSF.) ACCESS(R)

    TSS PERMIT(syspaudt) DSN(SYS1.CSF.) ACCESS(ALL) ACTION(AUDIT)

    TSS PERMIT(tstcaudt) DSN(SYS1.CSF.) ACCESS(ALL) ACTION(AUDIT)'
