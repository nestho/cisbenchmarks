- id: '1.95'
  title: TSS0-ES-000960
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'CA-TSS ACIDs granted the CONSOLE attribute must be justified. GROUP ID: V-223969 RULE ID: SV-223969r958726'
  rationale: Preventing non-privileged users from executing privileged functions mitigates the risk that unauthorized individuals
    or processes may gain unnecessary access to information or privileges. Privileged functions include, for example, establishing
    accounts, performing system integrity checks, or administering cryptographic key management activities. Nonprivileged
    users are individuals that do not possess appropriate authorizations. Circumventing intrusion detection and prevention
    mechanisms or malicious code protection mechanisms are examples of privileged functions that require protection from non-privileged
    users.
