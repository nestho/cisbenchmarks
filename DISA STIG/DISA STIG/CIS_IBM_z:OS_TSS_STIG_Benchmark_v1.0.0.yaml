  page_start: 297
  audit_raw: 'Refer to the System proclibs for the TSS STC.

    If the Security database is located on the same volume as either the backup, Alternate

    or Recovery file, this is a finding.'
  remediation: 'Configure the placement of ESM files are on a separate volume from its backup and

    recovery data sets to provide backup and recovery in the event of physical damage to a

    volume.

    Identify the ESM database(s), backup database(s), and recovery data set(s). Develop a

    plan to keep these data sets on different physical volumes. Implement the movement of

    these critical ESM files.

    File location is an often overlooked factor in system integrity. It is important to ensure

    that the effects of hardware failures on system integrity and availability are minimized.

    Avoid collocation of files such as primary and alternate databases. For example, the

    loss of the physical volume containing the ESM database should not also cause the loss

    of the ESM backup database as a result of their collocation. Files that will be

    segregated from each other on separate physical volumes include, but are not limited

    to, the ESM database and its alternate or backup file.'
  checks:
  - type: manual_review
    info: 'Refer to the System proclibs for the TSS STC.

      If the Security database is located on the same volume as either the backup, Alternate

      or Recovery file, this is a finding.'
    severity: medium
- id: '1.137'
  title: TSS0-OS-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The CA-TSS database must be backed up on a scheduled basis. GROUP ID: V-224005 RULE ID: SV-224005r991589'
  rationale: 'Configuring the operating system to implement organization-wide security implementation guides and security
    checklists ensures compliance with federal standards and establishes a common security baseline across DoD that reflects
    the most restrictive security posture consistent with operational requirements. Configuration settings are the set of
    parameters that can be changed in hardware, software, or firmware components of the system that affect the security posture
    and/or functionality of the system. Security-related parameters are those parameters impacting the security state of the
    system, including the parameters required to satisfy other security control requirements. Security-related parameters
    include, for example: registry settings; account, file, directory permission settings; and settings for functions, ports,
    protocols, services, and remote connections.'
  impact: ''
  references: []
  page_start: 299
  audit_raw: 'Refer to the TSS Proclib PARMFILE DD to determine the PARM member.

    If the BACKUP is missing or coded with blank or OFF this is a finding.

    Note: If the security data base is shared only one of the systems is required to configure

    the BACKUP option in the PARMFILE. Determine that the option is properly coded on

    one of the systems that share the security database.

    From the ISPF Command Shell enter:

    TSS MODIFY(Status)

    If the backup parameter is active with a valid time this is not a finding.'
  remediation: 'Configure the TSS PARMLIB BACKUP parameter to include BACKUP statement with a

    valid time. Additionally, configure the BACKUP parameter in the TSS Parmfile to include

    BACKUP statement with a valid time for nightly backups.'
