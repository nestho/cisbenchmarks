    \ commands in /etc/rc is required in most environments to\ncomply with the required settings, especially for dynamic objects\
    \ such as the /dev\ndirectory.\nThe following represents a hierarchy for permission bits from least restrictive to most\n\
    restrictive:\n7 rwx (least restrictive)\n6 rw3 -wx\n2 -w5 r-x\n4 r--\n1 --x\n0 --- (most restrictive)\nIf all of the CHAUDIT\
