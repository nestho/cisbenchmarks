  title: TSS0-OS-000420
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS system administrator must develop a procedure to notify designated personnel if baseline configurations
    are changed in an unauthorized manner. GROUP ID: V-224038 RULE ID: SV-224038r958794'
  rationale: Unauthorized changes to the baseline configuration could make the system vulnerable to various attacks or allow
    unauthorized access to the operating system. Changes to operating system configurations can have unintended side effects,
    some of which may be relevant to security. Detecting such changes and providing an automated response can help avoid unintended,
    negative consequences that could ultimately affect the security state of the operating system. The operating system's
    IMO/ISSO and SAs must be notified via email and/or monitoring system trap when there is an unauthorized modification of
    a configuration item.
