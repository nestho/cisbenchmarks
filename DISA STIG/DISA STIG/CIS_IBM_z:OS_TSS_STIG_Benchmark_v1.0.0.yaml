  audit_raw: 'On the OMVS Command line enter the following command string:

    find / -type d -perm -0002 ! -perm -1000 -exec ls -aldWE {} ;

    If there are no directories that have the other write permission bit set on without the

    sticky bit set on, there is no finding.

    NOTE: In the symbolic permission bit display, the sticky bit is indicated as a "t" or "T" in

    the execute portion of the other permissions. For example, a display of the permissions

    of a directory with the sticky bit on could be "drwxrwxrwt".

    If all directories that have the other write permission bit set on do not contain any files

    with the setuid bit set on, this is not a finding.

    NOTE: In the symbolic permission bit display, the setuid bit is indicated as an "s" or "S"

    in the execute portion of the owner permissions. For example, a display of the

    permissions of a file with the setuid bit on could be "-rwsrwxrwx".

    If all directories that have the other write permission bit set on do not contain any files

    with the setgid bit set on, this is not a finding.

    NOTE: In the symbolic permission bit display, the setgid bit is indicated as an "s" or "S"

    in the execute portion of the group permissions. For example, a display of the

    permissions of a file with the setgid bit on could be "-rwxrwsrwx".'
  remediation: 'Configure directory permissions as follows

    There are no directories that have the other write permission bit set on without the sticky

    bit set on.

    NOTE: In the symbolic permission bit display, the sticky bit is indicated as a "t" or "T" in

    the execute portion of the other permissions. For example, a display of the permissions

    of a directory with the sticky bit on could be "drwxrwxrwt".

