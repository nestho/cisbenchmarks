    info: 'Ask the system administrator for the configuration parameters for the session manager

      in use.

      If there is no session manager in use, this is a finding.

      If the session manager is not configured to retain a user''s session lock until that user

      reestablishes access using established identification and authentication procedures, this

      is a finding.'
    severity: medium
- id: '1.162'
  title: TSS0-OS-000390
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS system administrator (SA) must develop a procedure to remove or disable temporary user accounts after
    72 hours. GROUP ID: V-224035 RULE ID: SV-224035r998507'
  rationale: If temporary user accounts remain active when no longer needed or for an excessive period, these accounts may
    be used to gain unauthorized access. To mitigate this risk, automated termination of all temporary accounts must be set
    upon account creation. Temporary accounts are established as part of normal account activation procedures when there is
    a need for short-term accounts without the demand for immediacy in account activation. If temporary accounts are used,
    the operating system must be configured to automatically terminate these types of accounts after a DOD-defined time period
    of 72 hours. To address access requirements, many operating systems may be integrated with enterprise-level authentication/access
    mechanisms that meet or exceed access control policy requirements.
  impact: ''
  references: []
  page_start: 337
  audit_raw: 'Ask the SA for the procedure to automatically remove or disable temporary user

    accounts after 72 hours.

    If there is no procedure, this is a finding.'
  remediation: 'Develop a procedure to remove or disable emergency user accounts after the crisis is

    resolved or 72 hours.'
  checks:
  - type: manual_review
    info: 'Ask the SA for the procedure to automatically remove or disable temporary user

      accounts after 72 hours.

      If there is no procedure, this is a finding.'
    severity: medium
- id: '1.163'
  title: TSS0-OS-000400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS system administrator (SA) must develop a procedure to remove or disable emergency accounts after
    the crisis is resolved or 72 hours. GROUP ID: V-224036 RULE ID: SV-224036r998508'
  rationale: Emergency accounts are privileged accounts that are established in response to crisis situations where the need
    for rapid account activation is required. Therefore, emergency account activation may bypass normal account authorization
    processes. If these accounts are automatically disabled, system maintenance during emergencies may not be possible, thus
    adversely affecting system availability. Emergency accounts are different from infrequently used accounts (i.e., local
    logon accounts used by the organization's system administrators when network or normal logon/access is not available).
    Infrequently used accounts are not subject to automatic termination dates. Emergency accounts are accounts created in
    response to crisis situations, usually for use by maintenance personnel. The automatic expiration or disabling time period
    may be extended as needed until the crisis is resolved; however, it must not be extended indefinitely. A permanent account
    should be established for privileged users who need long-term maintenance accounts. To address access requirements, many
    operating systems can be integrated with enterprise-level authentication/access mechanisms that meet or exceed access
    control policy requirements.
  impact: ''
  references: []
  page_start: 339
  audit_raw: 'Ask the SA for the procedure to automatically remove or disable emergency accounts

    after the crisis is resolved or 72 hours.

    If there is no procedure, this is a finding.'
  remediation: 'Develop a procedure to remove or disable emergency user accounts after the crisis is

    resolved or 72 hours.'
  checks:
  - type: manual_review
    info: 'Ask the SA for the procedure to automatically remove or disable emergency accounts

      after the crisis is resolved or 72 hours.

      If there is no procedure, this is a finding.'
    severity: medium
- id: '1.164'
  title: TSS0-OS-000410
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS system administrator (SA) must develop a procedure to notify SAs and information system security
    officers (ISSOs) of account enabling actions. GROUP ID: V-224037 RULE ID: SV-224037r998509'
  rationale: Once an attacker establishes access to a system, the attacker often attempts to create a persistent method of
    reestablishing access. One way to accomplish this is for the attacker to enable an existing disabled account. Sending
    notification of account enabling actions to the System Administrator and ISSO is one method for mitigating this risk.
    Such a capability greatly reduces the risk that operating system accessibility will be negatively affected for extended
    periods of time and also provides logging that can be used for forensic purposes. In order to detect and respond to events
    that affect user accessibility and application processing, operating systems must audit account enabling actions and,
    as required, notify the appropriate individuals so they can investigate the event. To address access requirements, many
    operating systems can be integrated with enterprise-level authentication/access/auditing mechanisms that meet or exceed
    access control policy requirements.
  impact: ''
  references: []
  page_start: 341
  audit_raw: 'Ask the SA for the procedure to notify system administrators and ISSOs of account

    enabling actions. If there is no procedure, this is a finding.'
  remediation: Develop a documented procedure to notify SAs and ISSOs of account enabling actions.
  checks:
  - type: manual_review
    info: 'Ask the SA for the procedure to notify system administrators and ISSOs of account

      enabling actions. If there is no procedure, this is a finding.'
    severity: medium
