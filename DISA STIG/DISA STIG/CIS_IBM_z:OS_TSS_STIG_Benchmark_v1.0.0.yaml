  remediation: 'Review all security administrator ACIDs. Evaluate the impact of correcting the

    deficiency. Develop a plan of action and reduce the number of control ACIDs if not

    justified. Use information below as guidance.

    TYPE=CENTRAL, TYPE=MASTER or also known as "SCA" and "MSCA" level of

    ACIDS will adhere to the following restrictions based upon documented role/function an

    individual performs:

    -Domain level Information System Security Officer (ISSO) - full administrative authorities

    and access rights needed to perform required and documented

    role/responsibilities/function.

    -Assistance Domain Level Information System Security Officer or "backup" or ISSO (up

    to same access as 1).

    -DISA SRR Auditor, DoD IG Auditor, SAS70 Auditor - only "view" administrative

    authorities must be granted and only for those roles/functions that have been formally

    documented as DISA, DoD IG or SAS70 Auditors and approved by the DISA AO for

    those position/functions/roles.

    Exception: Until scoping is worked out and resolved, DISA OST team members may be

    defined as TYPE=CENTRAL with limited authority such as ACID(INFO,MAINTAIN). All

    OST Team member ACIDs will be changed to TYPE=LIMITED and scoped accordingly

    to allow password resets upon verification of users, yet to limit and eliminate any

    potential risk associated with resetting of MSCA or other SCA level accounts. NO other

    exceptions will exist.'
