    z/OS environment. This reduces the potential of a hacker adding a routine to a library

    and possibly creating an exposure. Confirm that all exits are tracked using a CMP.

    Develop usermods to include the source/object code used to support the exits. Have

    systems programming personnel review all z/OS and other product exits to confirm that

    the exits are required and are correctly installed.

    Configure ESM data set rules for all WRITE or greater access to libraries containing

    z/OS and other system-level exits will be logged using the ACP''s facilities. Only systems

    programming personnel will be authorized to update the libraries containing z/OS and

    other system level exits.'
