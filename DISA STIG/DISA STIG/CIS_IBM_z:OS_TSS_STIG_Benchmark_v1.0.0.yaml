    WRITE and ALLOCATE access to the data set(s) containing the Data and Profile

    configuration files is logged.

    Note: If any INCLUDE statements are specified in the Profile configuration file, the

    named MVS data sets have the same logging requirements.

    WRITE and ALLOCATE access to the data set(s) containing the configuration files

    shared by TCP/IP applications is restricted to systems programming personnel.

    Note: For systems running the TSS ACP replace the WRITE and ALLOCATE with

    WRITE, UPDATE, CREATE, CONTROL, SCRATCH, and ALL.'
