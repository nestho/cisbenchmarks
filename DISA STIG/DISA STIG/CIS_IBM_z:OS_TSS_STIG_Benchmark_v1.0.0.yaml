  rationale: Utilizing a whitelist provides a configuration management method for allowing the execution of only authorized
    software. Using only authorized software decreases risk by limiting the number of potential vulnerabilities. The organization
    must identify authorized software programs and permit execution of authorized software. The process used to identify software
    programs that are authorized to execute on organizational information systems is commonly referred to as whitelisting.
    Verification of white-listed software occurs prior to execution or at system startup. This requirement applies to operating
    system programs, functions, and services designed to manage system processes and configurations (e.g., group policies).
