  description: 'IBM z/OS SSL encryption options for the TN3270 Telnet server must be specified properly for each statement
    that defines a SECUREPORT or within the TELNETGLOBALS. GROUP ID: V-224067 RULE ID: SV-224067r1050770'
  rationale: 'Without confidentiality protection mechanisms, unauthorized individuals may gain access to sensitive information
    via a remote access session. Remote access is access to DOD nonpublic information systems by an authorized user (or an
    information system) communicating through an external, nonorganizationcontrolled network. Remote access methods include,
    for example, dial-up, broadband, and wireless. Encryption provides a means to secure the remote connection to prevent
    unauthorized access to the data traversing the remote access connection (e.g., RDP), thereby providing a degree of confidentiality.
    The encryption strength of a mechanism is selected based on the security categorization of the information. Satisfies:
