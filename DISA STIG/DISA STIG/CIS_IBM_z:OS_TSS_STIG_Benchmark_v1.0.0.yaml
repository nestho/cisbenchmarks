    finding.

    NOTE: VALID FOR INTERACTIVE USERIDS, NOT VALID FOR STARTED TASK

    USERIDS AND BATCH USERIDS.'
  remediation: 'Develop a procedure to check all userids for inactivity of more than "35" days. If found,

    the information system security officer (ISSO) must suspend an account, but not delete

