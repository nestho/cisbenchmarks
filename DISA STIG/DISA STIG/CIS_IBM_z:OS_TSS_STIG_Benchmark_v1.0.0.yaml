      If any of these items is true, this is not a finding.

      -If a session is not terminated, but instead is locked out after 15 minutes of inactivity, a

      process must be in place that requires user identification and authentication before the

      se'
    severity: medium
- id: '1.160'
  title: TSS0-OS-000360
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS must employ a session manager to conceal, via the session lock, information previously visible on
    the display with a publicly viewable image. GROUP ID: V-224032 RULE ID: SV-224032r958404'
  rationale: A session lock is a temporary action taken when a user stops work and moves away from the immediate physical
    vicinity of the information system but does not log out because of the temporary nature of the absence. The session lock
    is implemented at the point where session activity can be determined. The operating system session lock event must include
    an obfuscation of the display screen so as to prevent other users from reading what was previously displayed. Publicly
    viewable images can include static or dynamic images, for example, patterns used with screen savers, photographic images,
    solid colors, a clock, a battery life indicator, or a blank screen, with the additional caveat that none of the images
    convey sensitive information.
  impact: ''
  references: []
  page_start: 335
  audit_raw: 'Ask the system administrator for the configuration parameters for the session manager

    in use.

    If there is no session manager in use, this is a finding.

    If the session manager is not configured to conceal, via the session lock, information

    previously visible on the display with a publicly viewable image, this is a finding.'
  remediation: 'Configure the session manager to conceal, via the session lock, information previously

    visible on the display with a publicly viewable image.'
  checks:
  - type: manual_review
    info: 'Ask the system administrator for the configuration parameters for the session manager

      in use.

      If there is no session manager in use, this is a finding.

      If the session manager is not configured to conceal, via the session lock, information

      previously visible on the display with a publicly viewable image, this is a finding.'
    severity: medium
- id: '1.161'
  title: TSS0-OS-000380
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS must employ a session manager to manage retaining a users session lock until that user reestablishes
    access using established identification and authentication procedures. GROUP ID: V-224034 RULE ID: SV-224034r958400'
  rationale: A session lock is a temporary action taken when a user stops work and moves away from the immediate physical
    vicinity of the information system but does not want to log out because of the temporary nature of the absence. The session
    lock is implemented at the point where session activity can be determined. Regardless of where the session lock is determined
    and implemented, once invoked, the session lock must remain in place until the user re-authenticates. No other activity
    aside from re-authentication will unlock the system.
  impact: ''
  references: []
  page_start: 336
  audit_raw: 'Ask the system administrator for the configuration parameters for the session manager

    in use.

    If there is no session manager in use, this is a finding.

    If the session manager is not configured to retain a user''s session lock until that user

    reestablishes access using established identification and authentication procedures, this

    is a finding.'
  remediation: 'LPA (PLPA) in the Modified LPA (MLPA) for the duration of an IPL. (The xx is the suffix

    designated by the MLPA parameter in the IEASYSxx member of SYS1.PARMLIB or

    overridden by the computer operator at IPL.)'
  checks:
