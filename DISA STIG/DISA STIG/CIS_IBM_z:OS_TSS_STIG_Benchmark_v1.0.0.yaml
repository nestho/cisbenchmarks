- id: '1.172'
  title: TSS0-SL-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS permission bits and user audit bits for HFS objects that are part of the Syslog daemon component
    must be configured properly. GROUP ID: V-224046 RULE ID: SV-224046r958472'
  rationale: 'To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates
    by DoD-approved PKIs, all DoD systems (e.g., web servers and web portals) must be properly configured to incorporate access
    control methods that do not rely solely on the possession of a certificate for access. Successful authentication must
    not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must be
    implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the process
    of determining whether an entity, once authenticated, is permitted to access a specific asset. Information systems use
    access control policies and enforcement mechanisms to implement this requirement. Access control policies include: identity-based
    policies, role-based policies, and attribute-based policies. Access enforcement mechanisms include: access control lists,
    access control matrices, and cryptography. These policies and mechanisms must be employed by the application to control
    access between users (or processes acting on behalf of users) and objects (e.g., devices, files, records, processes, programs,
    and domains) in the information system.'
  impact: ''
  references: []
  page_start: 352
  audit_raw: 'From an ISPF

    Enter

    cd /usr/sbin

    Enter

    ls -alW

    If File Permission Bits and User Audit Bits for SYSLOG Daemon HFS directories and

    files are as below this is not a finding.

    /usr/sbin/syslogd 1740 fff

    Enter

    cd /etc/

    Enter

    ls -alW

    If File Permission Bits and User Audit Bits for Output log file defined in the configuration

    file are as below this is not a finding.

    /etc/syslog.conf 0744 faf

    0744 fff

    Notes:

    The /usr/sbin/syslogd object is a symbolic link to /usr/lpp/tcpip/sbin/syslogd. The

    permission and user audit bits on the target of the symbolic link must have the required

    settings.

    The /etc/syslog.conf file may not be the configuration file the daemon uses. It is

    necessary to check the script or JCL used to start the daemon to determine the actual

    configuration file. For example, in /etc/rc:

    _BPX_JOBNAME=''SYSLOGD'' /usr/sbin/syslogd -f /etc/syslog.conf

    For example, in the SYSLOGD started task JCL:

    //SYSLOGD EXEC PGM=SYSLOGD,REGION=30M,TIME=NOLIMIT

    // PARM=''POSIX(ON) ALL31(ON)/ -f /etc/syslogd.conf''

    //SYSLOGD EXEC PGM=SYSLOGD,REGION=30M,TIME=NOLIMIT

    // PARM=''POSIX(ON) ALL31(ON) /-f //''''SYS1.TCPPARMS(SYSLOG)''''''

    The following represents a hierarchy for permission bits from least restrictive to most

    restrictive:

    7 rwx (least restrictive)

    6 rw3 -wx

    2 -w5 r-x

    4 r--

    1 --x

    0 --- (most restrictive)

    The possible audit bits settings are as follows:

    f log for failed access attempts

    a log for failed and successful access

    • no auditing'
  remediation: 'Configure the UNIX permission bits and user audit bits on the HFS directories and files

    for the Syslog daemon to conform to the specifications in the SYSLOG Daemon HFS

    Object Security Settings table below.

    Log files should have security that prevents anyone except the syslogd process and

    authorized maintenance jobs from writing to or deleting them.

    A maintenance process to periodically clear the log files is essential. Logging stops if

    the target file system becomes full.

    SYSLOG Daemon HFS Object Security Settings

    File Permission Bits User Audit Bits

    /usr/sbin/syslogd 1740 fff

    [Configuration File]

    /etc/syslog.conf 0744 faf

    [Output log file defined in the configuration file]

    0744 fff

    The following represents a hierarchy for permission bits from least restrictive to most

    restrictive:

    7 rwx (least restrictive)

    6 rw3 -wx

    2 -w5 r-x

    4 r--

    1 --x

    0 --- (most restrictive)

    The possible audit bits settings are as follows:

    f log for failed access attempts

    a log for failed and successful access

    • no auditing

    NOTES:

    The /usr/sbin/syslogd object is a symbolic link to /usr/lpp/tcpip/sbin/syslogd. The

    permission and user audit bits on the target of the symbolic link must have the required

    settings.

    The /etc/syslog.conf file may not be the configuration file the daemon uses. It is

    necessary to check the script or JCL used to start the daemon to determine the actual

    configuration file. For example, in /etc/rc:

    _BPX_JOBNAME=''SYSLOGD'' /usr/sbin/syslogd -f /etc/syslog.conf

    For example, in the SYSLOGD started task JCL:

    //SYSLOGD EXEC PGM=SYSLOGD,REGION=30M,TIME=NOLIMIT

    // PARM=''POSIX(ON) ALL31(ON)/ -f /etc/syslogd.conf''

    //SYSLOGD EXEC PGM=SYSLOGD,REGION=30M,TIME=NOLIMIT

    // PARM=''POSIX(ON) ALL31(ON) /-f //''''SYS1.TCPPARMS(SYSLOG)''''''

    The following commands can be used (from a user account with an effective UID(0)) to

    update the permission bits and audit bits:

    chmod 1740 /usr/lpp/tcpip/sbin/syslogd

    chaudit rwx=f /usr/lpp/tcpip/sbin/syslogd

    chmod 0744 /etc/syslog.conf

    chaudit w=sf,rx+f /etc/syslog.conf

    chmod 0744 /log_dir/log_file

    chaudit rwx=f /log_dir/log_file'
  checks:
  - type: command
    command: ls -alW && ls -alW
    expected: ''
    severity: medium
    info: 'From an ISPF

      Enter

      cd /usr/sbin

      Enter

      ls -alW

      If File Permission Bits and User Audit Bits for SYSLOG Daemon HFS directories and

      files are as below this is not a finding.

      /usr/sbin/syslogd 1740 fff

      Enter

      cd /etc/

      Enter

      ls -alW

      If File Permission Bits and User Audit Bits for Output log file defined in the configuration

      file are as below this is not a finding.

      /etc/syslog.conf 0744 faf

      0744 fff

      Notes'
- id: '1.173'
  title: TSS0-SL-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IBM z/OS Syslog daemon must not be started at z/OS initialization. GROUP ID: V-224047 RULE ID: SV-224047r958482'
  rationale: 'To assure accountability and prevent unauthenticated access, organizational users must be identified and authenticated
    to prevent potential misuse and compromise of the system. Organizational users include organizational employees or individuals
    the organization deems to have equivalent status of employees (e.g., contractors). Organizational users (and processes
    acting on behalf of users) must be uniquely identified and authenticated to all accesses, except for the following: 1.
    Accesses explicitly identified and documented by the organization. Organizations document specific user actions that can
    be performed on the information system without identification or authentication; and 2. Accesses that occur through authorized
    use of group authenticators without individual authentication. Organizations may require unique identification of individuals
    in group accounts (e.g., shared privilege accounts) or for detailed accountability of individual activity.'
  impact: ''
  references: []
  page_start: 356
  audit_raw: 'SYSLOGD may be started from the shell, a cataloged procedure (STC), or the

    BPXBATCH program. Additionally, other mechanisms (e.g., a job scheduler) may be

    used to automatically start the Syslog daemon. To thoroughly analyze this requirement

    you may need to view the OS SYSLOG using SDSF, find the last IPL, and look for the

    initialization of SYSLOGD.

    If the Syslog daemon SYSLOGD is started automatically during the initialization of the

    z/S/ system, this is not a finding.'
  remediation: 'Review the files used to initialize tasks during system IPL (e.g., /etc/rc, SYS1.PARMLIB,

    any job scheduler definitions) configure the Syslog daemon to start automatically during

    z/OS system initialization.

    It is important that syslogd be started during the initialization phase of the z/OS system

    to ensure that significant messages are not lost. As with other z/OS UNIX daemons,

    there is more than one way to start SYSLOGD. It can be started as a process in the

    /etc/rc file or as a z/OS started task.'
  checks:
  - type: manual_review
    info: 'SYSLOGD may be started from the shell, a cataloged procedure (STC), or the

      BPXBATCH program. Additionally, other mechanisms (e.g., a job scheduler) may be

      used to automatically start the Syslog daemon. To thoroughly analyze this requirement

      you may need to view the OS SYSLOG using SDSF, find the last IPL, and look for the

      initialization of SYSLOGD.

      If the Syslog daemon SYSLOGD is started automatically during the initialization of the

      z/S/ system, this is not a finding.'
    severity: medium
- id: '1.174'
  title: TSS0-SL-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IBM z/OS Syslog daemon must be properly defined and secured. GROUP ID: V-224048 RULE ID: SV-224048r958482'
  rationale: 'To assure accountability and prevent unauthenticated access, organizational users must be identified and authenticated
    to prevent potential misuse and compromise of the system. Organizational users include organizational employees or individuals
    the organization deems to have equivalent status of employees (e.g., contractors). Organizational users (and processes
    acting on behalf of users) must be uniquely identified and authenticated to all accesses, except for the following: 1.
    Accesses explicitly identified and documented by the organization. Organizations document specific user actions that can
    be performed on the information system without identification or authentication; and 2. Accesses that occur through authorized
    use of group authenticators without individual authentication. Organizations may require unique identification of individuals
    in group accounts (e.g., shared privilege accounts) or for detailed accountability of individual activity.'
  impact: ''
  references: []
  page_start: 358
  audit_raw: 'From the ISPF Command Shell enter:

    TSS LIST(SYSLOGD) SEGMENT(OMVS)

    If the following guidance is true, this is not a finding.

    -The Syslog daemon userid is SYSLOGD.

    -The SYSLOGD userid has the STC facility.

    -The SYSLOGD userid has UID(0), HOME(''/''), and PROGRAM(''/bin/sh'') specified in the

    OMVS segment.

    -The SYSLOGD started proc is assigned the SYSLOGD userid is in the Started Task

    Table.

    If Syslog daemon is started from /etc/rc then from the ISPF Command Shell enter:

    OMVS

    cd /etc

    cat rc

    If Syslog daemon is started from /etc/rc then ensure that the "_BPX_JOBNAME" and

    "_BPX_USERID" environment variables are assigned a value of SYSLOGD.

    If the Syslog daemon is started from /etc/rc and the "_BPX_JOBNAME" and

    "_BPX_USERID" environment variables are not assigned a value of SYSLOGD, this is

    a finding.'
  remediation: 'Configure so that the Syslog daemon runs under its own user account. Specifically, it

    does not share the account defined for the z/OS UNIX kernel.

    The Syslog daemon userid is SYSLOGD.

    The SYSLOGD userid has the STC facility.

    The SYSLOGD userid has UID(0), HOME(''/''), and PROGRAM(''/bin/sh'') specified in the

    OMVS segment.

    To set up and use as an MVS Started Proc, the following sample commands are

    provided:

    TSS CREATE(SYSLOGD) TYPE(USER) NAME(SYSLOGD) -

    DEPT(existing-dept) FACILITY(STC) -

    PASSWORD(password,0)

    TSS ADD(SYSLOGD) DFLTGRP(stctcpx) GROUP(stctcpx)

    TSS ADD(SYSLOGD) SOURCE(INTRDR)

    TSS ADD(SYSLOGD) UID(0) HOME(/) OMVSPGM(/bin/sh)

    The SYSLOGD started proc is assigned the SYSLOGD userid is in the Started Task

    Table.

    TSS ADD(STC) PROCNAME(SYSLOGD) ACID(SYSLOGD)

    If /etc/rc is used to start the Syslog daemon, ensure that the _BPX_JOBNAME and BPX

    USERID environment variables are assigned a value of SYSLOGD.'
  checks:
  - type: command
    command: cat rc
    expected: ''
    severity: medium
    info: 'From the ISPF Command Shell enter:

