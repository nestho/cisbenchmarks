- id: '1.131'
  title: TSS0-OS-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS Session manager must properly configure wait time limits. GROUP ID: V-223999 RULE ID: SV-223999r958402'
  rationale: A session time-out lock is a temporary action taken when a user stops work and moves away from the immediate
    physical vicinity of the information system but does not log out because of the temporary nature of the absence. Rather
    than relying on the user to manually lock their operating system session prior to vacating the vicinity, operating systems
    need to be able to identify when a user's session has idled and take action to initiate the session lock. The session
    lock is implemented at the point where session activity can be determined and/or controlled.
  impact: ''
  references: []
  page_start: 287
  audit_raw: 'If the session manager in use initiates a session lock after a 15-minute period of

    inactivity for all connection types, this is not a finding.'
  remediation: 'Configure the session manager in use to initiate a session lock after a 15-minute period

    of inactivity for all connection types.'
  checks:
  - type: manual_review
    info: 'If the session manager in use initiates a session lock after a 15-minute period of

      inactivity for all connection types, this is not a finding.'
    severity: medium
- id: '1.132'
  title: TSS0-OS-000040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IBM z/OS BPX.SMF resource must be properly configured. GROUP ID: V-224000 RULE ID: SV-224000r958406'
  rationale: Remote access services, such as those providing remote access to network devices and information systems, which
    lack automated monitoring capabilities, increase risk and make remote user access management difficult at best. Remote
    access is access to DoD nonpublic information systems by an authorized user (or an information system) communicating through
    an external, non organizationcontrolled network. Remote access methods include, for example, dial-up, broadband, and wireless.
    Automated monitoring of remote access sessions allows organizations to detect cyberattacks and also ensure ongoing compliance
    with remote access policies by auditing connection activities of remote access capabilities, such as Remote Desktop Protocol
    (RDP), on a variety of information system components (e.g., servers, workstations, notebook computers, smartphones, and
    tablets).
  impact: ''
  references: []
  page_start: 288
  audit_raw: 'Review the FACILITY resource class for BPX.SMF.

    If the RACF rules are as follows, this is not a finding.

    BPX.SMF.119.94 - READ allowed for users running the ssh, sftp, or scp client

    commands.

    BPX.SMF.119.96 - READ allowed for users running the scp or sftp-server server

    commands.

    BPX.SMF.119.97 - READ allowed for users running the scp or sftp client commands.

    The following profile grants the permitted users the authority to write or test for any SMF

    record being recorded. Access should be permitted as follows:

    BPX.SMF - READ access only when documented and justified in Site Security Plan.

    Documentation should include a reason why a more specific profile is not acceptable.'
  remediation: 'Configure Facility resource class for BPX.SMF as follows:

    BPX.SMF.119.94 - READ allowed for users running the ssh, sftp, or scp client

    commands.

    BPX.SMF.119.96 - READ allowed for users running the scp or sftp-server server

    commands.

    BPX.SMF.119.97 - READ allowed for users running the scp or sftp client commands.

    The following profile grants the permitted users the authority to write or test for any SMF

    record being recorded. Access should be permitted as follows:

    BPX.SMF - READ access only when documented and justified in Site Security Plan.

    Documentation should include a reason why a more specific profile is not acceptable.'
