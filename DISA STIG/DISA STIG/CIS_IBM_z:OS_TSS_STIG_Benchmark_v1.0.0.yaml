- id: '1.11'
  title: TSS0-ES-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'IBM z/OS SYS1.PARMLIB must be properly protected. GROUP ID: V-223882 RULE ID: SV-223882r998484'
  rationale: 'Without the capability to restrict which roles and individuals can select which events are audited, unauthorized
    personnel may be able to prevent the auditing of critical events. Misconfigured audits may degrade the system''s performance
    by overwhelming the audit log. Misconfigured audits may also make it more difficult to establish, correlate, and investigate
    the events relating to an incident or identify those responsible for one. Satisfies: SRG-OS-000063-GPOS-00032, SRG-OS-000080-GPOS-00048,
    SRG-OS000259-GPOS-00100, SRG-OS-000362-GPOS-00149, SRG-OS-000337-GPOS-00129, SRG-OS-000324-GPOS-00125'
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'Execute a data set list of access to SYS1.PARMLIB.

    If the ESM data set rules for SYS1.PARMLIB allow inappropriate (e.g., global READ)

    access, this is a finding.

    If data set rules for SYS1.PARMLIB do not restrict READ, WRITE or greater access to

    only systems programming personnel, this is a finding.

    If data set rules for SYS1.PARMLIB do not restrict READ and UPDATE access to only

    domain level security administrators, this is a finding.

    If data set rules for SYS1.PARMLIB do not restrict READ access to only system Level

    Started Tasks, authorized Data Center personnel, and auditors, this is a finding.

    If data set rules for SYS1.PARMLIB do not specify that all (i.e., failures and successes)

    WRITE or greater access will be logged, this is a finding.'
  remediation: Ensure the accesses are being logged.
  checks:
  - type: manual_review
    info: 'Execute a data set list of access to SYS1.PARMLIB.

      If the ESM data set rules for SYS1.PARMLIB allow inappropriate (e.g., global READ)

      access, this is a finding.

      If data set rules for SYS1.PARMLIB do not restrict READ, WRITE or greater access to

      only systems programming personnel, this is a finding.

      If data set rules for SYS1.PARMLIB do not restrict READ and UPDATE access to only

      domain level security administrators, this is a finding.

      If data set rules for SYS1.PARMLIB do not restrict READ acces'
    severity: medium
- id: '1.12'
  title: TSS0-ES-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS for PKI-based authentication must use ICSF or the ESM to store keys. GROUP ID: V-223883 RULE ID:
    SV-223883r998485'
  rationale: If the private key is discovered, an attacker can use the key to authenticate as an authorized user and gain
    access to the network infrastructure. The cornerstone of the PKI is the private key used to encrypt or digitally sign
    information. If the private key is stolen, this will lead to the compromise of the authentication and non-repudiation
    gained through PKI because the attacker can use the private key to digitally sign documents and pretend to be the authorized
    user. Both the holders of a digital certificate and the issuing authority must protect the computers, storage devices,
    or whatever they use to keep the private keys.
  impact: ''
  references: []
  page_start: 35
  audit_raw: 'Any keys or Certificates must be managed in ICSF or the external security manager and

    not in UNIX files.

    From the ISPF Command Shell enter:

    OMVS

    enter

