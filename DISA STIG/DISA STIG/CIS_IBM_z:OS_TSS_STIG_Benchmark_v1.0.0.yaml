  title: TSS0-ES-000140
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'IBM z/OS must use NIST FIPS-validated cryptography to protect passwords in the security database. GROUP ID:
    V-223887 RULE ID: SV-223887r998488'
  rationale: 'Passwords need to be protected at all times, and encryption is the standard method for protecting passwords.
    If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised. Satisfies: SRG-OS-000073-GPOS-00041,
    SRG-OS-000074-GPOS-00042'
  impact: ''
  references: []
  page_start: 41
  audit_raw: 'From the ISPF command shell line enter:

