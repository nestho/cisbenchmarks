- id: '1.106'
  title: TSS0-FT-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS startup parameters for the FTP server must have the INACTIVE statement properly set. GROUP ID: V-223981
    RULE ID: SV-223981r970703'
  rationale: Terminating an idle session within a short time period reduces the window of opportunity for unauthorized personnel
    to take control of a management session enabled on the console or console port that has been left unattended. In addition,
    quickly terminating an idle session will also free up resources committed by the managed network element. Terminating
    network connections associated with communications sessions includes, for example, de-allocating associated TCP/IP address/port
    pairs at the operating system level, and de-allocating networking assignments at the application level if multiple application
    sessions are using a single operating system-level network connection. This does not mean that the operating system terminates
    all sessions or network access; it only ends the inactive session and releases the resources associated with that session.
  impact: ''
  references: []
  page_start: 223
  audit_raw: 'Refer to the Profile configuration file specified on the PROFILE DD statement in the

    TCPIP started task JCL.

    If all the items below are true, this is not a finding.

    If any of the items below are untrue, this is a finding.

    The following items are in effect for the FTP daemon''s started task JCL:

    -The SYSTCPD and SYSFTPD DD statements specify the TCP/IP Data and FTP Data

    configuration files respectively.

    -The ANONYMOUS keyword is not coded on the PARM parameter on the EXEC

    statement.

    -The ANONYMOUS=logonid combination is not coded on the PARM parameter on the

    EXEC statement.

    -The INACTIVE keyword is not coded on the PARM parameter on the EXEC statement.

    The AUTOLOG statement block can be configured to have TCP/IP start the FTP

    Server. The FTP entry (e.g., FTPD) can include the PARMSTRING parameter to pass

    parameters to the FTP procedure when started.

    NOTE: Parameters passed on the PARMSTRING parameter override parameters

    specified in the FTP procedure.

    If an FTP entry is configured in the AUTOLOG statement block in the TCP/IP Profile

    configuration file, ensure the following items are in effect:

    -The ANONYMOUS keyword is not coded on the PARMSTRING parameter.

    -The ANONYMOUS=logonid combination is not coded on the PARMSTRING

    parameter.

    -The INACTIVE keyword is not coded on PARMSTRING parameter.'
  remediation: 'Review the FTP daemon''s started task JCL. Ensure that the ANONYMOUS and

    INACTIVE startup parameters are not specified and configuration file names are

    specified on the appropriate DD statements.

    The FTP daemon program can accept parameters in the JCL procedure that is used to

    start the daemon. The ANONYMOUS and ANONYMOUS= keywords are designed to

    allow anonymous FTP connections. The INACTIVE keyword is designed to set the

    timeout value for inactive connections. Control of these options is recommended

    through the configuration file statements rather than the startup parameters.

    The systems programmer responsible for supporting ICS will ensure that the startup

    parameters for the FTP daemon does not include the ANONYMOUS, ANONYMOUS=,

    or INACTIVE keywords.

    During initialization the FTP daemon searches multiple locations for the TCPIP.DATA

    and FTP.DATA files according to fixed sequences. In the daemon''s started task JCL,

    Data Definition (DD) statements will be used to specify the locations of the files. The

    SYSTCPD DD statement identifies the TCPIP.DATA file and the SYSFTPD DD

    statement identifies the FTP.DATA file.

    The systems programmer responsible for supporting ICS will ensure that the FTP

    daemon''s started task JCL specifies the SYSTCPD and SYSFTPD DD statements for

    configuration files.'
  checks:
  - type: manual_review
    info: 'Refer to the Profile configuration file specified on the PROFILE DD statement in the

      TCPIP started task JCL.

      If all the items below are true, this is not a finding.

      If any of the items below are untrue, this is a finding.

      The following items are in effect for the FTP daemon''s started task JCL:

      -The SYSTCPD and SYSFTPD DD statements specify the TCP/IP Data and FTP Data

      configuration files respectively.

      -The ANONYMOUS keyword is not coded on the PARM parameter on the EXEC

      statement.

      -The ANONYMOUS'
    severity: medium
- id: '1.107'
  title: TSS0-FT-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS FTP.DATA configuration statements for the FTP server must specify the Standard Mandatory DoD Notice
    and Consent Banner statement. GROUP ID: V-223982 RULE ID: SV-223982r958586'
  rationale: 'Display of a standardized and approved use notification before granting access to the publicly accessible operating
    system ensures privacy and security notification verbiage used is consistent with applicable federal laws, Executive Orders,
    directives, policies, regulations, standards, and guidance. System use notifications are required only for access via
    logon interfaces with human users and are not required when such human interfaces do not exist. The banner must be formatted
    in accordance with applicable DoD policy. Use the following verbiage for operating systems that can accommodate banners
    of 1300 characters: "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized
    use only. By using this IS (which includes any device attached to this IS), you consent to the following conditions: -The
    USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration
    testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence
    (CI) investigations. -At any time, the USG may inspect and seize data stored on this IS. -Communications using, or data
    stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed
    or used for any USGauthorized purpose. -This IS includes security measures (e.g., authentication and access controls)
    to protect USG interests--not for your personal benefit or privacy. -Notwithstanding the above, using this IS does not
    constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications,
    or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants.
    Such communications and work product are private and confidential. See User Agreement for details." Use the following
    verbiage for operating systems that have severe limitations on the number of characters that can be displayed in the banner:
    "I''ve read & consent to terms in IS user agreem''t."'
  impact: ''
  references: []
  page_start: 226
  audit_raw: 'Refer to the file specified on the SYSFTPD DD statement in the FTP started task JCL.

    If the BANNER statement is not coded or is commented out, this is a finding.'
  remediation: 'Code the FTPD configuration file to include the BANNER statement that points to the

    Standard Mandatory DoD Notice and Consent Banner statement.'
  checks:
  - type: manual_review
    info: 'Refer to the file specified on the SYSFTPD DD statement in the FTP started task JCL.

      If the BANNER statement is not coded or is commented out, this is a finding.'
    severity: medium
- id: '1.108'
  title: TSS0-FT-000120
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IBM z/OS TFTP server program must be properly protected. GROUP ID: V-223984 RULE ID: SV-223984r958804'
  rationale: Control of program execution is a mechanism used to prevent execution of unauthorized programs. Some operating
    systems may provide a capability that runs counter to the mission or provides users with functionality that exceeds mission
    requirements. This includes functions and services installed at the operating system level. Some of the programs, installed
    by default, may be harmful or may not be necessary to support essential organizational operations (e.g., key missions,
    functions). Removal of executable programs is not always possible; therefore, establishing a method of preventing program
    execution is critical to maintaining a secure system baseline. Methods for complying with this requirement include restricting
    execution of programs in certain environments, while preventing execution in other environments; or limiting execution
    of certain program functionality based on organization-defined criteria (e.g., privileges, subnets, sandboxed environments,
    or roles).
  impact: ''
  references: []
  page_start: 229
  audit_raw: 'From the ISPF Command Shell enter:

    TSS WHOOWNS PROGRAM(*)

    If the Program resources TFTPD and EZATD are owned appropriately in the

    PROGRAM resource class, this is not a finding.

    Enter

    TSS WHOHAS(TFTPD)

    TSS WHOHAS(EZATD)

    If no access to the program resources TFTPD and EZATD is permitted, this is not a

    finding.'
  remediation: 'Evaluate the impact of implementing the following change. Develop a plan of action and

    implement the change as required. Ensure that the EZATD program and its alias

    TFTPD are defined to CA-TSS and no access to the program resources TFTPD and

    EZATD is permitted. The following commands provide a sample of how to protect the

    TFTP server program by assigning ownership and no permissions: TSS ADD(ADMIN)

    PROGRAM(TFTPD,EZATD)'
  checks:
  - type: manual_review
    info: 'From the ISPF Command Shell enter:

      TSS WHOOWNS PROGRAM(*)

      If the Program resources TFTPD and EZATD are owned appropriately in the

      PROGRAM resource class, this is not a finding.

      Enter

      TSS WHOHAS(TFTPD)

      TSS WHOHAS(EZATD)

      If no access to the program resources TFTPD and EZATD is permitted, this is not a

      finding.'
    severity: medium
