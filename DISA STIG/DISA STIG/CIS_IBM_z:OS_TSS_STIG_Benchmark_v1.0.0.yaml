    \ (e.g., lpp) and mount points used by program\nproducts that may be in separate file systems.\n/var 1775 fff Dynamic\
    \ data used internally by products and by elements and\nfeatures of z/OS UNIX.\n SYSTEM FILE SECURITY SETTINGS\nFILE PERMISSION\
    \ BITS USER AUDIT BITS FUNCTION\n/bin/sh 1755 faf z/OS UNIX shell\n Note: /bin/sh has the sticky bit on to improve performance.\n\
