- id: '1.149'
  title: TSS0-OS-000220
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS must not allow nonexistent or inaccessible Link Pack Area (LPA) libraries. GROUP ID: V-224018 RULE
    ID: SV-224018r958804'
  rationale: Control of program execution is a mechanism used to prevent execution of unauthorized programs. Some operating
    systems may provide a capability that runs counter to the mission or provides users with functionality that exceeds mission
    requirements. This includes functions and services installed at the operating system level. Some of the programs, installed
    by default, may be harmful or may not be necessary to support essential organizational operations (e.g., key missions,
    functions). Removal of executable programs is not always possible; therefore, establishing a method of preventing program
    execution is critical to maintaining a secure system baseline. Methods for complying with this requirement include restricting
    execution of programs in certain environments, while preventing execution in other environments; or limiting execution
    of certain program functionality based on organization-defined criteria (e.g., privileges, subnets, sandboxed environments,
    or roles).
  impact: ''
  references: []
  page_start: 316
  audit_raw: 'From an ISPF Command line enter:

    TSO ISRDDN LPA

    Review the list.

    If there are any DUMMY entries, i.e., inaccessible LPA libraries, this is a finding.'
  remediation: 'Review all entries contained in the LPA members for the actual existence of each

    library. Develop a plan of action to correct deficiencies.

    The system Link Pack Area (LPA) is the component of MVS that maintains core

    operating system functions resident in main storage. A security concern exists when

    libraries from which LPA modules are obtained require APF authorization.

    Control over residence in the LPA is specified within the operating system in the

    following members of the data set SYS1.PARMLIB:

    • LPALSTxx specifies the names of libraries to be concatenated to SYS1.LPALIB

    when the LPA is generated at IPL in an MVS/XA or MVS/ESA system. (The xx is

    the suffix designated by the LPA parameter in the IEASYSxx member of

    SYS1.PARMLIB or overridden by the computer operator at system initial program

    load [IPL].)

    • IEAFIXxx specifies the names of modules from SYS1.SVCLIB, the LPALSTxx

    concatenation, and the LNKLSTxx concatenation that are to be temporarily fixed

    in central storage in the Fixed LPA (FLPA) for the duration of an IPL. (The xx is

    the suffix designated by the FIX parameter in the IEASYSxx member of

    SYS1.PARMLIB or overridden by the computer operator at IPL.)

    • IEALPAxx specifies the names of modules that will be loaded from the following:

    ? SYS1.SVCLIB

    ? The LPALSTxx concatenation

    ? The LNKLSTxx concatenation as a temporary extension to the existing Pageable

    LPA (PLPA) in the Modified LPA (MLPA) for the duration of an IPL. (The xx is the suffix

    designated by the MLPA parameter in the IEASYSxx member of SYS1.PARMLIB or

    overridden by the computer operator at IPL.)

    Use the following recommendations and techniques to control the exposures created by

    the LPA facility:

    -The LPALSTxx, IEAFIXxx, and IEALPAxx members will contain only required libraries.

    On a semiannual basis, Software Support should review the volume serial numbers and

    verify them in accordance with the system catalog. Software Support will remove all

    non-existent libraries. The ISSO should modify and/or delete the rules associated with

    these libraries.'
  checks:
  - type: manual_review
    info: 'From an ISPF Command line enter:

      TSO ISRDDN LPA

      Review the list.

      If there are any DUMMY entries, i.e., inaccessible LPA libraries, this is a finding.'
    severity: medium
- id: '1.150'
  title: TSS0-OS-000225
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS must not allow nonexistent or inaccessible LINKLIST libraries. GROUP ID: V-224019 RULE ID: SV-224019r958804'
  rationale: Control of program execution is a mechanism used to prevent execution of unauthorized programs. Some operating
    systems may provide a capability that runs counter to the mission or provides users with functionality that exceeds mission
    requirements. This includes functions and services installed at the operating system level. Some of the programs, installed
    by default, may be harmful or may not be necessary to support essential organizational operations (e.g., key missions,
    functions). Removal of executable programs is not always possible; therefore, establishing a method of preventing program
    execution is critical to maintaining a secure system baseline. Methods for complying with this requirement include restricting
    execution of programs in certain environments, while preventing execution in other environments; or limiting execution
    of certain program functionality based on organization-defined criteria (e.g., privileges, subnets, sandboxed environments,
    or roles).
  impact: ''
  references: []
  page_start: 318
  audit_raw: 'From and ISPF Command line enter:

    TSO ISRDDN LINKLIST

    Review the list, if there are any DUMMY entries i.e., inaccessible LINKLIST libraries,

    this is a finding.'
  remediation: 'Review all entries contained in the LINKLIST for the actual existence of each library.

    Develop a plan of action to correct deficiencies.

    The Linklist is a default set of libraries that MVS searches for a specified program. This

    facility is used so that a user does not have to know the library names in which utility

    types of programs are stored. Control over membership in the Linklist is specified within

    the operating system. The data set SYS1.PARMLIB(LNKLSTxx) is used to specify the

    library names. (The xx is the suffix designated by the LNK parameter in the IEASYSxx

    member of SYS1.PARMLIB, or overridden by the computer operator at IPL.)

    Use the following recommendations and techniques to control the exposures created by

    the LINKLIST facility:

    441-1Avoid inclusion of sensitive libraries in the LNKLSTxx member unless absolutely

    required.

    -The LNKLSTxx and PROGxx (LNKLST entries) members will contain only required

    libraries. On a semiannual basis, Software Support should review the volume serial

    numbers, and should verify them in accordance with the system catalog. Software

    Support will remove all nonexistent libraries. The ISSO should modify and/or delete the

    rules associated with these libraries.'
  checks:
  - type: manual_review
    info: 'From and ISPF Command line enter:

      TSO ISRDDN LINKLIST

      Review the list, if there are any DUMMY entries i.e., inaccessible LINKLIST libraries,

      this is a finding.'
    severity: medium
- id: '1.151'
  title: TSS0-OS-000230
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'CA-TSS must be installed and properly configured. GROUP ID: V-224020 RULE ID: SV-224020r958796'
  rationale: Failure to provide logical access restrictions associated with changes to system configuration may have significant
    effects on the overall security of the system. When dealing with access restrictions pertaining to change control, it
    should be noted that any changes to the hardware, software, and/or firmware components of the operating system can have
    significant effects on the overall security of the system. Accordingly, only qualified and authorized individuals should
    be allowed to obtain access to operating system components for the purposes of initiating changes, including upgrades
    and modifications. Logical access restrictions include, for example, controls that restrict access to workflow automation,
    media libraries, abstract layers (e.g., changes implemented into third-party interfaces rather than directly into information
    systems), and change windows (e.g., changes occur only during specified times, making unauthorized changes easy to discover).
  impact: ''
  references: []
  page_start: 320
  audit_raw: 'Refer to the active tasks on the system. Use IBM SDSF or the system Log.

    If CA-TSS is active this is not a finding.'
  remediation: Ensure that CA-TSS is active on the system.
  checks:
  - type: manual_review
    info: 'Refer to the active tasks on the system. Use IBM SDSF or the system Log.

      If CA-TSS is active this is not a finding.'
    severity: medium
- id: '1.152'
  title: TSS0-OS-000240
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS SMF collection files (system MANx data sets or LOGSTREAM DASD) must have storage capacity to store
    at least one weeks worth of audit data. GROUP ID: V-224021 RULE ID: SV-224021r958752'
  rationale: In order to ensure operating systems have a sufficient storage capacity in which to write the audit logs, operating
    systems need to be able to allocate audit record storage capacity. The task of allocating audit record storage capacity
    is usually performed during initial installation of the operating system.
  impact: ''
  references: []
  page_start: 321
  audit_raw: 'Review the SMF dump procedure in there system.

    If the output data sets in the procedure have storage capacity to store at least one

    weeks'' worth of audit data, this is not a finding.'
  remediation: 'The system Link Pack Area (LPA) is the component of MVS that maintains core

    operating system functions resident in main storage. A security concern exists when

    libraries from which LPA modules are obtained require APF authorization.'
  checks:
  - type: manual_review
    info: 'Review the SMF dump procedure in there system.

      If the output data sets in the procedure have storage capacity to store at least one

      weeks'' worth of audit data, this is not a finding.'
    severity: medium
- id: '1.153'
  title: TSS0-OS-000250
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM z/OS System Administrators must develop an automated process to collect and retain SMF data. GROUP ID:
    V-224022 RULE ID: SV-224022r958754'
  rationale: Information stored in one location is vulnerable to accidental or incidental deletion or alteration. Off-loading
    is a common process in information systems with limited audit storage capacity.
  impact: ''
  references: []
  page_start: 322
  audit_raw: 'Ask the system administrator if there is an automated process is in place to collect and

    retain all SMF data produced on the system.

    If, based on the information provided, it can be determined that an automated process is

    in place to collect and retain all SMF data produced on the system, this is not a finding.

    If it cannot be determined this process exists and is being adhered to, this is a finding.'
  remediation: 'Ensure that an automated process is in place to collect SMF data.

    Review SMF data collection and retention processes. Develop processes that are

    automatically started to dump SMF collection files immediately upon their becoming full.

    To ensure that all SMF data is collected in a timely manner, and to reduce the risk of

    data loss, ensure that automated mechanisms are in place to collect and retain all SMF

    data produced on the system. Dump the SMF files (MANx) in systems based on the

    following guidelines:

    -Dump each SMF file as it fills up during the normal course of daily processing.

    -Dump all remaining SMF data at the end of each processing day.

    Establish a process using Audit logging.'
  checks:
  - type: manual_review
    info: 'Ask the system administrator if there is an automated process is in place to collect and

      retain all SMF data produced on the system.

      If, based on the information provided, it can be determined that an automated process is

      in place to collect and retain all SMF data produced on the system, this is not a finding.

      If it cannot be determined this process exists and is being adhered to, this is a finding.'
    severity: medium
- id: '1.154'
  title: TSS0-OS-000270
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IBM z/OS SNTP daemon (SNTPD) must be active. GROUP ID: V-224023 RULE ID: SV-224023r1038944'
  rationale: Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining
    the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating
    system events. Sources outside the configured acceptable allowance (drift) may be inaccurate. Synchronizing internal information
    system clocks provides uniformity of time stamps for information systems with multiple system clocks and systems connected
    over a network. Organizations should consider endpoints that may not have regular access to the authoritative time server
    (e.g., mobile, teleworking, and tactical endpoints).
  impact: ''
  references: []
  page_start: 324
  audit_raw: 'From UNIX System Services ISPF Shell, navigate to ribbon select tools.

    Select option 1 - Work with Processes.

    If SNTP Daemon (SNTPD) is not active, this is a finding.'
  remediation: 'Obtain a copy of this sample procedure from SEZAINST and store it in one of your

    PROCLIB concatenation data sets.

    Perform the following step to start SNTPD as a procedure:

    Invoke the procedure using the system operator start command. The following sample,

    SEZAINST(SNTPD), shows how to start SNTPD as a procedure:

    //*

    //* Sample procedure for the Simple Network Time Protocol (SNTP)

    //*

    //* z/OS Communications Server Version 1 Release 13

    //* SMP/E Distribution Name: SEZAINST(EZASNPRO)

    //*

    //* Copyright: Licensed Materials - Property of IBM

    //* 5650-ZOS

    //* Copyright IBM Corp. 2002, 2015

    //*

    //* Status: CSV2R2

    //*

    //SNTPD EXEC PGM=SNTPD,REGION=4096K,TIME=NOLIMIT,

    // PARM=''/ -d''

    //SYSPRINT DD SYSOUT=*,DCB=(RECFM=F,LRECL=132,BLKSIZE=132)

    //SYSIN DD DUMMY

    //SYSERR DD SYSOUT=*

    //SYSOUT DD SYSOUT=*,DCB=(RECFM=F,LRECL=132,BLKSIZE=132)

    //CEEDUMP DD SYSOUT=*

    //SYSABEND DD SYSOUT=*'
  checks:
  - type: manual_review
    info: 'From UNIX System Services ISPF Shell, navigate to ribbon select tools.

      Select option 1 - Work with Processes.

      If SNTP Daemon (SNTPD) is not active, this is a finding.'
    severity: medium
