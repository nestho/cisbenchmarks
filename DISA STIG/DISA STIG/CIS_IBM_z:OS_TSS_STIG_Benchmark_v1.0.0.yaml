  description: 'IBM z/OS FTP.DATA configuration for the FTP server must have the INACTIVE statement properly set. GROUP ID:
    V-223980 RULE ID: SV-223980r970703'
  rationale: Terminating an idle session within a short time period reduces the window of opportunity for unauthorized personnel
    to take control of a management session enabled on the console or console port that has been left unattended. In addition,
    quickly terminating an idle session will also free up resources committed by the managed network element.
  impact: ''
