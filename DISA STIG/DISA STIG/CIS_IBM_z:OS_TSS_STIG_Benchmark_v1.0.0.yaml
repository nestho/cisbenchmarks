    \ z/OS UNIX environment\n/etc/steplib 740 faf List of MVS data sets valid for set user ID and set\ngroup ID executables\n\
    /etc/table name 740 faf List of z/OS userids and group names with\ncorresponding alias names\n/usr/lib/cron/at.allow\n\
