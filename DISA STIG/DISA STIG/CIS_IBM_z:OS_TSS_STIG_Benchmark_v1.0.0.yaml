- id: '1.157'
  title: TSS0-OS-000300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The IBM z/OS Policy Agent must contain a policy that protects against or limits the effects of denial-of-service
    (DoS) attacks by ensuring IBM z/OS is implementing ratelimiting measures on impacted network interfaces. GROUP ID: V-224026
    RULE ID: SV-224026r958902'
  rationale: DoS is a condition when a resource is not available for legitimate users. When this occurs, the organization
    either cannot accomplish its mission or must operate at degraded capacity. This requirement addresses the configuration
    of the operating system to mitigate the impact of DoS attacks that have occurred or are ongoing on system availability.
    For each system, known and potential DoS attacks must be identified and solutions for each type implemented. A variety
    of technologies exist to limit or, in some cases, eliminate the effects of DoS attacks (e.g., limiting processes or establishing
    memory partitions). Employing increased capacity and bandwidth, combined with service redundancy, may reduce the susceptibility
    to some DoS attacks.
  impact: ''
  references: []
  page_start: 329
  audit_raw: 'Examine the "Policy Agent" policy statements.

    If it can be determined that the policy that protects against or limits the effects of denialof-service (DoS) attacks
    by ensuring the operating system is implementing rate-limiting

    measures on impacted network interfaces, this is not a finding.'
  remediation: 'Develop "Policy Agent" statements to protect against or limit the effects of denial-ofservice (DoS) attacks
    by ensuring the operating system is implementing rate-limiting

    measures on impacted network interfaces.'
  checks:
  - type: manual_review
    info: 'Examine the "Policy Agent" policy statements.

