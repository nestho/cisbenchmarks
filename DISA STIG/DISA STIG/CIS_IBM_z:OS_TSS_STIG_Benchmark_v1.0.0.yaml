    Examine SSH daemon configuration file.

    If the variables "Protocol 2,1" or "Protocol 1" are defined on a line without a leading

    comment, this is a finding.'
  remediation: Edit the sshd_config file and set the "Protocol" setting to "2".
  checks:
  - type: manual_review
