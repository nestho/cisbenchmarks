- id: '1.15'
  title: VCUI-80-000124
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter UI service must enable "STRICT_SERVLET_COMPLIANCE". GROUP ID: V-259118 RULE ID: SV-259118r961863'
  rationale: 'Strict Servlet Compliance forces Tomcat to adhere to standards specifications including but not limited to RFC2109.
    RFC2109 sets the standard for HTTP session management. This setting affects several other settings that primarily pertain
    to cookie headers, cookie values, and sessions. Cookies will be parsed for strict adherence to specifications. Note that
    changing a number of these default settings may break some systems, as some browsers are unable to correctly handle the
    cookie headers that result from a strict adherence to the specifications. This one setting changes the default values
    for the following settings: org.apache.catalina.core.ApplicationContext.GET_RESOURCE_REQUIRE_SLASH org.apache.catalina.core.ApplicationDispatcher.WRAP_SAME_OBJECT
    org.apache.catalina.core.StandardHostValve.ACCESS_SESSION org.apache.catalina.session.StandardSession.ACTIVITY_CHECK org.apache.catalina.session.StandardSession.LAST_ACCESS_AT_START
    org.apache.tomcat.util.http.ServerCookie.ALWAYS_ADD_EXPIRES org.apache.tomcat.util.http.ServerCookie.FWD_SLASH_IS_SEPARATOR
    org.apache.tomcat.util.http.ServerCookie.PRESERVE_COOKIE_HEADER org.apache.tomcat.util.http.ServerCookie.STRICT_NAMING
    The "resourceOnlyServlets" attribute of any Context element. The "tldValidation" attribute of any Context element. The
    "useRelativeRedirects" attribute of any Context element. The "xmlNamespaceAware" attribute of any Context element. The
    "xmlValidation" attribute of any Context element.'
  impact: ''
  references: []
  page_start: 44
  audit_raw: 'At the command line, run the following command:

    grep STRICT_SERVLET_COMPLIANCE /usr/lib/vmware-vsphereui/server/conf/catalina.properties

    Example result:

    org.apache.catalina.STRICT_SERVLET_COMPLIANCE=true

    If there are no results, or if the

    "org.apache.catalina.STRICT_SERVLET_COMPLIANCE" is not set to "true", this is a

    finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-vsphere-ui/server/conf/catalina.properties

    Add or change the following line:

    org.apache.catalina.STRICT_SERVLET_COMPLIANCE=true

    Restart the service with the following command:

    vmon-cli --restart vsphere-ui'
  checks:
  - type: command
    command: grep STRICT_SERVLET_COMPLIANCE /usr/lib/vmware-vsphereui/server/conf/catalina.properties
    expected: ''
    severity: medium
    info: 'At the command line, run the following command:

      grep STRICT_SERVLET_COMPLIANCE /usr/lib/vmware-vsphereui/server/conf/catalina.properties

      Example result:

      org.apache.catalina.STRICT_SERVLET_COMPLIANCE=true

      If there are no results, or if the

      "org.apache.catalina.STRICT_SERVLET_COMPLIANCE" is not set to "true", this is a

      finding.'
- id: '1.16'
  title: VCUI-80-000125
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter UI service must limit the amount of time that each Transmission Control Protocol (TCP) connection
    is kept alive. GROUP ID: V-259119 RULE ID: SV-259119r960735'
  rationale: Denial of service (DoS) is one threat against web servers. Many DoS attacks attempt to consume web server resources
    in such a way that no more resources are available to satisfy legitimate requests. In Tomcat, the "connectionTimeout"
    attribute sets the number of milliseconds the server will wait after accepting a connection for the request Uniform Resource
    Identifier (URI) line to be presented. This timeout will also be used when reading the request body (if any). This prevents
    idle sockets that are not sending HTTP requests from consuming system resources and potentially denying new connections.
  impact: ''
  references: []
  page_start: 46
  audit_raw: 'The connection timeout should not be disabled by setting it to "-1".

    At the command prompt, run the following command:

    xmllint --xpath "//Connector[@connectionTimeout = ''-1'']" /usr/lib/vmware-vsphereui/server/conf/server.xml

    Expected result:

    XPath set is empty

    If any connectors are returned, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-vsphere-ui/server/conf/server.xml

    Configure the <Connector> node with the value:

    connectionTimeout="300000"

    Restart the service with the following command:

    vmon-cli --restart vsphere-ui'
  checks:
  - type: manual_review
    info: 'The connection timeout should not be disabled by setting it to "-1".

      At the command prompt, run the following command:

      xmllint --xpath "//Connector[@connectionTimeout = ''-1'']" /usr/lib/vmware-vsphereui/server/conf/server.xml

      Expected result:

      XPath set is empty

      If any connectors are returned, this is a finding.'
    severity: medium
- id: '1.17'
  title: VCUI-80-000126
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter UI service must limit the number of times that each Transmission Control Protocol (TCP) connection
    is kept alive. GROUP ID: V-259120 RULE ID: SV-259120r960735'
  rationale: KeepAlive provides long lived HTTP sessions that allow multiple requests to be sent over the same connection.
    Enabling KeepAlive mitigates the effects of several types of denial-of-service attacks. An advantage of KeepAlive is the
    reduced latency in subsequent requests (no handshaking). However, a disadvantage is that server resources are not available
    to handle other requests while a connection is maintained between the server and the client. Tomcat can be configured
    to limit the number of subsequent requests that one client can submit to the server over an established connection. This
    limit helps provide a balance between the advantages of KeepAlive, while not allowing any one connection being held too
    long by any one client.
  impact: ''
  references: []
  page_start: 48
  audit_raw: 'The connection timeout should not be unlimited by setting it to "-1".

    At the command prompt, run the following command:

    xmllint --xpath "//Connector[@maxKeepAliveRequests = ''-1'']" /usr/lib/vmware-vsphereui/server/conf/server.xml

    Expected result:

    XPath set is empty

    If any connectors are returned, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-vsphere-ui/server/conf/server.xml

    Configure the <Connector> node with the value:

    maxKeepAliveRequests="100"

    Restart the service with the following command:

    vmon-cli --restart vsphere-ui'
  checks:
  - type: manual_review
    info: 'The connection timeout should not be unlimited by setting it to "-1".

      At the command prompt, run the following command:

      xmllint --xpath "//Connector[@maxKeepAliveRequests = ''-1'']" /usr/lib/vmware-vsphereui/server/conf/server.xml

      Expected result:

      XPath set is empty

      If any connectors are returned, this is a finding.'
    severity: medium
