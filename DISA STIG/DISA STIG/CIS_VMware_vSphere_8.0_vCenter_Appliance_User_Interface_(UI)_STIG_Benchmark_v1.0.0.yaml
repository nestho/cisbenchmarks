  title: VCUI-80-000134
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter UI service shutdown port must be disabled. GROUP ID: V-259124 RULE ID: SV-259124r960963'
  rationale: Tomcat by default listens on TCP port 8005 to accept shutdown requests. By connecting to this port and sending
    the SHUTDOWN command, all applications within Tomcat are halted. The shutdown port is not exposed to the network as it
    is bound to the loopback interface. Setting the port to "-1" in $CATALINA_BASE/conf/server.xml instructs Tomcat to not
    listen for the shutdown command.
