    1. Go to Settings >> Passwords & accounts >> Accounts for Owner.

    2. Tap "Add account".

    3. Verify that the action is not allowed.

    BYOAD:

    1. Go to Settings >> Passwords & accounts >> Work.

    2. Tap "Add account".

    3. Verify that the action is not allowed.

