    Mobile Hotspot must be enabled to enable Wi-Fi Sharing. If the AO has not approved

    Mobile Hotspot, and it has been disabled on the EMM console, no further action is

    needed.

    If Mobile Hotspot is being used, use the following procedure to disable Wi-Fi Sharing:

    On the EMM console:

    COBO:

    1. Open "Set user restrictions".

    2. Toggle "Disallow sharing admin configured Wi-Fi" to "ON".

    COPE:

    1. Open "Set user restrictions on parent".

    2. Toggle "Disallow sharing admin configured Wi-Fi" to "ON".'
  checks:
  - type: manual_review
