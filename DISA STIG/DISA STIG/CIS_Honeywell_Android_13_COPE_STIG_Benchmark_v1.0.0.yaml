    managed Honeywell Android 13 device, the device policy is not set to disable multiuser

    modes, this is a finding.'
  remediation: 'Configure the Honeywell Android 13 device to disable multiuser modes.

    On the EMM console:

    COBO, COPE, and BYOAD:

    1. Open "User restrictions".

    2. Open "Set user restrictions".

    3. Toggle "Disallow modify accounts" to "ON".

    Note: This only applies to the work profile for BYOAD. A user can modify accounts in

    the personal profile.'
