  title: HONW-13-010400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Honeywell Android 13 work profile must be configured to disable automatic completion of workspace internet
    browser text input. GROUP ID: V-274420 RULE ID: SV-274420r1100830'
  rationale: 'The autofill functionality in the web browser allows the user to complete a form that contains sensitive information,
    such as personally identifiable information (PII), without previous knowledge of the information. By allowing the use
    of autofill functionality, an adversary who learns a user''s Android 13 device password, or who otherwise is able to unlock
