  audit_raw: 'Review device configuration settings to confirm the Honeywell Android device has the

    most recently released version of managed Honeywell Android 13 installed.

    This procedure is performed on both the EMM console and the managed Honeywell

    Android 13 device.

    In the EMM management console, review the version of Honeywell Android 13 installed

    on a sample of managed devices. This procedure will vary depending on the EMM

    product.

    On the managed Honeywell Android 13 device, to determine the installed operating

    system version:

    COBO and COPE:

    1. Open Settings.

    2. Tap "About phone".

    3. Verify "Build number".

    If the installed version of the Honeywell Android 13 operating system on any reviewed

    devices is not the latest released by Honeywell, this is a finding.'
  remediation: 'Install the latest released version of the Honeywell Android 13 operating system on all

    managed Honeywell devices.

    Note: Honeywell Android device operating system updates are released directly by

    Honeywell or can be distributed via the EMM. Check each device manufacturer and/or

    carriers for current updates.'
