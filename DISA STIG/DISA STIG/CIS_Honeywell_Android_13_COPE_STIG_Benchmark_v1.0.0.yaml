  description: 'Android 13 devices must have the latest available Honeywell Android 13 operating system installed. GROUP ID:
    V-274424 RULE ID: SV-274424r1100842'
  rationale: 'Required security features are not available in earlier operating system versions. In addition, earlier versions
    may have known vulnerabilities. SFR ID: FMT_SMF_EXT.1.1 #47'
  impact: ''
  references: []
