  title: HONW-13-008600
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Honeywell Android 13 must be configured to not allow backup of [all applications, configuration data] to remote
    systems. GROUP ID: V-274401 RULE ID: SV-274401r1100773'
  rationale: 'Backups to remote systems (including cloud backup) can leave data vulnerable to breach on the external systems,
    which often offer less protection than the mobile operating system. Where the remote backup involves a cloud-based solution,
    the backup capability is often used to synchronize data across multiple devices. In this case, DOD devices may synchronize
    DOD sensitive information to a user''s personal device or other unauthorized computers that are vulnerable to breach.
    Disallowing remote backup mitigates this risk. SFR ID: FMT_SMF_EXT.1.1 #40'
  impact: ''
  references: []
