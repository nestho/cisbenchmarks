- id: '1.33'
  title: HONW-13-010900
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Android 13 devices must be configured to disable the use of third-party keyboards. GROUP ID: V-274425 RULE
    ID: SV-274425r1100845'
  rationale: 'Many third-party keyboard applications are known to contain malware. SFR ID: FMT_SMF_EXT.1.1 #47'
  impact: ''
  references: []
  page_start: 84
  audit_raw: 'Review the managed Honeywell Android 13 configuration settings to confirm that no

    third-party keyboards are enabled.

    This procedure is performed on the EMM console.

    On the EMM console:

    COBO and COPE:

    1. Open "Input methods".

    2. Tap "Set input methods".

    3. Verify that only the approved keyboards are selected.

    If third-party keyboards are allowed, this is a finding.'
  remediation: 'Configure the Honeywell Android 13 device to disallow the use of third-party keyboards.

    On the EMM console:

    COBO and COPE:

    1. Open "Input methods".

    2. Tap "Set input methods".

    3. Select only the approved keyboard.

    Additionally, administrators can configure application allowlists for Honeywell Play that

    do not have any third-party keyboards for user installation.'
  checks:
  - type: manual_review
    info: 'Review the managed Honeywell Android 13 configuration settings to confirm that no

      third-party keyboards are enabled.

      This procedure is performed on the EMM console.

      On the EMM console:

      COBO and COPE:

      1. Open "Input methods".

      2. Tap "Set input methods".

      3. Verify that only the approved keyboards are selected.

      If third-party keyboards are allowed, this is a finding.'
    severity: medium
- id: '1.34'
  title: HONW-13-011000
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Android 13 devices must be configured to enable Common Criteria (CC) mode. GROUP ID: V-274426 RULE ID: SV-274426r1100862'
  rationale: 'The CC mode feature is a superset of other features and behavioral changes that are mandatory MDFPP requirements.
    If CC mode is not implemented, the device will not be operating in the NIAP-certified compliant CC mode of operation.
    CC mode implements the following behavioral/functional changes: How the Bluetooth and Wi-Fi keys are stored using different
    types of encryption. SFR ID: FMT_SMF_EXT.1.1 #47'
  impact: ''
  references: []
  page_start: 85
  audit_raw: 'Review the managed Honeywell Android 13 configuration settings to confirm CC mode

    is enabled.

    This procedure is performed on the EMM console.

    COBO and COPE:

    1. Open "Device owner management".

    2. Verify that "Enable Common Criteria mode" is toggled to "ON".

    If CC mode is not enabled, this is a finding.'
  remediation: 'Configure the Honeywell Android 13 device to implement CC mode.

    On the EMM console:

    COBO and COPE:

    1. Open "Device owner management".

    2. Toggle "Enable Common Criteria mode" to "ON".'
  checks:
  - type: manual_review
    info: 'Review the managed Honeywell Android 13 configuration settings to confirm CC mode

