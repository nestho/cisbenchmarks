  description: 'The Honeywell Android 13 work profile must be configured to enforce the system application disable list. GROUP
    ID: V-274418 RULE ID: SV-274418r1100824'
  rationale: 'The system application disable list controls user access to/execution of all core and preinstalled applications.
    Core application: Any application integrated into Honeywell Android 13 by Honeywell. Preinstalled application: Additional
    noncore applications included in the Honeywell Android 13 build by Honeywell or the wireless carrier. Some system applications
    can compromise DOD data or upload users'' information to non-DOD-approved servers. A user must be blocked from using such
    applications that exhibit behavior that can result in compromise of DOD data or DOD user information. The site administrator
