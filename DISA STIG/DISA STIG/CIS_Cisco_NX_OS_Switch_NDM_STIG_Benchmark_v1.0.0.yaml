    \ Each accounting record contains accounting\nattribute-value (AV) pairs and is stored on the AAA server.\nIf account\
    \ enabling is not automatically audited, this is a finding."
  remediation: 'Configure the switch to log account enabling using the following steps:

    Step 1: Configure the AAA servers as shown in the example below:

    SW1(config)# radius-server host 10.1.48.10

    SW1(config)# radius-server host 10.1.48.12

