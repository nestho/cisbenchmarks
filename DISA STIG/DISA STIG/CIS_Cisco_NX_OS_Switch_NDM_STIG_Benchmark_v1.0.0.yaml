controls:
- id: '1.1'
  title: CISC-ND-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to limit the number of concurrent management sessions to an organization-defined
    number. GROUP ID: V-220474 RULE ID: SV-220474r960735'
  rationale: Device management includes the ability to control the number of administrators and management sessions that manage
    a device. Limiting the number of allowed administrators and sessions per administrator based on account type, role, or
    access type is helpful in limiting risks related to DoS attacks. This requirement addresses concurrent sessions for administrative
    accounts and does not address concurrent sessions by a single administrator via multiple administrative accounts. The
    maximum number of concurrent sessions should be defined based upon mission needs and the operational environment for each
    system. At a minimum, limits must be set for SSH, HTTPS, account of last resort, and root account sessions.
  impact: ''
  references: []
  page_start: 11
  audit_raw: "Review the switch configuration to determine if concurrent management sessions are\nlimited as show in the example\
    \ below:\nline vty\n session-limit 2\nIf the switch is not configured to limit the number of concurrent management sessions,\n\
    this is a finding."
  remediation: 'Configure the switch to limit the number of concurrent management sessions to an

    organization-defined number as shown in the example below:

    SW4(config)# line vty

    SW4(config)# session-limit 2'
  checks:
  - type: sql
    command: 'show in the example below:'
    severity: medium
    info: "Review the switch configuration to determine if concurrent management sessions are\nlimited as show in the example\
      \ below:\nline vty\n session-limit 2\nIf the switch is not configured to limit the number of concurrent management sessions,\n\
      this is a finding."
- id: '1.2'
  title: CISC-ND-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to automatically audit account creation. GROUP ID: V-220475 RULE ID: SV-220475r960777'
  rationale: Upon gaining access to a network device, an attacker will often first attempt to create a persistent method of
    reestablishing access. One way to accomplish this is to create a new account. Notification of account creation helps to
    mitigate this risk. Auditing account creation provides the necessary reconciliation that account management procedures
    are being followed. Without this audit trail, personnel without the proper authorization may gain access to critical network
    nodes.
  impact: ''
  references: []
  page_start: 13
  audit_raw: "Review the switch configuration to determine if it automatically audits account creation.\nStep 1: Verify that\
    \ account records will be sent to an AAA server as shown in the\nexample below:\naaa accounting default group RADIUS_SERVERS\n\
    Step 2: Verify that the referenced group name has defined AAA servers that are online.\naaa group server radius RADIUS_SERVERS\n\
    \ server 10.1.48.10\n server 10.1.48.12\nNote: Cisco NX-OS devices report configuration activity to TACACS+ or RADIUS\n\
    servers in the form of accounting records. Each accounting record contains accounting\nattribute-value (AV) pairs and\
    \ is stored on the AAA server.\nIf account creation is not automatically audited, this is a finding."
  remediation: 'Configure the switch to log account creation using the following steps:

    Step 1: Configure the AAA servers as shown in the example below:

    SW1(config)# radius-server host 10.1.48.10

    SW1(config)# radius-server host 10.1.48.12

    Step 2: Configure an AAA server group as shown in the example below:

    SW1(config)# aaa group server radius RADIUS_SERVERS

    SW1(config-radius)# server 10.1.48.10

    SW1(config-radius)# server 10.1.48.12

    SW1(config-radius)# exit

    Step 3: Enable AAA accounting as shown in the example below:

    SW1(config)# aaa accounting default group RADIUS_SERVERS

    SW1(config)# end'
  checks:
  - type: manual_review
    info: "Review the switch configuration to determine if it automatically audits account creation.\nStep 1: Verify that\
      \ account records will be sent to an AAA server as shown in the\nexample below:\naaa accounting default group RADIUS_SERVERS\n\
      Step 2: Verify that the referenced group name has defined AAA servers that are online.\naaa group server radius RADIUS_SERVERS\n\
      \ server 10.1.48.10\n server 10.1.48.12\nNote: Cisco NX-OS devices report configuration activity to TACACS+ or RADIUS\n\
      servers in the form of accou"
    severity: medium
- id: '1.3'
  title: CISC-ND-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to automatically audit account modification. GROUP ID: V-220476 RULE ID:
    SV-220476r960780'
  rationale: Since the accounts in the network device are privileged or system-level accounts, account management is vital
    to the security of the network device. Account management by a designated authority ensures access to the network device
    is being controlled in a secure manner by granting access to only authorized personnel with the appropriate and necessary
    privileges. Auditing account modification along with an automatic notification to appropriate individuals will provide
    the necessary reconciliation that account management procedures are being followed. If modifications to management accounts
    are not audited, reconciliation of account management procedures cannot be tracked.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Review the switch configuration to determine if it automatically audits account

    modification.

    Step 1: Verify that account records will be sent to an AAA server as shown in the

    example below:

    aaa accounting default group RADIUS_SERVERS

    Step 2: Verify that the referenced group name has defined AAA servers that are online.

    aaa group server radius RADIUS_SERVERS

    server 10.1.48.10

    server 10.1.48.12

    Note: Cisco NX-OS devices report configuration activity to TACACS+ or RADIUS

    servers in the form of accounting records. Each accounting record contains accounting

    attribute-value (AV) pairs and is stored on the AAA server.

    If account modification is not automatically audited, this is a finding.'
  remediation: 'Configure the switch to log account modification using the following steps:

    Step 1: Configure the AAA servers as shown in the example below:

    SW1(config)# radius-server host 10.1.48.10

    SW1(config)# radius-server host 10.1.48.12

    Step 2: Configure an AAA server group as shown in the example below:

    SW1(config)# aaa group server radius RADIUS_SERVERS

    SW1(config-radius)# server 10.1.48.10

    SW1(config-radius)# server 10.1.48.12

    SW1(config-radius)# exit

    Step 3: Enable AAA accounting as shown in the example below:

    SW1(config)# aaa accounting default group RADIUS_SERVERS

    SW1(config)# end'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to determine if it automatically audits account

      modification.

      Step 1: Verify that account records will be sent to an AAA server as shown in the

      example below:

      aaa accounting default group RADIUS_SERVERS

      Step 2: Verify that the referenced group name has defined AAA servers that are online.

      aaa group server radius RADIUS_SERVERS

      server 10.1.48.10

      server 10.1.48.12

      Note: Cisco NX-OS devices report configuration activity to TACACS+ or RADIUS

      servers in the form of acc'
    severity: medium
