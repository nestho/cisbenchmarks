- id: '1.38'
  title: CISC-ND-001370
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco switch must be configured to use at least two authentication servers for the purpose of authenticating
    users prior to granting administrative access. GROUP ID: V-220513 RULE ID: SV-220513r961863'
  rationale: Centralized management of user accounts and authentication increases the administrative access to the switch.
    This control is particularly important protection against the insider threat. With robust centralized management, audit
    records for administrator account access to the organization's network devices can be more readily analyzed for trends
    and anomalies. The alternative method of defining administrator accounts on each device exposes the device configuration
    to remote access authentication attacks and system administrators with multiple authenticators for each network device.
  impact: ''
  references: []
  page_start: 87
  audit_raw: "Review the Cisco switch configuration to verify that the device is configured to use at\nleast two authentication\
    \ servers as primary source for authentication.\nStep 1: Verify that an AAA server group is configured for login authentication\
    \ for both inband and console access methods.\naaa authentication login default group RADIUS_SERVERS\naaa authentication\
    \ login console group RADIUS_SERVERS\nStep 2: Verify that at least two AAA servers have been defined for the server group\
    \ as\nshown in the example below:\nradius-server host 10.1.48.10 key 7 \"xxxxxx\"\nradius-server host 10.1.48.11 key 7\
    \ \"xxxxxx\"\nauthentication accounting\naaa group server radius RADIUS_SERVERS\n server 10.1.48.10\n server 10.1.48.11\n\
    If the Cisco switch is not configured to use at least two authentication servers for the\npurpose of authenticating users\
    \ prior to granting administrative access, this is a finding."
  remediation: 'Configure the Cisco switch to use at least two authentication servers as shown in the

    following example:

    Step 1: Define the authentication servers.

    SW1(config)# radius-server host 10.1.48.10 key xxxxxx

    SW1(config)# radius-server host 10.1.48.11 key xxxxxx

    Step 2: Configure the AAA group.

    SW1(config)# aaa group server radius RADIUS_SERVERS

    SW1(config-radius)# server 10.1.48.10

    SW1(config-radius)# server 10.1.48.11

    Step 3: Use the AAA servers for login authentication for both in-band and console

    access methods.

    SW1(config)# aaa authentication login default group RADIUS_SERVERS

    SW1(config)# aaa authentication login console group RADIUS_SERVERS'
  checks:
  - type: manual_review
    info: 'Review the Cisco switch configuration to verify that the device is configured to use at

      least two authentication servers as primary source for authentication.

      Step 1: Verify that an AAA server group is configured for login authentication for both inband and console access methods.

      aaa authentication login default group RADIUS_SERVERS

      aaa authentication login console group RADIUS_SERVERS

      Step 2: Verify that at least two AAA servers have been defined for the server group as

      shown in the example be'
    severity: medium
- id: '1.39'
  title: CISC-ND-001410
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to support organizational requirements to conduct backups of the configuration
    when changes occur. GROUP ID: V-220514 RULE ID: SV-220514r1069522'
  rationale: System-level information includes default and customized settings and security attributes, including ACLs that
    relate to the network device configuration, as well as software required for the execution and operation of the device.
    Information system backup is a critical step in ensuring system integrity and availability. If the system fails and there
    is no backup of the system-level information, a denial of service condition is possible for all who utilize this critical
    network component. This control requires the network device to support the organizational central backup process for system-level
    information associated with the network device. This function may be provided by the network device itself; however, the
    preferred best practice is a centralized backup rather than each network device performing discrete backups.
  impact: ''
  references: []
  page_start: 89
  audit_raw: "Review the Cisco switch configuration to verify that it is compliant with this requirement.\nThe example configuration\
    \ below will send the configuration to a SCP server when a\nconfiguration change occurs.\nevent manager applet BACKUP_CONFIG\n\
    \ event syslog pattern \"SYSLOG_CONFIG_I\"\n action 1 cli command \"copy startup-config scp://user@10.1.48.10/nxconfig.bak\"\
    \n action 2 syslog priority informational msg \"Configuration backup was\nexecuted\"\nIf the Cisco switch is not configured\
    \ to conduct backups of the configuration when\nchanges occur, this is a finding."
  remediation: 'Configure the Cisco switch to send the configuration to an SCP server when a

    configuration change occurs as shown in the example below:

    SW4(config)# event manager applet BACKUP_CONFIG

    SW4(config-applet)# event syslog pattern "SYSLOG_CONFIG_I"

    SW4(config-applet)# action 1 cli command "copy startup-config

    scp://user@10.1.48.10/nx-config.bak”

    SW4(config-applet)# action 2 syslog priority informational msg "Configuration

    backup was executed"

    SW4(config-applet)# end'
  checks:
  - type: manual_review
    info: "Review the Cisco switch configuration to verify that it is compliant with this requirement.\nThe example configuration\
      \ below will send the configuration to a SCP server when a\nconfiguration change occurs.\nevent manager applet BACKUP_CONFIG\n\
      \ event syslog pattern \"SYSLOG_CONFIG_I\"\n action 1 cli command \"copy startup-config scp://user@10.1.48.10/nxconfig.bak\"\
      \n action 2 syslog priority informational msg \"Configuration backup was\nexecuted\"\nIf the Cisco switch is not configured\
      \ to conduct backups of th"
    severity: medium
