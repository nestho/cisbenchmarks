    aaa group server radius RADIUS_SERVERS\n server 10.1.48.10\n server 10.1.48.12\nNote: Cisco NX-OS devices report configuration\
    \ activity to TACACS+ or RADIUS\nservers in the form of accounting records. Each accounting record contains accounting\n\
    attribute-value (AV) pairs and is stored on the AAA server.\nIf logging of administrator activity is not configured, this\
