- id: '1.19'
  title: CISC-ND-000720
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco switch must be configured to terminate all network connections associated with device management
    after five minutes of inactivity. GROUP ID: V-220493 RULE ID: SV-220493r961068'
  rationale: Terminating an idle session within a short time period reduces the window of opportunity for unauthorized personnel
    to take control of a management session enabled on the console or console port that has been left unattended. In addition,
    quickly terminating an idle session will also free up resources committed by the managed network element. Terminating
    network connections associated with communications sessions includes, for example, de-allocating associated TCP/IP address/port
    pairs at the operating system level, or de-allocating networking assignments at the application level if multiple application
    sessions are using a single, operating system-level network connection. This does not mean that the device terminates
    all sessions or network access; it only ends the inactive session and releases the resources associated with that session.
  impact: ''
  references: []
  page_start: 49
  audit_raw: "Review the Cisco switch configuration to verify that all network connections associated\nwith a device management\
    \ have an idle timeout value set to five minutes or less as\nshown in the following example:\nline console\n exec-timeout\
    \ 5\nline vty\n exec-timeout 5\nIf the Cisco switch is not configured to terminate all network connections associated\n\
    with a device management after five minutes of inactivity, this is a finding."
  remediation: 'Set the idle timeout value to five minutes or less on all configured login classes as

    shown in the example below:

    SW1(config)# line console

    SW1(config-console)# exec-timeout 5

    SW1(config-console)# exit

    SW1(config)# line vty

    SW1(config-line)# exec-timeout 5'
  checks:
  - type: manual_review
    info: "Review the Cisco switch configuration to verify that all network connections associated\nwith a device management\
      \ have an idle timeout value set to five minutes or less as\nshown in the following example:\nline console\n exec-timeout\
      \ 5\nline vty\n exec-timeout 5\nIf the Cisco switch is not configured to terminate all network connections associated\n\
      with a device management after five minutes of inactivity, this is a finding."
    severity: medium
- id: '1.20'
  title: CISC-ND-000880
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to automatically audit account enabling actions. GROUP ID: V-220494 RULE
    ID: SV-220494r961290'
  rationale: Once an attacker establishes initial access to a system, the attacker often attempts to create a persistent method
    of reestablishing access. One way to accomplish this is for the attacker to simply enable a new or disabled account. Notification
    of account enabling is one method for mitigating this risk. A comprehensive account management process will ensure an
    audit trail which documents the creation of application user accounts and notifies administrators and Information System
    Security Officers (ISSO). Such a process greatly reduces the risk that accounts will be surreptitiously created and provides
    logging that can be used for forensic purposes.
  impact: ''
  references: []
