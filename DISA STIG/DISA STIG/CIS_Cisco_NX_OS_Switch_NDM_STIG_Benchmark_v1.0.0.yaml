- id: '1.22'
  title: CISC-ND-000980
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to allocate audit record storage capacity in accordance with organization-defined
    audit record storage requirements. GROUP ID: V-220496 RULE ID: SV-220496r961392'
  rationale: In order to ensure network devices have a sufficient storage capacity in which to write the audit logs, they
    need to be able to allocate audit record storage capacity. The task of allocating audit record storage capacity is usually
    performed during initial device setup if it is modifiable. The value for the organization-defined audit record storage
    requirement will depend on the amount of storage available on the network device, the anticipated volume of logs, the
    frequency of transfer from the network device to centralized log servers, and other factors.
  impact: ''
  references: []
  page_start: 55
  audit_raw: 'Verify that the Cisco switch is configured with a logfile size. The configuration should

    look like the example below:

    logging logfile LOGFILE1 6 size nnnnn

    If the Cisco switch is not configured to allocate audit record storage capacity in

    accordance with organization-defined audit record storage requirements, this is a

    finding.'
  remediation: 'Configure the buffer size for logging as shown in the example below:

    SW2(config)# logging logfile LOGFILE1 6 size nnnnn'
  checks:
  - type: manual_review
    info: 'Verify that the Cisco switch is configured with a logfile size. The configuration should

