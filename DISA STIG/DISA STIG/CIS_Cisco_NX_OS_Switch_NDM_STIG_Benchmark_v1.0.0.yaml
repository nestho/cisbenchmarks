- id: '1.41'
  title: CISC-ND-001450
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco switch must be configured to send log data to at least two central log servers for the purpose of
    forwarding alerts to the administrators and the information system security officer (ISSO). GROUP ID: V-220516 RULE ID:
    SV-220516r961863'
  rationale: The aggregation of log data kept on a syslog server can be used to detect attacks and trigger an alert to the
    appropriate security personnel. The stored log data can used to detect weaknesses in security that enable the network
    IA team to find and address these weaknesses before breaches can occur. Reviewing these logs, whether before or after
    a security breach, are important in showing whether someone is an internal employee or an outside threat.
  impact: ''
  references: []
  page_start: 93
  audit_raw: 'Verify that the switch is configured to send logs to at least two syslog servers. The

    configuration should look similar to the example below:

    logging server 10.1.48.10 6

    logging server 10.1.48.11 6

    If the switch is not configured to send log data to the syslog servers, this is a finding.'
  remediation: 'Configure the switch to send log messages to the syslog servers as shown in the

    example below:

    SW4(config)# logging server 10.1.48.10 6

    SW4(config)# logging server 10.1.48.11 6'
  checks:
  - type: manual_review
    info: 'Verify that the switch is configured to send logs to at least two syslog servers. The

      configuration should look similar to the example below:

      logging server 10.1.48.10 6

      logging server 10.1.48.11 6

      If the switch is not configured to send log data to the syslog servers, this is a finding.'
    severity: medium
- id: '1.42'
  title: CISC-ND-001470
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco switch must be running an IOS release that is currently supported by Cisco Systems. GROUP ID: V-220517
    RULE ID: SV-220517r961863'
  rationale: Network devices running an unsupported operating system lack current security fixes required to mitigate the
    risks associated with recent vulnerabilities. Running a supported release also enables operations to maintain a stable
    and reliable network provided by improved quality of service and security features.
  impact: ''
  references: []
  page_start: 94
  audit_raw: 'Verify that the switch is in compliance with this requirement by having the switch

    administrator enter the following command: show version

    Verify that the release is still supported by Cisco. All releases supported by Cisco can

    be found on the following URL:

    www.cisco.com/c/en/us/support/ios-nx-os-software

    If the switch is not running a supported release, this is a finding.'
  remediation: Upgrade the switch to a supported release.
  checks:
  - type: sql
    command: show version
    severity: medium
    info: 'Verify that the switch is in compliance with this requirement by having the switch

      administrator enter the following command: show version

