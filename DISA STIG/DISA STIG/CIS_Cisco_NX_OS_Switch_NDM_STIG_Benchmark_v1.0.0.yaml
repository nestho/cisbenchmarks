- id: '1.10'
  title: CISC-ND-000290
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must produce audit records containing information to establish where the events occurred.
    GROUP ID: V-220484 RULE ID: SV-220484r1026067'
  rationale: In order to compile an accurate risk assessment and provide forensic analysis, it is essential for security personnel
    to know where events occurred, such as device hardware components, device software modules, session identifiers, filenames,
    host names, and functionality. Associating information about where the event occurred within the network device provides
    a means of investigating an attack; recognizing resource utilization or capacity thresholds; or identifying an improperly
    configured device.
  impact: ''
  references: []
  page_start: 31
  audit_raw: "Step 1: Review the deny statements in all ACLs to determine if the log parameter has\nbeen configured as shown\
    \ in the example below:\nip access-list extended BLOCK_INBOUND\n deny icmp any any log\nStep 2: Verify that the Optimized\
    \ Access-list Logging (OAL) has been configured.\nlogging ip access-list cache entries nnnn\nNote: Once OAL has been enabled,\
    \ the logged ACL hits can be viewed via the show\nlogging ip access-list cache command.\nIf the switch is not configured\
    \ with the log parameter after any deny statements to note\nwhere packets have been dropped via an ACL, this is a finding."
  remediation: 'Enable OAL as shown in the example below:

    SW1(config)# logging ip access-list cache entries nnnn

    Set the ''log'' parameter after any ''deny'' entries in the ACL as referenced in the check

    text above.'
  checks:
  - type: sql
    command: 'show

      logging ip access-list cache command.'
    severity: medium
    info: "Step 1: Review the deny statements in all ACLs to determine if the log parameter has\nbeen configured as shown\
      \ in the example below:\nip access-list extended BLOCK_INBOUND\n deny icmp any any log\nStep 2: Verify that the Optimized\
