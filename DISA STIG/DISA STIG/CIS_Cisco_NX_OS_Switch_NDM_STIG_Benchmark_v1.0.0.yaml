- id: '1.6'
  title: CISC-ND-000140
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to enforce approved authorizations for controlling the flow of management
    information within the device based on control policies. GROUP ID: V-220479 RULE ID: SV-220479r991956'
  rationale: A mechanism to detect and prevent unauthorized communication flow must be configured or provided as part of the
    system design. If management information flow is not enforced based on approved authorizations, the network device may
    become compromised. Information flow control regulates where management information is allowed to travel within a network
    device. The flow of all management information must be monitored and controlled so it does not introduce any unacceptable
    risk to the network device or data. Application-specific examples of enforcement occur in systems that employ rule sets
    or establish configuration settings that restrict information system services or messagefiltering capability based on
    message content (e.g., implementing key word searches or using document characteristics). Applications providing information
    flow control must be able to enforce approved authorizations for controlling the flow of management information within
    the system in accordance with applicable policy.
  impact: ''
  references: []
  page_start: 22
  audit_raw: "Review the Cisco switch configuration to verify that it is compliant with this requirement.\nStep 1: Verify\
    \ that the line vty has an ACL inbound applied as shown in the example\nbelow:\nline vty\n access-class MGMT_NET in\n\
    Step 2: Verify that the ACL permits only hosts from the management network to access\nthe switch.\nip access-list MGMT_NET\n\
    \ 10 permit ip 10.1.48.0/24 any\n 20 deny ip any any log\nNX-OS v8 and later example:\nStep 1: Verify that an ACL has\
    \ been applied to the management interface inbound as\nshown in the example below:\ninterface mgmt0\nip access-group MGMT_NET\
    \ in\nStep 2: Verify that the ACL permits only hosts from the management network to access\nthe switch.\nip access-list\
    \ MGMT_NET\n10 permit ip 10.1.48.0/24 any\n20 deny ip any any log\nIf the Cisco switch is not configured to enforce approved\
    \ authorizations for controlling\nthe flow of management information within the device based on control policies, this\
    \ is a\nfinding."
  remediation: 'Configure the Cisco switch to restrict management access to specific IP addresses as

    shown in the example below:

    SW1(config)# ip access-list MGMT_NET

    SW1(config-acl)# permit ip 10.1.48.0/24 any

    SW1(config-acl)# deny ip any any log

    SW1(config-acl)# exit

    SW1(config)# line vty

    SW1(config-line)# access-class MGMT_NET in

    SW1(config-acl)# end

    NX-OS v8 and later example:

    SW1(config)# ip access-list MGMT_NET

    SW1(config-acl)# permit ip 10.1.48.0/24 any

    SW1(config-acl)# deny ip any any log

    SW1(config-acl)# exit

    SW1(config)# interface mgmt0

    SW1(config-if)# ip access-group MGMT_NET in

    SW1(config-acl)# end'
  checks:
  - type: manual_review
    info: "Review the Cisco switch configuration to verify that it is compliant with this requirement.\nStep 1: Verify that\
      \ the line vty has an ACL inbound applied as shown in the example\nbelow:\nline vty\n access-class MGMT_NET in\nStep\
      \ 2: Verify that the ACL permits only hosts from the management network to access\nthe switch.\nip access-list MGMT_NET\n\
      \ 10 permit ip 10.1.48.0/24 any\n 20 deny ip any any log\nNX-OS v8 and later example:\nStep 1: Verify that an ACL has\
      \ been applied to the management interface inboun"
    severity: medium
- id: '1.7'
  title: CISC-ND-000150
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to enforce the limit of three consecutive invalid logon attempts, after
    which time it must disconnect the session. GROUP ID: V-220480 RULE ID: SV-220480r960840'
  rationale: By limiting the number of failed logon attempts, the risk of unauthorized system access via user password guessing,
    otherwise known as brute-forcing, is reduced.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'Review the Cisco switch configuration to verify that it enforces the limit of three

    consecutive invalid logon attempts as shown in the example below:

    ssh login-attempts 3

    If the Cisco switch is not configured to enforce the limit of three consecutive invalid

    logon attempts, this is a finding.

    NOTE: The NX-OS switch does not lock out the account, it disconnects the session.

    The AAA server will lock out the user account on three failed attempts.'
  remediation: 'Configure the Cisco switch to enforce the limit of three consecutive invalid logon

    attempts as shown in the example below:

    SW2(config)# ssh login-attempts 3'
  checks:
  - type: manual_review
    info: 'Review the Cisco switch configuration to verify that it enforces the limit of three

      consecutive invalid logon attempts as shown in the example below:

      ssh login-attempts 3

      If the Cisco switch is not configured to enforce the limit of three consecutive invalid

      logon attempts, this is a finding.

      NOTE: The NX-OS switch does not lock out the account, it disconnects the session.

      The AAA server will lock out the user account on three failed attempts.'
    severity: medium
