- id: '1.15'
  title: CISC-ND-000570
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to enforce password complexity by requiring that at least one uppercase
    character be used. GROUP ID: V-220489 RULE ID: SV-220489r1026157'
  rationale: Use of a complex passwords helps to increase the time and resources required to compromise the password. Password
    complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force
    attacks. Password complexity is one factor of several that determine how long it takes to crack a password. The more complex
    the password is, the greater the number of possible combinations that need to be tested before the password is compromised.
    Multifactor authentication (MFA) is required for all administrative and user accounts on network devices, except for an
    account of last resort and (where applicable) a root account. Passwords should only be used when MFA using PKI is not
    available, and for the account of last resort and root account.
  impact: ''
  references: []
  page_start: 41
  audit_raw: 'Password complexity is enabled by default. Review the Cisco switch configuration to

    verify that it is compliant with this requirement. The following command should not be

    found in the configuration:

    no password strength-check

    If the Cisco switch is not configured to enforce password complexity by requiring that at

    least one uppercase character be used, this is a finding.'
  remediation: 'Configure the Cisco switch to enforce password complexity by requiring that at least

    one uppercase character be used as shown in the example below:

    SW1(config)# password strength-check'
  checks:
  - type: manual_review
    info: 'Password complexity is enabled by default. Review the Cisco switch configuration to

      verify that it is compliant with this requirement. The following command should not be

      found in the configuration:

      no password strength-check

      If the Cisco switch is not configured to enforce password complexity by requiring that at

      least one uppercase character be used, this is a finding.'
    severity: medium
