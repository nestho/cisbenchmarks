  audit_raw: "Review the switch configuration to determine if it automatically audits account enabling.\nThe configuration\
    \ should look similar to the example below:\nStep 1: Verify that account records will be sent to an AAA server as shown\
    \ in the\nexample below:\naaa accounting default group RADIUS_SERVERS\nStep 2: Verify that the referenced group name has\
    \ defined AAA servers that are online.\naaa group server radius RADIUS_SERVERS\n server 10.1.48.10\n server 10.1.48.12\n\
