- id: '1.12'
  title: CISC-ND-000470
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco switch must be configured to prohibit the use of all unnecessary and nonsecure functions and services.
    GROUP ID: V-220486 RULE ID: SV-220486r1043177'
  rationale: Network devices are capable of providing a wide variety of functions and services. Some of the functions and
    services provided by default may not be necessary to support essential organizational operations. Additionally, it is
    sometimes convenient to provide multiple services from a single component (e.g., email and web services); however, doing
    so increases risk over limiting the services provided by any one component. To support the requirements and principles
    of least functionality, the network device must support the organizational requirements providing only essential capabilities
    and limiting the use of ports, protocols, and/or services to only those required, authorized, and approved. Some network
    devices have capabilities enabled by default; if these capabilities are not necessary, they must be disabled. If a particular
    capability is used, then it must be documented and approved.
  impact: ''
  references: []
  page_start: 35
  audit_raw: 'Verify that the switch does not have any unnecessary or non-secure ports, protocols

    and services enabled. For example, the following features such as telnet should never

    be enabled, while other features should only be enabled if required for operations.

    feature telnet

    feature dhcp

    feature wccp

    feature nxapi

    feature imp

    If any unnecessary or non-secure ports, protocols, or services are enabled, this is a

    finding.'
  remediation: 'Disable features that should not be enabled unless required for operations.

    SW2(config)# no feature telnet

    SW2(config)# no feature dhcp

    SW2(config)# no feature wccp

    SW2(config)# no feature nxapi

    SW2(config)# no feature imp

    Note: Telnet must always be disabled.'
  checks:
  - type: manual_review
    info: 'Verify that the switch does not have any unnecessary or non-secure ports, protocols

      and services enabled. For example, the following features such as telnet should never

      be enabled, while other features should only be enabled if required for operations.

      feature telnet

      feature dhcp

      feature wccp

      feature nxapi

      feature imp

      If any unnecessary or non-secure ports, protocols, or services are enabled, this is a

      finding.'
    severity: medium
- id: '1.13'
  title: CISC-ND-000490
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured with only one local account to be used as the account of last resort in
    the event the authentication server is unavailable. GROUP ID: V-220487 RULE ID: SV-220487r1051115'
  rationale: Authentication for administrative (privileged level) access to the device is required at all times. An account
    can be created on the device's local database for use when the authentication server is down or connectivity between the
    device and the authentication server is not operable. This account is referred to as the account of last resort since
    it is intended to be used as a last resort and when immediate administrative access is absolutely necessary. The account
    of last resort logon credentials must be stored in a sealed envelope and kept in a safe. The safe must be periodically
    audited to verify the envelope remains sealed. The signature of the auditor and the date of the audit should be added
    to the envelope as a record. An alternative to using a sealed envelope in a safe would be credential files, separated
    by technology, located in a secured location on a file server, with the files only accessible to those administrators
    authorized to use the accounts of last resort, and access to that location monitored by a central log server. Administrators
    should secure the credentials and disable the root account (if possible) when not needed for system administration functions.
  impact: ''
  references: []
  page_start: 37
  audit_raw: 'Step 1: Review the Cisco switch configuration to verify that a local account for last

    resort has been configured with a privilege level that will enable the administrator to

    troubleshoot connectivity to the authentication server.

    username xxxxxxxxxxxxx password 5

    $5$88SPgpAn$Q6/17o5U/5lz4dNL1iQZuj/1a0wcKdrk29ZH1HJsnF. role priv-9

    Step 2: Verify that the fallback to use local account has not been disabled as shown in

    the example below:

    no aaa authentication login default fallback error local

    Note: The fallback is enabled by default; hence the above command should not be seen

    in the configuration.

    If the Cisco switch is not configured with only one local account to be used as the

    account of last resort in the event the authentication server is unavailable, this is a

    finding.'
  remediation: 'Step 1: Configure a local account with the necessary privilege level to troubleshoot

    network outage and restore operations as shown in the following example:

    SW2(config)# switch(config)# username xxxxxxx password xxxxxx role priv-9

    Step 2: Configure the authentication to use an AAA server with the fallback to use the

    local account if the authentication server is not reachable as shown in the following

    example:

    SW2(config)# aaa authentication login default group RADIUS_SERVERS

    SW2(config)# aaa authentication login default fallback error local

    SW2(config)# end'
  checks:
  - type: manual_review
    info: 'Step 1: Review the Cisco switch configuration to verify that a local account for last

      resort has been configured with a privilege level that will enable the administrator to

      troubleshoot connectivity to the authentication server.

      username xxxxxxxxxxxxx password 5

      $5$88SPgpAn$Q6/17o5U/5lz4dNL1iQZuj/1a0wcKdrk29ZH1HJsnF. role priv-9

      Step 2: Verify that the fallback to use local account has not been disabled as shown in

      the example below:

      no aaa authentication login default fallback error local

      Note'
    severity: medium
- id: '1.14'
  title: CISC-ND-000530
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to implement replay-resistant authentication mechanisms for network access
    to privileged accounts. GROUP ID: V-220488 RULE ID: SV-220488r1026069'
  rationale: A replay attack may enable an unauthorized user to gain access to the application. Authentication sessions between
    the authenticator and the application validating the user credentials must not be vulnerable to a replay attack. An authentication
    process resists replay attacks if it is impractical to achieve a successful authentication by recording and replaying
    a previous authentication message.
  impact: ''
  references: []
