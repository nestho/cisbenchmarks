  title: CISC-ND-001200
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco switch must be configured to use FIPS-validated Keyed-Hash Message Authentication Code (HMAC) to
    protect the integrity of remote maintenance sessions. GROUP ID: V-220503 RULE ID: SV-220503r1026073'
  rationale: Unapproved mechanisms used for authentication to the cryptographic module are not verified; therefore, they cannot
    be relied upon to provide confidentiality or integrity, and DOD data may be compromised. Nonlocal maintenance and diagnostic
    activities are those activities conducted by individuals communicating through a network, either an external network (e.g.,
    the internet) or an internal network. Currently, HMAC is the only FIPS-approved algorithm for generating and verifying
    message/data authentication codes in accordance with FIPS 198-1. Products that are FIPS 140-2 validated will have an HMAC
    that meets specification; however, the option must be configured for use as the only message authentication code used
    for authentication to cryptographic modules. Separate requirements for configuring applications and protocols used by
    each application (e.g., SNMPv3, SSHv2, NTP, HTTPS, and other protocols and applications that require server/client authentication)
    are required to implement this requirement. Where SSH is used, the SSHv2 protocol suite is required because it includes
    Layer 7 protocols such as SCP and SFTP, which can be used for secure file transfers.
