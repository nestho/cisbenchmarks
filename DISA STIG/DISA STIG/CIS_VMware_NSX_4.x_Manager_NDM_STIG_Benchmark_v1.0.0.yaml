controls:
- id: '1.1'
  title: NMGR-4X-000007
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The NSX Manager must configure logging levels for services to ensure audit records are generated. GROUP ID:
    V-265289 RULE ID: SV-265289r994090'
  rationale: 'Without generating audit records specific to the security and mission needs of the organization, it would be
    difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for
    one. Audit records can be generated from various components within the network device (e.g., module or policy filter).
    Satisfies: SRG-APP-000027-NDM-000209, SRG-APP-000495-NDM-000318, SRGAPP-000499-NDM-000319, SRG-APP-000503-NDM-000320,
    SRG-APP-000504-NDM000321, SRG-APP-000505-NDM-000322, SRG-APP-000506-NDM-000323, SRG-APP000516-NDM-000334'
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'From an NSX Manager shell, run the following commands:

    get service async_replicator | find Logging

    get service auth | find Logging

    get service http | find Logging

    get service manager | find Logging

    get service telemetry | find Logging

    Expected result:

    Logging level: info

    If any service listed does not have logging level configured to "info", this is a finding.'
  remediation: 'From an NSX Manager shell, run the following commands:

    set service async_replicator logging-level info

    set service auth logging-level info

    set service http logging-level info

    set service manager logging-level info

    set service telemetry logging-level info'
  checks:
  - type: manual_review
    info: 'From an NSX Manager shell, run the following commands:

      get service async_replicator | find Logging

      get service auth | find Logging

      get service http | find Logging

      get service manager | find Logging

      get service telemetry | find Logging

      Expected result:

      Logging level: info

      If any service listed does not have logging level configured to "info", this is a finding.'
    severity: medium
- id: '1.2'
  title: NMGR-4X-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The NSX Manager must assign users/accounts to organization-defined roles configured with approved authorizations.
    GROUP ID: V-265292 RULE ID: SV-265292r994099'
  rationale: 'The lack of authorization-based access control could result in the immediate compromise and unauthorized access
    to sensitive information. Users must be assigned to roles which are configured with approved authorizations and access
    permissions. The NSX Manager must be configured granularly based on organization requirements to only allow authorized
    administrators to execute privileged functions. Role assignments should control which administrators can view or change
    the device configuration, system files, and locally stored audit information. Satisfies: SRG-APP-000033-NDM-000212, SRG-APP-000038-NDM-000213,
    SRGAPP-000119-NDM-000236, SRG-APP-000120-NDM-000237, SRG-APP-000133-NDM000244, SRG-APP-000231-NDM-000271, SRG-APP-000329-NDM-000287,
    SRG-APP000340-NDM-000288, SRG-APP-000378-NDM-000302, SRG-APP-000380-NDM000304, SRG-APP-000408-NDM-000314, SRG-APP-000516-NDM-000335'
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'From the NSX Manager web interface, go to System >> Settings >> User Management

    >> User Role Assignment.

    View each user and group and verify the role assigned has authorization limits as

    appropriate to the role and in accordance with the site''s documentation.

    If any user/group or service account are assigned to roles with privileges that are

    beyond those required and authorized by the organization, this is a finding.'
  remediation: 'To create a new role with reduced permissions, do the following:

    From the NSX Manager web interface, go to System >> Settings >> User Management

    >> Roles.

    Click "Add Role", provide a name and the required permissions, and then click "Save".

    To update user or group permissions to an existing role with reduced permissions, do

    the following:

    From the NSX Manager web interface, go to System >> User Management >> User

    Role Assignment.

    Click the menu dropdown next to the target user or group and select "Edit".

    Remove the existing role, select the new one, and then click "Save".'
  checks:
  - type: manual_review
    info: 'From the NSX Manager web interface, go to System >> Settings >> User Management

      >> User Role Assignment.

      View each user and group and verify the role assigned has authorization limits as

      appropriate to the role and in accordance with the site''s documentation.

      If any user/group or service account are assigned to roles with privileges that are

      beyond those required and authorized by the organization, this is a finding.'
    severity: medium
- id: '1.3'
  title: NMGR-4X-000012
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The NSX Manager must be configured to enforce the limit of three consecutive invalid logon attempts, after
    which time it must block any login attempt for 15 minutes. GROUP ID: V-265293 RULE ID: SV-265293r994102'
  rationale: By limiting the number of failed login attempts, the risk of unauthorized system access via user password guessing,
    otherwise known as brute-forcing, is reduced.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'From an NSX Manager shell, run the following commands:

    get auth-policy api lockout-reset-period

    Expected result:

    900 seconds

    If the output does not match the expected result, this is a finding.

    get auth-policy api lockout-period

    Expected result:

    900 seconds

    If the output does not match the expected result, this is a finding.

    get auth-policy api max-auth-failures

    Expected result:

    3

    If the output does not match the expected result, this is a finding.

    get auth-policy cli lockout-period

    Expected result:

    900 seconds

    If the output does not match the expected result, this is a finding.

    get auth-policy cli max-auth-failures

    Expected result:

    3

    If the output does not match the expected result, this is a finding.'
  remediation: 'From an NSX Manager shell, run the following commands:

    set auth-policy api lockout-reset-period 900

    set auth-policy api lockout-period 900

    set auth-policy api max-auth-failures 3

    set auth-policy cli lockout-period 900

    set auth-policy cli max-auth-failures 3'
  checks:
  - type: manual_review
    info: 'From an NSX Manager shell, run the following commands:

      get auth-policy api lockout-reset-period

      Expected result:

      900 seconds

      If the output does not match the expected result, this is a finding.

      get auth-policy api lockout-period

      Expected result:

      900 seconds

      If the output does not match the expected result, this is a finding.

      get auth-policy api max-auth-failures

      Expected result:

      3

      If the output does not match the expected result, this is a finding.

      get auth-policy cli lockout-period

      Expected res'
    severity: medium
- id: '1.4'
  title: NMGR-4X-000013
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The NSX Manager must display the Standard Mandatory DOD Notice and Consent Banner before granting access.
    GROUP ID: V-265294 RULE ID: SV-265294r994105'
  rationale: Display of the DOD-approved use notification before granting access to the network device ensures privacy and
    security notification verbiage used is consistent with applicable federal laws, Executive Orders, directives, policies,
    regulations, standards, and guidance. System use notifications are required only for access via logon interfaces with
    human users.
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'Determine if the network device is configured to present a DOD-approved banner that is

    formatted in accordance with DTM-08-060.

    From the NSX Manager web interface, go to System >> Settings >> General Settings

    >> User Interface.

    Review the Login Consent Settings.

    If the "Consent Message Description" does not contain the Standard Mandatory DOD

    Notice and Consent Banner verbiage, this is a finding.

    The Standard Mandatory DOD Notice and Consent Banner verbiage is as follows:

    "You are accessing a U.S. Government (USG) Information System (IS) that is provided

    for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent to the

    following conditions:

    -The USG routinely intercepts and monitors communications on this IS for purposes

    including, but not limited to, penetration testing, COMSEC monitoring, network

    operations and defense, personnel misconduct (PM), law enforcement (LE), and

    counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are subject to routine

    monitoring, interception, and search, and may be disclosed or used for any USGauthorized purpose.

    -This IS includes security measures (e.g., authentication and access controls) to protect

    USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI

    investigative searching or monitoring of the content of privileged communications, or

    work product, related to personal representation or services by attorneys,

    psychotherapists, or clergy, and their assistants. Such communications and work

    product are private and confidential. See User Agreement for details."'
  remediation: 'From the NSX Manager web interface, go to System >> Settings >> General Settings

    >> User Interface.

    Under Login Consent Settings click "Edit".

    Enter the banner language in the "Consent Message Description" text box, formatted in

    accordance with DTM-08-060, and click "Save".

    "You are accessing a U.S. Government (USG) Information System (IS) that is provided

    for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent to the

    following conditions:

    -The USG routinely intercepts and monitors communications on this IS for purposes

    including, but not limited to, penetration testing, COMSEC monitoring, network

    operations and defense, personnel misconduct (PM), law enforcement (LE), and

    counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are subject to routine

    monitoring, interception, and search, and may be disclosed or used for any USGauthorized purpose.

    -This IS includes security measures (e.g., authentication and access controls) to protect

    USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI

    investigative searching or monitoring of the content of privileged communications, or

    work product, related to personal representation or services by attorneys,

    psychotherapists, or clergy, and their assistants. Such communications and work

    product are private and confidential. See User Agreement for details."'
  checks:
  - type: manual_review
    info: 'Determine if the network device is configured to present a DOD-approved banner that is

      formatted in accordance with DTM-08-060.

      From the NSX Manager web interface, go to System >> Settings >> General Settings

      >> User Interface.

      Review the Login Consent Settings.

      If the "Consent Message Description" does not contain the Standard Mandatory DOD

      Notice and Consent Banner verbiage, this is a finding.

      The Standard Mandatory DOD Notice and Consent Banner verbiage is as follows:

      "You are accessing a U.S'
    severity: medium
- id: '1.5'
  title: NMGR-4X-000014
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The NSX Manager must retain the Standard Mandatory DOD Notice and Consent Banner on the screen until the administrator
    acknowledges the usage conditions and takes explicit actions to log on for further access. GROUP ID: V-265295 RULE ID:
    SV-265295r994108'
  rationale: The banner must be acknowledged by the administrator prior to the device allowing the administrator access to
    the network device. This provides assurance that the administrator has seen the message and accepted the conditions for
    access. If the consent banner is not acknowledged by the administrator, DOD will not be in compliance with system use
    notifications required by law. To establish acceptance of the network administration policy, a click-through banner at
    management session logon is required. The device must prevent further activity until the administrator executes a positive
    action to manifest agreement. In the case of CLI access using a terminal client, entering the username and password when
    the banner is presented is considered an explicit action of acknowledgement. Entering the username, viewing the banner,
    then entering the password is also acceptable.
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'From the NSX Manager web interface, go to System >> Settings >> General Settings

    >> User Interface.

    Review the Login Consent Settings.

    Verify "Login Consent" is not On.

    Verify "Require Explicit User Consent" is set to Yes.

    If the Standard Mandatory DOD Notice and Consent Banner is not retained on the

    screen until the administrator acknowledges the usage conditions and takes explicit

    actions to log on for further access, this is a finding.'
  remediation: 'From the NSX Manager web interface, go to System >> Settings >> General Settings

    >> User Interface.

    Under Login Consent Settings, click "Edit".

    Toggle "Login Consent" to On.

    Toggle "Require Explicit User Consent" to Yes.

    Note: The banner text is also entered; however, that is covered by NMGR-4X-000013.'
  checks:
  - type: manual_review
    info: 'From the NSX Manager web interface, go to System >> Settings >> General Settings

      >> User Interface.

      Review the Login Consent Settings.

      Verify "Login Consent" is not On.

      Verify "Require Explicit User Consent" is set to Yes.

      If the Standard Mandatory DOD Notice and Consent Banner is not retained on the

      screen until the administrator acknowledges the usage conditions and takes explicit

      actions to log on for further access, this is a finding.'
    severity: medium
- id: '1.6'
  title: NMGR-4X-000035
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The NSX Manager must be configured with only one local account to be used as the account of last resort in
    the event the authentication server is unavailable. GROUP ID: V-265313 RULE ID: SV-265313r1051115'
  rationale: Authentication for administrative (privileged level) access to the device is required at all times. An account
    can be created on the device's local database for use when the authentication server is down or connectivity between the
    device and the authentication server is not operable. This account is referred to as the account of last resort since
    it is intended to be used as a last resort and when immediate administrative access is absolutely necessary. The account
    of last resort logon credentials must be stored in a sealed envelope and kept in a safe. The safe must be periodically
    audited to verify the envelope remains sealed. The signature of the auditor and the date of the audit should be added
    to the envelope as a record. Administrators should secure the credentials and disable the root account (if possible) when
    not needed for system administration functions.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'From the NSX Manager web interface, go to the System >> Settings >> User

    Management >> Local Users and view the status column.

    If any local account other than the account of last resort are active, this is a finding.'
  remediation: 'From the NSX Manager web interface, go to the System >> Settings >> User

    Management >> Local Users.

    Select the menu drop down next to any local user on the list except for the "admin"

    account. Click modify and click "Deactivate User".'
  checks:
  - type: manual_review
    info: 'From the NSX Manager web interface, go to the System >> Settings >> User

      Management >> Local Users and view the status column.

      If any local account other than the account of last resort are active, this is a finding.'
    severity: medium
- id: '1.7'
  title: NMGR-4X-000038
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The NSX Manager must only enable TLS 1.2 or greater. GROUP ID: V-265315 RULE ID: SV-265315r994168'
  rationale: 'A replay attack may enable an unauthorized user to gain access to the application. Authentication sessions between
    the authenticator and the application validating the user credentials must not be vulnerable to a replay attack. Configuration
    of TLS on the NSX also ensures that passwords are not transmitted in the clear. TLS 1.0 and 1.1 are deprecated protocols
    with well-published shortcomings and vulnerabilities. TLS 1.2 or greater must be enabled on all interfaces and TLS 1.1
    and 1.0 disabled where supported. Satisfies: SRG-APP-000156-NDM-000250, SRG-APP-000172-NDM-000259'
  impact: ''
  references: []
  page_start: 22
