  title: NMGR-4X-000068
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The NSX Manager must record time stamps for audit records that can be mapped to Coordinated Universal Time
    (UTC). GROUP ID: V-265339 RULE ID: SV-265339r994240'
  rationale: If time stamps are not consistently applied and there is no common time reference, it is difficult to perform
    forensic analysis. Time stamps generated by the application include date and time. Time is commonly expressed in Coordinated
    Universal Time (UTC), a modern continuation of Greenwich Mean Time (GMT), or local time with an offset from UTC.
