    Note: If a maximum number of lowercase characters has been configured, a minimum

    will not be shown.'
  remediation: 'From an NSX Manager shell, run the following command:

    set password-complexity lower-chars -1

    Note: Negative numbers indicate a minimum number of characters.'
  checks:
  - type: manual_review
