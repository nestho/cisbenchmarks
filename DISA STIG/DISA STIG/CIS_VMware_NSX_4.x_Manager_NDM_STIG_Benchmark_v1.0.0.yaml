      get cli-timeout

      Expected result:

      300 seconds

      If the CLI timeout is not configured to 300 or less, this is a finding.'
    severity: medium
- id: '1.16'
  title: NMGR-4X-000067
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The NSX Manager must be configured to synchronize internal information system clocks using redundant authoritative
    time sources. GROUP ID: V-265338 RULE ID: SV-265338r994237'
  rationale: 'The loss of connectivity to a particular authoritative time source will result in the loss of time synchronization
    (free-run mode) and increasingly inaccurate time stamps on audit events and other functions. Multiple time sources provide
    redundancy by including a secondary source. Time synchronization is usually a hierarchy; clients synchronize time to a
    local source while that source synchronizes its time to a more accurate source. The network device must use an authoritative
    time server and/or be configured to use redundant authoritative time sources. DOD-approved solutions consist of a combination
    of a primary and secondary time source using a combination or multiple instances of the following: a time server designated
    for the appropriate DOD network (NIPRNet/SIPRNet); United States Naval Observatory (USNO) time servers; and/or the Global
    Positioning System (GPS). The secondary time source must be located in a different geographic region than the primary
    time source.'
  impact: ''
  references: []
  page_start: 41
  audit_raw: 'From the NSX Manager web interface, go to System >> Configuration >> Fabric >>

    Profiles >> Node Profiles.

    Click "All NSX Nodes" and verify the NTP servers listed.

    or

    From an NSX Manager shell, run the following command:

    get ntp-server

    If the output does not contain at least two authoritative time sources, this is a finding.

    If the output contains unknown or nonauthoritative time sources, this is a finding.'
  remediation: 'To configure a profile to apply NTP servers to all NSX Manager nodes, do the following:

    From the NSX Manager web interface, go to System >> Configuration >> Fabric >>

    Profiles >> Node Profiles.

    Click "All NSX Nodes" and then click "Edit".

    Under NTP servers, remove any unknown or nonauthoritative NTP servers, enter at

    least two authoritative servers, and then click "Save".

    or

    From an NSX Manager shell, run the following commands:

    del ntp-server

    set ntp-server'
  checks:
  - type: manual_review
    info: 'From the NSX Manager web interface, go to System >> Configuration >> Fabric >>

      Profiles >> Node Profiles.

      Click "All NSX Nodes" and verify the NTP servers listed.

      or

