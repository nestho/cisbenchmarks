- id: '1.8'
  title: NMGR-4X-000015
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The NSX Manager must be configured to integrate with an identity provider that supports multifactor authentication
    (MFA). GROUP ID: V-265296 RULE ID: SV-265296r994111'
  rationale: 'Common attacks against single-factor authentication are attacks on user passwords. These attacks include brute
    force password guessing, password spraying, and password credential stuffing. This requirement also supports nonrepudiation
    of actions taken by an administrator. This requirement ensures the NSX Manager is configured to use a centralized authentication
    services to authenticate users prior to granting administrative access. As of NSX 4.1 and vCenter 8.0 Update 2, NSX Manager
    administrator access can also be configured by connecting VMware NSX to the Workspace ONE Access Broker in VMware vCenter
    for federated identity. Refer to the NSX product documentation to configure this access option. Satisfies: SRG-APP-000080-NDM-000220,
    SRG-APP-000149-NDM-000247, SRGAPP-000516-NDM-000336'
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'From the NSX Manager web interface, go to System >> Settings >> Users Management

    >> Authentication Providers.

    Verify that the "VMware Identity Manager" and "OpenID Connect" tabs are configured.

    If NSX is not configured to integrate with an identity provider that supports MFA, this is a

    finding.'
  remediation: 'To configure NSX to integrate with VMware Identity Manager or Workspace ONE

    Access, as the authentication source, do the following:

    From the NSX Manager web interface, go to System >> Users and Roles >> VMware

    Identity Manager and click "Edit".

    If using an external load balancer for the NSX Management cluster, enable "External

    Load Balancer Integration". If using a cluster VIP, leave this disabled.

    Click the toggle button to enable "VMware Identity Manager Integration".

    Enter the VMware Identity Manager or Workspace ONE Access appliance name, OAuth

    Client ID, OAuth Client Secret, and certificate thumbprint as provided by the

    administrators.

    Enter the NSX Appliance FQDN. For a cluster, enter the load balancer FQDN or cluster

    VIP FQDN.

    Click "Save", import users and groups, and then assign them roles. (The users are not

    actually local and remain in the authentication/AAA server.)

    Note: As of NSX 4.1 and vCenter 8.0 Update 2, NSX Manager administrator access can

    also be configured by connecting VMware NSX to the Workspace ONE Access Broker

    in VMware vCenter for federated identity. Refer to the NSX product documentation to

    configure this access option.

    Ensure the identity provider administrators have configured the provider to support

    multi-factor authentication.'
  checks:
  - type: manual_review
    info: 'From the NSX Manager web interface, go to System >> Settings >> Users Management

      >> Authentication Providers.

      Verify that the "VMware Identity Manager" and "OpenID Connect" tabs are configured.

      If NSX is not configured to integrate with an identity provider that supports MFA, this is a

      finding.'
    severity: medium
- id: '1.9'
  title: NMGR-4X-000039
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The NSX Manager must enforce a minimum 15-character password length for local accounts. GROUP ID: V-265316
    RULE ID: SV-265316r994171'
  rationale: Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. Password length is one factor of several that helps to determine strength and how long it takes
    to crack a password. The shorter the password, the lower the number of possible combinations that need to be tested before
    the password is compromised. Use of more characters in a password helps to exponentially increase the time and/or resources
    required to compromise the password.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'From an NSX Manager shell, run the following command:

    get password-complexity

    If the minimum password length is not 15 or greater, this is a finding.'
  remediation: 'From an NSX Manager shell, run the following command:

    set password-complexity minimum-password-length 15'
  checks:
  - type: manual_review
    info: 'From an NSX Manager shell, run the following command:

      get password-complexity

      If the minimum password length is not 15 or greater, this is a finding.'
    severity: medium
- id: '1.10'
  title: NMGR-4X-000040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The NSX Manager must enforce password complexity by requiring that at least one uppercase character be used
    for local accounts. GROUP ID: V-265317 RULE ID: SV-265317r994174'
  rationale: Use of a complex passwords helps to increase the time and resources required to compromise the password. Password
    complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force
    attacks. Password complexity is one factor of several that determine how long it takes to crack a password. The more complex
    the password is, the greater the number of possible combinations that need to be tested before the password is compromised.
    Multifactor authentication (MFA) is required for all administrative and user accounts on network devices, except for an
    account of last resort and (where applicable) a root account. Passwords should only be used when MFA using public key
    infrastructure (PKI) is not available, and for the account of last resort and root account.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'From an NSX Manager shell, run the following command:

    get password-complexity

    If the minimum uppercase characters is not 1 or more, this is a finding.

    Note: If a maximum number of uppercase characters has been configured a minimum

    will not be shown.'
  remediation: 'From an NSX Manager shell, run the following command:

    set password-complexity upper-chars -1

    Note: Negative numbers indicate a minimum number of characters.'
  checks:
  - type: manual_review
    info: 'From an NSX Manager shell, run the following command:

      get password-complexity

      If the minimum uppercase characters is not 1 or more, this is a finding.

      Note: If a maximum number of uppercase characters has been configured a minimum

      will not be shown.'
    severity: medium
- id: '1.11'
  title: NMGR-4X-000041
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The NSX Manager must enforce password complexity by requiring that at least one lowercase character be used
    for local accounts. GROUP ID: V-265318 RULE ID: SV-265318r994177'
  rationale: Use of a complex password helps to increase the time and resources required to compromise the password. Password
    complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force
    attacks. Password complexity is one factor of several that determine how long it takes to crack a password. The more complex
    the password, the greater the number of possible combinations that need to be tested before the password is compromised.
    Multifactor authentication (MFA) is required for all administrative and user accounts on network devices, except for an
    account of last resort and (where applicable) a root account. Passwords should only be used when MFA using PKI is not
    available, and for the account of last resort and root account.
  impact: ''
  references: []
