- id: '1.26'
  title: NMGR-4X-000099
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The NSX Manager must enable the global FIPS compliance mode for load balancers. GROUP ID: V-265355 RULE ID:
    SV-265355r994288'
  rationale: If unsecured protocols (lacking cryptographic mechanisms) are used for load balancing, the contents of those
    sessions will be susceptible to eavesdropping, potentially putting sensitive data at risk of compromise.
  impact: ''
  references: []
  page_start: 57
  audit_raw: 'From the NSX Manager web interface, go to the Home >> Monitoring Dashboards >>

    Compliance Report.

    Review the compliance report for code 72024 with description load balancer FIPS

    global setting disabled.

    Note: This may also be checked via the API call GET https:///policy/api/v1/infra/globalconfig

    If the global FIPS setting is disabled for load balancers, this is a finding.'
  remediation: 'Execute the following API call using curl or another REST API client:

    PUT https:///policy/api/v1/infra/global-config

    Example request body:

    {

    "fips": {

    "lb_fips_enabled": true

    },

    "resource_type": "GlobalConfig",

    "_revision": 2

    }

    The global setting is used when the new load balancer instances are created. Changing

    the setting does not affect existing load balancer instances.

    To update existing load balancers to use this setting, do the following:

    From the NSX Manager web interface, go to the Networking >> Load Balancing and

    then click "Edit" on the target load balancer.

    In the attachment field, click the "X" to detach the load balancer from its current

    Gateway and click "Save".

    Edit the target load balancer again, reattach it to its Gateway, and then click "Save".

    Caution: Detaching a load balancer from the Tier-1 gateway results in a traffic

    interruption for the load balancer instance.'
  checks:
  - type: manual_review
    info: 'From the NSX Manager web interface, go to the Home >> Monitoring Dashboards >>

      Compliance Report.

      Review the compliance report for code 72024 with description load balancer FIPS

      global setting disabled.

      Note: This may also be checked via the API call GET https:///policy/api/v1/infra/globalconfig

      If the global FIPS setting is disabled for load balancers, this is a finding.'
    severity: medium
- id: '1.27'
  title: NMGR-4X-000102
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The NSX Manager must be configured as a cluster. GROUP ID: V-265358 RULE ID: SV-265358r994297'
  rationale: Failure in a known state can address safety or security in accordance with the mission needs of the organization.
    Failure to a known secure state helps prevent a loss of confidentiality, integrity, or availability in the event of a
    failure of the SDN controller. Preserving network element state information helps to facilitate continuous network operations
    minimal or no disruption to mission-essential workload processes and flows.
  impact: ''
  references: []
  page_start: 59
  audit_raw: 'From the NSX Manager web interface, go to System >> Configuration >> Appliances.

    Verify three NSX Managers are deployed, a VIP or external load balancer is configured,

    and the cluster is in a healthy state.

    If three NSX Managers are not deployed, a VIP or external load balancer is not

    configured, and the cluster is not in a healthy state, this is a finding.'
  remediation: 'To add additional NSX Manager appliances do the following:

    From the NSX Manager web interface, go to System >> Configuration >> Appliances,

    and then click "Add NSX Appliance".

    Supply the required information to add additional nodes as needed, up to three total.

    To configure NSX with a cluster VIP or external load balancer, do the following:

    From the NSX Manager web interface, go to System >> Configuration >> Appliances,

    and then click "Set Virtual IP", enter a VIP that is part of the same subnet as the other

    management nodes, and then click "Save".

    To configure NSX with an external load balancer, setup an external load balancer with

    the following requirements:

    • Configure the external load balancer to control traffic to the NSX Manager nodes.

    • Configure the external load balancer to use the round robin method and

    configure source persistence for the load balancer''s virtual IP.

    • Create or import a signed certificate and apply the same certificate to all the NSX

    Manager nodes. The certificate must have the FQDN of the virtual IP and each of

    the nodes in the SAN.

    Note: An external load balancer will not work with the NSX Manager VIP. Do not

    configure an NSX Manager VIP if using an external load balancer.

    If the cluster status is not in a healthy state, identify the degraded component on the

    appliance and troubleshoot the issue with the error information provided.'
  checks:
  - type: manual_review
    info: 'From the NSX Manager web interface, go to System >> Configuration >> Appliances.

      Verify three NSX Managers are deployed, a VIP or external load balancer is configured,

      and the cluster is in a healthy state.

      If three NSX Managers are not deployed, a VIP or external load balancer is not

      configured, and the cluster is not in a healthy state, this is a finding.'
    severity: medium
- id: '1.28'
  title: NMGR-4X-000103
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The NSX Managers must be deployed on separate physical hosts. GROUP ID: V-265359 RULE ID: SV-265359r994300'
  rationale: SDN relies heavily on control messages between a controller and the forwarding devices for network convergence.
    The controller uses node and link state discovery information to calculate and determine optimum pathing within the SDN
    network infrastructure based on application, business, and security policies. Operating in the proactive flow instantiation
    mode, the SDN controller populates forwarding tables to the SDN-aware forwarding devices. At times, the SDN controller
    must function in reactive flow instantiation mode; that is, when a forwarding device receives a packet for a flow not
    found in its forwarding table, it must send it to the controller to receive forwarding instructions. With total dependence
    on the SDN controller for determining forwarding decisions and path optimization within the SDN infrastructure for both
    proactive and reactive flow modes of operation, having a single point of failure is not acceptable. A controller failure
    with no failover backup leaves the network in an unmanaged state. Hence, it is imperative that the SDN controllers are
    deployed as clusters on separate physical hosts to guarantee high network availability.
  impact: ''
  references: []
  page_start: 61
  audit_raw: 'This check must be performed in vCenter.

    From the vSphere Client, go to Administration >> Hosts and Clusters >> Select the

    cluster where the NSX Managers are deployed >> Configure >> Configuration >>

    VM/Host Rules.

    If the NSX Manager cluster does not have rules applied to it that separate the nodes

    onto different physical hosts, this is a finding.'
  remediation: 'This fix must be performed in vCenter.

    From the vSphere Client, go to Administration >> Hosts and Clusters >> Select the

    cluster where the NSX Managers are deployed >> Configure >> Configuration >>

    VM/Host Rules.

    Click "Add" to create a new rule.

    Provide a name and select "Separate Virtual Machines" under Type.

    Add the three NSX Manager virtual machines to the list and click "OK".

