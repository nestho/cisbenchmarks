- id: '1.21'
  title: NMGR-4X-000093
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The NSX Manager must be configured to conduct backups on an organizationally defined schedule. GROUP ID: V-265350
    RULE ID: SV-265350r994273'
  rationale: 'Information system backup is a critical step in maintaining data assurance and availability. Information system
    and security-related documentation contains information pertaining to system configuration and security settings. If this
    information were not backed up, and a system failure were to occur, the security settings would be difficult to reconfigure
    quickly and accurately. Maintaining a backup of information system and security-related documentation provides for a quicker
    recovery time when system outages occur. This control requires the network device to support the organizational central
    backup process for user account information associated with the network device. This function may be provided by the network
    device itself; however, the preferred best practice is a centralized backup rather than each network device performing
    discrete backups. Satisfies: SRG-APP-000516-NDM-000341, SRG-APP-000516-NDM-000340'
  impact: ''
  references: []
  page_start: 50
  audit_raw: 'From the NSX Manager web interface, go to System >> Lifecycle Management >>

    Backup and Restore to view the backup configuration.

    If backup is not configured and scheduled on a recurring frequency, this is a finding.'
  remediation: 'To configure a backup destination, do the following:

    From the NSX Manager web interface, go to System >> Lifecycle Management >>

    Backup and Restore, and then click "Edit" next to SFTP Server.

    Enter the target SFTP server, Directory Path, Username, Password, SSH Fingerprint,

    and Passphrase, and then click "Save".

    To configure a backup schedule, do the following:

    From the NSX Manager web interface, go to System >> Lifecycle Management >>

    Backup and Restore, and then click "Edit" next to Schedule.

    Click the "Recurring Backup" toggle and configure an interval between backups.

    Enable "Detect NSX configuration change" to trigger backups on detection of

    configuration changes and specify an interval for detecting changes. Click "Save".'
  checks:
  - type: manual_review
    info: 'From the NSX Manager web interface, go to System >> Lifecycle Management >>

      Backup and Restore to view the backup configuration.

      If backup is not configured and scheduled on a recurring frequency, this is a finding.'
    severity: medium
- id: '1.22'
  title: NMGR-4X-000094
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The NSX Manager must obtain its public key certificates from an appropriate certificate policy through an
    approved service provider. GROUP ID: V-265351 RULE ID: SV-265351r994276'
  rationale: For user certificates, each organization obtains certificates from an approved, shared service provider, as required
    by Office of Management and Budget (OMB) policy. For federal agencies operating a legacy public key infrastructure cross-certified
    with the Federal Bridge Certification Authority at medium assurance or higher, this Certification Authority will suffice.
  impact: ''
  references: []
  page_start: 52
  audit_raw: 'NSX Manager uses a certificate for each manager and one for the cluster VIP. In some

    cases these are the same, but each node and cluster VIP certificate must be checked

    individually.

    Browse to the NSX Manager web interface for each node and cluster VIP and view the

    certificate and its issuer of the website.

    or

    From an NSX Manager shell, run the following commands:

    get certificate api

    get certificate cluster

    Save the output to a .cer file to examine.

    If the certificate the NSX Manager web interface or cluster is using is not issued by an

    approved certificate authority and is not currently valid, this is a finding.'
  remediation: 'Obtain a certificate or certificates signed by an approved certification authority.

    This can be done individually by generating CSRs through the NSX Manager web

    interface >> System >> Settings >> Certificates >> CSRs >> Generate CSR or outside

    of NSX if a common manager and cluster certificate is desired.

    Import the certificate(s) into NSX by doing the following:

    From the NSX Manager web interface, go to System >> Settings >> Certificates >>

    Certificates >> Import >> Import Certificate. Provide a name for the certificate and paste

    the certificates contents and key.

    Uncheck "Service Certificate" and click "Import".

    After import, note the ID of the certificate(s).

    Using curl or another REST API client, perform the following API calls and replace the

    certificate IDs noted in the previous steps.

    To replace a managers certificate: POST

    https:///api/v1/node/services/http?action=apply_certificate&certificate_id=e61c75373090-4149-b2b6-19915c20504f

    To replace the cluster certificate: POST https:///api/v1/cluster/apicertificate?action=set_cluster_certificate&certificate_id=d60c6a07-6e59-4873-8edb339bf75711ac

    Note: If an NSX Intelligence appliance is deployed with the NSX Manager cluster,

    update the NSX Manager node IP, certificate, and thumbprint information that is on the

    NSX Intelligence appliance. Refer to the VMware Knowledge Base article

    https://kb.vmware.com/s/article/78505 for more information.'
  checks:
  - type: manual_review
    info: 'NSX Manager uses a certificate for each manager and one for the cluster VIP. In some

      cases these are the same, but each node and cluster VIP certificate must be checked

