      TargetPort: 8081/TCP

      For Docker deployment:

      Determine the name of the Console container:

      docker ps|grep console

      For example, the Console'
- id: '1.2'
  title: CNTR-PC-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Access to Prisma Cloud Compute must be managed based on user need and least privileged using external identity
    providers for authentication and grouping to role-based assignments when possible. GROUP ID: V-253523 RULE ID: SV-253523r1043176'
  rationale: 'Integration with an organization''s existing identity management policies technologies reduces the threat of
    account compromise and misuse. Centralized authentication services provide additional functionality to fulfill security
    requirements: • Multifactor authentication. • Disabling users after a period of time. • Encrypted storage and transmission
    of secure information. • Secure authentication protocols such as LDAP over TLS or LDAPS using FIPS 140-2 approved encryption
    modules. • PKI-based authentication. Satisfies: SRG-APP-000023-CTR-000055, SRG-APP-000024-CTR-000060, SRG-APP000025-CTR-000065,
    SRG-APP-000033-CTR-000095, SRG-APP-000065-CTR000115, SRG-APP-000068-CTR-000120, SRG-APP-000069-CTR-000125, SRG-APP000149-CTR-000355,
    SRG-APP-000150-CTR-000360, SRG-APP-000151-CTR000365, SRG-APP-000152-CTR-000370, SRG-APP-000163-CTR-000395, SRG-APP000165-CTR-000405,
    SRG-APP-000170-CTR-000430, SRG-APP-000173-CTR000445, SRG-APP-000174-CTR-000450, SRG-APP-000291-CTR-000675, SRG-APP000292-CTR-000680,
    SRG-APP-000293-CTR-000685, SRG-APP-000294-CTR000690, SRG-APP-000317-CTR-000735, SRG-APP-000318-CTR-000740, SRG-APP000345-CTR-000785,
    SRG-APP-000397-CTR-000955'
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'Confirm the Prisma Cloud Console has been configured from SAML-based

    authentication.

    Navigate to Prisma Cloud Compute Console''s Manage >> Authentication >> Identity

    Providers tab.

    Verify SAML settings are "Enabled" and an identity provider has been configured.

    If SAML settings are not enabled and an identity provider has not been configured, this

    is a finding.'
  remediation: 'Configure Prisma Cloud Console for SAML-based authentication in which the SAML IdP

    enforces multifactor authentication (e.g., x509/smartcard authentication).

    Navigate to Prisma Cloud Compute Console''s Manage >> Authentication >> Identity

    Providers:

    • Click "Add provider".

    • For Protocol, select "SAML".

    • For Identity provider, select provider.

    • Configure the settings and click "Save".

    • SAML settings = Enabled

    •

    • Configure an SAML identity provider that enforces privileged account multifactor

    authentication for the Prisma Cloud Compute service provider.'
  checks:
  - type: manual_review
    info: 'Confirm the Prisma Cloud Console has been configured from SAML-based

      authentication.

      Navigate to Prisma Cloud Compute Console''s Manage >> Authentication >> Identity

      Providers tab.

      Verify SAML settings are "Enabled" and an identity provider has been configured.

      If SAML settings are not enabled and an identity provider has not been configured, this

      is a finding.'
    severity: medium
- id: '1.3'
  title: CNTR-PC-000120
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Users requiring access to Prisma Cloud Compute''s Credential Store must be assigned and accessed by the appropriate
    role holders. GROUP ID: V-253524 RULE ID: SV-253524r960792'
  rationale: 'The container platform keystore is used to store credentials that are used to build a trust between the container
    platform and an external source. This trust relationship is authorized by the organization. If a malicious user were to
    have access to the container platform keystore, two negative scenarios could develop: 1. Keys not approved could be introduced.
    2. Approved keys could be deleted, leading to the introduction of container images from sources the organization never
    approved. To thwart this threat, it is important to protect the container platform keystore and give access to only individuals
    and roles approved by the organization. Satisfies: SRG-APP-000033-CTR-000100, SRG-APP-000118-CTR-000240, SRG-APP000121-CTR-000255,
    SRG-APP-000133-CTR-000300, SRG-APP-000211-CTR000530, SRG-APP-000233-CTR-000585, SRG-APP-000340-CTR-000770, SRG-APP000380-CTR-000900'
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'Navigate to Prisma Cloud Compute Console''s >> Manage >> Authentication >> Users

    tab.

    Inspect the users'' role assignments:

    • Review role assigned to users. If role and/or the Collection assignment is

    incorrect, this is a finding.

    • If a user is not assigned a role, this is a finding.

    • Review users assigned the administrator role. If a user has the administrator role

    and does not require access, this is a finding.

    Navigate to Prisma Cloud Compute Console''s >> Manage >> Authentication >> Groups

    tab.

    (Only the Administrator, Operator Prisma Cloud Compute roles have the ability to

    create/modify policy that could affect runtime behaviors.)

    Inspect the groups'' role assignments:

    • If any users or groups are assigned the Auditor or higher role and do not require

    access to audit information, this is a finding.

    • If a group is not assigned a role, this is a finding.

    • If role and/or Collection assignment is incorrect, this is a finding.

    • Review groups assigned the Administrator or Operator role. If a group has the

    Administrator or Operator role and does not require access to Prisma Cloud

    Compute''s Credential Store, this is a finding.'
  remediation: 'Navigate to Prisma Cloud Compute Console''s >> Manage >> Authentication >> Users

    tab.

    • Set the users'' role assignments to the ones who have the authority to review the

    audit data.

    • Assign roles to all users and groups.

    • Assign administrator and operator roles only to the users requiring the rights to

    modify the Prisma Cloud Compute''s Credential Store.

    • Remove the Administrator or Operator role for users who do not require access.

    Navigate to Prisma Cloud Compute Console''s >> Manage >> Authentication >> Groups

    tab.

    • Set the groups'' role assignments to the ones who have the authority to review

    audit data.

    • Assign roles to all users and groups.

    • Set the groups'' Administrator and Operator role assignments to only to the

    groups requiring the rights to modify the Prisma Cloud Compute''s Credential

    Store.

    Adjust user, group, and Collection assignments to align with organizational policies.'
  checks:
  - type: manual_review
    info: 'Navigate to Prisma Cloud Compute Console''s >> Manage >> Authentication >> Users

      tab.

      Inspect the users'' role assignments:

      • Review role assigned to users. If role and/or the Collection assignment is

      incorrect, this is a finding.

      • If a user is not assigned a role, this is a finding.

      • Review users assigned the administrator role. If a user has the administrator role

      and does not require access, this is a finding.

      Navigate to Prisma Cloud Compute Console''s >> Manage >> Authentication >> Groups

      ta'
    severity: medium
- id: '1.4'
  title: CNTR-PC-000130
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Prisma Cloud Compute Collections must be used to partition views and enforce organizational-defined need-to-know
    access. GROUP ID: V-253525 RULE ID: SV-253525r960801'
  rationale: Prisma Cloud Compute Collections are used to scope rules to target specific resources in an environment, partition
    views, and enforce which views specific users and groups can access. Collections can control access to data on a need-to-know
    basis.
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'Navigate to Prisma Cloud Compute Console''s >> Manage >> Collections and Tags >>

    Collections tab.

    Review the Collections according to organizational policy.

    If no organizational-specific Collections are defined, this is a finding.'
  remediation: 'Navigate to Prisma Cloud Compute Console''s >> Manage >> Collections and Tags >>

    Collections tab.

    Create a collection:

    • Click "Add Collection".

    • Enter a name and description and then specify a filter to target specific

    resources.

    • Click "Save".'
  checks:
  - type: manual_review
    info: 'Navigate to Prisma Cloud Compute Console''s >> Manage >> Collections and Tags >>

      Collections tab.

      Review the Collections according to organizational policy.

      If no organizational-specific Collections are defined, this is a finding.'
    severity: medium
- id: '1.5'
  title: CNTR-PC-000140
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Prisma Cloud Compute Cloud Native Network Firewall (CNNF) automatically monitors layer 4 (TCP) intercontainer
    communications. Enforcement policies must be created. GROUP ID: V-253526 RULE ID: SV-253526r960804'
  rationale: 'Network segmentation and compartmentalization are important parts of a comprehensive defense-in-depth strategy.
    CNNF works as an east-west firewall for containers. It limits damage by preventing attackers from moving laterally through
    the environment when they have already compromised the perimeter. Satisfies: SRG-APP-000039-CTR-000110, SRG-APP-000384-CTR-000915'
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'Navigate to Prisma Cloud Compute Console''s >> Radars >> Settings.

    If Container network monitoring is disabled, this is a finding.

    If Host network monitoring is disabled, this is a finding.'
  remediation: 'Navigate to Prisma Cloud Compute Console''s >> Radars >> Settings.

    Set Container network monitoring to "enabled".

    Set Host network monitoring to "enabled".'
  checks:
  - type: manual_review
    info: 'Navigate to Prisma Cloud Compute Console''s >> Radars >> Settings.

      If Container network monitoring is disabled, this is a finding.

      If Host network monitoring is disabled, this is a finding.'
    severity: medium
- id: '1.6'
  title: CNTR-PC-000240
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Prisma Cloud Compute Defender must be deployed to containerization nodes that are to be monitored. GROUP ID:
    V-253527 RULE ID: SV-253527r960897'
  rationale: 'Container platforms distribute workloads across several nodes. The ability to uniquely identify an event within
    an environment is critical. Prisma Cloud Compute Container Runtime audits record the time, container, corresponding image,
    and node where the event occurred. Satisfies: SRG-APP-000097-CTR-000180, SRG-APP-000100-CTR-000200'
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'Navigate to Prisma Cloud Compute Console''s >> Manage >> Defenders >> Manage

    tab.

    Verify Prisma Cloud Compute Defenders have been deployed to all container runtime

    nodes to be monitored.

    Review the list of deployed Defenders. If a Defender is missing, this is a finding.'
  remediation: 'Navigate to Prisma Cloud Compute Console''s >> Manage >> Defenders >> Manage

    tab.

    Deploy Defender to containerization node:

    • Select the method of Defender deployment.

    • Configure the Defender policy.'
  checks:
  - type: manual_review
    info: 'Navigate to Prisma Cloud Compute Console''s >> Manage >> Defenders >> Manage

