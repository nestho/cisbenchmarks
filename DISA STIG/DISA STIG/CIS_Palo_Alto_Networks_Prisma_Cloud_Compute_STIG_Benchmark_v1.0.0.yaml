  title: CNTR-PC-000750
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Prisma Cloud Compute must be configured to require local user accounts to use x.509 multifactor authentication.
    GROUP ID: V-253539 RULE ID: SV-253539r1015787'
  rationale: 'Without the use of multifactor authentication, the ease of access to privileged functions is greatly increased.
    Multifactor authentication requires using two or more factors to achieve authentication. Factors include: (i) something
    a user knows (e.g., password/PIN); (ii) something a user has (e.g., cryptographic identification device, token); or (iii)
    something a user is (e.g., biometric). User access to Prisma Cloud Compute must use multifactor (x.509 based) authentication.
    Satisfies: SRG-APP-000177-CTR-000465, SRG-APP-000391-CTR-000935, SRG-APP000401-CTR-000965, SRG-APP-000402-CTR-000970,
