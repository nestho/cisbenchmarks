  description: 'Prisma Cloud Compute must run within a defined/separate namespace (e.g., Twistlock). GROUP ID: V-253547 RULE
    ID: SV-253547r961608'
  rationale: Namespaces are a key boundary for network policies, orchestrator access control restrictions, and other important
    security controls. Prisma Cloud Compute containers running within a separate and exclusive namespace will inherit the
    namespace's security features. Separating workloads into namespaces can help contain attacks and limit the impact of mistakes
    or destructive actions by authorized users.
  impact: ''
  references: []
