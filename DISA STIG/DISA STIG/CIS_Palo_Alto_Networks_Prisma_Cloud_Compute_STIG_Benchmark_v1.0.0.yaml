- id: '1.27'
  title: CNTR-PC-001390
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Prisma Cloud Compute must protect the confidentiality and integrity of transmitted information. GROUP ID:
    V-253548 RULE ID: SV-253548r961632'
  rationale: Without protection of the transmitted information, confidentiality and integrity may be compromised since unprotected
    communications can be intercepted and either read or altered. Communication paths outside the physical protection of a
    controlled boundary are exposed to the possibility of interception and modification. Protecting the confidentiality and
    integrity of organizational information can be accomplished by physical means (e.g., employing physical distribution systems)
    or by logical means (e.g., employing cryptographic techniques). If physical means of protection are employed, then logical
    means (cryptography) do not have to be employed, and vice versa.
  impact: ''
  references: []
  page_start: 78
