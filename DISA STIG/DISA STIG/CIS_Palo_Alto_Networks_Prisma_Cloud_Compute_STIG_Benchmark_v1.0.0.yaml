  rationale: When the secure WebSocket session between the Prisma Cloud Compute Console and Defenders is disconnected, the
    Defender will continually attempt to reestablish the session. Without reauthentication, unidentified or unknown devices
    may be introduced; thereby facilitating malicious activity. The Console must be configured to remove a Defender that has
    not established a connection in a specified period of days.
  impact: ''
