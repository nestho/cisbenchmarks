- id: '1.7'
  title: CNTR-PC-000260
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Prisma Cloud Compute must be configured for forensic data collection. GROUP ID: V-253528 RULE ID: SV-253528r960903'
  rationale: 'Prisma Cloud Compute correlates raw audit data to actionable security intelligence, enabling a more rapid and
    effective response to incidents. This reduces the manual, time-consuming task of correlating data. Prisma Cloud Forensics
    is a lightweight distributed data recorder that runs alongside all containers in the environment. Prisma Cloud continuously
    collects detailed runtime information to help incident response teams understand what happened before, during, and after
    a breach. Forensic data consists of additional supplemental runtime events that complement the data (audits) already captured
    by Prisma Cloud''s runtime sensors. It provides additional context when trying to identify the root cause of an incident.
    Satisfies: SRG-APP-000099-CTR-000190, SRG-APP-000409-CTR-000990'
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'Navigate to Prisma Cloud Compute Console''s >> Manage >> System >> Forensics tab.

    If "Forensics data collection" is disabled, this is a finding.'
  remediation: 'Navigate to Prisma Cloud Compute Console''s >> Manage >> System >> Forensics tab.

    Set "Forensics data collection" to "enabled".'
  checks:
  - type: manual_review
    info: 'Navigate to Prisma Cloud Compute Console''s >> Manage >> System >> Forensics tab.

      If "Forensics data collection" is disabled, this is a finding.'
    severity: medium
- id: '1.8'
  title: CNTR-PC-000290
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The configuration integrity of the container platform must be ensured and runtime policies must be configured.
    GROUP ID: V-253529 RULE ID: SV-253529r960909'
  rationale: 'Prisma Cloud Compute''s runtime defense is the set of features that provides both predictive and threat-based
    active protection for running containers. Consistent application of Prisma Cloud Compute runtime policies ensures the
    continual application of policies and the associated effects. Prisma Cloud Compute''s configurations must be monitored
    for configuration drift and addressed according to organizational policy. Satisfies: SRG-APP-000101-CTR-000205, SRG-APP-000384-CTR-000915,
    SRG-APP000447-CTR-001100, SRG-APP-000450-CTR-001105, SRG-APP-000507-CTR001295, SRG-APP-000508-CTR-001300'
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'Verify runtime policies are enabled.

    Navigate to Prisma Cloud Compute Console''s Defend >> Runtime.

    Select "Container policy".

    • If a rule does not exist, this is a finding.

    • If "Enable automatic runtime learning" is set to "off", this is a finding.

    • Click the three dots in the "Actions" column for the rule.

    • If the policy is disabled, this is a finding.

    • Click the Container runtime policy.

    • If the policy is not scoped to "All", this is a finding.

    Select the "App-Embedded policy" tab.

    • If a rule does not exist, this is a finding.

    • Click the three dots in the "Actions" column for rule "Default - alert on suspicious

    runtime behavior".

    • If the policy is disabled, this is a finding.

    • Click the "Default - alert on suspicious runtime behavior" policy row.

    • If the "Default - alert on suspicious runtime behavior" policy is not scoped to "All",

    this is a finding.

    Select the "Host policy" tab.

    • If a rule does not exist, this is a finding.

    • Click the three dots in the "Actions" column for the rule.

    • If the policy is disabled, this is a finding.

    • Click the Host runtime policy.

    • If the policy is not scoped to "All", this is a finding.'
  remediation: 'Enable runtime policies.

    Navigate to Prisma Cloud Compute Console''s Defend >> Runtime.

    Click the tab to be edited.

    To add policy (for Host or App-Embedded policy):

    • Click "Add rule".

    • Enter rule name.

    • Scope = All

    • Accept the defaults and click "Save".

    To enable policy:

    • Click the rule''s three-dot menu.

    • Set to "Enable".

    To change scope, click the rule row:

    • Change the policy scope to "All".

    • Click "Save".

    To add container policy:

    • Select the "Container policy" tab.

    • Set "Enable automatic runtime learning" to "On".

    To create a new runtime rule:

    • Click "Add rule".

    • Configure the following settings:

    • Enter rule name

    • Scope = All

    Select the "Anti-malware" tab.

    Set the following:

    • Prisma Cloud advanced threat protection = on

    • Kubernetes attacks = on

    • Suspicious queries to cloud provider APIs = on

    Select the "Process" tab.

    Set the following:

    Process monitoring = enabled

    Select the "Network" tab.

    Set the following:

    IP connectivity = enabled

    Select the "File system" tab.

    Set the following:

    • File system monitoring = enabled

    • Accept the defaults and click "Save".

    Select the "App-Embedded policy" tab.

    • Click the rule''s three-dot menu. Set to "Enable".

    • Click the rule name row.

    • Change the scope to "All".

    • Click "Save".

    Create a new runtime rule:

    • Click "add rule."

    • Enter rule name.

    • Scope = All

    • Accept the defaults and click "Save".

    Select the "Host policy" tab.

    • Click the rule''s three-dot menu. Set to "Enable".

    • Click the rule name row.

    • Change the scope to "All".

    • Click "Save".

    • Click "Add rule".

    • Enter rule name.

    • Scope = All

    • Select the "Activities" tab.

    • Set the following:

    • Host activity monitoring ="Enabled"

    • Docker commands = "On"

    • New sessions spawned by sshd = "On"

    • Commands run with sudo or su = "On"

    • Log activity from background apps = "On"

    • Track SSH events = "On"

    • Accept the defaults and click "Save".'
  checks:
  - type: manual_review
    info: 'Verify runtime policies are enabled.

      Navigate to Prisma Cloud Compute Console''s Defend >> Runtime.

      Select "Container policy".

      • If a rule does not exist, this is a finding.

      • If "Enable automatic runtime learning" is set to "off", this is a finding.

      • Click the three dots in the "Actions" column for the rule.

      • If the policy is disabled, this is a finding.

      • Click the Container runtime policy.

      • If the policy is not scoped to "All", this is a finding.

      Select the "App-Embedded policy" tab.

      • If a'
    severity: medium
- id: '1.9'
  title: CNTR-PC-000310
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Prisma Cloud Compute must be configured to send events to the hosts'' syslog. GROUP ID: V-253530 RULE ID:
    SV-253530r960918'
  rationale: 'Event log collection is critical in ensuring the security of a containerized environment due to the ephemeral
    nature of the workloads. In an environment that is continually in flux, audit logs must be properly collected and secured.
    Prisma Cloud Compute can be configured to send audit events to the host node''s syslog in RFC5424-compliant format. Satisfies:
    SRG-APP-000111-CTR-000220, SRG-APP-000181-CTR-000485, SRG-APP000358-CTR-000805, SRG-APP-000474-CTR-001180, SRG-APP-000516-CTR-000790'
  impact: ''
  references: []
  page_start: 36
  audit_raw: 'Navigate to Prisma Cloud Compute Console''s >> Manage >> Alerts >> Logging tab.

    If the Syslog setting is "disabled", this is a finding.

    Select the "Manage" tab.

    If no Alert Providers are configured, this is a finding.'
  remediation: 'Navigate to Prisma Cloud Compute Console''s >> Manage >> Alerts >> Logging tab.

    Set Syslog to "enabled".

    Select the "Manage" tab.

    Click "Add profile".

    Complete the form based on the organization. At a minimum, the following Alert triggers

    must be selected:

    • Host vulnerabilities.

    • Image vulnerabilities.

    Click "Save".'
  checks:
  - type: manual_review
    info: 'Navigate to Prisma Cloud Compute Console''s >> Manage >> Alerts >> Logging tab.

      If the Syslog setting is "disabled", this is a finding.

      Select the "Manage" tab.

      If no Alert Providers are configured, this is a finding.'
    severity: medium
