- id: '1.13'
  title: CNTR-PC-000500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Prisma Cloud Compute must use TCP ports above 1024. GROUP ID: V-253534 RULE ID: SV-253534r1043177'
  rationale: Privileged ports are ports below 1024 that require system privileges for their use. If containers are able to
    use these ports, the container must be run as a privileged user. The container platform must stop containers that try
    to map to these ports directly. Allowing nonprivileged ports to be mapped to the container-privileged port is the allowable
    method when a certain port is needed. Prisma Cloud Compute default TCP ports are 8083 (Console UI and API) and 8084 (Console-to-Defender
    communication). To use TCP ports below 1024, the Console would have to be configured to use privileged ports.
  impact: ''
  references: []
  page_start: 50
  audit_raw: 'For Kubernetes deployment:

    Query the ports used by the twistlock-console service:

    $ kubectl describe svc twistlock-console -n twistlock

    If any port number is below 1024, this is a finding.

    For Docker deployment:

    Determine the name of the Console container:

    docker ps|grep console

    For example, the Console container is: ad8b41a2fec9 ad8b41a2fec9

    twistlock/private:console_22_01_840

    Inspect the container''s PortBindings:

    docker inspect ad8b41a2fec9|grep PortBindings -A 20

    If the port is below 1024, this is a finding.'
  remediation: 'For Kubernetes deployment:

    Edit the deployment.apps/twistlock-console.

    Find the - name: TargetPorts below 1024.

    Change to port number above 1024.

    Save and exit the editing session. The Console will restart automatically.

    For Docker deployment:

    Modify the twistlock.cfg located in the extracted release tar directory.

    Change any port assignment below 1024 to above 1024:

    MANAGEMENT_PORT_HTTP=

    MANAGEMENT_PORT_HTTPS=8083

    COMMUNICATION_PORT=8084

    Redeploy the Console using the twistlock.sh script in the extracted release tar directory:

    $ sudo ./twisltock.sh -sy onebox'
  checks:
  - type: command
    command: docker ps|grep console && docker inspect ad8b41a2fec9|grep PortBindings -A 20
    expected: ''
    severity: medium
    info: 'For Kubernetes deployment:

      Query the ports used by the twistlock-console service:

      $ kubectl describe svc twistlock-console -n twistlock

      If any port number is below 1024, this is a finding.

      For Docker deployment:

      Determine the name of the Console container:

      docker ps|grep console

      For example, the Console container is: ad8b41a2fec9 ad8b41a2fec9

      twistlock/private:console_22_01_840

      Inspect the contain'
- id: '1.14'
  title: CNTR-PC-000510
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'All Prisma Cloud Compute users must have a unique, individual account. GROUP ID: V-253535 RULE ID: SV-253535r1051115'
  rationale: Prisma Cloud Compute does not have a default account. During installation, the installer creates an administrator.
    This account can be removed once other accounts have been added. To ensure accountability and prevent unauthenticated
    access, users must be identified and authenticated to prevent potential misuse and compromise of the system.
  impact: ''
  references: []
  page_start: 52
  audit_raw: 'Confirm there is only one "break glass" local administrative account.

    Navigate to Prisma Cloud Compute Console''s Manage >> Authentication >> Users tab.

    Only the administrative break glass account is allowed to have Authentication Method =

    Local.

    For all other accounts, Authentication Method = SAML.

    If any local account, except the administrative break glass account, has Authentication

    Method set to other than "SAML", this is a finding.'
  remediation: 'Navigate to Prisma Cloud Compute Console''s >> Manage >> Authentication >> Users

    tab.

    Ensure only the break glass administrator account is a "local" account.

    Delete all other local accounts and use the SAML identity provider for all authentication

    and authorization to the Prisma Cloud Compute Console.'
  checks:
  - type: manual_review
    info: 'Confirm there is only one "break glass" local administrative account.

      Navigate to Prisma Cloud Compute Console''s Manage >> Authentication >> Users tab.

      Only the administrative break glass account is allowed to have Authentication Method =

      Local.

      For all other accounts, Authentication Method = SAML.

      If any local account, except the administrative break glass account, has Authentication

      Method set to other than "SAML", this is a finding.'
    severity: medium
- id: '1.15'
  title: CNTR-PC-000530
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Prisma Cloud Compute Console must run as nonroot user (uid 2674). GROUP ID: V-253536 RULE ID: SV-253536r1051115'
  rationale: Containers not requiring root-level permissions must run as a unique user account. To ensure accountability and
    prevent unauthenticated access to containers, the user the container is using to execute must be uniquely identified and
    authenticated to prevent potential misuse and compromise of the system.
  impact: ''
  references: []
  page_start: 54
  audit_raw: 'Locate the node in which the Prisma Cloud Compute Console container is running.

    Determine the process owner for "app/server".

    Execute:

    ps -aux | grep "/app/server

    If the process is owned by root, this is a finding.'
  remediation: 'In the root directory of the extracted release tar file, modify the twistlock.cfg file''s line:

    RUN_CONSOLE_AS_ROOT=false

    For Kubernetes deployment, perform these additional steps:

    When generating the twistlock_console.yaml deployment file, supply the --run-as-user

    flag.

    Linux/twistcli console export kubernetes --service-type ClusterIP --

    run-as-user 2674

    Modify the resulting twistlock_console.yaml file to include fsGroup: 2674 within the

    Deployment pod specification''s securityContext:

    securityContext: fsGroup: 2674

    Add runAsGroup: 2674 to the container specification''s securityContext:

    securityContext: runAsUser: 2674

    runAsGroup: 2674'
  checks:
  - type: command
    command: ps -aux | grep "/app/server
    expected: ''
    severity: medium
    info: 'Locate the node in which the Prisma Cloud Compute Console container is running.

      Determine the process owner for "app/server".

      Execute:

      ps -aux | grep "/app/server

      If the process is owned by root, this is a finding.'
