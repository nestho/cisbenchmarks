  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The macOS system must set smart card certificate trust to moderate. GROUP ID: V-268471 RULE ID: SV-268471r1034353'
  rationale: 'The macOS system must be configured to block access to users who are no longer authorized (i.e., users with
    revoked certificates). To prevent the use of untrusted certificates, the certificates on a smart card must meet the following
    criteria: its issuer has a system-trusted certificate, the certificate is not expired, its "valid-after" date is in the
    past, and it passes Certificate Revocation List (CRL) and Online Certificate Status Protocol (OCSP) checking. By setting
    the smart card certificate trust level to moderate, the system will execute a soft revocation, i.e., if the OCSP/CRL server
    is unreachable, authentication will still succeed. NOTE: Before applying this setting, refer to the smart card supplemental
    guidance. Satisfies: SRG-OS-000066-GPOS-00034, SRG-OS-000377-GPOS-00162, SRG-OS000384-GPOS-00167, SRG-OS-000403-GPOS-00182'
  impact: ''
