    severity: medium
- id: '1.10'
  title: APPL-15-000023
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The macOS system must display a policy banner at remote login. GROUP ID: V-268429 RULE ID: SV-268429r1034227'
  rationale: 'Remote login service must be configured to display a policy banner at login. Displaying a standardized and approved
    use notification before granting access to the operating system ensures that users are provided with privacy and security
    notification verbiage that is consistent with applicable federal laws, Executive Orders, directives, policies, regulations,
    standards, and guidance. System use notifications are required only for access via login interfaces with human users and
    are not required when such human interfaces do not exist. Satisfies: SRG-OS-000023-GPOS-00006, SRG-OS-000024-GPOS-00007'
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'Verify the macOS system is configured to display the Standard Mandatory DOD Notice

    and Consent Banner before granting remote access to the operating system.

    Verify the operating system has the correct text listed in the "/etc/banner" file with the

    following command:

    /usr/bin/more /etc/banner

    The command must return the following text:

    "You are accessing a U.S. Government (USG) Information System (IS) that is

    provided for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent

    to the following conditions:

    -The USG routinely intercepts and monitors communications on this IS for

    purposes including, but not limited to, penetration testing, COMSEC

    monitoring, network operations and defense, personnel misconduct (PM), law

    enforcement (LE), and counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are

    subject to routine monitoring, interception, and search, and may be disclosed

    or used for any USG-authorized purpose.

    -This IS includes security measures (e.g., authentication and access

    controls) to protect USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM,

    LE or CI investigative searching or monitoring of the content of privileged

    communications, or work product, related to personal representation or

    services by attorneys, psychotherapists, or clergy, and their assistants.

    Such communications and work product are private and confidential. See User

    Agreement for details."

    If the operating system does not display a login banner before granting remote access

    or the banner does not match the Standard Mandatory DOD Notice and Consent

    Banner, this is a finding.

    If the text in the "/etc/banner" file does not match the Standard Mandatory DOD Notice

    and Consent Banner, this is a finding.'
  remediation: 'Configure the macOS system to display the Standard Mandatory DOD Notice and

    Consent Banner before granting remote access to the operating system by creating a

    text file containing the required DOD text.

    Name the file "banner" and place it in "/etc/".'
  checks:
  - type: manual_review
    info: 'Verify the macOS system is configured to display the Standard Mandatory DOD Notice

      and Consent Banner before granting remote access to the operating system.

      Verify the operating system has the correct text listed in the "/etc/banner" file with the

      following command:

      /usr/bin/more /etc/banner

      The command must return the following text:

      "You are accessing a U.S. Government (USG) Information System (IS) that is

      provided for USG-authorized use only.

      By using this IS (which includes any device attach'
    severity: medium
- id: '1.11'
  title: APPL-15-000024
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The macOS system must enforce SSH to display a policy banner. GROUP ID: V-269093 RULE ID: SV-269093r1034754'
  rationale: 'SSH must be configured to display a policy banner. Displaying a standardized and approved use notification before
    granting access to the operating system ensures that users are provided with privacy and security notification verbiage
    that is consistent with applicable federal laws, Executive Orders, directives, policies, regulations, standards, and guidance.
    System use notifications are required only for access via login interfaces with human users and are not required when
    such human interfaces do not exist. NOTE: /etc/ssh/sshd_config will be automatically modified to its original state following
    any update or major upgrade to the operating system. Satisfies: SRG-OS-000023-GPOS-00006, SRG-OS-000024-GPOS-00007'
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'Verify the macOS system is configured to display the contents of "/etc/banner" before

    granting access to the system with the following command:

    /usr/sbin/sshd -G | /usr/bin/grep -c "^banner /etc/banner"

    If the command does not return "1", this is a finding.'
  remediation: "Configure the macOS system to display the contents of \"/etc/banner\" before granting\naccess to the system\
    \ with the following command:\ninclude_dir=$(/usr/bin/awk '/^Include/ {print $2}' /etc/ssh/sshd_config |\n/usr/bin/tr\
    \ -d '*')\nif [[ -z $include_dir ]]; then\n /usr/bin/sed -i.bk \"1s/.*/Include \\/etc\\/ssh\\/sshd_config.d\\/\\*/\"\n\
    /etc/ssh/sshd_config\nfi\n/usr/bin/grep -qxF 'banner /etc/banner' \"${include_dir}01-mscp-sshd.conf\"\n2>/dev/null ||\
    \ echo \"banner /etc/banner\" >> \"${include_dir}01-mscp-sshd.conf\"\nfor file in $(ls ${include_dir}); do\n if [[ \"\
    $file\" == \"100-macos.conf\" ]]; then\n continue\n fi\n if [[ \"$file\" == \"01-mscp-sshd.conf\" ]]; then\n break\n fi\n\
    \ /bin/mv ${include_dir}${file} ${include_dir}20-${file}\ndone"
  checks:
  - type: manual_review
    info: 'Verify the macOS system is configured to display the contents of "/etc/banner" before

      granting access to the system with the following command:

      /usr/sbin/sshd -G | /usr/bin/grep -c "^banner /etc/banner"

      If the command does not return "1", this is a finding.'
    severity: medium
- id: '1.12'
  title: APPL-15-000025
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The macOS system must display the Standard Mandatory DOD Notice and Consent Banner at the login window. GROUP
    ID: V-268431 RULE ID: SV-268431r1034233'
  rationale: 'Displaying a standardized and approved use notification before granting access to the operating system ensures
    that users are provided with privacy and security notification verbiage that is consistent with applicable federal laws,
    Executive Orders, directives, policies, regulations, standards, and guidance. System use notifications are required only
    for access via login interfaces with human users and are not required when such human interfaces do not exist. The policy
    banner will show if a "PolicyBanner.rtf" or "PolicyBanner.rtfd" exists in the "/Library/Security" folder. The banner must
    be formatted in accordance with DTM-08-060. Satisfies: SRG-OS-000023-GPOS-00006, SRG-OS-000024-GPOS-00007, SRG-OS000228-GPOS-00088'
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'Verify the macOS system is configured to display a policy banner with the following

    command:

    /bin/ls -ld /Library/Security/PolicyBanner.rtf* | /usr/bin/wc -l |

    /usr/bin/tr -d '' ''

    If the permissions for "PolicyBanner.rtfd" are not "644", this is a finding.

    The banner text of the document must read:

    "You are accessing a U.S. Government (USG) Information System (IS) that is

    provided for USG-authorized use only. By using this IS (which includes any

    device attached to this IS), you consent to the following conditions:

    -The USG routinely intercepts and monitors communications on this IS for

    purposes including, but not limited to, penetration testing, COMSEC

    monitoring, network operations and defense, personnel misconduct (PM), law

    enforcement (LE), and counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are

    subject to routine monitoring, interception, and search, and may be disclosed

    or used for any USG authorized purpose.

    -This IS includes security measures (e.g., authentication and access

    controls) to protect USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM,

    LE or CI investigative searching or monitoring of the content of privileged

