  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The macOS system must disable the camera. GROUP ID: V-268492 RULE ID: SV-268492r1034416'
  rationale: It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements
    or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured.
    They increase the risk to the platform by providing additional attack vectors. Failing to disconnect from collaborative
    computing devices (i.e., cameras) can result in subsequent compromises of organizational information. Providing easy methods
    to physically disconnect from such devices after a collaborative computing session helps to ensure that participants carry
    out the disconnect activity without having to go through complex and tedious procedures.
  impact: ''
  references: []
  page_start: 160
  audit_raw: 'If the device or operating system does not have a camera installed, this requirement is

    not applicable.

    This requirement is not applicable to mobile devices (smartphones and tablets), where

    the use of the camera is a local authorizing official (AO) decision.

    This requirement is not applicable to dedicated video teleconference (VTC) suites in

    approved VTC locations that are centrally managed.

    For an external camera, if there is not a method for the operator to manually disconnect

    camera at the end of collaborative computing sessions, this is a finding.

    For a built-in camera, the camera must be protected by a camera cover (e.g., laptop

    camera cover slide) when not in use.

    If the built-in camera is not protected with a camera cover or is not physically disabled,

    this is a finding.

    If the camera is not disconnected, covered, or physically disabled, verify the macOS

    system is configured to disable the camera with the following command:

    /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\

    .objectForKey(''allowCamera'').js

    EOS

    If the result is not "false", this is a finding.'
  remediation: 'Configure the macOS system to disable the camera by installing the

    "com.apple.applicationaccess" configuration profile.'
