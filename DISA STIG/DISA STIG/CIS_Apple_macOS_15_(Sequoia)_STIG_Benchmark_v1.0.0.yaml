  rationale: 'A Recovery Lock password must be enabled and set. Single user mode, recovery mode, the Startup Manager, and
    several other tools are available on macOS by holding down specific key combinations during startup. Setting a recovery
    lock restricts access to these tools. IMPORTANT: Recovery lock passwords are not supported on Intel devices. This rule
    is only applicable to Apple Silicon devices.'
  impact: ''
  references: []
  page_start: 283
  audit_raw: 'For non-Apple Silicon systems, this is not applicable.

