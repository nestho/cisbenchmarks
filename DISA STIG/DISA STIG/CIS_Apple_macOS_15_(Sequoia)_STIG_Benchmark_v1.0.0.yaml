    If the result is not "900", this is a finding.'
  remediation: "Configure the macOS system to set the SSHD ClientAliveInterval to 900 with the\nfollowing command:\ninclude_dir=$(/usr/bin/awk\
    \ '/^Include/ {print $2}' /etc/ssh/sshd_config |\n/usr/bin/tr -d '*')\nif [[ -z $include_dir ]]; then\n /usr/bin/sed -i.bk\
    \ \"1s/.*/Include \\/etc\\/ssh\\/sshd_config.d\\/\\*/\"\n/etc/ssh/sshd_config\nfi\n/usr/bin/grep -qxF 'clientaliveinterval\
    \ 900' \"${include_dir}01-mscpsshd.conf\" 2>/dev/null || echo \"clientaliveinterval 900\" >>\n\"${include_dir}01-mscp-sshd.conf\"\
    \nfor file in $(ls ${include_dir}); do\n if [[ \"$file\" == \"100-macos.conf\" ]]; then\n continue\n fi\n if [[ \"$file\"\
    \ == \"01-mscp-sshd.conf\" ]]; then\n break\n fi\n /bin/mv ${include_dir}${file} ${include_dir}20-${file}\ndone"
  checks:
  - type: manual_review
    info: 'Verify the macOS system is configured to set the SSHD ClientAliveInterval to 900 with

      the following command:

