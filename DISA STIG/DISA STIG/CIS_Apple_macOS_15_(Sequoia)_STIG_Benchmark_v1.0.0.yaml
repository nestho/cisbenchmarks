    \ \"1s/.*/Include \\/etc\\/ssh\\/sshd_config.d\\/\\*/\"\n/etc/ssh/sshd_config\nfi\n/usr/bin/grep -qxF 'permitrootlogin\
    \ no' \"${include_dir}01-mscp-sshd.conf\"\n2>/dev/null || echo \"permitrootlogin no\" >> \"${include_dir}01-mscp-sshd.conf\"\
    \nfor file in $(ls ${include_dir}); do\n if [[ \"$file\" == \"100-macos.conf\" ]]; then\n continue\n fi\n if [[ \"$file\"\
