  rationale: 'If SSHD is enabled, it must be configured with the Client Alive Maximum Count set to 1. This will set the number
    of client alive messages that may be sent without the SSH server receiving any messages back from the client. If this
    threshold is reached while client alive messages are being sent, the SSH server will disconnect the client, terminating
    the session. The client alive messages are sent through the encrypted channel and therefore cannot be spoofed. The client
    alive mechanism is valuable when the client or server depends on knowing when a connection has become unresponsive. NOTE:
    This setting is not intended to manage idle user sessions where there is no input from the client. Its purpose is to monitor
    for interruptions in network connectivity and force the session to terminate after the connection appears to be broken.
    NOTE: /etc/ssh/sshd_config will be automatically modified to its original state following any update or major upgrade
    to the operating system.'
