    macOS. During startup, when Secure Boot is set to full security, the Mac will verify the integrity of the operating system
    before allowing the operating system to boot. NOTE: This will only return a proper result on a T2 or Apple Silicon Macs.
    Satisfies: SRG-OS-000445-GPOS-00199, SRG-OS-000446-GPOS-00200, SRG-OS-000447GPOS-00201'
  impact: ''
