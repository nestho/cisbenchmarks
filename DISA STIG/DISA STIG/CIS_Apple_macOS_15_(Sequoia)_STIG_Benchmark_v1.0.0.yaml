  rationale: 'Authenticated Root must be enabled. When Authenticated Root is enabled, the macOS is booted from a signed volume
    that is cryptographically protected to prevent tampering with the system volume. NOTE: Authenticated Root is enabled by
    default on macOS systems. WARNING: If more than one partition with macOS is detected, the csrutil command will hang awaiting
    input.'
  impact: ''
  references: []
  page_start: 275
  audit_raw: 'Verify the macOS system is configured to enable authenticated root with the

