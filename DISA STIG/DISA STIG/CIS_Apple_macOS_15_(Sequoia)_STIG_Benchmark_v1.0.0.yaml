    "IsRecoveryLockEnabled = 1"

    If the result is not "1", this is a finding.'
  remediation: 'Configure the macOS system with Recovery Lock with the SetRecoveryLock

    command. This can be used to set a Recovery Lock password and must be from

    the MDM.'
