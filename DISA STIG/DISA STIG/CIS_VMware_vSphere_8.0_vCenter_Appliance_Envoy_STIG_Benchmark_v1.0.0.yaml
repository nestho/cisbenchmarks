- id: '1.5'
  title: VCRP-80-000098
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Envoy service must set a limit on remote connections. GROUP ID: V-259165 RULE ID: SV-259165r960735'
  rationale: Envoy client connections must be limited to preserve system resources and continue servicing connections without
    interruption. Without a limit set, the system would be vulnerable to a trivial denial-of-service attack where connections
    are created en masse and vCenter resources are entirely consumed. Envoy comes hard coded with a tested and supported value
    for "maxRemoteHttpsConnections" and "maxRemoteHttpConnections" that must be verified and maintained.
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'At the command prompt, run the following commands:

    xmllint --xpath ''/config/envoy/L4Filter/maxRemoteHttpsConnections/text()'' /etc/vmwarerhttpproxy/config.xml

    xmllint --xpath ''/config/envoy/L4Filter/maxRemoteHttpConnections/text()'' /etc/vmwarerhttpproxy/config.xml

    Example result:

    2048

    or

    XPath set is empty

    If the output is not "2048" or "XPath set it empty", this is a finding.

    Note: If "XPath set is empty" is returned the default values are in effect and is 2048.'
  remediation: 'Navigate to and open:

    /etc/vmware-rhttpproxy/config.xml

    Locate the //<L4Filter> block and configure it as follows:

    <maxRemoteHttpsConnections>2048</maxRemoteHttpsConnections>

    <maxRemoteHttpConnections>2048</maxRemoteHttpConnections>

    Restart the service for changes to take effect.

    vmon-cli --restart rhttpproxy'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following commands:

      xmllint --xpath ''/config/envoy/L4Filter/maxRemoteHttpsConnections/text()'' /etc/vmwarerhttpproxy/config.xml

      xmllint --xpath ''/config/envoy/L4Filter/maxRemoteHttpConnections/text()'' /etc/vmwarerhttpproxy/config.xml

      Example result:

      2048

      or

      XPath set is empty

      If the output is not "2048" or "XPath set it empty", this is a finding.

      Note: If "XPath set is empty" is returned the default values are in effect and is 2048.'
    severity: medium
