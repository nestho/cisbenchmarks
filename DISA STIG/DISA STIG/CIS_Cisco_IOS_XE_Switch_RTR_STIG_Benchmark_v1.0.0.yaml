    SW2(config-std-nacl)#permit any

    SW2(config-std-nacl)#exit

    Step 2: Apply the filter to all host-facing layer 3 and VLAN interfaces.

    SW2(config)#int vlan3

    SW2(config-if)#ip igmp access-group IGMP_JOIN_FILTER'
