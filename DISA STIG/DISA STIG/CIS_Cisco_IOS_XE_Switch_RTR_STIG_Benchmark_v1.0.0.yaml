- id: '1.61'
  title: CISC-RT-000680
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco PE switch providing Virtual Private LAN Services (VPLS) must be configured to have all attachment
    circuits defined to the virtual forwarding instance (VFI) with the globally unique VPN ID assigned for each customer VLAN.
    GROUP ID: V-221042 RULE ID: SV-221042r622190'
  rationale: VPLS defines an architecture that delivers Ethernet multipoint services over an MPLS network. Customer Layer
    2 frames are forwarded across the MPLS core via pseudowires using IEEE 802.1q Ethernet bridging principles. A pseudowire
    is a virtual bidirectional connection between two attachment circuits (virtual connections between PE and CE switches).
    A pseudowire contains two unidirectional label-switched paths (LSP) between two PE switches. Each MAC virtual forwarding
    table instance (VFI) is interconnected using pseudowires provisioned for the bridge domain, thereby maintaining privacy
    and logical separation between each VPLS bridge domain. The VFI specifies the pseudowires associated with connecting PE
    switches and the customer-facing attachment circuits belonging to a given VLAN. Resembling a Layer 2 switch, the VFI is
    responsible for learning MAC addresses and providing loop-free forwarding of customer traffic to the appropriate end nodes.
    Each VPLS domain is identified by a globally unique VPN ID; hence, VFIs of the same VPLS domain must be configured with
    the same VPN ID on all participating PE switches. To guarantee traffic separation for all customer VLANs and that all
    packets are forwarded to the correct destination, it is imperative that the correct attachment circuits are associated
    with the appropriate VFI and that each VFI is associated to the unique VPN ID assigned to the customer VLAN.
  impact: ''
  references: []
  page_start: 138
  audit_raw: "Step 1: Review the implementation plan and the VPN IDs assigned to customer VLANs\nfor the VPLS deployment.\n\
    Step 2: Review the PE switch configuration to verify that customer attachment circuits\nare associated to the appropriate\
    \ VFI. In the example below, the attached circuit at\ninterface GigabitEthernet0/1 is associated to VPN ID 110.\nl2 vfi\
    \ VPLS_A manual\n vpn id 110\n bridge-domain 100\n neighbor 10.3.3.3 encapsulation mpls\n neighbor 10.3.3.4 encapsulation\
    \ mpls\n…\n…\n…\ninterface GigabitEthernet0/1\n no switchport\n no ip address\n service instance 10 ethernet\n encapsulation\
    \ untagged\n bridge-domain 100\nIf the attachment circuits have not been bound to the VFI configured with the assigned\n\
    VPN ID for each VLAN, this is a finding."
  remediation: 'Assign globally unique VPN IDs for each customer bridge domain using VPLS for

    carrier Ethernet services between multiple sites, and configure the attachment circuits to

    the appropriate VFI.

    SW1(config)#l2 vfi VPLS_A manual

    SW1(config-vfi)#vpn id 110

    SW1(config-vfi)#neighbor 10.3.3.3 encapsulation mpls

    SW1(config-vfi)#bridge-domain 100

    SW1(config-vfi)#exit

    SW1(config)#int g0/1

    SW1(config-if)#service instance 10 ethernet

    SW1(config-if-srv)#encapsulation untagged

    SW1(config-if-srv)#bridge-domain 100

    SW1(config-if-srv)#end'
  checks:
  - type: manual_review
    info: "Step 1: Review the implementation plan and the VPN IDs assigned to customer VLANs\nfor the VPLS deployment.\nStep\
      \ 2: Review the PE switch configuration to verify that customer attachment circuits\nare associated to the appropriate\
      \ VFI. In the example below, the attached circuit at\ninterface GigabitEthernet0/1 is associated to VPN ID 110.\nl2\
      \ vfi VPLS_A manual\n vpn id 110\n bridge-domain 100\n neighbor 10.3.3.3 encapsulation mpls\n neighbor 10.3.3.4 encapsulation\
      \ mpls\n…\n…\n…\ninterface GigabitEthernet0/1\n"
    severity: medium
- id: '1.62'
  title: CISC-RT-000690
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco PE switch must be configured to enforce the split-horizon rule for all pseudowires within a Virtual
    Private LAN Services (VPLS) bridge domain. GROUP ID: V-221043 RULE ID: SV-221043r622190'
  rationale: A virtual forwarding instance (VFI) must be created on each participating PE switch for each customer VLAN using
    VPLS for carrier Ethernet services. The VFI specifies the VPN ID of a VPLS domain, the addresses of other PE switches
    in the domain, and the type of tunnel signaling and encapsulation mechanism for each peer PE switch. The set of VFIs formed
    by the interconnection of the emulated VCs is called a VPLS instance, which forms the logic bridge over the MPLS core
    network. The PE switches use the VFI with a unique VPN ID to establish a full mesh of emulated virtual circuits or pseudowires
    to all the other PE switches in the VPLS instance. The full-mesh configuration allows the PE switch to maintain a single
    broadcast domain. With a full-mesh configuration, signaling and packet replication requirements for each provisioned virtual
    circuit on a PE can be high. To avoid the problem of a packet looping in the provider core, thereby adding more overhead,
    the PE devices must enforce a split-horizon principle for the emulated virtual circuits; that is, if a packet is received
    on an emulated virtual circuit, it is not forwarded on any other virtual circuit.
  impact: ''
  references: []
  page_start: 140
  audit_raw: "Review the PE switch configuration to verify that split horizon is enabled. By default,\nsplit horizon is enabled;\
    \ hence, the attribute no-split-horizon should not be seen on the\nneighbor command as shown in the example below:\nl2\
    \ vfi VPLS_A manual\n vpn id 110\n bridge-domain 100\n neighbor 10.3.3.3 encapsulation mpls no-split-horizon\nIf split\
    \ horizon is not enabled, this is a finding.\nNote: This requirement is only applicable to a mesh VPLS topology. VPLS\
    \ solves the\nloop problem by using a split-horizon rule which states that member PE switches of a\nVPLS must forward\
    \ VPLS traffic only to the local attachment circuits when they receive\nthe traffic from the other PE switches. In a ring\
    \ VPLS, split horizon must be disabled so\nthat a PE switch can forward a packet received from one pseudowire to another\n\
    pseudowire. To prevent the consequential loop, at least one span in the ring would not\nhave a pseudowire for any given\
    \ VPLS instance."
  remediation: 'Enable split horizon on all PE switches deploying VPLS in a full-mesh configuration.

    SW1(config)#l2 vfi VPLS_A manual

    SW1(config-vfi)#neighbor 10.3.3.3 encapsulation mpls'
  checks:
  - type: manual_review
    info: "Review the PE switch configuration to verify that split horizon is enabled. By default,\nsplit horizon is enabled;\
      \ hence, the attribute no-split-horizon should not be seen on the\nneighbor command as shown in the example below:\n\
      l2 vfi VPLS_A manual\n vpn id 110\n bridge-domain 100\n neighbor 10.3.3.3 encapsulation mpls no-split-horizon\nIf split\
      \ horizon is not enabled, this is a finding.\nNote: This requirement is only applicable to a mesh VPLS topology. VPLS\
      \ solves the\nloop problem by using a split-ho"
    severity: medium
- id: '1.63'
  title: CISC-RT-000700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco PE switch providing Virtual Private LAN Services (VPLS) must be configured to have traffic storm
    control thresholds on CE-facing interfaces. GROUP ID: V-221044 RULE ID: SV-221044r622190'
  rationale: A traffic storm occurs when packets flood a VPLS bridge, creating excessive traffic and degrading network performance.
    Traffic storm control prevents VPLS bridge disruption by suppressing traffic when the number of packets reaches configured
    threshold levels. Traffic storm control monitors incoming traffic levels on a port and drops traffic when the number of
    packets reaches the configured threshold level during any one-second interval.
  impact: ''
  references: []
  page_start: 142
  audit_raw: "Review the switch configuration to verify that storm control is enabled on CE-facing\ninterfaces deploying VPLS\
    \ as shown in the example below:\ninterface GigabitEthernet3\n no switchport\n no ip address\n service instance 10 ethernet\n\
    \ encapsulation untagged\n bridge-domain 100\n storm-control broadcast cir 12000000\n !\n!\nIf storm control is not enabled\
    \ at a minimum for broadcast traffic, this is a finding."
  remediation: 'Configure storm control for each CE-facing interface as shown in the example below:

    SW1(config)#int g3

    SW1(config-if)#service instance 10 ethernet

    SW1(config-if-srv)#storm-control broadcast cir 12000000

    SW1(config-if-srv)#end

    Note: The acceptable range is 10000000 -1000000000 for a gigabit ethernet interface,

    and 100000000-10000000000 for a ten gigabit interface. Storm control is not supported

    on most FastEthernet interfaces.'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify that storm control is enabled on CE-facing\ninterfaces deploying VPLS\
      \ as shown in the example below:\ninterface GigabitEthernet3\n no switchport\n no ip address\n service instance 10 ethernet\n\
      \ encapsulation untagged\n bridge-domain 100\n storm-control broadcast cir 12000000\n !\n!\nIf storm control is not\
      \ enabled at a minimum for broadcast traffic, this is a finding."
    severity: medium
- id: '1.64'
  title: CISC-RT-000710
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco PE switch must be configured to implement Internet Group Management Protocol (IGMP) or Multicast
    Listener Discovery (MLD) snooping for each Virtual Private LAN Services (VPLS) bridge domain. GROUP ID: V-221045 RULE
    ID: SV-221045r856419'
  rationale: IGMP snooping provides a way to constrain multicast traffic at Layer 2. By monitoring the IGMP membership reports
    sent by hosts within the bridge domain, the snooping application can set up Layer 2 multicast forwarding tables to deliver
    traffic only to ports with at least one interested member within the VPLS bridge, thereby significantly reducing the volume
    of multicast traffic that would otherwise flood an entire VPLS bridge domain. The IGMP snooping operation applies to both
    access circuits and pseudowires within a VPLS bridge domain.
  impact: ''
  references: []
  page_start: 144
  audit_raw: "Review the switch configuration to verify that IGMP or MLD snooping has been\nconfigured for IPv4 and IPv6 multicast\
    \ traffic respectively for each VPLS bridge domain.\nThe example below are the steps to verify that IGMP snooping is enabled\
    \ for a VPLS\nbridge domain.\nStep 1: Verify that IGMP snooping is enabled globally. By default, IGMP snooping is\nenabled\
    \ globally; hence, the following command should not be in the switch\nconfiguration: no ip igmp snooping\nStep 2: If IGMP\
    \ snooping is enabled globally, it will also be enabled by default for each\nVPLS bridge domain. Hence, the command “no\
    \ ip igmp snooping” should not be\nconfigured for any VPLS bridge domain as shown in the example below:\nbridge-domain\
    \ 100\n no ip igmp snooping\n!\nIf the switch is not configured to implement IGMP or MLD snooping for each VPLS\nbridge\
    \ domain, this is a finding."
  remediation: 'Configure IGMP or MLD snooping for IPv4 and IPv6 multicast traffic respectively for

    each VPLS bridge domain.

    SW1(config)#bridge-domain 100

    SW1(config-bdomain)#ip igmp snooping

    SW1(config-bdomain)#end'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to verify that IGMP or MLD snooping has been

