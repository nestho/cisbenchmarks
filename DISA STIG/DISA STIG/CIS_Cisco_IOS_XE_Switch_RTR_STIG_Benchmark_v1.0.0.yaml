      \ unicast source reachable-via any\nIf uRPF loose mode is not enabled on all CE-facing interfaces, this is a finding."
    severity: medium
- id: '1.68'
  title: CISC-RT-000750
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco PE switch must be configured to ignore or drop all packets with any IP options. GROUP ID: V-221049
    RULE ID: SV-221049r945860'
  rationale: Packets with IP options are not fast-switched and therefore must be punted to the switch processor. Hackers who
    initiate denial-of-service (DoS) attacks on switches commonly send large streams of packets with IP options. Dropping
    the packets with IP options reduces the load of IP options packets on the switch. The end result is a reduction in the
    effects of the DoS attack on the switch and on downstream switches.
  impact: ''
  references: []
  page_start: 152
  audit_raw: 'Review the switch configuration to determine if it will ignore or drop all packets with IP

    options as shown in the examples below:

    ip options drop

    or

    ip options ignore

    If the switch is not configured to drop or block all packets with IP options, this is a

    finding.'
  remediation: 'Configure the switch to ignore or drop all packets with IP options as shown in the

    examples below:

    SW1(config)#ip options ignore

    or

    SW1(config)#ip options drop'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to determine if it will ignore or drop all packets with IP

      options as shown in the examples below:

      ip options drop

      or

      ip options ignore

      If the switch is not configured to drop or block all packets with IP options, this is a

      finding.'
    severity: medium
- id: '1.69'
  title: CISC-RT-000760
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco PE switch must be configured to enforce a Quality-of-Service (QoS) policy to provide preferred treatment
    for mission-critical applications. GROUP ID: V-221050 RULE ID: SV-221050r917445'
  rationale: Different applications have unique requirements and toleration levels for delay, jitter, bandwidth, packet loss,
    and availability. To manage the multitude of applications and services, a network requires a QoS framework to differentiate
    traffic and provide a method to manage network congestion. The Differentiated Services Model (DiffServ) is based on per-hop
    behavior by categorizing traffic into different classes and enabling each node to enforce a forwarding treatment to each
    packet as dictated by a policy. Packet markings such as IP Precedence and its successor, Differentiated Services Code
    Points (DSCP), were defined along with specific per-hop behaviors for key traffic types to enable a scalable QoS solution.
    DiffServ QoS categorizes network traffic, prioritizes it according to its relative importance, and provides priority treatment
    based on the classification. It is imperative that end-to-end QoS is implemented within the IP core network to provide
    preferred treatment for mission-critical applications.
  impact: ''
  references: []
  page_start: 154
  audit_raw: "Review the switch configuration and verify that a QoS policy has been configured to\nprovide preferred treatment\
    \ for mission-critical applications.\nStep 1: Verify that the class-maps are configured to match on DSCP values as shown\
    \ in\nthe configuration example below:\nclass-map match-all C2_VOICE\n match ip dscp af47\nclass-map match-all VOICE\n\
    \ match ip dscp ef\nclass-map match-all VIDEO\n match ip dscp af41\nclass-map match-all CONTROL_PLANE\n match ip dscp\
    \ cs6\nclass-map match-all PREFERRED_DATA\n match ip dscp af33\nStep 2: Verify that the policy map reserves the bandwidth\
    \ for each traffic type as shown\nin the example below:\npolicy-map QOS_POLICY\nclass C2_VOICE\n priority percent 10\n\
    \ class VOICE\n priority percent 15\n class VIDEO\n bandwidth percent 25\nclass CONTROL_PLANE\n priority percent 10\n\
    \ class PREFERRED_DATA\n bandwidth percent 25\n class class-default\n bandwidth percent 15\nStep 3: Verify that an output\
    \ service policy is bound to all interfaces as shown in the\nconfiguration example below:\ninterface GigabitEthernet1/1\n\
    \ no switchport\n ip address 10.1.15.1 255.255.255.252\n service-policy output QOS_POLICY\n!\ninterface GigabitEthernet1/2\n\
    \ no switchport\n ip address 10.1.15.4 255.255.255.252\n service-policy output QOS_POLICY\nNote: Enclaves must mark or\
    \ re-mark their traffic to be consistent with the DODIN\nbackbone admission criteria to gain the appropriate level of\
    \ service. A general DiffServ\nprinciple is to mark or trust traffic as close to the source as administratively and\n\
    technically possible. However, certain traffic types might need to be re-marked before\nhandoff to the DODIN backbone\
    \ to gain admission to the correct class. If such remarking is required, it is recommended that the re-marking be performed\
    \ at the CE\negress edge.\nNote: The GTP QOS document (GTP-0009) can be downloaded via the following link:\nhttps://intellipedia.intelink.gov/wiki/Portal:GIG_Technical_Guidance/GTG_GTPs/GTP_D\n\
    evelopment_List\nIf the switch is not configured to enforce a QoS policy in accordance with the QoS GIG\nTechnical Profile,\
    \ this is a finding."
  remediation: 'Configure to enforce a QoS policy to provide preferred treatment for mission-critical

    applications.

    Step 1: Configure class-maps to match on DSCP values as shown in the configuration

    example below:

    SW1(config)#class-map match-all PREFERRED_DATA

    SW1(config-cmap)#match ip dscp af33

    SW1(config-cmap)#class-map match-all CONTROL_PLANE

    SW1(config-cmap)#match ip dscp cs6

    SW1(config-cmap)#class-map match-all VIDEO

    SW1(config-cmap)#match ip dscp af41

    SW1(config-cmap)#class-map match-all VOICE

    SW1(config-cmap)#match ip dscp ef

    SW1(config-cmap)#class-map match-all C2_VOICE

    SW1(config-cmap)#match ip dscp 47

    SW1(config-cmap)#exit

    Step 2: Configure a policy map to be applied to the core-layer-facing interface that

    reserves the bandwidth for each traffic type as shown in the example below:

    SW1(config)#policy-map QOS_POLICY

    SW1(config-pmap)#class CONTROL_PLANE

    SW1(config-pmap-c)#priority percent 10

    SW1(config-pmap-c)#class C2_VOICE

    SW1(config-pmap-c)#priority percent 10

    SW1(config-pmap-c)#class VOICE

    SW1(config-pmap-c)#priority percent 15

    SW1(config-pmap-c)#class VIDEO

    SW1(config-pmap-c)#bandwidth percent 25

    SW1(config-pmap-c)#class PREFERRED_DATA

    SW1(config-pmap-c)#bandwidth percent 25

    SW1(config-pmap-c)#class class-default

    SW1(config-pmap-c)#bandwidth percent 15

    SW1(config-pmap-c)#exit

    SW1(config-pmap)#exit

    Step 3: Apply the output service policy to all interfaces as shown in the configuration

    example below:

    SW1(config)#int g1/1

    SW1(config-if)#service-policy output QOS_POLICY

    SW1(config-if)#exit

    SW1(config)#int g1/2

    SW1(config-if)#service-policy output QOS_POLICY

    SW1(config-if)#end'
  checks:
  - type: manual_review
    info: "Review the switch configuration and verify that a QoS policy has been configured to\nprovide preferred treatment\
      \ for mission-critical applications.\nStep 1: Verify that the class-maps are configured to match on DSCP values as shown\
      \ in\nthe configuration example below:\nclass-map match-all C2_VOICE\n match ip dscp af47\nclass-map match-all VOICE\n\
      \ match ip dscp ef\nclass-map match-all VIDEO\n match ip dscp af41\nclass-map match-all CONTROL_PLANE\n match ip dscp\
      \ cs6\nclass-map match-all PREFERRED_DATA\n match "
    severity: medium
