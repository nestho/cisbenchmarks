    severity: medium
- id: '1.51'
  title: CISC-RT-000560
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco BGP switch must be configured to use the maximum prefixes feature to protect against route table
    flooding and prefix de-aggregation attacks. GROUP ID: V-221030 RULE ID: SV-221030r856416'
  rationale: The effects of prefix de-aggregation can degrade switch performance due to the size of routing tables and also
    result in black-holing legitimate traffic. Initiated by an attacker or a misconfigured switch, prefix de-aggregation occurs
    when the announcement of a large prefix is fragmented into a collection of smaller prefix announcements. In 1997, misconfigured
    switches in the Florida Internet Exchange network (AS7007) deaggregated every prefix in their routing table and started
    advertising the first /24 block of each of these prefixes as their own. Faced with this additional burden, the internal
    switches became overloaded and crashed repeatedly. This caused prefixes advertised by these switches to disappear from
    routing tables and reappear when the switches came back online. As the switches came back after crashing, they were flooded
    with the routing table information by their neighbors. The flood of information would again overwhelm the switches and
    cause them to crash. This process of route flapping served to destabilize not only the surrounding network but also the
    entire Internet. Switches trying to reach those addresses would choose the smaller, more specific /24 blocks first. This
    caused backbone networks throughout North America and Europe to crash. Maximum prefix limits on peer connections combined
    with aggressive prefix-size filtering of customers' reachability advertisements will effectively mitigate the deaggregation
    risk. BGP maximum prefix must be used on all eBGP switches to limit the number of prefixes that it should receive from
    a particular neighbor, whether customer or peering AS. Consider each neighbor and how many routes they should be advertising
    and set a threshold slightly higher than the number expected.
  impact: ''
  references: []
  page_start: 118
  audit_raw: "Review the switch configuration to verify that the number of received prefixes from each\neBGP neighbor is controlled.\n\
    router bgp xx\nneighbor x.1.1.9 remote-as yy\nneighbor x.1.1.9 maximum-prefix nnnnnnn\nneighbor x.2.1.7 remote-as zz\n\
    \ neighbor x.2.1.7 maximum-prefix nnnnnnn\nIf the switch is not configured to control the number of prefixes received\
    \ from each peer\nto protect against route table flooding and prefix de-aggregation attacks, this is a\nfinding."
  remediation: 'Configure the switch to use the maximum prefixes feature to protect against route table

    flooding and prefix de-aggregation attacks as shown in the example below:

    SW1(config)#router bgp xx

    SW1(config-switch)#neighbor x.1.1.9 maximum-prefix nnnnnnn

    SW1(config-switch)#neighbor x.2.1.7 maximum-prefix nnnnnnn'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify that the number of received prefixes from each\neBGP neighbor is controlled.\n\
      router bgp xx\nneighbor x.1.1.9 remote-as yy\nneighbor x.1.1.9 maximum-prefix nnnnnnn\nneighbor x.2.1.7 remote-as zz\n\
      \ neighbor x.2.1.7 maximum-prefix nnnnnnn\nIf the switch is not configured to control the number of prefixes received\
      \ from each peer\nto protect against route table flooding and prefix de-aggregation attacks, this is a\nfinding."
    severity: medium
