- id: '1.53'
  title: CISC-RT-000610
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The MPLS switch with RSVP-TE enabled must be configured with message pacing to adjust maximum burst and maximum
    number of RSVP messages to an output queue based on the link speed and input queue size of adjacent core switches. GROUP
    ID: V-221035 RULE ID: SV-221035r622190'
  rationale: 'RSVP-TE can be used to perform constraint-based routing when building LSP tunnels within the network core that
    will support QoS and traffic engineering requirements. RSVP-TE is also used to enable MPLS Fast Reroute, a network restoration
    mechanism that will reroute traffic onto a backup LSP in case of a node or link failure along the primary path. When there
    is a disruption in the MPLS core, such as a link flap or switch reboot, the result is a significant amount of RSVP signaling,
    such as "PathErr" and "ResvErr" messages that need to be sent for every LSP using that link. When RSVP messages are sent
    out, they are sent either hop by hop or with the switch alert bit set in the IP header. This means that every switch along
    the path must examine the packet to determine if additional processing is required for these RSVP messages. If there is
    enough signaling traffic in the network, it is possible for an interface to receive more packets for its input queue than
    it can hold, resulting in dropped RSVP messages and hence slower RSVP convergence. Increasing the size of the interface
    input queue can help prevent dropping packets; however, there is still the risk of having a burst of signaling traffic
    that can fill the queue. Solutions to mitigate this risk are RSVP message pacing or refresh reduction to control the rate
    at which RSVP messages are sent. RSVP refresh reduction includes the following features: RSVP message bundling, RSVP Message
    ID to reduce message processing overhead, reliable delivery of RSVP messages using Message ID, and summary refresh to
    reduce the amount of information transmitted every refresh interval.'
  impact: ''
  references: []
  page_start: 122
  audit_raw: "Review the switch configuration to determine RSVP messages are rate limited.\nStep 1: Determine if MPLS TE is\
    \ enabled globally and at least one interface as shown in\nthe example below:\nmpls traffic-eng tunnels\n…\n…\n…\ninterface\
    \ GigabitEthernet0/2\n no switchport\n ip address x.x.x.x 255.255.255.0\n mpls traffic-eng tunnels\n mpls ip\nStep 2:\
    \ If MPLS TE is enabled, verify that message pacing is enabled.\nip rsvp signalling rate-limit period 30 burst 9 maxsize\
    \ 2100 limit 50\nNote: The command \"ip rsvp msg-pacing\" has been deprecated by the command \"ip\nrsvp signalling rate-limit\"\
    .\nIf the switch with RSVP-TE enabled does not rate limit RSVP messages based on the\nlink speed and input queue size\
    \ of adjacent core switches, this is a finding."
  remediation: 'Configure the switch to rate limit RSVP messages per interface as shown in the

    example.

    SW2(config)#ip rsvp signalling rate-limit burst 9 maxsize 2100 period 30

    limit 50'
  checks:
  - type: manual_review
    info: "Review the switch configuration to determine RSVP messages are rate limited.\nStep 1: Determine if MPLS TE is enabled\
