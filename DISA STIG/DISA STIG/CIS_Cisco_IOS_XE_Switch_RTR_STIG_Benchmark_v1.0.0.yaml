  audit_raw: "Step 1: Verify LLDP is not enabled globally via the command.\nlldp run\nBy default LLDP is not enabled globally.\
    \ If LLDP is enabled, proceed to Step 2.\nStep 2: Verify LLDP is not enabled on any external interface as shown in the\
    \ example\nbelow:\ninterface GigabitEthernet0/1\n ip address x.1.12.1 255.255.255.252\n no lldp transmit\nNote: LLDP is\
    \ enabled by default on all interfaces once it is enabled globally; hence the\ncommand \"lldp transmit\" will not be visible\
    \ on the interface configuration.\nIf LLDP transmit is enabled on any external interface, this is a finding."
  remediation: 'Disable LLDP transmit on all external interfaces as shown in the example below:

    SW1(config)#int g0/1

    SW1(config-if)#no lldp transmit'
