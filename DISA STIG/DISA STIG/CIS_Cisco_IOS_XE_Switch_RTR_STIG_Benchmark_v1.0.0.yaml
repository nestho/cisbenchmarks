  - 'SEVERITY: CAT II'
  description: 'The Cisco multicast Designated switch (DR) must be configured to set the shortest-path tree (SPT) threshold
    to infinity to minimalize source-group (S, G) state within the multicast topology where Any Source Multicast (ASM) is
    deployed. GROUP ID: V-221063 RULE ID: SV-221063r945856'
  rationale: ASM can have many sources for the same groups (many-to-many). For many receivers, the path via the RP may not
    be ideal compared with the shortest path from the source to the receiver. By default, the last-hop switch will initiate
    a switch from the shared tree to a source-specific SPT to obtain lower latencies. This is accomplished by the last-hop
    switch sending an (S, G) Protocol Independent Multicast (PIM) Join toward S (the source). When the last-hop switch begins
    to receive traffic for the group from the source via the SPT, it will send a PIM Prune message to the RP for the (S, G).
    The RP will then send a Prune message toward the source. The SPT switchover becomes a scaling issue for large multicast
    topologies that have many receivers and many sources for many groups because (S, G) entries require more memory than (*,
    G). Hence, it is imperative to minimize the amount of (S, G) state to be maintained by increasing the threshold that determines
    when the SPT switchover occurs.
  impact: ''
  references: []
  page_start: 187
  audit_raw: 'Review the DR configuration to verify that the SPT switchover threshold is increased

    (default is "0") or set to infinity (never switch over).

    ip pim rp-address 10.2.2.2

    ip pim spt-threshold infinity

    If the DR is not configured to increase the SPT threshold or set to infinity to minimalize

    (S, G) state, this is a finding.'
  remediation: 'Configure the DR to increase the SPT threshold or set it to infinity to minimalize (S, G)

    state within the multicast topology where ASM is deployed.

    SW2(config)#ip pim spt-threshold infinity'
  checks:
  - type: manual_review
    info: 'Review the DR configuration to verify that the SPT switchover threshold is increased

      (default is "0") or set to infinity (never switch over).

      ip pim rp-address 10.2.2.2

      ip pim spt-threshold infinity

      If the DR is not configured to increase the SPT threshold or set to infinity to minimalize

      (S, G) state, this is a finding.'
    severity: medium
- id: '1.83'
  title: CISC-RT-000900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco Multicast Source Discovery Protocol (MSDP) switch must be configured to only accept MSDP packets
    from known MSDP peers. GROUP ID: V-221064 RULE ID: SV-221064r856427'
  rationale: MSDP peering with customer network switches presents additional risks to the DISN Core, whether from a rogue
    or misconfigured MSDP-enabled switch. To guard against an attack from malicious MSDP traffic, the receive path or interface
    filter for all MSDPenabled RP switches must be configured to only accept MSDP packets from known MSDP peers.
  impact: ''
  references: []
  page_start: 189
  audit_raw: "Review the switch configuration to determine if there is a receive path or interface filter\nto only accept\
    \ MSDP packets from known MSDP peers.\nStep 1: Verify that interfaces used for MSDP peering have an inbound ACL as shown\
    \ in\nthe example below:\ninterface GigabitEthernet1/1\n no switchport\n ip address x.1.28.8 255.255.255.0\n ip access-group\
    \ EXTERNAL_ACL_INBOUND in\n ip pim sparse-mode\nStep 2: Verify that the ACL restricts MSDP peering to only known sources.\n\
    ip access-list extended EXTERNAL_ACL_INBOUND\n permit tcp any any established\n permit tcp host x.1.28.2 host x.1.28.8\
    \ eq 639\n deny tcp any host x.1.28.8 eq 639 log\n permit tcp host x.1.28.2 host 10.1.28.8 eq bgp\n permit tcp host x.1.28.2\
    \ eq bgp host x.1.28.8\n permit pim host x.1.28.2 host x.1.28.8\n…\n …\n …\ndeny ip any any log\nNote: MSDP connections\
    \ is via TCP port 639.\nIf the switch is not configured to only accept MSDP packets from known MSDP peers,\nthis is a\
    \ finding."
  remediation: 'Configure the receive path or interface ACLs to only accept MSDP packets from known

    MSDP peers.

    SW1(config)#ip access-list extended EXTERNAL_ACL_INBOUND

    SW1(config-ext-nacl)#permit tcp any any established

    SW1(config-ext-nacl)#permit tcp host x.1.28.2 host x.1.28.8 eq 639

    SW1(config-ext-nacl)#deny tcp any host x1.28.8 eq 639

    SW1(config-ext-nacl)#permit tcp host x.1.28.2 host x.1.28.8 eq bgp

    SW1(config-ext-nacl)#permit tcp host x.1.28.2 eq bgp host x.1.28.8

    SW1(config-ext-nacl)#permit pim host x.1.28.2 host x.1.28.8

    …

    …

    …

    SW1(config-ext-nacl)#deny ip any any'
  checks:
  - type: manual_review
    info: "Review the switch configuration to determine if there is a receive path or interface filter\nto only accept MSDP\
      \ packets from known MSDP peers.\nStep 1: Verify that interfaces used for MSDP peering have an inbound ACL as shown\
      \ in\nthe example below:\ninterface GigabitEthernet1/1\n no switchport\n ip address x.1.28.8 255.255.255.0\n ip access-group\
      \ EXTERNAL_ACL_INBOUND in\n ip pim sparse-mode\nStep 2: Verify that the ACL restricts MSDP peering to only known sources.\n\
      ip access-list extended EXTERNAL_ACL_IN"
    severity: medium
