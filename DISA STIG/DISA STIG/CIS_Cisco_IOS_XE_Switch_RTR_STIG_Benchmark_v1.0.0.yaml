- id: '1.38'
  title: CISC-RT-000398
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco perimeter switch must be configured to drop IPv6 packets containing a Hopby-Hop or Destination Option
    extension header with an undefined option type. GROUP ID: V-237778 RULE ID: SV-237778r856675'
  rationale: The optional and extensible natures of the IPv6 extension headers require higher scrutiny since many implementations
    do not always drop packets with headers that it cannot recognize, and hence could cause a Denial-of-Service on the target
    device. In addition, the type, length, value (TLV) formatting provides the ability for headers to be very large.
  impact: ''
  references: []
  page_start: 89
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the switch configuration and determine if\
    \ filters are bound to the applicable\ninterfaces to drop all inbound IPv6 packets containing an undefined option type\
    \ value\nregardless of whether they appear in a Hop-by-Hop or Destination Option header.\nUndefined values are 0x02, 0x03,\
    \ 0x06, 0x9 – 0xE, 0x10 – 0x22, 0x24, 0x25, 0x27 –\n0x2F, and 0x31 – 0xFF.\nStep 1: Verify that an inbound IPv6 ACL has\
    \ been configured on the external interface.\ninterface gigabitethernet1/0\n ipv6 address 2001::1:0:22/64\n ipv6 traffic-filter\
    \ FILTER_IPV6 in\nStep 2: Verify that the ACL drops IPv6 packets containing a Hop-by-Hop or Destination\nOption extension\
    \ header with an undefined option type as shown in the example below.\nipv6 access-list FILTER_IPV6\ndeny any any dest-option-type\
    \ 2\ndeny any any dest-option-type 3\ndeny any any dest-option-type 6\ndeny any any dest-option-type 9\ndeny any any dest-option-type\
    \ 10\ndeny any any dest-option-type 11\ndeny any any dest-option-type 12\ndeny any any dest-option-type 13\ndeny any any\
    \ dest-option-type 14\ndeny any any dest-option-type 16\n…\ndeny any any dest-option-type 34\ndeny any any dest-option-type\
    \ 36\ndeny any any dest-option-type 37\ndeny any any dest-option-type 39\n…\ndeny any any dest-option-type 47\ndeny any\
    \ any dest-option-type 49\n…\ndeny any any dest-option-type 255\npermit …\n…\n…\n…\ndeny ipv6 any any log\nNote: Because\
    \ hop-by-hop and destination options have the same exact header format,\nthey can be combined under the dest-option-type\
    \ keyword. Since Hop-by-Hop and\nDestination Option headers have non-overlapping types, you can use dest-option-type\n\
    to match either.\nIf the switch is not configured to drop IPv6 packets containing a Hop-by-Hop or\nDestination Option\
    \ extension header with an undefined option type, this is a finding."
  remediation: "Configure the switch to drop all inbound IPv6 packets containing an undefined option\ntype value regardless\
    \ of whether they appear in a Hop-by-Hop or Destination Option\nheader as shown in the example below.\nSW1(config)#ipv6\
    \ access-list FILTER_IPV6\nSW1(config-ipv6-acl)#deny any any dest-option-type 2\nSW1(config-ipv6-acl)#deny any any dest-option-type\
    \ 3\nSW1(config-ipv6-acl)#deny any any dest-option-type 6\nSW1(config-ipv6-acl)#deny any any dest-option-type 9\nSW1(config-ipv6-acl)#deny\
    \ any any dest-option-type 10\nSW1(config-ipv6-acl)#deny any any dest-option-type 11\nSW1(config-ipv6-acl)#deny any any\
    \ dest-option-type 12\nSW1(config-ipv6-acl)#deny any any dest-option-type 13\nSW1(config-ipv6-acl)#deny any any dest-option-type\
    \ 14\nSW1(config-ipv6-acl)#deny any any dest-option-type 16\n …\nSW1(config-ipv6-acl)#deny any any dest-option-type 34\n\
    SW1(config-ipv6-acl)#deny any any dest-option-type 36\nSW1(config-ipv6-acl)#deny any any dest-option-type 37\nSW1(config-ipv6-acl)#deny\
    \ any any dest-option-type 39\n…\nSW1(config-ipv6-acl)#deny any any dest-option-type 47\nSW1(config-ipv6-acl)#deny any\
    \ any dest-option-type 49\n…\nSW1(config-ipv6-acl)#deny any any dest-option-type 255\nSW1(config-ipv6-acl)#permit …\n\
    …\n…\n…\nSW1(config-ipv6-acl)#deny ipv6 any any log\nSW1(config-ipv6-acl)#exit\nSW1(config)#int g1/0\nSW1(config-if)#ipv6\
    \ traffic-filter FILTER_IPV6"
  checks:
  - type: manual_review
    info: 'This requirement is not applicable for the DODIN Backbone.

      Review the switch configuration and determine if filters are bound to the applicable

      interfaces to drop all inbound IPv6 packets containing an undefined option type value

      regardless of whether they appear in a Hop-by-Hop or Destination Option header.

      Undefined values are 0x02, 0x03, 0x06, 0x9 – 0xE, 0x10 – 0x22, 0x24, 0x25, 0x27 –

