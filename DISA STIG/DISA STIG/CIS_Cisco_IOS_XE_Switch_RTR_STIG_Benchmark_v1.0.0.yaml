- id: '1.55'
  title: CISC-RT-000620
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco MPLS switch must be configured to have TTL Propagation disabled. GROUP ID: V-221036 RULE ID: SV-221036r622190'
  rationale: The head end of the label-switched path (LSP), the label edge switch (LER) will decrement the IP packet's time-to-live
    (TTL) value by one and then copy the value to the MPLS TTL field. At each label-switched switch (LSR) hop, the MPLS TTL
    value is decremented by one. The MPLS switch that pops the label (either the penultimate LSR or the egress LER) will copy
    the packet's MPLS TTL value to the IP TTL field and decrement it by one. This TTL propagation is the default behavior.
    Because the MPLS TTL is propagated from the IP TTL, a traceroute will list every hop in the path, be it routed or label
    switched, thereby exposing core nodes. With TTL propagation disabled, LER decrements the IP packet's TTL value by one
    and then places a value of 255 in the packet's MPLS TTL field, which is then decremented by one as the packet passes through
    each LSR in the MPLS core. Because the MPLS TTL never drops to zero, none of the LSP hops triggers an ICMP TTL exceeded
    message, and consequently, these hops are not recorded in a traceroute. Hence, nodes within the MPLS core cannot be discovered
    by an attacker.
  impact: ''
  references: []
  page_start: 126
  audit_raw: 'Review the switch configuration to verify that TTL propagation is disabled as shown in

    the example below:

    no mpls ip propagate-ttl

    If the MPLS switch is not configured to disable TTL propagation, this is a finding.'
  remediation: 'Configure the MPLS switch to disable TTL propagation as shown in the example below:

    SW1(config)#no mpls ip propagate-ttl'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to verify that TTL propagation is disabled as shown in

      the example below:

      no mpls ip propagate-ttl

      If the MPLS switch is not configured to disable TTL propagation, this is a finding.'
    severity: medium
- id: '1.56'
  title: CISC-RT-000630
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco PE switch must be configured to have each Virtual Routing and Forwarding (VRF) instance bound to
    the appropriate physical or logical interfaces to maintain traffic separation between all MPLS L3VPNs. GROUP ID: V-221037
    RULE ID: SV-221037r622190'
  rationale: The primary security model for an MPLS L3VPN infrastructure is traffic separation. The service provider must
    guarantee the customer that traffic from one VPN does not leak into another VPN or into the core, and that core traffic
    must not leak into any VPN. Hence, it is imperative that each CE-facing interface can only be associated to one VRF—that
    alone is the fundamental framework for traffic separation.
