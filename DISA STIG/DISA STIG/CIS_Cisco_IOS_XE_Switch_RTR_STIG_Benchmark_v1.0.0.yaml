- id: '1.14'
  title: CISC-RT-000230
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco switch must be configured to disable the auxiliary port unless it is connected to a secured modem
    providing encryption and authentication. GROUP ID: V-221006 RULE ID: SV-221006r622190'
  rationale: The use of POTS lines to modems connecting to network devices provides clear text of authentication traffic over
    commercial circuits that could be captured and used to compromise the network. Additional war dial attacks on the device
    could degrade the device and the production network. Secured modem devices must be able to authenticate users and must
    negotiate a key exchange before full encryption takes place. The modem will provide full encryption capability (Triple
    DES) or stronger. The technician who manages these devices will be authenticated using a key fob and granted access to
    the appropriate maintenance port; thus, the technician will gain access to the managed device. The token provides a method
    of strong (two-factor) user authentication. The token works in conjunction with a server to generate one-time user passwords
    that will change values at second intervals. The user must know a personal identification number (PIN) and possess the
    token to be allowed access to the device.
  impact: ''
  references: []
  page_start: 42
  audit_raw: "Review the configuration and verify that the auxiliary port is disabled unless a secured\nmodem providing encryption\
    \ and authentication is connected to it.\nline aux 0\n no exec\nNote: Transport input none is the default; hence it will\
    \ not be shown in the configuration.\nIf the auxiliary port is not disabled or is not connected to a secured modem when\
    \ it is\nenabled, this is a finding."
  remediation: 'Disable the auxiliary port.

    SW2(config)#line aux 0

    SW2(config-line)#no exec

    SW2(config-line)#transport input none'
  checks:
  - type: manual_review
    info: "Review the configuration and verify that the auxiliary port is disabled unless a secured\nmodem providing encryption\
      \ and authentication is connected to it.\nline aux 0\n no exec\nNote: Transport input none is the default; hence it\
      \ will not be shown in the configuration.\nIf the auxiliary port is not disabled or is not connected to a secured modem\
      \ when it is\nenabled, this is a finding."
    severity: medium
- id: '1.15'
  title: CISC-RT-000235
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to have Cisco Express Forwarding enabled. GROUP ID: V-237750 RULE ID:
    SV-237750r648776'
  rationale: The Cisco Express Forwarding (CEF) switching mode replaces the traditional Cisco routing cache with a data structure
    that mirrors the entire system routing table. Because there is no need to build cache entries when traffic starts arriving
    for new destinations, CEF behaves more predictably when presented with large volumes of traffic addressed to many destinations
    such as a SYN flood attacks that. Because many SYN flood attacks use randomized source addresses to which the hosts under
    attack will reply to, there can be a substantial amount of traffic for a large number of destinations that the switch
    will have to handle. Consequently, switches configured for CEF will perform better under SYN floods directed at hosts
    inside the network than switches using the traditional cache.
  impact: ''
  references: []
  page_start: 44
  audit_raw: 'Review the switch to verify that CEF is enabled.

    IPv4 Example: ip cef

    IPv6 Example: ipv6 cef

    If the switch is not configured to have CEF enabled, this is a finding.'
  remediation: 'Enable CEF

    IPv4 Example: ip cef

    IPv6 Example: ipv6 cef'
  checks:
  - type: manual_review
    info: 'Review the switch to verify that CEF is enabled.

      IPv4 Example: ip cef

      IPv6 Example: ipv6 cef

      If the switch is not configured to have CEF enabled, this is a finding.'
    severity: medium
