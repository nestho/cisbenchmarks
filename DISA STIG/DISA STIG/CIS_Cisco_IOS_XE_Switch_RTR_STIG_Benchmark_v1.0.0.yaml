  rationale: These options are intended to be for the Destination Options header only. The optional and extensible natures
    of the IPv6 extension headers require higher scrutiny since many implementations do not always drop packets with headers
    that it cannot recognize and hence could cause a Denial-of-Service on the target device. In addition, the type, length,
    value (TLV) formatting provides the ability for headers to be very large.
