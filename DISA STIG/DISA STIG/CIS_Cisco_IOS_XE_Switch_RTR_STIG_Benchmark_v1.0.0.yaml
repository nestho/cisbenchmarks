- id: '1.26'
  title: CISC-RT-000350
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco perimeter switch must be configured to block all packets with any IP options. GROUP ID: V-221015
    RULE ID: SV-221015r945859'
  rationale: Packets with IP options are not fast switched and henceforth must be punted to the switch processor. Hackers
    who initiate denial-of-service (DoS) attacks on switches commonly send large streams of packets with IP options. Dropping
    the packets with IP options reduces the load of IP options packets on the switch. The end result is a reduction in the
    effects of the DoS attack on the switch and on downstream switches.
  impact: ''
  references: []
  page_start: 66
  audit_raw: "Review the switch configuration to determine if it will block all packets with IP options.\nip access-list extended\
    \ EXTERNAL_ACL\n permit tcp any any established\ndeny ip any any option any-options\npermit …\n …\n …\n …\ndeny ip any\
    \ any log-input\nIf the switch is not configured to drop all packets with IP options, this is a finding."
  remediation: 'Configure the switch to drop all packets with IP options.

    SW1(config)#ip access-list extended EXTERNAL_ACL

    SW1(config-ext-nacl)#15 deny ip any any option any-options'
