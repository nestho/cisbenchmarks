- id: '1.71'
  title: CISC-RT-000780
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to enforce a Quality-of-Service (QoS) policy to limit the effects of packet
    flooding denial-of-service (DoS) attacks. GROUP ID: V-221052 RULE ID: SV-221052r622190'
  rationale: DoS is a condition when a resource is not available for legitimate users. Packet flooding distributed denial-of-service
    (DDoS) attacks are referred to as volumetric attacks and have the objective of overloading a network or circuit to deny
    or seriously degrade performance, which denies access to the services that normally traverse the network or circuit. Volumetric
    attacks have become relatively easy to launch using readily available tools such as Low Orbit Ion Cannon or botnets. Measures
    to mitigate the effects of a successful volumetric attack must be taken to ensure that sufficient capacity is available
    for mission-critical traffic. Managing capacity may include, for example, establishing selected network usage priorities
    or quotas and enforcing them using rate limiting, Quality of Service (QoS), or other resource reservation control methods.
    These measures may also mitigate the effects of sudden decreases in network capacity that are the result of accidental
    or intentional physical damage to telecommunications facilities (such as cable cuts or weather-related outages).
  impact: ''
  references: []
  page_start: 163
  audit_raw: "Review the switch configuration to determine if it is configured to enforce a QoS policy\nto limit the effects\
    \ of packet flooding DoS attacks.\nStep 1: Verify that a class map has been configured for the Scavenger class as shown\n\
    in the example below:\nclass-map match-all SCAVENGER\n match ip dscp cs1\nStep 2: Verify that the policy map includes\
    \ the SCAVENGER class with low priority as\nshown in the example below:\npolicy-map QOS_POLICY\n class CONTROL_PLANE\n\
    \ priority percent 10\n class C2_VOICE\n priority percent 10\n class VOICE\n priority percent 15\n class VIDEO\n bandwidth\
    \ percent 25\n class PREFERRED_DATA\n bandwidth percent 25\nclass SCAVENGER\n bandwidth percent 5\n class class-default\n\
    \ bandwidth percent 10\nNote: Traffic out of profile must be marked at the customer access layer or CE egress\nedge.\n\
    If the switch is not configured to enforce a QoS policy to limit the effects of packet\nflooding DoS attacks, this is\
    \ a finding."
  remediation: 'Step 1: Configure a class map for the SCAVENGER class.

    SW1(config)#class-map match-all SCAVENGER

    SW1(config-cmap)#match ip dscp cs1

    Step 2: Add the SCAVENGER class to the policy map as shown in the example below:

    SW1(config)#policy-map QOS_POLICY

    SW1(config-pmap-c)#no class class-default

    SW1(config-pmap)#class SCAVENGER

    SW1(config-pmap-c)#bandwidth percent 5

    SW1(config-pmap-c)#class class-default

    SW1(config-pmap-c)#bandwidth percent 10

    SW1(config-pmap-c)#end'
  checks:
  - type: manual_review
