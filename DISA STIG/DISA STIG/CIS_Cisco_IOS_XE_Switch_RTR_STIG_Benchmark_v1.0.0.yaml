  title: CISC-RT-000236
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco switch must be configured to advertise a hop limit of at least 32 in Switch Advertisement messages
    for IPv6 stateless auto-configuration deployments. GROUP ID: V-237752 RULE ID: SV-237752r648780'
  rationale: The Neighbor Discovery protocol allows a hop limit value to be advertised by routers in a Router Advertisement
    message being used by hosts instead of the standardized default value. If a very small value was configured and advertised
    to hosts on the LAN segment, communications would fail due to the hop limit reaching zero before the packets sent by a
    host reached its destination.
  impact: ''
  references: []
  page_start: 45
  audit_raw: 'Review the switch configuration to determine if the hop limit has been configured for

    Router Advertisement messages as shown in the example.

    ipv6 hop-limit 128

    If hop-limit has been configured and has not been set to at least 32, it is a finding.'
  remediation: 'Configure the switch to advertise a hop limit of at least 32 in Router Advertisement

    messages as shown in the example.

    SW1(config)#ipv6 hop-limit 128'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to determine if the hop limit has been configured for

      Router Advertisement messages as shown in the example.

      ipv6 hop-limit 128

      If hop-limit has been configured and has not been set to at least 32, it is a finding.'
    severity: medium
- id: '1.17'
  title: CISC-RT-000237
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must not be configured to use IPv6 Site Local Unicast addresses. GROUP ID: V-237756 RULE
    ID: SV-237756r999760'
  rationale: As currently defined, site local addresses are ambiguous and can be present in multiple sites. The address itself
    does not contain any indication of the site to which it belongs. The use of site-local addresses has the potential to
    adversely affect network security through leaks, ambiguity, and potential misrouting as documented in section 2 of RFC3879.
    RFC3879 formally deprecates the IPv6 site-local unicast prefix FEC0::/10 as defined in RFC3513.
  impact: ''
  references: []
  page_start: 46
  audit_raw: 'Review the switch configuration to ensure FEC0::/10 IPv6 addresses are not defined.

    If IPv6 Site Local Unicast addresses are defined, this is a finding.'
  remediation: Configure the switch using only authorized IPv6 addresses.
  checks:
  - type: manual_review
    info: 'Review the switch configuration to ensure FEC0::/10 IPv6 addresses are not defined.

      If IPv6 Site Local Unicast addresses are defined, this is a finding.'
    severity: medium
- id: '1.18'
  title: CISC-RT-000240
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco perimeter switch must be configured to deny network traffic by default and allow network traffic
    by exception. GROUP ID: V-221007 RULE ID: SV-221007r622190'
  rationale: A deny-all, permit-by-exception network communications traffic policy ensures that only connections that are
    essential and approved are allowed. This requirement applies to both inbound and outbound network communications traffic.
    All inbound and outbound traffic must be denied by default. Firewalls and perimeter switches should only allow traffic
    through that is explicitly permitted. The initial defense for the internal network is to block any traffic at the perimeter
    that is attempting to make a connection to a host residing on the internal network. In addition, allowing unknown or undesirable
    outbound traffic by the firewall or switch will establish a state that will permit the return of this undesirable traffic
    inbound.
  impact: ''
  references: []
  page_start: 47
  audit_raw: "Review the switch configuration to verify that the inbound ACL applied to all external\ninterfaces is configured\
    \ to allow specific ports and protocols and deny all other traffic.\nStep 1: Verify that an inbound ACL is applied to\
    \ all external interfaces as shown in the\nexample below:\ninterface GigabitEthernet0/2\n ip address x.11.1.2 255.255.255.254\n\
    \ ip access-group EXTERNAL_ACL in\nStep 2: Review inbound ACL to verify that it is configured to deny all other traffic\
    \ that is\nnot explicitly allowed.\nip access-list extended EXTERNAL_ACL\n permit tcp any any established\n permit tcp\
    \ host x.11.1.1 eq bgp host x.11.1.2\n permit tcp host x.11.1.1 host x.11.1.2 eq bgp\n permit icmp host x.11.1.1 host\
    \ x.11.1.2 echo\n permit icmp host x.11.1.1 host x.11.1.2 echo-reply\n…\n …\n …\ndeny ip any any log-input\nIf the ACL\
    \ is not configured to allow specific ports and protocols and deny all other\ntraffic, this is a finding. If the ACL is\
    \ not configured inbound on all external interfaces,\nthis is a finding."
  remediation: 'Step 1: Configure an inbound ACL to deny all other traffic by default as shown in the

    example below:

    SW1(config)#ip access-list extended EXTERNAL_ACL

    SW1(config-ext-nacl)#permit tcp any any established

    SW1(config-ext-nacl)#permit tcp host x.11.1.1 eq bgp host x.11.1.2

    SW1(config-ext-nacl)#permit tcp host x.11.1.1 host x.11.1.2 eq bgp

    SW1(config-ext-nacl)#permit icmp host x.11.1.1 host x.11.1.2 echo

    SW1(config-ext-nacl)#permit icmp host x.11.1.1 host x.11.1.2 echo-reply

    …

    …

    …

    SW1(config-ext-nacl)#deny ip any any log-input

    Step 2: Apply the ingress filter to all external interfaces.

    SW1(config)#int g0/2

    SW1(config-if)#ip access-group EXTERNAL_ACL in'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify that the inbound ACL applied to all external\ninterfaces is configured\
      \ to allow specific ports and protocols and deny all other traffic.\nStep 1: Verify that an inbound ACL is applied to\
      \ all external interfaces as shown in the\nexample below:\ninterface GigabitEthernet0/2\n ip address x.11.1.2 255.255.255.254\n\
      \ ip access-group EXTERNAL_ACL in\nStep 2: Review inbound ACL to verify that it is configured to deny all other traffic\
      \ that is\nnot explicitly allowed.\nip"
    severity: medium
- id: '1.19'
  title: CISC-RT-000250
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco perimeter switch must be configured to enforce approved authorizations for controlling the flow
    of information between interconnected networks in accordance with applicable policy. GROUP ID: V-221008 RULE ID: SV-221008r622190'
  rationale: Information flow control regulates authorized information to travel within a network and between interconnected
    networks. Controlling the flow of network traffic is critical so it does not introduce any unacceptable risk to the network
    infrastructure or data. An example of a flow control restriction is blocking outside traffic claiming to be from within
    the organization. For most switches, internal information flow control is a product of system design.
  impact: ''
  references: []
  page_start: 50
  audit_raw: "Review the switch configuration to verify that ACLs are configured to allow or deny\ntraffic for specific source\
    \ and destination addresses as well as ports and protocols. In\nthe example below, the switch is peering BGP with DISN.\
    \ ICMP echo and echo-reply\npackets are allowed for troubleshooting connectivity. WWW traffic is permitted inbound\nto\
    \ the NIPRNet host-facing web server (x.12.1.22).\ninterface GigabitEthernet0/1\n description Link to DISN\n ip address\
    \ x.12.1.10 255.255.255.0\n ip access-group FILTER_PERIMETER in\n…\n…\n…\nip access-list extended FILTER_PERIMETER\n permit\
    \ tcp any any established\n permit tcp host x.12.1.9 host x.12.1.10 eq bgp\n permit tcp host x.12.1.9 eq bgp host x.12.1.10\n\
    \ permit icmp host x.12.1.9 host x.12.1.10 echo\n permit icmp host x.12.1.9 host x.12.1.10 echo-reply\n permit tcp any\
    \ host x.12.1.22 eq www\n deny ip any any log-input\nIf the switch is not configured to enforce approved authorizations\
    \ for controlling the flow\nof information between interconnected networks, this is a finding."
  remediation: 'Step 1: Configure an ACL to allow or deny traffic as shown in the example below:

    SW1(config)#ip access-list extended FILTER_PERIMETER

    SW1(config-ext-nacl)#permit tcp any any established

    SW1(config-ext-nacl)#permit tcp host x.12.1.9 host x.12.1.10 eq bgp

    SW1(config-ext-nacl)#permit tcp host x.12.1.9 eq bgp host x.12.1.10

    SW1(config-ext-nacl)#permit icmp host x.12.1.9 host x.12.1.10 echo

    SW1(config-ext-nacl)#permit icmp host x.12.1.9 host x.12.1.10 echo-reply

    SW1(config-ext-nacl)#permit tcp any host x.12.1.22 eq www

    SW1(config-ext-nacl)#deny ip any any log-input

    SW1(config-ext-nacl)#exit

    Step 2: Apply the ACL inbound on all external interfaces.

    R2(config)#int g0/0

    SW1(config-if)#ip access-group FILTER_PERIMETER in'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify that ACLs are configured to allow or deny\ntraffic for specific source\
      \ and destination addresses as well as ports and protocols. In\nthe example below, the switch is peering BGP with DISN.\
      \ ICMP echo and echo-reply\npackets are allowed for troubleshooting connectivity. WWW traffic is permitted inbound\n\
      to the NIPRNet host-facing web server (x.12.1.22).\ninterface GigabitEthernet0/1\n description Link to DISN\n ip address\
      \ x.12.1.10 255.255.255.0\n ip access-group "
    severity: medium
- id: '1.20'
  title: CISC-RT-000260
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco perimeter switch must be configured to only allow incoming communications from authorized sources
    to be routed to authorized destinations. GROUP ID: V-221009 RULE ID: SV-221009r856408'
  rationale: Unrestricted traffic may contain malicious traffic that poses a threat to an enclave or to other connected networks.
    Additionally, unrestricted traffic may transit a network, which uses bandwidth and other resources. Traffic can be restricted
    directly by an access control list (ACL), which is a firewall function, or by Policy Routing. Policy Routing is a technique
    used to make routing decisions based on a number of different criteria other than just the destination network, including
    source or destination network, source or destination address, source or destination port, protocol, packet size, and packet
    classification. This overrides the switch's normal routing procedures used to control the specific paths of network traffic.
    It is normally used for traffic engineering but can also be used to meet security requirements; for example, traffic that
    is not allowed can be routed to the Null0 or discard interface. Policy Routing can also be used to control which prefixes
    appear in the routing table. This requirement is intended to allow network administrators the flexibility to use whatever
    technique is most effective.
  impact: ''
  references: []
  page_start: 52
  audit_raw: "Review the switch configuration to determine if the switch allows only incoming\ncommunications from authorized\
    \ sources to be routed to authorized destinations. The\nhypothetical example below allows inbound NTP from server x.1.12.9\
    \ only to host\nx.12.1.21.\nip access-list extended FILTER_PERIMETER\n permit tcp any any established\n…\n …\n …\npermit\
