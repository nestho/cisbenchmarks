- id: '1.65'
  title: CISC-RT-000720
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco PE switch must be configured to limit the number of MAC addresses it can learn for each Virtual
    Private LAN Services (VPLS) bridge domain. GROUP ID: V-221046 RULE ID: SV-221046r622190'
  rationale: VPLS defines an architecture that delivers Ethernet multipoint services over an MPLS network. Customer Layer
    2 frames are forwarded across the MPLS core via pseudowires using IEEE 802.1q Ethernet bridging principles. A pseudowire
    is a virtual bidirectional connection between two attachment circuits (virtual connections between PE and CE switches).
    A pseudowire contains two unidirectional label-switched paths (LSP). Each MAC forwarding table instance is interconnected
    using domain-specific LSPs, thereby maintaining privacy and logical separation between each VPLS domain. When a frame
    arrives on a bridge port (pseudowire or attachment circuit) and the source MAC address is unknown to the receiving PE
    switch, the source MAC address is associated with the pseudowire or attachment circuit and the forwarding table is updated
    accordingly. Frames are forwarded to the appropriate pseudowire or attachment circuit according to the forwarding table
    entry for the destination MAC address. Ethernet frames sent to broadcast and unknown destination addresses must be flooded
    out to all interfaces for the bridge domain; hence, a PE switch must replicate packets across both attachment circuits
    and pseudowires. A malicious attacker residing in a customer network could launch a source MAC address spoofing attack
    by flooding packets to a valid unicast destination, each with a different MAC source address. The PE switch receiving
    this traffic would try to learn every new MAC address and would quickly run out of space for the VFI forwarding table.
    Older, valid MAC addresses would be removed from the table, and traffic sent to them would have to be flooded until the
    storm threshold limit is reached. Hence, it is essential that a limit is established to control the number of MAC addresses
    that will be learned and recorded into the forwarding table for each bridge domain.
