- id: '1.23'
  title: CISC-RT-000320
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco perimeter switch must be configured to filter traffic destined to the enclave in accordance with
    the guidelines contained in DoD Instruction 8551.1. GROUP ID: V-221012 RULE ID: SV-221012r622190'
  rationale: Vulnerability assessments must be reviewed by the System Administrator, and protocols must be approved by the
    Information Assurance (IA) staff before entering the enclave. ACLs are the first line of defense in a layered security
    approach. They permit authorized packets and deny unauthorized packets based on port or service type. They enhance the
    posture of the network by not allowing packets to reach a potential target within the security domain. The lists provided
    are highly susceptible ports and services that should be blocked or limited as much as possible without adversely affecting
    customer requirements. Auditing packets attempting to penetrate the network that are stopped by an ACL will allow network
    administrators to broaden their protective ring and more tightly define the scope of operation. If the perimeter is in
    a Deny-by-Default posture and what is allowed through the filter is in accordance with DoD Instruction 8551.1, and if
    the permit rule is explicitly defined with explicit ports and protocols allowed, then all requirements related to PPS
    being blocked would be satisfied.
  impact: ''
  references: []
  page_start: 59
  audit_raw: "Review the switch configuration to verify that the ingress ACL is in accordance with DoD\n8551.1.\nStep 1: Verify\
    \ that an inbound ACL is configured on all external interfaces.\ninterface GigabitEthernet0/2\n ip address x.11.1.2 255.255.255.254\n\
    \ ip access-group EXTERNAL_ACL_INBOUND in\nStep 2. Review the inbound ACL to verify that it is filtering traffic in accordance\
    \ with\nDoD 8551.1.\nip access-list extended EXTERNAL_ACL_INBOUND\n permit tcp any any established\n permit tcp host x.11.1.1\
    \ eq bgp host x.11.1.2\n permit tcp host x.11.1.1 host x.11.1.2 eq bgp\n permit icmp host x.11.1.1 host x.11.1.2 echo\n\
    \ permit icmp host x.11.1.1 host x.11.1.2 echo-reply\n…\n … < must be in accordance with DoD Instruction 8551.1>\n…\n\
    deny ip any any log-input\nIf the switch does not filter traffic in accordance with the guidelines contained in DoD\n\
    8551.1, this is a finding."
  remediation: 'Configure the switch to use an inbound ACL on all external interfaces as shown in the

    example below to restrict traffic in accordance with the guidelines contained in DOD

    Instruction 8551.1.

    SW1(config)#ip access-list extended EXTERNAL_ACL_INBOUND

    SW1(config-ext-nacl)#permit tcp any any established

    SW1(config-ext-nacl)#permit tcp host x.11.1.1 eq bgp host x.11.1.2

    SW1(config-ext-nacl)#permit tcp host x.11.1.1 host x.11.1.2 eq bgp

    SW1(config-ext-nacl)#permit icmp host x.11.1.1 host x.11.1.2 echo

    SW1(config-ext-nacl)#permit icmp host x.11.1.1 host x.11.1.2 echo-reply

    …

    … < must be in accordance with DoD Instruction 8551.1>

    …

    SW1(config-ext-nacl)#deny ip any any log-input

    SW1(config-ext-nacl)#exit

    SW1(config)#int g0/2

    SW1(config-if)#ip access-group EXTERNAL_ACL_INBOUND in'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify that the ingress ACL is in accordance with DoD\n8551.1.\nStep 1: Verify\
      \ that an inbound ACL is configured on all external interfaces.\ninterface GigabitEthernet0/2\n ip address x.11.1.2\
      \ 255.255.255.254\n ip access-group EXTERNAL_ACL_INBOUND in\nStep 2. Review the inbound ACL to verify that it is filtering\
      \ traffic in accordance with\nDoD 8551.1.\nip access-list extended EXTERNAL_ACL_INBOUND\n permit tcp any any established\n\
      \ permit tcp host x.11.1.1 eq bgp host x.1"
    severity: medium
- id: '1.24'
  title: CISC-RT-000330
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco perimeter switch must be configured to filter ingress traffic at the external interface on an inbound
    direction. GROUP ID: V-221013 RULE ID: SV-221013r622190'
  rationale: 'Access lists are used to separate data traffic into that which it will route (permitted packets) and that which
    it will not route (denied packets). Secure configuration of switches makes use of access lists for restricting access
    to services on the switch itself as well as for filtering traffic passing through the switch. Inbound versus Outbound:
    It should be noted that some operating systems default access lists are applied to the outbound queue. The more secure
    solution is to apply the access list to the inbound queue for three reasons: • The switch can protect itself before damage
    is inflicted. • The input port is still known and can be filtered upon. • It is more efficient to filter packets before
    routing them.'
  impact: ''
  references: []
  page_start: 62
  audit_raw: "Review the switch configuration to verify that an inbound ACL is configured on all\nexternal interfaces as shown\
    \ in the example below:\ninterface GigabitEthernet0/2\n ip address x.11.1.2 255.255.255.254\n ip access-group EXTERNAL_ACL_INBOUND\
    \ in\nIf the switch is not configured to filter traffic entering the network at all external\ninterfaces in an inbound\
    \ direction, this is a finding."
  remediation: 'Configure the switch to use an inbound ACL on all external interfaces as shown in the

    example below:

    SW1(config)#int g0/2

    SW1(config-if)#ip access-group EXTERNAL_ACL_INBOUND in'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify that an inbound ACL is configured on all\nexternal interfaces as shown\
      \ in the example below:\ninterface GigabitEthernet0/2\n ip address x.11.1.2 255.255.255.254\n ip access-group EXTERNAL_ACL_INBOUND\
