  description: 'The Cisco Multicast Source Discovery Protocol (MSDP) switch must be configured to authenticate all received
    MSDP packets. GROUP ID: V-221065 RULE ID: SV-221065r856428'
  rationale: MSDP peering with customer network switches presents additional risks to the core, whether from a rogue or misconfigured
    MSDP-enabled switch. MSDP password authentication is used to validate each segment sent on the TCP connection between
    MSDP peers, protecting the MSDP session against the threat of spoofed packets being injected into the TCP connection stream.
  impact: ''
  references: []
  page_start: 191
  audit_raw: 'Review the switch configuration to determine if received MSDP packets are

    authenticated.

    ip msdp peer x.1.28.8 remote-as 8

