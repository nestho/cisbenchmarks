    severity: medium
- id: '1.57'
  title: CISC-RT-000640
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco PE switch must be configured to have each Virtual Routing and Forwarding (VRF) instance with the
    appropriate Route Target (RT). GROUP ID: V-221038 RULE ID: SV-221038r622190'
  rationale: The primary security model for an MPLS L3VPN as well as a VRF-lite infrastructure is traffic separation. Each
    interface can only be associated to one VRF, which is the fundamental framework for traffic separation. Forwarding decisions
    are made based on the routing table belonging to the VRF. Control of what routes are imported into or exported from a
    VRF is based on the RT. It is critical that traffic does not leak from one COI tenant or L3VPN to another; hence, it is
    imperative that the correct RT is configured for each VRF.
  impact: ''
  references: []
