- id: '1.78'
  title: CISC-RT-000850
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco multicast Rendezvous Point (RP) must be configured to rate limit the number of Protocol Independent
    Multicast (PIM) Register messages. GROUP ID: V-221059 RULE ID: SV-221059r856422'
  rationale: When a new source starts transmitting in a PIM Sparse Mode network, the DR will encapsulate the multicast packets
    into register messages and forward them to the RP using unicast. This process can be taxing on the CPU for both the DR
    and the RP if the source is running at a high data rate and there are many new sources starting at the same time. This
    scenario can potentially occur immediately after a network failover. The rate limit for the number of register messages
    should be set to a relatively low value based on the known number of multicast sources within the multicast domain.
  impact: ''
  references: []
  page_start: 180
  audit_raw: 'Review the configuration of the RP to verify that it is rate limiting the number of PIM

    register messages.

    ip pim rp-address 10.2.2.2

    ip pim register-rate-limit nn

    If the RP is not limiting PIM register messages, this is a finding.'
  remediation: 'Configure the RP to rate limit the number of multicast register messages.

    SW2(config)#ip pim register-rate-limit nn'
  checks:
  - type: manual_review
    info: 'Review the configuration of the RP to verify that it is rate limiting the number of PIM

