- id: '1.66'
  title: CISC-RT-000730
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco PE switch must be configured to block any traffic that is destined to the IP core infrastructure.
    GROUP ID: V-221047 RULE ID: SV-221047r622190'
  rationale: IP addresses can be guessed. Core network elements must not be accessible from any external host. Protecting
    the core from any attack is vital for the integrity and privacy of customer traffic as well as the availability of transit
    services. A compromise of the IP core can result in an outage or, at a minimum, non-optimized forwarding of customer traffic.
    Protecting the core from an outside attack also prevents attackers from using the core to attack any customer. Hence,
    it is imperative that all switches at the edge deny traffic destined to any address belonging to the IP core infrastructure.
  impact: ''
  references: []
  page_start: 148
  audit_raw: "Step 1: Review the switch configuration to verify that an ingress ACL is applied to all\nexternal or CE-facing\
    \ interfaces.\ninterface GigabitEthernet0/2\n no switchport\n ip address x.1.12.2 255.255.255.252\n ip access-group BLOCK_TO_CORE\
    \ in\nStep 2: Verify that the ingress ACL discards and logs packets destined to the IP core\naddress space.\nip access-list\
    \ extended BLOCK_TO_CORE\n deny ip any 10.1.x.0 0.0.255.255 log-input\n permit ip any any\n!\nIf the PE switch is not\
    \ configured to block any traffic with a destination address assigned\nto the IP core infrastructure, this is a finding.\n\
    Note: Internet Control Message Protocol (ICMP) echo requests and traceroutes will be\nallowed to the edge from external\
    \ adjacent neighbors."
  remediation: 'Configure protection for the IP core to be implemented at the edges by blocking any

    traffic with a destination address assigned to the IP core infrastructure.

    Step 1: Configure an ingress ACL to discard and log packets destined to the IP core

    address space.

    SW2(config)#ip access-list extended BLOCK_TO_CORE

    SW2(config-ext-nacl)#deny ip any 10.1.x.0 0.0.255.255 log-input

    SW2(config-ext-nacl)#exit

    Step 2: Apply the ACL inbound to all external or CE-facing interfaces.

    SW2(config)#int SW1(config)#int g0/2

    SW2(config-if)#ip access-group BLOCK_TO_CORE in

    SW2(config-if)#end'
  checks:
