    \ 13:13 has been\nconfigured for customer 1.\nip vrf CUST1\n rd 13:13\n route-target export 13:13\n route-target import\
    \ 13:13\nIf there are VRFs configured with the wrong RT, this is a finding."
  remediation: 'Configure the switch to have each VRF instance defined with the correct RT.

