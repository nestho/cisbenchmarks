- id: '1.45'
  title: CISC-RT-000520
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco BGP switch must be configured to reject outbound route advertisements for any prefixes that do not
    belong to any customers or the local autonomous system (AS). GROUP ID: V-221026 RULE ID: SV-221026r622190'
  rationale: Advertisement of routes by an autonomous system for networks that do not belong to any of its customers pulls
    traffic away from the authorized network. This causes a denial of service (DoS) on the network that allocated the block
    of addresses and may cause a DoS on the network that is inadvertently advertising it as the originator. It is also possible
    that a misconfigured or compromised switch within the GIG IP core could redistribute Interior Gateway Protocol (IGP) routes
    into BGP, thereby leaking internal routes.
  impact: ''
  references: []
  page_start: 106
  audit_raw: "Step 1: Verify that a prefix list has been configured containing prefixes belonging to\ncustomers as well as\
    \ the local AS as shown in the example below:\nip prefix-list CE_PREFIX_ADVERTISEMENTS seq 5 permit x.13.1.0/24 le 32\n\
    ip prefix-list CE_PREFIX_ADVERTISEMENTS seq 10 permit x.13.2.0/24 le 32\nip prefix-list CE_PREFIX_ADVERTISEMENTS seq 15\
    \ permit x.13.3.0/24 le 32\nip prefix-list CE_PREFIX_ADVERTISEMENTS seq 20 permit x.13.4.0/24 le 32\n…\n…\n…\nip prefix-list\
