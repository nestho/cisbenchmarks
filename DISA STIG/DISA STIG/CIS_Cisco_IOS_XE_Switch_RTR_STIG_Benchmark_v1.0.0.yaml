  description: 'The Cisco perimeter switch must be configured to drop IPv6 undetermined transport packets. GROUP ID: V-237762
    RULE ID: SV-237762r950991'
  rationale: One of the fragmentation weaknesses known in IPv6 is the undetermined transport packet. This packet contains
    an undetermined protocol due to fragmentation. Depending on the length of the IPv6 extension header chain, the initial
    fragment may not contain the layer four port information of the packet.
