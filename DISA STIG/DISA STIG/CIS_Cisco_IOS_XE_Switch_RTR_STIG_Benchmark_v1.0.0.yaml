    If the switch does not require MSDP authentication, this is a finding.'
  remediation: 'Configure the switch to authenticate MSDP messages as shown in the following

    example:

    SW2(config)#ip msdp password peer x.1.28.8 xxxxxxxxxxxx'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to determine if received MSDP packets are

      authenticated.

