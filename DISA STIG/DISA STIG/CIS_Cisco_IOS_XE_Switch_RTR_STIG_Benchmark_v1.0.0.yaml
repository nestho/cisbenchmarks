    severity: medium
- id: '1.85'
  title: CISC-RT-000920
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco Multicast Source Discovery Protocol (MSDP) switch must be configured to filter received source-active
    multicast advertisements for any undesirable multicast groups and sources. GROUP ID: V-221066 RULE ID: SV-221066r622190'
  rationale: The interoperability of BGP extensions for interdomain multicast routing and MSDP enables seamless connectivity
    of multicast domains between autonomous systems. MP-BGP advertises the unicast prefixes of the multicast sources used
    by Protocol Independent Multicast (PIM) switches to perform RPF checks and build multicast distribution trees. MSDP is
    a mechanism used to connect multiple PIM sparse-mode domains, allowing RPs from different domains to share information
    about active sources. When RPs in peering multicast domains hear about active sources, they can pass on that information
    to their local receivers, thereby allowing multicast data to be forwarded between the domains. Configuring an import policy
    to block multicast advertisements for reserved, Martian, single-source multicast, and any other undesirable multicast
    groups, as well as any source-group (S, G) states with Bogon source addresses, would assist in avoiding unwanted multicast
    traffic from traversing the core.
  impact: ''
  references: []
  page_start: 192
  audit_raw: "Review the switch configuration to determine if there is import policy to block sourceactive multicast advertisements\
    \ for any undesirable multicast groups, as well as any (S,\nG) states with undesirable source addresses.\nStep 1: Verify\
    \ that an inbound source-active filter is bound to each MSDP peer.\nip msdp peer x.1.28.2 remote-as 2\nip msdp sa-filter\
    \ in x.1.28.2 list INBOUND_MSDP_SA_FILTER\nStep 2: Review the access lists referenced by the source-active filter to verify\
    \ that\nundesirable multicast groups, auto-RP, single source multicast (SSM) groups, and\nadvertisements from undesirable\
    \ sources are blocked.\nip access-list extended INBOUND_MSDP_SA_FILTER\n deny ip any host 224.0.1.3\n deny ip any host\
    \ 224.0.1.24\n deny ip any host 224.0.1.22\n deny ip any host 224.0.1.2\n deny ip any host 224.0.1.35\n deny ip any host\
    \ 224.0.1.60\n deny ip any host 224.0.1.39\n deny ip any host 224.0.1.40\n deny ip any 232.0.0.0 0.255.255.255\n deny\
    \ ip any 239.0.0.0 0.255.255.255\n deny ip 10.0.0.0 0.255.255.255 any\n deny ip 127.0.0.0 0.255.255.255 any\n deny ip\
    \ 172.16.0.0 0.15.255.255 any\n deny ip 192.168.0.0 0.0.255.255 any\n permit ip any any\nIf the switch is not configured\
    \ with an import policy to filter undesirable SA multicast\nadvertisements, this is a finding."
  remediation: 'Configure the MSDP switch to filter received source-active multicast advertisements for

    any undesirable multicast groups and sources as shown in the example below:

    SW1(config)#ip access-list extended INBOUND_MSDP_SA_FILTER

    SW1(config-ext-nacl)#deny ip any host 224.0.1.3 ! Rwhod

    SW1(config-ext-nacl)#deny ip any host 224.0.1.24 ! Microsoft-ds

    SW1(config-ext-nacl)#deny ip any host 224.0.1.22 ! SVRLOC

    SW1(config-ext-nacl)#deny ip any host 224.0.1.2 ! SGI-Dogfight

    SW1(config-ext-nacl)#deny ip any host 224.0.1.35 ! SVRLOC-DA

    SW1(config-ext-nacl)#deny ip any host 224.0.1.60 ! hp-device-disc

    SW1(config-ext-nacl)#deny ip any host 224.0.1.39 ! Auto-RP

    SW1(config-ext-nacl)#deny ip any host 224.0.1.40 ! Auto-RP

    SW1(config-ext-nacl)#deny ip any 232.0.0.0 0.255.255.255 ! SSM range

    SW1(config-ext-nacl)#deny ip any 239.0.0.0 0.255.255.255 ! Admin scoped range

    SW1(config-ext-nacl)#deny ip 10.0.0.0 0.255.255.255 any ! RFC 1918 address

    range

    SW1(config-ext-nacl)#deny ip 127.0.0.0 0.255.255.255 any ! RFC 1918 address

    range

    SW1(config-ext-nacl)#deny ip 172.16.0.0 0.15.255.255 any ! RFC 1918 address

    range

    SW1(config-ext-nacl)#deny ip 192.168.0.0 0.0.255.255 any ! RFC 1918 address

    range

    SW1(config-ext-nacl)#permit ip any any

    SW1(config-ext-nacl)#exit

    SW1(config)#ip msdp sa-filter in x.1.28.2 list INBOUND_MSDP_SA_FILTER'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to determine if there is import policy to block sourceactive multicast advertisements
      for any undesirable multicast groups, as well as any (S,

      G) states with undesirable source addresses.

      Step 1: Verify that an inbound source-active filter is bound to each MSDP peer.

      ip msdp peer x.1.28.2 remote-as 2

      ip msdp sa-filter in x.1.28.2 list INBOUND_MSDP_SA_FILTER

      Step 2: Review the access lists referenced by the source-active filter to verify that

      undesirable multicast '
    severity: medium
- id: '1.86'
  title: CISC-RT-000930
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco Multicast Source Discovery Protocol (MSDP) switch must be configured to filter source-active multicast
    advertisements to external MSDP peers to avoid global visibility of local-only multicast sources and groups. GROUP ID:
    V-221067 RULE ID: SV-221067r622190'
  rationale: To avoid global visibility of local information, there are a number of source-group (S, G) states in a PIM-SM
    domain that must not be leaked to another domain, such as multicast sources with private address, administratively scoped
    multicast addresses, and the auto-RP groups (224.0.1.39 and 224.0.1.40). Allowing a multicast distribution tree, local
    to the core, to extend beyond its boundary could enable local multicast traffic to leak into other autonomous systems
    and customer networks.
  impact: ''
  references: []
  page_start: 195
  audit_raw: "Review the switch configuration to determine if there is export policy to block local\nsource-active multicast\
    \ advertisements.\nStep 1: Verify that an outbound source-active filter is bound to each MSDP peer as\nshown in the example\
    \ below:\nip msdp peer 10.1.28.8 remote-as 8\nip msdp sa-filter out 10.1.28.8 list OUTBOUND_MSDP_SA_FILTER\nStep 2: Review\
    \ the access lists referenced by the source-active filters and verify that\nMSDP source-active messages being sent to\
    \ MSDP peers do not leak advertisements\nthat are local.\nip access-list extended OUTBOUND_MSDP_SA_FILTER\n deny ip 10.0.0.0\
    \ 0.255.255.255 any\n permit ip any any\nIf the switch is not configured with an export policy to filter local source-active\
    \ multicast\nadvertisements, this is a finding."
  remediation: 'Configure the switch with an export policy avoid global visibility of local multicast (S, G)

    states. The example below will prevent exporting multicast active sources belonging to

    the private network.

    SW1(config)#ip access-list extended OUTBOUND_MSDP_SA_FILTER

    SW1(config-ext-nacl)#deny ip 10.0.0.0 0.255.255.255 any

    SW1(config-ext-nacl)#permit ip any any

    SW1(config-ext-nacl)#exit

    SW1(config)#ip msdp sa-filter in x.1.28.2 list OUTBOUND_MSDP_SA_FILTER'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to determine if there is export policy to block local

      source-active multicast advertisements.

      Step 1: Verify that an outbound source-active filter is bound to each MSDP peer as

      shown in the example below:

      ip msdp peer 10.1.28.8 remote-as 8

      ip msdp sa-filter out 10.1.28.8 list OUTBOUND_MSDP_SA_FILTER

      Step 2: Review the access lists referenced by the source-active filters and verify that

      MSDP source-active messages being sent to MSDP peers do not leak advertisements'
    severity: medium
