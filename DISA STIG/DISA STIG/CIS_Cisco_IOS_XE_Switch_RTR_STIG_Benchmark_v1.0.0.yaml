    severity: medium
- id: '1.88'
  title: CISC-RT-000950
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco Multicast Source Discovery Protocol (MSDP) switch must be configured to use a loopback address as
    the source address when originating MSDP traffic. GROUP ID: V-221069 RULE ID: SV-221069r622190'
  rationale: Using a loopback address as the source address offers a multitude of uses for security, access, management, and
    scalability of MSDP switches. It is easier to construct appropriate ingress filters for switch management plane traffic
    destined to the network management subnet since the source addresses will be from the range used for loopback interfaces
    instead of a larger range of addresses used for physical interfaces. Log information recorded by authentication and syslog
    servers will record the switch’s loopback address instead of the numerous physical interface addresses.
  impact: ''
  references: []
  page_start: 198
  audit_raw: "Step 1: Review the switch configuration to verify that a loopback address has been\nconfigured.\ninterface Loopback12\n\
    \ ip address x.12.2.2 255.255.255.255\nStep 2: Verify that the loopback interface is used as the source address for all\
    \ MSDP\npackets generated by the switch.\nip msdp peer x.44.2.34 connect-source Loopback12 remote-as nn\nIf the switch\
    \ does not use its loopback address as the source address when originating\nMSDP traffic, this is a finding."
  remediation: 'Configure the switch to use its loopback address is used as the source address when

    sending MSDP packets.

    SW2(config)#ip msdp peer x.44.2.34 connect-source lo12 remote-as nn'
  checks:
  - type: manual_review
    info: "Step 1: Review the switch configuration to verify that a loopback address has been\nconfigured.\ninterface Loopback12\n\
      \ ip address x.12.2.2 255.255.255.255\nStep 2: Verify that the loopback interface is used as the source address for\
      \ all MSDP\npackets generated by the switch.\nip msdp peer x.44.2.34 connect-source Loopback12 remote-as nn\nIf the\
      \ switch does not use its loopback address as the source address when originating\nMSDP traffic, this is a finding."
    severity: medium
