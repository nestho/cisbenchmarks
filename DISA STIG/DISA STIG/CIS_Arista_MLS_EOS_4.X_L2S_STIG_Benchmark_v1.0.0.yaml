- id: '1.1'
  title: ARST-L2-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Arista MLS layer 2 switch must uniquely identify all network-connected endpoint devices before establishing
    any connection. GROUP ID: V-255968 RULE ID: SV-255968r882246'
  rationale: 'Controlling LAN access via 802.1x authentication can assist in preventing a malicious user from connecting an
    unauthorized PC to a switch port to inject or receive data from the network without detection. Satisfies: SRG-NET-000148-L2S-000015,
    SRG-NET-000343-L2S-000016'
  impact: ''
  references: []
  page_start: 11
  audit_raw: "Verify the Arista MLS switch configuration has 802.1x authentication implemented for all\naccess switch ports\
    \ connecting to LAN outlets (i.e., RJ-45 wall plates) or devices not\nlocated in the telecom room, wiring closets, or\
    \ equipment rooms. MAC Authentication\nBypass (MAB) must be configured on switch ports connected to devices that do not\n\
    provide an 802.1x supplicant.\nVerify the Arista MLS switch configuration for 802.1x is configured globally and, on the\n\
    required host-based access ports or MAB, is configured on ports that require RADIUS\nand MAC-based supplicants.\nswitch#\
    \ show run | section dot1x\nlogging level DOT1X informational\naaa authentication dot1x default group radius\ndot1x system-auth-control\n\
    !\ninterface Ethernet6\n description 802.1X Access Network\n switchport access vlan 100\n dot1x pae authenticator\n dot1x\
    \ reauthentication\n dot1x port-control auto\n dot1x host-mode single-host\n dot1x timeout quiet-period 10\n!\ninterface\
    \ Ethernet7\n description STIG MAC-Based Authentication\n speed 100full\n dot1x pae authenticator\n dot1x port-control\
    \ auto\n dot1x mac based authentication\n!\nIf 802.1x authentication or MAB is not configured on all access switch ports\
    \ connecting\nto LAN outlets or devices not located in the telecom room, wiring closets, or equipment\nrooms, this is\
    \ a finding."
  remediation: "Configure Arista MLS switch for 802.1X globally with the following mandatory\nparameters, and then configure\
    \ non-data center access ports and all applicable\ninterfaces.\nStep 1: Configure the Arista MLS switch for 802.1X globally\
    \ using the following\ncommands:\n!\nlogging level DOT1X informational\naaa authentication dot1x default group radius\n\
    dot1x system-auth-control\n!\nStep 2: Configure the Arista switch for all non-data center access ports with 802.1X\nVLAN\
    \ to an access/trunk port and set the 802.1X port access entity (PAE) to\nauthenticator with the following commands:\n\
    interface Ethernet4\ndescription 802.1X Host-Mode Access Port\n switchport access vlan 100\n dot1x pae authenticator\n\
    \ dot1x reauthentication\n dot1x port-control auto\n dot1x host-mode single-host\n dot1x timeout quiet-period 10\n!\n\
    Step 3: The Arista switch can be also configured for MAC-based authentication.\nConfiguring MAB requires that every supplicant\
    \ trying to gain access to the switch\nauthenticator port is individually authenticated by MAC address as opposed to\n\
    authenticating just one supplicant on a given VLAN or port with 802.1X, and then using\nthe MAC address of these devices\
    \ as username and password in the RADIUS request\npackets.\n!\ninterface Ethernet7\n description MAC-Based Authentication\n\
    \ speed 100full\n dot1x pae authenticator\n dot1x port-control auto\n dot1x mac based authentication\n!"
  checks:
  - type: sql
    command: show run | section dot1x
    severity: medium
    info: 'Verify the Arista MLS switch configuration has 802.1x authentication implemented for all

      access switch ports connecting to LAN outlets (i.e., RJ-45 wall plates) or devices not

      located in the telecom room, wiring closets, or equipment rooms. MAC Authentication

      Bypass (MAB) must be configured on switch ports connected to devices that do not

      provide an 802.1x supplicant.

      Verify the Arista MLS switch '
- id: '1.2'
  title: ARST-L2-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista MLS layer 2 switch must be configured for Storm Control to limit the effects of packet flooding
    types of denial-of-service (DoS) attacks. GROUP ID: V-255969 RULE ID: SV-255969r991773'
  rationale: 'Denial of service is a condition when a resource is not available for legitimate users. Packet flooding distributed
    DoS (DDoS) attacks are referred to as volumetric attacks and have the objective of overloading a network or circuit to
    deny or seriously degrade performance, which denies access to the services that normally traverse the network or circuit.
    Volumetric attacks have become relatively easy to launch by using readily available tools such as Low Orbit Ion Cannon
    or by using botnets. Measures to mitigate the effects of a successful volumetric attack must be taken to ensure that sufficient
    capacity is available for mission-critical traffic. Managing capacity may include, for example, establishing selected
    network usage priorities or quotas and enforcing them using rate limiting, Quality of Service (QoS), or other resource
    reservation control methods. These measures may also mitigate the effects of sudden decreases in network capacity that
    are the result of accidental or intentional physical damage to telecommunications facilities (such as cable cuts or weather-related
    outages). Satisfies: SRG-NET-000193-L2S-000020, SRG-NET-000362-L2S-000024, SRG-NET000512-L2S-000001'
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Verify the Arista MLS switch is configured for storm-control on applicable Ethernet

    interfaces.

    switch#show storm-control

    Port Type Level Rate(Mbps) Status Drops Reason

    Et10/2 all 75 7500 active 0

    Et4 multicast 55 5500 active 0

    Et4 broadcast 50 5000 active

    switch#

    If the Arista MLS switch is not configured to implement a storm-control policy, this is a

    finding.'
  remediation: "The Arista MLS switch must be configured to implement a storm-control policy for traffic\nprioritization and\
    \ bandwidth reservation.\nStorm-control on switch Ethernet interfaces can be configured to limit the packets based\non\
    \ broadcast, multicast, and unknown-unicast traffic:\nswitch#configure\nswitch(config)#internet et[X]\ninterface Ethernet[X]\n\
    switchport\n storm-control broadcast level pps 5000\n storm-control multicast level pps 5000\n storm-control unknown-unicast\
    \ level pps 5000"
  checks:
  - type: sql
    command: show storm-control
    severity: medium
    info: 'Verify the Arista MLS switch is configured for storm-control on applicable Ethernet

      interfaces.

      switch#show storm-control

      Port Type Level Rate(Mbps) Status Drops Reason

      Et10/2 all 75 7500 active 0

      Et4 multicast 55 5500 active 0

      Et4 broadcast 50 5000 active

      switch#

      If the Arista MLS switch is not configured to implement a storm-control policy, this is a

      finding.'
- id: '1.3'
  title: ARST-L2-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Arista MLS switch must have Root Guard enabled on all switch ports connecting to access layer switches
    and hosts. GROUP ID: V-255970 RULE ID: SV-255970r882252'
  rationale: Spanning Tree Protocol (STP) does not provide any means for the network administrator to securely enforce the
    topology of the switched network. Any switch can be the root bridge in a network. However, a more optimal forwarding topology
    places the root bridge at a specific predetermined location. With the standard STP, any bridge in the network with a lower
    bridge ID takes the role of the root bridge. The administrator cannot enforce the position of the root bridge but can
    set the root bridge priority to 0 in an effort to secure the root bridge position.
  impact: ''
  references: []
  page_start: 17
  audit_raw: "Review the Arista MLS switch topology as well as the configuration to verify that root\nguard is enabled on\
    \ switch ports facing switches that are downstream from the root\nbridge.\nExample:\nswitch#sh run | sec guard root\n\
    interface Ethernet37\n spanning-tree guard root\nIf the Arista MLS switch has not enabled guard root on all ports connecting\
    \ to the\naccess layer where the root bridge must not appear, this is a finding."
  remediation: 'The Arista MLS switch must be configured for spanning-tree guard root mode on all

    ports connecting to the access layer interface.

    Configure Arista MLS switch Ethernet interface with the following commands:

    switch#config

    switch(config)interface Ethernet[X]

    switch(config-if-Et[X])#spanning-tree guard root

    switch(config-if-Et[X])#exit

    !'
  checks:
  - type: manual_review
    info: "Review the Arista MLS switch topology as well as the configuration to verify that root\nguard is enabled on switch\
      \ ports facing switches that are downstream from the root\nbridge.\nExample:\nswitch#sh run | sec guard root\ninterface\
      \ Ethernet37\n spanning-tree guard root\nIf the Arista MLS switch has not enabled guard root on all ports connecting\
      \ to the\naccess layer where the root bridge must not appear, this is a finding."
    severity: medium
- id: '1.4'
  title: ARST-L2-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista MLS layer 2 switch must have BPDU Guard enabled on all switch ports connecting to access layer
    switches and hosts. GROUP ID: V-255971 RULE ID: SV-255971r882255'
  rationale: If a rogue switch is introduced into the topology and transmits a Bridge Protocol Data Unit (BPDU) with a lower
    bridge priority than the existing root bridge, it will become the new root bridge and cause a topology change, rendering
    the network in a suboptimal state. The STP PortFast BPDU guard enhancement allows network designers to enforce the STP
    domain borders and keep the active topology predictable. The devices behind the ports that have STP PortFast enabled are
    not able to influence the STP topology. At the reception of BPDUs, the BPDU guard operation disables the port that has
    PortFast configured. The BPDU guard transitions the port into a disabled state and sends a log message.
  impact: ''
  references: []
  page_start: 19
  audit_raw: "Review the Arista MLS to verify that BPDU Guard is enabled on all user-facing or\nuntrusted access switch ports.\n\
    switch#show run | section bpdu\ninterface Ethernet37\n spanning-tree bpduguard enable\nIf the Arista MLS switch has not\
    \ enabled BPDU Guard, this is a finding."
  remediation: 'The Arista MLS switch provides the capability to configure "spanning-tree bpduguard".

    Configure the Ethernet interface commands:

    config

    interface Ethernet[X]

    switch(config)#interface ethernet [X]

    switch(config-if-Et[X])#spanning-tree bpduguard enabled

    switch(config-if-Et[X])'
  checks:
  - type: sql
    command: show run | section bpdu
    severity: medium
    info: "Review the Arista MLS to verify that BPDU Guard is enabled on all user-facing or\nuntrusted access switch ports.\n\
      switch#show run | section bpdu\ninterface Ethernet37\n spanning-tree bpduguard enable\nIf the Arista MLS switch has\
      \ not enabled BPDU Guard, this is a finding."
- id: '1.5'
  title: ARST-L2-000070
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista MLS switch must have STP Loop Guard enabled on all nondesignated STP switch ports. GROUP ID: V-255972
    RULE ID: SV-255972r1107168'
  rationale: The Spanning Tree Protocol (STP) loop guard feature provides additional protection against STP loops. An STP
    loop is created when an STP blocking port in a redundant topology erroneously transitions to the forwarding state. In
    its operation, STP relies on continuous reception and transmission of BPDUs based on the port role. The designated port
    transmits BPDUs, and the nondesignated port receives BPDUs. When one of the ports in a physically redundant topology no
    longer receives BPDUs, the STP conceives that the topology is loop free. Eventually, the blocking port from the alternate
    or backup port becomes a designated port and moves to a forwarding state. This situation creates a loop. The loop guard
    feature makes additional checks. If BPDUs are not received on a nondesignated port and loop guard is enabled, that port
    is moved into the STP loop-inconsistent blocking state. In topologies where fiber optic interconnections are used, physical
    misconnections can occur that allow a link to appear to be up when there is a mismatched set of transmit/receive pairs.
    When such a physical misconfiguration occurs, protocols such as STP can cause network instability.
  impact: ''
  references: []
  page_start: 21
  audit_raw: "Review the Arista MLS switch configuration to verify that STP Loop Guard is enabled. It\ncan be enabled globally\
    \ or applied to an interface.\nNote: Arista uses STP Loop guard to protect against one-way connections.\nswitch# sh run\
    \ | sec spanning-tree\nspanning-tree guard loop default\nOr,\ninterface Ethernet6\n spanning-tree guard loop\nIf STP Loop\
    \ Guard is not configured globally or on nondesignated STP ports, this is a\nfinding."
  remediation: 'Configure the Arista MLS switch for STP Loop Guard globally with the following

    command:

    switch(config)#spanning-tree guard loop default

    switch(config)#

    Alternatively, configure Loop Guard on each interface:

    switch(config-if-Eth6)# spanning-tree guard loop'
  checks:
  - type: manual_review
    info: "Review the Arista MLS switch configuration to verify that STP Loop Guard is enabled. It\ncan be enabled globally\
      \ or applied to an interface.\nNote: Arista uses STP Loop guard to protect against one-way connections.\nswitch# sh\
      \ run | sec spanning-tree\nspanning-tree guard loop default\nOr,\ninterface Ethernet6\n spanning-tree guard loop\nIf\
      \ STP Loop Guard is not configured globally or on nondesignated STP ports, this is a\nfinding."
    severity: medium
- id: '1.6'
  title: ARST-L2-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista MLS layer 2 switch must have DHCP snooping for all user VLANs to validate DHCP messages from untrusted
    sources. GROUP ID: V-255973 RULE ID: SV-255973r882261'
  rationale: In an enterprise network, devices under administrative control are trusted sources. These devices include the
    switches, routers, and servers in the network. Host ports and unknown DHCP servers are considered untrusted sources. An
    unknown DHCP server on the network on an untrusted port is called a spurious DHCP server, any device (PC, Wireless Access
    Point) that is loaded with DHCP server enabled. The DHCP snooping feature determines whether traffic sources are trusted
    or untrusted. The potential exists for a spurious DHCP server to respond to DHCPDISCOVER messages before the real server
    has time to respond. DHCP snooping allows switches on the network to trust the port a DHCP server is connected to and
    not trust the other ports. The DHCP snooping feature validates DHCP messages received from untrusted sources and filters
    out invalid messages as well as rate-limits DHCP traffic from trusted and untrusted sources. DHCP snooping feature builds
    and maintains a binding database, which contains information about untrusted hosts with leased IP addresses, and it utilizes
    the database to validate subsequent requests from untrusted hosts. Other security features, such as IP Source Guard and
    Dynamic Address Resolution Protocol (ARP) Inspection (DAI), also use information stored in the DHCP snooping binding database.
    Hence, it is imperative that the DHCP snooping feature is enabled on all user VLANs.
  impact: ''
  references: []
  page_start: 23
  audit_raw: "Review the Arista MLS switch configuration and verify that DHCP snooping is enabled\non all user VLANs.\nVerify\
    \ the Arista MLS has the DHCP Snooping feature enabled globally by executing\n\"show ip dhcp snooping\".\nswitch(config)#\
    \ show ip dhcp snooping\nDHCP Snooping is enabled\nDHCP Snooping is operational\nDHCP Snooping is configured on following\
    \ VLANs:\n 650\nDHCP Snooping is operational on following VLANs:\n 650\nIf the Arista MLS switch does not have DHCP snooping\
    \ enabled for all user VLANs to\nvalidate DHCP messages from untrusted sources, this is a finding."
  remediation: "Configure the Arista MLS switch to have DHCP snooping enabled globally and for all\nuser VLANs to validate\
    \ DHCP messages from untrusted sources.\nStep 1: Configure DHCP Snooping globally by using the following command:\nswitch(config)#\
    \ ip dhcp snooping\nStep 2: Configure DHCP Snooping to enable the insertion of option-82 in DHCP request\npackets. By\
    \ default, option-82 is not enabled and without this, DHCP Snooping is not\noperational.\nswitch(config)#ip dhcp snooping\
    \ information option\nStep 3: Configure the Arista MLS switch to enable IP DHCP Snooping on the\ncorresponding VLANs.\
    \ By default, DHCP Snooping will not be enabled on any VLAN.\nswitch(config)#ip dhcp snooping vlan <vlan-id>\nStep 4:\
    \ Configure the following command to set the circuit-id information that will be\nsent in option-82. By default, Interface\
    \ name and VLAN ID are sent. Remote circuit-id\nwill always be the MAC address of the relay agent.\nswitch# ip dhcp snooping\
    \ information option circuit-id type 2 format\n Hostname and interface name\n Interface name and VLAN ID"
  checks:
  - type: sql
    command: show ip dhcp snooping".
    severity: medium
    info: "Review the Arista MLS switch configuration and verify that DHCP snooping is enabled\non all user VLANs.\nVerify\
      \ the Arista MLS has the DHCP Snooping feature enabled globally by executing\n\"show ip dhcp snooping\".\nswitch(config)#\
      \ show ip dhcp snooping\nDHCP Snooping is enabled\nDHCP Snooping is operational\nDHCP Snooping is configured on following\
      \ VLANs:\n 650\nDHCP Snooping is operational on following VLA"
- id: '1.7'
  title: ARST-L2-000130
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Arista MLS layer 2 switch must have IGMP or MLD Snooping configured on all VLANs. GROUP ID: V-255976 RULE
    ID: SV-255976r882270'
  rationale: IGMP and MLD snooping provides a way to constrain multicast traffic at Layer 2. By monitoring the IGMP or MLD
    membership reports sent by hosts within a VLAN, the snooping application can set up Layer 2 multicast forwarding tables
    to deliver specific multicast traffic only to interfaces connected to hosts interested in receiving the traffic, thereby
    significantly reducing the volume of multicast traffic that would otherwise flood the VLAN.
  impact: ''
  references: []
  page_start: 25
  audit_raw: "Review the Arista MLS switch configuration to verify that IGMP or MLD snooping has\nbeen configured.\nDetermine\
    \ which snooping feature is used.\nFor IGMP:\nVerify the PIM that also enables IGMP on an Arista MLS switch VLAN interface\
    \ by using\nthe \"sh run interface vlan8\" command:\nswitch(config)#sh run int vlan8\ninterface VLAN8\n ip igmp\n pim\
    \ ipv4 sparse-mode\nswitch(config)#exit\nFor MLD:\nVerify the Arista MLS switch is configured for MLD snooping on an interface\
    \ for version\n1 and 2. Version 2 is the default MLD version.\nswitch#sh run | section mld\nmld snooping\nvlan 200\nIf\
    \ the Arista switch is not configured to implement IGMP or MLD snooping for each\nVLAN, this is a finding."
  remediation: "Configure the Arista MLS switch for IGMP snooping for IPv4 and IPv6 multicast traffic\nfor each VLAN.\nConfigure\
    \ the Arista MLS switch for IP PIM, which also enables IGMP on an Arista MLS\nswitch VLAN or interface, by using the following\
    \ command:\nswitch(config)#int vlan8\n ip igmp\n pim ipv4 sparse-mode\n pim ipv6 sparse-mode\nswitch(config)#exit\n!\n\
    Arista MLS switch alternative configuration for MLD snooping on an interface for version\n1 and 2. Version 2 is the default\
    \ MLD version.\nswitch(config)# mld snooping\nswitch(config-mld-snooping)# vlan 200\n!"
  checks:
  - type: manual_review
    info: "Review the Arista MLS switch configuration to verify that IGMP or MLD snooping has\nbeen configured.\nDetermine\
      \ which snooping feature is used.\nFor IGMP:\nVerify the PIM that also enables IGMP on an Arista MLS switch VLAN interface\
      \ by using\nthe \"sh run interface vlan8\" command:\nswitch(config)#sh run int vlan8\ninterface VLAN8\n ip igmp\n pim\
      \ ipv4 sparse-mode\nswitch(config)#exit\nFor MLD:\nVerify the Arista MLS switch is configured for MLD snooping on an\
      \ interface for version\n1 and 2. Version 2 is the de"
    severity: medium
- id: '1.8'
  title: ARST-L2-000110
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista MLS layer 2 switch must have Dynamic Address Resolution Protocol (ARP) Inspection (DAI) enabled
    on all user VLANs. GROUP ID: V-255975 RULE ID: SV-255975r882267'
  rationale: DAI intercepts Address Resolution Protocol (ARP) requests and verifies that each of these packets has a valid
    IP-to-MAC address binding before updating the local ARP cache and before forwarding the packet to the appropriate destination.
    Invalid ARP packets are dropped and logged. DAI determines the validity of an ARP packet based on valid IP-to-MAC address
    bindings stored in the DHCP snooping binding database. If the ARP packet is received on a trusted interface, the switch
    forwards the packet without any checks. On untrusted interfaces, the switch forwards the packet only if it is valid.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'Review the Arista MLS switch configuration to verify that Dynamic Address Resolution

    Protocol (ARP) Inspection (DAI) feature is enabled on all user VLANs.

    Verify ARP inspection for user VLANs by the following command:

    sh ip arp inspection vlan

    VLAN 2200

    ------------

    Configuration: Enabled

    Operation State: Active

    If static ARP inspection is not enabled on all user VLANs, this is a finding.'
  remediation: 'Configure the Arista MLS switch to have static Address Resolution Protocol (ARP)

    Inspection to be enabled on all user VLANs.

    By default, Arista MLS switch static ARP Inspection is disabled on all VLANs. Static

    ARP inspection can be enabled on all specific user VLANs by using the following

    command:

    switch(config)#ip arp inspection vlan <vlan-list>'
  checks:
  - type: manual_review
    info: 'Review the Arista MLS switch configuration to verify that Dynamic Address Resolution

      Protocol (ARP) Inspection (DAI) feature is enabled on all user VLANs.

      Verify ARP inspection for user VLANs by the following command:

      sh ip arp inspection vlan

      VLAN 2200

      ------------

      Configuration: Enabled

      Operation State: Active

      If static ARP inspection is not enabled on all user VLANs, this is a finding.'
    severity: medium
- id: '1.9'
  title: ARST-L2-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista MLS layer 2 switch must have IP Source Guard enabled on all user-facing or untrusted access switch
    ports. GROUP ID: V-255974 RULE ID: SV-255974r882264'
  rationale: IP Source Guard (IPSG) provides source IP address filtering on a layer 2 port to prevent a malicious host from
    impersonating a legitimate host by assuming the legitimate host's IP address. The feature uses dynamic DHCP snooping and
    static IP source binding to match IP addresses to hosts on untrusted Layer 2 access ports. Initially, all IP traffic on
    the protected port is blocked except for DHCP packets. After a client receives an IP address from the DHCP server, or
    after static IP source binding is configured by the administrator, all traffic with that IP source address is permitted
    from that client. Traffic from other hosts is denied. This filtering limits a host's ability to attack the network by
    claiming a neighbor host's IP address.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'Review the Arista MLS switch configuration to verify that IPSG is enabled on all userfacing or untrusted access
    switch ports.

    Step 1: The Arista MLS switch command verifies the IPSG configuration and

    operational states.

    switch(config)#show ip verify source

    Interface Operational State

    --------------- ------------------------

    Ethernet1 IP source guard enabled

    Ethernet2 IP source guard disabled

    Step 2: The following command displays all VLANs configured in no IP verify source

    VLAN:

    switch(config)#show ip verify source vlan

    IPSG disabled on VLANS: 1-2

    VLAN Operational State

    --------------- ------------------------

    1 IP source guard disabled

    2 Error: vlan classification failed

    If the Arista MLS switch does not have IP Source Guard enabled on all untrusted

    access switch ports, this is a finding.'
  remediation: 'Configure the Arista MLS switch to have IPSG enabled on all user-facing or untrusted

    access switch ports.

    Step 1: The Arista MLS IPSG feature must be configured by applying filters to inbound

    IP packets based on their source MAC and IP addresses. The following example

    commands exclude VLAN IDs 1 through 3 from IPSG filtering. When enabled on a trunk

    port, IPSG filters the inbound IP packets on all allowed VLANs. IP packets received on

    VLANs 4 through 10 on Ethernet 36 will be filtered by IPSG, while those received on

    VLANs 1 through 3 are permitted.

    switch(config)#no ip verify source vlan 1-3

    switch(config)#interface ethernet 36

    switch(config-if-Et36)#switchport mode trunk

    switch(config-if-Et36)#switchport trunk allowed vlan 1-10

    switch(config-if-Et36)#ip verify source

    switch(config-if-Et36)#

    Step 2: By using the Arista MLS switch command, the switch binds the source IP-MAC

    binding entries to IP address 10.1.1.1, MAC address 0000.aaaa.1111, VLAN ID 4094,

    and Ethernet interface 36.

    switch(config)#ip source binding 10.1.1.1 0000.aaaa.1111 vlan 4094 interface

    ethernet 36

    switch(config)#'
  checks:
  - type: sql
    command: show ip verify source
    severity: medium
    info: 'Review the Arista MLS switch configuration to verify that IPSG is enabled on all userfacing or untrusted access
      switch ports.

      Step 1: The Arista MLS switch command verifies the IPSG configuration and

      operational states.

      switch(config)#show ip verify source

      Interface Operational State

      --------------- ------------------------

      Ethernet1 IP source guard enabled

      Ethernet2 IP source guard disabled

      Step '
- id: '1.10'
  title: ARST-L2-000140
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista MLS layer 2 Arista MLS switch must implement Rapid STP where VLANs span multiple switches with
    redundant links. GROUP ID: V-255977 RULE ID: SV-255977r882273'
  rationale: Spanning Tree Protocol (STP) is implemented on bridges and switches to prevent layer 2 loops when a broadcast
    domain spans multiple bridges and switches and when redundant links are provisioned to provide high availability in case
    of link failures. Convergence time can be significantly reduced using Multiple Spanning-Tree (802.1s) instead of Rapid
    STP (802.1w) instead of STP (802.1d), resulting in improved availability. Multiple Spanning-Tree Protocol (MSTP) should
    be deployed by implementing either Rapid Per-VLAN-Spanning-Tree (Rapid-PVST) or Multiple Spanning-Tree MST, the latter
    scales topologies much better when there are many VLANs.
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'In cases where VLANs do not span multiple switches, it is a best practice to not

    implement STP. Avoiding the use of STP will provide the most deterministic and highly

    available network topology. If STP is required, review the Arista MLS switch

    configuration to verify that Rapid STP has been implemented.

    switch(config)#sh run | sec spanning-tree

    spanning-tree mode rstp

    !

    Note: MSTP can be configured as an alternate mode. MSTP uses RSTP for rapid

    convergence and enables multiple VLANs to be grouped into and mapped to the same

    spanning-tree instance, thereby reducing the number of spanning-tree instances

    needed to support a large number of VLANs.

    If MSTP or Rapid STP has not been implemented where STP is required, this is a

    finding.'
  remediation: 'Configure the Arista MLS switch for Multiple Spanning-tree (MST) or Rapid STP to be

    implemented at the access and distribution layers where VLANs span multiple switches.

    switch(config)#spanning-tree mode mstp

    The Arista MLS switch can alternatively be configured for spanning-tree mode RSTP to

    support a spanning-tree instance for each VLAN:

    switch(config)#

    spanning-tree mode rstp

    !'
  checks:
  - type: manual_review
    info: 'In cases where VLANs do not span multiple switches, it is a best practice to not

      implement STP. Avoiding the use of STP will provide the most deterministic and highly

      available network topology. If STP is required, review the Arista MLS switch

      configuration to verify that Rapid STP has been implemented.

      switch(config)#sh run | sec spanning-tree

      spanning-tree mode rstp

      !

      Note: MSTP can be configured as an alternate mode. MSTP uses RSTP for rapid

      convergence and enables multiple VLANs to be groupe'
    severity: medium
- id: '1.11'
  title: ARST-L2-000160
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista MLS layer 2 switch must have all trunk links enabled statically. GROUP ID: V-255979 RULE ID: SV-255979r882279'
  rationale: When trunk negotiation is enabled via Dynamic Trunk Protocol (DTP), considerable time can be spent negotiating
    trunk settings (802.1q or ISL) when a node or interface is restored. While this negotiation is happening, traffic is dropped
    because the link is up from a layer 2 perspective. Packet loss can be eliminated by setting the interface statically to
    trunk mode, thereby avoiding dynamic trunk protocol negotiation and significantly reducing any outage when restoring a
    failed link or switch.
  impact: ''
  references: []
  page_start: 34
  audit_raw: "Review the Arista MLS switch configuration to verify that all Ethernet interfaces\ndesignated as trunk links\
    \ are statically configured to specify only member tagged VLAN\ntraffic is allowed and all nonmember VLAN traffic will\
    \ be dropped unless untagged traffic\nis associated with the interface's native VLAN.\nswitch#show run | section trunk\n\
    !\ninterface Ethernet6\n description STIG Static Trunk\n speed forced 10000full\n switchport trunk native vlan 2102\n\
    \ switchport trunk allowed vlan 2100-2102\n switchport mode trunk\n!\nIf trunk negotiation is enabled on any interface,\
    \ this is a finding."
  remediation: "Configure static Ethernet interfaces for switchport trunk mode. Ensure required VLAN\nmember tagged traffic\
    \ is allowed and all other VLAN traffic will be dropped unless an\nassociated untagged native VLAN for the Ethernet interface\
    \ is allowed.\nswitch#configure\nswitch(config)#interface Ethernet6\n description STIG Static Trunk\n speed forced 10000full\n\
    \ switchport trunk native vlan 2102\n switchport trunk allowed vlan 2100-2102\n switchport mode trunk\n!\nswitch(config)#interface\
    \ Ethernet7\n description STIG Static Trunk\n speed forced 10000full\n switchport trunk native vlan 3102\n switchport\
    \ trunk allowed vlan 3100-3102\n switchport mode trunk\n!"
  checks:
  - type: sql
    command: show run | section trunk
    severity: medium
    info: "Review the Arista MLS switch configuration to verify that all Ethernet interfaces\ndesignated as trunk links are\
      \ statically configured to specify only member tagged VLAN\ntraffic is allowed and all nonmember VLAN traffic will be\
      \ dropped unless untagged traffic\nis associated with the interface's native VLAN.\nswitch#show run | section trunk\n\
      !\ninterface Ethernet6\n description STIG Static Trunk\n speed f"
- id: '1.12'
  title: ARST-L2-000170
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista MLS layer 2 switch must have all disabled switch ports assigned to an unused VLAN. GROUP ID: V-255980
    RULE ID: SV-255980r991774'
  rationale: It is possible that a disabled port that is assigned to a user or management VLAN becomes enabled by accident
    or by an attacker and as a result gains access to that VLAN as a member.
  impact: ''
  references: []
  page_start: 36
  audit_raw: "Step 1: Review the switch configuration and examine all access switch ports. Verify the\nunused port is configured\
    \ to be intentionally shut down and assigned to an inactive\nVLAN.\nswitch(config)#sh run int eth8\ninterface Ethernet8\n\
    \ description PORT IS INTENTIONALLY SHUTDOWN\n switchport access vlan 999\n shutdown\nswitch(config)#\nStep 2: Verify\
    \ traffic from the inactive VLAN is not allowed on any trunk links as shown\nin the example below:\nswitch(config)#sh\
    \ run int eth9\ninterface Ethernet9\n switchport trunk native vlan 1000\n switchport trunk allowed vlan 2-998, 1001-4094\n\
    \ switchport mode trunk\nswitch(config)#\nIf any access switch ports are not in use and not in an inactive shutdown, this\
    \ is a\nfinding.\nNote: Switch ports configured for 802.1x are exempt from this requirement."
  remediation: 'Configure all Arista MLS switch ports not in use to be shut down and assigned to an

    unused VLAN.

    Step 1: Configure all unused ports to be shut down and assigned to an unused VLAN.

    switch(config)#interface ethernet 9

    switch(config-eth9)#shutdown

    switch(config-eth9)# description this port is intentionally shutdown

    switch(config-eth9)# switchport access vlan 999

    Step 2: Configure any trunk links to exclude the unused VLAN.

    switch(config)# interface ethernet 10

    switch(config-eth10)# switchport trunk native vlan 1000

    switch(config-eth9)# switchport trunk allowed vlan 2-998, 1001-4094

    switch(config-eth9)# switchport mode trunk'
  checks:
