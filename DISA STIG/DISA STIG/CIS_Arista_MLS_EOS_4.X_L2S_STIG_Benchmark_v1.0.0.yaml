      \ description PORT IS INTENTIONALLY SHUTDOWN\n switchport access vlan 999\n shutdown\nswitch(config)#\nStep 2: Verify\
      \ traffic from the inactive VLAN is not allowed on any trunk links as shown\nin the example below:\nswitch(config)#sh\
      \ run int eth9\ninterface Ethernet9\n switchport"
    severity: medium
- id: '1.13'
  title: ARST-L2-000180
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista MLS layer 2 switch must not have the default VLAN assigned to any hostfacing switch ports. GROUP
    ID: V-255981 RULE ID: SV-255981r991775'
  rationale: In a VLAN-based network, switches use the default VLAN (i.e., VLAN 1) for in-band management and to communicate
    with other networking devices using Spanning-Tree Protocol (STP), Dynamic Trunking Protocol (DTP), VLAN Trunking Protocol
    (VTP), and Port Aggregation Protocol (PAgP)—all untagged traffic. As a consequence, the default VLAN may unwisely span
    the entire network if not appropriately pruned. If its scope is large enough, the risk of compromise can increase significantly.
  impact: ''
  references: []
  page_start: 38
  audit_raw: 'Review the Arista MLS switch configurations and verify no access switch ports have

    been assigned membership to the default VLAN (i.e., VLAN 1).

    switch(config)#sh vlan

    VLAN Name Status Ports

    ----- -------------------------------- --------- ----------------------------

    ---

    1 default

    8 VLAN0008 active Cpu

    25 VLAN0025 active Cpu

    100 VLAN0100 active Cpu

    1000 VLAN1000 active Eth1, Eth2

    If access switch ports are assigned to the default VLAN, this is a finding.'
  remediation: 'Configure the Arista MLS switch to remove the assignment of the default VLAN from all

    access switch ports.

    Step 1: Configure the Default VLAN 1 to shut down by using the following command:

    switch:(config#)interface vlan 1

    switch(config-int-vlan1)#shutdown

    Step 2: Configure all access switch ports to be placed in a VLAN other than the default

    (1):

    switch(config)#interface ethernet 8

    switch(config-eth8)#switchport access vlan 1000

    switch(config-eth8)#exit'
  checks:
  - type: manual_review
    info: 'Review the Arista MLS switch configurations and verify no access switch ports have

      been assigned membership to the default VLAN (i.e., VLAN 1).

      switch(config)#sh vlan

      VLAN Name Status Ports

      ----- -------------------------------- --------- ----------------------------

      ---

      1 default

      8 VLAN0008 active Cpu

      25 VLAN0025 active Cpu

      100 VLAN0100 active Cpu

      1000 VLAN1000 active Eth1, Eth2

      If access switch ports are assigned to the default VLAN, this is a finding.'
    severity: medium
- id: '1.14'
  title: ARST-L2-000190
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista MLS layer 2 switch must have the default VLAN pruned from all trunk ports that do not require it.
    GROUP ID: V-255982 RULE ID: SV-255982r991776'
  rationale: The default VLAN (i.e., VLAN 1) is a special VLAN used for control plane traffic such as Spanning-Tree Protocol
    (STP), Dynamic Trunking Protocol (DTP), VLAN Trunking Protocol (VTP), and Port Aggregation Protocol (PAgP). VLAN 1 is
    enabled on all trunks and ports by default. With larger campus networks, care needs to be taken about the diameter of
    the STP domain for the default VLAN. Instability in one part of the network could affect the default VLAN, thereby influencing
    control-plane stability and therefore STP stability for all other VLANs.
  impact: ''
  references: []
  page_start: 40
  audit_raw: "Review the Arista MLS switch configuration and verify the default VLAN is pruned from\ntrunk links that do not\
    \ require it.\nStep 1: Review the Arista MLS switch configuration by using the following commands to\nensure the default\
    \ VLAN 1 state is suspended:\nswitch(config)#vlan 1\nswitch(config-vlan-1)#sh act\nvlan\n !! STIG suspend vlan 1 #state\
    \ suspend vlan 1\nswitch(config-vlan-1)#exit\nStep 2: Review the configuration to ensure default VLAN 1 is pruned from\
    \ any trunk\nactive links by using the command \"show vlan brief\":\nswitch(config-vlan-4090)#\nswitch(config-vlan-4090)#sh\
    \ vlan brie\nVLAN Name Status Ports\n----- -------------------------------- --------- ----------------------------\n---\n\
    1 default\n8 VLAN0008 active Cpu\n25 VLAN0025 active Cpu\n100 VLAN0100 active Cpu\n1000 VLAN1000 active\n4090 VLAN4090\
    \ active\nIf the default VLAN state is not suspended and pruned from trunk links that should not\nbe transporting frames\
    \ for the VLAN, this is a finding."
  remediation: "Best practice for VLAN-based networks is to configure Arista MLS switch to prune\nunnecessary trunk links\
    \ from gaining access to the default VLAN and ensure frames\nbelonging to the default VLAN do not traverse trunks not\
    \ requiring frames from the\nVLAN.\nStep 1: Configure the Arista MLS switch to ensure VLAN1 is pruned from all trunk and\n\
    access ports that do not require it by using the following commands:\nswitch(config)#vlan 1\nswitch(config-vlan-1)#show\
    \ active\nswitch(config-vlan-1)#sh act\nvlan\n !! STIG suspend vlan 1 #state suspend vlan 1\nswitch(config-vlan-1)#exit\n\
    Step 2: Configure the Arista MLS switch to allow VLAN trunking except default VLAN 1\nand configure Ethernet port 1 to\
    \ change the native VLAN to 1000.\nswitch(config)#interface e10\nswitch(config-eth1o)#switchport trunk native vlan 1000\n\
    switch(config-eth1)#switchport trunk allowed vlan except 1\nStep 3: Alternatively, the Arista MLS switch can use trunk\
    \ groups to determine which\ntrunks service which VLANs:\nswitch(config)#vlan 1\nswitch(config-vlan-1)#trunk group DO_NOT_USE\n\
    switch(config-vlan-1)#sh act\nvlan\n !! STIG suspend vlan 1 #state suspend vlan 1\n trunk group DO_NOT_USE\nhss474.10:51:12(config-vlan-1)#\n\
    Step 4: On Arista MLS switch, ensure any unnecessary trunk links have not gained\naccess to default VLAN 1; this can be\
    \ verified with the command \"show vlan brief\":\nswitch(config)#sh vlan brief\nVLAN Name Status Ports\n----- --------------------------------\
    \ --------- ----------------------------\n---\n1 default\n8 VLAN0008 active Cpu\n25 VLAN0025 active Cpu\n100 VLAN0100\
    \ active Cpu\n1000 VLAN1000 active Eth1, Eth15, Eth16, Eth17\n4090 VLAN4090 active Eth2, Eth20, Eth32"
  checks:
  - type: sql
    command: 'show vlan brief":'
    severity: medium
    info: "Review the Arista MLS switch configuration and verify the default VLAN is pruned from\ntrunk links that do not\
      \ require it.\nStep 1: Review the Arista MLS switch configuration by using the following commands to\nensure the default\
      \ VLAN 1 state is suspended:\nswitch(config)#vlan 1\nswitch(config-vlan-1)#sh act\nvlan\n !! STIG suspend vlan 1 #state\
      \ suspend vlan 1\nswitch(config-vlan-1)#exit\nStep 2: Review th"
