- id: '1.16'
  title: ARST-L2-000210
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista MLS layer 2 switch must have all user-facing or untrusted ports configured as access switch ports.
    GROUP ID: V-255984 RULE ID: SV-255984r991778'
  rationale: Double encapsulation can be initiated by an attacker who has access to a switch port belonging to the native
    VLAN of the trunk port. Knowing the victim's MAC address and with the victim attached to a different switch belonging
    to the same trunk group, thereby requiring the trunk link and frame tagging, the malicious user can begin the attack by
    sending frames with two sets of tags. The outer tag that will have the attacker's VLAN ID (probably the well-known and
    omnipresent default VLAN) is stripped off by the switch, and the inner tag that will have the victim's VLAN ID is used
    by the switch as the next hop and sent out the trunk port.
  impact: ''
  references: []
  page_start: 45
  audit_raw: "Review the Arista MLS switch configurations and examine all user-facing or untrusted\nswitch ports configured\
    \ as access switch ports.\nswitch(config)# show run interface ethernet 13 - 15\ninterface Ethernet13\n switchport access\
    \ vlan 100\ninterface Ethernet14\n switchport access vlan 100\ninterface Ethernet14\n switchport access vlan 100\nIf any\
    \ of the user-facing switch ports are configured as a trunk, this is a finding."
  remediation: 'Configure the Arista MLS switch to disable trunking on all user-facing or untrusted

    switch ports.

    switch{config)#interface ethernet 13 - 15

    switch(config-if-Et13-15)#description disable trunking untrusted ports

    switch(config-if-Et13-15)#switchport mode access

    switch(config-if-Et13-15)#exit'
  checks:
