- id: '1.56'
  title: ESXI-70-000076
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must enable Secure Boot. GROUP ID: V-256430 RULE ID: SV-256430r959010'
  rationale: Secure Boot is part of the Unified Extensible Firmware Interface (UEFI) firmware standard. With UEFI Secure Boot
    enabled, a host refuses to load any UEFI driver or app unless the operating system bootloader has a valid digital signature.
    Secure Boot for ESXi requires support from the firmware and requires that all ESXi kernel modules, drivers, and vSphere
    Installation Bundles (VIBs) be signed by VMware or a partner subordinate. Secure Boot is enabled in the BIOS of the ESXi
    physical server and supported by the hypervisor boot loader. There is no ESXi control to "turn on" Secure Boot. Requiring
    Secure Boot (failing to boot without it present) is accomplished in another control.
  impact: ''
  references: []
  page_start: 119
  audit_raw: 'From an ESXi shell, run the following command:

    # /usr/lib/vmware/secureboot/bin/secureBoot.py -s

    If the output is not "Enabled", this is a finding.'
  remediation: 'From an ESXi shell, run the following command:

    # /usr/lib/vmware/secureboot/bin/secureBoot.py -c

    If the output indicates that Secure Boot cannot be enabled, correct the discrepancies

    and try again.

    If the discrepancies cannot be rectified, this finding is downgraded to a CAT III.'
  checks:
  - type: manual_review
    info: 'From an ESXi shell, run the following command:

      # /usr/lib/vmware/secureboot/bin/secureBoot.py -s

      If the output is not "Enabled", this is a finding.'
    severity: medium
- id: '1.57'
  title: ESXI-70-000078
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must use DOD-approved certificates. GROUP ID: V-256431 RULE ID: SV-256431r1067573'
  rationale: The default self-signed host certificate issued by the VMware Certificate Authority (VMCA) must be replaced with
    a DOD-approved certificate when the host will be accessed directly, such as during a virtual machine (VM) console connection.
    The use of a DOD certificate on the host assures clients the service they are connecting to is legitimate and properly
    secured.
  impact: ''
  references: []
  page_start: 121
  audit_raw: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Certificate.

    If the issuer is not a DOD-approved certificate authority, or other AO-approved

    certificate authority, this is a finding.

    If the host will never be accessed directly (virtual machine console connections bypass

    vCenter), this is not a finding.'
  remediation: 'Join the ESXi host to vCenter before replacing the certificate.

    Obtain a DOD-issued certificate and private key for the host following the requirements

    below:

    Key size: 2048 bits or more (PEM encoded)

    Key format: PEM

    VMware supports PKCS8 and PKCS1 (RSA keys)

    x509 version 3

    SubjectAltName must contain DNS Name=<machine_FQDN>

    CRT (Base-64) format

    Contains the following Key Usages: Digital Signature, Non Repudiation, Key

    Encipherment

    Start time of one day before the current time

    CN (and SubjectAltName) set to the host name (or IP address) that the ESXi host has in

    the vCenter Server inventory

    From the vSphere Web Client, select the ESXi host''s vCenter Server >> Configure >>

    System >> Advanced Settings.

    Select the "vpxd.certmgmt.mode" value and ensure it is set to "custom".

    Put the host into maintenance mode.

    Temporarily enable Secure Shell (SSH) on the host. Use Secure Copy Protocol (SCP)

    to transfer the new certificate and key to /tmp. SSH to the host. Back up the existing

    certificate and key:

    # mv /etc/vmware/ssl/rui.crt /etc/vmware/ssl/rui.crt.bak

    # mv /etc/vmware/ssl/rui.key /etc/vmware/ssl/rui.key.bak

    Copy the new certificate and key to "/etc/vmware/ssl/" and rename them to "rui.crt" and

    "rui.key" respectively.

    Restart management agents to implement the new certificate:

    # services.sh restart'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, go to Hosts and Clusters.

      Select the ESXi Host >> Configure >> System >> Certificate.

      If the issuer is not a DOD-approved certificate authority, or other AO-approved

      certificate authority, this is a finding.

      If the host will never be accessed directly (virtual machine console connections bypass

      vCenter), this is not a finding.'
    severity: medium
