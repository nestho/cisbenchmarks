- id: '1.38'
  title: ESXI-70-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must protect the confidentiality and integrity of transmitted information by isolating IP-based
    storage traffic. GROUP ID: V-256413 RULE ID: SV-256413r958908'
  rationale: Virtual machines (VMs) might share virtual switches and VLANs with the IP-based storage configurations. IP-based
    storage includes vSAN, iSCSI, and NFS. This configuration might expose IP-based storage traffic to unauthorized VM users.
    IP-based storage frequently is not encrypted. It can be viewed by anyone with access to this network. To restrict unauthorized
    users from viewing the IP-based storage traffic, the IP-based storage network must be logically separated from any other
    traffic. Configuring the IPbased storage adaptors on separate VLANs or network segments from other VMkernels and VMs will
    limit unauthorized users from viewing the traffic.
  impact: ''
  references: []
  page_start: 82
  audit_raw: 'If IP-based storage is not used, this is not applicable.

    From the vSphere Client, select the ESXi host and go to Configure >> Networking >>

    VMkernel adapters.

    Select each IP-based storage VMkernel adapter and view the enabled services.

    If any services are enabled on an NFS or iSCSI IP-based storage VMkernel adapter,

    this is a finding.

    If any services are enabled on a vSAN VMkernel adapter other than vSAN, this is a

    finding.

    From the vSphere Client, select the ESXi host and go to Configure >> Networking >>

    VMkernel adapters.

    Review the VLANs associated with any IP-based storage VMkernels and verify they are

    dedicated for that purpose and are logically separated from other functions.

    If any IP-based storage networks are not isolated from other traffic types, this is a

    finding.'
  remediation: 'Configuration of an IP-based VMkernel will be unique to each environment.

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> Networking >> VMkernel adapters.

    Select the VMkernel used for IP-based storage and click "Edit...". On the "Port"

    properties tab, uncheck all services. Click "OK".

    Note: For VMkernels used for vSAN, leave the vSAN service enabled and uncheck all

    others.

    From the vSphere Client, go to Hosts and Clusters >> select the ESXi Host >>

    Configure >> Networking >> Virtual switches.

    Find the port group that is dedicated to IP-based storage and click the "..." button next

    to the name. Click "Edit Settings".

    On the "Properties" tab, change the "VLAN ID" to one dedicated for IP-based storage

    traffic. Click "OK".'
  checks:
  - type: manual_review
    info: 'If IP-based storage is not used, this is not applicable.

      From the vSphere Client, select the ESXi host and go to Configure >> Networking >>

      VMkernel adapters.

      Select each IP-based storage VMkernel adapter and view the enabled services.

      If any services are enabled on an NFS or iSCSI IP-based storage VMkernel adapter,

      this is a finding.

      If any services are enabled on a vSAN VMkernel adapter other than vSAN, this is a

      finding.

      From the vSphere Client, select the ESXi host and go to Configure >> Net'
    severity: medium
- id: '1.39'
  title: ESXI-70-000053
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Simple Network Management Protocol (SNMP) must be configured properly on the ESXi host. GROUP ID: V-256414
    RULE ID: SV-256414r959010'
  rationale: If SNMP is not being used, it must remain disabled. If it is being used, the proper trap destination must be
    configured. If SNMP is not properly configured, monitoring information can be sent to a malicious host that can use this
    information to plan an attack.
  impact: ''
  references: []
  page_start: 84
  audit_raw: 'From an ESXi shell, run the following command:

    # esxcli system snmp get

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHostSnmp | Select *

    If SNMP is not in use and is enabled, this is a finding.

    If SNMP is enabled and read-only communities are set to "public", this is a finding.

    If SNMP is enabled and is not using v3 targets, this is a finding.

    Note: SNMP v3 targets can only be viewed and configured via the "esxcli" command.'
  remediation: 'To disable SNMP from an ESXi shell, run the following command:

    # esxcli system snmp set -e no

    or

    From a PowerCLI command prompt while connected to the ESXi Host:

    Get-VMHostSnmp | Set-VMHostSnmp -Enabled $false

    To configure SNMP for v3 targets, use the "esxcli system snmp set" command set

    locally on the host or remotely via PowerCLI.'
  checks:
  - type: manual_review
    info: 'From an ESXi shell, run the following command:

      # esxcli system snmp get

      or

      From a PowerCLI command prompt while connected to the ESXi host, run the following

      command:

      Get-VMHostSnmp | Select *

      If SNMP is not in use and is enabled, this is a finding.

      If SNMP is enabled and read-only communities are set to "public", this is a finding.

      If SNMP is enabled and is not using v3 targets, this is a finding.

      Note: SNMP v3 targets can only be viewed and configured via the "esxcli" command.'
    severity: medium
- id: '1.39'
  title: ESXI-70-000049
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must protect the confidentiality and integrity of transmitted information by protecting ESXi
    management traffic. GROUP ID: V-256412 RULE ID: SV-256412r958908'
  rationale: The vSphere management network provides access to the vSphere management interface on each component. Services
    running on the management interface provide an opportunity for an attacker to gain privileged access to the systems. Any
    remote attack most likely would begin with gaining entry to this network. The Management VMkernel port group can be on
    a standard or distributed virtual switch but must be on a dedicated VLAN. The Management VLAN must not be shared by any
    other function and must not be accessible to anything other than management-related functions such as vCenter.
  impact: ''
  references: []
  page_start: 86
  audit_raw: 'From the vSphere Client, select the ESXi host and go to Configure >> Networking >>

    VMkernel adapters.

    Select each VMkernel adapter that is "Enabled" for management traffic and, in the

    bottom pane, view the "Enabled services".

    If any services other than "Management" are enabled on the Management VMkernel

    adapter, this is a finding.

    From the vSphere Client, select the ESXi host and go to Configure >> Networking >>

    VMkernel adapters.

    Review the VLAN associated with each VMkernel that is "Enabled" for management

    traffic. Verify with the system administrator that they are dedicated for that purpose and

    are logically separated from other functions.

    If the network segment is accessible, except to networks where other managementrelated entities are located such as vCenter,
    this is a finding.

    If there are any other systems or devices such as VMs on the ESXi management

    segment, this is a finding.'
  remediation: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> Networking >> VMkernel adapters.

    Select the Management VMkernel and click "Edit...". On the "Port" properties tab,

    uncheck all services except "Management". Click "OK".

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> Networking >> Virtual switches.

    Find the port group that contains the Management VMkernel and click the "..." button

    next to the name. Click "Edit Settings".

    On the "Properties" tab, change the "VLAN ID" to one dedicated to Management traffic.

    Click "OK".'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, select the ESXi host and go to Configure >> Networking >>

      VMkernel adapters.

      Select each VMkernel adapter that is "Enabled" for management traffic and, in the

      bottom pane, view the "Enabled services".

      If any services other than "Management" are enabled on the Management VMkernel

      adapter, this is a finding.

      From the vSphere Client, select the ESXi host and go to Configure >> Networking >>

      VMkernel adapters.

      Review the VLAN associated with each VMkernel that is "Enabled" f'
    severity: medium
- id: '1.41'
  title: ESXI-70-000054
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must enable bidirectional Challenge-Handshake Authentication Protocol (CHAP) authentication
    for Internet Small Computer Systems Interface (iSCSI) traffic. GROUP ID: V-256415 RULE ID: SV-256415r959010'
  rationale: When enabled, vSphere performs bidirectional authentication of both the iSCSI target and host. When not authenticating
    both the iSCSI target and host, there is potential for a man-in-the-middle attack, in which an attacker might impersonate
    either side of the connection to steal data. Bidirectional authentication mitigates this risk.
  impact: ''
  references: []
  page_start: 88
  audit_raw: 'If iSCSI is not used, this is not applicable.

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> Storage >> Storage Adapters.

    Select the iSCSI adapter >> Properties >> Authentication >> Method.

    View the CHAP configuration and verify CHAP is required for target and host

    authentication.

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHost | Get-VMHostHba | Where {$_.Type -eq "iscsi"} | Select

    AuthenticationProperties -ExpandProperty AuthenticationProperties

    If iSCSI is used and CHAP is not set to "required" for both the target and host, this is a

    finding.

    If iSCSI is used and unique CHAP secrets are not used for each host, this is a finding.'
  remediation: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> Storage >> Storage Adapters.

    Select the iSCSI adapter >> Properties >> Authentication.

    Click "Edit...". Set "Authentication Method" to "Use bidirectional CHAP" and enter a

    unique secret for each traffic flow direction.

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHost | Get-VMHostHba | Where {$_.Type -eq "iscsi"} | Set-VMHostHba -

    ChapType Required -ChapName "chapname" -ChapPassword "password" -

    MutualChapEnabled $true -MutualChapName "mutualchapname" -

    MutualChapPassword "mutualpassword"'
  checks:
  - type: manual_review
    info: 'If iSCSI is not used, this is not applicable.

      From the vSphere Client, go to Hosts and Clusters.

      Select the ESXi Host >> Configure >> Storage >> Storage Adapters.

