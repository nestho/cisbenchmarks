    severity: medium
- id: '1.10'
  title: ESXI-70-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host Secure Shell (SSH) daemon must use FIPS 140-2 validated cryptographic modules to protect the
    confidentiality of remote access sessions. GROUP ID: V-256384 RULE ID: SV-256384r958408'
  rationale: OpenSSH on the ESXi host ships with a FIPS 140-2 validated cryptographic module that is enabled by default. For
    backward compatibility reasons, this can be disabled so this setting can be audited and corrected if necessary.
  impact: ''
  references: []
  page_start: 35
  audit_raw: 'From an ESXi shell, run the following command:

    # esxcli system security fips140 ssh get

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    commands:

    $esxcli = Get-EsxCli -v2

    $esxcli.system.security.fips140.ssh.get.invoke()

    Expected result:

    Enabled: true

    If the output does not match the expected result, this is a finding.'
  remediation: 'From an ESXi shell, run the following command:

    # esxcli system security fips140 ssh set -e true

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    commands:

    $esxcli = Get-EsxCli -v2

    $arguments = $esxcli.system.security.fips140.ssh.set.CreateArgs()

    $arguments.enable = $true

    $esxcli.system.security.fips140.ssh.set.Invoke($arguments)'
  checks:
  - type: manual_review
    info: 'From an ESXi shell, run the following command:

      # esxcli system security fips140 ssh get

      or

      From a PowerCLI command prompt while connected to the ESXi host, run the following

      commands:

      $esxcli = Get-EsxCli -v2

      $esxcli.system.security.fips140.ssh.get.invoke()

      Expected result:

      Enabled: true

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.11'
  title: ESXI-70-000012
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host Secure Shell (SSH) daemon must ignore ".rhosts" files. GROUP ID: V-256385 RULE ID: SV-256385r984206'
  rationale: SSH trust relationships mean a compromise on one host can allow an attacker to move trivially to other hosts.
    SSH can emulate the behavior of the obsolete "rsh" command in allowing users to enable insecure access to their accounts
    via ".rhosts" files.
  impact: ''
  references: []
  page_start: 37
  audit_raw: 'From an ESXi shell, run the following command:

    # /usr/lib/vmware/openssh/bin/sshd -T|grep ignorerhosts

    Expected result:

    ignorerhosts yes

    If the output does not match the expected result, this is a finding.'
  remediation: 'From an ESXi shell, add or correct the following line in "/etc/ssh/sshd_config":

    IgnoreRhosts yes'
  checks:
  - type: manual_review
    info: 'From an ESXi shell, run the following command:

      # /usr/lib/vmware/openssh/bin/sshd -T|grep ignorerhosts

