- id: '1.26'
  title: ESXI-70-000035
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must be configured to disable nonessential capabilities by disabling Secure Shell (SSH). GROUP
    ID: V-256400 RULE ID: SV-256400r958478'
  rationale: 'The ESXi Shell is an interactive command line interface (CLI) available at the ESXi server console. The ESXi
    shell provides temporary access to commands essential for server maintenance. Intended primarily for use in break-fix
    scenarios, the ESXi shell is well suited for checking and modifying configuration details, which are not always generally
    accessible, using the vSphere Client. The ESXi shell is accessible remotely using SSH by users with the Administrator
    role. Under normal operating conditions, SSH access to the host must be disabled as is the default. As with the ESXi shell,
    SSH is also intended only for temporary use during break-fix scenarios. SSH must therefore be disabled under normal operating
    conditions and must only be enabled for diagnostics or troubleshooting. Remote access to the host must therefore be limited
    to the vSphere Client or Host Client at all other times. Satisfies: SRG-OS-000095-VMM-000480, SRG-OS-000297-VMM-001040,
    SRG-OS000298-VMM-001050'
  impact: ''
  references: []
  page_start: 57
  audit_raw: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Services.

    Under "Services", locate the "SSH" service and verify it is "Stopped".

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHost | Get-VMHostService | Where {$_.Label -eq "SSH"}

    If the SSH service is "Running", this is a finding.'
  remediation: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Services.

    Under "Services", select the "SSH" service and click the "Stop" button.

    Click the "Edit Startup policy..." button.

    Select the "Start and stop manually" radio button.

    Click "OK".

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    commands:

    Get-VMHost | Get-VMHostService | Where {$.Label -eq "SSH"} | Set-VMHostService -

    Policy Off

    Get-VMHost | Get-VMHostService | Where {$.Label -eq "SSH"} | Stop-VMHostService'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, go to Hosts and Clusters.

