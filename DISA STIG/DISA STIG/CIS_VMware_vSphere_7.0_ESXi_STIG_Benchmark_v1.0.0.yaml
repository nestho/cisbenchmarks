  title: ESXI-70-000037
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The ESXi host must use Active Directory for local user authentication. GROUP ID: V-256402 RULE ID: SV-256402r958482'
  rationale: 'Join ESXi hosts to an Active Directory domain to eliminate the need to create and maintain multiple local user
    accounts. Using Active Directory for user authentication simplifies the ESXi host configuration, ensures password complexity
    and reuse policies are enforced, and reduces the risk of security breaches and unauthorized access. Note: If the Active
    Directory group "ESX Admins" (default) exists, all users and groups assigned as members to this group will have full administrative
    access to all ESXi hosts in the domain. Satisfies: SRG-OS-000104-VMM-000500, SRG-OS-000109-VMM-000550, SRG-OS000112-VMM-000560,
    SRG-OS-000113-VMM-000570'
