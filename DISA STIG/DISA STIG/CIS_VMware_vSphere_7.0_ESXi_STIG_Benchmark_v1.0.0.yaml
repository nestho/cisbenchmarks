- id: '1.7'
  title: ESXI-70-000007
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must display the Standard Mandatory DOD Notice and Consent Banner before granting access to
    the system via the Direct Console User Interface (DCUI). GROUP ID: V-256381 RULE ID: SV-256381r958390'
  rationale: 'Failure to display the DOD logon banner prior to a logon attempt will negate legal proceedings resulting from
    unauthorized access to system resources. Satisfies: SRG-OS-000023-VMM-000060, SRG-OS-000024-VMM-000070'
  impact: ''
  references: []
