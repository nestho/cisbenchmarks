- id: '1.70'
  title: ESXI-70-000092
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must not be configured to override virtual machine (VM) configurations. GROUP ID: V-256444 RULE
    ID: SV-256444r959010'
  rationale: Each VM on an ESXi host runs in its own "vmx" process. Upon creation, a vmx process will look in two locations
    for configuration items, the ESXi host itself and the per-vm *.vmx file in the VM storage path on the datastore. The settings
    on the ESXi host are read first and take precedence over settings in the *.vmx file. This can be a convenient way to set
    a setting in one place and have it apply to all VMs running on that host. The difficulty is in managing those settings
    and determining the effective state. Since managing per-VM vmx settings can be fully automated and customized while the
    ESXi setting cannot be easily queried, the ESXi configuration must not be used.
  impact: ''
  references: []
  page_start: 147
  audit_raw: 'From an ESXi shell, run the following command:

    # stat -c "%s" /etc/vmware/settings

    Expected result:

    0

    If the output does not match the expected result, this is a finding.'
  remediation: 'From an ESXi shell, run the following command:

    # echo -n >/etc/vmware/settings'
  checks:
  - type: manual_review
    info: 'From an ESXi shell, run the following command:

      # stat -c "%s" /etc/vmware/settings

