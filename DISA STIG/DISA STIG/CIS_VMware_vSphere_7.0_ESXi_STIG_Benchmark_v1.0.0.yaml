- id: '1.51'
  title: ESXI-70-000064
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'All port groups on standard switches must not be configured to virtual local area network (VLAN) 4095 unless
    Virtual Guest Tagging (VGT) is required. GROUP ID: V-256425 RULE ID: SV-256425r959010'
  rationale: When a port group is set to VLAN 4095, the vSwitch passes all network frames to the attached virtual machines
    (VMs) without modifying the VLAN tags. In vSphere, this is referred to as VGT. The VM must process the VLAN information
    itself via an 802.1Q driver in the operating system. VLAN 4095 must only be implemented if the attached VMs have been
    specifically authorized and are capable of managing VLAN tags themselves. If VLAN 4095 is enabled inappropriately, it
    may cause denial of service or allow a VM to interact with traffic on an unauthorized VLAN.
  impact: ''
  references: []
