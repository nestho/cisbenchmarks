- id: '1.72'
  title: ESXI-70-000094
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must require TPM-based configuration encryption. GROUP ID: V-256446 RULE ID: SV-256446r959010'
  rationale: An ESXi host's configuration consists of configuration files for each service that runs on the host. The configuration
    files typically reside in the /etc/ directory, but they can also reside in other namespaces. The configuration files contain
    run-time information about the state of the services. Over time, the default values in the configuration files might change,
    for example, when settings on the ESXi host are changed. A cron job backs up the ESXi configuration files periodically,
    when ESXi shuts down gracefully or on demand, and creates an archived configuration file in the boot bank. When ESXi reboots,
    it reads the archived configuration file and recreates the state that ESXi was in when the backup was taken. Before vSphere
    7.0 Update 2, the archived ESXi configuration file is not encrypted. In vSphere 7.0 Update 2 and later, the archived configuration
    file is encrypted. When the ESXi host is configured with a Trusted Platform Module (TPM), the TPM is used to "seal" the
    configuration to the host, providing a strong security guarantee and additional protection from offline attacks. Configuration
    encryption uses the physical TPM when it is available and supported at install or upgrade time. If the TPM was added or
    enabled later, the ESXi host must be told to reconfigure to use the newly available TPM. Once the TPM configuration encryption
    is enabled, it cannot be disabled.
  impact: ''
  references: []
  page_start: 149
  audit_raw: 'If the ESXi host does not have a compatible TPM, this finding is downgraded to a CAT

    III.

    From an ESXi shell, run the following command:

    # esxcli system settings encryption get|grep Mode

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    commands:

    $esxcli = Get-EsxCli -v2

    $esxcli.system.settings.encryption.get.invoke() | Select Mode

    Expected result:

    Mode: TPM

    If the output does not match the expected result, this is a finding.'
  remediation: 'Ensure the TPM 2.0 chip is enabled in the BIOS and the ESX UI does not show any

    errors about a present but unavailable TPM.

    This setting cannot be configured until the TPM is properly enabled in the BIOS.

    From an ESXi shell, run the following command:

    #esxcli system settings encryption set --mode=TPM

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    commands:

    $esxcli = Get-EsxCli -v2

    $arguments = $esxcli.system.settings.encryption.set.CreateArgs()

    $arguments.mode = "TPM"

    $esxcli.system.settings.encryption.set.Invoke($arguments)

    Evacuate the host and gracefully reboot for changes to take effect.'
  checks:
  - type: manual_review
    info: 'If the ESXi host does not have a compatible TPM, this finding is downgraded to a CAT

      III.

      From an ESXi shell, run the following command:

      # esxcli system settings encryption get|grep Mode

      or

      From a PowerCLI command prompt while connected to the ESXi host, run the following

      commands:

      $esxcli = Get-EsxCli -v2

      $esxcli.system.settings.encryption.get.invoke() | Select Mode

      Expected result:

      Mode: TPM

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.73'
  title: ESXI-70-000095
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must implement Secure Boot enforcement. GROUP ID: V-256447 RULE ID: SV-256447r959010'
  rationale: 'Secure Boot is part of the UEFI firmware standard. With UEFI Secure Boot enabled, a host refuses to load any
    UEFI driver or app unless the operating system bootloader has a valid digital signature. Secure Boot for ESXi requires
    support from the firmware and it requires that all ESXi kernel modules, drivers and VIBs be signed by VMware or a partner
    subordinate. Secure Boot is enabled in the BIOS of the ESXi physical server and supported by the hypervisor boot loader.
    This control flips ESXi from merely supporting Secure Boot to requiring it. Without this setting enabled, and configuration
    encryption, an ESXi host could be subject to offline attacks. An attacker could simply transfer the ESXi install drive
    to a non-Secure Boot host and boot it up without ESXi complaining. Note: This setting is only available in 7.0 Update
    2 and later. Satisfies: SRG-OS-000480-VMM-002000, SRG-OS-000257-VMM-000910, SRG-OS000278-VMM-001000, SRG-OS-000446-VMM-001790'
  impact: ''
  references: []
  page_start: 152
  audit_raw: 'If the ESXi host does not have a compatible TPM, this finding is downgraded to a CAT

    III.

    From an ESXi shell, run the following command:

    # esxcli system settings encryption get|grep "Secure Boot"

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    commands:

    $esxcli = Get-EsxCli -v2

    $esxcli.system.settings.encryption.get.invoke() | Select RequireSecureBoot

    Expected result:

    Require Secure Boot: true

    If the output does not match the expected result, this is a finding.'
  remediation: 'This setting cannot be configured until Secure Boot is properly enabled in the BIOS.

    From an ESXi shell, run the following command:

    # esxcli system settings encryption set --require-secure-boot=true

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    commands:

    $esxcli = Get-EsxCli -v2

    $arguments = $esxcli.system.settings.encryption.set.CreateArgs()

    $arguments.requiresecureboot = $true

    $esxcli.system.settings.encryption.set.Invoke($arguments)

    Evacuate the host and gracefully reboot for changes to take effect.'
  checks:
  - type: manual_review
    info: 'If the ESXi host does not have a compatible TPM, this finding is downgraded to a CAT

      III.

