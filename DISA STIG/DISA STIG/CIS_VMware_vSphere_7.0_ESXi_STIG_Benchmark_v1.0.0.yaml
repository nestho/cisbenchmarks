    ID: SV-256386r959010'
  rationale: SSH trust relationships mean a compromise on one host can allow an attacker to move trivially to other hosts.
    SSH's cryptographic host-based authentication is more secure than ".rhosts" authentication because hosts are cryptographically
    authenticated. However, it is not recommended that hosts unilaterally trust one another, even within an organization.
  impact: ''
  references: []
