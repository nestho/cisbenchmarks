    $esxcli = Get-EsxCli -v2

    $arguments = $esxcli.system.security.certificatestore.add.CreateArgs()

    $arguments.filename = <path/to/cacert>

    $esxcli.system.security.certificatestore.add.Invoke($arguments)'
