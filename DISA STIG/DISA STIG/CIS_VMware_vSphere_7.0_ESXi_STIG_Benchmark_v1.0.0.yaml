  title: ESXI-70-000072
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The ESXi host must have all security patches and updates installed. GROUP ID: V-256428 RULE ID: SV-256428r959010'
  rationale: Installing software updates is a fundamental mitigation against the exploitation of publicly known vulnerabilities.
  impact: ''
  references: []
  page_start: 115
  audit_raw: 'Determine the current version and build:

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Summary. Note the version string next to "Hypervisor:".

    or

    From a Secure Shell (SSH) session connected to the ESXi host, or from the ESXi shell,

    run the following command:

    # vmware -v

    Because ESXi hosts should never be able to touch the internet, manually compare the

    current ESXi version and patch level to the latest available on vmware.com:

    https://kb.vmware.com/s/article/2143832

    If the ESXi host does not have the latest patches, this is a finding.

    If the ESXi host is not on a supported release, this is a finding.

    VMware also publishes Advisories on security patches and offers a way to subscribe to

    email alerts for them.

    Go to: https://www.vmware.com/support/policies/security_response'
  remediation: 'ESXi can be patched in multiple ways, and this fix text does not cover all methods.

    Manual patching when image profiles are not used:

    • Download the latest "offline bundle" .zip update from vmware.com. Verify the

    hash.

    • Transfer the file to a datastore accessible by the ESXi host, local or remote.

    • Put the ESXi host into maintenance mode.

    • From an ESXi shell, run the following command:

    esxcli software vib update -d

    Manual patching when image profiles are used:

    From an ESXi shell, run the following command:

    # esxcli software sources profile list -d /vmfs/volumes//

    Note the available profiles. The organization will usually want the one ending in "-

    standard".

    # esxcli software profile update -p -d /vmfs/volumes//

    There will be little output during the update. Once complete, reboot the host for changes

    to take effect.'
