    commands:

    Get-VirtualSwitch -Standard | Get-SecurityPolicy | Set-SecurityPolicy -MacChanges

    $false

    Get-VirtualPortGroup -Standard | Get-SecurityPolicy | Set-SecurityPolicy -

    MacChangesInherited $true'
