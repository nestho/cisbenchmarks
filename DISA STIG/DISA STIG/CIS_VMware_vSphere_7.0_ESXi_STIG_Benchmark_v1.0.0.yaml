controls:
- id: '1.1'
  title: ESXI-70-000001
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Access to the ESXi host must be limited by enabling lockdown mode. GROUP ID: V-256375 RULE ID: SV-256375r958398'
  rationale: 'Enabling lockdown mode disables direct access to an ESXi host, requiring the host to be managed remotely from
    vCenter Server. This is done to ensure the roles and access controls implemented in vCenter are always enforced and users
    cannot bypass them by logging on to a host directly. By forcing all interaction to occur through vCenter Server, the risk
    of someone inadvertently attaining elevated privileges or performing tasks that are not properly audited is greatly reduced.
    Satisfies: SRG-OS-000027-VMM-000080, SRG-OS-000123-VMM-000620'
  impact: ''
  references: []
  page_start: 12
  audit_raw: 'For environments that do not use vCenter server to manage ESXi, this is not applicable.

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Security Profile.

    Scroll down to "Lockdown Mode" and verify it is set to "Enabled" (Normal or Strict).

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHost | Select

    Name,@{N="Lockdown";E={$_.Extensiondata.Config.LockdownMode}}

    If "Lockdown Mode" is disabled, this is a finding.'
  remediation: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Security Profile >> Lockdown Mode.

    Click "Edit...". Select the "Normal" or "Strict" radio buttons.

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    commands:

    $level = "lockdownNormal" OR "lockdownStrict"

    $vmhost = Get-VMHost -Name | Get-View

    $lockdown = Get-View $vmhost.ConfigManager.HostAccessManager

    $lockdown.ChangeLockdownMode($level)

    Note: In strict lockdown mode, the Direct Console User Interface (DCUI) service is

    stopped. If the connection to vCenter Server is lost and the vSphere Client is no longer

    available, the ESXi host becomes inaccessible.'
  checks:
  - type: manual_review
    info: 'For environments that do not use vCenter server to manage ESXi, this is not applicable.

      From the vSphere Client, go to Hosts and Clusters.

      Select the ESXi Host >> Configure >> System >> Security Profile.

      Scroll down to "Lockdown Mode" and verify it is set to "Enabled" (Normal or Strict).

      or

      From a PowerCLI command prompt while connected to the ESXi host, run the following

      command:

      Get-VMHost | Select

      Name,@{N="Lockdown";E={$_.Extensiondata.Config.LockdownMode}}

      If "Lockdown Mode" is disabled, th'
    severity: medium
- id: '1.2'
  title: ESXI-70-000002
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must verify the DCUI.Access list. GROUP ID: V-256376 RULE ID: SV-256376r959010'
  rationale: Lockdown mode disables direct host access, requiring that administrators manage hosts from vCenter Server. However,
    if a host becomes isolated from vCenter, the administrator is locked out and can no longer manage the host. The "DCUI.Access"
    advanced setting allows specified users to exit lockdown mode in such a scenario. If the Direct Console User Interface
    (DCUI) is running in strict lockdown mode, this setting is ineffective.
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'For environments that do not use vCenter server to manage ESXi, this is not applicable.

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Advanced System Settings.

    Select the "DCUI.Access" value and verify only the root user is listed.

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHost | Get-AdvancedSetting -Name DCUI.Access and verify it is set to root.

    If the "DCUI.Access" is not restricted to "root", this is a finding.

    Note: This list is only for local user accounts and should only contain the root user.'
  remediation: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Advanced System Settings.

    Click "Edit". Select the "DCUI.Access" value and configure it to "root".

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHost | Get-AdvancedSetting -Name DCUI.Access | Set-AdvancedSetting -Value

    "root"'
  checks:
  - type: manual_review
    info: 'For environments that do not use vCenter server to manage ESXi, this is not applicable.

      From the vSphere Client, go to Hosts and Clusters.

      Select the ESXi Host >> Configure >> System >> Advanced System Settings.

      Select the "DCUI.Access" value and verify only the root user is listed.

      or

      From a PowerCLI command prompt while connected to the ESXi host, run the following

      command:

      Get-VMHost | Get-AdvancedSetting -Name DCUI.Access and verify it is set to root.

      If the "DCUI.Access" is not restricted t'
    severity: medium
- id: '1.3'
  title: ESXI-70-000003
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must verify the exception users list for lockdown mode. GROUP ID: V-256377 RULE ID: SV-256377r959010'
  rationale: While a host is in lockdown mode (strict or normal), only users on the "Exception Users" list are allowed access.
    These users do not lose their permissions when the host enters lockdown mode. The organization may want to add service
    accounts such as a backup agent to the Exception Users list. Verify the list of users exempted from losing permissions
    is legitimate and as needed per the environment. Adding unnecessary users to the exception list defeats the purpose of
    lockdown mode.
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'For environments that do not use vCenter server to manage ESXi, this is not applicable.

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Security Profile.

    Under "Lockdown Mode", review the Exception Users list.

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    script:

    $vmhost = Get-VMHost | Get-View

    $lockdown = Get-View $vmhost.ConfigManager.HostAccessManager

    $lockdown.QueryLockdownExceptions()

    If the Exception Users list contains accounts that do not require special permissions,

    this is a finding.

    Note: The Exception Users list is empty by default and should remain that way except

    under site-specific circumstances.'
  remediation: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Security Profile.

    Under "Lockdown Mode", click "Edit" and remove unnecessary users from the

    Exception Users list.'
  checks:
  - type: manual_review
    info: 'For environments that do not use vCenter server to manage ESXi, this is not applicable.

      From the vSphere Client, go to Hosts and Clusters.

      Select the ESXi Host >> Configure >> System >> Security Profile.

      Under "Lockdown Mode", review the Exception Users list.

      or

      From a PowerCLI command prompt while connected to the ESXi host, run the following

      script:

      $vmhost = Get-VMHost | Get-View

      $lockdown = Get-View $vmhost.ConfigManager.HostAccessManager

      $lockdown.QueryLockdownExceptions()

      If the Exception '
    severity: medium
- id: '1.4'
  title: ESXI-70-000004
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Remote logging for ESXi hosts must be configured. GROUP ID: V-256378 RULE ID: SV-256378r958406'
  rationale: 'Remote logging to a central log host provides a secure, centralized store for ESXi logs. By gathering host log
    files onto a central host, it can more easily monitor all hosts with a single tool. It can also do aggregate analysis
    and searching to look for such things as coordinated attacks on multiple hosts. Logging to a secure, centralized log server
    also helps prevent log tampering and provides a long-term audit record. Satisfies: SRG-OS-000032-VMM-000130, SRG-OS-000342-VMM-001230,
    SRG-OS000479-VMM-001990, SRG-OS-000059-VMM-000280, SRG-OS-000058-VMM-000270, SRG-OS-000051-VMM-000230'
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Advanced System Settings.

    Select the "Syslog.global.logHost" value and verify it is set to a site-specific syslog

    server.

    Follow the conventions shown below:

    udp://<IP/FQDN>:514

    tcp://<IP/FQDN>:514

    ssl://<IP/FQDN>:1514

    Multiple servers can be specified when separated by commas.

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHost | Get-AdvancedSetting -Name Syslog.global.logHost

    If the "Syslog.global.logHost" setting is not set to a valid, site-specific syslog server, this

    is a finding.'
  remediation: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Advanced System Settings.

    Click "Edit". Select the "Syslog.global.logHost" value and configure it to a site-specific

    syslog server.

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHost | Get-AdvancedSetting -Name Syslog.global.logHost | SetAdvancedSetting -Value ""'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, go to Hosts and Clusters.

      Select the ESXi Host >> Configure >> System >> Advanced System Settings.

      Select the "Syslog.global.logHost" value and verify it is set to a site-specific syslog

      server.

      Follow the conventions shown below:

      udp://<IP/FQDN>:514

      tcp://<IP/FQDN>:514

      ssl://<IP/FQDN>:1514

      Multiple servers can be specified when separated by commas.

      or

      From a PowerCLI command prompt while connected to the ESXi host, run the following

      command:

      Get-VMHost | Get-AdvancedSet'
    severity: medium
- id: '1.5'
  title: ESXI-70-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must enforce the limit of three consecutive invalid logon attempts by a user. GROUP ID: V-256379
    RULE ID: SV-256379r958388'
  rationale: By limiting the number of failed logon attempts, the risk of unauthorized access via user password guessing,
    otherwise known as brute forcing, is reduced. Once the configured number of attempts is reached, the account is locked
    by the ESXi host.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Advanced System Settings.

    Select the "Security.AccountLockFailures" value and verify it is set to "3".

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHost | Get-AdvancedSetting -Name Security.AccountLockFailures

    If the "Security.AccountLockFailures" setting is set to a value other than "3", this is a

    finding.'
  remediation: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Advanced System Settings.

    Click "Edit". Select the "Security.AccountLockFailures" value and configure it to "3".

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHost | Get-AdvancedSetting -Name Security.AccountLockFailures | SetAdvancedSetting -Value 3'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, go to Hosts and Clusters.

      Select the ESXi Host >> Configure >> System >> Advanced System Settings.

      Select the "Security.AccountLockFailures" value and verify it is set to "3".

      or

      From a PowerCLI command prompt while connected to the ESXi host, run the following

      command:

      Get-VMHost | Get-AdvancedSetting -Name Security.AccountLockFailures

      If the "Security.AccountLockFailures" setting is set to a value other than "3", this is a

      finding.'
    severity: medium
- id: '1.6'
  title: ESXI-70-000006
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must enforce an unlock timeout of 15 minutes after a user account is locked out. GROUP ID: V-256380
    RULE ID: SV-256380r958736'
  rationale: By enforcing a reasonable unlock timeout after multiple failed logon attempts, the risk of unauthorized access
    via user password guessing, otherwise known as brute forcing, is reduced. Users must wait for the timeout period to elapse
    before subsequent logon attempts are allowed.
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Advanced System Settings.

    Select the "Security.AccountUnlockTime" value and verify it is set to "900".

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHost | Get-AdvancedSetting -Name Security.AccountUnlockTime

    If the "Security.AccountUnlockTime" setting is set to a value other than "900", this is a

    finding.'
  remediation: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Advanced System Settings.

    Click "Edit". Select the "Security.AccountUnlockTime" value and configure it to "900".

