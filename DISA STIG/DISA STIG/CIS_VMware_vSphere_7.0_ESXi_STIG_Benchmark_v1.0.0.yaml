    Select the ESXi Host >> Configure >> System >> Authentication Services.

    Verify the "Directory Services Type" is set to "Active Directory".

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHost | Get-VMHostAuthentication

    For systems that do not use Active Directory and do have local user accounts, other

    than root and/or service accounts, this is a finding.

    If the Directory Services Type is not set to "Active Directory", this is a finding.'
  remediation: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Authentication Services.

    Click "Join Domain..." and enter the AD domain to join.

    Select the "Using credentials" radio button and enter the credentials of an account with

    permissions to join machines to AD (use UPN naming "user@domain"). Click "OK".

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHost | Get-VMHostAuthentication | Set-VMHostAuthentication -JoinDomain -

    Domain "domain name" -User "username" -Password "password"

    If any local user accounts are present besides root and service accounts, delete them

