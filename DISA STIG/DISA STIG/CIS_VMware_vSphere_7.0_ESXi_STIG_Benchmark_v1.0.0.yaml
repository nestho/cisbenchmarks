- id: '1.8'
  title: ESXI-70-000008
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must display the Standard Mandatory DOD Notice and Consent Banner before granting access to
    the system via Secure Shell (SSH). GROUP ID: V-256382 RULE ID: SV-256382r958390'
  rationale: Failure to display the DOD logon banner prior to a logon attempt will negate legal proceedings resulting from
    unauthorized access to system resources.
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Advanced System Settings.

    Select the "Config.Etc.issue" value and verify it is set to the DOD logon banner below.

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHost | Get-AdvancedSetting -Name Config.Etc.issue

    If the "Config.Etc.issue" setting (/etc/issue file) does not contain the logon banner

    exactly as shown below, this is a finding.

    "You are accessing a U.S. Government (USG) Information System (IS) that is

    provided for USG-authorized use only. By using this IS (which includes any

    device attached to this IS), you consent to the following conditions: -The

    USG routinely intercepts and monitors communications on this IS for purposes

    including, but not limited to, penetration testing, COMSEC monitoring,

    network operations and defense, personnel misconduct (PM), law enforcement

    (LE), and counterintelligence (CI) investigations. -At any time, the USG may

    inspect and seize data stored on this IS. -Communications using, or data

    stored on, this IS are not private, are subject to routine monitoring,

    interception, and search, and may be disclosed or used for any USG-authorized

    purpose. -This IS includes security measures (e.g., authentication and access

    controls) to protect USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM,

    LE or CI investigative searching or monitoring of the content of privileged

    communications, or work product, related to personal representation or

    services by attorneys, psychotherapists, or clergy, and their assistants.

    Such communications and work product are private and confidential. See User

    Agreement for details."'
  remediation: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Advanced System Settings.

    Click "Edit". Select the "Config.Etc.issue" value and set it to the following:

    "You are accessing a U.S. Government (USG) Information System (IS) that is

    provided for USG-authorized use only. By using this IS (which includes any

    device attached to this IS), you consent to the following conditions: -The

    USG routinely intercepts and monitors communications on this IS for purposes

    including, but not limited to, penetration testing, COMSEC monitoring,

    network operations and defense, personnel misconduct (PM), law enforcement

    (LE), and counterintelligence (CI) investigations. -At any time, the USG may

    inspect and seize data stored on this IS. -Communications using, or data

    stored on, this IS are not private, are subject to routine monitoring,

    interception, and search, and may be disclosed or used for any USG-authorized

    purpose. -This IS includes security measures (e.g., authentication and access

    controls) to protect USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM,

    LE or CI investigative searching or monitoring of the content of privileged

    communications, or work product, related to personal representation or

    services by attorneys, psychotherapists, or clergy, and their assistants.

    Such communications and work product are private and confidential. See User

    Agreement for details."

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHost | Get-AdvancedSetting -Name Config.Etc.issue | Set-AdvancedSetting -

    Value ""'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, go to Hosts and Clusters.

      Select the ESXi Host >> Configure >> System >> Advanced System Settings.

      Select the "Config.Etc.issue" value and verify it is set to the DOD logon banner below.

      or

      From a PowerCLI command prompt while connected to the ESXi host, run the following

      command:

      Get-VMHost | Get-AdvancedSetting -Name Config.Etc.issue

      If the "Config.Etc.issue" setting (/etc/issue file) does not contain the logon banner

      exactly as shown below, this is a finding.

      "You are'
    severity: medium
- id: '1.9'
  title: ESXI-70-000009
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host SSH daemon must be configured with the DOD logon banner. GROUP ID: V-256383 RULE ID: SV-256383r958390'
  rationale: The warning message reinforces policy awareness during the logon process and facilitates possible legal action
    against attackers. Alternatively, systems whose ownership should not be obvious should ensure use of a banner that does
    not provide easy attribution.
  impact: ''
  references: []
