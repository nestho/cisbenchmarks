    is a finding.'
  remediation: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> Networking >> Virtual switches.

    For each port group on a standard switch that is configured to a native VLAN, click the

    "..." button next to the port group.

    Click "Edit Settings". On the "Properties" tab, change the "VLAN ID" to a non-native

    VLAN and click "OK".

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VirtualPortGroup -Name "portgroup name" | Set-VirtualPortGroup -VLanId "New

    VLAN#"'
