- id: '1.65'
  title: ESXI-70-000087
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must enable volatile key destruction. GROUP ID: V-256439 RULE ID: SV-256439r959010'
  rationale: By default, pages allocated for virtual machines (VMs), userspace applications, and kernel threads are zeroed
    out at allocation time. ESXi will always ensure that no nonzero pages are exposed to VMs or userspace applications. While
    this prevents exposing cryptographic keys from VMs or userworlds to other clients, these keys can stay present in host
    memory for a long time if the memory is not reused. The NIAP Virtualization Protection Profile and Server Virtualization
    Extended Package require that memory that may contain cryptographic keys be zeroed upon process exit. To this end, a new
    configuration option, MemEagerZero, can be configured to enforce zeroing out userworld and guest memory pages when a userworld
    process or guest exits. For kernel threads, memory spaces holding keys are zeroed out as soon as the secret is no longer
    needed.
  impact: ''
  references: []
  page_start: 137
  audit_raw: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Advanced System Settings.

    Select the "Mem.MemEagerZero" value and verify it is set to "1".

    or

