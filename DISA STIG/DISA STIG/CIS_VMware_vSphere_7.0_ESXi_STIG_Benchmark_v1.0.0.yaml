  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must verify certificates for SSL syslog endpoints. GROUP ID: V-256438 RULE ID: SV-256438r959010'
  rationale: When sending syslog data to a remote host, ESXi can be configured to use any combination of TCP, UDP and SSL
