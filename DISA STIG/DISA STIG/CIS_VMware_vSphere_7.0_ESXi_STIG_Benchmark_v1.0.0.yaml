- id: '1.47'
  title: ESXI-70-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'All port groups on standard switches must be configured to reject guest Media Access Control (MAC) address
    changes. GROUP ID: V-256421 RULE ID: SV-256421r959010'
  rationale: If the virtual machine (VM) operating system changes the MAC address, it can send frames with an impersonated
    source MAC address at any time. This allows it to stage malicious attacks on the devices in a network by impersonating
    a network adaptor authorized by the receiving network. This will prevent VMs from changing their effective MAC address,
    which will affect applications that require this functionality. This will also affect how a layer 2 bridge will operate
    and will affect applications that require a specific MAC address for licensing. "Reject MAC Changes" can be set at the
    vSwitch and/or the Portgroup level. Switchlevel settings can be overridden at the Portgroup level.
  impact: ''
  references: []
