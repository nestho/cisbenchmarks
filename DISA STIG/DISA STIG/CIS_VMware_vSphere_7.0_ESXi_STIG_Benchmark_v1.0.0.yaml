- id: '1.35'
  title: ESXI-70-000046
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must configure NTP time synchronization. GROUP ID: V-256409 RULE ID: SV-256409r1038976'
  rationale: 'To ensure the accuracy of the system clock, it must be synchronized with an authoritative time source within
    DOD. Many system functions, including time-based logon and activity restrictions, automated reports, system logs, and
    audit records, depend on an accurate system clock. If there is no confidence in the correctness of the system clock, time-based
    functions may not operate as intended and records may be of diminished value. Satisfies: SRG-OS-000355-VMM-001330, SRG-OS-000356-VMM-001340'
  impact: ''
  references: []
  page_start: 75
  audit_raw: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Time Configuration.

    Under "Current Time Configuration", verify "Time Synchronization" is set to "Network

    Time Protocol".

    Under "Network Time Protocol", verify the "NTP Servers" are authorized DOD time

    sources.

    If the ESXi host is not configured to pull time from authoritative DOD time sources, this

    is a finding.

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    commands:

    Get-VMHost | Get-VMHostNTPServer

    Get-VMHost | Get-VMHostService | Where {$_.Label -eq "NTP Daemon"}

    If the NTP service is not configured with authoritative DOD time sources or the service

    does not have a "Policy" of "on" or is stopped, this is a finding.'
  remediation: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Time Configuration.

    Under "Network Time Protocol", click "Edit...". Ensure the "NTP Servers" are authorized

    DOD time sources.

    Ensure the "NTP Service Startup Policy" is set to "Start and stop with host".

    Ensure the "Enable" checkbox, in the upper left, is checked. Click "OK".

    Click "Edit" to configure the NTP service to start and stop with the host and with

    authoritative DOD time sources.

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    commands:

    $NTPServers = "ntpserver1","ntpserver2"

    Get-VMHost | Add-VMHostNTPServer $NTPServers

    Get-VMHost | Get-VMHostService | Where {$.Label -eq "NTP Daemon"} | SetVMHostService -Policy On

    Get-VMHost | Get-VMHostService | Where {$.Label -eq "NTP Daemon"} | StartVMHostService'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, go to Hosts and Clusters.

      Select the ESXi Host >> Configure >> System >> Time Configuration.

      Under "Current Time Configuration", verify "Time Synchronization" is set to "Network

      Time Protocol".

      Under "Network Time Protocol", verify the "NTP Servers" are authorized DOD time

      sources.

      If the ESXi host is not configured to pull time from authoritative DOD time sources, this

      is a finding.

      or

      From a PowerCLI command prompt while connected to the ESXi host, run the following

      co'
    severity: medium
- id: '1.36'
  title: ESXI-70-000047
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The ESXi Image Profile and vSphere Installation Bundle (VIB) acceptance levels must be verified. GROUP ID:
    V-256410 RULE ID: SV-256410r984242'
  rationale: 'Verify the ESXi Image Profile to only allow signed VIBs. An unsigned VIB represents untested code installed
    on an ESXi host. The ESXi Image profile supports four acceptance levels: 1. VMwareCertified - VIBs created, tested, and
    signed by VMware. 2. VMwareAccepted - VIBs created by a VMware partner but tested and signed by VMware. 3. PartnerSupported
    - VIBs created, tested, and signed by a certified VMware partner. 4. CommunitySupported - VIBs that have not been tested
    by VMware or a VMware partner. Community Supported VIBs are not supported and do not have a digital signature. To protect
    the security and integrity of ESXi hosts, do not allow unsigned (CommunitySupported) VIBs to be installed on hosts. Satisfies:
    SRG-OS-000366-VMM-001430, SRG-OS-000370-VMM-001460, SRG-OS000404-VMM-001650'
  impact: ''
  references: []
  page_start: 77
  audit_raw: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Security Profile.

    Under "Host Image Profile Acceptance Level", view the acceptance level.

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    commands:

    $esxcli = Get-EsxCli -v2

    $esxcli.software.acceptance.get.Invoke()

    If the acceptance level is "CommunitySupported", this is a finding.'
  remediation: 'From the vSphere Client, select the ESXi Host and go to Configure >> System >>

    Security Profile.

    Under "Host Image Profile Acceptance Level", click "Edit...".

    Using the drop-down selection, set the acceptance level as "VMwareCertified",

    "VMwareAccepted", or "PartnerSupported". The default is "PartnerSupported".

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    commands:

    $esxcli = Get-EsxCli -v2

    $arguments = $esxcli.software.acceptance.set.CreateArgs()

    $arguments.level = "PartnerSupported"

    $esxcli.software.acceptance.set.Invoke($arguments)

    Note: "VMwareCertified" or "VMwareAccepted" may be substituted for

    "PartnerSupported", depending on local requirements. These are case sensitive.'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, go to Hosts and Clusters.

      Select the ESXi Host >> Configure >> System >> Security Profile.

      Under "Host Image Profile Acceptance Level", view the acceptance level.

      or

      From a PowerCLI command prompt while connected to the ESXi host, run the following

      commands:

      $esxcli = Get-EsxCli -v2

      $esxcli.software.acceptance.get.Invoke()

      If the acceptance level is "CommunitySupported", this is a finding.'
    severity: medium
- id: '1.37'
  title: ESXI-70-000048
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must protect the confidentiality and integrity of transmitted information by isolating vMotion
    traffic. GROUP ID: V-256411 RULE ID: SV-256411r958908'
  rationale: While encrypted vMotion is available, vMotion traffic should still be sequestered from other traffic to further
    protect it from attack. This network must only be accessible to other ESXi hosts, preventing outside access to the network.
    The vMotion VMkernel port group must be in a dedicated VLAN that can be on a standard or distributed virtual switch as
    long as the vMotion VLAN is not shared by any other function and is not routed to anything but ESXi hosts.
  impact: ''
  references: []
  page_start: 80
  audit_raw: 'For environments that do not use vCenter server to manage ESXi, this is not applicable.

    From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> Networking.

    Review the VLAN associated with the vMotion VMkernel(s) and verify they are

    dedicated for that purpose and are logically separated from other functions.

    If long distance or cross vCenter vMotion is used, the vMotion network can be routable

    but must be accessible to only the intended ESXi hosts.

    If the vMotion port group is not on an isolated VLAN and/or is routable to systems other

    than ESXi hosts, this is a finding.'
  remediation: 'Configuration of the vMotion VMkernel will be unique to each environment.

    As an example, to modify the IP address and VLAN information to the correct network

    on a distributed switch do the following:

    From the vSphere Client, go to Networking.

    Select a distributed switch, select a port group, and then go to Configure >> Settings >>

    Edit >> VLAN.

    Change the "VLAN Type" to "VLAN" and change the "VLAN ID" to a network allocated

    and dedicated to vMotion traffic exclusively.'
  checks:
  - type: manual_review
    info: 'For environments that do not use vCenter server to manage ESXi, this is not applicable.

      From the vSphere Client, go to Hosts and Clusters.

      Select the ESXi Host >> Configure >> Networking.

      Review the VLAN associated with the vMotion VMkernel(s) and verify they are

      dedicated for that purpose and are logically separated from other functions.

      If long distance or cross vCenter vMotion is used, the vMotion network can be routable

      but must be accessible to only the intended ESXi hosts.

