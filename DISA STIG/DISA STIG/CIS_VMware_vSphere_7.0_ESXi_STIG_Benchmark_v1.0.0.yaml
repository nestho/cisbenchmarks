      or

      From a PowerCLI command prompt while connected to the ESXi host, run the following

      command:

      Get-VMHost | Get-VMHostHba | Where {$_.Type -eq "iscsi"} | Select

      AuthenticationPr'
    severity: medium
- id: '1.42'
  title: ESXI-70-000055
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The ESXi host must disable Inter-Virtual Machine (VM) Transparent Page Sharing. GROUP ID: V-256416 RULE ID:
    SV-256416r959010'
  rationale: Published academic papers have demonstrated that by forcing a flush and reload of cache memory, it is possible
    to measure memory timings to try to determine an Advanced Encryption Standard (AES) encryption key in use on another virtual
    machine running on the same physical processor of the host server if Transparent Page Sharing (TPS) is enabled between
    the two VMs. This technique works only in a highly controlled system configured in a nonstandard way that VMware believes
    would not be recreated in a production environment. Although VMware believes information being disclosed in real-world
    conditions is unrealistic, out of an abundance of caution, upcoming ESXi Update releases will no longer enable TPS between
    VMs by default (TPS will still be used within individual VMs).
  impact: ''
  references: []
  page_start: 90
  audit_raw: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Advanced System Settings.

    Select the "Mem.ShareForceSalting" value and verify it is set to "2".

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHost | Get-AdvancedSetting -Name Mem.ShareForceSalting

    If the "Mem.ShareForceSalting" setting is not set to "2", this is a finding.'
  remediation: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Advanced System Settings.

    Click "Edit". Select the "Mem.ShareForceSalting" value and set it to "2".

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHost | Get-AdvancedSetting -Name Mem.ShareForceSalting | SetAdvancedSetting -Value 2'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, go to Hosts and Clusters.

      Select the ESXi Host >> Configure >> System >> Advanced System Settings.

      Select the "Mem.ShareForceSalting" value and verify it is set to "2".

      or

      From a PowerCLI command prompt while connected to the ESXi host, run the following

      command:

      Get-VMHost | Get-AdvancedSetting -Name Mem.ShareForceSalting

      If the "Mem.ShareForceSalting" setting is not set to "2", this is a finding.'
    severity: medium
- id: '1.43'
  title: ESXI-70-000056
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host must configure the firewall to restrict access to services running on the host. GROUP ID: V-256417
    RULE ID: SV-256417r959010'
  rationale: Unrestricted access to services running on an ESXi host can expose a host to outside attacks and unauthorized
    access. Reduce the risk by configuring the ESXi firewall to only allow access from authorized networks.
  impact: ''
  references: []
  page_start: 92
  audit_raw: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Firewall.

    Under the "Allowed IP addresses" column, review the allowed IPs for each service.

    Check this for "Incoming" and "Outgoing" sections.

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHost | Get-VMHostFirewallException | Where {$.Enabled -eq $true} | Select

    Name,Enabled,@{N="AllIPEnabled";E={$.ExtensionData.AllowedHosts.AllIP}}

    If for an enabled service "Allow connections from any IP address" is selected, this is a

    finding.'
  remediation: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Firewall.

    Click "Edit...". For each enabled service, uncheck the check box to "Allow connections

    from any IP address" and input the site-specific network(s) required.

    The following example formats are acceptable:

    192.168.0.0/24

    192.168.1.2, 2001::1/64

    fd3e:29a6:0a81:e478::/64

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    commands:

    $esxcli = Get-EsxCli -v2

    #This disables the allow all rule for the target service. We are targeting the sshServer

    service in this example.

    $arguments = $esxcli.network.firewall.ruleset.set.CreateArgs()

    $arguments.rulesetid = "sshServer"

    $arguments.allowedall = $false

    $esxcli.network.firewall.ruleset.set.Invoke($arguments)

    #Next add the allowed IPs for the service. Note doing the "vSphere Web Client" service

    this way may disable access but may be done through vCenter or through the console.

    $arguments = $esxcli.network.firewall.ruleset.allowedip.add.CreateArgs()

    $arguments.rulesetid = "sshServer"

    $arguments.ipaddress = "10.0.0.0/8"

    $esxcli.network.firewall.ruleset.allowedip.add.Invoke($arguments)

    This must be done for each enabled service.'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, go to Hosts and Clusters.

      Select the ESXi Host >> Configure >> System >> Firewall.

      Under the "Allowed IP addresses" column, review the allowed IPs for each service.

