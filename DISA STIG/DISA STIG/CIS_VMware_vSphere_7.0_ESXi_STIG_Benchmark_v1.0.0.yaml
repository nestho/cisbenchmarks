- id: '1.68'
  title: ESXI-70-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi host rhttpproxy daemon must use FIPS 140-2 validated cryptographic modules to protect the confidentiality
    of remote access sessions. GROUP ID: V-256442 RULE ID: SV-256442r958408'
  rationale: ESXi runs a reverse proxy service called rhttpproxy that front ends internal services and application programming
    interfaces (APIs) over one HTTPS port by redirecting virtual paths to localhost ports. This proxy implements a FIPS 140-2
    validated OpenSSL cryptographic module that is in FIPS mode by default. This configuration must be validated and maintained
    to protect the traffic that rhttpproxy manages.
  impact: ''
  references: []
  page_start: 143
  audit_raw: 'From an ESXi shell, run the following command:

    # esxcli system security fips140 rhttpproxy get

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    commands:

    $esxcli = Get-EsxCli -v2

    $esxcli.system.security.fips140.rhttpproxy.get.invoke()

    Expected result:

    Enabled: true

    If the output does not match the expected result, this is a finding.'
  remediation: 'From an ESXi shell, run the following command:

    # esxcli system security fips140 rhttpproxy set -e true

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    commands:

    $esxcli = Get-EsxCli -v2

    $arguments = $esxcli.system.security.fips140.rhttpproxy.set.CreateArgs()

    $arguments.enable = $true

    $esxcli.system.security.fips140.rhttpproxy.set.Invoke($arguments)'
  checks:
  - type: manual_review
    info: 'From an ESXi shell, run the following command:

      # esxcli system security fips140 rhttpproxy get

      or

      From a PowerCLI command prompt while connected to the ESXi host, run the following

      commands:

      $esxcli = Get-EsxCli -v2

      $esxcli.system.security.fips140.rhttpproxy.get.invoke()

      Expected result:

      Enabled: true

      If the output does not match the expected result, this is a finding.'
    severity: medium
