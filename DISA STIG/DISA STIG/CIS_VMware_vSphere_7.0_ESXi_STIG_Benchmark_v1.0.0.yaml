- id: '1.50'
  title: ESXI-70-000063
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'All port groups on standard switches must be configured to a value other than that of the native virtual local
    area network (VLAN). GROUP ID: V-256424 RULE ID: SV-256424r959010'
  rationale: ESXi does not use the concept of native VLAN. Frames with a VLAN specified in the port group will have a tag,
    but frames with VLAN not specified in the port group are not tagged and therefore will belong to the native VLAN of the
    physical switch. For example, frames on VLAN 1 from a Cisco physical switch will be untagged, because this is considered
    as the native VLAN. However, frames from ESXi specified as VLAN 1 will be tagged with a "1"; therefore, traffic from ESXi
    that is destined for the native VLAN will not be routed correctly (because it is tagged with a "1" instead of being untagged),
    and traffic from the physical switch coming from the native VLAN will not be visible (because it is not tagged). If the
    ESXi virtual switch port group uses the native VLAN ID, traffic from those virtual machines (VMs) will not be visible
    to the native VLAN on the switch because the switch is expecting untagged traffic.
  impact: ''
  references: []
