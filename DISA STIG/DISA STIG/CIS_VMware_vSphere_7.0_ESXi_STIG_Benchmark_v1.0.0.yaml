      Require Secure Boot: true

      If the output does not match the expected result, this is a findi'
    severity: medium
- id: '1.74'
  title: ESXI-70-000097
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The ESXi Common Information Model (CIM) service must be disabled. GROUP ID: V-256448 RULE ID: SV-256448r1051419'
  rationale: The CIM system provides an interface that enables hardware-level management from remote applications via a set
    of standard application programming interfaces (APIs). These APIs are consumed by external applications such as HP SIM
    or Dell OpenManage for agentless, remote hardware monitoring of the ESXi host. To reduce attack surface area and following
    the minimum functionality principal, the CIM service must be disabled unless explicitly needed and approved.
  impact: ''
  references: []
  page_start: 155
  audit_raw: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Services.

    Locate the "CIM Server" service and verify the "Daemon" is "Stopped" and the "Startup

    Policy" is set to "Start and stop manually".

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    command:

    Get-VMHost | Get-VMHostService | Where {$_.Label -eq "CIM Server"}

    If the "CIM Server" service does not have a "Policy" of "off" or is running, this is a

    finding.'
  remediation: 'From the vSphere Client, go to Hosts and Clusters.

    Select the ESXi Host >> Configure >> System >> Services.

    Select the "CIM Server" service. If the service is started, click "Stop".

    Click "Edit Startup Policy...". Select "Start and stop manually". Click "OK".

    or

    From a PowerCLI command prompt while connected to the ESXi host, run the following

    commands:

    Get-VMHost | Get-VMHostService | Where {$.Label -eq "CIM Server"} | SetVMHostService -Policy Off

    Get-VMHost | Get-VMHostService | Where {$.Label -eq "CIM Server"} | StopVMHostService'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, go to Hosts and Clusters.

