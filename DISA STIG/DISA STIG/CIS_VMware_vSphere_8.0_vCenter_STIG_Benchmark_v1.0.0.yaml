- id: '1.28'
  title: VCSA-80-000253
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter server must enforce SNMPv3 security features where SNMP is required. GROUP ID: V-258931 RULE ID:
    SV-258931r961878'
  rationale: SNMPv3 supports commercial-grade security, including authentication, authorization, access control, and privacy.
    Previous versions of the protocol contained well-known security weaknesses that were easily exploited. SNMPv3 can be configured
    for identification and cryptographically based authentication. SNMPv3 defines a user-based security model (USM) and a
    view-based access control model (VACM). SNMPv3 USM provides data integrity, data origin authentication, message replay
    protection, and protection against disclosure of the message payload. SNMPv3 VACM provides access control to determine
    whether a specific type of access (read or write) to the management information is allowed. Implement both VACM and USM
    for full protection. SNMPv3 must be disabled by default and enabled only if used. SNMP v3 provides security feature enhancements
    to SNMP, including encryption and message authentication.
  impact: ''
  references: []
  page_start: 66
  audit_raw: 'At the command prompt on the vCenter Server Appliance, run the following commands:

    appliancesh

    snmp.get

    Note: The "appliancesh" command is not needed if the default shell has not been

    changed for root.

    If "Enable" is set to "False", this is not a finding.

    If "Enable" is set to "True" and "Authentication" is not set to "SHA1", this is a finding.

    If "Enable" is set to "True" and "Privacy" is not set to "AES128", this is a finding.

    If any "Users" are configured with a "Sec_level" that does not equal "priv", this is a

    finding.'
  remediation: 'At the command prompt on the vCenter Server Appliance, run the following commands:

    appliancesh

    snmp.set --authentication SHA1

    snmp.set --privacy AES128

    To change the security level of a user, run the following command:

    snmp.set --users /<auth_password> <priv_password>/priv'
  checks:
  - type: manual_review
    info: 'At the command prompt on the vCenter Server Appliance, run the following commands:

      appliancesh

      snmp.get

      Note: The "appliancesh" command is not needed if the default shell has not been

      changed for root.

      If "Enable" is set to "False", this is not a finding.

      If "Enable" is set to "True" and "Authentication" is not set to "SHA1", this is a finding.

      If "Enable" is set to "True" and "Privacy" is not set to "AES128", this is a finding.

      If any "Users" are configured with a "Sec_level" that does not equa'
    severity: medium
