    Click the "VLAN" tab.

    If "VLAN trunking" is not authorized, remove it by setting "VLAN type" to "VLAN" and

    configure an appropriate VLAN ID. Click "OK".

    If "VLAN trunking" is authorized but the range is too broad, modify the range in the

    "VLAN trunk range" field to the minimum necessary and authorized range. An example

    range would be "1,3-5,8". Click "OK".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following command to configure trunking:

    Get-VDPortgroup "Portgroup Name" | Set-VDVlanConfiguration -VlanTrunkRange

    "<VLAN Range(s) comma separated>"

    or

    Run this command to configure a single VLAN ID:

    Get-VDPortgroup "Portgroup Name" | Set-VDVlanConfiguration -VlanId "<New VLAN>"'
  checks:
