- id: '1.40'
  title: VCSA-80-000274
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must not configure all port groups to virtual local area network (VLAN) values reserved
    by upstream physical switches. GROUP ID: V-258941 RULE ID: SV-258941r961863'
  rationale: Certain physical switches reserve certain VLAN IDs for internal purposes and often disallow traffic configured
    to these values. For example, Cisco Catalyst switches typically reserve VLANs 1001 to 1024 and 4094, while Nexus switches
    typically reserve 3968 to 4094. Check with the documentation for the organization's specific switch. Using a reserved
    VLAN might result in a denial of service on the network.
  impact: ''
  references: []
  page_start: 89
  audit_raw: 'If distributed switches are not used, this is not applicable.

    From the vSphere Client, go to "Networking".

    Select a distributed switch >> Select a distributed port group >> Configure >> Settings

    >> Policies.

    Review the port group VLAN tags and verify that they are not set to a reserved VLAN

    ID.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following command:

    Get-VDPortgroup | select Name, VlanConfiguration

    If any port group is configured with a reserved VLAN ID, this is a finding.'
  remediation: 'From the vSphere Client, go to "Networking".

    Select a distributed switch >> Select a distributed port group >> Configure >> Settings

    >> Policies.

    Click "Edit".

    Click the "VLAN" tab. Change the VLAN ID to an unreserved VLAN ID.

    Click "OK".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following command:

    Get-VDPortgroup "portgroup name" | Set-VDVlanConfiguration -VlanId "New VLAN"'
  checks:
  - type: manual_review
    info: 'If distributed switches are not used, this is not applicable.

      From the vSphere Client, go to "Networking".

      Select a distributed switch >> Select a distributed port group >> Configure >> Settings

