      Under "Authentication method", examine the allowed methods.

      If "Smart card authentication" is not enabled and "Password and windows session

      authentication" is not disabled, this is a finding.'
    severity: medium
- id: '1.48'
  title: VCSA-80-000284
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must restrict access to the default roles with cryptographic permissions. GROUP ID: V-258951
    RULE ID: SV-258951r1003606'
  rationale: In vSphere, the built-in "Administrator" role contains permission to perform cryptographic operations such as
    Key Management Server (KMS) functions and encrypting and decrypting virtual machine disks. This role must be reserved
    for cryptographic administrators where virtual machine encryption and/or vSAN encryption is in use. A new built-in role
    called "No Cryptography Administrator" exists to provide all administrative permissions except cryptographic operations.
    Permissions must be restricted such that normal vSphere administrators are assigned the "No Cryptography Administrator"
    role or more restrictive. The "Administrator" role must be tightly controlled and must not be applied to administrators
    who will not be doing cryptographic work. Catastrophic data loss can result from poorly administered cryptography.
  impact: ''
  references: []
  page_start: 105
  audit_raw: 'By default, there are five roles that contain cryptographic related permissions:

    Administrator, No Trusted Infrastructure Administrator, vCLSAdmin, VMOperator

    Controller Manager, and vSphere Kubernetes Manager.

    From the vSphere Client, go to Administration >> Access Control >> Roles.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following command:

    Get-VIPermission | Where {$.Role -eq "Admin" -or $.Role -eq "NoTrustedAdmin" -or

    $.Role -eq "vCLSAdmin" -or $.Role -eq "VMOperatorController" -or $_.Role -eq

    "vSphereKubernetesManager"} | Select Role,Principal,Entity,Propagate,IsGroup | FT -

    Auto

    If there are any users or groups assigned to the default roles with cryptographic

    permissions and are not explicitly designated to perform cryptographic operations, this

    is a finding.

    The built-in solution users assigned to the administrator role are NOT a finding.'
  remediation: 'From the vSphere Client, go to Administration >> Access Control >> Roles.

    Move any accounts not explicitly designated for cryptographic operations, other than

    Solution Users, to other roles such as "No Cryptography Administrator".'
