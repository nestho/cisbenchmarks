- id: '1.16'
  title: VCSA-80-000079
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must enforce a 90-day maximum password lifetime restriction. GROUP ID: V-258918 RULE ID:
    SV-258918r1043190'
  rationale: Any password, no matter how complex, can eventually be cracked. Therefore, passwords must be changed at specific
    intervals. One method of minimizing this risk is to use complex passwords and periodically change them. If the application
    does not limit the lifetime of passwords and force users to change their passwords, there is the risk that the system
    and/or application passwords could be compromised. This requirement does not include emergency administration accounts,
    which are meant for access to the application in case of failure. These accounts are not required to have maximum password
    lifetime restrictions.
  impact: ''
  references: []
  page_start: 43
