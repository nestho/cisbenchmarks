- id: '1.66'
  title: VCSA-80-000304
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must enable data in transit encryption for vSAN. GROUP ID: V-258969 RULE ID: SV-258969r961863'
  rationale: 'Transit encryption must be enabled to prevent unauthorized disclosure information and to protect the confidentiality
    of organizational information. vSAN data-in-transit encryption has the following characteristics: -vSAN uses AES-256 bit
    encryption on data in transit. -Forward secrecy is enforced for vSAN data-in-transit encryption. -Traffic between data
    hosts and witness hosts is encrypted. -File service data traffic between the VDFS proxy and VDFS server is encrypted.
    -vSAN file services inter-host connections are encrypted. -vSAN uses symmetric keys that are generated dynamically and
    shared between hosts. Hosts dynamically generate an encryption key when they establish a connection, and they use the
    key to encrypt all traffic between the hosts. You do not need a key management server to perform data-in-transit encryption.
    Each host is authenticated when it joins the cluster, ensuring connections only to trusted hosts are allowed. When a host
    is removed from the cluster, it is authentication certificate is removed. vSAN data-in-transit encryption is a cluster-wide
    setting. When enabled, all data and metadata traffic is encrypted as it transits across hosts.'
  impact: ''
  references: []
  page_start: 134
  audit_raw: 'If no clusters are enabled for vSAN, this is not applicable.

    From the vSphere Client, go to Host and Clusters.

    Select the vCenter Server >> Select the cluster >> Configure >> vSAN >> Services >>

    Data Services.

    Review the "Data-in-transit encryption" status.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following commands:

    $vsanclusterconf = Get-VsanView -Id VsanVcClusterConfigSystem-vsan-cluster-configsystem

    $vsanclusterconf.VsanClusterGetConfig((Get-Cluster -Name

    ).ExtensionData.MoRef).DataInTransitEncryptionConfig

    Repeat these steps for each vSAN enabled cluster in the environment.

    If "Data-In-Transit encryption" is not enabled, this is a finding.'
  remediation: 'From the vSphere Client, go to Host and Clusters.

    Select the vCenter Server >> Select the target cluster >> Configure >> vSAN >>

    Services >> Data Services.

    Click "Edit".

    Enable "Data-In-Transit encryption" and choose a rekey interval suitable for the

    environment then click "Apply".'
  checks:
  - type: manual_review
    info: 'If no clusters are enabled for vSAN, this is not applicable.

      From the vSphere Client, go to Host and Clusters.

      Select the vCenter Server >> Select the cluster >> Configure >> vSAN >> Services >>

      Data Services.

      Review the "Data-in-transit encryption" status.

      or

      From a PowerCLI command prompt while connected to the vCenter server, run the

      following commands:

      $vsanclusterconf = Get-VsanView -Id VsanVcClusterConfigSystem-vsan-cluster-configsystem

      $vsanclusterconf.VsanClusterGetConfig((Get-Cluster -N'
    severity: medium
- id: '1.67'
  title: VCSA-80-000305
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must disable accounts used for Integrated Windows Authentication (IWA). GROUP ID: V-265979
    RULE ID: SV-265979r1003616'
  rationale: If not used for their intended purpose, default accounts must be disabled. vCenter ships with several default
    accounts, two of which are specific to IWA and SASL/Kerberos authentication. If other methods of authentication are used,
    these accounts are not needed and must be disabled.
  impact: ''
  references: []
  page_start: 136
  audit_raw: 'If IWA is used for vCenter authentication, this is not applicable.

    From the vSphere Client, go to Administration >> Single Sign On >> Users and Groups

    >> Users.

    Change the domain to "vsphere.local" and review the "K/M" and

    "krbtgt/VSPHERE.LOCAL" accounts.

    If the "K/M" and "krbtgt/VSPHERE.LOCAL" accounts are not disabled, this is a finding.'
  remediation: 'From the vSphere Client, go to Administration >> Single Sign On >> Users and Groups

    >> Users.

    Select the "K/M" or "krbtgt/VSPHERE.LOCAL" and click "More" then select "Disable".

    Click "Ok" to disable the user account.'
  checks:
  - type: manual_review
    info: 'If IWA is used for vCenter authentication, this is not applicable.

      From the vSphere Client, go to Administration >> Single Sign On >> Users and Groups

      >> Users.

      Change the domain to "vsphere.local" and review the "K/M" and

      "krbtgt/VSPHERE.LOCAL" accounts.

