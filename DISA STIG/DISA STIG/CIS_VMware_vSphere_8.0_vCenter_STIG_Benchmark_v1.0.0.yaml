- id: '1.50'
  title: VCSA-80-000286
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must have Mutual Challenge Handshake Authentication Protocol (CHAP) configured for vSAN
    Internet Small Computer System Interface (iSCSI) targets. GROUP ID: V-258953 RULE ID: SV-258953r961863'
  rationale: When enabled, vSphere performs bidirectional authentication of both the iSCSI target and host. When not authenticating
    both the iSCSI target and host, the potential exists for a man-in-the-middle attack in which an attacker might impersonate
    either side of the connection to steal data. Bidirectional authentication mitigates this risk.
  impact: ''
  references: []
  page_start: 109
  audit_raw: 'If no clusters are enabled for vSAN or if vSAN is enabled but iSCSI is not enabled, this

    is not applicable.

    From the vSphere Client, go to Host and Clusters.

    Select a vSAN Enabled Cluster >> Configure >> vSAN >> iSCSI Target Service.

    For each iSCSI target, review the value in the "Authentication" column.

    If the Authentication method is not set to "CHAP_Mutual" for any iSCSI target, this is a

    finding.'
  remediation: 'From the vSphere Client, go to Host and Clusters.

    Select a vSAN Enabled Cluster >> Configure >> vSAN >> iSCSI Target Service.

    For each iSCSI target, select the item and click "Edit".

    Change the "Authentication" field to "Mutual CHAP" and configure the incoming and

    outgoing users and secrets appropriately.'
  checks:
  - type: manual_review
    info: 'If no clusters are enabled for vSAN or if vSAN is enabled but iSCSI is not enabled, this

      is not applicable.

      From the vSphere Client, go to Host and Clusters.

      Select a vSAN Enabled Cluster >> Configure >> vSAN >> iSCSI Target Service.

      For each iSCSI target, review the value in the "Authentication" column.

      If the Authentication method is not set to "CHAP_Mutual" for any iSCSI target, this is a

      finding.'
    severity: medium
- id: '1.51'
  title: VCSA-80-000287
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must have new Key Encryption Keys (KEKs) reissued at regular intervals for vSAN encrypted
    datastore(s). GROUP ID: V-258954 RULE ID: SV-258954r1003610'
  rationale: The KEK for a vSAN encrypted datastore is generated by the Key Management Server (KMS) and serves as a wrapper
    and lock around the Disk Encryption Key (DEK). The DEK is generated by the host and is used to encrypt and decrypt the
    datastore. A shallow rekey is a procedure in which the KMS issues a new KEK to the ESXi host, which rewraps the DEK but
    does not change the DEK or any data on disk. This operation must be done on a regular, site-defined interval and can be
    viewed as similar in criticality to changing an administrative password. If the KMS is compromised, a standing operational
    procedure to rekey will put a time limit on the usefulness of any stolen KMS data.
  impact: ''
  references: []
  page_start: 110
  audit_raw: 'If vSAN is not in use, this is not applicable.

    Interview the system administrator (SA) to determine that a procedure has been put in

    place to perform a shallow rekey of all vSAN encrypted datastores at regular, sitedefined intervals.

    VMware recommends a 60-day rekey task, but this interval must be defined by the SA

    and the ISSO.

    If vSAN encryption is not in use, this is not a finding.

    If vSAN encryption is in use and a regular rekey procedure is not in place, this is a

    finding.'
  remediation: 'If vSAN encryption is in use, ensure a regular rekey procedure is in place.

    To generate new encryption keys for vSAN, do the following:

    From the vSphere Client, go to Host and Clusters.

    Select the vCenter Server >> Select the cluster >> Configure >> vSAN >> Services >>

    Data Services.

    Select "Generate New Encryption Keys" and optionally generate new DEKs and click

    "Generate".'
  checks:
  - type: manual_review
    info: 'If vSAN is not in use, this is not applicable.

      Interview the system administrator (SA) to determine that a procedure has been put in

      place to perform a shallow rekey of all vSAN encrypted datastores at regular, sitedefined intervals.

      VMware recommends a 60-day rekey task, but this interval must be defined by the SA

      and the ISSO.

      If vSAN encryption is not in use, this is not a finding.

      If vSAN encryption is in use and a regular rekey procedure is not in place, this is a

      finding.'
    severity: medium
- id: '1.52'
  title: VCSA-80-000288
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must use secure Lightweight Directory Access Protocol (LDAPS) when adding an LDAP identity
    source. GROUP ID: V-258955 RULE ID: SV-258955r961863'
  rationale: LDAP is an industry standard protocol for querying directory services such as Active Directory. This protocol
    can operate in clear text or over a Secure Sockets Layer (SSL)/Transport Layer Security (TLS) encrypted tunnel. To protect
    confidentiality of LDAP communications, secure LDAP (LDAPS) must be explicitly configured when adding an LDAP identity
    source in vSphere Single Sign-On (SSO). When configuring an identity source and supplying an SSL certificate, vCenter
    will enforce LDAPS. The server URLs do not need to be explicitly provided if an SSL certificate is uploaded.
  impact: ''
  references: []
  page_start: 112
  audit_raw: 'If LDAP is not used as an identity provider, this is not applicable.

    From the vSphere Client, go to Administration >> Single Sign On >> Configuration >>

    Identity Provider.

    Click the "Identity Sources" tab.

    For each identity source of type "Active Directory over LDAP", if the "Server URL" does

    not indicate "ldaps://", this is a finding.'
  remediation: 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >>

    Identity Provider.

    Click the "Identity Sources" tab.

    For each identity source of type "Active Directory over LDAP" where LDAPS is not

    configured, highlight the item and click "Edit".

    Ensure the primary and secondary server URLs, if specified, are configured for

    "ldaps://".

    At the bottom, click the "Browse" button, select the AD LDAP cert previously exported to

    your local computer, click "Open", and "Save" to complete modifications.

    Note: With LDAPS, the server must be a specific domain controller and its specific

    certificate or the domain alias with a certificate that is valid for that URL.'
  checks:
  - type: manual_review
    info: 'If LDAP is not used as an identity provider, this is not applicable.

      From the vSphere Client, go to Administration >> Single Sign On >> Configuration >>

      Identity Provider.

      Click the "Identity Sources" tab.

      For each identity source of type "Active Directory over LDAP", if the "Server URL" does

      not indicate "ldaps://", this is a finding.'
    severity: medium
- id: '1.53'
  title: VCSA-80-000290
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must limit membership to the "SystemConfiguration.BashShellAdministrators" Single Sign-On
    (SSO) group. GROUP ID: V-258956 RULE ID: SV-258956r961863'
  rationale: vCenter SSO integrates with PAM in the underlying Photon operating system so members of the "SystemConfiguration.BashShellAdministrators"
    SSO group can log on to the operating system without needing a separate account. However, even though unique SSO users
    log on, they are transparently using a group account named "ssouser" as far as Photon auditing is concerned. While the
    audit trail can still be traced back to the individual SSO user, it is a more involved process. To force accountability
    and nonrepudiation, the SSO group "SystemConfiguration.BashShellAdministrators" must be severely restricted.
  impact: ''
  references: []
  page_start: 114
  audit_raw: 'From the vSphere Client, go to Administration >> Single Sign On >> Users and Groups

    >> Groups.

    Click the next page arrow until the "SystemConfiguration.BashShellAdministrators"

    group appears.

    Click "SystemConfiguration.BashShellAdministrators".

    Review the members of the group and ensure that only authorized accounts are

    present.

    Note: By default the Administrator and a unique service account similar to "vmwareapplmgmtservice-714684a4-342f-4eff-a232-cdc21def00c2"
    will be in the group and

    should not be removed.

    If there are any accounts present as members of

    SystemConfiguration.BashShellAdministrators that are not authorized, this is a finding.'
  remediation: 'From the vSphere Client, go to Administration >> Single Sign On >> Users and Groups

    >> Groups.

    Click the next page arrow until the "SystemConfiguration.BashShellAdministrators"

    group appears.

    Click "SystemConfiguration.BashShellAdministrators".

    Click the three vertical dots next to the name of each unauthorized account.

    Select "Remove Member".'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, go to Administration >> Single Sign On >> Users and Groups

      >> Groups.

      Click the next page arrow until the "SystemConfiguration.BashShellAdministrators"

