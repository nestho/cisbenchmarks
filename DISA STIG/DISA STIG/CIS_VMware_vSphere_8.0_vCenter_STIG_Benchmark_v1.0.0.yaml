  description: 'The vCenter Server must remove unauthorized port mirroring sessions on distributed switches. GROUP ID: V-258965
    RULE ID: SV-258965r961863'
  rationale: The vSphere Distributed Virtual Switch can enable port mirroring sessions allowing traffic to be mirrored from
    one source to a destination. If port mirroring is configured unknowingly this could allow an attacker to observe network
    traffic of virtual machines.
