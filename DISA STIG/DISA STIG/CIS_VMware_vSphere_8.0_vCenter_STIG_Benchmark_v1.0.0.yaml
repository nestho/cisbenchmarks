      the attached physical switch.

      or

      From a PowerCLI command prompt while connected to the vCenter server, run the

      following command:

      Get-VDPortgroup | select Name, VlanConfiguration

      If any port group is configu'
    severity: medium
- id: '1.37'
  title: VCSA-80-000273
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must not configure VLAN Trunking unless Virtual Guest Tagging (VGT) is required and authorized.
    GROUP ID: V-258940 RULE ID: SV-258940r961863'
  rationale: When a port group is set to VLAN Trunking, the vSwitch passes all network frames in the specified range to the
    attached virtual machines without modifying the virtual local area network (VLAN) tags. In vSphere, this is referred to
    as VGT. The virtual machine must process the VLAN information itself via an 802.1Q driver in the operating system. VLAN
    Trunking must only be implemented if the attached virtual machines have been specifically authorized and are capable of
    managing VLAN tags themselves. If VLAN Trunking is enabled inappropriately, it may cause a denial of service or allow
    a virtual machine to interact with traffic on an unauthorized VLAN.
  impact: ''
  references: []
  page_start: 83
  audit_raw: 'If distributed switches are not used, this is not applicable.

    From the vSphere Client, go to "Networking".

    Select a distributed switch >> Select a distributed port group >> Configure >> Settings

    >> Policies.

    Review the port group "VLAN Type" and "VLAN trunk range", if present.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following command:

    Get-VDPortgroup | Where {$_.ExtensionData.Config.Uplink -ne "True"} | Select

    Name,VlanConfiguration

    If any port group is configured with "VLAN trunking" and is not documented as a needed

    exception (such as NSX appliances), this is a finding.

    If any port group is authorized to be configured with "VLAN trunking" but is not

    configured with the most limited range necessary, this is a finding.'
  remediation: 'From the vSphere Client, go to "Networking".

    Select a distributed switch >> Select a distributed port group >> Configure >> Settings

    >> Policies.

