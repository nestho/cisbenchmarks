    severity: medium
- id: '1.47'
  title: VCSA-80-000283
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must disable Username/Password and Windows Integrated Authentication. GROUP ID: V-258950
    RULE ID: SV-258950r961863'
  rationale: All forms of authentication other than Common Access Card (CAC) must be disabled. Password authentication can
    be temporarily reenabled for emergency access to the local Single Sign-On (SSO) accounts or Active Directory user/pass
    accounts, but it must be disabled as soon as CAC authentication is functional.
  impact: ''
  references: []
  page_start: 103
  audit_raw: 'If a federated identity provider is configured and used for an identity source, this is not

    applicable.

    From the vSphere Client, go to Administration >> Single Sign On >> Configuration >>

    Identity Provider >> Smart Card Authentication.

    Under "Authentication method", examine the allowed methods.

    If "Smart card authentication" is not enabled and "Password and windows session

    authentication" is not disabled, this is a finding.'
  remediation: 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >>

    Identity Provider >> Smart Card Authentication.

    Next to "Authentication method", click "Edit".

    Select to radio button to "Enable smart card authentication".

    Click "Save".

    To re-enable password authentication for troubleshooting purposes, run the following

    command on the vCenter Server Appliance:

    /opt/vmware/bin/sso-config.sh -set_authn_policy -pwdAuthn true -winAuthn false -

    certAuthn false -securIDAuthn false -t vsphere.local'
  checks:
  - type: manual_review
    info: 'If a federated identity provider is configured and used for an identity source, this is not

