- id: '1.32'
  title: VCSA-80-000268
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must set the distributed port group Forged Transmits policy to "Reject". GROUP ID: V-258935
    RULE ID: SV-258935r961863'
  rationale: If the virtual machine operating system changes the Media Access Control (MAC) address, the operating system
    can send frames with an impersonated source MAC address at any time. This allows an operating system to stage malicious
    attacks on the devices in a network by impersonating a network adaptor authorized by the receiving network. When the "Forged
    Transmits" option is set to "Accept", ESXi does not compare source and effective MAC addresses. To protect against MAC
    impersonation, set the "Forged Transmits" option to "Reject". The host compares the source MAC address being transmitted
    by the guest operating system with the effective MAC address for its virtual machine adapter to determine if they match.
    If the addresses do not match, the ESXi host drops the packet.
  impact: ''
  references: []
  page_start: 72
  audit_raw: 'If distributed switches are not used, this is not applicable.

    From the vSphere Client, go to "Networking".

    Select a distributed switch >> Select a port group >> Configure >> Settings >> Policies.

    Verify "Forged Transmits" is set to "Reject".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following commands:

    Get-VDSwitch | Get-VDSecurityPolicy

    Get-VDPortgroup | ?{$_.IsUplink -eq $false} | Get-VDSecurityPolicy

    If the "Forged Transmits" policy is set to accept for a nonuplink port, this is a finding.'
  remediation: 'From the vSphere Client, go to "Networking".

    Select a distributed switch >> Select a port group >> Configure >> Settings >> Policies.

    Click "Edit".

    Click the "Security" tab.

    Set "Forged Transmits" to "Reject".

    Click "OK".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following commands:

    Get-VDSwitch | Get-VDSecurityPolicy | Set-VDSecurityPolicy -ForgedTransmits $false

    Get-VDPortgroup | ?{$_.IsUplink -eq $false} | Get-VDSecurityPolicy | SetVDSecurityPolicy -ForgedTransmits $false'
  checks:
  - type: manual_review
    info: 'If distributed switches are not used, this is not applicable.

