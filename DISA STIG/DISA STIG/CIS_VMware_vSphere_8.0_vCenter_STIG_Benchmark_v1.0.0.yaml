- id: '1.25'
  title: VCSA-80-000195
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server Machine Secure Sockets Layer (SSL) certificate must be issued by a DOD certificate authority.
    GROUP ID: V-258928 RULE ID: SV-258928r961596'
  rationale: Untrusted certificate authorities (CA) can issue certificates, but they may be issued by organizations or individuals
    that seek to compromise DOD systems or by organizations with insufficient security controls. If the CA used for verifying
    the certificate is not a DOD-approved CA, trust of this CA has not been established. The DOD will only accept public key
    infrastructure (PKI) certificates obtained from a DOD-approved internal or external certificate authority. Reliance on
    CAs for the establishment of secure sessions includes, for example, the use of Transport Layer Security (TLS) certificates.
    The default self-signed, VMware Certificate Authority (VMCA)-issued vCenter reverse proxy certificate must be replaced
    with a DOD-approved certificate. The use of a DOD certificate on the vCenter reverse proxy and other services assures
    clients that the service they are connecting to is legitimate and trusted.
  impact: ''
  references: []
  page_start: 61
  audit_raw: 'From the vSphere Client, go to Administration >> Certificates >> Certificate

    Management >> Machine SSL Certificate.

    Click "View Details" and examine the "Issuer Information" block.

    If the issuer specified is not a DOD approved certificate authority, this is a finding.'
  remediation: 'Obtain a DOD-issued certificate and private key for each vCenter in the system

    following the requirements below:

    Key size: 2048 bits or more (PEM encoded)

    CRT format (Base-64)

    x509 version 3

    SubjectAltName must contain DNS Name=<machine_FQDN>

    Contains the following Key Usages: Digital Signature, Non Repudiation, Key

    Encipherment

    Export the entire certificate issuing chain up to the root in Base-64 format. Concatenate

    the individual certificates into one file with the ".cer" extension.

    From the vSphere Client, go to Administration >> Certificates >> Certificate

    Management >> Machine SSL Certificate.

    Click Actions >> Import and Replace Certificate.

    Select the "Replace with external CA certificate" radio button and click "Next".

    Supply the CA-issued certificate , the exported roots file, and the private key.

    Click "Replace".'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, go to Administration >> Certificates >> Certificate

      Management >> Machine SSL Certificate.

      Click "View Details" and examine the "Issuer Information" block.

      If the issuer specified is not a DOD approved certificate authority, this is a finding.'
    severity: medium
- id: '1.26'
  title: VCSA-80-000196
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must enable data at rest encryption for vSAN. GROUP ID: V-258929 RULE ID: SV-258929r961599'
  rationale: Applications handling data requiring "data at rest" protections must employ cryptographic mechanisms to prevent
    unauthorized disclosure and modification of the information at rest. Data encryption is a common technique used in environments
    that require additional levels of security. It consists of a process to ensure that data can only be consumed by systems
    that have appropriate levels of access. Approved systems must have and use the appropriate cryptographic keys to encrypt
    and decrypt the data. Systems that do not have the keys will not be able to consume the data in any meaningful way, as
    it will remain encrypted in accordance with the commonly used Advanced Encryption Standard (AES) from the National Institute
    of Standards and Technology, or NIST. vSAN supports Data-At-Rest Encryption and Data-in-Transit Encryption and uses an
    AES 256 cipher. Data is encrypted after all other processing, such as deduplication, is performed. Data at rest encryption
    protects data on storage devices in case a device is removed from the cluster.
  impact: ''
  references: []
  page_start: 63
  audit_raw: 'If no clusters are enabled for vSAN, this is not applicable.

    From the vSphere Client, go to Host and Clusters.

    Select the vCenter Server >> Select the cluster >> Configure >> vSAN >> Services >>

    Data Services.

    Review the "Data-at-rest encryption" status.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

