- id: '1.38'
  title: VCSA-80-000275
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must configure the "vpxuser" auto-password to be changed every 30 days. GROUP ID: V-258942
    RULE ID: SV-258942r961863'
  rationale: 'By default, vCenter will change the "vpxuser" password automatically every 30 days. Ensure this setting meets
    site policies. If it does not, configure it to meet password aging policies. Note: It is very important the password aging
    policy is not shorter than the default interval that is set to automatically change the "vpxuser" password to preclude
    the possibility that vCenter might be locked out of an ESXi host.'
  impact: ''
  references: []
  page_start: 85
  audit_raw: 'From the vSphere Client, go to Host and Clusters.

    Select a vCenter Server >> Configure >> Settings >> Advanced Settings.

    Verify that "VirtualCenter.VimPasswordExpirationInDays" is set to "30".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following command:

    Get-AdvancedSetting -Entity -Name VirtualCenter.VimPasswordExpirationInDays

    If the "VirtualCenter.VimPasswordExpirationInDays" is set to a value other than "30" or

    does not exist, this is a finding.'
  remediation: 'From the vSphere Client, go to Host and Clusters.

