      Review the port group VLAN tags and verify that they are not set to a reserved VLAN

      ID.

      or

      From a PowerCLI command prompt while connected to the vCenter server, run the

      following command:

      Get-VDPortgroup | select Name, VlanConfiguration

      If any port group is configured with a reserved VLAN ID'
    severity: medium
- id: '1.41'
  title: VCSA-80-000277
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The vCenter Server must be isolated from the public internet but must still allow for patch notification and
    delivery. GROUP ID: V-258944 RULE ID: SV-258944r961863'
  rationale: 'vCenter and the embedded Lifecycle Manager system must never have a direct route to the internet. Despite this,
    updates and patches sourced from VMware on the internet must be delivered in a timely manner. There are two methods to
    accomplish this: a proxy server and the Update Manager Download Service (UMDS). UMDS is an optional module for Lifecycle
    Manager that fetches upgrades for virtual appliances, patch metadata, patch binaries, and notifications that would not
    otherwise be available to an isolated Lifecycle Manager directly. Alternatively, a proxy for Lifecycle Manager can be
    configured to allow controlled, limited access to the public internet for the sole purpose of patch gathering. Either
    solution mitigates the risk of internet connectivity by limiting its scope and use.'
  impact: ''
  references: []
  page_start: 91
  audit_raw: 'Check the following conditions:

    1. Lifecycle Manager must be configured to use the UMDS.

    OR

    2. Lifecycle Manager must be configured to use a proxy server for access to

    VMware patch repositories.

    OR

    3. Lifecycle Manager must disable internet patch repositories and any patches must

    be manually validated and imported as needed.

    Option 1:

    From the vSphere Client, go to Lifecycle Manager >> Settings >> Patch Setup.

    Click the "Change Download Source" button.

    Verify the "Download patches from a UMDS shared repository" radio button is selected

    and that a valid UMDS repository is supplied.

    Click "Cancel".

    If this is not set, this is a finding.

    Option 2:

    From the vSphere Client, go to Lifecycle Manager >> Settings >> Patch Setup.

    Click the "Change Download Source" button.

    Verify the "Download patches directly from the internet" radio button is selected.

    Click "Cancel".

    Navigate to the vCenter Server Management interface at https://:5480 >> Networking

    >> Proxy Settings.

    Verify that "HTTPS" is "Enabled".

    Click the "HTTPS" row.

    Verify the proxy server configuration is accurate.

    If this is not set, this is a finding.

    Option 3:

    From the vSphere Client, go to Lifecycle Manager >> Settings >> Patch Downloads.

    Verify the "Automatic downloads" option is disabled.

    From the vSphere Client, go to Lifecycle Manager >> Settings >> Patch Setup.

    Verify any download sources are disabled.

    If this is not set, this is a finding.'
  remediation: 'Option 1:

    From the vSphere Client, go to Lifecycle Manager >> Settings >> Patch Setup.

    Click the "Change Download Source" button.

    Select the "Download patches from a UMDS shared repository" radio button and supply

    a valid UMDS repository.

    Click "Save".

    Option 2:

    From the vSphere Client, go to Lifecycle Manager >> Settings >> Patch Setup.

    Click the "Change Download Source" button.

    Select the "Download patches directly from the internet" radio button.

    Click "Save".

    Navigate to the vCenter Server Management interface at https://:5480 >> Networking

    >> Proxy Settings.

    Click "Edit".

    Slide "HTTPS" to "Enabled".

    Supply the appropriate proxy server configuration.

    Click "Save".

    Option 3:

    From the vSphere Client, go to Lifecycle Manager >> Settings >> Patch Downloads.

    Click "Edit" and uncheck "Download patches".

    Under "Patch Setup" select each download source and click Disable.'
  checks:
  - type: manual_review
    info: 'Check the following conditions:

      1. Lifecycle Manager must be configured to use the UMDS.

      OR

      2. Lifecycle Manager must be configured to use a proxy server for access to

      VMware patch repositories.

      OR

      3. Lifecycle Manager must disable internet patch repositories and any patches must

      be manually validated and imported as needed.

      Option 1:

      From the vSphere Client, go to Lifecycle Manager >> Settings >> Patch Setup.

      Click the "Change Download Source" button.

      Verify the "Download patches from a UMDS sh'
    severity: medium
- id: '1.42'
  title: VCSA-80-000278
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must use unique service accounts when applications connect to vCenter. GROUP ID: V-258945
    RULE ID: SV-258945r961863'
  rationale: To not violate nonrepudiation (i.e., deny the authenticity of who is connecting to vCenter), when applications
    need to connect to vCenter they must use unique service accounts.
  impact: ''
  references: []
  page_start: 94
  audit_raw: 'Verify each external application that connects to vCenter has a unique service account

    dedicated to that application.

    For example, there should be separate accounts for Log Insight, Operations Manager,

    or anything else that requires an account to access vCenter.

    If any application shares a service account that is used to connect to vCenter, this is a

    finding.'
  remediation: 'For applications sharing service accounts, create a new service account to assign to the

    application so that no application shares a service account with another.

    When standing up a new application that requires access to vCenter, always create a

    new service account prior to installation and grant only the permissions needed for that

    application.'
  checks:
  - type: manual_review
    info: 'Verify each external application that connects to vCenter has a unique service account

      dedicated to that application.

      For example, there should be separate accounts for Log Insight, Operations Manager,

      or anything else that requires an account to access vCenter.

      If any application shares a service account that is used to connect to vCenter, this is a

      finding.'
    severity: medium
- id: '1.43'
  title: VCSA-80-000279
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must protect the confidentiality and integrity of transmitted information by isolating
    Internet Protocol (IP)-based storage traffic. GROUP ID: V-258946 RULE ID: SV-258946r961863'
  rationale: Virtual machines might share virtual switches and virtual local area networks (VLAN) with the IP-based storage
    configurations. IP-based storage includes vSAN, Internet Small Computer System Interface (iSCSI), and Network File System
    (NFS). This configuration might expose IP-based storage traffic to unauthorized virtual machine users. IP-based storage
    frequently is not encrypted. It can be viewed by anyone with access to this network. To restrict unauthorized users from
    viewing the IP-based storage traffic, the IP-based storage network must be logically separated from the production traffic.
    Configuring the IP-based storage adaptors on separate VLANs or network segments from other VMkernels and virtual machines
    will limit unauthorized users from viewing the traffic.
  impact: ''
  references: []
  page_start: 95
  audit_raw: 'If IP-based storage is not used, this is not applicable.

    IP-based storage (iSCSI, NFS, vSAN) VMkernel port groups must be in a dedicated

    VLAN that can be on a standard or distributed virtual switch that is logically separated

    from other traffic types.

    The check for this will be unique per environment.

    To check a standard switch, do the following:

    From the vSphere Client, select the ESXi host and go to Configure >> Networking >>

    Virtual switches. Select a standard switch.

    For each storage port group (iSCSI, NFS, vSAN), select the port group and note the

    VLAN ID associated with each port group.

    Verify it is dedicated to that purpose and is logically separated from other traffic types.

    To check a distributed switch, do the following,

    From the vSphere Client, go to "Networking".

    Select and expand a distributed switch.

    For each storage port group (iSCSI, NFS, vSAN), select the port group and navigate to

    the "Summary" tab.

    Note the VLAN ID associated with each port group and verify it is dedicated to that

    purpose and is logically separated from other traffic types.

    If any IP-based storage networks are not isolated from other traffic types, this is a

    finding.'
  remediation: 'Configuration of an IP-based VMkernel will be unique to each environment.

    To configure VLANs and traffic types, do the following:

    Standard switch:

    From the vSphere Client, select the ESXi host and go to Configure >> Networking >>

    VMkernel adapters.

    Select the Storage VMkernel (for any IP-based storage). Click "Edit..." and click the

    "Port properties" tab.

    Uncheck everything (unless vSAN).

    Click the "IPv4" settings or "IPv6" settings tab.

    Enter the appropriate IP address and subnet information.

    Click "OK".

    From the vSphere Client, select the ESXi host and go to Configure >> Networking >>

    Virtual switches. Select a standard switch.

    For each storage port group (iSCSI, NFS, vSAN), select the port group and click "...".

    Click "Edit Settings". On the "Properties" tab, enter the appropriate VLAN ID and click

    "OK".

    Distributed switch:

    From the vSphere Client, go to "Networking".

    Select a distributed switch >> Configure >> Settings >> Topology.

    Select the Storage VMkernel (for any IP-based storage). Click "..." and click "Edit

    Settings".

    On the "Port properties" tab, uncheck everything (unless vSAN).

    Click the "IPv4" settings or "IPv6" settings tab.

    Enter the appropriate IP address and subnet information.

    Click "OK".

    From the vSphere Client, go to "Networking".

    Select and expand a distributed switch.

    For each storage port group (iSCSI, NFS, vSAN), select the port group and navigate to

    Configure >> Settings >> Properties.

    Click "Edit".

    Click the "VLAN" tab.

    Enter the appropriate VLAN type and ID and click "OK".'
  checks:
  - type: manual_review
    info: 'If IP-based storage is not used, this is not applicable.

      IP-based storage (iSCSI, NFS, vSAN) VMkernel port groups must be in a dedicated

      VLAN that can be on a standard or distributed virtual switch that is logically separated

      from other traffic types.

      The check for this will be unique per environment.

      To check a standard switch, do the following:

      From the vSphere Client, select the ESXi host and go to Configure >> Networking >>

      Virtual switches. Select a standard switch.

      For each storage port gr'
    severity: medium
- id: '1.44'
  title: VCSA-80-000280
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter server must be configured to send events to a central log server. GROUP ID: V-258947 RULE ID:
    SV-258947r961395'
  rationale: vCenter server generates volumes of security-relevant application-level events. Examples include logins, system
    reconfigurations, system degradation warnings, and more. To ensure these events are available for forensic analysis and
    correlation, they must be sent to the syslog and forwarded on to the configured Security Information and Event Management
    (SIEM) system and/or central log server. The vCenter server sends events to syslog by default, but this configuration
    must be verified and maintained.
  impact: ''
  references: []
  page_start: 98
  audit_raw: 'From the vSphere Client, go to Host and Clusters.

    Select a vCenter Server >> Configure >> Settings >> Advanced Settings.

    Verify that "vpxd.event.syslog.enabled" value is set to "true".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following command:

    Get-AdvancedSetting -Entity -Name vpxd.event.syslog.enabled

    If the "vpxd.event.syslog.enabled" value is not set to "true", this is a finding.'
  remediation: 'From the vSphere Client, go to Host and Clusters.

    Select a vCenter Server >> Configure >> Settings >> Advanced Settings.

    Click "Edit Settings" and configure the "vpxd.event.syslog.enabled" setting to "true".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following command:

    Get-AdvancedSetting -Entity -Name vpxd.event.syslog.enabled | Set-AdvancedSetting -

    Value true'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, go to Host and Clusters.

      Select a vCenter Server >> Configure >> Settings >> Advanced Settings.

      Verify that "vpxd.event.syslog.enabled" value is set to "true".

      or

      From a PowerCLI command prompt while connected to the vCenter server, run the

      following command:

      Get-AdvancedSetting -Entity -Name vpxd.event.syslog.enabled

      If the "vpxd.event.syslog.enabled" value is not set to "true", this is a finding.'
    severity: medium
- id: '1.45'
  title: VCSA-80-000281
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must disable or restrict the connectivity between vSAN Health Check and public Hardware
    Compatibility List (HCL) by use of an external proxy server. GROUP ID: V-258948 RULE ID: SV-258948r961863'
  rationale: The vSAN Health Check is able to download the HCL from VMware to check compliance against the underlying vSAN
    Cluster hosts. To ensure the vCenter server is not directly downloading content from the internet, this functionality
    must be disabled. If this feature is necessary, an external proxy server must be configured.
  impact: ''
  references: []
  page_start: 100
  audit_raw: 'If no clusters are enabled for vSAN, this is not applicable.

    From the vSphere Client, go to Host and Clusters.

    Select the vCenter Server >> Configure >> vSAN >> Internet Connectivity.

    If the HCL internet download is not required, verify "Status" is "Disabled".

    If the "Status" is "Enabled", this is a finding.

    If the HCL internet download is required, verify "Status" is "Enabled" and a proxy host is

    configured.

    If "Status" is "Enabled" and a proxy is not configured, this is a finding.'
  remediation: 'From the vSphere Client, go to Host and Clusters.

    Select the vCenter Server >> Configure >> vSAN >> Internet Connectivity.

    Click "Edit".

    If the HCL internet download is not required, ensure that "Status" is "Disabled".

    If the HCL internet download is required, ensure that "Status" is "Enabled" and that a

    proxy host is appropriately configured.'
  checks:
  - type: manual_review
    info: 'If no clusters are enabled for vSAN, this is not applicable.

      From the vSphere Client, go to Host and Clusters.

      Select the vCenter Server >> Configure >> vSAN >> Internet Connectivity.

