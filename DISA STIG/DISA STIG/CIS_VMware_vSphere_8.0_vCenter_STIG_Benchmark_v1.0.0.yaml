  title: VCSA-80-000282
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must configure the vSAN Datastore name to a unique name. GROUP ID: V-258949 RULE ID: SV-258949r961863'
  rationale: A vSAN Datastore name by default is "vsanDatastore". If more than one vSAN cluster is present in vCenter, both
    datastores will have the same name by default, potentially leading to confusion and manually misplaced workloads.
  impact: ''
  references: []
  page_start: 101
  audit_raw: 'If no clusters are enabled for vSAN, this is not applicable.

    From the vSphere Client, go to Host and Clusters.

    Select a vSAN Enabled Cluster >> Datastores.

    Review the datastores and identify any datastores with "vSAN" as the datastore type.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following commands:

    If($(Get-Cluster | where {$.VsanEnabled} | Measure).Count -gt 0){

    Write-Host "vSAN Enabled Cluster found"

    Get-Cluster | where {$.VsanEnabled} | Get-Datastore | where {$_.type -match "vsan"}

    }

    else{

    Write-Host "vSAN is not enabled, this finding is not applicable."

    }

    If vSAN is enabled and a datastore is named "vsanDatastore", this is a finding.'
  remediation: 'From the vSphere Client, go to Host and Clusters.

    Select a vSAN Enabled Cluster >> Datastores.

    Right-click on the datastore named "vsanDatastore" and select "Rename".

    Rename the datastore based on site-specific naming standards.

    Click "OK".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following commands:

    If($(Get-Cluster | where {$.VsanEnabled} | Measure).Count -gt 0){

    Write-Host "vSAN Enabled Cluster found"

    $Clusters = Get-Cluster | where {$.VsanEnabled}

    Foreach ($clus in $clusters){

    $clus | Get-Datastore | where {$_.type -match "vsan"} | Set-Datastore -Name

    $(($clus.name) + "_vSAN_Datastore")

    }

    }

    else{

    Write-Host "vSAN is not enabled, this finding is not applicable."

    }'
