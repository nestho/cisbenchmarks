- id: '1.24'
  title: VCSA-80-000158
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must compare internal information system clocks at least every 24 hours with an authoritative
    time server. GROUP ID: V-258927 RULE ID: SV-258927r1015934'
  rationale: Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining
    the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating
    system events. Sources outside of the configured acceptable allowance (drift) may be inaccurate. Additionally, unnecessary
    synchronization may have an adverse impact on system performance and may indicate malicious activity. Synchronizing internal
    information system clocks to an authoritative time server provides uniformity of time stamps for information systems with
    multiple system clocks and systems connected over a network.
  impact: ''
  references: []
