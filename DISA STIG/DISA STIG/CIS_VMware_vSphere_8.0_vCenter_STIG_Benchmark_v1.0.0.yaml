    severity: medium
- id: '1.55'
  title: VCSA-80-000292
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter server configuration must be backed up on a regular basis. GROUP ID: V-258958 RULE ID: SV-258958r961863'
  rationale: vCenter server is the control plane for the vSphere infrastructure and all the workloads it hosts. As such, vCenter
    is usually a highly critical system in its own right. Backups of vCenter can now be made at a data and configuration level
    versus traditional storage/image-based backups. This reduces recovery time by letting the system administrator (SA) spin
    up a new vCenter while simultaneously importing the backed-up data. For sites that implement the Native Key Provider (NKP),
    introduced in 7.0 Update 2, regular vCenter backups are critical. In a recovery scenario where the virtual machine files
    are intact but vCenter was lost, the encrypted virtual machines will not be able to boot as their private keys were stored
    in vCenter after it was last backed up. When using the NKP, vCenter becomes critical to the virtual machine workloads
    and ceases to be just the control plane.
  impact: ''
  references: []
  page_start: 118
  audit_raw: 'Option 1:

    If vCenter is backed up in a traditional manner, at the storage array level, interview the

    SA to determine configuration and schedule.

    Option 2:

    For vCenter native backup functionality, open the Virtual Appliance Management

    Interface (VAMI) by navigating to https://<vCenter server>:5480.

    Log in with local operating system administrative credentials or with a Single Sign-On

    (SSO) account that is a member of the "SystemConfiguration.BashShellAdministrator"

    group.

    Select "Backup" on the left navigation pane.

    On the resulting pane on the right, verify the "Status" is "Enabled".

    Click "Status" to expand the backup details.

    If vCenter server backups are not configured and there is no other vCenter backup

    system, this is a finding.

    If the backup configuration is not set to a proper, reachable location or if the schedule is

    anything less frequent than "Daily", this is a finding.'
  remediation: 'Option 1:

    Implement and document a VMware-supported storage/image-based backup schedule.

    Option 2:

    To configure vCenter native backup functionality, open the VAMI by navigating to

    https://<vCenter server>:5480.

    Log in with local operating system administrative credentials or with an SSO account

    that is a member of the "SystemConfiguration.BashShellAdministrator" group.

    Select "Backup" on the left navigation pane.

    On the resulting pane on the right, click "Configure" (or "Edit" for an existing

    configuration).

    Enter site-specific information for the backup job.

    Ensure "Schedule" is set to "Daily". Limiting the number of retained backups is

    recommended but not required.

    Click "Create".'
  checks:
  - type: manual_review
    info: 'Option 1:

      If vCenter is backed up in a traditional manner, at the storage array level, interview the

      SA to determine configuration and schedule.

      Option 2:

      For vCenter native backup functionality, open the Virtual Appliance Management

      Interface (VAMI) by navigating to https://<vCenter server>:5480.

      Log in with local operating system administrative credentials or with a Single Sign-On

      (SSO) account that is a member of the "SystemConfiguration.BashShellAdministrator"

      group.

      Select "Backup" on the l'
    severity: medium
- id: '1.56'
  title: VCSA-80-000293
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter server must have task and event retention set to at least 30 days. GROUP ID: V-258959 RULE ID:
    SV-258959r961863'
  rationale: vCenter tasks and events contain valuable historical actions, useful in troubleshooting availability issues and
    for incident forensics. While vCenter events are sent to central log servers in real time, it is important that administrators
    have quick access to this information when needed. vCenter retains 30 days of tasks and events by default, and this is
    sufficient for most purposes. The vCenter disk partitions are also sized with this in mind. Decreasing is not recommended
    for operational reasons, while increasing is not recommended unless guided by VMware support due to the partition sizing
    concerns.
  impact: ''
  references: []
  page_start: 120
  audit_raw: 'From the vSphere Client, go to Host and Clusters.

    Select a vCenter Server >> Configure >> Settings >> General.

    Click to expand the "Database" section.

    Note the "Task retention" and "Event retention" values.

    If either value is configured to less than "30" days, this is a finding.'
  remediation: 'From the vSphere Client, go to Host and Clusters.

    Select a vCenter Server >> Configure >> Settings >> General.

    Click "Edit".

    On the "Database" tab, set the value for both "Task retention" and "Event retention" to

    "30" days (default) or greater, as required by your site.

    Click "Save".'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, go to Host and Clusters.

      Select a vCenter Server >> Configure >> Settings >> General.

      Click to expand the "Database" section.

      Note the "Task retention" and "Event retention" values.

      If either value is configured to less than "30" days, this is a finding.'
    severity: medium
- id: '1.57'
  title: VCSA-80-000294
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter server Native Key Provider must be backed up with a strong password. GROUP ID: V-258960 RULE ID:
    SV-258960r1051428'
  rationale: The vCenter Native Key Provider feature was introduced in 7.0 U2 and acts as a key provider for encryption-based
    capabilities such as encrypted virtual machines without requiring an external KMS solution. When enabling this feature,
    a backup must be taken, which is a PKCS12 formatted file. If no password is provided during the backup process, this presents
    the opportunity for this to be used maliciously and compromise the environment.
  impact: ''
  references: []
  page_start: 121
  audit_raw: 'If the vCenter Native Key Provider feature is not in use, this is not applicable.

    Interview the system administrator and determine if a password was provided for any

    backups taken of the Native Key Provider.

    If backups exist for the Native Key Provider that are not password protected, this is a

    finding.'
  remediation: 'From the vSphere Client, go to Host and Clusters.

    Select a vCenter Server >> Configure >> Security >> Key Providers.

    Select the Native Key Provider, click "Back-up", and check the box "Protect Native Key

    Provider data with password".

    Provide a strong password and click "Back up key provider".

    Delete any previous backups that were not protected with a password.'
  checks:
  - type: manual_review
    info: 'If the vCenter Native Key Provider feature is not in use, this is not applicable.

      Interview the system administrator and determine if a password was provided for any

      backups taken of the Native Key Provider.

      If backups exist for the Native Key Provider that are not password protected, this is a

      finding.'
    severity: medium
- id: '1.58'
  title: VCSA-80-000295
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter server must require authentication for published content libraries. GROUP ID: V-258961 RULE ID:
    SV-258961r1051430'
  rationale: In the vSphere Client, you can create a local or a subscribed content library. By using content libraries, you
    can store and manage content in one vCenter Server instance. Alternatively, you can distribute content across vCenter
    Server instances to increase consistency and facilitate the deployment workloads at scale. When publishing a content library
    it can be protected by requiring authentication for subscribers.
  impact: ''
  references: []
  page_start: 122
  audit_raw: 'Note: If Content Libraries are not used, this is not applicable.

    From the vSphere Client, go to Content Libraries.

    Review the "Password Protected" column.

    If a content library is published and is not password protected, this is a finding.'
  remediation: 'From the vSphere Client, go to Content Libraries.

    Select the target content library.

    Select "Actions" then "Edit Settings".

    Click the checkbox to "Enable user authentication for access to this content library".

    Enter and confirm a password for the content library. Click "OK".

    Note: Any subscribed content libraries will need to be updated to enable authentication

    and provide the password.'
  checks:
  - type: manual_review
    info: 'Note: If Content Libraries are not used, this is not applicable.

      From the vSphere Client, go to Content Libraries.

      Review the "Password Protected" column.

      If a content library is published and is not password protected, this is a finding.'
    severity: medium
- id: '1.59'
  title: VCSA-80-000296
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter server must enable the OVF security policy for content libraries. GROUP ID: V-258962 RULE ID:
    SV-258962r1051432'
  rationale: In the vSphere Client, you can create a local or a subscribed content library. By using content libraries, you
    can store and manage content in one vCenter Server instance. Alternatively, you can distribute content across vCenter
    Server instances to increase consistency and facilitate the deployment workloads at scale. You can protect the OVF items
    by applying default OVF security policy to a content library. The OVF security policy enforces strict validation on OVF
    items when you deploy or update the item, import items, or synchronize OVF and OVA templates. To make sure that the OVF
    and OVA templates are signed by a trusted certificate, you can add the OVF signing certificate from a trusted CA.
  impact: ''
  references: []
  page_start: 123
  audit_raw: 'Note: If Content Libraries are not used, this is not applicable.

    From the vSphere Client, go to Content Libraries.

    Review the "Security Policy" column.

    If a content library does not have the "OVF default policy" enabled, this is a finding.'
  remediation: 'From the vSphere Client, go to Content Libraries.

    Select the target content library.

    Select "Actions" then "Edit Settings".

    Click the checkbox to "Apply Security Policy". Click "OK".

    Note: If you disable the security policy of a content library, you cannot reuse the existing

    OVF items.'
  checks:
  - type: manual_review
    info: 'Note: If Content Libraries are not used, this is not applicable.

      From the vSphere Client, go to Content Libraries.

      Review the "Security Policy" column.

      If a content library does not have the "OVF default policy" enabled, this is a finding.'
    severity: medium
- id: '1.60'
  title: VCSA-80-000298
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must separate authentication and authorization for administrators. GROUP ID: V-258963 RULE
    ID: SV-258963r961863'
  rationale: Many organizations do both authentication and authorization using a centralized directory service such as Active
    Directory. Attackers who compromise an identity source can often add themselves to authorization groups, and simply log
    into systems they should not otherwise have access to. Additionally, reliance on central identity systems means that the
    administrators of those systems are potentially infrastructure administrators, too, as they can add themselves to infrastructure
    access groups at will. The use of local SSO groups for authorization helps prevent this avenue of attack by allowing the
    centralized identity source to still authenticate users but moving authorization into vCenter itself.
  impact: ''
  references: []
  page_start: 124
  audit_raw: 'From the vSphere Client, go to Administration >> Access Control >> Roles.

    View the Administrator role and any other role providing administrative access to

    vCenter to verify the users and/or groups assigned to it by clicking on "Usage".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following command:

    Get-VIPermission | Sort Role | Select Role,Principal,Entity,Propagate,IsGroup | FT -

    Auto

    If any user or group is directly assigned a role with administrative access to vCenter that

    is from an identity provider, this is a finding.

    Note: Users and/or groups assigned to roles should be from the "VSPHERE.LOCAL"

    identity source.'
  remediation: 'To add groups from an identity provider to the local SSO Administrators group, as an

    example, do the following:

    From the vSphere Client, go to Administration >> Single Sign On >> Groups.

    Select the Administrators group and click "Edit".

    In the "Add Members" section, select the identity source and type the name of the target

    user/group in the search bar.

    Select the target user/group to add them and click "Save".

    Note: A new SSO group or groups can be created as needed and used to provide

    authorization to vCenter.

    To remove identity provider users/groups from a role, do the following:

    From the vSphere Client, go to Administration >> Access Control >> Global

    Permissions.

    Select the offending user/group and click "Delete".

    Note: If permissions are assigned on a specific object, then the role must be updated

    where it is assigned (for example, at the cluster level).'
  checks:
