- id: '1.63'
  title: VCSA-80-000301
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must not override port group settings at the port level on distributed switches. GROUP
    ID: V-258966 RULE ID: SV-258966r961863'
  rationale: Port-level configuration overrides are disabled by default. Once enabled, this allows for different security
    settings to be set from what is established at the Port Group level. If overrides are not monitored, anyone who gains
    access to a VM with a less secure VDS configuration could exploit that broader access. If there are cases where particular
    VMs require unique configurations then a different port group with the required configuration should be created instead
    of overriding port group settings.
  impact: ''
  references: []
  page_start: 129
  audit_raw: 'If distributed switches are not used, this is not applicable.

    From the vSphere Client, go to "Networking".

    Select a distributed switch >> Select a distributed port group >> Configure >> Settings

    >> Properties.

    Review the "Override port policies".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following command:

    (Get-VDPortgroup).ExtensionData.Config.Policy

    If there are any distributed port groups that allow overridden port policies, this is a

    finding.

    Note: This does not apply to the "Block Ports" or "Configure reset at disconnect"

    policies.'
  remediation: 'From the vSphere Client, go to "Networking".

    Select a distributed switch >> Select a distributed port group >> Configure >> Settings

    >> Properties.

    Click "Edit".

    Select advanced and update all port policies besides "Block Ports" to "disabled" and

    click "OK".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following command:

    $pgs = Get-VDPortgroup | Get-View

    ForEach($pg in $pgs){

    $spec = New-Object VMware.Vim.DVPortgroupConfigSpec

    $spec.configversion = $pg.Config.ConfigVersion

    $spec.Policy = New-Object VMware.Vim.VMwareDVSPortgroupPolicy

    $spec.Policy.VlanOverrideAllowed = $False

    $spec.Policy.UplinkTeamingOverrideAllowed = $False

    $spec.Policy.SecurityPolicyOverrideAllowed = $False

    $spec.Policy.IpfixOverrideAllowed = $False

    $spec.Policy.BlockOverrideAllowed = $True

    $spec.Policy.ShapingOverrideAllowed = $False

    $spec.Policy.VendorConfigOverrideAllowed = $False

    $spec.Policy.TrafficFilterOverrideAllowed = $False

    $pg.ReconfigureDVPortgroup_Task($spec)

    }'
  checks:
  - type: manual_review
    info: 'If distributed switches are not used, this is not applicable.

      From the vSphere Client, go to "Networking".

      Select a distributed switch >> Select a distributed port group >> Configure >> Settings

      >> Properties.

      Review the "Override port policies".

      or

      From a PowerCLI command prompt while connected to the vCenter server, run the

      following command:

      (Get-VDPortgroup).ExtensionData.Config.Policy

      If there are any distributed port groups that allow overridden port policies, this is a

      finding.

      Note: This'
    severity: medium
- id: '1.64'
  title: VCSA-80-000302
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must reset port configuration when virtual machines are disconnected. GROUP ID: V-258967
    RULE ID: SV-258967r961863'
  rationale: Port-level configuration overrides are disabled by default. Once enabled, this allows for different security
    settings to be set from what is established at the Port Group level. If overrides are not monitored, anyone who gains
    access to a VM with a less secure VDS configuration could exploit that broader access. If any unknown or unauthorized
    per-port overrides exist and are not discarded when a virtual machine is disconnected from that port then a future virtual
    machine connected to that port may receive a less secure port.
  impact: ''
  references: []
  page_start: 131
  audit_raw: 'If distributed switches are not used, this is not applicable.

    From the vSphere Client, go to "Networking".

    Select a distributed switch >> Select a distributed port group >> Configure >> Settings

    >> Properties.

    Review the "Configure reset at disconnect" setting.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following command:

    (Get-VDPortgroup).ExtensionData.Config.Policy.PortConfigResetAtDisconnect

    If there are any distributed port groups with "Configure reset at disconnect" configured

    to "disabled" or "False", this is a finding.'
  remediation: 'From the vSphere Client, go to "Networking".

    Select a distributed switch >> Select a distributed port group >> Configure >> Settings

    >> Properties.

    Click "Edit".

    Select advanced and update "Configure reset at disconnect" to be enabled and click

    "OK".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following command:

    $pgs = Get-VDPortgroup | Get-View

    ForEach($pg in $pgs){

    $spec = New-Object VMware.Vim.DVPortgroupConfigSpec

    $spec.configversion = $pg.Config.ConfigVersion

    $spec.Policy = New-Object VMware.Vim.VMwareDVSPortgroupPolicy

    $spec.Policy.PortConfigResetAtDisconnect = $True

    $pg.ReconfigureDVPortgroup_Task($spec)

    }'
  checks:
  - type: manual_review
    info: 'If distributed switches are not used, this is not applicable.

      From the vSphere Client, go to "Networking".

      Select a distributed switch >> Select a distributed port group >> Configure >> Settings

      >> Properties.

      Review the "Configure reset at disconnect" setting.

      or

      From a PowerCLI command prompt while connected to the vCenter server, run the

      following command:

      (Get-VDPortgroup).ExtensionData.Config.Policy.PortConfigResetAtDisconnect

      If there are any distributed port groups with "Configure reset a'
    severity: medium
- id: '1.65'
  title: VCSA-80-000303
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must disable Secure Shell (SSH) access. GROUP ID: V-258968 RULE ID: SV-258968r961863'
  rationale: vCenter Server is delivered as an appliance, and intended to be managed through the VAMI, vSphere Client, and
    APIs. SSH is a troubleshooting and support tool and should only be enabled when necessary. vCenter Server High Availability
    uses SSH to coordinate the replication and failover between the nodes. Use of this feature requires SSH to remain enabled.
  impact: ''
  references: []
  page_start: 133
  audit_raw: 'Open the Virtual Appliance Management Interface (VAMI) by navigating to

    https://<vCenter server>:5480.

    Log in with local operating system administrative credentials or with a Single Sign-On

    (SSO) account that is a member of the "SystemConfiguration.BashShellAdministrator"

    group.

    Select "Access" on the left navigation pane.

    If "SSH Login" is not "Deactivated", this is a finding.'
  remediation: 'Open the Virtual Appliance Management Interface (VAMI) by navigating to

    https://<vCenter server>:5480.

    Log in with local operating system administrative credentials or with a Single Sign-On

    (SSO) account that is a member of the "SystemConfiguration.BashShellAdministrator"

    group.

    Select "Access" on the left navigation pane.

    Click "Edit" then disable "Activate SSH Login" and click "OK".'
