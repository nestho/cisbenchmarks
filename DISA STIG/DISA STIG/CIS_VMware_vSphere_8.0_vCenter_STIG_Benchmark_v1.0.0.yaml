      will be in the group and

      should n'
    severity: medium
- id: '1.54'
  title: VCSA-80-000291
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must limit membership to the "TrustedAdmins" Single Sign-On (SSO) group. GROUP ID: V-258957
    RULE ID: SV-258957r961863'
  rationale: The vSphere "TrustedAdmins" group grants additional rights to administer the vSphere Trust Authority feature.
    To force accountability and nonrepudiation, the SSO group "TrustedAdmins" must be severely restricted.
  impact: ''
  references: []
  page_start: 116
  audit_raw: 'From the vSphere Client, go to Administration >> Single Sign On >> Users and Groups

    >> Groups.

    Click the next page arrow until the "TrustedAdmins" group appears.

    Click "TrustedAdmins".

    Review the members of the group and ensure that only authorized accounts are

    present.

    Note: These accounts act as root on the Photon operating system and have the ability

    to severely damage vCenter, inadvertently or otherwise.

    If there are any accounts present as members of TrustedAdmins that are not

    authorized, this is a finding.'
  remediation: 'From the vSphere Client, go to Administration >> Single Sign On >> Users and Groups

    >> Groups.

    Click the next page arrow until the "TrustedAdmins" group appears.

    Click "TrustedAdmins".

    Click the three vertical dots next to the name of each unauthorized account.

