    and "Value" fields and clicking "Add".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following command:

    If the setting already exists:

    Get-AdvancedSetting -Entity -Name VirtualCenter.VimPasswordExpirationInDays | SetAdvancedSetting -Value 30

    If the setting does not exist:

