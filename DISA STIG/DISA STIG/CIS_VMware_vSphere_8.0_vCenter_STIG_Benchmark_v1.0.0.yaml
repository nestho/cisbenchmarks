  title: VCSA-80-000150
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter server must provide an immediate real-time alert to the system administrator (SA) and information
    system security officer (ISSO), at a minimum, of all audit failure events requiring real-time alerts. GROUP ID: V-258926
    RULE ID: SV-258926r961401'
  rationale: 'It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit
    logs as required. Without a real-time alert, security personnel may be unaware of an impending failure of the audit capability
    and system operation may be adversely affected. Alerts provide organizations with urgent messages. Real-time alerts provide
    these messages immediately (i.e., the time from event detection to alert occurs in seconds or less). Satisfies: SRG-APP-000360,
    SRG-APP-000379, SRG-APP-000510'
  impact: ''
