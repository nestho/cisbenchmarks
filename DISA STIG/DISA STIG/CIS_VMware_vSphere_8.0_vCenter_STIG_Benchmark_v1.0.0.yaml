controls:
- id: '1.1'
  title: VCSA-80-000009
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must use DOD-approved encryption to protect the confidentiality of network sessions. GROUP
    ID: V-265978 RULE ID: SV-265978r1003613'
  rationale: Using older unauthorized versions or incorrectly configuring protocol negotiation makes the gateway vulnerable
    to known and unknown attacks that exploit vulnerabilities in this protocol. In vCenter 8 Update 3, Transport Layer Security
    (TLS) Profiles were introduced that allow users to manage and configure TLS parameters for the vCenter server. Several
    TLS profiles are available by default but not all may be suitable for high security environments.
  impact: ''
  references: []
  page_start: 12
  audit_raw: 'From the vSphere Client, go to Developer Center >> API Explorer.

    Select "appliance" from the "Select API" drop down list then scroll down to the

    "tls/profiles/global" section.

    Expand the GET call and click Execute and review the response for the configured

    global TLS profile.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following command:

    Invoke-GetTlsProfilesGlobal

    If the global TLS profile is not "NIST_2024", this is a finding.'
  remediation: 'From the vSphere Client, go to Developer Center >> API Explorer.

    Select "appliance" from the "Select API" drop down list then scroll down to the

    "tls/profiles/global" section.

    Expand the PUT call and enter the following in the value box:

    {

    "profile": "NIST_2024"

    }

    Click Execute and Continue to configure a new global TLS profile.

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following command:

    Invoke-SetProfilesGlobalAsync -TlsProfilesGlobalSetSpec (InitializeTlsProfilesGlobalSetSpec -VarProfile NIST_2024)

    To monitor the status of the operation the task id from the command output can be used

    with the "Invoke-GetTask" command. For example:

    Invoke-GetTask -Task 66b247c2-fe02-4425-93381c88eb856138:com.vmware.appliance.tls.profiles.global'
  checks:
  - type: sql
    command: Select "appliance" from the "Select API" drop down list then scroll down to the
    severity: medium
    info: 'From the vSphere Client, go to Developer Center >> API Explorer.

      Select "appliance" from the "Select API" drop down list then scroll down to the

      "tls/profiles/global" section.

      Expand the GET call and click Execute and review the response for the configured

      global TLS profile.

      or

      From a PowerCLI command prompt while connected to the vCenter server, run the

      following command:

      Invoke-GetTlsProfilesGl'
- id: '1.2'
  title: VCSA-80-000023
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must enforce the limit of three consecutive invalid login attempts by a user. GROUP ID:
    V-258905 RULE ID: SV-258905r960840'
  rationale: By limiting the number of failed login attempts, the risk of unauthorized system access via user password guessing,
    otherwise known as brute forcing, is reduced. Limits are imposed by locking the account.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >>

    Local Accounts >> Lockout Policy.

    The following lockout policy should be set as follows:

    Maximum number of failed login attempts: 3

    If this account lockout policy is not configured as stated, this is a finding.'
  remediation: 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >>

    Local Accounts >> Lockout Policy.

    Click "Edit".

    Set the "Maximum number of failed login attempts" to "3" and click "Save".'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >>

      Local Accounts >> Lockout Policy.

      The following lockout policy should be set as follows:

      Maximum number of failed login attempts: 3

      If this account lockout policy is not configured as stated, this is a finding.'
    severity: medium
- id: '1.3'
  title: VCSA-80-000024
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must display the Standard Mandatory DOD Notice and Consent Banner before logon. GROUP ID:
    V-258906 RULE ID: SV-258906r960843'
  rationale: 'Display of the DOD-approved use notification before granting access to the application ensures privacy and security
    notification verbiage used is consistent with applicable federal laws, Executive Orders, directives, policies, regulations,
    standards, and guidance. System use notifications are required only for access via login interfaces with human users and
    are not required when such human interfaces do not exist. The banner must be formatted in accordance with DTM-08-060.
    Use the following verbiage for applications that can accommodate banners of 1300 characters: "You are accessing a U.S.
    Government (USG) Information System (IS) that is provided for USG-authorized use only. By using this IS (which includes
    any device attached to this IS), you consent to the following conditions: -The USG routinely intercepts and monitors communications
    on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and
    defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations. -At any time, the
    USG may inspect and seize data stored on this IS. -Communications using, or data stored on, this IS are not private, are
    subject to routine monitoring, interception, and search, and may be disclosed or used for any USGauthorized purpose. -This
    IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal
    benefit or privacy. -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative
    searching or monitoring of the content of privileged communications, or work product, related to personal representation
    or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are
    private and confidential. See User Agreement for details." Use the following verbiage for operating systems that have
    severe limitations on the number of characters that can be displayed in the banner: "I''ve read (literal ampersand) consent
    to terms in IS user agreem''t." Satisfies: SRG-APP-000068, SRG-APP-000069, SRG-APP-000070'
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >>

    Login Message.

    If the selection box next to "Show login message" is disabled, "Details of login message"

    is not configured to the standard DOD User Agreement, or the "Consent checkbox" is

    disabled, this is a finding.

    Note: Refer to vulnerability discussion for user agreement language.'
  remediation: 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >>

    Login Message.

    Click "Edit".

    Click the "Show login message" slider to enable.

    Configure the "Login message" to "DOD User Agreement".

    Click the "Consent checkbox" slider to enable.

    Set the "Details of login message" to the Standard Mandatory DOD Notice and Consent

    Banner text.

    Click "Save".'
  checks:
  - type: sql
    command: Show login message" is disabled, "Details of login message"
    severity: medium
    info: 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >>

      Login Message.

      If the selection box next to "Show login message" is disabled, "Details of login message"

      is not configured to the standard DOD User Agreement, or the "Consent checkbox" is

      disabled, this is a finding.

      Note: Refer to vulnerability discussion for user agreement language.'
- id: '1.4'
  title: VCSA-80-000034
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must produce audit records containing information to establish what type of events occurred.
    GROUP ID: V-258907 RULE ID: SV-258907r960891'
  rationale: Without establishing what types of events occurred, it would be difficult to establish, correlate, and investigate
    the events leading up to an outage or attack.
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'From the vSphere Client, go to Host and Clusters.

    Select a vCenter Server >> Configure >> Settings >> Advanced Settings.

    Verify the "config.log.level" value is set to "info".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following command:

    Get-AdvancedSetting -Entity -Name config.log.level and verify it is set to "info".

    If the "config.log.level" value is not set to "info" or does not exist, this is a finding.'
  remediation: 'From the vSphere Client, go to Host and Clusters.

    Select a vCenter Server >> Configure >> Settings >> Advanced Settings.

    Click "Edit Settings" and configure the "config.log.level" setting to "info".

    or

    From a PowerCLI command prompt while connected to the vCenter server, run the

    following command:

    Get-AdvancedSetting -Entity -Name config.log.level | Set-AdvancedSetting -Value info'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, go to Host and Clusters.

      Select a vCenter Server >> Configure >> Settings >> Advanced Settings.

      Verify the "config.log.level" value is set to "info".

      or

      From a PowerCLI command prompt while connected to the vCenter server, run the

      following command:

      Get-AdvancedSetting -Entity -Name config.log.level and verify it is set to "info".

      If the "config.log.level" value is not set to "info" or does not exist, this is a finding.'
    severity: medium
- id: '1.5'
  title: VCSA-80-000057
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'vCenter Server plugins must be verified. GROUP ID: V-258908 RULE ID: SV-258908r960963'
  rationale: The vCenter Server includes a vSphere Client extensibility framework, which provides the ability to extend the
    vSphere Client with menu selections or toolbar icons that provide access to vCenter Server add-on components or external,
    web-based functionality. vSphere Client plugins or extensions run at the same privilege level as the user. Malicious extensions
    might masquerade as useful add-ons while compromising the system by stealing credentials or incorrectly configuring the
    system. Additionally, vCenter comes with a number of plugins preinstalled that may or may not be necessary for proper
    operation.
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'From the vSphere Client, go to Administration >> Solutions >> Client Plug-Ins.

    View the Installed/Available Plug-ins list and verify they are all identified as authorized

    VMware, third-party (partner), and/or site-specific approved plug-ins.

    If any installed/available plug-ins in the viewable list cannot be verified as allowed

    vSphere Client plug-ins from trusted sources or are not in active use, this is a finding.'
  remediation: 'From the vSphere Client, go to Administration >> Solutions >> Client Plug-Ins, click the

    radio button next to the unknown plug-in, and click "Disable".

    If the plugin will not be needed in the future, proceed to uninstall the plug-in.

    To uninstall plug-ins, do the following:

    If vCenter Server is in linked mode, perform this procedure on the vCenter Server that is

    used to install the plug-in initially and then restart the vCenter Server services on the

    linked vCenter Server:

    In a web browser, navigate to "http://vCenter_Server_name_or_IP/mob", where

    "vCenter_Server_name_or_IP/mob" is the name of the vCenter Server or its IP address.

    Click "Content".

    Click "ExtensionManager".

    Select and copy the name of the plug-in to be removed from the list of values under

    "Properties".

    Click "UnregisterExtension". A new window appears.

    Paste the name of the plug-in and click "Invoke Method". This removes the plug-in.

    Close the window.

    Refresh the Managed Object Type:ManagedObjectReference:ExtensionManager

    window to verify the plug-in is removed successfully.

    Note: If the plug-in still appears, restart the vSphere Client.

    Note: The Managed Object Browser (MOB) may have to be enabled temporarily if it was

    disabled previously.'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, go to Administration >> Solutions >> Client Plug-Ins.

      View the Installed/Available Plug-ins list and verify they are all identified as authorized

      VMware, third-party (partner), and/or site-specific approved plug-ins.

      If any installed/available plug-ins in the viewable list cannot be verified as allowed

      vSphere Client plug-ins from trusted sources or are not in active use, this is a finding.'
    severity: medium
- id: '1.6'
  title: VCSA-80-000059
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must uniquely identify and authenticate users or processes acting on behalf of users. GROUP
    ID: V-258909 RULE ID: SV-258909r1051115'
  rationale: 'To ensure accountability and prevent unauthenticated access, organizational users must be identified and authenticated
    to prevent potential misuse and compromise of the system. Organizational users include organizational employees or individuals
    the organization deems to have equivalent status of employees (e.g., contractors). Organizational users (and any processes
    acting on behalf of users) must be uniquely identified and authenticated for all accesses except the following. (i) Accesses
    explicitly identified and documented by the organization. Organizations document specific user actions that can be performed
    on the information system without identification or authentication; and (ii) Accesses that occur through authorized use
    of group authenticators without individual authentication. Organizations may require unique identification of individuals
    in group accounts (e.g., shared privilege accounts) or for detailed accountability of individual activity. Using Active
    Directory or an identity provider for authentication provides more robust account management capabilities and accountability.
    Satisfies: SRG-APP-000148, SRG-APP-000153, SRG-APP-000163, SRG-APP-000180, SRG-APP-000234'
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'From the vSphere Web Client, go to Administration >> Single Sign On >> Configuration

    >> Identity Provider.

    If the identity provider type is "embedded" and there is no identity source of type "Active

    Directory" (either Windows Integrated Authentication or LDAP), this is a finding.

    If the identity provider type is "Microsoft ADFS" or another supported identity provider,

    this is NOT a finding.'
  remediation: 'When using the embedded identity provider type, perform the following:

    From the vSphere Web Client, go to Administration >> Single Sign On >> Configuration

    >> Identity Provider >> Identity Sources.

    Click "Add".

    Select either "Active Directory over LDAP" or "Active Directory (Windows Integrated

    Authentication)" and configure appropriately.

    Note: Windows Integrated Authentication requires that the vCenter server be joined to

    Active Directory before configuration via Administration >> Single Sign On >>

    Configuration >> Identity Provider >> Active Directory Domain.

    OR

    To change the identity provider type to a third-party identity provider such as Microsoft

    ADFS, perform the following:

    From the vSphere Web Client, go to Administration >> Single Sign On >> Configuration

    >> Identity Provider.

    Click "Change Identity Provider".

    Select "Microsoft ADFS" and click "Next".

    Enter the ADFS server information and User and Group details and click "Finish".

    For additional information on configuring ADFS for use with vCenter, refer to the

    vSphere documentation.'
  checks:
  - type: manual_review
    info: 'From the vSphere Web Client, go to Administration >> Single Sign On >> Configuration

      >> Identity Provider.

      If the identity provider type is "embedded" and there is no identity source of type "Active

      Directory" (either Windows Integrated Authentication or LDAP), this is a finding.

      If the identity provider type is "Microsoft ADFS" or another supported identity provider,

      this is NOT a finding.'
    severity: medium
- id: '1.7'
  title: VCSA-80-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must require multifactor authentication. GROUP ID: V-258910 RULE ID: SV-258910r960864'
  rationale: 'Without the use of multifactor authentication, the ease of access to privileged functions is greatly increased.
    Multifactor authentication requires using two or more factors to achieve authentication. Factors include: (i) something
    a user knows (e.g., password/PIN); (ii) something a user has (e.g., cryptographic identification device, token); or (iii)
    something a user is (e.g., biometric). Satisfies: SRG-APP-000080, SRG-APP-000149, SRG-APP-000150, SRG-APP-000391, SRG-APP-000402'
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'From the vSphere Web Client, go to Administration >> Single Sign On >> Configuration

    >> Identity Provider.

    If the embedded identity provider is used, click on "Smart Card Authentication".

    If the embedded identity provider is used and "Smart Card Authentication" is not

    enabled, this is a finding.

    If a third-party identity provider is used, such as Microsoft ADFS, and it does not require

    multifactor authentication to log on to vCenter, this is a finding.'
  remediation: 'To configure smart card authentication for vCenter when using the embedded identity

    provider, refer to the vSphere documentation.

    For vCenter Servers using a third-party identity provider, consult the product''s

    documentation for enabling multifactor authentication.'
  checks:
  - type: manual_review
    info: 'From the vSphere Web Client, go to Administration >> Single Sign On >> Configuration

      >> Identity Provider.

      If the embedded identity provider is used, click on "Smart Card Authentication".

      If the embedded identity provider is used and "Smart Card Authentication" is not

      enabled, this is a finding.

      If a third-party identity provider is used, such as Microsoft ADFS, and it does not require

      multifactor authentication to log on to vCenter, this is a finding.'
    severity: medium
- id: '1.8'
  title: VCSA-80-000069
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server passwords must be at least 15 characters in length. GROUP ID: V-258911 RULE ID: SV-258911r1015925'
  rationale: The shorter the password, the lower the number of possible combinations that need to be tested before the password
    is compromised. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts
    at guessing and brute-force attacks. Password length is one factor of several that helps to determine strength and how
    long it takes to crack a password. The shorter the password, the lower the number of possible combinations that need to
    be tested before the password is compromised. Use of more characters in a password helps to exponentially increase the
    time and/or resources required to compromise the password.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >>

    Local Accounts >> Password Policy.

    View the value of the "Minimum Length" setting.

    Minimum Length: 15

    If the password policy is not configured with a "Minimum Length" policy of "15" or more,

    this is a finding.'
  remediation: 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >>

    Local Accounts >> Password Policy.

    Click "Edit".

    Set the "Minimum Length" to "15" and click "Save".'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >>

      Local Accounts >> Password Policy.

      View the value of the "Minimum Length" setting.

      Minimum Length: 15

      If the password policy is not configured with a "Minimum Length" policy of "15" or more,

      this is a finding.'
    severity: medium
- id: '1.9'
  title: VCSA-80-000070
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Server must prohibit password reuse for a minimum of five generations. GROUP ID: V-258912 RULE
    ID: SV-258912r1015267'
  rationale: Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. To meet password policy requirements, passwords must be changed at specific policybased intervals.
    If the information system or application allows the user to consecutively reuse their password when that password has
    exceeded its defined lifetime, the result is a password that is not changed per policy requirements.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >>

    Local Accounts >> Password Policy.

    View the value of the "Restrict reuse" setting.

    Restrict reuse: Users cannot reuse any previous 5 passwords

    If the password policy is not configured with a "Restrict reuse" policy of "5" or more, this

    is a finding.'
  remediation: 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >>

    Local Accounts >> Password Policy.

    Click "Edit".

    Set the "Restrict reuse" to "5" and click "Save".'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, go to Administration >> Single Sign On >> Configuration >>

      Local Accounts >> Password Policy.

      View the value of the "Restrict reuse" setting.

      Restrict reuse: Users cannot reuse any previous 5 passwords

      If the password policy is not configured with a "Restrict reuse" policy of "5" or more, this

      is a finding.'
    severity: medium
