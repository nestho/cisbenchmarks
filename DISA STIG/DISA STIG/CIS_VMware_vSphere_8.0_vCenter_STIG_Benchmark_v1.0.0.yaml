  description: 'The vCenter Server must manage excess capacity, bandwidth, or other redundancy to limit the effects of information
    flooding types of denial-of-service (DoS) attacks by enabling Network I/O Control (NIOC). GROUP ID: V-258922 RULE ID:
    SV-258922r961155'
  rationale: DoS is a condition when a resource is not available for legitimate users. When this occurs, the organization
    either cannot accomplish its mission or must operate at degraded capacity. Managing excess capacity ensures sufficient
    capacity is available to counter flooding attacks. Employing increased capacity and service redundancy may reduce the
    susceptibility to some DoS attacks. Managing excess capacity may include, for example, establishing selected usage priorities,
    quotas, or partitioning.
