  description: 'The vCenter Server must enable FIPS-validated cryptography. GROUP ID: V-258917 RULE ID: SV-258917r961029'
  rationale: 'FIPS 140-2 is the current standard for validating that mechanisms used to access cryptographic modules use authentication
    that meets DOD requirements. In vSphere 6.7 and later, ESXi and vCenter Server use FIPS-validated cryptography to protect
    management interfaces and the VMware Certificate Authority (VMCA). vSphere 7.0 Update 2 and later adds additional FIPS-validated
    cryptography to vCenter Server Appliance. By default, this FIPS validation option is disabled and must be enabled. Satisfies:
    SRG-APP-000172, SRG-APP-000179, SRG-APP-000224, SRG-APP-000231, SRG-APP-000412, SRG-APP-000514, SRG-APP-000555, SRG-APP-000600,
    SRGAPP-000610, SRG-APP-000620, SRG-APP-000630, SRG-APP-000635'
  impact: ''
  references: []
  page_start: 38
  audit_raw: 'From the vSphere Web Client, go to Developer Center >> API Explorer.

