- id: '1.15'
  title: KNOX-15-006700
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Samsung Android must be configured to display the DOD advisory warning message at startup or each time the
    user unlocks the device. GROUP ID: V-268942 RULE ID: SV-268942r1035922'
  rationale: 'Before granting access to the system, the mobile operating system is required to display the DOD-approved system
    use notification message or banner that provides privacy and security notices consistent with applicable federal laws,
    Executive Orders, directives, policies, regulations, standards, and guidance. Required banners help ensure that DOD can
    audit and monitor the activities of mobile device users without legal restriction. System use notification messages can
    be displayed when individuals first access or unlock the mobile device. The banner must be implemented as a "click-through"
    banner at device unlock (to the extent permitted by the operating system). A "click-through" banner prevents further activity
    on the information system unless and until the user executes a positive action to manifest agreement by clicking on a
    box indicating "OK." The approved DOD text must be used exactly as required in the Knowledge Service referenced in DODI
    8500.01. For devices accommodating banners of 1300 characters, the banner text is: You are accessing a U.S. Government
    (USG) Information System (IS) that is provided for USG-authorized use only. By using this IS (which includes any device
    attached to this IS), you consent to the following conditions: -The USG routinely intercepts and monitors communications
    on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and
    defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations. -At any time, the
    USG may inspect and seize data stored on this IS. -Communications using, or data stored on, this IS are not private, are
    subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.
    -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your
    personal benefit or privacy. -Notwithstanding the above, using this IS does not constitute consent to PM, LE, or CI investigative
    searching or monitoring of the content of privileged communications, or work product, related to personal representation
    or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are
    private and confidential. Refer to User Agreement for details. For devices with severe character limitations, the banner
    text is: I''ve read & consent to terms in IS user agreem''t. The Administrator must configure the banner text exactly
    as written without any changes. SFRID: FMT_SMF.1.1 #36'
  impact: ''
  references: []
  page_start: 38
