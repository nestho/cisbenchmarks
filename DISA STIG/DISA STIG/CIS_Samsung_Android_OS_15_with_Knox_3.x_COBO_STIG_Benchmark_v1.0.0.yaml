    1. Open "Nearby notification streaming policy".

    2. Verify "Nearby notification streaming policy" is set to "Disabled".

    3. Open "Nearby app streaming policy".

    4. Verify "Nearby app streaming policy" is set to "Disabled".

    If on the management tool the "Nearby Streaming Policy" is not set to "Disabled", this is

    a finding.

    Note: From a Chromebook, if a device is connected to the Phone Hub, try to set up the

    Notifications. It will fail to connect to the device to complete the setup if Phone Hub has

    been disabled on the DOD Android device.'
