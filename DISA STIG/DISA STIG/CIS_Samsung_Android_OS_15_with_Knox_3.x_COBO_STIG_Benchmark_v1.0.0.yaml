      Verify that the KPE API "isIntelligenceOnlineProcessingAllowed()" returns false or that

      the KSP configuration has the restriction "Allow'
    severity: medium
- id: '1.11'
  title: KNOX-15-005800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android must be configured to not display the following (Work Environment) notifications when the
    device is locked: All notifications. GROUP ID: V-268933 RULE ID: SV-268933r1035895'
  rationale: 'Many mobile devices display notifications on the lock screen so that users can obtain relevant information in
    a timely manner without having to frequently unlock the phone to determine if there are new notifications. However, in
    many cases, these notifications can contain sensitive information. When they are available on the lock screen, an adversary
    can see them merely by being in close physical proximity to the device. Configuring the MOS to not send notifications
    to the lock screen mitigates this risk. SFRID: FMT_SMF.1.1 #18'
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'Review the configuration to determine if the Samsung Android devices are not

    displaying (Work Environment) notifications when the device is locked.

    Notifications of incoming phone calls are acceptable even when the device is locked.

    This validation procedure is performed on both the management tool Administration

    Console and the Samsung Android device.

    On the management tool, in the Work profile restrictions section, verify "Unredacted

    Notifications" is set to "Disallow".

    COPE:

    On the Samsung Android device:

    1. Open Settings >> Notifications >> Lock screen (Edit).

    2. Verify "Sensitive work profile notifications" is disabled.

    If on the management tool "Unredacted Notifications" is not set to "Disallow", or on the

    Samsung Android device "Sensitive work profile notifications" is not disabled, this is a

    finding.

    COBO:

    On the Samsung Android device:

    1. Open Settings >> Notifications >> Lock screen (Edit).

    2. Verify "Lock screen notifications" menu is disabled.

    If on the management tool "Unredacted Notifications" is not set to "Disallow", or on the

    Samsung Android device "Notifications" menu is not disabled, this is a finding.'
  remediation: 'Configure the Samsung Android devices to not display (Work Environment) notifications

    when the device is locked.

    On the management tool, in the Work profile restrictions section, set "Unredacted

    Notifications" to "Disallow".'
  checks:
  - type: manual_review
    info: 'Review the configuration to determine if the Samsung Android devices are not

      displaying (Work Environment) notifications when the device is locked.

      Notifications of incoming phone calls are acceptable even when the device is locked.

