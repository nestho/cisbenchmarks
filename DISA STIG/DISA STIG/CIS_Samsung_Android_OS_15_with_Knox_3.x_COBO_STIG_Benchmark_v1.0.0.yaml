  audit_raw: 'Review the configuration to determine if the Samsung Android devices are disabling

    Trust Agents.

    This validation procedure is performed on both the management tool and the Samsung

    Android device.

    On the management tool, in the device restrictions, verify "Trust Agents" are set to

    Disable.

    On the Samsung Android device:

    1. Open Settings >> Security and privacy >> More security settings >> Trust

    agents.

    2. Verify all listed Trust Agents are disabled and cannot be enabled. If a Trust Agent

    is not disabled in the list, verify for that Trust Agent, all of its listed Trustlets are

    disabled and cannot be enabled.

    If on the management tool "Trust Agents" are not set to Disable, or on the Samsung

    Android device a "Trust Agent" or Trustlet can be enabled, this is a finding.

    Note: If the management tool has been correctly configured but a Trust Agent is still

    enabled, configure the "List of approved apps listed in managed Google Play" to disable

    it; refer to KNOX-15-005500.

    Exception: Trust Agents may be used if the authorizing official (AO) allows a screen

    lock timeout after four hours (or more) of inactivity. This may be applicable to tactical

    use case.'
  remediation: 'Configure the Samsung Android devices to disable Trust Agents.

    On the management tool, in the device restrictions, set "Trust Agents" to Disable.'
  checks:
  - type: manual_review
    info: 'Review the configuration to determine if the Samsung Android devices are disabling

