    GROUP ID: V-268971 RULE ID: SV-268971r1036009'
  rationale: 'The system application disable list controls user access to/execution of all core and preinstalled applications.
    Core application: Any application integrated into Samsung Android 15 by Samsung. Preinstalled application: Additional
    noncore applications included in the Samsung Android 15 build by Samsung or the wireless carrier. Some system applications
    can compromise DOD data or upload users'' information to non-DOD-approved servers. A user must be blocked from using such
    applications that exhibit behavior that can result in compromise of DOD data or DOD user information. The site administrator
    must analyze all preinstalled applications on the device and disable all applications not approved for DOD use by configuring
    the system application disable list. SFRID: FMT_SMF.1.1 #47'
  impact: ''
  references: []
