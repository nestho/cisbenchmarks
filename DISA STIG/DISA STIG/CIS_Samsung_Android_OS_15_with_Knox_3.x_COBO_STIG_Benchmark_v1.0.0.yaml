- id: '1.7'
  title: KNOX-15-005400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android must be configured to enforce an application installation policy by specifying one or more
    authorized application repositories, including DOD-approved commercial app repository, management tool server, or mobile
    application store. GROUP ID: V-268929 RULE ID: SV-268929r1035883'
  rationale: 'Forcing all applications to be installed from authorized application repositories can prevent unauthorized and
    malicious applications from being installed and executed on mobile devices. Allowing such installations and executions
    could cause a compromise of DOD data accessible by these unauthorized/malicious applications. SFRID: FMT_SMF.1.1 #8'
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'Review the configuration to determine if the Samsung Android devices are disabling

    unauthorized application repositories.

    This validation procedure is performed on both the management tool and the Samsung

    Android device.

    On the management tool, in the Work profile restrictions, verify "installs from unknown

    sources globally" is set to Disallow.

    On the Samsung Android device:

    1. Open Settings >> Security and privacy >> More privacy settings >> Install

    unknown apps.

    2. In the "Personal" tab, verify that each app listed has the status "Disabled" under

    the app name or no apps are listed.

    3. In the "Work" tab, verify that each app listed has the status "Disabled" under the

    app name or no apps are listed.

    If on the management tool "installs from unknown sources globally" is not set to

    Disallow, or on the Samsung Android device an app is listed with a status other than

    "Disabled", this is a finding.'
  remediation: 'Configure the Samsung Android devices to disable unauthorized application

    repositories.

    COPE:

    On the management tool, in the Work profile restrictions, set "installs from unknown

    sources globally" to Disallow.

    COBO:

    On the management tool, in the device restrictions, set "installs from unknown sources

    globally" to Disallow.

    Note: Google Play must not be disabled. Disabling Google Play will cause system

    instability and critical updates will not be received.'
  checks:
  - type: manual_review
    info: 'Review the configuration to determine if the Samsung Android devices are disabling

