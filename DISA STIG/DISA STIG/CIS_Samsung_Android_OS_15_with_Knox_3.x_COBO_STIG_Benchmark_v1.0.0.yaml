  description: 'Samsung Android must be configured to enable authentication of personal hotspot connections to the device
    using a pre-shared key. GROUP ID: V-268952 RULE ID: SV-268952r1036367'
  rationale: 'If no authentication is required to establish personal hotspot connections (Wi-Fi and Bluetooth), an adversary
    may be able to use that device to perform attacks on other devices or networks without detection. A sophisticated adversary
    may also be able to exploit unknown system vulnerabilities to access information and computing resources on the device.
    Requiring authentication to establish personal hotspot connections mitigates this risk. Application note: If hotspot functionality
    is permitted, it must be authenticated via a preshared key. There is no requirement to enable hotspot functionality, and
    it is recommended this functionality be disabled by default. SFRID: FMT_SMF.1.1 #41'
  impact: ''
  references: []
