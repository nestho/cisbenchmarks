controls:
- id: '1.1'
  title: KNOX-15-000700
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Samsung Android must not accept the certificate when it cannot establish a connection to determine the validity
    of a certificate. GROUP ID: V-268882 RULE ID: SV-268882r1035742'
  rationale: 'Certificate-based security controls depend on the ability of the system to verify the validity of a certificate.
    If the MOS were to accept an invalid certificate, it could take unauthorized actions, resulting in unanticipated outcomes.
    At the same time, if the MOS were to disable functionality when it could not determine the validity of the certificate,
    this could result in a denial of service. Therefore, the ability to provide exceptions is appropriate to balance the tradeoff
    between security and functionality. Always accepting certificates when they cannot be determined to be valid is the most
    extreme exception policy and is not appropriate in the DOD context. Involving an Administrator or user in the exception
    decision mitigates this risk to some degree. SFRID: FIA_X509_EXT.2.2'
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'Verify requirement KNOX-15-009300 (Common Criteria mode) has been implemented.

    If "Common Criteria mode" has not been implemented, this is a finding.'
  remediation: Implement "Common Criteria mode". Refer to requirement KNOX-15-009300.
  checks:
