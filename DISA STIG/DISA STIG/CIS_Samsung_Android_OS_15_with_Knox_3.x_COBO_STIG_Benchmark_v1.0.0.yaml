  audit_raw: 'Review the configuration to confirm the system application disable list is enforced. This

    setting is enforced by default. Verify only approved system apps have been placed on

    the core allowlist.

    This procedure is performed on the management tool.

    Review the system app allowlist and verify only approved apps are on the list.

    On the management tool, in the Apps management section, select "Unhide apps" and

    verify the names of the apps listed.

    If on the management tool the system app allowlist contains unapproved core apps, this

    is a finding.'
  remediation: 'Configure the Samsung Android 15 device to enforce the system application allow list.

    The required configuration is the default configuration when the device is enrolled. If the

    device configuration is changed, use the following procedure to bring the device back

    into compliance:

    On the management tool:

    1. Open "Apps management" section.

    2. Select "unhide apps".

    3. Enter names of apps to unhide (allow).

    Configure a list of approved Samsung core and preinstalled apps in the core app

    allowlist.'
