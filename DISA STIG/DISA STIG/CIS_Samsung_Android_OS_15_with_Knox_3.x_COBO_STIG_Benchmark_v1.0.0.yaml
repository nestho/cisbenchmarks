- id: '1.32'
  title: KNOX-15-009600
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Samsung Android device must be configured to enable Certificate Revocation List (CRL) status checking.
    GROUP ID: V-268969 RULE ID: SV-268969r1036003'
  rationale: 'A CRL allows a certificate issuer to revoke a certificate for any reason, including improperly issued certificates
    and compromise of the private keys. Checking the revocation status of the certificate mitigates the risk associated with
    using a compromised certificate. For this reason, users must not be able to disable this configuration. Samsung Android
    can control CRL checking but only using Knox APIs. Alternatively, CRL checking is based on app development best practice.
    SFRID: FMT_MOF_EXT.1.2 #47'
  impact: ''
  references: []
  page_start: 72
  audit_raw: 'Review the configuration to confirm that revocation checking is enabled. Verify the

    revocation checklist is set to "All Applications".

    This procedure is performed on the management tool.

    On the management tool:

    1. Open Certificates Policy >> Revocation section.

    2. Select "Get CRL".

    3. Verify Toast message "Get revocation check: true".

    If on the management tool the revocation check is disabled, this is a finding.'
  remediation: 'Configure the Samsung Android devices to enable CRL revocation checks for all

    applications. These revocation checks must be enabled using the Knox KPE APIs.

    On the management tool, in the Certificate Policy restrictions, enable "Revocation

    Checks" for "All Applications".'
  checks:
  - type: manual_review
    info: 'Review the configuration to confirm that revocation checking is enabled. Verify the

      revocation checklist is set to "All Applications".

      This procedure is performed on the management tool.

      On the management tool:

      1. Open Certificates Policy >> Revocation section.

      2. Select "Get CRL".

      3. Verify Toast message "Get revocation check: true".

      If on the management tool the revocation check is disabled, this is a finding.'
    severity: medium
- id: '1.33'
  title: KNOX-15-009700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Samsung Android device must be configured to enforce that Wi-Fi Sharing is disabled. GROUP ID: V-268970
    RULE ID: SV-268970r1036374'
  rationale: 'Wi-Fi Sharing is an optional configuration of Wi-Fi Tethering/Mobile Hotspot, which allows the device to share
    its Wi-Fi connection with other wirelessly connected devices instead of its mobile (cellular) connection. Wi-Fi Sharing
    grants the "other" device access to a corporate Wi-Fi network and may possibly bypass the network access control mechanisms.
    This risk can be partially mitigated by requiring the use of a preshared key for personal hotspots. SFRID: FMT_SMF.1.1
    #47'
  impact: ''
  references: []
  page_start: 74
  audit_raw: 'Review device configuration settings to confirm Wi-Fi Sharing is disabled.

    Mobile Hotspot must be enabled to enable Wi-Fi Sharing. If the authorizing official (AO)

    has not approved Mobile Hotspot, and it has been verified as disabled on the EMM

    console, no further action is needed.

    If Mobile Hotspot is being used, use the following procedure to verify Wi-Fi Sharing is

    disabled:

    On the EMM console:

    COBO:

    1. Open "Set user restrictions".

    2. Verify "Disallow sharing admin configured Wi-Fi" is toggled to "ON".

    COPE:

    1. Open "Set user restrictions on parent".

    2. Toggle "Disallow sharing admin configured Wi-Fi" to "ON".

    If on the EMM console, "Disallow sharing admin configured Wi-Fi" is not enabled, this is

    a finding.'
  remediation: 'Configure the Samsung Android 15 device to disable Wi-Fi Sharing.

    Mobile Hotspot must be enabled to enable Wi-Fi Sharing. If the AO has not approved

    Mobile Hotspot, and it has been disabled on the EMM console, no further action is

    needed.

    If Mobile Hotspot is being used, use the following procedure to disable Wi-Fi Sharing:

    On the EMM console:

    COBO:

    1. Open "Set user restrictions".

    2. Toggle "Disallow sharing admin configured Wi-Fi" to "ON".

    COPE:

    1. Open "Set user restrictions on parent".

    2. Toggle "Disallow sharing admin configured Wi-Fi" to "ON".'
  checks:
