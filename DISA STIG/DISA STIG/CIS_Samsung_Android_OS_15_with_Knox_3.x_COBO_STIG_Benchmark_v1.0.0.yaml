      users to install only applications that have been approved by the AO.

      This validation procedure is performed only on the management tool.

      On the management tool, in the app catalog for managed Google Play, verify '
    severity: medium
- id: '1.9'
  title: KNOX-15-005600
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android''s Work environment must be configured to not allow installation of applications with the
    following characteristics: • Backs up MD data to non-DOD cloud servers (including user and application access to cloud
    backup services); • Transmits MD diagnostic data to non-DOD servers; • Voice assistant application if available when MD
    is locked; • Voice dialing application if available when MD is locked; • Allows synchronization of data or applications
    between devices associated with user; • Payment processing; • Allows unencrypted (or encrypted but not FIPS 140-2/140-3
    validated) data sharing with other MDs or printers; and • Backs up its own data to a remote system. GROUP ID: V-268931
    RULE ID: SV-268931r1036390'
  rationale: 'Requiring all authorized applications to be in an application allowlist prevents the execution of any applications
    (e.g., unauthorized, malicious) that are not part of the allowlist. Failure to configure an application allowlist properly
    could allow unauthorized and malicious applications to be downloaded, installed, and executed on the mobile device, causing
    a compromise of DOD data accessible by these applications. Applications with the listed characteristics have features
    that can cause the compromise of sensitive DOD data or have features with no known application in the DOD environment.
    Application note: The application allowlist, in addition to controlling the installation of applications on the MD, must
    control user access/execution of all core and preinstalled applications, or the MD must provide an alternate method of
    restricting user access/execution to core and preinstalled applications. Core application: Any application integrated
    into the OS by the OS or MD vendors. Preinstalled application: Additional noncore applications included in the OS build
    by the OS vendor, MD vendor, or wireless carrier. SFRID: FMT_SMF.1.1 #8'
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'Verify requirement KNOX-15-005500 (managed Google Play) has been implemented.

    If managed Google Play has not been implemented, this is a finding.'
  remediation: 'The authorizing official (AO) must not approve applications with the following

    characteristics for installation by users in the Work profile:

    • Backs up MD data to non-DOD cloud servers (including user and application

    access to cloud backup services);

    • Transmits MD diagnostic data to non-DOD servers;

    • Voice assistant application if available when MD is locked;

    • Voice dialing application if available when MD is locked;

    • Allows synchronization of data or applications between devices associated with

    user;

    • Payment processing;

    • Allows unencrypted (or encrypted but not FIPS 140-2/140-3 validated) data

    sharing with other MDs or printers; and

    • Backs up its own data to a remote system.

    Implement managed Google Play (refer to requirement KNOX-15-005500).'
  checks:
  - type: manual_review
    info: 'Verify requirement KNOX-15-005500 (managed Google Play) has been implemented.

      If managed Google Play has not been implemented, this is a finding.'
    severity: medium
- id: '1.10'
  title: KNOX-15-005700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android 15 allowlist must be configured to not include artificial intelligence (AI) applications that
    process device data in the cloud, including Google Gemini. GROUP ID: V-268932 RULE ID: SV-268932r1036364'
  rationale: 'Sensitive DOD data could be exposed when an AI app processes device data in the cloud. SFRID: FMT_SMF.1.1 #8'
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'Review managed Samsung Android 15 device configuration settings to determine if the

    mobile device has an AI application that processes device data in the cloud, including

    Google Gemini.

    Verify requirement KNOX-15-009200 (disallow modify accounts) has been

    implemented.

    The following validation procedure is performed on the management tool Administration

    Console.

    Verify that the KPE API "isIntelligenceOnlineProcessingAllowed()" returns false or that

    the KSP configuration has the restriction "Allow process data only on device" set to

    true.

    If "disallow modify accounts" is not set to "enable" (KNOX-15-009200) and the KPE API

    "isIntelligenceOnlineProcessingAllowed()" returns true and the KSP configuration does

    not have the restriction "Allow process data only on device" set to true, this is a finding.'
  remediation: 'On the EMM console:

    1. Review the list of selected Managed Google Play apps.

    2. Verify no AI applications that process device data in the cloud, including Google

    Gemini, are included.

    Note: This restriction does not include Galaxy on device AI. Galaxy on device API is a

    "built-in" capability of Android 15 and processes device data on the device.

    Disallow modify accounts (refer to requirement KNOX-15-009200).

    Apply the "Disallow Intelligence Online Processing" using the KPE API or KSP. The

    KPE API is allowIntelligenceOnlineProcessing(false), and the KSP restriction is "Allow

    process data only on device", which should be set to true.'
  checks:
  - type: manual_review
    info: 'Review managed Samsung Android 15 device configuration settings to determine if the

