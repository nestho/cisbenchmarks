  description: 'The Samsung Android device must be configured to disable the use of third-party keyboards. GROUP ID: V-268972
    RULE ID: SV-268972r1036012'
  rationale: 'Many third-party keyboard applications are known to contain malware. SFRID: FMT_SMF.1.1 #47'
  impact: ''
  references: []
  page_start: 78
  audit_raw: 'Review the managed Samsung device configuration settings to confirm that no thirdparty keyboards are enabled.

    This procedure is performed on the management tool.

    On the management tool:

    1. Open "Input methods".

    2. Tap "Set input methods".

    3. Verify only the approved keyboards are selected.

    If third-party keyboards are allowed, this is a finding.'
  remediation: 'Configure the Samsung device to disallow the use of third-party keyboards.

    On the management tool:

    1. Open "Input methods".

    2. Tap "Set input methods".

    3. Select only the approved keyboard.

    Additionally, Administrators can configure application allowlists for Google Play that do

    not have any third-party keyboards for user installation.'
  checks:
  - type: manual_review
    info: 'Review the managed Samsung device configuration settings to confirm that no thirdparty keyboards are enabled.

      This procedure is performed on the management tool.

      On the management tool:

      1. Open "Input methods".

      2. Tap "Set input methods".

      3. Verify only the approved keyboards are selected.

      If third-party keyboards are allowed, this is a finding.'
