  title: KNOX-15-007400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android must be configured to not allow backup of all applications, configuration data to remote systems.
    (This requirement applies to the Work Profile for COPE.) • Disable Data Sync Framework. GROUP ID: V-268949 RULE ID: SV-268949r1035943'
  rationale: 'Backups to remote systems (including cloud backup) can leave data vulnerable to breach on the external systems,
    which often offer less protection than the MOS. Where the remote backup involves a cloud-based solution, the backup capability
    is often used to synchronize data across multiple devices. In this case, DOD devices may synchronize DOD sensitive information
    to a user''s personal device or other unauthorized computers that are vulnerable to breach. The Data Sync Framework allows
    apps to synchronize data between the mobile device and other web-based services. This uses accounts for services the user
    has added to the mobile device. Preventing the user from adding accounts to the device mitigates this risk. For COBO/COPE
    (work profile) data cannot be backed up remotely via Backup Services. Work (profile) data could be backed up through adding
    an account to an app that supports the data sync framework; however, this is mitigated by preventing adding any accounts
    to the Work profile. SFR ID: FMT_SMF_EXT.1.1 #40 SFRID: FMT_SMF.1.1 #40'
  impact: ''
  references: []
  page_start: 44
  audit_raw: 'Verify requirement KNOX-15-009200 (disallow modify accounts) has been

    implemented.

    If "disallow modify accounts" has not been implemented, this is a finding.'
