- id: '1.6'
  title: KNOX-15-005300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android must be configured to not allow more than 10 consecutive failed authentication attempts. GROUP
    ID: V-268928 RULE ID: SV-268928r1035880'
  rationale: 'The more attempts an adversary has to guess a password, the more likely the adversary will enter the correct
    password and gain access to resources on the device. Setting a limit on the number of attempts mitigates this risk. Setting
    the limit at 10 or fewer attempts gives authorized users the ability to make a few mistakes when entering the password
    but still provides adequate protection against dictionary or brute force attacks on the password. SFRID: FMT_SMF.1.1 #2,
    FIA_AFL_EXT.1.5'
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'Review the configuration to determine if the Samsung Android devices are allowing only

    10 or fewer consecutive failed authentication attempts.

    This validation procedure is performed on both the management tool and the Samsung

    Android device.

    On the management tool, in the device password policies, verify "max password failures

    for local wipe" is set to 10 attempts or less.

    On the Samsung Android device:

    1. Open Settings >> Lock screen.

    2. Verify "Secure lock settings" is present and tap it.

    3. Enter current password.

    4. Verify "Auto factory reset" is grayed out, and cannot be configured. Note: When

    "Auto factory reset" is grayed out, this indicates the Administrator (MDM) is in

    control of the setting to wipe the device after 10 or fewer consecutive failed

    authentication attempts.

    If on the management tool "max password failures for local wipe" is not set to 10

    attempts or less, or on the Samsung Android device the "Auto factory reset" menu can

    be configured, this is a finding.'
  remediation: 'Configure the Samsung Android devices to allow only 10 or fewer consecutive failed

    authentication attempts.

    On the management tool, in the device password policies, set "max password failures

    for local wipe" to 10 attempts or fewer.

    A device password must be set for "max password failures for local wipe" to become

    active.'
  checks:
  - type: manual_review
    info: 'Review the configuration to determine if the Samsung Android devices are allowing only

      10 or fewer consecutive failed authentication attempts.

      This validation procedure is performed on both the management tool and the Samsung

      Android device.

      On the management tool, in the device password policies, verify "max password failures

