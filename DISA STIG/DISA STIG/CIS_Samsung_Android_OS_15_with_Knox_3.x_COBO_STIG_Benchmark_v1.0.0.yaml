- id: '1.26'
  title: KNOX-15-009000
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android''s Work profile must have the DOD root and intermediate PKI certificates installed. GROUP
    ID: V-268963 RULE ID: SV-268963r1035985'
  rationale: 'DOD root and intermediate PKI certificates are used to verify the authenticity of PKI certificates of users
    and web services. If the root and intermediate certificates are not available, an adversary could falsely sign a certificate
    in such a way that it could not be detected. Providing access to the DOD root and intermediate PKI certificates greatly
    diminishes the risk of this attack. SFRID: FMT_MOF_EXT.1.2 #47'
  impact: ''
  references: []
  page_start: 60
  audit_raw: 'COPE:

    Review the configuration to determine if the Samsung Android''s Work profile has the

    DOD root and intermediate PKI certificates installed.

    This validation procedure is performed on both the management tool and the Samsung

    Android device.

    The current DOD root and intermediate PKI certificates may be obtained in selfextracting zip files at https://cyber.mil/pki-pke
    (for NIPRNet).

    On the management tool, in the Work profile policy management, verify the DOD root

    and intermediate PKI certificates are installed.

    On the Samsung Android device:

    1. Open Settings >> Security and privacy >> More security settings >> View

    security certificates.

    2. In the User tab, verify the DOD root and intermediate PKI certificates are listed in

    the Work profile.

    If on the management tool the DOD root and intermediate PKI certificates are not listed

    in the Work profile, or on the Samsung Android device the DOD root and intermediate

    PKI certificates are not listed in the Work profile, this is a finding.

    COBO:

    Review the configuration to determine if the Samsung Android devices have the DOD

    root and intermediate PKI certificates installed.

    This validation procedure is performed on both the management tool and the Samsung

    Android device.

    The current DOD root and intermediate PKI certificates may be obtained in selfextracting zip files at https://cyber.mil/pki-pke
    (for NIPRNet).

    On the management tool, in the device policy management, verify the DOD root and

    intermediate PKI certificates are installed.

    On the Samsung Android device:

    1. Open Settings >> Security and privacy >> More security settings >> View

    security certificates.

    2. In the User tab, verify the DOD root and intermediate PKI certificates are listed in

    the device.

    If on the management tool the DOD root and intermediate PKI certificates are not listed

    in the device, or on the Samsung Android device the DOD root and intermediate PKI

    certificates are not listed in the device, this is a finding.'
  remediation: 'Install the DOD root and intermediate PKI certificates into the Samsung Android devices

    (install in Work profile for COPE).

    The current DOD root and intermediate PKI certificates may be obtained in selfextracting zip files at https://cyber.mil/pki-pke
    (for NIPRNet).

    On the management tool, in the device policy management (Work profile for COPE),

    install the DOD root and intermediate PKI certificates.'
