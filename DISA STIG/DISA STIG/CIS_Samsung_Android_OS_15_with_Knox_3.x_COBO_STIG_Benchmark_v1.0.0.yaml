  title: KNOX-15-008900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android must be configured to disallow configuration of the device''s date and time. GROUP ID: V-268962
    RULE ID: SV-268962r1035982'
  rationale: 'Determining the correct time a particular application event occurred on a system is critical when conducting
    forensic analysis and investigating system events. Periodically synchronizing internal clocks with an authoritative time
    source is necessary to correctly correlate the timing of events that occur across the enterprise. The three authoritative
    time sources for Samsung Android are an authoritative time server that is synchronized with redundant United States Naval
    Observatory (USNO) time servers as designated for the appropriate DOD network (NIPRNet or SIPRNet), the Global Positioning
    System (GPS), or the wireless carrier. Time stamps generated by the audit system in Samsung Android must include both
    date and time. The time may be expressed in Coordinated Universal Time (UTC), a modern continuation of Greenwich Mean
    Time (GMT), or local time with an offset from UTC. SFRID: FMT_MOF_EXT.1.2 #47'
  impact: ''
  references: []
