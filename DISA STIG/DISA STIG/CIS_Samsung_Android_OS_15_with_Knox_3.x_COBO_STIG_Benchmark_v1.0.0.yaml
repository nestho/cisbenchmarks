- id: '1.29'
  title: KNOX-15-009300
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Samsung Android''s Work profile must be configured to enable Common Criteria (CC) mode. GROUP ID: V-268966
    RULE ID: SV-268966r1035994'
  rationale: 'The CC mode feature is a superset of other features and behavioral changes that are mandatory MDFPP requirements.
    If CC mode is not implemented, the device will not be operating in the NIAP-certified compliant CC mode of operation.
    When enforcing Android Enterprise (AE) CC mode on a Samsung Android device, additional Samsung-specific security features
    are also enabled. CC mode implements the following behavioral/functional changes to meet MDFPP requirements: • How the
    Bluetooth and Wi-Fi keys are stored using different types of encryption. • Download mode is disabled and all updates will
    occur via Firmware Over the Air (FOTA) only. In addition, CC mode adds new restrictions not to meet MDFPP requirements
    but to offer better security above what is required: • Force password info following FOTA update for consistency. • Disable
    Remote unlock by FindMyMobile. • Restrict biometric attempts to 10. SFRID: FMT_MOF_EXT.1.2 #47'
  impact: ''
  references: []
  page_start: 66
  audit_raw: 'Review the configuration to determine if the Samsung Android devices are enabling CC

    mode.

