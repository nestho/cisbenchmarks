  audit_raw: 'This is a "User-Based Enforcement (UBE)" control.

    Check a sample of Samsung phones at the site and verify the Wi-Fi hotspot preshared

    key (password) is set to "WPA2/WPA3-Personal" or "WPA3-Personal".

    1. Click Settings >> Connections >> Mobile Hotspot and Tethering >> Mobile

    Hotspot.

    2. Select Network name >> Password >> Band.

    3. Click on the "Security" link and verify either "WPA2/WPA3-Personal" or "WPA3Personal" have been selected.

    If the Wi-Fi hotspot security is not set to "WPA2/WPA3-Personal" or "WPA3-Personal",

    this is a finding.'
  remediation: 'This is a "User-Based Enforcement (UBE)" control.

    Train users to not change the default Wi-Fi hotspot security setting: 15-character

    complex Wi-Fi hotspot preshared key (password) ("WPA2/WPA3-Personal" or WPA3Personal"). (KNOX-15-009400).

