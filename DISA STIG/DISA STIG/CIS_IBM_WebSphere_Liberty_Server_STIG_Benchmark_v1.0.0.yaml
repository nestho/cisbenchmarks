controls:
- id: '1.1'
  title: IBMW-LS-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Maximum in-memory session count must be set according to application requirements. GROUP ID: V-250322 RULE
    ID: SV-250322r960735'
  rationale: 'Application management includes the ability to control the number of sessions that use an application by all
    accounts and/or account types. Limiting the number of allowed sessions is helpful in limiting risks related to Denial
    of Service attacks. Application servers host and expose business logic and application processes. The application server
    must possess the capability to limit the maximum number of concurrent sessions in a manner that affects the entire application
    server or on an individual application basis. Although there is some latitude concerning the settings themselves, the
    settings should follow DoD-recommended values, but the settings should be configurable to allow for future DoD direction.
    While the DoD will specify recommended values, the values can be adjusted to accommodate the operational requirement of
    a given system. The System Security Plan should be reviewed and the maximum number of concurrent sessions allowable and
    defined within that plan should be used in the httpSession element. For example, if the maximum number of concurrent sessions
    is defined in the System Security Plan as 5000, then the httpSession element in ${server.config.dir}/server.xml should
    be configured as: <httpSession maxInMemorySessionCount="5000" allowOverflow="false" /> For http session security settings
    to apply, the security feature (appSecurity-2.0) must be defined in order to configure a user registry for the servlet
    to authenticate against. The servlet feature (servlet-3.1) must be defined in order to use a web application, and the
    ldap feature (ldapRegistry-3.0) must be defined in order to configure an enterpriselevel user registry for authentication
    of the servlet users.'
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'Review the System Security plan to determine the maximum number of concurrent

    sessions allowed. This is a per user setting and must be defined by the application

    admins.

    As a privileged user with access to the server.xml file, review file content and identify

    the "maxInMemorySessionCount" and the allowOverflow settings.

    EXAMPLE:

    grep -i maxInMemorySessionCount server.xml

    If maxInMemorySessionCount is not set in server.xml according to the settings defined

    in the system security plan or if allowOverflow="true", this is a finding.'
  remediation: 'To limit the max number of concurrent sessions available, the

    ${server.config.dir}/server.xml must be configured with maxInMemorySessionCount set

    according to system security plan and allowOverflow="false".

    EXAMPLE:

    <httpSession maxInMemorySessionCount="5" allowOverflow="false" />'
  checks:
  - type: command
    command: grep -i maxInMemorySessionCount server.xml
    expected: ''
    severity: medium
    info: 'Review the System Security plan to determine the maximum number of concurrent

      sessions allowed. This is a per user setting and must be defined by the application

      admins.

      As a privileged user with access to the server.xml file, review file content and identify

      the "maxInMemorySessionCount" and the allowOverflow settings.

      EXAMPLE:

      grep -i maxInMemorySessionCount server.xml

      If maxInMemorySessionCount'
- id: '1.2'
  title: IBMW-LS-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The WebSphere Liberty Server Quality of Protection (QoP) must be set to use TLSv1.2 or higher. GROUP ID: V-250323
    RULE ID: SV-250323r960759'
  rationale: Quality of Protection in WebSphere Liberty specifies the security level, ciphers, and mutual authentication settings
    for the Secure Socket Layer (SSL/TLS) configuration. For Quality of Protection settings to apply, the security feature
    (appSecurity-2.0) must be defined in order to configure a user registry for the servlet to authenticate against. The SSL
    feature (ssl-1.0) must be defined in order to configure ssl settings, and the ldap feature (ldapRegistry-3.0) must be
    defined in order to configure an enterprise-level user registry for authentication of users.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'As a privileged user with local file access to ${server.config.dir}/server.xml, verify the

    appSecurity-x.x feature and the sslProtocol settings are configured.

    grep -i appsecurity- server.xml

    RESULT:

    appSecurity-2.0

    Verify the SSL protocol setting is configured for TLSV1.2 for every SSL configuration.

    There can be multiple SSL configurations and SSL ID settings.

    grep -i "<ssl id=" server.xml

    SAMPLE RESULT:

    <ssl id="TLSSettings" keyStoreRef="TLSKeyStore" trustStoreRef="TLSTrustStore"

    sslProtocol="TLSv1.2"/>

    If the SSL protocol setting does not specify TLS v.1.2 or higher, or if the appSecurity

    feature is not configured, this is a finding.'
  remediation: 'To ensure the QoP is set to TLS v1.2 or higher, the ${server.config.dir}/server.xml file

    must be configured as follows:

    <featureManager>appSecurity-2.0ssl-1.0</featureManager>

    For every SSL configuration, the sslProtocol field must be set to TLS v1.2 or higher.'
  checks:
  - type: command
    command: grep -i appsecurity- server.xml && grep -i "<ssl id=" server.xml
    expected: ''
    severity: medium
    info: 'As a privileged user with local file access to ${server.config.dir}/server.xml, verify the

      appSecurity-x.x feature and the sslProtocol settings are configured.

      grep -i appsecurity- server.xml

      RESULT:

      appSecurity-2.0

      Verify the SSL protocol setting is configured for TLSV1.2 for every SSL configuration.

      There can be multiple SSL configurations and SSL ID settings.

      grep -i "<ssl id=" server.xml

      SAMPL'
- id: '1.3'
  title: IBMW-LS-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Security cookies must be set to HTTPOnly. GROUP ID: V-250324 RULE ID: SV-250324r960762'
  rationale: 'Web applications use cookies to track users across requests. These cookies, while typically not sensitive in
    themselves, connect to the existing state on the back-end system. If an intruder were to capture one of these cookies,
    they could potentially use the cookie to act as the user. Important web traffic should be encrypted using SSL. This includes
    important cookies. In the case of WebSphere Liberty Server, the most important cookies are the LTPA cookie and session
    cookie; therefore, both should be configured to be only sent over SSL. To set httpOnly on the application server’s cookies,
    the security feature (appSecurity-2.0) must be defined in order to configure a user registry for the servlet to authenticate
    against. The servlet (servlet-3.1) feature must be defined in order to deploy web applications, the ssl (ssl-1.0) feature
    must be defined in order to do SSL communications, and the ldap feature (ldapRegistry-3.0) must be defined in order to
    configure an enterprise-level user registry for authentication of users. For the LTPA cookie, the httpOnlyCookies element
    must be set to true: <webAppSecurity ssoCookieName="LtpaToken2" ssoRequiresSSL="true" httpOnlyCookies="true" logoutOnHttpSessionExpire="true"/>
    For the JSESSIONID cookie, the cookieHttpOnly element must be set to true: <httpSession cookieName="JSESSIONID" cookieSecure="true"
    cookieHttpOnly="true" cookiePath="/"/>'
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'As a user with local file access to ${server.config.dir}/server.xml, verify appSecurity

    feature is enabled.

    <featureManager>appSecurity-2.0</featureManager>

    Verify both web application LTPA and http session cookies are configured for httpOnly.

    If the appSecurity feature is not enabled or if the LPTA or Session cookie settings are

    not set for httpOnly, this is a finding.'
  remediation: 'To ensure security cookies use httpOnly, the ${server.config.dir)/server.xml must be

    configured as follows:

    <featureManager>appSecurity-2.0</featureManager>'
  checks:
  - type: manual_review
    info: 'As a user with local file access to ${server.config.dir}/server.xml, verify appSecurity

      feature is enabled.

      <featureManager>appSecurity-2.0</featureManager>

      Verify both web application LTPA and http session cookies are configured for httpOnly.

      If the appSecurity feature is not enabled or if the LPTA or Session cookie settings are

      not set for httpOnly, this is a finding.'
    severity: medium
- id: '1.4'
  title: IBMW-LS-000040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The WebSphere Liberty Server must log remote session and security activity. GROUP ID: V-250325 RULE ID: SV-250325r1015250'
  rationale: 'Security auditing must be configured in order to log remote session activity. Security auditing will not be
    performed unless the audit feature (audit-1.0) has been enabled. The security feature (appSecurity-2.0) must be enabled
    for the security auditing to capture security transactions. Remote session activity will then be logged, regardless of
    the user attempting that activity. Satisfies: SRG-APP-000016-AS-000013, SRG-APP-000080-AS-000045, SRG-APP000089-AS-000050,
    SRG-APP-000091-AS-000052, SRG-APP-000095-AS-000056, SRG-APP-000096-AS-000059, SRG-APP-000097-AS-000060, SRG-APP-000098-AS000061,
    SRG-APP-000099-AS-000062, SRG-APP-000100-AS-000063, SRG-APP000101-AS-000072, SRG-APP-000266-AS-000168, SRG-APP-000343-AS-000030,
    SRG-APP-000172-AS-000121'
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'Review the ${server.config.dir}/server.xml file and ensure audit-1.0 and appSecurity-2.0

    are defined within the <featureManager> setting in the server.xml file.

    If audit-1.0 and appSecurity-2.0 are not defined within the <featureManager> setting in

    the server.xml file, this is a finding.

    EXAMPLE:

    <featureManager>

    audit-1.0

    appSecurity-3.0

    </featureManager>'
  remediation: 'To log remote access events, the featureManager setting in the

    ${server.config.dir}/server.xml must contain the audit and appSecurity features.'
  checks:
  - type: manual_review
    info: 'Review the ${server.config.dir}/server.xml file and ensure audit-1.0 and appSecurity-2.0

      are defined within the <featureManager> setting in the server.xml file.

      If audit-1.0 and appSecurity-2.0 are not defined within the <featureManager> setting in

      the server.xml file, this is a finding.

      EXAMPLE:

      <featureManager>

      audit-1.0

      appSecurity-3.0

      </featureManager>'
    severity: medium
- id: '1.5'
  title: IBMW-LS-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Users in the REST API admin role must be authorized. GROUP ID: V-250326 RULE ID: SV-250326r960792'
  rationale: Users with console access and OS permissions to the folders where the Liberty Server is installed can make changes
    to the server. In addition, REST API calls that execute server management tasks are available and can be executed remotely.
    Adding a user to the admin role will allow that user to make changes to the server via the REST API calls. The admin role
    must be controlled and users who are in that role must be authorized.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'As a user with access to ${server.config.dir}/server.xml, review the file and look for the

    admin role settings.

    grep -i administrator-role ${server.config.dir}/server.xml

    grep -i quickstartsecurity ${server.config.dir}/server.xml

    If the admin role has been created, users in that role must be documented and

    approved. However, using the basic registry or the quickstartsecurity methods are not

    acceptable. The preferred user registry method is to use a centralized access control

    method via LDAP.

    If no admin users exist at all, this is not a finding.

    If admin users in an LDAP user registry configuration are not documented and

    approved, this is a finding.

    If admin users exist in a basic user registry configuration, or in a quickstartsecurity user

    configuration, this is a finding.

    LDAP EXAMPLE:

    cn=bob,o=ibm,c=us

    BASIC REGISTRY EXAMPLE:

    <basicRegistry>

    <group name="group1" ...>

    </basicRegistry>

    QUICKSTARTSECURITY EXAMPLE:

    <featureManager>

    restConnector-2.0

    </featureManager>

    <quickStartSecurity userName="bob" userPassword="bobpassword" />

    <keyStore id="defaultKeyStore" password="keystorePassword"/>'
  remediation: 'If an admin user exists in either a basic user registry or a quickstartsecurity registry, edit

    the ${server.config.dir}/server.xml file and remove the basic registry and/or

    quickstartsecurity registry settings.

    If an admin user exists via an LDAP user registry setting, document and approve the

    user(s) or group that have been assigned to the admin role and ensure anyone granted

    REST API admin rights is authorized.

    LDAP EXAMPLE:

    cn=bob,o=ibm,c=us

    BASIC REGISTRY EXAMPLE:

    <basicRegistry>

    <group name="group1" ...>

    </basicRegistry>

    QUICKSTARTSECURITY EXAMPLE:

    <featureManager>

    restConnector-2.0

    </featureManager>

    <quickStartSecurity userName="bob" userPassword="bobpassword" />

    <keyStore id="defaultKeyStore" password="keystorePassword"/>'
  checks:
  - type: command
    command: grep -i administrator-role ${server.config.dir}/server.xml && grep -i quickstartsecurity ${server.config.dir}/server.xml
    expected: ''
    severity: medium
    info: 'As a user with access to ${server.config.dir}/server.xml, review the file and look for the

      admin role settings.

      grep -i administrator-role ${server.config.dir}/server.xml

      grep -i quickstartsecurity ${server.config.dir}/server.xml

      If the admin role has been created, users in that role must be documented and

      approved. However, using the basic registry or the quickstartsecurity methods are not

      accept'
- id: '1.6'
  title: IBMW-LS-000230
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The WebSphere Liberty Server must be configured to offload logs to a centralized system. GROUP ID: V-250327
    RULE ID: SV-250327r1043188'
  rationale: 'Log processing failures include, but are not limited to, failures in the application server log capturing mechanisms
    or log storage capacity being reached or exceeded. In some instances, it is preferred to send alarms to individuals rather
    than to an entire group. Application servers must be able to trigger an alarm and send an alert to, at a minimum, the
    SA and ISSO in the event there is an application server log processing failure. Satisfies: SRG-APP-000109-AS-000070, SRG-APP-000358-AS-000064'
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'As a privileged user with local file access to ${server.config.dir}/server.xml, verify the

    logstashCollector-1.0 feature is enabled.

    grep -i -A5 logstashcollector server.xml

    EXAMPLE:

    <featureManager>

    logstashCollector-1.0

    </featureManager>

    <logstashCollector source="message,accessLog,audit"

    hostName=""

    port=""

    sslRef="DefaultTLSSettings"

    </logstashCollector>

    If "logstashCollector" is not a configured feature and the logstashCollector "source"

    setting does not contain "message,accessLog,audit", this is a finding.'
  remediation: 'To send Liberty logs to a centralized syslog system, the Elastic environment must be

    set up as per the ELK stack/Elasticsearch directions. Once that is completed, configure

    the server.xml. The following is a sample configuration. Individual keystore, truststore,

    and authentication settings will vary. The SME must substitute their own values as

    needed.

    The message, audit, and accessLog sources must be included at a minimum.

    For additional information refer to the IBM website:

    https://www.ibm.com/support/knowledgecenter/SSEQTP_liberty/com.ibm.WebSphere.w

    lp.doc/ae/twlp_analytics_logstash.html

    EXAMPLE:

    <logstashCollector

    source="message,accessLog,audit"

    hostName="your ELK stack server"

    port="Your ELK stack port"

    sslRef="myTLSConfig">

    </logstashCollector>'
  checks:
  - type: command
    command: grep -i -A5 logstashcollector server.xml
    expected: ''
    severity: medium
    info: 'As a privileged user with local file access to ${server.config.dir}/server.xml, verify the

      logstashCollector-1.0 feature is enabled.

      grep -i -A5 logstashcollector server.xml

      EXAMPLE:

      <featureManager>

      logstashCollector-1.0

      </featureManager>

      <logstashCollector source="message,accessLog,audit"

      hostName=""

      port=""

      sslRef="DefaultTLSSettings"

      </logstashCollector>

      If "logstashCollector" is not a configu'
- id: '1.7'
  title: IBMW-LS-000260
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The WebSphere Liberty Server must protect log information from unauthorized access or changes. GROUP ID: V-250328
    RULE ID: SV-250328r960933'
  rationale: 'WebSphere Liberty provides the capability to encrypt and sign the log data to prevent unauthorized modification.
    • The security feature (appSecurity-2.0) must be defined in order to configure a user registry for the servlet to authenticate
    against. • The audit feature (audit-1.0) must be defined in order to generate audit records. • The servlet feature (servlet-3.1)
    must be defined to be able to deploy a web application. • The ejb feature (ejbLite-3.1) must be defined to be able to
    deploy an ejb application. • The ssl feature (ssl-1.0) must be defined to be able to generate and use certificates to
    sign and encrypt logs. • The ldap feature (ldapRegistry-3.0) must be defined in order to configure an enterprise-level
    user registry to authenticate users against. When the audit-1.0 feature is defined, all supported audit events will be
    captured and logged to an audit.log located under ${server.config.dir}/logs. The audit log that is currently being logged
    to is called audit.log. When an audit log fills to a configured maximum capacity, it is archived with a timestamp with
    the naming convention audit_.log and new records are written to audit.log. The audit logs are found under the ${server.config.dir}/logs
    directory and are named audit.log for the most recent, and audit_.log for any archived logs. Two keystores need to be
    created (ikeyman as part of the JDK may be used) and a personal certificate created in each. One keystore will contain
    the certificate used to encrypt the logs; the other keystore will contain the certificate used to sign the logs. The audit
    configuration needs to define the location of these two keystores, their passwords, and the alias of each certificate
    used to encrypt and sign the logs. As an example: <keyStore id="auditEncKeyStore" password="Liberty" location="${server.config.dir}/resources/security/AuditEncryptionKeyStore.jks"
    type="JKS" /> <keyStore id="auditSignKeyStore" password="{xor}EzY9Oi0rJg==" location="${server.config.dir}/resources/security/AuditSigningKeyStore2.jks"
    type="JKS" /> <auditFileHandler encrypt="true" encryptAlias="auditencryption" encryptKeyStoreRef="auditEncKeyStore" sign="true"
    signingAlias="auditsigning2" signingKeyStoreRef="auditSignKeyStore"> </auditFileHandler> Satisfies: SRG-APP-000119-AS-000079,
    SRG-APP-000120-AS-000080'
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'As a user with local file access to ${server.config.dir}/logs, verify the following audit log

    files have the correct file permissions of 660.

    audit.log

    messages.log

    console.log

    trace.log (if it exists)

    If the file permissions for these files are not set to 660, this is a finding.'
  remediation: 'As a user with local file access to ${server.config.dir}/logs, use the chmod command to

    configure the following log files to have the correct file permissions of 660.

    chmod 660 <filename.log>

    audit.log

    messages.log

    console.log

    trace.log (if it exists)'
  checks:
  - type: manual_review
    info: 'As a user with local file access to ${server.config.dir}/logs, verify the following audit log

      files have the correct file permissions of 660.

      audit.log

      messages.log

      console.log

      trace.log (if it exists)

      If the file permissions for these files are not set to 660, this is a finding.'
    severity: medium
- id: '1.8'
  title: IBMW-LS-000280
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The WebSphere Liberty Server must protect log tools from unauthorized access. GROUP ID: V-250329 RULE ID:
    SV-250329r960939'
  rationale: Protecting log data also includes identifying and protecting the tools used to view and manipulate log data.
    Depending on the log format and application, system and application log tools may provide the only means to manipulate
    and manage application and system log data. Therefore, it is imperative that access to log tools be controlled and protected
    from unauthorized access. Application servers provide a web- and/or a command line-based management functionality for
    managing the application server log capabilities. In addition, subsets of log tool components may be stored on the file
    system as jar or xml configuration files. The application server must ensure that in addition to protecting any web-based
    log tools, any file system-based tools are protected as well.
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'As a user with local file access to the /opt/IBM/WebSphere/Liberty/bin folder, verify the

    following audit tool files have the correct file permissions of 755.

    binaryLog

    auditUtility

    If the file permissions for these files are not set to 755, this is a finding.'
  remediation: 'As a user with local file access to the /opt/IBM/WebSphere/Liberty/bin/ folder, use the

    chmod command to configure the correct file permissions of 755 for the following files.

    binaryLog

    auditUtility'
  checks:
  - type: manual_review
    info: 'As a user with local file access to the /opt/IBM/WebSphere/Liberty/bin folder, verify the

      following audit tool files have the correct file permissions of 755.

      binaryLog

      auditUtility

      If the file permissions for these files are not set to 755, this is a finding.'
    severity: medium
- id: '1.9'
  title: IBMW-LS-000320
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The WebSphere Liberty Server must be configured to encrypt log information. GROUP ID: V-250330 RULE ID: SV-250330r960951'
  rationale: 'Protection of log records is of critical importance. Encrypting log records provides a level of protection that
    does not rely on host-based protections that can be accidentally misconfigured, such as file system permissions. Cryptographic
    mechanisms are the industry-established standard used to protect the integrity of log data. An example of a cryptographic
    mechanism is the computation and application of a cryptographic-signed hash using asymmetric cryptography. • The security
    feature (appSecurity-2.0) must be defined in order to configure a user registry for the servlet to authenticate against.
    • The audit feature (audit-1.0) must be defined in order to generate audit records. • The servlet feature (servlet-3.1)
    must be defined to be able to deploy a web application. • The ejb feature (ejbLite-3.1) must be defined to be able to
    deploy an ejb application. • The ssl feature (ssl-1.0) must be defined to be able to generate and use certificates to
    sign and encrypt logs. • The ldap feature (ldapRegistry-3.0) must be defined in order to configure an enterprise-level
    user registry to authenticate users against. When the audit-1.0 feature is defined, all supported audit events will be
    captured and logged to an audit.log located under ${server.config.dir}/logs. The audit log that is currently being logged
    to is called audit.log. When an audit log fills to a configured maximum capacity, it is archived with a timestamp with
    the naming convention audit_.log and new records are written to audit.log. The audit logs are found under the ${server.config.dir}/logs
    directory and are named audit.log for the most recent, and audit_.log for any archived logs. One keystore needs to be
    created (ikeyman as part of the JDK may be used) and a personal certificate created. This certificate is used to encrypt
    the logs. The audit configuration needs to define the location of this keystore, its password, and the alias of the certificate
    used to encrypt the logs. As an example: <keyStore id="auditEncKeyStore" password="Liberty" location="${server.config.dir}/resources/security/AuditEncryptionKeyStore.jks"
    type="JKS" /> <keyStore id="auditSignKeyStore" password="{xor}EzY9Oi0rJg==" location="${server.config.dir}/resources/security/AuditSigningKeyStore2.jks"
    type="JKS" /> <auditFileHandler encrypt="true" encryptAlias="auditencryption" encryptKeyStoreRef="auditEncKeyStore" </auditFileHandler>
    Satisfies: SRG-APP-000126-AS-000085, SRG-APP-000118-AS-000078, SRG-APP000267-AS-000170'
  impact: ''
  references: []
  page_start: 29
  audit_raw: "If the system is configured to send logs to a remote ELK stack log server, as per\nrequirement IBMW-LS-000230,\
    \ (or other remote logging solution) this requirement is\nNot Applicable.\nAs a user with local file access to ${server.config.dir}/server.xml:\n\
    1. Verify the following features are configured.\n2. Verify a keystore is configured. The following is an example:\n<keyStore\n\
    id=\"auditEncKeyStore\"\npassword=\"ENTER THE ENCRYPTION KEYSTORE PASSWORD\"\nlocation=\"${server.config.dir}/resources/security/AuditEncryptionKeyStore.jks\"\
    \ntype=\"JKS\" />\n <keyStore\n id=\"auditSignKeyStore\"\n password=\"ENTER THE SIGNING KEYSTORE PASSWORD\"\nlocation=\"\
    ${server.config.dir}/resources/security/AuditSigningKeyStore2.jks\"\n type=\"JKS\" />\n3. Verify auditFileHandler encryption\
    \ is enabled. Signing is optional.\n<auditFileHandler\nencrypt=\"true\"\nencryptAlias=\"auditencryption\"\nencryptKeyStoreRef=\"\
    auditEncKeyStore\"\nsign=\"true\"\nsigningAlias=\"auditsigning2\"\nsigningKeyStoreRef=\"auditSignKeyStore\">\n</auditFileHandler>\n\
    If the features and keystore are not configured, and encryption is not enabled, this is a\nfinding."
  remediation: "If the system is configured to send logs to a remote ELK stack log server, (or other\nremote logging solution)\
    \ as per requirement IBMW-LS-000230, this requirement is Not\nApplicable.\nSigning is optional. The encrypted and/or signed\
    \ audit logs are found under the\n${server.config.dir}/logs directory and are named audit.log for the most recent, and\n\
    audit_.log for any archived logs. Two keystores are recommended but not required\nwhen doing both encryption and signing\
    \ (ikeyman as part of the JDK may be used) and\na certificate imported into each. One keystore will contain the certificate\
    \ used to encrypt\nthe logs; the other keystore will contain the certificate used to sign the logs. The audit\nconfiguration\
    \ must define the location of every keystore, their passwords, and the alias\nof each certificate used to encrypt and\
    \ sign the logs.\n1. Enable the following features:\n2. Verify a keystore is configured. The following is a JKS keystore\
