- id: '1.17'
  title: IBMW-LS-000500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The WebSphere Liberty Server must use DoD-issued/signed certificates. GROUP ID: V-250338 RULE ID: SV-250338r961044'
  rationale: 'The cornerstone of PKI is the private key used to encrypt or digitally sign information. The key by itself is
    a cryptographic value that does not contain specific user information, but the key can be mapped to a user. Without mapping
    the certificate used to authenticate to the user account, the ability to determine the identity of the individual user
    or group will not be available for forensic analysis. Satisfies: SRG-APP-000177-AS-000126, SRG-APP-000427-AS-000264, SRG-APP000514-AS-000137'
  impact: ''
  references: []
