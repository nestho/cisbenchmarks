- id: '1.15'
  title: IBMW-LS-000440
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The WebSphere Liberty Server must store only encrypted representations of user passwords. GROUP ID: V-250336
    RULE ID: SV-250336r1015470'
  rationale: 'WebSphere Liberty can either provide a local account store or integrate with enterprise account stores such
    as LDAP directories. If the application server stores application passwords in the server.xml configuration files, the
    application server must store encrypted representations of passwords rather than unencrypted, clear-text passwords. The
    Liberty Application Server provides a SecurityUtility tool that can take a plain-text or encoded password and convert
    it to an encrypted password. This tool does not update the ${server.config.dir/server.xml file directly; a manual update
    of the server.xml is needed once the utility is run. It is imperative that administrators understand that the SecurityUtility
    tool must be run for each application password that is stored within the server.xml file. Satisfies: SRG-APP-000171-AS-000119,
    SRG-APP-000428-AS-000265, SRG-APP000429-AS-000157'
  impact: ''
  references: []
  page_start: 43
  audit_raw: 'As a privileged user with file access to ${server.config.dir}/server.xml, review and

    ensure there are no clear-text passwords stored within the server.xml file.

    If any passwords appear in plain text, or if any passwords start with {xor}, this is a

    finding.'
  remediation: 'For additional information regarding the use of the SecurityUtility command, refer to

    IBM’s website:

    https://www.ibm.com/docs/en/was-liberty/base?topic=applications-securityutilitycommand

    Create a new xml file with file permissions of 660.

    File owner and group membership is the same as the WebSphere Liberty server user.

    Add the following line to the new xml file:

    In the above, "mysecret" is the passphrase selected to create a cryptographic hash that

    represents the password.

    Save the file to a secured location. Note the path and name, as it will be needed when

    updating server.xml.

    Edit the server.xml file and add the following line:

    For every unencrypted password in server.xml, run the following SecurityUtility

    command, which can be found in the Liberty Server install path:

    SecurityUtility encode --encoding=aes

    This will prompt the user to enter the plain-text password stored within the server.xml

    file.

    The SecurityUtility tool will generate an AES cryptographic hash of the password.

    Copy and replace the plain-text password with the hashed value.

    This must be done for every plain-text password in server.xml.

    Restart the server by entering:

    server stop

    server start'
  checks:
  - type: manual_review
    info: 'As a privileged user with file access to ${server.config.dir}/server.xml, review and

      ensure there are no clear-text passwords stored within the server.xml file.

      If any passwords appear in plain text, or if any passwords start with {xor}, this is a

      finding.'
    severity: medium
- id: '1.16'
  title: IBMW-LS-000450
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The WebSphere Liberty Server must use TLS-enabled LDAP. GROUP ID: V-250337 RULE ID: SV-250337r961029'
  rationale: Passwords need to be protected at all times, and encryption is the standard method for protecting passwords during
    transmission. If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised. Application
    servers have the capability to use either certificates (tokens) or user IDs and passwords in order to authenticate. When
    the application server transmits or receives passwords, the passwords must be encrypted. The certificate used by LDAP
    to establish trust with incoming client requests must be imported into a trust keystore created on the Liberty Server
    (JDK ikeyman may be used to do this). The LDAP configuration must indicate it is using SSL, provide the BindDN and BindPassword
