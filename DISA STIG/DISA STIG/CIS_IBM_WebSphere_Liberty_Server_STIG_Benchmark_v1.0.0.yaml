- id: '1.13'
  title: IBMW-LS-000381
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Basic Authentication must be disabled. GROUP ID: V-250334 RULE ID: SV-250334r1051118'
  rationale: Basic authentication does not use a centralized user store like LDAP. Not using a centralized user store complicates
    user management tasks and increases the risk that user accounts could remain on the system long after users have moved
    to their next deployment. Basic Auth also stores user credentials and passwords on the system and creates the potential
    for an attacker to circumvent strong authentication requirements like multi-factor or certificate based authentication.
    Allowing failover to Basic Auth allows the Liberty Server to fall back to basic authentication in the event certificate
    based authentication methods fail. Configuring the Liberty Server to fall back to basic authentication creates the potential
    for an attacker to circumvent strong authentication requirements and must be avoided.
  impact: ''
  references: []
  page_start: 38
  audit_raw: 'As a privileged user with local file access to the ${server.config.dir}/server.xml file,

    search the server.xml for the basicRegistry setting.

    grep -i basicregistry server.xml

    SAMPLE:

    <basicRegistry id="basic" realm="BasicRealm">

    </basicRegistry>

    If <basicRegistry> settings are defined in server.xml, this is a finding.'
  remediation: 'Delete basicRegistry settings and re-configure the server.xml file to use a centralized

    LDAP user store.

    SAMPLE:

    <ldapRegistry id="ldap" realm="SampleLdapRealm" host="${ldap.server.name}"

    port="${ldap.server.port}" ignoreCase="true"

    baseDN="${ldap.server.base.dn}"

    ldapType="${ldap.vendor.type}"

    searchTimeout="8m">

    </ldapRegistry>'
  checks:
  - type: command
    command: grep -i basicregistry server.xml
    expected: ''
    severity: medium
    info: 'As a privileged user with local file access to the ${server.config.dir}/server.xml file,

      search the server.xml for the basicRegistry setting.

      grep -i basicregistry server.xml

      SAMPLE:

      <basicRegistry id="basic" realm="BasicRealm">

      </basicRegistry>

      If <basicRegistry> settings are defined in server.xml, this is a finding.'
- id: '1.14'
  title: IBMW-LS-000390
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Multifactor authentication for network access to privileged accounts must be used. GROUP ID: V-250335 RULE
    ID: SV-250335r1015469'
  rationale: 'Multifactor authentication creates a layered defense and makes it more difficult for an unauthorized person
    to access the application server. If one factor is compromised or broken, the attacker still has at least one more barrier
    to breach before successfully breaking into the target. Unlike a simple username/password scenario where the attacker
    could gain access by knowing both the username and password without the user knowing his account was compromised, multifactor
    authentication adds the requirement that the attacker must have something from the user, such as a token, or to biometrically
    be the user. When accessing the application server via a network connection, administrative access to the application
    server must be PKI Hardware Token enabled. The high level steps required for configuring Liberty Server to use certificate
    based authentication include the following: 1. Configure Web Application with client certificate authentication. 2. Configure
    Liberty SSL configuration with client authentication. 3. Configure Liberty LDAP Security Configuration with certificate
    filter. Satisfies: SRG-APP-000149-AS-000102, SRG-APP-000151-AS-000103, SRG-APP000402-AS-000247, SRG-APP-000403-AS-000248,
    SRG-APP-000177-AS-000126'
