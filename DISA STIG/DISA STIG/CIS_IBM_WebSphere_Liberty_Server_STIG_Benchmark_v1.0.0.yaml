      registered with PPSM, this is a finding.'
- id: '1.12'
  title: IBMW-LS-000380
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The WebSphere Liberty Server must use an LDAP user registry. GROUP ID: V-250333 RULE ID: SV-250333r1051118'
  rationale: To ensure accountability and prevent unauthorized access, application server users must be uniquely identified
    and authenticated. This is typically accomplished via the use of a user store which is either local (OS-based) or centralized
    (LDAP) in nature. Best practice guideline to is to use a centralized enterprise LDAP server. To ensure support to the
    enterprise, the authentication must use an enterprise solution.
