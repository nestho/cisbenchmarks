- id: '1.18'
  title: IBMW-LS-000520
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The WebSphere Liberty Server must use FIPS 140-2 approved encryption modules when authenticating users and
    processes. GROUP ID: V-250339 RULE ID: SV-250339r1067571'
  rationale: 'Application servers must use and meet requirements of the DOD Enterprise PKI infrastructure for application
    authentication. Encryption is only as good as the encryption modules used. Unapproved cryptographic module algorithms
    cannot be verified and cannot be relied upon to provide confidentiality or integrity, and DOD data may be compromised
    due to weak algorithms. The use of TLS provides confidentiality of data in transit between the application server and
    client. TLS must be enabled and non-FIPS-approved SSL versions must be disabled. NIST SP 800-52 specifies the preferred
    configurations for government systems. Satisfies: SRG-APP-000179-AS-000129, SRG-APP-000224-AS-000152, SRG-APP000416-AS-000140,
    SRG-APP-000439-AS-000155, SRG-APP-000442-AS-000259, SRG-APP-000514-AS-000136'
  impact: ''
  references: []
  page_start: 50
  audit_raw: 'There are two ways to meet this requirement. Only one method is required.

    If IBM JDK 8 is installed and configured to run with WebSphere Liberty, proceed with

    method (I).

    If IBM Semeru Runtimes version 11 and above is installed and configured with

    WebSphere Liberty, proceed with method (II). Currently IBM Semeru supports FIPS on

    RedHat Enterprise Linux.

    Method (I) IBM JDK 8 is configured to run with WebSphere Liberty:

    1. Review the ${server.config.dir}/jvm.options file. Verify FIPS is in use by checking

    the following lines:

    Dcom.ibm.jsse2.usefipsprovider=true

    Dcom.ibm.jsse2.usefipsProviderName=IBMJCEPlusFIPS

    If the properties are not set as shown in the ${server.config.dir}/jvm.options file, this is a

    finding.

    2. Open ${JAVA_HOME}/jre/lib/security/java.security file. Locate the list of

    cryptographic providers and confirm the following entries in the provider list:

    com.ibm.crypto.plus.provider.IBMJSSEProvider2

    com.ibm.crypto.plus.provider.IBMJCEPlusFIPS

    com.ibm.crypto.plus.provider.IBMJCEPlus

    com.ibm.crypto.plus.provider.IBMJCE

    If the entries are not set as shown in the ${JAVA_HOME}/jre/lib/security/java.security

    file, this is a finding.

    Method (II) Semeru Runtimes version 11 and above is installed and configured with

    WebSphere Liberty. Requires RedHat Enterprise Linux as the Host Operating System.

    1. Run the following command on the RedHat Enterprise Linux. Verify FIPS mode is

    enabled.

    fips-mode-setup --check

    If FIPS mode is not enabled, this is a finding.

    2. Review the ${server.config.dir}/jvm.options file. Verify "semeru.fips" property is

    set to true.

    Dsemeru.fips=true

    If the property is not set as shown in the ${server.config.dir}/jvm.options file, this

    is a finding.

    3. Confirm NSS packages are installed by running "# dnf install nss" in a terminal.

    dnf install nss

    Updating Subscription Management repositories.

    Last metadata expiration check: 0:56:30 ago on Wed 13 Sep 2023 07:29:35 AM PDT.

    Package nss-3.79.0-11.el8_7.x86_64 is already installed.

    Dependencies resolved.

    Nothing to do.

    Complete!

    If the command does not return output stating NSS is installed, this is a finding.

    4. Confirm NSS Database has the keystore imported by running "# certutil -L -d

    /etc/pki/nssdb" in a terminal.

    certutil -L -d /etc/pki/nssdb

    Certificate Nickname Trust Attributes

    SSL,S/MIME,JAR/XPI

    default CTu,Cu,Cu

    If the command does not return the results as shown, this is a finding.

    5. Review the ${server.config.dir}/server.xml and confirm the following entries:

    name = NSS-FIPS

    library = /usr/lib64/libsoftokn3.so

    slot = 3

    showInfo = true

    If the entries are not set as shown in the ${server.config.dir}/server.xml file, this is a

    finding.

    6. Review the ${server.config.dir}/server.xml file with the following steps:

    6.1 Locate configuration that is specifying the default SSL configuration for Liberty.

    6.2 Locate the "keyStoreRef" attribute in the configuration and find the referenced

    <keyStore> configuration.

    6.3 Verify the "provider" attribute is set to either "SunPKCS11-NSS-FIPS" or "PKCS11NSS-FIPS" in the <keyStore> configuration.

    6.4 Verify the "type" attribute is set to "PKCS11".

    6.5 Verify the "fileBased" attribute is set to "false".

    6.6 Find the "location" attribute for the configuration file of NSS keystore database (In

    the example below, it is "/tmp/pkcs11cfg.cfg").

    6.7 Verify the file is in a location that is accessible to Liberty.

    Snippet of server.xml:

    <ssl id="defaultSSLConfig" keyStoreRef="defaultKeyStore" sslProtocol="TLSv1.2" />

    <keyStore id="defaultKeyStore" password="{xor}Lz4sLCgwLTsINis3"

    location="/tmp/pkcs11cfg.cfg" type="PKCS11" fileBased="false" provider="SunPKCS11NSS-FIPS" />

    If the entries are not set as shown in the ${server.config.dir}/server.xml file, this is a

    finding.'
  remediation: 'There are two ways to meet this requirement. Only one method is required.

    If IBM JDK 8 is installed and configured to run with WebSphere Liberty, proceed with

    method (I).

    If IBM Semeru Runtimes version 11 and above is installed and configured with

    WebSphere Liberty, proceed with method (II). Currently IBM Semeru supports FIPS on

    RedHat Enterprise Linux.

    Method (I) IBM JDK 8 is configured to run with WebSphere Liberty:

    1. Edit/Create the ${server.config.dir}/jvm.options file.

    Edit/Add the following two properties:

    Dcom.ibm.jsse2.usefipsprovider=true

    Dcom.ibm.jsse2.usefipsProviderName=IBMJCEPlusFIPS

    2. Edit ${JAVA_HOME}/jre/lib/security/java.security file and locate the list of

    cryptographic providers. Edit/add the following four providers:

    security.provider.1=com.ibm.jsse2.IBMJSSEProvider2

    security.provider.2=com.ibm.crypto.plus.provider.IBMJCEPlusFIPS

    security.provider.3=com.ibm.crypto.provider.IBMJCE

    security.provider.4=com.ibm.crypto.plus.provider.IBMJCEPlus

    Method (II) Semeru Runtimes version 11 and above is installed and configured with

    WebSphere Liberty. Requires RedHat Enterprise Linux as the Host Operating System.

    1. Log in as root or super user.

    2. Enable FIPS on the RedHat Enterprise Linux.

    $ fips-mode-setup --enable

    $ fips-mode-setup --check

    3. Update/create the ${server.config.dir}/jvm.options.

    Edit/Add the following property:

    Dsemeru.fips=true

    4. Install NSS packages. Run "$ dnf install nss".

    5. Import keystores to NSS Database by using "pk12util" command. Replace

    "changeit" for -W option to the desired password.

    $ pk12util -i resources/security/key.p12 -W changeit -d /etc/pki/nssdb

    pk12util: PKCS12 IMPORT SUCCESSFUL

    6. Mark the imported certificates as a trusted certificate authority (CA).

    $ certutil -M -n default -t "CT,CT,CT" -d /etc/pki/nssdb

    7. List the contents of the NSS Database to confirm the alias name and the Trust

    Attributes.

    $ certutil -L -d /etc/pki/nssdb

    Certificate Nickname Trust Attributes

    SSL,S/MIME,JAR/XPI

    default CTu,Cu,Cu

    8. Create a config file (pkcs11cfg.cfg) with the contents below. It will be used by

    ${server.config.dir}/server.xml.

    name = NSS-FIPS

    library = /usr/lib64/libsoftokn3.so

    slot = 3

    showInfo = true

    9. Update the ${server.config.dir}/server.xml file to use the configuration file in its

    SSL configuration.

    <ssl id="defaultSSLConfig"

    keyStoreRef="defaultKeyStore"

    sslProtocol="TLSv1.2" />

    <keyStore id="defaultKeyStore" password="password used in -W parameter earlier

    here"

    location="${server.config.dir}/pkcs11cfg.cfg" type="PKCS11"

    fileBased="false" provider="SunPKCS11-NSS-FIPS"/>

    9.1 Find the <keyStore/> configuration referenced in the ssl configuration as

    "keyStoreRef".

    9.2 Set "provider" attribute to either "SunPKCS11-NSS-FIPS" or "PKCS11-NSS-FIPS".

    9.3 Set the "type" attribute to "PKCS11"

    9.4 Set the "fileBased" attribute to "false"

    9.5 Set the "location" attribute to point to the NSS keystore configuration created in step

    8 (pkcs11.cfg.cfg).

    9.6 Verify the file is in a location that is accessible to Liberty.'
  checks:
  - type: manual_review
    info: 'There are two ways to meet this requirement. Only one method is required.

      If IBM JDK 8 is installed and configured to run with WebSphere Liberty, proceed with

      method (I).

      If IBM Semeru Runtimes version 11 and above is installed and configured with

      WebSphere Liberty, proceed with method (II). Currently IBM Semeru supports FIPS on

      RedHat Enterprise Linux.

      Method (I) IBM JDK 8 is configured to run with WebSphere Liberty:

      1. Review the ${server.config.dir}/jvm.options file. Verify FIPS is in use by '
    severity: medium
- id: '1.19'
  title: IBMW-LS-000720
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'HTTP session timeout must be configured. GROUP ID: V-250340 RULE ID: SV-250340r1043182'
  rationale: 'An attacker can take advantage of user sessions that are left open, thus bypassing the user authentication process.
    To thwart the vulnerability of open and unused user sessions, the application server must be configured to close the sessions
    when a configured condition or trigger event is met. Session termination terminates all processes associated with a user’s
    logical session except those processes that are specifically created by the user (i.e., session owner) to continue after
    the session is terminated. Conditions or trigger events requiring automatic session termination can include, for example,
    periods of user inactivity, targeted responses to certain types of incidents, and time-of-day restrictions on information
    system use. Satisfies: SRG-APP-000295-AS-000263, SRG-APP-000389-AS-000253'
  impact: ''
  references: []
  page_start: 57
  audit_raw: 'As a user with access to the server xml file, review the contents and verify the

    httpSession time out setting is configured for 10 minutes.

    If the ${server.config.dir}/server.xml does not define the timeout setting as 10 minutes,

    this is a finding.'
  remediation: 'The ${server.config.dir}/server.xml file must be configured to update the

    invalidationTimeout attribute on the httpSession element to set the session timeout

    value in hours (h) or minutes (m). The server.xml file must define the following:

    By default, httpSession invalidationTimeout is set to 30m.'
  checks:
  - type: manual_review
    info: 'As a user with access to the server xml file, review the contents and verify the

      httpSession time out setting is configured for 10 minutes.

      If the ${server.config.dir}/server.xml does not define the timeout setting as 10 minutes,

      this is a finding.'
    severity: medium
- id: '1.20'
  title: IBMW-LS-000770
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Application security must be enabled on the WebSphere Liberty Server. GROUP ID: V-250341 RULE ID: SV-250341r1015252'
  rationale: 'Application security enables security for the applications in the environment. This type of security provides
    application isolation and requirements for authenticating application users. When a user enables security, both administrative
    and application security is enabled. Application security is in effect only when administrative security is enabled via
    the security feature. If the application server is to be used for only web applications, only the servlet-3.1 feature
    needs to be defined. If the application server is to be used for only ejb applications, only the ejbLite-3.1 feature needs
    to be defined. If both web and ejb applications are to be deployed on the application server, then both the servlet-3.1
    and ejbLite-3.1 features need to be defined. The check and fix assumes that the application server will have both web
    and ejb applications deployed. Satisfies: SRG-APP-000315-AS-000094, SRG-APP-000014-AS-000009'
  impact: ''
  references: []
  page_start: 59
  audit_raw: 'As a user with local file access to ${server.config.dir}/server.xml file, verify application

    security is enabled.

    If the appSecurity-2.0 feature is not defined within server.xml, this is a finding.'
  remediation: 'Configure the ${server.config.dir}/server.xml file and add the appSecurity-2.0 feature.

    Review ${server.config.dir}/logs/messages.log

    Validate log entry that indicates "Security service is ready".'
  checks:
  - type: manual_review
    info: 'As a user with local file access to ${server.config.dir}/server.xml file, verify application

      security is enabled.

      If the appSecurity-2.0 feature is not defined within server.xml, this is a finding.'
    severity: medium
- id: '1.21'
  title: IBMW-LS-000790
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Users in a reader-role must be authorized. GROUP ID: V-250342 RULE ID: SV-250342r961353'
  rationale: The reader role is a management role that allows read-only access to select administrative REST APIs as well
    as the Admin Center UI (adminCenter-1.0). Preventing non-privileged users from viewing privileged functions mitigates
    the risk that unauthorized individuals or processes may gain unnecessary access to information or privileges. Users granted
    reader role access must be authorized.
  impact: ''
  references: []
  page_start: 61
  audit_raw: 'As a user with access to the ${server.config.dir}/server.xml file. Review the contents

    and identify if users have been granted the reader-role.

    grep -i reader-role ${server.config.dir}/server.xml

    If the reader-role has been created, users in that role must be documented and

    approved.

    If users in the reader-role are not approved, this is a finding.

    EXAMPLE:

    <featureManager>appSecurity-2.0</featureManager>'
  remediation: 'Edit the ${server.config.dir}/server.xml file. If unauthorized users have been added to

    the reader-role, remove those users.

    Otherwise, document the users who are granted the reader-role access.

    To allow read-only access to select administrative REST APIs, the

    ${server.config.dir}/server.xml must be configured as follows. Additionally, the users and

    groups they are a part of must be defined within LDAP.

    EXAMPLE:

    <featureManager>

    appSecurity-2.0

    </featureManager>

    <ldapRegistry id="ldap" realm="SampleLdapRealm" host="${ldap.server.name}"

    port="${ldap.server.port}" ignoreCase="true"

    baseDN="${ldap.server.base.dn}"

    ldapType="${ldap.vendor.type}"

    searchTimeout="8m">

    </ldapRegistry>'
  checks:
  - type: command
    command: grep -i reader-role ${server.config.dir}/server.xml
    expected: ''
    severity: medium
    info: 'As a user with access to the ${server.config.dir}/server.xml file. Review the contents

      and identify if users have been granted the reader-role.

      grep -i reader-role ${server.config.dir}/server.xml

      If the reader-role has been created, users in that role must be documented and

      approved.

      If users in the reader-role are not approved, this is a finding.

      EXAMPLE:

      <featureManager>appSecurity-2.0</featureM'
- id: '1.22'
  title: IBMW-LS-000830
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The WebSphere Liberty Server must allocate JVM log record storage capacity in accordance with organization-defined
    log record storage requirements. GROUP ID: V-250343 RULE ID: SV-250343r961392'
  rationale: JVM logs are logs used to store application and runtime related events, rather than audit related events. They
    are mainly used to diagnose application or runtime bugs. However, they are useful for providing more context when correlated
    with audit related events. By default, Liberty automatically logs the console.log, messages.log, and trace.log but these
    default settings must be validated.
  impact: ''
  references: []
  page_start: 63
  audit_raw: 'Review the ${server.config.dir}/bootstrap.properties file, verify console logging is not

    turned off. If the property com.ibm.ws.logging.console.log.level=OFF, this is a finding.

    Review the ${server.config.dir}/server.xml file and verify the logging traceSpecification

    setting is configured according to system capacity requirements. If the logging

    traceSpecification settings are not configured, this is a finding.

    EXAMPLE:

    <logging traceSpecification="=info=enabled:my.package.=all" maxFileSize="40"

    maxFiles="20"/>'
  remediation: 'Edit the bootstrap.properties file and configure the

    com.ibm.ws.logging.console.log.level=ON.

    Edit the ${server.config.dir}/server.xml file. Configure <logging traceSpecification> in

    accordance with local policy and system storage limits.

    EXAMPLE:

    <logging traceSpecification="=info=enabled:my.package.=all" maxFileSize="40"

    maxFiles="20"/>,

    where maxFileSize is set to the maximum file size defined in local policy and maxFiles

    is set to the maximum number of historical files defined in local policy and in

    accordance with system storage limits.'
  checks:
  - type: manual_review
    info: 'Review the ${server.config.dir}/bootstrap.properties file, verify console logging is not

      turned off. If the property com.ibm.ws.logging.console.log.level=OFF, this is a finding.

      Review the ${server.config.dir}/server.xml file and verify the logging traceSpecification

      setting is configured according to system capacity requirements. If the logging

      traceSpecification settings are not configured, this is a finding.

      EXAMPLE:

      <logging traceSpecification="=info=enabled:my.package.=all" maxFileSize="40"'
    severity: medium
