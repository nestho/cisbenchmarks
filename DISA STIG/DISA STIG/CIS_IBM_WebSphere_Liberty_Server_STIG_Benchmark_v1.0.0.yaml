- id: '1.10'
  title: IBMW-LS-000340
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The WebSphere Liberty Server must protect software libraries from unauthorized access. GROUP ID: V-250331
    RULE ID: SV-250331r960960'
  rationale: Application servers have the ability to specify that the hosted applications use shared libraries. The application
    server must have a capability to divide roles based upon duties wherein one project user (such as a developer) cannot
    modify the shared library code of another project user. The application server must also be able to specify that nonprivileged
    users cannot modify any shared library code at all.
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'As a privileged user with local file access to the /opt/IBM/WebSphere/Liberty/lib/ folder,

    verify all of the jar files in the lib folder have the correct file permissions of 664.

    If the file permissions for all jar files in the lib folder are not set to 664, this is a finding.'
  remediation: 'As a privileged user with local file access to the /opt/IBM/WebSphere/Liberty/lib/ folder,

    verify all of the jar files in the lib folder have the correct file permissions of 664.

    If the file permissions for all jar files in the lib folder are not set to 664, use the chmod

