- id: '1.42'
  title: FORE-NM-000460
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Forescout must be configured to send log data to a central log server for the purpose of forwarding alerts
    to the administrators and the Information System Security Officer (ISSO). GROUP ID: V-230972 RULE ID: SV-230972r961863'
  rationale: The aggregation of log data kept on a syslog server can be used to detect attacks and trigger an alert to the
    appropriate security personnel. The stored log data can be used to detect weaknesses in security that enable the network
    IA team to find and address these weaknesses before breaches can occur. Reviewing these logs, whether before or after
    a security breach, are important in showing whether someone is an internal employee or an outside threat.
  impact: ''
  references: []
  page_start: 98
  audit_raw: 'Check the Forescout logs periodically to ensure proper auditing functions are still

    enabled and have not been changed. A proper security policy performs periodic checks

    to help ensure the proper information is being gathered in the event of a security

    breach, or internal/external threat.

    If the Forescout auditing functions are disabled or have been changed, this is a finding.'
  remediation: 'Establish and document a procedure that periodically checks to ensure audit logs are in

    keeping with the security best practices of detailed security audit logs.

    1. Log on to the Forescout UI.

    2. Select Tools >> Options >> Modules >> Syslog >> Add.

    3. Configure the:

    4. Server Address

    5. Server Port

    6. Select Use TLS

    7. Configure Identify, Facility, and Severity and then select OK >> Apply.'
  checks:
  - type: manual_review
    info: 'Check the Forescout logs periodically to ensure proper auditing functions are still

      enabled and have not been changed. A proper security policy performs periodic checks

      to help ensure the proper information is being gathered in the event of a security

      breach, or internal/external threat.

      If the Forescout auditing functions are disabled or have been changed, this is a finding.'
    severity: medium
