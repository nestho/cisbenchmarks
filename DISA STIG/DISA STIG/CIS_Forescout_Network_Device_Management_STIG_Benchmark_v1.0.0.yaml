  description: 'If the network device uses role-based access control, Forescout must enforce organization-defined, role-based
    access control policies over defined subjects and objects. GROUP ID: V-230954 RULE ID: SV-230954r987662'
  rationale: 'Organizations can create specific roles based on job functions and the authorizations (i.e., privileges) to
    perform needed operations on organizational information systems associated with the organization-defined roles. When administrators
    are assigned to the organizational roles, they inherit the authorizations or privileges defined for those roles. Forescout
    has three predefined user roles: Admin, Web Access, and Console User. The Admin role has access to all data and management
    functions. By default, the Console role has access to the management console and the Web role has access to the view-only
    portal. However, both roles may be assigned one or more permissions, each with its own set of privileges to the data and
    functions.'
  impact: ''
  references: []
