controls:
- id: '1.1'
  title: FORE-NM-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Forescout must limit the number of concurrent sessions to one for each administrator account. GROUP ID: V-230930
    RULE ID: SV-230930r960735'
  rationale: Device management includes the ability to control the number of administrators and management sessions that manage
    a device. Limiting the number of allowed administrators and sessions per administrator based on account type, role, or
    access type is helpful in limiting risks related to denial of service (DoS) attacks. This requirement addresses concurrent
    sessions for administrative accounts and does not address concurrent sessions by a single administrator via multiple administrative
    accounts. The maximum number of concurrent sessions must be defined based upon mission needs and the operational environment
    for each system. At a minimum, limits must be set for SSH, HTTPS, account of last resort, and root account sessions.
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'Determine if Forescout requires a limit of one session per user. This requirement may

    be verified by demonstration or configuration review.

    1. Log on to the Forescout Administrator UI.

    2. From the menu, select Tools >> Options >> CounterAct user profiles >>

    Password and Sessions >> Session.

    3. Verify the "allow only one login session per user", "Terminate existing session

    upon new login", and "Console and web portal sessions cannot exist

    concurrently".

    If Forescout does not enforce one session per user, this is a finding.'
  remediation: 'Configure Forescout to require a limit of one session per user.

    1. Log on to the Forescout Administrator UI.

    2. From the menu, select Tools >> Options >> CounterAct user profiles >>

    Password and Sessions >> Session.

    3. Check "allow only one login session per user".

    4. Select the "Terminate existing session upon new login" radio button.

    5. Select "Console and web portal sessions cannot exist concurrently".'
  checks:
  - type: manual_review
    info: 'Determine if Forescout requires a limit of one session per user. This requirement may

      be verified by demonstration or configuration review.

      1. Log on to the Forescout Administrator UI.

      2. From the menu, select Tools >> Options >> CounterAct user profiles >>

      Password and Sessions >> Session.

      3. Verify the "allow only one login session per user", "Terminate existing session

      upon new login", and "Console and web portal sessions cannot exist

      concurrently".

      If Forescout does not enforce one session p'
    severity: medium
- id: '1.2'
  title: FORE-NM-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Forescout must terminate the account of last resort password when members with access to the password leave
    the group. GROUP ID: V-230931 RULE ID: SV-230931r1018751'
  rationale: A shared/group account credential is a shared form of authentication that allows multiple individuals to access
    the network device using a single account. If shared/group account credentials are not terminated when individuals leave
    the group, the user that left the group can still gain access even though they are no longer authorized. There may also
    be instances when specific user actions need to be performed on the network device without unique administrator identification
    or authentication. Examples of credentials include passwords and group membership certificates.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'Review the documentation to verify a procedure exists to change the account of last

    resort and root account password when users with knowledge of the password leave

    the group.

    If a procedure does not exist to change the account of last resort and root account

    password when users with knowledge of the password leave the group, this is a finding.'
  remediation: 'Establish and document a procedure that requires the changing of the account of last

    resort and root account password when users with knowledge of the password leave

    the group.

    To change the password:

    1. Log on to the Forescout Administrator UI.

    2. From the menu, select Tools >> Options >> Console Preferences >> Password

    and Sessions.

    3. Click the Password tab.

    4. Click "User must change password at next logon if changed by admin user".

    5. Note: the next time the account of last resort is accessed, the user will be

    prompted to change their password.

    Note: Use of a cryptographically generated password is recommended. Password must

    be stored in a locked safe and used only when necessary since individual accounts are

    required to be used to ensure non-repudiation.'
  checks:
  - type: manual_review
    info: 'Review the documentation to verify a procedure exists to change the account of last

      resort and root account password when users with knowledge of the password leave

      the group.

      If a procedure does not exist to change the account of last resort and root account

      password when users with knowledge of the password leave the group, this is a finding.'
    severity: medium
- id: '1.3'
  title: FORE-NM-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Forescout must be configured with only one web account and one CLI account of last resort with limited access
    and used only when the authentication server is unavailable. GROUP ID: V-230932 RULE ID: SV-230932r1111863'
  rationale: Authentication for administrative (privileged-level) access to the device is required at all times. An account
    can be created on the device's local database for use when the authentication server is down or connectivity between the
    device and the authentication server is not operable. This account is referred to as the "account of last resort" since
    it is intended to be used as a last resort and when immediate administrative access is absolutely necessary. The account
    of last resort logon credentials must be stored in a sealed envelope and kept in a safe. The safe must be periodically
    audited to verify the envelope remains sealed. The signature of the auditor and the date of the audit must be added to
    the envelope as a record. Administrators must secure the credentials and disable the root account (if possible) when not
    needed for system administration functions.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Verify only one local account exists and that it has full administrator privileges.

    1. Log on to the Forescout Administrator UI.

    2. From the menu, select Tools >> Options >> CounterACT User Profiles.

    If local accounts in the CounterACT User profile or CLI exist other than the accounts of

    last resort, this is a finding.'
  remediation: 'There are two default accounts of last resort. The CLIAdmin root account can only be

    used to access Forescout with the CLI. Accounts created in CounterACT user profile in

    the management console do not have access to login to the CLI. The default console

    account "Admin" allows access only to the management console. These accounts can

    be used as the accounts of last resort or two other accounts may be created for this

    purpose as long as a strong password that meets DoD requirements is used for both.

    1. Log on to the Forescout Administrator UI.

    2. From the menu, select Tools >> Options >> CounterACT user profiles.

    Remove unauthorized local accounts not identified as the account of last resort.'
  checks:
  - type: manual_review
    info: 'Verify only one local account exists and that it has full administrator privileges.

      1. Log on to the Forescout Administrator UI.

      2. From the menu, select Tools >> Options >> CounterACT User Profiles.

      If local accounts in the CounterACT User profile or CLI exist other than the accounts of

      last resort, this is a finding.'
    severity: medium
- id: '1.4'
  title: FORE-NM-000040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Forescout must be configured to enforce the limit of three consecutive invalid logon attempts, after which
    time it must lock out the user account from accessing the device for 15 minutes. GROUP ID: V-230933 RULE ID: SV-230933r960840'
  rationale: By limiting the number of failed login attempts, the risk of unauthorized system access via user password guessing,
    otherwise known as brute-forcing, is reduced.
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'Determine if Forescout is configured either to enforce the limit of three consecutive

    invalid logon attempts by a user during a 15-minute time period, or to use an

    authentication server to perform this function.

    1. Log on to the Forescout Administrator UI.

    2. From the menu, select Tools >> Options >> CounterACT User Profiles >>

    Password and Sessions.

    3. Verify the "Lock account after" radio button is selected.

    4. Verify that "3" password failures for "15 minutes" is configured.

    If the limit of three consecutive invalid logon attempts by a user during a 15-minute time

    period is not enforced, this is a finding.'
  remediation: 'Configure Forescout or its associated authentication server to enforce the limit of three

    consecutive invalid logon attempts by a user during a 15-minute time period.

    1. Log on to the Forescout Administrator UI.

    2. From the menu, select Tools >> Options >> CounterACT User Profiles >>

    Password and Sessions.

    3. Ensure the "Lock account after" radio button is selected.

    4. Ensure that "3" password failures for "15" minutes is configured.'
  checks:
  - type: manual_review
    info: 'Determine if Forescout is configured either to enforce the limit of three consecutive

      invalid logon attempts by a user during a 15-minute time period, or to use an

      authentication server to perform this function.

      1. Log on to the Forescout Administrator UI.

      2. From the menu, select Tools >> Options >> CounterACT User Profiles >>

      Password and Sessions.

      3. Verify the "Lock account after" radio button is selected.

      4. Verify that "3" password failures for "15 minutes" is configured.

      If the limit of t'
    severity: medium
- id: '1.5'
  title: FORE-NM-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Forescout must display the Standard Mandatory DoD Notice and Consent Banner before granting access to the
    device. GROUP ID: V-230934 RULE ID: SV-230934r960843'
  rationale: Display of the DoD-approved use notification before granting access to the application ensures privacy and security
    notification verbiage used is consistent with applicable federal laws, Executive Orders, directives, policies, regulations,
    standards, and guidance. System use notifications are required only for access via logon interfaces with human users.
    The banner must be formatted in accordance with DTM-08-060.
  impact: ''
  references: []
  page_start: 19
  audit_raw: '1. Log on to the Forescout Administrator UI.

    2. Select Tools >> Options >> CounterACT User Profiles >> Password and

    Sessions.

    3. Select the Login tab and check the "Display this Notice and Consent Message

    after login" option.

    4. Select the "Before login, prompt user to accept these Terms and Conditions" and

    view the text.

    If the banner is not present or not in exact compliance with the current verbiage and

    spacing in DTM-08-060, this is a finding.'
  remediation: 'Log on to the Forescout Administrator UI.

    1. Select Tools >> Options >> CounterACT User Profiles >> Password and

    Sessions.

    2. Select the "Login" tab and check the "Display this Notice and Consent Message

    after login" option.

    3. Select the "Before login, prompt user to accept these Terms and Conditions".

    4. Copy the exact text and formatting for the Standard Mandatory DoD and Consent

    Banner into the white box. Be sure to adhere to the exact line spacing required

    by DTM-08-060.'
  checks:
  - type: manual_review
    info: '1. Log on to the Forescout Administrator UI.

      2. Select Tools >> Options >> CounterACT User Profiles >> Password and

      Sessions.

      3. Select the Login tab and check the "Display this Notice and Consent Message

      after login" option.

      4. Select the "Before login, prompt user to accept these Terms and Conditions" and

      view the text.

      If the banner is not present or not in exact compliance with the current verbiage and

      spacing in DTM-08-060, this is a finding.'
    severity: medium
- id: '1.6'
  title: FORE-NM-000080
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Forescout must generate log records when successful attempts to access privileges occur. GROUP ID: V-230936
    RULE ID: SV-230936r960885'
  rationale: Without generating log records specific to the security and mission needs of the organization, it would be difficult
    to establish, correlate, and investigate the events relating to an incident or identify those responsible for one. Log
    records can be generated from various components within the information system (e.g., module or policy filter).
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Verify the syslog trigger is configured.

    1. Log on to Forescout Administrator UI with admin or operator credentials.

    2. From the menu, select Tools >> Options >> Modules >> Syslog >> Syslog

    Triggers.

    3. Under "User Operations", verify "Include user operations" is checked.

    If Forescout does not generate log records when successful attempts to access

    privileges occur, this is a finding.'
  remediation: 'Configure the syslog trigger.

    1. Log on to Forescout Administrator UI with admin or operator credentials.

    2. From the menu, select Tools >> Options >> Modules >> Syslog >> Syslog

    Triggers.

    3. Under "User Operations", check "Include user operations".'
  checks:
  - type: manual_review
    info: 'Verify the syslog trigger is configured.

      1. Log on to Forescout Administrator UI with admin or operator credentials.

      2. From the menu, select Tools >> Options >> Modules >> Syslog >> Syslog

      Triggers.

      3. Under "User Operations", verify "Include user operations" is checked.

      If Forescout does not generate log records when successful attempts to access

      privileges occur, this is a finding.'
    severity: medium
- id: '1.7'
  title: FORE-NM-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Forescout must retain the Standard Mandatory DOD Notice and Consent Banner on the screen until the administrator
    acknowledges the usage conditions and takes explicit actions to log on for further access. GROUP ID: V-230935 RULE ID:
    SV-230935r1113787'
  rationale: The banner must be acknowledged by the administrator prior to the device allowing the administrator access to
    the network device. This provides assurance that the administrator has seen the message and accepted the conditions for
    access. If the consent banner is not acknowledged by the administrator, DOD will not be in compliance with system use
    notifications required by law. To establish acceptance of the network administration policy, a click-through banner at
    management session logon is required. The device must prevent further activity until the administrator executes a positive
    action to manifest agreement. In the case of CLI access using a terminal client, entering the username and password when
    the banner is presented is considered an explicit action of acknowledgement. Entering the username, viewing the banner,
    then entering the password is also acceptable. The web management tool configuration setting works for both the CLI and
    the web management tool.
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'Verify Forescout retains the Standard Mandatory DOD-approved Notice and Consent

    Banner on the screen until users acknowledge the usage conditions and takes explicit

    actions to log on for further access.

    Attempt to log on to the Forescout device as a system administrator using the web

    management tool.

    If Forescout does not retain the Standard Mandatory DOD-approved Notice and

    Consent Banner on the screen until users acknowledge the usage conditions and take

    explicit actions to log on for further access, this is a finding.'
  remediation: 'Configure banner retention.

    1. From the UI, select Tools >> Options >> CounterACT User Profiles >> Password

    and Sessions.

    2. Select the "Login" tab and check the "Before login, prompt user to accept these

    Terms and Conditions".

    3. Select "Apply" to save the settings.'
  checks:
  - type: manual_review
    info: 'Verify Forescout retains the Standard Mandatory DOD-approved Notice and Consent

      Banner on the screen until users acknowledge the usage conditions and takes explicit

      actions to log on for further access.

      Attempt to log on to the Forescout device as a system administrator using the web

      management tool.

      If Forescout does not retain the Standard Mandatory DOD-approved Notice and

      Consent Banner on the screen until users acknowledge the usage conditions and take

      explicit actions to log on for further '
    severity: medium
