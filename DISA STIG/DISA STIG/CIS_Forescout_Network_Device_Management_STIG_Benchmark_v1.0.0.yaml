- id: '1.27'
  title: FORE-NM-000290
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Forescout must be configured to conduct backups of system-level information contained in the information system
    when changes occur. GROUP ID: V-230956 RULE ID: SV-230956r961863'
  rationale: 'System-level information includes default and customized settings and security attributes, including ACLs that
    relate to the network device configuration, as well as software required for the execution and operation of the device.
    Information system backup is a critical step in ensuring system integrity and availability. If the system fails and there
    is no backup of the system-level information, a denial-of-service condition is possible for all who utilize this critical
    network component. Perform scheduled backups of the Forescout system to FTP, SFTP, and SCP sites. Using scheduled backups
    provides extra safety and protection against hard drive failures and data loss. The system backup feature saves all CounterACT
    device and Console settings. This data includes the following: • Configuration • License • Operating System configuration
    • Plugins/Modules These categories include, for example: • Forescout platform IP address • License information • Channel
    • Email • Internal network parameters • Basic and advanced NAC Policy definitions • Legitimate traffic definitions • Report
    schedules'
  impact: ''
  references: []
  page_start: 65
  audit_raw: 'Check Forescout to determine if the network device is configured to conduct backups of

    system-level information contained in the information system when changes occur or

    weekly, whichever is sooner.

    1. Open the Forescout Console and select Tools >> Advanced >> Backup.

    2. On the “System Backup” tab, verify the "Enable System Backup" radio button is

    selected.

    3. Verify the Backup schedule is selected to at least "weekly".

    If Forescout does not support the organizational requirement to conduct backups of

    system-level data according to the defined frequency, this is a finding.'
  remediation: 'Configure Forescout to conduct backups of information system documentation,

    including security-related documentation, when changes occur or weekly, whichever is

    sooner.

    Setup a backup server.

    1. Open the Forescout Console and select Tools >> Advanced >> Backup >>

    Backup Server.

    2. Click "SCP" or "SFTP" for the transfer protocol.

    3. Add the IP address of the backup destination server.

    4. Add the directory to receive the file.

    5. Add PKI key (preferred) or add username and DoD compliant password for the

    backup account to be used.

    6. Enable "Authenticate Destination Sever".

    7. Test the file transfer.

    8. Click "Apply".

    Generate a backup job.

    1. Click the "System Backup" tab.

    2. Select "Enable System Backup".

    3. Under Backup Schedule, add a "Generate backup at" and enter a time to run the

    backup in accordance with site procedures.

    4. Select "Weekly" for Recurrence Pattern.

    When changes to the configuration occur, the admin must immediately create a new

    backup by clicking "Backup Now" on the Backup screen.'
  checks:
  - type: manual_review
    info: 'Check Forescout to determine if the network device is configured to conduct backups of

      system-level information contained in the information system when changes occur or

      weekly, whichever is sooner.

      1. Open the Forescout Console and select Tools >> Advanced >> Backup.

      2. On the “System Backup” tab, verify the "Enable System Backup" radio button is

      selected.

      3. Verify the Backup schedule is selected to at least "weekly".

      If Forescout does not support the organizational requirement to conduct back'
    severity: medium
