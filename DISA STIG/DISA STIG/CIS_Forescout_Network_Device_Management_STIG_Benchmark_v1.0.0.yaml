    Check the SSP against created users and ensure least privilege has been configured

    properly. Options include Custom accounts for Console Access and Web Access. Each

    access account is then further established with permissions based on the user''s

    authorizations.

    If Forescout does not enforce organization-defined, role-based access control policies

    over defined subjects and objects, this is a finding.'
  remediation: 'Login to Forescout UI.

    1. Select Tools >> Options >> CounterACT User Profiles.

    2. Select username >> Edit >> Permissions.

    Check the SSP against created users and ensure least privilege has been configured

    properly. Options include Custom accounts for Console Access and Web Access. Each

    access account is then further established with permissions based on the user''s

    authorizations.'
