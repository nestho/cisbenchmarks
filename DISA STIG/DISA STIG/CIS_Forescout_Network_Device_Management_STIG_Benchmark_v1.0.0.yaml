- id: '1.15'
  title: FORE-NM-000160
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Forescout must be configured to synchronize internal information system clocks using redundant authoritative
    time sources. GROUP ID: V-230944 RULE ID: SV-230944r1112438'
  rationale: 'The loss of connectivity to a particular authoritative time source will result in the loss of time synchronization
    (free-run mode) and increasingly inaccurate time stamps on audit events and other functions. Multiple time sources provide
    redundancy by including a secondary source. Time synchronization is usually a hierarchy; clients synchronize time to a
    local source while the source synchronizes time to a more accurate source. The network device must utilize an authoritative
    time server and/or be configured to use redundant authoritative time sources. This requirement is related to the comparison
    done in CCI-001891. DOD-approved solutions consist of a combination of a primary and secondary time source using a combination
    or multiple instances of the following: a time server designated for the appropriate DOD network (NIPRNet/SIPRNet); United
    States Naval Observatory (USNO) time servers; and/or the Global Positioning System (GPS). The secondary time source must
    be located in a different geographic region than the primary time source.'
  impact: ''
  references: []
  page_start: 39
  audit_raw: 'Determine if Forescout is configured to synchronize internal clocks with the

    organization''s primary and secondary NTP servers.

    Determine if Forescout is configured to synchronize internal clocks with the

    organization''s primary and secondary NTP servers.

    1. Open an SSH session and authenticate to the Forescout command line.

    2. Verify a primary and secondary NTP server has been configured with the

    command "fstool ntp test".

    Or

    1. Open the Forescout console.

    2. Navigate to General >> Time and verify "Enable sync with NTP server" is

    checked.

    If Forescout is not configured to synchronize internal information system clocks with the

    organization''s primary and secondary NTP servers, this is a finding.'
  remediation: 'Configure Forescout to synchronize internal information system clocks with the primary

    and secondary time sources located in different geographic regions using redundant

    authoritative time sources.

    1. Open an SSH session and authenticate to the Forescout command line.

    2. Configure the primary and secondary NTP servers with the command "fstool ntp

    setup ".

    or

    1. Open the Forescout console.

    2. Navigate to General >> Time.

    3. Check the box for "Enable sync with NTP server".'
