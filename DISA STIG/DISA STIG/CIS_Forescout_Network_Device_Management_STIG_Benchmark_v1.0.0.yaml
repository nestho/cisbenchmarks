- id: '1.39'
  title: FORE-NM-000430
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Forescout must use FIPS 140-2 approved algorithms for authentication to a cryptographic module. GROUP ID:
    V-230969 RULE ID: SV-230969r961050'
  rationale: Unapproved mechanisms used for authentication to the cryptographic module are not validated and therefore cannot
    be relied upon to provide confidentiality or integrity, and DoD data may be compromised. Network devices utilizing encryption
    are required to use FIPS-compliant mechanisms for authenticating to cryptographic modules. FIPS 140-2 is the current standard
    for validating that mechanisms used to access cryptographic modules utilize authentication that meets DoD requirements.
    However, authentication algorithms must configure security processes to use only FIPS-approved and NIST-recommended authentication
    algorithms.
  impact: ''
  references: []
  page_start: 92
  audit_raw: 'Log on using the CLIAdmin credentials established upon initial configuration.

    Verify FIPS mode by typing the command "fstool version".

    If Forescout does not use FIPS 140-2 approved algorithms for authentication to a

    cryptographic module, this is a finding.'
  remediation: 'To enable FIPS mode on the Forescout appliance, start by opening a secure shell to the

    CLI of the management appliance using Putty or another tool.

    Log on using the CLIAdmin credentials established upon initial configuration.

    To enable FIPS mode, type "fstool fips". At the prompt to alert the user FIPS 140-2 will

    be enabled, type "Yes" to accept.

    Note: Use of FIPS mode is not mandatory in DoD. However, it is the primary method for

    mitigation of this requirement and ensuring FIPS compliance.'
  checks:
  - type: manual_review
    info: 'Log on using the CLIAdmin credentials established upon initial configuration.

      Verify FIPS mode by typing the command "fstool version".

      If Forescout does not use FIPS 140-2 approved algorithms for authentication to a

      cryptographic module, this is a finding.'
    severity: medium
- id: '1.40'
  title: FORE-NM-000440
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Forescout must terminate all network connections associated with a device management session at the end of
    the session, or the session must be terminated after 10 minutes of inactivity except to fulfill documented and validated
    mission requirements. GROUP ID: V-230970 RULE ID: SV-230970r961068'
  rationale: Terminating an idle session within a short time period reduces the window of opportunity for unauthorized personnel
    to take control of a management session enabled on the console or console port that has been left unattended. In addition,
    quickly terminating an idle session will also free up resources committed by the managed network element. Terminating
    network connections associated with communications sessions includes, for example, de-allocating associated TCP/IP address/port
    pairs at the operating system level, or de-allocating networking assignments at the application level if multiple application
    sessions are using a single, operating system-level network connection. This does not mean that the device terminates
    all sessions or network access; it only ends the inactive session and releases the resources associated with that session.
  impact: ''
  references: []
  page_start: 94
  audit_raw: 'To verify the device is configured to terminate management sessions after 10 minutes

    of inactivity, verify the timeout value is configured.

    1. Go to the Enterprise Manager Console.

    2. From the menu, select Tools >> Options >> CounterACT User Profiles >>

    Password and Sessions.

    3. Verify the "User Inactivity Timeout" check box is selected and the associated

    setting is set to "10 minutes".

    If applicable, verify exceptions to this requirement are documented and signed.

    If Forescout does not terminate the connection associated with an Enterprise Manager

    Console at the end of the session or after 10 minutes of inactivity, this is a finding.'
  remediation: 'Forescout is inherently designed to terminate upon exit or session disconnection, thus

    this part of the requirement does not have a fix.

    To configure Forescout to terminate the connection after 10 minutes of inactivity

    perform the following steps.

    1. Go to the Enterprise Manager Console.

    2. From the menu, select Tools >> Options >> CounterACT User Profiles >>

    Password and Sessions.

    3. Ensure the "User In-activity Timeout" check box is selected and the associated

    setting is set to "10 minutes".'
  checks:
  - type: manual_review
    info: 'To verify the device is configured to terminate management sessions after 10 minutes

      of inactivity, verify the timeout value is configured.

      1. Go to the Enterprise Manager Console.

      2. From the menu, select Tools >> Options >> CounterACT User Profiles >>

      Password and Sessions.

      3. Verify the "User Inactivity Timeout" check box is selected and the associated

      setting is set to "10 minutes".

      If applicable, verify exceptions to this requirement are documented and signed.

      If Forescout does not terminat'
    severity: medium
- id: '1.41'
  title: FORE-NM-000450
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Forescout must only allow authorized administrators to view or change the device configuration, system files,
    and other files stored either in the device or on removable media (such as a flash drive). GROUP ID: V-230971 RULE ID:
    SV-230971r961128'
  rationale: This requirement addresses the confidentiality and integrity of system information at rest (e.g., network device
    rule sets) when it is located on a storage device within the network device or as a component of the network device. This
    protection is required to prevent unauthorized alteration, corruption, or disclosure of information when not stored directly
    on the network device. Files on the network device or on removable media used by the device must have their permissions
    set to allow read or write access to those accounts specifically authorized to access or change them. Note that different
    administrative accounts or roles will have varying levels of access. File permissions must be set so that only authorized
    administrators can read or change their contents. Whenever files are written to removable media and the media removed
    from the device, the media must be handled appropriately for the classification and sensitivity of the data stored on
    the device.
  impact: ''
  references: []
  page_start: 96
  audit_raw: 'List the contents of Forescout’s local storage, including any drives supporting

    removable media (such as flash drives), and check the file permissions of all files on

    those drives.

    1. Review accounts with incorrect update privileges to Forescout appliance

    configuration by selecting Tools >> Options >> CounterACT User Profiles.

    2. Select a user to edit.

    3. Select the "Permissions" tab.

    4. Verify the "CounterAct Appliance Configuration" and "CounterACT Appliance

    Control" radio buttons are set to "View only".

    If any files allow read or write access by accounts not specifically authorized access or

    access using non-privileged accounts, this is a finding.'
  remediation: 'Review the SSP or other documentation for a list of user accounts and privileges. Set

    the file permissions on files on Forescout or on removable media used by the device so

    that only authorized administrators can read or change their contents. This is completed

    by limiting access to SUDO accounts and command line admin accounts.

    1. Review accounts with incorrect update privileges to Forescout appliance

    configuration by selecting Tools >> Options >> CounterACT User Profiles.

    2. Select a user to edit.

    3. Select the "Permissions" tab.

    4. Ensure the "CounterACT Appliance Configuration" and "CounterACT Appliance

    Control" radio buttons are set to "View only".'
  checks:
  - type: manual_review
    info: 'List the contents of Forescout’s local storage, including any drives supporting

      removable media (such as flash drives), and check the file permissions of all files on

