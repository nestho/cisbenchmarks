  description: 'Forescout must be configured to use an authentication server for the purpose of authenticating users prior
    to granting administrative access. GROUP ID: V-230952 RULE ID: SV-230952r1111877'
  rationale: Centralized management of authentication settings increases the security of remote and nonlocal access methods.
    This control is particularly important protection against the insider threat. With robust centralized management, log
