- id: '1.20'
  title: FORE-NM-000220
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Forescout must prevent the installation of patches, service packs, plug-ins, or modules without verification
    the update has been digitally signed using a certificate that is recognized and approved by the organization. GROUP ID:
    V-230949 RULE ID: SV-230949r1018755'
  rationale: Changes to any software components can have significant effects on the overall security of the network device.
    Verifying software components have been digitally signed using a certificate that is recognized and approved by the organization
    ensures the software has not been tampered with and has been provided by a trusted vendor. Accordingly, patches, service
    packs, or application components must be signed with a certificate recognized and approved by the organization. Verifying
    the authenticity of the software prior to installation validates the integrity of the patch or upgrade received from a
    vendor. This ensures the software has not been tampered with and has been provided by a trusted vendor. Self-signed certificates
    are disallowed by this requirement. The device should not have to verify the software again. This requirement does not
    mandate DOD certificates for this purpose; however, the certificate used to verify the software must be from an approved
    Certificate Authority (CA). Customer portal updates file download section on the vendor website has the MD5 hashes for
    the updates files. Currently, this is the method used by DOD to pull down files rather than using the internal connection
    to the Forescout server.
  impact: ''
  references: []
  page_start: 50
  audit_raw: 'Verify by inspecting the SSP or documentation to determine if there is a procedure for

    validating the MD5 hash against the Forescout updates.forescout.com portal to ensure

    that the software has come from the Forescout server.

    If the site does not have a documented process to prevent the installation of patches,

    service packs, or application components without verification the software component

    has been digitally signed using a certificate recognized and approved by the

    organization, this is a finding.'
  remediation: 'When Forescout updates are downloaded, whether from the DOD update server or the

    updates.forescout.com portal, each update consists of an MD5 hash. Manually inspect,

    compare, and verify the MD5 hash against the Forescout website to ensure that the

    software has come from the Forescout server.'
  checks:
