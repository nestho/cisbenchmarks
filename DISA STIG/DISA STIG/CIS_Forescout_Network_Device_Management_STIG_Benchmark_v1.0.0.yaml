- id: '1.14'
  title: FORE-NM-000150
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Forescout must configure a remote syslog where audit records are stored on a centralized logging target
    that is different from the system being audited. GROUP ID: V-230943 RULE ID: SV-230943r1111869'
  rationale: Information stored in one location is vulnerable to accidental or incidental deletion or alteration. Off-loading
    is a common process in information systems with limited audit storage capacity.
  impact: ''
  references: []
  page_start: 37
  audit_raw: 'Verify the syslog.

    1. Log on to Forescout Administrator UI with admin or operator credentials.

    2. From the menu, select Tools >> Options >> Modules >> Syslog >> Send Events

    To.

    3. Click the IP address of the site''s centralized syslog server.

    4. Verify Identity, Facility, and Severity, as required by the SSP, are configured.

    If the site''s syslog server is not configured, this is a finding.'
  remediation: 'Configure the syslog.

    1. Log on to Forescout Administrator UI with admin or operator credentials.

    2. From the menu, select Tools >> Options >> Modules >> Syslog >> Send Events

    To.

    3. Click "Add".

    4. Enter the IP address of the site''s centralized syslog.

    5. Configure Identity, Facility, and Severity as required by the SSP.'
  checks:
  - type: manual_review
    info: 'Verify the syslog.

      1. Log on to Forescout Administrator UI with admin or operator credentials.

