  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Forescout must disable the Request Customer Verification setting. GROUP ID: V-230960 RULE ID: SV-230960r1043177'
  rationale: To prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized tunneling
    (i.e., embedding of data types within data types), organizations must disable unused or unnecessary physical and logical
    ports/protocols on information systems. This option connects to a user verification server at Forescout infrastructure
    used for verification of customer profiles and must not be used in DoD. If accidentally checked, this must error out.
  impact: ''
