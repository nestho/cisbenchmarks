  title: FORE-NM-000320
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Forescout must obtain its public key certificates from an appropriate certificate policy through an approved
    service provider. GROUP ID: V-230958 RULE ID: SV-230958r1113789'
  rationale: For user certificates, each organization obtains certificates from an approved shared service provider, as required
    by OMB policy. For federal agencies operating a legacy public key infrastructure cross-certified with the Federal Bridge
    Certification Authority at medium assurance or higher, this Certification Authority will suffice.
  impact: ''
  references: []
  page_start: 71
  audit_raw: 'Determine if Forescout obtains public key certificates from an appropriate certificate

    policy through an approved service provider.

    To review the Web server certificate presented for captive portal/authentication:

    1. Log into the Forescout management console.

    2. Go to Options >> Certificates >> System Certificates.

    3. Locate the certificates where the "Used For" column shows "Web Portal".

    4. Ensure all enabled certificates are issued by a trusted CA and are not selfsigned.

    If the ForeScout does not obtain its public key certificates from an appropriate certificate

    policy through an approved service provider, this is a finding.'
  remediation: 'Generate a certificate signing request by completing the following procedures:

    1. Navigate to Tools >> Options >> Certificates >> System Certificates.

    2. On the right of the screen click "Generate CSR".

    3. Complete the following fields (bolded fields are necessary for the Common

    Criteria evaluation and underlined fields have the required selection made):

    • Common Name –

    • Organization –

    • Organizational Unit –

    • Locality –

    • State –

    • Country Code –

    • Email Address -

    • Key Length –

    • Signature Algorithm –

    • Key Usages – < Checking all items that apply Client Authentication, Server

    Authentication and Email Signing>

    • Validity –

    4. Click "Next".

    5. When the CSR is generated, scroll down to ensure the public key and common

    name are present.

    6. Click "Scope option – ALL", and then click "Next".

    7. Enter a name for system certificate.

    8. Check "Enable presenting this certificate".

    9. Click "Finish".

    10. Click "Apply", and then click "Yes" to save the changes.'
  checks:
  - type: manual_review
    info: 'Determine if Forescout obtains public key certificates from an appropriate certificate

