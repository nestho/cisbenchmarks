- id: '1.34'
  title: CACI-RT-000034
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Cisco ACI must be configured to enable the Generalized TTL Security Mechanism (GTSM) for BGP sessions. GROUP
    ID: V-272094 RULE ID: SV-272094r1114284'
  rationale: GTSM is designed to protect a router's IP-based control plane from denial-of-service (DoS) attacks. Many attacks
    focused on CPU load and line-card overload can be prevented by implementing GTSM on all Exterior Border Gateway Protocol
    speaking routers. GTSM is based on the fact that the vast majority of control plane peering is established between adjacent
    routers, that is, the Exterior Border Gateway Protocol peers are either between connecting interfaces or between loopback
    interfaces. Since TTL spoofing is considered nearly impossible, a mechanism based on an expected TTL value provides a
    simple and reasonably robust defense from infrastructure attacks based on forged control plane traffic.
  impact: ''
  references: []
  page_start: 75
  audit_raw: 'Review the BGP configuration to verify that TTL security has been configured for each

    external neighbor as shown in the example below:

    policy BGP_Peer_Profile

    no neighbor 10.1.1.1 ebgp-multihop

    neighbor 10.1.1.1 ttl-security

    If the Cisco ACI is not configured to use GTSM for all Exterior BGP peering sessions,

    this is a finding.'
  remediation: 'Configure TTL security on all external BGP neighbors as shown in the example below:

    1. Access the BGP Peer Connectivity Profile.

    policy BGP_Peer_Profile

    2. Disable Multihop for external neighbor.

    no neighbor 10.1.1.1 ebgp-multihop

    3. Enable TTL security on the neighbor.

    neighbor 10.1.1.1 ttl-security'
  checks:
  - type: manual_review
    info: 'Review the BGP configuration to verify that TTL security has been configured for each

      external neighbor as shown in the example below:

      policy BGP_Peer_Profile

      no neighbor 10.1.1.1 ebgp-multihop

      neighbor 10.1.1.1 ttl-security

      If the Cisco ACI is not configured to use GTSM for all Exterior BGP peering sessions,

      this is a finding.'
    severity: medium
- id: '1.35'
  title: CACI-RT-000035
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco ACI multicast must be configured to filter the Internet Group Management Protocol (IGMP) and Multicast
    Listener Discovery (MLD) Report messages to allow hosts to join only multicast groups that have been approved by the organization.
    GROUP ID: V-272095 RULE ID: SV-272095r1115727'
  rationale: Real-time multicast traffic can entail multiple large flows of data. Large unicast flows tend to be fairly isolated
    (i.e., someone doing a file download here or there), whereas multicast can have broader impact on bandwidth consumption,
    resulting in extreme network congestion. Hence, it is imperative that there is multicast admission control to restrict
    which multicast groups hosts are allowed to join via IGMP or MLD.
  impact: ''
  references: []
  page_start: 77
  audit_raw: 'This requirement is only applicable to Source Specific Multicast (SSM) implementation.

    This requirement is not applicable to Any Source Multicast (ASM) since the filtering is

    being performed by the rendezvous point switch.

    Review the configuration of the designated router (DR) to verify that it is filtering IGMP

    or MLD Membership Report messages, allowing hosts to join only those groups that

    have been approved.

    If the Cisco ACI is not filtering IGMP or MLD Membership Report messages, this is a

    finding.'
  remediation: 'Configure "IGMP Snooping" and create access groups that define which multicast

    groups are permitted on specific ports. For filtering IPv6 multicast traffic (MLD), use

    similar commands with the "mld" keyword instead of "igmp".

    1. Navigate to the relevant bridge domain, interface or VLAN and enable IGMP

    snooping using the command.

    apic(config)# interface <interface_name>

    apic (config-if)# ip igmp snooping

    or

    apic(config)# bd BD-1

    apic(config-bd-1)# ip igmp snooping

    2. Define a new access group with a name and specify the permitted multicast

    groups.

    apic(config)# ip igmp snooping vlan <vlan_id> access-group

    <access_group_name>

    apic(config)# access-group <access_group_name>

    apic(config)# permit ip multicast <multicast_group_address>

    3. Navigate to the specific port configuration where the filter is to be applied.

    apic(config)# ip igmp snooping access-group <group-name> to associate the

    created access group with the port.

    apic(config)# interface Ethernet1/1

    apic(config-if)# ip igmp snooping access-group allowed-groups'
  checks:
  - type: manual_review
    info: 'This requirement is only applicable to Source Specific Multicast (SSM) implementation.

      This requirement is not applicable to Any Source Multicast (ASM) since the filtering is

      being performed by the rendezvous point switch.

      Review the configuration of the designated router (DR) to verify that it is filtering IGMP

      or MLD Membership Report messages, allowing hosts to join only those groups that

      have been approved.

      If the Cisco ACI is not filtering IGMP or MLD Membership Report messages, this is a

      f'
    severity: medium
