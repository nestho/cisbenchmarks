- id: '1.23'
  title: CACI-RT-000023
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The BGP Cisco ACI must be configured to use a unique key for each autonomous system (AS) it peers with. GROUP
    ID: V-272083 RULE ID: SV-272083r1114278'
  rationale: If the same keys are used between eBGP neighbors, the chance of a hacker compromising any of the BGP sessions
    increases. It is possible that a malicious user exists in one autonomous system who would know the key used for the eBGP
    session. This user would then be able to hijack BGP sessions with other trusted neighbors.
  impact: ''
  references: []
  page_start: 56
  audit_raw: "Review the configuration. Verify the neighbor authentication keys on ACI border leaf\nswitches use a different\
    \ authentication key for each AS peer. Route maps can also\nshow this view.\nip tcp authentication key chain AS100\n key\
    \ 1 send-id 10 recv-id 10\n key 2 send-id 20 recv-id 20\nip tcp authentication key chain AS200\n key 1 send-id 30 recv-id\
    \ 30\n key 2 send-id 40 recv-id 40\nrouter bgp 100\n neighbor 10.0.0.1 ao AS100\nrouter bgp 200\n neighbor 10.0.1.1 ao\
    \ AS200\nIf unique keys are not being used, this is a finding."
  remediation: 'Configure unique keys for each AS peered by a Cisco ACI device using TCP-AO by

    creating separate key chains for each AS, ensuring each key chain contains unique

    "send-id" and "recv-id" values for the keys within it, and then associating the appropriate

    key chain with the BGP neighbor configuration for that specific AS. The following is an

    example:

    1. Create key chain for AS100.

    apic1(config)# ip tcp authentication key chain AS100

    apic1(config)# key 1 send-id 10 recv-id 10

    apic1(config)# key 2 send-id 20 recv-id 20

    2. Create key chain for AS 200.

    apic1(config)#ip tcp authentication key chain AS200

    apic1(config)# key 1 send-id 30 recv-id 30

    apic1(config)# key 2 send-id 40 recv-id 40

    3. Configure BGP neighbor with AS100 using key chain AS100.

    apic1(config)# router bgp 100

    apic1(config-router)# neighbor 10.0.0.1 ao AS100

    4. Configure BGP neighbor with AS 200 using key chain AS200.

    apic1(config)# router bgp 200

    apic1(config-router)# neighbor 10.0.1.1 ao AS200'
  checks:
  - type: sql
    command: show this view.
    severity: medium
    info: "Review the configuration. Verify the neighbor authentication keys on ACI border leaf\nswitches use a different\
      \ authentication key for each AS peer. Route maps can also\nshow this view.\nip tcp authentication key chain AS100\n\
      \ key 1 send-id 10 recv-id 10\n key 2 send-id 20 recv-id 20\nip tcp authentication key chain AS200\n key 1 send-id 30\
      \ recv-id 30\n key 2 send-id 40 recv-id 40\nrouter bgp 100\n neighbor "
- id: '1.24'
  title: CACI-RT-000024
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco ACI must be configured to use keys with a duration of 180 days or less for authenticating routing
    protocol messages. GROUP ID: V-272084 RULE ID: SV-272084r1114357'
  rationale: If the keys used for routing protocol authentication are guessed, the malicious user could create havoc within
    the network by advertising incorrect routes and redirecting traffic. Some routing protocols allow the use of key chains
    for authentication. A key chain is a set of keys that is used in succession, with each having a lifetime of no more than
    180 days. Changing the keys frequently reduces the risk of them eventually being guessed. Keys cannot be used during time
    periods for which they are not activated. If a time period occurs during which no key is activated, neighbor authentication
    cannot occur, and therefore, routing updates will fail. Therefore, ensure that for a given key chain, key activation times
    overlap to avoid any period of time during which no key is activated.
  impact: ''
  references: []
  page_start: 58
  audit_raw: "If any key has a lifetime of more than 180 days (expressed in seconds), this is a finding.\nReview the switch\
    \ configuration using the show bgp and show ospf commands to view\nBGP and OSPF. The configuration will be similar to\
    \ the example below.\nKey-Chain bgp_keys tcp\n Key 1 -- text 0 \"070e234f\"\n send lifetime 3600\n recv-lifetime 3600\n\
    If any key has a lifetime of 180 days or less, this is a finding."
  remediation: 'For each authenticated routing protocol session, configure each key to have a lifetime of

    no more than 180 days. The following is an example.

    Add the lifetime duration value to every TCP-AO Key ID configured.

    apic1(config)# ip tcp ao key chain <KEY_CHAIN_NAME>

    apic1(config)# key <KEY-ID>

    apic1(config-tcpkey chain-tcpkey)# send-lifetime <value in seconds>

    apic1(config-tcpkey chain-tcpkey)# recv-lifetime <value in seconds>'
  checks:
  - type: sql
    command: show bgp and show ospf commands to view
    severity: medium
    info: "If any key has a lifetime of more than 180 days (expressed in seconds), this is a finding.\nReview the switch configuration\
      \ using the show bgp and show ospf commands to view\nBGP and OSPF. The configuration will be similar to the example\
      \ below.\nKey-Chain bgp_keys tcp\n Key 1 -- text 0 \"070e234f\"\n send lifetime 3600\n recv-lifetime 3600\nIf any key\
      \ has a lifetime of 180 days or less, this is a finding."
- id: '1.25'
  title: CACI-RT-000025
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Multicast Source Discovery Protocol (MSDP) Cisco ACI must be configured to authenticate all received MSDP
    packets. GROUP ID: V-272085 RULE ID: SV-272085r1114092'
  rationale: MSDP peering with customer network routers presents additional risks to the core, whether from a rogue or misconfigured
    MSDP-enabled router. MSDP password authentication is used to validate each segment sent on the TCP connection between
    MSDP peers, protecting the MSDP session against the threat of spoofed packets being injected into the TCP connection stream.
  impact: ''
  references: []
  page_start: 60
  audit_raw: 'Review the Management Access configuration to determine if received MSDP packets

    are authenticated:

    1. Navigate to Fabric >> Fabric Policies >> Policies >> Pod >> Management

    Access.

    2. Verify the option for "Strict Security on APIC OOB Subnet" is selected.

    If the router does not require MSDP authentication, this is a finding.'
  remediation: 'Enable the "Strict Security on APIC OOB Subnet" option within the Management

    Access settings on the APIC:

    1. On the APIC GUI, navigate to Fabric >> Fabric Policies >> Policies >> Pod >>

    Management Access to find the relevant settings.

    2. Select "Strict Security on APIC OOB Subnet".'
  checks:
  - type: manual_review
    info: 'Review the Management Access configuration to determine if received MSDP packets

      are authenticated:

      1. Navigate to Fabric >> Fabric Policies >> Policies >> Pod >> Management

