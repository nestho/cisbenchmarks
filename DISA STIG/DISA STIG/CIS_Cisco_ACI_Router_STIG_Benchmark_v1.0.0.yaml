    severity: medium
- id: '1.43'
  title: CACI-RT-000043
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco ACI must establish organization-defined alternate communication paths for system operations organizational
    command and control. GROUP ID: V-272103 RULE ID: SV-272103r1114294'
  rationale: An incident, whether adversarial- or nonadversarial-based, can disrupt established communication paths used for
    system operations and organizational command and control. Alternate communication paths reduce the risk of all communications
    paths being affected by the same incident. To compound the problem, the inability of organizational officials to obtain
    timely information about disruptions or to provide timely direction to operational elements after a communication path
    incident, can impact the ability of the organization to respond to such incidents in a timely manner. Establishing alternate
    communication paths for command and control purposes, including designating alternative decision makers if primary decision
    makers are unavailable and establishing the extent and limitations of their actions, can greatly facilitate the organization's
    ability to continue to operate and take appropriate actions during an incident.
  impact: ''
  references: []
  page_start: 93
  audit_raw: 'Review the SSP and the ACI configuration to verify logical separation using EPGs,

    bridge domains, and/or tenants is configured. The following is an example of an EPG:

