- id: '1.44'
  title: CACI-RT-000044
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco ACI must be configured to protect against or limit the effects of denial-ofservice (DoS) attacks
    by employing control plane protection. GROUP ID: V-272104 RULE ID: SV-272104r1114297'
  rationale: The route processor (RP) is critical to all network operations because it is the component used to build all
    forwarding paths for the data plane via control plane processes. It is also instrumental in ongoing network management
    functions that keep the routers and links available for providing network services. Any disruption to the RP or the control
    and management planes can result in mission-critical network outages. A DoS attack targeting the RP can result in excessive
    CPU and memory utilization. To maintain network stability and RP security, the router must be able to handle specific
    control plane and management plane traffic destined to the RP. In the past, one method of filtering was to use ingress
    filters on forwarding interfaces to filter both forwarding path and receiving path traffic. However, this method does
    not scale well as the number of interfaces grows and the size of the ingress filters grows. Control plane policing increases
    the security of routers and multilayer switches by protecting the RP from unnecessary or malicious traffic. Filtering
    and rate limiting the traffic flow of control plane packets can be implemented to protect routers against reconnaissance
    and DoS attacks, allowing the control plane to maintain packet forwarding and protocol states despite an attack or heavy
    load on the router or multilayer switch.
  impact: ''
  references: []
  page_start: 95
  audit_raw: "Review the configuration to verify Cisco ACI is configured to employ control plane\nprotection.\n1. Verify traffic\
    \ types have been classified based on importance levels. The\nfollowing is an example configuration:\nclass-map match-all\
    \ CoPP_CRITICAL\nmatch access-group name CoPP_CRITICAL\nclass-map match-any CoPP_IMPORTANT\nmatch access-group name CoPP_IMPORTANT\n\
    match protocol arp\nclass-map match-all CoPP_NORMAL\nmatch access-group name CoPP_NORMAL\nclass-map match-any CoPP_UNDESIRABLE\n\
    match access-group name CoPP_UNDESIRABLE\nclass-map match-all CoPP_DEFAULT\nmatch access-group name CoPP_DEFAULT\n2. Review\
    \ the Access Control Lists (ACLs) referenced by the class maps to\ndetermine if the traffic is being classified appropriately.\
    \ The following is an\nexample configuration:\nip access-list extended CoPP_CRITICAL\nremark our control plane adjacencies\
    \ are critical\npermit ospf host [OSPF neighbor A] any\npermit ospf host [OSPF neighbor B] any\npermit pim host [PIM neighbor\
    \ A] any\npermit pim host [PIM neighbor B] any\npermit pim host [RP addr] any\npermit igmp any 224.0.0.0 15.255.255.255\n\
    permit tcp host [BGP neighbor] eq bgp host [local BGP addr]\npermit tcp host [BGP neighbor] host [local BGP addr] eq bgp\n\
    deny ip any any\nip access-list extended CoPP_IMPORTANT\npermit tcp host [TACACS server] eq tacacs any\npermit tcp [management\
    \ subnet] 0.0.0.255 any eq 22\npermit udp host [SNMP manager] any eq snmp\npermit udp host [NTP server] eq ntp any\ndeny\
    \ ip any any\nip access-list extended CoPP_NORMAL\nremark we will want to rate limit ICMP traffic\ndeny icmp any host\
    \ x.x.x.x fragments\npermit icmp any any echo\npermit icmp any any echo-reply\npermit icmp any any time-exceeded\npermit\
    \ icmp any any unreachable\ndeny ip any any\nip access-list extended CoPP_UNDESIRABLE\nremark other management plane traffic\
    \ that should not be received\npermit udp any any eq ntp\npermit udp any any eq snmp\npermit tcp any any eq 22\npermit\
    \ tcp any any eq 23\nremark other control plane traffic not configured on router\npermit eigrp any any\npermit udp any\
    \ any eq rip\ndeny ip any any\nip access-list extended CoPP_DEFAULT\npermit ip any any\nNote: Explicitly defining undesirable\
    \ traffic with ACL entries enables the network\noperator to collect statistics. Excessive ARP packets can potentially\
    \ monopolize route\nprocessor resources, starving other important processes. Currently, ARP is the only\nlayer 2 protocol\
    \ that can be specifically classified using the match protocol command.\n3. Review the policy-map to determine if the\
    \ traffic is being policed appropriately for\neach classification. The following is an example configuration:\npolicy-map\
    \ CONTROL_PLANE_POLICY\nclass CoPP_CRITICAL\npolice 512000 8000 conform-action transmit exceed-action transmit\nclass\
    \ CoPP_IMPORTANT\npolice 256000 4000 conform-action transmit exceed-action drop\nclass CoPP_NORMAL\npolice 128000 2000\
    \ conform-action transmit exceed-action drop\nclass CoPP_UNDESIRABLE\npolice 8000 1000 conform-action drop exceed-action\
    \ drop\nclass CoPP_DEFAULT\npolice 64000 1000 conform-action transmit exceed-action drop\n4. Verify that the CoPP policy\
    \ is enabled. The following is an example configuration:\n(config)# leaf 101\n (config-leaf)# int eth 1/10\n (config-leaf-if)#\
    \ service-policy type control-plane-if\nNote: Control Plane Protection (CPPr) can be used to filter as well as police\
    \ control\nplane traffic destined to the RP. CPPr is very similar to CoPP and has the ability to filter\nand police traffic\
    \ using finer granularity by dividing the aggregate control plane into\nthree separate categories: (1) host, (2) transit,\
    \ and (3) CEF-exception. Hence, a\nseparate policy-map could be configured for each traffic category.\nIf the Cisco router\
    \ is not configured to protect against known types of DoS attacks by\nemploying organization-defined security safeguards,\
    \ this is a finding."
  remediation: "Protect against known types of DoS attacks on the route processor. Implementing a\nCoPP policy, as shown in\
    \ the example below, is a best practice method:\n1. Configure the ACL's specific traffic types.\nApic1(config)#ip access-list\
    \ extended CoPP_CRITICAL\nApic1(config-ext-nacl)#remark our control plane adjacencies are critical\nApic1(config-ext-nacl)#permit\
    \ ospf host x.x.x.x any\nApic1(config-ext-nacl)#permit ospf host x.x.x.x any\nApic1(config-ext-nacl)#permit pim host x.x.x.x\
    \ any\nApic1(config-ext-nacl)#permit pim host x.x.x.x any\nApic1(config-ext-nacl)#permit igmp any 224.0.0.0 15.255.255.255\n\
    Apic1(config-ext-nacl)#permit tcp host x.x.x.x eq bgp host x.x.x.x\nApic1(config-ext-nacl)#deny ip any any\nApic1(config-ext-nacl)#exit\n\
    Apic1(config)#ip access-list extended CoPP_IMPORTANT\nApic1(config-ext-nacl)#permit tcp host x.x.x.x eq tacacs any\nApic1(config-ext-nacl)#permit\
    \ tcp x.x.x.x 0.0.0.255 any eq 22\nApic1(config-ext-nacl)#permit udp host x.x.x.x any eq snmp\nApic1(config-ext-nacl)#permit\
    \ udp host x.x.x.x eq ntp any\nApic1(config-ext-nacl)#deny ip any any\nApic1(config-ext-nacl)#exit\nApic1(config)#ip access-list\
    \ extended CoPP_NORMAL\nApic1(config-ext-nacl)#remark we will want to rate limit ICMP traffic\nApic1(config-ext-nacl)#deny\
    \ icmp any host x.x.x.x fragments\nApic1(config-ext-nacl)#permit icmp any any echo\nApic1(config-ext-nacl)#permit icmp\
    \ any any echo-reply\nApic1(config-ext-nacl)#permit icmp any any time-exceeded\nApic1(config-ext-nacl)#permit icmp any\
    \ any unreachable\nApic1(config-ext-nacl)#deny ip any any\nApic1(config-ext-nacl)#exit\nApic1(config)#ip access-list extended\
    \ CoPP_UNDESIRABLE\nApic1(config-ext-nacl)#remark management plane traffic that should not be\nreceived\nApic1(config-ext-nacl)#permit\
    \ udp any any eq ntp\nApic1(config-ext-nacl)#permit udp any any eq snmp\nApic1(config-ext-nacl)#permit tcp any any eq\
    \ 22\nApic1(config-ext-nacl)#permit tcp any any eq 23\nApic1(config-ext-nacl)#remark control plane traffic not configured\
    \ on router\nApic1(config-ext-nacl)#permit eigrp any any\nApic1(config-ext-nacl)#permit udp any any eq rip\nApic1(config-ext-nacl)#deny\
    \ ip any any\nApic1(config-ext-nacl)#exit\nApic1(config)#ip access-list extended CoPP_DEFAULT\nApic1(config-ext-nacl)#permit\
    \ ip any any\nApic1(config-ext-nacl)#exit\n2. Configure class maps referencing each of the ACLs.\nApic1(config)#class-map\
    \ match-all CoPP_CRITICAL\nApic1(config-cmap)#match access-group name CoPP_CRITICAL\nApic1(config-cmap)#class-map match-any\
    \ CoPP_IMPORTANT\nApic1(config-cmap)#match access-group name CoPP_IMPORTANT\nApic1(config-cmap)#match protocol arp\nApic1(config-cmap)#class-map\
    \ match-all CoPP_NORMAL\nApic1(config-cmap)#match access-group name CoPP_NORMAL\nApic1(config-cmap)#class-map match-any\
    \ CoPP_UNDESIRABLE\nApic1(config-cmap)#match access-group name CoPP_UNDESIRABLE\nApic1(config-cmap)#class-map match-all\
    \ CoPP_DEFAULT\nApic1(config-cmap)#match access-group name CoPP_DEFAULT\nApic1(config-cmap)#exit\n3. Configure a policy\
    \ map referencing the configured class maps and apply\nappropriate bandwidth allowance and policing attributes.\nApic1(config)#policy-map\
    \ CONTROL_PLANE_POLICY\nApic1(config-pmap)#class CoPP_CRITICAL\nApic1(config-pmap-c)#police 512000 8000 conform-action\
    \ transmit exceed-action\ntransmit\nApic1(config-pmap-c-police)#class CoPP_IMPORTANT\nApic1(config-pmap-c)#police 256000\
    \ 4000 conform-action transmit exceed-action\ndrop\nApic1(config-pmap-c-police)#class CoPP_NORMAL\nApic1(config-pmap-c)#police\
    \ 128000 2000 conform-action transmit exceed-action\ndrop\nApic1(config-pmap-c-police)#class CoPP_UNDESIRABLE\nApic1(config-pmap-c)#police\
    \ 8000 1000 conform-action drop exceed-action drop\nApic1(config-pmap-c-police)#class CoPP_DEFAULT\nApic1(config-pmap-c)#police\
    \ 64000 1000 conform-action transmit exceed-action\ndrop\nApic1(config-pmap-c-police)#exit\napic(config-pmap-c)#exit\n\
    apic(config-pmap)#exit\n4. Apply the policy map applying the configuration to an interface on the leaf.\napic(config)#\
    \ leaf 101\n (config-leaf)# int eth 1/10\n (config-leaf-if)# service-policy type CONTROL-PLANE-POLICY"
  checks:
  - type: manual_review
    info: 'Review the configuration to verify Cisco ACI is configured to employ control plane

