- id: '1.30'
  title: CACI-RT-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco ACI multicast rendezvous point (RP) must be configured to limit the multicast forwarding cache so
    that its resources are not saturated by managing an overwhelming number of Protocol Independent Multicast (PIM) and Multicast
    Source Discovery Protocol (MSDP) source-active entries. GROUP ID: V-272090 RULE ID: SV-272090r1114314'
  rationale: MSDP peering between networks enables sharing of multicast source information. Enclaves with an existing multicast
    topology using PIM-SM can configure their RP routers to peer with MSDP routers. As a first step of defense against a denial-of-service
    (DoS) attack, all RP routers must limit the multicast forwarding cache to ensure router resources are not saturated managing
    an overwhelming number of PIM and MSDP source-active entries.
  impact: ''
  references: []
  page_start: 68
  audit_raw: 'Review the PIM configuration:

    ip pim register-rate-limit 10

    If the RP router is not configured to filter PIM register messages, rate limiting the

    number of PIM register messages, and accept MSDP packets only from known MSDP

    peers, this is a finding.'
  remediation: 'Configure the switch to filter PIM register messages, rate limiting the number of PIM

    register messages, and accept MSDP packets only from known MSDP peers. Use the

    command "ip pim register-rate-limit ", where specifies the desired maximum number of

    register messages per second allowed to be sent.

    Navigate to the global configuration mode.

    [switch#] configure terminal

    [switch(config)#] ip pim register-rate-limit 10'
  checks:
  - type: manual_review
    info: 'Review the PIM configuration:

      ip pim register-rate-limit 10

      If the RP router is not configured to filter PIM register messages, rate limiting the

      number of PIM register messages, and accept MSDP packets only from known MSDP

      peers, this is a finding.'
    severity: medium
- id: '1.31'
  title: CACI-RT-000031
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The multicast rendezvous point (RP) must be configured to rate limit the number of Protocol Independent Multicast
    (PIM) Register messages. GROUP ID: V-272091 RULE ID: SV-272091r1114102'
  rationale: When a new source starts transmitting in a PIM Sparse Mode network, the designated router (DR) will encapsulate
    the multicast packets into register messages and forward them to the RP using unicast. This process can be taxing on the
    CPU for both the DR and the RP if the source is running at a high data rate and there are many new sources starting at
    the same time. This scenario can potentially occur immediately after a network failover. The rate limit for the number
    of register messages should be set to a relatively low value based on the known number of multicast sources within the
    multicast domain.
  impact: ''
  references: []
  page_start: 70
  audit_raw: "Review the configuration of the RP to verify that it is rate limiting the number of PIM\nregister messages:\n\
    tenant <tenant-name>\nvrf <vrf-name>\n ip pim register rate limit 10\nIf the RP is not limiting PIM register messages,\
    \ this is a finding."
  remediation: "Configure the RP to rate limit the number of multicast register messages:\napic(config)# tenant <tenant-name>\n\
    apic(config)# vrf <vrf-name>\n apic(config)# ip pim register rate limit 10"
  checks:
  - type: manual_review
    info: "Review the configuration of the RP to verify that it is rate limiting the number of PIM\nregister messages:\ntenant\
      \ <tenant-name>\nvrf <vrf-name>\n ip pim register rate limit 10\nIf the RP is not limiting PIM register messages, this\
      \ is a finding."
    severity: medium
- id: '1.32'
  title: CACI-RT-000032
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco ACI must be configured to limit the mroute states created by Internet Group Management Protocol
    (IGMP) and Multicast Listener Discovery (MLD) reports on a Cisco APIC Bridge Domain (BD) or interface. GROUP ID: V-272092
    RULE ID: SV-272092r1114104'
  rationale: Limiting mroute states helps prevent excessive multicast traffic flooding on the network by controlling the number
    of multicast groups a segment can join. By limiting multicast routes, the APIC can better manage its internal resources
    and prevent potential performance issues due to excessive multicast traffic. Depending on the ACI configuration, set a
    global IGMP state limit which would apply across all interfaces, or it may be necessary to configure limits on individual
    interfaces.
  impact: ''
  references: []
  page_start: 71
  audit_raw: "Review the configuration to verify it is limiting the number of mroute states via IGMP or\nMLD.\nVerify IGMP\
    \ limits have been configured globally or on each host-facing interface via\nthe ip igmp limit command as shown in the\
    \ example:\ninterface GigabitEthernet0/0\n ip igmp limit nn\nReview the relevant Bridge Domain (BD) or interface. Verify\
    \ it is configured to limit the\nnumber of multicast routes (mroute states) generated by IGMP or MLD reports.\ntenant\
    \ <tenant_name>\napic(config-tenant)# bridge-domain <BD_name>\napic(config-bd)# interface <interface_name>\napic(config-if)#\
    \ ip mroute limit <maximum_mroute_count>\nIf the ACI is not limiting multicast requests via IGMP or MLD on a global or\
    \ interfaces\nbasis, this is a finding."
  remediation: 'Configure a global or interface basis to limit the number of mroute states resulting from

    IGMP or MLD membership reports.

    Navigate to the specific BD or interface settings within the APIC configuration. Use the

    CLI command "ip igmp limit " in global configuration mode, which sets a global limit on

    the number of mroute states allowed across the entire fabric. This limit cannot be

    configured on a per interface basis in ACI. To limit the number of mroute states created

    on a BD or interface by MLD reports on a Cisco APIC, configure the "Maximum

    Multicast Entries" parameter within the BD or interface settings.

    apic# configure terminal

    apic(config)# ip igmp limit 100

    or

    apic(config)#int g0/0

    apic(config-if)#ip igmp limit 2

    On the relevant BD or interface, limit the number of multicast routes (mroute states)

    generated by IGMP or MLD reports. Navigate to the specific BD and interface where the

    mroute limit is to be set.

    apic(config)# tenant <tenant_name>

    apic(config-tenant)# bridge-domain <BD_name>

    apic(config-bd)# interface <interface_name>

    apic(config-if)# ip mroute limit <maximum_mroute_count>

    Note: Monitor multicast traffic on the network and adjust the "ip mroute limit" value as

    needed to balance performance and resource usage.'
  checks:
  - type: manual_review
    info: "Review the configuration to verify it is limiting the number of mroute states via IGMP or\nMLD.\nVerify IGMP limits\
      \ have been configured globally or on each host-facing interface via\nthe ip igmp limit command as shown in the example:\n\
      interface GigabitEthernet0/0\n ip igmp limit nn\nReview the relevant Bridge Domain (BD) or interface. Verify it is configured\
      \ to limit the\nnumber of multicast routes (mroute states) generated by IGMP or MLD reports.\ntenant <tenant_name>\n\
      apic(config-tenant)# bridge-domai"
    severity: medium
- id: '1.33'
  title: CACI-RT-000033
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco ACI multicast shortest-path tree (SPT) threshold must be set to the default. GROUP ID: V-272093
    RULE ID: SV-272093r1113999'
  rationale: On a Cisco ACI, the "ip pim spt-threshold" is not set to infinity by default; it is typically set to a finite
    value, with the default usually being zero, meaning it will always use the SPT for PIM calculations. The standard configuration
    for "ip pim spt-threshold" on Cisco devices is usually set to zero. This threshold determines when a router will use the
    SPT to forward multicast traffic in PIM Sparse Mode. While technically possible, setting the threshold to "infinity" would
    mean the router would never use the SPT, which is generally not the intended behavior. In a Cisco ACI fabric, the SPT
    threshold typically does not need to be manually configured to increase it for multicast, as the system automatically
    calculates the SPT based on the network topology, and the border leaf switches handle the SPT switchover functionality;
    however, in specific scenarios where there are a large number of multicast sources, or multicast traffic flow must be
    optimized, adjusting the SPT threshold may be considered depending on the network requirements. Thus, it is not recommended
    that this be configured. While technically possible, setting the threshold to "infinity" would mean the router would never
    use the SPT, which is generally not the intended behavior.
  impact: ''
  references: []
  page_start: 73
  audit_raw: 'Review the configuration to verify the SPT switchover threshold is not explicitly

    configured.

    If the "ip pim spt-threshold " command is configured for any value other than zero, this is

    a finding.'
  remediation: 'Remove the "ip pim spt-threshold" from the configuration.

