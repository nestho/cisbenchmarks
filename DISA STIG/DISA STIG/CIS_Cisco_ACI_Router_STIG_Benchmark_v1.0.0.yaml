- id: '1.22'
  title: CACI-RT-000022
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco ACI must be configured to implement message authentication and secure communications for all control
    plane protocols. GROUP ID: V-272082 RULE ID: SV-272082r1114265'
  rationale: A rogue router could send a fictitious routing update to convince a site's perimeter router to send traffic to
    an incorrect or even a rogue destination. This diverted traffic could be analyzed to learn confidential information about
    the site's network or used to disrupt the network's ability to communicate with other networks. This is known as a "traffic
    attraction attack" and is prevented by configuring neighbor router authentication for routing updates. This requirement
    applies to all IPv4 and IPv6 protocols used to exchange routing or packet forwarding information. This includes BGP, RIP,
    OSPF, EIGRP, IS-IS and LDP.
  impact: ''
  references: []
  page_start: 52
  audit_raw: 'Verify secure communications and message authentication on all control plane

    protocols is configured.

    1. Verify Secure Communication:

    2. Navigate to Fabric >> Fabric Policies >> Pod Policies >> Policies >>

    Management.

    3. Verify SSH and SSL protocols are enabled for APIC management.

    4. Verify Message Authentication:

    5. Navigate to Fabric >> Fabric Policies >> Pod Policies >> Policies >>

    Interconnect.

    6. Verify IPsec for FI communication is enabled.

    7. Verify OpFlex for Southbound Communication is set to TLS.

    8. Navigate to Fabric >> Fabric Policies >> Pod Policies >> Policies >> Trust

    Domain.

    9. Verify the Trust Domain is enabled and configured.

    Verify BGP neighbor authentication keys on Cisco ACI border leaf switches are

    configured to use a different authentication key for each AS peer.

    1. Navigate to Tenants >> All Tenants >> your_tenant >> Networking >> L3Outs >>

    your_l3out.

    2. Expand Logical Node Profiles >> node_profile.

    3. Select Logical Interface Profiles >> interface_profile (where the BGP peering is

    configured).

    4. Within the Logical Interface Profile, review each BGP Peer Connectivity profiles

    for each individual BGP peer.

    5. In the BGP Peer Connectivity Profile settings, review the Password to verify each

    peer has a unique password.

    If message authentication and secure communications is not configured for all control

    plane protocols, this is a finding.'
  remediation: 'Configure secure communications and message authentication on all control plane

    protocols.

    1. Enable Secure Communication:

    2. Navigate to Fabric >> Fabric Policies >> Pod Policies >> Policies >>

    Management.

    3. Enable SSH and SSL protocols for APIC management.

    4. Configure the ports used for SSH and SSL connections as needed.

    5. Configure Message Authentication:

