- id: '1.29'
  title: CACI-RT-000027
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco ACI must be configured to have Internet Control Message Protocol (ICMP) mask replies disabled on
    all external interfaces. GROUP ID: V-272087 RULE ID: SV-272087r1113993'
  rationale: The ICMP supports IP traffic by relaying information about paths, routes, and network conditions. Routers automatically
    send ICMP messages under a wide variety of conditions. Mask Reply ICMP messages are commonly used by attackers for network
    mapping and diagnosis.
  impact: ''
  references: []
