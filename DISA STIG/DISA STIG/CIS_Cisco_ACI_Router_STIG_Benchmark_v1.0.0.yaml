controls:
- id: '1.1'
  title: CACI-RT-000001
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco ACI must be configured to enforce approved authorizations for controlling the flow of information
    within the network based on organization-defined information flow control policies. GROUP ID: V-272061 RULE ID: SV-272061r1115721'
  rationale: Information flow control regulates where information is allowed to travel within a network and between interconnected
    networks. The flow of all network traffic must be monitored and controlled so it does not introduce any unacceptable risk
    to the network infrastructure or data. Information flow control policies and enforcement mechanisms are commonly employed
    by organizations to control the flow of information between designated sources and destinations (e.g., networks, individuals,
    and devices) within information systems. In Cisco ACI, the administrator uses "contracts" to define security policies
    that control traffic between different endpoint groups (EPGs), essentially acting as a more granular and flexible ACL
    mechanism by specifying source and destination addresses, ports, and protocols based on the desired network segmentation
    needs. Add multiple filter rules to create a comprehensive set of allowed traffic patterns.
  impact: ''
  references: []
  page_start: 11
  audit_raw: "Review the switch configuration to verify that ACLs are configured to allow or deny\ntraffic for specific source\
    \ and destination addresses as well as ports and protocols. For\nexample, the configuration below will allow web traffic\
    \ (HTTP) from the \"WebServer\"\nEPG to the \"Database\" EPG.\n tenant TENANT1\n context Application\n filter WEB_TRAFFIC_FILTER\n\
    \ filter ip permit source <web_server_ip_range> destination\n<database_ip_range> protocol tcp port 80\n contract WEBACCESS\n\
    \ filter WEB_TRAFFIC_FILTER\n epg WebServer\n contract WEBACCESS\n epg Database\n contract WEBACCESS\nIf the switch is\
    \ not configured to enforce approved authorizations for controlling the flow\nof information within the network based\
    \ on organization-defined information flow control\npolicies, this is a finding."
  remediation: 'Configure "contracts" to define security policies that control traffic between different

    EPGs.

    1. Navigate to the desired tenant and context to create filters.

    apic(config)# tenant <tenant_name> context <context_name> filter

    <filter_name> filter ip permit source <source_IP_range> destination

    <dest_IP_range> protocol <protocol> port <port_number>

    2. Create or update an existing contract. Link the previously created filter to a

    named contract.

    apic(config)# contract <contract_name> filter <filter_name>

    3. Assign contract to EPGs. Associate the created contract with the specific EPGs.

    apic(config)# epg <epg_name> contract <contract_name>'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify that ACLs are configured to allow or deny\ntraffic for specific source\
      \ and destination addresses as well as ports and protocols. For\nexample, the configuration below will allow web traffic\
      \ (HTTP) from the \"WebServer\"\nEPG to the \"Database\" EPG.\n tenant TENANT1\n context Application\n filter WEB_TRAFFIC_FILTER\n\
      \ filter ip permit source <web_server_ip_range> destination\n<database_ip_range> protocol tcp port 80\n contract WEBACCESS\n\
      \ filter WEB_TRAFFIC_FILTER\n epg"
    severity: medium
- id: '1.2'
  title: CACI-RT-000002
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The BGP Cisco ACI must be configured to reject inbound route advertisements for any prefixes belonging to
    the local autonomous system (AS). GROUP ID: V-272062 RULE ID: SV-272062r1115716'
  rationale: Accepting route advertisements belonging to the local AS can result in traffic looping or being black holed,
    or at a minimum using a nonoptimized path. For Cisco APIC, the default setting to prevent route loops from occurring.
    Sites must use different AS numbers. If this occurs, routing updates from one site is dropped when the other site receives
    them by default. To prevent such a situation from occurring, sites must not enable the "BGP Autonomous System override"
    feature to override the default setting. They must also not enable the "Disable Peer AS Check".
  impact: ''
  references: []
  page_start: 14
  audit_raw: "Review the switch configuration to verify it will reject routes belonging to the local AS.\n1. Verify a prefix\
    \ list has been configured containing prefixes belonging to the local\nAS.\nroute-map LOCAL_AS_FILTER permit 10\n match\
    \ ip address prefix <local-AS-prefix>\n set community no-advertise\n2. Review the route-map to the inbound BGP policy.\n\
    bgp neighbor <peer-IP>\n address-family ipv4 unicast\n inbound route-map LOCAL_AS_FILTER\nIf the switch is not configured\
    \ to reject inbound route advertisements belonging to the\nlocal AS, this is a finding."
  remediation: "Configure the router to reject inbound route advertisements for any prefixes belonging\nto the local AS.\n\
    1. From the relevant BGP peer configuration, create a route-map to filter local AS\nprefixes.\nRoute-map LOCAL_AS_FILTER\
    \ permit 10\n match ip address prefix <local-AS-prefix>\n set community no-advertise\n2. Apply the route-map to the inbound\
    \ BGP policy. Within the inbound policy, add a\nprefix filter rule that explicitly rejects any routes with a prefix matching\
    \ the local\nAS number.\nbgp neighbor <peer-IP>\n address-family ipv4 unicast\n inbound route-map MY_LOCAL_AS_FILTER"
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify it will reject routes belonging to the local AS.\n1. Verify a prefix\
      \ list has been configured containing prefixes belonging to the local\nAS.\nroute-map LOCAL_AS_FILTER permit 10\n match\
      \ ip address prefix <local-AS-prefix>\n set community no-advertise\n2. Review the route-map to the inbound BGP policy.\n\
      bgp neighbor <peer-IP>\n address-family ipv4 unicast\n inbound route-map LOCAL_AS_FILTER\nIf the switch is not configured\
      \ to reject inbound route advertisements be"
    severity: medium
- id: '1.3'
  title: CACI-RT-000003
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The BGP Cisco ACI must be configured to reject outbound route advertisements for any prefixes that do not
    belong to any customers or the local autonomous system (AS). GROUP ID: V-272063 RULE ID: SV-272063r1115719'
  rationale: Advertisement of routes by an autonomous system for networks that do not belong to any of its customers pulls
    traffic away from the authorized network. This causes a denial of service (DoS) on the network that allocated the block
    of addresses and may cause a DoS on the network that is inadvertently advertising it as the originator. It is also possible
    that a misconfigured or compromised router within the GIG IP core could redistribute IGP routes into BGP, thereby leaking
    internal routes.
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Review the ACI configuration to verify it will reject routes belonging to the local AS.

    1. Verify a prefix list has been configured containing prefixes belonging to the local

    AS. In the example below, x.13.1.0/24 is the global address space allocated to

    the local AS.

    ip prefix-list PREFIX_FILTER seq 74 deny x.13.1.0/24 le 32

    2. Verify the prefix list has been applied to all external BGP peers as shown in the

    example below:

    router bgp <AS_number> neighbor <peer_IP> prefix-list LOCAL_AS_PREFIX_FILTER

    out

    If the ACI is not configured to reject inbound route advertisements belonging to the local

    AS, this is a finding.'
  remediation: 'Configure the router to reject outbound route advertisements for any prefixes belonging

    to the local AS. Use a prefix list containing the local AS prefixes and apply it as an

    outbound filter on the BGP neighbor configuration, as shown in the following examples.

    1. Add to the prefix filter list those prefixes belonging to the local autonomous

    system.

    apci1(config)# ip prefix-list LOCAL_AS_PREFIX_FILTER seq 70 deny

    <local_AS_prefixes>

    2. Apply the prefix list filter outbound to each external BGP neighbor.

    apci1(config)# router bgp <AS_number> neighbor <peer_IP> prefix-list

    LOCAL_AS_PREFIX_FILTER out'
  checks:
  - type: manual_review
    info: 'Review the ACI configuration to verify it will reject routes belonging to the local AS.

      1. Verify a prefix list has been configured containing prefixes belonging to the local

      AS. In the example below, x.13.1.0/24 is the global address space allocated to

      the local AS.

      ip prefix-list PREFIX_FILTER seq 74 deny x.13.1.0/24 le 32

      2. Verify the prefix list has been applied to all external BGP peers as shown in the

      example below:

      router bgp <AS_number> neighbor <peer_IP> prefix-list LOCAL_AS_PREFIX_FIL'
    severity: medium
- id: '1.4'
  title: CACI-RT-000004
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The BGP Cisco ACI must be configured to reject route advertisements from BGP peers that do not list their
    autonomous system (AS) number as the first AS in the AS_PATH attribute. GROUP ID: V-272064 RULE ID: SV-272064r1113970'
  rationale: Verifying the path a route has traversed will ensure the IP core is not used as a transit network for unauthorized
    or possibly even internet traffic. All autonomous system boundary routers (ASBRs) must ensure updates received from eBGP
    peers list their AS number as the first AS in the AS_PATH attribute. Cisco ACI BGP usually enforces the "first-as" rule
    by default.
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'By default, Cisco ACI enforces the first AS in the AS_PATH attribute for all route

    advertisements. Review the configuration to verify the default BGP configuration on the

    ACI fabric is does not explicitly state:

    no enforce first-as

    If the device is not configured to reject updates from peers that do not list their AS

    number as the first AS in the AS_PATH attribute, this is a finding.'
  remediation: 'Configure the device to deny updates received from eBGP peers that do not list their AS

    number as the first AS in the AS_PATH attribute.

    Remove the configuration item "no enforce first-as".'
  checks:
  - type: manual_review
    info: 'By default, Cisco ACI enforces the first AS in the AS_PATH attribute for all route

      advertisements. Review the configuration to verify the default BGP configuration on the

      ACI fabric is does not explicitly state:

      no enforce first-as

      If the device is not configured to reject updates from peers that do not list their AS

      number as the first AS in the AS_PATH attribute, this is a finding.'
    severity: medium
- id: '1.5'
  title: CACI-RT-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Multicast Source Discovery Protocol (MSDP) Cisco ACI must be configured to filter received source-active
    multicast advertisements for any undesirable multicast groups and sources. GROUP ID: V-272065 RULE ID: SV-272065r1115723'
  rationale: The interoperability of BGP extensions for interdomain multicast routing and MSDP enables seamless connectivity
    of multicast domains between autonomous systems. MP-BGP advertises the unicast prefixes of the multicast sources used
    by Protocol Independent Multicast (PIM) routers to perform RPF checks and build multicast distribution trees. MSDP is
    a mechanism used to connect multiple PIM sparse-mode domains, allowing RPs from different domains to share information
    about active sources. MSDP helps ACI border leaf switches identify the location of multicast sources in external networks,
    allowing them to properly route multicast traffic to interested receivers within the ACI fabric. MSDP within a layer 3
    context, allowing the ACI fabric to discover multicast sources located in other multicast domains when connecting to external
    networks through "L3Out" connections, enabling efficient multicast traffic forwarding across different network segments.
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'If this is a DODIN or JRSS system, this is not applicable.

    Verify the ip route-map command with specific filter criteria under the relevant BGP

    neighbor configuration is configured to block any unwanted multicast prefixes from

    being advertised as shown in the example below:

    router bgp 100

    neighbor 10.1.1.2 remote-as 200

    address-family ipv4 unicast

    route-map BLOCK_MULTICAST permit

    If the ACI is not configured to reject outbound route advertisements that do not belong

    to any customers or the local AS, this is a finding.'
  remediation: 'Use the ip route-map command with specific filter criteria under the relevant BGP

    neighbor configuration to block any unwanted multicast prefixes from being advertised.

    1. Navigate to BGP neighbor configuration.

    apci1(config)# router bgp <AS number>

    apci1(config-router)# neighbor <peer-IP> remote-as <peer-AS>

    2. Create a route map.

    apci1(config-router)# ip route-map <route-map-name> permit 10

    apci1(config-router)# match ip address prefix <undesirable-multicast-prefix>

    exit

    3. Apply route-map to BGP neighbor.

    apci1(config)# address-family ipv4 unicast

    apci1(config)# route-map <route-map-name> permit'
  checks:
  - type: manual_review
    info: 'If this is a DODIN or JRSS system, this is not applicable.

      Verify the ip route-map command with specific filter criteria under the relevant BGP

      neighbor configuration is configured to block any unwanted multicast prefixes from

      being advertised as shown in the example below:

      router bgp 100

      neighbor 10.1.1.2 remote-as 200

      address-family ipv4 unicast

      route-map BLOCK_MULTICAST permit

      If the ACI is not configured to reject outbound route advertisements that do not belong

      to any customers or the local'
    severity: medium
- id: '1.6'
  title: CACI-RT-000006
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco ACI Multicast Source Discovery Protocol (MSDP) must be configured to filter source-active (SA) multicast
    advertisements to external MSDP peers to avoid global visibility of local-only multicast sources and groups. GROUP ID:
    V-272066 RULE ID: SV-272066r1115725'
  rationale: To avoid global visibility of local information, there are a number of source-group (S, G) states in a PIM-SM
    domain that must not be leaked to another domain, such as multicast sources with private address, administratively scoped
    multicast addresses, and the auto-RP groups (224.0.1.39 and 224.0.1.40). Allowing a multicast distribution tree, local
    to the core, to extend beyond its boundary could enable local multicast traffic to leak into other autonomous systems
    and customer networks.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'If the ACI implementation does not use MSDP, this is not applicable.

    ip msdp sa-filter in <msdp_peer_address> list OUTBOUND_MSDP_SA_FILTER

    If the device is not configured with an export policy to filter local source-active multicast

    advertisements, this is a finding.'
  remediation: 'Configure the switch to filter source-active multicast advertisements to external MSDP

    peers to avoid global visibility of local-only multicast sources and groups.

    1. Filter all SA messages coming from peer 10.1.1.2 except those for group

    224.0.0.1. in the CLI, where is the IP address of the external MSDP peer.

    apic1(config)# ip msdp sa-filter in 10.1.1.2 list OUTBOUND_MSDP_SA_FILTER

    2. ACL definition.

    apic1(config)# ip access-list extended OUTBOUND_MSDP_SA_FILTER permit ip any

    224.0.0.1 any'
  checks:
  - type: manual_review
    info: 'If the ACI implementation does not use MSDP, this is not applicable.

      ip msdp sa-filter in <msdp_peer_address> list OUTBOUND_MSDP_SA_FILTER

      If the device is not configured with an export policy to filter local source-active multicast

      advertisements, this is a finding.'
    severity: medium
- id: '1.7'
  title: CACI-RT-000007
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Multicast Source Discovery Protocol (MSDP) Cisco ACI must be configured to limit the amount of source-active
    (SA) messages it accepts on per-peer basis. GROUP ID: V-272067 RULE ID: SV-272067r1113973'
  rationale: To reduce any risk of a denial-of-service (DoS) attack from a rogue or misconfigured MSDP router, the router
    must be configured to limit the number of source-active messages it accepts from each peer. To limit the amount of SA
    messages a Cisco ACI switch accepts from each MSDP peer, configure the "ip msdp sa-limit" command on the switch, specifying
    the maximum number of SA messages allowed per peer; this essentially acts as a per-peer limit to prevent overwhelming
    the device with multicast source information from a single source.
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'If the ACI implementation does not use MSDP, this is not applicable.

    Review the switch configuration to determine if it is configured to limit the amount of

    source-active messages it accepts on a per-peer basis.

    show ip msdp

    If the ACI is not configured to limit the source-active messages it accepts, this is a

    finding.'
  remediation: 'To limit the amount of SA messages a Cisco ACI switch accepts from each MSDP peer,

    configure the "ip msdp sa-limit" command specifying the maximum number of SA

    messages allowed per peer. The following is an example:

    api1(config)# ip msdp sa-limit 10.1.1.1 MSDP_SA_FILTER'
  checks:
  - type: sql
    command: show ip msdp
    severity: medium
    info: 'If the ACI implementation does not use MSDP, this is not applicable.

      Review the switch configuration to determine if it is configured to limit the amount of

      source-active messages it accepts on a per-peer basis.

      show ip msdp

      If the ACI is not configured to limit the source-active messages it accepts, this is a

      finding.'
- id: '1.8'
  title: CACI-RT-000008
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The multicast Cisco ACI must be configured to disable Protocol Independent Multicast (PIM) on all interfaces
    that are not required to support multicast routing. GROUP ID: V-272068 RULE ID: SV-272068r1114267'
  rationale: If multicast traffic is forwarded beyond the intended boundary, it is possible it can be intercepted by unauthorized
    or unintended personnel. Limiting where, within the network, a given multicast group's data is permitted to flow is an
    important first step in improving multicast security. A scope zone is an instance of a connected region of a given scope.
    Zones of the same scope cannot overlap while zones of a smaller scope will fit completely within a zone of a larger scope.
    For example, Admin-local scope is smaller than Site-local scope, so the administratively configured boundary fits within
    the bounds of a site. According to RFC 4007 IPv6 Scoped Address Architecture (section 5), scope zones are also required
    to be "convex from a routing perspective"; that is, packets routed within a zone must not pass through any links that
    are outside of the zone. This requirement forces each zone to be one contiguous island rather than a series of separate
    islands. As stated in the DOD IPv6 IA Guidance for MO3, "One should be able to identify all interfaces of a zone by drawing
    a closed loop on their network diagram, engulfing some routers and passing through some routers to include only some of
    their interfaces." Therefore, it is imperative that the network engineers have documented their multicast topology and
    thereby know which interfaces are enabled for multicast. Once this is done, the zones can be scoped as required.
  impact: ''
  references: []
  page_start: 25
  audit_raw: '1. Review the network''s multicast topology diagram.

    2. Review the switch configuration to verify only the PIM interfaces as shown in the

    multicast topology diagram are enabled for PIM as shown in the example below:

    Example:

    configure terminal

    interface Ethernet1/1

    no ip pim

    If an interface is not required to support multicast routing and it is enabled, this is a

    finding.'
  remediation: 'From the CLI, use "no ip pim" within the interface configuration on the relevant

    nonmulticast enabled interfaces.

    Example:

    configure terminal

    interface Ethernet1/1

    no ip pim'
  checks:
  - type: manual_review
    info: '1. Review the network''s multicast topology diagram.

      2. Review the switch configuration to verify only the PIM interfaces as shown in the

      multicast topology diagram are enabled for PIM as shown in the example below:

      Example:

      configure terminal

      interface Ethernet1/1

      no ip pim

      If an interface is not required to support multicast routing and it is enabled, this is a

      finding.'
    severity: medium
- id: '1.9'
  title: CACI-RT-000009
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The multicast Cisco ACI must be configured to bind a Protocol Independent Multicast (PIM) neighbor filter
    to interfaces that have PIM enabled. GROUP ID: V-272069 RULE ID: SV-272069r1114269'
  rationale: PIM is a routing protocol used to build multicast distribution trees for forwarding multicast traffic across
    the network infrastructure. PIM traffic must be limited to only known PIM neighbors by configuring and binding a PIM neighbor
    filter to those interfaces that have PIM enabled. If a PIM neighbor filter is not applied to those interfaces that have
    PIM enabled, unauthorized routers can join the PIM domain, discover and use the rendezvous points, and also advertise
    their rendezvous points into the domain. This can result in a denial of service (DoS) by traffic flooding or result in
    the unauthorized transfer of data.
  impact: ''
  references: []
  page_start: 27
  audit_raw: '1. Review the network''s multicast topology diagram.

    2. Review the switch configuration to verify only the PIM interfaces as shown in the

    multicast topology diagram are enabled for PIM as shown in the example below:

    Example:

    configure terminal

    interface Ethernet1/1

    ip pim

    If a multicast interface is required to support PIM and it is not enabled, this is a finding.'
  remediation: 'From the CLI, use "ip pim" within the interface configuration on the relevant multicast

    enabled interfaces.

    Example:

    configure terminal

    interface Ethernet1/1

    ip pim'
  checks:
  - type: manual_review
    info: '1. Review the network''s multicast topology diagram.

      2. Review the switch configuration to verify only the PIM interfaces as shown in the

      multicast topology diagram are enabled for PIM as shown in the example below:

      Example:

      configure terminal

      interface Ethernet1/1

      ip pim

      If a multicast interface is required to support PIM and it is not enabled, this is a finding.'
    severity: medium
- id: '1.10'
  title: CACI-RT-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The multicast edge Cisco ACI must be configured to establish boundaries for administratively scoped multicast
    traffic. GROUP ID: V-272070 RULE ID: SV-272070r1113976'
  rationale: If multicast traffic is forwarded beyond the intended boundary, it is possible that it can be intercepted by
    unauthorized or unintended personnel. Administrative scoped multicast addresses are locally assigned and are to be used
    exclusively by the enterprise network or enclave. Administrative scoped multicast traffic must not cross the enclave perimeter
    in either direction. Restricting multicast traffic makes it more difficult for a malicious user to access sensitive traffic.
    Admin-Local scope is encouraged for any multicast traffic within a network intended for network management, as well as
    for control plane traffic that must reach beyond linklocal destinations. Administratively scoped multicast addresses fall
    within the range of 239.0.0.0 to 239.255.255.255.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'Verify the multicast routing table and troubleshoot any issues with multicast traffic flow.

    show ip mroute

    If the ACI is not configured to establish boundaries for administratively scoped multicast

    traffic, this is a finding.'
  remediation: "Leverage the border leaf switches within the fabric, applying access control lists (ACLs)\non the appropriate\
    \ interfaces to filter multicast packets with administratively scoped\naddresses.\nLog in to the CLI of a border leaf\
    \ switch within the ACI fabric.\nconfigure terminal\nip multicast-routing\naccess-list extended MULTICAST_FILTER\n deny\
    \ ip 239.0.0.0 239.255.255.255 any\n permit ip any any\nApply the created ACL to the outbound direction of the interface\
    \ facing the external\nnetwork."
  checks:
  - type: sql
    command: show ip mroute
    severity: medium
    info: 'Verify the multicast routing table and troubleshoot any issues with multicast traffic flow.

      show ip mroute

      If the ACI is not configured to establish boundaries for administratively scoped multicast

      traffic, this is a finding.'
- id: '1.11'
  title: CACI-RT-000011
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The out-of-band management (OOBM) gateway Cisco ACI must be configured to have separate OSPF instances for
    the managed network and management network. GROUP ID: V-272071 RULE ID: SV-272071r1114084'
  rationale: If the gateway router is not a dedicated device for the OOBM network, implementation of several safeguards for
    containment of management and production traffic boundaries must occur. Since the managed and management network are separate
    routing domains, configuration of separate OSPF routing instances is critical on the router to segregate traffic from
    each network.
  impact: ''
  references: []
  page_start: 31
  audit_raw: "If this review is for the DODIN Backbone, mark as not applicable.\nVerify separate routing instances in the\
    \ Cisco APIC as shown in the following example:\ninterface GigabitEthernet 0/0\n ip address 10.0.0.1 255.255.255.0\n no\
    \ shutdown\n ip route-map \"mgmt-routes\" permit\n router bgp 100 // Management network routing instance\ninterface GigabitEthernet\
    \ 0/1\n ip address 192.168.1.1 255.255.255.0\n no shutdown\n ip route-map \"managed-routes\" permit\n router bgp 200 //\
    \ Managed network routing instance\nIf separate routing instances are not configured for the managed and management\n\
    networks, this is a finding."
  remediation: "Configure separate routing instances for the managed and management networks, as\nshown in the example below:\n\
    interface GigabitEthernet 0/0\n ip address 10.0.0.1 255.255.255.0\n no shutdown\n ip route-map \"mgmt-routes\" permit\n\
    \ router bgp 100 // Management network routing instance\ninterface GigabitEthernet 0/1\n ip address 192.168.1.1 255.255.255.0\n\
    \ no shutdown\n ip route-map \"managed-routes\" permit\n router bgp 200 // Managed network routing instance"
  checks:
  - type: manual_review
    info: "If this review is for the DODIN Backbone, mark as not applicable.\nVerify separate routing instances in the Cisco\
      \ APIC as shown in the following example:\ninterface GigabitEthernet 0/0\n ip address 10.0.0.1 255.255.255.0\n no shutdown\n\
      \ ip route-map \"mgmt-routes\" permit\n router bgp 100 // Management network routing instance\ninterface GigabitEthernet\
      \ 0/1\n ip address 192.168.1.1 255.255.255.0\n no shutdown\n ip route-map \"managed-routes\" permit\n router bgp 200\
      \ // Managed network routing instance\nIf separ"
    severity: medium
- id: '1.12'
  title: CACI-RT-000012
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco ACI out-of-band management (OOBM) must be configured to not redistribute routes between the management
    network routing domain and the managed network routing domain. GROUP ID: V-272072 RULE ID: SV-272072r1113978'
  rationale: 'If the gateway router is not a dedicated device for the OOBM network, several safeguards must be implemented
