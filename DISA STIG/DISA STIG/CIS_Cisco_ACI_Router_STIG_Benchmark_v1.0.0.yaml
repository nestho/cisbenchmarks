- id: '1.37'
  title: CACI-RT-000037
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Cisco ACI Multicast Source Discovery Protocol (MSDP) must be configured to only accept MSDP packets from known
    MSDP peers. GROUP ID: V-272097 RULE ID: SV-272097r1114289'
  rationale: MSDP peering with customer network routers presents additional risks to the DISN Core, whether from a rogue or
    misconfigured MSDP-enabled router. To guard against an attack from malicious MSDP traffic, the receive path or interface
    filter for all MSDPenabled RP routers must be configured to only accept MSDP packets from known MSDP peers.
  impact: ''
  references: []
  page_start: 81
  audit_raw: "Review the switch configuration to determine if there is a receive path or interface filter\nto only accept\
    \ MSDP packets from known MSDP peers.\n1. Verify that interfaces used for MSDP peering have an inbound ACL as shown in\n\
    the example below:\ninterface GigabitEthernet1/1\n ip address x.1.28.8 255.255.255.0\n ip access-group EXTERNAL_ACL_INBOUND\
    \ in\n2. Verify that the ACL restricts MSDP peering to only known sources.\nip access-list extended EXTERNAL_ACL_INBOUND\n\
    \ permit tcp host x.1.28.2\n permit tcp host x.1.28.2\nIf the switch is not configured to only accept MSDP packets from\
    \ known MSDP peers,\nthis is a finding."
  remediation: 'Configure the receive path or interface ACLs to only accept MSDP packets from known

    MSDP peers. Ensure the IP addresses of all intended MSDP peers have been properly

    identified and configured before creating the ACL. Regularly review and update ACLs to

