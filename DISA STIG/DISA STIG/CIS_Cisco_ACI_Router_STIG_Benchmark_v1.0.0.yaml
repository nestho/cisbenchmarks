- id: '1.40'
  title: CACI-RT-000040
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco ACI must be configured to advertise a hop limit of at least 32 in Cisco ACI Advertisement messages
    for IPv6 stateless auto-configuration deployments. GROUP ID: V-272100 RULE ID: SV-272100r1114112'
  rationale: The Neighbor Discovery Protocol allows a hop limit value to be advertised by routers in a router advertisement
    message being used by hosts instead of the standardized default value. If a very small value was configured and advertised
    to hosts on the LAN segment, communications would fail due to the hop limit reaching zero before the packets sent by a
    host reached its destination.
  impact: ''
  references: []
  page_start: 87
  audit_raw: "Enter the \"show ipv6 int\" command on the leaf switch to verify the configuration was\npushed out correctly\
    \ to the leaf switch.\ninterface Ethernet 1/1\n ipv6 router advertisement hop-limit 32\nIf a hop limit of at least 32\
    \ is not advertised in Cisco ACI advertisement messages for\nIPv6 stateless auto-configuration deployments, this is a\
    \ finding."
  remediation: 'Configure the switch to advertise a hop limit of at least 32 in router advertisement

    messages as shown in the example.

    Depending on the ACI configuration, it may be necessary to specify the appropriate

    context (like a specific VLAN or L3Out) before issuing the command.

    apic1(config)# interface Ethernet 1/1

    apic1(config-if)# ipv6 router advertisement hop-limit 32

    Note: When configuring using a VPC interface, the ND RA prefix must be enabled for

    both side A and side B as both are members in the VPC configuration. Enable the ND

    RA prefix:

    1. In the Work Pane, in the Logical Interface Profile screen, click the SVI tab.

    2. Under Properties, click the check boxes to enable the ND RA Prefix for both Side

    A and Side B. Choose the identical ND RA Prefix Policy for Side A and Side B.'
  checks:
  - type: manual_review
    info: "Enter the \"show ipv6 int\" command on the leaf switch to verify the configuration was\npushed out correctly to\
      \ the leaf switch.\ninterface Ethernet 1/1\n ipv6 router advertisement hop-limit 32\nIf a hop limit of at least 32 is\
      \ not advertised in Cisco ACI advertisement messages for\nIPv6 stateless auto-configuration deployments, this is a finding."
    severity: medium
- id: '1.41'
  title: CACI-RT-000041
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco ACI must not be configured to use IPv6 site local unicast addresses. GROUP ID: V-272101 RULE ID:
    SV-272101r1114007'
  rationale: As currently defined, site local addresses are ambiguous and can be present in multiple sites. The address itself
    does not contain any indication of the site to which it belongs. The use of site-local addresses has the potential to
    adversely affect network security through leaks, ambiguity, and potential misrouting as documented in section 2 of RFC3879.
    RFC3879 formally deprecates the IPv6 site-local unicast prefix FEC0::/10 as defined in RFC3513. Specify the appropriate
    IPv6 address range within the relevant configuration objects like bridge domains and L3Out, ensuring the addresses fall
    within the allocated site local unicast prefix, and enable IPv6 routing on the fabric level, allowing the ACI switches
    to learn and route traffic based on these IPv6 addresses.
  impact: ''
  references: []
  page_start: 89
  audit_raw: 'Review the router configuration to ensure FEC0::/10 IP addresses are not defined.

    apic1(config) show ipv6 interface gigabitethernet 0/0/0

    If IPv6 site local unicast addresses are defined, this is a finding.'
  remediation: "Delete unauthorized addresses. Configure the IPv6 addresses on the ACI fabric's leaf\nswitches and virtual\
    \ network segments (bridge domains) within the desired tenant to\nuse site local unicast addresses.\nipv6 unicast-routing\n\
    interface gigabitethernet 0/0/0\n ipv6 address 2001:DB8:c18:1::/64 eui-64"
  checks:
  - type: manual_review
    info: 'Review the router configuration to ensure FEC0::/10 IP addresses are not defined.

      apic1(config) show ipv6 interface gigabitethernet 0/0/0

      If IPv6 site local unicast addresses are defined, this is a finding.'
    severity: medium
- id: '1.42'
  title: CACI-RT-000042
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco ACI must implement physically or logically separate subnetworks to isolate organization-defined
    critical system components and functions. GROUP ID: V-272102 RULE ID: SV-272102r1114291'
  rationale: Separating critical system components and functions from other noncritical system components and functions through
    separate subnetworks may be necessary to reduce susceptibility to a catastrophic or debilitating breach or compromise
    that results in system failure. For example, physically separating the command and control function from the in-flight
    entertainment function through separate subnetworks in a commercial aircraft provides an increased level of assurance
    in the trustworthiness of critical system functions. In Cisco ACI, subnetwork addresses are configured logically using
    the policy model, defining separate subnets within different endpoint groups (EPGs) within a tenant, effectively creating
    logically separate network segments without needing to physically partition the network on the underlying hardware; this
    separation is achieved through policy-based routing and access control based on the EPGs assigned to different applications
    or workloads.
  impact: ''
  references: []
  page_start: 91
  audit_raw: 'Review the configuration to verify logical separation using EPGs, bridge domains,

    and/or tenants is configured. The following is an example of an EPG:

    apic1(config)# leaf 1017

    apic1(config-leaf)# interface ethernet 1/13

    apic1(config-leaf-if)# vlan-domain member dom1

    apic1(config-leaf-if)# switchport trunk allowed vlan 20 tenant t1 application

    AP1 epg EPG1

    If subnetworks are not configured to isolate organization-defined critical system

    components and functions, this is a finding.'
  remediation: 'Configure logical separation using EPGs, bridge domains, and/or tenants. The following

    is an example of an EPG.

    1. Configure a VLAN domain.

    Example:

    apic1(config)# vlan-domain dom1

    apic1(config-vlan)# vlan 10-100

    2. Create a tenant.

    Example:

    apic1# configure

    apic1(config)# tenant t1

    3. Create a private network/VRF.

    Example:

    apic1(config-tenant)# vrf context ctx1

    apic1(config-tenant-vrf)# exit

    4. Create a bridge domain.

    Example:

    apic1(config-tenant)# bridge-domain bd1

    apic1(config-tenant-bd)# vrf member ctx1

    apic1(config-tenant-bd)# exit

    5. Create an application profile and an application EPG.

    Example:

    apic1(config-tenant)# application AP1

    apic1(config-tenant-app)# epg EPG1

    apic1(config-tenant-app-epg)# bridge-domain member bd1

    apic1(config-tenant-app-epg)# exit

    apic1(config-tenant-app)# exit

    apic1(config-tenant)# exit

    6. Associate the EPG with a specific port.

    Example:

    apic1(config)# leaf 1017

    apic1(config-leaf)# interface ethernet 1/13

    apic1(config-leaf-if)# vlan-domain member dom1

    apic1(config-leaf-if)# switchport trunk allowed vlan 20 tenant t1 application

    AP1 epg EPG1'
  checks:
  - type: manual_review
    info: 'Review the configuration to verify logical separation using EPGs, bridge domains,

      and/or tenants is configured. The following is an example of an EPG:

      apic1(config)# leaf 1017

