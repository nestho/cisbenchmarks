- id: '1.45'
  title: CACI-RT-000045
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The MPLS Cisco ACI with Resource Reservation Protocol Traffic Engineering (RSVPTE) enabled must be configured
    with message pacing or refresh reduction to adjust the maximum number of RSVP messages to an output queue based on the
    link speed and input queue size of adjacent core Cisco ACIs. GROUP ID: V-272105 RULE ID: SV-272105r1114299'
  rationale: 'RSVP-TE can be used to perform constraint-based routing when building LSP tunnels within the network core that
    will support QoS and traffic engineering requirements. RSVP-TE is also used to enable MPLS Fast Reroute, a network restoration
    mechanism that will reroute traffic onto a backup LSP in case of a node or link failure along the primary path. When there
    is a disruption in the MPLS core, such as a link flap or router reboot, the result is a significant amount of RSVP signaling,
    such as "PathErr" and "ResvErr" messages that need to be sent for every LSP using that link. RSVP messages are sent out
    using either hop-by-hop or with the router alert bit set in the IP header. This means that every router along the path
    must examine the packet to determine if additional processing is required for these RSVP messages. If there is enough
    signaling traffic in the network, it is possible for an interface to receive more packets for its input queue than it
    can hold, resulting in dropped RSVP messages and hence slower RSVP convergence. Increasing the size of the interface input
    queue can help prevent dropping packets; however, there is still the risk of having a burst of signaling traffic that
    can fill the queue. Solutions to mitigate this risk are RSVP message pacing or refresh reduction to control the rate at
    which RSVP messages are sent. RSVP refresh reduction includes the following features: RSVP message bundling, RSVP Message
    ID to reduce message processing overhead, reliable delivery of RSVP messages using Message ID, and summary refresh to
    reduce the amount of information transmitted every refresh interval. To configure a rate-limit on RSVP bandwidth on a
    Cisco ACI interface, use the command "ip rsvp bandwidth" within the interface configuration mode, specifying the desired
    bandwidth value in kilobits per second (kbps), which will act as the maximum reservable bandwidth for RSVP traffic on
    that interface. For more granular control, consider creating a dedicated RSVP policy to further define how bandwidth is
    allocated based on specific traffic characteristics. Optionally, specify a percentage of the interface bandwidth by using
    the "percent" keyword with the command.'
  impact: ''
  references: []
  page_start: 100
  audit_raw: 'Review the router configuration to determine RSVP messages are rate limited.

    1. Determine if MPLS TE is enabled globally and at least one interface. To display

    statistics information for all the interfaces and VRFs in the system, navigate to

    Tenant >> infra >> Networking >> SR-MPLS Infra L3Outs.

    2. Verify the rsvp bandwidth is set.

    ip rsvp bandwidth 1000000

    If the router with RSVP-TE enabled does not rate limit RSVP messages based on the

    link speed and input queue size of adjacent core routers, this is a finding.'
  remediation: 'Configure rate limit RSVP messages per interface, as shown in the example below:

    Syntax: ip rsvp bandwidth <bandwidth_value in kbps>

    apic(config)# ip rsvp bandwidth 1000000'
  checks:
