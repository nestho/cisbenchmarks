    severity: medium
- id: '1.26'
  title: CACI-RT-000026
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco ACI must be configured to have gratuitous ARP (GARP) disabled on all external interfaces. GROUP
    ID: V-272086 RULE ID: SV-272086r1114094'
  rationale: A GARP is an ARP broadcast in which the source and destination MAC addresses are the same. It is used to inform
    the network about a host IP address. A spoofed gratuitous ARP message can cause network mapping information to be stored
    incorrectly, causing network malfunction.
  impact: ''
  references: []
  page_start: 61
  audit_raw: 'Review the configuration for each L3OUT Bridge Domain to determine if gratuitous ARP

    is disabled:

    1. In the APIC GUI Navigation pane, select "Tenant" and inspect each Tenant''s

    Bridge Domain configuration.

    2. Expand "Networking" and right-click each Bridge Domain.

    3. View the Layer 3 configuration tab. Verify GARP-based detection is not enabled.

    If GARP is enabled on any external interface, this is a finding.'
  remediation: 'Disable GARP for each L3OUT Bridge Domain:

    1. In the APIC GUI navigation pane, select "Tenant" and complete the following for

    each tenant listed.

    2. Expand "Networking", right-click, "Create Bridge Domain" to open the dialog box,

    and fill out the form.

    o In the Layer 3 Configurations tab, GARP based detection must not be

    enabled.

    3. Click "NEXT".

    4. Complete the Bridge Domain configuration.

    5. Click "Finish".'
  checks:
  - type: manual_review
    info: 'Review the configuration for each L3OUT Bridge Domain to determine if gratuitous ARP

      is disabled:

      1. In the APIC GUI Navigation pane, select "Tenant" and inspect each Tenant''s

      Bridge Domain configuration.

      2. Expand "Networking" and right-click each Bridge Domain.

      3. View the Layer 3 configuration tab. Verify GARP-based detection is not enabled.

      If GARP is enabled on any external interface, this is a finding.'
    severity: medium
- id: '1.27'
  title: CACI-RT-000028
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The BGP Cisco ACI must be configured to use the maximum prefixes feature to protect against route table flooding
    and prefix de-aggregation attacks. GROUP ID: V-272088 RULE ID: SV-272088r1114096'
  rationale: The effects of prefix de-aggregation can degrade router performance due to the size of routing tables and also
    result in black-holing legitimate traffic. Initiated by an attacker or a misconfigured router, prefix de-aggregation occurs
    when the announcement of a large prefix is fragmented into a collection of smaller prefix announcements. Maximum prefix
    limits on peer connections combined with aggressive prefix-size filtering of customers' reachability advertisements will
    effectively mitigate the deaggregation risk. BGP maximum prefix must be used on all eBGP routers to limit the number of
    prefixes that it should receive from a particular neighbor, whether customer or peering AS. Consider each neighbor and
    how many routes they should be advertising and set a threshold slightly higher than the number expected.
  impact: ''
  references: []
  page_start: 63
  audit_raw: 'Verify the BGP configuration for each tenant:

    ip route protocol BGP

    View the BGP peer configuration maximum prefix value:

    neighbor 10.0.0.1 maximum-prefix nnnnnnn

    If the router is not configured to control the number of prefixes received from each peer

    to protect against route table flooding and prefix de-aggregation attacks, this is a

    finding.'
  remediation: 'Configure the router to use the maximum prefixes feature to protect against route table

    flooding and prefix de-aggregation attacks as shown in the example below:

    For each BGP peer, use the command neighbor <peer-ip> maximum-prefix

    <number of prefixes> within the BGP configuration section, where <peer-ip> is the

    IP address of the BGP peer and <number of prefixes> is the desired maximum

    prefix limit to be set; the default maximum prefix limit is typically 20,000 prefixes.'
  checks:
  - type: manual_review
    info: 'Verify the BGP configuration for each tenant:

      ip route protocol BGP

      View the BGP peer configuration maximum prefix value:

      neighbor 10.0.0.1 maximum-prefix nnnnnnn

      If the router is not configured to control the number of prefixes received from each peer

      to protect against route table flooding and prefix de-aggregation attacks, this is a

      finding.'
    severity: medium
