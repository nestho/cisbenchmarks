- id: '1.38'
  title: CACI-RT-000038
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco ACI must be configured to use its loopback address as the source address for internal Border Gateway
    Protocol (iBGP) peering sessions. GROUP ID: V-272098 RULE ID: SV-272098r1114004'
  rationale: Using a loopback address as the source address offers a multitude of uses for security, access, management, and
    scalability of the BGP routers. It is easier to construct appropriate ingress filters for router management plane traffic
    destined to the network management subnet since the source addresses will be from the range used for loopback interfaces
    instead of a larger range of addresses used for physical interfaces. Log information recorded by authentication and syslog
    servers will record the router's loopback address instead of the numerous physical interface addresses. When the loopback
    address is used as the source for external BGP (eBGP) peering, the BGP session will be harder to hijack since the source
    address to be used is not known globally, making it more difficult for a hacker to spoof an eBGP neighbor. By using traceroute,
    a hacker can easily determine the addresses for an eBGP speaker when the IP address of an external interface is used as
    the source address. The routers within the iBGP domain should also use loopback addresses as the source address when establishing
    BGP sessions.
  impact: ''
  references: []
  page_start: 83
  audit_raw: "Review the switch configuration to verify a loopback address has been configured.\ntenant <tenant-name>\n networking\n\
    \ l3out <l3out-name>\n protocol BGP\n neighbor 10.1.1.1 update-source Loopback0\nIf the switch does not use its loopback\
    \ address as the source address for all iBGP\nsessions, this is a finding."
  remediation: "Configure the BGP configuration for the relevant L3Out to use the switch's loopback\naddress as the source\
    \ address for all iBGP peering. This configures the switch to use\nthe loopback interface as the source IP for all BGP\
    \ updates sent to the specified peer.\ntenant <tenant-name>\n networking\n l3out <l3out-name>\n protocol BGP\n neighbor\
    \ <peer-ip> update-source Loopback0"
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify a loopback address has been configured.\ntenant <tenant-name>\n networking\n\
      \ l3out <l3out-name>\n protocol BGP\n neighbor 10.1.1.1 update-source Loopback0\nIf the switch does not use its loopback\
      \ address as the source address for all iBGP\nsessions, this is a finding."
    severity: medium
