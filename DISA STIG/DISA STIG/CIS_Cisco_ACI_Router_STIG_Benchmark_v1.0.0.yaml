- id: '1.17'
  title: CACI-RT-000017
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco ACI must be configured to use encryption for routing protocol authentication. GROUP ID: V-272077
    RULE ID: SV-272077r1114087'
  rationale: A rogue router could send a fictitious routing update to convince a site's perimeter router to send traffic to
    an incorrect or even a rogue destination. This diverted traffic could be analyzed to learn confidential information about
    the site's network or used to disrupt the network's ability to communicate with other networks. This is known as a "traffic
    attraction attack" and is prevented by configuring neighbor router authentication for routing updates. However, using
    clear-text authentication provides little benefit since an attacker can intercept traffic and view the authentication
    key. This would allow the attacker to use the authentication key in an attack. This requirement applies to all IPv4 and
    IPv6 protocols used to exchange routing or packet forwarding information; this includes all Interior Gateway Protocols
    (such as OSPF, EIGRP, and IS-IS) and Exterior Gateway Protocols (such as BGP), MPLSrelated protocols (such as LDP), and
    multicast-related protocols. To configure a Cisco ACI to use encryption for routing protocol authentication, set up a
    "pre-shared key" (PSK) on the APIC, which will then be used to generate encryption keys for the routing protocol authentication
    process, essentially encrypting the authentication messages exchanged between switches within the fabric. This feature
    is typically referred to as "CloudSec Encryption" within the ACI platform.
  impact: ''
  references: []
  page_start: 42
  audit_raw: 'Verify PSKs are configured:

    apic1(config-cloudsec)# show cloudsec summary

    If PSKs are not configured to use encryption for routing protocol authentication, this is a

    finding.'
  remediation: 'Configure one or more PSKs used to generate encryption keys for the routing protocol

    authentication process:

    apic1(config)# template cloudsec default

    apic1(config-cloudsec)# sakexpirytime__<duration>__

    apic1(config-cloudsec)# pskindex__<psk-index>__

    apic1(config-cloudsec)# pskstring__<psk-string>__'
  checks:
  - type: sql
    command: show cloudsec summary
    severity: medium
    info: 'Verify PSKs are configured:

      apic1(config-cloudsec)# show cloudsec summary

      If PSKs are not configured to use encryption for routing protocol authentication, this is a

      finding.'
- id: '1.18'
  title: CACI-RT-000018
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco ACI must be configured to authenticate all routing protocol messages using a NIST-validated FIPS
    198-1 message authentication code algorithm. GROUP ID: V-272078 RULE ID: SV-272078r1114273'
  rationale: A rogue router could send a fictitious routing update to convince a site's perimeter router to send traffic to
    an incorrect or even a rogue destination. This diverted traffic could be analyzed to learn confidential information about
    the site's network or used to disrupt the network's ability to communicate with other networks. This is known as a "traffic
    attraction attack" and is prevented by configuring neighbor router authentication for routing updates. However, using
    clear-text authentication provides little benefit since an attacker can intercept traffic and view the authentication
    key. This would allow the attacker to use the authentication key in an attack. Since MD5 is vulnerable to "birthday" attacks
    and may be compromised, routing protocol authentication must use FIPS 198-1 validated algorithms and modules to encrypt
    the authentication key. This requirement applies to all IPv4 and IPv6 protocols that are used to exchange routing or packet
    forwarding information; this includes all Interior Gateway Protocols (such as OSPF, EIGRP, and IS-IS) and Exterior Gateway
    Protocols (such as BGP), MPLS-related protocols (such as LDP), and multicast-related protocols.
  impact: ''
  references: []
  page_start: 44
  audit_raw: "If EIGRP, RIP, and IS-IS protocols are used (these protocols only support MD5\nauthentication), this is a finding.\n\
    Review the switch configuration using the show bgp and show ospf commands to verify\nBGP and OSPF. The configuration should\
    \ be similar to the example below:\nKey-Chain bgp_keys tcp\n Key 1 -- text 0 \"070e234f\"\n send-id 2\n recv-id 2\n cryptographic-algorithm\
    \ hmac-sha256\n send lifetime 3600\nIf authentication protocols that affects the routing or forwarding tables are not\
    \ configured\nto use key chain (TCP-AO) authentication with 180 maximum lifetime, this is a finding."
  remediation: 'Configure authentication for every protocol that affects the routing or forwarding tables

    to use key chain (TCP-AO) authentication. Use the following command on all supported

    control plane protocols. This typically includes protocols such as BGP and OSPF. The

    following are examples.

    1. Create a TCP-AO key chain.

    apic1(config)# ip tcp ao key chain <KEY_CHAIN_NAME>

    apic1(config)# key <KEY-ID>

    apic1(config-tcpkey chain-tcpkey)# key-string <KEY>

    apic1(config-tcpkey chain-tcpkey)# recv-id <ID>

    apic1(config-tcpkey chain-tcpkey)# send-id <ID>

    apic1(config-tcpkey chain-tcpkey)# send-lifetime <value in seconds>

    apic1(config-tcpkey chain-tcpkey)# recv-lifetime <value in seconds>

    apic1(config-tcpkey chain-tcpkey)# cryptographic-algorithm hmac-sha256

    2. Configure BGP to use the key chain for authentication.

    apic1(config)# router bgp <AS_NUMBER>

    apic1(config-router)# neighbor <peer-IP> remote-ao <KEY-CHAIN-NAME>

    apic1(config-router)# ao <KEY_CHAIN_NAME>

    3. Configure OSPF to use the key chain for authentication.

    apic1(config)# interface Ethernet1/1

    apic1(config-if)# ip address <address or range>

    apic1(config-if)# ip ospf authentication key-chain <OSPF_KEY_CHAIN>'
  checks:
  - type: sql
    command: show bgp and show ospf commands to verify
    severity: medium
    info: "If EIGRP, RIP, and IS-IS protocols are used (these protocols only support MD5\nauthentication), this is a finding.\n\
      Review the switch configuration using the show bgp and show ospf commands to verify\nBGP and OSPF. The configuration\
      \ should be similar to the example below:\nKey-Chain bgp_keys tcp\n Key 1 -- text 0 \"070e234f\"\n send-id 2\n recv-id\
      \ 2\n cryptographic-algorithm hmac-sha256\n send lifetime 3600\n"
- id: '1.19'
  title: CACI-RT-000019
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco ACI must be configured to drop all fragmented Internet Control Message Protocol (ICMP) packets destined
    to itself. GROUP ID: V-272079 RULE ID: SV-272079r1114312'
  rationale: Fragmented ICMP packets can be generated by hackers for DoS attacks such as Ping O' Death and Teardrop. It is
    imperative that all fragmented ICMP packets are dropped.
  impact: ''
  references: []
  page_start: 46
  audit_raw: 'If this review is for the DODIN Backbone, mark as not applicable.

    Review the external and internal ACLs to verify that the router is configured to only

    allow specific management and control plane traffic from specific sources destined to

    itself.

    1. Navigate Tenant >> Contract >> Filter.

    2. Select the "Drop Fragmented ICMP" filter.

    3. Verify ICMP and Fragmented are selected to be denied.

    If all fragmented ICMP packets destined to Cisco ACI IP addresses are not dropped,

    this is a finding.'
  remediation: 'Ensure this deny rule is placed before any permit rules for ICMP traffic to ensure

    fragmented ICMP packets are dropped first.

    1. Navigate Tenant >> Contract >> Filter.

    2. Create or edit a filter (e.g., "Drop Fragmented ICMP").

    3. Set Match to include:

    4. Protocol: ICMP

    5. Fragmentation: "Fragmented"

    6. Set Action to "Deny".'
  checks:
  - type: manual_review
    info: 'If this review is for the DODIN Backbone, mark as not applicable.

      Review the external and internal ACLs to verify that the router is configured to only

      allow specific management and control plane traffic from specific sources destined to

      itself.

      1. Navigate Tenant >> Contract >> Filter.

      2. Select the "Drop Fragmented ICMP" filter.

      3. Verify ICMP and Fragmented are selected to be denied.

      If all fragmented ICMP packets destined to Cisco ACI IP addresses are not dropped,

      this is a finding.'
    severity: medium
