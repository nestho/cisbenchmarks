    \ ip host 10.1.2.7 any\n deny ip any any\nip pim accept-register list PIM_REGISTER_FILTER\nIf the RP router peering with\
    \ PIM-SM routers is not configured with a policy to block\nregistration messages for any undesirable multicast groups\
    \ and sources, this is a\nfinding."
  remediation: "Configure an access list on the rendezvous point (RP) to explicitly deny PIM register\nmessages originating\
    \ from specific source-group combinations, effectively blocking the\npropagation of those multicast streams across the\
    \ network; access this configuration\nthrough the APIC's CLI using the \"accept-register\" command with the desired access\
