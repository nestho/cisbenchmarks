- id: '1.42'
  title: CNTR-K8-001400
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Kubernetes API server must use approved cipher suites. GROUP ID: V-242418 RULE ID: SV-242418r1043178'
  rationale: The Kubernetes API server communicates to the kubelet service on the nodes to deploy, update, and delete resources.
    If an attacker were able to get between this communication and modify the request, the Kubernetes cluster could be compromised.
    Using approved cypher suites for the communication ensures the protection of the transmitted information, confidentiality,
    and integrity so that the attacker cannot read or alter this communication.
  impact: ''
  references: []
