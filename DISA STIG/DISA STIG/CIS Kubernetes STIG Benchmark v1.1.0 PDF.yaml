- id: '1.67'
  title: CNTR-K8-002700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Kubernetes must remove old components after updated versions have been installed. GROUP ID: V-242442 RULE
    ID: SV-242442r961677'
  rationale: Previous versions of Kubernetes components that are not removed after updates have been installed may be exploited
    by adversaries by allowing the vulnerabilities to still exist within the cluster. It is important for Kubernetes to remove
    old pods when newer pods are created using new images to always be at the desired security state.
  impact: ''
  references: []
  page_start: 131
  audit_raw: 'To view all pods and the images used to create the pods, from the Control Plane, run

    the following command:

    kubectl get pods --all-namespaces -o jsonpath="{..image}" | \

    tr -s ''[[:space:]]'' ''\n'' | \

    sort | \

    uniq -c

    Review the images used for pods running within Kubernetes.

    If there are multiple versions of the same image, this is a finding.'
  remediation: 'Remove any old pods that are using older images. On the Control Plane, run the

    command: kubectl delete pod podname (Note: "podname" is the name of the pod to

    delete.)'
  checks:
  - type: manual_review
    info: 'To view all pods and the images used to create the pods, from the Control Plane, run

      the following command:

      kubectl get pods --all-namespaces -o jsonpath="{..image}" | \

      tr -s ''[[:space:]]'' ''\n'' | \

      sort | \

      uniq -c

      Review the images used for pods running within Kubernetes.

      If there are multiple versions of the same image, this is a finding.'
    severity: medium
- id: '1.68'
  title: CNTR-K8-002720
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Kubernetes must contain the latest updates as authorized by IAVMs, CTOs, DTMs, and STIGs. GROUP ID: V-242443
    RULE ID: SV-242443r961683'
  rationale: Kubernetes software must stay up to date with the latest patches, service packs, and hot fixes. Not updating
    the Kubernetes control plane will expose the organization to vulnerabilities. Flaws discovered during security assessments,
    continuous monitoring, incident response activities, or information system error handling must also be addressed expeditiously.
    Organization-defined time periods for updating security-relevant container platform components may vary based on a variety
    of factors including, for example, the security category of the information system or the criticality of the update (i.e.,
    severity of the vulnerability related to the discovered flaw). This requirement will apply to software patch management
    solutions that are used to install patches across the enclave and also to applications themselves that are not part of
    that patch management solution. For example, many browsers today provide the capability to install their own patch software.
    Patch criticality, as well as system criticality will vary. Therefore, the tactical situations regarding the patch management
    process will also vary. This means that the time period utilized must be a configurable parameter. Time frames for application
    of security-relevant software updates may be dependent upon the IAVM process. The container platform components will be
    configured to check for and install securityrelevant software updates within an identified time period from the availability
    of the update. The container platform registry will ensure the images are current. The specific time period will be defined
    by an authoritative source (e.g., IAVM, CTOs, DTMs, and STIGs).
  impact: ''
  references: []
  page_start: 132
  audit_raw: 'Authenticate on the Kubernetes Control Plane. Run the command:

    kubectl version --short

    If kubectl version has a setting not supporting Kubernetes skew policy, this is a finding.

    Note: Kubernetes Skew Policy can be found at:

    https://kubernetes.io/docs/setup/release/version-skew-policy/#supported-versions'
  remediation: 'Upgrade Kubernetes to the supported version. Institute and adhere to the policies and

    procedures to ensure that patches are consistently applied within the time allowed.'
  checks:
  - type: manual_review
    info: 'Authenticate on the Kubernetes Control Plane. Run the command:

      kubectl version --short

      If kubectl version has a setting not supporting Kubernetes skew policy, this is a finding.

      Note: Kubernetes Skew Policy can be found at:

