  description: 'Kubernetes Kubelet must enable kernel protection. GROUP ID: V-242434 RULE ID: SV-242434r961131'
  rationale: System kernel is responsible for memory, disk, and task management. The kernel provides a gateway between the
    system hardware and software. Kubernetes requires kernel access to allocate resources to the Control Plane. Threat actors
    that penetrate the system kernel can inject malicious code or hijack the Kubernetes architecture. It is vital to implement
    protections through Kubernetes components to reduce the attack surface.
