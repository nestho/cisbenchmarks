    expected: ''
    severity: medium
    info: 'Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

      Run the command:

      grep -i bind-address *

      If the setting bind-address is not set to "127.0.0.1" or is not found in the Kubernetes

      Controller Manager manifest file, this is a finding.'
- id: '1.11'
  title: CNTR-K8-000320
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Kubernetes API server must have the insecure port flag disabled. GROUP ID: V-242386 RULE ID: SV-242386r960792'
  rationale: By default, the API server will listen on two ports. One port is the secure port and the other port is called
    the "localhost port". This port is also called the "insecure port", port 8080. Any requests to this port bypass authentication
    and authorization checks. If this port is left open, anyone who gains access to the host on which the Control Plane is
    running can bypass all authorization and authentication mechanisms put in place, and have full control over the entire
    cluster. Close the insecure port by setting the API server's "--insecure-port" flag to "0", ensuring that the "--insecure-bind-address"
    is not set.
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

    Run the command:

    grep -i insecure-port *

    If the setting "--insecure-port" is not set to "0" or is not configured in the Kubernetes API

    server manifest file, this is a finding.

    Note: "--insecure-port" flag has been deprecated and can only be set to "0". *This flag

    will be removed in v1.24.'
  remediation: 'Edit the Kubernetes API Server manifest file in the /etc/kubernetes/manifests directory

    on the Kubernetes Control Plane.

    Set the value of "--insecure-port" to "0".'
  checks:
  - type: command
    command: grep -i insecure-port *
    expected: ''
    severity: medium
    info: 'Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

      Run the command:

      grep -i insecure-port *

      If the setting "--insecure-port" is not set to "0" or is not configured in the Kubernetes API

      server manifest file, this is a finding.

      Note: "--insecure-port" flag has been deprecated and can only be set to "0". *This flag

      will be removed in v1.24.'
- id: '1.12'
  title: CNTR-K8-000330
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Kubernetes Kubelet must have the "readOnlyPort" flag disabled. GROUP ID: V-242387 RULE ID: SV-242387r960792'
  rationale: Kubelet serves a small REST API with read access to port 10255. The read-only port for Kubernetes provides no
    authentication or authorization security control. Providing unrestricted access on port 10255 exposes Kubernetes pods
    and containers to malicious attacks or compromise. Port 10255 is deprecated and should be disabled.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'On each Control Plane and Worker Node, run the command:

    ps -ef | grep kubelet

    If the "--read-only-port" option exists, this is a finding.

    Note the path to the config file (identified by --config).

    Run the command:

    grep -i readOnlyPort <path_to_config_file>

    If the setting "readOnlyPort" exists and is not set to "0", this is a finding.'
  remediation: 'On each Control Plane and Worker Node, run the command:

    ps -ef | grep kubelet

    Remove the "--read-only-port" option if present.

    Note the path to the config file (identified by --config).

    Edit the config file: Set "readOnlyPort" to "0" or remove the setting.

    Restart the kubelet service using the following command:

    systemctl daemon-reload && systemctl restart kubelet'
  checks:
  - type: command
    command: ps -ef | grep kubelet && grep -i readOnlyPort <path_to_config_file>
    expected: ''
    severity: medium
    info: 'On each Control Plane and Worker Node, run the command:

      ps -ef | grep kubelet

      If the "--read-only-port" option exists, this is a finding.

      Note the path to the config file (identified by --config).

      Run the command:

      grep -i readOnlyPort <path_to_config_file>

      If the setting "readOnlyPort" exists and is not set to "0", this is a finding.'
- id: '1.13'
  title: CNTR-K8-000340
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Kubernetes API server must have the insecure bind address not set. GROUP ID: V-242388 RULE ID: SV-242388r960792'
  rationale: By default, the API server will listen on two ports and addresses. One address is the secure address and the
    other address is called the "insecure bind" address and is set by default to localhost. Any requests to this address bypass
    authentication and authorization checks. If this insecure bind address is set to localhost, anyone who gains access to
    the host on which the Control Plane is running can bypass all authorization and authentication mechanisms put in place
    and have full control over the entire cluster. Close or set the insecure bind address by setting the API server's "--insecure-bindaddress"
    flag to an IP or leave it unset and ensure that the "--insecure-bind-port" is not set.
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

    Run the command:

    grep -i insecure-bind-address

    ```*

    If the setting "--insecure-bind-address" is found and set to "localhost" in

    the Kubernetes API manifest file, this is a finding.'
  remediation: 'Edit the Kubernetes API Server manifest file in the /etc/kubernetes/manifests directory

    on the Kubernetes Control Plane.

    Remove the value of "--insecure-bind-address" setting.'
  checks:
  - type: command
    command: grep -i insecure-bind-address
    expected: ''
    severity: medium
    info: 'Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

      Run the command:

      grep -i insecure-bind-address

      ```*

      If the setting "--insecure-bind-address" is found and set to "localhost" in

      the Kubernetes API manifest file, this is a finding.'
- id: '1.14'
  title: CNTR-K8-000350
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Kubernetes API server must have the secure port set. GROUP ID: V-242389 RULE ID: SV-242389r960792'
  rationale: By default, the API server will listen on what is rightfully called the secure port, port 6443. Any requests
    to this port will perform authentication and authorization checks. If this port is disabled, anyone who gains access to
    the host on which the Control Plane is running has full control of the entire cluster over encrypted traffic. Open the
    secure port by setting the API server's "--secure-port" flag to a value other than "0".
  impact: ''
  references: []
  page_start: 34
  audit_raw: 'Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

    Run the command:

    grep -i secure-port *

    If the setting "--secure-port" is set to "0" or is not configured in the Kubernetes API

    manifest file, this is a finding.'
  remediation: 'Edit the Kubernetes API Server manifest file in the /etc/kubernetes/manifests directory

    on the Kubernetes Control Plane.

    Set the value of "--secure-port" to a value greater than "0".'
  checks:
  - type: command
    command: grep -i secure-port *
    expected: ''
    severity: medium
    info: 'Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

      Run the command:

      grep -i secure-port *

      If the setting "--secure-port" is set to "0" or is not configured in the Kubernetes API

      manifest file, this is a finding.'
- id: '1.15'
  title: CNTR-K8-000360
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Kubernetes API server must have anonymous authentication disabled. GROUP ID: V-242390 RULE ID: SV-242390r960792'
  rationale: The Kubernetes API Server controls Kubernetes via an API interface. A user who has access to the API essentially
    has root access to the entire Kubernetes cluster. To control access, users must be authenticated and authorized. By allowing
    anonymous connections, the controls put in place to secure the API can be bypassed. Setting "--anonymous-auth" to "false"
    also disables unauthenticated requests from kubelets. While there are instances where anonymous connections may be needed
    (e.g., health checks) and Role-Based Access Controls (RBACs) are in place to limit the anonymous access, this access should
    be disabled, and only enabled when necessary.
  impact: ''
  references: []
  page_start: 35
  audit_raw: 'Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

    Run the command:

    grep -i anonymous-auth *

    If the setting "--anonymous-auth" is set to "true" in the Kubernetes API Server manifest

    file, this is a finding.'
  remediation: 'Edit the Kubernetes API Server manifest file in the /etc/kubernetes/manifests directory

    on the Kubernetes Control Plane.

    Set the value of "--anonymous-auth" to "false".'
  checks:
  - type: command
    command: grep -i anonymous-auth *
    expected: ''
    severity: medium
    info: 'Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

      Run the command:

      grep -i anonymous-auth *

      If the setting "--anonymous-auth" is set to "true" in the Kubernetes API Server manifest

      file, this is a finding.'
- id: '1.16'
  title: CNTR-K8-000380
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Kubernetes kubelet must enable explicit authorization. GROUP ID: V-242392 RULE ID: SV-242392r1069461'
  rationale: Kubelet is the primary agent on each node. The API server communicates with each kubelet to perform tasks such
    as starting/stopping pods. By default, kubelets allow all authenticated requests, even anonymous ones, without requiring
    any authorization checks from the API server. This default behavior bypasses any authorization controls put in place to
    limit what users may perform within the Kubernetes cluster. To change this behavior, the default setting of AlwaysAllow
    for the authorization mode must be set to "Webhook".
  impact: ''
  references: []
  page_start: 37
  audit_raw: 'Run the following command on each Worker Node: ps -ef | grep kubelet Verify that the -

    -authorization-mode exists and is set to "Webhook".

    If the --authorization-mode argument is not set to "Webhook" or doesn''t exist, this is a

    finding.'
  remediation: 'Edit the Kubernetes Kubelet service file in the --config directory on the Kubernetes

    Worker Node:

    Set the value of "--authorization-mode" to "Webhook" in

    KUBELET_SYSTEM_PODS_ARGS variable.

    Restart the kubelet service using the following command:

    systemctl daemon-reload && systemctl restart kubelet'
  checks:
  - type: command
    command: 'Run the following command on each Worker Node: ps -ef | grep kubelet Verify that the -'
    expected: 'Run the following command on each Worker Node: ps -ef | grep kubelet Verify that the -'
    severity: medium
    info: 'Run the following command on each Worker Node: ps -ef | grep kubelet Verify that the -

      -authorization-mode exists and is set to "Webhook".

      If the --authorization-mode argument is not set to "Webhook" or doesn''t exist, this is a

      finding.'
- id: '1.17'
  title: CNTR-K8-000370
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Kubernetes Kubelet must have anonymous authentication disabled. GROUP ID: V-242391 RULE ID: SV-242391r960792'
  rationale: A user who has access to the Kubelet essentially has root access to the nodes contained within the Kubernetes
    Control Plane. To control access, users must be authenticated and authorized. By allowing anonymous connections, the controls
    put in place to secure the Kubelet can be bypassed. Setting anonymous authentication to "false" also disables unauthenticated
    requests from kubelets. While there are instances where anonymous connections may be needed (e.g., health checks) and
    Role-Based Access Controls (RBAC) are in place to limit the anonymous access, this access must be disabled and only enabled
    when necessary.
  impact: ''
  references: []
  page_start: 38
  audit_raw: 'On each Control Plane and Worker Node, run the command:

    ps -ef | grep kubelet

    If the "" option exists, this is a finding.

    Note the path to the config file (identified by --config).

    Inspect the content of the config file: Locate the "anonymous" section under

    "authentication". In this section, if the field "enabled" does not exist or is set to "true",

    this is a finding.'
  remediation: 'On each Control Plane and Worker Node, run the command:

    ps -ef | grep kubelet

    Remove the "anonymous-auth" option if present.

    Note the path to the config file (identified by --config).

    Edit the config file: Locate the "authentication" section and the "anonymous" subsection.

    Within the "anonymous" subsection, set "enabled" to "false".

    Restart the kubelet service using the following command:

    systemctl daemon-reload && systemctl restart kubelet'
  checks:
  - type: command
    command: ps -ef | grep kubelet
    expected: ''
    severity: medium
    info: 'On each Control Plane and Worker Node, run the command:

      ps -ef | grep kubelet

      If the "" option exists, this is a finding.

      Note the path to the config file (identified by --config).

      Inspect the content of the config file: Locate the "anonymous" section under

      "authentication". In this section, if the field "enabled" does not exist or is set to "true",

      this is a finding.'
