  description: 'Kubernetes DynamicAuditing must not be enabled. GROUP ID: V-242398 RULE ID: SV-242398r960792'
  rationale: Protecting the audit data from change or deletion is important when an attack occurs. One way an attacker can
    cover their tracks is to change or delete audit records. This will either make the attack unnoticeable or make it more
    difficult to investigate how the attack took place and what changes were made. The audit data can be protected through
