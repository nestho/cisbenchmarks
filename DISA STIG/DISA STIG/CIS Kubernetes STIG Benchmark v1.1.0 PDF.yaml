      Note: In the above command, "podname" is the name of the pod. For the comma'
- id: '1.39'
  title: CNTR-K8-001160
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Secrets in Kubernetes must not be stored as environment variables. GROUP ID: V-242415 RULE ID: SV-242415r1069466'
  rationale: Secrets, such as passwords, keys, tokens, and certificates must not be stored as environment variables. These
    environment variables are accessible inside Kubernetes by the "Get Pod" API call, and by any system, such as CI/CD pipeline,
    which has access to the definition file of the container. Secrets must be mounted from files or stored within password
    vaults.
  impact: ''
  references: []
  page_start: 77
  audit_raw: "Follow these steps to check, from the Kubernetes control plane, if secrets are stored as\nenvironment variables.\n\
    1. Find All Pods Using Secrets in Environment Variables.\nTo list all pods using secrets as environment variables, execute:\n\
    kubectl get pods --all-namespaces -o yaml | grep -A5 \"secretKeyRef\"\nIf any of the values returned reference environment\
    \ variables, this is a finding.\n2. Check Environment Variables in a Specific Pod.\nTo check if a specific pod is using\
    \ secrets as environment variables, execute:\nkubectl get pods -n <namespace>\n(Replace <namespace> with the actual namespace,\
    \ or omit -n <namespace> to\ncheck in the default namespace.)\nkubectl describe pod <pod-name> -n <namespace> | grep -A5\
    \ \"Environment:\"\nIf secrets are used, output like the following will be displayed:\nEnvironment:\n SECRET_USERNAME:\
    \ <set from secret: my-secret key: username>\n SECRET_PASSWORD: <set from secret: my-secret key: password>\nIf the output\
    \ is similar to this, the pod is using Kubernetes secrets as environment\nvariables, and this is a finding.\n3. Check\
    \ the Pod YAML for Secret Usage.\nTo check the full YAML definition for environment variables, execute:\nkubectl get pod\
    \ <pod-name> -n <namespace> -o yaml | grep -A5 \"env:\"\nExample output:\nyaml\nCopyEdit\nenv:\n - name: SECRET_USERNAME\n\
    \ valueFrom:\n secretKeyRef:\n name: my-secret\n key: username\nThis means the pod is pulling the secret named my-secret\
    \ and setting\nSECRET_USERNAME from its username key.\nIf the pod is pulling a secret and setting an environment variable\
    \ in the \"env:\", this is a\nfinding.\n4. Check Secrets in a Deployment, StatefulSet, or DaemonSet.\nIf the pod is managed\
    \ by a Deployment, StatefulSet, or DaemonSet, check their\nconfigurations:\nkubectl get deployment <deployment-name> -n\
    \ <namespace> -o yaml | grep -A5\n\"env:\"\nor\nFor all Deployments in all namespaces:\nkubectl get deployments --all-namespaces\
    \ -o yaml | grep -A5 \"env:\"\nIf the pod is pulling a secret and setting an environment variable in the \"env:\", this\
    \ is a\nfinding.\n5. Check Environment Variables Inside a Running Pod.\nIf needed, check the environment variables inside\
    \ a running pod:\nkubectl exec -it <pod-name> -n <namespace> -- env | grep SECRET\nIf any of the values returned reference\
    \ environment variables, this is a finding."
  remediation: 'Any secrets stored as environment variables must be moved to the secret files with the

    proper protections and enforcements or placed within a password vault.'
  checks:
  - type: command
    command: kubectl get pods --all-namespaces -o yaml | grep -A5 "secretKeyRef" && kubectl describe pod <pod-name> -n <namespace>
      | grep -A5 "Environment:" && kubectl get pod <pod-name> -n <namespace> -o yaml | grep -A5 "env:" && kubectl get deployment
      <deployment-name> -n <namespace> -o yaml | grep -A5 && kubectl get deployments --all-namespaces -o yaml | grep -A5 "env:"
      && kubectl exec -it <pod-name> -n <namespace> -- env | grep SECRET
    expected: ''
    severity: medium
    info: 'Follow these steps to check, from the Kubernetes control plane, if secrets are stored as

      environment variables.

      1. Find All Pods Using Secrets in Environment Variables.

      To list all pods using secrets as environment variables, execute:

      kubectl get pods --all-namespaces -o yaml | grep -A5 "secretKeyRef"

      If any of the values returned reference environment variables, this is a finding.

      2. Check Enviro'
- id: '1.40'
  title: CNTR-K8-001300
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'Kubernetes Kubelet must not disable timeouts. GROUP ID: V-245541 RULE ID: SV-245541r1069469'
  rationale: Idle connections from the Kubelet can be used by unauthorized users to perform malicious activity to the nodes,
    pods, containers, and cluster within the Kubernetes Control Plane. Setting the streamingConnectionIdleTimeout defines
    the maximum time an idle session is permitted prior to disconnect. Setting the value to "0" never disconnects any idle
