  description: 'Kubernetes etcd must have a certificate for communication. GROUP ID: V-242430 RULE ID: SV-242430r1043178'
  rationale: Kubernetes stores configuration and state information in a distributed key-value store called etcd. Anyone who
    can write to etcd can effectively control the Kubernetes cluster. Even just reading the contents of etcd could easily
    provide helpful hints to a would-be attacker. Using authenticity protection, the communication can be protected against
    man-in-the-middle attacks/session hijacking and the insertion of false information into sessions. The communication session
