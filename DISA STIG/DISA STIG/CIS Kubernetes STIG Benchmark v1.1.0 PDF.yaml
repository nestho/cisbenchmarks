- id: '1.6'
  title: CNTR-K8-000220
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Kubernetes Controller Manager must create unique service accounts for each work payload. GROUP ID: V-242381
    RULE ID: SV-242381r1043176'
  rationale: The Kubernetes Controller Manager is a background process that embeds core control loops regulating cluster system
    state through the API Server. Every process executed in a pod has an associated service account. By default, service accounts
    use the same credentials for authentication. Implementing the default settings poses a High risk to the Kubernetes Controller
    Manager. Setting the "--use-service-account-credential" value lowers the attack surface by generating unique service accounts
    settings for each controller instance.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

    Run the command:

    grep -i use-service-account-credentials *

    If the setting "--use-service-account-credentials" is not configured in the Kubernetes

    Controller Manager manifest file or it is set to "false", this is a finding.'
  remediation: 'Edit the Kubernetes Controller Manager manifest file in the /etc/kubernetes/manifests

    directory on the Kubernetes Control Plane.

    Set the value of "--use-service-account-credentials" to "true".'
  checks:
  - type: command
    command: grep -i use-service-account-credentials *
    expected: ''
    severity: medium
    info: 'Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

      Run the command:

      grep -i use-service-account-credentials *

      If the setting "--use-service-account-credentials" is not configured in the Kubernetes

      Controller Manager manifest file or it is set to "false", this is a finding.'
- id: '1.7'
  title: CNTR-K8-000270
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Kubernetes API Server must enable Node,RBAC as the authorization mode. GROUP ID: V-242382 RULE ID: SV-242382r960792'
  rationale: 'To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates
    by DOD-approved PKIs, all DOD systems (e.g., networks, web servers, and web portals) must be properly configured to incorporate
    access control methods that do not rely solely on the possession of a certificate for access. Successful authentication
    must not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must
    be implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the
    process of determining whether an entity, once authenticated, is permitted to access a specific asset. Node,RBAC is the
    method within Kubernetes to control access of users and applications. Kubernetes uses roles to grant authorization API
    requests made by kubelets. Satisfies: SRG-APP-000340-CTR-000770, SRG-APP-000033-CTR-000095, SRG-APP000378-CTR-000880,
    SRG-APP-000033-CTR-000090'
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

    Run the command:

    grep -i authorization-mode *

    If the setting authorization-mode is set to "AlwaysAllow" in the Kubernetes API Server

    manifest file or is not configured, this is a finding.'
  remediation: 'Edit the Kubernetes API Server manifest file in the /etc/kubernetes/manifests directory

    on the Kubernetes Control Plane.

    Set the value of "--authorization-mode" to "Node,RBAC".'
  checks:
  - type: command
    command: grep -i authorization-mode *
    expected: ''
    severity: medium
    info: 'Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

      Run the command:

      grep -i authorization-mode *

      If the setting authorization-mode is set to "AlwaysAllow" in the Kubernetes API Server

      manifest file or is not configured, this is a finding.'
- id: '1.8'
  title: CNTR-K8-000290
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'User-managed resources must be created in dedicated namespaces. GROUP ID: V-242383 RULE ID: SV-242383r960801'
  rationale: Creating namespaces for user-managed resources is important when implementing Role-Based Access Controls (RBAC).
    RBAC allows for the authorization of users and helps support proper API server permissions separation and network micro
    segmentation. If user-managed resources are placed within the default namespaces, it becomes impossible to implement policies
    for RBAC permission, service account usage, network policies, and more.
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'To view the available namespaces, run the command:

    kubectl get namespaces

    The default namespaces to be validated are default, kube-public, and kube-node-lease

    if it is created.

    For the default namespace, execute the commands:

    kubectl config set-context --current --namespace=default

    kubectl get all

    For the kube-public namespace, execute the commands:

    kubectl config set-context --current --namespace=kube-public

    kubectl get all

    For the kube-node-lease namespace, execute the commands:

    kubectl config set-context --current --namespace=kube-node-lease

    kubectl get all

    The only valid return values are the kubernetes service (i.e., service/kubernetes) and

    nothing at all.

    If a return value is returned from the "kubectl get all" command and it is not the

    kubernetes service (i.e., service/kubernetes), this is a finding.'
  remediation: 'Move any user-managed resources from the default, kube-public, and kube-node-lease

    namespaces to user namespaces.'
  checks:
  - type: manual_review
    info: 'To view the available namespaces, run the command:

      kubectl get namespaces

      The default namespaces to be validated are default, kube-public, and kube-node-lease

      if it is created.

      For the default namespace, execute the commands:

      kubectl config set-context --current --namespace=default

      kubectl get all

      For the kube-public namespace, execute the commands:

      kubectl config set-context --current --namespace=kube-public

      kubectl get all

      For the kube-node-lease namespace, execute the commands:

      kubectl config'
    severity: medium
- id: '1.9'
  title: CNTR-K8-000300
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Kubernetes Scheduler must have secure binding. GROUP ID: V-242384 RULE ID: SV-242384r960792'
  rationale: Limiting the number of attack vectors and implementing authentication and encryption on the endpoints available
    to external sources is paramount when securing the overall Kubernetes cluster. The Scheduler API service exposes port
    10251/TCP by default for health and metrics information use. This port does not encrypt or authenticate connections. If
    this port is exposed externally, an attacker can use this port to attack the entire Kubernetes cluster. By setting the
    bind address to localhost (i.e., 127.0.0.1), only those internal services that require health and metrics information
    can access the Scheduler API.
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

    Run the command:

    grep -i bind-address *

    If the setting "bind-address" is not set to "127.0.0.1" or is not found in the Kubernetes

    Scheduler manifest file, this is a finding.'
  remediation: 'Edit the Kubernetes Scheduler manifest file in the /etc/kubernetes/manifests directory

    on the Kubernetes Control Plane. Set the argument "--bind-address" to "127.0.0.1".'
  checks:
  - type: command
    command: grep -i bind-address *
    expected: ''
    severity: medium
    info: 'Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

      Run the command:

      grep -i bind-address *

      If the setting "bind-address" is not set to "127.0.0.1" or is not found in the Kubernetes

      Scheduler manifest file, this is a finding.'
- id: '1.10'
  title: CNTR-K8-000310
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Kubernetes Controller Manager must have secure binding. GROUP ID: V-242385 RULE ID: SV-242385r960792'
  rationale: Limiting the number of attack vectors and implementing authentication and encryption on the endpoints available
