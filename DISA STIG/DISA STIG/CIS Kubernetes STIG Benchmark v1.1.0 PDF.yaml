- id: '1.61'
  title: CNTR-K8-002010
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Kubernetes must have a pod security policy set. GROUP ID: V-242437 RULE ID: SV-242437r961359'
  rationale: Enabling the admissions webhook allows for Kubernetes to apply policies against objects that are to be created,
    read, updated, or deleted. By applying a pod security policy, control can be given to not allow images to be instantiated
    that run as the root user. If pods run as the root user, the pod then has root privileges to the host system and all the
    resources it has. An attacker can use this to attack the Kubernetes cluster. By implementing a policy that does not allow
    root or privileged pods, the pod users are limited in what the pod can do and access.
  impact: ''
  references: []
  page_start: 121
  audit_raw: 'Prior to version 1.21, to enforce security policiesPod Security Policies (psp) were used.

    Those are now deprecated and will be removed from version 1.25.

    Migrate from PSP to PSA: https://kubernetes.io/docs/tasks/configure-podcontainer/migrate-from-psp/

    Pre-version 1.25 Check: On the Control Plane, run the command:

    kubectl get podsecuritypolicy

    If there is no pod security policy configured, this is a finding.

    For any pod security policies listed, edit the policy with the command:

    kubectl edit podsecuritypolicy policyname

    (Note: "policyname" is the name of the policy.)

    Review the runAsUser, supplementalGroups and fsGroup sections of the policy.

    If any of these sections are missing, this is a finding.

    If the rule within the runAsUser section is not set to "MustRunAsNonRoot", this is a

    finding.

    If the ranges within the supplementalGroups section has min set to "0" or min is

    missing, this is a finding.

    If the ranges within the fsGroup section has a min set to "0" or the min is missing, this is

    a finding.'
  remediation: 'From the Control Plane, save the following policy to a file called restricted.yml.

    apiVersion: policy/v1beta1 kind: PodSecurityPolicy metadata: name: restricted

    annotations: apparmor.security.beta.kubernetes.io/allowedProfileNames:

    ''runtime/default'', seccomp.security.alpha.kubernetes.io/defaultProfileName:

    ''runtime/default'', apparmor.security.beta.kubernetes.io/defaultProfileName:

    ''runtime/default'' spec: privileged: false

    Required to prevent escalations to root.

    allowPrivilegeEscalation: false

    This is redundant with non-root + disallow privilege

    escalation,

    but we can provide it for defense in depth.

    requiredDropCapabilities:

    • ALL

    Allow core volume types.

    volumes:

    • ''configMap''

    • ''emptyDir''

    • ''projected''

    • ''secret''

    • ''downwardAPI''

    Assume that persistentVolumes set up by the cluster admin

    are safe to use.

    • ''persistentVolumeClaim''

    hostNetwork: false hostIPC: false hostPID: false runAsUser:

    Require the container to run without root privileges.

    rule: ''MustRunAsNonRoot'' seLinux:

    This policy assumes the nodes are using AppArmor rather

    than SELinux.

    rule: ''RunAsAny'' supplementalGroups: rule: ''MustRunAs'' ranges:

    Forbid adding the root group.

    • min: 1

    max: 65535 fsGroup: rule: ''MustRunAs'' ranges:

    Forbid adding the root group.

    • min: 1

    max: 65535 readOnlyRootFilesystem: false

    To implement the policy, run the command:

    kubectl create -f restricted.yml'
  checks:
  - type: manual_review
    info: 'Prior to version 1.21, to enforce security policiesPod Security Policies (psp) were used.

      Those are now deprecated and will be removed from version 1.25.

      Migrate from PSP to PSA: https://kubernetes.io/docs/tasks/configure-podcontainer/migrate-from-psp/

      Pre-version 1.25 Check: On the Control Plane, run the command:

      kubectl get podsecuritypolicy

      If there is no pod security policy configured, this is a finding.

      For any pod security policies listed, edit the policy with the command:

      kubectl edit pod'
    severity: medium
- id: '1.62'
  title: CNTR-K8-002011
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'Kubernetes must have a Pod Security Admission control file configured. GROUP ID: V-254800 RULE ID: SV-254800r961359'
  rationale: An admission controller intercepts and processes requests to the Kubernetes API prior to persistence of the object,
    but after the request is authenticated and authorized. Kubernetes (> v1.23)offers a built-in Pod Security admission controller
    to enforce the Pod Security Standards. Pod security restrictions are applied at the namespace level when pods are created.
    The Kubernetes Pod Security Standards define different isolation levels for Pods. These standards define how to restrict
    the behavior of pods in a clear, consistent fashion.
  impact: ''
  references: []
  page_start: 124
  audit_raw: 'Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

    Run the command:

    "grep -i admission-control-config-file *"

    If the setting "--admission-control-config-file" is not configured in the Kubernetes API

    Server manifest file, this is a finding.

    Inspect the .yaml file defined by the --admission-control-config-file. Verify PodSecurity is

    properly configured. If least privilege is not represented, this is a finding.'
  remediation: "Edit the Kubernetes API Server manifest file in the /etc/kubernetes/manifests directory\non the Kubernetes\
    \ Control Plane.\nSet the value of \"--admission-control-config-file\" to a valid path for the file.\nCreate an admission\
    \ controller config file: Example File:\napiVersion: apiserver.config.k8s.io/v1\nkind: AdmissionConfiguration\nplugins:\n\
    - name: PodSecurity\n configuration:\n apiVersion: pod-security.admission.config.k8s.io/v1beta1\n kind: PodSecurityConfiguration\n\
    \ # Defaults applied when a mode label is not set.\n defaults:\n enforce: \"privileged\"\n enforce-version: \"latest\"\
    \n exemptions:\n # Don't forget to exempt namespaces or users that are responsible for\ndeploying\n # cluster components,\
    \ because they need to run privileged containers\n usernames: [\"admin\"]\n namespaces: [\"kube-system\"]\nSee for more\
    \ details:\nMigrate from PSP to PSA:\nhttps://kubernetes.io/docs/tasks/configure-pod-container/migrate-from-psp/\nBest\
    \ Practice: https://kubernetes.io/docs/concepts/security/pod-securitypolicy/#recommended-practice."
  checks:
  - type: manual_review
    info: 'Change to the /etc/kubernetes/manifests directory on the Kubernetes Control Plane.

      Run the command:

      "grep -i admission-control-config-file *"

      If the setting "--admission-control-config-file" is not configured in the Kubernetes API

      Server manifest file, this is a finding.

      Inspect the .yaml file defined by the --admission-control-config-file. Verify PodSecurity is

      properly configured. If least privilege is not represented, this is a finding.'
    severity: medium
