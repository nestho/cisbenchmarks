- id: '1.22'
  title: CNTR-K8-000440
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Kubernetes kubelet staticPodPath must not enable static pods. GROUP ID: V-242397 RULE ID: SV-242397r1069464'
  rationale: Allowing kubelet to set a staticPodPath gives containers with root access permissions to traverse the hosting
    filesystem. The danger comes when the container can create a manifest file within the /etc/kubernetes/manifests directory.
    When a manifest is created within this directory, containers are entirely governed by the Kubelet not the API Server.
    The container is not susceptible to admission control at all. Any containers or pods instantiated in this manner are called
    "static pods" and are meant to be used for pods such as the API server, scheduler, controller, etc., not workload pods
    that need to be governed by the API Server.
  impact: ''
  references: []
  page_start: 45
  audit_raw: "If staticPodPath is missing in the Kubelet config and in the systemd arguments, the\nnode does not support static\
    \ pods.\n1. To find the staticPodPath setting on Kubernetes worker nodes, follow these\nsteps:\na. On the Worker nodes,\
    \ run the command:\n ps -ef | grep kubelet\nb. Note the path to the Kubelet configuration file (identified by --config).\
    \ (ls\n/var/lib/kubelet/config.yaml is the common location.)\nc. Run the command:\ngrep -i staticPodPath <path_to_config_file>\n\
    If any of the Worker nodes return a value for \"staticPodPath\", this is a finding.\nIf staticPodPath is not in the config\
    \ file, check if it is set as a command-line argument.\n2. Check Kubelet Systemd Service Arguments.\na. Run the following\
    \ command to check the Kubelet service:\nsudo systemctl cat kubelet | grep pod-manifest-path\nIf there is no output, staticPodPath\
    \ is not set in systemd arguments.\nIf there is any return, this is a finding.\n(Example Return:ExecStart=/usr/bin/kubelet\
    \ --pod-manifestpath=/etc/kubernetes/manifests\nThis means static pods are defined in /etc/kubernetes/manifests.)"
  remediation: "1. Remove staticPodPath setting on Kubernetes worker nodes:\na. On each Worker node, run the command:\n ps\
    \ -ef | grep kubelet\nb. Note the path to the config file (identified by --config).\nc. Edit the Kubernetes kubelet file\
    \ in the --config directory on the Worker nodes.\nRemove the setting \"staticPodPath\".\nd. Restart the kubelet service\
    \ using the following command:\nsystemctl daemon-reload && systemctl restart kubelet\n2. Remove Kubelet Systemd Service\
    \ Arguments:\na. Modify the systemd Service File. Run the command:\nsudo systemctl edit --full kubelet\n(Example Return:ExecStart=/usr/bin/kubelet\
    \ --pod-manifestpath=/etc/kubernetes/manifests)\nb. Find and remove --pod-manifest-path.\nc. Save and exit the editor.\n\
    d. Restart the kubelet service using the following command:\n systemctl daemon-reload && systemctl restart kubelet"
  checks:
  - type: command
    command: ps -ef | grep kubelet && grep -i staticPodPath <path_to_config_file> && sudo systemctl cat kubelet | grep pod-manifest-path
    expected: ''
    severity: medium
    info: "If staticPodPath is missing in the Kubelet config and in the systemd arguments, the\nnode does not support static\
      \ pods.\n1. To find the staticPodPath setting on Kubernetes worker nodes, follow these\nsteps:\na. On the Worker nodes,\
      \ run the command:\n ps -ef | grep kubelet\nb. Note the path to the Kubelet configuration file (identified by --config).\
      \ (ls\n/var/lib/kubelet/config.yaml is the common location"
