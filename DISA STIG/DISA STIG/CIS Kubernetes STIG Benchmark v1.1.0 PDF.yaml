- id: '1.21'
  title: CNTR-K8-000430
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Kubernetes Kubectl cp command must give expected access and results. GROUP ID: V-242396 RULE ID: SV-242396r960792'
  rationale: One of the tools heavily used to interact with containers in the Kubernetes cluster is kubectl. The command is
    the tool System Administrators used to create, modify, and delete resources. One of the capabilities of the tool is to
    copy files to and from running containers (i.e., kubectl cp). The command uses the "tar" command of the container to copy
    files from the container to the host executing the "kubectl cp" command. If the "tar" command on the container has been
    replaced by a malicious user, the command can copy files anywhere on the host machine. This flaw has been fixed in later
    versions of the tool. It is recommended to use kubectl versions newer than 1.12.9.
  impact: ''
  references: []
