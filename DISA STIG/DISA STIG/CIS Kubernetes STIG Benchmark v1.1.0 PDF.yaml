- id: '1.24'
  title: CNTR-K8-000460
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Kubernetes DynamicKubeletConfig must not be enabled. GROUP ID: V-242399 RULE ID: SV-242399r960792'
  rationale: Kubernetes allows a user to configure kubelets with dynamic configurations. When dynamic configuration is used,
    the kubelet will watch for changes to the configuration file. When changes are made, the kubelet will automatically restart.
    Allowing this capability bypasses access restrictions and authorizations. Using this capability, an attacker can lower
    the security posture of the kubelet, which includes allowing the ability to run arbitrary commands in any container running
    on that node.
  impact: ''
  references: []
