    \ leaf 1017 int eth 1/20\n# Time: Mon Jun 27 22:12:10 2016\n leaf 1017\n interface ethernet 1/20\n policy-group pg3\n\
    If physical or logical separation of subnetworks to isolate organization-defined critical\nsystem components and functions\
    \ has not been implemented, this is a finding."
  remediation: "Configure one or more Cisco ACI contracts and/or segmentation capabilities to provide\nsegmentation within\
