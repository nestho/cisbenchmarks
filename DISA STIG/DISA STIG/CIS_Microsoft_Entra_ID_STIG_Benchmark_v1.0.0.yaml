controls:
- id: '1.1'
  title: ENTR-ID-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Microsoft Entra ID must initiate a session lock after a 15-minute period of inactivity. GROUP ID: V-270200
    RULE ID: SV-270200r1085610'
  rationale: 'Session locks are temporary actions taken to prevent logical access to organizational systems when users stop
    work and move away from the immediate vicinity of those systems but do not want to log out because of the temporary nature
    of their absences. Session locks can be implemented at the operating system level or at the application level. A proximity
    lock may be used to initiate the session lock (e.g., via a Bluetoothenabled session or dongle). User-initiated session
    locking is behavior or policy-based and, as such, requires users to take physical action to initiate the session lock.
    Session locks are not an acceptable substitute for logging out of systems, such as when organizations require users to
    log out at the end of workdays. Satisfies: SRG-APP-000295'
  impact: ''
  references: []
  page_start: 10
  audit_raw: 'To verify the inactivity timeout is configured for 15 minutes or less, follow the steps

    outlined below:

    1. Sign in to entra.microsoft.us.

    2. Navigate to the Gear icon (right) and select Settings >> Signing out +

    notifications.

    3. Check that the "Enable directory level idle timeout" is selected.

    4. Verify the Signing out value is 15 minutes or less.

    If the directory level idle timeout is not set to 15 minutes or less, this is a finding.'
  remediation: '1. Sign into entra.microsoft.us.

    2. Navigate to the Gear icon (right) and select Settings >> Signing out +

    notifications.

    3. Check the "Enable directory level idle timeout" box.

    4. Populate the "Hours" field to "0" and the "Minutes" field to "15".

    5. Click "Apply".'
  checks:
  - type: manual_review
    info: 'To verify the inactivity timeout is configured for 15 minutes or less, follow the steps

      outlined below:

      1. Sign in to entra.microsoft.us.

      2. Navigate to the Gear icon (right) and select Settings >> Signing out +

      notifications.

      3. Check that the "Enable directory level idle timeout" is selected.

      4. Verify the Signing out value is 15 minutes or less.

      If the directory level idle timeout is not set to 15 minutes or less, this is a finding.'
    severity: medium
- id: '1.2'
  title: ENTR-ID-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Microsoft Entra ID must automatically disable accounts after a 35-day period of account inactivity. GROUP
    ID: V-270204 RULE ID: SV-270204r1085660'
  rationale: Attackers that are able to exploit an inactive account can potentially obtain and maintain undetected access
    to an application. Owners of inactive accounts will not notice if unauthorized access to their user account has been obtained.
    Applications need to track periods of user inactivity and disable accounts after 35 days of inactivity. Such a process
    greatly reduces the risk that accounts will be hijacked, leading to a data compromise. To address access requirements,
    many application developers choose to integrate their applications with enterprise-level authentication/access mechanisms
    that meet or exceed access control policy requirements. Such integration allows the application developer to offload those
    access control functions and focus on core application features and functionality. This policy does not apply to either
    emergency accounts or infrequently used accounts. Infrequently used accounts are local login administrator accounts used
    by system administrators when network or normal logon/access is not available. Emergency accounts are administrator accounts
    created in response to crisis situations.
  impact: ''
  references: []
  page_start: 11
  audit_raw: "Verify Entra ID disables accounts after 35 days of inactivity.\nUse the following procedure to discover inactive\
    \ user accounts in Entra ID (35+ days)\nvia the use of the Graph PowerShell SDK.\nInstallation instructions:\nhttps://learn.microsoft.com/en-us/powershell/microsoftgraph/installation?view=graphpowershell-1.0\n\
    Required roles:\nAt least Global Reader\nRequired tenant license:\nEntra ID Premium P1\nExample PowerShell commands:\n\
    Connect-MgGraph -Scopes AuditLog.Read.All,User.Read.All -Environment USGov\n$inactiveDate = (Get-Date).AddDays(-35)\n\
    $users = Get-MgUser -All:$true -Property Id, DisplayName, UserPrincipalName,\nUserType, createdDateTime, SignInActivity,\
    \ AccountEnabled | Where-Object {\n$_.AccountEnabled -eq $true }\n$inactiveUsers =\n$users | Where-Object {\n ($_.SignInActivity.LastSignInDateTime\
    \ -lt $inactiveDate) -or\n($_.SignInActivity.LastSignInDateTime -eq $null -and $_.CreatedDateTime -lt\n$inactiveDate)\n\
    } | Select-Object DisplayName, UserPrincipalName, UserType, createdDateTime,\n@{Name = 'LastSignInDateTime'; Expression\
    \ =\n{($_.SignInActivity).LastSignInDateTime}}, Id | Sort-Object\nLastSignInDateTime\n$inactiveUsers | Format-Table -AutoSize\n\
    If accounts are not disabled after a 35-day period of account inactivity, this is a finding."
  remediation: "1. Sign in to the Microsoft Entra admin center as at least a Reports Reader.\n2. Browse to Identity >> Users\
    \ >> All users.\n3. Select a user from the list.\n4. Use the following procedure to disable inactive user accounts in\
    \ Entra ID via the\nuse of the Graph PowerShell SDK.\nInstallation instructions:\nhttps://learn.microsoft.com/en-us/powershell/microsoftgraph/installation?view=graphpowershell-1.0\n\
    Required roles:\nGlobal Administrator\nInstall the Microsoft Graph PowerShell SDK.\nInstall-Module Microsoft.Graph -Scope\
    \ CurrentUser\nConnect-MgGraph -Scopes \"User.ReadWrite.All\", \"Directory.ReadWrite.All\",\n\"SignInActivity.Read.All\"\
    \nSet the inactivity threshold (in days)\n$inactivityThreshold = 35\nGet the current date\n$currentDate = Get-Date\nGet\
    \ all users and their last sign-in activity\n$users = Get-MgUser -All -Property \"DisplayName\", \"SignInActivity\"\n\
    Filter for inactive users\n$inactiveUsers = $users | Where-Object {\n $_.SignInActivity.LastSignInDateTime -lt ($currentDate.AddDays(-\n\
    $inactivityThreshold))\n}\nDisable inactive users\nforeach ($user in $inactiveUsers) {\n Set-MgUser -UserId $user.Id -AccountEnabled\
    \ $false\n Write-Host \"Disabled user: $($user.DisplayName)\"\n}"
  checks:
  - type: manual_review
    info: 'Verify Entra ID disables accounts after 35 days of inactivity.

      Use the following procedure to discover inactive user accounts in Entra ID (35+ days)

      via the use of the Graph PowerShell SDK.

      Installation instructions:

      https://learn.microsoft.com/en-us/powershell/microsoftgraph/installation?view=graphpowershell-1.0

      Required roles:

      At least Global Reader

      Required tenant license:

      Entra ID Premium P1

      Example PowerShell commands:

      Connect-MgGraph -Scopes AuditLog.Read.All,User.Read.All -Environment USG'
    severity: medium
- id: '1.3'
  title: ENTR-ID-000140
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Microsoft Entra ID must enforce the limit of three consecutive invalid logon attempts by a user during a 15-minute
    time period. GROUP ID: V-270208 RULE ID: SV-270208r1085616'
  rationale: 'By limiting the number of failed login attempts, the risk of unauthorized system access via user password guessing,
    otherwise known as brute forcing, is reduced. Limits are imposed by locking the account. Satisfies: SRG-APP-000345'
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Verify Entra ID is configured to enforce the limit of three consecutive invalid logon

    attempts by a user during a 15-minute time period.

    1. Sign in to the Microsoft Entra admin center as at least an Authentication Policy

    Administrator.

    2. Browse to Identity >> Protection >> Authentication methods >> Password

    protection.

    3. Verify the Lockout Threshold has been set to "3" and Lockout duration is set to

    "900" or more.

    If Entra ID is not configured to enforce the limit of three consecutive invalid logon

    attempts with a lockout period of 15 minutes, this is a finding.'
  remediation: 'To configure account lockout settings, complete these steps:

    1. Sign in to the Microsoft Entra admin center as at least an Authentication

    Administrator.

    2. Browse to Identity >> Protection >> Authentication methods >> Password

    protection.

    3. Set the Lockout threshold to "3".

    4. Set the Lockout duration to "900" (15 minutes).'
  checks:
  - type: manual_review
    info: 'Verify Entra ID is configured to enforce the limit of three consecutive invalid logon

      attempts by a user during a 15-minute time period.

      1. Sign in to the Microsoft Entra admin center as at least an Authentication Policy

      Administrator.

      2. Browse to Identity >> Protection >> Authentication methods >> Password

      protection.

      3. Verify the Lockout Threshold has been set to "3" and Lockout duration is set to

      "900" or more.

      If Entra ID is not configured to enforce the limit of three consecutive invalid '
    severity: medium
- id: '1.4'
  title: ENTR-ID-000150
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Microsoft Entra ID must display the Standard Mandatory DOD Notice and Consent Banner before granting access
    to the application. GROUP ID: V-270209 RULE ID: SV-270209r1085618'
  rationale: 'Display of the DOD-approved use notification before granting access to the application ensures privacy and security
    notification verbiage used is consistent with applicable federal laws, Executive Orders, directives, policies, regulations,
    standards, and guidance. System use notifications are required only for access via logon interfaces with human users and
    are not required when such human interfaces do not exist. The banner must be formatted in accordance with DTM-08-060.
    Use the following verbiage for applications that can accommodate banners of 1300 characters: "You are accessing a U.S.
    Government (USG) Information System (IS) that is provided for USG-authorized use only. By using this IS (which includes
    any device attached to this IS), you consent to the following conditions: -The USG routinely intercepts and monitors communications
    on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and
    defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations. -At any time, the
    USG may inspect and seize data stored on this IS. -Communications using, or data stored on, this IS are not private, are
    subject to routine monitoring, interception, and search, and may be disclosed or used for any USGauthorized purpose. -This
    IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal
    benefit or privacy. -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative
    searching or monitoring of the content of privileged communications, or work product, related to personal representation
    or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are
    private and confidential. See User Agreement for details." Use the following verbiage for operating systems that have
    severe limitations on the number of characters that can be displayed in the banner: "I''ve read & consent to terms in
    IS user agreem''t." Satisfies: SRG-APP-000068, SRG-APP-000069, SRG-APP-000070'
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Verify Entra ID has been configured to display the DOD logon banner when a user logs

    on.

    1. Sign in to the Microsoft Entra admin center as a Global Administrator.

    2. Browse to or search "Company Branding".

    3. Browse to the "Sign-in form" tab and review the required DOD banner text in the

    "Sign-in page text". Note: This field is limited to 1024 characters.

    If the DOD logon banner text is not present in the "Sign-in page text" field, this is a

    finding.'
  remediation: 'To create the standard DOD banner in Entra ID:

    1. Sign in to the Microsoft Entra admin center as a Global Administrator.

    2. Browse to or search "Company Branding".

    3. Select "Customize" under "Default sign-in experience".

    4. Browse to the "Sign-in form" tab and place the required DOD banner text in the

    "Sign-in page text". Note: This field is limited to 1024 characters.

    5. Populate all required fields.

    6. Click "Review + Create".'
  checks:
  - type: manual_review
    info: 'Verify Entra ID has been configured to display the DOD logon banner when a user logs

      on.

      1. Sign in to the Microsoft Entra admin center as a Global Administrator.

      2. Browse to or search "Company Branding".

      3. Browse to the "Sign-in form" tab and review the required DOD banner text in the

      "Sign-in page text". Note: This field is limited to 1024 characters.

      If the DOD logon banner text is not present in the "Sign-in page text" field, this is a

      finding.'
    severity: medium
- id: '1.5'
  title: ENTR-ID-000370
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Microsoft Entra ID must be configured to transfer logs to another server for storage, analysis, and reporting.
    GROUP ID: V-270227 RULE ID: SV-270227r1085728'
  rationale: 'Protection of log data includes ensuring log data is not accidentally lost or deleted. Backing up audit records
    to a different system or onto separate media than the system being audited on an organizationally defined frequency helps
    to ensure the audit records will be retained in the event of a catastrophic system failure. This also ensures a compromise
    of the information system being audited does not result in a compromise of the audit records. This requirement only applies
    to applications that have a native backup capability for audit records. Operating system backup requirements cover applications
    that do not provide native backup functions. Satisfies: SRG-APP-000358'
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'Verify Microsoft Entra ID sign-in logs are updated in Microsoft Sentinel or equivalent

    SIEM. Verify the Connected Status is "green" with Last Log Received within the past

    hour.

    1. Sign in to the Microsoft Entra admin center as a Global Administrator.

    2. Browse to Identity >> Monitoring & health >> Diagnostic settings.

    3. Select "Edit settings" for the entry that has an established log analytics

    workspace.

    4. Review the selected log categories. The minimum required categories are:

    • SigninLogs.

    • AuditLogs.

    • ServicePrincipalSignInLogs.

    • ManagedIdentitySignInLogs.

    • UserRiskEvents.

    • RiskyUsers.

    • RiskyServicePrincipals.

    • ServicePrincipalRiskEvents.

    If there is not an entry established to offload logs to a log analytic workspace and the

    minimum log categories are not selected, this is a finding.'
  remediation: 'Configure the Microsoft Entra to transfer Microsoft Entra server logs to another server

    for storage, analysis, and reporting at least every seven days.

    1. Sign in to the Microsoft Entra admin center as a Global Administrator.

    2. Browse to Identity >> Monitoring & health >> Diagnostic settings.

    3. Select "+ Add diagnostic settings".

    4. Select at least these required categories:

    • SigninLogs.

    • AuditLogs.

    • ServicePrincipalSignInLogs.

    • ManagedIdentitySignInLogs.

    • UserRiskEvents.

    • RiskyUsers.

    • RiskyServicePrincipals.

    • ServicePrincipalRiskEvents.

    5. Select "Send to Log Analytics workspace". For details on establishing a log

    analytics workspace, reference the DOD365 TCG.'
  checks:
  - type: manual_review
    info: 'Verify Microsoft Entra ID sign-in logs are updated in Microsoft Sentinel or equivalent

      SIEM. Verify the Connected Status is "green" with Last Log Received within the past

      hour.

      1. Sign in to the Microsoft Entra admin center as a Global Administrator.

      2. Browse to Identity >> Monitoring & health >> Diagnostic settings.

      3. Select "Edit settings" for the entry that has an established log analytics

      workspace.

      4. Review the selected log categories. The minimum required categories are:

      • SigninLogs.

      •'
    severity: medium
- id: '1.6'
  title: ENTR-ID-000440
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Microsoft Entra ID must be configured to use multifactor authentication (MFA). GROUP ID: V-270233 RULE ID:
    SV-270233r1085634'
  rationale: 'Without the use of MFA, the ease of access to privileged functions is greatly increased. MFA requires the use
    of two or more factors to achieve authentication. Factors include: (i) Something a user knows (e.g., password/PIN); (ii)
    Something a user has (e.g., cryptographic identification device, token); or (iii) Something a user is (e.g., biometric).
    A privileged account is defined as an information system account with authorizations of a privileged user. Network access
    is defined as access to an information system by a user (or a process acting on behalf of a user) communicating through
    a network (e.g., local area network, wide area network, or the internet). Satisfies: SRG-APP-000149, SRG-APP-000150, SRG-APP-000154,
    SRG-APP-000155'
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Verify user accounts require MFA.

    1. Sign in to the Microsoft Entra admin center as at least a Conditional Access

    Administrator.

    2. Browse to Identity >> Protection >> Conditional Access.

    3. Select "Policies" and find the MFA policy.

    4. Confirm the policy state is set to "On".

    5. Select the policy and confirm "All users included" is specified under the Users

    option of the policy.

    6. Confirm any exclusions listed under the "Exclude" section of the Users option are

    documented with the authorizing official (AO).

    If the MFA policy is not set to "On" with "All users included" selected and any exclusions

    are not documented with the AO, this is a finding.'
  remediation: 'Account authentication is managed by Entra ID. The following steps will create a

    Conditional Access policy to require all users to use MFA:

    1. Sign in to the Microsoft Entra admin center as at least a Conditional Access

    Administrator.

    2. In the search bar, search for "Conditional Access".

    3. Select "Create new policy".

    4. Give the policy a name. It is recommended that organizations create a

    meaningful standard for the names of policies.

    5. Under "Assignments", select "Users" or "workload identities".

    6. a. Under "Include", select "All users".

    7. b. Under "Exclude", select "Users" and "groups", and then choose the

    organization''s emergency access or break-glass accounts.

    8. Navigate to Target resources >> Cloud apps >> Include. Select "All cloud apps".

    9. a. Under "Exclude", select any applications that do not require MFA.

    10. Navigate to Access controls >> Grant. Select "Grant access, Require multifactor

    authentication", and then click "Select".

    11. Confirm the settings and set "Enable policy" to "Report-only".

    12. Select "Create" to enable the policy.

    13. After confirming the policy, deploy the policy by either moving the "Enable" policy

    toggle from "Report-only" to "On" or alternately, deploying the policy using a

    Conditional Access template.'
  checks:
  - type: manual_review
    info: 'Verify user accounts require MFA.

      1. Sign in to the Microsoft Entra admin center as at least a Conditional Access

      Administrator.

      2. Browse to Identity >> Protection >> Conditional Access.

      3. Select "Policies" and find the MFA policy.

      4. Confirm the policy state is set to "On".

      5. Select the policy and confirm "All users included" is specified under the Users

      option of the policy.

      6. Confirm any exclusions listed under the "Exclude" section of the Users option are

      documented with the authorizing '
    severity: medium
- id: '1.7'
  title: ENTR-ID-000610
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Microsoft Entra ID must enforce a 60-day maximum password lifetime restriction. GROUP ID: V-270239 RULE ID:
    SV-270239r1085663'
  rationale: Any password, no matter how complex, can eventually be cracked. Therefore, passwords need to be changed at specific
    intervals. One method of minimizing this risk is to use complex passwords and periodically change them. If the application
    does not limit the lifetime of passwords and force users to change their passwords, there is the risk that the system
    and/or application passwords could be compromised. This requirement does not include emergency administration accounts,
    which are meant for access to the application in case of failure. These accounts are not required to have maximum password
    lifetime restrictions.
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'Verify the Entra ID password expiration time period has been changed to 60 days.

    Interview the site Entra ID system administrator and verify the script shown in the Fix

    has been run.

    If the Entra ID password expiration time period is not 60 days or less, this is a finding.

    Note: It is not possible to view the current value for the password expiration time (the

    Entra ID default is 90). An administrator can check the maximum password age of their

    Entra ID tenant by using the Graph PowerShell SDK module and the "Get-MgDomain"

    command by using the script located here:

    https://learn.microsoft.com/enus/powershell/module/microsoft.graph.identity.directorymanagement/getmgdomain?view=graph-powershell-1.0

    Note: For any PowerShell scripts that are Graph, note that Graph endpoints differ

    depending on where the tenant is located.

    • For commercial tenants, graph endpoints are graph.microsoft.com.

    • For GCC High tenants (IL4), graph endpoints are graph.microsoft.us.

    • For DOD tenants (IL5), graph endpoints are dod-graph.microsoft.us.'
  remediation: 'Change the default Entra ID password expiration time period to 60 days by using the

    Graph script located here:

    https://learn.microsoft.com/en-us/powershell/module/microsoft.graph.users/updatemguser

    Use the "Get-MgDomain" command, and update it to 60 days using the "UpdateMgDomain -DomainId <DomainName>

    -PasswordValidityPeriodInDays 60" command.

    Note: For any PowerShell scripts that are Graph, note that Graph endpoints differ

    depending on where the tenant is located.

    • For commercial tenants, graph endpoints are graph.microsoft.com.

    • For GCC High tenants (IL4), graph endpoints are graph.microsoft.us.

    • For DOD tenants (IL5), graph endpoints are dod-graph.microsoft.us.'
  checks:
  - type: manual_review
    info: 'Verify the Entra ID password expiration time period has been changed to 60 days.

      Interview the site Entra ID system administrator and verify the script shown in the Fix

      has been run.

      If the Entra ID password expiration time period is not 60 days or less, this is a finding.

      Note: It is not possible to view the current value for the password expiration time (the

      Entra ID default is 90). An administrator can check the maximum password age of their

      Entra ID tenant by using the Graph PowerShell SDK m'
    severity: medium
- id: '1.8'
  title: ENTR-ID-000835
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Microsoft Entra ID must notify system administrators (SAs) and the information system security officer (ISSO)
    when privileges are being requested. GROUP ID: V-270255 RULE ID: SV-270255r1085626'
  rationale: When application accounts are modified, user accessibility is affected. Accounts are used for identifying individual
    users or for identifying the application processes themselves. Sending notification of account modification events to
    the system administrator and ISSO is one method for mitigating this risk. Such a capability greatly reduces the risk that
    application accessibility will be negatively affected for extended periods of time and also provides logging that can
    be used for forensic purposes. To address access requirements, many operating systems can be integrated with enterprise-level
    authentication/access/auditing mechanisms that meet or exceed access control policy requirements.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'Verify PIM is in use with email notifications going to the SA and ISSO when privileges

    are requested.

    1. Sign in to the Microsoft Entra admin center as at least an Authentication Policy

    Administrator.

    2. Search for "Microsoft Entra Privileged Identity Management".

    3. Navigate to "Management" and select "Microsoft Entra roles".

    4. Expand the "Manage" menu and select roles.

    5. For each role that is either active or eligible perform the following:

    6. a. Select the role.

    7. b. Navigate to role settings.

    8. c. Under "Send notifications when eligible members activate this role:" Verify the

    SA and ISSO email addresses are listed under "Additional recipients" for the type

    "Role activation alert".

    If the SA and ISSO are not set up to receive email notification when privileges are

    requested through PIM, this is a finding.'
  remediation: 'Configure PIM to email notifications to the SA and ISSO when privileges are requested.

    1. Sign in to the Microsoft Entra admin center as at least an Authentication Policy

    Administrator.

    2. Search for "Microsoft Entra Privileged Identity Management".

    3. Navigate to "Management" and select "Microsoft Entra roles".

    4. Expand the "Manage" menu and select roles.

    5. For each role that is either active or eligible perform the following:

    6. a. Select the role.

    7. b. Navigate to role settings.

    8. c. Select "Edit".

    9. d. Navigate to the "Notification" tab.

    10. e. Under "Send notifications when eligible members activate this role:" add the

    SA and ISSO email addresses under "Additional recipients".

    11. f. Select "Update".'
  checks:
  - type: manual_review
    info: 'Verify PIM is in use with email notifications going to the SA and ISSO when privileges

      are requested.

      1. Sign in to the Microsoft Entra admin center as at least an Authentication Policy

      Administrator.

      2. Search for "Microsoft Entra Privileged Identity Management".

      3. Navigate to "Management" and select "Microsoft Entra roles".

      4. Expand the "Manage" menu and select roles.

      5. For each role that is either active or eligible perform the following:

      6. a. Select the role.

      7. b. Navigate to role setti'
    severity: medium
- id: '1.9'
  title: ENTR-ID-001900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Microsoft Entra ID must use Privileged Identity Management (PIM). GROUP ID: V-270335 RULE ID: SV-270335r1085641'
  rationale: Emergency accounts are administrator accounts established in response to crisis situations where the need for
    rapid account activation is required. Therefore, emergency account activation may bypass normal account authorization
    processes. If these accounts are automatically disabled, system maintenance during emergencies may not be possible, thus
    adversely affecting system availability. Emergency accounts are different from infrequently used accounts (i.e., local
    logon accounts used by system administrators when network or normal logon/access is not available). Infrequently used
    accounts also remain available and are not subject to automatic termination dates. However, an emergency account is normally
    a different account created for use by vendors or system maintainers. To address access requirements, many application
    developers choose to integrate their applications with enterprise-level authentication/access mechanisms that meet or
    exceed access control policy requirements. Such integration allows the application developer to offload those access control
    functions and focus on core application features and functionality.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'Verify PIM is in use with just-in-time (JIT) access and employing the principle of least

    privilege access.

    1. Sign in to the Microsoft Entra admin center as at least an Authentication Policy

    Administrator.

    2. Search for "Microsoft Entra Privileged Identity Management".

    3. Navigate to "Management" and select "Microsoft Entra roles".

    4. Expand the "Manage" menu and select "Assignments".

    5. Select the "Active assignments" tab and for each privileged role, verify there are

    no roles with an end time of "Permanent".

    If any privileged roles are present with an end time of "Permanent", this is a finding.'
  remediation: 'Configure PIM to just-in-time (JIT) access and employ the principle of least privilege

    access.

    When assigning privileged roles to accounts, select the assignment type of "Eligible".'
  checks:
  - type: manual_review
    info: 'Verify PIM is in use with just-in-time (JIT) access and employing the principle of least

      privilege access.

      1. Sign in to the Microsoft Entra admin center as at least an Authentication Policy

      Administrator.

      2. Search for "Microsoft Entra Privileged Identity Management".

