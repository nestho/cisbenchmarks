  remediation: 'As an authorized administrator, browse to

    https://portal.azure.us/#view/Microsoft_AAD_ConditionalAccess/PasswordProtectionBla

    de.

    Enable the Custom banned password list by selecting "Yes" next to the "Enforce custom

    list" option.

    Populate the "Custom banned password list".

    The list must be one word per line, with a maximum of 1000 words. The words are case

    insensitive, and common character substitutions (o for 0, etc) are automatically

    considered.

