    Log in to MariaDB Enterprise Server and verify the audit log location.

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''server_audit_file_path'';

    Verify the necessary audit filters are in place:

    MariaDB> SELECT * FROM mysql.server_audit_filters;

    In another terminal, view the audit log file:

    $ tail -f /var/log/mysql/audit.log

    Back in the MariaDB shell, run a query which matches an audit filter. Example if

    query_events is ALL:

    MariaDB> SELECT * FROM mysql.help_topic;

    Verify the entry was logged in the audit log and contains the necessary event user

    information. If not, this is a finding.'
  remediation: "Update necessary audit filters. For example:\nMariaDB> DELETE FROM mysql.server_audit_filters WHERE filtername\
    \ = 'default';\nMariaDB> INSERT INTO mysql.server_audit_filters (filtername, rule)\n VALUES ('default',\n JSON_COMPACT(\n\
    \ '{\n \"connect_event\": [\n \"CONNECT\",\n \"DISCONNECT\"\n ],\n \"query_event\": [\n \"ALL\"\n ]\n }'\n ));"
