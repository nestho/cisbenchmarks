    processes. Since it is usually not possible to test this capability in a production environment, systems must either be
    validated in a testing environment or prior to installation. This requirement is usually a function of the design of the
    IDPS component. Compliance can be verified by acceptance/validation processes or vendor attestation. MariaDB is a fully
    functional ACID RDBMS with persistent storage, logs, rollback, recovery, and backup procedures. InnoDB is the default
    storage engine for MariaDB and all uncommitted transactions are rolled back upon restart from a failure. The process is
    automatic and all incomplete transactions will be rolled back to a consistent state to guarantee consistency. Users can
