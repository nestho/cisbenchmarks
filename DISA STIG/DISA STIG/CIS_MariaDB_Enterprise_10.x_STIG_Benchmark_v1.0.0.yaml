- id: '1.10'
  title: MADB-10-001600
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must include additional, more detailed, organization-defined information in the audit records for
    audit events identified by type, location, or subject. GROUP ID: V-253676 RULE ID: SV-253676r960909'
  rationale: Information system auditing capability is critical for accurate forensic analysis. Reconstruction of harmful
    events or forensic analysis is not possible if audit records do not contain enough information. To support analysis, some
    types of events will need information to be logged that exceeds the basic requirements of event type, time stamps, location,
    source, outcome, and user identity. If additional information is not available, it could negatively impact forensic investigations
    into user actions or other malicious events. The organization must determine what additional information is required for
    complete analysis of the audited events. The additional information required is dependent on the type of information (e.g.,
    sensitivity of the data and the environment within which it resides). At a minimum, the organization must employ either
    full-text recording of privileged commands or the individual identities of users of shared accounts, or both. The organization
    must maintain audit trails in sufficient detail to reconstruct events to determine the cause and impact of compromise.
    Examples of detailed information the organization may require in audit records are fulltext recording of privileged commands
    or the individual identities of shared account users.
  impact: ''
  references: []
  page_start: 37
  audit_raw: 'Verify the MariaDB Enterprise Audit plugin is loaded and actively logging:

    MariaDB> SHOW GLOBAL STATUS LIKE ''Server_audit_active'';

