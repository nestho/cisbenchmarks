- id: '1.40'
  title: MADB-10-004600
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must separate user functionality (including user interface services) from database management functionality.
    GROUP ID: V-253705 RULE ID: SV-253705r1051299'
  rationale: Information system management functionality includes functions necessary to administer databases, network components,
    workstations, or servers and typically requires privileged user access. The separation of user functionality from information
    system management functionality is either physical or logical and is accomplished by using different computers, different
    central processing units, different instances of the operating system, different network addresses, combinations of these
    methods, or other methods, as appropriate. An example of this type of separation is observed in web administrative interfaces
    that use separate authentication methods for users of any other information system resources. This may include isolating
    the administrative interface on a different domain and with additional access controls. If administrative functionality
    or information regarding MariaDB management is presented on an interface available for users, information on MariaDB settings
    may be inadvertently made available to the user.
  impact: ''
  references: []
  page_start: 97
  audit_raw: 'To show the list of system privileges that the MariaDB server supports, run:

    MariaDB> SHOW PRIVILEGES;

    Gather a list of SHOW GRANTS commands. SHOW GRANTS will list the privileges

    granted to the account.

    Run this database query to create the SHOW GRANTS script for each user:

    MariaDB> SELECT DISTINCT CONCAT( ''SHOW GRANTS FOR '', user,''@'', host,'';'') AS

    grantQuery FROM mysql.user WHERE is_role = ''N'';

    Run each SHOW GRANTS command for each user.

    MariaDB> SHOW GRANTS FOR ''user''@''host'';

    If any nonadministrative role has any one of the following privileges, this is a finding.

    Create user

    Event

    Process

    Proxy

    Reload

    Replication client

    Replication slave

    Show databases

    Shutdown

    Super

    If administrator and general user functionality are not separated either physically or

    logically, this is a finding.'
  remediation: 'Configure MariaDB Enterprise Server to separate database administration and general

    user functionality.

    Do not grant Create user, Event, Process, Proxy, Reload, Replication client, Replication

    slave, Show databases, Shutdown, Super, Create tablespace privileges to users and

    roles that do not require it.

    To remove privileges, refer to the following examples:

    1. Revoke privileges from a specific user:

    MariaDB> REVOKE SUPER, PROCESS ON *.* FROM ''user''@''host'';

    2. Revoke privileges from a role:

    MariaDB> REVOKE ''role'' FROM ''user''@''host'';'
  checks:
  - type: sql
    command: 'show the list of system privileges that the MariaDB server supports, run:'
    severity: medium
    info: 'To show the list of system privileges that the MariaDB server supports, run:

      MariaDB> SHOW PRIVILEGES;

      Gather a list of SHOW GRANTS commands. SHOW GRANTS will list the privileges

      granted to the account.

      Run this database query to create the SHOW GRANTS script for each user:

      MariaDB> SELECT DISTINCT CONCAT( ''SHOW GRANTS FOR '', user,''@'', host,'';'') AS

      grantQuery FROM mysql.user WHERE is_role = ''N'';

      R'
- id: '1.41'
  title: MADB-10-004700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must invalidate session identifiers upon user logout or other session termination. GROUP ID: V-253706
    RULE ID: SV-253706r1043179'
  rationale: Captured sessions can be reused in replay attacks. This requirement limits the ability of adversaries to capture
    and continue to employ previously valid session IDs. This requirement focuses on communications protection for the MariaDB
    session rather than for the network packet. The intent of this control is to establish grounds for confidence at each
    end of a communications session in the ongoing identity of the other party and in the validity of the information being
    transmitted. Session IDs are tokens generated by MariaDB to uniquely identify a user's (or process's) session. MariaDB
    will make access decisions and execute logic based on the session ID. Unique session IDs help to reduce predictability
    of said identifiers. Unique session IDs address man-in-the-middle attacks, including session hijacking or insertion of
    false information into a session. If the attacker is unable to identify or guess the session information related to pending
    application traffic, they will have more difficulty in hijacking the session or otherwise manipulating valid sessions.
    When a user logs out, or when any other session termination event occurs, the DBMS must terminate the user's session(s)
    to minimize the potential for sessions to be hijacked.
  impact: ''
  references: []
  page_start: 100
  audit_raw: 'As the database administrator, run the following SQL:

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''tcp_keepalive_interval'';

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''tcp_keepalive_probes'';

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''tcp_keepalive_time'';

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''tcp_nodelay'';

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''max_statement_time'';

    If these settings are not set, this is a finding.'
  remediation: 'As the administrator locate the my.cnf file to change. For Centos, RedHat, and similar

    distributions this will be in /etc/my.cnf.d/.

    In the [mariadb] section add the lines:

    tcp_keepalive_interval == seconds

    https://mariadb.com/docs/reference/mdb/systemvariables/tcp_keepalive_interval/

    tcp_keepalive_probes == number of probes

    https://mariadb.com/docs/reference/mdb/system-variables/tcp_keepalive_probes/

    tcp_keepalive_time == seconds

    https://mariadb.com/docs/reference/mdb/system-variables/tcp_keepalive_time/

    tcp_nodelay == boolean (off or on)

    https://mariadb.com/docs/reference/mdb/system-variables/tcp_nodelay/

    max_statement_time == seconds

    https://mariadb.com/docs/reference/mdb/system-variables/max_statement_time/'
  checks:
  - type: sql
    command: SHOW GLOBAL VARIABLES LIKE 'tcp_keepalive_interval';
    severity: medium
    info: 'As the database administrator, run the following SQL:

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''tcp_keepalive_interval'';

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''tcp_keepalive_probes'';

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''tcp_keepalive_time'';

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''tcp_nodelay'';

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''max_statement_time'';

      If these settings are not set, this is a finding.'
