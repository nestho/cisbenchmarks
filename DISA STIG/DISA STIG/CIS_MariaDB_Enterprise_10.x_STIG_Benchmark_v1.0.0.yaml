- id: '1.48'
  title: MADB-10-005600
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Access to database files must be limited to relevant processes and to authorized, administrative users. GROUP
    ID: V-253713 RULE ID: SV-253713r961149'
  rationale: Applications, including MariaDB, must prevent unauthorized and unintended information transfer via shared system
    resources. Permitting only MariaDB processes and authorized, administrative users to have access to the files where the
    database resides helps ensure that those files are not shared inappropriately and are not open to backdoor access and
    manipulation.
  impact: ''
  references: []
  page_start: 116
  audit_raw: 'By default, all of the MariaDB database files, log files, and backup files are located in

    the /var/lib/mysql.

    To find the location of the datadir run this command:

    Mariadb > SHOW GLOBAL VARIABLES LIKE ''datadir'';

    Check the /etc/my.cnf file for the following variables to determine if any of these files

    have a nondefault location configured. Only variables that specify a directory different

    from datadir will be in a different directory. If the variable only specifies a file name, that

    file will still be in the default directory.

    error_log

    innodb_log_group_home_dir

    innodb_temp_data_file_path

    innodb_tmpdir

    innodb_undo_directory

    innodb_temp_data_file_path

    innodb_tmpdir

    log_bin_basename

    log_error

    relay_log_basename

    relay_log_file_info

    sql_error_log_filename

    tmpdir

    Review the permissions granted to users by the operating system/file system on the

    database files, database log files, and database backup files.

    To verify that all files are owned by the database administrator and have the correct

    permissions, run the following as the database administrator:

    $ sudo su - root

    $ ls -lR {datadir}

    $ ls -lR other directories defined by variables above

    If using mysqldump or another tool for backups, also run the "ls" command as above on

    the directory that will be containing the backup file.

    If any files are not owned by the database administrator or allow anyone but the

    database administrator to read/write/execute, this is a finding.

    If any user/role who is not an authorized system administrator with a need-to-know,

    database administrator with a need-to-know, or system account for running MariaDB

    processes is permitted to read/view any of these files, this is a finding.'
  remediation: 'By default all of the MariaDB database files, log files, and backup files are located in the

