- id: '1.68'
  title: MADB-10-008200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must require users to reauthenticate when organization-defined circumstances or situations require
    reauthentication. GROUP ID: V-253735 RULE ID: SV-253735r1050788'
  rationale: 'The DOD standard for authentication of an interactive user is the presentation of a Common Access Card (CAC)
    or other physical token bearing a valid, current, DODissued Public Key Infrastructure (PKI) certificate, coupled with
    a Personal Identification Number (PIN) to be entered by the user at the beginning of each session and whenever reauthentication
    is required. Without reauthentication, users may access resources or perform tasks for which they do not have authorization.
    When applications provide the capability to change security roles or escalate the functional capability of the application,
    it is critical the user reauthenticate. In addition to the reauthentication requirements associated with session locks,
    organizations may require reauthentication of individuals and/or devices in other situations, including (but not limited
    to) the following circumstances: (i) When authenticators change; (ii) When roles change; (iii) When security categories
    of information systems change; (iv) When the execution of privileged functions occurs; (v) After a fixed period of time;
    or (vi) Periodically. Within the DOD, the minimum circumstances requiring reauthentication are privilege escalation and
    role changes.'
  impact: ''
  references: []
  page_start: 165
  audit_raw: 'Determine all situations where a user must reauthenticate. Check if the mechanisms

    that handle such situations use the following SQL:

    To make a single user reauthenticate, an existing connection must be present:

    To search for a specific user:

    MariaDB> SELECT * FROM information_schema.PROCESSLIST where user =''<name>''

    and host like ''%'';

    To review all connections:

    MariaDB> SELECT * FROM INFORMATION_SCHEMA.PROCESSLIST;

    Note the ID(s) (processlist_id) of the connection(s) for the user that must reauthenticate.

    To make a user reauthenticate, run the following for each ID returned above (as they

    can have multiple connections):

    MariaDB> KILL CONNECTION processslist_id;

    If the provided SQL does not force reauthentication, this is a finding.'
  remediation: 'To force a single user reauthenticate, the user must be currently authenticated to the

    database server.

    Find the process ID of the user in question:

    MariaDB> SELECT id FROM information_schema.processlist WHERE user =

    ''username'';

    Use the id to kill the process, which kills the connection and forces the user to

    reauthenticate:

    MariaDB> KILL id;

    To force all users to reauthenticate, run the following as the database administrator:

    MariaDB> SELECT concat( KILL ,id, ; ) FROM information_schema.processlist

    INTO OUTFILE /tmp/x.txt;

    MariaDB> SOURCE /tmp/x.txt;'
  checks:
  - type: sql
    command: SELECT * FROM information_schema.PROCESSLIST where user ='<name>'
    severity: medium
    info: 'Determine all situations where a user must reauthenticate. Check if the mechanisms

      that handle such situations use the following SQL:

