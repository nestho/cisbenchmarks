controls:
- id: '1.1'
  title: MADB-10-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'MariaDB must limit the number of concurrent sessions to an organization-defined number per user for all accounts
    and/or account types. GROUP ID: V-253666 RULE ID: SV-253666r960735'
  rationale: Database management includes the ability to control the number of users and user sessions utilizing MariaDB.
    Unlimited concurrent connections to MariaDB could allow a successful Denial of Service (DoS) attack by exhausting connection
    resources; and a system can also fail or be degraded by an overload of legitimate users. Limiting the number of concurrent
    sessions per user is helpful in reducing these risks. This requirement addresses concurrent session control for a single
    account. It does not address concurrent sessions by a single user via multiple system accounts; and it does not deal with
    the total number of sessions across all accounts. The capability to limit the number of concurrent sessions per user must
    be configured in or added to MariaDB (for example, by use of a logon trigger), when this is technically feasible. Note
    that it is not sufficient to limit sessions via a web server or application server alone, because legitimate users and
    adversaries can potentially connect to MariaDB by other means. The organization will need to define the maximum number
    of concurrent sessions by account type, by account, or a combination thereof. In deciding on the appropriate number, it
    is important to consider the work requirements of the various types of users. For example, 2 might be an acceptable limit
    for general users accessing the database via an application; but 10 might be too few for a database administrator using
    a database management GUI tool, where each query tab and navigation pane may count as a separate session. (Sessions may
    also be referred to as connections or logons, which for the purposes of this requirement are synonyms.)
  impact: ''
  references: []
  page_start: 12
  audit_raw: 'To check the number of connections allowed for each user, as the database

    administrator, run the following SQL:

    MariaDB> SELECT user, max_user_connections FROM mysql.user;

    If any users have more connections configured than documented, this is a finding. A

    value of 0 indicates unlimited and is a finding.'
  remediation: 'To limit the number of connections allowed by a specific user, as a user with

    appropriate privileges, run the following SQL:

    MariaDB> GRANT USAGE ON *.* TO ''username''@''host'' WITH MAX_USER_CONNECTIONS

    number_of_connections;'
  checks:
  - type: sql
    command: SELECT user, max_user_connections FROM mysql.user;
    severity: medium
    info: 'To check the number of connections allowed for each user, as the database

      administrator, run the following SQL:

      MariaDB> SELECT user, max_user_connections FROM mysql.user;

      If any users have more connections configured than documented, this is a finding. A

      value of 0 indicates unlimited and is a finding.'
- id: '1.2'
  title: MADB-10-000200
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'MariaDB must integrate with an organization-level authentication/access mechanism providing account management
    and automation for all users, groups, roles, and any other principals. GROUP ID: V-253667 RULE ID: SV-253667r1043176'
  rationale: 'Enterprise environments make account management for applications and databases challenging and complex. A manual
    process for account management functions adds the risk of a potential oversight or other error. Managing accounts for
    the same person in multiple places is inefficient and prone to problems with consistency and synchronization. A comprehensive
    application account management process that includes automation helps to ensure that accounts designated as requiring
    attention are consistently and promptly addressed. Examples include, but are not limited to, using automation to take
    action on multiple accounts designated as inactive, suspended, or terminated, or by disabling accounts located in noncentralized
    account stores, such as multiple servers. Account management functions can also include assignment of group or role membership;
    identifying account type; specifying user access authorizations (i.e., privileges); account removal, update, or termination;
    and administrative alerts. The use of automated mechanisms can include, for example: using email or text messaging to
    notify account managers when users are terminated or transferred; using the information system to monitor account usage;
    and using automated telephone notification to report atypical system account usage. MariaDB must be configured to automatically
    utilize organization-level account management functions, and these functions must immediately enforce the organizations
    current account policy. Automation may be comprised of differing technologies that when placed together contain an overall
    mechanism supporting an organizations automated account management requirements.'
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'If all accounts are authenticated by the organization-level authentication/access

    mechanism such as LDAP, Kerberos, Active Directory and not by MariaDB, this is not a

    finding.

    If there are any accounts managed by the DBMS, review the system documentation for

    justification and approval of these accounts.

    If any DBMS-managed accounts exist that are not documented and approved, this is a

    finding.

    As the OS administrator, review the configuration files /etc/pam.d and /etc/pam.conf. If

    file is missing or not configured, this is a finding. Example for LDAP authentication and

    authorization via PAM would be /etc/pam.d/mariadb_ldap:

    #############################

    auth required pam_ldap.so

    account required pam_ldap.so

    #############################

    Verify that PAM is by installed the following SQL:

    MariaDB> SHOW PLUGINS;

    If pam is not listed as active, this is a finding.

    To find users not using PAM plugin for authentication:

    MariaDB> SELECT user, host, plugin FROM mysql.user WHERE plugin != ''pam'';

    If any users are returned, this is a finding.'
  remediation: 'Integrate MariaDB security with an organization-level authentication/access mechanism

    providing account management for all users, groups, roles, and any other principals.

    As the database administrator, install and configure the PAM authentication module:

    MariaDB> INSTALL SONAME ''auth_pam'';

    PAM supports many authentication methods including LDAP, Active Directory, and

    Kerberos. Each method must be configured properly in /etc/pam.d and /etc/pam.conf.

    To alter non-PAM authenticated users to using PAM:

    MariaDB> ALTER USER ''username''@''host'' IDENTIFIED VIA pam USING mariadb_ldap;'
  checks:
  - type: sql
    command: SHOW PLUGINS;
    severity: medium
    info: 'If all accounts are authenticated by the organization-level authentication/access

      mechanism such as LDAP, Kerberos, Active Directory and not by MariaDB, this is not a

      finding.

      If there are any accounts managed by the DBMS, review the system documentation for

      justification and approval of these accounts.

      If any DBMS-managed accounts exist that are not documented and approved, this is a

      finding.

      As '
- id: '1.3'
  title: MADB-10-000300
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'MariaDB must enforce approved authorizations for logical access to information and system resources in accordance
    with applicable access control policies. GROUP ID: V-253668 RULE ID: SV-253668r960792'
  rationale: Authentication with a DoD-approved PKI certificate does not necessarily imply authorization to access MariaDB.
    To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates by
    DoD-approved PKIs, all DoD systems, including databases, must be properly configured to implement access control policies.
    Successful authentication must not automatically give an entity access to an asset or security boundary. Authorization
    procedures and controls must be implemented to ensure each authenticated entity also has a validated and current authorization.
    Authorization is the process of determining whether an entity, once authenticated, is permitted to access a specific asset.
    Information systems use access control policies and enforcement mechanisms to implement this requirement. Access control
    policies include identity-based policies, role-based policies, and attribute-based policies. Access enforcement mechanisms
    include access control lists, access control matrices, and cryptography. These policies and mechanisms must be employed
    by the application to control access between users (or processes acting on behalf of users) and objects (e.g., devices,
    files, records, processes, programs, and domains) in the information system. This requirement is applicable to access
    control enforcement applications, a category that includes database management systems. If MariaDB does not follow applicable
    policy when approving access, it may be in conflict with networks or other applications in the information system. This
    may result in users either gaining or being denied access inappropriately and in conflict with applicable policy.
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'From the system security plan or equivalent documentation, determine the appropriate

    permissions on database objects for each kind (group role) of user. If this

    documentation is missing, this is a finding.

    First, as the database administrator, check the privileges of all users and roles in the

    database.

    Find all users:

    MariaDB> SELECT user, host FROM mysql.user WHERE is_role = ''N'';

    Find all roles:

    MariaDB> SELECT user FROM mysql.user WHERE is_role = ''Y'';

    For each user found, check grants:

    MariaDB> SHOW GRANTS FOR ''username''@''host'';

    For each role found, check grants:

    MariaDB> SHOW GRANTS FOR ''rolename'';

    Review all users and roles and their associated privileges. If any users and/or roles

    privileges exceed those documented, this is a finding.

    As the database administrator, check the configured authentication settings:

    MariaDB> SHOW PLUGINS;

    To find users not using PAM plugin for authentication:

    MariaDB> SELECT user, host, plugin FROM mysql.user WHERE plugin != ''pam'';

    If any users are returned, this is a finding.

    Review all entries and their associated authentication methods. If any entries do not

    have their documented authentication requirements, this is a finding.'
  remediation: 'Create and/or maintain documentation of each group roles appropriate permissions on

    database objects.

    Implement these permissions in the database and remove any permissions that exceed

    those documented.

    The following are examples of how to use role privileges in MariaDB to enforce access

    controls. Run these as the database administrator.

    For a complete list of privileges, see the official documentation:

    https://mariadb.com/kb/en/grant/

    Roles Example 1

    The following example demonstrates how to create an admin role with SHUTDOWN

    privileges.

    As the database administrator, run the following SQL:

    MariaDB> CREATE ROLE admin;

    MariaDB> GRANT SHUTDOWN ON *.* TO admin;

    Roles Example 2

    The following example demonstrates how to create a user make the user a member of

    the admin role.

    As the database administrator, run the following SQL:

    MariaDB> CREATE USER ''admin_user''@''host'' IDENTIFIED VIA PAM;

    MariaDB> GRANT admin TO ''admin_user''@''%'';

    Roles Example 3

    The following demonstrates how to revoke privileges from a role using REVOKE.

    As the database administrator, run the following SQL:

    MariaDB> REVOKE admin FROM ''admin_user''@''host'';

    Roles Example 4

    The following demonstrates how to modify privileges for a role using GRANT.

    As the database administrator, run the following SQL:

    MariaDB> GRANT PROCESS ON *.* TO admin;

    The following are examples of how to use grant privileges in MariaDB to enforce access

    controls on objects.

    Grant Example 1

    The following example demonstrates how to grant INSERT on a table to a role.

    As the database administrator, run the following SQL:

    MariaDB> GRANT INSERT ON test.t1 TO admin;

    Grant Example 2

    The following example demonstrates how to grant ALL PRIVILEGES on a table to a

    role.

    As the database administrator, run the following SQL:

    MariaDB> GRANT ALL PRIVILEGES ON test.t1 TO admin;

    Grant Example 3

    The following example demonstrates how to grant a role to a role.

    As the database administrator, run the following SQL:

    MariaDB> CREATE ROLE admin_master;

    MariaDB> GRANT admin TO admin_master;

    Revoke Example 1

    The following example demonstrates how to revoke access from a role.

    As the database administrator, run the following SQL:

    MariaDB> REVOKE PROCESS ON *.* FROM admin;

    To change authentication requirements for the database, as the OS administrator,

    review the configuration files /etc/pam.d and /etc/pam.conf.

    After changes to the configuration files /etc/pam.d and /etc/pam.conf, reload the server:

    SYSTEMD SERVER ONLY

    $ sudo systemctl reload mariadb

    INITD SERVER ONLY

    $ sudo service mariadb reload'
  checks:
  - type: sql
    command: SELECT user, host FROM mysql.user WHERE is_role = 'N';
    severity: medium
    info: 'From the system security plan or equivalent documentation, determine the appropriate

      permissions on database objects for each kind (group role) of user. If this

      documentation is missing, this is a finding.

      First, as the database administrator, check the privileges of all users and roles in the

      database.

      Find all users:

      MariaDB> SELECT user, host FROM mysql.user WHERE is_role = ''N'';

      Find all roles:'
- id: '1.4'
  title: MADB-10-000400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must protect against a user falsely repudiating having performed organizationdefined actions. GROUP
    ID: V-253669 RULE ID: SV-253669r960864'
  rationale: Nonrepudiation of actions taken is required in order to maintain data integrity. Examples of particular actions
    taken by individuals include creating information, sending a message, approving information (e.g., indicating concurrence
    or signing a contract), and receiving a message. Nonrepudiation protects against later claims by a user of not having
    created, modified, or deleted a particular data item or collection of data in the database. In designing a database, the
    organization must define the types of data and the user actions that must be protected from repudiation. The implementation
    must then include building audit features into the application data tables and configuring MariaDB’s audit tools to capture
    the necessary audit trail. Design and implementation also must ensure that applications pass individual user identification
    to MariaDB, even where the application connects to MariaDB with a standard, shared account. It is recommended to not allow
    shared accounts, including root. The root user is known by all attackers, and often used in attempted attacks on the database
    servers.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'All users should have individual accounts with appropriate privileges. The root user

    should be removed after administrative accounts with SUPER privilege are created.

    Query all users and determine if any are suspected shared accounts. Document any

    necessary shared accounts.

    MariaDB> SELECT user, host FROM mysql.user;

    Determine if any accounts are shared. A shared account is defined as a username,

    hostname, and password that are used by multiple individuals to log in to MariaDB. An

    example of a shared account is the MariaDB root account – root@localhost.

    If accounts are determined to be shared, determine if individuals are first individually

    authenticated.

    If individuals are not individually authenticated before using the shared account (e.g., by

    the operating system or possibly by an application making calls to the database), this is

    a finding.

    The key is individual accountability. If this can be traced, this is not a finding.

    If accounts are determined to be shared, determine if they are directly accessible to end

    users. If so, this is a finding.

    Review contents of audit logs, traces, and data tables to confirm the identity of the

    individual user performing the action is captured.

    If shared identifiers are found, and not accompanied by individual identifiers, this is a

    finding.'
  remediation: 'Remove shared accounts which are not documented and have been determined to not

    be necessary.

    MariaDB> DROP USER ''user''@''hostname'';'
  checks:
  - type: sql
    command: SELECT user, host FROM mysql.user;
    severity: medium
    info: 'All users should have individual accounts with appropriate privileges. The root user

      should be removed after administrative accounts with SUPER privilege are created.

      Query all users and determine if any are suspected shared accounts. Document any

      necessary shared accounts.

      MariaDB> SELECT user, host FROM mysql.user;

      Determine if any accounts are shared. A shared account is defined as a username,

      '
- id: '1.5'
  title: MADB-10-000500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must provide audit record generation capability for DoD-defined auditable events within all DBMS/database
    components. GROUP ID: V-253670 RULE ID: SV-253670r960879'
  rationale: 'Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate
    the events relating to an incident or identify those responsible for one. Audit records can be generated from various
    components within MariaDB (e.g., process, module). Certain specific application functionalities may be audited as well.
    The list of audited events is the set of events for which audits are to be generated. This set of events is typically
    a subset of the list of all events for which the system is capable of generating audit records. DoD has defined the list
    of events for which MariaDB will provide an audit record generation capability as the following: (i) Successful and unsuccessful
    attempts to access, modify, or delete privileges, security objects, security levels, or categories of information (e.g.,
    classification levels); (ii) Access actions, such as successful and unsuccessful logon attempts, privileged activities,
    or other system-level access, starting and ending time for user access to the system, concurrent logons from different
    workstations, successful and unsuccessful accesses to objects, all program initiations, and all direct access to the information
    system; and (iii) All account creation, modification, disabling, and termination actions. Organizations may define additional
    events requiring continuous or ad hoc auditing.'
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'Verify the MariaDB Enterprise Audit plugin is loaded and actively logging:

    MariaDB> SHOW GLOBAL STATUS LIKE ''Server_audit_active'';

    If the MariaDB Enterprise Audit is not active, this is a finding.

    Check what filters are in place by running the following as an administrative user:

    MariaDB> SELECT * FROM mysql.server_audit_filters;

    Verify audit filters match organization-defined auditing requirements. If not, this is a

    finding.'
  remediation: "Configure MariaDB to generate audit records for at least the DoD minimum set of\nevents.\nEdit the mariadb-enterprise.cnf\
    \ configuration file located in /etc/my.cnf.d/.\nUnder [mariadb], add the following:\nserver_audit_logging = ON\nSave\
    \ the configuration file. This change will not take effect until MariaDB Enterprise\nServer is restarted.\nUsing the MariaDB\
    \ Enterprise Audit plugin, MariaDB can be configured to audit these\nrequests.\nThe MariaDB Enterprise Audit plugin can\
    \ be configured to audit these changes.\nUpdate necessary audit filters. Ex:\nMariaDB> DELETE FROM mysql.server_audit_filters\
    \ WHERE filtername = 'default';\nMariaDB> INSERT INTO mysql.server_audit_filters (filtername, rule)\n VALUES ('default',\n\
    \ JSON_COMPACT(\n '{\n \"connect_event\": [\n \"CONNECT\",\n \"DISCONNECT\"\n ],\n \"query_event\": [\n \"ALL\"\n ]\n\
    \ }'\n ));\nMore information about MariaDB auditing can be found here:\nhttps://mariadb.com/docs/security/mariadb-enterprise-audit/"
  checks:
  - type: sql
    command: SHOW GLOBAL STATUS LIKE 'Server_audit_active';
    severity: medium
    info: 'Verify the MariaDB Enterprise Audit plugin is loaded and actively logging:

      MariaDB> SHOW GLOBAL STATUS LIKE ''Server_audit_active'';

      If the MariaDB Enterprise Audit is not active, this is a finding.

      Check what filters are in place by running the following as an administrative user:

      MariaDB> SELECT * FROM mysql.server_audit_filters;

      Verify audit filters match organization-defined auditing requirement'
- id: '1.6'
  title: MADB-10-000600
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must allow only the ISSM (or individuals or roles appointed by the ISSM) to select which auditable
    events are to be audited. GROUP ID: V-253671 RULE ID: SV-253671r960882'
  rationale: Without the capability to restrict which roles and individuals can select which events are audited, unauthorized
    personnel may be able to prevent or interfere with the auditing of critical events. Suppression of auditing could permit
    an adversary to evade detection. Misconfigured audits can degrade the systems performance by overwhelming the audit log.
    Misconfigured audits may also make it more difficult to establish, correlate, and investigate the events relating to an
    incident or identify those responsible for one.
  impact: ''
  references: []
  page_start: 27
  audit_raw: "MariaDB Enterprise Audit plugin stores audit filters in the table\nmysql.server_audit_filters. Any users with\
    \ update/delete/insert access to this table can\nmodify the audit filters.\nUsers with global insert, update, delete,\
    \ and/or drop privileges can modify audit filters.\nFind users with global insert, update, delete, and/or drop privileges:\n\
    MariaDB> SELECT user, host, insert_priv, update_priv, delete_priv, drop_priv\nFROM mysql.user\nWHERE insert_priv = 'y'\n\
    OR update_priv = 'y'\nOR delete_priv = 'y'\nOR drop_priv = 'y';\nUsers with insert, update, delete, and/or drop privileges\
    \ on the mysql database can\nmodify audit filters. Find users with insert, update, delete, and/or drop privileges on the\n\
    mysql database:\nMariaDB> SELECT user, host, insert_priv, update_priv, delete_priv, drop_priv\nFROM mysql.db\nWHERE db\
    \ = 'mysql'\nAND (insert_priv = 'y'\n OR update_priv = 'y'\n OR delete_priv = 'y'\n OR drop_priv = 'y'\n );\nUsers with\
    \ insert, update, delete, and/or drop privileges on the server_audit_filters and\nserver_audit_users tables can modify\
    \ audit filters. Find users with insert, update, delete,\nand/or drop privileges on the mysql database:\nMariaDB> SELECT\
    \ user, host, db, table_name, grantor, table_priv, timestamp,\ncolumn_priv\nFROM mysql.tables_priv\nWHERE db = 'mysql'\n\
    AND table_name IN ('server_audit_filters','server_audit_users')\nAND (table_priv LIKE '%Insert%'\n OR table_priv LIKE\
    \ '%Update%'\n OR table_priv LIKE '%Delete%'\n OR table_priv LIKE '%Drop%'\n);\nIf any users with the above privileges\
    \ are found which should not have access to modify\naudit filters, this is a finding."
  remediation: 'Grant the necessary privileges to authorized users. Example:

    MariaDB> GRANT ALL PRIVILEGES ON mysql.server_audit_filters TO

    ''username''@''host'';

    MariaDB> GRANT ALL PRIVILEGES ON mysql.server_audit_users TO

    ''username''@''host'';

    For users found with access who are not authorized to modify audit filters, review the

    user''s privileges, and update accordingly.'
  checks:
  - type: sql
    command: SELECT user, host, insert_priv, update_priv, delete_priv, drop_priv
    severity: medium
    info: 'MariaDB Enterprise Audit plugin stores audit filters in the table

      mysql.server_audit_filters. Any users with update/delete/insert access to this table can

      modify the audit filters.

      Users with global insert, update, delete, and/or drop privileges can modify audit filters.

      Find users with global insert, update, delete, and/or drop privileges:

      MariaDB> SELECT user, host, insert_priv, update_priv, del'
- id: '1.7'
  title: MADB-10-000700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must be able to generate audit records when privileges/permissions are retrieved. GROUP ID: V-253672
    RULE ID: SV-253672r960885'
  rationale: Under some circumstances, it may be useful to monitor who/what is reading privilege/permission/role information.
    Therefore, it must be possible to configure auditing to do this. MariaDB makes such information available through an audit
    log file. This requirement addresses explicit requests for privilege/permission/role membership information. It does not
    refer to the implicit retrieval of privileges/permissions/role memberships that MariaDB continually performs to determine
    if any and every action on the database is permitted.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'Verify the MariaDB Enterprise Audit plugin is loaded and actively logging:

    MariaDB> SHOW GLOBAL STATUS LIKE ''Server_audit_active'';

    If the MariaDB Enterprise Audit is not active, this is a finding.

    Check what filters are in place by running the following as an administrative user:

    MariaDB> SELECT * FROM mysql.server_audit_filters;

    Verify query_events ALL is included in corresponding audit filters. If not, this is a finding.

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''server_audit_file_path'';

    As a Linux user with sufficient privileges to view logs, tail the audit log file.

    $ tail -f /var/log/mysql/server_audit.log (default location)

    In another terminal run:

    MariaDB> SHOW GRANTS;

    If an audit record is not produced in the first terminal, this is a finding.'
  remediation: "The MariaDB Enterprise Audit plugin can be configured to audit these changes.\nUpdate necessary audit filters\
    \ to include query_event ALL. Example:\nMariaDB> DELETE FROM mysql.server_audit_filters WHERE filtername = 'default';\n\
    MariaDB> INSERT INTO mysql.server_audit_filters (filtername, rule)\n VALUES ('default',\n JSON_COMPACT(\n '{\n \"connect_event\"\
    : [\n \"CONNECT\",\n \"DISCONNECT\"\n ],\n \"query_event\": [\n \"ALL\"\n ]\n }'\n ));"
  checks:
  - type: sql
    command: SHOW GLOBAL STATUS LIKE 'Server_audit_active';
    severity: medium
    info: 'Verify the MariaDB Enterprise Audit plugin is loaded and actively logging:

      MariaDB> SHOW GLOBAL STATUS LIKE ''Server_audit_active'';

      If the MariaDB Enterprise Audit is not active, this is a finding.

      Check what filters are in place by running the following as an administrative user:

      MariaDB> SELECT * FROM mysql.server_audit_filters;

      Verify query_events ALL is included in corresponding audit filters. '
- id: '1.8'
  title: MADB-10-000800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must be able to generate audit records when unsuccessful attempts to retrieve privileges/permissions
    occur. GROUP ID: V-253673 RULE ID: SV-253673r960885'
  rationale: Under some circumstances, it may be useful to monitor who/what is reading privilege/permission/role information.
    Therefore, it must be possible to configure auditing to do this. MariaDB makes such information available through an audit
    log file. This requirement addresses explicit requests for privilege/permission/role membership information. It does not
    refer to the implicit retrieval of privileges/permissions/role memberships that MariaDB continually performs to determine
    if any and every action on the database is permitted. To aid in diagnosis, it is necessary to keep track of failed attempts
    in addition to the successful ones.
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'As the database administrator, create a user by running the following SQL:

    MariaDB> CREATE USER ''test_user''@''localhost'' IDENTIFIED BY

    ''test_user_password'';

    In one terminal, tail the audit log file:

    tail -F /var/lib/mysql/server_audit.log (default location)

    In another terminal attempt to retrieve information from the MariaDB table,

    mysql.roles_mapping, by logging in as the test_user and running a query which it does

    not have privileges to do, for example:

    $ mariadb -u test_user -p

    MariaDB> SELECT * FROM mysql.roles_mapping;

    The audit log will show:

    20190321 21:39:20,5a7e16cc51f7, test_user ,localhost,127,394,QUERY,, select *

    from mysql.roles_mapping ,1142

    To find failed queries, look for two elements: The notation indicating that it is

    a QUERY entry, and the last value for the entry. If the query is unsuccessful, the value

    will be NOT EQUAL TO 0.

    If the above steps cannot verify that audit records are produced when MariaDB denies

    retrieval of privileges/permissions/role memberships, this is a finding.

    If an audit record is not produced in the first terminal, this is a finding.'
  remediation: 'Verify the MariaDB Enterprise Audit plugin is loaded and actively logging:

    MariaDB> SHOW GLOBAL STATUS LIKE ''Server_audit_active'';

    Check what filters are in place by running the following as an administrative user:

    MariaDB> SELECT * FROM mysql.server_audit_filters;

    Update the filters as necessary.'
  checks:
  - type: sql
    command: SELECT * FROM mysql.roles_mapping;
    severity: medium
    info: 'As the database administrator, create a user by running the following SQL:

      MariaDB> CREATE USER ''test_user''@''localhost'' IDENTIFIED BY

      ''test_user_password'';

