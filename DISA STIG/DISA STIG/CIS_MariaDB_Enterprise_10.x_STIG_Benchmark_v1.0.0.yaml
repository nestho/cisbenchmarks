- id: '1.69'
  title: MADB-10-008300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must prohibit the use of cached authenticators after an organization-defined time period. GROUP ID:
    V-253736 RULE ID: SV-253736r961521'
  rationale: If cached authentication information is out-of-date, the validity of the authentication information may be questionable.
    Each connection to the MariaDB database requires the authentication of the user. The authentication remains in place for
    the connection until the connection is closed or the connection times out due to inactivity.
  impact: ''
  references: []
  page_start: 168
  audit_raw: 'The system parameter idle_transaction_timeout specifies in seconds when a connection

    will be terminated due to inactivity. After a connection is terminated, a new request to

    the database must be preceded by an authentication, which is not cached within the

    database.

    Run the following SQL:

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''idle_transaction_timeout'';

    If the value is 0, this is a finding.'
  remediation: 'Verify that the idle_transaction_wait is set to a value greater than 0 or is set to the value

    needed by the administrator. The value of idle_transaction_wait can be validated by

    issuing SHOW VARIABLES. Example:

    Locate the MariaDB Enterprise Server configuration files in /etc/my.cnf.d/. Add the

    following:

    Under the [mariadb] section:

    idle_transaction_timeout = 60

    After making changes to the .cnf file, stop and restart the database service.'
  checks:
  - type: sql
    command: SHOW GLOBAL VARIABLES LIKE 'idle_transaction_timeout';
    severity: medium
    info: 'The system parameter idle_transaction_timeout specifies in seconds when a connection

      will be terminated due to inactivity. After a connection is terminated, a new request to

      the database must be preceded by an authentication, which is not cached within the

      database.

      Run the following SQL:

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''idle_transaction_timeout'';

      If the value is 0, this is a finding.'
- id: '1.70'
  title: MADB-10-008400
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'MariaDB must use NSA-approved cryptography to protect classified information in accordance with the data owner''s
    requirements. GROUP ID: V-253737 RULE ID: SV-253737r962034'
  rationale: Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect data.
    The application must implement cryptographic modules adhering to the higher standards approved by the federal government
    since this provides assurance they have been tested and validated. It is the responsibility of the data owner to assess
    the cryptography requirements in light of applicable federal laws, Executive Orders, directives, policies, regulations,
    and standards. NSA-approved cryptography for classified networks is hardware based. This requirement addresses the compatibility
    of MariaDB with the encryption devices.
  impact: ''
  references: []
  page_start: 170
  audit_raw: 'If MariaDB is deployed in an unclassified environment, this is not applicable (NA).

    If MariaDB is not using NSA-approved cryptography to protect classified information in

    accordance with applicable federal laws, Executive Orders, directives, policies,

    regulations, and standards, this is a finding.

    To check if MariaDB is configured to use SSL, as the database administrator:

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''have_ssl'';

    If have_ssl is not YES, this is a finding.

    Consult network administration staff to determine whether the server is protected by

    NSA-approved encrypting devices. If not, this a finding.'
  remediation: 'Configure the DBMS and related system components to use NSA-approved

    cryptography to protect classified information in accordance with applicable federal

    laws, Executive Orders, directives, policies, regulations, and standards.

    Configure MariaDB to use TLS.

    Details for this procedure can be found here:

    https://mariadb.com/docs/security/encryption/in-transit/enable-tls-server/'
  checks:
  - type: sql
    command: SHOW GLOBAL VARIABLES LIKE 'have_ssl';
    severity: medium
    info: 'If MariaDB is deployed in an unclassified environment, this is not applicable (NA).

      If MariaDB is not using NSA-approved cryptography to protect classified information in

      accordance with applicable federal laws, Executive Orders, directives, policies,

      regulations, and standards, this is a finding.

      To check if MariaDB is configured to use SSL, as the database administrator:

      MariaDB> SHOW GLOBAL VAR'
- id: '1.71'
  title: MADB-10-008500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must only accept end entity certificates issued by DoD PKI or DoD-approved PKI Certification Authorities
    (CAs) for the establishment of all encrypted sessions. GROUP ID: V-253738 RULE ID: SV-253738r961596'
  rationale: Only DoD-approved external PKIs have been evaluated to ensure that they have security controls and identity vetting
    procedures in place that are sufficient for DoD systems to rely on the identity asserted in the certificate. PKIs lacking
    sufficient security controls and identity vetting procedures risk being compromised and issuing certificates that enable
    adversaries to impersonate legitimate users. The authoritative list of DoD-approved PKIs is published at https://dl.dod.cyber.mil/wpcontent/uploads/pki-pke/pdf/unclass-ss_using_commercial_pki_certificates.pdf.
    This requirement focuses on communications protection for the MariaDB session rather than for the network packet.
  impact: ''
  references: []
  page_start: 172
  audit_raw: 'As the database administrator, check the following variables:

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''ssl_ca'';

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''ssl_cert'';

    The Value column will show the fully qualified file name of the ssl_ca and ssl_cert

    respectively. The issuer can be found by running the following command:

    $ openssl x509 -in fully-qualified-file-name-of-ssl_ca -noout -issuer

    $ openssl x509 -in fully-qualified-file-name-of-ssl_cert -noout -issuer

    The issuer should be checked against the authoritative list of DoD-approved PKIs,

    which is published at https://dl.dod.cyber.mil/wp-content/uploads/pki-pke/pdf/unclassss_using_commercial_pki_certificates.pdf.

    If the DBMS will accept non-DoD approved PKI end-entity certificates, this is a finding.'
  remediation: 'Revoke trust in any certificates not issued by a DoD-approved certificate authority.

    Configure MariaDB to accept only DoD and DoD-approved PKI end-entity certificates.'
  checks:
  - type: sql
    command: SHOW GLOBAL VARIABLES LIKE 'ssl_ca';
    severity: medium
    info: 'As the database administrator, check the following variables:

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''ssl_ca'';

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''ssl_cert'';

      The Value column will show the fully qualified file name of the ssl_ca and ssl_cert

      respectively. The issuer can be found by running the following command:

      $ openssl x509 -in fully-qualified-file-name-of-ssl_ca -noout -issuer

      $ openssl x509 -in'
- id: '1.72'
  title: MADB-10-008600
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'MariaDB must implement cryptographic mechanisms to prevent unauthorized modification of organization-defined
    information at rest (to include, at a minimum, PII and classified information) on organization-defined information system
    components. GROUP ID: V-253739 RULE ID: SV-253739r1018554'
  rationale: MariaDB’s handling of data requiring data at rest protections must employ cryptographic mechanisms to prevent
    unauthorized disclosure and modification of the information at rest. These cryptographic mechanisms may be native to the
    MariaDB or implemented via additional software or operating system/file system settings, as appropriate to the situation.
    Selection of a cryptographic mechanism is based on the need to protect the integrity of organizational information. The
    strength of the mechanism is commensurate with the security category and/or classification of the information. Organizations
    have the flexibility to either encrypt all information on storage devices (i.e., full disk encryption) or encrypt specific
    data structures (e.g., files, records, or fields). The decision whether and what to encrypt rests with the data owner
    and is also influenced by the physical measures taken to secure the equipment and media on which the information resides.
  impact: ''
  references: []
  page_start: 174
  audit_raw: 'Review the security guide to determine whether the organization has defined the

    information at rest that is to be protected from modification, which must include, at a

    minimum, PII and classified information.

    If no information is identified as requiring such protection, this is not a finding.

    Review the configuration of MariaDB, operating system/file system, and additional

    software as relevant.

    One possible way to encrypt data within MariaDB is to use the file key management

    plugin. To determine if this is installed, check the following variables as the Database

    administrator:

    MariaDB> SHOW PLUGINS;

    Confirm the file_key_management.so is listed.

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''file_key%'';

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''aria_en%'';

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''innodb_encrypt_tables'';

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''innodb_encrypt_log'';

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''innodb_tablespace%'';

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''encrypt%'';

    Confirm that these are ON.

    If any of the information defined as requiring cryptographic protection from modification

    is not encrypted in a manner that provides the required level of protection, this is a

    finding.'
  remediation: 'Configure MariaDB, operating system/file system, and additional software as relevant,

    to provide the required level of cryptographic protection.

    Once the File Key Management Plugin is enabled, use it by creating an encrypted table:

    MariaDB> CREATE TABLE t (i int) ENGINE=InnoDB ENCRYPTED=YES;

    Now, table t will be encrypted using the encryption key from the key file.'
  checks:
  - type: sql
    command: SHOW PLUGINS;
    severity: medium
    info: 'Review the security guide to determine whether the organization has defined the

      information at rest that is to be protected from modification, which must include, at a

      minimum, PII and classified information.

      If no information is identified as requiring such protection, this is not a finding.

      Review the configuration of MariaDB, operating system/file system, and additional

      software as relevant.

      On'
