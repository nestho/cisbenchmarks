    severity: medium
- id: '1.37'
  title: MADB-10-004300
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'MariaDB must obscure feedback of authentication information during the authentication process to protect the
    information from possible exploitation/use by unauthorized individuals. GROUP ID: V-253702 RULE ID: SV-253702r961047'
  rationale: The DoD standard for authentication is DoD-approved PKI certificates. Normally, with PKI authentication, the
    interaction with the user for authentication will be handled by a software component separate from the DBMS, such as ActivIdentity
    ActivClient. However, in cases where the DBMS controls the interaction, this requirement applies. To prevent the compromise
    of authentication information such as passwords and PINs during the authentication process, the feedback from the system
    must not provide any information that would allow an unauthorized user to compromise the authentication mechanism. Obfuscation
    of user-provided authentication secrets when typed into the system is a method used in addressing this risk. Displaying
    asterisks when a user types in a password or a smart card PIN is an example of obscuring feedback of authentication secrets.
    This calls for review of applications, which will require collaboration with the application developers. It is recognized
    that in many cases, the database administrator (DBA) is organizationally separate from the application developers, and
    may have limited, if any, access to source code. Nevertheless, protections of this type are so important to the secure
    operation of databases that they must not be ignored. At a minimum, the DBA must attempt to obtain assurances from the
    development organization that this issue has been addressed and must document what has been discovered.
  impact: ''
  references: []
  page_start: 90
  audit_raw: 'Verify best practices are documented and users trained to use the password command

    line interface flags appropriately.

    For example, the command line option --password (or -p) prompts for a password to be

    entered and obscures feedback on the typed in password.

    Ensure users are trained to use alternatives to command line password parameters, if

    they are not, this is a finding.'
  remediation: 'When connecting to the database, the username and password are sent to the server

    via the command line interface or other connector interface. Using the command line

    interface, passing the -p or --password flags but not including the password in the

    command will prompt for the password and not display it on the screen as typed.

    Example:

    mariadb -u username -p'
  checks:
  - type: manual_review
    info: 'Verify best practices are documented and users trained to use the password command

      line interface flags appropriately.

      For example, the command line option --password (or -p) prompts for a password to be

      entered and obscures feedback on the typed in password.

      Ensure users are trained to use alternatives to command line password parameters, if

      they are not, this is a finding.'
    severity: medium
- id: '1.38'
  title: MADB-10-004400
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'MariaDB must use NIST FIPS 140-2 validated cryptographic modules for cryptographic operations. GROUP ID: V-253703
    RULE ID: SV-253703r961050'
  rationale: Use of weak or not validated cryptographic algorithms undermines the purposes of utilizing encryption and digital
    signatures to protect data. Weak algorithms can be easily broken and not validated cryptographic modules may not implement
    algorithms correctly. Unapproved cryptographic modules or algorithms should not be relied on for authentication, confidentiality,
    or integrity. Weak cryptography could allow an attacker to gain access to and modify data stored in the database as well
    as the administration settings of the DBMS. Applications, including DBMSs, utilizing cryptography are required to use
    approved NIST FIPS 140-2 validated cryptographic modules that meet the requirements of applicable federal laws, Executive
    Orders, directives, policies, regulations, standards, and guidance. The security functions validated as part of FIPS 140-2
    for cryptographic modules are described in FIPS 140-2 Annex A. NSA Type-X (where X=1, 2, 3, 4) products are NSA-certified,
    hardware-based encryption modules.
  impact: ''
  references: []
  page_start: 92
  audit_raw: 'As the system administrator, run the following at the Linux commands:

    # openssl version

    OpenSSL 1.0.2k-fips 26 Jan 2017

    If fips is not included in the openssl version, this is a finding.

    # sysctl crypto.fips_enabled

    crypto.fips_enabled = 1

    If crypto.fips_enabled = 0, this is a finding.

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''%have_openssl'';

    If the value of have_openssl is not YES, this is a finding.

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''%version_ssl_library%'';

    If the value of version_ssl_library does not contain fips, this is a finding.

    Examine the application''s code to verify it does not make calls using libmysqlclient.

    If code uses libmysqlclient, this is a finding.'
  remediation: 'If crypto.fips_enabled = 0, for Red Hat Linux, configure the operating system to

    implement DoD-approved encryption by following the steps below:

    To enable strict FIPS compliance, the fips=1 kernel option must be added to the kernel

    command line during system installation so key generation is done with FIPS-approved

    algorithms and continuous monitoring tests in place.

    Enable FIPS mode with the following command:

    # sudo fips-mode-setup --enable

    Modify the kernel command line of the current kernel in the "grub.cfg" file by adding the

    following option to the GRUB_CMDLINE_LINUX key in the "/etc/default/grub" file and

    then rebuild the "grub.cfg" file:

    fips=1

    Changes to "/etc/default/grub" require rebuilding the "grub.cfg" file as follows:

    On BIOS-based machines, use the following command:

    # sudo grub2-mkconfig -o /boot/grub2/grub.cfg

    On UEFI-based machines, use the following command:

    # sudo grub2-mkconfig -o /boot/efi/EFI/redhat/grub.cfg

    If /boot or /boot/efi reside on separate partitions, the kernel parameter "boot=<partition

    of /boot or /boot/efi>" must be added to the kernel command line. Identify a partition by

    running the df /boot or df /boot/efi command:

    # sudo df /boot

    Filesystem 1K-blocks Used Available Use% Mounted on

    /dev/sda1 495844 53780 416464 12% /boot

    To ensure the "boot=" configuration option will work even if device naming changes

    occur between boots, identify the universally unique identifier (UUID) of the partition

    with the following command:

    # sudo blkid /dev/sda1

    /dev/sda1: UUID="05c000f1-a213-759e-c7a2-f11b7424c797" TYPE="ext4"

    For the example above, append the following string to the kernel command line:

    boot=UUID=05c000f1-a213-759e-c7a2-f11b7424c797

    Reboot the system for the changes to take effect.

    More information can be found here:

    RedHat: https://access.redhat.com/documentation/enus/red_hat_enterprise_linux/7/html/security_guide/chapfederal_standards_and_regulations

    Ubuntu: https://security-certs.docs.ubuntu.com/en/fips'
  checks:
  - type: sql
    command: SHOW GLOBAL VARIABLES LIKE '%have_openssl';
    severity: medium
    info: 'As the system administrator, run the following at the Linux commands:

      # openssl version

      OpenSSL 1.0.2k-fips 26 Jan 2017

      If fips is not included in the openssl version, this is a finding.

      # sysctl crypto.fips_enabled

      crypto.fips_enabled = 1

      If crypto.fips_enabled = 0, this is a finding.

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''%have_openssl'';

      If the value of have_openssl is not YES, this is a finding.

      '
- id: '1.39'
  title: MADB-10-004500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The MariaDB must uniquely identify and authenticate nonorganizational users (or processes acting on behalf
    of nonorganizational users). GROUP ID: V-253704 RULE ID: SV-253704r961053'
  rationale: Nonorganizational users include all information system users other than organizational users, which include organizational
    employees or individuals the organization deems to have equivalent status of employees (e.g., contractors, guest researchers,
    individuals from allied nations). Nonorganizational users must be uniquely identified and authenticated for all accesses
    other than those accesses explicitly identified and documented by the organization when related to the use of anonymous
    access, such as accessing a web server. Accordingly, a risk assessment is used in determining the authentication needs
    of the organization. Scalability, practicality, and security are simultaneously considered in balancing the need to ensure
    ease of use for access to federal information and information systems with the need to protect and adequately mitigate
    risk to organizational operations, organizational assets, individuals, other organizations, and the nation.
  impact: ''
  references: []
  page_start: 95
  audit_raw: 'All users should have individual accounts with appropriate privileges. The root users

    should be removed after administrative accounts with SUPER privilege are created.

    Query all users and determine if any are suspected shared accounts. Document any

    necessary shared accounts.

    MariaDB> SELECT user, host FROM mysql.user;

    Determine if any accounts are shared. A shared account is defined as a username,

    hostname, and password that are used by multiple individuals to log in to MariaDB. An

    example of a shared account is the MariaDB root account – root@localhost.

    If accounts are determined to be shared, determine if individuals are first individually

    authenticated.

    If individuals are not individually authenticated before using the shared account (e.g., by

    the operating system or possibly by an application making calls to the database), this is

    a finding.

    The key is individual accountability. If this can be traced, this is not a finding.

    If accounts are determined to be shared, determine if they are directly accessible to end

    users. If so, this is a finding.

    Review contents of audit logs, traces, and data tables to confirm the identity of the

    individual user performing the action is captured.

    If shared identifiers are found, and not accompanied by individual identifiers, this is a

    finding.'
  remediation: 'Remove shared accounts which are not documented and have been determined to not

    be necessary.

    MariaDB> DROP USER ''user''@''hostname'';'
  checks:
  - type: sql
    command: SELECT user, host FROM mysql.user;
    severity: medium
    info: 'All users should have individual accounts with appropriate privileges. The root users

      should be removed after administrative accounts with SUPER privilege are created.

      Query all users and determine if any are suspected shared accounts. Document any

      necessary shared accounts.

