    determine whether a real-time alert will be sent to the appropriate personnel when

    auditing fails for any reason.

    If real-time alerts are not sent upon auditing failure, this is a finding.'
  remediation: 'Configure the system to provide an immediate real-time alert to appropriate support

    staff when a specified audit failure occurs.

    It is possible to create scripts or implement third-party tools to enable real-time alerting

    for audit failures in MariaDB.'
  checks:
