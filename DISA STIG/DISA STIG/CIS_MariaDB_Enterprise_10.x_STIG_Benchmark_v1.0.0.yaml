- id: '1.27'
  title: MADB-10-003400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Access to external executables must be disabled or restricted. GROUP ID: V-253692 RULE ID: SV-253692r960963'
  rationale: Information systems are capable of providing a wide variety of functions and services. Some of the functions
    and services, provided by default, may not be necessary to support essential organizational operations (e.g., key missions,
    functions). It is detrimental for applications to provide, or install by default, functionality exceeding requirements
    or mission objectives. Applications must adhere to the principles of least functionality by providing only essential capabilities.
    MariaDB may spawn additional external processes to execute procedures that are defined in MariaDB but stored in external
    host files (external procedures). The spawned process used to execute the external procedure may operate within a different
    OS security context than MariaDB and provide unauthorized access to the host system.
  impact: ''
  references: []
  page_start: 70
  audit_raw: 'MariaDB''s LOAD DATA LOCAL INFILE command can interact with the server''s

    underlying OS.

    To check the value of this option, run the following command as the database

    administrator:

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''local_infile'';

    Verify the option is set according to the security guide. If it is not, this is a finding.

    If the value of local_infile is set to ON per the security guide, user privileges must be

    checked. Only users with FILE privilege can use the LOAD DATA LOCAL INFILE

    command.

    To check the users who have FILE privilege against the security guide, run the following

    commands as the database administrator.

    1. Check which users have FILE privilege and GRANT OPTION privileges and

    compare to the security guide to determine if a user has FILE privilege that

    should not or if a user has GRANT OPTION and should not.

    If the users have privileges they should not have, this is a finding.

    Run this script to create the SHOW GRANTS script for each user:

    MariaDB> SELECT DISTINCT CONCAT( ''SHOW GRANTS FOR '', user,''@'', host,'';'') AS

    grantQuery FROM mysql.user WHERE is_role = ''N'';

    Run each SHOW GRANTS command for each user.

    MariaDB> SHOW GRANTS FOR ''user''@''host'';

    2. Check which roles have FILE privilege and GRANT OPTION privileges and

    compare to the security guide to determine if a role has FILE privilege that should

    not or if a role has GRANT OPTION and should not.

    If the roles have privileges they should not have, this is a finding.

    MariaDB> SELECT DISTINCT CONCAT(''SHOW GRANTS FOR '',role, '';'') FROM

    mysql.roles_mapping;

    Run each SHOW GRANTS command for each role.

    3. From the two outputs above, check which users and roles can set roles and grant

    privileges by checking who has GRANT OPTION and FILE privileges and

    comparing to the security guide.

    If any user or role has GRANT OPTION or FILE privileges they should not have, this is

    a finding.'
  remediation: 'To disable LOAD DATA LOCAL INFILE make the following update as the database

    administrator:

    Edit the mariadb-enterprise.cnf configuration file located in /etc/my.cnf.d/.

    Under [mariadb], add the following:

    local_infile = 0

    Save the configuration file. This change will not take effect until MariaDB Enterprise

    Server is restarted.

    To remove FILE and GRANT OPTION privileges use the right combination of the

    following commands:

    1. revoke FILE privilege from a user

    MariaDB> REVOKE FILE FROM ''user''@''host'';

    2. revoke FILE privilege from a role

    MariaDB> REVOKE FILE FROM role;

    3. revoke GRANT OPTION privilege from a user

    MariaDB> REVOKE GRANT OPTION FROM ''user''@''host'';

    4. revoke a role grant from a user

    MariaDB> REVOKE ROLE FROM grantee;'
  checks:
  - type: sql
    command: SHOW GLOBAL VARIABLES LIKE 'local_infile';
    severity: medium
    info: 'MariaDB''s LOAD DATA LOCAL INFILE command can interact with the server''s

      underlying OS.

      To check the value of this option, run the following command as the database

      administrator:

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''local_infile'';

      Verify the option is set according to the security guide. If it is not, this is a finding.

      If the value of local_infile is set to ON per the security guide, user privile'
- id: '1.28'
  title: MADB-10-003500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must be configured to prohibit or restrict the use of organization-defined functions, ports, protocols,
    and/or services, as defined in the PPSM CAL and vulnerability assessments. GROUP ID: V-253693 RULE ID: SV-253693r1043177'
  rationale: To prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized tunneling
    (i.e., embedding of data types within data types), organizations must disable or restrict unused or unnecessary physical
    and logical ports/protocols/services on information systems. Applications are capable of providing a wide variety of functions
    and services. Some of the functions and services provided by default may not be necessary to support essential organizational
    operations. Additionally, it is sometimes convenient to provide multiple services from a single component (e.g., email
    and web services); however, doing so increases risk over limiting the services provided by any one component. To support
    the requirements and principles of least functionality, the application must support the organizational requirements,
    providing only essential capabilities and limiting the use of ports, protocols, and/or services to only those required,
    authorized, and approved to conduct official business or address authorized quality-of-life issues. Database Management
    Systems using ports, protocols, and services deemed unsafe are open to attack through those ports, protocols, and services.
    This can allow unauthorized access to the database and through the database to other components of the information system.
  impact: ''
  references: []
  page_start: 73
  audit_raw: 'Review system documentation for a list of approved ports.

    As the database administrator, run the following command to determine the currently

    defined port:

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''%port%'';

    If the currently defined port is deemed prohibited, this is a finding.'
  remediation: 'Modify the MariaDB configuration file located within /etc/my.cnf.d/ and update the

    variable port to an acceptable port. Restart MariaDB Enterprise Server.

    Example:

    [server]

    port = 4008'
  checks:
  - type: sql
    command: SHOW GLOBAL VARIABLES LIKE '%port%';
    severity: medium
    info: 'Review system documentation for a list of approved ports.

      As the database administrator, run the following command to determine the currently

      defined port:

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''%port%'';

      If the currently defined port is deemed prohibited, this is a finding.'
- id: '1.29'
  title: MADB-10-003600
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must uniquely identify and authenticate organizational users (or processes acting on behalf of organizational
    users). GROUP ID: V-253694 RULE ID: SV-253694r1051115'
  rationale: 'To ensure accountability and prevent unauthenticated access, organizational users must be identified and authenticated
    to prevent potential misuse and compromise of the system. Organizational users include organizational employees or individuals
    the organization deems to have equivalent status of employees (e.g., contractors). Organizational users (and any processes
    acting on behalf of users) must be uniquely identified and authenticated for all accesses, except the following: (i) Accesses
    explicitly identified and documented by the organization. Organizations document specific user actions that can be performed
    on the information system without identification or authentication; and (ii) Accesses that occur through authorized use
    of group authenticators without individual authentication. Organizations may require unique identification of individuals
    using shared accounts, for detailed accountability of individual activity. It is recommended to not allow shared accounts,
    including root. The root user is known by all attackers, and often used in attempted attacks on the database servers.'
  impact: ''
  references: []
  page_start: 75
  audit_raw: 'All users should have individual accounts with appropriate privileges. The root users

    should be removed after administrative accounts with SUPER privilege are created.

    Query all users and determine if any are suspected shared accounts. Document any

    necessary shared accounts.

    MariaDB> SELECT user, host FROM mysql.user;

    Determine if any accounts are shared. A shared account is defined as a username,

    hostname, and password that are used by multiple individuals to log in to MariaDB. An

    example of a shared account is the MariaDB root account – root@localhost.

    If accounts are determined to be shared, determine if individuals are first individually

    authenticated.

    If individuals are not individually authenticated before using the shared account (e.g., by

    the operating system or possibly by an application making calls to the database), this is

    a finding.

    The key is individual accountability. If this can be traced, this is not a finding.

    If accounts are determined to be shared, determine if they are directly accessible to end

    users. If so, this is a finding.

    Review contents of audit logs, traces, and data tables to confirm the identity of the

    individual user performing the action is captured.

    If shared identifiers are found, and not accompanied by individual identifiers, this is a

    finding.'
  remediation: 'Remove shared accounts which are not documented and have been determined to not

    be necessary.

    MariaDB> DROP USER ''user''@''hostname'';'
