    severity: medium
- id: '1.13'
  title: MADB-10-001800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must be configurable to overwrite audit log records, oldest first (First-In-FirstOut - FIFO), in the
    event of unavailability of space for more audit log records. GROUP ID: V-253678 RULE ID: SV-253678r1043188'
  rationale: 'It is critical that when MariaDB is at risk of failing to process audit logs as required, it take action to
    mitigate the failure. Audit processing failures include software/hardware errors; failures in the audit capturing mechanisms;
    and audit storage capacity being reached or exceeded. Responses to audit failure depend upon the nature of the failure
    mode. When availability is an overriding concern, approved actions in response to an audit failure are as follows: (i)
    If the failure was caused by the lack of audit record storage capacity, the DBMS must continue generating audit records,
    if possible (automatically restarting the audit service if necessary), overwriting the oldest audit records in a first-in-first-out
    manner. (ii) If audit records are sent to a centralized collection server and communication with this server is lost or
    the server fails, the DBMS must queue audit records locally until communication is restored or until the audit records
    are retrieved manually. Upon restoration of the connection to the centralized collection server, action should be taken
    to synchronize the local audit data with the collection server. Systems where availability is paramount will most likely
    be MAC I; the final determination is the prerogative of the application owner, subject to Authorizing Official concurrence.
    In any case, sufficient auditing resources must be allocated to avoid audit data loss in all but the most extreme situations.'
  impact: ''
  references: []
  page_start: 43
  audit_raw: 'If the application owner has determined that the need for system availability outweighs

    the need for a complete audit trail, this is not applicable (NA).

    If an externally managed and monitored partition or logical volume that can be grown

    dynamically is being used for logging, this is not a finding.

    If MariaDB is auditing to a directory that is not being actively checked for availability of

    disk space, and if a tool, utility, script, or other mechanism is not being used to ensure

    sufficient disk space is available for the creation of new audit logs, this is a finding.

    If a tool, utility, script, or other mechanism is being used to rotate audit logs, and oldest

    logs are not being removed to ensure sufficient space for newest logs, or oldest logs are

    not being replaced by newest logs, this is a finding.'
  remediation: 'Establish a process with accompanying tools for monitoring available disk space and

    ensuring that sufficient disk space is maintained to continue generating audit logs,

    overwriting the oldest existing records if necessary.

    To set up the audit logs to write to sylog:

    Edit the mariadb-enterprise.cnf file. Add the following under the [mariadb] section:

    server_audit_output_type = ''syslog''

    After the .cnf file is updated and saved, the mariadb database service must be

    restarted.

    If not writing to syslog, log rotation and purging should be configured.'
  checks:
  - type: manual_review
    info: 'If the application owner has determined that the need for system availability outweighs

      the need for a complete audit trail, this is not applicable (NA).

      If an externally managed and monitored partition or logical volume that can be grown

      dynamically is being used for logging, this is not a finding.

      If MariaDB is auditing to a directory that is not being actively checked for availability of

      disk space, and if a tool, utility, script, or other mechanism is not being used to ensure

      sufficient disk'
    severity: medium
- id: '1.14'
  title: MADB-10-002100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The audit information produced by MariaDB must be protected from unauthorized modification. GROUP ID: V-253680
    RULE ID: SV-253680r960933'
  rationale: If audit data were to become compromised, then competent forensic analysis and discovery of the true source of
    potentially malicious system activity is impossible to achieve. To ensure the veracity of audit data the information system
    and/or the application must protect audit information from unauthorized modification. This requirement can be achieved
    through multiple methods that will depend upon system architecture and design. Some commonly employed methods include
    ensuring log files enjoy the proper file system permissions and limiting log data locations. Applications providing a
    user interface to audit data will leverage user permissions and roles identifying the user accessing the data and the
    corresponding rights that the user enjoys to make access decisions regarding the modification of audit data. Audit information
    includes all information (e.g., audit records, audit settings, and audit reports) needed to successfully audit information
    system activity. Modification of database audit data could mask the theft of, or the unauthorized modification of, sensitive
    data stored in the database.
  impact: ''
  references: []
  page_start: 45
  audit_raw: 'Determine if the MariaDB Enterprise Audit plugin is logging to a file or syslog.

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''server_audit_output_type'';

    If FILE, find the location of the audit log:

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''server_audit_file_path'';

    If FILE, check the permission of the file:

    $ sudo ls -al /path/to/audit.log

    Consult the organization''s security guide on acceptable permissions and ownership of

    logs with respect to who can modify them. Verify the log files have the set

    configurations.

    If the permissions are not set to the organization''s standards, this is a finding.

    If the MariaDB server is configured to use syslog for logging, consult the organization''s

    syslog setting for permissions and ownership of logs with respect to who can modify

    them.'
  remediation: 'If the audit.log file permissions do not comply with organization''s standards, change the

    permissions. Example:

    $ chown user:group /path/to/audit.log

    $ chmod 660 /path/to/audit.log

    If the MariaDB server is configured to use syslog for logging, consult the organization''s

    syslog setting for permissions and ownership of logs with respect to who can modify

    them.'
  checks:
  - type: sql
    command: SHOW GLOBAL VARIABLES LIKE 'server_audit_output_type';
    severity: medium
    info: 'Determine if the MariaDB Enterprise Audit plugin is logging to a file or syslog.

