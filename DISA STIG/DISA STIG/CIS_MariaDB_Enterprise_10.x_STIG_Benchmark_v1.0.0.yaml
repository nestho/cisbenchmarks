  title: MADB-10-009400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must be able to generate audit records when security objects are accessed. GROUP ID: V-253746 RULE
    ID: SV-253746r961791'
  rationale: 'Changes to the security configuration must be tracked. This requirement applies to situations where security
    data is retrieved or modified via data manipulation operations, as opposed to via specialized security functionality.
    In an SQL environment, types of access include, but are not necessarily limited to: SELECT CREATE INSERT UPDATE DELETE
    EXECUTE ALTER DROP'
  impact: ''
  references: []
  page_start: 190
  audit_raw: 'Verify the MariaDB Enterprise Audit plugin is loaded and actively logging:

    MariaDB> SHOW GLOBAL STATUS LIKE ''Server_audit_active'';

    If the MariaDB Enterprise Audit is not active, this is a finding.

    Check what filters are in place by running the following as an administrative user:

    MariaDB> SELECT * FROM mysql.server_audit_filters;

    Verify query_events includes ALL in corresponding audit filters. If not, this is a finding.'
  remediation: "The MariaDB Enterprise Audit plugin can be configured to audit these changes.\nUpdate necessary audit filters\
    \ to include query_event ALL. Example:\nMariaDB> DELETE FROM mysql.server_audit_filters WHERE filtername = 'default';\n\
    MariaDB> INSERT INTO mysql.server_audit_filters (filtername, rule)\n VALUES ('default',\n JSON_COMPACT(\n '{\n \"connect_event\"\
    : [\n \"CONNECT\",\n \"DISCONNECT\"\n ],\n \"query_event\": [\n \"ALL\"\n ]\n }'\n ));"
