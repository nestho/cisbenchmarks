- id: '1.108'
  title: MADB-10-012300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must implement NIST FIPS 140-2 validated cryptographic modules to protect unclassified information
    requiring confidentiality and cryptographic protection, in accordance with the data owners requirements. GROUP ID: V-253775
    RULE ID: SV-253775r961857'
  rationale: Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect data.
    The application must implement cryptographic modules adhering to the higher standards approved by the federal government
    since this provides assurance they have been tested and validated. It is the responsibility of the data owner to assess
    the cryptography requirements in light of applicable federal laws, Executive Orders, directives, policies, regulations,
    and standards. For detailed information, refer to NIST FIPS Publication 140-2, Security Requirements For Cryptographic
    Modules. Note that the product's cryptographic modules must be validated and certified by NIST as FIPS-compliant.
  impact: ''
  references: []
