    file will still be in the datadir directory.

    error_log

    innodb_log_group_home_dir

    innodb_temp_data_file_path

    innodb_tmpdir

    innodb_undo_directory

    innodb_temp_data_file_path

    innodb_tmpdir

    log_bin_basename

    log_error

    relay_log_basename

    relay_log_file_info

    sql_error_log_filename

    tmpdir

    Configure the permissions granted by the operating system/file system on the database

    files, database log files, and database backup files so that only relevant system

    accounts and authorized system administrators and database administrators with a

    need to know are permitted to read/view these files.

    Any files (e.g., extra configuration files) created in datadir, or a nondefault directory

    defined by a variable above, must be owned by the database administrator, with only

