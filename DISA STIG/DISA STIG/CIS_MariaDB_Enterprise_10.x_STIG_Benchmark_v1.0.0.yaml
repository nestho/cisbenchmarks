  - type: manual_review
    info: 'Review the system documentation to obtain the definition of the database/MariaDB

      functionality considered privileged in the context of the system in question.

      Review the MariaDB security configuration and/or other means used to protect

      privileged functionality from unauthorized use.

      If the configuration does not protect all of the actions defined as privileged, this is a

      finding.'
    severity: medium
- id: '1.56'
  title: MADB-10-006900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Execution of software modules (to include stored procedures, functions, and triggers) with elevated privileges
    must be restricted to necessary cases only. GROUP ID: V-253724 RULE ID: SV-253724r961359'
  rationale: In certain situations, to provide required functionality, MariaDB needs to execute internal logic (stored procedures,
    functions, triggers, etc.) and/or external code modules with elevated privileges. However, if the privileges required
    for execution are at a higher level than the privileges assigned to organizational users invoking the functionality applications/programs,
    those users are indirectly provided with greater privileges than assigned by organizations. Privilege elevation must be
    used only where necessary and protected from misuse. This calls for inspection of application source code, which will
    require collaboration with the application developers. It is recognized that in many cases, the database administrator
    (DBA) is organizationally separate from the application developers, and may have limited, if any, access to source code.
    Nevertheless, protections of this type are so important to the secure operation of databases that they must not be ignored.
    At a minimum, the DBA must attempt to obtain assurances from the development organization that this issue has been addressed
    and must document what has been discovered.
  impact: ''
  references: []
  page_start: 137
  audit_raw: 'Functions and Procedures in MariaDB all have DEFINER and SECURITY_TYPE

    options.

    If SECURITY_TYPE = DEFINER then the function or procedure is run using the

    privileges of the DEFINER account.

    If SECURITY_TYPE = INVOKER, then they will be run using the privileges of the user

    invoking the function or procedure.

    To list the values of the DEFINER and SECURITY_TYPE in functions and procedures

    as the database administrator, run the following SQL:

    MariaDB> SELECT ROUTINE_NAME, ROUTINE_SCHEMA, ROUTINE_TYPE, DEFINER,

    SECURITY_TYPE FROM information_schema.routines WHERE ROUTINE_SCHEMA NOT IN

    (''sys'',''mysql'');

    Triggers in MariaDB have a DEFINER option.

    For Triggers the value of the DEFINER determines the privileges to be used at trigger

    activation time.

    To list the values of the DEFINER in Triggers, as the database administrator, run the

    following SQL:

    MariaDB> SELECT trigger_schema, trigger_name, action_statement, definer FROM

    information_schema.triggers;

    If elevation of MariaDB privileges is utilized but not documented, this is a finding.

    If elevation of MariaDB privileges is documented, but not implemented as described in

    the documentation, this is a finding.

    If the privilege-elevation logic can be invoked in ways other than intended, or in contexts

