- id: '1.30'
  title: MADB-10-003700
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'If MariaDB authentication, using passwords, is employed, then MariaDB must enforce the DOD standards for password
    complexity. GROUP ID: V-253695 RULE ID: SV-253695r1018598'
  rationale: OS/enterprise authentication and identification must be used (SRG-APP-000023-DB000001). Native MariaDB authentication
    may be used only when circumstances make it unavoidable; and must be documented and Authorizing Official (AO)-approved.
    The DOD standard for authentication is DOD-approved PKI certificates. Authentication based on User ID and Password may
    be used only when it is not possible to employ a PKI certificate and requires AO approval. In such cases, the DOD standards
    for password complexity and lifetime must be implemented. DBMS products that can inherit the rules for these from the
    operating system or access control program (e.g., Microsoft Active Directory) must be configured to do so. For MariaDB,
    the rules must be enforced using available configuration parameters or custom code. By default, MariaDB Enterprise Server
    has the simple_password_check plugin installed and enabled. However, the default password requirements are eight character
    minimum, one numeric character, and one special character.
  impact: ''
  references: []
  page_start: 77
  audit_raw: 'Check the simple_password_check plugin variables to ensure they match the password

    requirements.

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''simple_password_check_%'';

    Determine whether the following rules are enforced. If they do not meet the following

    password requirements, this is a finding.

    a. minimum of 15 characters, including at least one of each of the following character

    sets:

    • Uppercase

    • Lowercase

    • Numerics

    • Special characters (e.g., ~ ! @ # $ % ^ & * ( ) _ + = - '' [ ] / ? > <)

    b. Minimum number of characters changed from previous password: 50 percent of the

    minimum password length; that is, eight.'
  remediation: 'Locate the MariaDB Enterprise Server configuration file (mariadb-enterprise.cnf) which

    contains the simple_password_check plugin variables within /etc/my.cnf.d/. Edit the

    variables.

    Example:

    simple_password_check_digits = 2

    simple_password_check_letters_same_case = 2

    simple_password_check_minimal_length = 15

    simple_password_check_other_characters = 2'
  checks:
  - type: sql
    command: SHOW GLOBAL VARIABLES LIKE 'simple_password_check_%';
    severity: medium
    info: 'Check the simple_password_check plugin variables to ensure they match the password

      requirements.

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''simple_password_check_%'';

      Determine whether the following rules are enforced. If they do not meet the following

      password requirements, this is a finding.

      a. minimum of 15 characters, including at least one of each of the following character

      sets:

      • Uppercase

      • Lower'
