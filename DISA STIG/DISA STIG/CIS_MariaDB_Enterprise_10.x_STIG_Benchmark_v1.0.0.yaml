  rationale: If audit data were to become compromised, then competent forensic analysis and discovery of the true source of
    potentially malicious system activity is difficult, if not impossible, to achieve. In addition, access to audit records
    provides information an attacker could potentially use to his or her advantage. To ensure the veracity of audit data,
    the information system and/or the application must protect audit information from any and all unauthorized access. This
