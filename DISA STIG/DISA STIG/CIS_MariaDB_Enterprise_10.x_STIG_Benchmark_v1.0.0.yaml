- id: '1.21'
  title: MADB-10-002700
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The MariaDB software installation account must be restricted to authorized users. GROUP ID: V-253686 RULE
    ID: SV-253686r960960'
  rationale: When dealing with change control issues, it should be noted any changes to the hardware, software, and/or firmware
    components of the information system and/or application can have significant effects on the overall security of the system.
    If the system were to allow any user to make changes to software libraries, then those changes might be implemented without
    undergoing the appropriate testing and approvals that are part of a robust change management process. Accordingly, only
    qualified and authorized individuals must be allowed access to information system components for purposes of initiating
    changes, including upgrades and modifications. DBA and other privileged administrative or application owner accounts are
    granted privileges that allow actions that can have a great impact on database security and operation. It is especially
    important to grant privileged access to only those persons who are qualified and authorized to use them.
  impact: ''
  references: []
  page_start: 59
  audit_raw: 'Review procedures for controlling, granting access to, and tracking use of the MariaDB

    software installation account.

    If access or use of this account is not restricted to the minimum number of personnel

    required or if unauthorized access to the account has been granted, this is a finding.'
  remediation: 'Develop, document, and implement procedures to restrict and track use of the MariaDB

    software installation account.'
  checks:
  - type: manual_review
    info: 'Review procedures for controlling, granting access to, and tracking use of the MariaDB

      software installation account.

      If access or use of this account is not restricted to the minimum number of personnel

      required or if unauthorized access to the account has been granted, this is a finding.'
    severity: medium
- id: '1.22'
  title: MADB-10-002800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Database software, including MariaDB configuration files, must be stored in dedicated directories, separate
    from the host OS and other applications. GROUP ID: V-253687 RULE ID: SV-253687r960960'
  rationale: When dealing with change control issues, it should be noted any changes to the hardware, software, and/or firmware
    components of the information system and/or application can potentially have significant effects on the overall security
    of the system. Multiple applications can provide a cumulative negative effect. A vulnerability and subsequent exploit
    to one application can lead to an exploit of other applications sharing the same security context. For example, an exploit
    to a web server process that leads to unauthorized administrative access to host system directories can most likely lead
    to a compromise of all applications hosted by the same system. Database software not installed using dedicated directories
    both threatens and is threatened by other hosted applications. Access controls defined for one application may by default
    provide access to the other application s database objects or directories. Any method that provides any level of separation
    of security context assists in the protection between applications.
  impact: ''
  references: []
  page_start: 61
  audit_raw: 'Review the MariaDB software library directory and note other root directories located on

    the same disk directory or any subdirectories. The default install directory is

    /var/lib/mysql.

    If any non-MariaDB software directories exist on the disk directory, examine or

    investigate their use. If any of the directories are used by other applications, including

    third-party applications that use MariaDB, this is a finding.

    Only applications that are required for the functioning and administration, not use, of

    MariaDB should be located in the same disk directory as the MariaDB software libraries.

    If other applications are located in the same directory as MariaDB, this is a finding.'
  remediation: 'Install all applications on directories separate from the MariaDB software library

    directory. Relocate any directories or reinstall other application software that currently

    shares the MariaDB software library directory.'
  checks:
  - type: manual_review
    info: 'Review the MariaDB software library directory and note other root directories located on

      the same disk directory or any subdirectories. The default install directory is

      /var/lib/mysql.

      If any non-MariaDB software directories exist on the disk directory, examine or

      investigate their use. If any of the directories are used by other applications, including

      third-party applications that use MariaDB, this is a finding.

      Only applications that are required for the functioning and administration, not us'
    severity: medium
- id: '1.23'
  title: MADB-10-002900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Database objects (including but not limited to tables, indexes, storage, stored procedures, functions, triggers,
    links to software external to MariaDB, etc.) must be owned by database/MariaDB principals authorized for ownership. GROUP
    ID: V-253688 RULE ID: SV-253688r960960'
  rationale: Within the database, object ownership implies full privileges to the owned object, including the privilege to
    assign access to the owned objects to other subjects. Database functions and procedures can be coded using definers rights.
    This allows anyone who uses the object to perform the actions if they were the owner. If not properly managed, this can
    lead to privileged actions being taken by unauthorized individuals. Conversely, if critical tables or other objects rely
    on unauthorized owner accounts, these objects may be lost when an account is removed.
  impact: ''
  references: []
  page_start: 63
  audit_raw: 'Review system documentation to identify accounts authorized to have privileges against

    database objects. Review account privileges on objects in the database(s).

    To show the list of system privileges that the MariaDB server supports, run:

    MariaDB> SHOW PRIVILEGES;

    Gather a list of SHOW GRANTS commands. SHOW GRANTS will list the privileges

    granted to the account.

    Run this database query to create the SHOW GRANTS script for each user:

    MariaDB> SELECT DISTINCT CONCAT( ''SHOW GRANTS FOR '', user,''@'', host,'';'') AS

    grantQuery FROM mysql.user WHERE is_role = ''N'';

    Run each SHOW GRANTS command for each user.

    MariaDB> SHOW GRANTS FOR ''user''@''host'';

    Verify that all users have the correct privileges, if they do not, this is a finding.

    Only DEFINERS of routines (functions and procedures) can change routines. To view

    the DEFINERS of all functions and procedures, as database administrator run the

    following SQL:

    MariaDB> SELECT * FROM mysql.proc \G

    Only DEFINERS of triggers can change triggers. To view all triggers and their

    DEFINERS, as database administrator run the following SQL:

    MariaDB> SELECT * FROM information_schema.triggers \G

    If any database users are found to have unauthorized privileges on database objects,

    this is a finding.'
  remediation: Assign ownership of authorized objects to authorized object owner accounts.
