- id: '1.60'
  title: MADB-10-007300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must allocate audit record storage capacity in accordance with organizationdefined audit record storage
    requirements. GROUP ID: V-253727 RULE ID: SV-253727r961392'
  rationale: To ensure sufficient storage capacity for the audit logs, MariaDB must be able to allocate audit record storage
    capacity. Although another requirement (SRG-APP000515-DB-000318) mandates that audit data be off-loaded to a centralized
    log management system, it remains necessary to provide space on the database server to serve as a buffer against outages
    and capacity limits of the off-loading mechanism. The task of allocating audit record storage capacity is usually performed
    during initial installation of MariaDB and is closely associated with the DBA and system administrator roles. The DBA
    or system administrator will usually coordinate the allocation of physical drive space with the application owner/installer
    and the application will prompt the installer to provide the capacity information, the physical location of the disk,
    or both. In determining the capacity requirements, consider such factors as total number of users; expected number of
    concurrent users during busy periods; number and type of events being monitored; types and amounts of data being captured;
    the frequency/speed with which audit records are off-loaded to the central log management system; and any limitations
    that exist on MariaDB s ability to reuse the space formerly occupied by off-loaded records.
  impact: ''
  references: []
  page_start: 147
  audit_raw: "Investigate whether there have been any incidents where MariaDB ran out of audit file\nlog disk space since\
    \ the last time the space was allocated or other corrective measures\nwere taken.\nIf there have been incidents where\
    \ MariaDB ran out of audit log file disk space, this is a\nfinding.\nMariaDB can be configured to use syslog or any OS\
    \ system file to store audit records to\ndesignated disk directories.\nCheck the log file location:\nTo check how much\
    \ storage capacity is available for audit records, first determine the\nlocation where the audit logs are being written\
    \ by executing the following command.\nRun the following SQL:\nshow global variables like 'server_audit%' ;\nFor system\
    \ logs (syslog):\nFrom the query above verify the value of:\n server_audit_output_type=SYSLOG\nFor OS file:\nFrom the\
    \ query above verify the value of:\nserver_audit_output_type=FILE\nIf written to SYSLOG, follow the procedure for storage\
    \ in the corresponding OS STIG.\nIf written to FILE, check the remaining storage on the disk. If it does not meet\norganizationally\
    \ defined audit record storage requirements, this is a finding."
  remediation: 'MariaDB audit log file location either goes to the syslog directory (if logging is set to

    SYSLOG) or is controlled by the server_audit_file_path in the MariaDB my.cnf

    configuration file.

    If the audit log file directory does not have enough disk space available, then increase

    the diskspace available for the audit log file directory or move the audit log file directory

    to another location that has more disk space available.

    Allocate sufficient audit file space to support peak demand.

    If server_audit_output_type=FILE set the directory in /etc/my.cnf to one that is managed

    by the centralized management system.

    [mariadb]

    server_audit_file_path= mydir / mylogfilename .log

    Now, as the system administrator, restart the server with the new configuration:

    $ systemctl restart mysql

    Allocate sufficient audit file space to support peak demand for the log files.'
  checks:
  - type: sql
    command: show global variables like 'server_audit%' ;
    severity: medium
    info: 'Investigate whether there have been any incidents where MariaDB ran out of audit file

      log disk space since the last time the space was allocated or other corrective measures

      were taken.

      If there have been incidents where MariaDB ran out of audit log file disk space, this is a

      finding.

      MariaDB can be configured to use syslog or any OS system file to store audit records to

      designated disk directorie'
- id: '1.61'
  title: MADB-10-007400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must provide a warning to appropriate support staff when allocated audit record storage volume reaches
    75 percent of maximum audit record storage capacity. GROUP ID: V-253728 RULE ID: SV-253728r961398'
  rationale: Organizations are required to use a central log management system, so, under normal conditions, the audit space
    allocated to the DBMS on its own server will not be an issue. However, space will still be required on the MariaDB server
    for audit records in transit, and, under abnormal conditions, this could fill up. Since a requirement exists to halt processing
    upon audit failure, a service outage would result. If support personnel are not notified immediately upon storage volume
    utilization reaching 75 percent, they are unable to plan for storage capacity expansion. The appropriate support staff
    include, at a minimum, the ISSO and the DBA/SA.
  impact: ''
  references: []
  page_start: 150
  audit_raw: 'Review OS, or third-party logging application settings to determine whether a warning

    will be provided when 75 percent of DBMS audit log storage capacity is reached.

    If no warning will be provided, this is a finding.'
  remediation: 'Configure the system to notify appropriate support staff immediately upon storage

    volume utilization reaching 75 percent.

    MariaDB does not monitor storage, however, it is possible to monitor storage with a

    script.

    Example Monitoring Script

    #!/bin/bash

    DATADIR=/var/lib/psql/mysql

    CURRENT=$(df ${DATADIR?} | grep / | awk ''{ print $5}'' | sed ''s/%//g'')

    THRESHOLD=75

    if [ "$CURRENT" -gt "$THRESHOLD" ] ; then

    mail -s ''Disk Space Alert'' mail@support.com << EOF

    The data directory volume is almost full. Used: $CURRENT

    %EOF

    fi

    Schedule this script in cron to run around the clock.'
  checks:
  - type: manual_review
    info: 'Review OS, or third-party logging application settings to determine whether a warning

      will be provided when 75 percent of DBMS audit log storage capacity is reached.

      If no warning will be provided, this is a finding.'
    severity: medium
