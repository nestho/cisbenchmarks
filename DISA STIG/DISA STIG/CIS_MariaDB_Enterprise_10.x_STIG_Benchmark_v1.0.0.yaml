- id: '1.32'
  title: MADB-10-003800
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'If passwords are used for authentication, MariaDB must store only hashed, salted representations of passwords.
    GROUP ID: V-253697 RULE ID: SV-253697r1018600'
  rationale: The DOD standard for authentication is DOD-approved PKI certificates. Authentication based on User ID and Password
    may be used only when it is not possible to employ a PKI certificate and requires Authorizing Official (AO) approval.
    In such cases, database passwords stored in clear text, using reversible encryption, or using unsalted hashes would be
    vulnerable to unauthorized disclosure. Database passwords must always be in the form of one-way, salted hashes when stored
    internally or externally to the MariaDB.
  impact: ''
  references: []
  page_start: 81
  audit_raw: 'MariaDB stores passwords encrypted. When querying users, the passwords are

    displayed encrypted.

    However, third-party applications, scripts, etc., might be storing passwords. In such

    cases, it is important to ensure these passwords are encrypted. Check all third-party

    applications, scripts, etc., which connect to the database and verify the passwords are

    encrypted. If any passwords are found in clear text, this is a finding.'
  remediation: 'Document all applications, scripts, etc., which connect to the database server. Ensure

    passwords, if stored, are encrypted and secure.'
  checks:
  - type: manual_review
    info: 'MariaDB stores passwords encrypted. When querying users, the passwords are

      displayed encrypted.

      However, third-party applications, scripts, etc., might be storing passwords. In such

