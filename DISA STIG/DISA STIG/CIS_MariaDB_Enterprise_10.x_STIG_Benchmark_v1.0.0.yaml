- id: '1.91'
  title: MADB-10-010600
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must generate audit records when privileges/permissions are deleted. GROUP ID: V-253758 RULE ID: SV-253758r961812'
  rationale: Changes in the permissions, privileges, and roles granted to users and roles must be tracked. Without an audit
    trail, unauthorized elevation or restriction of privileges could go undetected. Elevated privileges give users access
    to information and functionality that they should not have; restricted privileges wrongly deny access to authorized users.
    In MariaDB, deleting permissions is typically done via the REVOKE command.
  impact: ''
  references: []
  page_start: 218
  audit_raw: 'Verify the MariaDB Enterprise Audit plugin is loaded and actively logging:

    MariaDB> SHOW GLOBAL STATUS LIKE ''Server_audit_active'';

    If the MariaDB Enterprise Audit is not active, this is a finding.

    As the database administrator, create a user without special permissions:

    MariaDB> CREATE USER testuser IDENTIFIED BY password ;

    In one terminal, tail the audit log file. For example:

    $ tail -F /var/lib/mysql/server_audit.log (default location)

    As the database administrator, create a role by running the following SQL:

    MariaDB> CREATE ROLE user_role

    As the database administrator, GRANT user_role to testuser:

    MariaDB> GRANT user_role to testuser

    As the database administrator, add 2 privileges to user_role for testdb and then delete

    one of the privileges:

    MariaDB> GRANT SELECT,DELETE on testdb to testuser

    MariaDB> GRANT SELECT on testdb to testuser

    As the database administrator, revoke grant from testuser:

    MariaDB> REVOKE user_role to testuser

    If the audit records for REVOKE and the second SELECT are not produced in the first

    terminal, this is a finding.'
  remediation: "No super/administrative users should not have access to modify tables within the mysql\ndatabase. Verify users\
    \ do not have access and revoke as necessary. Example:\nView user grants:\nMariaDB> SHOW GRANTS FOR 'username'@'host';\n\
    If user has INSERT, UPDATE, and/or DELETE on the mysql database or all databases,\nmodify the user privileges as necessary.\n\
    The MariaDB Enterprise Audit plugin can be configured to audit these changes.\nUpdate necessary audit filters to include\
    \ query_event ALL. Example:\nMariaDB> DELETE FROM mysql.server_audit_filters WHERE filtername = 'default';\nMariaDB> INSERT\
    \ INTO mysql.server_audit_filters (filtername, rule)\n VALUES ('default',\n JSON_COMPACT(\n '{\n \"connect_event\": [\n\
    \ \"CONNECT\",\n \"DISCONNECT\"\n ],\n \"query_event\": [\n \"ALL\"\n ]\n }'\n ));"
  checks:
  - type: sql
    command: SHOW GLOBAL STATUS LIKE 'Server_audit_active';
    severity: medium
    info: 'Verify the MariaDB Enterprise Audit plugin is loaded and actively logging:

      MariaDB> SHOW GLOBAL STATUS LIKE ''Server_audit_active'';

      If the MariaDB Enterprise Audit is not active, this is a finding.

