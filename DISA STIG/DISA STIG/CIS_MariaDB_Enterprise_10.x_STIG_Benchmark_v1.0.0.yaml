- id: '1.49'
  title: MADB-10-005700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must check the validity of all data inputs except those specifically identified by the organization.
    GROUP ID: V-253714 RULE ID: SV-253714r961158'
  rationale: Invalid user input occurs when a user inserts data or characters into an application's data entry fields and
    the application is unprepared to process that data. This results in unanticipated application behavior, potentially leading
    to an application or information system compromise. Invalid user input is one of the primary methods employed when attempting
    to compromise an application. With respect to database management systems, one class of threat is known as SQL Injection,
    or more generally, code injection. It takes advantage of the dynamic execution capabilities of various programming languages,
    including dialects of SQL. Potentially, the attacker can gain unauthorized access to data, including security settings,
    and severely corrupt or destroy the database. Even when no such hijacking takes place, invalid input that gets recorded
    in the database, whether accidental or malicious, reduces the reliability and usability of the system. Available protections
    include data types, referential constraints, uniqueness constraints, range checking, and application-specific logic. Application-specific
    logic can be implemented within the database in stored procedures and triggers, where appropriate. This calls for inspection
    of application source code, which will require collaboration with the application developers. It is recognized that in
    many cases, the database administrator (DBA) is organizationally separate from the application developers, and may have
    limited, if any, access to source code. Nevertheless, protections of this type are so important to the secure operation
    of databases that they must not be ignored. At a minimum, the DBA must attempt to obtain assurances from the development
    organization that this issue has been addressed and must document what has been discovered.
  impact: ''
  references: []
  page_start: 120
  audit_raw: 'Review MariaDB code (trigger procedures, functions), application code, settings,

    column and field definitions, and constraints to determine whether the database is

    protected against invalid input.

    If code exists that allows invalid data to be acted upon or input into the database, this is

    a finding.

    If column/field definitions do not exist in the database, this is a finding.

    If columns/fields do not contain constraints and validity checking where required, this is

    a finding.

    Where a column/field is noted in the system documentation as necessarily free-form,

    even though its name and context suggest that it should be strongly typed and

    constrained, the absence of these protections is not a finding.

    Where a column/field is clearly identified by name, caption or context as Notes,

    Comments, Description, Text, etc., the absence of these protections is not a finding.

    Check application code that interacts with MariaDB for the use of prepared statements.

    If prepared statements are not used, this is a finding.'
  remediation: 'Modify database code to properly validate data before it is put into the database or

    acted upon by the database.

    Modify the database to contain constraints and validity checking on database columns

    and tables that require them for data integrity.

    Use prepared statements when taking user input.

    Do not allow general users direct console access to MariaDB.'
  checks:
  - type: manual_review
    info: 'Review MariaDB code (trigger procedures, functions), application code, settings,

      column and field definitions, and constraints to determine whether the database is

      protected against invalid input.

      If code exists that allows invalid data to be acted upon or input into the database, this is

      a finding.

      If column/field definitions do not exist in the database, this is a finding.

      If columns/fields do not contain constraints and validity checking where required, this is

      a finding.

      Where a column/field'
    severity: medium
- id: '1.50'
  title: MADB-10-005800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB and associated applications must reserve the use of dynamic code execution for situations that require
    it. GROUP ID: V-253715 RULE ID: SV-253715r961158'
  rationale: With respect to database management systems, one class of threat is known as SQL Injection, or more generally,
    code injection. It takes advantage of the dynamic execution capabilities of various programming languages, including dialects
    of SQL. In such cases, the attacker deduces the manner in which SQL statements are being processed, either from inside
    knowledge or by observing system behavior in response to invalid inputs. When the attacker identifies scenarios where
    SQL queries are being assembled by application code (which may be within the database or separate from it) and executed
    dynamically, the attacker is then able to craft input strings that subvert the intent of the query. Potentially, the attacker
    can gain unauthorized access to data, including security settings, and severely corrupt or destroy the database. The principal
    protection against code injection is not to use dynamic execution except where it provides necessary functionality that
    cannot be used otherwise. Use strongly typed data items rather than general-purpose strings as input parameters to taskspecific,
    pre-compiled stored procedures and functions (and triggers). This calls for inspection of application source code, which
    will require collaboration with the application developers. It is recognized that in many cases, the database administrator
    (DBA) is organizationally separate from the application developers, and may have limited, if any, access to source code.
    Nevertheless, protections of this type are so important to the secure operation of databases that they must not be ignored.
    At a minimum, the DBA must attempt to obtain assurances from the development organization that this issue has been addressed
    and must document what has been discovered.
  impact: ''
  references: []
  page_start: 122
  audit_raw: 'Review MariaDB source code (stored procedures, functions, triggers) and application

    source code, to identify cases of dynamic code execution.

    To list all stored procedures, functions, and triggers in the database, as the database

    administrator, run the following SQL:

    MariaDB> SHOW FUNCTION STATUS;

    MariaDB> SHOW PROCEDURE STATUS;

    MariaDB> SHOW TRIGGERS;

    Any user input should be handled through prepared statements.

    If dynamic code execution is employed in circumstances where the objective could

    practically be satisfied by static execution with strongly typed parameters, this is a

    finding.'
  remediation: 'Where dynamic code execution is employed in circumstances where the objective could

    practically be satisfied by static execution with strongly typed parameters, modify the

    code to do so.'
  checks:
  - type: sql
    command: SHOW FUNCTION STATUS;
    severity: medium
    info: 'Review MariaDB source code (stored procedures, functions, triggers) and application

      source code, to identify cases of dynamic code execution.

      To list all stored procedures, functions, and triggers in the database, as the database

      administrator, run the following SQL:

      MariaDB> SHOW FUNCTION STATUS;

      MariaDB> SHOW PROCEDURE STATUS;

      MariaDB> SHOW TRIGGERS;

      Any user input should be handled through prep'
- id: '1.51'
  title: MADB-10-005900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB and associated applications, when making use of dynamic code execution, must scan input data for invalid
    values that may indicate a code injection attack. GROUP ID: V-253716 RULE ID: SV-253716r961158'
  rationale: 'With respect to database management systems, one class of threat is known as SQL Injection, or more generally,
    code injection. It takes advantage of the dynamic execution capabilities of various programming languages, including dialects
    of SQL. In such cases, the attacker deduces the manner in which SQL statements are being processed, either from inside
    knowledge or by observing system behavior in response to invalid inputs. When the attacker identifies scenarios where
    SQL queries are being assembled by application code (which may be within the database or separate from it) and executed
    dynamically, the attacker is then able to craft input strings that subvert the intent of the query. Potentially, the attacker
    can gain unauthorized access to data, including security settings, and severely corrupt or destroy the database. The principal
    protection against code injection is not to use dynamic execution except where it provides necessary functionality that
    cannot be used otherwise. Use strongly typed data items rather than general-purpose strings as input parameters to taskspecific,
    pre-compiled stored procedures and functions (and triggers). When dynamic execution is necessary, ways to mitigate the
    risk include the following, which should be implemented both in the on-screen application and at the database level, in
    the stored procedures: • Allow strings as input only when necessary. • Rely on data typing to validate numbers, dates,
    etc. Do not accept invalid values. If substituting other values for them, think carefully about whether this could be
    subverted. • Limit the size of input strings to what is truly necessary. • If single quotes/apostrophes, double quotes,
    semicolons, equal signs, angle brackets, or square brackets will never be valid as input, reject them. • If comment markers
    will never be valid as input, reject them. In SQL, these are -- or /* */ • If HTML and XML tags, entities, comments, etc.,
    will never be valid, reject them. • If wildcards are present, reject them unless truly necessary. In SQL these are the
    underscore and the percentage sign, and the word ESCAPE is also a clue that wildcards are in use. • If SQL key words,
    such as SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, ESCAPE, UNION, GRANT, REVOKE, DENY, MODIFY will never be
    valid, reject them. Use case-insensitive comparisons when searching for these. Bear in mind that some of these words,
    particularly Grant (as a person s name), could also be valid input. • If there are range limits on the values that may
    be entered, enforce those limits. • Institute procedures for inspection of programs for correct use of dynamic coding,
    by a party other than the developer. • Conduct rigorous testing of program modules that use dynamic coding, searching
    for ways to subvert the intended use. • Record the inspection and testing in the system documentation. • Bear in mind
    that all this applies not only to screen input, but also to the values in an incoming message to a web service or to a
    stored procedure called by a software component that has not itself been hardened in these ways. Not only can the caller
    be subject to such vulnerabilities; it may itself be the attacker. This calls for inspection of application source code,
    which will require collaboration with the application developers. It is recognized that in many cases, the database administrator
    (DBA) is organizationally separate from the application developers, and may have limited, if any, access to source code.
    Nevertheless, protections of this type are so important to the secure operation of databases that they must not be ignored.
    At a minimum, the DBA must attempt to obtain assurances from the development organization that this issue has been addressed
    and must document what has been discovered.'
  impact: ''
  references: []
  page_start: 124
  audit_raw: 'Review MariaDB source code (stored procedures, functions, triggers) and application

    source code to identify cases of dynamic code execution.

    If dynamic code execution is employed without protective measures against code

    injection, this is a finding.'
  remediation: 'Where dynamic code execution is used, modify the code to implement protections

    against code injection.'
  checks:
  - type: manual_review
    info: 'Review MariaDB source code (stored procedures, functions, triggers) and application

      source code to identify cases of dynamic code execution.

      If dynamic code execution is employed without protective measures against code

      injection, this is a finding.'
    severity: medium
- id: '1.52'
  title: MADB-10-006200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must automatically terminate a user''s session after organization-defined conditions or trigger events
    requiring session disconnect. GROUP ID: V-253717 RULE ID: SV-253717r1043182'
  rationale: This addresses the termination of user-initiated logical sessions in contrast to the termination of network connections
    that are associated with communications sessions (i.e., network disconnect). A logical session (for local, network, and
    remote access) is initiated whenever a user (or process acting on behalf of a user) accesses an organizational information
    system. Such user sessions can be terminated (and thus terminate user access) without terminating network sessions. Session
    termination ends all processes associated with a user's logical session except those batch processes/jobs that are specifically
    created by the user (i.e., session owner) to continue after the session is terminated. Conditions or trigger events requiring
    automatic session termination can include, for example, organization-defined periods of user inactivity, targeted responses
    to certain types of incidents, and time-of-day restrictions on information system use. This capability is typically reserved
    for specific cases where the system owner, data owner, or organization requires additional assurance. As a good programming
    practice, all applications should close the database connection when they finish using the resource. MariaDB will close
    the session when the connection is closed and release all resources associated with the session. If the connection is
    not closed, MariaDB has the five global variables to allow timeouts to occur and automatically close the connection and
    release all associated resources.
  impact: ''
  references: []
  page_start: 126
  audit_raw: 'MariaDB has five global variables that can be set so that connections will be closed

    after a certain period of inactivity. Check the values for these variables and verify they

    correspond to security procedures defined:

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''%timeout%'';

    interactive_timeout - Time in seconds that the server waits for an interactive connection

    (one that connects with the mysql_real_connect() CLIENT_INTERACTIVE option) to

    become active before closing it. See also wait_timeout.

    wait_timeout - Time in seconds that the server waits for a connection to become active

    before closing it. The session value is initialized when a thread starts up from either the

    global value, if the connection is noninteractive, or from the interactive_timeout value, if

    the connection is interactive.

    In situations where transactions may be started, but not committed or rolled back, more

    granular control and a shorter timeout may be desirable so as to avoid locks being held

    for too long.

    idle_transaction_timeout

    idle_write_transaction_timeout

    idle_readonly_transaction_timeout

    Review system documentation to obtain the organization''s definition of circumstances

    requiring automatic session termination. If the documentation explicitly states that such

    termination is not required or is prohibited, this is not a finding.

    If the security procedures require server-side session termination within a specified

    amount of time but MariaDB is not configured accordingly, this is a finding.'
  remediation: 'Configure MariaDB to automatically terminate a user''s session based on security

    procedures requirements regarding conditions or trigger events that require session

    termination.

    To change the values of the following timeout variables to conform to organizationdefined values for triggering conditions
    or events requiring session termination select

    the appropriate variable to change and as the database administrator.

    As the administrator locate the MariaDB Enterprise Server configuration file to change.

    For Centos, RedHat, and similar distributions this will be in /etc/my.cnf.d/.

    In the [mariadb] section add the lines:

    interactive_timeout = value

    wait_timeout = value

    idle_transaction_timeout = value

    idle_write_transaction_timeout = value

    idle_readonly_transaction_timeout = value

    Where value is in seconds and corresponds to the company defined value. Restart

    MariaDB Enterprise Server for these changes to take effect.'
  checks:
  - type: sql
    command: SHOW GLOBAL VARIABLES LIKE '%timeout%';
    severity: medium
    info: 'MariaDB has five global variables that can be set so that connections will be closed

      after a certain period of inactivity. Check the values for these variables and verify they

      correspond to security procedures defined:

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''%timeout%'';

      interactive_timeout - Time in seconds that the server waits for an interactive connection

      (one that connects with the mysql_real_con'
- id: '1.53'
  title: MADB-10-006300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must provide logout functionality to allow the user to manually terminate a session initiated by that
    user. GROUP ID: V-253718 RULE ID: SV-253718r961224'
  rationale: If a user cannot explicitly end a DBMS session, the session may remain open and be exploited by an attacker;
    this is referred to as a zombie session. Such logout may be explicit or implicit. Examples of explicit are clicking on
    a Log Out link or button in the application window; clicking the Windows Start button and selecting Log Out or Shut Down.
    Examples of implicit logout are closing the application's (main) window and powering off the workstation without invoking
    the OS shutdown. Both the explicit and implicit logouts must be detected by the DBMS. In all cases, the DBMS must ensure
    that the user's DBMS session and all processes owned by the session are terminated. This should not, however, interfere
    with batch processes/jobs initiated by the user during his/her online session; these should be permitted to run to completion.
    As a good programming practice, all applications should close the database connection when they finish using the resource.
    MariaDB will close the session when the connection is closed and release all resources associated with the session. If
    the connection cannot be closed, MariaDB has the five global variables to allow timeouts to occur and automatically close
    the connection and release all associated resources.
  impact: ''
  references: []
