    severity: medium
- id: '1.63'
  title: MADB-10-007600
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must record time stamps, in audit records and application data, that can be mapped to Coordinated
    Universal Time (UTC, formerly GMT). GROUP ID: V-253730 RULE ID: SV-253730r961443'
  rationale: If time stamps are not consistently applied and there is no common time reference, it is difficult to perform
    forensic analysis. Time stamps generated by MariaDB must include date and time. Time is commonly expressed in Coordinated
    Universal Time (UTC), a modern continuation of Greenwich Mean Time (GMT), or local time with an offset from UTC. Some
    DBMS products offer a data type called TIMESTAMP that is not a representation of date and time. Rather, it is a database
    state counter and does not correspond to calendar and clock time. This requirement does not refer to that meaning of TIMESTAMP.
  impact: ''
  references: []
  page_start: 153
  audit_raw: 'Check the current timezone value by running the following command as an

    administrative user:

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''%zone%'';

    If time_zone = SYSTEM, and system_time_zone is not equal to UTC, this is a finding.

    If time_zone is not SYSTEM and is not UTC, this is a finding.'
  remediation: 'On the OS command line run the following command to get the time zone the system is

    in:

    date | awk ''{print $5;}''

    If the system is in UTC, to set the time zone for timestamps to UTC, modify the MariaDB

    configuration file located within /etc/my.cnf.d/ and set the variable time_zone to

    SYSTEM under the server section. Restart MariaDB Enterprise Server.

    Example:

    [server]

    Timezone = SYSTEM

    If the OS system timezone is not set to UTC, to set the time zone for timestamps to

    UTC, modify the MariaDB configuration file located within /etc/my.cnf.d/ and set the

    variable time_zone to UTC under the server section. Restart MariaDB Enterprise

    Server.

    Example:

    [server]

    Timezone = UTC'
  checks:
  - type: sql
    command: SHOW GLOBAL VARIABLES LIKE '%zone%';
    severity: medium
    info: 'Check the current timezone value by running the following command as an

      administrative user:

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''%zone%'';

      If time_zone = SYSTEM, and system_time_zone is not equal to UTC, this is a finding.

      If time_zone is not SYSTEM and is not UTC, this is a finding.'
- id: '1.64'
  title: MADB-10-007800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must prohibit user installation of logic modules (stored procedures, functions, triggers, views, etc.)
    without explicit privileged status. GROUP ID: V-253731 RULE ID: SV-253731r1018601'
  rationale: Allowing regular users to install software, without explicit privileges, creates the risk that untested or potentially
    malicious software will be installed on the system. Explicit privileges (escalated or administrative privileges) provide
    the regular user with explicit capabilities and control that exceed the rights of a regular user. DBMS functionality and
    the nature and requirements of databases will vary; so while users are not permitted to install unapproved software, there
    may be instances where the organization allows the user to install approved software packages such as from an approved
    software repository. The requirements for production servers will be more restrictive than those used for development
    and research. The DBMS must enforce software installation by users based upon what types of software installations are
    permitted (e.g., updates and security patches to existing software) and what types of installations are prohibited (e.g.,
    software whose pedigree with regard to being potentially malicious is unknown or suspect by the organization). In the
    case of a database management system, this requirement covers stored procedures, functions, triggers, views, etc.
  impact: ''
  references: []
  page_start: 155
  audit_raw: 'If MariaDB supports only software development, experimentation and/or developer-level

    testing (that is, excluding production systems, integration testing, stress testing, and

    user acceptance testing), this is not a finding.

    Review MariaDB and database security settings with respect to nonadministrative users

    ability to create, alter, or replace logic modules, to include but not necessarily only

    stored procedures, functions, triggers, and views.

    1. To list the privileges for all users on all tables and schemas, as the database

    administrator, do the following:

    Gather a list of SHOW GRANTS commands. SHOW GRANTS will list the privileges

    granted to the account.

    Run this script to create the SHOW GRANTS script for each user:

    MariaDB> SELECT DISTINCT CONCAT( ''SHOW GRANTS FOR '', user,''@'', host,'';'') AS

    grantQuery FROM mysql.user WHERE is_role = ''N'';

    Run each SHOW GRANTS command for each user.

    2. Only DEFINERS of routines (functions and procedures) can change routines. To

    view the DEFINERS of all functions and procedures, as database administrator

    run the following SQL:

    MariaDB> SELECT * FROM mysql.proc \G

    3. Only DEFINERS of triggers can change triggers. To view all triggers and their

    DEFINERS, as database administrator run the following SQL:

    MariaDB> SELECT * FROM information_schema.triggers \G

    4. Views: At view definition time, the view creator must have the privileges needed

    to use the top-level objects accessed by the view. For example, if the view

    definition refers to table columns, the creator must have privileges for the

    columns, as described previously. If the definition refers to a stored function, only

    the privileges needed to invoke the function can be checked. The privileges

    required when the function runs can be checked only as it executes. For different

    invocations of the function, different execution paths within the function might be

    taken.

    If any such permissions exist and are not documented and approved, this is a finding.'
  remediation: 'Document and obtain approval for any nonadministrative users who require the ability to

    create, alter, or replace logic modules.

    Check the security guide to implement the approved permissions. Revoke any

    unapproved permissions.'
  checks:
  - type: sql
    command: SHOW GRANTS commands. SHOW GRANTS will list the privileges
    severity: medium
    info: 'If MariaDB supports only software development, experimentation and/or developer-level

      testing (that is, excluding production systems, integration testing, stress testing, and

      user acceptance testing), this is not a finding.

      Review MariaDB and database security settings with respect to nonadministrative users

      ability to create, alter, or replace logic modules, to include but not necessarily only

      st'
- id: '1.65'
  title: MADB-10-007900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must enforce access restrictions associated with changes to the configuration of MariaDB or database(s).
    GROUP ID: V-253732 RULE ID: SV-253732r961461'
  rationale: Failure to provide logical access restrictions associated with changes to configuration may have significant
    effects on the overall security of the system. When dealing with access restrictions pertaining to change control, it
    should be noted that any changes to the hardware, software, and/or firmware components of the information system can potentially
    have significant effects on the overall security of the system. Accordingly, only qualified and authorized individuals
    should be allowed to obtain access to system components for the purposes of initiating changes, including upgrades and
    modifications.
  impact: ''
  references: []
  page_start: 158
  audit_raw: 'To list all the permissions of individual roles, as the database administrator, run the

    following SQL:

    1. For User privileges:

    Gather a list of SHOW GRANTS commands. SHOW GRANTS will list the privileges

    granted to the account.

    Run this script to create the SHOW GRANTS script for each user:

    MariaDB> SELECT DISTINCT CONCAT( ''SHOW GRANTS FOR '', user,''@'', host,'';'') AS

    grantQuery FROM mysql.user WHERE is_role = ''N'';

    Run each SHOW GRANTS command for each user.

    2. For role privileges (except admin_option, whether the role can be granted by a

    particular use):

    MariaDB> SELECT CONCAT(''SHOW GRANTS FOR '',Role,'';'' ) FROM

    mysql.roles_mapping;

    Run each SHOW GRANTS command for each role.

    If any role has admin_option that should not, this is a finding.

    There are no privileges assigned to databases or tables, security is enforced through

    the traditional way with granting very specific user privileges.

    If any database or schema has update or create privileges and should not, this is a

    finding.'
  remediation: 'Configure MariaDB to enforce access restrictions associated with changes to the

    configuration of MariaDB or database(s).

    1. Use REVOKE to revoke privileges or roles on objects from users.

    MariaDB> REVOKE privileges ON object FROM user ;

    2. Use REVOKE to remove a role from a user or another role that it was previously

    assigned to.

    MariaDB> REVOKE role FROM grantee or role ;'
