  description: 'MariaDB must be able to generate audit records when successful accesses to objects occur. GROUP ID: V-253770
    RULE ID: SV-253770r961836'
  rationale: 'Without tracking all or selected types of access to all or selected objects (tables, views, procedures, functions,
    etc.), it would be difficult to establish, correlate, and investigate the events relating to an incident, or identify
    those responsible for one. In an SQL environment, types of access include, but are not necessarily limited to: SELECT
    INSERT UPDATE DELETE EXECUTE'
  impact: ''
  references: []
  page_start: 245
  audit_raw: "Verify the MariaDB Enterprise Audit plugin is loaded and actively logging:\nMariaDB> SHOW GLOBAL STATUS LIKE\
    \ 'Server_audit_active';\nDefault Audit Filter is applied to all users by default.\nNamed Audit Filters are assigned to\
    \ specific users.\nCheck what filters are in place by running the following as an administrative user:\nMariaDB> SELECT\
    \ * FROM mysql.server_audit_filters;\nCheck what Named Audit Filters are assigned to what users:\nMariaDB> SELECT sau.host,\
    \ sau.user, saf.filtername,\n JSON_DETAILED(saf.rule)\nFROM mysql.server_audit_filters saf\nJOIN mysql.server_audit_users\
    \ sau\n ON saf.filtername = sau.filtername\nWHERE saf.filtername != 'default'\\G\nIf the MariaDB Enterprise Audit plugin\
    \ is not active and/or necessary auditing is not in\nplace, this is a finding."
  remediation: "If the MariaDB Enterprise Audit plugin is not active, enable it in one of the two following\nways.\n1. Config\
    \ file (requires restart):\n[mariadb]\nserver_audit_logging = ON\n2. SQL (does not require restart):\nMariaDB> SET GLOBAL\
    \ server_audit_logging=ON;\nOnce the MariaDB Enterprise Audit plugin is loaded, verify the MariaDB Enterprise\nAudit plugin\
    \ is loaded and actively logging:\nMariaDB> SHOW GLOBAL STATUS LIKE 'Server_audit_active';\nIf the necessary auditing\
    \ is not in place for all or specific users, modify the filters.\nTo modify the default filter, delete, and recreate:\n\
    MariaDB> DELETE FROM mysql.server_audit_filters WHERE filtername = 'default';\nMariaDB> INSERT INTO mysql.server_audit_filters\
    \ (filtername, rule)\n VALUES ('default',\n JSON_COMPACT(\n '{\n \"logging\":\"ON\",\n \"connect_event\":\"ALL\",\n \"\
    query_event\":\"ALL\",\n \"table_event\":\"ALL\"\n }'\n ));\nSpecific objects can be added to filters with inclusion or\
    \ exclusion.\nignore_databases: Do not log actions on these databases.\nignore_tables: Do not log actions on these tables.\n\
    databases: Log actions on these databases.\ntables: Log actions on these tables.\nExample:\nMariaDB> INSERT INTO mysql.server_audit_filters\
    \ (filtername, rule)\n VALUES (\n 'reporting',\n JSON_COMPACT(\n '{\n \"tables\": [\n \"production.*\",\n \"reporting.*\"\
    ,\n {\n \"table_event\": [\n \"WRITE\",\n \"CREATE\",\n \"DROP\",\n \"RENAME\",\n \"ALTER\"\n ],\n \"query_event\": [\n\
    \ \"DML\",\n \"DDL\",\n {\n \"ignore_tables\": [\n \"production.customer_profiles\",\n \"production.customer_addresses\"\
    \n ]\n }\n ]\n }\n ]\n }'\n )\n );"
  checks:
  - type: sql
    command: SHOW GLOBAL STATUS LIKE 'Server_audit_active';
    severity: medium
    info: 'Verify the MariaDB Enterprise Audit plugin is loaded and actively logging:

      MariaDB> SHOW GLOBAL STATUS LIKE ''Server_audit_active'';

      Default Audit Filter is applied to all users by default.

