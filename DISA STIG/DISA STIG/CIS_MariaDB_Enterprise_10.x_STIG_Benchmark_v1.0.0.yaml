- id: '1.54'
  title: MADB-10-006400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must associate organization-defined types of security labels having organization-defined security
    label values with information in storage. GROUP ID: V-253719 RULE ID: SV-253719r961269'
  rationale: Without the association of security labels to information, there is no basis for MariaDB to make security-related
    access-control decisions. Security labels are abstractions representing the basic properties or characteristics of an
    entity (e.g., subjects and objects) with respect to safeguarding information. These labels are typically associated with
    internal data structures (e.g., tables, rows) within the database and are used to enable the implementation of access
    control and flow control policies, reflect special dissemination, handling or distribution instructions, or support other
    aspects of the information security policy. One example includes marking data as classified or CUI. These security labels
    may be assigned manually or during data processing, but, either way, it is imperative these assignments are maintained
    while the data is in storage. If the security labels are lost when the data is stored, there is the risk of a data compromise.
    The mechanism used to support security labeling may be a feature of the DBMS product, a third-party product, or custom
    application code.
  impact: ''
  references: []
  page_start: 133
  audit_raw: 'If security labeling is not required, this is not a finding.

    If security labeling requirements have been specified, but the security labeling is not

    implemented or does not reliably maintain labels on information in storage, this is a

    finding.'
  remediation: 'Add custom data structures, data elements and application code, to provide reliable

    security labeling of information in transmission. Write Custom Code:

    https://mariadb.com/resources/blog/protect-your-data-row-level-security-in-mariadb-100/'
  checks:
  - type: manual_review
    info: 'If security labeling is not required, this is not a finding.

      If security labeling requirements have been specified, but the security labeling is not

      implemented or does not reliably maintain labels on information in storage, this is a

      finding.'
    severity: medium
- id: '1.55'
  title: MADB-10-006800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must prevent nonprivileged users from executing privileged functions, to include disabling, circumventing,
    or altering implemented security safeguards/countermeasures. GROUP ID: V-253723 RULE ID: SV-253723r961353'
  rationale: 'Preventing nonprivileged users from executing privileged functions mitigates the risk that unauthorized individuals
    or processes may gain unnecessary access to information or privileges. System documentation should include a definition
    of the functionality considered privileged. Depending on circumstances, privileged functions can include, for example,
    establishing accounts, performing system integrity checks, or administering cryptographic key management activities. Nonprivileged
    users are individuals that do not possess appropriate authorizations. Circumventing intrusion detection and prevention
    mechanisms or malicious code protection mechanisms are examples of privileged functions that require protection from nonprivileged
    users. A privileged function in MariaDB/database context is any operation that modifies the structure of the database,
    its built-in logic, or its security settings. This would include all Data Definition Language (DDL) statements and all
    security-related statements. In an SQL environment, it encompasses, but is not necessarily limited to: CREATE ALTER DROP
    GRANT REVOKE There may also be Data Manipulation Language (DML) statements that, subject to context, should be regarded
    as privileged. Possible examples include: TRUNCATE TABLE; DELETE, or DELETE affecting more than n rows, for some n, or
    DELETE without a WHERE clause; UPDATE or UPDATE affecting more than n rows, for some n, or UPDATE without a WHERE clause;
    any SELECT, INSERT, UPDATE, or DELETE to an application-defined security table executed by other than a security principal.
    Depending on the capabilities of the DBMS and the design of the database and associated applications, the prevention of
    unauthorized use of privileged functions may be achieved by means of DBMS security features, database triggers, other
    mechanisms, or a combination of these.'
  impact: ''
  references: []
  page_start: 135
  audit_raw: 'Review the system documentation to obtain the definition of the database/MariaDB

    functionality considered privileged in the context of the system in question.

    Review the MariaDB security configuration and/or other means used to protect

    privileged functionality from unauthorized use.

    If the configuration does not protect all of the actions defined as privileged, this is a

    finding.'
  remediation: Configure MariaDB security to protect all privileged functionality.
