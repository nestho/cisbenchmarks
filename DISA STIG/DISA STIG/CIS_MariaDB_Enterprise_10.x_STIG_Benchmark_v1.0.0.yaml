    severity: medium
- id: '1.33'
  title: MADB-10-003900
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'If passwords are used for authentication, MariaDB must transmit only encrypted representations of passwords.
    GROUP ID: V-253698 RULE ID: SV-253698r961029'
  rationale: The DoD standard for authentication is DoD-approved PKI certificates. Authentication based on User ID and Password
    may be used only when it is not possible to employ a PKI certificate and requires AO approval. In such cases, passwords
    need to be protected at all times, and encryption is the standard method for protecting passwords during transmission.
    DBMS passwords sent in clear text format across the network are vulnerable to discovery by unauthorized users. Disclosure
    of passwords may easily lead to unauthorized access to the database.
  impact: ''
  references: []
  page_start: 83
  audit_raw: 'MariaDB by default only sends passwords encrypted. However, when authenticating via

    the PAM Authentication Plugin, the password is sent in cleartext. Thus when using PAM

    authentication, it is recommended to use TLS/SSL encryption for all database

    connections.

    If using PAM authentication, verify TLS/SSL is in use.

    Run the following database command:

    MariaDB> STATUS;

    Verify the line which starts with "SSL:" is as expected. If it returns "Not in use", this is a

    finding.'
  remediation: 'As the administrator locate the MariaDB configuration file to change. This varies

    depending on setup and how configuration files are managed but should be in

    /etc/my.cnf.d/. It is recommended to have a separate configuration file within this

    directory for SSL connection information.

    In the [server] section add the lines for SSL:

    ssl

    ssl-ca=/path/to/ssl/ca-cert.pem

    ssl-cert=/path/to/ssl/server-cert.pem

    ssl-key=/path/to/ssl/server-key.pem

    Restart of the MariaDB Server and verify SSL is being used.

    MariaDB> STATUS;

    Verify line beginning with "SSL:".'
  checks:
  - type: manual_review
    info: 'MariaDB by default only sends passwords encrypted. However, when authenticating via

      the PAM Authentication Plugin, the password is sent in cleartext. Thus when using PAM

      authentication, it is recommended to use TLS/SSL encryption for all database

      connections.

      If using PAM authentication, verify TLS/SSL is in use.

      Run the following database command:

      MariaDB> STATUS;

      Verify the line which starts with "SSL:" is as expected. If it returns "Not in use", this is a

      finding.'
    severity: medium
- id: '1.34'
  title: MADB-10-004000
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB, when utilizing PKI-based authentication, must validate certificates by performing RFC 5280-compliant
    certification path validation. GROUP ID: V-253699 RULE ID: SV-253699r961038'
  rationale: The DoD standard for authentication is DoD-approved PKI certificates. A certificate's certification path is the
    path from the end entity certificate to a trusted root certification authority (CA). Certification path validation is
    necessary for a relying party to make an informed decision regarding acceptance of an end entity certificate. Certification
    path validation includes checks such as certificate issuer trust, time validity and revocation status for each certificate
    in the certification path. Revocation status information for CA and subject certificates in a certification path is commonly
    provided via certificate revocation lists (CRLs) or online certificate status protocol (OCSP) responses. Database Management
    Systems that do not validate certificates by performing RFC 5280-compliant certification path validation are in danger
    of accepting certificates that are invalid and/or counterfeit. This could allow unauthorized access to the database.
  impact: ''
  references: []
  page_start: 85
  audit_raw: 'As the database administrator, list all users and their SSL setup by running the

    following:

    MariaDB> SELECT user, host, ssl_type FROM mysql.user;

    Use the result of the next query to verify the MariaDB Server is using certificates:

    MariaDB> STATUS;

    Verify the line beginning with "SSL:" returns expected SSL information.

    Using the following query, verify SSL is configured as expected:

    MariaDB> SHOW GLOBAL VARIABLES LIKE %ssl% ;

    If not configured as expected, this is a finding.'
  remediation: 'As the administrator locate the MariaDB configuration file to change. This varies

    depending on setup and how configuration files are managed but should be in

    /etc/my.cnf.d/. It is recommended to have a separate configuration file within this

    directory for SSL connection information.

    In the [server] section add the lines for SSL:

    ssl-ca=/path/to/ssl/ca-cert.pem

    ssl-cert=/path/to/ssl/server-cert.pem

    ssl-key=/path/to/ssl/server-key.pem

    To fully implement SSL for MariaDB, the client settings and user accounts need to be

    set up as well. More information can be found here:

    https://mariadb.com/kb/en/securing-connections-for-client-and-server/'
  checks:
  - type: sql
    command: SELECT user, host, ssl_type FROM mysql.user;
    severity: medium
    info: 'As the database administrator, list all users and their SSL setup by running the

      following:

      MariaDB> SELECT user, host, ssl_type FROM mysql.user;

      Use the result of the next query to verify the MariaDB Server is using certificates:

      MariaDB> STATUS;

      Verify the line beginning with "SSL:" returns expected SSL information.

      Using the following query, verify SSL is configured as expected:

      MariaDB> SHOW G'
- id: '1.35'
  title: MADB-10-004100
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'MariaDB must enforce authorized access to all PKI private keys stored/used by the DBMS. GROUP ID: V-253700
    RULE ID: SV-253700r961041'
  rationale: The DoD standard for authentication is DoD-approved PKI certificates. PKI certificatebased authentication is
    performed by requiring the certificate holder to cryptographically prove possession of the corresponding private key.
    If the private key is stolen, an attacker can use the private key(s) to impersonate the certificate holder. In cases where
    the MariaDB-stored private keys are used to authenticate MariaDB to the system's clients, loss of the corresponding private
    keys would allow an attacker to successfully perform undetected man in the middle attacks against the MariaDB system and
    its clients. Both the holder of a digital certificate and the issuing authority must take careful measures to protect
    the corresponding private key. Private keys should always be generated and protected in FIPS 140-2 validated cryptographic
    modules. All access to the private key(s) of MariaDB must be restricted to authorized and authenticated users. If unauthorized
    users have access to one or more of the MariaDB s private keys, an attacker could gain access to the key(s) and use them
    to impersonate the database on the network or otherwise perform unauthorized actions.
  impact: ''
  references: []
  page_start: 87
  audit_raw: 'First, as the database administrator, verify the following settings: Note: If no specific

    directory given before the filename, the files are stored in DATADIR.

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''ssl_ca'';

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''ssl_cert'';

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''ssl_key'';

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''ssl_crlpath'';

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''datadir'';

    Verify the permissions of the above files.

    Example:

    ls -al /path/to/ssl_cert

    MariaDB Enterprise Server runs as the mysql operating system user, thus should be

    owned by user mysql and group mysql with user read and group read file level

    permissions.

    Example:

    -r-------. 1 mysql

    If the files and directories are not properly secured, this is a finding.'
  remediation: 'If the SSL files are not secured properly in the file system, change the ownership and

    permissions with operating system operations.

    Example:

    chown mysql:mysql /path/to/file

    chmod 440 /path/to/file'
  checks:
  - type: command
    command: ls -al /path/to/ssl_cert
    expected: ''
    severity: medium
    info: 'First, as the database administrator, verify the following settings: Note: If no specific

      directory given before the filename, the files are stored in DATADIR.

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''ssl_ca'';

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''ssl_cert'';

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''ssl_key'';

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''ssl_crlpath'';

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''datadir'';

      V'
- id: '1.36'
  title: MADB-10-004200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must map PKI ID to an associated user account. GROUP ID: V-253701 RULE ID: SV-253701r961044'
  rationale: The DoD standard for authentication is DoD-approved PKI certificates. Once a PKI is validated, it is mapped to
    the DBMS user account for the authentication identity and then can be used for authorization decisions.
  impact: ''
  references: []
  page_start: 89
  audit_raw: 'Query all users to confirm issuer and subject are configured correctly:

    MariaDB>SELECT user, host, ssl_type, CAST(x509_issuer AS CHAR) AS issuer,

    CAST(x509_subject AS CHAR) AS subject FROM mysql.user;

    If users are not mapped correctly, this is a finding.'
  remediation: 'Example command to create users with proper X509 certificate subject and issuer:

    MariaDB>CREATE USER ''janedoe''@''%'' IDENTIFIED BY ''Some_Password_Here_$9''

    REQUIRE SUBJECT ''/C=US/ST=Ohio/L=Columbus/O=MariaDB Corporation/CN=Jane Doe''

    AND ISSUER ''/C=US/ST=Ohio/L=Columbus/O=MariaDB Corporation/CN=MariaDB CA'';'
  checks:
  - type: manual_review
    info: 'Query all users to confirm issuer and subject are configured correctly:

      MariaDB>SELECT user, host, ssl_type, CAST(x509_issuer AS CHAR) AS issuer,

