- id: '1.109'
  title: MADB-10-012400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must off-load audit data to a separate log management facility; this must be continuous and in near
    real time for systems with a network connection to the storage facility and weekly or more often for stand-alone systems.
    GROUP ID: V-253776 RULE ID: SV-253776r961860'
  rationale: Information stored in one location is vulnerable to accidental or incidental deletion or alteration. Off-loading
    is a common process in information systems with limited audit storage capacity. MariaDB writes audit records to files
    in the file system, to other kinds of local repository, or directly to a centralized log management system. Whatever the
    method used, it must be compatible with off-loading the records to the centralized system.
  impact: ''
  references: []
  page_start: 258
  audit_raw: 'Check if the variable server_audit_output_type is set to syslog, and verify the operating

    system is using a centralized syslog utility such as rsyslogd.

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''server_audit_output_type'';

    If not, this is a finding.'
  remediation: 'To set up the audit logs to write to sylog:

    Edit the mariadb-enterprise.cnf file. Add the following under the [mariadb] section:

    server_audit_output_type = ''syslog''

    After the .cnf file is updated and saved, the mariadb database service must be

    restarted.'
  checks:
  - type: sql
    command: SHOW GLOBAL VARIABLES LIKE 'server_audit_output_type';
    severity: medium
    info: 'Check if the variable server_audit_output_type is set to syslog, and verify the operating

      system is using a centralized syslog utility such as rsyslogd.

      MariaDB> SHOW GLOBAL VARIABLES LIKE ''server_audit_output_type'';

      If not, this is a finding.'
- id: '1.110'
  title: MADB-10-012600
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'MariaDB products must be a version supported by the vendor. GROUP ID: V-265882 RULE ID: SV-265882r999552'
  rationale: Unsupported commercial and database systems should not be used because fixes to newly identified bugs will not
    be implemented by the vendor. The lack of support can result in potential vulnerabilities. Systems at unsupported servicing
    levels or releases will not receive security updates for new vulnerabilities, which leaves them subject to exploitation.
    When maintenance updates and patches are no longer available, the database software is no longer considered supported
    and should be upgraded or decommissioned.
  impact: ''
  references: []
  page_start: 260
  audit_raw: 'Review the version and release information.

    Verify the MariaDB Enterprise Server version via one of the following methods:

    MariaDB> SELECT VERSION();

    # mariadb --version

    Verify the version is supported per the MariaDB support policy:

    https://mariadb.com/engineering-policies/

    If the installed version of MariaDB is not supported by the vendor, this is a finding.'
  remediation: 'Remove or decommission all unsupported software products.

    Upgrade unsupported DBMS or unsupported components to a supported version of the

    product.'
  checks:
  - type: manual_review
    info: 'Review the version and release information.

