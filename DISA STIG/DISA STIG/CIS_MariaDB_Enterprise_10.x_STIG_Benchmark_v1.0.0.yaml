  rationale: Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect data.
    The application must implement cryptographic modules adhering to the higher standards approved by the federal government
    since this provides assurance they have been tested and validated. For detailed information, refer to NIST FIPS Publication
