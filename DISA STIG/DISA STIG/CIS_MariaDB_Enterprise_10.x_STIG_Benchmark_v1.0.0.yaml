  description: 'MariaDB must provide an immediate real-time alert to appropriate support staff of all audit failure events
    requiring real-time alerts. GROUP ID: V-253729 RULE ID: SV-253729r961401'
  rationale: It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit logs
    as required. Without a real-time alert, security personnel may be unaware of an impending failure of the audit capability,
    and system operation may be adversely affected. The appropriate support staff include, at a minimum, the ISSO and the
    DBA/SA. Alerts provide organizations with urgent messages. Real-time alerts provide these messages immediately (i.e.,
    the time from event detection to alert occurs in seconds or less).
  impact: ''
  references: []
  page_start: 152
