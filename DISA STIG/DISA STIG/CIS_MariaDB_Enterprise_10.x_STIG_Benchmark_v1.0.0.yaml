  title: MADB-10-008900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'MariaDB must maintain the confidentiality and integrity of information during preparation for transmission.
    GROUP ID: V-253741 RULE ID: SV-253741r961638'
  rationale: Information can be either unintentionally or maliciously disclosed or modified during preparation for transmission,
    including, for example, during aggregation, at protocol transformation points, and during packing/unpacking. These unauthorized
    disclosures or modifications compromise the confidentiality, or integrity of the information. Use of this requirement
    will be limited to situations where the data owner has a strict requirement for ensuring data integrity and confidentiality
    is maintained at every step of the data transfer and handling process. When transmitting data, MariaDB associated applications
    and infrastructure must leverage transmission protection mechanisms.
  impact: ''
  references: []
  page_start: 181
  audit_raw: 'If the data owner does not have a strict requirement for ensuring data integrity and

    confidentiality is maintained at every step of the data transfer and handling process, this

    is not a finding.

