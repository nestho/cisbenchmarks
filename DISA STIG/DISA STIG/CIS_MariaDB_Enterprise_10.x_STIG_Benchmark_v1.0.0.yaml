- id: '1.45'
  title: MADB-10-005200
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'MariaDB must protect the confidentiality and integrity of all information at rest. GROUP ID: V-253710 RULE
    ID: SV-253710r961128'
  rationale: This control is intended to address the confidentiality and integrity of information at rest in nonmobile devices
    and covers user information and system information. Information at rest refers to the state of information when it is
    located on a secondary storage device (e.g., disk drive, tape drive) within an organizational information system. Applications
    and application users generate information throughout the course of their application use. User data generated, as well
    as application-specific configuration data, must be protected. Organizations may choose to employ different mechanisms
    to achieve confidentiality and integrity protections, as appropriate. If the confidentiality and integrity of application
    data is not protected, the data will be open to compromise and unauthorized modification.
  impact: ''
  references: []
  page_start: 108
  audit_raw: 'If the application owner and Authorizing Official have determined that encryption of data

    at rest is NOT required, this is not a finding.

    One possible way to encrypt data within MariaDB is to use the file key management

    plugin. To determine if this is installed, check the following variables as the Database

    administrator:

    MariaDB> SHOW PLUGINS;

    Confirm the file_key_management.so is listed.

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''file_key%'';

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''aria_en%'';

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''innodb_encrypt_tables'';

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''innodb_encrypt_log'';

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''innodb_tablespace%'';

    MariaDB> SHOW GLOBAL VARIABLES LIKE ''encrypt%'';

    Confirm these are ON.

    If disk or filesystem requires encryption, ask the system owner, DBA, and SA to

    demonstrate the use of disk-level encryption.

    If this is required and is not found, this is a finding.

    If controls do not exist or are not enabled, this is a finding.'
  remediation: "MariaDB's data-at-rest encryption requires the use of a key management and\nencryption plugin. These plugins\
    \ are responsible both for the management of encryption\nkeys and for the actual encryption and decryption of data. MariaDB\
    \ supports the use of\nmultiple encryption keys. Each encryption key uses a 32-bit integer as a key identifier. If\nthe\
    \ specific plugin supports key rotation, then encryption keys can also be rotated,\nwhich creates a new version of the\
    \ encryption key.\nThe File Key Management plugin that ships with MariaDB is a key management and\nencryption plugin that\
    \ reads encryption keys from a plain-text file. Although the plugin's\nshared library is distributed with MariaDB by default,\
    \ the plugin is not installed by\nMariaDB by default. The plugin can be installed by providing the --plugin-load or the\
    \ --\nplugin-load-add options. This can be specified as a command-line argument to mysqld\nor it can be specified in a\
    \ relevant server option group in an option file. For example:\n[mariadb]\n...\nplugin_load_add = file_key_management\n\
    Creating the Key File: To encrypt tables with encryption keys using the File Key\nManagement plugin, first create the\
    \ file that contains the encryption keys. The file must\ncontain two pieces of information for each encryption key. First,\
    \ each encryption key\nmust be identified with a 32-bit integer as the key identifier. Second, the encryption key\nitself\
    \ must be provided in hex-encoded form. These two pieces of information must be\nseparated by a semicolon.\nFor example,\
    \ the file is formatted in the following way:\n <encryption_key_id1>;<hex-encoded_encryption_key1>\n <encryption_key_id2>;<hex-encoded_encryption_key2>\n\
    The key file can also be optionally encrypted to make it less accessible from the file\nsystem. That is explained further\
    \ in the section below.\nThe File Key Management plugin uses Advanced Encryption Standard (AES) to encrypt\ndata, which\
    \ supports 128-bit, 192-bit, and 256-bit encryption keys. Therefore, the plugin\nalso supports 128-bit, 192-bit, and 256-bit\
    \ encryption keys.\nRandom encryption keys can be generated using the openssl rand command. For\nexample, to create a\
    \ random 256-bit (32-byte) encryption key, run the following\ncommand:\n$ openssl rand -hex 32\na7addd9adea9978fda19f21e6be987880e68ac92632ca052e5bb42b1a506939a\n\
    Copy this encryption key to the key file using a text editor, or append a series of keys to\na new key file. For example,\
    \ to append three new encryption keys to a new key file,\nexecute the following:\n$ sudo openssl rand -hex 32 >> /etc/mysql/encryption/keyfile\n\
    $ sudo openssl rand -hex 32 >> /etc/mysql/encryption/keyfile\n$ sudo openssl rand -hex 32 >> /etc/mysql/encryption/keyfile\n\
    The new key file would look something like the following after this step:\na7addd9adea9978fda19f21e6be987880e68ac92632ca052e5bb42b1a506939a\n\
    49c16acc2dffe616710c9ba9a10b94944a737de1beccb52dc1560abfdd67388b\n8db1ee74580e7e93ab8cf157f02656d356c2f437d548d5bf16bf2a56932954a3\n\
    The key file still needs to have a key identifier for each encryption key added to the\nbeginning of each line. Key identifiers\
    \ do not need to be contiguous. Open the new key\nfile in the preferred text editor and add the key identifiers. For example,\
    \ the key file\nwould look something like the following after this step:\n1;a7addd9adea9978fda19f21e6be987880e68ac92632ca052e5bb42b1a506939a\n\
    2;49c16acc2dffe616710c9ba9a10b94944a737de1beccb52dc1560abfdd67388b\n100;8db1ee74580e7e93ab8cf157f02656d356c2f437d548d5bf16bf2a56932954a3\n\
    The key identifiers give the user a way to reference the encryption keys from MariaDB.\nIn the example above, encryption\
    \ keys can be referenced using the key identifiers 1, 2,\nor 100 with the ENCRYPTION_KEY_ID table option or with system\
    \ variables such as\ninnodb_default_encryption_key_id. Multiple encryption keys are not always necessary;\nthe encryption\
    \ key with the key identifier \"1\" is the only mandatory encryption key.\nOnce the File Key Management Plugin is enabled,\
    \ use it by creating an encrypted table:\nCREATE TABLE t (i int) ENGINE=InnoDB ENCRYPTED=YES\nNow, table t will be encrypted\
    \ using the encryption key from the key file."
  checks:
  - type: sql
    command: SHOW PLUGINS;
    severity: medium
    info: 'If the application owner and Authorizing Official have determined that encryption of data

      at rest is NOT required, this is not a finding.

      One possible way to encrypt data within MariaDB is to use the file key management

      plugin. To determine if this is installed, check the following variables as the Database

      administrator:

      MariaDB> SHOW PLUGINS;

      Confirm the file_key_management.so is listed.

      MariaDB'
- id: '1.46'
  title: MADB-10-005400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Database contents must be protected from unauthorized and unintended information transfer by enforcement of
    a data-transfer policy. GROUP ID: V-253711 RULE ID: SV-253711r961149'
  rationale: Applications, including MariaDB, must prevent unauthorized and unintended information transfer via shared system
    resources. Data used for the development and testing of applications often involves copying data from production. It is
    important that specific procedures exist for this process, to include the conditions under which such transfer may take
    place, where the copies may reside, and the rules for ensuring sensitive data are not exposed. Copies of sensitive data
    must not be misplaced or left in a temporary location without the proper controls.
  impact: ''
  references: []
  page_start: 112
  audit_raw: 'Review the procedures for the refreshing of development/test data from production.

    Review any scripts or code that exists for the movement of production data to

    development/test systems, or to any other location or for any other purpose.

    Verify that copies of production data are not left in unprotected locations.

    If the code that exists for data movement does not comply with the organization-defined

    data transfer policy and/or fails to remove any copies of production data from

    unprotected locations, this is a finding.'
  remediation: 'Modify any code used for moving data from production to development/test systems to

    comply with the organization-defined data transfer policy, and to ensure copies of

    production data are not left in unsecured locations.'
