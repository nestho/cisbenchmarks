  remediation: 'As an authorized user locate the session to be terminated and terminate that session.

    To locate a session and terminate the session follow the following steps:

    1. Connect to the MariaDB database using an authorized user:

    mariadb -u admin_user -p

    2. At the MariaDB prompt run either of the following commands:

    MariaDB> SHOW PROCESSLIST;

    MariaDB> SELECT id, user, host, db, command, time, state, info, progress FROM

    information_schema.processlist;

    3. Identify the session to be terminated and issue kill process number from display.

    (This will kill the session.) Example:

    MariaDB> KILL 192;

    4. A kill query process number can be issued from display. (**This will kill the active

    query but leave the session active for run-away queries. **)

    Configure MariaDB to automatically terminate a user session based on security

    procedures requirements regarding conditions or trigger events that require session

