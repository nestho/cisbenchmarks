- id: '1.26'
  title: PHTN-30-000026
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must use an OpenSSH server version that does not support protocol 1. GROUP ID:
    V-256503 RULE ID: SV-256503r987796'
  rationale: 'A replay attack may enable an unauthorized user to gain access to the operating system. Authentication sessions
    between the authenticator and the operating system validating the user credentials must not be vulnerable to a replay
    attack. An authentication process resists replay attacks if it is impractical to achieve a successful authentication by
    recording and replaying a previous authentication message. A privileged account is any information system account with
    authorizations of a privileged user. Techniques used to address this include protocols using nonces (e.g., numbers generated
    for a specific one-time use) or challenges (e.g., TLS, WS_Security). Additional techniques include time-synchronous or
    challenge-response one-time authenticators. Satisfies: SRG-OS-000074-GPOS-00042, SRG-OS-000112-GPOS-00057, SRG-OS000113-GPOS-00058,
    SRG-OS-000120-GPOS-00061, SRG-OS-000125-GPOS-00065, SRG-OS-000395-GPOS-00175, SRG-OS-000425-GPOS-00189, SRG-OS-000426GPOS-00190'
  impact: ''
  references: []
  page_start: 58
