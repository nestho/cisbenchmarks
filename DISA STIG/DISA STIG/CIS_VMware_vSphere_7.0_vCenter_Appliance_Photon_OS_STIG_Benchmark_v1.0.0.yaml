    present at the information system or information system component and not communicating across a network connection. This
    requirement applies to hardware/software diagnostic test equipment or tools. It does not cover hardware/software components
    that may support information system maintenance, yet are a part of the system (e.g., the software implementing "ping,"
    "ls," "ipconfig," or the hardware and software implementing the monitoring port of an Ethernet switch). The operating
