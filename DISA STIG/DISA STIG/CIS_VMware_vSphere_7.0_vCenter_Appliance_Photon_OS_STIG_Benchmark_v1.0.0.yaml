  title: PHTN-30-000031
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Photon operating system must require authentication upon booting into single-user and maintenance modes.
    GROUP ID: V-256508 RULE ID: SV-256508r958472'
  rationale: 'If the system does not require authentication before it boots into single-user mode, anyone with console access
    to the system can trivially access all files on the system. GRUB2 is the boot loader for Photon OS and can be configured
    to require a password to boot into single-user mode or make modifications to the boot menu. Note: Photon does not support
    building grub changes via grub2-mkconfig.'
  impact: ''
  references: []
  page_start: 67
  audit_raw: 'At the command line, run the following command:

    # grep -i ^password_pbkdf2 /boot/grub2/grub.cfg

    If there is not output, this is a finding.

    If the output does not begin with "password_pbkdf2 root", this is a finding.'
  remediation: "At the command line, run the following command:\n# grub2-mkpasswd-pbkdf2\nEnter a secure password and ensure\
    \ this password is stored for break-glass situations.\nThe vCenter root account cannot be recovered without knowing this\
    \ separate password.\nCopy the resulting encrypted string.\nAn example string is below:\ngrub.pbkdf2.sha512.10000.983A13DF3C51BB2B5130F0B86DDBF0DEA1AAF766BD1F16B7840F\n\
    79CE3E35494C4B99F505C99C150071E563DF1D7FE1F45456D5960C4C79DAB6C49298B02A5558.\n5B2C49E12D43CC5A876F6738462DE4EFC24939D4BE486CDB72CFBCD87FDE93FBAFCB817E01B90\n\
    F23E53C2502C3230502BC3113BE4F80B0AFC0EE956E735F7F86\nNavigate to and open:\n/boot/grub2/grub.cfg\nFind the line that begins\
    \ with \"set rootpartition\". Below this line, paste the following on\nits own line:\nset superusers=\"root\"\nBelow this,\
    \ paste the following, substituting the encrypted string from the steps above:\npassword_pbkdf2 root <YOUR-LONG-STRING-FROM-ABOVE>\n\
    Photon ships with one menuentry block by default. Copy that entire block and paste it\nright below itself.\nExample:\n\
    menuentry \"Photon\" {\n linux \"/\"$photon_linux root=$rootpartition net.ifnames=0 $photon_cmdline\ncoredump_filter=0x37\
    \ consoleblank=0\n if [ \"$photon_initrd\" ]; then\n initrd \"/\"$photon_initrd\n fi\n}\nmenuentry \"Photon\" {\n linux\
    \ \"/\"$photon_linux root=$rootpartition net.ifnames=0 $photon_cmdline\ncoredump_filter=0x37 consoleblank=0\n if [ \"\
    $photon_initrd\" ]; then\n initrd \"/\"$photon_initrd\n fi\n}\nModify the first menuentry block to add the \"--unrestricted\"\
    \ option as follows:\nmenuentry \"Photon\" --unrestricted {\nModify the second menuentry block to add the allowed user\
    \ as follows:\nmenuentry \"Recover Photon\" --users root {\nThis concludes the fix. To verify, here is an example grub.cfg\
    \ snippet:\n...\nset rootpartition=PARTUUID=326e5b0f-42fb-471a-8209-18964c4a2ed3\nset superusers=\"root\"\npassword_pbkdf2\
    \ root\ngrub.pbkdf2.sha512.10000.983A13DF3C51BB2B5130F0B86DDBF0DEA1AAF766BD1F16B7840F\n79CE3E35494C4B99F505C99C150071E563DF1D7FE1F45456D5960C4C79DAB6C49298B02A5558.\n\
    5B2C49E12D43CC5A876F6738462DE4EFC24939D4BE486CDB72CFBCD87FDE93FBAFCB817E01B90\nF23E53C2502C3230502BC3113BE4F80B0AFC0EE956E735F7F86\n\
    menuentry \"Photon\" --unrestricted {\n linux \"/\"$photon_linux root=$rootpartition net.ifnames=0 $photon_cmdline\ncoredump_filter=0x37\
    \ consoleblank=0\n if [ \"$photon_initrd\" ]; then\n initrd \"/\"$photon_initrd\n fi\n}\nmenuentry \"Recover Photon\"\
    \ --users root {\n linux \"/\"$photon_linux root=$rootpartition net.ifnames=0 $photon_cmdline\ncoredump_filter=0x37 consoleblank=0\n\
    \ if [ \"$photon_initrd\" ]; then\n initrd \"/\"$photon_initrd\n fi\n}"
  checks:
  - type: manual_review
    info: 'At the command line, run the following command:

      # grep -i ^password_pbkdf2 /boot/grub2/grub.cfg

      If there is not output, this is a finding.

