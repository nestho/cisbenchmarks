- id: '1.111'
  title: PHTN-30-000120
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must configure sshd to restrict LoginGraceTime. GROUP ID: V-256588 RULE ID: SV-256588r991589'
  rationale: By default, sshd unauthenticated connections are left open for two minutes before being closed. This setting
    is too permissive as no legitimate login would need such an amount of time to complete a login. Quickly terminating idle
    or incomplete login attempts will free resources and reduce the exposure any partial logon attempts may create.
  impact: ''
  references: []
  page_start: 180
  audit_raw: 'At the command line, run the following command:

    # sshd -T|&grep -i LoginGraceTime

    Expected result:

    logingracetime 30

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/ssh/sshd_config

    Ensure the "LoginGraceTime" line is uncommented and set to the following:

    LoginGraceTime 30

    At the command line, run the following command:

    # systemctl restart sshd.service'
  checks:
  - type: manual_review
    info: 'At the command line, run the following command:

