    severity: medium
- id: '1.108'
  title: PHTN-30-000117
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must store only encrypted representations of passwords. GROUP ID: V-256585 RULE
    ID: SV-256585r982199'
  rationale: Passwords must be protected at all times via strong, one-way encryption. If passwords are not encrypted, they
    can be plainly read (i.e., clear text) and easily compromised. If they are encrypted with a weak cipher, those passwords
    are much more vulnerable to offline brute-force attacks.
  impact: ''
  references: []
  page_start: 177
  audit_raw: 'At the command line, run the following command:

    # grep password /etc/pam.d/system-password|grep --color=always "sha512"

    If the output does not include "sha512", this is a finding.'
  remediation: 'Navigate to and open:

    /etc/pam.d/system-password

    Add the argument "sha512" to the "password" line:

    password required pam_unix.so sha512 shadow try_first_pass

    Note: On vCenter appliances, the equivalent file must be edited under

    "/etc/applmgmt/appliance", if one exists, for the changes to persist after a reboot.'
  checks:
  - type: manual_review
    info: 'At the command line, run the following command:

      # grep password /etc/pam.d/system-password|grep --color=always "sha512"

      If the output does not include "sha512", this is a finding.'
    severity: medium
- id: '1.109'
  title: PHTN-30-000118
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must ensure the old passwords are being stored. GROUP ID: V-256586 RULE ID: SV-256586r982201'
  rationale: Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. If the information system or application allows the user to consecutively reuse their password
    when that password has exceeded its defined lifetime, the result is a password that is not changed per policy requirements.
  impact: ''
  references: []
  page_start: 178
  audit_raw: 'At the command line, run the following command:

    # ls -al /etc/security/opasswd

    If "/etc/security/opasswd" does not exist, this is a finding.'
  remediation: 'At the command line, run the following commands:

    # touch /etc/security/opasswd

    # chown root:root /etc/security/opasswd

    # chmod 0600 /etc/security/opasswd'
  checks:
  - type: manual_review
    info: 'At the command line, run the following command:

      # ls -al /etc/security/opasswd

      If "/etc/security/opasswd" does not exist, this is a finding.'
    severity: medium
