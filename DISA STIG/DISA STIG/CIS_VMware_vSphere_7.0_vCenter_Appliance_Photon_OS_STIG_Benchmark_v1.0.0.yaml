- id: '1.106'
  title: PHTN-30-000114
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must set the "umask" parameter correctly. GROUP ID: V-256583 RULE ID: SV-256583r991590'
  rationale: The "umask" value influences the permissions assigned to files when they are created. The "umask" setting in
    "login.defs" controls the permissions for a new user's home directory. By setting the proper "umask", home directories
    will only allow the new user to read and write files there.
  impact: ''
  references: []
  page_start: 175
  audit_raw: 'At the command line, run the following command:

    # grep ^UMASK /etc/login.defs

    Example result:

    UMASK 077

    If "UMASK" is not configured to "077", this a finding.

    Note: "UMASK" should only be specified once in login.defs.'
  remediation: 'Navigate to and open:

    /etc/login.defs

    Ensure the "UMASK" line is uncommented and set to the following:

    UMASK 077'
  checks:
  - type: manual_review
    info: 'At the command line, run the following command:

      # grep ^UMASK /etc/login.defs

      Example result:

      UMASK 077

      If "UMASK" is not configured to "077", this a finding.

      Note: "UMASK" should only be specified once in login.defs.'
    severity: medium
- id: '1.107'
  title: PHTN-30-000115
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must configure sshd to disallow HostbasedAuthentication. GROUP ID: V-256584 RULE
    ID: SV-256584r991591'
  rationale: Secure Shell (SSH) trust relationships enable trivial lateral spread after a host compromise and therefore must
    be explicitly disabled.
  impact: ''
  references: []
