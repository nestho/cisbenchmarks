      -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -F key=execpriv

      If '
- id: '1.13'
  title: PHTN-30-000013
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must have the auditd service running. GROUP ID: V-256490 RULE ID: SV-256490r958422'
  rationale: 'Event outcomes can include indicators of event success or failure and event-specific results (e.g., the security
    state of the information system after the event occurred). They also provide a means to measure the impact of an event
    and help authorized personnel to determine the appropriate response. Satisfies: SRG-OS-000042-GPOS-00021, SRG-OS-000062-GPOS-00031,
    SRG-OS000255-GPOS-00096, SRG-OS-000363-GPOS-00150, SRG-OS-000365-GPOS-00152, SRG-OS-000445-GPOS-00199, SRG-OS-000446-GPOS-00200,
    SRG-OS-000461GPOS-00205, SRG-OS-000467-GPOS-00211, SRG-OS-000465-GPOS-00209, SRGOS-000474-GPOS-00219, SRG-OS-000475-GPOS-00220'
  impact: ''
  references: []
  page_start: 36
  audit_raw: 'At the command line, run the following command:

    # systemctl status auditd

    If the service is not running, this is a finding.'
  remediation: 'At the command line, run the following commands:

    # systemctl enable auditd

    # systemctl start auditd'
  checks:
  - type: manual_review
    info: 'At the command line, run the following command:

      # systemctl status auditd

      If the service is not running, this is a finding.'
    severity: medium
- id: '1.14'
  title: PHTN-30-000014
  scoring: manual
