    severity: medium
- id: '1.112'
  title: PHTN-30-000240
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must implement NIST FIPS-validated cryptography for the following: to provision
    digital signatures, generate cryptographic hashes, and protect unclassified information requiring confidentiality and
    cryptographic protection in accordance with applicable federal laws, Executive Orders, directives, policies, regulations,
    and standards. GROUP ID: V-256589 RULE ID: SV-256589r959006'
  rationale: Use of weak or untested encryption algorithms undermines the purposes of using encryption to protect data. The
    operating system must implement cryptographic modules adhering to the higher standards approved by the federal government
    because this provides assurance they have been tested and validated.
  impact: ''
  references: []
  page_start: 181
  audit_raw: 'At the command line, run the following command:

    # cat /proc/sys/crypto/fips_enabled

    If a value of "1" is not returned, this is a finding.'
  remediation: 'Navigate to and open:

    /boot/grub2/grub.cfg

    Locate the kernel command line, which will start with "linux", and add "fips=1" to the

    end. For example:

    linux /$photon_linux audit=1 root=$rootpartition $photon_cmdline coredump_filter=0x37

    consoleblank=0 $systemd_cmdline fips=1

    Reboot the system for the change to take effect.

    Note: The "fipsify" package must be installed for FIPS mode to work properly.'
  checks:
  - type: manual_review
    info: 'At the command line, run the following command:

      # cat /proc/sys/crypto/fips_enabled

      If a value of "1" is not returned, this is a finding.'
    severity: medium
- id: '1.113'
  title: PHTN-30-000245
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must disable systemd fallback Domain Name System (DNS). GROUP ID: V-256590 RULE
    ID: SV-256590r991589'
  rationale: Systemd contains an ability to set fallback DNS servers. This is used for DNS lookups in the event no system-level
    DNS servers are configured or other DNS servers are specified in the systemd "resolved.conf" file. If uncommented, this
    configuration contains Google DNS servers by default and could result in DNS leaking information unknowingly in the event
    DNS is absent or misconfigured at the system level.
  impact: ''
  references: []
  page_start: 183
  audit_raw: 'At the command line, run the following command:

    # resolvectl status | grep ''Fallback DNS''

    If the output indicates that fallback DNS servers are configured, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/systemd/resolved.conf

    Add or update the "FallbackDNS" entry to the following:

    FallbackDNS=

    Restart the systemd resolved service by running the following command:

    # systemctl restart systemd-resolved

    Note: If this option is not given, a compiled-in list of DNS servers is used instead, which

    is undesirable.'
  checks:
  - type: command
    command: '# resolvectl status | grep ''Fallback DNS'''
    expected: ''
    severity: medium
    info: 'At the command line, run the following command:

      # resolvectl status | grep ''Fallback DNS''

      If the output indicates that fallback DNS servers are configured, this is a finding.'
