controls:
- id: '1.1'
  title: PHTN-30-000001
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must audit all account creations. GROUP ID: V-256478 RULE ID: SV-256478r958368'
  rationale: Once an attacker establishes access to a system, the attacker often attempts to create a persistent method of
    reestablishing access. One way to accomplish this is for the attacker to create an account. Auditing account creation
    actions provides logging that can be used for forensic purposes.
  impact: ''
  references: []
  page_start: 12
  audit_raw: 'At the command line, run the following command:

    # auditctl -l | grep -E "(useradd|groupadd)"

    Expected result:

    -w /usr/sbin/useradd -p x -k useradd

    -w /usr/sbin/groupadd -p x -k groupadd

    If either "useradd" or "groupadd" are not listed with a permissions filter of at least "x",

    this is a finding.

    Note: This check depends on the "auditd" service to be in a running state for accurate

    results. The "auditd" service is enabled in control PHTN-30-000013.'
  remediation: 'Navigate to and open:

    /etc/audit/rules.d/audit.STIG.rules

    Add or update the following lines:

    -w /usr/sbin/useradd -p x -k useradd

    -w /usr/sbin/groupadd -p x -k groupadd

    At the command line, run the following command to load the new audit rules:

    # /sbin/augenrules --load

    Note: A new "audit.STIG.rules" file is provided for placement in "/etc/audit/rules.d" that

    contains all rules needed for auditd.

    Note: An older "audit.STIG.rules" may exist and may reference older "GEN" SRG

    IDs. This file can be removed and replaced as necessary with an updated one.'
  checks:
  - type: command
    command: '# auditctl -l | grep -E "(useradd|groupadd)"'
    expected: ''
    severity: medium
    info: 'At the command line, run the following command:

      # auditctl -l | grep -E "(useradd|groupadd)"

      Expected result:

      -w /usr/sbin/useradd -p x -k useradd

      -w /usr/sbin/groupadd -p x -k groupadd

      If either "useradd" or "groupadd" are not listed with a permissions filter of at least "x",

      this is a finding.

      Note: This check depends on the "auditd" service to be in a running state for accurate

      results. The "au'
- id: '1.2'
  title: PHTN-30-000002
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must automatically lock an account when three unsuccessful logon attempts occur.
    GROUP ID: V-256479 RULE ID: SV-256479r958388'
  rationale: 'By limiting the number of failed logon attempts, the risk of unauthorized system access via user password guessing,
    otherwise known as brute-force attacks, is reduced. Limits are imposed by locking the account. Satisfies: SRG-OS-000021-GPOS-00005,
    SRG-OS-000329-GPOS-00128'
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'At the command line, run the following commands:

    # grep pam_tally2 /etc/pam.d/system-auth

    Expected result:

    auth required pam_tally2.so deny=3 onerr=fail audit even_deny_root unlock_time=900

    root_unlock_time=300

    # grep pam_tally2 /etc/pam.d/system-account

    Expected result:

    account required pam_tally2.so onerr=fail audit

    If the output does not list the "pam_tally2" options as configured in the expected results,

    this is a finding.'
  remediation: 'Navigate to and open:

    /etc/pam.d/system-auth

    Remove any existing "pam_tally2.so" line and add the following line after the

    "pam_unix.so" statement:

    auth required pam_tally2.so deny=3 onerr=fail audit even_deny_root unlock_time=900

    root_unlock_time=300

    Navigate to and open:

    /etc/pam.d/system-account

    Remove any existing "pam_tally2.so" line and add the following line after the

    "pam_unix.so" statement:

    account required pam_tally2.so onerr=fail audit

    Note: On vCenter appliances, the equivalent file must be edited under

    "/etc/applmgmt/appliance", if one exists, for the changes to persist after a reboot.'
  checks:
  - type: manual_review
    info: 'At the command line, run the following commands:

      # grep pam_tally2 /etc/pam.d/system-auth

      Expected result:

      auth required pam_tally2.so deny=3 onerr=fail audit even_deny_root unlock_time=900

      root_unlock_time=300

      # grep pam_tally2 /etc/pam.d/system-account

      Expected result:

      account required pam_tally2.so onerr=fail audit

      If the output does not list the "pam_tally2" options as configured in the expected results,

      this is a finding.'
    severity: medium
- id: '1.3'
  title: PHTN-30-000003
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must display the Standard Mandatory DOD Notice and Consent Banner before granting
    Secure Shell (SSH) access. GROUP ID: V-256480 RULE ID: SV-256480r958390'
  rationale: 'Display of a standardized and approved use notification before granting access to the operating system ensures
    privacy and security notification verbiage used is consistent with applicable federal laws, Executive Orders, directives,
    policies, regulations, standards, and guidance. Satisfies: SRG-OS-000023-GPOS-00006, SRG-OS-000228-GPOS-00088'
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'At the command line, run the following command:

    # sshd -T|&grep -i Banner

    Expected result:

    banner /etc/issue

    If the output does not match the expected result, this is a finding.

    Open "/etc/issue" with a text editor.

    If the file does not contain the Standard Mandatory DOD Notice and Consent Banner,

    this is a finding.

    Standard Mandatory DOD Notice and Consent Banner:

    "You are accessing a U.S. Government (USG) Information System (IS) that is provided

    for USG-authorized use only. By using this IS (which includes any device attached to

    this IS), you consent to the following conditions:

    -The USG routinely intercepts and monitors communications on this IS for purposes

    including, but not limited to, penetration testing, COMSEC monitoring, network

    operations and defense, personnel misconduct (PM), law enforcement (LE), and

    counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are subject to routine

    monitoring, interception, and search, and may be disclosed or used for any USG

    authorized purpose.

    -This IS includes security measures (e.g., authentication and access controls) to protect

    USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI

    investigative searching or monitoring of the content of privileged communications, or

    work product, related to personal representation or services by attorneys,

    psychotherapists, or clergy, and their assistants. Such communications and work

    product are private and confidential. See User Agreement for details."'
  remediation: 'Navigate to and open:

    /etc/ssh/sshd_config

    Ensure the "Banner" line is uncommented and set to the following:

    Banner /etc/issue

    Navigate to and open:

    /etc/issue

    Ensure the file contains the Standard Mandatory DOD Notice and Consent Banner.

    "You are accessing a U.S. Government (USG) Information System (IS) that is provided

    for USG-authorized use only. By using this IS (which includes any device attached to

    this IS), you consent to the following conditions:

    -The USG routinely intercepts and monitors communications on this IS for purposes

    including, but not limited to, penetration testing, COMSEC monitoring, network

    operations and defense, personnel misconduct (PM), law enforcement (LE), and

    counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are subject to routine

    monitoring, interception, and search, and may be disclosed or used for any USG

    authorized purpose.

    -This IS includes security measures (e.g., authentication and access controls) to protect

    USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI

    investigative searching or monitoring of the content of privileged communications, or

    work product, related to personal representation or services by attorneys,

    psychotherapists, or clergy, and their assistants. Such communications and work

    product are private and confidential. See User Agreement for details."

    At the command line, run the following command:

    # systemctl restart sshd.service'
  checks:
  - type: manual_review
    info: 'At the command line, run the following command:

      # sshd -T|&grep -i Banner

      Expected result:

      banner /etc/issue

      If the output does not match the expected result, this is a finding.

      Open "/etc/issue" with a text editor.

      If the file does not contain the Standard Mandatory DOD Notice and Consent Banner,

      this is a finding.

      Standard Mandatory DOD Notice and Consent Banner:

      "You are accessing a U.S. Government (USG) Information System (IS) that is provided

      for USG-authorized use only. By using this IS (w'
    severity: medium
- id: '1.4'
  title: PHTN-30-000004
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must limit the number of concurrent sessions to 10 for all accounts and/or account
    types. GROUP ID: V-256481 RULE ID: SV-256481r958398'
  rationale: Operating system management includes the ability to control the number of users and user sessions that utilize
    an operating system. Limiting the number of allowed users and sessions per user is helpful in reducing the risks related
    to denial-of-service attacks.
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'At the command line, run the following command:

    # grep "^[^#].*maxlogins.*" /etc/security/limits.conf

    Expected result:

    * hard maxlogins 10

    If the output does not match the expected result, this is a finding.

    Note: The expected result may be repeated multiple times.'
  remediation: 'At the command line, run the following command:

    # echo ''* hard maxlogins 10'' >> /etc/security/limits.conf'
  checks:
  - type: manual_review
    info: 'At the command line, run the following command:

      # grep "^[^#].*maxlogins.*" /etc/security/limits.conf

      Expected result:

      * hard maxlogins 10

      If the output does not match the expected result, this is a finding.

      Note: The expected result may be repeated multiple times.'
    severity: medium
- id: '1.5'
  title: PHTN-30-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must set a session inactivity timeout of 15 minutes or less. GROUP ID: V-256482
    RULE ID: SV-256482r958402'
  rationale: 'A session timeout is an action taken when a session goes idle for any reason. Rather than relying on the user
    to manually disconnect their session prior to going idle, the Photon operating system must be able to identify when a
    session has idled and take action to terminate the session. Satisfies: SRG-OS-000029-GPOS-00010, SRG-OS-000279-GPOS-00109,
    SRG-OS000126-GPOS-00066'
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'At the command line, run the following command:

    # cat /etc/profile.d/tmout.sh

    Expected result:

    TMOUT=900

    readonly TMOUT

    export TMOUT

    mesg n 2>/dev/null

    If the file "tmout.sh" does not exist or the output does not look like the expected result,

    this is a finding.'
  remediation: 'Navigate to and open:

    /etc/profile.d/tmout.sh

    Set its content to the following:

    TMOUT=900

    readonly TMOUT

    export TMOUT

    mesg n 2>/dev/null'
  checks:
  - type: manual_review
    info: 'At the command line, run the following command:

      # cat /etc/profile.d/tmout.sh

      Expected result:

      TMOUT=900

      readonly TMOUT

      export TMOUT

      mesg n 2>/dev/null

      If the file "tmout.sh" does not exist or the output does not look like the expected result,

      this is a finding.'
    severity: medium
- id: '1.6'
  title: PHTN-30-000006
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must have the sshd SyslogFacility set to "authpriv". GROUP ID: V-256483 RULE ID:
    SV-256483r958406'
  rationale: Automated monitoring of remote access sessions allows organizations to detect cyberattacks and ensure ongoing
    compliance with remote access policies by auditing connection activities.
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'At the command line, run the following command:

    # sshd -T|&grep -i SyslogFacility

    Expected result:

    syslogfacility AUTHPRIV

    If there is no output or if the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/ssh/sshd_config

    Ensure the "SyslogFacility" line is uncommented and set to the following:

    SyslogFacility AUTHPRIV

    At the command line, run the following command:

    # systemctl restart sshd.service'
  checks:
  - type: manual_review
    info: 'At the command line, run the following command:

      # sshd -T|&grep -i SyslogFacility

      Expected result:

      syslogfacility AUTHPRIV

      If there is no output or if the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.7'
  title: PHTN-30-000007
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must have sshd authentication logging enabled. GROUP ID: V-256484 RULE ID: SV-256484r958406'
  rationale: Automated monitoring of remote access sessions allows organizations to detect cyberattacks and ensure ongoing
    compliance with remote access policies by auditing connection activities. Shipping sshd authentication events to syslog
    allows organizations to use their log aggregators to correlate forensic activities among multiple systems.
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'At the command line, run the following command:

    # grep "^authpriv" /etc/rsyslog.conf

    Expected result should be similar to the following:

    authpriv.* /var/log/auth.log

    If "authpriv" is not configured to be logged, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/rsyslog.conf

    Add the following line:

    authpriv.* /var/log/auth.log

    Note: The path can be substituted for another suitable log destination.

    At the command line, run the following command:

    # systemctl restart rsyslog.service'
  checks:
  - type: manual_review
    info: 'At the command line, run the following command:

      # grep "^authpriv" /etc/rsyslog.conf

      Expected result should be similar to the following:

      authpriv.* /var/log/auth.log

      If "authpriv" is not configured to be logged, this is a finding.'
    severity: medium
- id: '1.8'
  title: PHTN-30-000008
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must have the sshd LogLevel set to "INFO". GROUP ID: V-256485 RULE ID: SV-256485r958406'
  rationale: Automated monitoring of remote access sessions allows organizations to detect cyberattacks and ensure ongoing
    compliance with remote access policies by auditing connection activities. The INFO LogLevel is required, at least, to
    ensure the capturing of failed login events.
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'At the command line, run the following command:

    # sshd -T|&grep -i LogLevel

    Expected result:

    LogLevel INFO

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/ssh/sshd_config

    Ensure the "LogLevel" line is uncommented and set to the following:

    LogLevel INFO

    At the command line, run the following command:

    # systemctl restart sshd.service'
  checks:
  - type: manual_review
    info: 'At the command line, run the following command:

      # sshd -T|&grep -i LogLevel

      Expected result:

      LogLevel INFO

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.9'
  title: PHTN-30-000009
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Photon operating system must configure sshd to use approved encryption algorithms. GROUP ID: V-256486
    RULE ID: SV-256486r958408'
  rationale: 'Without confidentiality protection mechanisms, unauthorized individuals may gain access to sensitive information
    via a remote access session. OpenSSH on the Photon operating system is compiled with a FIPS-validated cryptographic module.
    The "FipsMode" setting controls whether this module is initialized and used in FIPS 140-2 mode. Satisfies: SRG-OS-000033-GPOS-00014,
    SRG-OS-000393-GPOS-00173, SRG-OS000396-GPOS-00176, SRG-OS-000250-GPOS-00093, SRG-OS-000423-GPOS-00187'
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'At the command line, run the following command:

    # sshd -T|&grep -i FipsMode

    Expected result:

    FipsMode yes

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/ssh/sshd_config

    Ensure the "FipsMode" line is uncommented and set to the following:

    FipsMode yes

    At the command line, run the following command:

    # systemctl restart sshd.service'
  checks:
  - type: manual_review
    info: 'At the command line, run the following command:

      # sshd -T|&grep -i FipsMode

      Expected result:

      FipsMode yes

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.10'
  title: PHTN-30-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must configure auditd to log to disk. GROUP ID: V-256487 RULE ID: SV-256487r958412'
  rationale: 'Without establishing what type of events occurred, it would be difficult to establish, correlate, and investigate
    the events leading up to an outage or attack. Audit record content must be shipped to a central location, but it must
    also be logged locally. Satisfies: SRG-OS-000037-GPOS-00015, SRG-OS-000039-GPOS-00017, SRG-OS000040-GPOS-00018, SRG-OS-000041-GPOS-00019'
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'At the command line, run the following command:

    # grep "^write_logs" /etc/audit/auditd.conf

    Expected result:

    write_logs = yes

    If there is no output, this is not a finding.

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/audit/auditd.conf

    Ensure the "write_logs" line is uncommented and set to the following:

    write_logs = yes

    At the command line, run the following command:

    # killproc auditd -TERM

    # systemctl start auditd'
  checks:
  - type: manual_review
    info: 'At the command line, run the following command:

      # grep "^write_logs" /etc/audit/auditd.conf

      Expected result:

      write_logs = yes

      If there is no output, this is not a finding.

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.11'
  title: PHTN-30-000011
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must configure auditd to use the correct log format. GROUP ID: V-256488 RULE ID:
    SV-256488r958414'
  rationale: To compile an accurate risk assessment and provide forensic analysis, it is essential for security personnel
    to know exact, unfiltered details of the event in question.
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'At the command line, run the following command:

    # grep "^log_format" /etc/audit/auditd.conf

    Expected result:

    log_format = RAW

    If there is no output, this is not a finding.

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/audit/auditd.conf

    Ensure the "log_format" line is uncommented and set to the following:

    log_format = RAW

    At the command line, run the following command:

    # killproc auditd -TERM

    # systemctl start auditd'
  checks:
  - type: manual_review
    info: 'At the command line, run the following command:

      # grep "^log_format" /etc/audit/auditd.conf

      Expected result:

      log_format = RAW

      If there is no output, this is not a finding.

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.12'
  title: PHTN-30-000012
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must be configured to audit the execution of privileged functions. GROUP ID: V-256489
    RULE ID: SV-256489r958422'
  rationale: Misuse of privileged functions, either intentionally or unintentionally by authorized users, or by unauthorized
    external entities that have compromised information system accounts, is a serious and ongoing concern and can have significant
    adverse impacts on organizations. Auditing all actions by superusers is one way to detect such misuse and identify the
    risk from insider threats and the advanced persistent threat.
  impact: ''
  references: []
  page_start: 34
  audit_raw: 'At the command line, run the following command:

    # auditctl -l | grep execve

    Expected result:

    -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -F key=execpriv

    -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -F key=execpriv

    -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -F key=execpriv

    -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -F key=execpriv

    If the output does not match the expected result, this is a finding.

    Note: This check depends on the auditd service to be in a running state for accurate

    results. Enabling the auditd service is done in control PHTN-30-000013.'
  remediation: 'Navigate to and open:

    /etc/audit/rules.d/audit.STIG.rules

    Add the following lines:

    -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -F key=execpriv

    -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -F key=execpriv

    -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -F key=execpriv

    -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -F key=execpriv

    At the command line, run the following command to load the new audit rules:

    # /sbin/augenrules --load

    Note: A new "audit.STIG.rules" file is provided for placement in "/etc/audit/rules.d" that

    contains all rules needed for auditd.

    Note: An older "audit.STIG.rules" may exist if the file exists and references older "GEN"

    SRG IDs. This file can be removed and replaced as necessary with an updated one.'
  checks:
  - type: command
    command: '# auditctl -l | grep execve'
    expected: ''
    severity: medium
    info: 'At the command line, run the following command:

      # auditctl -l | grep execve

      Expected result:

