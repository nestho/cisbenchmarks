- id: '1.9'
  title: KNOX-15-801100
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Samsung Android 15 BYOAD and DOD enterprise must be configured to limit access to only AO-approved, corporate-owned
    enterprise IT resources. GROUP ID: V-272507 RULE ID: SV-272507r1098766'
  rationale: 'Note: IT resources includes DOD networks and applications (for example, DOD email). The system administrator
    must have the capability to limit access of the BYOAD to DOD networks and DOD IT resources based on mission needs and
    risk. An adversary could exploit vulnerabilities created by the weaker configuration to compromise DOD sensitive information.
    The AO should document networks, IT resources, and enterprise applications that BYOAD can access. Examples of EMM security
    controls are as follows: 1. Device access restrictions: Restrict or isolate access based on the device access type (i.e.,
    from the internet), authentication type (e.g., password), credential strength, etc. 2. User and device activity monitoring:
    Configured to detect anomalous activity, malicious activity, and unauthorized attempts to access DOD information. 3. Device
    health tracking: Monitor device attestation, health, and agents reporting compromised applications, connections, intrusions,
    and/or signatures. Reference: DOD policy "Use of Non-Government Mobile Devices" (3.b.(2)ii). SFR ID: FMT_SMF_EXT.1.1 47'
  impact: ''
  references: []
  page_start: 25
