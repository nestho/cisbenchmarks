- id: '1.3'
  title: KNOX-15-800400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The EMM system supporting the Samsung Android 15 BYOAD must be configured to detect if the Samsung Android
    15 BYOAD native security controls are disabled. GROUP ID: V-272500 RULE ID: SV-272500r1098273'
  rationale: 'Examples of indicators that the native device security controls have been disabled include jailbroken or rooted
    devices. DOD policy requires BYOAD devices with DOD data be managed by a DOD MDM server, MAM server, or VMI system. This
    ensures the device can be monitored for compliance with the approved security baseline and the work profile can be removed
    when the device is out of compliance, which protects DOD data from unauthorized exposure. Detection via collecting and
    analysis of BYOAD generated logs for noncompliance indicators is acceptable. This detection capability must be implemented
    prior to BYOAD access to DOD information and IT resources and continuously monitored on the DOD-managed segment of the
    BYOAD enrolled in the program. If non-DOD information (i.e., personal user data, device information) outside the DOD-managed
    segment of the BYOAD is required to be accessed, collected, monitored, tracked (i.e., location), or maintained, the circumstances
    under which this may be done must be outlined in the user agreement. Reference: DOD policy "Use of Non-Government Mobile
    Devices" (3.a.(3)iii). SFR ID: FMT_SMF_EXT.1.1 47'
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Verify the EMM system supporting the Samsung Android 15 BYOAD has been

    configured to detect if the BYOAD native security controls are disabled. The exact

    procedure will depend on the EMM system used at the site.

    If the EMM system supporting the Samsung Android 15 BYOAD is not configured to

    detect if the BYOAD native security controls are disabled, this is a finding.'
  remediation: 'Configure the EMM system supporting the Samsung Android 15 BYOAD to detect if the

    BYOAD native security controls are disabled. The exact procedure will depend on the

    EMM system used at the site.'
  checks:
  - type: manual_review
    info: 'Verify the EMM system supporting the Samsung Android 15 BYOAD has been

      configured to detect if the BYOAD native security controls are disabled. The exact

      procedure will depend on the EMM system used at the site.

      If the EMM system supporting the Samsung Android 15 BYOAD is not configured to

      detect if the BYOAD native security controls are disabled, this is a finding.'
    severity: medium
