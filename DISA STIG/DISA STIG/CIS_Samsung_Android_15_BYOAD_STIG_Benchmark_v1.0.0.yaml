- id: '1.12'
  title: KNOX-15-802200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The DOD Mobile Service Provider must not allow Samsung Android 15 BYOADs in facilities where personally owned
    mobile devices are prohibited. GROUP ID: V-272518 RULE ID: SV-272518r1098327'
  rationale: 'DOD policy requires BYOAD devices with DOD data be managed by a DOD MDM server, MAM server, or VMI system. This
    ensures the device can be monitored for compliance with the approved security baseline and the work profile can be removed
    when the device is out of compliance, which protects DOD data from unauthorized exposure. Follow local physical security
    procedures regarding allowing or prohibiting personally owned mobile devices in a DOD facility. If BYOAD devices are brought
    into facilities where the AO has determined the risk of using personal devices is unacceptable, this could lead to the
    exposure of sensitive DOD data. SFR ID: FMT_SMF_EXT.1.1 47'
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'Verify the DOD Mobile Service Provider or information system security officer

    (ISSO)/information system security manager (ISSM) do not allow BYOADs in facilities

    where personally owned mobile devices are prohibited.

    If the DOD Mobile Service Provider or ISSO/ISSM allows BYOADs in facilities where

    personally owned mobile devices are prohibited, this is a finding.'
  remediation: 'Do not allow BYOADs in facilities where personally owned mobile devices are

    prohibited.'
  checks:
  - type: manual_review
    info: 'Verify the DOD Mobile Service Provider or information system security officer

      (ISSO)/information system security manager (ISSM) do not allow BYOADs in facilities

      where personally owned mobile devices are prohibited.

      If the DOD Mobile Service Provider or ISSO/ISSM allows BYOADs in facilities where

      personally owned mobile devices are prohibited, this is a finding.'
    severity: medium
- id: '1.13'
  title: KNOX-15-802300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Samsung Android 15 BYOAD must be configured to disable device cameras and/or microphones when brought
    into DOD facilities where mobile phone cameras and/or microphones are prohibited. GROUP ID: V-272519 RULE ID: SV-272519r1098330'
  rationale: 'In some DOD operational environments, the use of the mobile device camera or microphone could lead to a security
    incident or compromise of DOD information. The system administrator must have the capability to disable the mobile device
    camera and/or microphone based on mission needs. Alternatively, mobile devices with cameras or microphones that cannot
    be disabled must be prohibited from the facility by the information system security officer (ISSO)/information system
    security manager (ISSM). If BYOAD devices are brought into facilities where the AO has determined the risk of using mobile
    device cameras or microphones is unacceptable, this could lead to the exposure of sensitive DOD data. SFR ID: FMT_SMF_EXT.1.1
    47'
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'Verify Samsung Android 15 BYOADs are prohibited in DOD facilities that prohibit mobile

    devices with cameras and microphones.

    If for DOD sites that prohibit mobile devices with cameras and microphones, Samsung

    Android 15 BYOADs have not been prohibited from the facility by the ISSO/ISSM, this is

    a finding.'
  remediation: 'It is not possible to disable phone cameras and/or microphones when in BYOD mode.

    Therefore, do not allow Samsung Android 15 BYOADs in DOD facilities where mobile

