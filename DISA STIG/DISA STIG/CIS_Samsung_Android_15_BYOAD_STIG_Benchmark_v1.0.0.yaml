- id: '1.10'
  title: KNOX-15-802000
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The EMM system supporting the Samsung Android 15 BYOAD must be NIAP validated (included on the NIAP list of
    compliant products or products in evaluation) unless the DOD CIO has granted an Approved Exception to Policy (E2P). GROUP
    ID: V-272516 RULE ID: SV-272516r1098321'
  rationale: 'Note: For a VMI solution, both the client and server must be NIAP compliant. Nonapproved EMM systems may not
    include sufficient controls to protect work data, applications, and networks from malware or adversary attack. EMM: mobile
    device management (MDM), mobile application management (MAM), mobile content management (MCM), or virtual mobile infrastructure
    (VMI). Components must only approve devices listed on the NIAP list of compliant products or products listed in evaluation
    at the following links respectfully: • https://www.niap-ccevs.org/Product/ • https://www.niap-ccevs.org/Product/PINE.cfm
    Reference: DOD policy "Use of Non-Government Mobile Devices" (3.a.(2)). SFR ID: FMT_SMF_EXT.1.1 47'
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'Verify the EMM system supporting the Samsung Android 15 BYOAD is NIAP-validated

    (included on the NIAP list of compliant products or products in evaluation). If not, verify

    the DOD CIO has granted an Approved Exception to Policy (E2P).

    Note: For a VMI solution, both the client and server components must be NIAP

    compliant.

    If the EMM system supporting the Samsung Android 15 BYOAD is not NIAP-validated

    (included on the NIAP list of compliant products or products in evaluation) and the DOD

    CIO has not granted an Approved Exception to Policy (E2P), this is a finding.'
