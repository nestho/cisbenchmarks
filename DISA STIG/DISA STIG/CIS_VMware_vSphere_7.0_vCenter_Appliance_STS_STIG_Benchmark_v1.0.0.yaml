- id: '1.25'
  title: VCST-70-000025
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must not enable support for TRACE requests. GROUP ID: V-256769 RULE ID: SV-256769r889277'
  rationale: '"TRACE" is a technique for a user to request internal information about Tomcat. This is useful during product
    development but should not be enabled in production. Allowing an attacker to conduct a TRACE operation against the Security
    Token Service will expose information that would be useful to perform a more targeted attack. The Security Token Service
    provides the "allowTrace" parameter as means to disable responding to TRACE requests.'
  impact: ''
  references: []
