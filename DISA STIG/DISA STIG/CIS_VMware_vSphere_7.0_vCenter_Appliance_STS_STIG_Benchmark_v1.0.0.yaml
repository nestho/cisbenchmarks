- id: '1.27'
  title: VCST-70-000028
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must be configured with the appropriate ports. GROUP ID: V-256771 RULE ID: SV-256771r918979'
  rationale: Web servers provide numerous processes, features, and functionalities that use TCP/IP ports. Some of these processes
    may be deemed unnecessary or too unsecure to run on a production system. The ports that the Security Token Service listens
    on are configured in the "catalina.properties" file and must be verified as accurate to their shipping state.
  impact: ''
  references: []
  page_start: 62
  audit_raw: 'At the command prompt, run the following command:

    # grep ''bio'' /usr/lib/vmware-sso/vmware-sts/conf/catalina.properties

    Expected result:

    bio-custom.http.port=7080

    bio-custom.https.port=8443

    bio-ssl-clientauth.https.port=3128

    bio-ssl-localhost.https.port=7444

    If the output of the command does not match the expected result, this is a finding.

    Note: Port 3128 will not be shown in the output prior to 7.0 U3i.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/catalina.properties

    Navigate to the ports specification section.

    Set the Security Token Service port specifications according to the following list:

    bio-custom.http.port=7080

    bio-custom.https.port=8443

    bio-ssl-clientauth.https.port=3128

    bio-ssl-localhost.https.port=7444

    Restart the service with the following command:

    # vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep ''bio'' /usr/lib/vmware-sso/vmware-sts/conf/catalina.properties

      Expected result:

      bio-custom.http.port=7080

      bio-custom.https.port=8443

      bio-ssl-clientauth.https.port=3128

      bio-ssl-localhost.https.port=7444

      If the output of the command does not match the expected result, this is a finding.

      Note: Port 3128 will not be shown in the output prior to 7.0 U3i.'
    severity: medium
- id: '1.28'
  title: VCST-70-000029
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must disable the shutdown port. GROUP ID: V-256772 RULE ID: SV-256772r889286'
  rationale: An attacker has at least two reasons to stop a web server. The first is to cause a denial of service, and the
    second is to put in place changes the attacker made to the web server configuration. If the Tomcat shutdown port feature
    is enabled, a shutdown signal can be sent to the Security Token Service through this port. To ensure availability, the
    shutdown port must be disabled.
  impact: ''
  references: []
  page_start: 64
  audit_raw: 'At the command prompt, run the following command:

    # grep ''base.shutdown.port'' /usr/lib/vmware-sso/vmwarests/conf/catalina.properties

    Expected result:

    base.shutdown.port=-1

    If the output of the command does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/catalina.properties

    Add or modify the following setting:

    base.shutdown.port=-1

    Restart the service with the following command:

    # vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep ''base.shutdown.port'' /usr/lib/vmware-sso/vmwarests/conf/catalina.properties

      Expected result:

      base.shutdown.port=-1

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.29'
  title: VCST-70-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must set the secure flag for cookies. GROUP ID: V-256773 RULE ID: SV-256773r889289'
  rationale: The secure flag is an option that can be set by the application server when sending a new cookie to the user
    within an HTTP Response. The purpose of the secure flag is to prevent cookies from being observed by unauthorized parties
    due to the transmission of the cookie in clear text. By setting the secure flag, the browser will prevent the transmission
    of a cookie over an unencrypted channel. The Security Token Service is configured to only be accessible over a Transport
    Layer Security (TLS) tunnel, but this cookie flag is still a recommended best practice.
  impact: ''
  references: []
  page_start: 66
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --format /usr/lib/vmware-sso/vmware-sts/conf/web.xml | sed ''2

    s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/session-config/cookieconfig/secure'' -

    Expected result:

    <secure>true</secure>

    If the output of the command does not match the expected result, this is a finding.'
  remediation: "Navigate to and open:\n/usr/lib/vmware-sso/vmware-sts/conf/web.xml\nNavigate to the /<web-apps>/<session-config>/<cookie-config>\
    \ node and\nconfigure it as follows:\n <cookie-config>\n <http-only>true</http-only>\n <secure>true</secure>\n </cookie-config>\n\
    Restart the service with the following command:\n# vmon-cli --restart sts"
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --format /usr/lib/vmware-sso/vmware-sts/conf/web.xml | sed ''2

      s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/session-config/cookieconfig/secure'' -

      Expected result:

      <secure>true</secure>

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.30'
  title: VCST-70-000031
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service default servlet must be set to "readonly". GROUP ID: V-256774 RULE ID: SV-256774r889292'
  rationale: The default servlet (or DefaultServlet) is a special servlet provided with Tomcat that is called when no other
    suitable page is found in a particular folder. The DefaultServlet serves static resources as well as directory listings.
    The DefaultServlet is configured by default with the "readonly" parameter set to "true" where HTTP commands such as PUT
    and DELETE are rejected. Changing this to "false" allows clients to delete or modify static resources on the server and
    to upload new resources. DefaultServlet readonly must be set to "true", either literally or by absence (default).
  impact: ''
  references: []
  page_start: 68
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --format /usr/lib/vmware-sso/vmware-sts/conf/web.xml | sed ''2

    s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/servlet/servletname[text()="default"]/../init-param/param-name[text()="readonly"]/../paramvalue[text()="false"]''
    -

    Expected result:

    XPath set is empty

    If the output of the command does not match the expected result, this is a finding.'
  remediation: "Navigate to and open:\n/usr/lib/vmware-sso/vmware-sts/conf/web.xml\nNavigate to the /<web-apps>/<servlet>/<servlet-name>default</servletname>/\
    \ node and remove the following node:\n<init-param>\n <param-name>readonly</param-name>\n <param-value>false</param-value>\n\
    </init-param>\nRestart the service with the following command:\n# vmon-cli --restart sts"
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --format /usr/lib/vmware-sso/vmware-sts/conf/web.xml | sed ''2

      s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/servlet/servletname[text()="default"]/../init-param/param-name[text()="readonly"]/../paramvalue[text()="false"]''
      -

      Expected result:

      XPath set is empty

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.31'
  title: VCST-70-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Security Token Service log data and records must be backed up onto a different system or media. GROUP ID:
    V-256775 RULE ID: SV-256775r889295'
  rationale: 'Protection of Security Token Service log data includes ensuring log data is not accidentally lost or deleted.
    Backing up Security Token Service log records to an unrelated system or onto separate media than the system the web server
    is running on helps to ensure that, in the event of a catastrophic system failure, the log records will be retained. Satisfies:
    SRG-APP-000125-WSR-000071, SRG-APP-000358-WSR-000163'
  impact: ''
  references: []
