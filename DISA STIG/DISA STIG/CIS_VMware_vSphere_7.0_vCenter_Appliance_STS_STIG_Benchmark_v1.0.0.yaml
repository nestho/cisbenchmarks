- id: '1.14'
  title: VCST-70-000014
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must not have the Web Distributed Authoring (WebDAV) servlet installed. GROUP ID:
    V-256758 RULE ID: SV-256758r889244'
  rationale: WebDAV is an extension to the HTTP protocol that, when developed, was meant to allow users to create, change,
    and move documents on a server, typically a web server or web share. WebDAV is not widely used and has serious security
    concerns because it may allow clients to modify unauthorized files on the web server and must therefore be disabled. Tomcat
    uses the "org.apache.catalina.servlets.WebdavServlet" servlet to provide WebDAV services. Because the WebDAV service has
    been found to have an excessive number of vulnerabilities, this servlet must not be installed. The Security Token Service
    does not configure WebDAV by default.
  impact: ''
  references: []
  page_start: 36
  audit_raw: 'At the command prompt, run the following command:

    # grep -n ''webdav'' /usr/lib/vmware-sso/vmware-sts/conf/web.xml

    If the command produces any output, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/web.xml

    Find the <servlet-name>webdav</servlet-name> node and remove the entire parent

    <servlet> block.

    Restart the service with the following command:

    # vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep -n ''webdav'' /usr/lib/vmware-sso/vmware-sts/conf/web.xml

      If the command produces any output, this is a finding.'
    severity: medium
- id: '1.15'
  title: VCST-70-000015
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must be configured with memory leak protection. GROUP ID: V-256759 RULE ID: SV-256759r889247'
  rationale: The Java Runtime environment can cause a memory leak or lock files under certain conditions. Without memory leak
    protection, the Security Token Service can continue to consume system resources which will lead to "OutOfMemoryErrors"
    when reloading web applications. Memory leaks occur when JRE code uses the context class loader to load a singleton. This
    this will cause a memory leak if a web application class loader happens to be the context class loader at the time. The
    "JreMemoryLeakPreventionListener" class is designed to initialize these singletons when Tomcat's common class loader is
    the context class loader. Proper use of JRE memory leak protection will ensure the hosted application does not consume
    system resources and cause an unstable environment.
  impact: ''
  references: []
  page_start: 38
  audit_raw: 'At the command prompt, run the following command:

    # grep JreMemoryLeakPreventionListener /usr/lib/vmware-sso/vmwarests/conf/server.xml

    Expected result:

    <Listener

    className="org.apache.catalina.core.JreMemoryLeakPreventionListener"/>

    If the output of the command does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Navigate to the <Server> node.

    Add ''<Listener

    className="org.apache.catalina.core.JreMemoryLeakPreventionListener"/>'' to the

    <Server> node.

    Restart the service with the following command:

    # vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep JreMemoryLeakPreventionListener /usr/lib/vmware-sso/vmwarests/conf/server.xml

      Expected result:

      <Listener

      className="org.apache.catalina.core.JreMemoryLeakPreventionListener"/>

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.16'
  title: VCST-70-000016
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must not have any symbolic links in the web content directory tree. GROUP ID: V-256760
    RULE ID: SV-256760r889250'
  rationale: A web server is designed to deliver content and execute scripts or applications on the request of a client or
    user. Containing user requests to files in the directory tree of the hosted web application and limiting the execution
    of scripts and applications guarantees the user is not accessing information protected outside the application's realm.
    By checking that no symbolic links exist in the document root, the web server is protected from users jumping outside
    the hosted application directory tree and gaining access to the other directories, including the system root.
  impact: ''
  references: []
  page_start: 40
