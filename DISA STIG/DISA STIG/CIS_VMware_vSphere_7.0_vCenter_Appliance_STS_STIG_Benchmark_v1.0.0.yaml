benchmark:
  id: cis-vmware-vsphere-7-0-vcenter-appliance-sts-stig-benchmark
  title: CIS VMware vSphere 7.0 vCenter Appliance STS STIG Benchmark
  version: 1.0.0
  technology: DISA STIG
  category: DISA STIG
  os: DISA STIG
  source_pdf: CIS_VMware_vSphere_7.0_vCenter_Appliance_STS_STIG_Benchmark_v1.0.0.pdf
  total_pages: 76
  controls_count: 31
controls:
- id: '1.1'
  title: VCST-70-000001
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must limit the amount of time that each Transmission Control Protocol (TCP) connection
    is kept alive. GROUP ID: V-256745 RULE ID: SV-256745r889205'
  rationale: Denial of service (DoS) is one threat against web servers. Many DoS attacks attempt to consume web server resources
    in such a way that no more resources are available to satisfy legitimate requests. In Tomcat, the "connectionTimeout"
    attribute sets the number of milliseconds the server will wait after accepting a connection for the requested Uniform
    Resource Identifier (URI) line to be presented. This timeout will also be used when reading the request body (if any).
    This prevents idle sockets that are not sending HTTP requests from consuming system resources and potentially denying
    new connections.
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --xpath ''/Server/Service/Connector[@port="${biocustom.http.port}"]/@connectionTimeout'' /usr/lib/vmware-sso/vmwarests/conf/server.xml

    Expected result:

    connectionTimeout="60000"

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Navigate to each of the <Connector> nodes.

    Configure each <Connector> node with the value:

    connectionTimeout="60000"

    Restart the service with the following command:

    # vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --xpath ''/Server/Service/Connector[@port="${biocustom.http.port}"]/@connectionTimeout'' /usr/lib/vmware-sso/vmwarests/conf/server.xml

      Expected result:

      connectionTimeout="60000"

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.2'
  title: VCST-70-000002
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must limit the number of concurrent connections permitted. GROUP ID: V-256746 RULE
    ID: SV-256746r889208'
  rationale: Resource exhaustion can occur when an unlimited number of concurrent requests are allowed on a website, facilitating
    a denial-of-service attack. Unless the number of requests is controlled, the web server can consume enough system resources
    to cause a system crash. Mitigating this kind of attack will include limiting the number of concurrent HTTP/HTTPS requests.
    In Tomcat, each incoming request requires a thread for the duration of that request. If more simultaneous requests are
    received than can be handled by the currently available request processing threads, additional threads will be created
    up to the value of the "maxThreads" attribute.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --xpath

    ''/Server/Service/Executor[@name="tomcatThreadPool"]/@maxThreads''

    /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Expected result:

    maxThreads="150"

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Navigate to the <Executor> mode with the name of "tomcatThreadPool" and configure

    with the value ''maxThreads="150"'' as follows:

    <Executor maxThreads="150" minSpareThreads="50" name="tomcatThreadPool"

    namePrefix="tomcat-http--" />

    Restart the service with the following command:

    # vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --xpath

      ''/Server/Service/Executor[@name="tomcatThreadPool"]/@maxThreads''

      /usr/lib/vmware-sso/vmware-sts/conf/server.xml

      Expected result:

      maxThreads="150"

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.3'
  title: VCST-70-000003
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must limit the maximum size of a POST request. GROUP ID: V-256747 RULE ID: SV-256747r889211'
  rationale: The "maxPostSize" value is the maximum size in bytes of the POST that will be handled by the container FORM URL
    parameter parsing. Limit its size to reduce exposure to a denial-of-service (DoS) attack. If "maxPostSize" is not set,
    the default value of 2097152 (2MB) is used. Security Token Service is configured in its shipping state to not set a value
    for "maxPostSize".
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --xpath ''/Server/Service/Connector[@port="${biocustom.http.port}"]/@maxPostSize'' /usr/lib/vmware-sso/vmwarests/conf/server.xml

    Expected result:

    XPath set is empty

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Navigate to each of the <Connector> nodes.

    Remove any configuration for "maxPostSize".

    Restart the service with the following command:

    # vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --xpath ''/Server/Service/Connector[@port="${biocustom.http.port}"]/@maxPostSize'' /usr/lib/vmware-sso/vmwarests/conf/server.xml

      Expected result:

      XPath set is empty

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.4'
  title: VCST-70-000004
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must protect cookies from cross-site scripting (XSS). GROUP ID: V-256748 RULE ID:
    SV-256748r889214'
  rationale: 'Cookies are a common way to save session state over the HTTP(S) protocol. If an attacker can compromise session
    data stored in a cookie, they are better able to launch an attack against the server and its applications. When a cookie
    is tagged with the "HttpOnly" flag, it tells the browser that this particular cookie should only be accessed by the originating
    server. Any attempt to access the cookie from client script is strictly forbidden. Satisfies: SRG-APP-000001-WSR-000002,
    SRG-APP-000223-WSR-000011, SRGAPP-000439-WSR-000154'
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --format /usr/lib/vmware-sso/vmware-sts/conf/web.xml | sed ''2

    s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/session-config/cookieconfig/http-only'' -

    Expected result:

    <http-only>true</http-only>

    If the output does not match the expected result, this is a finding.'
  remediation: "Navigate to and open:\n/usr/lib/vmware-sso/vmware-sts/conf/web.xml\nNavigate to the <session-config> node\
    \ and configure it as follows:\n<session-config>\n <session-timeout>30</session-timeout>\n <cookie-config>\n <http-only>true</http-only>\n\
    \ <secure>true</secure>\n </cookie-config>\n</session-config>\nRestart the service with the following command:\n# vmon-cli\
    \ --restart sts"
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --format /usr/lib/vmware-sso/vmware-sts/conf/web.xml | sed ''2

      s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/session-config/cookieconfig/http-only'' -

      Expected result:

      <http-only>true</http-only>

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.5'
  title: VCST-70-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must record user access in a format that enables monitoring of remote access. GROUP
    ID: V-256749 RULE ID: SV-256749r889217'
  rationale: 'Remote access can be exploited by an attacker to compromise the server. By recording all remote access activities,
    it will be possible to determine the attacker''s location, intent, and degree of success. Tomcat can be configured with
    an "AccessLogValve", a component that can be inserted into the request processing pipeline to provide robust access logging.
    The "AccessLogValve" creates log files in the same format as those created by standard web servers. When "AccessLogValve"
    is properly configured, log files will contain all the forensic information necessary in the case of a security incident.
    Satisfies: SRG-APP-000016-WSR-000005, SRG-APP-000093-WSR-000053, SRGAPP-000095-WSR-000056, SRG-APP-000096-WSR-000057,
    SRG-APP-000097-WSR000058, SRG-APP-000098-WSR-000059, SRG-APP-000098-WSR-000060, SRG-APP000099-WSR-000061, SRG-APP-000100-WSR-000064,
    SRG-APP-000374-WSR000172, SRG-APP-000375-WSR-000171'
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --format /usr/lib/vmware-sso/vmware-sts/conf/server.xml | sed ''2

    s/xmlns=".*"//g'' | xmllint --xpath

    ''/Server/Service/Engine/Host/Valve[@className="org.apache.catalina.valves.Acc

    essLogValve"]/@pattern'' -

    Expected result:

    pattern="%t %I [RemoteIP] %{X-Forwarded-For}i %u [Request] %h:%{remote}p to local

    %{local}p - %H %m %U%q [Response] %s - %b bytes [Perf] process %Dms / commit

    %Fms / conn [%X]"

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Inside the <Host> node, find the "AccessLogValve" <Valve> node and replace the

    "pattern" element as follows:

    pattern="%t %I [RemoteIP] %{X-Forwarded-For}i %u [Request] %h:%{remote}p to local

    %{local}p - %H %m %U%q [Response] %s - %b bytes [Perf] process %Dms / commit

    %Fms / conn [%X]"

    Restart the service with the following command:

    # vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --format /usr/lib/vmware-sso/vmware-sts/conf/server.xml | sed ''2

      s/xmlns=".*"//g'' | xmllint --xpath

      ''/Server/Service/Engine/Host/Valve[@className="org.apache.catalina.valves.Acc

      essLogValve"]/@pattern'' -

      Expected result:

      pattern="%t %I [RemoteIP] %{X-Forwarded-For}i %u [Request] %h:%{remote}p to local

      %{local}p - %H %m %U%q [Response] %s - %b bytes [Perf] process %Dms / commit

      %Fms / conn [%X]"

      If the output does not match the expected '
    severity: medium
- id: '1.6'
  title: VCST-70-000006
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must generate log records during Java startup and shutdown. GROUP ID: V-256750
    RULE ID: SV-256750r918974'
  rationale: 'Logging must be started as soon as possible when a service starts and as late as possible when a service is
    stopped. Many forms of suspicious actions can be detected by analyzing logs for unexpected service starts and stops. Also,
    by starting to log immediately after a service starts, it becomes more difficult for suspicious activity to go unlogged.
    Satisfies: SRG-APP-000089-WSR-000047, SRG-APP-000092-WSR-000055'
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'At the command prompt, run the following command:

    # grep "1catalina.org.apache.juli.FileHandler" /usr/lib/vmware-sso/vmwarests/conf/logging.properties

    Expected result:

    handlers = 1catalina.org.apache.juli.FileHandler,

    2localhost.org.apache.juli.FileHandler, 3manager.org.apache.juli.FileHandler,

    4host-manager.org.apache.juli.FileHandler

    .handlers = 1catalina.org.apache.juli.FileHandler

    1catalina.org.apache.juli.FileHandler.level = FINE

    1catalina.org.apache.juli.FileHandler.directory =

    ${catalina.base}/logs/tomcat

    1catalina.org.apache.juli.FileHandler.prefix = catalina.

    1catalina.org.apache.juli.FileHandler.bufferSize = -1

    1catalina.org.apache.juli.FileHandler.formatter =

    java.util.logging.SimpleFormatter

    1catalina.org.apache.juli.FileHandler.maxDays = 10

    org.apache.catalina.startup.Catalina.handlers =

    1catalina.org.apache.juli.FileHandler

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/logging.properties

    Ensure that the "handlers" and ".handlers" lines are configured as follows:

    handlers = 1catalina.org.apache.juli.FileHandler,

    2localhost.org.apache.juli.FileHandler, 3manager.org.apache.juli.FileHandler,

    4host-manager.org.apache.juli.FileHandler

    .handlers = 1catalina.org.apache.juli.FileHandler

    1catalina.org.apache.juli.FileHandler.level = FINE

    1catalina.org.apache.juli.FileHandler.directory =

    ${catalina.base}/logs/tomcat

    1catalina.org.apache.juli.FileHandler.prefix = catalina.

    1catalina.org.apache.juli.FileHandler.bufferSize = -1

    1catalina.org.apache.juli.FileHandler.formatter =

    java.util.logging.SimpleFormatter

    1catalina.org.apache.juli.FileHandler.maxDays = 10

    org.apache.catalina.startup.Catalina.handlers =

    1catalina.org.apache.juli.FileHandler

    Restart the service with the following command:

    # vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep "1catalina.org.apache.juli.FileHandler" /usr/lib/vmware-sso/vmwarests/conf/logging.properties

      Expected result:

      handlers = 1catalina.org.apache.juli.FileHandler,

      2localhost.org.apache.juli.FileHandler, 3manager.org.apache.juli.FileHandler,

      4host-manager.org.apache.juli.FileHandler

      .handlers = 1catalina.org.apache.juli.FileHandler

      1catalina.org.apache.juli.FileHandler.level = FINE

      1catalina.org.apache.juli.FileHandler.directory =

      ${catalina.'
    severity: medium
- id: '1.7'
  title: VCST-70-000007
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Security Token Service log files must only be modifiable by privileged users. GROUP ID: V-256751 RULE ID:
    SV-256751r889223'
  rationale: 'Log data is essential in the investigation of events. The accuracy of the information is always pertinent. One
    of the first steps an attacker will undertake is the modification or deletion of log records to cover tracks and prolong
    discovery. The web server must protect the log data from unauthorized modification. Security Token Service restricts all
    modification of log files by default, but this configuration must be verified. Satisfies: SRG-APP-000119-WSR-000069, SRG-APP-000120-WSR-000070'
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'At the command prompt, run the following command:

    # find /storage/log/vmware/sso/ -xdev -type f -a ''('' -perm -o+w -o -not -user

    root -o -not -group root '')'' -exec ls -ld {} \;

    If any files are returned, this is a finding.'
  remediation: 'At the command prompt, run the following commands:

    # chmod o-w <file>

    # chown root:root <file>

    Note: Substitute <file> with the listed file.'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # find /storage/log/vmware/sso/ -xdev -type f -a ''('' -perm -o+w -o -not -user

      root -o -not -group root '')'' -exec ls -ld {} \;

      If any files are returned, this is a finding.'
    severity: medium
- id: '1.8'
  title: VCST-70-000008
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service application files must be verified for their integrity. GROUP ID: V-256752 RULE
    ID: SV-256752r889226'
  rationale: 'Verifying the Security Token Service application code is unchanged from its shipping state is essential for
    file validation and nonrepudiation of the Security Token Service. There is no reason the MD5 hash of the RPM original
    files should be changed after installation, excluding configuration files. Satisfies: SRG-APP-000131-WSR-000051, SRG-APP-000357-WSR-000150'
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'At the command prompt, run the following command:

    "\.properties|\.xml|\.conf"

    If there is any output, this is a finding.'
  remediation: 'Reinstall the vCenter Server Appliance (VCSA) or roll back to a backup.

    VMware does not support modifying the Security Token Service installation files

    manually.'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      "\.properties|\.xml|\.conf"

      If there is any output, this is a finding.'
    severity: medium
- id: '1.9'
  title: VCST-70-000009
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must only run one webapp. GROUP ID: V-256753 RULE ID: SV-256753r889229'
  rationale: 'VMware ships the Security Token Service on the vCenter Server Appliance (VCSA) with one webapp, in "ROOT.war".
    Any other ".war" file is potentially malicious and must be removed. Satisfies: SRG-APP-000131-WSR-000073, SRG-APP-000141-WSR-000075'
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'At the command prompt, run the following command:

    # ls /usr/lib/vmware-sso/vmware-sts/webapps/*.war

    Expected result:

    /usr/lib/vmware-sso/vmware-sts/webapps/ROOT.war

    If the result of this command does not match the expected result, this is a finding.'
  remediation: 'For each unexpected file returned in the check, run the following command:

    # rm /usr/lib/vmware-sso/vmware-sts/webapps/<NAME>.war

    Restart the service with the following command:

    # vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # ls /usr/lib/vmware-sso/vmware-sts/webapps/*.war

      Expected result:

      /usr/lib/vmware-sso/vmware-sts/webapps/ROOT.war

      If the result of this command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.10'
  title: VCST-70-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must not be configured with unused realms. GROUP ID: V-256754 RULE ID: SV-256754r889232'
  rationale: The Security Token Service performs user authentication at the application level and not through Tomcat. To eliminate
    unnecessary features and ensure the Security Token Service remains in its shipping state, the lack of a "UserDatabaseRealm"
    configuration must be confirmed.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'At the command prompt, run the following command:

    # grep UserDatabaseRealm /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    If the command produces any output, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Remove the <Realm> node returned in the check.

    Restart the service with the following command:

    # vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep UserDatabaseRealm /usr/lib/vmware-sso/vmware-sts/conf/server.xml

      If the command produces any output, this is a finding.'
    severity: medium
- id: '1.11'
  title: VCST-70-000011
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must be configured to limit access to internal packages. GROUP ID: V-256755 RULE
    ID: SV-256755r889235'
  rationale: The "package.access" entry in the "catalina.properties" file implements access control at the package level.
    When properly configured, a Security Exception will be reported if an errant or malicious webapp attempts to access the
    listed internal classes directly or if a new class is defined under the protected packages. The Security Token Service
    comes preconfigured with the appropriate packages defined in "package.access", and this configuration must be maintained.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'At the command prompt, run the following command:

    # grep "package.access" /usr/lib/vmware-sso/vmwarests/conf/catalina.properties

    Expected result:

    package.access=sun.,org.apache.catalina.,org.apache.coyote.,org.apache.tomcat.,org.

    apache.jasper.

    If the output of the command does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/catalina.properties

    Ensure the "package.access" line is configured as follows:

    package.access=sun.,org.apache.catalina.,org.apache.coyote.,org.apache.tomcat.,org.

    apache.jasper.

    Restart the service with the following command:

    # vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep "package.access" /usr/lib/vmware-sso/vmwarests/conf/catalina.properties

      Expected result:

      package.access=sun.,org.apache.catalina.,org.apache.coyote.,org.apache.tomcat.,org.

      apache.jasper.

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.12'
  title: VCST-70-000012
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must have Multipurpose Internet Mail Extensions (MIME) that invoke operating system
    shell programs disabled. GROUP ID: V-256756 RULE ID: SV-256756r889238'
  rationale: MIME mappings tell the Security Token Service what type of program various file types and extensions are and
    what external utilities or programs are needed to execute the file type. By ensuring various shell script MIME types are
    not included in "web.xml", the server is protected against malicious users tricking the server into executing shell command
    files.
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'At the command prompt, run the following command:

    # grep -En ''(x-csh<)|(x-sh<)|(x-shar<)|(x-ksh<)'' /usr/lib/vmware-sso/vmwarests/conf/web.xml

    If the command produces any output, this is a finding.'
  remediation: "Navigate to and open:\n/usr/lib/vmware-sso/vmware-sts/conf/web.xml\nRemove all of the following nodes lines:\n\
    <mime-type>application/x-csh</mime-type>\n<mime-type>application/x-shar</mime-type>\n<mime-type>application/x-sh</mime-type>\n\
    <mime-type>application/x-ksh</mime-type>\nRestart the service with the following command:\n# vmon-cli --restart sts\n\
    Note: Delete the entire mime-mapping node for the target mime-type.\nExample:\n<mime-mapping>\n <extension>sh</extension>\n\
    \ <mime-type>application/x-sh</mime-type>\n</mime-mapping>"
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep -En ''(x-csh<)|(x-sh<)|(x-shar<)|(x-ksh<)'' /usr/lib/vmware-sso/vmwarests/conf/web.xml

      If the command produces any output, this is a finding.'
    severity: medium
- id: '1.13'
  title: VCST-70-000013
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must have mappings set for Java servlet pages. GROUP ID: V-256757 RULE ID: SV-256757r889241'
  rationale: Resource mapping is the process of tying a particular file type to a process in the web server that can serve
    that type of file to a requesting client and identify which file types are not to be delivered to a client. By not specifying
    which files can and cannot be served to a user, the web server could deliver to a user web server configuration files,
    log files, password files, etc. As Tomcat is a Java-based web server, the main file extension used is *.jsp. This check
    ensures the *.jsp and *.jspx file types have been properly mapped to servlets.
  impact: ''
  references: []
  page_start: 34
  audit_raw: "At the command prompt, run the following command:\n# xmllint --format /usr/lib/vmware-sso/vmware-sts/conf/web.xml\
    \ | sed '2\ns/xmlns=\".*\"//g' | xmllint --xpath '/web-app/servlet-mapping/servletname[text()=\"jsp\"]/parent::servlet-mapping'\
    \ -\nExpected result:\n<servlet-mapping>\n <servlet-name>jsp</servlet-name>\n <url-pattern>*.jsp</url-pattern>\n <url-pattern>*.jspx</url-pattern>\n\
    </servlet-mapping>\nIf the output of the command does not match the expected result, this is a finding."
  remediation: "Navigate to and open:\n/usr/lib/vmware-sso/vmware-sts/conf/web.xml\nInside the <web-app> parent node, add\
