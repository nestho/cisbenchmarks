- id: '1.24'
  title: VCST-70-000024
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must be configured to not show error reports. GROUP ID: V-256768 RULE ID: SV-256768r889274'
  rationale: Web servers will often display error messages to client users, displaying enough information to aid in the debugging
    of the error. The information given back in error messages may display the web server type, version, patches installed,
    plug-ins and modules installed, type of code being used by the hosted application, and any backends being used for data
    storage. This information could be used by an attacker to blueprint what type of attacks might be successful. Therefore,
    the Security Token Service must be configured to not show server version information in error messages.
  impact: ''
  references: []
