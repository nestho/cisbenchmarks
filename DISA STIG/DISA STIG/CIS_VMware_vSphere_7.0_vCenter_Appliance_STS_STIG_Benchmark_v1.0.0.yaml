    severity: medium
- id: '1.26'
  title: VCST-70-000026
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Security Token Service must have the debug option disabled. GROUP ID: V-256770 RULE ID: SV-256770r918976'
  rationale: Information needed by an attacker to begin looking for possible vulnerabilities in a web server includes any
    information about the web server and plug-ins or modules being used. When debugging or trace information is enabled in
    a production web server, information about the web server, such as web server type, version, patches installed, plug-ins
    and modules installed, type of code being used by the hosted application, and any backends being used for data storage
    may be displayed. Because this information may be placed in logs and general messages during normal operation of the web
    server, an attacker does not need to cause an error condition to gain this information. The Security Token Service can
    be configured to set the debugging level. By setting the debugging level to zero, no debugging information will be provided
    to a malicious user.
