  description: 'Windows Server 2022 must have the Server Message Block (SMB) v1 protocol disabled on the SMB server. GROUP
    ID: V-254276 RULE ID: SV-254276r958478'
  rationale: SMBv1 is a legacy protocol that uses the MD5 algorithm as part of SMB. MD5 is known to be vulnerable to a number
