- id: '1.190'
  title: WN22-DC-000430
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  description: 'The password for the krbtgt account on a domain must be reset at least every 180 days. GROUP ID: V-254427
    RULE ID: SV-254427r991589'
  rationale: The krbtgt account acts as a service account for the Kerberos Key Distribution Center (KDC) service. The account
    and password are created when a domain is created and the password is typically not changed. If the krbtgt account is
    compromised, attackers can create valid Kerberos Ticket Granting Tickets (TGT). The password must be changed twice to
    effectively remove the password history. Changing once, waiting for replication to complete and the amount of time equal
    to or greater than the maximum Kerberos ticket lifetime, and changing again reduces the risk of issues.
  impact: ''
  references: []
  page_start: 424
  audit_raw: 'This requirement is applicable to domain controllers; it is NA for other systems.

    Open "Windows PowerShell".

    Enter

    "Get-ADUser krbtgt -Property PasswordLastSet"

    If the "PasswordLastSet" date is more than 180 days old, this is a finding.'
  remediation: 'Reset the password for the krbtgt account a least every 180 days. The password must

    be changed twice to effectively remove the password history. Changing once, waiting

    for replication to complete and changing again reduces the risk of issues. Changing

    twice in rapid succession forces clients to re-authenticate (including application

    services) but is desired if a compromise is suspected.

    PowerShell scripts are available to accomplish this such as at the following link:

    https://gallery.technet.microsoft.com/Reset-the-krbtgt-account-581a9e51

    Open "Active Directory Users and Computers" (available from various menus or run

    "dsa.msc").

    Select "Advanced Features" in the "View" menu if not previously selected.

    Select the "Users" node.

    Right-click on the krbtgt account and select "Reset password".

    Enter a password that meets password complexity requirements.

    Clear the "User must change password at next logon" check box.

    The system will automatically change this to a system-generated complex password.'
  checks:
  - type: manual_review
    info: 'This requirement is applicable to domain controllers; it is NA for other systems.

      Open "Windows PowerShell".

      Enter

      "Get-ADUser krbtgt -Property PasswordLastSet"

      If the "PasswordLastSet" date is more than 180 days old, this is a finding.'
    severity: medium
- id: '1.191'
  title: WN22-MS-000010
  scoring: manual
  profile:
  - 'MS SEVERITY: CAT I'
  description: 'Windows Server 2022 must only allow administrators responsible for the member server or standalone or nondomain-joined
    system to have Administrator rights on the system. GROUP ID: V-254428 RULE ID: SV-254428r958726'
  rationale: An account that does not have Administrator duties must not have Administrator rights. Such rights would allow
    the account to bypass or modify required security restrictions on that machine and make it vulnerable to attack. System
    administrators must log on to systems using only accounts with the minimum level of authority necessary. For domain-joined
    member servers, the Domain Admins group must be replaced by a domain member server administrator group (see V-243468 in
    the Active Directory Domain STIG). Restricting highly privileged accounts from the local Administrators group helps mitigate
    the risk of privilege escalation resulting from credential theft attacks. Standard user accounts must not be members of
    the built-in Administrators group.
  impact: ''
  references: []
  page_start: 426
  audit_raw: 'This applies to member servers and standalone or nondomain-joined systems. A

    separate version applies to domain controllers.

    Open "Computer Management".

    Navigate to "Groups" under "Local Users and Groups".

    Review the local "Administrators" group.

    Only administrator groups or accounts responsible for administration of the system may

    be members of the group.

    For domain-joined member servers, the Domain Admins group must be replaced by a

    domain member server administrator group.

    Standard user accounts must not be members of the local Administrator group.

    If accounts that do not have responsibility for administration of the system are members

    of the local Administrators group, this is a finding.

    If the built-in Administrator account or other required administrative accounts are found

    on the system, this is not a finding.'
  remediation: 'Configure the local "Administrators" group to include only administrator groups or

    accounts responsible for administration of the system.

    For domain-joined member servers, replace the Domain Admins group with a domain

    member server administrator group.

    Remove any standard user accounts.'
  checks:
  - type: manual_review
    info: 'This applies to member servers and standalone or nondomain-joined systems. A

