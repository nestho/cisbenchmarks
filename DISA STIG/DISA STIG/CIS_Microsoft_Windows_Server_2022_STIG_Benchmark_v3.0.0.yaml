  description: 'Windows Server 2022 password history must be configured to 24 passwords remembered. GROUP ID: V-254288 RULE
    ID: SV-254288r1000156'
  rationale: A system is more vulnerable to unauthorized access when system users recycle the same password several times
    without being required to change to a unique password on a regularly scheduled basis. This enables users to effectively
    negate the purpose of mandating periodic password changes. The default value is "24" for Windows domain systems. DOD has
    decided this is the appropriate value for all Windows systems.
  impact: ''
  references:
