- id: '1.208'
  title: WN22-SO-000010
  scoring: scored
  profile:
  - 'MS SEVERITY: CAT II'
  - 'DC SEVERITY: CAT II'
  description: 'Windows Server 2022 must have the built-in guest account disabled. GROUP ID: V-254445 RULE ID: SV-254445r958504'
  rationale: A system faces an increased vulnerability threat if the built-in guest account is not disabled. This is a known
    account that exists on all Windows systems and cannot be deleted. This account is initialized during the installation
    of the operating system with no password assigned.
  impact: ''
  references:
  - '1. CIS Recommendation: Accounts: Guest account status'
  - '2. GRID: MS-00000054'
  page_start: 471
  audit_raw: 'Verify the effective setting in Local Group Policy Editor.

    Run "gpedit.msc".

    Navigate to

    Local Computer Policy >> Computer Configuration >> Windows Settings >>

    Security Settings >> Local Policies >> Security Options

    If the value for "Accounts: Guest account status" is not set to "Disabled", this is a

    finding.

    For server core installations, run the following command:

    Secedit /Export /Areas SecurityPolicy /CFG C:\Path\FileName.Txt

    If "EnableGuestAccount" equals "1" in the file, this is a finding.'
  remediation: 'Configure the policy value for

    Computer Configuration >> Windows Settings >> Security Settings >> Local

    Policies >> Security Options >> Accounts: Guest account status to "Disabled"

    ```.'
  checks:
  - type: manual_review
    info: 'Verify the effective setting in Local Group Policy Editor.

      Run "gpedit.msc".

      Navigate to

      Local Computer Policy >> Computer Configuration >> Windows Settings >>

      Security Settings >> Local Policies >> Security Options

