- id: '1.30'
  title: WN22-00-000300
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: 'Windows Server 2022 must automatically remove or disable temporary user accounts after 72 hours. GROUP ID:
    V-254267 RULE ID: SV-254267r958364'
  rationale: If temporary user accounts remain active when no longer needed or for an excessive period, these accounts may
    be used to gain unauthorized access. To mitigate this risk, automated termination of all temporary accounts must be set
    upon account creation. Temporary accounts are established as part of normal account activation procedures when there is
    a need for short-term accounts without the demand for immediacy in account activation. If temporary accounts are used,
    the operating system must be configured to automatically terminate these types of accounts after a DoD-defined time period
    of 72 hours. To address access requirements, many operating systems may be integrated with enterprise-level authentication/access
    mechanisms that meet or exceed access control policy requirements.
  impact: ''
  references: []
  page_start: 74
  audit_raw: 'Review temporary user accounts for expiration dates.

    Determine if temporary user accounts are used and identify any that exist. If none exist,

    this is NA.

    Domain Controllers:

    Open "PowerShell".

    Enter

    "Search-ADAccount -AccountExpiring | FT Name, AccountExpirationDate"

    If "AccountExpirationDate" has not been defined within 72 hours for any temporary user

    account, this is a finding.

    Member servers and standalone or nondomain-joined systems:

    Open "Command Prompt".

    Run

    "Net user [username]"

    ``` where [username] is the name of the temporary user account.

    If "Account expires" has not been defined within 72 hours for any temporary

    user account, this is a finding.'
  remediation: 'Configure temporary user accounts to automatically expire within 72 hours.

    Domain accounts can be configured with an account expiration date, under "Account"

    properties.

    Local accounts can be configured to expire with the command "Net user [username]

    /expires:[mm/dd/yyyy]", where [username] is the name of the temporary user account.

    Delete any temporary user accounts that are no longer necessary.'
  checks:
  - type: manual_review
    info: 'Review temporary user accounts for expiration dates.

      Determine if temporary user accounts are used and identify any that exist. If none exist,

      this is NA.

      Domain Controllers:

      Open "PowerShell".

      Enter

      "Search-ADAccount -AccountExpiring | FT Name, AccountExpirationDate"

      If "AccountExpirationDate" has not been defined within 72 hours for any temporary user

      account, this is a finding.

      Member servers and standalone or nondomain-joined systems:

      Open "Command Prompt".

      Run

      "Net user [username]"

      ``` wher'
    severity: medium
- id: '1.31'
  title: WN22-00-000310
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: 'Windows Server 2022 must automatically remove or disable emergency accounts after the crisis is resolved or
    within 72 hours. GROUP ID: V-254268 RULE ID: SV-254268r958508'
  rationale: Emergency administrator accounts are privileged accounts established in response to crisis situations where the
    need for rapid account activation is required. Therefore, emergency account activation may bypass normal account authorization
    processes. If these accounts are automatically disabled, system maintenance during emergencies may not be possible, thus
    adversely affecting system availability. Emergency administrator accounts are different from infrequently used accounts
    (i.e., local logon accounts used by system administrators when network or normal logon/access is not available). Infrequently
    used accounts are not subject to automatic termination dates. Emergency accounts are accounts created in response to crisis
    situations, usually for use by maintenance personnel. The automatic expiration or disabling time period may be extended
    as needed until the crisis is resolved; however, it must not be extended indefinitely. A permanent account must be established
    for privileged users who need long-term maintenance accounts. To address access requirements, many operating systems can
    be integrated with enterprise-level authentication/access mechanisms that meet or exceed access control policy requirements.
  impact: ''
  references: []
  page_start: 76
  audit_raw: 'Determine if emergency administrator accounts are used and identify any that exist. If

    none exist, this is NA.

    If emergency administrator accounts cannot be configured with an expiration date due

    to an ongoing crisis, the accounts must be disabled or removed when the crisis is

    resolved.

    If emergency administrator accounts have not been configured with an expiration date

    or have not been disabled or removed following the resolution of a crisis, this is a

    finding.

    Domain Controllers:

    Open "PowerShell".

    Enter

    "Search-ADAccount -AccountExpiring | FT Name, AccountExpirationDate"

    If "AccountExpirationDate" has been defined and is not within 72 hours for an

    emergency administrator account, this is a finding.

    Member servers and standalone or nondomain-joined systems:

    Open "Command Prompt".

    Run

    "Net user [username]"

    where [username] is the name of the emergency account.

    If "Account expires" has been defined and is not within 72 hours for an emergency

    administrator account, this is a finding.'
  remediation: 'Remove emergency administrator accounts after a crisis has been resolved or configure

    the accounts to automatically expire within 72 hours.

    Domain accounts can be configured with an account expiration date, under "Account"

    properties.

    Local accounts can be configured to expire with the command "Net user [username]

    /expires:[mm/dd/yyyy]", where [username] is the name of the temporary user account.'
  checks:
  - type: manual_review
    info: 'Determine if emergency administrator accounts are used and identify any that exist. If

      none exist, this is NA.

      If emergency administrator accounts cannot be configured with an expiration date due

      to an ongoing crisis, the accounts must be disabled or removed when the crisis is

      resolved.

      If emergency administrator accounts have not been configured with an expiration date

      or have not been disabled or removed following the resolution of a crisis, this is a

      finding.

      Domain Controllers:

      Open "PowerSh'
    severity: medium
