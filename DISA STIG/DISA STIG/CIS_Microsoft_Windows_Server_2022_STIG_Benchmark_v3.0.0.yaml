controls:
- id: '1.1'
  title: WN22-00-000010
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: 'Windows Server 2022 users with Administrative privileges must have separate accounts for administrative duties
    and normal operational tasks. GROUP ID: V-254238 RULE ID: SV-254238r991589'
  rationale: Using a privileged account to perform routine functions makes the computer vulnerable to malicious software inadvertently
    introduced during a session that has been granted full privileges.
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Verify each user with administrative privileges has been assigned a unique

    administrative account separate from their standard user account.

    If users with administrative privileges do not have separate accounts for administrative

    functions and standard user functions, this is a finding.'
  remediation: 'Ensure each user with administrative privileges has a separate account for user duties

    and one for privileged duties.'
  checks:
  - type: manual_review
    info: 'Verify each user with administrative privileges has been assigned a unique

      administrative account separate from their standard user account.

      If users with administrative privileges do not have separate accounts for administrative

      functions and standard user functions, this is a finding.'
    severity: medium
- id: '1.2'
  title: WN22-00-000020
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: 'Windows Server 2022 passwords for the built-in Administrator account must be changed at least every 60 days.
    GROUP ID: V-254239 RULE ID: SV-254239r1081067'
  rationale: The longer a password is in use, the greater the opportunity for someone to gain unauthorized knowledge of the
    password. The built-in Administrator account is not generally used and its password may not be changed as frequently as
    necessary. Changing the password for the built-in Administrator account on a regular basis will limit its exposure. Windows
    LAPS must be used to change the built-in Administrator account password.
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'If there are no enabled local Administrator accounts, this is not applicable.

    Review the password last set date for the enabled local Administrator account.

    On the stand alone or domain-joined workstation:

    Open "PowerShell".

    Enter

    "Get-LocalUser -Name * | Select-Object *"

    If the "PasswordLastSet" date is greater than "60" days old for the local Administrator

    account for administering the computer/domain, this is a finding.

    Verify LAPS is configured and operational.

    Navigate to

    Local Computer Policy >> Computer Configuration >> Administrative Templates

    >> System >> LAPS >> Password Settings

    >> Set to enabled. Password Complexity, large letters + small letters + numbers +

    special, Password Length 14, Password Age 60. If not configured as shown, this is a

    finding.

    Verify LAPS Operational logs >> Event Viewer >> Applications and Services Logs >>

    Microsoft >> Windows >> LAPS >> Operational. Verify LAPS policy process is

    completing. If it is not, this is a finding.

    If the server is not a member of a domain this not applicable.'
  remediation: 'Change the enabled local Administrator account password at least every 60 days.

    Windows LAPS must be used to change the built-in Administrator account password.

    Domain-joined systems can configure this to occur more frequently. LAPS will change

    the password every 30 days by default.

    More information is available at:

    https://techcommunity.microsoft.com/t5/windows-it-pro-blog/by-popular-demandwindows-laps-available-now/ba-p/3788747

    https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-overview#windowslaps-supported-platforms-and-azure-ad-laps-preview-status'
  checks:
  - type: manual_review
    info: 'If there are no enabled local Administrator accounts, this is not applicable.

      Review the password last set date for the enabled local Administrator account.

      On the stand alone or domain-joined workstation:

      Open "PowerShell".

      Enter

      "Get-LocalUser -Name * | Select-Object *"

      If the "PasswordLastSet" date is greater than "60" days old for the local Administrator

      account for administering the computer/domain, this is a finding.

      Verify LAPS is configured and operational.

      Navigate to

      Local Computer Pol'
    severity: medium
- id: '1.3'
  title: WN22-00-000030
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT I'
  - 'MS SEVERITY: CAT I'
  description: 'Windows Server 2022 administrative accounts must not be used with applications that access the internet, such
    as web browsers, or with potential internet sources, such as email. GROUP ID: V-254240 RULE ID: SV-254240r991589'
  rationale: 'Using applications that access the internet or have potential internet sources using administrative privileges
    exposes a system to compromise. If a flaw in an application is exploited while running as a privileged user, the entire
    system could be compromised. Web browsers and email are common attack vectors for introducing malicious code and must
    not be run with an administrative account. Since administrative accounts may generally change or work around technical
    restrictions for running a web browser or other applications, it is essential that policy require administrative accounts
    to not access the internet or use applications such as email. The policy must define specific exceptions for local service
    administration. These exceptions may include HTTP(S)-based tools that are used for the administration of the local system,
    services, or attached devices. Whitelisting can be used to enforce the policy to ensure compliance. Satisfies: SRG-OS-000480-GPOS-00227,
    SRG-OS-000205-GPOS-00083'
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'Determine whether organization policy, at a minimum, prohibits administrative accounts

    from using applications that access the internet, such as web browsers, or with potential

    internet sources, such as email, except as necessary for local service administration.

    If it does not, this is a finding.

    The organization may use technical means such as whitelisting to prevent the use of

    browsers and mail applications to enforce this requirement.'
  remediation: 'Establish a policy, at minimum, to prohibit administrative accounts from using

    applications that access the internet, such as web browsers, or with potential internet

    sources, such as email. Ensure the policy is enforced.

    The organization may use technical means such as whitelisting to prevent the use of

    browsers and mail applications to enforce this requirement.'
  checks:
  - type: manual_review
    info: 'Determine whether organization policy, at a minimum, prohibits administrative accounts

      from using applications that access the internet, such as web browsers, or with potential

      internet sources, such as email, except as necessary for local service administration.

      If it does not, this is a finding.

      The organization may use technical means such as whitelisting to prevent the use of

      browsers and mail applications to enforce this requirement.'
    severity: medium
- id: '1.4'
  title: WN22-00-000040
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: 'Windows Server 2022 members of the Backup Operators group must have separate accounts for backup duties and
    normal operational tasks. GROUP ID: V-254241 RULE ID: SV-254241r991589'
  rationale: Backup Operators are able to read and write to any file in the system, regardless of the rights assigned to it.
    Backup and restore rights permit users to circumvent the file access restrictions present on NTFS disk drives for backup
    and restore purposes. Members of the Backup Operators group must have separate logon accounts for performing backup duties.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'If no accounts are members of the Backup Operators group, this is NA.

    Verify users with accounts in the Backup Operators group have a separate user account

    for backup functions and for performing normal user tasks.

    If users with accounts in the Backup Operators group do not have separate accounts for

    backup functions and standard user functions, this is a finding.'
  remediation: 'Ensure each member of the Backup Operators group has separate accounts for backup

    functions and standard user functions.'
  checks:
  - type: manual_review
    info: 'If no accounts are members of the Backup Operators group, this is NA.

      Verify users with accounts in the Backup Operators group have a separate user account

      for backup functions and for performing normal user tasks.

      If users with accounts in the Backup Operators group do not have separate accounts for

      backup functions and standard user functions, this is a finding.'
    severity: medium
- id: '1.5'
  title: WN22-00-000050
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: 'Windows Server 2022 manually managed application account passwords must be at least 14 characters in length.
    GROUP ID: V-254242 RULE ID: SV-254242r1051087'
  rationale: Application/service account passwords must be of sufficient length to prevent being easily cracked. Application/service
    accounts that are manually managed must have passwords at least 14 characters in length.
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'Determine if manually managed application/service accounts exist. If none exist, this is

    NA.

    Verify the organization has a policy to ensure passwords for manually managed

    application/service accounts are at least 14 characters in length.

    If such a policy does not exist or has not been implemented, this is a finding.'
  remediation: 'Establish a policy that requires application/service account passwords that are manually

    managed to be at least 14 characters in length. Ensure the policy is enforced.'
  checks:
  - type: manual_review
    info: 'Determine if manually managed application/service accounts exist. If none exist, this is

      NA.

      Verify the organization has a policy to ensure passwords for manually managed

      application/service accounts are at least 14 characters in length.

      If such a policy does not exist or has not been implemented, this is a finding.'
    severity: medium
- id: '1.6'
  title: WN22-00-000060
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: 'Windows Server 2022 manually managed application account passwords must be changed at least annually or when
    a system administrator with knowledge of the password leaves the organization. GROUP ID: V-254243 RULE ID: SV-254243r991589'
  rationale: Setting application account passwords to expire may cause applications to stop functioning. However, not changing
    them on a regular basis exposes them to attack. If managed service accounts are used, this alleviates the need to manually
    change application account passwords.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'Determine if manually managed application/service accounts exist. If none exist, this is

    NA.

    If passwords for manually managed application/service accounts are not changed at

    least annually or when an administrator with knowledge of the password leaves the

    organization, this is a finding.

    Identify manually managed application/service accounts.

    To determine the date a password was last changed:

    Domain controllers:

    Open "PowerShell".

    Enter

    "Get-AdUser -Identity [application account name] -Properties PasswordLastSet

    | FT Name, PasswordLastSet"

    where [application account name] is the name of the manually managed

    application/service account.

    If the "PasswordLastSet" date is more than one year old, this is a finding.

    Member servers and standalone or nondomain-joined systems:

    Open "Command Prompt".

    Enter

    ''Net User [application account name] | Find /i "Password Last Set"

    where [application account name] is the name of the manually managed

    application/service account.

    If the "Password Last Set" date is more than one year old, this is a finding.'
  remediation: 'Change passwords for manually managed application/service accounts at least

    annually or when an administrator with knowledge of the password leaves the

    organization.

    It is recommended that system-managed service accounts be used whenever possible.'
  checks:
  - type: manual_review
    info: 'Determine if manually managed application/service accounts exist. If none exist, this is

      NA.

      If passwords for manually managed application/service accounts are not changed at

      least annually or when an administrator with knowledge of the password leaves the

      organization, this is a finding.

      Identify manually managed application/service accounts.

      To determine the date a password was last changed:

      Domain controllers:

      Open "PowerShell".

      Enter

      "Get-AdUser -Identity [application account name] -Properti'
    severity: medium
- id: '1.7'
  title: WN22-00-000070
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: 'Windows Server 2022 shared user accounts must not be permitted. GROUP ID: V-254244 RULE ID: SV-254244r958482'
  rationale: Shared accounts (accounts where two or more people log on with the same user identification) do not provide adequate
    identification and authentication. There is no way to provide for nonrepudiation or individual accountability for system
    access and resource usage.
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'Determine whether any shared accounts exist. If no shared accounts exist, this is NA.

    Shared accounts, such as required by an application, may be approved by the

    organization. This must be documented with the Information System Security Officer

    (ISSO). Documentation must include the reason for the account, who has access to the

    account, and how the risk of using the shared account is mitigated to include monitoring

    account activity.

    If unapproved shared accounts exist, this is a finding.'
  remediation: 'Remove unapproved shared accounts from the system.

    Document required shared accounts with the ISSO. Documentation must include the

    reason for the account, who has access to the account, and how the risk of using the

    shared account is mitigated to include monitoring account activity.'
  checks:
  - type: manual_review
    info: 'Determine whether any shared accounts exist. If no shared accounts exist, this is NA.

      Shared accounts, such as required by an application, may be approved by the

      organization. This must be documented with the Information System Security Officer

      (ISSO). Documentation must include the reason for the account, who has access to the

      account, and how the risk of using the shared account is mitigated to include monitoring

      account activity.

      If unapproved shared accounts exist, this is a finding.'
    severity: medium
- id: '1.8'
  title: WN22-00-000080
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: 'Windows Server 2022 must employ a deny-all, permit-by-exception policy to allow the execution of authorized
    software programs. GROUP ID: V-254245 RULE ID: SV-254245r958808'
  rationale: Using an allowlist provides a configuration management method to allow the execution of only authorized software.
    Using only authorized software decreases risk by limiting the number of potential vulnerabilities. The organization must
    identify authorized software programs and only permit execution of authorized software. The process used to identify software
    programs that are authorized to execute on organizational information systems is commonly referred to as allowlisting.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'Verify the operating system employs a deny-all, permit-by-exception policy to allow the

    execution of authorized software programs.

    If an application allowlisting program is not in use on the system, this is a finding.

    Configuration of allowlisting applications will vary by the program.

    AppLocker is an allowlisting application built in to Windows Server. A deny-by-default

    implementation is initiated by enabling any AppLocker rules within a category, only

    allowing what is specified by defined rules.

    If AppLocker is used, perform the following to view the configuration of AppLocker:

    Open "PowerShell".

    If the AppLocker PowerShell module has not been imported previously, execute the

    following first:

    Import-Module AppLocker

    Execute the following command, substituting [c:\temp\file.xml] with a location and file

    name appropriate for the system:

    Get-AppLockerPolicy -Effective -XML > c:\temp\file.xml

    This will produce an xml file with the effective settings that can be viewed in a browser

    or opened in a program such as Excel for review.

    Implementation guidance for AppLocker is available at the following link:

    https://docs.microsoft.com/en-us/windows/security/threat-protection/windows-defenderapplication-control/applocker/applocker-policies-deployment-guide'
  remediation: 'Configure an application allowlisting program to employ a deny-all, permit-by-exception

    policy to allow the execution of authorized software programs.

    Configuration of allowlisting applications will vary by the program. AppLocker is an

    allowlisting application built in to Windows Server.

    If AppLocker is used, it is configured through group policy in

    Computer Configuration >> Windows Settings >> Security Settings >>

    Application Control Policies >> AppLocker

    Implementation guidance for AppLocker is available at the following link:

    https://docs.microsoft.com/en-us/windows/security/threat-protection/windows-defenderapplication-control/applocker/applocker-policies-deployment-guide'
  checks:
  - type: manual_review
    info: 'Verify the operating system employs a deny-all, permit-by-exception policy to allow the

      execution of authorized software programs.

      If an application allowlisting program is not in use on the system, this is a finding.

      Configuration of allowlisting applications will vary by the program.

      AppLocker is an allowlisting application built in to Windows Server. A deny-by-default

      implementation is initiated by enabling any AppLocker rules within a category, only

      allowing what is specified by defined rule'
    severity: medium
- id: '1.9'
  title: WN22-00-000090
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: 'Windows Server 2022 domain-joined systems must have a Trusted Platform Module (TPM) enabled and ready for
    use. GROUP ID: V-254246 RULE ID: SV-254246r991589'
  rationale: Credential Guard uses virtualization-based security to protect data that could be used in credential theft attacks
    if compromised. A number of system requirements must be met in order for Credential Guard to be configured and enabled
    properly. Without a TPM enabled and ready for use, Credential Guard keys are stored in a less secure method using software.
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'For standalone or nondomain-joined systems, this is NA.

    Verify the system has a TPM and it is ready for use.

    Run "tpm.msc".

    Review the sections in the center pane.

    "Status" must indicate it has been configured with a message such as "The TPM is

    ready for use" or "The TPM is on and ownership has been taken".

    TPM Manufacturer Information - Specific Version = 2.0 or 1.2

    If a TPM is not found or is not ready for use, this is a finding.'
  remediation: 'Ensure domain-joined systems have a TPM that is configured for use. (Versions 2.0 or

    1.2 support Credential Guard.)

    The TPM must be enabled in the firmware.

    Run "tpm.msc" for configuration options in Windows.'
  checks:
  - type: manual_review
    info: 'For standalone or nondomain-joined systems, this is NA.

      Verify the system has a TPM and it is ready for use.

      Run "tpm.msc".

      Review the sections in the center pane.

      "Status" must indicate it has been configured with a message such as "The TPM is

      ready for use" or "The TPM is on and ownership has been taken".

      TPM Manufacturer Information - Specific Version = 2.0 or 1.2

      If a TPM is not found or is not ready for use, this is a finding.'
    severity: medium
- id: '1.10'
  title: WN22-00-000100
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: 'Windows Server 2022 must be maintained at a supported servicing level. GROUP ID: V-254247 RULE ID: SV-254247r991589'
  rationale: Systems at unsupported servicing levels will not receive security updates for new vulnerabilities, which leave
    them subject to exploitation. Systems must be maintained at a servicing level supported by the vendor with new security
    updates.
  impact: ''
  references: []
  page_start: 35
  audit_raw: 'Open "Command Prompt".

    Enter "winver.exe".

    If the "About Windows" dialog box does not display "Microsoft Windows Server Version

    21H1 (Build 20348.xxx)" or greater, this is a finding.

    Preview versions must not be used in a production environment.'
  remediation: Update the system to a Version 21H2 (Build 20348.xxx) or greater.
  checks:
  - type: manual_review
    info: 'Open "Command Prompt".

      Enter "winver.exe".

      If the "About Windows" dialog box does not display "Microsoft Windows Server Version

      21H1 (Build 20348.xxx)" or greater, this is a finding.

      Preview versions must not be used in a production environment.'
    severity: medium
- id: '1.11'
  title: WN22-00-000110
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: 'Windows Server 2022 must use an antivirus program. GROUP ID: V-254248 RULE ID: SV-254248r991589'
  rationale: Malicious software can establish a base on individual desktops and servers. Employing an automated mechanism
    to detect this type of software will aid in elimination of the software from the operating system.
  impact: ''
  references: []
  page_start: 36
  audit_raw: 'Verify an antivirus solution is installed on the system. The antivirus solution may be

    bundled with an approved host-based security solution.

    If there is no antivirus solution installed on the system, this is a finding.

    Verify if Microsoft Defender antivirus is in use or enabled:

    Open "PowerShell".

    Enter

    "get-service | where {$_.DisplayName -Like "*Defender*"} | Select

    Status,DisplayName"

    Verify if third-party antivirus is in use or enabled:

    Open "PowerShell".

    Enter

    "get-service | where {$_.DisplayName -Like "*mcafee*"} | Select

    Status,DisplayName

    Enter

    "get-service | where {$_.DisplayName -Like "*symantec*"} | Select

    Status,DisplayName'
  remediation: 'If no antivirus software is in use, install Microsoft Defender or third-party antivirus.

    Open "PowerShell".

    Enter

    "Install-WindowsFeature -Name Windows-Defender"

    For third-party antivirus, install per antivirus instructions and disable Windows Defender.

    Open "PowerShell".

    Enter

    "Uninstall-WindowsFeature -Name Windows-Defender"'
  checks:
  - type: manual_review
    info: 'Verify an antivirus solution is installed on the system. The antivirus solution may be

      bundled with an approved host-based security solution.

      If there is no antivirus solution installed on the system, this is a finding.

      Verify if Microsoft Defender antivirus is in use or enabled:

      Open "PowerShell".

      Enter

      "get-service | where {$_.DisplayName -Like "*Defender*"} | Select

      Status,DisplayName"

      Verify if third-party antivirus is in use or enabled:

      Open "PowerShell".

      Enter

      "get-service | where {$_.Disp'
    severity: medium
- id: '1.12'
  title: WN22-00-000120
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: 'Windows Server 2022 must have a host-based intrusion detection or prevention system. GROUP ID: V-254249 RULE
    ID: SV-254249r991589'
  rationale: A properly configured Host-based Intrusion Detection System (HIDS) or Host-based Intrusion Prevention System
    (HIPS) provides another level of defense against unauthorized access to critical servers. With proper configuration and
    logging enabled, such a system can stop and/or alert for many attempts to gain unauthorized access to resources.
  impact: ''
  references: []
  page_start: 38
  audit_raw: 'Determine whether there is a HIDS or HIPS on each server.

    If the HIPS component of ESS is installed and active on the host and the alerts of

    blocked activity are being logged and monitored, this meets the requirement.

    A HIDS device is not required on a system that has the role as the Network Intrusion

    Device (NID). However, this exception needs to be documented with the Information

    System Security Officer (ISSO).

    If a HIDS is not installed on the system, this is a finding.'
  remediation: Install a HIDS or HIPS on each server.
  checks:
  - type: manual_review
    info: 'Determine whether there is a HIDS or HIPS on each server.

      If the HIPS component of ESS is installed and active on the host and the alerts of

      blocked activity are being logged and monitored, this meets the requirement.

      A HIDS device is not required on a system that has the role as the Network Intrusion

      Device (NID). However, this exception needs to be documented with the Information

      System Security Officer (ISSO).

      If a HIDS is not installed on the system, this is a finding.'
    severity: medium
- id: '1.13'
  title: WN22-00-000130
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT I'
  - 'MS SEVERITY: CAT I'
  description: 'Windows Server 2022 local volumes must use a format that supports NTFS attributes. GROUP ID: V-254250 RULE
    ID: SV-254250r1081070'
  rationale: The ability to set access permissions and auditing is critical to maintaining the security and proper access
    controls of a system. To support this, volumes must be formatted using a file system that supports NTFS attributes.
  impact: ''
  references: []
  page_start: 39
  audit_raw: 'Open "Computer Management".

    Select "Disk Management" under "Storage".

    For each local volume, if the file system does not indicate "NTFS", this is a finding.

    "ReFS" (resilient file system) is also acceptable and is not a finding.

    CSV ( Cluster Shared Volumes) is not a finding.

    This does not apply to system partitions such the Recovery and EFI System Partition.'
  remediation: Format volumes to use NTFS, ReFS, or CSVFS.
  checks:
  - type: manual_review
    info: 'Open "Computer Management".

      Select "Disk Management" under "Storage".

      For each local volume, if the file system does not indicate "NTFS", this is a finding.

      "ReFS" (resilient file system) is also acceptable and is not a finding.

      CSV ( Cluster Shared Volumes) is not a finding.

      This does not apply to system partitions such the Recovery and EFI System Partition.'
    severity: medium
- id: '1.14'
  title: WN22-00-000140
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: 'Windows Server 2022 permissions for the system drive root directory (usually C:) must conform to minimum requirements.
    GROUP ID: V-254251 RULE ID: SV-254251r958702'
  rationale: 'Changing the system''s file and directory permissions allows the possibility of unauthorized and anonymous modification
    to the operating system and installed applications. The default permissions are adequate when the Security Option "Network
    access: Let Everyone permissions apply to anonymous users" is set to "Disabled" (WN22-SO000240). Satisfies: SRG-OS-000312-GPOS-00122,
    SRG-OS-000312-GPOS-00123, SRG-OS000312-GPOS-00124'
  impact: ''
  references: []
  page_start: 40
  audit_raw: 'The default permissions are adequate when the Security Option "Network access: Let

    Everyone permissions apply to anonymous users" is set to "Disabled" (WN22-SO000240).

    Review the permissions for the system drive''s root directory (usually C:). Nonprivileged

    groups such as Users or Authenticated Users must not have greater than "Read &

    execute" permissions except where noted as defaults. Individual accounts must not be

    used to assign permissions.

    If permissions are not as restrictive as the default permissions listed below, this is a

    finding.

    Viewing in File Explorer:

    View the Properties of the system drive''s root directory.

    Select the "Security" tab, and the "Advanced" button.

    Default permissions:

    C:

    Type - "Allow" for all

    Inherited from - "None" for all

    Principal - Access - Applies to

    • SYSTEM - Full control - This folder, subfolders, and files

    • Administrators - Full control - This folder, subfolders, and files

    • Users - Read & execute - This folder, subfolders, and files

    • Users - Create folders/append data - This folder and subfolders

    • Users - Create files/write data - Subfolders only

    • CREATOR OWNER - Full Control - Subfolders and files only

    Alternately, use icacls:

    Open "Command Prompt (Admin)".

    Enter "icacls" followed by the directory:

    "icacls c:"

    The following results must be displayed:

    c:

