  rationale: Windows shares are a means by which files, folders, printers, and other resources can be published for network
    users to access. Improper configuration can permit access to devices and data beyond a user's need.
  impact: ''
  references: []
  page_start: 53
  audit_raw: 'Open "Printers & scanners" in "Settings".

    If there are no printers configured, this is NA. (Exclude Microsoft Print to PDF and

    Microsoft XPS Document Writer, which do not support sharing.)

    For each printer:

    Select the printer and "Manage".

    Select "Printer Properties".

    Select the "Sharing" tab.

    If "Share this printer" is checked, select the "Security" tab.

    If any standard user accounts or groups have permissions other than "Print", this is a

    finding.

    The default is for the "Everyone" group to be given "Print" permission.

    "All APPLICATION PACKAGES" and "CREATOR OWNER" are not standard user

    accounts.'
  remediation: 'Configure the permissions on shared printers to restrict standard users to only have

    Print permissions.'
