- id: '1.24'
  title: WN22-00-000240
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: 'Windows Server 2022 must have software certificate installation files removed. GROUP ID: V-254261 RULE ID:
    SV-254261r991589'
  rationale: Use of software certificates and their accompanying installation files for end users to access resources is less
    secure than the use of hardware-based certificates.
  impact: ''
  references: []
  page_start: 65
  audit_raw: 'Search all drives for *.p12 and *.pfx files.

    If any files with these extensions exist, this is a finding.

    This does not apply to server-based applications that have a requirement for .p12

    certificate files or Adobe PreFlight certificate files. Some applications create files with

    extensions of .p12 that are not certificate installation files. Removal of noncertificate

    installation files from systems is not required. These must be documented with the

    Information System Security Officer (ISSO).'
  remediation: 'Remove any certificate installation files (*.p12 and *.pfx) found on a system.

    Note: This does not apply to server-based applications that have a requirement for .p12

    certificate files or Adobe PreFlight certificate files.'
  checks:
  - type: manual_review
    info: 'Search all drives for *.p12 and *.pfx files.

      If any files with these extensions exist, this is a finding.

      This does not apply to server-based applications that have a requirement for .p12

      certificate files or Adobe PreFlight certificate files. Some applications create files with

      extensions of .p12 that are not certificate installation files. Removal of noncertificate

      installation files from systems is not required. These must be documented with the

      Information System Security Officer (ISSO).'
    severity: medium
- id: '1.25'
  title: WN22-00-000250
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT I'
  - 'MS SEVERITY: CAT I'
  description: 'Windows Server 2022 systems requiring data at rest protections must employ cryptographic mechanisms to prevent
    unauthorized disclosure and modification of the information at rest. GROUP ID: V-254262 RULE ID: SV-254262r958552'
  rationale: 'This requirement addresses protection of user-generated data as well as operating system-specific configuration
    data. Organizations may choose to employ different mechanisms to achieve confidentiality and integrity protections, as
    appropriate, in accordance with the security category and/or classification of the information. Selection of a cryptographic
    mechanism is based on the need to protect the integrity of organizational information. The strength of the mechanism is
    commensurate with the security category and/or classification of the information. Organizations have the flexibility to
    either encrypt all information on storage devices (i.e., full disk encryption) or encrypt specific data structures (e.g.,
    files, records, or fields). Satisfies: SRG-OS-000185-GPOS-00079, SRG-OS-000404-GPOS-00183, SRG-OS000405-GPOS-00184'
  impact: ''
  references: []
  page_start: 66
  audit_raw: 'Verify systems that require additional protections due to factors such as inadequate

    physical protection or sensitivity of the data employ encryption to protect the

    confidentiality and integrity of all information at rest.

    If they do not, this is a finding.'
  remediation: 'Configure systems that require additional protections due to factors such as inadequate

    physical protection or sensitivity of the data to employ encryption to protect the

    confidentiality and integrity of all information at rest.'
  checks:
  - type: manual_review
    info: 'Verify systems that require additional protections due to factors such as inadequate

      physical protection or sensitivity of the data employ encryption to protect the

      confidentiality and integrity of all information at rest.

      If they do not, this is a finding.'
    severity: medium
- id: '1.26'
  title: WN22-00-000260
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: 'Windows Server 2022 must implement protection methods such as TLS, encrypted VPNs, or IPsec if the data owner
    has a strict requirement for ensuring data integrity and confidentiality is maintained at every step of the data transfer
    and handling process. GROUP ID: V-254263 RULE ID: SV-254263r958912'
  rationale: 'Information can be either unintentionally or maliciously disclosed or modified during preparation for transmission,
    for example, during aggregation, at protocol transformation points, and during packing/unpacking. These unauthorized disclosures
    or modifications compromise the confidentiality or integrity of the information. Ensuring the confidentiality of transmitted
    information requires the operating system to take measures in preparing information for transmission. This can be accomplished
    via access control and encryption. Use of this requirement will be limited to situations where the data owner has a strict
    requirement for ensuring data integrity and confidentiality is maintained at every step of the data transfer and handling
    process. When transmitting data, operating systems need to support transmission protection mechanisms such as TLS, encrypted
    VPNs, or IPsec. Satisfies: SRG-OS-000425-GPOS-00189, SRG-OS-000426-GPOS-00190'
  impact: ''
  references: []
  page_start: 68
  audit_raw: 'If the data owner has a strict requirement for ensuring data integrity and confidentiality

    is maintained at every step of the data transfer and handling process, verify protection

    methods such as TLS, encrypted VPNs, or IPsec have been implemented.

    If protection methods have not been implemented, this is a finding.'
  remediation: 'Configure protection methods such as TLS, encrypted VPNs, or IPsec when the data

    owner has a strict requirement for ensuring data integrity and confidentiality is

    maintained at every step of the data transfer and handling process.'
  checks:
  - type: manual_review
    info: 'If the data owner has a strict requirement for ensuring data integrity and confidentiality

      is maintained at every step of the data transfer and handling process, verify protection

      methods such as TLS, encrypted VPNs, or IPsec have been implemented.

      If protection methods have not been implemented, this is a finding.'
    severity: medium
- id: '1.27'
  title: WN22-00-000270
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: 'Windows Server 2022 must have the roles and features required by the system documented. GROUP ID: V-254264
    RULE ID: SV-254264r958478'
  rationale: Unnecessary roles and features increase the attack surface of a system. Limiting roles and features of a system
    to only those necessary reduces this potential. The standard installation option (previously called Server Core) further
    reduces this when selected at installation.
  impact: ''
  references: []
  page_start: 70
  audit_raw: 'Required roles and features will vary based on the function of the individual system.

    Roles and features specifically required to be disabled per the STIG are identified in

    separate requirements.

    If the organization has not documented the roles and features required for the

    system(s), this is a finding.

    The PowerShell command "Get-WindowsFeature" will list all roles and features with an

    "Install State".'
  remediation: 'Document the roles and features required for the system to operate. Uninstall any that

    are not required.'
  checks:
  - type: manual_review
    info: 'Required roles and features will vary based on the function of the individual system.

      Roles and features specifically required to be disabled per the STIG are identified in

      separate requirements.

      If the organization has not documented the roles and features required for the

      system(s), this is a finding.

      The PowerShell command "Get-WindowsFeature" will list all roles and features with an

      "Install State".'
    severity: medium
