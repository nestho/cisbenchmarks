  description: 'Windows Server 2022 domain controllers must have a PKI server certificate. GROUP ID: V-254412 RULE ID: SV-254412r958448'
  rationale: Domain controllers are part of the chain of trust for PKI authentications. Without the appropriate certificate,
    the authenticity of the domain controller cannot be verified. Domain controllers must have a server certificate to establish
    authenticity as part of PKI authentications in the domain.
  impact: ''
  references: []
