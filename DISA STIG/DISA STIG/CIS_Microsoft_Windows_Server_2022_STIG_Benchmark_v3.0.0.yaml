- id: '1.95'
  title: WN22-CC-000010
  scoring: scored
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: 'Windows Server 2022 must prevent the display of slide shows on the lock screen. GROUP ID: V-254333 RULE ID:
    SV-254333r958478'
  rationale: Slide shows that are displayed on the lock screen could display sensitive information to unauthorized personnel.
    Turning off this feature will limit access to the information to a logged-on user.
  impact: ''
  references:
  - '1. CIS Recommendation: Prevent enabling lock screen slide show'
  - '2. GRID: MS-00000232'
  page_start: 207
  audit_raw: 'Verify the registry value below.

    If the following registry value does not exist or is not configured as specified, this is a

    finding:

    Registry Hive: HKEY_LOCAL_MACHINE

    Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Personalization\

    Value Name: NoLockScreenSlideshow

    Value Type: REG_DWORD

    Value: 0x00000001 (1)'
  remediation: 'Configure the policy value for

    Computer Configuration >> Administrative Templates >> Control Panel >>

    Personalization >> Prevent enabling lock screen slide show to "Enabled"'
  checks:
  - type: manual_review
    info: 'Verify the registry value below.

      If the following registry value does not exist or is not configured as specified, this is a

      finding:

      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\Windows\Personalization\

      Value Name: NoLockScreenSlideshow

      Value Type: REG_DWORD

      Value: 0x00000001 (1)'
    severity: medium
- id: '1.96'
  title: WN22-CC-000020
  scoring: scored
  profile:
  - 'DC SEVERITY: CAT II'
  - 'MS SEVERITY: CAT II'
  description: 'Windows Server 2022 must have WDigest Authentication disabled. GROUP ID: V-254334 RULE ID: SV-254334r958478'
  rationale: When the WDigest Authentication protocol is enabled, plain-text passwords are stored in the Local Security Authority
    Subsystem Service (LSASS), exposing them to theft. WDigest is disabled by default in Windows Server 2022. This setting
    ensures this is enforced.
  impact: ''
  references:
  - '1. CIS Recommendation: WDigest Authentication'
  - '2. GRID: MS-00000248'
  page_start: 209
  audit_raw: 'If the following registry value does not exist or is not configured as specified, this is a

    finding:

    Registry Hive: HKEY_LOCAL_MACHINE

    Registry Path: \SYSTEM\CurrentControlSet\Control\SecurityProviders\Wdigest\

    Value Name: UseLogonCredential

    Type: REG_DWORD

    Value: 0x00000000 (0)'
  remediation: 'Configure the policy value for

    Computer Configuration >> Administrative Templates >> MS Security Guide . Set

    "WDigest Authentication (disabling may require KB2871997)" to "Disabled"

    This policy setting requires the installation of the SecGuide custom templates included

    with the STIG package. "SecGuide.admx" and " SecGuide.adml" must be copied to the

    \Windows\PolicyDefinitions and \Windows\PolicyDefinitions\en-US directories

    respectively.'
  checks:
  - type: manual_review
    info: 'If the following registry value does not exist or is not configured as specified, this is a

      finding:

      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SYSTEM\CurrentControlSet\Control\SecurityProviders\Wdigest\

      Value Name: UseLogonCredential

      Type: REG_DWORD

      Value: 0x00000000 (0)'
    severity: medium
