  description: 'Windows Server 2022 must have Secure Boot enabled. GROUP ID: V-254284 RULE ID: SV-254284r991589'
  rationale: Secure Boot is a standard that ensures systems boot only to a trusted operating system. Secure Boot is required
    to support additional security features in Windows, including Virtualization Based Security and Credential Guard. If Secure
    Boot is turned off, these security features will not function.
