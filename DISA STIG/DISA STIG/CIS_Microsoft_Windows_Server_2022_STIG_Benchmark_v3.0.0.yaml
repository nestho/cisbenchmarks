- id: '1.155'
  title: WN22-DC-000090
  scoring: manual
  profile:
  - 'DC SEVERITY: CAT I'
  description: 'Windows Server 2022 Active Directory Group Policy objects must have proper access control permissions. GROUP
    ID: V-254393 RULE ID: SV-254393r1081073'
  rationale: When directory service database objects do not have appropriate access control permissions, it may be possible
    for malicious users to create, read, update, or delete the objects and degrade or destroy the integrity of the data. When
    the directory service is used for identification, authentication, or authorization functions, a compromise of the database
    objects could lead to a compromise of all systems relying on the directory service. For Active Directory (AD), the Group
    Policy objects require special attention. In a distributed administration model (i.e., help desk), Group Policy objects
    are more likely to have access permissions changed from the secure defaults. If inappropriate access permissions are defined
    for Group Policy objects, this could allow an intruder to change the security policy applied to all domain client computers
    (workstations and servers).
  impact: ''
  references: []
  page_start: 330
  audit_raw: 'This applies to domain controllers. It is NA for other systems.

    Review the permissions on Group Policy objects.

    Open "Group Policy Management" (available from various menus or run "gpmc.msc").

    Navigate to "Group Policy Objects" in the domain being reviewed (Forest >> Domains

    >> Domain).

    For each Group Policy object:

    Select the Group Policy object item in the left pane.

    Select the "Delegation" tab in the right pane.

    Select "Advanced".

    Select each Group or user name.

    View the permissions.

    If any standard user accounts or groups have "Allow" permissions greater than "Read"

    and "Apply group policy", this is a finding.

    Other access permissions that allow the objects to be updated are considered findings

    unless specifically documented by the Information System Security Officer (ISSO).

    The default permissions noted below satisfy this requirement.

    The permissions shown are at the summary level. More detailed permissions can be

    viewed by selecting the next "Advanced" button, the desired Permission entry, and the

    "Edit" button.

    Authenticated Users - Read, Apply group policy, Special permissions

    The special permissions for Authenticated Users are for Read-type Properties. If

    detailed permissions include any Create, Delete, Modify, or Write Permissions or

    Properties, this is a finding.

    The special permissions for the following default groups are not the focus of this

    requirement and may include a wide range of permissions and properties:

    • CREATOR OWNER - Special permissions

