- id: '1.12'
  title: EX19-ED-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange audit data must be on separate partitions. GROUP ID: V-259588 RULE ID: SV-259588r960948'
  rationale: Log files help establish a history of activities and can be useful in detecting attack attempts or determining
    tuning adjustments to improve availability. Audit log content must always be considered sensitive and in need of protection.
    Successful exploit of an application server vulnerability may well be logged by monitoring or audit processes when it
    occurs. Writing log and audit data to a separate partition where separate security contexts protect them may offer the
    ability to protect this information from being modified or removed by the exploit mechanism.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'Review the Email Domain Security Plan (EDSP).

    Determine the audit logs'' assigned partition.

    Note: By default, the logs are located on the application partition in \Program

    Files\Microsoft\Exchange Server\V15\Logging.

    If the log files are not on a separate partition from the application, this is a finding.'
  remediation: 'Update the EDSP.

    Configure the audit log location to be on a partition drive separate from the application.'
  checks:
  - type: manual_review
    info: 'Review the Email Domain Security Plan (EDSP).

