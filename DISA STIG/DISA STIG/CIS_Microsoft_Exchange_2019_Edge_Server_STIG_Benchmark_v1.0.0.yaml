- id: '1.37'
  title: EX19-ED-000127
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange nonexistent recipients must not be blocked. GROUP ID: V-259613 RULE ID: SV-259613r961161'
  rationale: Spam originators, in an effort to refine mailing lists, sometimes use a technique where they first create fictitious
    names and then monitor rejected emails for nonexistent recipients. Those not rejected are deemed to exist and are used
    in future spam mailings. To prevent this disclosure of existing email accounts to spammers, email to nonexistent recipients
    must not be blocked. Instead, it is recommended that all messages be received, then evaluated and disposed of without
    enabling the sender to determine existent versus nonexistent recipients.
  impact: ''
  references: []
  page_start: 74
  audit_raw: 'Note: If third-party anti-spam product is being used, the anti-spam product must be

