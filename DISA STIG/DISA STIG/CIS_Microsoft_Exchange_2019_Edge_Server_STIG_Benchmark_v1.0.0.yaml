      acceptance in the EDSP, this is not a finding.'
    severity: medium
- id: '1.22'
  title: EX19-ED-000111
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange Outbound Connection limit per Domain Count must be controlled. GROUP ID: V-259598 RULE ID: SV-259598r961155'
  rationale: Email system availability depends in part on best practice strategies for setting tuning configurations. This
    configuration controls the maximum number of simultaneous outbound connections from a domain and works in conjunction
    with the Maximum Outbound Connections Count setting as a delivery tuning mechanism. If the limit is too low, connections
    may be dropped. If the limit is too high, some domains may use a disproportionate resource share, denying access to other
    domains. Appropriate tuning reduces the risk of data delay or loss. By default, a limit of 20 simultaneous outbound connections
    from a domain should be sufficient. The value may be adjusted if justified by local site conditions.
  impact: ''
  references: []
