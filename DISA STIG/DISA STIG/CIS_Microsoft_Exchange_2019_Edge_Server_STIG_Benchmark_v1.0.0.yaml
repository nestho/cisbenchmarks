  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange send connector connections count must be limited. GROUP ID: V-259601 RULE ID: SV-259601r961155'
  rationale: This setting controls the maximum number of simultaneous outbound connections allowed for a given SMTP Connector
