- id: '1.43'
  title: EX19-ED-000133
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange messages with a malformed From address must be rejected. GROUP ID: V-259619 RULE ID: SV-259619r1040909'
  rationale: Sender Identification (SID) is an email anti-spam sanitization process. Sender ID uses DNS MX record lookups
    to verify the Simple Mail Transfer Protocol (SMTP) sending server is authorized to send email for the originating domain.
    Failure to implement Sender ID risks that spam could be admitted into the email domain that originates from rogue servers.
    Most spam content originates from domains where the IP address has been spoofed prior to sending, thereby avoiding detection.
    For example, messages with malformed or incorrect "purported responsible sender" data in the message header could be (best
    case) created by using RFI noncompliant software but is more likely to be spam.
  impact: ''
  references: []
  page_start: 85
  audit_raw: 'If this server is in a SIPR Enclave, this requirement is Not Applicable.

    Note: If third-party anti-spam product is being used, the anti-spam product must be

    configured to meet the requirement.

    Open the Exchange Management Shell and enter the following command:

    Get-SenderIdConfig | Select-Object -Property Name, Identity,

    SpoofedDomainAction

    If the value of "SpoofedDomainAction" is not set to "Reject", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-SenderIdConfig -SpoofedDomainAction Reject'
  checks:
  - type: manual_review
    info: 'If this server is in a SIPR Enclave, this requirement is Not Applicable.

      Note: If third-party anti-spam product is being used, the anti-spam product must be

      configured to meet the requirement.

      Open the Exchange Management Shell and enter the following command:

      Get-SenderIdConfig | Select-Object -Property Name, Identity,

      SpoofedDomainAction

      If the value of "SpoofedDomainAction" is not set to "Reject", this is a finding.'
    severity: medium
- id: '1.44'
