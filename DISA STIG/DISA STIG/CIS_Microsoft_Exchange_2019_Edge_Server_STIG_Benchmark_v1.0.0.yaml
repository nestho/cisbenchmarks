  description: 'The Exchange Recipient filter must be enabled. GROUP ID: V-259620 RULE ID: SV-259620r961161'
  rationale: Email system availability depends in part on best practice strategies for setting tuning configurations. Careful
    tuning reduces the risk that system or network congestion will contribute to availability impacts. Filters that govern
    inbound email evaluation can significantly reduce spam, phishing, and spoofed emails. Messages from blank senders, known
    spammers, or zero-day attack modifications must be enabled to be effective.
  impact: ''
  references: []
  page_start: 87
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-RecipientFilterConfig | Select-Object -Property Name, Enabled

