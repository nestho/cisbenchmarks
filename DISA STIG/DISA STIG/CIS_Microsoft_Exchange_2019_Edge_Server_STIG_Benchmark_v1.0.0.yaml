    not a finding.'
  remediation: 'Update the EDSP to reflect the SMTP Allow List settings.

    Open the Exchange Management Shell and enter the following command:

    Note: Remove any value(s) that are not identified by the EDSP or have not obtained a

    signoff with risk acceptance.

    Remove-IPAllowListEntry -Identity <IP Allow List entry ID>'
  checks:
  - type: manual_review
    info: 'Review the Email Domain Security Plan (EDSP).

