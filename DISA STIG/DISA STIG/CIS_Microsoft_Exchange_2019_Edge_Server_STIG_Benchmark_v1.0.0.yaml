- id: '1.16'
  title: EX19-ED-000094
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange queue database must reside on a dedicated partition. GROUP ID: V-259592 RULE ID: SV-259592r961095'
  rationale: In the same way that added security layers can provide a cumulative positive effect on security posture, multiple
    applications can provide a cumulative negative effect. A vulnerability and subsequent exploit to one application can lead
    to an exploit of other applications sharing the same security context. For example, an exploit to a web server process
    that leads to unauthorized administrative access to the host system can most likely lead to a compromise of all applications
    hosted by the same system. Email services should be installed to a discrete set of directories on a partition that does
    not host other applications. Email services should never be installed on a Domain Controller/Directory Services server.
  impact: ''
  references: []
  page_start: 35
  audit_raw: 'Open the Exchange Management Shell and run the following command:

    Get-Content $exbin\EdgeTransport.exe.config |Select-String

    "QueueDatabasePath" -SimpleMatch

    Example Output:

    <add key="QueueDatabasePath" value="F:\Program Files\Microsoft\Exchange

    Server\V15\TransportRoles\data\Queue" />

    If the path of the Queue Database is in the same volume as the installation of

    Exchange, this is a finding.

    If the path of the Queue Database is on the same volume of existing applications, this is

    a finding.'
  remediation: 'It is recommended to follow the instructions found in the following documentation:

    https://learn.microsoft.com/en-us/exchange/mail-flow/queues/relocate-queuedatabase?view=exchserver-2019

    Set aside time for maintenance before correcting the issue, as this will affect mail flow

    through the Edge role on that server.

    Open an Exchange Management Shell and use the automated script (shipped with

    Exchange) to move the queue database and its existing files to the new destination.

    The following parameters must be answered to successfully complete the move:

    -queueDatabasePath #New destination for the Queue Database. If destination does not

    exist, the script will create it with the appropriate permissions.

    -queueDatabaseLoggingPath #New destination for the Queue Database Logs. If

    destination does not exist, the script will create it with the appropriate permissions.

    -ipFilterDatabasePath #New destination for the IP filtering Database. If the destination

    does not exist, the script will create it with the appropriate permissions.

    -ipFilterDatabaseLoggingPath #New destination for the IP filtering Database Logs. If the

    destination does not exist, the script will create it with the appropriate permissions.

    -temporaryStorage #This will be the path that the script moves the old version of the

    EdgeTransport.exe.config. The new version will have the updated path.

    Note: Always back up the configuration file as CUs will overwrite any added custom

    configuration.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and run the following command:

      Get-Content $exbin\EdgeTransport.exe.config |Select-String

      "QueueDatabasePath" -SimpleMatch

      Example Output:

      <add key="QueueDatabasePath" value="F:\Program Files\Microsoft\Exchange

      Server\V15\TransportRoles\data\Queue" />

      If the path of the Queue Database is in the same volume as the installation of

      Exchange, this is a finding.

      If the path of the Queue Database is on the same volume of existing applications, this is

      a finding.'
    severity: medium
- id: '1.17'
  title: EX19-ED-000095
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange internet-facing send connectors must specify a Smart Host. GROUP ID: V-259593 RULE ID: SV-259593r961101'
  rationale: When identifying a "Smart Host" for the email environment, a logical send connector is the preferred method.
    A Smart Host acts as an internet-facing concentrator for other email servers. Appropriate hardening can be applied to
    the Smart Host, rather than at multiple locations throughout the enterprise. Failure to identify a Smart Host could default
    to each email server performing its own lookups (potentially through protective firewalls). Exchange servers should not
    be internet facing and should therefore not perform any Smart Host functions. When the Exchange servers are internet facing,
    they must be configured to identify the internetfacing server that is performing the Smart Host function.
  impact: ''
  references: []
  page_start: 37
  audit_raw: 'Note: This is not applicable for SIPR enclaves.

    Review the Email Domain Security Plan (EDSP).

    Determine the internet-facing connectors.

    Open the Exchange Management Shell and enter the following command:

    Get-SendConnector | Select-Object -Property Name, Identity, SmartHosts,

    DNSRoutingEnabled

    For each send connector, if the value of "SmartHosts" does not return the Smart Host IP

    Address and the value for "DNSRoutingEnabled" is not set to "False", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-SendConnector <''IdentityName''> -SmartHosts <''IP Address of Smart Host''> -

    DNSRoutingEnabled $false

    Note: The <IdentityName> value must be in quotes.

    Repeat the procedure for each send connector.'
  checks:
  - type: manual_review
    info: 'Note: This is not applicable for SIPR enclaves.

      Review the Email Domain Security Plan (EDSP).

      Determine the internet-facing connectors.

      Open the Exchange Management Shell and enter the following command:

      Get-SendConnector | Select-Object -Property Name, Identity, SmartHosts,

      DNSRoutingEnabled

      For each send connector, if the value of "SmartHosts" does not return the Smart Host IP

      Address and the value for "DNSRoutingEnabled" is not set to "False", this is a finding.'
    severity: medium
- id: '1.18'
  title: EX19-ED-000098
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange internal send connectors must use domain security (mutual authentication Transport Layer Security).
    GROUP ID: V-259594 RULE ID: SV-259594r1043178'
  rationale: The Simple Mail Transfer Protocol (SMTP) connector is used by Exchange to send and receive messages from server
    to server. Several controls work together to provide security between internal servers. This setting controls the authentication
    method used for communications between servers. With this feature enabled, only servers capable of supporting domain authentication
    will be able to send and receive mail within the domain. The use of secure communication prevents eavesdroppers from reading
    or modifying communications between mail clients and servers. While sensitive message bodies should be encrypted by the
    sender at the client, requiring a secure connection from server to server adds protection by encrypting the sender and
    recipient information that cannot be encrypted by the sender. Individually, channel security and encryption can be compromised
    by attackers. Used together, email becomes a more difficult target, and security is heightened. Failure to enable this
    feature gives eavesdroppers an opportunity to read or modify messages between servers.
  impact: ''
  references: []
  page_start: 39
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-SendConnector | Select-Object -Property Name, Identity,

    DomainSecureEnabled

    For each send connector, if the value of "DomainSecureEnabled" is not set to "True",

    this is a finding.

    If the "TlsAuthLevel" parameter is set to "DomainValidation" then the "TlsDomain"

    parameter is required if "DNSRoutingEnabled" parameter is set to "$false".

    The "DNSRoutingEnabled" parameter must be "$true" If the value of

    "DomainSecureEnabled" is "$true".'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-SendConnector <''IdentityName''> -DomainSecureEnabled $true

    Note: The <IdentityName> value must be in quotes.

    Repeat the procedure for each send connector.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-SendConnector | Select-Object -Property Name, Identity,

      DomainSecureEnabled

      For each send connector, if the value of "DomainSecureEnabled" is not set to "True",

      this is a finding.

      If the "TlsAuthLevel" parameter is set to "DomainValidation" then the "TlsDomain"

      parameter is required if "DNSRoutingEnabled" parameter is set to "$false".

      The "DNSRoutingEnabled" parameter must be "$true" If the value of

      "DomainSecureEnabled" is '
    severity: medium
- id: '1.19'
  title: EX19-ED-000099
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange internet-facing receive connectors must offer Transport Layer Security (TLS) before using basic authentication.
    GROUP ID: V-259595 RULE ID: SV-259595r1043178'
  rationale: Sending unencrypted email over the internet increases the risk that messages can be intercepted or altered. TLS
    is designed to protect confidentiality and data integrity by encrypting email messages between servers and thereby reducing
    the risk of eavesdropping, interception, and alteration. This setting forces Exchange to offer TLS before using basic
    authentication.
  impact: ''
  references: []
  page_start: 41
  audit_raw: 'Note: This is not applicable for SIPR enclaves.

    Open the Exchange Management Shell and enter the following command:

    Get-ReceiveConnector | Select-Object -Property Name, Identity, AuthMechanism

    For each receive connector, if the value of "AuthMechanism" is not set to "Tls,

    BasicAuth, BasicAuthRequireTLS", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-ReceiveConnector -Identity <''IdentityName''> -AuthMechanism ''Tls,

    BasicAuth, BasicAuthRequireTLS''

    Note: The <IdentityName> value must be in quotes.

    Example only for the Identity: <ServerName>\Frontend <ServerName>

    Repeat the procedure for each receive connector.'
  checks:
  - type: manual_review
    info: 'Note: This is not applicable for SIPR enclaves.

      Open the Exchange Management Shell and enter the following command:

      Get-ReceiveConnector | Select-Object -Property Name, Identity, AuthMechanism

      For each receive connector, if the value of "AuthMechanism" is not set to "Tls,

      BasicAuth, BasicAuthRequireTLS", this is a finding.'
    severity: medium
- id: '1.20'
  title: EX19-ED-000109
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'More than one Edge server must be deployed. GROUP ID: V-259596 RULE ID: SV-259596r961152'
  rationale: To ensure hostile insiders are unable to easily commit DoS attacks and reduce the effectiveness of mail flow
    throughout the environment, a second Edge server is deployed to allow for multiple paths of mail flow both internally
    and externally into the environment. This prevents a single point-of-failure and allows for service to continue in the
    event of a DoS attack targeting one Edge role.
  impact: ''
  references: []
  page_start: 43
  audit_raw: 'Review the EDSP for current configuration.

    On the mailbox server, open a PowerShell prompt and run the following command:

    Get-EdgeSubscription

    If there is only one subscription on each server, this is a finding.'
  remediation: At a minimum, a second server must be deployed and subscribed to.
  checks:
  - type: manual_review
    info: 'Review the EDSP for current configuration.

      On the mailbox server, open a PowerShell prompt and run the following command:

      Get-EdgeSubscription

      If there is only one subscription on each server, this is a finding.'
    severity: medium
- id: '1.21'
  title: EX19-ED-000110
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange Outbound Connection Timeout must be 10 minutes or less. GROUP ID: V-259597 RULE ID: SV-259597r961155'
  rationale: Email system availability depends in part on best practice strategies for setting tuning configurations. This
    configuration controls the number of idle minutes before the connection is dropped. It works in conjunction with the Maximum
    Outbound Connections Count setting. Connections, once established, may incur delays in message transfer. The default of
    10 minutes is a reasonable window in which to resume activities without maintaining idle connections for excessive intervals.
    If the timeout period is too long, idle connections may be maintained for unnecessarily long time periods, preventing
    new connections from being established. Sluggish connectivity increases the risk of lost data. A value of 10 or less is
    optimal.
  impact: ''
  references: []
  page_start: 44
  audit_raw: 'Review the Email Domain Security Plan (EDSP).

    Determine the Connection Timeout value.

    Open the Exchange Management Shell and enter the following command:

    Get-SendConnector | Select-Object -Property Name, Identity,

