- id: '1.41'
  title: EX19-ED-000130
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange Attachment filtering must remove undesirable attachments by file type. GROUP ID: V-259616 RULE ID:
    SV-259616r961161'
  rationale: 'By performing filtering at the perimeter, up to 90 percent of spam, malware, and other undesirable messages
    are eliminated from the message stream rather than admitting them into the mail server environment. Attachments are being
    used more frequently for different forms of attacks. By filtering undesirable attachments, a large percent of malicious
    code can be prevented from entering the system. Attachments must be controlled at the entry point into the email environment
    to prevent successful attachment-based attacks. The following is a basic list of known attachments that should be filtered
    from internet mail attachments: *.ade *.crt *.jse *.msi *.scr *.wsh *.dir *.adp *.csh *.ksh *.msp *.sct *.htm *.dcr *.app
    *.exe *.lnk *.mst *.shb *.html *.plg *.asx *.fxp *.mda *.ops *.shs *.htc *.spl *.bas *.hlp *.mdb *.pcd *.url *.mht *.swf
    *.bat *.hta *.mde *.pif *.vb *.mhtml *.zip *.chm *.inf *.mdt *.prf *.vbe *.shtm *.cmd *.ins *.mdw *.prg *.vbs *.shtml
    *.com *.isp *.mdz *.reg *.wsc *.stm *.cpl *.js *.msc *.scf *.wsf *.xml'
  impact: ''
  references: []
  page_start: 81
  audit_raw: 'Note: If third-party anti-spam product is being used, the anti-spam product must be

    configured to meet the requirement.

    Review the Email Domain Security Plan (EDSP).

    Determine the list of undesirable attachment types that should be stripped.

    Open the Exchange Management Shell and enter the following command:

    Get-AttachmentFilterEntry

    For each attachment type, if the values returned are different from the EDSP

    documented attachment types, this is a finding.'
  remediation: 'Update the EDSP to reflect the list of undesirable attachment types that should be

    stripped.

    Open the Exchange Management Shell and enter the following command:

    Add-AttachmentFilterEntry -Name <''*.FileExtension''> -Type FileName

    Repeat the procedure for each undesirable attachment type.'
  checks:
  - type: manual_review
    info: 'Note: If third-party anti-spam product is being used, the anti-spam product must be

      configured to meet the requirement.

      Review the Email Domain Security Plan (EDSP).

