    For each send connector, if the value of "ConnectionInactivityTimeOut" is not set to

    "00:10:00", this is a finding.

    or

    If "ConnectionInactivityTimeOut" is set to other than "00:10:00" and has signoff and risk

    acceptance in the EDSP, this is not a finding.'
  remediation: 'Update the EDSP to reflect the Connection Timeout value.

    Open the Exchange Management Shell and enter the following command:

    Set-SendConnector -Identity <''IdentityName''> -ConnectionInactivityTimeOut

    00:10:00

    Note: The <IdentityName> value must be in quotes.

    or

    The value as identified by the EDSP that has obtained a signoff with risk acceptance.

    Repeat the procedure for each send connector.'
  checks:
  - type: manual_review
    info: 'Review the Email Domain Security Plan (EDSP).

      Determine the Connection Timeout value.

      Open the Exchange Management Shell and enter the following command:

      Get-SendConnector | Select-Object -Property Name, Identity,

