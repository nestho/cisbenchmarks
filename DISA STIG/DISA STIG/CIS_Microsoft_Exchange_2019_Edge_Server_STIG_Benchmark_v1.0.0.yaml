  rationale: 'Email system availability depends in part on best practice strategies for setting tuning configurations. This
    configuration controls the maximum number of recipients who will receive a copy of a message at one time. This tunable
    value is related to throughput capacity and can enable the ability to optimize message delivery. Note: There are two types
    of default receive connecters: "Client Servername" accepts SMTP connections from all non-MAPI clients, such as POP and
    IMAP. As POP and IMAP are not authorized for use in DOD, these should not be present. Their default value for MaxRecipientsPerMessage
    is 200. IMAP Secure is not restricted and may be configured. "Default Servername" accepts connections from other mailbox
    servers and any Edge Transport servers. Their default value for MaxRecipientsPerMessage is 5000.'
