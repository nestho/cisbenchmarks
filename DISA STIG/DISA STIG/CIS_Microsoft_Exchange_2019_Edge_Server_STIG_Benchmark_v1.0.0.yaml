- id: '1.28'
  title: EX19-ED-000117
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange receive connectors must be clearly named. GROUP ID: V-259604 RULE ID: SV-259604r961155'
  rationale: For receive connectors, unclear naming as to direction and purpose increases risk that messages may not flow
    as intended, troubleshooting efforts may be impaired, or incorrect assumptions may be made about the completeness of the
    configuration. Collectively, connectors should account for all connections required for the overall email topology design.
    Simple Mail Transfer Protocol (SMTP) connectors, when listed, must name purpose and direction clearly, and their counterparts
    on servers to which they connect should be recognizable as their partners.
  impact: ''
  references: []
  page_start: 58
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-ReceiveConnector | Select-Object -Property Name, Identity

    For each receive connector, review the naming for connectors.

    If the connectors are not clearly named for purpose and direction, this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-ReceiveConnector -Name <''NewName''> -Identity <''IdentityName''>

    Note: Both the <NewName> and <IdentityName> value must be in quotes.

    Repeat the procedure for each receive connector.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-ReceiveConnector | Select-Object -Property Name, Identity

      For each receive connector, review the naming for connectors.

      If the connectors are not clearly named for purpose and direction, this is a finding.'
    severity: medium
