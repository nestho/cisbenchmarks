  - 'SEVERITY: CAT II'
  description: 'The Exchange software baseline copy must exist. GROUP ID: V-259633 RULE ID: SV-259633r961461'
  rationale: Exchange software, as with other application software installed on a host system, must be included in a system
    baseline record and periodically reviewed; otherwise, unauthorized changes to the software may not be discovered. This
    effort is a vital step to securing the host and the applications, as it is the only method that may provide the ability
    to detect and recover from otherwise undetected changes, such as those that result from worm or bot intrusions. The Exchange
    software and configuration baseline is created and maintained for comparison during scanning efforts. Operational procedures
    must include baseline updates as part of configuration management tasks that change the software and configuration.
  impact: ''
  references: []
  page_start: 111
  audit_raw: 'Review the Email Domain Security Plan (EDSP).

    Determine the baseline documentation.

    Review the application software baseline procedures and implementation artifacts.

    Note the list of files and directories included in the baseline procedure for completeness.

    If an email software copy exists to serve as a baseline and is available for comparison

    during scanning efforts, this is not a finding.'
  remediation: Implement an email software baseline process and update the EDSP.
  checks:
  - type: manual_review
    info: 'Review the Email Domain Security Plan (EDSP).

      Determine the baseline documentation.

      Review the application software baseline procedures and implementation artifacts.

      Note the list of files and directories included in the baseline procedure for completeness.

      If an email software copy exists to serve as a baseline and is available for comparison

      during scanning efforts, this is not a finding.'
    severity: medium
- id: '1.58'
  title: EX19-ED-000198
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Exchange local machine policy must require signed scripts. GROUP ID: V-259634 RULE ID: SV-259634r1015764'
  rationale: Scripts, especially those downloaded from untrusted locations, often provide a way for attackers to infiltrate
    a system. By setting machine policy to prevent unauthorized script executions, unanticipated system impacts can be avoided.
  impact: ''
  references: []
  page_start: 112
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-ExecutionPolicy

    If the value returned is not "RemoteSigned", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-ExecutionPolicy RemoteSigned'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-ExecutionPolicy

      If the value returned is not "RemoteSigned", this is a finding.'
    severity: medium
- id: '1.59'
  title: EX19-ED-000199
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange services must be documented, and unnecessary services must be removed or disabled. GROUP ID: V-259635
    RULE ID: SV-259635r961470'
  rationale: Unneeded but running services offer attackers an enhanced attack profile, and attackers are constantly watching
    to discover open ports with running services. By analyzing and disabling unneeded services, the associated open ports
    become unresponsive to outside queries, and servers become more secure as a result. Exchange Server has role-based server
    deployment to enable protocol path control and logical separation of network traffic types. For example, a server implemented
    in the Client Access role (i.e., Outlook Web App [OWA]) is configured and tuned as a web server using web protocols. A
    client access server exposes only web protocols (HTTP/HTTPS), enabling system administrators to optimize the protocol
    path and disable all services unnecessary for Exchange web services. Similarly, servers created to host mailboxes are
    dedicated to that task and must operate only the services needed for mailbox hosting. (Exchange servers must also operate
    some web services but only to the degree that Exchange requires the IIS engine in order to function). Because POP3 and
    IMAP4 clients are not included in the standard desktop offering, they must be disabled.
  impact: ''
  references: []
  page_start: 113
  audit_raw: 'Review the Email Domain Security Plan (EDSP).

    Note: Required services will vary between organizations and will vary depending on the

    role of the individual system. Organizations will develop their own list of services, which

    will be documented and justified with the ISSO. The site''s list will be provided for any

    security review. Services that are common to multiple systems can be addressed in one

    document. Exceptions for individual systems should be identified separately by system.

    Open a Windows PowerShell and enter the following command:

    Get-Service | Where-Object {$_.status -eq ''running''}

    Note: The command returns a list of installed services and the status of that service.

    If the services required are not documented in the EDSP or undocumented or

    unnecessary services are running, this is a finding.'
  remediation: 'Update the EDSP with the services required for the system to function.

    Navigate to Administrator Tools >> Services and disable or remove any services that

    are not required.

    or

    in PowerShell:

    Stop-Service -Name ;

    Set-Service -Name -StartupType Disabled

    Stop and disable services that are not required.'
  checks:
  - type: powershell
    command: Get-Service | Where-Object {$_.status -eq 'running'}
    expected: ''
    severity: medium
    info: 'Review the Email Domain Security Plan (EDSP).

      Note: Required services will vary between organizations and will vary depending on the

      role of the individual system. Organizations will develop their own list of services, which

      will be documented and justified with the ISSO. The site''s list will be provided for any

      security review. Services that are common to multiple systems can be addressed in one

      '
- id: '1.60'
  title: EX19-ED-000224
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Exchange Edge server must point to a trusted list of DNS servers for external and internal resolution.
    GROUP ID: V-259636 RULE ID: SV-259636r961587'
  rationale: To mitigate the risk of possible erroneous queries that may have been coopted by bad actors, the Exchange Edge
    server must use DNS servers that utilize DNSSEC to resolve external hosts and internal hosts before routing messages to
    the appropriate destination.
  impact: ''
  references: []
  page_start: 115
  audit_raw: 'Verify in the EDSP or consult with the appropriate personnel who manage DNS which

    servers to use for Internal and External DNS resolution.

    If the server is not multi-homed, this does not apply.

    In Exchange Management Shell, run the following command:

    Get-TransportService |Format-List *dns*

    If "ExternalDNSAdapterEnabled : True", and no GUID exists, this is a finding.

    If "ExternalDNSAdapterEnabled : False", and the property "ExternalDNSServers" is not

    populated with the documented trusted DNS servers for External DNS queries, this is a

    finding.

    If "InternalDNSAdapterEnabled : True" and no GUID exists, this is a finding.

    If "InternalDNSAdapterEnabled : False" and the property "InternalDNSServers" is not

    populated the documented trusted DNS servers for Internal DNS queries, this is a

    finding.'
  remediation: 'Verify in the EDSP or consult with the appropriate personnel who manage which DNS

    servers to use for Internal and External DNS resolution.

    If a GUID for the External and Internal network adapters are applicable, then gather the

    values to populate the appropriate properties with the following commands:

    netsh lan show interfaces

    This will provide the adapters and the GUIDs for each. Identify the external and internal

    adapters for the Edge server.

    Once gathered, run the following:

    Set-TransportService -Identity <name of server> -ExternalDNSAdapterEnabled

    $true -ExternalDNSAdapterGuid <externalAdapterGUID> -

    InternalDNSAdapterEnabled $true -InternalDNSAdapterGuid <InternalAdapterGuid>

    If the "ExternalDNSAdapterEnabled" or InternalDNSAdapterEnabled are set to false,

    use the following to set the DNS configuration:

    Set-TransportService -Identity <name of server> -InternalDNSServers

    @{add="Trusted DNS IP1","Trusted DNS IP2"}

    Set-TransportService -Identity <name of server> -ExternalDNSServers

    @{add="Trusted DNS IP1","Trusted DNS IP2"}'
  checks:
  - type: manual_review
    info: 'Verify in the EDSP or consult with the appropriate personnel who manage DNS which

      servers to use for Internal and External DNS resolution.

      If the server is not multi-homed, this does not apply.

      In Exchange Management Shell, run the following command:

      Get-TransportService |Format-List *dns*

      If "ExternalDNSAdapterEnabled : True", and no GUID exists, this is a finding.

      If "ExternalDNSAdapterEnabled : False", and the property "ExternalDNSServers" is not

      populated with the documented trusted DNS serv'
    severity: medium
- id: '1.61'
  title: EX19-ED-000231
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Exchange SMTP automated banner response must not reveal server details. GROUP ID: V-259638 RULE ID: SV-259638r961620'
  rationale: 'Automated connection responses occur as a result of FTP or Telnet connections when connecting to those services.
    They report a successful connection by greeting the connecting client and stating the name, release level, and (often)
    additional information about the responding product. While useful to the connecting client, connection responses can also
    be used by a third party to determine operating system or product release levels on the target server. The result can
    include disclosure of configuration information to third parties, paving the way for possible future attacks. For example,
    when querying the SMTP service on port 25, the default response looks similar to this one: 220 exchange.mydomain.org Microsoft
    ESMTP MAIL Service ready at Tuesday, 23 Nov 2021 13:43:00 -0500 Changing the response to hide local configuration details
    reduces the attack profile of the target.'
  impact: ''
  references: []
  page_start: 117
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-ReceiveConnector | Select-Object -Property Name, Identity, Banner

    If the value of "Banner" is not set to "220 SMTP Server Ready", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-ReceiveConnector -Identity <''IdentityName''> -Banner ''220 SMTP Server

    Ready''

    Note: The <IdentityName> and 220 SMTP Server Ready values must be in quotes.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-ReceiveConnector | Select-Object -Property Name, Identity, Banner

      If the value of "Banner" is not set to "220 SMTP Server Ready", this is a finding.'
    severity: medium
- id: '1.62'
  title: EX19-ED-000230
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange software must be installed on a separate partition from the OS. GROUP ID: V-259637 RULE ID: SV-259637r961608'
  rationale: In the same way that added security layers can provide a cumulative positive effect on security posture, multiple
    applications can provide a cumulative negative effect. A vulnerability and subsequent exploit to one application can lead
    to an exploit of other applications sharing the same security context. For example, an exploit to a web server process
    that leads to unauthorized administrative access to the host system can most likely lead to a compromise of all applications
    hosted by the same system. Email services should be installed on a partition that does not host other applications. Email
    services should never be installed on a Domain Controller/Directory Services server.
  impact: ''
  references: []
  page_start: 119
  audit_raw: 'Review the Email Domain Security Plan (EDSP).

    Determine the directory where Exchange is installed.

    Open Windows Explorer.

    Navigate to the location where Exchange is installed.

    If Exchange resides on a directory or partition other than that of the OS and does not

    have other applications installed (without associated approval from the ISSO), this is not

    a finding.'
  remediation: 'Update the EDSP to reflect the directory where Exchange is installed.

    Install Exchange on a dedicated application directory or partition separate than that of

    the OS.'
  checks:
  - type: manual_review
    info: 'Review the Email Domain Security Plan (EDSP).

      Determine the directory where Exchange is installed.

      Open Windows Explorer.

      Navigate to the location where Exchange is installed.

      If Exchange resides on a directory or partition other than that of the OS and does not

      have other applications installed (without associated approval from the ISSO), this is not

      a finding.'
    severity: medium
- id: '1.63'
  title: EX19-ED-000232
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange internal Send connectors must use an authentication level. GROUP ID: V-259639 RULE ID: SV-259639r961620'
  rationale: The Simple Mail Transfer Protocol (SMTP) connector is used by Exchange to send and receive messages from server
    to server. Several controls work together to provide security between internal servers. This setting controls the encryption
    method used for communications between servers. With this feature enabled, only servers capable of supporting Transport
    Layer Security (TLS) will be able to send and receive mail within the domain. The use of secure communication prevents
    eavesdroppers from reading or modifying communications between mail clients and servers. While sensitive message bodies
    should be encrypted by the sender at the client, requiring a secure connection from server to server adds protection by
    encrypting the sender and recipient information that cannot be encrypted by the sender. Individually, channel security
    and encryption can be compromised by attackers. Used together, email becomes a more difficult target, and security is
    heightened. Failure to enable this feature gives eavesdroppers an opportunity to read or modify messages between servers.
  impact: ''
  references: []
  page_start: 121
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-SendConnector | Select-Object -Property Name, Identity, TlsAuthLevel

    If the value of "TlsAuthLevel" is not set to "DomainValidation", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-SendConnector -Identity <''IdentityName''> -TlsAuthLevel DomainValidation'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-SendConnector | Select-Object -Property Name, Identity, TlsAuthLevel

      If the value of "TlsAuthLevel" is not set to "DomainValidation", this is a finding.'
    severity: medium
- id: '1.64'
  title: EX19-ED-000234
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Exchange must provide redundancy. GROUP ID: V-259640 RULE ID: SV-259640r961632'
  rationale: Denial of Service (DoS) is a condition when a resource is not available for legitimate users. When this occurs,
    the organization either cannot accomplish its mission or must operate at degraded capacity. This requirement addresses
    the configuration of applications to mitigate the impact of DoS attacks that have occurred or are ongoing on application
    availability. For each application, known and potential DoS attacks must be identified and solutions for each type implemented.
    A variety of technologies exist to limit or, in some cases, eliminate the effects of DoS attacks (e.g., limiting processes
    or restricting the number of sessions the application opens at one time). Employing increased capacity and bandwidth,
    combined with service redundancy, may reduce the susceptibility to some DoS attacks.
  impact: ''
  references: []
  page_start: 123
  audit_raw: 'Review the Email Domain Security Plan (EDSP).

    From a Mailbox server in the subscribed Edge Subscription site, determine if the

    Exchange servers are using redundancy by entering the following command:

    Get-EdgeSubscription

    If the value returned is not at least two Edge servers, this is a finding.'
  remediation: 'Update the EDSP to reflect the Exchange servers used for redundancy.

    Configure and subscribe to two or more Edge servers for load balancing.'
  checks:
  - type: manual_review
    info: 'Review the Email Domain Security Plan (EDSP).

      From a Mailbox server in the subscribed Edge Subscription site, determine if the

      Exchange servers are using redundancy by entering the following command:

      Get-EdgeSubscription

      If the value returned is not at least two Edge servers, this is a finding.'
    severity: medium
- id: '1.65'
  title: EX19-ED-000235
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Exchange internal Receive connectors must require encryption. GROUP ID: V-259641 RULE ID: SV-259641r961632'
  rationale: The Simple Mail Transfer Protocol (SMTP) Receive connector is used by Exchange to send and receive messages from
    server to server using SMTP protocol. This setting controls the encryption strength used for client connections to the
    SMTP Receive connector. With this feature enabled, only clients capable of supporting secure communications will be able
    to send mail using this SMTP server. Where secure channels are required, encryption can also be selected. The use of secure
    communication prevents eavesdroppers from reading or modifying communications between mail clients and servers. While
    sensitive message bodies should be encrypted by the sender at the client, requiring a secure connection from the client
    to the server adds protection by encrypting the sender and recipient information that cannot be encrypted by the sender.
    Individually, channel security and encryption have been compromised by attackers. Used together, email becomes a more
    difficult target, and security is heightened. Failure to enable this feature gives eavesdroppers an opportunity to read
    or modify messages between the client and server.
  impact: ''
  references: []
  page_start: 124
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-ReceiveConnector | Select-Object -Property Name, Identity, AuthMechanism

    For each Receive connector, if the value of "AuthMechanism" is not set to "Tls", this is a

    finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-ReceiveConnector -Identity <''IdentityName''> -AuthMechanism ''Tls''

    Note: The <IdentityName> value must be in quotes.

    Repeat the process for each Receive connector.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-ReceiveConnector | Select-Object -Property Name, Identity, AuthMechanism

      For each Receive connector, if the value of "AuthMechanism" is not set to "Tls", this is a

      finding.'
    severity: medium
- id: '1.66'
  title: EX19-ED-000236
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Exchange internal Send connectors must require encryption. GROUP ID: V-259642 RULE ID: SV-259642r961632'
  rationale: The Simple Mail Transfer Protocol (SMTP) connector is used by Exchange to send and receive messages from server
    to server. Several controls work together to provide security between internal servers. This setting controls the encryption
    method used for communications between servers. With this feature enabled, only servers capable of supporting Transport
    Layer Security (TLS) will be able to send and receive mail within the domain. The use of secure communication prevents
    eavesdroppers from reading or modifying communications between mail clients and servers. While sensitive message bodies
    should be encrypted by the sender at the client, requiring a secure connection from server to server adds protection by
    encrypting the sender and recipient information that cannot be encrypted by the sender. Individually, channel security
    and encryption can be compromised by attackers. Used together, email becomes a more difficult target, and security is
    heightened. Failure to enable this feature gives eavesdroppers an opportunity to read or modify messages between servers.
  impact: ''
  references: []
  page_start: 126
  audit_raw: 'Check the Email Domain Security Plan (EDSP) and determine which send connector is

    using which secure validation method. If no configuration setting is found, this is a

    finding.

    If using "DomainValidation", open the Exchange Management Shell and enter the

    following command:

    Get-SendConnector | Select-Object -Property Name, Identity, TlsDomain

    If the value of "TlsDomain" is not set to the value of the internal <''SMTP Domain''>, this

    is a finding.

    If using "DomainSecureEnabled", open the Exchange Management Shell and enter the

    following command:

    Get-SendConnector | Select-Object -Property Name, Identity,

    DomainSecureEnabled

    If the value of ''DomainSecureEnabled'' is not set to ''True'', this is a finding.

    Note: The wildcard character (*) is not supported in domains that are configured for

    mutual TLS authentication. The same domain must also be defined on the

    corresponding Receive connector and in the TLSReceiveDomainSecureList attribute of

    the transport configuration.'
  remediation: 'If using "DomainValidation", open the Exchange Management Shell and enter the

    following command:

    Set-SendConnector -Identity <''Identity''> -TlsDomain <InternalSMTPDomain> -

    TlsAuthLevel DomainValidation -RequireTLS $true

    If using "DomainSecureEnabled", open the Exchange Management Shell and enter the

    following command:

    Set-SendConnector -Identity <''ReceiveConnector''> -DomainSecureEnabled $true

    Note:

    • To use DomainSecureEnabled, DNSRouting must be set to $true.

    • The same domain must also be defined on the corresponding Receive connector

    and in the TLSReceiveDomainSecureList attribute of the transport configuration.'
  checks:
  - type: manual_review
    info: 'Check the Email Domain Security Plan (EDSP) and determine which send connector is

      using which secure validation method. If no configuration setting is found, this is a

      finding.

      If using "DomainValidation", open the Exchange Management Shell and enter the

      following command:

      Get-SendConnector | Select-Object -Property Name, Identity, TlsDomain

      If the value of "TlsDomain" is not set to the value of the internal <''SMTP Domain''>, this

      is a finding.

      If using "DomainSecureEnabled", open the Exchange Ma'
    severity: medium
- id: '1.67'
  title: EX19-ED-000238
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange must render hyperlinks from email sources from non-.mil domains as unclickable. GROUP ID: V-259643
    RULE ID: SV-259643r961638'
  rationale: Active hyperlinks within an email are susceptible to attacks of malicious software or malware. The hyperlink
    could lead to a malware infection or redirect the website to another fraudulent website without the user's consent or
    knowledge. Exchange does not have a built-in message filtering capability. DOD Enterprise Email (DEE) has created a custom
    resolution to filter messages from non-.mil users that have hyperlinks in the message body. The hyperlink within the messages
    will be modified, preventing end users from automatically clicking links.
  impact: ''
  references: []
  page_start: 128
  audit_raw: 'Note: If using another DOD-approved anti-spam product for email or a DOD-approved

    Email Gateway spamming device, such as Enterprise Email Security Gateway

    (EEMSG), this is not applicable.

    Note: If system is on SIPRNet, this is not applicable.

    Review the Email Domain Security Plan (EDSP).

    Determine the name of the Transport Agent.

    Open the Windows PowerShell console and enter the following command:

    Get-TransportAgent -Name ''customAgent'' | Format-List

    If the value does not return "customAgent", this is a finding.

    Note: "customAgent" is the name of the custom agent developed to render hyperlink

    email sources from non .mil domains as unclickable.'
  remediation: 'Update the EDSP to reflect the name of the Transport Agent.

    Contact the DISA Enterprise Email Service Desk at disa.tinker.eis.mbx.dod-enterpriseservices-service-desk@mail.mil and
    request the Agent and installation procedures.

    or

    Contact DEE Engineering PMO and request the Agent and installation procedures.'
  checks:
  - type: manual_review
    info: 'Note: If using another DOD-approved anti-spam product for email or a DOD-approved

      Email Gateway spamming device, such as Enterprise Email Security Gateway

      (EEMSG), this is not applicable.

      Note: If system is on SIPRNet, this is not applicable.

      Review the Email Domain Security Plan (EDSP).

      Determine the name of the Transport Agent.

      Open the Windows PowerShell console and enter the following command:

      Get-TransportAgent -Name ''customAgent'' | Format-List

      If the value does not return "customAgent", th'
    severity: medium
- id: '1.68'
  title: EX19-ED-000244
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange must have the most current, approved Cumulative Update (CU) installed. GROUP ID: V-259644 RULE ID:
    SV-259644r961683'
  rationale: The organization (including any contractor to the organization) must promptly install security-relevant software
    updates (e.g., patches, service packs, CUs, hot fixes). Flaws discovered during security assessments, continuous monitoring,
    incident response activities, or information system error handling must also be addressed.
  impact: ''
  references: []
  page_start: 130
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-ExchangeServer | Format-List Name, AdminDisplayVersion

    If the value of "AdminDisplayVersion" does not return the most current, approved CU,

    this is a finding.'
  remediation: Install the most current, approved CU.
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-ExchangeServer | Format-List Name, AdminDisplayVersion

      If the value of "AdminDisplayVersion" does not return the most current, approved CU,

      this is a finding.'
    severity: medium
