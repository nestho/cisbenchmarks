    severity: medium
- id: '1.45'
  title: EX19-ED-000135
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Exchange tarpitting interval must be set. GROUP ID: V-259621 RULE ID: SV-259621r961161'
  rationale: Tarpitting is the practice of artificially delaying server responses for specific Simple Mail Transfer Protocol
    (SMTP) communication patterns that indicate high volumes of spam or other unwelcome messages. The intent of tarpitting
    is to slow down the communication process for spam batches to reduce the cost effectiveness of sending spam and thwart
    directory harvest attacks. A directory harvest attack is an attempt to collect valid email addresses from a particular
    organization so the email addresses can be added to a spam database. A program can be written to collect email addresses
    that return a "Recipient OK" SMTP response and discard all email addresses that return a "User unknown" SMTP response.
    Tarpitting makes directory harvest attacks too costly to automate efficiently.
  impact: ''
  references: []
  page_start: 88
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-ReceiveConnector | Select Name, Identity, TarpitInterval

    For each Receive connector, if the value of "TarpitInterval" is not set to "00:00:05" or

    greater, this is a finding.

    Note: The default value for "TarpitInterval" is "00:00:05".'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-ReceiveConnector -Identity <''IdentityName''> -TarpitInterval ''00:00:05''

    Note: The <IdentityName> value and the Interval must be in quotes.

    Repeat the procedures for each Receive connector.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-ReceiveConnector | Select Name, Identity, TarpitInterval

      For each Receive connector, if the value of "TarpitInterval" is not set to "00:00:05" or

      greater, this is a finding.

      Note: The default value for "TarpitInterval" is "00:00:05".'
    severity: medium
- id: '1.46'
  title: EX19-ED-000136
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange internal Receive connectors must not allow anonymous connections. GROUP ID: V-259622 RULE ID: SV-259622r961161'
  rationale: 'This control is used to limit the servers that may use this server as a relay. If a Simple Mail Transport Protocol
    (SMTP) sender does not have a direct connection to the internet (for example, an application that produces reports to
    be emailed), it will need to use an SMTP Receive connector that does have a path to the internet (for example, a local
    email server) as a relay. SMTP relay functions must be protected so third parties are not able to hijack a relay service
    for their own purposes. Most commonly, relay hijacking is done by spammers to disguise the source of their messages and
    may also be used to cover the source of more destructive attacks. Relays can be restricted in one of three ways: by blocking
    relays (restrict to a blank list of servers); by restricting use to lists of valid servers; or by restricting use to servers
    that can authenticate. Because authenticated connections are the most secure for SMTP Receive connectors, it is recommended
    that relays allow only servers that can authenticate.'
  impact: ''
  references: []
  page_start: 90
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-ReceiveConnector | Select-Object -Property Name, Identity,

    PermissionGroups |Format-List

    For each Receive connector, if the value of "PermissionGroups" is "AnonymousUsers"

    for any noninternet connector, this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-ReceiveConnector -Identity <''IdentityName''> -PermissionGroups ''valid user

    group(s)''

    Note: The <IdentityName> value and user group(s) must be in quotes.

    Example for user groups only: ''ExchangeServers, ExchangeUsers''

    Repeat the procedures for each Receive connector.

    This is an example only: Set-ReceiveConnector -Identity <''IdentityName''> -

    PermissionGroups ''ExchangeUsers'''
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-ReceiveConnector | Select-Object -Property Name, Identity,

      PermissionGroups |Format-List

      For each Receive connector, if the value of "PermissionGroups" is "AnonymousUsers"

      for any noninternet connector, this is a finding.'
    severity: medium
