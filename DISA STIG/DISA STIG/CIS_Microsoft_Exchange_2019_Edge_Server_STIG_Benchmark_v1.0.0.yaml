- id: '1.30'
  title: EX19-ED-000119
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Exchange internet receive connector connections count must be set to default. GROUP ID: V-259606 RULE
    ID: SV-259606r961155'
  rationale: Email system availability depends in part on best practice strategies for setting tuning configurations. This
    configuration controls the maximum number of simultaneous inbound connections allowed to the SMTP server. By default,
    the number of simultaneous inbound connections is 5000. If a limit is set too low, the connections pool may be filled.
    If attackers perceive the limit is too low, they could deny service to the Simple Mail Transfer Protocol (SMTP) server
    by using a connection count that exceeds the limit set. By setting the default configuration to 5000, attackers would
    need many more connections to cause denial of service.
  impact: ''
  references: []
