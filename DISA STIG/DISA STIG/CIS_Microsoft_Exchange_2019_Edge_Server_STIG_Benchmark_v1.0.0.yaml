    severity: medium
- id: '1.13'
  title: EX19-ED-000053
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange local machine policy must require signed scripts. GROUP ID: V-259589 RULE ID: SV-259589r1015762'
  rationale: Scripts often provide a way for attackers to infiltrate a system, especially scripts downloaded from untrusted
    locations. By setting machine policy to prevent unauthorized script executions, unanticipated system impacts can be avoided.
    Failure to allow only signed remote scripts reduces the attack vector vulnerabilities from unsigned remote scripts.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-ExecutionPolicy

    If the value returned is not "RemoteSigned", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-ExecutionPolicy RemoteSigned'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-ExecutionPolicy

      If the value returned is not "RemoteSigned", this is a finding.'
    severity: medium
- id: '1.14'
  title: EX19-ED-000055
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange must not send customer experience reports to Microsoft. GROUP ID: V-259590 RULE ID: SV-259590r960963'
  rationale: It is detrimental for applications to provide, or install by default, functionality exceeding requirements or
    mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured.
    They increase the risk to the platform by providing additional attack vectors. Applications are capable of providing a
    wide variety of functions and services. Some of the functions and services, provided by default, may not be necessary
    to support essential organizational operations (e.g., key missions, functions). Examples of nonessential capabilities
    include, but are not limited to, advertising software or browser plug-ins not related to requirements or providing a wide
    array of functionality not required for every mission, but cannot be disabled. All system errors in Exchange will result
    in outbound traffic that may be identified by an eavesdropper. For this reason, the "Report Fatal Errors to Microsoft"
    feature must be disabled.
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-OrganizationConfig | Select-Object -Property Name, Identity,

    CustomerFeedbackEnabled

    If the value for "CustomerFeedbackEnabled" is not set to "False", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-OrganizationConfig -CustomerFeedbackEnabled $false

    Note: This can be done during initial installation of Exchange.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-OrganizationConfig | Select-Object -Property Name, Identity,

      CustomerFeedbackEnabled

      If the value for "CustomerFeedbackEnabled" is not set to "False", this is a finding.'
    severity: medium
