- id: '1.40'
  title: EX19-ED-000131
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Exchange Spam Evaluation filter must be enabled. GROUP ID: V-259617 RULE ID: SV-259617r961161'
  rationale: By performing filtering at the perimeter, up to 90 percent of spam, malware, and other undesirable messages may
    be eliminated from the transport message stream, preventing their entry into the Exchange environment. This significantly
    reduces the attack vector for inbound email-borne spam and malware. Spam Evaluation filters scan inbound email messages
    for evidence of spam and other attacks that primarily use social engineering techniques. Upon evaluation completion, a
    rating is assigned to each message estimating the likelihood of its being spam. Upon arrival at the destination mailbox,
    the junk mail filter threshold (also configurable) determines whether the message will be withheld from delivery, delivered
    to the junk mail folder, or delivered to the user's inbox.
  impact: ''
  references: []
  page_start: 79
  audit_raw: 'Note: If third-party anti-spam product is being used, the anti-spam product must be

    configured to meet the requirement. Additionally, the default value for this property is

