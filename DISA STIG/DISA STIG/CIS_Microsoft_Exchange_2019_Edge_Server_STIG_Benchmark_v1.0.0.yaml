- id: '1.27'
  title: EX19-ED-000116
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange send connectors delivery retries must be controlled. GROUP ID: V-259603 RULE ID: SV-259603r961155'
  rationale: 'This setting controls the rate at which delivery attempts from the home domain are retried and user notifications
    are issued and notes the expiration time when the message will be discarded. If delivery retry attempts are too frequent,
    servers will generate network congestion. If they are too far apart, messages may remain queued longer than necessary,
    potentially raising disk resource requirements. The default values of these fields should be adequate for most environments.
    Administrators may wish to modify the values, but changes should be documented in the System Security Plan. Note: Transport
    configuration settings apply to the organization/global level of the Exchange SMTP path. By checking and setting them
    at the Hub server, the setting will apply to both Hub and Edge roles.'
  impact: ''
  references: []
