    severity: medium
- id: '1.23'
  title: EX19-ED-000112
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange receive connector maximum hop count must be 60. GROUP ID: V-259599 RULE ID: SV-259599r961155'
  rationale: Email system availability depends in part on best practice strategies for setting tuning configurations. This
    setting controls the maximum number of hops (email servers traversed) a message may take as it travels to its destination.
    Part of the original internet protocol implementation, the hop count limit prevents a message from being passed in a routing
    loop indefinitely. Messages exceeding the maximum hop count are discarded undelivered. Recent studies indicate that virtually
    all messages can be delivered in fewer than 60 hops. If the hop count is set too low, messages may expire before they
    reach their destinations. If set too high, an undeliverable message may cycle between servers, raising the risk of network
    congestion.
  impact: ''
  references: []
  page_start: 48
  audit_raw: 'Review the Email Domain Security Plan (EDSP).

    Determine the value for receive connectors.

    Open the Exchange Management Shell and enter the following command:

    Get-ReceiveConnector | Select-Object -Property Name, Identity, MaxHopCount

    For each receive connector, if the value of "MaxHopCount" is not set to "60", this is a

    finding.

    or

    If the value of "MaxHopCount" is set to a value other than "60" and has signoff and risk

    acceptance, this is not a finding.'
  remediation: 'Update the EDSP to reflect the value for receive connectors.

    Open the Exchange Management Shell and enter the following command:

    Set-ReceiveConnector -Identity <''IdentityName''> -MaxHopCount 60

    Note: The <IdentityName> value must be in quotes.

    or

    The value as identified by the EDSP that has obtained a signoff with risk acceptance.

    Repeat the procedure for each receive connector.'
  checks:
