controls:
- id: '1.1'
  title: EX19-ED-000006
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SchUseStrongCrypto must be enabled. GROUP ID: V-259577 RULE ID: SV-259577r960759'
  rationale: Exchange Server 2019 is configured by default with TLS 1.2. However, SchUseStrongCrypto is not set by default
    and must be configured to meet the TLS requirement. The strong cryptography (configured by the SchUseStrongCrypto registry
    value) uses more secure network protocols (TLS 1.2, TLS 1.1, and TLS 1.0) and blocks protocols that are not secure. SchUseStrongCrypto
    affects only client (outgoing) connections in the application.
  impact: ''
  references: []
  page_start: 12
  audit_raw: 'In a PowerShell window, run the following commands:

    Get-ItemProperty HKLM:\SOFTWARE\Microsoft\.NetFramework\v4.0.30319

    If the value "SchUseStrongCrypto" is not present and set to 1, this is a finding.'
  remediation: 'In a PowerShell window with elevated privileges, run the following commands:

    reg add HKLM\SOFTWARE\Microsoft\.NetFramework\v4.0.30319 /v

    "SchUseStrongCrypto" /t REG_DWORD /d 1

    reg add HKLM\SOFTWARE\WoW6432Node\Microsoft\.NetFramework\v4.0.30319 /v

    "SchUseStrongCrypto" /t REG_DWORD /d 1

    This will create the value within the necessary key and set the data to 1.'
  checks:
  - type: powershell
    command: Get-ItemProperty HKLM:\SOFTWARE\Microsoft\.NetFramework\v4.0.30319
    expected: ''
    severity: medium
    info: 'In a PowerShell window, run the following commands:

      Get-ItemProperty HKLM:\SOFTWARE\Microsoft\.NetFramework\v4.0.30319

      If the value "SchUseStrongCrypto" is not present and set to 1, this is a finding.'
- id: '1.2'
  title: EX19-ED-000016
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange servers must use approved DOD certificates. GROUP ID: V-259578 RULE ID: SV-259578r960792'
  rationale: To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates
    by DOD-approved PKIs, all DOD systems (e.g., networks, web servers, and web portals) must be properly configured to incorporate
    access control methods that do not rely solely on the possession of a certificate for access. Successful authentication
    must not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must
    be implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the
    process of determining whether an entity, once authenticated, is permitted to access a specific asset. Information systems
    use access control policies and enforcement mechanisms to implement this requirement. Access control policies include
    identity-based policies, role-based policies, and attribute-based policies. Access enforcement mechanisms include access
    control lists, access control matrices, and cryptography. These policies and mechanisms must be employed by the application
    to control access between users (or processes acting on behalf of users) and objects (e.g., devices, files, records, processes,
    programs, and domains) in the information system. This requirement is applicable to access control enforcement applications
    (e.g., authentication servers) and other applications that perform information and system access control functions.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-ExchangeCertificate | Select-Object -Property CertificateDomains, issuer

    If the value of "CertificateDomains" does not indicate it is issued by the DOD, this is a

    finding.'
  remediation: Remove the non-DOD certificate and import the correct DOD certificates.
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-ExchangeCertificate | Select-Object -Property CertificateDomains, issuer

      If the value of "CertificateDomains" does not indicate it is issued by the DOD, this is a

      finding.'
    severity: medium
- id: '1.3'
  title: EX19-ED-000017
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange must have accepted domains configured. GROUP ID: V-259579 RULE ID: SV-259579r960801'
  rationale: Exchange may be configured to accept email for multiple domain names. This setting identifies the domains for
    which the server will accept mail. This check verifies the email server is not accepting email for unauthorized domains.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Review the Email Domain Security Plan (EDSP).

    Determine the Accepted Domain values.

    Open the Exchange Management Shell and enter the following command:

    Get-AcceptedDomain | Select-Object -Property Name, DomainName, Identity,

    Default

    If the value of "Default" is not set to "True", this is a finding.

    or

    If the "Default" value for "AcceptedDomains" is set to another value other than "True"

    and has signoff and risk acceptance in the EDSP, this is not a finding.'
  remediation: 'Update the EDSP.

    Open the Exchange Management Shell and enter the following command:

    Set-AcceptedDomain -Identity <''IdentityName''> -MakeDefault $true

    Note: The <IdentityName> value must be in quotes.'
  checks:
  - type: manual_review
    info: 'Review the Email Domain Security Plan (EDSP).

      Determine the Accepted Domain values.

      Open the Exchange Management Shell and enter the following command:

      Get-AcceptedDomain | Select-Object -Property Name, DomainName, Identity,

      Default

      If the value of "Default" is not set to "True", this is a finding.

      or

      If the "Default" value for "AcceptedDomains" is set to another value other than "True"

      and has signoff and risk acceptance in the EDSP, this is not a finding.'
    severity: medium
- id: '1.4'
  title: EX19-ED-000019
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange external Receive connectors must be domain secure-enabled. GROUP ID: V-259580 RULE ID: SV-259580r960840'
  rationale: The Simple Mail Transfer Protocol (SMTP) connector is used by Exchange to send and receive messages from server
    to server. Several controls work together to provide security between internal servers. This setting controls the authentication
    method used for communications between servers. With this feature enabled, messages can be securely passed from a partner
    domain securely. The use of secure communication prevents eavesdroppers from reading or modifying communications between
    mail clients and servers. While sensitive message bodies should be encrypted by the sender at the client, requiring a
    secure connection from server to server adds protection by encrypting the sender and recipient information that cannot
    be encrypted by the sender. Individually, channel security and encryption can be compromised by attackers. Used together,
    email becomes a more difficult target, and security is heightened. Failure to enable this feature gives eavesdroppers
    an opportunity to read or modify messages between servers.
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-ReceiveConnector | Select-Object -Property Name, Identity,

    DomainSecureEnabled

    For each receive connector, if the value of "DomainSecureEnabled" is not set to "True",

    this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-ReceiveConnector -Identity <''IdentityName''> -DomainSecureEnabled $true

    Note: The <IdentityName> value must be in quotes.

    Repeat the procedures for each receive connector.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-ReceiveConnector | Select-Object -Property Name, Identity,

      DomainSecureEnabled

      For each receive connector, if the value of "DomainSecureEnabled" is not set to "True",

      this is a finding.'
    severity: medium
- id: '1.5'
  title: EX19-ED-000026
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Exchange email diagnostic log level must be set to the lowest level. GROUP ID: V-259581 RULE ID: SV-259581r960879'
  rationale: 'Log files help establish a history of activities and can be useful in detecting attack attempts or determining
    tuning adjustments to improve availability. Diagnostic logging, however, characteristically produces large volumes of
    data and requires care in managing the logs to prevent risk of disk capacity denial of service conditions. Exchange diagnostic
    logging is broken up into 29 main "services", each of which has anywhere from two to 26 "categories" of events to be monitored.
    Moreover, each category may be set to one of four levels of logging: Lowest, Low, CAT II, and High, depending on how much
    detail one desires. The higher the level of detail, the more disk space required to store the audit material. Diagnostic
    logging is intended to help administrators debug problems with their systems, not as a general-purpose auditing tool.
    Because the diagnostic logs collect a great deal of information, the log files may grow large very quickly. Diagnostic
    log levels may be raised for limited periods of time when attempting to debug relevant pieces of Exchange functionality.
    Once debugging has finished, diagnostic log levels should be reduced again.'
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-EventLogLevel

    If any "EventLogLevel" values returned are not set to "Lowest", this is a finding.

    Note: The default installation of Exchange has all Event Levels set to Lowest with

    exception of the following:

    • MSExchange ADAccess\Topology - Low

    • MSExchangeADAccess\Validation - Low

    • MSExchange BackEndRehydration\Configuration - Low

    • MSExchange BackEndRehydration\Server - 2

    • MSExchange OAuth\Configuration - Low

    • MSExchange OAuth\Server - 2

    • MSExchange RBAC\RBAC - Low

    • MSExchangeADTopology\Topology - Low

    All of these must be set to Lowest.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-EventLogLevel -Identity <''IdentityName\EventlogName''> -Level Lowest

    Note: The <IdentityName\EventlogName> value must be in quotes.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-EventLogLevel

      If any "EventLogLevel" values returned are not set to "Lowest", this is a finding.

      Note: The default installation of Exchange has all Event Levels set to Lowest with

      exception of the following:

      • MSExchange ADAccess\Topology - Low

      • MSExchangeADAccess\Validation - Low

      • MSExchange BackEndRehydration\Configuration - Low

      • MSExchange BackEndRehydration\Server - 2

      • MSExchange OAuth\Configuration - Low

      • MSExchang'
    severity: medium
- id: '1.6'
  title: EX19-ED-000027
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange connectivity logging must be enabled. GROUP ID: V-259582 RULE ID: SV-259582r960879'
  rationale: 'A connectivity log is a record of the SMTP connection activity of the outbound message delivery queues to the
    destination mailbox server, smart host, or domain. Connectivity logging is available on Hub Transport servers and Edge
    Transport servers. By default, connectivity logging is disabled. If events are not recorded, it may be difficult or impossible
    to determine the root cause of system problems or the unauthorized activities of malicious users. Note: Transport configuration
    settings apply to the organization/global level of the Exchange SMTP path. By checking and setting them at the Hub server,
    the setting will apply to both Hub and Edge roles.'
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-TransportService | Select-Object -Property Name, Identity,

    ConnectivityLogEnabled

    If the value of "ConnectivityLogEnabled" is not set to "True", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-TransportService -Identity <''IdentityName''> -ConnectivityLogEnabled $true

    Note: The <IdentityName> value must be in quotes.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-TransportService | Select-Object -Property Name, Identity,

      ConnectivityLogEnabled

      If the value of "ConnectivityLogEnabled" is not set to "True", this is a finding.'
    severity: medium
- id: '1.7'
  title: EX19-ED-000040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange queue monitoring must be configured with threshold and action. GROUP ID: V-259584 RULE ID: SV-259584r960918'
  rationale: Monitors are automated "process watchers" that respond to performance changes and can be useful in detecting
    outages and alerting administrators where attention is needed. Exchange has built-in monitors that enable the administrator
    to generate alerts if thresholds are reached, better enabling them to react in a timely fashion. This field offers choices
    of alerts when a "warning" or "critical" threshold is reached on the SMTP queue. A good rule of thumb (default) is to
    issue warnings when SMTP queue growth exceeds 10 minutes and critical messages when it exceeds 20 minutes, which should
    only exist occasionally. Frequent alerts against this counter may indicate a network or other issue (such as inbound spammer
    traffic) that directly impacts email delivery. Notification choices include email alert to an email-enabled account (e.g.,
    an email administrator) or invoke a script to take other action (e.g., to add an event to the Microsoft Application Event
    Log, where external monitors might detect it).
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'Note: By default, there are two user-defined data collector sets created by Exchange:

    ExchangeDiagnosticsDailyPerformanceLog and ExchangeDiagnosticsPerformanceLog.

    These are not providing enough data to monitor SMTP queues per the requirement.

    Additionally, if a third-party application is performing monitoring functions, the reviewer

    should verify the application is monitoring correctly and mark the vulnerability Not

    Applicable.

    Open the Exchange Management Shell and enter the following command:

    perfmon

    In the left pane, navigate to Performance >> Data Collector Sets >> User Defined.

    If no sets are defined or queues are not being monitored, this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    perfmon

    In the left pane, navigate to Performance >> Data Collector Sets >> User Defined.

    In left pane, right-click User Defined >> New >> Data Collector Set and configure the

    system to use the data collection set for monitoring the queues.'
  checks:
  - type: manual_review
    info: 'Note: By default, there are two user-defined data collector sets created by Exchange:

      ExchangeDiagnosticsDailyPerformanceLog and ExchangeDiagnosticsPerformanceLog.

      These are not providing enough data to monitor SMTP queues per the requirement.

      Additionally, if a third-party application is performing monitoring functions, the reviewer

      should verify the application is monitoring correctly and mark the vulnerability Not

      Applicable.

      Open the Exchange Management Shell and enter the following command:'
    severity: medium
- id: '1.8'
  title: EX19-ED-000034
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange message tracking logging must be enabled. GROUP ID: V-259583 RULE ID: SV-259583r960900'
  rationale: A message tracking log provides a detailed log of all message activity as messages are transferred to and from
    a computer running Exchange. If events are not recorded, it may be difficult or impossible to determine the root cause
    of system problems or the unauthorized activities of malicious users.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-Transportservice | Select-Object -Property Name,

    MessageTrackingLogEnabled

    If the value of "MessageTrackingLogEnabled" is not set to "True", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-Transportservice <IdentityName> -MessageTrackingLogEnabled $true

    Note: The <IdentityName> value must be in quotes.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-Transportservice | Select-Object -Property Name,

      MessageTrackingLogEnabled

      If the value of "MessageTrackingLogEnabled" is not set to "True", this is a finding.'
    severity: medium
- id: '1.9'
  title: EX19-ED-000044
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange audit data must be protected against unauthorized access (read access). GROUP ID: V-259585 RULE ID:
    SV-259585r960930'
  rationale: Log files help establish a history of activities and can be useful in detecting attack attempts or determining
    tuning adjustments to improve availability. Audit log content must always be considered sensitive and in need of protection.
    Audit data available for modification by a malicious user can be altered to conceal malicious activity. Audit data might
    also provide a means for the malicious user to plan unauthorized activities that exploit weaknesses. The contents of audit
    logs are protected against unauthorized access, modification, or deletion. Only authorized auditors and the audit functions
    should be granted read and write access to audit log data.
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'Review the Email Domain Security Plan (EDSP).

    Determine the authorized groups or users that should have read access to the audit

    data.

    If any group or user has read access to the audit data that is not documented in the

    EDSP, this is a finding.'
  remediation: 'Update the EDSP to reflect the authorized groups or users that should have read

    access to the audit data.

    Restrict any unauthorized groups'' or users'' read access to the audit logs.'
  checks:
  - type: manual_review
    info: 'Review the Email Domain Security Plan (EDSP).

      Determine the authorized groups or users that should have read access to the audit

      data.

      If any group or user has read access to the audit data that is not documented in the

      EDSP, this is a finding.'
    severity: medium
