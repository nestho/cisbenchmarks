  title: EX19-ED-000137
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange Simple Mail Transfer Protocol (SMTP) IP Allow List entries must be empty. GROUP ID: V-259623 RULE
