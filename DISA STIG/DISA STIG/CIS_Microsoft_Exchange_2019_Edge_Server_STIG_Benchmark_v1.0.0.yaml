    "5000", this is a finding.

    or

    If "MaxInboundConnection" is set to a value other than "5000" or is set to unlimited and

    has signoff and risk acceptance in the EDSP, this is not a finding.'
  remediation: 'Update the EDSP to reflect the Maximum Inbound connections value.

    Open the Exchange Management Shell and enter the following command:

    Set-ReceiveConnector -Identity <''IdentityName''> -MaxInboundConnection 5000

    Note: The <IdentityName> value must be in quotes.

    or

    The value as identified by the EDSP that has obtained a signoff with risk acceptance.

    Repeat the procedure for each receive connector.'
