  description: 'Exchange receive connectors must control the number of recipients chunked on a single message. GROUP ID: V-259605
    RULE ID: SV-259605r961155'
  rationale: Email system availability depends in part on best practice strategies for setting tuning configurations. For
    message size restrictions, multiple places exist to set or override inbound or outbound message size. Failure to control
    the configuration strategy can result in loss of data or system availability. This setting enables the administrator to
    enable "chunking" on received messages as they arrive at the domain. This is done so large message bodies can be relayed
    by the remote sender to the Receive connector in multiple, smaller chunks.
  impact: ''
  references: []
  page_start: 59
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-ReceiveConnector | Select-Object -Property Name, Identity,

    ChunkingEnabled

    For each receive connector, if the value of "ChunkingEnabled" is not set to "True", this

    is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-ReceiveConnector -Identity <''IdentityName''> -ChunkingEnabled $true

    Note: The <IdentityName> value must be in quotes.

    Repeat the procedure for each receive connector.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

