- id: '1.53'
  title: EX19-ED-000143
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange Sender Identification Framework must be enabled. GROUP ID: V-259629 RULE ID: SV-259629r961161'
  rationale: Email is only as secure as the recipient. When the recipient is an email server accepting inbound messages, authenticating
    the sender enables the receiver to better assess message quality and to validate the sending domain as authentic. One
    or more authentication techniques used in combination can be effective in reducing spam, phishing, and forger attacks.
    The Sender ID Framework (SIDF) receiver accesses specially formatted DNS records (SPF format) that contain the IP address
    of authorized sending servers for the sending domain that can be compared to data in the email message header. Receivers
    are able to validate the authenticity of the sending domain, helping to avoid receiving inbound messages from phishing
    or other spam domains.
  impact: ''
  references: []
  page_start: 103
  audit_raw: 'Note: If third-party anti-spam product is being used, the anti-spam product must be

    configured to meet the requirement.

