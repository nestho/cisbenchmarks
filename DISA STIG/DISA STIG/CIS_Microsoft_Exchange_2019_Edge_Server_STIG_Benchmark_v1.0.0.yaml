- id: '1.33'
  title: EX19-ED-000123
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange messages with a blank sender field must be rejected. GROUP ID: V-259609 RULE ID: SV-259609r961161'
  rationale: By performing filtering at the perimeter, up to 90 percent of spam, malware, and other undesirable messages are
    eliminated from the message stream rather than admitting them into the mail server environment. Anonymous email (messages
    with blank sender fields) cannot be replied to. Messages formatted in this way may be attempting to hide their true origin
    to avoid responses or to spam any receiver with impunity while hiding their source of origination. Rather than spend resources
    and risk infection while evaluating them, it is recommended that these messages be filtered immediately upon receipt and
    not forwarded to end users.
  impact: ''
  references: []
  page_start: 67
  audit_raw: 'This requirement is Not Applicable for SIPR enclaves.

    This requirement is Not Applicable if the organization subscribes to EEMSG or other

    similar DOD enterprise protections for email services.

    Open the Exchange Management Shell and enter the following command:

    Get-SenderFilterConfig | Select-Object -Property Name, Action

    If the value of "Action" is not set to "Reject", this is a finding.

    Note: "Reject" is the default value.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-SenderFilterConfig -Action Reject'
  checks:
  - type: manual_review
    info: 'This requirement is Not Applicable for SIPR enclaves.

      This requirement is Not Applicable if the organization subscribes to EEMSG or other

      similar DOD enterprise protections for email services.

