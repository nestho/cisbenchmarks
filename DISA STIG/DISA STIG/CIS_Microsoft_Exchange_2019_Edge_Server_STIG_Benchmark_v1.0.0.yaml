- id: '1.35'
  title: EX19-ED-000125
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange filtered messages must be archived. GROUP ID: V-259611 RULE ID: SV-259611r961161'
  rationale: By performing filtering at the perimeter, up to 90 percent of spam, malware, and other undesirable messages are
    eliminated from the message stream rather than admitting them into the mail server environment. This significantly reduces
    the attack vector for inbound email-borne spam and malware. As messages are filtered, it is prudent to temporarily host
    them in an archive for evaluation by administrators or users. The archive can be used to recover messages that might have
    been inappropriately filtered, preventing data loss, and to provide a base of analysis that can provide future filter
    refinements.
