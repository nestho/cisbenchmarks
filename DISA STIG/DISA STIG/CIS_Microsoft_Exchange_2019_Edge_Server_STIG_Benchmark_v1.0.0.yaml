- id: '1.36'
  title: EX19-ED-000126
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Exchange sender filter must block unaccepted domains. GROUP ID: V-259612 RULE ID: SV-259612r961161'
  rationale: Spam origination sites and other sources of suspected email-borne malware have the ability to corrupt, compromise,
    or otherwise limit availability of email servers. Limiting exposure to unfiltered inbound messages can reduce the risk
    of spam and malware impacts. The Global Deny list blocks messages originating from specific sources. Most block list filtering
    is done using a commercial block list service, because eliminating threats from known spammers prevents the messages being
    evaluated inside the enclave where there is more risk they can do harm. Additional sources should also be blocked to supplement
    the contents of the commercial Block List service. For example, during a zero-day threat action, entries can be added
    and then removed when the threat is mitigated. An additional best practice is to enter the enterprise's home domains in
    the block list, because inbound email with a "from" address of the home domain is very likely to be spoofed spam.
  impact: ''
  references: []
  page_start: 72
  audit_raw: 'Note: If third-party anti-spam product is being used, the anti-spam product must be

    configured to meet the requirement.

    Review the Email Domain Security Plan (EDSP).

