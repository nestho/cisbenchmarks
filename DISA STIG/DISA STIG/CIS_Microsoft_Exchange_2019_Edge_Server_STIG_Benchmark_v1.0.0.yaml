    Note: "customAgent" is the name of the custom agent developed to render hyperlink

    email sources from non .mil domains as unclickable.'
  remediation: 'Update the EDSP to reflect the name of the Transport Agent.

    Contact the DISA Enterprise Email Service Desk at disa.tinker.eis.mbx.dod-enterpriseservices-service-desk@mail.mil and
    request the Agent and installation procedures.

    or

    Contact DEE Engineering PMO and request the Agent and installation procedures.'
