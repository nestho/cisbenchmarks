  profile:
  - 'SEVERITY: CAT II'
  description: 'Active hyperlinks in messages from non .mil domains must be rendered unclickable. GROUP ID: V-259608 RULE
    ID: SV-259608r961161'
  rationale: Active hyperlinks within an email are susceptible to attacks of malicious software or malware. The hyperlink
    could lead to a malware infection or redirect the website to another fraudulent website without the user's consent or
    knowledge. Exchange does not have a built-in message filtering capability. DOD Enterprise Email (DEE) has created a custom
    resolution to filter messages from non-.mil users that have hyperlinks in the message body. The hyperlink within the messages
    will be modified, preventing end users from automatically clicking links.
  impact: ''
  references: []
