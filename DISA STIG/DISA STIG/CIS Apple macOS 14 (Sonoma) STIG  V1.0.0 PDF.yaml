  rationale: 'If SSHD is enabled it must be configured with the Client Alive Maximum Count set to 1. This will set the number
    of client alive messages which may be sent without the SSH server receiving any messages back from the client. If this
    threshold is reached while client alive messages are being sent, the SSH server will disconnect the client, terminating
    the session. The client alive messages are sent through the encrypted channel and therefore will not be spoofable. The
    client alive mechanism is valuable when the client or server depend on knowing when a connection has become unresponsive.
