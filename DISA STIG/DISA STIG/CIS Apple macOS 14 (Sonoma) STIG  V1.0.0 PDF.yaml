  description: 'The macOS system must configure system to shut down upon audit failure. GROUP ID: V-259455 RULE ID: SV-259455r1038966'
  rationale: 'The audit service must be configured to shut down the computer if it is unable to audit system events. Once
    audit failure occurs, user and system activity are no longer recorded, and malicious activity could go undetected. Audit
    processing failures can occur due to software/hardware errors, failures in the audit capturing mechanisms, and audit storage
    capacity being reached or exceeded. When availability is an overriding concern, other approved actions in response to
    an audit failure are as follows: (i) If the failure was caused by the lack of audit record storage capacity, the operating
    system must continue generating audit records if possible (automatically restarting the audit service if necessary), overwriting
    the oldest audit records in a first-in-first-out manner. (ii) If audit records are sent to a centralized collection server
    and communication with this server is lost or the server fails, the operating system must queue audit records locally
    until communication is restored or until the audit records are retrieved manually. Upon restoration of the connection
    to the centralized collection server, action should be taken to synchronize the local audit data with the collection server.'
