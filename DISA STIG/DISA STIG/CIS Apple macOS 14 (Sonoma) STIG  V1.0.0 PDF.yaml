  rationale: 'If SSH is enabled to ensure individual accountability and prevent unauthorized access, logging in as root via
    SSH must be disabled. The macOS system must require individuals to be authenticated with an individual authenticator prior
    to using a group authenticator, and administrator users must never log in directly as root. Note: /etc/ssh/sshd_config
