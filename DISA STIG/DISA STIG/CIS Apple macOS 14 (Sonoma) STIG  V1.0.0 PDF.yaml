- id: '1.16'
  title: APPL-14-000051
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The macOS system must configure SSHD ClientAliveInterval to 900. GROUP ID: V-259435 RULE ID: SV-259435r970703'
  rationale: 'If SSHD is enabled, then it must be configured with the Client Alive Interval set to 900. Sets a timeout interval
    in seconds after which if no data has been received from the client, sshd(8) will send a message through the encrypted
    channel to request a response from the client. This setting works in conjunction with ClientAliveCountMax to determine
    the termination of the connection after the threshold has been reached. Note: This setting is not intended to manage idle
    user sessions where there is no input from the client. Its purpose is to monitor for interruptions in network connectivity
    and force the session to terminate after the connection appears to be broken. Note: /etc/ssh/sshd_config will be automatically
    modified to its original state following any update or major upgrade to the operating system.'
  impact: ''
  references: []
  page_start: 45
  audit_raw: 'Verify the macOS system is configured to set the SSHD ClientAliveInterval to 900 with

    the following command:

