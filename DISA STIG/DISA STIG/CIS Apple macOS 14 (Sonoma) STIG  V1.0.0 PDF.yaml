    enforceSmartcard requires allowSmartcard to be set to true in order to work. Satisfies: SRG-OS-000067-GPOS-00035,SRG-OS-000105-GPOS-00052,SRG-OS000106-GPOS-00053,SRG-OS-000107-GPOS-00054,SRG-OS-000108-GPOS00055,SRG-OS-000112-GPOS-00057,SRG-OS-000375-GPOS-00160,SRG-OS000376-GPOS-00161'
