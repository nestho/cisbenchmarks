    user, run the following. [source,bash] CURRENT_USER=$( /usr/sbin/scutil <<< "show State:/Users/ConsoleUser" | /usr/bin/awk
    ''/Name :/ && ! /loginwindow/ { print $3 }'' ) ==== Satisfies: SRG-OS-000080-GPOS-00048,SRG-OS-000095-GPOS-00049'
