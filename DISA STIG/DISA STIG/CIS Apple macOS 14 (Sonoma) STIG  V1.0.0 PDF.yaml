controls:
- id: '1.1'
  title: APPL-14-000001
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The macOS system must prevent Apple Watch from terminating a session lock. GROUP ID: V-259418 RULE ID: SV-259418r958400'
  rationale: Disabling Apple watches is a necessary step to ensuring that the information system retains a session lock until
    the user reestablishes access using authorized identification and authentication procedures.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Verify the macOS system is configured to prevent Apple Watch from terminating a

    session lock with the following command:

    /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')

    .objectForKey(''allowAutoUnlock'').js

    EOS

    If the result is not "false", this is a finding.'
  remediation: 'Configure the macOS system to prevent Apple Watch from terminating a session lock

    by installing the "com.apple.applicationaccess" configuration profile.'
  checks:
  - type: manual_review
    info: 'Verify the macOS system is configured to prevent Apple Watch from terminating a

      session lock with the following command:

      /usr/bin/osascript -l JavaScript << EOS

      $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')

      .objectForKey(''allowAutoUnlock'').js

      EOS

      If the result is not "false", this is a finding.'
    severity: medium
- id: '1.2'
  title: APPL-14-000002
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The macOS system must enforce screen saver password. GROUP ID: V-259419 RULE ID: SV-259419r958400'
  rationale: Users must authenticate when unlocking the screen saver. The screen saver acts as a session lock and prevents
    unauthorized users from accessing the current user's account.
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Verify the macOS system is configured to prompt users to enter a password to unlock

    the screen saver with the following command:

    /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.screensaver'')

    .objectForKey(''askForPassword'').js

    EOS

    If the result is not "true", this is a finding.'
  remediation: 'Configure the macOS system to prompt users to enter a password to unlock the screen

    saver by installing the "com.apple.screensaver" configuration profile.'
  checks:
  - type: manual_review
    info: 'Verify the macOS system is configured to prompt users to enter a password to unlock

      the screen saver with the following command:

      /usr/bin/osascript -l JavaScript << EOS

      $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.screensaver'')

      .objectForKey(''askForPassword'').js

      EOS

      If the result is not "true", this is a finding.'
    severity: medium
- id: '1.3'
  title: APPL-14-000003
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The macOS system must enforce session lock no more than five seconds after screen saver is started. GROUP
    ID: V-259420 RULE ID: SV-259420r958400'
  rationale: A screen saver must be enabled and the system must be configured to require a password to unlock once the screensaver
    has been on for a maximum of five seconds. An unattended system with an excessive grace period is vulnerable to a malicious
    user.
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'Verify the macOS system is configured to initiate a session lock within five seconds of

    the screen saver starting with the following command:

    /usr/bin/osascript -l JavaScript << EOS

    function run() {

    let delay =

    ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName(''com.apple.screensaver'')

    .objectForKey(''askForPasswordDelay''))

    if ( delay <= 5 ) {

    return("true")

    } else {

    return("false")

    }

    }

    EOS

    If the result is not "true", this is a finding.'
  remediation: 'Configure the macOS system to initiate a session lock within five seconds of the screen

    saver starting by installing the "com.apple.screensaver" configuration profile.'
  checks:
  - type: manual_review
    info: 'Verify the macOS system is configured to initiate a session lock within five seconds of

      the screen saver starting with the following command:

      /usr/bin/osascript -l JavaScript << EOS

      function run() {

      let delay =

      ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName(''com.apple.screensaver'')

      .objectForKey(''askForPasswordDelay''))

      if ( delay <= 5 ) {

      return("true")

      } else {

      return("false")

      }

      }

      EOS

      If the result is not "true", this is a finding.'
    severity: medium
- id: '1.4'
  title: APPL-14-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The macOS system must configure user session lock when a smart token is removed. GROUP ID: V-259421 RULE ID:
    SV-259421r1009577'
  rationale: The screen lock must be configured to initiate automatically when the smart token is removed from the system.
    Session locks are temporary actions taken when users stop work and move away from the immediate vicinity of the information
    system but do not want to log out because of the temporary nature of their absence. While a session lock is not an acceptable
    substitute for logging out of an information system for longer periods of time, they prevent a malicious user from accessing
    the information system when a user has removed their smart token.
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'Verify the macOS system is configured to lock the user session when a smart token is

    removed with the following command:

    /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.security.smartcard'')

    .objectForKey(''tokenRemovalAction'').js

    EOS

    If the result is not "1", this is a finding.'
  remediation: 'Configure the macOS system to lock the user session when a smart token is removed

    by installing the "com.apple.security.smartcard" configuration profile.

    Note: To ensure continued access to the operating system, consult the supplemental

    guidance provided with the STIG before applying the configuration profile.'
  checks:
  - type: manual_review
    info: 'Verify the macOS system is configured to lock the user session when a smart token is

      removed with the following command:

      /usr/bin/osascript -l JavaScript << EOS

      $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.security.smartcard'')

      .objectForKey(''tokenRemovalAction'').js

      EOS

      If the result is not "1", this is a finding.'
    severity: medium
- id: '1.5'
  title: APPL-14-000009
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The macOS system must prevent AdminHostInfo from being available at LoginWindow. GROUP ID: V-259423 RULE ID:
    SV-259423r958402'
  rationale: The system must be configured to not display sensitive information at the LoginWindow. The key AdminHostInfo
    when configured will allow the HostName, IP Address, and operating system version and build to be displayed.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Verify the macOS system is configured to prevent AdminHostInfo from being available

    at LoginWindow with the following command:

    /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.loginwindow'')

    .objectIsForcedForKey(''AdminHostInfo'')

    EOS

    If the result is not "false", this is a finding.'
  remediation: 'Configure the macOS system to prevent AdminHostInfo from being available at

    LoginWindow by installing the "com.apple.loginwindow" configuration profile.'
  checks:
  - type: manual_review
    info: 'Verify the macOS system is configured to prevent AdminHostInfo from being available

      at LoginWindow with the following command:

      /usr/bin/osascript -l JavaScript << EOS

      $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.loginwindow'')

      .objectIsForcedForKey(''AdminHostInfo'')

      EOS

      If the result is not "false", this is a finding.'
    severity: medium
- id: '1.6'
  title: APPL-14-000007
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The macOS system must disable hot corners. GROUP ID: V-259422 RULE ID: SV-259422r958404'
  rationale: Hot corners must be disabled. The information system conceals, via the session lock, information previously visible
    on the display with a publicly viewable image. Although hot corners can be used to initiate a session lock or to launch
    useful applications, they can also be configured to disable an automatic session lock from initiating. Such a configuration
    introduces the risk that a user might forget to manually lock the screen before stepping away from the computer.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'Verify the macOS system is configured to disable hot corners with the following

    command:

    /usr/bin/profiles -P -o stdout | /usr/bin/grep -Ec ''"wvous-bl-corner" = 0|"wvous-br-corner"

    = 0|"wvous-tl-corner" = 0|"wvous-tr-corner" = 0''

    If the result is not "4", this is a finding.'
  remediation: 'Configure the macOS system to disable hot corners by installing the

    "com.apple.ManagedClient.preferences" configuration profile.'
  checks:
  - type: manual_review
    info: 'Verify the macOS system is configured to disable hot corners with the following

      command:

      /usr/bin/profiles -P -o stdout | /usr/bin/grep -Ec ''"wvous-bl-corner" = 0|"wvous-br-corner"

      = 0|"wvous-tl-corner" = 0|"wvous-tr-corner" = 0''

      If the result is not "4", this is a finding.'
    severity: medium
- id: '1.7'
  title: APPL-14-000012
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The macOS system must automatically remove or disable temporary or emergency user accounts within 72 hours.
    GROUP ID: V-259424 RULE ID: SV-259424r958364'
  rationale: 'The macOS is able to be configured to set an automated termination for 72 hours or less for all temporary or
    emergency accounts upon account creation. Emergency administrator accounts are privileged accounts established in response
    to crisis situations where the need for rapid account activation is required. Therefore, emergency account activation
    may bypass normal account authorization processes. If these accounts are disabled, system maintenance during emergencies
    may not be possible, thus adversely affecting system availability. Although the ability to create and use emergency administrator
    accounts is necessary for performing system maintenance during emergencies, these accounts present vulnerabilities to
    the system if they are not disabled and removed when they are no longer needed. Configuring the macOS to automatically
    remove or disable emergency accounts within 72 hours of creation mitigates the risks posed if one were to be created and
    accidentally left active once the crisis is resolved. Emergency administrator accounts are different from infrequently
    used accounts (i.e., local logon accounts used by system administrators when network or normal logon is not available).
    Infrequently used accounts also remain available and are not subject to automatic termination dates. However, an emergency
    administrator account is normally a different account created for use by vendors or system maintainers. To address access
    requirements, many operating systems can be integrated with enterprise-level authentication/access mechanisms that meet
    or exceed access control policy requirements. If temporary or emergency user accounts remain active when no longer needed
    or for an excessive period, these accounts may be targeted by attackers to gain unauthorized access. To mitigate this
    risk, automated termination of all temporary or emergency accounts must be set to 72 hours (or less) when the temporary
    or emergency account is created. If no policy is enforced by a directory service, a password policy can be set with the
    "pwpolicy" utility. The variable names may vary depending on how the policy was set. External - General If there are no
    temporary or emergency accounts defined on the system, this is Not Applicable. Satisfies: SRG-OS-000002-GPOS-00002,SRG-OS-000123-GPOS-00064'
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'Verify if a password policy is enforced by a directory service by asking the system

    administrator (SA) or information system security officer (ISSO).

    If no policy is enforced by a directory service, a password policy can be set with the

    "pwpolicy" utility. The variable names may vary depending on how the policy was set.

    If there are no temporary or emergency accounts defined on the system, this is Not

    Applicable.

    To check if the password policy is configured to disable a temporary or emergency

    account after 72 hours, run the following command to output the password policy to the

    screen, substituting the correct user name in place of username:

    /usr/bin/pwpolicy -u username getaccountpolicies | tail -n +2

    If there is no output, and password policy is not controlled by a directory service, this is

    a finding.

    Otherwise, look for the line "policyCategoryAuthentication".

    In the array that follows, there should be a section that contains a check that allows

    users to log in if "policyAttributeCurrentTime" is less than the result of adding

    "policyAttributeCreationTime" to 72 hours (259299 seconds). The check might use a

    variable defined in its "policyParameters" section.

    If the check does not exist or if the check adds too great an amount of time to

    "policyAttributeCreationTime", this is a finding.'
  remediation: 'This setting may be enforced using local policy or by a directory service.

    To set local policy to disable a temporary or emergency user, create a plain text file

    containing the following:

    After saving the file and exiting to the command prompt, run the following command to

    load the new policy file, substituting the correct user name in place of "username" and

    the path to the file in place of "/path/to/file".

    /usr/bin/pwpolicy -u username setaccountpolicies /path/to/file'
  checks:
  - type: manual_review
    info: 'Verify if a password policy is enforced by a directory service by asking the system

      administrator (SA) or information system security officer (ISSO).

      If no policy is enforced by a directory service, a password policy can be set with the

      "pwpolicy" utility. The variable names may vary depending on how the policy was set.

      If there are no temporary or emergency accounts defined on the system, this is Not

      Applicable.

      To check if the password policy is configured to disable a temporary or emergency

      a'
    severity: medium
- id: '1.8'
  title: APPL-14-000014
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The macOS system must enforce time synchronization. GROUP ID: V-259425 RULE ID: SV-259425r1038944'
  rationale: 'Time synchronization must be enforced on all networked systems. This rule ensures the uniformity of time stamps
    for information systems with multiple system clocks and systems connected over a network. Satisfies: SRG-OS-000355-GPOS-00143,SRG-OS-000356-GPOS-00144'
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'Verify the macOS system is configured to enforce time synchronization with the

    following command:

    /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.timed'')

    .objectForKey(''TMAutomaticTimeOnlyEnabled'').js

    EOS

    If the result is not "true", this is a finding.'
  remediation: 'Configure the macOS system to enforce time synchronization by installing the

    "com.apple.timed" configuration profile.'
  checks:
  - type: manual_review
    info: 'Verify the macOS system is configured to enforce time synchronization with the

      following command:

      /usr/bin/osascript -l JavaScript << EOS

      $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.timed'')

      .objectForKey(''TMAutomaticTimeOnlyEnabled'').js

      EOS

      If the result is not "true", this is a finding.'
    severity: medium
- id: '1.9'
  title: APPL-14-000022
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The macOS system must limit consecutive failed log on attempts to three. GROUP ID: V-259428 RULE ID: SV-259428r958388'
  rationale: 'The macOS must be configured to limit the number of failed log on attempts to a maximum of three. When the maximum
    number of failed attempts is reached, the account must be locked for a period of time after. This rule protects against
    malicious users attempting to gain access to the system via brute-force hacking methods. Satisfies: SRG-OS-000021-GPOS-00005,SRG-OS-000329-GPOS-00128'
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'Verify the macOS system is configured to limit consecutive failed log on attempts to

    three with the following command:

    /usr/bin/pwpolicy -getaccountpolicies 2> /dev/null | /usr/bin/tail +2 | /usr/bin/xmllint --

    xpath ''//dict/key[text()="policyAttributeMaximumFailedAuthentications"]/followingsibling::integer[1]/text()'' - | /usr/bin/awk
    ''{ if ($1 <= 3) {print "yes"} else {print "no"}}''

    If the result is not "yes", this is a finding.'
  remediation: 'Configure the macOS system to limit consecutive failed log on attempts to three by

    installing the "com.apple.mobiledevice.passwordpolicy" configuration profile or by a

    directory service.'
  checks:
  - type: manual_review
    info: 'Verify the macOS system is configured to limit consecutive failed log on attempts to

      three with the following command:

      /usr/bin/pwpolicy -getaccountpolicies 2> /dev/null | /usr/bin/tail +2 | /usr/bin/xmllint --

      xpath ''//dict/key[text()="policyAttributeMaximumFailedAuthentications"]/followingsibling::integer[1]/text()'' - | /usr/bin/awk
      ''{ if ($1 <= 3) {print "yes"} else {print "no"}}''

      If the result is not "yes", this is a finding.'
    severity: medium
- id: '1.10'
  title: APPL-14-000023
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The macOS system must display the Standard Mandatory DOD Notice and Consent Banner at remote log on. GROUP
    ID: V-259429 RULE ID: SV-259429r958390'
  rationale: 'Displaying a standardized and approved use notification before granting access to the operating system ensures
    that users are provided with privacy and security notification verbiage that is consistent with applicable federal laws,
    Executive Orders, directives, policies, regulations, standards, and guidance. System use notifications are required only
    for access via logon interfaces with human users and are not required when such human interfaces do not exist. The banner
    must be formatted in accordance with DTM-08-060. Satisfies: SRG-OS-000023-GPOS-00006,SRG-OS-000024-GPOS-00007 External
    - General'
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'Verify the macOS system is configured to display the Standard Mandatory DOD Notice

    and Consent Banner before granting remote access to the operating system.

    Verify the operating system has the correct text listed in the "/etc/banner" file with the

    following command:

    /usr/bin/more /etc/banner

    The command must return the following text:

    "You are accessing a U.S. Government (USG) Information System (IS) that is provided

    for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent to the

    following conditions:

    -The USG routinely intercepts and monitors communications on this IS for purposes

    including, but not limited to, penetration testing, COMSEC monitoring, network

    operations and defense, personnel misconduct (PM), law enforcement (LE), and

    counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are subject to routine

    monitoring, interception, and search, and may be disclosed or used for any USGauthorized purpose.

    -This IS includes security measures (e.g., authentication and access controls) to protect

    USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI

    investigative searching or monitoring of the content of privileged communications, or

    work product, related to personal representation or services by attorneys,

    psychotherapists, or clergy, and their assistants. Such communications and work

    product are private and confidential. See User Agreement for details."

    If the operating system does not display a logon banner before granting remote access

    or the banner does not match the Standard Mandatory DOD Notice and Consent

    Banner, this is a finding.

    If the text in the "/etc/banner" file does not match the Standard Mandatory DOD Notice

    and Consent Banner, this is a finding.'
  remediation: 'Configure the macOS system to display the Standard Mandatory DOD Notice and

    Consent Banner before granting remote access to the operating system by creating a

    text file containing the required DOD text.

    Name the file "banner" and place it in "/etc/".'
  checks:
  - type: manual_review
    info: 'Verify the macOS system is configured to display the Standard Mandatory DOD Notice

      and Consent Banner before granting remote access to the operating system.

      Verify the operating system has the correct text listed in the "/etc/banner" file with the

      following command:

      /usr/bin/more /etc/banner

      The command must return the following text:

      "You are accessing a U.S. Government (USG) Information System (IS) that is provided

      for USG-authorized use only.

      By using this IS (which includes any device attach'
    severity: medium
- id: '1.11'
  title: APPL-14-000024
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The macOS system must enforce SSH to display the Standard Mandatory DOD Notice and Consent Banner. GROUP ID:
    V-259430 RULE ID: SV-259430r958390'
  rationale: 'Displaying a standardized and approved use notification before granting access to the operating system ensures
    that users are provided with privacy and security notification verbiage that is consistent with applicable federal laws,
    Executive Orders, directives, policies, regulations, standards, and guidance. System use notifications are required only
    for access via logon interfaces with human users and are not required when such human interfaces do not exist. The banner
    must be formatted in accordance with DTM-08-060. Note: /etc/ssh/sshd_config will be automatically modified to its original
    state following any update or major upgrade to the operating system. Satisfies: SRG-OS-000023-GPOS-00006,SRG-OS-000024-GPOS-00007'
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'Verify the macOS system is configured to display the contents of "/etc/banner" before

    granting access to the system with the following command:

    /usr/sbin/sshd -G | /usr/bin/grep -c "^banner /etc/banner"

    If the command does not return "1", this is a finding.'
  remediation: 'Configure the macOS system to display the contents of "/etc/banner" before granting

    access to the system by creating a plain text file in the /private/etc/ssh/sshd_config.d/

    directory containing the following:

    banner /etc/banner'
  checks:
  - type: manual_review
    info: 'Verify the macOS system is configured to display the contents of "/etc/banner" before

      granting access to the system with the following command:

      /usr/sbin/sshd -G | /usr/bin/grep -c "^banner /etc/banner"

      If the command does not return "1", this is a finding.'
    severity: medium
- id: '1.12'
  title: APPL-14-000025
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The macOS system must display the Standard Mandatory DOD Notice and Consent Banner at the login window. GROUP
    ID: V-259431 RULE ID: SV-259431r958390'
  rationale: 'Displaying a standardized and approved use notification before granting access to the operating system ensures
    that users are provided with privacy and security notification verbiage that is consistent with applicable federal laws,
    Executive Orders, directives, policies, regulations, standards, and guidance. System use notifications are required only
    for access via logon interfaces with human users and are not required when such human interfaces do not exist. The policy
    banner will show if a "PolicyBanner.rtf" or "PolicyBanner.rtfd" exists in the "/Library/Security" folder. The banner must
    be formatted in accordance with DTM-08-060. Satisfies: SRG-OS-000023-GPOS-00006,SRG-OS-000024-GPOS-00007,SRG-OS000228-GPOS-00088
    External - General'
  impact: ''
  references: []
  page_start: 35
  audit_raw: 'Verify the macOS system is configured to display a policy banner with the following

    command:

    /bin/ls -ld /Library/Security/PolicyBanner.rtf* | /usr/bin/wc -l | /usr/bin/tr -d '' ''

    If "PolicyBanner.rtfd" does not exist, this is a finding.

    If the permissions for "PolicyBanner.rtfd" are not "644", this is a finding.

    The banner text of the document must read:

    "You are accessing a U.S. Government (USG) Information System (IS) that is provided

    for USG-authorized use only. By using this IS (which includes any device attached to

    this IS), you consent to the following conditions:

    -The USG routinely intercepts and monitors communications on this IS for purposes

    including, but not limited to, penetration testing, COMSEC monitoring, network

    operations and defense, personnel misconduct (PM), law enforcement (LE), and

    counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are subject to routine

    monitoring, interception, and search, and may be disclosed or used for any USG

    authorized purpose.

    -This IS includes security measures (e.g., authentication and access controls) to protect

    USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI

    investigative searching or monitoring of the content of privileged communications, or

    work product, related to personal representation or services by attorneys,

    psychotherapists, or clergy, and their assistants. Such communications and work

    product are private and confidential. See User Agreement for details."

    If the text is not worded exactly this way, this is a finding.'
  remediation: 'Configure the macOS system to display a policy banner by creating an RTF file

    containing the required text. Name the file "PolicyBanner.rtfd" and place it in

    "/Library/Security/".

    Update the permissions of the "/Library/Security/PolicyBanner.rtfd" file with the following

    command:

    /usr/bin/sudo /bin/chmod 644 /Library/Security/PolicyBanner.rtfd'
  checks:
  - type: manual_review
    info: 'Verify the macOS system is configured to display a policy banner with the following

      command:

      /bin/ls -ld /Library/Security/PolicyBanner.rtf* | /usr/bin/wc -l | /usr/bin/tr -d '' ''

      If "PolicyBanner.rtfd" does not exist, this is a finding.

      If the permissions for "PolicyBanner.rtfd" are not "644", this is a finding.

      The banner text of the document must read:

      "You are accessing a U.S. Government (USG) Information System (IS) that is provided

      for USG-authorized use only. By using this IS (which includ'
    severity: medium
- id: '1.13'
  title: APPL-14-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The macOS system must configure audit log files to not contain access control lists. GROUP ID: V-259432 RULE
    ID: SV-259432r958434'
  rationale: 'The audit log files must not contain access control lists (ACLs). This rule ensures that audit information and
