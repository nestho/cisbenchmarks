- id: '1.12'
  title: ARST-ND-000600
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista network device must be configured to synchronize internal system clocks using redundant authenticated
    time sources. GROUP ID: V-255958 RULE ID: SV-255958r1015711'
  rationale: 'The loss of connectivity to a particular authoritative time source will result in the loss of time synchronization
    (free-run mode) and increasingly inaccurate time stamps on audit events and other functions. Multiple time sources provide
    redundancy by including a secondary source. Time synchronization is usually a hierarchy; clients synchronize time to a
    local source while that source synchronizes its time to a more accurate source. The network device must utilize an authoritative
    time server and/or be configured to use redundant authoritative time sources. This requirement is related to the comparison
    done in CCI-001891. DOD-approved solutions consist of a combination of a primary and secondary time source using a combination
    or multiple instances of the following: a time server designated for the appropriate DOD network (NIPRNet/SIPRNet); United
    States Naval Observatory (USNO) time servers; and/or the Global Positioning System (GPS). The secondary time source must
    be located in a different geographic region than the primary time source. Satisfies: SRG-APP-000373-NDM-000298, SRG-APP-000374-NDM-000299,
    SRGAPP-000375-NDM-000300, SRG-APP-000395-NDM-000347'
  impact: ''
  references: []
  page_start: 37
  audit_raw: 'Determine if the network device is configured to synchronize internal information system

    clocks with authenticated primary and secondary time sources.

    Verify the Arista network device configuration with the following example:

    switch# show running-config | section ntp

    ntp authentication-key 12 sha1 7 06131C2058470A58

    ntp trusted-key 12

    ntp authenticate servers

    ntp local-interface Management1

    ntp server 192.168.16.36 prefer key 12

    ntp server 192.168.16.37 key 12

    If the Arista network device is not configured to synchronize internal system clocks with

    the primary and secondary time sources, this is a finding.

    If the Arista network device does not authenticate Network Time Protocol sources using

    authentication that is cryptographically based, this is a finding.'
  remediation: 'Configure the Arista network device for at least two trusted time sources and to use

    cryptographic authentication with the following command example:

    switch#config

    switch(config)#ntp authentication-key 12 sha1 0 <key>

    switch(config)#ntp trusted-key 12

    switch(config)#ntp authenticate servers

    switch(config)#ntp local-interface Management1

    switch(config)#ntp server 192.168.16.36 prefer key 12

    switch(config)#ntp server 192.168.16.37 key 12

    switch(config)#exit

    Configure the local time zone for the device.

    switch#config

    switch(config)#clock timezone <timezone>

    switch(config)#exit'
  checks:
  - type: sql
    command: show running-config | section ntp
    severity: medium
    info: 'Determine if the network device is configured to synchronize internal information system

      clocks with authenticated primary and secondary time sources.

      Verify the Arista network device configuration with the following example:

      switch# show running-config | section ntp

      ntp authentication-key 12 sha1 7 06131C2058470A58

      ntp trusted-key 12

      ntp authenticate servers

      ntp local-interface Management1

      ntp se'
- id: '1.13'
  title: ARST-ND-000660
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista network device must be configured to authenticate SNMP messages using a FIPS-validated Keyed-Hash
    Message Authentication Code (HMAC). GROUP ID: V-255959 RULE ID: SV-255959r961506'
  rationale: Without authenticating devices, unidentified or unknown devices may be introduced, thereby facilitating malicious
    activity. Bidirectional authentication provides stronger safeguards to validate the identity of other devices for connections
    that are of greater risk. A local connection is any connection with a device communicating without the use of a network.
    A network connection is any connection with a device that communicates through a network (e.g., local area or wide area
    network, internet). A remote connection is any connection with a device communicating through an external network (e.g.,
    the internet). Because of the challenges of applying this requirement on a large scale, organizations are encouraged to
    only apply the requirement to those limited number (and type) of devices that truly need to support this capability.
  impact: ''
  references: []
  page_start: 40
  audit_raw: 'Review the network device configuration to verify SNMP messages are authenticated

    using a FIPS-validated HMAC.

