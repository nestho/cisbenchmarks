  remediation: "Configure the Arista network device to obtain its public key certificates from an\nappropriate certificate\
    \ policy through an approved service provider.\nStep 1: Configure the Arista network device by following the steps outlined\
    \ in the Arista\nMilitary Unique Deployment Guide to generate the DOD PKI certificate signing request\n[switch.csr] for\
    \ submission to DOD PKI CA. Example configuration:\nswitch#security pki certificate generate signing-request key rsa1.key\n\
