- id: '1.11'
  title: ARST-ND-000550
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'If the Arista network device uses role-based access control, the network device must enforce organization-defined
    role-based access control policies over defined subjects and objects. GROUP ID: V-255957 RULE ID: SV-255957r987662'
  rationale: 'Organizations can create specific roles based on job functions and the authorizations (i.e., privileges) to
    perform needed operations on organizational information systems associated with the organization-defined roles. When administrators
    are assigned to the organizational roles, they inherit the authorizations or privileges defined for those roles. Role-based
    access control (RBAC) simplifies privilege administration for organizations because privileges are not assigned directly
    to every administrator (which can be a significant number of individuals for mid- to large-size organizations) but are
    instead acquired through role assignments. RBAC can be implemented either as a mandatory or discretionary form of access
    control. The RBAC policies and the subjects and objects are defined uniquely for each network device, so they cannot be
    specified in the requirement. Satisfies: SRG-APP-000329-NDM-000287, SRG-APP-000380-NDM-000304'
  impact: ''
