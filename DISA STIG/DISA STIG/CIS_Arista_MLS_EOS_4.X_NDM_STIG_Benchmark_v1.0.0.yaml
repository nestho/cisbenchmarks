    Email addresses (space separated) for use in subject-alternative-name:\n-----BEGIN CERTIFICATE REQUEST-----\nMIIC6DCCAdACAQAwgYAxCzAJBgNVBAYTAlVTMQswCQYDVQQIDAJBWjEUMBIGA1UE\n\
    BwwLRnQgSHVhY2h1Y2ExGzAZBgNVBAoMEkNPTlRSQUNUT1IsUEtJLERvRDEYMBYG\nA1UECwwPVS5TLiBHT1ZFUk5NRU5UMRcwFQYDVQQDDA4xOTIuMTY4LjI0MC4yMzCC\n\
    i7TGBvhm5PTbfAzBma8/hSlsBGJ0qnOteb1Zaw== <Abbreviated Output Due to Size>\n-----END CERTIFICATE REQUEST-----\nStep 2:\
    \ Once the DOD PKI signed certificates are received, CA Root Certificate and\nIntermediate Certificates obtained from\
    \ CA must be uploaded onto the Arista network\ndevice directory of /certificate: The certificate's transfer can be accomplished\
    \ by SCP or\nUSB. The detail configuration can be found in the Arista Military Unique Deployment\nGuide in the section\
    \ \"Configuring RSA SecureID with OTP Management\".\nThe following commands copy the certificates using device USB1: to\
    \ directory of the\ncertificate:\nswitch#copy usb1:Arista-23.pem certificate:\nCopy completed successfully.\nswitch#copy\
    \ usb1: CA-60.crt certificate:\nCopy completed successfully.\nswitch#copy usb1: DODDISASWCA_60.crt certificate:\nCopy\
    \ completed successfully.\n!\nThe following commands verify all three certificates are correctly copied to the certificate\n\
    directory:\nswitch#directory certificate\nswitch#dir certificate:\nDirectory of certificate:/\n -rw- 2025 Aug 11 10:52\
    \ CA-60.crt\n -rw- 2110 Aug 11 10:52 ARISTA_SIGNING_CA.crt\n -rw- 1724 Aug 9 14:35 DODDISASWCA_60.crt\n -rw- 1722 Aug\
    \ 12 09:38 arista-b64.cer\n -rw- 1696 Aug 12 14:35 Arista-23.pem\n -rw- 1696 Aug 12 14:36 intCert.pem\n!\nThe following\
    \ commands configure the SSL-profile using the PKI certificates on the\nswitch with the RSA SecureID server and trust\
    \ chain:\nswitch(config)#management security\nswitch(config-mgmt-security)#ssl profile RSA01\nswitch(config-mgmt-sec-ssl-profile-RSA01)#tls\
    \ versions 1.2\nswitch(config-mgmt-sec-ssl-profile-RSA01)#certificate Arista-23.pem key\nrsa1.key\nswitch(config-mgmt-sec-ssl-profile-RSA01)#trust\
    \ certificate Arista-23.pem\nswitch(config-mgmt-sec-ssl-profile-RSA01)#trust certificate\nDODDISASWCA_60.crt\nswitch(config-mgmt-sec-ssl-profile-RSA01)#chain\
    \ certificate CA-60.cer\nswitch(config-mgmt-sec-ssl-profile-RSA01)#show active\nmanagement security\n ssl profile RSA01\n\
    \ tls versions 1.2\n certificate Arista-23.pem.pem key rsa1.key\n trust certificate certificate Arista-23.pem\n trust\
    \ certificate CA-60.cer\n trust certificate DODDISASWCA_60.crt\n chain certificate CA-60.crt\nradius-server tls ssl-profile\
    \ RSA01\n!\nStep 3: Configure the switch RadSec Proxy server and RSA SecureID server IP\naddress and RADIUS attribute\
    \ configuration for ssl-profile RSA01.\nswitch(config)#radius-server tls ssl-profile RSA01\nswitch(config)#radius-server\
    \ host 192.168.16.102 key 7 09595D080D0C1453\nswitch(config)#radius-server host 192.168.16.55 key 7 120C161606020F45\n\
    switch(config)#radius-server host 192.168.16.55 tls\nswitch(config)#aaa group server radius RADsecProxy\n server 192.168.16.55\
    \ tls\n!\nStep 4: Configure the AAA authentication and authorization parameters for SSL-profile\nand RadSec Proxy Server.\n\
    switch(config)#no aaa root\nswitch(config)#aaa authorization policy local default-role aristaadmin\nswitch(config)#logging\
    \ level AAA informational\nswitch(config)#aaa group server radius RADsecProxy\n server 192.168.16.55 tls\nswitch(config)#aaa\
    \ group server radius TIC1\n server 192.168.16.103\nswitch(config)#aaa authentication login default local group RADsecProxy\n\
    switch(config)#aaa authentication login console local\nswitch(config)#aaa authentication policy on-success log\nswitch(config)#aaa\
    \ authentication policy on-failure log\nswitch(config)#aaa authorization exec default local group RADsecProxy\nswitch(config)#aaa\
    \ authorization commands all default local\nswitch(config)#aaa accounting commands all default start-stop logging group\n\
    radius\nswitch(config)#write\n!\nStep 5: Verify the AAA configuration to ensure all parameters from the previous step\
