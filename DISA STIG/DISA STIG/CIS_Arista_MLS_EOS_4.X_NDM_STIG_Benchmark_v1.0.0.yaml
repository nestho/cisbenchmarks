controls:
- id: '1.1'
  title: ARST-ND-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista network device must limit the number of concurrent sessions to an organization-defined number for
    each administrator account and/or administrator account type. GROUP ID: V-255947 RULE ID: SV-255947r960735'
  rationale: Device management includes the ability to control the number of administrators and management sessions that manage
    a device. Limiting the number of allowed administrators and sessions per administrator based on account type, role, or
    access type is helpful in limiting risks related to denial-of-service (DoS) attacks. This requirement addresses concurrent
    sessions for administrative accounts and does not address concurrent sessions by a single administrator via multiple administrative
    accounts. The maximum number of concurrent sessions must be defined based upon mission needs and the operational environment
    for each system. At a minimum, limits must be set for SSH, HTTPS, account of last resort, and root account sessions.
  impact: ''
  references: []
  page_start: 11
  audit_raw: "Verify the device is configured to limit the number of concurrent management sessions\nwith the following commands:\n\
    switch#sh run | section management ssh\nmanagement ssh\n connection limit 5\n!\nIf the Arista network device is not configured\
    \ to limit the number of SSH concurrent\nsessions, this is a finding."
  remediation: 'Configure the switch to limit SSH concurrent connections to the device with the

    following commands:

    switch#configure

    switch(config)#management ssh

    switch(config-mgmt-ssh)#connection limit 5

    switch(config-mgmt-ssh)#exit

    switch#wr

    !'
  checks:
  - type: manual_review
    info: "Verify the device is configured to limit the number of concurrent management sessions\nwith the following commands:\n\
      switch#sh run | section management ssh\nmanagement ssh\n connection limit 5\n!\nIf the Arista network device is not\
      \ configured to limit the number of SSH concurrent\nsessions, this is a finding."
    severity: medium
- id: '1.2'
  title: ARST-ND-000110
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista network device must enforce approved authorizations for controlling the flow of management information
    within the network device based on information flow control policies. GROUP ID: V-255948 RULE ID: SV-255948r991781'
  rationale: A mechanism to detect and prevent unauthorized communication flow must be configured or provided as part of the
    system design. If management information flow is not enforced based on approved authorizations, the network device may
    become compromised. Information flow control regulates where management information is allowed to travel within a network
    device. The flow of all management information must be monitored and controlled so it does not introduce any unacceptable
    risk to the network device or data. Application-specific examples of enforcement occur in systems that employ rule sets
    or establish configuration settings that restrict information system services or messagefiltering capability based on
    message content (e.g., implementing key word searches or using document characteristics). Applications providing information
    flow control must be able to enforce approved authorizations for controlling the flow of management information within
    the system in accordance with applicable policy.
  impact: ''
  references: []
  page_start: 13
  audit_raw: "Verify the Arista network device is configured with access control lists to control the flow\nof management\
    \ information.\nStep 1: Verify SSH has an inbound ACL applied as shown in the example below.\nsh run | sec management\
    \ ssh\n ip access-group MGMT_NETWORK in\nStep 2: Verify the ACL permits only hosts from the management network to access\
    \ the\ndevice.\nsh run | sec access-list MGMT_NETWORK\n ip access-list MGMT_NETWORK\n 10 permit ip 10.1.12.0/24 any\n\
    \ 20 deny ip any any log\nIf the Arista network device is not configured to enforce approved authorizations for\ncontrolling\
    \ the flow of management information within the device based on control\npolicies, this is a finding."
  remediation: 'Step 1: Configure an ACL for SSH access using the following commands:

    switch(config)#ip access-list MGMT_NETWORK

    switch(config-acl-MGMT_NETWORK)#10 permit ip 10.1.12.0/24 any

    switch(config-acl-MGMT_NETWORK)#20 deny ip any any log

    switch(config-acl-MGMT_NETWORK)#exit

    Step 2: Apply the ACL to management ssh.

    switch(config)#management ssh

    switch(config-mgmt-ssh)#ip access-group MGMT_NETWORK in

    switch(config-mgmt-ssh)#exit'
  checks:
  - type: manual_review
    info: "Verify the Arista network device is configured with access control lists to control the flow\nof management information.\n\
      Step 1: Verify SSH has an inbound ACL applied as shown in the example below.\nsh run | sec management ssh\n ip access-group\
      \ MGMT_NETWORK in\nStep 2: Verify the ACL permits only hosts from the management network to access the\ndevice.\nsh\
      \ run | sec access-list MGMT_NETWORK\n ip access-list MGMT_NETWORK\n 10 permit ip 10.1.12.0/24 any\n 20 deny ip any\
      \ any log\nIf the Arista network device"
    severity: medium
- id: '1.3'
  title: ARST-ND-000120
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista network device must be configured to enforce the limit of three consecutive invalid logon attempts,
    after which time it must block any login attempt for 15 minutes. GROUP ID: V-255949 RULE ID: SV-255949r960840'
  rationale: By limiting the number of failed login attempts, the risk of unauthorized system access via user password guessing,
    otherwise known as brute-forcing, is reduced.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Verify the Arista device is configured to enforce the limit of three consecutive invalid

    logon attempts with the following command:

    switch#show running-config | section aaa

    aaa authentication policy lockout failure 3

    duration 900

    If the Arista device is not configured to enforce the limit of three consecutive invalid

    logon attempts, this is a finding.'
  remediation: 'Configure the account lockout policy using the following commands:

    switch(config)#aaa authentication policy lockout failure 3

    switch(config)#duration 900

    switch(config)#exit'
  checks:
  - type: sql
    command: show running-config | section aaa
    severity: medium
    info: 'Verify the Arista device is configured to enforce the limit of three consecutive invalid

      logon attempts with the following command:

      switch#show running-config | section aaa

      aaa authentication policy lockout failure 3

      duration 900

      If the Arista device is not configured to enforce the limit of three consecutive invalid

      logon attempts, this is a finding.'
- id: '1.4'
  title: ARST-ND-000130
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista network device must display the Standard Mandatory DOD Notice and Consent Banner before granting
    access to the device. GROUP ID: V-255950 RULE ID: SV-255950r960843'
  rationale: 'Display of the DOD-approved use notification before granting access to the network device ensures privacy and
    security notification verbiage used is consistent with applicable federal laws, Executive Orders, directives, policies,
    regulations, standards, and guidance. System use notifications are required only for access via logon interfaces with
    human users. Satisfies: SRG-APP-000068-NDM-000215, SRG-APP-000069-NDM-000216'
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Verify the Arista network device is configured to present a DOD-approved banner that is

    formatted in accordance with DTM-08-060.

    Verify the Arista device uses the following verbiage for applications that can

    accommodate banners of 1300 characters by using the following command:

    switch#show configuration | section banner

    "You are accessing a U.S. Government (USG) Information System (IS) that is provided

    for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent to the

    following conditions:

    -The USG routinely intercepts and monitors communications on this IS for purposes

    including, but not limited to, penetration testing, COMSEC monitoring, network

    operations and defense, personnel misconduct (PM), law enforcement (LE), and

    counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are subject to routine

    monitoring, interception, and search, and may be disclosed or used for any USGauthorized purpose.

    -This IS includes security measures (e.g., authentication and access controls) to protect

    USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI

    investigative searching or monitoring of the content of privileged communications, or

    work product, related to personal representation or services by attorneys,

    psychotherapists, or clergy, and their assistants. Such communications and work

    product are private and confidential. See User Agreement for details."

    Use the following verbiage for operating systems that have severe limitations on the

    number of characters that can be displayed in the banner:

    "I''ve read & consent to terms in IS user agreem''t."

    If the Arista device does not display such a banner, this is a finding.'
  remediation: 'Configure the Arista network device to display the Standard Mandatory DOD Notice and

    Consent Banner before granting access to the device.

    switch(config)#banner login

    Enter TEXT message.

    <Insert banner here>

    Type ''EOF'' on its own line to end.'
  checks:
  - type: sql
    command: show configuration | section banner
    severity: medium
    info: 'Verify the Arista network device is configured to present a DOD-approved banner that is

      formatted in accordance with DTM-08-060.

      Verify the Arista device uses the following verbiage for applications that can

      accommodate banners of 1300 characters by using the following command:

      switch#show configuration | section banner

      "You are accessing a U.S. Government (USG) Information System (IS) that is pro'
- id: '1.5'
  title: ARST-ND-000150
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista network device must be configured to audit all administrator activity. GROUP ID: V-255951 RULE
    ID: SV-255951r960777'
  rationale: 'This requirement supports non-repudiation of actions taken by an administrator and is required in order to maintain
    the integrity of the configuration management process. All configuration changes to the network device are logged, and
    administrators authenticate with two-factor authentication before gaining administrative access. Together, these processes
    will ensure the administrators can be held accountable for the configuration changes they implement. Satisfies: SRG-APP-000026-NDM-000208,
    SRG-APP-000027-NDM-000209, SRGAPP-000028-NDM-000210, SRG-APP-000029-NDM-000211, SRG-APP-000080-NDM000220, SRG-APP-000091-NDM-000223,
    SRG-APP-000101-NDM-000231, SRG-APP000319-NDM-000283, SRG-APP-000343-NDM-000289, SRG-APP-000495-NDM000318, SRG-APP-000499-NDM-000319,
    SRG-APP-000503-NDM-000320, SRG-APP000504-NDM-000321, SRG-APP-000506-NDM-000323'
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'Verify the Arista network device is configured to audit all administrator activity.

    Verify the AAA logging settings in the configuration file with the following example:

    switch#show running-config | section aaa

    aaa authentication policy on-success log

    aaa authentication policy on-failure log

    aaa accounting exec default start-stop group radius logging

    aaa accounting system default start-stop group radius logging

    aaa accounting commands all default start-stop logging group radius

    If the Arista network device is not configured to audit all administrator activity, this is a

    finding.'
  remediation: 'Configure the Arista network device to audit all administrator activity.

    Configure the AAA settings to capture administrator activity events.

    switch(config)#aaa authentication policy on-success log

    switch(config)#aaa authentication policy on-failure log

    switch(config)#aaa accounting exec default start-stop group radius logging

    switch(config)#aaa accounting system default start-stop group radius logging

    switch(config)#aaa accounting commands all default start-stop logging group

    radius'
  checks:
  - type: sql
    command: show running-config | section aaa
    severity: medium
    info: 'Verify the Arista network device is configured to audit all administrator activity.

      Verify the AAA logging settings in the configuration file with the following example:

      switch#show running-config | section aaa

      aaa authentication policy on-success log

      aaa authentication policy on-failure log

      aaa accounting exec default start-stop group radius logging

      aaa accounting system default start-stop group '
- id: '1.6'
  title: ARST-ND-000340
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Arista network device must be configured to prohibit the use of all unnecessary and/or nonsecure functions,
    ports, protocols, and/or services. GROUP ID: V-255952 RULE ID: SV-255952r1043177'
  rationale: To prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized tunneling
    (i.e., embedding of data types within data types), organizations must disable unused or unnecessary physical and logical
    ports/protocols on information systems. Network devices are capable of providing a wide variety of functions and services.
    Some of the functions and services provided by default may not be necessary to support essential organizational operations.
    Additionally, it is sometimes convenient to provide multiple services from a single component (e.g., email and web services);
    however, doing so increases risk over limiting the services provided by any one component. To support the requirements
    and principles of least functionality, the network device must support the organizational requirements providing only
    essential capabilities and limiting the use of ports, protocols, and/or services to only those required, authorized, and
    approved. Some network devices have capabilities enabled by default; if these capabilities are not necessary, they must
    be disabled. If a particular capability is used, then it must be documented and approved.
  impact: ''
  references: []
  page_start: 22
  audit_raw: "Verify the Arista network device has telnet and https disabled.\nStep 1: Determine if telnet is disabled with\
    \ the following command:\nswitch#show management telnet\nTelnet status for Default VRF is disabled\nTelnet session limit\
    \ is 20\nTelnet session limit per host is 20\nIf telnet is enabled, this is a finding.\nStep 2: Determine if https is\
    \ disabled with the following command:\nswitch#show management http-server\nSSL Profile: none\nFIPS Mode: No\nQoS DSCP:\
    \ 0\nLogLevel: none\nCSP Frame Ancestor: None\nTLS Protocols: 1.0 1.1 1.2\n VRF Server Status Enabled Services\n-------------------------------------------------------\n\
    \ default HTTPS: port 443 http-commands\nIf Enabled Services in the output shows http-commands, this is a finding."
  remediation: 'Configure the Arista network device to prohibit the use of all unnecessary and/or

    nonsecure functions, ports, protocols, and/or services.

    Step 1: Disable telnet with the following command:

    switch#config

    switch(config)#management telnet

    switch(config-mgmt-telnet)#shutdown

    switch(config-mgmt-telnet)#exit

    switch(config)#exit

    Step 2: Disable https with the following command:

    switch#config

    switch(config)#management api http-commands

    switch(config-mgmt-api-http-commands)#shutdown

    switch(config-mgmt-api-http-commands)#exit

    switch(config)#exit'
  checks:
  - type: sql
    command: show management telnet
    severity: medium
    info: 'Verify the Arista network device has telnet and https disabled.

      Step 1: Determine if telnet is disabled with the following command:

      switch#show management telnet

      Telnet status for Default VRF is disabled

      Telnet session limit is 20

      Telnet session limit per host is 20

      If telnet is enabled, this is a finding.

      Step 2: Determine if https is disabled with the following command:

      switch#show management ht'
- id: '1.7'
  title: ARST-ND-000350
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista network device must be configured with only one local account to be used as the account of last
    resort in the event the authentication server is unavailable. GROUP ID: V-255953 RULE ID: SV-255953r1051115'
  rationale: Authentication for administrative (privileged level) access to the device is required at all times. An account
    can be created on the device's local database for use when the authentication server is down or connectivity between the
    device and the authentication server is not operable. This account is referred to as the account of last resort since
    it is intended to be used as a last resort and when immediate administrative access is absolutely necessary. The account
    of last resort logon credentials must be stored in a sealed envelope and kept in a safe. The safe must be periodically
    audited to verify the envelope remains sealed. The signature of the auditor and the date of the audit should be added
    to the envelope as a record. Administrators should secure the credentials and disable the root account (if possible) when
    not needed for system administration functions.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'Step 1: Verify on the Arista network device that an account of last resort is configured

    using the following command:

    switch#sh running-config | section username

    username Emergency-Admin privilege 15 role network-admin secret sha512

    $6$ObuWg.Eu7DwGD8k/$EgT0uI.hLrStrmxUvJijecxDXr.Zy.imi1UrDzDP38q8Erqgkfe0IhHzI

    hYmR3ekW74XdAFf7I6SgzAoUFd0

    Step 2: Verify the Arista network device default account has been overwritten with the

    local account of last resort.

    switch#sh running-config | section username

    username Emergency-Admin privilege 15 role network-admin secret sha512

    $6$ObuWg.Eu7DwGD8k/$EgT0uI.hLrStrmxUvJijecxDXr.Zy.imi1UrDzDP38q8Erqgkfe0IhHzI

    hYmR3ekW74XdAFf7I6SgzAoUFd0

    If one local account on the Arista network device does not exist for use as the account

    of last resort in the event the authentication server is unavailable, this is a finding.

    If the default admin account exists on the device, this is a finding.'
  remediation: 'Step 1: Configure the Arista network device for a username "Emergency-Admin"

    account of last resort using the following command:

    switch#configure

    switch(config)#username Emergency-Admin privilege 15 role network-admin

    secret 0 <plain-text password>

    Step 2: Ensure the Arista network device default account has been overwritten with the

    local account of last resort.

    switch#sh running-config | section username

    username Emergency-Admin privilege 15 role network-admin secret sha512

    $6$ObuWg.Eu7DwGD8k/$EgT0uI.hLrStrmxUvJijecxDXr.Zy.imi1UrDzDP38q8Erqgkfe0IhHzI

    hYmR3ekW74XdAFf7I6SgzAoUFd0

    !

    Use the following command to remove the default admin account if necessary:

    switch(config)#no username admin

    Step 3: As a final step in the case all administrative accounts are locked out of the

    device, ensure the username and password created for the account of last resort is

    contained within a sealed envelope and kept in a safe or secure network location.'
  checks:
  - type: manual_review
    info: 'Step 1: Verify on the Arista network device that an account of last resort is configured

      using the following command:

      switch#sh running-config | section username

      username Emergency-Admin privilege 15 role network-admin secret sha512

      $6$ObuWg.Eu7DwGD8k/$EgT0uI.hLrStrmxUvJijecxDXr.Zy.imi1UrDzDP38q8Erqgkfe0IhHzI

      hYmR3ekW74XdAFf7I6SgzAoUFd0

      Step 2: Verify the Arista network device default account has been overwritten with the

      local account of last resort.

      switch#sh running-config | section username

      '
    severity: medium
- id: '1.8'
  title: ARST-ND-000380
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Arista network device must enforce a minimum 15-character password length. GROUP ID: V-255954 RULE ID:
    SV-255954r1015710'
  rationale: Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. Password length is one factor of several that helps to determine strength and how long it takes
    to crack a password. The shorter the password, the lower the number of possible combinations that need to be tested before
    the password is compromised. Use of more characters in a password helps to exponentially increase the time and/or resources
    required to compromise the password.
  impact: ''
  references: []
  page_start: 27
  audit_raw: "Review the Arista device configuration \"show management security\" to determine the\nminimum 15-character password\
    \ length.\n switch#show run | section management security\nmanagement security\n password minimum length 15\n!\nIf the\
    \ Arista network device does not enforce a minimum 15-character password length,\nthis is a finding."
  remediation: "Configure the Arista device to enforce a minimum password 15-character length.\n switch#configure\nswitch(config)#management\
    \ security\nswitch(config-mgmt-security)#password minimum length 15\nswitch(config-mgmt-security)#exit\nswitch(config)#\n\
    !"
  checks:
  - type: sql
    command: show management security" to determine the
    severity: medium
    info: "Review the Arista device configuration \"show management security\" to determine the\nminimum 15-character password\
      \ length.\n switch#show run | section management security\nmanagement security\n password minimum length 15\n!\nIf the\
      \ Arista network device does not enforce a minimum 15-character password length,\nthis is a finding."
- id: '1.9'
  title: ARST-ND-000470
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Arista network device must use FIPS 140-2 approved algorithms for authentication to a cryptographic module.
    GROUP ID: V-255955 RULE ID: SV-255955r961050'
  rationale: Unapproved mechanisms used for authentication to the cryptographic module are not validated and therefore cannot
    be relied upon to provide confidentiality or integrity, and DOD data may be compromised. Network devices utilizing encryption
    are required to use FIPS-compliant mechanisms for authenticating to cryptographic modules. FIPS 140-2 is the current standard
    for validating that mechanisms used to access cryptographic modules utilize authentication that meets DOD requirements.
    However, authentication algorithms must configure security processes to use only FIPS-approved and NIST-recommended authentication
    algorithms.
  impact: ''
  references: []
  page_start: 29
  audit_raw: "Determine if the Arista network device uses FIPS 140-2 approved algorithms for\nauthentication to a cryptographic\
    \ module.\nStep 1: Review the Arista network device configuration to verify hardware or software\nentropy is enabled and\
    \ FIPS restrictions are used in accordance with NIST-specified\nvalidated cryptographic requirements.\nswitch# show management\
    \ security\nCPU Model: AMD GX-424CC SOC with Radeon(TM) R5E Graphics\nSecurity Chip: N313X\nCrypto Module: Arista EOS\
    \ Crypto Module v2.0\nForwarding ASIC: Jericho0 Model: Jericho\nBlocked client protocols: None\nHardware entropy generation\
    \ is enabled\nHaveged entropy generation is disabled\nJitter entropy generation is disabled\n!\nIf both hardware entropy\
    \ and haveged entropy are disabled, this is a finding.\nStep 2: Review the Arista network device configuration to verify\
    \ that FIPS restrictions\nare enabled for management security to use EOS Crypto Module for the RSA key pair\nused for\
    \ SSH and the device can only use FIPS-approved algorithms.\nswitch(config)show run | section management ssh\nmanagement\
    \ ssh\n fips restrictions\n!\nIf the FIPS restrictions line is not present, this is a finding."
  remediation: "Configure the Arista network device to use FIPS 140-2 approved algorithms for\nauthentication to a cryptographic\
    \ module.\nStep 1: Configure the Arista network device to ensure hardware or software entropy is\nenabled and FIPS restrictions\
    \ are used in accordance with NIST-specified validated\ncryptographic requirements.\nswitch(config)#management security\n\
    \ switch(config-mgmt-security)#entropy source hardware\nOR (only set one or the other, not both)\n switch(config-mgmt-security)#entropy\
    \ source haveged\n!\nStep 2: Configure the Arista network device to ensure the old RSA key pairs are\nzeroized and a new\
    \ FIPS-approved hostkey is generated. It is extremely important to\ncomplete this step after hardware or software entropy\
    \ is configured.\nswitch#reset ssh hostkey rsa\n!\nIMPORTANT part of Step 2 Review the Arista network device configuration\
    \ new key\nhas been generated.\nswitch#show management ssh hostkey rsa public\nssh-rsa\nAAAAB3NzaC1yc2EAAAADAQABAAABAQCz8vDiTWYcGuVrv04fwPj8YYBaHU+UFFl5zrFjeYiVl/dvs\n\
    wsiRSophF98aLjnRdJJ0NcjovjEEUnP0Q39UCoSYQRjrUzK2nzRMMD2IKxZyNhx9+/OT60lgh4M//\nkwxq0vMI1nk1pUO/wRaN1B4IzDizcyP9jY28bSdz8Y5TyLgrca6Ja4v99Io+lkHG0bj6X8s+VnBsF\n\
    WMrlabw1s4bUPr9PzMfUHx9gLHCVR+DFZvPHMR4sSK14F949IJgOKsXj\nchassisAddr=84:73:cf:6f:6c:55\nStep 3: Enable FIPS restrictions\
    \ for SSH and so the device can only use FIPS-approved\nalgorithms.\nswitch(config)management ssh\nswitch(config-mgmt-ssh)#fips\
    \ restrictions"
  checks:
  - type: sql
    command: show management security
    severity: medium
    info: 'Determine if the Arista network device uses FIPS 140-2 approved algorithms for

      authentication to a cryptographic module.

      Step 1: Review the Arista network device configuration to verify hardware or software

      entropy is enabled and FIPS restrictions are used in accordance with NIST-specified

      validated cryptographic requirements.

      switch# show management security

      CPU Model: AMD GX-424CC SOC with Radeo'
- id: '1.10'
  title: ARST-ND-000490
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Arista network device must terminate all network connections associated with a device management session
    at the end of the session, or the session must be terminated after 10 minutes of inactivity except to fulfill documented
    and validated mission requirements. GROUP ID: V-255956 RULE ID: SV-255956r991784'
  rationale: 'Terminating an idle session within a short time period reduces the window of opportunity for unauthorized personnel
    to take control of a management session enabled on the console or console port that has been left unattended. In addition,
    quickly terminating an idle session will also free up resources committed by the managed network element. Terminating
    network connections associated with communications sessions includes, for example, de-allocating associated TCP/IP address/port
    pairs at the operating system level, or de-allocating networking assignments at the application level if multiple application
    sessions are using a single, operating system-level network connection. This does not mean that the device terminates
    all sessions or network access; it only ends the inactive session and releases the resources associated with that session.
    Satisfies: SRG-APP-000190-NDM-000267, SRG-APP-000186-NDM-000266'
  impact: ''
  references: []
  page_start: 32
  audit_raw: "Verify the Arista device is configured for 10-minute inactivity timeout for management\nsessions.\nswitch#sh\
    \ run | section management\n!\ninterface Management1\n ip address 172.28.134.55/20\n!\nmanagement console\nidle-timeout\
    \ 10\n!\nmanagement ssh\n idle-timeout 10\n!\nIf the Arista network device is not configured to terminate the connection\
    \ associated\nwith a device management session at the end of the session or after 10 minutes of\ninactivity, this is a\
    \ finding."
