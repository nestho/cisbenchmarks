    \ key 7 106D1A182224E12AZ\naaa group server radius RADIUS_1\n server 192.168.10.101\nStep 2: Configure all network connections\
    \ associated with device management to use\nan authentication server for login authentication.\nswitch(config)#aaa authentication\
    \ login default group radius local\naaa authentication login console group radius local\naaa authentication dot1x default\
    \ group radius\naaa authentication policy on-success log\naaa authentication policy on-failure log\naaa authorization\
    \ console\naaa authorization commands all default local\naaa accounting exec default start-stop group radius logging\n\
    aaa accounting system default start-stop group radius logging\naaa accounting commands all default start-stop logging\
    \ group radius\nswitch(config)#exit"
