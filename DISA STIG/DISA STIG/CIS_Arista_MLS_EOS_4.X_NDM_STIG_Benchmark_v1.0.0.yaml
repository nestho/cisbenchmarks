    \ 106D1A182224E12AZ\n!\naaa group server radius RADIUS_1\n server 192.168.10.101\n!\nswitch#show running-config | section\
    \ aaa\naaa authentication login default group radius local\naaa authentication login console group radius local\naaa authentication\
    \ dot1x default group radius\naaa authentication policy on-success log\naaa authentication policy on-failure log\naaa\
    \ authorization console\naaa authorization commands all default local\naaa accounting exec default start-stop group radius\
    \ logging\naaa accounting system default start-stop group radius logging\naaa accounting commands all default start-stop\
    \ logging group radius\nIf the Arista network device is not configured to use an authentication server to\nauthenticate\
    \ users prior to granting administrative access, this is a finding."
  remediation: "Configure the Arista network device to use an authentication server.\nStep 1: Configure the Arista network\
