- id: '1.25'
  title: JUSX-VN-000025
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper SRX Services Gateway VPN must configure Internet Key Exchange (IKE) with SHA1 or greater to protect
    the authenticity of communications sessions. GROUP ID: V-214692 RULE ID: SV-214692r383107'
  rationale: Authenticity protection provides protection against man-in-the-middle attacks/session hijacking and the insertion
    of false information into sessions. This requirement focuses on communications protection for the application session
    rather than for the network packet and establishes grounds for confidence at both ends of communications sessions in ongoing
    identities of other parties and in the validity of information transmitted. Depending on the required degree of confidentiality
    and integrity, web services/SOA will require the use of mutual authentication (twoway/bidirectional). An IPsec Security
    Associations (SA) is established using either IKE or manual configuration.
  impact: ''
  references: []
  page_start: 55
  audit_raw: 'View all IKE proposals using in the VPN configuration.

    [edit]

    show security ike proposal

    If the authentication algorithm in all IKE proposals is not set to SHA1 or higher, this is a

    finding.'
  remediation: 'Include the SHA1 or higher authentication algorithm in the IKE proposal. The following

    is an example command.

    [edit]

    set security ike proposal <P1-PROPOSAL-NAME> authentication-algorithm sha-256'
  checks:
  - type: sql
    command: show security ike proposal
    severity: medium
    info: 'View all IKE proposals using in the VPN configuration.

      [edit]

      show security ike proposal

      If the authentication algorithm in all IKE proposals is not set to SHA1 or higher, this is a

      finding.'
- id: '1.26'
  title: JUSX-VN-000026
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper SRX Services Gateway VPN must only allow the use of DoD PKI established certificate authorities
    for verification of the establishment of protected sessions. GROUP ID: V-214693 RULE ID: SV-214693r856577'
  rationale: Untrusted certificate authorities (CA) can issue certificates, but they may be issued by organizations or individuals
    that seek to compromise DoD systems or by organizations with insufficient security controls. If the CA used for verifying
    the certificate is not a DoDapproved CA, trust of this CA has not been established. The DoD will only accept PKI certificates
    obtained from a DoD-approved internal or external certificate authority. Reliance on CAs for the establishment of secure
    sessions includes, for example, the use of Internet Key Exchange (IKE) authentication certificates. This requirement focuses
    on communications protection for the application session rather than for the network packet. Network elements that perform
    these functions must be able to identify which session identifiers were generated when the sessions were established.
  impact: ''
  references: []
  page_start: 57
  audit_raw: 'Verify the all IKE proposals are set to use the AES encryption algorithm.

    [edit]

    show security ike

    View the value of the authentication-method for each defined proposal.

    If the value of the authentication-method for each defined proposal is not set to use

    AES, this is a finding.'
  remediation: 'The following example commands configure the IKE (phase 1) proposals. Use

    certificates instead of pre-shared keys to establish the IKE phase 1 tunnel.

    This proposal requires AES 256-bit encryption

    set security ike proposal p1-proposal authentication-method rsa-signatures'
  checks:
  - type: sql
    command: show security ike
    severity: medium
    info: 'Verify the all IKE proposals are set to use the AES encryption algorithm.

      [edit]

      show security ike

      View the value of the authentication-method for each defined proposal.

      If the value of the authentication-method for each defined proposal is not set to use

      AES, this is a finding.'
- id: '1.27'
  title: JUSX-VN-000027
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper SRX Services Gateway VPN must only allow incoming VPN communications from organization-defined
    authorized sources routed to organizationdefined authorized destinations. GROUP ID: V-214694 RULE ID: SV-214694r856578'
  rationale: Unrestricted traffic may contain malicious traffic which poses a threat to an enclave or to other connected networks.
    Additionally, unrestricted traffic may transit a network, which uses bandwidth and other resources. Access control policies
    and access control lists implemented on devices, such as firewalls, that control the flow of network traffic, ensure the
    flow of traffic is only allowed from authorized sources to authorized destinations. Networks with different levels of
    trust (e.g., the Internet) must be kept separated.
  impact: ''
  references: []
  page_start: 59
  audit_raw: 'Request documentation of the Juniper SRX configuration drawings to determine which

    ports are configured for external/outbound traffic. Verify outbound interfaces have been

    configured with DoS screens.

    [edit]

    show security zones

    If the VPN zone(s) is configured to allow unauthorized/untrusted traffic to unauthorized

    zones, this is a finding.'
  remediation: 'The SRX device will route traffic over the IPsec VPN’s secure tunnel interface if there is

    a route with the next-hop specified as the secure tunnel interface. The following

    example commands configure an IPv4 and IPv6 static route for their respective secure

    tunnels.

    set routing-options static route <IPv4 network/netmask> next-hop st0.0

    set routing-options rib inet6.0 static route <IPv6 network/mask> next-hop st0.1

    set security policies from-zone untrust to-zone trust policy group-sec-policy then permit

    tunnel ipsec-vpn groupvpn

    Note: For the SRX device to transmit traffic over the IPsec tunnel, you must configure

    the secure tunnel interface (st0 in this case), associate it with a security zone, and

    create a static route entry for the remote network’s address space.'
  checks:
  - type: sql
    command: show security zones
    severity: medium
    info: 'Request documentation of the Juniper SRX configuration drawings to determine which

      ports are configured for external/outbound traffic. Verify outbound interfaces have been

      configured with DoS screens.

      [edit]

      show security zones

      If the VPN zone(s) is configured to allow unauthorized/untrusted traffic to unauthorized

      zones, this is a finding.'
- id: '1.28'
  title: JUSX-VN-000028
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper SRX Services Gateway VPN must disable split-tunneling for remote clients VPNs. GROUP ID: V-214695
    RULE ID: SV-214695r856579'
  rationale: Split tunneling would in effect allow unauthorized external connections, making the system more vulnerable to
    attack and to exfiltration of organizational information. A VPN hardware or software client with split tunneling enabled
    provides an unsecured backdoor to the enclave from the Internet. With split tunneling enabled, a remote client has access
    to the Internet while at the same time has established a secured path to the enclave via an IPsec tunnel. A remote client
    connected to the Internet that has been compromised by an attacker in the Internet, provides an attack base to the enclave’s
    private network via the IPsec tunnel. Hence, it is imperative that the VPN gateway enforces a no split-tunneling policy
    to all remote clients. Traffic to the protected resource will go through the specified dynamic VPN tunnel and will therefore
    be protected by the Juniper SRX firewall’s security policies.
  impact: ''
  references: []
  page_start: 61
  audit_raw: 'Verify split-tunneling is disabled.

    [edit]

    show security dynamic-vpn access-profile

    If split-tunneling is not disabled, this is a finding.'
  remediation: 'Configure the VPN tunnel to control what is sent out in clear text. The “remoteprotected-resources” command
    defines what is routed through the tunnel. The “remoteexceptions” command defines what traffic is sent out in clear text.
    The following is an

    example.

    [edit]

    set security dynamic-vpn access-profile

    set security dynamic-vpn clients all ipsec-vpn

    set security dynamic-vpn clients all remote-protected-resources <IP-address/mask>

    set security dynamic-vpn clients all remote-exceptions 0.0.0.0/0'
  checks:
  - type: sql
    command: show security dynamic-vpn access-profile
    severity: medium
    info: 'Verify split-tunneling is disabled.

      [edit]

      show security dynamic-vpn access-profile

      If split-tunneling is not disabled, this is a finding.'
- id: '1.29'
  title: JUSX-VN-000031
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper SRX Services Gateway VPN must use anti-replay mechanisms for security associations. GROUP ID:
    V-214696 RULE ID: SV-214696r856580'
  rationale: 'Anti-replay is an IPsec security mechanism at a packet level which helps to avoid unwanted users from intercepting
    and modifying an ESP packet. The SRX adds a sequence number to the ESP encapsulation which is verified by the VPN peer
    so packets are received within a correct sequence. This will cause issues if packets are not received in the order in
    which they were sent out. By default the SRX has a replay window of 64 or 32, depending on the platform. The SRX drops
    packets received out of order that are not received within this window. However, this default may be overridden by setting
    the option no-anti-replay as follows: set security vpn name ike no-anti-replay.'
  impact: ''
  references: []
  page_start: 63
  audit_raw: 'Verify anti-replay service is enabled.

    [edit]

    show security ipsec security-associations index 16384 detail

    If anti-replay service is not enabled, this is a finding.'
  remediation: 'Remove the no-anti-replay Internet Key Exchange (IKE) option from the VPN

    configuration. By default the SRX has a replay window of 64 or 32, depending on the

    platform.

    Example:

    [edit]

    delete security vpn name ike no-anti-replay'
  checks:
  - type: sql
    command: show security ipsec security-associations index 16384 detail
    severity: medium
    info: 'Verify anti-replay service is enabled.

      [edit]

      show security ipsec security-associations index 16384 detail

      If anti-replay service is not enabled, this is a finding.'
