- id: '1.17'
  title: JUSX-VN-000017
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper SRX Services Gateway VPN must be configured to prohibit or restrict the use of functions, ports,
    protocols, and/or services, as defined in the PPSM CAL and vulnerability assessments. GROUP ID: V-214684 RULE ID: SV-214684r385486'
  rationale: In order to prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized
    tunneling (i.e., embedding of data types within data types); organizations must disable or restrict unused or unnecessary
    physical and logical ports/protocols on information systems. DoD continually assesses the ports, protocols, and services
    that can be used for network communications. Some ports, protocols or services have known exploits or security weaknesses.
    Network traffic using these ports, protocols, and services must be prohibited or restricted in accordance with DoD policy.
    The PPSM CAL and vulnerability assessments provide an authoritative source for ports, protocols, and services that are
    unauthorized or restricted across boundaries on DoD networks. The Juniper SRX must be configured to prevent or restrict
    the use of prohibited ports, protocols, and services throughout the network by filtering the network traffic and disallowing
    or redirecting traffic as necessary. Default and updated policy filters from the vendors will disallow older version of
    protocols and applications and will address most known non-secure ports, protocols, and/or services.
  impact: ''
  references: []
