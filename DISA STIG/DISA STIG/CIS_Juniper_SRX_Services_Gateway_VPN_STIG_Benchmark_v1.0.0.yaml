  rationale: To assure accountability and prevent unauthenticated access, organizational users must be identified and authenticated
    to prevent potential misuse and compromise of the system. Organizational users include organizational employees or individuals
    the organization deems to have equivalent status of employees (e.g., contractors). Organizational users (and any processes
    acting on behalf of users) must be uniquely identified and authenticated for all accesses except the following. (i) Accesses
    explicitly identified and documented by the organization. Organizations document specific user actions that can be performed
    on the information system without identification or authentication; and (ii) Accesses that occur through authorized use
    of group authenticators without individual authentication. Organizations may require unique identification of individuals
    in group accounts (e.g., shared privilege accounts) or for detailed accountability of individual activity. This requirement
    only applies to components where this is specific to the function of the device or has the concept of an organizational
    user (e.g., VPN or proxy capability). This does not apply to authentication for the purpose of configuring the device
    itself (i.e., device management).
  impact: ''
  references: []
  page_start: 40
  audit_raw: 'Ask the site to identify the VPN access profile. Verify the access profile uses LDAP, not

    password configuration, for user remote access to the network. Ask the site

    representative if group accounts are allowed or configured.

    [edit]

    show security access profile <VPN-LDAP-PROFILE-NAME>

    If an access profile that uses LDAP is not configured as the first option in the

    authentication order, this is a finding.

    If group accounts are allowed for VPN logon, this is a finding.'
  remediation: 'Configure the LDAP access profile. The LDAP server must use DoD PKI for

    authentication of users.

    [edit]

    set access profile <VPN-LDAP-PROFILE-NAME> authentication-order ldap

    set access profile <VPN-LDAP-PROFILE-NAME> address-assignment pool dyn-vpnpool

    set access profile <VPN-LDAP-PROFILE-NAME> ldap-options base-distinguishedname CN=Users, DC=firewall, DC=com (Location
    from where LDAP will start searching

    for users)

