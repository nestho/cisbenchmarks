  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper SRX Services Gateway VPN must use FIPS 140-2 compliant mechanisms for authentication to a cryptographic
    module. GROUP ID: V-214687 RULE ID: SV-214687r385516'
  rationale: Unapproved mechanisms that are used for authentication to the cryptographic module are not verified, and therefore
    cannot be relied upon to provide confidentiality or integrity and DoD data may be compromised. Network elements utilizing
    encryption are required to use FIPS compliant mechanisms for authenticating to cryptographic modules. FIPS 140-2 is the
    current standard for validating that mechanisms used to access cryptographic modules utilize authentication that meets
    DoD requirements.
  impact: ''
  references: []
  page_start: 45
  audit_raw: 'Verify IPsec is defined and configured using FIPS-complaint protocols.

    [edit]

    show security ipsec vpn

