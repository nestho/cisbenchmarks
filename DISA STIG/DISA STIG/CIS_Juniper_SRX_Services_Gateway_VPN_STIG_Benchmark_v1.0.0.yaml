controls:
- id: '1.1'
  title: JUSX-VN-000001
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper SRX Services Gateway VPN must limit the number of concurrent sessions for user accounts to one
    (1) and administrative accounts to three (3), or set to an organization-defined number. GROUP ID: V-214668 RULE ID: SV-214668r382774'
  rationale: Network element management includes the ability to control the number of users and user sessions that utilize
    a network element. Limiting the number of allowed users and sessions per user is helpful in limiting risks related to
    DoS attacks. This requirement addresses concurrent sessions for information system accounts and does not address concurrent
    sessions by single users via multiple system accounts. The maximum number of concurrent sessions should be defined based
    upon mission needs and the operational environment for each system. The intent of this policy is to ensure the number
    of concurrent sessions is deliberately set to a number based on the site's mission and not left unlimited.
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'Verify the VPN Internet Key Exchange (IKE) gateway limits concurrent sessions.

    [edit]

    show security ike

    View the value for the connections-limit.

    If the VPN IKE gateway does not limit the number of concurrent sessions for user

    accounts to one (1) and administrative accounts to three (3), or is set to an

    organization-defined number, this is a finding.'
  remediation: 'Configure the VPN IKE gateway to limit concurrent sessions. The following is an

    example.

    [edit]

    set security ike gateway <VPN-GATEWAY> dynamic connections-limit 1

    [edit]

    set security ike gateway <VPN-GATEWAY> dynamic connections-limit 3'
  checks:
  - type: sql
    command: show security ike
    severity: medium
    info: 'Verify the VPN Internet Key Exchange (IKE) gateway limits concurrent sessions.

      [edit]

      show security ike

      View the value for the connections-limit.

      If the VPN IKE gateway does not limit the number of concurrent sessions for user

      accounts to one (1) and administrative accounts to three (3), or is set to an

      organization-defined number, this is a finding.'
- id: '1.2'
  title: JUSX-VN-000002
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper SRX Services Gateway VPN must renegotiate the IPsec security association after 8 hours or less.
    GROUP ID: V-214669 RULE ID: SV-214669r856572'
  rationale: The IPsec SA and its corresponding key will expire either after the number of seconds or amount of traffic volume
    has exceeded the configured limit. A new SA is negotiated before the lifetime threshold of the existing SA is reached
    to ensure that a new SA is ready for use when the old one expires. The longer the lifetime of the IPsec SA, the longer
    the lifetime of the session key used to protect IP traffic. The SA is less secure with a longer lifetime because an attacker
    has a greater opportunity to collect traffic encrypted by the same key and subject it to cryptanalysis. However, a shorter
    lifetime causes IPsec peers to renegotiate Phase II more often resulting in the expenditure of additional resources.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'Review all IPsec security associations configured globally or within IPsec profiles on the

    VPN gateway and examine the configured idle time. The default is 3600.

    [edit]

    show security ipsec proposal

    View the value of the lifetime-seconds option.

    If the IPsec proposal lifetime-seconds are not renegotiated after 8 hours or less of idle

    time, this is a finding.

    If the IPsec proposal lifetime-seconds is not configured, this is a finding.'
  remediation: 'Set the lifetime (in seconds) of the IPsec proposal to 8 hours or less.

    Example:

    [edit]

    set security ipsec proposal <P2-PROPOSAL-NAME> lifetime-seconds 28800'
  checks:
  - type: sql
    command: show security ipsec proposal
    severity: medium
    info: 'Review all IPsec security associations configured globally or within IPsec profiles on the

      VPN gateway and examine the configured idle time. The default is 3600.

      [edit]

      show security ipsec proposal

      View the value of the lifetime-seconds option.

      If the IPsec proposal lifetime-seconds are not renegotiated after 8 hours or less of idle

      time, this is a finding.

      If the IPsec proposal lifetime-seconds i'
- id: '1.3'
  title: JUSX-VN-000003
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper SRX Services Gateway VPN must renegotiate the IKE security association after 24 hours or less.
    GROUP ID: V-214670 RULE ID: SV-214670r856574'
  rationale: When a VPN gateway creates an IPsec Security Association (SA), resources must be allocated to maintain the SA.
    These resources are wasted during periods of IPsec endpoint inactivity, which could result in the gateway’s inability
    to create new SAs for other endpoints, thereby preventing new sessions from connecting. The Internet Key Exchange (IKE)
    idle timeout may also be set to allow SAs associated with inactive endpoints to be deleted before the SA lifetime has
    expired, although this setting is not recommended at this time. The value of one hour or less is a common best practice.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Review all IPsec security associations configured globally or within IPsec profiles on the

    VPN gateway and examine the configured idle time. The idle time value must be one

    hour or less. If idle time is not configured, determine the default used by the gateway.

    The default value is 28800 seconds which is compliant.

    [edit]

    show security ike proposal

    View the value of the lifetime-seconds option.

    If the IKE security associations are not renegotiated after 24 hours or less of idle time,

    this is a finding.'
  remediation: 'Specify the lifetime (in seconds) of an IKE security association (SA). When the SA

    expires, it is replaced by a new SA, the security parameter index (SPI), or terminated if

    the peer cannot be contacted for renegotiation.

    Example:

    [edit]

    set security ike proposal <P1-PROPOSAL-NAME> lifetime-seconds 86400'
  checks:
  - type: sql
    command: show security ike proposal
    severity: medium
    info: 'Review all IPsec security associations configured globally or within IPsec profiles on the

      VPN gateway and examine the configured idle time. The idle time value must be one

      hour or less. If idle time is not configured, determine the default used by the gateway.

      The default value is 28800 seconds which is compliant.

      [edit]

      show security ike proposal

      View the value of the lifetime-seconds option.

      If'
- id: '1.4'
  title: JUSX-VN-000004
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper SRX Services Gateway VPN device also fulfills the role of IDPS in the architecture, the device
    must inspect the VPN traffic in compliance with DoD IDPS requirements. GROUP ID: V-214671 RULE ID: SV-214671r382780'
  rationale: Remote access devices, such as those providing remote access to network devices and information systems, which
    lack automated, capabilities increase risk and makes remote user access management difficult at best. Remote access is
    access to DoD non-public information systems by an authorized user (or an information system) communicating through an
    external, non-organizationcontrolled network. Automated monitoring of remote access sessions allows organizations to detect
    cyber attacks and also ensure ongoing compliance with remote access policies by auditing connection activities of remote
    access capabilities, from a variety of information system components (e.g., servers, workstations, notebook computers,
    smart phones, and tablets).
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'Obtain documentation from the site representative that the Juniper SRX is configured in

    compliance with the Juniper SRX Services Gateway IDPS STIG.

    If the device has not been configured to comply with DoD IDPS requirements, this is a

    finding.'
  remediation: Perform a security review using the Juniper SRX Services Gateway IDPS STIG.
  checks:
  - type: manual_review
    info: 'Obtain documentation from the site representative that the Juniper SRX is configured in

      compliance with the Juniper SRX Services Gateway IDPS STIG.

      If the device has not been configured to comply with DoD IDPS requirements, this is a

      finding.'
    severity: medium
- id: '1.5'
  title: JUSX-VN-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper SRX Services Gateway VPN must use AES encryption for the IPsec proposal to protect the confidentiality
    of remote access sessions. GROUP ID: V-214672 RULE ID: SV-214672r382783'
  rationale: 'Without confidentiality protection mechanisms, unauthorized individuals may gain access to sensitive information
    via a remote access session. The Advance Encryption Standard (AES) encryption is critical to ensuring the privacy of the
    IPsec session; it is imperative that AES is used for encryption operations. Remote access is access to DoD-non-public
    information systems by an authorized user (or an information system) communicating through an external, non-organizationcontrolled
    network. Remote access methods include broadband and wireless connections. While there is much debate about the security
    and performance of AES, there is a consensus that AES is significantly more secure than other algorithms currently supported
    by IPsec implementations. AES is available in three key sizes: 128, 192, and 256 bits, versus the 56 bit DES. Therefore,
    there are approximately 1021 times more AES 128-bit keys than DES 56-bit keys. In addition, AES uses a block size of 128
    bits— twice the size of DES or 3DES.'
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'Verify all Internet Key Exchange (IKE) proposals are set to use the AES encryption

    algorithm.

    [edit]

    show security ipsec

    View the value of the encryption algorithm for each defined proposal.

    If the value of the encryption algorithm for any IPsec proposal is not set to use an AES

    algorithm, this is a finding.'
  remediation: 'The following example commands configure the IPsec (phase 2) proposals. The option

    may also be configured to use the aes-128-cbc, aes-192-cbc, or aes-256-cbc

    algorithms.

    [edit]

    set security ipsec proposal <IPSEC-PROPOSAL-NAME> encryption-algorithm aes-256cbc'
  checks:
  - type: sql
    command: show security ipsec
    severity: medium
    info: 'Verify all Internet Key Exchange (IKE) proposals are set to use the AES encryption

      algorithm.

      [edit]

      show security ipsec

      View the value of the encryption algorithm for each defined proposal.

      If the value of the encryption algorithm for any IPsec proposal is not set to use an AES

      algorithm, this is a finding.'
