- id: '1.7'
  title: JUSX-VN-000007
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper SRX Services Gateway VPN must implement a FIPS-140-2 validated Diffie-Hellman (DH) group. GROUP
    ID: V-214674 RULE ID: SV-214674r382783'
  rationale: Use of an approved DH algorithm ensures the Internet Key Exchange (IKE) (phase 1) proposal uses FIPS-validated
    key management techniques and processes in the production, storage, and control of private/secret cryptographic keys.
    The security of the DH key exchange is based on the difficulty of solving the discrete logarithm in which the key was
    derived from. Hence, the larger the modulus, the more secure the generated key is considered to be.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'Verify all IKE proposals are set to use a FIPS-validated dh-group.

    [edit]

    show security ike <P1-PROPOSAL-NAME>

    View the IKE options dh-group option.

    If the IKE option is not set to a FIPS-140-2 validated dh-group, this is a finding.'
  remediation: 'The following command is an example of how to configure the IKE (phase 1) proposals.

    The following groups are allowed for use in DoD:

    DH Groups 14 (2048-bit MODP)

    • 19 (256-bit Random ECP), 20 (384-bit Random ECP), 5 (1536-bit MODP), 24

    (2048-bit MODP with 256-bit POS).

    Example:

    [edit]

    set security ike proposal <P1-PROPOSAL-NAME> dh-group group14'
  checks:
  - type: sql
    command: show security ike <P1-PROPOSAL-NAME>
    severity: medium
    info: 'Verify all IKE proposals are set to use a FIPS-validated dh-group.

      [edit]

      show security ike <P1-PROPOSAL-NAME>

      View the IKE options dh-group option.

      If the IKE option is not set to a FIPS-140-2 validated dh-group, this is a finding.'
- id: '1.8'
  title: JUSX-VN-000008
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper SRX Services Gateway VPN must be configured to use IPsec with SHA1 or greater to negotiate hashing
    to protect the integrity of remote access sessions. GROUP ID: V-214675 RULE ID: SV-214675r382846'
  rationale: Without strong cryptographic integrity protections, information can be altered by unauthorized users without
    detection. Remote access VPN provides access to DoD non-public information systems by an authorized user (or an information
    system) communicating through an external, nonorganization-controlled network.
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'Verify all IPSec proposals are set to use the sha-256 hashing algorithm.

    [edit]

    show security ipsec proposal <IPSEC-PROPOSAL-NAME>

    View the value of the encryption algorithm for each defined proposal.

    If the value of the encryption algorithm option for all defined proposals is not set to use

    SHA1 or greater, this is a finding.'
  remediation: 'The following example commands configure the IPSec proposal.

    set security ipsec proposal <IPSEC-PROPOSAL-NAME> authentication-algorithm

    <hmac-sha-256-128 | hmac-sha-256-96 | hmac-sha1-96>'
  checks:
  - type: sql
    command: show security ipsec proposal <IPSEC-PROPOSAL-NAME>
    severity: medium
    info: 'Verify all IPSec proposals are set to use the sha-256 hashing algorithm.

      [edit]

      show security ipsec proposal <IPSEC-PROPOSAL-NAME>

      View the value of the encryption algorithm for each defined proposal.

      If the value of the encryption algorithm option for all defined proposals is not set to use

      SHA1 or greater, this is a finding.'
- id: '1.9'
  title: JUSX-VN-000009
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper SRX Services Gateway VPN must ensure inbound and outbound traffic is configured with a security
    policy in compliance with information flow control policies. GROUP ID: V-214676 RULE ID: SV-214676r382735'
  rationale: Remote access devices, such as those providing remote access to network devices and information systems, which
    lack automated, capabilities increase risk and makes remote user access management difficult at best. Remote access is
    access to DoD non-public information systems by an authorized user (or an information system) communicating through an
    external, non-organizationcontrolled network. Automated monitoring of remote access sessions allows organizations to detect
    cyber attacks and also ensure ongoing compliance with remote access policies by auditing connection activities of remote
    access capabilities, from a variety of information system components (e.g., servers, workstations, notebook computers,
    smart phones, and tablets). In phase-2, another negotiation is performed, detailing the parameters for the IPsec connection.
    New keying material using the Diffie-Hellman key exchange established in phase-1 is used to provide session keys used
    to protecting the VPN data flow. If Perfect-Forwarding-Secrecy (PFS) is used, a new Diffie-Hellman exchange is performed
    for each phase-2 negotiation. While this is slower, it makes sure that no keys are dependent on any other previously used
    keys; no keys are extracted from the same initial keying material. This is to make sure that, in the unlikely event that
    some key was compromised; no subsequent keys can be derived.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'Verify an IPsec policy is configured and used to control the VPN information flow.

    [edit]

    show security ipsec

    Inspect the security policy.

    If VPN traffic is not configured and controlled using an IPsec policy, this is a finding.'
  remediation: 'The following example command is an example of an IPsec policy.

    [edit]

    set security ipsec policy <IPSEC-POLICY> perfect-forward-secrecy keys group14

    set security ipsec policy <IPSEC-POLICY> proposals <IPSEC-PROPOSAL>

    The following command is an example of how to define an IPsec VPN using the IPsec

    policy and a secure tunnel interface. Alternatively, administrators can configure ontraffic tunnel establishment.

    [edit]

    set security ipsec vpn <VPN> bind-interface st0.0

    set security ipsec vpn <VPN> ike gateway <IKE-PEER>

    set security ipsec vpn <VPN> ike ipsec-policy <IPSEC-POLICY>

    set security ipsec vpn <VPN> establish-tunnels immediately

    For site-to-site VPN implementation, the SRX device is configured to route traffic over

    the IPsec VPN’s secure tunnel interface by establishing a route with the next-hop

    specified as the secure tunnel interface. The following commands configure an IPv4 and

    IPv6 static route for their respective secure tunnels.

    set routing-options static route <IPv4 network/netmask> next-hop st0.0

    set routing-options rib inet6.0 static route <IPv6 network/netmask> next-hop st0.1'
  checks:
  - type: sql
    command: show security ipsec
    severity: medium
    info: 'Verify an IPsec policy is configured and used to control the VPN information flow.

      [edit]

      show security ipsec

      Inspect the security policy.

      If VPN traffic is not configured and controlled using an IPsec policy, this is a finding.'
