- id: '1.15'
  title: JUSX-VN-000015
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper SRX Services Gateway must disable or remove unnecessary network services and functions that are
    not used as part of its role in the architecture. GROUP ID: V-214682 RULE ID: SV-214682r382903'
  rationale: Network devices are capable of providing a wide variety of functions (capabilities or processes) and services.
    Some of these functions and services are installed and enabled by default. The organization must determine which functions
    and services are required to perform the content filtering and other necessary core functionality for each component of
    the SRX. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured. They increase
    the risk to the platform by providing additional attack vectors. Services that may be related security-related, but based
    on the role of the device in the architecture do not need to be installed. For example, the Juniper SRX can have an Antivirus,
    Web filter, IDS, or ALG license. However, if these functions are not part of the documented role of the SRX in the enterprise
    or branch architecture, then these the software and licenses should not be installed on the device. This mitigates the
    risk of exploitation of unconfigured services or services that are not kept updated with security fixes. If left unsecured,
    these services may provide a threat vector. Only remove unauthorized services. This control is not intended to restrict
    the use of Juniper SRX devices with multiple authorized roles.
  impact: ''
  references: []
  page_start: 35
  audit_raw: 'Review the documentation and architecture for the device.

    If unneeded services and functions are installed on the device, but are not part of the

    documented role of the device, this is a finding.'
  remediation: 'Remove unnecessary services and functions. From operational mode, display the

    licenses available to be deleted and enter the following commands.

    request system license delete license-identifier-list ?

    request system license delete

    Note: Only remove unauthorized services. This control is not intended to restrict the use

    of Juniper SRX devices with multiple authorized roles.'
  checks:
