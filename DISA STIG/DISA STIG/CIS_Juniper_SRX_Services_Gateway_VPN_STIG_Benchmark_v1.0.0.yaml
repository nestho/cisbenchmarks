    Note: The IP network used for dynamic VPN users should be different from the IP

    network of the external interface used in the IKE configuration.

    The access profile is linked to the xauth of the gateway for dynamic VPN.

    set security ike gateway <VPN-GATEWAY> xauth access-profile <VPN-LDAPPROFILE-NAME>

    Under security >> dynamic-vpn, add all the users that are going to use the dynamic

    VPN. The command is as follows:

    set security dynamic-vpn clients all user

    Note: For users who are going to use dynamic VPN, this will be the AD user logon

    name for each user.'
