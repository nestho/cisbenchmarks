  title: JUSX-VN-000011
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'If IDPS inspection is performed separately from the Juniper SRX Services Gateway VPN device, the VPN must
    route sessions to an IDPS for inspection. GROUP ID: V-214678 RULE ID: SV-214678r864169'
  rationale: Remote access devices, such as those providing remote access to network devices and information systems, which
    lack automated, capabilities increase risk and makes remote user access management difficult at best. Remote access is
    access to DoD non-public information systems by an authorized user (or an information system) communicating through an
