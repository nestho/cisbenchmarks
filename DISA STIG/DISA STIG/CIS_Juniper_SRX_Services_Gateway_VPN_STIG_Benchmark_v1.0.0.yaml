    mechanisms for authentication to a cryptographic module, this is a finding.'
  remediation: 'After configuring the Internet Key Exchange (IKE) gateway and IPsec policy, the

    following commands configure an IPsec policy, enabling Perfect Forward Secrecy (PFS)

    using Diffie-Hellman group

    14 and associating the IPsec proposal configured in the previous example.

    set security ipsec policy IPSEC-POLICY perfect-forward-secrecy keys group14

    set security ipsec policy IPSEC-POLICY proposals IPSEC-PROPOSAL

