- id: '1.22'
  title: JUSX-VN-000022
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper SRX Services Gateway VPN must terminate all network connections associated with a communications
    session at the end of the session. GROUP ID: V-214689 RULE ID: SV-214689r695324'
  rationale: Idle TCP sessions can be susceptible to unauthorized access and hijacking attacks. By default, routers do not
    continually test whether a previously connected TCP endpoint is still reachable. If one end of a TCP connection idles
    out or terminates abnormally, the opposite end of the connection may still believe the session is available. These “orphaned”
    sessions use up valuable router resources and can also be hijacked by an attacker. To mitigate this risk, routers must
    be configured to send periodic keep alive messages to check that the remote end of a session is still connected. If the
    remote device fails to respond to the TCP keep alive message, the sending router will clear the connection and free resources
    allocated to the session. The TCP keep-alive for remote access is implemented in the Juniper SRX Firewall STIG.
  impact: ''
  references: []
  page_start: 50
  audit_raw: 'Ask the site representative which proposal implements Suite B.

    [edit]

    show security ike gateway

    View the configured options.

    If the dead-peer-detection is not configured, this is a finding.'
  remediation: 'For site-to-site VPN, configure an Internet Key Exchange (IKE) gateway that includes

    dead-peer-detection parameters such as in the following example.

    set security ike gateway IKE-PEER ike-policy IKE-POLICY

    set security ike gateway IKE-PEER address <Peer IP Address>

    set security ike gateway IKE-PEER dead-peer-detection always-send

    set security ike gateway IKE-PEER dead-peer-detection interval 10

    set security ike gateway IKE-PEER dead-peer-detection threshold 2

    set security ike gateway IKE-PEER local-identity inet <IPv4 Address in Certificate>

    set security ike gateway IKE-PEER remote-identity inet <IPv4 Address in Remote

    Certificate>

    set security ike gateway IKE-PEER external-interface

    set security ike gateway IKE-PEER version v2-only

    For dynamic (remote access) VPN, the TCP keep-alive for remote access is

    implemented in the Juniper SRX Firewall STIG.'
  checks:
  - type: sql
    command: show security ike gateway
    severity: medium
    info: 'Ask the site representative which proposal implements Suite B.

      [edit]

      show security ike gateway

      View the configured options.

      If the dead-peer-detection is not configured, this is a finding.'
- id: '1.23'
  title: JUSX-VN-000023
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper SRX Services Gateway VPN Internet Key Exchange (IKE) must use cryptography that is compliant with
    Suite B parameters when transporting classified traffic across an unclassified network. GROUP ID: V-214690 RULE ID: SV-214690r856575'
  rationale: Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect data.
    The network element must implement cryptographic modules adhering to the higher standards approved by the federal government
    since this provides assurance they have been tested and validated. RFC 6379 Suite B Cryptographic Suites for IPsec defines
    four cryptographic user interface suites for deploying IPsec. Each suite provides choices for Encapsulating Security Payload
    (ESP) and IKE. The four suites are differentiated by the choice of IKE authentication and key exchange, cryptographic
    algorithm strengths, and whether ESP is to provide both confidentiality and integrity or integrity only. The suite names
    are based on the Advanced Encryption Standard (AES) mode and AES key length specified for ESP. Two suites are defined
    for transporting classified information up to SECRET level—one for both confidentiality and integrity and one for integrity
    only. There are also two suites defined for transporting classified information up to TOP SECRET level.
  impact: ''
  references: []
  page_start: 52
  audit_raw: 'Ask the site representative which proposal implements Suite B.

    [edit]

    show security ike

    View the configured options.

    If the value of the authentication-method and other options are not set for Suite B

    compliance, this is a finding.'
  remediation: 'The following example commands configure the IKE (phase 1) Suite B proposal. Note

    that SRX must have Junos 12.1X46 or later to support SuiteB.

    [edit]

    set security ike proposal suiteb-proposal

    set ike proposal suiteb-proposal authentication-method ecdsa-signatures-384

    set ike proposal suiteb-proposal dh-group group20

    set ike proposal suiteb-proposal authentication-algorithm sha-384

    set ike proposal suiteb-proposal encryption-algorithm aes-256-cbc'
  checks:
  - type: sql
    command: show security ike
    severity: medium
    info: 'Ask the site representative which proposal implements Suite B.

      [edit]

      show security ike

      View the configured options.

      If the value of the authentication-method and other options are not set for Suite B

      compliance, this is a finding.'
- id: '1.24'
