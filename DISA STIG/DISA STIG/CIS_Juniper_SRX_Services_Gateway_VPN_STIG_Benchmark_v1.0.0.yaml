- id: '1.11'
  title: JUSX-VN-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper SRX Services Gateway VPN must use Internet Key Exchange (IKE) for IPsec VPN Security Associations
    (SAs). GROUP ID: V-214677 RULE ID: SV-214677r385561'
  rationale: Without IKE, the SPI is manually specified for each security association. IKE peers will negotiate the encryption
    algorithm and authentication or hashing methods as well as generate the encryption keys. An IPsec SA is established using
    either Internet Key Exchange (IKE) or manual configuration. When using IKE, the security associations are established
    when needed and expire after a period of time or volume of traffic threshold. If manually configured, they are established
    as soon as the configuration is complete at both end points and they do not expire. When using IKE, the Security Parameter
    Index (SPI) for each security association is a pseudo-randomly derived number. With manual configuration of the IPsec
    security association, both the cipher key and authentication key are static. Hence, if the keys are compromised, the traffic
    being protected by the current IPsec tunnel can be decrypted as well as traffic in any future tunnels established by this
    SA. Furthermore, the peers are not authenticated prior to establishing the SA, which could result in a rogue device establishing
    an IPsec SA with either of the VPN end points. IKE provides primary authentication to verify the identity of the remote
    system before negotiation begins. This feature is lost when the IPsec security associations are manually configured, which
    results in a non-terminating session using static pre-shared keys.
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'Verify the IKE protocol is specified for all IPsec VPNs.

    [edit]

    show security ipsec vpn

    If the IKE protocol is not specified as an option on all VPN gateways, this is a finding.'
  remediation: 'The following example commands configure an IPsec VPN to use the IKE gateway

    information.

    [edit]

    set security ipsec vpn <VPN-GWY-NAME> ike gateway <IKE-PEER-NAME>'
  checks:
  - type: sql
    command: show security ipsec vpn
    severity: medium
    info: 'Verify the IKE protocol is specified for all IPsec VPNs.

      [edit]

      show security ipsec vpn

      If the IKE protocol is not specified as an option on all VPN gateways, this is a finding.'
- id: '1.12'
  title: JUSX-VN-000012
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper SRX Services Gateway VPN must not accept certificates that have been revoked when using PKI for
    authentication. GROUP ID: V-214679 RULE ID: SV-214679r385561'
  rationale: Situations may arise in which the certificate issued by a Certificate Authority (CA) may need to be revoked before
    the lifetime of the certificate expires. For example, the certificate is known to have been compromised. To achieve this,
    a list of certificates that have been revoked, known as a Certificate Revocation List (CRL), is sent periodically from
    the CA to the IPsec gateway. When an incoming Internet Key Exchange (IKE) session is initiated for a remote client or
    peer whose certificate is revoked, the CRL will be checked to see if the certificate is valid; if the certificate is revoked,
    IKE will fail and an IPsec security association will not be established for the remote endpoint.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'Examine the CA trust point defined on the VPN gateway to determine if it references a

    CRL and that revocation check has been enabled. An alternate mechanism for checking

    the validity of a certificate is the use of the Online Certificate Status Protocol (OCSP).

    Unlike CRLs, which provide only periodic certificate status checks, OCSP can provide

    timely information regarding the status of a certificate.

    If revoked certificates are accepted for PKI authentication, this is a finding.'
  remediation: 'Configure the CA trust point to enable certificate revocation check by referencing a CRL

    or via OCSP.'
  checks:
  - type: manual_review
    info: 'Examine the CA trust point defined on the VPN gateway to determine if it references a

      CRL and that revocation check has been enabled. An alternate mechanism for checking

      the validity of a certificate is the use of the Online Certificate Status Protocol (OCSP).

      Unlike CRLs, which provide only periodic certificate status checks, OCSP can provide

      timely information regarding the status of a certificate.

      If revoked certificates are accepted for PKI authentication, this is a finding.'
    severity: medium
- id: '1.13'
  title: JUSX-VN-000013
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper SRX Services Gateway VPN must specify Perfect Forward Secrecy (PFS). GROUP ID: V-214680 RULE ID:
    SV-214680r385561'
  rationale: PFS generates each new encryption key independently from the previous key. Without PFS, compromise of one key
    will compromise all communications. The phase 2 (Quick Mode) Security Association (SA) is used to create an IPsec session
    key. Hence, its rekey or key regeneration procedure is very important. The phase 2 rekey can be performed with or without
    Perfect Forward Secrecy (PFS). With PFS, every time a new IPsec Security Association is negotiated during the Quick Mode,
    a new Diffie-Hellman (DH) exchange occurs. The new DH shared secret will be included with original keying material (SYKEID_d,
    initiator nonce, and responder nonce from phase 1) for generating a new IPsec session key. If PFS is not used, the IPsec
    session key will always be completely dependent on the original keying material from the Phase1. Hence, if an older key
    is compromised at any time, it is possible that all new keys may be compromised. The DH exchange is performed in the same
    manner as was done in phase 1 (Main or Aggressive Mode). However, the phase 2 exchange is protected by encrypting the
    phase 2 packets with the key derived from the phase 1 negotiation. Because DH negotiations during phase 2 are encrypted,
    the new IPsec session key has an added element of secrecy.
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'Examine all IPsec profiles to verify PFS is enabled.

    [edit]

    show security ipsec policy

    If PFS is not configured, this is a finding.'
  remediation: 'Configure the VPN gateway to ensure PFS is enabled. The following commands

    configure an IPsec policy, enabling PFS using Diffie-Hellman group 14 and associates

    the IPsec proposal configured in the previous example.

    [edit]

    set security ipsec policy <IPSEC-POLICY> perfect-forward-secrecy keys group14

    set security ipsec policy <IPSEC-POLICY> proposals <IPSEC-PROPOSAL>'
  checks:
  - type: sql
    command: show security ipsec policy
    severity: medium
    info: 'Examine all IPsec profiles to verify PFS is enabled.

      [edit]

      show security ipsec policy

