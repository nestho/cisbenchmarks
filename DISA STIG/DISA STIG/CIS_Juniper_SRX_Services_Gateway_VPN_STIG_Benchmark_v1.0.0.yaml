    sAMAccountName=

    set access profile <VPN-LDAP-PROFILE-NAME> ldap-options search admin-search

    distinguished-name CN=Administrator, CN=Users, DC=firewall, DC=com (User who is

    authorized to search the ldap tree)

    set access profile <VPN-LDAP-PROFILE-NAME> ldap-options search admin-search

    password <Administrator Password>

    set access profile <VPN-LDAP-PROFILE-NAME> ldap-server <AD Server IP address>

    port 389/636

    set access firewall-authentication pass-through default-profile <VPN-LDAP-PROFILENAME>

    set access firewall-authentication web-authentication default-profile <VPN-LDAPPROFILE-NAME>

    Note: To find the user or administrator base DN, use any LDAP browser. On an Internet

    search engine, search for ldp.exe, which is a very basic LDAP browser.

    When using LDAP groups to authenticate a user, or a user belonging to a group in the

    active directory, include the following statement:

    set access profile <VPN-LDAP-PROFILE-NAME> session-options client-group

    Note: Without the above statement, users are not searched based on the group name

    or group string.

    The IP address pool configuration is as follows (the user will be assigned the IP from

    this pool):

    set access address-assignment pool dyn-vpn-pool family inet network <IP Network for

    Dynamic-VPN User> (e.g.. 192.168.100.0/24)

    set access address-assignment pool dyn-vpn-pool family inet range dyn-vpn-pool-range

    low <Starting IP address for Dynamic-VPN User> (e.g.. 192.168.100.1)

    set access address-assignment pool dyn-vpn-pool family inet range dyn-vpn-pool-range

