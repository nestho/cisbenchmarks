- id: '1.4'
  title: TANS-AP-000040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium Server must be set to only allow connections from endpoints when TLS is used. GROUP ID: V-254877
    RULE ID: SV-254877r1067684'
  rationale: Without cryptographic integrity protections in the Tanium Client, information could be altered by unauthorized
    users without detection. Cryptographic mechanisms used for protecting the integrity of Tanium communications information
    include signed hash functions using asymmetric cryptography enabling distribution of the public key to verify the hash
    information while maintaining the confidentiality of the secret key used to generate the hash.
