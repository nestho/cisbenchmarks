- id: '1.73'
  title: TANS-AP-001410
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Tanium Client processes must be excluded from on-access scan. GROUP ID: V-254952 RULE ID: SV-254952r961863'
  rationale: Similar to any other host-based applications, the Tanium Client is subject to the restrictions other system-level
    software may place on an operating environment. That is to say that Antivirus, IPS, Encryption, or other security and
    management stack software may disallow the Client from working as expected. https://docs.tanium.com/client/client/requirements.html#Host_system_security_exceptio
    ns
  impact: ''
  references: []
  page_start: 156
  audit_raw: 'Review the settings of the antivirus software.

    Validate exclusions exist that exclude the Tanium Client process interactions from onaccess scans and are treated as low-risk.

    If exclusions do not exist, this is a finding.'
  remediation: 'Implement exclusion policies within the antivirus software solution to exclude the onaccess scanning of Tanium
    Client process interactions. These processes should be

    treated as low-risk and not scanned during read or write events.'
  checks:
  - type: manual_review
    info: 'Review the settings of the antivirus software.

      Validate exclusions exist that exclude the Tanium Client process interactions from onaccess scans and are treated as
      low-risk.

      If exclusions do not exist, this is a finding.'
    severity: medium
