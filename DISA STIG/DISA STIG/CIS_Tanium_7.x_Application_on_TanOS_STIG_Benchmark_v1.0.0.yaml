- id: '1.71'
  title: TANS-AP-001250
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Tanium must alert the ISSO, ISSM, and other individuals designated by the local organization when the following
    Indicators of Compromise (IOCs) or potential compromise are detected: real time intrusion detection; threats identified
    by authoritative sources (e.g., CTOs); and Category I, II, IV, and VII incidents in accordance with CJCSM 6510.01B. GROUP
    ID: V-254950 RULE ID: SV-254950r961728'
  rationale: When a security event occurs, the application that has detected the event must immediately notify the appropriate
    support personnel so they can respond appropriately. Alerts may be generated from a variety of sources, including, audit
    records or inputs from malicious code protection mechanisms, intrusion detection, or prevention mechanisms. Alerts may
    be transmitted, for example, telephonically, by electronic mail messages, or by text messaging. Individuals designated
    by the local organization to receive alerts may include, for example, system administrators, mission/business owners,
    or system owners. IOCs are forensic artifacts from intrusions identified on organizational information systems (at the
    host or network level). IOCs provide organizations with valuable information on objects or information systems that have
    been compromised. These indicators reflect the occurrence of a compromise or a potential compromise. This requirement
    applies to applications that provide monitoring capability for unusual/unauthorized activities including, but not limited
    to, host-based intrusion detection, antivirus, and malware applications.
  impact: ''
  references: []
  page_start: 152
  audit_raw: 'Note: If THR is not licensed or used for detection then this is not applicable.

