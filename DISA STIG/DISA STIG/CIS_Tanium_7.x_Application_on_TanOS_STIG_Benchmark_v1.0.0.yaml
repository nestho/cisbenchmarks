- id: '1.42'
  title: TANS-AP-000555
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium application must separate user functionality (including user interface services) from information
    system management functionality. GROUP ID: V-254917 RULE ID: SV-254917r961095'
  rationale: Application management functionality includes functions necessary for administration and requires privileged
    user access. Allowing nonprivileged users to access application management functionality capabilities increases the risk
    that nonprivileged users may obtain elevated privileges. The separation of user functionality from information system
    management functionality is either physical or logical and is accomplished by using different computers, different central
    processing units, different instances of the operating system, different network addresses, different TCP/UDP ports, virtualization
    techniques, combinations of these methods, or other methods, as appropriate. An example of this type of separation is
    observed in web administrative interfaces that use separate authentication methods for users of any other information
    system resources. This may include isolating the administrative interface on a different security domain and with additional
    access controls.
