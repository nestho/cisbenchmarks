- id: '1.34'
  title: TANS-AP-000370
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium Application Server must be configured to prohibit or restrict the use of organization-defined functions,
    ports, protocols, and/or services, as defined in the PPSM CAL and vulnerability assessments. GROUP ID: V-254908 RULE ID:
    SV-254908r1067702'
  rationale: To prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized tunneling
    (i.e., embedding of data types within data types), organizations must disable or restrict unused or unnecessary physical
    and logical ports/protocols on information systems. Applications are capable of providing a wide variety of functions
    and services. Some of the functions and services provided by default may not be necessary to support essential organizational
    operations. Additionally, it is sometimes convenient to provide multiple services from a single component (e.g., email
    and web services); however, doing so increases risk over limiting the services provided by any one component. To support
    the requirements and principles of least functionality, the application must support the organizational requirements providing
    only essential capabilities and limiting the use of ports, protocols, and/or services to only those required, authorized,
    and approved to conduct official business or to address authorized quality of life issues.
  impact: ''
  references: []
  page_start: 82
  audit_raw: 'Review the PPSM CAL to ensure Tanium has been registered with all of the TCP ports

    required for functionality to include (but not limited to) TCP 17472, 17477, 17440,

    17441, and 433.

    If any TCP ports are being used on the Tanium Server that have been deemed as

    restricted by the PPSM CAL, this is a finding.'
  remediation: 'Submit a formal request to have the Tanium communication ports evaluated and added

    to the PPSM CAL.'
