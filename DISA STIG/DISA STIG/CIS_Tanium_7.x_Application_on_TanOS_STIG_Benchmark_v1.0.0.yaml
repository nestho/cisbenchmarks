  title: TANS-AP-000480
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium Server certificates must have Extended Key Usage entries for the serverAuth object TLS Web Server
    Authentication and the clientAuth object TLS Web Client Authentication. GROUP ID: V-254914 RULE ID: SV-254914r961038'
  rationale: Restricting this setting limits the user's ability to change their password. Passwords need to be changed at
    specific policy based intervals; however, if the application allows the user to immediately and continually change their
    password, then the password could be repeatedly changed in a short period of time to defeat the organization's policy
    regarding password reuse.
  impact: ''
  references: []
  page_start: 92
  audit_raw: 'From Browser:

    1. Navigate to the Tanium Console URI and log in using multi-factor authentication.

    2. Click the lock to the left of the URI in the address bar.

    3. Select the lock on the left of the URI in the address bar:

    4. a) Chrome: Select "Certificate".

    5. b) Edge: Select "Connection is Secure," and then select the certificate icon on

    the right.

    6. Select the "Details" tab.

    7. Scroll down through the details to find and select the "Enhanced Key Usage"

    field.

    If there is no "Enhanced Key Usage" field, this is a finding.

    In the bottom screen, verify "Server Authentication" and "Client Authentication" are both

    identified.

    If "Server Authentication" and "Client Authentication" are not both identified, this is a

    finding.

    From Server:

    1. Access the Tanium Server interactively.

    2. Log on to the TanOS server with the tanadmin role.

    3. Press "2" for "Tanium Operations Menu," and then press "Enter".

    4. Press "7" for "Download SOAP Certificate," and then press "Enter".

    5. In a browser with access to the Tanium Server Console, navigate to

    https:///pub/SOAPServer.crt.

    6. Download the SOAPServer.crt file when prompted.

    7. Double-click on the file to open the certificate.

    8. Select the "Details" tab.

    9. Scroll down through the details to find and select the "Enhanced Key Usage"

    field.

    If there is no "Enhanced Key Usage" field, this is a finding.

    In the bottom screen, verify "Server Authentication" and "Client Authentication" are both

    identified.

    If "Server Authentication" and "Client Authentication" are not both identified, this is a

    finding.'
  remediation: 'Request or regenerate the certificate being used to include both the "Server

    Authentication" and "Client Authentication" objects.'
