- id: '1.61'
  title: TANS-AP-000940
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium application must prohibit user installation of software without explicit privileged status. GROUP
    ID: V-254938 RULE ID: SV-254938r1015873'
  rationale: Allowing regular users to install software without explicit privileges creates the risk that untested or potentially
    malicious software will be installed on the system. Explicit privileges (escalated or administrative privileges) provide
    the regular user with explicit capabilities and control that exceeds the rights of a regular user. Application functionality
    will vary, and while users are not permitted to install unapproved applications, there may be instances where the organization
    allows the user to install approved software packages such as from an approved software repository. The application must
    enforce software installation by users based upon what types of software installations are permitted (e.g., updates and
    security patches to existing software) and what types of installations are prohibited (e.g., software whose pedigree with
    regard to being potentially malicious is unknown or suspect) by the organization. This requirement applies, for example,
    to applications that provide the ability to extend application functionality (e.g., plug-ins, add-ons) and software management
    applications.
  impact: ''
  references: []
  page_start: 136
