- id: '1.33'
  title: TANS-AP-000365
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Firewall rules must be configured on the Tanium Zone Server for Client-to-Zone Server communications. GROUP
    ID: V-254907 RULE ID: SV-254907r1043177'
  rationale: In customer environments using the Tanium Zone Server, a Tanium Client may be configured to point to a Zone Server
    instead of a Tanium Server. The communication requirements for these Clients are identical to the Server-to-Client requirements.
    Without proper firewall configurations, proper TCP communications may not take place as necessary for application functionality.
    Additionally, without proper configuration, organizations may lose complete visibility into endpoints that cannot connect
    directly to the Tanium Server. https://docs.tanium.com/platform_deployment_reference/platform_deployment_referenc e/network_ports.html
  impact: ''
  references: []
  page_start: 80
  audit_raw: 'Note: If a Zone Server is not being used, this is Not Applicable.

