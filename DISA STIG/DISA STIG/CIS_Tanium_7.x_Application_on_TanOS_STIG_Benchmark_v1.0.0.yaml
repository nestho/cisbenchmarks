- id: '1.8'
  title: TANS-AP-000065
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium Application Server must be configured to only use LDAP for account management functions. GROUP
    ID: V-254881 RULE ID: SV-254881r1043176'
  rationale: Enterprise environments make application account management challenging and complex. A manual process for account
    management functions adds the risk of a potential oversight or other error. To reduce risk, the Tanium Application Server
    must be configured to allow for LDAP to provide account management functions that immediately enforce the organization's
    current account policy.
  impact: ''
  references: []
  page_start: 26
  audit_raw: '1. Using a web browser on a system that has connectivity to the Tanium

    Application, access the Tanium Application web user interface (UI) and log on

    with multi-factor authentication.

    2. Click "Administration" on the top navigation banner.

    3. Under "Configuration," select "LDAP/AD Sync Configurations".

    4. Ensure LDAP sync is enabled.

    If LDAP is not enabled, this is a finding.'
  remediation: 'Vendor documentation can be downloaded from the following URL:

    https://docs.tanium.com/platform_user/platform_user/console_using_ldap.html?Highligh

    t=LDAP

    1. Using a web browser on a system that has connectivity to the Tanium

    Application, access the Tanium Application web user interface (UI) and log on

    with multi-factor authentication.

    2. Click "Administration" on the top navigation banner.

    3. Under "Configuration," select "LDAP/AD Sync Configurations".

    4. Follow the vendor documentation titled "Integrating with LDAP Servers" to

    implement correct configuration settings for this requirement.'
  checks:
  - type: manual_review
    info: '1. Using a web browser on a system that has connectivity to the Tanium

      Application, access the Tanium Application web user interface (UI) and log on

      with multi-factor authentication.

      2. Click "Administration" on the top navigation banner.

      3. Under "Configuration," select "LDAP/AD Sync Configurations".

      4. Ensure LDAP sync is enabled.

      If LDAP is not enabled, this is a finding.'
    severity: medium
- id: '1.9'
  title: TANS-AP-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Tanium Computer Groups must be used to restrict console users from affecting changes to unauthorized computers.
    GROUP ID: V-254882 RULE ID: SV-254882r960792'
  rationale: Computer Groups allow a site running Tanium to assign responsibility of specific Computer Groups to specific
    Tanium console users. By doing so, a desktop administrator, for example, will not have the ability to enforce an action
    against a high visibility server. For large sites, it is crucial to have the Computer Groups. While a smaller site might
    not seem to require Computer Groups, creating them provides for a cleaner implementation. All sites will be required to
    have some kind of Computer Groups configured other than the default "All Computers".
  impact: ''
  references: []
  page_start: 28
  audit_raw: '1. Using a web browser on a system that has connectivity to the Tanium

    Application, access the Tanium Application web user interface (UI) and log on

    with multi-factor authentication.

    2. Click "Administration" on the top navigation banner.

    3. Select the "Computer Groups" tab.

    4. Under the "Name" column, verify organization-specific computer groups match

    the organization-defined list in the system security plan (SSP).

    If site- or organization-specific computer groups do not match or exist, this is a finding.'
  remediation: '1. Using a web browser on a system that has connectivity to the Tanium Server,

    access the Tanium Server web user interface (UI) and log on with multi-factor

    authentication.

    2. Click "Administration" on the top navigation banner.

    3. Select the "Computer Groups" tab.

    4. Configure specific Computer Groups to facilitate the management of computers

    by authorized individuals for those computers.

    Note: Tanium offers two ways to define computer groups. Refer to documentation for

    explanation found here:

    https://docs.tanium.com/platform_user/platform_user/console_computer_groups.html#C

    omputer_Group_types.'
  checks:
  - type: manual_review
    info: '1. Using a web browser on a system that has connectivity to the Tanium

      Application, access the Tanium Application web user interface (UI) and log on

      with multi-factor authentication.

      2. Click "Administration" on the top navigation banner.

