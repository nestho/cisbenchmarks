  description: 'Firewall rules must be configured on the Tanium module server to allow Server-toModule Server communications
    from the Tanium Server. GROUP ID: V-254942 RULE ID: SV-254942r1067730'
  rationale: The Tanium Module Server is used to extend the functionality of Tanium through the use of various workbenches.
