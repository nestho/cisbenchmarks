- id: '1.53'
  title: TANS-AP-000780
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Tanium must notify the system administrator (SA) and information system security officer (ISSO) of account
    enabling actions. GROUP ID: V-254929 RULE ID: SV-254929r1067719'
  rationale: Once an attacker establishes access to an application, the attacker often attempts to create a persistent method
    of re-establishing access. One way to accomplish this is for the attacker to simply enable a new or disabled account.
    Sending notification of account enabling events to the SA and ISSO is one method for mitigating this risk. Such a capability
    greatly reduces the risk that application accessibility will be negatively affected for extended periods of time and also
    provides logging that can be used for forensic purposes. To detect and respond to events that affect user accessibility
    and application processing, applications must notify the appropriate individuals so they can investigate the event. To
    address access requirements, many application developers choose to integrate their applications with enterprise-level
    authentication/access/auditing mechanisms that meet or exceed access control policy requirements. Such integration allows
    the application developer to off-load those access control functions and focus on core application features and functionality.
  impact: ''
  references: []
