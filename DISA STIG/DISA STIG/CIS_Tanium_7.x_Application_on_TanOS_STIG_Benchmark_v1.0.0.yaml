- id: '1.51'
  title: TANS-AP-000720
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium application must set an inactive timeout for sessions. GROUP ID: V-254927 RULE ID: SV-254927r1067716'
  rationale: Leaving sessions open indefinitely is a major security risk. An attacker can easily use an already authenticated
    session to access the hosted application as the previously authenticated user. By closing sessions after a set period
    of inactivity, the web server can make certain that sessions not closed through the user logging out of an application
    are eventually closed. Acceptable values are 5 minutes for high-value applications, 10 minutes for mediumvalue applications,
    and 20 minutes for low-value applications.
  impact: ''
  references: []
