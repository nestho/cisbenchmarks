  audit_raw: '1. Consult with the Tanium System Administrator to review the documented list of

    Tanium users.

    2. Review the users'' respective approved roles, as well as the correlated LDAP

    security group for the User Roles.

    3. Validate LDAP security groups/Tanium roles are documented to assign least

    privileged access to the functions of the Tanium Server through the Tanium

    interface.

    If the documentation does not reflect a granular, least privileged access approach to the

    LDAP Groups/Tanium Roles assignment, this is a finding.'
  remediation: '1. Using a web browser on a system that has connectivity to the Tanium

    Application, access the Tanium Application web user interface (UI) and log on

    with multi-factor authentication.

    2. Click "Administration" on the top navigation banner.

    3. Under Permissions, select "Users".

    4. Analyze the users configured in the Tanium interface.

    5. Determine least privileged access required for each user to perform their

    respective duties.

    6. Move users to the appropriate LDAP security group to ensure the user is synced

    to the appropriate Tanium User Role.

    7. If the appropriate LDAP security groups are not already configured, create the

    groups and add the appropriate users.

    8. Ensure LDAP sync repopulates the Tanium Users'' associated Roles accordingly.'
