    severity: medium
- id: '1.10'
  title: TANS-AP-000105
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Documentation identifying Tanium console users, their respective User Groups, Computer Groups, and Roles must
    be maintained. GROUP ID: V-254883 RULE ID: SV-254883r960792'
  rationale: System access must be reviewed periodically to verify all Tanium users are assigned the appropriate functional
    role, with the least privileged access possible to perform assigned tasks being the recommended best practice to avoid
    unauthorized access.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'Consult with the Tanium System Administrator to review the documented list of Tanium

    users. User Groups, Roles, Computer Groups, and correlated LDAP security groups

    must be documented for users.

    If the documentation does not exist, or is missing any Tanium users and their respective

    User Groups, Roles, Computer Groups, and correlated LDAP security groups

    documentation, this is a finding.'
  remediation: 'Prepare and maintain documentation identifying the Tanium console users and their

    respective User Groups, Roles, Computer Groups, and associated LDAP security

    groups.'
  checks:
  - type: manual_review
    info: 'Consult with the Tanium System Administrator to review the documented list of Tanium

      users. User Groups, Roles, Computer Groups, and correlated LDAP security groups

      must be documented for users.

      If the documentation does not exist, or is missing any Tanium users and their respective

      User Groups, Roles, Computer Groups, and correlated LDAP security groups

      documentation, this is a finding.'
    severity: medium
- id: '1.11'
  title: TANS-AP-000110
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium application must be configured to use Tanium User Groups in a manner consistent with the model
    outlined within the environment''s system documentation. GROUP ID: V-254884 RULE ID: SV-254884r960792'
  rationale: It is important for information system owners to document authorized user groups for the Tanium application to
    avoid unauthorized access to systems. Misaligned implementation of user groups grants excessive access and results in
    potential compromise of "need-to-know" when it comes to information access.
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'Consult with the Tanium System Administrator to review the documented list of Tanium

    User Groups.

    1. Using a web browser on a system that has connectivity to the Tanium

    Application, access the Tanium Application web user interface (UI) and log on

    with multi-factor authentication.

    2. Click "Administration" on the top navigation banner.

    3. Under Permissions, select "User Groups".

    4. Click each User Group and compare both the User Group name and the

    assigned Role(s) to the system documentation.

    If any users have access to Tanium and their User Group is not on the list of

    documented User Groups with the appropriate Role(s), this is a finding.'
  remediation: 'Consult the documentation identifying the Tanium User Groups and their respective

    Role(s).

    1. Using a web browser on a system that has connectivity to the Tanium

    Application, access the Tanium Application web user interface (UI) and log on

    with multi-factor authentication.

    2. Click "Administration" on the top navigation banner.

    3. Under Permissions, select "User Groups".

    4. Click each User Group and add any missing Role(s).

    5. For any missing User Groups, make the appropriate adjustments in LDAP.'
  checks:
