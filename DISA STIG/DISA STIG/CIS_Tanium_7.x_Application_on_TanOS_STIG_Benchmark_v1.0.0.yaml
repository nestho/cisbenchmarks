- id: '1.29'
  title: TANS-AP-000330
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium cryptographic signing capabilities must be enabled on the Tanium Clients to safeguard the authenticity
    of communications sessions when answering requests from the Tanium Server. GROUP ID: V-254903 RULE ID: SV-254903r1067697'
  rationale: 'All of Tanium''s signing capabilities must be enabled upon install. Tanium supports the cryptographic signing
    and verification before execution of all Sensors, Questions, Actions, Sensor Libraries, File Shards, etc. Enabling signing
    does away with the ability of an attacker to conduct Man in the Middle (MitM) attacks for the purposes of remote code
    execution and precludes the modification of the aforementioned data elements in transit. Additionally, Tanium supports
    object level signing for content ingested into the Tanium platform. This allows for the detection and rejection of changes
    to objects (sensors, actions, etc.) by even a privileged user within Tanium. Tanium has built-in signing capabilities
    enabled by default when installed. Cryptographic signing and verification of all Sensors, Questions, Actions, Sensor Libraries,
    File Shards, etc., before execution will be enforced by Tanium. Signing will prevent MitM remote code execution attacks
    and will protect data element in transit. Tanium also supports object level signing for content within the Tanium platform.
    Satisfies: SRG-APP-000131, SRG-APP-000219'
