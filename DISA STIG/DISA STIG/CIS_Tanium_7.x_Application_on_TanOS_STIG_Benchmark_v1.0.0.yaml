- id: '1.28'
  title: TANS-AP-000305
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium application must prohibit user installation, modification, or deletion of software without explicit
    privileged status. GROUP ID: V-254902 RULE ID: SV-254902r960939'
  rationale: 'Allowing regular users to install, modify, or delete software, without explicit privileges, creates the risk
    that the application performs in an inconsistent manner from its design. Explicit privileges (escalated or administrative
    privileges) provide the regular user with explicit capabilities and control that exceeds the rights of a regular user.
    Application functionality will vary, and while users are not permitted to install unapproved applications, there may be
    instances where the organization allows the user to install approved software packages such as from an approved software
    repository. The application must enforce software installation by users based upon what types of software installations
    are permitted (e.g., updates and security patches to existing software) and what types of installations are prohibited
    (e.g., software whose pedigree with regard to being potentially malicious is unknown or suspect) by the organization.
    Satisfies: SRG-APP-000121, SRG-APP-000122, SRG-APP-000123'
  impact: ''
  references: []
