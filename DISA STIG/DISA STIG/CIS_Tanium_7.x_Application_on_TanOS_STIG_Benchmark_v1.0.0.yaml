  references: []
  page_start: 22
  audit_raw: 'Note: If only using Tanium-provided content and not accepting content from any other

    content providers, this is Not Applicable.

    Obtain documentation from the Tanium System Administrator that contains the public

    key validation data.

    1. Access the Tanium Server interactively.

    2. Log on to the TanOS server with the tanadmin role.

    3. Press "2" for "Tanium Operations Menu," and then press "Enter".

    4. Press "5" for "Manage Custom Signing Keys," and then press "Enter".

    5. Press "L" for "List Content Signing Keys," and then press "Enter".

    If signing keys not listed in the provided documentation are present, this is a finding.'
  remediation: 'Note: If only using Tanium-provided content and not accepting content from any other

    content providers, this is Not Applicable.

    Obtain documentation from the Tanium System Administrator that contains the public

    key validation data.

    1. Access the Tanium Server interactively.

    2. Log on to the TanOS server with the tanadmin role.

    3. Press "2" for "Tanium Operations Menu," and then press "Enter".

    4. Press "5" for "Manage Custom Signing Keys," and then press "Enter".

    5. Press "A" for "List Content Signing Keys," and then press "Enter".

    6. Check the provided documentation and either update the document with the

    name and SHA-256 hash of the key or remove the key.'
  checks:
  - type: manual_review
    info: 'Note: If only using Tanium-provided content and not accepting content from any other

