- id: '1.21'
  title: TANS-AP-000175
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The publicly accessible Tanium application must display the Standard Mandatory DOD Notice and Consent Banner
    before granting access to the application. GROUP ID: V-254895 RULE ID: SV-254895r1067691'
  rationale: 'Display of a standardized and approved use notification before granting access to the publicly accessible application
    ensures privacy and security notification verbiage used is consistent with applicable federal laws, Executive Orders,
    directives, policies, regulations, standards, and guidance. System use notifications are required only for access via
    logon interfaces with human users and are not required when such human interfaces do not exist. The banner must be formatted
    in accordance with DTM-08-060. Use the following verbiage for desktops, laptops, and other devices accommodating banners
    of 1300 characters: "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized
    use only. By using this IS (which includes any device attached to this IS), you consent to the following conditions: -The
    USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration
    testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence
    (CI) investigations. -At any time, the USG may inspect and seize data stored on this IS. -Communications using, or data
    stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed
    or used for any USGauthorized purpose. -This IS includes security measures (e.g., authentication and access controls)
    to protect USG interests--not for your personal benefit or privacy. -Notwithstanding the above, using this IS does not
    constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications,
    or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants.
    Such communications and work product are private and confidential. See User Agreement for details." Satisfies: SRG-APP-000068,
    SRG-APP-000070'
  impact: ''
  references: []
  page_start: 48
  audit_raw: '1. Using a web browser on a system that has connectivity to the Tanium

    Application, access the Tanium Application web user interface (UI) and log on

    with multifactor authentication.

    2. Verify DOD use notification is displayed prior to login.

    "You are accessing a U.S. Government (USG) Information System (IS) that is

    provided for USG-authorized use only. By using this IS (which includes any

    device attached to this IS), you consent to the following conditions: The USG

    routinely intercepts and monitors communications on this IS for purposes

    including, but not limited to, penetration testing, COMSEC monitoring,

    network operations and defense, personnel misconduct (PM), law enforcement

    (LE), and counterintelligence (CI) investigations. At any time, the USG may

    inspect and seize data stored on this IS. Communications using, or data

    stored on, this IS are not private, are subject to routine monitoring,

    interception, and search, and may be disclosed or used for any USG-authorized

    purpose. This IS includes security measures (e.g., authentication and access

    controls) to protect USG interests--not for your personal benefit or privacy.

    Notwithstanding the above, using this IS does not constitute consent to PM,

    LE or CI investigative searching or monitoring of the content of privileged

    communications, or work product, related to personal representation or

    services by attorneys, psychotherapists, or clergy, and their assistants.

    Such communications and work product are private and confidential. See User

    Agreement for details."

    If a DOD-approved use notification banner does not display prior to logon, this is a

    finding.'
  remediation: 'For Tanium Server versions greater than or equal to 7.5.6.1108:

    1. Using a web browser on a system that has connectivity to the Tanium

    Application, access the Tanium Application web user interface (UI) and log on

    with multifactor authentication.

    2. Click "Administration" on the top navigation banner.

    3. Under Configuration, select "Settings".

    4. Click "Advanced Settings".

    5. In the Filter Items box on the top right, search for

    "console_PreLoginBannerHTMLText" and select it.

    6. In the "Value" field, enter the statement below:

    "You are accessing a U.S. Government (USG) Information System (IS) that is

    provided for USG-authorized use only. By using this IS (which includes any

    device attached to this IS), you consent to the following conditions: The USG

    routinely intercepts and monitors communications on this IS for purposes

    including, but not limited to, penetration testing, COMSEC monitoring,

    network operations and defense, personnel misconduct (PM), law enforcement

    (LE), and counterintelligence (CI) investigations. At any time, the USG may

    inspect and seize data stored on this IS. Communications using, or data

    stored on, this IS are not private, are subject to routine monitoring,

    interception, and search, and may be disclosed or used for any USG-authorized

    purpose. This IS includes security measures (e.g., authentication and access

    controls) to protect USG interests--not for your personal benefit or privacy.

    Notwithstanding the above, using this IS does not constitute consent to PM,

    LE or CI investigative searching or monitoring of the content of privileged

    communications, or work product, related to personal representation or

    services by attorneys, psychotherapists, or clergy, and their assistants.

    Such communications and work product are private and confidential. See User

    Agreement for details."

    9. Click "Save".

    Note: An html file can be uploaded in place of the above similar to previous versions of

    Tanium as shown below.

    Tanium Server versions below 7.5.6.110:

    1. Create an .html file composed of the DOD-authorized warning banner verbiage.

    "<html>You are accessing a U.S. Government (USG) Information System (IS) that

    is provided for USG-authorized use only. By using this IS (which includes any

    device attached to this IS), you consent to the following conditions: The USG

    routinely intercepts and monitors communications on this IS for purposes

    including, but not limited to, penetration testing, COMSEC monitoring,

    network operations and defense, personnel misconduct (PM), law enforcement

    (LE), and counterintelligence (CI) investigations. At any time, the USG may

    inspect and seize data stored on this IS. Communications using, or data

    stored on, this IS are not private, are subject to routine monitoring,

    interception, and search, and may be disclosed or used for any USG-authorized

    purpose. This IS includes security measures (e.g., authentication and access

    controls) to protect USG interests--not for your personal benefit or privacy.

    Notwithstanding the above, using this IS does not constitute consent to PM,

    LE or CI investigative searching or monitoring of the content of privileged

    communications, or work product, related to personal representation or

    services by attorneys, psychotherapists, or clergy, and their assistants.

    Such communications and work product are private and confidential. See User

    Agreement for details.</html>"

    2. Name the file "banner.html".

    3. Use SFTP to upload the HTML banner file to the /incoming folder.

    4. Log on to the TanOS server with the tanadmin user role.

    5. Enter 2: Tanium Operations >> X: Advanced Operations >> 4: Manage HTML

    Banner and follow the prompts to copy the HTML banner file to the appropriate

    location.

    6. Using a web browser on a system that has connectivity to the Tanium

    Application, access the Tanium Application web user interface (UI) and log on

    with multifactor authentication.

    7. Click "Administration" on the top navigation banner.

    8. Under Configuration, select "Settings".

    9. Select "Advanced Settings".

    10. Search for "console_PreLoginBannerHTML".

    11. Confirm "console_PreLoginBannerHTML" a value of "banner.html".

    Note: If the above setting is not present, create it using the following steps.

    1. Click "Add Setting".

    2. Select "Server" for "Setting Type".

    3. In "Create Platform Setting" dialog box, enter "console_PreLoginBannerHTML"

    for "Platform Setting Name".

    4. Select "Text" radio button from "Value Type".

    5. Enter "banner.html" for "Value:".

    6. Click "Save".'
