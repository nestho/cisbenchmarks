  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium Server and Client applications must have logging enabled. GROUP ID: V-254918 RULE ID: SV-254918r961125'
  rationale: Failure to a known state can address safety or security in accordance with the mission/business needs of the
    organization. Failure to a known secure state helps prevent a loss of confidentiality, integrity, or availability in the
    event of a failure of the information system or a component of the system. Preserving application state information helps
    to facilitate application restart and return to the operational mode of the organization with less disruption to mission-essential
    processes.
  impact: ''
  references: []
  page_start: 100
  audit_raw: 'Tanium Server:

    1. Using a web browser on a system that has connectivity to the Tanium

    Application, access the Tanium Application web user interface (UI) and log on

    with multi-factor authentication.

    2. Click "Administration" on the top navigation banner.

    3. Under "Configuration," select "Common".

    4. Select "Log Level".

    5. In "Log Verbosity Level for Troubleshooting," verify current level for "Tanium

    Server" is set.

    If the value for current level for "Tanium Server" is not set to "1" or higher this is a

    finding.

    Tanium Client:

    1. Using a web browser on a system that has connectivity to the Tanium

    Application, access the Tanium Application web user interface (UI) and log on

    with multi-factor authentication.

    2. Click "Modules" on the top navigation banner.

    3. Click "Interact".

    4. In the "Explore Data" box, type the following question:

    4A. Get Tanium Client Explicit Setting[LogVerbosityLevel] < 1 and Is Windows from all

    machines with Tanium Client Explicit Setting[LogVerbosityLevel] < 1

    Note: For VDI systems, follow vendor guidance:

    https://docs.tanium.com/client/client/os_imaging.html#VDI

    If there are any answers returned that are "0" this is a finding.'
  remediation: 'Tanium Server:

    1. Using a web browser on a system that has connectivity to the Tanium

    Application, access the Tanium Application web user interface (UI) and log on

