- id: '1.24'
  title: TANS-AP-000260
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium application must alert the ISSO and SA (at a minimum) in the event of an audit processing failure.
    GROUP ID: V-254898 RULE ID: SV-254898r960912'
  rationale: It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit logs
    as required. Without this notification, the security personnel may be unaware of an impending failure of the audit capability
    and system operation may be adversely affected. Audit processing failures include software/hardware errors, failures in
    the audit capturing mechanisms, and audit storage capacity being reached or exceeded. This requirement applies to each
    audit data storage repository (i.e., distinct information system component where audit records are stored), the centralized
    audit storage capacity of organizations (i.e., all audit data storage repositories combined), or both.
  impact: ''
  references: []
  page_start: 62
  audit_raw: '1. Using a web browser on a system that has connectivity to the Tanium

    Application, access the Tanium Application web user interface (UI) and log on

    with multi-factor authentication.

    2. Click "Modules" on the top navigation banner.

    3. Click "Connect".

    4. Review the configured Connections under "Connections" section.

    Work with the SIEM administrator to determine if an alert is configured when audit data

    is no longer received as expected.

    If there is no alert configured, this is a finding.'
  remediation: '1. Using a web browser on a system that has connectivity to the Tanium

