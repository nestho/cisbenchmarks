  title: TANS-AP-001150
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium application must limit the bandwidth used in communicating with endpoints to prevent a denial of
    service (DoS) condition at the server. GROUP ID: V-254948 RULE ID: SV-254948r961620'
  rationale: DoS is a condition when a resource is not available for legitimate users. When this occurs, the organization
    either cannot accomplish its mission or must operate at degraded capacity. This requirement addresses the configuration
    of applications to mitigate the impact of DoS attacks that have occurred or are ongoing on application availability. For
    each application, known and potential DoS attacks must be identified and solutions for each type implemented. A variety
    of technologies exist to limit or, in some cases, eliminate the effects of DoS attacks (e.g., limiting processes or restricting
    the number of sessions the application opens at one time). Employing increased capacity and bandwidth, combined with service
    redundancy, may reduce the susceptibility to some DoS attacks.
