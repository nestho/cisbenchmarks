- id: '1.36'
  title: TANS-AP-000425
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium application must enforce a minimum 15-character password length. GROUP ID: V-254910 RULE ID: SV-254910r1015864'
  rationale: The shorter the password, the lower the number of possible combinations that need to be tested before the password
    is compromised. Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts
    at guessing and brute-force attacks. Password length is one factor of several that helps to determine strength and how
    long it takes to crack a password. The shorter the password, the lower the number of possible combinations that need to
    be tested before the password is compromised. Use of more characters in a password helps to exponentially increase the
    time and/or resources required to compromise the password.
  impact: ''
  references: []
  page_start: 86
  audit_raw: 'Console Users:

    Per guidance, Enterprise Console users are inherited via LDAP synchronization, as

    such passwords are not managed or enforced at the Tanium application level.

    Local TanOS account:

    1. Access the Tanium Server interactively.

    2. Log on to the TanOS server with the tanadmin role.

    3. Press "C" for "User Administration Menu," and then press "Enter".

    4. Press "L" for "Local Tanium User Management," and then press "Enter".

    5. Press "B" for "Security Policy Local Authentication Service," and then press

    "Enter".

    If the value of "Password Minimum Length:" is less than "15", this is a finding.'
