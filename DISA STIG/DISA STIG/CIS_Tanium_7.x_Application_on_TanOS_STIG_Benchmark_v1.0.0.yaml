- id: '1.3'
  title: TANS-AP-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium Application Server console must be configured to initiate a session lock after a 15-minute period
    of inactivity. GROUP ID: V-254876 RULE ID: SV-254876r1067681'
  rationale: The Tanium Console, when multifactor authentication is enabled, will initiate a session lock based upon the ActivClient
    or other Smart Card software. By initiating the session lock, the console will be locked and not allow unauthorized access
    by anyone other than the original user. Although this setting does not apply when multifactor authentication is enabled,
    it should be explicitly disabled in the event multifactor authentication is ever broken or removed.
  impact: ''
  references: []
