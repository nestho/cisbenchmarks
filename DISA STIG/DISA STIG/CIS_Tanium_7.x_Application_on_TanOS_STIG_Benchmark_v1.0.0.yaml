    used as a host-based firewall on the Tanium Zone Server.

    2. Access the host-based firewall configuration on the Tanium Zone Server.

    3. Validate a rule exists for the following:

    3A. Port Needed: Tanium Clients to Zone Server over TCP port 17472, bi-directionally.

    If a host-based firewall rule does not exist to allow TCP port 17472, bi-directionally, from

    Tanium Clients to the Tanium Zone Server, this is a finding.'
  remediation: '1. Consult with the personnel who maintain the Enterprise Security Suite to

    configure host-based and network firewall rules to allow the following:

    1A. Tanium Clients or Zone Clients over TCP port 17472, bi-directionally.'
