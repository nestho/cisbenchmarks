- id: '1.75'
  title: TANS-AP-001420
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Tanium endpoint files must be excluded from host-based intrusion prevention intervention. GROUP ID: V-254954
    RULE ID: SV-254954r1067672'
  rationale: Similar to any other host-based applications, the Tanium Client is subject to the restrictions other system-level
    software may place on an operating environment. Antivirus, IPS, encryption, or other security and management stack software
    may disallow the Tanium Server from working as expected. https://docs.tanium.com/client/client/requirements.html#Host_system_security_exceptio
    ns
  impact: ''
  references: []
  page_start: 158
  audit_raw: 'Consult with the Tanium system administrator to determine the intrusion prevention

    software used on the Tanium Clients.

    Review the settings of the intrusion prevention software.

    Validate exclusions exist that exclude the Tanium program files from being restricted by

    intrusion prevention.

    If exclusions do not exist, this is a finding.'
  remediation: 'In the host-based intrusion prevention system, ensure the following folders are

    excluded:

    Windows (64-bit OS versions) - \Program Files (x86)\Tanium\Tanium Client

    Windows (32-bit OS versions) - \Program Files\Tanium\Tanium Client

    macOS - /Library/Tanium/TaniumClient

    Linux, Solaris, AIX - /opt/Tanium/TaniumClient

    In the host-based intrusion prevention system, ensure the following processes are

    excluded:

    Windows, macOS, Linux - <Tanium Client>/Tools/StdUtils directory or all the files that it

    contains, including:

    Windows, macOS, Linux - 7za.exe (Windows) or 7za (macOS, Linux)

    Windows, macOS, Linux - runasuser.exe (Windows only)

    Windows, macOS, Linux - runasuser64.exe (Windows only)

    Windows, macOS, Linux - TaniumExecWrapper.exe (Windows) or TaniumExecWrapper

    (macOS, Linux)

    Windows, macOS, Linux - TaniumFileInfo.exe (Windows only)

    Windows, macOS, Linux - TPowerShell.exe (Windows only)

    macOS, Linux, Solaris, AIX - <Tanium Client>/TaniumClient

    macOS, Linux, Solaris, AIX - <Tanium Client>/taniumclient

    macOS, Linux - <Tanium Client>/distribute-tools.sh

    macOS, Linux - <Tanium Client>/TaniumCX

    Windows - <Tanium Client>\TaniumClient.exe

    Windows - <Tanium Client>\TaniumCX.exe'
  checks:
  - type: manual_review
    info: 'Consult with the Tanium system administrator to determine the intrusion prevention

      software used on the Tanium Clients.

      Review the settings of the intrusion prevention software.

      Validate exclusions exist that exclude the Tanium program files from being restricted by

      intrusion prevention.

      If exclusions do not exist, this is a finding.'
    severity: medium
