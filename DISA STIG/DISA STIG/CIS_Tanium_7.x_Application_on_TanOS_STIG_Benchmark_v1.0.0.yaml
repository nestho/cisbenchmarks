  title: TANS-AP-000655
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium application must reveal error messages only to the ISSO, ISSM, and SA. GROUP ID: V-254921 RULE
    ID: SV-254921r961170'
  rationale: Only authorized personnel should be aware of errors and the details of the errors. Error messages are an indicator
    of an organization's operational state or can identify the application. Additionally, Personally Identifiable Information
    (PII) and operational information must not be revealed through error messages to unauthorized personnel or their designated
    representatives. The structure and content of error messages must be carefully considered by the organization and development
    team. The extent to which the information system is able to identify and handle error conditions is guided by organizational
    policy and operational requirements.
