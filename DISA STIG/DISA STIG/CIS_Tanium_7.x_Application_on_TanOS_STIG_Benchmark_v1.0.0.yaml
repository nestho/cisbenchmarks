- id: '1.62'
  title: TANS-AP-000950
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The application must enforce access restrictions associated with changes to application configuration. GROUP
    ID: V-254939 RULE ID: SV-254939r961461'
  rationale: Failure to provide logical access restrictions associated with changes to application configuration may have
    significant effects on the overall security of the system. When dealing with access restrictions pertaining to change
    control, it should be noted that any changes to the hardware, software, and/or firmware components of the information
    system and/or application can potentially have significant effects on the overall security of the system. Accordingly,
    only qualified and authorized individuals should be allowed to obtain access to application components for the purposes
    of initiating changes, including upgrades and modifications. Logical access restrictions include, for example, controls
    that restrict access to workflow automation, media libraries, abstract layers (e.g., changes implemented into third-party
    interfaces rather than directly into information systems), and change windows (e.g., changes occur only during specified
    times, making unauthorized changes easy to discover).
