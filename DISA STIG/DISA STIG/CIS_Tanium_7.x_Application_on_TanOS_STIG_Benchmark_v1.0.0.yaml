controls:
- id: '1.1'
  title: TANS-AP-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium max_soap_sessions_total setting must be explicitly enabled to limit the number of simultaneous
    sessions. GROUP ID: V-254874 RULE ID: SV-254874r1067675'
  rationale: Application management includes the ability to control the number of users and user sessions that utilize an
    application. Limiting the number of allowed users and sessions per user is helpful in limiting risks related to DoS attacks.
    This requirement may be met via the application or by utilizing information system, session control provided by a web
    server with specialized session management capabilities. If it has been specified that this requirement will be handled
    by the application, the capability to limit the maximum number of concurrent single user sessions must be designed and
    built in to the application. This requirement addresses concurrent sessions for information system accounts and does not
    address concurrent sessions by single users via multiple system accounts. The maximum number of concurrent sessions should
    be defined based upon mission needs and the operational environment for each system.
  impact: ''
  references: []
  page_start: 12
  audit_raw: '1. Using a web browser on a system that has connectivity to the Tanium

    Application, access the Tanium Application web user interface (UI) and log on

    with multifactor authentication.

    2. Click "Administration" on the top navigation banner.

    3. Under "Configuration", select "Settings".

    4. Click the "Advanced Settings" tab.

    5. In the "Filter items " search box, type "max_soap_sessions_total".

    6. Click "Enter".

    If no results are returned, this is a finding.

    If results are returned for "max_soap_sessions_total", but the value does not follow

    {(Number of Users) * 1024} formula, this is a finding.'
  remediation: '1. Using a web browser on a system that has connectivity to the Tanium

    Application, access the Tanium Application web user interface (UI) and log on

    with multifactor authentication.

    2. Click "Administration" on the top navigation banner.

    3. Under "Configuration", select "Settings".

    4. Click the "Advanced Settings" tab.

    5. Click "Create Setting".

    6. Select "Server" for "Setting Type".

    7. In the "Create Platform Setting" dialog box, enter "max_soap_sessions_total" for

    "Name".

    8. Select the "Numeric" radio button from "Value Type".

    9. Use this formula for determining "Setting Value" {(Number of Users) * 1024 =

    max_soap_sessions_total}

    10. Click "Save".

    11. Add this setting to the system documentation for validation.'
  checks:
  - type: manual_review
    info: '1. Using a web browser on a system that has connectivity to the Tanium

      Application, access the Tanium Application web user interface (UI) and log on

      with multifactor authentication.

      2. Click "Administration" on the top navigation banner.

      3. Under "Configuration", select "Settings".

      4. Click the "Advanced Settings" tab.

      5. In the "Filter items " search box, type "max_soap_sessions_total".

      6. Click "Enter".

      If no results are returned, this is a finding.

      If results are returned for "max_soap_sessio'
    severity: medium
