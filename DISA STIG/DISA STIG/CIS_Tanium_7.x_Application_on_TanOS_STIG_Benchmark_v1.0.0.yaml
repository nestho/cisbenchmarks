- id: '1.47'
  title: TANS-AP-000700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Tanium must notify system administrator (SA) and the information system security officer (ISSO) when accounts
    are created. GROUP ID: V-254923 RULE ID: SV-254923r1067707'
  rationale: Once an attacker establishes initial access to a system, the attacker often attempts to create a persistent method
    of re-establishing access. One way to accomplish this is for the attacker to simply create a new account. Notification
    of account creation is one method for mitigating this risk. A comprehensive account management process will ensure an
    audit trail, which documents the creation of application user accounts and notifies administrators and ISSO exists. Such
    a process greatly reduces the risk that accounts will be surreptitiously created and provides logging that can be used
    for forensic purposes. To address access requirements, many application developers choose to integrate their applications
    with enterprise-level authentication/access/auditing mechanisms that meet or exceed access control policy requirements.
    Such integration allows the application developer to offload those access control functions and focus on core application
    features and functionality.
  impact: ''
