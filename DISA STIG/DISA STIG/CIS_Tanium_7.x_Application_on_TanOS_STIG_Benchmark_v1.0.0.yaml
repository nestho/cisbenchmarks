- id: '1.26'
  title: TANS-AP-000280
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium applications must provide the capability to filter audit records for events of interest based upon
    organization-defined criteria. GROUP ID: V-254900 RULE ID: SV-254900r960924'
  rationale: The ability to specify the event criteria of interest provides the persons reviewing the logs with the ability
    to quickly isolate and identify these events without having to review entries that are of little or no consequence to
    the investigation. Without this capability, forensic investigations are impeded. Events of interest can be identified
    by the content of specific audit record fields including, for example, identities of individuals, event types, event locations,
    event times, event dates, system resources involved, IP addresses involved, or information objects accessed. Organizations
    may define audit event criteria to any degree of granularity required, for example, locations selectable by general networking
    location (e.g., by network or subnetwork) or selectable by specific information system component. This requires applications
    to provide the capability to customize audit record reports based on organization-defined criteria.
