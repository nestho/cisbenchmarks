- id: '1.41'
  title: TANS-AP-000505
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium application must uniquely identify and authenticate nonorganizational users (or processes acting
    on behalf of nonorganizational users). GROUP ID: V-254916 RULE ID: SV-254916r961053'
  rationale: Lack of authentication and identification enables nonorganizational users to gain access to the application or
    possibly other information systems and provides an opportunity for intruders to compromise resources within the application
    or information system. Nonorganizational users include all information system users other than organizational users, which
    include organizational employees or individuals the organization deems to have equivalent status of employees (e.g., contractors
    and guest researchers). Nonorganizational users must be uniquely identified and authenticated for all accesses other than
    those accesses explicitly identified and documented by the organization when related to the use of anonymous access, such
    as accessing a web server.
