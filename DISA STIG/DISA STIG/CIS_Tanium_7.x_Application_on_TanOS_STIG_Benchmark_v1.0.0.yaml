- id: '1.25'
  title: TANS-AP-000270
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Tanium application must be configured to send audit records from multiple components within the system
    to a central location for review and analysis of audit records. GROUP ID: V-254899 RULE ID: SV-254899r960918'
  rationale: Successful incident response and auditing relies on timely, accurate system information and analysis to allow
    the organization to identify and respond to potential incidents in a proficient manner. If the application does not provide
    the ability to centrally review the application logs, forensic analysis is negatively impacted. Segregation of logging
    data to multiple disparate computer systems is counterproductive and makes log analysis and log event alarming difficult
    to implement and manage, particularly when the system or application has multiple logging components written to different
    locations or systems. Automated mechanisms for centralized reviews and analyses include, for example, Security Information
    Management products.
  impact: ''
  references: []
