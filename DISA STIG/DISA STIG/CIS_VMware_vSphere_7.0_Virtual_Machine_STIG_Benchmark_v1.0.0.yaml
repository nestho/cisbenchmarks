  title: VMCH-70-000026
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Log size must be configured properly on the virtual machine (VM). GROUP ID: V-256474 RULE ID: SV-256474r959010'
  rationale: The ESXi hypervisor maintains logs for each individual VM by default. These logs contain information including
    but not limited to power events, system failure information, tools status and activity, time sync, virtual hardware changes,
    vMotion migrations, and machine clones. By default, the size of these logs is unlimited, and they are only rotated on
    vMotion or power events. This can cause storage issues at scale for VMs that do not vMotion or power cycle often.
