- id: '1.6'
  title: VMCH-70-000006
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Independent, nonpersistent disks must not be used on the virtual machine (VM). GROUP ID: V-256455 RULE ID:
    SV-256455r959010'
  rationale: The security issue with nonpersistent disk mode is that successful attackers, with a simple shutdown or reboot,
    might undo or remove any traces they were ever on the machine. To safeguard against this risk, production virtual machines
    should be set to use persistent disk mode; additionally, ensure activity within the VM is logged remotely on a separate
    server, such as a syslog server or equivalent Windows-based event collector. Without a persistent record of activity on
    a VM, administrators might never know whether they have been attacked or hacked. There can be valid use cases for these
    types of disks, such as with an application presentation solution where read-only disks are desired, and such cases should
    be identified and documented.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'From the vSphere Client, right-click the Virtual Machine and go to "Edit Settings".

    Review the attached hard disks and verify they are not configured as independent

    nonpersistent disks.

    or

    From a PowerCLI command prompt while connected to the ESXi host or vCenter

    server, run the following command:

    Get-VM "VM Name" | Get-HardDisk | Select Parent, Name, Filename, DiskType,

    Persistence | FT -AutoSize

    If the virtual machine has attached disks that are in independent nonpersistent mode

    and are not documented, this is a finding.'
  remediation: 'From the vSphere Client, right-click the Virtual Machine and go to "Edit Settings".

    Select the target hard disk and change the mode to "persistent" or uncheck

    "Independent".

    or

    From a PowerCLI command prompt while connected to the ESXi host or vCenter

    server, run the provided commands as shown below.

    Get-VM "VM Name" | Get-HardDisk | Set-HardDisk -Persistence IndependentPersistent

    or

    Get-VM "VM Name" | Get-HardDisk | Set-HardDisk -Persistence Persistent'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, right-click the Virtual Machine and go to "Edit Settings".

      Review the attached hard disks and verify they are not configured as independent

      nonpersistent disks.

      or

      From a PowerCLI command prompt while connected to the ESXi host or vCenter

      server, run the following command:

      Get-VM "VM Name" | Get-HardDisk | Select Parent, Name, Filename, DiskType,

      Persistence | FT -AutoSize

      If the virtual machine has attached disks that are in independent nonpersistent mode

      and are not do'
    severity: medium
- id: '1.7'
  title: VMCH-70-000007
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Host Guest File System (HGFS) file transfers must be disabled on the virtual machine (VM). GROUP ID: V-256456
    RULE ID: SV-256456r959010'
  rationale: Setting "isolation.tools.hgfsServerSet.disable" to "true" disables registration of the guest's HGFS server with
    the host. Application Programming Interfaces (APIs) that use HGFS to transfer files to and from the guest operating system,
    such as some VIX commands, will not function. An attacker could use this to transfer files inside the guest operating
    system.
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'From the vSphere Client, right-click the Virtual Machine and go to Edit Settings >> VM

    Options >> Advanced >> Configuration Parameters >> Edit Configuration.

    Verify the "isolation.tools.hgfsServerSet.disable" value is set to "true".

    or

    From a PowerCLI command prompt while connected to the ESXi host or vCenter

    server, run the following command:

    Get-VM "VM Name" | Get-AdvancedSetting -Name isolation.tools.hgfsServerSet.disable

    If the virtual machine advanced setting "isolation.tools.hgfsServerSet.disable" does not

    exist or is not set to "true", this is a finding.'
  remediation: 'From the vSphere Client, right-click the Virtual Machine and go to Edit Settings >> VM

    Options >> Advanced >> Configuration Parameters >> Edit Configuration.

    Find the "isolation.tools.hgfsServerSet.disable" value and set it to "true".

    If the setting does not exist, add the Name and Value setting at the bottom of screen.

    Note: The VM must be powered off to configure the advanced settings through the

    vSphere Client. Therefore, it is recommended to configure these settings with PowerCLI

    as this can be done while the VM is powered on. Settings do not take effect via either

    method until the virtual machine is cold started, not rebooted.

    or

    From a PowerCLI command prompt while connected to the ESXi host or vCenter

    server, run the provided commands as shown below.

    If the setting does not exist, run:

    Get-VM "VM Name" | New-AdvancedSetting -Name

    isolation.tools.hgfsServerSet.disable -Value true

    If the setting exists, run:

    Get-VM "VM Name" | Get-AdvancedSetting -Name isolation.tools.hgfsServerSet.disable

    | Set-AdvancedSetting -Value true'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, right-click the Virtual Machine and go to Edit Settings >> VM

      Options >> Advanced >> Configuration Parameters >> Edit Configuration.

      Verify the "isolation.tools.hgfsServerSet.disable" value is set to "true".

      or

      From a PowerCLI command prompt while connected to the ESXi host or vCenter

      server, run the following command:

      Get-VM "VM Name" | Get-AdvancedSetting -Name isolation.tools.hgfsServerSet.disable

      If the virtual machine advanced setting "isolation.tools.hgfsServerSet.'
    severity: medium
- id: '1.8'
  title: VMCH-70-000008
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Unauthorized floppy devices must be disconnected on the virtual machine (VM). GROUP ID: V-256457 RULE ID:
    SV-256457r959010'
  rationale: Ensure no device is connected to a virtual machine if it is not required. For example, floppy, serial, and parallel
    ports are rarely used for virtual machines in a data center environment, and CD/DVD drives are usually connected only
    temporarily during software installation.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'Floppy drives are no longer visible through the vSphere Client and must be done via the

    Application Programming Interface (API) or PowerCLI.

    From a PowerCLI command prompt while connected to the ESXi host or vCenter

    server, run the following command:

    Get-VM | Get-FloppyDrive | Select Parent, Name, ConnectionState

    If a virtual machine has a floppy drive connected, this is a finding.'
  remediation: 'Floppy drives are no longer visible through the vSphere Client and must be done via the

    API or PowerCLI.

    From a PowerCLI command prompt while connected to the ESXi host or vCenter

    server, run the following command:

    Get-VM "VM Name" | Get-FloppyDrive | Remove-FloppyDrive

    Note: The VM must be powered off to remove the floppy drive.'
  checks:
  - type: manual_review
    info: 'Floppy drives are no longer visible through the vSphere Client and must be done via the

      Application Programming Interface (API) or PowerCLI.

      From a PowerCLI command prompt while connected to the ESXi host or vCenter

      server, run the following command:

      Get-VM | Get-FloppyDrive | Select Parent, Name, ConnectionState

      If a virtual machine has a floppy drive connected, this is a finding.'
    severity: medium
- id: '1.9'
  title: VMCH-70-000009
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Unauthorized CD/DVD devices must be disconnected on the virtual machine (VM). GROUP ID: V-256458 RULE ID:
    SV-256458r959010'
  rationale: Ensure no device is connected to a virtual machine if it is not required. For example, floppy, serial, and parallel
    ports are rarely used for virtual machines in a data center environment, and CD/DVD drives are usually connected only
    temporarily during software installation.
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'From the vSphere Client, right-click the Virtual Machine and go to "Edit Settings".

    Review the VM''s hardware and verify no CD/DVD drives are connected.

    or

    From a PowerCLI command prompt while connected to the ESXi host or vCenter

    server, run the following command:

    Get-VM | Get-CDDrive | Where {$_.extensiondata.connectable.connected -eq $true} |

    Select Parent,Name

    If a virtual machine has a CD/DVD drive connected other than temporarily, this is a

    finding.'
  remediation: 'From the vSphere Client, right-click the Virtual Machine and go to "Edit Settings".

    Select the CD/DVD drive and uncheck "Connected" and "Connect at power on" and

    remove any attached ISOs.

    or

    From a PowerCLI command prompt while connected to the ESXi host or vCenter

    server, run the following command:

    Get-VM "VM Name" | Get-CDDrive | Set-CDDrive -NoMedia'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, right-click the Virtual Machine and go to "Edit Settings".

      Review the VM''s hardware and verify no CD/DVD drives are connected.

      or

      From a PowerCLI command prompt while connected to the ESXi host or vCenter

