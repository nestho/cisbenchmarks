- id: '1.13'
  title: VMCH-70-000013
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Console connection sharing must be limited on the virtual machine (VM). GROUP ID: V-256462 RULE ID: SV-256462r959010'
  rationale: By default, more than one user at a time can connect to remote console sessions. When multiple sessions are activated,
    each terminal window receives a notification about the new session. If an administrator in the VM logs in using a VMware
    remote console during their session, a nonadministrator in the VM might connect to the console and observe the administrator's
    actions. Also, this could result in an administrator losing console access to a VM. For example, if a jump box is being
    used for an open console session and the administrator loses connection to that box, the console session remains open.
    Allowing two console sessions permits debugging via a shared session. For the highest security, allow only one remote
    console session at a time.
  impact: ''
  references: []
