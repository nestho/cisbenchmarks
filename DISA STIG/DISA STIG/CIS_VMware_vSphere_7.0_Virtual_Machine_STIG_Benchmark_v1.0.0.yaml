- id: '1.23'
  title: VMCH-70-000024
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Encryption must be enabled for vMotion on the virtual machine (VM). GROUP ID: V-256472 RULE ID: SV-256472r959010'
  rationale: vMotion migrations in vSphere 6.0 and earlier transferred working memory and CPU state information in clear text
    over the vMotion network. As of vSphere 6.5, this transfer can be transparently encrypted using 256-bit AES-GCM with negligible
    performance impact. vSphere enables encrypted vMotion by default as "Opportunistic", meaning that encrypted channels are
    used where supported but the operation will continue in plain text where encryption is not supported. For example, when
    vMotioning between two hosts, encryption will always be used. However, because 6.0 and earlier releases do not support
    this feature, vMotion from a 7.0 host to a 6.0 host would be allowed but would not be encrypted. If the encryption is
    set to "Required", vMotions to unsupported hosts will fail. This must be set to "Opportunistic" or "Required".
  impact: ''
  references: []
  page_start: 51
  audit_raw: 'From the vSphere Client, select the virtual machine, right-click, and go to Edit Settings

    >> VM Options tab >> Encryption >> Encrypted vMotion.

    or

    From a PowerCLI command prompt while connected to the ESXi host or vCenter

    server, run the following command:

    Get-VM | Where {($_.ExtensionData.Config.MigrateEncryption -eq "disabled")}

    If the setting does not have a value of "Opportunistic" or "Required", this is a finding.'
  remediation: 'From the vSphere Client, select the Virtual Machine, right-click, and go to Edit Settings

    >> VM Options tab >> Encryption >> Encrypted vMotion.

    Set the value to "Opportunistic" or "Required".

    or

    From a PowerCLI command prompt while connected to the ESXi host or vCenter

    server, run the following commands:

    $spec = New-Object VMware.Vim.VirtualMachineConfigSpec

    $spec.MigrateEncryption = New-Object

    VMware.Vim.VirtualMachineConfigSpecEncryptedVMotionModes

    $spec.MigrateEncryption = $true

    (Get-VM -Name ).ExtensionData.ReconfigVM($spec)'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, select the virtual machine, right-click, and go to Edit Settings

      >> VM Options tab >> Encryption >> Encrypted vMotion.

      or

      From a PowerCLI command prompt while connected to the ESXi host or vCenter

      server, run the following command:

      Get-VM | Where {($_.ExtensionData.Config.MigrateEncryption -eq "disabled")}

      If the setting does not have a value of "Opportunistic" or "Required", this is a finding.'
    severity: medium
