  title: VMCH-70-000018
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Shared salt values must be disabled on the virtual machine (VM). GROUP ID: V-256466 RULE ID: SV-256466r959010'
  rationale: When salting is enabled (Mem.ShareForceSalting=1 or 2) to share a page between two virtual machines, both salt
    and the content of the page must be same. A salt value is a configurable advanced option for each virtual machine. The
    salt values can be specified manually in the virtual machine's advanced settings with the new option "sched.mem.pshare.salt".
    If this option is not present in the virtual machine's advanced settings, the value of the "vc.uuid" option is taken as
    the default value. Because the "vc.uuid" is unique to each virtual machine, by default Transparent Page Sharing (TPS)
    happens only among the pages belonging to a particular virtual machine (Intra-VM).
