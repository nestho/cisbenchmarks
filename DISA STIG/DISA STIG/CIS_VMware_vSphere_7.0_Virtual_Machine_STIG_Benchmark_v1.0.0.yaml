controls:
- id: '1.1'
  title: VMCH-70-000001
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Copy operations must be disabled on the virtual machine (VM). GROUP ID: V-256450 RULE ID: SV-256450r959010'
  rationale: Copy and paste operations are disabled by default; however, explicitly disabling this feature will enable audit
    controls to verify this setting is correct. Copy, paste, drag and drop, or GUI copy/paste operations between the guest
    operating system and the remote console could provide the means for an attacker to compromise the VM.
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'From the vSphere Client, right-click the Virtual Machine and go to Edit Settings >> VM

    Options >> Advanced >> Configuration Parameters >> Edit Configuration.

    Verify the "isolation.tools.copy.disable" value is set to true.

    or

    From a PowerCLI command prompt while connected to the ESXi host or vCenter

    server, run the following command:

    Get-VM "VM Name" | Get-AdvancedSetting -Name isolation.tools.copy.disable

    If the virtual machine advanced setting "isolation.tools.copy.disable" does not exist or is

    not set to "true", this is a finding.'
  remediation: 'From the vSphere Client, right-click the Virtual Machine and go to Edit Settings >> VM

    Options >> Advanced >> Configuration Parameters >> Edit Configuration.

    Find the "isolation.tools.copy.disable" value and set it to "true".

    If the setting does not exist, add the Name and Value setting at the bottom of screen.

    Note: The VM must be powered off to configure the advanced settings through the

    vSphere Client. Therefore, it is recommended to configure these settings with PowerCLI

    as this can be done while the VM is powered on. Settings do not take effect via either

    method until the virtual machine is cold started, not rebooted.

    or

    From a PowerCLI command prompt while connected to the ESXi host or vCenter

    server, run the provided commands as noted below.

    If the setting does not exist, run:

    Get-VM "VM Name" | New-AdvancedSetting -Name isolation.tools.copy.disable -Value

    true

    If the setting exists, run:

    Get-VM "VM Name" | Get-AdvancedSetting -Name isolation.tools.copy.disable | SetAdvancedSetting -Value true'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, right-click the Virtual Machine and go to Edit Settings >> VM

      Options >> Advanced >> Configuration Parameters >> Edit Configuration.

      Verify the "isolation.tools.copy.disable" value is set to true.

      or

      From a PowerCLI command prompt while connected to the ESXi host or vCenter

      server, run the following command:

      Get-VM "VM Name" | Get-AdvancedSetting -Name isolation.tools.copy.disable

      If the virtual machine advanced setting "isolation.tools.copy.disable" does not exist or is'
    severity: medium
