    causing a denial of service. In most datacenter environments, disk shrinking is not done, so this feature must be disabled.
    Repeated disk shrinking can make a virtual disk unavailable. The capability to wipe (erase) is available to nonadministrative
    users operating within the VM's guest operating system.
