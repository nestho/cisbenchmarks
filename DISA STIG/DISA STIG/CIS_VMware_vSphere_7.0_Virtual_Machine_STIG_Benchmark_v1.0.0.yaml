  profile:
  - 'SEVERITY: CAT III'
  description: 'System administrators must use templates to deploy virtual machines (VMs) whenever possible. GROUP ID: V-256468
    RULE ID: SV-256468r959010'
  rationale: Capture a hardened base operating system image (with no applications installed) in a template to ensure all VMs
    are created with a known baseline level of security. Use this template to create other, application-specific templates,
    or use the application template to deploy VMs. Manual installation of the operating system and applications into a VM
    introduces the risk of misconfiguration due to human or process error.
