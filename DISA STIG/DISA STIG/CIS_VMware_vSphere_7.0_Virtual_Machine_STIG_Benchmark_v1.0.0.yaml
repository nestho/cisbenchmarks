  description: 'DirectPath I/O must be disabled on the virtual machine (VM) when not required. GROUP ID: V-256476 RULE ID:
    SV-256476r959010'
  rationale: VMDirectPath I/O (PCI passthrough) enables direct assignment of hardware PCI functions to VMs. This gives the
    VM access to the PCI functions with minimal intervention from the ESXi host. This is a powerful feature for legitimate
    applications such as virtualized storage appliances, backup appliances, dedicated graphics, etc., but it also allows a
    potential attacker highly privileged access to underlying hardware and the PCI bus.
  impact: ''
  references: []
