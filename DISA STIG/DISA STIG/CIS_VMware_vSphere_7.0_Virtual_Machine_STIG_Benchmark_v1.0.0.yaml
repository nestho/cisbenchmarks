- id: '1.4'
  title: VMCH-70-000004
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Virtual disk shrinking must be disabled on the virtual machine (VM). GROUP ID: V-256453 RULE ID: SV-256453r959010'
  rationale: Shrinking a virtual disk reclaims unused space in it. If there is empty space in the disk, this process reduces
    the amount of space the virtual disk occupies on the host drive. Normal users and processes (those without root or administrator
    privileges) within virtual machines have the capability to invoke this procedure. However, if this is done repeatedly,
    the virtual disk can become unavailable while this shrinking is being performed, effectively causing a denial of service.
    In most datacenter environments, disk shrinking is not done, so this feature must be disabled. Repeated disk shrinking
    can make a virtual disk unavailable. The capability to shrink is available to nonadministrative users operating within
    the VM's guest operating system.
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'From the vSphere Client, right-click the Virtual Machine and go to Edit Settings >> VM

    Options >> Advanced >> Configuration Parameters >> Edit Configuration.

    Verify the "isolation.tools.diskShrink.disable" value is set to "true".

    or

    From a PowerCLI command prompt while connected to the ESXi host or vCenter

    server, run the following command:

    Get-VM "VM Name" | Get-AdvancedSetting -Name isolation.tools.diskShrink.disable

    If the virtual machine advanced setting "isolation.tools.diskShrink.disable" does not exist

    or is not set to "true", this is a finding.'
  remediation: 'From the vSphere Client, right-click the Virtual Machine and go to Edit Settings >> VM

    Options >> Advanced >> Configuration Parameters >> Edit Configuration.

    Find the "isolation.tools.diskShrink.disable" value and set it to "true".

    If the setting does not exist, add the Name and Value setting at the bottom of screen.

    Note: The VM must be powered off to configure the advanced settings through the

    vSphere Client. Therefore, it is recommended to configure these settings with PowerCLI

    as this can be done while the VM is powered on. Settings do not take effect via either

    method until the virtual machine is cold started, not rebooted.

    or

    From a PowerCLI command prompt while connected to the ESXi host or vCenter

    server, run the provided commands as shown below.

    If the setting does not exist, run:

    Get-VM "VM Name" | New-AdvancedSetting -Name isolation.tools.diskShrink.disable -

    Value true

    If the setting exists, run:

    Get-VM "VM Name" | Get-AdvancedSetting -Name isolation.tools.diskShrink.disable |

    Set-AdvancedSetting -Value true'
  checks:
  - type: manual_review
    info: 'From the vSphere Client, right-click the Virtual Machine and go to Edit Settings >> VM

