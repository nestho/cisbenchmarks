  profile:
  - 'SEVERITY: CAT II'
  description: 'Access to JMX management interface must be restricted. GROUP ID: V-222969 RULE ID: SV-222969r961095'
  rationale: Java Management Extensions (JMX) is used to provide programmatic access to Tomcat for management purposes. This
    includes monitoring and control of java applications running on Tomcat. If network access to the JMX port is not restricted,
    attackers can gain access to the application used to manage the system.
