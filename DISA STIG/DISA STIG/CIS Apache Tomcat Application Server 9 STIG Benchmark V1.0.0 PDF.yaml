- id: '1.74'
  title: TCAT-AS-001660
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'STRICT_SERVLET_COMPLIANCE must be set to true. GROUP ID: V-223002 RULE ID: SV-223002r961863'
  rationale: 'Strict Servlet Compliance forces Tomcat to adhere to standards specifications including but not limited to RFC2109.
    RFC2109 sets the standard for HTTP session management. This setting affects several settings which primarily pertain to
    cookie headers, cookie values, and sessions. Cookies will be parsed for strict adherence to specifications. Note that
    changing a number of these default settings may break some systems, as some browsers are unable to correctly handle the
    cookie headers that result from a strict adherence to the specifications. This one setting changes the default values
    for the following settings: org.apache.catalina.core. ApplicationContext.GET_RESOURCE_REQUIRE_SLASH org.apache.catalina.core.
    ApplicationDispatcher.WRAP_SAME_OBJECT org.apache.catalina.core. StandardHostValve.ACCESS_SESSION org.apache.catalina.session.
    StandardSession.ACTIVITY_CHECK org.apache.catalina.session. StandardSession.LAST_ACCESS_AT_START org.apache.tomcat.util.http.
    ServerCookie.ALWAYS_ADD_EXPIRES org.apache.tomcat.util.http. ServerCookie.FWD_SLASH_IS_SEPARATOR org.apache.tomcat.util.http.
    ServerCookie.PRESERVE_COOKIE_HEADER org.apache.tomcat.util.http. ServerCookie.STRICT_NAMING The resourceOnlyServlets attribute
    of any Context element. The tldValidation attribute of any Context element. The useRelativeRedirects attribute of any
    Context element. The xmlNamespaceAware attribute of any Context element. The xmlValidation attribute of any Context element.'
  impact: ''
  references: []
  page_start: 144
  audit_raw: 'If the system has an ISSM risk acceptance for operational issues that arise due to this

    setting, this is not a finding.

    From the Tomcat server as a privileged user, run the following command:

    sudo grep -i strict_servlet /etc/systemd/system/tomcat.service

    If there are no results, or if the

    -Dorg.apache.catalina.STRICT_SERVLET_COMPLIANCE is not set to true, this is a

    finding.

    External - General'
  remediation: 'From the Tomcat server as a privileged user:

    Edit the /etc/systemd/system/tomcat.service file and either add or edit the

    org.apache.catalina.STRICT_SERVLET_COMPLIANCE setting.

    Set the org.apache.catalina.STRICT_SERVLET_COMPLIANCE=true

    EXAMPLE:

    CATALINA_OPTS=''-Dorg.apache.catalina.STRICT_SERVLET_COMPLIANCE=true''

    Restart the Tomcat server:

    sudo systemctl restart tomcat

    sudo systemctl daemon-reload'
  checks:
  - type: manual_review
    info: 'If the system has an ISSM risk acceptance for operational issues that arise due to this

      setting, this is not a finding.

      From the Tomcat server as a privileged user, run the following command:

      sudo grep -i strict_servlet /etc/systemd/system/tomcat.service

      If there are no results, or if the

      -Dorg.apache.catalina.STRICT_SERVLET_COMPLIANCE is not set to true, this is a

      finding.

      External - General'
    severity: medium
- id: '1.75'
  title: TCAT-AS-001670
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'RECYCLE_FACADES must be set to true. GROUP ID: V-223003 RULE ID: SV-223003r961863'
  rationale: If RECYCLE_FACADES is true or if a security manager is in use, a new facade object will be created for each request.
    This reduces the chances that a bug in an application might expose data from one request to another. This setting is configured
    using environment variable settings. For Linux OS flavors other than Ubuntu, use the relevant OS commands. For Ubuntu,
    this setting can be managed in the /etc/systemd/system/tomcat.service file via the CATALINA_OPTS variable. This setting
    is defined in the file and referenced during Tomcat startup in order to load Tomcat environment variables. Technically,
    the tomcat.service referenced in the check and fix could be called a different name, for STIG purposes and to provide
    a standard setting that can be referred to and obviously is used for Tomcat, tomcat.service was chosen.
  impact: ''
  references: []
  page_start: 146
  audit_raw: 'From the Tomcat server as a privileged user, run the following command:

    sudo grep -i recycle_facades /etc/systemd/system/tomcat.service

