  description: 'Application user name must be logged. GROUP ID: V-222985 RULE ID: SV-222985r961362'
  rationale: 'The access logfile format is defined within a Valve that implements the org.apache.catalina.valves.AccessLogValve
    interface within the /opt/tomcat/server.xml configuration file: The %u pattern code is included in the pattern element
    and logs the username used to authenticate to an application. Including the username pattern in the log configuration
    provides useful information about the application user who is logging in, which is critical for troubleshooting and forensic
    investigations.'
  impact: ''
