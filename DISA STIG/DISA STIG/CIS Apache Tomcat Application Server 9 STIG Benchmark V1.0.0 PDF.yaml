- id: '1.47'
  title: TCAT-AS-000820
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Tomcat must be configured to limit data exposure between applications. GROUP ID: V-222973 RULE ID: SV-222973r1043180'
  rationale: If RECYCLE_FACADES is true or if a security manager is in use, a new facade object will be created for each request.
    This reduces the chances that a bug in an application might expose data from one request to another. This setting is configured
    using environment variable settings. For Linux OS flavors other than Ubuntu, use the relevant OS commands. For Ubuntu,
    this setting can be managed in the /etc/systemd/system/tomcat.service file via the CATALINA_OPTS variable. This setting
    is defined in the file and referenced during tomcat startup in order to load tomcat environment variables. Technically,
    the tomcat.service referenced in the check and fix could be called a different name; but for STIG purposes and to provide
    a standard setting that can be referred to and obviously is used for Tomcat, tomcat.service was chosen.
  impact: ''
  references: []
