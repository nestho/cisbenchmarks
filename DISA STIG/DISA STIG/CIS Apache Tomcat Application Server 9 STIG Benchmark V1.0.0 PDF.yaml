    -Default location:

    keytool -list -cacerts -v | grep -i issuer

    -Alternate location:

    keytool -list -keystore -v |grep -i issuer

    If there are no CA certificates issued by a Certificate Authority (CA) that is part of the

    DoD PKI/PKE, this is a finding.'
