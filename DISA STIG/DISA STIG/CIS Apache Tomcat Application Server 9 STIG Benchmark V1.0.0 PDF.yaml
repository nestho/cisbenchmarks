  references: []
  page_start: 91
  audit_raw: 'Review the system security plan and network documentation. Identify the management

    networks that are used for system management.

    From the Tomcat server as a privileged user, run the following command:

    sudo grep -i jmxremote /etc/systemd/system/tomcat.service

    sudo ps -ef |grep -i jmxremote

    If there are no results, the JMX process is not being used, and this is not a finding.

    If output includes jmxremote information, review the -

    Dcom.sun.management.jmxremote.host setting.

    Compare the IP address associated with the JMX process with the network information

    in the SSP. Ensure the IP address space is dedicated for system management

    purposes.

    If the IP address that is associated with the JMX process is not dedicated to system

    management usage, this is a finding.

    If jmxremote is in use but the host IP address is not specified, this is a finding.

    External - General'
  remediation: 'Make an operational determination regarding the use of JMX. If JMX management is

    decided upon, identify the management networks that are used for system

    management. Update the system security plan and network documentation with the

    information.

