  profile:
  - 'SEVERITY: CAT II'
  description: 'Certificates in the trust store must be issued/signed by an approved CA. GROUP ID: V-222994 RULE ID: SV-222994r961596'
  rationale: Use of self-signed certificates creates a lack of integrity and invalidates the certificate based authentication
    trust model. Certificates used by production systems must be issued/signed by a trusted Root CA and cannot be self-signed.
    For systems that communicate with industry partners, the DoD ECA program supports the issuance of DoD-approved certificates
    to industry partners. For information on the DoD ECA program, refer to the DoD PKI office. Links to their site are available
    on https://public.cyber.mil.
