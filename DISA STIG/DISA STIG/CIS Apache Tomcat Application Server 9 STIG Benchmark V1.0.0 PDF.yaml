    The exceptions are the logs, temp, and work directories that are owned by the Tomcat user rather than root. This means
    that even if an attacker compromises the Tomcat process, they cannot change the Tomcat configuration, deploy new web applications,
    or modify existing web applications. The Tomcat process runs with a umask of 0027 to maintain these permissions. Note
    that running Tomcat in a Docker environment can impact how file permissions and user ownership settings are applied. Due
    to associated Docker configuration complexities, the STIG is scoped for standalone rather than virtual Docker deployments.
    Satisfies: SRG-APP-000121-AS-000081, SRG-APP-000122-AS-000082, SRG-APP000123-AS-000083, SRG-APP-000340-AS-000185'
  impact: ''
  references: []
  page_start: 56
  audit_raw: 'Access the Tomcat server from the command line and execute the following OS

    command:

    sudo find $CATALINA_HOME/bin -follow -maxdepth 0 -type d ( ! -perm 750 ) -ls

    If no folders are displayed, this is not a finding.

    If results indicate the $CATALINA_HOME/bin folder permissions are not set to 750, this

    is a finding.'
  remediation: 'Run the following command on the Tomcat server:

    sudo find $CATALINA_HOME/bin -follow -maxdepth 0 -type d -print0 | sudo xargs

    chmod 750 $CATALINA_HOME/bin'
  checks:
  - type: manual_review
    info: 'Access the Tomcat server from the command line and execute the following OS

      command:

      sudo find $CATALINA_HOME/bin -follow -maxdepth 0 -type d ( ! -perm 750 ) -ls

      If no folders are displayed, this is not a finding.

      If results indicate the $CATALINA_HOME/bin folder permissions are not set to 750, this

      is a finding.'
    severity: medium
- id: '1.24'
  title: TCAT-AS-000450
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Tomcat user UMASK must be set to 0027. GROUP ID: V-222949 RULE ID: SV-222949r960960'
  rationale: For Unix-based systems, umask settings affect file creation permissions. If the permissions are too loose, newly
    created log files and applications could be accessible to unauthorized users via the file system. Ensure the Tomcat OS
    user account has the correct file creation permission settings by validating the OS umask settings for the Tomcat user.
    Setting umask to 0027 gives the Tomcat user full rights, group users r-x permission and all others no access. Tomcat will
    most likely be running as a systemd service. Locate the systemd service file for Tomcat. The default location for the
    link to the service file is in /etc/systemd/system folder. The service file name should be indicative of the Tomcat process
    so tomcat.service is the logical name for the service file and is the name referenced by the STIG.
  impact: ''
  references: []
  page_start: 58
  audit_raw: 'Reference the system documentation and make relevant changes to the following

    commands if the system differs:

    From the Tomcat server command line run the following command:

    sudo cat /etc/systemd/system/tomcat.service | grep -i umask

    If the umask is not = 0027, this is a finding.'
  remediation: 'From the Tomcat server as a privileged user:

    Use a file editor like nano or vi and edit the /etc/systemd/system/tomcat.service file.

    Change the "UMask=" setting to 0027.

    UMask =0027

    Save the file and restart Tomcat:

    sudo systemctl restart tomcat

    sudo systemctl daemon-reload'
  checks:
  - type: command
    command: sudo cat /etc/systemd/system/tomcat.service | grep -i umask
    expected: ''
    severity: medium
    info: 'Reference the system documentation and make relevant changes to the following

      commands if the system differs:

      From the Tomcat server command line run the following command:

      sudo cat /etc/systemd/system/tomcat.service | grep -i umask

      If the umask is not = 0027, this is a finding.'
- id: '1.25'
  title: TCAT-AS-000470
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Stack tracing must be disabled. GROUP ID: V-222950 RULE ID: SV-222950r960963'
  rationale: Stack tracing provides debugging information from the application call stacks when a runtime error is encountered.
    If stack tracing is left enabled, Tomcat will provide this call stack information to the requestor which could result
    in the loss of sensitive information or data that could be used to compromise the system. As with all STIG settings, it
    is acceptable to temporarily enable for troubleshooting and debugging purposes but the setting must not be left enabled
    after troubleshooting tasks have been completed.
  impact: ''
  references: []
  page_start: 60
  audit_raw: 'From the Tomcat server run the following OS command:

    sudo cat $CATALINA_BASE/conf/server.xml | grep -i connector

    Review each connector element, ensure each connector does not have an "allowTrace"

    setting or ensure the "allowTrace" setting is set to false.

    <Connector ... allowTrace="false" />

    Do the same for each application by checking every

    $CATALINA_BASE/webapps/<APP_NAME>/WEBINF/web.xml file on the system.

    sudo cat $CATALINA_BASE/webapps/<APP_NAME>/WEBINF/web.xml |grep -i

    connector

    If a connector element in the server.xml file or in any of the <APP

    NAME>/WEBINF/web.xml files contains the "allow Trace = true" statement, this is a

    finding.'
  remediation: 'From the Tomcat server as a privileged user, edit the xml files containing the "allow

    Trace=true" statement.

    Remove the "allow Trace=true" statement from the affected xml configuration files and

    restart the Tomcat server:

    sudo systemctl restart tomcat

    sudo systemctl daemon-reload'
  checks:
  - type: command
    command: sudo cat $CATALINA_BASE/conf/server.xml | grep -i connector
    expected: ''
    severity: medium
    info: 'From the Tomcat server run the following OS command:

      sudo cat $CATALINA_BASE/conf/server.xml | grep -i connector

      Review each connector element, ensure each connector does not have an "allowTrace"

      setting or ensure the "allowTrace" setting is set to false.

      <Connector ... allowTrace="false" />

      Do the same for each application by checking every

      $CATALINA_BASE/webapps/<APP_NAME>/WEBINF/web.xml file on'
- id: '1.26'
  title: TCAT-AS-000490
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The shutdown port must be disabled. GROUP ID: V-222951 RULE ID: SV-222951r960963'
  rationale: Tomcat listens on TCP port 8005 to accept shutdown requests. By connecting to this port and sending the SHUTDOWN
    command, all applications within Tomcat are halted. The shutdown port is not exposed to the network as it is bound to
    the loopback interface. Set the shutdown attribute in $CATALINA_BASE/conf/server.xml.
  impact: ''
  references: []
  page_start: 62
  audit_raw: 'From the Tomcat server run the following OS command:

    $ sudo grep -i shutdown $CATALINA_BASE/conf/server.xml

    Ensure the server shutdown port attribute in $CATALINA_BASE/conf/server.xml is set

    to -1.

    EXAMPLE:

    <Server port="-1" shutdown="SHUTDOWN">

    If Server port not = "-1" shutdown="SHUTDOWN", this is a finding.'
  remediation: 'From the Tomcat server as a privileged user, edit the

    $CATALINA_BASE/conf/server.xml file: set the Server port setting to -1 and restart the

    Tomcat server.

    sudo systemctl restart tomcat

    sudo systemctl daemon-reload'
  checks:
  - type: manual_review
    info: 'From the Tomcat server run the following OS command:

      $ sudo grep -i shutdown $CATALINA_BASE/conf/server.xml

      Ensure the server shutdown port attribute in $CATALINA_BASE/conf/server.xml is set

      to -1.

      EXAMPLE:

      <Server port="-1" shutdown="SHUTDOWN">

      If Server port not = "-1" shutdown="SHUTDOWN", this is a finding.'
    severity: medium
- id: '1.27'
  title: TCAT-AS-000500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Unapproved connectors must be disabled. GROUP ID: V-222952 RULE ID: SV-222952r960963'
  rationale: Connectors are how Tomcat receives requests, passes them to hosted web applications, and then sends back the
    results to the requestor. Tomcat provides HTTP and Apache JServ Protocol (AJP) connectors and makes these protocols available
    via configured network ports. Unapproved connectors provide open network connections to either of these protocols and
    put the system at risk.
  impact: ''
  references: []
  page_start: 63
  audit_raw: 'Review SSP for list of approved connectors and associated TCP/IP ports. Ensure only

    approved connectors are present. Execute the following command on the Tomcat

    server to find configured Connectors:

    $ grep “Connector” $CATALINA_BASE/conf/server.xml

    Review results and verify all connectors and their associated network ports are

    approved in the SSP.

    If connectors are found but are not approved in the SSP, this is a finding.'
  remediation: 'Obtain ISSO approvals for the configured connectors and document in the SSP.

    Alternatively, edit the $CATALINA_BASE/conf/server.xml file, remove any unapproved

    connectors, and restart Tomcat:

    sudo systemctl restart tomcat

    sudo systemctl daemon-reload'
  checks:
  - type: manual_review
    info: 'Review SSP for list of approved connectors and associated TCP/IP ports. Ensure only

      approved connectors are present. Execute the following command on the Tomcat

      server to find configured Connectors:

      $ grep “Connector” $CATALINA_BASE/conf/server.xml

      Review results and verify all connectors and their associated network ports are

      approved in the SSP.

      If connectors are found but are not approved in the SSP, this is a finding.'
    severity: medium
