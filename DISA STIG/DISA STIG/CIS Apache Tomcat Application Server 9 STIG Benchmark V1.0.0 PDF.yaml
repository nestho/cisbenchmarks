  title: TCAT-AS-000710
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Keystore file must be protected. GROUP ID: V-222967 RULE ID: SV-222967r985893'
  rationale: Keystore file contains authentication information used to access application data and data resources. Access
    to the file must be protected. The default location is in the .keystore file stored in the home folder of the user account
    used to run Tomcat, although some administrators may choose to locate the file elsewhere. The location will also be specified
    in the server.xml file.
  impact: ''
  references: []
  page_start: 86
  audit_raw: 'Identify the location of the .keystore file. Refer to system documentation or review the

    server.xml file for a specified .keystore file location.

    From the Tomcat server console, run the following command to check the server.xml

    file:

    sudo grep -i keystorefile $CATALINA_BASE/conf/server.xml

    Extract the location of the file from the output.

    Example:

    [keystorefile=/opt/tomcat/conf/<filename.jks>]

    sudo ls -la [keystorefile location]

    If the file permissions are not set to 640 USER:root GROUP:tomcat, this is a finding.

    If the keystore file is not stored within the tomcat folder path, i.e. [/opt/tomcat/], this is a

    finding.'
  remediation: 'Run the following commands on the Tomcat server:

    sudo chmod 640 [keystorefile]

    sudo chown root [keystorefile]

    sudo chgrp tomcat [keystorefile]

    Store the keystore file in a secured folder within the Tomcat folder path.'
