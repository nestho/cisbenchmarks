- id: '1.36'
  title: TCAT-AS-000590
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Applications in privileged mode must be approved by the ISSO. GROUP ID: V-222961 RULE ID: SV-222961r1043177'
  rationale: The privileged attribute controls if a context (application) is allowed to use container provided servlets like
    the Manager servlet. It is false by default and should only be changed for trusted web applications. Set to true to allow
    the context (application) to use container servlets, like the manager servlet. Use of the privileged attribute will change
    the context's parent class loader to be the Server class loader rather than the Shared class loader. Note that in a default
    installation, the Common class loader is used for both the Server and the Shared class loaders. Use of the privileged
    attribute will change the context's parent class loader to be the Server class loader rather than the Shared class loader.
  impact: ''
  references: []
