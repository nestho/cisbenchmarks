- id: '1.41'
  title: TCAT-AS-000700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'DOD root CA certificates must be installed in Tomcat trust store. GROUP ID: V-222966 RULE ID: SV-222966r985891'
  rationale: Tomcat truststores are used to validate client certificates. On the Ubuntu OS, by default, Tomcat uses the "cacerts"
    file as the CA trust store. The file is located in the /etc/ssl/certs/java/ folder with a link to the file in $JAVA_HOME/lib/security/cacerts.
    However, this location can be modified by setting the value of the javax.net.ssl.trustStore system property. Setting this
    property within an OS environment variable will change the location to point to a different trust store. The Java OS environment
    variables in the systemd Tomcat startup file must be checked in order to identify the location of the trust store on the
    file system. (The STIG uses the name tomcat.service as a reference, but technically this file can be called anything).
    If the property is not set, then the default location is used for the truststore.
  impact: ''
  references: []
  page_start: 84
  audit_raw: 'This is a mutual authentication requirement where both the Tomcat server and the client

    are required to authenticate themselves via mutual TLS. Review system security plan

    and other system documentation. If the system has no connections requiring mutual

    authentication (e.g., proxy servers or other hosts specified in the system

    documentation), this requirement is Not Applicable.

    For the systemd Ubuntu OS, check the tomcat.service file to read the content of the

    JAVA_OPTS environment variable setting.

    sudo cat /etc/systemd/system/tomcat.service |grep -i truststore

    EXAMPLE output:

    set JAVA_OPTS="-Djavax.net.ssl.trustStore=/path/to/truststore" "-

    Djavax.net.ssl.trustStorePassword=************"

    If the variable is not set, use the default location command below. If the variable is set,

    use the alternate location command below and include the path and truststore file.

    -Default location:

    keytool -list -cacerts -v | grep -i issuer

    -Alternate location:

    keytool -list -keystore -v |grep -i issuer

    If there are no CA certificates issued by a CA that are part of the DOD PKI/PKE, this is

    a finding.

    External - General'
  remediation: 'Obtain and install the DOD PKI CA certificate bundles by accessing the DOD PKI office

    website at cyber.mil/pki-pke.

    Import the DOD CA certificates.'
