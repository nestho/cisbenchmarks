    EXAMPLE:

    Environment=''CATALINA_OPTS -Dorg.apache.catalina.connector.

    RECYCLE_FACADES=true''

    Restart the Tomcat server:

    sudo systemctl restart tomcat

    sudo systemctl daemon-reload

    External - General'
