benchmark:
  id: cis-apache-tomcat-application-server-9-security-technical-implementation-guide-stig-benchmark
  title: CIS Apache Tomcat Application Server 9 Security Technical Implementation Guide STIG Benchmark
  version: 1.0.0
  technology: DISA STIG
  category: DISA STIG
  os: DISA STIG
  source_pdf: CIS Apache Tomcat Application Server 9 STIG Benchmark V1.0.0 PDF.pdf
  total_pages: 163
  controls_count: 82
controls:
- id: '1.1'
  title: TCAT-AS-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Secured connectors must be configured to use strong encryption ciphers. GROUP ID: V-222927 RULE ID: SV-222927r960759'
  rationale: The Tomcat <Connector> element controls the TLS protocol and the associated ciphers used. If a strong cipher
    is not selected, an attacker may be able to circumvent encryption protections that are configured for the connector. Strong
    ciphers must be employed when configuring a secured connector. The configuration attribute and its values depend on what
    HTTPS implementation the user is utilizing. The user may be utilizing either Java-based implementation aka JSSE — with
    BIO and NIO connectors, or OpenSSL-based implementation — with APR connector. TLSv1.2 ciphers are configured via the server.xml
    file on a per connector basis. For a list of approved ciphers, refer to NIST SP 800-52 section 3.3.1.1.
  impact: ''
  references: []
  page_start: 12
  audit_raw: 'From the Tomcat server console, run the following command:

    sudo grep -i ciphers $CATALINA_BASE/conf/server.xml.

    Examine each <Connector/> element that is not a redirect to a secure port. Identify the

    ciphers that are configured on each connector and determine if any of the ciphers are

    not secure.

    For a list of approved ciphers, refer to NIST SP 800-52 section 3.3.1.1.

    If insecure ciphers are configured for use, this is a finding.'
  remediation: 'As a privileged user on the Tomcat server, edit the $CATALINA_BASE/conf/server.xml

    and modify the <Connector/> element.

    Add the SSLEnabledProtocols="TLSv1.2" setting to the connector or modify the existing

    setting.

    Set SSLEnabledProtocols="TLSv1.2". Save the server.xml file and restart Tomcat:

    sudo systemctl restart tomcat

    sudo systemctl reload-daemon

    External - General'
  checks:
  - type: manual_review
    info: 'From the Tomcat server console, run the following command:

      sudo grep -i ciphers $CATALINA_BASE/conf/server.xml.

      Examine each <Connector/> element that is not a redirect to a secure port. Identify the

      ciphers that are configured on each connector and determine if any of the ciphers are

      not secure.

      For a list of approved ciphers, refer to NIST SP 800-52 section 3.3.1.1.

      If insecure ciphers are configured for use, this is a finding.'
    severity: medium
- id: '1.2'
  title: TCAT-AS-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The number of allowed simultaneous sessions to the manager application must be limited. GROUP ID: V-222926
    RULE ID: SV-222926r960735'
  rationale: The manager application provides configuration access to the Tomcat server. Access to the manager application
    must be limited and that includes the number of sessions allowed to access the management application. A balance must
    be struck between the number of simultaneous connections allowed to the management application and the number of authorized
    admins requiring access at any given time. Determine the number of authorized admins requiring simultaneous access and
    increase the number of allowed simultaneous sessions by a small percentage in order to help prevent potential lockouts.
    Document that value in the System Security Plan (SSP).
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'If the manager application is not in use or has been deleted from the system, this is not

    a finding.

    From the Tomcat server as an elevated user run the following command:

    sudo grep -i maxactivesessions $CATALINA_BASE/webapps/manager/ METAINF/context.xml

    If the maxActiveSesions setting is not configured according to the number of

    connections defined in the SSP, this is a finding.'
  remediation: 'Determine the number of authorized admins requiring simultaneous access and

    increase the number of allowed simultaneous sessions by a small percentage in order

    to address potential lockout scenarios. Document that value in the System Security

    Plan.

    Review the maxActiveSessions setting in the $CATALINA_BASE/webapps/manager/

    META-INF/context.xml configuration file.

    Configure maxActiveSessions setting according to admin access requirements defined

    in the SSP.

    EXAMPLE:

    <Manager … maxActiveSessions="10" />

    External - General'
  checks:
  - type: manual_review
    info: 'If the manager application is not in use or has been deleted from the system, this is not

      a finding.

      From the Tomcat server as an elevated user run the following command:

      sudo grep -i maxactivesessions $CATALINA_BASE/webapps/manager/ METAINF/context.xml

      If the maxActiveSesions setting is not configured according to the number of

      connections defined in the SSP, this is a finding.'
    severity: medium
- id: '1.3'
  title: TCAT-AS-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'HTTP Strict Transport Security (HSTS) must be enabled. GROUP ID: V-222928 RULE ID: SV-222928r960762'
  rationale: HTTP Strict Transport Security (HSTS) instructs web browsers to only use secure connections for all future requests
    when communicating with a website. Doing so helps prevent SSL protocol attacks, SSL stripping, cookie hijacking, and other
    attempts to circumvent SSL protection. Implementing HSTS requires testing of your web applications to ensure SSL certificates
    align correctly with application requirements and sub-domains if sub-domains are used. Ensure certificates are installed
    and working correctly. If sub-domains are in use, all sub-domains must be covered in the SSL/TLS certificate and the includeSubDomains
    directive must be specified in order for HSTS to function properly.
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'From the Tomcat server console, run the following command:

    sudo grep -i -A5 -B8 hstsEnable $CATALINA_BASE/conf/web.xml file.

    If the httpHeaderSecurity filter is commented out or if hstsEnable is not set to "true", this

    is a finding.

    External - General'
  remediation: 'From the Tomcat server as a privileged user, edit the web.xml file:

    sudo nano $CATALINA_BASE/conf/web.xml file.

    Uncomment the existing httpHeaderSecurity filter section or create the filter section

    using the following code:

    NOTE: includeSubDomains param-value and url-pattern values may change and can

    vary according to local deployment requirements.

    httpHeaderSecurity

    org.apache.catalina.filters.HttpHeaderSecurityFilter

    hstsEnabled

    true

    hstsMaxAgeSeconds

    31536000

    hstsIncludeSubDomains

    true

    true

    Create or uncomment the httpHeaderSecurity filter mapping:

    httpHeaderSecurity

    /*

    REQUEST'
  checks:
  - type: manual_review
    info: 'From the Tomcat server console, run the following command:

      sudo grep -i -A5 -B8 hstsEnable $CATALINA_BASE/conf/web.xml file.

      If the httpHeaderSecurity filter is commented out or if hstsEnable is not set to "true", this

      is a finding.

      External - General'
    severity: medium
- id: '1.4'
  title: TCAT-AS-000040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'TLS 1.2 must be used on secured HTTP connectors. GROUP ID: V-222929 RULE ID: SV-222929r960762'
  rationale: 'Using older versions of TLS introduces security vulnerabilities that exist in the older versions of the protocol.
    Tomcat by default will use all available versions of the SSL/TLS protocols unless the version is explicitly defined in
    the SSL configuration attribute for the associated connector. This introduces the opportunity for the client to negotiate
    the use of an older protocol version and increases the risk of compromise of the Tomcat server. All connectors must use
    TLS 1.2. While this check specifically verifies the use of TLSv1.2, it does not provide all of the steps required to successfully
    configure a secured TLS connection. That task involves multiple additional steps that are not included here. Refer to
    Tomcat documentation for all of the steps needed to create a TLS protected connector. Satisfies: SRG-APP-000015-AS-000010,
    SRG-APP-000172-AS-000120, SRG-APP000439-AS-000155'
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'From the Tomcat server console, run the following command:

    sudo cat $CATALINA_BASE/conf/server.xml.

    Examine each <Connector/> element.

    For every HTTP protocol connector:

    Verify the SSLEnabledProtocols="TLSv1.2" flag is set on each connector.

    If the SSLEnabledProtocols setting is not set to TLSv1.2 or greater, this is a finding.'
  remediation: 'As a privileged user on the Tomcat server, edit the $CATALINA_BASE/conf/server.xml

    and modify the <Connector/> element.

    Add the "SSLEnabledProtocols=" flag to the connector or modify the existing flag.

    Set SSLEnabledProtocols="TLSv1.2". Save the server.xml file and restart Tomcat:

    sudo systemctl restart tomcat

    sudo systemctl reload-daemon

    External - General'
  checks:
  - type: manual_review
    info: 'From the Tomcat server console, run the following command:

      sudo cat $CATALINA_BASE/conf/server.xml.

      Examine each <Connector/> element.

      For every HTTP protocol connector:

      Verify the SSLEnabledProtocols="TLSv1.2" flag is set on each connector.

      If the SSLEnabledProtocols setting is not set to TLSv1.2 or greater, this is a finding.'
    severity: medium
- id: '1.5'
  title: TCAT-AS-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'AccessLogValve must be configured for each application context. GROUP ID: V-222930 RULE ID: SV-222930r960765'
  rationale: 'Tomcat has the ability to host multiple contexts (applications) on one physical server by using the <Host><Context>
    attribute. This allows the admin to specify audit log settings on a per application basis. Satisfies: SRG-APP-000016-AS-000013,
    SRG-APP-000080-AS-000045, SRG-APP000089-AS-000050, SRG-APP-000091-AS-000052, SRG-APP-000095-AS-000056, SRG-APP-000098-AS-000061,
    SRG-APP-000099-AS-000062'
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'As an elevated user on the Tomcat server:

    Edit the $CATALINA_BASE/conf/server.xml file.

    Review for all <Context> elements.

    If a <Valve className="org.apache.catalina.valves.AccessLogValve" .../> element is

    not defined within each <Context> element, this is a finding.

    EXAMPLE:

    <Context

    ...

    <Valve className="org.apache.catalina.valves.AccessLogValve" directory="logs"

    prefix="application_name_log" suffix=".txt"

    pattern=""%h %l %t %u "%r" %s %b" />

    ...

    />

    External - General'
  remediation: 'As a privileged user on the Tomcat server:

    Edit the $CATALINA_BASE/conf/server.xml file.

    Create a <Valve> element that is nested within the <Context> element containing an

    AccessLogValve.

    EXAMPLE:

    <Context

    ...

    <Valve className="org.apache.catalina.valves.AccessLogValve" directory="logs"

    prefix="application_name_log" suffix=".txt"

    pattern="%h %l %t %u "%r" %s %b" />

    ...

    />

    Restart the Tomcat server:

    sudo systemctl restart tomcat

    sudo systemctl daemon-reload'
  checks:
  - type: manual_review
    info: 'As an elevated user on the Tomcat server:

      Edit the $CATALINA_BASE/conf/server.xml file.

      Review for all <Context> elements.

      If a <Valve className="org.apache.catalina.valves.AccessLogValve" .../> element is

      not defined within each <Context> element, this is a finding.

      EXAMPLE:

      <Context

      ...

      <Valve className="org.apache.catalina.valves.AccessLogValve" directory="logs"

      prefix="application_name_log" suffix=".txt"

      pattern=""%h %l %t %u "%r" %s %b" />

      ...

      />

      External - General'
    severity: medium
- id: '1.6'
  title: TCAT-AS-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Default password for keystore must be changed. GROUP ID: V-222931 RULE ID: SV-222931r960792'
  rationale: 'Tomcat currently operates only on JKS, PKCS11, or PKCS12 format keystores. The JKS format is Java''s standard
    "Java KeyStore" format, and is the format created by the keytool command-line utility which is included in the JDK. The
    PKCS12 format is an internet standard, and is managed using OpenSSL or Microsoft''s Key-Manager. This requirement only
    applies to JKS keystores. When a new JKS keystore is created, if a password is not specified during creation the default
    password used by Tomcat is "changeit" (all lower case). If the default password is not changed, the keystore is at risk
    of compromise. Satisfies: SRG-APP-000033-AS-000023, SRG-APP-000176-AS-000125'
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'From the Tomcat server console, run the following command to check the keystore:

    sudo keytool -list -v

    When prompted for the keystore password type "changeit" sans quotes.

    If the contents of the keystore are displayed, this is a finding.'
  remediation: 'From the Tomcat server as a privileged user, run the following command:

    sudo keytool -storepasswd

    When prompted for the keystore password, select a strong password, minimum 10

    characters, mixed case alpha-numeric.

    Document the password and store in a secured location that is only accessible to

    authorized personnel.'
  checks:
  - type: manual_review
    info: 'From the Tomcat server console, run the following command to check the keystore:

      sudo keytool -list -v

      When prompted for the keystore password type "changeit" sans quotes.

      If the contents of the keystore are displayed, this is a finding.'
    severity: medium
- id: '1.7'
  title: TCAT-AS-000080
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Cookies must have http-only flag set. GROUP ID: V-222933 RULE ID: SV-222933r960792'
  rationale: It is possible to steal or manipulate web application session and cookies without having a secure cookie. Configuring
    the secure flag injects the setting into the response header. The $CATALINA_BASE/conf/web.xml file controls how all applications
    handle cookies via the element.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'From the Tomcat server console, run the following command:

    sudo grep -i -B10 -A1 /cookie-config $CATALINA_BASE/conf/web.xml

    If the command returns no results or if the element is not set to true, this is a finding.

    EXAMPLE:

    15

    true

    true'
  remediation: 'From the Tomcat server console as a privileged user:

    edit the $CATALINA_BASE/conf/web.xml

    If the cookie-config section does not exist it must be added. Add or modify the setting

    and set to true.

    EXAMPLE:

    15

    true

    true

    External - General'
  checks:
  - type: manual_review
    info: 'From the Tomcat server console, run the following command:

      sudo grep -i -B10 -A1 /cookie-config $CATALINA_BASE/conf/web.xml

      If the command returns no results or if the element is not set to true, this is a finding.

      EXAMPLE:

      15

      true

      true'
    severity: medium
- id: '1.8'
  title: TCAT-AS-000070
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Cookies must have secure flag set. GROUP ID: V-222932 RULE ID: SV-222932r960792'
  rationale: It is possible to steal or manipulate web application session and cookies without having a secure cookie. Configuring
    the secure flag injects the setting into the response header. The $CATALINA_BASE/conf/web.xml file controls how all applications
    handle cookies via the element.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'From the Tomcat server console, run the following command:

    sudo grep -i -B10 -A1 /cookie-config $CATALINA_BASE/conf/web.xml

    If the command returns no results or if the element is not set to true, this is a finding.

    EXAMPLE:

    15

    true

    true'
  remediation: 'From the Tomcat server console as a privileged user:

    edit the $CATALINA_BASE/conf/web.xml

    If the cookie-config section does not exist it must be added. Add or modify the setting

    and set to true.

    EXAMPLE:

    15

    true

    true

    External - General'
  checks:
  - type: manual_review
    info: 'From the Tomcat server console, run the following command:

      sudo grep -i -B10 -A1 /cookie-config $CATALINA_BASE/conf/web.xml

      If the command returns no results or if the element is not set to true, this is a finding.

      EXAMPLE:

      15

      true

      true'
    severity: medium
- id: '1.9'
  title: TCAT-AS-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'DefaultServlet must be set to readonly for PUT and DELETE. GROUP ID: V-222934 RULE ID: SV-222934r960792'
  rationale: The DefaultServlet is a servlet provided with Tomcat. It is called when no other suitable page can be displayed
    to the client. The DefaultServlet serves static resources as well as directory listings and is declared globally in $CATALINA_BASE/conf/web.xml.
    By default, Tomcat behaves as if the DefaultServlet is set to "true" (HTTP commands like PUT and DELETE are rejected).
    However, the readonly parameter is not in the web.xml file by default so to ensure proper configuration and system operation,
    the "readonly" parameter in web.xml must be created and set to "true". Creating the setting in web.xml provides assurances
    the system is operating as required. Changing the readonly parameter to false could allow clients to delete or modify
    static resources on the server and upload new resources.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'From the Tomcat server run the following command:

    sudo cat $CATALINA_BASE/conf/web.xml |grep -i -A5 -B2 defaultservlet

    If the "readonly" param-value for the "DefaultServlet" servlet class = "false" or does not

    exist, this is a finding.'
  remediation: 'From the Tomcat server console as a privileged user:

    Edit the $CATALINA_BASE/conf/web.xml file.

    If the "readonly" param-value does not exist, it must be created.

    Ensure the "readonly" param-value for the "DefaultServlet" servlet class = "true".'
  checks:
  - type: manual_review
    info: 'From the Tomcat server run the following command:

      sudo cat $CATALINA_BASE/conf/web.xml |grep -i -A5 -B2 defaultservlet

      If the "readonly" param-value for the "DefaultServlet" servlet class = "false" or does not

      exist, this is a finding.'
    severity: medium
- id: '1.10'
  title: TCAT-AS-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Connectors must be secured. GROUP ID: V-222935 RULE ID: SV-222935r960792'
  rationale: The unencrypted HTTP protocol does not protect data from interception or alteration which can subject users to
    eavesdropping, tracking, and the modification of received data. To secure an HTTP connector, both the secure and scheme
    flags must be set.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'From the Tomcat server console, run the following command:

    sudo cat $CATALINA_BASE/conf/server.xml.

    Examine each <Connector/> element.

    For each connector, verify the secure= flag is set to "true" and the scheme= flag is set

    to "https" on each connector.

    If the secure flag is not set to "true" and/or the scheme flag is not set to "https" for each

    HTTP connector element, this is a finding.'
  remediation: 'From the Tomcat server as a privileged user, edit the server.xml file.

    sudo nano $CATALINA_BASE/conf/server.xml.

    Locate each <Connector/> element which is lacking a secure setting.

    EXAMPLE Connector:

    <Connector port="8080" protocol="HTTP/1.1"

    connectionTimeout="20000"

    redirectPort="443" />

    Set or add scheme="https" and secure="true" for each HTTP connector element.

    EXAMPLE:

    <Connector port="443" protocol="org.apache.coyote.http11.Http11NioProtocol"

    SSLEnabled="true"

    maxThreads="150" scheme="https" secure="true".../>

    Save the server.xml file and restart Tomcat:

    sudo systemctl restart tomcat

    sudo systemctl reload-daemon

    External - General'
  checks:
  - type: manual_review
    info: 'From the Tomcat server console, run the following command:

      sudo cat $CATALINA_BASE/conf/server.xml.

      Examine each <Connector/> element.

      For each connector, verify the secure= flag is set to "true" and the scheme= flag is set

      to "https" on each connector.

      If the secure flag is not set to "true" and/or the scheme flag is not set to "https" for each

      HTTP connector element, this is a finding.'
    severity: medium
- id: '1.11'
  title: TCAT-AS-000110
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Java Security Manager must be enabled. GROUP ID: V-222936 RULE ID: SV-222936r1067546'
  rationale: The Java Security Manager (JSM) is what protects the Tomcat server from trojan servlets, JSPs, JSP beans, tag
    libraries, or even from inadvertent mistakes. The JSM works the same way a client's web browser isolates a running web
    application via a sandbox, the difference being the sandbox is running on the server rather than the client. To ensure
    application operability, JSM security policies must be set to allow the hosted application access to the underlying system
    based on individual application requirements. The JSM settings cannot be determined at the STIG level and will vary based
    on each hosted application. Examples include setting JSM policy to allow an application to write to folders on the server
    or to initiate network connections to other servers via TCP/IP. Because the JSM isolates application code to prevent an
    application from adversely accessing resources on the underlying Tomcat server, care must be taken to ensure the JSM policies
    are configured properly. Allowing untrusted web applications to run on the Tomcat server without a JSM policy that limits
    access to server resources creates a risk of compromise to the server. Ideally, the JSM policy is implemented and tested
    during the application development phase. This is when the application resource requirements are best identified and documented
    so the correct JSM policy can be implemented in the production environment. Creating the correct JSM policy can be a challenge
    when installing commercial software that does not provide the policy as part of the installation process or via documentation.
    This is due to the fact that the critical application access requirements to the system will typically not be known to
    the system administrator. In these cases, running the JSM can result in failure for some application functionality (e.g.,
    an application might not be able to write logs to a particular folder on the system or communicate with other systems
    as intended). External - General When faced with application functionality failures, the typical troubleshooting approach
    for the system administrator to follow is to install the application in a test environment, set the $CATALINA_POLICY setting
    to debug, and identify failure events in the logs. This can aid in identifying what privileges the application requires.
    From there the JSM policies can be set, tested, documented, and transferred to production. If these actions do not address
    all of the issues, the Risk Management Framework processes come into effect and a risk acceptance for this requirement
    must be obtained from the ISSO. For additional technical information on the security manager and available JSM policy
    settings, refer to the Security Manager How-To on the Apache Tomcat version 9 website.
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'Review system documentation. Identify the tomcat systemd startup file, which for STIG

    purposes is called "tomcat.service" and can be viewed as a link in the

    /etc/systemd/system/ folder.

    Run the following command:

    sudo cat /etc/systemd/system/tomcat.service |grep -i security

    If there is a documented and approved risk acceptance for not operating the Security

    Manager, this requirement is Not Applicable.

    If the ExecStart parameter does not include the -security flag, this is a finding.'
  remediation: 'Refer to the vulnerability discussion of this requirement for additional information. Install

    the application in a test environment and determine the application access

    requirements. Test and document the Java Security Manager policy and then transfer

    the JSM policy to the $CATALINA_BASE/conf/catalina.properties file. If operating

    multiple instances of Tomcat, use $CATALINA_BASE in place of $CATALINA_HOME

    as per standard Tomcat practice.

    As an admin user on the Tomcat server, modify the /etc/systemd/system/tomcat.service

    file and set the "ExecStart" parameter to read:

    "ExecStart=/opt/tomcat/bin/startup.sh -security"

    sudo systemctl restart tomcat

    sudo systemctl daemon-reload'
  checks:
  - type: manual_review
    info: 'Review system documentation. Identify the tomcat systemd startup file, which for STIG

      purposes is called "tomcat.service" and can be viewed as a link in the

      /etc/systemd/system/ folder.

      Run the following command:

      sudo cat /etc/systemd/system/tomcat.service |grep -i security

      If there is a documented and approved risk acceptance for not operating the Security

      Manager, this requirement is Not Applicable.

      If the ExecStart parameter does not include the -security flag, this is a finding.'
    severity: medium
- id: '1.12'
  title: TCAT-AS-000170
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Tomcat servers behind a proxy or load balancer must log client IP. GROUP ID: V-222937 RULE ID: SV-222937r960879'
  rationale: When running Tomcat behind a load balancer or proxy, default behavior is for Tomcat to log the proxy or load
    balancer IP address as the client IP. Desired behavior is to log the actual client IP rather than the proxy IP address.
    The RemoteIpValve logging component instructs Tomcat to grab the HTTP header X-Forwarded-For and use that for access logging.
    Tomcat will identify 127.0.0.1, class A and class C RFC1918 addresses as internal proxy addresses; however, if the proxy
    has a routable IP or a class B private network address space (172.16.0.0/12), the user must also verify the "internalProxies
    setting is configured to reflect the proxy IP address.
  impact: ''
  references: []
  page_start: 34
  audit_raw: 'Review the System Security Plan and determine if the Tomcat server resides behind a

    proxy server or load balancer. If the Tomcat server is not behind a proxy server or load

    balancer, this requirement is NA.

    From the Tomcat server run the following command:

    sudo grep -i RemoteIpValve $CATALINA_BASE/conf/server.xml file.

    If the results are empty or if the requestAttributesEnabled setting is not configured as

    "True", this is a finding.

    sudo grep -i AccessLogValve $CATALINA_BASE/conf/server.xml file.

    If the requestAttributesEnabled setting is not configured as "True", this is a finding.

    External - General'
  remediation: 'From the Tomcat server as a privileged user:

    Edit the $CATALINA_BASE/conf/server.xml file.

    Only execute this first step if the proxy server is using a routable IP address or an RFC

    1918 Class B address space: Add or edit the RemoteIpValve and configure the

    internalProxies setting to reflect the proxy addresses.

    Modify the AccessLogValve and configure the requestAttributesEnabled setting =

    "True".

    EXAMPLE:

