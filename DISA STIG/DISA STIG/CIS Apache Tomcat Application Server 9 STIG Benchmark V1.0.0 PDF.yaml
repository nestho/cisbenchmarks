  title: TCAT-AS-000530
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The deployXML attribute must be set to false in hosted environments. GROUP ID: V-222955 RULE ID: SV-222955r960963'
  rationale: The Host element controls deployment. Automatic deployment allows for simpler management, but also makes it easier
    for an attacker to deploy a malicious application. Automatic deployment is controlled by the autoDeploy and deployOnStartup
    attributes. If both are false, only Contexts defined in server.xml will be deployed, and any changes will require a Tomcat
    restart. In a hosted environment where web applications may not be trusted, set the deployXML attribute to false to ignore
    any context.xml packaged with the web application that may try to assign increased privileges to the web application.
    Note that if the security manager is enabled that the deployXML attribute will default to false. This requirement is NA
    for test and development systems on non-production networks. For DevSecOps application environments, the ISSM may authorize
    autodeploy functions on a production Tomcat system if the mission need specifies it and an application security vulnerability
    testing and assurance regimen is included in the DevSecOps process.
