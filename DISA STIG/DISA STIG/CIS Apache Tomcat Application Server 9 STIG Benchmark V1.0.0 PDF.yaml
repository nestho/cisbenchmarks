- id: '1.53'
  title: TCAT-AS-001020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'LockOutRealms must be used for management of Tomcat. GROUP ID: V-222980 RULE ID: SV-222980r961278'
  rationale: A LockOutRealm adds the ability to lock a user out after multiple failed logins. LockOutRealm is an implementation
    of the Tomcat Realm interface that extends the CombinedRealm to provide user lock out functionality if there are too many
    failed authentication attempts in a given period of time. A LockOutRealm is created by wrapping around a standard realm
    such as a JNDI Directory Realm which connects Tomcat to an LDAP Directory. A Catalina container (Engine, Host, or Context)
    may contain no more than one Realm element (although this one Realm may itself contain multiple nested Realms). In addition,
    the Realm associated with an Engine or a Host is automatically inherited by lower-level containers unless the lower level
    container explicitly defines its own Realm. If no Realm is configured for the Engine, an instance of the Null Realm will
    be configured for the Engine automatically.
  impact: ''
  references: []
  page_start: 108
  audit_raw: 'From the Tomcat server console, run the following command:

    sudo grep -i LockOutRealm $CATALINA_BASE/conf/server.xml.

    If there are no results or if the LockOutRealm is not used for the Tomcat management

    application context, this is a finding.'
  remediation: "From the Tomcat server console as a privileged user edit the\n$CATALINA_BASE/conf/server.xml file.\nsudo nano\
    \ $CATALINA_BASE/conf/server.xml file\nLocate or add the LockOutRealm element. Make sure the LockOutRealm element is\n\
    applied to the management application at a minimum (if the management application is\nin use on the system). This is done\
    \ by ensuring the LockOutRealm is nested under the\nEngine, Host or directly within the management application Context\
    \ container.\nEXAMPLE:\nExternal - General\n <Realm className=\"org.apache.catalina.realm.LockOutRealm\" failureCount=\"\
    5\"\nlockOutTime=\"600\">\n...\n</Realm>"
