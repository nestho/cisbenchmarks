- id: '1.45'
  title: TCAT-AS-000790
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Access to Tomcat manager application must be restricted. GROUP ID: V-222970 RULE ID: SV-222970r961095'
  rationale: The Tomcat manager application is used to manage the Tomcat server and the applications that run on Tomcat. By
    default, the manager application is only accessible via the localhost. Exposing the management application to any network
    interface that is available to non-administrative personnel leaves the Tomcat server vulnerable to attempts to access
    the management application. To mitigate this risk, the management application should only be run on the localhost or on
    network interfaces tied to a dedicated management network. This setting is managed in the $CATALINA_BASE/conf/server.xml
    file.
  impact: ''
  references: []
  page_start: 93
  audit_raw: 'Review system documentation (SSP) and identify the documented management

    networks as well as the documented client networks. If the manager application has

    been deleted from the system, this is not a finding.

    Run the following command as a privileged user:

    sudo grep -i -A1 "RemoteAddrValve|RemoteCIDRValve"

    $CATALINA_BASE/webapps/manager/META-INF/context.xml

    If there are no results, then no address valves exist and this is a finding.

    If the Remote Address Valve settings are commented out or not configured to restrict

