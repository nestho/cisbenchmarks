  description: 'LockOutRealms lockOutTime attribute must be set to 600 seconds (10 minutes) for admin users. GROUP ID: V-222982
    RULE ID: SV-222982r961281'
  rationale: A LockOutRealm adds the ability to specify a lockout time that prevents further attempts after multiple failed
    logins. Setting the lockOutTime attribute to 600 will lock out a user account for 10 minutes. Further authentication failures
    during the lock out time will cause the lock out timer to reset to zero, effectively extending the lockout time. Valid
    authentication attempts during the lockout period will not succeed but will also not reset the lockout time. LockOutRealm
    is an implementation of the Tomcat Realm interface that extends the CombinedRealm to provide user lock out functionality
    if there are too many failed authentication attempts in a given period of time. A LockOutRealm is created by wrapping
    around a standard realm such as a JNDI Directory Realm which connects Tomcat to an LDAP Directory. A Catalina container
