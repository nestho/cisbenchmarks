    Add or modify the existing CATALINA_OPTS -Dcom.sun.management.jmxremote.host

    setting. Set the host parameter to an IP address that is only available on a management

    network.

    EXAMPLE:

    CATALINA_OPTS=''-Dcom.sun.management.jmxremote.host=192.168.0.150''

    Restart Tomcat:

    sudo systemctl restart tomcat

    sudo systemctl daemon-reload

    Verify jmxmanagement access is restricted to the management network IP address

    range.'
  checks:
