    at a minimum, in the event of a log processing failure. GROUP ID: V-223010 RULE ID: SV-223010r985887'
  rationale: Logs are essential to monitor the health of the system, investigate changes that occurred to the system, or investigate
    a security incident. When log processing fails, the events during the failure can be lost. To minimize the timeframe of
    the log failure, an alert needs to be sent to the SA and ISSO at a minimum. Log processing failures include, but are not
    limited to, failures in the application server log capturing mechanisms or log storage capacity being reached or exceeded.
    In some instances, it is preferred to send alarms to individuals rather than to an entire group. Application servers must
    be able to trigger an alarm and send an alert to, at a minimum, the SA and ISSO in the event there is an application server
    log processing failure.
  impact: ''
  references: []
  page_start: 157
  audit_raw: 'This requirement cannot be met by the Tomcat server natively and must be done at the

    OS. Review the operating system. Ensure the OS is configured to alert the ISSO and

    SA in the event of an audit processing failure.

    The alert notification method itself can be accomplished in a variety of ways and is not

    restricted to email alone. The intention is to send an alert; the method used to send the

    alert is not a factor of the requirement. The fix uses email but other alert methods are

    acceptable.

    If the OS is not configured to alert the ISSO and SA in the event of an audit processing

    failure, this is a finding.'
  remediation: 'Procedures for meeting this requirement will vary according to the OS. For Ubuntu

    Linux systems, instructions for notifying via email are provided. Other alert methods are

    also acceptable but are not provided here.

    Configure "auditd" service to notify the SA and ISSO in the event of an audit processing

    failure.

    Edit the following line in "/etc/audit/auditd.conf" to ensure that administrators are notified

    via email for those situations:

    action_mail_acct = root

    Restart the auditd service so the changes take effect:

    External - General

    sudo systemctl restart auditd.service'
