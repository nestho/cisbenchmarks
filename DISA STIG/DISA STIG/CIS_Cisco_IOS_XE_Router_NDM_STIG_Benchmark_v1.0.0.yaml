- id: '1.17'
  title: CISC-ND-000490
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured with only one local account to be used as the account of last resort in
    the event the authentication server is unavailable. GROUP ID: V-215824 RULE ID: SV-215824r1051115'
  rationale: Authentication for administrative (privileged level) access to the device is required at all times. An account
    can be created on the device's local database for use when the authentication server is down or connectivity between the
    device and the authentication server is not operable. This account is referred to as the account of last resort since
    it is intended to be used as a last resort and when immediate administrative access is absolutely necessary. The account
    of last resort logon credentials must be stored in a sealed envelope and kept in a safe. The safe must be periodically
    audited to verify the envelope remains sealed. The signature of the auditor and the date of the audit should be added
    to the envelope as a record. An alternative to using a sealed envelope in a safe would be credential files, separated
    by technology, located in a secured location on a file server, with the files only accessible to those administrators
    authorized to use the accounts of last resort, and access to that location monitored by a central log server. Administrators
    should secure the credentials and disable the root account (if possible) when not needed for system administration functions.
  impact: ''
  references: []
  page_start: 39
  audit_raw: 'Step 1: Review the Cisco router configuration to verify that a local account for last resort

    has been configured.

    username xxxxxxxxxxx privilege nn common-criteria-policy PASSWORD_POLICY

    password xxxxxxxxxx

    Note: The configured Common Criteria policy must be used when creating or changing

    the local account password as shown in the example above.

    Step 2: Verify that local is defined after radius or tacas+ in the authentication order as

    shown in the example below.

    aaa authentication login default group tacacs+ local

    If the Cisco router is not configured with only one local account to be used as the

    account of last resort in the event the authentication server is unavailable, this is a

    finding.'
  remediation: 'Step 1: Configure a local account as shown in the example below.

    R2(config)#username xxxxxxxxx privilege nn secret xxxxxxx

    Step 2: Configure the authentication order to use the local account if the authentication

    server is not reachable as shown in the following example:

    R2(config)#aaa authentication login default group tacacs+ local'
  checks:
  - type: manual_review
    info: 'Step 1: Review the Cisco router configuration to verify that a local account for last resort

      has been configured.

      username xxxxxxxxxxx privilege nn common-criteria-policy PASSWORD_POLICY

      password xxxxxxxxxx

      Note: The configured Common Criteria policy must be used when creating or changing

      the local account password as shown in the example above.

      Step 2: Verify that local is defined after radius or tacas+ in the authentication order as

      shown in the example below.

      aaa authentication login default '
    severity: medium
- id: '1.18'
  title: CISC-ND-000550
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to enforce a minimum 15-character password length. GROUP ID: V-215826
    RULE ID: SV-215826r1015288'
  rationale: Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. Password length is one factor of several that helps to determine strength and how long it takes
    to crack a password. The shorter the password, the lower the number of possible combinations that need to be tested before
    the password is compromised. Use of more characters in a password helps to exponentially increase the time and/or resources
    required to compromise the password.
  impact: ''
  references: []
  page_start: 41
  audit_raw: "Review the Cisco router configuration to verify that it is compliant with this requirement\nas shown in the\
    \ example below.\naaa new-model\n!\n!\naaa common-criteria policy PASSWORD_POLICY\n min-length 15\nIf the Cisco router\
    \ is not configured to enforce a minimum 15-character password\nlength, this is a finding."
  remediation: 'Configure the Cisco router to enforce a minimum 15-character password length as

    shown in the example below.

    R1(config)#aaa common-criteria policy PASSWORD_POLICY

    R1(config-cc-policy)#min-length 15

    R1(config-cc-policy)#exit'
  checks:
  - type: manual_review
    info: "Review the Cisco router configuration to verify that it is compliant with this requirement\nas shown in the example\
      \ below.\naaa new-model\n!\n!\naaa common-criteria policy PASSWORD_POLICY\n min-length 15\nIf the Cisco router is not\
      \ configured to enforce a minimum 15-character password\nlength, this is a finding."
    severity: medium
