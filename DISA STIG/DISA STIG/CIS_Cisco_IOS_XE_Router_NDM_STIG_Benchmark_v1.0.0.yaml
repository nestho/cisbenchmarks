  audit_raw: "Review the router configuration to determine if a CA trust point has been configured.\nThe CA trust point will\
    \ contain the URL of the CA in which the router has enrolled with.\nVerify this is a DOD or DOD-approved CA. This will\
    \ ensure the router has enrolled and\nreceived a certificate from a trusted CA. The CA trust point configuration would\
    \ look\nsimilar to the example below.\ncrypto pki trustpoint CA_X\n enrollment url http://trustpoint1.example.com\nNote:\
    \ A remote end-point's certificate will always be validated by the router by verifying\nthe signature of the CA on the\
    \ certificate using the CA's public key, which is contained\nin the router's certificate it received at enrollment.\n\
    Note: This requirement is not applicable if the router does not have any public key\ncertificates.\nIf the Cisco router\
    \ is not configured to obtain its public key certificates from an\nappropriate certificate policy through an approved\
    \ service provider, this is a finding."
