controls:
- id: '1.1'
  title: CISC-ND-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to limit the number of concurrent management sessions to an organization-defined
    number. GROUP ID: V-215807 RULE ID: SV-215807r960735'
  rationale: Device management includes the ability to control the number of administrators and management sessions that manage
    a device. Limiting the number of allowed administrators and sessions per administrator based on account type, role, or
    access type is helpful in limiting risks related to denial-of-service (DoS) attacks. This requirement addresses concurrent
    sessions for administrative accounts and does not address concurrent sessions by a single administrator via multiple administrative
    accounts. The maximum number of concurrent sessions should be defined based upon mission needs and the operational environment
    for each system. At a minimum, limits must be set for SSH, HTTPS, account of last resort, and root account sessions.
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'Note: This requirement is not applicable to file transfer actions such as FTP, SCP, and

    SFTP.

    Review the router configuration to determine if concurrent management sessions are

    limited as shown in the example below:

    ip http secure-server

    ip http max-connections 2

    …

    …

    …

    line vty 0 1

    transport input ssh

    line vty 2 4

    transport input none

    If the router is not configured to limit the number of concurrent management sessions,

    this is a finding.'
  remediation: 'Configure the router to limit the number of concurrent management sessions to an

    organization-defined number as shown in the example below.

    R4(config)#ip http max-connections 2

    R4(config)#line vty 0 1

    R4(config-line)#transport input ssh

    R4(config-line)#exit

    R4(config)#line vty 2 4

    R4(config-line)# transport input none

    R4(config-line)#end'
  checks:
  - type: manual_review
    info: 'Note: This requirement is not applicable to file transfer actions such as FTP, SCP, and

      SFTP.

      Review the router configuration to determine if concurrent management sessions are

      limited as shown in the example below:

      ip http secure-server

      ip http max-connections 2

      …

      …

      …

      line vty 0 1

      transport input ssh

      line vty 2 4

      transport input none

      If the router is not configured to limit the number of concurrent management sessions,

      this is a finding.'
    severity: medium
- id: '1.2'
  title: CISC-ND-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to automatically audit account creation. GROUP ID: V-215808 RULE ID: SV-215808r960777'
  rationale: Upon gaining access to a network device, an attacker will often first attempt to create a persistent method of
    reestablishing access. One way to accomplish this is to create a new account. Notification of account creation helps to
    mitigate this risk. Auditing account creation provides the necessary reconciliation that account management procedures
    are being followed. Without this audit trail, personnel without the proper authorization may gain access to critical network
    nodes.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'Review the router configuration to determine if it automatically audits account creation.

    The configuration should look similar to the example below:

    archive

    log config

    logging enable

    Note: Configuration changes can be viewed using the show archive log config all

    command.

    If account creation is not automatically audited, this is a finding.'
  remediation: 'Configure the router to log account creation using the following commands:

    R4(config)#archive

    R4(config-archive)#log config

    R4(config-archive-log-cfg)#logging enable

    R4(config-archive-log-cfg)#end'
  checks:
  - type: sql
    command: show archive log config all
    severity: medium
    info: 'Review the router configuration to determine if it automatically audits account creation.

      The configuration should look similar to the example below:

      archive

      log config

      logging enable

      Note: Configuration changes can be viewed using the show archive log config all

      command.

      If account creation is not automatically audited, this is a finding.'
- id: '1.3'
  title: CISC-ND-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to automatically audit account modification. GROUP ID: V-215809 RULE ID:
    SV-215809r960780'
  rationale: Since the accounts in the network device are privileged or system-level accounts, account management is vital
    to the security of the network device. Account management by a designated authority ensures access to the network device
    is being controlled in a secure manner by granting access to only authorized personnel with the appropriate and necessary
    privileges. Auditing account modification along with an automatic notification to appropriate individuals will provide
    the necessary reconciliation that account management procedures are being followed. If modifications to management accounts
    are not audited, reconciliation of account management procedures cannot be tracked.
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'Review the router configuration to determine if it automatically audits account

    modification. The configuration should look similar to the example below:

    archive

    log config

    logging enable

    Note: Configuration changes can be viewed using the show archive log config all

    command.

    If account modification is not automatically audited, this is a finding.'
  remediation: 'Configure the router to log account modification using the following commands:

    R4(config)#archive

    R4(config-archive)#log config

    R4(config-archive-log-cfg)#logging enable

    R4(config-archive-log-cfg)#end'
  checks:
  - type: sql
    command: show archive log config all
    severity: medium
    info: 'Review the router configuration to determine if it automatically audits account

      modification. The configuration should look similar to the example below:

      archive

      log config

      logging enable

      Note: Configuration changes can be viewed using the show archive log config all

      command.

      If account modification is not automatically audited, this is a finding.'
- id: '1.4'
  title: CISC-ND-000110
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to automatically audit account disabling actions. GROUP ID: V-215810 RULE
    ID: SV-215810r960783'
  rationale: Account management, as a whole, ensures access to the network device is being controlled in a secure manner by
    granting access to only authorized personnel. Auditing account disabling actions will support account management procedures.
    When device management accounts are disabled, user or service accessibility may be affected. Auditing also ensures authorized
    active accounts remain enabled and available for use when required.
