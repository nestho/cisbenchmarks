    command.

    If account disabling is not automatically audited, this is a finding.'
  remediation: 'Configure the router to log account disabling using the following commands:

    R4(config)#archive

    R4(config-archive)#log config

    R4(config-archive-log-cfg)#logging enable

    R4(config-archive-log-cfg)#end'
  checks:
  - type: sql
    command: show archive log config all
    severity: medium
    info: 'Review the router configuration to determine if it automatically audits account disabling.

      The configuration should look similar to the example below:

      archive

