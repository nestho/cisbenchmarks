  description: 'The Cisco router must be running an IOS release that is currently supported by Cisco Systems. GROUP ID: V-220140
    RULE ID: SV-220140r961863'
  rationale: Network devices running an unsupported operating system lack current security fixes required to mitigate the
    risks associated with recent vulnerabilities. Running a supported release also enables operations to maintain a stable
    and reliable network provided by improved quality of service and security features.
