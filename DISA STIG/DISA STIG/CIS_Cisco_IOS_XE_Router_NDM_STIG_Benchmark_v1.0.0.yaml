- id: '1.9'
  title: CISC-ND-000210
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco device must be configured to audit all administrator activity. GROUP ID: V-215815 RULE ID: SV-215815r960864'
  rationale: This requirement supports non-repudiation of actions taken by an administrator and is required in order to maintain
    the integrity of the configuration management process. All configuration changes to the network device are logged, and
    administrators authenticate with two-factor authentication before gaining administrative access. Together, these processes
    will ensure the administrators can be held accountable for the configuration changes they implement. To meet this requirement,
    the network device must log administrator access and activity.
  impact: ''
  references: []
  page_start: 24
  audit_raw: "Review the Cisco router configuration to verify that it is compliant with this requirement\nas shown in the\
    \ example below.\nhostname R1\n!\nlogging userinfo\n!\n…\n…\n…\narchive\n log config\n logging enable\n!\nNote: The logging\
    \ userinfo global configuration command will generate a log when a\nuser increases his or her privilege level.\nIf logging\
    \ of administrator activity is not configured, this is a finding."
  remediation: 'Configure the router to log administrator activity as shown in the example below.

    R1(config)#logging userinfo

    R1(config)#archive

    R1(config-archive)#log config

    R1(config-archive-log-cfg)#logging enable

    R1(config-archive-log-cfg)#end'
  checks:
  - type: manual_review
    info: "Review the Cisco router configuration to verify that it is compliant with this requirement\nas shown in the example\
      \ below.\nhostname R1\n!\nlogging userinfo\n!\n…\n…\n…\narchive\n log config\n logging enable\n!\nNote: The logging\
      \ userinfo global configuration command will generate a log when a\nuser increases his or her privilege level.\nIf logging\
      \ of administrator activity is not configured, this is a finding."
    severity: medium
- id: '1.10'
  title: CISC-ND-000280
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must produce audit records containing information to establish when (date and time) the events
    occurred. GROUP ID: V-215817 RULE ID: SV-215817r960894'
  rationale: It is essential for security personnel to know what is being done, what was attempted, where it was done, when
    it was done, and by whom it was done in order to compile an accurate risk assessment. Logging the date and time of each
    detected event provides a means of investigating an attack; recognizing resource utilization or capacity thresholds; or
    identifying an improperly configured network device. In order to establish and correlate the series of events leading
    up to an outage or attack, it is imperative the date and time are recorded in all log records.
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'Verify that the router is configured to include the date and time on all log records as

    shown in the configuration example below.

    service timestamps log datetime localtime

    If time stamps are not configured, this is a finding.'
  remediation: 'Configure the router to include the date and time on all log records as shown in the

    example below.

    R1(config)#service timestamps log datetime localtime'
  checks:
  - type: manual_review
    info: 'Verify that the router is configured to include the date and time on all log records as

      shown in the configuration example below.

      service timestamps log datetime localtime

      If time stamps are not configured, this is a finding.'
    severity: medium
- id: '1.11'
  title: CISC-ND-000290
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must produce audit records containing information to establish where the events occurred.
    GROUP ID: V-215818 RULE ID: SV-215818r960897'
  rationale: In order to compile an accurate risk assessment and provide forensic analysis, it is essential for security personnel
    to know where events occurred, such as device hardware components, device software modules, session identifiers, filenames,
    host names, and functionality. Associating information about where the event occurred within the network device provides
    a means of investigating an attack; recognizing resource utilization or capacity thresholds; or identifying an improperly
    configured device.
  impact: ''
  references: []
  page_start: 27
  audit_raw: "Review the deny statements in all interface ACLs to determine if the log-input parameter\nhas been configured\
    \ as shown in the example below.\nNote: log-input can only apply to interface bound ACLs.\nip access-list extended BLOCK_INBOUND\n\
    \ deny icmp any any log-input\nIf the router is not configured with the log-input parameter after any deny statements\
    \ to\nnote where packets have been dropped via an ACL, this is a finding."
  remediation: 'Configure the log-input parameter after any deny statements to provide the location as

    to where packets have been dropped via an ACL.

    R1(config)#ip access-list extended BLOCK_INBOUND

    R1(config-ext-nacl)#deny icmp any any log-input'
  checks:
  - type: manual_review
    info: "Review the deny statements in all interface ACLs to determine if the log-input parameter\nhas been configured as\
      \ shown in the example below.\nNote: log-input can only apply to interface bound ACLs.\nip access-list extended BLOCK_INBOUND\n\
      \ deny icmp any any log-input\nIf the router is not configured with the log-input parameter after any deny statements\
      \ to\nnote where packets have been dropped via an ACL, this is a finding."
    severity: medium
- id: '1.12'
  title: CISC-ND-000330
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to generate audit records containing the full-text recording of privileged
    commands. GROUP ID: V-215819 RULE ID: SV-215819r960909'
  rationale: Reconstruction of harmful events or forensic analysis is not possible if audit records do not contain enough
    information. Organizations consider limiting the additional audit information to only that information explicitly needed
    for specific audit requirements. The additional information required is dependent on the type of information (i.e., sensitivity
    of the data and the environment within which it resides). At a minimum, the organization must audit full-text recording
    of privileged commands. The organization must maintain audit trails in sufficient detail to reconstruct events to determine
    the cause and impact of compromise.
  impact: ''
  references: []
  page_start: 29
  audit_raw: "Review the Cisco router configuration to verify that it is compliant with this requirement.\nThe configuration\
    \ example below will log all configuration changes.\narchive\n log config\n logging enable\nNote: Configuration changes\
    \ can be viewed using the show archive log config all\ncommand.\nIf the Cisco router is not configured to generate audit\
    \ records of configuration changes,\nthis is a finding."
  remediation: 'Configure the Cisco router to log all configuration changes as shown in the example

    below.

    R4(config)#archive

    R4(config-archive)#log config

    R4(config-archive-log-cfg)#logging enable

    R4(config-archive-log-cfg)#end'
  checks:
  - type: sql
    command: show archive log config all
    severity: medium
    info: "Review the Cisco router configuration to verify that it is compliant with this requirement.\nThe configuration\
      \ example below will log all configuration changes.\narchive\n log config\n logging enable\nNote: Configuration changes\
      \ can be viewed using the show archive log config all\ncommand.\nIf the Cisco router is not configured to generate audit\
      \ records of configuration changes,\nthis is a finding."
- id: '1.13'
  title: CISC-ND-000380
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to protect audit information from unauthorized modification. GROUP ID:
    V-215820 RULE ID: SV-215820r960933'
  rationale: Audit information includes all information (e.g., audit records, audit settings, and audit reports) needed to
    successfully audit network device activity. If audit data were to become compromised, then forensic analysis and discovery
    of the true source of potentially malicious system activity is impossible to achieve. To ensure the veracity of audit
    data, the network device must protect audit information from unauthorized modification. This requirement can be achieved
    through multiple methods, which will depend upon system architecture and design. Some commonly employed methods include
    ensuring log files receive the proper file system permissions and limiting log data locations. Network devices providing
    a user interface to audit data will leverage user permissions and roles identifying the user accessing the data and the
    corresponding rights that the user enjoys in order to make access decisions regarding the modification of audit data.
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'Review the Cisco router configuration to verify that it is compliant with this requirement.

    Step 1: If persistent logging is enabled as shown in the example below, go to step 2.

    Otherwise, this requirement is not applicable.

    logging persistent url disk0:/logfile size 134217728 filesize 16384

    Step 2: Verify that the router is not configured with a privilege level other than "15" to

    allow access to the file system as shown in the example below.

    file privilege 10

    Note: The default privilege level required for access to the file system is "15"; hence, the

    command file privilege "15" will not be shown in the configuration.

    If the router is configured with a privilege level other than "15" to allow access to the file

    system, this is a finding.'
  remediation: 'If persistent logging is enabled, configure the router to only allow administrators with

    privilege level "15" access to the file system as shown in the example below.

    R4(config)#file privilege 15'
  checks:
  - type: manual_review
    info: 'Review the Cisco router configuration to verify that it is compliant with this requirement.

      Step 1: If persistent logging is enabled as shown in the example below, go to step 2.

      Otherwise, this requirement is not applicable.

      logging persistent url disk0:/logfile size 134217728 filesize 16384

      Step 2: Verify that the router is not configured with a privilege level other than "15" to

      allow access to the file system as shown in the example below.

      file privilege 10

      Note: The default privilege level r'
    severity: medium
- id: '1.14'
  title: CISC-ND-000390
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to protect audit information from unauthorized deletion. GROUP ID: V-215821
    RULE ID: SV-215821r960936'
  rationale: 'Audit information includes all information (e.g., audit records, audit settings, and audit reports) needed to
    successfully audit information system activity. If audit data were to become compromised, then forensic analysis and discovery
    of the true source of potentially malicious system activity is impossible to achieve. To ensure the veracity of audit
    data, the network device must protect audit information from unauthorized deletion. This requirement can be achieved through
    multiple methods, which will depend upon system architecture and design. Some commonly employed methods include: ensuring
    log files receive the proper file system permissions utilizing file system protections, restricting access, and backing
    up log data to ensure log data is retained. Network devices providing a user interface to audit data will leverage user
    permissions and roles identifying the user accessing the data and the corresponding rights the user enjoys in order to
    make access decisions regarding the deletion of audit data.'
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'Review the Cisco router configuration to verify that it is compliant with this requirement.

    Step 1: If persistent logging is enabled as shown in the example below, go to step 2.

    Otherwise, this requirement is not applicable.

    logging persistent url disk0:/logfile size 134217728 filesize 16384

    Step 2: Verify that the router is not configured with a privilege level other than "15" to

    allow access to the file system as shown in the example below.

    file privilege 10

    Note: The default privilege level required for access to the file system is "15"; hence, the

    command file privilege "15" will not be shown in the configuration.

    If the router is configured with a privilege level other than "15" to allow access to the file

    system, this is a finding.'
  remediation: 'If persistent logging is enabled, configure the router to only allow administrators with

    privilege level "15" access to the file system as shown in the example below.

    R4(config)#file privilege 15'
  checks:
  - type: manual_review
    info: 'Review the Cisco router configuration to verify that it is compliant with this requirement.

      Step 1: If persistent logging is enabled as shown in the example below, go to step 2.

      Otherwise, this requirement is not applicable.

