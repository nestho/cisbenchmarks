- id: '1.24'
  title: CISC-ND-000620
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco router must only store cryptographic representations of passwords. GROUP ID: V-215832 RULE ID: SV-215832r1015294'
  rationale: Passwords need to be protected at all times, and encryption is the standard method for protecting passwords.
    If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised. Network devices must
    enforce cryptographic representations of passwords when storing passwords in databases, configuration files, and log files.
    Passwords must be protected at all times; using a strong one-way hashing encryption algorithm with a salt is the standard
    method for providing a means to validate a password without having to store the actual password. Performance and time
    required to access are factors that must be considered, and the one way hash is the most feasible means of securing the
    password and providing an acceptable measure of password security. If passwords are stored in clear text, they can be
    plainly read and easily compromised. In many instances, verifying the user knows a password is performed using a password
    verifier. In its simplest form, a password verifier is a computational function that is capable of creating a hash of
    a password and determining if the value provided by the user matches the stored hash.
  impact: ''
  references: []
  page_start: 53
  audit_raw: 'Review the router configuration to determine if passwords are encrypted as shown in

    the example below.

    service password-encryption

    If the router is not configured to encrypt passwords, this is a finding.'
  remediation: 'Configure the router to encrypt all passwords.

    R4(config)#service password-encryption

    R4(config)#end'
  checks:
  - type: manual_review
    info: 'Review the router configuration to determine if passwords are encrypted as shown in

      the example below.

      service password-encryption

      If the router is not configured to encrypt passwords, this is a finding.'
    severity: medium
- id: '1.25'
  title: CISC-ND-000720
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco router must be configured to terminate all network connections associated with device management
    after five minutes of inactivity. GROUP ID: V-215833 RULE ID: SV-215833r961068'
  rationale: Terminating an idle session within a short time period reduces the window of opportunity for unauthorized personnel
    to take control of a management session enabled on the console or console port that has been left unattended. In addition,
    quickly terminating an idle session will also free up resources committed by the managed network element. Terminating
    network connections associated with communications sessions includes, for example, de-allocating associated TCP/IP address/port
    pairs at the operating system level, or de-allocating networking assignments at the application level if multiple application
    sessions are using a single, operating system-level network connection. This does not mean that the device terminates
    all sessions or network access; it only ends the inactive session and releases the resources associated with that session.
  impact: ''
  references: []
  page_start: 55
  audit_raw: "Review the Cisco router configuration to verify that all network connections associated\nwith a device management\
    \ have an idle timeout value set to five minutes or less as\nshown in the following example:\nip http secure-server\n\
    ip http timeout-policy idle 300 life nnnn requests nn\n…\n…\n…\nline con 0\n exec-timeout 5 0\nline vty 0 1\n exec-timeout\
    \ 5 0\nIf the Cisco router is not configured to terminate all network connections associated with\na device management\
    \ after five minutes of inactivity, this is a finding."
  remediation: 'Set the idle timeout value to five minutes or less on all configured login classes as

    shown in the example below.

    R1(config)#line vty 0 1

    R1(config-line)#exec-timeout 5 0

    R1(config-line)#exit

    R1(config)#line con 0

    R1(config-line)#exec-timeout 5 0

    R1(config-line)#exit

    R2(config)#ip http timeout-policy idle 300 life nnnn requests nn'
  checks:
  - type: manual_review
    info: "Review the Cisco router configuration to verify that all network connections associated\nwith a device management\
