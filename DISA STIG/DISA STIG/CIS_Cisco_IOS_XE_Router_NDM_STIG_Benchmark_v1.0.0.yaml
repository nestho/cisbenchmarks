    granting access to the device. GROUP ID: V-215814 RULE ID: SV-215814r960843'
  rationale: Display of the DoD-approved use notification before granting access to the network device ensures privacy and
    security notification verbiage used is consistent with applicable federal laws, Executive Orders, directives, policies,
    regulations, standards, and guidance. System use notifications are required only for access via logon interfaces with
    human users.
