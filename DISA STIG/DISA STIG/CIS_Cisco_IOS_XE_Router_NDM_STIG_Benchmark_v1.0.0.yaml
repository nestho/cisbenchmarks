    Government standards. Unless required for legacy use, DoD systems should not be

    configured to use SHA-1 for integrity of remote access sessions.

    SSH Example

    ip ssh version 2

    ip ssh server algorithm mac hmac-sha2-256

    If the Cisco router is not configured to use FIPS-validated HMAC to protect the integrity

    of remote maintenance sessions, this is a finding.'
  remediation: 'Configure SSH to use FIPS-validated HMAC for remote maintenance sessions as

    shown in the following example:

