    that is cryptographically based. GROUP ID: V-215843 RULE ID: SV-215843r1050862'
  rationale: If Network Time Protocol is not authenticated, an attacker can introduce a rogue NTP server. This rogue server
    can then be used to send incorrect time information to network devices, which will make log timestamps inaccurate and
    affect scheduled actions. NTP authentication is used to prevent this tampering by authenticating the time source.
