  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to obtain its public key certificates from an appropriate certificate
    policy through an approved service provider. GROUP ID: V-215856 RULE ID: SV-215856r991889'
  rationale: For user certificates, each organization obtains certificates from an approved, shared service provider, as required
    by OMB policy. For federal agencies operating a legacy public key infrastructure cross-certified with the Federal Bridge
    Certification Authority (CA) at medium assurance or higher, this CA will suffice.
