- id: '1.29'
  title: CISC-ND-001030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to synchronize its clock with the primary and secondary time sources using
    redundant authoritative time sources. GROUP ID: V-215838 RULE ID: SV-215838r1015295'
  rationale: 'The loss of connectivity to a particular authoritative time source will result in the loss of time synchronization
    (free-run mode) and increasingly inaccurate time stamps on audit events and other functions. Multiple time sources provide
    redundancy by including a secondary source. Time synchronization is usually a hierarchy; clients synchronize time to a
    local source while that source synchronizes its time to a more accurate source. The network device must utilize an authoritative
    time server and/or be configured to use redundant authoritative time sources. This requirement is related to the comparison
    done in CCI-001891. DOD-approved solutions consist of a combination of a primary and secondary time source using a combination
    or multiple instances of the following: a time server designated for the appropriate DOD network (NIPRNet/SIPRNet); United
    States Naval Observatory (USNO) time servers; and/or the Global Positioning System (GPS). The secondary time source must
    be located in a different geographic region than the primary time source.'
  impact: ''
  references: []
  page_start: 61
  audit_raw: 'Review the Cisco router configuration to verify that it is compliant with this requirement

    as shown in the configuration example below.

    ntp server x.x.x.x

    ntp server y.y.y.y

    If the Cisco router is not configured to synchronize its clock with redundant authoritative

    time sources, this is a finding.'
  remediation: 'Configure the Cisco router to synchronize its clock with redundant authoritative time

    sources as shown in the example below.

    R2(config)#ntp server x.x.x.x

    R2(config)#ntp server y.y.y.y'
  checks:
  - type: manual_review
    info: 'Review the Cisco router configuration to verify that it is compliant with this requirement

      as shown in the configuration example below.

      ntp server x.x.x.x

      ntp server y.y.y.y

      If the Cisco router is not configured to synchronize its clock with redundant authoritative

      time sources, this is a finding.'
    severity: medium
- id: '1.30'
  title: CISC-ND-001130
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to authenticate SNMP messages using a FIPSvalidated Keyed-Hash Message
    Authentication Code (HMAC). GROUP ID: V-215841 RULE ID: SV-215841r1107207'
  rationale: Without authenticating devices, unidentified or unknown devices may be introduced, thereby facilitating malicious
    activity. Bidirectional authentication provides stronger safeguards to validate the identity of other devices for connections
    that are of greater risk. A local connection is any connection with a device communicating without the use of a network.
    A network connection is any connection with a device that communicates through a network (e.g., local area or wide area
    network, internet). A remote connection is any connection with a device communicating through an external network (e.g.,
    the internet). Because of the challenges of applying this requirement on a large scale, organizations are encouraged to
    only apply the requirement to those limited number (and type) of devices that truly need to support this capability.
  impact: ''
  references: []
  page_start: 63
  audit_raw: 'Review the Cisco router configuration to verify that it is compliant with this requirement

    as shown in the example below.

    snmp-server group V3GROUP v3 auth read V3READ write V3WRITE

    snmp-server host x.x.x.x version 3 auth V3USER

    Authentication used by the SNMP users can be viewed via the show snmp user

    command as shown in the example below:

    R4#show snmp user

    User name: V3USER

    Engine ID: 800000090300C2042B540000

    storage-type: nonvolatile active

    Authentication Protocol: SHA

    Privacy Protocol: None

    Group-name: V3GROUP

    If the Cisco router is not configured to authenticate SNMP messages using a FIPSvalidated HMAC, this is a finding.'
  remediation: 'Configure the Cisco router to authenticate SNMP messages as shown in the example

    below:

    R4(config)#snmp-server group V3GROUP v3 auth read V3READ write V3WRITE

    R4(config)#snmp-server user V3USER V3GROUP v3 auth sha xxxxxxx

    R4(config)#snmp-server host x.x.x.x version 3 auth V3USER'
  checks:
