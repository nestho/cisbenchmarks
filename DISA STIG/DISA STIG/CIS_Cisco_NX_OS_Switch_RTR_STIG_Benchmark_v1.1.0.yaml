- id: '1.61'
  title: CISC-RT-000810
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco multicast edge switch must be configured to establish boundaries for administratively scoped multicast
    traffic. GROUP ID: V-221134 RULE ID: SV-221134r999743'
  rationale: If multicast traffic is forwarded beyond the intended boundary, it is possible that it can be intercepted by
    unauthorized or unintended personnel. Administrative scoped multicast addresses are locally assigned and are to be used
    exclusively by the enterprise network or enclave. Administrative scoped multicast traffic must not cross the enclave perimeter
    in either direction. Restricting multicast traffic makes it more difficult for a malicious user to access sensitive traffic.
    Admin-Local scope is encouraged for any multicast traffic within a network intended for network management, as well as
    for control plane traffic that must reach beyond linklocal destinations.
  impact: ''
  references: []
  page_start: 144
  audit_raw: "Multicast boundary for NX-OS can be established via combination of the border\ncommand along with an ACL to\
    \ filter admin-scoped multicast traffic.\nStep 1: Verify that the interface at the multicast domain edge has been configured\
    \ with\nboth an ingress and egress ACL.\ninterface Ethernet2/1\n no switchport\n ip access-group FILTER_TRAFFIC_IN in\n\
    \ ip access-group FILTER_TRAFFIC_OUT out\n ip address 10.1.12.1/24\n ip pim sparse-mode\n ip pim border\nNote: The command\
    \ ip pim border enables the interface to be on the border of PIM\ndomain so that no bootstrap, candidate-RP, or Auto-RP\
    \ messages are sent or received\non the interface.\nStep 2: Verify that the ingress and egress ACLs block the address\
    \ range for\nadministratively scoped multicast traffic.\nip access-list FILTER_TRAFFIC_IN\n 10 deny ip any 239.0.0.0/8\n\
    \ 20 permit tcp any any established\n…\n …\n …\n90 deny ip any any log\nip access-list FILTER_TRAFFIC_OUT\n 10 deny ip\
    \ any 239.0.0.0/8\n 20 deny ip …\n …\n80 permit ip any any\nIf the switch is not configured to establish boundaries for\
    \ administratively scoped\nmulticast traffic, this is a finding."
  remediation: 'Step 1: Configure an ingress and egress ACL to block administratively scoped multicast

    traffic.

    SW1(config)# ip access-list FILTER_TRAFFIC_IN

    SW1(config-acl)# deny 239.0.0.0/8

    SW1(config-acl)# permit tcp any any established

    SW1(config-acl)# …

    SW1(config-acl)# deny ip any any log

    SW1(config-acl)# exit

    SW1(config)# ip access-list FILTER_TRAFFIC_OUT

    SW1(config-acl)# deny 239.0.0.0/8

    SW1(config-acl)# …

    SW1(config-acl)# permit ip any any

    SW1(config-acl)# exit

    Step 2: Apply the ingress and egress ACL to the applicable interfaces.

    SW1(config)# int e2/1

    SW1(config-if)# ip access-group FILTER_TRAFFIC_IN in

    SW1(config-if)# ip access-group FILTER_TRAFFIC_OUT out

    SW1(config-if)# end'
  checks:
