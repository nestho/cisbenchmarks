- id: '1.26'
  title: CISC-RT-000390
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco perimeter switch must be configured to block all outbound management traffic. GROUP ID: V-221099
    RULE ID: SV-221099r999708'
  rationale: For in-band management, the management network must have its own subnet in order to enforce control and access
    boundaries provided by Layer 3 network nodes, such as switches and firewalls. Management traffic between the managed network
    elements and the management network is routed via the same links and nodes as that used for production or operational
    traffic. Safeguards must be implemented to ensure that the management traffic does not leak past the perimeter of the
    managed network.
  impact: ''
  references: []
  page_start: 68
  audit_raw: "The perimeter switch of the managed network must be configured with an outbound\nACL on the egress interface\
    \ to block all management traffic as shown in the example\nbelow:\nStep 1: Verify that all external interfaces has been\
    \ configured with an outbound ACL as\nshown in the example below:\ninterface Ethernet2/2\n description link to DISN\n\
    \ no switchport\n ip access-group EXTERNAL_ACL_OUTBOUND out\n ip address x.11.1.2 255.255.255.254\nStep 2: Verify that\
    \ the outbound ACL discards management traffic as shown in the\nexample below:\nip access-list EXTERNAL_ACL_OUTBOUND\n\
    \ 10 deny tcp any any eq tacacs log\n 20 deny tcp any any eq 22 log\n 30 deny udp any any eq snmp log\n 40 deny udp any\
    \ any eq snmptrap log\n 50 deny udp any any eq syslog log\n 60 permit tcp any any eq www log\n 70 deny ip any any log\n\
    If management traffic is not blocked at the perimeter, this is a finding."
  remediation: 'Configure the perimeter switch of the managed network with an outbound ACL on the

    egress interface to block all management traffic.

    Step 1: Configure an ACL to block egress management traffic.

    SW1(config)# ip access-list EXTERNAL_ACL_OUTBOUND

    SW1(config-acl)# deny tcp any any eq tacacs log

    SW1(config-acl)# deny tcp any any eq 22 log

    SW1(config-acl)# deny udp any any eq snmp log

    SW1(config-acl)# deny udp any any eq snmptrap log

    SW1(config-acl)# deny udp any any eq syslog log

    SW1(config-acl)# permit tcp any any eq www

    SW1(config-acl)# deny ip any any log

    SW1(config-acl)# exit

    Note: Permit commands would be configured to allow applicable outbound traffic. The

    example above is allowing web traffic.

    Step 2: Configure the external interfaces with the outbound ACL.

    SW1(config)#int e2/2

    SW1(config-if)# ip access-group EXTERNAL_ACL_OUTBOUND out'
