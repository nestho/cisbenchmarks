    \ originate\nthe route. The configuration should look similar to the following:\nip as-path access-list AS_PATH permit\
    \ ^yy$\nip as-path access-list 10 AS_PATH .*\nNote: the characters “^” and “$” representing the beginning and the end\
    \ of the\nexpression respectively are optional and are implicitly defined if omitted.\nStep 2: Verify that the as-path\
