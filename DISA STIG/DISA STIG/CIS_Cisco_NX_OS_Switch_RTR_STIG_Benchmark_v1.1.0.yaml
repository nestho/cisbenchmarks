- id: '1.20'
  title: CISC-RT-000330
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco perimeter switch must be configured to filter ingress traffic at the external interface on an inbound
    direction. GROUP ID: V-221093 RULE ID: SV-221093r999702'
  rationale: 'Access lists are used to separate data traffic into that which it will route (permitted packets) and that which
    it will not route (denied packets). Secure configuration of switches makes use of access lists for restricting access
    to services on the switch itself as well as for filtering traffic passing through the switch. Inbound versus Outbound:
    It should be noted that some operating systems default access lists are applied to the outbound queue. The more secure
    solution is to apply the access list to the inbound queue for three reasons: • The switch can protect itself before damage
    is inflicted. • The input port is still known and can be filtered upon. • It is more efficient to filter packets before
    routing them.'
  impact: ''
  references: []
  page_start: 57
  audit_raw: "Review the switch configuration to verify that an inbound ACL is configured on all\nexternal interfaces as shown\
    \ in the example below:\ninterface Ethernet2/2\n description link to DISN\n no switchport\n ip access-group EXTERNAL_ACL\
    \ in\nIf the switch is not configured to filter traffic entering the network at all external\ninterfaces in an inbound\
    \ direction, this is a finding."
  remediation: 'Configure the switch to use an inbound ACL on all external interfaces as shown in the

    example below:

    SW1(config)#int e2/2

    SW1(config-if)# ip access-group EXTERNAL_ACL in

    SW1(config-if)# end'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify that an inbound ACL is configured on all\nexternal interfaces as shown\
      \ in the example below:\ninterface Ethernet2/2\n description link to DISN\n no switchport\n ip access-group EXTERNAL_ACL\
      \ in\nIf the switch is not configured to filter traffic entering the network at all external\ninterfaces in an inbound\
      \ direction, this is a finding."
    severity: medium
