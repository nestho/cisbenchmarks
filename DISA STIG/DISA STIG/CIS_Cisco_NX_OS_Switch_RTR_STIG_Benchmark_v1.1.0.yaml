    \ deny ip any any log\nIf the switch is not configured to enforce approved authorizations for controlling the flow\nof\
    \ information between interconnected networks, this is a finding."
  remediation: 'Step 1: Configure an ACL to allow or deny traffic as shown in the example below:

    SW2(config)# ip access-list EXTERNAL_ACL

