      \ class PREFERRED_DATA\n bandwidth percent 25\nclass S"
    severity: medium
- id: '1.59'
  title: CISC-RT-000790
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco multicast switch must be configured to disable Protocol Independent Multicast (PIM) on all interfaces
    that are not required to support multicast routing. GROUP ID: V-221132 RULE ID: SV-221132r999741'
  rationale: If multicast traffic is forwarded beyond the intended boundary, it is possible that it can be intercepted by
    unauthorized or unintended personnel. Limiting where, within the network, a given multicast group's data is permitted
    to flow is an important first step in improving multicast security. A scope zone is an instance of a connected region
    of a given scope. Zones of the same scope cannot overlap while zones of a smaller scope will fit completely within a zone
    of a larger scope. For example, Admin-local scope is smaller than Site-local scope, so the administratively configured
    boundary fits within the bounds of a site. According to RFC 4007 IPv6 Scoped Address Architecture (section 5), scope zones
    are also required to be "convex from a routing perspective"; that is, packets routed within a zone must not pass through
    any links that are outside of the zone. This requirement forces each zone to be one contiguous island rather than a series
    of separate islands. As stated in the DoD IPv6 IA Guidance for MO3, "One should be able to identify all interfaces of
    a zone by drawing a closed loop on their network diagram, engulfing some switches and passing through some switches to
    include only some of their interfaces." Therefore, it is imperative that the network engineers have documented their multicast
    topology and thereby knows which interfaces are enabled for multicast. Once this is done, the zones can be scoped as required.
  impact: ''
  references: []
  page_start: 140
  audit_raw: "Step 1: Review the network's multicast topology diagram.\nStep 2: Review the switch configuration to verify\
    \ that only the PIM interfaces as shown\nin the multicast topology diagram are enabled for PIM as shown in the example\
    \ below:\ninterface Ethernet2/1\n no switchport\n ip address 10.1.12.1/24\n ip pim sparse-mode\nIf an interface is not\
    \ required to support multicast routing and it is enabled, this is a\nfinding."
  remediation: 'Document all enabled interfaces for PIM in the network''s multicast topology diagram.

    Disable support for PIM on interfaces that are not required to support it.

    SW1(config)# int e2/1

    SW1(config-if)# no ip pim sparse-mode

    SW1(config-if)# end'
  checks:
  - type: manual_review
    info: "Step 1: Review the network's multicast topology diagram.\nStep 2: Review the switch configuration to verify that\
      \ only the PIM interfaces as shown\nin the multicast topology diagram are enabled for PIM as shown in the example below:\n\
      interface Ethernet2/1\n no switchport\n ip address 10.1.12.1/24\n ip pim sparse-mode\nIf an interface is not required\
      \ to support multicast routing and it is enabled, this is a\nfinding."
    severity: medium
- id: '1.60'
  title: CISC-RT-000800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco multicast switch must be configured to bind a Protocol Independent Multicast (PIM) neighbor filter
    to interfaces that have PIM enabled. GROUP ID: V-221133 RULE ID: SV-221133r999742'
  rationale: PIM is a routing protocol used to build multicast distribution trees for forwarding multicast traffic across
    the network infrastructure. PIM traffic must be limited to only known PIM neighbors by configuring and binding a PIM neighbor
    filter to those interfaces that have PIM enabled. If a PIM neighbor filter is not applied to those interfaces that have
    PIM enabled, unauthorized switches can join the PIM domain, discover and use the rendezvous points, and also advertise
    their rendezvous points into the domain. This can result in a denial of service by traffic flooding or result in the unauthorized
    transfer of data.
  impact: ''
  references: []
