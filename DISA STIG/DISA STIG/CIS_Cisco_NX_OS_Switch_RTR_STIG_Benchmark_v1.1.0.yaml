- id: '1.65'
  title: CISC-RT-000860
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco multicast Designated switch (DR) must be configured to filter the Internet Group Management Protocol
    (IGMP) and Multicast Listener Discovery (MLD) Report messages to allow hosts to join only multicast groups that have been
    approved by the organization. GROUP ID: V-221138 RULE ID: SV-221138r999747'
  rationale: Real-time multicast traffic can entail multiple large flows of data. Large unicast flows tend to be fairly isolated
    (i.e., someone doing a file download here or there), whereas multicast can have broader impact on bandwidth consumption,
    resulting in extreme network congestion. Hence, it is imperative that there is multicast admission control to restrict
    which multicast groups hosts are allowed to join via IGMP or MLD.
  impact: ''
  references: []
