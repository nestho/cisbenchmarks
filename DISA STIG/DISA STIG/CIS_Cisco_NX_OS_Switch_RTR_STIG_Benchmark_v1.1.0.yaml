- id: '1.27'
  title: CISC-RT-000450
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to only permit management traffic that ingresses and egresses the out-of-band
    management (OOBM) interface. GROUP ID: V-221100 RULE ID: SV-221100r999709'
  rationale: The OOBM access switch will connect to the management interface of the managed network elements. The management
    interface can be a true OOBM interface or a standard interface functioning as the management interface. In either case,
    the management interface of the managed network element will be directly connected to the OOBM network. An OOBM interface
    does not forward transit traffic, thereby providing complete separation of production and management traffic. Since all
    management traffic is immediately forwarded into the management network, it is not exposed to possible tampering. The
    separation also ensures that congestion or failures in the managed network do not affect the management of the device.
    If the device does not have an OOBM port, the interface functioning as the management interface must be configured so
    that management traffic does not leak into the managed network and that production traffic does not leak into the management
    network.
  impact: ''
  references: []
  page_start: 70
  audit_raw: "This requirement is only applicable where management access to the switch is via an\nOOBM interface which is\
    \ not a true OOBM interface.\nStep 1: Verify that the managed interface has an inbound and outbound ACL\nconfigured.\n\
    interface Ethernet2/7\n description link to OOBM access switch\n no switchport\n ip address 10.11.1.22 255.255.255.0\n\
    \ ip access-group INGRESS_MANAGEMENT_ACL in\n ip access-group EGRESS_MANAGEMENT_ACL in\nStep 2: Verify that the ingress\
    \ ACL only allows management and ICMP traffic.\nip access-list INGRESS_MANAGEMENT_ACL\n 10 permit tcp any 10.11.1.22/32\
    \ eq tacacs\n 20 permit tcp any 10.11.1.22/32 eq 22\n 30 permit udp any 10.11.1.22/32 eq snmp\n 40 permit udp any 10.11.1.22/32\
    \ eq snmptrap\n 50 permit udp any 10.11.1.22/32 eq ntp\n 60 permit icmp any 10.11.1.22/32\n 70 deny ip any any log\nStep\
    \ 3: Verify that the egress ACL blocks any transit traffic.\nip access-list MGMT_TRAFFIC_ACL\n 10 deny ip any any log\n\
    Note: On Cisco switches, local generated packets are not inspected by outgoing\ninterface access-lists. Hence, the above\
    \ configuration would simply drop any packets\nnot generated by the switch; hence, blocking any transit traffic.\nIf the\
    \ switch does not restrict traffic that ingresses and egresses the management\ninterface, this is a finding."
  remediation: 'If the management interface is not a dedicated OOBM interface, it must be configured

    with both an ingress and egress ACL.

    Step 1: Configure an ingress ACL a shown in the example below:

    SW1(config)#ip access-list INGRESS_MANAGEMENT_ACL

    SW1(config-acl)# permit tcp any host 10.11.1.22 eq tacacs

    SW1(config-acl)# permit tcp any host 10.11.1.22 eq 22

    SW1(config-acl)# permit udp any host 10.11.1.22 eq snmp

    SW1(config-acl)# permit udp any host 10.11.1.22 eq snmptrap

    SW1(config-acl)# permit udp any host 10.11.1.22 eq ntp

    SW1(config-acl)# permit icmp any host 10.11.1.22

    SW1(config-acl)# deny ip any any log

    SW1(config-acl)# exit

    Step 2: Configure an egress ACL a shown in the example below:

    SW1(config)# ip access-list EGRESS_MANAGEMENT_ACL

    SW1(config-acl)# deny ip any any log

    SW1(config-acl)# exit

    Step 3: Apply the ACLs to the OOBM interfaces.

    SW1(config)#int e2/7

    SW1(config-if) ip access-group INGRESS_MANAGEMENT_ACL in

    SW1(config-if) ip access-group EGRESS_MANAGEMENT_ACL out'
  checks:
  - type: manual_review
    info: "This requirement is only applicable where management access to the switch is via an\nOOBM interface which is not\
      \ a true OOBM interface.\nStep 1: Verify that the managed interface has an inbound and outbound ACL\nconfigured.\ninterface\
      \ Ethernet2/7\n description link to OOBM access switch\n no switchport\n ip address 10.11.1.22 255.255.255.0\n ip access-group\
      \ INGRESS_MANAGEMENT_ACL in\n ip access-group EGRESS_MANAGEMENT_ACL in\nStep 2: Verify that the ingress ACL only allows\
      \ management and ICMP traffic.\nip "
    severity: medium
- id: '1.28'
  title: CISC-RT-000470
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco BGP switch must be configured to check whether a single-hop eBGP peer is directly connected. GROUP
    ID: V-221101 RULE ID: SV-221101r999710'
  rationale: As described in RFC 3682, GTSM is designed to protect a switch's IP-based control plane from DoS attacks. Many
    attacks focused on CPU load and line-card overload can be prevented by implementing GTSM on all Exterior Border Gateway
    Protocol-speaking switches. GTSM is based on the fact that the vast majority of control plane peering is established between
    adjacent switches; that is, the Exterior Border Gateway Protocol peers are either between connecting interfaces or between
    loopback interfaces. Since TTL spoofing is considered nearly impossible, a mechanism based on an expected TTL value provides
    a simple and reasonably robust defense from infrastructure attacks based on forged control plane traffic.
  impact: ''
  references: []
  page_start: 73
  audit_raw: "Review the BGP configuration to verify that checking whether a single-hop eBGP peer\nis directly connected.\
    \ The example below disables this mechanism.\nrouter bgp xx\n router-id 10.1.1.1\n neighbor x.1.12.2 remote-as xx\n disable-connected-check\n\
    \ address-family ipv4 unicast\nNote: BGP triggers a connection check automatically for all eBGP peers that are known\n\
    to be a single hop away, unless this check is disabled with the disable-connected-check\ncommand. BGP does not bring up\
    \ sessions if the check fails.\nIf the switch is configured to disable checking whether a single-hop eBGP peer is\ndirectly\
    \ connected, this is a finding."
  remediation: 'Remove the command that disables checking whether a single-hop eBGP peer is

    directly connected for all external BGP neighbors as shown in the example below:

    SW1(config)# router bgp xx

    SW1(config-router)# neighbor x.1.12.2

    SW1(config-router-neighbor)# no disable-connected-check

    SW1(config-router-neighbor)# end'
  checks:
  - type: manual_review
    info: "Review the BGP configuration to verify that checking whether a single-hop eBGP peer\nis directly connected. The\
      \ example below disables this mechanism.\nrouter bgp xx\n router-id 10.1.1.1\n neighbor x.1.12.2 remote-as xx\n disable-connected-check\n\
      \ address-family ipv4 unicast\nNote: BGP triggers a connection check automatically for all eBGP peers that are known\n\
      to be a single hop away, unless this check is disabled with the disable-connected-check\ncommand. BGP does not bring\
      \ up sessions if the check fai"
    severity: medium
- id: '1.29'
  title: CISC-RT-000480
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco BGP switch must be configured to use a unique key for each autonomous system (AS) that it peers
    with. GROUP ID: V-221102 RULE ID: SV-221102r999711'
  rationale: If the same keys are used between eBGP neighbors, the chance of a hacker compromising any of the BGP sessions
    increases. It is possible that a malicious user exists in one autonomous system who would know the key used for the eBGP
    session. This user would then be able to hijack BGP sessions with other trusted neighbors.
  impact: ''
  references: []
  page_start: 75
  audit_raw: "Review the BGP configuration to determine if it is peering with multiple autonomous\nsystems. Interview the\
    \ ISSM and switch administrator to determine if unique keys are\nbeing used.\nrouter bgp xx\n router-id 10.1.1.1\n neighbor\
    \ x.1.12.2 remote-as 2\n password 3 7b07d1b3023056a9\n address-family ipv4 unicast\n neighbor x.2.44.4 remote-as xx\n\
    \ password 3 f07a10cb41db8bb6f8f0a340049a9b02\n address-family ipv4 unicast\nIf unique keys are not being used, this is\
    \ a finding."
  remediation: 'Configure the switch to use unique keys for each AS that it peers with as shown in the

    example below:

    SW1(config)# router bgp xx

    SW1(config-router)# neighbor x.1.12.2

    SW1(config-router-neighbor)# password yyyyyyyyy

    SW1(config-router-neighbor)# exit

    SW1(config-router)# neighbor x.2.44.4

    SW1(config-router-neighbor)# password zzzzzzzzzz

    SW1(config-router-neighbor)# end'
  checks:
  - type: manual_review
    info: "Review the BGP configuration to determine if it is peering with multiple autonomous\nsystems. Interview the ISSM\
      \ and switch administrator to determine if unique keys are\nbeing used.\nrouter bgp xx\n router-id 10.1.1.1\n neighbor\
      \ x.1.12.2 remote-as 2\n password 3 7b07d1b3023056a9\n address-family ipv4 unicast\n neighbor x.2.44.4 remote-as xx\n\
      \ password 3 f07a10cb41db8bb6f8f0a340049a9b02\n address-family ipv4 unicast\nIf unique keys are not being used, this\
      \ is a finding."
    severity: medium
- id: '1.30'
  title: CISC-RT-000490
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco BGP switch must be configured to reject inbound route advertisements for any Bogon prefixes. GROUP
    ID: V-221103 RULE ID: SV-221103r999712'
  rationale: Accepting route advertisements for Bogon prefixes can result in the local autonomous system (AS) becoming a transit
    for malicious traffic as it will in turn advertise these prefixes to neighbor autonomous systems.
  impact: ''
  references: []
  page_start: 77
  audit_raw: "Review the switch configuration to verify that it will reject BGP routes for any Bogon\nprefixes.\nStep 1: Verify\
    \ a prefix list has been configured containing the current Bogon prefixes as\nshown in the example below:\nip prefix-list\
    \ PREFIX_FILTER seq 5 deny 0.0.0.0/8 le 32\nip prefix-list PREFIX_FILTER seq 10 deny 10.0.0.0/8 le 32\nip prefix-list\
    \ PREFIX_FILTER seq 15 deny 100.64.0.0/10 le 32\nip prefix-list PREFIX_FILTER seq 20 deny 127.0.0.0/8 le 32\nip prefix-list\
    \ PREFIX_FILTER seq 25 deny 169.254.0.0/16 le 32\nip prefix-list PREFIX_FILTER seq 30 deny 172.16.0.0/12 le 32\nip prefix-list\
    \ PREFIX_FILTER seq 35 deny 192.0.2.0/24 le 32\nip prefix-list PREFIX_FILTER seq 40 deny 192.88.99.0/24 le 32\nip prefix-list\
    \ PREFIX_FILTER seq 45 deny 192.168.0.0/16 le 32\nip prefix-list PREFIX_FILTER seq 50 deny 198.18.0.0/15 le 32\nip prefix-list\
    \ PREFIX_FILTER seq 55 deny 198.51.100.0/24 le 32\nip prefix-list PREFIX_FILTER seq 60 deny 203.0.113.0/24 le 32\nip prefix-list\
    \ PREFIX_FILTER seq 65 deny 224.0.0.0/4 le 32\nip prefix-list PREFIX_FILTER seq 70 deny 240.0.0.0/4 le 32\nip prefix-list\
    \ PREFIX_FILTER seq 75 permit 0.0.0.0/0 ge 8\nStep 2: Verify that the prefix list has been applied to all external BGP\
    \ peers as shown in\nthe example below:\nrouter bgp xx\n router-id 10.1.1.1\n neighbor x.1.12.2 remote-as xx\n password\
    \ 3 7b07d1b3023056a9\n address-family ipv4 unicast\n prefix-list PREFIX_FILTER in\n neighbor x.2.44.4 remote-as xx\n password\
    \ 3 f07a10cb41db8bb6f8f0a340049a9b02\n address-family ipv4 unicast\n prefix-list PREFIX_FILTER in\nRoute Map Alternative\n\
    Verify that the route map applied to the external neighbors references the configured\nBogon prefix list shown above.\n\
    route-map FILTER_PREFIX_MAP permit 10\n match ip address prefix-list PREFIX_FILTER\n…\n…\n…\nrouter bgp xx\n router-id\
    \ 10.1.1.1\n neighbor x.1.12.2 remote-as xx\n password 3 7b07d1b3023056a9\n address-family ipv4 unicast\n route-map FILTER_PREFIX_MAP\
    \ in\n neighbor x.2.44.4 remote-as xx\n password 3 f07a10cb41db8bb6f8f0a340049a9b02\n address-family ipv4 unicast\n route-map\
    \ FILTER_PREFIX_MAP in\nIf the switch is not configured to reject inbound route advertisements for any Bogon\nprefixes,\
    \ this is a finding."
  remediation: 'Configure the switch to reject inbound route advertisements for any Bogon prefixes.

    Step 1: Configure a prefix list containing the current Bogon prefixes as shown below:

    SW1(config)# ip prefix-list PREFIX_FILTER seq 5 deny 0.0.0.0/8 le 32

    SW1(config)# ip prefix-list PREFIX_FILTER seq 10 deny 10.0.0.0/8 le 32

    SW1(config)# ip prefix-list PREFIX_FILTER seq 15 deny 100.64.0.0/10 le 32

    SW1(config)# ip prefix-list PREFIX_FILTER seq 20 deny 127.0.0.0/8 le 32

    SW1(config)# ip prefix-list PREFIX_FILTER seq 25 deny 169.254.0.0/16 le 32

    SW1(config)# ip prefix-list PREFIX_FILTER seq 30 deny 172.16.0.0/12 le 32

    SW1(config)# ip prefix-list PREFIX_FILTER seq 35 deny 192.0.2.0/24 le 32

    SW1(config)# ip prefix-list PREFIX_FILTER seq 40 deny 192.88.99.0/24 le 32

    SW1(config)# ip prefix-list PREFIX_FILTER seq 45 deny 192.168.0.0/16 le 32

    SW1(config)# ip prefix-list PREFIX_FILTER seq 50 deny 198.18.0.0/15 le 32

    SW1(config)# ip prefix-list PREFIX_FILTER seq 55 deny 198.51.100.0/24 le 32

    SW1(config)# ip prefix-list PREFIX_FILTER seq 60 deny 203.0.113.0/24 le 32

    SW1(config)# ip prefix-list PREFIX_FILTER seq 65 deny 224.0.0.0/4 le 32

    SW1(config)# ip prefix-list PREFIX_FILTER seq 70 deny 240.0.0.0/4 le 32

    SW1(config)# ip prefix-list PREFIX_FILTER seq 75 permit 0.0.0.0/0 ge 8

    Step 2: Apply the prefix list filter inbound to each external BGP neighbor as shown in

    the example below:

    SW1(config)# router bgp xx

    SW1(config-router)# neighbor x.1.12.2

    SW1(config-router-neighbor)# address-family ipv4 unicast

    SW1(config-router-neighbor-af)# prefix-list PREFIX_FILTER in

    SW1(config-router-neighbor-af)# exit

    SW1(config-router-neighbor)# exit

    SW1(config-router)# neighbor x.2.44.4

    SW1(config-router-neighbor)# address-family ipv4 unicast

    SW1(config-router-neighbor-af)# prefix-list PREFIX_FILTER in

    SW1(config-router-neighbor-af)# end

    Route Map Alternative

    Step 1: Configure the route map referencing the configured prefix list above.

    SW1(config)# route-map FILTER_PREFIX_MAP permit 10

    SW1(config-route-map)# match ip address prefix-list PREFIX_FILTER

    SW1(config-route-map)# exit

    Step 2: Apply the route-map inbound to each external BGP neighbor as shown in the

    example below:

    SW1(config)# router bgp xx

    SW1(config-router)# neighbor x.1.12.2

    SW1(config-router-neighbor)# address-family ipv4 unicast

    SW1(config-router-neighbor-af)# route-map FILTER_PREFIX_MAP in

    SW1(config-router-neighbor-af)# exit

    SW1(config-router-neighbor)# exit

    SW1(config-router)# neighbor x.2.44.4

    SW1(config-router-neighbor)# address-family ipv4 unicast

    SW1(config-router-neighbor-af)# route-map FILTER_PREFIX_MAP in

    SW1(config-router-neighbor-af)# end'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to verify that it will reject BGP routes for any Bogon

      prefixes.

      Step 1: Verify a prefix list has been configured containing the current Bogon prefixes as

      shown in the example below:

      ip prefix-list PREFIX_FILTER seq 5 deny 0.0.0.0/8 le 32

      ip prefix-list PREFIX_FILTER seq 10 deny 10.0.0.0/8 le 32

      ip prefix-list PREFIX_FILTER seq 15 deny 100.64.0.0/10 le 32

      ip prefix-list PREFIX_FILTER seq 20 deny 127.0.0.0/8 le 32

      ip prefix-list PREFIX_FILTER seq 25 deny 169.254.0.'
    severity: medium
- id: '1.31'
  title: CISC-RT-000500
  scoring: manual
  profile:
