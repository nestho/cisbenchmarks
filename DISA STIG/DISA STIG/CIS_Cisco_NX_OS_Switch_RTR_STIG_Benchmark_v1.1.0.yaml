- id: '1.14'
  title: CISC-RT-000240
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco perimeter switch must be configured to deny network traffic by default and allow network traffic
    by exception. Group ID: V-221087 Rule ID: SV-221087r999696'
  rationale: A deny-all, permit-by-exception network communications traffic policy ensures that only connections that are
    essential and approved are allowed. This requirement applies to both inbound and outbound network communications traffic.
    All inbound and outbound traffic must be denied by default. Firewalls and perimeter switches should only allow traffic
    through that is explicitly permitted. The initial defense for the internal network is to block any traffic at the perimeter
    that is attempting to make a connection to a host residing on the internal network. In addition, allowing unknown or undesirable
    outbound traffic by the firewall or switch will establish a state that will permit the return of this undesirable traffic
    inbound.
  impact: ''
  references: []
  page_start: 40
  audit_raw: "Review the switch configuration to verify that the inbound ACL applied to all external\ninterfaces is configured\
    \ to allow specific ports and protocols and deny all other traffic.\nStep 1: Verify that an inbound ACL is applied to\
    \ all external interfaces as shown in the\nexample below:\ninterface Ethernet1/2\n no switchport\n ip access-group EXTERNAL_ACL\
    \ in\n ip address x.11.1.2 255.255.255.254\nStep 2: Review inbound ACL to verify that it is configured to deny all other\
    \ traffic that is\nnot explicitly allowed.\nip access-list EXTERNAL_ACL\n 10 permit tcp x.11.1.1/32 eq bgp x.11.1.2/32\n\
    \ 20 permit tcp x.11.1.1/32 x.11.1.2/32 eq bgp\n 30 permit icmp x.11.1.1/32 x.11.1.2/32 echo\n 40 permit icmp x.11.1.1/32\
    \ x.11.1.2/32 echo-reply\n 50 permit tcp any x.11.2.3/32 eq www\n 60 permit …\n …\n …\n …\n90 deny ip any any log\nIf\
    \ the ACL is not configured to allow specific ports and protocols and deny all other\ntraffic, this is a finding. If the\
    \ ACL is not configured inbound on all external interfaces,\nthis is a finding."
  remediation: 'Step 1: Configure an inbound ACL to deny all other traffic by default as shown in the

    example below:

    SW1(config)# ip access-list EXTERNAL_ACL

    SW1(config-acl)# permit tcp host x.11.1.1 eq bgp host x.11.1.2

    SW1(config-acl)# permit tcp host x.11.1.1 host x.11.1.2 eq bgp

    SW1(config-acl)# permit icmp host x.11.1.1 host x.11.1.2 echo

    SW1(config-acl)# permit icmp host x.11.1.1 host x.11.1.2 echo-reply

    SW1(config-acl)# permit tcp any x.11.2.3/32 eq www

    SW1(config-acl)# permit …

    …

    …

    …

    SW1(config-acl)# deny ip any any log

    Step 2: Apply the ingress filter to all external interfaces.

    SW1(config)#int e1/2

    SW1(config-if)#ip access-group EXTERNAL_ACL in'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify that the inbound ACL applied to all external\ninterfaces is configured\
      \ to allow specific ports and protocols and deny all other traffic.\nStep 1: Verify that an inbound ACL is applied to\
      \ all external interfaces as shown in the\nexample below:\ninterface Ethernet1/2\n no switchport\n ip access-group EXTERNAL_ACL\
      \ in\n ip address x.11.1.2 255.255.255.254\nStep 2: Review inbound ACL to verify that it is configured to deny all other\
