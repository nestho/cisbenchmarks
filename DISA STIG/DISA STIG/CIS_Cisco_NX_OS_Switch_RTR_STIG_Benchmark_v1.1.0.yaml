      ip prefix-list PREFIX_FILTER seq 75 permit 0.0.0.0/0 ge 8

      Step 2: Verify that the prefix list has b'
    severity: medium
- id: '1.32'
  title: CISC-RT-000510
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco BGP switch must be configured to reject inbound route advertisements from a customer edge (CE) switch
    for prefixes that are not allocated to that customer. GROUP ID: V-221105 RULE ID: SV-221105r999714'
  rationale: As a best practice, a service provider should only accept customer prefixes that have been assigned to that customer
    and any peering autonomous systems. A multi-homed customer with BGP speaking switches connected to the Internet or other
    external networks could be breached and used to launch a prefix de-aggregation attack. Without ingress route filtering
    of customers, the effectiveness of such an attack could impact the entire IP core and its customers.
  impact: ''
  references: []
  page_start: 83
  audit_raw: "Review the switch configuration to verify that there are ACLs defined to only accept\nroutes for prefixes that\
    \ belong to specific customers.\nStep 1: Verify prefix list has been configured for each customer containing prefixes\n\
    belonging to each customer as shown in the example below:\nip prefix-list PREFIX_FILTER_CUST1 seq 5 permit x.13.1.0/24\
    \ le 32\nip prefix-list PREFIX_FILTER_CUST1 seq 10 deny 0.0.0.0/0 ge 8\nip prefix-list PREFIX_FILTER_CUST2 seq 5 permit\
    \ x.13.2.0/24 le 32\nip prefix-list PREFIX_FILTER_CUST2 seq 10 deny 0.0.0.0/0 ge 8\nStep 2: Verify that the prefix lists\
    \ has been applied to all to the applicable CE peers as\nshown in the example below:\nrouter bgp xx\n router-id 10.1.1.1\n\
    \ neighbor x.55.14.2 remote-as 64514\n password 3 7b07d1b3023056a9\n address-family ipv4 unicast\n prefix-list FILTER_PREFIXES_CUST1\
    \ in\n neighbor x.55.14.4 remote-as 64516\n password 3 f07a10cb41db8bb6f8f0a340049a9b02\n address-family ipv4 unicast\n\
    \ prefix-list FILTER_PREFIXES_CUST1 in\nNote: Routes to PE-CE links within a VPN are needed for troubleshooting end-to-end\n\
    connectivity across the MPLS/IP backbone. Hence, these prefixes are an exception to\nthis requirement.\nIf the switch\
    \ is not configured to reject inbound route advertisements from each CE\nswitch for prefixes that are not allocated to\
    \ that customer, this is a finding."
  remediation: 'Configure the switch to reject inbound route advertisements from each CE switch for

    prefixes that are not allocated to that customer.

    Step 1: Configure a prefix list for each customer containing prefixes belonging to each.

    SW1(config)# ip prefix-list PREFIX_FILTER_CUST1 permit x.13.1.0/24 le 32

    SW1(config)# ip prefix-list PREFIX_FILTER_CUST1 deny 0.0.0.0/0 ge 8

    SW1(config)# ip prefix-list PREFIX_FILTER_CUST2 permit x.13.2.0/24 le 32

    SW1(config)# ip prefix-list PREFIX_FILTER_CUST2 deny 0.0.0.0/0 ge 8

    Step 2: Apply the prefix list filter inbound to each CE neighbor as shown in the example

    below:

    SW1(config)# router bgp xx

    SW1(config-router)# neighbor x.55.14.2

    SW1(config-router-neighbor)# address-family ipv4 unicast

    SW1(config-router-neighbor-af)# prefix-list PREFIX_FILTER_CUST1 in

    SW1(config-router-neighbor-af)# exit

    SW1(config-router-neighbor)# exit

    SW1(config-router)# neighbor x.55.14.4

    SW1(config-router-neighbor)# address-family ipv4 unicast

    SW1(config-router-neighbor-af)# prefix-list PREFIX_FILTER_CUST2 in

    SW1(config-router-neighbor-af)# end'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to verify that there are ACLs defined to only accept

      routes for prefixes that belong to specific customers.

      Step 1: Verify prefix list has been configured for each customer containing prefixes

      belonging to each customer as shown in the example below:

      ip prefix-list PREFIX_FILTER_CUST1 seq 5 permit x.13.1.0/24 le 32

      ip prefix-list PREFIX_FILTER_CUST1 seq 10 deny 0.0.0.0/0 ge 8

      ip prefix-list PREFIX_FILTER_CUST2 seq 5 permit x.13.2.0/24 le 32

      ip prefix-list PREFIX_F'
    severity: medium
- id: '1.33'
  title: CISC-RT-000520
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco BGP switch must be configured to reject outbound route advertisements for any prefixes that do not
    belong to any customers or the local autonomous system (AS). GROUP ID: V-221106 RULE ID: SV-221106r999715'
  rationale: Advertisement of routes by an autonomous system for networks that do not belong to any of its customers pulls
    traffic away from the authorized network. This causes a denial of service (DoS) on the network that allocated the block
    of addresses and may cause a DoS on the network that is inadvertently advertising it as the originator. It is also possible
    that a misconfigured or compromised switch within the GIG IP core could redistribute Interior Gateway Protocol (IGP) routes
    into BGP, thereby leaking internal routes.
  impact: ''
  references: []
  page_start: 85
  audit_raw: "Step 1: Verify that a prefix list has been configured containing prefixes belonging to\ncustomers as well as\
    \ the local AS as shown in the example below:\nip prefix-list CE_PREFIX_ADVERTISEMENTS seq 5 permit x.13.1.0/24 le 32\n\
    ip prefix-list CE_PREFIX_ADVERTISEMENTS seq 10 permit x.13.2.0/24 le 32\nip prefix-list CE_PREFIX_ADVERTISEMENTS seq 15\
    \ permit x.13.3.0/24 le 32\nip prefix-list CE_PREFIX_ADVERTISEMENTS seq 20 permit x.13.4.0/24 le 32\n…\n…\n…\nip prefix-list\
    \ CE_PREFIX_ADVERTISEMENTS seq 80 deny 0.0.0.0/0 ge 8\nStep 2: Verify that the prefix lists has been applied to all CE\
    \ peers as shown in the\nexample below:\nrouter bgp xx\n router-id 10.1.1.1\n neighbor x.55.14.2 remote-as 64514\n password\
    \ 3 7b07d1b3023056a9\n address-family ipv4 unicast\n prefix-list CE_PREFIX_ADVERTISEMENTS out\n neighbor x.55.14.4 remote-as\
    \ 64516\n password 3 f07a10cb41db8bb6f8f0a340049a9b02\n address-family ipv4 unicast\n prefix-list CE_PREFIX_ADVERTISEMENTS\
    \ out\nIf the switch is not configured to reject outbound route advertisements that do not\nbelong to any customers or\
    \ the local AS, this is a finding."
  remediation: 'Step 1: Configure a prefix list for containing all customer and local AS prefixes as

    shown in the example below:

    SW1(config)#ip prefix-list CE_PREFIX_ADVERTISEMENTS permit x.13.1.0/24 le 32

    SW1(config)#ip prefix-list CE_PREFIX_ADVERTISEMENTS permit x.13.2.0/24 le 32

    SW1(config)#ip prefix-list CE_PREFIX_ADVERTISEMENTS permit x.13.3.0/24 le 32

    SW1(config)#ip prefix-list CE_PREFIX_ADVERTISEMENTS permit x.13.4.0/24 le 32

    …

    …

