controls:
- id: '1.1'
  title: CISC-RT-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: The Cisco switch must be configured to enforce approved authorizations for controlling the flow of information
    within the network based on organization-defined information flow control policies. GROUP ID:V-221071 RULE ID:SV-221071r999679
  rationale: Information flow control regulates where information is allowed to travel within a network and between interconnected
    networks. The flow of all network traffic must be monitored and controlled so it does not introduce any unacceptable risk
    to the network infrastructure or data. Information flow control policies and enforcement mechanisms are commonly employed
    by organizations to control the flow of information between designated sources and destinations (e.g., networks, individuals,
    and devices) within information systems. Enforcement occurs, for example, in boundary protection devices (e.g., gateways,
    switches, guards, encrypted tunnels, and firewalls) that employ rule sets or establish configuration settings that restrict
    information system services, provide a packet-filtering capability based on header information, or provide a message-filtering
    capability based on message content (e.g., implementing key word searches or using document characteristics).
  impact: ''
  references: []
  page_start: 12
  audit_raw: "Review the switch configuration to verify that ACLs are configured to allow or deny\ntraffic for specific source\
    \ and destination addresses as well as ports and protocols. For\nexample, the configuration below will allow only printer\
    \ traffic into subnet 10.1.12.0/24\nand SQL traffic into subnet 10.1.13.0/24. ICMP is allowed for troubleshooting and\
    \ OSPF\nis the routing protocol used within the network.\ninterface Ethernet2/3\n no switchport\n ip access-group FILTER_SERVER_TRAFFIC\
    \ in\n ip address 10.1.23.2/24\n no shutdown\n…\n…\n…\nip access-list FILTER_SERVER_TRAFFIC\n 10 permit tcp any 10.1.12.0/24\
    \ eq lpd\n 20 permit tcp any 10.1.12.0/24 eq 631\n 30 permit tcp any 10.1.12.0/24 eq 9100\n 40 permit tcp any 10.1.13.0/24\
    \ eq 1433\n 50 permit tcp any 10.1.13.0/24 eq 1434\n 60 permit tcp any 10.1.13.0/24 eq 4022\n 70 permit icmp any any\n\
    \ 80 permit ospf any any\n 90 deny ip any any\nAlternate: Inter-VLAN routing\ninterface Vlan12\n ip address 10.1.12.1\
    \ 255.255.255.0\n ip access-group FILTER_PRINTER_VLAN out\n!\ninterface Vlan13\n ip address 10.1.13.1 255.255.255.0\n\
    \ ip access-group FILTER_SQL_VLAN out\n…\n…\n…\nip access-list FILTER_PRINTER_VLAN\n 10 permit tcp any any eq lpd\n 20\
    \ permit tcp any any eq 631\n 30 permit tcp any any eq 9100\n 40 permit icmp any any\n 50 deny ip any any\nip access-list\
    \ FILTER_SQL_VLAN\n 10 permit tcp any any eq 1433\n 20 permit tcp any any eq 1434\n 30 permit tcp any any eq 4033\n 40\
    \ permit icmp any any\n 50 deny ip any any\nIf the switch is not configured to enforce approved authorizations for controlling\
    \ the flow\nof information within the network based on organization-defined information flow control\npolicies, this is\
    \ a finding."
  remediation: 'Configure ACLs to allow or deny traffic for specific source and destination addresses as

    well as ports and protocols between various subnets as required. The commands used

    below were used to create the configuration as shown in the check content.

    SW1(config)# ip access-list FILTER_SERVER_TRAFFIC

    SW1(config-acl)# permit tcp any 10.1.12.0 0.0.0.255 eq lpd

    SW1(config-acl)# permit tcp any 10.1.12.0 0.0.0.255 eq 631

    SW1(config-acl)# permit tcp any 10.1.12.0 0.0.0.255 eq 9100

    SW1(config-acl)# permit tcp any 10.1.13.0 0.0.0.255 eq 1433

    SW1(config-acl)# permit tcp any 10.1.13.0 0.0.0.255 eq 1434

    SW1(config-acl)# permit tcp any 10.1.13.0 0.0.0.255 eq 4022

    SW1(config-acl)# permit icmp any any

    SW1(config-acl)# permit ospf any any

    SW1(config-acl)# deny ip any any

    SW1(config-acl)# exit

    SW1(config)# int e2/3

    SW1(config-if)# ip access-group FILTER_SERVER_TRAFFIC in

    SW1(config-if)# end

    Alternate: Inter-VLAN routing

    SW1(config)# ip access-list FILTER_PRINTER_VLAN

    SW1(config-acl)# permit tcp any any eq lpd

    SW1(config-acl)# permit tcp any any eq 631

    SW1(config-acl)# permit tcp any any eq 9100

    SW1(config-acl)# permit icmp any any

    SW1(config-acl)# deny ip any any

    SW1(config-acl)# exit

    SW1(config)# ip access-list FILTER_SQL_VLAN

    SW1(config-acl)# permit tcp any any eq 1433

    SW1(config-acl)# permit tcp any any eq 1434

    SW1(config-acl)# permit tcp any any eq 4033

    SW1(config-acl)# permit icmp any any

    SW1(config-acl)# deny ip any any

    SW1(config-acl)# exit

    SW1(config)# int vlan 12

    SW1(config-if)# ip access-group FILTER_PRINTER_VLAN out

    SW1(config-if)# exit

    SW1(config)# int vlan 13

    SW1(config-if)# ip access-group FILTER_SQL_VLAN out

    SW1(config-if)# end'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify that ACLs are configured to allow or deny\ntraffic for specific source\
      \ and destination addresses as well as ports and protocols. For\nexample, the configuration below will allow only printer\
      \ traffic into subnet 10.1.12.0/24\nand SQL traffic into subnet 10.1.13.0/24. ICMP is allowed for troubleshooting and\
      \ OSPF\nis the routing protocol used within the network.\ninterface Ethernet2/3\n no switchport\n ip access-group FILTER_SERVER_TRAFFIC\
      \ in\n ip address 10.1.23.2"
    severity: medium
- id: '1.2'
  title: CISC-RT-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: The Cisco switch must be configured to implement message authentication for all control plane protocols. GROUP
    ID:V-221072 RULE ID:SV-221072r999681
  rationale: A rogue switch could send a fictitious routing update to convince a site's perimeter switch to send traffic to
    an incorrect or even a rogue destination. This diverted traffic could be analyzed to learn confidential information about
    the site's network, or used to disrupt the network's ability to communicate with other networks. This is known as a "traffic
    attraction attack" and is prevented by configuring neighbor switch authentication for routing updates. This requirement
    applies to all IPv4 and IPv6 protocols that are used to exchange routing or packet forwarding information; this includes
    all Interior Gateway Protocols (such as OSPF, EIGRP, and IS-IS) and Exterior Gateway Protocols (such as BGP), MPLS-related
    protocols (such as LDP), and multicast-related protocols.
  impact: ''
  references: []
  page_start: 15
  audit_raw: "Review the switch configuration. Verify that neighbor switch authentication is enabled\nfor all routing protocols.\
    \ The configuration examples below depicts BGP, EIGRP, IS-IS\nand OSPF authentication.\nBGP Example\nrouter bgp 1\n router-id\
    \ 1.1.1.1\n address-family ipv4 unicast\n neighbor 10.1.12.2 remote-as 2\n password 3 3ec66c90c104ad13\nEIGRP Example\n\
    key chain EIGRP_KEY\n key 1\n key-string xxxxxxx\n…\n…\n…\ninterface Ethernet2/21\n no switchport\n ip router eigrp 1\n\
    \ ip authentication mode eigrp 1 md5\n ip authentication key-chain eigrp 1 EIGRP_KEY\nor\nrouter eigrp 1\n authentication\
    \ mode md5\n authentication key-chain EIGRP_KEY\nNote: Interface authentication overrides process authentication.\nIS-IS\
    \ Example\ninterface Ethernet2/20\n no switchport\n isis authentication-type md5 level-1\n isis authentication key-chain\
    \ xxxxx level-1\n ip router isis 1\nOSPF Example\ninterface Ethernet2/2\n no switchport\n ip ospf authentication\n ip\
    \ ospf authentication key-chain OSPF_KEY\n ip router ospf 1 area 0.0.0.0\nRIP Example\ninterface Ethernet2/8\n no switchport\n\
    \ ip rip authentication mode md5\n ip rip authentication key-chain RIP_KEY\nIf authentication is not enabled on all routing\
    \ protocols, this is a finding."
  remediation: 'Configure authentication to be enabled for every protocol that affects the routing or

    forwarding tables.

    The example configuration commands below enable OSPF, EIGRP, IS-IS, and BGP

    authentication.

    BGP Example

    SW1(config)# switch bgp nn

    SW1(config-router)# neighbor 10.1.12.2

    SW1(config-router-neighbor)# password xxxxxxxx

    SW1(config-router-neighbor)# end

    EIGRP Example

    Step 1: Configure the key chain.

    SW1(config)# key chain EIGRP_KEY

    SW1(config-keychain)# key 1

    SW1(config-keychain-key)# key-string xxxxxx

    SW1(config-keychain-key)# exit

    SW1(config-keychain)# exit

    Step 2: Apply the key chain to the EIGRP process or each neighbor.

    Authentication for the EIGRP process

    SW1(config)# router eigrp 1

    SW1(config-router)# authentication mode md5

    SW1(config-router)# authentication key-chain XXXXXX

    SW1(config-router)# end

    or

    Authentication for the EIGRP neighbor

    SW1(config)# int e2/21

    SW1(config-if)# ip authentication mode eigrp 1 md5

    SW1(config-if)# ip authentication key-chain eigrp 1 xxxxx

    SW1(config-if)# end

    Note: Interface authentication overrides process authentication.

    IS-IS Example

    Step 1: Configure the key chain.

    SW1(config)# key chain ISIS_KEY

    SW1(config-keychain)# key 1

    SW1(config-keychain-key)# key-string xxxxxx

    SW1(config-keychain-key)# exit

    SW1(config-keychain)# exit

    Step 2: Apply the key chain to each ISIS neighbor.

    SW1(config)# int e2/20

    SW1(config-if)# isis authentication-type md5 level-1

    SW1(config-if)# isis authentication key-chain xxxxx level-1

    OSPF Example

    Step 1: Configure the key chain.

    SW1(config)# key chain OSPF_KEY

    SW1(config-keychain)# key 1

    SW1(config-keychain-key)# key-string xxxxxx

    SW1(config-keychain-key)# exit

    SW1(config-keychain)# exit

    Step 2: Apply the key chain to each OSPF neighbor.

    SW1(config)# int e2/2

    SW1(config-if)# ip ospf authentication

    SW1(config-if)# ip ospf authentication key-chain OSPF_KEY

    RIP Example

    Step 1: Configure the key chain.

    SW1(config)# key chain RIP_KEY

    SW1(config-keychain)# key 1

    SW1(config-keychain-key)# key-string xxxxxx

    SW1(config-keychain-key)# exit

    SW1(config-keychain)# exit

    Step 2: Apply the key chain to each RIP neighbor.

    SW1(config)# int e2/8

    SW1(config-if)# ip rip authentication mode md5

    SW1(config-if)# ip rip authentication key-chain RIP_KEY'
  checks:
  - type: manual_review
    info: "Review the switch configuration. Verify that neighbor switch authentication is enabled\nfor all routing protocols.\
      \ The configuration examples below depicts BGP, EIGRP, IS-IS\nand OSPF authentication.\nBGP Example\nrouter bgp 1\n\
      \ router-id 1.1.1.1\n address-family ipv4 unicast\n neighbor 10.1.12.2 remote-as 2\n password 3 3ec66c90c104ad13\nEIGRP\
      \ Example\nkey chain EIGRP_KEY\n key 1\n key-string xxxxxxx\n…\n…\n…\ninterface Ethernet2/21\n no switchport\n ip router\
      \ eigrp 1\n ip authentication mode eigrp 1 md5\n ip auth"
    severity: medium
- id: '1.3'
  title: CISC-RT-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: The Cisco switch must be configured to use keys with a duration not exceeding 180 days for authenticating routing
    protocol messages. GROUP ID:V-221073 RULE ID:SV-221073r999682
  rationale: If the keys used for routing protocol authentication are guessed, the malicious user could create havoc within
    the network by advertising incorrect routes and redirecting traffic. Some routing protocols allow the use of key chains
    for authentication. A key chain is a set of keys that is used in succession, with each having a lifetime of no more than
    180 days. Changing the keys frequently reduces the risk of them eventually being guessed. Keys cannot be used during time
    periods for which they are not activated. If a time period occurs during which no key is activated, neighbor authentication
    cannot occur, and therefore routing updates will fail. Therefore, ensure that for a given key chain, key activation times
    overlap to avoid any period of time during which no key is activated.
  impact: ''
  references: []
  page_start: 20
  audit_raw: "Review the start times for each key within the configured key chains used for routing\nprotocol authentication\
    \ as shown in the example below:\nkey chain OSPF_KEY\n key 1\n key-string 7 070d2e4e4c10\n accept-lifetime 00:00:00 Oct\
    \ 01 2019 01:05:00 Jan 01 2020\n send-lifetime 00:00:00 Oct 01 2019 23:59:59 Dec 31 2019\n key 2\n key-string 7 0704205e4b07\n\
    \ accept-lifetime 23:55:00 Dec 31 2019 01:05:00 Apr 01 2020\n send-lifetime 00:00:00 Jan 01 2020 23:59:59 Mar 31 2020\n\
    Note: Key chains must be configured to authenticate routing protocol messages as it is\nthe only way to set an expiration.\n\
    If any key has a lifetime of more than 180 days, this is a finding."
  remediation: 'Configure each key used for routing protocol authentication to have a lifetime of no

    more than 180 days as shown in the example below:

    SW1(config)# key chain OSPF_KEY

    SW1(config-keychain)# key 1

    SW1(config-keychain-key)# key-string xxxxxxxxxxxx

    SW1(config-keychain-key)# send-lifetime 00:00:00 Oct 1 2019 23:59:59 Dec 31

    2019

    SW1(config-keychain-key)# accept-lifetime 00:00:00 Oct 1 2019 01:05:00 Jan 1

    2020

    SW1(config-keychain-key)# key 2

    SW1(config-keychain-key)# key-string kxxxxxxxxxxxxx

    SW1(config-keychain-key)# send-lifetime 00:00:00 Jan 1 2020 23:59:59 Mar 31

    2020

    SW1(config-keychain-key)# accept-lifetime 23:55:00 Dec 31 2019 01:05:00 Apr 1

    2020

    SW1(config-keychain-key)# end'
  checks:
  - type: manual_review
    info: "Review the start times for each key within the configured key chains used for routing\nprotocol authentication\
      \ as shown in the example below:\nkey chain OSPF_KEY\n key 1\n key-string 7 070d2e4e4c10\n accept-lifetime 00:00:00\
      \ Oct 01 2019 01:05:00 Jan 01 2020\n send-lifetime 00:00:00 Oct 01 2019 23:59:59 Dec 31 2019\n key 2\n key-string 7\
      \ 0704205e4b07\n accept-lifetime 23:55:00 Dec 31 2019 01:05:00 Apr 01 2020\n send-lifetime 00:00:00 Jan 01 2020 23:59:59\
      \ Mar 31 2020\nNote: Key chains must be configured to a"
    severity: medium
- id: '1.4'
  title: CISC-RT-000040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: The Cisco switch must be configured to use encryption for routing protocol authentication. GROUP ID:V-221074
    RULE ID:CISC-RT-000040
  rationale: A rogue switch could send a fictitious routing update to convince a site's perimeter switch to send traffic to
    an incorrect or even a rogue destination. This diverted traffic could be analyzed to learn confidential information about
    the site's network or used to disrupt the network's ability to communicate with other networks. This is known as a "traffic
    attraction attack" and is prevented by configuring neighbor switch authentication for routing updates. However, using
    clear-text authentication provides little benefit since an attacker can intercept traffic and view the authentication
    key. This would allow the attacker to use the authentication key in an attack. This requirement applies to all IPv4 and
    IPv6 protocols that are used to exchange routing or packet forwarding information; this includes all Interior Gateway
    Protocols (such as OSPF, EIGRP, and IS-IS) and Exterior Gateway Protocols (such as BGP), MPLS-related protocols (such
    as LDP), and multicast-related protocols.
  impact: ''
  references: []
  page_start: 22
  audit_raw: "Review the switch configuration. For every routing protocol that affects the routing or\nforwarding tables,\
    \ verify that neighbor switch authentication is encrypting the\nauthentication key as shown in the examples below:\nBGP\
    \ Example\nrouter bgp 1\n router-id 1.1.1.1\n address-family ipv4 unicast\n neighbor 10.1.12.2 remote-as 2\n password\
    \ 3 3ec66c90c104ad13\nNote: BGP authentication uses MD5.\nEIGRP Example\ninterface Ethernet2/21\n no switchport\n ip router\
    \ eigrp 1\n ip authentication mode eigrp 1 md5\nor\nrouter eigrp 1\n authentication mode md5\nNote: Interface authentication\
    \ overrides process authentication.\nIS-IS Example\ninterface Ethernet2/20\n no switchport\n isis authentication-type\
    \ md5 level-1\nOSPF Example\ninterface Ethernet2/2\n no switchport\n mac-address 0000.0000.002f\n ip ospf authentication\
    \ message-digest\n ip ospf message-digest-key 1 md5 3 3ec66c90c104ad13\nRIP Example\ninterface Ethernet2/8\n no switchport\n\
    \ ip rip authentication mode md5\nIf the routing protocol is not encrypting the authentication key, this is a finding."
  remediation: 'Configure all routing protocol authentications to encrypt the authentication key.

    BGP Example

    SW1(config)#switch bgp nn

    SW1(config-switch)#neighbor x.x.x.x password xxxxxx

    EIGRP Example

    SW1(config)# router eigrp 1

    SW1(config-router)# authentication mode md5

    SW1(config-router)# end

    or

    Authentication for the EIGRP neighbor

    SW1(config)# int e2/21

    SW1(config-if)# ip authentication mode eigrp 1 md5

    SW1(config-if)# end

    Note: Interface authentication overrides process authentication.

    IS-IS Example

    SW1(config)# int e2/20

    SW1(config-if)# isis authentication-type md5 level-1

    OSPF Example

    SW1(config)# int e2/2

    SW1(config-if)# ip ospf authentication message-digest

    SW1(config-if)# ip ospf message-digest-key 1 md5 xxxxxxxxxxx

    RIP Example

    SW1(config)# int e2/8

    SW1(config-if)# ip rip authentication mode md5'
  checks:
  - type: manual_review
    info: "Review the switch configuration. For every routing protocol that affects the routing or\nforwarding tables, verify\
      \ that neighbor switch authentication is encrypting the\nauthentication key as shown in the examples below:\nBGP Example\n\
      router bgp 1\n router-id 1.1.1.1\n address-family ipv4 unicast\n neighbor 10.1.12.2 remote-as 2\n password 3 3ec66c90c104ad13\n\
      Note: BGP authentication uses MD5.\nEIGRP Example\ninterface Ethernet2/21\n no switchport\n ip router eigrp 1\n ip authentication\
      \ mode eigrp 1 md5\nor\nro"
    severity: medium
- id: '1.5'
  title: CISC-RT-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: The Cisco switch must be configured to authenticate all routing protocol messages using NIST-validated FIPS
    198-1 message authentication code algorithm. GROUP ID:V-221075 RULE ID:SV-221075r999684
  rationale: A rogue switch could send a fictitious routing update to convince a site's perimeter switch to send traffic to
    an incorrect or even a rogue destination. This diverted traffic could be analyzed to learn confidential information about
    the site's network or used to disrupt the network's ability to communicate with other networks. This is known as a "traffic
    attraction attack" and is prevented by configuring neighbor switch authentication for routing updates. However, using
    clear-text authentication provides little benefit since an attacker can intercept traffic and view the authentication
    key. This would allow the attacker to use the authentication key in an attack. Since MD5 is vulnerable to "birthday" attacks
    and may be compromised, routing protocol authentication must use FIPS 140-2 validated algorithms and modules to encrypt
    the authentication key. This requirement applies to all IPv4 and IPv6 protocols that are used to exchange routing or packet
    forwarding information; this includes all Interior Gateway Protocols (such as OSPF, EIGRP, and IS-IS) and Exterior Gateway
    Protocols (such as BGP), MPLS-related protocols (such as LDP), and multicast-related protocols.
  impact: ''
  references: []
  page_start: 25
  audit_raw: "Review the switch configuration to verify it is using a NIST-validated FIPS 198-1\nmessage authentication code\
    \ algorithm to authenticate routing protocol messages.\nOSPF Example\nkey chain OSPF_KEY\n key 1\n key-string 7 070d2e4e4c10\n\
    \ accept-lifetime 00:00:00 Oct 01 2019 01:05:00 Jan 01 2020\n send-lifetime 00:00:00 Oct 01 2019 23:59:59 Dec 31 2019\n\
    \ cryptographic-algorithm hmac-sha-256\n key 2\n key-string 7 0704205e4b07\n accept-lifetime 23:55:00 Dec 31 2019 01:05:00\
    \ Apr 01 2020\n send-lifetime 00:00:00 Jan 01 2020 23:59:59 Mar 31 2020\n cryptographic-algorithm hmac-sha-256\n…\n…\n\
    …\ninterface Ethernet2/2\n no switchport\n ip ospf authentication key-chain OSPF_KEY\nNote: BGP, RIP, EIGRP, IS-IS do\
    \ not support any FIPS 198-1 HMAC algorithms.\nIf a NIST-validated FIPS 198-1 message authentication code algorithm is\
    \ not being\nused to authenticate routing protocol messages, this is a finding."
  remediation: 'Configure routing protocol authentication to use a NIST-validated FIPS 198-1 message

    authentication code algorithm as shown in the example below:

    SW1(config)# key chain OSPF_KEY

    SW1(config-keychain)# key 1

    SW1(config-keychain-key)# key-string xxxxxxxxxxxx

    SW1(config-keychain-key)# send-lifetime 00:00:00 Oct 1 2019 23:59:59 Dec 31

    2019

    SW1(config-keychain-key)# accept-lifetime 00:00:00 Oct 1 2019 01:05:00 Jan 1

    2020

    SW1(config-keychain-key)# cryptographic-algorithm hmac-sha-256

    SW1(config-keychain-key)# key 2

    SW1(config-keychain-key)# key-string kxxxxxxxxxxxxx

    SW1(config-keychain-key)# send-lifetime 00:00:00 Jan 1 2020 23:59:59 Mar 31

    2020

    SW1(config-keychain-key)# accept-lifetime 23:55:00 Dec 31 2019 01:05:00 Apr 1

    2020

    SW1(config-keychain-key)# cryptographic-algorithm hmac-sha-256

    SW1(config-keychain-key)# end

    SW1(config)# int e2/2

    SW2(config-if)# ip ospf authentication key-chain OSPF_KEY'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify it is using a NIST-validated FIPS 198-1\nmessage authentication code\
      \ algorithm to authenticate routing protocol messages.\nOSPF Example\nkey chain OSPF_KEY\n key 1\n key-string 7 070d2e4e4c10\n\
      \ accept-lifetime 00:00:00 Oct 01 2019 01:05:00 Jan 01 2020\n send-lifetime 00:00:00 Oct 01 2019 23:59:59 Dec 31 2019\n\
      \ cryptographic-algorithm hmac-sha-256\n key 2\n key-string 7 0704205e4b07\n accept-lifetime 23:55:00 Dec 31 2019 01:05:00\
      \ Apr 01 2020\n send-lifetime 00:00:00 "
    severity: medium
- id: '1.6'
  title: CISC-RT-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: The Cisco switch must be configured to have all inactive layer 3 interfaces disabled. GROUP ID:V-221076 RULE
    ID:SV-221076r999685
  rationale: An inactive interface is rarely monitored or controlled and may expose a network to an undetected attack on that
    interface. Unauthorized personnel with access to the communication facility could gain access to a switch by connecting
    to a configured interface that is not in use. If an interface is no longer used, the configuration must be deleted and
    the interface disabled. For sub-interfaces, delete sub-interfaces that are on inactive interfaces and delete sub-interfaces
    that are themselves inactive. If the sub-interface is no longer necessary for authorized communications, it must be deleted.
  impact: ''
  references: []
  page_start: 28
  audit_raw: "Review the switch configuration and verify that inactive interfaces have been disabled\nas shown below:\ninterface\
    \ Ethernet4/12\n shutdown\n no switchport\ninterface Ethernet4/13\n shutdown\n no switchport\n…\n…\n…\ninterface Ethernet4/48\n\
    \ shutdown\n no switchport\nIf an interface is not being used but is configured or enabled, this is a finding."
  remediation: 'Disable all inactive interfaces as shown below:

    SW1(config)# int e4/1 - 11

    SW1(config-if-range)# shutdown

    SW1(config-if-range)# end'
  checks:
  - type: manual_review
    info: "Review the switch configuration and verify that inactive interfaces have been disabled\nas shown below:\ninterface\
      \ Ethernet4/12\n shutdown\n no switchport\ninterface Ethernet4/13\n shutdown\n no switchport\n…\n…\n…\ninterface Ethernet4/48\n\
      \ shutdown\n no switchport\nIf an interface is not being used but is configured or enabled, this is a finding."
    severity: medium
- id: '1.7'
  title: CISC-RT-000080
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: The Cisco switch must not be configured to have any feature enabled that calls home to the vendor. GROUP ID:V-221078
    RULE ID:SV-221078r999687
  rationale: Call home services will routinely send data such as configuration and diagnostic information to the vendor for
    routine or emergency analysis and troubleshooting. There is a risk that transmission of sensitive data sent to unauthorized
    persons could result in data loss or downtime due to an attack.
  impact: ''
  references: []
  page_start: 30
  audit_raw: "Review the switch configuration to determine if the call home service is enabled as\nshown in the example below:\n\
