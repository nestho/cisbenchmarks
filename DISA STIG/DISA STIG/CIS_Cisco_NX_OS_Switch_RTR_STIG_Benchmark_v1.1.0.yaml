      \ route-target import 13:13\nNote: This requirement is only applicable for MPLS L3VPN implementations.\nIf the wrong\
      \ RD has been configured for any VRF, "
    severity: medium
- id: '1.47'
  title: CISC-RT-000660
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco PE switch providing MPLS Layer 2 Virtual Private Network (L2VPN) services must be configured to
    authenticate targeted Label Distribution Protocol (LDP) sessions used to exchange virtual circuit (VC) information using
    a FIPS-approved message authentication code algorithm. GROUP ID: V-221120 RULE ID: SV-221120r999729'
  rationale: LDP provides the signaling required for setting up and tearing down pseudowires (virtual circuits used to transport
    Layer 2 frames) across an MPLS IP core network. Using a targeted LDP session, each PE switch advertises a virtual circuit
    label mapping that is used as part of the label stack imposed on the frames by the ingress PE switch during packet forwarding.
    Authentication provides protection against spoofed TCP segments that can be introduced into the LDP sessions.
  impact: ''
  references: []
  page_start: 113
  audit_raw: "The Cisco switch is not compliant with this requirement; hence, it is a finding. However,\nthe severity level\
    \ can be downgraded to a category 3 if the switch is configured to\nauthenticate targeted LDP sessions using MD5 as shown\
    \ in the configuration example\nbelow:\nStep 1: Verify that LDP neighbors are authenticating session, advertisement, and\n\
    notification messages as shown in the example below:\nmpls ldp configurations\n password required for LDP_NBR1\n password\
    \ option 1 for LDP_NBR1 key-chain LDP_KEY\n password required for LDP_NBR2\n password option 1 for LDP_NBR2 key-chain\
    \ LDP_KEY\nStep 2: Verify that the neighbors identified in step 1 have the correct prefix.\nip prefix-list LDP_NBR1 permit\
    \ 10.1.22.2/32\nip prefix-list LDP_NBR2 permit 10.1.12.4/32\nIf the switch is not configured to authenticate targeted\
    \ LDP sessions using MD5, this is\na finding. The finding will remain as a CAT II."
  remediation: 'The severity level can be downgraded to a category 3 if the switch is configured to

    authenticate targeted LDP sessions using MD5 as shown in the example below:

    Step 1: Configure a key chain for LDP sessions.

    SW1(config)# key chain LDP_KEY

    SW1(config-keychain)# key 1

    SW1(config-keychain-key)# key-string xxxxxxxxxxxx

    SW1(config-keychain-key)# send-lifetime 00:00:00 Oct 1 2019 23:59:59 Dec 31

    2019

    SW1(config-keychain-key)# accept-lifetime 00:00:00 Oct 1 2019 01:05:00 Jan 1

    2020

    SW1(config-keychain-key)# exit

    SW1(config-keychain)# exit

    Step 2: Configure a prefix lists to identify LDP neighbors.

    SW1(config)# ip prefix-list LDP_NBR1 permit 10.1.22.2/32

    SW1(config)# ip prefix-list LDP_NBR2 permit 10.1.12.4/32

    Step 3: Apply the key chain to the LDP neighbors.

    SW1 (config)# mpls ldp configurations

    SW1 (config-ldp)# password required for LDP_NBR1

    SW1 (config-ldp)# password option 1 for LDP_NBR1 key-chain LDP_KEY

    SW1 (config-ldp)# password required for LDP_NBR2

    SW1 (config-ldp)# password option 1 for LDP_NBR2 key-chain LDP_KEY

    SW1 (config-ldp)# end'
  checks:
  - type: manual_review
    info: "The Cisco switch is not compliant with this requirement; hence, it is a finding. However,\nthe severity level can\
      \ be downgraded to a category 3 if the switch is configured to\nauthenticate targeted LDP sessions using MD5 as shown\
      \ in the configuration example\nbelow:\nStep 1: Verify that LDP neighbors are authenticating session, advertisement,\
      \ and\nnotification messages as shown in the example below:\nmpls ldp configurations\n password required for LDP_NBR1\n\
      \ password option 1 for LDP_NBR1 key-chain LDP_"
    severity: medium
- id: '1.48'
  title: CISC-RT-000670
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco PE switch providing MPLS Virtual Private Wire Service (VPWS) must be configured to have the appropriate
    virtual circuit identification (VC ID) for each attachment circuit. GROUP ID: V-221121 RULE ID: SV-221121r999774'
  rationale: VPWS is an L2VPN technology that provides a virtual circuit between two PE switches to forward Layer 2 frames
    between two customer-edge switches or switches through an MPLS-enabled IP core. The ingress PE switch (virtual circuit
    head-end) encapsulates Ethernet frames inside MPLS packets using label stacking and forwards them across the MPLS network
    to the egress PE switch (virtual circuit tail-end). During a virtual circuit setup, the PE switches exchange VC label
    bindings for the specified VC ID. The VC ID specifies a pseudowire associated with an ingress and egress PE switch and
    the customer-facing attachment circuits. To guarantee that all frames are forwarded onto the correct pseudowire and to
    the correct customer and attachment circuits, it is imperative that the correct VC ID is configured for each attachment
    circuit.
  impact: ''
  references: []
  page_start: 115
  audit_raw: "Verify that the correct and unique VCID has been configured for the appropriate\nattachment circuit. In the\
    \ example below Ethernet2/1 is the CE-facing interface that is\nconfigured for VPWS with the VCID of 55.\nStep 1: Review\
    \ the L2VPN virtual circuits and determine the member attachment circuit\nand pseudowire.\nl2vpn xconnect context VC55\n\
    \ member Ethernet2/1\n member Pseudowire55\nStep 2: Determine the VCID as configured for neighbor and verify the same\
    \ VCID is\ndefined on the remote PE device.\nport-profile type pseudowire MPLS_PROFILE\n encapsulation mpls\ninterface\
    \ Pseudowire55\n neighbor 10.10.22.1 55\n inherit port-profile MPLS_PROFILE\nNote: VPWS is also known as Ethernet over\
    \ MPLS (EoMPLS) and Ethernet Virtual\nCircuit (EVC).\nIf the correct VC ID has not been configured on both switches, this\
    \ is a finding."
  remediation: 'Assign globally unique VC IDs for each virtual circuit and configure the attachment

    circuits with the appropriate VC ID.'
  checks:
  - type: manual_review
    info: "Verify that the correct and unique VCID has been configured for the appropriate\nattachment circuit. In the example\
      \ below Ethernet2/1 is the CE-facing interface that is\nconfigured for VPWS with the VCID of 55.\nStep 1: Review the\
      \ L2VPN virtual circuits and determine the member attachment circuit\nand pseudowire.\nl2vpn xconnect context VC55\n\
      \ member Ethernet2/1\n member Pseudowire55\nStep 2: Determine the VCID as configured for neighbor and verify the same\
      \ VCID is\ndefined on the remote PE device.\nport-"
    severity: medium
- id: '1.49'
  title: CISC-RT-000680
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco PE switch providing Virtual Private LAN Services (VPLS) must be configured to have all attachment
    circuits defined to the virtual forwarding instance (VFI) with the globally unique VPN ID assigned for each customer VLAN.
    GROUP ID: V-221122 RULE ID: SV-221122r999775'
  rationale: VPLS defines an architecture that delivers Ethernet multipoint services over an MPLS network. Customer Layer
    2 frames are forwarded across the MPLS core via pseudowires using IEEE 802.1q Ethernet bridging principles. A pseudowire
    is a virtual bidirectional connection between two attachment circuits (virtual connections between PE and CE switches).
    A pseudowire contains two unidirectional label-switched paths (LSP) between two PE switches. Each MAC virtual forwarding
    table instance (VFI) is interconnected using pseudowires provisioned for the bridge domain, thereby maintaining privacy
    and logical separation between each VPLS bridge domain. The VFI specifies the pseudowires associated with connecting PE
    switches and the customer-facing attachment circuits belonging to a given VLAN. Resembling a Layer 2 switch, the VFI is
    responsible for learning MAC addresses and providing loop-free forwarding of customer traffic to the appropriate end nodes.
    Each VPLS domain is identified by a globally unique VPN ID; hence, VFIs of the same VPLS domain must be configured with
    the same VPN ID on all participating PE switches. To guarantee traffic separation for all customer VLANs and that all
    packets are forwarded to the correct destination, it is imperative that the correct attachment circuits are associated
    with the appropriate VFI and that each VFI is associated to the unique VPN ID assigned to the customer VLAN.
  impact: ''
  references: []
  page_start: 117
  audit_raw: "Step 1: Review the implementation plan and the VPN IDs assigned to customer VLANs\nfor the VPLS deployment.\n\
    Step 2: Review the PE switch configuration to verify that customer attachment circuits\nare associated to the appropriate\
    \ VFI. In the example below, the attached circuit at\ninterface GigabitEthernet3 is associated to VPN ID 110.\nbridge-domain\
    \ 100\n member vfi CUST1_VPLS\n member Ethernet2/2 service instance 1\nl2vpn vfi context CUST1_VPLS\n vpn id 100\nmember\
    \ Pseudowire12\nmember Pseudowire13\n…\n…\n…\ninterface Ethernet2/2\n service instance 1 ethernet\n encapsulation dot1q\
    \ 100\n…\n…\n…\ninterface Pseudowire12\n encapsulation mpls\n neighbor 10.2.2.2 100\ninterface Pseudowire13\n encapsulation\
    \ mpls\n neighbor 10.3.3.3 100\nIf the attachment circuits have not been bound to the VFI configured with the assigned\n\
    VPN ID for each VLAN, this is a finding."
  remediation: 'Assign globally unique VPN IDs for each customer bridge domain using VPLS for

    carrier Ethernet services between multiple sites, and configure the attachment circuits to

    the appropriate VFI.

    Step 1: Configure the pseudowire interfaces with the assigned VC-ID.

    SW1(config)# interface Pseudowire12

    SW1(config-if-pseudowire)# neighbor 10.2.2.2 100

    SW1(config-if-pseudowire)# encapsulation mpls

    SW1(config-pseudowire-mpls)# exit

    SW1(config-if-pseudowire)# exit

    SW1(config)# interface Pseudowire13

    SW1(config-if-pseudowire)# neighbor 10.3.3.3 100

    SW1(config-if-pseudowire)# encapsulation mpls

    SW1(config-pseudowire-mpls)# exit

    SW1(config-if-pseudowire)# exit

    Step 2: Configure the virtual forwarding instance for the pseudowires as shown in the

    example with the assigned VPN ID.

    SW1(config)# l2vpn vfi context CUST1_VPLS

    SW1(config-l2vpn-vfi)# vpn 100

    SW1(config-l2vpn-vfi)# member Pseudowire12

    SW1(config-l2vpn-vfi)# member Pseudowire13

    SW1(config-l2vpn-vfi)# exit

    Step 3: Configure the service instance on the attachment circuit as shown in the

    example below:

    SW1(config)# interface ethernet 2/2

    SW1(config-if)# service instance 1 ethernet

    SW1(config-if-srv)# encapsulation dot1q 100

    SW1(config-if-srv)# exit

    SW1(config-if)# exit

    Step 4: Configure the bridge domain.

    SW1(config)# bridge-domain 100

    SW1(config-bdomain)# member ethernet 2/2 service-instance 1

    SW1(config-bdomain)# member vfi CUST1_VPLS

    SW1(config-bdomain)# end

    Note: The service instance configured on the attachment circuit must map to the service

    instance configured on the bridge domain in order to be bound to the correct bridge

    domain with the VFI that defines the appropriate VPN ID.'
  checks:
  - type: manual_review
    info: "Step 1: Review the implementation plan and the VPN IDs assigned to customer VLANs\nfor the VPLS deployment.\nStep\
      \ 2: Review the PE switch configuration to verify that customer attachment circuits\nare associated to the appropriate\
      \ VFI. In the example below, the attached circuit at\ninterface GigabitEthernet3 is associated to VPN ID 110.\nbridge-domain\
      \ 100\n member vfi CUST1_VPLS\n member Ethernet2/2 service instance 1\nl2vpn vfi context CUST1_VPLS\n vpn id 100\nmember\
      \ Pseudowire12\nmember Pseudowire13\n…\n…\n"
    severity: medium
- id: '1.50'
  title: CISC-RT-000700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco PE switch providing Virtual Private LAN Services (VPLS) must be configured to have traffic storm
    control thresholds on CE-facing interfaces. GROUP ID: V-221123 RULE ID: SV-221123r999732'
  rationale: A traffic storm occurs when packets flood a VPLS bridge, creating excessive traffic and degrading network performance.
    Traffic storm control prevents VPLS bridge disruption by suppressing traffic when the number of packets reaches configured
    threshold levels. Traffic storm control monitors incoming traffic levels on a port and drops traffic when the number of
    packets reaches the configured threshold level during any one-second interval.
  impact: ''
  references: []
  page_start: 120
  audit_raw: "Review the switch configuration to verify that storm control is enabled on CE-facing\ninterfaces deploying VPLS\
    \ as shown in the example below:\ninterface Ethernet2/4\n no shutdown\n no switchport\n storm-control broadcast level\
    \ 40.00\n service instance 1 ethernet\n encapsulation dot1q 100\nIf storm control is not enabled at a minimum for broadcast\
    \ traffic, this is a finding."
  remediation: 'Configure storm control for each CE-facing interface as shown in the example below:

    SW1(config)# int e2/4

    SW1(config-if)# storm-control broadcast level 40

    SW1(config-if)# end'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify that storm control is enabled on CE-facing\ninterfaces deploying VPLS\
      \ as shown in the example below:\ninterface Ethernet2/4\n no shutdown\n no switchport\n storm-control broadcast level\
      \ 40.00\n service instance 1 ethernet\n encapsulation dot1q 100\nIf storm control is not enabled at a minimum for broadcast\
      \ traffic, this is a finding."
    severity: medium
- id: '1.51'
  title: CISC-RT-000710
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco PE switch must be configured to implement Internet Group Management Protocol (IGMP) or Multicast
    Listener Discovery (MLD) snooping for each Virtual Private LAN Services (VPLS) bridge domain. GROUP ID: V-221124 RULE
    ID: SV-221124r999733'
  rationale: IGMP snooping provides a way to constrain multicast traffic at Layer 2. By monitoring the IGMP membership reports
    sent by hosts within the bridge domain, the snooping application can set up Layer 2 multicast forwarding tables to deliver
    traffic only to ports with at least one interested member within the VPLS bridge, thereby significantly reducing the volume
    of multicast traffic that would otherwise flood an entire VPLS bridge domain. The IGMP snooping operation applies to both
    access circuits and pseudowires within a VPLS bridge domain.
  impact: ''
  references: []
  page_start: 122
  audit_raw: "Review the switch configuration to verify that IGMP or MLD snooping has been\nconfigured for IPv4 and IPv6 multicast\
    \ traffic respectively for each VPLS bridge domain.\nThe example below are the steps to verify that IGMP snooping is enabled\
    \ for a VPLS\nbridge domain.\nStep 1: Verify that IGMP snooping is enabled globally. By default, IGMP snooping is\nenabled\
    \ globally; hence, the following command should not be in the switch\nconfiguration: no ip igmp snooping\nStep 2: If IGMP\
    \ snooping is enabled globally, it will also be enabled by default for each\nVPLS bridge domain. Hence, the command “no\
    \ ip igmp snooping” should not be\nconfigured for any VPLS bridge domain as shown in the example below:\nbridge-domain\
    \ 100\n no ip igmp snooping\nIf the switch is not configured to implement IGMP or MLD snooping for each VPLS\nbridge domain,\
    \ this is a finding."
  remediation: 'Configure IGMP or MLD snooping for IPv4 and IPv6 multicast traffic respectively for

    each VPLS bridge domain.

    SW1(config)# bridge-domain 100

    SW1(config-bdomain)# ip igmp snooping

    SW1(config-bdomain)# end'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to verify that IGMP or MLD snooping has been

      configured for IPv4 and IPv6 multicast traffic respectively for each VPLS bridge domain.

      The example below are the steps to verify that IGMP snooping is enabled for a VPLS

      bridge domain.

      Step 1: Verify that IGMP snooping is enabled globally. By default, IGMP snooping is

      enabled globally; hence, the following command should not be in the switch

