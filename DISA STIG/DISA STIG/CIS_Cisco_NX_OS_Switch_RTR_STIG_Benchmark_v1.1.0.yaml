  description: 'The Cisco BGP switch must be configured to reject inbound route advertisements for any prefixes belonging
    to the local autonomous system (AS). GROUP ID: V-221104 RULE ID: SV-221104r999713'
  rationale: Accepting route advertisements belonging to the local AS can result in traffic looping or being black-holed,
    or at a minimum, using a non-optimized path.
  impact: ''
  references: []
  page_start: 81
  audit_raw: "Review the switch configuration to verify that it will reject routes belonging to the local\nAS.\nStep 1: Verify\
    \ a prefix list has been configured containing prefixes belonging to the local\nAS. In the example below x.13.1.0/24 is\
    \ the global address space allocated to the local\nAS.\nip prefix-list PREFIX_FILTER seq 5 deny 0.0.0.0/8 le 32\n…\n…\n\
    …\nip prefix-list PREFIX_FILTER seq 74 deny x.13.1.0/24 le 32\nip prefix-list PREFIX_FILTER seq 75 permit 0.0.0.0/0 ge\
