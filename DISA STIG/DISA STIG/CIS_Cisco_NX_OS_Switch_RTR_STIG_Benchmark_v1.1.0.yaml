      \ mpls ldp sync\nIf the switch is not configured to synchronize IGP and LDP, this is a finding."
    severity: medium
- id: '1.42'
  title: CISC-RT-000610
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The MPLS switch with RSVP-TE enabled must be configured with message pacing to adjust maximum burst and maximum
    number of RSVP messages to an output queue based on the link speed and input queue size of adjacent core switches. GROUP
    ID: V-221115 RULE ID: SV-221115r999724'
  rationale: 'RSVP-TE can be used to perform constraint-based routing when building LSP tunnels within the network core that
    will support QoS and traffic engineering requirements. RSVP-TE is also used to enable MPLS Fast Reroute, a network restoration
    mechanism that will reroute traffic onto a backup LSP in case of a node or link failure along the primary path. When there
    is a disruption in the MPLS core, such as a link flap or switch reboot, the result is a significant amount of RSVP signaling,
    such as "PathErr" and "ResvErr" messages that need to be sent for every LSP using that link. When RSVP messages are sent
    out, they are sent either hop by hop or with the switch alert bit set in the IP header. This means that every switch along
    the path must examine the packet to determine if additional processing is required for these RSVP messages. If there is
    enough signaling traffic in the network, it is possible for an interface to receive more packets for its input queue than
    it can hold, resulting in dropped RSVP messages and hence slower RSVP convergence. Increasing the size of the interface
    input queue can help prevent dropping packets; however, there is still the risk of having a burst of signaling traffic
    that can fill the queue. Solutions to mitigate this risk are RSVP message pacing or refresh reduction to control the rate
    at which RSVP messages are sent. RSVP refresh reduction includes the following features: RSVP message bundling, RSVP Message
    ID to reduce message processing overhead, reliable delivery of RSVP messages using Message ID, and summary refresh to
    reduce the amount of information transmitted every refresh interval.'
  impact: ''
  references: []
  page_start: 103
  audit_raw: "Review the switch configuration to determine if refresh reduction is enabled.\nStep 1: Determine if MPLS TE\
    \ is enabled on any interface as shown in the example\nbelow:\ninterface Ethernet4/47\n mpls traffic-eng tunnels\n mpls\
    \ ip\nStep 2: If MPLS TE is enabled, verify that message pacing is enabled.\nip rsvp\n signaling refresh reduction bundle-max-size\n\
    If the switch with RSVP-TE configured does not have refresh reduction features\nenabled, this is a finding."
  remediation: 'Configure the switch to rate limit RSVP messages per interface as shown in the

    example below. Configure the MPLS switch to synchronize IGP and LDP, minimizing

    packet loss when an IGP adjacency is established prior to LDP peers completing label

    exchange.

    OSPF Example

    SW1(config)# router ospf 1

    SW1(config-switch)# mpls ldp sync

    IS-IS Example

    SW1(config)# router isis

    SW1(config-switch)# mpls ldp sync.

    SW1(config)# ip rsvp

    SW1(config-ip-rsvp)# signaling refresh reduction

    SW1(config-ip-rsvp)# end'
  checks:
  - type: manual_review
    info: "Review the switch configuration to determine if refresh reduction is enabled.\nStep 1: Determine if MPLS TE is\
      \ enabled on any interface as shown in the example\nbelow:\ninterface Ethernet4/47\n mpls traffic-eng tunnels\n mpls\
      \ ip\nStep 2: If MPLS TE is enabled, verify that message pacing is enabled.\nip rsvp\n signaling refresh reduction bundle-max-size\n\
      If the switch with RSVP-TE configured does not have refresh reduction features\nenabled, this is a finding."
    severity: medium
- id: '1.43'
  title: CISC-RT-000620
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco MPLS switch must be configured to have TTL Propagation disabled. GROUP ID: V-221116 RULE ID: SV-221116r999725'
  rationale: The head end of the label-switched path (LSP), the label edge switch (LER) will decrement the IP packet's time-to-live
    (TTL) value by one and then copy the value to the MPLS TTL field. At each label-switched switch (LSR) hop, the MPLS TTL
    value is decremented by one. The MPLS switch that pops the label (either the penultimate LSR or the egress LER) will copy
    the packet's MPLS TTL value to the IP TTL field and decrement it by one. This TTL propagation is the default behavior.
    Because the MPLS TTL is propagated from the IP TTL, a traceroute will list every hop in the path, be it routed or label
    switched, thereby exposing core nodes. With TTL propagation disabled, LER decrements the IP packet's TTL value by one
    and then places a value of 255 in the packet's MPLS TTL field, which is then decremented by one as the packet passes through
    each LSR in the MPLS core. Because the MPLS TTL never drops to zero, none of the LSP hops triggers an ICMP TTL exceeded
    message, and consequently, these hops are not recorded in a traceroute. Hence, nodes within the MPLS core cannot be discovered
    by an attacker.
  impact: ''
  references: []
  page_start: 105
  audit_raw: 'Review the switch configuration to verify that TTL propagation is disabled as shown in

    the example below:

    no mpls ip propagate-ttl

    If the MPLS switch is not configured to disable TTL propagation, this is a finding.'
  remediation: 'Configure the MPLS switch to disable TTL propagation as shown in the example below:

    SW1(config)# no mpls ip propagate-ttl'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to verify that TTL propagation is disabled as shown in

      the example below:

      no mpls ip propagate-ttl

      If the MPLS switch is not configured to disable TTL propagation, this is a finding.'
    severity: medium
