    info: "Review the PE switch configuration to determine if a MAC address limit has been set for\neach VPLS bridge domain.\n\
      bridge-domain 100\n mac limit maximum addresses nnnnn\nIf a limit has not been configured, this is a finding."
    severity: medium
- id: '1.53'
  title: CISC-RT-000730
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco PE switch must be configured to block any traffic that is destined to the IP core infrastructure.
    GROUP ID: V-221126 RULE ID: SV-221126r999735'
  rationale: IP/MPLS networks providing VPN and transit services must provide, at the least, the same level of protection
    against denial-of-service (DoS) attacks and intrusions as Layer 2 networks. Although the IP core network elements are
    hidden, security should never rely entirely on obscurity. IP addresses can be guessed. Core network elements must not
    be accessible from any external host. Protecting the core from any attack is vital for the integrity and privacy of customer
    traffic as well as the availability of transit services. A compromise of the IP core can result in an outage or, at a
    minimum, non-optimized forwarding of customer traffic. Protecting the core from an outside attack also prevents attackers
    from using the core to attack any customer. Hence, it is imperative that all switches at the edge deny traffic destined
    to any address belonging to the IP core infrastructure.
  impact: ''
  references: []
  page_start: 126
  audit_raw: "Step 1: Review the switch configuration to verify that an ingress ACL is applied to all\nexternal or CE-facing\
    \ interfaces.\ninterface Ethernet1/2\n ip address x.1.12.2/30\n ip access-group BLOCK_TO_CORE in\nStep 2: Verify that\
    \ the ingress ACL discards and logs packets destined to the IP core\naddress space.\nip access-list BLOCK_TO_CORE\n deny\
    \ ip any 10.1.x.0 0.0.255.255 log\n permit ip any any\nNote: Internet Control Message Protocol (ICMP) echo requests and\
    \ traceroutes will be\nallowed to the edge from external adjacent neighbors.\nIf the PE switch is not configured to block\
    \ any traffic with a destination address assigned\nto the IP core infrastructure, this is a finding."
  remediation: 'Configure protection for the IP core to be implemented at the edges by blocking any

    traffic with a destination address assigned to the IP core infrastructure.

    Step 1: Configure an ingress ACL to discard and log packets destined to the IP core

    address space.

    SW1(config)# ip access-list BLOCK_TO_CORE

    SW1(config-acl)# deny ip any 10.1.x.0 0.0.255.255 log

    SW1(config-acl)# exit

    Step 2: Apply the ACL inbound to all external or CE-facing interfaces.

    SW1(config)#int e1/2

    SW1(config-if)# ip access-group BLOCK_TO_CORE in

    SW1(config-if)# end'
  checks:
  - type: manual_review
    info: "Step 1: Review the switch configuration to verify that an ingress ACL is applied to all\nexternal or CE-facing\
      \ interfaces.\ninterface Ethernet1/2\n ip address x.1.12.2/30\n ip access-group BLOCK_TO_CORE in\nStep 2: Verify that\
      \ the ingress ACL discards and logs packets destined to the IP core\naddress space.\nip access-list BLOCK_TO_CORE\n\
      \ deny ip any 10.1.x.0 0.0.255.255 log\n permit ip any any\nNote: Internet Control Message Protocol (ICMP) echo requests\
      \ and traceroutes will be\nallowed to the edge from e"
    severity: medium
- id: '1.54'
  title: CISC-RT-000740
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco PE switch must be configured with Unicast Reverse Path Forwarding (uRPF) loose mode enabled on all
    CE-facing interfaces. GROUP ID: V-221127 RULE ID: SV-221127r999736'
  rationale: The uRPF feature is a defense against spoofing and denial-of-service (DoS) attacks by verifying if the source
    address of any ingress packet is reachable. To mitigate attacks that rely on forged source addresses, all provider edge
    switches must enable uRPF loose mode to guarantee that all packets received from a CE switch contain source addresses
    that are in the route table.
  impact: ''
  references: []
  page_start: 128
  audit_raw: "Review the switch configuration to determine if uRPF loose mode is enabled on all CEfacing interfaces.\ninterface\
    \ Ethernet1/2\n ip address x.1.12.2/30\n ip access-group BLOCK_TO_CORE in\n ip verify unicast source reachable-via any\n\
    If uRPF loose mode is not enabled on all CE-facing interfaces, this is a finding."
  remediation: 'Configure uRPF loose mode on all CE-facing interfaces as shown in the example

    below:

    SW1(config)# int e1/2

    SW1(config-if)# ip verify unicast source reachable-via any

    SW1(config-if)# end'
  checks:
  - type: manual_review
    info: "Review the switch configuration to determine if uRPF loose mode is enabled on all CEfacing interfaces.\ninterface\
      \ Ethernet1/2\n ip address x.1.12.2/30\n ip access-group BLOCK_TO_CORE in\n ip verify unicast source reachable-via any\n\
      If uRPF loose mode is not enabled on all CE-facing interfaces, this is a finding."
    severity: medium
- id: '1.55'
  title: CISC-RT-000750
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco PE switch must be configured to ignore or drop all packets with any IP options. GROUP ID: V-221128
    RULE ID: SV-221128r999737'
  rationale: Packets with IP options are not fast-switched and therefore must be punted to the switch processor. Hackers who
    initiate denial-of-service (DoS) attacks on switches commonly send large streams of packets with IP options. Dropping
    the packets with IP options reduces the load of IP options packets on the switch. The end result is a reduction in the
    effects of the DoS attack on the switch and on downstream switches.
  impact: ''
  references: []
  page_start: 129
  audit_raw: 'In Cisco NX-OS, all packets with any header option other than the “source-route”

    header option are dropped. By default, ipv4 source routing is enabled. Verify that source

    routing is disabled via the following command:

    no ip source-route

    If the switch is not configured to drop all packets with IP option source routing, this is a

    finding.'
  remediation: 'Configure the switch to drop all packets with IP option source routing.

    SW1(config)# no ip source-route

    SW1(config)# end'
  checks:
  - type: manual_review
    info: 'In Cisco NX-OS, all packets with any header option other than the “source-route”

      header option are dropped. By default, ipv4 source routing is enabled. Verify that source

      routing is disabled via the following command:

      no ip source-route

      If the switch is not configured to drop all packets with IP option source routing, this is a

      finding.'
    severity: medium
- id: '1.56'
  title: CISC-RT-000760
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco PE switch must be configured to enforce a Quality-of-Service (QoS) policy to provide preferred treatment
    for mission-critical applications. GROUP ID: V-221129 RULE ID: SV-221129r999738'
  rationale: Different applications have unique requirements and toleration levels for delay, jitter, bandwidth, packet loss,
    and availability. To manage the multitude of applications and services, a network requires a QoS framework to differentiate
    traffic and provide a method to manage network congestion. The Differentiated Services Model (DiffServ) is based on per-hop
    behavior by categorizing traffic into different classes and enabling each node to enforce a forwarding treatment to each
    packet as dictated by a policy. Packet markings such as IP Precedence and its successor, Differentiated Services Code
    Points (DSCP), were defined along with specific per-hop behaviors for key traffic types to enable a scalable QoS solution.
    DiffServ QoS categorizes network traffic, prioritizes it according to its relative importance, and provides priority treatment
    based on the classification. It is imperative that end-to-end QoS is implemented within the IP core network to provide
    preferred treatment for mission-critical applications.
  impact: ''
  references: []
  page_start: 130
  audit_raw: "Review the switch configuration and verify that a QoS policy has been configured to\nprovide preferred treatment\
    \ for mission-critical applications.\nStep 1: Verify that the class-maps are configured to match on DSCP values as shown\n\
    in the configuration example below:\nclass-map match-all C2_VOICE\n match ip dscp af47\nclass-map match-all VOICE\n match\
    \ ip dscp ef\nclass-map match-all VIDEO\n match ip dscp af41\nclass-map match-all CONTROL_PLANE\n match ip dscp cs6\n\
    class-map match-all PREFERRED_DATA\n match ip dscp af33\nStep 2: Verify that the policy map reserves the bandwidth for\
    \ each traffic type as shown\nin the example below:\npolicy-map QOS_POLICY\nclass C2_VOICE\n priority percent 10\n class\
    \ VOICE\n priority percent 15\n class VIDEO\n bandwidth percent 25\nclass CONTROL_PLANE\n priority percent 10\n class\
    \ PREFERRED_DATA\n bandwidth percent 25\n class class-default\n bandwidth percent 15\nStep 3: Verify that an output service\
    \ policy is bound to all interface as shown in the\nconfiguration example below:\ninterface Ethernet1/1\n ip address 10.1.15.1/30\n\
    \ service-policy output QOS_POLICY\n!\ninterface Ethernet1/2\n ip address 10.1.15.4/30\n service-policy output QOS_POLICY\n\
    Note: Enclaves must mark or re-mark their traffic to be consistent with the DoDIN\nbackbone admission criteria to gain\
    \ the appropriate level of service. A general DiffServ\nprinciple is to mark or trust traffic as close to the source as\
    \ administratively and\ntechnically possible. However, certain traffic types might need to be re-marked before\nhandoff\
    \ to the DoDIN backbone to gain admission to the correct class. If such remarking is required, it is recommended that\
    \ the re-marking be performed at the CE\negress edge.\nNote: The GTP QOS document (GTP-0009) can be downloaded via the\
    \ following link:\nhttps://intellipedia.intelink.gov/wiki/Portal:GIG_Technical_Guidance/GTG_GTPs/GTP_D\nevelopment_List\n\
    If the switch is not configured to enforce a QoS policy in accordance with the QoS GIG\nTechnical Profile, this is a finding."
  remediation: 'Configure to enforce a QoS policy to provide preferred treatment for mission-critical

    applications.

    Step 1: Configure class-maps to match on DSCP values as shown in the configuration

    example below:

    SW1(config-cmap)# class-map match-all C2_VOICE

    SW1(config-cmap)# match ip dscp 47

    SW1(config-cmap)# class-map match-all VOICE

    SW1(config-cmap)# match ip dscp ef

    SW1(config-cmap)# class-map match-all VIDEO

    SW1(config-cmap)# match ip dscp af41

    SW1(config-cmap)# class-map match-all CONTROL_PLANE

    SW1(config-cmap)# match ip dscp cs6

    SW1(config-cmap)# class-map match-all PREFERRED_DATA

    SW1(config-cmap)# match ip dscp af33

    SW1(config-cmap)# exit

    Step 2: Configure a policy map to be applied to the interfaces that reserves the

    bandwidth for each traffic type as shown in the example below:

    SW1(config)# policy-map QOS_POLICY

    SW1(config-pmap-c)# class C2_VOICE

    SW1(config-pmap-c)# priority percent 10

    SW1(config-pmap-c)# class VOICE

    SW1(config-pmap-c)# priority percent 15

    SW1(config-pmap-c)# class VIDEO

    SW1(config-pmap-c)# bandwidth percent 25

    SW1(config-pmap)# class CONTROL_PLANE

    SW1(config-pmap-c)# priority percent 10

    SW1(config-pmap-c)# class PREFERRED_DATA

    SW1(config-pmap-c)# bandwidth percent 25

    SW1(config-pmap-c)# class class-default

    SW1(config-pmap-c)# bandwidth percent 15

    SW1(config-pmap-c)# exit

    SW1(config-pmap)# exit

    Step 3: Apply the output service policy to all interfaces as shown in the configuration

    example below:

    SW1(config)# int e1/1

    SW1(config-if)# service-policy output QOS_POLICY

    SW1(config-if)# exit

    SW1(config)# int e1/2

    SW1(config-if)# service-policy output QOS_POLICY

    SW1(config-if)# end'
  checks:
  - type: manual_review
    info: "Review the switch configuration and verify that a QoS policy has been configured to\nprovide preferred treatment\
      \ for mission-critical applications.\nStep 1: Verify that the class-maps are configured to match on DSCP values as shown\n\
      in the configuration example below:\nclass-map match-all C2_VOICE\n match ip dscp af47\nclass-map match-all VOICE\n\
      \ match ip dscp ef\nclass-map match-all VIDEO\n match ip dscp af41\nclass-map match-all CONTROL_PLANE\n match ip dscp\
      \ cs6\nclass-map match-all PREFERRED_DATA\n match "
    severity: medium
