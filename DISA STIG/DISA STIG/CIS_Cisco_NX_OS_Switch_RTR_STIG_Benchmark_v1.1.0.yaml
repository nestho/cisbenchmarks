- id: '1.39'
  title: CISC-RT-000580
  scoring: scored
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco BGP switch must be configured to use its loopback address as the source address for iBGP peering
    sessions. GROUP ID: V-221112 RULE ID: SV-221112r999769'
  rationale: Using a loopback address as the source address offers a multitude of uses for security, access, management, and
    scalability of the BGP switches. It is easier to construct appropriate ingress filters for switch management plane traffic
    destined to the network management subnet since the source addresses will be from the range used for loopback interfaces
    instead of a larger range of addresses used for physical interfaces. Log information recorded by authentication and syslog
    servers will record the switch’s loopback address instead of the numerous physical interface addresses. When the loopback
    address is used as the source for eBGP peering, the BGP session will be harder to hijack since the source address to be
    used is not known globally, making it more difficult for a hacker to spoof an eBGP neighbor. By using traceroute, a hacker
    can easily determine the addresses for an eBGP speaker when the IP address of an external interface is used as the source
    address. The switches within the iBGP domain should also use loopback addresses as the source address when establishing
    BGP sessions.
  impact: ''
  references: []
  page_start: 97
  audit_raw: "Step 1: Review the switch configuration to verify that a loopback address has been\nconfigured.\ninterface loopback0\n\
    \ ip address 10.1.1.1/32\nStep 2: Verify that the loopback interface is used as the source address for all iBGP\nsessions.\n\
    router bgp xx\n router-id 10.1.1.1\n address-family ipv4 unicast\n neighbor 10.1.12.2 remote-as xx\n password 3 7b07d1b3023056a9\n\
    \ update-source loopback0\nIf the switch does not use its loopback address as the source address for all iBGP\nsessions,\
    \ this is a finding."
  remediation: 'Configure the switch to use its loopback address as the source address for all iBGP

    peering.

    SW1(config)# router bgp xx

    SW1(config-router)# neighbor 10.1.12.2

    SW1(config-router-neighbor)# update-source lo0

    SW1(config-router-neighbor)# end'
  checks:
  - type: manual_review
    info: "Step 1: Review the switch configuration to verify that a loopback address has been\nconfigured.\ninterface loopback0\n\
