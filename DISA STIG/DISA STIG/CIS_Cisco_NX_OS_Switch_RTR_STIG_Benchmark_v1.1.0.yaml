  description: 'The Cisco perimeter switch must be configured to enforce approved authorizations for controlling the flow
    of information between interconnected networks in accordance with applicable policy. Group ID: V-221088 Rule ID: SV-221088r999697'
  rationale: Information flow control regulates authorized information to travel within a network and between interconnected
    networks. Controlling the flow of network traffic is critical so it does not introduce any unacceptable risk to the network
    infrastructure or data. An example of a flow control restriction is blocking outside traffic claiming to be from within
    the organization. For most switches, internal information flow control is a product of system design.
