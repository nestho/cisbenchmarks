      interface Ethern'
    severity: medium
- id: '1.16'
  title: CISC-RT-000260
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco perimeter switch must be configured to only allow incoming communications from authorized sources
    to be routed to authorized destinations. Group ID: V-221089 Rule ID: SV-221089r999698'
  rationale: Unrestricted traffic may contain malicious traffic that poses a threat to an enclave or to other connected networks.
    Additionally, unrestricted traffic may transit a network, which uses bandwidth and other resources. Traffic can be restricted
    directly by an access control list (ACL), which is a firewall function, or by Policy Routing. Policy Routing is a technique
    used to make routing decisions based on a number of different criteria other than just the destination network, including
    source or destination network, source or destination address, source or destination port, protocol, packet size, and packet
    classification. This overrides the switch's normal routing procedures used to control the specific paths of network traffic.
    It is normally used for traffic engineering but can also be used to meet security requirements; for example, traffic that
    is not allowed can be routed to the Null0 or discard interface. Policy Routing can also be used to control which prefixes
    appear in the routing table. This requirement is intended to allow network administrators the flexibility to use whatever
    technique is most effective.
  impact: ''
  references: []
  page_start: 46
  audit_raw: "Review the switch configuration to determine if the switch allows only incoming\ncommunications from authorized\
    \ sources to be routed to authorized destinations. The\nhypothetical example below allows inbound NTP from server x.1.12.9\
    \ only to host\nx.12.1.21.\nip access-list EXTERNAL_ACL\n 10 permit tcp any any established\n 20 permit tcp x.11.1.1/32\
    \ eq bgp x.11.1.2/32\n 30 permit tcp x.11.1.1/32 x.11.1.2/32 eq bgp\n 40 permit icmp x.11.1.1/32 x.11.1.2/32 echo\n 50\
    \ permit icmp x.11.1.1/32 x.11.1.2/32 echo-reply\n 60 permit tcp any x.11.2.3/32 eq www\n 70 permit udp x.12.1.9/32 x.12.1.21/32\
    \ eq ntp\n…\n …\n …\n90 deny ip any any log\nIf the switch does not restrict incoming communications to allow only authorized\
    \ sources\nand destinations, this is a finding."
  remediation: 'Configure the switch to allow only incoming communications from authorized sources to

    be routed to authorized destinations.

    SW2(config)# ip access-list EXTERNAL_ACL

    SW2(config-acl)# permit tcp any any established

    …

    …

    …

    SW2(config-acl)# permit udp host x.12.1.9 host x.12.1.21 eq ntp

    SW2(config-acl)# deny ip any any log

    SW2(config-acl)# end'
  checks:
  - type: manual_review
    info: "Review the switch configuration to determine if the switch allows only incoming\ncommunications from authorized\
      \ sources to be routed to authorized destinations. The\nhypothetical example below allows inbound NTP from server x.1.12.9\
      \ only to host\nx.12.1.21.\nip access-list EXTERNAL_ACL\n 10 permit tcp any any established\n 20 permit tcp x.11.1.1/32\
      \ eq bgp x.11.1.2/32\n 30 permit tcp x.11.1.1/32 x.11.1.2/32 eq bgp\n 40 permit icmp x.11.1.1/32 x.11.1.2/32 echo\n\
      \ 50 permit icmp x.11.1.1/32 x.11.1.2/32 echo-"
    severity: medium
- id: '1.17'
  title: CISC-RT-000270
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco perimeter switch must be configured to block inbound packets with source Bogon IP address prefixes.
    GROUP ID: V-221090 RULE ID: SV-221090r999699'
  rationale: Packets with Bogon IP source addresses should never be allowed to traverse the IP core. Bogon IP networks are
    RFC1918 addresses or address blocks that have never been assigned by the IANA or have been reserved.
  impact: ''
  references: []
  page_start: 48
  audit_raw: "Review the switch configuration to verify that an ingress ACL applied to all external\ninterfaces is blocking\
    \ packets with Bogon source addresses.\nStep 1: Verify an ACL has been configured containing the current Bogon prefixes\
    \ as\nshown in the example below:\nip access-list EXTERNAL_ACL\n 10 deny ip 0.0.0.0/8 any log\n 20 deny ip 10.0.0.0/8\
    \ any log\n 30 deny ip 100.64.0.0/10 any log\n 40 deny ip 127.0.0.0/8 any log\n 50 deny ip 169.254.0.0/16 any log\n 60\
    \ deny ip 172.16.0.0/12 any log\n 70 deny ip 192.0.0.0/24 any log\n 80 deny ip 192.0.2.0/24 any log\n 90 deny ip 192.168.0.0/16\
    \ any log\n 100 deny ip 198.18.0.0/15 any log\n 110 deny ip 198.51.100.0/24 any log\n 120 deny ip 203.0.113.0/24 any log\n\
    \ 130 deny ip 224.0.0.0/3 any log\n 140 permit tcp any any established\n 150 permit …\n …\n …\n …\n210 deny ip any any\
    \ log\nStep 2: Verify that the inbound ACL applied to all external interfaces will block all traffic\nfrom Bogon source\
    \ addresses.\ninterface Ethernet2/2\n description link to DISN\n no switchport\n ip access-group EXTERNAL_ACL in\nIf the\
    \ switch is not configured to block inbound packets with source Bogon IP address\nprefixes, this is a finding."
  remediation: 'Configure the perimeter to block inbound packets with Bogon source addresses.

    Step 1: Configure an ACL containing the current Bogon prefixes as shown below:

    SW1(config)# ip access-list EXTERNAL_ACL

    SW1(config-acl)# deny ip 0.0.0.0 0.255.255.255 any log

    SW1(config-acl)# deny ip 10.0.0.0 0.255.255.255 any log

    SW1(config-acl)# deny ip 100.64.0.0 0.63.255.255 any log

