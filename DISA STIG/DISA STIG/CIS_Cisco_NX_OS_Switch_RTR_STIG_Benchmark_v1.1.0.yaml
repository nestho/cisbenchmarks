- id: '1.46'
  title: CISC-RT-000650
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco PE switch must be configured to have each VRF with the appropriate Route Distinguisher (RD). GROUP
    ID: V-221119 RULE ID: SV-221119r999773'
  rationale: An RD provides uniqueness to the customer address spaces within the MPLS L3VPN infrastructure. The concept of
    the VPN-IPv4 and VPN-IPv6 address families consists of the RD prepended before the IP address. Hence, if the same IP prefix
    is used in several different L3VPNs, it is possible for BGP to carry several completely different routes for that prefix,
    one for each VPN. Since VPN-IPv4 addresses and IPv4 addresses are different address families, BGP never treats them as
    comparable addresses. The purpose of the RD is to create distinct routes for common IPv4 address prefixes. On any given
    PE switch, a single RD can define a VRF in which the entire address space may be used independently, regardless of the
    makeup of other VPN address spaces. Hence, it is imperative that a unique RD is assigned to each L3VPN and that the proper
    RD is configured for each VRF.
  impact: ''
  references: []
  page_start: 111
  audit_raw: "Review the design plan for MPLS/L3VPN to determine what RD has been assigned for\neach VRF. Review the switch\
    \ configuration and verify that the correct RD is configured\nfor each VRF. In the example below, route distinguisher\
    \ 13:13 has been configured for\ncustomer 1.\nvrf context CUST1\n rd 13:13\n address-family ipv4 unicast\n route-target\
    \ export 13:13\n route-target import 13:13\nNote: This requirement is only applicable for MPLS L3VPN implementations.\n\
    If the wrong RD has been configured for any VRF, this is a finding."
  remediation: 'Configure the correct RD for each VRF.

    SW1(config)# vrf context CUST1

    SW1(config-vrf)# rd 13:13

    SW1(config-vrf)# end'
  checks:
