  rationale: The current multicast paradigm can let any host join any multicast group at any time by sending an IGMP or MLD
    membership report to the DR. In a Protocol Independent Multicast (PIM) Sparse Mode network, the DR will send a PIM Join
    message for the group to the RP. Without any form of admission control, this can pose a security risk to the entire multicast
    domain, specifically the multicast switches along the shared tree from the DR to the RP that must maintain the mroute
    state information for each group join request. Hence, it is imperative that the DR is configured to limit the number of
    mroute state information that must be maintained to mitigate the risk of IGMP or MLD flooding.
  impact: ''
  references: []
  page_start: 157
  audit_raw: "Review the DR configuration to verify that it is limiting the number of mroute states via\nIGMP or MLD.\nVerify\
    \ IGMP state limits have been configured on all applicable interfaces as shown in\nthe example below:\ninterface Ethernet2/4\n\
    \ no switchport\n ip address 10.2.22.3/24\n ip pim sparse-mode\n ip igmp version 3\n ip igmp state-limit nnn\nIf the DR\
    \ is not limiting multicast join requests via IGMP or MLD on all applicable\ninterfaces, this is a finding."
  remediation: 'Configure the DR on a global or interface basis to limit the number of mroute states

    resulting from IGMP or MLD membership reports.

    SW1(config)# int e2/4

    SW1(config-if)# ip igmp state-limit 44

    SW1(config-if)# end'
  checks:
  - type: manual_review
    info: "Review the DR configuration to verify that it is limiting the number of mroute states via\nIGMP or MLD.\nVerify\
      \ IGMP state limits have been configured on all applicable interfaces as shown in\nthe example below:\ninterface Ethernet2/4\n\
      \ no switchport\n ip address 10.2.22.3/24\n ip pim sparse-mode\n ip igmp version 3\n ip igmp state-limit nnn\nIf the\
      \ DR is not limiting multicast join requests via IGMP or MLD on all applicable\ninterfaces, this is a finding."
    severity: medium
- id: '1.68'
  title: CISC-RT-000890
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco multicast Designated switch (DR) must be configured to set the shortest-path tree (SPT) threshold
    to infinity to minimalize source-group (S, G) state within the multicast topology where Any Source Multicast (ASM) is
    deployed. GROUP ID: V-221141 RULE ID: SV-221141r999750'
  rationale: ASM can have many sources for the same groups (many-to-many). For many receivers, the path via the RP may not
    be ideal compared with the shortest path from the source to the receiver. By default, the last-hop switch will initiate
    a switch from the shared tree to a source-specific SPT to obtain lower latencies. This is accomplished by the last-hop
    switch sending an (S, G) Protocol Independent Multicast (PIM) Join toward S (the source). When the last-hop switch begins
    to receive traffic for the group from the source via the SPT, it will send a PIM Prune message to the RP for the (S, G).
    The RP will then send a Prune message toward the source. The SPT switchover becomes a scaling issue for large multicast
    topologies that have many receivers and many sources for many groups because (S, G) entries require more memory than (*,
    G). Hence, it is imperative to minimize the amount of (S, G) state to be maintained by increasing the threshold that determines
    when the SPT switchover occurs.
  impact: ''
  references: []
  page_start: 159
  audit_raw: 'Review the DR configuration to verify that the SPT switchover threshold is set to infinity

    (never switch over).

    ip pim spt-threshold infinity group-list prefix-list SPT_GROUPS

    Note: The default behavior is to join the SPT immediately upon the first data packet it

    receives.

    If the DR is not configured set SPT threshold to infinity to minimalize (S, G) state, this is

    a finding.'
  remediation: 'Configure the DR to increase the SPT threshold or set it to infinity to minimalize (S, G)

    state within the multicast topology where ASM is deployed.

    Step 1: Configure a prefix list or route map to specify the ASM groups. The example

    below includes all global ASM groups.

    SW1(config)# ip prefix-list SPT_GROUPS permit 233.0.0.0/8

    Step 2: Configure the SPT threshold to infinity.

    SW1(config)# ip pim spt-threshold infinity group prefix-list SPT_GROUPS

    SW1(config)# end'
  checks:
  - type: manual_review
    info: 'Review the DR configuration to verify that the SPT switchover threshold is set to infinity

      (never switch over).

      ip pim spt-threshold infinity group-list prefix-list SPT_GROUPS

      Note: The default behavior is to join the SPT immediately upon the first data packet it

      receives.

      If the DR is not configured set SPT threshold to infinity to minimalize (S, G) state, this is

      a finding.'
    severity: medium
