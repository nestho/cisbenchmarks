    \ 60 permit pim x.1.28.2/32 x.1.28.8/32\n…\n …\n …\n120 deny ip any any log\nNote: MSDP connections are via TCP port 639.\n\
    If the switch is not configured to only accept MSDP packets from known MSDP peers,\nthis is a finding."
  remediation: 'Configure the receive path or interface ACLs to only accept MSDP packets from known

