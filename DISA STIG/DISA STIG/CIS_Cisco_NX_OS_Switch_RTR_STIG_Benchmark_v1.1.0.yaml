- id: '1.41'
  title: CISC-RT-000600
  scoring: scored
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco MPLS switch must be configured to synchronize Interior Gateway Protocol (IGP) and LDP to minimize
    packet loss when an IGP adjacency is established prior to LDP peers completing label exchange. GROUP ID: V-221114 RULE
    ID: SV-221114r999723'
  rationale: Packet loss can occur when an IGP adjacency is established and the switch begins forwarding packets using the
    new adjacency before the LDP label exchange completes between the peers on that link. Packet loss can also occur if an
    LDP session closes and the switch continues to forward traffic using the link associated with the LDP peer rather than
    an alternate pathway with a fully synchronized LDP session. The MPLS LDP-IGP Synchronization feature provides a means
    to synchronize LDP with OSPF or IS-IS to minimize MPLS packet loss. When an IGP adjacency is established on a link but
    LDPIGP synchronization is not yet achieved or is lost, the IGP will advertise the max-metric on that link.
  impact: ''
  references: []
  page_start: 101
  audit_raw: "Review the switch OSPF or IS-IS configuration and verify that LDP will synchronize with\nthe link-state routing\
    \ protocol as shown in the example below:\nOSPF Example\nrouter ospf 1\n mpls ldp sync\nIS-IS Example\nrouter isis\n mpls\
    \ ldp sync\nIf the switch is not configured to synchronize IGP and LDP, this is a finding."
  remediation: 'Configure the MPLS switch to synchronize IGP and LDP, minimizing packet loss when

    an IGP adjacency is established prior to LDP peers completing label exchange.

    OSPF Example

    SW1(config)# router ospf 1

    SW1(config-switch)# mpls ldp sync

    IS-IS Example

    SW1(config)# router isis

    SW1(config-switch)# mpls ldp sync'
  checks:
  - type: manual_review
