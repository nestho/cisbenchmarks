  audit_raw: "Review the configuration of the DR to verify that it is filtering IGMP or MLD Membership\nReport messages, allowing\
    \ hosts to join only those groups that have been approved.\nStep 1: Verify that all host facing interfaces are configured\
    \ to filter IGMP Membership\nReport messages (IGMP joins) as shown in the example below:\ninterface Ethernet2/4\n no switchport\n\
    \ ip address 10.2.22.3/24 ip pim sparse-mode\n ip igmp version 3\n ip igmp report-policy ALLOWED_GROUPS\nStep 2: Verify\
    \ that the report policy denies unauthorized groups or permits only\nauthorized groups.\nroute-map ALLOWED_GROUPS permit\
    \ 10\n match ip multicast group 233.1.1.0/24\nroute-map ALLOWED_GROUPS permit 20\n match ip multicast group 233.1.1.0/32\n\
