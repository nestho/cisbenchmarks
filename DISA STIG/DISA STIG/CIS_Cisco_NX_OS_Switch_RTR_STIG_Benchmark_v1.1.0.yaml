    \ switchport\n ip access-group EXTERNAL_ACL in\nStep 2. Review the inbound ACL to verify that it is filtering traffic\
    \ in accordance with\nDoD 8551.1.\nip access-list EXTERNAL_ACL\n 10 permit tcp any any established\n 20 permit tcp x.11.1.1/32\
    \ eq bgp x.11.1.2/32\n 30 permit tcp x.11.1.1/32 x.11.1.2/32 eq bgp\n 40 permit icmp x.11.1.1/32 x.11.1.2/32 echo\n 50\
    \ permit icmp x.11.1.1/32 x.11.1.2/32 echo-reply\n 60 permit tcp any x.11.2.3/32 eq www\n 70 permit udp x.12.1.9/32 x.12.1.21/32\
    \ eq ntp\n…\n … < must be in accordance with DoD Instruction 8551.1>\n…\n140 deny ip any any log\nIf the switch does not\
    \ filter traffic in accordance with the guidelines contained in DoD\n8551, this is a finding."
  remediation: 'Configure the switch to use an inbound ACL on all external interfaces as shown in the

