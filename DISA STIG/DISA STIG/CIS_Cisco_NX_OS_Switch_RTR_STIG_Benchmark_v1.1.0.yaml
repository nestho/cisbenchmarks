- id: '1.19'
  title: CISC-RT-000320
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco perimeter switch must be configured to filter traffic destined to the enclave in accordance with
    the guidelines contained in DoD Instruction 8551.1. GROUP ID: V-221092 RULE ID: SV-221092r999701'
  rationale: Vulnerability assessments must be reviewed by the System Administrator, and protocols must be approved by the
    Information Assurance (IA) staff before entering the enclave. ACLs are the first line of defense in a layered security
    approach. They permit authorized packets and deny unauthorized packets based on port or service type. They enhance the
    posture of the network by not allowing packets to reach a potential target within the security domain. The lists provided
    are highly susceptible ports and services that should be blocked or limited as much as possible without adversely affecting
    customer requirements. Auditing packets attempting to penetrate the network that are stopped by an ACL will allow network
    administrators to broaden their protective ring and more tightly define the scope of operation.
  impact: ''
