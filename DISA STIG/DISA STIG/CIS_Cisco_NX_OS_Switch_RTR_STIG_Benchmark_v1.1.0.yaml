- id: '1.74'
  title: CISC-RT-000950
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco Multicast Source Discovery Protocol (MSDP) switch must be configured to use a loopback address as
    the source address when originating MSDP traffic. GROUP ID: V-221147 RULE ID: SV-221147r999776'
  rationale: Using a loopback address as the source address offers a multitude of uses for security, access, management, and
    scalability of MSDP switches. It is easier to construct appropriate ingress filters for switch management plane traffic
    destined to the network management subnet since the source addresses will be from the range used for loopback interfaces
    instead of a larger range of addresses used for physical interfaces. Log information recorded by authentication and syslog
    servers will record the switch’s loopback address instead of the numerous physical interface addresses.
  impact: ''
  references: []
  page_start: 170
  audit_raw: "Step 1: Review the switch configuration to verify that a loopback address has been\nconfigured.\ninterface Loopback12\n\
    \ ip address x.12.2.2/32\nStep 2: Verify that the loopback interface is used as the source address for all MSDP\npackets\
    \ generated by the switch.\nip msdp peer x.44.2.34 connect-source Loopback12 remote-as nn\nIf the switch does not use\
    \ its loopback address as the source address when originating\nMSDP traffic, this is a finding."
  remediation: 'Configure the switch to use its loopback address is used as the source address when

    sending MSDP packets.

    SW1(config)# ip msdp peer x.44.2.34 connect-source lo12 remote-as nn'
  checks:
  - type: manual_review
    info: "Step 1: Review the switch configuration to verify that a loopback address has been\nconfigured.\ninterface Loopback12\n\
      \ ip address x.12.2.2/32\nStep 2: Verify that the loopback interface is used as the source address for all MSDP\npackets\
      \ generated by the switch.\nip msdp peer x.44.2.34 connect-source Loopback12 remote-as nn\nIf the switch does not use\
      \ its loopback address as the source address when originating\nMSDP traffic, this is a finding."
    severity: medium
- id: '1.75'
  title: CISC-RT-000236
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco switch must be configured to advertise a hop limit of at least 32 in Switch Advertisement messages
    for IPv6 stateless auto-configuration deployments. GROUP ID: V-237754 RULE ID: SV-237754r999759'
  rationale: The Neighbor Discovery protocol allows a hop limit value to be advertised by routers in a Router Advertisement
    message being used by hosts instead of the standardized default value. If a very small value was configured and advertised
    to hosts on the LAN segment, communications would fail due to the hop limit reaching zero before the packets sent by a
    host reached its destination.
  impact: ''
  references: []
  page_start: 172
  audit_raw: "Review the switch configuration to determine if the hop limit has been configured for\nRouter Advertisement\
    \ messages for all internal interfaces as shown in the example.\ninterface Ethernet2/1\n no switchport\n ipv6 address\
    \ 2001::1:0:1/64\n ipv6 nd hop-limit 32\n no shutdown\ninterface Ethernet2/2\n no switchport\n ipv6 address 2001::1:1:1/64\n\
    \ ipv6 nd hop-limit 32\n no shutdown\nIf hop-limit has been configured and has not been set to at least 32, it is a finding."
  remediation: 'Configure the switch to advertise a hop limit of at least 32 in Router Advertisement

    messages as shown in the example.

    SW1(config)# interface e2/1 – 2

    SW1(config-if-range)# ipv6 nd hop-limit 32

    SW1(config-if-range)# end'
  checks:
  - type: manual_review
    info: "Review the switch configuration to determine if the hop limit has been configured for\nRouter Advertisement messages\
      \ for all internal interfaces as shown in the example.\ninterface Ethernet2/1\n no switchport\n ipv6 address 2001::1:0:1/64\n\
      \ ipv6 nd hop-limit 32\n no shutdown\ninterface Ethernet2/2\n no switchport\n ipv6 address 2001::1:1:1/64\n ipv6 nd\
      \ hop-limit 32\n no shutdown\nIf hop-limit has been configured and has not been set to at least 32, it is a finding."
    severity: medium
- id: '1.76'
  title: CISC-RT-000237
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must not be configured to use IPv6 Site Local Unicast addresses. GROUP ID: V-237757 RULE
    ID: SV-237757r999761'
  rationale: As currently defined, site local addresses are ambiguous and can be present in multiple sites. The address itself
    does not contain any indication of the site to which it belongs. The use of site-local addresses has the potential to
    adversely affect network security through leaks, ambiguity, and potential misrouting as documented in section 2 of RFC3879.
    RFC3879 formally deprecates the IPv6 site-local unicast prefix FEC0::/10 as defined in RFC3513.
  impact: ''
  references: []
  page_start: 174
  audit_raw: 'Review the switch configuration to ensure FEC0::/10 IPv6 addresses are not defined.

    If IPv6 Site Local Unicast addresses are defined, this is a finding.'
  remediation: Configure the switch using only authorized IPv6 addresses.
  checks:
  - type: manual_review
    info: 'Review the switch configuration to ensure FEC0::/10 IPv6 addresses are not defined.

      If IPv6 Site Local Unicast addresses are defined, this is a finding.'
    severity: medium
- id: '1.77'
  title: CISC-RT-000391
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco perimeter switch must be configured to suppress Router Advertisements on all external IPv6-enabled
    interfaces. GROUP ID: V-237760 RULE ID: SV-237760r999764'
  rationale: Many of the known attacks in stateless autoconfiguration are defined in RFC 3756 were present in IPv4 ARP attacks.
    To mitigate these vulnerabilities, links that have no hosts connected such as the interface connecting to external gateways
    must be configured to suppress router advertisements.
  impact: ''
  references: []
  page_start: 175
  audit_raw: "Review the switch configuration to verify that Router Advertisements are suppressed on\nall external IPv6-enabled\
    \ interfaces as shown in the example below.\ninterface Ethernet1/1\n no switchport\n ipv6 address 2001::1:24:3/64\n ipv6\
    \ nd suppress-ra\n no shutdown\nIf the switch is not configured to suppress Router Advertisements on all external IPv6enabled\
    \ interfaces, this is a finding."
  remediation: 'Configure the switch to suppress Router Advertisements on all external IPv6-enabled

    interfaces as shown in the example below.

    SW1(config)# interface e1/1

    SW1(config-if-range)# ipv6 nd suppress-ra

    SW1(config-if-range)# end'
