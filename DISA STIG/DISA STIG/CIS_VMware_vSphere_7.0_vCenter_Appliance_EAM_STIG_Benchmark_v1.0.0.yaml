    severity: medium
- id: '1.18'
  title: VCEM-70-000018
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must fail to a known safe state if system initialization fails, shutdown fails, or aborts
    fail. GROUP ID: V-256690 RULE ID: SV-256690r888626'
  rationale: Determining a safe state for failure and weighing that against a potential denial of service for users depends
    on what type of application the web server is hosting. For the ESX Agent Manager, it is preferable that the service abort
    startup on any initialization failure rather than continuing in a degraded, and potentially insecure, state.
