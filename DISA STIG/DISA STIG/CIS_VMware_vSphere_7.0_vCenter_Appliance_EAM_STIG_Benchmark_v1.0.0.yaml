- id: '1.30'
  title: VCEM-70-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must set the secure flag for cookies. GROUP ID: V-256702 RULE ID: SV-256702r888662'
  rationale: The secure flag is an option that can be set by the application server when sending a new cookie to the user
    within an HTTP Response. The purpose of the secure flag is to prevent cookies from being observed by unauthorized parties
    due to the transmission of a cookie in clear text. By setting the secure flag, the browser will prevent the transmission
    of a cookie over an unencrypted channel. The ESX Agent Manager is configured to only be accessible over a Transport Layer
    Security (TLS) tunnel, but this cookie flag is still a recommended best practice.
  impact: ''
  references: []
  page_start: 70
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --format /usr/lib/vmware-eam/web/webapps/eam/WEB-INF/web.xml | sed

    ''s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/session-config/cookie-config/secure'' -

    Expected result:

    true

    If the output of the command does not match the expected result, this is a finding.'
  remediation: "Navigate to and open:\n/usr/lib/vmware-eam/web/webapps/eam/WEB-INF/web.xml\nNavigate to the /<web-apps>/<session-config>/<cookie-config>\
    \ node and\nconfigure it as follows:\n<cookie-config>\n <http-only>true</http-only>\n <secure>true</secure>\n</cookie-config>\n\
    Restart the service with the following command:\n# vmon-cli --restart eam"
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --format /usr/lib/vmware-eam/web/webapps/eam/WEB-INF/web.xml | sed

      ''s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/session-config/cookie-config/secure'' -

      Expected result:

      true

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.31'
  title: VCEM-70-000031
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must be configured with the appropriate ports. GROUP ID: V-256703 RULE ID: SV-256703r888665'
  rationale: Web servers provide numerous processes, features, and functionalities that use TCP/IP ports. Some of these processes
    may be deemed unnecessary or too unsecure to run on a production system. The ports the ESX Agent Manager listens on are
    configured in the "catalina.properties" file and must be verified as accurate to their shipping state.
  impact: ''
  references: []
  page_start: 72
  audit_raw: 'At the command prompt, run the following command:

    # grep ''bio.http.port'' /etc/vmware-eam/catalina.properties

    Expected result:

    bio.http.port=15005

    If the output of the command does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/vmware-eam/catalina.properties

    Navigate to the port''s specification section.

    Set the ESX Agent Manager port specifications according to the following:

    bio.http.port=15005

    Restart the service with the following command:

    # vmon-cli --restart eam'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep ''bio.http.port'' /etc/vmware-eam/catalina.properties

      Expected result:

      bio.http.port=15005

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.32'
  title: VCEM-70-000032
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must disable the shutdown port. GROUP ID: V-256704 RULE ID: SV-256704r888668'
  rationale: An attacker has at least two reasons to stop a web server. The first is to cause a denial of service, and the
    second is to put in place changes the attacker made to the web server configuration. If the Tomcat shutdown port feature
    is enabled, a shutdown signal can be sent to the ESX Agent Manager through this port. To ensure availability, the shutdown
    port must be disabled.
  impact: ''
  references: []
  page_start: 74
  audit_raw: 'At the command prompt, run the following command:

    # grep ''base.shutdown.port'' /etc/vmware-eam/catalina.properties

    Expected result:

    base.shutdown.port=-1

    If the output of the command does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/vmware-eam/catalina.properties

    Add or modify the setting "base.shutdown.port=-1" in the "catalina.properties" file.

    Restart the service with the following command:

    # vmon-cli --restart eam'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep ''base.shutdown.port'' /etc/vmware-eam/catalina.properties

      Expected result:

      base.shutdown.port=-1

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.33'
  title: VCEM-70-000033
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager default servlet must be set to "readonly". GROUP ID: V-256705 RULE ID: SV-256705r888671'
  rationale: The default servlet (or DefaultServlet) is a special servlet provided with Tomcat that is called when no other
    suitable page is found in a particular folder. The DefaultServlet serves static resources as well as directory listings.
    The DefaultServlet is configured by default with the "readonly" parameter set to "true" where HTTP commands such as PUT
    and DELETE are rejected. Changing this to "false" allows clients to delete or modify static resources on the server and
    to upload new resources. DefaultServlet "readonly" must be set to "true", either literally or by absence (default).
  impact: ''
  references: []
  page_start: 75
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --format /usr/lib/vmware-eam/web/webapps/eam/WEB-INF/web.xml | sed ''2

    s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/servlet/servlet-name[text()="default"]/../initparam/param-name[text()="readonly"]/../param-value[text()="false"]''
    -

    Expected result:

    XPath set is empty

    If the output of the command does not match the expected result, this is a finding.'
  remediation: "Navigate to and open:\n/usr/lib/vmware-eam/web/webapps/eam/WEB-INF/web.xml\nNavigate to the ///default/ node\
    \ and remove the following node:\n<init-param>\n <param-name>readonly</param-name>\n <param-value>false</param-value>\n\
    </init-param>\nRestart the service with the following command:\n# vmon-cli --restart eam"
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --format /usr/lib/vmware-eam/web/webapps/eam/WEB-INF/web.xml | sed ''2

      s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/servlet/servlet-name[text()="default"]/../initparam/param-name[text()="readonly"]/../param-value[text()="false"]''
      -

      Expected result:

      XPath set is empty

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
