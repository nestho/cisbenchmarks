benchmark:
  id: cis-vmware-vsphere-7-0-vcenter-appliance-eam-stig-benchmark
  title: CIS VMware vSphere 7.0 vCenter Appliance EAM STIG Benchmark
  version: 1.0.0
  technology: DISA STIG
  category: DISA STIG
  os: DISA STIG
  source_pdf: CIS_VMware_vSphere_7.0_vCenter_Appliance_EAM_STIG_Benchmark_v1.0.0.pdf
  total_pages: 79
  controls_count: 33
controls:
- id: '1.1'
  title: VCEM-70-000001
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must limit the amount of time that each Transmission Control Protocol (TCP) connection is
    kept alive. GROUP ID: V-256673 RULE ID: SV-256673r888575'
  rationale: Denial of service (DoS) is one threat against web servers. Many DoS attacks attempt to consume web server resources
    in such a way that no more resources are available to satisfy legitimate requests. In Tomcat, the "connectionTimeout"
    attribute sets the number of milliseconds the server will wait after accepting a connection for the request Uniform Resource
    Identifier (URI) line to be presented. This timeout will also be used when reading the request body (if any). This prevents
    idle sockets that are not sending HTTP requests from consuming system resources and potentially denying new connections.
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --xpath ''/Server/Service/Connector/@connectionTimeout'' /usr/lib/vmwareeam/web/conf/server.xml

    Expected result:

    connectionTimeout="60000"

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-eam/web/conf/server.xml

    Configure the <Connector> node with the value:

    connectionTimeout="60000"

    Restart the service with the following command:

    # vmon-cli --restart eam'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --xpath ''/Server/Service/Connector/@connectionTimeout'' /usr/lib/vmwareeam/web/conf/server.xml

      Expected result:

      connectionTimeout="60000"

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.2'
  title: VCEM-70-000002
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must limit the number of concurrent connections permitted. GROUP ID: V-256674 RULE ID: SV-256674r888578'
  rationale: Resource exhaustion can occur when an unlimited number of concurrent requests are allowed on a website, facilitating
    a denial-of-service attack. Unless the number of requests is controlled, the web server can consume enough system resources
    to cause a system crash. Mitigating this kind of attack will include limiting the number of concurrent HTTP/HTTPS requests.
    In Tomcat, each incoming request requires a thread for the duration of that request. If more simultaneous requests are
    received than can be handled by the currently available request processing threads, additional threads will be created
    up to the value of the "maxThreads" attribute.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --xpath

    ''/Server/Service/Executor[@name="tomcatThreadPool"]/@maxThreads''

    /usr/lib/vmware-eam/web/conf/server.xml

    Expected result:

    maxThreads="300"

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-eam/web/conf/server.xml

    Navigate to the <Executor> mode with the name of "tomcatThreadPool" and configure

    with the value ''maxThreads="300"''.

    Note: The <Executor> node should be configured as follows:

    <Executor maxThreads="300"

    minSpareThreads="50"

    name="tomcatThreadPool"

    namePrefix="tomcat-http--"/>

    Restart the service with the following command:

    # vmon-cli --restart eam'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --xpath

      ''/Server/Service/Executor[@name="tomcatThreadPool"]/@maxThreads''

      /usr/lib/vmware-eam/web/conf/server.xml

      Expected result:

      maxThreads="300"

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.3'
  title: VCEM-70-000003
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must limit the maximum size of a POST request. GROUP ID: V-256675 RULE ID: SV-256675r888581'
  rationale: The "maxPostSize" value is the maximum size in bytes of the POST that will be handled by the container FORM URL
    parameter parsing. Limit its size to reduce exposure to a denial-of-service attack. If "maxPostSize" is not set, the default
    value of 2097152 (2MB) is used. ESX Agent Manager is configured in its shipping state to not set a value for "maxPostSize".
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --xpath ''/Server/Service/Connector/@maxPostSize'' /usr/lib/vmwareeam/web/conf/server.xml

    Expected result:

    XPath set is empty

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-eam/web/conf/server.xml

    Remove any configuration for "maxPostSize" from the <Connector> node.

    Restart the service with the following command:

    # vmon-cli --restart eam'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --xpath ''/Server/Service/Connector/@maxPostSize'' /usr/lib/vmwareeam/web/conf/server.xml

      Expected result:

      XPath set is empty

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.4'
  title: VCEM-70-000004
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must protect cookies from cross-site scripting (XSS). GROUP ID: V-256676 RULE ID: SV-256676r888584'
  rationale: 'Cookies are a common way to save session state over the HTTP(S) protocol. If attackers can compromise session
    data stored in a cookie, they are better able to launch an attack against the server and its applications. When a cookie
    is tagged with the "HttpOnly" flag, it tells the browser this particular cookie should only be accessed by the originating
    server. Any attempt to access the cookie from client script is strictly forbidden. Satisfies: SRG-APP-000001-WSR-000002,
    SRG-APP-000223-WSR-000011, SRGAPP-000439-WSR-000154, SRG-APP-000439-WSR-000155'
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --format /usr/lib/vmware-eam/web/webapps/eam/WEB-INF/web.xml | sed

    ''s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/session-config/cookie-config/http-only'' -

    Expected result:

    true

    If the output does not match the expected result, this is a finding.'
  remediation: "Navigate to and open:\n/usr/lib/vmware-eam/web/webapps/eam/WEB-INF/web.xml\nNavigate to the node and configure\
    \ it as follows:\n<session-config>\n <cookie-config>\n <http-only>true</http-only>\n <secure>true</secure>\n </cookie-config>\n\
    \ <session-timeout>30</session-timeout>\nRestart the service with the following command:\n# vmon-cli --restart eam"
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --format /usr/lib/vmware-eam/web/webapps/eam/WEB-INF/web.xml | sed

      ''s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/session-config/cookie-config/http-only'' -

      Expected result:

      true

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.5'
  title: VCEM-70-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must record user access in a format that enables monitoring of remote access. GROUP ID:
    V-256677 RULE ID: SV-256677r888587'
  rationale: 'Remote access can be exploited by an attacker to compromise the server. By recording all remote access activities,
    it will be possible to determine the attacker''s location, intent, and degree of success. Tomcat can be configured with
    an "AccessLogValve", a component that can be inserted into the request processing pipeline to provide robust access logging.
    The "AccessLogValve" creates log files in the same format as those created by standard web servers. When "AccessLogValve"
    is properly configured, log files will contain all the forensic information necessary in the case of a security incident.
    Satisfies: SRG-APP-000016-WSR-000005, SRG-APP-000089-WSR-000047, SRGAPP-000092-WSR-000055, SRG-APP-000093-WSR-000053,
    SRG-APP-000095-WSR000056, SRG-APP-000096-WSR-000057, SRG-APP-000097-WSR-000058, SRG-APP000098-WSR-000059, SRG-APP-000098-WSR-000060,
    SRG-APP-000099-WSR000061, SRG-APP-000100-WSR-000064, SRG-APP-000375-WSR-000171, SRG-APP000374-WSR-000172'
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --xpath

    ''/Server/Service/Engine/Host/Valve[@className="org.apache.catalina.valves.AccessL

    ogValve"]/@pattern'' /usr/lib/vmware-eam/web/conf/server.xml

    Expected result:

    pattern="%h %{X-Forwarded-For}i %l %u %t [%I] "%r" %s %b [Processing time %D

    msec] "%{User-Agent}i""

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-eam/web/conf/server.xml

    Inside the <Host> node, find the "AccessLogValve" <Valve> node and replace the

    "pattern" element as follows:

    pattern="%h %{X-Forwarded-For}i %l %u %t [%I] "%r" %s %b [Processing time %D

    msec] "%{User-Agent}i""

    Restart the service with the following command:

    # vmon-cli --restart eam'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --xpath

      ''/Server/Service/Engine/Host/Valve[@className="org.apache.catalina.valves.AccessL

      ogValve"]/@pattern'' /usr/lib/vmware-eam/web/conf/server.xml

      Expected result:

      pattern="%h %{X-Forwarded-For}i %l %u %t [%I] "%r" %s %b [Processing time %D

      msec] "%{User-Agent}i""

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.6'
  title: VCEM-70-000006
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must generate log records for system startup and shutdown. GROUP ID: V-256678 RULE ID: SV-256678r888590'
  rationale: Logging must be started as soon as possible when a service starts and as late as possible when a service is stopped.
    Many forms of suspicious actions can be detected by analyzing logs for unexpected service starts and stops. Also, by starting
    to log immediately after a service starts, it becomes more difficult for suspicious activity to go unlogged.
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'At the command prompt, run the following command:

    # grep StreamRedirectFile /etc/vmware/vmware-vmon/svcCfgfiles/eam.json

    Expected output:

    "StreamRedirectFile" : "%VMWARE_LOG_DIR%/vmware/eam/jvm.log",

    If no log file is specified for the "StreamRedirectFile" setting, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/vmware/vmware-vmon/svcCfgfiles/eam.json

    Below the last line of the "PreStartCommandArg" block, add the following line:

    "StreamRedirectFile" : "%VMWARE_LOG_DIR%/vmware/eam/jvm.log",

    Restart the appliance for changes to take effect.'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep StreamRedirectFile /etc/vmware/vmware-vmon/svcCfgfiles/eam.json

      Expected output:

      "StreamRedirectFile" : "%VMWARE_LOG_DIR%/vmware/eam/jvm.log",

      If no log file is specified for the "StreamRedirectFile" setting, this is a finding.'
    severity: medium
- id: '1.7'
  title: VCEM-70-000007
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager log files must only be modifiable by privileged users. GROUP ID: V-256679 RULE ID: SV-256679r888593'
  rationale: 'Log data is essential in the investigation of events. The accuracy of the information is always pertinent. One
    of the first steps an attacker will take is the modification or deletion of log records to cover tracks and prolong discovery.
    The web server must protect the log data from unauthorized modification. ESX Agent Manager restricts all modification
    of log files by default, but this configuration must be verified. Satisfies: SRG-APP-000119-WSR-000069, SRG-APP-000120-WSR-000070'
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'At the command prompt, run the following command:

    # find /var/log/vmware/eam/web/ -xdev -type f -a ''('' -perm -o+w -o -not -user eam -o -not

    -group users '')'' -exec ls -ld {} ;

    If any files are returned, this is a finding.'
  remediation: 'At the command prompt, run the following commands:

    # chmod o-w

    # chown eam:users

    Note: Substitute with the listed file.'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # find /var/log/vmware/eam/web/ -xdev -type f -a ''('' -perm -o+w -o -not -user eam -o -not

      -group users '')'' -exec ls -ld {} ;

      If any files are returned, this is a finding.'
    severity: medium
- id: '1.8'
  title: VCEM-70-000008
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager application files must be verified for their integrity. GROUP ID: V-256680 RULE ID: SV-256680r918904'
  rationale: 'Verifying that ESX Agent Manager application code is unchanged from its shipping state is essential for file
    validation and nonrepudiation of the ESX Agent Manager. There is no reason the MD5 hash of the RPM original files should
    be changed after installation, excluding configuration files. Satisfies: SRG-APP-000131-WSR-000051, SRG-APP-000357-WSR-000150'
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'At the command prompt, run the following command:

    ".installer|.properties|.xml"

    If there is any output, this is a finding.'
  remediation: 'Reinstall the vCenter Server Appliance (VCSA) or roll back to a backup. Modifying the

    EAM installation files manually is not supported by VMware.'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      ".installer|.properties|.xml"

      If there is any output, this is a finding.'
    severity: medium
- id: '1.9'
  title: VCEM-70-000009
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must only run one webapp. GROUP ID: V-256681 RULE ID: SV-256681r888599'
  rationale: 'VMware ships ESX Agent Managers on the vCenter Server Appliance (VCSA) with one webapp. Any other path is potentially
    malicious and must be removed. Satisfies: SRG-APP-000131-WSR-000073, SRG-APP-000141-WSR-000075'
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'At the command prompt, run the following command:

    # ls -A /usr/lib/vmware-eam/web/webapps

    Expected result:

    eam

    If the output does not match the expected result, this is a finding.'
  remediation: 'For each unexpected directory returned in the check, run the following command:

    # rm /usr/lib/vmware-eam/web/webapps/<NAME>

    Restart the service with the following command:

    # vmon-cli --restart eam'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # ls -A /usr/lib/vmware-eam/web/webapps

      Expected result:

      eam

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.10'
  title: VCEM-70-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must not be configured with unsupported realms. GROUP ID: V-256682 RULE ID: SV-256682r888602'
  rationale: ESX Agent Manager performs authentication at the application level and not through Tomcat. To eliminate unnecessary
    features and ensure ESX Agent Manager remains in its shipping state, the lack of a "UserDatabaseRealm" configuration must
    be confirmed.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'At the command prompt, run the following command:

    # grep UserDatabaseRealm /usr/lib/vmware-eam/web/conf/server.xml

    If the command produces any output, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-eam/web/conf/server.xml

    Remove the <Realm> node returned in the check.

    Restart the service with the following command:

    # vmon-cli --restart eam'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep UserDatabaseRealm /usr/lib/vmware-eam/web/conf/server.xml

      If the command produces any output, this is a finding.'
    severity: medium
- id: '1.11'
  title: VCEM-70-000011
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must be configured to limit access to internal packages. GROUP ID: V-256683 RULE ID: SV-256683r888605'
  rationale: The "package.access" entry in the "catalina.properties" file implements access control at the package level.
    When properly configured, a Security Exception will be reported if an errant or malicious webapp attempts to access the
    listed internal classes directly or if a new class is defined under the protected packages. The ESX Agent Manager comes
    preconfigured with the appropriate packages defined in "package.access", and this configuration must be maintained.
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'At the command prompt, run the following command:

    # grep "package.access" -A 5 /etc/vmware-eam/catalina.properties

    Expected result:

    package.access=\

    sun.,\

    org.apache.catalina.,\

    org.apache.coyote.,\

    org.apache.tomcat.,\

    org.apache.jasper.

    If the output of the command does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/vmware-eam/catalina.properties

    Ensure the "package.access" line is configured as follows:

    package.access=\

    sun.,\

    org.apache.catalina.,\

    org.apache.coyote.,\

    org.apache.tomcat.,\

    org.apache.jasper.

    Restart the service with the following command:

    # vmon-cli --restart eam'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep "package.access" -A 5 /etc/vmware-eam/catalina.properties

      Expected result:

      package.access=\

      sun.,\

      org.apache.catalina.,\

      org.apache.coyote.,\

      org.apache.tomcat.,\

      org.apache.jasper.

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.12'
  title: VCEM-70-000012
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must have Multipurpose Internet Mail Extensions (MIMEs) that invoke operating system shell
    programs disabled. GROUP ID: V-256684 RULE ID: SV-256684r888608'
  rationale: MIME mappings tell ESX Agent Manager what type of program various file types and extensions are and what external
    utilities or programs are needed to execute the file type. By ensuring various shell script MIME types are not included
    in "web.xml", the server is protected against malicious users tricking the server into executing shell command files.
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'At the command prompt, run the following command:

    # grep -En ''(x-csh<)|(x-sh<)|(x-shar<)|(x-ksh<)'' /usr/lib/vmwareeam/web/webapps/eam/WEB-INF/web.xml

    If the command produces any output, this is a finding.'
  remediation: "Navigate to and open:\n/usr/lib/vmware-eam/web/webapps/eam/WEB-INF/web.xml\nRemove all of the following nodes\
    \ lines:\n<mime-type>application/x-csh</mime-type>\n<mime-type>application/x-shar</mime-type>\n<mime-type>application/x-sh</mime-type>\n\
    <mime-type>application/x-ksh</mime-type>\nRestart the service with the following command:\n# vmon-cli --restart eam\n\
    Note: Delete the entire mime-mapping node for the target mime-type.\nExample:\n<mime-mapping>\n <extension>sh</extension>\n\
    \ <mime-type>application/x-sh</mime-type>\n</mime-mapping>"
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep -En ''(x-csh<)|(x-sh<)|(x-shar<)|(x-ksh<)'' /usr/lib/vmwareeam/web/webapps/eam/WEB-INF/web.xml

      If the command produces any output, this is a finding.'
    severity: medium
- id: '1.13'
  title: VCEM-70-000013
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must have mappings set for Java servlet pages. GROUP ID: V-256685 RULE ID: SV-256685r888611'
  rationale: Resource mapping is the process of tying a particular file type to a process in the web server that can serve
    that type of file to a requesting client and identify which file types are not to be delivered to a client. By not specifying
    which files can and cannot be served to a user, the web server could deliver to a user web server configuration files,
    log files, password files, etc. Because Tomcat is a Java-based web server, the main file extension used is *.jsp. This
    check ensures the *.jsp file type has been properly mapped to servlets.
  impact: ''
  references: []
  page_start: 35
  audit_raw: "At the command prompt, run the following command:\n# xmllint --format /usr/lib/vmware-eam/web/webapps/eam/WEB-INF/web.xml\
    \ | sed\n's/xmlns=\".*\"//g' | xmllint --xpath '/web-app/servlet-mapping/servletname[text()=\"JspServlet\"]/parent::servlet-mapping'\
    \ -\nExpected result:\n<servlet-mapping>\n <servlet-name>JspServlet</servlet-name>\n <url-pattern>*.jsp</url-pattern>\n\
    </servlet-mapping>\nIf the output of the command does not match the expected result, this is a finding."
  remediation: "Navigate to and open:\n/usr/lib/vmware-eam/web/webapps/eam/WEB-INF/web.xml\nNavigate to and locate the mapping\
    \ for the JSP servlet. It is the node that contains\nJspServlet.\nConfigure the node to look like the code snippet below:\n\
    <servlet-mapping>\n <servlet-name>JspServlet</servlet-name>\n <url-pattern>*.jsp</url-pattern>\n</servlet-mapping>\nRestart\
    \ the service with the following command:\n# vmon-cli --restart eam"
  checks:
  - type: manual_review
    info: "At the command prompt, run the following command:\n# xmllint --format /usr/lib/vmware-eam/web/webapps/eam/WEB-INF/web.xml\
      \ | sed\n's/xmlns=\".*\"//g' | xmllint --xpath '/web-app/servlet-mapping/servletname[text()=\"JspServlet\"]/parent::servlet-mapping'\
      \ -\nExpected result:\n<servlet-mapping>\n <servlet-name>JspServlet</servlet-name>\n <url-pattern>*.jsp</url-pattern>\n\
      </servlet-mapping>\nIf the output of the command does not match the expected result, this is a finding."
    severity: medium
- id: '1.14'
  title: VCEM-70-000014
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must not have the Web Distributed Authoring (WebDAV) servlet installed. GROUP ID: V-256686
    RULE ID: SV-256686r888614'
  rationale: WebDAV is an extension to the HTTP protocol that, when developed, was meant to allow users to create, change,
    and move documents on a server, typically a web server or web share. WebDAV is not widely used and has serious security
    concerns because it may allow clients to modify unauthorized files on the web server and must therefore be disabled. Tomcat
    uses the "org.apache.catalina.servlets.WebdavServlet" servlet to provide WebDAV services. Because the WebDAV service has
    been found to have an excessive number of vulnerabilities, this servlet must not be installed. ESX Agent Manager does
    not configure WebDAV by default.
  impact: ''
  references: []
  page_start: 37
  audit_raw: 'At the command prompt, run the following command:

    # grep -n ''webdav'' /usr/lib/vmware-eam/web/webapps/eam/WEB-INF/web.xml

    If the command produces any output, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-eam/web/webapps/eam/WEB-INF/web.xml

    Find the webdav node and remove the entire parent block.

    Find the webdav node and remove the entire parent block.

    Restart the service with the following command:

    # vmon-cli --restart eam'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep -n ''webdav'' /usr/lib/vmware-eam/web/webapps/eam/WEB-INF/web.xml

      If the command produces any output, this is a finding.'
    severity: medium
- id: '1.15'
  title: VCEM-70-000015
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must be configured with memory leak protection. GROUP ID: V-256687 RULE ID: SV-256687r888617'
  rationale: The Java Runtime environment can cause a memory leak or lock files under certain conditions. Without memory leak
    protection, ESX Agent Manager can continue to consume system resources, which will lead to "OutOfMemoryErrors" when reloading
    web applications. Memory leaks occur when JRE code uses the context class loader to load a singleton, as this will cause
    a memory leak if a web application class loader happens to be the context class loader at the time. The "JreMemoryLeakPreventionListener"
    class is designed to initialize these singletons when Tomcat's common class loader is the context class loader. Proper
    use of JRE memory leak protection will ensure the hosted application does not consume system resources and cause an unstable
    environment.
  impact: ''
  references: []
  page_start: 39
  audit_raw: 'At the command prompt, run the following command:

    # grep JreMemoryLeakPreventionListener /usr/lib/vmware-eam/web/conf/server.xml

    Expected result:

    <Listener

    className="org.apache.catalina.core.JreMemoryLeakPreventionList

    ener"/>

    If the output of the command does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-eam/web/conf/server.xml

    Navigate to the <Server> node.

    Add ''<Listener

    className="org.apache.catalina.core.JreMemoryLeakPreventionListener"/>'' to the

    <Server> node.

    Restart the service with the following command:

    # vmon-cli --restart eam'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep JreMemoryLeakPreventionListener /usr/lib/vmware-eam/web/conf/server.xml

      Expected result:

      <Listener

      className="org.apache.catalina.core.JreMemoryLeakPreventionList

      ener"/>

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.16'
  title: VCEM-70-000016
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must not have any symbolic links in the web content directory tree. GROUP ID: V-256688 RULE
    ID: SV-256688r888620'
  rationale: A web server is designed to deliver content and execute scripts or applications at the request of a client or
    user. Containing user requests to files in the directory tree of the hosted web application and limiting the execution
    of scripts and applications guarantees the user is not accessing information protected outside the application's realm.
    By checking that no symbolic links exist in the document root, the web server is protected from users jumping outside
    the hosted application directory tree and gaining access to the other directories, including the system root.
  impact: ''
  references: []
  page_start: 41
  audit_raw: 'At the command prompt, run the following command:

    find /usr/lib/vmware-eam/web/webapps/ -type l -ls

    If the command produces any output, this is a finding.'
  remediation: 'At the command prompt, run the following command:

    Note: Replace <file_name> for the name of any files that were returned.

    unlink <file_name>

    Repeat the command for each file that was returned.'
  checks:
  - type: command
    command: find /usr/lib/vmware-eam/web/webapps/ -type l -ls
    expected: ''
    severity: medium
    info: 'At the command prompt, run the following command:

      find /usr/lib/vmware-eam/web/webapps/ -type l -ls

      If the command produces any output, this is a finding.'
- id: '1.17'
  title: VCEM-70-000017
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager directory tree must have permissions in an out-of-the-box state. GROUP ID: V-256689 RULE
    ID: SV-256689r888623'
  rationale: 'As a rule, accounts on a web server are to be kept to a minimum. Only administrators, web managers, developers,
    auditors, and web authors require accounts on the machine hosting the web server. The resources to which these accounts
    have access must also be closely monitored and controlled. ESX Agent Manager files must be adequately protected with correct
    permissions as applied out of the box. Satisfies: SRG-APP-000211-WSR-000030, SRG-APP-000380-WSR-000072'
  impact: ''
  references: []
