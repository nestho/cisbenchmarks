- id: '1.20'
  title: VCEM-70-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must set URIEncoding to UTF-8. GROUP ID: V-256692 RULE ID: SV-256692r888632'
  rationale: Invalid user input occurs when a user inserts data or characters into a hosted application's data entry field
    and the hosted application is unprepared to process that data. This results in unanticipated application behavior, potentially
    leading to an application compromise. Invalid user input is one of the primary methods employed when attempting to compromise
    an application. An attacker can also enter Unicode characters into hosted applications in an effort to break out of the
    document home or root home directory or bypass security checks. ESX Agent Manager must be configured to use a consistent
    character set via the "URIEncoding" attribute on the Connector nodes.
  impact: ''
  references: []
  page_start: 48
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --xpath ''/Server/Service/Connector/@URIEncoding'' /usr/lib/vmwareeam/web/conf/server.xml

    Expected result:

    URIEncoding="UTF-8"

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-eam/web/conf/server.xml

    Configure the <Connector> node with the value:

    URIEncoding="UTF-8"

    Restart the service with the following command:

    # vmon-cli --restart eam'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --xpath ''/Server/Service/Connector/@URIEncoding'' /usr/lib/vmwareeam/web/conf/server.xml

      Expected result:

      URIEncoding="UTF-8"

      If the output does not match the expected result, this is a finding.'
    severity: medium
