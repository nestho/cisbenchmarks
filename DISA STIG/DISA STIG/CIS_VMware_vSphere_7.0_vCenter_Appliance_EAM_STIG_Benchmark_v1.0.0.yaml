  rationale: 'ESX Agent Manager has a number of logs that must be offloaded from the originating system. This information
    can then be used for diagnostic, forensics, or other purposes relevant to ensuring the availability and integrity of the
    hosted application. Satisfies: SRG-APP-000358-WSR-000163, SRG-APP-000125-WSR-000071'
