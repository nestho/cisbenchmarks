- id: '1.22'
  title: VCEM-70-000022
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ESX Agent Manager must set the welcome-file node to a default web page. GROUP ID: V-256694 RULE ID: SV-256694r888638'
  rationale: Enumeration techniques, such as URL parameter manipulation, rely on being able to obtain information about the
    web server's directory structure by locating directories without default pages. In this scenario, the web server will
    display to the user a listing of the files in the directory being accessed. By having a default hosted application web
    page, the anonymous web user will not obtain directory browsing information or an error message that reveals the server
    type and version. Ensuring every document directory has an "index.jsp" (or equivalent) file is one approach to mitigating
    the vulnerability.
