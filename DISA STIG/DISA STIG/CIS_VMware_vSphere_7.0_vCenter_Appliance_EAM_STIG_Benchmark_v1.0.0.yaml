  rationale: Information needed by an attacker to begin looking for possible vulnerabilities in a web server includes any
    information about the web server and plug-ins or modules being used. When debugging or trace information is enabled in
    a production web server, information about the web server, such as web server type, version, patches installed, plug-ins
    and modules installed, type of code being used by the hosted application, and any backends being used for data storage
    may be displayed. Because this information may be placed in logs and general messages during normal operation of the web
    server, an attacker does not need to cause an error condition to gain this information. ESX Agent Manager can be configured
    to set the debugging level. By setting the debugging level to zero (0), no debugging information will be provided to a
    malicious user.
  impact: ''
  references: []
  page_start: 65
  audit_raw: "At the command prompt, run the following command:\n# xmllint --format /usr/lib/vmware-eam/web/webapps/eam/WEB-INF/web.xml\
    \ | sed\n's/xmlns=\".*\"//g' | xmllint --xpath '//param-name[text()=\"debug\"]/parent::init-param' -\nExpected result:\n\
    <init-param>\n <param-name>debug</param-name>\n <param-value>0</param-value>\n</init-param>\nIf the output does not match\
    \ the expected result, this is a finding.\nIf no lines are returned, this is not a finding.\nIf \"XPath set is empty\"\
    \ is returned, this is not a finding."
  remediation: "Navigate to and open:\n/usr/lib/vmware-eam/web/webapps/eam/WEB-INF/web.xml\nNavigate to all nodes that are\
    \ not set to \"0\".\nSet the to \"0\" in all debug nodes.\nNote: The debug setting should look like the following:\n<init-param>\n\
    \ <param-name>debug</param-name>\n <param-value>0</param-value>\n</init-param>\nRestart the service with the following\
    \ command:\n# vmon-cli --restart eam"
  checks:
  - type: manual_review
    info: "At the command prompt, run the following command:\n# xmllint --format /usr/lib/vmware-eam/web/webapps/eam/WEB-INF/web.xml\
      \ | sed\n's/xmlns=\".*\"//g' | xmllint --xpath '//param-name[text()=\"debug\"]/parent::init-param' -\nExpected result:\n\
      <init-param>\n <param-name>debug</param-name>\n <param-value>0</param-value>\n</init-param>\nIf the output does not\
      \ match the expected result, this is a finding.\nIf no lines are returned, this is not a finding.\nIf \"XPath set is\
      \ empty\" is returned, this is not a finding."
    severity: medium
- id: '1.29'
