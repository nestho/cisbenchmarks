  description: 'The Cisco switch must have Storm Control configured on all host-facing switchports. GROUP ID: V-220687 RULE
    ID: SV-220687r539671'
  rationale: A traffic storm occurs when packets flood a LAN, creating excessive traffic and degrading network performance.
    Traffic storm control prevents network disruption by suppressing ingress traffic when the number of packets reaches a
    configured threshold levels. Traffic storm control monitors ingress traffic levels on a port and drops traffic when the
    number of packets reaches the configured threshold level during any onesecond interval.
  impact: ''
