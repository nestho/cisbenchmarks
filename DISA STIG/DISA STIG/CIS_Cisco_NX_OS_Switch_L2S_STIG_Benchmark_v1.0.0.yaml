    Step 2: Verify that IGMP snooping is not disabled for any VLAN as shown in the

    example below:

    no ip igmp snooping vlan 11

    Note: When globally enabled, it is also enabled by default on all VLANs, but can be

    disabled on a per-VLAN basis. If global snooping is disabled, VLAN snooping cannot be

    enabled. If global snooping is enabled, VLAN snooping cannot be enabled or disabled.

    If the switch is not configured to implement IGMP or MLD snooping for each VLAN, this

    is a finding.'
  remediation: 'Configure IGMP or MLD snooping for IPv4 and IPv6 multicast traffic respectively

    globally.

