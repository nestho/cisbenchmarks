controls:
- id: '1.1'
  title: CISC-L2-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco switch must uniquely identify all network-connected endpoint devices before establishing any connection.
    GROUP ID: V-220675 RULE ID: SV-220675r539671'
  rationale: Controlling LAN access via 802.1x authentication can assist in preventing a malicious user from connecting an
    unauthorized PC to a switch port to inject or receive data from the network without detection.
  impact: ''
  references: []
  page_start: 11
  audit_raw: "Verify if the switch configuration has 802.1x authentication implemented for all access\nswitch ports connecting\
    \ to LAN outlets (i.e., RJ-45 wall plates) or devices not located in\nthe telecom room, wiring closets, or equipment rooms.\
    \ MAC Authentication Bypass\n(MAB) must be configured on those switch ports connected to devices that do not\nsupport\
    \ an 802.1x supplicant.\nStep 1: Verify that 802.1x is configured on all host-facing interfaces as shown in the\nexample\
    \ below:\ninterface Ethernet1/1\n dot1x pae authenticator\n dot1x port-control auto\n dot1x host-mode single-host\n switchport\
    \ access vlan 10\ninterface Ethernet1/2\n dot1x pae authenticator\n dot1x port-control auto\n dot1x host-mode single-host\n\
    \ switchport access vlan 10\ninterface Ethernet1/3\n dot1x pae authenticator\n dot1x port-control auto\n dot1x host-mode\
    \ single-host\n switchport access vlan 10\nNote: Host-mode must be set to single-host, multi-domain (for VoIP phone +\
    \ PC), or\nmulti-auth (multiple PCs connected to a hub). Host-mode multi-host is not compliant\nwith this requirement.\n\
    Step 2: Verify that 802.1x authentication is configured on the switch as shown in the\nexample below:\naaa group server\
    \ radius RADIUS_GROUP\n server 1.1.1.1\n server 1.2.1.1\n…\n…\n…\naaa authentication dot1x default group RADIUS_GROUP\n\
    Step 3: Verify that the radius servers have been defined.\nradius-server host 10.1.1.1 key 7 \"xxxxxxxxxxx\" authentication\
    \ accounting\ntimeout 5 retransmit 1\nradius-server host 10.2.1.1 key 7 \" xxxxxxxxxxx\" authentication accounting\ntimeout\
    \ 5 retransmit 1\nIf 802.1x authentication or MAB is not configured on all access switch ports connecting\nto LAN outlets\
    \ or devices not located in the telecom room, wiring closets, or equipment\nrooms, this is a finding."
  remediation: 'Configure 802.1 x authentications on all host-facing access switch ports. To

    authenticate those devices that do not support 802.1x, MAC Authentication Bypass

    must be configured.

    Step 1: Configure the radius servers as shown in the example below:

    SW1(config)# radius-server host 10.1.1.1 key xxxx

    SW1(config)# radius-server host 10.2.1.1 key xxxx

    Step 2: Enable 802.1x authentication on the switch.

    SW1(config)# aaa group server radius RADIUS_GROUP

    SW1(config-radius)# server 10.1.1.1

    SW1(config-radius)# server 10.2.1.1

    SW1(config-radius)# exit

    SW1(config)# aaa authentication dot1x default group RADIUS_GROUP

    SW1(config)# exit

    Step 3: Enable 802.1x on all host-facing interfaces as shown in the example below:

    SW1(config)# int e1/1 - 80

    SW1(config-if-range)# dot1x port-control auto

    SW1(config-if-range)# dot1x host-mode single-host

    SW1(config-if-range)# end

    Note: Host-mode must be set to single-host, multi-domain (for VoIP phone + PC), or

    multi-auth (multiple PCs connected to a hub). Host-mode multi-host is not compliant

    with this requirement.'
  checks:
  - type: manual_review
    info: "Verify if the switch configuration has 802.1x authentication implemented for all access\nswitch ports connecting\
      \ to LAN outlets (i.e., RJ-45 wall plates) or devices not located in\nthe telecom room, wiring closets, or equipment\
      \ rooms. MAC Authentication Bypass\n(MAB) must be configured on those switch ports connected to devices that do not\n\
      support an 802.1x supplicant.\nStep 1: Verify that 802.1x is configured on all host-facing interfaces as shown in the\n\
      example below:\ninterface Ethernet1/1\n dot1x "
    severity: medium
- id: '1.2'
  title: CISC-L2-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must authenticate all VLAN Trunk Protocol (VTP) messages with a hash function using the most
    secured cryptographic algorithm available. GROUP ID: V-220676 RULE ID: SV-220676r539671'
  rationale: VLAN Trunk Protocol (VTP) provides central management of VLAN domains, thus reducing administration in a switched
    network. When configuring a new VLAN on a VTP server, the VLAN is distributed through all switches in the domain. This
    reduces the need to configure the same VLAN everywhere. VTP pruning preserves bandwidth by preventing VLAN traffic (unknown
    MAC, broadcast, multicast) from being sent down trunk links when not needed, that is, there are no access switch ports
    in neighboring switches belonging to such VLANs. An attack can force a digest change for the VTP domain enabling a rogue
    device to become the VTP server, which could allow unauthorized access to previously blocked VLANs or allow the addition
    of unauthorized switches into the domain. Authenticating VTP messages with a cryptographic hash function can reduce the
    risk of the VTP domain's being compromised.
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'Review the switch configuration to verify if VTP is enabled.

    Step 1: Enter the show feature command to determine if vtp is enabled.

    Step 2: Enter the show vtp status command to determine operating mode.

    SW1# show vtp status

    VTP Status Information

    ----------------------

    VTP Version : 2 (capable)

    Configuration Revision : 0

    Maximum VLANs supported locally : 1005

    Number of existing VLANs : 5

    VTP Operating Mode : Transparent

    VTP Domain Name : XXXXX

    VTP Pruning Mode : Disabled (Operationally Disabled)

    VTP V2 Mode : Disabled

    VTP Traps Generation : Disabled

    MD5 Digest : 0x0C 0x5E 0xC3 0x74 0x3F 0xB0 0x2F 0x49

    If mode is set to anything other than off or transparent, verify that a password has been

    configured using the show vtp password command.

    Note: VTP authenticates all messages using an MD5 hash that consists of the VTP

    version + The VTP Password + VTP Domain + VTP Configuration Revision.

    If VTP is enabled on the switch and is not authenticating VTP messages with a hash

    function using a configured password, this is a finding.'
  remediation: 'Configure the switch to authenticate all VLAN Trunk Protocol (VTP) messages with a

    hash function using a configured password as shown in the example below:

    SW1(config)# vtp password xxxxxxxxx'
  checks:
  - type: sql
    command: show feature command to determine if vtp is enabled.
    severity: medium
    info: 'Review the switch configuration to verify if VTP is enabled.

      Step 1: Enter the show feature command to determine if vtp is enabled.

      Step 2: Enter the show vtp status command to determine operating mode.

      SW1# show vtp status

      VTP Status Information

      ----------------------

      VTP Version : 2 (capable)

      Configuration Revision : 0

      Maximum VLANs supported locally : 1005

      Number of existing VLANs : 5

      VTP Opera'
- id: '1.3'
  title: CISC-L2-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured for authorized users to select a user session to capture. GROUP ID: V-220677
    RULE ID: SV-220677r1015266'
  rationale: Without the capability to select a user session to capture/record or view/hear, investigations into suspicious
    or harmful events would be hampered by the volume of information captured. The volume of information captured may also
    adversely impact the operation for the network. Session audits may include port mirroring, tracking websites visited,
    and recording information and/or file transfers.
  impact: ''
  references: []
  page_start: 16
  audit_raw: "Verify that the switch is capable of capturing ingress and egress packets from any\ndesignated switch port for\
    \ the purpose of monitoring a specific user session. The\nexample configuration below will capture packets from interface\
    \ Ethernet1/66 and\nreplicate the packets to interface Ethernet1/68.\nmonitor session 1\n source interface Ethernet1/66\
    \ both\n destination interface Ethernet1/68\nIf the switch is not capable of capturing ingress and egress packets from\
    \ a designated\nswitch port, this is a finding."
  remediation: 'Enable the feature or configure the switch so that it is capable of capturing ingress and

    egress packets from any designated switch port for the purpose of monitoring a specific

    user session. The example configuration below will capture packets from interface

    Ethernet1/66 and replicate the packets to Ethernet1/68.

    SW1(config)# monitor session 1

    SW1(config-monitor)# source interface ethernet 1/66

    SW1(config-monitor)# destination interface ethernet 1/68

    SW1(config-monitor)# end'
  checks:
  - type: manual_review
    info: "Verify that the switch is capable of capturing ingress and egress packets from any\ndesignated switch port for\
