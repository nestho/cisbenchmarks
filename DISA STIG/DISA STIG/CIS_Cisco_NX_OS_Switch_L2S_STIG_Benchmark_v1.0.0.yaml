- id: '1.5'
  title: CISC-L2-000080
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must authenticate all endpoint devices before establishing any connection. GROUP ID: V-220679
    RULE ID: SV-220679r856488'
  rationale: Without authenticating devices, unidentified or unknown devices may be introduced, thereby facilitating malicious
    activity. For distributed architectures (e.g., service-oriented architectures), the decisions regarding the validation
    of authentication claims may be made by services separate from the services acting on those decisions. In such situations,
    it is necessary to provide authentication decisions (as opposed to the actual authenticators) to the services that need
    to act on those decisions. This requirement applies to applications that connect either locally, remotely, or through
    a network to an endpoint device (including, but not limited to, workstations, printers, servers (outside a datacenter),
    VoIP Phones, and VTC CODECs). Gateways and SOA applications are examples of where this requirement would apply. Device
    authentication is a solution enabling an organization to manage devices. It is an additional layer of authentication ensuring
    only specific pre-authorized devices can access the system.
  impact: ''
  references: []
  page_start: 20
  audit_raw: "Verify if the switch configuration has 802.1x authentication implemented for all access\nswitch ports connecting\
    \ to LAN outlets (i.e., RJ-45 wall plates) or devices not located in\nthe telecom room, wiring closets, or equipment rooms.\
