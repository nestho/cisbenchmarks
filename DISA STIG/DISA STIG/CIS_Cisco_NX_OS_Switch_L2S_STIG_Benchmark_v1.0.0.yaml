- id: '1.12'
  title: CISC-L2-000150
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must have Dynamic Address Resolution Protocol (ARP) Inspection (DAI) enabled on all user
    VLANs. GROUP ID: V-220686 RULE ID: SV-220686r856495'
  rationale: DAI intercepts Address Resolution Protocol (ARP) requests and verifies that each of these packets has a valid
    IP-to-MAC address binding before updating the local ARP cache and before forwarding the packet to the appropriate destination.
    Invalid ARP packets are dropped and logged. DAI determines the validity of an ARP packet based on valid IP-to-MAC address
    bindings stored in the DHCP snooping binding database. If the ARP packet is received on a trusted interface, the switch
    forwards the packet without any checks. On untrusted interfaces, the switch forwards the packet only if it is valid.
  impact: ''
  references: []
  page_start: 34
  audit_raw: 'Review the switch configuration to verify that Dynamic Address Resolution Protocol

    (ARP) Inspection (DAI) feature is enabled on all user VLANs.

    hostname SW2

    …

    …

    …

    ip arp inspection vlan 2,4-8,11

    Note: DAI depends on the entries in the DHCP snooping binding database to verify IPto-MAC address bindings in incoming
    ARP requests and ARP responses.

    If DAI is not enabled on all user VLANs, this is a finding.'
  remediation: 'Configure the switch to have Dynamic Address Resolution Protocol (ARP) Inspection

    (DAI) enabled on all user VLANs as shown in the example below:

    SW1(config)# ip arp inspection vlan 2,4-8,11'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to verify that Dynamic Address Resolution Protocol

