- id: '1.22'
  title: CISC-L2-000270
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco switch must not have any switchports assigned to the native VLAN. GROUP ID: V-220696 RULE ID: SV-220696r991953'
  rationale: Double encapsulation can be initiated by an attacker who has access to a switch port belonging to the native
    VLAN of the trunk port. Knowing the victim’s MAC address and with the victim attached to a different switch belonging
    to the same trunk group, thereby requiring the trunk link and frame tagging, the malicious user can begin the attack by
    sending frames with two sets of tags. The outer tag that will have the attacker’s VLAN ID (probably the well-known and
    omnipresent default VLAN) is stripped off by the switch, and the inner tag that will have the victim’s VLAN ID is used
    by the switch as the next hop and sent out the trunk port.
