- id: '1.11'
  title: CISC-L2-000140
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must have IP Source Guard enabled on all user-facing or untrusted access switch ports. GROUP
    ID: V-220685 RULE ID: SV-220685r856494'
  rationale: IP Source Guard provides source IP address filtering on a Layer 2 port to prevent a malicious host from impersonating
    a legitimate host by assuming the legitimate host's IP address. The feature uses dynamic DHCP snooping and static IP source
    binding to match IP addresses to hosts on untrusted Layer 2 access ports. Initially, all IP traffic on the protected port
    is blocked except for DHCP packets. After a client receives an IP address from the DHCP server, or after static IP source
    binding is configured by the administrator, all traffic with that IP source address is permitted from that client. Traffic
    from other hosts is denied. This filtering limits a host's ability to attack the network by claiming a neighbor host's
    IP address.
  impact: ''
  references: []
  page_start: 32
  audit_raw: "Review the switch configuration to verify that IP Source Guard is enabled on all userfacing or untrusted access\
    \ switch ports as shown in the example below:\ninterface Ethernet1/1\n ip verify source dhcp-snooping-vlan\ninterface\
    \ Ethernet1/2\n ip verify source dhcp-snooping-vlan\n…\n…\n…\ninterface Ethernet1/32\n ip verify source dhcp-snooping-vlan\n\
    Note: the IP Source Guard feature depends on the entries in the DHCP snooping\ndatabase or static IP-MAC-VLAN configuration\
    \ commands to verify IP-to-MAC address\nbindings.\nIf the switch does not have IP Source Guard enabled on all untrusted\
    \ access switch\nports, this is a finding."
  remediation: 'Configure the switch to have IP Source Guard enabled on all user-facing or untrusted

    access switch ports.

    SW1(config)# int e1/1-32

    SW1(config-if-range)# ip verify source dhcp-snooping-vlan'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify that IP Source Guard is enabled on all userfacing or untrusted access\
