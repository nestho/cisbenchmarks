- id: '1.6'
  title: CISC-L2-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Cisco switch must have Root Guard enabled on all switch ports connecting to access layer switches and
    hosts. GROUP ID: V-220680 RULE ID: SV-220680r940009'
  rationale: Spanning Tree Protocol (STP) does not provide any means for the network administrator to securely enforce the
    topology of the switched network. Any switch can be the root bridge in a network. However, a more optimal forwarding topology
    places the root bridge at a specific predetermined location. With the standard STP, any bridge in the network with a lower
    bridge ID takes the role of the root bridge. The administrator cannot enforce the position of the root bridge but can
    set the root bridge priority to 0 in an effort to secure the root bridge position. The root guard feature provides a way
    to enforce the root bridge placement in the network. If the bridge receives superior STP Bridge Protocol Data Units (BPDUs)
    on a root guard-enabled port, root guard moves this port to a root-inconsistent STP state and no traffic can be forwarded
    across this port while it is in this state. To enforce the position of the root bridge it is imperative that root guard
    is enabled on all ports where the root bridge should never appear.
  impact: ''
  references: []
  page_start: 23
  audit_raw: "Review the switch topology as well as the configuration to verify that Root Guard is\nenabled on all switch\
    \ ports connecting to access layer switches.\ninterface Ethernet1/1\n…\n …\n …\nspanning-tree guard root\ninterface Ethernet1/2\n\
    …\n …\n …\nspanning-tree guard root\ninterface Ethernet1/3\n…\n …\n …\nspanning-tree guard root\nIf the switch has not\
    \ enabled Root Guard on all switch ports connecting to access layer\nswitches, this is a finding"
  remediation: 'Configure the switch to have Root Guard enabled on all ports connecting to access

    layer switches.

    SW1(config)# int e1/1 – 44

    SW1(config-if-range)# spanning-tree guard root

    SW1(config-if-range)# end'
  checks:
  - type: manual_review
    info: "Review the switch topology as well as the configuration to verify that Root Guard is\nenabled on all switch ports\
      \ connecting to access layer switches.\ninterface Ethernet1/1\n…\n …\n …\nspanning-tree guard root\ninterface Ethernet1/2\n\
      …\n …\n …\nspanning-tree guard root\ninterface Ethernet1/3\n…\n …\n …\nspanning-tree guard root\nIf the switch has not\
      \ enabled Root Guard on all switch ports connecting to access layer\nswitches, this is a finding"
    severity: medium
- id: '1.7'
  title: CISC-L2-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must have BPDU Guard enabled on all user-facing or untrusted access switch ports. GROUP ID:
    V-220681 RULE ID: SV-220681r856490'
  rationale: If a rogue switch is introduced into the topology and transmits a Bridge Protocol Data Unit (BPDU) with a lower
    bridge priority than the existing root bridge, it will become the new root bridge and cause a topology change, rendering
    the network in a suboptimal state. The STP PortFast BPDU guard enhancement allows network designers to enforce the STP
    domain borders and keep the active topology predictable. The devices behind the ports that have STP PortFast enabled are
    not able to influence the STP topology. At the reception of BPDUs, the BPDU guard operation disables the port that has
    PortFast configured. The BPDU guard transitions the port into errdisable state and sends a log message.
  impact: ''
  references: []
  page_start: 25
  audit_raw: "Review the switch configuration to verify that BPDU Guard is enabled on all user-facing\nor untrusted access\
    \ switch ports as shown in the configuration example below:\ninterface Ethernet1/1\n…\n …\n …\nspanning-tree bpduguard\
    \ enable\ninterface Ethernet1/2\n…\n …\n …\nspanning-tree bpduguard enable\nIf the switch has not enabled BPDU Guard,\
    \ this is a finding."
  remediation: 'Configure the switch to have BPDU Guard enabled on all user-facing or untrusted

    access switch ports as shown in the configuration example below:

    SW1(config)# int e1/1 -44

    SW1(config-if-range)# spanning-tree bpduguard enable

    Note: BPDU guard can also be enabled globally on all edge ports via the following

    command:

    spanning-tree port type edge bpduguard default'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify that BPDU Guard is enabled on all user-facing\nor untrusted access switch\
      \ ports as shown in the configuration example below:\ninterface Ethernet1/1\n…\n …\n …\nspanning-tree bpduguard enable\n\
      interface Ethernet1/2\n…\n …\n …\nspanning-tree bpduguard enable\nIf the switch has not enabled BPDU Guard, this is\
      \ a finding."
    severity: medium
- id: '1.8'
  title: CISC-L2-000110
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must have STP Loop Guard enabled. GROUP ID: V-220682 RULE ID: SV-220682r856491'
  rationale: The Spanning Tree Protocol (STP) loop guard feature provides additional protection against STP loops. An STP
    loop is created when an STP blocking port in a redundant topology erroneously transitions to the forwarding state. In
    its operation, STP relies on continuous reception and transmission of BPDUs based on the port role. The designated port
    transmits BPDUs, and the non-designated port receives BPDUs. When one of the ports in a physically redundant topology
    no longer receives BPDUs, the STP conceives that the topology is loop free. Eventually, the blocking port from the alternate
    or backup port becomes a designated port and moves to a forwarding state. This situation creates a loop. The loop guard
    feature makes additional checks. If BPDUs are not received on a non-designated port and loop guard is enabled, that port
    is moved into the STP loop-inconsistent blocking state.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'Review the switch configuration to verify that STP Loop Guard is enabled as shown in

    the configuration example below:

    hostname SW1

    …

    …

    …

    spanning-tree loopguard default

    If STP Loop Guard is not enabled, this is a finding.'
  remediation: 'Configure the switch to have STP Loop Guard enabled via the spanning-tree loopguard

    default global command.'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to verify that STP Loop Guard is enabled as shown in

      the configuration example below:

      hostname SW1

      …

      …

      …

      spanning-tree loopguard default

      If STP Loop Guard is not enabled, this is a finding.'
    severity: medium
- id: '1.9'
  title: CISC-L2-000120
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must have Unknown Unicast Flood Blocking (UUFB) enabled. GROUP ID: V-220683 RULE ID: SV-220683r856492'
  rationale: Access layer switches use the Content Addressable Memory (CAM) table to direct traffic to specific ports based
    on the VLAN number and the destination MAC address of the frame. When a router has an Address Resolution Protocol (ARP)
    entry for a destination host and forwards it to the access layer switch and there is no entry corresponding to the frame's
    destination MAC address in the incoming VLAN, the frame will be sent to all forwarding ports within the respective VLAN,
    which causes flooding. Large amounts of flooded traffic can saturate low-bandwidth links, causing network performance
    issues or complete connectivity outage to the connected devices. Unknown unicast flooding has been a nagging problem in
    networks that have asymmetric routing and default timers. To mitigate the risk of a connectivity outage, the Unknown Unicast
    Flood Blocking (UUFB) feature must be implemented on all access layer switches. The UUFB feature will block unknown unicast
    traffic flooding and only permit egress traffic with MAC addresses that are known to exit on the port.
  impact: ''
  references: []
  page_start: 28
  audit_raw: "Review the switch configuration to verify that UUFB is enabled on all access switch\nports as shown in the configuration\
    \ example below:\ninterface Ethernet1/1\n switchport block unicast\ninterface Ethernet1/2\n switchport block unicast\n\
    …\n…\n…\ninterface Ethernet1/32\n switchport block unicast\nIf any access switch ports do not have UUFB enabled, this\
    \ is a finding."
  remediation: 'Configure the switch to have Unknown Unicast Flood Blocking (UUFB) enabled as

    shown in the configuration example below:

    SW1(config)# int e1/1-32

    SW1(config-if-range)# switchport block unicast

    SW1(config-if-range)# end'
  checks:
  - type: manual_review
    info: "Review the switch configuration to verify that UUFB is enabled on all access switch\nports as shown in the configuration\
      \ example below:\ninterface Ethernet1/1\n switchport block unicast\ninterface Ethernet1/2\n switchport block unicast\n\
      …\n…\n…\ninterface Ethernet1/32\n switchport block unicast\nIf any access switch ports do not have UUFB enabled, this\
      \ is a finding."
    severity: medium
- id: '1.10'
  title: CISC-L2-000130
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must have DHCP snooping for all user VLANs to validate DHCP messages from untrusted sources.
    GROUP ID: V-220684 RULE ID: SV-220684r856493'
  rationale: In an enterprise network, devices under administrative control are trusted sources. These devices include the
    switches, routers, and servers in the network. Host ports and unknown DHCP servers are considered untrusted sources. An
    unknown DHCP server on the network on an untrusted port is called a spurious DHCP server, any device (PC, Wireless Access
    Point) that is loaded with DHCP server enabled. The DHCP snooping feature determines whether traffic sources are trusted
    or untrusted. The potential exists for a spurious DHCP server to respond to DHCPDISCOVER messages before the real server
    has time to respond. DHCP snooping allows switches on the network to trust the port a DHCP server is connected to and
    not trust the other ports. The DHCP snooping feature validates DHCP messages received from untrusted sources and filters
    out invalid messages as well as rate-limits DHCP traffic from trusted and untrusted sources. DHCP snooping feature builds
    and maintains a binding database, which contains information about untrusted hosts with leased IP addresses, and it utilizes
    the database to validate subsequent requests from untrusted hosts. Other security features, such as IP Source Guard and
