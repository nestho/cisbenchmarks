    Border Gateway Protocol (BGP), Routing Information Protocol (RIP), Open Shortest Path First (OSPF), Enhanced Interior
    Gateway Routing Protocol (EIGRP), Intermediate System to Intermediate System (ISIS) and Label Distribution Protocol (LDP).
    Satisfies: SRG-NET-000230-RTR-000001, SRG-NET-000230-RTR-000002'
