  audit_raw: 'If the Tier-0 Gateway is not using BGP or OSPF, this is Not Applicable.

    Since the router does not reveal if a BGP password is configured, interview the router

    administrator to determine if a password is configured on BGP neighbors.

    If BGP neighbors do not have a password configured, this is a finding.

    To verify OSPF areas are using authentication, do the following:

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways.

    For every Tier-0 Gateway expand the "Tier-0 Gateway".

    Expand "OSPF", click the number next to "Area Definition", and view the

    "Authentication" field for each area.

    If OSPF area definitions do not have Password or MD5 set for authentication, this is a

    finding.'
  remediation: 'To set authentication for BGP neighbors, do the following:

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways, and expand the target Tier-0 gateway.

    Expand BGP. Next to BGP Neighbors, click on the number present to open the dialog,

    then select "Edit" on the target BGP Neighbor.

    Under Timers & Password, enter a password up to 20 characters, and then click "Save".

    To set authentication for OSPF Area definitions, do the following:

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways, and expand the target Tier-0 gateway.

    Expand OSPF. Next to "Area Definition", click on the number present to open the

