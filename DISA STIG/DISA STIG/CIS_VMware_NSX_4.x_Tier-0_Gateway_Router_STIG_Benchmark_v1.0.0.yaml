  checks:
  - type: manual_review
    info: 'If the Tier-0 Gateway is not using BGP or OSPF, this is Not Applicable.

      Since the router does not reveal if a BGP password is configured, interview the router

      administrator to determine if a password is configured on BGP neighbors.

      If BGP neighbors do not have a password configured, this is a finding.

      To verify OSPF areas are using authentication, do the following:

      From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

      Gateways.

      For every Tier-0 Gateway expand the "Tier-0'
    severity: medium
- id: '1.8'
  title: NT0R-4X-000064
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The NSX Tier-0 Gateway router must be configured to have Internet Control Message Protocol (ICMP) unreachable
    notifications disabled on all external interfaces. GROUP ID: V-265441 RULE ID: SV-265441r999915'
  rationale: The ICMP supports IP traffic by relaying information about paths, routes, and network conditions. Routers automatically
    send ICMP messages under a wide variety of conditions. Host unreachable ICMP messages are commonly used by attackers for
    network mapping and diagnosis.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'If the Tier-0 Gateway is deployed in an Active/Active HA mode, this is Not Applicable.

    From the NSX Manager web interface, go to Security >> Policy Management >>

    Gateway Firewall >> Gateway Specific Rules, and choose each Tier-0 Gateway in the

    drop-down.

    Review each Tier-0 Gateway Firewall rule to verify one exists to drop ICMP

    unreachable messages.

    If a rule does not exist to drop ICMP unreachable messages, this is a finding.'
  remediation: 'To configure a shared rule to drop ICMP unreachable messages, do the following:

    From the NSX Manager web interface, go to Security >> Policy Management >>

    Gateway Firewall >> All Shared Rules.

    Click "Add Rule" (add a policy first, if needed) and under "Services", select "ICMP

    Destination Unreachable" and "Apply".

    Enable logging and under the "Applied To" field select the target Tier-0 gateways and

    click "Publish" to enforce the new rule.

    Note: A rule can also be created under Gateway Specific Rules to meet this

    requirement.'
  checks:
  - type: manual_review
    info: 'If the Tier-0 Gateway is deployed in an Active/Active HA mode, this is Not Applicable.

      From the NSX Manager web interface, go to Security >> Policy Management >>

      Gateway Firewall >> Gateway Specific Rules, and choose each Tier-0 Gateway in the

      drop-down.

      Review each Tier-0 Gateway Firewall rule to verify one exists to drop ICMP

      unreachable messages.

      If a rule does not exist to drop ICMP unreachable messages, this is a finding.'
    severity: medium
