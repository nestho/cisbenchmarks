- id: '1.11'
  title: NT0R-4X-000067
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The NSX Tier-0 Gateway router must be configured to use the Border Gateway Protocol (BGP) maximum prefixes
    feature to protect against route table flooding and prefix deaggregation attacks. GROUP ID: V-265444 RULE ID: SV-265444r994682'
  rationale: The effects of prefix de-aggregation can degrade router performance due to the size of routing tables and also
    result in black-holing legitimate traffic. Initiated by an attacker or a misconfigured router, prefix de-aggregation occurs
    when the announcement of a large prefix is fragmented into a collection of smaller prefix announcements. In 1997, misconfigured
    routers in the Florida Internet Exchange network (AS7007) deaggregated every prefix in their routing table and started
    advertising the first /24 block of each of these prefixes as their own. Faced with this additional burden, the internal
    routers became overloaded and crashed repeatedly. This caused prefixes advertised by these routers to disappear from routing
    tables and reappear when the routers came back online. As the routers came back after crashing, they were flooded with
    the routing table information by their neighbors. The flood of information would again overwhelm the routers and cause
    them to crash. This process of route flapping served to destabilize not only the surrounding network but also the entire
    internet. Routers trying to reach those addresses would choose the smaller, more specific /24 blocks first. This caused
    backbone networks throughout North America and Europe to crash. Maximum prefix limits on peer connections combined with
    aggressive prefix-size filtering of customers' reachability advertisements will effectively mitigate the deaggregation
    risk. BGP maximum prefix must be used on all eBGP routers to limit the number of prefixes that it should receive from
    a particular neighbor, whether customer or peering autonomous system (AS). Consider each neighbor and how many routes
    they should be advertising and set a threshold slightly higher than the number expected.
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'If the Tier-0 Gateway is not using BGP, this is Not Applicable.

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways.

    For every Tier-0 Gateway with BGP enabled, expand the Tier-0 Gateway.

    Expand BGP, click on the number next to "BGP Neighbors", and then view the router

    filters for each neighbor.

    If "Maximum Routes" is not configured, or a route filter does not exist for each BGP

    neighbor, this is a finding.'
  remediation: 'To set maximum prefixes for BGP neighbors, do the following:

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways and expand the target Tier-0 gateway.

    Expand BGP. Next to "BGP Neighbors", click on the number present to open the dialog,

    and then select "Edit" on the target BGP Neighbor.

    Click "Router Filter", add or edit an existing router filter, enter a number for "Maximum

    Routes", and then click "Add".

    Click "Apply", then click "Save" to finish the configuration.'
  checks:
  - type: manual_review
    info: 'If the Tier-0 Gateway is not using BGP, this is Not Applicable.

      From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

      Gateways.

      For every Tier-0 Gateway with BGP enabled, expand the Tier-0 Gateway.

      Expand BGP, click on the number next to "BGP Neighbors", and then view the router

      filters for each neighbor.

      If "Maximum Routes" is not configured, or a route filter does not exist for each BGP

      neighbor, this is a finding.'
    severity: medium
- id: '1.12'
  title: NT0R-4X-000102
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The NSX Tier-0 Gateway router must be configured to advertise a hop limit of at least 32 in Router Advertisement
    messages for IPv6 stateless auto-configuration deployments. GROUP ID: V-265479 RULE ID: SV-265479r994787'
  rationale: The Neighbor Discovery (ND) protocol allows a hop limit value to be advertised by routers in a Router Advertisement
    message being used by hosts instead of the standardized default value. If a very small value was configured and advertised
    to hosts on the LAN segment, communications would fail due to the hop limit reaching zero before the packets sent by a
    host reached its destination.
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'If IPv6 forwarding is not enabled, this is Not Applicable.

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways.

    For every Tier-0 Gateway, expand Tier-0 Gateway >>Additional Settings.

    Click on the ND profile name to view the hop limit.

    If the hop limit is not configured to at least 32, this is a finding.'
  remediation: 'To configure the Neighbor Discovery hop limit, do the following:

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways >> edit the target Tier-0 gateway.

    Expand Additional Settings and select an "ND Profile" from the drop down with a hop

    limit of 32 or more, then click "Close Editing".

    Note: The default ND profile has a hop limit of 64 and cannot be edited. If required,

    create a new or edit another existing ND profile to use.'
  checks:
  - type: manual_review
    info: 'If IPv6 forwarding is not enabled, this is Not Applicable.

      From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

      Gateways.

      For every Tier-0 Gateway, expand Tier-0 Gateway >>Additional Settings.

      Click on the ND profile name to view the hop limit.

      If the hop limit is not configured to at least 32, this is a finding.'
    severity: medium
- id: '1.13'
  title: NT0R-4X-000091
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The NSX Tier-0 Gateway router must be configured to use its loopback address as the source address for Internal
    Border Gateway Protocol (IBGP) peering sessions. GROUP ID: V-265468 RULE ID: SV-265468r994754'
  rationale: Using a loopback address as the source address offers a multitude of uses for security, access, management, and
    scalability of the Border Gateway Protocol (BGP) routers. It is easier to construct appropriate ingress filters for router
    management plane traffic destined to the network management subnet since the source addresses will be from the range used
    for loopback interfaces instead of a larger range of addresses used for physical interfaces. Log information recorded
    by authentication and syslog servers will record the router’s loopback address instead of the numerous physical interface
    addresses. The routers within the iBGP domain should also use loopback addresses as the source address when establishing
    BGP sessions.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'If the Tier-0 Gateway is not using iBGP, this is Not Applicable.

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways.

    For every Tier-0 Gateway with BGP enabled, expand the Tier-0 Gateway.

    Expand BGP, click on the number next to BGP Neighbors, then view the source

    address for each neighbor.

    If the Source Address is not configured as the Tier-0 Gateway loopback address for the

    iBGP session, this is a finding.'
  remediation: 'To configure a loopback interface, do the following:

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways and expand the target Tier-0 gateway.

    Expand interfaces and click "Add Interface".

    Enter a name, select "Loopback" as the Type, enter an IP address, select an Edge

    Node for the interface, then click "Save".

    Note: More than one loopback may need to be configured depending on the routing

    architecture.

    To set the source address for BGP neighbors, do the following:

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways >> expand the target Tier-0 gateway.

    Expand BGP >> next to BGP Neighbors, click on the number present to open the dialog

    >> select "Edit" on the target BGP Neighbor.

    Under Source Addresses, configure the source address with the loopback address and

    click "Save".'
  checks:
  - type: manual_review
    info: 'If the Tier-0 Gateway is not using iBGP, this is Not Applicable.

      From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

      Gateways.

      For every Tier-0 Gateway with BGP enabled, expand the Tier-0 Gateway.

      Expand BGP, click on the number next to BGP Neighbors, then view the source

      address for each neighbor.

      If the Source Address is not configured as the Tier-0 Gateway loopback address for the

      iBGP session, this is a finding.'
    severity: medium
- id: '1.14'
  title: NT0R-4X-000106
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The NSX Tier-0 Gateway router must be configured to have routing protocols disabled if not in use. GROUP ID:
    V-265483 RULE ID: SV-265483r999918'
  rationale: A compromised router introduces risk to the entire network infrastructure, as well as data resources that are
    accessible via the network. The perimeter defense has no oversight or control of attacks by malicious users within the
    network. Preventing network breaches from within is dependent on implementing a comprehensive defense-in-depth strategy,
    including securing each device connected to the network. This is accomplished by following and implementing all security
    guidance applicable for each node type. A fundamental step in securing each router is to enable only the capabilities
    required for operation.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways.

    For every Tier-0 Gateway, expand the Tier-0 Gateway to view if border gateway

    protocol (BGP) or Open Shortest Path First (OSPF) is enabled.

    If BGP and/or OSPF is enabled and not in use, this is a finding.'
  remediation: 'If not used in the implementation, then disable BGP, do the following:

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways and edit the target Tier-0 gateway.

    Expand BGP, change from "On" to "Off", and then click "Save".

    If not used in the implementation, then disable OSPF, do the following:

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways and edit the target Tier-0 gateway.

    Expand OSPF, change from "Enabled" to "Disabled", and then click "Save".'
  checks:
  - type: manual_review
    info: 'From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

      Gateways.

      For every Tier-0 Gateway, expand the Tier-0 Gateway to view if border gateway

      protocol (BGP) or Open Shortest Path First (OSPF) is enabled.

      If BGP and/or OSPF is enabled and not in use, this is a finding.'
    severity: medium
