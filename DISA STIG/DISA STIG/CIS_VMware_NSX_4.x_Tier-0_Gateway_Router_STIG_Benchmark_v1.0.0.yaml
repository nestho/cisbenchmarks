controls:
- id: '1.1'
  title: NT0R-4X-000013
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The NSX Tier-0 Gateway router must be configured to disable Protocol Independent Multicast (PIM) on all interfaces
    that are not required to support multicast routing. GROUP ID: V-265390 RULE ID: SV-265390r994520'
  rationale: If multicast traffic is forwarded beyond the intended boundary, it could be intercepted by unauthorized or unintended
    personnel. Limiting where within the network a given multicast group's data is permitted to flow is an important first
    step in improving multicast security. A scope zone is an instance of a connected region of a given scope. Zones of the
    same scope cannot overlap while zones of a smaller scope will fit completely within a zone of a larger scope. For example,
    Admin-local scope is smaller than Site-local scope, so the administratively configured boundary fits within the bounds
    of a site. According to RFC 4007 IPv6 Scoped Address Architecture (section 5), scope zones are also required to be "convex
    from a routing perspective"; that is, packets routed within a zone must not pass through any links that are outside of
    the zone. This requirement forces each zone to be one contiguous island rather than a series of separate islands. As stated
    in the DOD IPv6 IA Guidance for MO3, "One should be able to identify all interfaces of a zone by drawing a closed loop
    on their network diagram, engulfing some routers and passing through some routers to include only some of their interfaces."
    Therefore, it is imperative that the network engineers have documented their multicast topology and thereby knows which
    interfaces are enabled for multicast. Once this is done, the zones can be scoped as required.
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways.

    For every Tier-0 Gateway, expand the Tier-0 Gateway >> Interfaces and GRE Tunnels,

    and click on the number of interfaces present to open the interfaces dialog.

    Expand each interface that is not required to support multicast routing, then expand

    "Multicast" and verify PIM is disabled.

    If PIM is enabled on any interfaces that are not supporting multicast routing, this is a

    finding.'
  remediation: 'Disable multicast PIM routing on interfaces that are not required to support multicast by

    doing the following:

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways and expand the target Tier-0 gateway.

    Expand "Interfaces and GRE Tunnels", click on the number of interfaces present to

    open the interfaces dialog, and then select "Edit" on the target interface.

    Expand "Multicast", change PIM to "disabled", and then click "Save".'
  checks:
  - type: manual_review
    info: 'From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

      Gateways.

      For every Tier-0 Gateway, expand the Tier-0 Gateway >> Interfaces and GRE Tunnels,

      and click on the number of interfaces present to open the interfaces dialog.

      Expand each interface that is not required to support multicast routing, then expand

      "Multicast" and verify PIM is disabled.

      If PIM is enabled on any interfaces that are not supporting multicast routing, this is a

      finding.'
    severity: medium
- id: '1.2'
  title: NT0R-4X-000016
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The NSX Tier-0 Gateway router must be configured to have all inactive interfaces removed. GROUP ID: V-265393
    RULE ID: SV-265393r994529'
  rationale: An inactive interface is rarely monitored or controlled and may expose a network to an undetected attack on that
    interface. Unauthorized personnel with access to the communication facility could gain access to a router by connecting
    to a configured interface that is not in use. If an interface is no longer used, the configuration must be deleted and
    the interface disabled. For sub-interfaces, delete sub-interfaces that are on inactive interfaces and delete sub-interfaces
    that are themselves inactive. If the sub-interface is no longer necessary for authorized communications, it must be deleted.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways.

    For every Tier-0 Gateway, expand the Tier-0 Gateway >> Interfaces and GRE Tunnels,

    and click on the number of interfaces present to open the interfaces dialog.

    Review each interface present to determine if they are not in use or inactive.

    If there are any interfaces present on a Tier-0 Gateway that are not in use or inactive,

    this is a finding.'
  remediation: 'Remove unused interfaces by doing the following:

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways and expand the target Tier-0 gateway.

    Expand "Interfaces and GRE Tunnels", then click on the number of interfaces present to

    open the interfaces dialog.

    Select "Delete" on the unneeded interface, and then click "Delete" again to confirm.'
  checks:
  - type: manual_review
    info: 'From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

      Gateways.

      For every Tier-0 Gateway, expand the Tier-0 Gateway >> Interfaces and GRE Tunnels,

      and click on the number of interfaces present to open the interfaces dialog.

      Review each interface present to determine if they are not in use or inactive.

      If there are any interfaces present on a Tier-0 Gateway that are not in use or inactive,

      this is a finding.'
    severity: medium
- id: '1.3'
  title: NT0R-4X-000027
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The NSX Tier-0 Gateway router must be configured to have the Dynamic Host Configuration Protocol (DHCP) service
    disabled if not in use. GROUP ID: V-265404 RULE ID: SV-265404r999914'
  rationale: A compromised router introduces risk to the entire network infrastructure, as well as data resources that are
    accessible via the network. The perimeter defense has no oversight or control of attacks by malicious users within the
    network. Preventing network breaches from within is dependent on implementing a comprehensive defense-in-depth strategy,
    including securing each device connected to the network. This is accomplished by following and implementing all security
    guidance applicable for each node type. A fundamental step in securing each router is to enable only the capabilities
    required for operation.
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways.

    For every Tier-0 Gateway, expand the Tier-0 Gateway to view the DHCP configuration.

    If a DHCP profile is configured and not in use, this is a finding.'
  remediation: 'From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways and edit the target Tier-0 gateway.

    Click "Set DHCP Configuration", select "No Dynamic IP Address Allocation", and then

    click "Save". Close "Editing".'
  checks:
  - type: manual_review
    info: 'From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

      Gateways.

      For every Tier-0 Gateway, expand the Tier-0 Gateway to view the DHCP configuration.

      If a DHCP profile is configured and not in use, this is a finding.'
    severity: medium
- id: '1.4'
  title: NT0R-4X-000029
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The NSX Tier-0 Gateway router must be configured to use encryption for Open Shortest Path First (OSPF) routing
    protocol authentication. GROUP ID: V-265406 RULE ID: SV-265406r994568'
  rationale: A rogue router could send a fictitious routing update to convince a site's perimeter router to send traffic to
    an incorrect or even a rogue destination. This diverted traffic could be analyzed to learn confidential information about
    the site's network or used to disrupt the network's ability to communicate with other networks. This is known as a "traffic
    attraction attack" and is prevented by configuring neighbor router authentication for routing updates. However, using
    clear-text authentication provides little benefit since an attacker can intercept traffic and view the authentication
    key. This would allow the attacker to use the authentication key in an attack. This requirement applies to all IPv4 and
    IPv6 protocols that are used to exchange routing or packet forwarding information; this includes all Interior Gateway
    Protocols (such as OSPF, Enhanced Interior Gateway Routing Protocol [EIGRP], and Intermediate System to Intermediate System
    [IS-IS]) and exterior gateway protocols (such as Border Gateway Protocol [BGP]), multiprotocol label switching (MPLS)-related
    protocols (such as Label Distribution Protocol [LDP]), and multicast-related protocols. Typically routing protocols must
    be setup on both sides so knowing the authentication key does not necessarily mean an attacker would be able to setup
    a rogue router and peer with a legitimate one and inject malicious routes.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'If the Tier-0 Gateway is not using OSPF, this is Not Applicable.

    To verify OSPF areas are using authentication with encryption, do the following:

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways.

    For every Tier-0 Gateway, expand the "Tier-0 Gateway".

    Expand "OSPF", click the number next to "Area Definition", and view the

    "Authentication" field for each area.

    If OSPF area definitions do not have the "Authentication" field set to "MD5" and a "Key

    ID" and "Password" configured, this is a finding.'
  remediation: 'To set authentication for OSPF area definitions, do the following:

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways, and expand the target Tier-0 gateway.

    Expand "OSPF", click the number next to "Area Definition". Select "Edit" on the target

    OSPF Area Definition.

    Change the Authentication drop-down to MD5, enter a Key ID and Password, and then

    click "Save".

    Note: The MD5 password can have a maximum of 16 characters.'
  checks:
  - type: manual_review
    info: 'If the Tier-0 Gateway is not using OSPF, this is Not Applicable.

      To verify OSPF areas are using authentication with encryption, do the following:

      From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

      Gateways.

      For every Tier-0 Gateway, expand the "Tier-0 Gateway".

      Expand "OSPF", click the number next to "Area Definition", and view the

      "Authentication" field for each area.

      If OSPF area definitions do not have the "Authentication" field set to "MD5" and a "Key

      ID" and "Pas'
    severity: medium
- id: '1.5'
  title: NT0R-4X-000051
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The NSX Tier-0 Gateway router must be configured to restrict it from accepting outbound IP packets that contain
    an illegitimate address in the source address field by enabling Unicast Reverse Path Forwarding (uRPF). GROUP ID: V-265428
    RULE ID: SV-265428r994634'
  rationale: A malicious platform can use a compromised host in an enclave to launch cyberattacks on third parties. This is
    a common practice in "botnets", which are a collection of compromised computers using malware to attack other computers
    or networks. Distributed denial-of-service (DDoS) attacks frequently leverage IP source address spoofing to send packets
    to multiple hosts that in turn will send return traffic to the hosts with the IP addresses that were forged. This can
    generate significant amounts of traffic. Therefore, protection measures to counteract IP source address spoofing must
    be taken. When uRPF is enabled in strict mode, the packet must be received on the interface that the device would use
    to forward the return packet; thereby mitigating IP source address spoofing.
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways.

    For every Tier-0 Gateway, expand Tier-0 Gateway >> Interfaces and GRE Tunnels, and

    then click on the number of interfaces present to open the interfaces dialog.

    Expand each interface to view the URPF Mode configuration.

    If URPF Mode is not set to "Strict" on any interface, this is a finding.'
  remediation: 'Enable strict URPF mode on interfaces by doing the following:

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways and expand the target Tier-0 gateway.

    Expand "Interfaces and GRE Tunnels", click on the number of interfaces present to

    open the interfaces dialog, and then select "Edit" on the target interface.

    From the drop-down, set the URPF mode to "Strict" and then click "Save".'
  checks:
  - type: manual_review
    info: 'From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

      Gateways.

      For every Tier-0 Gateway, expand Tier-0 Gateway >> Interfaces and GRE Tunnels, and

      then click on the number of interfaces present to open the interfaces dialog.

      Expand each interface to view the URPF Mode configuration.

      If URPF Mode is not set to "Strict" on any interface, this is a finding.'
    severity: medium
- id: '1.6'
  title: NT0R-4X-000055
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The NSX Tier-0 Gateway must be configured to use a unique password for each autonomous system (AS) with which
    it peers. GROUP ID: V-265432 RULE ID: SV-265432r994646'
  rationale: If the same keys are used between External Border Gateway Protocol (eBGP) neighbors, the chance of a hacker compromising
    any of the BGP sessions increases. It is possible that a malicious user exists in one autonomous system who would know
    the key used for the eBGP session. This user would then be able to hijack BGP sessions with other trusted neighbors.
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'If the Tier-0 Gateway is not using BGP, this is Not Applicable.

    Since the NSX Tier-0 Gateway does not reveal the current password, interview the

    router administrator to determine if unique passwords are being used.

    If unique passwords are not being used for each AS, this is a finding.'
  remediation: 'To set authentication for BGP neighbors, do the following:

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-0

    Gateways, and expand the target Tier-0 gateway.

    Expand BGP. Next to "BGP Neighbors", click on the number present to open the dialog,

    then select "Edit" on the target BGP Neighbor.

    Expand "BGP", click the number next to "BGP Neighbors". Select "Edit" on the target

    BGP neighbor.

    Under Timers & Password, enter a password up to 20 characters that is different from

    other autonomous systems, and then click "Save".'
  checks:
  - type: manual_review
    info: 'If the Tier-0 Gateway is not using BGP, this is Not Applicable.

      Since the NSX Tier-0 Gateway does not reveal the current password, interview the

      router administrator to determine if unique passwords are being used.

      If unique passwords are not being used for each AS, this is a finding.'
    severity: medium
- id: '1.7'
  title: NT0R-4X-000054
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The NSX Tier-0 Gateway router must be configured to implement message authentication for all control plane
    protocols. GROUP ID: V-265431 RULE ID: SV-265431r994643'
  rationale: 'A rogue router could send a fictitious routing update to convince a site''s perimeter router to send traffic
