    Internet or a Windows Domain" is "Enabled".

    If the registry value name below does not exist, this is not a finding.

    If it exists and is configured with a value of "3", this is not a finding.

    If it exists and is configured with a value of "0", this is a finding.

    Registry Hive: HKEY_LOCAL_MACHINE

    Registry Path: \SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy\

    Value Name: fMinimizeConnections

    Value Type: REG_DWORD

    Value: 3 (or if the Value Name does not exist)'
  remediation: 'The default behavior for "Minimize the number of simultaneous connections to the

    Internet or a Windows Domain" is "Enabled".

    If this must be corrected, configure the policy value for

    Computer Configuration >> Administrative Templates >> Network >> Windows

    Connection Manager >> "Minimize the number of simultaneous connections to the

    Internet or a Windows Domain"

    to "Enabled".

    Under "Options", set "Minimize Policy Options" to "3 = Prevent Wi-Fi When on

    Ethernet".'
  checks:
  - type: manual_review
    info: 'The default behavior for "Minimize the number of simultaneous connections to the

