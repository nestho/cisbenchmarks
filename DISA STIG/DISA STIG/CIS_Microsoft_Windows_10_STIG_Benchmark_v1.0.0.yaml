- id: '1.118'
  title: WN10-CC-000070
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Virtualization Based Security must be enabled on Windows 10 with the platform security level configured to
    Secure Boot or Secure Boot with DMA Protection. GROUP ID: V-220811 RULE ID: SV-220811r1016359'
  rationale: Virtualization Based Security (VBS) provides the platform for the additional security features, Credential Guard
    and Virtualization based protection of code integrity. Secure Boot is the minimum security level with DMA protection providing
    additional memory protection. DMA Protection requires a CPU that supports input/output memory management unit (IOMMU).
  impact: ''
  references: []
  page_start: 213
  audit_raw: 'Confirm virtualization-based security (VBS) is enabled and running with Secure Boot or

    Secure Boot and DMA Protection.

    For those devices that support VBS features, including Credential Guard or protection of

    code integrity, this must be enabled. If the system meets the hardware and firmware

    dependencies for enabling VBS but it is not enabled, this is a CAT III finding.

    VBS, including Credential Guard, currently cannot be implemented in virtual desktop

    implementations (VDI) due to specific supporting requirements including a TPM, UEFI

    with Secure Boot, and the capability to run the Hyper-V feature within the virtual

    desktop.

    For VDIs where the virtual desktop instance is deleted or refreshed upon logoff, this is

    NA.

    Run "PowerShell" with elevated privileges (run as administrator).

    Enter the following:

    "Get-CimInstance -ClassName Win32_DeviceGuard -Namespace

    root\Microsoft\Windows\DeviceGuard"

    If "RequiredSecurityProperties" does not include a value of "2" indicating "Secure Boot"

    (e.g., "{1, 2}"), this is a finding.

    If "Secure Boot and DMA Protection" is configured, "3" will also be displayed in the

    results (e.g., "{1, 2, 3}").

    If "VirtualizationBasedSecurityStatus" is not a value of "2" indicating "Running", this is a

    finding.

    Alternately:

    Run "System Information".

    Under "System Summary", verify the following:

    If "Device Guard Virtualization based security" does not display "Running", this is

    finding.

    If "Device Guard Required Security Properties" does not display "Base Virtualization

    Support, Secure Boot", this is finding.

    If "Secure Boot and DMA Protection" is configured, "DMA Protection" will also be

    displayed (e.g., "Base Virtualization Support, Secure Boot, DMA Protection").

    The policy settings referenced in the Fix section will configure the following registry

    values. However, due to hardware requirements, the registry values alone do not

    ensure proper function.

    Registry Hive: HKEY_LOCAL_MACHINE

    Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\

    Value Name: EnableVirtualizationBasedSecurity

    Value Type: REG_DWORD

    Value: 1

    Value Name: RequirePlatformSecurityFeatures

    Value Type: REG_DWORD

    Value: 1 (Secure Boot only) or 3 (Secure Boot and DMA Protection)

    A Microsoft article on Credential Guard system requirements can be found at the

    following link:

    https://technet.microsoft.com/en-us/itpro/windows/keep-secure/credential-guardrequirements'
  remediation: 'VBS, including Credential Guard, currently cannot be implemented in virtual desktop

    implementations (VDI) due to specific supporting requirements including a TPM, UEFI

    with Secure Boot, and the capability to run the Hyper-V feature within the virtual

    desktop.

    For VDIs where the virtual desktop instance is deleted or refreshed upon logoff, this is

    NA.

    Configure the policy value for

    Computer Configuration >> Administrative Templates >> System >> Device Guard

    >> "Turn On Virtualization Based Security"

    to "Enabled" with "Secure Boot" or "Secure Boot and DMA Protection" selected for

    "Select Platform Security Level:".

    A Microsoft article on Credential Guard system requirements can be found at the

    following link:

    https://technet.microsoft.com/en-us/itpro/windows/keep-secure/credential-guardrequirements'
  checks:
  - type: manual_review
    info: 'Confirm virtualization-based security (VBS) is enabled and running with Secure Boot or

      Secure Boot and DMA Protection.

      For those devices that support VBS features, including Credential Guard or protection of

      code integrity, this must be enabled. If the system meets the hardware and firmware

      dependencies for enabling VBS but it is not enabled, this is a CAT III finding.

      VBS, including Credential Guard, currently cannot be implemented in virtual desktop

      implementations (VDI) due to specific suppor'
    severity: medium
- id: '1.119'
  title: WN10-CC-000075
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Credential Guard must be running on Windows 10 domain-joined systems. GROUP ID: V-220812 RULE ID: SV-220812r991589'
  rationale: Credential Guard uses virtualization based security to protect information that could be used in credential theft
    attacks if compromised. This authentication information, which was stored in the Local Security Authority (LSA) in previous
    versions of Windows, is isolated from the rest of operating system and can only be accessed by privileged system software.
  impact: ''
  references: []
  page_start: 216
  audit_raw: 'Confirm Credential Guard is running on domain-joined systems.

    For devices that support Credential Guard, this feature must be enabled. Organizations

    must take the appropriate action to acquire and implement compatible hardware with

    Credential Guard enabled.

    Virtualization based security, including Credential Guard, currently cannot be

    implemented in virtual desktop implementations (VDIs) due to specific supporting

    requirements including a TPM, UEFI with Secure Boot, and the capability to run the

    Hyper-V feature within the virtual desktop.

    For VDIs where the virtual desktop instance is deleted or refreshed upon logoff, this is

    Not Applicable.

    Run "PowerShell" with elevated privileges (run as administrator).

    Enter the following:

    "Get-CimInstance -ClassName Win32_DeviceGuard -Namespace

    root\Microsoft\Windows\DeviceGuard"

    If "SecurityServicesRunning" does not include a value of "1" (e.g., "{1, 2}"), this is a

    finding.

    Alternately:

    Run "System Information".

    Under "System Summary", verify the following:

    If "Virtualization-based Security Services Running" does not list "Credential Guard", this

    is finding.

    The policy settings referenced in the Fix section will configure the following registry

    value. However, due to hardware requirements, the registry value alone does not

    ensure proper function.

    Registry Hive: HKEY_LOCAL_MACHINE

    Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\

    Value Name: LsaCfgFlags

    Value Type: REG_DWORD

    Value: 0x00000001 (1) (Enabled with UEFI lock)'
  remediation: 'Virtualization based security, including Credential Guard, currently cannot be

    implemented in VDIs due to specific supporting requirements including a TPM, UEFI

    with Secure Boot, and the capability to run the Hyper-V feature within the virtual

    desktop.

    For VDIs where the virtual desktop instance is deleted or refreshed upon logoff, this is

    Not Applicable.

    For VDIs with persistent desktops, this may be downgraded to a CAT II only where

    administrators have specific tokens for the VDI. Administrator accounts on virtual

    desktops must only be used on systems in the VDI; they may not have administrative

    privileges on any other systems such as servers and physical workstations.

    Configure the policy value for

    Computer Configuration >> Administrative Templates >> System >> Device Guard

    >> "Turn On Virtualization Based Security"

    to "Enabled" with "Enabled with UEFI lock" selected for "Credential Guard

    Configuration:".

    v1507 LTSB does not include selection options; select "Enable Credential Guard".

    A Microsoft TechNet article on Credential Guard, including system requirement details,

    can be found at the following link:

    https://docs.microsoft.com/en-us/windows/access-protection/credentialguard/credential-guard'
  checks:
  - type: manual_review
    info: 'Confirm Credential Guard is running on domain-joined systems.

      For devices that support Credential Guard, this feature must be enabled. Organizations

      must take the appropriate action to acquire and implement compatible hardware with

      Credential Guard enabled.

      Virtualization based security, including Credential Guard, currently cannot be

      implemented in virtual desktop implementations (VDIs) due to specific supporting

      requirements including a TPM, UEFI with Secure Boot, and the capability to run the'
    severity: medium
- id: '1.120'
  title: WN10-CC-000080
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Virtualization-based protection of code integrity must be enabled. GROUP ID: V-252903 RULE ID: SV-252903r991589'
  rationale: Virtualization-based protection of code integrity enforces kernel mode memory protections and protects Code Integrity
    validation paths. This isolates the processes from the rest of the operating system and can only be accessed by privileged
    system software.
  impact: ''
  references: []
  page_start: 218
  audit_raw: 'Confirm virtualization-based protection of code integrity.

    For devices that support the virtualization based security (VBS) feature for protection of

    code integrity, this must be enabled. If the system meets the hardware, firmware, and

    compatible device driver dependencies for enabling virtualization-based protection of

    code integrity but it is not enabled, this is a CAT II finding.

    Virtualization based security currently cannot be implemented in virtual desktop

    implementations (VDI) due to specific supporting requirements including a TPM, UEFI

    with Secure Boot, and the capability to run the Hyper-V feature within the virtual

    desktop.

    For VDIs where the virtual desktop instance is deleted or refreshed upon logoff, this is

    NA.

    Run "PowerShell" with elevated privileges (run as administrator).

    Enter the following:

    "Get-CimInstance -ClassName Win32_DeviceGuard -Namespace

    root\Microsoft\Windows\DeviceGuard"

    If "SecurityServicesRunning" does not include a value of "2" (e.g., "{1, 2}"), this is a

    finding.

    Alternately:

    Run "System Information".

    Under "System Summary", verify the following:

    If "Virtualization-based Security Services Running" does not list "Hypervisor enforced

    Code Integrity", this is finding.

    The policy settings referenced in the Fix section will configure the following registry

    value. However due to hardware requirements, the registry value alone does not ensure

    proper function.

    Registry Hive: HKEY_LOCAL_MACHINE

    Registry Path: \SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\

    Value Name: HypervisorEnforcedCodeIntegrity

    Value Type: REG_DWORD

    Value: 0x00000001 (1) (Enabled with UEFI lock), or 0x00000002 (2) (Enabled

    without lock)'
  remediation: 'Virtualization-based security currently cannot be implemented in VDIs due to specific

    supporting requirements, including a TPM, UEFI with Secure Boot, and the capability to

    run the Hyper-V feature within the virtual desktop.

    For VDIs where the virtual desktop instance is deleted or refreshed upon logoff, this is

    NA.

    Configure the policy value for

    Computer Configuration >> Administrative Templates >> System >> Device Guard

    >> "Turn On Virtualization Based Security"

    to "Enabled" with "Enabled with UEFI lock" or "Enabled without lock" selected for

    "Virtualization Based Protection of Code Integrity:".

    "Enabled with UEFI lock" is preferred as more secure; however, it cannot be turned off

    remotely through a group policy change if there is an issue.

    "Enabled without lock" will allow this to be turned off remotely while testing for issues.'
  checks:
  - type: manual_review
    info: 'Confirm virtualization-based protection of code integrity.

      For devices that support the virtualization based security (VBS) feature for protection of

      code integrity, this must be enabled. If the system meets the hardware, firmware, and

      compatible device driver dependencies for enabling virtualization-based protection of

      code integrity but it is not enabled, this is a CAT II finding.

      Virtualization based security currently cannot be implemented in virtual desktop

      implementations (VDI) due to spec'
    severity: medium
- id: '1.121'
  title: WN10-CC-000085
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Early Launch Antimalware, Boot-Start Driver Initialization Policy must prevent boot drivers. GROUP ID: V-220813
    RULE ID: SV-220813r991589'
  rationale: By being launched first by the kernel, ELAM ( Early Launch Antimalware) is ensured to be launched before any
    third-party software, and is therefore able to detect malware in the boot process and prevent it from initializing.
  impact: ''
  references: []
  page_start: 220
  audit_raw: 'The default behavior is for Early Launch Antimalware - Boot-Start Driver Initialization

    policy is to enforce "Good, unknown and bad but critical" (preventing "bad").

    If the registry value name below does not exist, this a finding.

    If it exists and is configured with a value of "7", this is a finding.

    Registry Hive: HKEY_LOCAL_MACHINE

    Registry Path: \SYSTEM\CurrentControlSet\Policies\EarlyLaunch\

    Value Name: DriverLoadPolicy

    Value Type: REG_DWORD

    Value: 1, 3, or 8

    Possible values for this setting are:

    8 - Good only

    1 - Good and unknown

    3 - Good, unknown and bad but critical

    7 - All (which includes "Bad" and would be a finding)'
  remediation: 'Ensure that Early Launch Antimalware - Boot-Start Driver Initialization policy is set to

    enforce "Good, unknown and bad but critical" (preventing "bad").

    If this needs to be corrected configure the policy value for

    Computer Configuration >> Administrative Templates >> System >> Early Launch

    Antimalware >> "Boot-Start Driver Initialization Policy"

    to "Enabled” with "Good, unknown and bad but critical" selected.'
  checks:
  - type: manual_review
    info: 'The default behavior is for Early Launch Antimalware - Boot-Start Driver Initialization

      policy is to enforce "Good, unknown and bad but critical" (preventing "bad").

      If the registry value name below does not exist, this a finding.

      If it exists and is configured with a value of "7", this is a finding.

      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SYSTEM\CurrentControlSet\Policies\EarlyLaunch\

      Value Name: DriverLoadPolicy

      Value Type: REG_DWORD

      Value: 1, 3, or 8

      Possible values for this setting'
    severity: medium
