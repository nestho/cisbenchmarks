    disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are necessary to provide
    a trail of evidence in case the system or network is compromised. Collecting this data is essential for analyzing the
    security of information assets and detecting signs of suspicious and unexpected behavior. Audit Detailed File Share allows
    the auditing of attempts to access files and folders on a shared folder. The Detailed File Share setting logs an event
    every time a file or folder is accessed, whereas the File Share setting only records one event for any connection established
    between a client and file share. Detailed File Share audit events include detailed information about the permissions or
    other criteria used to grant or deny access.
