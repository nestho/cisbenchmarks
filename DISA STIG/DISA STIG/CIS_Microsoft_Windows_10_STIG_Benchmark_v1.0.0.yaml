  references: []
  page_start: 65
  audit_raw: 'This is applicable to Windows 10 prior to v1709.

    Verify SEHOP is turned on.

    If the following registry value does not exist or is not configured as specified, this is a

    finding.

    Registry Hive: HKEY_LOCAL_MACHINE

    Registry Path: \SYSTEM\CurrentControlSet\Control\Session Manager\kernel\

    Value Name: DisableExceptionChainValidation

    Value Type: REG_DWORD

    Value: 0x00000000 (0)'
  remediation: 'Configure the policy value for

