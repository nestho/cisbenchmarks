- id: '1.44'
  title: WN10-00-000395
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Windows 10 must not have portproxy enabled or in use. GROUP ID: V-257593 RULE ID: SV-257593r991589'
  rationale: Having portproxy enabled or configured in Windows 10 could allow a man-in-the-middle attack.
  impact: ''
  references: []
  page_start: 83
  audit_raw: 'Check the registry key for existence of proxied ports:

    HKLM\SYSTEM\CurrentControlSet\Services\PortProxy.

    If the key contains v4tov4\tcp\ or is populated v4tov4\tcp, this is a finding.

    Run "netsh interface portproxy show all".

    If the command displays any results, this is a finding.'
  remediation: 'Contact the Administrator to run "netsh interface portproxy delete" with elevation.

    Remove any enabled portproxies that may be configured.'
  checks:
  - type: sql
    command: show all".
    severity: medium
    info: 'Check the registry key for existence of proxied ports:

      HKLM\SYSTEM\CurrentControlSet\Services\PortProxy.

