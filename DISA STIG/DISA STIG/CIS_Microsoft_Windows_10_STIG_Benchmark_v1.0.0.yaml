    security of information assets and detecting signs of suspicious and unexpected behavior. Enabling PowerShell script block
    logging will record detailed information from the processing of PowerShell commands and scripts. This can provide additional
    detail when malware has run on a system.
  impact: ''
  references: []
  page_start: 288
