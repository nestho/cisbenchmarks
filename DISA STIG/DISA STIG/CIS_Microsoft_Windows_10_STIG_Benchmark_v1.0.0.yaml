- id: '1.16'
  title: WN10-00-000070
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Only accounts responsible for the administration of a system must have Administrator rights on the system.
    GROUP ID: V-220712 RULE ID: SV-220712r958726'
  rationale: An account that does not have Administrator duties must not have Administrator rights. Such rights would allow
    the account to bypass or modify required security restrictions on that machine and make it vulnerable to attack. System
    administrators must log on to systems only using accounts with the minimum level of authority necessary. For domain-joined
    workstations, the Domain Admins group must be replaced by a domain workstation administrator group (see V-36434 in the
    Active Directory Domain STIG). Restricting highly privileged accounts from the local Administrators group helps mitigate
    the risk of privilege escalation resulting from credential theft attacks. Standard user accounts must not be members of
    the local administrators group.
  impact: ''
  references: []
  page_start: 41
  audit_raw: 'Run "Computer Management".

    Navigate to System Tools >> Local Users and Groups >> Groups.

    Review the members of the Administrators group.

    Only the appropriate administrator groups or accounts responsible for administration of

    the system may be members of the group.

    For domain-joined workstations, the Domain Admins group must be replaced by a

    domain workstation administrator group.

    Standard user accounts must not be members of the local administrator group.

    If prohibited accounts are members of the local administrators group, this is a finding.

    The built-in Administrator account or other required administrative accounts would not

    be a finding.'
  remediation: 'Configure the system to include only administrator groups or accounts that are

    responsible for the system in the local Administrators group.

    For domain-joined workstations, the Domain Admins group must be replaced by a

    domain workstation administrator group.

    Remove any standard user accounts.'
  checks:
  - type: manual_review
    info: 'Run "Computer Management".

      Navigate to System Tools >> Local Users and Groups >> Groups.

      Review the members of the Administrators group.

      Only the appropriate administrator groups or accounts responsible for administration of

      the system may be members of the group.

      For domain-joined workstations, the Domain Admins group must be replaced by a

      domain workstation administrator group.

      Standard user accounts must not be members of the local administrator group.

      If prohibited accounts are members of th'
    severity: medium
- id: '1.17'
  title: WN10-00-000075
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Only accounts responsible for the backup operations must be members of the Backup Operators group. GROUP ID:
    V-220713 RULE ID: SV-220713r991589'
  rationale: Backup Operators are able to read and write to any file in the system, regardless of the rights assigned to it.
    Backup and restore rights permit users to circumvent the file access restrictions present on NTFS disk drives for backup
    and restore purposes. Members of the Backup Operators group must have separate logon accounts for performing backup duties.
  impact: ''
  references: []
  page_start: 43
  audit_raw: 'Run "Computer Management".

    Navigate to System Tools >> Local Users and Groups >> Groups.

    Review the members of the Backup Operators group.

    If the group contains no accounts, this is not a finding.

    If the group contains any accounts, the accounts must be specifically for backup

    functions.

    If the group contains any standard user accounts used for performing normal user

    tasks, this is a finding.'
  remediation: Create separate accounts for backup operations for users with this privilege.
  checks:
  - type: manual_review
    info: 'Run "Computer Management".

      Navigate to System Tools >> Local Users and Groups >> Groups.

      Review the members of the Backup Operators group.

