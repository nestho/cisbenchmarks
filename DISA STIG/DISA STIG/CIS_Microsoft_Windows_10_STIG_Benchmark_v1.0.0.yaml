- id: '1.85'
  title: WN10-AU-000500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Application event log size must be configured to 32768 KB or greater. GROUP ID: V-220779 RULE ID: SV-220779r958752'
  rationale: Inadequate log size will cause the log to fill up quickly. This may prevent audit events from being recorded
    properly and require frequent attention by administrative personnel.
  impact: ''
  references: []
  page_start: 159
  audit_raw: 'If the system is configured to send audit records directly to an audit server, this is NA.

    This must be documented with the ISSO.

    If the following registry value does not exist or is not configured as specified, this is a

    finding:

    Registry Hive: HKEY_LOCAL_MACHINE

    Registry Path: \SOFTWARE\Policies\Microsoft\Windows\EventLog\Application\

    Value Name: MaxSize

    Value Type: REG_DWORD

    Value: 0x00008000 (32768) (or greater)'
  remediation: 'If the system is configured to send audit records directly to an audit server, this is NA.

    This must be documented with the ISSO.

    Configure the policy value for

    Computer Configuration >> Administrative Templates >> Windows Components >>

    Event Log Service >> Application >> "Specify the maximum log file size (KB)"

    to "Enabled" with a "Maximum Log Size (KB)" of "32768" or greater.'
  checks:
