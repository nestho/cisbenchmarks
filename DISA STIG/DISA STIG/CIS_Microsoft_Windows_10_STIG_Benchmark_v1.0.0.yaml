  description: 'Orphaned security identifiers (SIDs) must be removed from user rights on Windows 10. GROUP ID: V-220733 RULE
    ID: SV-220733r991589'
  rationale: Accounts or groups given rights on a system may show up as unresolved SIDs for various reasons including deletion
    of the accounts or groups. If the account or group objects are reanimated, there is a potential they may still have rights
    no longer intended. Valid domain accounts or groups may also show up as unresolved SIDs if a connection to the domain
    cannot be established for some reason.
  impact: ''
  references: []
  page_start: 76
  audit_raw: 'Review the effective User Rights setting in Local Group Policy Editor.

    Run "gpedit.msc".

    Navigate to Local Computer Policy >>

    Computer Configuration >> Windows Settings >> Security Settings >> Local

    Policies >> User Rights Assignment.

    Review each User Right listed for any unresolved SIDs to determine whether they are

    valid, such as due to being temporarily disconnected from the domain. (Unresolved

    SIDs have the format of "*S-1-…".)

    If any unresolved SIDs exist and are not for currently valid accounts or groups, this is a

    finding.'
  remediation: 'Remove any unresolved SIDs found in User Rights assignments and determined to not

    be for currently valid accounts or groups by removing the accounts or groups from the

    appropriate group policy.'
  checks:
  - type: manual_review
