- id: '1.250'
  title: WN10-UR-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Deny log on through Remote Desktop Services user right on Windows 10 workstations must at a minimum be
    configured to prevent access from highly privileged domain accounts and local accounts on domain systems and unauthenticated
    access on all systems. GROUP ID: V-220972 RULE ID: SV-220972r958472'
  rationale: Inappropriate granting of user rights can provide system, administrative, and other highlevel capabilities. The
    "Deny log on through Remote Desktop Services" right defines the accounts that are prevented from logging on using Remote
    Desktop Services. If Remote Desktop Services is not used by the organization, the Everyone group must be assigned this
    right to prevent all access. In an Active Directory Domain, denying logons to the Enterprise Admins and Domain Admins
    groups on lower trust systems helps mitigate the risk of privilege escalation from credential theft attacks, which could
    lead to the compromise of an entire domain. Local accounts on domain-joined systems must also be assigned this right to
    decrease the risk of lateral movement resulting from credential theft attacks. The Guests group must be assigned this
    right to prevent unauthenticated access.
  impact: ''
  references: []
  page_start: 420
  audit_raw: 'Verify the effective setting in Local Group Policy Editor.

    Run "gpedit.msc".

    Navigate to Local Computer Policy >>

    Computer Configuration >> Windows Settings >> Security Settings >> Local

    Policies >> User Rights Assignment.

    If the following groups or accounts are not defined for the "Deny log on through Remote

    Desktop Services" right, this is a finding:

    If Remote Desktop Services is not used by the organization, the "Everyone" group can

    replace all of the groups listed below.

    Domain Systems Only:

    Enterprise Admins group

    Domain Admins group

    Local account (see Note below)

    All Systems:

    Guests group

    Privileged Access Workstations (PAWs) dedicated to the management of Active

    Directory are exempt from denying the Enterprise Admins and Domain Admins groups.

    (See the Windows Privileged Access Workstation STIG for PAW requirements.)

    Note: "Local account" is a built-in security group used to assign user rights and

    permissions to all local accounts.'
  remediation: 'Configure the policy value for

    Computer Configuration >> Windows Settings >> Security Settings >> Local

    Policies >> User Rights Assignment >> "Deny log on through Remote Desktop

    Services"

    to include the following.

    If Remote Desktop Services is not used by the organization, assign the Everyone group

    this right to prevent all access.

    Domain Systems Only:

    Enterprise Admins group

    Domain Admins group

    Local account (see Note below)

    All Systems:

    Guests group

    Privileged Access Workstations (PAWs) dedicated to the management of Active

    Directory are exempt from denying the Enterprise Admins and Domain Admins groups.

    (See the Windows Privileged Access Workstation STIG for PAW requirements.)

    Note: "Local account" is a built-in security group used to assign user rights and

    permissions to all local accounts.'
  checks:
  - type: manual_review
    info: 'Verify the effective setting in Local Group Policy Editor.

      Run "gpedit.msc".

      Navigate to Local Computer Policy >>

      Computer Configuration >> Windows Settings >> Security Settings >> Local

      Policies >> User Rights Assignment.

      If the following groups or accounts are not defined for the "Deny log on through Remote

      Desktop Services" right, this is a finding:

      If Remote Desktop Services is not used by the organization, the "Everyone" group can

      replace all of the groups listed below.

      Domain Systems Only:'
    severity: medium
