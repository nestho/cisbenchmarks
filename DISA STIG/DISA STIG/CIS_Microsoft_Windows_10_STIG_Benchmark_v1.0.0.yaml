- id: '1.31'
  title: WN10-00-000145
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Data Execution Prevention (DEP) must be configured to at least OptOut. GROUP ID: V-220726 RULE ID: SV-220726r958928'
  rationale: Attackers are constantly looking for vulnerabilities in systems and applications. Data Execution Prevention (DEP)
    prevents harmful code from running in protected memory locations reserved for Windows and other programs.
  impact: ''
  references: []
  page_start: 63
  audit_raw: 'Verify the DEP configuration.

    Open a command prompt (cmd.exe) or PowerShell with elevated privileges (Run as

    administrator).

    Enter

    "BCDEdit /enum {current}". (If using PowerShell "{current}" must be enclosed

    in quotes.)

    If the value for "nx" is not "OptOut", this is a finding.

    (The more restrictive configuration of "AlwaysOn" would not be a finding.)'
  remediation: 'Configure DEP to at least OptOut.

    Note: Suspend BitLocker before making changes to the DEP configuration.

    Open a command prompt (cmd.exe) or PowerShell with elevated privileges (Run as

    administrator).

    Enter

    "BCDEDIT /set {current} nx OptOut". (If using PowerShell "{current}" must be

    enclosed in quotes.)

    "AlwaysOn", a more restrictive selection, is also valid but does not allow applications

    that do not function properly to be opted out of DEP.

    Opted out exceptions can be configured in the "System Properties".

    Open "System" in Control Panel.

    Select "Advanced system settings".

    Click "Settings" in the "Performance" section.

    Select the "Data Execution Prevention" tab.

    Applications that are opted out are configured in the window below the selection "Turn

    on DEP for all programs and services except those I select:".'
  checks:
  - type: manual_review
    info: 'Verify the DEP configuration.

      Open a command prompt (cmd.exe) or PowerShell with elevated privileges (Run as

      administrator).

      Enter

      "BCDEdit /enum {current}". (If using PowerShell "{current}" must be enclosed

      in quotes.)

      If the value for "nx" is not "OptOut", this is a finding.

      (The more restrictive configuration of "AlwaysOn" would not be a finding.)'
    severity: medium
