  title: WN10-00-000140
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Inbound exceptions to the firewall on Windows 10 domain workstations must only allow authorized remote management
    hosts. GROUP ID: V-220725 RULE ID: SV-220725r991589'
  rationale: Allowing inbound access to domain workstations from other systems may allow lateral movement across systems if
    credentials are compromised. Limiting inbound connections only from authorized remote management systems will help limit
    this exposure.
  impact: ''
  references: []
  page_start: 61
  audit_raw: 'Verify firewall exceptions to inbound connections on domain workstations include only

    authorized remote management hosts.

    If allowed inbound exceptions are not limited to authorized remote management hosts,

    this is a finding.

    Review inbound firewall exceptions.

    Computer Configuration >> Windows Settings >> Security Settings >> Windows

    Defender Firewall with Advanced Security >> Windows Defender Firewall with

    Advanced Security >> Inbound Rules (this link will be in the right pane)

    For any inbound rules that allow connections view the Scope for Remote IP address.

    This may be defined as an IP address, subnet, or range. The rule must apply to all

    firewall profiles.

    If a third-party firewall is used, ensure comparable settings are in place.'
  remediation: 'Configure firewall exceptions to inbound connections on domain workstations to include

    only authorized remote management hosts.

    Configure only inbound connection exceptions for authorized remote management

    hosts.

    Computer Configuration >> Windows Settings >> Security Settings >> Windows

    Defender Firewall with Advanced Security >> Windows Defender Firewall with

    Advanced Security >> Inbound Rules (this link will be in the right pane)

    For any inbound rules that allow connections, configure the Scope for Remote IP

    address to those of authorized remote management hosts. This may be defined as an

    IP address, subnet or range. Apply the rule to all firewall profiles.

    If a third-party firewall is used, configure inbound exceptions to only include authorized

    remote management hosts.'
  checks:
  - type: manual_review
    info: 'Verify firewall exceptions to inbound connections on domain workstations include only

