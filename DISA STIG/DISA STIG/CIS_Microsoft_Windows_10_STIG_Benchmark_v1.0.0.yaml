controls:
- id: '1.1'
  title: WN10-00-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Domain-joined systems must use Windows 10 Enterprise Edition 64-bit version. GROUP ID: V-220697 RULE ID: SV-220697r991589'
  rationale: Features such as Credential Guard use virtualization-based security to protect information that could be used
    in credential theft attacks if compromised. A number of system requirements must be met for Credential Guard to be configured
    and enabled properly. Virtualization-based security and Credential Guard are only available with Windows 10 Enterprise
    64-bit version.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Verify domain-joined systems are using Windows 10 Enterprise Edition 64-bit version.

    For standalone or nondomain-joined systems, this is NA.

    Open "Settings".

    Select "System", then "About".

    If "Edition" is not "Windows 10 Enterprise", this is a finding.

    If "System type" is not "64-bit operating system…", this is a finding.'
  remediation: Use Windows 10 Enterprise 64-bit version for domain-joined systems.
  checks:
  - type: manual_review
    info: 'Verify domain-joined systems are using Windows 10 Enterprise Edition 64-bit version.

      For standalone or nondomain-joined systems, this is NA.

      Open "Settings".

      Select "System", then "About".

      If "Edition" is not "Windows 10 Enterprise", this is a finding.

      If "System type" is not "64-bit operating system…", this is a finding.'
    severity: medium
- id: '1.2'
  title: WN10-00-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Windows 10 domain-joined systems must have a Trusted Platform Module (TPM) enabled and ready for use. GROUP
    ID: V-220698 RULE ID: SV-220698r991589'
  rationale: Credential Guard uses virtualization-based security to protect information that could be used in credential theft
    attacks if compromised. A number of system requirements must be met for Credential Guard to be configured and enabled
    properly. Without a TPM enabled and ready for use, Credential Guard keys are stored in a less secure method using software.
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Verify domain-joined systems have a TPM enabled and ready for use.

    For standalone or nondomain-joined systems, this is NA.

    Virtualization-based security, including Credential Guard, currently cannot be

    implemented in virtual desktop implementations (VDI) due to specific supporting

    requirements including a TPM, UEFI with Secure Boot, and the capability to run the

    Hyper-V feature within the virtual desktop.

    For VDIs where the virtual desktop instance is deleted or refreshed upon logoff, this is

    NA.

    Verify the system has a TPM and is ready for use.

    Run "tpm.msc".

    Review the sections in the center pane.

    "Status" must indicate it has been configured with a message such as "The TPM is

    ready for use" or "The TPM is on and ownership has been taken".

    TPM Manufacturer Information - Specific Version = 2.0 or 1.2

    If a TPM is not found or is not ready for use, this is a finding.'
  remediation: 'For standalone or nondomain-joined systems, this is NA.

    Virtualization-based security, including Credential Guard, currently cannot be

    implemented in VDI due to specific supporting requirements including a TPM, UEFI with

    Secure Boot, and the capability to run the Hyper-V feature within the virtual desktop.

    For VDIs where the virtual desktop instance is deleted or refreshed upon logoff, this is

    NA.

    Ensure domain-joined systems have a Trusted Platform Module (TPM) that is

    configured for use. (Versions 2.0 or 1.2 support Credential Guard.)

    The TPM must be enabled in the firmware.

    Run "tpm.msc" for configuration options in Windows.'
  checks:
  - type: manual_review
    info: 'Verify domain-joined systems have a TPM enabled and ready for use.

      For standalone or nondomain-joined systems, this is NA.

      Virtualization-based security, including Credential Guard, currently cannot be

      implemented in virtual desktop implementations (VDI) due to specific supporting

      requirements including a TPM, UEFI with Secure Boot, and the capability to run the

      Hyper-V feature within the virtual desktop.

      For VDIs where the virtual desktop instance is deleted or refreshed upon logoff, this is

      NA'
    severity: medium
- id: '1.3'
  title: WN10-00-000015
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Windows 10 systems must have Unified Extensible Firmware Interface (UEFI) firmware and be configured to run
    in UEFI mode, not Legacy BIOS. GROUP ID: V-220699 RULE ID: SV-220699r991589'
  rationale: UEFI provides additional security features in comparison to legacy BIOS firmware, including Secure Boot. UEFI
    is required to support additional security features in Windows 10, including Virtualization Based Security and Credential
    Guard. Systems with UEFI that are operating in Legacy BIOS mode will not support these security features.
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'For virtual desktop implementations (VDIs) where the virtual desktop instance is deleted

    or refreshed upon logoff, this is NA.

    Verify the system firmware is configured to run in UEFI mode, not Legacy BIOS.

    Run "System Information".

    Under "System Summary", if "BIOS Mode" does not display "UEFI", this is a finding.'
  remediation: Configure UEFI firmware to run in UEFI mode, not Legacy BIOS mode.
  checks:
  - type: manual_review
    info: 'For virtual desktop implementations (VDIs) where the virtual desktop instance is deleted

      or refreshed upon logoff, this is NA.

      Verify the system firmware is configured to run in UEFI mode, not Legacy BIOS.

      Run "System Information".

      Under "System Summary", if "BIOS Mode" does not display "UEFI", this is a finding.'
    severity: medium
- id: '1.4'
  title: WN10-00-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Secure Boot must be enabled on Windows 10 systems. GROUP ID: V-220700 RULE ID: SV-220700r991589'
  rationale: Secure Boot is a standard that ensures systems boot only to a trusted operating system. Secure Boot is required
    to support additional security features in Windows 10, including Virtualization Based Security and Credential Guard. If
    Secure Boot is turned off, these security features will not function.
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'Some older systems may not have UEFI firmware. This is currently a CAT III; it will be

    raised in severity at a future date when broad support of Windows 10 hardware and

    firmware requirements are expected to be met. Devices that have UEFI firmware must

    have Secure Boot enabled.

    For virtual desktop implementations (VDIs) where the virtual desktop instance is deleted

    or refreshed upon logoff, this is NA.

    Run "System Information".

    Under "System Summary", if "Secure Boot State" does not display "On", this is finding.'
  remediation: Enable Secure Boot in the system firmware.
  checks:
  - type: manual_review
    info: 'Some older systems may not have UEFI firmware. This is currently a CAT III; it will be

      raised in severity at a future date when broad support of Windows 10 hardware and

      firmware requirements are expected to be met. Devices that have UEFI firmware must

      have Secure Boot enabled.

      For virtual desktop implementations (VDIs) where the virtual desktop instance is deleted

      or refreshed upon logoff, this is NA.

      Run "System Information".

      Under "System Summary", if "Secure Boot State" does not display "On",'
    severity: medium
- id: '1.5'
  title: WN10-00-000025
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Windows 10 must employ automated mechanisms to determine the state of system components with regard to flaw
    remediation using the following frequency: Continuously, where ESS is used; 30 days, for any additional internal network
    scans not covered by ESS; and annually, for external scans by Computer Network Defense Service Provider (CNDSP). GROUP
    ID: V-220701 RULE ID: SV-220701r1000076'
  rationale: An approved tool for continuous network scanning must be installed and configured to run. Without the use of
    automated mechanisms to scan for security flaws on a continuous and/or periodic basis, the operating system or other system
    components may remain vulnerable to the exploits presented by undetected software flaws. To support this requirement,
    the operating system may have an integrated solution incorporating continuous scanning using ESS and periodic scanning
    using other tools, as specified in the requirement.
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'Verify DOD-approved ESS software is installed and properly operating. Ask the site

    information system security manager (ISSM) for documentation of the ESS software

    installation and configuration.

    If the ISSM is not able to provide a documented configuration for an installed ESS or if

    the ESS software is not properly maintained or used, this is a finding.

    Note: Example of documentation can be a copy of the site''s CCB approved Software

    Baseline with version of software noted or a memo from the ISSM stating current ESS

    software and version.'
  remediation: Install DOD-approved ESS software and ensure it is operating continuously.
  checks:
  - type: manual_review
    info: 'Verify DOD-approved ESS software is installed and properly operating. Ask the site

      information system security manager (ISSM) for documentation of the ESS software

      installation and configuration.

      If the ISSM is not able to provide a documented configuration for an installed ESS or if

      the ESS software is not properly maintained or used, this is a finding.

      Note: Example of documentation can be a copy of the site''s CCB approved Software

      Baseline with version of software noted or a memo from the ISS'
    severity: medium
- id: '1.6'
  title: WN10-00-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Windows 10 information systems must use BitLocker to encrypt all disks to protect the confidentiality and
    integrity of all information at rest. GROUP ID: V-220702 RULE ID: SV-220702r958552'
  rationale: If data at rest is unencrypted, it is vulnerable to disclosure. Even if the operating system enforces permissions
    on data access, an adversary can remove non-volatile memory and read it directly, thereby circumventing operating system
    controls. Encrypting the data ensures that confidentiality is protected even when the operating system is not running.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'Verify all Windows 10 information systems (including SIPRNet) employ BitLocker for full

    disk encryption.

    For virtual desktop implementations (VDIs) in which the virtual desktop instance is

    deleted or refreshed upon logoff, this is NA.

    For Azure Virtual Desktop (AVD) implementations with no data at rest, this is NA.

    If full disk encryption using BitLocker is not implemented, this is a finding.

    Verify BitLocker is turned on for the operating system drive and any fixed data drives.

    Open "BitLocker Drive Encryption" from the Control Panel.

    If the operating system drive or any fixed data drives have "Turn on BitLocker", this is a

    finding.

    NOTE: An alternate encryption application may be used in lieu of BitLocker providing it

    is configured for full disk encryption and satisfies the pre-boot authentication

    requirements (WN10-00-000031 and WN10-00-000032).'
  remediation: 'Enable full disk encryption on all information systems (including SIPRNet) using

    BitLocker.

    BitLocker, included in Windows, can be enabled in the Control Panel under "BitLocker

    Drive Encryption" as well as other management tools.

    NOTE: An alternate encryption application may be used in lieu of BitLocker providing it

    is configured for full disk encryption and satisfies the pre-boot authentication

    requirements (WN10-00-000031 and WN10-00-000032).'
  checks:
  - type: manual_review
    info: 'Verify all Windows 10 information systems (including SIPRNet) employ BitLocker for full

      disk encryption.

      For virtual desktop implementations (VDIs) in which the virtual desktop instance is

      deleted or refreshed upon logoff, this is NA.

      For Azure Virtual Desktop (AVD) implementations with no data at rest, this is NA.

      If full disk encryption using BitLocker is not implemented, this is a finding.

      Verify BitLocker is turned on for the operating system drive and any fixed data drives.

      Open "BitLocker '
    severity: medium
- id: '1.7'
  title: WN10-00-000031
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Windows 10 systems must use a BitLocker PIN for pre-boot authentication. GROUP ID: V-220703 RULE ID: SV-220703r958552'
  rationale: If data at rest is unencrypted, it is vulnerable to disclosure. Even if the operating system enforces permissions
    on data access, an adversary can remove non-volatile memory and read it directly, thereby circumventing operating system
    controls. Encrypting the data ensures that confidentiality is protected even when the operating system is not running.
    Pre-boot authentication prevents unauthorized users from accessing encrypted drives.
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'If the following registry value does not exist or is not configured as specified, this is a

    finding.

    For virtual desktop implementations (VDIs) in which the virtual desktop instance is

    deleted or refreshed upon logoff, this is NA.

    For Azure Virtual Desktop (AVD) implementations with no data at rest, this is NA.

    Registry Hive: HKEY_LOCAL_MACHINE

    Registry Path: \SOFTWARE\Policies\Microsoft\FVE\

    Value Name: UseAdvancedStartup

    Type: REG_DWORD

    Value: 0x00000001 (1)

    If one of the following registry values does not exist or is not configured

    as specified, this is a finding.

    Registry Hive: HKEY_LOCAL_MACHINE

    Registry Path: \SOFTWARE\Policies\Microsoft\FVE\

    Value Name: UseTPMPIN

    Type: REG_DWORD

    Value: 0x00000001 (1)

    Value Name: UseTPMKeyPIN

    Type: REG_DWORD

    Value: 0x00000001 (1)

    When BitLocker network unlock is used:

    Value Name: UseTPMPIN

    Type: REG_DWORD

    Value: 0x00000002 (2)

    Value Name: UseTPMKeyPIN

    Type: REG_DWORD

    Value: 0x00000002 (2)

    BitLocker network unlock may be used in conjunction with a BitLocker PIN. Refer to the

    article at the link below for information about network unlock.

    https://docs.microsoft.com/en-us/windows/security/informationprotection/bitlocker/bitlocker-how-to-enable-network-unlock'
  remediation: 'Configure the policy value for

    Computer Configuration >> Administrative Templates >> Windows Components >>

    BitLocker Drive Encryption >> Operating System Drives "Require additional

    authentication at startup"

    to "Enabled" with "Configure TPM Startup PIN:" set to "Require startup PIN with TPM"

    or with "Configure TPM startup key and PIN:" set to "Require startup key and PIN with

    TPM".'
  checks:
  - type: manual_review
    info: 'If the following registry value does not exist or is not configured as specified, this is a

      finding.

      For virtual desktop implementations (VDIs) in which the virtual desktop instance is

      deleted or refreshed upon logoff, this is NA.

      For Azure Virtual Desktop (AVD) implementations with no data at rest, this is NA.

      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\FVE\

      Value Name: UseAdvancedStartup

      Type: REG_DWORD

      Value: 0x00000001 (1)

      If one of the following registry va'
    severity: medium
- id: '1.8'
  title: WN10-00-000032
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Windows 10 systems must use a BitLocker PIN with a minimum length of six digits for pre-boot authentication.
    GROUP ID: V-220704 RULE ID: SV-220704r958552'
  rationale: If data at rest is unencrypted, it is vulnerable to disclosure. Even if the operating system enforces permissions
    on data access, an adversary can remove non-volatile memory and read it directly, thereby circumventing operating system
    controls. Encrypting the data ensures that confidentiality is protected even when the operating system is not running.
    Pre-boot authentication prevents unauthorized users from accessing encrypted drives. Increasing the PIN length requires
    a greater number of guesses for an attacker.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'If the following registry value does not exist or is not configured as specified, this is a

    finding.

    For virtual desktop implementations (VDIs) in which the virtual desktop instance is

    deleted or refreshed upon logoff, this is NA.

    For Azure Virtual Desktop (AVD) implementations with no data at rest, this is NA.

    Registry Hive: HKEY_LOCAL_MACHINE

    Registry Path: \SOFTWARE\Policies\Microsoft\FVE\

    Value Name: MinimumPIN

    Type: REG_DWORD

    Value: 0x00000006 (6) or greater'
  remediation: 'Configure the policy value for

    Computer Configuration >> Administrative Templates >> Windows Components >>

    BitLocker Drive Encryption >> Operating System Drives "Configure minimum PIN

    length for startup"

    to "Enabled" with "Minimum characters:" set to "6" or greater.'
  checks:
  - type: manual_review
    info: 'If the following registry value does not exist or is not configured as specified, this is a

      finding.

      For virtual desktop implementations (VDIs) in which the virtual desktop instance is

      deleted or refreshed upon logoff, this is NA.

      For Azure Virtual Desktop (AVD) implementations with no data at rest, this is NA.

      Registry Hive: HKEY_LOCAL_MACHINE

      Registry Path: \SOFTWARE\Policies\Microsoft\FVE\

      Value Name: MinimumPIN

      Type: REG_DWORD

      Value: 0x00000006 (6) or greater'
    severity: medium
- id: '1.9'
  title: WN10-00-000035
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must employ a deny-all, permit-by-exception policy to allow the execution of authorized
    software programs. GROUP ID: V-220705 RULE ID: SV-220705r958808'
  rationale: Utilizing an allowlist provides a configuration management method for allowing the execution of only authorized
    software. Using only authorized software decreases risk by limiting the number of potential vulnerabilities. The organization
    must identify authorized software programs and only permit execution of authorized software. The process used to identify
    software programs that are authorized to execute on organizational information systems is commonly referred to as allowlisting.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'Verify the operating system employs a deny-all, permit-by-exception policy to allow the

    execution of authorized software programs. This must include packaged apps such as

    the universal apps installed by default on systems.

    If an application allowlisting program is not in use on the system, this is a finding.

    Configuration of allowlisting applications will vary by the program.

    AppLocker is an allowlisting application built into Windows 10 Enterprise. A deny-bydefault implementation is initiated
    by enabling any AppLocker rules within a category,

    only allowing what is specified by defined rules.

    If AppLocker is used, perform the following to view the configuration of AppLocker:

    Run "PowerShell".

    Execute the following command, substituting [c:\temp\file.xml] with a location and file

    name appropriate for the system:

    Get-AppLockerPolicy -Effective -XML > c:\temp\file.xml

    This will produce an xml file with the effective settings that can be viewed in a browser

    or opened in a program such as Excel for review.

    Implementation guidance for AppLocker is available at the following link:

    https://docs.microsoft.com/en-us/windows/security/threat-protection/windows-defenderapplication-control/applocker/applocker-policies-deployment-guide'
  remediation: 'Configure an application allowlisting program to employ a deny-all, permit-by-exception

    policy to allow the execution of authorized software programs.

    Configuration of allowlisting applications will vary by the program. AppLocker is an

    allowlisting application built into Windows 10 Enterprise.

    If AppLocker is used, it is configured through group policy in

    Computer Configuration >> Windows Settings >> Security Settings >>

    Application Control Policies >> AppLocker.

    Implementation guidance for AppLocker is available at the following link:

    https://docs.microsoft.com/en-us/windows/security/threat-protection/windows-defenderapplication-control/applocker/applocker-policies-deployment-guide'
  checks:
  - type: manual_review
    info: 'Verify the operating system employs a deny-all, permit-by-exception policy to allow the

      execution of authorized software programs. This must include packaged apps such as

      the universal apps installed by default on systems.

      If an application allowlisting program is not in use on the system, this is a finding.

      Configuration of allowlisting applications will vary by the program.

      AppLocker is an allowlisting application built into Windows 10 Enterprise. A deny-bydefault implementation is initiated
      b'
    severity: medium
- id: '1.10'
  title: WN10-00-000040
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Windows 10 systems must be maintained at a supported servicing level. GROUP ID: V-220706 RULE ID: SV-220706r1050597'
  rationale: Windows 10 is maintained by Microsoft at servicing levels for specific periods of time to support Windows as
    a Service. Systems at unsupported servicing levels or releases will not receive security updates for new vulnerabilities,
    which leaves them subject to exploitation. New versions with feature updates are planned to be released on a semiannual
    basis with an estimated support timeframe of 18 to 30 months depending on the release. Support for previously released
    versions has been extended for Enterprise editions. A separate servicing branch intended for special-purpose systems is
    the Long-Term Servicing Channel (LTSC, formerly Branch - LTSB), which will receive security updates for 10 years but excludes
    feature updates.
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'Run "winver.exe".

    If the "About Windows" dialog box does not display the following or greater, this is a

    finding:

    "Microsoft Windows Version 22H2 (OS Build 19045.x)"

    Note: Microsoft has extended support for previous versions, providing critical and

    important updates for Windows 10 Enterprise.

    Microsoft scheduled end-of-support dates for current Semi-Annual Channel versions:

    v22H2 - 14 Oct 2025

    v21H2 - 13 Jun 2024

    No preview versions will be used in a production environment.

    Special-purpose systems using the Long-Term Servicing Branch\Channel (LTSC\B)

    may be at the following versions, which is not a finding:

    v1507 (Build 10240)

    v1607 (Build 14393)

    v1809 (Build 17763)

    v21H2 (Build 19044)'
  remediation: 'Update systems on the Semi-Annual Channel to "Microsoft Windows Version 22H2 (OS

    Build 19045.x)" or greater.

    It is recommended systems be upgraded to the most recently released version.

    Special-purpose systems using the LTSC\B may be at the following versions:

    v1507 (Build 10240)

    v1607 (Build 14393)

    v1809 (Build 17763)

    v21H2 (Build 19044)'
  checks:
  - type: manual_review
    info: 'Run "winver.exe".

      If the "About Windows" dialog box does not display the following or greater, this is a

      finding:

      "Microsoft Windows Version 22H2 (OS Build 19045.x)"

      Note: Microsoft has extended support for previous versions, providing critical and

      important updates for Windows 10 Enterprise.

      Microsoft scheduled end-of-support dates for current Semi-Annual Channel versions:

      v22H2 - 14 Oct 2025

      v21H2 - 13 Jun 2024

      No preview versions will be used in a production environment.

      Special-purpose syste'
    severity: medium
- id: '1.11'
  title: WN10-00-000045
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Windows 10 system must use an anti-virus program. GROUP ID: V-220707 RULE ID: SV-220707r1016358'
  rationale: Malicious software can establish a base on individual desktops and servers. Employing an automated mechanism
    to detect this type of software will aid in elimination of the software from the operating system.
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'Verify an antivirus solution is installed on the system and in use. The antivirus solution

    may be bundled with an approved Endpoint Security Solution.

    Verify if Windows Defender is in use or enabled:

    Open "PowerShell".

    Enter

    "get-service | where {$_.DisplayName -Like "*Defender*"} | Select

    Status,DisplayName"

    Verify third-party antivirus is in use or enabled:

    Open "PowerShell".

    Enter

    "get-service | where {$_.DisplayName -Like "*mcafee*"} | Select

    Status,DisplayName"

    Enter

    "get-service | where {$_.DisplayName -Like "*symantec*"} | Select

    Status,DisplayName"

    Enter

    "get-service | where {$_.DisplayName -Like "*trellix*"} | Select

    Status,DisplayName"

    If there is no antivirus solution installed on the system, this is a finding.'
  remediation: If no antivirus software is on the system and in use, install Windows Defender or a thirdparty antivirus solution.
  checks:
  - type: manual_review
    info: 'Verify an antivirus solution is installed on the system and in use. The antivirus solution

      may be bundled with an approved Endpoint Security Solution.

      Verify if Windows Defender is in use or enabled:

      Open "PowerShell".

      Enter

      "get-service | where {$_.DisplayName -Like "*Defender*"} | Select

      Status,DisplayName"

      Verify third-party antivirus is in use or enabled:

      Open "PowerShell".

      Enter

      "get-service | where {$_.DisplayName -Like "*mcafee*"} | Select

      Status,DisplayName"

      Enter

      "get-service | where {$'
    severity: medium
- id: '1.12'
  title: WN10-00-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Local volumes must be formatted using NTFS. GROUP ID: V-220708 RULE ID: SV-220708r958472'
  rationale: The ability to set access permissions and auditing is critical to maintaining the security and proper access
    controls of a system. To support this, volumes must be formatted using the NTFS file system.
  impact: ''
  references: []
  page_start: 35
  audit_raw: 'Run "Computer Management".

    Navigate to Storage >> Disk Management.

    If the "File System" column does not indicate "NTFS" for each volume assigned a drive

    letter, this is a finding.

    This does not apply to system partitions such the Recovery and EFI System Partition.'
  remediation: Format all local volumes to use NTFS.
  checks:
  - type: manual_review
    info: 'Run "Computer Management".

      Navigate to Storage >> Disk Management.

      If the "File System" column does not indicate "NTFS" for each volume assigned a drive

      letter, this is a finding.

      This does not apply to system partitions such the Recovery and EFI System Partition.'
    severity: medium
- id: '1.13'
  title: WN10-00-000055
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Alternate operating systems must not be permitted on the same system. GROUP ID: V-220709 RULE ID: SV-220709r991589'
  rationale: Allowing other operating systems to run on a secure system may allow security to be circumvented.
  impact: ''
  references: []
  page_start: 36
  audit_raw: 'Verify the system does not include other operating system installations.

    Run "Advanced System Settings".

    Select the "Advanced" tab.

    Click the "Settings" button in the "Startup and Recovery" section.

    If the drop-down list box "Default operating system:" shows any operating system other

    than Windows 10, this is a finding.'
  remediation: 'Ensure Windows 10 is the only operating system on a device. Remove alternate

    operating systems.'
  checks:
  - type: manual_review
    info: 'Verify the system does not include other operating system installations.

      Run "Advanced System Settings".

      Select the "Advanced" tab.

      Click the "Settings" button in the "Startup and Recovery" section.

      If the drop-down list box "Default operating system:" shows any operating system other

      than Windows 10, this is a finding.'
    severity: medium
- id: '1.14'
  title: WN10-00-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Non system-created file shares on a system must limit access to groups that require it. GROUP ID: V-220710
    RULE ID: SV-220710r958524'
  rationale: Shares which provide network access, should not typically exist on a workstation except for system-created administrative
    shares, and could potentially expose sensitive information. If a share is necessary, share permissions, as well as NTFS
    permissions, must be reconfigured to give the minimum access to those accounts that require it.
  impact: ''
  references: []
  page_start: 37
  audit_raw: 'Non system-created shares should not typically exist on workstations.

    If only system-created shares exist on the system this is NA.

    Run "Computer Management".

    Navigate to System Tools >> Shared Folders >> Shares.

    If the only shares listed are "ADMIN$", "C$" and "IPC$", this is NA.

    (Selecting Properties for system-created shares will display a message that it has been

    shared for administrative purposes.)

    Right click any non-system-created shares.

    Select "Properties".

    Select the "Share Permissions" tab.

    Verify the necessity of any shares found.

    If the file shares have not been reconfigured to restrict permissions to the specific

    groups or accounts that require access, this is a finding.

    Select the "Security" tab.

    If the NTFS permissions have not been reconfigured to restrict permissions to the

    specific groups or accounts that require access, this is a finding.'
  remediation: 'If a non system-created share is required on a system, configure the share and NTFS

    permissions to limit access to the specific groups or accounts that require it.

    Remove any unnecessary non-system created shares.'
  checks:
  - type: manual_review
    info: 'Non system-created shares should not typically exist on workstations.

