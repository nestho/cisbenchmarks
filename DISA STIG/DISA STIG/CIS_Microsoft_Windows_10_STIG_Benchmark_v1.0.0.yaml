- id: '1.189'
  title: WN10-SO-000015
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Local accounts with blank passwords must be restricted to prevent access from the network. GROUP ID: V-220910
    RULE ID: SV-220910r991589'
  rationale: An account without a password can allow unauthorized access to a system as only the username would be required.
    Password policies should prevent accounts with blank passwords from existing on a system. However, if a local account
    with a blank password did exist, enabling this setting will prevent network access, limiting the account to local console
    logon only.
  impact: ''
  references: []
  page_start: 326
  audit_raw: 'If the following registry value does not exist or is not configured as specified, this is a

    finding:

    Registry Hive: HKEY_LOCAL_MACHINE

    Registry Path: \SYSTEM\CurrentControlSet\Control\Lsa\

    Value Name: LimitBlankPasswordUse

    Value Type: REG_DWORD

    Value: 1'
  remediation: 'Configure the policy value for

    Computer Configuration >> Windows Settings >> Security Settings >> Local

    Policies >> Security Options >> "Accounts: Limit local account use of blank

    passwords to console logon only"

    to "Enabled".'
  checks:
  - type: manual_review
