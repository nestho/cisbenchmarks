- id: '1.231'
  title: WN10-SO-000280
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Passwords for enabled local Administrator accounts must be changed at least every 60 days. GROUP ID: V-220952
    RULE ID: SV-220952r1051038'
  rationale: The longer a password is in use, the greater the opportunity for someone to gain unauthorized knowledge of the
    password. A local Administrator account is not generally used and its password may not be changed as frequently as necessary.
    Changing the password for enabled Administrator accounts on a regular basis will limit its exposure. Windows LAPS must
    be used to change the built-in Administrator account password.
  impact: ''
  references: []
  page_start: 390
  audit_raw: 'If there are no enabled local Administrator accounts, this is Not Applicable.

    Review the password last set date for the enabled local Administrator account.

    On the standalone or domain-joined workstation:

    Open "PowerShell".

    Enter

    "Get-LocalUser -Name * | Select-Object *".

    If the "PasswordLastSet" date is greater than "60" days old for the local Administrator

    account for administering the computer/domain, this is a finding.

    Verify LAPS is configured and operational.

    Navigate to Local Computer Policy >>

    Computer Configuration >> Administrative Templates >> System >> LAPS >>

    Password Settings >> Set to enabled. Password Complexity, large letters +

    small letters + numbers + special, Password Length 14, Password Age 60. If

    not configured as shown, this is a finding.

    Verify LAPS Operational logs >> Event Viewer >> Applications and Services Logs >>

    Microsoft >> Windows >> LAPS >> Operational. Verify LAPS policy process is

    completing. If it is not, this is a finding.'
  remediation: 'Change the enabled local Administrator account password at least every 60 days.

    Windows LAPS must be used to change the built-in Administrator account password.

    Domain-joined systems can configure this to occur more frequently. LAPS will change

    the password every 30 days by default.

    More information is available at:

    https://techcommunity.microsoft.com/t5/windows-it-pro-blog/by-popular-demandwindows-laps-available-now/ba-p/3788747

