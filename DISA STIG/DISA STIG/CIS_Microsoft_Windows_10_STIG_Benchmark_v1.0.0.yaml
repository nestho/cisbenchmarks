    5.0 script block logging feature.
  impact: ''
  references: []
  page_start: 67
  audit_raw: 'Run "Windows PowerShell" with elevated privileges (run as administrator).

    Enter the following:

    Get-WindowsOptionalFeature -Online | Where FeatureName -like PowerShellv2

    If either of the following have a "State" of "Enabled", this is a finding.

    FeatureName : MicrosoftWindowsPowerShellV2

    State : Enabled

    FeatureName : MicrosoftWindowsPowerShellV2Root

    State : Enabled

    Alternately:

    Search for "Features".

    Select "Turn Windows features on or off".

    If "Windows PowerShell 2.0" (whether the subcategory of "Windows PowerShell 2.0

    Engine" is selected or not) is selected, this is a finding.'
  remediation: 'Disable "Windows PowerShell 2.0" on the system.

    Run "Windows PowerShell" with elevated privileges (run as administrator).

    Enter the following:

    Disable-WindowsOptionalFeature -Online -FeatureName

    MicrosoftWindowsPowerShellV2Root

    This command should disable both "MicrosoftWindowsPowerShellV2Root" and

    "MicrosoftWindowsPowerShellV2" which correspond to "Windows PowerShell 2.0" and

    "Windows PowerShell 2.0 Engine" respectively in "Turn Windows features on or off".

    Alternately:

    Search for "Features".

    Select "Turn Windows features on or off".

    De-select "Windows PowerShell 2.0".'
