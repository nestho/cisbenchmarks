  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Caching of logon credentials must be limited. GROUP ID: V-220923 RULE ID: SV-220923r991589'
  rationale: The default Windows configuration caches the last logon credentials for users who log on interactively to a system.
    This feature is provided for system availability reasons, such as the user's machine being disconnected from the network
    or domain controllers being unavailable. Even though the credential cache is well-protected, if a system is attacked,
    an unauthorized individual may isolate the password to a domain user account using a password-cracking program and gain
    access to the domain.
  impact: ''
  references: []
