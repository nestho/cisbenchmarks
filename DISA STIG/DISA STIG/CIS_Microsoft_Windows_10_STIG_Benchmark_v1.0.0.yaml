      If the command displays any results, this is a finding.'
- id: '1.45'
  title: WN10-AC-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Windows 10 account lockout duration must be configured to 15 minutes or greater. GROUP ID: V-220739 RULE ID:
    SV-220739r958736'
  rationale: The account lockout feature, when enabled, prevents brute-force password attacks on the system. This parameter
    specifies the amount of time that an account will remain locked after the specified number of failed logon attempts.
  impact: ''
  references: []
  page_start: 84
  audit_raw: 'Verify the effective setting in Local Group Policy Editor.

    Run "gpedit.msc".

    Navigate to Local Computer Policy >>

    Computer Configuration >> Windows Settings >> Security Settings >> Account

    Policies >> Account Lockout Policy.

    If the "Account lockout duration" is less than "15" minutes (excluding "0"), this is a

    finding.

    Configuring this to "0", requiring an administrator to unlock the account, is more

    restrictive and is not a finding.'
  remediation: 'Configure the policy value for

    Computer Configuration >> Windows Settings >> Security Settings >> Account

    Policies >> Account Lockout Policy >> "Account lockout duration"

    to "15" minutes or greater.

    A value of "0" is also acceptable, requiring an administrator to unlock the account.'
  checks:
  - type: manual_review
    info: 'Verify the effective setting in Local Group Policy Editor.

      Run "gpedit.msc".

      Navigate to Local Computer Policy >>

      Computer Configuration >> Windows Settings >> Security Settings >> Account

      Policies >> Account Lockout Policy.

      If the "Account lockout duration" is less than "15" minutes (excluding "0"), this is a

      finding.

      Configuring this to "0", requiring an administrator to unlock the account, is more

      restrictive and is not a finding.'
    severity: medium
- id: '1.46'
  title: WN10-AC-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The number of allowed bad logon attempts must be configured to 3 or less. GROUP ID: V-220740 RULE ID: SV-220740r958388'
  rationale: The account lockout feature, when enabled, prevents brute-force password attacks on the system. The higher this
    value is, the less effective the account lockout feature will be in protecting the local system. The number of bad logon
    attempts must be reasonably small to minimize the possibility of a successful password attack, while allowing for honest
    errors made during a normal user logon.
  impact: ''
  references: []
  page_start: 85
  audit_raw: 'Verify the effective setting in Local Group Policy Editor.

    Run "gpedit.msc".

    Navigate to Local Computer Policy >>

    Computer Configuration >> Windows Settings >> Security Settings >> Account

    Policies >> Account Lockout Policy.

    If the "Account lockout threshold" is "0" or more than "3" attempts, this is a finding.'
  remediation: 'Configure the policy value for

    Computer Configuration >> Windows Settings >> Security Settings >> Account

    Policies >> Account Lockout Policy >> "Account lockout threshold"

    to "3" or less invalid logon attempts (excluding "0" which is unacceptable).'
  checks:
  - type: manual_review
    info: 'Verify the effective setting in Local Group Policy Editor.

      Run "gpedit.msc".

      Navigate to Local Computer Policy >>

      Computer Configuration >> Windows Settings >> Security Settings >> Account

      Policies >> Account Lockout Policy.

      If the "Account lockout threshold" is "0" or more than "3" attempts, this is a finding.'
    severity: medium
