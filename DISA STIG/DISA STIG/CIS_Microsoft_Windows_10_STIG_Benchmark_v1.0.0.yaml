  description: 'The maximum password age must be configured to 60 days or less. GROUP ID: V-220743 RULE ID: SV-220743r1051020'
  rationale: The longer a password is in use, the greater the opportunity for someone to gain unauthorized knowledge of the
    passwords. Scheduled changing of passwords hinders the ability of unauthorized system users to crack passwords and gain
    access to a system.
  impact: ''
  references: []
