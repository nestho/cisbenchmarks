- id: '1.88'
  title: WN10-AU-000515
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Windows 10 permissions for the Application event log must prevent access by nonprivileged accounts. GROUP
    ID: V-220782 RULE ID: SV-220782r958434'
  rationale: Maintaining an audit trail of system activity logs can help identify configuration errors, troubleshoot service
    disruptions, and analyze compromises that have occurred, as well as detect attacks. Audit logs are necessary to provide
    a trail of evidence in case the system or network is compromised. The Application event log may be susceptible to tampering
    if proper permissions are not applied.
  impact: ''
  references: []
  page_start: 162
  audit_raw: 'Verify the permissions on the Application event log (Application.evtx). Standard user

    accounts or groups must not have access. The default permissions listed below satisfy

    this requirement.

    Eventlog - Full Control

    SYSTEM - Full Control

    Administrators - Full Control

    The default location is the "%SystemRoot%\SYSTEM32\WINEVT\LOGS" directory.

    They may have been moved to another folder.

    If the permissions for these files are not as restrictive as the ACLs listed, this is a

    finding.

    NOTE: If "APPLICATION PACKAGE AUTHORITY\ALL APPLICATION PACKAGES"

    has Special Permissions, this would not be a finding.'
  remediation: 'Ensure the permissions on the Application event log (Application.evtx) are configured to

    prevent standard user accounts or groups from having access. The default permissions

    listed below satisfy this requirement.

    Eventlog - Full Control

    SYSTEM - Full Control

    Administrators - Full Control

    The default location is the "%SystemRoot%\SYSTEM32\WINEVT\LOGS" directory.

    If the location of the logs has been changed, when adding Eventlog to the permissions,

    it must be entered as "NT Service\Eventlog".'
  checks:
  - type: manual_review
    info: 'Verify the permissions on the Application event log (Application.evtx). Standard user

      accounts or groups must not have access. The default permissions listed below satisfy

      this requirement.

      Eventlog - Full Control

