    Computer\HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Cryptography\Calais\Smart

    Cards'
  remediation: 'For nondomain-joined systems, configuring Windows Hello for sign-on options is

    suggested based on the organization''s needs and capabilities.'
  checks:
