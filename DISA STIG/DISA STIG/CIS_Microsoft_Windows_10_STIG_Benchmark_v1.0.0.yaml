- id: '1.48'
  title: WN10-AC-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The password history must be configured to 24 passwords remembered. GROUP ID: V-220742 RULE ID: SV-220742r1000079'
  rationale: A system is more vulnerable to unauthorized access when system users recycle the same password several times
    without being required to change a password to a unique password on a regularly scheduled basis. This enables users to
    effectively negate the purpose of mandating periodic password changes. The default value is 24 for Windows domain systems.
    DOD has decided this is the appropriate value for all Windows systems.
  impact: ''
  references: []
  page_start: 88
  audit_raw: 'Verify the effective setting in Local Group Policy Editor.

    Run "gpedit.msc".

    Navigate to Local Computer Policy >>

    Computer Configuration >> Windows Settings >> Security Settings >> Account

    Policies >> Password Policy.

    If the value for "Enforce password history" is less than "24" passwords remembered,

    this is a finding.'
  remediation: 'Configure the policy value for

    Computer Configuration >> Windows Settings >> Security Settings >> Account

    Policies >> Password Policy >> "Enforce password history"

    to "24" passwords remembered.'
  checks:
  - type: manual_review
    info: 'Verify the effective setting in Local Group Policy Editor.

