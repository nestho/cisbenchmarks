    command:

    sudo zypper in openssh

    Enable the OpenSSH service to start automatically on reboot with the following

    command:

    sudo systemctl enable sshd.service

    For the changes to take effect immediately, start the service with the following

    command:

    sudo systemctl restart sshd.service'
