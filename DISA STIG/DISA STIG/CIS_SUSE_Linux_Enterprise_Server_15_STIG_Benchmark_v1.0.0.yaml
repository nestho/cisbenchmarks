  description: 'The SUSE operating system audit event multiplexor must be configured to use Kerberos. GROUP ID: V-234967 RULE
    ID: SV-234967r1009567'
  rationale: Information stored in one location is vulnerable to accidental or incidental deletion or alteration. Allowing
    devices and users to connect to or from the system without first authenticating them allows untrusted access and can lead
    to a compromise or attack. Audit events that may include sensitive data must be encrypted prior to transmission. Kerberos
    provides a mechanism to provide both authentication and encryption for audit event records.
