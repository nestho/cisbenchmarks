- id: '1.159'
  title: SLES-15-030740
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must generate audit records for all uses of the unlink, unlinkat, rename, renameat,
    and rmdir system calls. GROUP ID: V-234973 RULE ID: SV-234973r991577'
  rationale: Without generating audit records specific to the security and mission needs of the organization, it would be
    difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible for
    one. Audit records can be generated from various components within the information system (e.g., module or policy filter).
    The system call rules are loaded into a matching engine that intercepts each syscall made by all programs on the system.
    Therefore, it is very important to use syscall rules only when absolutely necessary, since these affect performance. The
    more rules, the bigger the performance hit. The performance can be helped, however, by combining syscalls into one rule
    whenever possible.
  impact: ''
  references: []
  page_start: 346
  audit_raw: 'Verify the SUSE operating system generates an audit record for all uses of the "unlink",

    "unlinkat", "rename", "renameat", and "rmdir" system calls.

    Check that the system calls are being audited by performing the following command:

    sudo auditctl -l | grep ''unlink\|rename\|rmdir''

    -a always,exit -F arch=b32 -S unlink,unlinkat,rename,renameat,rmdir -F

    auid>=1000 -F auid!=-1 -k perm_mod

    -a always,exit -F arch=b64 -S unlink,unlinkat,rename,renameat,rmdir -F

    auid>=1000 -F auid!=-1 -k perm_mod

    If both the "b32" and "b64" audit rules are not defined for the "unlink", "unlinkat",

    "rename", "renameat", and "rmdir" syscalls, this is a finding.

    Note:

    The "-k" allows for specifying an arbitrary identifier. The string following "-k" does not

    need to match the example output above.'
  remediation: 'Configure the SUSE operating system to generate an audit record for all uses of the

    "unlink", "unlinkat", "rename", "renameat", and "rmdir" system calls.

    Add or update the following rules to "/etc/audit/rules.d/audit.rules":

    -a always,exit -F arch=b32 -S unlink,unlinkat,rename,renameat,rmdir -F

    auid>=1000 -F auid!=4294967295 -k perm_mod

    -a always,exit -F arch=b64 -S unlink,unlinkat,rename,renameat,rmdir -F

    auid>=1000 -F auid!=4294967295 -k perm_mod

    To reload the rules file, restart the audit daemon:

    sudo systemctl restart auditd.service

    or issue the following command:

    sudo augenrules --load'
  checks:
  - type: command
    command: sudo auditctl -l | grep 'unlink\|rename\|rmdir'
    expected: ''
    severity: medium
    info: 'Verify the SUSE operating system generates an audit record for all uses of the "unlink",

      "unlinkat", "rename", "renameat", and "rmdir" system calls.

      Check that the system calls are being audited by performing the following command:

      sudo auditctl -l | grep ''unlink\|rename\|rmdir''

      -a always,exit -F arch=b32 -S unlink,unlinkat,rename,renameat,rmdir -F

      auid>=1000 -F auid!=-1 -k perm_mod

      -a always,exit'
