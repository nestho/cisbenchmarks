    system. For every existing temporary account, run the following command to obtain its

    account expiration information:

    sudo chage -l system_account_name

    Verify each of these accounts has an expiration date that is within "72" hours of its

    creation.

    If any temporary accounts have no expiration date set or do not expire within "72" hours

    of their creation, this is a finding.'
  remediation: 'In the event temporary accounts are required, configure the SUSE operating system to

    terminate them after "72" hours.

    For every temporary account, run the following command to set an expiration date on it,

    substituting "system_account_name" with the appropriate value:

    sudo chage -E `date -d "+3 days" +%Y-%m-%d` system_account_name

    date -d "+3 days" +%Y-%m-%d

    sets the 72-hour expiration date for the account at the time the command is run.'
