  rationale: 'Using an authentication device, such as a Common Access Card (CAC) or token that is separate from the information
    system, ensures that even if the information system is compromised, that compromise will not affect credentials stored
    on the authentication device. Multifactor solutions that require devices separate from information systems gaining access
    include, for example, hardware tokens providing time-based or challengeresponse authenticators and smart cards such as
    the U.S. Government Personal Identity Verification (PIV) card and the DOD CAC. A privileged account is defined as an information
    system account with authorizations of a privileged user. Remote access is access to DOD nonpublic information systems
    by an authorized user (or an information system) communicating through an external, nonorganizationcontrolled network.
    Remote access methods include, for example, dial-up, broadband, and wireless. This requirement only applies to components
    where this is specific to the function of the device or has the concept of an organizational user (e.g., VPN, proxy capability).
    This does not apply to authentication for the purpose of configuring the device itself (management). Satisfies: SRG-OS-000068-GPOS-00036,
    SRG-OS-000105-GPOS-00052, SRG-OS000106-GPOS-00053, SRG-OS-000107-GPOS-00054, SRG-OS-000108-GPOS-00055, SRG-OS-000375-GPOS-00160,
    SRG-OS-000376-GPOS-00161, SRG-OS-000377GPOS-00162'
  impact: ''
  references: []
