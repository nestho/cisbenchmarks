  page_start: 437
  audit_raw: 'Verify the SUSE operating system disables unattended or automatic logon via SSH.

    Check that unattended or automatic logon via SSH is disabled with the following

    command:

    sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr

    ''\n'' '' '' | xargs sudo grep -iEH ''^\s*(permit(.*?)(passwords|environment))''

    PermitEmptyPasswords no

    PermitUserEnvironment no

    If "PermitEmptyPasswords" or "PermitUserEnvironment" keywords are not set to "no",

    are missing completely, or are commented out, this is a finding.'
