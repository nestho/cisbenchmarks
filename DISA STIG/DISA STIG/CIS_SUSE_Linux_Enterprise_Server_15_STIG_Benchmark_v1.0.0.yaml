- id: '1.22'
  title: SLES-15-010230
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must not have duplicate User IDs (UIDs) for interactive users. GROUP ID: V-234822
    RULE ID: SV-234822r958482'
  rationale: 'To ensure accountability and prevent unauthenticated access, interactive users must be identified and authenticated
    to prevent potential misuse and compromise of the system. Interactive users include organizational employees or individuals
    the organization deems to have equivalent status of employees (e.g., contractors). Interactive users (and processes acting
    on behalf of users) must be uniquely identified and authenticated to all accesses, except for the following: 1. Accesses
    explicitly identified and documented by the organization. Organizations document specific user actions that can be performed
    on the information system without identification or authentication; and 2. Accesses that occur through authorized use
    of group authenticators without individual authentication. Organizations may require unique identification of individuals
    in group accounts (e.g., shared privilege accounts) or for detailed accountability of individual activity. Satisfies:
    SRG-OS-000104-GPOS-00051, SRG-OS-000121-GPOS-00062'
  impact: ''
  references: []
