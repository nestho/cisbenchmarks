controls:
- id: '1.1'
  title: SLES-15-010000
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The SUSE operating system must be a vendor-supported release. GROUP ID: V-234800 RULE ID: SV-234800r991589'
  rationale: A SUSE operating system release is considered "supported" if the vendor continues to provide security patches
    for the product. With an unsupported release, it will not be possible to resolve security issues discovered in the system
    software.
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'Verify the SUSE operating system is a vendor-supported release.

    Use the following command to verify the SUSE operating system is a vendor-supported

    release:

    cat /etc/os-release

    NAME="SLES"

    VERSION="15"

    Or any SUSE Linux Enterprise 15 Service Pack follow up release.

    NAME="SLES"

    VERSION="15-SPx"

    Current End of Life for SLES 15 General Support is 31 Jul 2028 and Long-term Support

    is until 31 Jul 2031.

    If the release is not supported by the vendor, this is a finding.'
  remediation: 'Upgrade the SUSE operating system to a version supported by the vendor. If the

    system is not registered with the SUSE Customer Center, register the system against

    the correct subscription.

    If the system requires Long-Term Service Pack Support (LTSS), obtain the correct

    LTSS subscription for the system.'
  checks:
  - type: command
    command: cat /etc/os-release
    expected: ''
    severity: medium
    info: 'Verify the SUSE operating system is a vendor-supported release.

      Use the following command to verify the SUSE operating system is a vendor-supported

      release:

      cat /etc/os-release

      NAME="SLES"

      VERSION="15"

      Or any SUSE Linux Enterprise 15 Service Pack follow up release.

      NAME="SLES"

      VERSION="15-SPx"

      Current End of Life for SLES 15 General Support is 31 Jul 2028 and Long-term Support

      is until 31 Jul 2031'
- id: '1.2'
  title: SLES-15-010010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Vendor-packaged SUSE operating system security patches and updates must be installed and up to date. GROUP
    ID: V-234802 RULE ID: SV-234802r991589'
  rationale: Timely patching is critical for maintaining the operational availability, confidentiality, and integrity of information
    technology (IT) systems. However, failure to keep SUSE operating system and application software patched is a common mistake
    made by IT professionals. New patches are released frequently, and it is often difficult for even experienced System Administrators
    (SAs) to keep abreast of all the new patches. When new weaknesses in a SUSE operating system exist, patches are usually
    made available by the vendor to resolve the problems. If the most recent security patches and updates are not installed,
    unauthorized users may take advantage of weaknesses in the unpatched software. The lack of prompt attention to patching
    could result in a system compromise.
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Verify the SUSE operating system security patches and updates are installed and up to

    date.

    Note: Updates are required to be applied with a frequency determined by the site or

    Program Management Office (PMO).

    Check for required SUSE operating system patches and updates with the following

    command:

    sudo zypper patch-check

    0 patches needed (0 security patches)

    If the patch repository data is corrupt, check that the available package security updates

    have been installed on the system with the following command:

    cut -d "|" -f 1-4 -s --output-delimiter " | " /var/log/zypp/history | grep -v

    " radd "

    2016-12-14 11:59:36 | install | libapparmor1-32bit | 2.8.0-2.4.1

    2016-12-14 11:59:36 | install | pam_apparmor | 2.8.0-2.4.1

    2016-12-14 11:59:36 | install | pam_apparmor-32bit | 2.8.0-2.4.1

    If the SUSE operating system has not been patched within the site or PMO frequency,

    this is a finding.'
  remediation: 'Install the applicable SUSE operating system patches available from SUSE by running

    the following command:

    sudo zypper patch'
  checks:
  - type: command
    command: cut -d "|" -f 1-4 -s --output-delimiter " | " /var/log/zypp/history | grep -v
    expected: ''
    severity: medium
    info: 'Verify the SUSE operating system security patches and updates are installed and up to

      date.

      Note: Updates are required to be applied with a frequency determined by the site or

      Program Management Office (PMO).

