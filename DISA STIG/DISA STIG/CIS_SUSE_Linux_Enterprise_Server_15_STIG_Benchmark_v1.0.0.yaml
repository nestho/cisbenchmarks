    one uppercase character be used by using the following command:

    grep pam_cracklib.so /etc/pam.d/common-password

    password requisite pam_cracklib.so ucredit=-1

    If the command does not return anything, the returned line is commented out, or has a

    second column value different from "requisite", or does not contain "ucredit=-1", this is a

    finding.'
  remediation: 'Configure the SUSE operating system to enforce password complexity by requiring at

    least one uppercase character.

    Edit "/etc/pam.d/common-password" and edit the line containing "pam_cracklib.so" to

    contain the option "ucredit=-1" after the third column.'
