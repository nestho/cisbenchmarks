  description: 'The SUSE operating system must enforce passwords that contain at least one uppercase character. GROUP ID:
    V-234882 RULE ID: SV-234882r1009621'
  rationale: Use of a complex password helps increase the time and resources required to compromise the password. Password
    complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force
    attacks. Password complexity is one factor of several that determines how long it takes to crack a password. The more
    complex the password, the greater the number of possible combinations that need to be tested before the password is compromised.
  impact: ''
  references: []
  page_start: 189
  audit_raw: 'Verify the SUSE operating system enforces password complexity by requiring at least

    one uppercase character.

