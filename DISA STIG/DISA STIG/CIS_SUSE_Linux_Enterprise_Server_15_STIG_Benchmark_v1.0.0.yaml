  description: 'All SUSE operating system persistent disk partitions must implement cryptographic mechanisms to prevent unauthorized
    disclosure or modification of all information that requires at-rest protection. GROUP ID: V-234831 RULE ID: SV-234831r1009558'
  rationale: 'SUSE operating systems handling data requiring data-at-rest protections must employ cryptographic mechanisms
    to prevent unauthorized disclosure and modification of the information at rest. Selection of a cryptographic mechanism
    is based on the need to protect the integrity of organizational information. The strength of the mechanism is commensurate
    with the security category and/or classification of the information. Organizations have the flexibility to either encrypt
    all information on storage devices (i.e., full disk encryption) or encrypt specific data structures (e.g., files, records,
    or fields). Satisfies: SRG-OS-000185-GPOS-00079, SRG-OS-000404-GPOS-00183, SRG-OS000405-GPOS-00184'
  impact: ''
  references: []
