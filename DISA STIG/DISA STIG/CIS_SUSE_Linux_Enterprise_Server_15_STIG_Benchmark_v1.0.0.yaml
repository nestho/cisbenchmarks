- id: '1.150'
  title: SLES-15-030630
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system file integrity tool must be configured to protect the integrity of the audit tools.
    GROUP ID: V-234962 RULE ID: SV-234962r991567'
  rationale: Protecting the integrity of the tools used for auditing purposes is a critical step toward ensuring the integrity
    of audit information. Audit information includes all information (e.g., audit records, audit settings, and audit reports)
    needed to successfully audit information system activity. Audit tools include but are not limited to vendor-provided and
    open-source audit tools needed to successfully view and manipulate audit information system activity and records. Audit
    tools include custom queries and report generators. It is not uncommon for attackers to replace the audit tools or inject
    code into the existing tools to provide the capability to hide or erase system activity from the audit logs. To address
    this risk, audit tools must be cryptographically signed to provide the capability to identify when the audit tools have
    been modified, manipulated, or replaced. An example is a checksum hash of the file or files.
  impact: ''
  references: []
  page_start: 327
  audit_raw: 'Verify that the SUSE operating system file integrity tool is configured to protect the

    integrity of the audit tools.

    Check that AIDE is properly configured to protect the integrity of the audit tools by

    running the following command:

    sudo grep /usr/sbin/au /etc/aide.conf

    /usr/sbin/auditctl p+i+n+u+g+s+b+acl+selinux+xattrs+sha512

    /usr/sbin/auditd p+i+n+u+g+s+b+acl+selinux+xattrs+sha512

    /usr/sbin/ausearch p+i+n+u+g+s+b+acl+selinux+xattrs+sha512

    /usr/sbin/aureport p+i+n+u+g+s+b+acl+selinux+xattrs+sha512

    /usr/sbin/autrace p+i+n+u+g+s+b+acl+selinux+xattrs+sha512

    /usr/sbin/audispd p+i+n+u+g+s+b+acl+selinux+xattrs+sha512

    /usr/sbin/augenrules p+i+n+u+g+s+b+acl+selinux+xattrs+sha512

    If AIDE is properly configured to protect the integrity of the audit tools, all lines listed

    above will be returned from the command.

    If one or more lines are missing, or is commented out, this is a finding.'
  remediation: 'Configure the SUSE operating system file integrity tool to protect the integrity of the

    audit tools.

    Add or update the following lines to "/etc/aide.conf" to protect the integrity of the audit

    tools:

    # audit tools

    /usr/sbin/auditctl p+i+n+u+g+s+b+acl+selinux+xattrs+sha512

    /usr/sbin/auditd p+i+n+u+g+s+b+acl+selinux+xattrs+sha512

    /usr/sbin/ausearch p+i+n+u+g+s+b+acl+selinux+xattrs+sha512

    /usr/sbin/aureport p+i+n+u+g+s+b+acl+selinux+xattrs+sha512

    /usr/sbin/autrace p+i+n+u+g+s+b+acl+selinux+xattrs+sha512

    /usr/sbin/audispd p+i+n+u+g+s+b+acl+selinux+xattrs+sha512

    /usr/sbin/augenrules p+i+n+u+g+s+b+acl+selinux+xattrs+sha512'
  checks:
  - type: manual_review
    info: 'Verify that the SUSE operating system file integrity tool is configured to protect the

      integrity of the audit tools.

      Check that AIDE is properly configured to protect the integrity of the audit tools by

      running the following command:

      sudo grep /usr/sbin/au /etc/aide.conf

      /usr/sbin/auditctl p+i+n+u+g+s+b+acl+selinux+xattrs+sha512

      /usr/sbin/auditd p+i+n+u+g+s+b+acl+selinux+xattrs+sha512

      /usr/sbin/ausearch p+i+n+u+g+s+b+acl+selinux+xattrs+sha512

      /usr/sbin/aureport p+i+n+u+g+s+b+acl+selinux+xattrs+s'
    severity: medium
- id: '1.151'
  title: SLES-15-030640
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The SUSE operating system must generate audit records for all uses of the privileged functions. GROUP ID:
    V-234963 RULE ID: SV-234963r1009638'
  rationale: 'Misuse of privileged functions, either intentionally or unintentionally by authorized users, or by unauthorized
    external entities that have compromised information system accounts, is a serious and ongoing concern and can have significant
    adverse impacts on organizations. Auditing the use of privileged functions is one way to detect such misuse and identify
    the risk from insider threats and the advanced persistent threat. Satisfies: SRG-OS-000327-GPOS-00127, SRG-OS-000337-GPOS-00129,
    SRG-OS000348-GPOS-00136, SRG-OS-000349-GPOS-00137, SRG-OS-000350-GPOS-00138, SRG-OS-000351-GPOS-00139, SRG-OS-000352-GPOS-00140,
    SRG-OS-000353GPOS-00141, SRG-OS-000354-GPOS-00142, SRG-OS-000358-GPOS-00145, SRGOS-000359-GPOS-00146, SRG-OS-000365-GPOS-00152'
  impact: ''
  references: []
  page_start: 329
  audit_raw: 'Verify the SUSE operating system generates an audit record for any privileged use of

    the "execve" system call.

    sudo auditctl -l | grep -w ''execve''

    -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k setuid

    -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k setuid

    -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k setgid

    -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k setgid

    If both the "b32" and "b64" audit rules for "SUID" files are not defined, this is a finding.

    If both the "b32" and "b64" audit rules for "SGID" files are not defined, this is a finding.

    Note: The "-k" allows for specifying an arbitrary identifier. The string following "-k" does

    not need to match the example output above.'
  remediation: 'Configure the SUSE operating system to generate an audit record for any privileged use

    of the "execve" system call.

    Add or update the following rules in "/etc/audit/rules.d/audit.rules":

    -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k setuid

    -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k setuid

    -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k setgid

    -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k setgid

    To reload the rules file, restart the audit daemon:

    sudo systemctl restart auditd.service

    or issue the following command:

    sudo augenrules --load'
  checks:
  - type: command
    command: sudo auditctl -l | grep -w 'execve'
    expected: ''
    severity: medium
    info: 'Verify the SUSE operating system generates an audit record for any privileged use of

      the "execve" system call.

      sudo auditctl -l | grep -w ''execve''

      -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k setuid

      -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k setuid

      -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k setgid

      -a always,exit -F arch=b64 -S execve -C gid'
- id: '1.152'
  title: SLES-15-030650
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must have the auditing package installed. GROUP ID: V-234964 RULE ID: SV-234964r1009639'
  rationale: 'Without establishing what type of events occurred, the source of events, where events occurred, and the outcome
    of events, it would be difficult to establish, correlate, and investigate the events leading up to an outage or attack.
    Audit record content that may be necessary to satisfy this requirement includes, for example, time stamps, source and
    destination addresses, user/process identifiers, event descriptions, success/fail indications, filenames involved, and
    access control or flow control rules invoked. Associating event types with detected events in the SUSE operating system
    audit logs provides a means of investigating an attack, recognizing resource utilization or capacity thresholds, or identifying
    an improperly configured SUSE operating system. Satisfies: SRG-OS-000337-GPOS-00129, SRG-OS-000348-GPOS-00136, SRG-OS000349-GPOS-00137,
    SRG-OS-000350-GPOS-00138, SRG-OS-000351-GPOS-00139, SRG-OS-000352-GPOS-00140, SRG-OS-000353-GPOS-00141, SRG-OS-000354GPOS-00142,
    SRG-OS-000358-GPOS-00145, SRG-OS-000359-GPOS-00146, SRGOS-000365-GPOS-00152, SRG-OS-000474-GPOS-00219, SRG-OS-000475-GPOS00220'
  impact: ''
  references: []
  page_start: 332
  audit_raw: 'Verify the SUSE operating system auditing package is installed.

