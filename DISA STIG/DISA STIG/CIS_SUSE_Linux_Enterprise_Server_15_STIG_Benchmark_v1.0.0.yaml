    ''\n'' '' '' | xargs sudo grep -iH ''^\s*x11forwarding''

    X11Forwarding no

    If the "X11Forwarding" keyword is set to "yes" and is not documented with the

    information system security officer (ISSO) as an operational requirement, is missing, or

    is commented out, this is a finding.'
  remediation: 'Configure the SUSE operating system SSH daemon to disable forwarded X connections

    for interactive users.

    Edit the "/etc/ssh/sshd_config" file to uncomment or add the line for the

    "X11Forwarding" keyword and set its value to "no" (this file may be named differently or

    be in a different location if using a version of SSH that is provided by a third-party

    vendor):

    X11Forwarding no'
