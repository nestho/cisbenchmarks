- id: '1.68'
  title: SLES-15-020000
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must provision temporary accounts with an expiration date for 72 hours. GROUP ID:
    V-234866 RULE ID: SV-234866r958364'
  rationale: If temporary user accounts remain active when no longer needed or for an excessive period, these accounts may
    be used to gain unauthorized access. To mitigate this risk, automated termination of all temporary accounts must be set
    upon account creation. Temporary accounts are established as part of normal account activation procedures when there is
    a need for short-term accounts without the demand for immediacy in account activation. If temporary accounts are used,
    the SUSE operating system must be configured to automatically terminate these types of accounts after a DoD-defined time
    period of 72 hours. To address access requirements, many SUSE operating systems may be integrated with enterprise-level
    authentication/access mechanisms that meet or exceed access control policy requirements.
  impact: ''
  references: []
  page_start: 155
  audit_raw: 'Verify that the SUSE operating system provisions temporary accounts with an expiration

    date for "72" hours.

