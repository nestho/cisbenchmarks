    sudo grep action_mail /etc/audit/auditd.conf

    action_mail_acct = root

    If the value of the "action_mail_acct" keyword is not set to "root" and/or other accounts

    for security personnel, the "action_mail_acct" keyword is missing, or the returned line is

    commented out, this is a finding.'
