- id: '1.56'
  title: SLES-15-010460
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must have the packages required for multifactor authentication to be installed.
    GROUP ID: V-234854 RULE ID: SV-234854r1009615'
  rationale: 'Using an authentication device, such as a Common Access Card (CAC) or token separate from the information system,
    ensures that even if the information system is compromised, that compromise will not affect credentials stored on the
    authentication device. Multifactor solutions that require devices separate from information systems gaining access include,
    for example, hardware tokens providing time-based or challengeresponse authenticators and smart cards such as the U.S.
    Government Personal Identity Verification (PIV) card and the DOD CAC. A privileged account is defined as an information
    system account with authorizations of a privileged user. Remote access is access to DOD nonpublic information systems
    by an authorized user (or an information system) communicating through an external, nonorganizationcontrolled network.
    Remote access methods include, for example, dial-up, broadband, and wireless. This requirement only applies to components
    where this is specific to the function of the device or has the concept of an organizational user (e.g., VPN, proxy capability).
    This does not apply to authentication for the purpose of configuring the device itself (management). Satisfies: SRG-OS-000375-GPOS-00160,
    SRG-OS-000376-GPOS-00161, SRG-OS000377-GPOS-00162'
  impact: ''
  references: []
  page_start: 134
  audit_raw: 'Verify the SUSE operating system has the packages required for multifactor

    authentication installed.

    Check for the presence of the packages required to support multifactor authentication

    with the following commands:

    zypper info pam_pkcs11 | grep -i installed

    zypper info mozilla-nss | grep -i installed

    zypper info mozilla-nss-tools | grep -i installed

    zypper info pcsc-ccid | grep -i installed

    zypper info pcsc-lite | grep -i installed

    zypper info pcsc-tools | grep -i installed

    zypper info opensc | grep -i installed

    zypper info coolkey | grep -i installed

    If any of the packages required for multifactor authentication are not installed, this is a

    finding.'
  remediation: 'Configure the SUSE operating system to implement multifactor authentication by

    installing the required packages.

    Install the packages required to support multifactor authentication with the following

    commands:

    zypper install pam_pkcs11

    zypper install mozilla-nss

    zypper install mozilla-nss-tools

    zypper install pcsc-ccid

    zypper install pcsc-lite

    zypper install pcsc-tools

    zypper install opensc

    zypper install coolkey

    Additional information on the configuration of multifactor authentication on the SUSE

    operating system can be found at https://www.suse.com/communities/blog/configuringsmart-card-authentication-suse-linux-enterprise/.'
  checks:
  - type: command
    command: zypper info pam_pkcs11 | grep -i installed && zypper info mozilla-nss | grep -i installed && zypper info mozilla-nss-tools
      | grep -i installed && zypper info pcsc-ccid | grep -i installed && zypper info pcsc-lite | grep -i installed && zypper
      info pcsc-tools | grep -i installed && zypper info opensc | grep -i installed && zypper info coolkey | grep -i installed
    expected: ''
    severity: medium
    info: 'Verify the SUSE operating system has the packages required for multifactor

      authentication installed.

      Check for the presence of the packages required to support multifactor authentication

      with the following commands:

      zypper info pam_pkcs11 | grep -i installed

      zypper info mozilla-nss | grep -i installed

      zypper info mozilla-nss-tools | grep -i installed

      zypper info pcsc-ccid | grep -i installed

      zyppe'
