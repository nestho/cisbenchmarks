- id: '1.15'
  title: SLES-15-010150
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must log SSH connection attempts and failures to the server. GROUP ID: V-234815
    RULE ID: SV-234815r958406'
  rationale: Remote access services, such as those providing remote access to network devices and information systems, which
    lack automated monitoring capabilities, increase risk and make remote user access management difficult at best. Remote
    access is access to DOD nonpublic information systems by an authorized user (or an information system) communicating through
    an external, nonorganizationcontrolled network. Remote access methods include, for example, dial-up, broadband, and wireless.
    Automated monitoring of remote access sessions allows organizations to detect cyber attacks and also ensure ongoing compliance
    with remote access policies by auditing connection activities of remote access capabilities, such as Remote Desktop Protocol
    (RDP), on a variety of information system components (e.g., servers, workstations, notebook computers, smartphones, and
    tablets).
  impact: ''
  references: []
  page_start: 49
  audit_raw: 'Verify SSH is configured to verbosely log connection attempts and failed logon attempts

    to the SUSE operating system.

    Check that the SSH daemon configuration verbosely logs connection attempts and

    failed logon attempts to the server with the following command:

    sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr

    ''\n'' '' '' | xargs sudo grep -iH ''^\s*loglevel''

    The output message must contain the following text:

    LogLevel VERBOSE

    If the output message does not contain "VERBOSE", the LogLevel keyword is missing,

    or the line is commented out, this is a finding.'
  remediation: 'Configure SSH to verbosely log connection attempts and failed logon attempts to the

    SUSE operating system.

    Add or update the following line in the "/etc/ssh/sshd_config" file:

    LogLevel VERBOSE

    The SSH service will need to be restarted in order for the changes to take effect.'
  checks:
  - type: manual_review
    info: 'Verify SSH is configured to verbosely log connection attempts and failed logon attempts

