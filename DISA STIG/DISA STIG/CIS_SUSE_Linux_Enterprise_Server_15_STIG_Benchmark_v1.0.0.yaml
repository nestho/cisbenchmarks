- id: '1.128'
  title: SLES-15-030390
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must generate audit records for all uses of the rmmod command. GROUP ID: V-234938
    RULE ID: SV-234938r958412'
  rationale: 'Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate
    the events relating to an incident or identify those responsible for one. Audit records can be generated from various
    components within the information system (e.g., module or policy filter). The list of audited events is the set of events
    for which audits are to be generated. This set of events is typically a subset of the list of all events for which the
    system is capable of generating audit records. DoD has defined the following list of events for which the SUSE operating
    system will provide an audit record generation capability: 1. Successful and unsuccessful attempts to access, modify,
    or delete privileges, security objects, security levels, or categories of information (e.g., classification levels); 2.
    Access actions, such as successful and unsuccessful logon attempts, privileged activities or other system-level access,
    starting and ending time for user access to the system, concurrent logons from different workstations, successful and
    unsuccessful accesses to objects, all program initiations, and all direct access to the information system; 3. All account
    creations, modifications, disabling, and terminations; and 4. All kernel module load, unload, and restart actions. Satisfies:
    SRG-OS-000037-GPOS-00015, SRG-OS-000062-GPOS-00031, SRG-OS000392-GPOS-00172, SRG-OS-000462-GPOS-00206, SRG-OS-000471-GPOS-00215'
