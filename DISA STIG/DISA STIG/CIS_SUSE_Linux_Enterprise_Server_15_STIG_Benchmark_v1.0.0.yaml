    following two lines to add a boot password for the root entry:

    set superusers="root"

    password_pbkdf2 root grub.pbkdf2.sha512.VeryLongString

    Generate an updated "grub.conf" file with the new password using the following

    commands:

    sudo grub2-mkconfig --output=/tmp/grub2.cfg

    sudo mv /tmp/grub2.cfg /boot/grub2/grub.cfg'
