- id: '1.10'
  title: SLES-15-010100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must be able to lock the graphical user interface (GUI). GROUP ID: V-234810 RULE
    ID: SV-234810r1009609'
  rationale: 'A session lock is a temporary action taken when a user stops work and moves away from the immediate physical
    vicinity of the information system but does not want to log out because of the temporary nature of the absence. The session
    lock is implemented at the point where session activity can be determined. Regardless of where the session lock is determined
    and implemented, once invoked, the session lock must remain in place until the user reauthenticates. No other activity
    aside from reauthentication must unlock the system. Satisfies: SRG-OS-000028-GPOS-00009, SRG-OS-000030-GPOS-00011'
  impact: ''
  references: []
