  description: 'The SUSE operating system must deny direct logons to the root account using remote access via SSH. GROUP ID:
    V-234870 RULE ID: SV-234870r1009618'
  rationale: To ensure individual accountability and prevent unauthorized access, organizational users must be individually
    identified and authenticated. A group authenticator is a generic account used by multiple individuals. Use of a group
    authenticator alone does not uniquely identify individual users. Examples of the group authenticator is the UNIX OS "root"
    user account, the Windows "Administrator" account, the "sa" account, or a "helpdesk" account. For example, the UNIX and
    Windows SUSE operating systems offer a "switch user" capability, allowing users to authenticate with their individual
    credentials and, when needed, "switch" to the administrator role. This method provides for unique individual authentication
    prior to using a group authenticator. Users (and any processes acting on behalf of users) need to be uniquely identified
    and authenticated for all accesses other than those accesses explicitly identified and documented by the organization,
    which outlines specific user actions that can be performed on the SUSE operating system without identification or authentication.
    Requiring individuals to be authenticated with an individual authenticator prior to using a group authenticator allows
    for traceability of actions, as well as adding an additional level of protection of the actions that can be taken with
    group account knowledge.
  impact: ''
  references: []
  page_start: 164
  audit_raw: 'Verify the SUSE operating system denies direct logons to the root account using remote

    access via SSH.

    Check that SSH denies any user trying to log on directly as root with the following

    command:

    sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr

    ''\n'' '' '' | xargs sudo grep -iH ''^\s*permitrootlogin''

    PermitRootLogin no

    If the "PermitRootLogin" keyword is set to "yes", is missing, or is commented out, this is

    a finding.'
  remediation: 'Configure the SUSE operating system to deny direct logons to the root account using

    remote access via SSH.

    Edit the appropriate "/etc/ssh/sshd_config" file, add or uncomment the line for

    "PermitRootLogin" and set its value to "no" (this file may be named differently or be in a

    different location):

    PermitRootLogin no'
  checks:
  - type: manual_review
    info: 'Verify the SUSE operating system denies direct logons to the root account using remote

      access via SSH.

      Check that SSH denies any user trying to log on directly as root with the following

      command:

      sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr

      ''\n'' '' '' | xargs sudo grep -iH ''^\s*permitrootlogin''

      PermitRootLogin no

      If the "PermitRootLogin" keyword is set to "yes", is missing, or is commented out, this is

      a finding.'
    severity: medium
- id: '1.73'
  title: SLES-15-020050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must disable account identifiers (individuals, groups, roles, and devices) after
    35 days of inactivity after password expiration. GROUP ID: V-234871 RULE ID: SV-234871r1009619'
  rationale: Inactive identifiers pose a risk to systems and applications because attackers may exploit an inactive identifier
    and potentially obtain undetected access to the system. Owners of inactive accounts will not notice if unauthorized access
    to their user account has been obtained. The SUSE operating system needs to track periods of inactivity and disable application
    identifiers after 35 days of inactivity.
  impact: ''
  references: []
  page_start: 166
  audit_raw: 'Verify the SUSE operating system disables account identifiers after 35 days of inactivity

    since the password expiration.

    Check the account inactivity value by performing the following command:

    sudo grep -i ''^inactive'' /etc/default/useradd

    INACTIVE=35

    If no output is produced, or if "INACTIVE" is not set to a value greater than "0" and less

    than or equal to "35", this is a finding.'
  remediation: 'Configure the SUSE operating system to disable account identifiers after 35 days of

    inactivity since the password expiration.

    Run the following command to change the configuration for "useradd" to disable the

    account identifier after 35 days:

    sudo useradd -D -f 35

    DOD recommendation is 35 days, but a lower value greater than "0" is acceptable.'
  checks:
  - type: manual_review
    info: 'Verify the SUSE operating system disables account identifiers after 35 days of inactivity

      since the password expiration.

      Check the account inactivity value by performing the following command:

      sudo grep -i ''^inactive'' /etc/default/useradd

      INACTIVE=35

      If no output is produced, or if "INACTIVE" is not set to a value greater than "0" and less

      than or equal to "35", this is a finding.'
    severity: medium
- id: '1.74'
  title: SLES-15-020060
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must never automatically remove or disable emergency administrator accounts. GROUP
    ID: V-234872 RULE ID: SV-234872r958508'
  rationale: Emergency accounts are privileged accounts that are established in response to crisis situations where the need
    for rapid account activation is required. Therefore, emergency account activation may bypass normal account authorization
    processes. If these accounts are automatically disabled, system maintenance during emergencies may not be possible, thus
    adversely affecting system availability. Emergency accounts are different from infrequently used accounts (i.e., local
    logon accounts used by the organization's system administrators when network or normal logon/access is not available).
    Infrequently used accounts are not subject to automatic termination dates. Emergency accounts are accounts created in
    response to crisis situations, usually for use by maintenance personnel. The automatic expiration or disabling time period
    may be extended as needed until the crisis is resolved; however, it must not be extended indefinitely. A permanent account
    should be established for privileged users who need long-term maintenance accounts. To address access requirements the
    SUSE operating system can be integrated with enterprise-level authentication/access mechanisms that meet or exceed access
    control policy requirements.
  impact: ''
  references: []
  page_start: 168
  audit_raw: 'Verify the SUSE operating system is configured such that emergency administrator

    accounts are never automatically removed or disabled.

    Note: Root is typically the "account of last resort" on a system and is also used as the

    example emergency administrator account. If another account is being used as the

    emergency administrator account, the command should be used against that account.

    Check to see if the root account password or account expires with the following

    command:

    sudo chage -l [Emergency_Administrator]

    Password expires:never

    If "Password expires" or "Account expires" is set to anything other than "never", this is a

    finding.'
  remediation: 'Configure the SUSE operating system to never automatically remove or disable

    emergency administrator accounts.

    Replace "[Emergency_Administrator]" in the following command with the correct

    emergency administrator account. Run the following command as an administrator:

    sudo chage -I -1 -M 99999 [Emergency_Administrator]'
  checks:
  - type: manual_review
    info: 'Verify the SUSE operating system is configured such that emergency administrator

      accounts are never automatically removed or disabled.

      Note: Root is typically the "account of last resort" on a system and is also used as the

      example emergency administrator account. If another account is being used as the

      emergency administrator account, the command should be used against that account.

      Check to see if the root account password or account expires with the following

      command:

      sudo chage -l [Emergency'
    severity: medium
- id: '1.75'
  title: SLES-15-020061
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must automatically expire temporary accounts within 72 hours. GROUP ID: V-256982
    RULE ID: SV-256982r958508'
  rationale: Temporary accounts are privileged or nonprivileged accounts that are established during pressing circumstances,
    such as new software or hardware configuration or an incident response, where the need for prompt account activation requires
    bypassing normal account authorization procedures. If any inactive temporary accounts are left enabled on the system and
    are not either manually removed or automatically expired within 72 hours, the security posture of the system will be degraded
    and exposed to exploitation by unauthorized users or insider threat actors. Temporary accounts are different from emergency
    accounts. Emergency accounts, also known as "last resort" or "break glass" accounts, are local logon accounts enabled
    on the system for emergency use by authorized system administrators to manage a system when standard logon methods are
    failing or not available. Emergency accounts are not subject to manual removal or scheduled expiration requirements. The
    automatic expiration of temporary accounts may be extended as needed by the circumstances but it must not be extended
    indefinitely. A documented permanent account should be established for privileged users who need long-term maintenance
    accounts.
  impact: ''
  references: []
  page_start: 170
  audit_raw: 'Verify temporary accounts have been provisioned with an expiration date of 72 hours.

    For every existing temporary account, run the following command to obtain its account

    expiration information:

    sudo chage -l <temporary_account_name> | grep -i "account expires"

    Verify each of these accounts has an expiration date set within 72 hours.

    If any temporary accounts have no expiration date set or do not expire within 72 hours,

    this is a finding.'
  remediation: 'Configure the operating system to expire temporary accounts after 72 hours with the

    following command:

    sudo chage -E $(date -d +3days +%Y-%m-%d) <temporary_account_name>'
  checks:
  - type: command
    command: sudo chage -l <temporary_account_name> | grep -i "account expires"
    expected: ''
    severity: medium
    info: 'Verify temporary accounts have been provisioned with an expiration date of 72 hours.

      For every existing temporary account, run the following command to obtain its account

      expiration information:

      sudo chage -l <temporary_account_name> | grep -i "account expires"

      Verify each of these accounts has an expiration date set within 72 hours.

      If any temporary accounts have no expiration date set or do not '
