    on the installation.

    The following command will find all SSH public key files on the system:

    find /etc/ssh -name ''ssh_host*key.pub'' -exec stat -c "%a %n" {} \;

    644 /etc/ssh/ssh_host_rsa_key.pub

    644 /etc/ssh/ssh_host_dsa_key.pub

