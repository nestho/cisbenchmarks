  rationale: A locally logged-on user, who presses Ctrl-Alt-Delete when at the console, can reboot the system. If accidentally
    pressed, as could happen in the case of a mixed OS environment, this can create the risk of short-term loss of availability
    of systems due to unintentional reboot. In the graphical user interface environment, risk of unintentional reboot from
    the Ctrl-Alt-Delete sequence is reduced because the user will be prompted before any action is taken.
  impact: ''
  references: []
  page_start: 364
  audit_raw: 'Verify the SUSE operating system is not configured to reboot the system when Ctrl-AltDelete is pressed.

