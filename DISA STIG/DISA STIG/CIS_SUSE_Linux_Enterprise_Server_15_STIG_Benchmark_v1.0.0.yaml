- id: '1.79'
  title: SLES-15-020099
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must specify the default "include" directory for the /etc/sudoers file. GROUP ID:
    V-251723 RULE ID: SV-251723r991589'
  rationale: 'The "sudo" command allows authorized users to run programs (including shells) as other users, system users,
    and root. The "/etc/sudoers" file is used to configure authorized "sudo" users as well as the programs they are allowed
    to run. Some configuration options in the "/etc/sudoers" file allow configured users to run programs without re-authenticating.
    Use of these configuration options makes it easier for one compromised account to be used to compromise other accounts.
    It is possible to include other sudoers files from within the sudoers file currently being parsed using the @include and
    @includedir directives. For compatibility with sudo versions prior to 1.9.1, #include and #includedir are also accepted.
    When sudo reaches this line it will suspend processing of the current file (/etc/sudoers) and switch to the specified
    file/directory. Once the end of the included file(s) is reached, the rest of /etc/sudoers will be processed. Files that
    are included may themselves include other files. A hard limit of 128 nested include files is enforced to prevent include
    file loops.'
  impact: ''
  references: []
  page_start: 177
  audit_raw: 'Note: If the "include" and "includedir" directives are not present in the /etc/sudoers file,

    this requirement is not applicable.

    Verify the operating system specifies only the default "include" directory for the

    /etc/sudoers file with the following command:

    sudo grep include /etc/sudoers

    @includedir /etc/sudoers.d

    If the results are not "/etc/sudoers.d" or additional files or directories are specified, this

    is a finding.

    Verify the operating system does not have nested "include" files or directories within the

    /etc/sudoers.d directory with the following command:

    sudo grep -r include /etc/sudoers.d

    If results are returned, this is a finding.'
  remediation: 'Configure the /etc/sudoers file to only include the /etc/sudoers.d directory.

    Edit the /etc/sudoers file with the following command:

    sudo visudo

    Add or modify the following line:

    @includedir /etc/sudoers.d'
  checks:
  - type: manual_review
    info: 'Note: If the "include" and "includedir" directives are not present in the /etc/sudoers file,

      this requirement is not applicable.

      Verify the operating system specifies only the default "include" directory for the

      /etc/sudoers file with the following command:

      sudo grep include /etc/sudoers

      @includedir /etc/sudoers.d

      If the results are not "/etc/sudoers.d" or additional files or directories are specified, this

      is a finding.

      Verify the operating system does not have nested "include" files or directo'
    severity: medium
- id: '1.80'
  title: SLES-15-020100
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The SUSE operating system root account must be the only account with unrestricted access to the system. GROUP
    ID: V-234876 RULE ID: SV-234876r991589'
  rationale: If an account other than root also has a User Identifier (UID) of "0", it has root authority, giving that account
    unrestricted access to the entire SUSE operating system. Multiple accounts with a UID of "0" afford an opportunity for
    potential intruders to guess a password for a privileged account.
  impact: ''
  references: []
  page_start: 179
  audit_raw: 'Verify that the SUSE operating system root account is the only account with unrestricted

    access to the system.

    Check the system for duplicate UID "0" assignments with the following command:

    awk -F: ''$3 == 0 {print $1}'' /etc/passwd

    root

    If any accounts other than root have a UID of "0", this is a finding.'
  remediation: 'Change the UID of any account on the SUSE operating system, other than the root

    account, that has a UID of "0".

    If the account is associated with system commands or applications, the UID should be

    changed to one greater than "0" but less than "1000". Otherwise, assign a UID of

    greater than "1000" that has not already been assigned.'
  checks:
  - type: manual_review
    info: 'Verify that the SUSE operating system root account is the only account with unrestricted

      access to the system.

      Check the system for duplicate UID "0" assignments with the following command:

      awk -F: ''$3 == 0 {print $1}'' /etc/passwd

      root

      If any accounts other than root have a UID of "0", this is a finding.'
    severity: medium
- id: '1.81'
  title: SLES-15-020101
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must restrict privilege elevation to authorized personnel. GROUP ID: V-234877 RULE
    ID: SV-234877r991589'
  rationale: The sudo command allows a user to execute programs with elevated (administrator) privileges. It prompts the user
    for their password and confirms your request to execute a command by checking a file, called sudoers. If the "sudoers"
    file is not configured correctly, any user defined on the system can initiate privileged actions on the target system.
  impact: ''
  references: []
  page_start: 180
  audit_raw: 'Verify the "sudoers" file restricts sudo access to authorized personnel.

    sudo grep -iw ''ALL'' /etc/sudoers /etc/sudoers.d/*

    If the either of the following entries are returned, this is a finding:

    ALL ALL=(ALL) ALL

    ALL ALL=(ALL:ALL) ALL'
  remediation: 'Remove the following entries from the sudoers file:

    ALL ALL=(ALL) ALL

    ALL ALL=(ALL:ALL) ALL'
  checks:
  - type: manual_review
    info: 'Verify the "sudoers" file restricts sudo access to authorized personnel.

      sudo grep -iw ''ALL'' /etc/sudoers /etc/sudoers.d/*

      If the either of the following entries are returned, this is a finding:

      ALL ALL=(ALL) ALL

      ALL ALL=(ALL:ALL) ALL'
    severity: medium
- id: '1.82'
  title: SLES-15-020102
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must require reauthentication when using the "sudo" command. GROUP ID: V-234878
    RULE ID: SV-234878r1050789'
  rationale: Without reauthentication, users may access resources or perform tasks for which they do not have authorization.
    When operating systems provide the capability to escalate a functional capability, it is critical the organization requires
    the user to re-authenticate when using the "sudo" command. If the value is set to an integer less than 0, the user's time
    stamp will not expire and the user will not have to reauthenticate for privileged actions until the user's session is
    terminated.
  impact: ''
  references: []
  page_start: 181
  audit_raw: 'Verify the operating system requires re-authentication when using the "sudo" command

    to elevate privileges.

    =sudo grep -ir ''timestamp_timeout'' /etc/sudoers /etc/sudoers.d

    /etc/sudoers:Defaults timestamp_timeout=0

    If conflicting results are returned, this is a finding.

    If "timestamp_timeout" is set to a negative number, is commented out, or no results are

    returned, this is a finding.'
  remediation: 'Configure the "sudo" command to require reauthentication.

    Edit the /etc/sudoers file:

    sudo visudo

    Add or modify the following line:

