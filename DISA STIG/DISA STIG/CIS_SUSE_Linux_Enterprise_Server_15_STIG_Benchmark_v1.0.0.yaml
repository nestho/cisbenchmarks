    severity: medium
- id: '1.157'
  title: SLES-15-030700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system auditd service must notify the System Administrator (SA) and Information System
    Security Officer (ISSO) immediately when audit storage capacity is 75 percent full. GROUP ID: V-234969 RULE ID: SV-234969r971542'
  rationale: If security personnel are not notified immediately when storage volume reaches 75 percent utilization, they are
    unable to plan for audit record storage capacity expansion.
  impact: ''
  references: []
