- id: '1.33'
  title: SLES-15-010351
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system library files must have mode 0755 or less permissive. GROUP ID: V-234834 RULE ID:
    SV-234834r991560'
  rationale: If the SUSE operating system were to allow any user to make changes to software libraries, then those changes
    might be implemented without undergoing the appropriate testing and approvals that are part of a robust change management
    process. This requirement applies to SUSE operating systems with software libraries that are accessible and configurable,
    as in the case of interpreted languages. Software libraries also include privileged programs which execute with escalated
    privileges. Only qualified and authorized individuals must be allowed to obtain access to information system components
    for purposes of initiating changes, including upgrades and modifications.
  impact: ''
  references: []
  page_start: 87
  audit_raw: 'Verify the system-wide shared library files contained in the directories "/lib", "/lib64",

    "/usr/lib", and "/usr/lib64" have mode "0755" or less permissive.

    Check that the system-wide shared library files have mode "0755" or less permissive

    with the following command:

    sudo find /lib /lib64 /usr/lib /usr/lib64 -perm /022 -type f -exec stat -c

    "%n %a" ''{}'' \;

    If any files are found to be group-writable or world-writable, this is a finding.'
  remediation: 'Configure the library files to be protected from unauthorized access. Run the following

    command:

    sudo find /lib /lib64 /usr/lib /usr/lib64 -perm /022 -type f -exec chmod 755

    ''{}'' \;'
  checks:
  - type: manual_review
    info: 'Verify the system-wide shared library files contained in the directories "/lib", "/lib64",

      "/usr/lib", and "/usr/lib64" have mode "0755" or less permissive.

