- id: '1.28'
  title: SLES-15-010310
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must be configured to use TCP syncookies. GROUP ID: V-234829 RULE ID: SV-234829r958528'
  rationale: Denial of Service (DoS) is a condition in which a resource is not available for legitimate users. When this occurs,
    the organization either cannot accomplish its mission or must operate at degraded capacity. Managing excess capacity ensures
    that sufficient capacity is available to counter flooding attacks. Employing increased capacity and service redundancy
    may reduce the susceptibility to some DoS attacks. Managing excess capacity may include, for example, establishing selected
    usage priorities, quotas, or partitioning.
  impact: ''
  references: []
  page_start: 76
  audit_raw: 'Verify the SUSE operating system is configured to use IPv4 TCP syncookies.

    Check to see if syncookies are used with the following command:

    sudo sysctl net.ipv4.tcp_syncookies

    net.ipv4.tcp_syncookies = 1

    If the network parameter "ipv4.tcp_syncookies" is not equal to "1" or nothing is returned,

    this is a finding.'
  remediation: 'Configure the SUSE operating system to use IPv4 TCP syncookies by running the

    following command as an administrator:

    sudo sysctl -w net.ipv4.tcp_syncookies=1

    If "1" is not the system''s default value, add or update the following line in

    "/etc/sysctl.d/99-stig.conf":

    sudo sh -c ''echo "net.ipv4.tcp_syncookies=1" >> /etc/sysctl.d/99-stig.conf''

    sudo sysctl --system'
  checks:
  - type: manual_review
    info: 'Verify the SUSE operating system is configured to use IPv4 TCP syncookies.

      Check to see if syncookies are used with the following command:

      sudo sysctl net.ipv4.tcp_syncookies

      net.ipv4.tcp_syncookies = 1

