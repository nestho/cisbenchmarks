- id: '1.188'
  title: SLES-15-040200
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'A separate file system must be used for SUSE operating system user home directories (such as /home or an equivalent).
    GROUP ID: V-235004 RULE ID: SV-235004r991589'
  rationale: The use of separate file systems for different paths can protect the system from failures resulting from a file
    system becoming full or failing.
  impact: ''
  references: []
  page_start: 391
  audit_raw: 'Verify that a separate file system/partition has been created for SUSE operating system

    non-privileged local interactive user home directories.

    Check the home directory assignment for all non-privileged users (those with a UID

    greater than 1000) on the system with the following command:

    awk -F: ''($3>=1000)&&($7 !~ /nologin/){print $1, $3, $6, $7}'' /etc/passwd

    adamsj 1002 /home/adamsj /bin/bash

    jacksonm 1003 /home/jacksonm /bin/bash

    smithj 1001 /home/smithj /bin/bash

    The output of the command will give the directory/partition that contains the home

    directories for the non-privileged users on the system (in this example, /home) and

    user''s shell. All accounts with a valid shell (such as /bin/bash) are considered interactive

    users.

    Check that a file system/partition has been created for the non-privileged interactive

    users with the following command:

    Note: The partition of /home is used in the example.

    grep /home /etc/fstab

    UUID=333ada18 /home ext4 noatime,nobarrier,nodev 1 2

    If a separate entry for the file system/partition that contains the non-privileged

    interactive users'' home directories does not exist, this is a finding.'
  remediation: 'Create a separate file system/partition for SUSE operating system non-privileged local

    interactive user home directories.

    Migrate the non-privileged local interactive user home directories onto the separate file

    system/partition.'
  checks:
  - type: command
    command: grep /home /etc/fstab
    expected: Verify that a separate file system/partition has been created for SUSE operating system
    severity: medium
    info: 'Verify that a separate file system/partition has been created for SUSE operating system

      non-privileged local interactive user home directories.

      Check the home directory assignment for all non-privileged users (those with a UID

      greater than 1000) on the system with the following command:

      awk -F: ''($3>=1000)&&($7 !~ /nologin/){print $1, $3, $6, $7}'' /etc/passwd

      adamsj 1002 /home/adamsj /bin/bash

      jac'
