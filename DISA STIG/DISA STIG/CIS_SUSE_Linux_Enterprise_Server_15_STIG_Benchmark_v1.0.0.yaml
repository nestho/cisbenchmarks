- id: '1.86'
  title: SLES-15-020120
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must display the date and time of the last successful account logon upon an SSH
    logon. GROUP ID: V-234881 RULE ID: SV-234881r991589'
  rationale: Providing users with feedback on when account accesses via SSH last occurred facilitates user recognition and
    reporting of unauthorized account use.
  impact: ''
  references: []
  page_start: 188
  audit_raw: 'Verify all remote connections via SSH to the SUSE operating system display feedback

    on when account accesses last occurred.

    Check that "PrintLastLog" keyword in the sshd daemon configuration file is used and set

    to "yes" with the following command:

    sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr

    ''\n'' '' '' | xargs sudo grep -iH ''^\s*printlastlog''

    PrintLastLog yes

    If the "PrintLastLog" keyword is set to "no", is missing, or is commented out, this is a

    finding.'
  remediation: 'Configure the SUSE operating system to provide users with feedback on when account

    accesses last occurred.

    Add or edit the following lines in the "/etc/ssh/sshd_config" file:

    PrintLastLog yes'
