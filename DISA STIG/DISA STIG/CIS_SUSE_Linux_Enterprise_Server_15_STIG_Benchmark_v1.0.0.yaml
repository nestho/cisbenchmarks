- id: '1.102'
  title: SLES-15-020300
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The SUSE operating system must not be configured to allow blank or null passwords. GROUP ID: V-234898 RULE
    ID: SV-234898r991589'
  rationale: Passwords need to be protected at all times, and encryption is the standard method for protecting passwords.
    If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised.
  impact: ''
  references: []
  page_start: 217
  audit_raw: 'Verify the SUSE operating system is not configured to allow blank or null passwords.

    Check that blank or null passwords cannot be used by running the following command:

    grep pam_unix.so /etc/pam.d/* | grep nullok

    If this produces any output, it may be possible to log on with accounts with empty

    passwords.

    If null passwords can be used, this is a finding.'
  remediation: 'Configure the SUSE operating system to not allow blank or null passwords.

    Remove any instances of the "nullok" option in "/etc/pam.d/common-auth" and

    "/etc/pam.d/common-password" to prevent logons with empty passwords.'
  checks:
  - type: command
    command: grep pam_unix.so /etc/pam.d/* | grep nullok
    expected: ''
    severity: medium
    info: 'Verify the SUSE operating system is not configured to allow blank or null passwords.

