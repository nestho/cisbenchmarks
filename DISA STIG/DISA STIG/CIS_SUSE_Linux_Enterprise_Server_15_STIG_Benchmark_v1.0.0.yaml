- id: '1.108'
  title: SLES-15-030050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SUSE operating system audit records must contain information to establish what type of events occurred, the
    source of events, where events occurred, and the outcome of events. GROUP ID: V-234904 RULE ID: SV-234904r958412'
  rationale: 'Without establishing what type of events occurred, the source of events, where events occurred, and the outcome
    of events, it would be difficult to establish, correlate, and investigate the events leading up to an outage or attack.
    Audit record content that may be necessary to satisfy this requirement includes, for example, time stamps, source and
    destination addresses, user/process identifiers, event descriptions, success/fail indications, filenames involved, and
    access control or flow control rules invoked. Associating event types with detected events in the SUSE operating system
    audit logs provides a means of investigating an attack, recognizing resource utilization or capacity thresholds, or identifying
    an improperly configured SUSE operating system. Satisfies: SRG-OS-000037-GPOS-00015, SRG-OS-000038-GPOS-00016, SRG-OS000039-GPOS-00017,
    SRG-OS-000040-GPOS-00018, SRG-OS-000041-GPOS-00019, SRG-OS-000042-GPOS-00021, SRG-OS-000051-GPOS-00024, SRG-OS-000054GPOS-00025,
    SRG-OS-000122-GPOS-00063, SRG-OS-000254-GPOS-00095, SRGOS-000255-GPOS-00096, SRG-OS-000392-GPOS-00172'
  impact: ''
  references: []
  page_start: 232
  audit_raw: 'Verify the SUSE operating system produces audit records.

    Check that the SUSE operating system produces audit records by running the following

    command to determine the current status of the auditd service:

    systemctl is-active auditd.service

    active

    systemctl is-enabled auditd.service

    enabled

    If the service is not active or not enabled, this is a finding.'
  remediation: 'Enable the SUSE operating system auditd service by performing the following

    commands:

    sudo systemctl enable auditd.service

    sudo systemctl start auditd.service'
  checks:
  - type: command
    command: systemctl is-active auditd.service && systemctl is-enabled auditd.service
    expected: ''
    severity: medium
    info: 'Verify the SUSE operating system produces audit records.

