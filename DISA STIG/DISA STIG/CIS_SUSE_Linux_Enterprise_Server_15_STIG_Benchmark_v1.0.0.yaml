      command:

      sudo zypper patch-check

      0 patches needed (0 security patches)

      If the patch repository data is corrupt,'
- id: '1.3'
  title: SLES-15-010020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must display the Standard Mandatory DOD Notice and Consent Banner before granting
    access via local console. GROUP ID: V-234803 RULE ID: SV-234803r958390'
  rationale: 'Display of a standardized and approved use notification before granting access to the SUSE operating system
    ensures privacy and security notification verbiage used is consistent with applicable federal laws, Executive Orders,
    directives, policies, regulations, standards, and guidance. The banner must be acknowledged by the user prior to allowing
    the user access to the SUSE operating system. This provides assurance that the user has seen the message and accepted
    the conditions for access. If the consent banner is not acknowledged by the user, DOD will not be in compliance with system
    use notifications required by law. System use notifications are required only for access via logon interfaces with human
    users and are not required when such human interfaces do not exist. The banner must be formatted in accordance with applicable
    DOD policy. Use the following verbiage for SUSE operating system: "You are accessing a U.S. Government (USG) Information
    System (IS) that is provided for USG - authorized use only. By using this IS (which includes any device attached to this
    IS), you consent to the following conditions: -The USG routinely intercepts and monitors communications on this IS for
    purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel
    misconduct (PM), law enforcement (LE), and counterintelligenc e (CI) investigations. -At any time, the USG may inspect
    and seize data stored on this IS. -Communications using, or data stored on, this IS are not private, are subject to routine
    monitoring, interception, and search, and may be disclosed or used for any USG -authorized purpose. -This IS includes
    security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or
    privacy. -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching
    or monitoring of the content of privileged communications, or work product, related to personal representation or services
    by attorneys, psychothe rapists, or clergy, and their assistants. Such communications and work product are private and
    confidential. See User Agreement for details."'
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'Verify the SUSE operating system displays the Standard Mandatory DOD Notice and

    Consent Banner before granting access to the system via local console.

    Check the "motd" (message of the day) file to verify that it contains the DOD required

    banner text:

    more /etc/issue

    The output must display the following DOD-required banner text:

    "You are accessing a U.S. Government (USG) Information System (IS) that is

    provided for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent

    to the following conditions:

    -The USG routinely intercepts and monitors communications on this IS for

    purposes including, but not limited to, penetration testing, COMSEC

    monitoring, network operations and defense, personnel misconduct (PM), law

    enforcement (LE), and counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are

    subject to routine monitoring, interception, and search, and may be disclosed

    or used for any USG-authorized purpose.

    -This IS includes security measures (e.g., authentication and access

    controls) to protect USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM,

    LE or CI investigative searching or monitoring of the content of privileged

    communications, or work product, related to personal representation or

    services by attorneys, psychotherapists, or clergy, and their assistants.

    Such communications and work product are private and confidential. See User

    Agreement for details."

    If the output does not display the correct banner text, this is a finding.'
  remediation: 'Configure the SUSE operating system to display the Standard Mandatory DOD Notice

    and Consent Banner before granting access to the system via local console by

    performing the following tasks:

    Edit the "motd" file and replace the default text inside with the Standard Mandatory DOD

    banner text:

    "You are accessing a U.S. Government (USG) Information System (IS) that is

    provided for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent

    to the following conditions:

    -The USG routinely intercepts and monitors communications on this IS for

    purposes including, but not limited to, penetration testing, COMSEC

    monitoring, network operations and defense, personnel misconduct (PM), law

    enforcement (LE), and counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are

    subject to routine monitoring, interception, and search, and may be disclosed

    or used for any USG-authorized purpose.

    -This IS includes security measures (e.g., authentication and access

    controls) to protect USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM,

    LE or CI investigative searching or monitoring of the content of privileged

    communications, or work product, related to personal representation or

    services by attorneys, psychotherapists, or clergy, and their assistants.

    Such communications and work product are private and confidential. See User

    Agreement for details."'
  checks:
  - type: manual_review
    info: 'Verify the SUSE operating system displays the Standard Mandatory DOD Notice and

      Consent Banner before granting access to the system via local console.

      Check the "motd" (message of the day) file to verify that it contains the DOD required

      banner text:

      more /etc/issue

      The output must display the following DOD-required banner text:

      "You are accessing a U.S. Government (USG) Information System (IS) that is

      provided for USG-authorized use only.

      By using this IS (which includes any device attached to '
    severity: medium
- id: '1.4'
  title: SLES-15-010030
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The SUSE operating system must not have the vsftpd package installed if not required for operational support.
    GROUP ID: V-234804 RULE ID: SV-234804r987796'
  rationale: 'It is detrimental for SUSE operating systems to provide, or install by default, functionality exceeding requirements
    or mission objectives. These unnecessary capabilities or services are often overlooked, and therefore may remain unsecured.
    They increase the risk to the platform by providing additional attack vectors. SUSE operating systems are capable of providing
    a wide variety of functions and services. Some of the functions and services, provided by default, may not be necessary
    to support essential organizational operations (e.g., key missions and functions). Examples of nonessential capabilities
    include but are not limited to games, software packages, tools, and demonstration software not related to requirements
    or providing a wide array of functionality not required for every mission but which cannot be disabled. Satisfies: SRG-OS-000074-GPOS-00042,
    SRG-OS-000095-GPOS-00049'
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Verify the vsftpd package is not installed on the SUSE operating system.

    Check that the vsftpd package is not installed on the SUSE operating system by running

    the following command:

    zypper info vsftpd | grep Installed

    If "vsftpd" is installed and is not documented with the Information System Security

    Officer (ISSO) as an operational requirement, this is a finding.'
  remediation: 'Document the "vsftpd" package with the ISSO as an operational requirement or remove

    it from the system with the following command:

    sudo zypper remove vsftpd'
  checks:
  - type: command
    command: zypper info vsftpd | grep Installed
    expected: ''
    severity: medium
    info: 'Verify the vsftpd package is not installed on the SUSE operating system.

      Check that the vsftpd package is not installed on the SUSE operating system by running

      the following command:

      zypper info vsftpd | grep Installed

      If "vsftpd" is installed and is not documented with the Information System Security

      Officer (ISSO) as an operational requirement, this is a finding.'
- id: '1.5'
  title: SLES-15-010040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must display the Standard Mandatory DOD Notice and Consent Banner before granting
    access via SSH. GROUP ID: V-234805 RULE ID: SV-234805r958390'
  rationale: 'Display of a standardized and approved use notification before granting access to the SUSE operating system
    ensures privacy and security notification verbiage used is consistent with applicable federal laws, Executive Orders,
    directives, policies, regulations, standards, and guidance. System use notifications are required only for access via
    logon interfaces with human users and are not required when such human interfaces do not exist. The banner must be formatted
    in accordance with applicable DOD policy. Use the following verbiage for SUSE operating systems that can accommodate banners
    of 1300 characters: "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized
    use only. By using this IS (which includes any device attached to this IS), you consent to the following conditions: -The
    USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration
    testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence
    (CI) investigations. -At any time, the USG may inspect and seize data stored on this IS. -Communications using, or data
    stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed
    or used for any USG-authorized purpose. -This IS includes security measures (e.g., authentication and access controls)
    to protect USG interests--not for your personal benefit or privacy. -Notwithstanding the above, using this IS does not
    constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications,
    or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants.
    Such communications and work product are private and confidential. See User Agreement for details." Satisfies: SRG-OS-000023-GPOS-00006,
    SRG-OS-000228-GPOS-00088'
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'Verify the SUSE operating system displays the Standard Mandatory DOD Notice and

    Consent Banner before granting access to the system via SSH.

    Check the issue file to verify it contains one of the DOD required banners. If it does not,

    this is a finding.

    more /etc/issue

    The output must display the following DOD-required banner text:

    "You are accessing a U.S. Government (USG) Information System (IS) that is

    provided for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent

    to the following conditions:

    -The USG routinely intercepts and monitors communications on this IS for

    purposes including, but not limited to, penetration testing, COMSEC

    monitoring, network operations and defense, personnel misconduct (PM), law

    enforcement (LE), and counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are

    subject to routine monitoring, interception, and search, and may be disclosed

    or used for any USG-authorized purpose.

    -This IS includes security measures (e.g., authentication and access

    controls) to protect USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM,

    LE or CI investigative searching or monitoring of the content of privileged

    communications, or work product, related to personal representation or

    services by attorneys, psychotherapists, or clergy, and their assistants.

    Such communications and work product are private and confidential. See User

    Agreement for details."

    If the output does not display the banner text, this is a finding.

    Check the banner setting for sshd_config:

    sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr

    ''\n'' '' '' | xargs sudo grep -iH ''^\s*banner''

    Banner /etc/issue

    If "Banner" is not set to "/etc/issue", this is a finding.'
  remediation: 'Configure the SUSE operating system to display the Standard Mandatory DOD Notice

    and Consent Banner before granting access to the system by running the following

    commands:

    Edit the "sshd_config" file and edit the Banner flag to be the following:

    Banner /etc/issue/

    Restart the sshd daemon:

    sudo systemctl restart sshd.service

    To configure the system logon banner, edit the "/etc/issue" file. Replace the default text

    inside with the Standard Mandatory DOD banner text:

    "You are accessing a U.S. Government (USG) Information System (IS) that is

    provided for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent

    to the following conditions:

    -The USG routinely intercepts and monitors communications on this IS for

    purposes including, but not limited to, penetration testing, COMSEC

    monitoring, network operations and defense, personnel misconduct (PM), law

    enforcement (LE), and counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are

    subject to routine monitoring, interception, and search, and may be disclosed

    or used for any USG-authorized purpose.

    -This IS includes security measures (e.g., authentication and access

    controls) to protect USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM,

    LE or CI investigative searching or monitoring of the content of privileged

    communications, or work product, related to personal representation or

    services by attorneys, psychotherapists, or clergy, and their assistants.

    Such communications and work product are private and confidential. See User

    Agreement for details."'
  checks:
  - type: manual_review
    info: 'Verify the SUSE operating system displays the Standard Mandatory DOD Notice and

      Consent Banner before granting access to the system via SSH.

      Check the issue file to verify it contains one of the DOD required banners. If it does not,

      this is a finding.

      more /etc/issue

      The output must display the following DOD-required banner text:

      "You are accessing a U.S. Government (USG) Information System (IS) that is

      provided for USG-authorized use only.

      By using this IS (which includes any device attached to'
    severity: medium
- id: '1.6'
  title: SLES-15-010050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must display the Standard Mandatory DoD Notice and Consent Banner until users acknowledge
    the usage conditions and take explicit actions to log on for further access to the local graphical user interface (GUI).
    GROUP ID: V-234806 RULE ID: SV-234806r958390'
  rationale: 'The SUSE operating system must display the Standard Mandatory DoD Notice and Consent Banner until users acknowledge
    the usage conditions and take explicit actions to log on for further access to the local graphical user interface (GUI).
    Satisfies: SRG-OS-000023-GPOS-00006, SRG-OS-000024-GPOS-00007'
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'Verify the SUSE operating system displays the Standard Mandatory DoD Notice and

    Consent Banner until users acknowledge the usage conditions and take explicit actions

    to log on via the local GUI.

    Note: If a graphical user interface is not installed, this requirement is Not Applicable.

    Check the configuration by running the following command:

    more /etc/gdm/Xsession

    The beginning of the file must contain the following text immediately after (#!/bin/sh):

    if ! zenity --text-info \

    --title "Consent" \

    --filename=/etc/gdm/banner \

    --no-markup \

    --checkbox="Accept." 10 10; then

    sleep 1;

    exit 1;

    fi

    If the beginning of the file does not contain the above text immediately after the line

    (#!/bin/sh), this is a finding.'
  remediation: 'Configure the SUSE operating system to display the Standard Mandatory DoD Notice

    and Consent Banner until users acknowledge the usage conditions and take explicit

    actions to log on for further access.

    Note: If a graphical user interface is not installed, this requirement is Not Applicable.

    Edit the file "/etc/gdm/Xsession".

    Add the following content to the file "/etc/gdm/Xsession" below the line #!/bin/sh:

    if ! zenity --text-info \

    --title "Consent" \

    --filename=/etc/gdm/banner \

    --no-markup \

    --checkbox="Accept." 10 10; then

    sleep 1;

    exit 1;

    fi

    Save the file "/etc/gdm/Xsession".'
  checks:
  - type: script
    interpreter: bash
    script: 'Verify the SUSE operating system displays the Standard Mandatory DoD Notice and

      Consent Banner until users acknowledge the usage conditions and take explicit actions

      to log on via the local GUI.

      Note: If a graphical user interface is not installed, this requirement is Not Applicable.

      Check the configuration by running the following command:

      more /etc/gdm/Xsession

      The beginning of the file must contain the following text immediately after (#!/bin/sh):

      if ! zenity --text-info \

      --title "Consent" \

      --filename=/etc/gdm/banner \

      --no-markup \

      --checkbox="Accept." 10 10; then

      sleep 1;

      exit 1;

      fi

      If the beginning of the file does not contain the above text immediately after the line

      (#!/bin/sh), this is a finding.'
    expected: exit_0
    severity: medium
    info: CIS multi-line automated audit verification script.
- id: '1.7'
  title: SLES-15-010080
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must display a banner before granting local or remote access to the system via a
    graphical user logon. GROUP ID: V-234808 RULE ID: SV-234808r958586'
  rationale: 'Display of a standardized and approved use notification before granting access to the SUSE operating system
    ensures privacy and security notification verbiage used is consistent with applicable federal laws, Executive Orders,
    directives, policies, regulations, standards, and guidance. The banner must be acknowledged by the user prior to allowing
    the user access to the SUSE operating system. This provides assurance that the user has seen the message and accepted
    the conditions for access. If the consent banner is not acknowledged by the user, DoD will not be in compliance with system
    use notifications required by law. System use notifications are required only for access via logon interfaces with human
    users and are not required when such human interfaces do not exist. The banner must be formatted in accordance with applicable
    DoD policy. Use the following verbiage for SUSE operating system: "You are accessing a U.S. Government (USG) Information
    System (IS) that is provided for USG - authorized use only. By using this IS (which includes any device attached to this
    IS), you consent to the following conditions: -The USG routinely intercepts and monitors communications on this IS for
    purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel
    misconduct (PM), law enforcement (LE), and counterintelligenc e (CI) investigations. -At any time, the USG may inspect
    and seize data stored on this IS. -Communications using, or data stored on, this IS are not private, are subject to routine
    monitoring, interception, and search, and may be disclosed or used for any USG -authorized purpose. -This IS includes
    security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or
    privacy. -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching
    or monitoring of the content of privileged communications, or work product, related to personal representation or services
    by attorneys, psychothe rapists, or clergy, and their assistants. Such communications and work product are private and
    confidential. See User Agreement for details."'
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'Note: If the system does not have a graphical user interface installed, this requirement

    is Not Applicable.

    Verify the SUSE operating system displays a banner before local or remote access to

    the system via a graphical user logon.

    Check that the SUSE operating system displays a banner at the logon screen by

    performing the following command:

    grep banner-message-enable /etc/dconf/db/gdm.d/*

    banner-message-enable=true

    cat /etc/dconf/profile/gdm

    user-db:user

    system-db:gdm

    file-db:/usr/share/gdm/greeter-dconf-defaults

    If "banner-message-enable" is set to "false" or is missing completely, this is a finding.'
  remediation: 'Note: If the system does not have a graphical user interface installed, this requirement

    is Not Applicable.

    Configure the SUSE operating system to display a banner before local or remote

    access to the system via a graphical user logon.

    Create a database that will contain the system-wide graphical user logon settings (if it

    does not already exist) with the following command:

    sudo mkdir -p /etc/dconf/db/gdm.d

    sudo touch /etc/dconf/db/gdm.d/01-banner-message

    Add the following content into /etc/dconf/profile/gdm:

    user-db:user

    system-db:gdm

    file-db:/usr/share/gdm/greeter-dconf-defaults

    Add the following line to the "[org/gnome/login-screen]" section of the

    "/etc/dconf/db/gdm.d/01-banner-message" file:

    [org/gnome/login-screen]

    banner-message-enable=true

    Update the system databases:

    sudo dconf update

    Users must log out and back in again before the system-wide settings take effect.'
  checks:
  - type: command
    command: grep banner-message-enable /etc/dconf/db/gdm.d/* && cat /etc/dconf/profile/gdm
    expected: ''
    severity: medium
    info: 'Note: If the system does not have a graphical user interface installed, this requirement

      is Not Applicable.

      Verify the SUSE operating system displays a banner before local or remote access to

      the system via a graphical user logon.

      Check that the SUSE operating system displays a banner at the logon screen by

      performing the following command:

      grep banner-message-enable /etc/dconf/db/gdm.d/*

      banner-m'
