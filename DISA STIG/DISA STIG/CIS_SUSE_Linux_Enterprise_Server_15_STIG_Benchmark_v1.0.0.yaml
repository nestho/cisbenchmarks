  title: SLES-15-040140
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SUSE operating system file systems that contain user home directories must be mounted to prevent files with
    the setuid and setgid bit set from being executed. GROUP ID: V-234998 RULE ID: SV-234998r991589'
  rationale: The "nosuid" mount option causes the system to not execute setuid and setgid files with owner privileges. This
    option must be used for mounting any file system not containing approved setuid and setguid files. Executing files from
    untrusted file systems increases the opportunity for unprivileged users to attain unauthorized administrative access.
  impact: ''
  references: []
  page_start: 383
  audit_raw: 'Verify that SUSE operating system file systems that contain user home directories are

    mounted with the "nosuid" option.

    Print the currently active file system mount options of the file system(s) that contain the

    user home directories with the following command:

    for X in `awk -F: ''($3>=1000)&&($7 !~ /nologin/){print $6}'' /etc/passwd`; do

    findmnt -nkT $X; done | sort -r

    /home /dev/mapper/system-home ext4 rw,nosuid,relatime,data=ordered

    If a file system containing user home directories is not mounted with the FSTYPE

    OPTION nosuid, this is a finding.

    Note: If a separate file system has not been created for the user home directories (user

    home directories are mounted under "/"), this is not a finding as the "nosuid" option

    cannot be used on the "/" system.'
  remediation: 'Configure the SUSE operating system "/etc/fstab" file to use the "nosuid" option on file

    systems that contain user home directories for interactive users.

    Re-mount the filesystems.

    sudo mount -o remount /home'
  checks:
  - type: manual_review
    info: 'Verify that SUSE operating system file systems that contain user home directories are

      mounted with the "nosuid" option.

