- id: '1.17'
  title: SLES-15-010170
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system, for PKI-based authentication, must validate certificates by constructing a certification
    path (which includes status information) to an accepted trust anchor. GROUP ID: V-234817 RULE ID: SV-234817r1009611'
  rationale: 'Without path validation, an informed trust decision by the relying party cannot be made when presented with
    any certificate not already explicitly trusted. A trust anchor is an authoritative entity represented via a public key
    and associated data. It is used in the context of public key infrastructures, X.509 digital certificates, and DNSSEC.
    When there is a chain of trust, usually the top entity to be trusted becomes the trust anchor; it can be, for example,
    a Certification Authority (CA). A certification path starts with the subject certificate and proceeds through a number
    of intermediate certificates up to a trusted root certificate, typically issued by a trusted CA. This requirement verifies
    that a certification path to an accepted trust anchor is used for certificate validation and that the path includes status
    information. Path validation is necessary for a relying party to make an informed trust decision when presented with any
    certificate not already explicitly trusted. Status information for certification paths includes certificate revocation
    lists or online certificate status protocol responses. Validation of the certificate status information is out of scope
    for this requirement. Satisfies: SRG-OS-000066-GPOS-00034, SRG-OS-000384-GPOS-00167'
  impact: ''
  references: []
  page_start: 53
  audit_raw: 'Verify the SUSE operating system for PKI-based authentication had valid certificates by

    constructing a certification path (which includes status information) to an accepted trust

    anchor.

    Check that the certification path to an accepted trust anchor for multifactor

    authentication is implemented with the following command:

    grep cert_policy /etc/pam_pkcs11/pam_pkcs11.conf

    cert_policy = ca,oscp_on,signature,crl_auto;

    If "cert_policy" is not set to include "ca", this is a finding.'
