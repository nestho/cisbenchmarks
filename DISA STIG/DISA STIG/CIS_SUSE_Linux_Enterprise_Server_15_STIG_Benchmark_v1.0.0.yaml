      leases: ipv4 static granted

      leases: ipv6 static granted

      addr: ipv4 127.0.0.1/8 [static]

      addr: ipv6 ::1/128 [st'
- id: '1.48'
  title: SLES-15-010390
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SUSE operating system AppArmor tool must be configured to control whitelisted applications and user home directory
    access control. GROUP ID: V-234848 RULE ID: SV-234848r958702'
  rationale: 'Using a whitelist provides a configuration management method for allowing the execution of only authorized software.
    Using only authorized software decreases risk by limiting the number of potential vulnerabilities. The organization must
    identify authorized software programs and permit execution of authorized software by adding each authorized program to
    the "pam_apparmor" exception policy. The process used to identify software programs that are authorized to execute on
    organizational information systems is commonly referred to as whitelisting. Verification of whitelisted software occurs
    prior to execution or at system startup. Users'' home directories/folders may contain information of a sensitive nature.
    Nonprivileged users should coordinate any sharing of information with a System Administrator (SA) through shared resources.
    AppArmor can confine users to their home directory, not allowing them to make any changes outside of their own home directories.
    Confining users to their home directory will minimize the risk of sharing information. Satisfies: SRG-OS-000312-GPOS-00122,
    SRG-OS-000312-GPOS-00123, SRG-OS000312-GPOS-00124, SRG-OS-000324-GPOS-00125, SRG-OS-000326-GPOS-00126, SRG-OS-000368-GPOS-00154,
    SRG-OS-000370-GPOS-00155, SRG-OS-000480GPOS-00230'
  impact: ''
  references: []
  page_start: 117
  audit_raw: 'Verify that the SUSE operating system AppArmor tool is configured to control

    whitelisted applications and user home directory access control.

    Check that "pam_apparmor" is installed on the system with the following command:

    zypper info pam_apparmor | grep "Installed"

    If the package "pam_apparmor" is not installed on the system, this is a finding.

    Check that the "apparmor" daemon is running with the following command:

    systemctl status apparmor.service | grep -i active

    Active: active (exited) since Fri 2017-01-13 01:01:01 GMT; 1day 1h ago

    If something other than "Active: active" is returned, this is a finding.

    Note: "pam_apparmor" must have properly configured profiles. All configurations will be

    based on the actual system setup and organization. See the "pam_apparmor"

    documentation for more information on configuring profiles.'
  remediation: 'Configure the SUSE operating system to blacklist all applications by default and permit

    by whitelist.

    Install "pam_apparmor" (if it is not installed) with the following command:

    sudo zypper in pam_apparmor

    Enable/activate "Apparmor" (if it is not already active) with the following command:

    sudo systemctl enable apparmor.service

    Start "Apparmor" with the following command:

    sudo systemctl start apparmor.service

    Note: "pam_apparmor" must have properly configured profiles. All configurations will be

    based on the actual system setup and organization. See the "pam_apparmor"

    documentation for more information on configuring profiles.'
  checks:
  - type: command
    command: zypper info pam_apparmor | grep "Installed" && systemctl status apparmor.service | grep -i active
    expected: Verify that the SUSE operating system AppArmor tool is configured to control
    severity: medium
