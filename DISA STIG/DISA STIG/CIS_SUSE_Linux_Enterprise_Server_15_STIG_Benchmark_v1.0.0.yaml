- id: '1.103'
  title: SLES-15-030000
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must generate audit records for all account creations, modifications, disabling,
    and termination events that affect /etc/passwd. GROUP ID: V-234899 RULE ID: SV-234899r1009634'
  rationale: 'Once an attacker establishes initial access to a system, the attacker often attempts to create a persistent
    method of reestablishing access. One way to accomplish this is for the attacker to simply create a new account. Auditing
    of account creation mitigates this risk. To address access requirements, many SUSE operating systems may be integrated
    with enterprise-level authentication/access/auditing mechanisms that meet or exceed access control policy requirements.
    Satisfies: SRG-OS-000004-GPOS-00004, SRG-OS-000239-GPOS-00089, SRG-OS000240-GPOS-00090, SRG-OS-000241-GPOS-00091, SRG-OS-000274-GPOS-00104,
    SRG-OS-000275-GPOS-00105, SRG-OS-000276-GPOS-00106, SRG-OS-000277GPOS-00107, SRG-OS-000303-GPOS-00120, SRG-OS-000463-GPOS-00207,
    SRGOS-000304-GPOS-00121, SRG-OS-000470-GPOS-00214, SRG-OS-000476-GPOS00221'
  impact: ''
  references: []
  page_start: 218
  audit_raw: 'Verify the SUSE operating system generates an audit record when all modifications

    occur to the "/etc/passwd" file.

    Check that the file is being audited by performing the following command:

    sudo auditctl -l | grep -w ''/etc/passwd''

    -w /etc/passwd -p wa -k account_mod

    If the command does not return a line, this is a finding.

    Note: The "-k" allows for specifying an arbitrary identifier. The string following "-k" does

    not need to match the example output above.'
  remediation: 'Configure the SUSE operating system to generate an audit record when all

    modifications to the "/etc/passwd" file occur.

    Add or update the following rule to "/etc/audit/rules.d/audit.rules":

    -w /etc/passwd -p wa -k account_mod

    To reload the rules file, restart the audit daemon:

    sudo systemctl restart auditd.service

    or issue the following command:

    sudo augenrules --load'
  checks:
  - type: command
    command: sudo auditctl -l | grep -w '/etc/passwd'
    expected: ''
    severity: medium
    info: 'Verify the SUSE operating system generates an audit record when all modifications

