    cannot be relied on to provide confidentiality or integrity, and DoD data may be compromised. SUSE operating systems using
    encryption are required to use FIPS-compliant mechanisms for authenticating to cryptographic modules. FIPS 140-2 is the
    current standard for validating that mechanisms used to access cryptographic modules use authentication that meets DoD
    requirements. This allows for Security Levels 1, 2, 3, or 4 for use on a general-purpose computing system.
