- id: '1.95'
  title: SLES-15-020200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must be configured to create or update passwords with a minimum lifetime of 24 hours
    (one day). GROUP ID: V-234889 RULE ID: SV-234889r1009628'
  rationale: Enforcing a minimum password lifetime helps prevent repeated password changes to defeat the password reuse or
    history enforcement requirement. If users are allowed to immediately and continually change their password, the password
    could be repeatedly changed in a short period of time to defeat the organization's policy regarding password reuse.
  impact: ''
  references: []
  page_start: 204
  audit_raw: 'Verify the SUSE operating system creates or updates passwords with minimum

    password age of one day or greater.

    To check that the SUSE operating system enforces 24 hours/one day as the minimum

    password age, run the following command:

    grep ''^PASS_MIN_DAYS'' /etc/login.defs

    PASS_MIN_DAYS 1

    If no output is produced, or if "PASS_MIN_DAYS" does not have a value of "1" or

    greater, this is a finding.'
  remediation: 'Configure the SUSE operating system to enforce 24 hours/one day or greater as the

    minimum password age.

    Edit the file "/etc/login.defs" and add or correct the following line. Replace [DAYS] with

    the appropriate amount of days:

    PASS_MIN_DAYS [DAYS]

    The DOD requirement is "1" but a greater value is acceptable.'
  checks:
  - type: command
    command: grep '^PASS_MIN_DAYS' /etc/login.defs
    expected: ''
    severity: medium
    info: 'Verify the SUSE operating system creates or updates passwords with minimum

      password age of one day or greater.

