  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must lock an account after three consecutive invalid access attempts. GROUP ID:
    V-234867 RULE ID: SV-234867r958388'
  rationale: 'By limiting the number of failed access attempts, the risk of unauthorized system access via user password guessing,
    otherwise known as brute-forcing, is reduced. Limits are imposed by locking the account. The pam_tally2.so module maintains
    a count of attempted accesses. This includes user name entry into a logon field as well as password entry. With counting
    access attempts, it is possible to lock an account without presenting a password into the password field. This should
