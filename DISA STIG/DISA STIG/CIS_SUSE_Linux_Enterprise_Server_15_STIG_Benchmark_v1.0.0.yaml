    severity: medium
- id: '1.54'
  title: SLES-15-010430
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The SUSE operating system tool zypper must have gpgcheck enabled. GROUP ID: V-234852 RULE ID: SV-234852r1009613'
  rationale: Changes to any software components can have significant effects on the overall security of the SUSE operating
    system. This requirement ensures the software has not been tampered with and has been provided by a trusted vendor. Accordingly,
    patches, service packs, device drivers, or SUSE operating system components must be signed with a certificate recognized
    and approved by the organization. Verifying the authenticity of the software prior to installation validates the integrity
    of the patch or upgrade received from a vendor. This ensures the software has not been tampered with and that it has been
    provided by a trusted vendor. Self-signed certificates are disallowed by this requirement. The SUSE operating system should
    not have to verify the software again. This requirement does not mandate DOD certificates for this purpose; however, the
    certificate used to verify the software must be from an approved Certification Authority (CA).
  impact: ''
  references: []
  page_start: 130
  audit_raw: 'Verify that the SUSE operating system tool zypper has gpgcheck enabled.

    Check that zypper has gpgcheck enabled with the following command:

    grep -i ''^gpgcheck'' /etc/zypp/zypp.conf

    gpgcheck = 1

    If "gpgcheck" is set to "0", "off", "no", or "false", this is a finding.'
  remediation: 'Configure that the SUSE operating system tool zypper to enable gpgcheck by editing or

    adding the following line to "/etc/zypp/zypp.conf":

    gpgcheck = 1'
  checks:
  - type: command
    command: grep -i '^gpgcheck' /etc/zypp/zypp.conf
    expected: Verify that the SUSE operating system tool zypper has gpgcheck enabled.
    severity: medium
    info: 'Verify that the SUSE operating system tool zypper has gpgcheck enabled.

