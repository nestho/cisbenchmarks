  description: 'The SUSE operating system must have a firewall system installed to immediately disconnect or disable remote
    access to the whole operating system. GROUP ID: V-234846 RULE ID: SV-234846r958674'
  rationale: Operating system remote access functionality must have the capability to immediately disconnect current users
    remotely accessing the information system and/or disable further remote access. The speed of disconnect or disablement
    varies based on the criticality of mission functions and the need to eliminate immediate or future remote access to organizational
    information systems. SUSE operating systems are capable to immediately stop remote connections and services by a local
    system administrator. To immediately disconnect or disable remote access, the firewall needs to be set into panic mode.
    sudo firewall-cmd --panic-on To enable remote connection again, panic mode needs to be disabled. sudo firewall-cmd --panic-off
  impact: ''
  references: []
