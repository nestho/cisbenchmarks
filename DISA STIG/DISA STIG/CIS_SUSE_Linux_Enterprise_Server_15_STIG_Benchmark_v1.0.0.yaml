- id: '1.213'
  title: SLES-15-040430
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The SUSE operating system must not allow unattended or automatic logon via the graphical user interface (GUI).
    GROUP ID: V-235031 RULE ID: SV-235031r991591'
  rationale: Failure to restrict system access to authenticated users negatively impacts SUSE operating system security.
  impact: ''
  references: []
  page_start: 435
  audit_raw: 'Note: If a graphical user interface is not installed, this requirement is Not Applicable.

    Verify the SUSE operating system does not allow unattended or automatic logon via the

    GUI.

    Check that unattended or automatic login is disabled with the following commands:

    grep -i ^DISPLAYMANAGER_AUTOLOGIN /etc/sysconfig/displaymanager

    DISPLAYMANAGER_AUTOLOGIN=""

    grep -i ^DISPLAYMANAGER_PASSWORD_LESS_LOGIN /etc/sysconfig/displaymanager

    DISPLAYMANAGER_PASSWORD_LESS_LOGIN="no"

    If the "DISPLAYMANAGER_AUTOLOGIN" parameter includes a username or the

    "DISPLAYMANAGER_PASSWORD_LESS_LOGIN"

    If parameter is not set to "no", this is a finding.'
  remediation: 'Note: If a graphical user interface is not installed, this requirement is Not Applicable.

    Configure the SUSE operating system GUI to not allow unattended or automatic logon

    to the system.

    Add or edit the following lines in the "/etc/sysconfig/displaymanager"

    configuration file:

    DISPLAYMANAGER_AUTOLOGIN=""

    DISPLAYMANAGER_PASSWORD_LESS_LOGIN="no"'
