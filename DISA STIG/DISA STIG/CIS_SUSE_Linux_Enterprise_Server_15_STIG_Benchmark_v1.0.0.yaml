    Add or modify the following line in the /etc/pam.d/common-account file:

    account required pam_tally2.so

    Note: Manual changes to the listed files may be overwritten by the "pam-config"

    program. The "pam-config" program should not be used to update the configurations

    listed in this requirement.'
