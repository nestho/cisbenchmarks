- id: '1.162'
  title: SLES-15-030790
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must off-load audit records onto a different system or media from the system being
    audited. GROUP ID: V-234978 RULE ID: SV-234978r1009573'
  rationale: Information stored in one location is vulnerable to accidental or incidental deletion or alteration. Off-loading
    is a common process in information systems with limited audit storage capacity.
  impact: ''
  references: []
  page_start: 352
  audit_raw: 'Verify what action the audit system takes if it cannot off-load audit records to a different

    system or storage media from the SUSE operating system being audited.

    Check the action that the audit system takes in the event of a network failure with the

    following command:

    sudo grep -i "network_failure_action" /etc/audit/audisp-remote.conf

    network_failure_action = syslog

    If the "network_failure_action" option is not set to "syslog", "single", or "halt" or the line

    is commented out, this is a finding.'
  remediation: 'Configure the SUSE operating system to take the appropriate action if it cannot off-load

    audit records to a different system or storage media from the system being audited due

    to a network failure.

    Uncomment the "network_failure_action" option in "/etc/audit/audisp-remote.conf" and

    set it to "syslog", "single", or "halt". See the example below:

    network_failure_action = syslog'
  checks:
  - type: manual_review
    info: 'Verify what action the audit system takes if it cannot off-load audit records to a different

      system or storage media from the SUSE operating system being audited.

      Check the action that the audit system takes in the event of a network failure with the

      following command:

      sudo grep -i "network_failure_action" /etc/audit/audisp-remote.conf

      network_failure_action = syslog

      If the "network_failure_action" option is not set to "syslog", "single", or "halt" or the line

      is commented out, this is a finding'
    severity: medium
