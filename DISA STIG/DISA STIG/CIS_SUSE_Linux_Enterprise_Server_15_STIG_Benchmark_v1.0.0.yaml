    all information requiring at rest protection by using disk encryption.

    Determine the partition layout for the system with the following command:

    sudo fdisk -l

    Device Boot Start End Sectors Size Id Type

    /dev/sda1 2048 4208639 4206592 2G 82 Linux swap

    /dev/sda2 * 4208640 53479423 49270784 23.5G 83 Linux

    /dev/sda3 53479424 125829119 72349696 34.5G 83 Linux

    Verify the system partitions are all encrypted with the following command:

    sudo more /etc/crypttab

    cr_root UUID=26d4a101-7f48-4394-b730-56dc00e65f64

    cr_home UUID=f5b8a790-14cb-4b82-882d-707d52f27765

    cr_swap UUID=f2d86128-f975-478d-a5b0-25806c900eac

    Every persistent disk partition present on the system must have an entry in the file.

    If any partitions other than pseudo file systems (such as /proc or /sys) are not listed or

    "/etc/crypttab" does not exist, this is a finding.'
  remediation: 'Configure the SUSE operating system to prevent unauthorized modification of all

    information at rest by using disk encryption.

    Encrypting a partition in an already-installed system is more difficult because of the

    need to resize and change existing partitions. To encrypt an entire partition, dedicate a

    partition for encryption in the partition layout. The standard partitioning proposal as

    suggested by YaST (installation and configuration tool for Linux) does not include an

    encrypted partition by default. Add it manually in the partitioning dialog.

    Refer to the document "SUSE Linux Enterprise Server 15 SP1 - Security Guide",

    Section 12.1.2, for a detailed disk encryption guide:

    https://documentation.suse.com/sles/15-SP1/html/SLES-all/cha-securitycryptofs.html#sec-security-cryptofs-y2-part-run'
