- id: '1.190'
  title: SLES-15-040220
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must be configured to not overwrite Pluggable Authentication Modules (PAM) configuration
    on package changes. GROUP ID: V-235006 RULE ID: SV-235006r991589'
  rationale: The "pam-config" command line utility automatically generates a system PAM configuration as packages are installed,
    updated, or removed from the system. "pamconfig" removes configurations for PAM modules and parameters that it does not
    know about. It may render ineffective PAM configuration by the system administrator and thus impact system security.
  impact: ''
  references: []
  page_start: 394
  audit_raw: 'Verify the SUSE operating system is configured to not overwrite PAM configuration on

    package changes.

    Check that soft links between PAM configuration files are removed with the following

    command:

    find /etc/pam.d/ -type l -iname "common-*"

    If any results are returned, this is a finding.'
  remediation: 'Copy the PAM configuration files to their static locations and remove the SUSE

    operating system soft links for the PAM configuration files with the following command:

    sudo sh -c ''for X in /etc/pam.d/common-*-pc; do cp -ivp --remove-destination

    $X ${X:0:-3}; done''

    Additional information on the configuration of multifactor authentication on the SUSE

    operating system can be found at https://www.suse.com/communities/blog/configuringsmart-card-authentication-suse-linux-enterprise/.'
  checks:
  - type: command
    command: find /etc/pam.d/ -type l -iname "common-*"
    expected: ''
    severity: medium
    info: 'Verify the SUSE operating system is configured to not overwrite PAM configuration on

      package changes.

      Check that soft links between PAM configuration files are removed with the following

      command:

      find /etc/pam.d/ -type l -iname "common-*"

      If any results are returned, this is a finding.'
- id: '1.191'
  title: SLES-15-040230
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system SSH daemon must be configured to not allow authentication using known hosts authentication.
    GROUP ID: V-235007 RULE ID: SV-235007r991589'
  rationale: Configuring this setting for the SSH daemon provides additional assurance that remote logon via SSH will require
    a password, even in the event of misconfiguration elsewhere.
  impact: ''
  references: []
  page_start: 396
  audit_raw: 'Verify the SUSE operating system SSH daemon is configured to not allow

    authentication using "known hosts" authentication.

    To determine how the SSH daemon''s "IgnoreUserKnownHosts" option is set, run the

    following command:

    sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr

    ''\n'' '' '' | xargs sudo grep -iH ''^\s*ignoreuserknownhosts''

    IgnoreUserKnownHosts yes

    If the value is returned as "no", the returned line is commented out, or no output is

    returned, this is a finding.'
  remediation: 'Configure the SUSE operating system SSH daemon to not allow authentication using

    "known hosts" authentication.

    Add the following line in "/etc/ssh/sshd_config", or uncomment the line and set the value

    to "yes":

    IgnoreUserKnownHosts yes'
  checks:
  - type: manual_review
    info: 'Verify the SUSE operating system SSH daemon is configured to not allow

