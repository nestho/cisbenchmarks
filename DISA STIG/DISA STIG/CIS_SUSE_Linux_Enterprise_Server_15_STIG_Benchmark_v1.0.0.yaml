- id: '1.165'
  title: SLES-15-030820
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system must not disable syscall auditing. GROUP ID: V-234981 RULE ID: SV-234981r991589'
  rationale: By default, the SUSE operating system includes the "-a task,never" audit rule as a default. This rule suppresses
    syscall auditing for all tasks started with this rule in effect. Because the audit daemon processes the "audit.rules"
    file from the top down, this rule supersedes all other defined syscall rules; therefore no syscall auditing can take place
    on the operating system.
  impact: ''
  references: []
  page_start: 357
  audit_raw: 'Verify syscall auditing has not been disabled:

    auditctl -l | grep -i "a task,never"

    If any results are returned, this is a finding.

    Verify the default rule "-a task,never" is not statically defined :

    grep -rv "^#" /etc/audit/rules.d/ | grep -i "a task,never"

    If any results are returned, this is a finding.'
  remediation: 'Remove the "-a task,never" rule from the /etc/audit/rules.d/audit.rules file.

    The audit daemon must be restarted for the changes to take effect.

    sudo systemctl restart auditd.service'
  checks:
  - type: command
    command: auditctl -l | grep -i "a task,never" && grep -rv "^#" /etc/audit/rules.d/ | grep -i "a task,never"
    expected: ''
    severity: medium
    info: 'Verify syscall auditing has not been disabled:

      auditctl -l | grep -i "a task,never"

      If any results are returned, this is a finding.

      Verify the default rule "-a task,never" is not statically defined :

