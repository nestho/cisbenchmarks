- id: '1.147'
  title: SLES-15-030590
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system audit system must take appropriate action when the audit storage volume is full.
    GROUP ID: V-234958 RULE ID: SV-234958r1038966'
  rationale: 'It is critical that when the SUSE operating system is at risk of failing to process audit logs as required,
    it takes action to mitigate the failure. Audit processing failures include software/hardware errors, failures in the audit
    capturing mechanisms, and audit storage capacity being reached or exceeded. Responses to audit failure depend on the nature
    of the failure mode. When availability is an overriding concern, other approved actions in response to an audit failure
    are as follows: 1. If the failure was caused by the lack of audit record storage capacity, the SUSE operating system must
    continue generating audit records if possible (automatically restarting the audit service if necessary), overwriting the
    oldest audit records in a first-in-first-out manner. 2. If audit records are sent to a centralized collection server and
    communication with this server is lost or the server fails, the SUSE operating system must queue audit records locally
    until communication is restored or until the audit records are retrieved manually. Upon restoration of the connection
    to the centralized collection server, action should be taken to synchronize the local audit data with the collection server.'
  impact: ''
  references: []
  page_start: 320
  audit_raw: 'Verify the SUSE operating system takes the appropriate action when the audit storage

    volume is full.

    Check that the SUSE operating system takes the appropriate action when the audit

    storage volume is full with the following command:

    sudo grep disk_full_action /etc/audit/auditd.conf

    disk_full_action = SYSLOG

    If the value of the "disk_full_action" option is not "SYSLOG", "SINGLE", or "HALT", or

