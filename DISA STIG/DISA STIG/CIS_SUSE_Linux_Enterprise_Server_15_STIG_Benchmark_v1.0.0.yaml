      If any ciphers other than "hmac-sha2-512" or "hmac-sha2-256" are listed, the order

      differs from the example a'
    severity: medium
- id: '1.26'
  title: SLES-15-010280
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The SUSE operating system SSH daemon must be configured with a timeout interval. GROUP ID: V-234827 RULE ID:
    SV-234827r986464'
  rationale: 'Terminating an idle session within a short time period reduces the window of opportunity for unauthorized personnel
    to take control of a management session enabled on the console or console port that has been left unattended. In addition,
    quickly terminating an idle session will also free up resources committed by the managed network element. Terminating
    network connections associated with communications sessions includes, for example, deallocating associated TCP/IP address/port
    pairs at the SUSE operating system-level, and deallocating networking assignments at the application level if multiple
    application sessions are using a single SUSE operating system-level network connection. This does not mean that the SUSE
    operating system terminates all sessions or network access; it only ends the inactive session and releases the resources
    associated with that session. Satisfies: SRG-OS-000126-GPOS-00066, SRG-OS-000163-GPOS-00072, SRG-OS000279-GPOS-00109'
  impact: ''
  references: []
  page_start: 72
  audit_raw: 'Verify the SUSE operating system SSH daemon is configured to timeout idle sessions.

    Check that the "ClientAliveInterval" parameter is set to a value of "600" with the

    following command:

    sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr

    ''\n'' '' '' | xargs sudo grep -iH ''^\s*clientaliveinterval''

    ClientAliveInterval 600

    If "ClientAliveInterval" is not set to "600" in "/etc/ssh/sshd_config", this is a finding.'
  remediation: 'Configure the SUSE operating system SSH daemon to timeout idle sessions.

    Add or modify (to match exactly) the following line in the "/etc/ssh/sshd_config" file:

    ClientAliveInterval 600

    The SSH daemon must be restarted for any changes to take effect.'
  checks:
  - type: manual_review
    info: 'Verify the SUSE operating system SSH daemon is configured to timeout idle sessions.

      Check that the "ClientAliveInterval" parameter is set to a value of "600" with the

      following command:

      sudo /usr/sbin/sshd -dd 2>&1 | awk ''/filename/ {print $4}'' | tr -d ''\r'' | tr

      ''\n'' '' '' | xargs sudo grep -iH ''^\s*clientaliveinterval''

      ClientAliveInterval 600

      If "ClientAliveInterval" is not set to "600" in "/etc/ssh/sshd_config", this is a finding.'
    severity: medium
- id: '1.27'
  title: SLES-15-010300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The sticky bit must be set on all SUSE operating system world-writable directories. GROUP ID: V-234828 RULE
    ID: SV-234828r958524'
  rationale: Preventing unauthorized information transfers mitigates the risk of information, including encrypted representations
    of information, produced by the actions of prior users/roles (or the actions of processes acting on behalf of prior users/roles)
    from being available to any current users/roles (or current processes) that obtain access to shared system resources (e.g.,
    registers, main memory, and hard disks) after those resources have been released back to information systems. The control
    of information in shared resources is also commonly referred to as object reuse and residual information protection. This
    requirement generally applies to the design of an information technology product, but it can also apply to the configuration
    of particular information system components that are, or use, such products. This can be verified by acceptance/validation
    processes in DoD or other government agencies. There may be shared resources with configurable protections (e.g., files
    in storage) that may be assessed on specific information system components.
  impact: ''
  references: []
  page_start: 74
  audit_raw: 'Verify the SUSE operating system prevents unauthorized and unintended information

    transfer via the shared system resources.

    Check that world-writable directories have the sticky bit set with the following command:

    sudo find / \( -path /.snapshots -o -path /sys -o -path /proc \) -prune -o -

    perm -002 -type d -exec ls -lLd {} \;

    256 0 drwxrwxrwt 1 root root 4096 Jun 14 06:45 /tmp

    If any of the returned directories do not have the sticky bit set, or are not documented as

    having the write permission for the other class, this is a finding.'
  remediation: 'Configure the SUSE operating system shared system resources to prevent any

    unauthorized and unintended information transfer by setting the sticky bit for all worldwritable directories.

    An example of a world-writable directory is "/tmp" directory. Set the sticky bit on all of

    the world-writable directories (using the "/tmp" directory as an example) with the

    following command:

    sudo chmod 1777 /tmp

    For every world-writable directory, replace "/tmp" in the command above with the worldwritable directory that does not
    have the sticky bit set.'
  checks:
  - type: manual_review
    info: 'Verify the SUSE operating system prevents unauthorized and unintended information

      transfer via the shared system resources.

      Check that world-writable directories have the sticky bit set with the following command:

      sudo find / \( -path /.snapshots -o -path /sys -o -path /proc \) -prune -o -

