  title: GOOG-15-008700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 15 must be configured to enable authentication of personal hotspot connections to the device
    using a preshared key. GROUP ID: V-267447 RULE ID: SV-267447r1033115'
  rationale: 'If no authentication is required to establish personal hotspot connections (Wi-Fi and Bluetooth), an adversary
    may be able to use that device to perform attacks on other devices or networks without detection. A sophisticated adversary
    may also be able to exploit unknown system vulnerabilities to access information and computing resources on the device.
    Requiring authentication to establish personal hotspot connections mitigates this risk. Application note: If hotspot functionality
    is permitted, it must be authenticated via a preshared key. There is no requirement to enable hotspot functionality, and
    it is recommended this functionality be disabled by default. SFRID: FMT_SMF.1.1 41'
  impact: ''
  references: []
  page_start: 49
  audit_raw: 'This is a User-Based Enforcement (UBE) control.

    Check a sample of Pixel phones at the site and verify the Wi-Fi hotspot preshared key

    (password) is set to "WPA2/WPA3-Personal" or "WPA3-Personal".

    1. Go to Settings >> Network & Internet >> Hotspot & tethering.

    2. Enable "Wi-Fi hotspot".

    3. Tap on the words to the left of the slide called "Wi-Fi Hotspot" to show the

    configuration options.

    4. Click the "Security" link and verify either “WPA2/WPA3-Personal” or "WPA3Personal" is selected.

    If the Wi-Fi hotspot security is not set to “WPA2/WPA3-Personal” or "WPA3-Personal",

    this is a finding.'
  remediation: 'This is a User-Based Enforcement (UBE) control.

    Train users to not change the default Wi-Fi hotspot security setting: 15-character

    complex Wi-Fi hotspot preshared key (password) ("WPA2/WPA3-Personal" or WPA3Personal"). (GOOG-15-009800).

    If the required preshared key is not set up, train users to use the following procedure to

    set up the required setting:

    1. Go to Settings >> Network & Internet >> Hotspot & tethering.

    2. Enable "Wi-Fi hotspot".

    3. Tap on the words to the left of the slide called "Wi-Fi Hotspot" to show the

    configuration options.

    4. Click the "Security" link and select “WPA2/WPA3-Personal” or "WPA3-Personal".'
