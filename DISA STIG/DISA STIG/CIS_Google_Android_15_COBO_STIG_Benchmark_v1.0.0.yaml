controls:
- id: '1.1'
  title: GOOG-15-002800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 15 must be configured to enable audit logging. GROUP ID: V-267430 RULE ID: SV-267430r1031475'
  rationale: 'Audit logs enable monitoring of security-relevant events and subsequent forensics when breaches occur. To be
    useful, administrators must have the ability to view the audit logs. SFRID: FMT_SMF.1.1 32'
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'Inspect the configuration on the managed Google Android 15 device to enable audit

    logging.

    This validation procedure is performed only on the EMM Administration Console.

    On the EMM console:

    COBO and COPE:

    1. Open "Device owner management" section.

    2. Verify that "Enable security logging" is toggled to "ON".

    If the EMM console device policy is not set to enable audit logging, this is a finding.'
  remediation: 'Configure the Google Android 15 device to enable audit logging.

    On the EMM console:

    COBO and COPE:

    1. Open "Device owner management" section.

    2. Toggle "Enable security logging" to "ON".'
  checks:
  - type: manual_review
    info: 'Inspect the configuration on the managed Google Android 15 device to enable audit

      logging.

      This validation procedure is performed only on the EMM Administration Console.

      On the EMM console:

      COBO and COPE:

      1. Open "Device owner management" section.

      2. Verify that "Enable security logging" is toggled to "ON".

      If the EMM console device policy is not set to enable audit logging, this is a finding.'
    severity: medium
- id: '1.2'
  title: GOOG-15-006000
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 15 must be configured to enforce a minimum password length of six characters. GROUP ID: V-267431
    RULE ID: SV-267431r1031478'
  rationale: 'Password strength is a measure of the effectiveness of a password in resisting guessing and brute force attacks.
    The ability to crack a password is a function of how many attempts an adversary is permitted, how quickly an adversary
    can do each attempt, and the size of the password space. The longer the minimum length of the password, the larger the
    password space. Having a too-short minimum password length significantly reduces password strength, increasing the chance
    of password compromise and resulting in device and data compromise. SFRID: FMT_SMF.1.1 1'
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'Review managed Google Android 15 device configuration settings to determine if the

    mobile device is enforcing a minimum password length of six characters.

    This validation procedure is performed on both the EMM Administration Console and

    the managed Google Android 15 device.

    On the EMM console:

    COBO:

    1. Open "Lock screen" settings.

    2. Open "Password constraints".

    3. Open "Minimum password quality".

    4. Verify Numeric Complex, Alphabetic, Alphanumeric, or Complex is selected.

    5. Open "Minimum password length".

    6. Verify "6" is set for number of characters.

    COPE:

    1. Open "Lock screen" settings.

    2. Open "Password constraints".

    3. Select "Personal Profile".

    4. Verify "Minimum password quality" is set to Numeric Complex, Alphabetic,

    Alphanumeric, or Complex.

    5. Open "Minimum password length".

    6. Verify the number of characters is set to "6" or higher.

    On the managed Google Android 15 device:

    COBO and COPE:

    1. Open Settings >> Security & privacy >> Device unlock >> Screen lock.

    2. Enter current password.

    3. Tap "Pin or Password".

    4. Verify Password length required is at least "6".

    If the device password length is not set to six characters or more on EMM console or on

    the managed Google Android 15 device, this is a finding.'
  remediation: 'Configure the Google Android 15 device to enforce a minimum password length of six

    characters.

    On the EMM console:

    COBO:

    1. Open "Lock screen" settings.

    2. Open "Password constraints".

    3. Open "Minimum password quality".

    4. Choose Numeric Complex, Alphabetic, Alphanumeric, or Complex.

    5. Open "Minimum password length".

    6. Enter in the number of characters as "6".

    COPE:

    1. Open "Lock screen" settings.

    2. Open "Password constraints".

    3. Select "Personal Profile".

    4. Open "Minimum password quality".

    5. Choose Numeric Complex, Alphabetic, Alphanumeric, or Complex.

    6. Open "Minimum password length".

    7. Enter in the number of characters as "6".'
  checks:
  - type: manual_review
    info: 'Review managed Google Android 15 device configuration settings to determine if the

      mobile device is enforcing a minimum password length of six characters.

      This validation procedure is performed on both the EMM Administration Console and

      the managed Google Android 15 device.

      On the EMM console:

      COBO:

      1. Open "Lock screen" settings.

      2. Open "Password constraints".

      3. Open "Minimum password quality".

      4. Verify Numeric Complex, Alphabetic, Alphanumeric, or Complex is selected.

      5. Open "Minimum passw'
    severity: medium
- id: '1.3'
  title: GOOG-15-006100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 15 must be configured to not allow passwords that include more than four repeating or sequential
    characters. GROUP ID: V-267432 RULE ID: SV-267432r1031481'
  rationale: 'Password strength is a measure of the effectiveness of a password in resisting guessing and brute force attacks.
    Passwords that contain repeating or sequential characters are significantly easier to guess than those that do not contain
    repeating or sequential characters. Therefore, disallowing repeating or sequential characters increases password strength
    and decreases risk. SFRID: FMT_SMF.1.1 1'
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Review managed Google Android 15 device configuration settings to determine if the

    mobile device is prohibiting passwords with more than four repeating or sequential

    characters.

    This validation procedure is performed on both the EMM Administration Console and

    the managed Google Android 15 device.

    On the EMM console:

    COBO:

    1. Open "Lock screen" settings.

    2. Open "Password constraints".

    3. Verify that quality is set to "Numeric (Complex)" or higher.

    COPE:

    1. Open "Lock screen" settings.

    2. Open "Password constraints".

    3. Select "Personal Profile".

    4. Verify that quality is set to "Numeric (Complex)" or higher.

    On the managed Google Android 15 device:

    COBO and COPE:

    1. Open Settings >> Security >> Screen lock.

    2. Enter current password.

    3. Select "PIN".

    4. Try to enter a new PIN with repeating numbers.

    5. Verify Password complexity requirements are listed: Ascending, descending, or

    repeated sequence of digits is not allowed.

    If the EMM console device policy is set to a password with more than two repeating or

    sequential characters or on the managed Google Android 15 device, the device policy is

    set to a password with more than two repeating or sequential characters, this is a

    finding.

    Note: Alphabetic, Alphanumeric, and Complex are also acceptable selections, but these

    selections will cause the user to select a complex password, which is not required by

    the STIG.'
  remediation: 'Configure the Google Android 15 device to prevent passwords from containing more

    than four repeating or sequential characters.

    On the EMM console:

    COBO:

    1. Open "Lock screen" settings.

    2. Open "Password constraints".

    3. Set password quality to "Numeric (Complex)".

    COPE:

    1. Open "Password constraints".

    2. Select "Personal Profile".

    3. Set password quality to "Numeric (Complex)".

    Note: Alphabetic, Alphanumeric, and Complex are also acceptable selections, but these

    selections will cause the user to select a complex password, which is not required by

    the STIG.'
  checks:
  - type: manual_review
    info: 'Review managed Google Android 15 device configuration settings to determine if the

      mobile device is prohibiting passwords with more than four repeating or sequential

      characters.

      This validation procedure is performed on both the EMM Administration Console and

      the managed Google Android 15 device.

      On the EMM console:

      COBO:

      1. Open "Lock screen" settings.

      2. Open "Password constraints".

      3. Verify that quality is set to "Numeric (Complex)" or higher.

      COPE:

      1. Open "Lock screen" settings.

      2. Open "P'
    severity: medium
- id: '1.4'
  title: GOOG-15-006300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 15 must be configured to lock the display after 15 minutes (or less) of inactivity. GROUP ID:
    V-267433 RULE ID: SV-267433r1031484'
  rationale: 'The screen lock timeout must be set to a value that helps protect the device from unauthorized access. Having
    a too-long timeout would increase the window of opportunity for adversaries who gain physical access to the mobile device
    through loss, theft, etc. Such devices are much more likely to be in an unlocked state when acquired by an adversary,
    thus granting immediate access to the data on the mobile device. The maximum timeout period of 15 minutes has been selected
    to balance functionality and security; shorter timeout periods may be appropriate depending on the risks posed to the
    mobile device. SFRID: FMT_SMF.1.1 2'
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'Review managed Google Android device configuration settings to determine if the

    mobile device is enforcing a screen-lock policy that will lock the display after a period of

    15 minutes or less of inactivity.

    Note: Google Android 15 Settings User Interface (UI) does not support the 15-minute

    increment, but this value can be set by the MDM.

    This validation procedure is performed on both the EMM Administration Console and

    the Android 15 device.

    On the EMM console:

    COBO:

    1. Open "Lock screen restrictions".

    2. Verify that "Max time to screen lock" is set to "900".

    3. Note: The units are in seconds.

    COPE:

    1. Open "Lock screen restrictions".

    2. Select "Personal Profile".

    3. Verify that "Max time to screen lock" is set to "900".

    4. Note: The units are in seconds.

    If the EMM console device policy is not set to enable a screen-lock policy that will lock

    the display after a period of inactivity of 900 seconds, this is a finding.'
  remediation: 'Configure the Google Android 15 device to enable a screen-lock policy of 15 minutes for

    the max period of inactivity.

    Note: Google Android 15 Settings User Interface (UI) does not support the 15-minute

    increment, but this value can be set by the MDM.

    On the EMM console:

    COBO:

    1. Open "Lock screen restrictions".

    2. Set "Max time to screen lock" to "900".

    3. Note: The units are in seconds.

    COPE:

    1. Open "Lock screen restrictions".

    2. Select "Personal Profile".

    3. Set "Max time to screen lock" to 900".

    4. Note: The units are in seconds.'
  checks:
  - type: manual_review
    info: 'Review managed Google Android device configuration settings to determine if the

      mobile device is enforcing a screen-lock policy that will lock the display after a period of

      15 minutes or less of inactivity.

      Note: Google Android 15 Settings User Interface (UI) does not support the 15-minute

      increment, but this value can be set by the MDM.

      This validation procedure is performed on both the EMM Administration Console and

      the Android 15 device.

      On the EMM console:

      COBO:

      1. Open "Lock screen restrict'
    severity: medium
- id: '1.5'
  title: GOOG-15-006400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 15 must be configured to not allow more than 10 consecutive failed authentication attempts.
    GROUP ID: V-267434 RULE ID: SV-267434r1033027'
  rationale: 'The more attempts an adversary has to guess a password, the more likely the adversary will enter the correct
    password and gain access to resources on the device. Setting a limit on the number of attempts mitigates this risk. Setting
    the limit at 10 or less gives authorized users the ability to make a few mistakes when entering the password but still
    provides adequate protection against dictionary or brute force attacks on the password. SFRID: FMT_SMF.1.1 2, FIA_AFL_EXT.1.5'
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'Review managed Google Android 15 device configuration settings to determine if the

    mobile device has the maximum number of consecutive failed authentication attempts

    set at 10 or fewer.

    This validation procedure is performed on both the EMM Administration Console and

    the managed Google Android 15 device.

    On the EMM console:

    COBO:

    1. Open "Lock screen" settings.

    2. Open "Lock screen restrictions".

    3. Verify that "Max password failures for local wipe" is set to a number between 1

    and 10.

    COPE:

    1. Open "Lock screen" settings.

    2. Open "Lock screen restrictions".

    3. Select "Personal Profile".

    4. Verify that "Max password failures for local wipe" is set to a number between 1

    and 10.

    On the managed Google Android 15 device:

    COBO and COPE:

    1. Lock the device screen.

    2. Attempt to unlock the screen and validate that the device autowipes after

    specified number of invalid entries. Note: Perform this verification only with a test

    phone set up with a production profile.

    If the EMM console device policy is not set to the maximum number of consecutive

    failed authentication attempts at 10 or fewer, or if on the managed Google Android 15

    device the device policy is not set to the maximum number of consecutive failed

    authentication attempts at 10 or fewer, this is a finding.'
  remediation: 'Configure the Google Android 15 device to allow only 10 or fewer consecutive failed

    authentication attempts.

    On the EMM console:

    COBO:

    1. Open "Lock screen" settings.

    2. Open "Lock screen restrictions".

    3. Set "Max password failures for local wipe" to a number between 1 and 10.

    COPE:

    1. Open "Lock screen" settings.

    2. Open "Lock screen restrictions".

    3. Select "Personal Profile".

    4. Set "Max password failures for local wipe" to a number between 1 and 10.'
  checks:
  - type: manual_review
    info: 'Review managed Google Android 15 device configuration settings to determine if the

      mobile device has the maximum number of consecutive failed authentication attempts

      set at 10 or fewer.

      This validation procedure is performed on both the EMM Administration Console and

      the managed Google Android 15 device.

      On the EMM console:

      COBO:

      1. Open "Lock screen" settings.

      2. Open "Lock screen restrictions".

      3. Verify that "Max password failures for local wipe" is set to a number between 1

      and 10.

      COPE:

      1. '
    severity: medium
- id: '1.6'
  title: GOOG-15-006500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 15 must be configured to enforce an application installation policy by specifying one or more
    authorized application repositories, including [selection: DODapproved commercial app repository, MDM server, mobile application
    store]. GROUP ID: V-267435 RULE ID: SV-267435r1031490'
  rationale: 'Forcing all applications to be installed from authorized application repositories can prevent unauthorized and
    malicious applications from being installed and executed on mobile devices. Allowing such installations and executions
    could cause a compromise of DOD data accessible by these unauthorized/malicious applications. SFRID: FMT_SMF.1.1 8'
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'Review managed Google Android 15 device configuration settings to determine if the

    mobile device has only approved application repositories (DOD-approved commercial

    app repository, EMM server, and/or mobile application store).

    This validation procedure is performed on both the EMM Administration Console and

    the managed Google Android 15 device.

    On the EMM console:

    COBO and COPE:

    1. Open "Set user restrictions".

    2. Verify that "Disallow install unknown sources" is toggled to "ON".

    3. Verify that "Disallow installs from unknown sources globally" is toggled to "ON".

    On the Google Android 15 device:

    COBO and COPE:

    1. Open Settings >> Apps >> Special app access.

    2. Open Install unknown apps.

    3. Ensure the list of apps is blank or if an app is on the list, "Disabled by admin" is

    listed under the app name.

    If the EMM console device policy is not set to allow connections to only approved

    application repositories or on the managed Google Android 15 device, the device policy

    is not set to allow connections to only approved application repositories, this is a finding.'
  remediation: 'Configure the Google Android 15 device to disable unauthorized application

    repositories.

    On the EMM console:

    COBO and COPE:

    1. Open "Set user restrictions".

    2. Toggle "Disallow install unknown sources" to "ON".

    3. Toggle "Disallow installs from unknown sources globally" to "ON".'
  checks:
  - type: manual_review
    info: 'Review managed Google Android 15 device configuration settings to determine if the

      mobile device has only approved application repositories (DOD-approved commercial

      app repository, EMM server, and/or mobile application store).

      This validation procedure is performed on both the EMM Administration Console and

      the managed Google Android 15 device.

      On the EMM console:

      COBO and COPE:

      1. Open "Set user restrictions".

      2. Verify that "Disallow install unknown sources" is toggled to "ON".

      3. Verify that '
    severity: medium
- id: '1.7'
  title: GOOG-15-006600
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 15 must be configured to enforce an application installation policy by specifying an application
    allow list that restricts applications by the following characteristics: [selection: list of digital signatures, cryptographic
    hash values, names, application version]. GROUP ID: V-267436 RULE ID: SV-267436r1033112'
  rationale: 'The application allow list, in addition to controlling the installation of applications on the MD, must control
    user access/execution of all core and preinstalled applications, or the MD must provide an alternate method of restricting
    user access/execution to core and preinstalled applications. Core application: Any application integrated into the OS
    by the OS or MD vendors. Preinstalled application: Additional noncore applications included in the OS build by the OS
    vendor, MD vendor, or wireless carrier. Requiring all authorized applications to be in an application allow list prevents
    the execution of any applications (e.g., unauthorized, malicious) that are not part of the allow list. Failure to configure
    an application allow list properly could allow unauthorized and malicious applications to be downloaded, installed, and
    executed on the mobile device, causing a compromise of DOD data accessible by these applications. The application allow
    list, in addition to controlling the installation of applications on the MD, must control user access/execution of all
    core applications (included in the OS by the OS vendor) and preinstalled applications (provided by the MD vendor and wireless
    carrier), or the MD must provide an alternate method of restricting user access/execution to core and preinstalled applications.
    SFRID: FMT_SMF.1.1 8'
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'Review managed Google Android 15 device configuration settings to determine if the

    mobile device has an application allow list configured. Verify all applications on the

    allow list have been approved by the authorizing official (AO).

    On the EMM console:

    COBO and COPE:

    1. Go to the Android app catalog for managed Google Play.

    2. Verify all selected apps are AO approved.

    On the managed Google Android 15 device:

    COBO and COPE:

    1. Open the managed Google Play Store.

    2. Verify that only the approved apps are visible.

    Note: Managed Google Play is an allowed App Store.

    If the EMM console list of selected managed Google Play apps includes nonapproved

    apps, this is a finding.

    Note: The application allow list will include approved core applications (included in the

    OS by the OS vendor) and preinstalled applications (provided by the MD vendor and

    wireless carrier), or the MD must provide an alternate method of restricting user

    access/execution to core and preinstalled applications. For Google Android, there are

    no preinstalled applications.'
  remediation: 'Configure the Google Android 15 device to use an application allow list.

    On the EMM console:

    COBO and COPE:

    1. Go to the Android app catalog for managed Google Play.

    2. Select apps to be available (only approved apps).

    3. Push updated policy to the device.

    Note: Managed Google Play is an allowed App Store.'
  checks:
  - type: manual_review
    info: 'Review managed Google Android 15 device configuration settings to determine if the

      mobile device has an application allow list configured. Verify all applications on the

      allow list have been approved by the authorizing official (AO).

      On the EMM console:

      COBO and COPE:

      1. Go to the Android app catalog for managed Google Play.

      2. Verify all selected apps are AO approved.

      On the managed Google Android 15 device:

      COBO and COPE:

      1. Open the managed Google Play Store.

      2. Verify that only the approved '
    severity: medium
- id: '1.8'
  title: GOOG-15-006700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 15 allow list must be configured to not include applications with the following characteristics:
    • Backs up MD data to non-DOD cloud servers (including user and application access to cloud backup services); • Transmits
    MD diagnostic data to non-DOD servers; • Voice assistant application if available when MD is locked; • Voice dialing application
    if available when MD is locked; • Allows synchronization of data or applications between devices associated with user;
    • Payment processing; • Allows unencrypted (or encrypted but not FIPS 140-2/140-3 validated) data sharing with other MDs
    or printers; and • Backs up its own data to a remote system. GROUP ID: V-267437 RULE ID: SV-267437r1033032'
  rationale: 'Requiring all authorized applications to be in an application allow list prevents the execution of any applications
    (e.g., unauthorized, malicious) that are not part of the allow list. Failure to configure an application allow list properly
    could allow unauthorized and malicious applications to be downloaded, installed, and executed on the mobile device, causing
    a compromise of DOD data accessible by these applications. Applications with the listed characteristics have features
    that can cause the compromise of sensitive DOD data or have features with no known application in the DOD environment.
    Application note: The application allow list, in addition to controlling the installation of applications on the MD, must
    control user access/execution of all core and preinstalled applications, or the MD must provide an alternate method of
    restricting user access/execution to core and preinstalled applications. Core application: Any application integrated
    into the OS by the OS or MD vendors. Preinstalled application: Additional noncore applications included in the OS build
    by the OS vendor, MD vendor, or wireless carrier. SFRID: FMT_SMF.1.1 8'
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'Review managed Google Android 15 device configuration settings to determine if the

    mobile device has an application allow list configured and that the application allow list

    does not include applications with the following characteristics:

    • Backs up MD data to non-DOD cloud servers (including user and application

    access to cloud backup services);

    • Transmits MD diagnostic data to non-DOD servers;

    • Voice assistant application if available when MD is locked;

    • Voice dialing application if available when MD is locked;

    • Allows synchronization of data or applications between devices associated with

    user;

    • Payment processing;

    • Allows unencrypted (or encrypted but not FIPS 140-2/140-3 validated) data

    sharing with other MDs or printers; and

    • Backs up its own data to a remote system.

    This validation procedure is performed only on the EMM Administration Console.

    On the EMM console:

    1. Review the list of selected Managed Google Play apps.

    2. Review the details and privacy policy of each selected app to ensure the app

    does not include prohibited characteristics.

    If the EMM console device policy includes applications with unauthorized

    characteristics, this is a finding.'
  remediation: 'Configure the Google Android 15 device application allow list to exclude applications

    with the following characteristics:

    • Backs up MD data to non-DOD cloud servers (including user and application

    access to cloud backup services);

    • Transmits MD diagnostic data to non-DOD servers;

    • Voice assistant application if available when MD is locked;

    • Voice dialing application if available when MD is locked;

    • Allows synchronization of data or applications between devices associated with

    user;

    • Payment processing;

    • Allows unencrypted (or encrypted but not FIPS 140-2/140-3 validated) data

    sharing with other MDs or printers; and

    • Backs up its own data to a remote system.

    On the EMM console:

    1. Go to the Android app catalog for managed Google Play.

    2. Before selecting an app, review the app details and privacy policy to ensure the

    app does not include prohibited characteristics.'
  checks:
  - type: manual_review
    info: 'Review managed Google Android 15 device configuration settings to determine if the

      mobile device has an application allow list configured and that the application allow list

      does not include applications with the following characteristics:

      • Backs up MD data to non-DOD cloud servers (including user and application

      access to cloud backup services);

      • Transmits MD diagnostic data to non-DOD servers;

      • Voice assistant application if available when MD is locked;

      • Voice dialing application if availa'
    severity: medium
- id: '1.9'
  title: GOOG-15-006750
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 15 allow list must be configured to not include artificial intelligence (AI) applications that
    process device data in the cloud, including Google Gemini. GROUP ID: V-267438 RULE ID: SV-267438r1042520'
  rationale: 'Sensitive DOD data could be exposed when an AI app processes device data in the cloud. SFRID: FMT_SMF.1.1 8'
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'Review managed Google Android 15 device configuration settings to determine if the

    mobile device has an AI application that processes device data in the cloud, including

    Google Gemini.

    This validation procedure is performed only on the EMM Administration Console.

    On the EMM console:

    1. Review the list of selected Managed Google Play apps.

    2. Verify no AI applications that process device data in the cloud, including Google

    Gemini, are included.

    If the EMM console device policy includes AI applications that process device data in

    the cloud, including Google Gemini, this is a finding.

    Note: This restriction does not include Gemini Nano. Gemini Nano is a built-in capability

    of Android 15 and processes device data on the device. Refer to Section 2, Artificial

    Intelligence Restrictions, of the STIG Supplemental document for more information.'
  remediation: 'Configure the Google Android 15 device application allow list to exclude AI applications

    that process device data in the cloud, including Google Gemini.

    Note: This restriction does not include Gemini Nano. Gemini Nano is a built-in capability

    of Android 15 and processes device data on the device. See Section 2 "Artificial

    Intelligence Restrictions" of the STIG Supplemental document for more information.'
  checks:
  - type: manual_review
    info: 'Review managed Google Android 15 device configuration settings to determine if the

      mobile device has an AI application that processes device data in the cloud, including

      Google Gemini.

      This validation procedure is performed only on the EMM Administration Console.

      On the EMM console:

      1. Review the list of selected Managed Google Play apps.

      2. Verify no AI applications that process device data in the cloud, including Google

      Gemini, are included.

      If the EMM console device policy includes AI applica'
    severity: medium
- id: '1.10'
  title: GOOG-15-006800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 15 must be configured to not display the following (work profile) notifications when the device
    is locked: [selection: a. email notifications b. calendar appointments c. contact associated with phone call notification
    d. text message notification e. other application-based notifications f. all notifications]. GROUP ID: V-267439 RULE ID:
    SV-267439r1031502'
  rationale: 'Many mobile devices display notifications on the lock screen so that users can obtain relevant information in
    a timely manner without having to frequently unlock the phone to determine if there are new notifications. However, in
    many cases, these notifications can contain sensitive information. When they are available on the lock screen, an adversary
