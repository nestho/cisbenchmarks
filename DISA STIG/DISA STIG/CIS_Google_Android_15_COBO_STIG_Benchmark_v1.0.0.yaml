  title: GOOG-15-007200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 15 must be configured to disable trust agents. GROUP ID: V-267440 RULE ID: SV-267440r1031505'
  rationale: 'Trust agents allow a user to unlock a mobile device without entering a passcode when the mobile device is, for
    example, connected to a user-selected Bluetooth device or in a user-selected location. This technology would allow unauthorized
    users to have access to DOD sensitive data if compromised. By not permitting the use of nonpassword authentication mechanisms,
    users are forced to use passcodes that meet DOD passcode requirements. SFRID: FMT_SMF.1.1 22, FIA_UAU.5.1'
