    On the Google Android 15 device:

    1. Open Settings.

    2. Tap "Security & privacy".

    3. Tap "More security & privacy".

    4. Tap "Encryption & credentials".

    5. Tap "Trusted credentials".

    6. Verify the user is unable to untrust or remove any work certificates.

    If on the Google Android 15 device the user is able to remove certificates, this is a

    finding.'
  remediation: 'Configure Google Android 15 device to prevent a user from removing DOD root and

    intermediate PKI certificates.

