- id: '1.19'
  title: GOOG-15-009000
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 15 must be configured to disable multiuser modes. GROUP ID: V-267448 RULE ID: SV-267448r1033039'
  rationale: 'Multiuser mode allows multiple users to share a mobile device by providing a degree of separation between user
    data. To date, no mobile device with multiuser mode features meets DOD requirements for access control, data separation,
    and nonrepudiation for user accounts. In addition, the MDFPP does not include design requirements for multiuser account
    services. Disabling multiuser mode mitigates the risk of not meeting DOD multiuser account security policies. SFRID: FMT_SMF.1.1
    47a'
  impact: ''
  references: []
  page_start: 51
  audit_raw: 'Review documentation on the managed Google Android 15 device and inspect the

    configuration on the Google Android device to disable multiuser modes.

    This validation procedure is performed on both the EMM Administration Console and

    the managed Google Android 15 device.

    On the EMM console:

    COBO and COPE:

    1. Open "User restrictions".

    2. Open "Set user restrictions".

    3. Verify "Disallow modify accounts" is toggled to "ON".

    On the managed Google Android 15 device:

    COBO and COPE:

    1. Go to Settings >> Passwords, passkeys & accounts >> Accounts for Owner.

    2. Tap "Add account" (work profile).

    3. Verify the action is not allowed.

    If the EMM console device policy is not set to disable multiuser modes or on the

