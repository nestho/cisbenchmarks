    COBO:

    1. Open "Set user restrictions".

    2. Verify "Disallow config date time" is toggled to "ON".

    COPE:

    1. Open "Set user restrictions on parent".

    2. Verify "Disallow config date time" is toggled to "ON".

    On the managed Google Android 15 device:

    COBO and COPE:

    1. Open Settings.

    2. Tap "System".

    3. Tap "Date & time".

    4. Verify "Set time automatically" is greyed out and is "Enabled by admin".

    If on the EMM console "Disallow config date time" is not set to "On", or on the managed

    Android 15 device "Set time automatically" is not greyed out, this is a finding.'
  remediation: 'Configure the Google Android 15 device to set auto network time.

    On the EMM console:

    COBO:

    1. Open "Set user restrictions".

    2. Toggle "Disallow config date time" to "ON".

    COPE:

    1. Open "Set user restrictions on parent".

    2. Toggle "Disallow config date time" to "ON".'
  checks:
  - type: manual_review
    info: 'Review the managed Google Android 15 device configuration settings to confirm that

