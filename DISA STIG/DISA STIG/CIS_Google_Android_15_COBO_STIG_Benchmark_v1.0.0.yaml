  description: 'Google Android 15 must be configured to disallow configuration of date and time. GROUP ID: V-267458 RULE ID:
    SV-267458r1031559'
  rationale: 'Determining the correct time a particular application event occurred on a system is critical when conducting
    forensic analysis and investigating system events. Periodically synchronizing internal clocks with an authoritative time
    source is necessary to correctly correlate the timing of events that occur across the enterprise. The three authoritative
    time sources for Google Android 15 are an authoritative time server that is synchronized with redundant United States
    Naval Observatory (USNO) time servers as designated for the appropriate DOD network (NIPRNet or SIPRNet), the Global Positioning
    System (GPS), or the wireless carrier. Time stamps generated by the audit system in Google Android 15 must include both
    date and time. The time may be expressed in Coordinated Universal Time (UTC), a modern continuation of Greenwich Mean
    Time (GMT), or local time with an offset from UTC. SFRID: FMT_SMF.1.1 47'
  impact: ''
  references: []
  page_start: 71
  audit_raw: 'Review the managed Google Android 15 device configuration settings to confirm that

    autofill services are disabled.

