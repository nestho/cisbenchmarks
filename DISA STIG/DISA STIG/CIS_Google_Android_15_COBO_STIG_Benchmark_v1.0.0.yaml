- id: '1.36'
  title: GOOG-15-012500
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Google Android 15 must be configured to disable "Private Space" use. GROUP ID: V-269100 RULE ID: SV-269100r1033116'
  rationale: 'Private Space is an Android feature that provides a separate encrypted container on the mobile device. Apps
    in Private Space show up in a separate container in the launcher and are hidden from the "Recents" view, notifications,
    settings, and other apps when the Private Space is locked. In addition, MDM server allow list or blocklist cannot control
    the installation of apps into Private Space. Malware and other unauthorized apps could be installed on a DOD mobile device,
    which could lead to the compromise of DOD sensitive information or to an attack on the DOD network. SFRID: FMT_MOF_EXT.1.2
    47'
  impact: ''
  references: []
  page_start: 85
