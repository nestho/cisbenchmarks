  title: GOOG-15-010000
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Google Android 15 must have the DOD root and intermediate PKI certificates installed. GROUP ID: V-267454 RULE
    ID: SV-267454r1031547'
  rationale: 'DOD root and intermediate PKI certificates are used to verify the authenticity of PKI certificates of users
    and web services. If the root and intermediate certificates are not available, an adversary could falsely sign a certificate
    in such a way that it could not be detected. Providing access to the DOD root and intermediate PKI certificates greatly
    diminishes the risk of this attack. SFRID: FMT_SMF.1.1 11'
  impact: ''
  references: []
  page_start: 63
  audit_raw: 'Review device configuration settings to confirm that the DOD root and intermediate PKI

    certificates are installed.

    This procedure is performed on both the EMM Administration console and the managed

    Google Android 15 device.

    The current DOD root and intermediate PKI certificates may be obtained in selfextracting zip files at http://cyber.mil/pki-pke
    (for NIPRNet).

    On the EMM console, verify that the DOD root and intermediate certificates are part of a

    device and/or work profile that is being pushed down to the devices.

    On the managed Google Android 15 device:

    1. Open Settings.

    2. Tap "Security & privacy".

    3. Tap "Advanced".

    4. Tap "More security & privacy".

    5. Tap "Encryption & credentials".

    6. Tap "Trusted credentials".

    7. Verify that DOD root and intermediate PKI certificates are listed under the "User"

    tab in the "Work" section.

    If on the EMM console the DOD root and intermediate certificates are not listed in a

    profile, or the managed Android 15 device does not list the DOD root and intermediate

    certificates under the user tab, this is a finding.'
  remediation: 'Configure the Google Android 15 device to install DOD root and intermediate

    certificates.

    On the EMM console, upload DOD root and intermediate certificates as part of a device

    and/or work profile.

    The current DOD root and intermediate PKI certificates may be obtained in selfextracting zip files at http://cyber.mil/pki-pke
    (for NIPRNet).'
  checks:
  - type: manual_review
    info: 'Review device configuration settings to confirm that the DOD root and intermediate PKI

      certificates are installed.

