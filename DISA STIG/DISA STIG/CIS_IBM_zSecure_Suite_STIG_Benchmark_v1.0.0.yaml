- id: '1.10'
  title: ZSEC-00-000240
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM Security zSecure system administrators must install security-relevant zSecure software updates within
    the time period directed by an authoritative source (e.g., IAVMs, CTOs, DTMs, and STIGs). GROUP ID: V-259737 RULE ID:
    SV-259737r961683'
  rationale: Security flaws with software applications are discovered daily. Vendors are constantly updating and patching
    their products to address newly discovered security vulnerabilities. Organizations (including any contractor to the organization)
    are required to promptly install security-relevant software updates (e.g., patches, service packs, and hot fixes). Flaws
    discovered during security assessments, continuous monitoring, incident response activities, or information system error
    handling must also be addressed expeditiously.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'Ask the system administrator for the procedure to install security-relevant software

    updates within the time period directed by an authoritative source (e.g., IAVMs, CTOs,

    DTMs, and STIGs.

    If there is no procedure, this a finding.'
  remediation: 'Develop a procedure to install security-relevant software updates within the time period

    directed by an authoritative source (e.g., IAVMs, CTOs, DTMs, and STIGs).'
  checks:
  - type: manual_review
    info: 'Ask the system administrator for the procedure to install security-relevant software

      updates within the time period directed by an authoritative source (e.g., IAVMs, CTOs,

      DTMs, and STIGs.

      If there is no procedure, this a finding.'
    severity: medium
