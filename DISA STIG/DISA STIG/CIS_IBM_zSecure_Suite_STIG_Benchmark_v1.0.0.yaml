- id: '1.8'
  title: ZSEC-00-000200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM Security zSecure must implement organization-defined automated security responses if baseline zSecure
    configurations are changed in an unauthorized manner. GROUP ID: V-259735 RULE ID: SV-259735r961458'
  rationale: 'Unauthorized changes to the zSecure baseline configuration could make the system vulnerable to various attacks
    or allow unauthorized access to the system. Changes to information system configurations can have unintended side effects,
    some of which may be relevant to security. Detecting such changes and providing an automated response can help avoid unintended,
    negative consequences that could ultimately affect the security state of the application. Examples of security responses
    include but are not limited to the following: halting application processing, halting selected application functions,
    or issuing alerts/notifications to organizational personnel when there is an unauthorized modification of a configuration
    item.'
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'Verify that a (daily) scheduled batch job is defined and used or a custom alert is

    configured and activated to inform appropriate personnel, such as auditors and

    compliance officers, about successful changes to the zSecure configuration data sets

    on their z/OS systems.

    If SMF records regarding successful UPDATE(s) to zSecure configuration data sets are

    not reported to the information system security manager (ISSM), this is a finding.'
  remediation: 'The recipients of the SMF reports or alert messages must investigate whether the

    UPDATE is legitimate (e.g., is documented and approved in a change management

    request). If it is not, they must restore the original configuration setting.'
  checks:
  - type: manual_review
    info: 'Verify that a (daily) scheduled batch job is defined and used or a custom alert is

      configured and activated to inform appropriate personnel, such as auditors and

      compliance officers, about successful changes to the zSecure configuration data sets

      on their z/OS systems.

      If SMF records regarding successful UPDATE(s) to zSecure configuration data sets are

      not reported to the information system security manager (ISSM), this is a finding.'
    severity: medium
- id: '1.9'
  title: ZSEC-00-000220
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'IBM Security zSecure must remove all upgraded/replaced zSecure software components that are no longer required
    for operation after updated versions have been installed. GROUP ID: V-259736 RULE ID: SV-259736r961677'
  rationale: Previous versions of zSecure products and components that are not removed from the information system after updates
    have been installed may be exploited by adversaries. Some information technology products may remove older versions of
    software automatically from the information system.
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'Examine the inventory of installed software components for zSecure.

    If software components that are no longer required for operation exist, this is a finding.'
  remediation: 'Remove all upgraded/replaced software components that are no longer required for

    operation.'
  checks:
  - type: manual_review
    info: 'Examine the inventory of installed software components for zSecure.

