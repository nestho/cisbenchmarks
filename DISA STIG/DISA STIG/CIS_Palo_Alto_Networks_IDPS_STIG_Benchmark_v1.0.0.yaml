  title: PANW-IP-000041
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must protect against or limit the effects of known and unknown types
    of denial-of-service (DoS) attacks by employing rate-based attack prevention behavior analysis (traffic thresholds). GROUP
    ID: V-207703 RULE ID: SV-207703r997613'
  rationale: If the network does not provide safeguards against DoS attack, network resources will be unavailable to users.
    Installation of IDPS detection and prevention components (i.e., sensors) at key boundaries in the architecture mitigates
    the risk of DoS attacks. These attacks can be detected by matching observed communications traffic with patterns of known
    attacks and monitoring for anomalies in traffic volume/type. Detection components that use rate-based behavior analysis
    can detect attacks when signatures for the attack do not exist or are not installed. These attacks include zero-day attacks
    which are new attacks for which vendors have not yet developed signatures. Rate-based behavior analysis can detect sophisticated,
    Distributed DoS (DDoS) attacks by correlating traffic information from multiple network segments or components. This requirement
    applies to the communications traffic functionality of the IDPS as it pertains to handling communications traffic, rather
    than to the IDPS device itself.
  impact: ''
  references: []
  page_start: 51
  audit_raw: 'Go to Objects >> Security Profiles >> DoS Protection.

    If there are no DoS Protection Profiles configured, this is a finding.

    Go to Policies >> DoS Protection.

    If there are no DoS Protection Policies, this is a finding.

    There may be more than one configured DoS Protection Policy; ask the administrator

    which DoS Protection Policy is intended to protect internal networks and DMZ networks

    from externally-originated DoS attacks.

    If there is no such DoS Protection Policy, this is a finding.

    If the DoS Protection Policy has no DoS Protection Profile, this is a finding.'
  remediation: '1. Go to Objects >> Security Profiles >> DoS Protection.

    2. Select "Add" to create a new profile.

    3. In the "DoS Protection Profile" window, complete the required fields.

    4. For the "Type", select "Classified".

    5. In the "Flood Protection" tab, "Syn Flood" tab, select the "Syn Flood" check box

    and select "SYN Cookie".

    6. In the "Flood Protection" tab, "UDP Flood" tab, select the "UDP Flood" check

    box; complete the "Alarm Rate", "Activate Rate", "Max Rate", and "Block

    Duration" fields.

    7. In the "Flood Protection" tab, "ICMP Flood" tab, select the "ICMP Flood" check

    box; complete the "Alarm Rate", "Activate Rate", "Max Rate", and "Block

    Duration" fields.

    8. In the "Flood Protection" tab, "ICMPv6 Flood" tab, select the "ICMPv6 Flood"

    check box; complete the "Alarm Rate", "Activate Rate", "Max Rate", and "Block

    Duration" fields.

    9. In the "Flood Protection" tab, "Other IP Flood" tab, select the "Other IP Flood"

    check box; complete the "Alarm Rate", "Activate Rate", "Max Rate", and "Block

    Duration" fields.

    10. In the "Resources Protection" tab, select the "Maximum Concurrent Sessions"

    check box.

    11. In the "Resources Protection" tab, complete the "Max Concurrent Sessions" field.

    If the DoS profile type is aggregate, this limit applies to the entire traffic hitting the

    DoS rule on which the DoS profile is applied. If the DoS profile type is classified,

    this limit applies to the entire traffic on a classified basis (source IP, destination

    IP or source-and-destination IP) hitting the DoS rule on which the DoS profile is

    applied.

    12. Select "OK".

    13. Go to Policies >> DoS Protection.

    14. Select "Add" to create a new policy.

    15. In the "DoS Rule" Window, complete the required fields.

    16. In the "General" tab, complete the "Name" and "Description" fields.

    17. In the "Source" tab, for "Zone", select the "External zone, for Source Address",

    select "Any".

    18. In the "Destination" tab, "Zone", select "Internal zone, for Destination Address",

    select "Any".

    19. In the "Option/Protection" tab,

    20. For "Service", select "Any".

    21. For "Action", select "Protect".

    22. Select the "Classified" check box.

    23. In the "Profile" field, select the configured DoS Protection profile for inbound

    traffic.

    24. In the "Address" field, select "destination-ip-only".

    25. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    Select "OK" when the confirmation dialog appears.'
