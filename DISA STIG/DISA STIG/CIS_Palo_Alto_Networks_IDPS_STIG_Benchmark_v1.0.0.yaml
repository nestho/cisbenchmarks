- id: '1.12'
  title: PANW-IP-000031
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must block malicious ICMP packets. GROUP ID: V-207699 RULE ID: SV-207699r557390'
  rationale: Internet Control Message Protocol (ICMP) messages are used to provide feedback about problems in the network.
    These messages are sent back to the sender to support diagnostics. However, ICMP can be misused to provide a covert channel.
    ICMP tunneling is when an attacker injects arbitrary data into an echo packet and sends to a remote computer. The remote
    computer injects an answer into another ICMP packet and sends it back. The creates a covert channel where an attacker
    can hide commands sent to a compromised host or a compromised host can exfiltrate data.
  impact: ''
