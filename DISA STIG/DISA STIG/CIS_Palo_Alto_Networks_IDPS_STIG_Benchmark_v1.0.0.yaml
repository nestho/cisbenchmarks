  title: PANW-IP-000045
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Palo Alto Networks security platform components, including sensors, event databases, and management consoles
    must integrate with a network-wide monitoring capability. GROUP ID: V-207705 RULE ID: SV-207705r856619'
  rationale: An integrated, network-wide intrusion detection capability increases the ability to detect and prevent sophisticated
    distributed attacks based on access patterns and characteristics of access. Integration is more than centralized logging
    and a centralized management console. The enclave's monitoring capability may include multiple sensors, IPS, sensor event
    databases, behavior-based monitoring devices, application-level content inspection systems, malicious code protection
    software, scanning tools, audit record monitoring software, and network monitoring software. Some tools may monitor external
    traffic while others monitor internal traffic at key boundaries. These capabilities may be implemented using different
    devices and therefore can have different security policies and severity-level schema. This is valuable because content
    filtering, monitoring, and prevention can become a bottleneck on the network if not carefully configured.
  impact: ''
