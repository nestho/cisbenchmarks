  description: 'The Palo Alto Networks security platform must detect use of network services that have not been authorized
    or approved by the ISSM and ISSO, at a minimum. GROUP ID: V-207706 RULE ID: SV-207706r856620'
  rationale: Unauthorized or unapproved network services lack organizational verification or validation and therefore may
    be unreliable or serve as malicious rogues for valid services. Examples of network services include service-oriented architectures
    (SOAs), cloudbased services (e.g., infrastructure as a service, platform as a service, or software as a service), cross-domain,
    Voice Over Internet Protocol, Instant Messaging, auto-execute, and file sharing. To comply with this requirement, the
    IDPS may be configured to detect services either directly or indirectly (i.e., by detecting traffic associated with a
    service).
