- id: '1.7'
  title: PANW-IP-000024
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must install updates for application software files, signature definitions,
    detection heuristics, and vendor-provided rules when new releases are available in accordance with organizational configuration
    management policy and procedures. GROUP ID: V-207694 RULE ID: SV-207694r997607'
  rationale: 'Failing to update malicious code protection mechanisms, including application software files, signature definitions,
    and vendor-provided rules, leaves the system vulnerable to exploitation by recently developed attack methods and programs.
    The IDPS is a key malicious code protection mechanism in the enclave infrastructure. To ensure this protection is responsive
    to changes in malicious code threats, IDPS components must be updated, including application software files, anti-virus
    signatures, detection heuristics, vendor-provided rules, and vendor-provided signatures. Updates must be installed in
    accordance with the CCB procedures for the local organization. However, at a minimum: Updates designated as critical security
    updates by the vendor must be installed immediately. Updates for signature definitions, detection heuristics, and vendor-provided
    rules must be installed immediately. Updates for application software are installed in accordance with the CCB procedures.
    Prior to automatically installing updates, either manual or automated integrity and authentication checking is required,
    at a minimum, for application software updates.'
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'Since some networks cannot connect to the vendor site for automatic updates, a

    manual process can be used.

    To verify that the Palo Alto Networks security platform is using the current Applications

    and Threats database should be checked by viewing the Dashboard and the version

    and date compared to the latest release.

    Go to Dashboard; in the General Information pane, view the Threat Version and

    Antivirus Version. If they are not the most current version as listed on the Palo Alto

    Networks support site, this is a finding.

    The following check applies if the network is authorized to connect to the Vendor site for

    automatic updates.

    To verify that automatic updates are configured, go to Device >> Dynamic Updates.

    If no entries for "Applications and Threats" are present, this is a finding.

    If the "Applications and Threats" entry states "Download Only", this is a finding.'
  remediation: 'Go to Device >> Dynamic Updates.

    Select "Check Now" at the bottom of the page to retrieve the latest signatures.

    To schedule automatic signature updates.

    Note: the steps provided below do not account for local change management policies.

    1. Go to Device >> Dynamic Updates.

    2. Select the text to the right of "Schedule".

    3. In the "Applications and Threat Updates Schedule" window; complete the

    required information.

    4. In the "Recurrence" field, select "Daily".

    5. In the "Time" field, enter the time at which you want the device to check for

    updates.

    6. For the "Action", select "Download and Install".

    7. Select "OK".

    8. Commit changes by selecting "Commit" in the upper-right corner of the screen.

