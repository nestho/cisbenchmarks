  title: PANW-IP-000039
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Palo Alto Networks security platform must off-load log records to a centralized log server. GROUP ID:
    V-207702 RULE ID: SV-207702r856616'
  rationale: Information stored in one location is vulnerable to accidental or incidental deletion or alteration. Off-loading
    ensures audit information does not get overwritten if the limited audit storage capacity is reached and also protects
    the audit record in case the system/component being audited is compromised. This also prevents the log records from being
    lost if the logs stored locally are accidentally or intentionally deleted, altered, or corrupted.
