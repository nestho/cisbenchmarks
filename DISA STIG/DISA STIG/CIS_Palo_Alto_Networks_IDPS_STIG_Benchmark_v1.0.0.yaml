- id: '1.29'
  title: PANW-IP-000058
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Palo Alto Networks security platform must off-load log records to a centralized log server in real-time.
    GROUP ID: V-207716 RULE ID: SV-207716r856630'
  rationale: Off-loading ensures audit information does not get overwritten if the limited audit storage capacity is reached
    and also protects the audit record in case the system/component being audited is compromised. Off-loading is a common
    process in information systems with limited audit storage capacity. The audit storage on the device is used only in a
    transitory fashion until the system can communicate with the centralized log server designated for storing the audit records,
    at which point the information is transferred. However, DoD requires that the log be transferred in real-time which indicates
    that the time from event detection to offloading is seconds or less. This does not apply to audit logs generated on behalf
    of the device itself (management).
  impact: ''
  references: []
  page_start: 82
  audit_raw: 'To view a syslog server profile:

    Go to Device >> Server Profiles >> Syslog

    If there are no Syslog Server Profiles present, this is a finding.

    Select each Syslog Server Profile; if no server is configured, this is a finding.

    View the log-forwarding profile to determine which logs are forwarded to the syslog

    server.

    Go to Objects >> Log forwarding

    If no Log Forwarding Profile is present, this is a finding.

    The Log Forwarding Profile window has five columns. If there are no Syslog Server

    Profiles present in the "Syslog" column for the Traffic Log Type, this is a finding.

    If there are no Syslog Server Profiles present for each of the severity levels of the

    Threat Log Type, this is a finding.

    Go to Device >> Log Settings >> System Logs

    The list of Severity levels is displayed.

    If any of the Severity levels does not have a configured Syslog Profile, this is a finding.

    Go to Device >> Log Settings >> Config Logs.

    If the "Syslog" field is blank, this is a finding.'
  remediation: 'To create a syslog server profile:

    1. Go to Device >> Server Profiles >> Syslog

    2. Select "Add".

    3. In the Syslog Server Profile, enter the name of the profile.

    4. Select "Add".

    5. In the "Servers" tab, enter the required information.

    6. Name: Name of the syslog server

    7. Server: Server IP address where the logs will be forwarded to

    8. Port: Default port 514

    9. Facility: Select from the drop-down list.

    10. Select "OK.

    After you create the Server Profiles that define where to send your logs, you must

    enable log forwarding.

    The way you enable forwarding depends on the log type:

    Traffic Logs—You enable forwarding of Traffic logs by creating a Log Forwarding Profile

    (Objects >> Log Forwarding) and adding it to the security policies you want to trigger

    the log forwarding. Only traffic that matches a specific rule within the security policy will

    be logged and forwarded.

    Configure the log-forwarding profile to select the logs to be forwarded to syslog server.

    1. Go to Objects >> Log forwarding.

    2. The "Log Forwarding Profile" window appears. Note that it has five columns. In

    the "Syslog" column, select the syslog server profile for forwarding threat logs to

    the configured server(s).

    3. Select "OK.

    When the "Log Forwarding Profile" window disappears, the screen will show the

    configured log-forwarding profile.

    Threat Logs—You enable forwarding of Threat logs by creating a Log Forwarding

    Profile (Objects >> Log Forwarding) that specifies which severity levels you want to

    forward and then adding it to the security policies for which you want to trigger the log

    forwarding. A Threat log entry will only be created (and therefore forwarded) if the

    associated traffic matches a Security Profile (Antivirus, Anti-spyware, Vulnerability, URL

    Filtering, File Blocking, Data Filtering, or DoS Protection).

    Configure the log-forwarding profile to select the logs to be forwarded to syslog server.

    1. Go to Objects >> Log forwarding

    2. The "Log Forwarding Profile" window appears. Note that it has five columns. In

    the "Syslog" column, select the syslog server profile for forwarding threat logs to

    the configured server(s).

    3. Select "OK".

    When the "Log Forwarding Profile" window disappears, the screen will show the

    configured log-forwarding profile.

    System Logs—You enable forwarding of System logs by specifying a Server Profile in

    the log settings configuration.

    1. Go to Device >> Log Settings >> System Logs

    2. The list of severity levels is displayed.

    3. You must select a Server Profile for each severity level you want to forward.

    4. Select each severity level in turn; with each selection, the "Log Systems -

    Setting" window will appear.

    5. In the "Log Systems - Setting" window, in the "Syslog" drop-down box, select the

    configured Server Profile.

    6. Select "OK.

    Config Logs—You enable forwarding of Config logs by specifying a Server Profile in the

    log settings configuration.

    1. Go to Device >> Log Settings >> Config Logs

    2. Select the "Edit" icon (the gear symbol in the upper-right corner of the pane).

    3. In the "Log Settings Config" window, in the "Syslog" drop-down box, select the

    configured Server Profile.

    4. Select "OK.

    For Traffic Logs and Threat Logs, use the log forwarding profile in the security rules.

    1. Go to Policies >> Security Rule

