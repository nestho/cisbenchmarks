controls:
- id: '1.1'
  title: PANW-IP-000001
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must enable Antivirus, Anti-spyware, and Vulnerability Protection
    for all authorized traffic. GROUP ID: V-207688 RULE ID: SV-207688r557390'
  rationale: The flow of all communications traffic must be monitored and controlled so it does not introduce any unacceptable
    risk to the network infrastructure or data. Restricting the flow of communications traffic, also known as Information
    flow control, regulates where information is allowed to travel as opposed to who is allowed to access the information
    and without explicit regard to subsequent accesses to that information. Traffic that is prohibited by the PPSM and Vulnerability
    Assessments must be denied by the policies configured in the Palo Alto Networks security platform; this is addressed in
    a separate requirement. Traffic that is allowed by the PPSM and Vulnerability Assessments must still be inspected by the
    IDPS capabilities of the Palo Alto Networks security platform known as Content-ID. Content-ID is enabled on a per rule
    basis using individual or group profiles to facilitate policy-based control over content traversing the network.
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'Review the list of authorized applications, endpoints, services, and protocols that has

    been added to the PPSM database. Identify which traffic flows are authorized.

    Go to Objects >> Security Profiles >> Antivirus

    If there are no Antivirus Profiles configured other than the default, this is a finding.

    Go to Objects >> Security Profiles >> Anti-Spyware

    View the configured Anti-Spyware Profiles. If none are configured, this is a finding.

    Go to Objects >> Security Profiles >> Vulnerability Protection

    View the configured Vulnerability Protection Profiles. If none are configured, this is a

    finding.

    Review each of the configured security policies in turn. For any Security Policy that

    allows traffic between Zones (interzone), view the "Profile" column. If the "Profile"

    column does not display the Antivirus Profile, Anti-Spyware, and Vulnerability Protection

    symbols, this is a finding.'
  remediation: 'Configure an Antivirus Profile, an Anti-spyware Profile, and a Vulnerability Protection

    Profile in turn. Use these Profiles in the Security Policy or Policies that allows authorized

    traffic.

    To create an Antivirus Profile:

    1. Go to Objects >> Security Profiles >> Antivirus

    2. Select "Add".

    3. In the "Antivirus Profile" window, complete the required fields.

    4. Complete the "Name" and "Description" fields.

    5. In the "Antivirus" tab, for all Decoders (SMTP, IMAP, POP3, FTP, HTTP, SMB

    protocols), set the Action to "drop" or "reset-both".

    6. Select "OK".

    To create a Vulnerability Protection Profile:

    1. Go to Objects >> Security Profiles >> Vulnerability Protection

    2. Select "Add".

    3. In the "Vulnerability Protection Profile" window, complete the required fields.

    4. In the "Name" field, enter the name of the Vulnerability Protection Profile.

    5. In the "Description" field, enter the description of the Vulnerability Protection

    Profile.

    6. In the "Rules" tab, select "Add".

    7. In the "Vulnerability Protection Rule" window,

    8. In the "Rule Name" field, enter the Rule name,

    9. In the "Threat Name" field, select "any",

    10. In the "Action" field, select "drop" or "reset-both".

    11. In the "Host type" field, select "any",

    12. Select the checkboxes above the "CVE" and "Vendor ID" boxes.

    13. In the "Severity" section, select the "critical", "high", and "medium" check boxes.

    14. Select "OK".

    In the "Vulnerability Protection Profile" window, select the configured rule, then select

    "OK".

    To configure an Anti-Spyware Profile:

    1. Go to Objects >> Security Profiles >> Anti-Spyware

    2. Select the name of a configured Anti-Spyware Profile or select "Add" to create a

    new one.

    3. In the "Anti-Spyware Profile" window, complete the required fields in all tabs.

    4. In the "Rules" tab, select the name of a configured Anti-Spyware Rule or select

    "Add" to create a new one.

    5. Complete the required fields.

    6. For the Category field, select "any".

    7. For the Action field, select "Drop" or "reset-both".

    8. For the Severity field, select "All" or configured multiple rules, one for each

    Severity.

    9. Select "OK".

    10. Select "OK" again.

    11.

    12. Go to Policies >> Security

    13. Select an existing policy rule or select "Add" to create a new one.

    14. In the "Actions" tab in the "Profile Setting" section; in the "Profile Type" field,

    select "Profiles". The window will change to display the different categories of

    Profiles.

    15. In the "Actions" tab in the "Profile Setting" section; in the "Antivirus" field, select

    the configured Antivirus Profile.

    16. In the "Actions" tab in the "Profile Setting" section; in the "Anti-spyware" field,

    select the configured or "Strict Anti-spyware" Profile.

    17. In the "Actions" tab in the "Profile Setting" section; in the "Vulnerability

    Protection" field, select the configured Vulnerability Protection Profile.

    18. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'Review the list of authorized applications, endpoints, services, and protocols that has

      been added to the PPSM database. Identify which traffic flows are authorized.

      Go to Objects >> Security Profiles >> Antivirus

      If there are no Antivirus Profiles configured other than the default, this is a finding.

      Go to Objects >> Security Profiles >> Anti-Spyware

      View the configured Anti-Spyware Profiles. If none are configured, this is a finding.

      Go to Objects >> Security Profiles >> Vulnerability Protecti'
    severity: medium
- id: '1.2'
  title: PANW-IP-000007
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must produce audit records containing information to establish the
    source of the event, including, at a minimum, originating source address. GROUP ID: V-207689 RULE ID: SV-207689r767016'
  rationale: Associating the source of the event with detected events in the logs provides a means of investigating an attack
    or suspected attack. While auditing and logging are closely related, they are not the same. Logging is recording data
    about events that take place in a system, while auditing is the use of log records to identify security-relevant information
    such as system or user accesses. In short, log records are audited to establish an accurate history. Without logging,
    it would be impossible to establish an audit trail. Palo Alto Networks security platform has four options for the source
    of log records - "FQDN", "hostname", "ipv4-address", and "ipv6-address". This requirement only allows the use of "ipv4-address"
    and "ipv6-address" as options.
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'Go to Device >> Setup >> Management

    In the "General Settings" window, if the "hostname" field does not contain a unique

    identifier, this is a finding.

    Go to Device >> Setup >> Management

    In the "Logging and Reporting Settings" pane, if the "Send Hostname in Syslog" does

    not show either "ipv4-address" or "ipv6-address", this is a finding.'
  remediation: 'Set a unique hostname.

    1. Go to Device >> Setup >> Management

    2. In the "General Settings" window, select the "Edit" icon (the gear symbol in the

    upper-right corner of the pane).

    3. In the "General Settings" window, in the "hostname" field; enter a unique

    hostname.

    4. Select "OK".

    Configure the device to send either the ipv4-address, or ipv6-address with all log

    messages.

    1. Device >> Setup >> Management

    2. Click the "Edit" icon in the "Logging and Reporting Settings" section.

    3. Select the "Log Export and Reporting" tab.

    4. Select one of the following options from the "Send Hostname" in the "Syslog"

    drop-down list:

    5. ipv4-address —Uses the IPv4 address of the interface used to send logs on the

    device. By default, this is the management interface of the device.

    6. ipv6-address —Uses the IPv6 address of the interface used to send logs on the

    device. By default, this is the management interface of the device.

    7. Note that the addresses must be consistent with the IP address used by the

    management interface.

    8. Select "OK".

    9. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    Select "OK" when the confirmation dialog appears.'
  checks:
  - type: sql
    command: show either "ipv4-address" or "ipv6-address", this is a finding.
    severity: medium
    info: 'Go to Device >> Setup >> Management

      In the "General Settings" window, if the "hostname" field does not contain a unique

      identifier, this is a finding.

      Go to Device >> Setup >> Management

      In the "Logging and Reporting Settings" pane, if the "Send Hostname in Syslog" does

      not show either "ipv4-address" or "ipv6-address", this is a finding.'
- id: '1.3'
  title: PANW-IP-000008
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must capture traffic of detected/dropped malicious code. GROUP ID:
    V-207690 RULE ID: SV-207690r559743'
  rationale: Associating event outcome with detected events in the log provides a means of investigating an attack or suspected
    attack. The logs should identify what servers, destination addresses, applications, or databases were potentially attacked
    by logging communications traffic between the target and the attacker. All commands that were entered by the attacker
    (such as account creations, changes in permissions, files accessed, etc.) during the session should also be logged when
    capturing for forensic analysis. Packet captures of attack traffic can be used by forensic tools for analysis for example,
    to determine if an alert is real or a false alarm or for forensics for threat intelligence. Configure the packet capture
    filters so that the CPU is not overloaded. There are many reasons for a packet capture. This requirement addresses the
    case where the capture is based on forensics for a detected malicious attack and the traffic is being captured in association
    with that traffic. Filtering should be engaged to facilitate forensics.
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Go to Objects >> Security Profiles >> Antivirus

    View the configured Antivirus Profiles. If the Packet Capture check box is not checked,

    this is a finding.

    Go to Objects >> Security Profiles >> Anti-Spyware

    View the configured Anti-Spyware Profiles. If the "Packet Capture" field does not show

    extended-capture, this is a finding.

    Go to Objects >> Security Profiles >> Vulnerability Protection

    View the configured Vulnerability Protection Profiles. If the "Packet Capture" field does

    not show extended-capture, this is a finding.

    Go to Policies >> Security

    Review each of the configured security policies in turn. For any Security Policy that

    affects traffic between Zones (interzone), view the "Profile" column. If the "Profile"

    column does not display the Antivirus Profile, Anti-Spyware, and Vulnerability Protection

    symbols, this is a finding.'
  remediation: 'This procedure will only capture the first packet. See the vendor documentation for

    further information.

    1. Go to Objects >> Security Profiles >> Antivirus

    2. Select the name of a configured Antivirus Profile or select "Add" to create a new

    one.

    3. In the "Antivirus Profile" window, complete the required fields.

    4. In the "Antivirus" tab, select the "Packet Capture" check box.

    5. Select "OK".

    Configure an Anti-Spyware Profile to capture detected malicious traffic.

    1. Go to Objects >> Security Profiles >> Anti-Spyware

    2. Select the name of a configured Anti-Spyware Profile or select "Add" to create a

    new one.

    3. In the "Anti-Spyware Profile" window, complete the required fields in all tabs.

    4. In the "Rules" tab, select the name of a configured Anti-Spyware Rule or select

    "Add" to create a new one.

    5. In the "Anti-Spyware Rule" window, in the "Packet Capture" field, select

    "extended-capture".

    6. Select "OK".

    7. Select "OK" again.

    Configure a Vulnerability Protection Profile to capture detected malicious traffic.

    1. Go to Objects >> Security Profiles >> Vulnerability Protection

    2. Select the name of a configured Vulnerability Protection Profile or select "Add" to

    create a new one.

    3. In the "Vulnerability Protection Profile" window, complete the required fields.

    4. In the "Rules" tab, select the name of a configured Vulnerability Protection Rule

    or select "Add" to create a new one.

    5. In the "Vulnerability Protection Rule" window, in the "Packet Capture" field, select

    "extended-capture".

    6. Select "OK".

    7. Select "OK" again.

    Use the Antivirus Profile, Anti-Spyware Profile, and Vulnerability Protection Profile in a

    Security Policy.

    1. Go to Policies >> Security

    2. Select an existing policy rule or select "Add" to create a new one.

    3. In the "Actions tab in the Profile Setting section:

    4. In the "Profile Type" field, select "Profiles". The window will change to display the

    different categories of Profiles.

    5. In the "Antivirus" field, select the configured Antivirus Profile.

    6. In the "Anti-Spyware" field, select the configured Anti-Spyware Profile.

    7. In the "Vulnerability Protection" field, select the configured Vulnerability

    Protection Profile.

    8. Select "OK".

    9. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    Select "OK" when the confirmation dialog appears.'
  checks:
  - type: sql
    command: 'show

      extended-capture, this is a finding.'
    severity: medium
    info: 'Go to Objects >> Security Profiles >> Antivirus

      View the configured Antivirus Profiles. If the Packet Capture check box is not checked,

      this is a finding.

      Go to Objects >> Security Profiles >> Anti-Spyware

      View the configured Anti-Spyware Profiles. If the "Packet Capture" field does not show

      extended-capture, this is a finding.

      Go to Objects >> Security Profiles >> Vulnerability Protection

      View th'
- id: '1.4'
  title: PANW-IP-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'In the event of a logging failure caused by the lack of audit record storage capacity, the Palo Alto Networks
    security platform must continue generating and storing audit records if possible, overwriting the oldest audit records
    in a first-in-first-out manner. GROUP ID: V-207691 RULE ID: SV-207691r1038960'
  rationale: It is critical that when the Palo Alto Networks security platform is at risk of failing to process audit logs
    as required, it takes action to mitigate the failure. The Palo Alto Networks security platform performs a critical security
    function, so its continued operation is imperative. Since availability of the Palo Alto Networks security platform is
    an overriding concern, shutting down the system in the event of an audit failure should be avoided, except as a last resort.
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'Note: overwriting the oldest audit records in a first-in-first-out manner is the default

    setting of the Palo Alto Networks security platform.

    Go to Device >> Setup

    In the "Logging and Reporting Settings" pane, if the "Stop Traffic when LogDb Full"

    checkbox is selected, this is a finding.'
  remediation: 'Note: Overwriting the oldest audit records in a first-in-first-out manner is the default

    setting of the Palo Alto Networks security platform.

    1. Go to Device >> Setup

    2. In the "Logging and Reporting Settings" pane, select the "Edit" icon in the upperright corner.

    3. In the "Logging and Reporting Settings" window, in the "Log Export and

    Reporting" tab, deselect (uncheck) the "Stop Traffic when LogDb Full" checkbox.

    If it is already not selected, do not change it.

    4. Switch back to the "Log Storage" tab.

    5. Select "OK".

    If no changes were made, it is not necessary or possible to commit a change. If a

    change was made, commit changes by selecting "Commit" in the upper-right corner of

    the screen. Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'Note: overwriting the oldest audit records in a first-in-first-out manner is the default

      setting of the Palo Alto Networks security platform.

      Go to Device >> Setup

      In the "Logging and Reporting Settings" pane, if the "Stop Traffic when LogDb Full"

      checkbox is selected, this is a finding.'
    severity: medium
- id: '1.5'
  title: PANW-IP-000018
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must have a denial-of-service (DoS) Protection Profile for outbound
    traffic applied to a policy for traffic originating from the internal zone going to the external zone. GROUP ID: V-207692
    RULE ID: SV-207692r997604'
  rationale: The Palo Alto Networks security platform must include protection against DoS attacks that originate from inside
    the enclave which can affect either internal or external systems. These attacks may use legitimate or rogue endpoints
    from inside the enclave. Installation of Palo Alto Networks security platform detection and prevention components (i.e.,
    sensors) at key boundaries in the architecture mitigates the risk of DoS attacks. These attacks can be detected by matching
    observed communications traffic with patterns of known attacks and monitoring for anomalies in traffic volume/type. To
    comply with this requirement, the Palo Alto Networks security platform must inspect outbound traffic for indications of
    known and unknown DoS attacks. Sensor log capacity management along with techniques which prevent the logging of redundant
    information during an attack also guard against DoS attacks. This requirement is used in conjunction with other requirements
    which require configuration of security policies, signatures, rules, and anomaly detection techniques and are applicable
    to both inbound and outbound traffic.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Go to Objects >> Security Profiles >> DoS Protection.

    If there are no DoS Protection Profiles configured, this is a finding.

    There may be more than one configured DoS Protection Profile; ask the administrator

    which DoS Protection Profile is intended to protect outside networks from internallyoriginated DoS attacks.

    If there is no such DoS Protection Profile, this is a finding.'
  remediation: '1. Go to Objects >> Security Profiles >> DoS Protection.

    2. Select "Add" to create a new profile.

    3. In the "DoS Protection Profile" window, complete the required fields.

    4. For the Type, select "Classified".

    5. In the "Flood Protection" tab, "Syn Flood" tab, select the "Syn Flood" check box

    and select either "Random Early Drop" (preferred in this case) or "SYN Cookie".

    6. In the "Flood Protection" tab, "UDP Flood" tab, select the "UDP Flood" check

    box; complete the "Alarm Rate", "Activate Rate", "Max Rate", and "Block

    Duration" fields.

    7. In the "Flood Protection" tab, "ICMP Flood" tab, select the "ICMP Flood" check

    box; complete the "Alarm Rate", "Activate Rate", "Max Rate", and "Block

    Duration" fields.

    8. In the "Flood Protection" tab, "ICMPv6 Flood" tab, select the "ICMPv6 Flood"

    check box; complete the "Alarm Rate", "Activate Rate", "Max Rate", and "Block

    Duration" fields.

    9. In the "Flood Protection" tab, "Other IP Flood" tab, select the "Other IP Flood"

    check box; complete the "Alarm Rate", "Activate Rate", "Max Rate", and "Block

    Duration" fields.

    10. In the "Resources Protection" tab, leave the "Maximum Concurrent Sessions"

    check box unselected.

    11. Select "OK".

    12. Go to Policies >> DoS Protection.

    13. Select "Add" to create a new policy.

    14. In the "DoS Rule" Window, complete the required fields.

    15. In the "General" tab, complete the "Name" and "Description" fields.

    16. In the "Source" tab, for "Zone", select the "Internal zone", for "Source Address",

    select "Any".

    17. In the "Destination" tab, "Zone", select "External zone", for "Destination Address",

    select "Any".

    18. In the "Option/Protection" tab:

    19. For "Service", select "Any".

    20. For "Action", select "Protect".

    21. Select the "Classified" check box.

    22. In the "Profile" field, select the configured DoS Protection profile for outbound

    traffic.

    23. In the "Address field", select "source-ip-only".

    24. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'Go to Objects >> Security Profiles >> DoS Protection.

      If there are no DoS Protection Profiles configured, this is a finding.

      There may be more than one configured DoS Protection Profile; ask the administrator

      which DoS Protection Profile is intended to protect outside networks from internallyoriginated DoS attacks.

      If there is no such DoS Protection Profile, this is a finding.'
    severity: medium
- id: '1.6'
  title: PANW-IP-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must detect and deny any prohibited mobile or otherwise malicious
    code at the enclave boundary. GROUP ID: V-207693 RULE ID: SV-207693r768712'
  rationale: Mobile code is defined as software modules obtained from remote systems, transferred across a network, and then
    downloaded and executed on a local system without explicit installation or execution by the recipient. Examples of mobile
    code include JavaScript, VBScript, Java applets, ActiveX controls, Flash animations, Shockwave videos, and macros embedded
    within Microsoft Office documents. Mobile code can be exploited to attack a host. It can be sent as an e-mail attachment
    or embedded in other file formats not traditionally associated with executable code. While the IDPS cannot replace the
    anti-virus and host-based IDS (HIDS) protection installed on the network's endpoints, vendor or locally created sensor
    rules can be implemented, which provide preemptive defense against both known and zero-day vulnerabilities. Many of the
    protections may provide defenses before vulnerabilities are discovered and rules or blacklist updates are distributed
    by anti-virus or malicious code solution vendors.
  impact: ''
  references: []
  page_start: 24
  audit_raw: '1. Go to Objects >> Security Profiles >> Antivirus.

    2. If no Antivirus Profiles are configured other than the default, this is a finding.

    3. View the configured Antivirus Profiles for each protocol decoder (SMTP, IMAP,

    POP3, FTP, HTTP, SMB).

    If the "Action" is anything other than "drop" or "reset-both", this is a finding.

    1. Go to Policies >> Security.

    2. Review each of the configured security policies in turn. For any Security Policy

    that affects traffic from an outside (untrusted) zone, view the "Profile" column.

    If the "Profile" column does not display the “Antivirus Profile” symbol, this is a finding.'
  remediation: 'To create an Antivirus Profile:

    1. Go to Objects >> Security Profiles >> Antivirus.

    2. Select "Add".

    3. In the "Antivirus Profile" window, complete the required fields.

    4. Complete the "Name" and "Description" fields.

    5. In the "Antivirus" tab, for all Decoders (SMTP, IMAP, POP3, FTP, HTTP, SMB

    protocols), set the “Action” to "deny", or “reset-both”.

    6. Select "OK".

    Use the Profile in a Security Policy:

    1. Go to Policies >> Security.

    2. Select an existing policy rule or select "Add" to create a new one.

    3. In the "Actions” tab in the "Profile Setting" section; in the "Profile Type" field,

    select "Profiles". The window will change to display the different categories of

    Profiles.

    4. In the "Actions" tab in the "Profile Setting" section; in the "Antivirus" field, select

    the configured Antivirus Profile.

    5. Select "OK".

    Use the Antivirus Profile in a Security Policy applied to traffic from an outside

    (untrusted) zone.

    1. Go to Policies >> Security.

    2. Select an existing policy rule or select "Add" to create a new one.

    3. In the "Actions” tab in the Profile Setting section:

    4. In the "Profile Type" field, select "Profiles". The window will change to display the

    different categories of Profiles.

    5. In the "Antivirus" field, select the configured Antivirus Profile.

    6. In the "Anti-Spyware" field, select the configured Anti-Spyware Profile.

    7. In the "Vulnerability Protection" field, select the configured “Vulnerability

    Protection Profile”.

    8. Select "OK".

    9. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    10. Select "OK" when the confirmation dialog appears.'
  checks:
