- id: '1.23'
  title: PANW-IP-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must continuously monitor outbound communications traffic for unusual/unauthorized
    activities or conditions. GROUP ID: V-207710 RULE ID: SV-207710r856624'
  rationale: If outbound communications traffic is not continuously monitored for unusual/unauthorized activities or conditions,
    there will be times when hostile activity may not be noticed and defended against. Although some of the components in
    the site's content scanning solution may be used for periodic scanning assessment, the IDPS sensors and other components
    must provide continuous, 24 hours a day, 7 days a week monitoring. Unusual/unauthorized activities or conditions related
    to information system outbound communications traffic include, for example, internal traffic that indicates the presence
    of malicious code within organizational information systems or propagating among system components, the unauthorized exporting
    of information, or signaling to external information systems. Anomalies within organizational information systems include,
    for example, large file transfers, long-time persistent connections, use of unusual protocols and ports, and communications
    with suspected or known malicious external entities.
