  description: 'The Palo Alto Networks security platform must use a Vulnerability Protection Profile that blocks any critical,
    high, or medium threats. GROUP ID: V-207704 RULE ID: SV-207704r997616'
  rationale: If the network does not provide safeguards against DoS attacks, network resources will be unavailable to users.
    Installation of IDPS detection and prevention components (i.e., sensors) at key boundaries in the architecture mitigates
    the risk of DoS attacks. These attacks can be detected by matching observed communications traffic with patterns of known
    attacks and monitoring for anomalies in traffic volume, type, or protocol usage. Detection components that use signatures
    can detect known attacks by using known attack signatures. Signatures are usually obtained from and updated by the IDPS
    component vendor. These attacks include SYN-flood, ICMP-flood, and Land Attacks. This requirement applies to the communications
    traffic functionality of the IDPS as it pertains to handling communications traffic, rather than to the IDPS device itself.
  impact: ''
  references: []
  page_start: 54
  audit_raw: 'Go to Objects >> Security Profiles >> Vulnerability Protection.

    If there are no Vulnerability Protection Profiles configured, this is a finding.

    Ask the administrator which Vulnerability Protection Profile is used for interzone traffic.

    View the configured Vulnerability Protection Profiles; check the "Severity" and "Action"

    columns.

    If the Vulnerability Protection Profile used for interzone traffic does not block all critical,

    high, and medium threats, this is a finding.

    Go to Policies >> Security.

    Review each of the configured security policies in turn.

    For any Security Policy that affects traffic between Zones (interzone), view the Profile

    column. If the Profile column does not display the Vulnerability Protection Profile

    symbol, this is a finding.'
  remediation: 'To create a Vulnerability Protection Profile:

    1. Go to Objects >> Security Profiles >> Vulnerability Protection.

    2. Select "Add".

    3. In the "Vulnerability Protection Profile" window, complete the required fields.

    4. In the "Name" field, enter the name of the Vulnerability Protection Profile.

    5. In the "Description" field, enter the description of the Vulnerability Protection

    Profile.

    6. In the "Rules" tab, select "Add".

    7. In the "Vulnerability Protection Rule" window.

    8. In the "Rule Name" field, enter the Rule name.

    9. In the "Threat Name" field, select "any".

    10. In the "Action" field, select "block".

    11. In the "Host type" field, select "any".

    12. Select the checkboxes above the "CVE" and "Vendor ID" boxes.

    13. In the "Severity" section, select the "critical", "high", and "medium" check boxes.

    14. Select "OK".

    15. In the "Vulnerability Protection Profile" window, select the configured rule, then

    select "OK".

    Use the Profile in a Security Policy.

    1. Go to Policies >> Security.

    2. Select an existing policy rule or select "Add" to create a new one.

    3. In the "Actions" tab in the "Profile Setting" section; in the "Profile Type" field,

    select "Profiles". The window will change to display the different categories of

    Profiles.

    4. In the "Actions" tab in the "Profile Setting" section; in the "Vulnerability

    Protection" field, select the configured Vulnerability Protection Profile.

    5. Select "OK".

    6. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    Select "OK" when the confirmation dialog appears.'
