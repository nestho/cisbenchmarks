  description: 'The Palo Alto Networks security platform must send an alert to, at a minimum, the ISSO and ISSM when intrusion
    detection events are detected which indicate a compromise or potential for compromise. GROUP ID: V-207711 RULE ID: SV-207711r971533'
  rationale: Without an alert, security personnel may be unaware of intrusion detection incidents that require immediate action
