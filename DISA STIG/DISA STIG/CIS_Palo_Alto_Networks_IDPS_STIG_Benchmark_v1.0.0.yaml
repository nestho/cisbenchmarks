- id: '1.8'
  title: PANW-IP-000026
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must detect and drop any prohibited mobile or otherwise malicious
    code at internal boundaries. GROUP ID: V-207695 RULE ID: SV-207695r557390'
  rationale: Mobile code is defined as software modules obtained from remote systems, transferred across a network, and then
    downloaded and executed on a local system without explicit installation or execution by the recipient. Examples of mobile
    code include JavaScript, VBScript, Java applets, ActiveX controls, Flash animations, Shockwave videos, and macros embedded
    within Microsoft Office documents. Mobile code can be exploited to attack a host. It can be sent as an e-mail attachment
    or embedded in other file formats not traditionally associated with executable code. While the IDPS cannot replace the
    anti-virus and host-based IDS (HIDS) protection installed on the network's endpoints, vendor or locally created sensor
    rules can be implemented, which provide preemptive defense against both known and zero-day vulnerabilities. Many of the
    protections may provide defenses before vulnerabilities are discovered and rules or blacklist updates are distributed
    by anti-virus or malicious code solution vendors. The Palo Alto Networks security platform allows customized profiles
    to be used to perform antivirus inspection for traffic between zones. Antivirus, anti-spyware, and vulnerability protection
    features require a specific license. There is a default Antivirus Profile; the profile inspects all of the listed protocol
    decoders for viruses, and generates alerts for SMTP, IMAP, and POP3 protocols while dropping for FTP, HTTP, and SMB protocols.
    However, these default actions cannot be edited and the values for the FTP, HTTP, and SMB protocols do not meet the requirement,
    so customized profiles must be used.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'Go to Objects >> Security Profiles >> Antivirus.

    If there are no Antivirus Profiles configured other than the default, this is a finding.

    View the configured Antivirus Profiles; for each protocol decoder (SMTP, IMAP, POP3,

    FTP, HTTP, SMB).

    If the "Action" is anything other than "drop" or "reset-both", this is a finding.

    Go to Policies >> Security.

    Review each of the configured security policies in turn. For any Security Policy that

    affects traffic between internal Zones (interzone), view the "Profile" column.

    If the "Profile" column does not display the “Antivirus Profile” symbol, this is a finding.'
  remediation: 'To create an Antivirus Profile:

    1. Go to Objects >> Security Profiles >> Antivirus.

    2. Select "Add".

    3. In the "Antivirus Profile" window, complete the required fields.

    4. Complete the "Name" and "Description" fields.

    5. In the "Antivirus" tab, for all Decoders (SMTP, IMAP, POP3, FTP, HTTP, SMB

    protocols), set the "Action" to "drop" or "reset-both".

    6. Select "OK".

    Use the Antivirus Profile in a Security Policy:

    1. Go to Policies >> Security.

    2. Select an existing policy rule or select "Add" to create a new one.

    3. In the "Actions" tab in the "Profile Setting" section; in the "Profile Type" field,

    select "Profiles". The window will change to display the different categories of

    Profiles.

    4. In the "Actions" tab in the "Profile Setting" section; in the "Antivirus" field, select

    the configured Antivirus Profile.

    5. Select "OK".

    6. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    7. Select "OK" when the confirmation dialog appears.

    Use the Antivirus Profile in a Security Policy applied to traffic between internal zones.

    1. Go to Policies >> Security.

    2. Select an existing policy rule or select "Add" to create a new one.

    3. In the "Actions” tab in the “Profile Setting” section;:

    4. Iin the "Profile Type" field, select "Profiles". The window will change to display the

    different categories of Profiles.

    5. In the "Antivirus" field, select the configured Antivirus Profile.

    6. In the "Anti-Spyware" field, select the configured “Anti-Spyware” Profile.

    7. In the "Vulnerability Protection" field, select the configured “Vulnerability

    Protection Profile”.

    8. Select "OK".

    9. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    10. Select "OK" when the confirmation dialog appears'
  checks:
