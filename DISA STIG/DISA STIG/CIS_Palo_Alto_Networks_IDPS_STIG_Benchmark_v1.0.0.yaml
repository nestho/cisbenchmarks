- id: '1.10'
  title: PANW-IP-000029
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must automatically install updates to signature definitions, detection
    heuristics, and vendor-provided rules. GROUP ID: V-207697 RULE ID: SV-207697r997610'
  rationale: Failing to automatically update malicious code protection mechanisms, including application software files, signature
    definitions, and vendor-provided rules, leaves the system vulnerable to exploitation by recently developed attack methods
    and programs. An automatic update process ensures this important task is performed without the need for SCA intervention.
    The IDPS is a key malicious code protection mechanism in the enclave infrastructure. To ensure this protection is responsive
    to changes in malicious code threats, IDPS components must be automatically updated, including anti-virus signatures,
    detection heuristics, vendor-provided rules, and vendor-provided signatures. If a DOD patch management server or update
    repository having the tested/verified updates is available for the device component, the components must be configured
    to automatically check this server/site for updates and install new updates. If a DOD server/site is not available, the
    component must be configured to automatically check a trusted vendor site for updates. A trusted vendor is either commonly
    used by DOD, specifically approved by DOD, the vendor from which the equipment was purchased, or approved by the local
    program's CCB.
  impact: ''
  references: []
  page_start: 36
  audit_raw: 'To verify that automatic updates are configured, go to Device >> Dynamic Updates.

    If no entries for "Applications and Threats" are present, this is a finding.

    If the "Applications and Threats" entry states "Download Only", this is a finding.'
  remediation: '1. Go to Device >> Dynamic Updates.

    2. Select "Check Now" at the bottom of the page to retrieve the latest signatures.

    3. To schedule automatic signature updates.

    Note: the steps provided below do not account for local change management policies.

    1. Go to Device >> Dynamic Updates.

    2. Select the text to the right of "Schedule".

    3. In the "Applications and Threat Updates Schedule" Window; complete the

    required information.

    4. In the "Recurrence" field, select "Daily".

    5. In the "Time" field, enter the time at which you want the device to check for

    updates.

    6. For the "Action", select "Download and Install".

    7. Select "OK".

    8. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    Select "OK" when the confirmation dialog appears.'
