  audit_raw: 'Go to Device >> Server Profiles >> NetFlow

    If no NetFlow Server Profiles are configured, this is a finding.

    This step assumes that it is an Ethernet interface that is being monitored. The

    verification is the same for Ethernet, VLAN, Loopback and Tunnel interfaces. Ask the

    Administrator which interface is being monitored; there may be more than one.

    1. Go to Network >> Interfaces >> Ethernet

    2. Select the interface that is being monitored.

    If the "NetFlow Profile" field is "None", this is a finding.'
  remediation: 'To create a NetFlow Server Profile:

    1. Go to Device >> Server Profiles >> NetFlow

    2. Select Add.

    3. In the "NetFlow Server Profile" window, complete the required fields.

    4. In the "Name" field, enter the name of the NetFlow Server Profile.

    5. In the "Minutes" field, enter the number of minutes after which the NetFlow

    template is refreshed.

    6. In the "Packets" field, enter the number of packets after which the NetFlow

    template is refreshed.

    7. In the "Active Timeout" field, enter the frequency (in minutes) the device exports

    records.

    8. Select the "PAN-OS Field Types" check box to export "App-ID" and "User-ID"

    fields.

    9. Select "Add" to add a NetFlow collector.

    10. In the "Name" field, enter the name of the server.

    11. In the "NetFlow Server" field, enter the hostname or IP address of the server.

    12. In the "Port" field enter the port used by the NetFlow collector (default 2055).

    13. Select "OK".

    Assign the NetFlow server profile to the interfaces that carry the traffic to be analyzed.

    These steps assume that it is one of the Ethernet interfaces. The configuration is the

    same for Ethernet, VLAN, Loopback and Tunnel interfaces.

    1. Go to Network >> Interfaces >> Ethernet

    2. Select the interface that the traffic traverses.

    3. In the "Ethernet Interface" window, in the "NetFlow Profile" field, select the

    configured NetFlow Profile.

    4. Select "OK".

    5. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    Select "OK" when the confirmation dialog appears.'
