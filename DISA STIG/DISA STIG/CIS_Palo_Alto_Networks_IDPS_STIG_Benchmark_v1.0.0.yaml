  audit_raw: 'Obtain the network architecture diagrams and identify where traffic crosses from one

    internal zone to another and review the configuration of the Palo Alto Networks security

    platform.

    The specific security policy is based on the authorized endpoints, applications, and

    protocols.

    If it does not filter traffic passing between zones, this is a finding.'
  remediation: 'The network architecture diagrams must identify where traffic crosses from one internal

    zone to another. The specific security policy is based on the authorized endpoints,

    applications, and protocols.

    To create or edit a Security Policy:

    1. Go to Policies >> Security

    2. Select "Add" to create a new security policy or select the name of the security

    policy to edit it.

    3. Configure the specific parameters of the policy by completing the required

    information in the fields of each tab.

    4. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    Select "OK" when the confirmation dialog appears.'
