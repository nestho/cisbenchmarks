  description: 'Exchange email forwarding must be restricted. GROUP ID: V-228377 RULE ID: SV-228377r879642'
  rationale: Auto-forwarded email accounts do not meet the requirement for digital signature and encryption of Controlled
    Unclassified Information (CUI) and Personally Identifiable Information (PII) in accordance with DoDI 8520.2 (reference
    ee) and DoD Director for Administration and Management memorandum, "Safeguarding Against and Responding to the Breach
    of Personally Identifiable Information". Use of forwarding set by an administrator interferes with nonrepudiation requirements
    that each end user be responsible for creation and destination of email data.
  impact: ''
  references: []
