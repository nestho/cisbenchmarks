  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Exchange Mail Quota settings must not restrict receiving mail. GROUP ID: V-228380 RULE ID: SV-228380r879650'
  rationale: 'Mail quota settings control the maximum sizes of a user’s mailbox and the system’s response if these limits
    are exceeded. Mailbox data that is not monitored against a quota increases the risk of mail loss due to filled disk space,
    which can also render the system unavailable. Multiple controls supply graduated levels of opportunity to respond before
    risking email service loss. This control prohibits the user from sending an email when the mailbox limit reaches the prohibit
    send quota value. Note: Best practice for this setting is to prohibit the user from sending email when the mailbox reaches
    90 percent of capacity.'
