  audit_raw: 'NOTE: For the purpose of this requirement, “remote” refers to those domains external to

    the DoDIN, whether classified or unclassified. NDRs between DoDIN networks is

    permitted.

    Open the Exchange Management Shell and enter the following command:

    Get-RemoteDomain | Select Name, Identity, NDREnabled

