- id: '1.39'
  title: EX16-MB-000470
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange Internal Receive connectors must not allow anonymous connections. GROUP ID: V-228391 RULE ID: SV-228391r879653'
  rationale: 'This control is used to limit the servers that may use this server as a relay. If a Simple Mail Transport Protocol
    (SMTP) sender does not have a direct connection to the Internet (for example, an application that produces reports to
    be emailed), it will need to use an SMTP Receive connector that does have a path to the Internet (for example, a local
    email server) as a relay. SMTP relay functions must be protected so third parties are not able to hijack a relay service
    for their own purposes. Most commonly, hijacking of relays is done by spammers to disguise the source of their messages
    and may also be used to cover the source of more destructive attacks. Relays can be restricted in one of three ways: by
    blocking relays (restrict to a blank list of servers), by restricting use to lists of valid servers, or by restricting
    use to servers that can authenticate. Because authenticated connections are the most secure for SMTP Receive connectors,
    it is recommended that relays allow only servers that can authenticate.'
  impact: ''
  references: []
  page_start: 70
  audit_raw: 'NOTE: In some instances, AnonymousUsers may be necessary for organizationspecific operations. In such cases,
    allowing AnonymousUsers must be paired with

    restricting to specific lists of servers allowed to access. In addition, the risk must be

    documented and accepted by the ISSO, ISSM, or AO.

