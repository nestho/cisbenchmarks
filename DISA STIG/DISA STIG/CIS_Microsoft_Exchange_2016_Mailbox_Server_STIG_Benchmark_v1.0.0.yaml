  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Exchange Mail quota settings must not restrict receiving mail. GROUP ID: V-228379 RULE ID: SV-228379r879650'
  rationale: Mail quota settings control the maximum sizes of a user’s mailbox and the system’s response if these limits are
    exceeded. Mailbox data that is not monitored against a quota increases the risk of mail loss due to filled disk space,
    which can also render the system unavailable. Failure to allow mail receipt may impede users from receiving mission-critical
    data.
  impact: ''
  references: []
