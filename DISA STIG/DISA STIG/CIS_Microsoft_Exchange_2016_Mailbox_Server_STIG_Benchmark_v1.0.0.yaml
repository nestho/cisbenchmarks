- id: '1.51'
  title: EX16-MB-000610
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange Outlook Anywhere clients must use NTLM authentication to access email. GROUP ID: V-228404 RULE ID:
    SV-228404r879764'
  rationale: 'Identification and authentication provide the foundation for access control. Access to email services applications
    require NTLM authentication. Outlook Anywhere, if authorized for use by the site, must use NTLM authentication when accessing
    email. Note: There is a technical restriction in Exchange Outlook Anywhere that requires a direct SSL connection from
    Outlook to the Certificate Authority (CA) server. There is also a constraint where Microsoft supports that the CA server
    must participate in the Active Director (AD) domain inside the enclave. For this reason, Outlook Anywhere must be deployed
    only for enclave-sourced Outlook users.'
  impact: ''
  references: []
  page_start: 90
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-OutlookAnywhere

    Get-OutlookAnywhere | Select Name, Identity, InternalClientAuthenticationMethod,

    ExternalClientAuthenticationMethod

    If the value of "InternalClientAuthenticationMethod" and the value of

    "ExternalClientAuthenticationMethod" are not set to NTLM, this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    For InternalClientAuthenticationMethod:

    Set-OutlookAnywhere -Identity ''<IdentityName''> -InternalClientAuthenticationMethod

    NTLM

    For ExternalClientAuthenticationMethod:

    Set-OutlookAnywhere -Identity ''<IdentityName''> -ExternalClientAuthenticationMethod

    NTLM'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-OutlookAnywhere

      Get-OutlookAnywhere | Select Name, Identity, InternalClientAuthenticationMethod,

      ExternalClientAuthenticationMethod

      If the value of "InternalClientAuthenticationMethod" and the value of

      "ExternalClientAuthenticationMethod" are not set to NTLM, this is a finding.'
    severity: medium
- id: '1.52'
  title: EX16-MB-000620
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Exchange Email application must not share a partition with another application. GROUP ID: V-228405 RULE
    ID: SV-228405r879802'
  rationale: In the same way that added security layers can provide a cumulative positive effect on security posture, multiple
    applications can provide a cumulative negative effect. A vulnerability and subsequent exploit to one application can lead
    to an exploit of other applications sharing the same security context. For example, an exploit to a web server process
    that leads to unauthorized administrative access to the host system can most likely lead to a compromise of all applications
    hosted by the same system. Email services should be installed on a partition that does not host other applications. Email
    services should never be installed on a Domain Controller/Directory Services server.
  impact: ''
  references: []
  page_start: 91
  audit_raw: 'Review the Email Domain Security Plan (EDSP).

    Determine if the directory Exchange is installed.

    Open Windows Explorer.

    Navigate to where Exchange is installed.

    If Exchange resides on a directory or partition other than that of the operating system

    and does not have other applications installed (unless approved by the Information

    System Security Officer [ISSO]), this is not a finding.'
  remediation: 'Update the EDSP with the location of where Exchange is installed.

    Install Exchange on a dedicated application directory or partition separate than that of

    the operating system.'
  checks:
  - type: manual_review
    info: 'Review the Email Domain Security Plan (EDSP).

      Determine if the directory Exchange is installed.

      Open Windows Explorer.

      Navigate to where Exchange is installed.

      If Exchange resides on a directory or partition other than that of the operating system

      and does not have other applications installed (unless approved by the Information

      System Security Officer [ISSO]), this is not a finding.'
    severity: medium
- id: '1.53'
  title: EX16-MB-000630
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange must not send delivery reports to remote domains. GROUP ID: V-228406 RULE ID: SV-228406r879806'
  rationale: Attackers can use automated messages to determine whether a user account is active, in the office, traveling,
    and so on. An attacker might use this information to conduct future attacks. Ensure that delivery reports to remote domains
    are disabled. Before enabling this setting, first configure a remote domain using the Exchange Management Console (EMC)
    or the New-RemoteDomain cmdlet.
  impact: ''
  references: []
  page_start: 92
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-RemoteDomain | Select Identity, DeliveryReportEnabled

    If the value of "DeliveryReportEnabled" is not set to "False", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-RemoteDomain -Identity <''IdentityName''> -DeliveryReportEnabled $false

    Note: The <IdentityName> value must be in single quotes.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-RemoteDomain | Select Identity, DeliveryReportEnabled

      If the value of "DeliveryReportEnabled" is not set to "False", this is a finding.'
    severity: medium
- id: '1.54'
  title: EX16-MB-000640
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange must not send nondelivery reports to remote domains. GROUP ID: V-228407 RULE ID: SV-228407r879806'
  rationale: Attackers can use automated messages to determine whether a user account is active, in the office, traveling,
    and so on. An attacker might use this information to conduct future attacks. Ensure that nondelivery reports to remote
    domains are disabled. Before enabling this setting, first configure a remote domain using the Exchange Management Console
    (EMC) or the New-RemoteDomain cmdlet.
  impact: ''
  references: []
