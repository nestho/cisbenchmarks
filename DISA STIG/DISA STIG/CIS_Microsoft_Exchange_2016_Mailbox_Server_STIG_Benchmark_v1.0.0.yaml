    finding.

    or

    If the value of "MaxHopCount" is set to a value other than "60" and has signoff and risk

    acceptance in the EDSP, this is not a finding.'
  remediation: 'Update the EDSP to specify the "MaxHopCount" value or verify that this information is

    documented by the organization.

