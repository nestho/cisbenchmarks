- id: '1.40'
  title: EX16-MB-000490
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange must have anti-spam filtering installed. GROUP ID: V-228393 RULE ID: SV-228393r879653'
  rationale: Originators of spam messages are constantly changing their techniques in order to defeat spam countermeasures;
    therefore, spam software must be constantly updated to address the changing threat. A manual update procedure is labor
    intensive and does not scale well in an enterprise environment. This risk may be mitigated by using an automatic update
    capability. Spam protection mechanisms include, for example, signature definitions, rule sets, and algorithms. Exchange
    2016 provides both anti-spam and anti-malware protection out of the box. The Exchange 2016 anti-spam and anti-malware
    product capabilities are limited but still provide some protection.
  impact: ''
  references: []
  page_start: 72
  audit_raw: 'Review the Email Domain Security Plan (EDSP).

    Note: If using another DoD-approved antispam product for email or a DoD-approved

    email gateway spamming device, such as Enterprise Email Security Gateway

    (EEMSG), this is not applicable (NA).

    Open the Exchange Management Shell and enter the following command:

    Get-ContentFilterConfig | Format-Table Name,Enabled

    If no value is returned, this is a finding.'
  remediation: 'Update the EDSP with the anti-spam mechanism used.

    Install the AntiSpam module.

    Open the Exchange Management Shell and enter the following command:

    & $env:ExchangeInstallPath\Scripts\Install-AntiSpamAgents.ps1'
