controls:
- id: '1.1'
  title: EX16-MB-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange must have Administrator audit logging enabled. GROUP ID: V-228354 RULE ID: SV-228354r879526'
  rationale: 'Unauthorized or malicious data changes can compromise the integrity and usefulness of the data. Automated attacks
    or malicious users with elevated privileges have the ability to effect change using the same mechanisms as email administrators.
    Auditing any changes to access mechanisms not only supports accountability and nonrepudiation for those authorized to
    define the environment but also enables investigation of changes made by others who may not be authorized. Note: This
    administrator auditing feature audits all exchange changes regardless of the user''s assigned role or permissions.'
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-AdminAuditLogConfig | Select Name, AdminAuditLogEnabled

    If the value of "AdminAuditLogEnabled" is not set to "True", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-AdminAuditLogConfig -AdminAuditLogEnabled $true'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-AdminAuditLogConfig | Select Name, AdminAuditLogEnabled

      If the value of "AdminAuditLogEnabled" is not set to "True", this is a finding.'
    severity: medium
- id: '1.2'
  title: EX16-MB-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange servers must use approved DoD certificates. GROUP ID: V-228355 RULE ID: SV-228355r879530'
  rationale: Server certificates are required for many security features in Exchange; without them, the server cannot engage
    in many forms of secure communication. Failure to implement valid certificates makes it virtually impossible to secure
    Exchange's communications.
  impact: ''
  references: []
  page_start: 12
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-ExchangeCertificate | Select CertificateDomains, issuer

    If the value of "CertificateDomains" does not indicate it is issued by the DoD, this is a

    finding.'
  remediation: Remove the non-DoD certificate and import the correct DoD certificates.
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-ExchangeCertificate | Select CertificateDomains, issuer

      If the value of "CertificateDomains" does not indicate it is issued by the DoD, this is a

      finding.'
    severity: medium
- id: '1.3'
  title: EX16-MB-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange auto-forwarding email to remote domains must be disabled or restricted. GROUP ID: V-228356 RULE ID:
    SV-228356r879533'
  rationale: Attackers can use automated messages to determine whether a user account is active, in the office, traveling,
    and so on. An attacker might use this information to conduct future attacks. Verify Automatic Forwards to remote domains
    are disabled, except for enterprise mail that must be restricted to forward only to .mil and .gov. domains. Before enabling
    this setting, configure a remote domain.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'Note: Requirement is not applicable on classified or completely closed networks.

    Non-Enterprise Mail Check Content:

    Open the Exchange Management Shell and enter the following command:

    Get-RemoteDomain | Select Identity, AutoForwardEnabled

    If the value of AutoForwardEnabled is not set to "False", this is a finding.

    Enterprise Mail Check Content:

    If the value of "AutoForwardEnabled" is set to "True", this is not a finding.

    and

    In the Exchange Management Shell, enter the following command:

    Get-RemoteDomain

    If the value of "RemoteDomain" is not set to ".mil" and/or ".gov" domain(s), this is a

    finding.'
  remediation: 'Non-Enterprise Mail Fix Text:

    Open the Exchange Management Shell and enter the following command:

    Set-RemoteDomain -Identity <''IdentityName''> -AutoForwardEnabled $false

    Note: The <IdentityName> value must be in single quotes.

    Enterprise Mail Fix Text:

    New-RemoteDomain -Name <NewRemoteDomainName> -DomainName <SMTP

    Address>

    Note: <NewRemoteDomainName> must either be a .mil or .gov domain.

    Set-RemoteDomain -Identity <''RemoteDomainIdentity''> -AutoForwardEnabled $true

    Note: The <RemoteDomainIdentity> value must be in single quotes.'
  checks:
  - type: manual_review
    info: 'Note: Requirement is not applicable on classified or completely closed networks.

      Non-Enterprise Mail Check Content:

      Open the Exchange Management Shell and enter the following command:

      Get-RemoteDomain | Select Identity, AutoForwardEnabled

      If the value of AutoForwardEnabled is not set to "False", this is a finding.

      Enterprise Mail Check Content:

      If the value of "AutoForwardEnabled" is set to "True", this is not a finding.

      and

      In the Exchange Management Shell, enter the following command:

      Get-Remo'
    severity: medium
- id: '1.4'
  title: EX16-MB-000040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange Connectivity logging must be enabled. GROUP ID: V-228357 RULE ID: SV-228357r879559'
  rationale: 'A connectivity log is a record of the SMTP connection activity of the outbound message delivery queues to the
    destination Mailbox server, smart host, or domain. Connectivity logging is available on Hub Transport servers and Edge
    Transport servers. By default, connectivity logging is disabled. If events are not recorded, it may be difficult or impossible
    to determine the root cause of system problems or the unauthorized activities of malicious users. Note: Transport configuration
    settings apply to the organization/global level of the Exchange SMTP path. By checking and setting them at the Hub server,
    the setting will apply to both Hub and Edge roles.'
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-TransportService | Select Name, Identity, ConnectivityLogEnabled

    If the value of "ConnectivityLogEnabled" is not set to "True", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-TransportService -Identity <''IdentityName''> -ConnectivityLogEnabled $true

    Note: The <IdentityName> value must be in single quotes.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-TransportService | Select Name, Identity, ConnectivityLogEnabled

      If the value of "ConnectivityLogEnabled" is not set to "True", this is a finding.'
    severity: medium
- id: '1.5'
  title: EX16-MB-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Exchange Email Diagnostic log level must be set to the lowest level. GROUP ID: V-228358 RULE ID: SV-228358r879559'
  rationale: 'Log files help establish a history of activities and can be useful in detecting attack attempts or determining
    tuning adjustments to improve availability. Diagnostic logging, however, characteristically produces large volumes of
    data and requires care in managing the logs to prevent risk of disk capacity denial-of-service conditions. Exchange diagnostic
    logging is divided into 29 main "services", each of which has anywhere from 2 to 26 "categories" of events to be monitored.
    Each category may be set to one of four levels of logging: Lowest, Low, Medium, and High, depending on how much detail
    is required. Higher levels of detail require more disk space to store the audit material. Diagnostic logging is intended
    to help administrators debug problems with their systems, not as a general-purpose auditing tool. Because the diagnostic
    logs collect a great deal of information, the log files may grow large very quickly. Diagnostic log levels may be raised
    for limited periods of time when attempting to debug relevant pieces of Exchange functionality. Once debugging has finished,
    diagnostic log levels should be reduced again.'
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-EventLogLevel

    If the Diagnostic of any EventLevel is not set to "Lowest", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-EventLogLevel -Identity <''IdentityName\EventlogName''> -Level Lowest

    Note: The <IdentityName\EventlogName> value must be in single quotes.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-EventLogLevel

      If the Diagnostic of any EventLevel is not set to "Lowest", this is a finding.'
    severity: medium
- id: '1.6'
  title: EX16-MB-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Exchange Audit record parameters must be set. GROUP ID: V-228359 RULE ID: SV-228359r879559'
  rationale: 'Log files help establish a history of activities and can be useful in detecting attack attempts. This item declares
    the fields that must be available in the audit log file in order to adequately research events that are logged. Audit
    records should include the following fields to supply useful event accounting: Object modified, Cmdlet name, Cmdlet parameters,
    Modified parameters, Caller, Succeeded, and Originating server.'
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-AdminAuditLogConfig | Select AdminAuditLogParameters

    Note: The value of "*" indicates all parameters are being audited.

    If the value of "AdminAuditLogParameters" is not set to "*", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-AdminAuditLogConfig -AdminAuditLogParameters *'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-AdminAuditLogConfig | Select AdminAuditLogParameters

      Note: The value of "*" indicates all parameters are being audited.

      If the value of "AdminAuditLogParameters" is not set to "*", this is a finding.'
    severity: medium
- id: '1.7'
  title: EX16-MB-000070
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Exchange Circular Logging must be disabled. GROUP ID: V-228360 RULE ID: SV-228360r879566'
  rationale: Logging provides a history of events performed and can also provide evidence of tampering or attack. Failure
    to create and preserve logs adds to the risk that suspicious events may go unnoticed and raises the potential that insufficient
    history will be available to investigate them. This setting controls how log files are written. If circular logging is
    enabled, one log file is stored with a default size of 1024 KB. Once the size limit has been reached, additional log entries
    overwrite the oldest log entries. If circular logging is disabled, once a log file reaches the size limit, a new log file
    is created. Mailbox should not use circular logging. Logs should be written to a partition separate from the operating
    system, with log protection and backups being incorporated into the overall System Security Plan.
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-MailboxDatabase | Select Name, Identity, CircularLoggingEnabled

    If the value of "CircularLoggingEnabled" is not set to "False", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-MailboxDatabase -Identity <''IdentityName''> -CircularLoggingEnabled $false

    Note: The <IdentityName> value must be in single quotes.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-MailboxDatabase | Select Name, Identity, CircularLoggingEnabled

      If the value of "CircularLoggingEnabled" is not set to "False", this is a finding.'
    severity: medium
- id: '1.8'
  title: EX16-MB-000080
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange Email Subject Line logging must be disabled. GROUP ID: V-228361 RULE ID: SV-228361r879566'
  rationale: Log files help establish a history of activities and can be useful in detecting attack attempts or determining
    tuning adjustments to improve availability. When "message tracking" is enabled, only the sender, recipients, time, and
    other delivery information is included by default. Information such as the subject and message body is not included. However,
    the absence of the message subject line can make it difficult to locate a specific message in the log unless one knows
    roughly what time the message was sent. To simplify searches through these logs, Exchange offers the ability to include
    the message "subject line" in the log files and in the Message Tracking Center display. This can make it significantly
    easier to locate a specific message. However, this feature creates larger log files and will contain information that
    may raise privacy and legal concerns. Enterprise policy should be consulted before this feature is enabled. Also, because
    the log files may contain sensitive information in the form of the subject line, the log files will need to be protected,
    commensurate with the sensitivity level, as the content may be of interest to an attacker. For these reasons, it is recommended
    that subject logging not be enabled during regular production operations. Instead, treat this feature as a diagnostic
    that can be used if needed. The tradeoff is that finding the correct message in the message tracking logs will become
    more difficult because the administrator will need to search using only the time the message was sent and the message’s
    sender. This control will have no effect unless Message Tracking is enabled. However, the setting should be disabled in
    case message tracking is enabled in the future.
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-TransportService | Select Name, Identity,

    MessageTrackingLogSubjectLoggingEnabled

    If the value of “MessageTrackingLogSubjectLoggingEnabled” is not set to “False”, this is

    a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-Transportservice -MessageTrackingLogSubjectLoggingEnabled $False'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-TransportService | Select Name, Identity,

      MessageTrackingLogSubjectLoggingEnabled

      If the value of “MessageTrackingLogSubjectLoggingEnabled” is not set to “False”, this is

      a finding.'
    severity: medium
- id: '1.9'
  title: EX16-MB-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange Message Tracking Logging must be enabled. GROUP ID: V-228362 RULE ID: SV-228362r879566'
  rationale: A message tracking log provides a detailed log of all message activity as messages are transferred to and from
    a computer running Exchange. If events are not recorded, it may be difficult or impossible to determine the root cause
    of system problems or the unauthorized activities of malicious users.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-Transportservice | Select Name, MessageTrackingLogEnabled

    If the value of MessageTrackingLogEnabled is not set to True, this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-Transportservice <IdentityName> -MessageTrackingLogEnabled $true

    Note: The <IdentityName> value must be in quotes.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-Transportservice | Select Name, MessageTrackingLogEnabled

      If the value of MessageTrackingLogEnabled is not set to True, this is a finding.'
    severity: medium
- id: '1.10'
  title: EX16-MB-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange Queue monitoring must be configured with threshold and action. GROUP ID: V-228363 RULE ID: SV-228363r879572'
  rationale: Monitors are automated "process watchers" that respond to performance changes and can be useful in detecting
    outages and alerting administrators where attention is needed. Exchange has built-in monitors that enable the administrator
    to generate alerts if thresholds are reached, better enabling them to react in a timely fashion. This field offers choices
    of alerts when a "warning" or "critical" threshold is reached on the SMTP queue. A good rule of thumb (default) is to
    issue warnings when SMTP queue growth exceeds 10 minutes and critical messages when it exceeds 20 minutes, which should
    only happen occasionally. Frequent alerts against this counter may indicate a network or other issue (such as inbound
    ExchangeMER traffic) that directly impacts email delivery. Notification choices include email alert to an email-enabled
    account (for example, an email Administrator) or invoke a script to take other action (for example, to add an Event to
    the Microsoft Application Event Log, where external monitors might detect it).
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'Note: If a third-party application is performing monitoring functions, the reviewer should

    verify the application is monitoring correctly and mark the vulnerability not applicable

    (NA).

    Open the Exchange Management Shell and enter the following command:

    perfmon

    Get-MonitoringItemHelp -Identity <String> -Server <ServerIdParameter>

    If no sets are defined or queues are not being monitored, this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    perfmon

    In the left pane, navigate to and select Performance >> Data Collector Sets >> User

    Defined.

    Right-click on, navigate to, and configure User Defined >> New >> Data Collector Sets

    and configure the system to use the data collection set for monitoring the queues.'
  checks:
  - type: manual_review
    info: 'Note: If a third-party application is performing monitoring functions, the reviewer should

      verify the application is monitoring correctly and mark the vulnerability not applicable

      (NA).

      Open the Exchange Management Shell and enter the following command:

      perfmon

      Get-MonitoringItemHelp -Identity <String> -Server <ServerIdParameter>

      If no sets are defined or queues are not being monitored, this is a finding.'
    severity: medium
- id: '1.11'
  title: EX16-MB-000110
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange Send Fatal Errors to Microsoft must be disabled. GROUP ID: V-228364 RULE ID: SV-228364r879587'
  rationale: It is detrimental for applications to provide, or install by default, functionality exceeding requirements or
    mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured.
    They increase the risk to the platform by providing additional attack vectors. Applications are capable of providing a
    wide variety of functions and services. Some of the functions and services, provided by default, may not be necessary
    to support essential organizational operations (e.g., key missions, functions). Examples of non-essential capabilities
    include but are not limited to advertising software or browser plug-ins not related to requirements or providing a wide
    array of functionality not required for every mission but that cannot be disabled. All system errors in Exchange will
    result in outbound traffic that may be identified by an eavesdropper. For this reason, the "Report Fatal Errors to Microsoft"
    feature must be disabled.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-ExchangeServer –status | Select Name, Identity, ErrorReportingEnabled

    For each Exchange Server, if the value of "ErrorReportingEnabled" is not set to "False",

    this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-ExchangeServer -Identity <''IdentityName''> -ErrorReportingEnabled $false

    Note: The <IdentityName> value must be in single quotes.

    Repeat the process for each Exchange Server.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-ExchangeServer –status | Select Name, Identity, ErrorReportingEnabled

      For each Exchange Server, if the value of "ErrorReportingEnabled" is not set to "False",

      this is a finding.'
    severity: medium
- id: '1.12'
  title: EX16-MB-000120
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange must protect audit data against unauthorized read access. GROUP ID: V-228365 RULE ID: SV-228365r879576'
  rationale: Log files help establish a history of activities and can be useful in detecting attack attempts or determining
    tuning adjustments to improve availability. Audit log content must always be considered sensitive and in need of protection.
    Audit data available for modification by a malicious user can be altered to conceal malicious activity. Audit data might
    also provide a means for the malicious user to plan unauthorized activities that exploit weaknesses. The contents of audit
    logs are protected against unauthorized access, modification, or deletion. Only authorized auditors and the audit functions
    should be granted "Read" and "Write" access to audit log data.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'Review the Email Domain Security Plan (EDSP) or document that contains this

    information.

    Determine the authorized groups or users that should have "Read" access to the audit

    data.

    If any group or user has "Read" access to the audit data that is not documented in the

    EDSP, this is a finding.'
  remediation: 'Update the EDSP to specify the authorized groups or users that should have "Read"

    access to the audit data or verify that this information is documented by the

    organization.

    Restrict any unauthorized groups'' or users'' "Read" access to the audit logs.'
  checks:
  - type: manual_review
    info: 'Review the Email Domain Security Plan (EDSP) or document that contains this

      information.

      Determine the authorized groups or users that should have "Read" access to the audit

      data.

      If any group or user has "Read" access to the audit data that is not documented in the

      EDSP, this is a finding.'
    severity: medium
