    or

    If the value of "ProhibitSendReceiveQuota" is set to an alternate value and has signoff

    and risk acceptance in the EDSP, this is not a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-MailboxDatabase -Identity <''IdentityName''> -ProhibitSendReceiveQuota Unlimited

    Note: The <IdentityName> value must be in single quotes.

    or

    Enter the value as identified by the EDSP that has obtained a signoff with risk

    acceptance.'
