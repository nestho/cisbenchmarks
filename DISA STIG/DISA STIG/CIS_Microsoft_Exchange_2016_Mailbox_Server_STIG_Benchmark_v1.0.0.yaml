  description: 'The Exchange Internet Message Access Protocol 4 (IMAP4) service must be disabled. GROUP ID: V-228371 RULE
    ID: SV-228371r944805'
  rationale: IMAP4 is not approved for use within the DoD. It uses a clear-text-based user name and password and does not
    support the DoD standard for PKI for email access. User name and password could easily be captured from the network, allowing
    a malicious user to access other system features. Uninstalling or disabling the service will prevent the use of the IMAP4
    protocol.
