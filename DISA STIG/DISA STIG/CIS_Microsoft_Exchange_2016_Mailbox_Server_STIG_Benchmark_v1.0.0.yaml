- id: '1.44'
  title: EX16-MB-000530
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Exchange servers must have an approved DoD email-aware virus protection software installed. GROUP ID: V-228397
    RULE ID: SV-228397r879653'
  rationale: With the proliferation of trojans, viruses, and spam attaching themselves to email messages (or attachments),
    it is necessary to have capable email-aware anti-virus (AV) products to scan messages and identify any resident malware.
    Because email messages and their attachments are formatted to the MIME standard, a flat-file AV scanning engine is not
    suitable for scanning email message stores. Email-aware anti-virus engines must be Exchange 2016 compliant. Competent
    email scanners will have the ability to scan mail stores, attachments (including zip or other archive files) and mail
    queues and to issue warnings or alerts if malware is detected. As with other AV products, a necessary feature to include
    is the ability for automatic updates.
  impact: ''
  references: []
  page_start: 79
  audit_raw: 'Review the Email Domain Security Plan (EDSP).

    Determine the anti-virus strategy.

    Verify the email-aware anti-virus scanner product is Exchange 2016 compatible and

    DoD approved.

    If email servers are using an email-aware anti-virus scanner product that is not DoD

    approved and Exchange 2016 compatible, this is a finding.'
  remediation: 'Update the EDSP to specify the organization''s anti-virus strategy.

    Install and configure a DoD-approved compatible Exchange 2016 email-aware anti-virus

    scanner product.'
  checks:
  - type: manual_review
    info: 'Review the Email Domain Security Plan (EDSP).

      Determine the anti-virus strategy.

      Verify the email-aware anti-virus scanner product is Exchange 2016 compatible and

      DoD approved.

      If email servers are using an email-aware anti-virus scanner product that is not DoD

      approved and Exchange 2016 compatible, this is a finding.'
    severity: medium
- id: '1.45'
  title: EX16-MB-000540
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Exchange Global Recipient Count Limit must be set. GROUP ID: V-228398 RULE ID: SV-228398r879653'
  rationale: Email system availability depends in part on best practice strategies for setting tuning configurations. The
    Global Recipient Count Limit field is used to control the maximum number of recipients that can be specified in a single
    message sent from this server. Its primary purpose is to minimize the chance of an internal sender spamming other recipients,
    since spam messages often have a large number of recipients. Spam prevention can originate from both outside and inside
    organizations. While inbound spam is evaluated as it arrives, controls such as this one help prevent spam that might originate
    inside the organization. The Recipient Count Limit is global to the Exchange implementation. Lower-level refinements are
    possible; however, in this configuration strategy, setting the value once at the global level facilitates a more available
    system by eliminating potential conflicts among multiple settings. A value of less than or equal to "5000" is probably
    larger than is needed for most organizations but is small enough to minimize usefulness to spammers and is easily handled
    by Exchange. An unexpanded distribution is handled as one recipient. Specifying "unlimited" may result in abuse.
  impact: ''
  references: []
  page_start: 81
  audit_raw: 'Review the Email Domain Security Plan (EDSP).

    Determine the global maximum message recipient count.

    Open the Exchange Management Shell and enter the following command:

    Get-TransportConfig | Select Name, Identity, MaxRecipientEnvelopeLimit

    If the value of "MaxRecipientEnvelopeLimit" is not set to "5000", this is a finding.

    or

    If "MaxRecipientEnvelopeLimit" is set to an alternate value and has signoff and risk

    acceptance in the EDSP, this is not a finding.'
  remediation: 'Update the EDSP to specify the global maximum message recipient count.

    Set-TransportConfig -MaxRecipientEnvelopeLimit 5000

    or

    Enter the value as identified by the EDSP that has obtained a signoff with risk

    acceptance.

    Restart the Microsoft Exchange Information Store service.'
  checks:
  - type: manual_review
    info: 'Review the Email Domain Security Plan (EDSP).

      Determine the global maximum message recipient count.

      Open the Exchange Management Shell and enter the following command:

      Get-TransportConfig | Select Name, Identity, MaxRecipientEnvelopeLimit

      If the value of "MaxRecipientEnvelopeLimit" is not set to "5000", this is a finding.

      or

      If "MaxRecipientEnvelopeLimit" is set to an alternate value and has signoff and risk

      acceptance in the EDSP, this is not a finding.'
    severity: medium
- id: '1.46'
  title: EX16-MB-000550
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Exchange Receive connector timeout must be limited. GROUP ID: V-228399 RULE ID: SV-228399r879673'
  rationale: Email system availability depends in part on best practice strategies for setting tuning. This configuration
    controls the number of idle minutes before the connection is dropped. It works in conjunction with the Maximum Inbound
    Connections Count setting. Connections, once established, may incur delays in message transfer. If the timeout period
    is too long, there is risk that idle connections may be maintained for unnecessarily long time periods, preventing new
    connections from being established.
  impact: ''
  references: []
  page_start: 83
  audit_raw: 'Review the Email Domain Security Plan (EDSP).

    Determine the Connection Timeout value.

    Open the Exchange Management Shell and enter the following command:

    Get-ReceiveConnector | Select Name, Identity, ConnectionTimeout

    For each Receive connector, if the value of "ConnectionTimeout" is not set to

    "00:10:00", this is a finding.

    or

    If "ConnectionTimeout" is set to other than "00:10:00" and has signoff and risk

    acceptance in the EDSP, this is not a finding.'
  remediation: 'Update the EDSP to specify the Connection Timeout value.

    Open the Exchange Management Shell and enter the following command:

    Set-ReceiveConnector -Identity <''IdentityName''> -ConnectionTimeout 00:10:00

    Note: The <IdentityName> value must be in single quotes.

    or

    Enter the value as identified by the EDSP that has obtained a signoff with risk

    acceptance.'
  checks:
  - type: manual_review
    info: 'Review the Email Domain Security Plan (EDSP).

      Determine the Connection Timeout value.

      Open the Exchange Management Shell and enter the following command:

      Get-ReceiveConnector | Select Name, Identity, ConnectionTimeout

      For each Receive connector, if the value of "ConnectionTimeout" is not set to

      "00:10:00", this is a finding.

      or

      If "ConnectionTimeout" is set to other than "00:10:00" and has signoff and risk

      acceptance in the EDSP, this is not a finding.'
    severity: medium
- id: '1.47'
  title: EX16-MB-000570
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Exchange application directory must be protected from unauthorized access. GROUP ID: V-228400 RULE ID:
    SV-228400r879751'
  rationale: Default product installations may provide more generous access permissions than are necessary to run the application.
    By examining and tailoring access permissions to more closely provide the least amount of privilege possible, attack vectors
    that align with user permissions are less likely to access more highly secured areas.
  impact: ''
  references: []
  page_start: 85
  audit_raw: 'Review the Email Domain Security Plan (EDSP) or document that contains this

    information.

    Determine the authorized groups and users that have access to the Exchange

    application directories.

    Verify the access permissions on the directory match the access permissions listed in

    the EDSP.

    If any group or user has different access permissions, this is a finding.

    Note: The default installation directory is \Program Files\Microsoft\Exchange

    Server\V15.'
  remediation: 'Update the EDSP to specify the authorized groups and users that have access to the

    Exchange application directories or verify that this information is documented by the

    organization.

    Navigate to the Exchange application directory and remove or modify the group or user

    access permissions.

    Note: The default installation directory is \Program Files\Microsoft\Exchange

    Server\V15.'
  checks:
  - type: manual_review
    info: 'Review the Email Domain Security Plan (EDSP) or document that contains this

      information.

      Determine the authorized groups and users that have access to the Exchange

      application directories.

      Verify the access permissions on the directory match the access permissions listed in

      the EDSP.

      If any group or user has different access permissions, this is a finding.

      Note: The default installation directory is \Program Files\Microsoft\Exchange

      Server\V15.'
    severity: medium
- id: '1.48'
  title: EX16-MB-000580
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'An Exchange software baseline copy must exist. GROUP ID: V-228401 RULE ID: SV-228401r879753'
  rationale: Exchange software, as with other application software installed on a host system, must be included in a system
    baseline record and periodically reviewed; otherwise, unauthorized changes to the software may not be discovered. This
    effort is a vital step to securing the host and the applications, as it is the only method that may provide the ability
    to detect and recover from otherwise undetected changes, such as those that result from worm or bot intrusions. The Exchange
    software and configuration baseline is created and maintained for comparison during scanning efforts. Operational procedures
    must include baseline updates as part of configuration management tasks that change the software and configuration.
  impact: ''
  references: []
  page_start: 86
  audit_raw: 'Review the Email Domain Security Plan (EDSP) or document that contains this

    information.

    Determine the software baseline.

    Review the application software baseline procedures and implementation artifacts.

    Note the list of files and directories included in the baseline procedure for completeness.

    If an email software copy exists to serve as a baseline and is available for comparison

    during scanning efforts, this is not a finding.'
  remediation: 'Update the EDSP to specify the software baseline, procedures, and implementation

    artifacts or verify that this information is documented by the organization.'
  checks:
  - type: manual_review
    info: 'Review the Email Domain Security Plan (EDSP) or document that contains this

      information.

      Determine the software baseline.

      Review the application software baseline procedures and implementation artifacts.

      Note the list of files and directories included in the baseline procedure for completeness.

      If an email software copy exists to serve as a baseline and is available for comparison

      during scanning efforts, this is not a finding.'
    severity: medium
- id: '1.49'
  title: EX16-MB-000590
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange software must be monitored for unauthorized changes. GROUP ID: V-228402 RULE ID: SV-228402r928977'
  rationale: Monitoring software files for changes against a baseline on a regular basis may help detect the possible introduction
    of malicious code on a system.
  impact: ''
  references: []
  page_start: 87
  audit_raw: 'Review the Email Domain Security Plan (EDSP).

