- id: '1.21'
  title: EX16-MB-000210
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange Internet-facing Send connectors must specify a Smart Host. GROUP ID: V-228374 RULE ID: SV-228374r879633'
  rationale: When identifying a "Smart Host" for the email environment, a logical Send connector is the preferred method.
    A Smart Host acts as an Internet-facing concentrator for other email servers. Appropriate hardening can be applied to
    the Smart Host, rather than at multiple locations throughout the enterprise. Failure to identify a Smart Host could default
    to each email server performing its own lookups (potentially through protective firewalls). Exchange servers should not
    be Internet facing and should therefore not perform any Smart Host functions. When the Exchange servers are Internet facing,
    they must be configured to identify the Internetfacing server that is performing the Smart Host function.
  impact: ''
  references: []
  page_start: 38
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-SendConnector | Select Name, Identity, SmartHosts

    Identify the Internet-facing connectors.

    For each Send connector, if the value of "SmartHosts" does not return the Smart Host

    IP address, this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-SendConnector -Identity <''IdentityName''> -SmartHosts <''IP Address of Smart

    Host''> -DNSRoutingEnabled $false

    Note: The <IdentityName> and <IP Address of Smart Host> values must be in single

    quotes.

    Repeat the procedure for each Send connector.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-SendConnector | Select Name, Identity, SmartHosts

      Identify the Internet-facing connectors.

      For each Send connector, if the value of "SmartHosts" does not return the Smart Host

      IP address, this is a finding.'
    severity: medium
- id: '1.22'
  title: EX16-MB-000220
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange internal Receive connectors must require encryption. GROUP ID: V-228375 RULE ID: SV-228375r879636'
  rationale: The Simple Mail Transfer Protocol (SMTP) Receive connector is used by Exchange to send and receive messages from
    server to server using SMTP protocol. This setting controls the encryption strength used for client connections to the
    SMTP Receive connector. With this feature enabled, only clients capable of supporting secure communications will be able
    to send mail using this SMTP server. Where secure channels are required, encryption can also be selected. The use of secure
    communication prevents eavesdroppers from reading or modifying communications between mail clients and servers. While
    sensitive message bodies should be encrypted by the sender at the client, requiring a secure connection from the client
    to the server adds protection by encrypting the sender and recipient information that cannot be encrypted by the sender.
    Individually, channel security and encryption have been compromised by attackers. Used together, email becomes a more
    difficult target, and security is heightened. Failure to enable this feature gives eavesdroppers an opportunity to read
    or modify messages between the client and server. Multiple values can be separated by commas, but some values have dependencies
    and exclusions. AuthMechanism may include other mechanisms as long as the "Tls" is identified. • Only use the value "None"
    by itself. • The value "BasicAuthRequireTLS" requires the values "BasicAuth" and "Tls". • The only other value that can
    be used with ExternalAuthoritative is "Tls". • The value "Tls" is required when the value of the RequireTLS parameter
    is "$true". • The value "ExternalAuthoritative" requires the value of the PermissionGroups parameter be set to "ExchangeServers".
  impact: ''
  references: []
  page_start: 40
  audit_raw: 'Note: AuthMechanism may include other mechanisms as long as the "Tls" is identified.

    Open the Exchange Management Shell and enter the following command:

    Get-ReceiveConnector | Select Name, Identity, AuthMechanism

    For each Receive connector, if the value of "AuthMechanism" is not set to "Tls", this is a

    finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-ReceiveConnector -Identity <''IdentityName''> -AuthMechanism ''Tls''

    Note: The <IdentityName> value must be in single quotes.

    Repeat the procedures for each Receive connector.'
  checks:
  - type: manual_review
    info: 'Note: AuthMechanism may include other mechanisms as long as the "Tls" is identified.

      Open the Exchange Management Shell and enter the following command:

      Get-ReceiveConnector | Select Name, Identity, AuthMechanism

      For each Receive connector, if the value of "AuthMechanism" is not set to "Tls", this is a

      finding.'
    severity: medium
- id: '1.23'
  title: EX16-MB-000270
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange Mailboxes must be retained until backups are complete. GROUP ID: V-228376 RULE ID: SV-228376r879642'
  rationale: Backup and recovery procedures are an important part of overall system availability and integrity. Complete backups
    reduce the chance of accidental deletion of important information and make it possible to have complete recoveries. It
    is not uncommon for users to receive and delete messages in the scope of a single backup cycle. This setting ensures at
    least one backup has been run on the mailbox store before the message physically disappears. By enabling this setting,
    all messages written to recipients who have accounts on this store will reside in backups even if they have been deleted
    by the user before the backup has run.
  impact: ''
  references: []
  page_start: 42
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-MailboxDatabase| Select Name, Identity, RetainDeletedItemsUntilBackup

    If the value of "RetainDeletedItemsUntilBackup" is not set to "True", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-MailboxDatabase -Identity <''IdentityName''> -RetainDeletedItemsUntilBackup $true

    Note: The <IdentityName> value must be in single quotes.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-MailboxDatabase| Select Name, Identity, RetainDeletedItemsUntilBackup

      If the value of "RetainDeletedItemsUntilBackup" is not set to "True", this is a finding.'
    severity: medium
