- id: '1.34'
  title: EX16-MB-000430
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Exchange global inbound message size must be controlled. GROUP ID: V-228387 RULE ID: SV-228387r879651'
  rationale: Email system availability depends in part on best practice strategies for setting tuning configurations. Message
    size limits should be set to 10 megabytes (MB) at most but often are smaller, depending on the organization. The key point
    in message size is that it should be set globally and should not be set to "unlimited". Selecting "unlimited" on "MaxReceiveSize"
    is likely to result in abuse and can contribute to excessive server disk space consumption. Message size limits may also
    be applied on SMTP connectors, Public Folders, and on the user account under Active Directory (AD). Changes at these lower
    levels are discouraged, as the single global setting is usually sufficient. This practice prevents conflicts that could
    impact availability and simplifies server administration.
  impact: ''
