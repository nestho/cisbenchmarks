    info: 'NOTE: For the purpose of this requirement, “remote” refers to those domains external to

      the DoDIN, whether classified or unclassified. NDRs between DoDIN networks is

      permitted.

      Open the Exchange Management Shell and enter the following command:

      Get-RemoteDomain | Select Name, Identity, NDREnabled

      If the value of "NDREnabled" is not set to "False", this is a finding.'
    severity: medium
- id: '1.55'
  title: EX16-MB-000660
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange Internal Send connectors must use an authentication level. GROUP ID: V-228409 RULE ID: SV-228409r879806'
  rationale: The Simple Mail Transfer Protocol (SMTP) connector is used by Exchange to send and receive messages from server
    to server. Several controls work together to provide security between internal servers. This setting controls the encryption
    method used for communications between servers. With this feature enabled, only servers capable of supporting Transport
    Layer Security (TLS) will be able to send and receive mail within the domain. The use of secure communication prevents
    eavesdroppers from reading or modifying communications between mail clients and servers. While sensitive message bodies
    should be encrypted by the sender at the client, requiring a secure connection from server to server adds protection by
    encrypting the sender and recipient information that cannot be encrypted by the sender. Individually, channel security
    and encryption can be compromised by attackers. Used together, email becomes a more difficult target, and security is
    heightened. Failure to enable this feature gives eavesdroppers an opportunity to read or modify messages between servers.
  impact: ''
  references: []
  page_start: 94
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-SendConnector | Select Name, Identity, TlsAuthLevel

    For each Send connector, if the value of "TlsAuthLevel" is not set to "DomainValidation",

    this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-SendConnector -Identity <''IdentityName''> -TlsAuthLevel DomainValidation

    Note: The <IdentityName> value must be in single quotes.

    Repeat the procedure for each Send connector.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-SendConnector | Select Name, Identity, TlsAuthLevel

      For each Send connector, if the value of "TlsAuthLevel" is not set to "DomainValidation",

      this is a finding.'
    severity: medium
- id: '1.55'
  title: EX16-MB-000650
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Exchange SMTP automated banner response must not reveal server details. GROUP ID: V-228408 RULE ID: SV-228408r879806'
  rationale: 'Automated connection responses occur as a result of FTP or Telnet connections when connecting to those services.
    They report a successful connection by greeting the connecting client and stating the name, release level, and (often)
    additional information regarding the responding product. While useful to the connecting client, connection responses can
    also be used by a third party to determine operating system or product release levels on the target server. The result
    can include disclosure of configuration information to third parties, paving the way for possible future attacks. For
    example, when querying the SMTP service on port 25, the default response looks similar to this one: 220 exchange.mydomain.org
    Microsoft ESMTP MAIL Service, Version: 6.0.3790.211 ready at Wed, 2 Feb 2005 23:40:00 -0500 Changing the response to hide
    local configuration details reduces the attack profile of the target.'
  impact: ''
  references: []
  page_start: 96
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-ReceiveConnector | Select Name, Identity, Banner

    For each Receive connector, if the value of "Banner" is not set to "220 SMTP Server

    Ready", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-ReceiveConnector -Identity <''IdentityName''> -Banner ''220 SMTP Server Ready''

    Note: The <IdentityName> and 220 SMTP Server Ready values must be in single

    quotes.

    Repeat the procedures for each Receive connector.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-ReceiveConnector | Select Name, Identity, Banner

      For each Receive connector, if the value of "Banner" is not set to "220 SMTP Server

      Ready", this is a finding.'
    severity: medium
- id: '1.57'
  title: EX16-MB-000670
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange must provide Mailbox databases in a highly available and redundant configuration. GROUP ID: V-228410
    RULE ID: SV-228410r879806'
  rationale: Exchange Server mailbox databases and any data contained in those mailboxes should be protected. This can be
    accomplished by configuring Mailbox servers and databases for high availability and site resilience. A database availability
    group (DAG) is a component of the Mailbox server high availability and site resilience framework built into Microsoft
    Exchange Server 2016. A DAG is a group of Mailbox servers that hosts a set of databases and provides automatic database-level
    recovery from failures that affect individual servers or databases. A DAG is a boundary for mailbox database replication
    and database and server switchovers and failovers. Any server in a DAG can host a copy of a mailbox database from any
    other server in the DAG. When a server is added to a DAG, it works with the other servers in the DAG to provide automatic
    recovery from failures that affect mailbox databases, such as a disk, server, or network failure.
  impact: ''
  references: []
  page_start: 98
  audit_raw: 'Review the Email Domain Security Plan (EDSP).

    Determine if the Exchange Mailbox databases are using redundancy.

    Open the Exchange Management Shell.

    Enter the following command:

    Get-DatabaseAvailabilityGroup <DAGName> | Format-List

    If the DAG is not displayed, this is a finding.'
  remediation: 'Update the EDSP to specify how Exchange Mailbox databases use redundancy.

    Access the Exchange Management Shell and add new Database Availability Groups

    based upon the EDSP using the following command:

    New-DatabaseAvailabilityGroup

    See the following documentation for options when creating a DAG:

    https://docs.microsoft.com/en-us/exchange/high-availability/manage-ha/createdags?view=exchserver-2019.'
  checks:
  - type: manual_review
    info: 'Review the Email Domain Security Plan (EDSP).

      Determine if the Exchange Mailbox databases are using redundancy.

      Open the Exchange Management Shell.

      Enter the following command:

      Get-DatabaseAvailabilityGroup <DAGName> | Format-List

      If the DAG is not displayed, this is a finding.'
    severity: medium
- id: '1.58'
  title: EX16-MB-000680
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange must have the most current, approved service pack installed. GROUP ID: V-228411 RULE ID: SV-228411r879827'
  rationale: Failure to install the most current Exchange service pack leaves a system vulnerable to exploitation. Current
    service packs correct known security and system vulnerabilities.
  impact: ''
  references: []
  page_start: 100
  audit_raw: 'Determine the most current, approved service pack.

    Open the Exchange Management Shell and enter the following command:

    Get-ExchangeServer | fl Name, AdminDisplayVersion

    If the value of "AdminDisplayVersion" does not return the most current, approved

    service pack, this is a finding.'
  remediation: Install the most current, approved service pack.
  checks:
  - type: manual_review
    info: 'Determine the most current, approved service pack.

      Open the Exchange Management Shell and enter the following command:

      Get-ExchangeServer | fl Name, AdminDisplayVersion

      If the value of "AdminDisplayVersion" does not return the most current, approved

      service pack, this is a finding.'
    severity: medium
- id: '1.59'
  title: EX16-MB-002870
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The application must be configured in accordance with the security configuration settings based on DoD security
    configuration or implementation guidance, including STIGs, NSA configuration guides, CTOs, and DTMs. GROUP ID: V-228412
    RULE ID: SV-228412r879887'
  rationale: Configuring the application to implement organization-wide security implementation guides and security checklists
    ensures compliance with Federal standards and establishes a common security baseline across DoD that reflects the most
    restrictive security posture consistent with operational requirements. Configuration settings are the set of parameters
    that can be changed that affect the security posture and/or functionality of the system. Security-related parameters are
    those parameters impacting the security state of the application, including the parameters required to satisfy other security
    control requirements.
  impact: ''
  references: []
  page_start: 101
  audit_raw: 'Open a Windows PowerShell Module and enter the following commands:

    Get-Website | Select Name

    Get-WebBinding -Name <''WebSiteName''> | Format-List

    If the Web binding values returned are not on standard port 80 for HTTP connections or

    port 443 for HTTPS connections, this is a finding.

    Note: This is excluding the Exchange Back End website which uses 81/444.

    Repeat the process for each website.'
  remediation: Configure web ports to be ports 80 and 443, as specified by PPSM standards.
  checks:
  - type: manual_review
    info: 'Open a Windows PowerShell Module and enter the following commands:

      Get-Website | Select Name

      Get-WebBinding -Name <''WebSiteName''> | Format-List

      If the Web binding values returned are not on standard port 80 for HTTP connections or

      port 443 for HTTPS connections, this is a finding.

      Note: This is excluding the Exchange Back End website which uses 81/444.

      Repeat the process for each website.'
    severity: medium
- id: '1.60'
  title: EX16-MB-002880
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The applications built-in Malware Agent must be disabled. GROUP ID: V-228413 RULE ID: SV-228413r879664'
  rationale: Malicious code protection mechanisms include but are not limited to anti-virus and malware detection software.
    To minimize potential negative impact to the organization that can be caused by malicious code, it is imperative that
    malicious code is identified and eradicated. Malicious code includes viruses, worms, trojan horses, and spyware. It is
    not enough to have the software installed; this software must periodically scan the system to search for malware on an
    organization-defined frequency. Exchange's built-in Malware Agent is not designed to address all malicious code protection
    workloads. This workload is best handled by third-party anti-virus and intrusion prevention software. Sites must use an
    approved DoD scanner. Exchange Malware software has a limited scanning capability and does not scan files that are downloaded,
    opened, or executed.
  impact: ''
  references: []
  page_start: 102
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-TransportAgent "Malware Agent"

    If the value of "Enabled" is set to "True", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    & env:ExchangeInstallPath\Scripts\Disable-Antimalwarescanning.ps1'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-TransportAgent "Malware Agent"

      If the value of "Enabled" is set to "True", this is a finding.'
    severity: medium
- id: '1.61'
  title: EX16-MB-002900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange must use encryption for RPC client access. GROUP ID: V-228415 RULE ID: SV-228415r879519'
  rationale: This setting controls whether client machines are forced to use secure channels to communicate with the server.
    If this feature is enabled, clients will only be able to communicate with the server over secure communication channels.
    Failure to require secure connections to the client access server increases the potential for unintended eavesdropping
    or data loss.
  impact: ''
  references: []
  page_start: 103
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-RpcClientAccess | Select Server, Name, EncryptionRequired

    If the value of "EncryptionRequired" is not set to "True", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-RpcClientAccess -Server <ServerName> -EncryptionRequired $true'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-RpcClientAccess | Select Server, Name, EncryptionRequired

      If the value of "EncryptionRequired" is not set to "True", this is a finding.'
    severity: medium
- id: '1.62'
  title: EX16-MB-002910
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange must use encryption for Outlook Web App (OWA) access. GROUP ID: V-228416 RULE ID: SV-228416r879519'
  rationale: This setting controls whether client machines should be forced to use secure channels to communicate with this
    virtual directory. If this feature is enabled, clients will only be able to communicate with the directory if they are
    capable of supporting secure communication with the server. The use of secure communication prevents eavesdroppers from
    reading or modifying communications between servers and clients. The network and DMZ STIG identify criteria for OWA and
    Public Folder configuration in the network, including Common Access Card (CAC)-enabled pre-authentication through an application
    firewall proxy. Failure to require secure connections on a website increases the potential for unintended eavesdropping
    or data loss.
  impact: ''
  references: []
  page_start: 104
  audit_raw: 'Open a Exchange Management Shell and enter the following command:

    Get-OwaVirtualDirectory | select internalurl, externalurl

    If the value returned is not https://, this is a finding.'
  remediation: Configure the OWA site to require SSL port 443.
  checks:
  - type: manual_review
    info: 'Open a Exchange Management Shell and enter the following command:

      Get-OwaVirtualDirectory | select internalurl, externalurl

      If the value returned is not https://, this is a finding.'
    severity: medium
- id: '1.63'
  title: EX16-MB-002920
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange must have forms-based authentication disabled. GROUP ID: V-228417 RULE ID: SV-228417r879519'
  rationale: Identification and Authentication provide the foundation for access control. Access to email services applications
    in the DoD requires authentication using DoD Public Key Infrastructure (PKI) certificates. Authentication for Outlook
    Web App (OWA) is used to enable web access to user email mailboxes and should assume that certificate-based authentication
    has been configured. This setting controls whether forms-based logon should be used by the OWA website. Because the DoD
    requires Common Access Card (CAC)-based authentication to applications, OWA access must be brokered through an application
    proxy or other preauthenticator, which performs CAC authentication prior to arrival at the CA server. The authenticated
    request is then forwarded directly to OWA, where authentication is repeated without requiring the user to repeat authentication
    steps. For this scenario to work, the Application Proxy server must have forms-based authentication enabled, and Exchange
    must have forms-based Authentication disabled. If forms-based Authentication is enabled on the Exchange CA server, it
    is evidence that the application proxy server is either not correctly configured, or it may be missing.
  impact: ''
  references: []
  page_start: 105
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-OwaVirtualDirectory | Select ServerName, Name, Identity, FormsAuthentication

    If the value of "FormsAuthentication" is not set to "False", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-OwaVirtualDirectory -Identity <''IdentityName''> -FormsAuthentication $false

    Note: <IdentityName> must be in single quotes.

    Example for the Identity Name: <ServerName>\owa (Default website)

    Restart the ISS service.'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-OwaVirtualDirectory | Select ServerName, Name, Identity, FormsAuthentication

      If the value of "FormsAuthentication" is not set to "False", this is a finding.'
    severity: medium
- id: '1.64'
  title: EX16-MB-002930
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange must have authenticated access set to Integrated Windows Authentication only. GROUP ID: V-228418
    RULE ID: SV-228418r879530'
  rationale: To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates
    by DoD-approved PKIs, all DoD systems (e.g., networks, web servers, and web portals) must be properly configured to incorporate
    access control methods that do not rely solely on the possession of a certificate for access. Successful authentication
    must not automatically give an entity access to an asset or security boundary. Authorization procedures and controls must
    be implemented to ensure each authenticated entity also has a validated and current authorization. Authorization is the
    process of determining whether an entity, once authenticated, is permitted to access a specific asset. Information systems
    use access control policies and enforcement mechanisms to implement this requirement. Access control policies include
    identity-based policies, role-based policies, and attribute-based policies. Access enforcement mechanisms include access
    control lists, access control matrices, and cryptography. These policies and mechanisms must be employed by the application
    to control access between users (or processes acting on behalf of users) and objects (e.g., devices, files, records, processes,
    programs, and domains) in the information system. This requirement is applicable to access control enforcement applications
    (e.g., authentication servers) and other applications that perform information and system access control functions.
  impact: ''
  references: []
  page_start: 107
  audit_raw: 'Open the Exchange Management Shell and enter the following command:

    Get-OwaVirtualDirectory | Select ServerName, Name, Identity,*Authentication

    If the value of "WindowsAuthentication" is not set to "True", this is a finding.'
  remediation: 'Open the Exchange Management Shell and enter the following command:

    Set-OwaVirtualDirectory -Identity ''<IdentityName>'' -WindowsAuthentication $true

    Note: The <IdentityName> value must be in single quotes.

    Example for the Identity Name: <ServerName>\owa (Default website)'
  checks:
  - type: manual_review
    info: 'Open the Exchange Management Shell and enter the following command:

      Get-OwaVirtualDirectory | Select ServerName, Name, Identity,*Authentication

      If the value of "WindowsAuthentication" is not set to "True", this is a finding.'
    severity: medium
