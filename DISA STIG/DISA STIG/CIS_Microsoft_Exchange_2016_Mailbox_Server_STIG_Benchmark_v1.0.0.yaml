  title: EX16-MB-000480
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Exchange external/Internet-bound automated response messages must be disabled. GROUP ID: V-228392 RULE ID:
    SV-228392r879653'
  rationale: Spam originators, in an effort to refine mailing lists, sometimes monitor transmissions for automated bounce-back
    messages. Automated messages include such items as "Out of Office" responses, nondelivery messages, and automated message
    forwarding. Automated bounce-back messages can be used by a third party to determine if users exist on the server. This
    can result in the disclosure of active user accounts to third parties, paving the way for possible future attacks.
