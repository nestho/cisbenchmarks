- id: '1.28'
  title: EX16-MB-000340
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Exchange Mailbox Stores must mount at startup. GROUP ID: V-228381 RULE ID: SV-228381r879650'
  rationale: Administrator responsibilities include the ability to react to unplanned maintenance tasks or emergency situations
    that may require Mailbox data manipulation. Occasionally, there may be a need to start the server with "unmounted" data
    stores if manual maintenance is being performed on them. Failure to uncheck the "do not mount on startup" condition will
    result in unavailability of mail services. Correct configuration of this control will prevent unplanned outages due to
    being enabled. When maintenance is being performed, care should be taken to clear the check box upon task completion so
    mail stores are available to users (unmounted mailbox stores are not available to users).
  impact: ''
  references: []
