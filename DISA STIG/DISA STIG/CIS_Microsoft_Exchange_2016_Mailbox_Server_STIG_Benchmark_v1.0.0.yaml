  title: EX16-MB-000460
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Exchange Outbound Connection Timeout must be 10 minutes or less. GROUP ID: V-228390 RULE ID: SV-228390r879651'
  rationale: Email system availability depends in part on best practice strategies for setting tuning configurations. This
    configuration controls the number of idle minutes before the connection is dropped. It works in conjunction with the Maximum
    Outbound Connections Count setting. Connections, once established, may incur delays in message transfer. The default of
    10 minutes is a reasonable window in which to resume activities without maintaining idle connections for excessive intervals.
    If the timeout period is too long, idle connections may be maintained for unnecessarily long time periods, preventing
    new connections from being established. Sluggish connectivity increases the risk of lost data. A value of "10" or less
    is optimal.
