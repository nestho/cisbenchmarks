  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Exchange Message size restrictions must be controlled on Receive connectors. GROUP ID: V-228382 RULE ID: SV-228382r879651'
  rationale: Email system availability depends in part on best practice strategies for setting tuning configurations. For
    message size restrictions, multiple places exist to set or override inbound or outbound message size. Failure to control
    the configuration strategy can result in loss of data or system availability. This setting enables the administrator to
    control the maximum message size on receive connectors. Using connectors to control size limits may necessitate applying
    message size limitations in multiple places, with the potential of introducing conflicts and impediments in the mail flow.
    Changing this setting at the connector overrides the global one. Therefore, if operational needs require it, the connector
    value may be set lower than the global value with the rationale documented in the Email Domain Security Plan (EDSP).
  impact: ''
  references: []
