      -w /etc/xylok.conf -p warx -k xylok_config

      If the command does not return a line, or the line is commented out, thi'
    severity: medium
- id: '1.15'
  title: XYLK-20-000191
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Xylok Security Suite must only allow the use of DOD Public Key Infrastructure (PKI) established certificate
    authorities (CAs) for verification of the establishment of protected sessions. GROUP ID: V-269584 RULE ID: SV-269584r1054096'
  rationale: Untrusted CAs can issue certificates, but they may be issued by organizations or individuals that seek to compromise
    DOD systems or by organizations with insufficient security controls. If the CA used for verifying the certificate is not
    a DOD-approved CA, trust of this CA has not been established. The DOD will only accept PKI certificates obtained from
    a DOD-approved internal or external certificate authority. Reliance on CAs for the establishment of secure sessions includes,
    for example, the use of Transport Layer Security (TLS) certificates. This requirement focuses on communications protection
    for the Xylok Security Suite session rather than for the network packet. This requirement applies to applications that
    use communications sessions. This includes, but is not limited to, web-based applications and Service-Oriented Architectures
    (SOAs).
