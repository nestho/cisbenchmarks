controls:
- id: '1.1'
  title: XYLK-20-000001
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Xylok Security Suite must limit system resources consumed by the application. GROUP ID: V-269570 RULE ID:
    SV-269570r1053485'
  rationale: 'Not limiting system resources to Xylok presents a denial-of-service (DoS) risk. Each open instance of Xylok
    periodically retrieves a list of background tasks. Open sessions, even sessions not being actively used, consume a small
    amount of server resources and could result in Xylok becoming slow or entirely responsive. In addition, this risk impacts
    the host system for the container by consuming excessive CPU, allowing a DoS attack on Xylok to also impact other software
    hosted on the same physical machine. Satisfies: SRG-APP-000001, SRG-APP-000435'
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'Determine if Xylok is configured to limit its maximum CPU and memory usage with the

    following command, run from the host machine as a normal user:

    $ grep LIMIT_ /etc/xylok.conf

    Verify the following settings are configured:

    • LIMIT_MEM set to less than 100 percent of the host machine''s memory.

    • LIMIT_CPU set to less than 1000.

    If any of the above settings are not present or are blank, this is a finding.'
  remediation: 'Configure the Xylok Security Suite to limit CPU and memory usage using this procedure

    on the host machine. As root, open /etc/xylok.conf in a text editor.

    1. Add the following settings if not present. All settings should be in the format

    "NAME=value". For example, the first required setting might appear as

    "LIMIT_MEM=4096m" in the configuration file, with no quotes.

    • LIMIT_MEM: Set to 2048m or greater, and less than 100 percent of the host

    machine''s memory.

    • LIMIT_CPU: Set to 128 or greater, not to exceed 1000. This value can range

    from 1 to 1024, where 1024 allows usage of 100 percent of the CPU.

    2. Save configuration file.

    3. Restart Xylok to apply settings:

    systemctl restart xylok'
  checks:
  - type: manual_review
    info: 'Determine if Xylok is configured to limit its maximum CPU and memory usage with the

      following command, run from the host machine as a normal user:

      $ grep LIMIT_ /etc/xylok.conf

      Verify the following settings are configured:

      • LIMIT_MEM set to less than 100 percent of the host machine''s memory.

      • LIMIT_CPU set to less than 1000.

      If any of the above settings are not present or are blank, this is a finding.'
    severity: medium
- id: '1.2'
  title: XYLK-20-000003
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Xylok Security Suite must initiate a session lock after a 15-minute period of inactivity. GROUP ID: V-269571
    RULE ID: SV-269571r1053488'
  rationale: 'A session time-out lock is a temporary action taken when a user stops work and moves away from the immediate
    physical vicinity of the information system, but does not log out because of the temporary nature of the absence. The
    session lock is implemented at the point where session activity can be determined and/or controlled. This is handled at
    the operating system-level and results in a system lock. Satisfies: SRG-APP-000003, SRG-APP-000190'
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'Verify session is configured to lock after 15 minutes of inactivity. Execute the following:

    $ grep SESSION_LENGTH /etc/xylok.conf

    SESSION_LENGTH=900

    If "SESSION_LENGTH" is set to more than15 minutes or is missing, this is a finding.

    Note: The setting is in seconds. 900 sec = 15 min.'
  remediation: 'Set the session length:

    1. As root, open /etc/xylok.conf in a text editor.

    2. Add/Amend "SESSION_LENGTH=900" to the configuration file.

    3. Restart Xylok to apply settings by executing the following:

    systemctl restart xylok'
  checks:
  - type: manual_review
    info: 'Verify session is configured to lock after 15 minutes of inactivity. Execute the following:

      $ grep SESSION_LENGTH /etc/xylok.conf

      SESSION_LENGTH=900

      If "SESSION_LENGTH" is set to more than15 minutes or is missing, this is a finding.

      Note: The setting is in seconds. 900 sec = 15 min.'
    severity: medium
- id: '1.3'
  title: XYLK-20-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Xylok Security Suite must expire a session upon browser closing. GROUP ID: V-269572 RULE ID: SV-269572r1053491'
  rationale: 'When the session expires as soon as the browser is closed, it prevents session hijacking and unauthorized users
    from accessing the account or data if they reopen the browser. Leaving a session open in the browser even after it is
    closed could expose the system to various types of attacks, like cross-site scripting (XSS) or malware designed to steal
    session cookies. Automatically expiring sessions mitigates this risk. Satisfies: SRG-APP-000005, SRG-APP-000220, SRG-APP-000295,
    SRG-APP-000413'
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Verify session expires after browser is closed. Execute the following:

    $ grep SESSION_EXPIRE_AT_BROWSER_CLOSE /etc/xylok.conf

    SESSION_EXPIRE_AT_BROWSER_CLOSE=True

    If "SESSION_EXPIRE_AT_BROWSER_CLOSE" is not set to "True" or is missing, this

    is a finding.'
  remediation: 'Set the session expiration:

    1. As root, open /etc/xylok.conf in a text editor.

    2. Add/Amend "SESSION_EXPIRE_AT_BROWSER_CLOSE=True" to the

    configuration file.

    3. Restart Xylok to apply settings by executing the following:

    systemctl restart xylok'
  checks:
  - type: manual_review
    info: 'Verify session expires after browser is closed. Execute the following:

      $ grep SESSION_EXPIRE_AT_BROWSER_CLOSE /etc/xylok.conf

      SESSION_EXPIRE_AT_BROWSER_CLOSE=True

      If "SESSION_EXPIRE_AT_BROWSER_CLOSE" is not set to "True" or is missing, this

      is a finding.'
    severity: medium
- id: '1.4'
  title: XYLK-20-000006
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Xylok Security Suite must prevent access except through HTTPS. GROUP ID: V-269573 RULE ID: SV-269573r1054093'
  rationale: 'Preventing access, except via HTTPS, ensures security and protects sensitive data. HTTP_ONLY: If true, disables
    listening on the HTTPS port and allows all calls to happen over HTTP. This must be set to false. HTTPS encrypts data transmitted
    between the client (browser) and the server. Sensitive information, such as login credentials, personal data, and session
    cookies, is protected from being intercepted by malicious actors (e.g., through man-in-the-middle attacks) during transmission.
    When data is sent over HTTP (unencrypted), it can be intercepted and altered. HTTPS mitigates this by encrypting the communication.
    HTTPS uses digital certificates (SSL/TLS certificates) to authenticate the server’s identity. This ensures that users
    are connecting to the legitimate server rather than a malicious entity attempting to impersonate the site. HTTPS-only
    policies enable the use of HSTS, which forces browsers to only interact with the site using HTTPS and prevents users from
    being redirected to an HTTP version of the site. This can defend against certain attacks, like SSL stripping, which downgrade
    connections to HTTP. Satisfies: SRG-APP-000014, SRG-APP-000142, SRG-APP-000219, SRG-APP-000411, SRG-APP-000412, SRG-APP-000439,
    SRG-APP-000440, SRG-APP-000442, SRGAPP-000514, SRG-APP-000555, SRG-APP-000645'
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'Verify HTTP_ONLY is set to "false":

    $ grep HTTP_ONLY

    /etc/xylok.conf HTTP_ONLY=false

    If "HTTP_ONLY=true" or is not configured, this is a finding.'
  remediation: 'Add/Amend HTTP_ONLY to the configuration files:

    1. As root, open /etc/xylok.conf in a text editor.

    2. Add/Amend the following to the configuration file:

    HTTP_ONLY=false

    3. Restart Xylok to apply settings by executing the following:

    systemctl restart xylok'
  checks:
  - type: manual_review
    info: 'Verify HTTP_ONLY is set to "false":

      $ grep HTTP_ONLY

      /etc/xylok.conf HTTP_ONLY=false

      If "HTTP_ONLY=true" or is not configured, this is a finding.'
    severity: medium
- id: '1.5'
  title: XYLK-20-000009
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Xylok Security Suite must use a centralized user management solution. GROUP ID: V-269574 RULE ID: SV-269574r1053497'
  rationale: 'Configuring Xylok Security Suite to integrate with an Enterprise Identity Provider enhances security, simplifies
    user management, ensures compliance, provides auditing capabilities, and offers a more seamless and consistent user experience.
    It aligns Xylok Security Suite with enterprise standards and contributes to a more efficient and secure environment. Satisfies:
    SRG-APP-000023, SRG-APP-000025, SRG-APP-000026, SRG-APP-000027, SRG-APP-000028, SRG-APP-000029, SRG-APP-000033, SRG-APP-000065,
    SRGAPP-000080, SRG-APP-000089, SRG-APP-000090, SRG-APP-000149, SRG-APP000150, SRG-APP-000153, SRG-APP-000154, SRG-APP-000155,
    SRG-APP-000156, SRG-APP-000157, SRG-APP-000163, SRG-APP-000164, SRG-APP-000165, SRGAPP-000166, SRG-APP-000167, SRG-APP-000168,
    SRG-APP-000169, SRG-APP000170, SRG-APP-000173, SRG-APP-000175, SRG-APP-000176, SRG-APP-000177, SRG-APP-000180, SRG-APP-000185,
    SRG-APP-000291, SRG-APP-000292, SRGAPP-000293, SRG-APP-000294, SRG-APP-000318, SRG-APP-000319, SRG-APP000320, SRG-APP-000345,
    SRG-APP-000391, SRG-APP-000392, SRG-APP-000401, SRG-APP-000402, SRG-APP-000403, SRG-APP-000404, SRG-APP-000405, SRGAPP-000503,
    SRG-APP-000505, SRG-APP-000506, SRG-APP-000508, SRG-APP000700, SRG-APP-000705, SRG-APP-000710, SRG-APP-000815, SRG-APP-000820,
    SRG-APP-000825, SRG-APP-000830, SRG-APP-000835, SRG-APP-000840, SRGAPP-000845, SRG-APP-000850, SRG-APP-000855, SRG-APP-000860,
    SRG-APP000865, SRG-APP-000870, SRG-APP-000875, SRG-APP-000910'
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'Determine if Xylok is configured to use Active Directory (AD) authentication with the

    following command, run from the host machine as a normal user:

    $ grep -e "AD_SIGN_IN" -e "XYLOK_HOST" -e "AD_CLIENT_ID" /etc/xylok.conf

    Verify the following settings are present:

    • AD_SIGN_IN

    • XYLOK_HOST

    • AD_CLIENT_ID

    If any of the above settings are not present, blank, or "false" (case insensitive), this is a

    finding.'
  remediation: 'The below procedure assumes an AD server hosted on Windows Server. For AD login

    using Azure AD, refer to the current Xylok Security Suite manual. Additional advice for

    AD configuration can also be found in the Xylok manual.

    Configure the Xylok Security Suite to use Active Directory login using this procedure on

    the host machine:

    1. As root, open /etc/xylok.conf in a text editor.

    2. Add the following settings if not present. All settings should be in the format

    "NAME=value". For example, the first required setting will appear as

    "AD_SIGN_IN=True" in the configuration file, with no quotes.

    • AD_SIGN_IN: use the value "True"

    • XYLOK_HOST: set to domain name used to access server on network

    • AD_CLIENT_ID: This is the value displayed on the ADFS server as ClientId

    when executing the Add-AdfsClient command

    • AD_SERVER: The fully qualified domain name (FQDN) of the ADFS server

    • AD_AUDIENCE: Set this to the value of the aud claim your ADFS server sends

    back in the JWT token. If this is a URL, it will be the same as the

    RELYING_PARTY_ID .

    • AD_RELYING_PARTY_ID: Set this to the Relying Party Trust identifier value of

    the Relying Party Trust (2012) or Web application (2016) configured in ADFS.

    3. Save the configuration file.

    4. Restart Xylok to apply settings:

    systemctl restart xylok

    5. In a web browser on a system with access to Xylok, go to https:///oauth2/login. If

    SSO is configured correctly, it will redirect to the organization''s sign-on page.'
  checks:
  - type: manual_review
    info: 'Determine if Xylok is configured to use Active Directory (AD) authentication with the

      following command, run from the host machine as a normal user:

      $ grep -e "AD_SIGN_IN" -e "XYLOK_HOST" -e "AD_CLIENT_ID" /etc/xylok.conf

      Verify the following settings are present:

      • AD_SIGN_IN

      • XYLOK_HOST

      • AD_CLIENT_ID

      If any of the above settings are not present, blank, or "false" (case insensitive), this is a

      finding.'
    severity: medium
- id: '1.6'
  title: XYLK-20-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Xylok Security Suite must display the Standard Mandatory DOD Notice and Consent Banner before granting access.
    GROUP ID: V-269575 RULE ID: SV-269575r1054094'
  rationale: 'Users accessing Xylok must be informed their actions might be monitored, potentially opening the organization
    up to legal challenges. Implementing a Consent Banner helps Xylok Security Suite remain compliant with legal requirements
    and protect user privacy while informing users of their rights regarding their data. Satisfies: SRG-APP-000068, SRG-APP-000069'
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'Verify the Standard Mandatory DOD Notice and Consent Banner has been configured:

    $ grep BANNER /etc/xylok.conf

    If the Standard Mandatory DOD Notice and Consent Banner is not displayed, this is a

    finding.'
  remediation: 'Add banner to the configuration files:

    1. As root, open /etc/xylok.conf in a text editor.

    2. Add/Amend the following to the configuration file:

    BANNER=You are accessing a U.S. Government (USG) Information System (IS)

    that is provided for USG-authorized use only.\nBy using this IS (which includes

    any device attached to this IS), you consent to the following conditions:\n-The

    USG routinely intercepts and monitors communications on this IS for purposes

    including, but not limited to, penetration testing, COMSEC monitoring, network

    operations and defense, personnel misconduct (PM), law enforcement (LE), and

    counterintelligence (CI) investigations.\n\n- At any time, the USG may inspect

    and seize data stored on this IS.\n\n- Communications using, or data stored on,

    this IS are not private, are subject to routine monitoring, interception, and search,

    and may be disclosed or used for any USG-authorized purpose.\n\n- This IS

    includes security measures (e.g., authentication and access controls) to protect

    USG interests—not for your personal benefit or privacy.\n\n- Notwithstanding the

    above, using this IS does not constitute consent to PM, LE or CI investigative

    searching or monitoring of the content of privileged communications, or work

    product, related to personal representation or services by attorneys,

    psychotherapists, or clergy, and their assistants. Such communications and work

    product are private and confidential. See User Agreement for details.

    3. Restart Xylok to apply settings by executing the following:

    systemctl restart xylok'
  checks:
  - type: manual_review
    info: 'Verify the Standard Mandatory DOD Notice and Consent Banner has been configured:

      $ grep BANNER /etc/xylok.conf

      If the Standard Mandatory DOD Notice and Consent Banner is not displayed, this is a

      finding.'
    severity: medium
- id: '1.7'
  title: XYLK-20-000043
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Xylok Security Suite must protect audit information from any type of unauthorized access. GROUP ID: V-269576
    RULE ID: SV-269576r1053503'
  rationale: 'If audit data were to become compromised, then competent forensic analysis and discovery of the true source
    of potentially malicious system activity is difficult if not impossible to achieve. In addition, access to audit records
    provides information an attacker could potentially use to their advantage. To ensure the veracity of audit data, the information
    system and/or the Xylok Security Suite must protect audit information from any and all unauthorized access. This includes
    read, write, and copy access. Satisfies: SRG-APP-000118, SRG-APP-000119, SRG-APP-000120, SRG-APP-000121, SRG-APP-000122,
    SRG-APP-000123'
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'Check the Xylok log file directory permissions with the following command:

    $ ls -l /var/log/xylok

    If any of the directories have permissions greater than "0770", this is a finding.'
  remediation: 'As root, remove all global permissions for Xylok''s log files by running:

    chmod -R 0770 /var/log/xylok/'
  checks:
  - type: manual_review
    info: 'Check the Xylok log file directory permissions with the following command:

      $ ls -l /var/log/xylok

      If any of the directories have permissions greater than "0770", this is a finding.'
    severity: medium
- id: '1.8'
  title: XYLK-20-000051
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Xylok Security Suite must be running a supported version. GROUP ID: V-269577 RULE ID: SV-269577r1053506'
  rationale: 'It is critical to the security and stability of Xylok to ensure that updates and patches are deployed through
    a trusted software supply chain. Key elements to having a trusted supply chain include ensuring that versions deployed
    come from known, trusted sources. Additionally, it is important to check for and apply security-relevant updates in a
    timely manner. To help users manage updates, Xylok manages versions via their internal portal. Satisfies: SRG-APP-000131,
    SRG-APP-000456'
  impact: ''
  references: []
  page_start: 34
  audit_raw: 'Verify the latest install is being used.

    Log on to the GUI and locate the version from the lower left corner.

    Compare this version with the latest release on the Xylok portal

    (https://downloads.xylok.io).

    If the current version is not the latest version from the Xylok portal, this is a finding.'
  remediation: 'Update Xylok Security Suite to the latest version.

    Follow the instructions found here: https://app.xylok.io/docs/01-serveradmin/installation/updating/.'
  checks:
  - type: manual_review
    info: 'Verify the latest install is being used.

      Log on to the GUI and locate the version from the lower left corner.

      Compare this version with the latest release on the Xylok portal

      (https://downloads.xylok.io).

      If the current version is not the latest version from the Xylok portal, this is a finding.'
    severity: medium
- id: '1.9'
  title: XYLK-20-000052
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Xylok Security Suite READONLY configuration must be True. GROUP ID: V-269578 RULE ID: SV-269578r1054098'
  rationale: By default, the Xylok container is created not allowing users to modify any files inside the container. The only
    paths that can be altered are mounted from the host. Mount the database files from the host, so that the database server
    running inside the container can write data. If READONLY=false, then a user could go into the container as root and change
    other files. This approach helps protect the application from both external attacks and internal threats.
  impact: ''
  references: []
  page_start: 36
  audit_raw: 'Verify that Xylok''s default read-only status is disabled by using the following command:

    $ grep READONLY /etc/xylok.conf

    If "READONLY" is set to False (case insensitive), is commented out or is missing, this is

    not a finding.'
  remediation: 'Revert Xylok to its default read-only configuration:

    1. As root, open /etc/xylok.conf in a text editor.

    2. Add/Amend "READONLY=True" to the configuration file.

    3. Restart Xylok to apply settings:

    systemctl restart xylok'
  checks:
  - type: manual_review
    info: 'Verify that Xylok''s default read-only status is disabled by using the following command:

      $ grep READONLY /etc/xylok.conf

      If "READONLY" is set to False (case insensitive), is commented out or is missing, this is

      not a finding.'
    severity: medium
- id: '1.10'
  title: XYLK-20-000053
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Xylok Security Suite must disable nonessential capabilities. GROUP ID: V-269579 RULE ID: SV-269579r1053512'
  rationale: 'If Xylok has unnecessary functionality enabled, the server may allow arbitrary code to run within the Xylok
    container. This would allow the user to potentially launch malicious acts against other hosts from inside the Xylok container.
    ENABLE_PP_TEST_API setting in the Xylok Security Suite refers to a configuration flag that enables a specific test API
    related to the policy processing (PP) functionalities of the suite. This setting is used primarily in development or testing
    environments to enable specific testing functionalities. Satisfies: SRG-APP-000141, SRG-APP-000246, SRG-APP-000247, SRG-APP-000384'
  impact: ''
  references: []
  page_start: 38
  audit_raw: 'Verify that Xylok''s default ENABLE_PP_TEST_API status is disabled by using the

    following command:

    $ grep ENABLE_PP_TEST_API /etc/xylok.conf

    If "ENABLE_PP_TEST_API" exists (case insensitive), this is a finding.'
  remediation: 'Revert Xylok to its default configuration, which disables the post-processing test API:

    1. As root, open /etc/xylok.conf in a text editor.

    2. Delete any ENABLE_PP_TEST_API lines from configuration file.

    3. Restart Xylok to apply settings:

    systemctl restart xylok'
  checks:
  - type: manual_review
    info: 'Verify that Xylok''s default ENABLE_PP_TEST_API status is disabled by using the

      following command:

      $ grep ENABLE_PP_TEST_API /etc/xylok.conf

      If "ENABLE_PP_TEST_API" exists (case insensitive), this is a finding.'
    severity: medium
- id: '1.11'
  title: XYLK-20-000109
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Xylok Security Suite configuration for DEBUG must be False. GROUP ID: V-269580 RULE ID: SV-269580r1053515'
  rationale: Providing too much information in error messages risks compromising the data and security of the Xylok Security
    Suite and system. If DEBUG is set to True, it will show stack traces in error messages to assist with contact Xylok Support,
    but potentially reveal secure information.
  impact: ''
  references: []
  page_start: 40
  audit_raw: 'Verify DEBUG is configured. Execute the following:

    $ grep DEBUG /etc/xylok.conf

    DEBUG=False

    If "DEBUG" is not set to False or is missing, this is a finding.'
  remediation: 'Set DEBUG:

    1. As root, open /etc/xylok.conf in a text editor.

    2. Add/Amend "DEBUG=False" to the configuration file.

    3. Restart Xylok to apply settings by executing the following:

    systemctl restart xylok'
  checks:
  - type: manual_review
    info: 'Verify DEBUG is configured. Execute the following:

      $ grep DEBUG /etc/xylok.conf

      DEBUG=False

      If "DEBUG" is not set to False or is missing, this is a finding.'
    severity: medium
- id: '1.12'
  title: XYLK-20-000137
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Xylok Security Suite must not allow local user or groups. GROUP ID: V-269581 RULE ID: SV-269581r1054095'
  rationale: 'Active Directory’s (AD''s) design to create but not delete local groups supports operational efficiency, system
    integrity, and compliance needs. Manual checks will help identify user accounts that are no longer active or orphaned
    accounts which could pose security risks. Within Xylok there must not be a local users/groups. Manually verifying local
    users and groups ensures that unauthorized users do not gain access to sensitive resources. Satisfies: SRG-APP-000328,
    SRG-APP-000715, SRG-APP-000720, SRG-APP-000725, SRG-APP-000730, SRG-APP-000735'
  impact: ''
  references: []
  page_start: 42
  audit_raw: 'Verify the local accounts and groups are associated with AD and that user privileges are

    correct. Check accounts as a logged in administrator in Xylok.

    1. Verify there are no local users. Navigate to User Menu >> Database Admin >>

    Users.

    If any local user(s) exist or users(s) are not current in AD, this is a finding.

    If any users have privileged access that do not require that access, this is a

    finding.

    2. Verify there are no removed or local groups. Navigate to User Menu >>

    Database Admin >> Groups .

    Verify the only groups exist are created by AD and are currently being used by

    AD.

    If any groups exist that are not actively being used by AD, this is a finding.'
  remediation: 'Delete unused or local groups/users.

    1. As a logged in administrator in Xylok, navigate to User Menu >> Database Admin

    >> Users.

    2. Select User(s) to delete.

    3. Click on down arrow in "Action".

    4. Select "Delete selected users"

    5. Click "Go".

    6. Click "Yes, I''m sure".

    7. Delete Group.

    8. As a logged in administrator in Xylok, navigate to User Menu >> Database Admin

    >> Groups.

    9. Select Group(s) to delete.

    10. Click on down arrow in "Action".

    11. Select "Delete selected users".

    12. Click "Go".

    13. Click "Yes, I''m sure".'
  checks:
  - type: manual_review
    info: 'Verify the local accounts and groups are associated with AD and that user privileges are

      correct. Check accounts as a logged in administrator in Xylok.

      1. Verify there are no local users. Navigate to User Menu >> Database Admin >>

      Users.

      If any local user(s) exist or users(s) are not current in AD, this is a finding.

      If any users have privileged access that do not require that access, this is a

      finding.

