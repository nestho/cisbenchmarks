- id: '1.12'
  title: VCPG-80-000051
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter PostgreSQL service must write log entries to disk prior to returning operation success or failure.
    GROUP ID: V-259179 RULE ID: SV-259179r961125'
  rationale: Failure to a known secure state helps prevent a loss of confidentiality, integrity, or availability in the event
    of a failure of the information system or a component of the system. Preserving system state information helps to facilitate
    system restart and return to the operational mode of the organization with less disruption of mission/business processes.
    Aggregating log writes saves on performance but leaves a window for log data loss. The logging system inside PostgreSQL
    is capable of writing logs to disk, fully and completely before the associated operation is returned to the client. This
    ensures that database activity is always captured, even in the event of a system crash during or immediately after a given
    operation.
  impact: ''
  references: []
  page_start: 34
  audit_raw: 'At the command prompt, run the following command:

    /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SELECT name,setting

    FROM pg_settings WHERE name IN (''fsync'',''full_page_writes'',''synchronous_commit'');"

    Expected result:

    fsync | on full_page_writes | on synchronous_commit | on

    If the output does not match the expected result, this is a finding.'
  remediation: 'A script is included with vCenter to generate a PostgreSQL STIG configuration.

