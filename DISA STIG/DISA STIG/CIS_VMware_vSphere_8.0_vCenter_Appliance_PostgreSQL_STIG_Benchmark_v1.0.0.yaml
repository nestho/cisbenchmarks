benchmark:
  id: cis-vmware-vsphere-8-0-vcenter-appliance-postgresql-stig-benchmark
  title: CIS VMware vSphere 8.0 vCenter Appliance PostgreSQL STIG Benchmark
  version: 1.0.0
  technology: DISA STIG
  category: DISA STIG
  os: DISA STIG
  source_pdf: CIS_VMware_vSphere_8.0_vCenter_Appliance_PostgreSQL_STIG_Benchmark_v1.0.0.pdf
  total_pages: 51
  controls_count: 18
controls:
- id: '1.1'
  title: VCPG-80-000001
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter PostgreSQL service must limit the number of concurrent sessions. GROUP ID: V-259166 RULE ID: SV-259166r960735'
  rationale: Database management includes the ability to control the number of users and user sessions utilizing a database
    management system (DBMS). Unlimited concurrent connections to the DBMS could allow a successful denial-of-service (DoS)
    attack by exhausting connection resources, and a system can also fail or be degraded by an overload of legitimate users.
    Limiting the number of concurrent sessions per user is helpful in reducing these risks. VMware Postgres as deployed on
    the vCenter Service Appliance (VCSA) comes preconfigured with a "max_connections" limit that is appropriate for all tested,
    supported scenarios. The out-of-the-box configuration is dynamic, based on a lower limit plus allowances for the resources
    assigned to VCSA and the deployment size. However, this number will always be between 100 and 1000 (inclusive).
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'At the command prompt, run the following command:

    /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW max_connections;"

    If the returned number is not greater than or equal to 100 and less than or equal to

    1000, this is a finding.'
  remediation: 'At the command prompt, run the following command:

    vmon-cli --restart vmware-vpostgres

    Note: Restarting the service runs the "pg_tuning" script that will configure

    "max_connections" to the appropriate value based on the allocated memory for

    vCenter.'
  checks:
  - type: sql
    command: SHOW max_connections;
    severity: medium
    info: 'At the command prompt, run the following command:

      /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW max_connections;"

      If the returned number is not greater than or equal to 100 and less than or equal to

      1000, this is a finding.'
- id: '1.2'
  title: VCPG-80-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter PostgreSQL service must enable "pgaudit" to provide audit record generation capabilities. GROUP
    ID: V-259167 RULE ID: SV-259167r960879'
  rationale: 'Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate
    the events relating to an incident or identify those responsible for one. Audit records can be generated from various
    components within the database management system (DBMS) (e.g., process, module). Certain specific application functionalities
    may be audited as well. The list of audited events is the set of events for which audits are to be generated. This set
    of events is typically a subset of the list of all events for which the system is capable of generating audit records.
    DOD has defined the list of events for which the DBMS will provide an audit record generation capability as the following:
    (i) Successful and unsuccessful attempts to access, modify, or delete privileges, security objects, security levels, or
    categories of information (e.g., classification levels); (ii) Access actions, such as successful and unsuccessful logon
    attempts, privileged activities, or other system-level access, starting and ending time for user access to the system,
    concurrent logons from different workstations, successful and unsuccessful accesses to objects, all program initiations,
    and all direct access to the information system; and (iii) All account creation, modification, disabling, and termination
    actions. Organizations may define additional events requiring continuous or ad hoc auditing.'
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'At the command prompt, run the following command:

    /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW

    shared_preload_libraries;"

    Example result:

    health_status_worker,pg_stat_statements,pgaudit

    If the output from the command does not include pgaudit, this is a finding.'
  remediation: 'A script is included with vCenter to generate a PostgreSQL STIG configuration.

    At the command prompt, run the following commands:

    chmod +x /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py

    /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py --action

    stig_enable --pg-data-dir /storage/db/vpostgres chmod -x

    /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py

    Restart the PostgreSQL service by running the following command:

    vmon-cli --restart vmware-vpostgres'
  checks:
  - type: sql
    command: 'SHOW

      shared_preload_libraries;'
    severity: medium
    info: 'At the command prompt, run the following command:

      /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW

      shared_preload_libraries;"

      Example result:

      health_status_worker,pg_stat_statements,pgaudit

      If the output from the command does not include pgaudit, this is a finding.'
- id: '1.3'
  title: VCPG-80-000006
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter PostgreSQL service configuration files must not be accessible by unauthorized users. GROUP ID:
    V-259168 RULE ID: SV-259168r960882'
  rationale: 'Without the capability to restrict which roles and individuals can select which events are audited, unauthorized
    personnel may be able to prevent or interfere with the auditing of critical events. Suppression of auditing could permit
    an adversary to evade detection. Misconfigured audits can degrade the system''s performance by overwhelming the audit
    log. Misconfigured audits may also make it more difficult to establish, correlate, and investigate the events relating
    to an incident or identify those responsible for one. Satisfies: SRG-APP-000090-DB-000065, SRG-APP-000121-DB-000202, SRG-APP000122-DB-000203,
    SRG-APP-000123-DB-000204, SRG-APP-000380-DB-000360'
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'At the command prompt, run the following command:

    find /storage/db/vpostgres/conf -xdev -type f -a ''('' -not -perm 600 -o -not -user vpostgres

    -o -not -group vpgmongrp '')'' -exec ls -ld {} ;

    If any files are returned, this is a finding.'
  remediation: 'At the command prompt, run the following commands:

    chmod 600 chown vpostgres:vpgmongrp

    Note: Replace with the file that has incorrect permissions.'
  checks:
  - type: command
    command: find /storage/db/vpostgres/conf -xdev -type f -a '(' -not -perm 600 -o -not -user vpostgres
    expected: ''
    severity: medium
    info: 'At the command prompt, run the following command:

      find /storage/db/vpostgres/conf -xdev -type f -a ''('' -not -perm 600 -o -not -user vpostgres

      -o -not -group vpgmongrp '')'' -exec ls -ld {} ;

      If any files are returned, this is a finding.'
- id: '1.4'
  title: VCPG-80-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter PostgreSQL service must produce logs containing sufficient information to establish what type
    of events occurred. GROUP ID: V-259171 RULE ID: SV-259171r960891'
  rationale: 'Information system auditing capability is critical for accurate forensic analysis. Without establishing what
    type of event occurred, it would be difficult to establish, correlate, and investigate the events relating to an incident
    or identify those responsible for one. Audit record content that may be necessary to satisfy the requirement of this policy
    includes, for example, time stamps, user/process identifiers, event descriptions, success/fail indications, filenames
    involved, and access control or flow control rules invoked. Associating event types with detected events in the application
    and audit logs provides a means of investigating an attack; recognizing resource utilization or capacity thresholds; or
    identifying an improperly configured application. Database software is capable of a range of actions on data stored within
    the database. It is important, for accurate forensic analysis, to know exactly what actions were performed. This requires
    specific information regarding the event type an audit record is referring to. If event type information is not recorded
    and stored with the audit record, the record itself is of very limited use. Satisfies: SRG-APP-000095-DB-000039, SRG-APP-000096-DB-000040,
    SRG-APP000097-DB-000041, SRG-APP-000098-DB-000042, SRG-APP-000099-DB-000043, SRG-APP-000100-DB-000201, SRG-APP-000101-DB-000044,
    SRG-APP-000375-DB000323'
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'At the command prompt, run the following command:

    /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW log_line_prefix;"

    Expected result:

    %m %c %x %d %u %r %p %l

    If the output does not include each option in the expected result, this is a finding.'
  remediation: 'A script is included with vCenter to generate a PostgreSQL STIG configuration.

    At the command prompt, run the following commands:

    chmod +x /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py

    /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py --action

    stig_enable --pg-data-dir /storage/db/vpostgres chmod -x

    /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py

    Restart the PostgreSQL service by running the following command:

    vmon-cli --restart vmware-vpostgres'
  checks:
  - type: sql
    command: SHOW log_line_prefix;
    severity: medium
    info: 'At the command prompt, run the following command:

      /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW log_line_prefix;"

      Expected result:

      %m %c %x %d %u %r %p %l

      If the output does not include each option in the expected result, this is a finding.'
- id: '1.5'
  title: VCPG-80-000007
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter PostgreSQL service must generate audit records. GROUP ID: V-259169 RULE ID: SV-259169r1067578'
  rationale: 'Under some circumstances, it may be useful to monitor who/what is reading privilege/permission/role information.
    Therefore, it must be possible to configure auditing to do this. Database management systems (DBMS) typically make such
    information available through views or functions. This requirement addresses explicit requests for privilege/permission/role
    membership information. It does not refer to the implicit retrieval of privileges/permissions/role memberships that PostgreSQL
    continually performs to determine if any and every action on the database is permitted. Satisfies: SRG-APP-000091-DB-000066,
    SRG-APP-000091-DB-000325, SRG-APP000492-DB-000332, SRG-APP-000492-DB-000333, SRG-APP-000495-DB-000326, SRG-APP-000495-DB-000327,
    SRG-APP-000495-DB-000328, SRG-APP-000495-DB000329, SRG-APP-000496-DB-000334, SRG-APP-000496-DB-000335, SRG-APP000499-DB-000330,
    SRG-APP-000499-DB-000331, SRG-APP-000501-DB-000336, SRG-APP-000501-DB-000337, SRG-APP-000504-DB-000354, SRG-APP-000504-DB000355,
    SRG-APP-000507-DB-000356, SRG-APP-000507-DB-000357'
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'At the command prompt, run the following commands:

    /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW pgaudit.log;"

    If the "pgaudit.log" setting is not configured to "all, -misc, -read", this is a finding.'
  remediation: 'A script is included with vCenter to generate a PostgreSQL STIG configuration.

    At the command prompt, run the following commands:

    chmod +x /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py

    /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py --action

    stig_enable --pg-data-dir /storage/db/vpostgres chmod -x

    /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py

    Note: If this has already been run previously it does not need to be run again.

    Navigate to and edit the /storage/db/vpostgres/stig.conf file.

    Add or update the following settings:

    pgaudit.log = ''all, -misc, -read'' pgaudit.log_catalog = off pgaudit.log_parameter = off

    pgaudit.log_relation = off pgaudit.log_statement = off

    Remove the following settings:

    pgaudit.log_level = log

    Restart the PostgreSQL service by running the following command:

    vmon-cli --restart vmware-vpostgres'
  checks:
  - type: sql
    command: SHOW pgaudit.log;
    severity: medium
    info: 'At the command prompt, run the following commands:

      /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW pgaudit.log;"

      If the "pgaudit.log" setting is not configured to "all, -misc, -read", this is a finding.'
- id: '1.6'
  title: VCPG-80-000009
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter PostgreSQL service must initiate session auditing upon startup. GROUP ID: V-259170 RULE ID: SV-259170r960888'
  rationale: Session auditing is for use when a user's activities are under investigation. To be sure of capturing all activity
    during those periods when session auditing is in use, it needs to be in operation for the whole time the database management
    system (DBMS) is running.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'At the command prompt, run the following command:

    /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW log_destination;"

    Example result:

    stderr

    If "log_destination" is not set to "stderr" or "syslog", this is a finding.'
  remediation: 'A script is included with vCenter to generate a PostgreSQL STIG configuration.

    At the command prompt, run the following commands:

    chmod +x /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py

    /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py --action

    stig_enable --pg-data-dir /storage/db/vpostgres chmod -x

    /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py

    Restart the PostgreSQL service by running the following command:

    vmon-cli --restart vmware-vpostgres'
  checks:
  - type: sql
    command: SHOW log_destination;
    severity: medium
    info: 'At the command prompt, run the following command:

      /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW log_destination;"

      Example result:

      stderr

      If "log_destination" is not set to "stderr" or "syslog", this is a finding.'
- id: '1.7'
  title: VCPG-80-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter PostgreSQL service must be configured to protect log files from unauthorized access. GROUP ID:
    V-259172 RULE ID: SV-259172r960930'
  rationale: 'If audit data were to become compromised, then competent forensic analysis and discovery of the true source
    of potentially malicious system activity is difficult, if not impossible, to achieve. In addition, access to audit records
    provides information an attacker could potentially use to his or her advantage. To ensure the veracity of audit data,
    the information system and/or the application must protect audit information from any and all unauthorized access. This
    includes read, write, copy, etc. Satisfies: SRG-APP-000118-DB-000059, SRG-APP-000119-DB-000060, SRG-APP000120-DB-000061'
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'Verify the default log file permissions and permissions on existing log files.

    At the command prompt, run the following command:

    /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW log_file_mode;"

    Expected result:

    0600

    If "log_file_mode" is not set to "0600", this is a finding.

    At the command prompt, run the following command:

    find /var/log/vmware/vpostgres/* -xdev -type f -a ''('' -not -perm 600 -o -not -user

    vpostgres -o -not -group vpgmongrp '')'' -exec ls -ld {} ;

    If any files are returned, this is a finding.'
  remediation: 'A script is included with vCenter to generate a PostgreSQL STIG configuration.

    At the command prompt, run the following commands:

    chmod +x /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py

    /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py --action

    stig_enable --pg-data-dir /storage/db/vpostgres chmod -x

    /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py

    Restart the PostgreSQL service by running the following command:

    vmon-cli --restart vmware-vpostgres

    At the command prompt, run the following commands:

    chmod 600 chown vpostgres:vpgmongrp

    Note: Replace with the file that has incorrect permissions.'
  checks:
  - type: command
    command: find /var/log/vmware/vpostgres/* -xdev -type f -a '(' -not -perm 600 -o -not -user
    expected: ''
    severity: medium
    info: 'Verify the default log file permissions and permissions on existing log files.

      At the command prompt, run the following command:

      /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW log_file_mode;"

      Expected result:

      0600

      If "log_file_mode" is not set to "0600", this is a finding.

      At the command prompt, run the following command:

      find /var/log/vmware/vpostgres/* -xdev -type f -a ''('' -no'
- id: '1.8'
  title: VCPG-80-000032
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter PostgreSQL service must not load unused database components, software, and database objects. GROUP
    ID: V-259173 RULE ID: SV-259173r960963'
  rationale: 'Information systems are capable of providing a wide variety of functions and services. Some of the functions
    and services, provided by default, may not be necessary to support essential organizational operations (e.g., key missions,
    functions). It is detrimental for software products to provide, or install by default, functionality exceeding requirements
    or mission objectives. Database management systems (DBMS) must adhere to the principles of least functionality by providing
    only essential capabilities. Satisfies: SRG-APP-000141-DB-000091, SRG-APP-000141-DB-000093'
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'At the command prompt, run the following command:

    /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "select * from pg_extension

    where extname != ''plpgsql''"

    If any extensions are output, this is a finding.'
  remediation: 'At the command prompt, run the following command:

    $ /opt/vmware/vpostgres/current/bin/psql -U postgres -c "DROP EXTENSION

    <extension name>"

    Note: It is recommended that plpgsql not be removed.'
  checks:
  - type: sql
    command: select * from pg_extension
    severity: medium
    info: 'At the command prompt, run the following command:

      /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "select * from pg_extension

      where extname != ''plpgsql''"

      If any extensions are output, this is a finding.'
- id: '1.9'
  title: VCPG-80-000035
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter PostgreSQL service must be configured to use an authorized port. GROUP ID: V-259174 RULE ID: SV-259174r1043177'
  rationale: 'In order to prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized
    tunneling (i.e., embedding of data types within data types), organizations must disable or restrict unused or unnecessary
    physical and logical ports/protocols/services on information systems. Applications are capable of providing a wide variety
    of functions and services. Some of the functions and services provided by default may not be necessary to support essential
    organizational operations. Additionally, it is sometimes convenient to provide multiple services from a single component
    (e.g., email and web services); however, doing so increases risk over limiting the services provided by any one component.
    To support the requirements and principles of least functionality, the application must support the organizational requirements
    providing only essential capabilities and limiting the use of ports, protocols, and/or services to only those required,
    authorized, and approved to conduct official business or to address authorized quality of life issues. Database Management
    Systems using ports, protocols, and services deemed unsafe are open to attack through those ports, protocols, and services.
    This can allow unauthorized access to the database and through the database to other components of the information system.
    Satisfies: SRG-APP-000142-DB-000094, SRG-APP-000383-DB-000364'
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'At the command prompt, run the following command:

    $ /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW port;"

    Expected result:

    5432

    If the output does not match the expected result, this is a finding.'
  remediation: 'A script is included with vCenter to generate a PostgreSQL STIG configuration.

    At the command prompt, run the following commands:

    chmod +x /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py

    /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py --action

    stig_enable --pg-data-dir /storage/db/vpostgres chmod -x

    /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py

    Restart the PostgreSQL service by running the following command:

    vmon-cli --restart vmware-vpostgres'
  checks:
  - type: sql
    command: SHOW port;
    severity: medium
    info: 'At the command prompt, run the following command:

      $ /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW port;"

      Expected result:

      5432

      If the output does not match the expected result, this is a finding.'
- id: '1.10'
  title: VCPG-80-000036
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter PostgreSQL service must require authentication on all connections. GROUP ID: V-259175 RULE ID:
    SV-259175r1051115'
  rationale: 'To assure accountability and prevent unauthenticated access, organizational users must be identified and authenticated
    to prevent potential misuse and compromise of the system. Organizational users include organizational employees or individuals
    the organization deems to have equivalent status of employees (e.g., contractors). Organizational users (and any processes
    acting on behalf of users) must be uniquely identified and authenticated for all accesses, except the following: (i) Accesses
    explicitly identified and documented by the organization. Organizations document specific user actions that can be performed
    on the information system without identification or authentication; and (ii) Accesses that occur through authorized use
    of group authenticators without individual authentication. Organizations may require unique identification of individuals
    using shared accounts, for detailed accountability of individual activity. Satisfies: SRG-APP-000148-DB-000103, SRG-APP-000172-DB-000075'
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'At the command prompt, run the following command:

    grep -v "^" /storage/db/vpostgres/pg_hba.conf |grep ''\S''

    If any lines are returned contain "trust" or "password" as an auth-method, this is a

    finding.'
  remediation: 'Navigate to and open:

    /storage/db/vpostgres/pg_hba.conf

    Find and update any line that has a method of "trust" or "password" in the far-right

    column.

    A correct, typical line will look like the below:

    TYPE DATABASE USER ADDRESS METHOD local VCDB vpxd peer map=vcdb

    Restart the PostgreSQL service by running the following command:

    vmon-cli --restart vmware-vpostgres'
  checks:
  - type: command
    command: grep -v "^" /storage/db/vpostgres/pg_hba.conf |grep '\S'
    expected: ''
    severity: medium
    info: 'At the command prompt, run the following command:

      grep -v "^" /storage/db/vpostgres/pg_hba.conf |grep ''\S''

      If any lines are returned contain "trust" or "password" as an auth-method, this is a

      finding.'
- id: '1.11'
  title: VCPG-80-000038
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The vCenter PostgreSQL service must encrypt passwords for user authentication. GROUP ID: V-259176 RULE ID:
    SV-259176r1015952'
  rationale: The DOD standard for authentication is DOD-approved PKI certificates. Authentication based on User ID and Password
    may be used only when it is not possible to employ a PKI certificate and requires AO approval. In such cases, database
    passwords stored in clear text, using reversible encryption, or using unsalted hashes would be vulnerable to unauthorized
    disclosure. Database passwords must always be in the form of one-way, salted hashes when stored internally or externally
    to the database management system (DBMS).
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'At the command prompt, run the following command:

    $ /opt/vmware/vpostgres/current/bin/psql -U postgres -A -t -c "SHOW

    password_encryption;"

    Expected result:

    scram-sha-256

    If the output does not match the expected result, this is a finding.

    Note: Prior to Update 2, "md5" is the expected result.'
  remediation: 'A script is included with vCenter to generate a PostgreSQL STIG configuration.

    At the command prompt, run the following commands:

    chmod +x /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py

    /opt/vmware/vpostgres/current/bin/vmw_vpg_config/vmw_vpg_config.py --action

    stig_enable --pg-data-dir /storage/db/vpostgres chmod -x

