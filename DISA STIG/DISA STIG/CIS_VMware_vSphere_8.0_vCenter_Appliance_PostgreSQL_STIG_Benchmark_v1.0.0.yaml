- id: '1.18'
  title: VCPG-80-000122
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter PostgreSQL service must off-load audit data to a separate log management facility. GROUP ID: V-259185
    RULE ID: SV-259185r961860'
  rationale: Information stored in one location is vulnerable to accidental or incidental deletion or alteration. Off-loading
    is a common process in information systems with limited audit storage capacity. The database management system (DBMS)
    may write audit records to database tables, to files in the file system, to other kinds of local repository, or directly
    to a centralized log management system. Whatever the method used, it must be compatible with off-loading the records to
    the centralized system.
