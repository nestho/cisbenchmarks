  rationale: If time stamps are not consistently applied and there is no common time reference, it is difficult to perform
    forensic analysis. Time stamps generated by PostgreSQL must include date and time. Time is commonly expressed in UTC,
    a modern continuation of Greenwich Mean Time (GMT), or local time with an offset from UTC.
