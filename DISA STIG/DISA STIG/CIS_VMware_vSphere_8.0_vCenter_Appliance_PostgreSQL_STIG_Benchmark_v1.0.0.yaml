    V-259180 RULE ID: SV-259180r961167'
  rationale: 'Any DBMS or associated application providing too much information in error messages on the screen or printout
    risks compromising the data and security of the system. The structure and content of error messages need to contain the
    minimal amount of information. Databases can inadvertently provide a wealth of information to an attacker through improperly
    handled error messages. In addition to sensitive business or personal information, database errors can provide host names,
