    ALTER SERVER ROLE SERVER_AUDIT_MAINTAINERS ADD MEMBER;

    GO

    Use REVOKE and/or DENY and/or ALTER SERVER ROLE ... DROP MEMBER ...

    statements to remove CONTROL SERVER, ALTER ANY DATABASE and CREATE ANY

    DATABASE permissions from logins that do not need them.'
  checks:
  - type: manual_review
    info: 'Obtain the list of approved audit maintainers from the system documentation.

