- id: '1.71'
  title: SQL6-D0-015000
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must generate audit records when unsuccessful attempts to execute privileged activities or other
    system-level access occur. GROUP ID: V-214016 RULE ID: SV-214016r961827'
  rationale: 'Without tracking privileged activity, it would be difficult to establish, correlate, and investigate the events
    relating to an incident or identify those responsible for one. System documentation should include a definition of the
    functionality considered privileged. A privileged function in this context is any operation that modifies the structure
    of the database, its built-in logic, or its security settings. This would include all Data Definition Language (DDL) statements
    and all security-related statements. In an SQL environment, it encompasses, but is not necessarily limited to: • CREATE
    • ALTER • DROP • GRANT • REVOKE • DENY Note that it is particularly important to audit, and tightly control, any action
    that weakens the implementation of this requirement itself, since the objective is to have a complete audit trail of all
    administrative activity. To aid in diagnosis, it is necessary to keep track of failed attempts in addition to the successful
    ones.'
