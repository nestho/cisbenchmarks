- id: '1.28'
  title: SQL6-D0-007600
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must be configured to prohibit or restrict the use of organization-defined protocols as defined
    in the PPSM CAL and vulnerability assessments. GROUP ID: V-213961 RULE ID: SV-213961r1043177'
  rationale: In order to prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized
    tunneling (i.e., embedding of data types within data types), organizations must disable or restrict unused or unnecessary
    protocols on information systems. Applications are capable of providing a wide variety of functions and services. Some
    of the functions and services provided by default may not be necessary to support essential organizational operations.
    Additionally, it is sometimes convenient to provide multiple services from a single component (e.g., email and web services);
    however, doing so increases risk over limiting the services provided by any one component. To support the requirements
    and principles of least functionality, the application must support the organizational requirements providing only essential
    capabilities and limiting the use of protocols to only those required, authorized, and approved to conduct official business
    or to address authorized quality of life issues. SQL Server using protocols deemed unsafe is open to attack through those
    protocols. This can allow unauthorized access to the database and through the database to other components of the information
    system.
  impact: ''
  references: []
  page_start: 73
  audit_raw: 'To determine the protocol(s) enabled for SQL Server, open SQL Server Configuration

    Manager. In the left-hand pane, expand SQL Server Network Configuration. Click on the

    entry for the SQL Server instance under review: "Protocols for ". The right-hand pane

    displays the protocols enabled for the instance.

    If Named Pipes is enabled and not specifically required and authorized, this is a finding.

    If any listed protocol is enabled but not authorized, this is a finding.'
  remediation: 'In SQL Server Configuration Manager >> SQL Server Network Configuration >>

    Protocols, right-click on each listed protocol that is enabled but not authorized and

    Select Disable.'
  checks:
  - type: manual_review
    info: 'To determine the protocol(s) enabled for SQL Server, open SQL Server Configuration

