- id: '1.14'
  title: SQL6-D0-005700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must be configurable to overwrite audit log records, oldest first (First-InFirst-Out - FIFO), in
    the event of unavailability of space for more audit log records. GROUP ID: V-213943 RULE ID: SV-213943r1043188'
  rationale: 'It is critical that when SQL Server is at risk of failing to process audit logs as required, it take action
    to mitigate the failure. Audit processing failures include; software/hardware errors; failures in the audit capturing
    mechanisms; and audit storage capacity being reached or exceeded. Responses to audit failure depend upon the nature of
    the failure mode. When availability is an overriding concern, approved actions in response to an audit failure are as
    follows: (i) If the failure was caused by the lack of audit record storage capacity, SQL Server must continue generating
    audit records, if possible (automatically restarting the audit service if necessary), overwriting the oldest audit records
    in a first-in-first-out manner. (ii) If audit records are sent to a centralized collection server and communication with
    this server is lost or the server fails, SQL Server must queue audit records locally until communication is restored or
    until the audit records are retrieved manually. Upon restoration of the connection to the centralized collection server,
    action should be taken to synchronize the local audit data with the collection server. Systems where availability is paramount
    will most likely be MAC I; the final determination is the prerogative of the application owner, subject to Authorizing
    Official concurrence. In any case, sufficient auditing resources must be allocated to avoid audit data loss in all but
    the most extreme situations.'
  impact: ''
  references: []
  page_start: 43
  audit_raw: "If the system documentation indicates that availability does not take precedence over\naudit trail completeness,\
    \ this is not applicable (NA).\nExecute the following query:\nSELECT a.name 'audit_name',\n a.type_desc 'storage_type',\n\
    \ f.max_rollover_files\nFROM sys.server_audits a\nLEFT JOIN sys.server_file_audits f ON a.audit_id = f.audit_id\nWHERE\
    \ a.is_state_enabled = 1\nIf no records are returned, this is a finding.\nIf the storage_type is APPLICATION LOG or SECURITY\
    \ LOG, this is not a finding.\nIf the storage_type is FILE and max_rollover_files is greater than zero, this is not\n\
    a finding. Otherwise, this is a finding."
  remediation: 'If SQL Server Audit is in use, configure SQL Server Audit to continue to generate audit

    records, overwriting the oldest existing records, in the case of an auditing failure.

    Run this T-SQL script for each identified audit:

    ALTER SERVER AUDIT [AuditName] WITH (STATE = OFF);

    GO

    ALTER SERVER AUDIT [AuditName] to file (max_rollover_files = IntegerValue);

    GO

    ALTER SERVER AUDIT [AuditName] WITH (STATE = ON);

    GO'
  checks:
  - type: manual_review
    info: "If the system documentation indicates that availability does not take precedence over\naudit trail completeness,\
      \ this is not applicable (NA).\nExecute the following query:\nSELECT a.name 'audit_name',\n a.type_desc 'storage_type',\n\
