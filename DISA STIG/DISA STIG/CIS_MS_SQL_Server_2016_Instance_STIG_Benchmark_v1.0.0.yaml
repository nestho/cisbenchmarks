  title: SQL6-D0-007800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must uniquely identify and authenticate organizational users (or processes acting on behalf of
    organizational users). GROUP ID: V-213963 RULE ID: SV-213963r1051115'
  rationale: 'To assure accountability and prevent unauthenticated access, organizational users must be identified and authenticated
    to prevent potential misuse and compromise of the system. Organizational users include organizational employees or individuals
    the organization deems to have equivalent status of employees (e.g., contractors). Organizational users (and any processes
    acting on behalf of users) must be uniquely identified and authenticated for all accesses, except the following: • (i)
    Accesses explicitly identified and documented by the organization. Organizations document specific user actions that can
    be performed on the information system without identification or authentication; and • (ii) Accesses that occur through
    authorized use of group authenticators without individual authentication. Organizations may require unique identification
    of individuals using shared accounts, for detailed accountability of individual activity.'
  impact: ''
  references: []
  page_start: 77
  audit_raw: 'Review SQL Server users to determine whether shared accounts exist. (This does not

    include the case where SQL Server has a guest or public account that is providing

    access to publicly available information.)

    If accounts are determined to be shared, determine if individuals are first individually

    authenticated. Where an application connects to SQL Server using a standard, shared

    account, ensure that it also captures the individual user identification and passes it to

    SQL Server.

    If individuals are not individually authenticated before using the shared account (e.g., by

    the operating system or possibly by an application making calls to the database), this is

    a finding.

    If accounts are determined to be shared, determine if they are directly accessible to end

    users. If so, this is a finding.'
  remediation: 'Remove user-accessible shared accounts and use individual userIDs.

    Configure applications to ensure successful individual authentication prior to shared

    account access.

    Ensure each user''s identity is received and used in audit data in all relevant

    circumstances.'
