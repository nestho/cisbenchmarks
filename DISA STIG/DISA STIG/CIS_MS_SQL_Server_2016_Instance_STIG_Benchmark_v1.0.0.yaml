- id: '1.38'
  title: SQL6-D0-009200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must maintain the authenticity of communications sessions by guarding against man-in-the-middle
    attacks that guess at Session ID values. GROUP ID: V-213971 RULE ID: SV-213971r1043181'
  rationale: One class of man-in-the-middle, or session hijacking, attack involves the adversary guessing at valid session
    identifiers based on patterns in identifiers already known. The preferred technique for thwarting guesses at Session IDs
    is the generation of unique session identifiers using a FIPS 140-2 or FIPS 140-3 approved random number generator. However,
    it is recognized that available DBMS products do not all implement the preferred technique yet may have other protections
    against session hijacking. Therefore, other techniques are acceptable, provided they are demonstrated to be effective.
  impact: ''
