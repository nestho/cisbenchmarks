  title: SQL6-D0-010000
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Access to database files must be limited to relevant processes and to authorized, administrative users. GROUP
    ID: V-213977 RULE ID: SV-213977r961149'
  rationale: SQL Server must prevent unauthorized and unintended information transfer via shared system resources. Permitting
    only SQL Server processes and authorized, administrative users to have access to the files where the database resides
    helps ensure that those files are not shared inappropriately and are not open to backdoor access and manipulation.
  impact: ''
