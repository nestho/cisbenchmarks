- id: '1.73'
  title: SQL6-D0-015200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must generate audit records when concurrent logons/connections by the same user from different
    workstations occur. GROUP ID: V-214018 RULE ID: SV-214018r961833'
  rationale: For completeness of forensic analysis, it is necessary to track who logs on to SQL Server. Concurrent connections
    by the same user from multiple workstations may be valid use of the system; or such connections may be due to improper
    circumvention of the requirement to use the CAC for authentication; or they may indicate unauthorized account sharing;
    or they may be because an account has been compromised. (If the fact of multiple, concurrent logons by a given user can
    be reliably reconstructed from the log entries for other events (logons/connections; voluntary and involuntary disconnections),
    then it is not mandatory to create additional log entries specifically for this.)
  impact: ''
  references: []
  page_start: 178
  audit_raw: "Determine if an audit is configured and started by executing the following query.\nSELECT name AS 'Audit Name',\n\
    \ status_desc AS 'Audit Status',\n audit_file_path AS 'Current Audit File'\nFROM sys.dm_server_audit_status\nIf no records\
    \ are returned, this is a finding.\nExecute the following query to verify the SUCCESSFUL_LOGIN_GROUP is included in the\n\
    server audit specification.\nSELECT a.name AS 'AuditName',\ns.name AS 'SpecName',\nd.audit_action_name AS 'ActionName',\n\
    d.audited_result AS 'Result'\nFROM sys.server_audit_specifications s\nJOIN sys.server_audits a ON s.audit_guid = a.audit_guid\n\
    JOIN sys.server_audit_specification_details d ON s.server_specification_id =\nd.server_specification_id\nWHERE a.is_state_enabled\
    \ = 1 AND d.audit_action_name =\n'SUCCESSFUL_LOGIN_GROUP'\nIf the SUCCESSFUL_LOGIN_GROUP is returned in an active audit,\
    \ this is not a finding.\nIf SUCCESSFUL_LOGIN_GROUP is not in the active audit, determine whether \"Both failed\nand successful\
    \ logins\" is enabled.\nIn SQL Management Studio:\nRight-click on the instance >> Select \"Properties\" >> Select \"Security\"\
