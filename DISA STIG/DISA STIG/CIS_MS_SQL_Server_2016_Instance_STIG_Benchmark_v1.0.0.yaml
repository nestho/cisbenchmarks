- id: '1.16'
  title: SQL6-D0-006300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must protect its audit configuration from authorized and unauthorized access and modification.
    GROUP ID: V-213948 RULE ID: SV-213948r960942'
  rationale: 'Protecting audit data also includes identifying and protecting the tools used to view and manipulate log data.
    Therefore, protecting audit tools is necessary to prevent unauthorized operation on audit data. Applications providing
    tools to interface with audit data will leverage user permissions and roles identifying the user accessing the tools and
    the corresponding rights the user enjoys in order make access decisions regarding the modification of audit tools. SQL
    Server is an application that does provide access to audit data. Audit tools include, but are not limited to, vendor-provided
    and open source audit tools needed to successfully view and manipulate audit information system activity and records.
    Audit tools include custom queries and report generators. If an attacker were to gain access to audit tools, they could
    analyze audit logs for system weaknesses or weaknesses in the auditing itself. An attacker could also manipulate logs
    to hide evidence of malicious activity. Satisfies: SRG-APP-000121-DB-000202, SRG-APP-000123-DB-000204'
  impact: ''
  references: []
  page_start: 49
  audit_raw: 'Check the server documentation for a list of approved users with access to SQL Server

    Audits.

    To create, alter, or drop a server audit, principals require the ALTER ANY SERVER

    AUDIT or the CONTROL SERVER permission.

    Review the SQL Server permissions granted to principals. Look for permissions ALTER

    ANY SERVER AUDIT, ALTER ANY DATABASE AUDIT, CONTROL SERVER:

    SELECT login.name, perm.permission_name, perm.state_desc

    FROM sys.server_permissions perm

    JOIN sys.server_principals login

    ON perm.grantee_principal_id = login.principal_id

    WHERE permission_name in (''ALTER ANY DATABASE AUDIT'', ''ALTER ANY SERVER

    AUDIT'', ''CONTROL SERVER'')

    and login.name not like ''##MS_%'';

    If unauthorized accounts have these privileges, this is a finding.'
  remediation: 'Remove audit-related permissions from individuals and roles not authorized to have

    them.

    USE master;

    DENY [ALTER ANY SERVER AUDIT] TO [User];

    GO'
  checks:
  - type: sql
    command: SELECT login.name, perm.permission_name, perm.state_desc
