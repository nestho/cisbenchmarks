  title: SQL6-D0-017800
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The SQL Server Browser service must be disabled unless specifically required and approved. GROUP ID: V-214042
    RULE ID: SV-214042r961863'
  rationale: The SQL Server Browser simplifies the administration of SQL Server, particularly when multiple instances of SQL
    Server coexist on the same computer. It avoids the need to hard-assign port numbers to the instances and to set and maintain
    those port numbers in client systems. It enables administrators and authorized users to discover database management system
    instances, and the databases they support, over the network. SQL Server uses the SQL Server Browser service to enumerate
    instances of the Database Engine installed on the computer. This enables client applications to browse for a server, and
    helps clients distinguish between multiple instances of the Database Engine on the same computer. This convenience also
    presents the possibility of unauthorized individuals gaining knowledge of the available SQL Server resources. Therefore,
    it is necessary to consider whether the SQL Server Browser is needed. Typically, if only a single instance is installed,
    using the default name (MSSQLSERVER) and port assignment (1433), the Browser is not adding any value. The more complex
    the installation, the more likely SQL Server Browser is to be helpful. This requirement is not intended to prohibit use
    of the Browser service in any circumstances. It calls for administrators and management to consider whether the benefits
    of its use outweigh the potential negative consequences of it being used by an attacker to browse the current infrastructure
    and retrieve a list of running SQL Server instances.
  impact: ''
  references: []
  page_start: 224
  audit_raw: 'If the need for the SQL Server Browser service is documented and authorized, this is

    not a finding.

    Open the Services tool.

    Either navigate, via the Windows Start Menu and/or Control Panel, to "Administrative

    Tools", and select "Services"; or at a command prompt, type services.msc and press

    the "Enter" key.

    Scroll to "SQL Server Browser".

    If its Startup Type is not shown as Disabled, this is a finding.'
  remediation: 'If SQL Server Browser is needed, document the justification and obtain the appropriate

    authorization.

    Where SQL Server Browser is judged unnecessary, the Service can be disabled.

    To disable, in the Services tool, double-click "SQL Server Browser". Set "Startup Type"

    to Disabled. If "Service Status" is "Running", click on "Stop". Click on "OK".'
  checks:
  - type: manual_review
    info: 'If the need for the SQL Server Browser service is documented and authorized, this is

      not a finding.

      Open the Services tool.

      Either navigate, via the Windows Start Menu and/or Control Panel, to "Administrative

      Tools", and select "Services"; or at a command prompt, type services.msc and press

      the "Enter" key.

      Scroll to "SQL Server Browser".

      If its Startup Type is not shown as Disabled, this is a finding.'
    severity: medium
- id: '1.97'
  title: SQL6-D0-017900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server Replication Xps feature must be disabled, unless specifically required and approved. GROUP ID:
    V-214043 RULE ID: SV-214043r960963'
  rationale: SQL Server is capable of providing a wide range of features and services. Some of the features and services,
    provided by default, may not be necessary, and enabling them could adversely affect the security of the system. Enabling
    the replication XPs opens a significant attack surface area that can be used by an attacker to gather information about
    the system and potentially abuse the privileges of SQL Server.
  impact: ''
  references: []
  page_start: 226
  audit_raw: 'To determine if the "Replication Xps" option is enabled, execute the following query:

    EXEC SP_CONFIGURE ''show advanced options'', ''1'';

    RECONFIGURE WITH OVERRIDE;

    EXEC SP_CONFIGURE ''replication xps'';

    If the value of config_value is 0, this is not a finding.

    If the value of config_value is 1, review the system documentation to determine

    whether the use of "Replication Xps" is required and authorized. If it is not authorized,

    this is a finding.'
  remediation: 'Disable use of or remove any external application executable object definitions that are

    not authorized. To disable the use of "Replication Xps" option, from the query prompt:

    sp_configure ''show advanced options'', 1;

    GO

    RECONFIGURE;

    GO

    sp_configure ''replication xps'', 0;

    GO

    RECONFIGURE;

    GO'
  checks:
  - type: sql
    command: show advanced options', '1';
    severity: medium
    info: 'To determine if the "Replication Xps" option is enabled, execute the following query:

      EXEC SP_CONFIGURE ''show advanced options'', ''1'';

      RECONFIGURE WITH OVERRIDE;

      EXEC SP_CONFIGURE ''replication xps'';

      If the value of config_value is 0, this is not a finding.

      If the value of config_value is 1, review the system documentation to determine

      whether the use of "Replication Xps" is required and authorized.'
