- id: '1.69'
  title: SQL6-D0-014800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must generate audit records when successful and unsuccessful logons or connection attempts occur.
    GROUP ID: V-214014 RULE ID: SV-214014r961824'
  rationale: 'For completeness of forensic analysis, it is necessary to track who/what (a user or other principal) logs on
    to SQL Server. It is also necessary to track failed attempts to log on to SQL Server. While positive identification may
    not be possible in a case of failed authentication, as much information as possible about the incident must be captured.
    Satisfies: SRG-APP-000503-DB-000350'
  impact: ''
  references: []
  page_start: 165
  audit_raw: "Determine if an audit is configured and started by executing the following query:\nSELECT name AS 'Audit Name',\n\
    \ status_desc AS 'Audit Status',\n audit_file_path AS 'Current Audit File'\nFROM sys.dm_server_audit_status\nExecute the\
    \ following query to verify the SUCCESSFUL_LOGIN_GROUP and\nFAILED_LOGIN_GROUP are included in the server audit specification.\n\
    SELECT a.name AS 'AuditName',\n s.name AS 'SpecName',\n d.audit_action_name AS 'ActionName',\n d.audited_result AS 'Result'\n\
    FROM sys.server_audit_specifications s\nJOIN sys.server_audits a ON s.audit_guid = a.audit_guid\nJOIN sys.server_audit_specification_details\
    \ d ON s.server_specification_id =\nd.server_specification_id\nWHERE a.is_state_enabled = 1 AND d.audit_action_name IN\n\
    ('SUCCESSFUL_LOGIN_GROUP', 'FAILED_LOGIN_GROUP')\nIf both SUCCESSFUL_LOGIN_GROUP and FAILED_LOGIN_GROUP are returned in\
    \ an active\naudit, this is not a finding.\nIf both SUCCESSFUL_LOGIN_GROUP and FAILED_LOGIN_GROUP are not in the active\n\
    audit, determine whether \"Both failed and successful logins\" is enabled.\nIn SQL Management Studio\n1. Right-click on\
    \ the instance\n2. >> Select \"Properties\"\n3. >> Select \"Security\" on the left hand side\n4. >> Check the setting\
    \ for \"Login auditing\"\nIf \"Both failed and successful logins\" is not selected, this is a finding."
  remediation: 'Add both SUCCESSFUL_LOGIN_GROUP and FAILED_LOGIN_GROUP to the server audit

    specification.

    USE [master];

    GO

    ALTER SERVER AUDIT SPECIFICATION STIG_AUDIT_SERVER_SPECIFICATION WITH (STATE

    = OFF);

    GO

    ALTER SERVER AUDIT SPECIFICATION STIG_AUDIT_SERVER_SPECIFICATION ADD

    (SUCCESSFUL_LOGIN_GROUP);

    GO

    ALTER SERVER AUDIT SPECIFICATION STIG_AUDIT_SERVER_SPECIFICATION ADD

    (FAILED_LOGIN_GROUP);

    GO

    ALTER SERVER AUDIT SPECIFICATION STIG_AUDIT_SERVER_SPECIFICATION WITH (STATE

    = ON);

    GO

    Alternatively, enable "Both failed and successful logins".

    In SQL Management Studio: Right-click on the instance.

    • Select "Properties".

    • Select "Security" on the left-hand side.

    • Select "Both failed and successful logins".

    • Click "OK".'
