- id: '1.3'
  title: SQL6-D0-003800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must be configured to utilize the most-secure authentication method available. GROUP ID: V-213931
    RULE ID: SV-213931r1043176'
  rationale: 'Enterprise environments make account management for applications and databases challenging and complex. A manual
    process for account management functions adds the risk of a potential oversight or other error. Managing accounts for
    the same person in multiple places is inefficient and prone to problems with consistency and synchronization. A comprehensive
    application account management process that includes automation helps to ensure that accounts designated as requiring
    attention are consistently and promptly addressed. Examples include, but are not limited to, using automation to take
    action on multiple accounts designated as inactive, suspended, or terminated, or by disabling accounts located in non-centralized
    account stores, such as multiple servers. Account management functions can also include: assignment of group or role membership;
    identifying account type; specifying user access authorizations (i.e., privileges); account removal, update, or termination;
    and administrative alerts. The use of automated mechanisms can include, for example: using email or text messaging to
    notify account managers when users are terminated or transferred; using the information system to monitor account usage;
    and using automated telephone notification to report atypical system account usage. SQL Server must be configured to automatically
    utilize organization-level account management functions, and these functions must immediately enforce the organization''s
    current account policy. Automation may be comprised of differing technologies that when placed together contain an overall
    mechanism supporting an organization''s automated account management requirements. SQL Server supports several authentication
    methods to allow operation in various environments, Kerberos, NTLM, and SQL Server. An instance of SQL Server must be
    configured to utilize the most-secure method available. Service accounts utilized by SQL Server should be unique to a
    given instance.'
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'If the SQL Server is not part of an Active Directory domain, this finding is Not

    Applicable.

    Obtain the fully qualified domain name of the SQL Server instance:

    • Launch Windows Explorer.

    • Right-click on "Computer" or "This PC" (Varies by OS level), click "Properties".

    • Note the value shown for "Full computer name".

    *** Note: For a cluster, this value must be obtained from the Failover Cluster Manager.

    ***

    Obtain the TCP port that is supporting the SQL Server instance:

    • Click Start >> Type "SQL Server 2016 Configuration Manager" >> From the

    search results, click "SQL Server 2016 Configuration Manager".

    • From the tree on the left, expand "SQL Server Network Configuration".

    • Click "Protocols for <Instance Name>" where <Instance Name> is the name of

    the instance (MSSQLSERVER is the default name).

    • In the right pane, right-click on "TCP/IP" and choose "Properties".

    • In the window that opens, click the "IP Addresses" tab.

    • Note the TCP port configured for the instance.

    Obtain the service account that is running the SQL Server service:

    • Click "Start".

    • Type "SQL Server 2016 Configuration Manager".

    • From the search results, click "SQL Server 2016 Configuration Manager".

    • From the tree on the left, select "SQL Server Services".

    • Note the account listed in the "Log On As" column for the SQL Server instance

    being reviewed.

    Launch a command-line or PowerShell window.

    Enter the following command where <Service Account> is the identity of the service

    account.

    setspn -L <Service Account>

    Example: setspn -L CONTOSO\sql2016svc

    Review the Registered Service Principal Names returned.

    If the listing does not contain the following supported service principal names (SPN)

    formats, this is a finding.

    • Named instance

    MSSQLSvc/<FQDN>:[<port> | <instancename>], where:

    MSSQLSvc is the service that is being registered.

    <FQDN> is the fully qualified domain name of the server.

    <port> is the TCP port number.

    <instancename> is the name of the SQL Server instance.

    • Default instance

    MSSQLSvc/<FQDN>:<port> | MSSQLSvc/<FQDN>, where:

    MSSQLSvc is the service that is being registered.

    <FQDN> is the fully qualified domain name of the server.

    <port> is the TCP port number.

    If the MSSQLSvc service is registered for any fully qualified domain names that do not

    match the current server, this may indicate the service account is shared across SQL

    Server instances. Review server documentation, if the sharing of service accounts

    across instances is not documented and authorized, this is a finding.'
  remediation: 'Ensure Service Principal Names (SPNs) are properly registered for the SQL Server

    instance.

    Utilize the Microsoft Kerberos Configuration Manager to review Kerberos configuration

    issues for a given SQL Server instance.

    https://www.microsoft.com/en-us/download/details.aspx?id=39046

    Alternatively, SPNs for SQL Server can be manually registered.

    For other connections that support Kerberos the SPN is registered in the format

    MSSQLSvc/<FQDN>/<instancename> for a named instance. The format for registering

    the default instance is MSSQLSvc/<FQDN>.

    Using an account with permissions to register SPNs, issue the following commands

    from a command-prompt:

    setspn -S MSSQLSvc/<Fully Qualified Domain Name> <Service Account>

    setspn -S MSSQLSvc/<Fully Qualified Domain Name>:<TCP Port> <Service Account>

    For a named instance, use:

    setspn -S MSSQLSvc/<FQDN>:<instancename> <Service Account>

    setspn -S MSSQLSvc/<FQDN>:<TCP Port> <Service Account>

    Restart the SQL Server instance.

    More information regarding this process is available at:

    https://docs.microsoft.com/en-us/sql/database-engine/configure-windows/register-aservice-principal-name-for-kerberos-connections#Manual'
  checks:
  - type: manual_review
    info: 'If the SQL Server is not part of an Active Directory domain, this finding is Not

      Applicable.

      Obtain the fully qualified domain name of the SQL Server instance:

      • Launch Windows Explorer.

      • Right-click on "Computer" or "This PC" (Varies by OS level), click "Properties".

      • Note the value shown for "Full computer name".

      *** Note: For a cluster, this value must be obtained from the Failover Cluster Manager.

      ***

      Obtain the TCP port that is supporting the SQL Server instance:

      • Click Start >> Type "SQ'
    severity: medium
- id: '1.4'
  title: SQL6-D0-004000
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must protect against a user falsely repudiating by ensuring all accounts are individual, unique,
    and not shared. GROUP ID: V-213933 RULE ID: SV-213933r960864'
  rationale: Non-repudiation of actions taken is required in order to maintain data integrity. Examples of particular actions
    taken by individuals include creating information, sending a message, approving information (e.g., indicating concurrence
    or signing a contract), and receiving a message. Non-repudiation protects against later claims by a user of not having
    created, modified, or deleted a particular data item or collection of data in the database. In designing a database, the
    organization must define the types of data and the user actions that must be protected from repudiation. The implementation
    must then include building audit features into the application data tables and configuring SQL Server's audit tools to
    capture the necessary audit trail. Design and implementation also must ensure that applications pass individual user identification
    to SQL Server, even where the application connects to SQL Server with a standard, shared account.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'Obtain the list of authorized SQL Server accounts in the system documentation.

    Determine if any accounts are shared. A shared account is defined as a username and

    password that are used by multiple individuals to log into SQL Server. An example of a

    shared account is the SQL Server installation account. Windows Groups are not shared

    accounts as the group itself does not have a password.

    If accounts are determined to be shared, determine if individuals are first individually

    authenticated.

    If individuals are not individually authenticated before using the shared account (e.g., by

    the operating system or possibly by an application making calls to the database), this is

    a finding.

    The key is individual accountability. If this can be traced, this is not a finding.

    If accounts are determined to be shared, determine if they are directly accessible to end

    users. If so, this is a finding.

    Review contents of audit logs, traces and data tables to confirm that the identity of the

    individual user performing the action is captured.

    If shared identifiers are found, and not accompanied by individual identifiers, this is a

    finding.

    Note: Privileged installation accounts may be required to be accessed by the DBA or

    other administrators for system maintenance. In these cases, each use of the account

    must be logged in some manner to assign accountability for any actions taken during

    the use of the account.'
  remediation: 'Remove user-accessible shared accounts and use individual user IDs.

    Build/configure applications to ensure successful individual authentication prior to

    shared account access.

    Ensure each user''s identity is received and used in audit data in all relevant

    circumstances.

    Design, develop, and implement a method to log use of any account to which more than

    one person has access. Restrict interactive access to shared accounts to the fewest

    persons possible.'
  checks:
  - type: manual_review
    info: 'Obtain the list of authorized SQL Server accounts in the system documentation.

      Determine if any accounts are shared. A shared account is defined as a username and

      password that are used by multiple individuals to log into SQL Server. An example of a

      shared account is the SQL Server installation account. Windows Groups are not shared

      accounts as the group itself does not have a password.

      If accounts are determined to be shared, determine if individuals are first individually

      authenticated.

      If ind'
    severity: medium
- id: '1.5'
  title: SQL6-D0-003900
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'SQL Server must enforce approved authorizations for logical access to information and system resources in
    accordance with applicable access control policies. GROUP ID: V-213932 RULE ID: SV-213932r960792'
  rationale: Authentication with a DoD-approved PKI certificate does not necessarily imply authorization to access SQL Server.
    To mitigate the risk of unauthorized access to sensitive information by entities that have been issued certificates by
    DoD-approved PKIs, all DoD systems, including databases, must be properly configured to implement access control policies.
    Successful authentication must not automatically give an entity access to an asset or security boundary. Authorization
    procedures and controls must be implemented to ensure each authenticated entity also has a validated and current authorization.
    Authorization is the process of determining whether an entity, once authenticated, is permitted to access a specific asset.
    Information systems use access control policies and enforcement mechanisms to implement this requirement. Access control
    policies include identity-based policies, role-based policies, and attribute-based policies. Access enforcement mechanisms
    include access control lists, access control matrices, and cryptography. These policies and mechanisms must be employed
    by the application to control access between users (or processes acting on behalf of users) and objects (e.g., devices,
    files, records, processes, programs, and domains) in the information system. This requirement is applicable to access
    control enforcement applications, a category that includes database management systems. If SQL Server does not follow
    applicable policy when approving access, it may be in conflict with networks or other applications in the information
    system. This may result in users either gaining or being denied access inappropriately and in conflict with applicable
    policy.
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'Review the system documentation to determine the required levels of protection for

    DBMS server securables, by type of login.

    Review the permissions actually in place on the server.

    If the actual permissions do not match the documented requirements, this is a finding.

    Use the supplemental file "Instance permissions assignments to logins and roles.sql."'
  remediation: 'Use GRANT, REVOKE, DENY, ALTER SERVER ROLE … ADD MEMBER … and/or ALTER

    SERVER ROLE …. DROP MEMBER statements to add and remove permissions on serverlevel securables, bringing them into line
    with the documented requirements.'
  checks:
  - type: manual_review
    info: 'Review the system documentation to determine the required levels of protection for

      DBMS server securables, by type of login.

      Review the permissions actually in place on the server.

      If the actual permissions do not match the documented requirements, this is a finding.

      Use the supplemental file "Instance permissions assignments to logins and roles.sql."'
    severity: medium
- id: '1.6'
  title: SQL6-D0-004100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must protect against a user falsely repudiating by ensuring the NT AUTHORITY SYSTEM account is
    not used for administration. GROUP ID: V-213934 RULE ID: SV-213934r960864'
  rationale: Non-repudiation of actions taken is required in order to maintain data integrity. Examples of particular actions
    taken by individuals include creating information, sending a message, approving information (e.g., indicating concurrence
    or signing a contract), and receiving a message. Non-repudiation protects against later claims by a user of not having
    created, modified, or deleted a particular data item or collection of data in the database. In designing a database, the
    organization must define the types of data and the user actions that must be protected from repudiation. The implementation
    must then include building audit features into the application data tables and configuring the DBMS's audit tools to capture
    the necessary audit trail. Design and implementation also must ensure that applications pass individual user identification
    to the DBMS, even where the application connects to the DBMS with a standard, shared account. Any user with enough access
    to the server can execute a task that will be run as NT AUTHORITY\SYSTEM either using task scheduler or other tools. At
    this point, NT AUTHORITY\SYSTEM essentially becomes a shared account because the operating system and SQL Server are unable
    to determine who created the process. Prior to SQL Server 2012, NT AUTHORITY\SYSTEM was a member of the sysadmin role
    by default. This allowed jobs/tasks to be executed in SQL Server without the approval or knowledge of the DBA because
    it looked like operating system activity.
  impact: ''
  references: []
  page_start: 26
  audit_raw: "Execute the following queries. The first query checks for Clustering and Availability\nGroups being provisioned\
    \ in the Database Engine. The second query lists permissions\ngranted to the Local System account.\nSELECT\n SERVERPROPERTY('IsClustered')\
    \ AS [IsClustered],\n SERVERPROPERTY('IsHadrEnabled') AS [IsHadrEnabled]\nEXECUTE AS LOGIN = 'NT AUTHORITY\\SYSTEM'\n\
    SELECT * FROM fn_my_permissions(NULL, 'server')\nREVERT\nGO\nIf IsClustered returns 1, IsHadrEnabled returns 0, and any\
    \ permissions have been\ngranted to the Local System account beyond CONNECT SQL, VIEW SERVER STATE, and\nVIEW ANY DATABASE,\
    \ this is a finding.\nIf IsHadrEnabled returns 1 and any permissions have been granted to the Local\nSystem account beyond\
    \ CONNECT SQL, CREATE AVAILABILITY GROUP, ALTER ANY\nAVAILABILITY GROUP, VIEW SERVER STATE, and VIEW ANY DATABASE, this\
    \ is a\nfinding.\nIf both IsClustered and IsHadrEnabled return 0 and any permissions have been\ngranted to the Local System\
    \ account beyond CONNECT SQL and VIEW ANY DATABASE,\nthis is a finding."
  remediation: 'Remove permissions that were identified as not allowed in the check content.

    USE Master;

    REVOKE <Permission> TO [NT AUTHORITY\SYSTEM]

    GO

    To grant permissions to services or applications, utilize the Service SID of the service or

    a domain service account.'
  checks:
  - type: sql
    command: "SELECT\n SERVERPROPERTY('IsClustered') AS [IsClustered],"
    severity: medium
    info: "Execute the following queries. The first query checks for Clustering and Availability\nGroups being provisioned\
      \ in the Database Engine. The second query lists permissions\ngranted to the Local System account.\nSELECT\n SERVERPROPERTY('IsClustered')\
      \ AS [IsClustered],\n SERVERPROPERTY('IsHadrEnabled') AS [IsHadrEnabled]\nEXECUTE AS LOGIN = 'NT AUTHORITY\\SYSTEM'\n\
      SELECT * FROM fn_my_permissions(NULL, 'serve"
- id: '1.7'
  title: SQL6-D0-004200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must protect against a user falsely repudiating by ensuring only clearly unique Active Directory
    user accounts can connect to the instance. GROUP ID: V-213935 RULE ID: SV-213935r960864'
  rationale: Non-repudiation of actions taken is required in order to maintain data integrity. Examples of particular actions
    taken by individuals include creating information, sending a message, approving information (e.g., indicating concurrence
    or signing a contract), and receiving a message. Non-repudiation protects against later claims by a user of not having
    created, modified, or deleted a particular data item or collection of data in the database. In designing a database, the
    organization must define the types of data and the user actions that must be protected from repudiation. The implementation
    must then include building audit features into the application data tables and configuring the DBMS's audit tools to capture
    the necessary audit trail. Design and implementation also must ensure that applications pass individual user identification
    to the DBMS, even where the application connects to the DBMS with a standard, shared account. If the computer account
    of a remote computer is granted access to SQL Server, any service or scheduled task running as NT AUTHORITY\SYSTEM or
    NT AUTHORITY\NETWORK SERVICE can log into the instance and perform actions. These actions cannot be traced back to a specific
    user or process.
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'Execute the following query:

    SELECT name

    FROM sys.server_principals

    WHERE type in (''U'',''G'')

    AND name LIKE ''%$''

    If no logins are returned, this is not a finding.

