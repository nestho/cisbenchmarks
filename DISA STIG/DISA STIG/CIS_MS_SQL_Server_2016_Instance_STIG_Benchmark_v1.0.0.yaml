- id: '1.84'
  title: SQL6-D0-016400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Execution of startup stored procedures must be restricted to necessary cases only. GROUP ID: V-214030 RULE
    ID: SV-214030r961359'
  rationale: In certain situations, to provide required functionality, a DBMS needs to execute internal logic (stored procedures,
    functions, triggers, etc.) and/or external code modules with elevated privileges. However, if the privileges required
    for execution are at a higher level than the privileges assigned to organizational users invoking the functionality applications/programs,
    those users are indirectly provided with greater privileges than assigned by organizations. When 'Scan for startup procs'
    is enabled, SQL Server scans for and runs all automatically run stored procedures defined on the server. The execution
    of start-up stored procedures will be done under a high privileged context, therefore it is a commonly used post-exploitation
    vector.
  impact: ''
  references: []
  page_start: 200
  audit_raw: 'Review the system documentation to obtain a listing of documented stored procedures

    used by SQL Server during start up. Execute the following query:

    Select [name] as StoredProc

    From sys.procedures

    Where OBJECTPROPERTY(OBJECT_ID, ''ExecIsStartup'') = 1

    If any stored procedures are returned that are not documented, this is a finding.'
  remediation: 'To disable start up stored procedure(s), run the following in Master for each

    undocumented procedure:

    sp_procoption @procname = ''<procedure name>'', @OptionName = ''Startup'',

    @optionValue = ''Off'''
  checks:
  - type: sql
    command: Select [name] as StoredProc
    severity: medium
    info: 'Review the system documentation to obtain a listing of documented stored procedures

      used by SQL Server during start up. Execute the following query:

      Select [name] as StoredProc

      From sys.procedures

      Where OBJECTPROPERTY(OBJECT_ID, ''ExecIsStartup'') = 1

      If any stored procedures are returned that are not documented, this is a finding.'
- id: '1.85'
  title: SQL6-D0-016500
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server Mirroring endpoint must utilize AES encryption. GROUP ID: V-214031 RULE ID: SV-214031r961863'
  rationale: Information can be either unintentionally or maliciously disclosed or modified during preparation for transmission,
    including, for example, during aggregation, at protocol transformation points, and during packing/unpacking. These unauthorized
    disclosures or modifications compromise the confidentiality or integrity of the information. Use of this requirement will
    be limited to situations where the data owner has a strict requirement for ensuring data integrity and confidentiality
    is maintained at every step of the data transfer and handling process. SQL Mirroring endpoints support different encryption
