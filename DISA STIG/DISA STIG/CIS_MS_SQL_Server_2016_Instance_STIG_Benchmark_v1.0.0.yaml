- id: '1.15'
  title: SQL6-D0-005900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The audit information produced by SQL Server must be protected from unauthorized access, modification, and
    deletion. GROUP ID: V-213944 RULE ID: SV-213944r960930'
  rationale: 'If audit data were to become compromised, then competent forensic analysis and discovery of the true source
    of potentially malicious system activity is difficult, if not impossible, to achieve. In addition, access to audit records
    provides information an attacker could potentially use to his or her advantage. To ensure the veracity of audit data,
    the information system and/or the application must protect audit information from any and all unauthorized access. This
    includes read, write, copy, etc. This requirement can be achieved through multiple methods which will depend upon system
    architecture and design. Some commonly employed methods include ensuring log files enjoy the proper file system permissions
    utilizing file system protections and limiting log data location. Additionally, applications with user interfaces to audit
    records should not allow for the unfettered manipulation of or access to those records via the application. If the application
    provides access to the audit data, the application becomes accountable for ensuring that audit information is protected
    from unauthorized access. SQL Server is an application that is able to view and manipulate audit file data. Audit information
    includes all information (e.g., audit records, audit settings, and audit reports) needed to successfully audit information
    system activity. Satisfies: SRG-APP-000118-DB-000059, SRG-APP-000119-DB-000060, SRG-APP000120-DB-000061'
  impact: ''
  references: []
  page_start: 45
  audit_raw: 'If the database is setup to write audit logs using APPLICATION or SECURITY event

    logs rather than writing to a file, this is N/A.

    Obtain the SQL Server audit file location(s) by running the following SQL script:

    SELECT log_file_path AS "Audit Path"

    FROM sys.server_file_audits

    For each audit, the path column will give the location of the file.

    Verify that all audit files have the correct permissions by doing the following for each

    audit file: Navigate to audit folder location(s) using a command prompt or Windows

    Explorer.

    Right-click the file/folder and click "Properties". On the "Security" tab, verify that at most

    the following permissions are applied:

    Administrator (read)

    Users (none)

    Audit Administrator (Full Control)

    Auditors group (Read)

    SQL Server Service SID OR Service Account (Full Control)

    SQL Server SQL Agent Service SID OR Service Account, if SQL Server Agent is

    in use. (Read, Execute, Write)

    If any less restrictive permissions are present (and not specifically justified and

    approved), this is a finding.'
  remediation: 'Modify audit file permissions to meet the requirement to protect against unauthorized

    access.

    Application event log and security log permissions are covered in the Windows Server

    STIGs. Be sure to reference these depending on the OS in use.

    Navigate to audit folder location(s) using a command prompt or Windows Explorer.

    Right-click the file and click "Properties".

    On the Security tab, modify the security permissions to:

    Administrator (read)

    Users (none)

    Audit Administrator(Full Control)

    Auditors group (Read)

    SQL Server Service SID OR Service Account (Full Control) [Notes 1, 2]

    SQL Server SQL Agent Service SID OR Service Account, if SQL Server Agent is

    in use. (Read, Execute, Write) [Notes 1, 2]

    Note 1: It is highly advisable to use a separate account for each service. When

    installing SQL Server in single-server mode, you can opt to have these provisioned for

    you. These automatically-generated accounts are referred to as virtual accounts. Each

    virtual account has an equivalent Service SID, with the same name. The installer also

    creates an equivalent SQL Server login, also with the same name. Applying folder and

    file permissions to Service SIDs, rather than to domain accounts or local computer

    accounts, provides tighter control, because these permissions are available only to the

    specific service when it is running, and not in any other context. (However, when using

    failover clustering, a domain account must be specified at installation, rather than a

    virtual account.) For more on this topic, see http://msdn.microsoft.com/enus/library/ms143504(v=sql.130).aspx.

    Note 2: Tips for adding a service SID/virtual account to a folder''s permission list.

