- id: '1.55'
  title: SQL6-D0-011900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must disable network functions, ports, protocols, and services deemed by the organization to be
    nonsecure, in accord with the Ports, Protocols, and Services Management (PPSM) guidance. GROUP ID: V-213990 RULE ID: SV-213990r961470'
  rationale: Use of nonsecure network functions, ports, protocols, and services exposes the system to avoidable threats.
  impact: ''
  references: []
  page_start: 135
  audit_raw: 'SQL Server must only use approved network communication libraries, ports, and

    protocols.

    Obtain a list of all approved network libraries, communication ports, and protocols from

    the server documentation.

    Verify that the protocols are enabled for the instance.

    If any ports or protocols are used that are not specifically approved in the server

    documentation, this is a finding.'
  remediation: 'Assign the approved TCP/IP port number to the SQL Server Database Engine.

    1. In SQL Server Configuration Manager, in the console pane, expand SQL Server

    Network Configuration, expand Protocols for <instance name>, and then

    double-click TCP/IP.

    2. In the "TCP/IP Properties" dialog box, on the "IP Addresses" tab, several IP

    addresses appear in the format IP1, IP2, up to IPAll. One of these is for the IP

    address of the loopback adapter, 127.0.0.1. Additional IP addresses appear for

    each IP Address on the computer. (You will probably see both IP version 4 and

    IP version 6 addresses.) Right-click each address, and then click "Properties" to

    identify the IP address that you want to configure.

    3. If the "TCP Dynamic Ports" dialog box contains "0", indicating the Database

    Engine is listening on dynamic ports, delete the 0.

    4. In the "IPn Properties area" box, in the "TCP Port" box, type the port number you

    want this IP address to listen on, and then click "OK".

    5. In the console pane, click "SQL Server Services".

    6. In the details pane, right-click "SQL Server ()" and then click "Restart", to stop

    and restart SQL Server.

    To disable a server network protocol for an instance:

    1. In SQL Server Configuration Manager, in the console pane, expand SQL Server

    Network Configuration.

    2. In the console pane, click "Protocols" for .

    3. In the details pane, right-click the protocol you want to change, and then click

    "Enable" or "Disable".

    4. In the console pane, click "SQL Server Services".

    5. In the details pane, right-click "SQL Server ()", and then click "Restart", to stop

    and restart the SQL Server service'
  checks:
  - type: manual_review
    info: 'SQL Server must only use approved network communication libraries, ports, and

      protocols.

      Obtain a list of all approved network libraries, communication ports, and protocols from

      the server documentation.

      Verify that the protocols are enabled for the instance.

      If any ports or protocols are used that are not specifically approved in the server

      documentation, this is a finding.'
    severity: medium
- id: '1.56'
  title: SQL6-D0-012300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must maintain a separate execution domain for each executing process. GROUP ID: V-213991 RULE ID:
    SV-213991r961608'
  rationale: Database management systems can maintain separate execution domains for each executing process by assigning each
    process a separate address space. Each process has a distinct address space so that communication between processes is
    controlled through the security functions, and one process cannot modify the executing code of another process. Maintaining
    separate execution domains for executing processes can be achieved, for example, by implementing separate address spaces.
  impact: ''
  references: []
  page_start: 137
  audit_raw: 'Review the server documentation to determine whether use of CLR assemblies is

    required. Run the following query to determine whether CLR is enabled for the instance:

    SELECT name, value, value_in_use

    FROM sys.configurations

    WHERE name = ''clr enabled''

    If value_in_use is a 1 and CLR is not required, this is a finding.'
  remediation: 'Disable CLR support in SQL Server by executing the following query:

    EXEC sp_configure ''clr enabled'', 0

    GO

    RECONFIGURE

    GO'
  checks:
  - type: sql
    command: SELECT name, value, value_in_use
    severity: medium
    info: 'Review the server documentation to determine whether use of CLR assemblies is

      required. Run the following query to determine whether CLR is enabled for the instance:

      SELECT name, value, value_in_use

      FROM sys.configurations

      WHERE name = ''clr enabled''

      If value_in_use is a 1 and CLR is not required, this is a finding.'
- id: '1.57'
  title: SQL6-D0-012400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server services must be configured to run under unique dedicated user accounts. GROUP ID: V-213992 RULE
    ID: SV-213992r961608'
  rationale: Database management systems can maintain separate execution domains for each executing process by assigning each
    process a separate address space. Each process has a distinct address space so that communication between processes is
    controlled through the security functions, and one process cannot modify the executing code of another process. Maintaining
    separate execution domains for executing processes can be achieved, for example, by implementing separate address spaces.
  impact: ''
  references: []
  page_start: 139
  audit_raw: 'Review the server documentation to obtain a listing of required service accounts.

    Review the accounts configured for all SQL Server services installed on the server.

    Click Start >> Type "SQL Server Configuration Manager" >> Launch the program >>

    Click SQL Server Services tree node. Review the "Log On As" column for each service.

    If any services are configured with the same service account or are configured with an

    account that is not documented and authorized, this is a finding.'
  remediation: 'Configure SQL Server services to have a documented, dedicated account.

    For non-domain servers, consider using virtual service accounts (VSA). See

    https://msdn.microsoft.com/en-us/library/ms143504.aspx#VA_Desc for more

    information.

    For standalone, domain-joined servers, consider using managed service accounts. See

    https://msdn.microsoft.com/en-us/library/ms143504.aspx#MSA for more information.

    For clustered instances, consider using group managed service accounts. See

    https://msdn.microsoft.com/en-us/library/ms143504.aspx#GMSA or

    https://blogs.msdn.microsoft.com/markweberblog/2016/05/25/group-managed-serviceaccounts-gmsa-and-sql-server-2016/ for
    more information.'
  checks:
  - type: manual_review
    info: 'Review the server documentation to obtain a listing of required service accounts.

