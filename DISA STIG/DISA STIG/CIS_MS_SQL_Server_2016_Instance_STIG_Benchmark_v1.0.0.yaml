  references: []
  page_start: 32
  audit_raw: "Obtain the list of approved audit maintainers from the system documentation.\nReview the server roles and individual\
    \ logins that have the following role memberships,\nall of which enable the ability to create and maintain audit definitions.\n\
    sysadmin\ndbcreator\nReview the server roles and individual logins that have the following permissions, all of\nwhich\
    \ enable the ability to create and maintain audit definitions.\nALTER ANY SERVER AUDIT\nCONTROL SERVER\nALTER ANY DATABASE\n\
    CREATE ANY DATABASE\nUse the following query to determine the roles and logins that have the listed\npermissions:\nSELECT--\
    \ DISTINCT\n CASE\n WHEN SP.class_desc IS NOT NULL THEN\n CASE\n WHEN SP.class_desc = 'SERVER' AND S.is_linked = 0 THEN\n\
    'SERVER'\n WHEN SP.class_desc = 'SERVER' AND S.is_linked = 1 THEN\n'SERVER (linked)'\n ELSE SP.class_desc\n END\n WHEN\
    \ E.name IS NOT NULL THEN 'ENDPOINT'\n WHEN S.name IS NOT NULL AND S.is_linked = 0 THEN 'SERVER'\n WHEN S.name IS NOT\
    \ NULL AND S.is_linked = 1 THEN 'SERVER (linked)'\n WHEN P.name IS NOT NULL THEN 'SERVER_PRINCIPAL'\n ELSE '???'\n END\
    \ AS [Securable Class],\n CASE\n WHEN E.name IS NOT NULL THEN E.name\n WHEN S.name IS NOT NULL THEN S.name\n WHEN P.name\
    \ IS NOT NULL THEN P.name\n ELSE '???'\n END AS [Securable],\n P1.name AS [Grantee],\n P1.type_desc AS [Grantee Type],\n\
    \ sp.permission_name AS [Permission],\n sp.state_desc AS [State],\n P2.name AS [Grantor],\n P2.type_desc AS [Grantor Type],\n\
    R.name AS [Role Name]\nFROM\n sys.server_permissions SP\n INNER JOIN sys.server_principals P1\n ON P1.principal_id = SP.grantee_principal_id\n\
    \ INNER JOIN sys.server_principals P2\n ON P2.principal_id = SP.grantor_principal_id\n FULL OUTER JOIN sys.servers S\n\
    \ ON SP.class_desc = 'SERVER'\n AND S.server_id = SP.major_id\n FULL OUTER JOIN sys.endpoints E\n ON SP.class_desc = 'ENDPOINT'\n\
    \ AND E.endpoint_id = SP.major_id\n FULL OUTER JOIN sys.server_principals P\n ON SP.class_desc = 'SERVER_PRINCIPAL'\n\
