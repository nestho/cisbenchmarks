- id: '1.72'
  title: SQL6-D0-015100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must generate audit records showing starting and ending time for user access to the database(s).
    GROUP ID: V-214017 RULE ID: SV-214017r961830'
  rationale: For completeness of forensic analysis, it is necessary to know how long a user's (or other principal's) connection
    to SQL Server lasts. This can be achieved by recording disconnections, in addition to logons/connections, in the audit
    logs. Disconnection may be initiated by the user or forced by the system (as in a timeout) or result from a system or
    network failure. To the greatest extent possible, all disconnections must be logged.
