- id: '1.46'
  title: SQL6-D0-010400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must prevent non-privileged users from executing privileged functions, to include disabling, circumventing,
    or altering implemented security safeguards/countermeasures. GROUP ID: V-213979 RULE ID: SV-213979r961353'
  rationale: 'Preventing non-privileged users from executing privileged functions mitigates the risk that unauthorized individuals
    or processes may gain unnecessary access to information or privileges. System documentation should include a definition
    of the functionality considered privileged. Depending on circumstances, privileged functions can include, for example,
    establishing accounts, performing system integrity checks, or administering cryptographic key management activities. Non-privileged
    users are individuals that do not possess appropriate authorizations. Circumventing intrusion detection and prevention
    mechanisms or malicious code protection mechanisms are examples of privileged functions that require protection from non-privileged
    users. A privileged function in SQL Server/database context is any operation that modifies the structure of the database,
    its built-in logic, or its security settings. This would include all Data Definition Language (DDL) statements and all
    security-related statements. In an SQL environment, it encompasses, but is not necessarily limited to: • CREATE • ALTER
    • DROP • GRANT • REVOKE • DENY There may also be Data Manipulation Language (DML) statements that, subject to context,
    should be regarded as privileged. Possible examples include: TRUNCATE TABLE; DELETE, or DELETE affecting more than n rows,
    for some n, or DELETE without a WHERE clause; UPDATE or UPDATE affecting more than n rows, for some n, or UPDATE without
    a WHERE clause; Any SELECT, INSERT, UPDATE, or DELETE to an application-defined security table executed by other than
    a security principal. Depending on the capabilities of SQL Server and the design of the database and associated applications,
    the prevention of unauthorized use of privileged functions may be achieved by means of DBMS security features, database
    triggers, other mechanisms, or a combination of these.'
  impact: ''
  references: []
  page_start: 114
  audit_raw: "Review server-level securables and built-in role membership to ensure only authorized\nusers have privileged\
    \ access and the ability to create server-level objects and grant\npermissions to themselves or others.\nReview the system\
    \ documentation to determine the required levels of protection for\nDBMS server securables, by type of login.\nReview\
    \ the permissions in place on the server. If the actual permissions do not match\nthe documented requirements, this is\
    \ a finding.\nGet all permission assignments to logins and roles:\nSELECT DISTINCT\n CASE\n WHEN SP.class_desc IS NOT\
    \ NULL THEN\n CASE\n WHEN SP.class_desc = 'SERVER' AND S.is_linked = 0 THEN\n'SERVER'\n WHEN SP.class_desc = 'SERVER'\
    \ AND S.is_linked = 1 THEN\n'SERVER (linked)'\n ELSE SP.class_desc\n END\n WHEN E.name IS NOT NULL THEN 'ENDPOINT'\n WHEN\
    \ S.name IS NOT NULL AND S.is_linked = 0 THEN 'SERVER'\n WHEN S.name IS NOT NULL AND S.is_linked = 1 THEN 'SERVER (linked)'\n\
    \ WHEN P.name IS NOT NULL THEN 'SERVER_PRINCIPAL'\n ELSE '???'\n END AS [Securable Class],\n CASE\n WHEN E.name IS NOT\
    \ NULL THEN E.name\n WHEN S.name IS NOT NULL THEN S.name\n WHEN P.name IS NOT NULL THEN P.name\n ELSE '???'\n END AS [Securable],\n\
    \ P1.name AS [Grantee],\n P1.type_desc AS [Grantee Type],\n sp.permission_name AS [Permission],\n sp.state_desc AS [State],\n\
    \ P2.name AS [Grantor],\n P2.type_desc AS [Grantor Type]\nFROM\n sys.server_permissions SP\n INNER JOIN sys.server_principals\
    \ P1\n ON P1.principal_id = SP.grantee_principal_id\n INNER JOIN sys.server_principals P2\n ON P2.principal_id = SP.grantor_principal_id\n\
    \ FULL OUTER JOIN sys.servers S\n ON SP.class_desc = 'SERVER'\n AND S.server_id = SP.major_id\n FULL OUTER JOIN sys.endpoints\
    \ E\n ON SP.class_desc = 'ENDPOINT'\n AND E.endpoint_id = SP.major_id\n FULL OUTER JOIN sys.server_principals P\n ON SP.class_desc\
    \ = 'SERVER_PRINCIPAL'\n AND P.principal_id = SP.major_id\nGet all server role memberships:\nSELECT\n R.name AS [Role],\n\
    \ M.name AS [Member]\nFROM\n sys.server_role_members X\n INNER JOIN sys.server_principals R ON R.principal_id =\nX.role_principal_id\n\
    \ INNER JOIN sys.server_principals M ON M.principal_id =\nX.member_principal_id\nThe CONTROL SERVER permission is similar\
    \ but not identical to the sysadmin fixed server\nrole. Permissions do not imply role memberships and role memberships\
    \ do not grant\npermissions. (e.g., CONTROL SERVER does not imply membership in the sysadmin fixed\nserver role.)\nEnsure\
    \ only the documented and approved logins have privileged functions in SQL\nServer.\nIf the current configuration does\
    \ not match the documented baseline, this is a finding."
  remediation: 'Restrict the granting of permissions to server-level securables to only those authorized.

    Most notably, members of sysadmin and securityadmin built-in instance-level roles,

    CONTROL SERVER permission, and use of the GRANT with GRANT permission.'
  checks:
  - type: manual_review
    info: 'Review server-level securables and built-in role membership to ensure only authorized

