- id: '1.36'
  title: SQL6-D0-008700
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'SQL Server must use NIST FIPS 140-2 or 140-3 validated cryptographic modules for cryptographic operations.
    GROUP ID: V-213969 RULE ID: SV-213969r961050'
  rationale: 'Use of weak or not validated cryptographic algorithms undermines the purposes of utilizing encryption and digital
    signatures to protect data. Weak algorithms can be easily broken, and not validated cryptographic modules may not implement
    algorithms correctly. Unapproved cryptographic modules or algorithms should not be relied on for authentication, confidentiality,
    or integrity. Weak cryptography could allow an attacker to gain access to, and modify data stored in, the database as
    well as the administration settings of SQL Server. Applications, including DBMSs, utilizing cryptography are required
    to use approved NIST FIPS 140-2 or 140-3 validated cryptographic modules that meet the requirements of applicable federal
    laws, Executive Orders, directives, policies, regulations, standards, and guidance. NSA Type- (where =1, 2, 3, 4) products
    are NSA-certified, hardware-based encryption modules. The standard for validating cryptographic modules will transition
    to the NIST FIPS 140-3 publication. FIPS 140-2 modules can remain active for up to five years after validation or until
    September 21, 2026, when the FIPS 140-2 validations will be moved to the historical list. Even on the historical list,
    CMVP supports the purchase and use of these modules for existing systems. While Federal Agencies decide when they move
    to FIPS 140-3 only modules, purchasers are reminded that for several years there may be a limited selection of FIPS 140-3
    modules from which to choose. CMVP recommends purchasers consider all modules that appear on the Validated Modules Search
    Page: https://csrc.nist.gov/projects/cryptographic-module-validation-program/validatedmodules More information on the
    FIPS 140-3 transition can be found here: https://csrc.nist.gov/Projects/fips-140-3-transition-effort/'
  impact: ''
  references: []
  page_start: 93
  audit_raw: 'In Windows, open Administrative Tools >> Local Security Policy. Expand Local Policies

    >> Security Options. In the right-side pane, find "System cryptography: Use FIPS

