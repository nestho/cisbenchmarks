      that the version is supported by security patches to known vulnerability. Review the

      Support dates at: https://learn.microsoft.com/en-us/troubleshoot/sql/releases/downloadand-install-latest-updates

      Check the SQL Server version by running the following script: Print @@version

      If the SQL Server version is not shown as supported'
    severity: medium
