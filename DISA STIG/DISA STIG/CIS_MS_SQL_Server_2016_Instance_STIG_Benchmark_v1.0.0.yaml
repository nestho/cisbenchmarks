    \ filegroups.\nALTER DATABASE <name> REMOVE FILEGROUP <file name>\n5. Disable FILESTREAM.\nEXEC sp_configure filestream_access_level,\
    \ 0\n RECONFIGURE\n6. Restart the SQL Service"
