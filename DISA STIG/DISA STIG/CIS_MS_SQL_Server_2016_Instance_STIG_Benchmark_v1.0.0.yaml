- id: '1.87'
  title: SQL6-D0-016700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server execute permissions to access the registry must be revoked, unless specifically required and approved.
    GROUP ID: V-214033 RULE ID: SV-214033r960963'
  rationale: Information systems are capable of providing a wide variety of functions and services. Some of the functions
    and services, provided by default, may not be necessary to support essential organizational operations (e.g., key missions,
    functions). It is detrimental for applications to provide, or install by default, functionality exceeding requirements
    or mission objectives. Applications must adhere to the principles of least functionality by providing only essential capabilities.
    SQL Server may spawn additional external processes to execute procedures that are defined in the SQL Server but stored
    in external host files (external procedures). The spawned process used to execute the external procedure may operate within
    a different OS security context than SQL Server and provide unauthorized access to the host system. The registry contains
    sensitive information, including password hashes as well as clear text passwords. Registry extended stored procedures
    allow Microsoft SQL Server to access the machine's registry. The sensitivity of these procedures are exacerbated if Microsoft
    SQL Server is run under the Windows account LocalSystem. LocalSystem can read and write nearly all values in the registry,
    even those not accessible by the Administrator. Unlike the xp_cmdshell extended stored procedure, which runs under a separate
    context if executed by a login not in the sysadmin role, the registry extended stored procedures always execute under
    the security context of the MSSQLServer service. Because the sensitive information is stored in the registry, it is essential
    that access to that information be properly guarded.
  impact: ''
  references: []
  page_start: 206
  audit_raw: "To determine if permissions to execute registry extended stored procedures have been\nrevoked from all users\
    \ (other than dbo), execute the following command:\nSELECT OBJECT_NAME(major_id) AS [Stored Procedure]\n,dpr.NAME AS [Principal]\n\
    FROM sys.database_permissions AS dp\nINNER JOIN sys.database_principals AS dpr ON dp.grantee_principal_id =\ndpr.principal_id\n\
    WHERE major_id IN (\n OBJECT_ID('xp_regaddmultistring')\n,OBJECT_ID('xp_regdeletekey')\n,OBJECT_ID('xp_regdeletevalue')\n\
    ,OBJECT_ID('xp_regenumvalues')\n,OBJECT_ID('xp_regenumkeys')\n,OBJECT_ID('xp_regremovemultistring')\n,OBJECT_ID('xp_regwrite')\n\
    ,OBJECT_ID('xp_instance_regaddmultistring')\n,OBJECT_ID('xp_instance_regdeletekey')\n,OBJECT_ID('xp_instance_regdeletevalue')\n\
    ,OBJECT_ID('xp_instance_regenumkeys')\n,OBJECT_ID('xp_instance_regenumvalues')\n,OBJECT_ID('xp_instance_regremovemultistring')\n\
    ,OBJECT_ID('xp_instance_regwrite')\n)\nAND dp.[type] = 'EX'\nORDER BY dpr.NAME;\nIf any records are returned, review the\
    \ system documentation to determine whether the\naccessing of the registry via extended stored procedures are required\
    \ and authorized. If\nit is not authorized, this is a finding."
  remediation: 'Remove execute permissions to any registry extended stored procedure from all users

    (other than dbo).

    USE master

    GO

    REVOKE EXECUTE ON [<procedureName>] FROM [<principal>]

    GO'
