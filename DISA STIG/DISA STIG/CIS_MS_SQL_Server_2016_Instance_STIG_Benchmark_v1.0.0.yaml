- id: '1.99'
  title: SQL6-D0-018100
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'When using command-line tools such as SQLCMD in a mixed-mode authentication environment, users must use a
    logon method that does not expose the password. GROUP ID: V-214045 RULE ID: SV-214045r961047'
  rationale: To prevent the compromise of authentication information, such as passwords and PINs, during the authentication
    process, the feedback from the information system must not provide any information that would allow an unauthorized user
    to compromise the authentication mechanism. Obfuscation of user-provided information when typed into the system is a method
    used in addressing this risk. For example, displaying asterisks when a user types in a password or PIN, is an example
    of obscuring feedback of authentication information. This requirement is applicable when mixed-mode authentication is
    enabled. When this is the case, password-authenticated accounts can be created in and authenticated by SQL Server. Other
    STIG requirements prohibit the use of mixed-mode authentication except when justified and approved. This deals with the
    exceptions. SQLCMD and other command-line tools are part of any SQL Server installation. These tools can accept a plain-text
    password, but do offer alternative techniques. Since the typical user of these tools is a database administrator, the
    consequences of password compromise are particularly serious. Therefore, the use of plain-text passwords must be prohibited,
    as a matter of practice and procedure.
  impact: ''
  references: []
  page_start: 230
  audit_raw: 'Run this query to determine whether SQL Server authentication is enabled:

    EXEC master.sys.xp_loginconfig ''login mode'';

    If the config_value returned is Windows NT Authentication, this is not a finding.

    For SQLCMD, which cannot be configured not to accept a plain-text password, and any

    other essential tool with the same limitation, verify that the system documentation

    explains the need for the tool, who uses it, and any relevant mitigations; and that AO

    approval has been obtained; if not, this is a finding.

    Request evidence that all users of the tool are trained in the importance of not using the

    plain-text password option and in how to keep the password hidden; and that they

    adhere to this practice; if not, this is a finding.'
  remediation: 'Where possible, change the login mode to Windows-only:

    USE [master]

    GO

    EXEC xp_instance_regwrite N''HKEY_LOCAL_MACHINE'',

    N''Software\Microsoft\MSSQLServer\MSSQLServer'', N''LoginMode'', REG_DWORD, 1;

    GO

    If mixed-mode authentication is necessary, then for SQLCMD, which cannot be configured

    not to accept a plain-text password when mixed-mode authentication is enabled, and

    any other essential tool with the same limitation:

    1. Document the need for it, who uses it, and any relevant mitigations, and obtain

    AO approval.

    2. Train all users of the tool in the importance of not using the plain-text password

    option and in how to keep the password hidden.'
  checks:
  - type: manual_review
    info: 'Run this query to determine whether SQL Server authentication is enabled:

      EXEC master.sys.xp_loginconfig ''login mode'';

      If the config_value returned is Windows NT Authentication, this is not a finding.

      For SQLCMD, which cannot be configured not to accept a plain-text password, and any

      other essential tool with the same limitation, verify that the system documentation

      explains the need for the tool, who uses it, and any relevant mitigations; and that AO

      approval has been obtained; if not, this is '
    severity: medium
- id: '1.100'
  title: SQL6-D0-018200
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Applications must obscure feedback of authentication information during the authentication process to protect
    the information from possible exploitation/use by unauthorized individuals. GROUP ID: V-214046 RULE ID: SV-214046r961047'
  rationale: To prevent the compromise of authentication information, such as passwords and PINs, during the authentication
    process, the feedback from the information system must not provide any information that would allow an unauthorized user
    to compromise the authentication mechanism. Obfuscation of user-provided information when typed into the system is a method
    used in addressing this risk. For example, displaying asterisks when a user types in a password or PIN, is an example
    of obscuring feedback of authentication information. Database applications may allow for entry of the account name and
    password as a visible parameter of the application execution command. This practice must be prohibited and disabled to
    prevent shoulder surfing.
  impact: ''
  references: []
  page_start: 232
  audit_raw: 'Determine whether any applications that access the database allow for entry of the

    account name and password, or PIN.

    If any do, determine whether these applications obfuscate authentication data; if they do

    not, this is a finding.'
  remediation: Configure or modify applications to prohibit display of passwords in clear text.
  checks:
  - type: manual_review
    info: 'Determine whether any applications that access the database allow for entry of the

      account name and password, or PIN.

      If any do, determine whether these applications obfuscate authentication data; if they do

      not, this is a finding.'
    severity: medium
- id: '1.101'
  title: SQL6-D0-018300
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Microsoft SQL Server products must be a version supported by the vendor. GROUP ID: V-265870 RULE ID: SV-265870r999516'
  rationale: Unsupported commercial and database systems should not be used because fixes to newly identified bugs will not
    be implemented by the vendor. The lack of support can result in potential vulnerabilities. Systems at unsupported servicing
    levels or releases will not receive security updates for new vulnerabilities, which leaves them subject to exploitation.
    When maintenance updates and patches are no longer available, the database software is no longer considered supported
    and should be upgraded or decommissioned.
  impact: ''
  references: []
  page_start: 234
  audit_raw: 'Review the system documentation and interview the database administrator.

    Identify all database software components.

    Review the version and release information.

    Verify the SQL Server version via one of the following methods:

    Connect to the server by using Object Explorer in SQL Server Management Studio.

    After Object Explorer is connected, it will show the version information in parentheses,

    together with the user name that is used to connect to the specific instance of SQL

    Server.

    Or, from SQL Server Management Studio:

    SELECT @@VERSION;

    More information for finding the version is available at the following link:

    https://learn.microsoft.com/en-us/troubleshoot/sql/releases/find-my-sql-version

    Access the vendor website or use other means to verify the version is still supported.

    https://learn.microsoft.com/en-us/lifecycle/products/sql-server-2016

    If the installed version or any of the software components are not supported by the

    vendor, this is a finding.'
  remediation: 'Remove or decommission all unsupported software products.

    Upgrade unsupported DBMS or unsupported components to a supported version of the

    product.'
