- id: '1.62'
  title: SQL6-D0-013400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must generate audit records when successful and unsuccessful attempts to add privileges/permissions
    occur. GROUP ID: V-214000 RULE ID: SV-214000r961800'
  rationale: 'Changes in the permissions, privileges, and roles granted to users and roles must be tracked. Without an audit
    trail, unauthorized elevation or restriction of privileges could go undetected. Elevated privileges give users access
    to information and functionality that they should not have; restricted privileges wrongly deny access to authorized users.
    In an SQL environment, adding permissions is typically done via the GRANT command, or, in the negative, the DENY command.
    To aid in diagnosis, it is necessary to keep track of failed attempts in addition to the successful ones. Satisfies: SRG-APP-000495-DB-000326'
  impact: ''
  references: []
