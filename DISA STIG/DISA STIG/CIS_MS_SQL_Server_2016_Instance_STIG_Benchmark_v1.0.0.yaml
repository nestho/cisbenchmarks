- id: '1.20'
  title: SQL6-D0-006800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Database software, including DBMS configuration files, must be stored in dedicated directories, separate from
    the host OS and other applications. GROUP ID: V-213953 RULE ID: SV-213953r960960'
  rationale: When dealing with change control issues, it should be noted any changes to the hardware, software, and/or firmware
    components of the information system and/or application can potentially have significant effects on the overall security
    of the system. Multiple applications can provide a cumulative negative effect. A vulnerability and subsequent exploit
    to one application can lead to an exploit of other applications sharing the same security context. For example, an exploit
    to a web server process that leads to unauthorized administrative access to host system directories can most likely lead
    to a compromise of all applications hosted by the same system. Database software not installed using dedicated directories
    both threatens and is threatened by other hosted applications. Access controls defined for one application may by default
    provide access to the other application's database objects or directories. Any method that provides any level of separation
    of security context assists in the protection between applications.
  impact: ''
  references: []
  page_start: 57
  audit_raw: 'Determine the directory in which SQL Server has been installed:

    Using SQL Server Management Studio''s Object Explorer:

    • Right-click [SQL Server Instance]

    • Select "Facets"

    • Record the value of RootDirectory

    Determine the Operating System directory:

    • Click "Start"

    • Type "Run"

    • Press "Enter"

    • Type %windir%

    • Click "Ok"

    • Record the value in the address bar

    Verify the SQL Server RootDirectory is not in the Operating System directory.

    Compare the SQL RootDirectory and the Operating System directory. If the SQL

    RootDirectory is in the same directory as the Operating System, this is a finding.

    Verify the SQL Server RootDirectory is not in another application''s directory.

    Navigate to the SQL RootDirectory using Windows Explorer.

    Examine each directory for evidence another application is stored in it.

    If evidence exists the SQL RootDirectory is in another application''s directory, this is a

    finding.

    If the SQL RootDirectory is not in the Operating System directory or another

    application''s directory. This is not a finding.

    Examples:

    1. The Operating System directory is C:\Windows. The SQL RootDirectory is

    D:\Program Files\MSSQLSERVER\MSSQL. The MSSQLSERVER directory is not

    living in the Operating System directory or the directory of another application.

    This is not a finding.

    2. The Operating System directory is C:\Windows. The SQL RootDirectory is

    C:\Windows\MSSQLSERVER\MSSQL. This is a finding.

    3. The Operating System directory is C:\Windows. The SQL RootDirectory is

    D:\Program Files\Microsoft Office\MSSQLSERVER\MSSQL. The

    MSSQLSERVER directory is in the Microsoft Office directory, which indicates

    Microsoft Office is installed here. This is a finding.'
  remediation: 'Re-install SQL Server application components using dedicated directories that are

    separate from the operating system.

    Relocate or reinstall other application software that currently shares directories with

    SQL Server components.

    Separate from the operating system and/or temporary storage.'
  checks:
  - type: manual_review
    info: 'Determine the directory in which SQL Server has been installed:

