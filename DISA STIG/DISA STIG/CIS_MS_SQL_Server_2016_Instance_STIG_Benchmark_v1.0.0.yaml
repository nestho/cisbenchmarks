      JO'
- id: '1.48'
  title: SQL6-D0-010900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must allocate audit record storage capacity in accordance with organization-defined audit record
    storage requirements. GROUP ID: V-213983 RULE ID: SV-213983r1018595'
  rationale: 'In order to ensure sufficient storage capacity for the audit logs, SQL Server must be able to allocate audit
    record storage capacity. Although another requirement (SRGAPP-000515-DB-000318) mandates that audit data be off-loaded
    to a centralized log management system, it remains necessary to provide space on the database server to serve as a buffer
    against outages and capacity limits of the off-loading mechanism. The task of allocating audit record storage capacity
    is usually performed during initial installation of SQL Server and is closely associated with the DBA and system administrator
    roles. The DBA or system administrator will usually coordinate the allocation of physical drive space with the application
    owner/installer and the application will prompt the installer to provide the capacity information, the physical location
    of the disk, or both. In determining the capacity requirements, consider such factors as: total number of users; expected
    number of concurrent users during busy periods; number and type of events being monitored; types and amounts of data being
    captured; the frequency/speed with which audit records are off-loaded to the central log management system; and any limitations
    that exist on SQL Server''s ability to reuse the space formerly occupied by off-loaded records.'
  impact: ''
  references: []
  page_start: 119
  audit_raw: 'If the database is setup to write audit logs using APPLICATION or SECURITY event logs

    rather than writing to a file, this is Not Applicable.

    Check the server documentation for the SQL Audit file size configurations. Locate the

    Audit file path and drive.

    SELECT max_file_size, max_rollover_files, log_file_path AS "Audit Path"

    FROM sys.server_file_audits

    Calculate the space needed as the maximum file size and number of files from the SQL

    Audit File properties.

    If the calculated product of the max_file_size times the max_rollover_files

    exceeds the size of the storage location, this is a finding;

    OR if max_file_size is set to 0 (Unlimited), this is a finding;

    OR if max_rollover_files are set to 0 (None) or 2147483647 (Unlimited), this is a

    finding.'
  remediation: 'Review the SQL Audit file location; ensure the destination has enough space available

    to accommodate the maximum total size of all files that could be written.

    Configure the maximum number of audit log files that are to be generated, staying

    within the number of logs the system was sized to support.

    Update the max_files or max_rollover_files parameter of the audits to ensure the

    correct number of files is defined.

    If writing to application event logs or security logs, space considerations are covered in

    the Windows Server STIGs. Be sure to reference these depending on the OS in use.'
  checks:
  - type: sql
    command: SELECT max_file_size, max_rollover_files, log_file_path AS "Audit Path"
    severity: medium
    info: 'If the database is setup to write audit logs using APPLICATION or SECURITY event logs

      rather than writing to a file, this is Not Applicable.

      Check the server documentation for the SQL Audit file size configurations. Locate the

      Audit file path and drive.

      SELECT max_file_size, max_rollover_files, log_file_path AS "Audit Path"

      FROM sys.server_file_audits

      Calculate the space needed as the maximum file'
- id: '1.49'
  title: SQL6-D0-011000
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must provide a warning to appropriate support staff when allocated audit record storage volume
    reaches 75% of maximum audit record storage capacity. GROUP ID: V-213984 RULE ID: SV-213984r961398'
  rationale: Organizations are required to use a central log management system, so, under normal conditions, the audit space
    allocated to SQL Server on its own server will not be an issue. However, space will still be required on the server for
    SQL Server audit records in transit, and, under abnormal conditions, this could fill up. Since a requirement exists to
    halt processing upon audit failure, a service outage would result. If support personnel are not notified immediately upon
    storage volume utilization reaching 75%, they are unable to plan for storage capacity expansion. The appropriate support
    staff include, at a minimum, the ISSO and the DBA/SA. Monitoring of free space can be accomplished using Microsoft System
    Center or a thirdparty monitoring tool.
  impact: ''
  references: []
  page_start: 121
  audit_raw: 'The operating system and SQL Server offer a number of methods for checking the drive

    or volume free space. Locate the destination drive where SQL Audits are stored and

    review system configuration.

    If no alert exist to notify support staff in the event the SQL Audit drive reaches 75%, this

    is a finding.'
  remediation: 'Utilize operating system alerting mechanisms, SQL Agent, Operations Management

    tools, and/or third-party tools to configure the system to notify appropriate support staff

    immediately upon storage volume utilization reaching 75%.'
  checks:
  - type: manual_review
    info: 'The operating system and SQL Server offer a number of methods for checking the drive

      or volume free space. Locate the destination drive where SQL Audits are stored and

      review system configuration.

      If no alert exist to notify support staff in the event the SQL Audit drive reaches 75%, this

      is a finding.'
    severity: medium
- id: '1.50'
  title: SQL6-D0-011100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server must provide an immediate real-time alert to appropriate support staff of all audit log failures.
    GROUP ID: V-213985 RULE ID: SV-213985r961401'
  rationale: It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit logs
    as required. Without a real-time alert, security personnel may be unaware of an impending failure of the audit capability,
    and system operation may be adversely affected. The appropriate support staff include, at a minimum, the ISSO and the
    DBA/SA. A failure of database auditing will result in either the database continuing to function without auditing or in
    a complete halt to database operations. When audit processing fails, appropriate personnel must be alerted immediately
    to avoid further downtime or unaudited transactions Alerts provide organizations with urgent messages. Real-time alerts
    provide these messages immediately (i.e., the time from event detection to alert occurs in seconds or less). Alerts can
    be generated using tools like the SQL Server Agent Alerts and Database Mail.
  impact: ''
  references: []
  page_start: 123
  audit_raw: 'Review SQL Server settings, OS, or third-party logging software settings to determine

    whether a real-time alert will be sent to the appropriate personnel when auditing fails for

    any reason.

    If real-time alerts are not sent upon auditing failure, this is a finding.'
  remediation: 'Configure the system to provide immediate real-time alerts to appropriate support staff

    when an audit log failure occurs.'
