  description: 'The system SQL Server must off-load audit data to a separate log management facility; this must be continuous
    and in near real time for systems with a network connection to the storage facility and weekly or more often for stand-alone
    systems. GROUP ID: V-214025 RULE ID: SV-214025r961860'
  rationale: Information stored in one location is vulnerable to accidental or incidental deletion or alteration. Off-loading
    is a common process in information systems with limited audit storage capacity. The system SQL Server may write audit
    records to database tables, to files in the file system, to other kinds of local repository, or directly to a centralized
    log management system. Whatever the method used, it must be compatible with off-loading the records to the centralized
    system.
  impact: ''
  references: []
  page_start: 189
  audit_raw: 'Review the system documentation for a description of how audit records are off-loaded.

    If the system has a continuous network connection to the centralized log management

    system, but the DBMS audit records are not written directly to the centralized log

    management system or transferred in near-real-time, this is a finding.

    If the system does not have a continuous network connection to the centralized log

    management system, and the DBMS audit records are not transferred to the centralized

    log management system weekly or more often, this is a finding.'
  remediation: 'Configure the system or deploy and configure software tools to transfer audit records to

    a centralized log management system, continuously and in near-real time where a

    continuous network connection to the log management system exists, or at least weekly

    in the absence of such a connection.'
