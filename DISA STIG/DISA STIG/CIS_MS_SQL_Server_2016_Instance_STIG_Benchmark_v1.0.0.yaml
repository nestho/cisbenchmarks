- id: '1.82'
  title: SQL6-D0-016200
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The SQL Server default account [sa] must be disabled. GROUP ID: V-214028 RULE ID: SV-214028r960792'
  rationale: SQL Server's [sa] account has special privileges required to administer the database. The [sa] account is a well-known
    SQL Server account and is likely to be targeted by attackers and thus more prone to providing unauthorized access to the
    database. This [sa] default account is administrative and could lead to catastrophic consequences, including the complete
    loss of control over SQL Server. If the [sa] default account is not disabled, an attacker might be able to gain access
    through the account. SQL Server by default disables the [sa] account at installation. Some applications that run on SQL
    Server require the [sa] account to be enabled for the application to function properly. These applications that require
    the [sa] account to be enabled are usually legacy systems.
  impact: ''
  references: []
  page_start: 196
  audit_raw: 'Check SQL Server settings to determine if the [sa] (system administrator) account has

    been disabled by executing the following query:

    USE master;

    GO

    SELECT name, is_disabled

    FROM sys.sql_logins

    WHERE principal_id = 1;

    GO

    Verify that the "name" column contains the current name of the [sa] database server

    account.

    If the is_disabled column is not set to 1, this is a finding.'
  remediation: 'Modify the enabled flag of SQL Server''s [sa] (system administrator) account by running

    the following script.

    USE master;

    GO

    ALTER LOGIN [sa] DISABLE;

    GO'
  checks:
  - type: sql
    command: SELECT name, is_disabled
    severity: medium
    info: 'Check SQL Server settings to determine if the [sa] (system administrator) account has

      been disabled by executing the following query:

      USE master;

      GO

      SELECT name, is_disabled

      FROM sys.sql_logins

      WHERE principal_id = 1;

      GO

      Verify that the "name" column contains the current name of the [sa] database server

      account.

      If the is_disabled column is not set to 1, this is a finding.'
- id: '1.83'
  title: SQL6-D0-016300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'SQL Server default account [sa] must have its name changed. GROUP ID: V-214029 RULE ID: SV-214029r960963'
  rationale: SQL Server's [sa] account has special privileges required to administer the database. The [sa] account is a well-known
    SQL Server account name and is likely to be targeted by attackers, and is thus more prone to providing unauthorized access
    to the database. Since the SQL Server [sa] is administrative in nature, the compromise of a default account can have catastrophic
    consequences, including the complete loss of control over SQL Server. Since SQL Server needs for this account to exist
    and it should not be removed, one way to mitigate this risk is to change the [sa] account name.
  impact: ''
  references: []
  page_start: 198
  audit_raw: 'Verify the SQL Server default [sa] (system administrator) account name has been

    changed by executing the following query:

    USE master;

    GO

    SELECT *

    FROM sys.sql_logins

    WHERE [name] = ''sa'' OR [principal_id] = 1;

    GO

    If the login account name SA or sa appears in the query output, this is a finding.'
  remediation: 'Modify the SQL Server''s [sa] (system administrator) account by running the following

    script:

    USE master;

    GO

    ALTER LOGIN [sa] WITH NAME = <new name>

    GO'
  checks:
  - type: sql
    command: SELECT *
    severity: medium
    info: 'Verify the SQL Server default [sa] (system administrator) account name has been

      changed by executing the following query:

      USE master;

