      Click Start >> Type "SQL Server Configuration Manager" >> Launch the program >>

      Click SQL Server Services tree node. Review the "Log On As" column for each service.

      If any services are configured with the same service account or are configured with an

      account that is not documented and authorized, this is a finding.'
    severity: medium
- id: '1.58'
  title: SQL6-D0-012700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'When updates are applied to SQL Server software, any software components that have been replaced or made unnecessary
    must be removed. GROUP ID: V-213993 RULE ID: SV-213993r961677'
  rationale: Previous versions of DBMS components that are not removed from the information system after updates have been
    installed may be exploited by adversaries. Some DBMSs' installation tools may remove older versions of software automatically
    from the information system. In other cases, manual review and removal will be required. In planning installations and
    upgrades, organizations must include steps (automated, manual, or both) to identify and remove the outdated modules. A
    transition period may be necessary when both the old and the new software are required. This should be taken into account
    in the planning.
  impact: ''
  references: []
  page_start: 141
  audit_raw: 'From the server documentation, obtain a listing of required components.

    Generate a listing of components installed on the server.

    Click Start >> Type "SQL Server 2016 Installation Center" >> Launch the program >>

    Click Tools >> Click "Installed SQL Server features discovery report"

    Compare the feature listing against the required components listing. If any features are

    installed, but are not required, this is a finding.'
  remediation: Remove all features that are not required.
  checks:
  - type: manual_review
    info: 'From the server documentation, obtain a listing of required components.

      Generate a listing of components installed on the server.

      Click Start >> Type "SQL Server 2016 Installation Center" >> Launch the program >>

