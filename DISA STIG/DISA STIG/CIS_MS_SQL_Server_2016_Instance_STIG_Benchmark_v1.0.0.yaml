    LEFT OUTER JOIN sys.server_principals R\nON SRM.role_principal_id = R.principal_id\nWHERE sp.permission_name IN ('ALTER\
    \ ANY SERVER AUDIT','CONTROL SERVER','ALTER\nANY DATABASE','CREATE ANY DATABASE')\nOR R.name IN ('sysadmin','dbcreator')\n\
    If any of the logins, roles, or role memberships returned have permissions that are not\ndocumented, or the documented\
    \ audit maintainers do not have permissions, this is a\nfinding."
  remediation: 'Create a server role specifically for audit maintainers and give it permission to maintain

    audits without granting it unnecessary permissions (the role name used here is an

    example; other names may be used):

    CREATE SERVER ROLE SERVER_AUDIT_MAINTAINERS;

    GO

    GRANT ALTER ANY SERVER AUDIT TO SERVER_AUDIT_MAINTAINERS;

    GO

    Use REVOKE and/or DENY and/or ALTER SERVER ROLE ... DROP MEMBER ...

    statements to remove the ALTER ANY SERVER AUDIT permission from all logins. Then,

