  rationale: OS configuration practices as issued by the U.S. Computer Emergency Response Team (US CERT) and the National
    Institute of Standards and Technology's (NIST's) National Vulnerability Database (NVD), based on identified vulnerabilities
    that pertain to the application profile into which the name server software fits, must always be followed. In particular,
