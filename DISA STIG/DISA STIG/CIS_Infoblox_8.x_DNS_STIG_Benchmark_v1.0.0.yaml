    ACEs".

    6. When complete, click "Cancel" to exit the "Properties" screen.

    If Access Controls Lists (ACLs) are not configured for zone transfers to external nonGrid servers, this is a finding.'
  remediation: '1. Navigate to the Data Management >> DNS >> Zones tab.

    2. Select the zone and click "Edit". Select the "Zone Transfers" tab and configure

    access control (ACL or Access Control Entries [ACE]) on each grid member that

    communicates with an external secondary.

    3. When complete, click "Save & Close" to save the changes and exit the

    "Properties" screen.

    4. Perform a service restart if necessary.'
