- id: '1.48'
  title: IDNS-8X-500005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Infoblox systems that communicate with non-Grid DNS service members must use a unique Transaction Signature
    (TSIG). GROUP ID: V-233902 RULE ID: SV-233902r1082694'
  rationale: To enable zone transfer (requests and responses) through authenticated messages, it is necessary to generate
    a key for every pair of name servers. The key also can be used for securing other transactions, such as dynamic updates,
    DNS queries, and responses. The binary key string that is generated by most key generation utilities used with DNSSEC
    is Base64 encoded. TSIG is a string used to generate the message authentication hash stored in a TSIG resource record
    (RR) and used to authenticate an entire DNS message. The process of authenticating the source of a message and its integrity
    through hashbased message authentication codes (HMAC) is specified through a set of DNS specifications known collectively
    as TSIG. The sender of the message uses the HMAC function to generate a MAC and sends this MAC along with the message
    to the receiver. The receiver, who shares the same secret key, uses the key and HMAC function used by the sender to compute
    the MAC on the received message. The receiver then compares the computed MAC with the received MAC; if the two values
    match, it provides assurance that the message has been received correctly and that the sender belongs to the community
    of users sharing the same secret key. Thus, message source authentication and integrity verification are performed in
    a single process.
  impact: ''
  references: []
  page_start: 104
  audit_raw: '1. Navigate to Data Management >> DNS >> Zones tab.

    2. Review each zone by clicking "Edit" and inspecting the "NAME Servers" tab.

    3. If the all entries in the "Type" column are configured as "Grid", this check is Not

    Applicable.

    4. Verify that all DNS service members of type Ext (Primary or Secondary) have a

    TSIG key configured.

    5. Each zone that contains Ext non-Grid DNS service members must also be

    verified by inspection of the "Zone Transfers" tab and configuration of an Access

    Control Entry (ACE) that limits access to only the TSIG configured DNS service

    members.

    6. When complete, click "Cancel" to exit the "Properties" screen.

    If there is an external non-Grid system that uses zone transfers but does not have a

    DNS service member with a unique TSIG key, this is a finding.'
  remediation: '1. Navigate to Data Management >> DNS >> Zones tab.

    2. Select a zone identified in the Check and click "Edit".

    3. Click on the "Name Servers" tab and configure a unique TSIG key for each nonGrid DNS service member, designated as
    type Ext.

    4. Verify that the same TSIG key (Algorithm and Key Data) are configured on both

    DNS service members.

    5. Click on the "Zone Transfers" tab.

    6. If the DNS service member configured above is not present, click "Override" for

    the "Allow Zone Transfers to" section. Use the radio button to select "Set of

    ACEs" and the "Add" drop-down to configure the DNS service member

    configured above.

    7. When complete, click "Save & Close" to save the changes and exit the

    "Properties" screen.

    8. Repeat for any other zones identified in the Check as noncompliant.

    9. Perform a service restart if necessary.

    10. Verify zone transfers are operational after configuration of TSIG.

    Note: HMAC-SHA256 is the preferred algorithm to generate TSIG keys and should be

    used unless the External DNS service member only supports HMAC-MD5.'
