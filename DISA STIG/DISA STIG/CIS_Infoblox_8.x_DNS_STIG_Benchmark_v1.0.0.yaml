  title: IDNS-8X-400023
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Infoblox system must use the security configuration settings based on DoD security configuration or implementation
    guidance, including STIGs, NSA configuration guides, CTOs, and DTMs. GROUP ID: V-233881 RULE ID: SV-233881r961863'
  rationale: Configuration settings are the set of parameters that can be changed that affect the security posture and/or
    functionality of the system. Security-related parameters are parameters impacting the security state of the application,
    including the parameters required to satisfy other security control requirements. Configuring the DNS server implementation
    to follow organization-wide security implementation guides and security checklists ensures compliance with federal standards
    and establishes a common security baseline across DoD that reflects the most restrictive security posture consistent with
    operational requirements.
