  title: IDNS-8X-100002
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Infoblox system must limit the number of concurrent client connections to the number of allowed dynamic
    update clients. GROUP ID: V-233856 RULE ID: SV-233856r960735'
  rationale: Limiting the number of concurrent sessions reduces the risk of denial-of-service (DoS) to the DNS implementation.
