    and integrity of response data. In the case of DNS, employ DNSSEC to provide an additional data origin and integrity artifacts
    along with the authoritative data the system returns in response to DNS name/address resolution queries. DNSSEC is intended
    for third-party authenticity determination. Attempting to utilize DNSSEC internally was never an intended use case as
    it would require every consumer to have a third-party validating resolver installed along with a mechanism for periodic
    trust anchor distribution/update. It is recommended for external zones only.
