- id: '1.71'
  title: IDNS-8X-800002
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Infoblox DNS service member implementation must log the event and notify the system administrator when
    anomalies in the operation of the signed zone transfers are discovered. GROUP ID: V-233928 RULE ID: SV-233928r1082747'
  rationale: Security function is defined as the hardware, software, and/or firmware of the information system responsible
    for enforcing the system security policy and supporting the isolation of code and data on which the protection is based.
    Security functionality includes but is not limited to establishing system accounts, configuring access authorizations
    (i.e., permissions, privileges), setting events to be audited, and setting intrusion detection parameters. Notifications
    provided by information systems include messages to local computer consoles, and/or hardware indications, such as lights.
    If anomalies are not acted upon, security functions may fail to secure the system. The DNS server does not have the capability
    of shutting down or restarting the information system. The DNS server can be configured to generate audit records when
    anomalies are discovered, and the OS/NDM can then trigger notification messages to the system administrator based on the
    presence of those audit records.
  impact: ''
  references: []
