  title: IDNS-8X-700014
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Infoblox DNS service members must protect the authenticity of communications sessions for queries. GROUP ID:
    V-233919 RULE ID: SV-233919r1082730'
  rationale: The underlying feature in the major threat associated with DNS query/response (i.e., forged response or response
    failure) is the integrity of DNS data returned in the response. An integral part of integrity verification is to ensure
    that valid data has originated from the right source. DNSSEC is required for securing the DNS query/response transaction
    by providing data origin authentication and data integrity verification through signature verification and the chain of
    trust. DNSSEC is intended for third-party authenticity determination. Attempting to utilize DNSSEC internally was never
    an intended use case as it would require every consumer to have a third-party validating resolver installed along with
    a mechanism for periodic trust anchor distribution/update. It is recommended for external zones only.
