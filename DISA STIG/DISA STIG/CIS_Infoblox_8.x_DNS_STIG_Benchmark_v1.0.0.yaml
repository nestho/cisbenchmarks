- id: '1.37'
  title: IDNS-8X-400033
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Infoblox system must validate the binding of the other DNS service members'' identity to the DNS information
    for a server-to-server transaction (e.g., zone transfer). GROUP ID: V-233891 RULE ID: SV-233891r1082667'
  rationale: Validation of the binding of the information prevents the modification of information between production and
    review. The validation of bindings can be achieved, for example, by the use of cryptographic checksums. Validations must
    be performed automatically. DNSSEC is not effective unless the digital signatures they generate are validated to ensure
    the information has not been tampered with and the producer's identity is legitimate.
  impact: ''
  references: []
  page_start: 82
  audit_raw: '1. Navigate to Data Management >> DNS >> Zones tab.

    2. Review each zone by clicking "Edit" and inspecting the "DNS service members"

    tab.

    3. If all entries in the "Type" column are configured as "Grid", this check is Not

    Applicable.

    4. Verify that each zone containing non-Grid DNS service members is further

    verified by inspection of the "Zone Transfers" tab and configuration of TSIG

    Access Control Entry (ACE).

    5. When complete, click "Cancel" to exit the "Properties" screen.

    If there is a non-Grid system that uses zone transfers but does not have a TSIG key,

    this is a finding.'
  remediation: 'It is important to verify that both the Infoblox and other DNS service member have the

    identical TSIG configuration and time synchronization before starting this procedure.

    1. Navigate to Data Management >> DNS >> Zones tab.

    2. Select a zone and click "Edit". Click on "Zone Transfers" tab and click "Override"

    for the "Allow Zone Transfers to" section.

    3. Use the radio button to select "Set of ACEs" and the "Add" drop-down to

    configure a TSIG key.

    4. When complete, click "Save & Close" to save the changes and exit the

    "Properties" screen.

    5. Perform a service restart if necessary.

    6. Verify zone transfers are operational after configuration of TSIG.'
