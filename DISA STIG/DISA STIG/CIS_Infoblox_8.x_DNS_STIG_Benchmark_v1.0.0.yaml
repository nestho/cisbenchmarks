  impact: ''
  references: []
  page_start: 13
  audit_raw: 'Infoblox can be configured in two ways to limit DDNS client updates.

    1. For clients that support GSS-TSIG, navigate to Data Management >> DNS >>

    Members tab.

    2. a. Review each server with the DNS service enabled.

    3. b. Select each server, click "Edit", toggle Advanced Mode, and select GSS-TSIG.

    4. c. Verify that "Enable GSS-TSIG authentication of clients" is enabled.

    5. For clients that do not support GSS-TSIG, navigate to Data Management >>

    DNS >> Members tab.

    6. a. Review each server with the DNS service enabled. Select each server and

    click "Edit".

    7. b. Select the "Updates" tab. Verify that either a Named ACL or Set of ACEs are

    defined to limit client DDNS.

    8. When complete, click "Cancel" to exit the "Properties" screen.

    If "Enable GSS-TSIG authentication of clients" is disabled for clients supporting GSSTSIG, or a Named ACL or Set of ACEs
    is not defined to limit DDNS for clients without

    GSS-TSIG support, this is a finding.'
  remediation: 'Infoblox can be configured in two ways to limit DDNS client updates. Refer to the

    Administrator Guide for detailed instructions if necessary.

    1. For clients that support GSS-TSIG, navigate to Data Management >> DNS >>

    Members tab.

    2. a. Review each server with the DNS service enabled. Select each server, click

    "Edit", toggle Advanced Mode, and select GSS-TSIG.

    3. b. Configure the option "Enable GSS-TSIG authentication of clients".

    4. c. Upload the required keys.

    5. For clients that do not support GSS-TSIG, navigate to Data Management >>

    DNS >> Members tab.

    6. a. Review each server with the DNS service enabled.

    7. b. Select each server and click "Edit".

    8. c. Select the "Updates" tab. Enable an existing Named ACL or configure a new

    set of ACEs to limit client DDNS.

    9. When complete, click "Save & Close" to save the changes and exit the

    "Properties" screen.

    10. Perform a service restart if necessary.'
  checks:
  - type: manual_review
    info: 'Infoblox can be configured in two ways to limit DDNS client updates.

