    Control, Threat Protection, Threat Analytics, and TAXII services. Use of these additional

    Infoblox services is not a finding.

    If an external authoritative server is running any unnecessary services such as file

    distribution services, this is a finding.'
  remediation: '1. Navigate to Grid >> Grid Manager >> Services tab.

    2. Click on each service that is running and review the Service Status of each

    member.

    3. Click on the member and select "Stop" to disable the unnecessary service.'
