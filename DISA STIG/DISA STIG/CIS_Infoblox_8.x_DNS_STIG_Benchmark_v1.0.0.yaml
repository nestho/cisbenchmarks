- id: '1.20'
  title: IDNS-8X-400016
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Infoblox DNS service member must use current and valid root DNS service members. GROUP ID: V-233874 RULE
    ID: SV-233874r1082643'
  rationale: 'All caching name servers must be authoritative for the root zone because, without this starting point, they
    would have no knowledge of the DNS infrastructure and thus would be unable to respond to any queries. An adversary could
    change the root hints and direct the caching name server to a bogus root server. At that point, every query response from
    that name server is suspect, which would give the adversary substantial control over the network communication of the
    name servers'' clients. When authoritative servers are sent queries for zones for which they are not authoritative, and
    configured as a noncaching server (as recommended), they can either be configured to return a referral to the root servers
    or to refuse to answer the query. The recommendation is to configure authoritative servers to refuse to answer queries
    for any zones for which they are not authoritative. This is more efficient for the server and allows it to spend more
    of its resources serving its intended purpose: answering authoritatively for its zone.'
  impact: ''
  references: []
  page_start: 49
  audit_raw: 'Review the Root DNS service members configured and validate that the entries are

    correct. "G" and "H" root servers are required on the NIPRNet as a minimum. Note:

