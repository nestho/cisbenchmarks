- id: '1.25'
  title: IDNS-8X-400021
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The private keys corresponding to both the Zone Signing Key (ZSK) and the Key Signing Key (KSK) must not be
    kept on the DNSSEC-aware primary authoritative DNS service member when the DNS service member does not support dynamic
    updates. GROUP ID: V-233879 RULE ID: SV-233879r1082653'
  rationale: The private keys in the KSK and ZSK key pairs must be protected from unauthorized access. If possible, the private
    keys should be stored offline (with respect to the internet-facing, DNSSEC-aware name server) in a physically secure,
    non-networkaccessible machine along with the zone file master copy. This strategy is not feasible in situations in which
    the DNSSEC-aware name server has to support dynamic updates. To support dynamic update transactions, the DNSSECaware name
    server (which usually is a primary authoritative name server) must have both the zone file master copy and the private
    key corresponding to the zone-signing key (ZSK-private) online to immediately update the signatures for the updated RRSets.
    The private key corresponding to the key-signing key (KSK-private) can still be kept offline.
  impact: ''
  references: []
  page_start: 59
  audit_raw: 'Note: For Infoblox DNS systems on a classified network, this requirement is Not

    Applicable.

    By default, KSK and ZSK private keys are stored on the Grid Master within the Infoblox

    database. No clients should be permitted to use the Grid Master DNS service.

    1. Navigate to Data Management >> DNS >> Zones.

    2. Review each zone by selecting the zone and clicking "Edit" and selecting the

    "DNSName Servers" tab.

    If the Grid Master is a listed DNS service member and not marked "Stealth", this is a

    finding.

    If a Hardware Security Module (HSM) is configured, KSK and ZSK private keys are

    encrypted and stored on the HSM, this is not a finding.'
  remediation: 'For each zone that is not in compliance:

    1. Navigate to Data Management >> DNS >> Zones.

    2. Select and edit the zone.

    3. Select the "DNS service members" tab and modify the Grid Master by selecting

    "Stealth".

    4. When complete, click "Save & Close" to save the changes and exit the

    "Properties" screen.

    5. Perform a service restart if necessary.'
