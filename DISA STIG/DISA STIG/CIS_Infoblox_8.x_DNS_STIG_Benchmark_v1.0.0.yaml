- id: '1.9'
  title: IDNS-8X-400005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Infoblox DNS service member must be configured so that each DNS service member record in a zone file points
    to an active DNS service member authoritative for the domain specified in that record. GROUP ID: V-233863 RULE ID: SV-233863r1082996'
  rationale: Poorly constructed NS records pose a security risk because they create conditions under which an adversary might
    be able to provide the missing authoritative name services that are improperly specified in the zone file. The adversary
    could issue bogus responses to queries that clients would accept because they learned of the adversary's name server from
    a valid authoritative name server, one that need not be compromised for this attack to be successful. The list of slave
    servers must remain current within 72 hours of any changes to the zone architecture that would affect the list of slaves.
    If a slave server has been retired or is not operational but remains on the list, an adversary might have a greater opportunity
    to impersonate that slave without detection, rather than if the slave were actually online. For example, the adversary
    may be able to spoof the retired slave's IP address without an IP address conflict, which would not be likely to occur
    if the true slave were active.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'Verify that NS resource records in all active zones point to an operational DNS service

    member.

    1. Navigate to Data Management >> DNS >> Zones.

    2. Select the zone to review.

    3. Select the "Name Servers" tab.

    4. If the option "Use this Name Server Group" is active, note the group name used.

    Click "Cancel" and select the "DNS Name Server Groups" tab to review the DNS

    Name Server group.

    5. Examine each NS record and DNS service member configuration.

    6. Verify the IP address for each NS record points to an operational DNS service

    member.

    7. Click "Cancel" to exit the "Properties" screen.

    If a DNS service member resource record points to an IP that is not an operational DNS

    service member, this is a finding.'
  remediation: '1. Navigate to Data Management >> DNS >> Zones.

    2. Select and edit the zones containing incorrect NS record configurations.

    3. Select the "Name Servers" tab.

    4. If the option "Use this DNS Name Server Group" is active, note the group name

