      "enabled".

      6. Compare this to the list of currently approved ciph'
- id: '1.35'
  title: IDNS-8X-400031
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'An Infoblox DNS service member must strongly bind the identity of the DNS service member with the DNS information
    using DNSSEC. GROUP ID: V-233889 RULE ID: SV-233889r1082661'
  rationale: Weakly bound credentials can be modified without invalidating the credential; therefore, nonrepudiation can be
    violated. This requirement supports audit requirements that provide organizational personnel with the means to identify
    who produced specific information in the event of an information transfer. Organizations and/or data owners determine
    and approve the strength of the binding between the information producer and the information based on the security category
    of the information and relevant risk factors. DNSSEC uses digital signatures to establish the identity of the producer
    of particular pieces of information.
  impact: ''
  references: []
  page_start: 78
  audit_raw: 'Note: For Infoblox DNS systems on a classified network, this requirement is Not

    Applicable.

    Validate that DNSSEC validation is enabled:

    1. Navigate to Data Management >> DNS >> Grid DNS properties.

    2. Toggle Advanced Mode and click on the "DNSSEC" tab.

    3. Verify that both "Enable DNSSEC" and "Enable DNSSEC validation" are

    enabled.

    4. When complete, click "Cancel" to exit the "Properties" screen.

    If both "Enable DNSSEC" and "Enable DNSSEC validation" are not enabled, this is a

    finding.'
  remediation: '1. Navigate to Data Management >> DNS >> Grid DNS properties.

    2. Toggle Advanced Mode and click on the "DNSSEC" tab.

    3. Enable both "Enable DNSSEC" and "Enable DNSSEC validation".

    4. When complete, click "Save & Close" to save the changes and exit the

    "Properties" screen.

    5. Perform a service restart if necessary.'
  checks:
