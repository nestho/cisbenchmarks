- id: '1.53'
  title: IDNS-8X-700002
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Infoblox system must provide additional data origin artifacts along with the authoritative data the system
    returns in response to external name/address resolution queries. GROUP ID: V-233907 RULE ID: SV-233907r961101'
  rationale: The underlying feature in the major threat associated with DNS query/response (i.e., forged response or response
    failure) is the integrity of DNS data returned in the response. The security objective is to verify the integrity of each
    response received. An integral part of integrity verification is to ensure that valid data has originated from the right
    source. Establishing trust in the source is called data origin authentication. The security objectives, and consequently
    the security services, that are required for securing the DNS query/response transaction are data origin authentication
    and data integrity verification. The specification for a digital signature mechanism in the context of the DNS infrastructure
    is in the Internet Engineering Task Force's (IETF's) Domain Name System Security Extension (DNSSEC) standard. In DNSSEC,
    trust in the public key (for signature verification) of the source is established not by going to a third party or a chain
    of third parties (as in public key infrastructure [PKI] chaining), but by starting from a trusted zone (such as the root
    zone) and establishing the chain of trust down to the current source of response through successive verifications of signature
    of the public key of a child by its parent. The public key of the trusted zone is called the trust anchor.
