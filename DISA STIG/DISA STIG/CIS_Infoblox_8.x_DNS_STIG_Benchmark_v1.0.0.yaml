  rationale: Information can be unintentionally or maliciously disclosed or modified during reception, including, for example,
    during aggregation, at protocol transformation points, and during packing/unpacking. These unauthorized disclosures or
    modifications compromise the confidentiality or integrity of the information. Confidentiality is not an objective of DNS,
    but integrity is. DNS is responsible for maintaining the integrity of DNS information while it is being received.
