- id: '1.17'
  title: IDNS-8X-400013
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Primary authoritative DNS service members must be configured to only receive zone transfer requests from specified
    secondary DNS service members. GROUP ID: V-233871 RULE ID: SV-233871r1082637'
  rationale: Authoritative name servers (especially primary name servers) must be configured with an allow-transfer access
    control sub-statement designating the list of hosts from which zone transfer requests can be accepted. These restrictions
    address the denial-ofservice threat and potential exploits from unrestricted dissemination of information about internal
    resources. Based on the need-to-know, only the secondary name servers need to refresh their zone files periodically. Zone
    transfer from primary name servers must be restricted to secondary name servers. The zone transfer must be completely
    disabled in the secondary name servers. The address match list argument for the allow-transfer substatement must consist
    of IP addresses of secondary name servers and stealth secondary name servers.
  impact: ''
  references: []
  page_start: 43
  audit_raw: 'Infoblox Grid members do not use DNS zone transfers to exchange DNS data within a

    single Grid. Communication between Grid members is via a distributed database over a

    secure Virtual Private Network (VPN).

    1. Navigate to the Data Management >> DNS >> Zones tab.

    2. Review each zone by clicking "Edit" and inspecting the "DNS service members"

