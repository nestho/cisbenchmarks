- id: '1.50'
  title: IDNS-8X-500007
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Infoblox Grid Master must be configured as a stealth (hidden) domain DNS service member in order to protect
    the Zone Signing Key (ZSK) residing on it. GROUP ID: V-233904 RULE ID: SV-233904r1083000'
  rationale: Security-relevant information is any information within information systems that can potentially impact the operation
    of security functions or the provision of security services in a manner that could result in failure to enforce system
    security policies or maintain the isolation of code and data. Security-relevant information includes, for example, file
    permissions, cryptographic key management information, configuration parameters for security services, and access control
    lists. Secure, nonoperable system states include the times in which information systems are not performing mission/business-related
    processing (e.g., the system is offline for maintenance, troubleshooting, bootup, and shutdown). On Infoblox, Domain Name
    System Security Extension (DNSSEC) ZSKs are stored on either a Hardware Security Module or the Infoblox Grid Master. By
    configuring the Grid Master as "stealth" to prevent client communications to the Infoblox Grid Master, and ensuring the
    Grid Master uses an encrypted management tunnel to update DNS members serving DNSSEC signed zones, the DNSSEC keys are
    protected.
