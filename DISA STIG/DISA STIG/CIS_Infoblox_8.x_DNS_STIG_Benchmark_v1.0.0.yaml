  audit_raw: 'Verify the default Infoblox configuration to use random ports is not overridden at either

    the global or member level.

    Global-Level check:

    1. Navigate to Data Management >> DNS Edit Grid DNS Properties, or System

    DNS Properties on a stand-alone system.

    2. Toggle Advanced Mode and select the General >> Advanced tab.

    3. Verify that the options under "Source Port Settings", "Set static source UDP port

