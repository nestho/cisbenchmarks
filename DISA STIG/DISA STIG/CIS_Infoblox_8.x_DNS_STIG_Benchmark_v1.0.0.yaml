    of the check.

    2. Navigate to Data Management >> DNS >> Grid DNS Properties.

    3. Toggle Advanced mode and review the "Root DNS service members" tab to

    ensure it is configured correctly.

    If valid root DNS service members are not configured, this is a finding.'
  remediation: '1. Navigate to Data Management >> DNS >> Grid DNS Properties.

    2. Toggle Advanced mode and select the "Root DNS service members" tab.

    3. Use the radio button to select "Use custom root DNS service members" and

    configure the desired root DNS service members.

    4. When complete, click "Save & Close" to save the changes and exit the

    "Properties" screen.

    5. Perform a service restart if necessary.'
