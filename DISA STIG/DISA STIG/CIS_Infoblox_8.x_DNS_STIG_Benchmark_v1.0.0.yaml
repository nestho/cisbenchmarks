- id: '1.54'
  title: IDNS-8X-700003
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Infoblox DNS service member must provide additional integrity artifacts along with the authoritative name
    resolution data the system returns in response to external name/address resolution queries. GROUP ID: V-233908 RULE ID:
    SV-233908r1082705'
  rationale: The major threat associated with DNS forged responses or failures is the integrity of the DNS data returned in
    the response. The principle of DNSSEC is to mitigate this threat by providing data origin authentication, establishing
    trust in the source. This requirement enables remote clients to obtain origin authentication and integrity verification
    assurances for the host/service name to network address resolution information obtained through the service. A DNS server
    is an example of an information system providing name/address resolution service. Digital signatures and cryptographic
    keys are examples of additional artifacts. DNS resource records are examples of authoritative data. Applications other
    than the DNS to map between host/service names and network addresses must provide other means to ensure the authenticity
    and integrity of response data. In the case of DNS, employ DNSSEC to provide an additional data origin and integrity artifacts
    along with the authoritative data the system returns in response to DNS name/address resolution queries.
