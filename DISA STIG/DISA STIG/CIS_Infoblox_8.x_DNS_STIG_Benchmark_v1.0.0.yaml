    severity: medium
- id: '1.4'
  title: IDNS-8X-300002
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Infoblox system audit records must be backed up at least every seven days onto a different system or system
    component than the system or component being audited. GROUP ID: V-233858 RULE ID: SV-233858r960948'
  rationale: Protection of log data includes ensuring that log data is not accidentally lost or deleted. Backing up audit
    records to a different system or onto separate media than the system being audited on a defined frequency helps to ensure
    that, in the event of a catastrophic system failure, the audit records will be retained. This helps to ensure a compromise
    of the information system being audited does not also result in a compromise of the audit records.
  impact: ''
  references: []
  page_start: 17
  audit_raw: '1. Navigate to Grid >> Grid Manager >> Grid Properties, or System >> System

    Manager >> System Properties if using a stand-alone configuration.

    2. Select the "Monitoring" tab.

    3. If "Log to External Syslog Servers" is enabled, an External Syslog Server must

    be configured.

    4. Verify that "Copy Audit Log Message to Syslog" is enabled.

    5. Verify that log messages are received on the remote system.

    If no external SYSLOG server is available, verify local procedure to retain audit logs.

    Logs can be downloaded by navigating to Administration >> Logs >> Audit Log tab and

    pressing the "Download" button.

    When complete, click "Cancel" to exit the "Properties" screen.

    If an external SYSLOG server is not configured or a local policy is not in place to store

    audit logs, this is a finding.'
  remediation: '1. Navigate to Grid >> Grid Manager >> Grid Properties, or System >> System

    Manager >> System Properties if using a stand-alone configuration.

    2. Select the "Monitoring" tab. Enable "Log to External Syslog Servers" and

    configure an "External Syslog Server".

    3. Enable the checkbox "Copy Audit Log Message to Syslog".

    4. When complete, click "Save & Close" to save the changes and exit the

    "Properties" screen.

    5. Perform a service restart if necessary.

    6. Review Infoblox audit records on the remote SYSLOG server to validate

    operation.'
  checks:
  - type: manual_review
    info: '1. Navigate to Grid >> Grid Manager >> Grid Properties, or System >> System

      Manager >> System Properties if using a stand-alone configuration.

      2. Select the "Monitoring" tab.

