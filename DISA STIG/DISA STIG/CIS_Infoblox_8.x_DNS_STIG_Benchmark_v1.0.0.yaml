- id: '1.56'
  title: IDNS-8X-700005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The validity period for the Resource Record Signatures (RRSIGs) covering the Delegation Signer (DS) RR for
    a zone''s delegated children must be no less than two days and no more than one week. GROUP ID: V-233910 RULE ID: SV-233910r961104'
  rationale: The best way for a zone administrator to minimize the impact of a key compromise is by limiting the validity
    period of RRSIGs in the zone and in the parent zone. This strategy limits the time during which an attacker can take advantage
    of a compromised key to forge responses. An attacker that has compromised a Zone Signing Key (ZSK) can use that key only
    during the Key Signing Key's (KSK's) signature validity interval. An attacker that has compromised a KSK can use that
    key for only as long as the signature interval of the RRSIG covering the DS RR in the delegating parent. These validity
    periods should be short, which will require frequent re-signing. To prevent the impact of a compromised KSK, a delegating
    parent should set the signature validity period for RRSIGs covering DS RRs in the range of a few days to one week. This
    re-signing does not require frequent rollover of the parent's ZSK, but scheduled ZSK rollover should still be performed
    at regular intervals.
  impact: ''
