  title: IDNS-8X-700006
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Infoblox DNS service member implementation must enforce approved authorizations for controlling the flow
    of information between DNS service members and between DNS service members and DNS clients based on TSIG policies. GROUP
    ID: V-233911 RULE ID: SV-233911r1082711'
  rationale: A mechanism to detect and prevent unauthorized communication flow must be configured or provided as part of the
    system design. If information flow is not enforced based on approved authorizations, the system may become compromised.
    Information flow control regulates where information is allowed to travel within a system and between interconnected systems.
    The flow of all application information must be monitored and controlled so it does not introduce any unacceptable risk
    to the systems or data. Application-specific examples of enforcement occurs in systems that employ rule sets or establish
    configuration settings that restrict information system services or provide a message-filtering capability based on message
    content (e.g., implementing keyword searches or using document characteristics). Applications providing information flow
    control must be able to enforce approved authorizations for controlling the flow of information between interconnected
    systems in accordance with applicable policy. Within the context of DNS, this is applicable in terms of controlling the
    flow of DNS information between systems, such as DNS zone transfers.
  impact: ''
