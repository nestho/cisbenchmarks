  title: IDNS-8X-700015
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'In the event of a system failure, the Infoblox system must preserve any information necessary to determine
    cause of failure and any information necessary to return to operations with least disruption to mission processes. GROUP
    ID: V-233920 RULE ID: SV-233920r961125'
  rationale: Failure to a known state can address safety or security in accordance with the mission/business needs of the
    organization. Preserving application state information helps to facilitate application restart and return to the operational
    mode of the organization with less disruption to mission-essential processes.
  impact: ''
  references: []
  page_start: 135
  audit_raw: 'By default, all system events are logged to the local SYSLOG and stored on the

    Infoblox appliance. To ensure log data is preserved in the event of system failure, an

    external log server must be configured. Verify that external logging is operational and

    messages from the Audit log are also forwarded to the remote log system.

    1. Navigate to Grid >> Grid Manager >> Grid Properties, or System >> System

    Manager >> System Properties if using a stand-alone configuration.

    2. Select the "Monitoring" tab.

    3. Validate that "Log to External Syslog Servers" is enabled and an External Syslog

    Server must be configured.

    4. Validate "Copy Audit Log Message to Syslog" is enabled.

    5. When complete, click "Cancel" to exit the "Properties" screen.

    If both "Log to External Syslog Servers" and "Copy Audit Log Message to Syslog" are

    not enabled, this is a finding.'
  remediation: '1. Navigate to Grid >> Grid Manager >> Grid Properties, or System >> System

    Manager >> System Properties if using a stand-alone configuration.

    2. Select the "Monitoring" tab.

    3. Enable "Log to External Syslog Server" and configure at least one External

    Syslog Server.

    4. Enable the option "Copy Audit Log Message to Syslog".

    5. Click "Save & Close" to save the changes and exit the "Properties" screen.

    6. Perform a service restart if necessary.'
