    2. Review each server with the DNS service enabled.

    3. Select each server, click "Edit", toggle Advanced Mode, and select General >>

    Advanced tab.

    4. Verify that the options under "Source Port Settings", "Set static source UDP port

    for queries (not recommended)", and "Set static source UDP port for notify

    messages" use the default value of "not enabled".

    5. When complete, click "Cancel" to exit the "Properties" screen.

    If configuration of either of these values exists, this is a finding.'
  remediation: '1. Navigate to Data Management >> DNS >> Grid DNS Properties or System DNS

    properties on a stand-alone system.

    2. Toggle Advanced Mode and select General >> Advanced tab. Disable "Set static

    source UDP port for queries (not recommended)" and "Set static source UDP

    port for notify messages".

    3. Navigate to Data Management >> DNS >> Members tab.

    4. Review each Infoblox member with the DNS service enabled.

    5. Select each server, click "Edit", toggle Advanced Mode, and select General >>

    Advanced tab.

    6. Locate the section labeled "Source port settings" and click "Override" to use the

    Grid default values that disable static source ports.

    7. When complete, click "Save & Close" to save the changes and exit the

    "Properties" screen.

    8. Perform a service restart if necessary.'
  checks:
  - type: manual_review
    info: 'Verify the default Infoblox configuration to use random ports is not overridden at either

