- id: '1.58'
  title: IDNS-8X-700007
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Infoblox DNS service member must enable verification of a chain of trust among parent and child domains
    (if the child supports secure resolution services). GROUP ID: V-233912 RULE ID: SV-233912r1083002'
  rationale: If name server replies are invalid or cannot be validated, many networking functions and communication would
    be adversely affected. With DNS, the presence of Delegation Signer (DS) records associated with child zones informs clients
    of the security status of child zones. These records are crucial to the DNSSEC chain of trust model. Each parent domain's
    DS record is used to verify the DNSKEY record in its subdomain, from the top of the DNS hierarchy down. A DNS server is
    an example of an information system providing name/address resolution service. Digital signatures and cryptographic keys
    are examples of additional artifacts. DNS resource records are examples of authoritative data. Applications other than
    the DNS to map between host/service names and network addresses must provide other means to ensure the authenticity and
    integrity of response data. DNSSEC provides the means to verify integrity assurances for the host/service name to network
    address resolution information obtained through the service. By using the DS resource records in the DNS, the security
    status of a child domain can be validated. The DS resource record is used to identify the DNSSEC signing key of a delegated
    zone. The chain of trust is established starting with a trusted name server (such as the root name server) and moving
    down to the current source of response through successive verifications of signature of the public key of a child by its
    parent. The public key of the trusted name servers is called the trust anchor. After authenticating the source, the next
    process DNSSEC calls for is to authenticate the response. This requires that responses consist of not only the requested
    resource records (RRs) but also an authenticator associated with them. In DNSSEC, this authenticator is the digital signature
    of an RRSet. The digital signature of an RRSet is encapsulated through a special RRType called RRSIG. The DNS client using
    the trusted public key of the source (whose trust has just been established) then verifies the digital signature to detect
    if the response is valid or bogus. This control enables the DNS to obtain origin authentication and integrity verification
    assurances for the host/service name to network address resolution information obtained through the service. Without indication
    of the security status of a child domain and enabling verification of a chain of trust, integrity and availability of
    the DNS infrastructure cannot be assured.
  impact: ''
  references: []
