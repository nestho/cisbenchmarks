- id: '1.33'
  title: IDNS-8X-400029
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Infoblox system must be configured in accordance with the security configuration settings based on DoD
    security configuration or implementation guidance, including STIGs, NSA configuration guides, CTOs, and DTMs. GROUP ID:
    V-233887 RULE ID: SV-233887r961863'
  rationale: Configuration settings are the set of parameters that can be changed that affect the security posture and/or
    functionality of the system. Security-related parameters are parameters impacting the security state of the application,
    including the parameters required to satisfy other security control requirements. Configuring the DNS server implementation
    to follow organization-wide security implementation guides and security checklists ensures compliance with federal standards
    and establishes a common security baseline across DoD that reflects the most restrictive security posture consistent with
    operational requirements.
  impact: ''
  references: []
  page_start: 74
  audit_raw: 'Infoblox systems are secure by design and use a number of access controls to prevent

    unauthorized usage. Infoblox systems are purpose built and do not provide privileged

    "root" level access, nor are they distributed as general purpose operating systems. By

    default, all services including DNS are disabled on Infoblox systems. Services are

    enabled only as a result of administrator action.

    1. Navigate to Grid >> Grid Manager >> Grid Properties, or System >> System

    Manager >> System Properties if using a stand-alone configuration.

    2. Select the "Services" tab.

    3. Review the enabled services.

    If any unnecessary services are running on Infoblox systems, this is a finding.'
  remediation: 'Review network architecture and system configuration to ensure use of a defense-indepth architecture that
    uses secure out-of-band management. Review system

    configuration to ensure all administrators are properly authorized for the functions

    allowed through system rights. Validate that both SRG and STIG DNS guidance is

    properly applied.

    1. Navigate to Grid >> Grid Manager >> Grid Properties, or System >> System

    Manager >> System Properties if using a stand-alone configuration.

    2. Select the "Services" tab.

    3. Click on each service that is running and review the "Service Status" of each

    member.

    4. Click on the member and select "Stop" to disable the unnecessary service.'
