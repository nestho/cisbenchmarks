  title: IDNS-8X-400026
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Infoblox Grid configuration must be backed up on a regular basis. GROUP ID: V-233884 RULE ID: SV-233884r961863'
  rationale: The Infoblox Grid Master is the central point of management within an Infoblox Grid. The Grid Master retains
    a full copy of the configuration used for the entire Grid. In the event of system failure, a configuration backup must
    be preserved. An Infoblox Grid member may also be configured as a Grid Master Candidate, which is synchronized to the
    Grid Master. The Grid Master Candidate can be promoted in the event of system failure on the Grid Master.
  impact: ''
  references: []
  page_start: 68
  audit_raw: '1. Navigate to Grid >> Grid Manager >> Members tab.

