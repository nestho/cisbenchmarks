  title: IDNS-8X-700018
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Infoblox DNS service member must protect the integrity of transmitted information. GROUP ID: V-233923
    RULE ID: SV-233923r1082737'
  rationale: Without protection of the transmitted information, confidentiality and integrity may be compromised since unprotected
    communications can be intercepted and either read or altered. Communication paths outside the physical protection of a
    controlled boundary are exposed to the possibility of interception and modification. Protecting the confidentiality and
    integrity of organizational information can be accomplished by physical means (e.g., employing physical distribution systems)
    or by logical means (e.g., employing cryptographic techniques). If physical means of protection are employed, then logical
    means (cryptography) do not have to be employed, and vice versa. Confidentiality is not an objective of DNS, but integrity
    is. DNSSEC digitally signs DNS information to authenticate its source and ensure its integrity. DNSSEC is intended for
    third-party authenticity determination. Attempting to utilize DNSSEC internally was never an intended use case as it would
    require every consumer to have a third-party validating resolver installed along with a mechanism for periodic trust anchor
    distribution/update. It is recommended for external zones only.
