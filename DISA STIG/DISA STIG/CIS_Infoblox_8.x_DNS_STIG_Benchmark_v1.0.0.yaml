- id: '1.38'
  title: IDNS-8X-400034
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Infoblox system must send a notification in the event of an error when validating the binding of another
    DNS service member''s identity to the DNS information. GROUP ID: V-233892 RULE ID: SV-233892r1082670'
  rationale: Failing to act on validation errors may result in the use of invalid, corrupted, or compromised information.
    The validation of bindings can be achieved, for example, by the use of cryptographic checksums. Validations must be performed
    automatically. At a minimum, the application must log the validation error. However, more stringent actions can be taken
    based on the security posture and value of the information. The organization must consider the system's environment and
    impact of the errors when defining the actions. Additional examples of actions include automated notification to administrators,
    halting system process, or halting the specific operation. The DNS server must audit all failed attempts at server authentication
    through DNSSEC and TSIG/SIG(0). The actual auditing is performed by the OS/NDM, but the configuration to trigger the auditing
    is controlled by the DNS server.
  impact: ''
