- id: '1.49'
  title: IDNS-8X-500006
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Infoblox Grid Master must be configured as a stealth (hidden) domain DNS service member to protect the
    Key Signing Key (KSK) residing on it. GROUP ID: V-233903 RULE ID: SV-233903r1082697'
  rationale: The private keys in the KSK and Zone Signing Keys (ZSK) key pairs must be protected from unauthorized access.
    If possible, the private keys should be stored offline (with respect to the internet-facing, DNSSEC-aware name server)
    in a physically secure, nonnetwork-accessible machine along with the zone file master copy. This strategy is not feasible
    in situations in which the DNSSEC-aware name server has to support dynamic updates. To support dynamic update transactions,
    the DNSSECaware name server (which usually is a primary authoritative name server) must have both the zone file master
    copy and the private key corresponding to the ZSK (ZSKprivate) online to immediately update the signatures for the updated
    resource record (RR) sets. The private key corresponding to the KSK (KSK-private) can still be kept offline. On Infoblox,
    Domain Name System Security Extension (DNSSEC) ZSKs are stored on either a Hardware Security Module or the Infoblox Grid
    Master. By configuring the Grid Master as "stealth" to prevent client communications to the Infoblox Grid Master and ensuring
    the Grid Master uses an encrypted management tunnel to update DNS members serving DNSSEC signed zones, the DNSSEC keys
    are protected.
  impact: ''
  references: []
  page_start: 106
  audit_raw: 'Note: For Infoblox DNS systems on a classified network, this requirement is Not

    Applicable.

    By default, ZSK private keys are stored encrypted within the Infoblox database on the

    Grid Master. The Grid Master will by default enable the DNS service when DNSSEC is

    enabled for internal processing. Clients must not be permitted to use the Grid Master

    DNS service. Refer to the Infoblox STIG Overview document for additional information

    on HSM usage.

    1. Navigate to Data Management >> DNS >> Zones.

    2. Review each zone by selecting the zone, clicking "Edit", and selecting the "DNS

    service members" tab.

    3. When complete, click "Cancel" to exit the "Properties" screen.

    If the Grid Master is a listed DNS service member and not marked "Stealth", this is a

    finding.'
  remediation: '1. Navigate to Data Management >> DNS >> Zones.

    2. Select the zone, click "Edit", and select the "DNS service members" tab.

    3. Mark the Grid Master as "Stealth".

    4. If no other DNS service members are listed, one must be added before the

    configuration can be valid.

    5. When complete, click "Save & Close" to save the changes and exit the

    "Properties" screen.

    6. Perform a service restart if necessary.'
