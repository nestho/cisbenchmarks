- id: '1.51'
  title: IDNS-8X-600001
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Infoblox system must employ strong authenticators in the establishment of nonlocal maintenance and diagnostic
    sessions. GROUP ID: V-233905 RULE ID: SV-233905r961062'
  rationale: 'If maintenance tools are used by unauthorized personnel, they may accidentally or intentionally damage or compromise
    the system. The act of managing systems and applications includes the ability to access sensitive application information,
    such as system configuration details, diagnostic information, user information, and potentially sensitive application
    data. Nonlocal maintenance and diagnostic activities are activities conducted by individuals communicating through either
    an external network (e.g., the internet) or an internal network. Local maintenance and diagnostic activities are activities
    carried out by individuals physically present at the information system or information system component and not communicating
    across a network connection. Typically, strong authentication requires authenticators that are resistant to replay attacks
    and employ multifactor authentication. Strong authenticators include, for example, Public Key Infrastructure (PKI) where
    certificates are stored on a token protected by a password, passphrase, or biometric. This requirement applies to hardware/software
    diagnostic test equipment or tools. This requirement does not cover hardware/software components that may support information
    system maintenance but are a part of the system (e.g., the software implementing "ping", "ls", "ipconfig", or the hardware
    and software implementing the monitoring port of an Ethernet switch). Lack of authentication enables anyone to gain access
    to the network or possibly a network element that provides opportunity for intruders to compromise resources within the
    network infrastructure. Network access control mechanisms interoperate to prevent unauthorized access and to enforce the
    organization''s security policy. Authorization for access to any network element requires an individual account identifier
    that has been approved, assigned, and configured on an authentication server. Authentication of all administrator accounts
    for all privilege levels must be accomplished using two or more factors that include the following: (i) something you
    know (e.g., password/PIN); (ii) something you have (e.g., cryptographic identification device, token); or (iii) something
    you are (e.g., biometric).'
