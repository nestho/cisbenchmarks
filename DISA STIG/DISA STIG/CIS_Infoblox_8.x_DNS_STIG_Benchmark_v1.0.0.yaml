- id: '1.23'
  title: IDNS-8X-400019
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Infoblox system must be configured to respond to DNS traffic only. GROUP ID: V-233877 RULE ID: SV-233877r961863'
  rationale: OS configuration practices as issued by the US Computer Emergency Response Team (US CERT) and the National Institute
    of Standards and Technology's (NIST's) National Vulnerability Database (NVD), based on identified vulnerabilities that
    pertain to the application profile into which the name server software fits, should always be followed. In particular,
    hosts that run the name server software should not provide any other services and therefore should be configured to respond
    to DNS traffic only. In other words, the only allowed incoming ports/protocols to these hosts should be 53/udp and 53/tcp.
    Outgoing DNS messages should be sent from a random port to minimize the risk of an attacker's guessing the outgoing message
    port and sending forged replies.
  impact: ''
  references: []
