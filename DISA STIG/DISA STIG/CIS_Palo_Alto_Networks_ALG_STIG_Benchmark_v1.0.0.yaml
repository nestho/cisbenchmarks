- id: '1.47'
  title: PANW-AG-000144
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Palo Alto Networks security platform must, at a minimum, off-load threat and traffic log records onto
    a centralized log server in real time. GROUP ID: V-228878 RULE ID: SV-228878r831619'
  rationale: Off-loading ensures audit information does not get overwritten if the limited audit storage capacity is reached
    and also protects the audit record in case the system/component being audited is compromised. Off-loading is a common
    process in information systems with limited audit storage capacity. The audit storage on the Palo Alto Networks security
    platform is used only in a transitory fashion until the system can communicate with the centralized log server designated
    for storing the audit records, at which point the information is transferred. However, DoD requires that the log be transferred
    in real time, which indicates that the time from event detection to off-loading is seconds or less. For the purposes of
    this requirement, the terms "real time" and "near-real time" are equivalent. This does not apply to audit logs generated
    on behalf of the device itself (management).
  impact: ''
  references: []
  page_start: 127
  audit_raw: 'To view a syslog server profile:

    Go to Device >> Server Profiles >> Syslog

    If there are no Syslog Server Profiles present, this is a finding.

    Select each Syslog Server Profile; if no server is configured, this is a finding.

    View the log-forwarding profile to determine which logs are forwarded to the syslog

    server.

    Go to Objects >> Log forwarding

    If no Log Forwarding Profile is present, this is a finding.

    The "Log Forwarding Profile" window has five columns. If there are no Syslog Server

    Profiles present in the "Syslog" column for the Traffic Log Type, this is a finding.

    If there are no Syslog Server Profiles present for each of the severity levels of the

    Threat Log Type, this is a finding.

    1. Go to Device >> Log Settings >> System Logs

    2. The list of Severity levels is displayed.

    If any of the Severity levels does not have a configured Syslog Profile, this is a finding.

    Go to Device >> Log Settings >> Config Logs

    If the "Syslog field" is blank, this is a finding.'
  remediation: 'To create a syslog server profile:

    1. Go to Device >> Server Profiles >> Syslog

    2. Select "Add".

    3. In the Syslog Server Profile, enter the name of the profile.

    4. Select "Add".

    5. In the "Servers" tab, enter the required information.

    6. Name: Name of the syslog server

    7. Server: Server IP address where the logs will be forwarded to

    8. Port: Default port 514

    9. Facility: Select from the drop-down list.

    10. Select the "OK" button.

    After you create the Server Profiles that define where to send the logs, log forwarding

    must be enabled.

    The way forwarding is enabled depends on the log type:

    Traffic Logs-Enable forwarding of Traffic logs by creating a Log Forwarding Profile

    (Objects >> Log Forwarding) and adding it to the security policies to trigger the log

    forwarding. Only traffic that matches a specific rule within the security policy will be

    logged and forwarded.

    Configure the log-forwarding profile to select the logs to be forwarded to syslog server.

    1. Go to Objects >> Log forwarding

    2. The "Log Forwarding Profile" window appears. Note that it has five columns.

    3. In the "Syslog" column, select the syslog server profile for forwarding threat logs

    to the configured server(s).

    4. Select the "OK" button.

    When the "Log Forwarding Profile" window disappears, the screen will show the

    configured log-forwarding profile.

    Threat Logs-Enable forwarding of Threat logs by creating a Log Forwarding Profile

    (Objects >> Log Forwarding) that specifies which severity levels to forward and then

    adding it to the security policies for which to trigger the log forwarding. A Threat log

    entry will only be created (and therefore forwarded) if the associated traffic matches a

    Security Profile (Antivirus, Anti-spyware, Vulnerability, URL Filtering, File Blocking, Data

    Filtering, or DoS Protection).

    Configure the log-forwarding profile to select the logs to be forwarded to syslog server.

    1. Go to Objects >> Log forwarding

    2. The "Log Forwarding Profile" window appears. Note that it has five columns.

    3. In the "Syslog" column, select the syslog server profile for forwarding threat logs

    to the configured server(s).

    4. Select the "OK" button.

    When the "Log Forwarding Profile" window disappears, the screen will show the

    configured log-forwarding profile.

    For Traffic Logs and Threat Logs, use the log forwarding profile in the security rules.

    1. Go to Policies >> Security Rule

    2. Select the rule for which the log forwarding needs to be applied. Apply the

    security profiles to the rule.

    3. Go to Actions >> Log forwarding

    4. Select the log forwarding profile from drop-down list.

    5. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    6. Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'To view a syslog server profile:

      Go to Device >> Server Profiles >> Syslog

      If there are no Syslog Server Profiles present, this is a finding.

      Select each Syslog Server Profile; if no server is configured, this is a finding.

      View the log-forwarding profile to determine which logs are forwarded to the syslog

      server.

      Go to Objects >> Log forwarding

      If no Log Forwarding Profile is present, this is a finding.

      The "Log Forwarding Profile" window has five columns. If there are no Syslog Server

      Profiles'
    severity: medium
- id: '1.48'
  title: PANW-AG-000147
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must inspect inbound and outbound SMTP and Extended SMTP communications
    traffic (if authorized) for protocol compliance and protocol anomalies. GROUP ID: V-228879 RULE ID: SV-228879r557387'
  rationale: Application protocol anomaly detection examines application layer protocols such as SMTP to identify attacks
    based on observed deviations in the normal RFC behavior of a protocol or service. This type of monitoring allows for the
    detection of known and unknown exploits that exploit weaknesses of commonly used protocols. The device must be configured
    to inspect inbound and outbound SMTP and Extended SMTP communications traffic to detect protocol anomalies such as malformed
    message and command insertion attacks.
  impact: ''
  references: []
  page_start: 131
  audit_raw: 'If SMTP or ESMTP is authorized, ask the Administrator which Security Policy inspects

    authorized SMTP and ESMTP traffic.

    1. Go to Policies >> Security

    2. Select the identified Security Policy.

    If the "Profile" column does not display the "Antivirus Profile" symbol, this is a finding.

    If the "Profile" column does not display the "Vulnerability Protection Profile" symbol, this

    is a finding.'
  remediation: 'If SMTP or ESMTP is authorized, configure a security policy to allow it and inspect it.

    1. Go to Policies >> Security

    2. Select "Add" to create a new security policy or select the name of the security

    policy to edit it.

    3. In the "Security Policy Rule" window, complete the required fields.

    4. In the "Name" tab, complete the "Name" and "Description" fields.

    5. In the "Source" tab, complete the "Source Zone" and "Source Address" fields.

    6. In the "User" tab, complete the "Source User" and "HIP Profile" fields.

    7. In the "Destination" tab, complete the "Destination Zone" and "Destination

    Address" fields.

    8. In the "Applications" tab, either select the "Any" check box or add SMTP.

    Configured filters and groups can be selected if the group includes SMTP.

    9. In the "Actions" tab, select "allow".

    10. In the "Actions" tab in the "Profile Setting" section; in the "Profile Type" field,

    select "Profiles". The window will change to display the different categories of

    Profiles.

    11. In the "Profile Setting" section; in each of the "Profile" fields, select the configured

    Profile.

    Note: An Antivirus Profile and an Antispyware Profile are required.'
  checks:
  - type: manual_review
    info: 'If SMTP or ESMTP is authorized, ask the Administrator which Security Policy inspects

      authorized SMTP and ESMTP traffic.

      1. Go to Policies >> Security

      2. Select the identified Security Policy.

      If the "Profile" column does not display the "Antivirus Profile" symbol, this is a finding.

      If the "Profile" column does not display the "Vulnerability Protection Profile" symbol, this

      is a finding.'
    severity: medium
