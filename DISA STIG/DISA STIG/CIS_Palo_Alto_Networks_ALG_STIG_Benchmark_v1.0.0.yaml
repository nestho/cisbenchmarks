- id: '1.24'
  title: PANW-AG-000079
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security, if used as a TLS gateway/decryption point or VPN concentrator, must provide
    the capability to immediately disconnect or disable remote access to the information system. GROUP ID: V-228855 RULE ID:
    SV-228855r831595'
  rationale: Without the ability to immediately disconnect or disable remote access, an attack or other compromise taking
    place would not be immediately stopped. Remote access functionality must have the capability to immediately disconnect
    current users remotely accessing the information system and/or disable further remote access. The remote access functionality
    may implement features such as automatic disconnect (or user-initiated disconnect) in case of adverse information based
    on an indicator of compromise or attack. If the Palo Alto Networks security platform is used as a TLS gateway/decryption
    point or VPN concentrator, configure the device to deny decrypted traffic that violates the enclave or system policies.
    For each type of SSL/TLS traffic that is decrypted, the resulting traffic must be inspected and filtered.
  impact: ''
  references: []
  page_start: 66
  audit_raw: 'If the Palo Alto Networks security platform is not used as a TLS gateway/decryption

    point or VPN concentrator, this is not applicable.

    1. Go to Policies >> Decryption

    2. Note each configured decryption policy.

    3. Go to Policies >> Security

    4. View the configured security policies.

    5. If there is a decryption policy that does not have a corresponding security policy,

    this is a finding.

    The matching policy may not be obvious, and it may be necessary for the Administrator

    to identify the corresponding security policy.

    Select the Security Policy Rules applied to the decrypted traffic. If it allows traffic that is

    prohibited, this is a finding.'
  remediation: 'These instructions explain the steps involved but do not provide specific details since

    the exact policies and expected traffic are not known.

    Go to Policies >> Security

    Select "Add".

    In the "Security Policy Rule" window, complete the required fields.

    1. Configure the Security Policy in accordance with the enclave''s or system''s policy

    for the resulting decrypted traffic.

    2. For any traffic that violates the enclave policy, configure the Security Policy rule

    to deny the traffic.

    3. In the "Security Policy Rule" window, in the "Actions" tab, in the "Action Setting"

    section, select "deny".

    4. For any traffic that is allowed, configure the Security Policy Rule to allow the

    traffic and apply Antivirus and Vulnerability Protection Profiles.

