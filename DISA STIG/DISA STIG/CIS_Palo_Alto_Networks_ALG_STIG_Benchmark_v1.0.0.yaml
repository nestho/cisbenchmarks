    9. In the "Threat Name" field, select "any",

    10. In the "Action" field, select "block".

    11. In the "Host type" field, select "server".

    12. Select the check boxes above the "CVE" and "Vendor ID" boxes.

    13. In the "Severity" section, select the "critical", "high", and "medium" check boxes.

    14. Select "OK".

    15. In the "Vulnerability Protection Profile" window, select the configured rule, then

    select "OK".

    Add a second rule that alerts on low and informational threats.

    Apply the Vulnerability Protection Profile to the Security Policy Rules permitting traffic to

