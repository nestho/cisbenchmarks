- id: '1.33'
  title: PANW-AG-000111
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Palo Alto Networks security platform must be configured to integrate with a systemwide intrusion detection
    system. GROUP ID: V-228864 RULE ID: SV-228864r831606'
  rationale: Without coordinated reporting between separate devices, it is not possible to identify the true scale and possible
    target of an attack. Integration of the Palo Alto Networks security platform with a system-wide intrusion detection system
    supports continuous monitoring and incident response programs. This requirement applies to monitoring at internal boundaries
    using TLS gateways, web content filters, email gateways, and other types of ALGs. The Palo Alto Networks security platform
    can work as part of the network monitoring capabilities to off-load inspection functions from the external boundary IDPS
    by performing more granular content inspection of protocols at the upper layers of the OSI reference model. NetFlow is
    an industry-standard protocol that enables the firewall to record statistics on the IP traffic that traverses its interfaces.
    The Palo Alto Networks security platform can export the statistics as NetFlow fields to a NetFlow collector. The NetFlow
    collector is a server you use to analyze network traffic for security, administration, accounting and troubleshooting
    purposes.
  impact: ''
  references: []
  page_start: 93
  audit_raw: 'Go to Device >> Server Profiles >> NetFlow

    If no NetFlow Server Profiles are configured, this is a finding.

    This step assumes that it is one of the Ethernet interfaces that is being monitored.

    The verification is the same for Ethernet, VLAN, Loopback and Tunnel interfaces.

    1. Ask the administrator which interface is being monitored; there may be more than

    one.

    2. Go to Network >> Interfaces >> Ethernet

    3. Select the interface that is being monitored.

    If the "Netflow Profile" field is "None", this is a finding.'
  remediation: 'To create a NetFlow Server Profile:

    1. Go to Device >> Server Profiles >> NetFlow

    2. Select "Add".

    3. In the "NetFlow Server Profile" window, complete the required fields.

    4. In the "Name" field, enter the name of the NetFlow Server Profile.

    5. In the "Minutes" field, enter the number of minutes after which the NetFlow

    template is refreshed.

    6. In the "Packets" field, enter the number of packets after which the NetFlow

    template is refreshed.

    7. In the "Active Timeout" field, enter the frequency (in minutes) the device exports

    records.

    8. Select the "PAN-OS Field Types" check box to export "App-ID" and "User-ID"

    fields.

    9. Select "Add" to add a NetFlow collector.

    10. In the "Name" field, enter the name of the server.

    11. In the "NetFlow Server" field, enter the hostname or IP address of the server.

    12. In the "Port" field enter the port used by the NetFlow collector (default 2055).

    13. Select "OK".

    Assign the NetFlow server profile to the interfaces that carry the traffic to be analyzed.

    These steps assume that it is one of the Ethernet interfaces. The configuration is the

    same for Ethernet, VLAN, Loopback, and Tunnel interfaces.

    1. Go to Network >> Interfaces >> Ethernet

    2. Select the interface that the traffic traverses.

    3. In the "Ethernet Interface" window, in the "Netflow Profile" field, select the

    configured Netflow Profile.

    4. Select "OK".

    5. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    6. Select "OK" when the confirmation dialog appears.'
