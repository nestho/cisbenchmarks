- id: '1.12'
  title: PANW-AG-000049
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must block phone home traffic. GROUP ID: V-228843 RULE ID: SV-228843r997591'
  rationale: A variety of Distributed Denial of Service (DDoS) attacks and other attacks use "botnets" as an attack vector.
    A botnet is a collection of software agents (referred to as "bot"), residing on compromised computers. Attacks are orchestrated
    by a "bot herder" to command these agents to launch attacks. Part of the command and control communication between the
    controller and the bots is a message sent from a bot that informs the controller that it is operating. This is referred
    to as a "phone home" message. On the Palo Alto Networks security platform, a security policy can include an Antispyware
    Profile for “phone home” detection (detection of traffic from installed spyware). The device has two pre-configured Anti-spyware
    Profiles; Default and Strict. The Default Anti-spyware Profile sends an alert for detected phone-home traffic for all
    severity levels except the low and informational severity threat levels, while the Strict Anti-spyware Profile blocks
    phone-home traffic for the critical, high, and medium severity threat levels. Phone home traffic must either be blocked
    or intercepted by the DNS Sinkholing feature. Therefore, a custom Anti-spyware Profile or the Strict Anti-spyware Profile
    must be used instead of the Default Anti-spyware Profile. Note that there are specific implementation requirements for
    DNS Sinkholing to operate properly; refer to the Palo Alto Networks documentation for details.
  impact: ''
  references: []
  page_start: 38
  audit_raw: 'Ask the Administrator which Anti-Spyware profile is used:

    Go to Objects >> Security Profiles >> Anti-Spyware.

    Select the Anti-Spyware Profile.

    In the "Anti-Spyware Profile" window, in the "DNS Signatures" tab, in the Action on

    "DNS queries" field, if either "block" or "sinkhole" is not selected, this is a finding.

    Ask the Administrator which Security Policy Rule allows traffic from client hosts in the

    trust zone to the untrust zone:

    1. Go to Policies >> Security.

    2. Select the identified policy rule.

    3. View the "Security Policy Rule" window.

    4. Select the "Actions" tab.

    5. In the "Profile Setting" section, in the "Anti-Spyware" field, if there is no AntiSpyware Profile or the Anti-Spyware
    Profile is not the correct one, this is a

    finding.'
  remediation: '1. Go to Objects >> Security Profiles >> Anti-Spyware.

    2. Select the name of a configured Anti-Spyware Profile or select "Add" to create a

    new one.

    3. In the "Anti-Spyware Profile" window, in the "DNS Signatures" tab, in the Action

    on "DNS queries" field, select "block" or "sinkhole".

    4. If "sinkhole" is selected, complete the "Sinkhole IPv4" and "Sinkhole IPv6" fields.

    Note: If DNS Sinkholing is used, the device and network must be configured to support

    it.

    If this is a new Anti-Spyware Profile, complete the required fields in all tabs.

    1. Select "OK".

    2. Use the Anti-Spyware Profile in a Security Policy;

    3. Edit the Security Policy Rule that allows traffic from client hosts in the trust zone

    to the untrust zone to include the sinkhole zone as a destination and attach the

    Anti-spyware Profile. Select or configure a rule that allows traffic from the client

    host zone to the untrust zone.

    4. Go to Policies >> Security.

    5. Select the appropriate existing policy rule or select "Add" to create a new one.

    6. In the "Actions" tab in the "Profile Setting" section; in the "Profile Type" field,

    select "Profiles". The window will change to display the different categories of

    Profiles.

    7. In the "Actions" tab in the "Profile Setting" section; in the "Anti-Spyware" field,

    select the configured Anti-Spyware Profile.

    8. Select "OK".

    9. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    10. Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'Ask the Administrator which Anti-Spyware profile is used:

      Go to Objects >> Security Profiles >> Anti-Spyware.

      Select the Anti-Spyware Profile.

      In the "Anti-Spyware Profile" window, in the "DNS Signatures" tab, in the Action on

      "DNS queries" field, if either "block" or "sinkhole" is not selected, this is a finding.

      Ask the Administrator which Security Policy Rule allows traffic from client hosts in the

      trust zone to the untrust zone:

      1. Go to Policies >> Security.

      2. Select the identified policy '
