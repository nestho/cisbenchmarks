- id: '1.45'
  title: PANW-AG-000141
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform providing encryption intermediary services must implement NIST FIPS-validated
    cryptography to generate cryptographic hashes. GROUP ID: V-228876 RULE ID: SV-228876r831617'
  rationale: Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect data.
    The network element must implement cryptographic modules adhering to the higher standards approved by the federal government
    since this provides assurance they have been tested and validated.
  impact: ''
  references: []
  page_start: 123
  audit_raw: 'If the Palo Alto Networks security platform does not provide encryption intermediary

    services (e.g., HTTPS or TLS), this is not applicable.

    Use the command line interface to determine if the device is operating in FIPS mode.

    Enter the CLI command "show fips-mode" or the command show fips-cc (for more

    recent releases).

    If fips-mode or fips-cc is set to off, this is a finding.'
  remediation: 'Power off the device by unplugging it from the electrical outlet.

    Connect a console cable from the console port to a computer serial port, and use a

    terminal program to connect to the Palo Alto Networks device.

    The serial parameters are "9600 baud", "8 data bits", "no parity", and "1 stop bit".

    A USB to serial adapter will be necessary if the computer does not have a serial port.

    During the boot sequence, this message will appear:

    Autoboot to default partition in 5 seconds.

    Enter

    "maint" to boot to "maint" partition.

    Enter

    "maint" to enter maintenance mode.

    Press "Enter", and the "Maintenance Recovery tool" menu will appear.

    Select "Set FIPS Mode" (or fips-cc for later versions) from the menu; once the device

    has finished rebooting, it will be in FIPS mode.

    Note: This will remove all installed licenses and disable the serial port.'
