- id: '1.5'
  title: PANW-AG-000024
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Palo Alto Networks security platform must log violations of security policies. GROUP ID: V-228836 RULE
    ID: SV-228836r557387'
  rationale: Without establishing the source of the event, it is impossible to establish, correlate, and investigate the events
    leading up to an outage or attack. In order to compile an accurate risk assessment and provide forensic analysis, security
    personnel need to know the source of the event. In addition to logging where sources of events such as IP addresses, processes,
    and node or device names, it is important to log the name or identifier of each specific policy or rule that is violated.
    In the Palo Alto Networks security platform, traffic logs record information about each traffic flow, and threat logs
    record the threats or problems with the network traffic, such as virus or spyware detection. Note that the antivirus,
    anti-spyware, and vulnerability protection profiles associated with each rule determine which threats are logged (locally
    or remotely).
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'Go to Policies >> Security

    View the configured security policies.

    For any Security Policy where the "Action" column shows "deny", view the "Options"

    column; if there are no icons in the column, this is a finding.

    Note: The "Action" column and the "Option" column are usually near the right edge; it

    may be necessary to use the slide to view them.'
  remediation: 'Go to Policies >> Security

    Select "Add" to create a new security policy or select the name of the security policy to

    edit it.

    Configure the specific parameters of the policy by completing the required information in

    the fields of each tab.

    In the "Actions" tab, select "Log At Session End". This generates a traffic log entry for

    the end of a session and logs drop and deny entries.

    Note: Traffic and Security Logs are required to be forwarded to syslog servers.

    In the "Log Forwarding" field, select a configured log forwarding profile.

    Commit changes by selecting "Commit" in the upper-right corner of the screen.

    Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'Go to Policies >> Security

      View the configured security policies.

      For any Security Policy where the "Action" column shows "deny", view the "Options"

      column; if there are no icons in the column, this is a finding.

      Note: The "Action" column and the "Option" column are usually near the right edge; it

      may be necessary to use the slide to view them.'
    severity: medium
- id: '1.6'
  title: PANW-AG-000035
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must only enable User-ID on trusted zones. GROUP ID: V-228837 RULE
    ID: SV-228837r557387'
  rationale: User-ID can use Windows Management Instrumentation (WMI) probing as a method of mapping users to IP addresses.
    If this is used, the User-ID Agent will send a probe to each learned IP address in its list to verify that the same user
    is still logged in. The results of the probe will be used to update the record on the agent and then be passed on to the
    firewall. WMI probing is a Microsoft feature that collects user information from Windows hosts and contains a username
    and encrypted password hash of a Domain Administrator account. If User-ID and WMI probing are enabled on an external untrusted
    zone (such as the Internet), probes could be sent outside the protected network, resulting in an information disclosure
    of the User-ID Agent service account name, domain name, and encrypted password hash. This information has the potential
    to be cracked and exploited by an attacker to gain unauthorized access to protected resources. For this important reason,
    User-ID should never be enabled on an untrusted zone.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'To verify that Windows Management Instrumentation (WMI) probing is unchecked for all

    untrusted zones:

    Go to Network >> Zones, view each zone.

    If the Zone is untrusted and if the UserID Enabled column is checked, this is a finding.

    1. Go to Network >> Network Profiles >> Interface Mgmt

    2. View the configured Interface Management Profiles.

    3. Note which Interface Management Profiles have the "User-ID" field enabled

    (checked).

    4. Go Network >> Interfaces

    5. Each interface is listed; note that there are four tabs - Ethernet, VLAN, Loopback,

    and Tunnel. Each type can have an Interface Management Profile applied to it.

    View each interface that is in an untrusted security zone; if each one has no Interface

    Management Profile applied, this is not a finding.

    If each interface in an untrusted security zone has an Interface Management Profile

    applied to it, the Interface Management Profile must be one that does not have User-ID

    enabled; if it does, this is a finding.'
  remediation: 'To deny User-ID on untrusted zones:

    1. Go to Network >> Zones, select the name of the zone.

    2. If the Zone is untrusted, In the Zone window, deselect (uncheck) the Enable User

    Identification check box.

    3. Select "OK".

    4. Go to Network >> Network Profiles >> Interface Mgmt

    5. Select "Add" to create a new profile or select the name of a profile to edit it.

    6. In the "Interface Management Profile" window, deselect the "User-ID" check box

    if it is selected.

    7. Select "OK".

    Note: This action precludes that particular Interface Management Profile from

    supporting User-ID.

    An interface does not need an Interface Management Profile to operate; only to be

    managed on that interface.

    1. Go Network >> Interfaces

    2. Each interface is listed; note that there are four tabs - Ethernet, VLAN, Loopback,

    and Tunnel.

    3. Each type can have an Interface Management Profile applied to it.

    4. View each interface that is in an untrusted security zone; if it has an Interface

    Management Profile applied to it, the Interface Management Profile must be one

    that does not have User-ID enabled.'
  checks:
  - type: manual_review
    info: 'To verify that Windows Management Instrumentation (WMI) probing is unchecked for all

      untrusted zones:

      Go to Network >> Zones, view each zone.

      If the Zone is untrusted and if the UserID Enabled column is checked, this is a finding.

      1. Go to Network >> Network Profiles >> Interface Mgmt

      2. View the configured Interface Management Profiles.

      3. Note which Interface Management Profiles have the "User-ID" field enabled

      (checked).

      4. Go Network >> Interfaces

      5. Each interface is listed; note that there'
    severity: medium
- id: '1.7'
  title: PANW-AG-000036
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must disable WMI probing if it is not used. GROUP ID: V-228838 RULE
    ID: SV-228838r557387'
  rationale: User-ID can use Windows Management Instrumentation (WMI) probing as a method of mapping users to IP addresses.
    If this is used, the User-ID Agent will send a probe to each learned IP address in its list to verify that the same user
    is still logged in. The results of the probe will be used to update the record on the agent and then be passed on to the
    firewall. WMI probing is a Microsoft feature that collects user information from Windows hosts, and contains a username
    and encrypted password hash of a Domain Administrator account. WMI probing on external/untrusted zones can result in the
    User-ID agent sending WMI probes to external/untrusted hosts. An attacker can capture these probes and obtain the username,
    domain name and encrypted password hash associated with the User-ID account. If WMI probing is not used as a method of
    user to IP address mapping, it must be disabled.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'Ask the Administrator if User-ID uses WMI Probing; if it does, this is not a finding.

    Go to Device >> User Identification

    On the "User Mapping" tab, in the "Palo Alto Networks User ID Agent" pane, view the

    "Enable Probing" check box. If it is selected, this is a finding.'
  remediation: 'To disable WMI probing if it is not used:

    1. Go to Device >> User Identification

    2. On the "User Mapping" tab, in the "Palo Alto Networks User ID Agent" pane, view

    the "Enable Probing" check box.

    3. If it is selected, select the "Edit" icon in the upper-right corner of the pane.

    4. In the "Palo Alto Networks User ID Agent Setup" window, in the "Client Probing"

    tab, deselect the "Enable Probing" check box.'
  checks:
  - type: manual_review
    info: 'Ask the Administrator if User-ID uses WMI Probing; if it does, this is not a finding.

      Go to Device >> User Identification

      On the "User Mapping" tab, in the "Palo Alto Networks User ID Agent" pane, view the

      "Enable Probing" check box. If it is selected, this is a finding.'
    severity: medium
- id: '1.8'
  title: PANW-AG-000037
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must not enable the DNS proxy. GROUP ID: V-228839 RULE ID: SV-228839r557387'
  rationale: The Palo Alto Networks security platform can act as a DNS proxy and send the DNS queries on behalf of the clients.
    DNS queries that arrive on an interface IP address can be directed to different DNS servers based on full or partial domain
    names. However, unrelated or unneeded proxy services increase the attack vector surface and add excessive complexity to
    securing the device.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'To check if DNS Proxy is configured:

    Go to Network >> DNS Proxy

    If there are entries in the pane, this is a finding.'
  remediation: 'Do not configure and enable the DNS Proxy capability.

    Go to Network >> DNS Proxy

    If there are no entries in the pane, then this capability has not been enabled.'
  checks:
  - type: manual_review
    info: 'To check if DNS Proxy is configured:

      Go to Network >> DNS Proxy

      If there are entries in the pane, this is a finding.'
    severity: medium
- id: '1.9'
  title: PANW-AG-000038
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must be configured to prohibit or restrict the use of functions,
    ports, protocols, and/or services, as defined in the PPSM CAL and vulnerability assessments. GROUP ID: V-228840 RULE ID:
    SV-228840r557387'
  rationale: In order to prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized
    tunneling (i.e., embedding of data types within data types); organizations must disable or restrict unused or unnecessary
    physical and logical ports/protocols on information systems. The DoD continually assesses the ports, protocols, and services
    that can be used for network communications. Some ports, protocols, or services have known exploits or security weaknesses.
    Network traffic using these ports, protocols, and services must be prohibited or restricted in accordance with DoD policy.
    It is the responsibility of the enclave owner to have the applications the enclave uses registered in the PPSM database.
    The Palo Alto Networks security platform must be configured to prevent or restrict the use of prohibited ports, protocols,
    and services throughout the network by filtering the network traffic and disallowing or redirecting traffic as necessary.
    If the device is in a Deny-by-Default posture and what is allowed through the filter is IAW DoD Instruction 8551, and
    if the permit rule is explicitly defined with explicit ports and protocols allowed, then all requirements related to PPS
    being blocked are satisfied. Since the enclave or system may support custom applications, it may be necessary to configure
    a Custom Application. This requires detailed analysis of the application traffic and requires validation testing before
    deployment.
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'Review the list of authorized applications, endpoints, services, and protocols that has

    been added to the PPSM database.

    Go to Policies >> Security

    Review each of the configured security policies in turn.

    If any of the policies allows traffic that is prohibited by the PPSM CAL, this is a finding.'
  remediation: 'To configure a security policy:

    1. Go to Policies >> Security

    2. Select "Add".

    3. In the "Security Policy Rule" window, complete the required fields.

    4. In the "General" tab, complete the "Name" and "Description" fields.

    5. In the "Source" tab, complete the "Source Zone" and "Source Address" fields.

    6. In the "User" tab, select "Any" or complete the "Source User" field; this is

    completed if the policy performs the defined actions based on an individual user

    or group of users. If using GlobalProtect with Host Information Profile (HIP)

    enabled, select the "HIP Profiles" check box, and add the HIP Object or HIP

    Profile.

    7. In the "Destination" tab, complete the "Destination Zone" and "Destination

    Address" fields.

    8. In the "Applications" tab, select the authorized applications.

    9. In the "Service/URL Category" tab, select application-default. To add a service,

    select the "Service" check box, select "Add", and select a listed service or add a

    new service or service group.

    10. In the "Actions" tab, select either "Deny" or "Allow" (as required) as the resulting

    action. Select the required Log Setting and Profile Settings as necessary.

    11. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    12. Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'Review the list of authorized applications, endpoints, services, and protocols that has

      been added to the PPSM database.

      Go to Policies >> Security

      Review each of the configured security policies in turn.

      If any of the policies allows traffic that is prohibited by the PPSM CAL, this is a finding.'
    severity: medium
- id: '1.10'
  title: PANW-AG-000044
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform that provides intermediary services for TLS must validate certificates
    used for TLS functions by performing RFC 5280-compliant certification path validation. GROUP ID: V-228841 RULE ID: SV-228841r557387'
  rationale: A certificate's certification path is the path from the end entity certificate to a trusted root certification
    authority (CA). Certification path validation is necessary for a relying party to make an informed decision regarding
    acceptance of an end entity certificate. Certification path validation includes checks such as certificate issuer trust,
    time validity and revocation status for each certificate in the certification path. Revocation status information for
    CA and subject certificates in a certification path is commonly provided via certificate revocation lists (CRLs) or online
    certificate status protocol (OCSP) responses. The Palo Alto Networks security platform can be configured to use Open Certificate
    Status Protocol (OCSP) and/or certificate revocation lists (CRLs) to verify the revocation status of certificates and
    the device itself can be configured as an OCSP responder.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'If the Palo Alto Networks security platform does not provide intermediary services for

    TLS or application protocols that use TLS (e.g., HTTPS), this is not applicable.

    1. Go to Device >> Certificate Management >> OCSP Responder

    2. If no OCSP Responder is configured, this is a finding.

    3. Go to Device >> Setup >> Management

    4. In the "Management Interface Settings" pane, if "HTTP OCSP" is not listed under

    "Services", this is a finding.'
  remediation: 'To configure the Palo Alto Networks security platform to use an OCSP responder:

    Go to Device >> Certificate Management >> OCSP Responder

    Select "Add".

    In the "OCSP Responder" window, enter the host name or IP address of the OCSP

    responder.

    Note: If the firewall itself is configured as an OCSP responder, the host name must

    resolve to an IP address in the interface that the firewall uses for OCSP services.

    To enable OCSP communication on the firewall:

    1. Go to Device >> Setup >> Management

    2. In the "Management Interface Settings" pane, select the "Edit" icon.

    3. In the "Management Interface Settings" box, under "Services" check HTTP

    OCSP to enable it.

    4. Select "OK"

    Optionally, to configure the device itself as an OCSP responder, add an Interface

    Management Profile to the interface used for OCSP services.

    1. Go to Network >> Network Profiles >> Interface Management

    2. Select "Add" to create a new profile or click the name of an existing profile.

    3. In the "Interface Management Profiles" window, under "Permitted Services",

    check HTTP OCSP.

    4. Select "OK".

    Go to Network >> Interfaces

    Select the name of the interface that the firewall will use for OCSP services.

    Note: When the device itself as an OCSP responder, the OCSP Host Name must

    resolve to an IP address in this interface.

    In the "Interface" window, under Other Info, in the "Management Profile" field, select the

    configured Management Profile.

    1. Select "OK".

    2. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    3. Select "OK" when the confirmation dialog appears.'
