  rationale: Data mining is the analysis of large quantities of data to discover patterns and is used in intelligence gathering.
    Failure to prevent attacks launched against organizational information from unauthorized data mining may result in the
    compromise of information. Injection attacks allow an attacker to inject code into a program or query or inject malware
