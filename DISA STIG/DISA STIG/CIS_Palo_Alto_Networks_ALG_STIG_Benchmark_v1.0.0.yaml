- id: '1.11'
  title: PANW-AG-000047
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must protect against the use of internal systems for launching denial-of-service
    (DoS) attacks against external networks or endpoints. GROUP ID: V-228842 RULE ID: SV-228842r1028359'
  rationale: DoS attacks from DOD sources risk the reputation of the organization. Thus, it is important to protect against
    the DOD system being used to launch an attack on external systems. Although Zone Protections are applied on the ingress
    interface, at a minimum, DOD requires a zero-trust approach. These attacks may use legitimate internal or rogue endpoints
    from inside the enclave. These attacks can be simple "floods" of traffic to saturate circuits or devices, malware that
    consumes CPU and memory on a device or causes it to crash, or a configuration issue that disables or impairs the proper
    function of a device. For example, an accidental or deliberate misconfiguration of a routing table can misdirect traffic
    for multiple networks. It is important to set the Flood Protection parameters that are suitable for the enclave or system.
    The Administrator should characterize the traffic regularly (perform a traffic baseline) and tune these parameters based
    on that information.
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'Ask the Administrator if the device is using a Zone-Based Protection policy or a DoS

    Protection policy to protect against DoS attacks originating from the enclave.

    If it is using a DoS Protection policy, perform the following:

    Navigate to Objects >> Security Profiles >> DoS Protection.

    If there are no DoS Protection Profiles configured, this is a finding.

    There may be more than one configured DoS Protection Profile; ask the Administrator

    which DoS Protection Profile is intended to protect outside networks from internallyoriginated DoS attacks.

    If there is no such DoS Protection Profiles, this is a finding.

    If it is using a Zone-Based Protection policy, perform the following:

    Navigate to Network >> Network Profiles >> Zone Protection.

    If there are no Zone Protection Profiles configured, this is a finding.

    There may be more than one configured Zone Protection Profile; ask the Administrator

    which Zone Protection Profile is intended to protect outside networks from internallyoriginated DoS attacks.

    If there is no such Zone Protection Profile, this is a finding.

    Navigate to Network >> Zones.

    If the "Zone Protection Profile" column for the internal zone or the DMZ is blank, this is a

    finding.

    If it lists an incorrect Zone Protection Profile, this is also a finding.'
  remediation: 'Configure either a Zone-Based Protection policy or a DoS Protection policy to protect

    against DoS attacks originating from the enclave.

    To configure a DoS Protection policy, perform the following:

    1. Navigate to Objects >> Security Profiles >> DoS Protection.

    2. Select "Add" to create a new profile.

    3. In the "DoS Protection Profile" window, complete the required fields.

    4. For the "Type", select "Classified".

    5. In the "Flood Protection" tab, "SYN Flood" sub-tab, select the "SYN Flood" check

    box and select either "Random Early Drop" (preferred in this case) or "SYN

    Cookie"; complete the "Alarm Rate", "Activate Rate", "Max Rate", and "Block

    Duration" fields.

    6. In the "Flood Protection" tab, "UDP Flood" sub-tab, select the "UDP Flood" check

    box; complete the "Alarm Rate", "Activate Rate", "Max Rate", and "Block

    Duration" fields.

    7. In the "Flood Protection" tab, "ICMP Flood" sub-tab, select the "ICMP Flood"

    check box; complete the "Alarm Rate", "Activate Rate", "Max Rate", and "Block

    Duration" fields.

    8. In the "Flood Protection" tab, "ICMPv6 Flood" sub-tab, select the "ICMPv6 Flood"

    check box; complete the "Alarm Rate", "Activate Rate", "Max Rate", and "Block

    Duration" fields.

    9. In the "Flood Protection" tab, "Other IP Flood" sub-tab, select the "Other IP

    Flood" check box; complete the "Alarm Rate", "Activate Rate", "Max Rate", and

    "Block Duration" fields.

    10. In the "Resources Protection" tab, leave the "Maximum Concurrent Sessions"

    check box unselected.

    11. Select "OK".

    12. Navigate to Policies >> DoS Protection.

    13. Select "Add" to create a new policy.

    14. In the "DoS Rule" window, complete the required fields.

    15. In the "General" tab, complete the "Name" and "Description" fields.

    16. In the "Source" tab, for "Zone", select the "Internal" zone, for "Source Address",

    select "Any".

    17. In the "Destination" tab, "Zone", select "External" zone, for "Destination Address",

    select "Any".

    18. In the "Option/Protection" tab:

    19. For "Service", select "Any".

    20. For "Action", select "Protect".

    21. Select the "Classified" check box.

    22. In the "Profile" field, select the configured DoS Protection profile for outbound

    traffic.

    23. In the "Address" field, select source-ip-only.

    24. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    25. Select "OK" when the confirmation dialog appears.

    To configure a Zone-Based Protection policy, perform the following:

    1. Navigate to Network >> Network Profiles >> Zone Protection

    2. Select "Add".

    3. In the "Zone Protection Profile" window, complete the required fields.

    4. In the "General" tab, complete the "Name" and "Description" fields.

    5. In the "Flood Protection" tab, select the "SYN" check box, in the "Action" field,

    select either "Random Early Drop" (preferred in this case) or "SYN Cookie";

    complete the "Alert", "Activate", and "Maximum" fields.

    6. In the "Flood Protection" tab, select the "ICMP" check box; complete the "Alert",

    "Activate", and "Maximum" fields.

    7. In the "Flood Protection" tab, select the "ICMPv6" check box; complete the

    "Alert", "Activate", and "Maximum" fields.

    8. In the "Flood Protection" tab, select the "Other IP" check box; complete the

    "Alert", "Activate", and "Maximum" fields.

    9. In the "Flood Protection" tab, select the "UDP" check box; complete the "Alert",

    "Activate", and "Maximum" fields.

    10. For each of the "Alert", "Activate", and "Maximum" fields, the appropriate values

    depend on the expected traffic of the system.

    11. In the "Reconnaissance Protection" tab, select the "TCP Port Scan", "Host

    Sweep", and "UDP Port Scan" rows. In the "Action" field, select "Block". The

    "Interval" and "Threshold" values can either remain as the default values or they

    can be changed based on the specific traffic conditions of the network

    (preferred).

    In the "Packet Based Attack Protection" tab:

    1. "TCP/IP Drop" sub-tab, select the "Spoofed IP address", and "Mismatched

    overlapping TCP segment" check boxes.

    2. In the "IP Option Drop" section, select the "Strict Source Routing", "Loose Source

    Routing", "Timestamp", "Unknown", and "Malformed" check boxes.

    3. The "Record Route", "Security", and "Stream ID" check boxes can remain

    unchecked.

    4. For the "Reject Non-SYN TCP" field, select "yes".

    5. For the "Asymmetric Path" field, select "bypass".

    6. "ICMP Drop" sub-tab, select the "ICMP Ping ID 0", "ICMP Fragment", "ICMP

    Large Packet(>1024)" check boxes.

    7. The "Discard ICMP embedded with error message", "Suppress ICMP TTL

    Expired Error", and "Suppress ICMP Frag Needed" boxes can remain

    unchecked.

    8. Since this requirement is specifically to prevent internal systems from launching

    DoS attacks against other networks or endpoints, select the following from the

    "ICMP Drop" sub-tab: "ICMP Ping ID 0", "ICMP Fragment", "ICMP Large

    Packet(>1024)", "Suppress ICMP TTL Expired Error", "Suppress ICMP Frag

    Needed".

    9. "IPv6 Drop" sub-tab, select the "Type 0 Routing Header", "IPv4 compatible

    address", "Anycast source address", "Needless fragment header", "MTU in

    ICMPv6 ''Packet Too Big'' less than 1280 bytes", "Hop-by-Hop extension",

    "Routing extension", "Destination extension", "Invalid IPv6 options in extension

    header", and "Non-zero reserved field" check boxes.

    10. "ICMPv6" sub-tab, select the "ICMPv6 destination unreachable", "ICMPv6 packet

    too big", "ICMPv6 time exceeded", "ICMPv6 parameter problem", and "ICMPv6

    redirect" check boxes.

    11. Select "OK".

    Apply the Zone Protection Profile to any zone that includes egress interfaces to external

    networks:

    1. Navigate to Network >> Zones.

    2. Select the zone to be configured.

    3. In the "Zone" window, in the "Zone Protection Profile" window, select the

    configured Zone Protection Profile.

    4. Select "OK".

    5. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    6. Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'Ask the Administrator if the device is using a Zone-Based Protection policy or a DoS

      Protection policy to protect against DoS attacks originating from the enclave.

      If it is using a DoS Protection policy, perform the following:

      Navigate to Objects >> Security Profiles >> DoS Protection.

      If there are no DoS Protection Profiles configured, this is a finding.

      There may be more than one configured DoS Protection Profile; ask the Administrator

      which DoS Protection Profile is intended to protect outsid'
