- id: '1.15'
  title: PANW-AG-000052
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must terminate communications sessions after 15 minutes of inactivity.
    GROUP ID: V-228846 RULE ID: SV-228846r971530'
  rationale: 'Idle sessions can accumulate, leading to an exhaustion of memory in network elements processing traffic flows.
    Note that the 15 minute period is a maximum value; Administrators can choose shorter timeout values to account for system-
    or networkspecific requirements. On a Palo Alto Networks security platform, a session is defined by two uni-directional
    flows, each uniquely identified by a 6-tuple key: source-address, destination-address, source-port, destination-port,
    protocol, and security-zone. Besides the six attributes that identify a session, each session has few more notable identifiers:
    end hosts - the source IP and destination IP which will be marked as client(source IP) and server(destination IP) and
    flow direction - each session is bi-directional and is identified by a two unidirectional flows, the first flow is client-to-server(c2s)
    and the returning flow is server-toclient(s2c). Sessions between endpoints are kept active by either normal traffic or
    by keepalive messages (also sometimes referred to as heartbeat messages). On the Palo Alto Networks security platform,
    the session timeout period is the time (seconds) required for the application to time out due to inactivity. Session timeouts
    are configured globally and on a per-application basis. When configured, timeouts for an application override the global
    TCP or UDP session timeouts.'
  impact: ''
  references: []
  page_start: 45
  audit_raw: 'To check global values:

    Go to Device >> Setup >> Session

    In the "Session Timeouts" pane, if the TCP field has a value of greater than "900", this is

    a finding.

    Obtain the list of authorized applications for the system or network.

    To check application-specific values:

    1. Go to Objects >> Applications

    2. Select, in turn, each authorized application.

    3. In the "Application" window, in the "Options" pane, view the "TCP" and "UDP

    Timeout" fields, if the value is greater than "900", this is a finding.

    Many applications will not have one of these two fields.'
  remediation: 'To configure the global values:

    1. Go to Device >> Setup >> Session

    2. In the "Session Timeouts" pane, select the "Edit" icon (the gear symbol in the

    upper-right corner of the pane).

    3. In the "TCP" field, enter "900".

    4. Select "OK".

    To configure application-specific values:

    1. Go to Objects >> Applications

    2. Select an application name to view additional details about the application.

    3. To search for a specific application, enter the "application name" or "description"

    in the "Search" field.

    4. In the "Application" window, in the "Options" pane, in the "TCP Timeout" field,

    select "Customize".

    5. In the Application specific window, in the "TCP" and "UDP Timeout" fields, enter

    "900" if the existing value is greater than "900". Many applications will not have

    one of these two fields.

    6. Select "OK".

    7. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    8. Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'To check global values:

      Go to Device >> Setup >> Session

      In the "Session Timeouts" pane, if the TCP field has a value of greater than "900", this is

      a finding.

      Obtain the list of authorized applications for the system or network.

      To check application-specific values:

      1. Go to Objects >> Applications

      2. Select, in turn, each authorized application.

      3. In the "Application" window, in the "Options" pane, view the "TCP" and "UDP

      Timeout" fields, if the value is greater than "900", this is a finding.'
    severity: medium
- id: '1.16'
  title: PANW-AG-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must update malicious code protection mechanisms and signature definitions
    whenever new releases are available in accordance with organizational configuration management policy and procedures.
    GROUP ID: V-228847 RULE ID: SV-228847r1018772'
  rationale: In order to minimize any potential negative impact to the organization caused by malicious code, malicious code
    must be identified and eradicated. Malicious code includes viruses, worms, Trojan horses, and Spyware.
  impact: ''
  references: []
  page_start: 48
  audit_raw: 'Check if the device is using the most current protection mechanisms and signature

    definitions.

    If the device has authorized connectivity to the Palo Alto site, the automated process

    can be used.

    1. Go to Device >> Dynamic Updates.

    2. View the list of updates, and note the date of the most recent one.

    3. Select "Check Now" at the bottom of the page; if new updates appear, this is a

    finding.

    4. If the device does not have connectivity to the Palo Alto site, a manual process

    must be used.

    5. Log on to the Palo Alto Support site (registration required).

    6. Select the “Dynamic Updates” hyperlink.

    7. Check for the most current update (the version and release date of each update

    is listed).

    8. Go to Device >> Dynamic Updates.

    9. View the list of updates and note the date of the most recent one.

    10. If the device does not have the most current updates installed, this is a finding.'
  remediation: 'If the device has authorized connectivity to the Palo Alto site, automatic updates can be

    used.

    1. To schedule automatic updates:

    2. Go to Device >> Dynamic Updates.

    3. Select the text to the right of Schedule.

    4. In the "Applications and Threat Updates Schedule" Window; complete the

    required information.

    5. In the "Recurrence" field, select the desired frequency. If the update frequency is

    Weekly, select which day of the week.

    6. In the "Time" field, enter the time at which you want the device to check for

    updates.

    7. For the Action, select "Download and Install".

    8. Select "OK".

    9. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    10. Select "OK" when the confirmation dialog appears.

    To retrieve the latest signatures:

    1. Go to Device >> Dynamic Updates.

    2. Select "Check Now" at the bottom of the page.

