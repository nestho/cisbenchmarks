    section, select "allow".

    6. In the "Security Policy Rule" window, in the "Actions" tab, in the "Profiles Setting"

    section, select the necessary Profiles.

    7. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    8. Select "OK" when the confirmation dialog appears.'
