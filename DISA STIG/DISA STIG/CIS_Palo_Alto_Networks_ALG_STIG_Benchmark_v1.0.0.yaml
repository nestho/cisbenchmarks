- id: '1.23'
  title: PANW-AG-000078
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform, if used as a TLS gateway/decryption point or VPN concentrator, must
    control remote access methods (inspect and filter traffic). GROUP ID: V-228854 RULE ID: SV-228854r831594'
  rationale: Remote access devices, such as those providing remote access to network devices and information systems, which
    lack automated control capabilities, increase risk and makes remote user access management difficult at best. Remote access
    is access to DoD-nonpublic information systems by an authorized user (or an information system) communicating through
    an external, non-organizationcontrolled network. Remote access methods include broadband and wireless connections. Remote
    access methods include, for example, proxied remote encrypted traffic (e.g., TLS gateways, web content filters, and webmail
    proxies). If the Palo Alto Networks security platform is used as a TLS gateway/decryption point or VPN concentrator, configure
    the device to inspect and filter decrypted traffic. For each type of SSL/TLS traffic that is decrypted, the resulting
    traffic must be inspected and filtered. For example, HTTPS traffic that is decrypted must have the HTTP traffic inspected
    and filtered.
  impact: ''
  references: []
  page_start: 64
  audit_raw: 'If the Palo Alto Networks security platform is not used as a TLS gateway/decryption

    point or VPN concentrator, this is not applicable.

