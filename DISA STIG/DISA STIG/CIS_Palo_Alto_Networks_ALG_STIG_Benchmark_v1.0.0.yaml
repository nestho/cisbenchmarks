- id: '1.13'
  title: PANW-AG-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must deny outbound IP packets that contain an illegitimate address
    in the source address field. GROUP ID: V-228844 RULE ID: SV-228844r557387'
  rationale: A compromised host in an enclave can be used by a malicious actor as a platform to launch cyber attacks on third
    parties. This is a common practice in "botnets", which are a collection of compromised computers using malware to attack
    (usually DDoS) other computers or networks. DDoS attacks frequently leverage IP source address spoofing, in which packets
    with false source IP addresses send traffic to multiple hosts, who then send return traffic to the hosts with the IP addresses
    that were forged. This can generate significant, even massive, amounts of traffic. Therefore, protection measures to counteract
    IP source address spoofing must be taken. Enclaves must enforce egress filtering. In egress filtering, packets leaving
    the enclave are discarded if the source IP address is not part of the IP address network(s), also known as prefixes, which
    are assigned to the enclave. A more specific form of egress filtering is to allow only those hosts and protocols that
    have been identified and authorized to exit the enclave. All traffic leaving the enclave, regardless of the destination,
    must be filtered by the premise router's egress filter to verify that the source IP address belongs to the enclave. Configure
    a security policy that allows only traffic originating from the IP address prefixes assigned to the enclave to exit the
    enclave. The implicit deny cross zone traffic rule will then be used, in part, to deny illegitimate source address traffic
    originating from an internal zone to go to another zone.
  impact: ''
  references: []
  page_start: 41
  audit_raw: 'Verify an anti-spoofing policy is configured for each outgoing zone that drops any traffic

    when the source IP does not match the list of allowed IP ranges for each outgoing zone.

    1. Navigate to the “Zone Protection Profile” configuration screen

    2. Select the “Packet-Based Attack Protection” tab

    3. Select the “IP Drop” tab

    If the “Spoofed IP Address” box is not checked for each outgoing zone, this is a finding.'
  remediation: 'Create an anti-spoofing policy for each outgoing zone that drops any traffic when the

    source IP does not match the list of allowed IP ranges for each outgoing zone.

    1. Navigate to the “Zone Protection Profile” configuration screen.

    2. Select the “Packet- Based Attack Protection” tab.

    3. Select the “IP Drop” tab.

    4. Check the “Spoofed IP Address” box.'
  checks:
  - type: manual_review
    info: 'Verify an anti-spoofing policy is configured for each outgoing zone that drops any traffic

      when the source IP does not match the list of allowed IP ranges for each outgoing zone.

      1. Navigate to the “Zone Protection Profile” configuration screen

      2. Select the “Packet-Based Attack Protection” tab

      3. Select the “IP Drop” tab

      If the “Spoofed IP Address” box is not checked for each outgoing zone, this is a finding.'
    severity: medium
- id: '1.14'
  title: PANW-AG-000051
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must deny network communications traffic by default and allow network
    communications traffic by exception (i.e., deny all, permit by exception). GROUP ID: V-228845 RULE ID: SV-228845r557387'
  rationale: 'A deny-all, permit-by-exception network communications traffic policy ensures that only those connections that
    are essential and approved are allowed. As a managed boundary interface between networks, the Palo Alto Networks security
    platform must block all inbound and outbound network traffic unless a policy filter is installed to explicitly allow it.
    The allow policy filters must comply with the site''s security policy. A deny-all, permit–by-exception network communications
    traffic policy ensures that only those connections that are essential and approved are allowed. By default, there are
    two security policies on the Palo Alto Networks firewall: Allow traffic within the same zone (intra-zone) Deny traffic
    from one zone to another zone (inter-zone). No policy that circumvents the inter-zone policy is allowed. Traffic through
    the device is permitted by policies developed to allow only that specific traffic that the system or enclave requires.'
  impact: ''
  references: []
  page_start: 43
  audit_raw: 'Go to Policies >> Security

    Review each of the configured security policies in turn.

    Select each policy in turn; in the "Security Policy Rule" window, if the "Source Address"

    has "Any" selected, the "Destination Address" has "Any" selected, the "Application" has

    "Any" selected, and the "Action" Setting is "Allow", this is a finding.

    If any Security Policy is too broad (allowing all traffic either inbound or outbound), this is

    also a finding.'
  remediation: 'Do not configure any policies or rules that violate a deny-all, permit-by-exception policy.

    Configure policies that allow traffic through the device based only on the mission and

    system requirements.'
  checks:
  - type: manual_review
    info: 'Go to Policies >> Security

      Review each of the configured security policies in turn.

      Select each policy in turn; in the "Security Policy Rule" window, if the "Source Address"

      has "Any" selected, the "Destination Address" has "Any" selected, the "Application" has

      "Any" selected, and the "Action" Setting is "Allow", this is a finding.

      If any Security Policy is too broad (allowing all traffic either inbound or outbound), this is

      also a finding.'
