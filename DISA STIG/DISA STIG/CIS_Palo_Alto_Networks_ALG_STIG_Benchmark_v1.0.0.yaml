      Enter the CLI command "show fips-mode" or the command show fips-cc (for more

      recent releases).

      If fips-mode or fips-cc is set to "off", this '
- id: '1.3'
  title: PANW-AG-000017
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform that stores secret or private keys must use FIPS-approved key management
    technology and processes in the production and control of private/secret cryptographic keys. GROUP ID: V-228834 RULE ID:
    SV-228834r557387'
  rationale: Private key data is used to prove that the entity presenting a public key certificate is the certificate's rightful
    owner. Compromise of private key data allows an adversary to impersonate the key holder. Private key data associated with
    software certificates is required to be generated and protected in at least a FIPS 140-2 Level 1 validated cryptographic
    module.
