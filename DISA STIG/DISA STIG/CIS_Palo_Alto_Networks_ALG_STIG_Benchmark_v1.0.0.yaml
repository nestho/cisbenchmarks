  audit_raw: 'If the protocol is not used in the implementation, this is not a finding.

    Go to Policies >> Decryption

    If there are no configured Decryption Policies, this is a finding.

    Ask the Administrator which Security Policy inspects authorized FTP traffic.

    1. Go to Policies >> Security

    2. Select the identified Security Policy.

    If the "Profile" column does not display the "Antivirus Profile" symbol, this is a finding.

    If the "Profile" column does not display the "Vulnerability Protection Profile" symbol, this

    is a finding.'
  remediation: 'If FTP and FTPS is authorized for use in the site''s System Security Plan (SSP),

    configure a security policy to allow it and inspect it.

    Since Secure File Transfer Protocol is a form of FTP that adds TLS and SSL

    cryptographic protocols, it is necessary to decrypt TLS in order for the device to inspect

    the FTP stream.

    1. Go to Policies >> Decryption

    2. Select "Add".

    3. In the "Decryption Policy Rule" window, complete the required fields.

    4. In the "Name" tab, complete the "Name" and "Description" fields.

    5. In the "Source" tab, complete the "Source Zone" and "Source Address" or

    "Source User" fields.

    6. In the "Destination" tab, complete the "Destination Zone" and "Destination

    Address" or "Destination User" fields.

    7. In the "Option" tab, select "Decrypt" as the Action. Select the decryption profile.

    8. In the "Type" field, there are three options;

    9. Select "SSL Forward Proxy to decrypt and inspect SSL/TLS traffic from internal

    users to outside networks".

    10. Select "SSH Proxy to decrypt inbound and outbound SSH connections passing

    through the device".

    11. Select "SSL Inbound Inspection to decrypt and inspect incoming SSL traffic".

    Note: This decryption mode can only work if you have control on the internal

    server certificate to import the Key Pair on Palo Alto Networks Device.

    12. Go to Policies >> Security

    13. Select "Add" to create a new security policy or select the name of the security

    policy to edit it.

    14. In the "Security Policy Rule" window, complete the required fields.

    15. In the "Name" tab, complete the "Name" and "Description" fields.

    16. In the "Source" tab, complete the "Source Zone" and "Source Address" fields.

    17. In the "User" tab, complete the "Source User" and "HIP Profile" fields.

    18. In the "Destination" tab, complete the "Destination Zone" and "Destination

    Address" fields.

    19. In the "Applications" tab, either select the "Any" check box or add "ftp", "tftp", and

    "gridftp". Configured filters and groups can be selected if the group includes

    these protocols.

    20. In the "Actions" tab, select "allow".

    21. In the "Actions" tab in the "Profile Setting" section; in the "Profile Type" field,

    select "Profiles". The window will change to display the different categories of

    Profiles.

    22. In the "Profile Setting" section; in each of the Profile fields, select the configured

    Profile.

    Note: An Antivirus Profile and an Antispyware Profile are required.'
  checks:
