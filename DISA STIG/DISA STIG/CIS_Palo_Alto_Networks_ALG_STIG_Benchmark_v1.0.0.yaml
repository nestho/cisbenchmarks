- id: '1.19'
  title: PANW-AG-000064
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must send an immediate (within seconds) alert to the system administrator,
    at a minimum, in response to malicious code detection. GROUP ID: V-228850 RULE ID: SV-228850r557387'
  rationale: Without an alert, security personnel may be unaware of an impending failure of the audit capability; then the
    ability to perform forensic analysis and detect rate-based and other anomalies will be impeded. The device must generate
    an immediate (within seconds) alert that notifies designated personnel of the incident. Since sending a message to an
    unattended log or console does not meet this requirement, the threat logs must be sent to an attended console or to e-mail.
    When the Palo Alto Networks security platform blocks malicious code, it also generates a record in the threat log. This
    message has a medium severity.
  impact: ''
  references: []
  page_start: 55
  audit_raw: 'The following is an example of how to check if the device is sending messages to email; this is one option that
    meets the requirement. If sending messages to an SNMP

    server or Syslog servers is used, follow the vendor guidance on how to verify that

    function:

    Go to Device >> Server Profiles >> Email

    If there is no Email Server Profile configured, this is a finding.

    Go to Objects >> Log forwarding

    If there is no Email Forwarding Profile configured, this is a finding.

    Go to Policies >> Security

    View the Security Policy that is used to detect malicious code (the "Profile" column does

    displays the "Antivirus Profile" symbol) in the "Options" column.

    If the Email Forwarding Profile is not used, this is a finding.'
  remediation: 'The following is an example of how to configure the device to send messages to e-mail;

    this is one option that meets the requirement. If sending messages to an SNMP server

    or Syslog servers is used, follow the vendor guidance on how to configure that function.

    To create an email server profile:

    1. Go to Device >> Server Profiles >> Email

    2. Select "Add".

    3. In the Email Server Profile, enter the name of the profile.

    4. Select "Add".

    5. In the "Servers" tab, enter the required information.

    6. In the "Name" field, enter the name of the Email server.

    7. In the "Email Display Name" field, enter the name shown in the "From" field of the

    email.

    8. In the "From" field, enter the "From email address".

    9. In the "To" field, enter the email address of the recipient.

    10. In the "Additional Recipient" field, enter the email address of another recipient.

    You can only add one additional recipient. To add multiple recipients, add the

    email address of a distribution list.

    11. In the "Gateway" field, enter the IP address or host name of the Simple Mail

    Transport Protocol (SMTP) server used to send the email.

    12. Select the "OK" button.

    After you create the Server Profiles that define where to send your logs, you must

    enable log forwarding.

    Threat Logs-Enable forwarding of Threat logs by creating a Log Forwarding Profile

    (Objects >> Log Forwarding) that specifies which severity levels you want to forward

    and then adding it to the security policies for which you want to trigger the log

    forwarding. A Threat log entry will only be created (and therefore forwarded) if the

    associated traffic matches a Security Profile (Antivirus, Anti-spyware, Vulnerability, URL

    Filtering, File Blocking, Data Filtering, or DoS Protection).

    Configure the log-forwarding profile to select the logs to be forwarded to Email server.

    1. Go to Objects >> Log forwarding

    2. The "Log Forwarding Profile" window appears. Note: It has five columns.

    3. In the "Name" Field, enter the name of the Log Forwarding Profile.

    4. In the "Threat Settings" Section in the "Email" column, select the Email server

    profile for forwarding threat logs to the configured server(s).

    5. Select the "OK" button.

    6. When the "Log Forwarding Profile" window disappears, the screen will show the

    configured log-forwarding profile.

    7. For Threat Logs, use the log forwarding profile in the security rules.

    8. Go to Policies >> Security Rule.

    9. Select the rule for which the log forwarding needs to be applied, which in this

    case is the Security Policy that is used to detect malicious code (the "Profile"

    column does display the Antivirus Profile symbol). Apply the log forwarding

    profile to the rule.

    10. In the "Actions" tab in the "Log Setting" section; in the "Log Forwarding" field,

    select the log forwarding profile from drop-down list.

    11. Note: The Log Forwarding field can only have one profile.

    12. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    13. Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'The following is an example of how to check if the device is sending messages to email; this is one option that
      meets the requirement. If sending messages to an SNMP

      server or Syslog servers is used, follow the vendor guidance on how to verify that

      function:

