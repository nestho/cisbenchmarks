  title: PANW-AG-000080
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'To protect against data mining, the Palo Alto Networks security platform must detect and prevent SQL and other
    code injection attacks launched against data storage objects, including, at a minimum, databases, database records, queries,
    and fields. GROUP ID: V-228856 RULE ID: SV-228856r831596'
  rationale: Data mining is the analysis of large quantities of data to discover patterns and is used in intelligence gathering.
    Failure to prevent attacks launched against organizational information from unauthorized data mining may result in the
    compromise of information. Injection attacks allow an attacker to inject code into a program or query or inject malware
    onto a computer to execute remote commands that can read or modify a database or change data on a website. Web applications
    frequently access databases to store, retrieve, and update information. An attacker can construct inputs that the database
    will execute. This is most commonly referred to as a code injection attack. This type of attack includes XPath and LDAP
    injections.
