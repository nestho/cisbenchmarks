- id: '1.1'
  title: PANW-AG-000015
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform, if used to provide intermediary services for remote access communications
    traffic (TLS or SSL decryption), must ensure inbound and outbound traffic is monitored for compliance with remote access
    security policies. GROUP ID: V-228832 RULE ID: SV-228832r557387'
  rationale: Automated monitoring of remote access traffic allows organizations to detect cyber attacks and also ensure ongoing
    compliance with remote access policies by inspecting connection activities of remote access capabilities. Remote access
    methods include both unencrypted and encrypted traffic (e.g., web portals, web content filter, TLS, and webmail). With
    inbound TLS inspection, the traffic must be inspected prior to being allowed on the enclave's web servers hosting TLS
    or HTTPS applications. With outbound traffic inspection, traffic must be inspected prior to being forwarded to destinations
    outside of the enclave, such as external email traffic. This requirement does not mandate the decryption and inspection
    of SSL/TLS; it requires that if this is performed in the device, the decrypted traffic be inspected and conform to security
    policies. If SSL/TLS traffic is decrypted in the device, it must be inspected. The Palo Alto Networks security platform
    can be configured to decrypt and inspect SSL/TLS connections going through the device. With SSL Decryption, SSL-encrypted
    traffic is decrypted and App-ID and the Antivirus, Vulnerability, Anti-Spyware, URL Filtering, and File-Blocking Profiles
    can be applied to decrypted traffic before being re-encrypted and being forwarded. This is not limited to SSL encrypted
    HTTP traffic (HTTPS); other protocols "wrapped" in SSL/TLS can be decrypted and inspected. Decryption is policy-based
    and can be used to decrypt, inspect, and control both inbound and outbound SSL and SSH connections. Decryption policies
    allow the administrator to specify traffic for decryption according to destination, source, or URL category and in order
    to block or restrict the specified traffic according to security settings.
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'If the Palo Alto Networks security platform does not serve as an intermediary for remote

    access traffic (e.g., web content filter, TLS, and webmail), this is not applicable.

    1. Go to Policies >> Decryption; note each configured decryption policy.

    2. Go to Policies >> Security

    3. View the configured security policies.

    If there is a decryption policy that does not have a corresponding security policy, this is

    a finding.

    The matching policy may not be obvious and it may be necessary for the Administrator

    to identify the corresponding security policy.'
  remediation: 'Note: These instructions assume that certificates have already been loaded on the

    device. Multiple decryption policies can be configured; these instructions explain the

    steps involved but do not provide specific details since the exact local policies are not

    known. The Administrator must tailor the configuration to match the site-specific

    requirements.

    1. Go to Policies >> Decryption

    2. Select "Add".

    3. In the "Decryption Policy Rule" window, complete the required fields.

    4. In the "Name" tab, complete the "Name" and "Description" fields.

    5. In the "Source" tab, complete the "Source Zone" and "Source Address" or

    "Source User" fields.

    6. In the "Destination" tab, complete the "Destination Zone" and "Destination

    Address" or "Destination User" fields.

    7. In the "URL Category" tab, select which categories will be decrypted.

    8. Select "Any" to decrypt all traffic. This is used for web traffic.

    9. In the "Option" tab, select "Decrypt" as the Action. Select the decryption profile.

    10. In the Type field, there are three options;

    11. Select "SSL Forward Proxy to decrypt and inspect SSL/TLS traffic from internal

    users to outside networks".

    12. Select "SSH Proxy to decrypt inbound and outbound SSH connections passing

    through the device".

    13. Select "SSL Inbound Inspection to decrypt and inspect incoming SSL traffic".

    Note: This decryption mode can only work if you have control on the internal server

    certificate to import the Key Pair on Palo Alto Networks Device.

    Decrypted traffic is blocked and restricted according to the policies configured on the

    firewall. For each Decryption Policy, there must be a Security Policy in order to inspect

    and filter the decrypted traffic. Multiple security policies can be configured; these

    instructions explain the steps involved but do not provide specific details since the exact

    local policies are not known.

    1. Go to Policies >> Security

    2. Select "Add".

    3. In the "Security Policy Rule" window, complete the required fields.

    4. In the "Name" tab, complete the "Name" and "Description" fields.

    5. In the "Source" tab, complete the "Source Zone" and "Source Address" fields.

    6. In the "User" tab, complete the "Source User" and "HIP Profile" fields.

    7. In the "Destination" tab, complete the "Destination Zone" and "Destination

    Address" fields.

    8. In the "Applications" tab, either select the "Any" check box or add the specific

    applications. Configured filters and groups can be selected.

    9. In the "Actions" tab, select the desired resulting action (allow or deny). If logging

    of matches on the rule is required, select the "Log forwarding" profile, and select

    "Log at Session End".

    10. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    11. Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'If the Palo Alto Networks security platform does not serve as an intermediary for remote

      access traffic (e.g., web content filter, TLS, and webmail), this is not applicable.

      1. Go to Policies >> Decryption; note each configured decryption policy.

      2. Go to Policies >> Security

      3. View the configured security policies.

      If there is a decryption policy that does not have a corresponding security policy, this is

      a finding.

      The matching policy may not be obvious and it may be necessary for the Adminis'
    severity: medium
- id: '1.2'
  title: PANW-AG-000016
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform, if used as a TLS gateway/decryption point or VPN concentrator, must
    use encryption services that implement NIST FIPS-validated cryptography to protect the confidentiality of remote access
    sessions. GROUP ID: V-228833 RULE ID: SV-228833r557387'
  rationale: Without confidentiality protection mechanisms, unauthorized individuals may gain access to sensitive information
    via a remote access session. Encryption provides a means to secure the remote connection so as to prevent unauthorized
    access to the data traversing the remote access connection, thereby providing a degree of confidentiality. The encryption
    strength of the mechanism is selected based on the security categorization of the information. Remote access is access
    to DoD nonpublic information systems by an authorized user (or an information system) communicating through an external,
    non-organizationcontrolled network. Remote access methods include broadband and wireless connections.
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'If the Palo Alto Networks security platform does not serve as an intermediary for remote

    access traffic (e.g., web content filter, TLS, and webmail), this is not applicable.

    Use the command line interface to determine if the device is operating in FIPS mode.

    Enter the CLI command "show fips-mode" or the command show fips-cc (for more

    recent releases).

    If fips-mode or fips-cc is set to "off", this is a finding.'
  remediation: 'To configure the Palo Alto Networks security platform to operate in FIPS mode:

    1. Power off the device by unplugging it from the electrical outlet.

    2. Connect a console cable from the console port to a computer serial port, and use

    a terminal program to connect to the Palo Alto Networks device.

    3. The serial parameters are 9600 baud, 8 data bits, no parity, and 1 stop bit.

    4. A USB to serial adapter will be necessary if the computer does not have a serial

    port.

    5. During the boot sequence, this message will appear:

    6. "Autoboot to default partition in 5 seconds".

    Enter

    "maint" to boot to "maint" partition.

    Enter

    "maint" to enter maintenance mode.

    Press "Enter", and the "Maintenance Recovery tool" menu will appear.

    Select "Set FIPS Mode" (or fips-cc for later versions) from the menu; once the device

    has finished rebooting, it will be in FIPS mode.

    Note: This will remove all installed licenses and disable the serial port.'
