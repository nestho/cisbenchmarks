- id: '1.37'
  title: PANW-AG-000115
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must continuously monitor inbound communications traffic crossing
    internal security boundaries. GROUP ID: V-228868 RULE ID: SV-228868r831610'
  rationale: If inbound communications traffic is not continuously monitored, hostile activity may not be detected and prevented.
    Output from application and traffic monitoring serves as input to continuous monitoring and incident response programs.
    Internal monitoring includes the observation of events occurring on the network crosses internal boundaries at managed
    interfaces such as web content filters. Depending on the type of ALG, organizations can monitor information systems by
    monitoring audit activities, application access patterns, characteristics of access, content filtering, or unauthorized
    exporting of information across boundaries. Unusual/unauthorized activities or conditions may include large file transfers,
    long-time persistent connections, unusual protocols and ports in use, and attempted communications with suspected malicious
    external addresses. Most current applications are deployed as a multi-tier architecture. The multi-tier model uses separate
    server machines to provide the different functions of presentation, business logic, and database. The multi-tier architecture
    provides added security because a compromised web server does not provide direct access to the application itself or to
    the database.
  impact: ''
  references: []
