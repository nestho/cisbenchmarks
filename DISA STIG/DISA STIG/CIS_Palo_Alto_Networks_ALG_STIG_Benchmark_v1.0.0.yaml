    Go to Policies >> Security

    View the configured security policies.

    If there is a decryption policy that does not have a corresponding security policy, this is

    a finding.

    The matching policy may not be obvious, and it may be necessary for the Administrator

    to identify the corresponding security policy.'
  remediation: 'These instructions explain the steps involved, but do not provide specific details since

    the exact policies and expected traffic are not known.

    Go to Policies >> Security

    Select "Add".

