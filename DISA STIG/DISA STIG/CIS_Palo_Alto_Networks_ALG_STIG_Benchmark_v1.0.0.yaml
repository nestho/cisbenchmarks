- id: '1.28'
  title: PANW-AG-000101
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform being used for TLS/SSL decryption using PKIbased user authentication
    must only accept end entity certificates issued by DoD PKI or DoD-approved PKI Certificate Authorities (CAs) for the establishment
    of protected sessions. GROUP ID: V-228859 RULE ID: SV-228859r831599'
  rationale: Non-DoD approved PKIs have not been evaluated to ensure that they have security controls and identity vetting
    procedures in place that are sufficient for DoD systems to rely on the identity asserted in the certificate. PKIs lacking
    sufficient security controls and identity vetting procedures risk being compromised and issuing certificates that enable
    adversaries to impersonate legitimate users. The authoritative list of DoD-approved PKIs is published at http://iase.disa.mil/pkipke/interoperability.
    DoD-approved PKI CAs may include Category I, II, and III certificates. Category I DoD-Approved External PKIs are PIV issuers.
    Category II DoDApproved External PKIs are Non-Federal Agency PKIs cross certified with the Federal Bridge Certification
    Authority (FBCA). Category III DoD-Approved External PKIs are Foreign, Allied, or Coalition Partner PKIs. Deploying the
    ALG with TLS enabled will require the installation of DoD and/or DoDApproved CA certificates in the trusted root certificate
    store of each proxy to be used for TLS traffic. If the Palo Alto Networks security platform is used for TLS/SSL decryption,
    configure the Palo Alto Networks security platform to only accept end entity certificates issued by DoD PKI or DoD-approved
    PKI CAs for the establishment of protected sessions.
  impact: ''
  references: []
  page_start: 79
  audit_raw: 'If the Palo Alto Networks security platform is not used for TLS/SSL decryption, this is

    not applicable.

    If the Palo Alto Networks security platform accepts non-DoD approved PKI end entity

    certificates, this is a finding.'
  remediation: 'Import the intermediate CA certificates.

    1. To load a CA certificate on the Palo Alto Networks firewall:

    2. Go to Device >> Certificate Management >> Certificates

    3. On the "Device Certificate" tab, select "Import".

    4. In the "Import Certificate" window, complete the required information.

    5. In the "Certificate Name" field, enter the name of the certificate.

    6. In the "Certificate File" field, select "Browse", then browse to and select the

    appropriate file.

    7. In the "File Format" field, select "Base64 Encoded Certificate (PEM)".

    8. Select "OK".

    Create a Client Certificate Profile:

    1. Go to Device >>Certificate Management>> Certificate Profile

    2. Select "Add".

    3. In the Certificate Profile, complete the required fields.

    4. In the "Name" field, enter the name of the Certificate Profile.

    5. In the "Username" field, select "Subject".

    6. Note: The adjacent field will contain common-name.

    7. Add all of the DoD Intermediate Certificates.

    8. Select the "Use OCSP" check box.

    9. Select the "Block session if certificate status is unknown" check box.

    10. Select the "Block session if certificate status cannot be retrieved within timeout".

    Create an Authentication Profile:

    1. Go to Device >> Authentication Profile

    2. Select, "Add".

    3. In the "Authentication Profile" window, complete the required fields.

    4. In the "Authentication" field, add either "RADIUS" or "LDAP" based on the local

    requirements.

    5. In the Server Profile filed, select the server profile for the authentication server.'
  checks:
  - type: manual_review
    info: 'If the Palo Alto Networks security platform is not used for TLS/SSL decryption, this is

      not applicable.

      If the Palo Alto Networks security platform accepts non-DoD approved PKI end entity

      certificates, this is a finding.'
