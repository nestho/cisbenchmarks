  description: 'Apple iOS/iPadOS 18 must implement the management setting: not allow messages in an ActiveSync Exchange account
    to be forwarded or moved to other accounts in the Apple iOS/iPadOS 18 Mail app. GROUP ID: V-268036 RULE ID: SV-268036r1031216'
  rationale: 'The Apple iOS/iPadOS Mail app can be configured to support multiple email accounts concurrently. These email
    accounts are likely to involve content of varying degrees of sensitivity (e.g., both personal and enterprise messages).
    To prevent the unauthorized and undetected forwarding or moving of messages from one account to another, Mail ActiveSync
    Exchange accounts can be configured to block such behavior. While users may still send a message from the Exchange account
    to another account, these transactions must involve an Exchange server, enabling audit records of the transaction, filtering
    of mail content, and subsequent forensic analysis. SFRID: FMT_SMF.1.1 #47'
