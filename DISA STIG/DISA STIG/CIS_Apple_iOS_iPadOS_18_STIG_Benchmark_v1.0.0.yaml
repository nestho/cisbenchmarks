    restrictions policy.

    5. Tap "Restrictions".

    6. Verify "USB drives not accessible in Files app" is listed.

    If "Allow USB drive access in Files app" is not disabled in the management tool and

    "USB drives not accessible in Files app" is not listed in the Restrictions profile on the

    Apple device, this is a finding.'
  remediation: 'If the AO has not approved the use of USB drives to load files to Apple devices, install a

    configuration profile to disable "Allow USB drive access in Files app".'
