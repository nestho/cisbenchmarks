  audit_raw: 'Review configuration settings to confirm "Allow managed apps to store data in iCloud" is

    disabled.

    This check procedure is performed on both the Apple iOS/iPadOS management tool

    and the iPhone and iPad.

    Note: If an organization has multiple configuration profiles, the check procedure must

    be performed on the relevant configuration profiles applicable to the scope of the

    review.

    In the Apple iOS/iPadOS management tool, verify "Allow managed apps to store data in

    iCloud" is unchecked.

    Alternatively, verify the text <key>allowManagedAppsCloudSync</key> <false/>

    appears in the configuration profile (.mobileconfig file).

    On the iPhone and iPad:

    1. Open the Settings app.

    2. Tap "General".

    3. Tap "VPN & Device Management".

    4. Tap the Configuration Profile from the Apple iOS/iPadOS management tool

    containing the restrictions policy.

    5. Tap "Restrictions".

    6. Verify "Managed apps cloud sync not allowed" is listed.

    If "Allow managed apps to store data in iCloud" is checked in the Apple iOS/iPadOS

    management tool, <key>allowManagedAppsCloudSync</key> <true/> appears in

    the configuration profile, or the restrictions policy on the iPhone and iPad does not list

    "Managed apps cloud sync not allowed", this is a finding.'
  remediation: Install a configuration profile to prevent DOD applications from storing data in iCloud.
