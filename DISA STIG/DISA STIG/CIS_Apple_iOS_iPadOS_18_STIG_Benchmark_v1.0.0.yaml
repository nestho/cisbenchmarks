  title: AIOS-18-010400
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Apple iOS/iPadOS 18 must require a valid password be successfully entered before the mobile device data is
    unencrypted. GROUP ID: V-268024 RULE ID: SV-268024r1031204'
  rationale: 'Passwords provide a form of access control that prevents unauthorized individuals from accessing computing resources
    and sensitive data. Passwords may also be a source of entropy for generation of key encryption or data encryption keys.
    If a password is not required to access data, this data is accessible to any adversary who obtains physical possession
    of the device. Requiring that a password be successfully entered before the mobile device data is unencrypted mitigates
    this risk. Note: MDF PP requires a Password Authentication Factor and requires management of its length and complexity.
    It leaves open whether the existence of a password is subject to management. This requirement addresses the configuration
    to require a password, which is critical to the cybersecurity posture of the device. SFRID: FIA_UAU_EXT.1.1'
  impact: ''
  references: []
