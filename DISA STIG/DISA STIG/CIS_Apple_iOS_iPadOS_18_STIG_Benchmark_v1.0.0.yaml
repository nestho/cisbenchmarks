- id: '1.42'
  title: AIOS-18-011900
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Apple iOS/iPadOS 18 users must complete required training. GROUP ID: V-268041 RULE ID: SV-268041r1031221'
  rationale: 'The security posture on iOS devices requires the device user to configure several required policy rules on their
    device. User-Based Enforcement (UBE) is required for these controls. In addition, if the authorizing official (AO) has
    approved users'' full access to the Apple App Store, users must receive training on risks. If a user is not aware of their
    responsibilities and does not comply with UBE requirements, the security posture of the iOS mobile device and DOD sensitive
    data may become compromised. SFRID: NA'
  impact: ''
  references: []
  page_start: 95
  audit_raw: 'Review a sample of site User Agreements for iOS device users or similar training

    records and training course content. Verify iPhone and iPad users have completed

    required training.

    If any iPhone/iPad user has not completed required training, this is a finding.'
  remediation: 'Have all iPhone and iPad users complete training on the following topics. Users must

    acknowledge receipt of training via a signed User Agreement or similar written record.

    Training topics:

    • Operational security concerns introduced by unmanaged applications, including

    applications using global positioning system (GPS) tracking.

    • Must ensure no DOD data is saved in an unmanaged app or transmitted from a

    personal app (for example, from personal email).

    • If the Purebred key management app is used, users are responsible for

    maintaining positive control of their credentialed device at all times. The DOD

    PKI certificate policy requires subscribers to maintain positive control of the

    devices that contain private keys and report any loss of control so the credentials

    can be revoked. Upon device retirement, turn in, or reassignment, ensure a

    factory data reset is performed prior to device handoff. Follow mobility service

    provider decommissioning procedures as applicable.

    • How to configure the following UBE controls (users must configure the control)

    and other controls on the iPhone and iPad:

    o Remove Family Sharing.

    o Disable Shared Location.

    o Disable Wi-Fi Assist.

    o Use AirPrint only with AO-approved printers and print servers (see the

    Multifunction Device and Network Printers STIG for requirements).

    o Turn off "Apps" under "Automatic Downloads" in the "iTunes & App Store"

    section of the Settings app on the iPhone and iPad.

    o Secure use of Calendar Alarm.

    o Do not configure a DOD network (work) VPN profile on any third-party

    unmanaged VPN app.

    o Disable iPhone and iPad radios using controls under "Settings" instead of

    "Control Center".

    • AO guidance on acceptable use and restrictions, if any, on downloading and

    installing personal apps and data (music, photos, etc.).'
  checks:
  - type: manual_review
    info: 'Review a sample of site User Agreements for iOS device users or similar training

      records and training course content. Verify iPhone and iPad users have completed

      required training.

      If any iPhone/iPad user has not completed required training, this is a finding.'
    severity: medium
