controls:
- id: '1.1'
  title: AIOS-18-001000
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Apple iOS/iPadOS 18 must allow the administrator (MDM) to perform the following management function: enable/disable
    VPN protection across the device and [selection: on a per-app basis, on a per-group of applications processes basis].
    GROUP ID: V-267937 RULE ID: SV-267937r1120908'
  rationale: 'The system administrator must have the capability to configure VPN access to meet organization-specific policies
    based on mission needs. Otherwise, a user could inadvertently or maliciously set up a VPN and connect to a network that
    poses unacceptable risk to DOD information systems. An adversary could exploit vulnerabilities created by the weaker configuration
    to compromise DOD sensitive information. SFRID: FMT_SMF.1.1 #3'
  impact: ''
  references: []
  page_start: 12
  audit_raw: 'Review the list of unmanaged apps installed on the iPhone and iPad and determine if

    any unmanaged third-party VPN clients are installed. If so, verify the VPN app is not

    configured with a DOD network (work) VPN profile.

    This validation procedure is performed on the iOS device only.

    On the iPhone and iPad:

    1. Open the Settings app.

    2. Tap "General".

    3. Tap the "VPN and Device Management" line and determine if any "Personal

    VPN" exists.

    4. If not, the requirement has been met.

    5. If there are personal VPNs, open each VPN app. Review the list of VPN profiles

    configured on the VPN client.

    6. Verify no DOD network VPN profiles are configured on the VPN client.

    If any third-party unmanaged VPN apps are installed (personal VPN) and they have a

    DOD network VPN profile configured on the client, this is a finding.

    Note: This setting cannot be managed by the MDM administrator and is a User-Based

    Enforcement (UBE) requirement.'
  remediation: 'If a third-party unmanaged VPN app is installed on the iOS 18 device, do not configure

    the VPN app with a DOD network VPN profile.'
  checks:
  - type: manual_review
    info: 'Review the list of unmanaged apps installed on the iPhone and iPad and determine if

      any unmanaged third-party VPN clients are installed. If so, verify the VPN app is not

