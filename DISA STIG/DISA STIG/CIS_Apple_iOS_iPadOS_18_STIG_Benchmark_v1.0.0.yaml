  profile:
  - 'SEVERITY: CAT II'
  description: 'Apple iOS/iPadOS 18 must implement the management setting: not share location data through iCloud. GROUP ID:
    V-268039 RULE ID: SV-268039r1031219'
  rationale: 'Sharing of location data is an operational security (OPSEC) risk because it potentially allows an adversary
    to determine a DOD user''s location, movements, and patterns in those movements over time. An adversary could use this
    information to target the user or gather intelligence on the user''s likely activities. Using commercial cloud services
    to store and handle location data could leave the data vulnerable to breach, particularly by sophisticated adversaries.
    Disabling the use of such services mitigates this risk. SFRID: FMT_SMF.1.1 #47'
  impact: ''
  references: []
