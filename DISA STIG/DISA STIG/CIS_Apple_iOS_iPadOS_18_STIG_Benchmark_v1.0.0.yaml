  audit_raw: 'Note: This requirement is not applicable if the authorizing official (AO) has approved

    users'' full access to the Apple App Store for downloading unmanaged (personal) apps

    and syncing personal data on the device with personal cloud data storage accounts.

    The site must have an AO-signed document showing the AO has assumed the risk for

    users'' full access to the Apple App Store.

    This is a supervised-only control. If the iPhone or iPad being reviewed is not supervised

    by the MDM, this control is automatically a finding.

    If the iPhone or iPad being reviewed is supervised by the MDM, review configuration

    settings to confirm "Allow iCloud documents & data" is disabled.

    This check procedure is performed on both the Apple iOS/iPadOS management tool

    and the iPhone and iPad.

    Note: If an organization has multiple configuration profiles, the check procedure must

    be performed on the relevant configuration profiles applicable to the scope of the

    review.

    In the Apple iOS/iPadOS management tool, verify "Allow iCloud documents & data" is

    unchecked.

    Alternatively, verify the text <key>allowCloudDocumentSync</key> <false/>

    appears in the configuration profile (.mobileconfig file).

    On the iPhone and iPad:

    1. Open the Settings app.

    2. Tap "General".

    3. Tap "VPN & Device Management".

    4. Tap the Configuration Profile from the iOS management tool containing the

    policy.

    5. Tap "Restrictions".

    6. Verify "Documents in the Cloud not allowed" is listed.

    Note: This also verifies that iCloud Drive and iCloud Photo Library are disabled.

    If "Allow iCloud documents & data" is checked in the Apple iOS/iPadOS management

    tool, <key>allowCloudDocumentSync</key> <true/> appears in the configuration

    profile, or the restrictions policy on the iPhone and iPad does not list "Documents in the

    Cloud not allowed", this is a finding.'
  remediation: Install a configuration profile to disable iCloud documents and data. This a supervisedonly control.
