  description: 'Apple iOS/iPadOS 18 must be configured to not display notifications when the device is locked. GROUP ID: V-267998
    RULE ID: SV-267998r1031178'
  rationale: 'Many mobile devices display notifications on the lock screen so users can obtain relevant information in a timely
    manner without having to frequently unlock the phone to determine if there are new notifications. However, in many cases,
    these notifications can contain sensitive information. When they are available on the lock screen, an adversary can see
    them merely by being in close physical proximity to the device. Configuring the mobile operating system to not send notifications
    to the lock screen mitigates this risk. SFRID: FMT_SMF.1.1 #18'
