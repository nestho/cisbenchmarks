- id: '1.57'
  title: AIOS-18-013400
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Apple iOS must be configured to disable automatic transfer of diagnostic data to an external device other
    than an MDM service with which the device has enrolled. GROUP ID: V-268057 RULE ID: SV-268057r1031237'
  rationale: 'Many software systems automatically send diagnostic data to the manufacturer or a third-party. This data enables
    the developers to understand real-world field behavior and improve the product based on that information. Unfortunately,
    it can also reveal information about what DOD users are doing with the systems and what causes them to fail. An adversary
    embedded within the software development team or elsewhere could use the information acquired to breach mobile operating
    system security. Disabling automatic transfer of such information mitigates this risk. SFRID: FMT_SMF.1.1 #47a'
  impact: ''
  references: []
  page_start: 125
  audit_raw: 'Review configuration settings to confirm "Allow sending diagnostic and usage data to

    Apple" is disabled.

    This check procedure is performed on both the iOS management tool and the iOS

    device.

    Note: If an organization has multiple configuration profiles, the check procedure must

    be performed on the relevant configuration profiles applicable to the scope of the

    review.

    In the iOS management tool, verify "Allow sending diagnostic and usage data to Apple"

    is unchecked.

    Alternatively, verify the text <key>allowDiagnosticSubmission</key><false/>

    appears in the configuration profile (.mobileconfig file).

    On the Apple iOS device:

    1. Open the Settings app.

    2. Tap "General".

    3. Tap "VPN & Device Management".

    4. Tap the Configuration Profile from the iOS management tool containing the

    management policy.

    5. Tap "Restrictions".

    6. Verify "Diagnostic submission not allowed".

    Note: This setting also disables "Share With App Developers".

    If "Allow sending diagnostic and usage data to Apple" is checked in the iOS

    management tool, <key>allowDiagnosticSubmission</key><true/> appears in the

    configuration profile, or the restrictions policy on the Apple iOS device from the Apple

    iOS management tool does not list "Diagnostic submission not allowed", this is a

    finding.'
  remediation: 'Install a configuration profile to disable sending diagnostic data to an organization other

    than DOD.'
  checks:
  - type: manual_review
    info: 'Review configuration settings to confirm "Allow sending diagnostic and usage data to

      Apple" is disabled.

      This check procedure is performed on both the iOS management tool and the iOS

