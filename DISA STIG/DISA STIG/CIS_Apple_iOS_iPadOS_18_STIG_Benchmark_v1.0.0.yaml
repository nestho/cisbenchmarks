  title: AIOS-18-010600
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Apple iOS/iPadOS 18 must implement the management setting: not allow automatic completion of Safari browser
    passcodes. GROUP ID: V-268027 RULE ID: SV-268027r1031207'
  rationale: 'The AutoFill functionality in the Safari web browser allows the user to complete a form that contains sensitive
    information, such as PII, without previous knowledge of the information. By allowing the use of the AutoFill functionality,
    an adversary who learns a user''s iPhone or iPad passcode, or who otherwise is able to unlock the device, may be able
    to further breach other systems by relying on the AutoFill feature to provide information unknown to the adversary. By
    disabling the AutoFill functionality, the risk of an adversary gaining additional information about the device''s user
    or compromising other systems is significantly mitigated. SFRID: FMT_SMF.1.1 #47'
