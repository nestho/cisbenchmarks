  rationale: 'Ad Tracking refers to the advertisers'' ability to categorize the device and spam the user with ads that are
    most relevant to the user''s preferences. By not "Force limiting ad tracking", advertising companies are able to gather
    information about the user and device''s browsing habits. If "Limit Ad Tracking" is not limited, a database of browsing
    habits of DOD devices can be gathered and stored under no supervision of the DOD. Limiting ad tracking does not completely
    mitigate the risk but does limit the amount of information gathering. SFRID: FMT_SMF.1.1 #47'
