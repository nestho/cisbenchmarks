  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Apple iOS/iPadOS 18 must not include applications with the following characteristics: access to Siri when
    the device is locked. GROUP ID: V-267995 RULE ID: SV-267995r1032950'
  rationale: 'Requiring all authorized applications to be in an application allow list prevents the execution of any applications
    (e.g., unauthorized, malicious) that are not part of the allow list. Failure to configure an application allow list properly
    could allow unauthorized and malicious applications to be downloaded, installed, and executed on the mobile device, causing
    a compromise of DOD data accessible by these applications. Applications with the listed characteristics have features
    that can cause the compromise of sensitive DOD data or have features with no known application in the DOD environment.
    Application note: The application allow list, in addition to controlling the installation of applications on the MD, must
    control user access/execution of all core and preinstalled applications, or the MD must provide an alternate method of
    restricting user access/execution to core and preinstalled applications. Core application: Any application integrated
    into the OS by the OS or MD vendors. Preinstalled application: Additional noncore applications included in the OS build
    by the OS vendor, MD vendor, or wireless carrier. SFRID: FMT_SMF.1.1 #8'
