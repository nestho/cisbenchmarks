    2. Tap "General".

    3. Tap "VPN & Device Management".

    4. Tap the Configuration Profile from the iOS management tool containing the

    password policy.

    5. Tap "Restrictions".

    6. Tap "Passcode".

    7. Verify "Max failed attempts" is listed as 10 or fewer.

    If the "Maximum number of failed attempts" is more than 10 in the iOS management

    tool, <key>maxFailedAttempts</key> has an integer value of more than 10, or the

