- id: '1.21'
  title: AIOS-18-009700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Apple iOS/iPadOS 18 must not allow non-DOD applications to access DOD data. GROUP ID: V-268017 RULE ID: SV-268017r1117274'
  rationale: 'App data sharing gives apps the ability to access the data of other apps for enhanced user functionality. However,
    sharing also poses a significant risk that unauthorized users or apps will obtain access to sensitive DOD information.
    To mitigate this risk, there are data sharing restrictions. If a user is allowed to make exceptions to the data sharing
    restriction policy, the user could enable unauthorized sharing of data, leaving it vulnerable to breach. Limiting the
    granting of exceptions to either the administrator or common application developer mitigates this risk. Copy/paste of
    data between applications in different application processes or groups of application processes is considered an exception
    to the access control policy; therefore, the administrator must be able to enable/disable the feature. Other exceptions
    include allowing any data or application sharing between process groups. SFRID: FMT_SMF.1.1 #42, FDP_ACF_EXT.1.2'
  impact: ''
  references: []
