    If "Require passcode on outgoing AirPlay request" is unchecked in the Apple

    iOS/iPadOS management tool,

    <key>forceAirPlayOutgoingRequestsPairingPassword</key><true/> appears in

    the configuration profile, or the restrictions policy on the iPhone and iPad does not list

    "AirPlay outgoing requests pairing password enforced", this is a finding.'
  remediation: 'Install a configuration profile to require the user to enter a password when connecting to

    an AirPlay-enabled device.'
