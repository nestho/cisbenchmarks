  audit_raw: 'Review configuration settings to confirm simple passcodes are not allowed.

    This check procedure is performed on both the Apple iOS/iPadOS management tool

    and the iPhone and iPad.

    Note: If an organization has multiple configuration profiles, the check procedure must

    be performed on the relevant configuration profiles applicable to the scope of the

    review.

    In the Apple iOS/iPadOS management tool, verify "Allow simple value" is unchecked.

    Alternatively, verify the text <key>allowSimple</key> <false/> appears in the

    configuration profile (.mobileconfig file).

    On the iPhone and iPad:

    1. Open the Settings app.

    2. Tap "General".

    3. Tap "VPN & Device Management".

    4. Tap the Configuration Profile from the iOS management tool containing the

    password policy.

    5. Tap "Restrictions".

    6. Tap "Passcode".

    7. Verify "Simple passcodes allowed" is set to "No".

    If "Allow simple value" is checked in the Apple iOS/iPadOS management tool,

    <key>allowSimple</key> <true/> appears in the Configuration Profile, or the

    password policy on the iPhone and iPad does not have "Simple passcodes allowed" set

    to "No", this is a finding.'
  remediation: 'Install a configuration profile to disallow more than four sequential or repeating numbers

    or letters in the device unlock password.'
