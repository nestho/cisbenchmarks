      2. Tap "General".

      3. Tap the "VPN and Device Management" line and determine if any "Personal

      VPN" exists.

      4. If not, the requirement has been met.

      5. If there are pers'
    severity: medium
- id: '1.2'
  title: AIOS-18-003000
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Apple iOS/iPadOS 18 must not allow backup to remote systems (iCloud). GROUP ID: V-267958 RULE ID: SV-267958r1117267'
  rationale: 'If a user is able to configure the security setting, the user could inadvertently or maliciously set it to a
    value that poses unacceptable risk to DOD information systems. An adversary could exploit vulnerabilities created by the
    weaker configuration to compromise DOD sensitive information. SFRID: FMT_MOF_EXT.1.2 #40'
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'Note: This requirement is not applicable if the authorizing official (AO) has approved

    users'' full access to the Apple App Store for downloading unmanaged (personal) apps

    and syncing personal data on the device with personal cloud data storage accounts.

    The site must have an AO-signed document showing the AO has assumed the risk for

    users'' full access to the Apple App Store.

    Review configuration settings to confirm iCloud Backup is disabled.

    This check procedure is performed on both the Apple iOS/iPadOS management tool

    and the iPhone and iPad.

    Note: If an organization has multiple configuration profiles, the check procedure must

    be performed on the relevant configuration profiles applicable to the scope of the

    review.

    In the Apple iOS/iPadOS management tool, verify "Allow iCloud backup" is unchecked.

    Alternatively, verify the text <key>allowCloudBackup</key> <false/> appears in the

    configuration profile (.mobileconfig file).

    On the iPhone and iPad:

    1. Open the Settings app.

    2. Tap "General".

    3. Tap "VPN & Device Management".

    4. Tap the Configuration Profile from the iOS management tool containing the

    policy.

    5. Tap "Restrictions".

    6. Verify "iCloud backup not allowed".

    If "Allow iCloud backup" is checked in the Apple iOS/iPadOS management tool,

    <key>allowCloudBackup</key><true/> appears in the configuration profile, or the

    restrictions policy on the iPhone and iPad does not list "iCloud backup not allowed", this

    is a finding.'
  remediation: Install a configuration profile to disable iCloud backup.
  checks:
  - type: manual_review
    info: 'Note: This requirement is not applicable if the authorizing official (AO) has approved

      users'' full access to the Apple App Store for downloading unmanaged (personal) apps

      and syncing personal data on the device with personal cloud data storage accounts.

      The site must have an AO-signed document showing the AO has assumed the risk for

      users'' full access to the Apple App Store.

      Review configuration settings to confirm iCloud Backup is disabled.

      This check procedure is performed on both the Apple iO'
    severity: medium
