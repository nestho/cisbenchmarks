    to an AirPlay-enabled device. GROUP ID: V-268031 RULE ID: SV-268031r1031211'
  rationale: 'When a user is allowed to use AirPlay without a password, it may mistakenly associate the iPhone and iPad with
    an AirPlay-enabled device other than the one intended (i.e., by choosing the wrong one from the AirPlay list displayed).
