- id: '1.44'
  title: JUNI-ND-001360
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper router must be configured to use at least two authentication servers for the purpose of authenticating
    users prior to granting administrative access. GROUP ID: V-217350 RULE ID: SV-217350r916111'
  rationale: Centralized management of user accounts and authentication increases the administrative access to the router.
    This control is particularly important protection against the insider threat. With robust centralized management, audit
    records for administrator account access to the organization's network devices can be more readily analyzed for trends
    and anomalies. The alternative method of defining administrator accounts on each device exposes the device configuration
    to remote access authentication attacks and system administrators with multiple authenticators for each network device.
  impact: ''
  references: []
  page_start: 110
  audit_raw: 'Review the router configuration to verify that the device is configured to use at least two

    authentication servers as primary source for authentication as shown in the following

    example:

    system {

    authentication-order radius;

    }

    radius-server {

    x.x.x.x secret "$8$xYW-dsq.5zF/wYnC"; ## SECRET-DATA

    }

    radius-server {

    x.x.x.x secret "$8$xYW-dsq.5zF/wYnC"; ## SECRET-DATA

    }

    If the router is not configured to use at least two authentication servers for the purpose

    of authenticating users prior to granting administrative access, this is a finding.'
  remediation: 'Step 1: Configure the authentication servers as shown in the following example:

    [edit system]

    set radius-server x.x.x.x secret xxxxxxxxx

    set radius-server x.x.x.x secret xxxxxxxxx

    Step 2: Configure the authentication order to use the authentication servers as primary

    source for authentication as shown in the following example:

    set authentication-order radius

    Note: If there is no response from the authentication server, JUNOS will authenticate

    using a local account as last resort. It is recommended to not configure the password at

    the end of the authentication order, as JUNOS will attempt to authenticate using a local

    account upon a rejection from the authentication server.'
  checks:
  - type: manual_review
    info: 'Review the router configuration to verify that the device is configured to use at least two

      authentication servers as primary source for authentication as shown in the following

      example:

      system {

      authentication-order radius;

      }

      radius-server {

      x.x.x.x secret "$8$xYW-dsq.5zF/wYnC"; ## SECRET-DATA

      }

      radius-server {

      x.x.x.x secret "$8$xYW-dsq.5zF/wYnC"; ## SECRET-DATA

      }

      If the router is not configured to use at least two authentication servers for the purpose

      of authenticating users prior to grantin'
    severity: medium
- id: '1.45'
  title: JUNI-ND-001400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to support organizational requirements to conduct backups of the configuration
    when changes occur. GROUP ID: V-217351 RULE ID: SV-217351r916221'
  rationale: System-level information includes default and customized settings and security attributes, including ACLs that
    relate to the network device configuration, as well as software required for the execution and operation of the device.
    Information system backup is a critical step in ensuring system integrity and availability. If the system fails and there
    is no backup of the system-level information, a denial of service condition is possible for all who utilize this critical
    network component. This control requires the network device to support the organizational central backup process for system-level
    information associated with the network device. This function may be provided by the network device itself; however, the
    preferred best practice is a centralized backup rather than each network device performing discrete backups.
  impact: ''
  references: []
  page_start: 112
  audit_raw: 'Review the router configuration to verify that it is compliant with this requirement. The

    example configuration below will send the router configuration to an SCP server upon

    the commit command.

    system {

    …

    …

    …

    archival {

    configuration {

    transfer-on-commit;

    archive-sites {

    "scp://scpuser@1.2.3.4:/configs" password "$9$CMJKpu1LX-bwgBIYo"; ## SECRETDATA

    }

    }

    }

    }

    If the router is not configured to conduct backups of the configuration when changes

    occur, this is a finding.'
  remediation: 'Configure the router to send the configuration to an SCP server up a commit command

    as shown in the example below.

    set archival configuration transfer-on-commit archive-sites

    scp://scpuser@1.2.3.4:/configs" password "xxxxxxxx"'
  checks:
  - type: manual_review
    info: 'Review the router configuration to verify that it is compliant with this requirement. The

      example configuration below will send the router configuration to an SCP server upon

      the commit command.

      system {

      …

      …

      …

      archival {

      configuration {

      transfer-on-commit;

      archive-sites {

      "scp://scpuser@1.2.3.4:/configs" password "$9$CMJKpu1LX-bwgBIYo"; ## SECRETDATA

      }

      }

      }

      }

      If the router is not configured to conduct backups of the configuration when changes

      occur, this is a finding.'
    severity: medium
- id: '1.46'
  title: JUNI-ND-001440
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper router must be configured to send log data to at least two syslog servers for the purpose of forwarding
    alerts to the administrators and the Information System Security Officers (ISSO). GROUP ID: V-220141 RULE ID: SV-220141r916114'
  rationale: Once an attacker establishes initial access to a system, the attacker often attempts to create a persistent method
    of reestablishing access. One way to accomplish this is for the attacker to simply create a new account. Notification
    of account creation is one method for mitigating this risk. A comprehensive account management process will ensure an
    audit trail which documents the creation of accounts and notifies administrators and ISSOs. Such a process greatly reduces
    the risk that accounts will be surreptitiously created and provides logging that can be used for forensic purposes.
  impact: ''
  references: []
  page_start: 114
  audit_raw: 'Verify that the router is configured to send logs to at least two syslog servers. The

    configuration should look similar to the example below:

    system {

    syslog {

    host x.x.x.x {

    any info;

    }

    host x.x.x.x {

    any info;

    }

    }

    If the router is not configured to send log data to the syslog servers, this is a finding.'
  remediation: 'Configure the router to send log data to the syslog servers as shown in the example

    below.

    set syslog host x.x.x.x any info

    set syslog host x.x.x.x any info'
  checks:
  - type: manual_review
    info: 'Verify that the router is configured to send logs to at least two syslog servers. The

