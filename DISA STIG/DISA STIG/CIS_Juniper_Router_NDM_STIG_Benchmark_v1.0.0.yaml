      If the router is not configured to send log data to the syslog servers, this is a finding.'
    severity: medium
- id: '1.46'
  title: JUNI-ND-001430
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to obtain its public key certificates from an appropriate certificate
    policy through an approved service provider. GROUP ID: V-217352 RULE ID: SV-217352r879887'
  rationale: For user certificates, each organization obtains certificates from an approved, shared service provider, as required
    by OMB policy. For federal agencies operating a legacy public key infrastructure cross-certified with the Federal Bridge
    Certification Authority at medium assurance or higher, this Certification Authority will suffice.
  impact: ''
  references: []
  page_start: 116
  audit_raw: 'Review the router configuration to verify that it is compliant with this requirement. The

    configuration below is an example of a Certificate Authority profile defining name of the

    CA, the location of CRL for revocation check and to refresh the CRL every 24 hours,

    and the email address to send a certificate request.

    security {

    pki {

    ca-profile DODXX_CA {

    ca-identity xxxxx.mil;

    revocation-check {

    crl {

    url http://server1.xxxxx.mil/CertEnroll/example.crl;

    refresh-interval 24;

    }

    }

    administrator {

    email-address "certadmin@xxxxx.mil";

    }

    }

    }

    }

    If the router is not configured to obtain its public key certificates from an appropriate

    certificate policy through an approved service provider, this is a finding.'
  remediation: 'Step 1. Create a trusted profile and email address to send certificate request to.

    [edit security]

    set pki ca-profile DODXX_CA ca-identity xxxxx.mil

    set pki ca-profile DODXX_CA administrator email-address certadmin@xxxxx.mil

    Step 2. Create a revocation check to specify a method for checking certificate

    revocation.

    set pki ca-profile DODXX_CA revocation-check crl url

    http://server1.example.mil/CertEnroll/example.crl

    set pki ca-profile DODXX_CA revocation-check crl refresh-interval 24'
  checks:
  - type: manual_review
    info: 'Review the router configuration to verify that it is compliant with this requirement. The

      configuration below is an example of a Certificate Authority profile defining name of the

      CA, the location of CRL for revocation check and to refresh the CRL every 24 hours,

