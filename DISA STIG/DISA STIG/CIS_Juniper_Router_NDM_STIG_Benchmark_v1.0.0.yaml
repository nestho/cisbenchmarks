  description: 'The Juniper router must be running a Junos release that is currently supported by Juniper Networks. GROUP
    ID: V-220143 RULE ID: SV-220143r879887'
  rationale: Network devices running an unsupported operating system lack current security fixes required to mitigate the
    risks associated with recent vulnerabilities. Running a supported release also enables operations to maintain a stable
    and reliable network provided by improved quality of service and security features.
  impact: ''
  references: []
  page_start: 120
  audit_raw: 'Verify that the router is in compliance with this requirement by having the router

    administrator enter the following command: show version

    End of support dates for all Junos releases can be found at the URL listed below.

    https://support.juniper.net/support/eol/software/junos/

    If the Juniper router is not running a supported Junos release, this is a finding.'
  remediation: Upgrade the Juniper router to a supported release.
