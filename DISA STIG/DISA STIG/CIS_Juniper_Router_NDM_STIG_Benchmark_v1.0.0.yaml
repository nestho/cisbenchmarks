      referred to as archive file'
    severity: medium
- id: '1.27'
  title: JUNI-ND-000990
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to generate an alert for all audit failure events. GROUP ID: V-217333
    RULE ID: SV-217333r879733'
  rationale: It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit logs
    as required. Without a real-time alert, security personnel may be unaware of an impending failure of the audit capability
    and system operation may be adversely affected. Alerts provide organizations with urgent messages. Real-time alerts provide
    these messages immediately (i.e., the time from event detection to alert occurs in seconds or less).
  impact: ''
  references: []
  page_start: 72
  audit_raw: 'Review the router configuration to verify that it is compliant with this requirement as

    shown in the example below.

    system {

    syslog {

    host x.x.x.x {

    any critical;

    }

    }

    Note: The parameter "critical" can be replaced with a lesser severity level (i.e., error,

    warning, notice, info).

    If the router is not configured to generate an alert for all audit failure events, this is a

    finding.'
  remediation: 'Configure the router to send critical to emergency log messages to the syslog server as

    shown in the example below.

    set syslog host x.x.x.x any critical

    Note: The parameter "critical" can replaced with a lesser severity level (i.e., error,

    warning, notice, info).'
  checks:
