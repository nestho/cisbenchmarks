  page_start: 44
  audit_raw: 'Review the router configuration to verify that it is compliant with this requirement. The

    configuration example below depicts a class JR_ENGINEER that is not permitted to

    add, change, or delete software installed on the router.

    login {

    class JR_ENGINEER {

