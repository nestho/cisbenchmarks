- id: '1.25'
  title: JUNI-ND-000930
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to audit the execution of privileged functions. GROUP ID: V-217330 RULE
    ID: SV-217330r879720'
  rationale: Misuse of privileged functions, either intentionally or unintentionally by authorized users, or by unauthorized
    external entities that have compromised information system accounts, is a serious and ongoing concern and can have significant
    adverse impacts on organizations. Auditing the use of privileged functions is one way to detect such misuse and identify
    the risk from insider threats and the advanced persistent threat.
  impact: ''
  references: []
  page_start: 68
  audit_raw: 'Review the router configuration to verify that it is compliant with this requirement. The

    configuration example below will log all commands entered from the command line

    interface as well as log all configuration changes.

    syslog {

    file LOG_FILE {

    interactive-commands;

    change-log info

    }

    }

