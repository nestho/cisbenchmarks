- id: '1.1'
  title: JUNI-ND-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to limit the number of concurrent management sessions to an organization-defined
    number. GROUP ID: V-217305 RULE ID: SV-217305r879511'
  rationale: Device management includes the ability to control the number of administrators and management sessions that manage
    a device. Limiting the number of allowed administrators and sessions per administrator based on account type, role, or
    access type is helpful in limiting risks related to DoS attacks. This requirement addresses concurrent sessions for administrative
    accounts and does not address concurrent sessions by a single administrator via multiple administrative accounts. The
    maximum number of concurrent sessions should be defined based upon mission needs and the operational environment for each
    system. At a minimum, limits must be set for SSH, HTTPS, account of last resort, and root account sessions.
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'Note: This requirement is not applicable to file transfer actions such as SCP and SFTP.

    Review the router configuration to determine if concurrent SSH sessions are limited as

    show in the example below:

    system {

    services {

    ssh {

    max-sessions-per-connection 1;

    connection-limit 2;

    }

    }

    Note: the max-sessions-per-connection must be set to 1 to limit the number of sessions

    per connection which is limited by the connection-limit.

    If the router is not configured to limit the number of concurrent sessions, this is a finding.'
  remediation: 'Configure the router to limit the number of concurrent sessions as shown in the example

    below:

    [edit system services]

    set ssh connection-limit 2

    set ssh max-sessions-per-connection 1'
  checks:
  - type: sql
    command: 'show in the example below:'
    severity: medium
    info: 'Note: This requirement is not applicable to file transfer actions such as SCP and SFTP.

      Review the router configuration to determine if concurrent SSH sessions are limited as

      show in the example below:

      system {

      services {

      ssh {

      max-sessions-per-connection 1;

      connection-limit 2;

      }

      }

      Note: the max-sessions-per-connection must be set to 1 to limit the number of sessions

      per connection which is limite'
- id: '1.2'
  title: JUNI-ND-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to automatically audit account creation. GROUP ID: V-217306 RULE ID:
    SV-217306r879525'
  rationale: Upon gaining access to a network device, an attacker will often first attempt to create a persistent method of
    reestablishing access. One way to accomplish this is to create a new account. Notification of account creation helps to
    mitigate this risk. Auditing account creation provides the necessary reconciliation that account management procedures
    are being followed. Without this audit trail, personnel without the proper authorization may gain access to critical network
    nodes.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'Review the router configuration to determine if it audits account creation. This

    requirement can be met by ensuring that configuration changes are logged as shown in

    the following example:

    system {

    syslog {

    file LOG_FILE {

    change-log info;

    }

    }

    }

    Note: The parameter “any” can be in place of “change-log” as this will log everything.

    Also, a syslog server can be configured in addition to or in lieu of logging to a file as

    shown in the example below.

    system {

    syslog {

    host 10.1.58.2 {

    any info;

    }

    file LOG_FILE {

    change-log info;

    }

    console {

    any error;

    }

    }

    }

    If account creation is not audited, this is a finding.'
  remediation: 'Configure the router to audit the creation of accounts. This requirement can be met by

    ensuring that configuration changes are logged as shown in the following example:

    [edit system]

    set syslog file LOG_FILE change-log info

    Note: The parameter “any” can be in place of “change-log” as this will log everything.

    Also, a syslog server can be configured in addition to or in lieu of logging to a file as

    shown in the example below.

    set syslog host 10.1.58.2 any info'
  checks:
  - type: manual_review
    info: 'Review the router configuration to determine if it audits account creation. This

      requirement can be met by ensuring that configuration changes are logged as shown in

      the following example:

      system {

      syslog {

      file LOG_FILE {

      change-log info;

      }

      }

      }

      Note: The parameter “any” can be in place of “change-log” as this will log everything.

      Also, a syslog server can be configured in addition to or in lieu of logging to a file as

      shown in the example below.

      system {

      syslog {

      host 10.1.58.2 {

      any info;

      }

      fi'
    severity: medium
