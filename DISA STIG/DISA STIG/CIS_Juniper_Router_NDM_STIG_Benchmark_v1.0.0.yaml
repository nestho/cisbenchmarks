- id: '1.6'
  title: JUNI-ND-000140
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to enforce approved authorizations for controlling the flow of management
    information within the device based on control policies. GROUP ID: V-217310 RULE ID: SV-217310r879533'
  rationale: A mechanism to detect and prevent unauthorized communication flow must be configured or provided as part of the
    system design. If management information flow is not enforced based on approved authorizations, the network device may
    become compromised. Information flow control regulates where management information is allowed to travel within a network
    device. The flow of all management information must be monitored and controlled so it does not introduce any unacceptable
    risk to the network device or data. Application-specific examples of enforcement occur in systems that employ rule sets
    or establish configuration settings that restrict information system services or messagefiltering capability based on
    message content (e.g., implementing key word searches or using document characteristics). Applications providing information
    flow control must be able to enforce approved authorizations for controlling the flow of management information within
    the system in accordance with applicable policy.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'Review the router configuration to verify that it is compliant with this requirement.

    Step 1: Verify that an input filter has been configured for the loopback interfaces as

    shown in the example below.

    interfaces {

    …

    …

    …

    }

    lo0 {

    unit 0 {

    family inet {

    filter {

    input RESTRICT_MGMT_ACCESS;

    }

    address 2.2.2.2/32;

    }

    }

    }

    }

    Step 2: Verify that the filter restricts management traffic. The configuration example

    below restricts management access to specific IP addresses via SSH.

    filter RESTRICT_MGMT_ACCESS {

    term ALLOW_SSH {

    from {

    source-address {

    x.x.x.x/24;

    }

    protocol tcp;

    port ssh;

    }

    then accept;

    }

    term DENY_SSH {

    from {

    protocol tcp;

    port ssh;

    }

    then {

    log;

    discard;

    }

    }

    }

    Note: Management and control plane traffic destined to the router is punted to the

    routing engine. Hence, applying the filter to the loopback ensures that this traffic can be

    monitored regardless of the ingress physical interface.

    If the Juniper router is not configured to enforce approved authorizations for controlling

    the flow of management information within the device based on control policies, this is a

    finding.'
  remediation: 'Step 1: Configure the router to restrict management access to specific IP addresses via

    SSH as shown in the example below.

    [edit firewall family inet]

    set filter RESTRICT_MGMT_ACCESS term ALLOW_SSH from source-address

    x.x.x.x/24

    set filter RESTRICT_MGMT_ACCESS term ALLOW_SSH from protocol tcp

    set filter RESTRICT_MGMT_ACCESS term ALLOW_SSH from port ssh

    set filter RESTRICT_MGMT_ACCESS term ALLOW_SSH then accept

    set filter RESTRICT_MGMT_ACCESS term DENY_SSH from protocol tcp

    set filter RESTRICT_MGMT_ACCESS term DENY_SSH from port ssh

    set filter RESTRICT_MGMT_ACCESS term DENY_SSH then log

    set filter RESTRICT_MGMT_ACCESS term DENY_SSH then discard

    Step 2: Apply the filter to the loopback interface.

    [edit interfaces lo0 unit 0 family inet]

    set filter input RESTRICT_MGMT_ACCESS

    Note: Management and control plane traffic destined to the router is punted to the

    routing engine. Hence, applying the filter to the loopback ensures that this traffic can be

    monitored regardless of the ingress physical interface.

    Step 1: Configure the router to restrict management access to specific IP addresses via

    SSH as shown in the example below.

    [edit firewall family inet]

    set filter RESTRICT_MGMT_ACCESS term ALLOW_SSH from source-address

    x.x.x.x/24

    set filter RESTRICT_MGMT_ACCESS term ALLOW_SSH from protocol tcp

    set filter RESTRICT_MGMT_ACCESS term ALLOW_SSH from port ssh

    set filter RESTRICT_MGMT_ACCESS term ALLOW_SSH then accept

    set filter RESTRICT_MGMT_ACCESS term DENY_SSH from protocol tcp

    set filter RESTRICT_MGMT_ACCESS term DENY_SSH from port ssh

    set filter RESTRICT_MGMT_ACCESS term DENY_SSH then log

    set filter RESTRICT_MGMT_ACCESS term DENY_SSH then discard

    Step 2: Apply the filter to the loopback interface.

    [edit interfaces lo0 unit 0 family inet]

    set filter input RESTRICT_MGMT_ACCESS

    Note: Management and control plane traffic destined to the router is punted to the

