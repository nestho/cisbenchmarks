    severity: medium
- id: '1.24'
  title: JUNI-ND-000870
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to automatically audit account enabling actions. GROUP ID: V-217329
    RULE ID: SV-217329r879696'
  rationale: Once an attacker establishes initial access to a system, the attacker often attempts to create a persistent method
    of reestablishing access. One way to accomplish this is for the attacker to simply enable a new or disabled account. Notification
    of account enabling is one method for mitigating this risk. A comprehensive account management process will ensure an
    audit trail which documents the creation of application user accounts and notifies administrators and Information System
    Security Officers (ISSO). Such a process greatly reduces the risk that accounts will be surreptitiously created and provides
    logging that can be used for forensic purposes.
  impact: ''
  references: []
  page_start: 65
  audit_raw: 'Review the router configuration to determine if it audits the enabling of accounts. This

    requirement can be met by ensuring that configuration changes are logged as shown in

    the following example:

    system {

    syslog {

    file LOG_FILE {

    change-log info;

    }

    }

    }

    Note: The parameter “any” can be in place of “change-log” as this will log everything.

    Also, a syslog server can be configured in addition to or in lieu of logging to a file as

    shown in the example below.

    system {

    syslog {

    host 10.1.58.2 {

    any info;

    }

    file LOG_FILE {

    change-log info;

    }

    console {

    any error;

    }

    }

    }

    If the enabling of accounts is not audited, this is a finding.

    Note: Accounts can be disabled by changing the assigned class to unauthorized (no

    permissions). Hence, accounts can be enabled by changing the assigned class for the

    user to a class other than unauthorized.'
  remediation: 'Configure the router to audit the enabling of accounts. This requirement can be met by

    ensuring that configuration changes are logged as shown in the following example:

    set syslog file LOG_FILE change-log info

    Note: The parameter “any” can be in place of “change-log” as this will log everything.

    Also, a syslog server can be configured in addition to or in lieu of logging to a file as

    shown in the example below.

    set syslog host 10.1.58.2 any info

    Note: Accounts can be disabled by changing the assigned class to unauthorized (no

    permissions). Hence, accounts can be enabled by changing the assigned class for the

    user to a class other than unauthorized.'
  checks:
