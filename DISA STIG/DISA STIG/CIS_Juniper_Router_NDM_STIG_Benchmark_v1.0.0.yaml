      security {

      pki {

      ca-profile DODXX_CA {

      ca-identity xxxxx.mil;

      revocation-check {

      crl {

      url http://server1.xxxxx.mil/CertEnroll/example.crl;

      refresh-interval 24;

      }

      }

      administrator {

      em'
    severity: medium
- id: '1.47'
  title: JUNI-ND-001460
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured with a master password that is used to generate encrypted keys for shared
    secrets. GROUP ID: V-220142 RULE ID: SV-220142r879887'
  rationale: By default, shared secrets in a Junos configuration only use an obfuscation algorithm ($9$ format), which is
    not very strong and can easily be decrypted. Strong encryption for configured secrets can be enabled by configuring a
    master password to be used as input to the password based key derivation function (PBKDF2) to generate an encryption key.
    The key is used as input to the Advanced Encryption Standard in Galois/Counter Mode (AES256-GCM).
  impact: ''
  references: []
  page_start: 118
  audit_raw: 'Verify that a master password has been configured as by entering the following

    command:

    show configuration system master-password

    The output will appear as follows:

    password-configured;

    Note: The master password is hidden from the configuration.

    If a master password has not been configured, this is a finding.'
  remediation: 'Configure the master password to be used to generate encrypted keys for shared

    secrets as shown in the example below.

    [edit]

    set system master-password plain-text-password

    Master password: xxxxxxxxxx

    Repeat master password: xxxxxxxxxx'
  checks:
  - type: sql
    command: show configuration system master-password
    severity: medium
    info: 'Verify that a master password has been configured as by entering the following

      command:

      show configuration system master-password

      The output will appear as follows:

      password-configured;

      Note: The master password is hidden from the configuration.

      If a master password has not been configured, this is a finding.'
- id: '1.49'
  title: JUNI-ND-001470
  scoring: manual
  profile:
