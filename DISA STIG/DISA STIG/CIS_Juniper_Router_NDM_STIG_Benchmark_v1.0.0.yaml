    abort - Abort software upgrade

    add - Add extension or upgrade package

    delete - Remove extension or upgrade package

    rollback - Roll back to previous set of packages

    validate - Verify package compatibility with current configuration

    If the router is not configured to limit privileges to change the software resident within

    software libraries, this is a finding.'
  remediation: 'Configure one or more classes as shown in the example below whose users will not be

