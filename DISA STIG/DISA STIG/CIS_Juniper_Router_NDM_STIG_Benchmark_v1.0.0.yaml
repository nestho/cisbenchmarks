      }

      Step 2: Verify that the filter restricts management traffic. The configuration example

      below restricts management access to specific IP addresses via SSH.

      filter RESTRICT_MGMT_ACCESS'
    severity: medium
- id: '1.7'
  title: JUNI-ND-000150
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to enforce the limit of three consecutive invalid logon attempts after
    which time lock out the user account from accessing the device for 15 minutes. GROUP ID: V-217311 RULE ID: SV-217311r879546'
  rationale: By limiting the number of failed login attempts, the risk of unauthorized system access via user password guessing,
    otherwise known as brute-forcing, is reduced.
  impact: ''
  references: []
  page_start: 29
  audit_raw: "Review the router configuration to verify that it enforces the limit of three consecutive\ninvalid logon attempts\
    \ after which time it will lockout the user account from accessing\nthe router for 15 minutes as shown in the example\
    \ below.\nlogin {\n retry-options {\n tries-before-disconnect 3;\n lockout-period 15;\n }\nIf the router is not configured\
    \ to enforce the limit of three consecutive invalid logon\nattempts after which time it will lockout the user account\
    \ from accessing the router for\n15 minutes, this is a finding."
  remediation: 'Configure the router to enforce the limit of three consecutive invalid logon attempts and

    lock out the user account from accessing the device for 15 minutes as shown in the

    example below.

    [edit system login]

    set retry-options tries-before-disconnect 3

    set retry-options lockout-period 15'
  checks:
  - type: manual_review
    info: "Review the router configuration to verify that it enforces the limit of three consecutive\ninvalid logon attempts\
      \ after which time it will lockout the user account from accessing\nthe router for 15 minutes as shown in the example\
      \ below.\nlogin {\n retry-options {\n tries-before-disconnect 3;\n lockout-period 15;\n }\nIf the router is not configured\
      \ to enforce the limit of three consecutive invalid logon\nattempts after which time it will lockout the user account\
      \ from accessing the router for\n15 minutes, "
    severity: medium
