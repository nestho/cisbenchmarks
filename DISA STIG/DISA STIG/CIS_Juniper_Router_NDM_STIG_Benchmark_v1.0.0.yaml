    monitored regardless of the ingress physical interface.'
  checks:
  - type: manual_review
    info: 'Review the router configuration to verify that it is compliant with this requirement.

      Step 1: Verify that an input filter has been configured for the loopback interfaces as

      shown in the example below.

      interfaces {

      …

      …

      …

      }

      lo0 {

      unit 0 {

      family inet {

      filter {

      input RESTRICT_MGMT_ACCESS;

