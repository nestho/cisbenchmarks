    everything. Also, a syslog server can be configured in addition to or in lieu of logging to

    a file as shown in the example below.

    system {

    syslog {

    host 10.1.58.2 {

    any info;

    }

    }

    If the router is not configured to log all commands entered from the command line

    interface as well as log all configuration changes, this is a finding.'
  remediation: 'Configure the router to log all commands entered from the command line interface as

    well as log all configuration changes as shown in the following example:

    [edit system]

    set syslog file LOG_FILE interactive-commands

    set syslog file LOG_FILE change-log info

    Note: The parameter "any" can be in place of configuring specific events as this will log

    everything. Also, a syslog server can be configured in addition to or in lieu of logging to

    a file as shown in the example below.

    set syslog host 10.1.58.2 any info'
