- id: '1.11'
  title: JUNI-ND-000380
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to protect audit information from unauthorized modification. GROUP ID:
    V-217317 RULE ID: SV-217317r879577'
  rationale: Audit information includes all information (e.g., audit records, audit settings, and audit reports) needed to
    successfully audit network device activity. If audit data were to become compromised, then forensic analysis and discovery
    of the true source of potentially malicious system activity is impossible to achieve. To ensure the veracity of audit
    data, the network device must protect audit information from unauthorized modification. This requirement can be achieved
    through multiple methods, which will depend upon system architecture and design. Some commonly employed methods include
    ensuring log files receive the proper file system permissions and limiting log data locations. Network devices providing
    a user interface to audit data will leverage user permissions and roles identifying the user accessing the data and the
    corresponding rights that the user enjoys in order to make access decisions regarding the modification of audit data.
  impact: ''
  references: []
  page_start: 38
  audit_raw: 'Review the router configuration to verify that it is compliant with this requirement. The

    configuration example below allows only users belonging to the AUDITOR class to

    configure the logging parameters.

    system {

    login {

    class AUDITOR {

    permissions [configure view-configuration];

    allow-configuration "(system syslog)";

    }

    class SR_ENGINEER {

    permissions all;

    deny-configuration "(system syslog)";

    }

    }

    }

    If the router is not configured to protect audit information from unauthorized

    modification, this is a finding.'
  remediation: 'Create a login class that provides the permission to configure logging parameters as

    well as a classes that do not allow configuration of logging parameters as shown in the

    example below.

    [edit system]

    set login class AUDITOR permissions [configure view-configuration]

    set login class AUDITOR allow-configuration "(system syslog)"

    set login class SR_ENGINEER permissions all

    set login class SR_ENGINEER deny-configuration "(system syslog)"'
  checks:
  - type: manual_review
    info: 'Review the router configuration to verify that it is compliant with this requirement. The

