- id: '1.13'
  title: KNOX-13-210140
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android must be configured to disable USB mass storage mode. GROUP ID: V-255149 RULE ID: SV-255149r867384'
  rationale: 'USB mass storage mode enables the transfer of data and software from one device to another. This software can
    include malware. When USB mass storage is enabled on a mobile device, it becomes a potential vector for malware and unauthorized
    data exfiltration. Prohibiting USB mass storage mode mitigates this risk. SFR ID: FMT_SMF_EXT.1.1 #39'
  impact: ''
  references: []
  page_start: 35
  audit_raw: 'Review the configuration to determine if the Samsung Android devices are disabling

    USB mass storage mode.

    This validation procedure is performed on both the management tool and the Samsung

    Android device.

    On the management tool, in the device restrictions, verify that "USB file transfer" has

    been set to "Disallow".

    On the Samsung Android device, from the USB settings notification, verify that a "File

    Transfer" is not an option.

    If on the management tool "USB file transfer" is not set to "Disallow", or on the Samsung

    Android device a "File Transfer" is an option, this is a finding.'
  remediation: 'Configure the Samsung Android devices to disable USB mass storage mode.

    On the management tool, in the device restrictions, set "USB file transfer" to "Disallow".

    DeX drag and drop file transfer capabilities will be prohibited, but all other DeX

    capabilities remain useable.'
  checks:
  - type: manual_review
    info: 'Review the configuration to determine if the Samsung Android devices are disabling

