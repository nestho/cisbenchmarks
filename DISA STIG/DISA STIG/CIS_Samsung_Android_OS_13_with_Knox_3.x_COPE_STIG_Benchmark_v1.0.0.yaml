  title: KNOX-13-210130
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Samsung Android must be configured to enable encryption for data at rest on removable storage media or, alternately,
    the use of removable storage media must be disabled. GROUP ID: V-255148 RULE ID: SV-255148r873670'
  rationale: 'The MOS must ensure the data being written to the mobile device''s removable media is protected from unauthorized
    access. If data at rest is unencrypted, it is vulnerable to disclosure. Even if the operating system enforces permissions
    on data access, an adversary can read removable media directly, thereby circumventing operating system controls. Encrypting
    the data ensures confidentiality is protected even when the operating system is not running. SFR ID: FMT_SMF_EXT.1.1 #20,
    #47d'
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'Configure the Samsung Android devices to enable data at rest protection for removable

    media, or alternatively, disable their use.

    This requirement is not applicable for devices that do not support removable storage

    media.

    On the management tool, in the device restrictions, set "Mount physical media" to

    "Disallow".

    This disables the use of all removable storage, e.g., micro SD cards, USB thumb drives,

    etc.

    If the deployment requires the use of micro SD cards, KPE can be used to allow its

    usage in a STIG-approved configuration. In this case, do not configure the policy above,

    and instead:

    On the management tool, in the device restrictions, set "Enforce external storage

    encryption" to "enable".'
  remediation: 'Configure the Samsung Android devices to enable data at rest protection for removable

    media, or alternatively, disable their use.

    This requirement is not applicable for devices that do not support removable storage

    media.

    On the management tool, in the device restrictions, set "Mount physical media" to

    "Disallow".

    This disables the use of all removable storage, e.g., micro SD cards, USB thumb drives,

    etc.

    If the deployment requires the use of micro SD cards, KPE can be used to allow its

    usage in a STIG-approved configuration. In this case, do not configure the policy above,

    and instead:

    On the management tool, in the device restrictions, set "Enforce external storage

    encryption" to "enable".'
