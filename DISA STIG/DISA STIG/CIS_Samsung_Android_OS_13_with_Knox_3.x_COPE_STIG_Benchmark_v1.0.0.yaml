- id: '1.1'
  title: KNOX-13-210010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android must be enrolled as a COPE device. GROUP ID: V-255137 RULE ID: SV-255137r867348'
  rationale: 'The Work profile is the designated application group for the COPE use case. SFR ID: FMT_MOF_EXT.1.2 #47'
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'Review the configuration to determine if the Samsung Android devices are enrolled in a

    DOD-approved use case.

    This validation procedure is performed on both the management tool Administration

    Console and the Samsung Android device.

    On the management tool, verify that the default enrollment is set to "Work profile for

    company-owned devices".

    On the Samsung Android device:

    1. Open Settings >> Security and privacy >> Other security settings >> Device

    admin apps.

    2. Verify that the management tool Agent is listed.

    3. Go to the app drawer.

    4. Verify that a "Personal" and "Work" tab are present.

    If on the management tool the default enrollment is not set as "Work profile for

    company-owned devices", or on the Samsung Android device the "Personal" and

    "Work" tabs are not present or the management tool Agent is not listed, this is a finding.'
  remediation: 'Enroll the Samsung Android devices in a DOD-approved use case.

    On the management tool, configure the default enrollment as "Work profile for companyowned devices".

    Refer to the management tool documentation to determine how to configure the device

    enrollment.'
  checks:
  - type: manual_review
    info: 'Review the configuration to determine if the Samsung Android devices are enrolled in a

      DOD-approved use case.

      This validation procedure is performed on both the management tool Administration

      Console and the Samsung Android device.

      On the management tool, verify that the default enrollment is set to "Work profile for

      company-owned devices".

      On the Samsung Android device:

      1. Open Settings >> Security and privacy >> Other security settings >> Device

      admin apps.

      2. Verify that the management tool A'
    severity: medium
- id: '1.2'
  title: KNOX-13-210020
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Samsung Android must be configured to display the DOD advisory warning message at startup or each time the
    user unlocks the device. GROUP ID: V-255138 RULE ID: SV-255138r867351'
  rationale: 'Before granting access to the system, the mobile operating system is required to display the DOD-approved system
    use notification message or banner that provides privacy and security notices consistent with applicable federal laws,
    Executive Orders, directives, policies, regulations, standards, and guidance. Required banners help ensure that DOD can
    audit and monitor the activities of mobile device users without legal restriction. System use notification messages can
    be displayed when individuals first access or unlock the mobile device. The banner must be implemented as a "click-through"
    banner at device unlock (to the extent permitted by the operating system). A "click-through" banner prevents further activity
    on the information system unless and until the user executes a positive action to manifest agreement by clicking on a
    box indicating "OK." The approved DOD text must be used exactly as required in the Knowledge Service referenced in DODI
    8500.01. For devices accommodating banners of 1300 characters, the banner text is: You are accessing a U.S. Government
    (USG) Information System (IS) that is provided for USG-authorized use only. By using this IS (which includes any device
    attached to this IS), you consent to the following conditions: -The USG routinely intercepts and monitors communications
    on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and
    defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations. -At any time, the
    USG may inspect and seize data stored on this IS. -Communications using, or data stored on, this IS are not private, are
    subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.
    -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your
    personal benefit or privacy. -Notwithstanding the above, using this IS does not constitute consent to PM, LE, or CI investigative
    searching or monitoring of the content of privileged communications, or work product, related to personal representation
    or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are
    private and confidential. See User Agreement for details. For devices with severe character limitations, the banner text
    is: I''ve read & consent to terms in IS user agreem''t. The administrator must configure the banner text exactly as written
    without any changes. SFR ID: FMT_SMF_EXT.1.1 #36'
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'Confirm if Method #1 or #2 is used at the Samsung device site and follow the

    appropriate procedure.

    This validation procedure is performed on both the management tool and the Samsung

    Android device.

    Validation procedure for method #1: Place the DOD warning banner in the user

    agreement signed by each Samsung Android device user (preferred method).

    Review the signed user agreements for several Samsung Android device users and

    verify that the agreement includes the required DOD warning banner text.

    Validation procedure for method #2: Configure the warning banner text in the Lock

    screen message on each managed mobile device.

    On the management tool, in the device restrictions section, verify that "Lock Screen

    Message" is set to the DOD-mandated warning banner text.

    On the Samsung Android device, verify that the required DOD warning banner text is

    displayed on the Lock screen.

    If the warning text has not been placed in the signed user agreement, or if on the

    management tool "Lock Screen Message" is not set to the DOD-mandated warning

    banner text, or on the Samsung Android device the required DOD warning banner text

    is not displayed on the Lock screen, this is a finding.'
  remediation: 'Configure the DOD warning banner by either of the following methods (required text is

    found in the Vulnerability Description):

    Method #1: Place the DOD warning banner in the user agreement signed by each

    Samsung Android device user (preferred method).

    Method #2: Configure the warning banner text in the Lock screen message on each

    managed mobile device.

    On the management tool, in the device restrictions section, set "Lock Screen Message"

    to the DOD-mandated warning banner text.'
  checks:
  - type: manual_review
    info: 'Confirm if Method #1 or #2 is used at the Samsung device site and follow the

      appropriate procedure.

      This validation procedure is performed on both the management tool and the Samsung

      Android device.

      Validation procedure for method #1: Place the DOD warning banner in the user

      agreement signed by each Samsung Android device user (preferred method).

      Review the signed user agreements for several Samsung Android device users and

      verify that the agreement includes the required DOD warning banner text.'
    severity: medium
- id: '1.3'
  title: KNOX-13-210030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android must be configured to not allow passwords that include more than four repeating or sequential
    characters. GROUP ID: V-255139 RULE ID: SV-255139r867354'
  rationale: 'Password strength is a measure of the effectiveness of a password in resisting guessing and brute force attacks.
    Passwords that contain repeating or sequential characters are significantly easier to guess than those that do not contain
    repeating or sequential characters. Therefore, disallowing repeating or sequential characters increases password strength
    and decreases risk. SFR ID: FMT_SMF_EXT.1.1 #1b'
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Review the configuration to determine if the Samsung Android devices are disallowing

    passwords containing more than four repeating or sequential characters.

    This validation procedure is performed on both the management tool and the Samsung

    Android device.

    On the management tool, in the device password policies, verify "minimum password

    quality" is set to "Numeric(Complex)" or better.

    On the Samsung Android device:

    1. Open Settings >> Lock screen >> Screen lock type.

    2. Enter current password.

    3. Tap "PIN".

    4. Verify that PINS with more than four repeating or sequential numbers are not

    accepted.

    If on the management tool "minimum password quality" is not set to

    "Numeric(Complex)" or better, or on the Samsung Android device a password with more

    than four repeating or sequential numbers is accepted, this is a finding.'
  remediation: 'Configure the Samsung Android devices to disallow passwords containing more than

    four repeating or sequential characters.

    On the management tool, in the device password policies, set "minimum password

    quality" to "Numeric(Complex)" or better.

    If the management tool does not support "Numeric(Complex)" but does support

    "Numeric", KPE can be used to achieve STIG compliance. In this case, configure this

    policy with value "Numeric" and use an additional KPE policy (innately by the

    management tool or via KSP) "Maximum Numeric Sequence Length" with value "4".'
  checks:
  - type: manual_review
    info: 'Review the configuration to determine if the Samsung Android devices are disallowing

      passwords containing more than four repeating or sequential characters.

      This validation procedure is performed on both the management tool and the Samsung

      Android device.

      On the management tool, in the device password policies, verify "minimum password

      quality" is set to "Numeric(Complex)" or better.

      On the Samsung Android device:

      1. Open Settings >> Lock screen >> Screen lock type.

      2. Enter current password.

      3.'
    severity: medium
- id: '1.4'
  title: KNOX-13-210040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android must be configured to enable a screen-lock policy that will lock the display after a period
    of inactivity. GROUP ID: V-255140 RULE ID: SV-255140r867357'
  rationale: 'The screen-lock timeout helps protect the device from unauthorized access. Devices without a screen-lock timeout
    provide an opportunity for adversaries who gain physical access to the mobile device through loss, theft, etc. Such devices
    are much more likely to be in an unlocked state when acquired by an adversary, thus granting immediate access to the data
    on the mobile device and possibly access to DOD networks. SFR ID: FMT_SMF_EXT.1.1 #2a'
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'Verify requirement KNOX-13-210030 (minimum password quality) has been

    implemented.

    If a "minimum password quality" has not been implemented, this is a finding.'
  remediation: Implement a "minimum password quality" (see requirement KNOX-13-210030).
  checks:
  - type: manual_review
    info: 'Verify requirement KNOX-13-210030 (minimum password quality) has been

      implemented.

      If a "minimum password quality" has not been implemented, this is a finding.'
    severity: medium
- id: '1.5'
  title: KNOX-13-210050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android must be configured to enforce a minimum password length of six characters. GROUP ID: V-255141
    RULE ID: SV-255141r867360'
  rationale: 'Password strength is a measure of the effectiveness of a password in resisting guessing and brute force attacks.
    The ability to crack a password is a function of how many attempts an adversary is permitted, how quickly an adversary
    can do each attempt, and the size of the password space. The longer the minimum length of the password is, the larger
    the password space. Having a too-short minimum password length significantly reduces password strength, increasing the
    chance of password compromise and resulting device and data compromise. SFR ID: FMT_SMF_EXT.1.1 #1a'
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'Review the configuration to determine if the Samsung Android devices are enforcing a

    minimum password length of six characters.

    This validation procedure is performed on both the management tool and the Samsung

    Android device.

    On the management tool, in the device password policies, verify "minimum password

    length" is set to "6".

    On the Samsung Android device:

    1. Open Settings >> Lock screen >> Screen lock type.

    2. Enter current password.

    3. Tap "PIN".

    4. Verify the text "PIN must contain at least", followed by a value of at least "6

    digits", appears above the PIN entry.

    If on the management tool "minimum password length" is not set to "6", or on the

    Samsung Android device the text "PIN must contain at least" is followed by a value of

    less than "6 digits", this is a finding.'
  remediation: 'Configure the Samsung Android devices to enforce a minimum password length of six

    characters.

    On the management tool, in the device password policies, set "minimum password

    length" to "6".'
  checks:
  - type: manual_review
    info: 'Review the configuration to determine if the Samsung Android devices are enforcing a

      minimum password length of six characters.

      This validation procedure is performed on both the management tool and the Samsung

      Android device.

      On the management tool, in the device password policies, verify "minimum password

      length" is set to "6".

      On the Samsung Android device:

      1. Open Settings >> Lock screen >> Screen lock type.

      2. Enter current password.

      3. Tap "PIN".

      4. Verify the text "PIN must contain at lea'
    severity: medium
- id: '1.6'
  title: KNOX-13-210060
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android must be configured to not allow more than 10 consecutive failed authentication attempts. GROUP
    ID: V-255142 RULE ID: SV-255142r867363'
  rationale: 'The more attempts an adversary has to guess a password, the more likely the adversary will enter the correct
    password and gain access to resources on the device. Setting a limit on the number of attempts mitigates this risk. Setting
    the limit at 10 or less gives authorized users the ability to make a few mistakes when entering the password but still
    provides adequate protection against dictionary or brute force attacks on the password. SFR ID: FMT_SMF_EXT.1.1 #2c, FIA_AFL_EXT.1.5'
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Review the configuration to determine if the Samsung Android devices are allowing only

    10 or fewer consecutive failed authentication attempts.

    This validation procedure is performed on both the management tool and the Samsung

    Android device.

    On the management tool, in the device password policies, verify "max password failures

    for local wipe" is set to "10" attempts or less.

    On the Samsung Android device:

    1. Open Settings >> Lock screen.

    2. Verify "Secure lock settings" is present and tap it.

    3. Enter current password.

    4. Verify that "Auto factory reset" is greyed out, and cannot be configured.

    Note: When "Auto factory reset" is greyed out, this indicates the Administrator

    (MDM) is in control of the setting to wipe the device after 10 or fewer consecutive

    failed authentication attempts.

    If on the management tool "max password failures for local wipe" is not set to "10"

    attempts or less, or on the Samsung Android device the "Auto factory reset" menu can

    be configured, this is a finding.'
  remediation: 'Configure the Samsung Android devices to allow only 10 or fewer consecutive failed

    authentication attempts.

    On the management tool, in the device password policies, set "max password failures

    for local wipe" to "10" attempts or less.

    A device password must be set for "max password failures for local wipe" to become

    active.'
  checks:
  - type: manual_review
    info: 'Review the configuration to determine if the Samsung Android devices are allowing only

      10 or fewer consecutive failed authentication attempts.

      This validation procedure is performed on both the management tool and the Samsung

      Android device.

      On the management tool, in the device password policies, verify "max password failures

      for local wipe" is set to "10" attempts or less.

      On the Samsung Android device:

      1. Open Settings >> Lock screen.

      2. Verify "Secure lock settings" is present and tap it.

      3.'
    severity: medium
- id: '1.7'
  title: KNOX-13-210070
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android must be configured to lock the display after 15 minutes (or less) of inactivity. GROUP ID:
    V-255143 RULE ID: SV-255143r867366'
  rationale: 'The screen lock timeout must be set to a value that helps protect the device from unauthorized access. Having
    a too-long timeout would increase the window of opportunity for adversaries who gain physical access to the mobile device
    through loss, theft, etc. Such devices are much more likely to be in an unlocked state when acquired by an adversary,
    thus granting immediate access to the data on the mobile device. The maximum timeout period of 15 minutes has been selected
    to balance functionality and security; shorter timeout periods may be appropriate depending on the risks posed to the
    mobile device. SFR ID: FMT_SMF_EXT.1.1 #2b'
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'Review the configuration to determine if the Samsung Android devices are locking the

    device display after 15 minutes (or less) of inactivity.

    This validation procedure is performed on both the management tool and the Samsung

    Android device.

    On the management tool, in the device password policies, verify "max time to screen

    lock" is set to "15 minutes" or less.

    On the Samsung Android device:

    1. Open Settings >> Lock screen.

    2. Verify "Secure lock settings" is present and tap it.

    3. Enter current password.

    4. Tap "Auto lock when screen turns off".

    5. Verify the listed timeout values are 15 minutes or less.

    If on the management tool "max time to screen lock" is not set to "15 minutes" or less,

    or on the Samsung Android device "Secure lock settings" is not present and the listed

    Screen timeout values include durations of more than 15 minutes, this is a finding.'
  remediation: 'Configure the Samsung Android devices to lock the device display after 15 minutes (or

    less) of inactivity.

    On the management tool, in the device password policies, set "max time to screen lock"

    to "15 minutes" or less.

    A device password must be set for "max time to screen lock" to become active.'
  checks:
  - type: manual_review
    info: 'Review the configuration to determine if the Samsung Android devices are locking the

      device display after 15 minutes (or less) of inactivity.

      This validation procedure is performed on both the management tool and the Samsung

