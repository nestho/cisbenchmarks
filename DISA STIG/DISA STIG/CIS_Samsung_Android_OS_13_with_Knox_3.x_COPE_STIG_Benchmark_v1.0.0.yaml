    If on the management tool "Common Criteria mode" is not set to "Enable", or on the

    Samsung Android device the text "Blocked by CC Mode" is not displayed in "Download

    mode", this is a finding.'
  remediation: 'Configure the Samsung Android devices to enable CC mode.

    On the management tool, in the Work profile restrictions, set "Common Criteria mode"

    to "Enable".'
