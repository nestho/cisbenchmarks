- id: '1.16'
  title: KNOX-13-210170
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android must be configured to disallow configuration of the device''s date and time. GROUP ID: V-255152
    RULE ID: SV-255152r867393'
  rationale: 'Determining the correct time a particular application event occurred on a system is critical when conducting
    forensic analysis and investigating system events. Periodically synchronizing internal clocks with an authoritative time
    source is needed to correctly correlate the timing of events that occur across the enterprise. The three authoritative
    time sources for Samsung Android are an authoritative time server that is synchronized with redundant United States Naval
    Observatory (USNO) time servers as designated for the appropriate DOD network (NIPRNet or SIPRNet), the Global Positioning
    System (GPS), or the wireless carrier. Time stamps generated by the audit system in Samsung Android must include both
    date and time. The time may be expressed in Coordinated Universal Time (UTC), a modern continuation of Greenwich Mean
    Time (GMT), or local time with an offset from UTC. SFR ID: FMT_MOF_EXT.1.2 #47'
  impact: ''
  references: []
  page_start: 39
  audit_raw: 'Review the configuration to determine if the Samsung Android devices are disallowing

    the users from changing the date and time.

    This validation procedure is performed on both the management tool and the Samsung

    Android device.

    On the management tool, in the device restrictions, verify that "Configure Date/Time" is

    set to "Disallow".

    On the Samsung Android device:

    1. Open Settings >> General management >> Date and time.

    2. Verify that "Automatic data and time" is on and the user cannot disable it.

    If on the management tool "Configure Date/Time" is not set to "Disallow", or on the

    Samsung Android device "Automatic date and time" is not set or the user can disable it,

    this is a finding.'
  remediation: 'Configure the Samsung Android devices to disallow users from changing the date and

    time.

    On the management tool, in the device restrictions, set "Configure Date/Time" to

    "Disallow".'
  checks:
  - type: manual_review
    info: 'Review the configuration to determine if the Samsung Android devices are disallowing

