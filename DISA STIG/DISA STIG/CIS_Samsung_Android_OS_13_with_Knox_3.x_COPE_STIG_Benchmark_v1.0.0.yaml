- id: '1.11'
  title: KNOX-13-210120
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Samsung Android must be configured to disable all Bluetooth profiles except for HSP (Headset Profile), HFP
    (Hands-Free Profile), SPP (Serial Port Profile), A2DP (Advanced Audio Distribution Profile), AVRCP (Audio/Video Remote
    Control Profile), and PBAP (Phone Book Access Profile). GROUP ID: V-255147 RULE ID: SV-255147r867378'
  rationale: 'Some Bluetooth profiles provide the capability for remote transfer of sensitive DOD data without encryption
    or otherwise do not meet DOD IT security policies and therefore must be disabled. SFR ID: FMT_SMF_EXT.1.1/BLUETOOTH BT-8'
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'Review the Samsung documentation and inspect the configuration to verify the

    Samsung Android devices are paired only with devices which support HSP, HFP, SPP,

    A2DP, AVRCP, and PBAP Bluetooth profiles.

    This validation procedure is performed on both the management tool and the Samsung

    Android device.

    On the management tool, in the device restrictions section, verify "Bluetooth" is set to

    the AO-approved selection; "Allow" - if the AO has approved the use of Bluetooth - or

    "Disallow", if not.

    On the Samsung Android device:

    1. Open Settings >> Connections >> Bluetooth.

    2. Verify that all listed paired Bluetooth devices use only authorized Bluetooth

    profiles.

    If on the management tool "Bluetooth" is not set to the AO-approved value, or the

    Samsung Android device is paired with a device that uses unauthorized Bluetooth

    profiles, this is a finding.'
  remediation: 'Configure the Samsung Android devices to disable Bluetooth, or if the AO has approved

    the use of Bluetooth (for example, for hands-free use), train users to only pair devices

    which support HSP, HFP, SPP, A2DP, AVRCP, PBAP profiles.

    On the management tool, in the device restrictions section, set "Bluetooth" to the AOapproved selection; "Allow" - if
    the AO has approved the use of Bluetooth - or

    "Disallow", if not.

    The user training requirement is satisfied in requirement KNOX-13-210300.'
  checks:
  - type: manual_review
    info: 'Review the Samsung documentation and inspect the configuration to verify the

      Samsung Android devices are paired only with devices which support HSP, HFP, SPP,

