- id: '1.23'
  title: KNOX-13-210240
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android''s Work profile must be configured to not allow backup of all applications, configuration
    data to remote systems. • Disable Data Sync Framework. GROUP ID: V-255159 RULE ID: SV-255159r867414'
  rationale: 'Backups to remote systems (including cloud backup) can leave data vulnerable to breach on the external systems,
    which often offer less protection than the MOS. Where the remote backup involves a cloud-based solution, the backup capability
    is often used to synchronize data across multiple devices. In this case, DOD devices may synchronize DOD sensitive information
    to a user''s personal device or other unauthorized computers that are vulnerable to breach. The Data Sync Framework allows
    apps to synchronize data between the mobile device and other web based services. This uses accounts for those services
    that the user has added to the mobile device. Preventing the user from adding accounts to the device mitigates this risk.
    SFR ID: FMT_SMF_EXT.1.1 #40'
  impact: ''
  references: []
  page_start: 52
  audit_raw: 'Verify requirement KNOX-13-210230 (Disallow modify accounts) has been

    implemented.

    If "Disallow modify accounts" has not been implemented, this is a finding.'
  remediation: Implement "Disallow modify accounts" (see requirement KNOX-13-210230)
  checks:
  - type: manual_review
    info: 'Verify requirement KNOX-13-210230 (Disallow modify accounts) has been

      implemented.

      If "Disallow modify accounts" has not been implemented, this is a finding.'
    severity: medium
- id: '1.24'
  title: KNOX-13-210250
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android''s Work profile must be configured to disable exceptions to the access control policy that
    prevent application processes, and groups of application processes from accessing all data stored by other application
    processes, and groups of application processes. GROUP ID: V-255160 RULE ID: SV-255160r867417'
  rationale: 'App data sharing gives apps the ability to access the data of other apps for enhanced user functionality. However,
    sharing also poses a significant risk that unauthorized users or apps will obtain access to DOD sensitive information.
    To mitigate this risk, there are data sharing restrictions, primarily from sharing data from personal (unmanaged) apps
    and work (managed) apps. If a user is allowed to make exceptions to the data sharing restriction policy, the user could
    enable unauthorized sharing of data, leaving it vulnerable to breach. Limiting the granting of exceptions to either the
    Administrator or common application developer mitigates this risk. Copy/paste of data between applications in different
    application processes or groups of application processes is considered an exception to the access control policy and therefore,
    the Administrator must be able to enable/disable the feature. Other exceptions include allowing any data or application
