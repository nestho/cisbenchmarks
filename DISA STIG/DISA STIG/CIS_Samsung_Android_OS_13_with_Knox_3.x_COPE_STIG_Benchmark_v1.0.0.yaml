      On the management tool, in the device restrictions, verify that "USB file transfer" has

      been set to "Disallow".

      On the Samsung Android device, from the USB settings notification, verify that a "File

      Transfer" is not an option.

      If on the management tool "USB file transfer" is not set to "Disallo'
    severity: medium
- id: '1.14'
  title: KNOX-13-210150
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android must be configured to not allow backup of all applications and configuration data to locally
    connected systems. GROUP ID: V-255150 RULE ID: SV-255150r867387'
  rationale: 'Data on mobile devices is protected by numerous mechanisms, including user authentication, access control, and
    cryptography. When the data is backed up to an external system (either locally connected or cloud based), many if not
    all of these mechanisms are no longer present. This leaves the backed-up data vulnerable to attack. Disabling backup to
    external systems mitigates this risk. SFR ID: FMT_SMF_EXT.1.1 #40'
  impact: ''
  references: []
