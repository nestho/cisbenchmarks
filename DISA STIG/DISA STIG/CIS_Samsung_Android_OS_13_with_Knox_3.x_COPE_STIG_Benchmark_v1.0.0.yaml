  description: 'Samsung Android''s Work profile must allow only the Administrator (management tool) to perform the following
    management function: Install/remove DOD root and intermediate PKI certificates. GROUP ID: V-255161 RULE ID: SV-255161r867420'
  rationale: 'DOD root and intermediate PKI certificates are used to verify the authenticity of PKI certificates of users
    and web services. If the user is allowed to remove root and intermediate certificates, the user could allow an adversary
    to falsely sign a certificate in such a way that it could not be detected. Restricting the ability to remove DOD root
    and intermediate PKI certificates to the Administrator mitigates this risk. SFR ID: FMT_MOF_EXT.1.2 #47'
  impact: ''
  references: []
  page_start: 55
