  audit_raw: 'Verify requirement KNOX-13-210140 (Disallow USB file transfer) has been

    implemented.

    If "Disallow USB file transfer" has not been implemented, this is a finding.'
  remediation: Verify "USB file transfer" has been "Disallowed" (see requirement KNOX-13-210140).
