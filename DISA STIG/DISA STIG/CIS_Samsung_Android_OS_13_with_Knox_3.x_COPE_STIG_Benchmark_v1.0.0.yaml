- id: '1.10'
  title: KNOX-13-210110
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android must be configured to disable developer modes. GROUP ID: V-255146 RULE ID: SV-255146r867375'
  rationale: 'Developer modes expose features of the MOS that are not available during standard operation. An adversary may
    leverage a vulnerability inherent in a developer mode to compromise the confidentiality, integrity, and availability of
    DOD sensitive information. Disabling developer modes mitigates this risk. SFR ID: FMT_SMF_EXT.1.1 #26'
  impact: ''
  references: []
