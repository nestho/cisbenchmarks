  title: KNOX-13-210160
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android must be configured to enable authentication of personal hotspot connections to the device
    using a pre-shared key. GROUP ID: V-255151 RULE ID: SV-255151r873673'
  rationale: 'If no authentication is required to establish personal hotspot connections, an adversary may be able to use
