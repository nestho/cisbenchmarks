  title: KNOX-13-210220
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android''s Work profile must be configured to enable audit logging. GROUP ID: V-255157 RULE ID: SV-255157r867408'
  rationale: 'Audit logs enable monitoring of security-relevant events and subsequent forensics when breaches occur. They
