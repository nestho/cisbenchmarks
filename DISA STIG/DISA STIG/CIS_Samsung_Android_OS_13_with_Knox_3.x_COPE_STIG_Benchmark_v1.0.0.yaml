- id: '1.28'
  title: KNOX-13-210290
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Samsung Android must not accept the certificate when it cannot establish a connection to determine the validity
    of a certificate. GROUP ID: V-255164 RULE ID: SV-255164r867429'
  rationale: 'Certificate-based security controls depend on the ability of the system to verify the validity of a certificate.
    If the MOS were to accept an invalid certificate, it could take unauthorized actions, resulting in unanticipated outcomes.
    At the same time, if the MOS were to disable functionality when it could not determine the validity of the certificate,
    this could result in a denial of service. Therefore, the ability to provide exceptions is appropriate to balance the tradeoff
    between security and functionality. Always accepting certificates when they cannot be determined to be valid is the most
    extreme exception policy and is not appropriate in the DOD context. Involving an Administrator or user in the exception
    decision mitigates this risk to some degree. SFR ID: FIA_X509_EXT_2.2'
  impact: ''
  references: []
  page_start: 61
  audit_raw: 'Verify requirement KNOX-13-210280 (Common Criteria mode) has been implemented.

    If "Common Criteria mode" has not been implemented, this is a finding.'
  remediation: Implement "Common Criteria mode" (see requirement KNOX-13-210280).
  checks:
  - type: manual_review
    info: 'Verify requirement KNOX-13-210280 (Common Criteria mode) has been implemented.

      If "Common Criteria mode" has not been implemented, this is a finding.'
    severity: medium
- id: '1.29'
  title: KNOX-13-210300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android device users must complete required training. GROUP ID: V-255165 RULE ID: SV-255165r867432'
  rationale: 'The security posture of Samsung devices requires the device user to configure several required policy rules
    on their device. User Based Enforcement (UBE) is required for these controls. In addition, if the Authorizing Official
    (AO) has approved the use of an unmanaged personal space, the user must receive training on risks. If a user is not aware
    of their responsibilities and does not comply with UBE requirements, the security posture of the Samsung mobile device
    may become compromised and DOD sensitive data may become compromised. SFR ID: FMT_MOF_EXT.1.2 #47'
  impact: ''
  references: []
  page_start: 62
  audit_raw: 'Review a sample of site User Agreements of Samsung device users or similar training

    records and training course content.

    Verify that Samsung device users have completed required training. The intent is that

    required training is renewed on a periodic basis in a time period determined by the AO.

    If any Samsung device user has not completed required training, this is a finding.'
  remediation: 'Have all Samsung device users’ complete training on the following topics. Users should

    acknowledge they have reviewed training via a signed User Agreement or similar

    written record.

    Training topics:

    • Operational security concerns introduced by unmanaged

    applications/unmanaged personal space including applications using global

    positioning system (GPS) tracking.

    • Need to ensure no DOD data is saved to the personal space or transmitted from

    a personal app (for example, from personal email).

    • If the Purebred key management app is used, users are responsible for

    maintaining positive control of their credentialed device at all times. The DOD

    PKI certificate policy requires subscribers to maintain positive control of the

    devices that contain private keys and to report any loss of control so the

    credentials can be revoked. Upon device retirement, turn-in, or reassignment,

    ensure a factory data reset is performed prior to device hand-off. Follow Mobility

    service provider decommissioning procedures as applicable.

    • How to configure the following UBE controls (users must configure the control)

    on the Samsung device:

    1. Secure use of Calendar Alarm.

    2. Local screen mirroring and MirrorLink procedures (authorized/not authorized for

    use).

    3. Do not connect Samsung devices (via either DeX Station or dongle) to any DOD

    network via Ethernet connection.

    4. Do not upload DOD contacts via smart call and caller ID services.

    5. Disable Wi-Fi Sharing.

    6. Do not configure a DOD network (work) VPN profile on any third-party VPN client

    installed in the personal space.

    • AO guidance on acceptable use and restrictions, if any, on downloading and

    installing personal apps and data (music, photos, etc.) in the Samsung device

    personal space.'
  checks:
  - type: manual_review
    info: 'Review a sample of site User Agreements of Samsung device users or similar training

      records and training course content.

      Verify that Samsung device users have completed required training. The intent is that

      required training is renewed on a periodic basis in a time period determined by the AO.

      If any Samsung device user has not completed required training, this is a finding.'
    severity: medium
