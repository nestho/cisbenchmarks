  description: 'Samsung Android''s Work profile must be configured to not allow installation of applications with the following
    characteristics: • Back up MD data to non-DOD cloud servers (including user and application access to cloud backup services);
    • Transmit MD diagnostic data to non-DOD servers; • Voice assistant application if available when MD is locked; • Voice
    dialing application if available when MD is locked; • Allows synchronization of data or applications between devices associated
    with user; and • Allows unencrypted (or encrypted but not FIPS 140-2 validated) data sharing with other MDs or printers.
    GROUP ID: V-255155 RULE ID: SV-255155r867402'
  rationale: 'Requiring all authorized applications to be in an application allowlist prevents the execution of any applications
    (e.g., unauthorized, malicious) that are not part of the allowlist. Failure to configure an application allowlist properly
    could allow unauthorized and malicious applications to be downloaded, installed, and executed on the mobile device, causing
    a compromise of DOD data accessible by these applications. Applications with the listed characteristics have features
    that can cause the compromise of sensitive DOD data or have features with no known application in the DOD environment.
    Application note: The application allowlist, in addition to controlling the installation of applications on the MD, must
    control user access/execution of all core and preinstalled applications, or the MD must provide an alternate method of
    restricting user access/execution to core and preinstalled applications. Core application: Any application integrated
    into the OS by the OS or MD vendors. Preinstalled application: Additional noncore applications included in the OS build
    by the OS vendor, MD vendor, or wireless carrier. SFR ID: FMT_SMF_EXT.1.1 #8b'
  impact: ''
  references: []
  page_start: 45
  audit_raw: 'Verify requirement KNOX-13-210190 (managed Google Play) has been implemented.

    If "managed Google Play" has not been implemented, this is a finding.'
  remediation: 'The Authorizing Official (AO) must not approve applications with the following

    characteristics for installation by users in the Work profile:

    • Back up MD data to non-DOD cloud servers (including user and application

    access to cloud backup services);

    • Transmit MD diagnostic data to non-DOD servers;

    • Voice assistant application if available when MD is locked;

    • Voice dialing application if available when MD is locked;

    • Allows synchronization of data or applications between devices associated with

    user;

    • Payment processing; and

    • Allows unencrypted (or encrypted but not FIPS 140-2 validated) data sharing with

    other MDs, display screens (screen mirroring), or printers.

    Implement "managed Google Play" (see requirement KNOX-13-210190).'
