- id: '1.17'
  title: KNOX-13-210180
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android''s Work profile must have the DOD root and intermediate PKI certificates installed. GROUP
    ID: V-255153 RULE ID: SV-255153r867396'
  rationale: 'DOD root and intermediate PKI certificates are used to verify the authenticity of PKI certificates of users
    and web services. If the root and intermediate certificates are not available, an adversary could falsely sign a certificate
    in such a way that it could not be detected. Providing access to the DOD root and intermediate PKI certificates greatly
    diminishes the risk of this attack. SFR ID: FMT_MOF_EXT.1.2 #47'
  impact: ''
  references: []
  page_start: 41
  audit_raw: 'Review the configuration to determine if the Samsung Android''s Work profile has the

    DOD root and intermediate PKI certificates installed.

    This validation procedure is performed on both the management tool and the Samsung

    Android device.

    The current DOD root and intermediate PKI certificates may be obtained in selfextracting zip files at https://cyber.mil/pki-pke
    (for NIPRNet).

    On the management tool, in the Work profile policy management, verify that the DOD

    root and intermediate PKI certificates are installed.

    On the Samsung Android device:

    1. Open Settings >> Security and privacy >> Other security settings >> View

    security certificates.

    2. In the User tab, verify that the DOD root and intermediate PKI certificates are

    listed in the Work profile.

    If on the management tool the DOD root and intermediate PKI certificates are not listed

    in the Work profile, or on the Samsung Android device the DOD root and intermediate

    PKI certificates are not listed in the Work profile, this is a finding.'
  remediation: 'Install the DOD root and intermediate PKI certificates into the Samsung Android

    devices'' Work profile.

    The current DOD root and intermediate PKI certificates may be obtained in selfextracting zip files at https://cyber.mil/pki-pke
    (for NIPRNet).

    On the management tool, in the Work profile policy management, install the DOD root

    and intermediate PKI certificates.'
  checks:
  - type: manual_review
    info: 'Review the configuration to determine if the Samsung Android''s Work profile has the

      DOD root and intermediate PKI certificates installed.

      This validation procedure is performed on both the management tool and the Samsung

      Android device.

      The current DOD root and intermediate PKI certificates may be obtained in selfextracting zip files at https://cyber.mil/pki-pke
      (for NIPRNet).

      On the management tool, in the Work profile policy management, verify that the DOD

      root and intermediate PKI certificate'
    severity: medium
- id: '1.18'
  title: KNOX-13-210190
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Samsung Android''s Work profile must be configured to enforce an application installation policy by specifying
    an application allowlist that restricts applications by the following characteristics: Names. GROUP ID: V-255154 RULE
    ID: SV-255154r867399'
  rationale: 'The application allowlist, in addition to controlling the installation of applications on the MD, must control
    user access/execution of all core and preinstalled applications, or the MD must provide an alternate method of restricting
    user access/execution to core and preinstalled applications. Core application: Any application integrated into the OS
    by the OS or MD vendors. Preinstalled application: Additional noncore applications included in the OS build by the OS
    vendor, MD vendor, or wireless carrier. Requiring all authorized applications to be in an application allowlist prevents
    the execution of any applications (e.g., unauthorized, malicious) that are not part of the allowlist. Failure to configure
    an application allowlist properly could allow unauthorized and malicious applications to be downloaded, installed, and
    executed on the mobile device, causing a compromise of DOD data accessible by these applications. The application allowlist,
    in addition to controlling the installation of applications on the MD, must control user access/execution of all core
    applications (included in the OS by the OS vendor) and preinstalled applications (provided by the MD vendor and wireless
    carrier), or the MD must provide an alternate method of restricting user access/execution to core and preinstalled applications.
    SFR ID: FMT_SMF_EXT.1.1 #8b'
  impact: ''
  references: []
  page_start: 43
  audit_raw: 'Review the configuration to determine if the Work profile on the Samsung Android

    device is allowing users to install only applications that have been approved by the

    Authorizing Official (AO).

    This validation procedure is performed only on the management tool.

    On the management tool, in the app catalog for managed Google Play, verify that only

    AO-approved apps are available.

    If on the management tool the app catalog for managed Google Play includes non-AOapproved apps, this is a finding.'
  remediation: 'Configure the Work profile on Samsung Android devices to allow users to install only

    applications that have been approved by the AO.

    In addition to any local policy, the AO must not approve applications that have certain

    prohibited characteristic; these are covered in KNOX-13-210200.

    On the management tool, in the app catalog for managed Google Play, add each AOapproved app to be available.

    Note: Managed Google Play is an allowed App Store.'
  checks:
  - type: manual_review
    info: 'Review the configuration to determine if the Work profile on the Samsung Android

      device is allowing users to install only applications that have been approved by the

      Authorizing Official (AO).

      This validation procedure is performed only on the management tool.

      On the management tool, in the app catalog for managed Google Play, verify that only

      AO-approved apps are available.

      If on the management tool the app catalog for managed Google Play includes non-AOapproved apps, this is a finding.'
    severity: medium
