    Verizon Wireless: https://www.verizonwireless.com/support/software-updates/

    Google Android OS patch website: https://source.android.com/security/bulletin/

    Samsung Android OS patch website:

    https://security.samsungmobile.com/securityUpdate.smsb'
  remediation: 'Install the latest released version of Samsung Android OS on all managed Samsung

    devices.

    Note: In most cases, OS updates are released by the wireless carrier (for example,

    Sprint, T-Mobile, Verizon Wireless, and ATT).'
