- id: '1.27'
  title: KNOX-13-210280
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Samsung Android''s Work profile must be configured to enable Common Criteria (CC) mode. GROUP ID: V-255163
    RULE ID: SV-255163r867426'
  rationale: 'The CC Mode feature is a superset of other features and behavioral changes that are mandatory MDFPP requirements.
    If CC mode is not implemented the device will not be operating in the NIAP-certified compliant CC Mode of operation. When
    enforcing AE CC mode on a Samsung Android device, additional Samsung specific security features are also enabled. CC Mode
    implements the following behavioral/functional changes to meet MDFPP requirements: • How the Bluetooth and Wi-Fi keys
    are stored using different types of encryption. • Download Mode is disabled and all updates will occur via FOTA only.
    In addition, CC Mode adds new restrictions, which are not to meet MDFPP requirements, but to offer better security above
    what is required: • Force password info following FOTA update for consistency. • Disable Remote unlock by FindMyMobile.
    • Restrict biometric attempts to 10 for better security. SFR ID: FMT_MOF_EXT.1.2 #47'
  impact: ''
  references: []
  page_start: 59
