- id: '1.138'
  title: SOL-11.1-050460
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must terminate all sessions and network connections when nonlocal maintenance is completed.
    GROUP ID: V-216399 RULE ID: SV-216399r986416'
  rationale: Nonlocal maintenance and diagnostic activities are those activities conducted by individuals communicating through
    a network, either an external network (e.g., the internet) or an internal network. The operating system needs to ensure
    all sessions and network connections are terminated when nonlocal maintenance is completed.
  impact: ''
  references: []
  page_start: 252
  audit_raw: 'Determine if SSH is configured to disconnect sessions after 10 minutes of inactivity.

    # grep ClientAlive /etc/ssh/sshd_config

    If the output of this command is not the following, this is a finding.

    ClientAliveInterval 600

    ClientAliveCountMax 0'
  remediation: 'The root role is required.

    Configure the system to disconnect SSH sessions after 10 minutes of inactivity.

    # pfedit /etc/ssh/sshd_config

    Insert the two lines:

    ClientAliveInterval 600

    ClientAliveCountMax 0

    Restart the SSH service with the new configuration.

    # svcadm restart svc:/network/ssh'
