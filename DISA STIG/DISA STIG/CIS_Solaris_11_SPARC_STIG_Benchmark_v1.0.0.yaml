- id: '1.116'
  title: SOL-11.1-040490
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must prevent remote devices that have established a non-remote connection with the system
    from communicating outside of the communication path with resources in external networks. GROUP ID: V-216366 RULE ID:
    SV-216366r959010'
  rationale: This control enhancement is implemented within the remote device (e.g., notebook/laptop computer) via configuration
    settings not configurable by the user of the device. An example of a non-remote communications path from a remote device
    is a virtual private network. When a non-remote connection is established using a virtual private network, the configuration
    settings prevent split-tunneling. Split-tunneling might otherwise be used by remote users to communicate with the information
    system as an extension of the system and to communicate with local resources, such as a printer or file server. The remote
    device, when connected by a non-remote connection, becomes an extension of the information system allowing dual communications
    paths, such as split-tunneling, in effect allowing unauthorized external connections into the system. This is a split-tunneling
    requirement that can be controlled via the operating system by disabling interfaces.
  impact: ''
  references: []
  page_start: 218
  audit_raw: 'Determine if the "RestrictOutbound" profile is configured properly:

    # profiles -p RestrictOutbound info

    If the output is not:

    name=RestrictOutbound

    desc=Restrict Outbound Connections

    limitpriv=zone,!net_access

    this is a finding.

    For users who are not allowed external network access, determine if a user is

    configured with the "RestrictOutbound" profile.

    # profiles -l [username]

    If the output does not include:

    [username]:

    RestrictOutbound

    this is a finding.'
  remediation: 'The root Role is required.

    Remove net_access privilege from users who may be accessing the systems externally.

    1. Create an RBAC Profile with net_access restriction

    # profiles -p RestrictOutbound

    profiles:RestrictOutbound> set desc="Restrict Outbound Connections"

    profiles:RestrictOutbound> set limitpriv=zone,!net_access

    profiles:RestrictOutbound> exit

    2. Assign the RBAC Profile to a user

    # usermod -P +RestrictOutbound [username]

    This prevents the user from initiating any outbound network connections.'
  checks:
  - type: manual_review
    info: 'Determine if the "RestrictOutbound" profile is configured properly:

      # profiles -p RestrictOutbound info

      If the output is not:

      name=RestrictOutbound

      desc=Restrict Outbound Connections

      limitpriv=zone,!net_access

      this is a finding.

      For users who are not allowed external network access, determine if a user is

      configured with the "RestrictOutbound" profile.

      # profiles -l [username]

      If the output does not include:

      [username]:

      RestrictOutbound

      this is a finding.'
    severity: medium
- id: '1.117'
  title: SOL-11.1-040500
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The operating system must limit the number of concurrent sessions for each account to an organization-defined
    number of sessions. GROUP ID: V-216367 RULE ID: SV-216367r958398'
  rationale: Limiting the number of allowed users and sessions per user can limit risks related to denial of service attacks.
    The organization may define the maximum number of concurrent sessions for an information system account globally, by account
    type, by account, or by a combination thereof. This requirement addresses concurrent sessions for a single information
    system account and does not address concurrent sessions by a single user via multiple accounts.
  impact: ''
  references: []
  page_start: 220
  audit_raw: 'Identify the organizational requirements for maximum number of sessions and which

    users must be restricted. If there are no requirements to limit concurrent sessions, this

    item does not apply.

    For each user requiring concurrent session restrictions, determine if that user is in the

    user.[username] project where [username] is the user''s account username.

    # projects [username] | grep user

    If the output does not include the project user.[username], this is a finding.

    Determine the project membership for the user.

    # projects [username]

    If the user is a member of any project other than default, group.[groupname], or

    user.[username], this is a finding.

    Determine whether the max-tasks resource control is enabled properly.

    # projects -l user.[username] | grep attribs

    If the output does not include the text:

    attribs: project.max-tasks=(privileged,[MAX],deny)

    where [MAX] is the organization-defined maximum number of concurrent sessions, this

    is a finding.'
  remediation: 'Identify the organizational requirements for maximum number of sessions and which

    users must be restricted. If there are no requirements to limit concurrent sessions, this

    item does not apply.

    The Project Management profile is required.

    For each user requiring concurrent session restrictions, add the user to the special

    user.[username] project where [username] is the user''s account username where [MAX]

    is equal to the organizational requirement.

    # pfexec projadd -K ''project.max-tasks=(privileged,[MAX],deny)''

    user.[username]

    Determine the project membership for the user.

    # projects [username]

    If the user is a member of any projects other than default, group.[groupname], or

    user.[username], remove that project from the user''s account.

