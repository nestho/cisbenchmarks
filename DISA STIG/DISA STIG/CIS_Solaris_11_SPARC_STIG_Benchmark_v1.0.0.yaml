- id: '1.110'
  title: SOL-11.1-040420
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Unauthorized use of the at or cron capabilities must not be permitted. GROUP ID: V-216360 RULE ID: SV-216360r959010'
  rationale: On many systems, only the system administrator needs the ability to schedule jobs. Even though a given user is
    not listed in the "cron.allow" file, cron jobs can still be run as that user. The "cron.allow" file only controls administrative
    access to the "crontab" command for scheduling and modifying cron jobs. Much more effective access controls for the cron
    system can be obtained by using Role-Based Access Controls (RBAC).
  impact: ''
  references: []
  page_start: 207
  audit_raw: 'Check that "at" and "cron" users are configured correctly.

    # ls /etc/cron.d/cron.deny

    If cron.deny exists, this is a finding.

    # ls /etc/cron.d/at.deny

    If at.deny exists, this is a finding.

    # cat /etc/cron.d/cron.allow

    cron.allow should have a single entry for "root", or the cron.allow file is removed if using

    RBAC.

    If any accounts other than root that are listed and they are not properly documented

    with the IA staff, this is a finding.

    # wc -l /etc/cron.d/at.allow | awk ''{ print $1 }''

    If the output is non-zero, this is a finding, or the at.allow file is removed if using RBAC.'
  remediation: 'The root role is required.

