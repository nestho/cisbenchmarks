- id: '1.113'
  title: SOL-11.1-040460
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must provide the capability for users to directly initiate session lock mechanisms. GROUP
    ID: V-216363 RULE ID: SV-216363r1016279'
  rationale: A session lock is a temporary action taken when a user stops work and moves away from the immediate physical
    vicinity of the system but does not want to log out because of the temporary nature of the absence. Rather than be forced
    to wait for a period of time to expire before the user session can be locked, the operating system needs to provide users
    with the ability to manually invoke a session lock so users may secure their account should the need arise for them to
    temporarily vacate the immediate physical vicinity.
  impact: ''
  references: []
  page_start: 213
  audit_raw: 'Determine whether the lock screen function works correctly.

