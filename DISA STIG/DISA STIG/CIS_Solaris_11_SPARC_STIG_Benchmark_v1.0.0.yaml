- id: '1.13'
  title: SOL-11.1-010220
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The audit system must be configured to audit file deletions. GROUP ID: V-216258 RULE ID: SV-216258r959010'
  rationale: Without auditing, malicious activity cannot be detected.
  impact: ''
  references: []
  page_start: 38
  audit_raw: 'The Audit Configuration profile is required.

    This check applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global", this check applies.

    Determine the OS version you are currently securing.

    # uname –v

    For Solaris 11, 11.1, 11.2, and 11.3:

    # pfexec auditconfig -getflags | grep active |cut -f2 -d=

    If "fd" audit flag is not included in output, this is a finding.

    For Solaris 11.4 or newer:

    # pfexec auditconfig -t -getflags | cut -f2 -d=

    If "fd" audit flag is not included in output, this is a finding.

    Determine if auditing policy is set to collect command line arguments.

    # pfexec auditconfig -getpolicy | grep active | grep argv

    If the active audit policies line does not appear, this is a finding.'
  remediation: 'The Audit Configuration profile is required. All audit flags must be enabled in a single

    command.

    This action applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global", this action applies.

    For Solaris 11, 11.1, 11.2, and 11.3:

    # pfexec auditconfig -setflags cusa,-ps,fd,-fa,fm

    For Solaris 11.4 or newer:

    # pfexec auditconfig -setflags cusa,-fa,-ex,-ps,fd,fm

    Enable the audit policy to collect command line arguments.

    # pfexec auditconfig -setpolicy +argv

    These changes will not affect users that are currently logged in.'
  checks:
  - type: command
    command: '# pfexec auditconfig -getflags | grep active |cut -f2 -d= && # pfexec auditconfig -getpolicy | grep active |
      grep argv'
    expected: ''
    severity: medium
    info: 'The Audit Configuration profile is required.

      This check applies to the global zone only. Determine the zone that you are currently

      securing.

      # zonename

      If the command output is "global", this check applies.

      Determine the OS version you are currently securing.

