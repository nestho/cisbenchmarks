- id: '1.139'
  title: SOL-11.1-050470
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must prevent internal users from sending out packets which attempt to manipulate or spoof
    invalid IP addresses. GROUP ID: V-216400 RULE ID: SV-216400r959010'
  rationale: Manipulation of IP addresses can allow untrusted systems to appear as trusted hosts, bypassing firewall and other
    security mechanism and resulting in system penetration.
  impact: ''
  references: []
  page_start: 254
  audit_raw: "Determine the zone that you are currently securing.\n# zonename\nIf the command output is \"global\", then only\
    \ the \"phys\" and \"SR-IOV\" interfaces\nassigned to the global zone require inspection. If using a non-Global zone,\
    \ then all\n\"phys\" and \"SR-IOV\" interfaces assigned to the zone require inspection.\nIdentify if this system has physical\
    \ interfaces.\n# dladm show-link -Z | grep -v vnic\nLINK ZONE CLASS MTU STATE OVER\nnet0 global phys 1500 unknown --\n\
    e1000g0 global phys 1500 up --\ne1000g1 global phys 1500 up --\nzoneD/net2 zoneD iptun 65515 up --\nIf \"phys\" appears\
    \ in the third column, then the interface is physical.\nFor each physical interface, determine if the network interface\
    \ is Ethernet or InfiniBand:\n# dladm show-phys [interface name]\nLINK MEDIA STATE SPEED DUPLEX DEVICE\n[name] Ethernet\
    \ unknown 0 half dnet0\nThe second column indicates either \"Ethernet\" or \"Infiniband\".\nFor each physical interface,\
    \ determine if the host is using ip-forwarding:\n# ipadm show-ifprop [interface name] | grep forwarding\n[name] forwarding\
    \ ipv4 rw off -- off\non,off\n[name] forwarding ipv6 rw off -- off\non,off\nIf \"on\" appears in the fifth column, then\
    \ the interface is using ip-forwarding.\nFor each interface, determine if the host is using SR-IOV’s Virtual Function\
    \ (VF) driver:\n# dladm show-phys [interface name] | grep vf\nIf the sixth column includes 'vf' in its name, it is using\
    \ SR-IOV (ex: ixgbevf0).\nFor each physical and SR-IOV interface, determine if network link protection capabilities\n\
    are enabled.\n# dladm show-linkprop -p protection\nLINK PROPERTY PERM VALUE DEFAULT POSSIBLE\nnet0 protection rw mac-nospoof,\
    \ -- mac-nospoof,\n restricted, restricted,\n ip-nospoof, ip-nospoof,\n dhcp-nospoof dhcp-nospoof\nIf the interface uses\
    \ Infiniband and if restricted, ip-nospoof, and dhcp-nospoof do not\nappear in the \"VALUE\" column, this is a finding.\n\
    If the interface uses ip-forwarding and if mac-nospoof, restricted, and dhcp-nospoof do\nnot appear in the \"VALUE\" column,\
    \ this is a finding.\nIf the interface uses SR-IOV and if mac-nospoof, restricted, and dhcp-nospoof do not\nappear in\
    \ the \"VALUE\" column, this is a finding.\nIf the interface uses Ethernet without IP forwarding and if mac-nospoof, restricted,\
    \ ipnospoof, and dhcp-nospoof do not appear in the \"VALUE\" column, this is a finding."
  remediation: 'Determine the name of the zone that you are currently securing.

    # zonename

    If the command output is "global", then only the "phys" and "SR-IOV" interfaces

    assigned to the global zone require configuration. If using a non-Global zone, then all

    "phys" and "SR-IOV" interfaces assigned to the zone require configuration.

    The Network Link Security profile is required.

    Determine which network interfaces are available and what protection modes are

    enabled and required.

    Enable link protection based on each configured network interface type.

    For InfiniBand:

    # pfexec dladm set-linkprop -p protection=restricted,ip-nospoof,dhcp-nospoof

    [interface name]

    For IP forwarding:

    # pfexec dladm set-linkprop -p protection=mac-nospoof,restricted,dhcp-nospoof

    [interface name]

    For SR-IOV:

    # pfexec dladm set-linkprop -p protection=mac-nospoof,restricted,dhcp-nospoof

    [interface name]

    For Ethernet without IP forwarding:

    # pfexec dladm set-linkprop -p protection=mac-nospoof,restricted,ipnospoof,dhcp-nospoof [interface name]'
  checks:
  - type: command
    command: '# dladm show-link -Z | grep -v vnic && # ipadm show-ifprop [interface name] | grep forwarding && # dladm show-phys
      [interface name] | grep vf'
    expected: ''
    severity: medium
    info: 'Determine the zone that you are currently securing.

      # zonename

      If the command output is "global", then only the "phys" and "SR-IOV" interfaces

      assigned to the global zone require inspection. If using a non-Global zone, then all

      "phys" and "SR-IOV" interfaces assigned to the zone require inspection.

      Identify if this system has physical interfaces.

      # dladm show-link -Z | grep -v vnic

      LINK ZONE CLASS'
- id: '1.140'
  title: SOL-11.1-050480
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Wireless network adapters must be disabled. GROUP ID: V-216401 RULE ID: SV-216401r958358'
  rationale: The use of wireless networking can introduce many different attack vectors into the organization’s network. Common
    attack vectors such as malicious association and ad hoc networks will allow an attacker to spoof a wireless access point
    (AP), allowing validated systems to connect to the malicious AP and enabling the attacker to monitor and record network
    traffic. These malicious APs can also serve to create a man-in-themiddle attack or be used to create a denial-of-service
    to valid network resources.
  impact: ''
  references: []
  page_start: 257
  audit_raw: "This is N/A for systems that do not have wireless network adapters.\nVerify that there are no wireless interfaces\
    \ configured on the system:\n# ifconfig -a\neth0 Link encap:Ethernet HWaddr b8:ac:6f:65:31:e5\n inet addr:192.168.2.100\
    \ Bcast:192.168.2.255 Mask:255.255.255.0\n inet6 addr: fe80::baac:6fff:fe65:31e5/64 Scope:Link\n UP BROADCAST RUNNING\
    \ MULTICAST MTU:1500 Metric:1\n RX packets:2697529 errors:0 dropped:0 overruns:0 frame:0\n TX packets:2630541 errors:0\
    \ dropped:0 overruns:0 carrier:0\n collisions:0 txqueuelen:1000\n RX bytes:2159382827 (2.0 GiB) TX bytes:1389552776 (1.2\
    \ GiB)\n Interrupt:17\nlo Link encap:Local Loopback\n inet addr:127.0.0.1 Mask:255.0.0.0\n inet6 addr: ::1/128 Scope:Host\n\
    \ UP LOOPBACK RUNNING MTU:16436 Metric:1\n RX packets:2849 errors:0 dropped:0 overruns:0 frame:0\n TX packets:2849 errors:0\
    \ dropped:0 overruns:0 carrier:0\n collisions:0 txqueuelen:0\n RX bytes:2778290 (2.6 MiB) TX bytes:2778290 (2.6 MiB)\n\
    If a wireless interface is configured, it must be documented and approved by the local\nAuthorizing Official.\nIf a wireless\
    \ interface is configured and has not been documented and approved, this is\na finding."
  remediation: Configure the system to disable all wireless network interfaces.
  checks:
  - type: manual_review
    info: "This is N/A for systems that do not have wireless network adapters.\nVerify that there are no wireless interfaces\
      \ configured on the system:\n# ifconfig -a\neth0 Link encap:Ethernet HWaddr b8:ac:6f:65:31:e5\n inet addr:192.168.2.100\
      \ Bcast:192.168.2.255 Mask:255.255.255.0\n inet6 addr: fe80::baac:6fff:fe65:31e5/64 Scope:Link\n UP BROADCAST RUNNING\
      \ MULTICAST MTU:1500 Metric:1\n RX packets:2697529 errors:0 dropped:0 overruns:0 frame:0\n TX packets:2630541 errors:0\
      \ dropped:0 overruns:0 carrier:0\n collisions:"
    severity: medium
- id: '1.141'
  title: SOL-11.1-060010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must use mechanisms for authentication to a cryptographic module meeting the requirements
    of applicable federal laws, Executive orders, directives, policies, regulations, standards, and guidance for such authentication.
    GROUP ID: V-216402 RULE ID: SV-216402r958358'
  rationale: 'Encryption is only as good as the encryption modules utilized. Unapproved cryptographic module algorithms cannot
    be verified, and cannot be relied upon to provide confidentiality or integrity, and DoD data may be compromised due to
    weak algorithms. Applications utilizing encryption are required to use approved encryption modules meeting the requirements
    of applicable federal laws, Executive orders, directives, policies, regulations, standards, and guidance. FIPS 140-2 is
    the current standard for validating cryptographic modules, and NSA TypeX (where X=1, 2, 3, 4) products are NSA-certified
    hardware based encryption modules. Satisfies: SRG-OS-000120, SRG-OS-000169'
  impact: ''
  references: []
  page_start: 260
  audit_raw: 'This check applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global", this check applies.

    The Crypto Management profile is required to execute this command.

    Check to ensure that FIPS-140 encryption mode is enabled.

    # cryptoadm list fips-140| grep -c "is disabled"

    If the output of this command is not "0", this is a finding.'
  remediation: 'The Crypto Management profile is required to execute this command.

    This action applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global", this action applies.

    Enable FIPS-140 mode.

    # pfexec cryptoadm enable fips-140

    Reboot the system as requested.'
  checks:
  - type: command
    command: '# cryptoadm list fips-140| grep -c "is disabled"'
    expected: ''
    severity: medium
    info: 'This check applies to the global zone only. Determine the zone that you are currently

      securing.

      # zonename

      If the command output is "global", this check applies.

      The Crypto Management profile is required to execute this command.

      Check to ensure that FIPS-140 encryption mode is enabled.

      # cryptoadm list fips-140| grep -c "is disabled"

      If the output of this command is not "0", this is a finding.'
