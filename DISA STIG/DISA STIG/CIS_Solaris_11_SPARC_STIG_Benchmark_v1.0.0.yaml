    greatly reduces the risk that accounts will be hijacked, leading to a data compromise. This policy does not apply to either
    emergency accounts or infrequently used accounts. Infrequently used accounts are local logon accounts used by system administrators
    when network or normal logon/access is not available. Emergency accounts are administrator accounts created in response
    to crisis situations. Satisfies: SRG-OS-000003, SRG-OS-000118'
