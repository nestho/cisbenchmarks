- id: '1.149'
  title: SOL-11.1-060130
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must implement DoD-approved encryption to protect the confidentiality of remote access
    sessions. GROUP ID: V-216410 RULE ID: SV-216410r958408'
  rationale: 'Remote access is any access to an organizational information system by a user (or an information system) communicating
    through an external, non-organization-controlled network (e.g., the Internet). Examples of remote access methods include
    dial-up, broadband, and wireless. Using cryptography ensures confidentiality of the remote access connections. The system
    will attempt to use the first cipher presented by the client that matches the server list. Listing the values "strongest
    to weakest" is a method to ensure the use of the strongest cipher available to secure the SSH connection. Note: SSH in
    Solaris 11.GA-11.3 used Sun Microsystem’s proprietary SUNWssh. In Solaris 11.3 OpenSSH was offered as optional software
    and in Solaris 11.4 OpenSSH is the only SSH offered. Both use the same /etc/ssh/sshd_config file and both, by default
    do not include the ciphers line.'
  impact: ''
  references: []
  page_start: 270
  audit_raw: 'Check the SSH daemon configuration for allowed ciphers.

    # grep -i ciphers /etc/ssh/sshd_config | grep -v ''^#’

    Ciphers aes256-ctr,aes192-ctr,aes128-ctr

    If any ciphers other than "aes256-ctr", "aes192-ctr", or "aes128-ctr" are listed, the order

    differs from the example above, the "Ciphers" keyword is missing, or is commented out,

    this is a finding.'
  remediation: 'The root role is required.

    Modify the sshd_config file.

    # pfedit /etc/ssh/sshd_config

    Change or set the ciphers line to the following:

    ciphers aes256-ctr,aes192-ctr,aes128-ctr

    Restart the SSH service.

    # svcadm restart svc:/network/ssh'
  checks:
  - type: command
    command: '# grep -i ciphers /etc/ssh/sshd_config | grep -v ''^#’'
    expected: ''
    severity: medium
    info: 'Check the SSH daemon configuration for allowed ciphers.

      # grep -i ciphers /etc/ssh/sshd_config | grep -v ''^#’

      Ciphers aes256-ctr,aes192-ctr,aes128-ctr

      If any ciphers other than "aes256-ctr", "aes192-ctr", or "aes128-ctr" are listed, the order

      differs from the example above, the "Ciphers" keyword is missing, or is commented out,

      this is a finding.'
- id: '1.150'
  title: SOL-11.1-060140
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must use cryptographic mechanisms to protect and restrict access to information on portable
    digital media. GROUP ID: V-216411 RULE ID: SV-216411r959010'
  rationale: When data is written to portable digital media, such as thumb drives, floppy diskettes, compact disks, and magnetic
    tape, etc., there is risk of data loss. An organizational assessment of risk guides the selection of media and associated
    information contained on the media requiring restricted access. Organizations need to document in policy and procedures
    the media requiring restricted access, individuals authorized to access the media, and the specific measures taken to
    restrict access. Fewer protection measures are needed for media containing information determined by the organization
    to be in the public domain, to be publicly releasable, or to have limited or no adverse impact if accessed by other than
    authorized personnel. In these situations, it is assumed the physical access controls where the media resides provide
    adequate protection. The employment of cryptography is at the discretion of the information owner/steward. When the organization
    has determined the risk warrants it, data written to portable digital media must be encrypted.
  impact: ''
  references: []
  page_start: 272
  audit_raw: 'This check applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global", this check applies.

    Determine the logical node of all attached removable media:

    # rmformat

    This command lists all attached removable devices. Note the device logical node name.

    For example: /dev/rdsk/c8t0d0p0

    Determine which zpool is mapped to the device:

    # zpool status

    Determine the file system names of the portable digital media:

    # zfs list | grep [poolname]

    Using the file system name, determine if the removal media is encrypted:

    # zfs get encryption [filesystem]

    If "encryption off" is listed, this is a finding.'
  remediation: 'The root role is required.

    Format a removable device as a ZFS encrypted file system.

    This action applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global", this action applies.

    The ZFS File System Management and ZFS Storage management profiles are required.

    Insert the removable device:

    # rmformat

    This command lists all attached removable devices. Note the device logical node name.

    For example: /dev/rdsk/c8t0d0p0

    Create an encrypted zpool on this device using a poolname of your choice:

    # pfexec zpool create -O encryption=on [poolname] c8t0d0p0

    Enter a passphrase and confirm the passphrase. Keep the passphrase secure.

    Export the zpool before removing the media:

    # pfexec export [poolname]

    It will be necessary to enter the passphrase when inserting and importing the removable

    media zpool:

    Insert the removable media

    # pfexec import [poolname]

    Only store data in the encrypted file system.'
  checks:
  - type: command
    command: '# zfs list | grep [poolname]'
    expected: ''
    severity: medium
    info: 'This check applies to the global zone only. Determine the zone that you are currently

      securing.

      # zonename

      If the command output is "global", this check applies.

      Determine the logical node of all attached removable media:

      # rmformat

      This command lists all attached removable devices. Note the device logical node name.

      For example: /dev/rdsk/c8t0d0p0

      Determine which zpool is mapped to the device:

      # '
- id: '1.151'
  title: SOL-11.1-060150
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The operating system must employ cryptographic mechanisms to protect information in storage. GROUP ID: V-219982
    RULE ID: SV-219982r958870'
  rationale: When data is written to digital media, such as hard drives, mobile computers, external/removable hard drives,
    personal digital assistants, flash/thumb drives, etc., there is risk of data loss and data compromise. An organizational
    assessment of risk guides the selection of media and associated information contained on the media requiring restricted
    access. Organizations need to document in policy and procedures the media requiring restricted access, individuals authorized
    to access the media, and the specific measures taken to restrict access. Fewer protection measures are needed for media
    containing information determined by the organization to be in the public domain, to be publicly releasable, or to have
    limited or no adverse impact if accessed by other than authorized personnel. In these situations, it is assumed the physical
    access controls where the media resides provide adequate protection. As part of a defense-in-depth strategy, the organization
    considers routinely encrypting information at rest on selected secondary storage devices. The employment of cryptography
    is at the discretion of the information owner/steward. The selection of the cryptographic mechanisms used is based upon
    maintaining the confidentiality and integrity of the information.
  impact: ''
  references: []
  page_start: 274
  audit_raw: 'Determine if file system encryption is required by your organization. If not required, this

    item does not apply.

    Determine if file system encryption is enabled for user data sets. This check does not

    apply to the root, var, share, swap or dump datasets.

    # zfs list

    Using the file system name, determine if the file system is encrypted:

    # zfs get encryption [filesystem]

    If "encryption off" is listed, this is a finding.'
  remediation: 'The ZFS file system management profile is required.

    ZFS file system encryption may only be enabled on creation of the file system. If a file

    system must be encrypted and is not, its data should be archived, it must be removed

    and re-created.

    First, stop running applications using the file systems, archive the data, unmount, and

    then remove the file system.

    # umount [file system name]

    # zfs destroy [file system name]

    When creating ZFS file systems, ensure that they are created as encrypted file systems.

    # pfexec zfs create -o encryption=on [file system name]

    Enter passphrase for ''[file system name]'': xxxxxxx

    Enter again: xxxxxxx

    Store the passphrase in a safe location. The passphrase will be required to mount the

    file systems upon system reboot. If automated mounting is required, the passphrase

    must be stored in a file.'
  checks:
  - type: manual_review
    info: 'Determine if file system encryption is required by your organization. If not required, this

      item does not apply.

      Determine if file system encryption is enabled for user data sets. This check does not

      apply to the root, var, share, swap or dump datasets.

      # zfs list

      Using the file system name, determine if the file system is encrypted:

      # zfs get encryption [filesystem]

      If "encryption off" is listed, this is a finding.'
    severity: medium
