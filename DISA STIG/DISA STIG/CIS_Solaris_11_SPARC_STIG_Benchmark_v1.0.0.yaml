- id: '1.73'
  title: SOL-11.1-040010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'User passwords must be changed at least every 60 days. GROUP ID: V-216321 RULE ID: SV-216321r1038967'
  rationale: Limiting the lifespan of authenticators limits the period of time an unauthorized user has access to the system
    while using compromised credentials and reduces the period of time available for password-guessing attacks to run against
    a single password. Solaris 11.4 introduced new password security features that allow for a more granular approach to password
    duration parameters. The introduction of MAXDAYS, MINDAYS, and WARNDAYS allow the /etc/default/passwd configuration file
    to enforce a password change every 60 days.
  impact: ''
  references: []
  page_start: 136
  audit_raw: 'The root role is required.

    Determine if user passwords are properly configured to be changed every 60 days.

    Determine the OS version to be secured.

    # uname -v

    For Solaris 11, 11.1, 11.2, and 11.3:

    # logins -ox |awk -F: ''( $1 != "root" && $8 != "LK" && $8 != "NL" && ( $11 >

    “56" || $11 < “1" )) { print }''

    If output is returned and the listed account is accessed via direct logon, this is a finding.

    Check that /etc/default/password is configured to enforce password expiration every

    eight weeks or less.

    # grep "^MAXWEEKS=" /etc/default/passwd

    If the command does not report MAXWEEKS=8 or less, this is a finding.

    For Solaris 11.4 or newer:

    # logins -ox |awk -F: ''( $1 != "root" && $8 != "LK" && $8 != "NL" && ($11 >

    "60"|| $11 < "1")) { print }''

    If output is returned and the listed account is accessed via direct logon, this is a finding.

    Check that /etc/default/password is configured to enforce password expiration every 60

    days or less.

    Note: It is an error to set both the WEEKS and the DAYS variant for a given

    MIN/MAX/WARN variable.

    # grep "^MAXDAYS=" /etc/default/passwd

    If the command does not report MAXDAYS=60 or less, this is a finding.

    # grep "^MAXWEEKS=" /etc/default/passwd

    If output is returned, this is a finding.'
  remediation: 'The User Security role is required.

    For Solaris 11, 11.1, 11.2, and 11.3:

    Change each username to enforce 56 day password changes.

    # pfexec passwd -x 56 [username]

    # pfedit /etc/default/passwd

    Search for MAXWEEKS. Change the line to read:

    MAXWEEKS=8

    For Solaris 11.4 or newer:

    Change each username to enforce 60 day password changes.

    # pfexec passwd -x 60 [username]

    # pfedit /etc/default/passwd

    Note: It is an error to set both the WEEKS and the DAYS variant for a given

    MIN/MAX/WARN variable.

    Search for MAXDAYS. Change the line to read:

    MAXDAYS=60

    Search for MAXWEEKS. Change the line to read:

    #MAXWEEKS='
  checks:
  - type: manual_review
    info: 'The root role is required.

      Determine if user passwords are properly configured to be changed every 60 days.

      Determine the OS version to be secured.

      # uname -v

      For Solaris 11, 11.1, 11.2, and 11.3:

      # logins -ox |awk -F: ''( $1 != "root" && $8 != "LK" && $8 != "NL" && ( $11 >

      “56" || $11 < “1" )) { print }''

      If output is returned and the listed account is accessed via direct logon, this is a finding.

      Check that /etc/default/password is configured to enforce password expiration every

      eight weeks or l'
    severity: medium
- id: '1.74'
  title: SOL-11.1-040020
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The operating system must automatically terminate temporary accounts within 72 hours. GROUP ID: V-216322 RULE
    ID: SV-216322r958364'
  rationale: If temporary user accounts remain active when no longer needed or for an excessive period, these accounts may
    be used to gain unauthorized access. To mitigate this risk, automated termination of all temporary accounts must be set
    upon account creation. Temporary accounts are established as part of normal account activation procedures when there is
    a need for short-term accounts without the demand for immediacy in account activation. If temporary accounts are used,
    the operating system must be configured to automatically terminate these types of accounts after a DoD-defined time period
    of 72 hours. When temporary and emergency accounts are created, there is a risk the temporary account may remain in place
    and active after the need for the account no longer exists. To address this, in the event temporary accounts are required,
    accounts designated as temporary in nature must be automatically terminated after 72 hours. Such a process and capability
    greatly reduces the risk of accounts being misused, hijacked, or data compromised.
  impact: ''
  references: []
  page_start: 139
  audit_raw: 'The root role is required.

    Determine if an expiration date is set for temporary accounts.

    # logins -aox |awk -F: ''($14 == "0") {print}''

    This command produces a list of accounts with no expiration date set. If any of these

    accounts are temporary accounts, this is a finding.

    # logins -aox |awk -F: ''($14 != "0") {print}''

    This command produces a list of accounts with an expiration date set as defined in the

    last field. If any accounts have a date that is not within 72 hours, this is a finding.'
  remediation: 'The User Security role is required.

    Apply an expiration date to temporary users.

    # pfexec usermod -e "[date]" [username]

    Enter the date in the form mm/dd/yyyy such that it is within 72 hours.'
  checks:
  - type: manual_review
    info: 'The root role is required.

      Determine if an expiration date is set for temporary accounts.

      # logins -aox |awk -F: ''($14 == "0") {print}''

      This command produces a list of accounts with no expiration date set. If any of these

      accounts are temporary accounts, this is a finding.

      # logins -aox |awk -F: ''($14 != "0") {print}''

      This command produces a list of accounts with an expiration date set as defined in the

      last field. If any accounts have a date that is not within 72 hours, this is a finding.'
    severity: medium
- id: '1.75'
  title: SOL-11.1-040030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must enforce minimum password lifetime restrictions. GROUP ID: V-216323 RULE ID: SV-216323r1016269'
  rationale: Passwords need to be changed at specific policy-based intervals; however, if the information system or application
    allows the user to immediately and continually change their password, then the password could be repeatedly changed in
    a short period of time, defeating the organization's policy regarding password reuse. Solaris 11.4 introduced new password
    security features that allow for a more granular approach to password duration parameters. The introduction of MAXDAYS,
    MINDAYS, and WARNDAYS allow the /etc/default/passwd configuration file to enforce a minimum password lifetime of a single
    day.
  impact: ''
  references: []
  page_start: 141
  audit_raw: 'The root role is required.

    Check whether the minimum time period between password changes for each user

    account is 1 day or greater.

    Determine the OS version to be secured.

    # uname -v

    For Solaris 11, 11.1, 11.2, and 11.3:

    # logins -ox |awk -F: ''( $1 != "root" && $8 != "LK" && $8 != "NL" && $10 <

    "1" ) { print }''

    If output is returned and the listed account is accessed via direct logon, this is a finding.

    Check that /etc/default/password is configured to minimum password change time of

    one week.

    # grep "^MINWEEKS=" /etc/default/passwd

    If the command does not report MINWEEKS=1 or more, this is a finding.

    For Solaris 11.4 or newer:

    # logins -ox |awk -F: ''( $1 != "root" && $8 != "LK" && $8 != "NL" && $10 <

    "1" ) { print }''

    If output is returned and the listed account is accessed via direct logon, this is a finding.

    Check that /etc/default/password is configured to minimum password change time of 1

    day.

    Note: It is an error to set both the WEEKS and the DAYS variant for a given

    MIN/MAX/WARN variable.

    # grep "^MINDAYS=" /etc/default/passwd

    If the command does not report MINDAYS=1 or more, this is a finding.

    # grep "^MINWEEKS=" /etc/default/passwd

    If output is returned, this is a finding.'
  remediation: 'The root role is required.

    For Solaris 11, 11.1, 11.2, and 11.3:

    # pfedit /etc/default/passwd file.

    Locate the line containing:

    MINWEEKS

    Change the line to read:

    MINWEEKS=1

    Set the per-user minimum password change times by using the following command on

    each user account.

    # passwd -n [number of days] [accountname]

    For Solaris 11.4 or newer:

    # pfedit /etc/default/passwd file.

    Note: It is an error to set both the WEEKS and the DAYS variant for a given

    MIN/MAX/WARN variable.

    Search for MINDAYS. Change the line to read:

    MINDAYS=1

    Search for MINWEEKS. Change the line to read:

    #MINWEEKS=

    Set the per-user minimum password change times by using the following command on

    each user account.

    # passwd -n [number of days] [accountname]'
  checks:
  - type: manual_review
    info: 'The root role is required.

      Check whether the minimum time period between password changes for each user

      account is 1 day or greater.

      Determine the OS version to be secured.

      # uname -v

      For Solaris 11, 11.1, 11.2, and 11.3:

      # logins -ox |awk -F: ''( $1 != "root" && $8 != "LK" && $8 != "NL" && $10 <

      "1" ) { print }''

      If output is returned and the listed account is accessed via direct logon, this is a finding.

      Check that /etc/default/password is configured to minimum password change time of

      one week.

      '
    severity: medium
- id: '1.76'
  title: SOL-11.1-040040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'User passwords must be at least 15 characters in length. GROUP ID: V-216324 RULE ID: SV-216324r1016270'
  rationale: Password complexity, or strength, is a measure of the effectiveness of a password in resisting guessing and brute-force
    attacks. Password length is one factor of several that helps to determine strength and how long it takes to crack a password.
    The shorter the password is, the lower the number of possible combinations that need to be tested before the password
    is compromised. Use of more characters in a password helps to exponentially increase the time and/or resources required
    to compromise the password.
  impact: ''
  references: []
  page_start: 144
  audit_raw: 'Check the system password length setting.

    # grep ^PASSLENGTH /etc/default/passwd

    If PASSLENGTH is not set to 15 or more, this is a finding.'
  remediation: 'The root role is required.

    # pfedit /etc/default/passwd

    Locate the line containing:

    PASSLENGTH

    Change the line to read:

    PASSLENGTH=15'
  checks:
  - type: manual_review
    info: 'Check the system password length setting.

