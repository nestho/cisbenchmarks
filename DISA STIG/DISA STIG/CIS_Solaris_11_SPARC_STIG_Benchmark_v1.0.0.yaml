- id: '1.106'
  title: SOL-11.1-040380
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The operating system must terminate the network connection associated with a communications session at the
    end of the session or after 10 minutes of inactivity. GROUP ID: V-216356 RULE ID: SV-216356r970703'
  rationale: This requirement applies to both internal and external networks. Terminating network connections associated with
    communications sessions means deallocating associated TCP/IP address/port pairs at the operating system level. The time
    period of inactivity may, as the organization deems necessary, be a set of time periods by type of network access or for
    specific accesses.
  impact: ''
  references: []
  page_start: 200
  audit_raw: 'Determine if SSH is configured to disconnect sessions after 10 minutes of inactivity.

    # grep ClientAlive /etc/ssh/sshd_config

