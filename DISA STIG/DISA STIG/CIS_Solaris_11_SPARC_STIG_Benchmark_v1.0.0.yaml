- id: '1.211'
  title: SOL-11.1-090280
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must manage excess capacity, bandwidth, or other redundancy to limit the effects of information
    flooding types of denial of service attacks. GROUP ID: V-216473 RULE ID: SV-216473r958528'
  rationale: In the case of denial of service attacks, care must be taken when designing the operating system so as to ensure
    that the operating system makes the best use of system resources.
  impact: ''
  references: []
  page_start: 360
  audit_raw: "Verify that you are on the global zone:\n# zoneadm -z global list\nglobal\nNote: If the following message appears,\
    \ you are not in the global zone:\n\"zoneadm: global: No such zone exists\"\n# dladm show-ether -Z | egrep \"LINK|up\"\
    \nLINK PTYPE STATE AUTO SPEED-DUPLEX PAUSE\nnet0 current up yes 1G-f bi\nDetermine the OS version that is being secured:\n\
    # uname -v\nFor Solaris 11, 11.1, 11.2, and 11.3:\n# dladm show-linkprop net0 | egrep \"LINK|en_\" | sort|uniq\nLINK PROPERTY\
    \ PERM VALUE EFFECTIVE DEFAULT POSSIBLE\nnet0 en_1000fdx_cap rw 1 1 1 1,0\nnet0 en_1000hdx_cap r- 0 0 0 1,0\nnet0 en_100fdx_cap\
    \ rw 1 1 1 1,0\nnet0 en_100hdx_cap rw 1 1 1 1,0\nnet0 en_10fdx_cap rw 1 1 1 1,0\nnet0 en_10gfdx_cap -- -- -- 0 1,0\nnet0\
    \ en_10hdx_cap rw 1 1 1 1,0\nDo the above for all available/connected network adapters.\nFor Solaris 11.4.x.x.x or newer:\n\
    # dladm show-linkprop -p speed-duplex net0\nLINK PROPERTY PERM VALUE EFFECTIVE DEFAULT POSSIBLE\nnet0 speed-duplex rw\
    \ 1g-f,100m-f, 1g-f,100m-f, 1g-f, 1g-f,100mf,\n 100m-h, 100m-h, 100m-f, 100m-h,10mf,\n 10m-f,10m-h 10m-f,10m-h 100m-h,\
    \ 10m-h\n 10m-f,\n 10m-h\nDo the above for all available/connected network adapters.\nFor each link, determine if its\
    \ current speed-duplex settings VALUE field is appropriate\nfor managing any excess bandwidth capacity based on its POSSIBLE\
    \ settings field; if\nnot, this is a finding."
  remediation: "The Network Management profile is required.\nSet each link's speed-duplex protection to an appropriate value\
    \ based on each\nconfigured network interface's POSSIBLE settings.\nDetermine the OS version that is being secured:\n\
    # uname -a\nFor Solaris 11, 11.1, 11.2, and 11.3:\n# pfexec dladm set-linkprop -p en_1000fdx_cap=1 net0\nVerify EFFECTIVE\
    \ column\n# dladm show-linkprop net0 | egrep \"LINK|en_\" | sort|uniq\nLINK PROPERTY PERM VALUE EFFECTIVE DEFAULT POSSIBLE\n\
    net0 en_1000fdx_cap rw 1 1 1 1,0\nnet0 en_1000hdx_cap r- 0 0 0 1,0\nnet0 en_100fdx_cap rw 1 1 1 1,0\nnet0 en_100hdx_cap\
    \ rw 1 1 1 1,0\nnet0 en_10fdx_cap rw 1 1 1 1,0\nnet0 en_10gfdx_cap -- -- -- 0 1,0\nnet0 en_10hdx_cap rw 1 1 1 1,0\nDo\
    \ the above for all available/connected network adapters.\nFor Solaris 11.4.x or newer:\n# pfexec dladm set-linkprop -p\
    \ speed-duplex=1g-f,100m-f net0\nVerify EFFECTIVE column\n# dladm show-linkprop -p speed-duplex net0\nLINK PROPERTY PERM\
    \ VALUE EFFECTIVE DEFAULT POSSIBLE\nnet0 speed-duplex rw 1g-f,100m-f 1g-f,100m-f 1g-f, 1g-f,100mf,\n 100m-f, 100m-h,10mf,\n\
    \ 100m-h, 10m-h\n 10m-f,\n 10m-h\nDo the above for all available/connected network adapters."
  checks:
  - type: manual_review
    info: 'Verify that you are on the global zone:

      # zoneadm -z global list

      global

      Note: If the following message appears, you are not in the global zone:

      "zoneadm: global: No such zone exists"

      # dladm show-ether -Z | egrep "LINK|up"

      LINK PTYPE STATE AUTO SPEED-DUPLEX PAUSE

      net0 current up yes 1G-f bi

      Determine the OS version that is being secured:

      # uname -v

      For Solaris 11, 11.1, 11.2, and 11.3:

      # dladm show-linkprop net0 | egrep "LINK|en_" | sort|uniq

      LINK PROPERTY PERM VALUE EFFECTIVE DEFAULT POSSIBLE

      n'
    severity: medium
- id: '1.212'
  title: SOL-11.1-100010
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The /etc/zones directory, and its contents, must have the vendor default owner, group, and permissions. GROUP
    ID: V-216474 RULE ID: SV-216474r959010'
  rationale: Incorrect ownership can result in unauthorized changes or theft of data.
  impact: ''
  references: []
  page_start: 363
  audit_raw: 'This check applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global", this check applies.

    Check the ownership of the files and directories.

    # pkg verify system/zones

    The command should return no output. If output is produced, this is a finding.'
  remediation: 'This check applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global", this check applies.

    The Software Installation profile is required.

    Change the ownership and permissions of the files and directories to the factory default.

    # pkg fix system/zones'
  checks:
  - type: manual_review
    info: 'This check applies to the global zone only. Determine the zone that you are currently

