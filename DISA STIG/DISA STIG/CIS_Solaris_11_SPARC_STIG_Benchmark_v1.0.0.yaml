- id: '1.199'
  title: SOL-11.1-090040
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The system must not have any unnecessary accounts. GROUP ID: V-216460 RULE ID: SV-216460r959010'
  rationale: Accounts providing no operational purpose provide additional opportunities for system compromise. Unnecessary
    accounts include user accounts for individuals not requiring access to the system and application accounts for applications
    not installed on the system.
  impact: ''
  references: []
  page_start: 346
  audit_raw: 'Check the system for unnecessary user accounts.

    # getent passwd

    Some examples of unnecessary accounts include games, news, gopher, ftp, and lp. If

    any unnecessary accounts are found, this is a finding.'
  remediation: 'The root role is required.

    Remove all unnecessary accounts, such as games, from the /etc/passwd file before

    connecting a system to the network. Other accounts, such as news and gopher,

    associated with a service not in use should also be removed.

    Identify unnecessary accounts.

    # getent passwd

    Remove unnecessary accounts.

    # userdel [username]'
  checks:
  - type: manual_review
    info: 'Check the system for unnecessary user accounts.

      # getent passwd

      Some examples of unnecessary accounts include games, news, gopher, ftp, and lp. If

      any unnecessary accounts are found, this is a finding.'
    severity: medium
- id: '1.200'
  title: SOL-11.1-090050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must conduct backups of user-level information contained in the operating system per
    organization-defined frequency to conduct backups consistent with recovery time and recovery point objectives. GROUP ID:
    V-216461 RULE ID: SV-216461r959010'
  rationale: Operating system backup is a critical step in maintaining data assurance and availability. User-level information
    is data generated by information system and/or application users. Backups shall be consistent with organizational recovery
    time and recovery point objectives.
  impact: ''
  references: []
  page_start: 347
  audit_raw: 'The operations staff shall ensure that proper backups are created, tested, and archived.

    Ask the operator for documentation on the backup procedures implemented.

    If the backup procedures are not documented then this is a finding.'
  remediation: 'The operations staff shall install, configure, test, and verify operating system backup

    software.

    Additionally, all backup procedures must be documented.'
  checks:
