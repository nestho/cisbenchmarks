- id: '1.207'
  title: SOL-11.1-090220
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must back up audit records at least every seven days onto a different system or system
    component than the system or component being audited. GROUP ID: V-216469 RULE ID: SV-216469r958574'
  rationale: Protection of log data includes assuring log data is not accidentally lost or deleted. Backing up audit records
    to a different system or onto separate media than the system being audited on an organizationally defined frequency helps
    to assure in the event of a catastrophic system failure, the audit records will be retained. This helps to ensure a compromise
    of the information system being audited does not also result in a compromise of the audit records. This requirement can
    be met by the operating system continuously sending records to a centralized logging server.
  impact: ''
  references: []
  page_start: 355
  audit_raw: 'This check applies to the global zone only. Determine the zone that you a currently

    securing.

    # zonename

    If the command output is "global" this check applies.

    The operator must back up audit records at least every 7 days.

    If the operator is unable to provide a documented procedure or the documented

    procedure is not being followed, then this is a finding.'
  remediation: 'This fix applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global", this check applies.

    The operator shall back up audit records at least every seven days.'
  checks:
  - type: manual_review
    info: 'This check applies to the global zone only. Determine the zone that you a currently

      securing.

