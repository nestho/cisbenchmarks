  title: SOL-11.1-070010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The sticky bit must be set on all world writable directories. GROUP ID: V-216417 RULE ID: SV-216417r959010'
  rationale: Files in directories that have had the "sticky bit" enabled can only be deleted by users that have both write
