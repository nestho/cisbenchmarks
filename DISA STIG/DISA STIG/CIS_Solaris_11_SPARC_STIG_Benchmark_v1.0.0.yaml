- id: '1.198'
  title: SOL-11.1-090030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Direct logins must not be permitted to shared, default, application, or utility accounts. GROUP ID: V-216459
    RULE ID: SV-216459r959010'
  rationale: Shared accounts (accounts where two or more people log in with the same user identification) do not provide identification
    and authentication. There is no way to provide for non-repudiation or individual accountability.
  impact: ''
  references: []
  page_start: 344
  audit_raw: 'The Audit Review profile is required.

    This check applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global", this check applies.

    Use the "auditreduce" command to check for multiple accesses to an account

    # auditreduce -c lo -u [shared_user_name] | praudit -l

    If users log directly into accounts, rather than using the "su" command from their own

    named account to access them, this is a finding. Also, ask the SA or the IAO if shared

    accounts are logged into directly or if users log into an individual account and switch

    user to the shared account.'
  remediation: 'The root role is required.

    This action applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global", this action applies.

    Use the switch user ("su") command from a named account login to access shared

    accounts. Maintain audit trails that identify the actual user of the account name.

    Document requirements and procedures for users/administrators to log into their own

    accounts first and then switch user ("su") to the shared account.'
  checks:
  - type: manual_review
    info: 'The Audit Review profile is required.

      This check applies to the global zone only. Determine the zone that you are currently

