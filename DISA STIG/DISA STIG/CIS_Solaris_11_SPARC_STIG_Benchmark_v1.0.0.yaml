  title: SOL-11.1-090250
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must verify the correct operation of security functions in accordance with organization-defined
    conditions and in accordance with organizationdefined frequency (if periodic verification). GROUP ID: V-219987 RULE ID:
    SV-219987r958944'
  rationale: Security functional testing involves testing the operating system for conformance to the operating system security
    function specifications, as well as for the underlying security model. The need to verify security functionality applies
    to all security functions. The conformance criteria state the conditions necessary for the operating system to exhibit
    the desired security behavior or satisfy a security property. For example, successful login triggers an audit entry.
  impact: ''
  references: []
