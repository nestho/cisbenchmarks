- id: '1.193'
  title: SOL-11.1-080130
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The system must require passwords to change the boot device settings. (SPARC) GROUP ID: V-216454 RULE ID:
    SV-216454r959010'
  rationale: Setting the EEPROM password helps prevent attackers who gain physical access to the system console from booting
    from an external device (such as a CD-ROM or floppy).
  impact: ''
  references: []
  page_start: 333
  audit_raw: 'This check applies only to SPARC-based systems.

    This check applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global", this check applies.

    Determine if the EEPROM security mode on SPARC-based systems is configured

    correctly.

    # eeprom security-mode

    If the output of this command is not "security-mode=command", this is a finding.'
  remediation: 'The root role is required.

    This action applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global", this action applies.

    # eeprom security-mode=command

    After entering the command above, the administrator will be prompted for a password.

    This password will be required to authorize any future command issued at boot-level on

    the system (the ok or > prompt) except for the normal multi-user boot command (i.e.,

    the system will be able to reboot unattended).

    Write down the password and store it in a secure location.'
  checks:
  - type: manual_review
    info: 'This check applies only to SPARC-based systems.

      This check applies to the global zone only. Determine the zone that you are currently

      securing.

