- id: '1.215'
  title: SOL-11.1-100040
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The audit system must identify in which zone an event occurred. GROUP ID: V-216477 RULE ID: SV-216477r959010'
  rationale: Tracking the specific Solaris zones in the audit trail reduces the time required to determine the cause of a
    security event.
  impact: ''
  references: []
  page_start: 369
  audit_raw: 'This check applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global", this check applies.

    List the non-global zones on the system.

    # zoneadm list -vi | grep -v global

    The Audit Configuration profile is required.

    Determine whether the "zonename" auditing policy is in effect.

    # pfexec auditconfig -getpolicy | grep active | grep zonename

    If no output is returned, this is a finding.'
  remediation: 'This check applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global", this check applies.

    List the non-global zones on the system.

    # zoneadm list -vi | grep -v global

    The Audit Configuration profile is required.

    Enable the "zonename" auditing policy.

    # pfexec auditconfig -setpolicy +zonename'
