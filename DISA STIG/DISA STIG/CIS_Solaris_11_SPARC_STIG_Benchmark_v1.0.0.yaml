controls:
- id: '1.1'
  title: SOL-11.1-010040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The audit system must produce records containing sufficient information to establish the identity of any user/subject
    associated with the event. GROUP ID: V-216246 RULE ID: SV-216246r986419'
  rationale: Enabling the audit system will produce records with accurate time stamps, source, user, and activity information.
    Without this information malicious activity cannot be accurately tracked.
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'The Audit Configuration profile is required.

    This check applies to the global zone only. Determine the zone to be secured.

    # zonename

    If the command output is "global", this check applies.

    Check the status of the audit system. It must be auditing.

    # pfexec auditconfig -getcond

    If this command does not report the following, this is a finding.

    audit condition = auditing'
  remediation: 'The Audit Control profile is required.

    This action applies to the global zone only. Determine the zone to be secured.

    # zonename

    If the command output is "global", this action applies.

    If auditing has been disabled, it must be enabled with the following command:

    # pfexec audit -s'
  checks:
  - type: manual_review
    info: 'The Audit Configuration profile is required.

      This check applies to the global zone only. Determine the zone to be secured.

      # zonename

      If the command output is "global", this check applies.

      Check the status of the audit system. It must be auditing.

      # pfexec auditconfig -getcond

      If this command does not report the following, this is a finding.

      audit condition = auditing'
    severity: medium
