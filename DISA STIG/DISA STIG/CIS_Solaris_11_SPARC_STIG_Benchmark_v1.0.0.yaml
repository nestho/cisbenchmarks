- id: '1.89'
  title: SOL-11.1-040190
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The system must prevent the use of dictionary words for passwords. GROUP ID: V-216338 RULE ID: SV-216338r959010'
  rationale: The use of common words in passwords simplifies password-cracking attacks.
  impact: ''
  references: []
  page_start: 167
  audit_raw: 'Check /etc/default/passwd for dictionary check configuration.

    # grep ^DICTION /etc/default/passwd

    If the DICTIONLIST or DICTIONDBDIR settings are not present and are not set to:

    DICTIONLIST=/usr/share/lib/dict/words

    DICTIONDBDIR=/var/passwd

    this is a finding.

    Determine if the target files exist.

    # ls -l /usr/share/lib/dict/words /var/passwd

    If the files defined by DICTIONLIST or DICTIONBDIR are not present or are empty, this

    is a finding.'
  remediation: 'The root role is required.

    # pfedit /etc/default/passwd

    Insert the lines:

    DICTIONLIST=/usr/share/lib/dict/words

    DICTIONDBDIR=/var/passwd

    Generate the password dictionary by running the mkpwdict command.

