  rationale: The use of .rhosts authentication is an insecure protocol and can be replaced with public-key authentication
    using Secure Shell. As automatic authentication settings in the .rhosts files can provide a malicious user with sensitive
    system credentials, the use of .rhosts files should be disabled.
