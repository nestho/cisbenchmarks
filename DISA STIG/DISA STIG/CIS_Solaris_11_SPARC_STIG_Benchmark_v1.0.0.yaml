  profile:
  - 'SEVERITY: CAT II'
  description: 'The centralized process core dump data directory must be group-owned by root, bin, or sys. GROUP ID: V-216448
    RULE ID: SV-216448r959010'
  rationale: Process core dumps contain the memory in use by the process when it crashed. Any data the process was handling
