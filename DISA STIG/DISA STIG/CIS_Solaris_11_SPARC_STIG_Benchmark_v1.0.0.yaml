    severity: medium
- id: '1.194'
  title: SOL-11.1-080150
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must implement transaction recovery for transaction-based systems. GROUP ID: V-216455
    RULE ID: SV-216455r959010'
  rationale: Recovery and reconstitution constitutes executing an operating system contingency plan comprised of activities
    to restore essential missions and business functions. Transaction rollback and transaction journaling are examples of
    mechanisms supporting transaction recovery. While this is typically a database function, operating systems could be transactional
    in nature with respect to file processing.
  impact: ''
  references: []
  page_start: 335
  audit_raw: 'Solaris 11 ZFS copy-on-write model allows filesystem accesses to work according to a

    transactional model, such that on-disk content is always consistent and cannot be

    configured to be out of compliance.

    Determine if any UFS file systems are mounted with the "nologging" option.

    # mount|grep nologging

    If any file systems are listed, this is a finding.'
  remediation: 'The root role is required.

    Solaris 11 ZFS copy-on-write model allows filesystem accesses to work according to a

    transactional model, such that on-disk content is always consistent and cannot be

    configured to be out of compliance.

    If any UFS file systems are mounted with the "nologging" options, remove that option

    from the /etc/vfstab file.

    # pfedit /etc/vfstab

    Locate any file systems listed with the "nologging" option and delete the keyword

    "nologging".'
  checks:
  - type: manual_review
    info: 'Solaris 11 ZFS copy-on-write model allows filesystem accesses to work according to a

      transactional model, such that on-disk content is always consistent and cannot be

      configured to be out of compliance.

      Determine if any UFS file systems are mounted with the "nologging" option.

      # mount|grep nologging

