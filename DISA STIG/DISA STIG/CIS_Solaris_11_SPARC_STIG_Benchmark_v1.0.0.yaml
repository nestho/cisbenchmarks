- id: '1.217'
  title: SOL-11.1-120410
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must monitor for unauthorized connections of mobile devices to organizational information
    systems. GROUP ID: V-216479 RULE ID: SV-216479r959010'
  rationale: Mobile devices include portable storage media (e.g., USB memory sticks, external hard disk drives) and portable
    computing and communications devices with information storage capability (e.g., notebook/laptop computers, personal digital
    assistants, cellular telephones, digital cameras, audio recording devices). Organization-controlled mobile devices include
    those devices for which the organization has the authority to specify and the ability to enforce specific security requirements.
    Usage restrictions and implementation guidance related to mobile devices include configuration management, device identification
    and authentication, implementation of mandatory protective software (e.g., malicious code detection, firewall), scanning
    devices for malicious code, updating virus protection software, scanning for critical software updates and patches, conducting
    primary operating system (and possibly other resident software) integrity checks, and disabling unnecessary hardware (e.g.,
    wireless, infrared). In order to detect unauthorized mobile device connections, organizations must first identify and
    document what mobile devices are authorized.
  impact: ''
  references: []
  page_start: 373
  audit_raw: 'This check applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global" this check applies.

    Determine if USB mass storage devices are locked out by the kernel.

    # grep -h "exclude: scsa2usb" /etc/system /etc/system.d/*

    If the output of this command is not:

    exclude: scsa2usb

    this is a finding.'
  remediation: 'The root role is required.

    This check applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global" this check applies.

    Modify the /etc/system file.

    Determine the OS version you are currently securing.

    # uname –v

    For Solaris 11GA and 11.1

    # pfedit /etc/system

    Add a line containing:

    exclude: scsa2usb

    Note that the global zone will need to be rebooted for this change to take effect.

    For Solaris 11.2 or newer

    Modify an /etc/system.d file.

    # pfedit /etc/system.d/USB:MassStorage

    Add a line containing:

    exclude: scsa2usb

    Note that the global zone will need to be rebooted for this change to take effect.'
  checks:
  - type: manual_review
    info: 'This check applies to the global zone only. Determine the zone that you are currently

      securing.

      # zonename

      If the command output is "global" this check applies.

      Determine if USB mass storage devices are locked out by the kernel.

      # grep -h "exclude: scsa2usb" /etc/system /etc/system.d/*

      If the output of this command is not:

      exclude: scsa2usb

      this is a finding.'
    severity: medium
