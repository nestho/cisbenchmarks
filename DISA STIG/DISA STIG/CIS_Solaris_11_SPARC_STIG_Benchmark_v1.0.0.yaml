- id: '1.213'
  title: SOL-11.1-100020
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The limitpriv zone option must be set to the vendor default or less permissive. GROUP ID: V-216475 RULE ID:
    SV-216475r959010'
  rationale: Solaris zones can be assigned privileges generally reserved for the global zone using the "limitpriv" zone option.
    Any privilege assignments in excess of the vendor defaults may provide the ability for a non-global zone to compromise
    the global zone.
  impact: ''
  references: []
  page_start: 365
  audit_raw: 'This check applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global", this check applies.

    List the non-global zones on the system.

    # zoneadm list -vi | grep -v global

    From the output list of non-global zones found, determine if any are Kernel zones.

    # zoneadm list -cv | grep [zonename] | grep solaris-kz

    Exclude any Kernel zones found from the list of local zones.

    List the configuration for each zone.

    # zonecfg -z [zonename] info |grep limitpriv

    If the output of this command has a setting for limitpriv and it is not:

    limitpriv: default

    this is a finding.'
  remediation: 'This check applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global", this check applies.

    The Zone Security profile is required:

    Change the "limitpriv" setting to default.

    # pfexec zonecfg -z [zone] set limitpriv=default'
  checks:
  - type: command
    command: '# zoneadm list -vi | grep -v global && # zoneadm list -cv | grep [zonename] | grep solaris-kz'
    expected: ''
    severity: medium
    info: 'This check applies to the global zone only. Determine the zone that you are currently

      securing.

      # zonename

      If the command output is "global", this check applies.

      List the non-global zones on the system.

      # zoneadm list -vi | grep -v global

