  audit_raw: 'Determine the OS version you are currently securing.

    # uname –v

    Solaris 11, 11.1, 11.2, and 11.3 use IP Filter. To continue checking IP Filter, the IP Filter

    Management profile is required.

    Check the system for an IPF rule blocking outgoing source-routed packets.

    # ipfstat -o

    Examine the list for rules such as:

    block out log quick from any to any with opt lsrr

    block out log quick from any to any with opt ssrr

    If the listed rules do not block both lsrr and ssrr options, this is a finding.

    For Solaris 11.3 or newer that use Packet Filter, the Network Firewall Management

    rights profile is required.

    Ensure that IP Options are not in use:

    # pfctl -s rules | grep allow-opts

    If any output is returned, this is a finding.'
  remediation: 'The root role is required.

    # pfedit /etc/ipf/ipf.conf

    For Solaris 11, 11.1, 11.2, and 11.3 that use IP Filter dd rules to block outgoing sourcerouted packets, such as:

    block out log quick all with opt lsrr

    block out log quick all with opt ssrr

    Reload the IPF rules.

    # ipf -Fa -A -f /etc/ipf/ipf.conf

    For Solaris 11.3 or newer that use Packet Filter remove or modify any rules that include

    "allow-opts".

    Reload the Packet Filter rules:

    # svcadm refresh firewall:default'
  checks:
  - type: command
    command: '# pfctl -s rules | grep allow-opts'
    expected: ''
    severity: medium
    info: 'Determine the OS version you are currently securing.

      # uname –v

      Solaris 11, 11.1, 11.2, and 11.3 use IP Filter. To continue checking IP Filter, the IP Filter

      Management profile is required.

      Check the system for an IPF rule blocking outgoing source-routed packets.

      # ipfstat -o

      Examine the list for rules such as:

      block out log quick from any to any with opt lsrr

      block out log quick from any to any w'
- id: '1.134'
  title: SOL-11.1-050380
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The operating system must display the DoD approved system use notification message or banner before granting
    access to the system for general system logons. GROUP ID: V-216395 RULE ID: SV-216395r958390'
  rationale: Warning messages inform users who are attempting to log in to the system of their legal status regarding the
    system and must include the name of the organization that owns the system and any monitoring policies that are in place.
    As implementing a logon banner to deter inappropriate use can provide a foundation for legal action against abuse, this
    warning content should be set as appropriate.
  impact: ''
  references: []
  page_start: 244
  audit_raw: 'Review the contents of these two files and check that the proper DoD banner message

    is configured.

    # cat /etc/motd

    # cat /etc/issue

    If the DoD-approved banner text is not in the files, this is a finding.'
  remediation: 'The root role is required.

    Edit the contents of these two files and ensure that the proper DoD banner message is

    viewable.

    # pfedit /etc/motd

    # pfedit /etc/issue

    The DoD required text is:

    "You are accessing a U.S. Government (USG) Information System (IS) that is

    provided for USG-authorized use only. By using this IS (which includes any

    device attached to this IS), you consent to the following conditions:

    -The USG routinely intercepts and monitors communications on this IS for

    purposes including, but not limited to, penetration testing, COMSEC

    monitoring, network operations and defense, personnel misconduct (PM), law

    enforcement (LE), and counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are

    subject to routine monitoring, interception, and search, and may be disclosed

    or used for any USG-authorized purpose.

    -This IS includes security measures (e.g., authentication and access

    controls) to protect USG interests -- not for your personal benefit or

    privacy. -Notwithstanding the above, using this IS does not constitute

    consent to PM, LE or CI investigative searching or monitoring of the content

    of privileged communications, or work product, related to personal

    representation or services by attorneys, psychotherapists, or clergy, and

    their assistants. Such communications and work product are private and

    confidential. See User Agreement for details."'
  checks:
  - type: manual_review
    info: 'Review the contents of these two files and check that the proper DoD banner message

      is configured.

      # cat /etc/motd

      # cat /etc/issue

      If the DoD-approved banner text is not in the files, this is a finding.'
    severity: medium
