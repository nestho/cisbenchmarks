- id: '1.182'
  title: SOL-11.1-080020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The system must implement non-executable program stacks. GROUP ID: V-216443 RULE ID: SV-216443r959010'
  rationale: A common type of exploit is the stack buffer overflow. An application receives, from an attacker, more data than
    it is prepared for and stores this information on its stack, writing beyond the space reserved for it. This can be designed
    to cause execution of the data written on the stack. One mechanism to mitigate this vulnerability is for the system to
    not allow the execution of instructions in sections of memory identified as part of the stack.
  impact: ''
  references: []
  page_start: 316
  audit_raw: 'Determine the OS version you are currently securing.

    # uname –v

    If the OS version is 11.3 or newer, this check applies to all zones and relies on the

    "sxadm" command. Determine if the system implements non-executable program

    stacks.

    # sxadm status -p nxstack | cut -d: -f2

    enabled.all

    If the command output is not "enabled.all", this is a finding.

    For Solaris 11, 11.1, and 11.2, this check applies to the global zone only and the

    "/etc/system" file is inspected. Determine the zone that you are currently securing.

    # zonename

    If the command output is "global", determine if the system implements non-executable

    program stacks.

    # grep noexec_user_stack /etc/system

    If the noexec_user_stack is not set to 1, this is a finding.'
  remediation: 'The root role is required.

    Determine the OS version you are currently securing.

    # uname –v

    If the OS version is 11.3 or newer, enable non-executable program stacks using the

    "sxadm" command.

    # pfexec sxadm enable nxstack

    For Solaris 11, 11.1, and 11.2, this action applies to the global zone only and the

    "/etc/system" file is updated. Determine the zone that you are currently securing.

    # zonename

    If the command output is "global", modify the "/etc/system" file.

    # pfedit /etc/system

    add the line:

    set noexec_user_stack=1

    Solaris 11, 11.1, and 11.2 systems will need to be restarted for the setting to take effect.'
  checks:
  - type: manual_review
    info: 'Determine the OS version you are currently securing.

      # uname –v

      If the OS version is 11.3 or newer, this check applies to all zones and relies on the

      "sxadm" command. Determine if the system implements non-executable program

      stacks.

      # sxadm status -p nxstack | cut -d: -f2

      enabled.all

      If the command output is not "enabled.all", this is a finding.

      For Solaris 11, 11.1, and 11.2, this check applies to the global zone only and the

      "/etc/system" file is inspected. Determine the zone that you are curr'
    severity: medium
- id: '1.183'
  title: SOL-11.1-080030
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Address Space Layout Randomization (ASLR) must be enabled. GROUP ID: V-216444 RULE ID: SV-216444r959010'
  rationale: Modification of memory area can result in executable code vulnerabilities. ASLR can reduce the likelihood of
    these attacks. ASLR activates the randomization of key areas of the process such as stack, brk-based heap, memory mappings,
    and so forth.
  impact: ''
  references: []
  page_start: 318
  audit_raw: 'This check applies to the global zone only.

    Determine the zone that you are currently securing.

    # zonename

    If the command output is "global", this check applies.

    Determine if address space layout randomization is enabled.

    Determine the OS version you are currently securing:.

    # uname –v

    For Solaris 11, 11.1, 11.2, and 11.3:

    # sxadm info -p | grep aslr | grep enabled

    For Solaris 11.4 or newer:

    # sxadm status -p -o status aslr | grep enabled

    If no output is produced, this is a finding.'
  remediation: 'The root role is required.

    This action applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global", this action applies.

    Enable address space layout randomization.

    # sxadm delcust aslr

    Enabling ASLR may affect the function or stability of some applications, including those

    that use Solaris Intimate Shared Memory features.'
  checks:
  - type: command
    command: '# sxadm info -p | grep aslr | grep enabled && # sxadm status -p -o status aslr | grep enabled'
    expected: ''
    severity: medium
    info: 'This check applies to the global zone only.

      Determine the zone that you are currently securing.

      # zonename

      If the command output is "global", this check applies.

      Determine if address space layout randomization is enabled.

      Determine the OS version you are currently securing:.

      # uname –v

      For Solaris 11, 11.1, 11.2, and 11.3:

      # sxadm info -p | grep aslr | grep enabled

      For Solaris 11.4 or newer:

      # sxa'
- id: '1.184'
  title: SOL-11.1-080040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Process core dumps must be disabled unless needed. GROUP ID: V-216445 RULE ID: SV-216445r959010'
  rationale: Process core dumps contain the memory in use by the process when it crashed. Process core dump files can be of
    significant size and their use can result in file systems filling to capacity, which may result in denial of service.
    Process core dumps can be useful for software debugging.
  impact: ''
  references: []
  page_start: 320
  audit_raw: 'Check the process core dump configuration.

    # coreadm | grep enabled

    If any lines are returned by coreadm other than "logging", this is a finding.'
  remediation: 'The Maintenance and Repair profile is required.

    Change the process core dump configuration to disable core dumps globally and on a

    per process basis.

    # coreadm -d global

    # coreadm -d process

    # coreadm -d global-setid

    # coreadm -d proc-setid

    # coreadm -e log'
  checks:
  - type: command
    command: '# coreadm | grep enabled'
    expected: ''
    severity: medium
    info: 'Check the process core dump configuration.

      # coreadm | grep enabled

      If any lines are returned by coreadm other than "logging", this is a finding.'
- id: '1.185'
  title: SOL-11.1-080045
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The system must be configured to store any process core dumps in a specific, centralized directory. GROUP
    ID: V-216446 RULE ID: SV-216446r959010'
  rationale: Specifying a centralized location for core file creation allows for the centralized protection of core files.
    Process core dumps contain the memory in use by the process when it crashed. Any data the process was handling may be
    contained in the core file, and it must be protected accordingly. If process core dump creation is not configured to use
    a centralized directory, core dumps may be created in a directory that does not have appropriate ownership or permissions
    configured, which could result in unauthorized access to the core dumps.
  impact: ''
  references: []
  page_start: 321
  audit_raw: 'Check the defined directory for process core dumps:

    # coreadm | grep "global core file pattern"

    If the parameter is not set, or is not an absolute path (does not start with a slash [/]), this

    is a finding.'
  remediation: 'The root role is required.

    Set the core file directory and file pattern.

    # coreadm -g /var/share/cores/core.%f.%p'
  checks:
  - type: command
    command: '# coreadm | grep "global core file pattern"'
    expected: ''
    severity: medium
    info: 'Check the defined directory for process core dumps:

      # coreadm | grep "global core file pattern"

      If the parameter is not set, or is not an absolute path (does not start with a slash [/]), this

      is a finding.'
- id: '1.186'
  title: SOL-11.1-080050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The centralized process core dump data directory must be owned by root. GROUP ID: V-216447 RULE ID: SV-216447r959010'
  rationale: Process core dumps contain the memory in use by the process when it crashed. Any data the process was handling
    may be contained in the core file, and it must be protected accordingly. If the centralized process core dump data directory
    is not owned by root, the core dumps contained in the directory may be subject to unauthorized access.
  impact: ''
  references: []
  page_start: 322
  audit_raw: 'Check the defined directory for process core dumps.

    # coreadm | grep "global core file pattern"

    Check the ownership of the directory.

    # ls -lLd [core file directory]

    If the directory is not owned by root, this is a finding.'
  remediation: 'The root role is required.

    Change the owner of the core file directory.

    # chown root [core file directory]'
  checks:
  - type: command
    command: '# coreadm | grep "global core file pattern"'
    expected: ''
    severity: medium
    info: 'Check the defined directory for process core dumps.

      # coreadm | grep "global core file pattern"

      Check the ownership of the directory.

      # ls -lLd [core file directory]

      If the directory is not owned by root, this is a finding.'
