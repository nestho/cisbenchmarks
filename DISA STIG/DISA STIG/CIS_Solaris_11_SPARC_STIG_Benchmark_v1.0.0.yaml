  audit_raw: 'The operator shall determine if IPsec is being used to encrypt data for activities such as

    cluster interconnects or other non-SSH, SFTP data connections.

    On both systems review the file /etc/inet/ipsecinit.conf. Ensure that connections

    between hosts are configured properly in this file per the Solaris 11 documentation.

    Check that the IPsec policy service is online:

    # svcs svc:/network/ipsec/policy:default

    If the IPsec service is not online, this is a finding.

    If encrypted protocols are not used between systems, this is a finding.'
  remediation: 'The Service Management profile is required.

    Configure IPsec encrypted tunneling between two systems.

    On both systems review the file /etc/inet/ipsecinit.conf. Ensure that connections

    between hosts are configured properly in this file per the Solaris 11 documentation.

    Ensure that the IPsec policy service is online:

    Enable the IPsec service:

    # svcadm enable svc:/network/ipsec/policy:default'
