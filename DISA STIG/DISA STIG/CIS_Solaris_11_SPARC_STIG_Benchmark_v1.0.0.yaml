      a finding.'
- id: '1.72'
  title: SOL-11.1-030060
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must disable information system functionality that provides the capability for automatic
    execution of code on mobile devices without user direction. GROUP ID: V-219972 RULE ID: SV-219972r958548'
  rationale: Mobile devices include portable storage media (e.g., USB memory sticks, external hard disk drives) and portable
    computing and communications devices with information storage capability (e.g., notebook/laptop computers, personal digital
    assistants, cellular telephones, digital cameras, audio recording devices). Auto execution vulnerabilities can result
    in malicious programs being automatically executed. Examples of information system functionality providing the capability
    for automatic execution of code are Auto Run and Auto Play. Auto Run and Auto Play are components of the Microsoft Windows
    operating system that dictate what actions the system takes when a drive is mounted. This requirement is designed to address
    vulnerabilities that arise when mobile devices such as USB memory sticks or other mobile storage devices are automatically
    mounted and applications are automatically invoked without user knowledge or acceptance.
  impact: ''
  references: []
  page_start: 134
  audit_raw: 'This check applies to the global zone only. Determine the zone that you are currently

    securing.

    # zonename

    If the command output is "global", this check applies.

    Determine if the removable media volume manager is running.

    # svcs -Ho state svc:/system/filesystem/rmvolmgr:default

    If the output reports that the service is "online", this is a finding.'
  remediation: 'The Service Management profile is required.

    This action applies to the global zone only. Determine the zone that you are currently

    securing.

