  audit_raw: 'Review the managed Motorola Solutions Android 13 device configuration settings to

    confirm that autofill services are disabled.

    This procedure is performed on both the EMM Administration console and the managed

    Motorola Solutions Android 13 device.

    On the EMM console:

    COBO:

    1. Open "Set user restrictions".

    2. Verify "Disallow config date time" is toggled to "ON".

    COPE:

    1. Open "Set user restrictions on parent".

    2. Verify "Disallow config date time" is toggled to "ON".

    On the managed Motorola Solutions Android 13 device:

    COBO and COPE:

    1. Open Settings.

    2. Tap "System".

    3. Tap "Date & times".

    4. Verify "Set time automatically" is grayed out and is "Enabled by admin".

    If on the EMM console "Disallow config date time" is not set to "On", or on the managed

    Android 13 device "User network-provided time" is not grayed out, this is a finding.'
  remediation: 'Configure the Motorola Solutions Android 13 device to set auto network time.

