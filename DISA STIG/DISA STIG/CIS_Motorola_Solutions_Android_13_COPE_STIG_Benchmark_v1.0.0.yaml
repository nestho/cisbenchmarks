      1. Open the managed Google Play Store.

      2. Ver'
    severity: medium
- id: '1.9'
  title: MOTS-13-006800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Motorola Solutions Android 13 must be configured to not display the following (work profile) notifications
    when the device is locked: [selection: a. email notifications b. calendar appointments c. contact associated with phone
    call notification d. text message notification e. other application-based notifications f. all notifications]. GROUP ID:
    V-272317 RULE ID: SV-272317r1093380'
  rationale: 'Many mobile devices display notifications on the lock screen so that users can obtain relevant information in
    a timely manner without having to frequently unlock the phone to determine if there are new notifications. However, in
    many cases, these notifications can contain sensitive information. When they are available on the lock screen, an adversary
    can view them merely by being in close physical proximity to the device. Configuring the mobile operating system (MOS)
    to not send notifications to the lock screen mitigates this risk. SFR ID: FMT_SMF_EXT.1.1 #18'
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'Review managed Motorola Solutions Android 13 device settings to determine if the

    Motorola Solutions Android 13 device displays (work profile) notifications on the lock

    screen. Notifications of incoming phone calls are acceptable even when the device is

    locked.

    This validation procedure is performed on both the EMM Administration Console and

    the managed Motorola Solutions Android 13 device.

    On the EMM console:

    COBO:

    1. Open "Lock screen" settings.

    2. Open "Lock screen restrictions".

    3. Verify that "Disable unredacted notifications" is toggled to "ON".

    COPE:

    1. Open "Lock screen" settings.

    2. Open "Lock screen restrictions".

    3. Select "Work Profile".

    4. Verify that "Disable unredacted notifications" is toggled to "ON".

    On the managed Motorola Solutions Android 13 device:

    COBO:

    1. Go to Settings >> Display >> Lock screen.

    2. Tap on "Privacy".

    3. Verify that "Show sensitive content only when unlocked" is selected.

    COPE:

    1. Go to Settings >> Display >> Lock screen.

    2. Tap on "When work profile is locked".

    3. Verify that "Hide sensitive work content" is selected.

    If the EMM console device policy allows work notifications on the lock screen, or the

    managed Motorola Solutions Android 13 device allows work notifications on the lock

    screen, this is a finding.'
  remediation: 'Configure the Motorola Solutions Android 13 device to not display (work profile)

    notifications when the device is locked.

    On the EMM console:

