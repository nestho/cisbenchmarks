    set up the required setting:

    1. Go to Settings >> Network & Internet >> Hotspot & tethering.

    2. Enable "Wi-Fi hotspot".

    3. On the left of the slide, tap on "Wi-Fi Hotspot" to bring up the configuration

    options.

    4. Click on the "Security" link and select either "WPA2/WPA3-Personal" or "WPA3Personal".'
