  title: MOTS-13-010900
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'Android 13 devices must be configured to disable the use of third-party keyboards. GROUP ID: V-272356 RULE
    ID: SV-272356r1093497'
  rationale: 'Many third-party keyboard applications are known to contain malware. SFR ID: FMT_SMF_EXT.1.1 #47'
  impact: ''
  references: []
  page_start: 86
  audit_raw: 'Review the managed Motorola Solutions Android 13 configuration settings to confirm

    that no third-party keyboards are enabled.

    This procedure is performed on the EMM console.

    On the EMM console:

    COBO and COPE:

    1. Open "Input methods".

    2. Tap "Set input methods".

    3. Verify only the approved keyboards are selected.

    If third-party keyboards are allowed, this is a finding.'
  remediation: 'Configure the Motorola Solutions Android 13 device to disallow the use of third-party

    keyboards.

    On the EMM console:

    COBO and COPE:

    1. Open "Input methods".

    2. Tap "Set input methods".

    3. Select only the approved keyboard.

    Additionally, Admins can configure application allowlists for Motorola Solutions Play that

    do not have any third-party keyboards for user installation.'
  checks:
  - type: manual_review
    info: 'Review the managed Motorola Solutions Android 13 configuration settings to confirm

      that no third-party keyboards are enabled.

      This procedure is performed on the EMM console.

      On the EMM console:

      COBO and COPE:

      1. Open "Input methods".

      2. Tap "Set input methods".

      3. Verify only the approved keyboards are selected.

