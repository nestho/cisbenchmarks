  title: MOTS-13-008700
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Motorola Solutions Android 13 must be configured to enable authentication of personal hotspot connections
    to the device using a preshared key. GROUP ID: V-272334 RULE ID: SV-272334r1093534'
  rationale: 'If no authentication is required to establish personal hotspot connections, an adversary may be able to use
    that device to perform attacks on other devices or networks without detection. A sophisticated adversary may also be able
    to exploit unknown system vulnerabilities to access information and computing resources on the device. Requiring authentication
    to establish personal hotspot connections mitigates this risk. Application Note: If hotspot functionality is permitted,
    it must be authenticated via a preshared key. There is no requirement to enable hotspot functionality, and it is recommended
    this functionality be disabled by default. SFR ID: FMT_SMF_EXT.1.1 #41'
