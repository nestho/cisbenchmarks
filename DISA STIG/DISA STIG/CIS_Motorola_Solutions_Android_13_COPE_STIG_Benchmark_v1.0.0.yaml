- id: '1.33'
  title: MOTS-13-012300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Motorola Solutions Android 13 must allow only the administrator (EMM) to install/remove DOD root and intermediate
    PKI certificates. GROUP ID: V-272344 RULE ID: SV-272344r1093461'
  rationale: 'DOD root and intermediate PKI certificates are used to verify the authenticity of PKI certificates of users
    and web services. If the user is allowed to remove root and intermediate certificates, the user could allow an adversary
    to falsely sign a certificate in such a way that it could not be detected. Restricting the ability to remove DOD root
    and intermediate PKI certificates to the Administrator mitigates this risk. SFR ID: FMT_MOF_EXT.1.2 #47'
  impact: ''
  references: []
  page_start: 89
  audit_raw: 'Review the device configuration to confirm that the user is unable to remove DOD root

    and intermediate PKI certificates.

    On the EMM console:

    1. Open "Set user restrictions".

    2. Verify "Disallow config credentials" is toggled to "ON".

    On the Motorola Solutions Android 13 device:

    1. Open Settings.

    2. Tap "Security".

    3. Tap "Advanced".

    4. Tap "Encryption & credentials".

    5. Tap "Trusted credentials".

    6. Verify the user is unable to untrust or remove any work certificates.

    If on the Motorola Solutions Android 13 device the user is able to remove certificates,

    this is a finding.'
  remediation: 'Configure Motorola Solutions Android 13 device to prevent a user from removing DOD

    root and intermediate PKI certificates.

    On the EMM console:

    1. Open "Set user restrictions".

    2. Toggle "Disallow config credentials" to "ON".'
