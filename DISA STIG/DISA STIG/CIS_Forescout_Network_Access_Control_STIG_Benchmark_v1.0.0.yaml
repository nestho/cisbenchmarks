  description: 'Forescout must deny network connection for endpoints that cannot be authenticated using an approved method.
    This is required for compliance with C2C Step 4. GROUP ID: V-233338 RULE ID: SV-233338r811427'
  rationale: Without identifying devices, unidentified or unknown devices may be introduced, thereby facilitating malicious
