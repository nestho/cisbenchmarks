- id: '1.25'
  title: FORE-NC-000460
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Forescout must use a bidirectional authentication mechanism configured with a FIPSvalidated Advanced Encryption
    Standard (AES) cipher block algorithm to authenticate with the endpoint device. This is required for compliance with C2C
    Step 1. GROUP ID: V-233339 RULE ID: SV-233339r971529'
  rationale: Bidirectional authentication provides stronger safeguards to validate the identity of other devices for connections
    that are of greater risk. Currently, DoD requires the use of AES for bidirectional authentication since it is the only
    FIPS-validated AES cipher block algorithm. Because of the challenges of applying this requirement on a large scale, organizations
    are encouraged to apply the requirement only to those limited number (and type) of devices that truly need to support
    this capability.
  impact: ''
  references: []
  page_start: 58
  audit_raw: 'If DoD is not at C2C Step 1 or higher, this is not a finding.

    Use the Forescout CLI credentials to verify FIPS mode is set by running the "fstool

    version" command and look for the "FIPS enabled" setting.

    Log on using the CLIAdmin credentials established upon initial configuration.

    Verify FIPS mode by typing the command "fstool version".

    If Forescout does not use AES, this is a finding.'
  remediation: 'To enable FIPS mode, log in to the CLI account a use the "fstool fips" command.

    Note that use of FIPS mode is not mandatory in DoD. However, it is the primary method

    for mitigation of this requirement and ensuring FIPS compliance.

    Log on using the CLIAdmin credentials established upon initial configuration.

    To enable FIPS mode, type "fstool fips". A prompt alerting the user that FIPS 140-2 will

    be enabled will be displayed. Type "Yes" for FIPS to accept this prompt.

    Note: Use of FIPS mode is not mandatory in DoD. However, it is the primary method for

    mitigation of this requirement and ensuring FIPS compliance.'
