    session when the client does not have a suitable certificate, this is a finding.'
  remediation: 'Use the Forescout Administrator UI to configure the certificate options to require the Reverify TLS Sessions
    is set to every 1 day, or in accordance with the SSP.

    1. Log on to the Forescout UI.

    2. Select Tools >> Options >> Certificates.

    3. Check that in the Ongoing TLS Sessions section, view the Re-verify TLS

    Sessions.

    4. Change the Re-verify TLS Sessions to Every 1 Day or in accordance with the

    site''s SSP, then click "Apply".

    5. Next, select the HPS Inspection Engine >> SecureConnector.

    6. In the Client-Server Connection, ensure the Minimum Supported TLS Version is

    set to TLS version 1.2.'
  checks:
