    connections for endpoints that cannot be authenticated using an approved method and

    that the authentication failure is logged.

    1. Log on to Forescout UI.

    2. From the Policy tab, select the Authentication and Authorization policy.

    3. Find the 802.1x Authorization policy.

    If NAC does not have an authorization policy that denies network connection for

    endpoints that cannot be authenticated using an approved method and log

    authentication failures, this is a finding.'
  remediation: 'Use the Forescout Administrator UI to configure a policy to deny network access using

    a control action for any endpoints that cannot be authenticated using an approved

    method as defined in the SSP.

    1. Log on to Forescout UI.

    2. From the Policy tab, select the Authentication and Authorization policy.

    3. Find the 802.1x Authorization policy and click Edit.

    4. From the Sub-Rules section, check that all of the options for authentication are

    selected including the following:

    5. -Machine Authenticated

    6. -User+Machine Authenticated

    7. -User+Managed Machine

    8. -User+NotMachine Authenticated

    If these are all configured, check that the final step is not authorized by one of the

    previous steps, and block traffic in accordance with the SSP by selecting "Add>".

    1. Give the policy a name like "Deny Access".

    2. In the Condition box, click "Add" and select "802.1x RADIUS Authentication

    State".

    3. Check the box labeled "RADIUS-Rejected", and then click "OK".

    4. In the Actions box, click "Add" and select a block action in accordance with the

    SSP.'
