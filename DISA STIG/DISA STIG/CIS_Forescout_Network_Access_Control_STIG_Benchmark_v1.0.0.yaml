controls:
- id: '1.1'
  title: FORE-NC-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Forescout must enforce approved access by employing admissions assessment filters that include, at a minimum,
    device attributes such as type, IP address, resource group, and/or mission conditions as defined in Forescout System Security
    Plan (SSP). This is required for compliance with C2C Step 4. GROUP ID: V-233309 RULE ID: SV-233309r811367'
  rationale: 'Successful authentication must not automatically give an entity access to an asset or security boundary. The
    lack of authorization-based access control could result in the immediate compromise and unauthorized access to sensitive
    information. Authorization is the process of determining whether an entity, once authenticated, is permitted to access
    a specific asset. Many NACs include the ability to create network access control policies that include identity-based
    policies, role-based policies, and attribute-based policies. It is recommended that Forescout have the capability to expose
    collected data on the assessed endpoints through an API that can be accessed externally, or the NAC solution must supply
    an SDK to allow customers to export data. Admissions assessment filters should include, at a minimum, device attributes
    such as type, IP address, resource group, and/or mission conditions as defined in the Forescout SSP. Forescout should
    also track the following to facilitate security investigations: when each device was last admitted/readmitted to the network;
    owning organization; owning organization''s organizational unit; geographic location or the nearest network switch; motherboard
    serial number and BIOS; globally unique ID; and which unique network access compliance policies each device passed or
    failed during the latest network admission/readmission. The client may be denied admission based on a returned posture
    token. In most Forescout implementations, additional network access authorization policies can also be tied to the user''s
    identity, but these features are out of scope for this STIG.'
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'If DoD is not at C2C Step 4 or higher, this is not a finding.

    Use the Forescout Administrator UI to ensure that the endpoint compliance assessment

    policies have been implemented per the SSP and are functioning correctly.

    If Forescout does not have compliance assessment policies configured this is a finding.'
  remediation: 'Use the Forescout Administrator UI to configure the endpoint compliance assessment

    policies per the SSP. Example only:

    1. Log on to Forescout UI.

    2. From the Policy tab, select the top most policy.

    3. Select Add >> Classification >> Primary Classification, and then click "Next".

    4. Give the policy a name, then click "Next".

    5. If applicable, select the IP Address Range the policy will apply to, click "Ok", and

    then click "Next".

    6. Select "Finish, then click "Apply".'
  checks:
  - type: manual_review
    info: 'If DoD is not at C2C Step 4 or higher, this is not a finding.

      Use the Forescout Administrator UI to ensure that the endpoint compliance assessment

      policies have been implemented per the SSP and are functioning correctly.

      If Forescout does not have compliance assessment policies configured this is a finding.'
    severity: medium
- id: '1.2'
  title: FORE-NC-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Endpoint policy assessment must proceed after the endpoint attempting access has been identified using an
    approved identification method such as IP address. This is required for compliance with C2C Step 2. GROUP ID: V-233310
    RULE ID: SV-233310r811369'
  rationale: 'Automated policy assessments must reflect the organization''s current security policy so entry control decisions
    will happen only where remote endpoints meet the organization''s security requirements. If the remote endpoints are allowed
    to connect to the organization''s network without passing minimum-security controls, they become a threat to the entire
    network. Organizational policy must be established for what Forescout will check on the host for the agent and agentless.
    The Forescout system security plan (SSP) will be used to assess compliance with the requirement since each SSP item must
    be configured. Examples include, but are not limited to: • Verification that anti-virus software is authorized, running,
    and virus signatures are up to date. • Host-based firewall installed and configured according to the organization''s security
    policy. • Host IDS/IPS is installed, operational, and up to date. • Uses the result of malware, anti-virus, and IDS scans
    and status as part of the assessment decision process. • Required BIOS, operating system, browser, and office application
    patch levels. • Performs an assessment of the list of running services. • Test for the presence of DoD-required software.
    • Test for presence of peer-to-peer software (not allowed).'
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'If DoD is not at C2C Step 2 or higher, this is not a finding.

    Use the Forescout Administrator UI to ensure that the endpoint compliance assessment

    policies have been implemented per the SSP and are functioning correctly.

    1. Log on to the Forescout Administrator UI.

    2. From the Home screen select the "Policy" tab.

    3. Verify that policies exist that assess compliance in accordance with the SSP.

    If Forescout does not have compliance assessment policies configured this is a finding.'
  remediation: 'Use the Forescout Administrator UI to configure the endpoint compliance assessment

    policies per the SSP.

    1. From the console on the Enterprise Manager console, select the Policy tab.

    2. In accordance with the SSP, ensure that the endpoint compliance assessment

    policies have been configured and are functioning properly.'
  checks:
  - type: manual_review
    info: 'If DoD is not at C2C Step 2 or higher, this is not a finding.

      Use the Forescout Administrator UI to ensure that the endpoint compliance assessment

      policies have been implemented per the SSP and are functioning correctly.

      1. Log on to the Forescout Administrator UI.

      2. From the Home screen select the "Policy" tab.

      3. Verify that policies exist that assess compliance in accordance with the SSP.

      If Forescout does not have compliance assessment policies configured this is a finding.'
    severity: medium
- id: '1.3'
  title: FORE-NC-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'For endpoints that require automated remediation, Forescout must be configured to logically separate endpoints
    from the trusted network traffic during remediation. This is required for compliance with C2C Step 4. GROUP ID: V-233311
    RULE ID: SV-233311r1018659'
  rationale: 'Automated and manual procedures for remediation for critical security updates will be managed differently. Continuing
    to assess and remediate endpoints with risks that could endanger the network could impact network usage for all users.
    This isolation prevents traffic from flowing with traffic from endpoints that have been fully assessed and authorized.
    This requirement does not mandate a remediation network be used, but rather requires that it be secured where used. For
    example, unauthenticated devices must not be allowed to connect to remediation networks. Many sites block unauthorized
    traffic directly using the Forescout. Forescout accepts only endpoints with IP addresses that are in range. Configure
    Forescout to identify the endpoint. By default, the IP address is used as the endpoint identifier. The system can be configured
    to capture the following other endpoint unique identifiers if approved for use by the SSP as the identification method:
    BIOS Serial number and other hardcoded attributes, OS host name, etc.'
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'If DOD is not at C2C Step 4 or higher, this is not a finding.

    If a separate remediation network is configured and isolated from the trusted network,

    this is not a finding.

    Use the Forescout Administrator UI to verify that Forescout is configured to either

    redirect endpoints requiring automated remediation to a network segment that is

    isolated from trusted traffic or, if assessment is done on the Forescout, the endpoint

    traffic is logically separate during remediation.

    If Forescout does not isolate endpoints during remediation, this is a finding.'
  remediation: 'Use the Forescout Administrator UI to configure a policy, per the SSP, that isolates

    endpoints requiring automated remediation from other endpoints on the trusted network.

    The following is an example only.

    1. From the Policy tab, select the top most policy.

    2. Select Add >> Classification >> Primary Classification, and then click Next.

    3. Give the policy a name, then click Next.

    4. Select the IP Address Range the policy will apply to, click "OK," and then click

    "Next".

    5. Select "Finish", and then click "Apply".

    This collects a series of attributes for each endpoint that can then be used in a policy as

    the unique identifier. However, by default the IP address is used, for example in the log

    records.'
  checks:
  - type: manual_review
    info: 'If DOD is not at C2C Step 4 or higher, this is not a finding.

      If a separate remediation network is configured and isolated from the trusted network,

      this is not a finding.

      Use the Forescout Administrator UI to verify that Forescout is configured to either

      redirect endpoints requiring automated remediation to a network segment that is

      isolated from trusted traffic or, if assessment is done on the Forescout, the endpoint

      traffic is logically separate during remediation.

      If Forescout does not isola'
    severity: medium
- id: '1.4'
  title: FORE-NC-000040
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'If a device requesting access fails Forescout policy assessment, Forescout must communicate with other components
    and the switch to either terminate the session or isolate the device from the trusted network for remediation. This is
    required for compliance with C2C Step 3. GROUP ID: V-233312 RULE ID: SV-233312r1113801'
  rationale: Endpoints with identified security flaws and weaknesses endanger the network and other devices on it. Isolation
    or termination prevents traffic from flowing with traffic from endpoints that have been fully assessed and authorized.
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'If DOD is not at C2C Step 3 or higher, this is not a finding.

    Use the Forescout Administrator UI to verify that policies are configured to filter the

    policy assessment devices based on risk and are remediated or isolated according to

    the SSP.

    1. In the Forescout UI, go to the Policy Tab >> Compliance or Control Policies.

    2. Verify the action within Compliance Policies is configured with one of the

    following actions:

    o Terminate the connection and place the device on a denylist to prevent

    future connection attempts until action is taken to remove the device from

    the denylist.

    o Redirect traffic from the remote endpoint to the automated remediation

    subnet for connection to the remediation server or segment the endpoint

    to a remediation VLAN. Use of ACLs or a VLAN solution is acceptable.

    o Allow the device access to limited network services such as public web

    servers in the protected DMZ (must be approved by the authorizing official

    [AO]).

    o Allow the device and user full entry into the protected networks, but flag it

    for future remediation. With this option, an automated reminder should be

    used to inform the user of the remediation status.

    If Forescout does not communicate with the remote access gateway to implement a

    policy to either terminate the session or isolate the device from the trusted network this

    is a finding.'
  remediation: 'Use the Forescout Administrator UI to configure policies according to the SSP to filter

    assessed devices based on risk. Ensure the policies remediate or segment the at-risk

    devices according to the SSP.

    1. In the Forescout UI, go to the Policy Tab >> Compliance or Control Policies.

    2. Select a policy, then click “Edit”.

    3. Configure the Compliance Policies to include any of the following actions:

    o Terminate the connection and place the device on a denylist to prevent

    future connection attempts until action is taken to remove the device from

    the denylist.

    o Redirect traffic from the remote endpoint to the automated remediation

    subnet for connection to the remediation server or segment the endpoint

    to a remediation VLAN. Use of ACLs or a VLAN solution is acceptable.

    o Allow the device access to limited network services such as public web

    servers in the protected DMZ (must be approved by the AO).

    o Allow the device and user full entry into the protected networks, but flag it

    for future remediation. With this option, an automated reminder must be

    used to inform the user of the remediation status.'
  checks:
  - type: manual_review
    info: 'If DOD is not at C2C Step 3 or higher, this is not a finding.

      Use the Forescout Administrator UI to verify that policies are configured to filter the

      policy assessment devices based on risk and are remediated or isolated according to

      the SSP.

      1. In the Forescout UI, go to the Policy Tab >> Compliance or Control Policies.

      2. Verify the action within Compliance Policies is configured with one of the

      following actions:

      o Terminate the connection and place the device on a denylist to prevent

      future '
    severity: medium
- id: '1.5'
  title: FORE-NC-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Forescout must be configured to notify the user before proceeding with remediation of the user''s endpoint
    device when automated remediation is used. This is required for compliance with C2C Step 3. GROUP ID: V-233313 RULE ID:
    SV-233313r1113802'
  rationale: 'Connections that bypass established security controls should be allowed only in cases of administrative need.
    These procedures and use cases must be approved by the information system security manager (ISSM). Unless an exception
    is approved to not require notification of the user, the following configurations must be implemented: • This setting
    may be sent from the assessment server, a central server, or from the remediation server. • Verify the user is notified
    and accepts (e.g., using an accept button) that remediation is needed and is about to begin.'
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'If DOD is not at C2C Step 3 or higher, this is not a finding.

    Check Forescout policy to ensure that exempt devices that are in need of remediation

    prompt the user to accept the remediation process, prior to conducting.

    1. Log on to the Forescout UI.

    2. Select the "Policy" tab.

    3. Review the compliance policy identified by the site representation as the

    remediation policy, then click "Edit".

    4. In the Sub-Rules section, select a policy and click "Edit".

    5. From the Actions section, verify that the policy is configured to notify the user,

    prior to remediation, that user interaction is required.

    If Forescout is not configured to notify the user before proceeding with remediation of

    the user''s endpoint device when automated remediation is used, this is a finding.'
  remediation: 'Log on to the Forescout UI.

    1. Select the "Policy" tab.

    2. Select a compliance policy, then click "Edit".

    3. In the Sub-Rules section, select a policy and click "Edit".

    4. From the Actions section, click Add >> Notify >> and select a notification method.'
  checks:
  - type: manual_review
    info: 'If DOD is not at C2C Step 3 or higher, this is not a finding.

      Check Forescout policy to ensure that exempt devices that are in need of remediation

      prompt the user to accept the remediation process, prior to conducting.

      1. Log on to the Forescout UI.

      2. Select the "Policy" tab.

      3. Review the compliance policy identified by the site representation as the

      remediation policy, then click "Edit".

      4. In the Sub-Rules section, select a policy and click "Edit".

      5. From the Actions section, verify that th'
    severity: medium
- id: '1.6'
  title: FORE-NC-000060
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Forescout must be configured so that all client machines are assessed by Forescout with exceptions that are
    allowed to bypass Forescout based on account or account type, as approved by the information system security manager (ISSM)
    and documented in the System Security Plan (SSP). This is required for compliance with C2C Step 1. GROUP ID: V-233314
    RULE ID: SV-233314r919219'
  rationale: The NAC gateway provides the policy enforcement allowing or denying the endpoint to the network. Unauthorized
    endpoints that bypass this control present a risk to the organization's data and network. The focus of this requirement
    is on identification, documentation, and approval of devices that will bypass the NAC. This is not a requirement that
    all traffic flow through the NAC.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'If DOD is not at C2C Step 1 or higher, this is not a finding.

    If traffic is not allowed to bypass the NAC policy, this is not a finding.

    Use the Forescout Administrator UI to verify a policy exists that uses the exemption

    group configured so that all client machines are assessed by Forescout with exceptions

    that are allowed to bypass Forescout based on the account or account type, as

    approved by the ISSM and documented in the SSP.

    1. In the filters pane under Groups, right-click the group editor. Pick the group

    indicated as compliance by the site representative.

    2. Click "Scope" and review the Exemptions Group.

    If Forescout is not configured to approve all instances where traffic is allowed to bypass

    the NAC as approved by the ISSM, this is a finding.'
  remediation: 'Use the Forescout Administrator UI to configure an exception group that is defined in

    the SSP and ensure policy is applied to the group that allows NAC bypass.

    Create a group based on the exemptions in the SSP.

    1. In the filters pane under Groups, right-click the group editor. Pick or create an

    exemption group.

    2. Add a name and then add the scope based on IP range or Subnet, or based on

    MAC Address.

    3. Click "OK" and then click "OK" again. Click "Yes" for "Are you sure?".

    Create a policy that uses the exemption group.

    1. In the Views pane, click "Authentication & Authorization".

    2. Select an existing policy and edit the Scope to add the Exemptions Group.

    3. In Exceptions type, select "Group".

    4. In the Policy screen, select the exceptions group created in the prior step, click

    "OK" several times, and then click "Apply".'
  checks:
  - type: manual_review
    info: 'If DOD is not at C2C Step 1 or higher, this is not a finding.

      If traffic is not allowed to bypass the NAC policy, this is not a finding.

      Use the Forescout Administrator UI to verify a policy exists that uses the exemption

      group configured so that all client machines are assessed by Forescout with exceptions

      that are allowed to bypass Forescout based on the account or account type, as

      approved by the ISSM and documented in the SSP.

      1. In the filters pane under Groups, right-click the group editor'
    severity: medium
- id: '1.7'
  title: FORE-NC-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'When devices fail the policy assessment, Forescout must create a record with sufficient detail suitable for
    forwarding to a remediation server for automated remediation or sending to the user for manual remediation. This is required
    for compliance with C2C Step 3. GROUP ID: V-233317 RULE ID: SV-233317r811383'
  rationale: Notifications sent to the user and/or network administrator informing them of remediation requirements will ensure
    that action is taken.
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'If DoD is not at C2C Step 3 or higher, this is not a finding.

    Verify Forescout sends user and/or admin notification of remediation requirements,

    whether manual or automated.

    If the NAC does not flag for future manual or automated remediation, devices failing

    policy assessment that are not automatically remediated either before or during the

    remote access session, this a finding.'
  remediation: 'Log on to the Forescout UI.

    1. Within the Policy tab, locate the Compliance policies.

    2. Within the policy Sub-Rule, ensure all policies that indicate remediation have

    been configured to notify the user and/or network administrator of required

    action.'
  checks:
  - type: manual_review
    info: 'If DoD is not at C2C Step 3 or higher, this is not a finding.

      Verify Forescout sends user and/or admin notification of remediation requirements,

      whether manual or automated.

      If the NAC does not flag for future manual or automated remediation, devices failing

      policy assessment that are not automatically remediated either before or during the

      remote access session, this a finding.'
    severity: medium
- id: '1.8'
  title: FORE-NC-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Forescout must place client machines on a blacklist or terminate network communications on devices when critical
    security issues are found that put the network at risk. This is required for compliance with C2C Step 4. GROUP ID: V-233318
    RULE ID: SV-233318r811385'
  rationale: Devices that are found to have critical security issues place the network at risk if they are allowed to continue
    communications. Policy actions should be in place to terminate or restrict network communication or place the suspicious
    machine on a blacklist.
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'If DoD is not at C2C Step 4 or higher, this is not a finding.

    Check Forescout policy to ensure that any device with a critical security issue is

    checked through a security policy and an action is taken to either blacklist it or terminate

    communication with other network devices.

    If the NAC does not immediately place the device on the blacklist and terminate the

    connection when critical security issues are found that put the network at immediate

    risk, this a finding.'
  remediation: 'Use the Forescout Administrator UI to configure compliance policies to ensure any

    device with critical security issues is added to a blacklist, had its network

    communication blocked, or isolated from trusted network traffic for remediation.

    1. From the Policy tab, identify a Compliance policy.

    2. Within the Compliance policy, under Sub-Rule for a device with critical security

    issues, ensure that an action that Adds Device to Blacklist and/or Disables

    Device is enabled.

    If Forescout does not place client machines on a blacklist or terminate network

    communications on devices when critical security issues are found that put the network

    at risk, this is a finding.'
  checks:
  - type: manual_review
    info: 'If DoD is not at C2C Step 4 or higher, this is not a finding.

      Check Forescout policy to ensure that any device with a critical security issue is

      checked through a security policy and an action is taken to either blacklist it or terminate

      communication with other network devices.

      If the NAC does not immediately place the device on the blacklist and terminate the

      connection when critical security issues are found that put the network at immediate

      risk, this a finding.'
    severity: medium
- id: '1.9'
  title: FORE-NC-000110
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Forescout must be configured so client machines do not communicate with other network devices in the DMZ or
    subnet except as needed to perform an access client assessment or to identify themselves. This is required for compliance
    with C2C Step 2. GROUP ID: V-233319 RULE ID: SV-233319r1111892'
  rationale: Devices not compliant with DOD secure configuration policies are vulnerable to attack. While endpoints are undergoing
    NAC authorization assessment, they must communicate only with the NAC. These devices should not communicate with other
    hosts in the DMZ or other network segments.
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'If DOD is not at C2C Step 2 or higher, this is not a finding.

    Verify ForeScout is configured so endpoints under assessment are isolated from peer

    communication.

    1. Navigate to the Policy tab and examine the Compliance Assessment policy.

    2. Verify either a Quarantine VLAN, ACL Enforcement Method, or Forescout Virtual

    Firewall is configured as part of the policy.

    If Forescout allows endpoints under assessment to communicate with other endpoints

    in the DMZ or on other network segments, this is a finding.'
  remediation: 'Configure ForeScout so devices being assessed for compliance do not communicate

    with other devices in the DMZ or other network segments. There are different

    approaches; however, this typically involves isolating noncompliant devices into a

    quarantine or assessment zone until they meet compliance requirements.

    The following are examples.

    Create a Quarantine VLAN:

    1. Set up a dedicated VLAN (e.g., "Quarantine_VLAN") for devices under

    assessment.

    2. This VLAN should have restricted access, blocking communication to other

    devices or production network segments.

    3. Allow traffic only to specific remediation servers (e.g., patch servers, ForeScout

    appliance for assessment).

    4. Configure the switches to support dynamic VLAN assignment via CounterACT.

    5. Enforce Network Isolation using a VLAN:

    • Select the "Quarantine_VLAN".

    • CounterACT will instruct the switch (via SNMP or CLI) to move the device to this

    VLAN upon detection.

    Or

    ACL Enforcement Method:

    1. If VLANs are not feasible, use the Apply ACL action.

    2. Configure an ACL on the switches or routers to block all traffic from the device’s

    IP or MAC to other network devices, allowing only traffic to remediation servers

    (e.g., IP of patch server, DNS, or CounterACT appliance).

    3. Example ACL (syntax depends on the switch/router):

    deny ip <device_IP> 0.0.0.0 <network_range> <network_mask>

    permit ip <device_IP> 0.0.0.0 <remediation_server_IP> 0.0.0.0

    permit ip <device_IP> 0.0.0.0 <forescout_IP> 0.0.0.0

    deny ip any any

    Or

    Virtual Firewall Method:

    1. Use CounterACT’s Virtual Firewall action to block all traffic from the device

    except to specific IPs/ports (e.g., remediation servers, CounterACT).

    2. Configure rules in the action settings to allow only necessary outbound traffic.'
  checks:
  - type: manual_review
    info: 'If DOD is not at C2C Step 2 or higher, this is not a finding.

      Verify ForeScout is configured so endpoints under assessment are isolated from peer

      communication.

      1. Navigate to the Policy tab and examine the Compliance Assessment policy.

      2. Verify either a Quarantine VLAN, ACL Enforcement Method, or Forescout Virtual

      Firewall is configured as part of the policy.

      If Forescout allows endpoints under assessment to communicate with other endpoints

      in the DMZ or on other network segments, this is a fi'
    severity: medium
- id: '1.10'
  title: FORE-NC-000120
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Forescout must enforce the revocation of endpoint access authorizations when devices are removed from an authorization
    group. This is required for compliance with C2C Step 4. GROUP ID: V-233320 RULE ID: SV-233320r1001246'
  rationale: Ensuring the conditions that are configured in policy have proper time limits set to reflect changes will allow
    for proper access. This will help to validate that authorized individuals have proper access.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'If DOD is not at C2C Step 4 or higher, this is not a finding.

    Verify Forescout admission policy has been configured to revoke access to endpoints

    that have not met or are removed from the authorized group.

    If Forescout is not configured with an admissions policy that enforces the revocation of

    endpoint access authorizations based on when devices are removed from an

    authorization group, this is a finding.'
  remediation: 'Use the Forescout Administrator UI to configure the authorization policy to take a

    control action on any devices that have not met authorization requirement or are no

    longer authorized.

    1. Log on to the Forescout UI.

    2. From the Policy tab, check that the authorization policy has a Block Action

    enabled on any devices that have not met or are removed from the authorized

    group.'
  checks:
  - type: manual_review
    info: 'If DOD is not at C2C Step 4 or higher, this is not a finding.

      Verify Forescout admission policy has been configured to revoke access to endpoints

      that have not met or are removed from the authorized group.

      If Forescout is not configured with an admissions policy that enforces the revocation of

      endpoint access authorizations based on when devices are removed from an

      authorization group, this is a finding.'
    severity: medium
- id: '1.11'
  title: FORE-NC-000130
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Forescout must enforce the revocation of endpoint access authorizations at the next compliance assessment
    interval based on changes to the compliance assessment security policy. This is required for compliance with C2C Step
    4. GROUP ID: V-233321 RULE ID: SV-233321r1001247'
  rationale: This requirement gives the option to configure for automated remediation and/or manual remediation. A detailed
    record must be passed to the remediation server for action. Alternatively, the details can be passed in a notice to the
    user for action. The device status will be updated on the network access server/authentication server so that further
    access attempts are denied. The NAC must have policy assessment mechanisms with granular control to distinguish between
    access restrictions based on the criticality of the software or setting failure.
