  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'For TLS connections, Forescout must automatically terminate the session when a client certificate is requested
    and the client does not have a suitable certificate. This is required for compliance with C2C Step 1. GROUP ID: V-233331
    RULE ID: SV-233331r856515'
  rationale: In accordance with NIST SP 800-52, the TLS server must terminate the connection with a fatal “handshake failure”
    alert when a client certificate is requested and the client does not have a suitable certificate. During the TLS handshake
    negotiation, a "client certificate request" that includes a list of the types of certificates supported and the Distinguished
    Names of acceptable Certification Authorities (CAs) is sent to the client. TLS handshake enables the SSL or TLS client
    and server to establish the secret keys with which they communicate.
  impact: ''
  references: []
