benchmark:
  id: cis-vmware-vsphere-7-0-vcenter-appliance-perfcharts-stig-benchmark
  title: CIS VMware vSphere 7.0 vCenter Appliance Perfcharts STIG Benchmark
  version: 1.0.0
  technology: DISA STIG
  category: DISA STIG
  os: DISA STIG
  source_pdf: CIS_VMware_vSphere_7.0_vCenter_Appliance_Perfcharts_STIG_Benchmark_v1.0.0.pdf
  total_pages: 80
