controls:
- id: '1.1'
  title: VCPF-70-000001
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts must limit the amount of time that each Transport Control Protocol (TCP) connection is
    kept alive. GROUP ID: V-256611 RULE ID: SV-256611r888324'
  rationale: Denial of service (DoS) is one threat against web servers. Many DoS attacks attempt to consume web server resources
    in such a way that no more resources are available to satisfy legitimate requests. In Tomcat, the "connectionTimeout"
    attribute sets the number of milliseconds the server will wait after accepting a connection for the request Uniform Resource
    Identifier (URI) line to be presented. This timeout will also be used when reading the request body (if any). This prevents
    idle sockets that are not sending HTTP requests from consuming system resources and potentially denying new connections.
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --xpath ''/Server/Service/Connector/@connectionTimeout''

    /usr/lib/vmware-perfcharts/tc-instance/conf/server.xml

    Expected result:

    connectionTimeout="20000"

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-perfcharts/tc-instance/conf/server.xml

    Navigate to each of the <Connector> nodes.

    Configure each <Connector> node with the value:

    connectionTimeout="20000"

    Restart the service with the following command:

    # vmon-cli --restart perfcharts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --xpath ''/Server/Service/Connector/@connectionTimeout''

      /usr/lib/vmware-perfcharts/tc-instance/conf/server.xml

      Expected result:

      connectionTimeout="20000"

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.2'
  title: VCPF-70-000002
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts must limit the number of concurrent connections permitted. GROUP ID: V-256612 RULE ID:
    SV-256612r888327'
  rationale: Resource exhaustion can occur when an unlimited number of concurrent requests are allowed on a website, facilitating
    a denial-of-service attack. Unless the number of requests is controlled, the web server can consume enough system resources
    to cause a system crash. Mitigating this kind of attack will include limiting the number of concurrent HTTP/HTTPS requests.
    In Tomcat, each incoming request requires a thread for the duration of that request. If more simultaneous requests are
    received than can be handled by the currently available request processing threads, additional threads will be created
    up to the value of the "maxThreads" attribute.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --xpath ''/Server/Service/Executor/@maxThreads'' /usr/lib/vmwareperfcharts/tc-instance/conf/server.xml

    Expected result:

    maxThreads="300"

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-perfcharts/tc-instance/conf/server.xml

    Navigate to the <Executor> mode with the name of "tomcatThreadPool" and configure

    with the value ''maxThreads="300"''.

    Note: The <Executor> node should be configured as follows:

    <Executor maxThreads="300" minSpareThreads="50" name="tomcatThreadPool"

    namePrefix="tomcat-http--"/>

    Restart the service with the following command:

    # vmon-cli --restart perfcharts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --xpath ''/Server/Service/Executor/@maxThreads'' /usr/lib/vmwareperfcharts/tc-instance/conf/server.xml

      Expected result:

      maxThreads="300"

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.3'
  title: VCPF-70-000003
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts must limit the maximum size of a POST request. GROUP ID: V-256613 RULE ID: SV-256613r888330'
  rationale: The "maxPostSize" value is the maximum size in bytes of the POST that will be handled by the container FORM URL
    parameter parsing. Limit its size to reduce exposure to a denial-of-service attack. If "maxPostSize" is not set, the default
    value of 2097152 (2MB) is used. Performance Charts is configured in its shipping state to not set a value for "maxPostSize".
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --xpath ''/Server/Service/Connector/@maxPostSize'' /usr/lib/vmwareperfcharts/tc-instance/conf/server.xml

    Expected result:

    XPath set is empty

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-perfcharts/tc-instance/conf/server.xml

    Navigate to each of the <Connector> nodes.

    Remove any configuration for "maxPostSize".

    Restart the service with the following command:

    # vmon-cli --restart perfcharts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --xpath ''/Server/Service/Connector/@maxPostSize'' /usr/lib/vmwareperfcharts/tc-instance/conf/server.xml

      Expected result:

      XPath set is empty

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.4'
  title: VCPF-70-000004
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts must protect cookies from cross-site scripting (XSS). GROUP ID: V-256614 RULE ID: SV-256614r888333'
  rationale: 'Cookies are a common way to save session state over the HTTP(S) protocol. If an attacker can compromise session
    data stored in a cookie, they are better able to launch an attack against the server and its applications. When a cookie
    is tagged with the "HttpOnly" flag, it tells the browser that this particular cookie should only be accessed by the originating
    server. Any attempt to access the cookie from client script is strictly forbidden. Satisfies: SRG-APP-000001-WSR-000002,
    SRG-APP-000439-WSR-000154'
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --format /usr/lib/vmware-perfcharts/tcinstance/webapps/statsreport/WEB-INF/web.xml | sed ''2 s/xmlns=".*"//g''
    |

    xmllint --xpath ''/web-app/session-config/cookie-config/http-only'' -

    Expected result:

    <http-only>true</http-only>

    If the output does not match the expected result, this is a finding.'
  remediation: "Navigate to and open:\n/usr/lib/vmware-perfcharts/tc-instance/webapps/statsreport/WEB-INF/web.xml\nNavigate\
    \ to the <session-config> node and configure it as follows:\n<session-config>\n <cookie-config>\n <http-only>true</http-only>\n\
    \ <secure>true</secure>\n </cookie-config>\n <session-timeout>30</session-timeout>\n</session-config>\nRestart the service\
    \ with the following command:\n# vmon-cli --restart perfcharts"
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --format /usr/lib/vmware-perfcharts/tcinstance/webapps/statsreport/WEB-INF/web.xml | sed ''2 s/xmlns=".*"//g''
      |

      xmllint --xpath ''/web-app/session-config/cookie-config/http-only'' -

      Expected result:

      <http-only>true</http-only>

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.5'
  title: VCPF-70-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts must record user access in a format that enables monitoring of remote access. GROUP ID:
    V-256615 RULE ID: SV-256615r888336'
  rationale: 'Remote access can be exploited by an attacker to compromise the server. By recording all remote access activities,
    it will be possible to determine the attacker''s location, intent, and degree of success. Tomcat can be configured with
    an "AccessLogValve", a component that can be inserted into the request processing pipeline to provide robust access logging.
    The "AccessLogValve" creates log files in the same format as those created by standard web servers. When "AccessLogValve"
    is properly configured, log files will contain all the forensic information necessary in the case of a security incident.
    Satisfies: SRG-APP-000016-WSR-000005, SRG-APP-000089-WSR-000047, SRGAPP-000093-WSR-000053, SRG-APP-000095-WSR-000056,
    SRG-APP-000096-WSR000057, SRG-APP-000097-WSR-000058, SRG-APP-000098-WSR-000059, SRG-APP000098-WSR-000060, SRG-APP-000099-WSR-000061,
    SRG-APP-000100-WSR000064, SRG-APP-000374-WSR-000172, SRG-APP-000375-WSR-000171'
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --format /usr/lib/vmware-perfcharts/tc-instance/conf/server.xml |

    sed ''2 s/xmlns=".*"//g'' | xmllint --xpath

    ''/Server/Service/Engine/Host/Valve[@className="org.apache.catalina.valves.Acc

    essLogValve"]/@pattern'' -

    Expected result:

    pattern="%h %{X-Forwarded-For}i %l %u %t "%r" %s %b "%{User-Agent}i""

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-perfcharts/tc-instance/conf/server.xml

    Inside the <Host> node, find the "AccessLogValve" <Valve> node and replace the

    "pattern" element as follows:

    pattern="%h %{X-Forwarded-For}i %l %u %t "%r" %s %b "%{User-Agent}i""

    Restart the service with the following command:

    # vmon-cli --restart perfcharts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --format /usr/lib/vmware-perfcharts/tc-instance/conf/server.xml |

      sed ''2 s/xmlns=".*"//g'' | xmllint --xpath

      ''/Server/Service/Engine/Host/Valve[@className="org.apache.catalina.valves.Acc

      essLogValve"]/@pattern'' -

      Expected result:

      pattern="%h %{X-Forwarded-For}i %l %u %t "%r" %s %b "%{User-Agent}i""

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.6'
  title: VCPF-70-000006
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts must generate log records for system startup and shutdown. GROUP ID: V-256616 RULE ID:
    SV-256616r888339'
  rationale: 'Logging must be started as soon as possible when a service starts and when a service is stopped. Many forms
    of suspicious actions can be detected by analyzing logs for unexpected service starts and stops. Also, by starting to
    log immediately after a service starts, it becomes more difficult for suspicious activity to go unlogged. On the vCenter
    Server Appliance (VCSA), the "vmware-vmon" service starts up the Java virtual machines (JVMs) for various vCenter processes,
    including Performance Charts, and the individual json config files control the early JVM logging. Ensuring these json
    files are configured correctly enables early Java "stdout" and "stderr" logging. Satisfies: SRG-APP-000089-WSR-000047,
    SRG-APP-000092-WSR-000055'
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'At the command prompt, run the following command:

    # grep StreamRedirectFile /etc/vmware/vmware-vmon/svcCfgfiles/perfcharts.json

    Expected result:

    "StreamRedirectFile" : "%VMWARE_LOG_DIR%/vmware/perfcharts/vmwareperfcharts-runtime.log",

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/vmware/vmware-vmon/svcCfgfiles/perfcharts.json

    Below the last line of the "PreStartCommandArg" block, add the following line:

    "StreamRedirectFile" : "%VMWARE_LOG_DIR%/vmware/perfcharts/vmwareperfcharts-runtime.log",

    Restart the appliance for changes to take effect.'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep StreamRedirectFile /etc/vmware/vmware-vmon/svcCfgfiles/perfcharts.json

      Expected result:

      "StreamRedirectFile" : "%VMWARE_LOG_DIR%/vmware/perfcharts/vmwareperfcharts-runtime.log",

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.7'
  title: VCPF-70-000007
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts log files must only be modifiable by privileged users. GROUP ID: V-256617 RULE ID: SV-256617r888342'
  rationale: 'Log data is essential in the investigation of events. The accuracy of the information is always pertinent. One
    of the first steps an attacker will undertake is the modification or deletion of log records to cover tracks and prolong
    discovery. The web server must protect the log data from unauthorized modification. Performance Charts restricts all modification
    of log files by default, but this configuration must be verified. Satisfies: SRG-APP-000118-WSR-000068, SRG-APP-000119-WSR-000069,
    SRGAPP-000120-WSR-000070'
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'At the command prompt, run the following command:

    # find /storage/log/vmware/perfcharts/ -xdev -type f -a ''('' -perm -o+w -o -

    not -user perfcharts -o -not -group users '')'' -exec ls -ld {} \;

    If any files are returned, this is a finding.'
  remediation: 'At the command prompt, run the following commands:

    # chmod o-w <file>

    # chown perfcharts:users <file>

    Note: Substitute with the listed file.'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # find /storage/log/vmware/perfcharts/ -xdev -type f -a ''('' -perm -o+w -o -

      not -user perfcharts -o -not -group users '')'' -exec ls -ld {} \;

      If any files are returned, this is a finding.'
    severity: medium
- id: '1.8'
  title: VCPF-70-000008
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts application files must be verified for their integrity. GROUP ID: V-256618 RULE ID: SV-256618r888345'
  rationale: Verifying the Security Token Service application code is unchanged from its shipping state is essential for file
    validation and nonrepudiation of Performance Charts. There is no reason the MD5 hash of the RPM original files should
    be changed after installation, excluding configuration files.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'At the command prompt, run the following command:

    "\.properties|\.conf|\.xml|\.password"

    If any files are returned, this is a finding.'
  remediation: 'Reinstall the vCenter Server Appliance (VCSA) or roll back to a backup. VMware does

    not support modifying the Performance Charts installation files manually.'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      "\.properties|\.conf|\.xml|\.password"

      If any files are returned, this is a finding.'
    severity: medium
- id: '1.9'
  title: VCPF-70-000009
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts must only run one webapp. GROUP ID: V-256619 RULE ID: SV-256619r888348'
  rationale: VMware ships Performance Charts on the vCenter Server Appliance (VCSA)with one webapp. Any other path is potentially
    malicious and must be removed.
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'At the command prompt, run the following command:

    # ls -A /usr/lib/vmware-perfcharts/tc-instance/webapps

    Expected result:

    statsreport

    If the output does not match the expected result, this is a finding.'
  remediation: 'For each unexpected directory returned in the check, run the following command:

    # rm /usr/lib/vmware-perfcharts/tc-instance/webapps/<NAME>

    Restart the service with the following command:

    # vmon-cli --restart perfcharts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # ls -A /usr/lib/vmware-perfcharts/tc-instance/webapps

      Expected result:

      statsreport

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.10'
  title: VCPF-70-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts must not be configured with unsupported realms. GROUP ID: V-256620 RULE ID: SV-256620r888351'
  rationale: Performance Charts performs user authentication at the application level and not through Tomcat. Depending on
    the vCenter Server Appliance (VCSA) version, Performance Charts may come configured with a "UserDatabaseRealm". This should
    be removed as part of eliminating unnecessary features.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'At the command prompt, run the following command:

    # grep UserDatabaseRealm /usr/lib/vmware-perfcharts/tcinstance/conf/server.xml

    If the command produces any output, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-perfcharts/tc-instance/conf/server.xml

    Remove the <Realm> node returned in the check.

    Restart the service with the following command:

    # vmon-cli --restart perfcharts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep UserDatabaseRealm /usr/lib/vmware-perfcharts/tcinstance/conf/server.xml

      If the command produces any output, this is a finding.'
    severity: medium
- id: '1.11'
  title: VCPF-70-000011
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts must be configured to limit access to internal packages. GROUP ID: V-256621 RULE ID: SV-256621r888354'
  rationale: The "package.access" entry in the "catalina.properties" file implements access control at the package level.
    When properly configured, a Security Exception will be reported if an errant or malicious webapp attempts to access the
    listed internal classes directly or if a new class is defined under the protected packages. Performance Charts comes preconfigured
    with the appropriate packages defined in "package.access", and this configuration must be maintained.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'At the command prompt, run the following command:

    # grep "package.access" /usr/lib/vmware-perfcharts/tcinstance/conf/catalina.properties

    Expected result:

    package.access=sun.,org.apache.catalina.,org.apache.coyote.,org.apache.jasper.,org.a

    pache.tomcat.

    If the output of the command does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/catalina.properties

    Ensure the "package.access" line is configured as follows:

    package.access=sun.,org.apache.catalina.,org.apache.coyote.,org.apache.jasper.,org.a

    pache.tomcat.

    Restart the service with the following command:

    # vmon-cli --restart perfcharts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep "package.access" /usr/lib/vmware-perfcharts/tcinstance/conf/catalina.properties

      Expected result:

      package.access=sun.,org.apache.catalina.,org.apache.coyote.,org.apache.jasper.,org.a

      pache.tomcat.

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.12'
  title: VCPF-70-000012
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts must have Multipurpose Internet Mail Extensions (MIMEs) that invoke operating system shell
    programs disabled. GROUP ID: V-256622 RULE ID: SV-256622r888357'
  rationale: MIME mappings tell Performance Charts what type of program various file types and extensions are and what external
    utilities or programs are needed to execute the file type. By ensuring various shell script MIME types are not included
    in "web.xml", the server is protected against malicious users tricking the server into executing shell command files.
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'At the command prompt, run the following command:

    # grep -En ''(x-csh<)|(x-sh<)|(x-shar<)|(x-ksh<)'' /usr/lib/vmwareperfcharts/tc-instance/conf/web.xml

    If the command produces any output, this is a finding.'
  remediation: "Navigate to and open:\n/usr/lib/vmware-perfcharts/tc-instance/conf/web.xml\nRemove any and all of the following\
    \ nodes lines:\n<mime-type>application/x-csh</mime-type>\n<mime-type>application/x-shar</mime-type>\n<mime-type>application/x-sh</mime-type>\n\
    <mime-type>application/x-ksh</mime-type>\nRestart the service with the following command:\n# vmon-cli --restart perfcharts\n\
    Note: Delete the entire mime-mapping node for the target mime-type.\nExample:\n<mime-mapping>\n <extension>sh</extension>\n\
    \ <mime-type>application/x-sh</mime-type>\n</mime-mapping>"
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep -En ''(x-csh<)|(x-sh<)|(x-shar<)|(x-ksh<)'' /usr/lib/vmwareperfcharts/tc-instance/conf/web.xml

      If the command produces any output, this is a finding.'
    severity: medium
- id: '1.13'
  title: VCPF-70-000013
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts must have mappings set for Java servlet pages. GROUP ID: V-256623 RULE ID: SV-256623r888360'
  rationale: Resource mapping is the process of tying a particular file type to a process in the web server that can serve
    that type of file to a requesting client and identify which file types are not to be delivered to a client. By not specifying
    which files can and cannot be served to a user, the web server could deliver to a user web server configuration files,
    log files, password files, etc. Because Tomcat is a Java-based web server, the main file extension used is *.jsp. This
    check ensures the *.jsp and *.jspx file types have been properly mapped to servlets.
  impact: ''
  references: []
  page_start: 34
  audit_raw: "At the command prompt, run the following command:\n# xmllint --format /usr/lib/vmware-perfcharts/tc-instance/conf/web.xml\
    \ | sed\n's/xmlns=\".*\"//g' | xmllint --xpath '/web-app/servlet-mapping/servletname[text()=\"jsp\"]/parent::servlet-mapping'\
    \ -\nExpected result:\n<servlet-mapping>\n <servlet-name>jsp</servlet-name>\n <url-pattern>*.jsp</url-pattern>\n <url-pattern>*.jspx</url-pattern>\n\
    </servlet-mapping>\nIf the output of the command does not match the expected result, this is a finding."
  remediation: "Navigate to and open:\n/usr/lib/vmware-perfcharts/tc-instance/conf/web.xml\nInside the <web-app> parent node,\
    \ add the following:\n<servlet-mapping>\n <servlet-name>jsp</servlet-name>\n <url-pattern>*.jsp</url-pattern>\n <url-pattern>*.jspx</url-pattern>\n\
    </servlet-mapping>\nRestart the service with the following command:\n# vmon-cli --restart perfcharts"
  checks:
  - type: manual_review
    info: "At the command prompt, run the following command:\n# xmllint --format /usr/lib/vmware-perfcharts/tc-instance/conf/web.xml\
      \ | sed\n's/xmlns=\".*\"//g' | xmllint --xpath '/web-app/servlet-mapping/servletname[text()=\"jsp\"]/parent::servlet-mapping'\
      \ -\nExpected result:\n<servlet-mapping>\n <servlet-name>jsp</servlet-name>\n <url-pattern>*.jsp</url-pattern>\n <url-pattern>*.jspx</url-pattern>\n\
      </servlet-mapping>\nIf the output of the command does not match the expected result, this is a finding."
    severity: medium
- id: '1.14'
  title: VCPF-70-000014
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts must not have the Web Distributed Authoring (WebDAV) servlet installed. GROUP ID: V-256624
    RULE ID: SV-256624r888363'
  rationale: WebDAV is an extension to the HTTP protocol that, when developed, was meant to allow users to create, change,
    and move documents on a server, typically a web server or web share. WebDAV is not widely used and has serious security
    concerns because it may allow clients to modify unauthorized files on the web server and must therefore be disabled. Tomcat
    uses the "org.apache.catalina.servlets.WebdavServlet" servlet to provide WebDAV services. Because the WebDAV service has
    been found to have an excessive number of vulnerabilities, this servlet must not be installed. Performance Charts does
    not configure WebDAV by default.
  impact: ''
  references: []
  page_start: 36
  audit_raw: 'At the command prompt, run the following command:

    # grep -n ''webdav'' /usr/lib/vmware-perfcharts/tc-instance/conf/web.xml

    If the command produces any output, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-perfcharts/tc-instance/conf/web.xml

    Find the <servlet-name>webdav</servlet-name> node and remove the entire parent

    <servlet> block.

    Restart the service with the following command:

    # vmon-cli --restart perfcharts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

