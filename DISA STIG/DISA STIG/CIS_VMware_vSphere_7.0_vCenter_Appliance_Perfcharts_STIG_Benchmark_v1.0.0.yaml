    Locate and navigate to ''allowTrace="true"''.

    Remove the ''allowTrace="true"'' setting.

    Restart the service with the following command:

    # vmon-cli --restart perfcharts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep allowTrace /usr/lib/vmware-perfcharts/tc-instance/conf/server.xml

      If "allowTrace" is set to "true", this is a finding.

      If no line is returned, this is not a finding.'
    severity: medium
- id: '1.28'
  title: VCPF-70-000028
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts must have the debug option turned off. GROUP ID: V-256638 RULE ID: SV-256638r888405'
  rationale: Information needed by an attacker to begin looking for possible vulnerabilities in a web server includes any
    information about the web server and plug-ins or modules being used. When debugging or trace information is enabled in
    a production web server, information about the web server, such as web server type, version, patches installed, plug-ins
    and modules installed, type of code being used by the hosted application, and any backends being used for data storage
    may be displayed. Because this information may be placed in logs and general messages during normal operation of the web
    server, an attacker does not need to cause an error condition to gain this information. The Performance Charts Service
    can be configured to set the debugging level. By setting the debugging level to zero, no debugging information will be
    provided to a malicious user.
  impact: ''
  references: []
  page_start: 64
  audit_raw: "At the command prompt, run the following command:\n# xmllint --format /usr/lib/vmware-perfcharts/tc-instance/conf/web.xml\
    \ | sed\n's/xmlns=\".*\"//g' | xmllint --xpath '//paramname[text()=\"debug\"]/parent::init-param' -\nExpected result:\n\
    <init-param>\n <param-name>debug</param-name>\n <param-value>0</param-value>\n</init-param>\nIf the output of the command\
    \ does not match the expected result, this is a finding.\nIf no lines is returned, this is not a finding."
  remediation: "Navigate to and open:\n/usr/lib/vmware-perfcharts/tc-instance/conf/web.xml\nNavigate to all <debug> nodes\
    \ that are not set to \"0\".\nSet the <param-value> to \"0\" in all <param-name>debug</param-name> nodes.\nNote: The debug\
    \ setting should look like the following:\n<init-param>\n <param-name>debug</param-name>\n <param-value>0</param-value>\n\
    </init-param>\nRestart the service with the following command:\n# vmon-cli --restart perfcharts"
  checks:
  - type: manual_review
    info: "At the command prompt, run the following command:\n# xmllint --format /usr/lib/vmware-perfcharts/tc-instance/conf/web.xml\
      \ | sed\n's/xmlns=\".*\"//g' | xmllint --xpath '//paramname[text()=\"debug\"]/parent::init-param' -\nExpected result:\n\
      <init-param>\n <param-name>debug</param-name>\n <param-value>0</param-value>\n</init-param>\nIf the output of the command\
      \ does not match the expected result, this is a finding.\nIf no lines is returned, this is not a finding."
    severity: medium
- id: '1.29'
  title: VCPF-70-000029
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts must properly configure log sizes and rotation. GROUP ID: V-256639 RULE ID: SV-256639r888408'
  rationale: To ensure the logging mechanism used by the web server has sufficient storage capacity in which to write the
    logs, the logging mechanism must be able to allocate log record storage capacity. Performance Charts properly sizes and
    configures log rotation during installation. This default configuration must be verified.
  impact: ''
  references: []
  page_start: 66
  audit_raw: 'At the command prompt, run the following command:

    If the command returns any output, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/vmware-perfcharts/log4j.properties

    Ensure the appender.rolling entries are configured as follows:

    appender.rolling.type = RollingFile

    appender.rolling.name = FileLog

    appender.rolling.fileName = /var/log/vmware/perfcharts/stats.log

    appender.rolling.filePattern = /var/log/vmware/perfcharts/stats-%i.log

    appender.rolling.policies.type = Policies

    appender.rolling.policies.size.type = SizeBasedTriggeringPolicy

    appender.rolling.policies.size.size = 5MB

    appender.rolling.strategy.type = DefaultRolloverStrategy

    appender.rolling.strategy.max = 10

    appender.rolling.layout.type = PatternLayout

    appender.rolling.layout.pattern = %d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX} [%t %-5p

    %c] %m%n

    appender.rolling.level = info

    Note: This fix is currently only applicable to 7.0 U2+ and is different in older versions.'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      If the command returns any output, this is a finding.'
    severity: medium
- id: '1.30'
  title: VCPF-70-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Rsyslog must be configured to monitor and ship Performance Charts log files. GROUP ID: V-256640 RULE ID: SV-256640r888411'
  rationale: 'Performance Charts produces several logs that must be offloaded from the originating system. This information
    can then be used for diagnostic purposes, forensics purposes, or other purposes relevant to ensuring the availability
    and integrity of the hosted application. Satisfies: SRG-APP-000358-WSR-000163, SRG-APP-000125-WSR-000071'
  impact: ''
  references: []
  page_start: 68
  audit_raw: 'At the command prompt, run the following command:

    # rpm -V VMware-visl-integration|grep vmware-services-perfcharts.conf|grep

    If the command returns any output, this is a finding.'
  remediation: "Navigate to and open:\n/etc/vmware-syslog/vmware-services-perfcharts.conf\nCreate the file if it does not\
    \ exist.\nSet the contents of the file as follows:\n#stats\ninput(type=\"imfile\"\n File=\"/var/log/vmware/perfcharts/stats.log\"\
    \n Tag=\"perfcharts-stats\"\n Severity=\"info\"\n Facility=\"local0\")\n#localhost_access_log\ninput(type=\"imfile\"\n\
    \ File=\"/var/log/vmware/perfcharts/localhost_access_log.txt\"\n Tag=\"perfcharts-localhost_access\"\n Severity=\"info\"\
    \n Facility=\"local0\")\n#vmware-perfcharts-gc.log\ninput(type=\"imfile\"\n File=\"/var/log/vmware/perfcharts/vmware-perfcharts-gc.log.*.current\"\
    \n Tag=\"perfcharts-gc\"\n Severity=\"info\"\n Facility=\"local0\")\n#vmware-perfcharts-runtime.log\ninput(type=\"imfile\"\
    \n File=\"/var/log/vmware/perfcharts/vmware-perfcharts-runtime.log.std*\"\n Tag=\"perfcharts-runtime\"\n Severity=\"info\"\
    \n Facility=\"local0\")"
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # rpm -V VMware-visl-integration|grep vmware-services-perfcharts.conf|grep

      If the command returns any output, this is a finding.'
    severity: medium
- id: '1.31'
  title: VCPF-70-000031
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts must be configured with the appropriate ports. GROUP ID: V-256641 RULE ID: SV-256641r888414'
  rationale: Web servers provide numerous processes, features, and functionalities that use TCP/IP ports. Some of these processes
    may be deemed unnecessary or too unsecure to run on a production system. The ports that Performance Charts listens on
    are configured in the "catalina.properties" file and must be verified as accurate to their shipping state.
  impact: ''
  references: []
  page_start: 70
  audit_raw: 'At the command prompt, run the following command:

    # grep ''^bio\.'' /usr/lib/vmware-perfcharts/tcinstance/conf/catalina.properties

    Expected result:

    bio.http.port=13080

    If the output of the command does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/vmware-eam/catalina.properties

    Navigate to the ports specification section.

    Add or modify the following lines:

    bio.http.port=13080

    Restart the service with the following command:

    # vmon-cli --restart perfcharts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep ''^bio\.'' /usr/lib/vmware-perfcharts/tcinstance/conf/catalina.properties

      Expected result:

      bio.http.port=13080

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.32'
  title: VCPF-70-000032
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts must disable the shutdown port. GROUP ID: V-256642 RULE ID: SV-256642r888417'
  rationale: An attacker has at least two reasons to stop a web server. The first is to cause a denial of service, and the
    second is to put in place changes the attacker made to the web server configuration. If the Tomcat shutdown port feature
    is enabled, a shutdown signal can be sent to Performance Charts through this port. To ensure availability, the shutdown
    port must be disabled.
  impact: ''
  references: []
  page_start: 72
  audit_raw: 'At the command prompt, run the following command:

    # grep base.shutdown.port /usr/lib/vmware-perfcharts/tcinstance/conf/catalina.properties

    Expected result:

    base.shutdown.port=-1

    If the output of the command does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/vmware-eam/catalina.properties

    Navigate to the ports specification section.

    Add or modify the following line:

    base.shutdown.port=-1

    Restart the service with the following command:

    # vmon-cli --restart perfcharts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep base.shutdown.port /usr/lib/vmware-perfcharts/tcinstance/conf/catalina.properties

      Expected result:

      base.shutdown.port=-1

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.33'
  title: VCPF-70-000033
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts must set the secure flag for cookies. GROUP ID: V-256643 RULE ID: SV-256643r888420'
  rationale: The secure flag is an option that can be set by the application server when sending a new cookie to the user
    within an HTTP response. The purpose of the secure flag is to prevent cookies from being observed by unauthorized parties
    due to the transmission of a cookie in clear text. By setting the secure flag, the browser will prevent the transmission
    of a cookie over an unencrypted channel. The Performance Charts is configured to only be accessible over a Transport Layer
    Security (TLS) tunnel, but this cookie flag is still a recommended best practice.
  impact: ''
  references: []
  page_start: 74
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --format /usr/lib/vmware-perfcharts/tcinstance/webapps/statsreport/WEB-INF/web.xml | sed ''s/xmlns=".*"//g''
    |

    xmllint --xpath ''/web-app/session-config/cookie-config/secure'' -

    Expected result:

    <secure>true</secure>

    If the output of the command does not match the expected result, this is a finding.'
  remediation: "Navigate to and open:\n/usr/lib/vmware-perfcharts/tc-instance/webapps/statsreport/WEB-INF/web.xml\nNavigate\
    \ to the <session-config> node and configure it as follows:\n<session-config>\n <cookie-config>\n <http-only>true</http-only>\n\
    \ <secure>true</secure>\n </cookie-config>\n <session-timeout>6</session-timeout>\n</session-config>\nRestart the service\
    \ with the following command:\n# vmon-cli --restart perfcharts"
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --format /usr/lib/vmware-perfcharts/tcinstance/webapps/statsreport/WEB-INF/web.xml | sed ''s/xmlns=".*"//g''
      |

      xmllint --xpath ''/web-app/session-config/cookie-config/secure'' -

      Expected result:

      <secure>true</secure>

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.34'
  title: VCPF-70-000034
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Performance Charts default servlet must be set to "readonly". GROUP ID: V-256644 RULE ID: SV-256644r888423'
  rationale: The default servlet (or DefaultServlet) is a special servlet provided with Tomcat that is called when no other
    suitable page is found in a particular folder. The DefaultServlet serves static resources as well as directory listings.
    The DefaultServlet is configured by default with the "readonly" parameter set to "true" where HTTP commands such as PUT
    and DELETE are rejected. Changing this to "false" allows clients to delete or modify static resources on the server and
    to upload new resources. DefaultServlet "readonly" must be set to "true", either literally or by absence (default).
  impact: ''
  references: []
  page_start: 76
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --format /usr/lib/vmware-perfcharts/tc-instance/conf/web.xml | sed

    ''s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/servlet/servletname[text()="default"]/../init-param/param-name[text()="readonly"]/../paramvalue[text()="false"]''
    -

    Expected result:

    XPath set is empty

    If the output of the command does not match the expected result, this is a finding.'
  remediation: "Navigate to and open:\n/usr/lib/vmware-perfcharts/tc-instance/conf/web.xml\nNavigate to the /<web-apps>/<servlet>/<servlet-name>default</servletname>/\
    \ node and remove the following node:\n<init-param>\n <param-name>readonly</param-name>\n <param-value>false</param-value>\n\
    </init-param>\nRestart the service with the following command:\n# vmon-cli --restart perfcharts"
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --format /usr/lib/vmware-perfcharts/tc-instance/conf/web.xml | sed

      ''s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/servlet/servletname[text()="default"]/../init-param/param-name[text()="readonly"]/../paramvalue[text()="false"]''
      -

      Expected result:

      XPath set is empty

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
