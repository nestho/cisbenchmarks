    \ the example below:\ncrypto pki trustpoint CA_X\n enrollment url http://trustpoint1.example.com\nNote: A remote endpoint's\
    \ certificate will always be validated by the switch by verifying\nthe signature of the CA on the certificate using the\
    \ CA's public key, which is contained\nin the switch's certificate that it received at enrollment.\nIf the Cisco switch\
    \ is not configured to obtain its public key certificates from an\nappropriate certificate policy through an approved\
    \ service provider, this is a finding."
  remediation: 'Configure the switch to obtain its public key certificates from an appropriate certificate

    policy through an approved service provider as show in the example below:

    SW2(ca-trustpoint)#enrollment url http://trustpoint1.example.com'
