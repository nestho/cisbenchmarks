  rationale: If the application allows the user to consecutively reuse extensive portions of passwords, this increases the
    chances of password compromise by increasing the window of opportunity for attempts at guessing and brute-force attacks.
    The number of changed characters refers to the number of changes required with respect to the total number of positions
    in the current password. In other words, characters may be the same within the two passwords; however, the positions of
    the like characters must be different. Multifactor authentication (MFA) is required for all administrative and user accounts
    on network devices, except for an account of last resort and (where applicable) a root account. Passwords should only
    be used when MFA using PKI is not available and for the account of last resort and root account.
