- id: '1.39'
  title: CISC-ND-001370
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco switch must be configured to use at least two authentication servers to authenticate users prior
    to granting administrative access. GROUP ID: V-220617 RULE ID: SV-220617r961863'
  rationale: Centralized management of user accounts and authentication increases the administrative access to the switch.
    This control is particularly important protection against the insider threat. With robust centralized management, audit
    records for administrator account access to the organization's network devices can be more readily analyzed for trends
    and anomalies. The alternative method of defining administrator accounts on each device exposes the device configuration
    to remote access authentication attacks and system administrators with multiple authenticators for each network device.
  impact: ''
  references: []
  page_start: 87
  audit_raw: "Review the Cisco switch configuration to verify that the device is configured to use at\nleast two authentication\
    \ servers as the primary source for authentication as shown in\nthe example below:\naaa new-model\n!\naaa authentication\
    \ CONSOLE local\naaa authentication login LOGIN_AUTHENTICATION group radius local\n…\n…\n…\nip http authentication aaa\
    \ login-authentication LOGIN_AUTHENTICATION\nip http secure-server\n…\n…\n…\nradius-server host x.x.x.x auth-port 1812\
    \ acct-port 1813 key xxxxxxx\nradius-server host x.x.x.x auth-port 1812 acct-port 1813 key xxxxxxx\n…\n…\n…\nline con\
    \ 0\n exec-timeout 5 0\n login authentication CONSOLE\nline vty 0 1\n exec-timeout 5 0\n login authentication LOGIN_AUTHENTICATION\n\
    If the Cisco switch is not configured to use at least two authentication servers to\nauthenticate users prior to granting\
    \ administrative access, this is a finding."
  remediation: 'Step 1: Configure the Cisco switch to use at least two authentication servers as shown

    in the example below:

    SW4(config)#radius host 10.1.48.2 key xxxxxx

    SW4(config)#radius host 10.1.48.3 key xxxxxx

    Step 2: Configure the authentication order to use the authentication servers as the

    primary source for authentication as shown in the example below:

    SW4(config)#aaa authentication CONSOLE local

    SW4(config)#aaa authentication login LOGIN_AUTHENTICATION group radius local

    Step 3: Configure all network connections associated with device management to use

    the authentication servers for login authentication:

    SW4(config)#line vty 0 1

    SW4(config-line)#login authentication LOGIN_AUTHENTICATION

    SW4(config-line)#exit

    SW4(config)#line con 0

    SW4(config-line)#login authentication CONSOLE

    SW4(config-line)#exit

    SW4(config)#ip http authentication aaa login-authentication

    LOGIN_AUTHENTICATION'
  checks:
  - type: manual_review
    info: 'Review the Cisco switch configuration to verify that the device is configured to use at

      least two authentication servers as the primary source for authentication as shown in

      the example below:

      aaa new-model

      !

      aaa authentication CONSOLE local

      aaa authentication login LOGIN_AUTHENTICATION group radius local

      …

      …

      …

      ip http authentication aaa login-authentication LOGIN_AUTHENTICATION

      ip http secure-server

      …

      …

      …

      radius-server host x.x.x.x auth-port 1812 acct-port 1813 key xxxxxxx

      radius-server host x.'
    severity: medium
- id: '1.40'
  title: CISC-ND-001410
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to support organizational requirements to conduct backups of the configuration
    when changes occur. GROUP ID: V-220618 RULE ID: SV-220618r1069531'
  rationale: System-level information includes default and customized settings and security attributes, including access control
    lists (ACLs) that relate to the network device configuration, as well as software required for the execution and operation
    of the device. Information system backup is a critical step in ensuring system integrity and availability. If the system
    fails and there is no backup of the system-level information, a denial-ofservice condition is possible for all who use
    this critical network component. The network device must support the organizational central backup process for systemlevel
    information associated with the network device. This function may be provided by the network device itself; however, the
    preferred best practice is a centralized backup rather than each network device performing discrete backups.
  impact: ''
  references: []
  page_start: 90
  audit_raw: "Review the Cisco switch configuration to verify that it backs up the configuration when\nchanges occur. The\
    \ example configuration below will send the configuration to a SCP\nserver when a configuration change occurs:\nevent\
    \ manager applet BACKUP_CONFIG\n event syslog pattern \"%SYS-5-CONFIG_I\"\n action 1 info type switchname\n action 2 cli\
    \ command \"enable\"\n action 3 cli command \"copy run scp\" pattern \"remote host\"\n action 4 cli command \"x.x.x.x\"\
    \ pattern \"filename\"\n action 5 cli command \"$_info_switchname-config\"\n action 6 syslog priority informational msg\
    \ \"Configuration backup was\nexecuted\"\nIf the Cisco switch is not configured to conduct backups of the configuration\
    \ when\nchanges occur, this is a finding."
  remediation: 'Configure the Cisco switch to send the configuration to a SCP server when a

    configuration change occurs as shown in the example below:

    SW4(config)#event manager applet BACKUP_CONFIG

    SW4(config-applet)#event syslog pattern "%SYS-5-CONFIG_I"

    SW4(config-applet)#action 1 cli command "enable"

    SW4(config-applet)#action 2 info type switchname

    SW4(config-applet)#action 3 cli command "copy run scp" pattern "remote host"

    SW4(config-applet)#action 4 cli command "x.x.x.x" pattern "filename"

    SW4(config-applet)#action 5 cli command "$_info_switchname-config"

    SW4(config-applet)#action 6 syslog priority informational msg "Configuration

    backup was executed"

    SW4(config-applet)#end'
  checks:
  - type: manual_review
    info: "Review the Cisco switch configuration to verify that it backs up the configuration when\nchanges occur. The example\
      \ configuration below will send the configuration to a SCP\nserver when a configuration change occurs:\nevent manager\
      \ applet BACKUP_CONFIG\n event syslog pattern \"%SYS-5-CONFIG_I\"\n action 1 info type switchname\n action 2 cli command\
      \ \"enable\"\n action 3 cli command \"copy run scp\" pattern \"remote host\"\n action 4 cli command \"x.x.x.x\" pattern\
      \ \"filename\"\n action 5 cli command \"$_info_switchna"
    severity: medium
