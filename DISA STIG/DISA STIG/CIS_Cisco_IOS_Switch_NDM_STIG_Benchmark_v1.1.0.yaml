  title: CISC-ND-000490
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured with only one local account to be used as the account of last resort in
    the event the authentication server is unavailable. GROUP ID: V-220587 RULE ID: SV-220587r1051115'
  rationale: Authentication for administrative (privileged-level) access to the device is required at all times. An account
    can be created on the device's local database for use when the authentication server is down or connectivity between the
    device and the authentication server is not operable. This account is referred to as the account of last resort since
    it is intended to be used as a last resort and when immediate administrative access is absolutely necessary. The account
    of last resort logon credentials must be stored in a sealed envelope and kept in a safe. The safe must be periodically
    audited to verify the envelope remains sealed. The signature of the auditor and the date of the audit should be added
    to the envelope as a record. An alternative to using a sealed envelope in a safe would be credential files, separated
    by technology, located in a secured location on a file server, with the files only accessible to those administrators
    authorized to use the accounts of last resort, and access to that location monitored by a central log server. Administrators
    should secure the credentials and disable the root account (if possible) when not needed for system administration functions.
  impact: ''
  references: []
  page_start: 43
  audit_raw: 'Step 1: Review the Cisco switch configuration to verify that a local account for last

    resort has been configured with a privilege level that will enable the administrator to

    troubleshoot connectivity to the authentication server.

    username xxxxxxxxxxx privilege 10 common-criteria-policy PASSWORD_POLICY

    password xxxxxxxxxx

    Note: The configured Common Criteria policy must be used when creating or changing

    the local account password as shown in the example above.

    Step 2: Verify that local is defined after radius or tacacs+ in the authentication order as

    shown in the example below:

    aaa authentication login default group tacacs+ local

    If the Cisco switch is not configured with only one local account to be used as the

    account of last resort in the event the authentication server is unavailable, this is a

    finding.'
  remediation: 'Step 1: Configure a local account with the necessary privilege level to troubleshoot

    network outage and restore operations as shown in the following example:

    SW2(config)#username xxxxxxxxxxx privilege 10 common-criteria-policy

    PASSWORD_POLICY password xxxxxxxxxx

    Step 2: Configure the authentication order to use the local account if the authentication

    server is not reachable as shown in the following example:

    SW2(config)#aaa authentication login default group tacacs+ local'
  checks:
  - type: manual_review
    info: 'Step 1: Review the Cisco switch configuration to verify that a local account for last

