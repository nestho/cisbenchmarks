    \ finding."
  remediation: 'Configure the switch to log account disabling using the following commands:

    SW4(config)#archive

    SW4(config-archive)#log config

    SW4(config-archive-log-cfg)#logging enable

    SW4(config-archive-log-cfg)#end'
  checks:
