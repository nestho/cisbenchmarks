    policy through an approved service provider. GROUP ID: V-220619 RULE ID: SV-220619r991871'
  rationale: Each organization obtains user certificates from an approved, shared service provider as required by OMB policy.
    For federal agencies operating a legacy public key infrastructure cross-certified with the Federal Bridge Certification
    Authority (CA) at medium assurance or higher, this CA will suffice.
