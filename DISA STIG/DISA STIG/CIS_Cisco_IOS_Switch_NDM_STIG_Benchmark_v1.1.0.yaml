  description: 'The Cisco switch must be configured to send log data to at least two central log servers for the purpose of
    forwarding alerts to the administrators and the information system security officer (ISSO). GROUP ID: V-220620 RULE ID:
    SV-220620r961863'
  rationale: The aggregation of log data kept on a syslog server can be used to detect attacks and trigger an alert to the
    appropriate security personnel. The stored log data can used to detect weaknesses in security that enable the network
    Information Assurance (IA) team to find and address these weaknesses before breaches can occur. Reviewing these logs,
    whether before or after a security breach, is important in showing whether someone is an internal employee or an outside
    threat.
