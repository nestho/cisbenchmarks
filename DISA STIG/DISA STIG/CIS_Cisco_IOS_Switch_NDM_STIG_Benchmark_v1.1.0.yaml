- id: '1.24'
  title: CISC-ND-000620
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco switch must only store cryptographic representations of passwords. GROUP ID: V-220595 RULE ID: SV-220595r1015286'
  rationale: Passwords need to be protected at all times, and encryption is the standard method for protecting passwords.
    If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised. Network devices must
    enforce cryptographic representations of passwords when storing passwords in databases, configuration files, and log files.
    Passwords must be protected at all times; using a strong one-way hashing encryption algorithm with a salt is the standard
    method for providing a means to validate a password without having to store the actual password. Performance and time
    required to access are factors that must be considered, and the one-way hash is the most feasible means of securing the
    password and providing an acceptable measure of password security. If passwords are stored in clear text, they can be
    plainly read and easily compromised. In many instances, verification that the user knows a password is performed using
    a password verifier. In its simplest form, a password verifier is a computational function that is capable of creating
    a hash of a password and determining if the value provided by the user matches the stored hash.
  impact: ''
  references: []
  page_start: 57
  audit_raw: 'Review the switch configuration to determine if passwords are encrypted as shown in

    the example below:

    service password-encryption

    …

    …

    …

    Enable secret 5 xxxxxxxxxxxxxxxxxxxxxxxxxx

    If the switch is not configured to encrypt passwords, this is a finding.'
  remediation: 'Configure the switch to encrypt all passwords:

    SW4(config)#service password-encryption

    SW4(config)#enable secret xxxxxxxxxxxx

    SW4(config)#end'
  checks:
  - type: manual_review
    info: 'Review the switch configuration to determine if passwords are encrypted as shown in

      the example below:

      service password-encryption

      …

      …

      …

      Enable secret 5 xxxxxxxxxxxxxxxxxxxxxxxxxx

      If the switch is not configured to encrypt passwords, this is a finding.'
    severity: medium
- id: '1.25'
  title: CISC-ND-000720
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco switch must be configured to terminate all network connections associated with device management
    after five minutes of inactivity. GROUP ID: V-220596 RULE ID: SV-220596r961068'
  rationale: Terminating an idle session within a short time period reduces the window of opportunity for unauthorized personnel
    to take control of a management session enabled on the console or console port that has been left unattended. In addition,
    quickly terminating an idle session will free up resources committed by the managed network element. Terminating network
    connections associated with communications sessions includes, for example, de-allocating associated TCP/IP address/port
    pairs at the operating system level or de-allocating networking assignments at the application level if multiple application
    sessions are using a single, operating system-level network connection. This does not mean that the device terminates
    all sessions or network access; it only ends the inactive session and releases the resources associated with that session.
  impact: ''
  references: []
  page_start: 59
  audit_raw: "Review the Cisco switch configuration to verify that all network connections associated\nwith a device management\
    \ have an idle timeout value set to five minutes or less as\nshown in the example below:\nip http secure-server\nip http\
    \ timeout-policy idle 300 life nnnn requests nn\n…\n…\n…\nline con 0\n exec-timeout 5 0\nline vty 0 1\n exec-timeout 5\
    \ 0\nIf the Cisco switch is not configured to terminate all network connections associated\nwith a device management after\
    \ five minutes of inactivity, this is a finding."
  remediation: 'Set the idle timeout value to five minutes or less on all configured login classes as

    shown in the example below:

    SW1(config)#line vty 0 1

    SW1(config-line)#exec-timeout 5 0

    SW1(config-line)#exit

    SW1(config)#line con 0

    SW1(config-line)#exec-timeout 5 0

    SW1(config-line)#exit

    SW2(config)#ip http timeout-policy idle 300 life nnnn requests nn'
