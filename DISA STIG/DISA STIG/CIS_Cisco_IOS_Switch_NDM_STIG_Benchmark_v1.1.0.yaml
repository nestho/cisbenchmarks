- id: '1.16'
  title: CISC-ND-000470
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco switch must be configured to prohibit the use of all unnecessary and nonsecure functions and services.
    GROUP ID: V-220586 RULE ID: SV-220586r1043177'
  rationale: Network devices are capable of providing a wide variety of functions and services. Some of the functions and
    services provided by default may not be necessary to support essential organizational operations. Additionally, it is
    sometimes convenient to provide multiple services from a single component (e.g., email and web services); however, doing
    so increases risk over limiting the services provided by any one component. To support the requirements and principles
    of least functionality, the network device must support the organizational requirements providing only essential capabilities
    and limiting the use of ports, protocols, and/or services to only those required, authorized, and approved. Some network
    devices have capabilities enabled by default; if these capabilities are not necessary, they must be disabled. If a particular
    capability is used, it must be documented and approved.
  impact: ''
  references: []
  page_start: 40
  audit_raw: 'Verify that the switch does not have any unnecessary or nonsecure ports, protocols,

    and services enabled.

    For example, the following commands should not be in the configuration:

    boot network

    ip boot server

    ip bootp server

    ip dns server

    ip identd

    ip finger

    ip http server

    ip rcmd rcp-enable

    ip rcmd rsh-enable

    service config

    service finger

    service tcp-small-servers

    service udp-small-servers

    service pad

    service call-home

    Note: Certain legacy devices may require ''service call-home'' be enabled to support

    Smart Licensing as they do not support the newer smart transport configuration. Those

    devices do not incur a finding for having call-home enabled for Smart Licensing.

    If any unnecessary or nonsecure ports, protocols, or services are enabled, this is a

    finding.'
  remediation: 'Disable the following services if enabled as shown in the example below:

