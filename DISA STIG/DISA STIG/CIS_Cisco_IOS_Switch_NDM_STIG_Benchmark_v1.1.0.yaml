controls:
- id: '1.1'
  title: CISC-ND-000010
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to limit the number of concurrent management sessions to an organization-defined
    number. GROUP ID: V-220570 RULE ID: SV-220570r960735'
  rationale: Device management includes the ability to control the number of administrators and management sessions that manage
    a device. Limiting the number of allowed administrators and sessions per administrator based on account type, role, or
    access type is helpful in limiting risks related to DoS attacks. This requirement addresses concurrent sessions for administrative
    accounts and does not address concurrent sessions by a single administrator via multiple administrative accounts. The
    maximum number of concurrent sessions should be defined based on mission needs and the operational environment for each
    system. At a minimum, limits must be set for SSH, HTTPS, account of last resort, and root account sessions.
  impact: ''
  references: []
  page_start: 11
  audit_raw: "Note: This requirement is not applicable to file transfer actions such as FTP, SCP, and\nSFTP.\nReview the switch\
    \ configuration to determine if concurrent management sessions are\nlimited as show in the example below:\nip http secure-server\n\
    ip http max-connections 2\n…\n…\n…\nFor platforms that support the session-limit command:\nline vty 0 4\n session-limit\
    \ 2\n transport input ssh\nFor platforms that do not support the session-limit command, the sessions can also be\nlimited\
    \ by reducing the number of active vty lines as shown in the example below:\nline vty 0 1\n transport input ssh\nline\
    \ vty 2 4\n transport input none\nIf the switch is not configured to limit the number of concurrent management sessions,\n\
    this is a finding."
  remediation: 'Configure the switch to limit the number of concurrent management sessions to an

    organization-defined number as shown in the example below:

    SW4(config)#ip http max-connections 2

    SW4(config)#line vty 0 1

    SW4(config)#transport input ssh

    SW4(config)#line vty 2 4

    SW4(config)#transport input none'
  checks:
  - type: sql
    command: 'show in the example below:'
    severity: medium
    info: "Note: This requirement is not applicable to file transfer actions such as FTP, SCP, and\nSFTP.\nReview the switch\
      \ configuration to determine if concurrent management sessions are\nlimited as show in the example below:\nip http secure-server\n\
      ip http max-connections 2\n…\n…\n…\nFor platforms that support the session-limit command:\nline vty 0 4\n session-limit\
      \ 2\n transport input ssh\nFor platforms that do not "
- id: '1.2'
  title: CISC-ND-000090
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to automatically audit account creation. GROUP ID: V-220571 RULE ID: SV-220571r960777'
  rationale: Upon gaining access to a network device, an attacker will often first attempt to create a persistent method of
    reestablishing access. One way to accomplish this is to create a new account. Notification of account creation helps to
    mitigate this risk. Auditing account creation provides the necessary reconciliation that account management procedures
    are being followed. Without this audit trail, personnel without the proper authorization may gain access to critical network
    nodes.
  impact: ''
  references: []
  page_start: 13
  audit_raw: "Review the switch configuration to determine if it automatically audits account creation.\nThe configuration\
    \ should look similar to the example below:\narchive\n log config\n logging enable\nNote: Configuration changes can be\
    \ viewed using the show archive log config all\ncommand.\nIf account creation is not automatically audited, this is a\
    \ finding."
  remediation: 'Configure the switch to log account creation using the following commands:

    SW4(config)#archive

    SW4(config-archive)#log config

    SW4(config-archive-log-cfg)#logging enable

    SW4(config-archive-log-cfg)#end'
  checks:
  - type: sql
    command: show archive log config all
    severity: medium
    info: "Review the switch configuration to determine if it automatically audits account creation.\nThe configuration should\
      \ look similar to the example below:\narchive\n log config\n logging enable\nNote: Configuration changes can be viewed\
      \ using the show archive log config all\ncommand.\nIf account creation is not automatically audited, this is a finding."
- id: '1.3'
  title: CISC-ND-000100
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to automatically audit account modification. GROUP ID: V-220572 RULE ID:
    SV-220572r960780'
  rationale: Because the accounts in the network device are privileged or system-level accounts, account management is vital
    to the security of the network device. Account management by a designated authority ensures access to the network device
    is being controlled in a secure manner by granting access to only authorized personnel with the appropriate and necessary
    privileges. Auditing account modification, along with an automatic notification to appropriate individuals, will provide
    the necessary reconciliation that account management procedures are being followed. If modifications to management accounts
    are not audited, reconciliation of account management procedures cannot be tracked.
  impact: ''
  references: []
  page_start: 15
  audit_raw: "Review the switch configuration to determine if it automatically audits account\nmodification. The configuration\
    \ should look similar to the example below:\narchive\n log config\n logging enable\nNote: Configuration changes can be\
    \ viewed using the show archive log config all\ncommand.\nIf account modification is not automatically audited, this is\
    \ a finding."
  remediation: 'Configure the switch to log account modification using the following commands:

    SW4(config)#archive

    SW4(config-archive)#log config

    SW4(config-archive-log-cfg)#logging enable

    SW4(config-archive-log-cfg)#end'
  checks:
  - type: sql
    command: show archive log config all
    severity: medium
    info: "Review the switch configuration to determine if it automatically audits account\nmodification. The configuration\
      \ should look similar to the example below:\narchive\n log config\n logging enable\nNote: Configuration changes can\
      \ be viewed using the show archive log config all\ncommand.\nIf account modification is not automatically audited, this\
      \ is a finding."
- id: '1.4'
  title: CISC-ND-000110
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco switch must be configured to automatically audit account disabling actions. GROUP ID: V-220573 RULE
    ID: SV-220573r960783'
