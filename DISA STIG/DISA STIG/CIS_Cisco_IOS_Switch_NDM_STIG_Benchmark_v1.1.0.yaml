  audit_raw: "Note: This requirement is not applicable if the router or switch does not have any public\nkey certificates.\n\
    Review the switch configuration to determine if a CA trust point has been configured.\nThe CA trust point will contain\
    \ the URL of the CA in which the switch has enrolled.\nVerify this is a DOD or DOD-approved CA. This will ensure the switch\
