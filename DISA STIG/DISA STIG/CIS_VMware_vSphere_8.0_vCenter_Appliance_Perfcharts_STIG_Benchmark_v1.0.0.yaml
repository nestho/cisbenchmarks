- id: '1.27'
  title: VCPF-80-000140
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter Perfcharts service xpoweredBy attribute must be disabled. GROUP ID: V-259096 RULE ID: SV-259096r960963'
  rationale: Individual connectors can be configured to display the Tomcat information to clients. This information can be
    used to identify server versions that can be useful to attackers for identifying vulnerable versions of Tomcat. Individual
    connectors must be checked for the xpoweredBy attribute to ensure they do not pass server information to clients. The
    default value for xpoweredBy is "false".
  impact: ''
  references: []
  page_start: 65
  audit_raw: 'At the command prompt, run the following command:

    xmllint --xpath "//Connector/@xpoweredBy" /usr/lib/vmware-perfcharts/tcinstance/conf/server.xml

    Example result:

