  rationale: Invalid user input occurs when a user inserts data or characters into a hosted application's data entry field
    and the hosted application is unprepared to process that data. This results in unanticipated application behavior, potentially
    leading to an application compromise. Invalid user input is one of the primary methods employed when attempting to compromise
    an application. An attacker can also enter Unicode characters into hosted applications in an effort to break out of the
    document home or root home directory or to bypass security checks. VMware uses the standard Tomcat "SetCharacterEncodingFilter"
    to provide a layer of defense against character encoding attacks. Filters are Java objects that perform filtering tasks
    on the request to a resource (a servlet or static content), on the response from a resource, or both.
