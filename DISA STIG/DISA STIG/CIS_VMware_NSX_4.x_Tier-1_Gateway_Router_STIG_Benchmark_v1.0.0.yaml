controls:
- id: '1.1'
  title: NT1R-4X-000016
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The NSX Tier-1 Gateway router must be configured to have all inactive interfaces removed. GROUP ID: V-265518
    RULE ID: SV-265518r999924'
  rationale: An inactive interface is rarely monitored or controlled and may expose a network to an undetected attack on that
    interface. Unauthorized personnel with access to the communication facility could gain access to a router by connecting
    to a configured interface that is not in use. If an interface is no longer used, the configuration must be deleted and
    the interface disabled. For sub-interfaces, delete sub-interfaces that are on inactive interfaces and delete sub-interfaces
    that are themselves inactive. If the sub-interface is no longer necessary for authorized communications, it must be deleted.
  impact: ''
  references: []
  page_start: 10
  audit_raw: 'From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-1

    Gateways.

    For every Tier-1 Gateway, expand the Tier-1 Gateway. Click on the number in the

    Linked Segments to review the currently linked segments.

    For every Tier-1 Gateway, expand the Tier-1 Gateway. Expand Interfaces and GRE

    Tunnels, and click on the number of interfaces present to open the interfaces dialog.

    Review each interface or linked segment present to determine if they are not in use or

    inactive.

    If there are any linked segments or service interfaces present on a Tier-1 Gateway that

    are not in use or inactive, this is a finding.'
  remediation: 'To remove a stale linked segment from a Tier-1 Gateway, do the following:

    From the NSX Manager web interface, go to Networking >> Connectivity >> Segments

    and edit the target segment.

    Under Connected Gateway, change to "None" and click "Save".

    Note: The stale linked segment can also be deleted if there are no active workloads

    attached to it.

    To remove a stale service interface from a Tier-1 Gateway, do the following:

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-1

    Gateways >> Edit the target Tier-1 gateway.

    Expand "Interfaces and GRE Tunnels", then click on the number of interfaces present to

    open the interfaces dialog.

    On the stale service interface, select "Delete" and click "Delete" again to confirm.'
  checks:
  - type: manual_review
    info: 'From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-1

      Gateways.

      For every Tier-1 Gateway, expand the Tier-1 Gateway. Click on the number in the

      Linked Segments to review the currently linked segments.

      For every Tier-1 Gateway, expand the Tier-1 Gateway. Expand Interfaces and GRE

      Tunnels, and click on the number of interfaces present to open the interfaces dialog.

      Review each interface or linked segment present to determine if they are not in use or

      inactive.

      If there are'
    severity: medium
- id: '1.2'
  title: NT1R-4X-000027
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The NSX Tier-1 Gateway router must be configured to have the DHCP service disabled if not in use. GROUP ID:
    V-265529 RULE ID: SV-265529r999926'
  rationale: A compromised router introduces risk to the entire network infrastructure, as well as data resources that are
    accessible via the network. The perimeter defense has no oversight or control of attacks by malicious users within the
    network. Preventing network breaches from within is dependent on implementing a comprehensive defense-in-depth strategy,
    including securing each device connected to the network. This is accomplished by following and implementing all security
    guidance applicable for each node type. A fundamental step in securing each router is to enable only the capabilities
    required for operation.
  impact: ''
  references: []
  page_start: 12
  audit_raw: 'From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-1

    Gateways.

    For every Tier-1 Gateway expand the Tier-1 Gateway to view the DHCP configuration.

    If a DHCP profile is configured and not in use, this is a finding.'
  remediation: 'From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-1

    Gateways and edit the target Tier-1 gateway.

    Click "Set DHCP Configuration", select "No Dynamic IP Address Allocation", click

    "Save", and then close "Editing".'
  checks:
  - type: manual_review
    info: 'From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-1

      Gateways.

      For every Tier-1 Gateway expand the Tier-1 Gateway to view the DHCP configuration.

      If a DHCP profile is configured and not in use, this is a finding.'
    severity: medium
- id: '1.3'
  title: NT1R-4X-000102
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The NSX Tier-1 Gateway router must be configured to advertise a hop limit of at least 32 in Router Advertisement
    messages for IPv6 stateless auto-configuration deployments. GROUP ID: V-265604 RULE ID: SV-265604r995285'
  rationale: The Neighbor Discovery protocol allows a hop limit value to be advertised by routers in a Router Advertisement
    message being used by hosts instead of the standardized default value. If a very small value was configured and advertised
    to hosts on the LAN segment, communications would fail due to the hop limit reaching zero before the packets sent by a
    host reached its destination.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'If IPv6 forwarding is not enabled, this is Not Applicable.

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-1

    Gateways.

    For every Tier-1 Gateway, expand Tier-1 Gateway >>Additional Settings.

    Click on the ND profile name to view the hop limit.

    If the hop limit is not configured to at least 32, this is a finding.'
  remediation: 'To configure the Neighbor Discovery hop limit, do the following:

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-1

    Gateways >> edit the target Tier-1 gateway.

    Expand Additional Settings and select an "ND Profile" from the drop down with a hop

    limit of 32 or more, then click "Close Editing".

    Note: The default ND profile has a hop limit of 64 and cannot be edited. If required,

    create a new or edit another existing ND profile to use.'
  checks:
  - type: manual_review
    info: 'If IPv6 forwarding is not enabled, this is Not Applicable.

      From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-1

      Gateways.

      For every Tier-1 Gateway, expand Tier-1 Gateway >>Additional Settings.

      Click on the ND profile name to view the hop limit.

      If the hop limit is not configured to at least 32, this is a finding.'
    severity: medium
- id: '1.4'
  title: NT1R-4X-000107
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The NSX Tier-1 Gateway router must be configured to have multicast disabled if not in use. GROUP ID: V-265608
    RULE ID: SV-265608r999927'
  rationale: A compromised router introduces risk to the entire network infrastructure, as well as data resources that are
    accessible via the network. The perimeter defense has no oversight or control of attacks by malicious users within the
    network. Preventing network breaches from within is dependent on implementing a comprehensive defense-in-depth strategy,
    including securing each device connected to the network. This is accomplished by following and implementing all security
    guidance applicable for each node type. A fundamental step in securing each router is to enable only the capabilities
    required for operation.
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-1

    Gateways.

    For every Tier-1 Gateway, expand the Tier-1 Gateway then expand Multicast to view

    the Multicast configuration.

    If Multicast is enabled and not in use, this is a finding.

    If a Tier-1 Gateway is not linked to a Tier-0 Gateway, this is Not Applicable.'
  remediation: 'If not used, disable Multicast by doing the following:

    From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-1

    Gateways and edit the target Tier-1 gateway.

    Expand Multicast and change from "Enabled" to "Disabled" and then click "Save".'
  checks:
  - type: manual_review
    info: 'From the NSX Manager web interface, go to Networking >> Connectivity >> Tier-1

      Gateways.

      For every Tier-1 Gateway, expand the Tier-1 Gateway then expand Multicast to view

      the Multicast configuration.

      If Multicast is enabled and not in use, this is a finding.

      If a Tier-1 Gateway is not linked to a Tier-0 Gateway, this is Not Applicable.'
    severity: medium
