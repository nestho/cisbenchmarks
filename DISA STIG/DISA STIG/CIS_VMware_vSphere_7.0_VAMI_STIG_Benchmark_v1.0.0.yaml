  title: VCLD-70-000016
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VAMI must prevent hosted applications from exhausting system resources. GROUP ID: V-256660 RULE ID: SV-256660r888502'
  rationale: Most of the attention to denial-of-service (DoS) attacks focuses on ensuring that systems and applications are
    not victims of these attacks. However, these systems and applications must also be secured against use to launch such
    an attack against others. A variety of technologies exist to limit or, in some cases, eliminate the effects of DoS attacks.
    Limiting system resources that are allocated to any user to a bare minimum may also reduce the ability of users to launch
    some DoS attacks. One DoS mitigation is to prevent VAMI from keeping idle connections open for too long.
  impact: ''
