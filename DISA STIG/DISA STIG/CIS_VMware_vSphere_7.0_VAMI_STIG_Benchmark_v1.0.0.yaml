  - 'SEVERITY: CAT II'
  description: 'VAMI must be protected from being stopped by a nonprivileged user. GROUP ID: V-256667 RULE ID: SV-256667r888523'
  rationale: An attacker has at least two reasons to stop a web server. The first is to cause a denial of service, and the
    second is to put in place changes the attacker made to the web server configuration. Therefore, only administrators should
    ever be able to stop VAMI. The VAMI process is configured out of the box to be owned by root. This configuration must
    be verified and maintained.
