- id: '1.20'
  title: VCLD-70-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VAMI must disable directory browsing. GROUP ID: V-256664 RULE ID: SV-256664r888514'
  rationale: The goal is to completely control the web user's experience in navigating any portion of the web document root
    directories. Ensuring all web content directories have at least the equivalent of an "index.html" file is a significant
    factor to accomplish this end. Enumeration techniques, such as Uniform Resource Locator (URL) parameter manipulation,
    rely on being able to obtain information about the web server's directory structure by locating directories without default
    pages. In this scenario, the web server will display to the user a listing of the files in the directory being accessed.
    By having a default hosted application web page, the anonymous web user will not obtain directory browsing information
    or an error message that reveals the server type and version.
  impact: ''
  references: []
