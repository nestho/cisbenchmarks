  description: 'VAMI must be configured to hide the server type and version in client responses. GROUP ID: V-256671 RULE ID:
    SV-256671r888535'
  rationale: Web servers will often display error messages to client users, displaying enough information to aid in the debugging
    of the error. The information given back in error messages may display the web server type, version, patches installed,
    plug-ins and modules installed, type of code being used by the hosted application, and any backends being used for data
