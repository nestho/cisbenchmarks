- id: '1.21'
  title: VCLD-70-000021
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VAMI must not be configured to use "mod_status". GROUP ID: V-256665 RULE ID: SV-256665r888517'
  rationale: 'Any application providing too much information in error logs and in administrative messages to the screen risks
    compromising the data and security of the application and system. VAMI must only generate error messages that provide
    information necessary for corrective actions without revealing sensitive or potentially harmful information in error logs
    and administrative messages. The "mod_status" module generates the status overview of the webserver. The information covers
    the following: • Uptime. • Average throughput. • Current throughput. • Active connections and their state. While this
    information is useful on a development system, production systems must not have "mod_status" enabled.'
  impact: ''
  references: []
