  title: VCLD-70-000018
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VAMI must protect against or limit the effects of HTTP types of denial-of-service (DoS) attacks. GROUP ID:
    V-256662 RULE ID: SV-256662r888508'
  rationale: In UNIX and related computer operating systems, a file descriptor is an indicator used to access a file or other
    input/output resource, such as a pipe or network connection. File descriptors index into a per-process file descriptor
    table maintained by the kernel, which in turn indexes into a systemwide table of files opened by all processes, called
    the file table. As a single-threaded server, Lighttpd must be limited in the number of file descriptors that can be allocated.
    This will prevent Lighttpd from being used in a form of DoS attack against the operating system.
  impact: ''
  references: []
