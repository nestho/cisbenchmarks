- id: '1.6'
  title: VCLD-70-000006
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VAMI must produce log records containing sufficient information to establish what type of events occurred.
    GROUP ID: V-256650 RULE ID: SV-256650r888472'
  rationale: 'After a security incident has occurred, investigators will often review log files to determine what happened.
    Understanding what type of event occurred is critical for investigation of a suspicious event. Satisfies: SRG-APP-000095-WSR-000056,
    SRG-APP-000096-WSR-000057, SRGAPP-000097-WSR-000058, SRG-APP-000098-WSR-000059, SRG-APP-000099-WSR000061, SRG-APP-000100-WSR-000064,
