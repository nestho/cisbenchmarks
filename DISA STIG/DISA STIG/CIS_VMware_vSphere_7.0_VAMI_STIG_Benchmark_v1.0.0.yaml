  description: 'VAMI must protect the keystore from unauthorized access. GROUP ID: V-256661 RULE ID: SV-256661r888505'
  rationale: The web server's private key is used to prove the identity of the server to clients and securely exchange the
    shared secret key used to encrypt communications between the web server and clients. By gaining access to the private
