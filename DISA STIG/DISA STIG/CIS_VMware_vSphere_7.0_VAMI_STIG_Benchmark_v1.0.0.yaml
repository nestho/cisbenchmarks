  description: 'VAMI must implement Transport Layer Security (TLS) 1.2 exclusively. GROUP ID: V-256668 RULE ID: SV-256668r888526'
  rationale: 'TLS is a required transmission protocol for a web server hosting controlled information. The use of TLS provides
    confidentiality of data in transit between the web server and client. FIPS 140-2 approved TLS versions must be enabled,
    and non-FIPS-approved Secure Sockets Layer (SSL) versions must be disabled. VAMI comes configured to use only TLS 1.2.
    This configuration must be verified and maintained. Satisfies: SRG-APP-000439-WSR-000156, SRG-APP-000442-WSR-000182'
