    severity: medium
- id: '1.5'
  title: VCLD-70-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VAMI must generate log records for system startup and shutdown. GROUP ID: V-256649 RULE ID: SV-256649r888469'
  rationale: Logging must be started as soon as possible when a service starts and when a service is stopped. Many forms of
    suspicious actions can be detected by analyzing logs for unexpected service starts and stops. Also, by starting to log
    immediately after a service starts, it becomes more difficult for suspicious activity to go unlogged.
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'At the command prompt, run the following command:

    # /opt/vmware/sbin/vami-lighttpd -p -f /opt/vmware/etc/lighttpd/lighttpd.conf

    2>/dev/null|grep "server.errorlog"|sed -e ''s/^[ ]*//''

    Expected result:

    server.errorlog = "/opt/vmware/var/log/lighttpd/error.log"

    If the output does not match the expected result, this is a finding.

