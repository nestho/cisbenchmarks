- id: '1.25'
  title: VCLD-70-000025
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VAMI must force clients to select the most secure cipher. GROUP ID: V-256669 RULE ID: SV-256669r888529'
  rationale: During a Transport Layer Security (TLS) session negotiation, when choosing a cipher during a handshake, normally
    the client's preference is used. This is potentially problematic as a malicious, dated, or poorly configured client could
    select the most insecure cipher offered by the server, even if it supports stronger ones. If "ssl.honor-cipher-order"
    is enabled, the "ssl.cipher-list" setting will be treated as an ordered list of cipher values from most preferred to least,
    left to right.
  impact: ''
  references: []
