      ssl.engine = "enable"

      If the output does not match the expected result, this is a finding.

      Note: The command must be run from a bash shell and not from a shell generated by

      the "appliance shell". Use the "chsh" command to change the shell for the account to

      "/bin/bash". Refer to KB Article 2100508 for mor'
    severity: medium
- id: '1.4'
  title: VCLD-70-000004
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VAMI must be configured to monitor remote access. GROUP ID: V-256648 RULE ID: SV-256648r888466'
  rationale: 'Remote access can be exploited by an attacker to compromise the server. By recording all remote access activities,
    it will be possible to determine the attacker''s location, intent, and degree of success. VAMI uses the "mod_accesslog"
    module to log information relating to remote requests. These logs can then be piped to external monitoring systems. Satisfies:
    SRG-APP-000016-WSR-000005, SRG-APP-000093-WSR-000053'
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'At the command prompt, run the following command:

    # /opt/vmware/sbin/vami-lighttpd -p -f /opt/vmware/etc/lighttpd/lighttpd.conf

    2>/dev/null|awk ''/server.modules/,/)/''|grep mod_accesslog|sed -e ''s/^[ ]*//''

    Expected result:

    "mod_accesslog",

    If the output does not match the expected result, this is a finding.

    Note: The command must be run from a bash shell and not from a shell generated by

    the "appliance shell". Use the "chsh" command to change the shell for the account to

    "/bin/bash". Refer to KB Article 2100508 for more details:

    https://kb.vmware.com/s/article/2100508'
  remediation: "Navigate to and open:\n/opt/vmware/etc/lighttpd/lighttpd.conf\nAdd the following value in the \"server.modules\"\
    \ section:\nmod_accesslog\nThe result should be similar to the following:\nserver.modules = (\n \"mod_access\",\n \"mod_accesslog\"\
    ,\n \"mod_proxy\",\n \"mod_cgi\",\n \"mod_rewrite\",\n \"mod_magnet\",\n \"mod_setenv\",\n)\nRestart the service with\
    \ the following command:\n# vmon-cli --restart applmgmt"
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # /opt/vmware/sbin/vami-lighttpd -p -f /opt/vmware/etc/lighttpd/lighttpd.conf

      2>/dev/null|awk ''/server.modules/,/)/''|grep mod_accesslog|sed -e ''s/^[ ]*//''

      Expected result:

      "mod_accesslog",

      If the output does not match the expected result, this is a finding.

      Note: The command must be run from a bash shell and not from a shell generated by

      the "appliance shell". Use the "chsh" command to change the shell for the account to

