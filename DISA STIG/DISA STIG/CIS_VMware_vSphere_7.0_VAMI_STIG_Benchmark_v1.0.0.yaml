- id: '1.7'
  title: VCLD-70-000007
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VAMI log files must only be accessible by privileged users. GROUP ID: V-256651 RULE ID: SV-256651r918984'
  rationale: 'Log data is essential in the investigation of events. If log data were to become compromised, competent forensic
    analysis and discovery of the true source of potentially malicious system activity would be difficult, if not impossible,
    to achieve. In addition, access to log records provides information an attacker could use to their advantage because each
    event record might contain communication ports, protocols, services, trust relationships, user names, etc. Satisfies:
    SRG-APP-000118-WSR-000068, SRG-APP-000119-WSR-000069, SRGAPP-000120-WSR-000070'
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'At the command prompt, run the following command:

    # find /opt/vmware/var/log/lighttpd/ -xdev -type f -a ''('' -perm -o+w -o -not -user root -o -

    not -group root '')'' -exec ls -ld {} ;

    If any files are returned, this is a finding.'
  remediation: 'At the command prompt, run the following commands:

    # chmod o-w

    # chown root:root

    Note: Substitute with the listed file.'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # find /opt/vmware/var/log/lighttpd/ -xdev -type f -a ''('' -perm -o+w -o -not -user root -o -

      not -group root '')'' -exec ls -ld {} ;

      If any files are returned, this is a finding.'
    severity: medium
- id: '1.8'
  title: VCLD-70-000008
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The rsyslog must be configured to monitor VAMI logs. GROUP ID: V-256652 RULE ID: SV-256652r888478'
  rationale: 'For performance reasons, rsyslog file monitoring is preferred over configuring VAMI to send events to a syslog
    facility. Without ensuring that logs are created, rsyslog configs are created, and those configs are loaded, the log file
    monitoring and shipping will not be effective. VAMI syslog configuration is included by default as part of the VMware-visl-integration
    package. The shipping state of the configuration file must be verified and maintained. Satisfies: SRG-APP-000125-WSR-000071,
    SRG-APP-000358-WSR-000063, SRGAPP-000358-WSR-000163'
  impact: ''
  references: []
