controls:
- id: '1.1'
  title: VCLD-70-000001
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VAMI must limit the number of simultaneous requests. GROUP ID: V-256645 RULE ID: SV-256645r888457'
  rationale: Denial of service (DoS) is one threat against web servers. Many DoS attacks attempt to consume web server resources
    in such a way that no more resources are available to satisfy legitimate requests. Mitigation against these threats is
    to take steps to limit the number of resources that can be consumed in certain ways. VAMI provides the "maxConnections"
    attribute of the <Connector Elements> to limit the number of concurrent Transmission Control Protocol (TCP) connections.
    This comes preconfigured with a tested, supported value that must be verified and maintained.
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'At the command prompt, run the following command:

    # /opt/vmware/sbin/vami-lighttpd -p -f /opt/vmware/etc/lighttpd/lighttpd.conf 2>/dev/null

    |grep "server.max-connections"|sed -e ''s/^[ ]*//''

    Expected result:

    server.max-connections = 1024

    If the output does not match the expected result, this is a finding.

    Note: The command must be run from a bash shell and not from a shell generated by

    the "appliance shell". Use the "chsh" command to change the shell for the account to

    "/bin/bash". Refer to KB Article 2100508 for more details:

    https://kb.vmware.com/s/article/2100508'
  remediation: 'Navigate to and open:

    /opt/vmware/etc/lighttpd/lighttpd.conf

    Add or reconfigure the following value:

    server.max-connections = 1024

    Restart the service with the following command:

    # vmon-cli --restart applmgmt'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # /opt/vmware/sbin/vami-lighttpd -p -f /opt/vmware/etc/lighttpd/lighttpd.conf 2>/dev/null

      |grep "server.max-connections"|sed -e ''s/^[ ]*//''

      Expected result:

      server.max-connections = 1024

      If the output does not match the expected result, this is a finding.

      Note: The command must be run from a bash shell and not from a shell generated by

      the "appliance shell". Use the "chsh" command to change the shell for the account to

      "/bin/bash". Refer to KB Ar'
    severity: medium
- id: '1.2'
  title: VCLD-70-000002
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'VAMI must be configured with FIPS 140-2 compliant ciphers for HTTPS connections. GROUP ID: V-256646 RULE ID:
    SV-256646r888460'
  rationale: 'Encryption of data in flight is an essential element of protecting information confidentiality. If a web server
    uses weak or outdated encryption algorithms, the server''s communications could be compromised. The U.S. Federal Information
    Processing Standards (FIPS) publication 140-2, Security Requirements for Cryptographic Modules (FIPS 140-2), identifies
    11 areas for a cryptographic module used inside a security system that protects information. FIPS 1402 approved ciphers
    provide the maximum level of encryption possible for a private web server. VAMI is compiled to use VMware''s FIPS-validated
    OpenSSL module and cannot be configured otherwise. Ciphers may still be specified in order of preference, but no nonFIPS
    approved ciphers will be implemented. Satisfies: SRG-APP-000014-WSR-000006, SRG-APP-000416-WSR-000118, SRGAPP-000439-WSR-000188'
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'At the command prompt, run the following command:

    # /opt/vmware/sbin/vami-lighttpd -p -f /opt/vmware/etc/lighttpd/lighttpd.conf

    2>/dev/null|grep "ssl.cipher-list"|sed -e ''s/^[ ]*//''

    Expected result:

    ssl.cipher-list =

    "!aNULL:kECDH+AESGCM:ECDH+AESGCM:RSA+AESGCM:kECDH+AES:ECDH+AE

    S:RSA+AES"

    If the output does not match the expected result, this is a finding.

    Note: The command must be run from a bash shell and not from a shell generated by

    the "appliance shell". Use the "chsh" command to change the shell for the account to

    "/bin/bash". Refer to KB Article 2100508 for more details:

    https://kb.vmware.com/s/article/2100508'
  remediation: 'Navigate to and open:

    /etc/applmgmt/appliance/lighttpd.conf

    Add or reconfigure the following value:

    ssl.cipher-list =

    "!aNULL:kECDH+AESGCM:ECDH+AESGCM:RSA+AESGCM:kECDH+AES:ECDH+AE

    S:RSA+AES"

    Restart the service with the following command:

    # vmon-cli --restart applmgmt'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # /opt/vmware/sbin/vami-lighttpd -p -f /opt/vmware/etc/lighttpd/lighttpd.conf

      2>/dev/null|grep "ssl.cipher-list"|sed -e ''s/^[ ]*//''

      Expected result:

      ssl.cipher-list =

      "!aNULL:kECDH+AESGCM:ECDH+AESGCM:RSA+AESGCM:kECDH+AES:ECDH+AE

      S:RSA+AES"

      If the output does not match the expected result, this is a finding.

      Note: The command must be run from a bash shell and not from a shell generated by

      the "appliance shell". Use the "chsh" command to change the'
    severity: medium
- id: '1.3'
  title: VCLD-70-000003
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'VAMI must use cryptography to protect the integrity of remote sessions. GROUP ID: V-256647 RULE ID: SV-256647r888463'
  rationale: 'Data exchanged between the user and the web server can range from static display data to credentials used to
    log in the hosted application. Even when data appears to be static, the nondisplayed logic in a web page may expose business
    logic or trusted system relationships. The integrity of all the data being exchanged between the user and web server must
    always be trusted. To protect the integrity and trust, encryption methods should be used to protect the complete communication
    session. To protect the integrity and confidentiality of the remote sessions, VAMI uses Secure Sockets Layer (SSL)/Transport
    Layer Security (TLS). Satisfies: SRG-APP-000015-WSR-000014, SRG-APP-000172-WSR-000104, SRGAPP-000315-WSR-000003, SRG-APP-000439-WSR-000151,
    SRG-APP-000439-WSR000152'
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'At the command prompt, run the following command:

    # /opt/vmware/sbin/vami-lighttpd -p -f /opt/vmware/etc/lighttpd/lighttpd.conf

    2>/dev/null|grep "ssl.engine"|sed -e ''s/^[ ]*//''

    Expected result:

    ssl.engine = "enable"

    If the output does not match the expected result, this is a finding.

    Note: The command must be run from a bash shell and not from a shell generated by

    the "appliance shell". Use the "chsh" command to change the shell for the account to

    "/bin/bash". Refer to KB Article 2100508 for more details:

    https://kb.vmware.com/s/article/2100508'
  remediation: 'Navigate to and open:

    /opt/vmware/etc/lighttpd/lighttpd.conf

    Add or reconfigure the following value:

    ssl.engine = "enable"

    Restart the service with the following command:

    # vmon-cli --restart applmgmt'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # /opt/vmware/sbin/vami-lighttpd -p -f /opt/vmware/etc/lighttpd/lighttpd.conf

