- id: '1.30'
  title: VCUI-70-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'vSphere UI must be configured with the appropriate ports. GROUP ID: V-256807 RULE ID: SV-256807r889420'
  rationale: Web servers provide numerous processes, features, and functionalities that use TCP/IP ports. Some of these processes
    may be deemed unnecessary or too unsecure to run on a production system. The ports that vSphere UI listens on are configured
    in the "catalina.properties" file and must be verified as accurate to their shipping state.
  impact: ''
  references: []
  page_start: 69
  audit_raw: 'At the command prompt, run the following command:

    # grep ''\.port'' /usr/lib/vmware-vsphere-ui/server/conf/catalina.properties

    Expected result:

    http.port=5090

    proxy.port=443

    If the output of the command does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-vsphere-ui/server/conf/catalina.properties

    Navigate to the ports specification section.

    Set the vSphere UI port specifications according to the shipping configuration as

    follows:

    http.port=5090

    proxy.port=443

    Restart the service with the following command:

    # vmon-cli --restart vsphere-ui'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep ''\.port'' /usr/lib/vmware-vsphere-ui/server/conf/catalina.properties

      Expected result:

      http.port=5090

      proxy.port=443

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.31'
  title: VCUI-70-000031
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'vSphere UI must disable the shutdown port. GROUP ID: V-256808 RULE ID: SV-256808r889423'
  rationale: An attacker has at least two reasons to stop a web server. The first is to cause a denial of service, and the
    second is to put in place changes the attacker made to the web server configuration. If the Tomcat shutdown port feature
    is enabled, a shutdown signal can be sent to vSphere UI through this port. To ensure availability, the shutdown port must
    be disabled.
  impact: ''
  references: []
  page_start: 71
  audit_raw: 'At the command prompt, run the following commands:

    # xmllint --format /usr/lib/vmware-vsphere-ui/server/conf/server.xml | sed ''2

    s/xmlns=".*"//g'' | xmllint --xpath ''/Server/@port'' -

    Expected result:

    port="${shutdown.port}"

    If the output does not match the expected result, this is a finding.

    # grep shutdown /etc/vmware/vmware-vmon/svcCfgfiles/vsphere-ui.json|sed -e

    ''s/^[ ]*//''

    Expected result:

    "-Dshutdown.port=-1",

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-vsphere-ui/server/conf/server.xml

    Ensure the server port is disabled:

    <Server port="${shutdown.port}">

    Restart the service with the following command:

    # vmon-cli --restart vsphere-ui'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following commands:

      # xmllint --format /usr/lib/vmware-vsphere-ui/server/conf/server.xml | sed ''2

      s/xmlns=".*"//g'' | xmllint --xpath ''/Server/@port'' -

      Expected result:

      port="${shutdown.port}"

      If the output does not match the expected result, this is a finding.

      # grep shutdown /etc/vmware/vmware-vmon/svcCfgfiles/vsphere-ui.json|sed -e

      ''s/^[ ]*//''

      Expected result:

      "-Dshutdown.port=-1",

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.32'
  title: VCUI-70-000032
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'vSphere UI must set the secure flag for cookies. GROUP ID: V-256809 RULE ID: SV-256809r889426'
  rationale: The secure flag is an option that can be set by the application server when sending a new cookie to the user
    within an HTTP response. The purpose of the secure flag is to prevent cookies from being observed by unauthorized parties
    due to the transmission of a cookie in clear text. By setting the secure flag, the browser will prevent the transmission
    of a cookie over an unencrypted channel. vSphere UI is configured to only be accessible over a Transport Layer Security
    (TLS) tunnel, but this cookie flag is still a recommended best practice.
  impact: ''
  references: []
  page_start: 73
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --format /usr/lib/vmware-vsphere-ui/server/conf/web.xml | sed

    ''s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/session-config/cookieconfig/secure'' -

    Expected result:

    <secure>true</secure>

    If the output of the command does not match the expected result, this is a finding.'
  remediation: "Navigate to and open:\n/usr/lib/vmware-vsphere-ui/server/conf/web.xml\nNavigate to the /<web-apps>/<session-config>/<cookie-config>\
    \ node and\nconfigure it as follows.\n <cookie-config>\n <http-only>true</http-only>\n <secure>true</secure>\n </cookie-config>\n\
    Restart the service with the following command:\n# vmon-cli --restart vsphere-ui"
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --format /usr/lib/vmware-vsphere-ui/server/conf/web.xml | sed

      ''s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/session-config/cookieconfig/secure'' -

      Expected result:

      <secure>true</secure>

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.33'
  title: VCUI-70-000033
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vSphere UI default servlet must be set to "readonly". GROUP ID: V-256810 RULE ID: SV-256810r889429'
  rationale: The default servlet (or DefaultServlet) is a special servlet provided with Tomcat that is called when no other
    suitable page is found in a particular folder. The DefaultServlet serves static resources as well as directory listings.
    The DefaultServlet is configured by default with the "readonly" parameter set to "true" where HTTP commands such as PUT
    and DELETE are rejected. Changing this to "false" allows clients to delete or modify static resources on the server and
    to upload new resources. DefaultServlet "readonly" must be set to "true", either literally or by absence (default).
  impact: ''
  references: []
  page_start: 75
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --format /usr/lib/vmware-vsphere-ui/server/conf/web.xml | sed

    ''s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/servlet/servletname[text()="default"]/../init-param/param-name[text()="readonly"]/../paramvalue[text()="false"]''
    -

    Expected result:

    XPath set is empty

    If the output of the command does not match the expected result, this is a finding.'
  remediation: "Navigate to and open:\n/usr/lib/vmware-vsphere-ui/server/conf/web.xml\nNavigate to the /<web-apps>/<servlet>/<servlet-name>default</servletname>/\
    \ node and remove the following node:\n<init-param>\n <param-name>readonly</param-name>\n <param-value>false</param-value>\n\
    </init-param>\nRestart the service with the following command:\n# vmon-cli --restart vsphere-ui"
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --format /usr/lib/vmware-vsphere-ui/server/conf/web.xml | sed

      ''s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/servlet/servletname[text()="default"]/../init-param/param-name[text()="readonly"]/../paramvalue[text()="false"]''
      -

      Expected result:

      XPath set is empty

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
