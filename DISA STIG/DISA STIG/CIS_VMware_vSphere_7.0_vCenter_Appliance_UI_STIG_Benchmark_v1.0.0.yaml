- id: '1.18'
  title: VCUI-70-000018
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'vSphere UI must restrict its cookie path. GROUP ID: V-256795 RULE ID: SV-256795r889384'
  rationale: Cookies are used to exchange data between the web server and the client. Cookies, such as a session cookie, may
    contain session information and user credentials used to maintain a persistent connection between the user and the hosted
    application since HTTP/HTTPS is a stateless protocol. vSphere UI is bound to the "/ui" virtual path behind the reverse
    proxy, and its cookies are configured as such. This configuration must be confirmed and maintained.
  impact: ''
  references: []
