- id: '1.28'
  title: VCUI-70-000028
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'vSphere UI must use a logging mechanism that is configured to allocate log record storage capacity large enough
    to accommodate the logging requirements of the web server. GROUP ID: V-256805 RULE ID: SV-256805r889414'
  rationale: To ensure the logging mechanism used by the web server has sufficient storage capacity in which to write the
    logs, the logging mechanism must be able to allocate log record storage capacity. vSphere UI configures log sizes and
    rotation appropriately as part of its installation routine. Verifying that the logging configuration file ("serviceability.xml")
    has not been modified is sufficient to determine if the logging configuration has been modified from the default.
  impact: ''
