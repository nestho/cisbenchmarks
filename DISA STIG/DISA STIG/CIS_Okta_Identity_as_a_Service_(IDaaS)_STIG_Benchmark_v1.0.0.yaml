- id: '1.3'
  title: OKTA-APP-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Okta must automatically disable accounts after a 35-day period of account inactivity. GROUP ID: V-273188 RULE
    ID: SV-273188r1098831'
  rationale: 'Attackers that are able to exploit an inactive account can potentially obtain and maintain undetected access
    to an application. Owners of inactive accounts will not notice if unauthorized access to their user account has been obtained.
    Applications must track periods of user inactivity and disable accounts after 35 days of inactivity. Such a process greatly
    reduces the risk that accounts will be hijacked, leading to a data compromise. To address access requirements, many application
    developers choose to integrate their applications with enterprise-level authentication/access mechanisms that meet or
    exceed access control policy requirements. Such integration allows the application developer to off-load those access
    control functions and focus on core application features and functionality. This policy does not apply to emergency accounts
    or infrequently used accounts. Infrequently used accounts are local login administrator accounts used by system administrators
    when network or normal login/access is not available. Emergency accounts are administrator accounts created in response
    to crisis situations. Satisfies: SRG-APP-000025, SRG-APP-000163, SRG-APP-000700'
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'If Okta Services rely on external directory services for user sourcing, this is not

    applicable, and the connected directory services must perform this function.

    Go to Workflows >> Automations and verify that an Automation has been created to

    disable accounts after 35 days of inactivity.

    If the Okta configuration does not automatically disable accounts after a 35-day period

    of account inactivity, this is a finding.'
  remediation: 'From the Admin Console:

    1. Go to Workflow >> Automations and select "Add Automation".

    2. Create a name for the Automation (e.g., "User Inactivity").

    3. Click "Add Condition" and select "User Inactivity in Okta".

    4. In the duration field, enter 35 days and click "Save".

    5 Click the edit button next to "Select Schedule".

    5. Configure the "Schedule" field for "Run Daily" and set the "Time" field to an

    organizationally defined time to run this automation. Click "Save".

    6. Click the edit button next to "Select group membership".

    7. In the "Applies to" field, select the group "Everyone" by typing it into the field.

    Click "Save".

    8. Click "Add Action" and select "Change User lifecycle state in Okta".

    9. In the "Change user state to" field, select "Suspended" and click "Save".

    10. Click the "Inactive" button near the top of the section screen and select

    "Activate".'
  checks:
  - type: manual_review
    info: 'If Okta Services rely on external directory services for user sourcing, this is not

      applicable, and the connected directory services must perform this function.

      Go to Workflows >> Automations and verify that an Automation has been created to

      disable accounts after 35 days of inactivity.

      If the Okta configuration does not automatically disable accounts after a 35-day period

      of account inactivity, this is a finding.'
    severity: medium
- id: '1.4'
  title: OKTA-APP-000170
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Okta must enforce the limit of three consecutive invalid login attempts by a user during a 15-minute time
    period. GROUP ID: V-273189 RULE ID: SV-273189r1098834'
  rationale: 'By limiting the number of failed login attempts, the risk of unauthorized system access via user password guessing,
    otherwise known as brute forcing, is reduced. Limits are imposed by locking the account. Satisfies: SRG-APP-000065, SRG-APP-000345'
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'If Okta Services rely on external directory services for user sourcing, this check is not

    applicable, and the connected directory services must perform this function.

    From the Admin Console:

    1. Go to Security >> Authenticators.

    2. Click the "Actions" button next to "Password" and select "Edit".

    3. For each Password Policy, verify the "Lock Out" section has the following values:

    o "Lock out after 3 unsuccessful attempts" is checked.

    o The value is set to "3".

    If Okta Services are not configured to automatically lock user accounts after three

    consecutive invalid login attempts, this is a finding.'
  remediation: 'From the Admin Console:

    1. Go to Security >> Authenticators.

    2. Click the "Actions" button next to "Password" and select "Edit".

    3. For each Password Policy, ensure the "Lock Out" section has the following

    values:

    o "Lock out after 3 unsuccessful attempts" is checked.

    o The value is set to "3".'
  checks:
  - type: manual_review
    info: 'If Okta Services rely on external directory services for user sourcing, this check is not

      applicable, and the connected directory services must perform this function.

      From the Admin Console:

      1. Go to Security >> Authenticators.

      2. Click the "Actions" button next to "Password" and select "Edit".

      3. For each Password Policy, verify the "Lock Out" section has the following values:

      o "Lock out after 3 unsuccessful attempts" is checked.

      o The value is set to "3".

      If Okta Services are not configured t'
    severity: medium
- id: '1.5'
  title: OKTA-APP-000180
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Okta Dashboard application must be configured to allow authentication only via non-phishable authenticators.
    GROUP ID: V-273190 RULE ID: SV-273190r1099763'
  rationale: Requiring the use of non-phishable authenticators protects against brute force/password dictionary attacks. This
    provides a better level of security while removing the need to lock out accounts after three attempts in 15 minutes.
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'From the Admin Console:

    1. Go to Security >> Authentication Policies.

    2. Click the "Okta Dashboard" policy.

    3. Click the "Actions" button next to the top rule and select "Edit".

    4. In the "Possession factor constraints are" section, verify the "Phishing resistant"

    box is checked. This will ensure that only phishing-resistant factors are used to

    access the Okta Dashboard.

    If in the "Possession factor constraints are" section the "Phishing resistant" box is not

    checked, this is a finding.'
  remediation: 'From the Admin Console:

    1. Go to Security >> Authentication Policies.

    2. Click the "Okta Dashboard" policy.

    3. Click the "Actions" button next to the top rule and select "Edit".

    4. In the "Possession factor constraints are" section, ensure the "Phishing resistant"

    box is checked.'
