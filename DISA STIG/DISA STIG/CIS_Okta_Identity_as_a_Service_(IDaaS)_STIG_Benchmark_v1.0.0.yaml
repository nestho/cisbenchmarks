- id: '1.10'
  title: OKTA-APP-000650
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Okta must enforce a minimum 15-character password length. GROUP ID: V-273195 RULE ID: SV-273195r1098852'
  rationale: Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. Password length is one factor of several that helps to determine strength and how long it takes
    to crack a password. The shorter the password, the lower the number of possible combinations that need to be tested before
    the password is compromised. Use of more characters in a password helps to exponentially increase the time and/or resources
    required to compromise the password.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'From the Admin Console:

    1. Select Security >> Authenticators.

    2. Click the "Actions" button next to the "Password" row and select "Edit".

    3. For each listed policy, verify the "Minimum Length" field is set to at least "15"

    characters.

    If any policy is not set to at least "15", this is a finding.'
  remediation: 'From the Admin Console:

    1. Select Security >> Authenticators.

    2. Click the "Actions" button next to the "Password" row and select "Edit".

    3. For each listed policy:

    o Click "Edit".

    o Set the "Minimum Length" field to at least "15" characters.'
  checks:
  - type: manual_review
    info: 'From the Admin Console:

      1. Select Security >> Authenticators.

      2. Click the "Actions" button next to the "Password" row and select "Edit".

      3. For each listed policy, verify the "Minimum Length" field is set to at least "15"

      characters.

      If any policy is not set to at least "15", this is a finding.'
    severity: medium
