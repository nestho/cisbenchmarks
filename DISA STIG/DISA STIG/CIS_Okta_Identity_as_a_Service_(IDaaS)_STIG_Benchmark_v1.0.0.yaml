- id: '1.7'
  title: OKTA-APP-000200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Okta must display the Standard Mandatory DOD Notice and Consent Banner before granting access to the application.
    GROUP ID: V-273192 RULE ID: SV-273192r1098843'
  rationale: 'Display of the DOD-approved use notification before granting access to the application ensures that privacy
    and security notification verbiage used is consistent with applicable federal laws, Executive Orders, directives, policies,
    regulations, standards, and guidance. System use notifications are required only for access via login interfaces with
    human users and are not required when such human interfaces do not exist. The banner must be formatted in accordance with
    DTM-08-060. Use the following verbiage for applications that can accommodate banners of 1300 characters: "You are accessing
    a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only. By using this IS (which
    includes any device attached to this IS), you consent to the following conditions: -The USG routinely intercepts and monitors
    communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network
    operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.
    -At any time, the USG may inspect and seize data stored on this IS. -Communications using, or data stored on, this IS
    are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USGauthorized
    purpose. -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not
    for your personal benefit or privacy. -Notwithstanding the above, using this IS does not constitute consent to PM, LE
    or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal
    representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work
    product are private and confidential. See User Agreement for details." Use the following verbiage for operating systems
    that have severe limitations on the number of characters that can be displayed in the banner: "I''ve read & consent to
    terms in IS user agreem''t." Satisfies: SRG-APP-000068, SRG-APP-000069, SRG-APP-000070'
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'Attempt to log in to the Okta tenant and verify the DOD-approved warning banner is in

    place.

    If the required warning banner is not present and complete, this is a finding.'
  remediation: 'Follow the supplemental instructions in the "Okta DOD Warning Banner Configuration

    Guide" provided with this STIG package.'
  checks:
  - type: manual_review
    info: 'Attempt to log in to the Okta tenant and verify the DOD-approved warning banner is in

      place.

      If the required warning banner is not present and complete, this is a finding.'
    severity: medium
- id: '1.8'
  title: OKTA-APP-000560
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Okta Admin Console application must be configured to use multifactor authentication. GROUP ID: V-273193
    RULE ID: SV-273193r1098846'
  rationale: 'Without the use of multifactor authentication, the ease of access to privileged functions is greatly increased.
    Multifactor authentication requires using two or more factors to achieve authentication. Factors include: (i) something
    a user knows (e.g., password/PIN); (ii) something a user has (e.g., cryptographic identification device, token); or (iii)
    something a user is (e.g., biometric). A privileged account is defined as an information system account with authorizations
    of a privileged user. Network access is defined as access to an information system by a user (or a process acting on behalf
    of a user) communicating through a network (e.g., local area network, wide area network, or the internet). Satisfies:
    SRG-APP-000149, SRG-APP-000154'
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'From the Admin Console:

    1. Go to Security >> Authentication Policies.

    2. Click the "Okta Admin Console" policy.

    3. Click the "Actions" button next to the top rule and select "Edit".

    4. In the "User must authenticate with" field, verify that either "Password/IdP +

    Another factor" or "Any 2 factor types" is selected.

    If either of these settings is incorrect, this is a finding.'
  remediation: 'From the Admin Console:

    1. Go to Security >> Authentication Policies.

    2. Click the "Okta Admin Console" policy.

    3. Click the "Actions" button next to the top rule and select "Edit".

    4. In the "User must authenticate with" field, select either "Password/IdP + Another

    factor" or "Any 2 factor types".'
  checks:
  - type: manual_review
    info: 'From the Admin Console:

      1. Go to Security >> Authentication Policies.

      2. Click the "Okta Admin Console" policy.

      3. Click the "Actions" button next to the top rule and select "Edit".

      4. In the "User must authenticate with" field, verify that either "Password/IdP +

      Another factor" or "Any 2 factor types" is selected.

      If either of these settings is incorrect, this is a finding.'
    severity: medium
- id: '1.9'
  title: OKTA-APP-000570
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Okta Dashboard application must be configured to use multifactor authentication. GROUP ID: V-273194 RULE
    ID: SV-273194r1098849'
  rationale: 'To ensure accountability and prevent unauthenticated access, nonprivileged users must use multifactor authentication
    to prevent potential misuse and compromise of the system. Multifactor authentication uses two or more factors to achieve
    authentication. Factors include: (i) Something you know (e.g., password/PIN); (ii) Something you have (e.g., cryptographic
    identification device, token); or (iii) Something you are (e.g., biometric). A nonprivileged account is any information
    system account with authorizations of a nonprivileged user. Network access is any access to an application by a user (or
    process acting on behalf of a user) where the access is obtained through a network connection. Applications integrating
    with the DOD Active Directory and using the DOD CAC are examples of compliant multifactor authentication solutions. Satisfies:
    SRG-APP-000150, SRG-APP-000155'
  impact: ''
  references: []
