controls:
- id: '1.1'
  title: OKTA-APP-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Okta must log out a session after a 15-minute period of inactivity. GROUP ID: V-273186 RULE ID: SV-273186r1098825'
  rationale: 'A session timeout lock is a temporary action taken when a user stops work and moves away from the immediate
    physical vicinity of the information system but does not log out because of the temporary nature of the absence. Rather
    than relying on the user to manually lock their application session prior to vacating the vicinity, applications must
    be able to identify when a user''s application session has idled and take action to initiate the session lock. The session
    lock is implemented at the point where session activity can be determined and/or controlled. This is typically at the
    operating system level and results in a system lock. However, it may be at the application level where the application
    interface window is secured instead. Satisfies: SRG-APP-000003, SRG-APP-000190'
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'From the Admin Console:

    1. Select Security >> Global Session Policy.

    2. In the Default Policy, verify a rule is configured at Priority 1 that is not named

    "Default Rule".

    3. Click the edit icon next to the Priority 1 rule.

    4. Verify the "Maximum Okta global session idle time" is set to 15 minutes.

    If "Maximum Okta global session idle time" is not set to 15 minutes, this is a finding.'
  remediation: 'From the Admin Console:

    1. Go to Security >> Global Session Policy.

    2. Select the Default Policy.

    3. In the Rules table, make these updates:

    o Click "Add rule".

    o Set "Maximum Okta global session idle time" to 15 minutes.'
  checks:
  - type: manual_review
    info: 'From the Admin Console:

      1. Select Security >> Global Session Policy.

      2. In the Default Policy, verify a rule is configured at Priority 1 that is not named

      "Default Rule".

      3. Click the edit icon next to the Priority 1 rule.

      4. Verify the "Maximum Okta global session idle time" is set to 15 minutes.

      If "Maximum Okta global session idle time" is not set to 15 minutes, this is a finding.'
    severity: medium
