    severity: medium
- id: '1.15'
  title: OKTA-APP-000740
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Okta must enforce 24 hours/one day as the minimum password lifetime. GROUP ID: V-273200 RULE ID: SV-273200r1098867'
  rationale: 'Enforcing a minimum password lifetime helps prevent repeated password changes to defeat the password reuse or
    history enforcement requirement. Restricting this setting limits the user''s ability to change their password. Passwords
    must be changed at specific policy-based intervals; however, if the application allows the user to immediately and continually
    change their password, it could be changed repeatedly in a short period of time to defeat the organization''s policy regarding
    password reuse. Satisfies: SRG-APP-000173, SRG-APP-000870'
  impact: ''
  references: []
