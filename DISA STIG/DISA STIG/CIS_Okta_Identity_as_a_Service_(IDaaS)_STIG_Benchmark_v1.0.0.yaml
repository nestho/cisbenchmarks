  remediation: 'From the Admin Console:

    1. Select Security >> Authenticators.

    2. Click the "Actions" button next to the "Password" row and select "Edit".

    3. For each listed policy:

    o Click "Edit".

    o Set "Password expires after XX days" to "60".'
  checks:
  - type: manual_review
    info: 'From the Admin Console:

