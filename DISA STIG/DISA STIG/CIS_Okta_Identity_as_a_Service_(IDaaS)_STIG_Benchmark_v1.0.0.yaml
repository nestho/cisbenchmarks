    V-273199 RULE ID: SV-273199r1098864'
  rationale: 'Use of a complex password helps to increase the time and resources required to compromise the password. Password
    complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force
    attacks. Password complexity is one factor in determining how long it takes to crack a password. The more complex the
    password, the greater the number of possible combinations that need to be tested before the password is compromised. Special
    characters are not alphanumeric. Examples include: ~ ! @ # $ % ^ *.'
  impact: ''
  references: []
  page_start: 35
  audit_raw: 'From the Admin Console:

    1. Select Security >> Authenticators.

    2. Click the "Actions" button next to the "Password" row and select "Edit".

    3. For each listed policy, verify "Symbol (e.g., !@#$%^&*)" is checked.

    For each policy, if "Symbol (e.g., !@#$%^&*)" is not checked, this is a finding.'
  remediation: 'From the Admin Console:

    1. Select Security >> Authenticators.

    2. Click the "Actions" button next to the "Password" row and select "Edit".

    3. For each listed policy:

    o Click "Edit".

    o Set "Symbol (e.g., !@#$%^&*)" to checked.'
  checks:
  - type: manual_review
    info: 'From the Admin Console:

      1. Select Security >> Authenticators.

