  rationale: 'The use of PIV credentials facilitates standardization and reduces the risk of unauthorized access. DOD has
    mandated the use of the common access card (CAC) to support identity management and personal authentication for systems
    covered under HSPD 12, as well as a primary component of layered protection for national security systems. Satisfies:
