- id: '1.22'
  title: OKTA-APP-001920
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Okta must be configured to use only DOD-approved certificate authorities. GROUP ID: V-273207 RULE ID: SV-273207r1098888'
  rationale: 'Untrusted Certificate Authorities (CA) can issue certificates, but they may be issued by organizations or individuals
    that seek to compromise DOD systems or by organizations with insufficient security controls. If the CA used for verifying
    the certificate is not DOD approved, trust of this CA has not been established. The DOD will accept only PKI certificates
    obtained from a DOD-approved internal or external CA. Reliance on CAs for the establishment of secure sessions includes,
    for example, the use of Transport Layer Security (TLS) certificates. This requirement focuses on communications protection
    for the application session rather than for the network packet. This requirement applies to applications that use communications
    sessions. This includes, but is not limited to, web-based applications and Service-Oriented Architectures (SOA). Satisfies:
    SRG-APP-000427, SRG-APP-000910'
  impact: ''
  references: []
  page_start: 51
  audit_raw: 'From the Admin Console:

    1. Select Security >> Identity Providers (IdPs).

    2. Review the list of IdPs with "Type" as "Smart Card".

    If the IdP is not listed as "Active", this is a finding.

    3. Select Actions >> Configure.

    4. Under "Certificate chain", verify the certificate is from a DOD-approved CA.

    If the certificate is not from a DOD-approved CA, this is a finding.'
  remediation: 'From the Admin Console:

    1. Go to Security >> Identity Providers.

    2. Click "Add identity provider."

    3. Click "Smart Card IdP". Click "Next".

    4. Enter the name of the identity provider.

    5. Build a certificate chain:

    o Click "Browse" to open a file explorer. Select the certificate file to add and

    click "Open".

    o To add another certificate, click "Add Another" and repeat step 1.

    o Click "Build certificate chain". On success, the chain and its certificates

    are shown. If the build failed, correct any issues and try again.

    o Click "Reset certificate chain" if replacing the current chain with a new

    one.

    6. In "IdP username", select the "idpuser.subjectAltNameUpn" attribute. This is the

    attribute that stores the Electronic Data Interchange Personnel Identifier (EDIPI)

    on the CAC.

    7. In the "Match Against" field, select the Okta Profile Attribute in which the EDIPI is

    to be stored.'
  checks:
  - type: manual_review
    info: 'From the Admin Console:

      1. Select Security >> Identity Providers (IdPs).

      2. Review the list of IdPs with "Type" as "Smart Card".

      If the IdP is not listed as "Active", this is a finding.

      3. Select Actions >> Configure.

      4. Under "Certificate chain", verify the certificate is from a DOD-approved CA.

      If the certificate is not from a DOD-approved CA, this is a finding.'
    severity: medium
- id: '1.23'
  title: OKTA-APP-002980
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Okta must validate passwords against a list of commonly used, expected, or compromised passwords. GROUP ID:
    V-273208 RULE ID: SV-273208r1099769'
  rationale: Password-based authentication applies to passwords regardless of whether they are used in single-factor or multifactor
    authentication. Long passwords or passphrases are preferable over shorter passwords. Enforced composition rules provide
    marginal security benefits while decreasing usability. However, organizations may choose to establish certain rules for
    password generation (e.g., minimum character length for long passwords) under certain circumstances and can enforce this
    requirement in IA-5(1)(h). Account recovery can occur, for example, in situations when a password is forgotten. Cryptographically
    protected passwords include salted one-way cryptographic hashes of passwords. The list of commonly used, compromised,
    or expected passwords includes passwords obtained from previous breach corpuses, dictionary words, and repetitive or sequential
    characters. The list includes context-specific words, such as the name of the service, username, and derivatives thereof.
  impact: ''
  references: []
  page_start: 53
  audit_raw: 'From the Admin Console:

    1. Navigate to Security >> Authenticators.

    2. Click the "Actions" button next to the Password authenticator and select "Edit".

    3. Under the "Password Settings" section, verify the "Common Password Check"

    box is checked.

    If "Common Password Check" is not selected, this is a finding.'
  remediation: 'From the Admin Console:

    1. Navigate to Security >> Authenticators.

    2. Click the "Actions" button next to the Password authenticator and select "Edit".

    3. Under the "Password Settings" section, check the "Common Password Check"

    box.'
  checks:
  - type: manual_review
    info: 'From the Admin Console:

