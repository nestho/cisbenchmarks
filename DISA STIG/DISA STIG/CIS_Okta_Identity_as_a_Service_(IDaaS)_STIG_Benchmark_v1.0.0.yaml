- id: '1.18'
  title: OKTA-APP-001665
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Okta must be configured to limit the global session lifetime to 18 hours. GROUP ID: V-273203 RULE ID: SV-273203r1099958'
  rationale: Without reauthentication, users may access resources or perform tasks for which they do not have authorization.
    When applications provide the capability to change security roles or escalate the functional capability of the application,
    it is critical the user reauthenticate. In addition to the reauthentication requirements associated with session locks,
    organizations may require reauthentication of individuals and/or devices in other situations, including (but not limited
    to) the following circumstances. (i) When authenticators change; (ii) When roles change; (iii) When security categories
    of information systems change; (iv) When the execution of privileged functions occurs; (v) After a fixed period of time;
    or (vi) Periodically. Within the DOD, the minimum circumstances requiring reauthentication are privilege escalation and
    role changes.
  impact: ''
  references: []
  page_start: 43
  audit_raw: 'From the Admin Console:

    1. Select Security >> Global Session Policy.

    2. In the Default Policy, verify a rule is configured at Priority 1 that is not named

    "Default Rule".

    3. Click the "Edit" icon next to the Priority 1 rule.

    4. Verify "Maximum Okta global session lifetime" is set to 18 hours.

    If the above is not set, this is a finding.'
  remediation: 'From the Admin Console:

    1. Go to Security >> Global Session Policy.

    2. Select the Default Policy.

    3. In the Rules table, make these updates:

    o Click "Add rule".

    o Set "Maximum Okta global session lifetime" to 18 hours.'
  checks:
  - type: manual_review
    info: 'From the Admin Console:

      1. Select Security >> Global Session Policy.

      2. In the Default Policy, verify a rule is configured at Priority 1 that is not named

      "Default Rule".

      3. Click the "Edit" icon next to the Priority 1 rule.

      4. Verify "Maximum Okta global session lifetime" is set to 18 hours.

      If the above is not set, this is a finding.'
    severity: medium
