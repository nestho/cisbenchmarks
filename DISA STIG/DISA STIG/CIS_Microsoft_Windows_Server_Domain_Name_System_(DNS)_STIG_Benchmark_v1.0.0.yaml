    the DNS server and then expand "Forward Lookup Zones".

    From the expanded list, review each zone.

    Consult with the DNS Admin to determine if any of the zones also have hostnames that

    need to be resolved from the external network.

    If the zone is split between internal and external networks, verify separate DNS servers

    have been implemented for each network.

    If internal and external DNS servers have not been implemented for zones that require

    resolution from both the internal and external networks, this is a finding.'
  remediation: Configure separate DNS servers for each of the external and internal networks.
  checks:
  - type: manual_review
    info: 'Log on to the DNS server using the Domain Admin or Enterprise Admin account or

