- id: '1.76'
  title: WDNS-22-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'A unique Transaction Signature (TSIG) key must be generated for each pair of communicating hosts. GROUP ID:
    V-259410 RULE ID: SV-259410r1081086'
  rationale: To enable zone transfer (requests and responses) through authenticated messages, it is necessary to generate
    a key for every pair of name servers. The key also can be used for securing other transactions, such as dynamic updates,
    DNS queries, and responses. The binary key string generated by most key generation utilities used with DNSSEC is Base64
    encoded. TSIG is a string used to generate the message authentication hash stored in a TSIG Resource Record (RR) and used
    to authenticate an entire DNS message.
  impact: ''
  references: []
  page_start: 185
  audit_raw: 'This check is not applicable for Windows DNS Servers that only host Active Directoryintegrated zones or for
    Windows DNS servers on a classified network.

    Review the DNS implementation. Verify that each pair of communicating hosts has a

    unique TSIG key (i.e., a separate key for each secondary name server to authenticate

    transactions with the primary name server, etc.).

    If a unique TSIG key has not been generated for each pair of communicating hosts, this

    is a finding.

    If using DNSSEC, this requirement is not applicable.'
  remediation: 'Regenerate a unique TSIG key for each pair of communicating hosts within the DNS

    architecture.'
  checks:
  - type: manual_review
    info: 'This check is not applicable for Windows DNS Servers that only host Active Directoryintegrated zones or for Windows
