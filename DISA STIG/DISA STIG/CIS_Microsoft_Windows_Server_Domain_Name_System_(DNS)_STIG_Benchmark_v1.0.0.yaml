- id: '1.29'
  title: WDNS-22-000035
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Windows DNS Server must uniquely identify the other DNS server before responding to a server-to-server
    transaction. GROUP ID: V-259363 RULE ID: SV-259363r960999'
  rationale: Without identifying devices, unidentified or unknown devices may be introduced, thereby facilitating malicious
    activity. This applies to server-to-server (zone transfer) transactions only and is provided by TSIG/SIG(0), which enforces
    mutual server authentication using a key that is unique to each server pair, TSIG, or using PKI-based authentication,
    SIG(0), thus uniquely identifying the other server. TSIG and SIG(0) are not configurable in Windows DNS Server. To meet
    the requirement for authentication between Windows DNS Servers, IPsec will be implemented between the Windows DNS Servers
    that host any non-Active Directory (AD)-integrated zones.
  impact: ''
  references: []
  page_start: 68
  audit_raw: 'Note: This requirement applies to any Windows DNS Server that hosts non-ADintegrated zones, even if the DNS
    servers host AD-integrated zones, too.

    Log on to the DNS server using the Domain Admin or Enterprise Admin account or

    Local Administrator account.

    Press the Windows key + R and execute "gpme.msc" to open the Group Policy

    Management feature.

    In the "Browse for Group Policy Object" dialog box, double-click "Domain

    Controllers.domain.com".

    Click "Default Domain Controllers Policy" and click "OK".

    In the console tree, open Computer Configuration\Policies\Windows Settings\Security

    Settings\Windows Firewall with Advanced Security\Windows Firewall with Advanced

    Security - LDAP.

    Click "Connection Security Rules".

    Confirm at least one rule is configured for TCP 53.

    Double-click on each rule to verify the following:

    On the "Authentication" tab, "Authentication mode:" is set to "Request authentication for

    inbound and outbound connections".

    The "Signing Algorithm" is set to "RSA (default)".

    On the "Remote Computers" tab, "Endpoint1" and "Endpoint2" are configured with the

    IP addresses of all DNS servers.

    On the "Protocols and Ports" tab, "Protocol type:" is set to either TCP (depending on

    which rule is being reviewed) and the "Endpoint 1 port:" is set to "Specific ports" and

    "53".

    If no rules are configured with the specified requirements, this is a finding.'
  remediation: 'Complete the following procedures twice for each pair of name servers.

    Create a rule for TCP connections.

    Log on to the DNS server using the Domain Admin or Enterprise Admin account or

    Local Administrator account.

    Press the Windows key + R and execute "gpme.msc" to open the Group Policy

    Management feature.

    In the "Browse for Group Policy Object" dialog box, double-click "Domain

    Controllers.domain.com".

    Click "Default Domain Controllers Policy" and click "OK".

    In the console tree, open Computer Configuration\Policies\Windows Settings\Security

    Settings\Windows Firewall with Advanced Security\Windows Firewall with Advanced

    Security - LDAP.

    Right-click "Connection Security Rules" and select "New".

    For "Rule Type", select the "Server-to-server" radio button and click "Next".

    For Endpoint 1 and Endpoint 2, select "These IP addresses:" and add the IP addresses

    of all DNS servers. Click "Next".

    For "Requirements", select "Request authentication for inbound and outbound

    connections" and click "Next".

    For "Authentication Method", select Computer certificate and from the "Signing

    Algorithm:" drop-down, select "RSA (default)".

    From the "Certificate store type:" drop-down, select "Root CA (default)".

    From the "CA name:", click "Browse", select the certificate for the CA, and click "Next".

    On "Profile", accept default selections and click "Next".

    On "Name", enter a name applicable to the rule''s function.

    Click "Finish".'
