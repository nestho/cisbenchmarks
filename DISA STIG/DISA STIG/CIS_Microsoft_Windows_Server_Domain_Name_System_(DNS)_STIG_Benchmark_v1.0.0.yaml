- id: '1.43'
  title: WDNS-22-000049
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'WINS lookups must be disabled on the Windows DNS Server. GROUP ID: V-259377 RULE ID: SV-259377r961581'
  rationale: The major threat associated with DNS forged responses or failures is the integrity of the DNS data returned in
    the response. The principle of DNSSEC is to mitigate this threat by providing data origin authentication, establishing
    trust in the source. By requiring remote clients to obtain origin authentication and integrity verification assurances
    for the host/service name to network address resolution information obtained through the service, data origin is validated.
    A DNS server is an example of an information system providing name/address resolution service. Digital signatures and
    cryptographic keys are examples of additional artifacts. DNS resource records are examples of authoritative data. Applications
    other than the DNS, to map between host/service names and network addresses, must provide other means to assure the authenticity
    and integrity of response data. In the case of DNS, employ DNSSEC to provide an additional data origin and integrity artifacts
    along with the authoritative data the system returns in response to DNS name/address resolution queries. If/when WINS
    lookups are enabled, the validity of the data becomes questionable because the WINS data is provided to the requestor
    unsigned and invalidated. To ensure only the DNSSEC-signed data is being returned, WINS lookups must be disabled.
