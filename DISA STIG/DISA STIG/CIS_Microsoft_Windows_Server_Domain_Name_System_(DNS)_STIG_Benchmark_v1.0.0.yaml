- id: '1.31'
  title: WDNS-22-000037
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Windows DNS primary server must only send zone transfers to a specific list of secondary name servers.
    GROUP ID: V-259365 RULE ID: SV-259365r960735'
  rationale: Primary name servers also make outbound connection to secondary name servers to provide zone transfers and accept
    inbound connection requests from clients wishing to provide a dynamic update. Primary name servers should explicitly limit
    zone transfers to be made only to designated secondary name servers. Because zone transfers involve the transfer of entire
    zones and use TCP connections, they place substantial demands on network resources relative to normal DNS queries. Errant
    or malicious frequent zone transfer requests on the name servers of the enterprise can overload the master zone server
    and result in a denial of service to legitimate users. Active Directory (AD)-integrated DNS servers replicate zone information
    via AD replication. Non-AD-integrated DNS servers replicate zone information via zone transfers.
