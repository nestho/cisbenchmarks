    Right-click the DNS server and select "Properties".

    Select the "Root Hints" tab.

    Verify "Root Hints" is empty or only has entries for internal zones under "Name

    servers:". All internet root server entries must be removed.

    If "Root Hints" is not empty or entries on the "Root Hints" tab under "Name servers:" are

    external to the local network, this is a finding.'
  remediation: 'Log on to the authoritative DNS server using the Domain Admin or Enterprise Admin

    account.

    Press the Windows key + R and execute "dnsmgmt.msc".

    Right-click the DNS server and select "Properties".

    Select the "Root Hints" tab.

    Remove the root hints from the DNS Manager, the CACHE.DNS file, and from Active

    Directory for name servers outside the internal network.

    Replace the existing root hints with new root hints of internal servers.

    If the DNS server is forwarding, click to select the "Do not use recursion for this

    domain"" check box on the "Forwarders" tab in DNS Manager to ensure the root hints

    will not be used.'
