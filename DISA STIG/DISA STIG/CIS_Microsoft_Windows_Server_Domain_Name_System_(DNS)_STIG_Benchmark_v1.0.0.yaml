    the DNS server and then expand "Forward Lookup Zones".

    From the expanded list, click to select the zone.

    Review the zone''s RRs and verify HINFO, RP, and LOC RRs are not used. If TXT RRs

    are used, they must not reveal any information about the organization that could be

    used for malicious purposes.

    If there are any HINFO, RP, LOC, or revealing TXT RRs in any zone hosted by the DNS

    server, this is a finding.'
  remediation: 'Log on to the DNS server using the Domain Admin or Enterprise Admin account or

    Local Administrator account.

    Press the Windows key + R and execute "dnsmgmt.msc".

    On the opened DNS Manager snap-in from the left pane, expand the server name for

    the DNS server and then expand "Forward Lookup Zones".

    From the expanded list, click to select the zone.

    Remove all HINFO, RP, TXT, and LOC RRs from all zones hosted by the DNS server.'
