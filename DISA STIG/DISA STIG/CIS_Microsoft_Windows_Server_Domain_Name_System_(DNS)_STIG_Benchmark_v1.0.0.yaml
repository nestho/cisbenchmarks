- id: '1.68'
  title: WDNS-22-000074
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Windows DNS Server must follow procedures to re-role a secondary name server as the primary name server
    if the primary name server permanently loses functionality. GROUP ID: V-259402 RULE ID: SV-259402r987708'
  rationale: Failing to an unsecure condition negatively impacts application security and can lead to system compromise. Failure
    conditions include, for example, loss of communications among critical system components or between system components
    and operational facilities. Fail-safe procedures include, for example, alerting operator personnel and providing specific
    instructions on subsequent steps to take (e.g., do nothing, reestablish system settings, shutdown processes, restart the
    system, or contact designated organizational personnel). If a component such as the DNSSEC or TSIG/SIG(0) signing capabilities
    were to fail, the DNS server should shut itself down to prevent continued execution without the necessary security components
    in place. Transactions such as zone transfers would not be able to work correctly in this state.
  impact: ''
  references: []
  page_start: 168
  audit_raw: 'Active Directory (AD)-integrated DNS servers will handle the promotion of a secondary

    DNS server when a primary DNS server loses functionality.

    If all of the DNS servers are AD integrated, this is not a finding.

    Consult with the system administrator to determine if there are documented procedures

    to re-role a non-AD-integrated secondary name server to a master name server role if a

    master name server loses functionality.

    If there are no documented procedures to re-role a non-AD-integrated secondary name

    server to primary if a master name server loses functionality, this is a finding.'
  remediation: 'AD-integrated DNS servers will handle the promotion of a secondary DNS server when

    a primary DNS server loses functionality.

    Develop, test, and implement documented procedures to re-role a non-AD-integrated

    secondary name server to a master name server role if a master name server loses

    functionality.'
