  - 'SEVERITY: CAT II'
  description: 'The Windows DNS Server must be configured to only allow zone information that reflects the environment for
    which it is authoritative, including IP ranges and IP versions. GROUP ID: V-259401 RULE ID: SV-259401r961158'
  rationale: DNS zone data for which a Windows DNS Server is authoritative should represent the network for which it is responsible.
    If a Windows DNS Server hosts zone records for other networks or environments, the records could become invalid or stale
    or be redundant/conflicting with a DNS server truly authoritative for the other network environment.
