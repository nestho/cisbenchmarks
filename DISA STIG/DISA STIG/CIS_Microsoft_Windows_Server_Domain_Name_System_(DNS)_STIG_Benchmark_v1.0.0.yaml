- id: '1.22'
  title: WDNS-22-000025
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Windows DNS Servers zone database files must not be accessible for edit/write by users and/or processes
    other than the Windows DNS Server service account and/or the DNS database administrator. GROUP ID: V-259355 RULE ID: SV-259355r961863'
  rationale: Discretionary Access Control (DAC) is based on the premise that individual users are "owners" of objects and
    therefore have discretion over who should be authorized to access the object and in which mode (e.g., read or write).
    Ownership is usually acquired as a consequence of creating the object or via specified ownership assignment. In a DNS
    implementation, DAC should be granted to a minimal number of individuals and objects because DNS does not interact directly
    with users and users do not store and share data with the DNS application directly. The primary objective of DNS authentication
    and access control is the integrity of DNS records; only authorized personnel must be able to create and modify resource
    records, and name servers should only accept updates from authoritative primary servers for the relevant zones. Integrity
    is best ensured through authentication and access control features within the name server software and the file system
    the name server resides on. To protect the zone files and configuration data, which should only be accessed by the name
    service or an administrator, access controls must be implemented on files, and rights should not be easily propagated
    to other users. Lack of a stringent access control policy places the DNS infrastructure at risk to malicious persons and
    attackers and creates the potential for a denial of service to network resources. DAC allows the owner to determine who
    will have access to objects they control. An example of DAC includes user-controlled file permissions. DAC models have
    the potential for the access controls to propagate without limit, resulting in unauthorized access to objects. When applications
    provide a DAC mechanism, the DNS implementation must be able to limit the propagation of those access rights.
  impact: ''
  references: []
  page_start: 55
