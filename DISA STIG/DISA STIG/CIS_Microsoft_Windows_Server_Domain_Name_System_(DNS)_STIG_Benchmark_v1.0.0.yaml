- id: '1.14'
  title: WDNS-22-000016
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Windows DNS Server''s zone files must have NS records that point to active name servers authoritative
    for the domain specified in that record. GROUP ID: V-259347 RULE ID: SV-259347r961863'
  rationale: Poorly constructed NS records pose a security risk because they create conditions under which an adversary might
    be able to provide the missing authoritative name services that are improperly specified in the zone file. The adversary
    could issue bogus responses to queries that clients would accept because they learned of the adversary's name server from
    a valid authoritative name server, one that need not be compromised for this attack to be successful. The list of secondary
    servers must remain current within 72 hours of any changes to the zone architecture that would affect the list of secondaries.
    If a secondary server has been retired or is not operational but remains on the list, an adversary might have a greater
    opportunity to impersonate that secondary without detection, rather than if the secondary was online. For example, the
    adversary may be able to spoof the retired secondary's IP address without an IP address conflict, which would not be likely
    to occur if the true secondary were active.
  impact: ''
