- id: '1.12'
  title: WDNS-22-000014
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The validity period for the Resource Record Signatures (RRSIGs) covering a zone''s DNSKEY RRSet must be no
    less than two days and no more than one week. GROUP ID: V-259345 RULE ID: SV-259345r961863'
  rationale: The best way for a zone administrator to minimize the impact of a key compromise is by limiting the validity
    period of RRSIGs in the zone and the parent zone. This strategy limits the time during which an attacker can take advantage
    of a compromised key to forge responses. An attacker that has compromised a zone signing key (ZSK) can use that key only
    during the key signing key's (KSK's) signature validity interval. An attacker that has compromised a KSK can use that
    key for only as long as the signature interval of the RRSIG covering the Delegation Signer (DS) Resource Record (RR) in
    the delegating parent. These validity periods should be short, which will require frequent resigning. To minimize the
    impact of a compromised ZSK, a zone administrator should set a signature validity period of one week for RRSIGs covering
    the DNSKEY RRSet in the zone (the RRSet that contains the ZSK and KSK for the zone). The DNSKEY RRSet can be re-signed
    without performing a ZSK rollover, but scheduled ZSK rollovers should still be performed at regular intervals.
  impact: ''
  references: []
