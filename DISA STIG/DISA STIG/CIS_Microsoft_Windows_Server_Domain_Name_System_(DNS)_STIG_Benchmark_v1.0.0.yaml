      If the organization does not have a backup policy in place for backing up the Windows

      DNS Server''s audit records and/or the backup methods have not been successful at

      backing up the audit records at least every seven days, this is a finding.'
    severity: medium
- id: '1.82'
  title: WDNS-22-000119
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'In a split DNS configuration, where separate name servers are used between the external and internal networks,
    the internal name server must be configured to not be reachable from outside resolvers. GROUP ID: V-259416 RULE ID: SV-259416r961863'
  rationale: Instead of having the same set of authoritative name servers serve different types of clients, an enterprise
    could have two different sets of authoritative name servers. One set, called external name servers, can be located within
    a DMZ; these would be the only name servers that are accessible to external clients and would serve resource records (RRs)
    pertaining to hosts with public services (web servers that serve external web pages or provide business-to-consumer services,
    mail servers, etc.). The other set, called internal name servers, is to be located within the firewall and should be configured
    so the servers are not reachable from outside and hence provide naming services exclusively to internal clients.
  impact: ''
  references: []
  page_start: 196
  audit_raw: 'Consult with the system administrator to review the internal Windows DNS Server''s

    firewall policy.

    The inbound TCP and UDP ports 53 rule should be configured to only allow hosts from

    the internal network to query the internal DNS server.

    If the firewall policy is not configured with the restriction, consult with the network

    firewall administrator to confirm the restriction on the network firewall.

    If neither the DNS server''s firewall policy nor the network firewall is configured to block

    external hosts from querying the internal DNS server, this is a finding.'
  remediation: 'Configure the internal DNS server''s firewall policy, or the network firewall, to block

    queries from external hosts.'
  checks:
  - type: manual_review
    info: 'Consult with the system administrator to review the internal Windows DNS Server''s

      firewall policy.

      The inbound TCP and UDP ports 53 rule should be configured to only allow hosts from

      the internal network to query the internal DNS server.

      If the firewall policy is not configured with the restriction, consult with the network

      firewall administrator to confirm the restriction on the network firewall.

      If neither the DNS server''s firewall policy nor the network firewall is configured to block

      externa'
    severity: medium
- id: '1.83'
  title: WDNS-22-000120
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Windows DNS response rate limiting (RRL) must be enabled. GROUP ID: V-259417 RULE ID: SV-259417r961155'
  rationale: This setting can prevent someone from sending a denial-of-service attack using the DNS servers. For instance,
    a bot net can send requests to the DNS server using the IP address of a third computer as the requestor. Without RRL,
    the DNS servers might respond to all the requests, flooding the third computer.
  impact: ''
  references: []
  page_start: 198
  audit_raw: 'As an administrator, run PowerShell and enter the following command:

    "Get-DnsServerResponseRateLimiting".

    If "Mode" is not set to "Enable", this is a finding.'
  remediation: 'As an administrator, run PowerShell and enter the command "SetDnsServerResponseRateLimiting" to apply default
    values or "SetDnsServerResponseRateLimiting -WindowInSec 7 -LeakRate 4 -TruncateRate 3 -

    ErrorsPerSec 8 -ResponsesPerSec 8".

    These settings are just an example. For more information, go to:

    https://learn.microsoft.com/en-us/powershell/module/dnsserver/setdnsserverresponseratelimiting?view=windowsserver2022-ps'
  checks:
  - type: manual_review
    info: 'As an administrator, run PowerShell and enter the following command:

      "Get-DnsServerResponseRateLimiting".

      If "Mode" is not set to "Enable", this is a finding.'
    severity: medium
