- id: '1.60'
  title: WDNS-22-000066
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Windows DNS Server must only contain zone records that have been validated annually. GROUP ID: V-259394
    RULE ID: SV-259394r961599'
  rationale: If zone information has not been validated in more than a year, there is no assurance that it is still valid.
    If invalid records are in a zone, an adversary could potentially use their existence for improper purposes. A standard
    operating procedure detailing this process can resolve this requirement.
  impact: ''
  references: []
