    On the opened DNS Manager snap-in from the left pane, expand the server name for

    the DNS server and then expand "Forward Lookup Zones".

    From the expanded list, click to select the zone.

    Review the records for the zone and ensure the complete RRSet of records is present:

    RRSIG, NSEC3, DNSKEY, indicating DNSSEC compliance.

    If the RRSet of records is not in the zone, this is a finding.'
  remediation: 'Sign or re-sign the hosted zone(s) on the DNS server being validated.

