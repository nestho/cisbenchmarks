- id: '1.26'
  title: WDNS-22-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Windows DNS Server''s zone files must not include CNAME records pointing to a zone with lesser security
    for more than six months. GROUP ID: V-259359 RULE ID: SV-259359r961863'
  rationale: 'The use of CNAME records for exercises, tests, or zone-spanning (pointing to zones with lesser security) aliases
    should be temporary (e.g., to facilitate a migration) and not be in place for more than six months. When a host name is
    an alias for a record in another zone, an adversary has two points of attack: the zone in which the alias is defined and
    the zone authoritative for the alias''s canonical name. This configuration also reduces the speed of client resolution
    because it requires a second lookup after obtaining the canonical name. In the case of an authoritative name server, this
    information is promulgated throughout the enterprise to caching servers, which compounds the vulnerability.'
  impact: ''
  references: []
