- id: '1.25'
  title: WDNS-22-000029
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Windows DNS Servers zone files must not include resource records that resolve to a fully qualified domain
    name residing in another zone. GROUP ID: V-259358 RULE ID: SV-259358r961863'
  rationale: If a name server could claim authority for a resource record in a domain for which it was not authoritative,
    this would pose a security risk. In this environment, an adversary could use illicit control of a name server to impact
    IP address resolution beyond the scope of that name server (i.e., by claiming authority for records outside of that server's
    zones). Fortunately, all but the oldest versions of BIND and most other DNS implementations do not allow for this behavior.
    The best way to eliminate this risk is to eliminate from the zone files any records for hosts in another zone. The exceptions
    are glue records supporting zone delegations, CNAME records supporting a system migration, or CNAME records that point
    to third-party content delivery networks (CDNs) or cloud computing platforms. In the case of third-party CDNs or cloud
    offerings, an approved mission need must be demonstrated.
  impact: ''
  references: []
  page_start: 61
  audit_raw: 'Log on to the DNS server using the Domain Admin or Enterprise Admin account or

    Local Administrator account.

    Press the Windows key + R and execute "dnsmgmt.msc".

    On the opened DNS Manager snap-in from the left pane, expand the server name for

    the DNS server and then expand "Forward Lookup Zones".

    From the expanded list, click to select the zone.

    Confirm with the DNS administrator that the hosts defined in the zone files do not

    resolve to hosts in another zone with its fully qualified domain name.

    The exceptions are glue records supporting zone delegations, CNAME records

    supporting a system migration, or CNAME records that point to third-party CDNs or

    cloud computing platforms. In the case of third-party CDNs or cloud offerings, an

    approved mission need must be demonstrated. Additional exceptions are CNAME

    records in a multidomain Active Directory environment pointing to hosts in other internal

    domains in the same multidomain environment.

    If resource records are maintained that resolve to a fully qualified domain name in

    another zone, and the usage is not for resource records resolving to hosts that are glue

    records supporting zone delegations, CNAME records supporting a system migration, or

    CNAME records that point to third-party CDNs or cloud computing platforms with a

    documented and approved mission need, this is a finding.'
  remediation: 'Remove any resource records in a zone file if the resource record resolves to a fully

    qualified domain name residing in another zone.'
