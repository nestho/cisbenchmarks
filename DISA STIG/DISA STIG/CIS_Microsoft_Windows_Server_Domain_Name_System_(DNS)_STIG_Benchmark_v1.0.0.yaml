    their geographic location with the system administrator.

    If all of the authoritative name servers are located on the same network segment and

    the primary authoritative name server is not "hidden", this is a finding.'
  remediation: 'For non-AD-integrated Windows DNS Servers, distribute secondary authoritative

    servers on separate network segments from the primary authoritative server.'
