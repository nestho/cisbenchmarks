- id: '1.62'
  title: WDNS-22-000068
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Windows DNS Server must use DNS Notify to prevent denial of service (DoS) through increase in workload.
    GROUP ID: V-259396 RULE ID: SV-259396r961155'
  rationale: In the case of application DoS attacks, care must be taken when designing the application to ensure it makes
    the best use of system resources. SQL queries have the potential to consume large amounts of CPU cycles if they are not
    tuned for optimal performance. Web services containing complex calculations requiring large amounts of time to complete
    can bog down if too many requests for the service are encountered within a short period of time.
