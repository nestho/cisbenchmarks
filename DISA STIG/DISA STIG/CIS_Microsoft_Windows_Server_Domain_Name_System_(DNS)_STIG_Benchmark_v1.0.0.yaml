- id: '1.23'
  title: WDNS-22-000026
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Windows DNS Server must implement internal/external role separation. GROUP ID: V-259356 RULE ID: SV-259356r961863'
  rationale: DNS servers with an internal role only process name/address resolution requests from within the organization
    (i.e., internal clients). DNS servers with an external role only process name/address resolution information requests
    from clients external to the organization (i.e., on the external networks, including the internet). The set of clients
    that can access an authoritative DNS server in a particular role is specified by the organization using address ranges,
    explicit access control lists, etc. To protect internal DNS resource information, it is important to isolate the requests
    to internal DNS servers. Separating internal and external roles in DNS prevents address space that is private (e.g., 10.0.0.0/24)
    or otherwise concealed by some form of Network Address Translation from leaking into the public DNS system.
  impact: ''
  references: []
  page_start: 57
  audit_raw: 'Log on to the DNS server using the Domain Admin or Enterprise Admin account or

    Local Administrator account.

