- id: '1.20'
  title: WDNS-22-000022
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'In a split DNS configuration between the external and internal networks, the external name server must be
    configured to not be reachable from inside resolvers. GROUP ID: V-259353 RULE ID: SV-259353r961863'
  rationale: Instead of having the same set of authoritative name servers serve different types of clients, an enterprise
    could have two different sets of authoritative name servers. One set, called external name servers, can be located within
    a DMZ; these would be the only name servers that are accessible to external clients and would serve resource records (RRs)
    pertaining to hosts with public services (web servers that serve external web pages or provide business-to-consumer services,
    mail servers, etc.). The other set, called internal name servers, is to be located within the firewall and should be configured
    so the servers are not reachable from outside and hence provide naming services exclusively to internal clients.
  impact: ''
  references: []
  page_start: 51
  audit_raw: 'Consult with the system administrator to review the external Windows DNS Server''s

    DOD approved firewall policy.

    The inbound TCP and UDP ports 53 rule should be configured to only restrict IP

    addresses from the internal network.

    If the DOD-approved firewall policy is not configured with the restriction, consult with the

    network firewall administrator to confirm the restriction on the network firewall.

    If neither the DNS server''s DOD approved firewall policy nor the network firewall is

    configured to block internal hosts from querying the external DNS server, this is a

    finding.'
  remediation: 'Configure the external DNS server''s firewall policy, or the network firewall, to block

