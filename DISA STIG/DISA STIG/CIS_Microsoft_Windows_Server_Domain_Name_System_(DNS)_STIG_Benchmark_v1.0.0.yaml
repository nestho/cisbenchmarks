- id: '1.71'
  title: WDNS-22-000077
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Windows DNS Server must, when a component failure is detected, activate a notification to the system administrator.
    GROUP ID: V-259405 RULE ID: SV-259405r987640'
  rationale: Predictable failure prevention requires organizational planning to address system failure issues. If components
    key to maintaining systems security fail to function, the system could continue operating in an insecure state. The organization
    must be prepared, and the application must support requirements that specify if the application must alarm for such conditions
    and/or automatically shut down the application or the system. This can include conducting a graceful application shutdown
    to avoid losing information. Automatic or manual transfer of components from standby to active mode can occur, for example,
    upon detection of component failures. If a component such as the DNSSEC or TSIG/SIG(0) signing capabilities were to fail,
    the DNS server should shut itself down to prevent continued execution without the necessary security components in place.
    Transactions such as zone transfers would not be able to work correctly in this state.
  impact: ''
  references: []
  page_start: 174
  audit_raw: 'Notification to the system administrator is not configurable in Windows DNS Server. For

    system administrators to be notified when a component fails, the system administrator

    would have to implement a third-party monitoring system. At a minimum, the system

    administrator should have a documented procedure in place to review the diagnostic

