  rationale: Not configuring a local cache of revocation data could allow access to users who are no longer authorized (users
    with revoked certificates). SIG(0) is used for server-to-server authentication for DNS transactions, and it uses PKIbased
    authentication. In cases where SIG(0) is being used instead of TSIG (which uses a shared key, not PKI-based authentication),
    this requirement is applicable.
