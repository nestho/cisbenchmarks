controls:
- id: '1.1'
  title: WDNS-22-000001
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Windows DNS Server must restrict incoming dynamic update requests to known clients. GROUP ID: V-259334
    RULE ID: SV-259334r960735'
  rationale: Limiting the number of concurrent sessions reduces the risk of denial of service (DoS) on any system. A DNS server's
    function requires it to be able to handle multiple sessions at a time, so limiting concurrent sessions could impact availability.
    Primary name servers must be configured to limit the actual hosts from which they will accept dynamic updates and zone
    transfer requests, and all name servers should be configured to limit the hosts from/to which they receive/send zone transfers.
    Restricting sessions to known hosts will mitigate the DoS vulnerability.
  impact: ''
  references: []
  page_start: 12
  audit_raw: 'Log on to the DNS server using the Domain Admin or Enterprise Admin account or

    Local Administrator account.

    Press the Windows key + R and execute "dnsmgmt.msc".

    On the opened DNS Manager snap-in from the left pane, expand the server name and

    then expand "Forward Lookup Zones".

    From the expanded list, click to select the zone.

    Once selected, right-click the name of the zone.

    From the displayed context menu, click the "Properties" option.

    On the opened domain''s properties box, click the "General" tab.

    Verify the "Type:" is "Active Directory-Integrated".

    Verify "Dynamic updates" has "Secure only" selected.

    If the zone is "Active Directory-Integrated" and "Dynamic updates" are not configured for

    "Secure only", this is a finding.'
  remediation: 'Log on to the DNS server using the Domain Admin or Enterprise Admin account or

    Local Administrator account.

    Press the Windows key + R and execute "dnsmgmt.msc".

    On the opened DNS Manager snap-in from the left pane, expand the server name and

    then expand "Forward Lookup Zones".

    From the expanded list, click to select the zone.

    Once selected, right-click the name of the zone.

    From the displayed context menu, click the "Properties" option.

    On the opened domain''s properties box, click the "General" tab.

    If the "Type:" is not "Active Directory-Integrated", configure the zone for Active Directory

    integration.

    Select "Secure only" from the "Dynamic updates:" drop-down list.'
  checks:
  - type: manual_review
    info: 'Log on to the DNS server using the Domain Admin or Enterprise Admin account or

      Local Administrator account.

      Press the Windows key + R and execute "dnsmgmt.msc".

      On the opened DNS Manager snap-in from the left pane, expand the server name and

      then expand "Forward Lookup Zones".

      From the expanded list, click to select the zone.

      Once selected, right-click the name of the zone.

      From the displayed context menu, click the "Properties" option.

      On the opened domain''s properties box, click the "General" '
    severity: medium
- id: '1.2'
  title: WDNS-22-000002
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Windows DNS Server must be configured to record who added/modified/deleted DNS zone information. GROUP
    ID: V-259335 RULE ID: SV-259335r987677'
  rationale: Without a means for identifying the individual that produced the information, the information cannot be relied
    on. Identifying the validity of information may be delayed or deterred. This requirement ensures organizational personnel
    have a means to identify who produced or changed specific information in transfers, zone information, or DNS configuration
    changes.
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'Log on to the DNS server using the Domain Admin or Enterprise Admin account or

    Local Administrator account.

    Press the Windows key + R and execute "dnsmgmt.msc".

    Right-click the DNS server and select "Properties".

    Click the "Event Logging" tab. By default, all events are logged.

    Verify "Errors and warnings" or "All events" is selected.

    If any option other than "Errors and warnings" or "All events" is selected, this is a

    finding.'
  remediation: 'Log on to the DNS server using the Domain Admin or Enterprise Admin account or

    Local Administrator account.

    If not automatically started, initialize the "Server Manager" window by clicking its icon

    from the bottom left corner of the screen.

    On the opened "Server Manager" window, from the left pane, click to select "DNS".

    From the right pane, under the "SERVERS" section, right-click the DNS server.

    From the displayed context menu, click the "DNS Manager" option.

    Click the "Event Logging" tab.

    Select the "Errors and warnings" or "All events" option.

    Click "Apply".

    Click "OK".'
  checks:
  - type: manual_review
    info: 'Log on to the DNS server using the Domain Admin or Enterprise Admin account or

      Local Administrator account.

      Press the Windows key + R and execute "dnsmgmt.msc".

      Right-click the DNS server and select "Properties".

      Click the "Event Logging" tab. By default, all events are logged.

      Verify "Errors and warnings" or "All events" is selected.

