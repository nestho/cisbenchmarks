- id: '1.45'
  title: WDNS-22-000051
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Windows DNS Server must be configured with the Delegation Signer (DS) Resource Records (RR) carrying the
    signature for the RR that contains the public key of the child zone. GROUP ID: V-259379 RULE ID: SV-259379r961104'
  rationale: If name server replies are invalid or cannot be validated, many networking functions and communication would
    be adversely affected. With DNS, the presence of DS records associated with child zones informs clients of the security
    status of child zones. These records are crucial to the DNSSEC chain of trust model. Each parent domain's DS record is
    used to verify the DNSKEY record in its subdomain from the top of the DNS hierarchy down. A DNS server is an example of
    an information system providing name/address resolution service. Digital signatures and cryptographic keys are examples
    of additional artifacts. DNS resource records are examples of authoritative data. Applications other than the DNS, to
    map between host/service names and network addresses, must provide other means to ensure the authenticity and integrity
    of response data. In DNS, trust in the public key of the source is established by starting from a trusted name server
    and establishing the chain of trust down to the current source of response through successive verifications of signature
    of the public key of a child by its parent. A trust anchor is an authoritative entity represented via a public key and
    associated data. It is used in the context of public key infrastructures, X.509 digital certificates, and DNSSEC. When
    there is a chain of trust, usually the top entity to be trusted becomes the trust anchor. A certification path starts
    with the subject certificate and proceeds through several intermediate certificates up to a trusted root certificate.
    In DNS, a trust anchor is a DNSKEY that is placed into a validating resolver so the validator can cryptographically validate
    the results for a given request back to a known public key (the trust anchor). One way to indicate the security status
    of child subspaces is through the use of DS RRs in the DNS. Path validation is necessary for a relying party to make an
    informed trust decision when presented with any certificate not already explicitly trusted. Without path validation and
    a chain of trust, there can be no trust that the data integrity authenticity has been maintained during a transaction.
  impact: ''
  references: []
