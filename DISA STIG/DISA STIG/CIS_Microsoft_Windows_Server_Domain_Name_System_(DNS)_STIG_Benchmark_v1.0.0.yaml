  page_start: 119
  audit_raw: 'Note: This check is not applicable for Windows DNS Servers that host only Active

    Directory-integrated zones or for Windows DNS Servers on a classified network.

    Log on to the DNS server using the Domain Admin or Enterprise Admin account or

    Local Administrator account.

    If not automatically started, initialize the Server Manager window by clicking its icon

    from the bottom left corner of the screen.

    Once the Server Manager window is initialized, from the left pane, click to select the

    DNS category.

    From the right pane, under the "SERVERS" section, right-click the DNS server.

    From the context menu that appears, click "DNS Manager".

    On the opened DNS Manager snap-in from the left pane, expand the server name and

    then expand "Forward Lookup Zones".

    From the expanded list, click to select and then right-click the zone name.

    From the displayed context menu, click DNSSEC >> Properties.

    Click the "KSK" tab.

    For each KSK that is listed under Key signing keys (KSKs), click the KSK, click "Edit",

    and in the "Key Rollover" section, verify the "Enable automatic rollover" check box is

    selected.

    If the "Enable automatic rollover" check box is not selected for every KSK listed, this is a

    finding.'
