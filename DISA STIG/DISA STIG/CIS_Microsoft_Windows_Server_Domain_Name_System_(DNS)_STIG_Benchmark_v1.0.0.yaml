- id: '1.28'
  title: WDNS-22-000032
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'AAAA addresses must not be configured in a zone for hosts that are not dual stack. GROUP ID: V-259361 RULE
    ID: SV-259361r1018796'
  rationale: DNS is only responsible for resolving a domain name to an IP address. Applications and operating systems are
    responsible for processing the IPv6 or IPv4 record that may be returned. A denial of service could easily be implemented
    for an application that is not IPv6 if the user is not running dual stack or any other systems utilizing IPv6. When the
    application receives an IP address in hexadecimal, it is up to the application/operating system to decide how to handle
    the response. Combining both IPv6 and IPv4 in a dual stack records into the same domain can lead to application problems
    that are beyond the scope of the DNS administrator.
  impact: ''
  references: []
