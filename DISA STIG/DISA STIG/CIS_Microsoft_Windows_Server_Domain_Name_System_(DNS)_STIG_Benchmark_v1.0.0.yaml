  title: WDNS-22-000021
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'For zones split between the external and internal sides of a network, the resource records (RRs) for the external
    hosts must be separate from the RRs for the internal hosts. GROUP ID: V-259352 RULE ID: SV-259352r961863'
  rationale: Authoritative name servers for an enterprise may be configured to receive requests from both external and internal
    clients. External clients need to receive RRs that pertain only to public services (public web server, mail server, etc.).
    Internal clients need to receive RRs pertaining to public services as well as internal hosts. The zone information that
    serves the RRs on both the inside and the outside of a firewall should be split into different physical files for these
    two types of clients (one file for external clients and one file for internal clients).
  impact: ''
  references: []
