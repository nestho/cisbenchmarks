  title: WDNS-22-000031
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Nonroutable IPv6 link-local scope addresses must not be configured in any zone. GROUP ID: V-259360 RULE ID:
    SV-259360r961863'
  rationale: IPv6 link-local scope addresses are not globally routable and must not be configured in any DNS zone. Like RFC1918
    addresses, if a link-local scope address is inserted into a zone provided to clients, most routers will not forward this
    traffic beyond the local subnet.
