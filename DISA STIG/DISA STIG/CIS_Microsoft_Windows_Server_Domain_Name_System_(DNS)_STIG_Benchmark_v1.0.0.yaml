      set type=TXT

      set class=CHAOS

      version.bind'
    severity: medium
- id: '1.70'
  title: WDNS-22-000076
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The HINFO, RP, TXT, and LOC RR types must not be used in the zone SOA. GROUP ID: V-259404 RULE ID: SV-259404r1001265'
  rationale: Several types of resource records (RRs) in the DNS are meant to convey information to humans and applications
    about the network, hosts, or services. These RRs include the Responsible Person (RP) record, the Host Information (HINFO)
    record, the Location (LOC) record, and the catch-all text string resource record (TXT) (RFC1035). Although these record
    types are meant to provide information to users in good faith, they also allow attackers to gain knowledge about network
    hosts before attempting to exploit them. For example, an attacker may query for HINFO records, looking for hosts that
    list an operating system or platform known to have exploits. Therefore, great care should be taken before including these
    record types in a zone. They are best left out completely. More careful consideration should be taken with the TXT resource
    record type. A DNS administrator will have to decide if the data contained in a TXT RR constitutes an information leak
    or is a necessary piece of information. For example, several authenticated email technologies use TXT RRs to store email
    sender policy information such as valid email senders for a domain. These judgments will have to be made on a case-by-case
    basis. A DNS administrator should take care when including HINFO, RP, TXT, LOC, or other RR types that could divulge information
    that would be useful to an attacker or the external view of a zone if using split DNS. RRs such as HINFO and TXT provide
    information about software name and versions (e.g., for resources such as web servers and mail servers) that will enable
    the wellequipped attacker to exploit the known vulnerabilities in those software versions and launch attacks against those
    resources.
  impact: ''
  references: []
  page_start: 172
  audit_raw: 'Log on to the DNS server using the Domain Admin or Enterprise Admin account or

    Local Administrator account.

    Press the Windows key + R and execute "dnsmgmt.msc".

