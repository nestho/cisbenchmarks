  title: WDNS-22-000067
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Windows DNS Server must restrict individuals from using it for launching denial-ofservice (DoS) attacks
    against other information systems. GROUP ID: V-259395 RULE ID: SV-259395r961152'
  rationale: Applications and application developers must take steps to ensure users cannot use an authorized application
    to launch DoS attacks against other systems and networks. For example, applications may include mechanisms that throttle
    network traffic, so users are not able to generate unlimited network traffic via the application. Limiting system resources
    that are allocated to any user to a bare minimum may also reduce the ability of users to launch some DoS attacks.
  impact: ''
  references: []
