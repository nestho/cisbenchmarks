    system migration, or CNAME records that point to third-party CDNs or cloud computing

    platforms with an AO-approved and documented mission need, this is a finding.'
  remediation: 'Remove any zone-spanning CNAME records that have been active for more than six

    months, which are not supporting zone delegations, CNAME records supporting a

    system migration, or CNAME records pointing to third-party CDNs or cloud computing

    platforms.

    In the case of third-party CDNs or cloud offerings, an approved mission need must be

    demonstrated (AO approval of use of a commercial cloud offering would satisfy this

    requirement).'
