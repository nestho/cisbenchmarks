    each of the hosted zone(s), this is a finding.'
  remediation: 'Log onto the primary DNS server and click Windows Explorer on the taskbar.

    Navigate to C:\Windows\System32, right-click the DNS folder, point to "Share with", and

    then click "Advanced sharing".

    In the "DNS Properties" dialog box, click "Advanced Sharing", select the "Share this

    folder" check box, verify the Share name is "DNS", and then click "OK".

    Click "Close" and then close Windows Explorer.

    Log on to each of the validating Windows DNS Servers.

    In the DNS Manager console tree, navigate to the "Trust Points" folder.

    Right-click "Trust Points", point to "Import", and then click "DNSKEY".

    In the "Import DNSKEY" dialog box, type \primaryhost\dns\keyset-domain.mil (where

    primaryhost represent the FQDN of the Primary DNS Server and domain.mil represents

    the zone or zones).

    Click "OK".'
