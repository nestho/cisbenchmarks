- id: '1.38'
  title: WDNS-22-000044
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The salt value for zones signed using NSEC3 resource records (RRs) must be changed every time the zone is
    completely re-signed. GROUP ID: V-259372 RULE ID: SV-259372r961863'
  rationale: NSEC records list the resource record types for the name, as well as the name of the next resource record. With
    this information it is revealed that the resource record type for the name queried, or the resource record name requested,
    does not exist. NSEC uses the actual resource record names, whereas NSEC3 uses a one-way hash of the name. In this way,
    walking zone data from one record to the next is prevented, at the expense of some CPU cycles on the authoritative server
    and the resolver. To prevent giving access to an entire zone file, NSEC3 should be configured. To use NSEC3, RSA/SHA-1
    should be used as the algorithm, as some resolvers that understand RSA/SHA-1 might not understand NSEC3. Using RSA/SHA-256
    is a safe alternative.
  impact: ''
  references: []
