- id: '1.77'
  title: WDNS-22-000092
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The DNS server implementation must employ strong authenticators in the establishment of nonlocal maintenance
    and diagnostic sessions. GROUP ID: V-259411 RULE ID: SV-259411r961062'
  rationale: 'If unauthorized personnel use maintenance tools, they may accidentally or intentionally damage or compromise
    the system. The act of managing systems and applications includes the ability to access sensitive application information,
    such as system configuration details, diagnostic information, user information, and potentially sensitive application
    data. Nonlocal maintenance and diagnostic activities are conducted by individuals communicating through an external network
    (e.g., the internet) or an internal network. Local maintenance and diagnostic activities are carried out by individuals
    physically present at the information system or information system component and not communicating across a network connection.
    Typically, strong authentication requires authenticators that are resistant to replay attacks and employ multifactor authentication.
    Strong authenticators include, for example, public key infrastructure (PKI) where certificates are stored on a token protected
    by a password, passphrase, or biometric. This requirement applies to hardware/software diagnostic test equipment or tools.
    This requirement does not cover hardware/software components that may support information system maintenance, yet are
    a part of the system (e.g., the software implementing "ping", "ls", or "ipconfig" or the hardware and software implementing
    the monitoring port of an Ethernet switch). Lack of authentication enables anyone to gain access to the network or possibly
    a network element that provides opportunity for intruders to compromise resources within the network infrastructure. Network
    access control mechanisms interoperate to prevent unauthorized access and enforce the organization''s security policy.
    Authorization for access to any network element requires an individual account identifier that has been approved, assigned,
    and configured on an authentication server. Authentication of all administrator accounts for all privilege levels must
    be accomplished using two or more factors that include the following: (i) something the user knows (e.g., password/PIN);
    (ii) something the user has (e.g., cryptographic identification device, token); or (iii) something the user is (e.g.,
    biometric).'
  impact: ''
  references: []
  page_start: 186
  audit_raw: 'Review the DNS implementation''s authentication methods and settings to determine if

    multifactor authentication is used to gain nonlocal access for maintenance and

    diagnostics.

    If multifactor authentication is not used, this is a finding.'
  remediation: 'Configure the DNS system to use multifactor authentication for nonlocal access for

    maintenance and diagnostics.'
  checks:
  - type: manual_review
    info: 'Review the DNS implementation''s authentication methods and settings to determine if

      multifactor authentication is used to gain nonlocal access for maintenance and

      diagnostics.

      If multifactor authentication is not used, this is a finding.'
    severity: medium
- id: '1.78'
  title: WDNS-22-000094
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'In the event of a system failure, the Windows DNS Server must preserve any information necessary to determine
    cause of failure and any information necessary to return to operations with least disruption to mission processes. GROUP
    ID: V-259412 RULE ID: SV-259412r961125'
  rationale: Failure to a known state can address safety or security in accordance with the mission/business needs of the
    organization. Failure to a known secure state helps prevent a loss of confidentiality, integrity, or availability in the
    event of a failure of the information system or a component of the system. Preserving application state information helps
    to facilitate application restart and return to the operational mode of the organization with less disruption to mission-essential
    processes.
  impact: ''
  references: []
  page_start: 188
  audit_raw: 'Use the AuditPol tool to review the current Audit Policy configuration:

    Open a Command Prompt with elevated privileges ("Run as Administrator").

    Enter

    "AuditPol /get /category:*".

    Compare the AuditPol settings with the following. If the system does not audit the

    following, this is a finding.

    Object Access >> File System - Failure'
  remediation: 'Configure the policy value for

    Computer Configuration >> Windows Settings >> Security Settings >> Advanced

    Audit Policy Configuration >> System Audit Policies >> Object Access >> Audit

    File System with "Failure"

    selected.'
  checks:
  - type: manual_review
    info: 'Use the AuditPol tool to review the current Audit Policy configuration:

      Open a Command Prompt with elevated privileges ("Run as Administrator").

      Enter

      "AuditPol /get /category:*".

      Compare the AuditPol settings with the following. If the system does not audit the

      following, this is a finding.

      Object Access >> File System - Failure'
    severity: medium
- id: '1.79'
  title: WDNS-22-000102
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The DNS Name Server software must run with restricted privileges. GROUP ID: V-259413 RULE ID: SV-259413r961863'
  rationale: Failure to provide logical access restrictions associated with changes to application configuration may have
    significant effects on the overall security of the system. When dealing with access restrictions pertaining to change
    control, any changes to the hardware, software, and/or firmware components of the information system and/or application
    can have significant effects on the overall security of the system. Accordingly, only qualified and authorized individuals
    should be allowed to obtain access to application components for the purposes of initiating changes, including upgrades
    and modifications. Logical access restrictions include, for example, controls that restrict access to workflow automation,
    media libraries, abstract layers (e.g., changes implemented into third-party interfaces rather than directly into information
    systems), and change windows (e.g., changes occur only during specified times, making unauthorized changes easy to discover).
    If the name server software is run as a privileged user (e.g., root in Unix systems), any break-in into the software can
    have disastrous consequences in terms of resources resident in the name server platform. Specifically, a hacker who breaks
    into the software acquires unrestricted access and therefore can execute any commands or modify or delete any files. It
    is necessary to run the name server software as a nonprivileged user with access restricted to specified directories to
    contain damages resulting from breakin.
  impact: ''
  references: []
  page_start: 190
  audit_raw: 'Review the account under which the DNS software is running and determine the

    permissions that account has been assigned.

    If the account under which the DNS software is running has not been restricted to the

    least privileged permissions required for the purpose of running the software, this is a

    finding.'
  remediation: 'Configure the permissions of the account being used to run the DNS software to have

    the least privileges required to run the DNS software.'
  checks:
  - type: manual_review
    info: 'Review the account under which the DNS software is running and determine the

      permissions that account has been assigned.

      If the account under which the DNS software is running has not been restricted to the

      least privileged permissions required for the purpose of running the software, this is a

      finding.'
    severity: medium
- id: '1.80'
  title: WDNS-22-000107
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The private keys corresponding to both the zone signing key (ZSK) and the key signing key (KSK) must not be
    kept on the DNSSEC-aware primary authoritative name server when the name server does not support dynamic updates. GROUP
    ID: V-259414 RULE ID: SV-259414r1028388'
  rationale: The private keys in the KSK and ZSK key pairs must be protected from unauthorized access. If possible, the private
    keys should be stored offline (with respect to the internet-facing, DNSSEC-aware name server) in a physically secure,
    non-networkaccessible machine along with the zone file master copy. This strategy is not feasible in situations in which
    the DNSSEC-aware name server must support dynamic updates. To support dynamic update transactions, the DNSSECaware name
    server (which usually is a primary authoritative name server) must have both the zone file master copy and the private
    key corresponding to the zone signing key (ZSK-private) online to immediately update the signatures for the updated Resource
    Record Sets. The private key corresponding to the key signing key (KSK-private) can still be kept offline.
  impact: ''
  references: []
  page_start: 192
  audit_raw: 'This check is not applicable for Windows DNS Servers that only host Active Directoryintegrated zones or for
    Windows DNS servers on a classified network.

    Review the DNS name server and documentation to determine if it accepts dynamic

    updates.

    If dynamic updates are not accepted, verify the private keys corresponding to both the

    ZSK and KSK are not located on the name server.

    If the private keys to the ZSK and/or the KSK are located on the name server, this is a

    finding.'
  remediation: Store the private keys of the ZSK and KSK offline in an encrypted file system.
  checks:
  - type: manual_review
    info: 'This check is not applicable for Windows DNS Servers that only host Active Directoryintegrated zones or for Windows
      DNS servers on a classified network.

      Review the DNS name server and documentation to determine if it accepts dynamic

      updates.

      If dynamic updates are not accepted, verify the private keys corresponding to both the

      ZSK and KSK are not located on the name server.

      If the private keys to the ZSK and/or the KSK are located on the name server, this is a

      finding.'
    severity: medium
- id: '1.81'
  title: WDNS-22-000115
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Windows DNS Server audit records must be backed up at least every seven days onto a different system or
    system component than the system or component being audited. GROUP ID: V-259415 RULE ID: SV-259415r960948'
  rationale: Protection of log data includes ensuring log data is not accidentally lost or deleted. Backing up audit records
    to a different system or onto media separate from the system being audited on a defined frequency helps to ensure the
    audit records will be retained in the event of a catastrophic system failure. This helps to ensure a compromise of the
    information system being audited does not also result in a compromise of the audit records. This requirement applies only
    to applications that have a native backup capability for audit records. Operating system backup requirements cover applications
    that do not provide native backup functions.
  impact: ''
  references: []
  page_start: 194
  audit_raw: 'Consult with the system administrator to determine the backup policy in place for

    Windows DNS Server.

    Review the backup methods used and determine if the backup''s methods have been

    successful at backing up the audit records at least every seven days.

    If the organization does not have a backup policy in place for backing up the Windows

    DNS Server''s audit records and/or the backup methods have not been successful at

    backing up the audit records at least every seven days, this is a finding.'
  remediation: 'Document and implement a backup policy to back up the DNS server''s audit records at

    least every seven days.'
  checks:
  - type: manual_review
    info: 'Consult with the system administrator to determine the backup policy in place for

      Windows DNS Server.

      Review the backup methods used and determine if the backup''s methods have been

