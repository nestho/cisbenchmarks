- id: '1.15'
  title: WDNS-22-000017
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'All authoritative name servers for a zone must be located on different network segments. GROUP ID: V-259348
    RULE ID: SV-259348r961863'
  rationale: Most enterprises have an authoritative primary server and a host of authoritative secondary name servers. It
    is essential that these authoritative name servers for an enterprise be located on different network segments. This dispersion
    ensures the availability of an authoritative name server not only in situations in which a particular router or switch
    fails but also during events involving an attack on an entire network segment. A network administrator may choose to use
    a "hidden" primary authoritative server and have only secondary servers visible on the network. A hidden primary authoritative
    server is an authoritative DNS server whose IP address does not appear in the name server set for a zone. If the primary
    authoritative name server is hidden, a secondary authoritative name server may reside on the same network as the hidden
    primary.
  impact: ''
  references: []
