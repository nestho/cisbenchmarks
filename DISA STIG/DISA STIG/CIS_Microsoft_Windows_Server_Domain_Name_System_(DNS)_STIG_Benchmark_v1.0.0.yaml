- id: '1.30'
  title: WDNS-22-000036
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The secondary Windows DNS name servers must cryptographically authenticate zone transfers from primary name
    servers. GROUP ID: V-259364 RULE ID: SV-259364r961503'
  rationale: Authenticity of zone transfers within Windows Active Directory (AD)-integrated zones is accomplished by AD replication.
    Without authenticating devices, unidentified or unknown devices may be introduced, thereby facilitating malicious activity.
    Device authentication is a solution enabling an organization to manage devices. It is an additional layer of authentication
    ensuring only specific preauthorized devices can access the system. This requirement applies to server-to-server (zone
