- id: '1.36'
  title: WDNS-22-000042
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The private key corresponding to the zone signing key (ZSK) must only be stored on the name server that does
    support dynamic updates. GROUP ID: V-259370 RULE ID: SV-259370r961041'
  rationale: The private keys in the key signing key (KSK) and ZSK key pairs must be protected from unauthorized access. If
    possible, the private keys should be stored offline (with respect to the internet-facing, DNSSEC-aware name server) in
    a physically secure, nonnetwork-accessible machine along with the zone file primary copy. This strategy is not feasible
    in situations in which the DNSSEC-aware name server must support dynamic updates. To support dynamic update transactions,
    the DNSSECaware name server (which usually is a primary authoritative name server) must have both the zone file master
    copy and the private key corresponding to the zone signing key (ZSK-private) online to immediately update the signatures
    for the updated resource record (RR) sets. The private key corresponding to the key signing key (KSK-private) can still
    be kept offline.
  impact: ''
  references: []
  page_start: 85
  audit_raw: 'Note: This check is not applicable for Windows DNS Servers that host only Active

    Directory (AD)-integrated zones or for Windows DNS Servers on a classified network.

    Note: This requirement is not applicable to servers with only a caching role.

    For AD-integrated zones, private zone signing keys replicate automatically to all primary

    DNS servers through AD replication. Each authoritative server signs its own copy of the

    zone when it receives the key. For optimal performance, and to prevent increasing the

    size of the AD database file, the signed copy of the zone remains in memory for ADintegrated zones. A DNSSEC-signed zone
    is only committed to disk for file-backed

    zones. Secondary DNS servers pull a full copy of the zone, including signatures, from

    the primary DNS server.

    If all DNS servers are AD integrated, this check is not applicable.

    If a DNS server is not AD integrated and has file-backed zones, does not accept

    dynamic updates, and has a copy of the private key corresponding to the ZSK, this is a

    finding.'
  remediation: 'Ensure the private key corresponding to the ZSK is only stored on the name server

    accepting dynamic updates.'
