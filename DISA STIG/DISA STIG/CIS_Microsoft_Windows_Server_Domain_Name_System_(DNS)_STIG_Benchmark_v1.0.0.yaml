    On the displayed interface, determine if the "Allow zone transfers" check box is

    selected.

    If the "Allow zone transfers" check box is selected, click the "Notify" button and verify

    "Automatically notify with Servers" is listed on the "Name Servers" tab.

    If the "Notify" button is not enabled for non-AD-integrated DNS servers, this is a finding.'
  remediation: 'Log on to the DNS server using the Domain Admin or Enterprise Admin account or

    Local Administrator account.

    Press the Windows key + R and execute "dnsmgmt.msc".

    On the opened DNS Manager snap-in from the left pane, expand the server name for

    the DNS server and then expand "Forward Lookup Zones".

    From the expanded list, click to select the zone.

    In the list of hosts, review the NS records. Determine if any of the hosts listed as NS

    records are non-AD-integrated servers.

    If the DNS server hosts only AD-integrated zones and no non-AD-integrated DNS

    servers are acting as secondary DNS servers for the zones, this is not applicable.

    For a non-AD-integrated DNS server, log on to the DNS server using the Domain Admin

