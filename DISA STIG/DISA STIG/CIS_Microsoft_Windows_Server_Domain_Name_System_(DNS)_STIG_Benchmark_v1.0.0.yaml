  title: WDNS-22-000069
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Windows DNS Server must protect the integrity of transmitted information. GROUP ID: V-259397 RULE ID:
    SV-259397r961632'
  rationale: Without protection of the transmitted information, confidentiality and integrity may be compromised because unprotected
    communications can be intercepted and either read or altered. Communication paths outside the physical protection of a
    controlled boundary are exposed to the possibility of interception and modification. Protecting the confidentiality and
    integrity of organizational information can be accomplished by physical means (e.g., employing physical distribution systems)
    or by logical means (e.g., employing cryptographic techniques). If physical means of protection are employed, logical
    means (cryptography) do not have to be employed, and vice versa. Confidentiality is not an objective of DNS, but integrity
    is. DNSSEC and TSIG/SIG(0) both digitally sign DNS information to authenticate its source and ensure its integrity.
