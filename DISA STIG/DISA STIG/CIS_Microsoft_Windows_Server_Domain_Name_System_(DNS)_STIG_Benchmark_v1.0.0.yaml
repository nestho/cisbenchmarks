      On the opened DNS Manager snap-in from the left pane, expand the server name for

      the DNS server and then expand "Forward Lookup Zones".

      From the expanded list, click to select the'
    severity: medium
- id: '1.7'
  title: WDNS-22-000008
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Windows DNS name servers for a zone must be geographically dispersed. GROUP ID: V-259340 RULE ID: SV-259340r961863'
  rationale: In addition to network-based separation, authoritative name servers should be dispersed geographically. In other
    words, in addition to being located on different network segments, the authoritative name servers should not all be located
    in the same building. One approach is to locate some authoritative name servers in their own premises and others in their
    internet service provider's data centers or in partnering organizations. A network administrator may choose to use a "hidden"
    primary authoritative server and have only secondary servers visible on the network. A hidden primary authoritative server
    is an authoritative DNS server whose IP address does not appear in the name server set for a zone. If the primary authoritative
    name server is hidden, a secondary authoritative name server may reside in the same building as the hidden primary.
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'Windows DNS Servers that are Active Directory (AD) integrated must be located where

    required to meet the AD services.

    If all the Windows DNS Servers are AD integrated, this check is not applicable.

    If any or all the Windows DNS Servers are standalone and non-AD integrated, verify

    their geographic location with the system administrator.

    If any or all of the authoritative name servers are located in the same building as the

    primary authoritative name server and the primary authoritative name server is not

    "hidden", this is a finding.'
  remediation: 'For non-AD integrated Windows DNS Servers, distribute secondary authoritative

    servers to be in different buildings from the primary authoritative server.'
  checks:
  - type: manual_review
    info: 'Windows DNS Servers that are Active Directory (AD) integrated must be located where

      required to meet the AD services.

      If all the Windows DNS Servers are AD integrated, this check is not applicable.

      If any or all the Windows DNS Servers are standalone and non-AD integrated, verify

      their geographic location with the system administrator.

      If any or all of the authoritative name servers are located in the same building as the

      primary authoritative name server and the primary authoritative name serve'
    severity: medium
- id: '1.8'
  title: WDNS-22-000009
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Windows DNS Server must prohibit recursion on authoritative name servers for which forwarders have not
    been configured for external queries. GROUP ID: V-259341 RULE ID: SV-259341r1081088'
  rationale: 'A potential vulnerability of DNS is that an attacker can poison a name server''s cache by sending queries that
    will cause the server to obtain host-to-IP address mappings from bogus name servers that respond with incorrect information.
    Once a name server has been poisoned, legitimate clients may be directed to nonexistent hosts (which constitutes a denial
    of service) or hosts that masquerade as legitimate ones to obtain sensitive data or passwords. To guard against poisoning,
    name servers authoritative for .mil domains should be separated functionally from name servers that resolve queries on
    behalf of internal clients. Organizations may achieve this separation by dedicating machines to each function or, if possible,
    by running two instances of the name server software on the same machine: one for the authoritative function and the other
    for the resolving function. In this design, each name server process may be bound to a different IP address or network
    interface to implement the required segregation.'
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'Note: In Windows DNS Server, if forwarders are configured, the recursion setting must

    also be enabled because disabling recursion will disable forwarders.

    If forwarders are not used, recursion must be disabled.

    In both cases, the use of root hints must be disabled. The root hints configuration

    requirement is addressed in WDNS-22-000012.

    Log on to the DNS server using the Domain Admin or Enterprise Admin account or

    Local Administrator account.

    Press the Windows key + R and execute "dnsmgmt.msc".

    On the opened DNS Manager snap-in from the left pane, right-click on the server name

    for the DNS server and select "Properties".

    Click the "Forwarders" tab.

    If forwarders are enabled and configured, this check is not applicable.

    If forwarders are not enabled, click the "Advanced" tab and verify the "Disable recursion

    (also disables forwarders)" check box is selected.

    If forwarders are not enabled and configured, and the "Disable recursion (also disables

    forwarders)" check box in the "Advanced" tab is not selected, this is a finding. This is not

    applicable for classified networks.'
  remediation: 'Log on to the DNS server using the Domain Admin or Enterprise Admin account or

    Local Administrator account.

    Press the Windows key + R and execute "dnsmgmt.msc".

    On the opened DNS Manager snap-in from the left pane, right-click on the server name

    for the DNS server and select "Properties".

    Click the "Forwarders" tab.

    If forwarders are not being used, click the "Advanced" tab.

    Select the "Disable recursion (also disables forwarders)" check box.'
  checks:
  - type: manual_review
    info: 'Note: In Windows DNS Server, if forwarders are configured, the recursion setting must

      also be enabled because disabling recursion will disable forwarders.

      If forwarders are not used, recursion must be disabled.

      In both cases, the use of root hints must be disabled. The root hints configuration

      requirement is addressed in WDNS-22-000012.

      Log on to the DNS server using the Domain Admin or Enterprise Admin account or

      Local Administrator account.

      Press the Windows key + R and execute "dnsmgmt.msc".

      '
    severity: medium
- id: '1.9'
  title: WDNS-22-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Forwarders on an authoritative Windows DNS Server, if enabled for external resolution, must forward only to
    an internal, non-Active Directory (AD)-integrated DNS server or to the DOD Enterprise Recursive Services (ERS). GROUP
    ID: V-259342 RULE ID: SV-259342r961470'
  rationale: 'A potential vulnerability of DNS is that an attacker can poison a name server''s cache by sending queries that
    will cause the server to obtain host-to-IP address mappings from bogus name servers that respond with incorrect information.
    Once a name server has been poisoned, legitimate clients may be directed to nonexistent hosts (which constitutes a denial
    of service) or hosts that masquerade as legitimate ones to obtain sensitive data or passwords. To guard against poisoning,
    name servers authoritative for .mil domains should be separated functionally from name servers that resolve queries on
    behalf of internal clients. Organizations may achieve this separation by dedicating machines to each function or, if possible,
    by running two instances of the name server software on the same machine: one for the authoritative function and the other
    for the resolving function. In this design, each name server process may be bound to a different IP address or network
    interface to implement the required segregation.'
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'Note: If the Windows DNS Server is in the classified network, this check is not

    applicable. If forwarders are not being used, this is not applicable.

    Note: In Windows DNS Server, if forwarders are configured, the recursion setting must

    also be enabled because disabling recursion will disable forwarders.

    If forwarders are not used, recursion must be disabled. In both cases, the use of root

    hints must be disabled.

    Log on to the DNS server using the Domain Admin or Enterprise Admin account or

    Local Administrator account.

    Press the Windows key + R and execute "dnsmgmt.msc".

    On the opened DNS Manager snap-in from the left pane, right-click on the server name

    for the DNS server and select "Properties".

    Click the "Forwarders" tab.

    Review the IP address(es) for the forwarder(s) use.

    If the DNS server does not forward to another DOD-managed DNS server or to the

    DOD ERS, this is a finding.

    If "Use root hints if no forwarders are available" is selected, this is a finding.'
  remediation: 'Log on to the DNS server using the Domain Admin or Enterprise Admin account or

    Local Administrator account.

    Press the Windows key + R and execute "dnsmgmt.msc".

    On the opened DNS Manager snap-in from the left pane, right-click on the server name

    for the DNS server and select "Properties".

    Click the "Forwarders" tab.

    Replace the forwarders being used with another DOD-managed DNS server or the

    DOD ERS.

    Deselect "Use root hints if no forwarders are available".'
  checks:
  - type: manual_review
    info: 'Note: If the Windows DNS Server is in the classified network, this check is not

      applicable. If forwarders are not being used, this is not applicable.

      Note: In Windows DNS Server, if forwarders are configured, the recursion setting must

      also be enabled because disabling recursion will disable forwarders.

      If forwarders are not used, recursion must be disabled. In both cases, the use of root

      hints must be disabled.

      Log on to the DNS server using the Domain Admin or Enterprise Admin account or

      Local'
    severity: medium
- id: '1.10'
  title: WDNS-22-000011
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Windows DNS Server with a caching name server role must restrict recursive query responses to only the
    IP addresses and IP address ranges of known supported clients. GROUP ID: V-259343 RULE ID: SV-259343r961470'
  rationale: A potential vulnerability of DNS is that an attacker can poison a name server's cache by sending queries that
    will cause the server to obtain host-to-IP address mappings from bogus name servers that respond with incorrect information.
    Once a name server has been poisoned, legitimate clients may be directed to nonexistent hosts (which constitutes a denial
    of service) or hosts that masquerade as legitimate ones to obtain sensitive data or passwords. To guard against poisoning,
    name servers specifically fulfilling the role of providing recursive query responses for external zones must be segregated
    from name servers authoritative for internal zones.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'Note: Sinkhole name servers host records that are manually added and for which the

    name server is not authoritative. It is configured and intended to block resolvers from

    reaching a destination by directing the query to a sinkhole. If the sinkhole name server

    is not authoritative for any zones and serves only as a caching/forwarding name server,

    this check is not applicable.

    The non-Active Directory (AD)-integrated, standalone, caching Windows DNS Server

    must be configured to be DNSSEC aware. When performing caching and lookups, the

    caching name server must be able to obtain a zone signing key (ZSK) DNSKEY record

    and corresponding RRSIG record for the queried record. It will use this information to

    compute the hash for the hostname being resolved. The caching name server decrypts

    the RRSIG record for the hostname being resolved with the zone''s ZSK to get the

    RRSIG record hash. The caching name server compares the hashes and ensures they

    match.

    If the non-AD-integrated, standalone, caching Windows DNS Server is not configured to

    be DNSSEC aware, this is a finding.'
  remediation: 'Implement DNSSEC on all non-AD-integrated, standalone, caching Windows DNS

    Servers to ensure the caching server validates signed zones when resolving and

    caching.'
  checks:
  - type: manual_review
    info: 'Note: Sinkhole name servers host records that are manually added and for which the

      name server is not authoritative. It is configured and intended to block resolvers from

      reaching a destination by directing the query to a sinkhole. If the sinkhole name server

      is not authoritative for any zones and serves only as a caching/forwarding name server,

      this check is not applicable.

      The non-Active Directory (AD)-integrated, standalone, caching Windows DNS Server

      must be configured to be DNSSEC aware. Wh'
    severity: medium
- id: '1.11'
  title: WDNS-22-000013
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Windows DNS Server must implement cryptographic mechanisms to detect changes to information during transmission.
    GROUP ID: V-259344 RULE ID: SV-259344r961635'
  rationale: Encrypting information for transmission protects it from unauthorized disclosure and modification. Cryptographic
    mechanisms implemented to protect information integrity include, for example, cryptographic hash functions that have common
    application in digital signatures, checksums, and message authentication codes. Confidentiality is not an objective of
    DNS, but integrity is. DNSSEC and TSIG/SIG(0) both digitally sign DNS information to authenticate its source and ensure
    its integrity.
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'Note: If the Windows DNS Server hosts only Active Directory (AD)-integrated zones and

    does not host any file-based zones, this is not applicable.

    Note: This requirement does not apply for classified environments.

