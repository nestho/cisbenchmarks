- id: '1.16'
  title: WDNS-22-000018
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'All authoritative name servers for a zone must have the same version of zone information. GROUP ID: V-259349
    RULE ID: SV-259349r961863'
  rationale: The only protection approach for content control of a DNS zone file is the use of a zone file integrity checker.
    The effectiveness of integrity checking using a zone file integrity checker depends on the database of constraints built
    into the checker. The deployment process consists of developing these constraints with the right logic, and the only determinant
    of the truth value of these logical predicates is the parameter values for certain key fields in the format of various
    RRTypes. The serial number in the SOA RDATA is used to indicate to secondary name servers that a change to the zone has
    occurred and a zone transfer should be performed. It should always be increased whenever a change is made to the zone
    data. DNS NOTIFY must be enabled on the primary authoritative name server.
