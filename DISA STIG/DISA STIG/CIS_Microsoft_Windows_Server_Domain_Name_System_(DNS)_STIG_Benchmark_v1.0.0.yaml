    administrator that the actual hosts are in a dual stack.

    If any zones contain hosts with both IPv4 and IPv6 addresses but are determined to be

    not in a dual stack, this is a finding.'
  remediation: Remove any IPv6 records for hosts that are not in a dual stack configuration.
