- id: '1.58'
  title: WDNS-22-000064
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Windows DNS Server must use an approved DOD PKI certificate authority. GROUP ID: V-259392 RULE ID: SV-259392r961596'
  rationale: 'Untrusted certificate authorities (CA) can issue certificates, but the certificates may be issued by organizations
    or individuals that seek to compromise DOD systems or by organizations with insufficient security controls. If the CA
    used for verifying the certificate is not a DOD-approved CA, trust of this CA has not been established. The DOD will only
    accept PKI certificates obtained from a DOD-approved internal or external certificate authority. Reliance on CAs for the
    establishment of secure sessions includes, for example, the use of SSL/TLS certificates. TSIG and SIG(0) are not configurable
    in Windows DNS Server. To meet the requirement for authentication between Windows DNS Servers, IPsec must be implemented
    between the Windows DNS Servers. Note: If multiple certificates from the same CA are present on the DNS server, IPsec
    authentication might fail due to an incorrect certificate being chosen. For this purpose, an Active Directory Certificate
    Services (AD CS) role must be installed and configured as an Enterprise certificate authority (CA). Refer to the Microsoft
    Windows Server DNS Overview.pdf for references on deploying certificates for this procedure.'
