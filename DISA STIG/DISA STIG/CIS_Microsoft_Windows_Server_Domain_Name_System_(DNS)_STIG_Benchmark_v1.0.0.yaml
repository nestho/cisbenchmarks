- id: '1.21'
  title: WDNS-22-000024
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Primary authoritative name servers must be configured to only receive zone transfer requests from specified
    secondary name servers. GROUP ID: V-259354 RULE ID: SV-259354r961863'
  rationale: Authoritative name servers (especially primary name servers) should be configured with an allow-transfer access
    control substatement designating the list of hosts from which zone transfer requests can be accepted. These restrictions
    address the denial-ofservice threat and potential exploits from unrestricted dissemination of information about internal
    resources. Based on the need to know, the only name servers that need to refresh their zone files periodically are the
    secondary name servers. Zone transfer from primary name servers should be restricted to secondary name servers. The zone
    transfer should be completely disabled in the secondary name servers. The address match list argument for the allow-transfer
    substatement should consist of IP addresses of secondary name servers and stealth secondary name servers.
  impact: ''
  references: []
