- id: '1.30'
  title: VCST-80-000151
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter STS service must disable "ALLOW_BACKSLASH". GROUP ID: V-258999 RULE ID: SV-258999r961863'
  rationale: When Tomcat is installed behind a proxy configured to only allow access to certain contexts (web applications),
    an HTTP request containing "/../" may allow attackers to work around the proxy restrictions using directory traversal
    attack methods. If "allow_backslash" is "true", the "" character will be permitted as a path delimiter. The default value
    for the setting is "false", but Tomcat must always be configured as if no proxy restricting context access was used, and
    "allow_backslash" should be set to "false" to prevent directory-traversal-style attacks. This setting can create operability
    issues with noncompliant clients.
  impact: ''
  references: []
  page_start: 69
  audit_raw: 'At the command line, run the following command:

    grep ALLOW_BACKSLASH /usr/lib/vmware-sso/vmware-sts/conf/catalina.properties

