- id: '1.18'
  title: VCST-80-000130
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter STS service DefaultServlet must be set to "readonly" for "PUT" and "DELETE" commands. GROUP ID:
    V-258989 RULE ID: SV-258989r960792'
  rationale: The default servlet (or DefaultServlet) is a special servlet provided with Tomcat that is called when no other
    suitable page is found in a particular folder. The DefaultServlet serves static resources as well as directory listings.
    The DefaultServlet is configured by default with the "readonly" parameter set to "true" where HTTP commands such as "PUT"
    and "DELETE" are rejected. Changing this to "false" allows clients to delete or modify static resources on the server
    and to upload new resources. DefaultServlet "readonly" must be set to "true", either literally or by absence (default).
  impact: ''
  references: []
  page_start: 50
  audit_raw: 'At the command prompt, run the following command:

    xmllint --xpath "//[contains(text(), ''DefaultServlet'')]/parent::" /usr/lib/vmware-sso/vmwarests/conf/web.xml

    Example output:

    If the "readOnly" param-value for the "DefaultServlet" servlet class is set to "false", this

    is a finding.

    If the "readOnly" param-value does not exist, this is not a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/web.xml

    Navigate to the ///org.apache.catalina.servlets.DefaultServlet/ node and remove the

    following node:

    Restart the service with the following command:

    vmon-cli --restart sts'
