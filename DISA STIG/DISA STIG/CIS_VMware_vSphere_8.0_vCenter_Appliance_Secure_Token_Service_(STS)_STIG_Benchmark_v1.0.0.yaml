- id: '1.15'
  title: VCST-80-000125
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter STS service must limit the amount of time that each Transmission Control Protocol (TCP) connection
    is kept alive. GROUP ID: V-258985 RULE ID: SV-258985r960735'
  rationale: Denial of service (DoS) is one threat against web servers. Many DoS attacks attempt to consume web server resources
    in such a way that no more resources are available to satisfy legitimate requests. In Tomcat, the "connectionTimeout"
    attribute sets the number of milliseconds the server will wait after accepting a connection for the request Uniform Resource
    Identifier (URI) line to be presented. This timeout will also be used when reading the request body (if any). This prevents
    idle sockets that are not sending HTTP requests from consuming system resources and potentially denying new connections.
  impact: ''
  references: []
  page_start: 44
  audit_raw: 'The connection timeout should not be disabled by setting it to "-1".

    At the command prompt, run the following command:

    xmllint --xpath "//Connector[@connectionTimeout = ''-1'']" /usr/lib/vmware-sso/vmwarests/conf/server.xml

    Expected result:

    XPath set is empty

    If any connectors are returned, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Configure the <Connector> node with the value:

    connectionTimeout="60000"

    Restart the service with the following command:

    vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'The connection timeout should not be disabled by setting it to "-1".

      At the command prompt, run the following command:

      xmllint --xpath "//Connector[@connectionTimeout = ''-1'']" /usr/lib/vmware-sso/vmwarests/conf/server.xml

      Expected result:

      XPath set is empty

      If any connectors are returned, this is a finding.'
    severity: medium
- id: '1.16'
  title: VCST-80-000126
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter STS service must limit the number of times that each Transmission Control Protocol (TCP) connection
    is kept alive. GROUP ID: V-258986 RULE ID: SV-258986r960735'
  rationale: KeepAlive provides long lived HTTP sessions that allow multiple requests to be sent over the same connection.
    Enabling KeepAlive mitigates the effects of several types of denial-of-service attacks. An advantage of KeepAlive is the
    reduced latency in subsequent requests (no handshaking). However, a disadvantage is that server resources are not available
    to handle other requests while a connection is maintained between the server and the client. Tomcat can be configured
    to limit the number of subsequent requests that one client can submit to the server over an established connection. This
    limit helps provide a balance between the advantages of KeepAlive, while not allowing any one connection being held too
    long by any one client.
  impact: ''
  references: []
  page_start: 46
  audit_raw: 'The connection timeout should not be unlimited by setting it to "-1".

    At the command prompt, run the following command:

    xmllint --xpath "//Connector[@maxKeepAliveRequests = ''-1'']" /usr/lib/vmwaresso/vmware-sts/conf/server.xml

    Expected result:

    XPath set is empty

    If any connectors are returned, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Configure the <Connector> node with the value:

    maxKeepAliveRequests="100"

    Restart the service with the following command:

    vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'The connection timeout should not be unlimited by setting it to "-1".

      At the command prompt, run the following command:

      xmllint --xpath "//Connector[@maxKeepAliveRequests = ''-1'']" /usr/lib/vmwaresso/vmware-sts/conf/server.xml

      Expected result:

      XPath set is empty

      If any connectors are returned, this is a finding.'
    severity: medium
- id: '1.17'
  title: VCST-80-000129
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter STS service cookies must have "http-only" flag set. GROUP ID: V-258988 RULE ID: SV-258988r960792'
  rationale: Cookies are a common way to save session state over the HTTP(S) protocol. If attackers can compromise session
    data stored in a cookie, they are better able to launch an attack against the server and its applications. When a cookie
    is tagged with the "HttpOnly" flag, it tells the browser this particular cookie should only be accessed by the originating
    server. Any attempt to access the cookie from client script is strictly forbidden.
  impact: ''
  references: []
  page_start: 48
  audit_raw: 'At the command prompt, run the following command:

    xmllint --format /usr/lib/vmware-sso/vmware-sts/conf/web.xml | sed ''s/xmlns=".*"//g'' |

