- id: '1.22'
  title: VCST-80-000137
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter STS service directory listings parameter must be disabled. GROUP ID: V-258992 RULE ID: SV-258992r960963'
  rationale: Enumeration techniques, such as URL parameter manipulation, rely on being able to obtain information about the
    web server's directory structure by locating directories without default pages. In this scenario, the web server will
    display to the user a listing of the files in the directory being accessed. Ensuring that directory listing is disabled
    is one approach to mitigating the vulnerability. In Tomcat, directory listing is disabled by default but can be enabled
    via the "listings" parameter. Ensure this node is not present to have the default effect.
  impact: ''
  references: []
  page_start: 58
