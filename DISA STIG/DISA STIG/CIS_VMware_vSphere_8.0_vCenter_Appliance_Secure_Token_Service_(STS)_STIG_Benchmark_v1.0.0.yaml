controls:
- id: '1.1'
  title: VCST-80-000001
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter STS service must limit the number of maximum concurrent connections permitted. GROUP ID: V-258970
    RULE ID: SV-258970r960735'
  rationale: 'Resource exhaustion can occur when an unlimited number of concurrent requests are allowed on a website, facilitating
    a denial-of-service attack. Unless the number of requests is controlled, the web server can consume enough system resources
    to cause a system crash. Mitigating this kind of attack will include limiting the number of concurrent HTTP/HTTPS requests.
    In Tomcat, each incoming request requires a thread for the duration of that request. If more simultaneous requests are
    received than can be handled by the currently available request processing threads, additional threads will be created
    up to the value of the maxThreads attribute. Satisfies: SRG-APP-000001-AS-000001, SRG-APP-000435-AS-000163'
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'At the command prompt, run the following command:

    xmllint --xpath ''/Server/Service/Executor[@name="tomcatThreadPool"]/@maxThreads''

    /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Expected result:

    maxThreads="150"

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Navigate to the <Executor> node with the name of tomcatThreadPool and configure

    with the value "maxThreads="150"".

    Note: The <Executor> node should be configured similar to the following:

    <Executor maxThreads="150" minSpareThreads="50" name="tomcatThreadPool"

    namePrefix="tomcat-http--"/>

    Restart the service with the following command:

    vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      xmllint --xpath ''/Server/Service/Executor[@name="tomcatThreadPool"]/@maxThreads''

      /usr/lib/vmware-sso/vmware-sts/conf/server.xml

      Expected result:

      maxThreads="150"

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.2'
  title: VCST-80-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter STS service cookies must have secure flag set. GROUP ID: V-258972 RULE ID: SV-258972r960792'
  rationale: The secure flag is an option that can be set by the application server when sending a new cookie to the user
    within an HTTP Response. The purpose of the secure flag is to prevent cookies from being observed by unauthorized parties
    due to the transmission of a cookie in clear text. By setting the secure flag, the browser will prevent the transmission
    of a cookie over an unencrypted channel.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'At the command prompt, run the following command:

    xmllint --format /usr/lib/vmware-sso/vmware-sts/conf/web.xml | sed ''s/xmlns=".*"//g'' |

    xmllint --xpath ''/web-app/session-config/cookie-config/secure'' -

    Expected result:

    true

    If the output of the command does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/web.xml

    Navigate to the node and configure the setting as follows:

    Restart the service with the following command:

    vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      xmllint --format /usr/lib/vmware-sso/vmware-sts/conf/web.xml | sed ''s/xmlns=".*"//g'' |

      xmllint --xpath ''/web-app/session-config/cookie-config/secure'' -

      Expected result:

      true

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.3'
  title: VCST-80-000013
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter STS service must initiate session logging upon startup. GROUP ID: V-258973 RULE ID: SV-258973r960888'
  rationale: Logging must be started as soon as possible when a service starts and as late as possible when a service is stopped.
    Many forms of suspicious actions can be detected by analyzing logs for unexpected service starts and stops. Also, by starting
    to log immediately after a service starts, it becomes more difficult for suspicious activity to go unlogged.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'At the command prompt, run the following command:

    grep StreamRedirectFile /etc/vmware/vmware-vmon/svcCfgfiles/sts-lin.json

    Expected output:

    "StreamRedirectFile" : "%VMWARE_LOG_DIR%/vmware/sso/sts-runtime.log",

    If no log file is specified for the "StreamRedirectFile" setting, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/vmware/vmware-vmon/svcCfgfiles/sts-lin.json

    Below the last line of the "PreStartCommandArg" block, add the following line:

    "StreamRedirectFile" : "%VMWARE_LOG_DIR%/vmware/sso/sts-runtime.log",

    Restart the service with the following command:

    vmon-cli --restart sts'
  checks:
  - type: command
    command: grep StreamRedirectFile /etc/vmware/vmware-vmon/svcCfgfiles/sts-lin.json
    expected: ''
    severity: medium
    info: 'At the command prompt, run the following command:

      grep StreamRedirectFile /etc/vmware/vmware-vmon/svcCfgfiles/sts-lin.json

      Expected output:

      "StreamRedirectFile" : "%VMWARE_LOG_DIR%/vmware/sso/sts-runtime.log",

      If no log file is specified for the "StreamRedirectFile" setting, this is a finding.'
- id: '1.4'
  title: VCST-80-000014
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter STS service must produce log records containing sufficient information regarding event details.
    GROUP ID: V-258974 RULE ID: SV-258974r960891'
  rationale: 'Remote access can be exploited by an attacker to compromise the server. By recording all remote access activities,
    it will be possible to determine the attacker''s location, intent, and degree of success. Tomcat can be configured with
    an "AccessLogValve", a component that can be inserted into the request processing pipeline to provide robust access logging.
    The "AccessLogValve" creates log files in the same format as those created by standard web servers. When "AccessLogValve"
    is properly configured, log files will contain all the forensic information necessary in the case of a security incident.
    Satisfies: SRG-APP-000095-AS-000056, SRG-APP-000016-AS-000013, SRG-APP000096-AS-000059, SRG-APP-000097-AS-000060, SRG-APP-000098-AS-000061,
    SRG-APP-000099-AS-000062, SRG-APP-000100-AS-000063, SRG-APP-000080-AS000045, SRG-APP-000089-AS-000050, SRG-APP-000090-AS-000051,
    SRG-APP000091-AS-000052, SRG-APP-000343-AS-000030, SRG-APP-000375-AS-000211, SRG-APP-000495-AS-000220, SRG-APP-000499-AS-000224,
    SRG-APP-000503-AS000228'
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'At the command prompt, run the following command:

    xmllint --xpath

    ''/Server/Service/Engine/Host/Valve[@className="org.apache.catalina.valves.AccessL

    ogValve"]/@pattern'' /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Example result:

    pattern="%t %I [Request] "%{User-Agent}i" %{X-Forwarded-For}i/%h:%{remote}p %l

    %u to local %{local}p - "%r" %H %m %U%q [Response] %s - %b bytes [Perf] process

    %Dms / commit %Fms / conn [%X]"

    Required elements:

    %h %{X-Forwarded-For}i %l %t %u "%r" %s %b

    If the log pattern does not contain the required elements in any order, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Inside the <Host> node, find the "AccessLogValve" <Valve> node and replace the

    "pattern" element as follows:

    pattern="%t %I [Request] "%{User-Agent}i" %{X-Forwarded-For}i/%h:%{remote}p %l

    %u to local %{local}p - "%r" %H %m %U%q [Response] %s - %b bytes [Perf] process

    %Dms / commit %Fms / conn [%X]"

    Restart the service with the following command:

    vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      xmllint --xpath

      ''/Server/Service/Engine/Host/Valve[@className="org.apache.catalina.valves.AccessL

      ogValve"]/@pattern'' /usr/lib/vmware-sso/vmware-sts/conf/server.xml

      Example result:

      pattern="%t %I [Request] "%{User-Agent}i" %{X-Forwarded-For}i/%h:%{remote}p %l

      %u to local %{local}p - "%r" %H %m %U%q [Response] %s - %b bytes [Perf] process

      %Dms / commit %Fms / conn [%X]"

      Required elements:

      %h %{X-Forwarded-For}i %l %t %u "%r" %s %b

      If the log patte'
    severity: medium
- id: '1.5'
  title: VCST-80-000025
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter STS service logs folder permissions must be set correctly. GROUP ID: V-258975 RULE ID: SV-258975r960930'
  rationale: 'Log data is essential in the investigation of events. The accuracy of the information is always pertinent. One
    of the first steps an attacker will take is the modification or deletion of log records to cover tracks and prolong discovery.
    The web server must protect the log data from unauthorized modification. Satisfies: SRG-APP-000118-AS-000078, SRG-APP-000119-AS-000079,
    SRG-APP000120-AS-000080'
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'At the command prompt, run the following command:

    find /var/log/vmware/sso/ -xdev ! -name lookupsvc-init.log ! -name sts-prestart.log -type

    f -a ''('' -perm -o+w -o -not -user sts -o -not -group lwis '')'' -exec ls -ld {} ;

    If any files are returned, this is a finding.'
  remediation: 'At the command prompt, run the following commands:

    chmod o-w chown sts:lwis

    Note: Substitute with the listed file.'
  checks:
  - type: command
    command: find /var/log/vmware/sso/ -xdev ! -name lookupsvc-init.log ! -name sts-prestart.log -type
    expected: ''
    severity: medium
    info: 'At the command prompt, run the following command:

      find /var/log/vmware/sso/ -xdev ! -name lookupsvc-init.log ! -name sts-prestart.log -type

      f -a ''('' -perm -o+w -o -not -user sts -o -not -group lwis '')'' -exec ls -ld {} ;

      If any files are returned, this is a finding.'
- id: '1.6'
  title: VCST-80-000034
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter STS service must limit privileges for creating or modifying hosted application shared files. GROUP
    ID: V-258976 RULE ID: SV-258976r960960'
  rationale: Application servers have the ability to specify that the hosted applications use shared libraries. The application
    server must have a capability to divide roles based upon duties wherein one project user (such as a developer) cannot
    modify the shared library code of another project user. The application server must also be able to specify that nonprivileged
    users cannot modify any shared library code at all. Ensuring the Security Lifecycle Listener element is uncommented and
    sets a minimum Umask value will allow the server to perform a number of security checks when starting and prevent the
    service from starting if they fail.
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'At the command prompt, run the following command:

    xmllint --xpath

    ''/Server/Listener[@className="org.apache.catalina.security.SecurityListener"]''

    /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Example result:

    If the "org.apache.catalina.security.SecurityListener" listener is not present, this is a

    finding.

    If the "org.apache.catalina.security.SecurityListener" listener is configured with a

    "minimumUmask" and is not "0007", this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Navigate to the <Server> node and add or update the

    "org.apache.catalina.security.SecurityListener" as follows:

    Restart the service with the following command:

    vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      xmllint --xpath

      ''/Server/Listener[@className="org.apache.catalina.security.SecurityListener"]''

      /usr/lib/vmware-sso/vmware-sts/conf/server.xml

      Example result:

      If the "org.apache.catalina.security.SecurityListener" listener is not present, this is a

      finding.

      If the "org.apache.catalina.security.SecurityListener" listener is configured with a

      "minimumUmask" and is not "0007", this is a finding.'
    severity: medium
- id: '1.7'
  title: VCST-80-000036
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter STS service must disable stack tracing. GROUP ID: V-258977 RULE ID: SV-258977r960963'
  rationale: Stack tracing provides debugging information from the application call stacks when a runtime error is encountered.
    If stack tracing is left enabled, Tomcat will provide this call stack information to the requestor, which could result
    in the loss of sensitive information or data that could be used to compromise the system.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'At the command prompt, run the following command:

    xmllint --xpath "//Connector[@allowTrace = ''true'']" /usr/lib/vmware-sso/vmwarests/conf/server.xml

    Expected result:

    XPath set is empty

    If any connectors are returned, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Navigate to and locate:

    ''allowTrace="true"''

    Remove the ''allowTrace="true"'' setting.

    Note: If "allowTrace" is not present, it defaults to false.

    Restart the service with the following command:

    vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      xmllint --xpath "//Connector[@allowTrace = ''true'']" /usr/lib/vmware-sso/vmwarests/conf/server.xml

      Expected result:

      XPath set is empty

      If any connectors are returned, this is a finding.'
    severity: medium
- id: '1.8'
  title: VCST-80-000037
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter STS service must be configured to use a specified IP address and port. GROUP ID: V-258978 RULE
    ID: SV-258978r960966'
  rationale: The server must be configured to listen on a specified IP address and port. Without specifying an IP address
    and port for server to use, the server will listen on all IP addresses available. Accessing the hosted application through
    an IP address normally used for nonapplication functions opens the possibility of user access to resources, utilities,
    files, ports, and protocols that are protected on the desired application IP address.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'At the command prompt, run the following command:

    xmllint --xpath ''//Connector[not(@port = "${bio-ssl-clientauth.https.port}") and (@port =

    "0" or not(@address))]'' /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Expected result:

    XPath set is empty

    If any connectors are returned, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    The STS service has 2 connectors with the below pairs of ports and addresses.

    Navigate to the target <Connector> node and configure the port and address as follows.

    port="${bio-custom.http.port}" address="localhost"

    port="${bio-ssl-localhost.https.port}" address="localhost"

    Restart the service with the following command:

    vmon-cli --restart sts

    Note: The connector with port="${bio-ssl-clientauth.https.port}" should not have address

    set.'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      xmllint --xpath ''//Connector[not(@port = "${bio-ssl-clientauth.https.port}") and (@port =

      "0" or not(@address))]'' /usr/lib/vmware-sso/vmware-sts/conf/server.xml

      Expected result:

      XPath set is empty

      If any connectors are returned, this is a finding.'
    severity: medium
- id: '1.9'
  title: VCST-80-000057
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter STS service must be configured to limit data exposure between applications. GROUP ID: V-258979
    RULE ID: SV-258979r961116'
  rationale: If RECYCLE_FACADES is true or if a security manager is in use, a new facade object will be created for each request.
    This reduces the chances that a bug in an application might expose data from one request to another.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'At the command line, run the following command:

    grep RECYCLE_FACADES /usr/lib/vmware-sso/vmware-sts/conf/catalina.properties

    Example result:

    org.apache.catalina.connector.RECYCLE_FACADES=true

    If "org.apache.catalina.connector.RECYCLE_FACADES" is not set to "true", this is a

    finding.

    If the "org.apache.catalina.connector.RECYCLE_FACADES" setting does not exist, this

    is not a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/catalina.properties

    Update or remove the following line:

    org.apache.catalina.connector.RECYCLE_FACADES=true

    Restart the service with the following command:

    vmon-cli --restart sts'
  checks:
  - type: command
    command: grep RECYCLE_FACADES /usr/lib/vmware-sso/vmware-sts/conf/catalina.properties
    expected: ''
    severity: medium
    info: 'At the command line, run the following command:

      grep RECYCLE_FACADES /usr/lib/vmware-sso/vmware-sts/conf/catalina.properties

      Example result:

      org.apache.catalina.connector.RECYCLE_FACADES=true

      If "org.apache.catalina.connector.RECYCLE_FACADES" is not set to "true", this is a

      finding.

      If the "org.apache.catalina.connector.RECYCLE_FACADES" setting does not exist, this

      is not a finding.'
- id: '1.10'
  title: VCST-80-000062
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter STS service must be configured to fail to a known safe state if system initialization fails. GROUP
    ID: V-258980 RULE ID: SV-258980r961122'
  rationale: Determining a safe state for failure and weighing that against a potential denial of service for users depends
    on what type of application the web server is hosting. It is preferable that the service abort startup on any initialization
    failure rather than continuing in a degraded, and potentially insecure, state.
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'At the command line, run the following command:

    grep EXIT_ON_INIT_FAILURE /usr/lib/vmware-sso/vmware-sts/conf/catalina.properties

    Example result:

    org.apache.catalina.startup.EXIT_ON_INIT_FAILURE=true

    If there are no results, or if the "org.apache.catalina.startup.EXIT_ON_INIT_FAILURE"

    is not set to "true", this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/catalina.properties

    Add or change the following line:

    org.apache.catalina.startup.EXIT_ON_INIT_FAILURE=true

    Restart the service with the following command:

    vmon-cli --restart sts'
  checks:
  - type: command
    command: grep EXIT_ON_INIT_FAILURE /usr/lib/vmware-sso/vmware-sts/conf/catalina.properties
    expected: ''
    severity: medium
    info: 'At the command line, run the following command:

      grep EXIT_ON_INIT_FAILURE /usr/lib/vmware-sso/vmware-sts/conf/catalina.properties

      Example result:

      org.apache.catalina.startup.EXIT_ON_INIT_FAILURE=true

      If there are no results, or if the "org.apache.catalina.startup.EXIT_ON_INIT_FAILURE"

      is not set to "true", this is a finding.'
- id: '1.11'
  title: VCST-80-000065
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter STS service must set URIEncoding to UTF-8. GROUP ID: V-258981 RULE ID: SV-258981r961158'
  rationale: Invalid user input occurs when a user inserts data or characters into a hosted application's data entry field
    and the hosted application is unprepared to process that data. This results in unanticipated application behavior, potentially
    leading to an application compromise. Invalid user input is one of the primary methods employed when attempting to compromise
    an application. An attacker can also enter Unicode characters into hosted applications in an effort to break out of the
    document home or root home directory or bypass security checks.
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'At the command prompt, run the following command:

    xmllint --xpath "//Connector[@URIEncoding != ''UTF-8''] |

    //Connector[not[@URIEncoding]]" /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Expected result:

    XPath set is empty

    If any connectors are returned, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Configure the <Connector> node with the value:

    URIEncoding="UTF-8"

    Restart the service with the following command:

    vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      xmllint --xpath "//Connector[@URIEncoding != ''UTF-8''] |

      //Connector[not[@URIEncoding]]" /usr/lib/vmware-sso/vmware-sts/conf/server.xml

      Expected result:

      XPath set is empty

      If any connectors are returned, this is a finding.'
    severity: medium
- id: '1.12'
  title: VCST-80-000067
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter STS service "ErrorReportValve showServerInfo" must be set to "false". GROUP ID: V-258982 RULE
    ID: SV-258982r961167'
  rationale: The Error Report Valve is a simple error handler for HTTP status codes that will generate and return HTML error
    pages. It can also be configured to return predefined static HTML pages for specific status codes and/or exception types.
    Disabling "showServerInfo" will only return the HTTP status code and remove all CSS from the default nonerror-related
    HTTP responses.
  impact: ''
  references: []
  page_start: 35
  audit_raw: 'At the command prompt, run the following command:

    xmllint --xpath

    ''/Server/Service/Engine/Host/Valve[@className="org.apache.catalina.valves.ErrorRep

    ortValve"]'' /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Example result:

    If the "ErrorReportValve" element is not defined or "showServerInfo" is not set to "false",

    this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/server.xml

    Locate the following Host block:

    <Host ...> ... </Host>

    Inside this block, add or update the following on a new line:

    Restart the service with the following command:

    vmon-cli --restart sts'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      xmllint --xpath

      ''/Server/Service/Engine/Host/Valve[@className="org.apache.catalina.valves.ErrorRep

      ortValve"]'' /usr/lib/vmware-sso/vmware-sts/conf/server.xml

      Example result:

      If the "ErrorReportValve" element is not defined or "showServerInfo" is not set to "false",

      this is a finding.'
    severity: medium
- id: '1.13'
  title: VCST-80-000070
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The vCenter STS service must set an inactive timeout for sessions. GROUP ID: V-258983 RULE ID: SV-258983r1003673'
  rationale: 'Leaving sessions open indefinitely is a major security risk. An attacker can easily use an already authenticated
    session to access the hosted application as the previously authenticated user. By closing sessions after a set period
    of inactivity, the web server can make certain that those sessions that are not closed through the user logging out of
    an application are eventually closed. Satisfies: SRG-APP-000295-AS-000263, SRG-APP-000389-AS-000253'
  impact: ''
  references: []
  page_start: 37
  audit_raw: 'At the command prompt, run the following command:

    xmllint --format /usr/lib/vmware-sso/vmware-sts/conf/web.xml | sed ''s/xmlns=".*"//g'' |

    xmllint --xpath ''/web-app/session-config/session-timeout'' -

    Example result:

    30

    If the value of "session-timeout" is not "30" or less, or is missing, this is a finding.'
