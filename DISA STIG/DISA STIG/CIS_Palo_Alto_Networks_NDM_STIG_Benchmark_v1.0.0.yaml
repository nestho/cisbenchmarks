- id: '1.27'
  title: PANW-NM-000128
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must off-load audit records onto a different system or media than
    the system being audited. GROUP ID: V-228671 RULE ID: SV-228671r961860'
  rationale: Information stored in one location is vulnerable to accidental or incidental deletion or alteration. Off-loading
    is a common process in information systems with limited audit storage capacity. The Palo Alto Networks security platform
    has multiple log types; at a minimum, the Traffic, Threat, System, and Configuration logs must be sent to a Syslog server.
  impact: ''
  references: []
  page_start: 65
  audit_raw: 'To view a syslog server profile,

    Go to Device >> Server Profiles >> Syslog

    If there are no Syslog Server Profiles present, this is a finding.

    Select each Syslog Server Profile.

    If no server is configured, this is a finding.

    View the log-forwarding profile to determine which logs are forwarded to the syslog

    server.

    Go to Objects >> Log forwarding

    If no Log Forwarding Profile is present, this is a finding.

    The "Log Forwarding Profile" window has five columns.

    If there are no Syslog Server Profiles present in the Syslog column for the Traffic Log

    Type, this is a finding.

    If there are no Syslog Server Profiles present for each of the severity levels of the

    Threat Log Type, this is a finding.

    Go to Device >> Log Settings >> System Logs

    The list of Severity levels is displayed.

    If any of the Severity levels does not have a configured Syslog Profile, this is a finding.

    Go to Device >> Log Settings >> Config Logs

    If the "Syslog" field is blank, this is a finding.'
  remediation: 'To create a syslog server profile:

    1. Go to Device >> Server Profiles >> Syslog

    2. Select "Add".

    3. In the Syslog Server Profile, enter the name of the profile.

    4. Select "Add".

    5. In the "Servers" tab, enter the required information.

    6. Name: Name of the syslog server

    7. Server: Server IP address where the logs will be forwarded to

    8. Port: Default port 514

    9. Facility: Select from the drop-down list.

    10. Select "OK".

    After creating the Server Profiles that define where to logs, enable log forwarding.

    The way to enable forwarding depends on the log type:

    Traffic Logs—Enable forwarding of Traffic logs by creating a Log Forwarding Profile

    (Objects >> Log Forwarding) and adding it to the security policies to trigger the log

    forwarding. Only traffic that matches a specific rule within the security policy will be

    logged and forwarded.

    Configure the log-forwarding profile to select the logs to be forwarded to syslog server.

    1. Go to Objects >> Log forwarding

    2. The Log Forwarding Profile window appears. Note that it has five columns. In the

    Syslog column, select the syslog server profile for forwarding threat logs to the

    configured server(s).

    3. Select "OK".

    When the Log Forwarding Profile window disappears, the screen will show the

    configured log-forwarding profile.

    Threat Logs—Enable forwarding of Threat logs by creating a Log Forwarding Profile

    (Objects >> Log Forwarding) that specifies which severity levels to forward and then

    adding it to the security policies, which triggers the log forwarding. A Threat log entry

    will only be created (and therefore forwarded) if the associated traffic matches a

    Security Profile (Antivirus, Anti-spyware, Vulnerability, URL Filtering, File Blocking, Data

    Filtering, or DoS Protection).

    Configure the log-forwarding profile to select the logs to be forwarded to syslog server.

    1. Go to Objects >> Log forwarding

    2. The Log Forwarding Profile window appears. Note that it has five columns. In the

    "Syslog" column, select the syslog server profile for forwarding threat logs to the

    configured server(s).

    3. Select "OK".

    When the Log Forwarding Profile window disappears, the screen will show the

    configured log-forwarding profile.

    System Logs—Enable forwarding of System logs by specifying a Server Profile in the

    log settings configuration.

    1. Go to Device >> Log Settings >> System Logs

    2. The list of severity levels is displayed.

    3. Select a Server Profile for each severity level to forward.

    4. Select each severity level in turn; with each selection, the "Log Systems -

    Setting" window will appear.

    5. In the "Log Systems - Setting" window, in the "Syslog drop-down" box, select the

    configured Server Profile.

    6. Select "OK".

    Config Logs—Enable forwarding of Config logs by specifying a Server Profile in the log

    settings configuration.

    1. Go to Device >> Log Settings >> Config Logs

    2. Select the "Edit" icon (the gear symbol in the upper-right corner of the pane).

    3. In the "Log Settings Config" window, in the "Syslog drop-down" box, select the

    configured Server Profile.

    4. Select "OK".

    For Traffic Logs and Threat Logs, use the log forwarding profile in the security rules.

    1. Go to Policies >> Security Rule

    2. Select the rule for which the log forwarding needs to be applied.

    3. Apply the security profiles to the rule.

    4. Go to Actions >> Log forwarding

    5. Select the log forwarding profile from drop-down list.

    6. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    Select "OK" when the confirmation dialog appears.'
