- id: '1.29'
  title: PANW-NM-000136
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must employ centrally managed authentication server(s). GROUP ID:
    V-228673 RULE ID: SV-228673r1082978'
  rationale: The use of authentication servers or other centralized management servers for providing centralized authentication
    services is required for network device management. Maintaining local administrator accounts for daily usage on each network
    device without centralized management is not scalable or feasible. Without centralized management, it is likely that credentials
    for some network devices will be forgotten, leading to delays in administration, which itself leads to delays in remediating
    production problems and in addressing compromises in a timely fashion. Only the emergency administration account, also
    known as the account of last resort, can be locally configured on the device.
  impact: ''
  references: []
  page_start: 73
  audit_raw: 'Ask the administrator which form of centralized authentication server is being used. This

    requirement is not applicable to the local account of last resort.

    Navigate to the appropriate window to view the configured server(s).

    For RADIUS, go to Device >> Server Profiles >> RADIUS.

    For LDAP, go to Device >> Server Profiles >> LDAP.

    For Kerberos, go to Device >> Server Profiles >> Kerberos.

    If there are no servers configured in the window that match the specified form of

    centralized authentication, this is a finding.'
  remediation: 'The device allows three different authentication protocols: RADIUS, LDAP, and

    Kerberos. In this explanation, LDAP is used.

    To configure the Palo Alto Networks security platform to use an LDAP server, follow

    these steps:

    1. Go to Device >> Server-Profiles >> LDAP.

    2. Select "Add" (lower left of window).

    3. Populate the required fields.

    4. a. Enter the name of the profile in the "Name" field.

    5. b. In the server box enter the name of the server in the "Name" field.

    6. c. Enter the IP Address of the server.

    7. d. Enter the Port number the firewall should use to connect to the LDAP server

    (default=389 for LDAP; 636 for LDAP over SSL).

    8. e. Enter the LDAP Domain name to prepend to all objects learned from the

    server. The value entered here depends on the specific deployment. If using

    Active Directory, enter the NetBIOS domain name; not an FQDN (for example,

    enter acme, not acme.com). Note that if collecting data from multiple domains, it

    is necessary to create separate server profiles. If using a global catalog server,

    leave this field blank.

    9. Select the Type of LDAP server that will be connected. The correct LDAP

    attributes in the group mapping settings will automatically be populated based on

    the selection.

    10. In the Base field, select the DN that corresponds to the point in the LDAP tree

    where the firewall is to begin its search for user and group information.

    11. Select the SSL checkbox.

    12. Select "OK".

    To create an Authentication Profile using the newly created LDAP server, follow these

    steps:

    1. Go to Device >> Authentication Profile.

    2. Select "Add" (lower left of window).

    3. Populate the required fields as needed.

    4. a. In the Authentication field, select "LDAP".

    5. b. In the Server Profile field, select the configured LDAP server profile.

    6. c. In the Login Attribute field, enter “sAMAccountName”.

    7. Select "OK".

    Apply the authentication profile to the Administrator accounts.

    1. Go to Device >> Administrators.

    2. Select each configured account or select "Add" (in the bottom-left corner of the

    pane) to create a new one.

    3. In the "Authentication Profile" field, enter the configured LDAP authentication

    profile.

    4. Select "OK".

    Note: The name of the administrator must match the name of the user in the LDAP

    server.

    Note: The authentication profile must not be applied to the emergency administration

    account since it has special requirements.

    Commit changes by selecting "Commit" in the upper-right corner of the screen.

    Select "OK" when the confirmation dialog appears.

    Note that the emergency administration account is the only account that is configured

    locally on the device itself.'
  checks:
  - type: manual_review
    info: 'Ask the administrator which form of centralized authentication server is being used. This

      requirement is not applicable to the local account of last resort.

