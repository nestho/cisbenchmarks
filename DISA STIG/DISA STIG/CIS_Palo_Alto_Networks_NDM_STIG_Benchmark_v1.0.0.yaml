- id: '1.15'
  title: PANW-NM-000069
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Palo Alto Networks security platform must terminate management sessions after 10 minutes of inactivity
    except to fulfill documented and validated mission requirements. GROUP ID: V-228658 RULE ID: SV-228658r961068'
  rationale: Terminating an idle session within a short time period reduces the window of opportunity for unauthorized personnel
    to take control of a management session enabled on the console or console port that has been left unattended. In addition,
    quickly terminating an idle session will also free up resources committed by the managed network element. Terminating
    network connections associated with communications sessions includes, for example, de-allocating associated TCP/IP address/port
    pairs at the operating system level, or de-allocating networking assignments at the application level if multiple application
    sessions are using a single, operating system-level network connection. This does not mean that the device terminates
    all sessions or network access; it only ends the inactive session and releases the resources associated with that session.
    Device management sessions are normally ended by the Administrator when he or she has completed the management activity.
    The session termination takes place from the web client by selecting "Logout" (located at the bottom-left of the GUI window)
    or using the command line commands "exit" or "quit" at Operational mode.
  impact: ''
  references: []
  page_start: 41
  audit_raw: '1. Go to Device >> Setup >> Management.

    2. View the "Authentication Settings" pane.

    3. If the "Idle Timeout (min)" field is not "10" or less, ask the Administrator to

    produce documentation signed by the Authorizing Official that the configured

    value exists to support mission requirements.

    If this documentation is not made available, this is a finding.'
  remediation: '1. Go to Device >> Setup >> Management.

    2. In the "Authentication Settings" pane, select the "Edit" icon (the gear symbol in

    the upper-right corner of the pane).

    3. In the "Idle Timeout (min)" field, enter "10", then select "OK".

    4. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    5. Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: '1. Go to Device >> Setup >> Management.

      2. View the "Authentication Settings" pane.

      3. If the "Idle Timeout (min)" field is not "10" or less, ask the Administrator to

      produce documentation signed by the Authorizing Official that the configured

      value exists to support mission requirements.

      If this documentation is not made available, this is a finding.'
    severity: medium
- id: '1.16'
  title: PANW-NM-000075
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Administrators in the role of Security Administrator, Cryptographic Administrator, or Audit Administrator
    must not also have the role of Audit Administrator. GROUP ID: V-228659 RULE ID: SV-228659r961863'
  rationale: The Palo Alto Networks security platform has both pre-configured and configurable Administrator roles. Administrator
    roles determine the functions that the administrator is permitted to perform after logging in. Roles can be assigned directly
    to an administrator account, or define role profiles, which specify detailed privileges, and assign those to administrator
    accounts. There are three preconfigured roles designed to comply with Common Criteria requirements - Security Administrator,
    Audit Administrator, and Cryptographic Administrator. Of the three, only the Audit Administrator can delete audit records.
    The Palo Alto Networks security platform can use both pre-configured and configurable Administrator roles.
  impact: ''
  references: []
  page_start: 43
  audit_raw: 'For the roles of Security Administrator, Cryptographic Administrator, or Audit

    Administators, verify the same individual does not have more than one of these roles.

    If the Palo Alto Networks security platform has any accounts where the same person is

    in the role of Security Administrator, Cryptographic Administrator, or Audit Administrator,

    this is a finding.'
  remediation: 'Do not assign or configure more than one account to the same Administrator. Also,

    neither the Security Administrator nor the Cryptographic Administrator can be have the

    role of Audit Administrator.

    Note that the system allows each account to have only one role assigned. However,

    individuals, either accidentally or intentionally, may have more than one account.'
  checks:
  - type: manual_review
    info: 'For the roles of Security Administrator, Cryptographic Administrator, or Audit

      Administators, verify the same individual does not have more than one of these roles.

      If the Palo Alto Networks security platform has any accounts where the same person is

      in the role of Security Administrator, Cryptographic Administrator, or Audit Administrator,

      this is a finding.'
    severity: medium
- id: '1.17'
  title: PANW-NM-000092
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must automatically lock the account until the locked account is released
    by an administrator when three unsuccessful logon attempts in 15 minutes are exceeded. GROUP ID: V-228660 RULE ID: SV-228660r961863'
  rationale: By limiting the number of failed logon attempts, the risk of unauthorized system access via user password guessing,
    otherwise known as brute-forcing, is reduced. Limits are imposed by locking the account. This should not be configured
    in Device >> Setup >> Management >> Authentication Settings; instead, an authentication profile should be configured with
    lockout settings of three failed attempts and a lockout time of zero minutes. The Lockout Time is the number of minutes
    that a user is locked out if the number of failed attempts is reached (0-60 minutes, default 0). 0 means that the lockout
    is in effect until it is manually unlocked.
  impact: ''
  references: []
  page_start: 45
  audit_raw: 'Go to Device >> Administrators.

    If there is no authentication profile configured for each account (aside from the

    emergency administration account), this is a finding.

    Note which authentication profile is used for each account.

    Go to Device >> Authentication Profile.

    Check the authentication profile used for each account (noted in the previous step).

    If the Lockout Time is not set to "0" (zero), this is a finding.'
  remediation: 'This should not be configured in Device >> Setup >> Management >> Authentication

    Settings; instead, an authentication profile should be configured with lockout settings of

    three failed attempts and a lockout time of zero minutes.

    1. Go to Device >> Authentication Profile

    2. Select the configured authentication profile, or select "Add" (in the bottom-left

    corner of the pane) to create a new one.

    3. In the "Authentication Profile" field, enter the name of the authentication profile

    that will be used to control each person''s authentication process.

    4. The "Lockout Time (min)" field is the lockout duration; this must be set to "0".

    This will keep the lockout in effect until it is manually unlocked.

    5. In the "Failed Attempts" field, enter "3".

    6. Select "OK".

    Apply the authentication profile to the Administrator accounts.

    1. Go to Device >> Administrators

    2. Select each configured account, or select "Add" (in the bottom-left corner of the

    pane) to create a new one.

    3. In the "Authentication Profile" field, enter the configured authentication profile.

    4. Select "OK".

    This authentication profile should not be applied to the emergency administration

    account since it has special requirements.

    Commit changes by selecting "Commit" in the upper-right corner of the screen.

    Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'Go to Device >> Administrators.

      If there is no authentication profile configured for each account (aside from the

      emergency administration account), this is a finding.

      Note which authentication profile is used for each account.

      Go to Device >> Authentication Profile.

      Check the authentication profile used for each account (noted in the previous step).

      If the Lockout Time is not set to "0" (zero), this is a finding.'
    severity: medium
- id: '1.18'
  title: PANW-NM-000096
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Palo Alto Networks security platform must generate an immediate alert when allocated audit record storage
    volume reaches 75% of repository maximum audit record storage capacity. GROUP ID: V-228661 RULE ID: SV-228661r961863'
  rationale: If security personnel are not notified immediately upon storage volume utilization reaching 75%, they are unable
    to plan for storage capacity expansion. This could lead to the loss of audit information. Note that while the network
    device must generate the alert, notification may be done by a management server.
