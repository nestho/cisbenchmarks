- id: '1.32'
  title: PANW-NM-000143
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Palo Alto Networks security platform must not use the default admin account password. GROUP ID: V-228676
    RULE ID: SV-228676r961863'
  rationale: To assure accountability and prevent unauthenticated access, organizational administrators must be uniquely identified
    and authenticated for all network management accesses to prevent potential misuse and compromise of the system. The use
    of a default password for any account, especially one for administrative access, can quickly lead to a compromise of the
    device and subsequently, the entire enclave or system. The "admin" account is intended solely for the initial setup of
    the device and must be disabled when the device is initially configured. The default password for this account must immediately
    be changed at the first login of an authorized administrator.
  impact: ''
  references: []
  page_start: 79
  audit_raw: 'Open a web browser at an authorized workstation and enter the management IP

    address of the Palo Alto Networks security platform.

    Use HTTP Secure (HTTPS) instead of HTTP since HTTP is disabled by default.

    The logon window will appear.

    Enter

    "admin" into both the "Name" and "Password" fields.

    If anything except the logon screen with the message "Invalid username or password"

    appears, this is a finding.'
  remediation: '1. Go to Device >> Administrators

    2. Select the admin user.

    3. In the "Old Password" field, enter "admin".

    4. In the "New Password" field, enter the new password.

    5. In the "Confirm New Password" field, enter the new password.

    6. Select "OK".

    7. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    8. Select "OK" when the confirmation dialog appears.'
  checks:
