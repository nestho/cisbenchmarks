- id: '1.12'
  title: PANW-NM-000058
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'If multifactor authentication is not available and passwords must be used, the Palo Alto Networks security
    platform must enforce password complexity by requiring that at least one special character be used. GROUP ID: V-228653
    RULE ID: SV-228653r1018778'
  rationale: Use of a complex password helps to increase the time and resources required to compromise the password. Password
    complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force
    attacks. Password complexity is one factor of several that determines how long it takes to crack a password. The more
    complex the password, the greater the number of possible combinations that needs to be tested before the password is compromised.
  impact: ''
  references: []
  page_start: 35
  audit_raw: '1. Go to Device >> Setup >> Management.

    2. View the "Minimum Password Complexity" window.

    If the "Minimum Special Letters" field is not "1", this is a finding.'
  remediation: '1. Go to Device >> Setup >> Management.

    2. In the "Minimum Password Complexity" window, select the "Edit" icon (the gear

    symbol in the upper-right corner of the pane).

    3. In the "Minimum Special Letters" field, enter "1".

    4. Check the "Enabled box", then select "OK".

    5. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    6. Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: '1. Go to Device >> Setup >> Management.

      2. View the "Minimum Password Complexity" window.

      If the "Minimum Special Letters" field is not "1", this is a finding.'
    severity: medium
- id: '1.13'
  title: PANW-NM-000059
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'If multifactor authentication is not available and passwords must be used, the Palo Alto Networks security
    platform must require that when a password is changed, the characters are changed in at least 8 of the positions within
    the password. GROUP ID: V-228654 RULE ID: SV-228654r1043189'
  rationale: If the application allows the user to consecutively reuse extensive portions of passwords, this increases the
    chances of password compromise by increasing the window of opportunity for attempts at guessing and brute-force attacks.
    The number of changed characters refers to the number of changes required with respect to the total number of positions
    in the current password. In other words, characters may be the same within the two passwords; however, the positions of
    the like characters must be different.
  impact: ''
  references: []
