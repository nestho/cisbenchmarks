- id: '1.26'
  title: PANW-NM-000118
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Palo Alto Networks security platform must not use SNMP Versions 1 or 2. GROUP ID: V-228670 RULE ID: SV-228670r961557'
  rationale: SNMP Versions 1 and 2 are not considered secure. Without the strong authentication and privacy that is provided
    by the SNMP Version 3 User-based Security Model (USM), an unauthorized user can gain access to network management information
    used to launch an attack against the network. SNMP Versions 1 and 2 cannot authenticate the source of a message nor can
    they provide encryption. Without authentication, it is possible for nonauthorized users to exercise SNMP network management
    functions. It is also possible for nonauthorized users to eavesdrop on management information as it passes from managed
    systems to the management system.
  impact: ''
  references: []
  page_start: 63
  audit_raw: 'Go to Device >> Setup >> Operations; in the Miscellaneous pane, select SNMP Setup.

    In the SNMP Setup window, check if SNMP V3 is selected.

    If V3 is not selected, this is a finding.

    Go to Device >> Server Profiles >> SNMP Trap.

    View the list of configured SNMP servers; if the Version is not "v3", this is a finding.'
  remediation: 'Go to Device >> Setup >> Operations; in the Miscellaneous pane, select SNMP Setup.

    In the SNMP Setup window, complete the required fields.

    For the Version, select V3.

    1. Configure a view and assign it to a user.

    2. In the upper half of the SNMP Setup window, select "Add".

    3. In the Views window, complete the required fields; obtain the values for the OID

    and Mask fields from product documentation or vendor support.

    4. In the Option field, select "include".

    5. Select "OK".

    6. In the lower half of the SNMP Setup window, select "Add".

    7. Complete the required fields.

    8. Select "OK".

    9. Obtain the engineID of the Palo Alto device by issuing an SNMPv3 GET from the

    management workstation against the OID of the Palo Alto device.

    10. Configure the SNMPv3 Trap Server profile; go to Device >> Server Profiles >>

    SNMP Trap; select "Add".

    11. In the SNMP Trap Server Profile window, complete the required fields.

    12. Select "OK".

    13. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    14. Select "OK" when the confirmation dialog appears.'
  checks:
