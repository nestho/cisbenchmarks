controls:
- id: '1.1'
  title: PANW-NM-000015
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must enforce the limit of three consecutive invalid logon attempts.
    GROUP ID: V-228639 RULE ID: SV-228639r1082941'
  rationale: By limiting the number of failed logon attempts, the risk of unauthorized system access via user password guessing,
    otherwise known as brute-forcing, is reduced.
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'Go to Device >> Authentication Profile.

    Check the authentication profile used for the local account used for the account of last

    resort.

    If the "Failed Attempts (#)" field is not set to "3", this is a finding.'
  remediation: 'Configure the authentication profile associated with the account of last resort with

    lockout settings of three failed attempts, which is the only local login account.

    1. Go to Device >> Authentication Profile.

    2. Select the configured authentication profile or select "Add" (in the bottom-left

    corner of the pane) to create a new one.

    3. In the "Authentication Profile" field, enter the name of the authentication profile

    that will be used to control each person''s authentication process.

    4. The "Lockout Time (min)" field is the lockout duration; this must be set to "15".

    5. In the "Failed Attempts" field, enter "3".

    6. Select "OK".'
  checks:
  - type: manual_review
    info: 'Go to Device >> Authentication Profile.

      Check the authentication profile used for the local account used for the account of last

      resort.

      If the "Failed Attempts (#)" field is not set to "3", this is a finding.'
    severity: medium
- id: '1.2'
  title: PANW-NM-000016
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Palo Alto Networks security platform must display the Standard Mandatory DoD Notice and Consent Banner
    before granting access to the device. GROUP ID: V-228640 RULE ID: SV-228640r960843'
  rationale: Display of the DoD-approved use notification before granting access to the network device ensures privacy and
    security notification verbiage used is consistent with applicable federal laws, Executive Orders, directives, policies,
    regulations, standards, and guidance. System use notifications are required only for access via logon interfaces with
    human users.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'View the logon screen of the Palo Alto Networks security platform. A white text box at

    the bottom of the screen will contain the configured text.

    If it is blank (there is no white text box) or the wording is not one of the approved

    banners, this is a finding.

    This is the approved verbiage for applications that can accommodate banners of 1300

    characters:

    "You are accessing a U.S. Government (USG) Information System (IS) that is provided

    for USG-authorized use only.

    By using this IS (which includes any device attached to this IS), you consent to the

    following conditions:

    -The USG routinely intercepts and monitors communications on this IS for purposes

    including, but not limited to, penetration testing, COMSEC monitoring, network

    operations and defense, personnel misconduct (PM), law enforcement (LE), and

    counterintelligence (CI) investigations.

    -At any time, the USG may inspect and seize data stored on this IS.

    -Communications using, or data stored on, this IS are not private, are subject to routine

    monitoring, interception, and search, and may be disclosed or used for any USGauthorized purpose.

    -This IS includes security measures (e.g., authentication and access controls) to protect

    USG interests--not for your personal benefit or privacy.

    -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI

    investigative searching or monitoring of the content of privileged communications, or

    work product, related to personal representation or services by attorneys,

    psychotherapists, or clergy, and their assistants. Such communications and work

    product are private and confidential. See User Agreement for details."

    Use the following verbiage for operating systems that have severe limitations on the

    number of characters that can be displayed in the banner:

    "I''ve read & consent to terms in IS user agreem''t."'
  remediation: '1. Go to Device >> Setup >> Management >> General Settings ("Edit" icon) >>

    Login Banner

    2. Type in the required text

    3. Select "OK".

    4. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    5. Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'View the logon screen of the Palo Alto Networks security platform. A white text box at

      the bottom of the screen will contain the configured text.

      If it is blank (there is no white text box) or the wording is not one of the approved

      banners, this is a finding.

      This is the approved verbiage for applications that can accommodate banners of 1300

      characters:

      "You are accessing a U.S. Government (USG) Information System (IS) that is provided

      for USG-authorized use only.

      By using this IS (which include'
    severity: medium
- id: '1.3'
  title: PANW-NM-000024
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must generate audit records when successful/unsuccessful attempts
    to access privileges occur. GROUP ID: V-228642 RULE ID: SV-228642r960885'
  rationale: Without generating audit records that are specific to the security and mission needs of the organization, it
    would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible
    for one. By default, the Configuration Log contains the administrator username, client (Web or CLI), and date and time
    for any changes to configurations and for configuration commit actions. The System Log also shows both successful and
    unsuccessful attempts for configuration commit actions. The System Log and Configuration Log can be configured to send
    log messages by severity level to specific destinations; the Panorama management console, an SNMP console, an e-mail server,
    or a syslog server. Since both the System Log and Configuration Log contain information concerning the use of privileges,
    both must be configured to send messages to a syslog server at a minimum.
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Go to Device >> Log Settings >> System

    If any severity level does not have a Syslog Profile, this is a finding.'
  remediation: 'Create a syslog server profile.

    1. Go to Device >> Server Profiles >> Syslog

    2. Select "Add"

    3. In the "Syslog Server Profile", enter the name of the profile; select "Add".

    4. In the "Servers" tab, enter the required information.

    5. Name: Name of the syslog server

    6. Server: Server IP address where the logs will be forwarded to

    7. Port: Default port 514

    8. Facility: Select from the drop down list

    9. Select "OK".

    10. Go to Device >> Log Settings >> System

    11. For each severity level, select which destinations should receive the log

    messages. Note: The "Syslog Profile" field must be completed.

    12. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    13. Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'Go to Device >> Log Settings >> System

      If any severity level does not have a Syslog Profile, this is a finding.'
    severity: medium
- id: '1.4'
  title: PANW-NM-000029
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Palo Alto Networks security platform must produce audit log records containing information (FQDN, unique
    hostname, management IP address) to establish the source of events. GROUP ID: V-228643 RULE ID: SV-228643r960900'
  rationale: In order to compile an accurate risk assessment and provide forensic analysis, it is essential for security personnel
    to know the source of the event. The source may be a component, module, or process within the device or an external session,
    administrator, or device. Associating information about where the source of the event occurred provides a means of investigating
    an attack; recognizing resource utilization or capacity thresholds; or identifying an improperly configured device. The
    device must have a unique hostname that can be used to identify the device; fully qualified domain name (FQDN), hostname,
    or management IP address is used in audit logs to identify the source of a log message.
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'Go to Device >> Setup >> Management

    In the "General Settings" window, if the "hostname" field does not contain a unique

    identifier, this is a finding.

    Go to Device >> Setup >> Management

    In the "Logging and Reporting Settings" pane, if the "Send Hostname in Syslog" does

    not show either "FQDN", "hostname", "ipv4-address", or "ipv6-address", this is a finding.'
  remediation: 'Set a unique hostname.

    1. Go to Device >> Setup >> Management

    2. in the "General Settings" window, select the "Edit" icon (the gear symbol in the

    upper-right corner of the pane).

    3. In the "General Settings" window, in the "hostname" field; enter a unique

    hostname.

    4. Select "OK".

    Configure the device to send the FQDN, hostname, ipv4-address, or ipv6-address with

    log messages.

    1. Device >> Setup >> Management

    2. Click the "Edit" icon in the "Logging and Reporting Settings" section.

    3. Select the "Log Export and Reporting" tab.

    4. Select one of the following options from the "Send Hostname in the Syslog" dropdown list:

    5. FQDN — (the default) Concatenates the hostname and domain name defined on

    the sending device.

    6. hostname — Uses the hostname defined on the sending device.

    7. ipv4-address —Uses the IPv4 address of the interface used to send logs on the

    device. By default, this is the management interface of the device.

    8. ipv6-address —Uses the IPv6 address of the interface used to send logs on the

    device. By default, this is the management interface of the device.

    9. Note that the last two selections must be consistent with the IP address used by

    the management interface.

    10. Select "OK".

    11. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    Select "OK" when the confirmation dialog appears.'
  checks:
  - type: sql
    command: show either "FQDN", "hostname", "ipv4-address", or "ipv6-address", this is a finding.
    severity: medium
    info: 'Go to Device >> Setup >> Management

      In the "General Settings" window, if the "hostname" field does not contain a unique

      identifier, this is a finding.

      Go to Device >> Setup >> Management

      In the "Logging and Reporting Settings" pane, if the "Send Hostname in Syslog" does

      not show either "FQDN", "hostname", "ipv4-address", or "ipv6-address", this is a finding.'
- id: '1.5'
  title: PANW-NM-000046
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must be configured to prohibit the use of all unnecessary and/or
    nonsecure functions, ports, protocols, and/or services, as defined in the PPSM CAL and vulnerability assessments. GROUP
    ID: V-228645 RULE ID: SV-228645r1043177'
  rationale: In order to prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized
    tunneling (i.e., embedding of data types within data types), organizations must disable unused or unnecessary physical
    and logical ports/protocols on information systems. Network devices are capable of providing a wide variety of functions
    and services. Some of the functions and services provided by default may not be necessary to support essential organizational
    operations. Additionally, it is sometimes convenient to provide multiple services from a single component (e.g., email
    and web services); however, doing so increases risk over limiting the services provided by any one component. To support
    the requirements and principles of least functionality, the network device must support the organizational requirements
    providing only essential capabilities and limiting the use of ports, protocols, and/or services to only those required,
    authorized, and approved to conduct official business or to address authorized quality of life issues. The Palo Alto Networks
    security platform uses a hardened operating system in which unnecessary services are not present. The device has a DNS,
    NTP, update, and e-mail client installed. Note that these are client applications and not servers; additionally, each
    has a valid purpose. However, local policy may dictate that the update service, e-mail client, and statistics (reporting)
    service capabilities not be used. DNS can be either "Server" or "Proxy"; both are allowed unless local policy declares
    otherwise. NTP and SNMP are necessary functions.
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'Go to Device >> Setup >> Services

    In the "Services" window, view which services are configured.

    Note: DNS can be either "Server" or "Proxy"; both are allowed unless local policy

    declares otherwise.

    Note: The Palo Alto Networks security platform cannot be a DNS server, only a client or

    proxy.

    NTP is a necessary service.

    Note: The Palo Alto Networks security platform cannot be an NTP server, only a client.

    Go to Device >> Setup >> Management

    In the "Management Interface Settings" window, view the enabled services.

    Note: Which management services are enabled. HTTPS, SSH, ping, and SNMP, are

    normally allowed.

    If User-ID, User-ID Syslog Listener-SSL, User-ID Syslog Listener-UDP, or HTTP OCSP

    is present, verify with the ISSO that this has been authorized.

    1. Go to Device >> Setup >> Operations tab>> Miscellaneous

    2. Select SNMP Setup.

    3. In the "SNMP Setup" window, check if SNMP V3 is selected.

    4. If unauthorized services are configured, this is a finding.'
  remediation: 'Go to Device >> Setup >> Services

    In the "Services" window, select the "Edit" icon (the gear symbol in the upper-right

    corner of the pane).

    Note: DNS can be either "Server" or "Proxy"; both are allowed unless local policy

    declares otherwise.

    Note: The Palo Alto Networks security platform cannot be a DNS server, only a client or

    proxy.

    NTP is a necessary service.

    Note: The Palo Alto Networks security platform cannot be an NTP server, only a client.

    1. Go to Device >> Setup >> Management

    2. In the "Management Interface Settings" window, select the "Edit" icon (the gear

    symbol in the upper-right corner of the pane).

    3. In the "Management Interface Settings" window, select HTTP OCSP, HTTPS,

    SSH, SNMP, User-ID, User-ID Syslog Listener-SSL, User-ID Syslog ListenerUDP if these protocols will be used.

    4. Select "OK".

    Note: SNMP Versions 1 and 2 are not considered secure; use SNMP Version 3.

    1. Device >> Setup >> Operations tab>> Miscellaneous

    2. Select SNMP Setup.

    3. In the "SNMP Setup" window, select V3.

    4. Select "OK".

    5. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    6. Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'Go to Device >> Setup >> Services

      In the "Services" window, view which services are configured.

      Note: DNS can be either "Server" or "Proxy"; both are allowed unless local policy

      declares otherwise.

      Note: The Palo Alto Networks security platform cannot be a DNS server, only a client or

      proxy.

      NTP is a necessary service.

      Note: The Palo Alto Networks security platform cannot be an NTP server, only a client.

      Go to Device >> Setup >> Management

      In the "Management Interface Settings" window, view the '
    severity: medium
- id: '1.6'
  title: PANW-NM-000048
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto device must be configured with only one local account to be used as the account of last resort
    in the event the authentication server is unavailable. GROUP ID: V-268323 RULE ID: SV-268323r1084266'
  rationale: Authentication for administrative (privileged level) access to the device is required at all times. An account
    can be created on the device's local database for use when the authentication server is down or connectivity between the
    device and the authentication server is not operable. This account is referred to as the account of last resort since
    it is intended to be used as a last resort and when immediate administrative access is absolutely necessary. The account
    of last resort logon credentials must be stored in a sealed envelope and kept in a safe. The safe must be periodically
    audited to verify the envelope remains sealed. The signature of the auditor and the date of the audit must be added to
    the envelope as a record. Administrators must secure the credentials and disable the root account (if possible) when not
    needed for system administration functions.
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'Navigate to Device >> Administrators.

    Review the user list.

    If there is an authentication profile/user account configured (and enabled) for any

    account other than the emergency administration account, this is a finding.'
  remediation: 'Remove local users other than the designated account of last resort.

    Using the Console UI:

    1. Navigate to Device >> Administrators.

    2. Select and delete local users other than the account of last resort.

    Note: To protect against brute-force attacks, delete the default admin account by

    creating a new superuser administrator account, logging out, and logging back in using

    the new account.'
  checks:
  - type: manual_review
    info: 'Navigate to Device >> Administrators.

      Review the user list.

      If there is an authentication profile/user account configured (and enabled) for any

      account other than the emergency administration account, this is a finding.'
    severity: medium
- id: '1.7'
  title: PANW-NM-000051
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must implement replay-resistant authentication mechanisms for network
    access to privileged accounts. GROUP ID: V-228647 RULE ID: SV-228647r960993'
  rationale: A replay attack may enable an unauthorized user to gain access to the application. Authentication sessions between
    the authenticator and the application validating the user credentials must not be vulnerable to a replay attack. An authentication
    process resists replay attacks if it is impractical to achieve a successful authentication by recording and replaying
    a previous authentication message. Techniques used to address this include protocols using nonces (e.g., numbers generated
    for a specific one-time use) or challenges (e.g., TLS, WS_Security). Additional techniques include time-synchronous or
    challenge-response one-time authenticators. Of the three authentication protocols on the Palo Alto Networks security platform,
    only Kerberos is inherently replay-resistant. If LDAP is selected, TLS must also be used. If RADIUS is used, the device
    must be operating in FIPS mode.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'Ask the Administrator which form of centralized authentication server is being used.

    Navigate to the appropriate window to view the configured server(s).

    • For RADIUS, go to Device >> Server Profiles >> RADIUS

    • For LDAP, go to Device >> Server Profiles >> LDAP

    • For Kerberos, go to Device >> Server Profiles >> Kerberos

    If Kerberos is used, this is a not finding.

    If LDAP is used, view the LDAP Server Profile; if the SSL checkbox is not checked, this

    is a finding.

    If RADIUS is used, use the command line interface to determine if the device is

    operating in FIPS mode. Enter the CLI command "show fips-mode" or the command

    show fips-cc (for more recent releases).

    If FIPS mode is set to "off", this is a finding.'
  remediation: 'To configure the Palo Alto Networks security platform to use an LDAP server with

    SSL/TLS.

    1. Go to Device >> Server-Profiles >> LDAP

    2. Select "Add" (lower left of window).

    3. Populate the required fields.

    4. Enter the name of the profile in the "Name" field.

    In the server box:

    1. Enter the name of the server in the "Name" field.

    2. Enter the IP Address of the server.

    3. Enter the Port number the firewall should use to connect to the LDAP server

    (default=389 for LDAP; 636 for LDAP over SSL).

    4. Enter the LDAP Domain name to prepend to all objects learned from the server.

    The value entered here depends on the specific deployment. If using Active

    Directory, enter the NetBIOS domain name, not a FQDN (for example, enter

    acme, not acme.com). Note that if collecting data from multiple domains, it is

    necessary to create separate server profiles. If using a global catalog server,

    leave this field blank.

    5. Select the Type of LDAP server connecting to. The correct LDAP attributes in the

    group mapping settings will automatically be populated based on the selection.

    6. In the Base field, select the DN that corresponds to the point in the LDAP tree

    where the firewall is to begin its search for user and group information.

    7. Select (check) the SSL checkbox.

    8. Select "OK".

    9. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    Select "OK" when the confirmation dialog appears.'
  checks:
  - type: sql
    command: show fips-mode" or the command
    severity: medium
    info: 'Ask the Administrator which form of centralized authentication server is being used.

      Navigate to the appropriate window to view the configured server(s).

      • For RADIUS, go to Device >> Server Profiles >> RADIUS

      • For LDAP, go to Device >> Server Profiles >> LDAP

      • For Kerberos, go to Device >> Server Profiles >> Kerberos

      If Kerberos is used, this is a not finding.

      If LDAP is used, view the LDAP Ser'
- id: '1.8'
  title: PANW-NM-000053
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'If multifactor authentication is not available and passwords must be used, the Palo Alto Networks security
    platform must enforce a minimum 15-character password length. GROUP ID: V-228648 RULE ID: SV-228648r1018774'
  rationale: Password complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing
    and brute-force attacks. Password length is one factor of several that helps to determine strength and how long it takes
    to crack a password. The shorter the password, the lower the number of possible combinations that needs to be tested before
    the password is compromised. Use of more characters in a password helps to exponentially increase the time and/or resources
    required to compromise the password.
  impact: ''
  references: []
  page_start: 27
  audit_raw: '1. Go to Device >> Setup >> Management.

    2. View the "Minimum Password Complexity" window.

    If the "Minimum Length" field is not "15", this is a finding.'
  remediation: '1. Go to Device >> Setup >> Management.

    2. In the "Minimum Password Complexity" window, select the "Edit" icon (the gear

    symbol in the upper-right corner of the pane).

    3. In the "Minimum Length" field, enter "15".

    4. Check the "Enabled" box, then select "OK".

    5. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    6. Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: '1. Go to Device >> Setup >> Management.

      2. View the "Minimum Password Complexity" window.

      If the "Minimum Length" field is not "15", this is a finding.'
    severity: medium
