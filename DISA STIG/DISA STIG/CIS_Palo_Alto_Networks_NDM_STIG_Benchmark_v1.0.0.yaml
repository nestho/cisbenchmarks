    severity: medium
- id: '1.14'
  title: PANW-NM-000061
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must prohibit the use of unencrypted protocols for network access
    to privileged accounts. GROUP ID: V-228655 RULE ID: SV-228655r961029'
  rationale: Passwords need to be protected at all times, and encryption is the standard method for protecting passwords.
    If passwords are not encrypted, they can be plainly read (i.e., clear text) and easily compromised. Network devices can
    accomplish this by making direct function calls to encryption modules or by leveraging operating system encryption capabilities.
  impact: ''
  references: []
  page_start: 39
  audit_raw: '1. Go to Device >> Setup >> Management

