  audit_raw: 'Go to Device >> Setup >> Management

    In the "Management Interface Settings" window, view the enabled services.

    Note: Which management services are enabled.

    If Telnet or HTTP is selected, this is a finding.'
  remediation: '1. Go to Device >> Setup >> Management.

    2. In the "Management Interface Settings" window, select the "Edit" icon (the gear

    symbol in the upper-right corner).

    3. In the "Management Interface Settings" window, make sure that Telnet or HTTP

    are not selected.

    4. Select "OK".

    5. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    6. Select "OK" when the confirmation dialog appears.'
