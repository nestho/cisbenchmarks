    severity: medium
- id: '1.20'
  title: PANW-NM-000098
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Palo Alto Networks security platform must compare internal information system clocks at least every 24
    hours with an authoritative time server. GROUP ID: V-228663 RULE ID: SV-228663r1018780'
  rationale: Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining
    the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating
    system events. Synchronizing internal information system clocks provides uniformity of time stamps for information systems
    with multiple system clocks and systems connected over a network. Network Time Protocol (NTP) is used to synchronize the
    system clock of a computer to reference time source. The Palo Alto Networks security platform can be configured to use
    specified NTP servers. For synchronization with the NTP server(s), NTP uses a minimum polling value of 64 seconds and
    a maximum polling value of 1024 seconds. These minimum and maximum polling values are not configurable on the firewall.
  impact: ''
  references: []
  page_start: 51
  audit_raw: 'Go to Device >> Setup >> Services.

    In the "Services" window, the names or IP addresses of the Primary NTP Server and

    Secondary NTP Server must be present.

    If the "Primary NTP Server" and "Secondary NTP Server" fields are blank, this is a

    finding.'
  remediation: '1. Go to Device >> Setup >> Services.

    2. Select the "Edit" icon (the gear symbol in the upper-right corner of the pane).

    3. In the "Services" window, in the NTP tab, in the "Primary NTP Server Address"

    field and the "Secondary NTP Server Address" field, enter the IP address or

    hostname of the NTP servers.

    In the "Authentication Type" field, select one of the following:

    • Symmetric Key; this option uses symmetric key exchange, which are shared

    secrets. Enter the key ID, algorithm, authentication key, and confirm the

    authentication key; for the algorithm, select "SHA1".

    • Autokey; this option uses auto key, or public key cryptography.

    • Commit changes by selecting "Commit" in the upper-right corner of the screen.

    • Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'Go to Device >> Setup >> Services.

      In the "Services" window, the names or IP addresses of the Primary NTP Server and

      Secondary NTP Server must be present.

      If the "Primary NTP Server" and "Secondary NTP Server" fields are blank, this is a

      finding.'
    severity: medium
- id: '1.21'
  title: PANW-NM-000099
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Palo Alto Networks security platform must synchronize internal information system clocks to the authoritative
    time source when the time difference is greater than one second. GROUP ID: V-228664 RULE ID: SV-228664r1018781'
  rationale: Inaccurate time stamps make it more difficult to correlate events and can lead to an inaccurate analysis. Determining
    the correct time a particular event occurred on a system is critical when conducting forensic analysis and investigating
    system events. Synchronizing internal information system clocks provides uniformity of time stamps for information systems
    with multiple system clocks and systems connected over a network. The Palo Alto Networks security platform can be configured
    to use specified Network Time Protocol (NTP) servers. NTP is used to synchronize the system clock of a computer to reference
    time source. Sources outside of the configured acceptable allowance (drift) may be inaccurate. When properly configured,
    NTP will synchronize all participating computers to within a few milliseconds of the reference time source.
  impact: ''
  references: []
  page_start: 53
  audit_raw: 'Go to Device >> Setup >> Services.

    In the "Services" window, the names or IP addresses of the Primary NTP Server and

    Secondary NTP Server must be present.

