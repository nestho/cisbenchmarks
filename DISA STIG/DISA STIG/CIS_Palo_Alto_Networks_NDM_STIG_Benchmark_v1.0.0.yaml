    "Secondary NTP Server Address" field, enter the IP address or hostname of the

    NTP servers.

    In the "Authentication Type" field, select one of the following:

    • None (default); this option disables NTP authentication.

    • Symmetric Key; this option uses symmetric key exchange, which are shared

    secrets. Enter the key ID, algorithm, authentication key, and confirm the

    authentication key.

    • Autokey; this option uses auto key, or public key cryptography.

    • Commit changes by selecting "Commit" in the upper-right corner of the screen.

    • Select "OK" when the confirmation dialog appears.'
  checks:
