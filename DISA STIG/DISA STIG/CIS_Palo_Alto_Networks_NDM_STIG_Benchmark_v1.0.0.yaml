- id: '1.33'
  title: PANW-NM-000144
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must generate an audit log record when the Data Plane CPU utilization
    is 100%. GROUP ID: V-228677 RULE ID: SV-228677r961863'
  rationale: Auditing and logging are key components of any security architecture. Logging the actions of specific events
    provides a means to investigate an attack; to recognize resource utilization or capacity thresholds; or to identify an
    improperly configured network device. If auditing is not comprehensive, it will not be useful for intrusion monitoring,
    security investigations, and forensic analysis. If the Data Plane CPU utilization is 100%, this may indicate an attack
    or simply an overutilized device. In either case, action must be taken to identify the source of the issue and take corrective
    action.
  impact: ''
  references: []
  page_start: 81
  audit_raw: 'Go to Device >> Setup >> Management

    In the "Logging and Reporting Settings" pane.

    If the "Enable Log on High DP Load" check box is not selected, this is a finding.'
  remediation: '1. Go to Device >> Setup >> Management

    2. In the "Logging and Reporting Settings" pane, select the "Edit" icon (the gear

    symbol in the upper-right corner of the pane).

    3. In the "Log Export and Reporting" tab, select the "Enable Log on High DP Load"

    check box.

    4. Select "OK".

    5. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    6. Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'Go to Device >> Setup >> Management

      In the "Logging and Reporting Settings" pane.

      If the "Enable Log on High DP Load" check box is not selected, this is a finding.'
    severity: medium
- id: '1.34'
  title: PANW-NM-000145
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must authenticate Network Time Protocol sources. GROUP ID: V-228678
    RULE ID: SV-228678r961506'
  rationale: If Network Time Protocol is not authenticated, an attacker can introduce a rogue NTP server. This rogue server
    can then be used to send incorrect time information to network devices, which will make log timestamps inaccurate and
    affected scheduled actions. NTP authentication is used to prevent this tampering by authenticating the time source.
  impact: ''
  references: []
  page_start: 83
  audit_raw: 'Go to Device >> Setup >> Services

    In the "Services" window, the Primary NTP Server Authentication Type and Secondary

    NTP Server Authentication Type must be either Symmetric Key or Autokey. If the

    "Primary NTP Server Authentication Type" and "Secondary NTP Server Authentication

    Type" fields are "none", this is a finding.'
  remediation: '1. Go to Device >> Setup >> Services

    2. Select the "Edit" icon (the gear symbol in the upper-right corner of the pane).

    3. In the "Services" window, in the NTP tab, in the "Primary NTP Server Address"

    field and the "Secondary NTP Server Address" field, enter the IP address or

    hostname of the NTP servers.

    In the "Authentication Type" field, select one of the following:

    • Symmetric Key; this option uses symmetric key exchange, which are shared

    secrets. Enter the key ID, algorithm, authentication key, and confirm the

    authentication key; for the algorithm, select "SHA1".

    • Autokey; this option uses auto key, or public key cryptography.

    • Commit changes by selecting "Commit" in the upper-right corner of the screen.

    • Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'Go to Device >> Setup >> Services

      In the "Services" window, the Primary NTP Server Authentication Type and Secondary

      NTP Server Authentication Type must be either Symmetric Key or Autokey. If the

