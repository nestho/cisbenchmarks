- id: '1.22'
  title: PANW-NM-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must be configured to synchronize internal information system clocks
    with the primary and secondary time sources located in different geographic regions using redundant authoritative time
    sources. GROUP ID: V-228665 RULE ID: SV-228665r1018782'
  rationale: 'The loss of connectivity to a particular authoritative time source will result in the loss of time synchronization
    (free-run mode) and increasingly inaccurate time stamps on audit events and other functions. Multiple time sources provide
    redundancy by including a secondary source. Time synchronization is usually a hierarchy; clients synchronize time to a
    local source while that source synchronizes its time to a more accurate source. DOD-approved solutions consist of a combination
    of a primary and secondary time source using a combination or multiple instances of the following: a time server designated
    for the appropriate DOD network (NIPRNet/SIPRNet); United States Naval Observatory (USNO) time servers; and/or the Global
    Positioning System (GPS). The secondary time source must be located in a different geographic region from the primary
    time source.'
  impact: ''
  references: []
  page_start: 55
  audit_raw: 'Go to Device >> Setup >> Services.

    If there is only one NTP Server configured, this is a finding.

    Ask the firewall administrator where the Primary NTP Server and Secondary NTP

    Server are located; if they are not in different geographic regions, this is a finding.'
  remediation: '1. Go to Device >> Setup >> Services.

    2. Select the "Edit" icon (the gear symbol in the upper-right corner of the pane).

    3. In the "Services" window, in the "Primary NTP Server Address" field and the

    "Secondary NTP Server Address" field, enter the IP address or hostname of the

    NTP servers.

    In the "Authentication Type" field, select one of the following:

    • None (default); this option disables NTP authentication.

    • Symmetric Key; this option uses symmetric key exchange, which are shared

    secrets. Enter the key ID, algorithm, authentication key, and confirm the

    authentication key.

    • Autokey; this option uses auto key, or public key cryptography.

    • Commit changes by selecting "Commit" in the upper-right corner of the screen.

    • Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'Go to Device >> Setup >> Services.

      If there is only one NTP Server configured, this is a finding.

      Ask the firewall administrator where the Primary NTP Server and Secondary NTP

      Server are located; if they are not in different geographic regions, this is a finding.'
    severity: medium
- id: '1.23'
  title: PANW-NM-000101
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must record time stamps for audit records that can be mapped to Coordinated
    Universal Time (UTC) or Greenwich Mean Time (GMT). GROUP ID: V-228666 RULE ID: SV-228666r961443'
  rationale: If time stamps are not consistently applied and there is no common time reference, it is difficult to perform
    forensic analysis. Time stamps generated by the application include date and time and must be expressed in Coordinated
    Universal Time (UTC), also known as Zulu time, a modern continuation of Greenwich Mean Time (GMT).
  impact: ''
  references: []
  page_start: 57
  audit_raw: 'Go to Device >> Setup >> Management

    In the "General Settings" window, if the time zone is not set to "GMT" or "UTC", this is a

    finding.'
  remediation: '1. Go to Device >> Setup >> Management

    2. In the "General Settings" window, select the "Edit" icon (the gear symbol in the

    upper-right corner of the pane).

    3. In the "General Settings" window, in the "Time Zone" field, select "GMT" or

    "UTC" from the list of time zones.

    4. Select "OK".

    5. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'Go to Device >> Setup >> Management

      In the "General Settings" window, if the time zone is not set to "GMT" or "UTC", this is a

      finding.'
    severity: medium
- id: '1.24'
  title: PANW-NM-000110
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must accept and verify Personal Identity Verification (PIV) credentials.
    GROUP ID: V-228667 RULE ID: SV-228667r997687'
  rationale: The use of PIV credentials facilitates standardization and reduces the risk of unauthorized access. DOD has mandated
    the use of the CAC to support identity management and personal authentication for systems covered under HSPD 12 and as
    a primary component of layered protection for national security systems.
  impact: ''
  references: []
  page_start: 58
  audit_raw: 'Go to Device >> Certificate Management >> Certificates.

    If no DOD Certification Authority (CA) certificates and subordinate certificates are

    imported, this is a finding.

    Go to Device >> Setup >> Management.

    In the Authentication Settings pane, if the Certificate Profile field is blank, this is a

    finding.

    View the Certificate Profile, if it does not list the DOD CA certificates and subordinate

    certificates, this is a finding.

    If the Use OCSP checkbox is not selected, this is a finding.'
  remediation: 'Import the DOD CA certificates and subordinate certificates for all of the certificate

    authorities.

    1. Go to Device >> Certificate Management >> Certificates.

    2. Select the Import icon at the bottom of the pane.

    3. In the Import Certificate window, complete the required information.

    4. Select "OK".

    Create a certificate profile.

    1. Go to Device >> Setup >> Management.

    2. In the Authentication Settings pane, select the select the "Edit" icon (the gear

    symbol in the upper-right corner).

    3. In the Authentication Settings window, complete the required information.

    4. In the Authentication Profile field, select "None".

    5. In the Certificate Profile field, select "New Certificate Profile". This will change the

    Authentication Settings window to the Certificate Profile window.

    6. Leave the username field blank.

    7. Leave the domain field blank.

    8. In the Certificate Profile window, complete the required fields.

    9. In the CA Certificates section, select "Add" to import the DOD certificate

    authorities.

    10. Select the Use OCSP checkbox.

    11. When importing the top level DOD CA Certificate, for the Default OCSP URL

    field, add the DOD/DISA OCSP URL.

    12. Select "OK".

    13. Select "OK" again.

    14. Commit changes by selecting "Commit" in the upper-right corner of the screen.

    15. Select "OK" when the confirmation dialog appears.'
  checks:
  - type: manual_review
    info: 'Go to Device >> Certificate Management >> Certificates.

      If no DOD Certification Authority (CA) certificates and subordinate certificates are

      imported, this is a finding.

      Go to Device >> Setup >> Management.

      In the Authentication Settings pane, if the Certificate Profile field is blank, this is a

      finding.

      View the Certificate Profile, if it does not list the DOD CA certificates and subordinate

      certificates, this is a finding.

      If the Use OCSP checkbox is not selected, this is a finding.'
    severity: medium
- id: '1.25'
  title: PANW-NM-000117
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Palo Alto Networks security platform must only allow the use of secure protocols that implement cryptographic
    mechanisms to protect the integrity of maintenance and diagnostic communications for nonlocal maintenance sessions. GROUP
    ID: V-228669 RULE ID: SV-228669r961554'
  rationale: This requires the use of secure protocols instead of their unsecured counterparts, such as SSH instead of telnet,
    SCP instead of FTP, and HTTPS instead of HTTP. Note that HTTP OCSP is permitted to support OCSP where used. If unsecured
    protocols (lacking cryptographic mechanisms) are used for sessions, the contents of those sessions will be susceptible
    to manipulation, potentially allowing alteration and hijacking of maintenance sessions.
  impact: ''
  references: []
