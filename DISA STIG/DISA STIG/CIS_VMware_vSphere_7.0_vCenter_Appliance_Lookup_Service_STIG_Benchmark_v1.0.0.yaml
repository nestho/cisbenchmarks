benchmark:
  id: cis-vmware-vsphere-7-0-vcenter-appliance-lookup-service-stig-benchmark
  title: CIS VMware vSphere 7.0 vCenter Appliance Lookup Service STIG Benchmark
  version: 1.0.0
  technology: DISA STIG
  category: DISA STIG
  os: DISA STIG
  source_pdf: CIS_VMware_vSphere_7.0_vCenter_Appliance_Lookup_Service_STIG_Benchmark_v1.0.0.pdf
  total_pages: 72
  controls_count: 31
controls:
- id: '1.1'
  title: VCLU-70-000001
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Lookup Service must limit the amount of time that each Transport Control Protocol (TCP) connection is kept
    alive. GROUP ID: V-256706 RULE ID: SV-256706r888709'
  rationale: Denial of service (DoS) is one threat against web servers. Many DoS attacks attempt to consume web server resources
    in such a way that no more resources are available to satisfy legitimate requests. In Tomcat, the "connectionTimeout"
    attribute sets the number of milliseconds the server will wait after accepting a connection for the request Uniform Resource
    Identifier (URI) line to be presented. This timeout will also be used when reading the request body (if any). This prevents
    idle sockets that are not sending HTTP requests from consuming system resources and potentially denying new connections.
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --xpath ''/Server/Service/Connector[@port="${biocustom.http.port}"]/@connectionTimeout'' /usr/lib/vmwarelookupsvc/conf/server.xml

    Expected result:

    connectionTimeout="60000"

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-lookupsvc/conf/server.xml

    Configure the <Connector> node with the value:

    connectionTimeout="60000"

    Example:

    <Connector .. connectionTimeout="60000" ..>

    Restart the service with the following command:

    # vmon-cli --restart lookupsvc'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --xpath ''/Server/Service/Connector[@port="${biocustom.http.port}"]/@connectionTimeout'' /usr/lib/vmwarelookupsvc/conf/server.xml

      Expected result:

      connectionTimeout="60000"

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.2'
  title: VCLU-70-000002
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Lookup Service must limit the number of concurrent connections permitted. GROUP ID: V-256707 RULE ID: SV-256707r888712'
  rationale: Resource exhaustion can occur when an unlimited number of concurrent requests are allowed on a website, facilitating
    a denial-of-service attack. Unless the number of requests is controlled, the web server can consume enough system resources
    to cause a system crash. Mitigating this kind of attack will include limiting the number of concurrent HTTP/HTTPS requests.
    Each incoming request requires a thread for the duration of that request. If more simultaneous requests are received than
    can be handled by the currently available request processing threads, additional threads will be created up to the value
    of the "maxThreads" attribute.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --xpath ''/Server/Service/Connector[@port="${biocustom.http.port}"]/@maxThreads'' /usr/lib/vmware-lookupsvc/conf/server.xml

    Expected result:

    XPath set is empty

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-lookupsvc/conf/server.xml

    In the <Connector> node, remove the "maxThreads" key/value pair.

    Restart the service with the following command:

    # vmon-cli --restart lookupsvc'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --xpath ''/Server/Service/Connector[@port="${biocustom.http.port}"]/@maxThreads'' /usr/lib/vmware-lookupsvc/conf/server.xml

      Expected result:

      XPath set is empty

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.3'
  title: VCLU-70-000003
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Lookup Service must limit the maximum size of a POST request. GROUP ID: V-256708 RULE ID: SV-256708r888715'
  rationale: The "maxPostSize" value is the maximum size in bytes of the POST that will be handled by the container FORM URL
    parameter parsing. Limit its size to reduce exposure to a denial-of-service attack. If "maxPostSize" is not set, the default
    value of 2097152 (2MB) is used. Lookup Service is configured in its shipping state to not set a value for "maxPostSize".
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --xpath ''/Server/Service/Connector[@port="${biocustom.http.port}"]/@maxPostSize'' /usr/lib/vmware-lookupsvc/conf/server.xml

    Expected result:

    XPath set is empty

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-lookupsvc/conf/server.xml

    In the <Connector> node, remove the "maxPostSize" key/value pair.

    Restart the service with the following command:

    # vmon-cli --restart lookupsvc'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --xpath ''/Server/Service/Connector[@port="${biocustom.http.port}"]/@maxPostSize'' /usr/lib/vmware-lookupsvc/conf/server.xml

      Expected result:

      XPath set is empty

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.4'
  title: VCLU-70-000004
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Lookup Service must protect cookies from cross-site scripting (XSS). GROUP ID: V-256709 RULE ID: SV-256709r888718'
  rationale: 'Cookies are a common way to save session state over the HTTP(S) protocol. If an attacker can compromise session
    data stored in a cookie, they are better able to launch an attack against the server and its applications. When a cookie
    is tagged with the "HttpOnly" flag, it tells the browser that this particular cookie should only be accessed by the originating
    server. Any attempt to access the cookie from client script is strictly forbidden. Satisfies: SRG-APP-000001-WSR-000002,
    SRG-APP-000223-WSR-000011, SRGAPP-000439-WSR-000154'
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --format /usr/lib/vmware-lookupsvc/conf/context.xml | xmllint --

    xpath ''/Context/@useHttpOnly'' -

    Expected result:

    useHttpOnly="true"

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-lookupsvc/conf/context.xml

    Add the following configuration to the <Context> node:

    useHttpOnly="true"

    Example:

    <Context useHttpOnly="true">

    Restart the service with the following command:

    # vmon-cli --restart lookupsvc'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --format /usr/lib/vmware-lookupsvc/conf/context.xml | xmllint --

      xpath ''/Context/@useHttpOnly'' -

      Expected result:

      useHttpOnly="true"

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.5'
  title: VCLU-70-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Lookup Service must record user access in a format that enables monitoring of remote access. GROUP ID: V-256710
    RULE ID: SV-256710r888721'
  rationale: 'Remote access can be exploited by an attacker to compromise the server. By recording all remote access activities,
    it will be possible to determine the attacker''s location, intent, and degree of success. Tomcat can be configured with
    an "AccessLogValve", a component that can be inserted into the request processing pipeline to provide robust access logging.
    The "AccessLogValve" creates log files in the same format as those created by standard web servers. When "AccessLogValve"
    is properly configured, log files will contain all the forensic information necessary in the case of a security incident.
    Satisfies: SRG-APP-000016-WSR-000005, SRG-APP-000093-WSR-000053, SRGAPP-000095-WSR-000056, SRG-APP-000096-WSR-000057,
    SRG-APP-000097-WSR000058, SRG-APP-000098-WSR-000059, SRG-APP-000098-WSR-000060, SRG-APP000099-WSR-000061, SRG-APP-000100-WSR-000064,
    SRG-APP-000375-WSR000171, SRG-APP-000374-WSR-000172'
  impact: ''
  references: []
  page_start: 19
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --xpath

    ''/Server/Service/Engine/Host/Valve[@className="org.apache.catalina.valves.Acc

    essLogValve"]/@pattern'' /usr/lib/vmware-lookupsvc/conf/server.xml

    Expected result:

    pattern="%t %I [RemoteIP] %{X-Forwarded-For}i %u [Request] %h:%{remote}p to local

    %{local}p - %H %m %U%q [Response] %s - %b bytes [Perf] process %Dms / commit

    %Fms / conn [%X]"

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-lookupsvc/conf/server.xml

    Inside the <Host> node, find the "AccessLogValve" <Valve> node and replace the

    "pattern" element as follows:

    pattern="%t %I [RemoteIP] %{X-Forwarded-For}i %u [Request] %h:%{remote}p to local

    %{local}p - %H %m %U%q [Response] %s - %b bytes [Perf] process %Dms / commit

    %Fms / conn [%X]"

    Restart the service with the following command:

    # vmon-cli --restart lookupsvc'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --xpath

      ''/Server/Service/Engine/Host/Valve[@className="org.apache.catalina.valves.Acc

      essLogValve"]/@pattern'' /usr/lib/vmware-lookupsvc/conf/server.xml

      Expected result:

      pattern="%t %I [RemoteIP] %{X-Forwarded-For}i %u [Request] %h:%{remote}p to local

      %{local}p - %H %m %U%q [Response] %s - %b bytes [Perf] process %Dms / commit

      %Fms / conn [%X]"

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.6'
  title: VCLU-70-000006
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Lookup Service must generate log records for system startup and shutdown. GROUP ID: V-256711 RULE ID: SV-256711r888724'
  rationale: 'Logging must be started as soon as possible when a service starts and when a service is stopped. Many forms
    of suspicious actions can be detected by analyzing logs for unexpected service starts and stops. Also, by starting to
    log immediately after a service starts, it becomes more difficult for suspicious activity to go unlogged. On the vCenter
    Server Appliance (VCSA), the "vmware-vmon" service starts up the Java virtual machines (JVMs) for various vCenter processes,
    including Lookup Service, and the individual json configuration files control the early JVM logging. Ensuring these json
    files are configured correctly enables early Java "stdout" and "stderr" logging. Satisfies: SRG-APP-000089-WSR-000047,
    SRG-APP-000092-WSR-000055'
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'At the command prompt, run the following command:

    # grep StreamRedirectFile /etc/vmware/vmware-vmon/svcCfgfiles/lookupsvc.json

    Expected result:

    "StreamRedirectFile":

    "%VMWARE_LOG_DIR%/vmware/lookupsvc/lookupsvc_stream.log",

    If no log file is specified for the "StreamRedirectFile" setting, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/vmware/vmware-vmon/svcCfgfiles/lookupsvc.json

    Below the last line of the "PreStartCommandArg" block, add or reconfigure the following

    line:

    "StreamRedirectFile":

    "%VMWARE_LOG_DIR%/vmware/lookupsvc/lookupsvc_stream.log",

    Restart the appliance for changes to take effect.'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep StreamRedirectFile /etc/vmware/vmware-vmon/svcCfgfiles/lookupsvc.json

      Expected result:

      "StreamRedirectFile":

      "%VMWARE_LOG_DIR%/vmware/lookupsvc/lookupsvc_stream.log",

      If no log file is specified for the "StreamRedirectFile" setting, this is a finding.'
    severity: medium
- id: '1.7'
  title: VCLU-70-000007
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Lookup Service log files must only be accessible by privileged users. GROUP ID: V-256712 RULE ID: SV-256712r918958'
  rationale: 'Log data is essential in the investigation of events. If log data were to become compromised, competent forensic
    analysis and discovery of the true source of potentially malicious system activity would be difficult, if not impossible,
    to achieve. In addition, access to log records provides information an attacker could use to their advantage because each
    event record might contain communication ports, protocols, services, trust relationships, usernames, etc. The Lookup Service
    restricts all access to log files by default, but this configuration must be verified. Satisfies: SRG-APP-000118-WSR-000068,
    SRG-APP-000119-WSR-000069, SRGAPP-000120-WSR-000070'
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'At the command prompt, run the following command:

    # find /var/log/vmware/lookupsvc -xdev -type f ! -name lookupsvc-init.log -a

    ''('' -perm -o+w -o -not -user lookupsvc -o -not -group lookupsvc '')'' -exec ls

    -ld {} \;

    If any files are returned, this is a finding.

    Note: Prior to Update 3h, the user and group should be root.'
  remediation: 'At the command prompt, run the following commands:

    # chmod o-w /var/log/vmware/lookupsvc/<file>

    # chown lookupsvc:lookupsvc /var/log/vmware/lookupsvc/<file>

    Note: Substitute with the listed file.'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # find /var/log/vmware/lookupsvc -xdev -type f ! -name lookupsvc-init.log -a

      ''('' -perm -o+w -o -not -user lookupsvc -o -not -group lookupsvc '')'' -exec ls

      -ld {} \;

      If any files are returned, this is a finding.

      Note: Prior to Update 3h, the user and group should be root.'
    severity: medium
- id: '1.8'
  title: VCLU-70-000008
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Lookup Service application files must be verified for their integrity. GROUP ID: V-256713 RULE ID: SV-256713r888730'
  rationale: Verifying the Lookup Service application code is unchanged from its shipping state is essential for file validation
    and nonrepudiation of the Lookup Service. There is no reason the MD5 hash of the RPM original files should be changed
    after installation, excluding configuration files.
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'At the command prompt, run the following command:

    If there is any output, this is a finding.'
  remediation: 'Reinstall the vCenter Server Appliance (VCSA) or roll back to a backup. VMware does

    not support modifying the Lookup Service installation files manually.'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      If there is any output, this is a finding.'
    severity: medium
- id: '1.9'
  title: VCLU-70-000009
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Lookup Service must only run one webapp. GROUP ID: V-256714 RULE ID: SV-256714r888733'
  rationale: VMware ships Lookup Service on the vCenter Server Appliance (VCSA) with one webapp. Any other path is potentially
    malicious and must be removed.
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'At the command prompt, run the following command:

    # ls -A /usr/lib/vmware-lookupsvc/webapps/*.war

    Expected result:

    /usr/lib/vmware-lookupsvc/webapps/ROOT.war

    If the output does not match the expected result, this is a finding.'
  remediation: 'For each unexpected directory returned in the check, run the following command:

    # rm /usr/lib/vmware-lookupsvc/webapps/<NAME>

    Restart the service with the following command:

    # vmon-cli --restart lookupsvc'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # ls -A /usr/lib/vmware-lookupsvc/webapps/*.war

      Expected result:

      /usr/lib/vmware-lookupsvc/webapps/ROOT.war

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.10'
  title: VCLU-70-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Lookup Service must not be configured with the "UserDatabaseRealm" enabled. GROUP ID: V-256715 RULE ID: SV-256715r888736'
  rationale: The Lookup Service performs user authentication at the application level and not through Tomcat. By default,
    there is no configuration for the "UserDatabaseRealm" Tomcat authentication mechanism. As part of eliminating unnecessary
    features and to ensure the Lookup Service remains in its shipping state, the lack of a "UserDatabaseRealm" configuration
    must be confirmed.
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'At the command prompt, run the following command:

    # grep UserDatabaseRealm /usr/lib/vmware-lookupsvc/conf/server.xml

    If the command produces any output, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-lookupsvc/conf/server.xml

    Remove all <Realm> nodes.

    Restart the service with the following command:

    # vmon-cli --restart lookupsvc'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep UserDatabaseRealm /usr/lib/vmware-lookupsvc/conf/server.xml

      If the command produces any output, this is a finding.'
    severity: medium
- id: '1.11'
  title: VCLU-70-000011
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Lookup Service must be configured to limit access to internal packages. GROUP ID: V-256716 RULE ID: SV-256716r888739'
  rationale: The "package.access" entry in the "catalina.properties" file implements access control at the package level.
    When properly configured, a Security Exception will be reported if an errant or malicious webapp attempts to access the
    listed internal classes directly or if a new class is defined under the protected packages. The Lookup Service comes preconfigured
    with the appropriate packages defined in "package.access", and this configuration must be maintained.
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'At the command prompt, run the following command:

    # grep "package.access" /usr/lib/vmware-lookupsvc/conf/catalina.properties

    Expected result:

    package.access=sun.,org.apache.catalina.,org.apache.coyote.,org.apache.tomcat.,org.

    apache.jasper.

    If the output of the command does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-sso/vmware-sts/conf/catalina.properties

    Ensure the "package.access" line is configured as follows:

    package.access=sun.,org.apache.catalina.,org.apache.coyote.,org.apache.tomcat.,org.

    apache.jasper.

    Restart the service with the following command:

    # vmon-cli --restart lookupsvc'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep "package.access" /usr/lib/vmware-lookupsvc/conf/catalina.properties

      Expected result:

      package.access=sun.,org.apache.catalina.,org.apache.coyote.,org.apache.tomcat.,org.

      apache.jasper.

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.12'
  title: VCLU-70-000012
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Lookup Service must have Multipurpose Internet Mail Extensions (MIMEs) that invoke operating system shell
    programs disabled. GROUP ID: V-256717 RULE ID: SV-256717r888742'
  rationale: MIME mappings tell the Lookup Service what type of program various file types and extensions are and what external
    utilities or programs are needed to execute the file type. By ensuring that various shell script MIME types are not included
    in "web.xml", the server is protected against malicious users tricking the server into executing shell command files.
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'At the command prompt, run the following command:

    # grep -En ''(x-csh<)|(x-sh<)|(x-shar<)|(x-ksh<)'' /usr/lib/vmwarelookupsvc/conf/web.xml

    If the command produces any output, this is a finding.'
  remediation: "Navigate to and open:\n/usr/lib/vmware-lookupsvc/conf/web.xml\nRemove all of the following nodes lines:\n\
    <mime-type>application/x-csh</mime-type>\n<mime-type>application/x-shar</mime-type>\n<mime-type>application/x-sh</mime-type>\n\
    <mime-type>application/x-ksh</mime-type>\nRestart the service with the following command:\n# vmon-cli --restart lookupsvc\n\
    Note: Delete the entire mime-mapping node for the target mime-type.\nExample:\n<mime-mapping>\n <extension>sh</extension>\n\
    \ <mime-type>application/x-sh</mime-type>\n</mime-mapping>"
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep -En ''(x-csh<)|(x-sh<)|(x-shar<)|(x-ksh<)'' /usr/lib/vmwarelookupsvc/conf/web.xml

      If the command produces any output, this is a finding.'
    severity: medium
- id: '1.13'
  title: VCLU-70-000013
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Lookup Service must have mappings set for Java servlet pages. GROUP ID: V-256718 RULE ID: SV-256718r888745'
  rationale: Resource mapping is the process of tying a particular file type to a process in the web server that can serve
    that type of file to a requesting client and identify which file types are not to be delivered to a client. By not specifying
    which files can and cannot be served to a user, the web server could deliver to a user web server configuration files,
    log files, password files, etc. Because Tomcat is a Java-based web server, the main file extension used is *.jsp. This
    check ensures the *.jsp and *.jspx file types has been properly mapped to servlets.
  impact: ''
  references: []
  page_start: 33
  audit_raw: "At the command prompt, run the following command:\n# xmllint --format /usr/lib/vmware-lookupsvc/conf/web.xml\
    \ | sed\n's/xmlns=\".*\"//g' | xmllint --xpath '/web-app/servlet-mapping/servletname[text()=\"jsp\"]/parent::servlet-mapping'\
    \ -\nExpected result:\n<servlet-mapping>\n <servlet-name>jsp</servlet-name>\n <url-pattern>*.jsp</url-pattern>\n <url-pattern>*.jspx</url-pattern>\n\
    </servlet-mapping>\nIf the .jsp and .jspx file url-patterns are not configured as in the expected result, this is a\n\
    finding."
  remediation: "Navigate to and open:\n/usr/lib/vmware-lookupsvc/conf/web.xml\nNavigate to and locate the mapping for the\
    \ JSP servlet. It is the <servlet-mapping>\nnode that contains <servlet-name>jsp</servlet-name>.\nConfigure the node to\
    \ look like the code snippet below:\n<!-- The mappings for the JSP servlet -->\n<servlet-mapping>\n <servlet-name>jsp</servlet-name>\n\
    \ <url-pattern>*.jsp</url-pattern>\n <url-pattern>*.jspx</url-pattern>\n</servlet-mapping>\nRestart the service with the\
    \ following command:\n# vmon-cli --restart lookupsvc"
  checks:
  - type: manual_review
    info: "At the command prompt, run the following command:\n# xmllint --format /usr/lib/vmware-lookupsvc/conf/web.xml |\
      \ sed\n's/xmlns=\".*\"//g' | xmllint --xpath '/web-app/servlet-mapping/servletname[text()=\"jsp\"]/parent::servlet-mapping'\
      \ -\nExpected result:\n<servlet-mapping>\n <servlet-name>jsp</servlet-name>\n <url-pattern>*.jsp</url-pattern>\n <url-pattern>*.jspx</url-pattern>\n\
      </servlet-mapping>\nIf the .jsp and .jspx file url-patterns are not configured as in the expected result, this is a\n\
      finding."
    severity: medium
- id: '1.14'
  title: VCLU-70-000014
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Lookup Service must not have the Web Distributed Authoring (WebDAV) servlet installed. GROUP ID: V-256719
    RULE ID: SV-256719r888748'
  rationale: WebDAV is an extension to the HTTP protocol that, when developed, was meant to allow users to create, change,
    and move documents on a server, typically a web server or web share. WebDAV is not widely used and has serious security
    concerns because it may allow clients to modify unauthorized files on the web server and must therefore be disabled. Tomcat
    uses the "org.apache.catalina.servlets.WebdavServlet" servlet to provide WebDAV services. Because the WebDAV service has
    been found to have an excessive number of vulnerabilities, this servlet must not be installed. Lookup Service does not
    configure WebDAV by default.
  impact: ''
  references: []
  page_start: 35
  audit_raw: 'At the command prompt, run the following command:

    # grep -n ''webdav'' /usr/lib/vmware-lookupsvc/conf/web.xml

    If the command produces any output, this is a finding.'
  remediation: 'Navigate to and open:

