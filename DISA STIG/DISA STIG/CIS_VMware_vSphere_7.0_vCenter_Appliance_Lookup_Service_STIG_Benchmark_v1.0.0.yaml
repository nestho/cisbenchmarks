- id: '1.29'
  title: VCLU-70-000029
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Lookup Service must be configured with the appropriate ports. GROUP ID: V-256734 RULE ID: SV-256734r888793'
  rationale: Web servers provide numerous processes, features, and functionalities that use TCP/IP ports. Some of these processes
    may be deemed unnecessary or too unsecure to run on a production system. The ports that Lookup Service listens on are
    configured in the "catalina.properties" file and must be verified as accurate to their shipping state.
  impact: ''
  references: []
  page_start: 65
  audit_raw: 'At the command prompt, run the following command:

    # grep ''\.port'' /usr/lib/vmware-lookupsvc/conf/catalina.properties

    Expected result:

    base.shutdown.port=-1

    base.jmx.port=-1

    bio-custom.http.port=7090

    bio-custom.https.port=8443

    If the output of the command does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-lookupsvc/conf/catalina.properties

    Navigate to the port''s specification section.

    Set the Lookup Service port specifications according to the shipping configuration

    below:

    base.shutdown.port=-1

    base.jmx.port=-1

    bio-custom.http.port=7090

    bio-custom.https.port=8443

    Restart the service with the following command:

    # vmon-cli --restart lookupsvc'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # grep ''\.port'' /usr/lib/vmware-lookupsvc/conf/catalina.properties

      Expected result:

      base.shutdown.port=-1

      base.jmx.port=-1

      bio-custom.http.port=7090

      bio-custom.https.port=8443

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
- id: '1.30'
  title: VCLU-70-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Lookup Service must disable the shutdown port. GROUP ID: V-256735 RULE ID: SV-256735r888796'
  rationale: An attacker has at least two reasons to stop a web server. The first is to cause a denial of service, and the
    second is to put in place changes the attacker made to the web server configuration. If the Tomcat shutdown port feature
    is enabled, a shutdown signal can be sent to the Lookup Service through this port. To ensure availability, the shutdown
    port must be disabled.
  impact: ''
  references: []
  page_start: 67
  audit_raw: 'At the command prompt, run the following commands:

    # xmllint --xpath ''/Server/@port'' /usr/lib/vmware-lookupsvc/conf/server.xml

    Expected result:

    port="${base.shutdown.port}"

    If the output does not match the expected result, this is a finding.'
  remediation: 'Navigate to and open:

    /usr/lib/vmware-lookupsvc/conf/server.xml

    Ensure the server port is set as follows:

    Restart the service with the following command:

    # vmon-cli --restart lookupsvc'
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following commands:

      # xmllint --xpath ''/Server/@port'' /usr/lib/vmware-lookupsvc/conf/server.xml

      Expected result:

      port="${base.shutdown.port}"

      If the output does not match the expected result, this is a finding.'
    severity: medium
- id: '1.31'
  title: VCLU-70-000031
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Lookup Service must set the secure flag for cookies. GROUP ID: V-256736 RULE ID: SV-256736r888799'
  rationale: The secure flag is an option that can be set by the application server when sending a new cookie to the user
    within an HTTP Response. The purpose of the secure flag is to prevent cookies from being observed by unauthorized parties
    due to the transmission of the cookie in clear text. By setting the secure flag, the browser will prevent the transmission
    of a cookie over an unencrypted channel. Lookup Service is configured to only be accessible over a Transport Layer Security
    (TLS) tunnel, but this cookie flag is still a recommended best practice.
  impact: ''
  references: []
  page_start: 68
  audit_raw: 'At the command prompt, run the following command:

    # xmllint --format /usr/lib/vmware-lookupsvc/conf/web.xml | sed

    ''s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/session-config/cookieconfig/secure'' -

    Expected result:

    <secure>true</secure>

    If the output of the command does not match the expected result, this is a finding.'
  remediation: "Navigate to and open:\n/usr/lib/vmware-lookupsvc/conf/web.xml\nNavigate to the /<web-apps>/<session-config>/<cookie-config>\
    \ node and\nconfigure it as follows:\n <cookie-config>\n <http-only>true</http-only>\n <secure>true</secure>\n </cookie-config>\n\
    Restart the service with the following command:\n# vmon-cli --restart lookupsvc"
  checks:
  - type: manual_review
    info: 'At the command prompt, run the following command:

      # xmllint --format /usr/lib/vmware-lookupsvc/conf/web.xml | sed

      ''s/xmlns=".*"//g'' | xmllint --xpath ''/web-app/session-config/cookieconfig/secure'' -

      Expected result:

      <secure>true</secure>

      If the output of the command does not match the expected result, this is a finding.'
    severity: medium
