    If the "fs.protected_hardlinks" kernel parameter is not set to "1", this is a finding.'
  remediation: 'Navigate to and open:

    /etc/sysctl.d/zz-stig-hardening.conf

    Add or update the following line:

    fs.protected_hardlinks = 1

    At the command line, run the following command to load the new configuration:

    /sbin/sysctl --load /etc/sysctl.d/zz-stig-hardening.conf

    Note: If the file zz-stig-hardening.conf does not exist, it must be created.'
  checks:
  - type: manual_review
    info: 'At the command line, run the following command to verify hardlink protection is enabled:

      /sbin/sysctl fs.protected_hardlinks

      Example result:

      fs.protected_hardlinks = 1

