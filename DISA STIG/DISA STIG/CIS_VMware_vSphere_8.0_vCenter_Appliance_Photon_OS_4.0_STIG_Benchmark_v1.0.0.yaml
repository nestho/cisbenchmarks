    ID: SV-258858r958388'
  rationale: By limiting the number of failed logon attempts, the risk of unauthorized system access via user password guessing,
    otherwise known as brute-force attacks, is reduced. Limits are imposed by locking the account. This module maintains a
    list of failed authentication attempts per user during a specified interval and locks the account in case there were more
    than deny consecutive failed authentications.
