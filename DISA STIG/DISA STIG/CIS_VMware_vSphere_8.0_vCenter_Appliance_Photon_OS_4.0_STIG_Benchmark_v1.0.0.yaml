  description: 'The Photon operating system must implement NIST FIPS-validated cryptography for the following: to provision
    digital signatures, to generate cryptographic hashes, and to protect unclassified information requiring confidentiality
    and cryptographic protection in accordance with applicable federal laws, Executive Orders, directives, policies, regulations,
    and standards. GROUP ID: V-258852 RULE ID: SV-258852r959006'
  rationale: 'Use of weak or untested encryption algorithms undermines the purposes of utilizing encryption to protect data.
    The operating system must implement cryptographic modules adhering to the higher standards approved by the federal government
    since this provides assurance they have been tested and validated. Satisfies: SRG-OS-000478-GPOS-00223, SRG-OS-000396-GPOS-00176'
  impact: ''
  references: []
  page_start: 106
  audit_raw: 'At the command line, run the following command to verify FIPS is enabled for the OS:

    cat /proc/sys/crypto/fips_enabled

    Example result:

    1

    If "fips_enabled" is not set to "1", this is a finding.'
  remediation: 'Navigate to and open:

    /boot/grub2/grub.cfg

    Locate the boot command line arguments. An example follows:

    linux /boot/$photon_linux root=$rootpartition $photon_cmdline $systemd_cmdline

