- id: '1.98'
  title: PHTN-40-000236
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must disable systemd fallback DNS. GROUP ID: V-258898 RULE ID: SV-258898r991589'
  rationale: Systemd contains an ability to set fallback DNS servers, which is used for DNS lookups in the event no system
    level DNS servers are configured or other DNS servers are specified in the Systemd resolved.conf file. If uncommented,
    this configuration contains Google DNS servers by default and could result in DNS leaking info unknowingly in the event
    DNS is absent or misconfigured at the system level.
  impact: ''
  references: []
  page_start: 192
  audit_raw: 'At the command line, run the following command to verify systemd fallback DNS is

    disabled:

    resolvectl status | grep ''^Fallback DNS''

    If the output indicates that Fallback DNS servers are configured, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/systemd/resolved.conf

    Add or update the "FallbackDNS" entry to the following:

    FallbackDNS=

    Restart the Systemd resolved service by running the following command:

    systemctl restart systemd-resolved

    Note: If this option is not given, a compiled-in list of DNS servers is used instead, which

    is undesirable.'
  checks:
  - type: command
    command: resolvectl status | grep '^Fallback DNS'
    expected: ''
    severity: medium
    info: 'At the command line, run the following command to verify systemd fallback DNS is

      disabled:

      resolvectl status | grep ''^Fallback DNS''

      If the output indicates that Fallback DNS servers are configured, this is a finding.'
