- id: '1.48'
  title: PHTN-40-000160
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must implement address space layout randomization to protect its memory from unauthorized
    code execution. GROUP ID: V-258848 RULE ID: SV-258848r958928'
  rationale: Some adversaries launch attacks with the intent of executing code in nonexecutable regions of memory or in memory
    locations that are prohibited. Security safeguards employed to protect memory include, for example, data execution prevention
    and address space layout randomization. Data execution prevention safeguards can either be hardware-enforced or software-enforced
    with hardware providing the greater strength of mechanism. Examples of attacks are buffer overflow attacks.
  impact: ''
  references: []
  page_start: 101
  audit_raw: 'At the command line, run the following command to verify address space layout

    randomization is enabled:

    cat /proc/sys/kernel/randomize_va_space

    If the value of "randomize_va_space" is not "2", this is a finding.'
  remediation: 'Navigate to and open:

    /etc/sysctl.d/zz-stig-hardening.conf

    Add or update the following line:

    kernel.randomize_va_space=2

    At the command line, run the following command to load the new configuration:

    /sbin/sysctl --load /etc/sysctl.d/zz-stig-hardening.conf

    Note: If the file zz-stig-hardening.conf does not exist, it must be created.'
  checks:
  - type: command
    command: cat /proc/sys/kernel/randomize_va_space
    expected: ''
    severity: medium
    info: 'At the command line, run the following command to verify address space layout

      randomization is enabled:

      cat /proc/sys/kernel/randomize_va_space

      If the value of "randomize_va_space" is not "2", this is a finding.'
