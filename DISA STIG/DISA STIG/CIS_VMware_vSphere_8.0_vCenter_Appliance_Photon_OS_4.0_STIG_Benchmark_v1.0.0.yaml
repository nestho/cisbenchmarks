  rationale: By enabling the fs.protected_hardlinks kernel parameter, users can no longer create soft or hard links to files
    they do not own. Disallowing such hardlinks mitigate vulnerabilities based on insecure file system accessed by privileged
    programs, avoiding an exploitation vector exploiting unsafe use of open() or creat().
