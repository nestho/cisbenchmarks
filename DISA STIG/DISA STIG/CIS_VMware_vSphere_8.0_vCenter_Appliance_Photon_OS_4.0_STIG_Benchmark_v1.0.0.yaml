- id: '1.29'
  title: PHTN-40-000068
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must be configured to use TCP syncookies. GROUP ID: V-258829 RULE ID: SV-258829r958528'
  rationale: 'A TCP SYN flood attack can cause a Denial of Service (DOS) by filling a system''s TCP connection table with
    connections in the SYN_RCVD state. Syncookies can be used to track a connection when a subsequent ACK is received, verifying
    the initiator is attempting a valid connection and is not a flood source. This feature is activated when a flood condition
    is detected and enables the system to continue servicing valid connection requests. Satisfies: SRG-OS-000142-GPOS-00071,
    SRG-OS-000420-GPOS-00186'
  impact: ''
  references: []
