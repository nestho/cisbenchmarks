- id: '1.12'
  title: PHTN-40-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must allow only authorized users to configure the auditd service. GROUP ID: V-258812
    RULE ID: SV-258812r958444'
  rationale: Without the capability to restrict which roles and individuals can select which events are audited, unauthorized
    personnel may be able to prevent the auditing of critical events. Misconfigured audits may degrade the system's performance
    by overwhelming the audit log. Misconfigured audits may also make it more difficult to establish, correlate, and investigate
    the events relating to an incident or identify those responsible for one.
  impact: ''
  references: []
  page_start: 36
  audit_raw: 'At the command line, run the following command to verify permissions on auditd

    configuration and rules files:

    find /etc/audit/* -type f -exec stat -c "%n %U:%G %a" {} $1;

    If any files are returned with permissions more permissive than "0640", this is a finding.

    If any files are returned not owned by root, this is a finding. If any files are returned not

    group owned by root, this is a finding.'
  remediation: 'At the command line, run the following commands:

    chmod 0640 chown root:root

    Replace with the target file.'
  checks:
  - type: command
    command: find /etc/audit/* -type f -exec stat -c "%n %U:%G %a" {} $1;
    expected: ''
    severity: medium
    info: 'At the command line, run the following command to verify permissions on auditd

      configuration and rules files:

      find /etc/audit/* -type f -exec stat -c "%n %U:%G %a" {} $1;

      If any files are returned with permissions more permissive than "0640", this is a finding.

      If any files are returned not owned by root, this is a finding. If any files are returned not

      group owned by root, this is a finding.'
- id: '1.13'
  title: PHTN-40-000031
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must generate audit records when successful/unsuccessful attempts to access privileges
    occur. GROUP ID: V-258813 RULE ID: SV-258813r958446'
  rationale: 'The changing of file permissions could indicate that a user is attempting to gain access to information that
    would otherwise be disallowed. Auditing DAC modifications can facilitate the identification of patterns of abuse among
    both authorized and unauthorized users. Satisfies: SRG-OS-000064-GPOS-00033, SRG-OS-000462-GPOS-00206, SRG-OS000466-GPOS-00210,
    SRG-OS-000468-GPOS-00212, SRG-OS-000474-GPOS-00219'
  impact: ''
  references: []
  page_start: 37
  audit_raw: 'At the command line, run the following command to verify an audit rule exists to audit

    account creations:

    auditctl -l | grep chmod

    Expected result:

    -a always,exit -F arch=b64 -S

    chmod,fchmod,chown,fchown,lchown,setxattr,lsetxattr,fsetxattr,removexattr,lremovexatt

    r,fremovexattr,fchownat,fchmodat -F auid>=1000 -F auid!=-1 -F key=perm_mod -a

    always,exit -F arch=b64 -S

    chmod,fchmod,chown,fchown,lchown,setxattr,lsetxattr,fsetxattr,removexattr,lremovexatt

    r,fremovexattr,fchownat,fchmodat -F auid=0 -F key=perm_mod -a always,exit -F

    arch=b32 -S

    chmod,lchown,fchmod,fchown,chown,setxattr,lsetxattr,fsetxattr,removexattr,lremovexatt

    r,fremovexattr,fchownat,fchmodat -F auid>=1000 -F auid!=-1 -F key=perm_mod -a

    always,exit -F arch=b32 -S

    chmod,lchown,fchmod,fchown,chown,setxattr,lsetxattr,fsetxattr,removexattr,lremovexatt

    r,fremovexattr,fchownat,fchmodat -F auid=0 -F key=perm_mod

    If the output does not match the expected result, this is a finding.

    Note: This check depends on the "auditd" service to be in a running state for accurate

    results. The "auditd" service is enabled in control PHTN-40-000016.

    Note: auid!=-1, auid!=4294967295, auid!=unset are functionally equivalent in this check

    and the output of the above commands may be displayed in either format.'
  remediation: 'Navigate to and open:

    /etc/audit/rules.d/audit.STIG.rules

    Add or update the following lines:

    -a always,exit -F arch=b64 -S

    chmod,fchmod,chown,fchown,lchown,setxattr,lsetxattr,fsetxattr,removexattr,lremovexatt

    r,fremovexattr,fchownat,fchmodat -F auid>=1000 -F auid!=unset -F key=perm_mod -a

    always,exit -F arch=b64 -S

    chmod,fchmod,chown,fchown,lchown,setxattr,lsetxattr,fsetxattr,removexattr,lremovexatt

    r,fremovexattr,fchownat,fchmodat -F auid=0 -F key=perm_mod -a always,exit -F

    arch=b32 -S

    chmod,lchown,fchmod,fchown,chown,setxattr,lsetxattr,fsetxattr,removexattr,lremovexatt

    r,fremovexattr,fchownat,fchmodat -F auid>=1000 -F auid!=unset -F key=perm_mod -a

    always,exit -F arch=b32 -S

    chmod,lchown,fchmod,fchown,chown,setxattr,lsetxattr,fsetxattr,removexattr,lremovexatt

    r,fremovexattr,fchownat,fchmodat -F auid=0 -F key=perm_mod

    At the command line, run the following command to load the new audit rules:

    /sbin/augenrules --load

    Note: An "audit.STIG.rules" file is provided with this guidance for placement in

    "/etc/audit/rules.d" that contains all rules needed for auditd.

    Note: An older "audit.STIG.rules" may exist and may reference older "GEN" SRG IDs.

    This file can be removed and replaced as necessary with an updated one.'
  checks:
  - type: command
    command: auditctl -l | grep chmod
    expected: ''
    severity: medium
    info: 'At the command line, run the following command to verify an audit rule exists to audit

      account creations:

      auditctl -l | grep chmod

      Expected result:

      -a always,exit -F arch=b64 -S

      chmod,fchmod,chown,fchown,lchown,setxattr,lsetxattr,fsetxattr,removexattr,lremovexatt

      r,fremovexattr,fchownat,fchmodat -F auid>=1000 -F auid!=-1 -F key=perm_mod -a

      always,exit -F arch=b64 -S

      chmod,fchmod,chown,fchown,lchow'
- id: '1.14'
  title: PHTN-40-000035
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must enforce password complexity by requiring that at least one uppercase character
    be used. GROUP ID: V-258814 RULE ID: SV-258814r1003629'
  rationale: Use of a complex password helps to increase the time and resources required to compromise the password. Password
    complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force
    attacks. Password complexity is one factor of several that determines how long it takes to crack a password. The more
    complex the password, the greater the number of possible combinations that need to be tested before the password is compromised.
  impact: ''
  references: []
  page_start: 39
  audit_raw: 'At the command line, run the following command to verify at least one uppercase

    character be used:

    grep ''^password.*pam_pwquality.so'' /etc/pam.d/system-password

    Example result:

    password requisite pam_pwquality.so dcredit=-1 ucredit=-1 lcredit=-1 ocredit=-1

    minlen=15 difok=8 enforce_for_root dictcheck=1

    If the "ucredit" option is not < 0, is missing or commented out, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/pam.d/system-password

    Configure the pam_pwquality.so line to have the "ucredit" option set to "-1" as follows:

    password requisite pam_pwquality.so dcredit=-1 ucredit=-1 lcredit=-1 ocredit=-1

    minlen=15 difok=8 enforce_for_root dictcheck=1

    Note: On vCenter appliances, the equivalent file must be edited under

    "/etc/applmgmt/appliance", if one exists, for the changes to persist after a reboot.'
  checks:
  - type: command
    command: grep '^password.*pam_pwquality.so' /etc/pam.d/system-password
    expected: ''
    severity: medium
    info: 'At the command line, run the following command to verify at least one uppercase

      character be used:

      grep ''^password.*pam_pwquality.so'' /etc/pam.d/system-password

      Example result:

      password requisite pam_pwquality.so dcredit=-1 ucredit=-1 lcredit=-1 ocredit=-1

      minlen=15 difok=8 enforce_for_root dictcheck=1

      If the "ucredit" option is not < 0, is missing or commented out, this is a finding.'
