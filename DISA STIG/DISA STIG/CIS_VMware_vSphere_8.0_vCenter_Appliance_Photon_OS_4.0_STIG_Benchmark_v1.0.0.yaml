controls:
- id: '1.1'
  title: PHTN-40-000003
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must audit all account creations. GROUP ID: V-258801 RULE ID: SV-258801r958368'
  rationale: 'Once an attacker establishes access to a system, the attacker often attempts to create a persistent method of
    reestablishing access. One way to accomplish this is for the attacker to create an account. Auditing account creation
    actions provides logging that can be used for forensic purposes. Satisfies: SRG-OS-000004-GPOS-00004, SRG-OS-000476-GPOS-00221'
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'At the command line, run the following command to verify an audit rule exists to audit

    account creations:

    auditctl -l | grep -E "(useradd|groupadd)"

    Example result:

    -w /usr/sbin/useradd -p x -k useradd -w /usr/sbin/groupadd -p x -k groupadd

    If either "useradd" or "groupadd" are not listed with a permissions filter of at least "x",

    this is a finding.

    Note: This check depends on the "auditd" service to be in a running state for accurate

    results. The "auditd" service is enabled in control PHTN-40-000016.'
  remediation: 'Navigate to and open:

    /etc/audit/rules.d/audit.STIG.rules

    Add or update the following lines:

    -w /usr/sbin/useradd -p x -k useradd -w /usr/sbin/groupadd -p x -k groupadd

    At the command line, run the following command to load the new audit rules:

    /sbin/augenrules --load

    Note: An "audit.STIG.rules" file is provided with this guidance for placement in

    "/etc/audit/rules.d" that contains all rules needed for auditd.

    Note: An older "audit.STIG.rules" may exist and may reference older "GEN" SRG IDs.

    This file can be removed and replaced as necessary with an updated one.'
  checks:
  - type: command
    command: auditctl -l | grep -E "(useradd|groupadd)"
    expected: ''
    severity: medium
    info: 'At the command line, run the following command to verify an audit rule exists to audit

      account creations:

      auditctl -l | grep -E "(useradd|groupadd)"

      Example result:

      -w /usr/sbin/useradd -p x -k useradd -w /usr/sbin/groupadd -p x -k groupadd

      If either "useradd" or "groupadd" are not listed with a permissions filter of at least "x",

      this is a finding.

      Note: This check depends on the "auditd" service'
- id: '1.2'
  title: PHTN-40-000004
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must enforce the limit of three consecutive invalid logon attempts by a user during
    a 15-minute time period. GROUP ID: V-258802 RULE ID: SV-258802r958388'
  rationale: By limiting the number of failed logon attempts, the risk of unauthorized system access via user password guessing,
    otherwise known as brute-force attacks, is reduced. Limits are imposed by locking the account.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'At the command line, run the following commands to verify accounts are locked after

    three consecutive invalid logon attempts by a user during a 15-minute time period:

    grep ''^deny ='' /etc/security/faillock.conf

    Example result:

    deny = 3

    If the "deny" option is not set to "3" or less (but not "0"), is missing or commented out,

    this is a finding.

    grep ''^fail_interval ='' /etc/security/faillock.conf

    Example result:

    fail_interval = 900

    If the "fail_interval" option is not set to "900" or more, is missing or commented out, this

    is a finding.

    Note: If faillock.conf is not used to configure the "pam_faillock.so" module, then these

    options may be specified on the faillock lines in the system-auth and system-account

    PAM files.'
  remediation: 'Navigate to and open:

    /etc/security/faillock.conf

    Add or update the following lines:

    deny = 3 fail_interval = 900

    Note: On vCenter appliances, the equivalent file must be edited under

    "/etc/applmgmt/appliance", if one exists, for the changes to persist after a reboot.'
  checks:
  - type: command
    command: grep '^deny =' /etc/security/faillock.conf && grep '^fail_interval =' /etc/security/faillock.conf
    expected: ''
    severity: medium
    info: 'At the command line, run the following commands to verify accounts are locked after

      three consecutive invalid logon attempts by a user during a 15-minute time period:

      grep ''^deny ='' /etc/security/faillock.conf

      Example result:

      deny = 3

      If the "deny" option is not set to "3" or less (but not "0"), is missing or commented out,

      this is a finding.

      grep ''^fail_interval ='' /etc/security/faillock.conf

      Exa'
- id: '1.3'
  title: PHTN-40-000007
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Photon operating system must limit the number of concurrent sessions to ten for all accounts and/or account
    types. GROUP ID: V-258804 RULE ID: SV-258804r958398'
  rationale: Operating system management includes the ability to control the number of users and user sessions that utilize
    an operating system. Limiting the number of allowed users and sessions per user is helpful in reducing the risks related
    to Denial of Service (DoS) attacks. This requirement addresses concurrent sessions for information system accounts and
    does not address concurrent sessions by single users via multiple system accounts. The maximum number of concurrent sessions
    should be defined based upon mission needs and the operational environment for each system.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'At the command line, run the following command to verify the limit for the number of

    concurrent sessions:

    grep "^[^].maxlogins." /etc/security/limits.conf

    Example result:

    • hard maxlogins 10

    •

    If "* hard maxlogins" is not configured to "10", this is a finding.

    Note: The expected result may be repeated multiple times.'
  remediation: 'Navigate to and open:

    /etc/security/limits.conf

    Add or update the following line:

    • hard maxlogins 10

    •'
  checks:
  - type: command
    command: grep "^[^].maxlogins." /etc/security/limits.conf
    expected: ''
    severity: medium
    info: 'At the command line, run the following command to verify the limit for the number of

      concurrent sessions:

      grep "^[^].maxlogins." /etc/security/limits.conf

      Example result:

      • hard maxlogins 10

      •

      If "* hard maxlogins" is not configured to "10", this is a finding.

      Note: The expected result may be repeated multiple times.'
- id: '1.4'
  title: PHTN-40-000005
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must display the Standard Mandatory DOD Notice and Consent Banner before granting
    local or remote access to the system. GROUP ID: V-258803 RULE ID: SV-258803r958390'
  rationale: 'Display of a standardized and approved use notification before granting access to the operating system ensures
    privacy and security notification verbiage used is consistent with applicable federal laws, Executive Orders, directives,
    policies, regulations, standards, and guidance. System use notifications are required only for access via logon interfaces
    with human users and are not required when such human interfaces do not exist. The banner must be formatted in accordance
    with applicable DOD policy. Use the following verbiage for operating systems that can accommodate banners of 1300 characters:
    "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only. By using
    this IS (which includes any device attached to this IS), you consent to the following conditions: -The USG routinely intercepts
    and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring,
    network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.
    -At any time, the USG may inspect and seize data stored on this IS. -Communications using, or data stored on, this IS
    are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USGauthorized
    purpose. -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not
    for your personal benefit or privacy. -Notwithstanding the above, using this IS does not constitute consent to PM, LE
    or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal
    representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work
    product are private and confidential. See User Agreement for details." Use the following verbiage for operating systems
    that have severe limitations on the number of characters that can be displayed in the banner: "I''ve read & consent to
    terms in IS user agreem''t." Satisfies: SRG-OS-000023-GPOS-00006, SRG-OS-000228-GPOS-00088'
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'At the command line, run the following command to verify SSH is configured to use the

    /etc/issue file for a banner:

    sshd -T|&grep -i Banner

    Example result:

    banner /etc/issue

    If the "banner" setting is not configured to "/etc/issue", this is a finding.

    Next, open /etc/issue with a text editor.

    If the file does not contain the Standard Mandatory DOD Notice and Consent Banner,

    this is a finding.

    Standard Mandatory DOD Notice and Consent Banner:

    "You are accessing a U.S. Government (USG) Information System (IS) that is provided

    for USG-authorized use only. By using this IS (which includes any device attached to

    this IS), you consent to the following conditions: -The USG routinely intercepts and

    monitors communications on this IS for purposes including, but not limited to,

    penetration testing, COMSEC monitoring, network operations and defense, personnel

    misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations. -At

    any time, the USG may inspect and seize data stored on this IS. -Communications

    using, or data stored on, this IS are not private, are subject to routine monitoring,

    interception, and search, and may be disclosed or used for any USG authorized

    purpose. -This IS includes security measures (e.g., authentication and access controls)

    to protect USG interests--not for your personal benefit or privacy. -Notwithstanding the

    above, using this IS does not constitute consent to PM, LE or CI investigative searching

    or monitoring of the content of privileged communications, or work product, related to

    personal representation or services by attorneys, psychotherapists, or clergy, and their

    assistants. Such communications and work product are private and confidential. See

    User Agreement for details."'
  remediation: 'Navigate to and open:

    /etc/ssh/sshd_config

    Ensure the "Banner" line is uncommented and set to the following:

    Banner /etc/issue

    Navigate to and open:

    /etc/issue

    Ensure the file contains the Standard Mandatory DOD Notice and Consent Banner.

    "You are accessing a U.S. Government (USG) Information System (IS) that is provided

    for USG-authorized use only. By using this IS (which includes any device attached to

    this IS), you consent to the following conditions: -The USG routinely intercepts and

    monitors communications on this IS for purposes including, but not limited to,

    penetration testing, COMSEC monitoring, network operations and defense, personnel

    misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations. -At

    any time, the USG may inspect and seize data stored on this IS. -Communications

    using, or data stored on, this IS are not private, are subject to routine monitoring,

    interception, and search, and may be disclosed or used for any USG authorized

    purpose. -This IS includes security measures (e.g., authentication and access controls)

    to protect USG interests--not for your personal benefit or privacy. -Notwithstanding the

    above, using this IS does not constitute consent to PM, LE or CI investigative searching

    or monitoring of the content of privileged communications, or work product, related to

    personal representation or services by attorneys, psychotherapists, or clergy, and their

    assistants. Such communications and work product are private and confidential. See

    User Agreement for details."

    At the command line, run the following command:

    systemctl restart sshd.service'
  checks:
  - type: command
    command: sshd -T|&grep -i Banner
    expected: ''
    severity: medium
    info: 'At the command line, run the following command to verify SSH is configured to use the

      /etc/issue file for a banner:

      sshd -T|&grep -i Banner

      Example result:

      banner /etc/issue

      If the "banner" setting is not configured to "/etc/issue", this is a finding.

      Next, open /etc/issue with a text editor.

      If the file does not contain the Standard Mandatory DOD Notice and Consent Banner,

      this is a finding.

      Stan'
- id: '1.5'
  title: PHTN-40-000012
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must monitor remote access logins. GROUP ID: V-258805 RULE ID: SV-258805r958406'
  rationale: Remote access services, such as those providing remote access to network devices and information systems, which
    lack automated monitoring capabilities, increase risk and make remote user access management difficult at best. Remote
    access is access to DOD nonpublic information systems by an authorized user (or an information system) communicating through
    an external, nonorganization-controlled network. Remote access methods include, for example, dial-up, broadband, and wireless.
    Automated monitoring of remote access sessions allows organizations to detect cyberattacks and also ensure ongoing compliance
    with remote access policies by auditing connection activities of remote access capabilities, such as Remote Desktop Protocol
    (RDP), on a variety of information system components (e.g., servers, workstations, notebook computers, smartphones, and
    tablets).
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'If another package is used to offload logs, such as syslog-ng, and is properly

    configured, this is not applicable.

    At the command line, run the following command to verify rsyslog is configured to log

    authentication requests:

    grep -E "(^auth.|^authpriv.|^daemon.*)" /etc/rsyslog.conf

    Example result:

    auth.;authpriv.;daemon.* /var/log/audit/sshinfo.log

    If "auth.", "authpriv.", and "daemon.*" are not configured to be logged, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/rsyslog.conf

    Add or update the following line:

    auth.;authpriv.;daemon.* /var/log/audit/sshinfo.log

    Note: The path can be substituted for another suitable log destination dedicated to

    authentication logs.

    At the command line, run the following command:

    systemctl restart rsyslog.service'
  checks:
  - type: command
    command: grep -E "(^auth.|^authpriv.|^daemon.*)" /etc/rsyslog.conf
    expected: ''
    severity: medium
    info: 'If another package is used to offload logs, such as syslog-ng, and is properly

      configured, this is not applicable.

      At the command line, run the following command to verify rsyslog is configured to log

      authentication requests:

      grep -E "(^auth.|^authpriv.|^daemon.*)" /etc/rsyslog.conf

      Example result:

      auth.;authpriv.;daemon.* /var/log/audit/sshinfo.log

      If "auth.", "authpriv.", and "daemon.*" are not '
- id: '1.6'
  title: PHTN-40-000013
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Photon operating system must have the OpenSSL FIPS provider installed to protect the confidentiality of
    remote access sessions. GROUP ID: V-258806 RULE ID: SV-258806r958408'
  rationale: 'Without confidentiality protection mechanisms, unauthorized individuals may gain access to sensitive information
    via a remote access session. OpenSSH on the Photon operating system when configured appropriately can utilize a FIPS validated
    OpenSSL for cryptographic operations. Satisfies: SRG-OS-000033-GPOS-00014, SRG-OS-000393-GPOS-00173, SRG-OS000394-GPOS-00174,
    SRG-OS-000423-GPOS-00187, SRG-OS-000425-GPOS-00189, SRG-OS-000426-GPOS-00190'
  impact: ''
  references: []
  page_start: 23
  audit_raw: 'At the command line, run the following command to verify the OpenSSL FIPS provider

    is installed:

    rpm -qa | grep openssl-fips

    Example result:

    openssl-fips-provider-3.0.3-1.ph4.x86_64

    If there is no output indicating that the OpenSSL FIPS provider is installed, this is a

    finding.'
  remediation: 'At the command line, run the following command:

    tdnf install openssl-fips-provider'
  checks:
  - type: command
    command: rpm -qa | grep openssl-fips
    expected: ''
    severity: medium
    info: 'At the command line, run the following command to verify the OpenSSL FIPS provider

      is installed:

      rpm -qa | grep openssl-fips

      Example result:

      openssl-fips-provider-3.0.3-1.ph4.x86_64

      If there is no output indicating that the OpenSSL FIPS provider is installed, this is a

      finding.'
- id: '1.7'
  title: PHTN-40-000014
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must configure auditd to log to disk. GROUP ID: V-258807 RULE ID: SV-258807r958412'
  rationale: Without establishing what type of events occurred, it would be difficult to establish, correlate, and investigate
    the events leading up to an outage or attack. Audit record content must be shipped to a central location, but it must
    also be logged locally.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'At the command line, run the following command to verify auditd is configured to write

    logs to disk:

    grep ''^write_logs'' /etc/audit/auditd.conf

    Example result:

    write_logs = yes

    If there is no output, this is not a finding.

    If "write_logs" exists and is not configured to "yes", this is a finding.'
  remediation: 'Navigate to and open:

    /etc/audit/auditd.conf

    Ensure the "write_logs" line is uncommented and set to the following:

    write_logs = yes

    At the command line, run the following command:

    pkill -SIGHUP auditd'
  checks:
  - type: command
    command: grep '^write_logs' /etc/audit/auditd.conf
    expected: ''
    severity: medium
    info: 'At the command line, run the following command to verify auditd is configured to write

      logs to disk:

      grep ''^write_logs'' /etc/audit/auditd.conf

      Example result:

      write_logs = yes

      If there is no output, this is not a finding.

      If "write_logs" exists and is not configured to "yes", this is a finding.'
- id: '1.8'
  title: PHTN-40-000016
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must enable the auditd service. GROUP ID: V-258808 RULE ID: SV-258808r1003628'
  rationale: 'Without the capability to generate audit records, it would be difficult to establish, correlate, and investigate
    the events relating to an incident or identify those responsible for one. To that end, the auditd service must be configured
    to start automatically and be running at all times. Satisfies: SRG-OS-000039-GPOS-00017, SRG-OS-000040-GPOS-00018, SRG-OS000041-GPOS-00019,
    SRG-OS-000042-GPOS-00021, SRG-OS-000062-GPOS-00031, SRG-OS-000255-GPOS-00096, SRG-OS-000363-GPOS-00150, SRG-OS-000365GPOS-00152,
    SRG-OS-000446-GPOS-00200'
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'At the command line, run the following command to verify auditd is enabled and

    running:

    systemctl status auditd

    If the service is not enabled and running, this is a finding.'
  remediation: 'At the command line, run the following commands:

    systemctl enable auditd systemctl start auditd'
  checks:
  - type: command
    command: systemctl status auditd
    expected: ''
    severity: medium
    info: 'At the command line, run the following command to verify auditd is enabled and

      running:

      systemctl status auditd

      If the service is not enabled and running, this is a finding.'
- id: '1.9'
  title: PHTN-40-000021
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must alert the ISSO and SA in the event of an audit processing failure. GROUP
    ID: V-258810 RULE ID: SV-258810r958424'
  rationale: 'It is critical for the appropriate personnel to be aware if a system is at risk of failing to process audit
    logs as required. Without this notification, the security personnel may be unaware of an impending failure of the audit
    capability, and system operation may be adversely affected. Audit processing failures include software/hardware errors,
    failures in the audit capturing mechanisms, and audit storage capacity being reached or exceeded. Satisfies: SRG-OS-000046-GPOS-00022,
    SRG-OS-000344-GPOS-00135'
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'At the command line, run the following command to verify auditd is configured to send

    an alert via syslog in the event of an audit processing failure:

    grep -E "^disk_full_action|^disk_error_action|^admin_space_left_action"

    /etc/audit/auditd.conf

    Example result:

    admin_space_left_action = SYSLOG disk_full_action = SYSLOG disk_error_action =

    SYSLOG

    If "disk_full_action", "disk_error_action", and "admin_space_left_action" are not set to

    SYSLOG or are missing, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/audit/auditd.conf

    Ensure the following lines are present, not duplicated, and not commented:

    disk_full_action = SYSLOG disk_error_action = SYSLOG admin_space_left_action =

    SYSLOG

    At the command line, run the following command:

    pkill -SIGHUP auditd'
  checks:
  - type: command
    command: grep -E "^disk_full_action|^disk_error_action|^admin_space_left_action"
    expected: ''
    severity: medium
    info: 'At the command line, run the following command to verify auditd is configured to send

      an alert via syslog in the event of an audit processing failure:

      grep -E "^disk_full_action|^disk_error_action|^admin_space_left_action"

      /etc/audit/auditd.conf

      Example result:

      admin_space_left_action = SYSLOG disk_full_action = SYSLOG disk_error_action =

      SYSLOG

      If "disk_full_action", "disk_error_action", and "adm'
- id: '1.10'
  title: PHTN-40-000019
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must be configured to audit the execution of privileged functions. GROUP ID: V-258809
    RULE ID: SV-258809r958422'
  rationale: 'Misuse of privileged functions, either intentionally or unintentionally by authorized users, or by unauthorized
    external entities that have compromised information system accounts, is a serious and ongoing concern and can have significant
    adverse impacts on organizations. Auditing all actions by superusers is one way to detect such misuse and identify the
    risk from insider threats and the advanced persistent threat. Satisfies: SRG-OS-000042-GPOS-00020, SRG-OS-000326-GPOS-00126'
  impact: ''
  references: []
  page_start: 32
  audit_raw: 'At the command line, run the following command to verify audit rules exist to audit

    privileged functions:

    auditctl -l | grep execve

    Expected result:

    -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -F key=execpriv -a

    always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -F key=execpriv -a

    always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -F key=execpriv -a

    always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -F key=execpriv

    If the output does not match the expected result, this is a finding.

    Note: This check depends on the "auditd" service to be in a running state for accurate

    results. The "auditd" service is enabled in control PHTN-40-000016.'
  remediation: 'Navigate to and open:

    /etc/audit/rules.d/audit.STIG.rules

    Add or update the following lines:

    -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -F key=execpriv -a

    always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -F key=execpriv -a

    always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -F key=execpriv -a

    always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -F key=execpriv

    At the command line, run the following command to load the new audit rules:

    /sbin/augenrules --load

    Note: An "audit.STIG.rules" file is provided with this guidance for placement in

    "/etc/audit/rules.d" that contains all rules needed for auditd.

    Note: An older "audit.STIG.rules" may exist and may reference older "GEN" SRG IDs.

    This file can be removed and replaced as necessary with an updated one.'
  checks:
  - type: command
    command: auditctl -l | grep execve
    expected: ''
    severity: medium
    info: 'At the command line, run the following command to verify audit rules exist to audit

      privileged functions:

      auditctl -l | grep execve

      Expected result:

      -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -F key=execpriv -a

      always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -F key=execpriv -a

      always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -F key=execpriv -a

      always,exit -F arch='
- id: '1.11'
  title: PHTN-40-000026
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must protect audit logs from unauthorized access. GROUP ID: V-258811 RULE ID:
    SV-258811r958434'
  rationale: 'Unauthorized disclosure of audit records can reveal system and configuration data to attackers, thus compromising
    its confidentiality. Audit information includes all information (e.g., audit records, audit settings, audit reports) needed
    to successfully audit operating system activity. Satisfies: SRG-OS-000057-GPOS-00027, SRG-OS-000058-GPOS-00028, SRG-OS000059-GPOS-00029'
  impact: ''
  references: []
  page_start: 34
