- id: '1.17'
  title: PHTN-40-000038
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must require the change of at least eight characters when passwords are changed.
    GROUP ID: V-258817 RULE ID: SV-258817r1003632'
  rationale: If the operating system allows the user to consecutively reuse extensive portions of passwords, this increases
    the chances of password compromise by increasing the window of opportunity for attempts at guessing and brute-force attacks.
    The number of changed characters refers to the number of changes required with respect to the total number of positions
    in the current password. In other words, characters may be the same within the two passwords; however, the positions of
    the like characters must be different. If the password length is an odd number then number of changed characters must
    be rounded up. For example, a password length of 15 characters must require the change of at least eight characters.
  impact: ''
  references: []
  page_start: 45
  audit_raw: 'At the command line, run the following command to verify at least eight different

    characters be used:

    grep ''^password.*pam_pwquality.so'' /etc/pam.d/system-password

    Example result:

