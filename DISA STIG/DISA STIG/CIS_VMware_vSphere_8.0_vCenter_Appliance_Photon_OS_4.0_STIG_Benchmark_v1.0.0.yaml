- id: '1.53'
  title: PHTN-40-000184
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must prevent the use of dictionary words for passwords. GROUP ID: V-258853 RULE
    ID: SV-258853r991587'
  rationale: If the operating system allows the user to select passwords based on dictionary words, then this increases the
    chances of password compromise by increasing the opportunity for successful guesses and brute-force attacks.
  impact: ''
  references: []
  page_start: 110
  audit_raw: 'At the command line, run the following command to verify passwords do not match

    dictionary words:

    grep ''^password.*pam_pwquality.so'' /etc/pam.d/system-password

    Example result:

    password requisite pam_pwquality.so dcredit=-1 ucredit=-1 lcredit=-1 ocredit=-1

    minlen=15 difok=8 enforce_for_root dictcheck=1

    If the "dictcheck" option is not set to 1, is missing or commented out, this is a finding.'
