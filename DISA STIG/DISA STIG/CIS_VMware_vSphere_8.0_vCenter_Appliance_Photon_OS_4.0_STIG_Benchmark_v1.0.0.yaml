- id: '1.38'
  title: PHTN-40-000086
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must enforce password complexity by requiring that at least one special character
    be used. GROUP ID: V-258838 RULE ID: SV-258838r1003642'
  rationale: 'Use of a complex password helps to increase the time and resources required to compromise the password. Password
    complexity or strength is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force
    attacks. Password complexity is one factor in determining how long it takes to crack a password. The more complex the
    password, the greater the number of possible combinations that need to be tested before the password is compromised. Special
    characters are those characters that are not alphanumeric. Examples include: ~ ! @ $ % ^ *.'
  impact: ''
  references: []
  page_start: 82
  audit_raw: 'At the command line, run the following command to verify at least one special character

    be used:

    grep ''^password.*pam_pwquality.so'' /etc/pam.d/system-password

    Example result:

    password requisite pam_pwquality.so dcredit=-1 ucredit=-1 lcredit=-1 ocredit=-1

    minlen=15 difok=8 enforce_for_root dictcheck=1

    If the "ocredit" option is not < 0, is missing or commented out, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/pam.d/system-password

    Configure the pam_pwquality.so line to have the "ocredit" option set to "-1" as follows:

    password requisite pam_pwquality.so dcredit=-1 ucredit=-1 lcredit=-1 ocredit=-1

    minlen=15 difok=8 enforce_for_root dictcheck=1

    Note: On vCenter appliances, the equivalent file must be edited under

    "/etc/applmgmt/appliance", if one exists, for the changes to persist after a reboot.'
  checks:
  - type: command
    command: grep '^password.*pam_pwquality.so' /etc/pam.d/system-password
    expected: ''
    severity: medium
    info: 'At the command line, run the following command to verify at least one special character

      be used:

      grep ''^password.*pam_pwquality.so'' /etc/pam.d/system-password

      Example result:

      password requisite pam_pwquality.so dcredit=-1 ucredit=-1 lcredit=-1 ocredit=-1

      minlen=15 difok=8 enforce_for_root dictcheck=1

      If the "ocredit" option is not < 0, is missing or commented out, this is a finding.'
- id: '1.39'
  title: PHTN-40-000092
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Photon operating system must use cryptographic mechanisms to protect the integrity of audit tools. GROUP
    ID: V-258839 RULE ID: SV-258839r991567'
  rationale: Protecting the integrity of the tools used for auditing purposes is a critical step toward ensuring the integrity
    of audit information. Audit information includes all information (e.g., audit records, audit settings, and audit reports)
    needed to successfully audit information system activity. Audit tools include, but are not limited to, vendor-provided
    and open source audit tools needed to successfully view and manipulate audit information system activity and records.
    Audit tools include custom queries and report generators. It is not uncommon for attackers to replace the audit tools
    or inject code into the existing tools with the purpose of providing the capability to hide or erase system activity from
    the audit logs. To address this risk, audit tools must be cryptographically signed in order to provide the capability
    to identify when the audit tools have been modified, manipulated, or replaced. An example is a checksum hash of the file
    or files.
  impact: ''
  references: []
  page_start: 84
  audit_raw: 'Use the verification capability of rpm to check the MD5 hashes of the audit files on disk

    versus the expected ones from the installation package.

    At the command line, run the following command:

    rpm -V audit | grep "^..5"

    Example output:

    If there is any output for files that are not configuration files, this is a finding.'
  remediation: 'If the audit system binaries have been altered investigate the cause and then reinstall

    the audit package to restore the integrity of the package.

    If performed on a VMware reinstalling the audit tools is not supported. The appliance

    should be restored from a backup or redeployed once the root cause is remediated.'
  checks:
  - type: command
    command: rpm -V audit | grep "^..5"
    expected: ''
    severity: medium
    info: 'Use the verification capability of rpm to check the MD5 hashes of the audit files on disk

      versus the expected ones from the installation package.

      At the command line, run the following command:

      rpm -V audit | grep "^..5"

      Example output:

      If there is any output for files that are not configuration files, this is a finding.'
- id: '1.40'
  title: PHTN-40-000093
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The operating system must automatically terminate a user session after inactivity timeouts have expired. GROUP
    ID: V-258840 RULE ID: SV-258840r1003643'
  rationale: 'Automatic session termination addresses the termination of user-initiated logical sessions in contrast to the
    termination of network connections that are associated with communications sessions (i.e., network disconnect). A logical
    session (for local, network, and remote access) is initiated whenever a user (or process acting on behalf of a user) accesses
    an organizational information system. Such user sessions can be terminated (and thus terminate user access) without terminating
    network sessions. Session termination terminates all processes associated with a user''s logical session except those
    processes that are specifically created by the user (i.e., session owner) to continue after the session is terminated.
    Conditions or trigger events requiring automatic session termination can include, for example, organization-defined periods
    of user inactivity, targeted responses to certain types of incidents, and time-of-day restrictions on information system
    use. This capability is typically reserved for specific operating system functionality where the system owner, data owner,
    or organization requires additional assurance. Satisfies: SRG-OS-000279-GPOS-00109, SRG-OS-000126-GPOS-00066'
  impact: ''
  references: []
  page_start: 86
  audit_raw: 'At the command line, run the following command:

    grep -E "TMOUT=900" /etc/bash.bashrc /etc/profile.d/*

    Example result:

    /etc/profile.d/tmout.sh:TMOUT=900

    If the "TMOUT" environmental variable is not set, the value is more than "900", or is set

    to "0", this is a finding.'
  remediation: 'Navigate to and open:

    /etc/profile.d/tmout.sh

    Set its content to the following:

    TMOUT=900 readonly TMOUT export TMOUT mesg n 2>/dev/null'
  checks:
  - type: command
    command: grep -E "TMOUT=900" /etc/bash.bashrc /etc/profile.d/*
    expected: ''
    severity: medium
    info: 'At the command line, run the following command:

      grep -E "TMOUT=900" /etc/bash.bashrc /etc/profile.d/*

      Example result:

      /etc/profile.d/tmout.sh:TMOUT=900

      If the "TMOUT" environmental variable is not set, the value is more than "900", or is set

      to "0", this is a finding.'
- id: '1.41'
  title: PHTN-40-000105
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Photon operating system must enable symlink access control protection in the kernel. GROUP ID: V-258841
    RULE ID: SV-258841r958726'
  rationale: By enabling the fs.protected_symlinks kernel parameter, symbolic links are permitted to be followed only when
    outside a sticky world-writable directory, or when the UID of the link and follower match, or when the directory owner
    matches the symlink's owner. Disallowing such symlinks helps mitigate vulnerabilities based on insecure file system accessed
    by privileged programs, avoiding an exploitation vector exploiting unsafe use of open() or creat().
  impact: ''
  references: []
  page_start: 88
  audit_raw: 'At the command line, run the following command to verify symlink protection is enabled:

    /sbin/sysctl fs.protected_symlinks

    Example result:

    fs.protected_symlinks = 1

    If the "fs.protected_symlinks" kernel parameter is not set to "1", this is a finding.'
  remediation: 'Navigate to and open:

    /etc/sysctl.d/zz-stig-hardening.conf

    Add or update the following line:

    fs.protected_symlinks = 1

    At the command line, run the following command to load the new configuration:

    /sbin/sysctl --load /etc/sysctl.d/zz-stig-hardening.conf

    Note: If the file zz-stig-hardening.conf does not exist, it must be created.'
  checks:
  - type: manual_review
    info: 'At the command line, run the following command to verify symlink protection is enabled:

      /sbin/sysctl fs.protected_symlinks

      Example result:

      fs.protected_symlinks = 1

      If the "fs.protected_symlinks" kernel parameter is not set to "1", this is a finding.'
    severity: medium
