  description: 'The Photon operating system must restrict core dumps. GROUP ID: V-258904 RULE ID: SV-258904r991589'
  rationale: By enabling the fs.suid_dumpable kernel parameter, core dumps are not generated for setuid or otherwise protected/tainted
    binaries. This prevents users from potentially accessing core dumps with privileged information they would otherwise not
    have access to read.
  impact: ''
  references: []
