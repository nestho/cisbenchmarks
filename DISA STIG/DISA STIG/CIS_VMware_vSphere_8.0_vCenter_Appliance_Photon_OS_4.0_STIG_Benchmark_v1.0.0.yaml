- id: '1.101'
  title: PHTN-40-000239
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Photon operating system must implement only approved Message Authentication Codes (MACs) to protect the
    integrity of remote access sessions. GROUP ID: V-258900 RULE ID: SV-258900r991554'
  rationale: Without cryptographic integrity protections, information can be altered by unauthorized users without detection.
    Remote access (e.g., RDP) is access to DOD nonpublic information systems by an authorized user (or an information system)
    communicating through an external, nonorganization-controlled network. Remote access methods include, for example, dialup,
    broadband, and wireless. Cryptographic mechanisms used for protecting the integrity of information include, for example,
    signed hash functions using asymmetric cryptography enabling distribution of the public key to verify the hash information
    while maintaining the confidentiality of the secret key used to generate the hash.
  impact: ''
  references: []
  page_start: 198
  audit_raw: 'At the command line, run the following command to verify the running configuration of

    sshd:

    sshd -T|&grep -i MACs

    Example result:

    macs hmac-sha2-512,hmac-sha2-256

    If the output matches the macs in the example result or a subset thereof, this is not a

    finding.

    If the output contains any macs not listed in the example result, this is a finding.'
  remediation: 'Navigate to and open:

    /etc/ssh/sshd_config

    Ensure the "MACs" line is uncommented and set to the following:

    MACs hmac-sha2-512,hmac-sha2-256

    At the command line, run the following command:

    systemctl restart sshd.service'
  checks:
  - type: command
    command: sshd -T|&grep -i MACs
    expected: ''
    severity: medium
    info: 'At the command line, run the following command to verify the running configuration of

      sshd:

