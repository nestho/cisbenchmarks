    some of which may be relevant to security. Detecting such changes and providing an automated response can help avoid unintended,
    negative consequences that could ultimately affect the security state of the operating system. The operating system's
    information system security manager (ISSM)/information system security officer (ISSO) and system administrators (SAs)
    must be notified via email and/or monitoring system trap when there is an unauthorized modification of a configuration
    item.
  impact: ''
  references: []
  page_start: 194
