- id: '1.36'
  title: PHTN-40-000080
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must initiate session audits at system startup. GROUP ID: V-258836 RULE ID: SV-258836r991555'
  rationale: If auditing is enabled late in the startup process, the actions of some startup processes may not be audited.
    Some audit systems also maintain state information only available if auditing is enabled before a given process is created.
  impact: ''
  references: []
  page_start: 78
  audit_raw: 'At the command line, run the following command to verify auditing is enabled at startup:

    grep ''audit'' /proc/cmdline

    Example result:

    BOOT_IMAGE=/boot/vmlinuz-5.10.109-2.ph4-esx root=PARTUUID=6e6293c6-9ab649e9-aa97-9b212f2e037a init=/lib/systemd/systemd
    rcupdate.rcu_expedited=1 rw

    systemd.show_status=1 quiet noreplace-smp cpu_init_udelay=0 plymouth.enable=0

    systemd.legacy_systemd_cgroup_controller=yes audit=1

    If the "audit" parameter is not present with a value of "1", this is a finding.'
  remediation: 'Navigate to and open:

    /boot/grub2/grub.cfg

    Locate the boot command line arguments. An example follows:

    linux /boot/$photon_linux root=$rootpartition $photon_cmdline $systemd_cmdline

    Add "audit=1" to the end of the line so it reads as follows:

    linux /boot/$photon_linux root=$rootpartition $photon_cmdline $systemd_cmdline

    audit=1

    Note: Do not copy/paste in this example argument line. This may change in future

    releases. Find the similar line and append "audit=1" to it.

    Reboot the system for the change to take effect.'
  checks:
  - type: command
    command: grep 'audit' /proc/cmdline
    expected: ''
    severity: medium
    info: 'At the command line, run the following command to verify auditing is enabled at startup:

      grep ''audit'' /proc/cmdline

      Example result:

      BOOT_IMAGE=/boot/vmlinuz-5.10.109-2.ph4-esx root=PARTUUID=6e6293c6-9ab649e9-aa97-9b212f2e037a init=/lib/systemd/systemd
      rcupdate.rcu_expedited=1 rw

      systemd.show_status=1 quiet noreplace-smp cpu_init_udelay=0 plymouth.enable=0

      systemd.legacy_systemd_cgroup_controller=y'
- id: '1.37'
  title: PHTN-40-000082
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must protect audit tools from unauthorized access. GROUP ID: V-258837 RULE ID:
    SV-258837r991557'
  rationale: 'Protecting audit information also includes identifying and protecting the tools used to view and manipulate
    log data. Therefore, protecting audit tools is necessary to prevent unauthorized operation on audit information. Operating
    systems providing tools to interface with audit information will leverage user permissions and roles identifying the user
    accessing the tools and the corresponding rights the user enjoys in order to make access decisions regarding the access
    to audit tools. Audit tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully
    view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.
    Satisfies: SRG-OS-000256-GPOS-00097, SRG-OS-000257-GPOS-00098, SRG-OS000258-GPOS-00099'
  impact: ''
  references: []
  page_start: 80
  audit_raw: 'At the command line, run the following command to verify permissions on audit tools:

    stat -c "%n is owned by %U and group owned by %G and permissions are %a"

    /usr/sbin/audispd /usr/sbin/auditctl /usr/sbin/auditd /usr/sbin/aureport /usr/sbin/ausearch

    /usr/sbin/autrace /usr/sbin/augenrules

    Expected result:

    /usr/sbin/audispd is owned by root and group owned by root and permissions are 750

    /usr/sbin/auditctl is owned by root and group owned by root and permissions are 755

    /usr/sbin/auditd is owned by root and group owned by root and permissions are 755

    /usr/sbin/aureport is owned by root and group owned by root and permissions are 755

    /usr/sbin/ausearch is owned by root and group owned by root and permissions are 755

    /usr/sbin/autrace is owned by root and group owned by root and permissions are 755

    /usr/sbin/augenrules is owned by root and group owned by root and permissions are

    750

    If any file is not owned by root or group owned by root or permissions are more

    permissive than listed above, this is a finding.'
  remediation: 'At the command line, run the following commands for each file returned:

    chown root:root chmod 750

    Note: Update permissions to match the target file as listed in the check text.'
  checks:
  - type: command
    command: stat -c "%n is owned by %U and group owned by %G and permissions are %a"
    expected: ''
    severity: medium
    info: 'At the command line, run the following command to verify permissions on audit tools:

      stat -c "%n is owned by %U and group owned by %G and permissions are %a"

