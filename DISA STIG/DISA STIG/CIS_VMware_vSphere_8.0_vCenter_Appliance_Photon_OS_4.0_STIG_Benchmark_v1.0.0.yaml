- id: '1.24'
  title: PHTN-40-000046
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must require authentication upon booting into single-user and maintenance modes.
    GROUP ID: V-258824 RULE ID: SV-258824r958472'
  rationale: 'If the system does not require authentication before it boots into single-user mode, anyone with console access
    to the system can trivially access all files on the system. GRUB2 is the boot loader for Photon OS and can be configured
    to require a password to boot into single-user mode or make modifications to the boot menu. Note: Photon does not support
    building grub changes via grub2-mkconfig.'
  impact: ''
  references: []
  page_start: 55
  audit_raw: 'At the command line, run the following command to verify a password is required to edit

    the grub bootloader to boot into single-user mode:

    grep -E "^set\ssuperusers|^password_pbkdf2" /boot/grub2/grub.cfg

    Example output:

    set superusers="root" password_pbkdf2 root grub.pbkdf2.sha512.[password_hash]

    If superusers is not set, this is a finding. If a password is not set for the super user, this

    is a finding.'
  remediation: 'Before proceeding, ensure a snapshot is taken to rollback if needed.

    At the command line, run the following command to generate a grub password:

    grub2-mkpasswd-pbkdf2

    Enter a secure password and ensure this password is stored for break-glass situations.

    Users will not be able to recover the root account without knowing this separate

    password. Copy the resulting encrypted string.

    An example string is below:

    grub.pbkdf2.sha512.10000.983A13DF3C51BB2B5130F0B86DDBF0DEA1AAF766BD1

    F16B7840F79CE3E35494C4B99F505C99C150071E563DF1D7FE1F45456D5960C4C

    79DAB6C49298B02A5558.5B2C49E12D43CC5A876F6738462DE4EFC24939D4BE48

    6CDB72CFBCD87FDE93FBAFCB817E01B90F23E53C2502C3230502BC3113BE4F80

    B0AFC0EE956E735F7F86

    Note: The grub2 package must be installed to generate a password for grub.

    Navigate to and open:

    /boot/grub2/grub.cfg

    Find the line that begins with "set rootpartition". Below this line, paste the following on

    its own line:

    set superusers="root"

    Note: The superusers name can be a value other than root and is not tied to an OS

    account.

    Below this paste the following, substituting the user''s own encrypted string from the

    steps above:

    password_pbkdf2 root <YOUR-LONG-STRING-FROM-ABOVE>

    Next edit the default Photon menuentry block with the "--unrestricted" parameter so that

    it will continue to boot without prompting for credentials, for example:

    menuentry "Photon" --unrestricted { linux /boot/$photon_linux root=$rootpartition

    $photon_cmdline $systemd_cmdline audit=1 if [ -f /boot/$photon_initrd ]; then initrd

    /boot/$photon_initrd fi }

    When booting now, if users press "e" when the Photon splash screen appears, users

    will be prompted for credentials before being presented the option to edit the boot

    loader before system startup.

    Note: Photon does not support building grub changes via grub2-mkconfig.'
  checks:
  - type: command
    command: grep -E "^set\ssuperusers|^password_pbkdf2" /boot/grub2/grub.cfg
    expected: ''
    severity: medium
    info: 'At the command line, run the following command to verify a password is required to edit

      the grub bootloader to boot into single-user mode:

      grep -E "^set\ssuperusers|^password_pbkdf2" /boot/grub2/grub.cfg

      Example output:

      set superusers="root" password_pbkdf2 root grub.pbkdf2.sha512.[password_hash]

      If superusers is not set, this is a finding. If a password is not set for the super user, this

      is a fi'
- id: '1.25'
  title: PHTN-40-000047
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Photon operating system must disable unnecessary kernel modules. GROUP ID: V-258825 RULE ID: SV-258825r1003641'
  rationale: 'It is detrimental for operating systems to provide, or install by default, functionality exceeding requirements
    or mission objectives. These unnecessary capabilities or services are often overlooked and therefore may remain unsecured.
    They increase the risk to the platform by providing additional attack vectors. Operating systems are capable of providing
    a wide variety of functions and services. Some of the functions and services, provided by default, may not be necessary
    to support essential organizational operations (e.g., key missions, functions). Examples of nonessential capabilities
    include, but are not limited to, games, software packages, tools, and demonstration software, not related to requirements
    or providing a wide array of functionality not required for every mission, but which cannot be disabled. Satisfies: SRG-OS-000095-GPOS-00049,
    SRG-OS-000114-GPOS-00059'
  impact: ''
  references: []
  page_start: 57
  audit_raw: 'At the command line, run the following command to verify the following kernel modules

    are not loaded:

    modprobe --showconfig | grep "^install" | grep "/bin"

    Expected result:

    install sctp /bin/false install dccp /bin/false install dccp_ipv4 /bin/false install dccp_ipv6

    /bin/false install ipx /bin/false install appletalk /bin/false install decnet /bin/false install rds

    /bin/false install tipc /bin/false install bluetooth /bin/false install usb_storage /bin/false

    install ieee1394 /bin/false install cramfs /bin/false install freevxfs /bin/false install jffs2

    /bin/false install hfs /bin/false install hfsplus /bin/false install squashfs /bin/false install

    udf /bin/false

    The output may include other statements outside of the expected result.

    If the output does not include at least every statement in the expected result, this is a

    finding.'
  remediation: 'Navigate to and open:

    /etc/modprobe.d/modprobe.conf

    Set the contents as follows:

    install sctp /bin/false install dccp /bin/false install dccp_ipv4 /bin/false install dccp_ipv6

    /bin/false install ipx /bin/false install appletalk /bin/false install decnet /bin/false install rds

    /bin/false install tipc /bin/false install bluetooth /bin/false install usb_storage /bin/false

    install ieee1394 /bin/false install cramfs /bin/false install freevxfs /bin/false install jffs2

    /bin/false install hfs /bin/false install hfsplus /bin/false install squashfs /bin/false install

    udf /bin/false'
