  rationale: This policy setting manages whether the Office Feedback Tool (a.k.a. Send a Smile) allows the user to send a
    screenshot of their desktop with their feedback to Microsoft. The Office Feedback Tool allows users to provide Microsoft
    feedback regarding their positive and negative experiences when using Office. If you enable this policy setting, the Office
    Feedback Tool will allow the user to send a screenshot of their desktop with their feedback to Microsoft. If you disable
    this policy setting, the Office Feedback Tool will not allow the user to send a screenshot of their desktop with their
    feedback to Microsoft. If you do not configure this policy setting, the behavior is the equivalent of setting the policy
    to "Enabled".
