  rationale: This policy setting controls whether document metadata can be saved in PDF and XPS documents. If you enable this
    policy setting, document properties metadata is not exported to PDF and XPS files. If you disable this policy setting,
    document properties metadata will always be saved with PDF and XPS files, and users will not be able to override this
