- id: '1.1'
  title: DTOO182
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Help Improve Proofing Tools feature for Office must be configured. GROUP ID: V-238024 RULE ID: SV-238024r961863'
  rationale: This policy setting controls whether the Help Improve Proofing Tools feature sends usage data to Microsoft. The
    Help Improve Proofing Tools feature collects data about use of the Proofing Tools, such as additions to the custom dictionary,
    and sends it to Microsoft. After about six months, the feature stops sending data to Microsoft and deletes the data collection
    file from the user's computer. If you enable this policy setting, this feature is enabled if users choose to participate
    in the Customer Experience Improvement Program (CEIP). If your organization has policies that govern the use of external
    resources such as the CEIP, allowing the use of the Help Improve Proofing Tools feature might cause them to violate these
    policies. If you disable this policy setting, the Help Improve Proofing Tools feature does not collect proofing tool usage
    information and transmit it to Microsoft. If you do not configure this policy setting, the behavior is the equivalent
    of setting the policy to "Enabled".
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'Verify the policy value for User Configuration -> Administrative Templates -> Microsoft

    Office 2016 -> Tools \ Options \ Spelling -> Proofing Data Collection "Improve Proofing

    Tools" is set to "Disabled".

    Procedure: Use the Windows Registry Editor to navigate to the following key:

    HKCU\Software\Policies\Microsoft\Office\16.0\common\ptwatson

    Criteria: If the value PTWOptIn is REG_DWORD = 0, this is not a finding.'
  remediation: 'Set the policy value for User Configuration -> Administrative Templates -> Microsoft

    Office 2016 -> Tools \ Options \ Spelling -> Proofing Data Collection "Improve Proofing

    Tools" to "Disabled".'
  checks:
  - type: manual_review
    info: 'Verify the policy value for User Configuration -> Administrative Templates -> Microsoft

      Office 2016 -> Tools \ Options \ Spelling -> Proofing Data Collection "Improve Proofing

      Tools" is set to "Disabled".

      Procedure: Use the Windows Registry Editor to navigate to the following key:

      HKCU\Software\Policies\Microsoft\Office\16.0\common\ptwatson

      Criteria: If the value PTWOptIn is REG_DWORD = 0, this is not a finding.'
    severity: medium
- id: '1.2'
  title: DTOO186
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Trust Bar notifications for Security messages must be enforced. GROUP ID: V-238025 RULE ID: SV-238025r961086'
  rationale: This policy setting controls whether Office 2016 applications notify users when potentially unsafe features or
    content are detected, or whether such features or content are silently disabled without notification. The Message Bar
    in Office 2016 applications is used to identify security issues, such as unsigned macros or potentially unsafe add-ins.
    When such issues are detected, the application disables the unsafe feature or content and displays the Message Bar at
    the top of the active window. The Message Bar informs the users about the nature of the security issue and, in some cases,
    provides the users with an option to enable the potentially unsafe feature or content, which could harm the user's computer.
    If you enable this policy setting, Office 2016 applications do not display information in the Message Bar about potentially
    unsafe content that has been detected or has automatically been blocked. If you disable this policy setting, Office 2016
    applications display information in the Message Bar about content that has automatically been blocked. If you do not configure
    this policy setting, if an Office 2016 application detects a security issue, the Message Bar is displayed. However, this
    configuration can be modified by users in the Trust Center.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'Verify the policy value for User Configuration -> Administrative Templates -> Microsoft

    Office 2016 -> Security Settings "Disable all Trust Bar notifications for security issues" is

    set to "Disabled".

    Procedure: Use the Windows Registry Editor to navigate to the following key:

    HKCU\Software\Policies\Microsoft\Office\16.0\common\trustcenter

    Criteria: If the value TrustBar is REG_DWORD = 0, this is not a finding.'
  remediation: 'Set the policy value for User Configuration -> Administrative Templates -> Microsoft

    Office 2016 -> Security Settings "Disable all Trust Bar notifications for security issues"

    to "Disabled".'
  checks:
  - type: manual_review
    info: 'Verify the policy value for User Configuration -> Administrative Templates -> Microsoft

      Office 2016 -> Security Settings "Disable all Trust Bar notifications for security issues" is

      set to "Disabled".

      Procedure: Use the Windows Registry Editor to navigate to the following key:

      HKCU\Software\Policies\Microsoft\Office\16.0\common\trustcenter

      Criteria: If the value TrustBar is REG_DWORD = 0, this is not a finding.'
    severity: medium
- id: '1.3'
  title: DTOO187
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Rights managed Office Open XML files must be protected. GROUP ID: V-238026 RULE ID: SV-238026r961602'
  rationale: This policy setting determines whether metadata is encrypted in Office Open XML files that are protected by Information
    Rights Management (IRM). If you enable this policy setting, Excel, PowerPoint, and Word encrypt metadata stored in rights-managed
    Office Open XML files and override any configuration changes on users' computers. If you disable this policy setting,
    Office 2016 applications cannot encrypt metadata in rightsmanaged Office Open XML files, which can reduce security. If
    you do not configure this policy setting, when Information Rights Management (IRM) is used to restrict access to an Office
    Open XML document, any metadata associated with the document is not encrypted.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Verify the policy value for User Configuration -> Administrative Templates -> Microsoft

    Office 2016 -> Security Settings "Protect document metadata for rights managed Office

    Open XML Files" is set to "Enabled".

    Procedure: Use the Windows Registry Editor to navigate to the following key:

    HKCU\Software\Policies\Microsoft\Office\16.0\common\security

    Criteria: If the value DRMEncryptProperty is REG_DWORD = 1, this is not a finding.'
  remediation: 'Set the policy value for User Configuration -> Administrative Templates -> Microsoft

    Office 2016 -> Security Settings "Protect document metadata for rights managed Office

    Open XML Files" to "Enabled".'
  checks:
  - type: manual_review
    info: 'Verify the policy value for User Configuration -> Administrative Templates -> Microsoft

      Office 2016 -> Security Settings "Protect document metadata for rights managed Office

      Open XML Files" is set to "Enabled".

      Procedure: Use the Windows Registry Editor to navigate to the following key:

      HKCU\Software\Policies\Microsoft\Office\16.0\common\security

      Criteria: If the value DRMEncryptProperty is REG_DWORD = 1, this is not a finding.'
    severity: medium
- id: '1.4'
  title: DTOO188
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Document metadata for password protected files must be protected. GROUP ID: V-238027 RULE ID: SV-238027r961128'
  rationale: This policy setting determines whether metadata is encrypted when an Office Open XML file is password protected.
    If you enable this policy setting, Excel 2016, PowerPoint 2016, and Word 2016 encrypt metadata stored in password-protected
    Office Open XML files and override any configuration changes on users' computers. If you disable this policy setting,
    Office 2016 applications cannot encrypt metadata in password-protected Office Open XML files, which can reduce security.
    If you do not configure this policy setting, when an Office Open XML document is protected with a password and saved,
    any metadata associated with the document is encrypted along with the rest of the document's contents. If this configuration
    is changed, potentially sensitive information such as the document author and hyperlink references could be exposed to
    unauthorized people.
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Verify the policy value for User Configuration -> Administrative Templates -> Microsoft

    Office 2016 -> Security Settings "Protect document metadata for password protected

    files" is set to "Enabled".

    Procedure: Use the Windows Registry Editor to navigate to the following key:

    HKCU\Software\Policies\Microsoft\Office\16.0\common\security

    Criteria: If the value OpenXMLEncryptProperty is REG_DWORD = 1, this is not a

    finding.'
  remediation: 'Set the policy value for User Configuration -> Administrative Templates -> Microsoft

    Office 2016 -> Security Settings "Protect document metadata for password protected

    files" to "Enabled".'
  checks:
  - type: manual_review
    info: 'Verify the policy value for User Configuration -> Administrative Templates -> Microsoft

