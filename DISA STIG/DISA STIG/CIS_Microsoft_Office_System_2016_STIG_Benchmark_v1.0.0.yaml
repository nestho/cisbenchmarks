  rationale: This policy setting controls whether users can send personal information to Office. When users choose to send
    information Office 2016 applications automatically send information to Office. If you enable this policy setting, users
    will opt into sending personal information to Office. If your organization has policies that govern the use of external
    resources, opting users into the program might cause them to violate these policies. If you disable this policy setting,
    Office 2016 users cannot send personal information to Office. If you do not configure this policy setting, the behavior
    is the equivalent of setting the policy to "Enabled".
