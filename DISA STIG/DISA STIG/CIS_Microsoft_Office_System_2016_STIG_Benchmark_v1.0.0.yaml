- id: '1.7'
  title: DTOO191
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'ActiveX control initialization must be disabled. GROUP ID: V-238030 RULE ID: SV-238030r961779'
  rationale: 'This policy setting specifies the Microsoft ActiveX« initialization security level for all Microsoft Office
    applications. ActiveX controls can adversely affect a computer directly. In addition, malicious code can be used to compromise
    an ActiveX control and attack a computer. To indicate the safety of an ActiveX control, developers can denote them as
    Safe For Initialization (SFI). SFI indicates that a control is safe to open and run, and that it is not capable of causing
    a problem for any computer, regardless of whether it has persisted data values or not. If a control is not marked SFI,
    it is possible that the control could adversely affect a computer--or it could mean that the developers did not test the
    control in all situations and are not sure whether it might be compromised in the future. If you enable this policy setting,
    you can set the ActiveX security level to a number between 1 and 6. These security levels are as follows: 1 - Regardless
    of how the control is marked, load it and use the persisted values (if any). This setting does not prompt the user. 2
    - If SFI, load the control in safe mode and use persisted values (if any). If not SFI, load in unsafe mode with persisted
    values (if any), or use the default (first-time initialization) settings. This level is similar to the default configuration,
    but does not prompt the user. 3 - If SFI, load the control in unsafe mode and use persisted values (if any). If not SFI,
    prompt the user and advise them that it is marked unsafe. If the user chooses No at the prompt, do not load the control.
    Otherwise, load it with default (firsttime initialization) settings. 4 - If SFI, load the control in safe mode and use
    persisted values (if any). If not SFI, prompt the user and advise them that it is marked unsafe. If the user chooses No
    at the prompt, do not load the control. Otherwise, load it with default (first-time initialization) settings. 5 - If SFI,
    load the control in unsafe mode and use persisted values (if any). If not SFI, prompt the user and advise them that it
    is marked unsafe. If the user chooses No at the prompt, do not load the control. Otherwise, load it with persisted values.
    6 - If SFI, load the control in safe mode and use persisted values (if any). If not SFI, prompt the user and advise them
    that it is marked unsafe. If the user chooses No at the prompt, do not load the control. Otherwise, load it with persisted
    values. If you disable or do not configure this policy setting, if a control is marked SFI, the application loads the
    control in safe mode and uses persisted values (if any). If the control is not marked SFI, the application loads the control
    in unsafe mode with persisted values (if any), or uses the default (first-time initialization) settings. In both situations,
    the Message Bar informs users that the controls have been disabled and prompts them to respond. Important - Some ActiveX
    controls do not respect the safe mode registry setting, and therefore might load persisted data even though you configure
    this setting to instruct the control to use safe mode. This setting only increases security for ActiveX controls that
    are accurately marked as SFI. In situations that involve malicious or poorly designed code, an ActiveX control might be
    inaccurately marked as SFI.'
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'Verify the policy value for User Configuration -> Administrative Templates -> Microsoft

    Office 2016 -> Security Settings "ActiveX Control Initialization" is set to "Disabled".

    Procedure: Use the Windows Registry Editor to navigate to the following key:

    HKCU\Software\Policies\Microsoft\Office\Common\Security

    Criteria: If the value UFIControls exists, this is a finding.'
  remediation: 'Set the policy value for User Configuration -> Administrative Templates -> Microsoft

    Office 2016 -> Security Settings "ActiveX Control Initialization" to "Disabled".'
  checks:
  - type: manual_review
    info: 'Verify the policy value for User Configuration -> Administrative Templates -> Microsoft

      Office 2016 -> Security Settings "ActiveX Control Initialization" is set to "Disabled".

      Procedure: Use the Windows Registry Editor to navigate to the following key:

      HKCU\Software\Policies\Microsoft\Office\Common\Security

      Criteria: If the value UFIControls exists, this is a finding.'
    severity: medium
- id: '1.8'
  title: DTOO192
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Load controls in forms3 must be disabled from loading. GROUP ID: V-238031 RULE ID: SV-238031r961086'
  rationale: 'This policy setting allows you to control how ActiveX controls in UserForms should be initialized based upon
    whether they are Safe For Initialization (SFI) or Unsafefor Initialization (UFI). ActiveX controls are Component Object
    Model (COM) objects and have unrestricted access to users'' computers. ActiveX controls can access the local file system
    and change the registry settings of the operating system. If a malicious user repurposes an ActiveX control to take over
    a user''s computer, the effect could be significant. To help improve security, ActiveX developers can mark controls as
    Safe For Initialization (SFI), which means that the developer states that the controls are safe to open and run and not
    capable of causing harm to any computers. If a control is not marked SFI, the control could adversely affect a computer--or
    it''s possible the developers did not test the control in all situations and are not sure whether their control might
    be compromised at some future date.SFI controls run in safe mode, which limits their access to the computer. For example,
    a worksheet control can both read and write files when it is in unsafe mode, but perhaps only read from files when it
    is in safe mode. This functionality allows the control to be used in very powerful ways when safety wasn''t important,
    but the control would still be safe for use in a Web page. If a control is not marked as SFI, it is marked Unsafe For
    Initialization (UFI), which means that it is capable of affecting a user''s computer. If UFI ActiveX controls are loaded,
    they are always loaded in unsafe mode. If you enable this policy setting, you can choose from four options for loading
    controls in UserForms: 1- For a UFI or SFI signed control that supports safe and unsafe mode, load the control in unsafe
    mode. For an SFI signed control that only supports a safe mode configuration, load the control in safe mode. This option
    enforces the default configuration. 2 - Users are prompted to determine how UserForm forms will load. The prompt only
    displays once per session within an application. When users respond to the prompt, loading continues based on whether
    the control is UFI or SFI: - For a UFI signed control, if users respond Yes to the prompt, load the control in unsafe
    mode. If users respond No, load the control using the default properties. - For an SFI signed control that supports both
    safe and unsafe modes, if users respond Yes to the prompt, load the control in unsafe mode. If users respond No, load
    the control using safe mode. If the SFI control can only support safe mode, load the control in safe mode. This option
    is the default configuration in the Microsoft Office 2016 release. 3 - Users are prompted to determine how UserForm forms
    will load. The prompt only displays once per session within an application. When users respond to the prompt, loading
    continues based on whether the control is UFI or SFI: - For a UFI signed control, if users respond Yes to the prompt,
    load the control in unsafe mode. If users respond No, load the control with its default properties. - For an SFI signed
    control, load in safe mode. 4 - For a UFI signed control, load with the default properties of the control. For an SFI
    signed control, load in safe mode (considered to be the safest mode). If you disable or do not configure this policy setting,
    the behavior is as if you enable this policy setting and then select option 1.'
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'Verify the policy value for User Configuration >> Administrative Templates >> Microsoft

    Office 2016 >> Security Settings "Load Controls in Forms3" is set to Enabled and 1

    from drop-down menu.

    (For a UFI or SFI signed control that supports safe and unsafe mode, load the control in

    unsafe mode. For an SFI signed control that only supports a safe mode configuration,

    load the control in safe mode. This option enforces the default configuration.) Setting

    "Load Controls in Forms3" to disabled is also acceptable.

    Use the Windows Registry Editor to navigate to the following key:

    HKCU\software\policies\microsoft\vba\security

    If the value for "LoadControlsInForms3" does not exist or if the value for

    "LoadControlsInForms" is REG_DWORD=1, this is not a finding.'
  remediation: 'Set the policy value for User Configuration >> Administrative Templates >> Microsoft

    Office 2016 >> Security Settings "Load Controls in Forms3" to "Enabled" and 1 from the

    drop-down menu, or set it to "Disabled".'
  checks:
  - type: manual_review
    info: 'Verify the policy value for User Configuration >> Administrative Templates >> Microsoft

      Office 2016 >> Security Settings "Load Controls in Forms3" is set to Enabled and 1

      from drop-down menu.

      (For a UFI or SFI signed control that supports safe and unsafe mode, load the control in

      unsafe mode. For an SFI signed control that only supports a safe mode configuration,

      load the control in safe mode. This option enforces the default configuration.) Setting

      "Load Controls in Forms3" to disabled is also '
    severity: medium
- id: '1.9'
  title: DTOO193
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Automation Security to enforce macro level security in Office documents must be configured. GROUP ID: V-238032
    RULE ID: SV-238032r961092'
  rationale: 'This policy setting controls whether macros can run in an Office 2016 application that is opened programmatically
    by another application. If you enable this policy setting, you can choose from three options for controlling macro behavior
    in Excel, PowerPoint, and Word when the application is opened programmatically: - Disable macros by default - All macros
    are disabled in the programmatically opened application. - Macros enabled (default) - Macros can run in the programmatically
    opened application. This option enforces the default configuration in Excel, PowerPoint, and Word. - User application
    macro security level - Macro functionality is determined by the setting in the "Macro Settings" section of the Trust Center.
    If you disable or do not configure this policy setting, when a separate program is used to launch Microsoft Excel, PowerPoint,
    or Word programmatically, any macros can run in the programmatically opened application without being blocked.'
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'Verify the policy value for User Configuration -> Administrative Templates -> Microsoft

    Office 2016 -> Security Settings "Automation Security" is set to "Enabled (Use

    application macro security level)".

    Procedure: Use the Windows Registry Editor to navigate to the following key:

    HKCU\Software\Policies\Microsoft\Office\Common\Security

    Criteria: If the value AutomationSecurity is REG_DWORD = 2, this is not a finding.'
  remediation: 'Set the policy value for User Configuration -> Administrative Templates -> Microsoft

    Office 2016 -> Security Settings "Automation Security" to "Enabled (Use application

    macro security level)".'
  checks:
  - type: manual_review
    info: 'Verify the policy value for User Configuration -> Administrative Templates -> Microsoft

      Office 2016 -> Security Settings "Automation Security" is set to "Enabled (Use

      application macro security level)".

      Procedure: Use the Windows Registry Editor to navigate to the following key:

      HKCU\Software\Policies\Microsoft\Office\Common\Security

      Criteria: If the value AutomationSecurity is REG_DWORD = 2, this is not a finding.'
    severity: medium
- id: '1.10'
  title: DTOO196
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'A mix of policy and user locations for Office Products must be disallowed. GROUP ID: V-238033 RULE ID: SV-238033r961863'
  rationale: This policy setting controls whether trusted locations can be defined by users, the Office Customization Tool
    (OCT), and Group Policy, or if they must be defined by Group Policy alone. If you enable this policy setting, users can
    specify any location as a trusted location, and a computer can have a combination of user-created, OCT-created, and Group
    Policy-created trusted locations. If you disable this policy setting, all trusted locations that are not created by Group
    Policy are disabled and users cannot create new trusted locations in the Trust Center. If you do not configure this policy
    setting, the behavior is the equivalent of setting the policy to Enabled. Note - InfoPath 2016 and Outlook 2016 do not
    recognize trusted locations, and therefore are unaffected by this policy setting.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'Verify the policy value for User Configuration -> Administrative Templates -> Microsoft

    Office 2016 -> Security Settings -> Trust Center "Allow mix of policy and user locations"

    is set to "Disabled".

    Procedure: Use the Windows Registry Editor to navigate to the following key:

    HKCU\Software\Policies\Microsoft\Office\16.0\common\security\trusted locations

    Criteria: If the value Allow User Locations is REG_DWORD = 0, this is not a finding.'
  remediation: 'Set the policy value for User Configuration -> Administrative Templates -> Microsoft

    Office 2016 -> Security Settings -> Trust Center "Allow mix of policy and user locations"

    to "Disabled".'
  checks:
  - type: manual_review
    info: 'Verify the policy value for User Configuration -> Administrative Templates -> Microsoft

      Office 2016 -> Security Settings -> Trust Center "Allow mix of policy and user locations"

      is set to "Disabled".

      Procedure: Use the Windows Registry Editor to navigate to the following key:

      HKCU\Software\Policies\Microsoft\Office\16.0\common\security\trusted locations

      Criteria: If the value Allow User Locations is REG_DWORD = 0, this is not a finding.'
    severity: medium
- id: '1.11'
  title: DTOO197
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Smart Documents use of Manifests in Office must be disallowed. GROUP ID: V-238034 RULE ID: SV-238034r961863'
  rationale: This policy setting controls whether Office 2016 applications can load an XML expansion pack manifest file with
    a Smart Document. An XML expansion pack is the group of files that constitutes a Smart Document in Excel and Word. You
    package one or more components that provide the logic needed for a Smart Document by using an XML expansion pack. These
    components can include any type of file, including XML schemas, Extensible Stylesheet Language Transforms (XSLTs), dynamic-link
    libraries (DLLs), and image files, as well as additional XML files, HTML files, Word files, Excel files, and text files.
    The key component to building an XML expansion pack is creating an XML expansion pack manifest file. By creating this
    file, you specify the locations of all files that make up the XML expansion pack, as well as information that instructs
    Office 2016 how to set up the files for your Smart Document. The XML expansion pack can also contain information about
    how to set up some files, such as how to install and register a COM object required by the XML expansion pack. If you
    enable this policy setting, Office 2016 applications cannot load XML expansion packs with Smart Documents. If you disable
    or do not configure this policy setting, Office 2016 applications can load an XML expansion pack manifest file with a
    Smart Document.
