  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'Amazon Linux 2023 must require the change of at least 50 percent of the total number of characters when passwords
    are changed. GROUP ID: V-274136 RULE ID: SV-274136r1120697'
  rationale: 'If Amazon Linux 2023 allows the user to consecutively reuse extensive portions of passwords, this increases
    the chances of password compromise by increasing the window of opportunity for attempts at guessing and brute-force attacks.
    The number of changed characters refers to the number of changes required with respect to the total number of positions
    in the current password. In other words, characters may be the same within the two passwords; however, the positions of
    the like characters must be different. If the password length is an odd number then number of changed characters must
    be rounded up. For example, a password length of 15 characters must require the change of at least 8 characters. Satisfies:
    SRG-OS-000072-GPOS-00040, SRG-OS-000725-GPOS-00180'
