- id: '1.140'
  title: AZLX-23-002355
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'Amazon Linux 2023 must enforce password complexity by requiring that at least one uppercase character be used.
    GROUP ID: V-274133 RULE ID: SV-274133r1120387'
  rationale: 'Use of a complex password helps to increase the time and resources required to compromise the password. Password
    complexity, or strength, is a measure of the effectiveness of a password in resisting attempts at guessing and brute-force
    attacks. Password complexity is one factor of several that determines how long it takes to crack a password. The more
    complex the password, the greater the number of possible combinations that need to be tested before the password is compromised.
    Satisfies: SRG-OS-000069-GPOS-00037, SRG-OS-000725-GPOS-00180'
  impact: ''
  references: []
  page_start: 304
  audit_raw: 'Verify Amazon Linux 2023 enforces password complexity by requiring that at least one

    uppercase character with the following command:

    $ sudo grep ucredit /etc/security/pwquality.conf

    /etc/security/pwquality.conf.d/*.conf

    ucredit = -1

    If the value of "ucredit" is a positive number or is commented out, this is a finding.'
  remediation: 'Configure Amazon Linux 2023 to enforce password complexity by requiring that at least

    one uppercase character be used by setting the "ucredit" option.

    Add or update the following line in the "/etc/security/pwquality.conf" file or a

    configuration file in the "/etc/security/pwquality.conf.d/" directory to contain the "ucredit"

    parameter:

    ucredit = -1

    Remove any configurations that conflict with the above value.'
  checks:
  - type: manual_review
    info: 'Verify Amazon Linux 2023 enforces password complexity by requiring that at least one

      uppercase character with the following command:

      $ sudo grep ucredit /etc/security/pwquality.conf

      /etc/security/pwquality.conf.d/*.conf

      ucredit = -1

      If the value of "ucredit" is a positive number or is commented out, this is a finding.'
    severity: medium
