    /sbin/auditd /sbin/rsyslogd /sbin/augenrules

    755 /sbin/auditctl 755 /sbin/aureport 755 /sbin/ausearch 750 /sbin/autrace 755

    /sbin/auditd 755 /sbin/rsyslogd 755 /sbin/augenrules

    If any of the audit tool files have a mode more permissive than "0755", this is a finding.'
  remediation: 'Configure Amazon Linux 2023 audit tools to have a mode of "0755" by running the

