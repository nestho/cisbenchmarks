    directives, policies, regulations, standards, and guidance. System use notifications are required only for access via
    logon interfaces with human users and are not required when such human interfaces do not exist. The banner must be formatted
    in accordance with applicable DOD policy. Use the following verbiage for operating systems that can accommodate banners
