    management officer (IMO)/information system security officer (ISSO) and system administrators (SAs) must be notified via
    email and/or monitoring system trap when there is an unauthorized modification of a configuration item. Notifications
    provided by information systems include messages to local computer consoles, and/or hardware indications, such as lights.
    This capability must take into account operational requirements for availability for selecting an appropriate response.
    The organization may choose to shut down or restart the information system upon security function anomaly detection. Satisfies:
