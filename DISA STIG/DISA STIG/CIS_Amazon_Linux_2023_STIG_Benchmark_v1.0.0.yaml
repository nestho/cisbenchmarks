- id: '1.157'
  title: AZLX-23-002435
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Amazon Linux 2023 must automatically expire temporary accounts within 72 hours. GROUP ID: V-274150 RULE ID:
    SV-274150r1120438'
  rationale: Temporary accounts are privileged or nonprivileged accounts that are established during pressing circumstances,
    such as new software or hardware configuration or an incident response, where the need for prompt account activation requires
    bypassing normal account authorization procedures. If any inactive temporary accounts are left enabled on the system and
    are not either manually removed or automatically expired within 72 hours, the security posture of the system will be degraded
    and exposed to exploitation by unauthorized users or insider threat actors. Temporary accounts are different from emergency
    accounts. Emergency accounts, also known as "last resort" or "break glass" accounts, are local logon accounts enabled
    on the system for emergency use by authorized system administrators to manage a system when standard logon methods are
    failing or not available. Emergency accounts are not subject to manual removal or scheduled expiration requirements. The
    automatic expiration of temporary accounts may be extended as needed by the circumstances but it must not be extended
    indefinitely. A documented permanent account must be established for privileged users who need long-term maintenance accounts.
  impact: ''
  references: []
  page_start: 335
  audit_raw: 'Verify Amazon Linux 2023 temporary accounts have been provisioned with an

    expiration date of 72 hours.

    For every existing temporary account, run the following command to obtain its account

    expiration information:

    $ sudo chage -l <temporary_account_name> | grep -i "account expires"

    Verify each of these accounts has an expiration date set within 72 hours.

    If any temporary accounts have no expiration date set or do not expire within 72 hours,

    this is a finding.'
  remediation: 'Configure Amazon Linux 2023 to expire temporary accounts after 72 hours with the

    following command:

    $ sudo chage -E $(date -d +3days +%Y-%m-%d) <temporary_account_name>'
  checks:
  - type: command
