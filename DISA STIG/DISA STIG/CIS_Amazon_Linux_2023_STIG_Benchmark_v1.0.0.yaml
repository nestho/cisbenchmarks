- id: '1.154'
  title: AZLX-23-002420
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'Amazon Linux 2023 must automatically lock an account when three unsuccessful logon attempts occur. GROUP ID:
    V-274147 RULE ID: SV-274147r1120429'
  rationale: 'By limiting the number of failed logon attempts, the risk of unauthorized system access via user password guessing,
    otherwise known as brute-force attacks, is reduced. Limits are imposed by locking the account. Amazon Linux 2023 can utilize
    the "pam_faillock.so" for this purpose. Note that manual changes to the listed files may be overwritten by the "authselect"
    program. From "Pam_Faillock" man pages: Note that the default directory that "pam_faillock" uses is usually cleared on
    system boot so the access will be re-enabled after system reboot. If that is undesirable, a different tally directory
    must be set with the "dir" option.'
  impact: ''
  references: []
  page_start: 330
  audit_raw: 'Verify Amazon Linux 2023 locks an account after three unsuccessful logon attempts

    with the following commands:

    Note: If the system administrator demonstrates the use of an approved centralized

    account management method that locks an account after three unsuccessful logon

    attempts within a period of 15 minutes, this requirement is met by that method.

    $ sudo grep pam_faillock.so /etc/pam.d/password-auth

    auth required pam_faillock.so preauth dir=/var/log/faillock silent audit deny=3

    even_deny_root fail_interval=900 unlock_time=0

    auth required pam_faillock.so authfail dir=/var/log/faillock unlock_time=0

    account required pam_faillock.so

    If the "deny" option is not set to "3" or less (but not "0") on the "preauth" line with the

    "pam_faillock.so" module, or is missing from this line, if any of the lines are commented

    out, or are missing, this is a finding.'
  remediation: 'Configure Amazon Linux 2023 to lock an account when three unsuccessful logon

    attempts occur.

    Add/Modify the appropriate sections of the "/etc/pam.d/system-auth" and

    "/etc/pam.d/password-auth" files to match the following lines:

    auth required pam_faillock.so preauth dir=/var/log/faillock silent audit deny=3

    even_deny_root fail_interval=900 unlock_time=0

    auth required pam_faillock.so authfail dir=/var/log/faillock unlock_time=0

    account required pam_faillock.so

    The "sssd" service must be restarted for the changes to take effect. To restart the "sssd"

    service, run the following command:

    $ sudo systemctl restart sssd.service'
  checks:
  - type: manual_review
    info: 'Verify Amazon Linux 2023 locks an account after three unsuccessful logon attempts

      with the following commands:

      Note: If the system administrator demonstrates the use of an approved centralized

      account management method that locks an account after three unsuccessful logon

      attempts within a period of 15 minutes, this requirement is met by that method.

      $ sudo grep pam_faillock.so /etc/pam.d/password-auth

      auth required pam_faillock.so preauth dir=/var/log/faillock silent audit deny=3

      even_deny_root '
    severity: medium
