- id: '1.68'
  title: AZLX-23-001300
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'Amazon Linux 2023 must implement certificate status checking for multifactor authentication. GROUP ID: V-274061
    RULE ID: SV-274061r1120171'
  rationale: 'Using an authentication device, such as a DOD Common Access Card (CAC) or token that is separate from the information
    system, ensures that even if the information system is compromised, credentials stored on the authentication device will
    not be affected. Multifactor solutions that require devices separate from information systems gaining access include,
    for example, hardware tokens providing time-based or challengeresponse authenticators and smart cards such as the U.S.
    Government Personal Identity Verification (PIV) card and the DOD CAC. Amazon Linux 2023 includes multiple options for
    configuring certificate status checking, but for this requirement focuses on the System Security Services Daemon (SSSD).
    By default, SSSD performs Online Certificate Status Protocol (OCSP) checking and certificate verification using a sha256
    digest function. Satisfies: SRG-OS-000375-GPOS-00160, SRG-OS-000377-GPOS-00162'
  impact: ''
  references: []
  page_start: 152
  audit_raw: 'Note: If the system administrator (SA) demonstrates the use of an approved alternate

    multifactor authentication method, this requirement is not applicable.

    Verify Amazon Linux 2023 implements Online Certificate Status Protocol (OCSP) and is

    using the proper digest value on the system with the following command:

    $ sudo grep -ir certificate_verification /etc/sssd/sssd.conf

    /etc/sssd/conf.d/ | grep -v "^#"

    certificate_verification = ocsp_dgst=sha512

    If the certificate_verification line is missing from the [sssd] section, or is missing

    "ocsp_dgst=sha512", ask the administrator to indicate what type of multifactor

    authentication is being utilized and how the system implements certificate status

    checking.

    If there is no evidence of certificate status checking being used, this is a finding.'
  remediation: 'Configure Amazon Linux 2023 to implement certificate status checking for multifactor

    authentication.

    Review the "/etc/sssd/conf.d/certificate_verification.conf" file to determine if the system

    is configured to prevent OCSP or certificate verification.

    Add the following line to the "/etc/sssd/conf.d/certificate_verification.conf" file:

    certificate_verification = ocsp_dgst=sha512

    Set the correct ownership and permissions on the

    "/etc/sssd/conf.d/certificate_verification.conf" file by running these commands:

    $ sudo chown root:root "/etc/sssd/conf.d/certificate_verification.conf"

    $ sudo chmod 600 "/etc/sssd/conf.d/certificate_verification.conf"

    The "sssd" service must be restarted for the changes to take effect. To restart the "sssd"

    service, run the following command:

    $ sudo systemctl restart sssd.service'
  checks:
  - type: command
    command: /etc/sssd/conf.d/ | grep -v "^#"
    expected: ''
    severity: medium
    info: 'Note: If the system administrator (SA) demonstrates the use of an approved alternate

      multifactor authentication method, this requirement is not applicable.

