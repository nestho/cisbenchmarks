    network connections associated with communications sessions includes, for example, de-allocating associated TCP/IP address/port
    pairs at Amazon Linux 2023 level, and de-allocating networking assignments at the application level if multiple application
    sessions are using a single operating system-level network connection. This does not mean that Amazon Linux 2023 terminates
