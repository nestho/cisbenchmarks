    running the following command:

    $ sudo firewall-cmd --list-all

    Ask the system administrator for the site or program PPSM Component Local Service

    Assessment (CLSA). Verify the services allowed by the firewall match the PPSM CLSA.

    If there are additional ports, protocols, or services that are not in the PPSM CLSA, or

    there are ports, protocols, or services that are prohibited by the PPSM CAL, or there are

    no firewall rules configured, this is a finding.'
  remediation: 'Configure Amazon Linux 2023 to Prohibit/Restrict Functions, Ports, Protocols, Services.

    Use firewall-cmd to manage firewalld.

    For example, to block a specific port (8080), use: sudo firewall-cmd --permanent --

    remove-port=8080/tcp'
  checks:
  - type: manual_review
    info: 'Verify Amazon Linux 2023 firewall is configured to block unregistered ports, protocols,

      and services.

