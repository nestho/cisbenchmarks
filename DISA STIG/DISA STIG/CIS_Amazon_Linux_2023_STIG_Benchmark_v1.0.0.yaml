- id: '1.70'
  title: AZLX-23-001310
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Amazon Linux 2023, for PKI-based authentication, must validate certificates by constructing a certification
    path (which includes status information) to an accepted trust anchor. GROUP ID: V-274063 RULE ID: SV-274063r1120712'
  rationale: 'Without path validation, an informed trust decision by the relying party cannot be made when presented with
    any certificate not already explicitly trusted. A trust anchor is an authoritative entity represented via a public key
    and associated data. It is used in the context of public key infrastructures, X.509 digital certificates, and DNSSEC.
    When there is a chain of trust, usually the top entity to be trusted becomes the trust anchor; it can be, for example,
    a Certification Authority (CA). A certification path starts with the subject certificate and proceeds through a number
    of intermediate certificates up to a trusted root certificate, typically issued by a trusted CA. This requirement verifies
    that a certification path to an accepted trust anchor is used for certificate validation and that the path includes status
    information. Path validation is necessary for a relying party to make an informed trust decision when presented with any
    certificate not already explicitly trusted. Status information for certification paths includes certificate revocation
    lists or online certificate status protocol responses. Validation of the certificate status information is out of scope
    for this requirement. Satisfies: SRG-OS-000066-GPOS-00034, SRG-OS-000775-GPOS-00230, SRG-OS000384-GPOS-00167, SRG-OS-000403-GPOS-00182'
  impact: ''
  references: []
  page_start: 156
  audit_raw: 'Note: If the system administrator (SA) demonstrates the use of an approved alternate

    multifactor authentication method, this requirement is not applicable.

    Verify Amazon Linux 2023 for PKI-based authentication has valid certificates by

    constructing a certification path (which includes status information) to an accepted trust

    anchor.

    Check that the system has a valid DOD root CA installed with the following command:

    $ sudo openssl x509 -text -in /etc/sssd/pki/sssd_auth_ca_db.pem

    Certificate: Data: Version: 3 (0x2) Serial Number: 1 (0x1) Signature Algorithm:

    sha256WithRSAEncryption Issuer: C = US, O = U.S. Government, OU = DOD, OU =

    PKI, CN = DOD Root CA 3 Validity Not Before: Mar 20 18:46:41 2012 GMT Not After :

    Dec 30 18:46:41 2029 GMT Subject: C = US, O = U.S. Government, OU = DOD, OU =

    PKI, CN = DOD Root CA 3 Subject Public Key Info: Public Key Algorithm: rsaEncryption

    If the root ca file is not a DOD-issued certificate with a valid date and installed in the

    /etc/sssd/pki/sssd_auth_ca_db.pem location, this is a finding.'
  remediation: 'Configure Amazon Linux 2023 to have valid certificates by using AWS Certificate

    Manager (ACM) or another certificate manager to manage SSL/TLS certificates.

    In the AWS Management Console, request or import the necessary SSL/TLS

    certificates into ACM.

    ACM will handle the certificate lifecycle management, including validation and trust

    chain establishment.'
  checks:
  - type: manual_review
    info: 'Note: If the system administrator (SA) demonstrates the use of an approved alternate

      multifactor authentication method, this requirement is not applicable.

      Verify Amazon Linux 2023 for PKI-based authentication has valid certificates by

      constructing a certification path (which includes status information) to an accepted trust

      anchor.

      Check that the system has a valid DOD root CA installed with the following command:

      $ sudo openssl x509 -text -in /etc/sssd/pki/sssd_auth_ca_db.pem

      Certificate: Data'
    severity: medium
- id: '1.71'
  title: AZLX-23-001315
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Amazon Linux 2023, for PKI-based authentication, must enforce authorized access to the corresponding private
    key. GROUP ID: V-274064 RULE ID: SV-274064r1120180'
  rationale: If the private key is discovered, an attacker can use the key to authenticate as an authorized user and gain
    access to the network infrastructure. The cornerstone of the PKI is the private key used to encrypt or digitally sign
    information. If the private key is stolen, this will lead to the compromise of the authentication and nonrepudiation gained
    through PKI because the attacker can use the private key to digitally sign documents and pretend to be the authorized
    user. Both the holders of a digital certificate and the issuing authority must protect the computers, storage devices,
    or whatever they use to keep the private keys.
  impact: ''
  references: []
  page_start: 159
  audit_raw: 'Verify Amazon Linux 2023 SSH private key files have a passcode.

