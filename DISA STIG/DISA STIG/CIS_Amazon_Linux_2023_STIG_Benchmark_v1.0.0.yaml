- id: '1.165'
  title: AZLX-23-002475
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Amazon Linux 2023 must be configured to prohibit or restrict the use of functions, ports, protocols, and/or
    services, as defined in the Ports, Protocols, and Services Management Category Assurance List (PPSM CAL) and vulnerability
    assessments. GROUP ID: V-274158 RULE ID: SV-274158r1120727'
  rationale: 'To prevent unauthorized connection of devices, unauthorized transfer of information, or unauthorized tunneling
    (i.e., embedding of data types within data types), organizations must disable or restrict unused or unnecessary physical
    and logical ports/protocols on information systems. Operating systems are capable of providing a variety of functions
    and services. Some of the functions and services provided by default may not be necessary to support essential organizational
    operations. Additionally, it is sometimes convenient to provide multiple services from a single component (e.g., VPN and
    IPS); however, doing so increases risk over limiting the services provided by any one component. To support the requirements
    and principles of least functionality, Amazon Linux 2023 must support the organizational requirements, providing only
    essential capabilities and limiting the use of ports, protocols, and/or services to only those required, authorized, and
    approved to conduct official business or to address authorized quality of life issues. Satisfies: SRG-OS-000096-GPOS-00050,
    SRG-OS-000297-GPOS-00115'
  impact: ''
  references: []
  page_start: 346
  audit_raw: 'Verify Amazon Linux 2023 firewall is configured to block unregistered ports, protocols,

    and services.

