  remediation: 'Configure Amazon Linux 2023 SSH private key files to have a passcode.

    Create a new private and public key pair that utilizes a passcode with the following

    command:

    $ sudo ssh-keygen -n [passphrase]'
  checks:
  - type: manual_review
    info: 'Verify Amazon Linux 2023 SSH private key files have a passcode.

