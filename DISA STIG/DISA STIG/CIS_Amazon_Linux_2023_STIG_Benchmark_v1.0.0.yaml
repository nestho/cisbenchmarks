  description: 'Amazon Linux 2023 must allocate audit record storage capacity to store at least one week''s worth of audit
    records, when audit records are not immediately sent to a central audit record storage facility. GROUP ID: V-274067 RULE
    ID: SV-274067r1120653'
  rationale: To ensure operating systems have a sufficient storage capacity in which to write the audit logs, operating systems
    must be able to allocate audit record storage capacity.
  impact: ''
  references: []
  page_start: 167
  audit_raw: 'Verify Amazon Linux 2023 allocates audit record storage capacity to store at least one

    week of audit records when audit records are not immediately sent to a central audit

    record storage facility.

    Note: The partition size needed to capture a week of audit records is based on the

    activity level of the system and the total storage capacity available. Typically 10.0 GB of

    storage space for audit records should be sufficient.

    Determine which partition the audit records are being written to with the following

    command:

    $ sudo grep log_file /etc/audit/auditd.conf

    log_file = /var/log/audit/audit.log

    Check the size of the partition that audit records are written to with the following

    command and verify whether it is sufficiently large:

    df -h /var/log/audit/

    /dev/sda2 24G 10.4G 13.6G 43% /var/log/audit

    If the audit record partition is not allocated for sufficient storage capacity, this is a

    finding.'
  remediation: 'Configure Amazon Linux 2023 to provide adequate storage for at least one-week of

    audit logs when audit records are not immediately sent to a central audit record storage

    facility.

    If the storage partition is not large enough for at least one week of audit logs, then

    either:

    1. Resize the partition to ensure there is enough storage capacity.

    2. Create a new partition for the audit logs.'
  checks:
  - type: manual_review
    info: 'Verify Amazon Linux 2023 allocates audit record storage capacity to store at least one

