    used by multiple individuals. Use of a group authenticator alone does not uniquely identify individual users. Examples
    of the group authenticator are the Unix OS "root" user account, the Windows "Administrator" account, the "sa" account,
    or a "helpdesk" account. For example, the Unix and Windows operating systems offer a "switch user" capability allowing
    users to authenticate with their individual credentials and, when needed, switch" to the administrator role. This method
    provides for unique individual authentication prior to using a group authenticator. Users (and any processes acting on
    behalf of users) need to be uniquely identified and authenticated for all accesses other than those accesses explicitly
    identified and documented by the organization, which outlines specific user actions that can be performed on Amazon Linux
    2023 without identification or authentication. Requiring individuals to be authenticated with an individual authenticator
    prior to using a group authenticator allows for traceability of actions, as well as adding an additional level of protection
    of the actions that can be taken with group account knowledge.
