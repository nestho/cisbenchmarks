controls:
- id: '1.1'
  title: AZLX-23-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Amazon Linux 2023 local disk partitions must implement cryptographic mechanisms to prevent unauthorized disclosure
    or modification of all information that requires at rest protection. GROUP ID: V-273994 RULE ID: SV-273994r1119970'
  rationale: 'Information at rest refers to the state of information when it is located on a secondary storage device (e.g.,
    disk drive and tape drive, when used for backups) within an operating system. This requirement addresses protection of
    user-generated data, as well as operating system-specific configuration data. Organizations may choose to employ different
    mechanisms to achieve confidentiality and integrity protections, as appropriate, in accordance with the security category
    and/or classification of the information. Satisfies: SRG-OS-000185-GPOS-00079, SRG-OS-000404-GPOS-00183, SRG-OS000405-GPOS-00184'
  impact: ''
  references: []
  page_start: 18
  audit_raw: 'Verify Amazon Linux 2023 is configured so that all partitions are encrypted with the

    following command:

    $ sudo blkid

    /dev/xvda1: UUID="ed0acbe9-bd05-495e-a9ac-cb615b29327d" TYPE="crypto_LUKS"

    Every persistent disk partition present must be of "Type" "crypto_LUKS".

    If any partitions other than the boot partition, bios partition or pseudo file systems (such

    as /proc or /sys) are not type "crypto_LUKS", this is a finding.'
  remediation: 'Configure Amazon Linux 2023 to protect the confidentiality and integrity of all

    information at rest.

    Encrypting a partition in an already installed system is more difficult, because existing

    partitions will need to be resized and changed.

    To encrypt an entire partition, dedicate a partition for encryption in the partition layout.'
  checks:
  - type: manual_review
    info: 'Verify Amazon Linux 2023 is configured so that all partitions are encrypted with the

      following command:

      $ sudo blkid

      /dev/xvda1: UUID="ed0acbe9-bd05-495e-a9ac-cb615b29327d" TYPE="crypto_LUKS"

      Every persistent disk partition present must be of "Type" "crypto_LUKS".

      If any partitions other than the boot partition, bios partition or pseudo file systems (such

      as /proc or /sys) are not type "crypto_LUKS", this is a finding.'
    severity: medium
- id: '1.2'
  title: AZLX-23-000110
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Amazon Linux 2023 must ensure cryptographic verification of vendor software packages. GROUP ID: V-273995 RULE
    ID: SV-273995r1119973'
  rationale: Cryptographic verification of vendor software packages ensures that all software packages are obtained from a
    valid source and protects against spoofing that could lead to installation of malware on the system. Amazon Linux cryptographically
    signs all software packages, which includes updates, with a GPG key to Verify they are valid.
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'Verify Amazon Linux 2023 package-signing keys are installed on the system and verify

    their fingerprints match vendor values.

    Note: For Amazon Linux 2023 software packages, AWS uses GPG keys defined in key

    file "/etc/pki/rpm-gpg/RPM-GPG-KEY-amazon-linux-2023" by default.

    List Amazon Linux GPG keys installed on the system:

    $ sudo rpm -q gpg-pubkey --qf "%{NAME}-%{VERSION}-%{RELEASE} %{SUMMARY}\n"

    gpg-pubkey-d832c631-6515c85e Amazon Linux amazon-linux@amazon.com public key

    If there is no Amazon Linux GPG key installed, this is a finding.

    Extract the fingerprint from the key with this command:

    $ sudo gpg -q --keyid-format short --with-fingerprint /etc/pki/rpm-gpg/RPMGPG-KEY-amazon-linux-2023

    pub rsa4096/D832C631 2022-12-08 [SC] Key fingerprint = B21C 50FA 44A9 9720

    EAA7 2F7F E951 904A D832 C631 uid Amazon Linux amazon-linux@amazon.com

    Compare the Key fingerprint with the key fingerprint from Amazon Documentation and

    instructions at https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/verifykeys.html

    If key fingerprints do not match, or the key file is missing, this is a finding.'
  remediation: 'Configure Amazon Linux 2023 to have the public key for verifying RPM packages to be

    installed with the "system-release" package.

    Install the system-release installation with the following command:

    $ sudo dnf install -y system-release

    Ensure cryptographic verification of software packages is enabled by editing

    /etc/dnf/dnf.conf and under ''[main]'' in the configuration file add:

    gpgcheck=1'
  checks:
  - type: manual_review
    info: 'Verify Amazon Linux 2023 package-signing keys are installed on the system and verify

      their fingerprints match vendor values.

      Note: For Amazon Linux 2023 software packages, AWS uses GPG keys defined in key

      file "/etc/pki/rpm-gpg/RPM-GPG-KEY-amazon-linux-2023" by default.

      List Amazon Linux GPG keys installed on the system:

      $ sudo rpm -q gpg-pubkey --qf "%{NAME}-%{VERSION}-%{RELEASE} %{SUMMARY}\n"

      gpg-pubkey-d832c631-6515c85e Amazon Linux amazon-linux@amazon.com public key

      If there is no Amazon Lin'
    severity: medium
- id: '1.3'
  title: AZLX-23-000115
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'Amazon Linux 2023 must check the GPG signature of locally installed software packages before installation.
    GROUP ID: V-273996 RULE ID: SV-273996r1119976'
  rationale: Changes to any software components can have significant effects on the overall security of Amazon Linux 2023.
    This requirement ensures the software has not been tampered with and that it has been provided by a trusted vendor. All
    software packages must be signed with a cryptographic key recognized and approved by the organization. Verifying the authenticity
    of software prior to installation validates the integrity of the software package received from a vendor. This verifies
    the software has not been tampered with and that it has been provided by a trusted vendor.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'Verify Amazon Linux 2023 is configured so that dnf always checks the GPG signature of

    locally installed software packages before installation:

    $ grep localpkg_gpgcheck /etc/dnf/dnf.conf

    localpkg_gpgcheck=1

    If "localpkg_gpgcheck" is not set to "1" or "True", or if the option is missing or

    commented out, ask the system administrator how the GPG signatures of local software

    packages are being verified.

    If there is no process to verify GPG signatures approved by the organization, this is a

    finding.'
  remediation: 'Configure Amazon Linux 2023 to always check the GPG signature of local software

    packages before installation.

    Add or update the following line in the [main] section of the /etc/dnf/dnf.conf file:

    localpkg_gpgcheck=1'
  checks:
  - type: manual_review
    info: 'Verify Amazon Linux 2023 is configured so that dnf always checks the GPG signature of

      locally installed software packages before installation:

      $ grep localpkg_gpgcheck /etc/dnf/dnf.conf

      localpkg_gpgcheck=1

      If "localpkg_gpgcheck" is not set to "1" or "True", or if the option is missing or

      commented out, ask the system administrator how the GPG signatures of local software

      packages are being verified.

      If there is no process to verify GPG signatures approved by the organization, this is a

      finding.'
    severity: medium
