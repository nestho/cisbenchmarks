- id: '1.153'
  title: AZLX-23-002415
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Amazon Linux 2023 must automatically remove or disable temporary user accounts after 72 hours. GROUP ID: V-274146
    RULE ID: SV-274146r1120426'
  rationale: If temporary user accounts remain active when no longer needed or for an excessive period, these accounts may
    be used to gain unauthorized access. To mitigate this risk, automated termination of all temporary accounts must be set
    upon account creation.
  impact: ''
  references: []
  page_start: 328
  audit_raw: 'Verify Amazon Linux 2023 temporary accounts have been provisioned with an

    expiration date of 72 hours.

    For every existing temporary account, run the following command to obtain its account

    expiration information.

    $ sudo chage -l system_account_name

    Verify each of these accounts has an expiration date set within 72 hours.

    If any temporary accounts have no expiration date set or do not expire within 72 hours,

    this is a finding.'
  remediation: 'Configure Amazon Linux 2023 temporary accounts to have an expiration date of 72

    hours.

    If a temporary account must be created configure the system to terminate the account

    after a 72 hour time period with the following command to set an expiration date on it.

    Substitute "system_account_name" with the account to be created.

    $ sudo chage -E $(date -d +3days +%Y-%m-%d) system_account_name'
  checks:
  - type: manual_review
    info: 'Verify Amazon Linux 2023 temporary accounts have been provisioned with an

      expiration date of 72 hours.

      For every existing temporary account, run the following command to obtain its account

      expiration information.

      $ sudo chage -l system_account_name

      Verify each of these accounts has an expiration date set within 72 hours.

      If any temporary accounts have no expiration date set or do not expire within 72 hours,

      this is a finding.'
