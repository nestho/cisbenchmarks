  audit_raw: 'Verify Amazon Linux 2023 is configured to audit the execution of the "sudo" command

    with the following command:

    $ sudo auditctl -l | grep ''/usr/bin/sudo\b''

    -a always,exit -S all -F path=/usr/bin/sudo -F perm=x -F auid>=1000 -F auid!=-1 -F

    key=priv_cmd

    If the command does not return a line, or the line is commented out, this is a finding.'
  remediation: 'Configure Amazon Linux 2023 so that the audit system generates an audit event for any

    successful/unsuccessful use of the "sudo" command by adding or updating the following

