- id: '1.5'
  title: AZLX-23-000125
  scoring: scored
  profile:
  - 'SEVERITY: CAT I'
  description: 'Amazon Linux 2023 must have GPG signature verification enabled for all software repositories. GROUP ID: V-273998
    RULE ID: SV-273998r1119982'
  rationale: Changes to any software components can have significant effects on the overall security of Amazon Linux 2023.
    This requirement ensures the software has not been tampered with and that it has been provided by a trusted vendor. All
    software packages must be signed with a cryptographic key recognized and approved by the organization. Verifying the authenticity
    of software prior to installation validates the integrity of the software package received from a vendor. This verifies
    the software has not been tampered with and that it has been provided by a trusted vendor.
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'Verify Amazon Linux 2023 software repositories enforce a signature check on the

    packages prior to allowing installation with the following command:

    $ grep -w gpgcheck /etc/yum.repos.d/*.repo | more

    /etc/yum.repos.d/amazonlinux.repo:gpgcheck=1

    /etc/yum.repos.d/amazonlinux.repo:gpgcheck=1

    /etc/yum.repos.d/amazonlinux.repo:gpgcheck=1 /etc/yum.repos.d/kernellivepatch.repo:gpgcheck=1 /etc/yum.repos.d/kernel-livepatch.repo:gpgcheck=1

    If any repository has "gpgcheck=0" or "False", or if the option is commented out, this is

    a finding.'
  remediation: 'Configure Amazon Linux 2023 to verify the signature of packages from a repository

    prior to installation by setting the following option in the

    "/etc/yum.repos.d/[your_repo_name].repo" file:

    gpgcheck=1'
  checks:
  - type: manual_review
    info: 'Verify Amazon Linux 2023 software repositories enforce a signature check on the

      packages prior to allowing installation with the following command:

      $ grep -w gpgcheck /etc/yum.repos.d/*.repo | more

      /etc/yum.repos.d/amazonlinux.repo:gpgcheck=1

      /etc/yum.repos.d/amazonlinux.repo:gpgcheck=1

      /etc/yum.repos.d/amazonlinux.repo:gpgcheck=1 /etc/yum.repos.d/kernellivepatch.repo:gpgcheck=1 /etc/yum.repos.d/kernel-livepatch.repo:gpgcheck=1

      If any repository has "gpgcheck=0" or "False", or if the option is c'
    severity: medium
- id: '1.6'
  title: AZLX-23-000130
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'Amazon Linux 2023 must be a vendor-supported release. GROUP ID: V-273999 RULE ID: SV-273999r1155171'
  rationale: 'An operating system release is considered "supported" if the vendor continues to provide security patches for
    the product. With an unsupported release, it will not be possible to resolve security issues discovered in the system
    software. Amazon Linux 2023 (AL2023) was released in March 2023 and will be supported until June 30, 2029. Standard support
    ends June 30, 2027. Maintenance (security and critical fixes only) ends June 30, 2029. To check the support status and
    dates of individual packages, use the following command: $ sudo dnf supportinfo --pkg <packagename> To get information
    on all currently installed packages, use: $ sudo dnf supportinfo --show installed'
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'Verify Amazon Linux 2023 is a vendor-supported version with the following command:

    $ cat /etc/amazon-linux-release

    Amazon Linux release 2023.6.20250203 (Amazon Linux)

    If the installed version of Amazon Linux 2023 is not supported, this is a finding.'
  remediation: 'Configure Amazon Linux 2023 to be a vendor supported release.

    Upgrade to a supported version of Amazon Linux 2023.'
  checks:
  - type: manual_review
    info: 'Verify Amazon Linux 2023 is a vendor-supported version with the following command:

      $ cat /etc/amazon-linux-release

      Amazon Linux release 2023.6.20250203 (Amazon Linux)

      If the installed version of Amazon Linux 2023 is not supported, this is a finding.'
    severity: medium
- id: '1.7'
  title: AZLX-23-000135
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'Amazon Linux 2023 systemd-journald service must be enabled. GROUP ID: V-274000 RULE ID: SV-274000r1119988'
  rationale: Failure to a known state can address safety or security in accordance with the mission/business needs of the
    organization. Failure to a known secure state helps prevent a loss of confidentiality, integrity, or availability in the
    event of a failure of the information system or a component of the system. Preserving operating system state information
    helps to facilitate operating system restart and return to the operational mode of the organization with least disruption
    to mission/business processes.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'Verify Amazon Linux 2023 is configured so that "systemd-journald" is active with the

    following command:

    $ systemctl is-active systemd-journald

    active

    If the systemd-journald service is not active, this is a finding.'
  remediation: 'Configure Amazon Linux 2023 to enable the systemd-journald service with the following

    command:

    $ sudo systemctl enable --now systemd-journald'
  checks:
  - type: manual_review
    info: 'Verify Amazon Linux 2023 is configured so that "systemd-journald" is active with the

      following command:

      $ systemctl is-active systemd-journald

      active

      If the systemd-journald service is not active, this is a finding.'
    severity: medium
- id: '1.8'
  title: AZLX-23-000200
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'Amazon Linux 2023 must restrict access to the kernel message buffer. GROUP ID: V-274001 RULE ID: SV-274001r1119991'
  rationale: 'Preventing unauthorized information transfers mitigates the risk of information, including encrypted representations
    of information, produced by the actions of prior users/roles (or the actions of processes acting on behalf of prior users/roles)
    from being available to any current users/roles (or current processes) that obtain access to shared system resources (e.g.,
    registers, main memory, hard disks) after those resources have been released back to information systems. The control
    of information in shared resources is also commonly referred to as object reuse and residual information protection. This
    requirement generally applies to the design of an information technology product, but it can also apply to the configuration
    of particular information system components that are, or use, such products. This can be verified by acceptance/validation
    processes in DOD or other government agencies. There may be shared resources with configurable protections (e.g., files
    in storage) that may be assessed on specific information system components. Restricting access to the kernel message buffer
    limits access to only root. This prevents attackers from gaining additional system information as a nonprivileged user.
    Satisfies: SRG-OS-000132-GPOS-00067, SRG-OS-000138-GPOS-00069'
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'Verify Amazon Linux 2023 is configured to restrict access to the kernel message buffer

    with the following commands:

    Check the status of the kernel.dmesg_restrict kernel parameter.

    $ sudo sysctl kernel.dmesg_restrict

    kernel.dmesg_restrict = 1

    If "kernel.dmesg_restrict" is not set to "1" or is missing, this is a finding.'
  remediation: 'Configure Amazon Linux 2023 to restrict access to the kernel message buffer.

    Add or edit the following line in a system configuration file, in the "/etc/sysctl.d/"

    directory:

    kernel.dmesg_restrict = 1

    Load settings from all system configuration files with the following command:

    $ sudo sysctl --system'
  checks:
  - type: manual_review
    info: 'Verify Amazon Linux 2023 is configured to restrict access to the kernel message buffer

      with the following commands:

      Check the status of the kernel.dmesg_restrict kernel parameter.

      $ sudo sysctl kernel.dmesg_restrict

      kernel.dmesg_restrict = 1

      If "kernel.dmesg_restrict" is not set to "1" or is missing, this is a finding.'
    severity: medium
- id: '1.9'
  title: AZLX-23-000205
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'Amazon Linux 2023 must prevent kernel profiling by nonprivileged users. GROUP ID: V-274002 RULE ID: SV-274002r1119994'
  rationale: 'Preventing unauthorized information transfers mitigates the risk of information, including encrypted representations
    of information, produced by the actions of prior users/roles (or the actions of processes acting on behalf of prior users/roles)
    from being available to any current users/roles (or current processes) that obtain access to shared system resources (e.g.,
    registers, main memory, hard disks) after those resources have been released back to information systems. The control
    of information in shared resources is also commonly referred to as object reuse and residual information protection. This
    requirement generally applies to the design of an information technology product, but it can also apply to the configuration
    of particular information system components that are, or use, such products. This can be verified by acceptance/validation
    processes in DOD or other government agencies. There may be shared resources with configurable protections (e.g., files
    in storage) that may be assessed on specific information system components. Setting the kernel.perf_event_paranoid kernel
    parameter to "2" prevents attackers from gaining additional system information as a nonprivileged user. Satisfies: SRG-OS-000132-GPOS-00067,
    SRG-OS-000138-GPOS-00069'
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'Verify Amazon Linux 2023 is configured to prevent kernel profiling by nonprivileged

    users with the following commands:

    Check the status of the kernel.perf_event_paranoid kernel parameter.

    $ sudo sysctl kernel.perf_event_paranoid

    kernel.perf_event_paranoid = 2

    If "kernel.perf_event_paranoid" is not set to "2" or is missing, this is a finding.'
  remediation: 'Configure Amazon Linux 2023 to prevent kernel profiling by nonprivileged users.

    Add or edit the following line in a system configuration file, in the "/etc/sysctl.d/"

    directory:

    kernel.perf_event_paranoid = 2

    Load settings from all system configuration files with the following command:

    $ sudo sysctl --system'
  checks:
  - type: manual_review
    info: 'Verify Amazon Linux 2023 is configured to prevent kernel profiling by nonprivileged

      users with the following commands:

      Check the status of the kernel.perf_event_paranoid kernel parameter.

      $ sudo sysctl kernel.perf_event_paranoid

      kernel.perf_event_paranoid = 2

      If "kernel.perf_event_paranoid" is not set to "2" or is missing, this is a finding.'
    severity: medium
- id: '1.10'
  title: AZLX-23-000210
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'Amazon Linux 2023 must restrict exposed kernel pointer addresses access. GROUP ID: V-274003 RULE ID: SV-274003r1119997'
  rationale: 'Exposing kernel pointers (through procfs or "seq_printf()") exposes kernel writeable structures, which may contain
    functions pointers. If a write vulnerability occurs in the kernel, allowing write access to any of this structure, the
    kernel can be compromised. This option disallows any program without the CAP_SYSLOG capability to get the addresses of
    kernel pointers by replacing them with "0". Satisfies: SRG-OS-000132-GPOS-00067, SRG-OS-000433-GPOS-00192'
  impact: ''
  references: []
  page_start: 35
  audit_raw: 'Verify Amazon Linux 2023 restricts exposed kernel pointer addresses access by

    validating the runtime status of the Amazon Linux 2023 kernel.kptr_restrict kernel

    parameter with the following command:

    $ sudo sysctl kernel.kptr_restrict

    kernel.kptr_restrict = 1

    If "kernel.kptr_restrict" is not set to "1" or is missing, this is a finding.'
  remediation: 'Configure Amazon Linux 2023 to restrict exposed kernel pointer addresses access.

    Add or edit the following line in a system configuration file in the "/etc/sysctl.d/"

    directory:

    kernel.kptr_restrict = 1

    Reload settings from all system configuration files with the following command:

    $ sudo sysctl --system'
  checks:
  - type: manual_review
    info: 'Verify Amazon Linux 2023 restricts exposed kernel pointer addresses access by

      validating the runtime status of the Amazon Linux 2023 kernel.kptr_restrict kernel

      parameter with the following command:

      $ sudo sysctl kernel.kptr_restrict

      kernel.kptr_restrict = 1

      If "kernel.kptr_restrict" is not set to "1" or is missing, this is a finding.'
    severity: medium
- id: '1.11'
  title: AZLX-23-000215
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'Amazon Linux 2023 must disable access to network bpf system call from nonprivileged processes. GROUP ID: V-274004
    RULE ID: SV-274004r1120000'
  rationale: Loading and accessing the packet filters programs and maps using the bpf() system call has the potential of revealing
    sensitive information about the kernel state.
  impact: ''
  references: []
  page_start: 37
  audit_raw: 'Verify Amazon Linux 2023 prevents privilege escalation through the kernel by disabling

    access to the bpf system call with the following commands:

    $ sudo sysctl kernel.unprivileged_bpf_disabled

    kernel.unprivileged_bpf_disabled = 1

    If the returned line does not have a value of "1", or a line is not returned, this is a

    finding.'
  remediation: 'Configure Amazon Linux 2023 to prevent privilege escalation through the kernel by

    disabling access to the bpf syscall by adding the following line to a file, in the

    "/etc/sysctl.d" directory:

    kernel.unprivileged_bpf_disabled = 1

    The system configuration files must be reloaded for the changes to take effect. To

    reload the contents of the files, run the following command:

    $ sudo sysctl --system'
  checks:
  - type: manual_review
    info: 'Verify Amazon Linux 2023 prevents privilege escalation through the kernel by disabling

      access to the bpf system call with the following commands:

      $ sudo sysctl kernel.unprivileged_bpf_disabled

      kernel.unprivileged_bpf_disabled = 1

      If the returned line does not have a value of "1", or a line is not returned, this is a

      finding.'
    severity: medium
- id: '1.12'
  title: AZLX-23-000220
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'Amazon Linux 2023 must restrict usage of ptrace to descendant processes. GROUP ID: V-274005 RULE ID: SV-274005r1120003'
  rationale: Unrestricted usage of ptrace allows compromised binaries to run ptrace on other processes of the user. Like this,
    the attacker can steal sensitive information from the target processes (e.g., SSH sessions, web browser, etc.) without
    any additional assistance from the user (i.e., without resorting to phishing).
  impact: ''
  references: []
  page_start: 39
  audit_raw: 'Verify Amazon Linux 2023 restricts usage of ptrace to descendant processes with the

    following commands:

    $ sudo sysctl kernel.yama.ptrace_scope

    kernel.yama.ptrace_scope = 1

    If the returned line does not have a value of "1", or a line is not returned, this is a

    finding.'
  remediation: 'Configure Amazon Linux 2023 to restrict usage of ptrace to descendant processes by

    adding the following line to a file, in the "/etc/sysctl.d" directory:

    kernel.yama.ptrace_scope = 1

    The system configuration files need to be reloaded for the changes to take effect. To

    reload the contents of the files, run the following command:

    $ sudo sysctl --system'
  checks:
  - type: manual_review
    info: 'Verify Amazon Linux 2023 restricts usage of ptrace to descendant processes with the

      following commands:

      $ sudo sysctl kernel.yama.ptrace_scope

      kernel.yama.ptrace_scope = 1

      If the returned line does not have a value of "1", or a line is not returned, this is a

      finding.'
    severity: medium
- id: '1.13'
  title: AZLX-23-000225
  scoring: scored
  profile:
  - 'SEVERITY: CAT II'
  description: 'Amazon Linux 2023 must implement address space layout randomization (ASLR) to protect its memory from unauthorized
    code execution. GROUP ID: V-274006 RULE ID: SV-274006r1120006'
  rationale: ASLR makes it more difficult for an attacker to predict the location of attack code they have introduced into
    a process' address space during an attempt at exploitation. Additionally, ASLR makes it more difficult for an attacker
    to know the location of existing code to repurpose it using return oriented programming (ROP) techniques.
  impact: ''
  references: []
  page_start: 41
  audit_raw: 'Verify Amazon Linux 2023 is implementing ASLR with the following command:

    $ sysctl kernel.randomize_va_space

    kernel.randomize_va_space = 2

    Check that the configuration files are present to enable this kernel parameter. Verify the

    configuration of the kernel.kptr_restrict kernel parameter with the following command:

    $ sudo /usr/lib/systemd/systemd-sysctl --cat-config | egrep -v ''^(#|;)'' |

    grep -F kernel.randomize_va_space | tail -1

    kernel.randomize_va_space = 2

    If "kernel.randomize_va_space" is not set to "2" or is missing, this is a finding.'
  remediation: 'Configure Amazon Linux 2023 to enable ASLR to enhance memory protection.

    Enable ASLR by setting the kernel parameter with the following command: echo 2 |

    sudo tee /proc/sys/kernel/randomize_va_space

    Add or edit the following line in a system configuration file in the "/etc/sysctl.d/"

    directory:

    kernel.randomize_va_space = 2

    Reload settings from all system configuration files with the following command:

    $ sudo sysctl --system'
  checks:
  - type: command
    command: grep -F kernel.randomize_va_space | tail -1
    expected: ''
