- id: '1.4'
  title: APPNET0052
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Encryption keys used for the .NET Strong Name Membership Condition must be protected. GROUP ID: V-225226 RULE
    ID: SV-225226r961041'
  rationale: The Strong Name Membership condition requires that member assemblies be defined with Strong Names. A strong name
    consists of the assembly's identity, simple text name, version number, and culture information (if provided) — plus a
    public key and a digital signature. If assemblies do not have a strong name assigned, the assembly cannot be unique and
    the author of the code cannot be uniquely identified. In order to create the strong name, the developer must use a cryptographic
    key pair to sign the assembly. If the developer does not protect the key, the key can be stolen and used to sign any application,
    including malware applications. This could adversely affect application integrity and confidentiality.
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'If the application is a COTS product, this requirement is Not Applicable (NA).

    The infrastructure to enable Code Access Security (CAS) exists only in .NET

