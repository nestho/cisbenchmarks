- id: '1.13'
  title: APPNET0065
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Trust must be established prior to enabling the loading of remote code in .Net 4. GROUP ID: V-225233 RULE
    ID: SV-225233r961608'
  rationale: In the .NET Framework version 3.5 and earlier versions, if an application assembly loaded code/objects from a
    remote location, that assembly would run partially trusted with a permissions grant set that depended on the zone in which
    it was loaded. For example, if an assembly was loaded from a web site, it was loaded into the Internet zone and granted
    the Internet permission set. In other words, it was executed in an Internet sandbox. If the same program is run in the
    .NET Framework version 4, an exception is thrown which effectively states; either explicitly create a sandbox for the
    assembly or run it in full trust. The <loadFromRemoteSources> element specifies the assemblies that run partially trusted
    in earlier versions of the .NET Framework will be run fully trusted in the .NET Framework 4. If loadFromRemoteSources
    is set to true, the remotely loaded application code is granted full trust. This could create an integrity vulnerability
    on the system. The required method to address this is to explicitly create a sandboxed environment for the remotely loaded
    code to run in rather than allowing remotely loaded code to run with full trust. The appropriate level of trust must be
    established prior to enabling the loading of remote code in .Net 4 applications and that code must be run in a controlled
    environment. The following is an example of the use of loadFromRemoteSources.
  impact: ''
  references: []
  page_start: 38
  audit_raw: 'Open Windows explorer and search for *.exe.config.

    Search each config file found for the "loadFromRemoteSources" element.

    If the loadFromRemoteSources element is enabled

    ("loadFromRemoteSources enabled = true"), and the remotely loaded application is not

    run in a sandboxed environment, or if OS based software controls, such as AppLocker

    or Software Security Policies, are not utilized, this is a finding.'
  remediation: '.Net application code loaded from a remote source must be run in a controlled

    environment.

    A controlled environment consists of a sandbox, such as running in an Internet Explorer

    host environment or employing OS based software access controls, such as AppLocker

    or Software Security Policies, when application design permits.

    Obtain documented IAO approvals for all remotely loaded code.'
  checks:
  - type: manual_review
    info: 'Open Windows explorer and search for *.exe.config.

      Search each config file found for the "loadFromRemoteSources" element.

      If the loadFromRemoteSources element is enabled

      ("loadFromRemoteSources enabled = true"), and the remotely loaded application is not

      run in a sandboxed environment, or if OS based software controls, such as AppLocker

      or Software Security Policies, are not utilized, this is a finding.'
    severity: medium
- id: '1.14'
  title: APPNET0070
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Software utilizing .Net 4.0 must be identified and relevant access controls configured. GROUP ID: V-225236
    RULE ID: SV-225236r1069477'
  rationale: With the advent of .Net 4.0, the .Net framework no longer directly configures or enforces security policy for
    .Net applications. This task is now relegated to the operating system layer and the security protections built-in to .Net
    application "runtime hosts" that run on the O.S. Examples of these .Net "runtime hosts" include; Internet Explorer, Windows
    Shell, ASP.NET, Database Engines or any other "runtime hosts" that utilize .Net and load the .Net CLR. Security protections
    include utilizing runtime host security controls such as sandboxing to restrict or control application behavior as designed
    or required. To compensate for these design changes, Windows provides native solutions such as Software Security Policies
    (SSP) and Application Locker (AL) which are technologies that can be implemented via Group Policy (GPO). SSP, AL and similar
    third party solutions serve to restrict execution of applications, scripts and libraries based upon cryptographic hash,
    security zones, path and certificate values that are associated with the application files. Additionally, application
    developers will utilize "sandboxing" techniques within their code in order to isolate 3rd party code libraries from critical
    system resources. In order to assign protections to .Net 4.0 applications, the applications must first be identified and
    the appropriate hosting security mechanisms configured to accomplish that task. .Net STIG guidance cannot be applied if
    .Net applications are not identified and documented. The lack of an application inventory introduces confidentiality,
    availability and integrity vulnerabilities to the system.
  impact: ''
  references: []
  page_start: 40
  audit_raw: 'This requirement does not apply to the "caspol.exe" assembly or other assemblies

    provided with the Windows OS or the Windows Secure Host Baseline (SHB).

    Ask the system administrator to provide documentation that identifies:

    • Each .Net 4.0 application run on the system.

    • The .Net runtime host that invokes the application.

    • The security measures employed to control application access to system

    resources or user access to application.

    For additional insight run: tasklist /fi "modules eq mscoree.dll"

    If all .Net applications, runtime hosts and security protections have been documented or

    if there are no .Net 4.0 applications existing on the system, this is not a finding.

    If there is no documentation that identifies the existence of .NET 4.0 applications or the

    lack thereof, this is a finding.

    If the runtime hosts have not been identified, this is a finding.

    If the security protections have not been identified, this is a finding.'
  remediation: 'Document the existence of all .Net 4.0 applications that are not provided by the host

    Windows OS or the Windows Secure Host Baseline (SHB).

    Document the corresponding runtime hosts that are used to invoke the applications.

    Document the applications security control requirements (restricting application access

    to resources or user access to the application).'
  checks:
  - type: manual_review
    info: 'This requirement does not apply to the "caspol.exe" assembly or other assemblies

      provided with the Windows OS or the Windows Secure Host Baseline (SHB).

      Ask the system administrator to provide documentation that identifies:

