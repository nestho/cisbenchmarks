    If the "etwEnable" element is set to "true", this is not a finding.

    If the "etwEnable" element is set to "false" and documented approvals by the IAO are

    not provided, this is a finding.'
  remediation: 'Open Windows explorer and search for all .NET config files including application config

    files (*.exe.config).

    Examine the configuration settings for

    <etwEnable enabled="false" />.

    Enable ETW Tracing by setting the etwEnable flag to "true" or obtain documented IAO

    approvals.'
