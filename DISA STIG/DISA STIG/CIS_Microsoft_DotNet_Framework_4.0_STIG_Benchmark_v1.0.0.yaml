    element in the config file.

    TCP channel example:

    The TCP channel provides encryption and message integrity when the "secure" flag is

    set to "true" as shown in the above example.

    If the "secure" flag is not set to "true" for the TCP channel, this is a finding.'
  remediation: 'If .NET remoting with TCP channel is not used, this fix is Not Applicable.

    Ensure encryption and message integrity are used for TCP remoting channels.

    TCP remoting connections are protected via the secure=true configuration parameter.

    Include the secure="true" flag in the channel ref parameter of the machine.config and

