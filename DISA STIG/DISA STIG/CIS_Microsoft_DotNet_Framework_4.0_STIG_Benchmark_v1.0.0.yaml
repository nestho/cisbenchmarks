  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Event tracing for Windows (ETW) for Common Language Runtime events must be enabled. GROUP ID: V-225235 RULE
    ID: SV-225235r960891'
  rationale: Event tracing captures information about applications utilizing the .NET CLR and the .NET CLR itself. This includes
    security oriented information, such as Strong Name and Authenticode verification. Beginning with Windows Vista, ETW is
    enabled by default however, the .Net CLR and .Net applications can be configured to not utilize Event Tracing. If ETW
    event tracing is disabled, critical events that occurred within the runtime will not be captured in event logs.
