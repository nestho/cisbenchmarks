    518206DC093344D5AD293: FullTrust

    4. 1.1.2. StrongName - 00000000000000000400000000000000: FullTrust

    5. 1.2. Zone - Intranet: LocalIntranet

    6. 1.2.1. All code: Same site Web

    7. 1.2.2. All code: Same directory FileIO - ''Read, PathDiscovery''

    8. 1.3. Zone - Internet: Internet

    9. 1.3.1. All code: Same site Web

    10. 1.4. Zone - Untrusted: Nothing

    11. 1.5. (First Match) Zone - Trusted: Internet

    12. 1.5.1. All code: Same site Web

    13. 1.6. Publisher -

    30818902818100E47B359ACC061D70C237B572FA276C9854CFABD469DFB7

    4E77D026630BEE2A0C2F8170A823AE69FDEB65704D7FD446DEFEF1F6BA1

    2B6ACBDB1BFA7B9B595AB9A40636467CFF7C73F198B53A9A7CF177F6E78

    96EBC591DD3003C5992A266C0AD9FBEE4E2A056BE7F7ED154D806F7965F

    83B0AED616C192C6416CFCB46FC2F5CFD0203010001: FullTrust

    14. Success

    An assembly will satisfy the StrongNameMembershipCondition if its metadata contains

    the strongly identifying data associated with the specified strong name. At the least, this

    means it has been digitally signed with the private key associated with the public key

    recorded in the policy.

    The presence of the encryption key values in the StrongName field indicates the use of

    StrongNameMembershipCondition.

    If a Strong Name Membership Condition is assigned to a non-default Code Group the

    private key must be adequately protected by the software developer or the entity

    responsible for signing the assemblies.

    Ask the Systems Programmer how the private keys are protected.

    Private keys are simply values stored as strings of data. Keys can be stored in files on

    the file system or in a centralized data repository.

    Adequate protection methods include, but are not limited to:

    • utilizing centralized key management;

    • using strict file permissions to limit access; and

    • tying strong pass phrases to the key.

    If the private key used to sign the assembly is not adequately protected, this is a finding.'
  remediation: 'Ask the Systems Programmer how the private keys used to sign the assembly are

    protected.

    Private keys are simply values stored as strings of data. Keys can be stored in files on

    the file system or in a centralized data repository.

    Adequate protection methods include, but are not limited to:

    • utilizing centralized key management;

    • using strict file permissions to limit access; and

    • tying strong pass phrases to the key.

    The private key(s) used to sign the assembly must be protected. Utilize centralized key

    management or strict file permissions along with strong pass phrases and/or other wellestablished industry practices for
    managing and controlling access to private keys.'
