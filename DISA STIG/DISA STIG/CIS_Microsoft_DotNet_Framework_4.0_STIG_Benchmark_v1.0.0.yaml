controls:
- id: '1.1'
  title: APPNET0031
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Digital signatures assigned to strongly named assemblies must be verified. GROUP ID: V-225223 RULE ID: SV-225223r961038'
  rationale: A strong name consists of the assembly's identity, simple text name, version number, and culture information
    (if provided)—plus a public key and a digital signature. Strong names serve to identify the author of the code. If digital
    signatures used to sign strong name assemblies are not verified, any self signed code can be impersonated. This can lead
    to a loss of system integrity.
  impact: ''
  references: []
  page_start: 10
  audit_raw: 'Use regedit to review the Windows registry key

    HKLM\Software\Microsoft\StrongName\Verification.

    There should be no assemblies or hash values listed under this registry key. If the

    StrongName\Verification key does not exist, this is not a finding.

    If there are assemblies or hash values listed in this key, each value represents a distinct

    application assembly that does not have the application strong name verified.

    If any assemblies are listed as omitting strong name verification in a production

    environment, this is a finding.

    If any assemblies are listed as omitting strong name verification in a development or

    test environment and the IAO has not provided documented approvals, this is a finding.'
  remediation: 'Use regedit to remove the values stored in Windows registry key

    HKLM\Software\Microsoft\StrongName\Verification. There should be no assemblies or

    hash values listed under this registry key.

    All assemblies must require strong name verification in a production environment.

    Strong name assemblies that do not require verification in a development or test

    environment must have documented approvals from the IAO.'
  checks:
  - type: manual_review
    info: 'Use regedit to review the Windows registry key

