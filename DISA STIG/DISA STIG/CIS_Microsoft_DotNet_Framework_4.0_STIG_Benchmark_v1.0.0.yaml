- id: '1.2'
  title: APPNET0046
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Trust Providers Software Publishing State must be set to 0x23C00. GROUP ID: V-225224 RULE ID: SV-225224r961038'
  rationale: 'Microsoft Windows operating systems provide a feature called Authenticode. Authenticode technology and its underlying
    code signing mechanisms serve to provide a structure to identify software publishers and ensure that software applications
    have not been tampered with. Authenticode technology relies on digital certificates and is based on Public Key Cryptography
    Standards (PKCS) #7 (encrypted key specification), PKCS #10 (certificate request formats), X.509 (certificate specification),
    and Secure Hash Algorithm (SHA) and MD5 hash algorithms. The manner in which the Authenticode technology validates a certificate
    and determines what is considered a valid certificate can be modified to meet the mission of the Microsoft Windows system.
    Each facade of certificate validation is controlled through the bits that makeup the hexadecimal value for the Authenticode
    setting. An improper setting will allow non-valid certificates to be accepted and can put the integrity of the system
    into jeopardy. The hexadecimal value of 0x23C00 will implement the following certificate enforcement policy: • Trust the
    Test Root = FALSE • Use expiration date on certificates = TRUE • Check the revocation list = TRUE • Offline revocation
    server OK (Individual) = TRUE • Offline revocation server OK (Commercial) = TRUE • Java offline revocation server OK (Individual)
    = TRUE • Java offline revocation server OK (Commercial) = TRUE • Invalidate version 1 signed objects = FALSE • Check the
    revocation list on Time Stamp Signer = FALSE • Only trust items found in the Trust DB = FALSE'
  impact: ''
  references: []
  page_start: 12
  audit_raw: 'If the system or application being reviewed is SIPR based, this finding is NA.

    This check must be performed for each user on the system.

    Use regedit to locate "HKEY_USER[UNIQUE USER SID

    VALUE]\Software\Microsoft\Windows\CurrentVersion\WinTrust\Trust

    Providers\Software Publishing\State".

    If the State value for any user is not set to the hexadecimal value of 0x23C00, this is a

    finding.'
  remediation: 'This fix must be performed for each user on the system.

    Using regedit, change the hexadecimal value of the "HKEY_USER[UNIQUE USER SID

    VALUE]\Software\Microsoft\Windows\CurrentVersion\WinTrust\Trust

    Providers\Software Publishing\State" registry key to 0x23C00.'
  checks:
  - type: manual_review
    info: 'If the system or application being reviewed is SIPR based, this finding is NA.

      This check must be performed for each user on the system.

      Use regedit to locate "HKEY_USER[UNIQUE USER SID

      VALUE]\Software\Microsoft\Windows\CurrentVersion\WinTrust\Trust

      Providers\Software Publishing\State".

      If the State value for any user is not set to the hexadecimal value of 0x23C00, this is a

      finding.'
    severity: medium
- id: '1.3'
  title: APPNET0048
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Developer certificates used with the .NET Publisher Membership Condition must be approved by the ISSO. GROUP
    ID: V-225225 RULE ID: SV-225225r961038'
  rationale: A .Net assembly will satisfy the Publisher Membership Condition if it is signed with a software publisher’s Authenticode
    X.509v3 digital certificate that can be verified by the Windows operating system as having a chain of trust that leads
    to a trusted root certificate stored in the user’s certificate store. The Publisher Membership Condition can be used to
    identify an organization, developer, vendor, or other entity as the ultimate source of the assembly, even if the code
    itself was obtained from a third party, such as a mirror site. Access to system resources, such as file systems or printers,
    may then be granted to the assembly based on the trust relationship with the identified entity. Certificates used to sign
    assemblies so the Publisher Member Condition may be applied must originate from a trusted source. Using a certificate
    that is not from a trusted source could potentially violate system integrity and confidentiality.
  impact: ''
  references: []
  page_start: 14
  audit_raw: 'The infrastructure to enable Code Access Security (CAS) exists only in .NET

    Framework 2.x-4.x.

    This requirement is Not Applicable (NA) for .NET Framework greater than 4.x.

    (Note: The infrastructure is deprecated and is not receiving servicing or security fixes.)

    Caspol.exe is a Microsoft tool used for working with .Net policy. Use caspol.exe to list

    the code groups and any publisher membership conditions.

    The location of the caspol utility is dependent upon the system architecture of the

    system running .Net.

    For 32 bit systems, caspol.exe is located at

    %SYSTEMROOT%\Microsoft.NET\Framework\v4.0.30319.

    For 64 bit systems, caspol.exe is located at

    %SYSTEMROOT%\Microsoft.NET\Framework64\v4.0.30319.

    Example:

    cd %SYSTEMROOT%\Microsoft.NET\Framework\v4.0.30319

    To check code groups for the machine, run the following command:

    caspol.exe -m -lg

    Sample Results:

