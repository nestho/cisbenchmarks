- id: '1.6'
  title: APPNET0060
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Remoting Services HTTP channels must utilize authentication and encryption. GROUP ID: V-225228 RULE ID: SV-225228r1043178'
  rationale: 'Note: Microsoft recommends using the Windows Communication Framework (WCF) rather than using .Net remoting.
    New development projects should refrain from using .Net remoting capabilities whenever possible. .NET remoting provides
    the capability to build widely distributed applications. The application components may reside all on one computer or
    they may be spread out across the enclave. .NET client applications can make remoting calls to use objects in other processes
    on the same computer or on any other computer that is reachable over the network. .NET remoting can also be used to communicate
    with other application domains within the same process. Remoting is achieved via the exposure of endpoints that can be
    used to establish remote connectivity. Normally when application code attempts to access a protected resource, a stack
    walk is performed to ensure that all stack frames have permission to access the resource. However, with .Net 4.0, when
    a call is made on a remote object, this stack walk is not performed across the remoting boundary. The .Net remoting infrastructure
    requires FullTrust permission to execute on either the client or the server. Due to the fact that FullTrust permission
    is required, Remoting endpoints should be authenticated and encrypted in order to protect the system and the data. Microsoft
    provides three different "channels" that are used for remoting. They are HTTP, TCP, and IPC. Any unauthorized use of a
    remoting application provides unauthorized access with FullTrust permissions to the system. This can potentially result
    in a loss of system integrity or confidentiality.'
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'If .NET remoting with HTTP channel is not used, this check is Not Applicable.

    Review the machine.config file and the [application name].exe.config file.

    For 32-bit systems, the "machine.config" file is contained in the following folder:

    %SYSTEMROOT%\Microsoft.NET\Framework\v4.0.30319\Config

    For 64-bit systems, the "machine.config" file is contained in the following folder:

    %SYSTEMROOT%\Microsoft.NET\Framework64\v4.0.30319\Config.

    Microsoft specifies locating the [application].config file in the same folder as the

    application executable (.exe) file. However, the developer does have the capability to

    specify a different location when the application is compiled. Therefore, if the file is not

    found in the application home folder, a search of the system is required. If the

    [application name].exe.config file is not found on the system, then only a check of the

    machine.config file is required.

    Sample machine/application config file:

    Microsoft provides three "channels" that are used for remoting connectivity. They are

    the HTTP, TCP, and IPC channels. The channel that is used is specified via the

    element in the config file.

    HTTP channel example:

    <channel ref=“http server” port=“80”/>

    The HTTP channel only supports encryption and message integrity when the remote

    object is hosted in Internet Information Services (IIS) using TLS.

    The above example shows the well-known TLS port of 443 is not being used.

    If the HTTP remoting channel is not configured to protect the channel by using TLS

    encryption, this is a finding.'
  remediation: 'If .NET remoting with HTTP channel is not used, this fix is Not Applicable.

    Ensure encryption and message integrity are used for HTTP remoting channels.

    The HTTP channel only supports encryption and message integrity when the remote

    object is hosted in Internet Information Services (IIS) using TLS.

    HTTP channels are protected via TLS (HTTPS).

    <channel ref=“http server” port=“443”/>

    Change the channel ref parameter to utilize a TLS port and leverage TLS on the remote

    IIS server.'
  checks:
  - type: manual_review
    info: 'If .NET remoting with HTTP channel is not used, this check is Not Applicable.

