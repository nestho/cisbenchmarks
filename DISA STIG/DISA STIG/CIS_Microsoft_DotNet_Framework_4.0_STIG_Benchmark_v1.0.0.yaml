    severity: medium
- id: '1.15'
  title: APPNET0071
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'Remoting Services TCP channels must utilize authentication and encryption. GROUP ID: V-225237 RULE ID: SV-225237r1043178'
  rationale: 'Note: Microsoft recommends using the Windows Communication Framework (WCF) rather than .Net remoting. New development
    projects should refrain from using .Net remoting capabilities whenever possible. .NET remoting provides the capability
    to build widely distributed applications. The application components may reside all on one computer or they may be spread
    out across the enclave. .NET client applications can make remoting calls to use objects in other processes on the same
    computer or on any other computer that is reachable over the network. .NET remoting can also be used to communicate with
    other application domains within the same process. Remoting is achieved via the exposure of endpoints that can be used
    to establish remote connectivity. Normally when application code attempts to access a protected resource, a stack walk
    is performed to ensure that all stack frames have permission to access the resource. However, with .Net 4.0, when a call
    is made on a remote object, this stack walk is not performed across the remoting boundary. The .Net remoting infrastructure
    requires FullTrust permission to execute on either the client or the server. Due to the fact that FullTrust permission
    is required, Remoting endpoints should be authenticated and encrypted in order to protect the system and the data. Microsoft
    provides three different "channels" that are used for remoting. They are HTTP, TCP, and IPC. Any unauthorized use of a
    remoting application provides unauthorized access with FullTrust permissions to the system. This can potentially result
    in a loss of system integrity or confidentiality.'
  impact: ''
  references: []
  page_start: 42
  audit_raw: 'If .NET remoting with TCP channel is not used, this check is Not Applicable.

