- id: '1.3'
  title: Ensure only authorized local administrative accounts exist and a local emergency-access account is retained
  scoring: manual
  profile:
  - Level 1
  description: If your environment does not possess any mechanisms for delegated account management, or you have a need for
    additional local accounts for use as service accounts or for handling administration during network outages, FlashArray
    supports creating additional local administrative accounts. If no management SAML configuration can be enabled, and no
    management LDAP directory service can be enabled, then Everpure recommends that you create one or more local administrators.
  rationale: FlashArray can create local administrative accounts, and assign them a role to govern their permissions. These
    accounts have a locally managed password and authorization policies. Local administrative users may also login via SSH
    using a public key or SSH certificates if configured, and may login via the REST API with an API Token or OAuth JWTs if
    configured.
  impact: Deleting or disabling local accounts for users who still require access will lock them out of the array. If all
    local accounts are removed and the directory service becomes unavailable simultaneously, administrative access may be
    unrecoverable without Everpure Technical Services involvement. Always maintain at least one local emergency access account
    with array_admin privileges.
  references: []
  page_start: 26
  audit_raw: 'To align with the security recommendations, verify that all local administrative accounts

    on the array correspond to authorized users or active service accounts, and that any

    stale or former employee accounts have been removed.

    From the GUI:

    • Navigate to Settings > Access > Users and Policies.

    • Under the Array tab, review the Users panel to inspect the list of configured local

    accounts.

    • Compare this list against your organization''s authorized personnel and service

    accounts, verifying that accounts for former employees or decommissioned

    services no longer exist.

    From the CLI:

    • Run the command pureadmin list to enumerate all local administrator

    accounts.

    • Review the output to confirm each account has a documented business

    justification and is actively required.'
  remediation: 'To align with the security recommendations, delete any local user accounts that are no

    longer authorized to access the FlashArray. Always ensure you maintain at least one

    local emergency access account with array_admin privileges in the event directory

    services or SAML become unavailable.

    From the GUI:

    • Navigate to Settings > Access > Users and Policies.

    • In the Users panel, click the Edit (three vertical dots) icon for the user account

    • In the Delete User pop-up window, click Delete to confirm.

    From the CLI:

    • Delete an unauthorized or stale account using the pureadmin delete

    command.

    • Command Syntax: pureadmin delete <USERNAME>

    • Example: pureadmin delete obsolete_admin (Note: Once deleted, the user

    can no longer access the array, and deleted users cannot be restored).'
  checks:
  - type: manual_review
    info: 'To align with the security recommendations, verify that all local administrative accounts

      on the array correspond to authorized users or active service accounts, and that any

      stale or former employee accounts have been removed.

      From the GUI:

