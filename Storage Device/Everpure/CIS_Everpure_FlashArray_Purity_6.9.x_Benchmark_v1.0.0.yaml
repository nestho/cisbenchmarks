- id: '3.4'
  title: Ensure a hard-limit quota policy is enforced on the root managed directory of every file system
  scoring: scored
  profile:
  - Level 2
  description: FlashArray supports configuring quota policies in order to enforce space consumption limits on directories.
    These allow you to limit the total amount of space any directory and its child files and directories can consume. Quota
    policies can be configured to use a soft limit, meaning they only alert when space exceeds the limit, or enforce a hard
    limit, meaning that new writes to the directory will be blocked when it is detected that the limit has been exceeded.
    Everpure recommends that you configure a quota policy that enforces a hard limit on the root managed directory for every
    file system.
  rationale: When strong security is configured to prevent malicious destruction of data, it also creates the risk that a
    malicious actor can write junk data to fill up a storage array, causing a system-wide outage. • Enforcing space limits
    ensures that even if a malicious actor gains access to one directory, they cannot consume all the space on the system.
    • Enforcing a space limit on the root directory of every file system ensures that, regardless of configurations and exports
    of sub-directories, that file system will not be able to consume all of the space on the system.
  impact: When a quota is reached, write operations to the affected directory will fail with a diskfull error, which may cause
    application errors or backup failures. Quota limits should be set with sufficient headroom to avoid unexpected interruptions,
    and quota utilization should be monitored and alerted on before the limit is reached.
  references: []
  page_start: 112
  audit_raw: 'To align with the security recommendations, verify that an enforced (hard limit) directory

    quota policy is actively configured and applied to the root managed directory of every

    file system. This ensures that no single file system can be maliciously filled to consume

    the entire storage array.

