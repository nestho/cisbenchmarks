- id: '1.14'
  title: Ensure at least one remote management syslog server is configured
  scoring: scored
  profile:
  - Level 1
  description: FlashArray allows the creation of management syslog servers. These servers receive messages for administrative
    audit logs, administrative session logs, and alerts. Everpure recommends that you configure at least 1 management syslog
    server.
  rationale: Syslog servers allow proactive push notifications of changes and events on the system, which can allow for real-time
    detection and response to unexpected events.
  impact: Syslog forwarding consumes network bandwidth and requires available capacity on the receiving syslog server. If
    the syslog server becomes unreachable, the FlashArray will continue to operate normally but may buffer or lose unsent
    log entries, depending on configuration.
