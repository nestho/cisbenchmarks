- id: '2.7'
  title: Ensure SNMP, if enabled, uses SNMPv3 with SHA authentication and AES privacy
  scoring: scored
  profile:
  - Level 1
  description: 'FlashArray supports configuring the simple network management protocol (SNMP). An SNMP agent can be configured
    on the array, allowing external clients to query the array using SNMP for information such as performance metrics and
    array details. SNMP managers can also be configured to receive alerts. Everpure recommends that you do not utilize SNMP
    unless your environment requires it. If SNMP is enabled, Everpure recommends the following: • Utilize SNMPv3, not SNMPv2c.
    • Configure an authentication passphrase with SHA as the authentication protocol. The authentication passphrase should
    be 8 characters or longer, and sufficiently complex. • Configure a privacy passphrase with AES as the privacy protocol.
    The privacy passphrase should be 8 characters or longer, and sufficiently complex.'
  rationale: SNMP as a protocol is necessary in some environments, where retrieving metrics and configuration via a REST API
    may not be feasible, or where email or syslog delivery of alerts may not be available. SNMPv2c has weak authentication,
    and should not be used. When using SNMPv3, it is important to use strong passwords for authentication and privacy.
  impact: Migrating from SNMP v2c to v3 requires updates to all monitoring tools and network management systems that poll
    the FlashArray. SNMP v3 configuration requires that both the FlashArray and the monitoring tool are configured with matching
    authentication and privacy credentials.
  references: []
  page_start: 90
  audit_raw: 'To align with the security recommendations, verify that if SNMP is utilized, it is strictly

    configured for SNMPv3 with an authentication protocol of SHA (with a passphrase of 8

    characters or more) and a privacy protocol of AES (with a passphrase of 8 characters or

    more).

    From the GUI:

    • Navigate to Settings > System.

    • Locate the SNMP panel.

    • Review the list of configured SNMP Managers and verify that the Version

    column is set to v3.

    • Verify that the Auth Protocol is configured as SHA and the Privacy Protocol is

    configured as AES.

    From the CLI:

    • Run the command puresnmp list to display the configuration of the

    SNMP agent and any SNMP managers.

    • Review the output to verify the following for any configured manager or the

    localhost agent:

    • Version is set to v3.

    • Auth Protocol is set to SHA.

    • Privacy Protocol is set to AES.'
  remediation: 'To align with the security recommendations, update your SNMP configuration to utilize

    SNMPv3 with strong authentication and privacy protocols, and ensure passphrases

    meet the 8-character minimum complexity requirement.

    From the GUI:

    • Navigate to Settings > System.

    • In the SNMP panel, click the menu icon and select Add SNMP Manager (or click

    Edit for an existing manager).

    • Complete the following fields in the dialog box:

    • SNMP Version: Select v3.

    • User: Enter the recognized User ID.

