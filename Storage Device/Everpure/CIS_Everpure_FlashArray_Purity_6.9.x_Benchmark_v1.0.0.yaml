      the File Log Targets panel).

      • Navigate to Storage > Policies.

      • Scroll to the Audit Policies panel and select'
    severity: medium
- id: '4.1'
  title: Ensure manual eradication is disabled and the eradication delay is at least 8 days for production data
  scoring: scored
  profile:
  - Level 1
  description: 'FlashArray possesses a variety of configurations, such as realms and pods, that pertain to data protection.
    These configurations can have their data eradication properties configured. Everpure recommends the following: • Disable
    manual eradication for all pods, realms, or arrays that will contain production data. • Set the eradication delay for
    objects that cannot be manually eradicated to be at least 8 days. FlashArray allows for protection groups (pgroups) to
    be created. These pgroups can be attached to hosts and volumes in order to schedule the creation and replication of snapshots
    for the purpose of data protection. Additionally, pgroups may be ratcheted to enable a feature known as SafeMode. Once
    a pgroup has its retention lock set to ratcheted, the protection that it provides can only be increased, not decreased.
    So it may be attached to more things, and made to make more snapshots; but it cannot be detached from its members or changed
    to take and retain fewer snapshots. Administrators of the array will not be able to un-ratchet the retention lock and
    reduce protection without involving Everpure Support. Everpure recommends the following: • Associate all volumes with
    at least one pgroup, or add them to a volume group with an associated pgroup. • Associate all hosts with at least one
    pgroup, or add them to a host group with an associated pgroup. • Ratchet all pgroups that will be associated with production
    data, in order to disable manual eradication of the associated data. • Configure pgroups to create at least 1 snapshot
    per day. • Configure pgroups to replicate at least 1 snapshot per day. • Configure pgroups to retain each snapshot for
    at least 7 days.'
  rationale: In case of administrative compromise, it is important to safeguard against manual erasure of all system data
    and backups. Disabling manual eradication of important data is a crucial step towards preventing such compromise. For
    containers such as pods, disabling manual eradication prevents its contents from being manually eradicated. When manual
    eradication is disabled for a pgroup, both the volumes and snapshots associated with that pgroup will not be able to be
    manually eradicated. When manual eradication of an object is disabled, it may be destroyed (i.e. put into the recycling
    bin), but will not be able to be eradicated and fully erased until the configured eradication delay has elapsed. It is
    important to ensure that this delay is reasonably long to prevent quick deletion of data on a compromised system. Separate
    delays can be configured for objects that can be manually eradicated and those that cannot; ensuring that those that cannot
    be manually eradicated have a delay of at least 8 days ensures a reasonable window of protection. This eradication delay
    is measured in system uptime, not wall time. As such, this eradication delay is resistant to attempts at NTP tampering.
    Automatically, periodically creating immutable backups is an important aspect of data protection. Because FlashArray snapshot
    contents are immutable, they cannot be targeted for encryption by threats such as Ransomware. Ratcheting the pgroup ensures
    that protection cannot be reduced in the case of administrative compromise, and disabling manual eradication prevents
    data erasure by a compromised administrator. • In order to mitigate the impact of an attack on any host or volume, every
    host or volume on a FlashArray should have at least one pgroup automating the creation of backups, either directly or
    indirectly via a group. • In order to mitigate the impact of a physical system being destroyed or tampered with, replicating
    backups automatically is highly recommended. Snapshots can be used to restore the prior state of a volume that has been
    tampered with, and so it is recommended that at least 1 snapshot be taken daily. Because it may take some time to discover
    tampering, it is recommended that they be retained for at least 7 days.
  impact: Disabling manual eradication and extending the eradication delay to at least 8 days removes an administrator's ability
    to instantly free up physical storage capacity by permanently deleting destroyed volumes, pods, or snapshots. If the array
    experiences unexpected rapid data growth and reaches full capacity, administrators will be strictly prevented from manually
    eradicating data in the recycling bin to recover space. This condition could lead to a halt in replication and degraded
    host I/O until the eradication pending period naturally expires or additional physical storage is added. Furthermore,
    once the disabled eradication delay is set and SafeMode is enabled, the delay cannot be decreased, and SafeMode cannot
    be unlocked without explicit authorization and intervention from Everpure Technical Services. Enabling SafeMode (ratcheting)
    on a protection group completely removes local administrative authority to reduce data protection. Once ratcheted, administrators
    absolutely cannot destroy the protection group, manually eradicate its snapshots to free up space, decrease the snapshot/replication
    frequency, decrease the retention period, or remove members and targets. Un-ratcheting the protection group to perform
    any of these actions requires explicit authorization and intervention from Everpure Technical Services, which involves
    at least two authorized administrators and PIN codes. Additionally, SafeMode retention lock is not supported for protection
    groups that contain host members, host group members, or offload targets. To secure these environments, you must create
    a separate ratcheted protection group that specifically targets the underlying volumes instead. Finally, enforcing a schedule
    that creates and replicates at least one snapshot per day and retains them for a minimum of 7 days will continuously consume
    physical storage capacity on both the source and target arrays.
  references: []
  page_start: 123
  audit_raw: 'To align with the security recommendations, verify that the manual eradication of data is

    disabled (via SafeMode) and that the eradication delay for protected objects is set to a

    minimum of 8 days.

    From the GUI:

    • Navigate to Settings > System.

    • Locate the Eradication Configuration panel.

    • Verify that the Disabled Delay is set to at least 8 days (or higher).

    • Verify that the Manual Eradication column does not read all-enabled (it should

    read all-disabled or partially-disabled to indicate SafeMode is actively protecting

    objects from being manually destroyed).

    From the CLI:

    • Run the command purearray eradication-config list to view the

    eradication delay values and manual eradication status.

    • Review the output to ensure the Disabled Delay is at least 8d and the Manual

    Eradication status is not all-enabled.

    To align with the security recommendations, verify that production volumes are

    protected by a protection group, that the protection group enforces SafeMode

    (ratcheted), and that snapshots are scheduled at least daily and retained for a minimum

    of 7 days. (Note: SafeMode retention lock cannot be enabled on protection groups

    containing hosts, host groups, or offload targets; you must explicitly target the

    underlying volumes).

    From the GUI:

    • Navigate to Protection > Protection Groups.

    • Click on a source protection group to view its details.

    • Review the Members pane to verify that production volumes are included (and

    ensure no hosts, host groups, or offload targets are included).

    • Review the SafeMode pane and verify that the Retention Lock status is set to

    ratcheted.

    • Review the Snapshot Schedule and Replication Schedule panes to verify that

    they are enabled, configured to run at least once every 24 hours (1 day), and that

    the retention strategy keeps snapshots for at least 7 days.

    From the CLI:

    • Run the commands purevol list --protect (and purehost list --protect) to verify that

    your production workloads are actively associated with a protection group.

    • Run the command purepgroup list --retention-lock to verify the

    SafeMode status is ratcheted for your production protection groups.

    • Run the commands purepgroup list --schedule and purepgroup list --

    retention to verify that the snapshot and replication frequencies are at least

    daily and retained for at least 7 days.'
  remediation: 'To align with the security recommendations, extend the disabled eradication delay to at

    least 8 days and engage SafeMode retention locks to disable manual eradication.

    From the GUI:

    • Navigate to Settings > System.

    • In the Eradication Configuration panel, click the edit icon in the upper right

    corner.

    • Set the Disabled Delay to at least 8 days (14 days is mathematically

    recommended to provide a 2-week buffer).

    • Click Save.

    • To actively disable manual eradication, you must enable SafeMode retention

    locks on your data. Navigate to Protection > Protection Groups, click the name

    of your protection group to open its details, and in the SafeMode pane, click the

    edit icon to ratchet the retention lock. (Note: Array-wide SafeMode enrollment

    requires contacting Everpure Technical Services with at least two administrators

    and PIN codes).

    From the CLI:

    • Set the Eradication Delay: Configure the disabled delay using the purearray

    eradication-config setattr command.

    • Command Syntax: purearray eradication-config setattr --disableddelay <DAYS>d

    • Example: purearray eradication-config setattr --disabled-delay 14d

    • Disable Manual Eradication: Enforce manual eradication prevention by

    ratcheting the SafeMode retention lock on your protection groups using the

    purepgroup retention-lock ratchet command.

    • Command Syntax: purepgroup retention-lock ratchet <PGROUP>

    • Example: purepgroup retention-lock ratchet pgroup1

    To align with the security recommendations, create a volume-based protection group,

    establish daily snapshot and replication schedules with at least 7 days of retention, and

    ratchet the group to enable SafeMode.

    From the GUI:

    • Navigate to Protection > Protection Groups.

    • In the Source Protection Groups panel, click the + (Create Protection Group)

    icon, enter a name, and click Create.

    • Click on the newly created protection group to open its details.

    • In the Members pane, click the menu icon, select Add..., select your production

    volumes, and click Add.

    • In the Snapshot Schedule and Replication Schedule panes, click the Edit (pen

    and paper) icon. Toggle the schedule to Enabled (blue), configure it to

    create/replicate a snapshot at least every 1 days (or more frequent), and

    configure the retention to retain snapshots for at least 7 days. Click Save.

    • In the SafeMode pane, click the edit icon and click the Ratcheted toggle button

    to enable (blue) the SafeMode feature. (Note: Once ratcheted, a protection group

    cannot be unlocked without explicit authorization and intervention from Everpure

    Technical Services).

    From the CLI:

    • Create the protection group:

    • Command Syntax: purepgroup create <PGROUP>

    • Add volume members:

    • Command Syntax: purevol add --pgroup <PGROUP> <VOLUMES>

    • Configure the schedules (at least daily):

    • Command Syntax: purepgroup schedule --snap-frequency 1d --

    replicate-frequency 1d <PGROUP>

    • Configure the retention (at least 7 days):

    • Command Syntax: purepgroup retain --all-for 1d --per-day 1 --days

    7 <PGROUP>

    • Enable the schedules:

    • Command Syntax: purepgroup enable <PGROUP>

    • Ratchet the protection group to enable SafeMode:

    • Command Syntax: purepgroup retention-lock ratchet <PGROUP>'
  checks:
  - type: manual_review
    info: 'To align with the security recommendations, verify that the manual eradication of data is

      disabled (via SafeMode) and that the eradication delay for protected objects is set to a

      minimum of 8 days.

      From the GUI:

      • Navigate to Settings > System.

      • Locate the Eradication Configuration panel.

      • Verify that the Disabled Delay is set to at least 8 days (or higher).

      • Verify that the Manual Eradication column does not read all-enabled (it should

      read all-disabled or partially-disabled to indicate Safe'
    severity: medium
- id: '4.3'
  title: Ensure an enabled snapshot policy taking at least one daily snapshot is attached to every directory
  scoring: scored
  profile:
  - Level 1
  description: 'FlashArray supports creating snapshot policies for automatically creating, managing, and deleting immutable
    snapshots of FlashArray directories. These policies can be additionally used to replicate file snapshots. Everpure recommends
    the following if you have any file systems on the system: • Attach at least one enabled snapshot policy to each directory.
    • Configure snapshot policies to create at least 1 snapshot per day. • Configure snapshot policies to retain each snapshot
    for at least 7 days.'
  rationale: Automatically, periodically creating immutable backups is an important aspect of data protection. Because FlashArray
    snapshot contents are immutable, they cannot be targeted for encryption by threats such as Ransomware. In order to mitigate
    the impact of an attack on any export, every file system on a FlashArray should have at least one snapshot policy. Snapshots
    can be used to restore the prior state of a file system that has been tampered with. Everpure recommends that at least
    1 snapshot be taken daily and because it may take some time to discover tampering, that the snapshots be retained for
    at least 7 days.
  impact: Enforcing a schedule that creates and retains daily file snapshots for at least 7 days will continuously consume
    physical storage capacity on the FlashArray. Because snapshots are immutable, the storage blocks associated with modified
    or deleted files within the directory cannot be reclaimed by the system to free up space until the covering snapshot's
    retention period expires. Additionally, modifying an existing policy's rules can occasionally lead to unexpected immediate
    storage consumption, as the scheduler may trigger additional snapshots out-of-cycle to fulfill a partially complete protection
    plan.
  references: []
  page_start: 132
  audit_raw: 'To align with the security recommendations, verify that an active snapshot policy is

    attached to your production directories, ensuring that immutable snapshots are taken at

    least daily and retained for a minimum of 7 days to protect against ransomware and

    accidental deletion.

    From the GUI:

    • Navigate to Protection > Policies.

    • In the Snapshot Policies panel, verify that a snapshot policy exists and its

    Enabled status is set to true.

    • Click the name of the policy to view its details.

    • Review the Rules panel and verify that the Create 1 snapshot every frequency

    is 1d (or more frequent) and the And keep for retention period is at least 7d (or

    1w or longer).

    • Review the Members panel to verify that all production directories are listed and

    actively attached to the policy.

    From the CLI:

    • Run the command purepolicy snapshot rule list to verify the configured

    rules on your snapshot policies.

    • Review the output to ensure the frequency (every) is at least daily (1d) and the

    retention (keep_for) is at least 7 days (7d or 1w).

    • Run the command purepolicy snapshot list --member to view all

    configured snapshot policies and verify that your production

    managed directories are successfully attached to them.'
  remediation: 'To align with the security recommendations, establish a snapshot policy that takes daily

    snapshots with a 7-day retention period, and attach it to your file system managed

    directories.

    From the GUI:

    • Navigate to Protection > Policies.

    • In the Snapshot Policies panel, click the + (Create Policy) icon. Provide a name,

    ensure the Enabled toggle is active (blue), and click Create.

    • Click on the newly created policy name to open its details.

    • In the Rules panel, click the + (Create Rule) icon (or menu icon > Create...) to

    add a new rule.

    • Set Create 1 snapshot every to 1d (or a shorter interval like 12h).

    • Set And keep for to 1w (or 7d or a longer duration like 30d).

    • Provide a Client Name (e.g., daily) which will be visible to users recovering files,

    then click Add.

    • In the Members panel, click the menu icon, select Add Member..., select your

    managed directories, and click Add to attach the policy.

    From the CLI:

    • Create the Policy: Create a new snapshot policy using the purepolicy

    snapshot create command.

    • Command Syntax: purepolicy snapshot create <POLICY_NAME>

    • Example: purepolicy snapshot create data_snap

    • Add a Compliant Rule: Add a rule configuring the frequency (--every), retention

    (--keep-for), and client name (--client-name).

    • Command Syntax: purepolicy snapshot rule add --every <FREQUENCY> -

    -keep-for <RETENTION> --client-name <NAME> <POLICY_NAME>

    • Example: purepolicy snapshot rule add --every 1d --keep-for 7d --

    client-name daily data_snap

    • Attach to Directories: Attach the policy to your file system directories using the

    puredir snapshot add command.

    • Command Syntax: puredir snapshot add --policy <POLICY_NAME>

    <FILESYSTEM:DIRECTORY>

    • Example: puredir snapshot add --policy data_snap FS1:Data'
  checks:
  - type: manual_review
    info: 'To align with the security recommendations, verify that an active snapshot policy is

      attached to your production directories, ensuring that immutable snapshots are taken at

      least daily and retained for a minimum of 7 days to protect against ransomware and

      accidental deletion.

      From the GUI:

      • Navigate to Protection > Policies.

      • In the Snapshot Policies panel, verify that a snapshot policy exists and its

      Enabled status is set to true.

      • Click the name of the policy to view its details.

      • Review t'
    severity: medium
- id: '4.4'
  title: Ensure default protection is configured at the array level and for every pod
  scoring: scored
  profile:
  - Level 1
  description: 'FlashArray allows the array and its pods to have default protection configured. This allows you to configure
    pgroups that will be automatically associated with any volumes created within the pod or the array. This can be used to
    ensure that all block data has some level of data protection by default. Everpure recommends the following if you intend
    to place any volumes on the system: • Configure at least 1 pgroup as the default protection for every pod on the system,
    and at the array level. • Any pgroups configured as default protection for containers that will have production data should
    have a ratcheted retention lock, with manual eradication disabled.'
  rationale: In case of administrative compromise, it is important to safeguard against manual erasure of all system data
    and backups. Default protection ensures that you do not need to take extra steps to achieve a baseline protection of block
    data. It reduces the risk of user error causing a lapse in data protection. It is also important to ensure that the default
    protection is reasonably strong, which is why it is recommended to ratchet the default protection for any production data,
    ensuring that it cannot be weakened and it disables manual eradication of the protected data. When manual eradication
    of file is disabled, file systems and snapshots may be destroyed (i.e. put into the recycling bin), but will not be able
    to be eradicated and fully erased until the configured eradication delay has elapsed. This applies to all snapshots, not
    just those created by the safemode policy. This eradication delay is measured in system uptime, not wall time. As such,
    this eradication delay is resistant to attempts at NTP tampering.
  impact: Enforcing default protection using a ratcheted protection group ensures that every newly created or copied volume
    is immediately subjected to SafeMode retention locks. Consequently, administrators will be strictly prevented from manually
    eradicating any newly created volume or its snapshots to quickly recover physical storage space, which could lead to capacity
    exhaustion issues if a large volume was provisioned or copied in error. Furthermore, once a ratcheted protection group
    is set as the default, you cannot opt out of or remove that group from the default protection list without explicit authorization
    and intervention from Everpure Technical Services.
  references: []
  page_start: 136
  audit_raw: 'To align with the security recommendations, verify that at least one protection group is

    configured as the default protection for every pod and the array root, and that they

    enforce SafeMode (ratcheted) to prevent manual eradication of newly provisioned

    volumes.

    From the GUI:

    • Navigate to Protection > Array.

    • Scroll to the Default Protection panel.

    • Verify that a protection group is listed for the array root (denoted by - in the

    Container Name column) and for every configured pod.

    • Navigate to Protection > Protection Groups.

    • Click on the protection groups listed as defaults to view their details.

    • In the SafeMode pane, verify that the Retention Lock status is set to ratcheted.

    From the CLI:

    • Run the command purearray default-protection list to view the

    default protection group lists for the array root (denoted by - in the

    Container Name column) and all pods.

    • Run the command purepgroup list --retention-lock to verify that

    the SafeMode status is ratcheted and manual eradication is disabled for

    the protection groups assigned as defaults.'
  remediation: 'To align with the security recommendations, assign a ratcheted protection group to the

    array root and all pods so that newly provisioned data receives baseline SafeMode

    protection automatically.

    From the GUI:

    • Navigate to Protection > Array.

    • In the Default Protection panel, click the Edit (Set Default Protection) icon on

    the right of the appropriate row (the - row for the root of the array, or the row for a

    specific pod).

    • In the Available Protection Groups column, select the protection groups to be

    added so they appear in the Selected Protection Groups column.

    • Click Set.

    • Navigate to Protection > Protection Groups and select your assigned default

    protection group.

    • In the SafeMode pane, if the status is unlocked, click the edit icon and toggle the

    Ratcheted button to enabled (blue).

    From the CLI:

    • Set the Default Protection List: Define the default protection groups for the

    array root or a pod using the purearray default-protection set command.

    • Command Syntax (Array Root): purearray default-protection set --

    pgroup <PGROUP> ""

    • Command Syntax (Pod): purearray default-protection set --pgroup

    <POD>::<PGROUP> <POD>

    • Example: purearray default-protection set --pgroup pod1::pg1 pod1

    • Ratchet the Protection Group: Ensure SafeMode is enabled on the default

    protection group to prevent manual eradication.

    • Command Syntax: purepgroup retention-lock ratchet <PGROUP>'
