controls:
- id: '1.1'
  title: Ensure a management SAML SSO configuration is created and enabled
  scoring: manual
  profile:
  - Level 1
  description: Purity can be integrated with an external identity provider (IDP) that supports SAML. This allows for single-sign-on
    (SSO) functionality in the Everpure Web UI, with user provisioning, authentication, and authorization being controlled
    by the IDP. Everpure recommends that you create and enable a management SAML configuration.
  rationale: SAML provides mechanisms for more secure authentication to FlashArray. IDPs can provide assertions about user
    information, which are digitally signed, allowing FlashArray, acting as the Service Provider (SP), to gather user details
    in a trusted manner for user authentication and authorization. This allows authentication to be centralized with an IDP,
    allowing for the IDP to enforce strong central controls, such as multi-factor authentication, device trust mechanisms,
    and other security capabilities provided by your IDP. IDPs can directly provide user authorization information to Purity
    systems using a custom "purity_roles" SAML claim. Alternatively, the array can be configured to map authorization information
    based on groups, allowing a standard SAML group to be used. In either case, it puts the IDP in control of information
    used to authorize users. IDP assertions can be optionally encrypted, and FlashArray's authentication assertions can be
    optionally signed as well, providing additional security controls that may be valuable depending on your environment.
    Users who have logged into the Web UI using SAML may also login via SSH using a public key or SSH certificate, and may
    login via the REST API with an API Token or OAuth JWT, but their authorization must be periodically refreshed via SAML
    login.
  impact: Configuring SAML SSO introduces a dependency on IdP availability. If the IdP becomes unreachable, management access
    via SAML will be unavailable; only local fallback accounts (if retained) will be accessible. Administrators must maintain
    at least one local emergency access account and ensure IdP high availability. Initial configuration requires coordination
    between the FlashArray administrator and the IdP administrator to exchange metadata and certificates.
  references: []
  page_start: 18
  audit_raw: 'To align with the security recommendations, verify that at least one SAML Identity

    Provider (IdP) is configured, its status is actively enabled, it references the correct IdP

    URL and verification certificate, and that the configuration successfully passes

    diagnostic connectivity tests.

    From the GUI:

    • Navigate to Settings > Access > Users and Policies and scroll to the SAML2

    SSO pane.

    • Verify that the Enabled status is set to true.

    • Review the configured settings (such as Array URL, IdP URL, and Metadata

    URL) to confirm they reference the correct Identity Provider.

    • Test the configuration: Click Test to open the Test SAML2 SSO Configuration

    dialog, review the basic test results, and then click E2E Test to run the End-toEnd test. Verify that the authentication
    process successfully redirects and returns

    a Passed status without errors.

    From the CLI:

    • Run the command puresso saml2 list to display configured SAML providers.

    • Review the output to confirm that a SAML provider is present and its enabled

    status is True.

    • Run the command puresso saml2 list --verification-certificate to

    view the full verification certificate details and verify the certificate issuer and

    expiry date.

    • Test the configuration: Run the command puresso saml2 test [IDP-NAME] to

    verify the array URL correctness, IdP connectivity, directory service correctness,

    and verification certificate validity.'
  remediation: 'To align with the security recommendations, configure the array as a Service Provider

    (SP), exchange metadata or certificates with your Identity Provider, and rigorously test

    the configuration before enabling SSO.

    From the GUI:

    • Navigate to Settings > Access > Users and Policies and scroll to the SAML2

    SSO pane.

    • Click the + (Create SAML2 SSO) icon.

    • In the Name field, enter a local display name for the SAML2 SSO configuration.

    • In the Array URL field, enter the FlashArray URL using HTTPS.

    • Enter either the IdP Metadata URL, or manually enter the IdP Entity ID, IdP

    URL, and click Edit next to Verification Certificate to paste your IdP''s PEMformatted token-signing certificate.

    • Click Test at the bottom of the window to run a basic configuration test, then click

    Save.

    • From the SAML2 SSO pane, click Test and then E2E Test to run the mandatory

    End-to-End test, which will redirect you to sign in with your IdP credentials.

    • Warning: Only proceed if the End-to-End test successfully passes, otherwise all

    array users could be locked out of the GUI.

    • Click the Configuration edit icon, slide the Enabled toggle to the right (blue),

    and click Save.

    From the CLI:

    • Create the SAML provider: Create the configuration using the puresso saml2

    create command. You can use an IdP metadata XML file or manually specify

    the URLs.

    • Command Syntax (Metadata): puresso saml2 create --array-url

    <ARRAY_URL> --idp-metadata-url <IDP_METADATA_URL> <IDP_NAME>.

    • Command Syntax (Manual): puresso saml2 create --array-url

    <ARRAY_URL> --idp-entity-id <IDP_ENTITY_ID> --idp-url <IDP_URL> -

    -verification-certificate <IDP_NAME>. (Note: Purity will prompt

    interactively for the PEM-formatted verification certificate if the flag is used).

    • Test the configuration: Run the puresso saml2 test command to verify the array

    URL, IdP connectivity, and certificate correctness.

    • Enable SAML2 SSO: Once testing passes, enable the configuration.

    • Command Syntax: puresso saml2 enable <IDP_NAME>.'
