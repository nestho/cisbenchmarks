- id: '1.11'
  title: Ensure administrative session logs are forwarded to remote syslog or monitored via the REST API
  scoring: manual
  profile:
  - Level 1
  description: FlashArray creates administrative session records for all administrative logins and logouts, whether successful
    or unsuccessful. Everpure recommends that these logs be monitored via REST API, or sent to configured remote syslog servers
    in order to detect suspicious or unexpected activity and respond accordingly. Everpure recommends that you monitor these
    logs in order to detect use of weak authentication mechanisms.
  rationale: 'The FlashArray administrative session logs track the following information for every attempted or successful
    login, and logout: • The time when it occurred or began • The time when the session ended, if login had been successful
    • The user associated with the login • The product interface where the login was attempted (e.g. CLI) • The IP address
    they performed the login from • The event itself (e.g. failed authentication, "login" if the user has not yet logged out,
    or "user session" for a completed session) • The method used to attempt authentication (e.g. certificate, saml2_sso, password,
    public key) • The event count, which is greater than 1 if multiple failed login attempts occurred in a short period of
    time These pieces of information are valuable for detecting attempted or successful intrusion into the system, use of
    compromised keys for login, or logins originating from unexpected locations. These pieces of information can also be used
    to detect logins made using unexpected credentials (e.g. a user logging in with an API Token when OAuth is available;
    a user logging in with a password when SSH public keys are configured).'
  impact: Continuous session monitoring requires ongoing operational processes.
  references: []
  page_start: 55
  audit_raw: 'To align with the security recommendations, verify that administrative session logs are

    continuously monitored—either by forwarding them to a remote syslog server or by

    polling them via the REST API—and that reviewers are checking the start/end times,

    users, access interfaces, IP locations, and event types.

    From the GUI:

    • Verify Manual/API Log Access: Navigate to Settings > Access and locate the

    Session Log pane. Confirm logs are accessible and capture the Start Time, End

    Time, Interface, User, Location, and Event fields.

    • Verify Syslog Forwarding: Navigate to Settings > System. In the Syslog

    Servers panel, verify that a remote syslog server is actively configured to receive

    events.

    • Verify REST API (If Syslog is not used): Navigate to Settings > Access >

    Users and Policies (API Clients pane) to verify an active API Client exists for

    your SIEM/monitoring platform to poll session logs via the REST API.

    From the CLI:

    • Verify Session Records: Run the command puresession list to display

    user session logs. Review the output to ensure Start Time, End

    Time, Interface, User, Location, and Event fields are being actively

    recorded.

    • Verify Syslog Forwarding: Run the command purelog syslog list to

    confirm a remote syslog server URI is configured.

    • Verify REST API (If Syslog is not used): Verify with your monitoring teams that

    an external script is successfully polling the FlashArray REST API for session

    records.'
  remediation: 'To align with the security recommendations, implement continuous monitoring by

    configuring external syslog forwarding or REST API integration for session logs, and

    establish a process to review logs for weak authentication methods or unexpected

    access.

    From the GUI:

    • Establish a Review Process: Create a standard operating procedure to

    regularly review the Session Log pane under Settings > Access specifically

    looking for unexpected IP locations or failed authentication events.

    • To Configure Syslog Forwarding: Navigate to Settings > System. In the

    Syslog Servers panel, click the + (Create) icon, enter your remote syslog server

    URI, and click Create.

    • To Configure REST API Monitoring: Integrate your SIEM or monitoring tool

    using the Pure Storage REST API endpoints to continuously poll for session

    events.

    Note: If credentials are believed to be compromised, immediately rotate the affected

    account''s password using the Users pane and rotate API tokens.

    From the CLI:

    • Establish a Review Process: Implement an operational procedure to

    periodically run puresession list and review the output for unexpected session

    activity.

    • To Configure Syslog Forwarding: Create a remote syslog server destination

    using the purelog syslog create command.

    • Command Syntax: purelog syslog create --uri <URI> <SERVER_NAME>

    • Example: purelog syslog create --uri tcp://10.10.10.10:514 syslogserver01'
  checks:
  - type: manual_review
    info: 'To align with the security recommendations, verify that administrative session logs are

