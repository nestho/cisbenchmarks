    • Command Syntax: purelog syslog create --uri

    tls://<SYSLOG_HOST>:<PORT> <NAME>

    • Import the CA certificate for syslog: Purity//FA''s syslog agent uses this

    certificate to authenticate itself to the remote syslog servers.

    • Command Syntax: purelog syslog global setattr --ca-certificate

    • Action: Paste the PEM-formatted certificate at the interactive prompt.

    • Verify the new configuration:

    • Command Syntax: purelog syslog list'
