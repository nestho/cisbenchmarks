- id: '1.12'
  title: Ensure system alerts are actively monitored via remote syslog or email alert watchers
  scoring: manual
  profile:
  - Level 1
  description: FlashArray creates alerts for a variety of system conditions that may be cause for concern. Not all of these
    are security related, but a number of them are either directly security related or can have an impact on security. Everpure
    recommends that these alerts be monitored via REST API, or sent via syslog to configured remote syslog servers, via email
    using the configured SMTP relay, or via remote SNMP managers, in order to detect alerts of concern and respond accordingly.
  rationale: 'The FlashArray alerts cover a variety of cases, including but not limited to: • Expiring certificates • Insecure
    default credentials in use • Drive removal • Hardware cable removal • Snapshot limits being approached Some alerts, such
    as default credentials, directly impact security. However, even for alerts that do not always directly pertain to security,
    they can potentially indicate attempts at physical tampering with the system, such as blade removal, or indicate system
    states that impact other security controls, such as approaching snapshot limits that impact data protection. As such,
    alerts should be appropriately monitored and acted upon.'
  impact: Excessive alert configuration can lead to alert fatigue if low-severity events are forwarded to on-call teams. Alert
    routing should be tuned to ensure high-severity events receive immediate attention while informational events are logged
    to monitoring dashboards.
  references: []
  page_start: 59
  audit_raw: 'To align with the security recommendations, verify that array alerts are actively

    monitored—either by forwarding them to a remote syslog server or by configuring an

    internal email address (alert watcher)—to ensure timely notification of security and

    system events.

    From the GUI:

    • Verify Alert Watchers (Email): Navigate to Settings > System and select

    Alerts and Notifications from the left navigation pane. Verify that at least one

    valid internal email address is listed to receive alerts.

    • Verify Syslog Forwarding: Navigate to Settings > System. Locate the Syslog

    Servers panel and verify that a remote syslog server is actively configured to

    receive alert messages.

    From the CLI:

    • Verify Alert Watchers (Email): Run the command purealert watcher list.

    Review the output to ensure that an internal organization email address is

    configured and enabled to receive notifications.

    • Verify Syslog Forwarding: Run the command purelog syslog list. Review

    the output to confirm that a remote syslog server URI is actively configured to

    receive events (which includes purity.alert records).'
  remediation: 'To align with the security recommendations, implement a continuous alerting process

    by configuring an email alert watcher or remote syslog forwarding (or both).

    From the GUI:

    • To Configure Alert Watchers (Email):

    • Navigate to Settings > System and select Alerts and Notifications in the

    navigation pane.

    • Add the appropriate internal email address for your organization''s monitoring or

    administrative team to receive alert notifications.

    • To Configure Syslog Forwarding:

    • Navigate to Settings > System.

    • In the Syslog Servers panel, create a syslog server by entering the URI of your

    remote syslog server (e.g., tcp://10.10.10.10:514) and saving the configuration.

    From the CLI:

    • To Configure Alert Watchers (Email): Add a designated email address using

    the purealert watcher create command.

    • Command Syntax: purealert watcher create <EMAIL_ADDRESS>

    • Example: purealert watcher create soc-alerts@mycompany.com

    • To Configure Syslog Forwarding: Create a remote syslog server destination

    using the purelog syslog create command.

    • Command Syntax: purelog syslog create --uri <URI> <SERVER_NAME>

    • Example: purelog syslog create --uri tcp://10.10.10.10:514 syslogserver01'
