- id: '1.8'
  title: Ensure OAuth API clients use least-privilege access policies and access-token TTLs of 60 minutes or less
  scoring: manual
  profile:
  - Level 1
  description: 'FlashArray supports configuring one or more identity providers for API Clients. These IDPs can then issue
    identity tokens to any user on the array that can be exchanged with the array for API access using the OAuth2 standard.
    The configuration also allows you to specify maximum permissions that can be granted to users who receive id tokens from
    the IDP, as well as the TTL for access tokens issued to clients. Everpure recommends the following: • All API Clients
    should be configured with appropriately limited permissions based on the use case of the IDP. • All API Clients should
    be configured with a TTL of 60 minutes or fewer.'
  rationale: The OAuth2 specification allows for short-lived access tokens to be issued and used for API access. Use of short-lived
    tokens can substantially reduce the impact of a compromise, as the tokens have a limited window of use. Limiting the granted
    permissions for API Clients can also have value. If a user desires to run API automation, such as workload performance
    monitoring, or snapshot management, it is not necessary to authorize that automation with the full permissions of the
    user. By utilizing an appropriately configured OAuth API Client, you can restrict applications to readonly or storage_admin
    permissions, even when they act on behalf of a user who may be an array_admin. This limits the impact of a compromised
    application on the system.
  impact: Deleting or modifying active API clients will immediately invalidate all tokens issued to those clients, breaking
    any integrations or automation workflows that use them. Changes to API client configuration should be planned and communicated
    to affected teams before implementation.
  references: []
  page_start: 43
  audit_raw: 'To align with the security recommendations, verify that all configured API clients have a

    documented business purpose, are assigned the minimum necessary permissions (e.g.,

    readonly instead of array_admin), and utilize short-lived access tokens (TTL of 60

    minutes or less) to reduce the impact of a compromised token.

    From the GUI:

    • Navigate to Settings > Access > Users and Policies.

    • Scroll to the API Clients panel and review the list of configured API clients.

    • Verify each active API client has a documented business purpose.

    • Review the access policy and TTL assigned to each client to ensure they enforce

    the principle of least privilege.

    From the CLI:

    • Run the command pureapiclient list to display all configured API clients.

    • Review the output to verify the Access Policy, Enabled status, and token TTL for

    each client.

    • Verify no API clients are enabled that are no longer actively in use.'
  remediation: 'To align with the security recommendations, delete or disable inactive API clients, and

    ensure all active clients are bound to restrictive access policies with short-lived tokens.

    (Note: Modifying or deleting an active API client will immediately invalidate its issued

    tokens, so changes should be coordinated with the teams responsible for those

    integrations).

    From the GUI:

    • Navigate to Settings > Access > Users and Policies.

    • In the API Clients panel, select any unused clients and click the trash icon to

    delete them.

    • For active clients, click the edit icon to reduce the assigned access policy or

    shorten the token TTL as appropriate.

    • To create a new compliant client, click the + (Create API Client) icon. In the popup window, enter the client name,
    select a minimum access policy (e.g.,

    readonly), set the time to live (e.g., 1h), and paste the RSA public key in PEM

    format, then click Create.

    From the CLI:

    • Disable an unused API client: Use the pureapiclient disable command to

    temporarily revoke a client''s access.

    • Command Syntax: pureapiclient disable <CLIENT_NAME>

    • Delete an unused API client: Use the pureapiclient delete command to

    permanently remove an obsolete client.

    • Command Syntax: pureapiclient delete <CLIENT_NAME>

    • Create a new, least-privilege API client: Use the pureapiclient create

    command, specifying a restrictive access policy and a short token TTL.

    • Command Syntax: pureapiclient create --access-policy readonly --

    access-token-ttl 1h --public-key <CLIENT_NAME>

    • Action: Purity//FA will prompt you interactively to enter the public key. Paste the

    public key, press Enter to insert a new line, and then press CTRL-D to exit the

    prompt and create the client.'
