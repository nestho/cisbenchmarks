      • Under the Array tab, review the Users panel to inspect the list of configured local

      accounts.

      • Compare this list against your organization''s authorized personnel and service

      accounts, verifying that ac'
    severity: medium
- id: '1.4'
  title: Ensure administrators and directory groups are granted leastprivilege roles via management access policies
  scoring: manual
  profile:
  - Level 1
  description: 'FlashArray provides utilities for role based access controls, with 4 built-in management access policies,
    which can be assigned to administrators, directory service groups, or as the maximum role that can be granted by OAuth
    API Clients. Management access policies may be dynamically created, allowing you to grant users different roles in different
    scopes (e.g. different realms). Everpure recommends the following: • Use more than one management access policy if you
    possess multiple users administering the system. • Create at least 1 realm in order to create logical units of management
    for the purpose of delegating administration. • Grant users and groups only the permissions needed to perform their responsibilities,
    utilizing custom management access policies to limit user access to the scopes containing objects for which they are responsible.'
  rationale: 'FlashArray provides 4 built-in management access policies: • array_admin: This policy has the "admin" role over
    the full array scope. This role can perform all administrative capabilities on the system, including management of other
    administrators, authentication mechanisms, IDPs, storage, and networking. • storage_admin: This policy has the "storage"
    role over the full array scope. This role can manage all storage objects, such as file systems and snapshots, and can
    read all other system configurations such as networking. • ops_admin: This policy has the "support" role over the full
    array scope. This role can manage supportability configurations, such as enabling remote assist, and can read all other
    system configurations. • readonly: This policy has the "viewer" role over the full array scope. This role can read all
    system configurations. The noted roles can be assigned to other scopes within management access policies in order to grant
    users with those policies those same permissions but in a different scope. There are some limitations; physical networking
    and IDPs can only be managed by admins of the full array scope, though logical networking can still be managed by admins
    within a realm scope. In order to reduce the risk of a compromised account, different administrators, or groups of administrators,
    should be assigned to the minimal role needed to accomplish their responsibilities. Granting every user full administrative
    privileges is a security risk. This includes ensuring that realms are created as logical units to house configurations
    and data managed by a specific organization or team. Even if only one team within your organization currently utilizes
    FlashArray, creating a realm for that single team ensures that there will be no authorization risks or migrations if another
    team is granted use of the system with their own realm later.'
  impact: Reducing a user's role to the minimum necessary may prevent them from performing tasks they previously could, which
    may require workflow adjustments. All role changes should be communicated to affected users in advance.
  references: []
  page_start: 29
  audit_raw: 'To align with the security recommendations, verify that administrators and directory

    service groups are granted the minimum necessary privileges (e.g., readonly,

    storage_admin, ops_admin, or array_admin) using Management Access Policies.

    Ensure that no user or group has an unnecessarily broad access policy assigned.

    From the GUI:

    • Navigate to Settings > Access > Users and Policies.

    • In the Users panel, review the Policies (or Access Policy) column for each local

    account to verify the appropriate privilege levels are assigned.

    • In the Directory Service panel, review the Roles section to confirm that

    directory service group-to-role mappings are securely defined and align with the

    principle of least privilege.

    From the CLI:

    • Run the command pureadmin list to display all local administrators.

    • Review the Access Policy column in the output to confirm that each account has

    the appropriate minimum-privilege policy attached (and no account is

    unnecessarily set to array_admin).

    • Run the command pureds role list to display the current LDAP/AD group to

    Purity//FA access policy mappings and verify their assignments.

    • Run purepolicy management-access list to inspect the permissions,

    scopes, and aggregation strategies of all configured access policies.'
  remediation: 'To align with the security recommendations, assign users and groups the minimum role

    needed to accomplish their responsibilities by leveraging Purity//FA''s built-in or custom

    Management Access Policies.

    From the GUI:

    • Navigate to Settings > Access > Users and Policies.

    • For Local Users: In the Users panel, click the edit (three vertical dots) icon for

    the user account and select Change Access Policy. Remove any overly

    permissive policies and assign the appropriate minimum-privilege policy.

    • For Directory Service Groups: In the Directory Service panel, click the edit

    icon in the Roles section. Change the Active Directory/LDAP group mapping so

    that the group is mapped to the appropriate minimum-privilege RBAC role, then

    click Save.

    From the CLI:

    • Update a local user''s access policy: Attach the correct minimum-privilege

    management access policy using pureadmin add, and remove the non-compliant

    policy using pureadmin remove.

    • Command Syntax (Add): pureadmin add --access-policy <ACCESS_POLICY>

    <USERNAME>

    • Command Syntax (Remove): pureadmin remove --access-policy

    <ACCESS_POLICY> <USERNAME>

    • Example: pureadmin add --access-policy storage_admin admin1

    • Update a directory service group mapping: Create or update the named

    mapping to attach an LDAP group to the correct Purity//FA access policy.

    • Command Syntax: pureds role create <MAPPING_NAME> --access-policy

    <ACCESS_POLICY> --group <AD_GROUP> --group-base <OU>

    • Example: pureds role create storagemap --access-policy

    storage_admin --group purestorageadmins --group-base

    OU=Storage,DC=company,DC=com'
  checks:
  - type: manual_review
    info: 'To align with the security recommendations, verify that administrators and directory

