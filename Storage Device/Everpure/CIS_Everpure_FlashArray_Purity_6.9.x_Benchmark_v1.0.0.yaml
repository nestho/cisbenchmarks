    • Command Syntax: purepolicy quota rule add --quota-limit <SIZE> --

    enforced <POLICY_NAME>

    • Example: purepolicy quota rule add --quota-limit 5T --enforced

    root_hard_quota

    • Attach the policy to the root directory: Apply the policy to the root managed

    directory of your file system.

    • Command Syntax: purepolicy quota add --dir <FILESYSTEM>:root

    <POLICY_NAME>

