- id: '1.13'
  title: Ensure at least one alert watcher is configured to receive alerts of all severities
  scoring: scored
  profile:
  - Level 1
  description: FlashArray allows configuration of one or more alert watchers, which are email addresses that will receive
    emails for new system alerts. The minimum severity of alerts that will be sent to each watcher is also configurable. Everpure
    recommends that you configure at least 1 alert watcher that receives alerts of all severities.
  rationale: While it may be helpful to have some administrators or monitors only receive emails about critical system alerts,
    responding to or monitoring alerts of lower severity can help ensure that they do not become critical. As such Everpure
    recommends that you have at least 1 alert watcher that receives all alerts.
  impact: Configuring alert watchers may result in notification emails to team members at any hour. Confirm that distribution
    lists are monitored around the clock for critical production arrays.
  references: []
  page_start: 63
  audit_raw: 'To align with the security recommendations, verify that at least one organizational email

    address is configured as an alert watcher to receive all system alerts.

    From the GUI:

    • Navigate to Settings > System and select Alerts and Notifications in the left

    navigation pane.

    • Locate the Alert Watchers panel.

    • Verify that at least one active, organizational email address is configured (in

    addition to the built-in purestorage.com address).

    • Verify that the Enabled toggle is active (blue).

    From the CLI:

    • Run the command purealert watcher list to display configured alert

    recipients.

    • Review the output to confirm an organizational email address is present and its

    status is enabled.

    • Verify that the Minimum Notification Severity is set to info so that the watcher

    receives alerts of all severities. (Note: The CLI command output will show the

    active severity levels)'
  remediation: 'To align with the security recommendations, configure an organizational email address

    to monitor array alerts.

    From the GUI:

    • Navigate to Settings > System and select Alerts and Notifications.

    • In the Alert Watchers panel, click the + (Create) icon, enter the desired email

    address, and click Create.

    • To adjust the notification level, click the More Options menu next to the newly

    created watcher, select Edit, choose the minimum severity, and click Save.

    • Ensure the Enabled switch is toggled on.

    From the CLI:

    • Create the watcher: Run the purealert watcher create command.

    • Command Syntax: purealert watcher create <EMAIL_ADDRESS>

    • Set the severity level: Configure the minimum notification severity through an

    alert-watcher policy rule.

    o Command Syntax: purepolicy alert-watcher rule add --email

    <EMAIL_ADDRESS> --minimum-notification-severity

    {critical|info|warning} <ALERT_POLICY>

    o Alternatively, update an existing rule: purepolicy alert-watcher rule

    setattr --rule-name <RULE> --minimum-notification-severity

    {critical|info|warning} <ALERT_POLICY>

    o Example: purepolicy alert-watcher rule add --email socalerts@mycompany.com --minimum-notification-severity info

    alert_policy_main

    • Enable the watcher: Ensure the watcher is actively receiving alerts using the

    purealert watcher enable command.

    • Command Syntax: purealert watcher enable <EMAIL_ADDRESS>'
