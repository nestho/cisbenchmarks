      • In the Users panel, review the Policies (or Access Policy) column for each local

      account to verify the appropria'
    severity: medium
- id: '1.5'
  title: Ensure SSH key-based authentication is configured for CLI access, preferably sourced from LDAP
  scoring: manual
  profile:
  - Level 1
  description: FlashArray allows for SSH public keys to be retrieved from a configurable attribute within a configured LDAP
    server if delegated account management with LDAP is in use. If this is not viable in your environment, or local administrative
    accounts are in use, then SSH public key based authentication can be configured locally per-user. Everpure recommends
    that SSH keys be retrieved from LDAP.
  rationale: Retrieval of SSH keys from LDAP allows for authentication to be centrally managed, and ensures any compromised
    key can be removed from trust across your environment with a single change. If this is not possible, individual administrators
    may configure SSH Public Keys for their accounts. This allows them to login with the corresponding private key instead
    of a password.
  impact: SSH key-based authentication requires administrators to manage key pairs securely. Loss of a private key without
    a registered backup key would require an administrator with array_admin access to remove and re-register the key. If password
    authentication is subsequently disabled, a lost or revoked key could lock an administrator out of CLI access until the
    key is replaced.
  references: []
  page_start: 34
  audit_raw: 'To align with the security recommendations, verify that SSH public keys are configured

    for users requiring CLI access (to prevent reliance on passwords) and test that the keybased authentication functions
    correctly.

    From the GUI:

    • Navigate to Settings > Access > Users and Policies.

    • In the Users panel, verify that a masked key is present in the Public Key column

    for each user who accesses the array via the CLI.

    • Test the configuration: Using an SSH client (such as PuTTY or the native UNIX

    ssh command), attempt to log in to the FlashArray as the target user with the

    corresponding private key to verify that authentication succeeds without

    prompting for a password.

    From the CLI:

    • Run the command pureadmin list --publickey to display all users

    and their public key status.

    • Review the output to confirm that all authorized CLI users have a public key

    configured.

    • Test the configuration: Initiate an SSH connection to the array from an

    administrative workstation using the user''s private key to ensure successful

    authentication.'
  remediation: 'To align with the security recommendations, configure SSH public keys for your

    administrative accounts so they can authenticate securely using a private key rather

    than a password.

    From the GUI:

    • Navigate to Settings > Access > Users and Policies.

    • In the Users panel, click the Edit (three vertical dots) icon for the user you want

    • In the Edit User pop-up window, select Overwrite and paste the user''s SSH

    public key into the Public Key field.

    • Click Save.

    From the CLI:

    • Add a public key: Initiate the configuration for a specific user using the

    pureadmin setattr command.

    • Command Syntax: pureadmin setattr --publickey <USERNAME>

    • Action: Purity//FA will prompt you interactively to enter the public key. Paste the

    public key, press Enter to insert a new line, and then press CTRL-D to exit the

    prompt and save the key.

    • Verify the key: Confirm the key was successfully registered.

    • Command Syntax: pureadmin list --publickey <USERNAME>'
  checks:
  - type: manual_review
    info: 'To align with the security recommendations, verify that SSH public keys are configured

      for users requiring CLI access (to prevent reliance on passwords) and test that the keybased authentication functions
      correctly.

      From the GUI:

      • Navigate to Settings > Access > Users and Policies.

      • In the Users panel, verify that a masked key is present in the Public Key column

      for each user who accesses the array via the CLI.

      • Test the configuration: Using an SSH client (such as PuTTY or the native UNIX

      ssh'
    severity: medium
- id: '1.6'
  title: Ensure brute-force lockout is set to 3 attempts with a lockout duration of at least 1 hour
  scoring: scored
  profile:
  - Level 1
  description: 'FlashArray supports controls to prevent brute-force guessing of passwords. These controls cause a user to
    be locked out after a configurable number of consecutive failed password attempts. The lockout lasts for a configurable
    duration of time. Everpure recommends the following: • The number of consecutive password failures before lockout should
    be 3. • The lockout duration should be no less than 1 hour. FlashArray supports a password policy for administrative user
    passwords. It allows rules to be configured governing complexity requirements, such as minimum length, number of required
    unique character groups (e.g. letters, numbers, symbols), and whether a user''s username may appear in their password.
    Everpure recommends the following: • The minimum password length should be 8 characters. • The minimum number of character
    groups should be 3. • The username check should be enabled. • The dictionary check should be enabled.'
  rationale: Password login is necessary in many environments, but brute-force password guessing is always a risk that comes
    with it. Configuring brute-force protection can help mitigate that risk. Password login is necessary in many environments,
    so enforcing password complexity can help mitigate that risk of passwords being guessed. Longer passwords with more complex
    character sets are harder to brute-force. Avoiding passwords containing an admin's username or common words can also help
    reduce the ability to brute force guess passwords.
  impact: Account lockout may inadvertently lock out legitimate administrators due to mistyped passwords or failed automation
    scripts. A lockout duration that is too long may delay access in time-sensitive situations. An administrator with array_admin
    privileges can manually unlock affected accounts via the CLI. Enforcing strong password complexity may cause friction
    for administrators accustomed to simpler passwords. Password rotation requirements introduce a maintenance burden and
    may result in temporary lockouts if rotation is not performed in time. Automated monitoring or reminders should be established
    for accounts approaching their password expiry.
  references: []
  page_start: 37
  audit_raw: 'To align with the security recommendations, verify that the array is configured to lock

    out users after a maximum of 3 failed login attempts, with a lockout duration of at least

    60 minutes.

    From the GUI:

    • Navigate to Settings > Access > Password Policy.

    • Review the global password policy and verify the Maximum Login Attempts is

    set to 3 (or fewer, but greater than zero).

    • Verify that the Lockout Duration is configured to at least 60 minutes.

    From the CLI:

    • Run the command purepolicy password list to display the

    configuration of the global password policy (named management).

    • Review the output to confirm that the Enabled status is True.

    • Review the Attribute and Value columns to confirm that Maximum Login Attempts

    is 3 or lower, and Lockout Duration is 60m or longer.

    • (Optional) Run the command pureadmin list --lockout to display any users

    that are currently locked out by the system.

    To align with the security recommendations, verify that the array enforces strong

    password complexity for local administrators, specifically requiring a minimum length of

    8 characters, at least 3 character groups, and actively enforcing both dictionary and

    username checks.

    From the GUI:

    • Navigate to Settings > Access > Password Policy.

    • Verify the Minimum Password Length is set to at least 8 characters.

    • Verify the Minimum Character Groups requirement is set to at least 3.

    • Verify that the Enforce Username Check and Enforce Dictionary Check

    toggles are enabled.

    From the CLI:

    • Run the command purepolicy password list to display the current

    configuration of the global password policy (named management).

    • Review the output to confirm the following Attribute and Value pairs are

    compliant:

    • Minimum Password Length is 8 or greater.

    • Minimum Character Groups is 3 or greater.

    • Enforce Dictionary Check is True.

    • Enforce Username Check is True.'
  remediation: 'To align with the security recommendations, configure the global password policy to

    enforce brute-force lockout protections and ensure the policy is actively enabled.

    From the GUI:

    • Navigate to Settings > Access > Password Policy.

    • Modify the password policy settings: set the Maximum Login Attempts to 3 and

    the Lockout Duration to 60 (minutes).

    • Ensure the policy is toggled to Enabled and click Save. (Note: If a legitimate

    administrator is inadvertently locked out, you must unlock their account manually

    from the CLI, as there is no specific GUI toggle documented for unlocking

    accounts in 6.9.x).

    From the CLI:

    • Configure the lockout thresholds: Set the lockout attributes on the global

    password policy (which applies to all local accounts) using the purepolicy

    password setattr command.

    • Command Syntax: purepolicy password setattr --max-login-attempts

    <ATTEMPTS> --lockout-duration <DURATION> management

    • Example: purepolicy password setattr --max-login-attempts 3 --

    lockout-duration 60m management

    • Enable the password policy: Ensure the management password policy is

    active.

    • Command Syntax: purepolicy password enable management

    • Unlock a locked account: If an administrator account is locked out and needs

    to be restored before the duration naturally expires, an array_admin can

    immediately reset the lockout.

    • Command Syntax: pureadmin reset <USERNAME> --lockout

    • Example: pureadmin reset admin1 --lockout

    To align with the security recommendations, configure the global password policy to

    mandate longer passwords, require multiple character groups, and prevent the use of

    easily guessable dictionary words or usernames.

    From the GUI:

    • Navigate to Settings > Access > Password Policy.

    • Set the Minimum Password Length to 8 (or more).

    • Set the Minimum Character Groups to 3.

    • Ensure the toggles for Enforce Username Check and Enforce Dictionary

    Check are enabled.

    • Click Save.

    From the CLI:

    • Configure Length and Complexity: Set the minimum password length and

    character group requirements using the purepolicy password setattr

    command.

    • Command Syntax: purepolicy password setattr --min-password-length

    <LENGTH> --min-character-groups <COUNT> management

    • Example: purepolicy password setattr --min-password-length 8 --

    min-character-groups 3 management

    • Enable Dictionary and Username Checks: Enable the specific security checks

    on the management password policy using the purepolicy password enable

    command.

    • Command Syntax: purepolicy password enable --username-check --

    dictionary-check management'
