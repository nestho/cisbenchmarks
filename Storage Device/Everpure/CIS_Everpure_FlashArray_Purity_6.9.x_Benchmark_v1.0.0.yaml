- id: '2.3'
  title: Ensure Active Directory accounts are configured to require TLS
  scoring: manual
  profile:
  - Level 1
  description: FlashArray supports native integration with Active Directory domains in order to enable LDAP lookups for authorization,
    and Kerberos authentication. FlashArray does this by creating a computer account in the domain to represent itself and
    generate kerberos keys. A unique AD account may be created for each server on the array that needs one. Everpure recommends
    that you configure TLS as required for all AD accounts. This is the default.
  rationale: While Active Directory supports non-TLS LDAP communication, it is less secure than TLS and allows for traffic
    to potentially be tampered with or exposed.
  impact: Requiring TLS for Active Directory communication depends on the domain controllers presenting valid certificates
    the array can validate. If a domain controller's certificate is untrusted or expired, AD authentication and LDAP lookups
    may fail until trust is reestablished. DNS must be correctly configured for the array to locate the domain controllers
    and validate their certificates.
  references: []
