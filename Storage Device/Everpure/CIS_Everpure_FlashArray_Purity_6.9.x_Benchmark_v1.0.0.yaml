- id: '1.2'
  title: Ensure a management LDAP/Active Directory service is configured and enabled with at least one group mapped
  scoring: manual
  profile:
  - Level 1
  description: If your environment does not support SAML, Purity can be integrated with an external identity provider (IDP)
    that supports LDAP. This allows for password login functionality in the Everpure Web UI and CLI, with user provisioning,
    password management, and authorization being controlled by the IDP. If a SAML configuration does not exist, Everpure recommends
    that you configure and enable the management LDAP directory service, with at least 1 group granted access to the array.
  rationale: FlashArray can be configured to communicate with one or more LDAP servers using the LDAP protocol and a service
    account. This LDAP communication channel is used to verify user passwords during passwordbased login, and retrieve information
    on the groups to which a user belongs for authorization purposes. This allows account management, authorization information,
    and passwords to be centralized within an IDP, allowing for the IDP to provision, de-provision, authorize, and de-authorize
    accounts centrally. An array can be configured to map authorization information based on directory server groups, and
    a user will be granted the combination of all roles mapped to groups to which they belong. Nested groups are also supported.
    Users who are authorized via LDAP may also login via SSH using a public key or SSH certificates if configured, and may
    login via the REST API with an API Token or OAuth JWTs if configured, and their authorization will be periodically refreshed
    from the LDAP server.
  impact: Directory service integration creates a dependency on the availability and reachability of the LDAP/AD server. If
    DNS resolution fails or the AD server is unreachable, directoryauthenticated administrators will be unable to log in,
    making local fallback accounts essential. When using LDAPS or LDAP with StartTLS (recommended), a valid server certificate
    must be maintained to avoid authentication failures.
  references: []
  page_start: 22
  audit_raw: 'To align with the security recommendations, verify that a Directory Service is configured

    for array management, role-group mappings are defined to govern authorization, and

    that the configuration successfully passes diagnostic connectivity tests.

    From the GUI:

    • Navigate to Settings > Access > Users and Policies.

    • Locate the Directory Service panel and select the Array Management view.

    • Verify that the Enabled status is set to true.

    • Review the configuration and verify that the URIs (preferably using ldaps://),

    Base DN, and Bind User are properly configured.

    • Review the Roles section to confirm that role-group mappings (Array Admin,

    Storage Admin, Ops Admin, Read Only) are defined to control authorization.

    • Test the configuration: Click Test in the upper-right corner of the panel to run

    the directory service diagnostic. Verify that resolving the URIs, binding and

    querying the tree, and finding the configured groups all return a PASSED status.

    From the CLI:

    • Run the command pureds list management (or pureds list) to display the

    current directory service configuration. Verify the URI, Base DN, and Bind User

    fields are correct and the service is enabled.

    • Run the command pureds role list to confirm that role-group mappings are

    securely defined for array roles.

    • Test the configuration: Run the command pureds test to verify that the array

    can successfully resolve the URIs, bind to the directory using the credentials, and

    locate the mapped groups without errors.'
  remediation: 'To align with the security recommendations, configure the management directory

    service with your LDAP/AD server parameters, map your directory groups to Purity//FA

    roles, and rigorously test the connection before enabling it.

    From the GUI:

    • Navigate to Settings > Access > Users and Policies.

    • In the Directory Service panel, select the Array Management button, then click

    the edit icon.

    • Enter your LDAP server URIs (using ldaps:// for encrypted connections), Base

    DN, Bind User, and Bind Password. Click Save.

    • In the Roles section of the panel, click the edit icon. Map your Active

    Directory/LDAP groups to the corresponding Purity//FA RBAC roles (Array

    Admin, Storage Admin, Ops Admin, Read Only) by specifying the Group

    (Common Name) and Group Base (Organizational Unit). Click Save.

    • Click Test to ensure the URIs resolve, the credentials bind successfully, and the

    mapped groups are found.

    • Once the test passes, click the Configuration edit icon again, toggle Enabled to

    blue (true), and click Save.

    From the CLI:

    • Configure the directory service: Set the LDAP URIs, base DN, and bind

    credentials using the pureds setattr command.

    • Command Syntax: pureds setattr --uri ldaps://<AD_SERVER>:636 --

    base-dn <BASE_DN> --bind-user <BIND_USER> --bind-password

    management

    • (Note: Purity will prompt interactively for the bind password to securely ingest it).

    • Configure role-group mappings: Map your LDAP groups to array roles (e.g.,

    array_admin).

    • Command Syntax: pureds role setattr <ROLE> --group <AD_GROUP> --

    group-base <OU>

    • Example: pureds role setattr array_admin --group pureadmins --

    group-base OU=Storage,DC=company,DC=com.

    • Test the configuration: Run the directory service test to ensure connectivity and

    valid group configurations.

    • Command Syntax: pureds test

    • Enable the directory service: Only enable the service after the test successfully

    passes.

    • Command Syntax: pureds enable management'
  checks:
  - type: manual_review
    info: 'To align with the security recommendations, verify that a Directory Service is configured

