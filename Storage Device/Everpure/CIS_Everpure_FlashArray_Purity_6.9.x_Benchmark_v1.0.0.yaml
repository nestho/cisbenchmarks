- id: '3.2'
  title: Ensure SMB client policies require encryption, restrict client access, and disable anonymous access
  scoring: scored
  profile:
  - Level 1
  description: 'SMB Client Policies are used to control access to any given file system export over any version of the SMB
    protocol. They can set properties such as SMB encryption requirements, and read-only vs. read-write based on client network
    identity. They may utilize hostnames, IP addresses, subnet ranges, or wildcards as client identities. Any client that
    does not match any rule in an SMB client policy will be denied access to the exports to which the policy is attached.
    Everpure recommends the following: • Do not use wildcard (*) clients in any SMB client policy rules. • Require SMB encryption
    in all SMB client policy rules. • Disable anonymous access in all SMB client policy rules. • Constrain allowed IPs based
    on clients'' expected to need access to the exports for any given policy.'
  rationale: Use of wildcard clients means that no IP addresses will be denied access to a file system export. Even if using
    central authentication with kerberos, there is still a risk of some other compromise occurring within the environment.
    As such, Everpure recommends that you limit the IPs allowed to any access. SMB encryption ensures privacy and integrity,
    and is supported by all modern SMB clients. It requires SMB 3.0 or greater. It does come with additional performance overhead,
    but it should not be made optional unless configuring clients where performance is paramount, or legacy clients that cannot
    support modern SMB versions. If it is not configured to be required, Everpure recommends that other controls outside of
    FlashArray be used to secure the network between FlashArray and its clients. Anonymous access allows clients to access
    SMB exports without authentication. It substantially weakens security and can result in unintended information disclosure
    or tampering. As such it should be disabled.
  impact: Restricting SMB client access by IP may break access for clients that use dynamic IP addresses or connect via NAT.
    Requiring SMB encryption adds minor cryptographic overhead and requires clients that support SMB 3.0 or greater; very
    old clients that cannot negotiate SMB 3 encryption will be unable to connect. Disabling anonymous access will break any
    workflow that depends on unauthenticated SMB access. Test all restrictions in a non-production environment before applying
    them to production exports.
  references: []
