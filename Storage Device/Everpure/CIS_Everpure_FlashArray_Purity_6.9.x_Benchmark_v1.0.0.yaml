  title: Ensure space consumption and performance are monitored for anomalies
  scoring: manual
  profile:
  - Level 1
  description: 'FlashArray offers capabilities for monitoring space consumption, data reduction, and performance across a
    variety of axes. For performance, these include, but are not limited to: • Array-wide • By directory • By volume • By
    volume group • By host • By host group For space, these include, but are not limited to: • Array-wide • By directory •
    By volume • By volume group • By host • By host group Everpure recommends the following: • Monitor the space consumption
    at various levels over time for anomalies such as rapid reduction in space utilization or data reduction. • Monitor performance
    at various levels over time for anomalies such as spikes in reads or writes by a specific client or user.'
  rationale: Sudden trends resulting in reduction in the data reduction ratio can indicate potential Ransomware attacks. Rapid
    reductions in utilized space can indicate malicious deletion of data. An unexpected spike in read bandwidth by a specific
    client, when compared to space utilization, can indicate potential exfiltration of data. Other similar anomalies in space
    and performance monitoring can indicate rogue actors having gained access to some part of the storage system.
  impact: Continuous monitoring requires integration with external monitoring infrastructure (SNMP, syslog, Pure1, or a third-party
    monitoring tool). The overhead on the FlashArray itself is minimal, but the receiving infrastructure must be sized to
    handle the volume of metrics data.
  references: []
  page_start: 115
  audit_raw: 'To align with the security recommendations, verify that space consumption and I/O

    performance are continuously monitored at the array, file system, and directory levels to

    detect potential anomalies such as ransomware encryption, data exfiltration, or

    malicious deletion.

    From the GUI:

    • Navigate to Analysis > Performance to review the array-wide and volume-level

    I/O metrics (Latency, IOPS, and Bandwidth) for any unexpected spikes or

    anomalies.

    • Navigate to Analysis > Capacity to review current array capacity utilization and

    trends.

    • Navigate to Storage > File Systems to verify the capacity utilization of specific

    file systems.

    From the CLI:

    • Check file system / directory space usage by running the command puredir

    list --space.

    • Check real-time or historical array performance metrics by running the command

    purearray monitor (or purearray monitor --historical <TIME>).

    • Check array-wide space usage by running the command purearray list --

    space.'
  remediation: 'To align with the security recommendations, implement a regular monitoring process

    using the built-in Analysis dashboards or automated CLI scripts to track capacity and

    performance trends.

    From the GUI:

    • Establish a continuous manual monitoring routine using the Analysis > Capacity

    and Analysis > Performance pages to monitor capacity trends and

    bandwidth/IOPS metrics.

    • Ensure you have configured syslog servers or email alert watchers (as covered

    in earlier sections) so that built-in capacity alerts (e.g., warnings when storage

    consumption reaches 90% of usable capacity) are proactively pushed to your

    monitoring teams.

    From the CLI:

    • Implement a scheduled automation script to periodically pull space and

    performance metrics to an external monitoring system using the following

    commands:

    • Array Space: purearray list --space

    • Array Performance: purearray monitor

    • File System / Directory Space: puredir list --space'
