      • Navigate to Protection > Array.

      • Scroll to the Offload Targets panel and verify that at least one target is listed

      and its Status is connected.

      • Review the Details column to verify that if a custom URI/endpoint is co'
    severity: medium
- id: '4.7'
  title: Ensure the health of array connections and offload targets is continuously monitored
  scoring: manual
  profile:
  - Level 1
  description: Whether utilizing array connections or offload targets, FlashArray periodically monitors them for health issues
    that impact your ability to backup data. Everpure recommends that you monitor the health of your array connections and
    offload targets, in order to detect unhealthy statuses.
  rationale: Replication backups are crucial for security, and so verifying that replication connections are functional ensures
    non-disrupted data protection functionality.
  impact: Continuously monitoring the health of array connections and offload targets requires configuring and maintaining
    external log forwarding (such as syslog, SNMP, or email alerts), which consumes network bandwidth and external storage
    capacity. When connections become unstable or degrade (entering a connecting or quarantined state), the array will automatically
    generate alerts that administrators or automated SIEM tools must actively process.
  references: []
  page_start: 148
  audit_raw: 'To align with the security recommendations, verify that array connections, offload

    targets, and replication links are actively monitored to ensure they are healthy and fully

    functioning.

    From the GUI:

    • Navigate to Protection > Array.

    • Review the Connected Arrays panel and verify that the Status column for peer

    arrays shows as connected rather than connecting or quarantined.

    • Review the Offload Targets panel and verify that the Status column shows as

    connected rather than connecting, Scanning, or Not Connected.

    • Navigate to Protection > ActiveDR and review the Replica Links pane to

    ensure no links display an unhealthy status.

    From the CLI:

    • Run the command purearray connection list to verify the status of peer

    array connections.

    • Run the command purepod replica-link list to verify the status of

    ActiveDR connections.

    • Run the command pureoffload list to display all connected offload targets.

    • Review the outputs to ensure the paths are healthy and not displaying a

    connecting, quarantined, or unhealthy state.'
  remediation: 'Because this is a continuous monitoring procedure, remediation involves establishing

    regular manual or automated review processes to track connection metrics and respond

    to anomalies.

    From the GUI (for manual monitoring):

    • Navigate to Protection > Array.

    • In the Connected Arrays panel, monitor the Status column. A status of

    connecting indicates an unhealthy connection (typically due to network issues),

    while quarantined indicates an unstable synchronous replication path that has

    been temporarily embargoed.

    • In the Offload Targets panel, monitor the Status column. A status of connecting

    indicates an unhealthy network connection to the bucket/container, while Not

    Connected indicates the offload app itself is not running.

    • Navigate to Health > Alerts to proactively review any generated alerts citing

    degraded connections or unhealthy paths.

    From the CLI (for manual monitoring or scripted checks): Establish a scheduled

    process (such as a cron job via REST API or SSH) to periodically execute the following

    diagnostic commands:

    • Monitor Array Connections: Run purearray connection list periodically.

    Investigate any paths that do not report a connected status.

    • Monitor Offload Targets: Run pureoffload list periodically to ensure external

    storage targets are successfully reachable.

    • Monitor ActiveDR/ActiveCluster: Run purepod replica-link list to check for

    unhealthy ActiveDR links, and purepod list --mediator to ensure the Pure1 Cloud

    Mediator is Online and not Unreachable.

    • Monitor Alerts: Run purealert list to view recent system alerts regarding

    connectivity drops. (Note: The puremessage command was deprecated in

    Purity//FA 6.8.0 and its functionality is now handled by purealert).'
  checks:
  - type: manual_review
    info: 'To align with the security recommendations, verify that array connections, offload

      targets, and replication links are actively monitored to ensure they are healthy and fully

      functioning.

      From the GUI:

      • Navigate to Protection > Array.

      • Review the Connected Arrays panel and verify that the Status column for peer

      arrays shows as connected rather than connecting or quarantined.

      • Review the Offload Targets panel and verify that the Status column shows as

      connected rather than connecting, Scanning,'
    severity: medium
