      connected.

      • Review the connection details in the panel and verify that the connec'
    severity: medium
- id: '4.6'
  title: Ensure a snapshot offload target using HTTPS is configured when no array connection is available
  scoring: manual
  profile:
  - Level 2
  description: FlashArray allows for connections to be created between a FlashArray and a generic offload target. Offload
    targets allow snapshots to be stored externally to the array, with storage and transmission of proprietary-format snapshots
    via standardized 3rd party protocols. Offload targets can either utilize the S3 data format, such as Amazon AWS, or the
    Azure blob format. This allows for backups of data to be copied to a 3rd party backup target, enabling disaster recovery.
    This can be an alternative to array connections for backups if there is no secondary FlashArray available. If no array
    connection can be created, Everpure recommends that you configure at least one offload target. If an offload target is
    created, and a URI or endpoint is specified, Everpure recommends that it utilizes https.
  rationale: Backing up data to a secondary system is important for recovery in the case of disasters, as well as physical
    compromise that may render an array unusable. If backup to a secondary FlashArray is unavailable, backup to a 3rd party
    storage provider can be a reasonable alternative. Such backups should still be encrypted using https.
  impact: Configuring a snapshot offload target requires the CloudSnap Purity//FA app to be installed on the array, which
    requires explicit intervention from Everpure Technical Services to deploy. Once configured, data transmitted to the offload
    target is stored unencrypted by the array, meaning administrators must strictly enforce server-side default encryption
    on their target S3 buckets or Azure Blob containers to ensure data-atrest security. Additionally, unlike array-to-array
    replication, offload targets do not support the replication of hosts or host groups; administrators must specifically
    target the underlying volume members when building the protection group.
  references: []
  page_start: 144
  audit_raw: 'To align with the security recommendations, verify that if an array connection cannot be

    created for replication, at least one snapshot offload target is configured, and that any

    custom URIs specified for the target strictly utilize HTTPS to encrypt data in flight.

    From the GUI:

    • Navigate to Protection > Array.

    • Scroll to the Offload Targets panel and verify that at least one target is listed

    and its Status is connected.

    • Review the Details column to verify that if a custom URI/endpoint is configured, it

    utilizes https://.

    From the CLI:

    • Run the command pureoffload list to display all connected offload

    targets and their general statuses.

    • Run pureoffload s3 list or pureoffload azure list to display detailed connection

    settings.

    • Review the output to ensure the connection exists and that any defined URI uses

    the https:// protocol rather than http://.'
  remediation: 'To align with the security recommendations, establish an offload target to act as a

    secondary backup repository and ensure secure transmission by enforcing HTTPS for

    any custom endpoints.

    From the GUI:

    • Navigate to Protection > Array.

    • In the Offload Targets panel, click the + (connect) icon.

    • In the Connect Offload Target window, select the Protocol (s3 or azure).

    • For Azure Blob: Type a target Name, the Microsoft Azure Account name, the

    Container name, and the Secret Access Key.

    • For S3: Type a target Name, the AWS Access Key ID, the Bucket name, and

    the Secret Access Key.

    • If a custom endpoint/URI is required, ensure it begins with https://.

    • If this is the first time a FlashArray is connecting to this specific bucket or

    container and it is currently empty, select the check box to Initialize the target.

    • Click Connect.

    From the CLI:

    • Connect to Azure Blob: Connect the array to a Microsoft Azure Blob container

    using the pureoffload azure connect command. (Note: Purity//FA will prompt

    you interactively to enter the secret access key twice).

    • Command Syntax: pureoffload azure connect --account-name <ACCOUNT>

    --container-name <CONTAINER> <TARGET_NAME>

    • Connect to S3: Connect the array to an S3 bucket using the pureoffload s3

    connect command. If using a custom URI, enforce HTTPS using the --uri flag.

    (Note: Purity//FA will prompt you interactively to enter the secret access key

    twice).

    • Command Syntax: pureoffload s3 connect --access-key-id <KEY_ID> --

    bucket <BUCKET> --uri https://<URI> <TARGET_NAME>

    • Initialize the target (Optional): Append the --initialize flag to either command if

    this is the first time the array is connecting to the empty Azure container or S3

    bucket.'
  checks:
  - type: manual_review
    info: 'To align with the security recommendations, verify that if an array connection cannot be

      created for replication, at least one snapshot offload target is configured, and that any

      custom URIs specified for the target strictly utilize HTTPS to encrypt data in flight.

