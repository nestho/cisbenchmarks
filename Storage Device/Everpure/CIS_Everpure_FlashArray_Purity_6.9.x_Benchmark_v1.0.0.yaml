- id: '2.9'
  title: Ensure product diagnostic tests for environmental integrations are run periodically
  scoring: manual
  profile:
  - Level 1
  description: 'For many environmental integrations mentioned in this section, there exists FlashArray functionality to detect
    that your configuration is still working. Everpure recommends that you periodically run the product diagnostics tests
    for the following configurations: • SAML • LDAP • Active Directory • Syslog • SMTP Email delivery to alert watchers •
    SNMP delivery to SNMP managers • NTP NFS Export Policies are used to control access to any given file system export over
    any version of the NFS protocol. They can set properties such as permitted authentication mechanisms, allowance of root
    access from clients, and read-only vs. read-write based on client network identity. They may utilize hostnames, IP addresses,
    subnet ranges, or wildcards as client identities. Any client that does not match any rule in an NFS export policy will
    be denied access to the exports to which the policy is attached. Everpure recommends the following: • Do not use wildcard
    (*) clients in any NFS export policy rules. • Do not permit sys authentication in any NFS export policy rules. • Enable
    root squash for all clients in all NFS export policy rules. • Constrain the allowed IP addresses to only those clients
    expected to need access to the exports for any given policy. • Enable only krb5p authentication for clients where privacy
    is a concern. krb5i is recommended to be enabled for clients where data integrity is important but data privacy is not.'
  rationale: Even if a configuration was correct initially, it is possible for it to cease functioning later due to changes
    in DNS, changes in the network, expiration or rotation of certificates for TLS, removal of credentials, or other similar
    issues. Many of these configurations are crucial for security or for monitoring, and so verifying that they are functional
    ensures non-disrupted product functionality as well as that you will properly be alerted of other system events that may
    require attention. Use of wildcard clients means that no IP addresses will be denied access to a file system export. Even
    if using central authentication with kerberos, there is still a risk of some other compromise occurring within the environment.
    As such, Everpure recommends that you limit the IPs allowed to any access. krb5p and krb5i both come with performance
    penalties in order to improve security. krb5 provides only centralized identity and authentication, but if performance
    is paramount then it may see use. NFS sys authentication provides no security or identity controls, allowing for clients
    to act as any user, and should only be considered when there are strong guarantees on network security enforced outside
    of FlashArray. However, if such network controls are compromised, sys authentication provides no protection. Root squash
    is important to configure in order to avoid privilege escalation on a client, or a rogue client, gaining elevated privileges
    on the export, as it prevents them from assuming root on the export as a result of having root access locally.
  impact: Periodic diagnostic testing has minimal impact on the array itself. Running tests against external integrations
    (SAML, LDAP/AD, syslog, SMTP, SNMP, NTP) generates authentication or connection attempts against those systems, so schedule
    them sensibly to avoid noise in downstream logs. A failed test indicates an integration has stopped functioning and should
    be investigated promptly, since it may mean security events are no longer being delivered. Restricting NFS client access
    by IP may break access for clients that use dynamic IP addresses or that connect via NAT. Enabling root squash may break
    applications that require root access to NFS mounts. All restrictions should be tested in a non-production environment
    before being applied to production exports.
  references: []
  page_start: 97
  audit_raw: 'To align with the security recommendations, verify that an automated script or regular

