- id: '2.8'
  title: Ensure at least 3 NTP servers and an NTP symmetric key are configured
  scoring: scored
  profile:
  - Level 2
  description: 'The network time protocol (NTP) allows time to be synchronized between devices on a network. Everpure recommends
    the following: • Configure at least 3 NTP servers. • Configure an NTP symmetric key. Note: The NTP symmetric key cannot
    be configured through the GUI. This can only be done through the CLI.'
  rationale: There are many security and data protection controls that rely on time. Properly checking the validity of certificates,
    short lived credentials, and other keys depends on proper time synchronization. Similarly there exist data protection
    features that rely on time. As such, synchronization of time on your network is crucial for appropriate security behavior.
    It is therefore recommended that you configure multiple NTP servers for redundancy. NTP symmetric keys are used for generating
    message authentication codes when synchronizing time. These prevent a malicious actor from intercepting and tampering
    with NTP messages. FlashArray will ignore NTP messages after initial startup that substantially alter time, but in order
    to prevent any tampering with time by a bad network actor, Everpure recommends that you configure an NTP symmetric key.
  impact: NTP symmetric key authentication requires that all configured NTP servers support and are configured with matching
    key IDs and keys. Misconfiguration may result in NTP authentication failures and loss of time synchronization. Time drift
    can cause authentication failures and log inconsistencies.
  references: []
  page_start: 94
