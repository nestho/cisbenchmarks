- id: '3.3'
  title: Ensure native Active Directory integration is used for NFS and SMB identity and authentication
  scoring: manual
  profile:
  - Level 1
  description: FlashArray supports native integration with Active Directory domains in order to enable LDAP lookups for authorization,
    and Kerberos authentication, for both NFS and SMB file access. FlashArray does this by creating a computer account in
    the domain to represent itself and generate kerberos keys. A unique AD account may be created for each server on the array
    that needs one. Everpure recommends that FlashArray's native Active Directory integration be configured in all environments
    where Active Directory provides identity, authentication, and authorization for NFS and SMB clients.
  rationale: FlashArray also supports configuring an LDAP directory service, or NIS, for use with NFS for identity and authorization.
    It also supports manual uploading of kerberos keys to be used for authentication. However, each of these has security
    weaknesses when compared with native Active Directory integration. While the LDAP directory service can provide the same
    level of TLS protection of traffic, its authentication relies on a bind username and password, with simple authentication.
    Comparatively, native Active Directory integration allows the array to represent itself with a computer account and authenticate
    to the domain using kerberos. No raw passwords are ever stored on the array. This allows for stronger authentication and
    identity.
  impact: AD join failures — due to password expiry for the service account, network connectivity issues, or DNS misconfigurations
    — can prevent all SMB clients from accessing file data. The AD join should be monitored and the service account should
    be excluded from password expiry policies with appropriate compensating controls.
  references: []
