- id: '2.5'
  title: Ensure syslog servers use TLS with a configured CA root of trust
  scoring: scored
  profile:
  - Level 1
  description: 'FlashArray supports configuring remote syslog servers to receive a variety of different messages, including
    administrative and data audit records, session records, and alerts. Everpure recommends the following: • Configure all
    syslog servers to use TLS to protect traffic from inspection and tampering. • Configure one or more certificate authorities
    as roots of trust for syslog servers.'
  rationale: Syslog messages for audits, sessions, etc. are important for detection and response pipelines. As such it is
    prudent to ensure they cannot be tampered with. Some such information can also be considered sensitive or contain PII,
    and so avoiding disclosure of their contents is also important. As such, proper roots of trust are important for ensuring
    the TLS authenticity cannot be compromised, and such TLS traffic cannot be intercepted.
  impact: TLS syslog requires a syslog receiver (e.g., rsyslog, Splunk) configured to accept TLS connections on an appropriate
    port (typically TCP 6514). The receiver must present a valid TLS certificate, and certificate validation must be maintained.
    If the TLS handshake fails, log events may be dropped or buffered depending on the syslog implementation.
  references: []
