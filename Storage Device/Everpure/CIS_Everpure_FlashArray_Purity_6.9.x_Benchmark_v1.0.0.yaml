- id: '1.9'
  title: Ensure static REST API tokens are used only when necessary and configured to expire periodically
  scoring: manual
  profile:
  - Level 1
  description: 'FlashArray supports administrators creating static API for REST API access. This should only be utilized in
    cases where OAuth usage is not feasible. Everpure recommends the following: • REST API tokens can be configured to expire.
    If REST API tokens are configured, configure them to expire periodically. • Only create REST API tokens if no API Clients
    for OAuth can be created and enabled for REST access. • If REST API tokens are configured, it is highly recommended that
    you monitor which IP addresses access the REST API.'
  rationale: API Tokens are a custom mechanism for REST API access, with no standardized mechanism for rotation. As such,
    changing them is more difficult. But making them nonexpiring increases the risk of compromise, because a one-time exposure
    of the token can lead to compromise for an indefinite window of time. API Tokens also act exactly as the user who creates
    them, with full permissions. So an API token created by an array_admin for something like performance monitoring can still
    act with full array_admin rights. As such, a compromised application using API Tokens cannot have the impact limited by
    compensating controls around the role assigned to the token. As such, the only compensating control to reduce the impact
    of a compromised API Token are network access controls to the REST API.
  impact: Deleting an API token that is actively used by an automation tool or integration will immediately break that integration.
    All token changes should be made in coordination with the teams responsible for API consumers.
  references: []
  page_start: 47
  audit_raw: 'To align with the security recommendations, verify that static API tokens are only issued

    when OAuth usage is not feasible, that tokens are assigned only to accounts with the

    minimum necessary privileges, and that tokens are configured to expire periodically to

    reduce the risk of long-term compromise.

    From the GUI:

    • Navigate to Settings > Access > Users and Policies.

    • In the Users panel under the Array tab, check the API Token column to see

    which users have a masked token present.

    • For users with a token, click the Edit (three vertical dots) icon and select Show

    API Token... to view the token details.

    • Review the token creation and expiry dates. Verify that only accounts actively

    requiring API access have tokens, and that they enforce an appropriate

    expiration timeframe.

    From the CLI:

    • Run the command pureadmin list --api-token to list all accounts

    and their API token status.

    • Review the Created and Expires columns to identify tokens that lack an

    expiration date (indicated by a -) or have existed longer than the organization''s

    rotation policy allows.

    • Verify that each token-holding account is assigned the minimum required

    management access policy.'
  remediation: 'To align with the security recommendations, delete unauthorized or stale API tokens,

    and ensure that any newly issued tokens are configured with a strict validity period

    (timeout) so they expire automatically.

    From the GUI:

    • Navigate to Settings > Access > Users and Policies.

    • In the Users panel, click the Edit icon for the user you want to modify.

    • To delete a token: Select Remove API Token... and click Remove to confirm.

    • To rotate or create an expiring token: Select Create API Token... (or

    Recreate API Token... to overwrite an existing one). In the prompt, enter a

    validity period in the Expires In field so the token does not live indefinitely, then

    click Create.

    From the CLI:

    • Delete an existing API token:

    • Command Syntax: pureadmin delete --api-token <USERNAME>

    • Create a new API token with an expiration: Ensure you use the --timeout flag

    to enforce an expiry period (e.g., s, m, h, d, or w).

    • Command Syntax: pureadmin create --api-token --timeout <PERIOD>

    <USERNAME>

    • Example: pureadmin create --api-token --timeout 30d pureuser

    • Retrieve the new token for the consumer:

    • Command Syntax: pureadmin list --api-token --expose <USERNAME>

    (Note: Store the token securely in a secrets manager. Never embed tokens in

    plaintext configuration files).'
