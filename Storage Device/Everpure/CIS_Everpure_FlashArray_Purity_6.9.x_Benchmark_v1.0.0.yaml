- id: '2.1'
  title: Ensure array TLS certificates are CA-signed, adequately sized, and rotated at least every 90 days
  scoring: manual
  profile:
  - Level 1
  description: 'FlashArray allows certificates on the system to be centrally managed. This includes both "array-type" certificates,
    which the FlashArray storage array can use to represent itself to clients, and "external-type" certificates which can
    be the public certificates of certificate authorities that sign the certificates of other environmental resources or the
    public certificates of self-signed environmental resources. Everpure recommends the following: • All RSA certificates
    in use should have at least 2048-bit keys. • All ECDSA certificates in use should have at least 256-bit keys. • Only "external-type"
    certificates should be used as roots of trust for other environmental resources. • All "array-type" certificates should
    be signed by a certificate authority. • All "array-type" certificates should have a lifetime of at most 90 days.'
  rationale: RSA and ECDSA Key size recommendations are in-line with NIST standards to ensure cryptographic strength. Using
    "external-type" certificates as roots of trust ensures that it is not possible to mistakenly upload a private key to the
    system for a configuration that does not require it. Ensuring all "array-type" certificates are signed by a trusted certificate
    authority ensures that clients, whether for administrative TLS, S3, or another protocol can use a strong root of trust
    for communication with FlashArray. It also allows rotation of certificates to be done with no client disruption. Rotating
    certificates periodically reduces the impact of a compromised private key.
  impact: Certificate rotation requires a brief period during which the management interface may be inaccessible. Certificates
    have finite validity periods and must be renewed before expiry. Expired certificates will prevent proper TLS validation
    and generate security warnings. Automated certificate management (e.g., via ACME/Let's Encrypt or an enterprise CA) is
    strongly recommended to prevent unplanned certificate expiry.
  references: []
  page_start: 70
  audit_raw: 'To align with the security recommendations, verify that the array uses an appropriately

    sized, CA-signed certificate with a maximum lifetime of 90 days, and that external

    certificates are properly utilized for roots of trust.

    From the GUI:

    • Navigate to Settings > System and locate the SSL Certificate panel.

    • In the Array Certificates panel, click the active management certificate to view

    its details.

    • Verify the following attributes for the array certificate:

    • Key Size is at least 2048 (for RSA) or 256 (for ECDSA).

    • Issuer is a trusted internal or public Certificate Authority (not "Everpure" or "SelfSigned").

    • The duration between the Valid From and Valid To dates is 90 days or less.

    • Scroll to the External Certificates panel and verify that any certificates used as

    roots of trust are configured here (ensuring they are external-type).

    From the CLI:

    • Run the command purecert list to display the active certificates on the array.

    • Review the output to ensure the following for your array type certificates:

    • The Issuer is a trusted Certificate Authority.

    • The Key Size is at least 2048 (for RSA) or 256 (for ECDSA).

    • The difference between the Valid From and Valid To dates does not exceed 90

    days.

    • Verify that roots of trust are explicitly stored and listed under the external Type.'
  remediation: 'To align with the security recommendations, generate a properly sized Certificate

    Signing Request (CSR), have it signed by your CA for a maximum of 90 days, import it,

    and manage your roots of trust using external certificates.

    From the GUI:

    • Navigate to Settings > System and locate the SSL Certificate / Array Certificates

    panel.

    • Click the menu icon and select Construct Certificate Signing Request. Fill in

    the required attributes and ensure the key size meets the 2048-bit RSA or 256-bit

    ECDSA minimums. Click Create and download the CSR.

    • Submit the CSR to your organization''s trusted Certificate Authority and request

    that the signed certificate has a lifetime of 90 days or less.

    • Once the CA returns the signed certificate, return to the GUI, click the menu icon,

    and select Import Certificate to replace the existing certificate.

    • To configure roots of trust, navigate to the External Certificates panel and

    import the trusted CA''s public certificates.

    • Establish an operational process to rotate the array-type certificates every 90

    days.

    From the CLI:

    • Prepare the Key & CSR: Construct a Certificate Signing Request using the

    purecert csr create command. (Note: Purity uses RSA 2048 by default. If

    you need to change the key algorithm to ECDSA or increase the key size, first

    run purecert self-signed setattr --new-key --key-algorithm

    <ALGORITHM> --key-size <SIZE> before generating the CSR.)

    • Command Syntax: purecert csr create <NAME> --common-name <FQDN>

    • Submit the generated CSR block to your Certificate Authority and request a

    signed certificate with a validity period of 90 days or less.

    • Import the Signed Certificate: Once the CA returns the signed certificate,

    import it using the purecert imported setattr command. (Append the --

    intermediate-certificate flag if required).

    • Command Syntax: purecert imported setattr <NAME>

    • Import Roots of Trust: Ensure any CA root certificates are imported as external

    certificates rather than array certificates.

    • Establish a continuous operational process (such as a scheduled automation

    script) to rotate these certificates every 90 days.'
  checks:
  - type: manual_review
    info: 'To align with the security recommendations, verify that the array uses an appropriately

      sized, CA-signed certificate with a maximum lifetime of 90 days, and that external

      certificates are properly utilized for roots of trust.

      From the GUI:

      • Navigate to Settings > System and locate the SSL Certificate panel.

      • In the Array Certificates panel, click the active management certificate to view

      its details.

      • Verify the following attributes for the array certificate:

      • Key Size is at least 2048 (for '
    severity: medium
- id: '2.2'
  title: Ensure SAML SSO uses HTTPS with encrypted assertions and signed requests
  scoring: manual
  profile:
  - Level 2
  description: SAML may be used for delegated authentication across various protocols on FlashArray. The array URL, IDP metadata
    URL, and IDP URL are all required to use https if specified. IDP Metadata URL usage is optional; if one is not used, then
    you may instead manually configure the IDP URL, verification certificate, and IDP entity ID. It is recommended that encrypted
    assertions from the IDP be enabled if your IDP supports them, and a decryption certificate be configured. It is recommended
    that signed requests from the array be enabled if your IDP supports them, and a signing credential be configured.
  rationale: Encrypted assertions prevent the SAML assertions from your IDP from being read by entities other than the FlashArray
    array. This ensures that any sensitive information that may be in such assertions, such as PII, roles, or group memberships
    cannot be read by unintended actors. Signed requests from the array ensure that the array cannot be impersonated in requests
    to the IDP. This prevents malicious actors from forging requests to your IDP in order to attempt to obtain information
    about arbitrary users or services.
  impact: SAML certificate rotation requires coordination between the FlashArray administrator and the IdP administrator to
    ensure that the new SP certificate is updated in the IdP configuration before the old certificate expires, to avoid authentication
    outages.
  references: []
  page_start: 74
  audit_raw: 'To align with the security recommendations, verify that the SAML SSO integration

    strictly utilizes HTTPS for all communication URLs, enforces encrypted assertions from

    the Identity Provider (IdP) to prevent interception, and enforces signed requests from

    the FlashArray to prevent impersonation.

    From the GUI:

    • Navigate to Settings > Access > Users and Policies and scroll to the SAML2

    SSO pane.

    • Review the configured URLs (Array URL, IdP URL, or Metadata URL) to verify

    they all utilize the https:// scheme.

    • Click the edit icon for the Configuration.

    • Verify that the Sign Request toggle is enabled (blue) and that a valid Signing

    Credential is configured.

    • Verify that the Encrypt Assertion toggle is enabled (blue) and that a valid

    Decryption Credential is configured.

    • Verify that the Verification Certificate is present, issued by a trusted Certificate

    Authority, and has not expired.

    From the CLI:

    • Display the full SAML2 SSO configuration and certificate details by running the

    command puresso saml2 list --verification-certificate.

    • Review the output to confirm that the Array URL and IdP URL fields begin with

    https://.

    • Verify that the Sign Request and Encrypt Assertion attributes are set to True.

    • Review the Verification Certificate details to ensure it was issued by a trusted CA

    and the Valid To date is not expired.'
  remediation: 'To align with the security recommendations, update your SAML2 SSO configuration to

    require HTTPS, signed requests, and encrypted assertions using dedicated credentials.

    From the GUI:

    • Navigate to Settings > Access > Users and Policies and scroll to the SAML2

    SSO pane.

    • Click the edit icon for the Configuration.

    • Update the Array URL and IdP URL fields to ensure they begin with https://.

    • Enable Signed Requests: Slide the Sign Request toggle to the right (blue) and

    enter your array''s signing certificate name in the Signing Credential field.

    • Enable Encrypted Assertions: Slide the Encrypt Assertion toggle to the right

    (blue) and enter your array''s decryption certificate name in the Decryption

    Credential field.

    • If the Verification Certificate is expired or self-signed, click Edit to paste the

    new PEM-formatted certificate from your IdP.

    • Click Save. (Note: Always perform an E2E Test from the GUI after making SAML

    changes to ensure administrative access is not interrupted).

    From the CLI:

    • Secure the SAML configuration: Update the URLs to HTTPS and set the

    signing/decryption credentials with puresso saml2 setattr, then turn on

    request signing and assertion encryption with puresso saml2 enable.

    • Command Syntax (set URLs and credentials): puresso saml2 setattr --

    array-url https://<ARRAY_FQDN> --idp-url https://<IDP_URL> --

    signing-credential <CRED_NAME> --decryption-credential

    <CRED_NAME> <IDP_NAME>

    • Command Syntax (enable signing and encryption): puresso saml2 enable --

    sign-request --encrypt-assertion <IDP_NAME>

    • Update the Verification Certificate: If the IdP certificate is expired or selfsigned, replace it using the --verification-certificate
    flag.

    • Command Syntax: puresso saml2 setattr --verification-certificate

    <IDP_NAME>

    • Action: Paste the new PEM-formatted certificate at the interactive prompt, press

    Enter, and then press Ctrl-D.'
  checks:
  - type: manual_review
    info: 'To align with the security recommendations, verify that the SAML SSO integration

      strictly utilizes HTTPS for all communication URLs, enforces encrypted assertions from

      the Identity Provider (IdP) to prevent interception, and enforces signed requests from

      the FlashArray to prevent impersonation.

      From the GUI:

      • Navigate to Settings > Access > Users and Policies and scroll to the SAML2

      SSO pane.

      • Review the configured URLs (Array URL, IdP URL, or Metadata URL) to verify

      they all utilize the https'
