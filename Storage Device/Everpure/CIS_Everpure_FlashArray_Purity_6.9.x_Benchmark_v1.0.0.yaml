    • Command Syntax: purepolicy nfs rule add --client <SUBNET> --rootsquash --version nfsv4 --security krb5p <POLICY_NAME>

    • Example: purepolicy nfs rule add --client 192.168.10.0/24 --rootsquash --version nfsv4 --security krb5p nfs_secure_policy

    • Remove overly permissive rules: Use the purepolicy nfs rule remove

    command to delete the old, non-compliant rule.

