  title: Ensure LDAP directory services use LDAPS with a configured CA root of trust
  scoring: scored
  profile:
  - Level 1
  description: 'FlashArray supports LDAP directory services for administrative login and authorization, as well as for NFS
    authorization. Everpure recommends the following: • Utilize LDAPS in order to establish secure LDAP connections. • Specify
    one or more certificate authorities as roots of trust for each LDAP directory service.'
  rationale: Encrypting LDAP communication with TLS is crucial to prevent malicious actors from inspecting or tampering with
    LDAP traffic pertaining to authorization. Proper roots of trust are important for ensuring the TLS authenticity cannot
    be compromised, and such TLS traffic cannot be intercepted.
  impact: LDAPS requires that the LDAP/AD server presents a valid TLS certificate. If the server's certificate is self-signed,
    you must import the CA certificate to the FlashArray for validation. Switching from LDAP to LDAPS may cause temporary
    authentication disruption during the transition.
