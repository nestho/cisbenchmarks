- id: '3.6'
  title: Ensure SMB audit policies with syslog and file log targets are attached to production file systems
  scoring: manual
  profile:
  - Level 1
  description: 'FlashArray supports creation of one or more audit policies for enabling audit of operations over the SMB data
    protocol. These audit policies may be used to send audit records to remote syslog servers for monitoring. Everpure recommends
    the following: • Configure at least 1 syslog server and 1 directory as log targets among your audit policies for SMB.
    • Configure at least 1 audit policy with a syslog log target, attached to each file system that stores production data
    and enables the SMB protocol for access. • Configure at least 1 audit policy with a file log target, attached to each
    file system that stores production data and enables the SMB protocol for access. • Instruct administrative users for each
    file system SMB export to configure appropriate SACLs to ensure proper auditing.'
  rationale: Auditing access and operations to file data over the SMB protocol allows for detection of unexpected behavior
    by SMB clients, which can indicate malicious actors gaining unintended access to an export. Sending of audit records to
    a remote syslog server allows for logs across systems to be aggregated and analyzed centrally. This allows for better
    analysis of patterns spanning across systems and management of retention for detection and response, but it can also lead
    to dropped logs due to network bandwidth limitations. Locally stored audit records do not have a dependency on the network,
    and can be more reliable, but can be more difficult to integrate into real-time analysis pipelines since they would need
    to be periodically pulled. As such, it is recommended that both remote syslog and local log targets be utilized, with
    appropriate retention based on your environment. This enables central aggregation of audit records for detection and response,
    while also ensuring that there is a robust local backup of logs in case of a network or syslog server outage. Which files,
    directories, and operations within a file system are audited is determined by SACLs, and which users can set SACLs is
    determined by the GPOs in your Active Directory domain. So users in the appropriate groups must be instructed to configure
    SACLs appropriately in order to ensure auditing is enabled.
  impact: Enabling SMB file auditing introduces several operational and resource impacts. Sending continuous file access logs
    to a remote syslog server consumes network bandwidth and requires significant long-term storage capacity and processing
    power on the receiving SIEM. Utilizing a local managed directory as a file log target also consumes physical storage capacity
    on the FlashArray.
  references: []
  page_start: 118
  audit_raw: 'To align with the security recommendations, verify that at least one syslog server and

    one local directory are configured as file log targets, and that an active audit policy is

    attached to all file systems utilizing SMB.

    From the GUI:

    • Navigate to Settings > System to verify that a remote syslog server is

    configured (in the Syslog Servers panel) and a local directory is configured (in

    the File Log Targets panel).

    • Navigate to Storage > Policies.

    • Scroll to the Audit Policies panel and select your configured audit policy.

    • Review the Details panel to verify that both the local directory and syslog server

    are listed as log targets.

    • Review the Members panel to verify that the policy is attached to the appropriate

    production managed directories. (Note: Verifying that proper System Access

    Control Lists (SACLs) are applied to the SMB share must be done externally via

    Windows MMC or similar tools, as this is not visible in the Purity GUI).

    From the CLI:

    • Run the commands purelog file list and purelog syslog list to verify

    that local and remote log targets exist.

    • Run the command purepolicy audit file list to verify that an audit

    policy exists and its Enabled status is set to True.

    • Review the policy members by running purepolicy audit file list --member to

    ensure the policies are successfully attached to the correct source managed

    directories.'
  remediation: 'To align with the security recommendations, establish file log targets, create an audit

    policy, attach it to your production managed directories, and externally configure SACLs

    for SMB exports.

    From the GUI:

    • Create the File Log Target: Navigate to Settings > System. In the File Log

    Targets panel, click the + (Create) icon. Provide a name, select an empty

    managed directory to store the logs, configure a retention policy (Keep For or

    Keep Size), and click Create.

    • Create the Syslog Target (if not already configured): In the Syslog Servers

    panel, add your remote syslog server URI.

    • Create the Audit Policy: Navigate to Storage > Policies. In the Audit Policies

    panel, click the + (Create Policy) icon. Provide a name, ensure the Enabled

    toggle is active, select the File Log Target and Syslog Target you created in the

    Log Targets prompt, and click Create.

    • Attach the Policy to Directories: Click your newly created audit policy to open

    it. In the Members panel, click the menu icon, select Add member..., select your

    production managed directories, and click Add.

    • Configure SACLs: Instruct your file server administrators to connect to the SMB

    export using a Windows client and utilize Windows MMC to configure the SACLs

    that dictate which file operations generate audit events.

    From the CLI:

    • Create Log Targets:

    • Command Syntax: purelog file create --dir <FILESYSTEM:DIRECTORY> -

    -keep-for <PERIOD> <NAME>

    • Command Syntax: purelog syslog create --uri tls://<HOST>:<PORT>

    <SYSLOG_NAME>

    • Create the Audit Policy:

    • Command Syntax: purepolicy audit file create --targets

    <TARGET1>,<TARGET2> <POLICY_NAME>

    • Example: purepolicy audit file create --targets

    local_dir_target,syslog_target smb_audit_policy

    • Attach to Directories:

    • Command Syntax: purepolicy audit file add --dir

    <FILESYSTEM:DIRECTORY> <POLICY_NAME>

    • Example: purepolicy audit file add --dir FS1:Data smb_audit_policy

    • Enable the Policy:

    • Command Syntax: purepolicy audit file enable <POLICY_NAME>

    • Configure SACLs: Establish appropriate SACLs externally using Windows

    MMC.'
