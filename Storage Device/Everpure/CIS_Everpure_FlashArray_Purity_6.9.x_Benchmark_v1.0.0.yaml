- id: '1.10'
  title: Ensure administrative audit logs are forwarded to remote syslog or monitored via the REST API
  scoring: manual
  profile:
  - Level 1
  description: FlashArray creates administrative audit records for all administrative operations that cause a change to the
    system configuration or state. Everpure recommends that these logs be monitored via REST API, or sent to configured remote
    syslog servers in order to detect suspicious or unexpected activity and respond accordingly.
  rationale: 'The FlashArray administrative audit records track the following information for every operation that changes
    configuration or state: • The time when it was performed • The user who performed the action • The origin array they performed
    the action from (in case it was performed from another array in the fleet) • The equivalent CLI command, sub-command,
    and arguments representing the change that was performed These pieces of information are valuable for detecting changes
    to the system state in unexpected configuration areas, by unexpected users, or originating from unexpected locations.'
  impact: Continuous audit log monitoring requires storage capacity and processing power on the receiving SIEM. The volume
    of audit events scales with administrative activity. SIEM integration must be configured and maintained to avoid log loss.
  references: []
  page_start: 51
  audit_raw: 'To align with the security recommendations, verify that audit logs are continuously

    monitored—either by forwarding them to a remote syslog server or by polling them via

    the REST API—and that reviewers are checking the time, user, origin array, and

    executed commands.

    From the GUI:

    • Verify Syslog Forwarding: Navigate to Settings > System. In the Syslog

    Servers panel, verify that at least one remote syslog server is actively configured

    to receive audit events.

    • Verify Manual/API Log Access: Navigate to Settings > Access and scroll to

    the Audit Trail pane. Confirm logs are accessible and capture the Time, User,

    Origin, and Command fields.

    • Verify REST API (If Syslog is not used): Navigate to Settings > Access >

    Users and Policies (API Clients pane) and verify that an active API Client or

    service account exists for your SIEM/monitoring platform to poll the REST API.

    From the CLI:

    • Verify Syslog Forwarding: Run the command purelog syslog list. Review

    the output to confirm a remote syslog server URI is configured.

    • Verify Audit Records: Run the command pureaudit list (or pureaudit list --

    filter "time >= ''<YYYY-MM-DD>''" for recent events). Review the output to ensure

    the Time, User, Command, and Arguments are being accurately recorded.

    • Verify REST API (If Syslog is not used): Verify with your monitoring teams that

    an active external script or tool is successfully authenticating and pulling the audit

    logs via the FlashArray REST API.'
  remediation: 'To align with the security recommendations, implement continuous monitoring by

    configuring external syslog forwarding or REST API integration, and establish a process

    to review unexpected configurations.

    From the GUI:

    • To Configure Syslog Forwarding:

    • Navigate to Settings > System.

    • In the Syslog Servers panel, click the + (Create) icon.

    • Enter the URI of your remote syslog server (e.g., tcp://10.10.10.10:514) and click

    Create.

    • To Configure REST API Monitoring:

    • Integrate your SIEM or monitoring tool using the Pure Storage REST API

    endpoints to continuously poll for audit trail events.

    • Establish a Review Process: Ensure your monitoring team or SIEM alerts

    analyze the logs specifically for unexpected Users, Origin arrays, or Commands

    that change system state.

    From the CLI:

    • To Configure Syslog Forwarding: Create a remote syslog server destination

    using the purelog syslog create command.

    • Command Syntax: purelog syslog create --uri <URI> <SERVER_NAME>

    • Establish a Review Process: If manually reviewing, use the pureaudit list

    command periodically. You can isolate specific users or times using the --filter

    flag (e.g., pureaudit list --filter "user=''pureuser''").'
  checks:
  - type: manual_review
    info: 'To align with the security recommendations, verify that audit logs are continuously

