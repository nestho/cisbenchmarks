- id: '4.5'
  title: Ensure at least one encrypted array connection is configured for replication
  scoring: manual
  profile:
  - Level 1
  description: 'FlashArray allows for connections to be created between any 2 FlashArrays for the purpose of replicating block
    and file data asynchronously, or block data synchronously. This allows for backups of data to be copied to other arrays,
    enabling disaster recovery. FlashArray supports creating pods and using them to store file and block data to coordinate
    replication. Everpure recommends the following: • Create at least one array connection. • Encrypt all array connections.
    • Ensure all peer arrays are on at least the same minor version, if not the same patch version. • Add all file systems
    and directories to a pod with at least one replica link for backing up data. • Add all volumes to either a pgroup with
    a replication schedule, a pod with at least one replica link for backing up data, or a stretched pod.'
  rationale: 'Backing up data to a secondary system is important for recovery in the case of disasters, as well as physical
    compromise that may render an array unusable. As such, Everpure recommends that there be at least one array peer utilized
    for backups. Encrypting backup traffic in flight is crucial for ensuring backups of block and file data cannot be tampered
    with or have any sensitive contents exposed. Trust and privacy is established using TLS pre-shared keys with TLS1.3 in
    order to prevent interception of traffic. While FlashArray does support replication between peers of different versions,
    some security features may only be available or effective when both arrays in an array connection are sufficiently new
    in version. Everpure recommends the following: • Both arrays should be on 6.9.x. Ideally both are on the latest version
    of 6.9.x, or very close versions. • All data on the array have at least one backup destination, regardless of whether
    it is file or block data.'
  impact: Enforcing encrypted array connections strictly requires the use of Ethernet (IP) transport, as Fibre Channel (FC)
    replication connections cannot be encrypted. Encrypting all replication traffic in flight introduces cryptographic processing
    overhead on the controllers of both the source and target arrays. Furthermore, satisfying the requirement to replicate
    all volumes and file systems has significant environmental impacts. If you utilize ActiveCluster (synchronous replication
    via stretched pods), every host write must be synchronously acknowledged by the target array before completing, which
    intrinsically adds network round-trip latency to your front-end write I/O. If you utilize asynchronous or ActiveDR replication,
    retaining the replicated snapshots and continuous journal data will constantly consume physical storage capacity on the
    target array. Finally, maintaining the exact same Purity//FA version across peer arrays requires careful, staggered (one-at-a-time)
    upgrade orchestration to avoid causing an array outage during the update process.
  references: []
  page_start: 140
  audit_raw: 'To align with the security recommendations, verify that at least one array connection

    exists for backups, that the replication transport utilizes Ethernet (IP) with encryption

    enabled, and that production volumes and file systems are assigned to a replicating pod

    or protection group.

    From the GUI:

    • Navigate to Protection > Array.

    • In the Connected Arrays panel, verify that at least one remote array is listed and

    connected.

    • Review the connection details in the panel and verify that the connection uses an

    Ethernet (IP) Replication Transport and that Encryption is enabled (or check

    the Encrypted toggle by clicking the menu icon and selecting Edit Connected

    Array).

    • Navigate to Storage > Volumes and Storage > File Systems. Verify that the

    production objects belong to a Pod (that is stretched or has an ActiveDR replica

    link) or a Protection Group (with a replication schedule actively sending data to a

    target array).

    From the CLI:

    • Run the command purearray connection list to view the status and

    attributes of connected arrays.

    • Review the output to ensure that a connection exists, the Transport is ip, and

    Encryption is set to encrypted.

    • Run the purevol list --protect and purefs list commands to verify that all storage

    objects are associated with a replicating protection group or pod.'
  remediation: 'To align with the security recommendations, establish an encrypted array connection

    using an encrypted pre-shared key, and ensure your production data is actively

    replicating.

    From the GUI:

    • Get the Connection Key: Log in to the target array, navigate to Protection >

    Array, click the menu icon in the Connected Arrays panel, and select Create

    Encrypted Connection Key. Copy the key.

    • Connect the Arrays: Log in to the source array, navigate to Protection > Array,

    click the menu icon in the Connected Arrays panel, and select Connect Array.

    • Enter the target array''s Management Address, select the Type (Async or Sync

    Replication), provide the Encrypted Connection Key, ensure Replication

    Transport is set to Ethernet (IP), and toggle Encrypted to enabled (blue). Click

    Connect.

    • (Optional - Encrypt an Existing Connection): Click the menu icon for an existing

    connection and select Edit Connected Array, toggle Encrypted to enabled

    (blue), and click Save. You will be required to provide a newly generated

    encrypted connection key from the target array.

    • Protect the Data: Navigate to Storage > Volumes or Storage > File Systems

    and assign your data to a pod or protection group configured for replication.

    From the CLI:

    • Get the Encrypted Key: On the target array, run the command purearray list --

    connection-key --encrypted to generate a one-time-use encrypted pre-shared

    key.

    • Connect the Arrays: On the source array, run the purearray connect command

    with the --encrypted flag.

    • Command Syntax: purearray connect --management-address

    <IP_OR_FQDN> --type <async-replication|sync-replication> --

    encrypted

    • Action: Purity will prompt you interactively to paste the encrypted connection key.

    • Encrypt an Existing Connection: If an unencrypted connection already exists,

    you can secure it using the purearray connection enable command.

    • Command Syntax: purearray connection enable --encrypted

    <ARRAY_NAME>

    • Action: Purity will prompt you interactively to paste a newly generated encrypted

    connection key from the target array.'
  checks:
