- id: '6.3'
  title: (L2) Ensure 'Block pop-up windows' is 'Enabled'
  scoring: scored
  profile:
  - Level 2
  description: The Block pop-up windows feature is used to block pop-up windows which a website might open with or without
    any user interaction. Pop-ups can be used to open un-trusted malicious content. It is recommended that the Popup Blocker
    be enabled.
  rationale: By enabling Block pop-up windows, pop-ups will be blocked which will reduce the likelihood of being redirected
    to a malicious site.
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'Follow the below steps and verify that Block pop-up windows is Enabled:

