- id: '10.1'
  title: (L1) Ensure 'Show full website address' is 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: This setting controls how the URL is displayed. With it enabled, the full path will be shown. With it disabled,
    only the high-level domain will be displayed.
  rationale: By displaying the full URL, the user is better informed as to where they are browsing on a given site and may
    even see sensitive parameters that are being passed via URL.
  impact: ''
  references: []
  page_start: 31
  audit_raw: 'Follow the below steps and verify that Show full website address is set to Enabled:

    1. Click Safari.

    2. Click Preferences.

    3. Click Advanced.

    4. Verify the Show full website address checkbox is checked.

    To verify the plist follow the below steps:

    1. Open the com.apple.Safari.plist.

    2. Find the token <key>ShowFullURLInSmartSearchField</key>

    3. verify this token is immediately followed by <true/>'
  remediation: 'Follow the below steps to set Show full website address to Enabled:

