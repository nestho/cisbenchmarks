- id: '6.2'
  title: (L2) Ensure 'Enable JavaScript' is 'Disabled'
  scoring: scored
  profile:
  - Level 2
  description: JavaScript enables web site authors to create enhanced user interfaces. In support of this, JavaScript enables
    web sites to programmatically read and alter the document object model (DOM) for the rendered web site as well as instantiate
    various objects, such as asynchronous XML HTTP request (XHR) objects. It is recommended that JavaScript be disabled.
  rationale: JavaScript continues to be an attack vector for exploiting vulnerabilities in the browser. Additionally, JavaScript
    is commonly leveraged by exploit authors to create a deterministic memory layout in support of increasing the reliability
    of exploits.
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'Follow the below steps and verify that Enable JavaScript is Disabled:

    1. Click Safari.

    2. Click Preferences.

    3. Click Security.

    4. Verify Enable JavaScript is unchecked.

    To verify the plist follow the below steps:

    1. Open the com.apple.Safari.plist.

    2. Find the token <key>WebKitJavaScriptEnabled</key>

    3. verify this token is immediately followed by <false/>'
  remediation: 'Follow the below steps to set Enable JavaScript to Disabled:

    1. Click Safari.

    2. Click Preferences.

    3. Click AutoFill.

    4. Uncheck the Enable JavaScript checkbox.

    24 | P a g e

    To configure the plist follow the below steps:

    1. Open the com.apple.Safari.plist.

    2. Find the token <key>WebKitJavaScriptEnabled</key>

    3. Ensure this token is immediately followed by <false/>'
  checks:
  - type: manual_review
    info: 'Follow the below steps and verify that Enable JavaScript is Disabled:

