- id: '6.1'
  title: (L1) Ensure 'Warn when visiting a fraudulent website' is 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: Safari can be configured to alert the user that the site they are visiting is known to be malicious. It is
    recommended that this capability be enabled.
  rationale: Users will be alerted about known malicious web sites, thus decreasing the probability of a user’s browser or
    system being exploited by known malware or phishing site.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'Follow the below steps and verify that Warn when visiting a fraudulent website is

    Enabled:

    1. Click Safari.

    2. Click Preferences.

    3. Click Security.

    4. Verify Warn when visiting a fraudulent website is checked.

    To verify the plist follow the below steps:

    1. Open the com.apple.Safari.plist.

    2. Find the token <key>WarnAboutFraudulentWebsites</key>

    3. verify this token is immediately followed by <true/>'
  remediation: 'Follow the below steps to set Warn when visiting a fraudulent website to Enabled:

    1. Click Safari.

    2. Click Preferences.

    22 | P a g e

    3. Click AutoFill.

    4. Check the Warn when visiting a fraudulent website checkbox.

    To configure the plist follow the below steps:

    1. Open the com.apple.Safari.plist.

    2. Find the token <key>WarnAboutFraudulentWebsites</key>

    3. Ensure this token is immediately followed by <true/>'
  checks:
