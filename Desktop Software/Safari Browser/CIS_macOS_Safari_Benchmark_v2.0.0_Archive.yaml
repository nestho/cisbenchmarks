controls:
- id: '1.1'
  title: (L1) Ensure 'Open "safe" files after downloading' is 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: The Safari browser contains a feature which causes all files considered "safe" to be automatically opened once
    they have finished downloading.
  rationale: This feature is meant to be a benefit but having the browser automatically open files that could be malicious
    and downloaded by mistake is a security risk.
  impact: ''
  references: []
  page_start: 10
  audit_raw: 'Follow the below steps and verify that Open "safe" files after downloading is

    Disabled:

    1. Click Safari.

    2. Click Preferences.

    3. Click General.

    4. Verify Open "safe" files after downloading is unchecked.

    To verify the plist follow the below steps:

    1. Open the com.apple.Safari.plist.

    2. Find the token <key>AutoOpenSafeDownloads</key>

    3. verify this token is immediately followed by <false/>

    10 | P a g e'
  remediation: 'Follow the below steps to set Open "safe" files after downloading to Disabled:

    1. Click Safari.

    2. Click Preferences.

    3. Click General.

    4. Uncheck the Open "safe" files after downloading checkbox.

    To configure the plist follow the below steps:

    1. Open the com.apple.Safari.plist.

    2. Find the token <key>AutoOpenSafeDownloads</key>

    3. Ensure this token is immediately followed by <false/>'
  checks:
  - type: manual_review
    info: 'Follow the below steps and verify that Open "safe" files after downloading is

      Disabled:

      1. Click Safari.

      2. Click Preferences.

      3. Click General.

      4. Verify Open "safe" files after downloading is unchecked.

      To verify the plist follow the below steps:

      1. Open the com.apple.Safari.plist.

      2. Find the token <key>AutoOpenSafeDownloads</key>

      3. verify this token is immediately followed by <false/>

      10 | P a g e'
    severity: medium
- id: '3.1'
  title: '(L2) Ensure ''AutoFill web forms: User names and passwords'' is ''Disabled'''
  scoring: scored
  profile:
  - Level 2
  description: Safari can utilize a user-level keychain for credential storage, and then access that information when revisiting
    websites on the same domain. By disabling this feature the user will be prompted to manually enter their credentials when
    they visit a website.
  rationale: If this setting is enabled, users can have Safari store and retrieve passwords through a user-level keychain
    and provide them automatically the next time they visit a site. An intruder who has unrestricted access to your computer
    can gain access to secure site areas.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'Follow the below steps and verify that AutoFill web forms: User names and passwords

    is Disabled:

    1. Click Safari.

    2. Click Preferences.

    3. Click AutoFill.

    4. Verify AutoFill web forms: User names and passwords is unchecked.

    To verify the plist follow the below steps:

    1. Open the com.apple.Safari.plist.

    2. Find the token <key>AutoFillPasswords</key>

    3. verify this token is immediately followed by <false/>

    13 | P a g e'
  remediation: 'Follow the below steps to set AutoFill web forms: User names and passwords to

    Disabled:

    1. Click Safari.

    2. Click Preferences.

    3. Click AutoFill.

    4. Uncheck AutoFill web forms: User names and passwords.

    To configure the plist follow the below steps:

    1. Open the com.apple.Safari.plist.

    2. Find the token <key>AutoFillPasswords</key>

    3. Ensure this token is immediately followed by <false/>'
  checks:
  - type: manual_review
    info: 'Follow the below steps and verify that AutoFill web forms: User names and passwords

      is Disabled:

      1. Click Safari.

      2. Click Preferences.

      3. Click AutoFill.

      4. Verify AutoFill web forms: User names and passwords is unchecked.

      To verify the plist follow the below steps:

      1. Open the com.apple.Safari.plist.

      2. Find the token <key>AutoFillPasswords</key>

      3. verify this token is immediately followed by <false/>

      13 | P a g e'
    severity: medium
- id: '3.2'
  title: '(L2) Ensure ''AutoFill web forms: Credit cards'' is ''Disabled'''
  scoring: scored
  profile:
  - Level 2
  description: Safari can store and retrieve payment card information in the user-level keychain. The information is collected
    during an online purchase, following the user's permission. It is recommended that Safari be configured to not store payment
    card information in cases where security is paramount.
  rationale: If a user's console session is compromised, credit card information may be auto-filled into a website for a malicious
    purpose.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Follow the below steps and verify that AutoFill web forms: Credit cards is Disabled:

    1. Click Safari.

    2. Click Preferences.

    3. Click AutoFill.

    4. Verify AutoFill web forms: Credit cards is unchecked.

    To verify the plist follow the below steps:

    1. Open the com.apple.Safari.plist.

    2. Find the token <key>AutoFillCreditCardData</key>

    3. verify this token is immediately followed by <false/>'
  remediation: 'Follow the below steps to set AutoFill web forms: Credit cards to Disabled:

    1. Click Safari.

    2. Click Preferences.

    3. Click AutoFill.

    4. Uncheck AutoFill web forms: Credit cards.

    15 | P a g e

    To configure the plist follow the below steps:

    1. Open the com.apple.Safari.plist.

    2. Find the token <key>AutoFillCreditCardData</key>

    3. Ensure this token is immediately followed by <false/>'
  checks:
  - type: manual_review
    info: 'Follow the below steps and verify that AutoFill web forms: Credit cards is Disabled:

      1. Click Safari.

      2. Click Preferences.

      3. Click AutoFill.

      4. Verify AutoFill web forms: Credit cards is unchecked.

      To verify the plist follow the below steps:

      1. Open the com.apple.Safari.plist.

      2. Find the token <key>AutoFillCreditCardData</key>

      3. verify this token is immediately followed by <false/>'
    severity: medium
- id: '3.3'
  title: '(L2) Ensure ''AutoFill web forms: Other forms'' is ''Disabled'''
  scoring: scored
  profile:
  - Level 2
  description: Safari can store the information typed in forms for later use on other websites. It is recommended that Safari
    be configured such that it does not store and auto-fill form contents.
  rationale: If Safari or other applications executing at equal or higher security contexts is compromised, potentially sensitive,
    persisted, form data is at increased risk.
  impact: ''
  references: []
