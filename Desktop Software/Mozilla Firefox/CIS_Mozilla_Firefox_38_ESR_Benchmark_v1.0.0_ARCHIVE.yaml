- id: '1.5'
  title: (L1) Protect Firefox Binaries
  scoring: scored
  profile:
  - Level 1
  description: Ensure that Firefox is installed and owned by an administrative account in order to protect the binaries and
    to prevent users from circumventing security settings.
  rationale: When Firefox is installed by an ordinary user, the software in installed into the user's profile / home directory.
    This avoids the requirement for administrative access during installation and upgrades, but also allows users to circumvent
    security settings defined in settings.js and mozilla.cfg files. Having the installation owned by an administrative user
    can also protect binary and configuration files from malware that is executed in an ordinary user's browser.
  impact: Ordinary users will not be able to update or patch Firefox; only Administrators can perform upgrades. 15 | P a g
    e 2 Updating Firefox This section will discuss how to enable auto updates in Firefox.
  references: []
  page_start: 15
  audit_raw: Confirm that Firefox is not installed in any individual user profiles or home directories.
  remediation: 'Install Firefox into a shared location that can be accessed by users but modified only by

    Administrators.'
  checks:
  - type: manual_review
    info: Confirm that Firefox is not installed in any individual user profiles or home directories.
    severity: medium
- id: '2.1'
  title: (L1) Enable Automatic Updates
  scoring: scored
  profile:
  - Level 1
  description: This feature configures Firefox to automatically download and install updates as they are made available.
  rationale: Security updates ensure that users are safe from known software bugs and vulnerabilities.
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Perform the following procedure:

    1. Type about:config in the address bar

    2. Type app.update.auto in the filter

    3. Ensure the preferences listed are set to the values specified below:

    app.update.enabled=true

    app.update.auto=true

    app.update.staging.enabled=true'
  remediation: 'Perform the following procedure:

    1. Open the mozilla.cfg file in the installation directory with a text editor

    2. Add the following lines to mozilla.cfg:

    lockPref("app.update.enabled", true);

    lockPref("app.update.auto", true);

    lockPref("app.update.staging.enabled", true);

    16 | P a g e'
  checks:
  - type: manual_review
    info: 'Perform the following procedure:

      1. Type about:config in the address bar

      2. Type app.update.auto in the filter

      3. Ensure the preferences listed are set to the values specified below:

      app.update.enabled=true

      app.update.auto=true

      app.update.staging.enabled=true'
    severity: medium
