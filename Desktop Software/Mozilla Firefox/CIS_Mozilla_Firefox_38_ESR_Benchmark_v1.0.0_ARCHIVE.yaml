- id: '4.1'
  title: (L2) Set SSL Override Behavior
  scoring: scored
  profile:
  - Level 2
  description: When Firefox encounters an invalid certificate and the user clicks "Add Exception", a dialog is displayed with
    a text box to fetch the certificate from the given URL. This preference controls whether Firefox will or will not automatically
    fill in the URL text box and autofetch the certificate on behalf of the user. Setting this preference to 0 forces the
    user to enter a URL and click the "Get Certificate" button before adding an exception for an invalid cert.
  rationale: Requiring the user to manually enter the server's URL and fetch the certificate may provide additional opportunity
    to scrutinize the certificate before adding an exception for a potentially fraudulent certificate.
  impact: ''
  references: []
  page_start: 33
  audit_raw: "Perform the following procedure:\n1. Type about:config in the address bar\n2. Type browser.ssl_override_behavior\
    \ in the filter\n3. Ensure the preferences listed are set to the values specified below:\n browser.ssl_override_behavior=0"
