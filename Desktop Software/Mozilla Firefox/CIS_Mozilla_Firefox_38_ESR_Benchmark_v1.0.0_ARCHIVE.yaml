controls:
- id: '1.1'
  title: (L1) Create local-settings.js file
  scoring: scored
  profile:
  - Level 1
  description: The local-settings.js file is used by Firefox to reference and load the mozilla.cfg file which contains all
    the locked preferences.
  rationale: Loading a custom configuration file is a primary mechanism for setting and enforcing security requirements within
    Firefox.
  impact: ''
  references: []
  page_start: 10
  audit_raw: 'Perform the following procedure:

    1. Type about:config in the address bar

    2. Type app.update in the filter

    3. Ensure the preferences listed are set to the values specified below

    general.config.obscure_value=0

    general.config.filename=mozilla.cfg'
  remediation: 'Perform the following procedure:

    1. Navigate to the defaults/pref directory inside the Firefox installation directory

    and create a file called local-settings.js.

    2. Include the following lines in local-settings.js:

    10 | P a g e

    pref("general.config.obscure_value", 0);

    pref("general.config.filename", "mozilla.cfg");'
  checks:
  - type: manual_review
    info: 'Perform the following procedure:

      1. Type about:config in the address bar

      2. Type app.update in the filter

      3. Ensure the preferences listed are set to the values specified below

      general.config.obscure_value=0

      general.config.filename=mozilla.cfg'
    severity: medium
- id: '1.2'
  title: (L1) Set permissions on local-settings.js
  scoring: scored
  profile:
  - Level 1
  description: Set permissions on local-settings.js so that it can only be modified or deleted by an Administrator.
  rationale: Any users with the ability to modify the local-settings.js file can bypass all security configurations by changing
    the file or deleting it.
  impact: ''
  references: []
  page_start: 12
  audit_raw: Ensure non-administrators do not possess the ability to write to local-settings.js.
  remediation: Deny non-administrators the ability to write to local-settings.js.
  checks:
  - type: manual_review
    info: Ensure non-administrators do not possess the ability to write to local-settings.js.
    severity: medium
