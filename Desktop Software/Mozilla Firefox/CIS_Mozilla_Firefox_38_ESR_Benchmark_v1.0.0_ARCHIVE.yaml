- id: '4.4'
  title: (L2) Set OCSP Use Policy
  scoring: scored
  profile:
  - Level 2
  description: This setting dictates whether Firefox will leverage Online Certificate Status Protocol (OCSP) to determine
    if a given certificate has been revoked.
  rationale: Leveraging OCSP may help identify revoked certificates.
  impact: Enabling OCSP carries potential privacy implications. For each HTTPS site Firefox visits, a request is sent to an
    OCSP server to determine if the site's certificate has been revoked. This provides the OCSP server with the IP address
    of the requester (Firefox or NAT) and, among other properties, the domain name of the site Firefox is accessing. Firefox
    26 and greater support OCSP Stapling, which mitigates the aforementioned privacy implications of using OCSP. 37 | P a
    g e
  references:
  - 1. https://wiki.mozilla.org/CA:ImprovingRevocation#OCSP_Stapling
  - 2. https://blog.mozilla.org/security/2013/07/29/ocsp-stapling-in-firefox/
  page_start: 37
  audit_raw: 'Perform the following procedure:

