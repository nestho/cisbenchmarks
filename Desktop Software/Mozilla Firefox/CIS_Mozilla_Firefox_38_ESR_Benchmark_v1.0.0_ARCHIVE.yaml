- id: '4.6'
  title: (L2) Set OCSP Response Policy
  scoring: scored
  profile:
  - Level 2
  description: This setting dictates whether Firefox will consider a given certificate to be invalid if Firefox is unable
    to obtain an Online Certificate Status Protocol (OCSP) response for it.
  rationale: Requiring an OCSP response will reduce an adversary's ability to successfully leverage a compromised and revoked
    certificate.
  impact: Enabling OCSP carries potential privacy implications. For each HTTPS site Firefox visits, a request is sent to an
    OCSP server to determine if the site's certificate has been revoked. This provides the OCSP server with the IP address
    of the requester (Firefox or NAT) and, among other properties, the domain name of the site Firefox is accessing. Additionally,
    requiring an OCSP response increases opportunity for valid certificates to be deemed invalid. This may occur if OCSP server
    becomes unavailable or is not accessible. 40 | P a g e Firefox 26+ support OCSP Stapling which mitigates the aforementioned
    privacy implications.
  references:
  - 1. https://www.grc.com/revocation/ocsp-must-staple.htm
  - 2. https://www.imperialviolet.org/2014/04/19/revchecking.html
  page_start: 40
  audit_raw: 'Perform the following procedure:

    1. Type about:config in the address bar

