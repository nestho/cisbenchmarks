  scoring: scored
  profile:
  - Level 1
  description: This setting dictates whether Firefox will update installed search providers. Search providers allow the user
    to search directly from the "Search bar" which is adjacent to the URL bar.
  rationale: Software updates help ensure that users are safe from known software bugs and vulnerabilities.
  impact: None - This is the default behavior.
  references: []
  page_start: 22
  audit_raw: 'Ensure that browser.search.update is set to true:

    1. Type about:config in the address bar

    2. Type browser.search.update in the filter

    3. Configure the setting as prescribed.'
