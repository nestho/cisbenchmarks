- id: '1.3'
  title: (L1) Protect Firefox Binaries
  scoring: manual
  profile:
  - Level 1
  description: Ensure that Firefox is installed and owned by an administrative account in order to protect the binaries and
    to prevent users from circumventing security settings.
  rationale: When Firefox is installed by an ordinary user, the software is installed into the user's profile / home directory.
    This avoids the requirement for administrative access during installation and upgrades, but also allows users to circumvent
    security settings defined in settings.js and mozilla.cfg files. Having the installation owned by an administrative user
    can also protect binary and configuration files from malware that is executed in an ordinary user's browser.
  impact: Ordinary users will not be able to update or patch Firefox; only Administrators can perform upgrades.
  references: []
  page_start: 16
  audit_raw: Confirm that Firefox is not installed in any individual user profiles or home directories.
  remediation: 'Install Firefox into a shared location that can be accessed by users but modified only by

    Administrators.'
  checks:
  - type: manual_review
    info: Confirm that Firefox is not installed in any individual user profiles or home directories.
    severity: medium
- id: '1.4'
  title: (L1) Set permissions on local-settings.js
  scoring: scored
  profile:
  - Level 1
  description: Set permissions on local-settings.js so that it can only be modified or deleted by an Administrator.
  rationale: Any users with the ability to modify the local-settings.js file can bypass all security configurations by changing
    the file or deleting it.
  impact: Non-administrative users will not be able to write to the local-settings.js.
  references: []
  page_start: 17
  audit_raw: Ensure non-administrators do not possess the ability to write to local-settings.js.
  remediation: Deny non-administrators the ability to write to local-settings.js.
  checks:
  - type: manual_review
    info: Ensure non-administrators do not possess the ability to write to local-settings.js.
    severity: medium
- id: '1.5'
  title: (L1) Set permissions on mozilla.cfg
  scoring: scored
