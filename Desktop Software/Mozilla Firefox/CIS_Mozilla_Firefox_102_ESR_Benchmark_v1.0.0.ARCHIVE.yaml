  title: (L1) Disable Development Tools
  scoring: manual
  profile:
  - Level 1
  description: This setting configures whether or not development tools are available to the user. Firefox Developer Tools
    is a set of web developer tools built into Firefox that can be used to examine, edit, and debug HTML, CSS, and JavaScript.
  rationale: Information needed by an attacker to begin looking for possible vulnerabilities in a web browser includes information
    about the web browser and plug-ins or modules being used. When debugging or trace information is enabled in a production
    web browser, information about the web browser, such as web browser type, version, patches installed, plug-ins and modules
    installed, type of code being used by the hosted application, and any back ends being used for data storage may be displayed.
    Because this information may be placed in logs and general messages during normal operation of the web browser, an attacker
    does not have to cause an error condition to gain this information.
  impact: Users with creative roles that require development tools will need additional permissions granted based on their
    role.
