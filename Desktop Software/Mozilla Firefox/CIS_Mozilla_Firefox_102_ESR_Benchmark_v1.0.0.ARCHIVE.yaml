    severity: medium
- id: '2.1'
  title: (L1) Enable Automatic Updates
  scoring: scored
  profile:
  - Level 1
  description: This setting configures Firefox to automatically download and install updates as they are made available.
  rationale: Security updates ensure that users are safe from known software bugs and vulnerabilities.
  impact: None - This is the default behavior.
  references: []
  page_start: 20
  audit_raw: 'Ensure that the following values are set to true:

    • app.update.enabled

    • app.update.auto

    • app.update.staging.enabled

    1. Type about:config in the address bar

    2. Type app.update.enabled in the filter

    3. Ensure the setting is set as prescribed.

    4. Type app.update.auto in the filter

    5. Ensure the setting is set as prescribed.

    6. Type app.update.staging.enabled in the filter

    7. Ensure the setting is set as prescribed.'
  remediation: 'To establish the recommended configuration, set the following values to true:

    • app.update.enabled

    • app.update.auto

    • app.update.staging.enabled

    1. Type about:config in the address bar

    2. Type app.update.enabled in the filter

    3. Configure the setting as prescribed.

    4. Type app.update.auto in the filter

    5. Configure the setting as prescribed.

    6. Type app.update.staging.enabled in the filter

    7. Configure the setting as prescribed.

    OR

    1. Open the mozilla.cfg file in the installation directory with a text editor

    2. Add the following lines to mozilla.cfg:

    lockPref("app.update.enabled", true);

    lockPref("app.update.auto", true);

    lockPref("app.update.staging.enabled", true);'
  checks:
  - type: manual_review
    info: 'Ensure that the following values are set to true:

      • app.update.enabled

      • app.update.auto

      • app.update.staging.enabled

      1. Type about:config in the address bar

      2. Type app.update.enabled in the filter

      3. Ensure the setting is set as prescribed.

      4. Type app.update.auto in the filter

      5. Ensure the setting is set as prescribed.

      6. Type app.update.staging.enabled in the filter

      7. Ensure the setting is set as prescribed.'
    severity: medium
