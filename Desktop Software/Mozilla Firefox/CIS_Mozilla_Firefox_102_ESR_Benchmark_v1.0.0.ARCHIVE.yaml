    2. Add the following lines to mozilla.cfg:

    lockPref("browser.search.update", true);'
  checks:
  - type: manual_review
    info: 'Ensure that browser.search.update is set to true:

      1. Type about:config in the address bar

      2. Type browser.search.update in the filter

      3. Configure the setting as prescribed.'
    severity: medium
- id: '2.3'
  title: (L1) Set Update Interval Time Checks
  scoring: scored
  profile:
  - Level 1
  description: This setting configures the amount of time the system waits in between each check for updates.
  rationale: Frequent checks for updates will help mitigate vulnerabilities.
  impact: app.update.enabled must be set to true for this preference to take effect.
  references: []
  page_start: 23
  audit_raw: 'Ensure that app.update.interval is set to 43200:

    1. Type about:config in the address bar

    2. Type app.update.interval in the filter

