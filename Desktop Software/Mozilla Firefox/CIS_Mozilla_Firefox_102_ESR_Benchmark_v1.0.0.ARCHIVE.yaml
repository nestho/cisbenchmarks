- id: '3.6'
  title: (L1) Validate Proxy Settings
  scoring: manual
  profile:
  - Level 1
  description: Firefox can be configured to use one or more proxy servers. When a proxy server is configured for a given protocol
    (HTTP, FTP, Gopher, etc), Firefox will send applicable requests to that proxy server for fulfillment. It is recommended
    that the list of proxy servers configured in Firefox be reviewed to ensure it contains only trusted proxy servers.
  rationale: Depending on the protocol used, the proxy server will have access to read and/or alter all information communicated
    between Firefox and the target server, such a web site.
  impact: ''
  references: []
  page_start: 36
  audit_raw: 'Perform the following procedure:

    1. Drop down the Firefox menu

    2. Click on Settings

    3. Scroll down to the Network Settings section

    4. Click on Settings Button

    5. Ensure that the proxy listed (if any) is the one configured and approved by the

    enterprise.'
  remediation: 'Perform the following procedure:

    1. Drop down the Firefox menu

    2. Click on Settings

    3. Scroll down to the Network Settings section

    4. Click on Settings Button

    5. Ensure that the proxy listed (if any) is the one configured and approved by the

