  rationale: Any users with the ability to modify the mozilla.cfg file can bypass all security configurations by changing
    the file or deleting it.
  impact: Non-admirative user will not be able to write to the mozilla.cfg file.
  references: []
  page_start: 18
  audit_raw: Ensure non-administrators do not possess the ability to write to mozilla.cfg.
  remediation: Deny non-administrators the ability to write to mozilla.cfg.
  checks:
  - type: manual_review
