- id: '3.1'
  title: (L1) Disable Network Prefetch
  scoring: manual
  profile:
  - Level 1
  description: This setting configures if Firefox is allowed to make URL requests without user consent.
  rationale: Prefetching URLs could lead to misinformation on browser history such a a website that was not visited but the
    user hovered over the URL link. This can be misleading in a forensic investigation. In addition, there is a chance that
    information can be leaked about a local network if connected to a public network.
  impact: None - This is the default behavior.
  references:
  - 1. https://www.ghacks.net/2013/04/27/firefox-prefetching-what-you-need-to-know/
  page_start: 28
  audit_raw: 'Ensure that Network.dns.disablePrefetch is set to true:

    1. Type about:config in the address bar

    2. Type Network.dns.disablePrefetch in the filter

    3. Ensure the setting is set as prescribed.'
  remediation: 'To establish the recommended configuration, set Network.dns.disablePrefetch to

    true:

    1. Type about:config in the address bar

    2. Type Network.dns.disablePrefetch in the filter

    3. Ensure the setting is set as prescribed.

    OR

    1. Open the mozilla.cfg file in the installation directory with a text editor

    2. Add the following lines to mozilla.cfg:

    lockPref("Network.dns.disablePrefetch", true);'
  checks:
  - type: manual_review
    info: 'Ensure that Network.dns.disablePrefetch is set to true:

      1. Type about:config in the address bar

      2. Type Network.dns.disablePrefetch in the filter

      3. Ensure the setting is set as prescribed.'
    severity: medium
- id: '3.2'
  title: (L1) Disable NTLM v1
  scoring: scored
  profile:
  - Level 1
  description: This setting controls the use of NT Lan Manager (NTLM) v1 protocol that can be used for authentication to resources
    that request or require this authentication type.
  rationale: NTLM v1 contains cryptographic weaknesses that can be easily exploited to obtain user credentials.
  impact: This may affect websites and browsers that require the use of NTLM v1
  references: []
  page_start: 30
  audit_raw: 'Ensure that network.auth.force-generic-ntlm-v1 is set to false:

    1. Type about:config in the address bar

    2. Type network.auth.force-generic-ntlm-v1 in the filter

    3. Ensure the setting is set as prescribed.'
  remediation: 'To establish the recommended configuration, set network.auth.force-generic-ntlm-v1

    to false:

    1. Type about:config in the address bar

    2. Type network.auth.force-generic-ntlm-v1 in the filter

    3. Configure the setting as prescribed.

    OR

    1. Open the mozilla.cfg file in the installation directory with a text editor

    2. Add the following lines to mozilla.cfg:

    lockPref("network.auth.force-generic-ntlm-v1", false)'
  checks:
  - type: manual_review
    info: 'Ensure that network.auth.force-generic-ntlm-v1 is set to false:

      1. Type about:config in the address bar

      2. Type network.auth.force-generic-ntlm-v1 in the filter

      3. Ensure the setting is set as prescribed.'
    severity: medium
- id: '3.3'
  title: (L1) Disable WebRTC
  scoring: scored
  profile:
  - Level 1
  description: These settings determine whether Web Real Time Communications (WebRTC) is allowed. WebRTC is used for peer-to-peer
    communication such as file sharing or video calls.
  rationale: WebRTC can expose private information such as internal IP addresses and computer settings.
  impact: WebRTC will not be accessible to users.
  references: []
  page_start: 32
  audit_raw: 'Ensure that the following values are set to false:

    • media.peerconnection

    • media.peerconnection.use_document_iceservers

    1. Type about:config in the address bar

    2. Type media.peerconnection in the filter

    3. Ensure the setting is set as prescribed.

    4. Type media.peerconnection.use_document_iceservers in the filter

    5. Ensure the setting is set as prescribed.'
  remediation: 'To establish the recommended configuration, set the following values to false:

    • media.peerconnection

    • media.peerconnection.use_document_iceservers

