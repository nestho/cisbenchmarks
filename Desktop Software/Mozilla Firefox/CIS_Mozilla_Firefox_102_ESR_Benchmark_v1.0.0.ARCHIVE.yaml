controls:
- id: '1.1'
  title: (L1) Create local-settings.js file
  scoring: scored
  profile:
  - Level 1
  description: The local-settings.js file is used by Firefox to reference and load the mozilla.cfg file which contains all
    the locked preferences.
  rationale: Loading a custom configuration file is a primary mechanism for setting and enforcing security requirements within
    Firefox.
  impact: None.
  references: []
  page_start: 14
  audit_raw: "Perform the following procedure:\n1. Type about:config in the address bar\n2. Type app.update in the filter\n\
    3. Ensure the preferences listed are set to the values specified below:\n <span>general.config.obscure_value</span>=0\n\
    \ g<span>eneral.config.filename=mozilla.cfg</span>"
  remediation: "Perform the following procedure:\n1. Navigate to the defaults/pref directory inside the Firefox installation\
    \ directory\nand create a file called local-settings.js.\n2. Include the following lines in local-settings.js:\n pref(\"\
    general.config.obscure_value\", 0);\n pref(\"general.config.filename\", \"mozilla.cfg\");"
  checks:
  - type: manual_review
    info: "Perform the following procedure:\n1. Type about:config in the address bar\n2. Type app.update in the filter\n3.\
      \ Ensure the preferences listed are set to the values specified below:\n <span>general.config.obscure_value</span>=0\n\
      \ g<span>eneral.config.filename=mozilla.cfg</span>"
    severity: medium
