- id: '4.2'
  title: (L2) Set OCSP Response Policy
  scoring: scored
  profile:
  - Level 2
  description: This setting dictates whether Firefox will consider a given certificate to be invalid if it is unable to obtain
    an Online Certificate Status Protocol (OCSP) response for it.
  rationale: Requiring an OCSP response will reduce an adversary's ability to successfully leverage a compromised and revoked
    certificate.
  impact: Requiring an OCSP response increases opportunity for valid certificates to be deemed invalid. This may occur if
    OCSP server becomes unavailable or is not accessible.
  references:
  - 1. https://www.grc.com/revocation/ocsp-must-staple.htm
  - 2. https://www.imperialviolet.org/2014/04/19/revchecking.html
  page_start: 40
  audit_raw: 'Ensure that security.ocsp.require is set to true:

    1. Type about:config in the address bar

    2. Type security.ocsp.require in the filter

    3. Ensure the setting is set as prescribed.'
  remediation: 'To establish the recommended configuration, set security.ocsp.require to true:

    1. Type about:config in the address bar

    2. Type security.ocsp.require in the filter

    3. Ensure the setting is set as prescribed.

    OR

    1. Open the mozilla.cfg file in the installation directory with a text editor

    2. Add the following lines to mozilla.cfg:

    lockPref("security.ocsp.require", true);'
  checks:
  - type: manual_review
    info: 'Ensure that security.ocsp.require is set to true:

