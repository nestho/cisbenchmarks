    2. Add the following lines to mozilla.cfg:

    lockPref("media.peerconnection.enabled", false);

    lockPref("media.peerconnection.use_document_iceservers", false);'
  checks:
  - type: manual_review
    info: 'Ensure that the following values are set to false:

