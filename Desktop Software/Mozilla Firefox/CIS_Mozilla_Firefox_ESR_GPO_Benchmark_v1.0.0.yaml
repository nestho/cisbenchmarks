- id: 1.1.7.1
  title: (L1) Ensure 'TLS_RSA_WITH_3DES_EDE_CBC_SHA ' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy settings controls the use of the TLS_RSA_WITH_3DES_EDE_CBC_SHA cipher suite. Cipher suites are
    a group of algorithms that help secure network connections. The recommended state for this setting is: Enabled.'
  rationale: The Triple Data Encryption Algorithm (TDEA) also known as Triple DES (3DES) was deprecated in 2019 by NIST. 3DES
    is now considered an insecure cipher suite and should not be used.
  impact: Some legacy software and hardware might be affected by disabling this cipher suite.
  references:
  - 1. https://nvd.nist.gov/vuln/detail/CVE-2016-2183
  page_start: 36
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

    REG_DWORD value of 1.

    HKLM\SOFTWARE\Policies\Mozilla\Firefox\DisabledCiphers:TLS_RSA_WITH_3DES_EDE_

    CBC_SHA'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Enabled:

    Computer Configuration\Policies\Administrative

    Templates\Mozilla\Firefox\Disabled Ciphers\TLS_RSA_WITH_3DES_EDE_CBC_SHA

    Note: This Group Policy path does not exist by default. An additional Group Policy

    template (firefox.admx/adml) is required - it is available to download at this link.'
  checks:
