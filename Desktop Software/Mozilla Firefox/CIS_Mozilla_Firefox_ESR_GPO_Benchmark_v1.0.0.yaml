controls:
- id: 1.1.1.1
  title: (L1) Ensure 'Allow add-on installs from websites' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting configures the ability for websites to automatically install add-ons without an allow
    list. The recommended state for this setting is: Disabled. Note: If this setting is enabled, an allow list will be needed
    for approved add-ons.'
  rationale: Add-ons are extensions of the browser that add new functionality to Firefox or change its appearance. These run
    in a user session allowing them to manipulate data and the behavior of the way Firefox interacts with other applications
    and user commands. If malicious add-ons are installed automatically, a user's security could be completely compromised.
  impact: Users will not be able to download and install add-ons from websites unless an allow list is created.
  references: []
  page_start: 14
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

    REG_DWORD value of 0.

    HKLM\SOFTWARE\Policies\Mozilla\Firefox\InstallAddonsPermission:Default'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Disabled:

    Computer Configuration\Policies\Administrative

    Templates\Mozilla\Firefox\Addons\Allow add-on installs from websites

    Note: This Group Policy path does not exist by default. An additional Group Policy

    template (firefox.admx/adml) is required - it is available to download at this link.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location with a

      REG_DWORD value of 0.

      HKLM\SOFTWARE\Policies\Mozilla\Firefox\InstallAddonsPermission:Default'
    severity: medium
- id: 1.1.2.1
  title: (L1) Ensure 'NTLM' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls the use of NT Lan Manager (NTLM) v1 protocol. This protocol is used for authentication
    to resources. The recommended state for this setting is: Disabled.'
  rationale: NTLM v1 contains cryptographic weaknesses that can be easily exploited to obtain user credentials.
  impact: None - this is the default behavior.
  references: []
  page_start: 17
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is in effect when the following registry value does

    not exist.

    HKLM\SOFTWARE\Policies\Mozilla\Firefox\Authentication\NTLM:1'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Disabled:

    Computer Configuration\Policies\Administrative

    Templates\Mozilla\Firefox\Authentication\NTLM

    Note: This Group Policy path does not exist by default. An additional Group Policy

    template (firefox.admx/adml) is required - it is available to download at this link.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is in effect when the following registry value does

