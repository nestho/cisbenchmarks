- id: 1.1.5.5
  title: (L1) Ensure 'Locked' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting allows for the deletion of user data upon closing the browser. The recommended state for
    this setting is: Enabled. This policy setting configures the ability for third-party cookies to be downloaded to the system.
    Third party cookies are cookies sent by a domain that differs from the domain in the browser''s address bar. The recommended
    state for this setting is: Enabled: Reject cookies for known trackers and partition third-party cookies.'
  rationale: Deleting browser data will delete information that may be important for a computer investigation and investigators
    such as Computer Forensics Analysts may not be able to retrieve pertinent information to the investigation. Third party
    cookies are often used for tracking user browsing behaviors, which has privacy implications.
  impact: 'None - this is the default behavior. Note: This setting will preserve browsing history that could contain a user''s
    personal browsing history. Please make sure that this setting is in compliance with organizational policies. Blocking
    third-party cookies may adversely affect the functionality of some sites.'
  references:
  - 1. https://github.com/samyk/evercookie
  page_start: 28
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

    REG_DWORD value of 1.

    HKLM\SOFTWARE\Policies\Mozilla\Firefox\SanitizeOnShutdown:Locked

    Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

    REG_SZ value of reject-tracker-and-partition-foreign.

    HKLM\SOFTWARE\Policies\Mozilla\Firefox\Cookies:Behavior'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Enabled:

    Computer Configuration\Policies\Administrative

    Templates\Mozilla\Firefox\Clear data when browser is closed\Locked

    Note: This Group Policy path does not exist by default. An additional Group Policy

    template (firefox.admx/adml) is required - it is available to download at this link.

    To establish the recommended configuration via GP, set the following UI path to

    Enabled: Reject cookies for known trackers and partition third-party

    cookies:

    Computer Configuration\Policies\Administrative

    Templates\Mozilla\Firefox\Cookies\Cookie Behavior

    Note: This Group Policy path does not exist by default. An additional Group Policy

    template (firefox.admx/adml) is required - it is available to download at this link.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location with a

      REG_DWORD value of 1.

