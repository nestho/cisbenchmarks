  description: 'This setting prevents the display of lookalike URL warnings on the sites listed. These warnings are typically
    shown on sites that Google Chrome believes might be trying to spoof another site with which the user is familiar. • Disabled
    (0) or set to an empty list: Warnings may appear on any site the user visits. • Enabled (1) and set to one or more domains:
    No lookalike warnings pages will be shown when the user visits pages on that domain. The recommended state for this setting
    is: Disabled (0)'
  rationale: Look-alike domains are intentionally misleading to give users the false impression that they’re interacting with
    trusted brands, leading to significant reputation damage, financial losses, and data compromise for established enterprises.
    In addition, this technique is commonly used to host phishing sites, and often leads to account takeover attacks. Users
    are prompted to enter their credentials on a fake website, and scammers take control of their online accounts with little
    effort to engage in fraudulent activity.
  impact: 'None - This is the default behavior. NOTE: The only real impact is possible user annoyance if they are going to
    a legitimate site that is falsely considered fraudulent (a rare occurrence). This can be handled by adding the site to
    the allowlist and/or notifying Google of the false finding.'
