  title: '(L1) Ensure ''Proxy settings'' is set to ''Enabled'' and does not contain "ProxyMode": "auto_detect"'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'Google Chrome offers the functionality to configure the proxy settings by automatic discovery using WPAD (Web
    Proxy Auto-Discovery Protocol). Setting this configures the proxy settings for Chrome and ARC-apps, which ignore all proxy-related
    options specified from the command line. Disabled (0): Lets users choose their proxy settings. The recommended state for
    this setting is: If Enabled the value must not contain "ProxySettings": "auto_detect" Google Chrome can notify users that
    it must be restarted to apply a pending update once the notification period defined by the recommendation Set the time
    period for update notifications is passed. • Show a recurring prompt to the user indicating that a relaunch is recommended
    (1) • Show a recurring prompt to the user indicating that a relaunch is required (2) Disabled: Google Chrome indicates
    to the user that a relaunch is needed via subtle changes to its menu. The recommended state for this setting is: Enabled
    with a value of Show a recurring prompt to the user indicating that a relaunch is required (2)'
  rationale: Attackers may abuse the WPAD auto-config functionality to supply computers with a PAC file that specifies a rogue
    web proxy under their control. The end-user will receive a notification informing them that an update has been applied
    and that the browser must be restarted in order for the update to be completed. Once updates have been pushed by the organization
    it is pertinent that the update is applied as soon as possible. Enabling this notification will ensure that users restart
    their browser in a timely fashion.
  impact: If the policy is enabled, the proxy configuration will no longer be discovered using WPAD. A recurring warning will
    be shown to the user indicating that a browser relaunch will be forced once the notification period passes. The user's
    session is restored after the relaunch of Google Chrome.
  references:
  - 1. https://chromeenterprise.google/policies/#ProxySettings
  - 2. http://www.ptsecurity.com/download/wpad_weakness_en.pdf
  - 1. https://chromeenterprise.google/policies/#RelaunchNotification
  page_start: 239
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location which

    must NOT contain "ProxySettings": "auto_detect":

