- id: 2.2.12
  title: '(L1) Ensure ''Default third-party storage partitioning setting'' Is ''Enabled: Disable third-party storage partitioning.'''
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'This setting will block any site from accessing the storage session from any other site. This will block third
    party trackers that are embedded on multiple sites from tracking a user across the sites they visit. Blocking third party
    access to the user agent will not allow sites to infer data about the user from the data from another site. It can be
    configured to either: • (1): Allow third-party storage partitioning to be enabled. • (2): Disable third-party storage
    partitioning. The recommended state for this setting is Enabled with a value of Block third-party storage partitioning
    from being enabled. (2). This policy setting controls whether websites can access connected Bluetooth devices. The recommended
    state for this setting is: Enabled: Do not allow any site to request access to Bluetooth devices via the Web Bluetooth
    API. This policy setting determines whether a website is able to ask for access to use the WebHID API. The WebHID API
    allows websites to access alternative auxiliary keyboards and exotic gamepads. The recommended state for this setting
    is: Enabled: Do not allow any site to request access to HID devices via the WebHID API. Google Chrome has an API which
    allows access to connected USB devices from the browser • Do not allow any site to request access to USB devices via the
    WebUSB API (2) • Allow sites to ask the user to grant access to a connected USB device (3) The recommended state for this
    setting is: Enabled with a value of Do not allow any site to request access to USB devices via the WebUSB API (2)'
  rationale: Setting this requires that user agent state needs to be keyed by more than a single origin or site. It can also
    defend against timing attacks on web privacy. Web Bluetooth could potentially be used for attacks that may bypass other
    controls regarding connected Bluetooth hardware including microphones, cameras, and other devices which information could
    be gathered from or inappropriately utilzed. Disabling the WebHID API prevents HID peripherals from exposing powerful
    functionality that should not be made accessible to the page without explicit consent. For instance, a HID peripheral
    may have sensors that allow it to collect information about its surroundings; a device may store private information that
    should not be revealed or overwritten. Operating systems typically do not restrict access to HID devices from applications,
    and this access can occasionally be abused to damage the device or corrupt the data stored on it. WebUSB is opening the
    doors for sophisticated phishing attacks that could bypass hardware-based two-factor authentication devices (e.g. Yubikey
    devices).
  impact: Enforcing this may cause users to experience issues with sites they regularly visit that already grant access to
    third-parties. Websites will be unable to utilize connected Bluetooth devices via the API, this includes web cameras,
    microphones, and other USB devices. WebHID describes a wide array of devices that could be supported through HID, including
    virtual reality controls, flight simulators, medical equipment, and more. Disabling WebHID would require additional drivers
    or modification to enable support for approved devices. If this setting is configured, websites can no longer access connected
    USB devices via the API (this includes web cameras, headphones, and other USB devices) which could also prevent some two
    factor authentication (2FA) USB devices from working properly.
  references:
  - 1. https://chromeenterprise.google/policies/#DefaultThirdPartyStoragePartitioningS
  - 2. https://privacycg.github.io/storage-partitioning/
  - 1. https://chromeenterprise.google/policies/#DefaultWebBluetoothGuardSetting
  - 1. https://chromeenterprise.google/policies/#DefaultWebHidGuardSetting
  - 1. https://chromeenterprise.google/policies/#DefaultWebUsbGuardSetting
  - 2. https://www.wired.com/story/chrome-yubikey-phishing-webusb/
  page_start: 47
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

