  title: (L1) Ensure 'Enable Google Cloud Print Proxy' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This setting enables Google Chrome to act as a proxy between Google Cloud Print and legacy printers connected
    to the machine. The recommended state for this setting is: Disabled (0) This policy setting controls whether insecure
    websites are allowed to make requests to more private network endpoints. A network endpoint is more private than another
    if: 1. Its IP address is localhost and the other is not. 2. Its IP address is private and the other is public. In the
    future, depending on spec evolution, this policy might apply to all cross-origin requests directed at private IPs or localhost.
    A website is deemed secure if it meets the definition of a secure context in https://developer.mozilla.org/en-US/docs/Web/Security/Secure_Contexts.
    Otherwise, it will be treated as an insecure context. Note: This policy relates to the Private Network Access specification.
    See https://wicg.github.io/private-network-access/ for more details. Note #2: If this policy is not configured or set
    to Disabled, the default behavior for requests from insecure contexts to more-private network endpoints will depend on
    the user´s personal configuration for the BlockInsecurePrivateNetworkRequests feature, which may be set by a field trial
    or on the command line. The recommended state for this setting is: Disabled.'
  rationale: 'Disabling this option will prevent users from printing documents from unmanaged devices to an organization''s
    printer. Allowing public internet sites to “peek” behind your firewall by using the user’s browser to mix intranet resources
    into internet-delivered pages represents a dangerous attack surface. The baseline requires enforcement of the new browser
    restriction that any such intranet requests are blocked if the internet page was delivered over insecure HTTP. Note: If
    for some reason you need to permit insecure cross-network requests for legacy sites, you can configure temporary exceptions
    in Allow the listed sites to make requests to more-private network endpoints from insecure contexts.'
  impact: If this setting is disabled, users cannot enable the proxy, and the machine will not be allowed to share its local
    printers with Google Cloud Print. Users will be unable to allow non-secure public contexts to request resources from private
    addresses.
  references:
  - 1. https://chromeenterprise.google/policies/#CloudPrintProxyEnabled
  - 1. https://chromeenterprise.google/policies/#InsecurePrivateNetworkRequestsAllow
  page_start: 109
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location which

    should be set to 0:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:CloudPrintProxyEnabled

