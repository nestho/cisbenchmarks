- id: '3.1'
  title: (L1) Ensure 'Auto-update check period override' is set to any value except '0'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting configures the minimum number of minutes between automatic update checks. The recommended
    state for this setting is: any value except 0. Google Update manages installation of available Google Chrome updates from
    Google. This setting allows users to define whether updates are to be applied automatically. Depending on the business
    scenario, updates shall be applied periodically or also if the user seeks for updates. • (0): Updates disabled • (1):
    Always allow updates (recommended) • (2): Manual updates only • (3): Automatic silent updates only Disabled (0): Google
    Update handles available updates as specified by "Update policy override default". The recommended state for this setting
    is: Enabled with a value of Always allow updates (recommended) (1) or Automatic silent updates only (3) NOTE: This policy
    is available only on Windows instances that are joined to a Microsoft® Active Directory® domain.'
  rationale: Automatic updates can help ensure that the computers in the environment will always have the most recent critical
    updates and can decrease the amount of time the system will remain vulnerable between updates and patches. Software updates
    shall be applied as soon as they are available since they may include latest security patches.
  impact: If using a third-party for patching, an exception to this recommendation will be needed. Latest updates are automatically
    applied at least periodically.
