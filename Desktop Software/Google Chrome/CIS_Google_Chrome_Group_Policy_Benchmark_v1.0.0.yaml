controls:
- id: 2.1.1
  title: (L2) Ensure 'Allow or deny screen capture' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'This setting controls whether Google Chrome can use screen-share APIs including web-based online meetings,
    video, or screen sharing. The recommended state for this setting is: Disabled (0) NOTE: This setting is not considered
    (and a site will be allowed to use screen-share APIs) if the site matches an origin pattern in any of the following other
    settings: ScreenCaptureAllowedByOrigins, WindowCaptureAllowedByOrigins, TabCaptureAllowedByOrigins, SameOriginTabCaptureAllowedByOrigins.'
  rationale: Allowing screen-share APIs within Google Chrome could potentially allow for sensitive data to be shared via screen
    captures.
  impact: Users will be unable to utilize APIs which support web-based meetings (video conferencing screen sharing), video,
    and screen capture. This could potentially cause disruption to users who may have utilized these abilities in the past.
  references:
  - 1. https://chromeenterprise.google/policies/#ScreenCaptureAllowed
  page_start: 22
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location which

    should be set to 0:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:ScreenCaptureAllowed'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path

    to Disabled:

    Computer Configuration\Policies\Administrative Templates\Google\Google

    Chrome\Allow or deny screen capture\Allow or deny screen capture'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location which

      should be set to 0:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:ScreenCaptureAllowed'
    severity: medium
- id: 2.2.1
  title: (L1) Ensure 'Allow clipboard for these sites' Is Configured
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This setting allows administrators to list specific sites that have access to the clipboard site permissions.
    Note: This does not include using keyboard shortcuts. Those are not gated by the clipboard site permission.'
  rationale: Setting this policy allows specified URLs to have access to the clipboard site permissions. This will allow the
    specified sites to have access to data on the clipboard that other sites do not. DefaultClipboardSetting is recommended
    to be set to disabled, so this list would be the only sites that would have access to the clipboard data.
  impact: Enforcing this recommendation can cause the clipboard functionality to not work identically for every site.
  references:
  - 1. https://chromeenterprise.google/policies/#ClipboardAllowedForUrls
  - 2. https://chromeenterprise.google/policies/url-patterns/
  page_start: 25
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location which

    should be set individually to your organization''s allowed URLs:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ClipboardAllowedForUrls\<n

    umber> = <url>

    Example:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ClipboardAllowedForUrls\1

    = https://www.example.com

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ClipboardAllowedForUrls\2

    = [*.]example.edu

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ClipboardAllowedForUrls\3

    = https://www.example.net'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path

    to Enabled and set Show to the approved URLs:

    Computer Configuration\Policies\Administrative Templates\Google\Google

    Chrome\Content settings\Allow clipboard on these sites'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location which

      should be set individually to your organization''s allowed URLs:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ClipboardAllowedForUrls\<n

      umber> = <url>

      Example:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ClipboardAllowedForUrls\1

      = https://www.example.com

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\Cli'
    severity: medium
- id: 2.2.2
  title: (L1) Ensure 'Block clipboard on these sites' Is Configured
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This setting allows administrators to list specific sites that do not have access to the clipboard site permissions.
    Note: This does not include using keyboard shortcuts. Those are not gated by the clipboard site permission.'
  rationale: Specifying URLs that do not have access to the clipboard site permissions limits data for sites that have access
    to data on the clipboard, and allows for more sites to have access. Setting this policy denies specified URLs to have
    access to the clipboard site permissions. This will limit the specified sites to access the data on the clipboard that
    other sites do. DefaultClipboardSetting is recommended to be set to disabled, so this list would be a backup to that policy
    in case it was enabled, left as the default, or removed.
  impact: Enforcing this recommendation can cause the clipboard functionality to not work identically for every site.
  references: []
  page_start: 27
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location which

    should be set individually to your organization''s blocked URLs:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ClipboardBlockedForUrls\<n

    umber> = <url>

    Example:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ClipboardBlockedForUrls\1

    = https://www.example.com

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ClipboardBlockedForUrls\2

    = [*.]example.edu

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ClipboardBlockedForUrls3 =

    https://www.example.net'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path

    to Enabled and set Show to the blocked URLs:

    Computer Configuration\Policies\Administrative Templates\Google\Google

    Chrome\Content settings\Block clipboard on these sites'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location which

      should be set individually to your organization''s blocked URLs:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ClipboardBlockedForUrls\<n

      umber> = <url>

      Example:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ClipboardBlockedForUrls\1

      = https://www.example.com

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\Cli'
    severity: medium
- id: 2.2.3
  title: (L1) Ensure 'Default clipboard setting' Is 'Enabled' to 'Deny Permissions'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This setting controls the defaults for clipboard permission access from sites. It can be configured to either:
    • Disabled (2): Does not allow access to the clipboard site permission by any site • Enabled (3): Sites ask the user to
    allow access to the clipboard site permission If the value for DefaultClipboardSetting is not changed from the default,
    it will behave as if it is enabled. ClipboardAllowedForUrls or ClipboardBlockedForUrls will override this setting for
    any site that matches the configured URL patterns. With the setting disabled, organizations will need to set ClipboardAllowedForUrls
    for any URLs they want to make exempt.'
  rationale: The clipboard stores data, text, and images that are shared between all applications. An organization would disable
    clipboard access to restrict sites from reading the contents of the clipboard when visiting.
  impact: Not allowing sites to have access to the clipboard permission can cause issues with formatting or access to needed
    images on the clipboard.
  references:
  - 1. https://chromeenterprise.google/policies/#DefaultClipboardSetting
  page_start: 29
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location which

    should be set to 2:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:DefaultClipboardSetting'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path

    to Enabled: Do not allow any site to use the clipboard site permission:

    Computer Configuration\Policies\Administrative Templates\Google\Google

    Chrome\Content settings\Default clipboard setting'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location which

      should be set to 2:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:DefaultClipboardSetting'
    severity: medium
- id: 2.2.4
  title: '(L2) Ensure ''Default cookies setting'' is set to ''Enabled: Keep cookies for the duration of the session'''
  scoring: scored
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'When leaving the setting _RestoreOnStartup _unset results in the use of _DefaultCookiesSetting _for all sites,
    if it''s set. If _DefaultCookiesSetting _is not set, the user''s personal setting applies. • Disabled (0, user''s personal
    setting applies) • Allow all sites to set local data (1) • Do not allow any site to set local data (2) • Keep cookies
    for the duration of the session (4) The recommended state for this setting is: Enabled with a value of Keep cookies for
    the duration of the session (4) NOTE: If the RestoreOnStartup setting is set to restore URLs from previous sessions this
    setting will not be respected and cookies will be stored permanently for those sites. An example of those URLs are SSO
    or intranet sites. This policy setting determines whether websites can ask for read access to the host operating system´s
    file system using the File System API. Policy options mapping: BlockFileSystemRead (2) = Do not allow any site to request
    read access to files and directories via the File System API AskFileSystemRead (3) = Allow sites to ask the user to grant
    read access to files and directories via the File System API The recommended state for this setting is: Enabled: Don''t
    allow any site to request read access to files and directories. Google Chrome supports tracking a user''s physical location
    using GPS, data about nearby Wi-Fi access points or cellular signal sites/towers (even if you’re not using them), and
    your computer’s IP. • Disabled (0, same as 3) • Allow sites to track the users'' physical location (1) • Do not allow
    any site to track the users'' physical location (2) • Ask whenever a site wants to track the users'' physical location
    (3) The recommended state for this setting is: Enabled with a value Do not allow any site to track the users'' physical
    location (2) Setting controls whether users can add exceptions to allow mixed content for specific sites. • Do not allow
    any site to load mixed content (2) • Allow users to add exceptions to allow mixed content (3) The recommended state for
    this setting is: Enabled with the value of Do not allow any site to load mixed content (2) NOTE: This policy can be overridden
    for specific URL patterns using the InsecureContentAllowedForUrls and InsecureContentBlockedForUrls policies.'
  rationale: 'Permanently stored cookies may be used for malicious intent. There is a large category of attack vectors that
    are opened up by allowing web applications access to files. By setting this policy to Enabled: Do not allow any site to
    request read access to files and directories via the File System API implements additional protections to safeguard against
    accidental sharing of sensitive information contained in locals files. From a privacy point of view it is not desirable
    to submit indicators regarding the location of the device, since the processing of this information cannot be determined.
    Furthermore, this may leak information about the network infrastructure around the device. Allowing mixed (secure / insecure)
    content from a site can lead to malicious content being loaded. Mixed content occurs if the initial request is secure
    over HTTPS, but HTTPS and HTTP content is subsequently loaded to display the web page. HTTPS content is secure. HTTP content
    is insecure.'
  impact: If this setting is enabled, cookies will be cleared when the session closes. Users with creative roles that require
    the File System API access permission to read files for photo, video, and text editors or for creating integrated development
    environments will need additional permissions granted based on their role. If this setting is disabled, chrome will no
    longer send data about nearby Wi-Fi access points or cellular signal sites/towers (even if you’re not using them), and
    your computer’s IP address to Google. Users will not be able to mix content.
  references:
  - 1. https://chromeenterprise.google/policies/#DefaultCookiesSetting
  - 2. https://chromeenterprise.google/policies/#RestoreOnStartup
  - 1. https://chromeenterprise.google/policies/#DefaultFileSystemReadGuardSetting
  - 1. https://chromeenterprise.google/policies/#DefaultGeolocationSetting
  - 2. https://www.w3.org/2010/api-privacy-ws/papers/privacy-ws-24.pdf
  - 1. https://chromeenterprise.google/policies/#DefaultInsecureContentSetting
  page_start: 31
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location which

    should be set to 4:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:DefaultCookiesSetting

    Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location which

    should be set to 2.

    HKEY_LOCAL_MACHINE\Software\Policies\Google\Chrome:DefaultFileSystemReadGuard

    Setting

    Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location which

    should be set to 2:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:DefaultGeolocationSetting

    Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location which

    should be set to 2:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:DefaultInsecureContentSett

    ing'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path

    to Enabled: Keep cookies for the duration of the session:

    Computer Configuration\Administrative Templates\Google\Google Chrome\Content

    Settings\Default cookies setting

    To establish the recommended configuration via GP, set the following UI path to

    Enabled: Do not allow any site to request read access to files and

    directories via the File System API:

    Computer Configuration\Policies\Administrative Templates\Google\Google

    Chrome\Content settings\Control use of the File System API for reading

    To establish the recommended configuration via Group Policy, set the following UI path

    to Enabled: Do not allow any site to track the users'' physical location:

    Computer Configuration\Administrative Templates\Google\Google Chrome\Content

    Settings\Default geolocation setting

    To establish the recommended configuration via Group Policy, set the following UI path

    to Enabled: Do not allow any site to load mixed content:

    Computer Configuration\Polices\Administrative Templates\Google\Google

    Chrome\Content Settings\Control use of insecure content exceptions'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location which

      should be set to 4:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:DefaultCookiesSetting

      Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location which

      should be set to 2.

      HKEY_LOCAL_MACHINE\Software\Polic'
    severity: medium
- id: 2.2.8
  title: '(L2) Ensure ''Control use of JavaScript JIT'' is set to ''Enabled: Do not allow any site to run JavaScript JIT'''
  scoring: scored
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'This policy setting specifies whether Microsoft Edge will run the v8 JavaScript engine with JIT (Just In Time)
    compiler. JIT is a complex pipeline of processes used to optimize JavaScript code for performance. Note: This policy can
    be overridden for specific URL patterns using the JavaScriptJitAllowedForSites (Allow JavaScript to use JIT on these sites)
    and JavaScriptJitBlockedForSites (Block JavaScript from using JIT on these sites) policies. The recommended state for
    this setting is: Enabled: Do not allow any site to run JavaScript JIT.'
  rationale: Microsoft's research has revealed that attackers usually target the JavaScript engine called “Just-In-Time (JIT)
    compilation” to hack web browsers. Disabling the JavaScript just-in-time (JIT) compiler prevents attackers from hacking
    into systems that Microsoft Edge uses.
  impact: Disabling the JavaScript JIT will mean that Microsoft Edge may render web content more slowly, and may also disable
    parts of JavaScript including WebAssembly. Users may experience slower rendering of web content.
  references:
  - 1. https://chromeenterprise.google/policies/#DefaultJavaScriptJitSetting
  page_start: 39
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.

    HKEY_LOCAL_MACHINE\Software\Policies\Google\Chrome:DefaultJavaScriptJitSettin

    g'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path

    to Enabled: Do not allow any site to run JavaScript JIT:

    Computer Configuration\Policies\Administrative Templates\Google\Google

    Chrome\Content settings\Control use of JavaScript JIT'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.

      HKEY_LOCAL_MACHINE\Software\Policies\Google\Chrome:DefaultJavaScriptJitSettin

      g'
    severity: medium
- id: 2.2.9
  title: '(L2) Ensure ''Default notification setting'' is set to ''Enabled: Do not allow any site to show desktop notifications'''
  scoring: scored
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'Google Chrome offers websites the ability to display desktop notifications. These are push messages which
    are sent from the website operator through Google infrastructure to Chrome. • Allow sites to show desktop notifications
    (1) • Do not allow any site to show desktop notifications (2) • Ask every time a site wants to show desktop notifications
    (3) The recommended state for this setting is: Enabled with a value of Do not allow any site to show desktop notifications
    (2)'
  rationale: If the website operator decides to send messages unencrypted, Google's servers may process it as plain text.
    Furthermore, potentially compromised or faked notifications might trick users into clicking on a malicious link.
  impact: If this setting is enabled and set to Do not allow any site to show desktop notifications, notifications will not
    be displayed for any sites and the user will not be asked.
  references:
  - 1. https://chromeenterprise.google/policies/#DefaultNotificationsSetting
  - 2. https://www.google.com/chrome/privacy/whitepaper.html#notifications
  page_start: 41
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location which

    should be set to 2:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:DefaultNotificationsSettin

    g'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path

    to Enabled: Do not allow any site to show desktop notifications:

    Computer Configuration\Polices\Administrative Templates\Google\Google

    Chrome\Content Settings\Default notification setting'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location which

      should be set to 2:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:DefaultNotificationsSettin

      g'
    severity: medium
- id: 2.2.10
  title: '(L2) Ensure ''Default Sensors Setting'' is set to ''Enabled: Do not allow any site to access sensors'''
  scoring: scored
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'This setting controls website access and use of system sensors such as motion and light. • Allow sites to
    access sensors (1) • Do not allow any site to access sensors (2) The recommended state for this setting is: Do not allow
    any site to access sensors (2) The recommended state for this setting is: Enabled with a value of Do not allow any site
    to access sensors NOTE: If more granular control is needed (per website) then this setting can be used in combination
    with the SensorsAllowedForUrls and SensorsBlockedForUrls settings. For example, SensorsAllowedForUrls can be used to allow
    sensor access to specific sites. Please see the references below for more information. This setting controls website access
    and use of the system serial port. • (2): Do not allow any site to request access to serial ports via the Serial API •
    (3): Allow sites to ask the user to grant access to a serial port The recommended state for this setting is: Enabled with
    a value of Do not allow any site to request access to serial ports via the Serial API (2) NOTE: If more granular control
    is needed (per website) then this setting can be used in combination with the SerialAllowAllPortsForUrls, SerialAskForUrls
    and SerialBlockedForUrls settings. For example, SerialAllowAllPortsForUrls can be used to allow serial port access to
    specific sites. Please see the references below for more information.'
  rationale: Preventing access to system sensors may prevent malicious sites from using these sensors for user profiling (OpSec).
    Preventing access to system serial ports may prevent malicious sites from using these ports and accessing the devices
    attached.
  impact: This setting would also prevent legitimate sites from accessing it as well. This setting would also prevent legitimate
    sites from accessing it as well.
  references:
  - 1. https://chromeenterprise.google/policies/#DefaultSensorsSetting
  - 2. https://chromeenterprise.google/policies/#SensorsAllowedForUrls
  - 1. https://chromeenterprise.google/policies/#DefaultSerialGuardSetting
