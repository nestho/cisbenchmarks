- id: '2.37'
  title: '(L1) Ensure ''Set disk cache size, in bytes'' is set to ''Enabled: 250609664'''
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'This setting controls the size of the cache, in bytes, used to store files on the disk. The recommended state
    for this setting is: Enabled: 250609664 or greater NOTE The value specified in this setting isn''t a hard boundary but
    rather a suggestion to the caching system; any value below a few megabytes is too small and will be rounded up to a reasonable
    minimum. This controls the mode of the DNS-over-HTTPS resolver. Please note that this setting will only set the default
    mode for each query. The mode may be overridden for special types of queries, such as requests to resolve a DNS-over-HTTPS
    server hostname. • Disable DNS-over-HTTPS (off) • Enable DNS-over-HTTPS with insecure fallback (automatic) - Enable DNS-over-HTTPS
    queries first if a DNS-over-HTTPS server is available and may fallback to sending insecure queries on error. • Enable
    DNS-over-HTTPS without insecure fallback (secure) - Only send DNS-over-HTTPS queries and will fail to resolve on error.
    The recommended state for this setting is: Enabled with a value of Enable DNS-overHTTPS without insecure fallback (secure)
    Note: When enabling this policy, it is recommended to also configure the DnsOverHttpsTemplates policy so that the URI
    templates are set. You can find out more information on the DnsOverHttpsTemplates enterprise policy site.'
  rationale: 'Having enough disk space for browser cache is important for a computer investigation and for investigators such
    as Computer Forensics Analysts to be able to retrieve pertinent information to the investigation. DNS over HTTPS (DOH)
    has a couple primary benefits: 1. Encrypting DNS name resolution traffic helps to hide your online activities, since DoH
    hides the name resolution requests from the ISP and from anyone listening on intermediary networks. 2. DoH also helps
    to prevent DNS spoofing and man-in-the-middle (MitM) attacks.'
  impact: Browser cache will take up to 250MB in disk space. Not all DNS providers support DOH, so choice is limited. Also,
    Enterprises sometimes monitor DNS requests to block access to malicious or inappropriate sites. DNS monitoring can also
    sometimes be used to detect malware attempting to "phone home." Because DoH encrypts name resolution requests, it can
    create a security monitoring blind spot.
  references:
  - 1. https://chromeenterprise.google/policies/#DiskCacheSize
  - 1. https://chromeenterprise.google/policies/#DnsOverHttpsMode
  page_start: 183
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

