    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:SuppressUnsupportedOSWarni

    ng'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled:

    Computer Configuration\Administrative Templates\Google\Google Chrome\Suppress

    the unsupported OS warning'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

