  title: (L2) Ensure 'Default notification setting' is set to 'Enabled' with 'Do not allow any site to show desktop notifications'
  scoring: scored
  profile:
  - Level 2
  - Level 2
  - Level 2
  description: Google Chrome offers websites to display desktop notifications. These are push messages which are sent from
    the website operator through Google infrastructure to Chrome. Google Chrome offers a API which allows the access to nearby
    Bluetooth devices from the browser with users consent. Google Chrome offers a API which allows the access to connected
    USB devices from the browser.
  rationale: If the website operator decides to send messages unencrypted Google's servers may process it as plain text. Furthermore,
    potentially compromised or faked notifications might trick users into clicking on a malicious link. A malicious website
    could exploit a vulnerable Bluetooth device. WebUSB is opening the doors for sophisticated phishing attacks that could
    bypass hardware-based two-factor authentication devices (e.g. Yubikey devices).
  impact: If this setting is enabled and set to Do not allow any site to show desktop notifications, notifications will not
    be displayed for any sites and the user will not be asked. If this setting is enabled and set to Do not allow any site
    to request access to Bluetooth devices via the Web Bluetooth API, websites no longer can access nearby Bluetooth device
    via the API and the user will never be asked. If this setting is enabled and set to Do not allow any site to request access
    to USB devices via the WebUSB API, websites can no longer access connected USB devices via the API which could also prevent
    2FA USB devices from working properly.
