controls:
- id: 1.1.1
  title: (L1) Ensure 'Enable curtaining of remote access hosts' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Chrome allows controls to prevent someone physically present at the host machine from seeing what a user is
    doing while a remote connection is in progress.
  rationale: If a remote session is in progress the user physically present at the host machine shall be able to see what
    a remote user is doing.
  impact: If this setting is disabled, host's physical input and output devices are enabled while a remote connection is in
    progress.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#RemoteAccessHostRequireCurtain
  page_start: 12
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostRequireCur

    tain

    12 | P a g e'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Google\Google

    Chrome\Configure remote access options\Enable curtaining of remote access

    hosts'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostRequireCur

      tain

      12 | P a g e'
    severity: medium
- id: 1.1.2
  title: (L1) Ensure 'Allow gnubby authentication for remote access hosts' is set to 'Disabled'.
  scoring: scored
  profile:
  - Level 1
  description: Google Chrome offers to proxy gnubby authentication requests (U2F) across a remote host connection.
  rationale: Proxying shall not be used to circumvent firewall restrictions.
  impact: If this setting is disabled, gnubby authentication requests will not be proxied.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#RemoteAccessHostAllowGnubbyAuth
  page_start: 14
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostAllowGnubb

    yAuth'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Google\Google

    Chrome\Configure remote access options\Allow gnubby authentication for remote

    access hosts'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostAllowGnubb

      yAuth'
    severity: medium
- id: 1.1.3
  title: (L1) Ensure 'Allow remote users to interact with elevated windows in remote assistance sessions' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Google Chrome offers to run the remote assistance host in a process with uiAccess permissions. This allows
    remote users to interact with elevated windows on the local user's desktop.
  rationale: Remote users shall not be able to escalate privileges.
  impact: If this setting is disabled, the remote assistance host will run in the user's context. Furthermore, remote users
    cannot interact with elevated windows on the desktop.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#RemoteAccessHostAllowUiAccessForRemoteAssistance
  page_start: 16
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostAllowUiAcc

    essForRemoteAssistance'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Google\Google

    Chrome\Configure remote access options\Allow remote users to interact with

    elevated windows in remote assistance sessions'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostAllowUiAcc

      essForRemoteAssistance'
    severity: medium
- id: '1.2'
  title: (L1) Ensure 'Continue running background apps when Google Chrome is closed' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Chrome allows for processes started while the browser is open to remain running once the browser has been closed.
    It also allows for background apps and the current browsing session to remain active after the browser has been closed.
  rationale: If this setting is enabled, vulnerable or malicious plugins, apps and processes can continue running even after
    Chrome has closed.
  impact: If this policy is set to Disabled, background mode is disabled and cannot be controlled by the user in the browser
    settings.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#BackgroundModeEnabled
  page_start: 18
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:BackgroundModeEnabled'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Google\Google Chrome\Continue

    running background apps when Google Chrome is closed'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:BackgroundModeEnabled'
    severity: medium
- id: '1.3'
  title: (L1) Ensure 'Ask where to save each file before downloading' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: Google Chrome offers to download files automatically to the default download directory without prompting.
  rationale: Users shall be prevented from the drive-by-downloads threat.
  impact: If this setting is enabled, users are always asked where to save each file before downloading.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#PromptForDownloadLocation
  - 2. https://www.ghacks.net/2017/05/18/you-should-disable-automatic-downloadsin-chrome-right-now/
  page_start: 20
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:PromptForDownloadLocation'
  remediation: 'To establish the recommended configuration via Group Policy, set the

    following UI path to Enabled:

    Computer Configuration\Administrative Templates\Google\Google Chrome\Ask

    where to save each file before downloading'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:PromptForDownloadLocation'
    severity: medium
- id: '1.4'
  title: (L1) Ensure 'Disable saving browser history' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Google Chrome allows to save the browser history.
  rationale: Browser history shall be saved as it may contain indicators of compromise.
  impact: All user browser history will be saved.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#SavingBrowserHistoryDisabled
  page_start: 22
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:SavingBrowserHistoryDisabl

    ed'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled:

    Computer Configuration\Administrative Templates\Google\Google Chrome\Disable

    saving browser history'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:SavingBrowserHistoryDisabl

      ed'
    severity: medium
- id: '1.5'
  title: (L1) Ensure 'Enable HTTP/0.9 support on non-default ports' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Non-HTTP services' responses may be read via XHR as their response streams will be interpreted by Chrome as
    HTTP/0.9. This setting allows to enable HTTP/0.9 on ports other than 80 for HTTP and 443 for HTTPS.
  rationale: DNS rebinding attacks can be mounted against non-HTTP services to steal their responses cross-protocol.
  impact: If this setting is disabled, HTTP/0.9 will be disabled on non-default ports 80/443.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#Http09OnNonDefaultPortsEnabled
  page_start: 24
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:Http09OnNonDefaultPortsEna

    bled'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled:

    Computer Configuration\Administrative Templates\Google\Google Chrome\Enable

    HTTP/0.9 support on non-default ports'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:Http09OnNonDefaultPortsEna

      bled'
    severity: medium
- id: '1.6'
  title: (L1) Ensure 'Enable component updates in Google Chrome' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: Google Chrome's Component Updater updates several components of Google Chrome (like the Adobe Flash Player,
    Widevine DRM, Chrome updater recovery component) on a regular basis.
  rationale: Google Chrome Updater shall be used to keep the components bundled to Chrome up-todate.
  impact: Google Chrome Updater keeps the components bundled to Chrome up-to-date.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#ComponentUpdatesEnabled
  page_start: 26
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:ComponentUpdatesEnabled'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Enabled:

    Computer Configuration\Administrative Templates\Google\Google Chrome\Enable

    component updates in Google Chrome'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:ComponentUpdatesEnabled'
    severity: medium
- id: '1.7'
  title: (L1) Ensure 'Enable deprecated web platform features for a limited time' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Google Chrome offers the ability to re-enable specific deprecated web platform features for a defined period
    of time.
  rationale: Deprecated web platform features shall no longer be used.
  impact: If this setting is disabled, deprecated web platform features are no longer being reactivated.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#EnableDeprecatedWebPlatformFeatures
  page_start: 28
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\EnableDeprecatedWebPlatfor

    mFeatures:<number>'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled:

    Computer Configuration\Administrative Templates\Google\Google Chrome\Enable

    deprecated web platform features for a limited time'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\EnableDeprecatedWebPlatfor

      mFeatures:<number>'
    severity: medium
- id: '1.8'
  title: (L1) Ensure 'Enable third party software injection blocking' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: Google Chrome allows to prevented third party software from injecting executable code into Chrome's processes.
  rationale: Third party software shall not be able to inject executable code into Chrome's processes.
  impact: Third party software will be prevented from injecting executable code into Chrome's processes.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#ThirdPartyBlockingEnabled
  page_start: 30
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:ThirdPartyBlockingEnabled'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Enabled:

    Computer Configuration\Administrative Templates\Google\Google Chrome\Enable

    third party software injection blocking'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:ThirdPartyBlockingEnabled'
    severity: medium
- id: '1.9'
  title: (L1) Ensure 'Extend Flash content setting to all content' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Controls if all Flash content embedded on websites that have been set to allow Flash in content settings -
    either by the user or by enterprise policy - will be run, including content from other origins or small content.
  rationale: Cross-domain Flash plugins or "hidden" flash content may be malicious and therefore shall be prevented from being
    displayed.
  impact: Flash content from other origins or small content might be blocked.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#RunAllFlashInAllowMode
  page_start: 32
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RunAllFlashInAllowMode'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled:

    Computer Configuration\Administrative Templates\Google\Google Chrome\Extend

    Flash content setting to all content'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RunAllFlashInAllowMode'
    severity: medium
- id: '1.10'
  title: (L1) Ensure 'Suppress the unsupported OS warning' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Google Chrome will show a warning that appears when Google Chrome is running on a computer or operating system
    that is no longer supported.
  rationale: The user shall be informed if the used software is no longer supported.
  impact: Unsupported warnings will not be suppressed.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#SuppressUnsupportedOSWarning
  page_start: 34
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

