- id: '1.11'
  title: (L1) Ensure 'Whether online OCSP/CRL checks are performed' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Google Chrome offers to reactivate soft-fail, online revocation checks although they provide no effective security
    benefit.
  rationale: An attacker may block OCSP traffic and cause revocation checks to pass in order to cause usage of soft-fail behavior.
    Furthermore, the browser may leak what website is being accessed and who accesses it to CA servers.
  impact: If this setting is disabled, unsecure online OCSP/CRL checks are no longer performed.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#EnableOnlineRevocationChecks
  - 2. https://medium.com/@alexeysamoshkin/how-ssl-certificate-revocation-is-brokenin-practice-af3b63b9cb3
  page_start: 36
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:EnableOnlineRevocationChec

    ks'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled:

    Computer Configuration\Administrative Templates\Google\Google Chrome\Whether

    online OCSP/CRL checks are performed'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:EnableOnlineRevocationChec

      ks'
    severity: medium
- id: '1.12'
  title: (L1) Ensure 'Allow WebDriver to Override Incompatible Policies' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: The WebDriver feature may override policies which can interfere with its operation. At time of writing this
    may affect the policies 'Enable Site Isolation for every site' and 'Enable Site Isolation for specified origins'. Google
    Chrome allows to use the Google Safe Search API to classify URLs as pornographic or not.
  rationale: Settings of policies shall not be circumvented by any features. Using Googles Safe Search API may leak information
    which is typed/pasted by mistake into the omnibox, e.g. passwords, internal webservices, folder structures, etc.
  impact: WebDriver will not be allowed to override incompatible policies. Sites will not be filtered.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#WebDriverOverridesIncompatiblePolicies
  - 1. https://www.chromium.org/administrators/policy-list-3#SafeSitesFilterBehavior
  page_start: 38
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:WebDriverOverridesIncompat

    iblePolicies

    Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:SafeSitesFilterBehavior'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled:

    Computer Configuration\Administrative Templates\Google\Google Chrome\Allow

    WebDriver to Override Incompatible Policies

    To establish the recommended configuration via Group Policy, set the following UI path to

    Enabled with value Do not filter sites for adult content specified:

    Computer Configuration\Administrative Templates\Google\Google Chrome\Control

    SafeSites adult content filtering.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:WebDriverOverridesIncompat

      iblePolicies

      Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:SafeSitesFilte'
    severity: medium
- id: '1.14'
  title: (L1) Ensure 'Origins or hostname patterns for which restrictions on insecure origins should not apply' is set to
    'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Google Chrome allows to specify a list of origins (URLs) or hostname patterns (such as "*.example.com") for
    which security restrictions on insecure origins will not apply and are prevented from being labeled as "Not Secure" in
    the omnibox.
  rationale: Insecure contexts shall always be labeled as insecure.
  impact: Insecure contexts are labeled as insecure.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#OverrideSecurityRestrictionsOnInsecureOrigin
  page_start: 42
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\OverrideSecurityRestrictio

    nsOnInsecureOrigin:<number>'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled:

    Computer Configuration\Administrative Templates\Google\Google Chrome\Origins

    or hostname patterns for which restrictions on insecure origins should not

    apply'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\OverrideSecurityRestrictio

      nsOnInsecureOrigin:<number>'
    severity: medium
- id: '1.15'
  title: (L1) Ensure 'Disable Certificate Transparency enforcement for a list of Legacy Certificate Authorities' is set to
    'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Google Chrome allows to disable the enforcing of Certificate Transparency requirements for a list of Legacy
    Certificate Authorities.
  rationale: Legacy Certificate Authorities shall follow the Certificate Transparency policy.
  impact: If this setting is disabled, certificates not properly publicly disclosed as required by Certificate Transparency
    are untrusted.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#CertificateTransparencyEnforcementDisabledForLegacyCas
  page_start: 44
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\CertificateTransparencyEnf

    orcementDisabledForLegacyCas:<number>'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled:

    Computer Configuration\Administrative Templates\Google\Google Chrome\Disable

    Certificate Transparency enforcement for a list of Legacy Certificate

    Authorities'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\CertificateTransparencyEnf

      orcementDisabledForLegacyCas:<number>'
    severity: medium
- id: '1.16'
  title: (L1) Ensure 'Disable Certificate Transparency enforcement for a list of URLs' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Google Chrome allows to specify URLs/hostnames for which Certificate Transparency will not be enforced.
  rationale: Certificates that are required to be disclosed via Certificate Transparency shall be treated for all URLs as
    untrusted if they are not disclosed according to the Certificate Transparency policy.
  impact: If this setting is disabled, no URLs are excluded from Certificate Transparency requirements.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#CertificateTransparencyEnforcementDisabledForUrls
  page_start: 46
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\CertificateTransparencyEnf

    orcementDisabledForUrls:<number>'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled:

    Computer Configuration\Administrative Templates\Google\Google Chrome\Disable

    Certificate Transparency enforcement for a list of URLs'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\CertificateTransparencyEnf

      orcementDisabledForUrls:<number>'
    severity: medium
- id: '1.17'
  title: (L1) Ensure 'Disable Certificate Transparency enforcement for a list of subjectPublicKeyInfo hashes' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: Google Chrome allows to exclude certificates by their subjectPublicKeyInfo hashes from enforcing Certificate
    Transparency requirements. Allows you to set whether websites are allowed to automatically run plugins. Automatically
    running plugins can be either allowed for all websites or denied for all websites.
  rationale: Certificate Transparency requirements shall be enforced for all certificates. Malicious plugins can cause browser
    instability and erratic behavior so setting the value to 'Click to play' will allow a user to only run necessary plugins.
  impact: If this setting is disabled, no certificates are excluded from Certificate Transparency requirements. If this setting
    is enabled, users must click plugins to allow their execution
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#CertificateTransparencyEnforcementDisabledForCas
  - 1. https://www.chromium.org/administrators/policy-list-3#DefaultPluginsSetting
  page_start: 48
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\CertificateTransparencyEnf

    orcementDisabledForCas:<number>

