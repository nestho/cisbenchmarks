- id: 2.3.1
  title: (L1) Ensure 'Site isolation' is set to 'Require Site Isolation for all websites, as well as any origins below'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This setting controls if every website will load into its own process. Disabled (0): Doesn''t turn off site
    isolation, but it lets users opt out. The recommended state for this setting is: Enabled (1)'
  rationale: Chrome will load each website in its own process. Even if a site bypasses the sameorigin policy, the extra security
    will help stop the site from stealing your data from another website.
  impact: If the policy is enabled, each site will run in its own process which will cause the system to use more memory.
    You might want to look at the Enable Site Isolation for specified origins policy setting to get the best of both worlds
    – isolation and limited impact for users – by using Enable Site Isolation for specified origins with a list of the sites
    you want to isolate.
  references:
  - 1. https://chromeenterprise.google/policies/#SitePerProcess
  - 2. https://www.chromium.org/Home/chromium-security/site-isolation
  page_start: 30
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under User & browser settings, select Site isolation

    6. Ensure Configuration is set to Require Site Isolation for all

    websites, as well as any origins below'
  remediation: 'To configure this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under User & browser settings, select Site isolation

    6. Set Configuration to Require Site Isolation for all websites, as

    well as any origins below

    7. Select Save'
  checks:
  - type: manual_review
    info: 'To verify this setting via the Google Workspace Admin Console:

      1. Log in to https://admin.google.com as an administrator

      2. Select Devices

      3. Select Chrome

      4. Select Settings

      5. Under User & browser settings, select Site isolation

      6. Ensure Configuration is set to Require Site Isolation for all

      websites, as well as any origins below'
    severity: medium
- id: 2.4.1
  title: (L1) Ensure 'Password manager' is Explicitly Configured
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'Google Chrome has a built-in password manager to store passwords for users. Chrome will use local authentication
    to allow users to gain access to these passwords. The recommended state for this setting is: Explicitly set to Enabled
    (1) or Disabled (0) based on the organization''s needs. NOTE: If you choose to Enable this setting, please review Disable
    synchronization of data with Google and ensure this setting is configured to meet organizational requirements. This policy
    setting controls the WebAuthn API and its interaction with sites that have a broken TLS certificate. It can be configured
    to either: • Disabled (0): Do not allow WebAuthn API requests on sites with broken TLS certificates. • Enabled (1): Allow
    WebAuthn API requests on sites with broken TLS certificates. If the value for AllowWebAuthnWithBrokenTlsCerts is not changed
    from the default, it will behave as it is disabled.xempt.'
  rationale: The Google Chrome password manager is Enabled by default and each organization should review and determine if
    they want to allow users to store passwords in the Browser. If another solution is used instead of the built-in Chrome
    option then an organization should configure the setting to Disabled. Setting this policy will block the ability to authenticate
    to any website that does not have a valid TLS certificate since the identity of the site cannot be verified.
  impact: Organizationally dependent. There should be no user impact.
  references:
  - 1. https://chromeenterprise.google/policies/#PasswordManagerEnabled
  - 2. https://www.ncsc.gov.uk/blog-post/what-does-ncsc-think-password-managers
  - 1. https://chromeenterprise.google/policies/#AllowWebAuthnWithBrokenTlsCerts
  page_start: 33
