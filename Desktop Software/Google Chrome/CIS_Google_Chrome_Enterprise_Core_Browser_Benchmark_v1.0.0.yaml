    setting will not be respected and cookies will be stored permanently for those sites. An example of those URLs are SSO
    or intranet sites. This setting ensures that web search results with Google are performed with SafeSearch set to always
    active. Disabled means SafeSearch in Google Search is not enforced. The recommended state for this setting is: Enabled
    (1)'
