- id: 2.4.7
  title: (L1) Ensure 'Force ephemeral mode' is set to 'Do not erase local user data'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This setting controls whether user profiles are switched to ephemeral mode. In ephemeral mode, profile data
    is saved on disk for the length of the session and then the data is deleted after the session is over. Therefore, no data
    is saved to the device. The recommended state for this setting is: Do not erase local user data'
  rationale: Allowing use of ephemeral profiles allows a user to use Google Chrome with no data being logged to the system.
    Deleting browser data will delete information that may be important for a computer investigation and investigators such
    as Computer Forensics Analysts may not be able to retrieve pertinent information to the investigation.
  impact: None - This is the default behavior.
  references:
  - 1. https://chromeenterprise.google/policies/#ForceEphemeralProfiles
  page_start: 45
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under User & browser settings, select Force ephemeral mode

    6. Ensure Erase local data when the browser is closed is set to Do not

    erase local user data'
  remediation: 'To configure this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under User & browser settings, select Force ephemeral mode

    6. Set Erase local data when the browser is closed to Do not erase

    local user data

