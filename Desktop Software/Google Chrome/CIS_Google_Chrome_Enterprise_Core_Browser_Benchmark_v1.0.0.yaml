    then this setting can be used in combination with the SerialAllowAllPortsForUrls, SerialAskForUrls and SerialBlockedForUrls
    settings. For example, SerialAllowAllPortsForUrls can be used to allow serial port access to specific sites. Please see
    the references below for more information.'
