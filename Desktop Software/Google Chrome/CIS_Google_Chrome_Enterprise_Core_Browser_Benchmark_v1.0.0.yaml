- id: 2.4.9
  title: (L1) Ensure 'Geolocation' is set to 'Do not allow sites to detect users' geolocation'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'Google Chrome supports tracking a user''s physical location using GPS, data about nearby Wi-Fi access points
    or cellular signal sites/towers (even if you’re not using them), and your computer’s IP. • Disabled (0, same as 3) • Allow
    sites to track the users'' physical location (1) • Do not allow any site to track the users'' physical location (2) •
    Ask whenever a site wants to track the users'' physical location (3) The recommended state for this setting is: Enabled
    with a value Do not allow any site to track the users'' physical location (2)'
  rationale: From a privacy point of view it is not desirable to submit indicators regarding the location of the device, since
    the processing of this information cannot be determined. Furthermore, this may leak information about the network infrastructure
    around the device.
  impact: If this setting is disabled, chrome will no longer send data about nearby Wi-Fi access points or cellular signal
    sites/towers (even if you’re not using them), and your computer’s IP address to Google.
  references:
  - 1. https://chromeenterprise.google/policies/#DefaultGeolocationSetting
  - 2. https://www.w3.org/2010/api-privacy-ws/papers/privacy-ws-24.pdf
  page_start: 49
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

