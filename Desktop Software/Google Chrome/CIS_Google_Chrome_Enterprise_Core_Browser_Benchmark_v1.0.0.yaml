- id: 2.12.1
  title: (L1) Ensure no URLs Are Configured in 'Safe Browsing allowed domains'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'The setting determines the functionality of Safe Browsing. • Disabled (0): Safe Browsing protection applies
    to all resources • Enabled (1), with a list of 1 or more sites: Means Safe Browsing will trust the domains you designate.
    It won''t check them for dangerous resources such as phishing, malware, or unwanted software. The recommended state for
    this setting is: Disabled (0) NOTE: Safe Browsing''s download protection service won''t check downloads hosted on these
    domains, and its password protection service won''t check for password reuse. Google Chrome can be adjusted to allow downloads
    without Safe Browsing checks when the requested file is from a trusted source. Trusted sources can be defined using recommendation
    ''Configure the list of domains on which Safe Browsing will not trigger warnings''. The recommended state for this setting
    is: Disabled (0) NOTE: On Microsoft® Windows®, this functionality is only available on instances that are joined to a
    Microsoft® Active Directory® domain, running on Windows 10 Pro, or enrolled in Chrome Browser Cloud Management. Google
    provides the Safe Browsing service. It shows a warning page when users navigate to sites that are flagged as potentially
    malicious. Disabled (0): Users can choose to proceed to the flagged site after the warning appears. The recommended state
    for this setting is: Enabled (1)'
  rationale: Google Safe Browsing will help protect users from a variety of malicious and fraudulent sites, or from downloading
    dangerous files. Information requested from trusted sources shall not be sent to Google's safe browsing servers. Malicious
    web pages are widely spread on the internet and pose the most significant threat to the user today. Users shall be prevented
    from navigating to potentially malicious web content.
  impact: 'None - This is the default behavior. NOTE: The only real impact is possible user annoyance if they are going to
    a legitimate site that is falsely considered fraudulent (a rare occurrence). This can be handled by adding the site to
    the allowlist and/or notifying Google of the false finding. If this setting is disabled, files downloaded from intranet
    resources will not be checked by Google Services. Enabling this setting prevents users from proceeding anyway from the
    warning page to the malicious site. In some cases legitimate sites could be blocked and users would be prevented from
    accessing.'
  references:
  - 1. https://chromeenterprise.google/policies/#SafeBrowsingAllowlistDomains
  - 2. https://safebrowsing.google.com/
  - 1. https://chromeenterprise.google/policies/#SafeBrowsingForTrustedSourcesEnabl
