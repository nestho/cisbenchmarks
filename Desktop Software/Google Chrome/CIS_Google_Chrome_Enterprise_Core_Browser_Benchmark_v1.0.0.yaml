    now unpublished. The policy can be configured to either: • Enabled (0): Allow unpublished extensions • Disabled (1): Disable
    unpublished extensions If the value for ExtensionUnpublishedAvailability is not changed from the default, it will behave
    as it is enabled. Note: Off-store extensions such as unpacked extensions installed using developer mode and extensions
    installed using the command-line switch are ignored. Forceinstalled extensions that are self-hosted are ignored. All version-pinned
    extensions are also ignored.'
  rationale: Disabling unpublished extensions will remove the ability to run any extensions that are no longer being updated
