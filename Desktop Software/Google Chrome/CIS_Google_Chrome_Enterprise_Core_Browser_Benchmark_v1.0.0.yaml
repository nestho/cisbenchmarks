- id: 2.4.3
  title: (L1) Ensure 'Post-quantum TLS' Is Set to 'Allow postquantum key agreement in TLS connections'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: This configures whether Google Chrome will offer a post-quantum key agreement algorithm in TLS, using the ML-KEM
    NIST standard, and will protect user traffic from quantum computers when communicating with compatible servers. Enabling
    a postquantum key agreement is backwards compatible, so there will be no issue with existing TLS servers.
  rationale: This will protect user traffic from quantum computer decrypting.
  impact: There should be no impact on the user
