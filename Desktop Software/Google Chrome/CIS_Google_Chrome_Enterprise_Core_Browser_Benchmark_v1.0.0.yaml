- id: 2.14.3
  title: (L1) Ensure 'Relaunch notification' is set to 'Show notification recommending relaunch'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'Google Chrome can notify users that it must be restarted to apply a pending update. This setting controls
    how users are notified to relaunch Chrome browser or restart their ChromeOS device to get the latest update. The control
    can be set to one of three options: • No relaunch notification: Activates a minimal default level of notifications. Chrome
    browser indicates to users that a relaunch is needed via subtle changes to its menu. In ChromeOS, a notification in the
    system tray prompts the user to relaunch. • Show notification recommending relaunch: Users see a recurring message that
    they should relaunch Chrome browser or restart their ChromeOS device. Users can close the notification and keep using
    the old version of Chrome browser or ChromeOS until they choose to relaunch Chrome browser or restart their ChromeOS device.
    • Force relaunch after a period: Users can close the notification but will see a recurring message that they need to relaunch
    Chrome browser or restart their ChromeOS device within a certain amount of time. The recommended state for this setting
    is: Enabled with a value of Show a recurring prompt to the user indicating that a relaunch is required (2)'
  rationale: The end-user will receive a notification informing them that an update has been applied and that the browser
    must be restarted in order for the update to be completed. Once updates have been pushed by the organization it is pertinent
    that the update is applied as soon as possible. Enabling this notification will ensure that users restart their browser
    in a timely fashion.
  impact: A recurring warning will be shown to the user indicating that a browser relaunch will be forced once the notification
    period passes. The user's session is restored after the relaunch of Google Chrome.
  references:
  - 1. https://chromeenterprise.google/policies/#RelaunchNotification
