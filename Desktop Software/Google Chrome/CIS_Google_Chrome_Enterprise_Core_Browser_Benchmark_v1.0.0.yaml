  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This setting allows you to specify data types that will be limited/excluded from uploading data to the Google
    Chrome synchronization service. The recommended state for this setting is: Enabled with the following text value passwords
    (Case Sensitive) NOTE: Other settings in addition to passwords can be included based on organizational needs. This setting
    controls anonymous reporting of usage and crash-related data about Google Chrome to Google. The recommended state for
    this setting is: Disabled (0) NOTE: This setting is not available on Windows instances that are not joined to a Microsoft®
    Active Directory® domain.'
  rationale: Storing and sharing information could potentially expose sensitive information, including but not limited to
    user passwords and login information. Allowing this synchronization could also potentially allow an end user to pull corporate
    data that was synchronized into the cloud to a personal machine. Anonymous crash/usage data can be used to identify people,
    companies and information, which can be considered data ex-filtration from company systems.
  impact: Password data will not be synchronized with the Google Chrome synchronization service. If this setting is disabled,
    this information is not sent to Google.
  references:
  - 1. https://chromeenterprise.google/policies/#SyncTypesListDisabled
