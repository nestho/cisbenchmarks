controls:
- id: 2.1.1
  title: (L2) Ensure 'Browser sign in settings' is set to 'Disabled browser sign-in'
  scoring: scored
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'Google Chrome offers to sign in with your Google account and use account-related services like Chrome sync.
    It is possible to sign in to Google Chrome with a Google account to use services like synchronization, and can also be
    used for configuration and management of the browser. • Disable browser sign-in (0) • Enable browser sign-in (1) • Force
    users to sign-in to use the browser (2) The recommended state for this setting is: Enabled with a value of Disable browser
    sign-in (0) NOTE: If an organization is a Google Workspace Enterprise customer, they will want to leave this setting enabled
    so that users can sign in with Google accounts.'
  rationale: Since external accounts are unmanaged and potentially used to access several private computer systems and many
    different websites, connecting accounts via sign-in poses a security risk for the company. It interferes with the corporate
    management mechanisms, as well as permits an unwanted leak of corporate information and possible mixture with private,
    non-company data.
  impact: If this setting is configured, the user cannot sign in to the browser and use Google account-based services like
    Chrome sync.
  references:
  - 1. https://chromeenterprise.google/policies/#BrowserSignin
  page_start: 22
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under User & browser settings, select Browser sign in settings

    6. Ensure Configuration is set to Disabled browser sign-in'
  remediation: 'To configure this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under User & browser settings, select Browser sign in settings

    6. Set Configuration to Disabled browser sign-in

    7. Select Save'
  checks:
  - type: manual_review
    info: 'To verify this setting via the Google Workspace Admin Console:

      1. Log in to https://admin.google.com as an administrator

      2. Select Devices

      3. Select Chrome

      4. Select Settings

      5. Under User & browser settings, select Browser sign in settings

      6. Ensure Configuration is set to Disabled browser sign-in'
    severity: medium
- id: 2.1.2
  title: (L1) Ensure 'Azure Cloud Authentication' Is Set to 'Enable Azure cloud authentication'
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'This policy setting allows accounts backed by a Microsoft® cloud identity provider (i.e., Microsoft Azure
    Active Directory or the consumer Microsoft account identity provider) to be signed into web properties using that identity
    automatically. It can be configured to either: • Disabled (0): Disable Microsoft® cloud authentication • Enabled (1):
    Enable Microsoft® cloud authentication If the value for CloudAPAuthEnabled is not changed from the default, it will behave
    as if it is disabled. This policy setting controls extension management settings for Google Chrome, specifically v2 extensions.
    This policy setting is being sunsetted as Google develops the Manifest v3, but that rollout is currently postponed. The
    policy can be configured to: • Default (0): Default browser behavior • Disabled (1): Manifest v2 is disabled • Enabled
    (2): Manifest v2 is enabled • Forced Only (3): Manifest v2 is enabled for forced extensions only'
  rationale: Enabling this policy setting allows users to use Microsoft Cloud Authentication for any site that requires CA
    (Cloud Authentication) and does not require an extension. Setting this to Forced Only will not allow users to install
    any additional v2 extensions, and all existing, non-forced, v2 extensions will be disabled.
  impact: There should be no impact to the user. Users that use extensions regularly will have a set of them blocked, which
    will change their user experience.
  references:
  - 1. https://chromeenterprise.google/policies/#CloudAPAuthEnabled
  - 1. https://chromeenterprise.google/policies/#ExtensionManifestV2Availability
  page_start: 24
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

