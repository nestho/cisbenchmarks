- id: 2.4.6
  title: (L1) Ensure 'Clear browser history' Is Set to 'Do not allow clearing history in settings menu'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'Google Chrome can delete the browser and download history using the clear browsing data menu. The recommended
    state for this setting is: Disabled (0) NOTE: Even when this setting is disabled, the browsing and download history aren''t
    guaranteed to be retained. Users can edit or delete the history database files directly, and the browser itself may remove
    (based on expiration period) or archive any or all history items at any time'
  rationale: If users can delete websites they have visited or files they have downloaded it will be easier for them to hide
    evidence that they have visited unauthorized or malicious sites.
  impact: If this setting is disabled, browsing and download history cannot be deleted by using the clear browsing data menu.
  references:
  - 1. https://chromeenterprise.google/policies/#AllowDeletingBrowserHistory
  page_start: 43
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

