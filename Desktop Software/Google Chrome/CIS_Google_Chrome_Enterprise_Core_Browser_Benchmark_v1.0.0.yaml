  title: (L2) Ensure 'Notifications' is set to 'Do not allow any site to show desktop notifications'
  scoring: scored
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'Google Chrome offers websites the ability to display desktop notifications. These are push messages which
    are sent from the website operator through Google infrastructure to Chrome. • Allow sites to show desktop notifications
    (1) • Do not allow any site to show desktop notifications (2) • Ask every time a site wants to show desktop notifications
    (3) The recommended state for this setting is: Enabled with a value of Do not allow any site to show desktop notifications
    (2) Google Chrome has an API which allows access to connected USB devices from the browser • Do not allow any site to
    request access to USB devices via the WebUSB API (2) • Allow sites to ask the user to grant access to a connected USB
    device (3) The recommended state for this setting is: Enabled with a value of Do not allow any site to request access
    to USB devices via the WebUSB API (2)'
  rationale: If the website operator decides to send messages unencrypted, Google's servers may process it as plain text.
    Furthermore, potentially compromised or faked notifications might trick users into clicking on a malicious link. WebUSB
    is opening the doors for sophisticated phishing attacks that could bypass hardware-based two-factor authentication devices
    (e.g. Yubikey devices).
  impact: If this setting is enabled and set to Do not allow any site to show desktop notifications, notifications will not
    be displayed for any sites and the user will not be asked. If this setting is configured, websites can no longer access
    connected USB devices via the API (this includes web cameras, headphones, and other USB devices) which could also prevent
    some two factor authentication (2FA) USB devices from working properly.
  references:
