    being installed. App or extension types that could be misused or are deprecated shall no longer be installed. NOTE: Google
    has removed support for Chrome Apps which includes the types hosted_app and platform_app. The blog post indicates that
    these types will require a setting to be enabled for continued use through June 2022.'
