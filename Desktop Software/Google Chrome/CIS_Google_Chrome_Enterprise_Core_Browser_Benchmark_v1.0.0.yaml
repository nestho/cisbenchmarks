  title: (L1) Ensure 'Allow third-party partitioning to be enabled' in 'Third-party storage partitioning' Is Configured
  scoring: manual
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'This setting will block specific sites your organization selects from accessing the storage session from any
    other site. This will allow an organization to block third party trackers that are embedded on multiple sites from tracking
    a user across the sites they visit. It will also allow blocking third party access to the user agent and to infer data
    about the user from the data from another site. Setting the Level 2 recommendation Block third-party storage partitioning
    from being enabled will remove any sites listed in Allow third-party partitioning to be enabled and block all sites. This
    setting will block any site from accessing the storage session from any other site. This will block third party trackers
    that are embedded on multiple sites from tracking a user across the sites they visit. Blocking third party access to the
    user agent will not allow sites to infer data about the user from the data from another site. It can be configured to
    either: • Enabled (1): Allow third-party storage partitioning to be enabled. • Disabled (2): Block third-party storage
    partitioning from being enabled. Google Chrome has an API which allows the access to nearby Bluetooth devices from the
    browser with users consent. • Do not allow any site to request access to Bluetooth devices via the Web Bluetooth API (2)
    • Allow sites to ask the user to grant access to a nearby Bluetooth device (3) The recommended state for this setting
    is: Enabled with a value of Do not allow any site to request access to Bluetooth devices via the Web Bluetooth API (2)'
  rationale: If your organization does not want to block all third-party sites from accessing the user agent, you can configure
    a curated list of sites to block. Setting this requires that user agent state needs to be keyed by more than a single
    origin or site. It can also defend against timing attacks on web privacy. A malicious website could exploit a vulnerable
    Bluetooth device.
  impact: This might cause the user experience to vary from allowed sites to blocked sites. Enforcing this may cause users
    to experience issues with sites they regularly visit that already grant access to third-parties. If this setting is configured,
    websites can no longer access nearby Bluetooth devices via the API (this includes web cameras, headphones, and other Bluetooth
    devices) and the user will never be asked.
