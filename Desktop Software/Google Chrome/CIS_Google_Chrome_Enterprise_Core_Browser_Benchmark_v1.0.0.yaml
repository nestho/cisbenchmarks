- id: 3.1.3
  title: (L1) Ensure 'App and extension install sources' Is Not Set
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'Enabling this setting allows you to specify which extensions the users can NOT install. Extensions already
    installed will be removed if blocklisted. Disabled (0): then the user can install any extension in Google Chrome. The
    recommended state for this setting is: Enabled with a value of * NOTE: Chrome does offer a more granular permission-based
    configuration called Extension management settings if blocklisting all extensions is too aggressive, which allows an organization
    to drill down to the exact permissions that they want to lock down. The extensions management settings require more coordination
    and effort to understand what the security requirements are to block site and device permissions globally as well as more
    IT management to deploy. The benefit would be allowing access to more extensions to their end-users. See link in reference
    section NOTE: If Chrome Cleanup is Disabled, users may want to configure the extension blocklist instead of using the
    Extension Management option. Chrome Cleanup can help protect against malicious extensions when paired with the Extension
    Management setting.'
  rationale: This can be used to block extensions that could potentially allow remote control of the system through the browser.
    If there are extensions needed for securing the browser or for enterprise use, these can be enabled by configuring either
    the setting Configure extension installation allowlist or the setting Extension management settings.
  impact: Any installed extension will be removed unless it is specified on the extension allowlist. If an organization is
    using any approved password managers, ensure that the extension is added to the allowlist.
  references:
  - 1. https://chromeenterprise.google/policies/#ExtensionInstallBlocklist
  page_start: 263
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Apps & extensions

    5. Under User & browser settings, select Additional Settings

    6. Ensure App and extension install sources is empty'
  remediation: 'To configure this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Apps & extensions

    5. Under User & browser settings, select Additional Settings

    6. Remove all URLs from App and extension install sources

