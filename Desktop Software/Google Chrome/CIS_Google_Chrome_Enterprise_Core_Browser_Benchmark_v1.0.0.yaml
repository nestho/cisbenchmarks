    list. • Enabled (1): With the exception of URLs set in the VideoCaptureAllowedUrls list, users get prompted for video
    capture access. NOTE: The setting affects all video input (not just the built-in camera). The recommended state for this
    setting is: Disabled (0)'
  rationale: The end-user having the ability to allow or deny video capture for websites in Google Chrome could open an organization
    up to a malicious site that may capture proprietary information through the browser. By limiting or disallowing video
    capture, it removes the end-user's discretion, leaving it up to the organization which sites are allowed to use this ability.
  impact: If you disable this setting, users will not be prompted for video devices when using websites which may need this
    access, such as a web-based conferencing system. If there are sites which access will be allowed, configuration of the
    VideoCaptureAllowedUrls setting will be necessary.
