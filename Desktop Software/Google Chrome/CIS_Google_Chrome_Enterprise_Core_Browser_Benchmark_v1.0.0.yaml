  title: (L1) Ensure 'Online revocation checks' is set to 'Perform online OCSP/CRL checks'
  scoring: scored
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'Google Chrome performs revocation checking for server certificates that successfully validate and are signed
    by locally-installed CA certificates. If Google Chrome is unable to obtain revocation status information, such certificates
    will be treated as revoked (''hard-fail''). Disabled: Google Chrome uses existing online revocation-checking settings.
    The recommended state for this setting is: Enabled (1)'
  rationale: Certificates shall always be validated.
  impact: A revocation check will be performed for server certificates that successfully validate and are signed by locally-installed
    CA certificates. if the OCSP server goes down, then this will hard-fail and prevent browsing to those sites.
  references:
  - 1. https://chromeenterprise.google/policies/#RequireOnlineRevocationChecksForLo
  page_start: 47
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under User & browser settings, select Online revocation checks

    6. Ensure Configuration is set to Perform online OCSP/CRL checks'
