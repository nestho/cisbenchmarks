- id: 2.4.4
  title: (L1) Ensure 'Incognito mode' is set to 'Disallow incognito mode'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'Specifies whether the user may open pages in Incognito mode in Google Chrome. The possible values are: • Incognito
    mode available (0 - Same as Disabled)) • Incognito mode disabled (1) • Incognito mode forced (2) The recommended state
    for this setting is: Enabled: Incognito mode disabled (1)'
  rationale: Incognito mode in Chrome gives you the choice to browse the internet without your activity being saved to your
    browser or device. Allowing users to use the browser without any information being saved can hide evidence of malicious
    behaviors. This information may be important for a computer investigation, and investigators such as Computer Forensics
    Analysts may not be able to retrieve pertinent information to the investigation.
  impact: Users will not be able to initiate Incognito mode for Google Chrome.
  references:
  - 1. https://chromeenterprise.google/policies/#IncognitoModeAvailability
  page_start: 39
  audit_raw: 'To verify this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under User & browser settings, select Incognito mode

    6. Ensure Configuration is set to Disallow incognito mode'
  remediation: 'To configure this setting via the Google Workspace Admin Console:

    1. Log in to https://admin.google.com as an administrator

    2. Select Devices

    3. Select Chrome

    4. Select Settings

    5. Under User & browser settings, select Incognito mode

    6. Set Configuration to Disallow incognito mode

    7. Select Save'
  checks:
  - type: manual_review
    info: 'To verify this setting via the Google Workspace Admin Console:

      1. Log in to https://admin.google.com as an administrator

      2. Select Devices

      3. Select Chrome

      4. Select Settings

      5. Under User & browser settings, select Incognito mode

      6. Ensure Configuration is set to Disallow incognito mode'
    severity: medium
