- id: 1.4.1
  title: (L2) Ensure 'Default cookies setting' is set to 'Enabled' (Keep cookies for the duration of the session)
  scoring: scored
  profile:
  - Level 2
  - Level 1
  description: Allows you to set whether websites are allowed to set local data. Setting local data can be either allowed
    for all websites or denied for all websites. Allows you to set whether websites are allowed to automatically run plugins.
    Automatically running plugins can be either allowed for all websites or denied for all websites.
  rationale: If this policy is left not set, 'AllowCookies' will be used and the user will be able to change it. Malicious
    plugins can cause browser instability and erratic behavior so setting the value to click to play will allow a user to
    only run necessary plugins.
  impact: If this setting is enabled, cookies will be cleared when the session closes. If this setting is enabled, users must
    click plugins to allow their execution
