- id: 1.1.10
  title: (L1) Ensure 'Import saved passwords from default browser on first run' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: This setting controls if saved passwords from the default browser can be imported.
  rationale: In Chrome, passwords can be stored in plain-text and revealed by clicking the “show” button next to the password
    field by going to chrome://settings/passwords/.
  impact: If this setting is disabled, saved passwords from other browsers are not imported.
  references: []
