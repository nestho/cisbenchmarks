- id: 1.1.11
  title: (L1) Ensure 'Specify whether the plugin finder should be disabled' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: Chrome allows for the automatic search and installation of missing plugins. Disabling this feature will stop
    plugins from being downloaded and installed without the user's consent or knowledge.
  rationale: Disabling the feature that allows plugins to automatically be installed prevents plugins that may have vulnerabilities
    or be against company policy from being introduced to the computer without anyone’s knowledge.
  impact: If this settings is enabled, the automatic search and installation of missing plugins will be disabled in Google
    Chrome.
  references: []
  page_start: 25
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

