- id: 1.11.1
  title: (L1) Ensure 'Enable the password manager' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Chrome will memorize passwords and automatically provide them when a user logs into a site. By disabling this
    feature the user will be prompted to enter their password each time they visit a website.
  rationale: 'If this setting is enabled, users can have Google Chrome memorize passwords and provide them automatically the
    next time they log in to a site. An intruder who has unrestricted access to your computer for even a minute can view and
    copy all of your saved passwords just by visiting an easy-to-remember settings page: chrome://settings/passwords.'
  impact: If this setting is disable, users are not able to save passwords or use previously saved passwords. 43 | P a g e
  references: []
