      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostAllowClientPairing'
    severity: medium
- id: 1.3.4
  title: (L1) Ensure 'Enable curtaining of remote access hosts' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'Chrome allows the user to disable a remote user''s physical input and output while the remote connection is
    in progress. The recommended state for this setting is: Enabled'
  rationale: If this setting is disabled or not set, then both local and remote users can interact with the host when it is
    being shared.
  impact: If this setting is enabled, then hosts' physical input and output devices are disabled while a remote connection
    is in progress.
  references: []
  page_start: 31
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostRequireCurtain'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path

    to Enabled.

    Computer Configuration\Administrative Templates\Classic Administative Templates

    (ADM)\Google\Google Chrome\Configure remote access options\Enable curtaining of remote

    access hosts'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

