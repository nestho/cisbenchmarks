      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostRequireCurtain'
    severity: medium
- id: 1.4.1
  title: (L2) Ensure 'Default cookies setting' is set to 'Enabled (Keep cookies for the duration of the session)'
  scoring: scored
  profile:
  - Level 2
  description: 'Allows you to set whether websites are allowed to set local data. Setting local data can be either allowed
    for all websites or denied for all websites. The recommended state for this setting is: Enabled (Keep cookies for the
    duration of the session)'
  rationale: If this policy is left not set, 'AllowCookies' will be used and the user will be able to change it.
  impact: If this policy is set to 'Keep cookies for the duration of the session' then cookies will be cleared when the session
    closes.
  references: []
  page_start: 32
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:DefaultCookiesSetting'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path

    to Enabled.

    Computer Configuration\Administrative Templates\Classic Administrative Template

    (ADM)\Google\Google Chrome\Content Settings\Default cookies setting'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:DefaultCookiesSetting'
    severity: medium
- id: 1.4.2
  title: (L1) Ensure 'Default Plugin Setting' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'Allows you to set whether websites are allowed to automatically run plugins. Automatically running plugins
    can be either allowed for all websites or denied for all websites. The recommended state for this setting is: Enabled'
  rationale: Malicious plugins can cause browser instability and erratic behavior so setting the value to click to play will
    allow a user to only run necessary plugins.
  impact: Click to play allows plugins to run but the user must click them to start their execution.
  references: []
  page_start: 33
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:DefaultPluginsSetting'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path

    to Enabled.

    Computer Configuration\Administrative Templates\Classic Administrative Template

    (ADM)\Google\Google Chrome\Content Settings\Default Plugins Setting'
