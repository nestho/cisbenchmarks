controls:
- id: 1.1.1
  title: Set 'Allow invocation of file selection dialogs' to Enabled
  scoring: scored
  profile:
  - Level 1
  description: Chrome allows users to access files located on the local machine. By enabling this setting the user is prompted
    with a dialog box before the local file is accessed.
  rationale: Prompting a dialog box before local file access prevents malicious links or websites from accessing local files
    without the user first consenting.
  impact: If you enable this setting, users can open file selection dialogs as normal.
  references: []
  page_start: 11
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:AllowFileSelectionDialogs'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Enabled.

    Computer Configuration\Administrative Templates\Classic Administrative Template

    (ADM)\Google\Google Chrome\Allow invocation of file selection dialogs'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:AllowFileSelectionDialogs'
    severity: medium
- id: 1.1.2
  title: Set 'Enable alternate error pages' to Disabled
  scoring: scored
  profile:
  - Level 1
  description: Chrome enables the user to change the error pages that are built into Google Chrome. By disabling this feature
    the user is not able to change the error page to an alternate one.
  rationale: Alternate error pages can be used to redirect users to custom websites that contain malicious links.
  impact: If you disable this setting, alternate error pages are never used.
  references: []
  page_start: 11
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:AlternateErrorPagesEnabled'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Classic Administrative Template

    (ADM)\Google\Google Chrome\Enable alternate error pages'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:AlternateErrorPagesEnabled'
    severity: medium
- id: 1.1.3
  title: Set 'Enable AutoFill' to Disabled
  scoring: scored
  profile:
  - Level 1
  description: Chrome allows users to auto-complete web forms with saved information such as address, phone number and credit
    card numbers. Disabling this feature will prompt a user to enter all information manually. 12 | P a g e
  rationale: If an attacker gains access to a users machine where the user has stored auto save data, information could be
    harvested or used to gain access to more systems.
  impact: If you disable this setting, AutoFill will be inaccessible to users.
  references: []
  page_start: 12
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:AutoFillEnabled'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Classic Administrative Template

    (ADM)\Google\Google Chrome\Enable AutoFill'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:AutoFillEnabled'
    severity: medium
- id: 1.1.4
  title: Set 'Continue running background apps when Google Chrome is closed' to Disabled
  scoring: scored
  profile:
  - Level 1
  description: Chrome allows for processes started while the browser is open to remain running once the browser has been closed.
    It also allows for background apps and the current browsing session to remain active after the browser has been closed.
    Disabling this feature will stop all processes and background applications when the browser window is closed.
  rationale: If this setting is enabled, vulnerable or malicious plugins, apps and processes can continue running even after
    Chrome has closed. 13 | P a g e
  impact: If this policy is set to Disabled, background mode is disabled and cannot be controlled by the user in the browser
    settings.
  references: []
  page_start: 13
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:BackgroundModeEnabled'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Classic Administrative Template

    (ADM)\Google\Google Chrome\Continue running background apps when Google Chrome is

    closed'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:BackgroundModeEnabled'
    severity: medium
- id: 1.1.5
  title: Set 'Block third party cookies' to Enabled
  scoring: scored
  profile:
  - Level 1
  description: Chrome allows cookies to be set by web page elements that are not from the domain in the user's address bar.
    Enabling this feature prevents the cookies from being set.
  rationale: Blocking third party cookies can help protect a users privacy by eliminating a number of website tracking cookies.
  impact: Enabling this setting prevents cookies from being set by web page elements that are not from the domain that is
    in the browser's address bar.
  references: []
  page_start: 14
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:BlockThirdPartyCookies'
  remediation: '14 | P a g e

    To establish the recommended configuration via Group Policy, set the following UI path to

    Enabled.

    Computer Configuration\Administrative Templates\Classic Administrative Template

    (ADM)\Google\Google Chrome\Block third party cookies'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:BlockThirdPartyCookies'
    severity: medium
- id: 1.1.6
  title: Set 'Allow running plugins that are outdated' to Disabled
  scoring: scored
  profile:
  - Level 1
  description: Chrome enables the use of outdated plugins. By disabling this feature Chrome will not prompt the user to use
    an outdated plugin.
  rationale: Running the most up-to-date version of a plugin can reduce the possibility of running a plugin that contains
    an exploit or security hole.
  impact: If you disable this setting, outdated plugins will not be used and users will not be asked for permission to run
    them.
  references: []
  page_start: 15
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:AllowOutdatedPlugins'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Classic Administrative Template

    (ADM)\Google\Google Chrome\Allow running plugins that are outdated

    15 | P a g e'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:AllowOutdatedPlugins'
    severity: medium
- id: 1.1.7
  title: Set 'Always runs plugins that require authorization' to Disabled
  scoring: scored
  profile:
  - Level 1
  description: Chrome allows plugins that are not outdated to run automatically. Disabling this setting allows the plugins
    to run only when permission is granted by the user.
  rationale: Disabling plugins from automatically running can prevent unwanted and/or harmful plugins from running without
    the user’s consent, preventing unauthorized data/remote access.
  impact: If this setting is disabled or not set, users will be asked for permission to run plugins that require authorization.
    These are plugins that can compromise security. 16 | P a g e
  references: []
  page_start: 16
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:AlwaysAuthorizePlugins'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Classic Administrative Template

    (ADM)\Google\Google Chrome\Always runs plugins that require authorization'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:AlwaysAuthorizePlugins'
    severity: medium
- id: 1.1.8
  title: Set 'Specify whether the plugin finder should be disabled' to Enabled
  scoring: scored
  profile:
  - Level 1
  description: Chrome allows for the automatic search and installation of missing plugins. Disabling this feature will stop
    plugins from being downloaded and installed without the users knowledge.
  rationale: Disabling the feature that allows plugins to automatically be installed prevents plugins that may have vulnerabilities
    or be against company policy from being introduced to the computer without anyone’s knowledge.
  impact: If you set this setting to enabled the automatic search and installation of missing plugins will be disabled in
    Google Chrome.
  references: []
  page_start: 17
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:DisablePluginFinder'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Enabled.

    Computer Configuration\Administrative Templates\Classic Administrative Template

    (ADM)\Google\Google Chrome\Specify whether the plugin finder should be disabled'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:DisablePluginFinder'
    severity: medium
- id: 1.1.9
  title: Set 'Enable Google Cloud Print Proxy' to Disabled
  scoring: scored
  profile:
  - Level 1
  description: This setting enables Google Chrome to act as a proxy between Google Cloud Print and legacy printers connected
    to the machine.
  rationale: Disabling this option will prevent users from printing possible confidential enterprise documents through the
    cloud.
  impact: If this setting is disabled, users cannot enable the proxy, and the machine will not be allowed to share its printers
    with Google Cloud Print.
  references: []
  page_start: 18
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:CloudPrintProxyEnabled'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Classic Administrative Template

    (ADM)\Google\Google Chrome\Enable Google Cloud Print Proxy'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:CloudPrintProxyEnabled'
    severity: medium
- id: 1.1.10
  title: Set 'Enable submission of documents to Google Cloud print' to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'This setting enables Google Chrome to submit documents to Google Cloud Print for printing. NOTE: This only
    affects Google Cloud Print support in Google Chrome. It does not prevent users from submitting print jobs on web sites.'
  rationale: Disabling this option will prevent users from printing possible confidential enterprise documents through the
    cloud.
  impact: If this setting is disabled, users cannot print to Google Cloud Print from the Chromium print dialog
  references: []
  page_start: 18
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:CloudPrintSubmitEnabled'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Classic Administrative Template

    (ADM)\Google\Google Chrome\Enable submission of documents to Google Cloud print'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:CloudPrintSubmitEnabled'
    severity: medium
- id: 1.1.11
  title: Set 'Specify a list of Disabled Plugins' to Enabled
  scoring: scored
  profile:
  - Level 1
  description: '19 | P a g e This setting specifies a list of plugins that are disabled in Google Chrome and prevents users
    from changing this setting. The Recommended state is to block all plugins except what is listed in the enabled plugins
    list. It is up to each organization to determine which plugins they want to add to the enabled plugins list. Note: this
    policy can be overridden by EnabledPlugins and DisabledPluginsExceptions settings.'
  rationale: Disabling all plugins will help prevent the installation of applications like Remote Desktop and other tools
    that could all remote access to the machine.
  impact: If you enable this setting, the specified list of plugins is never used in Google Chrome. The plugins are marked
    as disabled in 'about:plugins' and users cannot enable them.
  references: []
  page_start: 19
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:DisabledPlugins'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Enabled.

    Computer Configuration\Administrative Templates\Classic Administrative Template

    (ADM)\Google\Google Chrome\Specify a list of Disabled Plugins'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:DisabledPlugins'
    severity: medium
- id: 1.1.12
  title: Set 'Import saved passwords from default browser on first run' to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 20 | P a g e This setting controls if saved passwords from the default browser can be imported.
  rationale: In Chrome, passwords can be stored in plain-text and revealed by clicking the “show” button next to the password
    field by going to chrome://settings/passwords/. If this setting is enabled, an attacker with access to a user’s machine
    with passwords stored that have been imported from another browser, credentials can be viewed in clear text and used to
    gain additional access.
  impact: If disabled, the saved passwords are not imported.
  references: []
  page_start: 20
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:ImportSavedPasswords'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Classic Administrative Template

    (ADM)\Google\Google Chrome\Import saved passwords from default browser on first run'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:ImportSavedPasswords'
    severity: medium
- id: 1.1.13
  title: Set 'Enable reporting of usage and crash-related data' to Disabled
  scoring: scored
  profile:
  - Level 1
  description: This Setting controls anonymous reporting of usage and crash-related data about Google Chrome to Google. 21
    | P a g e
  rationale: Anonymous crash/usage data can be used to identify people, companies and information, and can be considered data
    exfiltration from company systems.
  impact: If it is disabled, this information is not sent to Google.
  references: []
  page_start: 21
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:MetricsReportingEnabled'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Classic Administrative Template

    (ADM)\Google\Google Chrome\Enable reporting of usage and crash-related data'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:MetricsReportingEnabled'
    severity: medium
- id: 1.3.1
  title: Set 'Enable firewall traversal from remote access host' to Disabled
  scoring: scored
  profile:
  - Level 1
  description: Chrome enables the usage of STUN servers which allows remote clients to discover and connect to a machine even
    if they are separated by a firewall. By disabling this feature, in conjunction with filtering outgoing UDP connections,
    the machine will only allow connections from machines within the local network.
  rationale: If this setting is enabled, then remote clients can discover and connect to this machines even if they are separated
    by a firewall.
  impact: If this setting is disabled and outgoing UDP connections are filtered by the firewall, then this machine will only
    allow connections from client machines within the local network.
  references: []
  page_start: 23
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostFirewallTraversal'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Classic Administrative Template

    (ADM)\Google\Google Chrome\Configure remote access options\Enable firewall traversal

    from remote access host'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostFirewallTraversal'
    severity: medium
- id: 1.3.2
  title: Set 'Configure the required domain name for remote access hosts' to Enabled
  scoring: scored
  profile:
  - Level 1
  description: Chrome allows the user to configure a required host domain that is imposed on remote access hosts. When enabled,
    hosts can only be shared using accounts that are registered to the specified domain.
  rationale: If this setting is disabled or not set, then hosts can be shared using any account.
  impact: If this setting is enabled, then hosts can be shared only using accounts registered on the specified domain name.
  references: []
  page_start: 24
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostDomain'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Enabled and enter domain.

    Computer Configuration\Administrative Templates\Classic Administative Templates

    (ADM)\Google\Google Chrome\Configure remote access options\Configure the required

    domain name for remote access hosts'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostDomain'
    severity: medium
- id: 1.3.3
  title: Set 'Enable or disable PIN-less authentication' to Disabled
  scoring: scored
  profile:
  - Level 1
  description: Chrome enables a user to opt-out of using user-specified PIN authentication and instead pair clients and hosts
    during connection time.
  rationale: If this setting is enabled or not configured, then users can opt to pair clients and hosts at connection time,
    eliminating the need to enter a PIN every time.
  impact: If this setting is disabled, then this feature will not be available.
  references: []
  page_start: 24
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostAllowClientPairing'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Classic Administative Templates

    (ADM)\Google\Google Chrome\Configure remote access options\Enable or disable PIN-less

    authentication'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostAllowClientPairing'
    severity: medium
- id: 1.3.4
  title: Set 'Enable curtaining of remote access hosts' to Enabled
  scoring: scored
  profile:
  - Level 1
  description: Chrome allows the user to disable a remote user's physical input and output while the remote connection is
    in progress. 25 | P a g e
  rationale: If this setting is disabled or not set, then both local and remote users can interact with the host when it is
    being shared.
  impact: If this setting is enabled, then hosts' physical input and output devices are disabled while a remote connection
    is in progress.
  references: []
