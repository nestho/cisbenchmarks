- id: 1.7.1
  title: Set 'Configure Extension Installation Blacklist' to Enabled ("*" for all extensions)
  scoring: scored
  profile:
  - Level 1
  description: 'Enabling this setting allows you to specify which extensions the users can NOT install. Extensions already
    installed will be removed if blacklisted. The recommendation is: Enabled with a value of * (for all extensions)'
  rationale: This will block any extension that could allow remote control of the system through the browser. If there are
    extensions needed for securing the browser or for enterprise use these can be enabled by configuring the extension whitelist.
  impact: Any installed extension will be removed unless it is specified on the extension whitelist.
  references: []
  page_start: 30
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ExtensionInstallBlacklist\1'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

