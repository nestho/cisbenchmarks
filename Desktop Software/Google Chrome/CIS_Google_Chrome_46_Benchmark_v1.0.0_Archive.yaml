- id: 1.4.2
  title: Set 'Default Plugin Setting' to Enable
  scoring: scored
  profile:
  - Level 1
  description: Allows you to set whether websites are allowed to automatically run plugins. Automatically running plugins
    can be either allowed for all websites or denied for all websites.
  rationale: Malicious plugins can cause browser instability and erratic behavior so setting the value to click to play will
    allow a user to only run necessary plugins.
  impact: Click to play allows plugins to run but the user must click them to start their execution.
  references: []
  page_start: 27
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

