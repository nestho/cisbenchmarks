controls:
- id: 1.1.1.1
  title: (L1) Ensure 'Configure the required domain names for remote access hosts' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: Chrome allows the user to configure a required host domain that is imposed on remote access hosts. When enabled,
    hosts can only be shared using accounts that are registered to the specified domain.
  rationale: If this setting is disabled or not set, then hosts can be shared using any account.
  impact: If this setting is enabled, hosts can be shared only using accounts registered on the specified domain name.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#RemoteAccessHostClientDomain
  page_start: 10
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\RemoteAccessHostDomainList

    :1

    10 | P a g e'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Enabled and enter domain.

    Computer Configuration\Administrative Templates\Google\Google

    Chrome\Configure remote access options\Configure the required domain names

    for remote access hosts'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\RemoteAccessHostDomainList

      :1

      10 | P a g e'
    severity: medium
- id: 1.1.1.2
  title: (L1) Ensure 'Enable curtaining of remote access hosts' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: Chrome allows the user to disable a remote user's physical input and output while the remote connection is
    in progress.
  rationale: If this setting is disabled or not set, then both local and remote users can interact with the host when it is
    being shared.
  impact: If this setting is enabled, host's physical input and output devices are disabled while a remote connection is in
    progress.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#RemoteAccessHostRequireCurtain
  page_start: 12
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostRequireCur

    tain'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Enabled.

    Computer Configuration\Administrative Templates\Google\Google

    Chrome\Configure remote access options\Enable curtaining of remote access

    hosts'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostRequireCur

      tain'
    severity: medium
- id: 1.1.1.3
  title: (L1) Ensure 'Enable firewall traversal from remote access host' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Chrome enables the usage of STUN servers which allows remote clients to discover and connect to a machine even
    if they are separated by a firewall. By disabling this feature, in conjunction with filtering outgoing UDP connections,
    the machine will only allow connections from machines within the local network.
  rationale: If this setting is enabled, remote clients can discover and connect to this machines even if they are separated
    by a firewall.
  impact: If this setting is disabled and outgoing UDP connections are filtered by the firewall, this machine will only allow
    connections from client machines within the local network.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#RemoteAccessHostFirewallTraversal
  page_start: 14
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostFirewallTr

    aversal'
  remediation: "To establish the recommended configuration via Group Policy, set the following UI path to\nDisabled.\n Computer\
    \ Configuration\\Administrative Templates\\Google\\Google\nChrome\\Configure remote access options\\Enable firewall traversal\
    \ from remote\naccess host"
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostFirewallTr

      aversal'
    severity: medium
- id: 1.1.1.4
  title: (L1) Ensure 'Enable or disable PIN-less authentication for remote access hosts' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Chrome enables a user to opt-out of using user-specified PIN authentication and instead pair clients and hosts
    during connection time.
  rationale: If this setting is enabled or not configured, users can opt to pair clients and hosts at connection time, eliminating
    the need to enter a PIN every time.
  impact: If this setting is disabled, users will be required to enter PIN every time.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#RemoteAccessHostAllowClientPairing
  page_start: 16
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostAllowClien

    tPairing'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Google\Google

    Chrome\Configure remote access options\Enable or disable PIN-less

    authentication'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:RemoteAccessHostAllowClien

      tPairing'
    severity: medium
- id: 1.1.2.1
  title: (L2) Ensure 'Default cookies setting' is set to 'Enabled' (Keep cookies for the duration of the session)
  scoring: scored
  profile:
  - Level 2
  description: Allows you to set whether websites are allowed to set local data. Setting local data can be either allowed
    for all websites or denied for all websites.
  rationale: If this policy is left not set, AllowCookies will be used and the user will be able to change it.
  impact: If this setting is enabled, cookies will be cleared when the session closes.
  references:
  - 1. https://www.chromium.org/administrators/policy-list-3#DefaultCookiesSetting
  page_start: 18
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:DefaultCookiesSetting'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Enabled.

    Computer Configuration\Administrative Templates\Google\Google Chrome\Content

    Settings\Default cookies setting'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:DefaultCookiesSetting'
    severity: medium
- id: 1.1.2.2
  title: (L1) Ensure 'Default Flash Setting' is set to 'Enabled' (Click to Play)
  scoring: scored
  profile:
  - Level 1
  description: Allows you to set whether websites are allowed to automatically run plugins. Automatically running plugins
    can be either allowed for all websites or denied for all websites.
  rationale: Malicious plugins can cause browser instability and erratic behavior so setting the value to click to play will
    allow a user to only run necessary plugins.
  impact: If this setting is enabled, users must click plugins to allow their execution
  references:
  - 1. https://www.chromium.org/administrators/policy-list-3#DefaultPluginsSetting
  page_start: 20
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:DefaultPluginsSetting'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Enabled with click to play selected from the drop down.

    Computer Configuration\Administrative Templates\Google\Google Chrome\Content

    Settings\Default Flash Setting'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:DefaultPluginsSetting'
    severity: medium
- id: 1.1.4.1
  title: (L1) Ensure 'Configure extension installation blacklist' is set to 'Enabled' ("*" for all extensions)
  scoring: scored
  profile:
  - Level 1
  description: Enabling this setting allows you to specify which extensions the users can NOT install. Extensions already
    installed will be removed if blacklisted.
  rationale: This can be used to block extensions that could potentially allow remote control of the system through the browser.
    If there are extensions needed for securing the browser or for enterprise use these can be enabled by configuring the
    extension whitelist.
  impact: Any installed extension will be removed unless it is specified on the extension whitelist.
  references:
  - 1. https://www.chromium.org/administrators/policy-list-3#ExtensionInstallBlacklist
  page_start: 22
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ExtensionInstallBlacklist:

    1'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Enabled.

    Computer Configuration\Administrative Templates\Google\Google

    Chrome\Extensions\Configure Extension Installation Blacklist

    22 | P a g e'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\ExtensionInstallBlacklist:

      1'
    severity: medium
- id: 1.1.8.1
  title: (L1) Ensure `Configure native messaging blacklist` is set to 'Enabled' ("*" for all messaging applications)
  scoring: scored
  profile:
  - Level 1
  description: 'Allows you to specify which native messaging hosts that should not be loaded. NOTE: A blacklist value of ''*''
    means all native messaging hosts are blacklisted unless they are explicitly listed in the whitelist.'
  rationale: For consistency with Plugin and Extension policies, native messaging should be blacklisted by default, requiring
    explicit administrative approval of applications for whitelisting. Examples of applications that use native messaging
    is the 1Password password manager.
  impact: A blacklist value of '*' means all native messaging hosts are blacklisted unless they are explicitly listed in the
    whitelist.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#NativeMessagingBlacklist
  page_start: 24
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    24 | P a g e

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\NativeMessagingBlacklist:1'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Enabled.

    Computer Configuration\Administrative Templates\Google\Google Chrome\Native

    Messaging\Configure native messaging blacklist'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      24 | P a g e

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome\NativeMessagingBlacklist:1'
    severity: medium
- id: 1.1.10.1
  title: (L1) Ensure 'Enable saving passwords to the password manager' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Chrome will memorize passwords and automatically provide them when a user logs into a site. By disabling this
    feature the user will be prompted to enter their password each time they visit a website.
  rationale: 'If this setting is enabled, users can have Google Chrome memorize passwords and provide them automatically the
    next time they log in to a site. An intruder who has unrestricted access to your computer for even a minute can view and
    copy all of your saved passwords just by visiting an easy-to-remember settings page: chrome://settings/passwords.'
  impact: If this settings is disabled, users cannot save new passwords but they may still use passwords that have been saved
    previously.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#PasswordManagerEnabled
  page_start: 26
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:PasswordManagerEnabled'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Google\Google Chrome\Password

    manager\Enable the password manager

    26 | P a g e'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:PasswordManagerEnabled'
    severity: medium
- id: 1.1.11.1
  title: (L1) Ensure 'Supported authentication schemes' is set to 'Enabled' (ntlm, negotiate)
  scoring: scored
  profile:
  - Level 1
  description: Specifies which HTTP authentication schemes are supported by Google Chrome.
  rationale: Possible values are 'basic', 'digest', 'ntlm' and 'negotiate'. Basic and Digest authentication do not provide
    sufficient security and can lead to submission of users password in plaintext or minimal protection.
  impact: ''
  references:
  - 1. https://www.chromium.org/administrators/policy-list-3#AuthSchemes
  page_start: 28
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:AuthSchemes'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Enabled:(ntlm, negotiate).

    Computer Configuration\Administrative Templates\Google\Google Chrome\Policies

    for HTTP Authentication\Supported authentication schemes'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:AuthSchemes'
    severity: medium
- id: 1.1.15
  title: (L2) Ensure 'Allow invocation of file selection dialogs' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 2
  description: Allows access to local files on the machine by allowing Google Chrome to display file selection dialogs.
  rationale: Preventing users from uploading documents can help limit the loss of sensitive information.
  impact: If you enable this setting, users can open file selection dialogs as normal.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#AllowFileSelectionDialogs
  page_start: 30
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:AllowFileSelectionDialogs

    30 | P a g e'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Enabled.

    Computer Configuration\Administrative Templates\Google\Google Chrome\Allow

    invocation of file selection dialogs'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:AllowFileSelectionDialogs

      30 | P a g e'
    severity: medium
- id: 1.1.16
  title: (L1) Ensure 'Allow running plugins that are outdated' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Chrome enables the use of outdated plugins. By disabling this feature Chrome will not prompt the user to use
    an outdated plugin.
  rationale: Running the most up-to-date version of a plugin can reduce the possibility of running a plugin that contains
    an exploit or security hole.
  impact: If you disable this setting, outdated plugins will not be used and users will not be asked for permission to run
    them.
  references: []
  page_start: 32
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:AllowOutdatedPlugins'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Google\Google Chrome\Allow

    running plugins that are outdated'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:AllowOutdatedPlugins'
    severity: medium
- id: 1.1.17
  title: (L1) Ensure 'Block third party cookies' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'Chrome allows cookies to be set by web page elements that are not from the domain in the user''s address bar.
    Enabling this feature prevents third party cookies from being set. NOTE: Third Party Cookies and Tracking Protection are
    required for many business critical websites, including SalesForce and Office365.'
  rationale: Blocking third party cookies can help protect a user's privacy by eliminating a number of website tracking cookies.
  impact: Enabling this setting prevents cookies from being set by web page elements that are not from the domain that is
    in the browser's address bar.
  references:
  - 1. https://www.chromium.org/administrators/policy-list-3#BlockThirdPartyCookies
  - 2. https://help.salesforce.com/articleView?id=getstart_browser_recommendations.ht
  page_start: 34
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:BlockThirdPartyCookies'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Enabled.

    Computer Configuration\Administrative Templates\Google\Google Chrome\Block

    third party cookies'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:BlockThirdPartyCookies'
    severity: medium
- id: 1.1.18
  title: (L1) Ensure 'Continue running background apps when Google Chrome is closed' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Chrome allows for processes started while the browser is open to remain running once the browser has been closed.
    It also allows for background apps and the current browsing session to remain active after the browser has been closed.
    Disabling this feature will stop all processes and background applications when the browser window is closed.
  rationale: If this setting is enabled, vulnerable or malicious plugins, apps and processes can continue running even after
    Chrome has closed.
  impact: If this policy is set to Disabled, background mode is disabled and cannot be controlled by the user in the browser
    settings.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#BackgroundModeEnabled
  page_start: 36
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:BackgroundModeEnabled'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Google\Google Chrome\Continue

    running background apps when Google Chrome is closed'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:BackgroundModeEnabled'
    severity: medium
- id: 1.1.19
  title: (L1) Ensure 'Enable AutoFill' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: Chrome allows users to auto-complete web forms with saved information such as address, phone number and credit
    card numbers. Disabling this feature will prompt a user to enter all information manually.
  rationale: If an attacker gains access to a user's machine where the user has stored auto save data, information could be
    harvested or used to gain access to more systems.
  impact: If this setting is disabled, AutoFill will be inaccessible to users.
  references:
  - 1. https://www.chromium.org/administrators/policy-list-3#AutoFillEnabled
  page_start: 38
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:AutoFillEnabled'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Google\Google Chrome\Enable

    AutoFill'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:AutoFillEnabled'
    severity: medium
- id: 1.1.20
  title: (L1) Ensure 'Enable Google Cloud Print Proxy' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: This setting enables Google Chrome to act as a proxy between Google Cloud Print and legacy printers connected
    to the machine.
  rationale: Disabling this option will prevent users from printing possible confidential enterprise documents through the
    cloud.
  impact: If this setting is disabled, users cannot enable the proxy, and the machine will not be allowed to share its local
    printers with Google Cloud Print.
  references:
  - 1. https://www.chromium.org/administrators/policy-list-3#CloudPrintProxyEnabled
  page_start: 40
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:CloudPrintProxyEnabled'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Google\Google Chrome\Enable

    Google Cloud Print Proxy'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:CloudPrintProxyEnabled'
    severity: medium
- id: 1.1.21
  title: (L1) Ensure 'Enable reporting of usage and crash-related data' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: 'This Setting controls anonymous reporting of usage and crash-related data about Google Chrome to Google. NOTE:
    This policy is not available on Windows instances that are not joined to a Microsoft® Active Directory® domain.'
  rationale: Anonymous crash/usage data can be used to identify people, companies and information, which can be considered
    data ex-filtration from company systems.
  impact: If this setting is disabled, this information is not sent to Google.
  references:
  - 1. https://www.chromium.org/administrators/policy-list3#MetricsReportingEnabled
  page_start: 42
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:MetricsReportingEnabled'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Disabled.

    Computer Configuration\Administrative Templates\Google\Google Chrome\Enable

    reporting of usage and crash-related data'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:MetricsReportingEnabled'
    severity: medium
- id: 1.1.22
  title: (L1) Ensure 'Enable Site Isolation for every site' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: This policy controls is every website will load into its own process.
  rationale: Chrome will load each website in its own process. So, even if a site bypasses the sameorigin policy, the extra
    security will help stop the site from stealing your data from another website.
  impact: If the policy is enabled, each site will run in its own process which will cause the system to use more memory.
  references:
  - 1. https://www.chromium.org/Home/chromium-security/site-isolation
  page_start: 44
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:SitePerProcess'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

    Enabled.

    Computer Configuration\Administrative Templates\Google\Google Chrome\Enable

    Site Isolation for every site'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Google\Chrome:SitePerProcess'
    severity: medium
- id: 1.1.23
  title: (L1) Ensure 'Enable submission of documents to Google Cloud print' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: 'This setting enables Google Chrome to submit documents to Google Cloud Print for printing. NOTE: This only
    affects Google Cloud Print support in Google Chrome. It does not prevent users from submitting print jobs on web sites.'
