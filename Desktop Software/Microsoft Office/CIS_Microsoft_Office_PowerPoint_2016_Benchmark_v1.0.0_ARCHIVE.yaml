- id: 1.6.6.5
  title: (L1) Ensure 'Run Programs' is set to Enabled (Disable (Don't Run Any Programs))
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls the prompting and activation behavior for the "Run Programs" option for action
    buttons in PowerPoint. If you enable this policy setting, you can choose from three options to control how the "Run Programs"
    option functions: - Disable (don''t run any programs). If users click an action button with the "Run Programs" action
    assigned to it, nothing will happen. This option enforces the default configuration in PowerPoint. - Enable (prompt user
    before running). If users click an action button with the "Run Programs" action assigned to it, PowerPoint will prompt
    them to continue before running the program. - Enable all (run without prompting). If users click an action button with
    the "Run Programs" action assigned to it. PowerPoint will run the program automatically, without prompting. If you disable
    or do not configure this policy setting, if users click an action with the "Run Programs" action assigned to it, nothing
    will happen. This behavior is the same as Enabled - - Disable (don''t run any programs). The recommended state for this
    setting is: Enabled. (Disable (Don''t Run Any Programs))'
  rationale: Action buttons can be used to launch external programs from PowerPoint 2016 presentations. If a malicious person
    adds an action button to a presentation that launches a dangerous program, it could significantly affect the security
    of a user's computer and data.
  impact: Enabling this setting and configuring the drop-down menu to "Disable (don't run any programs)" will cause disruptions
    to users who wish to create or use presentations that launch external programs when action buttons are clicked. These
    users will have to launch any external programs manually at the appropriate times when delivering presentations.
