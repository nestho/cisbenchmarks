- id: 1.6.5.1
  title: (L1) Ensure 'Default file format' is set to Enabled (PowerPoint Presentation (*pptx))
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting governs the default format for new presentation files that users create. If you enable
    this policy setting, when a user creates a new blank presentation, it is in the specified default format. Users may still
    override the default and specify a specific format when they create a presentation. If you disable or do not configure
    this policy setting, PowerPoint Presentation is the default option. The recommended state for this setting is: Enabled.
    (PowerPoint Presentation (*pptx)) This policy setting allows you to determine if users can open, view, or edit Word files.
    If you enable this policy setting, you can set one of these options: - Blocked files are not opened - Blocked files open
    in Protected View and cannot be edited - Blocked files open in Protected View and can be edited If you disable or do not
    configure this policy setting, the behavior is the same as the "Blocked files are not opened" setting. Users will not
    be able to open blocked files. The recommended state for this setting is: Enabled. (Blocked files are not opened) This
    policy setting controls how Office handles documents when they fail file validation. If you enable this policy setting,
    you can configure the following options for files that fail file validation: - Block files completely. Users cannot open
    the files. - Open files in Protected View and disallow edit. Users cannot edit the files. This is also how Office handles
    the files if you disable this policy setting. - Open files in Protected View and allow edit. Users can edit the files.
    This is also how Office handles the files if you do not configure this policy setting. 18 | P a g e If you disable this
    policy setting, Office follows the "Open files in Protected View and disallow edit" behavior. If you do not configure
    this policy setting, Office follows the "Open files in Protected View and allow edit" behavior. The recommended state
    for this setting is: Enabled. (Open in Protected View (Unchecked)) This policy setting allows you to determine if files
    downloaded from the Internet zone open in Protected View. If you enable this policy setting, files downloaded from the
    Internet zone do not open in Protected View. If you disable or do not configure this policy setting, files downloaded
    from the Internet zone open in Protected View. The recommended state for this setting is: Disabled. This policy setting
    allows you to determine if PowerPoint files in Outlook attachments open in Protected View. If you enable this policy setting,
    Outlook attachments do not open in Protected View. If you disable or do not configure this policy setting, Outlook attachments
    open in Protected View. The recommended state for this setting is: Disabled. This policy setting lets you determine if
    files located in unsafe locations will open in Protected View. If you have not specified unsafe locations, only the "Downloaded
    Program Files" and "Temporary Internet Files" folders are considered unsafe locations. If you enable this policy setting,
    files located in unsafe locations do not open in Protected View. If you disable or do not configure this policy setting,
    files located in unsafe locations open in Protected View. The recommended state for this setting is: Disabled. This policy
    setting controls whether trusted locations on the network can be used. If you enable this policy setting, users can specify
    trusted locations on network shares or in other remote locations that are not under their direct control by clicking the
    "Add new location" button in the Trusted Locations section of the Trust Center. Content, code, and add-ins are allowed
    to load from trusted locations with minimal security and without prompting the user for permission. If you disable this
    policy setting, the selected application ignores any network locations listed in the Trusted Locations section of the
    Trust Center. If you also deploy Trusted Locations via Group Policy, you should verify whether any of them are remote
    locations. If any of them are remote locations and you do not allow remote locations via this policy setting, those policy
    keys that point to remote locations will be ignored on client computers. Disabling this policy setting does not delete
    any network locations from the Trusted Locations list, but causes disruption for users who add network locations to the
    Trusted Locations list. Users are also prevented from adding new network locations to the Trusted Locations list in the
    Trust Center. We recommended that you do not enable this policy setting (as the "Allow Trusted Locations on my network
    (not recommended)" check box also states). Therefore, in practice, it should be possible to disable this policy setting
    in most situations without causing significant usability issues for most users. If you do not enable this policy setting,
    users can select the "Allow Trusted Locations on my network (not recommended)" check box if desired and then specify trusted
    locations by clicking the "Add new location" button. The recommended state for this setting is: Disabled. 27 | P a g e
    This policy setting allows administrators to disable all trusted locations in the specified applications. Trusted locations
    specified in the Trust Center are used to define file locations that are assumed to be safe. Content, code, and add-ins
    are allowed to load from trusted locations with a minimal amount of security, without prompting the users for permission.
    If a dangerous file is opened from a trusted location, it will not be subject to standard security measures and could
    harm users'' computers or data. If you enable this policy setting, all trusted locations (those specified in the Trust
    Center) in the specified applications are ignored, including any trusted locations established by Office 2016 during setup,
    deployed to users using Group Policy, or added by users themselves. Users will be prompted again when opening files from
    trusted locations. If you disable or do not configure this policy setting, all trusted locations (those specified in the
    Trust Center) in the specified applications are assumed to be safe. The recommended state for this setting is: Enabled.'
  rationale: By default, when users create new PowerPoint files, PowerPoint 2016 saves them in the new *.pptx file format.
    Users can change this functionality by clicking the Office button, clicking PowerPoint Options, and then selecting a file
    format from the Default file format list. Disabling this setting allows users to choose from any of the available default
    file formats. If a new PowerPoint file is created in an earlier format, some users may not be unable to open or use the
    file, or they may choose a format that is less secure than the PowerPoint 2016 format. By default, users can open, view,
    or edit a large number of file types in PowerPoint 2016. Some file types are safer than others, as some could allow malicious
    code to become active on user computers or the network. For this reason, disabling or not configuring this setting could
    allow malicious code to become active on user computers or the network. Disabling or not configuring this setting allows
    users to open and edit files that have failed file validation outside of Protected View. As a result, malicious code or
    users could become active on user computers or the network. For example, a malicious user may purposely put invalid data
    in a file. The invalid data could force the program to fail or execute its code in an unexpected manner, giving the malicious
    user control of the application. Enabling this setting allows files that users download from the Internet zone open outside
    of Protected View. This could allow malicious code to become active on user computers or the network. Enabling this setting
    allows Outlook 2016 attachments to open outside of Protected View. Email is a common way to spread files containing malicious
    code. This could allow malicious code to become active on user computers or the network. Enabling this setting allows
    users to open files located in unsafe locations that do not require Protected View. As a result, malicious code could
    become active on user computers or the network. By default, files located in trusted locations and specified in the Trust
    Center are assumed to be safe. Content, code, and add-ins are allowed to load from trusted locations with minimal security
    and without prompting the user for permission. By default, users can specify trusted locations on network shares or in
    other remote locations that are not under their direct control by selecting the Allow Trusted Locations on my network
    (not recommended) check box in the Trusted Locations section of the Trust Center. If a dangerous file is opened from a
    trusted location, it will not be subject to typical security measures and could affect users' computers or data. Trusted
    locations specified in the Trust Center are used to define file locations that are assumed to be safe. Content, code,
    and add-ins are allowed to load from trusted locations with a minimal amount of security, without prompting the users
    for permission. If a dangerous file is opened from a trusted location, it will not be subject to standard security measures
    and could harm users' computers or data. By default, files located in trusted locations (those specified in the Trust
    Center) are assumed to be safe.
  impact: Enabling this setting does not prevent users from choosing a different file format for a new PowerPoint file, and
    therefore, it is unlikely to affect usability for most users. Enabling this setting prevents users from opening, viewing,
    or editing certain types of files in PowerPoint 2016. Productivity in your organization could be affected if users who
    require access to any of these file types cannot access them. By default, users can only open files in Protected View
    after the files fail validation to help prevent malicious code from running on user computers or the network. In this
    way, the application is protected from attacks attempting to induce unexpected execution paths. You can block files from
    opening at all, but this also prevents users from accessing any data in the file. Using this setting allows the application
    to open files, and thus users to view valid data and detect invalid data that is visible. However, users cannot correct
    invalid data in the file. To do so, users must open such files on another isolated computer where this setting is set
    to a lower security level. 19 | P a g e When files open in Protected View, some functionality will be unavailable and
    productivity in your organization could be affected. When this is undesirable, users will have to add 21 | P a g e sites
    to their trusted sites list in Internet Explorer, thus allowing the files to be opened in normal view with all functionality
    available. Opening Office 2016 files, such as the Office 2016 versions of Word, Excel, PowerPoint, and OneNote, is a common
    action. Users are unlikely to notice much difference when opening and viewing files in Protected View. Users who want
    to modify these kinds of files must save them to a safe location and then open them. 23 | P a g e When Office 2016 application
    files open in Protected View, some functionality is unavailable. The process of dragging the file to a new location and
    then opening it takes more time than simply double-clicking the file to open it, modifying it, and then saving it to the
    same location. For these reasons, administrators may receive some complaints from users potentially confused about how
    to modify files originally only available to them in Protected View. The Downloaded Program Files folder and the Temporary
    Internet Files folder are considered unsafe locations. You may specify additional unsafe locations. 25 | P a g e Some
    functionality is not available when files are opened in Protected View. In such cases, users must move the files from
    unsafe locations to save locations in order to access them with full functionality Disabling this setting will cause disruption
    for users who add network locations to the Trusted Locations list. However, this practice is discouraged (as the Allow
    Trusted Locations on my network (not recommended) check box itself states), so in practice it should be possible to disable
    this setting in most situations without causing significant usability issues for most users. If there are business-critical
    reasons to access some files in a more trusted environment, disabling trusted locations could cause usability problems.
  references: []
