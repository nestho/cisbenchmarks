- id: 1.6.6.4
  title: (L1) Ensure 'Scan Encrypted Macros in PowerPoint Open XML Presentations' is set to Enabled (Scan Encrypted Macros)
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether encrypted macros in Open XML presentations are required to be scanned
    with anti-virus software before being opened. If you enable this policy setting, you may choose one of these options:
    - Scan encrypted macros: encrypted macros are disabled unless anti-virus software is installed. Encrypted macros are scanned
    by your anti-virus software when you attempt to open an encrypted presentation that contains macros. - Scan if anti-virus
    software available: if anti-virus software is installed, scan the encrypted macros first before allowing them to load.
    If anti-virus software is not available, allow encrypted macros to load. - Load macros without scanning: do not check
    for anti-virus software and allow macros to be loaded in an encrypted file. If you disable or do not configure this policy
    setting, the behavior will be similar to the "Scan encrypted macros" option. The recommended state for this setting is:
    Enabled. (Scan Encrypted Macros)'
  rationale: When an Office Open XML presentation is rights-managed or password-protected, any macros that are embedded in
    the presentation are encrypted along with the rest of the workbook's contents. By default, these encrypted macros will
    be disabled unless they are scanned by antivirus software immediately before being loaded. If this setting is Disabled,
    PowerPoint 2016 will not require encrypted macros to be scanned before loading. PowerPoint will handle them as specified
    by the Office 2016 System macro security settings, which can cause macro viruses to load undetected and lead to data loss
    or reduced application functionality. 42 | P a g e
  impact: Enabling this setting enforces the default configuration in PowerPoint 2016, and is therefore unlikely to cause
    usability issues for most users.
  references: []
