- id: 1.6.6.2.6
  title: (L1) Ensure 'Require That Application Add-ins are Signed by Trusted Publisher' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether add-ins for this applications must be digitally signed by a trusted publisher.
    If you enable this policy setting, this application checks the digital signature for each add-in before loading it. If
    an add-in does not have a digital signature, or if the signature did not come from a trusted publisher, this application
    disables the add-in and notifies the user. Microsoft provides four certificates for Office, which you can add to the Trusted
    Publishers list. These certificates must be added to the Trusted Publishers list if you require that all add-ins be signed
    by a trusted publisher. The Microsoft certificates are named Mscert01.cer, Mscert02.cer, Mscert03.cer, Mscert04.cer, and
    can be found on the Microsoft Web site. Office 2016 stores certificates for trusted publishers in the Internet Explorer
    trusted publisher store. Earlier versions of Microsoft Office stored trusted publisher certificate information (specifically,
    the certificate thumbprint) in a special Office trusted publisher store. Office 2016 still reads trusted publisher certificate
    information from the Office trusted publisher store, but it does not write information to this store. Therefore, if you
    created a list of trusted publishers in a previous version of Office and you upgrade to Office 2016, your trusted publisher
    list will still be recognized. However, any trusted publisher certificates that you add to the list will be stored in
    the Internet Explorer trusted publisher store. For more information about trusted publishers, see the Office Resource
    Kit. If you disable or do not configure this policy setting, this application does not check the digital signature on
    application add-ins before opening them. If a dangerous add-in is loaded, it could harm users'' computers or compromise
    data security. The recommended state for this setting is: Enabled.'
  rationale: By default, Office 2016 applications do not check the digital signature on application addins before opening
    them. Disabling or not configuring this setting may allow an application to load a dangerous add-in. As a result, malicious
    code could become active on user computers or the network. 35 | P a g e
  impact: Enabling this setting could cause disruptions for users who rely on add-ins that are not signed by trusted publishers.
    These users will either have to obtain signed versions of such add-ins or stop using them. Office 2016 stores certificates
    for trusted publishers in the Internet Explorer trusted publisher store. Earlier versions of Office stored trusted publisher
    certificate information (specifically, the certificate thumbprint) in a special Office trusted publisher store. Office
    2016 still reads trusted publisher certificate information from the Office trusted publisher store, but does not write
    information to this store. Therefore, if you created a list of trusted publishers in a previous version of Office and
    you upgrade to the Office 2016 release, your trusted publisher list will still be recognized. However, any trusted publisher
    certificates that you add to the list will be stored in the Internet Explorer trusted publisher store.
  references: []
  page_start: 35
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

