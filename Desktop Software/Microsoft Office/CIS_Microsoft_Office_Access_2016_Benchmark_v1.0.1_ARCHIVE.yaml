controls:
- id: 1.1.3.2.2
  title: (L1) Ensure 'Require that application add-ins are signed by Trusted Publisher' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether add-ins for this applications must be digitally signed by a trusted publisher.
    The recommended state for this setting is: Enabled.'
  rationale: By default, Office applications do not check the digital signature on application add-ins before opening them.
    Disabling or not configuring this setting may allow an application to load a dangerous add-in. As a result, malicious
    code could become active on user computers or the network.
  impact: Enabling this setting could cause disruptions for users who rely on add-ins that are not signed by trusted publishers.
    These users will either have to obtain signed versions of such add-ins or stop using them. Office stores certificates
    for trusted publishers in the Internet Explorer trusted publisher store. Earlier versions of Office stored trusted publisher
    certificate information 14 | P a g e (specifically, the certificate thumbprint) in a special Office trusted publisher
    store. Office still reads trusted publisher certificate information from the Office trusted publisher store, but does
    not write information to this store. Therefore, if you created a list of trusted publishers in a previous version of Office
    and you upgrade to the Office release, your trusted publisher list will still be recognized. However, any trusted publisher
    certificates that you add to the list will be stored in the Internet Explorer trusted publisher store.
  references: []
  page_start: 14
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\access\security\requireaddins

    ig'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Enabled.

    User Configuration\Microsoft Access 2016\Application Settings\Security\Trust

    Center\Require that application add-ins are signed by trusted publisher'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\access\security\requireaddins

      ig'
    severity: medium
- id: 1.1.3.2.3
  title: (L1) Ensure 'VBA Macro Notification Settings' is set to Enabled (Disable all Except Digitally Signed Macros)
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls how the specified applications warn users when Visual Basic for Applications
    (VBA) macros are present. The recommended state for this setting is: Enabled. (Disable all Except Digitally Signed Macros)'
  rationale: By default, when user’s open files in Access that contain VBA macros, Access opens the files with the macros
    disabled, and displays the Trust Bar with a warning that macros are present and have been disabled. Users may then enable
    these macros by clicking Options on the Trust Bar and selecting the option to enable them. Disabling or not configuring
    this setting may allow dangerous macros to become active on user computers or the network.
  impact: This configuration causes documents and templates that contain unsigned macros to lose any functionality supplied
    by those macros. To prevent this loss of functionality, users can install the macros in a trusted location, unless the
    Disable all trusted locations setting is 16 | P a g e configured to Enabled, which will block them from doing so. If your
    organization does not use any officially sanctioned macros, consider choosing No Warnings for all macros but disable all
    macros for even stronger security.
  references: []
  page_start: 16
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\access\security\vbawarnings'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

    to Enabled.

    User Configuration\Administrative Templates\Microsoft Access 2016\Application

    Settings\Security\Trust Center\VBA Macro Notification Settings'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\access\security\vbawarnings'
    severity: medium
- id: 1.1.3.2.4
  title: (L1) Ensure Set 'Disable Trust Bar Notification for unsigned application add-ins ' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether the specified Office application notifies users when unsigned application
    add-ins are loaded or silently disable such add-ins without notification. This policy setting only applies if you enable
    the "Require that application addins are signed by Trusted Publisher" policy setting, which prevents users from changing
    this policy setting. The recommended state for this setting is: Enabled.'
  rationale: By default, if an application is configured to require that all add-ins be signed by a trusted publisher, any
    unsigned add-ins the application loads will be disabled and the application will display the Trust Bar at the top of the
    active window. The Trust Bar contains a message that informs users about the unsigned add-in.
  impact: This setting only applies if the Office application is configured to require that all add-ins are signed by a trusted
    publisher. By default, users can configure this requirement themselves 18 | P a g e in the Add-ins category of the Trust
    Center for the application. To enforce this requirement, you must enable the Require that application add-ins are signed
    by Trusted Publisher setting in Group Policy, which prevents users from changing the setting themselves.
  references: []
  page_start: 18
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\access\security\notbpromptuns

    ignedaddin'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

    to Enabled.

    User Configuration\Administrative Templates\Microsoft Access 2016\Application

    Settings\Security\Trust Center\Disable Trust Bar Notification for unsigned application

    add-ins and block them'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\access\security\notbpromptuns

      ignedaddin'
    severity: medium
- id: 1.1.4.1.1
  title: (L1) Ensure 'Underline hyperlinks' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether hyperlinks in Access tables, queries, forms, and reports are underlined.
    The recommended state for this setting is: Enabled.'
  rationale: By default, Access underlines hyperlinks that appear in tables, queries, forms, and reports. If this configuration
    is changed, users might click on dangerous hyperlinks without realizing it, which could pose a security risk.
  impact: If this setting is Enabled, Access underlines all hyperlinks in tables, queries, forms, and reports when they are
    created, overriding any configuration changes on the users' computers. 20 | P a g e
  references: []
  page_start: 20
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\access\internet\donotunderlin

    ehyperlinks'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

    to Enabled.

    User Configuration\Administrative Templates\Microsoft Access 2016\Application

    Settings\Web Options...\General\Underline hyperlinks'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\access\internet\donotunderlin

      ehyperlinks'
    severity: medium
- id: 1.4.1
  title: (L1) Ensure 'Do not prompt to convert older databases' is set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether Access prompts users to convert older databases when they are opened.
    The recommended state for this setting is: Disabled. This policy setting controls whether new database files are created
    in the new Access format or in a format used by earlier versions of Access. The recommended state for this setting is:
    Enabled. (Access 2007)'
  rationale: By default, when user’s open databases that were created in the Access 97 file format, Access prompts them to
    convert the database to a newer file format. Users can choose to convert the database or leave it in the older format.
    If this configuration is changed, Access will leave Access 97-format databases unchanged. Access informs the user that
    the database is in the older format, but does not provide the user with an option to convert the database. Some features
    introduced in more recent versions of Access will not be available, and the user will not be able to make any design changes
    to the database. By default, when users create new database files, Access saves them in the new Access format. Users can
    change this functionality by clicking the Office button, clicking Access Options, and then selecting a file format from
    the Default file format list. Disabling this setting allows users to choose from any of the available default file formats.
    If a new workbook is created in an earlier format, some users may not be unable to open or use the file, or they may choose
    a format that is less secure than the Access format.
  impact: Disabling this setting enforces the default configuration in Access, and is therefore unlikely to cause usability
    issues for most users. Enabling this setting does not prevent users from choosing a different file format for a new Access
    file, and therefore, it is unlikely to affect usability for most users. 25 | P a g e
  references: []
  page_start: 23
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\access\settings\noconvertdial

    og

    Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\access\settings\default file

    format'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

    to Disabled.

    User Configuration\Administrative Templates\Microsoft Access 2016\Miscellaneous\Do not

    prompt to convert older databases

    23 | P a g e

    To implement the recommended configuration state, set the following Group Policy setting

    to Enabled.

    User Configuration\Administrative Templates\Microsoft Access

    2016\Miscellaneous\Default file format'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\access\settings\noconvertdial

      og

