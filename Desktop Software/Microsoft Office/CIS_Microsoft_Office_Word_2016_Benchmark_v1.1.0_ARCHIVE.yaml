controls:
- id: 1.6.2
  title: (L1) Ensure 'Use Online Translation Dictionaries' is set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting allows you to prevent online dictionaries from being used for the translation of text
    through the Research pane. If you enable or do not configure this policy setting, the online dictionaries can be used
    to translate text through the Research pane. If you disable this policy setting, the online dictionaries cannot be used
    to translate text through the Research pane. The recommended state for this setting is: Disabled.'
  rationale: Some organizations do not allow Internet access of any kind on certain devices or for certain users. In these
    instances, Internet access could violate organizational or regulatory compliance standards. For devices and users that
    manage extremely sensitive data Internet access can be prohibited to help prevent an attacker from gaining access to the
    sensitive information.
  impact: When this policy setting is configured to Disabled, users will not be able to translate text through the Research
    pane by using the online dictionaries.
  references: []
  page_start: 12
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\common\research\translation

    Criteria'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Disabled.

    12 | P a g e

    User Configuration\Administrative Templates\Microsoft Word 2016\Miscellaneous\Use

    Online Translation Dictionaries'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\common\research\translation

      Criteria'
    severity: medium
- id: 1.8.1.2
  title: (L1) Ensure 'Custom Markup Warning' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting specifies how Word behaves when opening a document that contains custom XML markup. If
    you enable this policy setting, you can set the behavior to one of the following: - 0: Do not prompt the user and silently
    remove the custom XML markup. - 1: Prompt the user regarding the loss of custom XML markup. This is the default option.
    - 2: Prompt the user regarding the loss of custom XML markup, and do not allow them to suppress this prompt. - 3: Prompt
    the user regarding the loss of custom XML markup, and open the file read-only. - 4: Prompt the user regarding the loss
    of custom XML markup, do not allow them to suppress this prompt, and open the file read-only. - 5: Do not prompt the user
    and silently remove the custom XML markup, but open the file read-only. The recommended state for this setting is: Enabled.'
  rationale: The removal of custom XML markup is the result of a United States court ruling on December 22, 2009. Word does
    not include a particular custom XML tagging implementation. Word can be configured to notify users when they are opening
    a document that contains custom XML markup. 15 | P a g e
  impact: 'Configure this policy setting is configured to be Enabled, also select one of the following options so that the
    user is notified that the custom XML markup is being removed: - 1: Prompt the user regarding the loss of custom XML markup.
    This is the default option. - 2: Prompt the user regarding the loss of custom XML markup, and do not allow them to suppress
    this prompt. - 3: Prompt the user regarding the loss of custom XML markup, and open the file read-only. - 4: Prompt the
    user regarding the loss of custom XML markup, do not allow them to suppress this prompt, and open the file read-only.'
  references: []
  page_start: 15
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\word\options\custommarkupwarn

    ing'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Enabled.

    User Configuration\Administrative Templates\Microsoft Word 2016\Word

    Options\Advanced\Custom Markup Warning'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\word\options\custommarkupwarn

      ing'
    severity: medium
- id: 1.8.1.3
  title: (L1) Ensure 'Update Automatic Links at Open' is set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'Checks/unchecks the corresponding UI option. The recommended state for this setting is: Disabled.'
  rationale: By default, when user’s open documents Word automatically updates any links to external content, such as graphics,
    Excel worksheets, and PowerPoint slides. To disable automatic updating, the user can click the Office Button, click Word
    Options, click Advanced, scroll to the General section, and then clear the Update automatic links at open check box. If
    Word is configured to automatically update links when documents are open, document content can change without the user's
    knowledge, which could put important information at risk.
  impact: Disabling this setting might cause disruptions for users who work with Word documents that contain external content.
    Consider educating users on the methods for updating links manually. 17 | P a g e
  references: []
  page_start: 17
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\word\options\DontUpdateLinks'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Disabled.

    User Configuration\Administrative Templates\Microsoft Word 2016\Word

    Options\Advanced\Update Automatic Links at Open'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\word\options\DontUpdateLinks'
    severity: medium
- id: 1.8.3.1
  title: (L1) Ensure 'Hidden Text' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether text that is formatted as hidden displays on Word users'' monitor screens.
    If you enable this policy setting, Word displays hidden text at all times. Hidden text on monitor screens displays as
    underlined with a dotted line. If you disable or do not configure this policy setting, Word does not display text formatted
    as hidden unless "Show/Hide ¶" is selected or Word is configured to show hidden text in the "Display" section of the "Word
    Options" dialog. The recommended state for this setting is: Enabled.'
  rationale: By default, Word does not display text formatted as hidden unless Show/Hide ¶ is selected or Word is configured
    to show hidden text in the Display section of the Word Options dialog box. If a document that contains hidden text is
    distributed, any sensitive information in the document could be at risk.
  impact: Enabling this setting could create issues for Word users when they format documents that contain hidden text for
    printing or distribution. Displaying hidden text can change the way a document flows as well as make it difficult to judge
    the number of pages in a document and where Word will insert automatic page breaks.
  references: []
  page_start: 20
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\word\options\showhiddentext'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

    to Enabled.

    User Configuration\Administrative Templates\Microsoft Word 2016\Word

    Options\Display\Hidden Text

    20 | P a g e'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\word\options\showhiddentext'
    severity: medium
- id: 1.8.6.1
  title: (L1) Ensure 'Default File Format' is set to Enabled (Word Document (.docx))
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting determines the default file format for saving files in Word. If you enable this policy
    setting, you can set the default file format from among the following options: - Word Document (*.docx): This option is
    the default configuration in Word. - Single Files Web Page (*.mht) - Web Page (*.htm; *.html) - Web Page, Filtered (*.htm,
    *.html) - Rich Text Format (*.rtf) - Plain Text (*.txt) - Word 6.0/95 (*.doc) - Word 6.0/95 - Chinese (Simplified) (*.doc)
    - Word 6.0/95 - Chinese (Traditional) (*.doc) - Word 6.0/95 - Japanese (*.doc) - Word 6.0/95 - Korean (*.doc) - Word 97-2002
    and 6.0/95 - RTF - Word 5.1 for Macintosh (*.mcw) - Word 5.0 for Macintosh (*.mcw) 23 | P a g e - Word 2.x for Windows
    (*.doc) - Works 4.0 for Windows (*.wps) - WordPerfect 5.x for Windows (*.doc) - WordPerfect 5.1 for DOS (*.doc) - Word
    Macro-Enabled Document (*.docm) - Word Template (*.dotx) - Word Macro-Enabled Template (*.dotm) - Word 97 - 2003 Document
    (*.doc) - Word 97 - 2003 Template (*.dot) - Word XML Document (*.xml) - Strict Open XML Document (*.docx) - OpenDocument
    Text (*.odt) Users can choose to save presentations or documents in a different file format than the default. If you disable
    or do not configure this policy setting, Word saves new files in the Office Open XML format: Word files have a .docx extension.
    For users who run recent versions of Word, Microsoft offers the Microsoft Office Compatibility Pack, which enables them
    to open and save Office Open XML files. If some users in your organization cannot install the Compatibility Pack, or are
    running versions of Word older than Microsoft Office 2000 with Service Pack 3, they might not be able to access Office
    Open XML files. This policy setting is often set in combination with the "Save As Open XML in Compatibility Mode" policy
    setting. The recommended state for this setting is: Enabled. (Word Document (.docx)) This policy setting allows you to
    determine if users can open, view, or edit Word files. If you enable this policy setting, you can set one of these options:
    - Blocked files are not opened - Blocked files open in Protected View and cannot be edited - Blocked files open in Protected
    View and can be edited If you disable or do not configure this policy setting, the behavior is the same as the "Blocked
    files are not opened" setting. Users will not be able to open blocked files. The recommended state for this setting is:
    Enabled. This policy setting allows you to determine whether users can open, view, edit, or save Word files with the format
    specified by the title of this policy setting. If you enable this policy setting, you can specify whether users can open,
    view, edit, or save files. The options that can be selected are below. Note: Not all options may be available for this
    policy setting. - Do not block: The file type will not be blocked. - Save blocked: Saving of the file type will be blocked.
    - Open/Save blocked, use open policy: Both opening and saving of the file type will be blocked. The file will open based
    on the policy setting configured in the "default file block behavior" key. - Block: Both opening and saving of the file
    type will be blocked, and the file will not open. - Open in Protected View: Both opening and saving of the file type will
    be blocked, and the option to edit the file type will not be enabled. - Allow editing and open in Protected View: Both
    opening and saving of the file type will be blocked, and the option to edit will be enabled. If you disable or do not
    configure this policy setting, the file type will be blocked. The recommended state for this setting is: Enabled. (Open/Save
    blocked, use open policy) This policy setting allows you to determine whether users can open, view, edit, or save Word
    files with the format specified by the title of this policy setting. If you enable this policy setting, you can specify
    whether users can open, view, edit, or save files. The options that can be selected are below. Note: Not all options may
    be available for this policy setting. - Do not block: The file type will not be blocked. - Save blocked: Saving of the
    file type will be blocked. - Open/Save blocked, use open policy: Both opening and saving of the file type will be blocked.
    The file will open based on the policy setting configured in the "default file block behavior" key. - Block: Both opening
    and saving of the file type will be blocked, and the file will not open. - Open in Protected View: Both opening and saving
    of the file type will be blocked, and the option to edit the file type will not be enabled. - Allow editing and open in
    Protected View: Both opening and saving of the file type will be blocked, and the option to edit will be enabled. If you
    disable or do not configure this policy setting, the file type will be blocked. The recommended state for this setting
    is: Enabled. (Open/Save blocked, use open policy) This policy setting allows you to determine whether users can open,
    view, edit, or save Word files with the format specified by the title of this policy setting. If you enable this policy
    setting, you can specify whether users can open, view, edit, or save files. The options that can be selected are below.
    Note: Not all options may be available for this policy setting. - Do not block: The file type will not be blocked. - Save
    blocked: Saving of the file type will be blocked. - Open/Save blocked, use open policy: Both opening and saving of the
    file type will be blocked. The file will open based on the policy setting configured in the "default file block behavior"
    key. - Block: Both opening and saving of the file type will be blocked, and the file will not open. - Open in Protected
    View: Both opening and saving of the file type will be blocked, and the option to edit the file type will not be enabled.
    - Allow editing and open in Protected View: Both opening and saving of the file type will be blocked, and the option to
    edit will be enabled. If you disable or do not configure this policy setting, the file type will be blocked. The recommended
    state for this setting is: Enabled. (Open/Save Blocked, Use Open Policy) This policy setting allows you to determine whether
    users can open, view, edit, or save Word files with the format specified by the title of this policy setting. If you enable
    this policy setting, you can specify whether users can open, view, edit, or save files. The options that can be selected
    are below. Note: Not all options may be available for this policy setting. - Do not block: The file type will not be blocked.
    - Save blocked: Saving of the file type will be blocked. - Open/Save blocked, use open policy: Both opening and saving
    of the file type will be blocked. The file will open based on the policy setting configured in the "default file block
    behavior" key. - Block: Both opening and saving of the file type will be blocked, and the file will not open. - Open in
    Protected View: Both opening and saving of the file type will be blocked, and the option to edit the file type will not
    be enabled. - Allow editing and open in Protected View: Both opening and saving of the file type will be blocked, and
    the option to edit will be enabled. If you disable or do not configure this policy setting, the file type will not be
    blocked. The recommended state for this setting is: Enabled. (Open/Save Blocked, Use Open Policy) This policy setting
    allows you to determine if files downloaded from the Internet zone open in Protected View. If you enable this policy setting,
    files downloaded from the Internet zone do not open in Protected View. If you disable or do not configure this policy
    setting, files downloaded from the Internet zone open in Protected View. The recommended state for this setting is: Disabled.
    This policy setting lets you determine if files located in unsafe locations will open in Protected View. If you have not
    specified unsafe locations, only the "Downloaded Program Files" and "Temporary Internet Files" folders are considered
    unsafe locations. If you enable this policy setting, files located in unsafe locations do not open in Protected View.
    If you disable or do not configure this policy setting, files located in unsafe locations open in Protected View. The
    recommended state for this setting is: Disabled. This policy setting allows you to determine if Word files in Outlook
    attachments open in Protected View. If you enable this policy setting, Outlook attachments do not open in Protected View.
    If you disable or do not configure this policy setting, Outlook attachments open in Protected View. The recommended state
    for this setting is: Disabled. This policy setting controls how Office handles documents when they fail file validation.
    If you enable this policy setting, you can configure the following options for files that fail file validation: - Block
    files completely. Users cannot open the files. - Open files in Protected View and disallow edit. Users cannot edit the
    files. This is also how Office handles the files if you disable this policy setting. - Open files in Protected View and
    allow edit. Users can edit the files. This is also how Office handles the files if you do not configure this policy setting.
    If you disable this policy setting, Office follows the "Open files in Protected View and disallow edit" behavior. If you
    do not configure this policy setting, Office follows the "Open files in Protected View and allow edit" behavior. The recommended
    state for this setting is: Enabled. (Open in Protected View) Unchecked for "Do not allow edit" This policy setting controls
    whether trusted locations on the network can be used. If you enable this policy setting, users can specify trusted locations
    on network shares or in other remote locations that are not under their direct control by clicking the "Add new location"
    button in the Trusted Locations section of the Trust Center. Content, code, and add-ins are allowed to load from trusted
    locations with minimal security and without prompting the user for permission. If you disable this policy setting, the
    selected application ignores any network locations listed in the Trusted Locations section of the Trust Center. If you
    also deploy Trusted Locations via Group Policy, you should verify whether any of them are remote locations. If any of
    them are remote locations and you do not allow remote locations via this policy setting, those policy keys that point
    to remote locations will be ignored on client computers. Disabling this policy setting does not delete any network locations
    from the Trusted Locations list, but causes disruption for users who add network locations to the Trusted Locations list.
    Users are also prevented from adding new network locations to the Trusted Locations list in the Trust Center. We recommended
    that you do not enable this policy setting (as the "Allow Trusted Locations on my network (not recommended)" check box
    also states). Therefore, in practice, it should be possible to disable this policy setting in most situations without
    causing significant usability issues for most users. If you do not enable this policy setting, users can select the "Allow
    Trusted Locations on my network (not recommended)" check box if desired and then specify trusted locations by clicking
    the "Add new location" button. The recommended state for this setting is: Disabled. 45 | P a g e This policy setting allows
    administrators to disable all trusted locations in the specified applications. Trusted locations specified in the Trust
    Center are used to define file locations that are assumed to be safe. Content, code, and add-ins are allowed to load from
    trusted locations with a minimal amount of security, without prompting the users for permission. If a dangerous file is
    opened from a trusted location, it will not be subject to standard security measures and could harm users'' computers
    or data. If you enable this policy setting, all trusted locations (those specified in the Trust Center) in the specified
    applications are ignored, including any trusted locations established by Office during setup, deployed to users using
    Group Policy, or added by users themselves. Users will be prompted again when opening files from trusted locations. If
    you disable or do not configure this policy setting, all trusted locations (those specified in the Trust Center) in the
    specified applications are assumed to be safe. The recommended state for this setting is: Enabled.'
  rationale: By default, when users create new document files, Word saves them in the new Word format. Users can change this
    functionality by clicking the Office button, clicking Word Options, and then selecting a file format from the Default
    file format list. 24 | P a g e Disabling this setting allows users to choose from any of the available default file formats.
    If a new document is created in an earlier format, some users may not be unable to open or use the file, or they may choose
    a format that is less secure than the Word format. By default, users can open, view, or edit a large number of file types
    in Word. Some file types are safer than others, as some could allow malicious code to become active on user computers
    or the network. For this reason, disabling or not configuring this setting could allow malicious code to become active
    on user computers or the network. By default, users can open, view, or edit this type of document in Word. This could
    allow malicious code to become active on user computers or the network. 29 | P a g e By default, users can open, view,
    or edit this type of document in Word. This could allow malicious code to become active on user computers or the network.
    31 | P a g e By default, users can open, view, or edit this type of document in Word. This could allow malicious code
    to become active on user computers or the network. 33 | P a g e By default, users can open, view, or edit this type of
    document in Word. This could allow malicious code to become active on user computers or the network. 35 | P a g e Enabling
    this setting allows files that users download from the Internet zone open outside of Protected View. This could allow
    malicious code to become active on user computers or the network. Enabling this setting allows users to open files located
    in unsafe locations that do not require Protected View. As a result, malicious code could become active on user computers
    or the network. Enabling this setting allows Outlook attachments to open outside of Protected View. Email is a common
    way to spread files containing malicious code. This could allow malicious code to become active on user computers or the
    network. Disabling or not configuring this setting allows users to open and edit files that have failed file validation
    outside of Protected View. As a result, malicious code or users could become active on user computers or the network.
    For example, a malicious user may purposely put invalid data in a file. The invalid data could force the program to fail
    or execute its code in an unexpected manner, giving the malicious user control of the application. By default, files located
    in trusted locations and specified in the Trust Center are assumed to be safe. Content, code, and add-ins are allowed
    to load from trusted locations with minimal security and without prompting the user for permission. By default, users
    can specify trusted locations on network shares or in other remote locations that are not under their direct control by
    selecting the Allow Trusted Locations on my network (not recommended) check box in the Trusted Locations section of the
    Trust Center. If a dangerous file is opened from a trusted location, it will not be subject to typical security measures
    and could affect users' computers or data. Trusted locations specified in the Trust Center are used to define file locations
    that are assumed to be safe. Content, code, and add-ins are allowed to load from trusted locations with a minimal amount
    of security, without prompting the users for permission. If a dangerous file is opened from a trusted location, it will
    not be subject to standard security measures and could harm users' computers or data. By default, files located in trusted
    locations (those specified in the Trust Center) are assumed to be safe.
  impact: Enabling this setting does not prevent users from choosing a different file format for a new Word file, and therefore,
    it is unlikely to affect usability for most users. Enabling this setting prevents users from opening, viewing, or editing
    certain types of files in Word. Productivity in your organization could be affected if users who require access to any
    of these file types cannot access them. If your users require open, save, or view ability and you block some or all of
    these abilities, you could affect the productivity of your organization. If your users require open, save, or view ability
    and you block some or all of these abilities, you could affect the productivity of your organization. For more information,
    see Plan file block settings for Office at http://technet.microsoft.com/en-us/library/cc179230.aspx. If your users require
    open, save, or view ability and you block some or all of these abilities, you could affect the productivity of your organization.
    If your users require open, save, or view ability and you block some or all of these abilities, you could affect the productivity
    of your organization. When files open in Protected View, some functionality will be unavailable and productivity in your
    organization could be affected. When this is undesirable, users will have to add sites to their trusted sites list in
    Internet Explorer, thus allowing the files to be opened in normal view with all functionality available. The Downloaded
    Program Files folder and the Temporary Internet Files folder are considered unsafe locations. You may specify additional
    unsafe locations. 39 | P a g e Some functionality is not available when files are opened in Protected View. In such cases,
    users must move the files from unsafe locations to save locations in order to access them with full functionality Opening
    Office files, such as the Office versions of Word, Excel, PowerPoint, and OneNote, is a common action. Users are unlikely
    to notice much difference when opening and viewing files in Protected View. Users who want to modify these kinds of files
    must save them to a safe location and then open them. 41 | P a g e When Office application files open in Protected View,
    some functionality is unavailable. The process of dragging the file to a new location and then opening it takes more time
    than simply double-clicking the file to open it, modifying it, and then saving it to the same location. For these reasons,
    administrators may receive some complaints from users potentially confused about how to modify files originally only available
    to them in Protected View. By default, users can only open files in Protected View after the files fail validation to
    help prevent malicious code from running on user computers or the network. In this way, the application is protected from
    attacks attempting to induce unexpected execution paths. You can block files from opening at all, but this also prevents
    users from accessing any data in the file. Using this setting allows the application to open files, and thus users to
    view valid data and detect invalid data that is visible. However, users cannot correct invalid data in the file. To do
    so, users must open such files on another isolated computer where this setting is set to a lower security level. Disabling
    this setting will cause disruption for users who add network locations to the Trusted Locations list. However, this practice
    is discouraged (as the Allow Trusted Locations on my network (not recommended) check box itself states), so in practice
    it should be possible to disable this setting in most situations without causing significant usability issues for most
    users. If there are business-critical reasons to access some files in a more trusted environment, disabling trusted locations
    could cause usability problems.
