- id: 1.6.6.3
  title: (L1) Ensure 'Make Hidden Markup Visible' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether hidden markup is visible when users open PowerPoint files in standard
    or HTML format. The recommended state for this setting is: Enabled.'
  rationale: PowerPoint presentations that are saved in standard or HTML format can contain a flag indicating whether markup
    (comments or ink annotations) in the presentation should be visible when the presentation is open. By default, PowerPoint
    ignores this flag when opening a file, and always displays any markup present in the file. In addition, when saving a
    file, PowerPoint sets the flag to display markup when the presentation is next opened. If this default configuration is
    changed, PowerPoint sets the flag according to the state of the Show Markup option on the Review tab of the Ribbon when
    it saves presentations in standard or HTML format. In addition, PowerPoint enables or disables the Show Markup option
    according to the way the flag is set when it opens files, which means that a presentation saved with hidden markup is
    opened with the markup still hidden. If a file is saved with hidden markup, users might inadvertently distribute sensitive
    comments or information to others via the presentation file.
  impact: If this setting is Enabled, hidden markup will be visible when the file is opened, and if users intend it to be
    hidden they will need to hide it again. (Users can permanently locate and remove undesired markup from files by using
    the Document Inspector feature in PowerPoint.) Enabling this setting enforces the default configuration in PowerPoint.
    In most cases, markup is intended to be visible to users. Markup does not display in presentation mode in PowerPoint,
    even if it is visible in design mode, so it is likely that this setting will have a minimal impact on usability.
  references: []
  page_start: 39
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\powerpoint\options\markupopen

    save'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

    to Enabled.

    39 | P a g e

    User Configuration\Administrative Templates\Microsoft PowerPoint 2016\PowerPoint

    Options\Security\Make Hidden Markup Visible'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\powerpoint\options\markupopen

      save'
    severity: medium
- id: 1.6.6.4
  title: (L1) Ensure 'Scan Encrypted Macros in PowerPoint Open XML Presentations' is set to Enabled (Scan Encrypted Macros)
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether encrypted macros in Open XML presentations are required to be scanned
    with anti-virus software before being opened. The recommended state for this setting is: Enabled. (Scan Encrypted Macros)'
  rationale: When an Office Open XML presentation is rights-managed or password-protected, any macros that are embedded in
    the presentation are encrypted along with the rest of the workbook's contents. By default, these encrypted macros will
    be disabled unless they are scanned by antivirus software immediately before being loaded. If this setting is Disabled,
    PowerPoint will not require encrypted macros to be scanned before loading. PowerPoint will handle them as specified by
    the Office System macro security settings, which can cause macro viruses to load undetected and lead to data loss or reduced
    application functionality.
  impact: Enabling this setting enforces the default configuration in PowerPoint, and is therefore unlikely to cause usability
    issues for most users.
  references: []
  page_start: 41
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\powerpoint\security\powerpoin

    tbypassencryptedmacroscan'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

    to Enabled.

    User Configuration\Administrative Templates\Microsoft PowerPoint 2016\PowerPoint

