- id: 1.6.6.5
  title: (L1) Ensure 'Run Programs' is set to Enabled (Disable (Don't Run Any Programs))
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls the prompting and activation behavior for the "Run Programs" option for action
    buttons in PowerPoint. The recommended state for this setting is: Enabled. (Disable (Don''t Run Any Programs))'
  rationale: Action buttons can be used to launch external programs from PowerPoint presentations. If a malicious person adds
    an action button to a presentation that launches a dangerous program, it could significantly affect the security of a
    user's computer and data.
  impact: Enabling this setting and configuring the drop-down menu to "Disable (don't run any programs)" will cause disruptions
    to users who wish to create or use presentations that launch external programs when action buttons are clicked. These
    users will have to launch any external programs manually at the appropriate times when delivering presentations. 43 |
    P a g e
  references: []
  page_start: 43
