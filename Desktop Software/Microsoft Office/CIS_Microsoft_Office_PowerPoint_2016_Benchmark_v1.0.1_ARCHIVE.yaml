- id: 1.6.6.7
  title: (L1) Ensure 'Unblock Automatic Download of Linked Images' is set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting determines whether PowerPoint automatically downloads links from external sources. The
    recommended state for this setting is: Disabled.'
  rationale: When users insert images into PowerPoint presentations, they can select Link to File instead of Insert. If they
    do so, the image is represented by a link to a file on disk instead of being embedded in the presentation file itself.
    By default, when PowerPoint opens a presentation it does not display any linked images saved on a different computer unless
    the presentation itself is saved in a trusted location (as configured in the Trust Center). If this configuration is changed,
    PowerPoint will load any images that were saved in remote locations, which presents a security risk.
  impact: Disabling this setting enforces the default configuration of PowerPoint, and is therefore unlikely to cause significant
    usability issues for most users. 46 | P a g e
