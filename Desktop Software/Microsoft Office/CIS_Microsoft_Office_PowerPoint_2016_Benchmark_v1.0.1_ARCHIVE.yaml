controls:
- id: 1.5.2
  title: (L1) Ensure 'Disable Slide Update' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether users can link slides in a presentation with their counterparts in a
    PowerPoint Slide Library. The recommended state for this setting is: Enabled.'
  rationale: PowerPoint users can share and reuse slide content by storing individual slide files in a centrally located Slide
    Library on a server running Office SharePoint Server. Using the Slide Update feature, users can associate a slide in a
    presentation on a user's computer with the original slide that resides in the Slide Library on the server. By default,
    each time users open a presentation that contains a shared slide, PowerPoint notifies them if the slide has been updated
    and provides them with the opportunity to ignore the update, append a new slide to the outdated slide, or replace the
    outdated slide with the updated one. In some situations, updating a slide in a presentation from an external source like
    a Slide Library can cause important information to be lost. An attacker could modify the data in the slide library, affecting
    the integrity of all slide presentations that depend upon that library.
  impact: Enabling this setting prevents PowerPoint from checking Slide Libraries for slide updates. Users who work with slides
    associated with Slide Libraries will have to use some other mechanism to update slides in their presentations. Users who
    do not work with Slide Libraries will not be affected by this setting.
  references: []
  page_start: 11
