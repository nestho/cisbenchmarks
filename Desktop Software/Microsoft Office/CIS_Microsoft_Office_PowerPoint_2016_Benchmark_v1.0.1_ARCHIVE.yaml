- id: 1.6.6.2.5
  title: (L1) Ensure 'Trust Access to Visual Basic Project' is set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether automation clients such as Microsoft Visual Studio 2005 Tools for Microsoft
    Office (VSTO) can access the Visual Basic for Applications project system in the specified applications. VSTO projects
    require access to the Visual Basic for Applications project system in Excel, PowerPoint, and Word, even though the projects
    do not use Visual Basic for Applications. Design-time support of controls in both Visual Basic and C# projects depends
    on the Visual Basic for Applications project system in Word and Excel. The recommended state for this setting is: Disabled.'
  rationale: VSTO projects require access to the Visual Basic for Applications project system in Excel, PowerPoint, and Word,
    even though the projects do not use Visual Basic for Applications. Design-time support of controls in both Visual Basic
    and C# projects depends on the Visual Basic for Applications project system in Word and Excel. By default, Excel, Word,
    and PowerPoint do not allow automation clients to have programmatic access to VBA projects. Users can enable this by selecting
    the Trust access to the VBA project object model in the Macro Settings section of the Trust Center. However, doing so
    allows macros in any documents the user opens to access the core Visual Basic objects, methods, and properties, which
    represents a potential security hazard.
  impact: Disabling this setting enforces the default configuration in Excel, Word, and PowerPoint and is therefore unlikely
    to cause significant usability issues for most users.
  references: []
  page_start: 33
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\powerpoint\security\accessvbo

    m'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

    to Disabled.

    33 | P a g e

    User Configuration\Administrative Templates\Microsoft PowerPoint 2016\PowerPoint

    Options\Security\Trust Center\Trust Access to Visual Basic Project'
