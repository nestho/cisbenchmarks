  title: Set 'Do Not Open Files in Unsafe Locations in Protected View' to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting lets you determine if files located in unsafe locations will open in Protected View. If
    you have not specified unsafe locations, only the "Downloaded Program Files" and "Temporary Internet Files" folders are
    considered unsafe locations. If you enable this policy setting, files located in unsafe locations do not open in Protected
    View. If you disable or do not configure this policy setting, files located in unsafe locations open in Protected View.
    The recommended state for this setting is: Disabled. his policy setting controls how Office handles documents when they
    fail file validation. If you enable this policy setting, you can configure the following options for files that fail file
    validation: - Block files completely. Users cannot open the files. - Open files in Protected View and disallow edit. Users
    cannot edit the files. This is also how Office handles the files if you disable this policy setting. - Open files in Protected
    View and allow edit. Users can edit the files. This is also how Office handles the files if you do not configure this
    policy setting. If you disable this policy setting, Office follows the "Open files in Protected View and disallow edit"
    behavior. If you do not configure this policy setting, Office follows the "Open files in Protected View and allow edit"
    behavior. The recommended state for this setting is: Enabled. (Open in Protected View and Unchecked for "Do not allow
    edit)'
  rationale: Enabling this setting allows users to open files located in unsafe locations that do not require Protected View.
    As a result, malicious code could become active on user computers or the network. Disabling or not configuring this setting
    allows users to open and edit files that have failed file validation outside of Protected View. As a result, malicious
    code or users could become active on user computers or the network. For example, a malicious user may purposely put invalid
    data in a file. The invalid data could force the program to fail or execute its code in an unexpected manner, giving the
    malicious user control of the application.
  impact: The Downloaded Program Files folder and the Temporary Internet Files folder are considered unsafe locations. You
    may specify additional unsafe locations. Some functionality is not available when files are opened in Protected View.
    In such cases, users must move the files from unsafe locations to save locations in order to access them with full functionality
    By default, users can only open files in Protected View after the files fail validation to help prevent malicious code
    from running on user computers or the network. In this way, the application is protected from attacks attempting to induce
    unexpected execution paths. You can block files from opening at all, but this also prevents users from accessing any data
    in the file. Using this setting allows the application to open files, and thus users to view valid data and detect invalid
    data that is visible. However, users cannot correct invalid data in the file. To do so, users must open such files on
    another isolated computer where this setting is set to a lower security level.
