    for this policy setting. - Do not block: The file type will not be blocked. - Save blocked: Saving of the file type will
    be blocked. - Open/Save blocked, use open policy: Both opening and saving of the file type will be blocked. The file will
    open based on the policy setting configured in the "default file block behavior" key. - Block: Both opening and saving
    of the file type will be blocked, and the file will not open. - Open in Protected View: Both opening and saving of the
    file type will be blocked, and the option to edit the file type will not be enabled. - Allow editing and open in Protected
    View: Both opening and saving of the file type will be blocked, and the option to edit will be enabled. If you disable
    or do not configure this policy setting, the file type will not be blocked. The recommended state for this setting is:
    Enabled. (Open/Save blocked, use open policy)'
  rationale: DIF and SYLK are text-only file formats that are used to exchange data between different applications, such as
    Excel 2013. If a vulnerability is discovered that affects these kinds of files, you can use this setting to protect your
    organization against attacks by temporarily preventing users from opening files in these formats until a security patch
    is available. By default, users can open DIF (.dif) and SYLK (.slk) files in Excel.
  impact: 'Enabling this setting will prevent users from viewing or editing DIF and SYLK files in Excel 2013. If your users
    must work with business-critical files of these types, enabling this setting could cause significant disruptions. Users
    who do not work with DIF or SYLK files will likely not be affected by this setting. Note: See Plan block file format settings
