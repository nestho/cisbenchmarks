  title: Set 'Allow Trusted Locations on The Network' to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether trusted locations on the network can be used. If you enable this policy
    setting, users can specify trusted locations on network shares or in other remote locations that are not under their direct
    control by clicking the "Add new location" button in the Trusted Locations section of the Trust Center. Content, code,
    and add-ins are allowed to load from trusted locations with minimal security and without prompting the user for permission.
    If you disable this policy setting, the selected application ignores any network locations listed in the Trusted Locations
    section of the Trust Center. If you also deploy Trusted Locations via Group Policy, you should verify whether any of them
    are remote locations. If any of them are remote locations and you do not allow remote locations via this policy setting,
    those policy keys that point to remote locations will be ignored on client computers. Disabling this policy setting does
    not delete any network locations from the Trusted Locations list, but causes disruption for users who add network locations
    to the Trusted Locations list. Users are also prevented from adding new network locations to the Trusted Locations list
    in the Trust Center. We recommended that you do not enable this policy setting (as the "Allow Trusted Locations on my
    network (not recommended)" check box also states). Therefore, in practice, it should be possible to disable this policy
    setting in most situations without causing significant usability issues for most users. If you do not enable this policy
    setting, users can select the "Allow Trusted Locations on my network (not recommended)" check box if desired and then
    specify trusted locations by clicking the "Add new location" button. The recommended state for this setting is: Disabled.'
  rationale: By default, files located in trusted locations and specified in the Trust Center are assumed to be safe. Content,
    code, and add-ins are allowed to load from trusted locations with minimal security and without prompting the user for
    permission. By default, users can specify trusted locations on network shares or in other remote locations that are not
    under their direct control by selecting the Allow Trusted Locations on my network (not recommended) check box in the Trusted
    Locations section of the Trust Center. If a dangerous file is opened from a trusted location, it will not be subject to
    typical security measures and could affect users' computers or data.
  impact: Disabling this setting will cause disruption for users who add network locations to the Trusted Locations list.
    However, this practice is discouraged (as the Allow Trusted Locations on my network (not recommended) check box itself
    states), so in practice it should be possible to disable this setting in most situations without causing significant usability
