    severity: medium
- id: 1.2.8
  title: Set 'Force File Extension to Match File Type' to Enabled(Always match file type )
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls how Excel loads file types that do not match their extension. Excel can load
    files with extensions that do not match the files'' type. For example, if a comma-separated values (CSV) file named example.csv
    is renamed example.xls (or any other file extension supported by Excel 2003 and earlier only), Excel can properly load
    it as a CSV file. If you enable this policy setting, you can choose from three options for working with files that have
    non-matching extensions: - Allow different - Excel opens the files properly without warning users that the files have
    non-matching extensions. If users subsequently edit and save the files, Excel preserves both the true, underlying file
    format and the incorrect file extension. - Allow different, but warn - Excel opens the files properly, but warns users
    about the file type mismatch. This option is the default configuration in Excel. - Always match file type - Excel does
    not open any files that have non-matching extensions. If you disable or do not configure this policy setting, if users
    attempt to open files with the wrong extension, Excel opens the file and displays a warning that the file type is not
    what Excel expected. The recommended state for this setting is: Enable``d. (Always match file type) This policy setting
    controls whether encrypted macros in Open XML workbooks be are required to be scanned with anti-virus software before
    being opened. If you enable this policy setting, you may choose one of these options: - Scan encrypted macros: encrypted
    macros are disabled unless anti-virus software is installed. Encrypted macros are scanned by your anti-virus software
    when you attempt to open an encrypted workbook that contains macros. - Scan if anti-virus software available: if anti-virus
    software is installed, scan the encrypted macros first before allowing them to load. If anti-virus software is not available,
    allow encrypted macros to load. - Load macros without scanning: do not check for anti-virus software and allow macros
    to be loaded in an encrypted file. If you disable or do not configure this policy setting, the behavior will be similar
    to the "Scan encrypted macros" option. The recommended state for this setting is: Enable``d. (Scan encrypted macros (default))'
  rationale: Excel 2013 can load files with extensions that do not match the files' type. For example, if a comma-separated
    values (CSV) file named example.csv is renamed example.xls, Excel can properly load it as a CSV file. Some attacks target
    specific file formats. If Excel is allowed to load files with extensions that do not match their file types, a malicious
    person can deceive users into loading dangerous files that have incorrect extensions. By default, if users attempt to
    open files with the wrong extension, Excel opens the file and displays a warning that the file type is not what Excel
    expected. When an Office Open XML workbook is rights-managed or password-protected, any macros that are embedded in the
    workbook are encrypted along with the rest of the workbook’s contents. By default, these encrypted macros will be disabled
    unless they are scanned by antivirus software immediately before being loaded. If this default configuration is modified,
    Excel 2013 will not require encrypted macros to be scanned before loading. Excel will handle them as specified by the
    Office 2013 System macro security settings, which can cause macro viruses to load undetected and lead to data loss or
    reduced application functionality.
  impact: Earlier versions of Excel did not enforce file type matching. Enabling this setting and selecting Always match file
    type might cause disruptions for users who rely on the functionality of earlier versions of Excel, and could interfere
    with the operation of tools and scripts that rely on it. Disabling this setting enforces the default configuration in
    Excel 2013, and is therefore unlikely to cause usability issues for most users.
  references:
  - 1. CCE-30441-0
  - 1.2.9 Set' Scan Encrypted Macros in Excel Open XML
  - 1. CCE-30438-6
  page_start: 30
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\excel\security\exten

    sionhardening

    Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\excel\security\excel

    bypassencryptedmacroscan'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Enabled.

    User Configuration\Administrative Templates\Microsoft Excel 2013\Excel

    Options\Security\Force File Extension to Match File Type

    To implement the recommended configuration state, set the following Group Policy

    setting to Enabled.

    User Configuration\Administrative Templates\Microsoft Excel 2013\Excel

    Options\Security\Scan Encrypted Macros in Excel Open XML Workbooks'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\excel\security\exten

      sionhardening

      Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\excel\s'
    severity: medium
- id: 1.2.10
  title: Set 'Excel 2 Macrosheets and Add-in Files' to Enabled(Open/Save blocked, use open policy)
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting allows you to determine whether users can open, view, edit, or save Excel files with the
    format specified by the title of this policy setting. If you enable this policy setting, you can specify whether users
    can open, view, edit, or save files. The options that can be selected are below. Note: Not all options may be available
    for this policy setting. - Do not block: The file type will not be blocked. - Save blocked: Saving of the file type will
    be blocked. - Open/Save blocked, use open policy: Both opening and saving of the file type will be blocked. The file will
    open based on the policy setting configured in the "default file block behavior" key. - Block: Both opening and saving
    of the file type will be blocked, and the file will not open. - Open in Protected View: Both opening and saving of the
    file type will be blocked, and the option to edit the file type will not be enabled. - Allow editing and open in Protected
    View: Both opening and saving of the file type will be blocked, and the option to edit will be enabled. If you disable
    or do not configure this policy setting, the file type will be blocked. The recommended state for this setting is: Enabled.
    (Open/Save blocked, use open policy)'
  rationale: By default, users can open, view, or edit this type of document in Excel 2013. This could allow malicious code
    to become active on user computers or the network.
  impact: If your users require open, save, or view ability and you block some or all of these abilities, you could affect
    the productivity of your organization. For more information, see Plan file block settings for Office 2013 at http://technet.microsoft.com/enus/library/cc179230.aspx.
  references:
  - 1. CCE-30378-4
  page_start: 34
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\excel\security\fileb

    lock\xl2macros'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Enabled.

    User Configuration\Administrative Templates\Microsoft Excel 2013\Excel

    Options\Security\Trust Center\File Block Settings\Excel 2 Macrosheets and

    Add-in Files'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\excel\security\fileb

      lock\xl2macros'
    severity: medium
