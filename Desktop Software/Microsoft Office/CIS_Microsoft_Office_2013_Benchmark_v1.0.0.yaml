- id: 2.1.1
  title: Set 'Document Information Panel Beaconing UI' to Enabled (Always show UI)
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'This policy setting controls whether users see a security warning when they open custom Document Information
    Panels that contain a Web beaconing threat. InfoPath can be used to create custom Document Information Panels that can
    be attached to Excel workbooks, PowerPoint presentations, and Word documents. If you enable this policy setting, you can
    choose from three options for controlling when users are prompted about Web beaconing threats: - Never show UI - Always
    show UI - Show UI if XSN is in Internet Zone If you disable or do not configure this policy setting, the behavior is the
    equivalent of setting the policy to Enabled -- Never show UI. The recommended state for this setting is: Enabled. (Always
    show UI) This policy setting controls whether Office 2013 applications load any custom user interface (UI) code included
    with a document or template. Office 2013 allows developers to extend the UI with customization code that is included in
    a document or template. If you enable this policy setting, Office 2013 applications cannot load any UI customization code
    included with documents and templates. The recommended state for this setting is: Enabled. (Disallow in Access, Excel,
    InfoPath, Outlook, PowerPoint, Publisher, Word) 37 | P a g e If you disable or do not configure this policy setting, Office
    2013 applications load any UI customization code included with a document or template when opening it.'
  rationale: InfoPath 2013 can be used to create custom Document Information Panels that can be attached to Excel 2013 workbooks,
    PowerPoint 2013 presentations, and Word 2013 documents. A malicious user could insert a Web beacon into an InfoPath form
    that is used to create a custom Document Information Panel. Web beacons can be used to contact an external server when
    users open the form. Information could be gathered by the form, or information entered by users could be sent to an external
    server and cause them to be vulnerable to additional attacks. The Office 2013 release allows developers to extend the
    UI with customization code that is included in a document or template. If the customization code is written by an inexperienced
    or malicious developer, it could limit the accessibility or availability of important application commands. Commands could
    also be added that launch macros that contain malicious code. By default, Office applications load any UI customization
    code included with a document or template when opening it.
  impact: Enabling this setting and selecting "Always show UI" from the drop-down menu can cause some disruptions for users
    who often open documents containing custom Document Information Panels. Enabling this setting will prevent developers
    from using documents and templates to extend the UI, which some organizations do to increase user productivity. If your
    organization makes use of a modified UI, it might not be feasible for you to enable this setting. Sometimes only specific
    teams in an organization require a modified UI, and this setting could be enabled for the rest of the organization.
