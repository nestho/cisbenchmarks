  description: 'Zone Elevation The recommended state for this setting is: Enabled. (Check: groove.exe, excel.exe, mspub.exe,
    powerpnt.exe, pptview.exe, visio.exe, winproj.exe, outlook.exe, spDesign.exe, exprwd.exe, maccess.exe, onent.exe, mse7.exe)
    This policy setting determines whether Internet Explorer MIME sniffing prevents promotion of a file of one type to a more
    dangerous file type. For example, it does not allow script to run from a file marked as text. For Office 2013, this setting
    is affects any web-based content that is accessed within Office 2013. The recommended state for this setting is: Enabled.
    (Check: groove.exe, excel.exe, mspub.exe, powerpnt.exe, pptview.exe, visio.exe, winproj.exe, outlook.exe, spDesign.exe,
    exprwd.exe, maccess.exe, onent.exe, mse7.exe) This policy setting allows you to manage whether the Information Bar is
    displayed for Internet Explorer processes when file or code installs are restricted. By default, the Information Bar is
    displayed for Internet Explorer processes. The recommended state for this setting is: Enabled. (Check: groove.exe, excel.exe,
    mspub.exe, powerpnt.exe, pptview.exe, visio.exe, winproj.exe, outlook.exe, spDesign.exe, exprwd.exe, maccess.exe, onent.exe,
    mse7.exe) This setting determines whether Microsoft Internet Explorer performs its typical safety checks on Microsoft
    ActiveX® controls when opening URLs that are passed to it by an Office 2013 application. By default, Internet Explorer
    performs additional safety checks when ActiveX controls are initialized. Specifically, it prevents the control from being
    created if the kill bit is set in the registry. It also checks the security settings for the zone of the URL in which
    the control is instantiated to determine whether the control can be safely initialized. For the same behavior of the selectable
    applications, such as Excel and Word when they instantiate the use of Internet Explorer, the policy must be Enabled and
    the applications selected. The recommended state for this setting is: Enabled. (Check: groove.exe, excel.exe, mspub.exe,
    powerpnt.exe, pptview.exe, visio.exe, winproj.exe, outlook.exe, spDesign.exe, exprwd.exe, maccess.exe, onent.exe, mse7.exe)
    16 | P a g e Restrict File Download.T he recommended state for this setting is: Enabled. (Check: groove.exe, excel.exe,
    mspub.exe, powerpnt.exe, pptview.exe, visio.exe, winproj.exe, outlook.exe, spDesign.exe, exprwd.exe, maccess.exe, onent.exe,
    mse7.exe) This setting controls whether Internet Explorer evaluates URLs passed to it by Office 2013 applications for
    Mark of the Web (MOTW) comments. The recommended state for this 19 | P a g e setting is: Enabled.(Check: groove.exe, excel.exe,
    mspub.exe, powerpnt.exe, pptview.exe, visio.exe, winproj.exe, outlook.exe, spDesign.exe, exprwd.exe, maccess.exe, onent.exe,
    mse7.exe) This setting controls whether Internet Explorer opens URLs containing user information that are passed to it
    by an Office 2013 application. The recommended state for this setting is: Enabled.(Check: groove.exe, excel.exe, mspub.exe,
    powerpnt.exe, pptview.exe, visio.exe, winproj.exe, outlook.exe, spDesign.exe, exprwd.exe, maccess.exe, onent.exe, mse7.exe)
    22 | P a g e Window Restrictions. The recommended state for this setting is: Enabled.(Check: groove.exe, excel.exe, mspub.exe,
    powerpnt.exe, pptview.exe, visio.exe, winproj.exe, outlook.exe, spDesign.exe, exprwd.exe, maccess.exe, onent.exe, mse7.exe)
    When Internet Explorer opens a Web page, it places restrictions on what the page can do, based on the page''s Internet
    Explorer security zone. There are several possible security zones, each with different sets of restrictions. The security
    zone for a page is determined by its location. For example, pages that are located on the Internet will normally be in
    the more restrictive Internet security zone. They might not be allowed to perform some operations, such as accessing the
    local hard drive. Pages that are located on your corporate network would normally be in the Intranet security zone, and
    have fewer restrictions. This setting allows you to configure policy settings in the zone consistent with a selected security
    level, for example, Low, Medium Low, Medium, or High. The recommended state for this setting is: Enabled.(Check: groove.exe,
    excel.exe, mspub.exe, powerpnt.exe, pptview.exe, visio.exe, winproj.exe, outlook.exe, spDesign.exe, exprwd.exe, maccess.exe,
    onent.exe, mse7.exe) This policy setting defines whether a reference to an object is accessible when the user navigates
    within the same domain or to a new domain. For Office 2013, this applies to URL accessed within Office 2013 applications.
    By default in Internet Explorer, a reference to an object is no longer accessible when the user browses to a new domain.
    There is a new security context for all scriptable objects so that access to all cached objects is blocked. Additionally,
    access is blocked when browsing within the same domain (fully qualified domain name). A reference to an object is no longer
    accessible after the context has changed due to navigation. The recommended state for this setting is: Enabled.(Check:
    groove.exe, excel.exe, mspub.exe, powerpnt.exe, pptview.exe, visio.exe, winproj.exe, outlook.exe, spDesign.exe, exprwd.exe,
    maccess.exe, onent.exe, mse7.exe) Internet Explorer uses Multipurpose Internet Mail Extensions (MIME) data to determine
    file handling procedures for files received through a Web server. This policy setting determines whether Internet Explorer
    requires that all file-type information provided by Web servers be consistent. For example, if the MIME type of a file
    is text/plain but the MIME data indicates that the file is really an executable file, Internet Explorer changes its extension
    to reflect this executable status. This capability helps ensure that executable code cannot masquerade as other types
    of data that may be trusted. The recommended state for this setting is: Enabled.(Check: groove.exe, excel.exe, mspub.exe,
    powerpnt.exe, pptview.exe, visio.exe, winproj.exe, outlook.exe, spDesign.exe, exprwd.exe, maccess.exe, onent.exe, mse7.exe)
    Add-on Management. The recommended state for this setting is: Enabled.(Check: groove.exe, excel.exe, mspub.exe, powerpnt.exe,
    pptview.exe, visio.exe, winproj.exe, outlook.exe, spDesign.exe, exprwd.exe, maccess.exe, onent.exe, mse7.exe) This setting
    controls whether Internet Explorer attempts to load malformed URLs that are passed to it from Office 2013 applications.
    The recommended state for this setting is: Enabled.(Check: groove.exe, excel.exe, mspub.exe, powerpnt.exe, pptview.exe,
    visio.exe, winproj.exe, outlook.exe, spDesign.exe, exprwd.exe, maccess.exe, onent.exe, mse7.exe) Restrict ActiveX Install.
    The recommended state for this setting is: Enabled.(Check: groove.exe, excel.exe, mspub.exe, powerpnt.exe, pptview.exe,
    visio.exe, winproj.exe, outlook.exe, spDesign.exe, exprwd.exe, maccess.exe, onent.exe, mse7.exe)'
  rationale: 'Internet Explorer places restrictions on each web page that users can use the browser to open. Web pages on
    a user''s local computer have the fewest security restrictions and reside in the Local Machine zone, making this security
    zone a prime target for malicious users and code. Disabling or not configuring this setting could allow pages in the Internet
    zone to navigate to pages in the Local Machine zone to then run code to elevate privileges. This could allow malicious
    code or users to become active on user computers or the network. 12 | P a g e MIME file-type spoofing is a potential threat
    to your organization. It is recommended that you ensure these files are consistently handled to help prevent malicious
    file downloads that may infect your network. The information bar can help users to understand when potentially malicious
    content has been blocked, on the other hand, some users may be confused by the appearance of the bar or unsure how to
    respond. Internet Explorer performs a number of safety checks before initializing an ActiveX control. It will not initialize
    a control if the kill bit for the control is set in the registry, or if the security settings for the zone in which the
    control is located do not allow it to be initialized. This functionality can be controlled separately for instances of
    Internet Explorer spawned by Office 2013 applications (for example, if a user clicks a link in an Office document or selects
    a menu option that loads a Web page). A security risk could occur if potentially dangerous controls are allowed to load.
    Disabling this setting allows websites to present file download prompts via code without the user specifically initiating
    the download. User preferences may also allow the download to occur without prompting or interacting with the user. Even
    if Internet Explorer prompts the user to accept the download, some websites abuse this functionality. Malicious websites
    may continually prompt users to download a file or present confusing dialog boxes to trick users into downloading or running
    a file. If the download occurs and it contains malicious code, the code could become active on user computers or the network.
    Typically, when Internet Explorer loads a Web page from a UNC share that contains a Mark of the Web (MOTW) comment that
    indicates the page was saved from a site on the Internet, Internet Explorer runs the page in the Internet security zone
    instead of the less restrictive Local Intranet security zone. This functionality can be controlled separately for instances
    of Internet Explorer spawned by Office 2013 applications (for example, if a user clicks a link in an Office document or
    selects a menu option that loads a Web page). If Internet Explorer does not evaluate the page for a MOTW, potentially
    dangerous code could be allowed to run. The Uniform Resource Locator (URL) standard allows user authentication to be included
    in URL strings in the form http://username:password@example.com. A malicious user might use this URL syntax to create
    a hyperlink that appears to open a legitimate Web site but actually opens a deceptive (spoofed) Web site. For example,
    the URL http://www.wingtiptoys.com@example.com appears to open http://www.wingtiptoys.com but actually opens http://example.com.
    To protect users from such attacks, Internet Explorer usually blocks any URLs using this syntax. This functionality can
    be controlled separately for instances of Internet Explorer spawned by Office 2013 applications (for example, if a user
    clicks a link in an Office document or selects a menu option that loads a Web page). If user names and passwords in URLs
    are allowed, users could be diverted to dangerous Web pages, which could pose a security risk. 21 | P a g e Malicious
    websites often try to confuse or trick users into giving a site permission to perform an action that allows the site to
    take control of the users'' computers in some manner. Disabling or not configuring this setting allows unknown websites
    to: • Create browser windows that appear to be from the local operating system. • Draw active windows that display outside
    of the viewable areas of the screen that can capture keyboard input. • Overlay parent windows with their own browser windows
    to hide important system information, choices, or prompts. Local Machine zone security applies to all local files and
    content. This feature helps to mitigate attacks where the Local Machine zone is used as an attack vector to load malicious
    HTML code. 24 | P a g e A malicious website may try to use object references from other domains. Users can use Internet
    Explorer to unknowingly download malicious content disguised with an incorrect filename extension or incorrectly marked
    in the MIME header. Once downloaded, an incorrect handler can run the file, enabling the malicious content to cause damage
    to the users system or network. 27 | P a g e Internet Explorer add-ons are pieces of code that run in Internet Explorer
    to provide additional functionality. Rogue add-ons may contain viruses or other malicious code. Disabling or not configuring
    this setting could allow malicious code or users to become active on user computers or the network. For example, a malicious
    user can monitor and then use keystrokes that a user types into Internet Explorer. Even legitimate add-ons may demand
    resources that compromise the performance of Internet Explorer and the operating systems of user computers. To protect
    users from attacks, Internet Explorer usually does not attempt to load malformed URLs. This functionality can be controlled
    separately for instances of Internet Explorer spawned by Office 2013 applications (for example, if a user clicks a link
    in an Office document or selects a menu option that loads a Web page). If Internet Explorer attempts to load a malformed
    URL, a security risk could occur in some cases. Microsoft ActiveX controls allow unmanaged, unprotected code to run on
    the user computers. ActiveX controls do not run within a protected container in the browser like other types of HTML or
    Microsoft Silverlight-based controls. 31 | P a g e Disabling or not configuring this setting does not block prompts for
    ActiveX control installations and these prompts display to users. This could allow malicious code to become active on
    user computers or the network.'
  impact: Websites that rely on navigation to other higher privileged sites may not properly function. To allow such websites
    to properly function, use Group Policy to add them to the Trusted sites zone. Note Enabling this setting also disables
    JavaScript navigation if no security context is present. When set to Enabled, MIME sniffing will not promote a file of
    one type to a more dangerous file type. If you disable this policy setting, MIME sniffing configures Internet Explorer
    processes to allow promotion of a file from one type to a more dangerous file type. For example, a text file could be
    promoted to an executable file, which is dangerous because any code in the supposed text file would be executed. The security
    bar will be enabled for each of the specified applications. Enabling this setting can cause some disruptions for users
    who open Web pages that contain potentially dangerous ActiveX controls from Office 2013 applications. However, because
    any affected controls are usually blocked by default when Internet Explorer opens Web pages, most users should not experience
    significant usability issues. User initiated downloads can still occur so the majority of legitimate user download interactions
    remain unaffected. Hiding website-initiated prompt messages makes it impossible for a malicious website to initiate a
    download by itself. Such a site can no longer confuse a user into downloading a file that could then open on the user's
    computer to execute an attack. However, some valid websites may initiate file downloads. If this setting is enabled, users
    cannot view download prompts, and remain unaware when a download is available. If such sites reside in an organization's
    intranet, they should display a link to prompt users to initiate valid downloads if the automatic download process does
    not occur. This type of functionality is already in common use on many major internet sites and should not confuse users.
    It is possible that some advanced users may expect their user preferences to control this behavior, and for this reason,
    they may be confused when this preference is overridden by this setting. Enabling this setting can cause some Web pages
    saved on UNC shares to run in a more restrictive security zone when opened from Office 2013 applications than they would
    if the setting were disabled or not configured. However, a page with a MOTW indicating it was saved from an Internet site
    is presumed to have been designed to run in the Internet zone in the first place, so most users should not experience
    significant usability issues. Note For more information about using the Mark of the Web to control the security zone in
    which Internet Explorer runs Web pages, see the article "Mark of the Web" in the MSDN Library at http://msdn.microsoft.com/en-us/library/ms537628(VS.85).aspx.
    Enabling this setting can cause some disruptions for users who open URLs containing user authentication information from
    Office 2013 applications. Because such URLs are blocked by default when Internet Explorer opens Web pages through conventional
    means, however, most users should not experience significant usability issues. It is unlikely that any valid applications
    would use such deceptive methods to accomplish a task. For this reason, it is unlikely that organization may encounter
    any major limitations due to using this setting. If you enable this policy setting, the Local Machine zone security applies
    to all local files and content processed by the specified applications. If you disable or do not configure this policy
    setting, Local Machine zone security is not applied to local files or content processed by the specified applications.
    If you enable this policy setting, object reference is no longer accessible when navigating within or across domains for
    each specified application. If you disable or do not configure this policy setting, object reference is retained when
    navigating within or across domains in the Restricted Zone sites. Internet Explorer use both the extension of the filename
    and the MIME information to decide how to handle a file. Enabling this setting requires that information in the MIME header
    matches the file extension provided. Since mismatched files will be blocked by enabling this setting, you should insure
    that any web server under your control is set up correctly. See "Event 1021 - MIME Handling Restrictions" at http://msdn.microsoft.com/en-us/library/dd565661(VS.85).aspx
    for more information Some legitimate programs, including ones from Microsoft, use add-ons to display documents, audio,
    and video in Internet Explorer. The organization's Group Policy should incorporate approved, commonly-used add-ons to
    avoid limiting important user functionality. Enabling this setting does not block any legitimate URLs, and is therefore
    unlikely to cause usability issues for any Office 2013 users. Microsoft ActiveX controls allow unmanaged, unprotected
    code to run on the user computers. ActiveX controls do not run within a protected container in the browser like other
    types of HTML or Microsoft Silverlight-based controls. Disabling or not configuring this setting does not block prompts
    for ActiveX control installations and these prompts display to users. This could allow malicious code to become active
    on user computers or the network.
