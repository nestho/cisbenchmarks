- id: 2.7.8
  title: Set 'Disable All Trust Bar Notifications For Security Issues' to Disabled
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'This policy setting controls whether Office 2013 applications notify users when potentially unsafe features
    or content are detected, or whether such features or content are silently disabled without notification. The Message Bar
    in Office 2013 applications is used to identify security issues, such as unsigned macros or potentially unsafe add-ins.
    When such issues are detected, the application disables the unsafe feature or content and displays the Message Bar at
    the top of the active window. The Message Bar informs the users about the nature of the security issue and, in some cases,
    provides the users with an option to enable the potentially unsafe feature or content, which could harm the user''s computer.
    If you enable this policy setting, Office 2013 applications do not display information in the Message Bar about potentially
    unsafe content that has been detected or has automatically been blocked. If you disable this policy setting, Office 2013
    applications display information in the Message Bar about content that has automatically been blocked. If you do not configure
    this policy setting, if an Office 2013 application detects a security issue, the Message Bar is displayed. However, this
    configuration can be modified by users in the Trust Center. The recommended state for this setting is: Disabled. This
    policy setting controls whether macros can run in an Office 2013 application that is opened programmatically by another
    application. If you enable this policy setting, you can choose from three options for controlling macro behavior in Excel,
    PowerPoint, and Word when the application is opened programmatically: 72 | P a g e - Disable macros by default - All macros
    are disabled in the programmatically opened application. - Macros enabled (default) - Macros can run in the programmatically
    opened application. This option enforces the default configuration in Excel, PowerPoint, and Word. - User application
    macro security level - Macro functionality is determined by the setting in the "Macro Settings" section of the Trust Center.
    If you disable or do not configure this policy setting, when a separate program is used to launch Microsoft Excel, PowerPoint,
    or Word programmatically, any macros can run in the programmatically opened application without being blocked. The recommended
    state for this setting is: Enabled. (Disable Macros by Default)'
  rationale: The Message Bar in Office 2013 applications is used to identify security issues, such as unsigned macros or potentially
    unsafe add-ins. When such issues are detected, the application disables the unsafe feature or content and displays the
    Message Bar at the top of the active window. The Message Bar informs the users about the nature of the security issue
    and, in some cases, provides the users with an option to enable the potentially unsafe feature or content, which could
    harm the user's computer. By default, if a Office 2013 application detects a security issue, the Message Bar is displayed.
    However, this configuration can be modified by users in the Trust Center. 71 | P a g e By default, when a separate program
