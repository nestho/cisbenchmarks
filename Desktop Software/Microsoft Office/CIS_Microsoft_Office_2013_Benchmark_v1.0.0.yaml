- id: 1.2.2
  title: Set 'Hide Option to Enable or Disable Updates' to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting allows you to hide the user interface (UI) options to enable or disable Office automatic
    updates from users. These options are found in the Product Information area of all Office applications installed via Click-to-Run.
    This policy setting has no effect on Office applications installed via Windows Installer. If you enable this policy setting,
    the Enable Update and Disable Updates options in the UI are hidden from users. If you disable or do not configure this
    policy setting, the Enable Update and Disable Updates options are visible, and users can enable or disable Office automatic
    updates from the UI. The recommended state for this setting is: Enabled.'
  rationale: Security updates help prevent malicious attacks on Office applications. Timely application of Office updates
    helps ensure the security of devices and the applications running on the devices. Without these updates, devices and the
    applications running on those devices are more susceptible to security attacks. Enabling this policy setting helps prevent
    users from disabling automatic updates for Office. 34 | P a g e
  impact: Office updates for Click-to-Run installations of Microsoft Office 2013 are applied in the background and have no
