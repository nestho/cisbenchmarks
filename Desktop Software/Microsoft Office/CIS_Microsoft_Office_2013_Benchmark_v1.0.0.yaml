- id: 2.3.1
  title: Set 'Prevent Users From Changing Permissions on Rights Managed Content' to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether Office 2013 users can change permissions for content that is protected
    with Information Rights Management (IRM). The Information Rights Management feature of Office 2013 allows individuals
    and administrators to specify access permissions to Word documents, Excel workbooks, PowerPoint presentations, InfoPath
    templates and forms, and Outlook e-mail messages. This functionality helps prevent sensitive information from being printed,
    forwarded, or copied by unauthorized people. If you enable this policy setting, users can open and edit documents for
    which they have the appropriate permissions, but they cannot create new rights-managed content, add IRM to existing documents,
    change existing IRM permissions, or remove IRM from documents. If you disable or do not configure this policy setting,
    Office 2013 users can add, remove, or change IRM permissions for documents if they are authorized to do so. The recommended
    state for this setting is: Disabled.'
  rationale: The Information Rights Management feature of the Office 2013 release allows individuals and administrators to
    specify access permissions to Word 2013 documents, Excel 2013 workbooks, PowerPoint 2013 presentations, InfoPath 2013
    templates and forms, and Outlook 2013 e-mail messages. This functionality helps prevent sensitive information from being
    printed, forwarded, or copied by unauthorized people. This setting can be used to prevent Office 2013 users from changing
    the IRM permissions of a document. If this setting is Enabled, users can open and edit documents for which they have the
    appropriate permissions, but they cannot create new rights-managed content, add IRM to existing documents, change existing
    IRM permissions, or remove IRM from 39 | P a g e documents. This configuration can prevent users from making effective
    use of IRM to protect documents
  impact: Disabling this setting enforces the Office 2013 default configuration, and is therefore unlikely to cause significant
    usability issues for most users.
