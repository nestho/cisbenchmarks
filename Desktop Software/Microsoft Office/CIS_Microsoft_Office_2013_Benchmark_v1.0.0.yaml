- id: 2.12.4
  title: Set 'Improve Proofing Tools' to Disabled
  scoring: scored
  profile:
  - Level 1
  description: This policy setting controls whether the Help Improve Proofing Tools feature sends usage data to Microsoft.
    The Help Improve Proofing Tools feature collects data about use of the Proofing Tools, such as additions to the custom
    dictionary, and sends it to Microsoft. After about six months, the feature stops sending data to Microsoft and deletes
    the data collection file from the user's computer. 90 | P a g e If you enable this policy setting, this feature is enabled
    if users choose to participate in the Customer Experience Improvement Program (CEIP). If your organization has policies
    that govern the use of external resources such as the CEIP, allowing the use of the Help Improve Proofing Tools feature
    might cause them to violate these policies. If you disable this policy setting, the Help Improve Proofing Tools feature
    does not collect proofing tool usage information and transmit it to Microsoft. If you do not configure this policy setting,
    the behavior is the equivalent of setting the policy to "Disabled".
  rationale: The Help Improve Proofing Tools feature collects data about use of the Proofing Tools, such as additions to the
    custom dictionary, and sends it to Microsoft. After about six months, the feature stops sending data to Microsoft and
    deletes the data collection file from the user's computer. Although this feature does not intentionally collect personal
    information, some of the content that is sent could include items that were marked as spelling or grammar errors, such
    as proper names and account numbers. However, any numbers such as account numbers, street addresses, and phone numbers
    are converted to zeroes when the data is collected. Microsoft uses this information solely to improve the effectiveness
    of the Office Proofing Tools, not to identify users. By default, this feature is enabled if users choose to participate
    in the Customer Experience Improvement Program (CEIP). If your organization has policies that govern the use of external
    resources such as the CEIP, allowing the use of the Help Improve Proofing Tools feature might cause them to violate these
    policies.
  impact: The Customer Experience Improvement Program sends proofing tool data to Microsoft silently and without affecting
    application usage, so disabling the collection and transmission of proofing tool data is unlikely to cause usability issues
    for most users.
