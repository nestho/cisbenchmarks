  title: Set 'Never Allow Users to Specify Groups When Restricting Permission for Documents' to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether Office 2013 users can assign permissions to distribution lists when using
    Information Rights Management. 40 | P a g e If you enable this policy setting, Office 2013 users cannot specify a distribution
    list as an authorized party in the Permission dialog box. If you disable or do not configure this policy setting, Office
    2013 users can specify distribution lists when using Information Rights Management (IRM) to restrict access to Excel workbooks,
    InfoPath templates, Outlook e-mail messages, PowerPoint presentations, or Word documents. The recommended state for this
    setting is: Enabled.'
  rationale: By default, Office 2013 users can specify distribution lists when using Information Rights Management (IRM) to
    restrict access to Excel 2013 workbooks, InfoPath 2013 templates, Outlook 2013 e-mail messages, PowerPoint 2013 presentations,
    or Word 2013 documents. If users are not fully aware of the distribution list's membership before assigning it permission
    to open or modify a document, sensitive information could be at risk.
  impact: Enabling this setting could cause some disruptions for Office 2013 users who are accustomed to specifying distribution
    groups when defining permissions for a document. These users will have to list users individually in the Permission dialog
    box to assign them permission to read or modify the document. Users who do not use Information Rights Management will
    not be affected by this setting.
