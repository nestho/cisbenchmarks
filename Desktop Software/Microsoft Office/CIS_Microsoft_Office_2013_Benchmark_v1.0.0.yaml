  title: Set 'Allow Users With Earlier Versions of Office to Read with Browsers...." to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting will allow users with earlier versions of Office to read documents with browsers supporting
    Information Rights Management. If you enable this policy setting, users with earlier versions of Office can read documents
    with browsers supporting Information Rights Management. Note that this will make all documents with restricted permissions
    larger. If you disable or do not configure this policy setting, users with earlier versions of Office cannot read documents
    with browsers supporting Information Rights Management. The recommended state for this setting is: Disabled.'
  rationale: The Windows Rights Management Add-on for Internet Explorer provides a way for users who do not use the Office
    2013 release to view, but not alter, files with restricted permissions. By default, IRM-enabled files are saved in a format
    that cannot be viewed by using the Windows Rights Management Add-on. If this setting is enabled, an embedded rights-managed
    HTML version of the content is saved with each IRM-enabled file, which can be viewed in Internet Explorer using the add-on.
    This configuration increases the size of rights-managed files, in some cases significantly.
  impact: Disabling this setting enforces the default configuration, and is therefore unlikely to cause significant usability
    issues for most users.
