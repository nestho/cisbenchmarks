- id: 2.3.3
  title: Set 'Always Require Users to Connect to Verify Permission' to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether users are required to connect to the Internet or a local network to have
    their licenses confirmed every time they attempt to open Excel workbooks, InfoPath forms or templates, Outlook e-mail
    messages, PowerPoint presentations, or Word documents that are protected by Information Rights Management (IRM). This
    policy is useful if you want to log the usage of files with restricted permissions on the server. If you enable this policy
    setting, users are required to connect to verify permissions. This policy setting will only affect protected files created
    on machines where the policy is enabled. If you disable or do not configure this policy setting, users are not required
    to connect to the network to verify permissions. The recommended state for this setting is: Enabled.'
  rationale: By default, users are not required to connect to the network to verify permissions. If users do not need their
    licenses confirmed when attempting to open Office 2013 documents, they might be able to access documents after their licenses
    have been revoked. Also, it is not possible to log the usage of files with restricted permissions if users' licenses are
    not confirmed.
  impact: Enabling this setting could create problems for users who need to open rights-managed files when they are not connected
    to the Internet, such as mobile users. Consider surveying your organization to determine users' need for offline use of
    rights-managed files before enabling this setting.
