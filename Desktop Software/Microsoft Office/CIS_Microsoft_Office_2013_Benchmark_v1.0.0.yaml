- id: 2.6.1
  title: Set 'Enable Customer Experience Improvement Program' to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether users can participate in the Microsoft Office Customer Experience Improvement
    Program to help improve Microsoft Office. When users choose to participate in the Customer Experience Improvement Program
    (CEIP), Office 2013 applications automatically send information to Microsoft about how the applications are used. This
    information is combined with other CEIP data to help Microsoft solve problems and to improve the products and features
    customers use most often. This feature does not collect users'' names, addresses, or any other identifying information
    except the IP address that is used to send the data. If you enable this policy setting, users have the opportunity to
    opt into participation in the CEIP the first time they run an Office application. If your organization has policies that
    govern the use of external resources such as the CEIP, allowing users to opt in to the program might cause them to violate
    these policies. If you disable this policy setting, Office 2013 users cannot participate in the Customer Experience Improvement
    Program. If you do not configure this policy setting, the behavior is the equivalent of setting the policy to "Enabled".
    The recommended state for this setting is: Disabled.'
  rationale: When users choose to participate in the Customer Experience Improvement Program (CEIP), Office 2013 applications
    automatically send information to Microsoft about how the applications are used. This information is combined with other
    CEIP data to help Microsoft solve problems and to improve the products and features customers use most often. This feature
    does not collect users' names, addresses, or any other identifying information except the IP address that is used to send
    the data. By default, users have the opportunity to opt into participation in the CEIP the first time they run an Office
    application. If your organization has policies that govern the use of external resources such as the CEIP, allowing users
    to opt in to the program might cause them to violate these policies. 54 | P a g e
  impact: The Customer Experience Improvement Program sends data to Microsoft silently and without affecting application usage,
