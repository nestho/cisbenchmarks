  description: 'This policy setting allows you to specify an encryption type for Office Open XML files. If you enable this
    policy setting, you can specify the type of encryption that Office applications use to encrypt password-protected files
    in the Office Open XML file formats used by Excel, PowerPoint, and Word. The chosen encryption type must have a corresponding
    cryptographic service provider (CSP) installed on the computer that encrypts the file. See the HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Cryptography\Defaults\Provider\
    registry key for a list of CSPs installed on the local computer. Specify the encryption type to use by entering it in
    the provided text box in the following form: <Encryption Provider>,<Encryption Algorithm>,<Encryption Key Length> For
    example: Microsoft Enhanced Cryptographic Provider v1.0,RC4,128 If you disable or do not configure this policy setting,
    the default CSP is used. The default cryptographic service provider (CSP) is Microsoft Enhanced RSA and AES Cryptographic
    Provider, AES-128, 128-bit. Note: This policy setting does not take effect unless the registry key HKEY_CURRENT_USER\Software\Microsoft\Office\15.0\<office
    application name>\Security\Crypto\CompatMode is set to 0. By default the CompatMode registry key is set to 1. The recommended
    state for this setting is: Enabled'
  rationale: If unencrypted files are intercepted, sensitive information in the files can be compromised. To protect information
    confidentiality, Office 2013 application files can be encrypted and password protected. Only users who know the correct
    password will be able to decrypt such files. On computers that run Windows Vista, the default cryptographic service provider
    (CSP) is Microsoft Enhanced RSA and AES Cryptographic Provider, AES-128, 128-bit. On computers that run Windows XP, the
    default CSP is Microsoft Enhanced RSA and AES Cryptographic Provider (Prototype), AES-128, 128-bit. 66 | P a g e
  impact: Consider the needs of your organization and users when selecting an encryption method to enforce. If you work for
    a government agency, contract for a government agency, or otherwise work with very sensitive information, you might need
