- id: 1.2.1
  title: Set 'Enable Automatic Updates' to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether the Office automatic updates are enabled or disabled for all Office products
    installed by using Click-to-Run. This policy has no effect on Office products installed via Windows Installer. If you
    enable or do not configure this policy setting, Office periodically checks for updates. When updates are detected, Office
    downloads and applies them in the background. If you disable this policy setting, Office won''t check for updates. The
    recommended state for this setting is: Enabled.'
  rationale: Security updates help prevent malicious attacks on Office applications. Timely application of Office updates
    helps ensure the security of devices and the applications running on the devices. Without these updates, devices and the
    applications running on those devices are more susceptible to security attacks.
  impact: Office updates for Click-to-Run installations of Microsoft Office 2013 are applied in the background and have no
    adverse affect on users. 33 | P a g e
  references:
  - 1. CCE-31046-6
  page_start: 33
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKLM\software\policies\microsoft\office\15.0\common\officeupdate\enableautomaticupdate

    s'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Enabled.

    Computer Configuration\Administrative Templates\Microsoft Office 2013

    (Machine)\Updates\Enable Automatic Updates'
