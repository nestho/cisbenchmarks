- id: '2.4'
  title: Miscellaneous 2.4.1 Set 'Control Blogging' to Enabled (All Blogging Disabled)
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  description: 'This policy setting controls whether users can compose and post blog entries from Word. If you enable this
    policy setting, you can choose from three options for controlling blogging: * Enabled - Users may compose and post blog
    entries from Word to any available blog provider. This is the default configuration in Word. * Only SharePoint blogs allowed
    - Users can only post blog entries to SharePoint sites. * Disabled - The blogging feature in Word is disabled entirely.
    If you disable or do not configure this policy setting, the behavior is the equivalent of setting the policy to Enabled-Enabled.
    The recommended state for this setting is: Enabled. (All Blogging Disabled) 46 | P a g e This policy setting controls
    whether users can provide credentials to Office using either their Microsoft Account or the user ID assigned by your organization
    for accessing Office 365. If you enable this policy setting, you can specify one of the following options: - If you select
    "Both IDs allowed", users can sign in and access Office content by using either ID - If you select "Microsoft Account
    only", users can sign in only by using their Microsoft Account. - If you select "Organization only", users can sign in
    only by using the user ID assigned by your organization for accessing Office 365. - If you select "None allowed", users
    cannot sign in by using either ID. If you disable or do not configure this policy setting, users can sign in by using
    either ID. Note: This policy does not apply to licensing. A user can license their product using any applicable ID if
    they have a valid license associated with that account. Providing credentials for licensing purposes when that ID type
    has been disabled, however, will not affect the signed in state of Office. The recommended state for this setting is:
    Enabled. (Both IDs Allowed) This policy setting controls whether users with the Microsoft Office Compatibility Pack for
    Word, Excel, and PowerPoint 2013 File Formats installed can open Office Open XML files saved with pre-release versions
    of PowerPoint 2013. PowerPoint Open XML files usually have the following extensions: .pptx, .pptm, .potx, .potm, .ppsx,
    .ppsm, .ppam, .thmx, .xml. 49 | P a g e If you enable this policy setting, users of the Compatibility Pack will not be
    able to open Office Open XML files created in pre-release versions of PowerPoint 2013. If you disable this policy setting,
    users with the Compatibility Pack installed can open files saved by some pre-release versions of PowerPoint, but not by
    others, which can lead to inconsistent file opening functionality. If you do not configure this policy setting, the behavior
    is the equivalent of setting the policy to Enabled. The recommended state for this setting is: Enabled. This policy setting
    controls whether users with the Microsoft Office Compatibility Pack for Word, Excel, and PowerPoint 2013 File Formats
    installed can open Office Open XML files saved with pre-release versions of Excel 2013. Excel Open XML files usually have
    the following extensions: .xlsx, .xlsm, .xltx, .xltm, .xlam. If you enable this policy setting, users of the Compatibility
    Pack will not be able to open Office Open XML files created in pre-release versions of Excel 2013. If you disable this
    policy setting, users with the Compatibility Pack installed can open files saved by some pre-release versions of Excel,
    but not by others, which can lead to inconsistent file opening functionality. If you do not configure this policy setting,
    the behavior is the equivalent of setting the policy to Enabled. The recommended state for this setting is: Enabled.'
  rationale: 'The blogging feature in Word 2013 enables users to compose blog entries and post them to their blogs directly
    from Word, without using any additional software. By default, users can post blog entries to any compatible blogging service
    provider, including Windows Live Spaces, Blogger, a SharePoint or Community Server site, and others. If your organization
    has policies that govern the posting of blog entries, allowing users to access the blogging feature in Word 2013 might
    enable them to violate those policies. Signing into Office allows users to connect to cloud services (such as SharePoint
    services in Office 365). By signing into Office, the user''s status and other information could be made publicly available.
    In addition, organizations may not want users to access cloud services because of the potential downloading of malware
    or uploading of confidential information to cloud services. For example, a user could upload a highly confidential document
    from the organization''s intranet to OneDrive and then share that file with other users on the Internet. The Microsoft
    Office Compatibility Pack for Word, Excel, and PowerPoint 2013 File Formats enables users of Microsoft PowerPoint 2000,
    PowerPoint 2002, and Office PowerPoint 2003 to open files saved in the Office Open XML format used by PowerPoint 2013.
    PowerPoint Open XML files usually have the following extensions: • .pptx • .pptm • .potx • .potm • .ppsx • .ppsm • .ppam
    • .thmx • .xml By default, the Compatibility Pack does not open files that were saved in pre-release versions of the new
    Office Open XML format, which underwent some minor changes prior to the final release of PowerPoint 2013. If this configuration
    is changed through a registry modification or by some other mechanism, users with the Compatibility Pack installed can
    open files saved by some pre-release versions of PowerPoint, but not by others, which can lead to inconsistent file opening
    functionality. 50 | P a g e The Microsoft Office Compatibility Pack for Word, Excel, and PowerPoint 2013 File Formats
    enables users of Microsoft Excel 2000, Microsoft Excel 2002, and Microsoft Office Excel 2003 to open files saved in the
    Office Open XML format used by Excel 2013. Excel Open XML files usually have the following extensions: • .xlsx • .xlsm
    • .xltx • .xltm • .xlam By default, the Compatibility Pack does not open files that were saved in pre-release versions
    of the new Office Open XML format, which underwent some minor changes prior to the final release of Excel 2013. If this
    configuration is changed through a registry modification or by some other mechanism, users with the Compatibility Pack
    installed can open files saved by some pre-release versions of Excel, but not by others, which can lead to inconsistent
    file opening functionality. 52 | P a g e'
  impact: Disabling the blogging feature in Word 2013 may cause disruptions for users who use Word to compose and post blog
    entries. Any users who have a legitimate need to post blog entries will have to use another tool. Users will not be unable
    to connect to cloud services (such as SharePoint services in Office 365) and access the files and services provided by
    the cloud services. Enabling this setting enforces the default configuration, and is therefore unlikely to cause usability
    issues for most users. Note See Plan block file format settings in the Office 2013 Resource Kit for more information about
    using Group Policy to manage and enforce file format requirements. Also, see the "File Block Technology" section in Chapter
    4 of the Microsoft Office 2013 Security Guide for information about the Microsoft Office Isolated Conversion Environment
