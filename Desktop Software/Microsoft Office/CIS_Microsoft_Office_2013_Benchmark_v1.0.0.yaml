  title: Set 'Disable Smart Document's Use of Manifests' to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether Office 2013 applications can load an XML expansion pack manifest file
    with a Smart Document. An XML expansion pack is the group of files that constitutes a Smart Document in Excel and Word.
    You package one or more components that provide the logic needed for a Smart Document by using an XML expansion pack.
    These components can include any type of file, including XML schemas, Extensible Stylesheet Language Transforms (XSLTs),
    dynamic-link libraries (DLLs), and image files, as well as additional XML files, HTML files, Word files, Excel files,
    and text files. The key component to building an XML expansion pack is creating an XML expansion pack manifest file. By
    creating this file, you specify the locations of all files that make up the XML expansion pack, as well as information
    that instructs Office 2013 how to set up the files for your Smart Document. The XML expansion pack can also contain information
    about how to set up some files, such as how to install and register a COM object required by the XML expansion pack. If
    you enable this policy setting, Office 2013 applications cannot load XML expansion packs with Smart Documents. If you
    disable or do not configure this policy setting, Office 2013 applications can load an XML expansion pack manifest file
    with a Smart Document. The recommended state for this setting is: Enabled.'
  rationale: An XML expansion pack is the group of files that constitutes a Smart Document in Excel 2013 and Word 2013. You
    package one or more components that provide the logic needed 84 | P a g e for a Smart Document by using an XML expansion
    pack. These components can include any type of file, including XML schemas, Extensible Stylesheet Language Transforms
    (XSLTs), dynamic-link libraries (DLLs), and image files, as well as additional XML files, HTML files, Word files, Excel
    files, and text files. The key component to building an XML expansion pack is creating an XML expansion pack manifest
    file. By creating this file, you specify the locations of all files that make up the XML expansion pack, as well as information
    that instructs Office 2013 how to set up the files for your Smart Document. The XML expansion pack can also contain information
    about how to set up some files, such as how to install and register a COM object required by the XML expansion pack. XML
    expansion packs can be used to initialize and load malicious code, which might affect the stability of a computer and
    lead to data loss. By default, Office 2013 applications can load an XML expansion pack manifest file with a Smart Document.
  impact: Enabling this setting prevents users from working with Smart Documents. It might not be feasible to enable this
