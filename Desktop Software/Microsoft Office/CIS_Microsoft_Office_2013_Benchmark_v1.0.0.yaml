  title: Set 'Disable The Office Client From Polling The SharePoint Server For Published Links' to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether Office 2013 applications can poll Office servers to retrieve lists of
    published links. If you enable this policy setting, Office 2013 applications cannot poll an Office server for published
    links. If you disable or do not configure this policy setting, users of Office 2013 applications can see and use links
    to Microsoft SharePoint Server sites from those applications. You can configure published links to Office applications
    during initial deployment, and can add or change links as part of regular operations. These links appear on the My SharePoint
    Sites tab of the Open, Save, and Save As dialog boxes when opening and saving documents from these applications. Links
    can be targeted so that they only appear to users who are members of particular audiences. Note - This policy setting
    applies to Microsoft SharePoint Server specifically. It does not apply to Microsoft SharePoint Foundation. The recommended
    state for this setting is: Enabled. 78 | P a g e'
  rationale: By default, users of Office 2013 applications can see and use links to Microsoft Office SharePoint Server sites
    from those applications. Administrators configure published links to Office applications during initial deployment, and
    can add or change links as part of regular operations. These links appear on the My SharePoint Sites tab of the Open,
    Save, and Save As dialog boxes when opening and saving documents from these applications. Links can be targeted so that
    they only appear to users who are members of particular audiences. If a malicious person gains access to the list of published
    links, they could modify the links to point to unapproved sites, which could make sensitive data vulnerable to exposure.
  impact: If this setting is Enabled, users will not be able to use the list of published links to open and save files directly
