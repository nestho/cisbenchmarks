    his policy setting controls how Office handles documents when they fail file validation. If you enable this policy setting,
    you can configure the following options for files that fail file validation: - Block files completely. Users cannot open
    the files. - Open files in Protected View and disallow edit. Users cannot edit the files. This is also how Office handles
    the files if you disable this policy setting. - Open files in Protected View and allow edit. Users can edit the files.
