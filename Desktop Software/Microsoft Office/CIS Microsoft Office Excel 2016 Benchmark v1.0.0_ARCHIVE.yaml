  title: (L1) Ensure' Scan Encrypted Macros in Excel Open XML Workbooks' is set to Enable (Scan encrypted macros (default))
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether encrypted macros in Open XML workbooks be are required to be scanned
    with anti-virus software before being opened. If you enable this policy setting, you may choose one of these options:
    - Scan encrypted macros: encrypted macros are disabled unless anti-virus software is installed. Encrypted macros are scanned
    by your anti-virus software when you attempt to open an encrypted workbook that contains macros. - Scan if anti-virus
    software available: if anti-virus software is installed, scan the encrypted macros first before allowing them to load.
    If anti-virus software is not available, allow encrypted macros to load. - Load macros without scanning: do not check
    for anti-virus software and allow macros to be loaded in an encrypted file. If you disable or do not configure this policy
    setting, the behavior will be similar to the "Scan encrypted macros" option. The recommended state for this setting is:
    Enabled. (Scan encrypted macros (default))'
  rationale: When an Office Open XML workbook is rights-managed or password-protected, any macros that are embedded in the
    workbook are encrypted along with the rest of the workbook’s contents. By default, these encrypted macros will be disabled
    unless they are scanned by antivirus software immediately before being loaded. If this default configuration is modified,
    Excel 2016 will not require encrypted macros to be scanned before loading. Excel will handle them as specified by the
    Office 2016 System macro security settings, which can cause macro viruses to load undetected and lead to data loss or
    reduced application functionality. 80 | P a g e
  impact: Disabling this setting enforces the default configuration in Excel 2016, and is therefore unlikely to cause usability
    issues for most users.
