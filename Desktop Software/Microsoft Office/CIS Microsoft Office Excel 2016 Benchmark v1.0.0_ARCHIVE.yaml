benchmark:
  id: cis-microsoft-office-excel-2016-benchmark
  title: CIS Microsoft Office Excel 2016 Benchmark
  version: 1.0.0
  technology: Microsoft Office
  category: Desktop Software
  os: Microsoft Office
  source_pdf: CIS Microsoft Office Excel 2016 Benchmark v1.0.0_ARCHIVE.pdf
  total_pages: 85
  controls_count: 15
controls:
- id: 1.2.1
  title: (L1) Ensure 'Do Not Show Data Extraction Options When Opening Corrupt Workbooks' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether Excel presents users with a list of data extraction options before beginning
    an Open and Repair operation when users choose to open a corrupt workbook in repair or extract mode. If you enable this
    policy setting, Excel opens the file using the Safe Load process and does not prompt users to choose between repairing
    or extracting data. If you disable or do not configure this policy setting, Excel prompts the user to select either to
    repair or to extract data, and to select either to convert to values or to recover formulas. The recommended state for
    this setting is: Enabled.'
  rationale: By default, when users choose to open a corrupt workbook with the Open and Repair command, Excel 2016 prompts
    them to choose between repairing or extracting data. Also, for cells that contain formulas, users are prompted to either
    convert the contents to values 10 | P a g e or to recover formulas. If users choose to extract data instead of attempting
    to repair the workbook, important formulas, formatting, and VBA code could be lost unnecessarily.
  impact: Enabling this setting will prevent Excel 2016 users from choosing how workbooks are recovered, which could increase
    desktop support requests.
  references: []
  page_start: 10
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\excel\options\extractdatadisa

    bleui'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Enabled.

    User Configuration\Administrative Templates\Microsoft Excel 2016\Data Recovery\Do Not

    Show Data Extraction Options When Opening Corrupt Workbooks'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\excel\options\extractdatadisa

      bleui'
    severity: medium
- id: 1.4.1.1.2
  title: (L1) Ensure 'Load Pictures from Web Pages Not Created in Excel' is set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether Excel loads graphics when opening Web pages that were not created in
    Excel. It configures the "Load pictures from Web pages not created in Excel" option under the File tab | Options | Advanced
    | General | Web Options... | General tab. If you enable or do not configure this policy setting, Excel loads any graphics
    that are included in the pages, regardless of whether they were originally created in Excel. If you disable this policy
    setting, Excel will not load any pictures from Web pages that were not created in Excel. The recommended state for this
    setting is: Disabled.'
  rationale: By default, when users open Web pages in Excel 2016, Excel loads any graphics that are included in the pages,
    regardless of whether they were originally created in Excel. Users can change this option in the Web Options dialog box,
    which is available from the Advanced section of the Excel Options dialog box. Allowing Excel to load graphics created
    in other programs can make Excel vulnerable to possible future zero-day attacks that use graphic files as an attack vector.
    If such an event occurs, this setting can be used to mitigate the vulnerability. 13 | P a g e
  impact: If this setting is disabled Excel will not load pictures from Web pages that were not created in Excel. This configuration
    can cause some disruptions for users who load Web pages in Excel that were created by other applications. Users who do
    not load Web pages in Excel will not be affected by this setting.
  references: []
  page_start: 13
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\excel\internet\donotloadpictu

    res'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Disabled.

    User Configuration\Administrative Templates\Microsoft Excel 2016\Excel

    Options\Advanced\Web Options...\General\Load Pictures from Web Pages Not Created in

    Excel'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\excel\internet\donotloadpictu

      res'
    severity: medium
- id: 1.4.1.2
  title: (L1) Ensure 'Ask to Update Automatic Links' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether Excel prompts users to update automatic links, or whether the updates
    occur in the background with no prompt. If you enable or do not configure this policy setting, Excel will prompt users
    to update automatic links. In addition, the "Ask to update automatic links" user interface option under File tab | Advanced
    | General is selected. If you disable this policy setting, Excel updates automatic links without prompting or informing
    users, which could compromise the integrity of some of the information in the workbook. The recommended state for this
    setting is: Enabled.'
  rationale: If an Excel 2016 workbook contains links to other documents and users are not prompted to approve them, the contents
    of the workbook might change without the users' knowledge because the linked files have changed. By default, users are
    prompted to update automatic links.
  impact: Enabling this setting enforces the default configuration in Excel, and therefore is unlikely to cause usability
    issues for most users.
  references: []
  page_start: 15
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\excel\options\binaryoptions\f

    updateext_78_1'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

    to Enabled.

    User Configuration\Administrative Templates\Microsoft Excel 2016\Excel

    Options\Advanced\Ask to Update Automatic Links

    15 | P a g e'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\excel\options\binaryoptions\f

      updateext_78_1'
    severity: medium
- id: 1.4.5.1.1
  title: (L1) Ensure 'Internet and Network Paths as Hyperlinks' is set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting determines whether Excel automatically creates hyperlinks when users enter URL or UNC
    path information. If you enable this policy setting, when users type a string of characters that Excel recognizes as a
    Uniform Resource Locator (URL) or Uniform Naming Convention (UNC) path to a resource on the Internet or a local network,
    Excel will automatically transform it into a hyperlink. Clicking the hyperlink opens it in the configured default Web
    browser or the appropriate application. If you disable this policy setting, Excel will not transform URLs and UNC paths
    to hyperlinks. If you do not configure this policy setting, Excel will automatically transform URLs and UNC paths to hyperlinks
    and users can change the behavior by selecting or deselecting the "Internet and network paths as hyperlinks" check box
    under File tab | Help | Options | Proofing | AutoCorrect Options... | AutoFormat as You Type tab | Replace as you type.
    The recommended state for this setting is: Disabled.'
  rationale: By default, when users type a string of characters that Excel 2016 recognizes as a Uniform Resource Locator (URL)
    or Uniform Naming Convention (UNC) path to a resource on the Internet or a local network, Excel will transform it into
    a hyperlink. Clicking the hyperlink opens it in the configured default Web browser or the appropriate application. This
    functionality can enable users to accidentally create links to dangerous or restricted resources, which could create a
    security risk. 18 | P a g e
  impact: If this setting is disabled, Excel users will still be able to create new hyperlinks manually, so it is unlikely
    to cause significant disruptions for most users.
  references: []
  page_start: 18
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\excel\options\autohyperlink'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

    to Disabled.

    User Configuration\Administrative Templates\Microsoft Excel 2016\Excel

    Options\Proofing\Autocorrect Options\Internet and Network Paths as Hyperlinks'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\excel\options\autohyperlink'
    severity: medium
- id: 1.4.6.1
  title: (L1) Ensure 'Do Not Show AutoRepublish Warning Alert' is set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether Excel displays an alert before republishing a workbook to the World Wide
    Web. If you enable this policy setting, no warning appears when the user saves a published workbook when AutoRepublish
    is enabled. If you disable or do not configure this policy setting, a message dialog appears every time the user saves
    a published workbook when AutoRepublish is enabled. From this dialog, the user can disable AutoRepublish temporarily or
    permanently, or select "Do not show this message again" to prevent the dialog from appearing after every save. If the
    user selects "Do not show this message again", Excel will continue to automatically republish the data after every save
    without informing the user. The recommended state for this setting is: Disabled.'
  rationale: 'AutoRepublish is a feature in Excel 2016 that allows workbooks to be automatically republished to the World
    Wide Web each time the workbook is saved. A number of changes might need to be made to allow the workbook to be successfully
    published, including the following: • External references are converted to values. • Hidden formulas become visible. •
    The Set precision as displayed option, which appears beneath the When calculating this workbook heading in the Advanced
    section of the Excel Options dialog box, is no longer available. 20 | P a g e These types of changes can mean that the
    version on the Web page might not be the same as the Excel file. By default, a message dialog box appears every time the
    user saves a published workbook when AutoRepublish is enabled. From this dialog box, the user can disable AutoRepublish
    temporarily or permanently, or select Do not show this message again to prevent the dialog box from appearing after every
    save. If the user selects Do not show this message again, Excel will continue to automatically republish the data after
    every save without informing the user.'
  impact: Configuring this setting to "Always show the alert before publishing" reinforces the default functionality in Excel
    2016, and is therefore unlikely to cause usability issues for most users
  references: []
  page_start: 20
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\excel\options\disableautorepu

    blishwarning'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

    to Disabled.

    User Configuration\Administrative Templates\Microsoft Excel 2016\Excel Options\Save\Do

    Not Show AutoRepublish Warning Alert'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\excel\options\disableautorepu

      blishwarning'
    severity: medium
- id: 1.4.6.2
  title: (L1) Ensure 'Default File Format' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls the default file format for saving workbooks in Excel. If you enable this policy
    setting, you can set the default file format for Excel from among the following options: - Excel Workbook (.xlsx).This
    option is the default configuration in Excel 2016. - Excel Macro-Enabled Workbook (.xlsm) - Excel Binary Workbook (.xlsb)
    - Web Page (.htm; .html) - Excel 97-2003 Workbook (.xls) - Excel 5.0/95 Workbook (.xls) - OpenDocument Spreadsheet (*.ods)
    Users can choose to save workbooks in a different file format than the default. If you disable or you do not configure
    this policy setting, Excel saves new workbooks in the Office Open XML format with an .xlsx extension. The recommended
    state for this setting is: Enabled.'
  rationale: By default, when users create new workbook files, Excel 2016 saves them in the new Excel 2016 format. Users can
    change this functionality by clicking the Office button, clicking Excel Options, and then selecting a file format from
    the Default file format list. Disabling this setting allows users to choose from any of the available default file formats.
    If a new workbook is created in an earlier format, some users may not be unable to open or use the file, or they may choose
    a format that is less secure than the Excel 2016 format.
  impact: Enabling this setting does not prevent users from choosing a different file format for a new Excel file, and therefore,
    it is unlikely to affect usability for most users.
  references: []
  page_start: 22
  audit_raw: '22 | P a g e

    Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\excel\options\defaultformat'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

    to Enabled.

    User Configuration\Administrative Templates\Microsoft Excel 2016\Excel

    Options\Save\Default File Format'
  checks:
  - type: manual_review
    info: '22 | P a g e

      Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\16.0\excel\options\defaultformat'
    severity: medium
- id: 1.4.6.3
  title: (L1) Ensure 'Disable AutoRepublish' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting allows administrators to disable the AutoRepublish feature in Excel. If users choose to
    publish Excel data to a static Web page and enable the AutoRepublish feature, Excel saves a copy of the data to the Web
    page every time the user saves the workbook. By default, a message dialog displays every time the user saves a published
    workbook when AutoRepublish is enabled. From this dialog, the user can disable AutoRepublish temporarily or permanently,
    or select "Do not show this message again" to prevent the dialog from appearing after every save. If the user selects
    "Do not show this message again", Excel will continue to automatically republish the data after every save without informing
    the user. If you enable this policy setting, the AutoRepublish feature is turned off and Excel users will need to publish
    data to the Web manually. If you disable or do not configure this policy setting, users can enable the AutoRepublish feature
    to automatically republish workbooks saved as type Web Page. The recommended state for this setting is: Enabled. This
    policy setting allows you to determine whether users can open, view, edit, or save Excel files with the format specified
    by the title of this policy setting. If you enable this policy setting, you can specify whether users can open, view,
    edit, or save files. The options that can be selected are below. Note: Not all options may be available for this policy
    setting. - Do not block: The file type will not be blocked. - Save blocked: Saving of the file type will be blocked .
    - Open/Save blocked, use open policy: Both opening and saving of the file type will be blocked. The file will open based
    on the policy setting configured in the "default file block behavior" key. - Block: Both opening and saving of the file
    type will be blocked, and the file will not open. - Open in Protected View: Both opening and saving of the file type will
    be blocked, and the option to edit the file type will not be enabled. - Allow editing and open in Protected View: Both
    opening and saving of the file type will be blocked, and the option to edit will be enabled. 27 | P a g e If you disable
    or do not configure this policy setting, the file type will be blocked. The recommended state for this setting is: Enabled.
