  title: (L1) Ensure 'Store Macro In Personal Macro Workbook by Default' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls the default location for storing macros in Excel. If this policy setting is enabled,
    Excel stores macros in users'' personal macro workbook. If you disable or do not configure this policy setting, Excel
    stores macros in the active workbook from which they are created. Note: In the user interface (UI), the "Store macro in"
    drop down list box in the Record Macro dialog box (Macros | Record Macro) allows users to choose whether to store the
    new macro in the current workbook, a new workbook, or their personal macro workbook (Personal.xlsb), a hidden workbook
    that opens every time Excel starts. By default, Excel displays the "Store macro in" box with "This Workbook" already selected
    in the drop-down list. If a user saves a macro in the active workbook and then distributes the workbook to others, the
    macro is distributed along with the workbook. If you enable this policy setting, Excel displays the "Store macro in" box
    with "Personal Macro Workbook" already selected. Users can still select one of the other two options in the dropdown menu.
    The recommended state for this setting is: Enabled.'
  rationale: The Record Macro dialog box includes a drop-down menu that allows users to choose whether to store the new macro
    in the current workbook, a new workbook, or their personal macro workbook (Personal.xlsb), a hidden workbook that opens
    every time Excel 2016 starts. By default, Excel displays the Record Macro dialog box with This Workbook already selected
    in the drop-down menu. If a user saves a macro in the active workbook and then distributes the workbook to others, the
    macro is distributed along with the workbook, which could put workbook data at risk if the macro is triggered accidentally
    or intentionally. 74 | P a g e
