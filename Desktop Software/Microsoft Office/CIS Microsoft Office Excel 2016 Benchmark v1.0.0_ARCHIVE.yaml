- id: 1.4.7.4
  title: (L1) Ensure 'Force File Extension to Match File Type' is set to Enabled(Always match file type )
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls how Excel loads file types that do not match their extension. Excel can load
    files with extensions that do not match the files'' type. For example, if a comma-separated values (CSV) file named example.csv
    is renamed example.xls (or any other file extension supported by Excel 2003 and earlier only), Excel can properly load
    it as a CSV file. If you enable this policy setting, you can choose from three options for working with files that have
    non-matching extensions: - Allow different - Excel opens the files properly without warning users that the files have
    non-matching extensions. If users subsequently edit and save the files, Excel preserves both the true, underlying file
    format and the incorrect file extension. - Allow different, but warn - Excel opens the files properly, but warns users
    about the file type mismatch. This option is the default configuration in Excel. - Always match file type - Excel does
    not open any files that have non-matching extensions. If you disable or do not configure this policy setting, if users
    attempt to open files with the wrong extension, Excel opens the file and displays a warning that the file type is not
    what Excel expected. The recommended state for this setting is: Enabled. (Always match file type)'
  rationale: Excel 2016 can load files with extensions that do not match the files' type. For example, if a comma-separated
    values (CSV) file named example.csv is renamed example.xls, Excel can properly load it as a CSV file. Some attacks target
    specific file formats. If Excel is allowed to load files with extensions that do not match their file types, a malicious
    person can deceive users into loading dangerous files that have incorrect extensions. 78 | P a g e By default, if users
    attempt to open files with the wrong extension, Excel opens the file and displays a warning that the file type is not
    what Excel expected.
  impact: Earlier versions of Excel did not enforce file type matching. Enabling this setting and selecting Always match file
    type might cause disruptions for users who rely on the functionality of earlier versions of Excel, and could interfere
    with the operation of tools and scripts that rely on it.
