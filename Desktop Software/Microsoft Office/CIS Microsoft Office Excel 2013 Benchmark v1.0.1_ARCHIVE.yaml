controls:
- id: 1.2.1
  title: (L1) Ensure 'Do Not Show Data Extraction Options When Opening Corrupt Workbooks' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether Excel presents users with a list of data extraction options before beginning
    an Open and Repair operation when users choose to open a corrupt workbook in repair or extract mode. The recommended state
    for this setting is: Enabled.'
  rationale: By default, when users choose to open a corrupt workbook with the Open and Repair command, Excel prompts them
    to choose between repairing or extracting data. Also, for cells that contain formulas, users are prompted to either convert
    the contents to values or to recover formulas. If users choose to extract data instead of attempting to repair the workbook,
    important formulas, formatting, and VBA code could be lost unnecessarily.
  impact: Enabling this setting will prevent Excel users from choosing how workbooks are recovered, which could increase desktop
    support requests.
  references: []
  page_start: 11
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\excel\options\extractdatadisa

    bleui'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Enabled.

    User Configuration\Administrative Templates\Microsoft Excel 2013\Data Recovery\Do Not

    Show Data Extraction Options When Opening Corrupt Workbooks

    11 | P a g e'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\excel\options\extractdatadisa

      bleui'
    severity: medium
- id: 1.4.1.1.2
  title: (L1) Ensure 'Load Pictures from Web Pages Not Created in Excel' is set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether Excel loads graphics when opening Web pages that were not created in
    Excel. The recommended state for this setting is: Disabled.'
  rationale: By default, when users open Web pages in Excel, Excel loads any graphics that are included in the pages, regardless
    of whether they were originally created in Excel. Users can change this option in the Web Options dialog box, which is
    available from the Advanced section of the Excel Options dialog box. Allowing Excel to load graphics created in other
    programs can make Excel vulnerable to possible future zero-day attacks that use graphic files as an attack vector. If
    such an event occurs, this setting can be used to mitigate the vulnerability.
  impact: If this setting is disabled Excel will not load pictures from Web pages that were not created in Excel. This configuration
    can cause some disruptions for users who load Web pages in Excel that were created by other applications. Users who do
    not load Web pages in Excel will not be affected by this setting.
  references: []
  page_start: 14
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\excel\internet\donotloadpictu

    res'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Disabled.

    User Configuration\Administrative Templates\Microsoft Excel 2013\Excel

    Options\Advanced\Web Options...\General\Load Pictures from Web Pages Not Created in

    Excel

    14 | P a g e'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\excel\internet\donotloadpictu

      res'
    severity: medium
- id: 1.4.1.2
  title: (L1) Ensure 'Ask to Update Automatic Links' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether Excel prompts users to update automatic links, or whether the updates
    occur in the background with no prompt. The recommended state for this setting is: Enabled.'
  rationale: If an Excel workbook contains links to other documents and users are not prompted to approve them, the contents
    of the workbook might change without the users' knowledge because the linked files have changed. By default, users are
    prompted to update automatic links.
  impact: Enabling this setting enforces the default configuration in Excel, and therefore is unlikely to cause usability
    issues for most users.
  references: []
  page_start: 16
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\excel\options\binaryoptions\f

    updateext_78_1'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

    to Enabled.

    User Configuration\Administrative Templates\Microsoft Excel 2013\Excel

    Options\Advanced\Ask to Update Automatic Links'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\excel\options\binaryoptions\f

      updateext_78_1'
    severity: medium
- id: 1.4.5.1.1
  title: (L1) Ensure 'Internet and Network Paths as Hyperlinks' is set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting determines whether Excel automatically creates hyperlinks when users enter URL or UNC
    path information. The recommended state for this setting is: Disabled.'
  rationale: By default, when users type a string of characters that Excel recognizes as a Uniform Resource Locator (URL)
    or Uniform Naming Convention (UNC) path to a resource on the Internet or a local network, Excel will transform it into
    a hyperlink. Clicking the hyperlink opens it in the configured default Web browser or the appropriate application. This
    functionality can enable users to accidentally create links to dangerous or restricted resources, which could create a
    security risk.
  impact: If this setting is disabled, Excel users will still be able to create new hyperlinks manually, so it is unlikely
    to cause significant disruptions for most users.
  references: []
  page_start: 18
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\excel\options\autohyperlink'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

    to Disabled.

    User Configuration\Administrative Templates\Microsoft Excel 2013\Excel

    Options\Proofing\Autocorrect Options\Internet and Network Paths as Hyperlinks

    18 | P a g e'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\excel\options\autohyperlink'
    severity: medium
- id: 1.4.6.1
  title: (L1) Ensure 'Do Not Show AutoRepublish Warning Alert' is set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether Excel displays an alert before republishing a workbook to the World Wide
    Web. The recommended state for this setting is: Disabled.'
  rationale: 'AutoRepublish is a feature in Excel that allows workbooks to be automatically republished to the World Wide
    Web each time the workbook is saved. A number of changes might need to be made to allow the workbook to be successfully
    published, including the following: • External references are converted to values. • Hidden formulas become visible. •
    The Set precision as displayed option, which appears beneath the When calculating this workbook heading in the Advanced
    section of the Excel Options dialog box, is no longer available. These types of changes can mean that the version on the
    Web page might not be the same as the Excel file. By default, a message dialog box appears every time the user saves a
    published workbook when AutoRepublish is enabled. From this dialog box, the user can disable AutoRepublish temporarily
    or permanently, or select Do not show this message again to prevent the dialog box from appearing after every save. If
    the user selects Do not show this message again, Excel will continue to automatically republish the data after every save
    without informing the user. 20 | P a g e'
  impact: Configuring this setting to "Always show the alert before publishing" reinforces the default functionality in Excel,
    and is therefore unlikely to cause usability issues for most users
  references: []
  page_start: 20
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\excel\options\disableautorepu

    blishwarning'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

    to Disabled.

    User Configuration\Administrative Templates\Microsoft Excel 2013\Excel Options\Save\Do

    Not Show AutoRepublish Warning Alert'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\excel\options\disableautorepu

      blishwarning'
    severity: medium
- id: 1.4.6.2
  title: (L1) Ensure 'Default File Format' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls the default file format for saving workbooks in Excel. The recommended state
    for this setting is: Enabled.'
  rationale: By default, when users create new workbook files, Excel saves them in the new Excel format. Users can change
    this functionality by clicking the Office button, clicking Excel Options, and then selecting a file format from the Default
    file format list. Disabling this setting allows users to choose from any of the available default file formats. If a new
    workbook is created in an earlier format, some users may not be unable to open or use the file, or they may choose a format
    that is less secure than the Excel format.
  impact: Enabling this setting does not prevent users from choosing a different file format for a new Excel file, and therefore,
    it is unlikely to affect usability for most users.
  references: []
  page_start: 22
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\excel\options\defaultformat'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

    to Enabled.

    User Configuration\Administrative Templates\Microsoft Excel 2013\Excel

    Options\Save\Default File Format'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\excel\options\defaultformat'
    severity: medium
