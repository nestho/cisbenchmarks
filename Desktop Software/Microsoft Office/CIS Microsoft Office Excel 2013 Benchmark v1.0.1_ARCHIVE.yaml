- id: 1.4.7.2.8
  title: (L1) Ensure 'Store Macro In Personal Macro Workbook by Default' is set to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls the default location for storing macros in Excel. The recommended state for this
    setting is: Enabled.'
  rationale: The Record Macro dialog box includes a drop-down menu that allows users to choose whether to store the new macro
    in the current workbook, a new workbook, or their personal macro workbook (Personal.xlsb), a hidden workbook that opens
    every time Excel starts. By default, Excel displays the Record Macro dialog box with This Workbook already selected in
    the drop-down menu. If a user saves a macro in the active workbook and then distributes the workbook to others, the macro
    is distributed along with the workbook, which could put workbook data at risk if the macro is triggered accidentally or
    intentionally.
  impact: Enabling this setting does not prevent users from selecting a different location for storing macros, so it is unlikely
    to cause significant usability issues for most users.
