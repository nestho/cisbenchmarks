- id: 2.5.9.2.1
  title: Ensure 'PST Null Data on Delete' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether Outlook is forced to fully nullify deleted data in users'' Personal Folder
    files (.pst) at the time that the data is deleted. The recommended state for this setting is: Enabled. Note: This setting
    does not apply to (.ost) files generated when Outlook is connected to either Exchange or Exchange Online. This policy
    setting controls how plain text messages are formatted when they are sent from Outlook. The recommended state for this
    setting is: Disabled. This setting allows unblocking of folder home pages for folders in non-default stores. The recommended
    state for this setting is: Enabled. This policy setting controls whether Outlook executes scripts that are associated
    with custom forms or folder home pages for public folders. By enabling this policy setting, Outlook cannot execute any
    scripts associated with public folders, overriding any configuration changes on users'' computers. The recommended state
    for this setting is: Enabled. This policy setting controls whether Outlook executes scripts associated with custom forms
    or folder home pages for shared folders. If this policy setting is enabled or not configured, Outlook cannot execute any
    scripts associated with shared folders. The recommended state for this setting is: Enabled. This policy setting controls
    whether e-mail messages dragged from Outlook to the file system are saved in Unicode or ANSI format. The recommended state
    for this setting is: Disabled.'
  rationale: When a user deletes mail or other items in Outlook, the data is retained in a portion of the PST file until it
    is purged or overwritten. Attackers could potentially recover the data by using PST recovery tools. Nulling the data at
    deletion time will impede this. If UUENCODE formatting is used, an attacker could manipulate the encoded attachment to
    bypass content filtering software. By default, Outlook automatically wraps plain text messages at 76 characters and uses
    the standard MIME format to encode attachments in plain text messages. However, these settings can be altered to allow
    email to be read in plain text e-mail programs that use a non-standard line length or that cannot process MIME attachments.
    Outlook allows users to designate Web pages as home pages for personal or public folders. When a user clicks on a folder,
    Outlook displays the home page the user has assigned to it. Although this feature provides the opportunity to create powerful
    public folder applications, scripts can be included on Web pages that access the Outlook object model, which exposes users
    to security risks. By default, Outlook does not allow users to define folder home pages for folders in non-default stores.
    If this configuration is changed, users can create and access dangerous folder home pages for Outlook data files (.pst)
    and other non-default stores, which can compromise the security of the users' data. In Outlook, folders can be associated
    with custom forms or folder home pages that include scripts that access the Outlook object model. These scripts can add
    functionality to the folders and items contained within, but dangerous scripts can pose security risks. Outlook folders
    can use custom forms or folder home pages containing scripts that access the Outlook object model, adding functionality
    but also introducing risk if the scripts are malicious. By default, Outlook blocks these scripts from running in shared
    folders. Changing this default allows users to inadvertently run dangerous scripts when accessing shared folders, putting
    their computers and data at risk. Unicode text is vulnerable to homograph attacks, in which characters are replaced by
    different but similar-looking characters. For example, the Cyrillic letter ? (U+0430) appears identical to the Latin letter
    a (U+0061) in many typefaces, but is actually a different character. Homographs can be used in "phishing" attacks to convince
    victims to visit fraudulent Web sites and enter sensitive information.
  impact: Forensics and data recovery of objects permanently removed by a user taking action to empty their Outlook trash
    bin will be made more difficult. These will need to be recovered by another method such as a system backup. In addition,
    users may experience a delay after deleting a large number of items from within a PST file. None - this is the default
    behavior. None - This is the default behavior. Preventing the execution of scripts associated with public folders enforces
    the default behavior, and therefore is unlikely to cause usability issues for most users. Users are, however, able to
    override the default behavior by can configuring the setting in the Trust Center and selecting the “Allow script in public
    folders” check box. Enabling this setting enforces the default configuration in Outlook, and therefore is unlikely to
    cause usability issues for most users. ANSI file encoding may limit the overall size a .msg file can reach, although a
    single mail item should not be of concern.
