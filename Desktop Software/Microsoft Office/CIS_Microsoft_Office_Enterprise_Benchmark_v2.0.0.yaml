    value of 1 or 0.

    HKEY_USERS\[USER

    SID]\SOFTWARE\Policies\Microsoft\office\16.0\powerpoint\security:enableoleactions

    Note: A value of 0, written by the disable (don''t allow activating OLE

    Active Content) option, is more restrictive than the recommended state and is also

    compliant.'
