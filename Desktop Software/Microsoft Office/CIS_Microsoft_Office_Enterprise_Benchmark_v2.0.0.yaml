- id: 2.3.27.15
  title: 'Ensure ''Load Controls in Forms3'' is set to ''Enabled: 4'''
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting determines how ActiveX controls in UserForms should be initialized based upon whether
    they are Safe For Initialization (SFI) or Unsafe for Initialization (UFI). In mode 4, UFI signed controls get loaded with
    the default properties of the control and SFI signed controls get loaded in safe mode. Mode 4 is considered to be the
    safest mode. The recommended state for this setting is: Enabled: 4.'
  rationale: ActiveX controls are Component Object Model (COM) objects and have unrestricted access to users' computers. ActiveX
    controls can access the local file system and change the registry settings of the operating system. If a malicious user
    repurposes an ActiveX control to take over a user's computer, the effect could be significant. To help improve security,
    ActiveX developers can mark controls as Safe For Initialization (SFI), which means that the developer states that the
    controls are safe to open and run and not capable of causing harm to any computers. If a control is not marked SFI, the
    control could adversely affect a computer — or it's possible the developers did not test the control in all situations
    and are not sure whether their control might be compromised at some future date. SFI controls run in safe mode, which
    limits their access to the computer. For example, a worksheet control can both read and write files when it is in unsafe
    mode, but perhaps only read from files when it is in safe mode. This functionality allows the control to be used in very
    powerful ways when safety wasn't important, but the control would still be safe for use in a Web page. If a control is
    not marked as SFI, it is marked Unsafe For Initialization (UFI), which means that it is capable of affecting a user's
    computer. If UFI ActiveX controls are loaded, they are always loaded in unsafe mode. This setting allows administrators
    to control how ActiveX controls in UserForms should be initialized based upon whether they are SFI or UFI. Page 251
  impact: Users might experience compatibility issues with older or third-party applications that rely on ActiveX controls
    not marked as SFI, as well as, with some ActiveX controls that may not function as intended if they are marked as UFI
  references: []
  page_start: 251
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\[USER SID]\SOFTWARE\Policies\Microsoft\vba\security:loadcontrolsinforms'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Enabled: 4:

    User Configuration\Administrative Templates\Microsoft Office 2016\Security

    Settings\Load Controls in Forms3'
  checks:
