- id: 1.1.4.1.6
  title: Ensure 'Local Machine Zone Lockdown Security' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'When Internet Explorer opens a Web page, it places restrictions on what the page can do, based on the page''s
    Internet Explorer security zone. There are several possible security zones, each with different sets of restrictions.
    The security zone for a page is determined by its location. For example, pages that are located on the Internet will normally
    be in the more restrictive Internet security zone. They might not be allowed to perform some operations, such as accessing
    the local hard drive. Pages that are located on your corporate network would normally be in the Intranet security zone,
    and therefore have fewer restrictions. This setting allows for configuration of policy settings in the zone consistent
    with a selected security level, for example, Low, Medium or High. The recommended state for this setting is: Enabled (Check:
    groove.exe, excel.exe, mspub.exe, powerpnt.exe, pptview.exe, visio.exe, winproj.exe, winword.exe, outlook.exe, spDesign.exe,
    exprwd.exe, msaccess.exe, onent.exe, mse7.exe).'
  rationale: Local Machine zone security applies to all local files and content. This feature helps to mitigate attacks where
    the Local Machine zone is used as an attack vector to load malicious HTML code.
  impact: If you enable this policy setting, the Local Machine zone security applies to all local files and content processed
    by the specified applications. If you disable or do not configure this policy setting, Local Machine zone security is
    not applied to local files or content processed by the specified applications.
  references: []
  page_start: 36
  audit_raw: "Navigate to the UI Path articulated in the Remediation section and confirm it is set as\nprescribed. This group\
