  title: Ensure 'Allow Basic Authentication prompts from network proxies' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'Apps such as Word and Excel allow users to use Basic authentication to connect to resources on web servers
    by sending usernames and passwords with each request. These credentials are often stored on the servers, making it easier
    for attackers to capture them and reuse them against other endpoints or services. The recommended state for this setting
    is: Disabled. Note: This policy setting only applies to subscription versions of Office, such as Microsoft 365 Apps for
    enterprise, and to subscription versions of Project and Visio. Note #2: This change doesn’t affect Outlook connecting
    to on-premises Exchange Server using Basic authentication. This change also doesn’t affect Outlook connecting to Exchange
    Online using Basic authentication. There is a separate effort to deprecate Basic authentication with Exchange Online.
    For more information, see Basic authentication deprecation in Exchange Online'
  rationale: Basic authentication is an outdated industry standard and doesn't support more robust security features, such
    as multifactor authentication. The threats posed by it have only increased and there are better and more effective user
    authentication alternatives. For example, modern authentication, which supports multifactor authentication, smart cards,
    and certificate-based authentication.
