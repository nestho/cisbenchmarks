- id: 1.1.4.1.8
  title: Ensure 'Navigate URL' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This setting controls whether Internet Explorer attempts to load malformed URLs that are passed to it from
    Office applications. The recommended state for this setting is: Enabled (Check: groove.exe, excel.exe, mspub.exe, powerpnt.exe,
    pptview.exe, visio.exe, winproj.exe, winword.exe, outlook.exe, spDesign.exe, exprwd.exe, msaccess.exe, onent.exe, mse7.exe).'
  rationale: To protect users from attacks, Internet Explorer usually does not attempt to load malformed URLs. This functionality
    can be controlled separately for instances of Internet Explorer spawned by Office applications (for example, if a user
    clicks a link in an Office document or selects a menu option that loads a Web page). If Internet Explorer attempts to
    load a malformed URL, a security risk could occur in some cases.
  impact: Enabling this setting does not block any legitimate URLs, and is therefore unlikely to cause usability issues for
    any Office users.
  references: []
