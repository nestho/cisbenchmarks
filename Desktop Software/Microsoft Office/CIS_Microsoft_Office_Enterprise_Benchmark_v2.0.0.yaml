- id: 2.2.4.1.2
  title: Ensure 'Ask to update automatic links' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether Excel prompts users to update automatic links, or whether the updates
    occur in the background with no prompt. The recommended state for this setting is: Enabled. This policy setting determines
    whether Excel automatically creates hyperlinks when users enter URL or UNC path information. The recommended state for
    this setting is: Disabled.'
  rationale: When users open documents, Excel automatically updates any links to external content, such as graphics, Excel
    worksheets, and PowerPoint slides. If Excel is configured to automatically update links when documents are open, document
    content can change without the user's knowledge, which could put important information at risk. By default, when users
    type a string of characters that Excel recognizes as a Uniform Resource Locator (URL) or Uniform Naming Convention (UNC)
    path to a resource on the Internet or a local network, Excel will transform it into a hyperlink. Clicking the hyperlink
    opens it in the configured default Web browser or the appropriate application. This functionality can enable users to
    accidentally create links to dangerous or restricted resources, which could create a security risk.
  impact: Users who work with Excel documents that contain external content will not be able to automatically update that
    content. Excel users will still be able to create new hyperlinks manually, so it is unlikely to cause significant disruptions
    for most users.
