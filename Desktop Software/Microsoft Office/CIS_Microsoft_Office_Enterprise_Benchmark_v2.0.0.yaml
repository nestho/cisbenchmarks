- id: 1.3.2
  title: Ensure 'Restrict legacy JScript execution for Office' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'This policy setting controls JScript execution per Security Zone within Internet Explorer and WebBrowser Control
    (WebOC) for Office applications. JScript is Microsoft''s legacy dialect of the ECMAScript standard that is used in Microsoft''s
    Internet Explorer 11 and older. If Enabled, Office applications will not execute legacy JScript for the Internet or Restricted
    Sites zones and users aren’t notified by the application that legacy JScript execution is restricted. Modern JScript9
    will continue to function for all zones. The recommended state for this setting is: Enabled: Access: 69632 Excel: 69632
    OneNote: 69632 Outlook: 69632 PowerPoint: 69632 Project: 69632 Publisher: 69632 Visio: 69632 Word: 69632 This policy setting
    controls whether trusted locations on the network can be used. Trusted locations specified in the Trust Center are used
    to define file locations that are assumed to be safe by the application opening the file. The recommended state for this
    setting is: Disabled. This policy setting allows administrators to disable all trusted locations in the specified applications.
    The recommended state for this setting is: Enabled. This policy setting allows the blocking of macros from running in
    Office files that come from the internet. By enabling this policy setting, macros are blocked from running, even if "Enable
    all macros" is selected in the Macro Settings section of the Trust Center. Users will receive a notification that macros
    are blocked from running. The exceptions when macros will be allowed to run are: • The Office file is saved to a Trusted
    Location. • The Office file was previously trusted by the user. • Macros are digitally signed and the matching Trusted
    Publisher certificate is installed on the device. The recommended state for this setting is: Enabled. Note: This setting
    will apply to documents downloaded from Internet websites, consumer storage providers (OneDrive, Google Drive, and Dropbox)
    or from public shares on the Internet (file-sharing sites), and attachments to emails that were received from outside
    the Exchange organization. This policy setting controls whether the specified Office application notifies users when unsigned
    application add-ins are loaded or silently disables such add-ins without notification. The recommended state for this
    setting is: Enabled. This policy setting controls whether add-ins for the specified Office application must be digitally
    signed by a trusted publisher. The recommended state for this setting is: Enabled. This policy setting controls whether
    hyperlinks in Access tables, queries, forms, and reports are underlined. The recommended state for this setting is: Enabled.'
  rationale: 'Development on the JScript engine ended, and the component was deprecated with the release of Internet Explorer
    8.0 in 2009, but the engine remained in all Windows OS versions as a legacy component inside IE. Due to this, it has been
    exploited by bad actors over the years, including nation-states. The following CVEs are associated with JSCRIPT vulnerabilities:
    CVE-2018-8653, CVE-2019-1367, CVE-2019-1429, and CVE-2020-0674 Content, code, and add-ins are allowed to load from trusted
    locations with a minimal amount of security, without prompting the users for permission. If a dangerous file is opened
    from a trusted location, it will not be subject to standard security measures and could harm the user''s computers or
    data. By default, users can specify trusted locations on network shares or in other remote locations that are not under
    their direct control by selecting the Allow Trusted Locations on my network (not recommended) check box in the trusted
    Locations section of the Trust Center. Trusted locations specified in the Trust Center are used to define file locations
    that are assumed to be safe. Content, code, and add-ins are allowed to load from trusted locations with a minimal amount
    of security, without prompting the users for permission. If a dangerous file is opened from a trusted location, it will
    not be subject to standard security measures and could harm the user''s computers or data. Windows marks files downloaded
    from the internet using an alternate NTFS data stream. Files from untrusted sources can contain malicious payloads embedded
    in macros that may compromise the system on which they are run. Blocking macros in files marked as originating from the
    internet helps prevent known, unknown, and obfuscated code from being executed accidentally by the end user. Allowing
    unsigned application add-ins could cause the application to load dangerous add-ins and as a result, malicious code could
    become active on user computer and the network. By default, Office applications do not check the digital signature on
    application add-ins before opening them. Disabling or not configuring this setting may allow an application to load a
    dangerous add-in. As a result, malicious code could become active on a user''s computer or the network. By default, Access
    underlines hyperlinks that appear in tables, queries, forms, and reports. If this configuration is changed, users might
    click on dangerous hyperlinks without realizing it, which could pose a security risk.'
  impact: It's important to determine whether legacy JScript is being used to provide businesscritical functionality before
    enabling this setting. Page 63 Disabling this setting will cause disruption for users who add network locations to the
    Trusted Locations list. These custom locations added by users are ignored but not removed. Trusted locations added in
    Group Policy that specify a network location are also ignored. All trusted locations (those specified in the Trust Center)
    in the specified applications are ignored, including any trusted locations established by Office 2016 during setup, deployed
    to users using Group Policy, or added by users themselves. Users will be prompted again when opening files from trusted
    locations. This enforces the default behavior and should not cause additional impact. Page 70 Users will not receive notifications
    about unsigned add-ins, which can reduce confusion and interruptions. However, this also means that legitimate unsigned
    add-ins will be blocked without user notification, which could potentially disrupt workflows if users rely on such add-ins.
    This setting could cause disruptions for users who rely on add-ins that are not signed by trusted publishers. These users
    will either have to obtain signed versions of such addins or stop using them. None - this is the default behavior.
  references:
