- id: 1.1.4.1.12
  title: Ensure 'Restrict File Download' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting suppresses file download prompts that are not user-initiated. In certain circumstances,
    websites can initiate file download prompts without interaction from users. This technique can allow websites to put unauthorized
    files on users'' hard drives if they click the wrong button and accept the download. The recommended state for this setting
    is: Enabled (Check: groove.exe, excel.exe, mspub.exe, powerpnt.exe, pptview.exe, visio.exe, winproj.exe, winword.exe,
    outlook.exe, spDesign.exe, exprwd.exe, msaccess.exe, onent.exe, mse7.exe).'
  rationale: Disabling this setting allows websites to present file download prompts via code without the user specifically
    initiating the download. User preferences may also allow the download to occur without prompting or interacting with the
    user. Even if Internet Explorer prompts the user to accept the download, some websites abuse this functionality. Malicious
    websites may continually prompt users to download a file or present confusing dialog boxes to trick users into downloading
    or running a file. If the download occurs and it contains malicious code, the code could become active on user computers
    or the network. Page 48
  impact: User-initiated downloads can still occur, so the majority of legitimate user download interactions remain unaffected.
    Hiding website-initiated prompt messages makes it impossible for a malicious website to initiate a download by itself.
    Such a site can no longer confuse a user into downloading a file that could then open on the user's computer to execute
    an attack. However, some valid websites may initiate file downloads. If this setting is enabled, users cannot view download
    prompts, and remain unaware when a download is available. If such sites reside in an organization's Intranet, they should
    display a link to prompt users to initiate valid downloads if the automatic download process does not occur. This type
    of functionality is already in common use on many major Internet sites and should not confuse users. It is possible that
    some advanced users may expect their user preferences to control this behavior, and for this reason, they may be confused
    when this preference is overridden by this setting.
  references: []
  page_start: 48
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

