- id: 2.11.8.7.3
  title: Ensure 'Make hidden markup visible' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether hidden markup is visible when users open Word documents in standard or
    HTML format. The recommended state for this setting is: Enabled.'
  rationale: If a file is saved with hidden markup, users might inadvertently distribute sensitive comments or information
    outside of their trusted circle without realizing that this information is still present in the document.
  impact: Hidden markup includes revision marks and comments. If a document contains a large number of these elements, it
    may be difficult to read until the changes are accepted or removed. While users can manually hide markup to improve readability,
    markup is generally intended to be visible during the editing process. Note that markup does not appear in presentation
    mode, even if it is visible in design mode, so enabling this setting has minimal impact on usability.
  references: []
  page_start: 572
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

    value of 1.

    HKEY_USERS\[USER

    SID]\SOFTWARE\Policies\Microsoft\office\16.0\word\options:showmarkupopensave'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Enabled.

    User Configuration\Administrative Templates\Microsoft Word 2016\Word

    Options\Security\Make hidden markup visible'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location with a

      value of 1.

      HKEY_USERS\[USER

      SID]\SOFTWARE\Policies\Microsoft\office\16.0\word\options:showmarkupopensave'
    severity: medium
- id: 2.11.8.7.4
  title: Ensure 'Turn off file validation' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting allows you turn off the file validation feature. Office Binary Documents (97-2003) are
    checked to see if they conform against the file format schema before they are opened. The recommended state for this setting
    is: Disabled.'
  rationale: The file validation feature ensures that Office Binary Documents are checked to see if they conform against the
    file format schema before they are opened, which may help protect against certain types of attacks.
  impact: None - this is the default behavior.
