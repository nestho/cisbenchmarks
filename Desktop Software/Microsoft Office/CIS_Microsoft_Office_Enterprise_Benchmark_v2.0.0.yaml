- id: 2.5.14.4.2
  title: 'Ensure ''Security setting for macros'' is set to ''Enabled: Warn for signed, disable unsigned'''
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls the security level for macros in Outlook. Macros are a single instruction that
    expands automatically into a set of instructions to perform a particular task. Available Policy Options: Always warn =
    This option corresponds to the "Warnings for all macros" option in the "Macro Security" section of the Outlook Trust Center.
    Outlook disables all macros that are not opened from a trusted location, even if the macros are signed by a trusted publisher.
    For each disabled macro, Outlook displays a security alert dialog box with information about the macro and its digital
    signature (if present), and allows users to enable the macro or leave it disabled. Never warn, disable all = This option
    corresponds to the "No warnings and disable all macros" option in the Trust Center. Outlook disables all macros that are
    not opened from trusted locations, and does not notify users. Warning for signed, disable unsigned = This option corresponds
    to the "Warnings for signed macros; all unsigned macros are disabled" option in the Trust Center. Outlook handles macros
    as follows: • If a macro is digitally signed by a trusted publisher, the macro can run if the user has already trusted
    the publisher. • If a macro has a valid signature from a publisher that the user has not trusted, the security alert dialog
    box for the macro lets the user choose whether to enable the macro for the current session, disable the macro for the
    current session, or to add the publisher to the Trusted Publishers list so that it will run without prompting the user
    in the future. • If a macro does not have a valid signature, Outlook disables it without prompting the user, unless it
    is opened from a trusted location. No security check = This option corresponds to the "No security check for macros (Not
    recommended)" option in the Trust Center. Outlook runs all macros without prompting users. This configuration makes users''
    computers vulnerable to potentially malicious code and is not recommended. The recommended state for this setting is:
    Enabled: Warn for signed, disable unsigned. Page 430'
  rationale: To protect users from dangerous code, the disabling of macros that are not trusted, including unsigned macros,
    macros with expired or invalid signatures, and macros with valid signatures from publishers who are not on users' Trusted
    Publishers lists is recommended to help against would allow dangerous code to run.
  impact: None - this is enforcing the default behavior. Unsigned macros will be disabled.
