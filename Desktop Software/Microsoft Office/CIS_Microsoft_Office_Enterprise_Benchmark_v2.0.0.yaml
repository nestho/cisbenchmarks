  title: Ensure 'Enable RPC encryption' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether Outlook uses remote procedure call (RPC) encryption to communicate with
    Microsoft Exchange servers. If this policy setting is enabled, Outlook uses RPC encryption when communicating with an
    Exchange server. The recommended state for this setting is: Enabled. Note: RPC encryption only encrypts the data from
    the Outlook client computer to the Exchange server. It does not encrypt the messages themselves as they traverse the Internet.'
  rationale: By default, the remote procedure call (RPC) communication channel between an Outlook client computer and an Exchange
    server is encrypted. If this policy is disabled, an end user may modify this setting creating an opportunity for malicious
    eavesdropping of network traffic between Outlook client and the Exchange server.
  impact: This is the default behavior and would only impact unsupported versions of Outlook. The default Exchange Server
    2010 Release to Manufacturing (RTM) configuration requires RPC encryption. This behavior is a change from Exchange Server
    2010 Service Pack 1 where the RPC encryption requirement is disabled by default. However, any Client Access Server (CAS)
    deployed prior to Service Pack 1, or upgraded to Service Pack 1, will retain the existing RPC encryption requirement setting
    which could still prevent the client from being able to connect.
  references:
  - 1. https://learn.microsoft.com/en-us/exchange/troubleshoot/clientconnectivity/outlook-connection-issue-caused-by-rpc-encryption-requirement
