- id: 2.3.27.19
  title: Ensure 'Suppress hyperlink warnings' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether Office applications notify users about unsafe hyperlinks. Links that
    Office considers unsafe include links to executable files, TIFF files, and Microsoft Document Imaging (MDI) files. Other
    unsafe links are those that use protocols considered to be unsafe such as javascript. The recommended state for this setting
    is: Disabled.'
  rationale: The hyperlink warning is the last in-application control that interrupts a user before Office passes a link to
    the shell or to a registered protocol handler. When notifications are suppressed, a link to an executable or to a protocol
    Office classifies as unsafe is invoked directly on the user's click, with no prompt and no opportunity to inspect the
    target. Because a hyperlink's display text is independent of its target, users cannot reliably distinguish a benign link
    from a malicious one, and documents and message bodies carrying disguised links are a routine initial-access technique.
  impact: This setting does not alter the default configuration and therefore is unlikely to provide any usability concerns.
  references:
  - 1. https://learn.microsoft.com/en-us/previous-versions/troubleshoot/microsoft365/microsoft-365-apps/office-suite-problems/enable-disable-hyperlink-warning
