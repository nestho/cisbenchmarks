    Security Group Policy is selected, Outlook uses security settings from Group Policy. The recommended state for this setting
    is: Enabled: Use Outlook Security Group Policy. Note: This setting must be enabled in order for the other Outlook security
    policy settings mentioned in this guide to be applied.'
