- id: 2.5.14.2.7
  title: 'Ensure ''Signature Warning'' is set to ''Enabled: Always warn about invalid signatures'''
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls how Outlook warns users about messages with invalid digital signatures. The recommended
    state for this setting is: Enabled: Always warn about invalid signatures. This policy setting controls whether Outlook
    users can demote attachments to Level 2 by using a registry key, which will allow them to save files to disk and open
    them from that location. Outlook uses two levels of security to restrict access to files attached to email messages or
    other items. Files with specific extensions can be categorized as Level 1 (users cannot view the file) or Level 2 (users
    can open the file after saving it to disk). Users can freely open files of types that are not categorized as Level 1 or
    Level 2. The recommended state for this setting is: Disabled. This policy setting controls whether Outlook blocks potentially
    dangerous attachments designated Level 1. To protect users from viruses and other harmful files, Outlook uses two levels
    of security, designated Level 1 and Level 2, to restrict access to files attached to e-mail messages or other items. Potentially
    harmful files can be classified into these two levels by file type extension, with all other file types considered safe.
    The recommended state for this setting is: Disabled. This policy setting controls whether Outlook displays a warning before
    closing an item that contains an unsafe attachment that will be blocked when the item is re-opened. If this policy setting
    is enabled, Outlook will not display a warning when users close items with Level 1 attachments, which could cause data
    loss. If this policy setting is disabled or not configured, when a user closes an item to which a level 1 file has been
    attached, Outlook warns the user that the message contains a potentially unsafe attachment and that the user might not
    be able to access the attachment when opening the item later. (Such a sequence of events might occur when a user closes
    a draft message that they intend to resume editing at some future time.) The recommended state for this setting is: Disabled.
    This policy setting controls whether Outlook displays a warning before sending an item that contains an unsafe attachment
    that will be blocked when the item is opened by a recipient. If this policy setting is enabled, Outlook will not display
    a warning when a user sends an item with a Level 1 attachment, which can cause users'' data to be at risk. If this policy
    setting is disabled or not configured, when users attempt to send an item to which a level 1 file has been attached, Outlook
    warns them that the message contains a potentially unsafe attachment and that the recipient might not be able to access
    it. The recommended state for this setting is: Disabled. This policy setting controls which types of attachments (determined
    by file extension) Outlook prevents from being delivered. Outlook uses two levels of security to restrict user''s access
    to files attached to e-mail messages or other items. Files with specific extensions can be categorized as Level 1 (users
    cannot view the file) or Level 2 (users can open the file after saving it to disk). Users can freely open files of types
    that are not categorized as Level 1 or Level 2. The recommended state for this setting is: Enabled: ; This policy setting
    controls which types of attachments (determined by file extension) must be saved to disk before users can open them. Files
    with specific extensions can be categorized as Level 1 (users cannot view the file) or Level 2 (users can open the file
    after saving it to disk). Users can freely open files of types that are not categorized as Level 1 or Level 2. The recommended
    state for this setting is: Enabled: ; This policy setting controls whether scripts can run in Outlook forms in which the
    script and layout are contained within the message. The recommended state for this setting is: Disabled. This policy setting
    controls whether Outlook prompts users before executing a custom action. Custom actions add functionality to Outlook that
    can be triggered as part of a rule. Among other possible features, custom actions can be created that reply to messages
    in ways that circumvent the Outlook model''s programmatic send protections. The recommended state for this setting is:
    Enabled: Automatically Deny. This policy setting controls what happens when an untrusted program attempts to gain access
    to an Address Book using the Outlook object model. The Outlook object model includes entry points to access Outlook data,
    save data to specified locations, and send emails. When the option Automatically deny is selected, Outlook will automatically
    deny programmatic access requests from any program. The recommended state for this setting is: Enabled: Automatically
    Deny. This policy setting controls what happens when a user designs a custom form in Outlook and attempts to bind an Address
    Information field to a combination or formula custom field. The Outlook object model includes entry points to access Outlook
    data, save data to specified locations, and send emails. When the option Automatically deny is selected, Outlook will
    automatically deny programmatic access requests from any program. The recommended state for this setting is: Enabled:
    Automatically Deny. This policy setting controls what happens when an untrusted program attempts to use the Save As command
    to programmatically save an item. When the option Automatically deny is selected, Outlook will automatically deny programmatic
    access requests from any program. The recommended state for this setting is: Enabled: Automatically Deny. This policy
    setting controls what happens when an untrusted program attempts to gain access to a recipient field, such as the To:
    field, using the Outlook object model. When the option Automatically deny is selected, Outlook will automatically deny
    programmatic access requests from any program. The recommended state for this setting is: Enabled: Automatically Deny.
    This policy setting controls what happens when an untrusted program attempts to programmatically send an e-mail in Outlook
    using the Response method of a task or meeting request. When the option Automatically deny is selected, Outlook will automatically
    deny programmatic access requests from any program. The recommended state for this setting is: Enabled: Automatically
    Deny. This policy setting controls what happens when an untrusted program attempts to send e-mail programmatically using
    the Outlook object model. When the option Automatically deny is selected, Outlook will automatically deny programmatic
    access requests from any program. The recommended state for this setting is: Enabled: Automatically Deny.'
  rationale: If users are not notified about invalid signatures, it might prevent the user from detecting a fraudulent signature
    sent by a malicious user. If users can demote Level 1 files to Level 2, they will be able to access potentially dangerous
    files after saving them to disk, which could allow malicious code to infect their system or compromise the security of
    sensitive information. By default, Outlook completely blocks access to Level 1 files, and requires users to save Level
    2 files to disk before opening them. If this configuration is changed, users will be able to open and execute potentially
    dangerous attachments, which can affect their computers or compromise the confidentiality, integrity, or availability
    of data. To protect users from viruses and other harmful files, Outlook uses two levels of security, designated Level
    1 and Level 2, to restrict users' access to files attached to email messages or other items. Outlook completely blocks
    access to Level 1 files by default, and requires users to save Level 2 files to disk before opening them. Potentially
    harmful files can be classified into these two levels by file type extension, with all other file types considered safe.
    To protect users from viruses and other harmful files, Outlook uses two levels of security, designated Level 1 and Level
    2, to restrict access to files attached to e-mail messages or other items. Outlook completely blocks access to Level 1
    files by default, and requires users to save Level 2 files to disk before opening them. Potentially harmful files can
    be classified into these two levels by file type extension, with all other file types considered safe. Malicious code
    is often spread through e-mail. Some viruses have the ability to send copies of themselves to other people in the victim's
    Address Book or Contacts list, and such potentially harmful files can affect the computers of unwary recipients. Setting
    this policy to Enabled with an empty value (;) positively asserts that no Level 1 extensions are removed from Outlook's
    default block list, so the default blocking behavior is preserved. This is functionally identical to Disabled, but it
    writes a value to the registry that gives auditors positive evidence the intended state was applied, and it locks out
    a lower-precedence configuration from populating the value with extensions to remove. Malicious code is often spread through
    e-mail, and removing restrictions on potentially dangerous file extensions makes it easier for users to open dangerous
    files. Outlook does not classify any file types as Level 2 by default, but a machine policy could still populate the Level
    2 list; this setting is what would let those extensions be removed again. Enabled with an empty value (;) is functionally
    identical to Disabled, but it writes a positive, auditable value that locks out a lower-precedence configuration from
    populating the list with extensions to remove. Malicious code can be included within Outlook forms, and can be executed
    when users open the form. Malicious code can use the Outlook object model to compromise sensitive information or otherwise
    cause data and computing resources to be at risk. If an untrusted application accesses the address book, the application
    could gain access to sensitive data and potentially change or exfiltrate that data. A custom form in Outlook could be
    used to gain access to sensitive data and potentially change or exfiltrate that data. If an untrusted application uses
    the Save As command to programmatically save an item, the application could add malicious data to a user's inbox, a public
    folder, or an address book. If an untrusted application accesses the recipient fields, the application could gain access
    to sensitive data and potentially change that data. This could result in mail being sent to the wrong party. If an untrusted
    application programmatically responds to tasks or meeting requests, that application could impersonate a user's response
    to tasks or meeting requests with false information. If an untrusted application programmatically sends e-mail, that application
    could send mail that includes malicious code, impersonates a user, or launches a denial-of-service attack by sending a
    large volume of mail to a user or group of users.
  impact: 'None - This is the default behavior. Enabling this setting could cause some disruptions for Outlook users who receive
