  description: 'This policy setting determines if online dictionaries are used for the translation of text through the Research
    pane. The recommended state for this setting is: Disabled.'
  rationale: Enabling this service allows data to be sent to a third-party translation vendor, which is inappropriate in an
    highly sensitive environment. The online machine translation service transmits input in clear text HTML format over the
    Internet to servers outside organizational control. This creates a risk of unintended disclosure of corporate information,
    including classified documents and e-mails. Because the organization has no control over the destination server(s) or
    the transmission path, the confidentiality and integrity of a classified document cannot be assured when this service
    is used to translate it, whether in whole or in part. Disabling this service is necessary to prevent this exposure.
