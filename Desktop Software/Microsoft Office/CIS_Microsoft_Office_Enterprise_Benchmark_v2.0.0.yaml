- id: 2.6.6.6.8
  title: 'Ensure ''OLE Active Content'' is set to ''Enabled: enable (prompt user before activating OLE Active Content)'''
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls the prompting and activation behavior for the OLE Active Content option for action
    buttons in PowerPoint. The option applies when a presentation contains an OLE object and a user clicks an action button
    with the Object action action assigned to it. By choosing the enable (prompt user before activating OLE Active Content)
    option, PowerPoint prompts the user to continue before activating the action. The recommended state for this setting is:
    Enabled: enable (prompt user before activating OLE Active Content)'
  rationale: OLE objects embedded in a presentation can carry content from other applications, and activating one can result
    in code being executed on the user's computer. The confirmation prompt is the control point that lets a user refuse activation
    of an object in a presentation received from an untrusted source. This policy setting also offers an enable all (allow
    activating OLE Active Content without prompting) option, which removes the prompt entirely and activates the object automatically
    when the action button is clicked. Explicitly configuring the prompting option prevents that state from being introduced
    by a user, by a legacy Group Policy Object, or by an application customization, and produces a registry value that positively
    confirms the intended configuration was applied.
  impact: None - this option enforces the default configuration of PowerPoint, so users will be prompted before OLE Active
    Content is activated exactly as they are today. Page 491
  references:
  - 1. https://support.microsoft.com/en-US/PowerPoint/add-commands-to-yourpresentation-with-action-buttons
  - 2. https://learn.microsoft.com/en-us/compliance/anz/e8-app-harden
  page_start: 491
