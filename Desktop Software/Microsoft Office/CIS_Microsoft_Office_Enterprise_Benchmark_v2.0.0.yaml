  title: Ensure 'Do not show data extraction options when opening corrupt workbooks' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether Excel presents users with a list of data extraction options before beginning
    an Open and Repair operation when users choose to open a corrupt workbook in repair or extract mode. The recommended state
    for this setting is: Enabled. This policy setting controls whether Excel loads graphics when opening Web pages that were
    not created in Excel. The recommended state for this setting is: Disabled.'
  rationale: By default, when users choose to open a corrupt workbook with the Open and Repair command, Excel prompts them
    to choose between repairing or extracting data. A corrupt Excel file may be indicative of malicious tampering. By allowing
    the automatic handling of corrupt spreadsheets, malicious code may be introduced to the user's computer and the network.
    By default, when users open Web pages in Excel, Excel loads any graphics that are included in the pages, regardless of
    whether they were originally created in Excel. Users can change this option in the Web Options dialog box, which is available
    from the Advanced section of the Excel Options dialog box. Allowing Excel to load graphics created in other programs can
    make it vulnerable to possible future zero-day attacks that use graphic files as an attack vector. If such an event occurs,
    this setting can be used to mitigate the vulnerability.
  impact: This setting will prevent Excel users from choosing how workbooks are recovered, which could increase desktop support
    requests. Excel will not load pictures from Web pages that were not created in Excel. This configuration can cause some
    disruptions for users who load Web pages in Excel that were created by other applications. Users who do not load Web pages
    in Excel will not be affected by this setting.
