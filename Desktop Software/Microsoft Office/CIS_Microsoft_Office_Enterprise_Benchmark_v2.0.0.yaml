- id: 1.1.4.1.10
  title: Ensure 'Protection From Zone Elevation' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting prevents processes running in one zone from being elevated to higher privileges in another
    zone. Zone elevation attacks can be severe and happen relatively frequently. The recommended state for this setting is:
    Enabled (Check: groove.exe, excel.exe, mspub.exe, powerpnt.exe, pptview.exe, visio.exe, winproj.exe, winword.exe, outlook.exe,
    spDesign.exe, exprwd.exe, msaccess.exe, onent.exe, mse7.exe).'
  rationale: Internet Explorer places restrictions on each web page that users can use the browser to open. Web pages on a
    user's local computer have the fewest security restrictions and reside in the Local Machine zone, making this security
    zone a prime target for malicious users and code. Disabling or not configuring this setting could allow pages in the Internet
    zone to navigate to pages in the Local Machine zone to then run code to elevate privileges. This could allow malicious
    code or users to become active on user computers or the network.
  impact: 'Websites that rely on navigation to other higher privileged sites may not work properly. To allow such websites
    to work properly, use Group Policy to add them to the Trusted Sites zone. Note: Enabling this setting also disables JavaScript
    navigation if no security context is present.'
  references: []
