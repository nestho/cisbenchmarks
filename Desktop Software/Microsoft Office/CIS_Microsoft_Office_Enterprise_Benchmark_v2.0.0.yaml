- id: 1.1.4.1.7
  title: Ensure 'Mime Sniffing Safety Feature' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting determines whether Internet Explorer MIME sniffing prevents promotion of a file of one
    type to a more dangerous file type. For example, it does not allow scripts to run from a file marked as text. For Office,
    this setting affects any web-based content that is accessed within Office. The recommended state for this setting is:
    Enabled (Check: groove.exe, excel.exe, mspub.exe, powerpnt.exe, pptview.exe, visio.exe, winproj.exe, winword.exe, outlook.exe,
    spDesign.exe, exprwd.exe, msaccess.exe, onent.exe, mse7.exe).'
  rationale: MIME file-type spoofing is a potential threat to your organization. It is recommended that you ensure these files
    are consistently handled to help prevent malicious file downloads that may infect your network.
  impact: When set to Enabled, MIME sniffing will not promote a file of one type to a more dangerous file type. If you disable
    this policy setting, MIME sniffing configures Internet Explorer processes to allow promotion of a file from one type to
    a more dangerous file type. For example, a text file could be promoted to an executable file, which is dangerous because
    any code in the supposed text file would be executed.
  references: []
