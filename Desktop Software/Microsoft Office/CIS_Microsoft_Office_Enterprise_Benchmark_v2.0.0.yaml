- id: 2.2.4.7.3
  title: 'Ensure ''Force file extension to match file type'' is set to ''Enabled: Always match file type'''
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls how Excel loads file types that do not match their extension. Excel can load
    files with extensions that do not match the files'' type. For example, if a comma-separated values (CSV) file named example.csv
    is renamed example.xls (or any other file extension supported by Excel 2003 and earlier only), Excel can properly load
    it as a CSV file. The recommended state for this setting is: Enabled: Always match file type This policy setting controls
    whether encrypted macros in Open XML documents are required to be scanned with anti-virus software before being opened.
    The recommended state for this setting is: Enabled: Scan encrypted macros (default).'
  rationale: Some attacks target specific file formats. If Excel is allowed to load files with extensions that do not match
    their file types, a malicious person can deceive users into loading dangerous files that have incorrect extensions. By
    default, if users attempt to open files with the wrong extension, Excel opens the file and displays a warning that the
    file type is not what Excel expected. When an Office Open XML document is rights-managed or password protected, macros
    that are embedded in the document are encrypted along with the rest of the workbook's contents. Macros can contain malicious
    code which could cause a virus to load undetected and lead to data loss or reduced application functionality.
  impact: Earlier versions of Excel did not enforce file type matching. Enabling this setting and selecting Always match file
    type might cause disruptions for users who rely on the functionality of earlier versions of Excel and could interfere
    with the operation of tools and scripts that rely on it. None - this is the default behavior.
