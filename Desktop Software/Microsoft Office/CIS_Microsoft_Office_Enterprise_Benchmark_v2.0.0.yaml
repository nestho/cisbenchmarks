  title: Ensure 'Include Internet in Safe Zones for Automatic Picture Download' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether pictures and external content in HTML e-mail messages from untrusted
    senders on the Internet are downloaded without Outlook users explicitly choosing to do so. When Disabled, Outlook does
    not consider the Internet a safe zone, which means that Outlook will not automatically download content from external
    servers unless the sender is included in the Safe Senders list. Recipients can choose to download external content from
    untrusted senders on a message-by-message basis. The recommended state for this setting is: Disabled. This policy setting
    allows administrators to specify a folder path for the Secure Temporary Files rather than using the one that is randomly
    generated by Outlook. The recommended state for this setting is: Disabled. This policy setting controls whether Outlook
    considers a missing certificate revocation list (CRL) a warning or an error. Digital certificates contain an attribute
    that shows where the corresponding CRL is located. CRLs contain lists of digital certificates that have been revoked by
    their controlling certification authorities (CAs), typically because the certificates were issued improperly, or their
    associated private keys were compromised. The recommended state for this setting is: Enabled: Error. This policy setting
    controls how Outlook functions when a root certificate is missing. Outlook will display either an error or warning based
    on the status of the root certificate. The recommended state for this setting is: Enabled: Error. This policy setting
    allows the configuration of Level 2 errors as warnings instead of errors. Level 2 errors occur when the message signature
    appears to be valid, but there are other issues with the signature. The recommended state for this setting is: Disabled.
    Note: Potential Level 2 error conditions include the following: • Unknown Signature Algorithm • No Signing Certification
    Found • Bad Attribute Sets • No Issuer Certificate found • No CRL Found • Out-of-date CRL • Root Trust Problem • Out-of-date
    CTL Note #2: The title of the Group Policy text is slightly misleading. Promote Level 2 errors as errors, not warnings
    should actually read Promote Level 2 errors as warnings, not errors which would align more closely with the description
    of the various states Enable/Disable. This policy setting controls how Outlook retrieves Certificate Revocation Lists
    (CRLs) to verify the validity of certificates. CRLs are lists of digital certificates that have been revoked by their
    controlling Certificate Authority (CAs), typically because the certificates were issued improperly or their associated
    private keys were compromised. The recommended state for this setting is: Enabled: When online always retrieve the CRL.'
  rationale: 'Web beacons are embedded images or other external content in HTML e-mails that load from a remote server when
    the message is opened. This confirms to the sender that the recipient''s e-mail address is valid and active, since the
    request only fires if the message is displayed. Attackers and spammers use this confirmation to refine target lists for
    follow-up phishing, spam, or malware campaigns. Configuring Outlook to block automatic download of external content in
    HTML e-mails from untrusted senders prevents this confirmation signal, denying attackers a low-cost method of validating
    active addresses. Setting a designated specific path and folder to use as the Secure Temporary Files folder is not recommended
    because all users will have temporary Outlook files in the same predictable location, which is not as secure. If the name
    of this folder is well known, a malicious user or malicious code might target this location to try and gain access to
    attachments. If a CRL is missing or unavailable, Outlook cannot determine whether a certificate has been revoked. An improperly
    issued certificate or one that has been compromised might be used to gain access to data. When Outlook accesses a certificate,
    it validates that it can trust the certificate by examining the root certificate of the issuing CA. If the root certificate
    can be trusted, then certificates issued by the CA can also be trusted. If Outlook cannot find the root certificate, it
    cannot validate that any certificates issued by that CA can be trusted. An attacker may compromise a root certificate
    and then remove the certificate in an attempt to conceal the attack. Cryptographic errors in Outlook are classified as
    Level 1 (serious errors) or Level 2 (not as serious). By default, Outlook generates a warning, rather than an error, when
    a level 2 condition occurs: the certificate that generated the warning is treated as valid, and the user is not informed
    of the problem unless he or she opens the Signature Details dialog box and examines the certificate. In some cases, treating
    level 2 conditions as warnings can cause users to overlook potentially significant signature problems. Outlook may improperly
    trust a revoked certificate, which could put the system and data at risk.'
  impact: None - this is the default behavior. None - This enforces the default. Users will be prevented from using certificates
    when the appropriate CRL is not available to verify them. This could increase desktop support requests. None - this is
    the default behavior. Disabling this setting can cause disruptions for users who work with digital certificates in Outlook.
    These users may experience an increased number of errors that prevent them from working effectively with e-mail, which
    could increase desktop support requests. Page 376 None - this is the default behavior.
