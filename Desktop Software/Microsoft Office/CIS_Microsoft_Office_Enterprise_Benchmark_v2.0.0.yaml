- id: 2.5.10.6.3
  title: Ensure 'Make Outlook the default program for E-mail, Contacts, and Calendar' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether Outlook is the default program for e-mail, contacts, and calendar services.
    If this policy setting is enabled, the "Make Outlook the default program for E-mail, Contacts, and Calendar" check box
    on the General tab of the Office Center is selected and users cannot change it. The recommended state for this setting
    is: Enabled. This policy setting determines what restrictions apply to users who publish their calendars on Office.com
    or third-party World Wide Web Distributed Authoring and Versioning (WebDAV) servers. The recommended state for this setting
    is: Enabled. This policy setting controls whether Outlook users can publish their calendars to a Distributed Authoring
    and Versioning (DAV) server. The recommended state for this setting is: Enabled. This policy setting controls whether
    Outlook users can publish their calendars to the Office.com Calendar Sharing Service. The recommended state for this setting
    is: Enabled. This policy setting controls the level of calendar details that Outlook users can publish to the Microsoft
    Outlook Calendar Sharing Service. The recommended state for this setting is: Enabled: Disables ''Full details'' and ''Limited
    details''. This policy setting controls whether Outlook can automatically upload calendar updates to Office.com. The recommended
    state for this setting is: Enabled. This policy setting controls whether recipients'' e-mail addresses are automatically
    added to the user''s Safe Senders List in Microsoft Outlook. The recommended state for this setting is: Disabled. This
    policy setting controls whether the Junk E-mail Filter is enabled in Outlook. The recommended state for this setting is:
    Disabled. Note: This policy setting does not affect the configuration of the Microsoft Exchange Server Intelligent Message
    Filter (IMF), which provides server-level junk e-mail filtering. This policy setting controls your Junk E-mail protection
    level. By selecting the High option, Outlook intercepts most junk e-mail, but might incorrectly classify some legitimate
    messages as junk. Users are advised to check their Junk Email folders often. The recommended state for this setting is:
    Enabled: High. This policy setting controls whether Outlook analyzes e-mail from users'' Contacts when filtering junk
    e-mail. The recommended state for this setting is: Disabled.'
  rationale: 'If another application is used to provide these services and your organization does not ensure the security
    of that application, it could be exploited to gain access to sensitive information or launch other malicious attacks.
    If the organization has policies that govern the use of personal information management software, allowing users to change
    the default configuration could enable them to violate such policies. If this policy setting is unconfigured, users can
    share their calendars with others by publishing them to the Office.com Calendar Sharing Services and to a server that
    supports the World Wide Web Distributed Authoring and Versioning (WebDAV) protocol. When this setting is configured (enabled
    or disabled) calendars that are published on Office.com must have restricted access (users other than the calendar owner/publisher
    who wish to view the calendar can only do so if they receive invitations from the calendar owner), and users cannot publish
    their calendars to third-party DAV servers. By default, Outlook users can share their calendars with others by publishing
    them to a server that supports the World Wide Web Distributed Authoring and Versioning (WebDAV) protocol. Unlike the Microsoft
    Office.com Calendar Sharing Service, which allows users to manage other people''s access to their calendars, DAV access
    restrictions can only be accomplished through server and folder permissions, and might require the assistance of the server
    administrator to set up and maintain. If these permissions are not managed properly, unauthorized people could access
    sensitive information. When users publish their calendars to Office.com, it shares calendar and availability information
    with other people outside of the organization. If a calendar is visible to everyone on Office.com or third-party DAV servers,
    sensitive information contained in calendar appointments might be revealed. If users are allowed to publish limited or
    full details, sensitive information in their calendars could become exposed to parties who are not authorized to have
    that information. When users publish their calendar to Microsoft Office.com using the Microsoft Office Outlook Calendar
    Sharing Service, Outlook updates the calendars online at regular intervals unless they click Advanced and select Single
    Upload: Updates will not be uploaded from the Published Calendar Settings dialog box. Allowing this could inadvertently
    expose data that was not meant to be shared. Automatically adding e-mail recipients to a user''s Safe Senders List causes
    future messages from that address to bypass the spam and phishing filtering mechanisms provided by Outlook, regardless
    of whether the message would otherwise be flagged as junk. Disabling this setting prevents end users from enabling it
    in the Outlook user interface. The Junk E-mail Filter in Outlook is designed to intercept the most obvious junk e-mail,
    or spam, and send it to users'' Junk E-mail folders. The filter evaluates each incoming message based on several factors,
    including the time when the message was sent and the content of the message. The filter does not single out any particular
    sender or message type, but instead analyzes each message based on its content and structure to discover whether or not
    it is probably spam. By default, the Junk E-mail Filter in Outlook is enabled. If this configuration is changed, users
    can receive large amounts of junk e-mail in their Inboxes, which could make it difficult for them to work with business-related
    e-mail messages. The Junk E-mail Filter in Outlook is designed to intercept the most obvious junk e-mail, or spam, and
    send it to users'' Junk E-mail folders. The filter evaluates each incoming message based on several factors, including
    the time when the message was sent and the content of the message. The filter does not single out any particular sender
    or message type, but instead analyzes each message based on its content and structure to discover whether or not it is
    probably spam. E-mail addresses in users'' Contacts list are treated as safe senders for purposes of filtering junk e-mail.
    If a trusted contact''s e-mail is hijacked or compromised, the recipient of a spam campaign may become a victim as the
    e-mail won''t receive the same scrutiny from Outlook''s junk e-mail filtering.'
  impact: In most environments that use the Microsoft Office system, Outlook is often already the default program for e-mail,
    contacts, and calendaring for most users. Enabling this setting is therefore unlikely to cause usability issues. Most
    users do not publish their calendars to be available to every user on Office.com, so the effect will likely be minimal.
    This setting could cause disruptions for Outlook users who publish their calendar data to a DAV server. Such users will
    need to publish their calendar data to a different resource, such as the Microsoft Online Calendar Sharing Service, or
    stop publishing their calendar data. This setting could cause disruptions for Outlook users who publish their calendar
    data to Microsoft Office.com. This setting could cause disruptions for Outlook users who rely on the ability to publish
    details of their appointments to the Microsoft Office Outlook Calendar Sharing Service. These users will have to communicate
    appointment details to outside parties by other means. This setting could cause disruptions for users who publish their
    calendars to the Microsoft Office Outlook Calendar Sharing Service. These users will have to use the Single Upload option
    to manually update their calendars. If users do not publish regularly, their online calendars could become significantly
    out of date. In most situations, modifying this setting will have minimal effect on usability. However, if users send
    e-mail messages to many recipients, manually adding the recipients to a Safe Senders List might affect productivity. In
    such situations, administrators can choose to enable the setting for some groups of users. This setting enforces the default
    and should have no impact to users. Users may experience more false positives when this is set to High, requiring them
    to check their Junk e-mail folder more often. When disabled, users may find the e-mail from a contact could end up in
    the junk e-mail box depending on the contents of the e-mail. Outlook users will need to check this folder more often as
    to not miss something, but this will allow for more scrutiny and less trust of said e-mails.
