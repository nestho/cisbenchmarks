- id: 2.3.27.20
  title: Ensure 'Disable All ActiveX' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether ActiveX controls are disabled across Microsoft Office applications. The
    recommended state for this setting is: Enabled. This policy setting controls whether Office applications can poll Office
    servers to retrieve lists of published links. The recommended state for this setting is: Enabled. Note: This policy setting
    applies to Microsoft SharePoint Server specifically. It does not apply to Microsoft SharePoint Foundation.'
  rationale: Without this setting, users can change the ActiveX trust level in the Trust Center of Microsoft Access, PowerPoint,
    Word, and Excel, and untrusted controls are presented in the Message Bar for the user to allow or block. An attacker who
    delivers a document containing a malicious ActiveX control only has to convince the user to click Enable, and the control
    then runs with that user's privileges. Enabling this setting prevents Office from initializing ActiveX controls outside
    of trusted locations, so the control never runs and the user is never asked. By default, users of Office applications
    can see and use links to Microsoft Office SharePoint Server sites from those applications. Administrators configure published
    links to Office applications during initial deployment and can add or change links as part of regular operations. These
    links appear on the My SharePoint Sites tab of the Open, Save, and Save As dialog boxes when opening and saving documents
    from these applications. Links can be targeted so that they only appear to users who are members of certain groups. If
    a malicious person gains access to the list of published links, they could modify the links to point to unapproved sites,
    which could make sensitive data vulnerable to exposure.
  impact: 'Any legitimate workflow that depends on ActiveX controls in documents, forms, or templates such as legacy Access
    applications or custom Word/Excel forms built on ActiveX will stop functioning until the control is relocated to a trusted
    location or removed as a dependency. Note: As of April 2025, Microsoft disables ActiveX controls by default in Microsoft
    365 and Office 2024, so this setting formalizes and enforces behavior that is already the outof-box default on current
    builds; see the References section. If this setting is Enabled, users will not be able to use the list of published links
    to open and save files directly from within Office applications, which could hinder the use of SharePoint Server for document
    collaboration. Note#2: This setting applies to Microsoft Office SharePoint Server specifically. It does not apply to Windows
    SharePoint Services (WSS). Page 264'
  references:
  - 1. https://support.microsoft.com/en-us/office/vba/activex-controls-are-disabled-bydefault-in-microsoft-365-and-office-2024
  - 2. https://techcommunity.microsoft.com/blog/microsoft365insiderblog/activexdisabled-by-default-in-microsoft-365/4403157
