  title: Ensure 'Automatically receive small updates to improve reliability' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether Microsoft Office Diagnostics is enabled. Office Diagnostics enables Microsoft
    to diagnose system problems by periodically downloading a small file to the computer. The recommended state for this setting
    is: Disabled.'
  rationale: Office Diagnostics is used to improve the user experience by periodically downloading a small file to the computer
    with updated help information about specific problems. If Office Diagnostics is enabled, it collects information about
    specific errors and the IP address of the computer. When new help information is available, that help information is downloaded
    to the computer that experienced the related problems. Office Diagnostics does not transmit any personally identifiable
    information to Microsoft other than the IP address of the computer requesting the update. By default, users have the opportunity
    to opt into receiving updates from Office Diagnostics the first time they run an Office application. If the organization
    has policies that govern the use of external resources such as Office Diagnostics, allowing users to opt in to this feature
    might cause them to violate these policies.
  impact: Disabling this setting will prevent users from receiving information and advice from Microsoft about fixing and
    preventing Office application errors, which could cause your support department to experience an increase in desktop support
    requests.
