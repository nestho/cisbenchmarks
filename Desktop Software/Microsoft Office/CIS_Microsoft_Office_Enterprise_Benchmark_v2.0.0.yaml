- id: 2.8.4.1.1
  title: Ensure 'Block macros from running in Office files from the internet' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting allows the blocking of macros from running in Office files that come from the internet.
    By enabling this policy setting, macros are blocked from running, even if "Enable all macros" is selected in the Macro
    Settings section of the Trust Center. Users will receive a notification that macros are blocked from running. The exceptions
    when macros will be allowed to run are: • The Office file is saved to a Trusted Location. • The Office file was previously
    trusted by the user. • Macros are digitally signed and the matching Trusted Publisher certificate is installed on the
    device. The recommended state for this setting is: Enabled. Note: This setting will apply to documents downloaded from
    Internet websites, consumer storage providers (OneDrive, Google Drive, and Dropbox) or from public shares on the Internet
    (file-sharing sites), and attachments to emails that were received from outside the Exchange organization. This policy
    setting controls whether the specified Office application notifies users when unsigned application add-ins are loaded
    or silently disables such add-ins without notification. The recommended state for this setting is: Enabled.'
  rationale: Windows marks files downloaded from the internet using an alternate NTFS data stream. Files from untrusted sources
    can contain malicious payloads embedded in macros that may compromise the system on which they are run. Blocking macros
    in files marked as originating from the internet helps prevent known, unknown, and obfuscated code from being executed
    accidentally by the end user. Allowing unsigned application add-ins could cause the application to load dangerous add-ins
    and as a result, malicious code could become active endpoints and the network.
  impact: This enforces the default behavior and should not cause additional impact. Page 494 Users will not receive notifications
    about unsigned add-ins, which can reduce confusion and interruptions. However, this also means that legitimate unsigned
    add-ins will be blocked without user notification, which could potentially disrupt workflows if users rely on such add-ins.
  references:
  - 1. https://learn.microsoft.com/en-us/DeployOffice/security/internet-macros-blocked
