- id: 1.1.4.1.11
  title: Ensure 'Restrict ActiveX Install' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting enables blocking of ActiveX® control installation prompts for Internet Explorer processes.
    Users often choose to install software such as ActiveX controls that are not permitted by their organization''s security
    policy. Such software can pose significant security and privacy risks to networks. The recommended state for this setting
    is: Enabled (Check: groove.exe, excel.exe, mspub.exe, powerpnt.exe, pptview.exe, visio.exe, winproj.exe, winword.exe,
    outlook.exe, spDesign.exe, exprwd.exe, msaccess.exe, onent.exe, mse7.exe).'
  rationale: Microsoft ActiveX controls allow unmanaged, unprotected code to run on the user computers. ActiveX controls do
    not run within a protected container in the browser like other types of HTML or Microsoft Silverlight-based controls.
    Disabling or not configuring this setting does not block prompts for ActiveX control installations and displays these
    prompts to users. This could allow malicious code to become active on user computers or the network.
  impact: Microsoft ActiveX controls allow unmanaged, unprotected code to run on the user computers. ActiveX controls do not
    run within a protected container in the browser like other types of HTML or Microsoft Silverlight-based controls. Disabling
    or not configuring this setting does not block prompts for ActiveX control installations and these prompts display to
    users. This could allow malicious code to become active on user computers or the network.
  references: []
