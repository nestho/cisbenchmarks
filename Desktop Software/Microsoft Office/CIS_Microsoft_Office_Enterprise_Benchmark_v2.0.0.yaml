- id: 2.3.32.1
  title: Ensure 'Disable Smart Document's use of manifests' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether Office applications can load an XML expansion pack manifest file with
    a Smart Document. An XML expansion pack is the group of files that constitutes a Smart Document in Excel and Word. Packaging
    of one or more components provides the logic needed for a Smart Document using an XML expansion pack. These components
    can include any type of file, including XML schemas, Extensible Stylesheet Language Transforms (XSLTs), dynamic-link libraries
    (DLLs), and image files, as well as additional XML files, HTML files, Word files, Excel files, and text files. The key
    component to building an XML expansion pack is creating an XML expansion pack manifest file. By creating this file, the
    locations of all files that make up the XML expansion pack is specified, as well as information that instructs Office
    how to set up the files for Smart Document. The XML expansion pack can also contain information about how to set up some
    files, such as how to install and register a COM object required by the XML expansion pack. The recommended state for
    this setting is: Enabled.'
  rationale: XML expansion packs can be used to initialize and load malicious code, which might affect the stability of a
    computer and lead to data loss.
  impact: Enabling this setting prevents users from working with Smart Documents.
  references: []
