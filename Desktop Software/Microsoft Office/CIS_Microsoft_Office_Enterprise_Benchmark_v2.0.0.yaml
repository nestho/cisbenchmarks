- id: 1.1.4.1.13
  title: Ensure 'Saved from URL' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This setting controls whether Internet Explorer evaluates URLs passed to it by Office applications for Mark
    of the Web (MOTW) comments. The recommended state for this setting is: Enabled (Check: groove.exe, excel.exe, mspub.exe,
    powerpnt.exe, pptview.exe, visio.exe, winproj.exe, winword.exe, outlook.exe, spDesign.exe, exprwd.exe, msaccess.exe, onent.exe,
    mse7.exe).'
  rationale: If Internet Explorer does not evaluate a Web page loaded from a UNC share for a Mark of the Web (MOTW) comment,
    the page could run in the less restrictive Local Intranet zone instead of the Internet zone, allowing potentially dangerous
    code, such as script or ActiveX content, to execute with elevated trust. Because this evaluation can be configured separately
    for Internet Explorer instances spawned by Office applications, failing to enable it here leaves a gap even if standalone
    IE is otherwise hardened.
  impact: Enabling this setting can cause some Web pages saved on UNC shares to run in a more restrictive security zone when
    opened from Office applications than they would if the setting were disabled or not configured. However, a page with a
    MOTW indicating it was saved from an Internet site is presumed to have been designed to run in the Internet zone in the
    first place, so most users should not experience significant usability issues.
  references: []
  page_start: 51
