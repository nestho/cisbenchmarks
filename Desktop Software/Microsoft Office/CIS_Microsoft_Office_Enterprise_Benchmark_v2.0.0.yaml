- id: 2.5.11.1
  title: Ensure 'Turn off Outlook Social Connector' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting allows the configuration of the Outlook Social Connector. The Outlook Social Connector
    allows users to work in Outlook while staying up to date on the status and activities of their friends and contacts, whether
    they''re from an organization, or from social networking sites on the Internet, like Facebook and LinkedIn. The recommended
    state for this setting is: Enabled. This policy setting controls whether Outlook automatically downloads external content
    in e-mails from senders in the Safe Senders List or Safe Recipients List. The recommended state for this setting is: Disabled.'
  rationale: Data may be synchronized between Outlook and the users' social media networks, like Facebook and LinkedIn. Malicious
    senders can send HTML e-mail messages with embedded Web beacons, or pictures and other content from external servers that
    can be used to track whether specific recipients have opened a message. Viewing an e-mail message that contains a Web
    beacon provides confirmation that the recipient's e-mail address is valid, which leaves the recipient vulnerable to additional
    spam and harmful e-mail. To help protect users from Web beacons, Outlook can be configured to automatically block the
    display of external content in e-mail messages. However, because this configuration could block desirable content from
    display, Outlook can also be configured to automatically display external content in any messages sent by people who are
    listed in users' Safe Senders Lists or Safe Recipients Lists. By default, Outlook automatically displays external content
    in e-mail messages from people listed in users' Safe Senders Lists or Safe Recipients Lists, and automatically blocks
    external content in other messages. If a malicious sender is accidentally added to a user's Safe Senders List or Safe
    Recipients List, Outlook will display external content in all e-mail messages from the malicious sender, which could include
    Web beacons.
  impact: The Outlook Social Connector will be disabled preventing users from synchronizing data in Outlook with their social
    media networks. Outlook will not automatically download external content for messages sent by people listed in user's
    Safe Senders Lists or Safe Recipients Lists. This will cause users to have to download content for each message individually.
    This configuration can cause some disruption for users who regularly receive HTML e-mail messages that contain graphics
    and other external content, because they will need to download content for each message individually. Page 359
