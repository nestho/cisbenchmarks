- id: 2.6.6.6.3
  title: Ensure 'Make hidden markup visible' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether hidden markup is visible when users open PowerPoint files in standard
    or HTML format. The recommended state for this setting is: Enabled.'
  rationale: If a file is saved with hidden markup, users might inadvertently distribute sensitive comments or information
    outside of their trusted circle without realizing that this information is still present in the document.
  impact: In most cases, markup is intended to be visible to users. When this setting is enabled, hidden markup will also
    become visible upon opening the file. If users intended certain markup to remain hidden, they will need to manually hide
    it again. However, markup does not display in presentation mode in PowerPoint, even if it is visible in design mode, so
    it is likely that this setting will have a minimal impact on usability. Users can permanently locate and remove undesired
    markup using the Document Inspector feature in PowerPoint. Enabling this setting enforces the default configuration in
    PowerPoint.
  references: []
