- id: 1.3.1
  title: 'Ensure ''Block Flash activation in Office documents'' is set to ''Enabled: Block all activation'''
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether the Adobe Flash control can be activated by Office documents. Note that
    activation blocking applies only within Office processes. "Block all activation" prevents the Flash control from being
    loaded, whether directly referenced by the document or indirectly by another embedded object. The recommended state for
    this setting is: Enabled: Block all activation.'
  rationale: 'Adobe Flash was discontinued in 2020. Flash content has had a long history of exploitation by malicious software
    developers. Blocking will ensure Office does not execute any Flash content. Enforcing the default ensures that the system
    was not configured in an insecure way. Flash zero-days have been delivered specifically through Office documents: CVE-20184878
    was exploited via SWF objects embedded in Excel documents, and CVE-201815982 was delivered through a Word document containing
    an embedded Flash ActiveX control.'
  impact: Adobe Flash Player reached end of support on December 31, 2020, Adobe's kill switch has blocked all Flash content
    from executing since January 12, 2021, and update KB4577586 permanently removed Flash from Windows. On a supported, patched
    endpoint no Flash content can render regardless of this setting, and Microsoft 365 Apps for enterprise already blocks
    Flash activation by default, so in most environments this policy produces no observable change. Block all activation blocks
    Flash activated indirectly by another embedded object or by an add-in, not only Flash directly embedded or linked in a
    document, so a legacy add-in that instantiates the Flash control inside an Office process will stop functioning. Page
    61
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365-apps/security/security-baseline
  page_start: 61
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

