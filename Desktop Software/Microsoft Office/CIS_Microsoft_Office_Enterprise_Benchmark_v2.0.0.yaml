- id: 1.1.4.1.1
  title: Ensure 'Add-on Management' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting manages Internet Explorer add-ons — which add-ins are always enabled, always disabled
    (blocked), or configurable by the user. The recommended state for this setting is: Enabled (Check: groove.exe, excel.exe,
    mspub.exe, powerpnt.exe, pptview.exe, visio.exe, winproj.exe, winword.exe, outlook.exe, spDesign.exe, exprwd.exe, msaccess.exe,
    onent.exe, mse7.exe).'
  rationale: Internet Explorer add-ons are pieces of code that run in Internet Explorer to provide additional functionality.
    Rogue add-ons may contain viruses or other malicious code. Disabling or not configuring this setting could allow malicious
    code or users to become active on user computers or the network. For example, a malicious user can monitor and then use
    keystrokes that a user types into Internet Explorer. Even legitimate addons may demand resources that compromise the performance
    of Internet Explorer and the operating systems of user computers.
  impact: Some legitimate programs, including ones from Microsoft, use add-ons to display documents, audio, and video in Internet
    Explorer. The organization's Group Policy should incorporate approved, commonly used add-ons to avoid limiting important
    user functionality.
  references: []
  page_start: 26
  audit_raw: "Navigate to the UI Path articulated in the Remediation section and confirm it is set as\nprescribed. This group\
    \ policy setting is backed by the following registry location. Each\noffice application executable will have a unique\
    \ value name with a value of 1.\nHKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Internet\nExplorer\\Main\\FeatureControl\\FEATURE_ADDON_MANAGEMENT:\"\
    Office Application.exe\"\nExample:\nHKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Internet\nExplorer\\Main\\FeatureControl\\\
    FEATURE_ADDON_MANAGEMENT:excel.exe\n Page 26"
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    `Enabled: check all applications'':

    Computer Configuration\Administrative Templates\Microsoft Office 2016

    (Machine)\Security Settings\IE Security\Add-on Management'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location. Each

      office application executable will have a unique value name with a value of 1.

      HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet

      Explorer\Main\FeatureControl\FEATURE_ADDON_MANAGEMENT:"Office Application.exe"

      Example:

      HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet

      Explorer\Main\FeatureControl\FEATURE_ADDON_MANAGEMENT:excel.ex'
    severity: medium
- id: 1.1.4.1.2
  title: Ensure 'Bind to object' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This setting determines whether Microsoft Internet Explorer performs its typical safety checks on Microsoft
    ActiveX® controls when opening URLs that are passed to it by an Office application. By default, Internet Explorer performs
    additional safety checks when ActiveX controls are initialized. Specifically, it prevents the control from being created
    if the kill bit is set in the registry. It also checks the security settings for the zone of the URL in which the control
    is instantiated to determine whether the control can be safely initialized. For the same behavior of the selectable applications,
    such as Excel and Word when they instantiate the use of Internet Explorer, the policy must be Enabled and the applications
    selected. The recommended state for this setting is: Enabled (Check: groove.exe, excel.exe, mspub.exe, powerpnt.exe, pptview.exe,
    visio.exe, winproj.exe, winword.exe, outlook.exe, spDesign.exe, exprwd.exe, msaccess.exe, onent.exe, mse7.exe).'
  rationale: Internet Explorer performs a number of safety checks before initializing an ActiveX control. It will not initialize
    a control if the kill bit for the control is set in the registry, or if the security settings for the zone in which the
    control is located do not allow it to be initialized. This functionality can be controlled separately for instances of
    Internet Explorer spawned by Office applications (for example, if a user clicks a link in an Office document or selects
    a menu option that loads a Web page). A security risk could occur if potentially dangerous controls are allowed to load.
  impact: Enabling this setting can cause some disruptions for users who open Web pages that contain potentially dangerous
    ActiveX controls from Office applications. However, because any affected controls are usually blocked by default when
    Internet Explorer opens Web pages, most users should not experience significant usability issues. Page 28
  references: []
  page_start: 28
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location. Each

    Office application executable will have a unique value name with a value of 1.

    HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet

    Explorer\Main\FeatureControl\FEATURE_SAFE_BINDTOOBJECT\"Office Application.exe"'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Enabled: check all applications:

    Computer Configuration\Administrative Templates\Microsoft Office 2016

    (Machine)\Security Settings\IE Security\Bind to Object'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location. Each

      Office application executable will have a unique value name with a value of 1.

      HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet

      Explorer\Main\FeatureControl\FEATURE_SAFE_BINDTOOBJECT\"Office Application.exe"'
    severity: medium
- id: 1.1.4.1.3
  title: Ensure 'Consistent Mime Handling' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'Internet Explorer uses Multipurpose Internet Mail Extensions (MIME) data to determine file handling procedures
    for files received through a Web server. This policy setting determines whether Internet Explorer requires all file-type
    information provided by Web servers to be consistent. For example, if the MIME type of a file is text/plain but the MIME
    data indicates that the file is actually an executable file, Internet Explorer changes its extension to reflect this executable
    status. This capability helps ensure that executable code cannot masquerade as other types of data that may be trusted.
    The recommended state for this setting is: Enabled (Check: groove.exe, excel.exe, mspub.exe, powerpnt.exe, pptview.exe,
    visio.exe, winproj.exe, winword.exe, outlook.exe, spDesign.exe, exprwd.exe, msaccess.exe, onent.exe, mse7.exe).'
  rationale: Users can use Internet Explorer to unknowingly download malicious content disguised with an incorrect filename
    extension or incorrectly marked in the MIME header. Once downloaded, an incorrect handler can run the file, enabling the
    malicious content to cause damage to the user's system or network.
  impact: Internet Explorer uses both the extension of the filename and the MIME information to decide how to handle a file.
    Enabling this setting requires that information in the MIME header matches the file extension provided. Since mismatched
    files will be blocked by enabling this setting, ensure that any web server under organizational control is set up correctly.
  references: []
  page_start: 30
  audit_raw: "Navigate to the UI Path articulated in the Remediation section and confirm it is set as\nprescribed. This group\
    \ policy setting is backed by the following registry location. Each\nOffice application executable will have a unique\
    \ value name with a value of 1.\nHKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Internet\nExplorer\\Main\\FeatureControl\\FEATURE_MIME_HANDLING\\\
    \"Office Application.exe\"\n Page 30"
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Enabled: check all applications:

    Computer Configuration\Administrative Templates\Microsoft Office 2016

    (Machine)\Security Settings\IE Security\Consistent Mime Handling'
  checks:
  - type: manual_review
    info: "Navigate to the UI Path articulated in the Remediation section and confirm it is set as\nprescribed. This group\
      \ policy setting is backed by the following registry location. Each\nOffice application executable will have a unique\
      \ value name with a value of 1.\nHKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Internet\nExplorer\\Main\\FeatureControl\\\
      FEATURE_MIME_HANDLING\\\"Office Application.exe\"\n Page 30"
    severity: medium
- id: 1.1.4.1.4
  title: Ensure 'Disable user name and password' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This setting controls whether Internet Explorer opens URLs containing user information that are passed to
    it by an Office application. The recommended state for this setting is: Enabled (Check: groove.exe, excel.exe, mspub.exe,
    powerpnt.exe, pptview.exe, visio.exe, winproj.exe, winword.exe, outlook.exe, spDesign.exe, exprwd.exe, msaccess.exe, onent.exe,
    mse7.exe).'
  rationale: The Uniform Resource Locator (URL) standard allows user authentication to be included in URL strings in the form
    http://username:password@example.com. A malicious user might use this URL syntax to create a hyperlink that appears to
    open a legitimate Web site but actually opens a deceptive (spoofed) Web site. For example, the URL http://www.microsoft.com@example.com
    appears to open http://www.microsoft.com but actually opens http://example.com. To protect users from such attacks, Internet
    Explorer usually blocks any URLs using this syntax. This functionality can be controlled separately for instances of Internet
    Explorer spawned by Office applications (for example, if a user clicks a link in an Office document or selects a menu
    option that loads a Web page). If user names and passwords in URLs are allowed, users could be diverted to dangerous Web
    pages, which could pose a security risk.
  impact: Enabling this setting can cause some disruptions for users who open URLs containing user authentication information
    from Office applications. However, since such URLs are blocked by default when Internet Explorer opens Web pages through
    conventional means, most users should not experience significant usability issues. Page 32
  references: []
  page_start: 32
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location. Each

    Office application executable will have a unique value name with a value of 1.

    HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet

    Explorer\Main\FeatureControl\FEATURE_HTTP_USERNAME_PASSWORD_DISABLE\"Office

    Application.exe"'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Enabled: check all applications:

    Computer Configuration\Administrative Templates\Microsoft Office 2016

    (Machine)\Security Settings\IE Security\Disable User Name and Password'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location. Each

      Office application executable will have a unique value name with a value of 1.

      HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet

      Explorer\Main\FeatureControl\FEATURE_HTTP_USERNAME_PASSWORD_DISABLE\"Office

      Application.exe"'
    severity: medium
