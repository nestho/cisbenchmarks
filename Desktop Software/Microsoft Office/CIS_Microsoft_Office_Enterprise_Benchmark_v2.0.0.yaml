- id: 2.5.14.2.2
  title: Ensure 'Do not display 'Publish to GAL' button' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether Outlook users can publish e-mail certificates to the Global Address List
    (GAL). The GAL contains information for all email users, distribution groups, and Exchange resources. The recommended
    state for this setting is: Enabled.'
  rationale: 'When a user selects "Publish to GAL" in Outlook, their S/MIME signing and encryption certificates are written
    to the UserSMIMECertificate attribute on their Active Directory user object. Allowing end users to self-publish certificates
    in this way introduces several risks: • Outlook does not remove a previously published certificate from UserSMIMECertificate
    when it is revoked or superseded, so a Certificate Revocation List (CRL) check can be bypassed if a client trusts the
    directorypublished copy. Expired or compromised certificates can remain discoverable and usable by other users'' clients
    indefinitely. • Because Outlook resolves a recipient''s certificate from Active Directory (via the GAL) before other sources,
    an outdated or mismatched entry in UserSMIMECertificate can cause Outlook to encrypt messages using the wrong or invalid
    public key, resulting in messages the intended recipient cannot decrypt. • Each self-published certificate adds binary
    certificate data to the user''s AD object, increasing directory size and replication traffic without administrative oversight
    or lifecycle management. Certificate publication to UserSMIMECertificate should be centralized, for example through automated
    certificate enrollment and directory synchronization. A centralized process ensures only valid, current certificates are
    published, and that revoked or expired certificates are removed in a controlled, auditable manner. Disabling the "Publish
    to GAL" button prevents individual users from bypassing this process. Page 380'
  impact: Enabling this setting removes the self-service "Publish to GAL" option from Outlook; only administrators will be
    able to publish or update a user's certificate in the GAL. Organizations must have an administrative process in place,
    such as certificate autoenrollment with AD publishing or a scripted/manual publishing step, before enabling this setting,
    or S/MIME encryption may fail for users whose certificates are renewed or reissued after this setting takes effect.
  references: []
  page_start: 380
