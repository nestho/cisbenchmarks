    dictionary, and sends it to Microsoft. After about six months, the feature stops sending data to Microsoft and deletes
    the data collection file from the user''s computer. The recommended state for this setting is: Disabled.'
  rationale: Although this feature does not intentionally collect personal information, some of the content that is sent could
    include items that were marked as spelling or grammar errors, such as proper names and account numbers. However, any numbers
    such as account numbers, street addresses, and phone numbers are converted to zeroes when the data is collected. Microsoft
    uses this information solely to improve the effectiveness of the Office Proofing Tools, not to identify users.
  impact: The Customer Experience Improvement Program sends proofing tool data to Microsoft silently and without affecting
    application usage, so disabling the collection and transmission of proofing tool data is unlikely to cause usability issues
    for most users.
