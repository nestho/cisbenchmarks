    code to become active on a user's computer or the network. DIF and SYLK are text-only file formats that are used to exchange
    data between different applications, such as Excel. If a vulnerability is discovered that affects these kinds of files,
    use this setting to protect the organization against attacks by temporarily preventing users from opening files in these
    formats until a security patch is available. Using legacy file formats could allow malicious code to become active on
    a user's computer or the network. Using legacy file formats could allow malicious code to become active on a user's computer
    or the network. Using legacy file formats could allow malicious code to become active on a user's computer or the network.
    Using legacy file formats could allow malicious code to become active on user computers or the network. Using legacy file
    formats could allow malicious code to become active on a user's computer or the network. Using legacy file formats could
    allow malicious code to become active on a user's computer or the network. Using legacy file formats could allow malicious
    code to become active on a user's computer or the network. Using legacy file formats could allow malicious code to become
    active on a user's computer or the network. Using legacy file formats could allow malicious code to become active on a
    user's computer or the network. Using legacy file formats could allow malicious code to become active on user computers
    or the network. Using legacy file formats could allow malicious code to become active on user computers or the network.
    By default, users can open a wide range of legacy file formats in Office that were not designed with modern security protections
    in mind. Several of these formats have been associated with vulnerabilities that attackers have exploited. Setting default
    file block behavior to fully block these files, rather than allowing them to open in Protected View, removes the attack
    surface these legacy parsers present and prevents users from inadvertently opening malicious files delivered via email
    or removable media. Using legacy file formats could allow malicious code to become active on a user's computer or the
    network. Files that originate from an untrusted location may contain malicious software. Requiring a user to open files
    originating from these zones forces them into a read-only mode. This reduces the chance of infection by making the user
    acknowledge a series of prompts before enabling editing. Allowing users to download files from the Internet zone to open
    outside of Protected View could allow malicious code to become active on a user's computer or the network. Opening files
    located in unsafe locations that do not require Protected View could lead to malicious code executing on a user's computer
    or the network. Files that have failed file validation outside of Protected View could allow malicious code to execute
    on the system or the network. Files that have failed file validation outside of Protected View could allow malicious code
    to execute on the system or the network. Email is a common vector for spreading files containing malicious code. Disabling
    Protected View changes this default behavior and could allow malicious code to execute on a user's computer or across
    the network. Content, code, and add-ins are allowed to load from trusted locations with a minimal amount of security,
    without prompting the users for permission. If a dangerous file is opened from a trusted location, it will not be subject
    to standard security measures and could harm the user's computers or data. Trusted locations specified in the Trust Center
    are used to define file locations that are assumed to be safe. Content, code, and add-ins are allowed to load from trusted
    locations with a minimal amount of security, without prompting the users for permission. If a dangerous file is opened
    from a trusted location, it will not be subject to standard security measures and could harm the user's computers or data.
    Untrusted XLL files, as dynamic-link libraries (DLLs), pose a security risk in phishing campaigns, where attackers can
    trick users into executing seemingly harmless files containing malicious payloads. Being executables, XLL files can unwittingly
    run on users' systems, leading to unauthorized code execution, malware installation, and potential data breaches. Windows
    marks files downloaded from the internet using an alternate NTFS data stream. Files from untrusted sources can contain
    malicious payloads embedded in macros that may compromise the system on which they are run. Blocking macros in files marked
    as originating from the internet helps prevent known, unknown, and obfuscated code from being executed accidentally by
    the end user. Allowing unsigned application add-ins could cause the application to load dangerous add-ins and as a result,
    malicious code could become active on user computers and the network. When users open files in Excel that contain VBA
    macros, Excel opens the files with the macros disabled, and displays the Trust Bar with a warning that macros are present
    and have been disabled. Users may then enable these macros by clicking Options on the Trust Bar and selecting the option
    to enable them. This can allow dangerous macros to become active on users computer or the network. When users open files
    in Excel that contain VBA macros, Excel opens the files with the macros disabled, and displays the Trust Bar with a warning
    that macros are present and have been disabled. Users may then enable these macros by clicking Options on the Trust Bar
    and selecting the option to enable them. This can allow dangerous macros to become active on the user's computer or the
    network. XLM is data macro format from the early nineties that was not built with security in mind. Macros can be easily
    exploited and are a favorite hiding place of malicious code. While newer builds of Excel disable XLM macros by default,
    it is an important setting to audit for a secure state in all versions of Excel. By default, Office applications do not
    check the digital signature on application add-ins before opening them. Disabling or not configuring this setting may
    allow an application to load a dangerous add-in. As a result, malicious code could become active on a user's computer
    or the network. Excel displays the Record Macro dialog box with This Workbook already selected in the drop-down menu.
    If a user saves a macro in the active workbook and then distributes the workbook to others, the macro is distributed along
    with the workbook, which could put workbook data at risk if the macro is triggered accidentally or intentionally. Enabling
    programmatic access to the VBA project object model grants any macro running in any opened document full access to the
    core Visual Basic objects, methods, and properties across all open Office projects simultaneously. Microsoft's own developer
    documentation explicitly identifies this as a security hazard because some Office macro viruses exploit this access to
    propagate themselves from one document to others. Keeping this setting disabled removes that propagation vector as a defense-indepth
    measure, while leaving standard macro security enforcement through the Trust Center unaffected.
  impact: 'Configuring this setting to "Always show the alert before publishing" reinforces the default functionality in Excel,
    and is therefore unlikely to cause usability issues for most users Page 104 Microsoft Query files in an untrusted location
    are prevented from opening. Users will not be able to change this setting under File > Options > Trust Center > Trust
    Center Settings > External Content. None - DDE Launch is disabled by default. Enforcing this policy ensures users cannot
    enter an unsecure state. When enabled DDE server lookup isn’t allowed, and users can’t turn on DDE server lookup in the
    Trust Center. A Systems Administrator would need to implement DDE under a zero-trust framework. Page 111 Users will not
    be able to open, save, or view dBase III / IV files. Users will not be able to open, save, or view Dif and Sylk files.
    Users will not be able to open, save, or view Excel 2 macrosheets. Users will not be able to open, save, or view Excel
    2 worksheets. Users will not be able to open, save, or view Excel 3 macrosheets. Users will not be able to open, save,
    or view Excel 3 worksheets. Users will not be able to open, save, or view Excel 4 macrosheets and add-in. Users will not
    be able to open, save, or view Excel 4 workbooks. Users will not be able to open, save, or view Excel 4 worksheets. Users
    will not be able to open, save, or view Excel 95 workbooks. Users will not be able to open, save, or view Excel 95-97
    workbooks and templates. Users will not be able to open, save, or view Excel 97-2003 workbooks and templates. Enabling
    this setting prevents users from opening, viewing, or editing certain types of files in Excel. Users will not be able
    to open, save, or view Web pages and Excel 2003 XML spreadsheets. In addition, the following file types will open in Protected
    View: .mht .mhtml .htm .html .xml .xlmss While in OneNote using the function "Convert a Table to Excel" may cause OneNote
    to freeze until a dialogue box is confirmed. Database files opened from an untrusted location are always opened in Protected
    View. Users will not be able to change this setting under Trust Center Settings > Protected View. When files open in Protected
    View, some functionality will be unavailable; users will be unable to edit the file. However, this enforces the default
    configuration and is therefore unlikely to cause usability issues for most users. Some functionality is not available
    when files are opened in Protected View. In such cases, users must move the files from unsafe locations to safe locations
    in order to access them with full functionality. Disabling this setting enforces the default configuration and is therefore
    unlikely to cause usability issues for most users. Files that are blocked by the validation fail rule will not open on
    a user''s computer. Files that are blocked by the validation fail rule will not open on a user''s computer. Using this
    setting allows the application to open files, and thus users to view valid data and detect invalid data that is visible.
    However, users cannot correct invalid data in the file. Disabling this setting enforces the default configuration and
    is therefore unlikely to cause usability issues for most users. Disabling this setting will cause disruption for users
    who add network locations to the Trusted Locations list. These custom locations added by users are ignored but not removed.
    Trusted locations added in Group Policy that specify a network location are also ignored. All trusted locations (those
    specified in the Trust Center) in the specified applications are ignored, including any trusted locations established
    by Office 2016 during setup, deployed to users using Group Policy, or added by users themselves. Users will be prompted
    again when opening files from trusted locations. None - this is the default behavior. This enforces the default behavior
    and should not cause additional impact. Page 162 Users will not receive notifications about unsigned add-ins, which can
    reduce confusion and interruptions. However, this also means that legitimate unsigned add-ins will be blocked without
    user notification, which could potentially disrupt workflows if users rely on such add-ins. This configuration causes
    documents and templates that contain unsigned macros to lose any functionality supplied by those macros. To prevent this
    loss of functionality, users can install the macros in a trusted location, unless the Disable all trusted locations setting
    is configured to Enabled, which will block them from doing so. If your organization does not use any officially sanctioned
    macros, consider choosing No Warnings for all macros but disable all macros for even stronger security. This configuration
    causes documents and templates that contain unsigned macros to lose any functionality supplied by those macros. To prevent
    this loss of functionality, users can install the macros in a trusted location, unless the Disable all trusted locations
    setting is configured to Enabled, which will block them from doing so. If your organization does not use any officially
    sanctioned macros, consider choosing No Warnings for all macros but disable all macros for even stronger security. Page
    168 This enforces the default behavior. Existing XLM macros will not function and should be migrated. This setting could
    cause disruptions for users who rely on add-ins that are not signed by trusted publishers. These users will either have
    to obtain signed versions of such addins or stop using them. Enabling this setting does not prevent users from selecting
    a different location for storing macros, so it is unlikely to cause significant usability issues for most users. None
    - this is the default behavior.'
