- id: 2.3.22.2
  title: 'Ensure ''Block signing into Office'' is set to ''Enabled: Org ID only'''
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether users can provide credentials to Office using either their Microsoft
    Account or the user ID assigned by the organization for accessing Office 365. By selecting the Org ID only option, users
    can sign in only by using the user ID assigned by the organization for accessing Office 365. The recommended state for
    this setting is: Enabled: Org ID only'
  rationale: If end users are allowed to connect personal Microsoft Accounts to an organization's Office applications, then
    confidential data could be exfiltrated to the users' personal cloud storage. Likewise, the users' personal data could
    more easily end up on workrelated systems. By restricting Office 365 sign in to Organization ID only, users will also
    be forced to sign into a tenant that has managed policies and restrictions assigned to them.
  impact: Users will be unable to connect to cloud services not maintained by the organization (such as SharePoint services
    in Office 365) and access the files and services provided by the cloud services.
  references: []
  page_start: 202
  audit_raw: "Navigate to the UI Path articulated in the Remediation section and confirm it is set as\nprescribed. This group\
    \ policy setting is backed by the following registry location with a\nvalue of 2.\nHKEY_USERS\\[USER\nSID]\\SOFTWARE\\\
