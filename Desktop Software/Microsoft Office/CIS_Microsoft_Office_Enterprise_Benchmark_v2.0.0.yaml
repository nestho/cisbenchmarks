  title: 'Ensure ''Document Information Panel Beaconing UI'' is set to ''Enabled: Always show UI'''
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether users see a security warning when they open custom Document Information
    Panels that contain a Web beaconing threat. InfoPath can be used to create custom Document Information Panels that can
    be attached to Excel workbooks, PowerPoint presentations, and Word documents. The recommended state for this setting is:
    Enabled: Always show UI.'
  rationale: InfoPath can be used to create custom Document Information Panels that can be attached to Excel workbooks, PowerPoint
    presentations, and Word documents. A malicious user could insert a Web beacon into an InfoPath form that is used to create
    a custom Document Information Panel. Web beacons can be used to contact an external server when users open the form. Information
    could be gathered by the form, or information entered by users could be sent to an external server and cause them to be
    vulnerable to additional attacks.
  impact: Enabling this setting and selecting "Always show UI" from the drop-down menu can cause some disruptions for users
    who often open documents containing custom Document Information Panels.
