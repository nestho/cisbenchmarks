- id: '1.3'
  title: Tools | Security 1.3.1 Set 'Modal Trust Decision Only' to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls how Access notifies users about untrusted components. If you enable this policy
    setting, when users attempt to open an untrusted Access database that contains user-programmed executable components,
    users see a dialog box where they then must choose whether to enable or disable the components before they can work with
    the database. If you disable or do not configure this policy setting, when users open an untrusted Access database that
    contains user-programmed executable components, Access opens the database with the components disabled and displays the
    Message Bar with a warning that database content has been disabled. Users can inspect the contents of the database, but
    cannot use any disabled functionality until they enable it by clicking Options on the Message Bar and selecting the appropriate
    action. The recommended state for this setting is: Disabled.'
  rationale: By default, when users open an untrusted Access 2013 database that contains userprogrammed executable components,
    Access opens the database with the components disabled and displays the Message Bar with a warning that database content
    has been disabled. Users can inspect the contents of the database, but cannot use any disabled functionality until they
    enable it by clicking Options on the Message Bar and selecting the appropriate action. The default configuration can be
    changed so that users see a dialog box when they open an untrusted database with executable components. Users must then
    choose whether to enable or disable the components before working with the database. In these circumstances users frequently
    enable the components, even if they do not require them. Executable components can be used to launch an attack against
    a computer environment.
  impact: Disabling this setting enforces the default configuration for Access 2013, and so is unlikely to cause usability
    issues. However, this functionality has changed from previous versions of Access. In Access 2003, the default configuration
    presented the user with a dialog box (equivalent to how Access 2013 functions when the setting is Enabled).
  references:
  - 1. CCE-30314-9
  - 1.1 Application Settings
  page_start: 30
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\access\security\moda

    ltrustdecisiononly'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Disabled.

    User Configuration\Administrative Templates\Microsoft Access 2013\Tools |

    Security\Modal Trust Decision Only'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\access\security\moda

      ltrustdecisiononly'
    severity: medium
