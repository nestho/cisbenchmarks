controls:
- id: 1.1.1
  title: Set 'Require that application add-ins are signed by Trusted Publisher' to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether add-ins for this applications must be digitally signed by a trusted publisher.
    If you enable this policy setting, this application checks the digital signature for each add-in before loading it. If
    an add-in does not have a digital signature, or if the signature did not come from a trusted publisher, this application
    disables the add-in and notifies the user. Microsoft provides four certificates for Office, which you can add to the Trusted
    Publishers list. These certificates must be added to the Trusted Publishers list if you require that all add-ins be signed
    by a trusted publisher. The Microsoft certificates are named Mscert01.cer, Mscert02.cer, Mscert03.cer, Mscert04.cer, and
    can be found on the Microsoft Web site. Office 2013 stores certificates for trusted publishers in the Internet Explorer
    trusted publisher store. Earlier versions of Microsoft Office stored trusted publisher certificate information (specifically,
    the certificate thumbprint) in a special Office trusted publisher store. Office 2013 still reads trusted publisher certificate
    information from the Office trusted publisher store, but it does not write information to this store. Therefore, if you
    created a list of trusted publishers in a previous version of Office and you upgrade to Office 2013, your trusted publisher
    list will still be recognized. However, any trusted publisher certificates that you add to the list will be stored in
    the Internet Explorer trusted publisher store. For more information about trusted publishers, see the Office Resource
    Kit. If you disable or do not configure this policy setting, this application does not check the digital signature on
    application add-ins before opening them. If a dangerous add-in is loaded, it could harm users'' computers or compromise
    data security. The recommended state for this setting is: Enabled.'
  rationale: By default, Office 2013 applications do not check the digital signature on application add-ins before opening
    them. Disabling or not configuring this setting may allow an application to load a dangerous add-in. As a result, malicious
    code could become active on user computers or the network.
  impact: Enabling this setting could cause disruptions for users who rely on add-ins that are not signed by trusted publishers.
    These users will either have to obtain signed versions of such add-ins or stop using them. Office 2013 stores certificates
    for trusted publishers in the Internet Explorer trusted publisher store. Earlier versions of Office stored trusted publisher
    certificate information (specifically, the certificate thumbprint) in a special Office trusted publisher store. Office
    2013 still reads trusted publisher certificate information from the Office trusted publisher store, but does not write
    information to this store. Therefore, if you created a list of trusted publishers in a previous version of Office and
    you upgrade to the Office 2013 release, your trusted publisher list will still be recognized. However, any trusted publisher
    certificates that you add to the list will be stored in the Internet Explorer trusted publisher store.
  references:
  - 1. CCE-29144-3
  page_start: 13
  audit_raw: 'Audit Procedure

    Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\access\security\requ

    ireaddinsig'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Enabled.

    User Configuration\Microsoft Access 2013\Application Settings\Security\Trust

    Center\Require that application add-ins are signed by trusted publisher'
  checks:
  - type: manual_review
    info: 'Audit Procedure

      Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\access\security\requ

      ireaddinsig'
    severity: medium
- id: 1.1.2
  title: Set 'VBA Macro Notification Settings' to Enabled (Disable all Except Digitally Signed Macros)
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls how the specified applications warn users when Visual Basic for Applications
    (VBA) macros are present. If you enable this policy setting, you can choose from four options for determining how the
    specified applications will warn the user about macros: - Disable all with notification: The application displays the
    Trust Bar for all macros, whether signed or unsigned. This option enforces the default configuration in Office. - Disable
    all except digitally signed macros: The application displays the Trust Bar for digitally signed macros, allowing users
    to enable them or leave them disabled. Any unsigned macros are disabled, and users are not notified. - Disable all without
    notification: The application disables all macros, whether signed or unsigned, and does not notify users. - Enable all
    macros (not recommended): All macros are enabled, whether signed or unsigned. This option can significantly reduce security
    by allowing dangerous code to run undetected. If you disable this policy setting, "Disable all with notification" will
    be the default setting. If you do not configure this policy setting, when users open files in the specified applications
    that contain VBA macros, the applications open the files with the macros disabled and display the Trust Bar with a warning
    that macros are present and have been disabled. Users can inspect and edit the files if appropriate, but cannot use any
    disabled functionality until they enable it by clicking "Enable Content" on the Trust Bar. If the user clicks "Enable
    Content", then the document is added as a trusted document. Important: If "Disable all except digitally signed macros"
    is selected, users will not be able to open unsigned Access databases. Also, note that Microsoft Office stores certificates
    for trusted publishers in the Internet Explorer trusted publisher store. Earlier versions of Microsoft Office stored trusted
    publisher certificate information (specifically, the certificate thumbprint) in a special Office trusted publisher store.
    Microsoft Office still reads trusted publisher certificate information from the Office trusted publisher store, but it
    does not write information to this store. Therefore, if you created a list of trusted publishers in a previous version
    of Microsoft Office and you upgrade to Office, your trusted publisher list will still be recognized. However, any trusted
    publisher certificates that you add to the list will be stored in the Internet Explorer trusted publisher store. The recommended
    state for this setting is: Enabled. (``Disable all Except Digitally Signed Macros)'
  rationale: By default, when users open files in Access 2013 that contain VBA macros, Access 2013 opens the files with the
    macros disabled, and displays the Trust Bar with a warning that macros are present and have been disabled. Users may then
    enable these macros by clicking Options on the Trust Bar and selecting the option to enable them. Disabling or not configuring
    this setting may allow dangerous macros to become active on user computers or the network.
  impact: This configuration causes documents and templates that contain unsigned macros to lose any functionality supplied
    by those macros. To prevent this loss of functionality, users can install the macros in a trusted location, unless the
    Disable all trusted locations setting is configured to Enabled, which will block them from doing so. If your organization
    does not use any officially sanctioned macros, consider choosing No Warnings for all macros but disable all macros for
    even stronger security.
  references:
  - 1. CCE-29149-2
  page_start: 15
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\access\security\vbaw

    arnings'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Enabled.

    User Configuration\Administrative Templates\Microsoft Access 2013\Application

    Settings\Security\Trust Center\VBA Macro Notification Settings'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\access\security\vbaw

      arnings'
    severity: medium
- id: 1.1.3
  title: Set 'Disable Trust Bar Notification for unsigned application add-ins ' to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether the specified Office application notifies users when unsigned application
    add-ins are loaded or silently disable such add-ins without notification. This policy setting only applies if you enable
    the "Require that application add-ins are signed by Trusted Publisher" policy setting, which prevents users from changing
    this policy setting. If you enable this policy setting, applications automatically disable unsigned add-ins without informing
    users. If you disable this policy setting, if this application is configured to require that all add-ins be signed by
    a trusted publisher, any unsigned add-ins the application loads will be disabled and the application will display the
    Trust Bar at the top of the active window. The Trust Bar contains a message that informs users about the unsigned add-in.
    If you do not configure this policy setting, the disable behavior applies, and in addition, users can configure this requirement
    themselves in the "Add-ins" category of the Trust Center for the application. The recommended state for this setting is:
    Enabled.'
  rationale: By default, if an application is configured to require that all add-ins be signed by a trusted publisher, any
    unsigned add-ins the application loads will be disabled and the application will display the Trust Bar at the top of the
    active window. The Trust Bar contains a message that informs users about the unsigned add-in.
  impact: This setting only applies if the Office 2013 application is configured to require that all add-ins are signed by
    a trusted publisher. By default, users can configure this requirement themselves in the Add-ins category of the Trust
    Center for the application. To enforce this requirement, you must enable the Require that application add-ins are signed
    by Trusted Publisher setting in Group Policy, which prevents users from changing the setting themselves.
  references:
  - 1. CCE-29143-5
  page_start: 17
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\access\security\notb

    promptunsignedaddin'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Enabled.

    User Configuration\Administrative Templates\Microsoft Access 2013\Application

    Settings\Security\Trust Center\Disable Trust Bar Notification for unsigned

    application add-ins and block them'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\access\security\notb

      promptunsignedaddin'
    severity: medium
- id: 1.1.4
  title: Set 'Allow Trusted Locations on the network' to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether trusted locations on the network can be used. If you enable this policy
    setting, users can specify trusted locations on network shares or in other remote locations that are not under their direct
    control by selecting the "Allow Trusted Locations on my network (not recommended)" check box in the Trusted Locations
    section of the Trust Center. Content, code, and add-ins are allowed to load from trusted locations with minimal security
    and without prompting the user for permission. If you disable or do not configure this policy setting, the selected application
    ignores any network locations listed in the Trusted Locations section of the Trust Center. Disabling this policy setting
    does not delete any network locations from the Trusted Locations list. Instead, it forces the selected application to
    treat the locations as non-trusted and prevents users from adding new network locations to the list. If you also deploy
    Trusted Locations via Group Policy, you should verify whether any of them are remote locations. If any of them are remote
    locations and you do not allow remote locations via this policy setting, those policy keys that point to remote locations
    will be ignored on client computers. Disabling this policy setting will cause disruption for users who add network locations
    to the Trusted Locations list. However, it is not recommended to enable this policy setting (as the "Allow Trusted Locations
    on my network (not recommended)" check box itself states), so in practice it should be possible to disable this policy
    setting in most situations without causing significant usability issues for most users. The recommended state for this
    setting is: Disabled.'
  rationale: By default, files located in trusted locations and specified in the Trust Center are assumed to be safe. Content,
    code, and add-ins are allowed to load from trusted locations with minimal security and without prompting the user for
    permission. By default, users can specify trusted locations on network shares or in other remote locations that are not
    under their direct control by selecting the Allow Trusted Locations on my network (not recommended) check box in the Trusted
    Locations section of the Trust Center. If a dangerous file is opened from a trusted location, it will not be subject to
    typical security measures and could affect users' computers or data.
  impact: Disabling this setting will cause disruption for users who add network locations to the Trusted Locations list.
    However, this practice is discouraged (as the Allow Trusted Locations on my network (not recommended) check box itself
    states), so in practice it should be possible to disable this setting in most situations without causing significant usability
    issues for most users.
  references:
  - 1. CCE-29120-3
  page_start: 19
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\access\security\trus

    ted locations\allownetworklocations'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Disabled.

    User Configuration\Administrative Templates\Microsoft Access 2013\Application

    Settings\Security\Trust Center\Trusted Locations\Allow Trusted Locations on

    the network'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\access\security\trus

      ted locations\allownetworklocations'
    severity: medium
- id: 1.1.5
  title: Set 'Disable all trusted locations' to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting allows administrators to disable all trusted locations in the specified applications.
    Trusted locations specified in the Trust Center are used to define file locations that are assumed to be safe. Content,
    code, and add-ins are allowed to load from trusted locations with a minimal amount of security, without prompting the
    users for permission. If a dangerous file is opened from a trusted location, it will not be subject to standard security
    measures and could harm users'' computers or data. If you enable this policy setting, all trusted locations (those specified
    in the Trust Center) in the specified applications are ignored, including any trusted locations established by Office
    2013 during setup, deployed to users using Group Policy, or added by users themselves. Users will be prompted again when
    opening files from trusted locations. If you disable or do not configure this policy setting, all trusted locations (those
    specified in the Trust Center) in the specified applications are assumed to be safe. The recommended state for this setting
    is: Enabled.'
  rationale: Trusted locations specified in the Trust Center are used to define file locations that are assumed to be safe.
    Content, code, and add-ins are allowed to load from trusted locations with a minimal amount of security, without prompting
    the users for permission. If a dangerous file is opened from a trusted location, it will not be subject to standard security
    measures and could harm users' computers or data. By default, files located in trusted locations (those specified in the
    Trust Center) are assumed to be safe.
  impact: If there are business-critical reasons to access some files in a more trusted environment, disabling trusted locations
    could cause usability problems.
  references:
  - 1. CCE-29121-1
  page_start: 21
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\access\security\trus

    ted locations\alllocationsdisabled'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Enabled.

    User Configuration\Administrative Templates\Microsoft Access 2013\Application

    Settings\Security\Trust Center\Trusted Locations\Disable all trusted

    locations'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\access\security\trus

      ted locations\alllocationsdisabled'
    severity: medium
- id: 1.1.6
  title: Set 'Underline hyperlinks' to Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether hyperlinks in Access tables, queries, forms, and reports are underlined.
    If you enable this policy setting, Access underlines all hyperlinks in tables, queries, forms, and reports when they are
    created, overriding any configuration changes on the users'' computers. If you disable this policy setting, Access does
    not underline hyperlinks in tables, queries, forms and reports. If you do not configure this policy setting, Access underlines
    hyperlinks that appear in tables, queries, forms, and reports. Enabling this policy setting enforces the default configuration
    in Access, and is therefore unlikely to cause a significant usability issue for most users. If this configuration is changed,
    users might click on dangerous hyperlinks without realizing it, which could pose a security risk. The recommended state
    for this setting is: Enabled.'
  rationale: By default, Access 2013 underlines hyperlinks that appear in tables, queries, forms, and reports. If this configuration
    is changed, users might click on dangerous hyperlinks without realizing it, which could pose a security risk.
  impact: 'If this setting is Enabled, Access 2013 underlines all hyperlinks in tables, queries, forms, and reports when they
    are created, overriding any configuration changes on the users'' computers. Important Enabling or disabling this setting
    does not correctly disable the Underline Hyperlinks check box in the Web Options dialog box in Access 2013, which can
    mislead users into thinking that the option remains user configurable. For more information, see this Knowledge Base article:
    http://go.microsoft.com/fwlink/?LinkId=103507.'
  references:
  - 1. CCE-30297-6
  - 1.2 Miscellaneous
  page_start: 23
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\access\internet\dono

    tunderlinehyperlinks'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Enabled.

    User Configuration\Administrative Templates\Microsoft Access 2013\Application

    Settings\Web Options...\General\Underline hyperlinks'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_USERS\<SID>\software\policies\microsoft\office\15.0\access\internet\dono

      tunderlinehyperlinks'
    severity: medium
- id: 1.2.1
  title: Set 'Do not prompt to convert older databases' to Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether Access prompts users to convert older databases when they are opened.
    If you enable this policy setting, Access will leave Access 97-format databases unchanged. Access informs the user that
    the database is in the older format, but does not provide the user with an option to convert the database. Some features
    introduced in more recent versions of Access will not be available, and the user will not be able to make any design changes
    to the database. If you disable or do not configure this policy setting, when users open databases that were created in
    the Access 97 file format, Access prompts them to convert the database to a newer file format. Users can choose to convert
    the database or leave it in the older format. The recommended state for this setting is: Disabled. This policy setting
    controls whether new database files are created in the new Access format or in a format used by earlier versions of Access.
    If you enable this policy setting, you can specify whether new database files are created in Access 2013 format by default
    or in Access 2002--2003 format. Users can still override the default and select a specific format when they save the files,
    but cannot set the default by themselves from the Access Options dialog. If you disable or do not configure this policy
    setting, when users create new database files, Access saves them in the new Access 2013 format; however, users can change
    this functionality by selecting a file format from the Default file format drop down list under Access Options | Popular
    | Creating databases. Note: If you disable this policy setting, users can choose from three default file formats: Access
    2000, Access 2002-- 2003, and Access 2013. You can use this policy setting to specify either the Access 2002--2003 or
    Access 2013 format as the default, but not the Access 2000 format. The recommended state for this setting is: Enabled.
    (Access 2007)'
  rationale: By default, when users open databases that were created in the Access 97 file format, Access 2013 prompts them
    to convert the database to a newer file format. Users can choose to convert the database or leave it in the older format.
    If this configuration is changed, Access will leave Access 97-format databases unchanged. Access informs the user that
    the database is in the older format, but does not provide the user with an option to convert the database. Some features
    introduced in more recent versions of Access will not be available, and the user will not be able to make any design changes
    to the database. By default, when users create new database files, Access 2013 saves them in the new Access 2013 format.
    Users can change this functionality by clicking the Office button, clicking Access Options, and then selecting a file
    format from the Default file format list. Disabling this setting allows users to choose from any of the available default
    file formats. If a new workbook is created in an earlier format, some users may not be unable to open or use the file,
    or they may choose a format that is less secure than the Access 2013 format.
  impact: Disabling this setting enforces the default configuration in Access 2013, and is therefore unlikely to cause usability
    issues for most users. Enabling this setting does not prevent users from choosing a different file format for a new Access
    file, and therefore, it is unlikely to affect usability for most users.
  references:
  - 1. CCE-30309-9
