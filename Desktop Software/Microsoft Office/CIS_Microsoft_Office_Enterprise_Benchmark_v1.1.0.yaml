- id: 1.1.4.1.13
  title: (L1) Ensure 'Saved from URL' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This setting controls whether Internet Explorer evaluates URLs passed to it by Office applications for Mark
    of the Web (MOTW) comments. The recommended state for this setting is: Enabled: groove.exe, excel.exe, mspub.exe, powerpnt.exe,
    pptview.exe, visio.exe, winproj.exe, winword.exe, outlook.exe, spDesign.exe, exprwd.exe, msaccess.exe, onent.exe, mse7.exe
    .'
  rationale: Typically, when Internet Explorer loads a Web page from a UNC share that contains a Mark of the Web (MOTW) comment
    indicating the page was saved from a site on the Internet, Internet Explorer runs the page in the Internet security zone
    instead of the less restrictive Local Intranet security zone. This functionality can be controlled separately for instances
    of Internet Explorer spawned by Office applications (for example, if a user clicks a link in an Office document or selects
    a menu option that loads a Web page). If Internet Explorer does not evaluate the page for a MOTW, potentially dangerous
    code could be allowed to run.
  impact: Enabling this setting can cause some Web pages saved on UNC shares to run in a more restrictive security zone when
    opened from Office applications than they would if the setting were disabled or not configured. However, a page with a
    MOTW indicating it was saved from an Internet site is presumed to have been designed to run in the Internet zone in the
    first place, so most users should not experience significant usability issues.
  references: []
