    execute on the system or the network. Opening files that do not require Protected View could lead to malicious code executing
    on a user''s computer or the network. Content, code, and add-ins are allowed to load from trusted locations with a minimal
    amount of security, without prompting the users for permission. If a dangerous file is opened from a trusted location,
    it will not be subject to standard security measures and could harm the user''s computers or data. Trusted locations specified
    in the Trust Center are used to define file locations that are assumed to be safe. Content, code, and add-ins are allowed
    to load from trusted locations with a minimal amount of security, without prompting the users for permission. If a dangerous
    file is opened from a trusted location, it will not be subject to standard security measures and could harm the user''s
    computers or data. Untrusted XLL files, as dynamic-link libraries (DLLs), pose a security risk in phishing campaigns,
    where attackers can trick users into executing seemingly harmless files containing malicious payloads. Being executables,
    XLL files can unwittingly run on users'' systems, leading to unauthorized code execution, malware installation, and potential
    data breaches. Windows will mark files downloaded from the internet within an alternative NTFS data stream on the file.
    Files from untrusted sources can contain malicious payloads embedded in the Macros, including fileless malware, and should
    be handled with extra care by utilizing additional security controls. Allowing unsigned application add-ins could cause
    the application to load dangerous add-ins and as a result, malicious code could become active on user computers and the
    network. When users open files in Excel that contain VBA macros, Excel opens the files with the macros disabled, and displays
    the Trust Bar with a warning that macros are present and have been disabled. Users may then enable these macros by clicking
    Options on the Trust Bar and selecting the option to enable them. This can allow dangerous macros to become active on
    users computer or the network. When users open files in Excel that contain VBA macros, Excel opens the files with the
    macros disabled, and displays the Trust Bar with a warning that macros are present and have been disabled. Users may then
    enable these macros by clicking Options on the Trust Bar and selecting the option to enable them. This can allow dangerous
    macros to become active on users computer or the network. XLM is data macro format from the early nineties that was not
    built with security in mind. Macros can be easily exploited and are a favorite hiding place of malicious code. While newer
    builds of Excel disable XLM macros by default, it is an important setting to audit for a secure state in all versions
    of Excel. By default, Office applications do not check the digital signature on application add-ins before opening them.
    Not configuring this setting may allow an application to load a dangerous add-in and as a result, malicious code could
    become active on a user''s computer or the network. Excel displays the Record Macro dialog box with This Workbook already
    selected in the drop-down menu. If a user saves a macro in the active workbook and then distributes the workbook to others,
    the macro is distributed along with the workbook, which could put workbook data at risk if the macro is triggered accidentally
    or intentionally. VSTO projects require access to the Visual Basic for Applications project system in Excel, PowerPoint,
    and Word, even though the projects do not use Visual Basic for Applications. Design-time support of controls in both Visual
    Basic and C# projects depends on the Visual Basic for Applications project system in Word and Excel.'
  impact: 'Configuring this setting to "Always show the alert before publishing" reinforces the default functionality in Excel,
    and is therefore unlikely to cause usability issues for most users Microsoft Query files in an untrusted location are
    prevented from opening. Users will not be able to change this setting under File > Options > Trust Center > Trust Center
    Settings > External Content. None - DDE Launch is disabled by default. Enforcing this policy ensures users cannot enter
    an unsecure state. When enabled DDE server lookup isn’t allowed, and users can’t turn on DDE server lookup in the Trust
    Center. A Systems Administrator would need to implement DDE under a zero trust framework. Users will not be able to open,
    save, or view dBase III /IV files. Users will not be able to open, save, or view Dif and Sylk files. Users will not be
    able to open, save, or view Excel 2 macrosheets. Users will not be able to open, save, or view Excel 2 worksheets. Users
    will not be able to open, save, or view Excel 3 macrosheets. Users will not be able to open, save, or view Excel 3 worksheets.
    Users will not be able to open, save, or view Excel 4 macrosheets and add-in. Users will not be able to open, save, or
    view Excel 4 workbooks. Users will not be able to open, save, or view Excel 4 worksheets. Users will not be able to open,
    save, or view Excel 95 workbooks. Users will not be able to open, save, or view Excel 95-97 workbooks and templates. Users
    will not be able to open, save, or view Excel 97-2003 workbooks and templates. Enabling this setting prevents users from
    opening, viewing, or editing certain types of files in Word. Productivity could be affected if users who require access
    to any of these file types cannot access them. Users will not be able to open, save, or view Web pages and Excel 2003
    XML spreadsheets. In addition, the following file types will open in Protected View: .mht .mhtml .htm .html .xml .xlmss
    While in OneNote using the function "Convert a Table to Excel" may cause OneNote to freeze until a dialogue box is confirmed.
    Database files opened from an untrusted location are always opened in Protected View. Users will not be able to change
    this setting under Trust Center Settings > Protected View. When files open in Protected View, some functionality will
    be unavailable; users will be unable to edit the file. Some functionality is not available when files are opened in Protected
    View. In such cases, users must move the files from unsafe locations to safe locations in order to access them with full
    functionality. Files that are blocked by the validation fail rule will not open on a user''s computer. Files that are
    blocked by the validation fail rule will not open on a user''s computer. Some functionality is not available when files
    are opened in Protected View; users will be unable to edit the file. Disabling this setting will cause disruption for
    users who add network locations to the Trusted Locations list. These custom locations added by users are ignored but not
    removed. Trusted locations added in Group Policy that specify a network location are also ignored. All trusted locations
    (those specified in the Trust Center) in the specified applications are ignored, including any trusted locations established
    by Office 2016 during setup, deployed to users using Group Policy, or added by users themselves. Users will be prompted
    again when opening files from trusted locations. None - this is the default behavior. This enforces the default behavior
    and should not cause additional impact. If an application is configured to require that all add-ins be signed by a trusted
    publisher, any unsigned add-ins the application loads will be disabled and the application will display the Trust Bar
    at the top of the active window. The Trust Bar contains a message that informs users about the unsigned add-in. This configuration
    causes documents and templates that contain unsigned macros to lose any functionality supplied by those macros. To prevent
    this loss of functionality, users can install the macros in a trusted location, unless the Disable all trusted locations
    setting is configured to Enabled, which will block them from doing so. If your organization does not use any officially
    sanctioned macros, consider choosing No Warnings for all macros but disable all macros for even stronger security. This
    configuration causes documents and templates that contain unsigned macros to lose any functionality supplied by those
    macros. To prevent this loss of functionality, users can install the macros in a trusted location, unless the Disable
    all trusted locations setting is configured to Enabled, which will block them from doing so. If your organization does
    not use any officially sanctioned macros, consider choosing No Warnings for all macros but disable all macros for even
    stronger security. This enforces the default behavior. Existing XLM macros will not function, and should be migrated.
    This setting could cause disruptions for users who rely on add-ins that are not signed by trusted publishers. These users
    will either have to obtain signed versions of such addins or stop using them. Office stores certificates for trusted publishers
    in the trusted publisher store. Earlier versions of Office stored trusted publisher certificate information (specifically,
    the certificate thumbprint) in a special Office trusted publisher store. Office still reads trusted publisher certificate
    information from the Office trusted publisher store but does not write information to this store. If a list of trusted
    publishers in a previous version of Office was created and upgrade the Office release, the trusted publisher list will
    still be recognized. Enabling this setting does not prevent users from selecting a different location for storing macros,
    so it is unlikely to cause significant usability issues for most users. None - this is the default behavior. By default,
    Excel, Word, and PowerPoint do not allow automation clients to have programmatic access to VBA projects. Users can enable
    this by selecting the Trust access to the VBA project object model in the Macro Settings section of the Trust Center.
    However, doing so allows macros in any documents the user opens to access the core Visual Basic objects, methods, and
    properties, which represents a potential security hazard.'
