- id: 2.8.4.1.3
  title: (L1) Ensure 'Require that application add-ins are signed by Trusted Publisher' to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether add-ins for the specified Office applications must be digitally signed
    by a trusted publisher. The recommended state for this setting is: Enabled.'
  rationale: By default, Office applications do not check the digital signature on application add-ins before opening them.
    Not configuring this setting may allow an application to load a dangerous add-in and as a result, malicious code could
    become active on a user's computer or the network.
  impact: This setting could cause disruptions for users who rely on add-ins that are not signed by trusted publishers. These
    users will either have to obtain signed versions of such addins or stop using them. Office stores certificates for trusted
    publishers in the trusted publisher store. Earlier versions of Office stored trusted publisher certificate information
    (specifically, the certificate thumbprint) in a special Office trusted publisher store. Office still reads trusted publisher
    certificate information from the Office trusted publisher store but does not write information to this store. If a list
    of trusted publishers in a previous version of Office was created and the Office release is upgraded, the trusted publisher
    list will still be recognized. However, any trusted publisher certificates that were added to the list will be stored
    in the Internet Explorer trusted publisher store.
  references: []
