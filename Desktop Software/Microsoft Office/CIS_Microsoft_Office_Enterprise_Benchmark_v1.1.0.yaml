  description: 'This policy setting controls whether Outlook automatically makes an offline copy of the RSS items as HTML
    attachments. The recommended state for this setting is: Disabled.'
  rationale: Many RSS feeds use messages that contain a brief summary of a larger message or an article with a link to the
    full content. Users can configure Outlook to automatically download the linked content as message attachments for individual
    RSS feeds. If a feed is frequently updated or typically contains very large messages and is not AutoArchived regularly,
    downloading full articles can cause the affected message store to become very large, which can affect the performance
    of Outlook. By default, Outlook does not automatically download the full text of RSS entries when retrieving feeds.
  impact: This setting enforces the default configuration and therefore should have minimal impact on most users. Disabling
