- id: 1.3.2
  title: (L1) Ensure 'Restrict legacy JScript execution for Office' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'This policy setting controls JScript execution per Security Zone within Internet Explorer and WebBrowser Control
    (WebOC) for Office applications. JScript is Microsoft''s legacy dialect of the ECMAScript standard that is used in Microsoft''s
    Internet Explorer 11 and older. If Enabled, Office applications will not execute legacy JScript for the Internet or Restricted
    Sites zones and users aren’t notified by the application that legacy JScript execution is restricted. Modern JScript9
    will continue to function for all zones. The recommended state for this setting is: Enabled: Access: 69632 Excel: 69632
    OneNote: 69632 Outlook: 69632 PowerPoint: 69632 Project: 69632 Publisher: 69632 Visio: 69632 Word: 69632 This policy setting
    controls whether trusted locations on the network can be used. Trusted locations specified in the Trust Center are used
    to define file locations that are assumed to be safe by the application opening the file. The recommended state for this
    setting is: Disabled. This policy setting allows administrators to disable all trusted locations in the specified applications.
    The recommended state for this setting is: Enabled. This policy setting allows the blocking of macros from running in
    Office files that come from the internet. By enabling this policy setting, macros are blocked from running, even if "Enable
    all macros" is selected in the Macro Settings section of the Trust Center. Users will receive a notification that macros
    are blocked from running. The exceptions when macros will be allowed to run are: • The Office file is saved to a Trusted
    Location. • The Office file was previously trusted by the user. • Macros are digitally signed and the matching Trusted
    Publisher certificate is installed on the device. The recommended state for this setting is: Enabled. This policy setting
    controls whether the specified Office application notifies users when unsigned application add-ins are loaded or silently
    disable such add-ins without notification. Note: For this policy to apply the Require that application add-ins are signed
    by Trusted Publisher policy setting needs to be enabled. This will prevent users from changing the Disable Trust Bar Notification
    for Unsigned Application Add-ins and Block Them policy setting. The recommended state for this setting is: Enabled. This
    policy setting controls whether add-ins for the specified Office applications must be digitally signed by a trusted publisher.
    The recommended state for this setting is: Enabled. This policy setting controls whether hyperlinks in Access tables,
    queries, forms, and reports are underlined. The recommended state for this setting is: Enabled.'
  rationale: 'Development on the JScript engine ended and the component was deprecated with the release of Internet Explorer
    8.0 in 2009, but the engine remained in all Windows OS versions as a legacy component inside IE. Due to this, it has been
    exploited by a number of bad actors over the years, including nation-states. The following CVE''s are associated with
    JSCRIPT vulnerabilities: CVE-2018-8653, CVE-2019-1367, CVE-2019-1429, and CVE-2020-0674 Content, code, and add-ins are
    allowed to load from trusted locations with a minimal amount of security, without prompting the users for permission.
    If a dangerous file is opened from a trusted location, it will not be subject to standard security measures and could
    harm the user''s computers or data. Trusted locations specified in the Trust Center are used to define file locations
    that are assumed to be safe. Content, code, and add-ins are allowed to load from trusted locations with a minimal amount
    of security, without prompting the users for permission. If a dangerous file is opened from a trusted location, it will
    not be subject to standard security measures and could harm the user''s computers or data. Windows will mark files downloaded
    from the internet within an alternative NTFS data stream on the file. Files from untrusted sources can contain malicious
    payloads embedded in the Macros, including fileless malware, and should be handled with extra care by utilizing additional
    security controls. Allowing unsigned application add-ins could cause the application to load dangerous add-ins and as
    a result, malicious code could become active on user computer and the network. By default, Office applications do not
    check the digital signature on application add-ins before opening them. Not configuring this setting may allow an application
    to load a dangerous add-in and as a result, malicious code could become active on a user''s computer or the network. Access
    underlines hyperlinks that appear in tables, queries, forms, and reports. If this configuration is changed, users might
    click on dangerous hyperlinks without realizing it, which could pose a security risk.'
  impact: It's important to determine whether legacy JScript is being used to provide businesscritical functionality before
    enabling this setting. Disabling this setting will cause disruption for users who add network locations to the Trusted
    Locations list. These custom locations added by users are ignored but not removed. Trusted locations added in Group Policy
    that specify a network location are also ignored. All trusted locations (those specified in the Trust Center) in the specified
    applications are ignored, including any trusted locations established by Office 2016 during setup, deployed to users using
    Group Policy, or added by users themselves. Users will be prompted again when opening files from trusted locations. This
    enforces the default behavior and should not cause additional impact. If an application is configured to require that
    all add-ins be signed by a trusted publisher, any unsigned add-ins the application loads will be disabled and the application
    will display the Trust Bar at the top of the active window. The Trust Bar contains a message that informs users about
    the unsigned add-in. This setting could cause disruptions for users who rely on add-ins that are not signed by trusted
    publishers. These users will either have to obtain signed versions of such addins or stop using them. Office stores certificates
    for trusted publishers in the trusted publisher store. Earlier versions of Office stored trusted publisher certificate
    information (specifically, the certificate thumbprint) in a special Office trusted publisher store. Office still reads
    trusted publisher certificate information from the Office trusted publisher store but does not write information to this
    store. If a list of trusted publishers in a previous version of Office was created and upgrade the Office release, the
    trusted publisher list will still be recognized. None - this is the default behavior.
  references:
  - 1. https://techcommunity.microsoft.com/t5/windows-it-pro-blog/disabling-legacyscripting-engine-jscript-in-internet-explorer/ba-p/1777563
  - 1. https://learn.microsoft.com/en-us/DeployOffice/security/internet-macros-blocked
  - 1. https://learn.microsoft.com/en-us/deployoffice/security/trusted-publisher
  - 2. https://learn.microsoft.com/en-us/windows-hardware/drivers/install/trustedpublishers-certificate-store
