- id: 1.1.4.1.9
  title: (L1) Ensure 'Object Caching Protection' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting defines whether a reference to an object is accessible when the user navigates within
    the same domain or to a new domain. For Office, this applies to URLs accessed within Office applications. By default in
    Internet Explorer, a reference to an object is no longer accessible when the user browses to a new domain. There is a
    new security context for all scriptable objects so that access to all cached objects is blocked. Additionally, access
    is blocked when browsing within the same domain (fully qualified domain name). A reference to an object is no longer accessible
    after the context has changed due to navigation. The recommended state for this setting is: Enabled: groove.exe, excel.exe,
    mspub.exe, powerpnt.exe, pptview.exe, visio.exe, winproj.exe, winword.exe, outlook.exe, spDesign.exe, exprwd.exe, msaccess.exe,
    onent.exe, mse7.exe .'
  rationale: A malicious website may try to use object references from other domains.
  impact: If you enable this policy setting, object reference is no longer accessible when navigating within or across domains
    for each specified application. If you disable or do not configure this policy setting, object reference is retained when
    navigating within or across domains in the Restricted Zone sites.
  references: []
  page_start: 42
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location. Each

    Office application executable will have a unique value name with a value of 1.

