  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting specifies the Microsoft ActiveX® initialization security level for all Microsoft Office
    applications. The recommended state for this setting is: Enabled: 6'
  rationale: Attackers can use ActiveX controls that include malicious code to attack a computer. In addition, malicious code
    can be used to compromise an ActiveX control and attack a computer. To indicate the safety of an ActiveX control, developers
    can denote them as Safe For Initialization (SFI). SFI indicates that a control is safe to open and run, and that it is
    not capable of causing a problem for any computer, regardless of whether it has persisted data values or not.
  impact: 'This setting only increases security for ActiveX controls that are accurately marked as SFI. In situations that
    involve malicious or poorly designed code, an ActiveX control might be inaccurately marked as SFI. Important: Some ActiveX
    controls do not respect the safe mode registry setting, and therefore might load persisted data even though this setting
    is configured to instruct the control to use safe mode.'
  references: []
