  description: 'This policy setting controls Internet Calendar integration in Outlook. The Internet Calendar feature in Outlook
    enables users to publish calendars online (using the webcal:// protocol) and subscribe to calendars that others have published.
    When users subscribe to an Internet calendar, Outlook queries the calendar at regular intervals and downloads any changes
    as they are posted. The recommended state for this setting is: Enabled.'
  rationale: The Internet Calendar feature in Outlook enables users to publish calendars online (using the webcal:// protocol)
    and subscribe to calendars that others have published. When users subscribe to an Internet calendar, Outlook queries the
    calendar at regular intervals and downloads any changes as they are posted. By default, Outlook allows users to subscribe
    to Internet calendars. If the organization has policies that govern the use of external resources such as Internet calendars,
    this feature might enable users to violate those policies.
  impact: Enabling this setting can cause disruptions for users who subscribe to Internet calendars from within Outlook. These
    users will have to use another method to access Internet calendar data.
