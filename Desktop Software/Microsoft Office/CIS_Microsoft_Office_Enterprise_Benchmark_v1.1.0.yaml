  description: 'This policy setting controls whether text that is formatted as hidden displays in Microsoft Word. The recommended
    state for this setting is: Enabled.'
  rationale: By default, Word does not display text formatted as hidden unless Show/Hide ¶ is selected or Word is configured
    to show hidden text in the Display section of the Word Options dialog box. If a document that contains hidden text is
    distributed, sensitive information in the document could be at risk.
  impact: Displaying hidden text can change the way a document flows as well as make it difficult to judge the number of pages
    in a document where Word will insert automatic page breaks.
