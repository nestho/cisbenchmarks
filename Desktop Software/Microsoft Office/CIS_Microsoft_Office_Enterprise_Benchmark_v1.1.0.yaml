  description: 'This policy setting controls whether Office applications load any custom user interface (UI) code included
    with a document or template. Office allows developers to extend the UI with customization code that is included in a document
    or template. The recommended state for this setting is: Enabled: Disallow in Word, Excel, PowerPoint, Access, Outlook,
    Publisher, Project, Visio, InfoPath.'
  rationale: The Office release allows developers to extend the UI with customization code that is included in a document
    or template. If the customization code is written by an inexperienced or malicious developer, it could limit the accessibility
    or availability of important application commands. Commands could also be added that launch macros that contain malicious
    code. By default, Office applications load any UI customization code included with a document or template when opening
    it.
  impact: Enabling this setting will prevent developers from using documents and templates to extend the UI, which some organizations
    do to increase user productivity. If the organization makes use of a modified UI, it might not be feasible to enable this
    setting. Sometimes only specific teams in an organization require a modified UI, and this setting could be enabled for
    the rest of the organization.
