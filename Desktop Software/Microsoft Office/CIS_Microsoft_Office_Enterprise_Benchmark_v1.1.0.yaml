- id: 2.11.8.7.3
  title: (L1) Ensure 'Make hidden markup visible' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether hidden markup is visible when users open Word documents in standard or
    HTML format. The recommended state for this setting is: Enabled.'
  rationale: If a file is saved with hidden markup, users might inadvertently distribute sensitive comments or information
    outside of their trusted circle without realizing that this information is still present in the document.
  impact: In most cases, markup is intended to be visible to users. Markup does not display in presentation mode in Word,
    even if it is visible in design mode, so it is likely that this setting will have a minimal impact on usability.
  references: []
  page_start: 574
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

