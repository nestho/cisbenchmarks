- id: 2.8.4.1.1
  title: (L1) Ensure 'Block macros from running in Office files from the internet' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting allows the blocking of macros from running in Office files that come from the internet.
    By enabling this policy setting, macros are blocked from running, even if "Enable all macros" is selected in the Macro
    Settings section of the Trust Center. Users will receive a notification that macros are blocked from running. The exceptions
    when macros will be allowed to run are: • The Office file is saved to a Trusted Location. • The Office file was previously
    trusted by the user. • Macros are digitally signed and the matching Trusted Publisher certificate is installed on the
    device. The recommended state for this setting is: Enabled. This policy setting controls whether the specified Office
    application notifies users when unsigned application add-ins are loaded or silently disables such add-ins without notification.
    Note: For this policy to apply, the Require that application add-ins are signed by Trusted Publisher policy setting needs
    to be enabled. This will prevent users from changing the Disable Trust Bar Notification for Unsigned Application Add-ins
    and Block Them policy setting. The recommended state for this setting is: Enabled.'
  rationale: Windows will mark files downloaded from the internet within an alternative NTFS data stream on the file. Files
    from untrusted sources can contain malicious payloads embedded in the Macros, including fileless malware, and should be
    handled with extra care by utilizing additional security controls. Allowing unsigned application add-ins could cause the
    application to load dangerous add-ins and as a result, malicious code could become active endpoints and the network.
  impact: This enforces the default behavior and should not cause additional impact. If an application is configured to require
    that all add-ins be signed by a trusted publisher, any unsigned add-ins the application loads will be disabled and the
    application will display the Trust Bar at the top of the active window. The Trust Bar contains a message that informs
    users about the unsigned add-in.
  references:
  - 1. https://learn.microsoft.com/en-us/DeployOffice/security/internet-macros-blocked
