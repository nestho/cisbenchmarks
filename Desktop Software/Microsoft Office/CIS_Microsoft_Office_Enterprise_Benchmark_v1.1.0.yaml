  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether pictures and external content in HTML e-mail messages from untrusted
    senders on the Internet are downloaded without Outlook users explicitly choosing to do so. When Disabled, Outlook does
    not consider the Internet a safe zone, which means that Outlook will not automatically download content from external
    servers unless the sender is included in the Safe Senders list. Recipients can choose to download external content from
    untrusted senders on a message-by-message basis. The recommended state for this setting is: Disabled. This policy setting
    allows administrators to specify a folder path for the Secure Temporary Files rather than using the one that is randomly
    generated by Outlook. The recommended state for this setting is: Disabled. This policy setting controls whether Outlook
    considers a missing certificate revocation list (CRL) a warning or an error. Digital certificates contain an attribute
    that shows where the corresponding CRL is located. CRLs contain lists of digital certificates that have been revoked by
    their controlling certification authorities (CAs), typically because the certificates were issued improperly, or their
    associated private keys were compromised. The recommended state for this setting is: Enabled: Error. This policy setting
    controls how Outlook functions when a root certificate is missing. Outlook will display either an error or warning based
    on the status of the root certificate. The recommended state for this setting is: Enabled: Error. This policy setting
    allows the configuration of Level 2 errors as warnings instead of errors. Level 2 errors occur when the message signature
    appears to be valid, but there are other issues with the signature. Note: Potential Level 2 error conditions include the
    following: • Unknown Signature Algorithm • No Signing Certification Found • Bad Attribute Sets • No Issuer Certificate
    found • No CRL Found • Out-of-date CRL • Root Trust Problem • Out-of-date CTL The recommended state for this setting is:
    Disabled. Note: The title of the Group Policy text is slightly misleading. Promote Level 2 errors as errors, not warnings
    should actually read Promote Level 2 errors as warnings, not errors which would align more closely with the description
    of the various states Enable/Disable. This policy setting controls how Outlook retrieves Certificate Revocation Lists
    (CRLs) to verify the validity of certificates. CRLs are lists of digital certificates that have been revoked by their
    controlling Certificate Authority (CAs), typically because the certificates were issued improperly or their associated
    private keys were compromised. The recommended state for this setting is: Enabled: When online always retrieve the CRL.'
  rationale: 'E-mails sourced from the internet can contain malicious content or phishing links. This security control prevents
    the content in e-mail messages from automatically reaching the end user, as well as preventing the changing of this setting
    to an insecure state. Setting a designated specific path and folder to use as the Secure Temporary Files folder is not
    recommended because all users will have temporary Outlook files in the same predictable location, which is not as secure.
    If the name of this folder is well known, a malicious user or malicious code might target this location to try and gain
    access to attachments. If a CRL is missing or unavailable, Outlook cannot determine whether a certificate has been revoked.
    An improperly issued certificate or one that has been compromised might be used to gain access to data. When Outlook accesses
    a certificate, it validates that it can trust the certificate by examining the root certificate of the issuing CA. If
    the root certificate can be trusted, then certificates issued by the CA can also be trusted. If Outlook cannot find the
    root certificate, it cannot validate that any certificates issued by that CA can be trusted. An attacker may compromise
    a root certificate and then remove the certificate in an attempt to conceal the attack. Cryptographic errors in Outlook
    are classified as Level 1 (serious errors) or Level 2 (not as serious). By default, Outlook generates a warning, rather
    than an error, when a level 2 condition occurs: the certificate that generated the warning is treated as valid, and the
    user is not informed of the problem unless he or she opens the Signature Details dialog box and examines the certificate.
    In some cases, treating level 2 conditions as warnings can cause users to overlook potentially significant signature problems.
    Outlook may improperly trust a revoked certificate, which could put the system and data at risk.'
