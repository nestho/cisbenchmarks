- id: 2.1.5.1
  title: (L1) Ensure 'Modal Trust Decision Only' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls how Access notifies users about untrusted components. The recommended state for
    this setting is: Disabled.'
  rationale: By default, when users open an untrusted Access database that contains userprogrammed executable components,
    Access opens the database with the components disabled and displays the Message Bar with a warning that database content
    has been disabled. Users can inspect the contents of the database, but cannot use any disabled functionality until they
    enable it by clicking Options on the Message Bar and selecting the appropriate action. The default configuration can be
    changed so that users see a dialog box when they open an untrusted database with executable components. Users must then
    choose whether to enable or disable the components before working with the database. In these circumstances users frequently
    enable the components, even if they do not require them. Executable components can be used to launch an attack against
    a computer environment.
  impact: None - this is the default behavior.
