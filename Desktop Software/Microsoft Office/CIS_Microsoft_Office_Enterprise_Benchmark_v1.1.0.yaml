    the Outlook object model. When the option Automatically deny is selected, Outlook will automatically deny programmatic
    access requests from any program. The recommended state for this setting is: Enabled: Automatically Deny.'
  rationale: If users are not notified about invalid signatures, it might prevent the user from detecting a fraudulent signature
    sent by a malicious user. If users can demote Level 1 files to Level 2, they will be able to access potentially dangerous
    files after saving them to disk, which could allow malicious code to infect their system or compromise the security of
    sensitive information. By default, Outlook completely blocks access to Level 1 files, and requires users to save Level
    2 files to disk before opening them. If this configuration is changed, users will be able to open and execute potentially
    dangerous attachments, which can affect their computers or compromise the confidentiality, integrity, or availability
    of data. To protect users from viruses and other harmful files, Outlook uses two levels of security, designated Level
    1 and Level 2, to restrict users' access to files attached to email messages or other items. Outlook completely blocks
    access to Level 1 files by default, and requires users to save Level 2 files to disk before opening them. Potentially
    harmful files can be classified into these two levels by file type extension, with all other file types considered safe.
    By default, when a user closes an item to which a level 1 file has been attached, Outlook warns the user that the message
    contains a potentially unsafe attachment and that the user might not be able to access the attachment when opening the
    item later. (Such a sequence of events might occur when a user closes a draft message that they intend to resume editing
    at some future time.) If this configuration is changed, Outlook will not display the warning when the user closes the
    item but will still block the unsafe attachment if the user opens the message later. This functionality can cause users
    to lose access to important data. To protect users from viruses and other harmful files, Outlook uses two levels of security,
    designated Level 1 and Level 2, to restrict access to files attached to e-mail messages or other items. Outlook completely
    blocks access to Level 1 files by default, and requires users to save Level 2 files to disk before opening them. Potentially
    harmful files can be classified into these two levels by file type extension, with all other file types considered safe.
    By default, when users attempt to send an item to which a level 1 file has been attached, Outlook warns them that the
    message contains a potentially unsafe attachment and that the recipient might not be able to access it. If this configuration
    is changed, Outlook will not display the warning when users send such items, which can cause users to lose access to important
    data. Malicious code is often spread through e-mail. Some viruses have the ability to send copies of themselves to other
    people in the victim's Address Book or Contacts list, and such potentially harmful files can affect the computers of unwary
    recipients. Malicious code is often spread through e-mail. Some viruses have the ability to send copies of themselves
