  description: 'This policy setting controls whether or not Outlook is forced to fully nullify deleted data in users'' Personal
    Folder files (.pst) at the time that the data is deleted. NOTE: This setting does not apply to (.ost) files generated
    when Outlook is connected to either Exchange or Exchange Online. The recommended state for this setting is: Enabled. This
    policy setting controls how plain text messages are formatted when they are sent from Outlook. The recommended state for
    this setting is: Disabled. This setting allows unblocking of folder home pages for folders in non-default stores. The
    recommended state for this setting is: Enabled. This policy setting controls whether Outlook executes scripts that are
    associated with custom forms or folder home pages for public folders. By enabling this policy setting, Outlook cannot
    execute any scripts associated with public folders, overriding any configuration changes on users'' computers. The recommended
    state for this setting is: Enabled. This policy setting controls whether Outlook executes scripts associated with custom
    forms or folder home pages for shared folders. If this policy setting is enabled, Outlook cannot execute any scripts associated
    with shared folders, overriding any configuration changes on users'' computers. The recommended state for this setting
    is: Enabled. This policy setting controls whether e-mail messages dragged from Outlook to the file system are saved in
    Unicode or ANSI format. The recommended state for this setting is: Disabled.'
  rationale: When a user deletes mail or other items in Outlook, the data is retained in a portion of the PST file until it
    is purged or overwritten. Attackers could potentially recover the data by using PST recovery tools. Nulling the data at
    deletion time will impede this. If UUENCODE formatting is used, an attacker could manipulate the encoded attachment to
    bypass content filtering software. By default, Outlook automatically wraps plain text messages at 76 characters and uses
    the standard MIME format to encode attachments in plain text messages. However, these settings can be altered to allow
    email to be read in plain text e-mail programs that use a non-standard line length or that cannot process MIME attachments.
    Outlook allows users to designate Web pages as home pages for personal or public folders. When a user clicks on a folder,
    Outlook displays the home page the user has assigned to it. Although this feature provides the opportunity to create powerful
    public folder applications, scripts can be included on Web pages that access the Outlook object model, which exposes users
    to security risks. By default, Outlook does not allow users to define folder home pages for folders in non-default stores.
    If this configuration is changed, users can create and access dangerous folder home pages for Outlook data files (.pst)
    and other non-default stores, which can compromise the security of the users' data. In Outlook, folders can be associated
    with custom forms or folder home pages that include scripts that access the Outlook object model. These scripts can add
    functionality to the folders and items contained within, but dangerous scripts can pose security risks. By default, Outlook
    allows scripts included in custom forms or folder home pages for public folders to execute. If users inadvertently run
    dangerous scripts when using public folders, their computers or data could be at risk. In Outlook, folders can be associated
    with custom forms or folder home pages that include scripts that access the Outlook object model. These scripts can add
    functionality to the folders and items contained within, but dangerous scripts can pose security risks. Outlook does not
    allow scripts included in custom forms or folder home pages for shared folders to execute. If this configuration is changed,
    users can inadvertently run dangerous scripts when using shared folders, which can put their computers or data at risk.
    Unicode text is vulnerable to homograph attacks, in which characters are replaced by different but similar-looking characters.
    For example, the Cyrillic letter ? (U+0430) appears identical to the Latin letter a (U+0061) in many typefaces, but is
    actually a different character. Homographs can be used in "phishing" attacks to convince victims to visit fraudulent Web
    sites and enter sensitive information.
  impact: Forensics and data recovery of objects permanently removed by a user taking action to empty their Outlook trash
    bin will be made more difficult. These will need to be recovered by another method such as a system backup. None - this
    is the default behavior. None - This is the default behavior. If organizations use custom forms or public folder home
    pages that contain scripts, enabling this setting can reduce their functionality or render them unusable. Consider surveying
    the organization's public folders for affected items before enabling this setting. Enabling this setting enforces the
    default configuration in Outlook, and therefore is unlikely to cause usability issues for most users. ANSI file encoding
    may limit the overall size a .msg file can reach, although a single mail item should not be of concern.
  references:
  - 1. https://www.mandiant.com/resources/blog/breaking-the-rules-tough-outlook-forhome-page-attacks
