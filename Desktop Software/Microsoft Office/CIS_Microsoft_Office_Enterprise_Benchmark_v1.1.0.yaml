  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether Office users can add password encryption to documents. (Users would access
    this feature in Microsoft Office tab--click Info, click Protect Document, then click Encrypt with Password.) The recommended
    state for this setting is: Disabled. This setting controls the encryption mode that Office uses to protect content with
    Information Rights Management. • For Microsoft 365 Apps (Version 2304 or later): Cipher Block Chaining (CBC) mode is used
    • For earlier Microsoft 365 Apps and Office LTSC 2021, 2019, and 2016: Electronic Codebook (ECB) mode is used The recommended
    state for this setting is: Enabled: Cipher Block Chaining (CBC).'
  rationale: This capability can provide an extra level of protection to documents that are already protected by access control
    lists or provide a means of securing documents that are not protected by file-level security. If a document is password
    protected, users without the proper password will be prevented from opening the document(s). Electronic Codebook (ECB)
    has several weaknesses, such as the lack of diffusion, determinism, and susceptibility to pattern attacks. As a result,
    organizations like NIST and ISO recommend against its use. To ensure a higher level of security, Cipher Block Chaining
    (CBC) can be enforced. This block cipher mode will be used to encrypt IRM content with applications like Excel, PowerPoint,
    Word, Visio, or Outlook, regardless of their versions.
  impact: The recommended settings enforce the default configuration, and therefore will not affect usability. Typically,
    this setting should not be enabled, because doing so will prevent users from adding passwords to Office files. There is
    no impact or additional overhead associated with using CBC over ECB.
  references:
