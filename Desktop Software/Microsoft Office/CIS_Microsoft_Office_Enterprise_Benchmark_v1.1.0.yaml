  description: 'This policy setting controls the prompting and activation behavior for the Run Programs option for action
    buttons in PowerPoint. By choosing the Disable (don''t run any programs) option, if users click an action button with
    the Run Programs action assigned to it, nothing will happen. The recommended state for this setting is: Enabled: Disable
    (don''t run any programs) This policy setting controls whether encrypted macros in Open XML documents are required to
    be scanned with antivirus software before being opened. The recommended state for this setting is: Enabled: Scan encrypted
    macros.'
  rationale: Action buttons can be used to launch external programs from PowerPoint presentations. If a malicious user adds
    an action button to a presentation that launches a dangerous program, it could affect the security of a user's computer
    and data. When an Office Open XML document is rights-managed or password protected, macros that are embedded in the document
    are encrypted along with the rest of the workbook's contents. Macros can contain malicious code which could cause a virus
    to load undetected and lead to data loss or reduced application functionality.
  impact: Users who wish to create or use presentations that launch external programs when action buttons are clicked will
    not be able to do so. These users will have to launch any external programs manually at the appropriate times when delivering
    presentations. None - this is the default behavior. By default, encrypted macros will be disabled unless they are scanned
