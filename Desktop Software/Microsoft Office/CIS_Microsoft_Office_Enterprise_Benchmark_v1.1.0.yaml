  description: 'This policy setting will allow users with earlier versions of Office to read documents with browsers supporting
    Information Rights Management. The recommended state for this setting is: Disabled. This policy setting controls whether
    group names automatically expand to display all the members of the group when selected in the Permissions dialog box.
    The recommended state for this setting is: Enabled.'
  rationale: The Windows Rights Management Add-on for Internet Explorer provides a way for users who do not use the Office
    release to view, but not alter, files with restricted permissions. By default, IRM-enabled files are saved in a format
    that cannot be viewed by using the Windows Rights Management Add-on. If this setting is enabled, an embedded rights-managed
    HTML version of the content is saved with each IRMenabled file, which can be viewed in Internet Explorer using the add-on.
    This configuration increases the size of rights-managed files, in some cases significantly. By default, when users select
    a group name while applying Information Rights Management (IRM) permissions to Excel workbooks, InfoPath templates, Outlook
    email messages, PowerPoint presentations, or Word documents in the Permissions dialog box, the members of the group are
    not displayed. This functionality can make it possible for users to unknowingly give read or change permissions to inappropriate
    people.
  impact: Disabling this setting enforces the default configuration, and is therefore unlikely to cause significant usability
    issues for most users. Enabling this setting changes the way the Permissions dialog box displays names, but should not
