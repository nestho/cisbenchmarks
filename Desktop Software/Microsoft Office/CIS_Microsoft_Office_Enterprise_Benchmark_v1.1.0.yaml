  description: 'This policy setting controls whether Outlook subscribes to the Common Feed List, which is made available to
    multiple RSS clients. The Common Feed List is a hierarchical set of RSS Feeds to which clients such as Outlook, the Feeds
    list in Internet Explorer 7, and the Feed Headlines Sidebar gadget in Windows Vista can subscribe. The recommended state
    for this setting is: Disabled.'
  rationale: The Common Feed list is a hierarchical set of RSS feeds to which clients such as Outlook, the Feeds list in Internet
    Explorer 7, and the Feed Headlines Sidebar gadget in Windows Vista can subscribe. If Outlook subscribes to a very large
    feed list, performance and availability can be affected, especially if Outlook is configured to download full RSS message
    bodies or if the feed list is not AutoArchived regularly. By default, Outlook maintains its own list of feeds and does
    not automatically subscribe to RSS feeds that are added to the Common Feed List.
  impact: Disabling this setting can cause disruptions for users who are accustomed to accessing the Common Feed List in Outlook.
    Users will still have access to the Common Feed List through Internet Explorer 7 and other client programs. Disabling
    this setting does not prevent users from maintaining a separate RSS Feeds subscriptions list in Outlook.
