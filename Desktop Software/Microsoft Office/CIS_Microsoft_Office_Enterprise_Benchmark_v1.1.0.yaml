  title: '(L1) Ensure ''Control how Office handles form-based sign-in prompts'' is set to ''Enabled: Block all prompts'''
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls how Office applications handle form-based sign-in prompts. Office Forms Based
    Authentication [MS-OFBA] is a protocol used in Office suite applications since Microsoft Office 2007. It provides a method
    to authenticate to other services via HTTP over a network connection. Note: This policy setting only applies to subscription
    versions of Office, such as Microsoft 365 Apps for enterprise, and to subscription versions of Project and Visio. The
    recommended state for this setting is: Enabled: Block all prompts This policy setting restricts VBA to checking project
    library references only against the registry and trusted zones. The recommended state for this setting is: Disabled'
  rationale: Office Forms Based Authentication Protocol is legacy protocol, and is disabled in Office by default. It is associated
    with several exploits such as credential theft and denial of service attacks. A remote code execution vulnerability exists
    when Microsoft Office improperly loads arbitrary type libraries. An attacker could then install programs, view, change,
    or delete data, or create new accounts with full user rights. Users whose accounts are configured to have fewer user rights
    on the system could be less impacted than users who operate with administrative user rights. To exploit the vulnerability,
    an attacker must first convince a user to open a specially crafted Office document.
  impact: This enforces the default configuration of Office and will only impact users who have already permitted it in the
    Trust Center. None - this is the default behavior.
