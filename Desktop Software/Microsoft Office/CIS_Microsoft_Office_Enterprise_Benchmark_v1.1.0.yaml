  title: '(L1) Ensure ''Minimum encryption settings'' is set to ''Enabled: 256'''
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting allows the configuration of the minimum cryptographic key length for encrypting e-mail
    messages. The recommended state for this setting is: Enabled: 256.'
  rationale: Cryptographic keys are used to encrypt and decrypt messages for transmission through unsecured channels. Key
    sizes are measured in bits, with larger keys generally less vulnerable to attack than smaller ones. 40-bit and 56-bit
    keys were common in the past, but as computers have become faster and more powerful these smaller key sizes have become
    vulnerable to brute-force attacks in which the attacking computer rapidly runs through every possible key combination
    until it successfully decrypts the message. The Advanced Encryption Standard (AES) published by the United States government
    requires a minimum key size of 128 bits for symmetric encryption, which offers significantly more protection against brute-force
    attack than smaller key sizes.
  impact: Users who see the minimum encryption warning display can still choose to send the message with the selected key,
    so little to no impact is expected.
