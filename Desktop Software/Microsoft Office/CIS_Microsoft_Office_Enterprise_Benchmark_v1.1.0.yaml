    access permissions to Word documents, Excel workbooks, PowerPoint presentations, InfoPath templates and forms, and Outlook
    e-mail messages. This functionality helps prevent sensitive information from being printed, forwarded, or copied by unauthorized
    people. This setting can be used to prevent Office users from changing the IRM permissions of a document. If this setting
    is Enabled, users can open and edit documents for which they have the appropriate permissions, but they cannot create
