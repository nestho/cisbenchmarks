  title: (L2) Ensure 'Disable Slide Update' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'This policy setting controls whether users can link slides in a presentation with their counterparts in a
    PowerPoint Slide Library. PowerPoint users can share and reuse slide content by storing individual slide files in a centrally
    located Slide Library on a server running Office SharePoint Server. Using the Slide Update feature, users can associate
    a slide in a presentation on a user''s computer with the original slide that resides in the Slide Library on the server.
    The recommended state for this setting is: Enabled.'
  rationale: Updating a slide in a presentation from an external source like a Slide Library can cause important information
    to be exposed or lost. An attacker could modify the data in the slide library, affecting the integrity of all slide presentations
    that depend upon that library.
  impact: Enabling this setting prevents PowerPoint from checking Slide Libraries for slide updates.
