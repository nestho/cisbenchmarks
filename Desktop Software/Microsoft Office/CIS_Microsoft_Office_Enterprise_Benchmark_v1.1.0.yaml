- id: 2.3.27.19
  title: (L1) Ensure 'Suppress hyperlink warnings' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether Office applications notify users about unsafe hyperlinks. Links that
    Office considers unsafe include links to executable files, TIFF files, and Microsoft Document Imaging (MDI) files. Other
    unsafe links are those that use protocols considered to be unsafe such as javascript. The recommended state for this setting
    is: Disabled. This policy setting controls whether Office applications can poll Office servers to retrieve lists of published
    links. Note: This policy setting applies to Microsoft SharePoint Server specifically. It does not apply to Microsoft SharePoint
    Foundation. The recommended state for this setting is: Enabled.'
  rationale: Unsafe hyperlinks are links that might pose a security risk if users click them. Clicking an unsafe link could
    compromise the security of sensitive information or harm the computer. Links that Office considers unsafe include links
    to executable files, TIFF files, and Microsoft Document Imaging (MDI) files. Other unsafe links are those that use protocols
    considered to be unsafe, including msn, nntp, mms, outlook, and stssync. By default, Office applications notify users
    about unsafe hyperlinks and disable them until users enable them. By default, users of Office applications can see and
    use links to Microsoft Office SharePoint Server sites from those applications. Administrators configure published links
    to Office applications during initial deployment, and can add or change links as part of regular operations. These links
    appear on the My SharePoint Sites tab of the Open, Save, and Save As dialog boxes when opening and saving documents from
    these applications. Links can be targeted so that they only appear to users who are members of particular audiences. If
    a malicious person gains access to the list of published links, they could modify the links to point to unapproved sites,
    which could make sensitive data vulnerable to exposure.
  impact: 'This setting does not alter the default configuration and therefore is unlikely to provide any usability concerns.
    If this setting is Enabled, users will not be able to use the list of published links to open and save files directly
    from within Office applications, which could hinder the use of SharePoint Server for document collaboration. Note#2: This
    setting applies to Microsoft Office SharePoint Server specifically. It does not apply to Windows SharePoint Services (WSS).'
  references: []
