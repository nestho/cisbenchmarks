  description: 'This policy setting specifies whether Outlook automatically turns text that represents Internet and network
    paths into hyperlinks. This option can also be configured by selecting the "Internet and network paths with hyperlinks"
    check box that is available on the Outlook. The recommended state for this setting is: Disabled.'
  rationale: Users may receive emails from attackers that contain Internet or network paths to malicious content. Users may
    unintentionally click on hyperlinks if they are presented to the users automatically.
