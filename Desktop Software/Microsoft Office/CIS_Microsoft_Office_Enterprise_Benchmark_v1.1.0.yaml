- id: 2.3.22.3
  title: '(L1) Ensure ''Control Blogging'' is set to ''Enabled: All Blogging Disabled'''
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  description: 'This policy setting controls whether users can compose and post blog entries from Word. The recommended state
    for this setting is: Enabled: All Blogging Disabled. This policy setting controls whether users with the Microsoft Office
    Compatibility Pack for Word, Excel, and PowerPoint 2016 File Formats installed can open Office Open XML files saved with
    pre-release versions of Excel 2016. Excel Open XML files usually have the following extensions: .xlsx, .xlsm, .xltx, .xltm,
    .xlam. The recommended state for this setting is: Enabled. This policy setting controls whether users with the Microsoft
    Office Compatibility Pack for Word, Excel, and PowerPoint 2016 File Formats installed can open Office Open XML files saved
    with pre-release versions of PowerPoint 2016. PowerPoint Open XML files usually have the following extensions: .pptx,
    .pptm, .potx, .potm, .ppsx, .ppsm, .ppam, .thmx, .xml. The recommended state for this setting is: Enabled. This policy
    setting controls removal of Office Presentation Service from the list of online presentation services in PowerPoint and
    Word. This list appears when a user selects Present Online from the Share tab in Backstage view and in the ribbon in PowerPoint.
    The recommended state for this setting is: Enabled.'
  rationale: 'The blogging feature in Word enables users to compose blog entries and post them to their blogs directly from
    Word, without using any additional software. By default, users can post blog entries to any compatible blogging service
    provider, including Windows Live Spaces, Blogger, a SharePoint or Community Server site, and others. If the organization
    has policies that govern the posting of blog entries, allowing users to access the blogging feature in Word might enable
    them to violate those policies. The Microsoft Office Compatibility Pack for Word, Excel, and PowerPoint File Formats enables
    users of Microsoft Excel 2000, Microsoft Excel 2002, and Microsoft Office Excel 2003 to open files saved in the Office
    Open XML format used by Excel. Excel Open XML files usually have the following extensions: • .xlsx • .xlsm • .xltx • .xltm
    • .xlam By default, the Compatibility Pack does not open files that were saved in pre-release versions of the new Office
    Open XML format, which underwent some minor changes prior to the final release of Excel. If this configuration is changed
    through a registry modification or by some other mechanism, users with the Compatibility Pack installed can open files
    saved by some pre-release versions of Excel, but not by others, which can lead to inconsistent file opening functionality.
    The Microsoft Office Compatibility Pack for Word, Excel, and PowerPoint File Formats enables users of Microsoft PowerPoint
    2000, PowerPoint 2002, and Office PowerPoint 2003 to open files saved in the Office Open XML format used by PowerPoint.
    PowerPoint Open XML files usually have the following extensions: • .pptx • .pptm • .potx • .potm • .ppsx • .ppsm • .ppam
    • .thmx • .xml By default, the Compatibility Pack does not open files that were saved in pre-release versions of the new
    Office Open XML format, which underwent some minor changes prior to the final release of PowerPoint. If this configuration
    is changed through a registry modification or by some other mechanism, users with the Compatibility Pack installed can
    open files saved by some pre-release versions of PowerPoint, but not by others, which can lead to inconsistent file opening
    functionality. Allowing users to utilize Office Presentation Service for PowerPoint and Word could allow for sensitive
    information to be sent to unauthorized parties in an unintended manner. Any information in a Word Document, or PowerPoint
    document could simply be sent through this service to network connected viewers. Intended or Unintended data leakage can
    be prevented by turning off unused services.'
  impact: 'Disabling the blogging feature in Word may cause disruptions for users who use Word to compose and post blog entries.
    Any users who have a legitimate need to post blog entries will have to use another tool. Enabling this setting enforces
    the default configuration, and is therefore unlikely to cause usability issues for most users. NOTE: See Plan block file
    format settings in the Office Resource Kit for more information about using Group Policy to manage and enforce file format
    requirements. Also, see the "File Block Technology" section in Chapter 4 of the Microsoft Office Security Guide for information
    about the Microsoft Office Isolated Conversion Environment (MOICE), which provides another method. Enabling this setting
    enforces the default configuration, and is therefore unlikely to cause usability issues for most users. NOTE: See Plan
    block file format settings in the Office Resource Kit for more information about using Group Policy to manage and enforce
    file format requirements. Also, see the "File Block Technology" section in Chapter 4 of the Microsoft Office Security
