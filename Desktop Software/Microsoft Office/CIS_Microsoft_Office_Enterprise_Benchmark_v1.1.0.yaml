- id: 2.3.18.3
  title: (L1) Ensure 'Always require users to connect to verify permission' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether users are required to connect to the Internet or a local network to have
    their licenses confirmed every time they attempt to open Excel workbooks, InfoPath forms or templates, Outlook e-mail
    messages, PowerPoint presentations, or Word documents that are protected by Information Rights Management (IRM). This
    policy is useful for logging the usage of files with restricted permissions on the server. The recommended state for this
    setting is: Enabled. This policy setting controls whether Office users can assign permissions to distribution lists when
    using Information Rights Management. The recommended state for this setting is: Enabled.'
  rationale: By default, users are not required to connect to the network to verify permissions. If users do not need their
    licenses confirmed when attempting to open Office documents, they might be able to access documents after their licenses
    have been revoked. Also, it is not possible to log the usage of files with restricted permissions if users' licenses are
    not confirmed. By default, Office users can specify distribution lists when using Information Rights Management (IRM)
    to restrict access to Excel workbooks, InfoPath templates, Outlook e-mail messages, PowerPoint presentations, or Word
    documents. If users are not fully aware of the distribution list's membership before assigning it permission to open or
    modify a document, sensitive information could be at risk.
  impact: Enabling this setting could create problems for users who need to open rights-managed files when they are not connected
    to the Internet, such as mobile users. Consider surveying the organization to determine users' need for offline use of
    rights-managed files before enabling this setting. Enabling this setting could cause some disruptions for Office users
    who are accustomed to specifying distribution groups when defining permissions for a document. These users will have to
    list users individually in the Permission dialog box to assign them permission to read or modify the document. Users who
    do not use Information Rights Management will not be affected by this setting.
