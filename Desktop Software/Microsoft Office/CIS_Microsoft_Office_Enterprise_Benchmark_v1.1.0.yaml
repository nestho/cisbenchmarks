  impact: 'Enabling this setting does not prevent users from choosing a different file format for a new Word file, therefore
    it is unlikely to affect usability for most users. Enabling this setting prevents users from opening, viewing, or editing
    certain types of files in Word. Productivity could be affected if users who require access to any of these file types
    cannot access them. Word 2 and earlier binary documents and templates will not open in Microsoft Word. Word 2000 binary
    documents and templates will not open in Microsoft Word. Word 2003 binary documents and templates will not open in Microsoft
    Word. Word 2007 and later binary documents and templates will not open in Microsoft Word. Word 6.0 binary documents and
    templates will not open in Microsoft Word. Word 95 binary documents and templates will not open in Microsoft Word. Word
    97 binary documents and templates will not open in Microsoft Word. Word XP binary documents and templates will not open
    in Microsoft Word. When files open in Protected View, some functionality will be unavailable. Users will be unable to
    edit the file. Some functionality is not available when files are opened in Protected View. In such cases, users must
    move the files from unsafe locations to safe locations in order to access them with full functionality. Files that are
    blocked by the validation fail rule will not open on a user''s computer. Files that are blocked by the validation fail
    rule will not open on a user''s computer. Some functionality is not available when files are opened in Protected View.
    Users will be unable to edit documents. Disabling this setting will cause disruption for users who add network locations
    to the Trusted Locations list. These custom locations added by users are ignored but not removed. Trusted locations added
    in Group Policy that specify a network location are also ignored. All trusted locations (those specified in the Trust
    Center) in the specified applications are ignored, including any trusted locations established by Office 2016 during setup,
    deployed to users using Group Policy, or added by users themselves. Users will be prompted again when opening files from
    trusted locations. As this measure is enforcing the default, there is little or no impact. If an application is configured
    to require that all add-ins be signed by a trusted publisher, any unsigned add-ins the application loads will be disabled
    and the application will display the Trust Bar at the top of the active window. The Trust Bar contains a message that
    informs users about the unsigned add-in. None - DDE is disabled by default in Word. Enforcing this policy ensures users
    cannot enter an unsecure state. This setting could cause disruptions for users who rely on add-ins that are not signed
    by trusted publishers. These users will either have to obtain signed versions of such addins or stop using them. Office
    stores certificates for trusted publishers in the trusted publisher store. Earlier versions of Office stored trusted publisher
    certificate information (specifically, the certificate thumbprint) in a special Office trusted publisher store. Office
    still reads trusted publisher certificate information from the Office trusted publisher store but does not write information
    to this store. If a list of trusted publishers in a previous version of Office was created and the Office release was
    upgraded, the trusted publisher list will still be recognized. However, any trusted publisher certificates that were added
    to the list will be stored in the Internet Explorer trusted publisher store. None - this is the default behavior. By default,
    encrypted macros will be disabled unless they are scanned by antivirus software immediately before being loaded. None
    - this is the default behavior. By default, Excel, Word, and PowerPoint do not allow automation clients to have programmatic
    access to VBA projects. Users can enable this by selecting the Trust access to the VBA project object model in the Macro
    Settings section of the Trust Center. However, doing so allows macros in any documents the user opens to access the core
    Visual Basic objects, methods, and properties, which represents a potential security hazard. This configuration causes
    documents and templates that contain unsigned macros to lose all functionality supplied by the macro. To prevent this
    loss of functionality, users can install the macro in a trusted location, unless the Disable all trusted locations setting
    is configured to Enabled, which will not allow the user to add to the trusted location. Warning: With the Disable all
    except digitally signed macros option selected, users will not be able to open unsigned Access databases. This configuration
    causes documents and templates that contain unsigned macros to lose all functionality supplied by the macro. To prevent
    this loss of functionality, users can install the macro in a trusted location, unless the Disable all trusted locations
    setting is configured to Enabled, which will not allow the user to add to the trusted location.'
