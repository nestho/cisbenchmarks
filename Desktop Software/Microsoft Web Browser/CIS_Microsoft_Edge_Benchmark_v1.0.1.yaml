- id: 1.1.1
  title: '(L1) Ensure ''Ads setting for sites with intrusive ads'' is set to ''Enabled: Block ads on sites with intrusive
    ads'''
  scoring: scored
  profile:
  - Level 1
  description: 'This setting controls whether ads are blocked on sites with intrusive ads. The recommended state for this
    setting is: Enabled: Block ads on sites with intrusive ads.'
  rationale: Intrusive ads are ads found on websites that are invasive or unwelcome. These ads can contain malicious files
    or can fool an unknowing user into giving away their username and/or password.
  impact: Ads that may be non-intrusive can be blocked. 13 | P a g e
  references: []
  page_start: 13
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location which

    should be set to 2.

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge:AdsSettingForIntrusiveAds

    Sites'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to Enabled:

    Block ads on sites with intrusive ads

    Computer Configuration\Policies\Administrative Templates\Microsoft Edge\Ads

    setting for sites with intrusive ads

    Note: This Group Policy path may not exist by default. It is provided by the Group Policy

    template MSEdge.admx/adml that can be downloaded from: Download Microsoft Edge for

    Business - Microsoft.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location which

      should be set to 2.

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge:AdsSettingForIntrusiveAds

      Sites'
    severity: medium
- id: 1.1.2
  title: '(L1) Ensure ''Allow download restrictions'' is set to ''Enabled: Block potentially dangerous downloads'''
  scoring: scored
  profile:
  - Level 1
  description: 'This policy controls whether Microsoft Edge blocks certain types of downloads, and prevents users from bypassing
    security warnings, depending on the classification of Safe Browsing. If this policy is not configured the default state
    of ''No special restrictions'' will be used and the downloads will go through the usual security restrictions based on
    Microsoft Defender SmartScreen analysis results if it is used. Note: These restrictions only apply to downloads from web
    page content, as well as the ''download link...'' context menu option. These restrictions don''t apply to saving or downloading
    the currently displayed page, nor do they apply to the Save as PDF option from the printing options. For more information
    on Microsoft Defender SmartScreen, please visit Microsoft Defender SmartScreen Frequently Asked Questions. Note #2: Microsoft
    Edge relies on the Internet Explorer zones (Local Machine, Local Intranet, Trusted, Internet, Restricted) to determine
    which sites may bypass this policy setting. Please see Security Zones in Edge – text/plain for more information. The recommended
    state for this setting is: Enabled: Block potentially dangerous downloads.'
  rationale: Downloads can contain malware that has the potential to exfiltrate sensitive data or encrypt critical systems
    for ransom.
  impact: Users will be prevented from downloading certain types of files, and will not be able to bypass security warnings.
    15 | P a g e
  references: []
  page_start: 15
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location which

    should be set to 2:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge:DownloadRestrictions'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to Enabled:

    Block potentially dangerous downloads.

    Computer Configuration\Policies\Administrative Templates\Microsoft Edge\Allow

    download restrictions

    Note: This Group Policy path may not exist by default. It is provided by the Group Policy

    template MSEdge.admx/adml that can be downloaded from: Download Microsoft Edge for

    Business - Microsoft.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location which

      should be set to 2:

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge:DownloadRestrictions'
    severity: medium
- id: 1.1.3
  title: (L2) Ensure 'Allow file selection dialog' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 2
  description: 'This policy setting allows access to local files by allowing file selection dialogs in Microsoft Edge. The
    recommended state for this setting is: Disabled.'
  rationale: Allowing users to import favorites, uploading files, and savings links could pose potential security risks by
    allowing data to be uploaded to external sites or by downloading malicious files. By not allowing the file selection dialog
    the end-user will not be prompted for uploads/downloads preventing data exfiltration and possible system infection by
    malware.
  impact: If you disable this setting users will no longer be prompted when performing actions which would trigger a file
    selection dialog. Instead, the file selection dialog box assumes the user clicked "Cancel". Being as this is not the default
    behavior, impact to the user will be noticeable, and the user will not be able to upload and download files.
  references:
  - 1. https://docs.microsoft.com/DeployEdge/microsoft-edgepolicies#allowfileselectiondialogs
  page_start: 17
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location which

    should be set to 0.

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge:AllowFileSelectionDialogs

    17 | P a g e'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to Disabled.

    Computer Configuration\Policies\Administrative Templates\Microsoft Edge\Allow

    file selection dialogs

    Note: This Group Policy path may not exist by default. It is provided by the Group Policy

    template MSEdge.admx/adml that can be downloaded from: Download Microsoft Edge for

    Business - Microsoft.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location which

      should be set to 0.

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge:AllowFileSelectionDialogs

      17 | P a g e'
    severity: medium
- id: 1.1.4
  title: (L1) Ensure 'Allow Google Cast to connect to Cast devices on all IP addresses' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: This policy setting controls whether Google Cast is able to connect to all IP Addresses or only private IP
    Addresses as defined in RFC1918 (IPv4) and RFC4193 (IPv6). Note that if the EnabledMediaRouter policy is set to Disabled
    there is no positive or negative effect for this setting. The recommended state for this setting is Disabled.
  rationale: 'Allowing Google Cast to connect to public IP addresses could allow media and other potentially sensitive data
    to be exposed to the public. Disabling this setting will ensure that Google Cast is only able to connect to private (ie:
    internal) IP addresses.'
  impact: If this setting is set to Disabled there will be no effect to the user, as the default behavior of Not Configured
    has the same behavior as disabling the setting.
  references:
  - 1. https://docs.microsoft.com/DeployEdge/microsoft-edgepolicies#mediaroutercastallowallips
  page_start: 19
