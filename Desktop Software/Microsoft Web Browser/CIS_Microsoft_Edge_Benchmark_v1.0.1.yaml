- id: 1.1.5
  title: (L1) Ensure 'Allow importing of autofill form data' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: This policy setting controls whether users are allow to import autofill data from other browsers into Microsoft
    Edge. The recommended state for this setting is Disabled.
  rationale: Allowing autofill data to be imported could potentially allow sensitive data such as personally identifiable
    information (PII) from a non-secured source into Microsoft Edge. Considering that storage of sensitive data should be
    handled with care disabling this setting is recommended.
  impact: If you set this setting to Disabled users will be unable to perform an import of autofill data during Microsoft
    Edge first run. This will also prevent users from importing data after Microsoft Edge has been setup.
  references:
  - 1. https://docs.microsoft.com/DeployEdge/microsoft-edgepolicies#importautofillformdata
  page_start: 21
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location which

    should be set to 0.

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge:ImportAutofillFormData

