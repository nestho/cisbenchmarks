- id: 1.1.12
  title: (L2) Ensure 'Allow or block audio capture' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 2
  description: 'This policy setting allows you to set whether the end-user is prompted for access to audio capture devices.
    This may be Enabled (Default) or Disabled, in which case audio capture will only work for URLs configured in the AudioCaptureAllowedUrls
    setting. Note: The AudioCaptureAllowedUrls setting will also need to be configured along with this setting. The recommended
    state for this setting is: Disabled.'
  rationale: With the end-user having the ability to allow or deny audio capture for websites in Microsoft Edge, could open
    an organization up to a malicious site that may capture proprietary information through the browser. By limiting or disallowing
    this setting, it removes the end-user's discretion leaving it up to the organization as to the sites allowed to use this
    ability.
  impact: If this setting is disabled users will not be prompted for audio devices when using websites which may need this
    access, for example a web-based conferencing system. If there are sites which access will be allowed, this will need to
    be configured in the AudioCaptureAllowedUrls setting.
  references:
  - 1. https://docs.microsoft.com/DeployEdge/microsoft-edgepolicies#audiocaptureallowed
  page_start: 35
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location which

    should be set to 0.

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge:AudioCaptureAllowed

    35 | P a g e'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to Disabled

    Computer Configuration\Policies\Administrative Templates\Microsoft Edge\Allow

    or block audio capture

    Note: This Group Policy path may not exist by default. It is provided by the Group Policy

    template MSEdge.admx/adml that can be downloaded from Microsoft here.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location which

      should be set to 0.

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge:AudioCaptureAllowed

