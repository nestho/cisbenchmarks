- id: 1.2.1
  title: (L1) Ensure 'Enable Google Cast' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting determines whether users may utilize Google Cast. Note that when this setting is set to
    Disabled the Show the cast icon in the toolbar setting is ignored as the icon is removed. The recommended state for this
    setting is: Disabled.'
  rationale: The use of Google Cast could allow users to show potentially sensitive information to non-trusted devices. These
    devices could be in public areas.
  impact: Users will not be able to utilize Google Cast and the Google Cast icon will not be displayed in Microsoft Edge.
  references:
  - 1. https://docs.microsoft.com/DeployEdge/microsoft-edgepolicies#enablemediarouter
  page_start: 17
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location which

    should be set to 0.

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge:EnableMediaRouter'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Disabled:

    Computer Configuration\Policies\Administrative Templates\Microsoft

    Edge\Cast\Enable Google Cast

    Note: This Group Policy path may not exist by default. It is provided by the Group Policy

    template MSEdge.admx/adml that can be downloaded from: Download Microsoft Edge for

    Business - Microsoft.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location which

      should be set to 0.

      HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge:EnableMediaRouter'
    severity: medium
- id: 1.3.1
  title: (L2) Ensure 'Allow read access via the File System API on these sites' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting allows organizations to list the URL patterns that specify which sites can ask users to
    grant them read access to files or directories in the host operating system´s file system via the File System API. Note:
    Leaving the policy unset means DefaultFileSystemReadGuardSetting (Control use of the File System API for reading) applies
    for all sites, if it´s set. If not, users´ personal settings apply. Note #2: URL patterns can´t conflict with FileSystemReadBlockedForUrls
    (Block read access via the File System API on these sites). Neither policy takes precedence if a URL matches with both.
    The recommended state for this setting is: Disabled. This policy setting determines whether users can receive customized
    background images and text, suggestions, notifications, and tips for Microsoft services. The recommended state for this
    setting is: Disabled. This policy setting allows for the configuration for users to add exceptions to allow mixed content
    for specific sites. The recommended state for this setting is: Enabled: Do not allow any site to load mixed content Note:
    This policy can be overridden for specific URL patterns using the insecurecontentAllowedForUrls (Allow insecure content
    on specified sites) and insecurecontentBlockedForUrls (Block insecure content on specified sites) policies.'
  rationale: This API allows web apps to read or save changes directly to files and folders on user devices, beyond reading
    and writing files; the File System Access API provides the ability to open a directory and enumerate its contents. Allowing
    web apps the ability to enumerate the contents of a directory by reading or saving changes directly to files and folders
    opens the organization to malicious content to be saved directly onto user devices. Microsoft collects and uses user browsing
    activity to personalize advertising, recommendations and experiences, which could inadvertently expose and share sensitive
    data with unauthorized 3rd parties. Allowing mixed (secure / insecure) content from a site can lead to malicious content
    being loaded. Mixed content occurs if the initial request is secure over HTTPS, but HTTPS and HTTP content is subsequently
    loaded to display the web page. HTTPS content is secure. HTTP content is insecure.
  impact: Users with creative roles that require read access to files and directories via the File System API may need additional
    permissions granted for said roles. Users will not receive Microsoft spotlight experiences or recommendations. Users will
    not be able to add exceptions for mix content webpages.
  references:
  - 1. https://docs.microsoft.com/en-us/deployedge/microsoft-edgepolicies#filesystemreadaskforurls
  - 2. https://web.dev/file-system-access/
  - 1. https://support.microsoft.com/en-us/microsoft-edge/microsoft-edge-browsingactivity-for-personalized-advertising-and-experiences
  page_start: 20
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. Navigate to the UI Path articulated in the Remediation section and confirm it

    is set as prescribed. This group policy setting will have no registry value (the key will

    not exist) if it is set to Disabled:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge:FileSystemReadAskForUrls

    Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location which

    should be set to 0.

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge:SpotlightExperiencesAndRe

    commendationsEnabled

    Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location which

    should be set to 2:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge:DefaultinsecurecontentSet

    ting'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Disabled:

    Computer Configuration\Policies\Administrative Templates\Microsoft

    Edge\Content settings\Allow read access via the File System API on these

    sites

    Note: This Group Policy path may not exist by default. It is provided by the Group Policy

    template MSEdge.admx/adml that can be downloaded from: Download Microsoft Edge for

    Business - Microsoft.

    To establish the recommended configuration via GP, set the following UI path to

    Disabled:

    Computer Configuration\Policies\Administrative Templates\Microsoft

    Edge\Content settings\Choose whether users can receive customized background

    images and text, suggestions, notifications, and tips for Microsoft services

    Note: This Group Policy path may not exist by default. It is provided by the Group Policy

    template MSEdge.admx/adml that can be downloaded from: Download Microsoft Edge for

    Business - Microsoft.

