- id: 1.3.10
  title: '(L1) Ensure ''Default geolocation setting'' is set to ''Enabled: Don''t allow any site to track users physical location'''
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether a users'' physical location can be tracked by websites. The recommended
    state for this setting is: Enabled: Don''t allow any site to track users'' physical location. This policy setting configures
    users’ ability to override state of feature flags. Feature flags are settings a team can define that indicate whether
    a given set of features is visible in the user experience and/or invoked within the functionality. The recommended state
    for this setting is: Enabled: Prevent users from overriding feature flags.'
  rationale: Geolocation should not be shared with websites to ensure protection of the user’s privacy regarding location.
    Additionally, location information could lead to clues regarding the user’s network infrastructure surrounding the device
    they are utilizing. The user’s ability to enter commands and to override programs should be limited at the CLI in order
    to prevent users from altering systems configurations. Additionally, Feature flags are not necessary for users, as they
    are used by the DevOps team during the development and experimental process.
  impact: Location information will not be shared with websites in Microsoft Edge. This could have an effect on websites that
    utilize this information for customized content. It can be risky for experimental features to be allowed in an enterprise
    managed environment because this can introduce bugs and security holes into systems, making it easier for an attacker
    to gain access. It is generally preferred to only use productionready features.
  references:
  - 1. https://docs.microsoft.com/DeployEdge/microsoft-edgepolicies#defaultgeolocationsetting
  - 1.4 Default search provider
  - 1.5 Experimentation
  - 1.5.1 (L1) Ensure 'Configure users ability to override feature flags'
  - 1. https://docs.microsoft.com/en-us/devops/operate/progressive-experimentationfeature-flags
