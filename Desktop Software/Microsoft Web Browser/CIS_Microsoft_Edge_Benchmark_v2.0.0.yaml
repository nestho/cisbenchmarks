- id: '1.99'
  title: '(L1) Ensure ''Enhance the security state in Microsoft Edge'' is set to ''Enabled: Balanced mode'''
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting configures “enhance the security state” in Microsoft Edge. Enhanced security in Microsoft
    Edge helps safeguard against memory-related vulnerabilities by disabling just-in-time (JIT) JavaScript compilation and
    enabling additional operating system protections for the browser. These protections include Hardware-enforced Stack Protection
    and Arbitrary Code Guard (ACG). Enhanced security provides two levels of browsing security: Balanced and Strict. Balanced
    mode is an adaptive mode that builds on a user’s behavior on a particular device. Strict mode applies added security protections
    for all the sites a user visits. Users may report some challenges accomplishing their usual tasks when in strict mode.
    The recommended state for this setting is: Enabled: Balanced mode.'
