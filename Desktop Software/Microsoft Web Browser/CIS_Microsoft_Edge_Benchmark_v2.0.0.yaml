- id: 1.7.1
  title: (L1) Ensure 'Allow Basic authentication for HTTP' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting determines if Basic authentication receives challenges over nonsecure HTTP. Basic authentication
    is a non-secure authentication method that relies on sending the username and password to the server in plaintext. Note:
    This policy setting is ignored (and Basic is always forbidden) if the AuthSchemes (Supported authentication schemes) policy
    is set and does not include Basic. The recommended state for this setting is Disabled.'
  rationale: Basic authentication is less robust than other authentication methods available because credentials including
    passwords are transmitted in plain text. An attacker who can capture these credentials in plain text can gain access to
    the system.
  impact: Non-secure HTTP requests from the Basic authentication scheme are blocked, and only secure HTTPS is allowed.
  references:
  - 1. https://techcommunity.microsoft.com/t5/microsoft-security-baselines/securitybaseline-for-microsoft-edge-version-88/bap/2094443#:~:text=A%20new%20Microsoft%20Edge%20security,from%20the%
