- id: 1.3.4
  title: '(L2) Ensure ''Control use of JavaScript JIT'' is set to ''Enabled: Do not allow any site to run JavaScript JIT'''
  scoring: scored
  profile:
  - Level 2 (L2) - High Security/Sensitive Data Environment (limited functionality)
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting specifies whether Microsoft Edge will run the v8 JavaScript engine with JIT (Just In Time)
    compiler. JIT is a complex pipeline of processes used to optimize JavaScript code for performance. Note: This policy can
    be overridden for specific URL patterns using the JavaScriptJitAllowedForSites (Allow JavaScript to use JIT on these sites)
    and JavaScriptJitBlockedForSites (Block JavaScript from using JIT on these sites) policies. The recommended state for
    this setting is: Enabled: Do not allow any site to run JavaScript JIT. This policy setting determines whether websites
    can ask for read access to the host operating system´s file system using the File System API. Policy options mapping:
    BlockFileSystemRead (2) = Don´t allow any site to request read access to files and directories via the File System API
    AskFileSystemRead (3) = Allow sites to ask the user to grant read access to files and directories via the File System
    API The recommended state for this setting is: Enabled: Don''t allow any site to request read access to files and directories.
    This policy setting specifies whether websites can ask for write access to the host operating system´s filesystem using
    the File System API. By default websites can ask for access. Users can change this setting. By setting this policy to
    (2), access is denied. Policy options mapping: BlockFileSystemWrite (2) = Don´t allow any site to request write access
    to files and directories AskFileSystemWrite (3) = Allow sites to ask the user to grant write access to files and directories
    The recommended state for this setting is: Enabled: Don''t allow any site to request write access to files and directories.
    This policy setting controls whether websites can access connected Bluetooth devices. The recommended state for this setting
    is: Enabled: Do not allow any site to request access to Bluetooth devices via the Web Bluetooth API. This policy setting
    determines whether a website is able to ask for access to use the WebHID API. The WebHID API allows websites to access
    alternative auxiliary keyboards and exotic gamepads. The recommended state for this setting is: Enabled: Do not allow
    any site to request access to HID devices via the WebHID API. This policy setting controls whether websites can perform
    multiple downloads successively without user interaction. The recommended state for this setting is Enabled: Don´t allow
    any website to perform automatic downloads.'
  rationale: 'Microsoft''s research has revealed that attackers usually target the JavaScript engine called “Just-In-Time
    (JIT) compilation” to hack web browsers. Disabling the JavaScript just-in-time (JIT) compiler prevents attackers from
    hacking into systems that Microsoft Edge uses. There is a large category of attack vectors that are opened up by allowing
    web applications access to files. By setting this policy to Enabled: Don''t allow any site to request read access to files
    and directories implements additional protections to safeguard against accidental sharing of sensitive information contained
    in locals files. There is a large category of attack vectors that are opened up by allowing web applications access to
    files. By setting this policy to Enabled: Don''t allow any site to request write access to files and directories implements
    additional protection to safeguard against accidental sharing of sensitive information contained in locals files. Web
    Bluetooth could potentially be used for attacks that may bypass other controls regarding connected Bluetooth hardware
    including microphones, cameras, and other devices which information could be gathered from or inappropriately utilzed.
    Disabling the WebHID API prevents HID peripherals from exposing powerful functionality that should not be made accessible
    to the page without explicit consent. For instance, a HID peripheral may have sensors that allow it to collect information
    about its surroundings; a device may store private information that should not be revealed or overwritten. Operating systems
    typically do not restrict access to HID devices from applications, and this access can occasionally be abused to damage
    the device or corrupt the data stored on it. Allowing websites to perform automatic downloads puts your system at risk
    as it will be easier to unintentionally download malicious files and executables.'
  impact: Disabling the JavaScript JIT will mean that Microsoft Edge may render web content more slowly, and may also disable
    parts of JavaScript including WebAssembly. Users may experience slower rendering of web content. Users with creative roles
    that require the File System API access permission to read files for photo, video, and text editors or for creating integrated
    development environments will need additional permissions granted based on their role. Users with creative roles that
    require the File System API access permission to write files for photo, video, and text editors or for creating integrated
    development environments will need additional permissions granted based on their role. Websites will be unable to utilize
    connected Bluetooth devices via the API, this includes web cameras, microphones, and other USB devices. WebHID describes
    a wide array of devices that could be supported through HID, including virtual reality controls, flight simulators, medical
    equipment, and more. Disabling WebHID would require additional drivers or modification to enable support for approved
    devices. Websites will be able to perform automatic downloads.
  references:
  - 1. https://www.onmsft.com/news/microsoft-edges-super-duper-secure-modeaddresses-javascript-vulnerabilities-in-a-brand-new-way
  - 1. https://docs.microsoft.com/en-us/microsoft-edge/progressive-web-appschromium/how-to/handle-files
  - 1. https://docs.microsoft.com/en-us/microsoft-edge/progressive-web-appschromium/how-to/handle-files
  - 1. https://docs.microsoft.com/DeployEdge/microsoft-edgepolicies#defaultwebbluetoothguardsetting
  - 1. https://docs.microsoft.com/en-us/deployedge/microsoft-edgepolicies#defaultwebhidguardsetting
  - 1. https://learn.microsoft.com/en-us/DeployEdge/microsoft-edgepolicies#defaultautomaticDownloadsSetting
  page_start: 26
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

