    to remain active, including any session cookies. An open background process displays an icon in the system tray and can
    always be closed from there. The recommended state for this setting is: Disabled. This policy setting controls whether
    Microsoft Edge uses the Experimentation and Configuration Service to deploy the Experimentation and Configuration payload
    which consists of a list of early in development features that Microsoft is enabling for testing and feedback. The recommended
    state for this setting is: Enabled: Disable communication with the Experimentation and Configuration Service.'
  rationale: Allowing processes from the browser to run in the background could allow a malicious script or code to continue
    running even once the browser windows has been closed. This setting allows feedback (data) to be sent back to a third-party
    for testing of development features for Microsoft Edge, and can also deliver a payload that contains a list of actions
    to take on certain domains for compatibility reasons.
  impact: The browser will close its processes and will not continue running as a background process. Data will not be sent
    back to a third-party and payloads will not be delivered.
