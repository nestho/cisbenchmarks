- id: 1.14.1
  title: (L1) Ensure 'Enable startup boost' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting allows Microsoft Edge processes to start at OS sign-in and restart in background after
    the last browser window is closed. If Microsoft Edge is running in background mode, the browser might not close when the
    last window is closed, and the browser won´t be restarted in background when the window closes. See the BackgroundModeEnabled
    (Continue running background apps after Microsoft Edge closes) policy for information about what happens after configuring
    Microsoft Edge background mode behavior. Note: The startup boost policy may initially be configured off or on by the user;
    the user can configure its behavior in edge://settings/system. The recommended state for this setting is: Disabled. This
    policy setting controls whether insecure websites are allowed to make requests to more private network endpoints. A network
    endpoint is more private than another if: 1. Its IP address is localhost and the other is not. 2. Its IP address is private
    and the other is public. In the future, depending on spec evolution, this policy might apply to all cross-origin requests
    directed at private IPs or localhost. A website is deemed secure if it meets the definition of a secure context in https://developer.mozilla.org/en-US/docs/Web/Security/Secure_Contexts.
    Otherwise, it will be treated as an insecure context. Note: This policy relates to the Private Network Access specification.
    See https://wicg.github.io/private-network-access/ for more details. Note #2: If this policy is not configured or set
    to Disabled, the default behavior for requests from insecure contexts to more-private network endpoints will depend on
    the user´s personal configuration for the BlockInsecurePrivateNetworkRequests feature, which may be set by a field trial
    or on the command line. The recommended state for this setting is: Disabled.'
  rationale: 'Allowing processes from the browser to run in the background could allow a malicious script or code to continue
    running once the browser windows has been closed. Allowing public internet sites to “peek” behind your firewall by using
    the user’s browser to mix intranet resources into internet-delivered pages represents a dangerous attack surface. The
    baseline requires enforcement of the new browser restriction that any such intranet requests are blocked if the internet
    page was delivered over insecure HTTP. Note: If for some reason you need to permit insecure cross-network requests for
    legacy sites, you can configure temporary exceptions in Allow the listed sites to make requests to more-private network
    endpoints from insecure contexts.'
  impact: Users will experience normal browser start-up times which may seem slow in comparison to Startup boost. Users will
    be unable to allow non-secure public contexts to request resources from private addresses.
  references:
  - 1. https://support.microsoft.com/en-us/topic/get-help-with-startup-boost-ebef73ed5c72-462f-8726-512782c5e442
  - 2. https://docs.microsoft.com/en-us/deployedge/microsoft-edgepolicies#startupboostenabled
