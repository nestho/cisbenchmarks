- id: '1.113'
  title: (L1) Ensure 'Show the Reload in Internet Explorer mode button in the toolbar' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting shows the Reload in Internet Explorer mode button in the toolbar. IE Mode in Microsoft
    Edge allows organizations that still need Internet Explorer 11, (which is not supported) for backward compatibility with
    existing websites. Note: The button will only be shown on the toolbar when the InternetExplorerIntegrationReloadInIEModeAllowed
    (Allow unconfigured sites to be reloaded in Internet Explorer mode) policy is enabled (which is set to disabled in the
    benchmark). The recommended state for this setting is: Disabled. This policy setting specifies whether SharedArrayBuffers
    can be used in a non-crossorigin-isolated context. A SharedArrayBuffer is a binary data buffer that can be used to create
    views on shared memory. SharedArrayBuffers have a memory access vulnerability in several popular CPUs. The recommended
    state for this setting is: Disabled.'
  rationale: Internet Explorer is officially retired and unsupported. Allowing browsers to reconfigure into Internet Explorer
    mode could open an organization up to malicious sites due to its lack of support for modern security features. Disabling
    this policy prevents attackers from being able to exploit memory access vulnerabilities found in popular CPUs.
  impact: Users will not be able to see or use the Internet Explorer Mode toolbar. Users may experience slightly slower loading
    of webpages.
