  description: This policy setting controls whether users will have the ability to activate the standalone sidebar. The standalone
    sidebar is an optional mode for the sidebar in Microsoft Edge and uses Bing AI. When this mode is activated by a user,
    the sidebar appears in a fixed position on the Microsoft Windows desktop and is hidden from the browser application frame.
    The recommended state for this setting is Disabled.
  rationale: Microsoft Edge determines what data to send to Bing AI based on the user's query and their consent to share data
    with Microsoft. This could allow data to be transmitted to a third-party cloud service. This could lead to sensitive data
    being exposed. Bing AI offers various features, such as summarizing financial reports, comparing financials of different
    companies, and aiding users in creating and editing content which could also lead to sensitive data being exposed.
  impact: Users will not be able to access the HubsSidebarEnabled (Show Hubs Sidebar) and it will also prevent them from accessing
    standalone sidebar and using the Bing AI feature.
