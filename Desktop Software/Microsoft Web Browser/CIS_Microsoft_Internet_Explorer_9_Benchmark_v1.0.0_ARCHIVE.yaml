- id: '1.6'
  title: Set 'Select SmartScreen Filter mode for Internet Explorer 9' to 'Enabled:On'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting allows the user to enable the SmartScreen Filter, which will warn if the Web site being
    visited is known for fraudulent attempts to gather personal information through "phishing," or is known to host malware.
    If you enable this policy setting, the user will not be prompted to enable the SmartScreen Filter. You must specify which
    mode the SmartScreen Filter uses: on, or off. If the feature is on, all website addresses not contained on the filter''s
    allow list will be sent automatically to Microsoft without prompting the user. If the feature is off or you do not configure
    this policy setting, the user will be prompted to 18 | P a g e decide the mode of operation for the SmartScreen Filter
    during the first run experience. The recommended state for this setting is: Enabled:On.'
  rationale: This setting is important from a security perspective because Microsoft has extensive data illustrating the positive
    impact the SmartScreen filter has had on reducing the risk of malware infection via visiting malicious websites.
  impact: 'If you enable this policy setting, the user will not be prompted to enable the SmartScreen Filter. You must specify
    which mode the SmartScreen Filter uses: on, or off. If the feature is on, all website addresses not contained on the filter''s
    allow list will be sent automatically to Microsoft without prompting the user. If the feature is off or you do not configure
    this policy setting, the user will be prompted to decide the mode of operation for the SmartScreen Filter during the first
    run experience.'
  references:
  - 1. CCE-17268-4
  page_start: 18
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

