  - Level 1
  description: 'Internet Explorer allows scripts to programmatically open, resize, and reposition various types of windows.
    Often, disreputable Web sites resize windows to either hide other windows or force you to interact with a window that
    contains malicious code. The recommended state for this setting is: Enabled.'
  rationale: The Internet Explorer Processes (Scripted Window Security Restrictions) setting restricts pop-up windows and
    does not allow scripts to display windows in which the title and status bars are not visible to the user or that hide
    other windows' title and status bars. When enabled, this policy setting help make it difficult for malicious Web sites
    to control your Internet Explorer windows or fool users into clicking the wrong window. 40 | P a g e
