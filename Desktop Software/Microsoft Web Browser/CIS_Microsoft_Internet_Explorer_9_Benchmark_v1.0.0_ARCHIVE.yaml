- id: '5.1'
  title: Set 'Secure Protocol combinations' to 'Enabled:Only use TLS 1.0'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting allows you to turn off support for Transport Layer Security (TLS) 1.0, TLS 1.1, TLS 1.2,
    Secure Sockets Layer (SSL) 2.0 or SSL 3.0 in the browser. TLS and SSL are protocols for protecting communication between
    the browser and the target server. When the browser attempts to set up a protected communication with the target server,
    the browser and server negotiate which protocol and version to use. The browser and server attempt to match each other''s
    list of supported protocols and versions and pick the most preferred match. If you enable this policy setting, the browser
    will or will not negotiate an encryption tunnel with the encryption methods you select through the drop down list. If
    you disable or do not configure this policy setting, the user can select which encryption method the browser will support.
    NOTE: SSL 2.0 is off by default. SSL 2.0 is an outdated 28 | P a g e security protocol, and enabling SSL 2.0 impairs the
    performance and functionality of TLS 1.0. The recommended state for this setting is: Enabled:Only use TLS 1.0.'
  rationale: The allowed encryption protocols determines the possible encryption types that can be used. Preventing the use
    of older protocols decreases vulnerability.
  impact: Determines the encryption protocols that may be used. One of the designated protocols needs to be active on both
    sides of the connection for encryption to function correctly.
  references:
  - 1. CCE-17396-3
  page_start: 28
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

    to Enabled.

    Computer Configuration\Administrative Templates\Windows Components\Internet

    Explorer\Internet Control Panel\Advanced Page\Turn off Encryption Support\Turn off

    Encryption Support

    Then set the Secure Protocol combinations option to Only use TLS 1.0.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: '5.2'
  title: Set 'Check for server certificate revocation' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting allows you to manage whether Internet Explorer will check revocation status of servers''
    certificates. Certificates are revoked when they have been compromised or are no longer valid, and this option protects
    users from submitting confidential data to a site that may be fraudulent or not secure. If you enable this policy setting,
    Internet Explorer will check to see if server certificates 29 | P a g e have been revoked. If you disable this policy
    setting, Internet Explorer will not check server certificates to see if they have been revoked. If you do not configure
    this policy setting, Internet Explorer will not check server certificates to see if they have been revoked. The recommended
    state for this setting is: Enabled.'
  rationale: Certificates are revoked when they have been compromised or are no longer valid. If Internet Explorer does not
    check for the status of a certificate, users and this option protects users could inadvertently submit confidential data
    to a site that may be fraudulent or not secure.
  impact: If you enable this policy setting, Internet Explorer will check to see if server certificates have been revoked.
