- id: '3.2'
  title: Configure 'Prevent Deleting Temporary Internet Files'
  scoring: scored
  profile:
  - Level 1
  description: This policy setting is used to prevent users from deleting temporary Internet files. This feature is available
    in the Delete Browsing History dialog box. If you enable this policy setting, temporary Internet files will be preserved
    when the user clicks Delete. If you disable this policy setting, temporary Internet files will be deleted when the user
    clicks Delete. If you do not configure this policy setting, the user will be able to choose whether to delete or preserve
    temporary Internet files when the user clicks Delete. If the Turn off Delete Browsing History functionality policy is
    enabled, this policy is enabled by default. Configure this setting in a manner that is consistent with the security and
    operational requirements of your organization. This policy setting prevents users from performing the "Delete Browsing
    History" action in Internet Explorer. Configure this setting in a manner that is consistent with the security and operational
    requirements of your organization. This policy setting allows you to manage whether Internet Explorer checks the Internet
    for newer versions. When Internet Explorer is set to do this, the checks occur approximately every 30 days, and users
    are prompted to install new versions as they become available. Configure this setting in a manner that is consistent with
    the security and operational requirements of your organization.
  rationale: If a user is suspected of visiting unauthorized website the information stored in the Temporary Internet Files
    folder could be useful in verifying where he or she went online. 25 | P a g e If users can delete their browsing history
    it will be easier for them to hide evidence if they have be visiting unauthorized sites. If you enable this policy setting,
    Internet Explorer checks the Internet for a new version approximately every 30 days and prompts the user to download new
    versions when they are available. Newer versions might not comply to the Internet Explorer version requirements of your
    organization. 27 | P a g e
  impact: If you enable this policy setting, users will not be able to delete temporary Internet files. If you disable or
    do not configure this policy setting, users will be able to delete temporary Internet files. If you enable this policy
    setting, users cannot perform the "Delete Browsing History" action in Internet Options for Internet Explorer 7. If you
    disable or do not configure this policy setting, users can perform the "Delete Browsing History" action in Internet Options
    for Internet Explorer 7. If you enable this policy setting, Internet Explorer checks the Internet for a new version approximately
    every 30 days and prompts the user to download new versions when they are available. If you disable this policy setting,
    Internet Explorer does not check the Internet for new versions of the browser, so does not prompt users to install them.
  references:
