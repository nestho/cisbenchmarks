- id: '1.5'
  title: Set 'Disable Save this program to disk option' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting prevents users from saving a program or file that Internet Explorer has downloaded to
    the hard disk. If you enable this policy setting, users cannot save programs to disk with the Save this program to disk
    option. The program file will not download, and the user is informed that the command is not available. The recommended
    state for this setting is: Enabled.'
  rationale: Users could download and execute hostile code from Web sites. 17 | P a g e
