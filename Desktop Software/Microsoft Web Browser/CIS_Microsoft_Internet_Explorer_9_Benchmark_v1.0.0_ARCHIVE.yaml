    it originates. The recommended state for this setting is: Enabled.'
  rationale: These restrictions depend on the location of the Web page (such as Internet zone, Intranet zone, or Local Machine
    zone). Web pages on a local computer have the fewest security restrictions and reside in the Local Machine zone, malicious
    Web pages may attempt to elevate themselves from their current zone into another zone with higher privileges. 39 | P a
    g e
  impact: If you enable the Internet Explorer Processes (Zone Elevation Protection) setting, any zone can be protected from
    zone elevation by Internet Explorer processes. This approach helps prevent content that runs in one zone from gaining
    the elevated privileges of another zone. If you disable this policy setting, no zone receives such protection for Internet
