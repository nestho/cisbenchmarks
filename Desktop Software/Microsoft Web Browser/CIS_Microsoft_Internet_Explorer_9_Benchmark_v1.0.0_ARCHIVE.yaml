    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: '2.1'
  title: Set 'Disable Per-User Installation of ActiveX Controls' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting allows you to disable the per-user installation of ActiveX controls. This policy only
    affects ActiveX controls that can be installed on a per-user basis. If you enable this policy setting, ActiveX controls
    cannot be installed on a per-user basis. If you disable or do not configure this policy setting, ActiveX controls can
    be installed on a per-user basis. Configure this setting in a manner that is consistent with the security and operational
    requirements of your organization. The recommended state for this setting is: Enabled.'
  rationale: Per-user installation of ActiveX controls is a convenient feature that many organizations may want to leverage.
    One benefit is that even if the user installs a control that includes a malicious payload its impact will be limited to
    the privileges of the user who installed it. Nevertheless, restricting the installation of ActiveX controls to administrators
    and using the ActiveX Installer Service or some other centralized software deployment tool is a more effective method
    for avoiding malware.
  impact: If you enable this policy setting, ActiveX controls cannot be installed on a per-user basis. If you disable or do
    not configure this policy setting, ActiveX controls can be installed on a per-user basis.
  references:
  - 1. CCE-17302-1
  page_start: 20
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Internet

    Explorer\Security\ActiveX\BlockNonAdminActiveXInstall'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path

    to Enabled.

    20 | P a g e

    Computer Configuration\Administrative Templates\Windows Components\Internet

    Explorer\Prevent per-user installation of ActiveX controls'
  checks:
