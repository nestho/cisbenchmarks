- id: '7.4'
  title: Set 'Consistent Mime Handling' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'Internet Explorer uses Multipurpose Internet Mail Extensions (MIME) data to determine file handling procedures
    for files that are received through a Web server. The Consistent MIME Handling setting determines whether Internet Explorer
    requires that all file type information that is provided by Web servers be consistent. For example, if the MIME type of
    a file is text/plain but the MIME data indicates that the file is really an executable file, Internet Explorer changes
    its extension to reflect this executable status. This capability helps ensure that executable code cannot masquerade as
    other types of data that may be trusted. The recommended state for this setting is: Enabled.'
  rationale: MIME file type spoofing is a potential threat to your organization. You should ensure that these files are consistent
    and properly labeled to help prevent malicious file downloads 38 | P a g e that may infect your network. Note This policy
    setting works in conjunction with, but does not replace, the MIME Sniffing Safety Features settings.
  impact: If you enable this policy setting, Internet Explorer examines all received files and enforces consistent MIME data
    for them. If you disable or do not configure this policy setting, Internet Explorer does not require consistent MIME data
    for all received files and will use the MIME data that is provided by the file.
  references:
  - 1. CCE-17347-6
  page_start: 38
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

