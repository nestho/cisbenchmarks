- id: '3.1'
  title: Configure 'Prevent Deleting Cookies'
  scoring: scored
  profile:
  - Level 1
  description: This policy setting is used to prevent users from deleting cookies. This feature is available in the Delete
    Browsing History dialog box. If you enable this policy setting, cookies will be preserved when the user clicks Delete.
    If you disable this policy setting, cookies will be deleted when the user clicks Delete. If you do not configure this
    policy setting, the user will be able to choose whether to delete or preserve cookies when the user clicks Delete. If
    the "Turn off Delete Browsing History functionality" policy is enabled, this policy is enabled by default. Configure this
    setting in a manner that is consistent with the security and operational requirements of your organization.
  rationale: If a user is suspected of visiting unauthorized website the information stored in the data cookies could be useful
    in verifying where he or she went online. 24 | P a g e
  impact: If you enable this policy setting, users will not be able to delete cookies. If you disable or do not configure
    this policy setting, users will be able to delete cookies.
  references:
  - 1. CCE-16713-0
  page_start: 24
