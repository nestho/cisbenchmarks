- id: '2.3'
  title: Set 'Turn off ActiveX opt-in prompt' to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting allows you to turn off the ActiveX opt-in prompt. The ActiveX opt-in prevents Web sites
    from loading any COM object without prior approval. If a page attempts to load a COM object that Internet Explorer has
    not used before, an Information bar will appear asking the user for approval. If you enable this policy setting, the ActiveX
    opt-in prompt will not appear. Internet Explorer does not ask the user for permission to load a control, and will load
    the ActiveX if it passes all other internal security checks. If you disable or do not configure this policy setting, the
    ActiveX opt-In prompt will appear. The recommended state for this setting is: Disabled.'
  rationale: If the user were to enable this setting the ActiveX opt-in prompt would be disabled and malicious ActiveX controls
    could be executed without the user's knowledge.
  impact: Enabling this setting would allow the possibility of malicious ActiveX controls to be executed without the user's
    knowledge.
  references:
  - 1. CCE-17469-8
  page_start: 22
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows\CurrentVersion\Polices\Ext\NoFi

    rsttimeprompt

    22 | P a g e'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

    to Disabled.

    Computer Configuration\Administrative Templates\Windows Components\Internet

    Explorer\Turn off ActiveX opt-in prompt'
  checks:
