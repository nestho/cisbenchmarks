    severity: medium
- id: '2.2'
  title: Set 'Only use the ActiveX Installer Service for installation of ActiveX Controls' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting allows you to specify how ActiveX controls are installed. If you enable this policy setting,
    ActiveX controls will only install if the ActiveX Installer Service is present and has been configured to allow ActiveX
    controls to be installed. If you disable or do not configure this policy setting, ActiveX controls, including per-user
    controls, will be installed using the standard installation process. The recommended state for this setting is: Enabled.'
  rationale: Installing ActiveX controls using the standard installation process is less secure than using the ActiveX Installer
    Service.
  impact: If you enable this setting the ActiveX Controller Service must be configured correctly.
  references:
  - 1. CCE-17416-9
