  - Level 1
  description: 'This policy setting reduces attack surface area because it blocks the seldom-used MK protocol. Some older
    Web applications use the MK protocol to retrieve information from Microsoft Help files and compressed files. Microsoft
    recommends that you block the MK protocol unless you specifically need it in your environment. The recommended state for
    this setting is: Enabled.'
  rationale: Because the MK protocol is not widely used, it should be blocked wherever it is not needed. 42 | P a g e
