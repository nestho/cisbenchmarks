controls:
- id: '1.1'
  title: Set 'Allow software to run or install even if the signature is invalid' to 'Disabled'
  scoring: scored
  profile:
  - Level 1
  description: 'Microsoft ActiveX'' controls and file downloads often have digital signatures attached that help certify the
    file''s integrity and the identity of the signer (creator) of the software. Such signatures help ensure that unmodified
    software is downloaded and that you can identify active signers to determine whether you trust them enough to run their
    software. The Allow software to run or install even if the signature is invalid setting allows you to manage whether downloaded
    software can be installed or run by users even though the signature is invalid. An invalid signature might indicate that
    someone has tampered with the file. If you enable this policy setting, users will be prompted to install or run files
    with an invalid signature. If you disable this policy setting, users cannot run or install files with an invalid signature.
    Note Some legitimate software and controls may have an invalid signature and still be OK. You should carefully test such
    software in isolation before you allow it to be used on your organization''s network. The recommended state for this setting
    is: Disabled.'
  rationale: Microsoft ActiveX controls and file downloads often have digital signatures attached that certify the file's
    integrity and the identity of the signer (creator) of the software. Such signatures help ensure that unmodified software
    is downloaded and that you can positively identify the signer to determine whether you trust them enough to run their
    software. The validity of unsigned code cannot be ascertained.
  impact: Some legitimate software and controls may have an invalid signature. You should carefully test such software in
    isolation before it is allowed to be used on your organization's network.
  references:
  - 1. CCE-17400-3
  page_start: 13
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Internet

    Explorer\Download\RunInvalidSignatures

    13 | P a g e'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting

    to Disabled.

    Computer Configuration\Administrative Templates\Windows Components\Internet

    Explorer\Internet Control Panel\Advanced Page\Allow software to run or install even if

    the signature is invalid'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Internet

      Explorer\Download\RunInvalidSignatures

      13 | P a g e'
    severity: medium
- id: '1.2'
  title: Set 'Prevent Bypassing SmartScreen Filter Warnings' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'The SmartScreen Filter prevents users from navigating to and downloading from sites known to host malicious
    content, including Phishing or malicious software attacks. If you enable this policy setting, the user is not permitted
    to navigate to sites identified as unsafe by the SmartScreen Filter. If you disable this policy setting or do not configure
    it, the user can ignore SmartScreen Filter warnings and navigate to unsafe sites. The recommended state for this setting
    is: Enabled. The SmartScreen Filter warns users about executable files that are not commonly downloaded from the Internet
    by Internet Explorer users. If you enable this policy setting, the user is blocked by SmartScreen Filter warnings. If
    you disable this policy setting or do not configure it, the user can ignore SmartScreen Filter warnings. The recommended
    state for this setting is: Enabled. This policy setting allows you to manage whether users have the ability to allow or
    deny add-ons through Add-On Manager. If you enable this policy setting, users cannot enable or disable add-ons through
    Add-On Manager. The only exception occurs if an add-on has been specifically entered into the ''Add-On List'' policy setting
    in such a way as to allow users to continue to manage the add-on. In this case, the user can still manage the add-on through
    the Add-On Manager. If you disable or do not configure this policy setting, the appropriate controls in the Add-On Manager
    will be available to the user. Configure this setting in a manner that is consistent with the security and operational
    requirements of your organization. 16 | P a g e'
  rationale: If this setting is enabled and the SmartScreen Filter is active, the user can ignore a SmartScreen Filter warning
    and navigate to a site determined to be unsafe. This setting is important from a security perspective because Microsoft
    has extensive data illustrating the positive impact the SmartScreen filter has had on reducing the risk of malware infection
    via visiting malicious websites. 15 | P a g e Users often choose to install add-ons that are not permitted by an organization's
    security policy. Such add-ons can pose a significant security and privacy risk to your network.
  impact: Users cannot navigate to sites detected as unsafe by the SmartScreen Filter. If you enable this policy setting,
    the user is blocked by SmartScreen Filter warnings. If you disable this policy setting or do not configure it, the user
    can ignore SmartScreen Filter warnings. When the Do not allow users to enable or disable add-ons setting is enabled, users
    will not be able to enable or disable their own Internet Explorer add-ons. If your organization uses add-ons, this configuration
    may affect their ability to work.
  references:
