    to be initialized and scripted, ignoring the Script ActiveX controls marked safe for scripting option. If you enable this
    policy setting and select Prompt in the drop-down box, users are queried whether to allow the control to be loaded with
    parameters or scripted. If you disable this policy setting, ActiveX controls that cannot be made safe are not loaded with
    parameters or scripted. If you do not configure this policy setting, ActiveX controls that cannot be made safe are not
    loaded with parameters or scripted. The recommended state for this setting is: Enabled:Disable.'
