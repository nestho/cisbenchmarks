    user will not be able to configure proxy settings. If you disable or do not configure this policy setting, the user can
    configure proxy settings. The recommended state for this setting is: Enabled. This policy setting removes a user''s ability
    to change automatically configured settings. Administrators use automatic configuration to update browser settings periodically.
    If you 168 | P a g e enable this policy setting, the automatic configuration settings are dimmed in Internet Explorer.
