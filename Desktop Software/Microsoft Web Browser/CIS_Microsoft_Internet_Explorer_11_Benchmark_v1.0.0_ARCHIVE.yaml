    removes a user''s ability to change settings that are configured through Group Policy. To view the LAN Settings dialog
    box 1. Open the Internet Options dialog box, and click the Connections tab. 2. Click the LAN Settings button to view the
    settings. Note: The Disable the Connections page setting removes the Connections tab from Internet Explorer in Control
    Panel and takes precedence over this Disable changing Automatic Configuration settings configuration option. If the former
    setting is enabled, the latter setting is ignored. The Disable the Connections page setting is located in \User Configuration
    \Administrative Templates\Windows Components\Internet Explorer\Internet Control Panel in the Group Policy Object Editor.
    Configure this setting in a manner that is consistent with security and operational requirements of your organization.'
  rationale: Enabling this policy setting will prevent users from changing their proxy settings and potentially bypassing
    restrictions placed on Internet Explorer security zones, see http://msdn.microsoft.com/en-us/library/bb250483(v=VS.85).aspx
