    in the Trusted Sites and Restricted Sites zones, as well as alter settings in the Local Intranet zone. Note: If you enable
    the Disable the Security page setting (located in \User Configuration\ Administrative Templates\Windows Components\Internet
    Explorer\Internet Control Panel), the Security tab is removed from the interface and the Disable setting takes precedence
    over this Security Zones: setting. The recommended state for this setting is: Enabled.'
  rationale: If you do not configure this policy setting, users will be able to add or remove sites from the Trusted Sites
    and Restricted Sites zones at will and change settings in the Local Intranet zone. This configuration could allow sites
    that host malicious mobile code to be added to these zones, which users could execute.
  impact: Users will not be able to change site management settings for security zones that have been established by the administrator.
    When users need to add or remove sites from these Internet Explorer security zones, an administrator will have to configure
    them. Intranet zone. This may impact some business applications if users access them using a URL that appears to be from
    the Internet. For example, in order to utilize all of the capabilities of Infopath Internet Explorer needs to run the
    content in the Intranet or Trusted Sites zone. However, if URL provided is an IP address or a fully qualified domain name
