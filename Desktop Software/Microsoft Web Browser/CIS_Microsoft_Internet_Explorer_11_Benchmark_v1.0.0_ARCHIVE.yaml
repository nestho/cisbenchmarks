    this policy setting, the MIME Sniffing Safety Feature will not apply in this zone. The security zone will run without
    the added layer of security provided by this feature. If you disable this policy setting, the actions that may be harmful
    cannot run; this Internet Explorer security feature will be turned on in this zone, as dictated by the feature control
    setting for the process. If you do not configure this policy setting, the actions that may be harmful cannot run; this
