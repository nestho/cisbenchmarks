- id: '9.12'
  title: Set 'Turn off Crash Detection' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting allows you to manage the crash detection feature of add-on management in Internet Explorer.
    If you enable this policy setting, a crash in Internet Explorer will be similar to one on a computer that runs Windows
    XP Professional with Service Pack 1 (SP1) or earlier: Windows Error Reporting will be invoked. If you disable this policy
    setting, the crash detection feature in add-on management will be functional. If you experience frequent repeated crashes
    and need to report them for follow-up troubleshooting, you could temporarily configure the policy setting to Disabled.
    The recommended state for this setting is: Enabled.'
  rationale: A crash report might contain sensitive information from the computer's memory.
  impact: Information about crashes that are caused by Internet Explorer add-ons will not be reported to Microsoft. If you
    experience frequent repeated crashes and need to report them to help troubleshoot the problem, the setting should temporarily
    be changed to Disabled.
