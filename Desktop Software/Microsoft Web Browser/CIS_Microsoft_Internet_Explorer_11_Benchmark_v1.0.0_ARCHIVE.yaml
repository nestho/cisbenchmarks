controls:
- id: '1.1'
  title: Set 'Turn on Enhanced Protected Mode' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'Enhanced Protected Mode provides additional protection against malicious websites by using 64-bit processes
    on 64-bit versions of Windows. For computers running Windows 8 and above, Enhanced Protected Mode also limits the locations
    Internet Explorer can read from in the registry and the file system. If you enable this policy setting, Enhanced Protected
    Mode will be turned on. Any zone that has Protected Mode enabled will use Enhanced Protected Mode. Users will not be able
    to disable Enhanced Protected Mode. If you disable this policy setting, Enhanced Protected Mode will be turned off. Any
    zone that has Protected Mode enabled will use the version of Protected Mode introduced in Internet Explorer 7 for Windows
    Vista. If you do not configure this policy, users will be able to turn on or turn off Enhanced Protected Mode on the Advanced
    tab of the Internet Options dialog. The recommended state for this setting is: Enabled.'
  rationale: Enhanced Protected Mode provides additional protection against malicious websites by using 64-bit processes on
    64-bit versions of Windows. For computers running Windows 8 and above, Enhanced Protected Mode also limits the locations
    Internet Explorer can read from in the registry and the file system.
  impact: If you enable this policy setting, Enhanced Protected Mode will be turned on. Any zone that has Protected Mode enabled
    will use Enhanced Protected Mode. Users will not be able to disable Enhanced Protected Mode. If you disable this policy
    setting, Enhanced Protected Mode will be turned off. Any zone that has Protected Mode enabled will use the version of
    Protected Mode introduced in Internet Explorer 7 for Windows Vista. If you do not configure this policy, users will be
    able to turn on or turn off Enhanced Protected Mode on the Advanced tab of the Internet Options dialog.
  references: []
