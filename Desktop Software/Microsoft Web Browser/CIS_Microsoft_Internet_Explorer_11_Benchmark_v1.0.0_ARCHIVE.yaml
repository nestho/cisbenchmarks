  title: Set 'Logon options' to 'Enabled:Anonymous logon'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting allows you to manage settings for logon options. If you enable this policy setting, you
    can choose from the following logon options: Anonymous logon disables HTTP authentication and uses the guest account only
    for the Common Internet File System (CIFS) protocol. Prompt for user name and password queries users for user IDs and
    passwords. After a user is queried, these values can be used silently for the remainder of the session. Automatic logon
    only in Intranet zone queries users for user IDs and passwords in other zones. After a user is queried, these values can
    be used silently for the remainder of the session. Automatic logon with current user name and password attempts logon
    using Windows NT Challenge Response (also known as NTLM authentication). If Windows NT Challenge Response is supported
    by the server, the logon uses the user''s network user name and password for logon. If Windows NT Challenge Response is
    not supported by the server, the user is queried to provide the user name and password. If you disable this policy setting,
    logon is set to Automatic logon only in Intranet zone. If you do not configure this policy setting, logon is set to Automatic
    logon only in Intranet zone. The recommended state for this setting is: Enabled:Anonymous logon. 122 | P a g e'
  rationale: Users could submit credentials to servers operated by malicious people who could then attempt to connect to legitimate
    servers with those captured credentials.
  impact: Anonymous logon disables HTTP authentication and uses the guest account, which means that users will be unable to
    connect to sites in this security zone that require authentication.
