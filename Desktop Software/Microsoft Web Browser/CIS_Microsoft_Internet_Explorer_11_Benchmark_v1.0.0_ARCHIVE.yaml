  title: Set 'Turn on 64-bit tab processes when running in Enhanced Protected Mode on 64-bit versions of Windows' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: This policy setting determines whether Internet Explorer 11 uses 64-bit processes (for greater security) or
    32-bit processes (for greater compatibility) when running in Enhanced Protected Mode on 64-bit versions of Windows. If
    you enable this policy setting, Internet Explorer 11 will use 64-bit tab processes when running in Enhanced Protected
    Mode on 64-bit versions of Windows. If you disable this policy setting, Internet Explorer 11 will use 32-bit tab processes
    when running in Enhanced Protected Mode on 64-bit versions of Windows. If you don't configure this policy setting, users
    can turn this feature on or off using Internet Explorer settings. This feature is turned off by default.
  rationale: Enabling 64-bit tab processes will improve the efficacy of exploit mitigations, such as Address Space Layout
    Randomization (ASLR).
  impact: 'Some ActiveX controls and toolbars may not be available when 64-bit processes are used. 177 | P a g e Appendix:
    Change History Date Version Changes for this version 12-01-2014 1.0.0 Initial Release'
