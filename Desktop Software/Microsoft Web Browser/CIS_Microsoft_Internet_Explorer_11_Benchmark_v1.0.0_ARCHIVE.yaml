- id: '2.2'
  title: Set 'Specify use of ActiveX Installer Service for installation of ActiveX controls' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting allows you to specify how ActiveX controls are installed. If you enable this policy setting,
    ActiveX controls are installed only if the ActiveX Installer Service is present and has been configured to allow the installation
    of ActiveX controls. If you disable or do not configure this policy setting, ActiveX controls, including per-user controls,
    are installed through the standard installation process. The recommended state for this setting is: Enabled.'
  rationale: The ActiveX Installer Service can be a more secure method for deploying ActiveX controls needed for business
    purposes than allowing users to download and install them because organizations can ensure they are legitimate and scan
    them for malware prior to deployment.
  impact: 15 | P a g e If you enable this policy setting, ActiveX controls are installed only if the ActiveX Installer Service
    is present and has been configured to allow the installation of ActiveX controls. If you disable or do not configure this
    policy setting, ActiveX controls, including per-user controls, are installed through the standard installation process.
  references: []
