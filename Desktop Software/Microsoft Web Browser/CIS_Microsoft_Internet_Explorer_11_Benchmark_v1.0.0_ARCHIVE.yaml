- id: '2.1'
  title: Set 'Prevent per-user installation of ActiveX controls' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting allows you to prevent the installation of ActiveX controls on a per-user basis. If you
    enable this policy setting, ActiveX controls cannot be installed on a per-user basis. If you disable or do not configure
    this policy setting, ActiveX controls can be installed on a per-user basis. The recommended state for this setting is:
    Enabled.'
  rationale: Per-user installation of ActiveX controls is a convenient feature that many organizations may want to leverage.
    One benefit is that even if the user installs a control that includes a malicious payload its impact will be limited to
    the privileges of the user who installed it. Nevertheless, restricting the installation of ActiveX controls to administrators
    and using the ActiveX Installer Service or some other centralized software deployment tool is a more effective method
    for avoiding malware.
  impact: 14 | P a g e If you enable this policy setting, ActiveX controls cannot be installed on a per-user basis. If you
    disable or do not configure this policy setting, ActiveX controls can be installed on a per-user basis.
  references: []
  page_start: 14
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Internet

    Explorer\Security\ActiveX\BlockNonAdminActiveXInstall'
  remediation: 'To establish the recommended configuration via Group Policy, set the following UI path to

