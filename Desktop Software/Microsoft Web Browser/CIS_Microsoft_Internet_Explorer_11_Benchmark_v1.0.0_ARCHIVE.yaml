- id: '2.5'
  title: Set 'Do not allow ActiveX controls to run in Protected Mode when Enhanced Protected Mode is enabled' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting prevents ActiveX controls from running in Protected Mode when Enhanced Protected Mode
    is enabled. When a user has an ActiveX control installed that is not compatible with Enhanced Protected Mode and a website
    attempts to load the control, Internet Explorer notifies the user and gives the option to run the website in regular Protected
    Mode. This policy setting disables this notification and forces all websites to run in Enhanced Protected Mode. Enhanced
    Protected Mode provides additional protection against malicious websites by using 64-bit processes on 64-bit versions
    of Windows. For computers running Windows 8 and above, Enhanced Protected Mode also limits the locations Internet Explorer
    can read from in the registry and the file system. When Enhanced Protected Mode is enabled, and a user encounters a website
    that attempts to load an ActiveX control that is not compatible with Enhanced Protected Mode, Internet Explorer notifies
    the user and gives the option to disable Enhanced Protected Mode for that particular website. If you enable this policy
    setting, Internet Explorer will not give the user the option to disable Enhanced Protected Mode. All Protected Mode websites
    will run in Enhanced Protected Mode. 18 | P a g e If you disable or do not configure this policy setting, Internet Explorer
    notifies users and provides an option to run websites with incompatible ActiveX controls in regular Protected Mode. This
    is the default behavior. The recommended state for this setting is: Enabled. This policy setting prevents the user from
    deleting the history of websites that he or she has visited. This feature is available in the Delete Browsing History
    dialog box. If you enable this policy setting, websites that the user has visited are preserved when he or she clicks
    Delete. If you disable this policy setting, websites that the user has visited are deleted when he or she clicks Delete.
    If you do not configure this policy setting, the user can choose whether to delete or preserve visited websites when he
    or she clicks Delete. If the "Prevent access to Delete Browsing History" policy setting is enabled, this policy setting
    is enabled by default. Configure this setting in a manner that is consistent with security and operational requirements
    of your organization.'
  rationale: Enhanced Protected Mode provides additional protection against malicious websites by using 64-bit processes on
    64-bit versions of Windows. For computers running Windows 8 and above, Enhanced Protected Mode also limits the locations
    Internet Explorer can read from in the registry and the file system. If users can delete websites they have visited it
    will be easier for them to hide evidence that they have visited unauthorized sites.
  impact: When Enhanced Protected Mode is enabled, and a user encounters a website that attempts to load an ActiveX control
    that is not compatible with Enhanced Protected Mode, Internet Explorer notifies the user and gives the option to disable
    Enhanced Protected Mode for that particular website. If you enable this policy setting, Internet Explorer will not give
    the user the option to disable Enhanced Protected Mode. All Protected Mode websites will run in Enhanced Protected Mode.
    If you disable or do not configure this policy setting, Internet Explorer notifies users and provides an option to run
    websites with incompatible ActiveX controls in regular Protected Mode. This is the default behavior. 19 | P a g e 3 Browsing
    History 3.1 Configure 'Prevent deleting websites that the user has visited' (Not Scored) 20 | P a g e If you enable this
    policy setting, websites that the user has visited are preserved when he or she clicks Delete. If you disable this policy
    setting, websites that the user has visited are deleted when he or she clicks Delete. If you do not configure this policy
    setting, the user can choose whether to delete or preserve visited websites when he or she clicks Delete. If the "Prevent
    access to Delete Browsing History" policy setting is enabled, this policy setting is enabled by default.
  references: []
