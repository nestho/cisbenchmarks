- id: '3.3'
  title: Set 'Disable "Configuring History"' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: 'This setting specifies the number of days that Internet Explorer keeps track of the pages viewed in the History
    List. The recommended state for this setting is: Enabled.'
  rationale: If users can delete their browsing history it will be easier for them to hide evidence that they have visited
    unauthorized sites.
  impact: 22 | P a g e If you enable this policy setting, a user cannot set the number of days that Internet Explorer keeps
    track of the pages viewed in the History List. You must specify the number of days that Internet Explorer keeps track
    of the pages viewed in the History List. Users will not be able to delete browsing history. If you disable or do not configure
    this policy setting, a user can set the number of days that Internet Explorer keeps track of the pages viewed in the History
    List and has the freedom to Delete Browsing History.
  references: []
