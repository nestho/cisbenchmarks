    severity: medium
- id: '1.4'
  title: Set 'Prevent bypassing SmartScreen Filter warnings about files that are not commonly downloaded from the Internet'
    to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  description: '10 | P a g e This policy setting determines whether the user can bypass warnings from SmartScreen Filter.
    SmartScreen Filter warns the user about executable files that Internet Explorer users do not commonly download from the
    Internet. If you enable this policy setting, SmartScreen Filter warnings block the user. If you disable or do not configure
    this policy setting, the user can bypass SmartScreen Filter warnings. The recommended state for this setting is: Enabled.
    11 | P a g e This policy setting allows you to manage whether users have the ability to allow or deny add-ons through
    Add-On Manager. If you enable this policy setting, users cannot enable or disable add-ons through Add-On Manager. The
    only exception occurs if an add-on has been specifically entered into the ''Add-On List'' policy setting in such a way
    as to allow users to continue to manage the add-on. In this case, the user can still manage the add-on through the Add-On
    Manager. If you disable or do not configure this policy setting, the appropriate controls in the Add-On Manager will be
    available to the user. Configure this setting in a manner that is consistent with security and operational requirements
    of your organization.'
  rationale: The SmartScreen Filter prevents users from navigating to and downloading from sites known to host malicious content,
    including Phishing or malicious software attacks. Users often choose to install add-ons that are not permitted by an organization's
    security policy. Such add-ons can pose a significant security and privacy risk to your network.
  impact: If you enable this policy setting, the user is not permitted to navigate to sites identified as unsafe by the SmartScreen
    Filter. If you disable this policy setting or do not configure it, the user can ignore SmartScreen Filter warnings and
    navigate to unsafe sites. 1.5 Configure 'Do not allow users to enable or disable add-ons' (Not Scored) When the Do not
    allow users to enable or disable add-ons setting is enabled, users will not be able to enable or disable their own Internet
    Explorer add-ons. If your organization uses add-ons, this configuration may affect their ability to work.
  references: []
