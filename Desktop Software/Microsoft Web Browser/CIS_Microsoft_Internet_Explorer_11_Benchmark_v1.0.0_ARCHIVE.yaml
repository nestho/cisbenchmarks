  title: Configure 'Make proxy settings per-machine (rather than per-user)'
  scoring: scored
  profile:
  - Level 1
  description: 'Applies proxy settings to all users of the same computer. 165 | P a g e If you enable this policy, users cannot
    set user-specific proxy settings. They must use the zones created for all users of the computer. If you disable this policy
    or do not configure it, users of the same computer can establish their own proxy settings. This policy is intended to
    ensure that proxy settings apply uniformly to the same computer and do not vary from user to user. This setting does not
    work when 32-bit versions of Internet Explorer are running on 64-bit versions of Windows. See the Microsoft Knowledgebase
    article "You cannot access the Internet through a proxy server when you use a 32-bit version of Internet Explorer on a
    computer that is running a 64-bit version of Windows" for more information on the issue and a method to work around it:
    http://support.microsoft.com/kb/952031. Configure this setting in a manner that is consistent with security and operational
    requirements of your organization.'
