    the internal network that could potentially be utilized to breach and traverse a network. The end-user will receive a
    notification informing them that an update has been applied and that the browser must be restarted for the update to be
    completed. Once updates have been pushed by the organization it is pertinent that the update is applied as soon as possible.
    Enabling this notification will ensure that users restart their browser in a timely fashion.
  impact: None - this is the default behavior. When updates are applied by an organization the end-user will receive a notification
