    \ registry location with a\nREG_DWORD value of 2.\nHKLM\\SOFTWARE\\Policies\\Microsoft\\Edge:DefaultAutomaticDownloadsSetting"
  remediation: "To establish the recommended configuration via GP, set the following UI path to\nEnabled: Do not allow any\
