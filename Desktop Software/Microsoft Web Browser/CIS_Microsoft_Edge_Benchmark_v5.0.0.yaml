- id: 1.2.1
  title: Ensure 'Enable Google Cast' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 (L1) - General Use
  description: 'This policy setting determines whether Google Cast is available to users. The recommended state for this setting
    is: Disabled. Note: When this setting is set to Disabled the Show the cast icon in the toolbar setting is ignored as the
    icon is removed. This policy configures the level of access users have when managing CA certificates in Microsoft Edge.
    The recommended state for this setting is: Enabled: Disallow users from managing certificates.'
  rationale: The use of Google Cast could allow users to show potentially sensitive information to non-trusted devices. These
    devices could be in public areas. Configuring this policy to the recommended state prevents users from unknowingly installing
    certificates that grant excessive trust, such as root CAs from unverified sources. It also prevents system-trusted certificates
    from being tampered with by users.
  impact: Users will not be able to utilize Google Cast, and the icon will not be displayed in Microsoft Edge. Users will
    not be able to manage certificates.
  references:
  - 1. https://learn.microsoft.com/en-us/DeployEdge/microsoft-edge-policies#enablegoogle-cast
  - 1. https://learn.microsoft.com/en-us/deployedge/microsoft-edge-browserpolicies/cacertificatemanagementallowed
  page_start: 20
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

    REG_DWORD value of 0.

    HKLM\SOFTWARE\Policies\Microsoft\Edge:EnableMediaRouter

    Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

    REG_DWORD value of 2.

    HKLM\SOFTWARE\Policies\Microsoft\Edge:CACertificatemanagementAllowed'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Disabled:

    Computer Configuration\Policies\Administrative Templates\Microsoft Edge\Cast\Enable

    Google Cast

    Note: This Group Policy path may not exist by default. It is provided by the Group Policy

    template MSEdge.admx/adml that can be downloaded from: Download Microsoft Edge

    for Business - Microsoft.

    To establish the recommended configuration via GP, set the following UI path to

    Enabled: Disallow users from managing certificates:

    Computer Configuration\Administrative Templates\Microsoft Edge\Certificate management

    settings\Allow users to manage installed CA certificates

    Note: This Group Policy path may not exist by default. It is provided by the Group Policy

    template MSEdge.admx/adml that can be downloaded from: Download Microsoft Edge

    for Business - Microsoft.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location with a

      REG_DWORD value of 0.

      HKLM\SOFTWARE\Policies\Microsoft\Edge:EnableMediaRouter

      Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location with a

      REG_DWORD value of 2.

      HKLM\SOFTWARE\Policies\Microsoft\Edge:CACert'
    severity: medium
- id: 1.4.1
  title: Ensure 'Allow read access via the File System API on these sites' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 2 (L2) - Limited Functionality
  - Level 1 (L1) - General Use
  description: 'This policy setting allows organizations to list the URL patterns that specify which sites can ask users to
    grant them read access to files or directories in the host operating system´s file system via the File System API. The
    recommended state for this setting is: Disabled. Note: Leaving this policy not configured allows the DefaultFileSystemReadGuardSetting
    (Control use of the File System API for reading) to apply for all sites. This setting is configured in the Level 2 profile:
    Ensure ''Control use of the File System API for reading'' is set to ''Enabled: Don''t allow any site to request read access
    to files and directories''. Note #2: URL patterns can´t conflict with FileSystemReadBlockedForUrls (Block read access
    via the File System API on these sites). Neither policy takes precedence if a URL matches with both. This policy setting
    configures whether users can receive customized background images and text, suggestions, and tips for Microsoft services.
    The recommended state for this setting is: Disabled. This policy setting allows for the configuration for users to add
    exceptions to allow mixed content for specific sites. The recommended state for this setting is: Enabled: Do not allow
    any site to load mixed content Note: This policy can be overridden for specific URL patterns using the insecurecontentAllowedForUrls)
    (Allow insecure content on specified sites) and insecurecontentBlockedForUrls (Block insecure content on specified sites)
    policies.'
  rationale: This API allows web apps to read from files and folders on user devices. It also allows for the reading files
    and the File System Access API provides the ability to open a directory and enumerate its contents. Disabling this feature
    helps prevent unintentional data sharing with Microsoft and thirdparties. Allowing mixed (secure / insecure) content from
    a site can lead to malicious content being loaded. Mixed content occurs if the initial request is secure over HTTPS, but
    HTTPS and HTTP content is subsequently loaded to display the web page. HTTPS content is secure. HTTP content is insecure.
  impact: Users with creative roles that require read access to files and directories via the File System API may need additional
    permissions granted for said roles. Users will not be able to receive customized background images and text, notifications,
    or tips for Microsoft services. Users will not be able to add exceptions for mix content webpages.
  references:
  - 1. https://docs.microsoft.com/en-us/deployedge/microsoft-edgepolicies#filesystemreadaskforurls
  - 2. https://web.dev/file-system-access/
  - 1. https://learn.microsoft.com/en-us/deployedge/microsoft-edge-browserpolicies/spotlightexperiencesandrecommendationsenabled
  page_start: 26
  audit_raw: "Navigate to the UI Path articulated in the Remediation section and confirm it is set as\nprescribed. This group\
    \ policy setting is in effect when the following registry value does\nnot exist.\nHKLM\\SOFTWARE\\Policies\\Microsoft\\\
    Edge:FileSystemReadAskForUrls\n Page 26\nNavigate to the UI Path articulated in the Remediation section and confirm it\
    \ is set as\nprescribed. This group policy setting is backed by the following registry location with a\nREG_DWORD value\
    \ of 0.\nHKLM\\SOFTWARE\\Policies\\Microsoft\\Edge:SpotlightExperiencesAndRecommendationsEnabled\nNavigate to the UI Path\
    \ articulated in the Remediation section and confirm it is set as\nprescribed. This group policy setting is backed by\
    \ the following registry location with a\nREG_DWORD value of 2.\nHKLM\\SOFTWARE\\Policies\\Microsoft\\Edge:DefaultinsecurecontentSetting\n\
    \ Page 30"
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

