- id: '1.58'
  title: Ensure 'Allow unconfigured sites to be reloaded in Internet Explorer mode' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 2 (L2) - Limited Functionality
  description: 'This policy setting allows users to reload unconfigured sites (that are not configured in the Enterprise mode
    Site List) in Internet Explorer mode when browsing in Microsoft Edge for a site that requires Internet Explorer for compatibility.
    After a site has been reloaded in Internet Explorer mode, "in-page" navigations will stay in Internet Explorer mode (for
    example, a link, script, or form on the page, or a serverside redirect from another "in-page" navigation). Users can choose
    to exit from Internet Explorer mode, or Microsoft Edge will automatically exit from Internet Explorer mode when a navigation
    that isn´t "in-page" occurs (for example, using the address bar, the back button, or a favorite link). Users can also
    optionally tell Microsoft Edge to use Internet Explorer mode for the site in the future. The recommended state for this
    setting is: Disabled. Note: Enabling this setting takes precedence over how the InternetExplorerIntegrationTestingAllowed
    (Allow internet Explorer mode testing) policy is configured, and that policy will be disabled.'
  rationale: Internet Explorer is officially retired and unsupported. Allowing browsers to reconfigure into Internet Explorer
    mode could open an organization up to a malicious site due to its lack of support for modern security features.
  impact: If this setting is Disabled users will not be able to reload unconfigured sites in Internet Explorer mode for compatibility.
    When users try to launch shortcuts or file associations that use Internet Explorer, they will be redirected to open the
    same file/URL in Microsoft Edge. When users try to launch Internet Explorer by directly invoking the iexplore.exe binary,
    Microsoft Edge will launch instead. Page 148
