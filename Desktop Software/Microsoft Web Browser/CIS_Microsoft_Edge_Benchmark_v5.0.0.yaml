- id: '1.126'
  title: 'Ensure ''Enhance the security state in Microsoft Edge'' is set to ''Enabled: Balanced mode'' or higher'
  scoring: scored
  profile:
  - Level 1 (L1) - General Use
  description: 'This policy setting configures "enhance the security state" in Microsoft Edge. Enhanced security in Microsoft
    Edge helps safeguard against memory-related vulnerabilities by disabling just-in-time (JIT) JavaScript compilation and
    enabling additional operating system protections for the browser. These protections include Hardware-enforced Stack Protection
    and Arbitrary Code Guard (ACG). Enhanced security provides two levels of browsing security: Balanced and Strict. Balanced
    mode is an adaptive mode that builds on a user’s behavior on a particular device. Strict mode applies added security protections
    for all the sites a user visits. Users may report some challenges accomplishing their usual tasks when in strict mode.
    The recommended state for this setting is: Enabled: Balanced mode. Configuring this setting to Enabled: Strict mode also
    conforms to the benchmark.'
  rationale: Balance mode will help reduce the risk of an attack by automatically applying stricter security settings on unfamiliar
    sites while adapting to browsing habits over time.
  impact: 'Users will no longer be able to bypass protection for previously visited unfamiliar sites. Edge will apply added
    security protections to sites that are not visited often or are unknown. Websites that are browsed frequently will be
    left out. Note: Most sites will work as expected.'
  references:
  - 1. https://support.microsoft.com/en-us/microsoft-edge/enhance-your-security-onthe-web-with-microsoft-edge-b8199f13-b21b-4a08-a806-daed31a1929d
