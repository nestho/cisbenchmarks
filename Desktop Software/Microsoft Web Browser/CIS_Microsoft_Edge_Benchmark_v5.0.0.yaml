- id: 1.8.1
  title: Ensure 'Configure Edge Website Typo Protection' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - General Use
  description: 'This policy setting configures whether to turn on Edge TyposquattingChecker. The Edge TyposquattingChecker
    provides warning messages to help protect users from potential typo squatting sites. Typo squatting is a type of social
    engineering attack which targets internet users who incorrectly type a URL into their web browser rather than using a
    search engine. Typically, it involves tricking users into visiting malicious websites with URLs that are common misspellings
    of legitimate websites. The recommended state for this setting is: Enabled. This policy setting configures users'' ability
    to override state of feature flags. Feature flags are settings a team can define that indicate whether a given set of
    features is visible in the user experience and/or invoked within the functionality. The recommended state for this setting
    is: Enabled: Prevent users from overriding feature flags.'
  rationale: The Edge TyposquattingChecker will provide a warning message and can help protect users from potential typo squatting
    by alerting the user to the potential of accessing a malicious site. The ability to enter commands and override programs
    should be limited at the CLI to prevent unintentional system configuration alterations. Additionally, feature flags are
    not necessary for users, as they are typically used by Development teams.
  impact: Users will see a warning message when attempting to access a site identified by Microsoft as a potential typosquatting
    site. Occasionally, legitimate sites may be mistakenly flagged as typosquatting. It can be risky for experimental features
    to be allowed in an enterprise managed environment because this can introduce bugs and security holes into systems, making
    it easier for an attacker to gain access. It is generally preferred to only use productionready features.
  references:
  - 1. https://docs.microsoft.com/en-us/DeployEdge/microsoft-edgepolicies#typosquattingcheckerenabled
  - 1. https://docs.microsoft.com/en-us/devops/operate/progressive-experimentationfeature-flags
