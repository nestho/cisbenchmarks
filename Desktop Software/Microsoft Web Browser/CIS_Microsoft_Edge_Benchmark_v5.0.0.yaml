- id: '1.56'
  title: Ensure 'Allow socket pool size randomization for proxies' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - General Use
  description: 'This policy setting controls whether Microsoft Edge randomizes socket pool sizes for proxy connections. Socket
    pool size randomization is a security mechanism that prevents attackers from using deterministic connection limits to
    infer cross-site information. The recommended state for this setting is: Enabled. Note: This policy affects the limits
    configured by the MaxConnectionsPerProxy and MaxConnectionsPerProxyForWebSocket policies. When enabled, the effective
    upper limit can be randomized up to 2x the values configured by those policies, though the expected increase is closer
    to 1.2x in practice.'
  rationale: Without socket pool size randomization, the deterministic connection limit for proxy connections becomes a side
    channel that attackers can exploit to infer cross-site information. By observing when the browser stops opening new connections,
    an attacker can deduce the number of active connections to other sites through the same proxy, revealing browsing behavior
    across origins.
  impact: Proxy connections may use up to twice the number of connections specified by MaxConnectionsPerProxy and MaxConnectionsPerProxyForWebSocket.
    The effective connection ceiling is non-deterministic, which may complicate proxy capacity planning for environments with
    strict connection limits.
  references:
  - 1. https://learn.microsoft.com/en-us/deployedge/microsoft-edgepolicies/allowsocketpoolsizerandomizationforproxies
  page_start: 144
  audit_raw: "Navigate to the UI Path articulated in the Remediation section and confirm it is set as\nprescribed. This group\
