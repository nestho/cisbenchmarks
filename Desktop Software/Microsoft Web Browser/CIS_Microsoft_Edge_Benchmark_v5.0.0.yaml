  description: 'This policy setting controls whether users can launch Microsoft Edge in headless mode. A headless browser
    is a browser that is not configured with a Graphical User Interface (GUI) and is executed via command-line or using network
    communication. The recommended state for this setting is: Disabled. This policy setting configures whether websites can
    access the systems serial ports. The recommended state for this setting is: Enable: Do not allow any site to request access
    to serial ports via the Serial API. Note: If more granular control is needed (per website) then this setting can be used
    in combination with the SerialAllowAllPortsForUrls (Allow the Serial API on specific sites), SerialAskForUrls and SerialBlockedForUrls
    (Block the Serial API on specific sites) settings. For example, SerialAllowAllPortsForUrls can be used to allow serial
    port access to specific sites. Please see the References Section for more information.'
  rationale: Although this feature can be very useful to developers, an attacker could programmatically scrape website content
    and install malicious scripts on devices running the browser’s headless interface. Preventing access to system serial
    ports may prevent malicious sites from using these ports and accessing attached devices.
  impact: Users will not be able to access headless mode in Microsoft Edge. Legitimate websites that need access to the Serial
