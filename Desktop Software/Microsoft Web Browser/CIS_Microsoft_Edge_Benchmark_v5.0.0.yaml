    \ policy setting is backed by the following registry location with a\nREG_DWORD value of 1 or 2.\nHKLM\\SOFTWARE\\Policies\\\
    Microsoft\\Edge:EnhanceSecurityMode\n Page 284"
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Enabled: Balanced mode or Enabled: Strict mode:

    Computer Configuration\Policies\Administrative Templates\Microsoft Edge\Enhance the

    security state in Microsoft Edge

    Note: This Group Policy path may not exist by default. It is provided by the Group Policy

    template MSEdge.admx/adml that can be downloaded from: Download Microsoft Edge

    for Business - Microsoft.'
  checks:
