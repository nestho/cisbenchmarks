- id: 1.32.1
  title: Ensure 'Configure Microsoft Edge Scareware blocker protection' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - General Use
  description: 'This policy setting controls whether Microsoft Edge enables Scareware blocker, an AIpowered feature for protecting
    users from potential tech scams. The recommended state for this setting is: Enabled. Note: When this policy is enabled,
    the policies ScarewareBlockerBlocksDetectedSitesEnabled, ScarewareBlockerSendDetectedSitesToSmartScreenEnabled, and ScarewareBlockerAllowListDomains
    are used to configure the behavior of the Scareware blocker feature. Scareware blocker is enabled by default only on devices
    with more than 2GB of RAM and at least five processor cores. This policy setting controls whether Microsoft Edge blocks
    sites that are detected as potential tech scams. The recommended state for this setting is: Enabled. Note: If the ScarewareBlockerProtectionEnabled
    policy is disabled, this policy has no effect.'
  rationale: Scareware attacks use full-screen alerts, fake virus warnings, and urgent messaging to trick users into calling
    fraudulent support numbers or downloading malicious software. Without Scareware blocker, users have no browser-level protection
    against these social engineering attacks, which can result in credential theft, unauthorized remote access, or financial
    loss. Without active blocking of detected scareware sites, Scareware blocker can detect potential tech scams but cannot
    prevent users from interacting with them. Enabling this policy ensures that detected scareware sites are blocked, providing
    the enforcement action needed to protect users from credential theft, unauthorized remote access, or financial loss resulting
    from tech support scams.
  impact: Microsoft Edge downloads a machine learning model file from Microsoft to the device to support Scareware blocker.
    The feature uses local AI processing and does not send browsing data to a cloud service for detection. Sites detected
    as potential tech scams by the Scareware blocker are blocked. Legitimate sites incorrectly identified as scareware can
    be excluded using the ScarewareBlockerAllowListDomains policy.
  references:
  - 1. https://learn.microsoft.com/en-us/deployedge/microsoft-edgepolicies/scarewareblockerprotectionenabled
  - 1. https://learn.microsoft.com/en-us/deployedge/microsoft-edgepolicies/ScarewareBlockerBlocksDetectedSitesEnabled
