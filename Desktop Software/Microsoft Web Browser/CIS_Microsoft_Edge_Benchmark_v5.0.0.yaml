  - Level 1 (L1) - General Use
  description: 'This policy setting controls whether text predictions will be provided for eligible text fields. The Microsoft
    Turing service uses natural language processing to generate predictions for long-form editable text fields on web pages.
    The recommended state for this setting is: Disabled. This policy setting causes Microsoft Edge to continue running until
    all Internet Explorer tabs have completely finished unloading. This allows Internet Explorer plugins like ActiveX controls
    to perform additional critical work even after the browser has been closed. The recommended state for this setting is:
    Disabled.'
  rationale: Enabling text predictions could allow data to be transmitted to a third-party cloud service, which could lead
    to sensitive data being exposed. Enabling this policy can cause stability and performance issues, and Microsoft Edge processes
    may remain active in the background with no visible windows if the webpage or plugin prevents Internet Explorer from unloading.
    This policy should only be used if your organization depends on a plugin that requires this behavior.
  impact: Text predictions will not be provided in eligible text fields. Sites may still provide their own text predictions.
    None - this is the default behavior.
  references:
