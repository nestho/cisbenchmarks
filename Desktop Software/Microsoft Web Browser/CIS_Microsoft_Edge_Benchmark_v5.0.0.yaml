- id: 1.4.10
  title: 'Ensure ''Default geolocation setting'' is set to ''Enabled: Don''t allow any site to track users'' physical location'''
  scoring: scored
  profile:
  - Level 1 (L1) - General Use
  - Level 2 (L2) - Limited Functionality
  description: 'This policy setting controls whether a user''s physical location can be tracked by websites. The recommended
    state for this setting is: Enabled: Don''t allow any site to track users'' physical location. This policy setting controls
    whether websites can use the Idle Detection API to detect when the user is idle. The recommended state for this setting
    is: Enabled: Do not allow any site to detect the user''s idle state (BlockIdleDetection) or Enabled: Ask every time a
    site wants to detect the user''s idle state (AskIdleDetection).'
  rationale: Geolocation should not be shared with websites to ensure protection of the user's privacy regarding location.
    Additionally, location information could lead to clues regarding the user's network infrastructure surrounding the device
    they are utilizing. The Idle Detection API exposes information about a user's activity state — including whether the user
    is away from their device or the screen is locked — to any website that requests it. Without restricting this API, websites
    can monitor user presence patterns, which could be used for behavioral profiling, targeted timing of social engineering
    prompts, or determining when a device is unattended.
  impact: Location information will not be shared with websites in Microsoft Edge. This could impact websites that utilize
    this information for customized content. Websites that rely on the Idle Detection API to provide functionality, such as
    collaborative applications that display user availability status, will lose that functionality when BlockIdleDetection
    is set. When AskIdleDetection is set, users are prompted each time a site attempts to use the API.
  references:
  - 1. https://docs.microsoft.com/DeployEdge/microsoft-edgepolicies#defaultgeolocationsetting
  - 1. https://learn.microsoft.com/en-us/deployedge/microsoft-edgepolicies/DefaultIdleDetectionSetting
  page_start: 44
  audit_raw: "Navigate to the UI Path articulated in the Remediation section and confirm it is set as\nprescribed. This group\
    \ policy setting is backed by the following registry location with a\nREG_DWORD value of 2.\nHKLM\\SOFTWARE\\Policies\\\
    Microsoft\\Edge:DefaultGeolocationSetting\nNavigate to the UI Path articulated in the Remediation section and confirm\
    \ it is set as\nprescribed. This group policy setting is backed by the following registry location with a\nREG_DWORD value\
    \ of 2 or 3.\nHKLM\\SOFTWARE\\Policies\\Microsoft\\Edge:DefaultIdleDetectionSetting\n Page 46"
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Enabled: Don''t allow any site to track users'' physical location:

    Computer Configuration\Policies\Administrative Templates\Microsoft Edge\Content

    settings\Default geolocation setting

    Note: This Group Policy path may not exist by default. It is provided by the Group Policy

    template MSEdge.admx/adml that can be downloaded from: Download Microsoft Edge

    for Business - Microsoft.

    To establish the recommended configuration via GP, set the following UI path to Do

    not allow any site to detect the user''s idle state or Ask every

    time a site wants to detect the user''s idle state:

    Computer Configuration\Policies\Administrative Templates\Microsoft Edge\Content

    settings\Default idle detection setting

    Note: This Group Policy path may not exist by default. It is provided by the Group Policy

    template MSEdge.admx/adml that can be downloaded from: Download Microsoft Edge

    for Business - Microsoft.'
  checks:
