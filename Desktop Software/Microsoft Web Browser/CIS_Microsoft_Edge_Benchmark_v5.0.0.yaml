      HKLM\SOFTWARE\Policies\Microsof'
    severity: medium
- id: 1.7.1
  title: Ensure 'Enable insecure download warnings' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - General Use
  description: 'This policy setting configures whether warnings are enabled when potentially dangerous content is downloaded
    over HTTP. The recommended state for this setting is: Enabled.'
  rationale: Downloading files over HTTP is not secure, and is vulnerable to interception and modification. Enabling this
    policy setting helps users avoid potentially harmful content by flagging executables and archives from insecure sources.
  impact: When a user tries to download potentially dangerous content from an HTTP site, the user will receive a UI warning,
    such as "Insecure download blocked." The user will still have an option to proceed and download the item.
  references:
  - 1. https://learn.microsoft.com/en-us/deployedge/microsoft-edge-browserpolicies/showdownloadsinsecurewarningsenabled
  page_start: 49
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

