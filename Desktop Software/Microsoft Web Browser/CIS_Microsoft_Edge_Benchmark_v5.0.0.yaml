  - Level 2 (L2) - Limited Functionality
  description: 'This policy setting controls extension management settings for Microsoft Edge, including any controlled by
    existing extension-related policies. This policy supersedes any legacy policies that might be set. The recommended state
    for this setting is: Enabled: { "*": {"installation_mode": "blocked" }}. NOTE: This policy maps an extension ID or an
    update URL to its specific setting only. A default configuration can be set for the special ID "*", which applies to all
    extensions without a custom configuration in this policy. With an update URL, configuration applies to extensions with
    the exact update URL stated in the extension manifest. If the override_update_url flag is set to true, the extension is
    installed and updated using the update URL specified in the ExtensionInstallForcelist (Control which extensions are installed
    silently) policy or in update_url field in this policy. The flag override_update_url is ignored if the update_url is the
    Edge Add-ons website update URL. Note #2: For more granular control the ExtensionInstallForcelist and ExtensionInstallAllowlist
    (Allow specific extensions to be installed) to allow or force install of specific extensions even if the store is blocked
    using the JSON in the example. {"update_url:https://clients2.google.com/service/update2/crx":{"installation_mode":"block
    ed"}} For more details, check out the detailed guide to ExtensionSettings policy available from Microsoft at Detailed
    guide to the ExtensionSettings policy | Microsoft Learn.'
  rationale: Blocking extensions that could potentially allow remote control of the system through the browser is good security
    practice. If extensions are needed for securing the browser, or for enterprise use, these can be enabled by configuring
    the setting Allow specific extensions to be installed.
