    state for this setting is: Enabled. Note: Microsoft Edge uses strict MIME type checking by default. Enabling this policy
    enforces the default behavior via policy and prevents administrators from disabling it for compatibility purposes.'
  rationale: Lax MIME type checking allows resources to load as executable scripts when they were not intended to be used
    that way. An attacker could exploit this behavior to deliver malicious content with a non-JavaScript MIME type that the
    browser would still execute as a worker script, bypassing content type restrictions that would otherwise prevent its execution.
  impact: Web applications that rely on worker scripts served with legacy or non-standard MIME types will fail to load those
    scripts. Organizations with such legacy applications will need to update their server configurations to serve worker scripts
