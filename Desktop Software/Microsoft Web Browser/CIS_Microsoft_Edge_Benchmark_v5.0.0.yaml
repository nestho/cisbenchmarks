    template MSEdge.admx/adml that can be downloaded from: Download Microsoft Edge\nfor Business - Microsoft.\nTo establish\
    \ the recommended configuration via GP, set the following UI path to\nEnabled: Don't allow any site to request read access\
    \ to files\nand directories via the File System API:\nComputer Configuration\\Policies\\Administrative Templates\\Microsoft\
    \ Edge\\Content\nsettings\\Control use of the File System API for reading\nNote: This Group Policy path may not exist\
    \ by default. It is provided by the Group Policy\ntemplate MSEdge.admx/adml that can be downloaded from: Download Microsoft\
    \ Edge\nfor Business - Microsoft.\nTo establish the recommended configuration via GP, set the following UI path to\nEnabled:\
    \ Don't allow any site to request write access to files\nand directories:\nComputer Configuration\\Policies\\Administrative\
    \ Templates\\Microsoft Edge\\Content\nsettings\\Control use of the File System API for writing\nNote: This Group Policy\
