    command: show full
    severity: medium
    info: "There are 2 stages to audit. Here is how to verify in the CLI:\nStage 1: Verify the profile.\nFGT1 # config system\
      \ accprofile\nFGT1 (accprofile) # edit \"tier_1\"\nFGT1 (tier_1) # show full\nconfig system accprofile\n edit \"tier_1\"\
      \n set comments ''\n set secfabgrp read\n set ftviewgrp read\n set authgrp none\n set sysgrp none\n set netgrp read\n\
