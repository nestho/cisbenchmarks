    delivery network) servers closer to the user rather than from the FortiGate. On failure, the files can fall back to loading
    from the FortiGate.
  rationale: When accessing a remote FortiGate, GUI might experience some slowness due to geographical distance. For this
    case, loading static GUI artifacts cached in CDN servers will provide a better GUI / web management experience.
  impact: This is not a security control recommendation. Hence, there is no impact if this is not enabled.
  references:
