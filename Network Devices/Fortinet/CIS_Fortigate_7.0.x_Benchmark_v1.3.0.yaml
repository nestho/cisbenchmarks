- id: 4.4.1
  title: Block high risk categories on Application Control
  scoring: manual
  profile:
  - Level 1
  description: Ensure FortiGate Application Control blocks high risk applications to reduce attack surface.
  rationale: High risk applications such as those in "P2P" and "Proxy" are known for spreading malware. Some of this traffic
    is encrypted and therefore is able to bypass network security inspection (for those without decryption implemented). Blocking
    these applications from running eliminates this risk. If any application that falls under "P2P" and "Proxy" is required
    to be allowed based on an organization's policy, that specific application needs to be under "Monitor" mode in the "Application
    and Filter Override" configuration.
  impact: ''
  references:
  - 1. https://docs.fortinet.com/document/fortigate/7.2.0/administrationguide/19814/basic-category-filters-and-overrides
  page_start: 125
