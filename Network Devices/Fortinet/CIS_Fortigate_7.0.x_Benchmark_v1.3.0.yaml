- id: 4.2.3
  title: Enable Outbreak Prevention Database
  scoring: scored
  profile:
  - Level 2
  description: Ensure FortiGate AV inspection uses outbreak prevention database as an added layer of protection on top of
    antivirus' signature-based detection.
  rationale: Antivirus mainly uses signature for malware blocking. By enabling "FortiGuard outbreak prevention database",
    FortiGate can leverage on 3rd party malware hash signatures curated by the FortiGuard as an additional protection layer.
    The hash signatures are obtained from FortiGuard's Global Threat Intelligence database. The antivirus database queries
    FortiGuard with the hash of a scanned file. If FortiGuard returns a match, the scanned file is deemed to be malicious.
  impact: ''
  references:
  - 1. https://docs.fortinet.com/document/fortigate/7.2.0/administrationguide/889364/fortiguard-outbreak-prevention
  page_start: 109
  audit_raw: 'On GUI:

