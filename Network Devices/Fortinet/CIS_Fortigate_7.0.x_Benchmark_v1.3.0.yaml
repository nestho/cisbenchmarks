- id: '2.4'
  title: Administrators and Admin Profiles 2.4.1 Ensure default 'admin' password is changed
  scoring: manual
  profile:
  - Level 1
  description: Before deploying any new FortiGate, it is important to change the password of the default admin account. It
    is also recommended that you change even the user name of the default admin account, However, since you cannot change
    the user name of an account that is currently in use, a second administrator account must be created in order to do this.
  rationale: Default credentials are well documented by most vendors, including Fortinet. Therefore, it will be one of the
    first things that will be tried to illegally gain access to the system.
  impact: If not changed, then any scripts that use default credentials will be able to access the system.
  references:
  - 1. https://kb.fortinet.com/kb/documentLink.do?externalID=FD48763
  - 2. https://docs.fortinet.com/document/fortigate/6.2.0/cookbook/99980/defaultadministrator-password
  page_start: 60
  audit_raw: 'Using both CLI and GUI, in the username field put in "admin", leave the password field

    blank and proceed. If it''s checked out, it means that the default password is still in place

    and needs to be changed.'
  remediation: 'In the CLI, to change the password of account "admin":

    FG1 # config system admin

    FG1 (admin) # edit "admin"

    FG1 (admin) # set password <your passwords>

    FG1 (admin) # end

    FG1 #

    To change the default password in the GUI:

    1) Login to FortiGate with admin account

    2) Go to System > Administrators.

    3) Edit the admin account.

    4) Click Change Password.

    5) If applicable, enter the current password in the Old Password field.

    6) Enter a password in the New Password field, then enter it again in the

    Confirm Password field.

    7) Click OK.'
  checks:
  - type: manual_review
    info: 'Using both CLI and GUI, in the username field put in "admin", leave the password field

      blank and proceed. If it''s checked out, it means that the default password is still in place

      and needs to be changed.'
    severity: medium
- id: 2.4.2
  title: Ensure all the login accounts having specific trusted hosts enabled
  scoring: manual
  profile:
  - Level 1
  description: Configure an administrative account to be accessible only to someone who is using a trusted host. You can set
    a specific IP address for the trusted host or use a subnet.
  rationale: Access to a firewall to perform administrative tasks should only come from specific network segments reserved
    for administrators only. This additional layer of security ensures that no one from anywhere else on the network is able
    to log in, even with correct credentials.
  impact: All access outside of the allowed segment will be stopped, including from both legitimate and illegitimate users.
    Thus, administrators working remotely will have to make sure that they have access to jump hosts that sit in the allowed
    segment.
  references:
  - 1. https://docs.fortinet.com/document/fortigate/7.2.0/administrationguide/14906/administrator-account-options
  page_start: 63
