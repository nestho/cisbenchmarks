- id: 2.1.12
  title: Ensure single CPU core overloaded event is logged
  scoring: manual
  profile:
  - Level 1
  description: Add log-single-cpu-high option under config system global. When enabled, CPU single core usage will be polled
    every three seconds, and any single CPU core usage above the CPU usage threshold will report an event log. If a core is
    reported, that core will not be checked again for the next 30 seconds.
  rationale: There are instances where overall CPU usage is low, but there is a single CPU core that is overloaded. But because
    reporting and dashboard in FortiGate shows the overall CPU usage, a single CPU core spike may get overlooked on a FortiGate
    with multiple CPU cores. This causes performance issues where there are instances which traffic has been stopped processing.
  impact: ''
  references:
  - 1. https://community.fortinet.com/t5/FortiGate/Technical-Tip-Enable-logging-forsingle-core-CPU-spike-against/ta-p/293010
  - 2. https://docs.fortinet.com/document/fortigate/7.2.4/fortios-releasenotes/743723/new-features-or-enhancements
  page_start: 46
  audit_raw: 'On CLI:

    config system global

    get

    Ensure that log-single-cpu-high is enabled.'
  remediation: "On CLI:\nconfig system global\n set log-single-cpu-high enable\nend"
  checks:
  - type: manual_review
    info: 'On CLI:

      config system global

      get

      Ensure that log-single-cpu-high is enabled.'
    severity: medium
- id: 2.2.1
  title: Ensure 'Password Policy' is enabled
  scoring: scored
  profile:
  - Level 1
  description: It is important to use secure and complex passwords for preventing unauthorized access to the FortiGate device.
  rationale: Attackers can use brute force password software to launch more than just dictionary attacks. Such attacks can
    discover common passwords where a letter is replaced by a number or symbol.
  impact: Weak passwords can be easily discovered by hackers, which leads to unauthorized access to FortiGate. Depending on
    the access privilege of the compromised account, the attacker may modify important settings.
  references:
  - 1. https://community.fortinet.com/t5/FortiGate/Technical-Tip-Strong-PasswordPassword-Policy-feature/ta-p/197485?externalID=FD31021
  - 2. https://docs.fortinet.com/document/fortigate/7.2.7/cli-reference/10620/configsystem-password-policy
  page_start: 49
  audit_raw: 'Currently implemented password policy can be shown from GUI or CLI

    From CLI, type:

    get system password-policy

    Or from GUI as follows:

    1) Log in to FortiGate with a user with at least read-only privileges

    2) Go to ''System'' > ''Settings''

    3) Find and check the status of the ''Password Policy'' Section'
  remediation: "Can be modified from CLI or GUI.\nFrom CLI, do the following:\nconfig system password-policy\n set status\
    \ enable\n set apply-to admin-password ipsec-preshared-key\n set minimum-length 8\n set min-lower-case-letter 1\n set\
    \ min-upper-case-letter 1\n set min-non-alphanumeric 1\n set min-number 1\n set expire-status enable\n set expire-day\
    \ 90\n set reuse-password disable\nend\nOr from GUI, do the following:\n1) Log in to FortiGate as Super Admin\n2) Go to\
    \ 'System' > 'Settings'\n3) Find the 'Password Policy' section\n4) Default 'Password scope' is 'Off', change it to 'Both'\n\
    5) set 'Minimum length' to '8'\n6) Enable 'Character requirements'\n7) set minimum '1' in the filed of 'Upper Case', 'Lower\
    \ Case', 'Numbers (09)' and 'Special'\n8) Disable 'Allow password reuse'\n9) Enable 'Password expiration' and set it to\
    \ 90"
  checks:
  - type: manual_review
    info: 'Currently implemented password policy can be shown from GUI or CLI

      From CLI, type:

      get system password-policy

      Or from GUI as follows:

      1) Log in to FortiGate with a user with at least read-only privileges

      2) Go to ''System'' > ''Settings''

      3) Find and check the status of the ''Password Policy'' Section'
    severity: medium
- id: 2.2.2
  title: Ensure administrator password retries and lockout time are configured
  scoring: scored
  profile:
  - Level 1
  description: Failed login attempts can indicate malicious attempts to gain access to your network. To prevent this security
    risk, FortiGate is preconfigured to limit the number of failed administrator login attempts. After the maximum number
    of failed login attempts is reached, access to the account is blocked for the configured lockout period.
  rationale: When you log in and fail to enter the correct password, you could potentially be a valid user or a hacker attempting
    to gain access. For this reason, best practice dictates limiting the number of failed login attempts before a lockout
    period in which you cannot log in for a certain period of time. Lockout period will minimize hacker attempts to gain access
    to the firewall.
  impact: Attackers will keep attempting to access the device through brute force attacks without any interruption, which
    may lead to a successful login.
  references:
  - 1. https://docs.fortinet.com/document/fortigate/7.2.7/cli-reference/1620/configsystem-global
  page_start: 52
  audit_raw: 'To check the lockout options, from CLI:

    get system global

    from the output, check the value of the below fields:

    1.

    admin-lockout-threshold

    2.

    admin-lockout-duration

    Ensure that admin-lockout-threshold is set at 3 and admin-lockout-duration is set at

    900.'
  remediation: "To configure the lockout options, from CLI:\nconfig system global\n set admin-lockout-threshold 3\n set admin-lockout-duration\
    \ 900\nend\nLockout affects the offending IP address, not the entire account."
  checks:
  - type: manual_review
    info: 'To check the lockout options, from CLI:

      get system global

      from the output, check the value of the below fields:

      1.

      admin-lockout-threshold

      2.

      admin-lockout-duration

      Ensure that admin-lockout-threshold is set at 3 and admin-lockout-duration is set at

      900.'
    severity: medium
- id: '2.3'
  title: SNMP 2.3.1 Ensure only SNMPv3 is enabled
  scoring: scored
  profile:
  - Level 2
  description: Ensuring that only SNMPv3 service is enabled and SNMPv1, SNMPv2c are disabled.
  rationale: SNMP Version 3 provides security enhancements that are not available in SNMP Version 1 or SNMP Version 2c. SNMP
    Versions 1 and 2c transmit data between the SNMP server and SNMP agent in clear text. SNMP Version 3 adds authentication
    and privacy options to secure protocol operations. Some firewalls need to be constantly monitored of its performance and
    status, especially if the firewalls are critical to the operation. Enabling SNMPv3 will ensure that the firewall is monitored
    properly.
  impact: Some older SNMP servers that only run SNMPv1 or SNMPv2c will not be able to query to this firewall.
  references:
  - 1. https://community.fortinet.com/t5/FortiGate/Technical-Tip-How-to-ConfigureFortiGate-SNMP-Agent-for/ta-p/196866?externalID=FD45755
  - 2. https://docs.fortinet.com/document/fortigate/7.2.0/administrationguide/457149/snmp-v3-users
  page_start: 54
  audit_raw: "From CLI, check to make sure that there is not any community for SNMPv1 or\nSNMPv2c and only SNMPv3 users are\
    \ there. Also make sure that SNMP Agent is\nenabled:\nFGT1 # config system snmp sysinfo\nFGT1 (sysinfo) # show\nconfig\
    \ system snmp sysinfo\n set status enable\n ...\nend\nFGT1 (sysinfo) # end\nFGT1 # config system snmp community\nFGT1\
    \ (community) # show\nconfig system snmp community\nend\nFGT1 (community) # end\nFGT1 # config system snmp user\nFGT1\
    \ (user) # show\nconfig system snmp user\n edit \"snmp_test\"\n set security-level auth-priv\n set auth-proto sha256\n\
    \ set auth-pwd ENC xxxxxx\n set priv-proto aes256\n set priv-pwd ENC xxxxxx\n next\nend\nIn the GUI, go to:\n1. System\
    \ > SNMP. Make sure that SNMP agent is enabled.\n2. Make sure that there is not any SNMPv1/2c community.\n3. Make sure\
    \ that there is at least 1 SNMPv3 user in the list."
  remediation: 'To enable SNMP agent in CLI:

    FGT1 # config system snmp sysinfo

    FGT1 (sysinfo) # set status enable

    FGT1 (sysinfo) # end

    In GUI, go to System > SNMP and enable SNMP Agent.

    To delete SNMPv1/2c communities. In this example, we''ll delete community "public" in

    CLI:

    FGT1 # config system snmp community

    FGT1 (community) # delete public

    FGT1 (community) # end

    FGT #

    In the GUI, go to:

    System > SNMP, select the community and click on the Delete button.

    To add SNMPv3 user in CLI:

    FGT1 # config system snmp user

    FGT1 (user) # edit "snmp_test"

    FGT1 (snmp_test) # set security-level auth-priv

    FGT1 (snmp_test) # set auth-proto sha256

    FGT1 (snmp_test) # set auth-pwd xxxx

    FGT1 (snmp_test) # set priv-proto aes256

    FGT1 (snmp_test) # set priv_pwd xxxx

    FGT1 (snmp_test) # end

    FGT1 #

    In the GUI, go to:

    1. System > SNMP, under SNMPv3, click on "Create New" button.

    2. Select "Authentication" and choose SHA256 as Authentication algorithm.

    3. Click "Change" to type in the password.

    4. Also select option "Private", choose AES256 as Encryption Algorithm.

    5. Click on "Change" to change the password. Click "OK" to add the new user.

    6. Click apply to apply the new setting into the current config.'
  checks:
  - type: sql
    command: 'show

      config system snmp sysinfo'
    severity: medium
    info: "From CLI, check to make sure that there is not any community for SNMPv1 or\nSNMPv2c and only SNMPv3 users are there.\
      \ Also make sure that SNMP Agent is\nenabled:\nFGT1 # config system snmp sysinfo\nFGT1 (sysinfo) # show\nconfig system\
      \ snmp sysinfo\n set status enable\n ...\nend\nFGT1 (sysinfo) # end\nFGT1 # config system snmp community\nFGT1 (community)\
      \ # show\nconfig system snmp community\nend\nFGT1 (community)"
