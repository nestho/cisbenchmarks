- id: '3.3'
  title: Ensure firewall policy denying all traffic to/from Tor, malicious server, or scanner IP addresses using ISDB
  scoring: manual
  profile:
  - Level 1
  description: Firewall policies should include a deny rule for traffic going to/from Tor, malicious server, or scanner IP
    addresses using ISDB (Internet Service Database).
  rationale: FortiGate includes Tor or malicious server related IP address using ISDB. The idea is to filter out malicious
    traffic using firewall policies as first level filtering. This is done without involving more resource intensive processes
    such as IPS inspection, hence optimizing FortiGate's performance.
  impact: ''
  references: []
  page_start: 95
  audit_raw: 'Go to "Policy & Objects".

    Validate that there is a firewall policy created to block inbound connections from

    sources named "Tor-Exit.Node", "Tor-Relay.Node", "Censys-Scanner", "ShodanScanner", "Botnet-C&C.Server", "Phishing-Phishing.Server",
    "Proxy-Proxy.Server",

    "Spam-Spamming.Server", "VPN-Anonymous.VPN", and "Malicious-Malicious.Server"

    on "All" services.

    Validate that there is a firewall policy created to block outbound connections to

    destination named "Tor-Relay.Node", "Botnet-C&C.Server", "Phishing-Phishing.Server",

    "Proxy-Proxy.Server", "Spam-Spamming.Server", "VPN-Anonymous.VPN", and

    "Malicious-Malicious.Server".'
  remediation: 'Review firewall policies and ensure there are:

    1. A firewall policy created to block inbound connections with these settings:

    From: Any

    To: Any

    Source: "Tor-Exit.Node", "Tor-Relay.Node", "Censys-Scanner", "ShodanScanner", "Botnet-C&C.Server", "Phishing-Phishing.Server",
    "ProxyProxy.Server", "Spam-Spamming.Server", "VPN-Anonymous.VPN", and "MaliciousMalicious.Server"

