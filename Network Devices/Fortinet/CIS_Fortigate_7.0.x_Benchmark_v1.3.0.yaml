      \ ...\n next\nend\nIn the Web GUI:\n1. System > Administrators.\n2. Sele"
- id: 2.4.3
  title: Ensure admin accounts with different privileges have their correct profiles assigned
  scoring: manual
  profile:
  - Level 1
  description: Verify that users with access to the Fortinet should only have the minimum privileges required for that particular
    user.
  rationale: In some organizations, it is necessary to create different levels of administrative accounts. For example, technicians
    from tier 1 support should not have total access to the system compared to a tier 3 support.
  impact: ''
  references:
  - 1. https://docs.fortinet.com/document/fortigate/7.2.0/administrationguide/294491/administrator-profiles
  page_start: 66
  audit_raw: "There are 2 stages to audit. Here is how to verify in the CLI:\nStage 1: Verify the profile.\nFGT1 # config\
    \ system accprofile\nFGT1 (accprofile) # edit \"tier_1\"\nFGT1 (tier_1) # show full\nconfig system accprofile\n edit \"\
    tier_1\"\n set comments ''\n set secfabgrp read\n set ftviewgrp read\n set authgrp none\n set sysgrp none\n set netgrp\
    \ read\n set loggrp none\n set fwgrp custom\n set vpngrp none\n set utmgrp none\n set wifi none\n set admintimeout-override\
    \ disable\n config fwgrp-permission\n set policy none\n set address none\n set service none\n set schedule none\n end\n\
    \ next\nend\nFGT1 (tier_1) #\nIf the following privileges are set to \"custom\", please also check the sub-privileges\
    \ of the\ncustomized ones to make sure that only the right privileges are allowed: fwgrp, sysgrp,\nnetgrp, loggrp, utmgrpset.\n\
    In the GUI, go to:\nSystem > Admin Profiles, select the profile and click on \"Edit\".\nStage 2: Verify the admin accounts.\n\
    In the CLI:\nFGT1 #config system admin\nFGT1 (admin) # edit \"support1\"\nFGT1 (support1) # show full\nconfig system admin\n\
    \ edit \"support1\"\n ...\n set accprofile \"tier_1\"\n ...\n next\nend\nIn the GUI, go to:\nSystem > Administrators,\
    \ select the account and click \"Edit\""
  remediation: 'In this example, the goal is to provide the profile "tier_1" the ability to view and modify

    address objects. This sub-privilege is under fwgrp privilege.

    In CLI:

    FGT1 # config system accprofile

    FGT1 (accprofile) # edit "tier_1"

    FGT1 (tier_1) # set fwgrp custom

    FGT1 (tier_1) # config fwgrp-permission

    FGT1 (fwgrp-permission) # set address read-write

    FGT1 (fwgrp-permission) # end

    FGT1 (tier_1) # end

    FGT1 #

    For the GUI, go to:

    1. System > Admin Profiles, select "tier_1" and click "Edit".

    2. On "Firewall", click on "Custom".

    3. Click on "Read/Write" option for "Address".

    In the next example, assign the profile "tier_1" to the account "support1".

    In the CLI:

    FGT1 # config system admin

    FGT1 (admin) # edit "support1"

    FGT1 (support1) # set accprofile "tier_1"

    FGT1 (support1) # end

    FGT1 #

    For the GUI, go to:

    1. System > Administrators.

    2. Select "support1" and click "Edit".

    3. Under "Administrator Profile", select "tier_1".'
