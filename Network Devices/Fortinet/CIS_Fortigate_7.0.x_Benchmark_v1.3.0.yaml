- id: 2.5.2
  title: Ensure "Monitor Interfaces" for High Availability devices is enabled
  scoring: scored
  profile:
  - Level 1
  description: Configure Interface Monitoring within High Availability settings. Interface Monitoring should be enabled on
    all critical interfaces.
  rationale: With Interface Monitoring enabled on devices, failover can occur if there are physical media issues or issues
    with the specific port to which the FortiGate is connected.
  impact: Not configuring Interface Monitoring can directly impact services due to a failure to trigger a High Availability
    failover if an interface is impacted only on the primary device and is not being monitored. Without the Interface Monitoring
    enabled, failover would be limited to hardware, system, or power faults.
  references:
  - 1. https://docs.fortinet.com/document/fortigate/6.0.0/bestpractices/498515/interface-monitoring-port-monitoring
  page_start: 85
