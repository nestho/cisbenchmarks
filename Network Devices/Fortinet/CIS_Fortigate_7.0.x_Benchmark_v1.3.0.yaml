    \ are in the list:\nFG1 # config system admin\nFG1 (admin) # edit \"test_admin\"\nFG1 (test_admin) # show\nconfig system\
    \ admin\n edit \"test_admin\"\n ...\n set trusthost1 10.0.0.0 255.255.255.0\n set trusthost2 192.168.10.0 255.255.255.0\n\
    \ ...\n next\nend\nIn the Web GUI:\n1. System > Administrators.\n2. Select the account and click on edit.\n3. In the account\
    \ setting page, make sure that \"Restrict login to trusted\nhosts\" is enabled and all the allowed hosts / subnets are\
    \ in the list of\ntrusted host.\nPlease take note that certain versions of FortiOS will only show the first 3 trusted\
    \ hosts\nin the list. If you want to see more, you have to click on the \"+\" sign as if you're adding a\nnew item into\
    \ the list. Keep clicking until you see an empty field of trusted host. That's\nwhen you know that you have reached the\
    \ bottom of the list."
  remediation: 'To remove a trusted host item from the list in CLI:

    FG1 # config system admin

    FG1 (admin) # edit "test_admin"

    FG1 (test_admin) # unset trusthost1

    FG1 (test_admin) # end

    FG1 #

    To add a trusted host into the list in CLI:

    FG1 # config system admin

    FG1 (admin) # edit "test_admin"

    FG1 (test_admin) # set trusthost6 1.1.1.1 255.255.255.255

    FG1 (test_admin) # end

    FG1 #

    Before adding an item, please make sure that it does not already exist. For example, if

    trusthost3 is already in the list, using it again will override the existing host/network.

    In the Web GUI:

    1. System > Administrators.

    2. select the account and click on edit.

    3. In the account setting page, make sure that "Restrict login to trusted

    hosts" is enabled and all the allowed hosts / subnets are in the list of

    trusted host.

    Please take note that certain versions of FortiOS will only show the first 3 trusted hosts

    in the list. If you want to see more, you have to click on the "+" sign as if you''re adding a

    new item into the list. Keep clicking until you see an empty field of trusted host. That''s

