- id: 6.1.1
  title: Apply a Trusted Signed Certificate for VPN Portal
  scoring: manual
  profile:
  - Level 2
  description: Apply a signed certificate from a trusted Certificate Authority (CA) to the SSL VPN portal to allow users to
    connect securely with confidence.
  rationale: Having an unsigned or self signed certificate leaves connections open to man-in-themiddle attacks and could allow
    users to connect to untrusted servers.
  impact: ''
  references: []
  page_start: 144
  audit_raw: 'GUI:

