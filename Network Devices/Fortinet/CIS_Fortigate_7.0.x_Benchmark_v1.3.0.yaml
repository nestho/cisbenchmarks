- id: 2.4.6
  title: Apply Local-in Policies
  scoring: manual
  profile:
  - Level 1
  description: Configure Local-in Policies to control inbound traffic that is destined to a FortiGate interface.
  rationale: Local-in Policies allow for more granular and specific control of all types of traffic that are destined for
    a FortiGate interface. They are not limited to management-only protocols, therefore they can extend past "trusted host"
    configurations and be configured with source and destination addresses as well as specific services.
  impact: Local-in Policies are processed before "trusted host" configurations, so it is important to validate that management
    access will be maintained once the Local-in policies are put in place.
  references:
  - 1. https://docs.fortinet.com/document/fortigate/7.2.0/administrationguide/363127/local-in-policy
  page_start: 74
  audit_raw: 'To review Local-in Policies in the GUI, go to:

    1. System > Feature Visibility.

    2. Turning on "Local-in policies" under the Additional Features Section.

    This will then add the section under "Policies and Objects" there will now be a section

    for "Local-in Policies"

    It can also be viewed through the CLI:

    config firewall local-in-policy

    show'
  remediation: "Local-in Policies can only be configured through the CLI:\nconfig firewall {local-in-policy | local-in-policy6}\n\
    \ edit <policy_number>\n set intf <interface>\n set srcaddr <source_address> [source_address] ...\n set dstaddr <destination_address>\
    \ [destination_address] ...\n set action {accept | deny}\n set service <service_name> [service_name] ...\n set schedule\
    \ <schedule_name>\n set comments <string>\n next\nend\nFor example, to prevent the source subnet 10.10.10.0/24 from pinging\
    \ port1, but allow\nadministrative access for PING on port1:\nconfig firewall address\n edit \"10.10.10.0\"\n set subnet\
    \ 10.10.10.0 255.255.255.0\n next\nend\nconfig firewall local-in-policy\n edit 1\n set intf \"port1\"\n set srcaddr \"\
    10.10.10.0\"\n set dstaddr \"all\"\n set service \"PING\"\n set schedule \"always\"\n next\nend"
  checks:
  - type: manual_review
    info: 'To review Local-in Policies in the GUI, go to:

      1. System > Feature Visibility.

      2. Turning on "Local-in policies" under the Additional Features Section.

      This will then add the section under "Policies and Objects" there will now be a section

      for "Local-in Policies"

      It can also be viewed through the CLI:

      config firewall local-in-policy

      show'
    severity: medium
- id: 2.4.7
  title: Ensure default Admin ports are changed
  scoring: manual
  profile:
  - Level 1
  description: FortiGate admin ports listen on the common ports of 80 and 443. This is default behavior. While interface access
    is controlled by configuring network interfaces, the FortiGate still listens on the admin ports that have been configured,
    which can also cause a conflict should 80 or 443 be needed as part of additional configuration later on.
  rationale: To increase security of the FortiGate Admin Ports, changing it from the default ports will reduce the attack
    surface should FortiGate Admin Access be targeted. As mentioned, a possible port conflict can also be avoided.
  impact: Unauthorized access to a FortiGate or any firewall could prove very costly. While this is a single hardening step
    of many, it is an important one when hardening any firewall.
  references:
  - 1. https://docs.fortinet.com/document/fortigate/7.2.4/administrationguide/616955/configuring-ports
  - 2. https://community.fortinet.com/t5/FortiGate/Technical-Tip-How-to-change-theport-for-the-admin-access-to/ta-p/192295?externalID=FD46981
  page_start: 77
  audit_raw: 'Log in to the GUI and click on System > Settings > Review the ports under

    ''Administration Settings'' section.'
  remediation: "config system global\n set admin-https-redirect disable\n set admin-port 8082 **(or any other uncommon port)**\n\
    \ set admin-server-cert \"self-sign\"\n set admin-sport 4343 **(or any other uncommon port)**\nend\nOR\nFrom Web GUI:\n\
    1. System > Settings\n2. Change the ports/settings under 'Administration Settings' section.\nNOTE: https redirection must\
    \ be turned off as well as changing port 80. This is due to\nthe nature of how browser port redirection works. The browser\
    \ will be redirected from\nport 80 to port 443 or whichever 'admin-sport' is configured, meaning that it will still\n\
    listen on port 80 even when the port has been reconfigured."
  checks:
  - type: manual_review
    info: 'Log in to the GUI and click on System > Settings > Review the ports under

      ''Administration Settings'' section.'
    severity: medium
- id: 2.4.8
  title: Virtual patching on the local-in management interface
  scoring: manual
  profile:
  - Level 1
  description: Allow virtual patching to be applied to traffic destined to the FortiGate by applying IPS signatures to the
    local in interface using local in policies. Attacks geared towards GUI and SSH management access, for example, can be
    mitigated using IPS signatures pushed from FortiGuard, thereby virtually patching these vulnerabilities.
  rationale: Patches require scheduling of downtime, which means there is some attack window from the time Fortinet announced
    the vulnerability to when patch is applied. To minimise the risk, virtual patching on GUI and SSH management access is
    needed.
  impact: ''
  references:
  - 1. https://docs.fortinet.com/document/fortigate/7.2.0/new-features/393161/virtualpatching-on-the-local-in-management-interface-7-2-4
  page_start: 79
  audit_raw: 'On CLI:

    config firewall local-in-policy

    show

    Ensure that virtual-patch is enabled for those policy that is allowing traffic.'
  remediation: "On CLI:\nconfig firewall local-in-policy\n edit <id>\n set virtual-patch enable\n next\nend"
  checks:
  - type: sql
    command: 'show

      Ensure that virtual-patch is enabled for those policy that is allowing traffic.'
    severity: medium
    info: 'On CLI:

      config firewall local-in-policy

      show

      Ensure that virtual-patch is enabled for those policy that is allowing traffic.'
