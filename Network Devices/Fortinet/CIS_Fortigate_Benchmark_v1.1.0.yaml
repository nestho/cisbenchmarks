- id: 2.4.6
  title: Apply Local-in Policies
  scoring: manual
  profile:
  - Level 1
  description: Configure Local-in Policies to control inbound traffic that is destined to a FortiGate interface.
  rationale: Local-in Policies allow for more granular and specific control of all types of traffic that are destined for
    a FortiGate interface. They are not limited to management only protocols so they can extend past "trusted host" configurations
    and can be configured with source and destination addresses as well as services specifically.
  impact: Local-in Policies are processed before "trusted host" configurations so it is important to validate that management
    access will be maintained once the Local-in policies are put in place.
  references: []
  page_start: 63
  audit_raw: 'To review Local-in Policies you can enable the feature to see them in the GUI by going

    to

    System > Feature Visibility and turning on "Local-in policies" under the

    Additional Features Section. This will then add the section under "Policies

    and Objects" there will now be a section for "Local-in Policies"

    It can also be viewed through the CLI:

    config firewall local-in-policy

    show'
  remediation: "Local-in Policies can only be configured through the CLI:\nconfig firewall {local-in-policy | local-in-policy6}\n\
    \ edit <policy_number>\n set intf <interface>\n set srcaddr <source_address> [source_address] ...\n set dstaddr <destination_address>\
    \ [destination_address] ...\n set action {accept | deny}\n set service <service_name> [service_name] ...\n set schedule\
    \ <schedule_name>\n set comments <string>\n next\nend\nFor example, to prevent the source subnet 10.10.10.0/24 from pinging\
    \ port1, but allow\nadministrative access for PING on port1:\nconfig firewall address\n edit \"10.10.10.0\"\n set subnet\
    \ 10.10.10.0 255.255.255.0\n next\nend\nconfig firewall local-in-policy\n edit 1\n set intf \"port1\"\n set srcaddr \"\
    10.10.10.0\"\n set dstaddr \"all\"\n set service \"PING\"\n set schedule \"always\"\n next\nend"
  checks:
  - type: manual_review
    info: 'To review Local-in Policies you can enable the feature to see them in the GUI by going

      to

      System > Feature Visibility and turning on "Local-in policies" under the

      Additional Features Section. This will then add the section under "Policies

      and Objects" there will now be a section for "Local-in Policies"

      It can also be viewed through the CLI:

      config firewall local-in-policy

