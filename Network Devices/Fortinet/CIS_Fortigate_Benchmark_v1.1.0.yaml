- id: 2.2.2
  title: Ensure administrator password retries and lockout time are configured
  scoring: scored
  profile:
  - Level 1
  description: Failed login attempts can indicate malicious attempts to gain access to your network. To prevent this security
    risk, FortiGate is preconfigured to limit the number of failed administrator login attempts. After the maximum number
    of failed login attempts is reached, access to the account is blocked for the configured lockout period.
  rationale: When you login and fail to enter the correct password you could be a valid user, or a hacker attempting to gain
    access. For this reason, best practices dictate to limit the number of failed attempts to login before a lockout period
    where you cannot login for a certain period of time. lockout period will minimize the hacker attempts to gain access to
    firewall.
  impact: Attackers will keep attempting to access the device through brute force attacks without any interruption which may
    lead to a successful login.
  references:
  - 1. https://docs.fortinet.com/document/fortigate/6.2.0/cookbook/631730/setting-theadministrator-password-retries-and-lockout-time
  page_start: 42
  audit_raw: 'To check the lockout options, from CLI:

    get system global

    from the output, check the value of the below fields

    admin-lockout-threshold and admin-lockout-duration'
  remediation: "To configure the lockout options, from CLI:\nconfig system global\n set admin-lockout-threshold 3\n set admin-lockout-duration\
    \ 60\nend"
  checks:
  - type: manual_review
    info: 'To check the lockout options, from CLI:

      get system global

      from the output, check the value of the below fields

      admin-lockout-threshold and admin-lockout-duration'
    severity: medium
- id: '2.3'
  title: SNMP 2.3.1 Ensure SNMP agent is disabled
  scoring: scored
  profile:
  - Level 1
  description: The Simple Network Management Protocol (SNMP) server is used to listen for SNMP commands from an SNMP management
    system, execute the commands or collect the information and then send results back to the requesting system.
  rationale: The SNMP server can communicate using SNMP v1, which transmits data in the clear and does not require authentication
    to execute commands. Unless absolutely necessary, it is recommended that the SNMP service not be used. If SNMP is required
    the server should be configured to use only SNMPv3.
  impact: SNMP servers will not be able to query the Fortigate devices that have SNMP agents disabled.
  references:
  - 1. https://kb.fortinet.com/kb/documentLink.do?externalID=FD45755
  page_start: 44
  audit_raw: "on CLI, run the following commands to check whether SNMP agent is disabled.\nFGT1 # config system snmp sysinfo\n\
    FGT1 (sysinfo) # show full\nconfig system snmp sysinfo\n set status disable\n ...\nend\nOn the GUI, select System -> SNMP,\
    \ make sure that SNMP Agent is disabled."
  remediation: 'On the CLI, run the following command to disable the agent

    FGT1 # config system snmp sysinfo

    FGT1 (sysinfo) # set status disable

    FGT1 (sysinfo) # end

    On the GUI, select System -> SNMP, disable SNMP agent'
  checks:
  - type: sql
    command: show full
    severity: medium
    info: "on CLI, run the following commands to check whether SNMP agent is disabled.\nFGT1 # config system snmp sysinfo\n\
      FGT1 (sysinfo) # show full\nconfig system snmp sysinfo\n set status disable\n ...\nend\nOn the GUI, select System ->\
      \ SNMP, make sure that SNMP Agent is disabled."
- id: 2.3.2
  title: Ensure only SNMPv3 is enabled
  scoring: scored
  profile:
  - Level 2
  description: Ensuring that only SNMPv3 service is enabled and SNMPv1, SNMPv2c are disabled.
  rationale: SNMP Version 3 provides security enhancements that are not available in SNMP Version 1 or SNMP Version 2c. SNMP
    Versions 1 and 2c transmit data between the SNMP server and SNMP agent in clear text. SNMP Version 3 adds authentication
    and privacy options to secure protocol operations. Some firewalls need to be constantly monitored of its performance and
    status. Especially if the firewalls are critical to the operation. Enabling SNMPv3 will ensure that the firewall is monitored
    properly.
  impact: Some older SNMP server that only run SNMPv1 or SNMPv2C will not be able to query to this firewall.
  references:
  - 1. https://kb.fortinet.com/kb/documentLink.do?externalID=FD45755
  - 2. https://docs.fortinet.com/document/fortigate/6.4.0/administrationguide/457149/snmp-v3-users
  page_start: 47
  audit_raw: "From CLI, check to make sure that there is not any community for SNMPv1 or\nSNMPv2c and only SNMPv3 users are\
    \ there. Also make sure that SNMP Agent is\nenabled.\nFGT1 # config system snmp sysinfo\nFGT1 (sysinfo) # show\nconfig\
    \ system snmp sysinfo\n set status enable\n ...\nend\nFGT1 (sysinfo) # end\nFGT1 # config system snmp community\nFGT1\
    \ (community) # show\nconfig system snmp community\nend\nFGT1 (community) # end\nFGT1 # config system snmp user\nFGT1\
    \ (user) # show\nconfig system snmp user\n edit \"snmp_test\"\n set security-level auth-priv\n set auth-proto sha256\n\
    \ set auth-pwd ENC xxxxxx\n set priv-proto aes256\n set priv-pwd ENC xxxxxx\n next\nend\nIn the GUI, go to\nSystem ->\
    \ SNMP. Make sure that SNMP agent is enabled. Make sure that there\nis not any SNMPv1/2c community. Make sure that there\
    \ is at least 1 SNMPv3\nuser in the list."
  remediation: 'To enable SNMP agent

    in CLI

    FGT1 # config system snmp sysinfo

    FGT1 (sysinfo) # set status enable

    FGT1 (sysinfo) # end

    In GUI, go to System -> SNMP and enable SNMP Agent.

    To delete SNMPv1/2c communities

    In this example, we''ll delete community "public"

    in CLI

    FGT1 # config system snmp community

    FGT1 (community) # delete public

    FGT1 (community) # end

    FGT #

    In the GUI, go to

    System -> SNMP, select the community and click on the Delete button.

    To add SNMPv3 User

    in CLI

    FGT1 # config system snmp user

    FGT1 (user) # edit "snmp_test"

    FGT1 (snmp_test) # set security-level auth-priv

    FGT1 (snmp_test) # set auth-proto sha256

    FGT1 (snmp_test) # set auth-pwd xxxx

    FGT1 (snmp_test) # set priv-proto aes256

    FGT1 (snmp_test) # set priv_pwd xxxx

    FGT1 (snmp_test) # end

    FGT1 #

    In the GUI, go to

    System -> SNMP, under SNMPv3, click on "Create New" button. Select

    "Authentication" and choose SHA256 as Authentication algorithm. Click

    "Change" to type in the password. Also select option "Private", choose AES256

    as Encryption Algorithm. Click on Change to change the password. Click "OK"

    to add the new user. Click apply to apply the new setting into the current

    config.'
  checks:
  - type: sql
    command: 'show

      config system snmp sysinfo'
    severity: medium
    info: "From CLI, check to make sure that there is not any community for SNMPv1 or\nSNMPv2c and only SNMPv3 users are there.\
      \ Also make sure that SNMP Agent is\nenabled.\nFGT1 # config system snmp sysinfo\nFGT1 (sysinfo) # show\nconfig system\
      \ snmp sysinfo\n set status enable\n ...\nend\nFGT1 (sysinfo) # end\nFGT1 # config system snmp community\nFGT1 (community)\
      \ # show\nconfig system snmp community\nend\nFGT1 (community)"
- id: '2.4'
  title: Administrators and Admin Profiles 2.4.1 Ensure default 'admin' password is changed
  scoring: manual
  profile:
  - Level 1
  description: Before deploying any new FortiGate, it is important to change the password of the default admin account. It
    is also recommended that you change even the user name of the default admin account; however, since you cannot change
    the user name of an account that is currently in use, a second administrator account must be created in order to do this.
  rationale: Default credentials are well documented by most vendors including Fortinet. Therefore, it will be one of the
    first things that will be tried to illegally gain access to the system.
  impact: if not changed, then any scripts that use default credentials will be able to access the system.
  references:
  - 1. https://kb.fortinet.com/kb/documentLink.do?externalID=FD48763
  - 2. https://docs.fortinet.com/document/fortigate/6.2.0/cookbook/99980/defaultadministrator-password
  page_start: 50
  audit_raw: 'Using both CLI and GUI, in the username field put in "admin", leave the password field

    blank and proceed. If it''s checked out, it means that the default password is still in place

    and needs to be changed.'
  remediation: 'In the CLI, to change the password of account "admin"

    FG1 # config system admin

    FG1 (admin) # edit "admin"

    FG1 (admin) # set password <your passwords>

    FG1 (admin) # end

    FG1 #

    To change the default password in the GUI:

    1) Login to FortiGate with admin account

    2) Go to System > Administrators.

    3) Edit the admin account.

    4) Click Change Password.

    5) If applicable, enter the current password in the Old Password field.

    6) Enter a password in the New Password field, then enter it again in the

    Confirm Password field.

    7) Click OK.'
  checks:
  - type: manual_review
    info: 'Using both CLI and GUI, in the username field put in "admin", leave the password field

      blank and proceed. If it''s checked out, it means that the default password is still in place

      and needs to be changed.'
    severity: medium
- id: 2.4.2
  title: Ensure all the login accounts having specific trusted hosts enabled
  scoring: manual
  profile:
  - Level 1
  description: Configure an administrative account to be accessible only to someone who is using a trusted host. You can set
    a specific IP address for the trusted host or use a subnet.
  rationale: Access to a firewall to perform administrative tasks should only come from specific network segments reserved
    for administrators only. This additional layer of security ensure that no one from anywhere else on the network able to
    login even with correct credentials.
  impact: All access, from legitimate or illegitimate users, outside of allowed segment will be stopped. Thus, administrators
    working remotely will have to make sure that they have access to jump hosts that sit in the allowed segment.
  references:
  - 1. https://docs.fortinet.com/document/fortigate/6.0.0/cookbook/222079/using-atrusted-host-optional
  page_start: 53
  audit_raw: "This example is to check if trusted hosts option is enabled for account \"test_admin\" and\nwhich trusted hosts\
    \ are in the list\nFG1 # config system admin\nFG1 (admin) # edit \"test_admin\"\nFG1 (test_admin) # show\nconfig system\
    \ admin\n edit \"test_admin\"\n ...\n set trusthost1 10.0.0.0 255.255.255.0\n set trusthost2 192.168.10.0 255.255.255.0\n\
    \ ...\n next\nend\nIn the web GUI, go to\nSystem -> Administrators, select the account and click on edit. In the\naccount\
    \ setting page, make sure that \"Restrict login to trusted hosts\" are\nenabled and all the allowed hosts / subnets are\
    \ in the list of trusted Host.\nPlease take note that certain versions of FortiOS will only show the first 3\ntrusted\
    \ hosts in the list. If you want to see more, you have to click on the\n\"+\" sign as if you're adding a new item into\
    \ the list. Keep clicking until\nyou see an empty field of trusted host. That's when you know that you have\nreached the\
    \ bottom of the list."
  remediation: 'To remove a trusted host item from the list in CLI

    FG1 # config system admin

    FG1 (admin) # edit "test_admin"

    FG1 (test_admin) # unset trusthost1

    FG1 (test_admin) # end

    FG1 #

    To add a trusted host into the list in CLI

    FG1 # config system admin

    FG1 (admin) # edit "test_admin"

    FG1 (test_admin) # set trusthost6 1.1.1.1 255.255.255.255

    FG1 (test_admin) # end

    FG1 #

    Before adding an item, please make sure that it does not already exist. For example, if

    trusthost3 is already in the list, using it again will over-ride the existing host/network.

    In the web GUI, go to

    System -> Administrators, select the account and click on edit. In the

    account setting page, make sure that "Restrict login to trusted hosts" are

    enabled and all the allowed hosts / subnets are in the list of trusted Host.

    Please take note that certain versions of FortiOS will only show the first 3

    trusted hosts in the list. If you want to see more, you have to click on the

    "+" sign as if you''re adding a new item into the list. Keep clicking until

    you see an empty field of trusted host. That''s when you know that you have

    reached the bottom of the list. To add another trusted host, fill in the

    empty field of the new "Trusted Host". To remove a trusted host, simply erase

