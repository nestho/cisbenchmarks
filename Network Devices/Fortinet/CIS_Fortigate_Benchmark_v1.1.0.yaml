- id: '3.5'
  title: Ensure firewall policy denying all traffic to/from Tor or malicious server IP addresses using ISDB
  scoring: manual
  profile:
  - Level 1
  description: Firewall policies should include a deny rule for traffic going to/from Tor or malicious server using ISDB (Internet
    Service Database).
  rationale: FortiGate includes Tor or malicious server related IP address using ISDB. The idea is to filter out malicious
    traffics using firewall policies as first level filtering. This is done without involving more resource intensive process
    such as IPS inspection, hence optimizing FortiGate's performance.
  impact: ''
  references: []
  page_start: 80
  audit_raw: 'Go to "Policy & Objects".

    Validate that there is a firewall policy created to block inbound connections from

    sources named "Tor-Exit.Node", "Tor-Relay.Node", and "Malicious-Malicious.Server" on

    "All" services.

    Validate that there is a firewall policy created to block outbound connections to

    destination named "Tor-Relay.Node" and "Malicious-Malicious.Server".'
  remediation: 'Review firewall policies and ensure there are:

    1. A firewall policy created to block inbound connections with these settings:

    From: Any

    To: Any

    Source: "Tor-Exit.Node", "Tor-Relay.Node", and "Malicious-Malicious.Server"

    Destination: all

    Schedule: Always

    Services: All

    Action: Deny

    Log Violation Traffic: Enabled

    Enable this policy: Enabled

    2. A firewall policy created to block outbound connections with these settings:

    From: Any

    To: Any

    Source: All

    Destination: "Tor-Relay.Node" and "Malicious-Malicious.Server"

    Schedule: Always

    Action: Deny

    Log Violation Traffic: Enabled

    Enable this policy: Enabled'
  checks:
  - type: manual_review
    info: 'Go to "Policy & Objects".

      Validate that there is a firewall policy created to block inbound connections from

      sources named "Tor-Exit.Node", "Tor-Relay.Node", and "Malicious-Malicious.Server" on

      "All" services.

      Validate that there is a firewall policy created to block outbound connections to

      destination named "Tor-Relay.Node" and "Malicious-Malicious.Server".'
    severity: medium
- id: '3.6'
  title: Ensure logging is enabled on all firewall policies
  scoring: manual
  profile:
  - Level 1
  description: Logging should be enabled for all firewall policies including the default implicit deny policy.
  rationale: Firewall policies should log for all traffic (both allow and deny policies). This enables SOC or security analyst
    to do further investigations on security incidents especially on threat hunting or incident response activities. Although
    there are many data sources that can provide DNS query logs (AD or EDR), but this option should be enabled out of best
    practice and with assumption that no other data sources is available.
  impact: By default, when creating firewall policies, logging option is not enabled. Also, the default implicit deny policy
    is not logged. This creates data gap in threat hunting or incident response activities.
  references: []
  page_start: 82
  audit_raw: 'Go to "Policy & Objects" > "Firewall Policy".

    Validate that logging is enabled on all firewall policies.'
  remediation: 'Review firewall policies and ensure that:

    For allowed policies, "Log Allowed Traffic" is set on "All Sessions" option

    For denied policies, "Log Violation Traffic" is enabled.'
  checks:
  - type: manual_review
    info: 'Go to "Policy & Objects" > "Firewall Policy".

      Validate that logging is enabled on all firewall policies.'
    severity: medium
