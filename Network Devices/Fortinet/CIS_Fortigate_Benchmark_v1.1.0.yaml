    \ set loggrp none\n set fwgrp custom\n set vpngrp none\n set utmgrp none\n set wifi none\n set admintimeout-override disable\n\
    \ config fwgrp-permission\n set policy none\n set address none\n set service none\n set schedule none\n end\n next\nend\n\
    FGT1 (tier_1) #\nIf the following privileges are set to \"custom\", please also check the sub-privileges of the\ncustomized\
