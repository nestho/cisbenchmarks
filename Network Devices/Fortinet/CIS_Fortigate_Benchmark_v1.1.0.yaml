- id: 4.4.1
  title: Block high risk categories on Application Control
  scoring: manual
  profile:
  - Level 1
  description: Ensure FortiGate Application Control blocks high risk application to reduce attack surface.
  rationale: High risk applications such as those in "P2P" and "Proxy" are known for spreading malwares. Other than that,
    some of these traffic is encrypted and therefore is able to bypass network security inspection (for those without decryption
    implemented). Blocking these applications from running eliminates this risk. If any application that falls under "P2P"
    and "Proxy" requires to be allowed based on organization's policy, that specific application needs to be under "Monitor"
    mode in the "Application and Filter Override" configuration.
  impact: ''
  references: []
  page_start: 98
  audit_raw: 'GUI:

    Go to "Security Profiles" > "Application Control" > select App Control

    profile

    Validate that "P2P" and "Proxy" category is blocked.'
  remediation: 'Review Application Control Security Profiles and validate that "P2P" and "Proxy"

    category is blocked.'
  checks:
  - type: manual_review
    info: 'GUI:

      Go to "Security Profiles" > "Application Control" > select App Control

      profile

      Validate that "P2P" and "Proxy" category is blocked.'
    severity: medium
- id: 4.4.2
  title: Block applications running on non-default ports
  scoring: scored
  profile:
  - Level 2
  description: Ensure FortiGate Application Control blocks applications running on non-default ports.
  rationale: Running application on non-default ports is not directly a threat, but can be an indication of something unexpected.
    For example, HTTPS runs on port 443. Potentially, if attacker starts a rogue HTTPS server on port 10443, it could be used
    for data exfiltration.
  impact: ''
  references:
  - 1. https://attack.mitre.org/techniques/T1571/
  page_start: 99
  audit_raw: 'GUI:

    Go to "Security Profiles" > "Application Control" > select App Control

    profile

    Validate that "Block applications detected on non-default ports" option is enabled.'
  remediation: 'GUI:

    Go to "Security Profiles" > "Application Control" > select App Control

    profile

    Enable "Block applications detected on non-default ports" option

    CLI:

    FGT1 # config application list

    FGT1 (list) # edit <profile name>

    FGT1 (<profile name>) # set enforce-default-app-port enable'
  checks:
  - type: manual_review
    info: 'GUI:

      Go to "Security Profiles" > "Application Control" > select App Control

      profile

      Validate that "Block applications detected on non-default ports" option is enabled.'
    severity: medium
