- id: 2.2.1
  title: Ensure 'Password Policy' is enabled
  scoring: scored
  profile:
  - Level 1
  description: It is important to use secure and complex passwords for preventing unauthorized access to the FortiGate device.
  rationale: Attackers can use Brute force password software to launch more than just dictionary attacks. such Attacks can
    discover common passwords where a letter is replaced by a number or symbol.
  impact: Weak passwords can be easily discovered by hackers which leads to unauthorized access to FortiGate and depends on
    the access privilege of the compromised account the attacker may modify the settings.
  references:
  - 1. https://kb.fortinet.com/kb/documentLink.do?externalID=FD31021
  - 2. https://docs.fortinet.com/document/fortigate/7.0.0/cli-reference/11620/configsystem-password-policy
  page_start: 39
  audit_raw: 'currently implemented password policy can be shown from GUI or CLI

    From CLI, type

    get system password-policy

    From GUI,

    Or from GUI as follows:

    1) log in to FortiGate with a user with at least read-only privileges

    2) Go to ''System'' -> ''Settings''

    3) find and check the status of the ''password Policy'' Section'
  remediation: "can be modified from CLI or GUI\nFrom CLI, do the following:\nconfig system password-policy\n set status enable\n\
    \ set apply-to admin-password ipsec-preshared-key\n set minimum-length 8\n set min-lower-case-letter 1\n set min-upper-case-letter\
    \ 1\n set min-non-alphanumeric 1\n set min-number 1\n set expire-status enable\n set expire-day 90\n set reuse-password\
    \ disable\nend\nor From GUI, do the following\n1) log in to FortiGate as Super Admin\n2) Go to 'System' -> 'Settings'\n\
    3) find the 'password Policy' Section\n4) Default 'Password scope' is 'Off', change it to 'Both'\n5) set 'Minimum length'\
    \ to '8'\n6) Enable 'Character requirements'\n7) set minimum '1' in the filed of 'Upper Case', 'Lower Case', 'Numbers\
    \ (09)' and 'Special'\n8) Disable 'Allow password reuse'\n9) Enable 'Password expiration' and set it to 90"
