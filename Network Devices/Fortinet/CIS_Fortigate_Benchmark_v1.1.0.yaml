controls:
- id: '1.1'
  title: Ensure DNS server is configured
  scoring: scored
  profile:
  - Level 1
  description: Fortinet uses the Domain Name Service (DNS) to translate host names into IP addresses. To enable DNS lookups,
    you must specify the primary DNS server for your system. You can also specify secondary and tertiary DNS servers. When
    resolving host names, the system consults the primary name server. If a failure or time-out occurs, the system consults
    the secondary name server
  rationale: The purpose is to perform the resolution of system hostnames to Internet Protocol (IP) addresses.
  impact: ''
  references:
  - 1. https://docs.fortinet.com/document/fortigate/6.4.1/administrationguide/903162/important-dns-cli-commands
  page_start: 14
  audit_raw: "In CLI:\nFGT1 # config system dns\nFGT1 (dns) # show\nconfig system dns\n set primary <ip_address>\n set secondary\
    \ <ip_address>\n ...\nend\nIn the GUI, go to Networks -> DNS. The Fortigate uses either the default FortiGuard\nDNS or\
    \ customized DNS"
  remediation: 'In this example, we will assign 8.8.8.8 as primary DNS and 8.8.4.4 as secondary DNS.

    In CLI:

    FGT1 # config system dns

    FGT1 (dns) # set primary 8.8.8.8

    FGT1 (dns) # set secondary 8.8.4.4

    FGT1 (dns) # end

    FGT1 #

    In the GUI, go to Networks -> DNS. Click on "Specify" and put in 8.8.8.8 as "Primary

    DNS Server" and 8.8.4.4 as "Secondary DNS Server"'
  checks:
  - type: sql
    command: 'show

      config system dns'
    severity: medium
    info: "In CLI:\nFGT1 # config system dns\nFGT1 (dns) # show\nconfig system dns\n set primary <ip_address>\n set secondary\
      \ <ip_address>\n ...\nend\nIn the GUI, go to Networks -> DNS. The Fortigate uses either the default FortiGuard\nDNS\
      \ or customized DNS"
- id: '1.2'
  title: Ensure intra-zone traffic is not always allowed
  scoring: manual
  profile:
  - Level 1
  description: This is to make sure that only specific, authorized traffic are allowed between networks in the same zone.
  rationale: This adds an extra layer of protection between different networks
  impact: ''
  references:
  - 1. https://docs.fortinet.com/document/fortigate/6.2.0/cookbook/116821/zone
  page_start: 16
  audit_raw: "In this example, we'll verify the zone DMZ.\nIn CLI:\nFGT1 # config system zone\nFGT1 (zone) # edit DMZ\nFGT1\
    \ (DMZ) # show full\nconfig system zone\n edit \"DMZ\"\n ...\n set intrazone deny\n ...\n next\nend\nIn the GUI, click\
    \ on Network -> Interfaces, select the zone and click on \"Edit\". Make\nsure that the option \"Block intra-zone traffic\"\
    \ is enabled."
  remediation: 'In this example, we''ll turn of intra-zone traffic in the zone DMZ.

    In CLI:

    FGT1 # config system zone

    FGT1 (zone) # edit DMZ

    FGT1 (DMZ) # set intrazone deny

    FGT1 (DMZ) # end

    FGT1 #

    In the GUI, click on Network -> Interfaces, select the zone and click on "Edit" and turn

    on "Block intra-zone traffic"'
  checks:
  - type: sql
    command: show full
    severity: medium
    info: "In this example, we'll verify the zone DMZ.\nIn CLI:\nFGT1 # config system zone\nFGT1 (zone) # edit DMZ\nFGT1 (DMZ)\
      \ # show full\nconfig system zone\n edit \"DMZ\"\n ...\n set intrazone deny\n ...\n next\nend\nIn the GUI, click on\
      \ Network -> Interfaces, select the zone and click on \"Edit\". Make\nsure that the option \"Block intra-zone traffic\"\
      \ is enabled."
- id: '1.3'
  title: Disable all management related services on WAN port
  scoring: manual
  profile:
  - Level 1
  description: Enabling any management related services on WAN interface is high risk. Management related services such as
    HTTPS, HTTP, ping, SSH, SNMP, and Radius should be disabled on WAN.
  rationale: Management related services should only be enabled on management interface. This is part of defending the firewall
    from attacks and reducing attack surface. For WAN related services such as IPSec and SSLVPN, make use of local-in-policy
    (refer to CIS Section 2.4) to tighten firewall defenses.
  impact: Enabling management related services on WAN port is convenient but it exposes the firewall to unnecessary risks.
    Vulnerabilities found on vendor devices are commonly related to management services and opening access to these allows
    attackers to exploit its vulnerabilities.
  references: []
  page_start: 18
  audit_raw: 'On GUI:

    Go to "Network" > "Interfaces".

    Identify WAN interface and validate that HTTPS, HTTP, PING, SSH, SNMP, and

    Radius Accounting is not enabled in "Administrative Access" section.

    On CLI:

    `FGT1 # show system interface`

    Identify WAN interface and validate that "set allowaccess" does not have ping, https,

    http, ssh, snmp or radius-acct configured.'
  remediation: 'On GUI:

    Go to "Network" > "Interfaces".

    Review WAN interface and disable HTTPS, HTTP, ping, SSH, SNMP, and Radius

    services.

    On CLI:

    FGT1 # config system interface

    FGT1 (interface) # edit "port1"

    FGT1 (port1) # unselect allowaccess ping https ssh snmp http radius-acct

    Note:

    1. Interface name may differ based on deployment. For this example, port1 is

    deployed as WAN interface.

    2. "unselect allowaccess" will only show services that you have enabled. If you

    have not enabled snmp on that interface, then snmp option will not be available.

    2 System Settings

    This topic contains information and best practices about FortiGate administration and

    system configuration.'
  checks:
  - type: sql
    command: show system interface`
    severity: medium
    info: 'On GUI:

      Go to "Network" > "Interfaces".

      Identify WAN interface and validate that HTTPS, HTTP, PING, SSH, SNMP, and

      Radius Accounting is not enabled in "Administrative Access" section.

      On CLI:

      `FGT1 # show system interface`

      Identify WAN interface and validate that "set allowaccess" does not have ping, https,

      http, ssh, snmp or radius-acct configured.'
- id: '2.1'
  title: General Settings 2.1.1 Ensure 'Pre-Login Banner' is set
  scoring: scored
  profile:
  - Level 1
  description: Configure a pre-login banner, ideally approved by the organization’s legal team. This banner should, at minimum,
    prohibit unauthorized access, provide notice of logging or monitoring, and avoid using the word “welcome” or similar words
    of invitation.
  rationale: Through a properly stated login banner, the risk of unintentional access to the device by unauthorized users
    is reduced. Should legal action take place against a person accessing the device without authorization, the login banner
    greatly diminishes a defendant’s claim of ignorance.
  impact: Login banners provide a definitive warning to any possible intruders that may want to access the FortiGate that
    certain types of activity are illegal, but at the same time, it also advises the authorized and legitimate users of their
    obligations relating to acceptable use.
  references:
  - 1. https://kb.fortinet.com/kb/documentLink.do?externalID=FD33887
  page_start: 20
  audit_raw: "Run the following command in the CLI to verify the pre-login-banner is enabled:\nFG1 # get system global\n ...\n\
    \ pre-login-banner : enable\n ...\nend\nIn the GUI, to verify the content of the pre-login disclaimer message:\n1) go\
    \ to 'System' -> 'Replacement Messages'\n2) from the top right side, select 'Extended View'\n3) find 'Pre-login Disclaimer\
    \ Message'"
  remediation: 'Run the following command in the CLI to enable the pre-login-banner:

    FG1 # config system global

    FG1 (global) # set pre-login-banner enable

    FG1 (global) # end

    FG1 #

    In the GUI, to edit the content of the pre-login disclaimer message:

    1. go to ''System'' -> ''Replacement Messages'' -> ''Extended View'' -> ''Pre-login

    Disclaimer Message''. The edit screen is on the bottom right corner of the page.

    Click on "Save" after the editing is done.'
  checks:
  - type: manual_review
    info: "Run the following command in the CLI to verify the pre-login-banner is enabled:\nFG1 # get system global\n ...\n\
      \ pre-login-banner : enable\n ...\nend\nIn the GUI, to verify the content of the pre-login disclaimer message:\n1) go\
      \ to 'System' -> 'Replacement Messages'\n2) from the top right side, select 'Extended View'\n3) find 'Pre-login Disclaimer\
      \ Message'"
    severity: medium
- id: 2.1.2
  title: Ensure 'Post-Login-Banner' is set
  scoring: scored
  profile:
  - Level 1
  description: Sets the banner after users successfully login. This is equivalent to Message of the Day (MOTD) in some other
    systems.
  rationale: Network banners are electronic messages that provide notice of legal rights to users of computer networks. From
    a legal standpoint, banners have four primary functions. First, banners may be used to generate consent to real-time monitoring
    under Title III. Second, banners may be used to generate consent to the retrieval of stored files and records pursuant
    to ECPA. Third, in the case of government networks, banners may eliminate any Fourth Amendment "reasonable expectation
    of privacy" that government employees or other users might otherwise retain in their use of the government's network under
    O'Connor v.
  impact: When post-login banner is enabled, some automated-script might be affected because both CLI and GUI need an acceptance
    action (press "A" or "Accept") to continue.
  references:
  - 1. https://kb.fortinet.com/kb/documentLink.do?externalID=FD33887
  page_start: 23
  audit_raw: "Run the following command in the CLI to verify the post-login-banner is enabled:\nFG1 # get system global\n\
    \ ...\n post-login-banner : enable\n ...\nIn the GUI, to verify the content of the post-login disclaimer message:\n1)\
    \ go to 'System' -> 'Replacement Messages'\n2) from the top right side, select 'Extended View'\n3) find 'Post-login Disclaimer\
    \ Message'"
  remediation: 'Run the following command in the CLI to enable the post-login-banner:

    FG1 # config system global

    FG1 (global) # set post-login-banner enable

    FG1 (global) # end

    FG1 #

    In the GUI, to edit the content of the post-login disclaimer message, go to

    System -> Replace Messages -> Extended View -> "Post-login Disclaimer

    Message". The edit screen is on the bottom right corner of the page. Click

    on "Save" after the editing is done.'
  checks:
  - type: manual_review
    info: "Run the following command in the CLI to verify the post-login-banner is enabled:\nFG1 # get system global\n ...\n\
      \ post-login-banner : enable\n ...\nIn the GUI, to verify the content of the post-login disclaimer message:\n1) go to\
      \ 'System' -> 'Replacement Messages'\n2) from the top right side, select 'Extended View'\n3) find 'Post-login Disclaimer\
      \ Message'"
    severity: medium
- id: 2.1.3
  title: Ensure timezone is properly configured
  scoring: manual
  profile:
  - Level 1
  description: Sets the local time zone information so that the time displayed by the device is more relevant to those who
    are viewing it.
  rationale: Having a correct time set on the device is important for two main reasons. The first reason is that digital certificates
    compare this time to the range defined by their Valid From and Valid To fields to define a specific validity period. The
    second reason is to have relevant time stamps when logging information. Whether you are sending messages to a Syslog server,
    sending messages to an SNMP monitoring station, or performing packet captures, timestamps have little usefulness if you
    cannot be certain of their accuracy.
  impact: For many features to work, including scheduling, logging, and SSL-dependent features, the FortiOS system time must
    be accurate.
  references:
  - 1. https://kb.fortinet.com/kb/documentLink.do?externalID=FD49018
  - 2. https://docs.fortinet.com/document/fortigate/6.2.0/cookbook/512210/setting-thesystem-time
  page_start: 25
  audit_raw: 'In the CLI, do the following command and check the result of timezone filed in the

    output

    FGT1 # get system global

    ...

    timezone : (GMT-8:00) Pacific Time (US & Canada)

    ...

    Or from GUI, do the following:

    1) login to FortiGate

    2) Go to ''System'' -> ''Settings''.

    3) Time Zone and NTP settings are under ''System Time'''
  remediation: 'In this example, we will set Eastern Timezone (GMT-5:00) for the Fortigate. Each

    timezone will have its corresponding ID. To find the correct ID, when you type in the

    command "set timezone ", also type the question mark ''?'' to list all of the available

    timezones and their IDs. The ID of the Eastern Timezone is 12

    In the CLI:

    FGT1 # config system global

    FGT1 (global) # set timezone 12

    FGT1 (global) # end

    FGT1 #

    In the GUI, do the following:

    1) after login to fortigate, go to ''System'' -> ''Settings''

    2) select ''(GMT-5:00) Eastern Time (US & Canada)'' under ''System Time'''
  checks:
  - type: manual_review
    info: 'In the CLI, do the following command and check the result of timezone filed in the

      output

      FGT1 # get system global

      ...

      timezone : (GMT-8:00) Pacific Time (US & Canada)

      ...

      Or from GUI, do the following:

      1) login to FortiGate

      2) Go to ''System'' -> ''Settings''.

      3) Time Zone and NTP settings are under ''System Time'''
    severity: medium
- id: 2.1.4
  title: Ensure correct system time is configured through NTP
  scoring: scored
  profile:
  - Level 1
  description: You can either manually set the FortiOS system time, or configure the device to automatically keep its system
    time correct by synchronizing with a Network Time Protocol (NTP) server. These settings enable the use of primary and
    secondary NTP servers to provide redundancy in case of a failure involving the primary NTP server.
  rationale: NTP enables the device to maintain accurate time and date when receiving updates from a reliable NTP server.
    Accurate timestamps are critical when correlating events with other systems, troubleshooting, or performing investigative
    work. Logs and certain cryptographic functions, such as those utilizing certificates, rely on accurate time and date parameters.
    In addition, rules referencing a Schedule object will not function as intended if the device’s time and date are incorrect.
    For additional security, authenticated NTP can be utilized. If Symmetric Key authentication is selected, only SHA1 should
    be used, as MD5 is considered severely compromised.
  impact: For many features to work, including scheduling, logging, and SSL-dependent features, the FortiOS system time must
    be accurate.
  references:
  - 1. https://docs.fortinet.com/document/fortigate/6.2.0/cookbook/512210/setting-thesystem-time
  - 2. https://kb.fortinet.com/kb/documentLink.do?externalID=FD49018
  page_start: 27
  audit_raw: "In the CLI:\nFGT1 # diag sys ntp status\nsynchronized: yes, ntpsync: enabled, server-mode: enabled\nipv4 server(ntp2.fortiguard.com)\
    \ 208.91.114.23 -- reachable(0xff) S:3 T:54\n server-version=4, stratum=1\n reference time is e12361d5.f27e0322 -- UTC\
    \ Wed Sep 11 12:06:45 2019\n clock offset is -0.001569 sec, root delay is 0.000000 sec\n root dispersion is 0.010269 sec,\
    \ peer dispersion is 19 msec\nipv4 server(ntp1.fortiguard.com) 208.91.115.123 -- reachable(0xff) S:3 T:54\nselected\n\
    \ server-version=4, stratum=1\n reference time is e12361d4.4f8b22a5 -- UTC Wed Sep 11 12:06:44 2019\n clock offset is\
    \ -0.000652 sec, root delay is 0.000000 sec\n root dispersion is 0.010284 sec, peer dispersion is 8 msec\nipv4 server(ntp2.fortiguard.com)\
    \ 208.91.113.71 -- reachable(0xff) S:3 T:54\n server-version=4, stratum=2\n reference time is e12361d6.4caf57ab -- UTC\
    \ Wed Sep 11 12:06:46 2019\n clock offset is -0.004814 sec, root delay is 0.000137 sec\n root dispersion is 0.011154 sec,\
    \ peer dispersion is 3 msec\nipv4 server(ntp1.fortiguard.com) 208.91.113.70 -- reachable(0xff) S:3 T:54\n server-version=4,\
    \ stratum=2\n reference time is e123617b.c98e2059 -- UTC Wed Sep 11 12:05:15 2019\n clock offset is -0.005106 sec, root\
    \ delay is 0.000122 sec\n root dispersion is 0.013382 sec, peer dispersion is 6 msec"
  remediation: 'You can only customize NTP setting using CLI. In this example, we''ll assign

    pool.ntp.org as primary NTP server and 1.1.1.1 as secondary NTP server.

    FGT1 # config system ntp

    FGT1 (ntp) # set type custom

    FGT1 (ntp) # config ntpserver

    FGT1 (ntpserver) # edit 1

    FGT1 (1) # set server pool.ntp.org

    FGT1 (1) # next

    FGT1 (ntpserver) # edit 2

    FGT1 (2) # set server 1.1.1.1

    FGT1 (2) # end

    FGT1 (ntp) # end

    FGT1 #'
  checks:
  - type: manual_review
    info: "In the CLI:\nFGT1 # diag sys ntp status\nsynchronized: yes, ntpsync: enabled, server-mode: enabled\nipv4 server(ntp2.fortiguard.com)\
      \ 208.91.114.23 -- reachable(0xff) S:3 T:54\n server-version=4, stratum=1\n reference time is e12361d5.f27e0322 -- UTC\
      \ Wed Sep 11 12:06:45 2019\n clock offset is -0.001569 sec, root delay is 0.000000 sec\n root dispersion is 0.010269\
      \ sec, peer dispersion is 19 msec\nipv4 server(ntp1.fortiguard.com) 208.91.115.123 -- reachable(0xff) S:3 T:54\nselected\n\
      \ server-version=4, stratu"
    severity: medium
- id: 2.1.5
  title: Ensure hostname is set
  scoring: scored
  profile:
  - Level 1
  description: Changes the device default hostname.
  rationale: The device hostname plays an important role in asset inventory and identification as a security requirement,
    but also in the public keys and certificate deployments as well as when correlating logs from different systems during
    an incident handling.
  impact: ''
  references:
  - 1. https://kb.fortinet.com/kb/documentLink.do?externalID=FD48765
  page_start: 30
  audit_raw: "In CLI\nget system global\n ...\n hostname : FG1\n ...\nIn GUI, go to 'System' -> 'Settings', check the field\
    \ 'Hostname'"
  remediation: 'In CLI, set the hostname to ''New_FGT1'' as follows:

    FGT1 # config system global

    FGT1 (global) # set hostname "New_FGT1"

    FGT1 (global) # end

    New_FGT1 #

    or In GUI, go to ''System'' -> ''Settings'', update the field ''Hostname'' with the new

    hostname, and click "Apply"'
  checks:
  - type: manual_review
    info: "In CLI\nget system global\n ...\n hostname : FG1\n ...\nIn GUI, go to 'System' -> 'Settings', check the field 'Hostname'"
    severity: medium
- id: 2.1.6
  title: Ensure the latest firmware is installed
  scoring: manual
  profile:
  - Level 2
  description: Check against Fortinet website to make sure that the latest stable firmware is installed.
  rationale: Fortinet periodically updates the FortiGate firmware to include new features and resolve important issues. After
    you have registered your FortiGate unit, firmware updates can be downloaded from the Fortinet Customer Service & Support
    website. It is important to constantly keep the firmware up-to-date to prevent any new well-known exploitation.
  impact: ''
  references:
  - 1. https://kb.fortinet.com/kb/documentLink.do?externalID=10948
  page_start: 32
  audit_raw: 'First, check for the latest firmware version available by going to

    https://docs.fortinet.com/upgrade-tool, select your product from the Current Product

    drop-down menu then select the upgrade to FortiOS Version which will gives you the

    latest version available.

    Second, verify the current firmware on your system.

    In the CLI:

    FGT1 # get system status

    ...

    Version: Fortigate-100D v6.2.7,build1190,201216 (GA)

    ...

    FGT1 #

    In the GUI:

    go to Dashboard -> Status -> System information and check for Firmware.

    At the same time, go to https://www.fortiguard.com/psirt?product=FortiOS and check for

    vulnerabilities that your existing version might have.'
  remediation: 'First, determine the upgrade path recommended by Fortinet. If you have not upgraded

    the system for a long time, it is not recommended to upgrade straight to the latest

    version as the configuration could be lost. Fortinet provides a tool to recommend an

    upgrade path for all of its products.

    Go to https://docs.fortinet.com/upgrade-tool. Choose your product from the "Current

    Product" drop-down menu, the "current FortiOS version", and the latest firmware

    version available for that model from "Upgrade to FortiOS Version". Click "Go". Write

    down the path and then click on "Download" to download all the necessary versions.

    The second step is to download the required FortiOS firmware/s. Go to

    https://support.fortinet.com and login. Go to Support -> Firmware Download. Once

    there, select the product and click on "Upgrade Path". Choose the specific model of the

    hardware, the current firmware version and the latest firmware version available for that

    model. Click "Go". Write down the path and then click on "Download" to download all

    the necessary versions.

    The last step is to install the new firmwares in the order provided by the "Upgrade tool".

    It is recommended to use GUI to perform this task as it would be much easier.

    In the GUI, click on

    System -> Firmware, then click on "Browse" to select the next firmware file.

    Then click on "Upgrade". You might have to perform this step multiple times

    if you follow the upgrade path.'
  checks:
  - type: sql
    command: select your product from the Current Product
    severity: medium
    info: 'First, check for the latest firmware version available by going to

      https://docs.fortinet.com/upgrade-tool, select your product from the Current Product

      drop-down menu then select the upgrade to FortiOS Version which will gives you the

      latest version available.

      Second, verify the current firmware on your system.

      In the CLI:

      FGT1 # get system status

      ...

      Version: Fortigate-100D v6.2.7,build1190,20121'
