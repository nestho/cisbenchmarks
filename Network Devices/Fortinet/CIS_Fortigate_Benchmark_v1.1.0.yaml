    disabled and logged.
  rationale: By reviewing policies regularly, we can determine if the policies are still needed by the business purpose. Thus,
    we can keep the firewall policies lean and efficient. It also prevents traffic being allowed or blocked accidently.
  impact: ''
  references:
  - 1. https://kb.fortinet.com/kb/documentLink.do?externalID=FD44631
  page_start: 75
  audit_raw: 'In CLI, type "diag firewall iprope show 100004 <policy_id>". In this example, we''ll verify

    policy with ID of 32. We''ll also need to clear the counter after each review so that we

    can tell if the policy is still being used for the next review :

    FGT1 # diag firewall iprope show 100004 32

    idx=2 pkts/bytes=144967/135758174 asic_pkts/asic_bytes=0/0 flag=0x0 hit

    count:663

    FGT1 # diag firewall iprope clear 100004 32

