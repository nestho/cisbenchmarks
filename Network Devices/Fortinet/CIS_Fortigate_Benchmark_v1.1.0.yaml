- id: 4.3.2
  title: Ensure DNS Filter logs all DNS queries and responses
  scoring: manual
  profile:
  - Level 1
  description: DNS filter should log all DNS queries and responses.
  rationale: DNS filter should log all DNS queries and responses (whether if the DNS category is blocked, monitored, or allowed).
    This enables SOC or security analyst to do further investigations on security incidents especially on threat hunting or
    incident response activities. Although there are many data sources that can provide DNS query logs (AD or EDR), but this
    option should be enabled out of best practice and with assumption that no other data sources is available.
  impact: By default, allowed DNS is not logged. This creates data gap in threat hunting or incident response activities.
  references:
  - 1. https://community.fortinet.com/t5/FortiGate/Technical-Tip-FortiGate-Static-DNSfilter-behavior-in-logging/ta-p/223110
  page_start: 95
  audit_raw: 'GUI:

    Go to "Security Profiles" > "DNS Filter" > select DNS Filter profile

    Validate that "Log all DNS queries and responses" is enabled.

    CLI:

    FGT1 # config dnsfilter profile

    FGT1 (profile) # show

    Validate that "set log-all-domain enable" is configured on DNS Filter profile.'
  remediation: 'Review DNS Filter Security Profiles and validate that "Log all DNS queries and

    responses" is enabled.'
  checks:
