controls:
- id: 1.1.1
  title: Ensure administrator password retries and lockout time are configured
  scoring: scored
  profile:
  - Level 1
  description: Failed login attempts can indicate malicious attempts to gain access to your network. To prevent this security
    risk, FortiSwitch is preconfigured to limit the number of failed administrator login attempts. After the maximum number
    of failed login attempts is reached, access to the account is blocked for the configured lockout period.
  rationale: When you log in and fail to enter the correct password, you could potentially be a valid user or a hacker attempting
    to gain access. For this reason, best practice dictates limiting the number of failed login attempts before a lockout
    period in which you cannot log in for a certain period of time. Lockout period will minimize hacker attempts to gain access
    to the firewall.
  impact: Attackers will keep attempting to access the device through brute force attacks without any interruption, which
    may lead to a successful login.
  references:
  - 1. https://docs2.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-clireference/500379/config-system#config15
  page_start: 17
  audit_raw: 'To check the lockout options, from CLI:

    get system global

    From the output, check the value of the below fields:

    1. admin-lockout-threshold

    2. admin-lockout-duration

    Ensure that admin-lockout-threshold is set at 3 or less and admin-lockoutduration is set at 900 or less'
  remediation: 'To configure the lockout options, from CLI:

    config system global

    set admin-lockout-threshold 3

    set admin-lockout-duration 900

    end

    Lockout affects the offending IP address, not the entire account.'
  checks:
  - type: manual_review
    info: 'To check the lockout options, from CLI:

      get system global

      From the output, check the value of the below fields:

      1. admin-lockout-threshold

      2. admin-lockout-duration

      Ensure that admin-lockout-threshold is set at 3 or less and admin-lockoutduration is set at 900 or less'
    severity: medium
- id: 1.1.2
  title: Ensure 'Pre-Login Banner' is set
  scoring: scored
  profile:
  - Level 1
  description: Configure a pre-login banner, ideally approved by the organization’s legal team. This banner should, at minimum,
    prohibit unauthorized access, provide notice of logging or monitoring, and avoid using the word “welcome” or similar words
    of invitation.
  rationale: Through a properly stated login banner, the risk of unintentional access to the device by unauthorized users
    is reduced. Should legal action take place against a person accessing the device without authorization, the login banner
    greatly diminishes a defendant’s claim of ignorance.
  impact: Login banners provide a definitive warning to any possible intruders who may want to access the FortiSwitch that
    certain types of activity are illegal. At the same time, it also advises the authorized and legitimate users of their
    obligations relating to acceptable use.
  references:
  - 1. https://docs2.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-clireference/500379/config-system#config15
  page_start: 19
  audit_raw: 'Run the following command in the CLI to verify the pre-login-banner is enabled:

    FSW1 # get system global

    ...

    pre-login-banner : <Message for the system pre-login banner.>

    ...

    end'
  remediation: 'Run the following command in the CLI to enable the pre-login-banner:

    FSW1 # config system global

    FSW1 (global) # set pre-login-banner <Enter a message for the system pre-login

    banner.>

    FSW1 (global) # end

    FSW1 #'
  checks:
  - type: manual_review
    info: 'Run the following command in the CLI to verify the pre-login-banner is enabled:

      FSW1 # get system global

      ...

      pre-login-banner : <Message for the system pre-login banner.>

      ...

      end'
    severity: medium
- id: 1.1.3
  title: Ensure 'Post-Login-Banner' is set
  scoring: scored
  profile:
  - Level 1
  description: Sets the banner after users successfully log in. This is equivalent to Message of the Day (MOTD) in some other
    systems.
  rationale: 'Network banners are electronic messages that provide notice of legal rights to users of computer networks. From
    a legal standpoint, banners have four primary functions: First, banners may be used to generate consent to real-time monitoring
    under Title III. Second, banners may be used to generate consent to the retrieval of stored files and records pursuant
    to ECPA. Third, in the case of government networks, banners may eliminate any Fourth Amendment "reasonable expectation
    of privacy" that government employees or other users might otherwise retain in their use of the government''s network
    under O''Connor v.'
  impact: When post-login banner is enabled, some automated-script might be affected because both CLI and GUI need an acceptance
    action (press "A" or "Accept") to continue.
  references:
  - 1. https://docs2.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-clireference/500379/config-system#config15
  page_start: 21
  audit_raw: 'Run the following command in the CLI to verify the post-login-banner is enabled:

    FSW1 # get system global

    ...

    post-login-banner : <Message for the system post-login banner.>

    ...'
  remediation: 'Run the following command in the CLI to enable the post-login-banner:

    FSW1 # config system global

    FSW1 (global) # set post-login-banner <Enter a message for the system post-login

    banner.>

    FSW1 (global) # end

    FSW1 #'
  checks:
  - type: manual_review
    info: 'Run the following command in the CLI to verify the post-login-banner is enabled:

      FSW1 # get system global

      ...

      post-login-banner : <Message for the system post-login banner.>

      ...'
    severity: medium
- id: 1.2.1
  title: Ensure management GUI listens on secure TLS version
  scoring: scored
  profile:
  - Level 1
  description: As we move towards better encryption capabilities, we need to also ensure GUI access is properly secured. TLS
    1.3 is currently the most secure SSL/TLS supported version for SSL-encrypted administrator access (at this time of writing).
  rationale: Use higher version of SSL/TLS to prevent MiTM attacks.
  impact: ''
  references:
  - 1. https://docs2.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-clireference/500379/config-system#config35
  page_start: 24
  audit_raw: 'CLI:

    config system web

    get

    Verify if set https-ssl-versions tlsv1-3 is configured.'
  remediation: 'CLI:

    config system web

    set https-ssl-versions tlsv1-3

    end'
  checks:
  - type: manual_review
    info: 'CLI:

      config system web

      get

      Verify if set https-ssl-versions tlsv1-3 is configured.'
    severity: medium
- id: 1.3.1
  title: Ensure 'Password Policy' is enabled
  scoring: scored
  profile:
  - Level 1
  description: It is important to use secure and complex passwords for preventing unauthorized access to the FortiSwitch device.
  rationale: Attackers can use brute force password software to launch more than just dictionary attacks. Such attacks can
    discover common passwords where a letter is replaced by a number or symbol. Center for Internet Security (CIS) recommends
    that passwords should be at least 14 characters long with no limit on the enforced maximum number of characters
  impact: Weak passwords can be easily discovered by hackers, which leads to unauthorized access to FortiGate. Depending on
    the access privilege of the compromised account, the attacker may modify important settings.
  references:
  - 1. https://pages.nist.gov/800-63-4/sp800-63b.html
  - 2. https://docs2.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-clireference/500379/config-system#config19
  page_start: 26
  audit_raw: 'Currently implemented password policy can be shown from CLI

    From CLI, type:

    get system password-policy

    The recent update by NIST on password policy has shifted focus to password length,

    since longer passwords are harder to crack with brute-force attacks. Not enforcing

    password complexity such as symbols and numbers can be easier for users to

    remember without being predictable.

    NIST also is now recommending password resets in the case of a credential breach

    only.'
  remediation: 'Can be modified from CLI.

    From CLI, do the following:

    config system password-policy

    set status enable

    set apply-to admin-password ipsec-preshared-key

    set minimum-length 14

    end'
  checks:
  - type: manual_review
    info: 'Currently implemented password policy can be shown from CLI

      From CLI, type:

      get system password-policy

      The recent update by NIST on password policy has shifted focus to password length,

      since longer passwords are harder to crack with brute-force attacks. Not enforcing

      password complexity such as symbols and numbers can be easier for users to

      remember without being predictable.

      NIST also is now recommending password resets in the case of a credential breach

      only.'
    severity: medium
- id: 1.4.1.1
  title: Ensure DNS server is configured
  scoring: scored
  profile:
  - Level 1
  description: Fortinet uses the Domain Name Service (DNS) to translate host names into IP addresses. To enable DNS lookups,
    you must specify the primary DNS server for your system. You can also specify secondary and tertiary DNS servers. When
    resolving host names, the system consults the primary name server. If a failure or time-out occurs, the system consults
    the secondary name server. For security purpose, trusted DNS servers should be configured to prevent man-in-themiddle
    attacks.
  rationale: The purpose is to perform the resolution of system hostnames to Internet Protocol (IP) addresses using trusted
    DNS servers.
  impact: ''
  references:
  - 1. https://docs2.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-clireference/500379/config-system#config13
  page_start: 29
  audit_raw: "In CLI:\nFSW1 # config system dns\nFSW1 (dns) # show\nconfig system dns\n set primary <ip_address>\n set secondary\
    \ <ip_address>\n ...\nend\nIn the GUI, go to System > Network > DNS. The FortiSwitch uses either the default\nFortiGuard\
    \ DNS or customized DNS."
  remediation: 'In this example, we will assign 8.8.8.8 as primary DNS and 8.8.4.4 as secondary DNS.

    In CLI:

    FSW1 # config system dns

    FSW1 (dns) # set primary 8.8.8.8

    FSW1 (dns) # set secondary 8.8.4.4

    FSW1 (dns) # end

    FSW1 #

    In the GUI, go to System > Network > DNS. Click on "Specify" and put in 8.8.8.8 as

    "Primary DNS Server" and 8.8.4.4 as "Secondary DNS Server"'
  checks:
  - type: sql
    command: 'show

      config system dns'
    severity: medium
    info: "In CLI:\nFSW1 # config system dns\nFSW1 (dns) # show\nconfig system dns\n set primary <ip_address>\n set secondary\
      \ <ip_address>\n ...\nend\nIn the GUI, go to System > Network > DNS. The FortiSwitch uses either the default\nFortiGuard\
      \ DNS or customized DNS."
- id: 1.4.2.1
  title: Disable unsecure management services on Management, SVI, or Loopback interfaces
  scoring: manual
  profile:
  - Level 1
  description: Only secure management related services such as HTTPS, PING, SSH, SNMP, and RADIUS should be used on management
    interfaces.
  rationale: Secure management related services should only be enabled on management interface.
  impact: ''
  references:
  - 1. https://docs.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-administrationguide/95390/example-configurations
  page_start: 32
  audit_raw: 'On GUI:

    Go to "System" > "Network" > "Interface".

    Select a Physical, VLAN, or Loopback interface and validate that HTTP and Telnet

    is not enabled in "Administration/Access" section.

    On CLI:

    `FSW1 # show system interface`

    Identify an interface and validate that "set allowaccess" does not include http or telnet.'
  remediation: 'On GUI:

    Go to "System" > "Network" > "Interface".

    Review the Physical, VLAN, or Loopback interface and disable HTTP and Telnet

    services.

    On CLI:

    FSW1 # config system interface

    FSW1 (interface) # edit "mgmt"

    FSW1 (port1) # set allowaccess https ping ssh snmp

    Note:

    1. Interface name may differ based on deployment. For this example, mgmt is a

    switch with a dedicated management interface. Switches without a management

    interface this would be set to "internal".'
  checks:
  - type: sql
    command: Select a Physical, VLAN, or Loopback interface and validate that HTTP and Telnet
    severity: medium
    info: 'On GUI:

      Go to "System" > "Network" > "Interface".

      Select a Physical, VLAN, or Loopback interface and validate that HTTP and Telnet

      is not enabled in "Administration/Access" section.

      On CLI:

      `FSW1 # show system interface`

      Identify an interface and validate that "set allowaccess" does not include http or telnet.'
- id: 1.4.2.2
  title: Ensure only encrypted access channels are enabled
  scoring: manual
  profile:
  - Level 1
  description: Allow only HTTPS access to the GUI and SSH access to the CLI.
  rationale: By only allowing encrypted access, we are making it harder to use "Man in the Middle" attacks to sniff login
    credentials.
  impact: ''
  references:
  - 1. https://docs.fortinet.com/document/fortigate/7.4.5/administration-guide/574723
  page_start: 34
  audit_raw: 'In the CLI, when verifying the network interface, make sure that http and telnet are not

    in the allowaccess list:

    FG1 # config system interface

    FG1 (interface) # edit port1

    FG1 (port1) # show

    config system interface

    edit "port1"

    ...

    set allowaccess ssh https ping snmp

    ...

    next

    end

    In the web GUI, click on:

    1. Network > Interfaces, select the interface and click "Edit".

    2. In the interface setting page, make sure that HTTP and Telnet are not selected

    in the section "Administrative Access"'
  remediation: 'If HTTP or Telnet is in the allowaccess list, you will have to set that list again with the

    same elements except for http or telnet.

    On CLI:

    FG1 # config system interface

    FG1 (interface) # edit port1

    FG1 (port1) # set allowaccess ssh https ping snmp

    FG1 (port1) # end

    FG1 #

    In the web GUI, click on:

    1. Network > Interfaces, select the interface and click "Edit".

    2. In the interface setting page, uncheck HTTP and Telnet in the section

    "Administrative Access".'
  checks:
  - type: sql
    command: 'show

      config system interface'
    severity: medium
    info: 'In the CLI, when verifying the network interface, make sure that http and telnet are not

