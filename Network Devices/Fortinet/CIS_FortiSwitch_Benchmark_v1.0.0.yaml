      \n set comments ''\n set secfabgrp read\n set ftviewgrp read\n set authgrp none\n set sysgrp none\n set netgrp read\n\
      \ set loggrp none\n set fwgrp custom\n set vpngrp none\n set utmgrp non"
- id: 1.7.1.1.4
  title: Ensure Admin idle timeout time is configured
  scoring: scored
  profile:
  - Level 1
  description: The idle timeout period is the amount of time that an administrator will stay logged in to the GUI without
    any activity.
  rationale: Best practice dictates setting admin idle timeout to prevent the risk of unauthorized access to the device, such
    as someone using a logged-in GUI on a PC that has been left unattended. For security reasons, the Center for Internet
    Security (CIS) recommends that administrator sessions should automatically timeout after a period of inactivity, with
    a maximum recommended time of 15 minutes or less
  impact: This is to prevent someone from accessing the FortiGate if the management PC is left unattended.
  references:
  - 1. https://docs.fortinet.com/document/fortigate/7.4.5/administration-guide/215451
  page_start: 91
  audit_raw: 'To check the idle timeout in the GUI:

    1) Login to FortiGate

    2) Go to ''System'' > ''Settings''.

    3) In the ''Administration Settings'' section, check the ''Idle timeout'' value in

    minutes.

    To check the idle timeout in the CLI:

    get system global

    check the value of admintimeout in minutes'
  remediation: 'To change the idle timeout in the GUI:

    1) Login to FortiGate with Super Admin privileges

    2) Go to ''System'' > ''Settings''.

    3) In the ''Administration Settings'' section, set the ''Idle timeout'' value to five

    minutes by typing 5.

    4) Click Apply.

    To change the idle timeout in the CLI:

    config system global

    set admintimeout 5

    end'
  checks:
  - type: manual_review
    info: 'To check the idle timeout in the GUI:

      1) Login to FortiGate

      2) Go to ''System'' > ''Settings''.

      3) In the ''Administration Settings'' section, check the ''Idle timeout'' value in

      minutes.

      To check the idle timeout in the CLI:

      get system global

      check the value of admintimeout in minutes'
    severity: medium
