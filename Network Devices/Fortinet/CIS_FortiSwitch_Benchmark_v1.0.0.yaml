    2) Go to ''System'' > ''Admin'' > ''Settings''.

    3) In the ''Administration Settings'' section, check the ''Idle Timeout'' value in

    minutes.

    To check the idle timeout in the CLI:

    get system global | grep admintimeout

    check the value of admintimeout in minutes'
  remediation: 'To change the idle timeout in the GUI:

    1) Login to FortiSwitch with Super Admin privileges.

    2) Go to ''System'' > ''Admin'' > ''Settings''.

    3) In the ''Administration Settings'' section, set the ''Idle Timeout'' value to five

