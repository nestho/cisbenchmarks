      1. Network > Interfaces, select the interface and click "Edit".

      2. In the interface setting '
- id: 1.5.1
  title: SNMP 1.5.1.1 Ensure only SNMPv3 is enabled
  scoring: scored
  profile:
  - Level 1
  description: Ensuring that only SNMPv3 service is enabled and SNMPv1, SNMPv2c are disabled.
  rationale: SNMP Version 3 provides security enhancements that are not available in SNMP Version 1 or SNMP Version 2c. SNMP
    Versions 1 and 2c transmit data between the SNMP server and SNMP agent in clear text. SNMP Version 3 adds authentication
    and privacy options to secure protocol operations. Some firewalls need to be constantly monitored of its performance and
    status, especially if the firewalls are critical to the operation. Enabling SNMPv3 will ensure that the firewall is monitored
    properly.
  impact: The FortiSwitch SNMP implementation is read-only. SNMP v1-compliant and v2ccompliant SNMP managers have read-only
    access to FortiSwitch system information through queries and can receive trap messages from the FortiSwitch unit.
  references:
  - 1. https://docs.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-administrationguide/261585/snmp
  - 2. https://docs2.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-clireference/500379/config-system#config20
  page_start: 36
  audit_raw: "From CLI, check to make sure that there is not any community for SNMPv1 or\nSNMPv2c and only SNMPv3 users are\
    \ there. Also make sure that SNMP Agent is\nenabled:\nFSW1 # config system snmp sysinfo\nFSW1 (sysinfo) # show\nconfig\
    \ system snmp sysinfo\nset status enable\n...\nend\nFSW1 (sysinfo) # end\nFSW1 # config system snmp community\nFSW1 (community)\
    \ # show\nconfig system snmp community\nend\nFSW1 (community) # end\nFSW1 # config system snmp user\nFSW1 (user) # show\n\
    config system snmp user\n edit \"snmp_test\"\n set security-level auth-priv\n set auth-proto sha256\n set auth-pwd ENC\
    \ xxxxxx\n set priv-proto aes256\n set priv-pwd ENC xxxxxx\n next\nend\nIn the GUI, go to:\n1. System > Config > SNMP\
    \ > Settings. Make sure that SNMP agent is enabled.\n2. System > Config > SNMP > Communities. Make sure that there is\
    \ not any SNMPv1/2c\ncommunity.\n3. System > Config > SNMP > Users. Make sure that there is at least 1 SNMPv3 user\nin\
    \ the list."
  remediation: "To enable SNMP agent in CLI:\nFSW1 # config system snmp sysinfo\nFSW1 (sysinfo) # set status enable\nFSW1\
    \ (sysinfo) # end\nIn GUI, go to System > Config > SNMP > Settings and enable SNMP Agent.\nTo delete SNMPv1/2c communities.\
    \ In this example, we'll delete community \"public\" in\nCLI:\nFirst, to identify the community, run\nFSW1 # config system\
    \ snmp community\nFSW1 (community) # show\nconfig system snmp community\n edit 1\n set name \"public\"\n config hosts\n\
    \ edit 1\n next\n end\n next\nend\nThis shows that the community public has ID 1\nFSW1 # config system snmp community\n\
    FSW1 (community) # delete 1\nFSW1 (community) # end\nIn the GUI, go to:\nSystem > Config > SNMP > Communities, select\
    \ the community and click on the Delete\nbutton.\nTo add SNMPv3 user in CLI:\nFSW1 # config system snmp user\nFSW1 (user)\
    \ # edit \"snmp_test\"\nFSW1 (snmp_test) # set security-level auth-priv\nFSW1 (snmp_test) # set auth-proto sha256\nFSW1\
    \ (snmp_test) # set auth-pwd xxxx\nFSW1 (snmp_test) # set priv-proto aes256\nFSW1 (snmp_test) # set priv_pwd xxxx\nFSW1\
    \ (snmp_test) # end\nIn the GUI, go to:\n1. System > Config > SNMP > Users, under SNMPv3, click on \"Add User\" button.\n\
    2. Fill in the \"Username\" field.\n3. Assign \"SNMP Notify\" hosts by clicking on the \"+\" button.\n4. Set the \"Security\
    \ Level\" to \"Authentication and Privacy\".\n5. For \"Authentication\" choose SHA512 as Authentication Protocol.\n6.\
    \ Create a \"Password\" in the password field.\n7. For \"Privacy\", choose AES256 as Encryption Protocol.\n8. Create a\
    \ \"Password\" in the password field.\n9. Click \"Add\" to add the new user."
  checks:
  - type: sql
    command: 'show

      config system snmp sysinfo'
    severity: medium
    info: 'From CLI, check to make sure that there is not any community for SNMPv1 or

      SNMPv2c and only SNMPv3 users are there. Also make sure that SNMP Agent is

      enabled:

      FSW1 # config system snmp sysinfo

      FSW1 (sysinfo) # show

      config system snmp sysinfo

      set status enable

      ...

      end

      FSW1 (sysinfo) # end

      FSW1 # config system snmp community

      FSW1 (community) # show

      config system snmp community

      end

      FSW1 (community) #'
- id: 1.5.1.2
  title: Allow only trusted hosts in SNMPv3
  scoring: manual
  profile:
  - Level 2
  description: Ensuring that only certain hosts are able to conduct SNMP GET or receive SNMP Trap.
  rationale: SNMP offers rich information that can be useful for reconnaissance activity. Hence, limiting this information
    to only relevant devices such as NMS (Network Monitoring System) or other SNMP servers is necessary.
  impact: ''
  references:
  - 1. https://docs.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-administrationguide/261585/snmp
  page_start: 41
  audit_raw: "From CLI:\nFSW1 # show system snmp user\nconfig system snmp user\n edit \"snmp_test\"\n set notify-hosts 192.168.1.101\n\
    \ set security-level auth-priv\n set auth-proto sha512\n set auth-pwd ENC xxxxx\n set priv-proto aes256\n set priv-pwd\
    \ ENC xxxxx\n next\nend\nValidate that \"notify-hosts\" is configured with specific IP address, and there is no\n\"0.0.0.0\"\
    \ configured.\nFrom GUI:\n1. System > Config > SNMP > Users.\n2. On the Users section click \"Edit\" on a User and validate\
    \ the configured SNMPv3\nsettings.\n3. Ensure that \"Notify Hosts\" is configured with specific IP address, and there\
    \ is\nno \"0.0.0.0\" configured."
  remediation: 'To remove 0.0.0.0 from trusted hosts in CLI:

    FSW1 # config system snmp user

    FSW1 (user) # edit "snmp_test"

    FSW1 (snmp_test) # unset notify-hosts

    FSW1 (snmp_test) # end

    From GUI:

    1. System > Config > SNMP > Users.

    2. On the Users section click "Edit" on "snmp_test".

    3. Remove 0.0.0.0 from "Notify Hosts" section.'
  checks:
  - type: sql
    command: show system snmp user
    severity: medium
    info: "From CLI:\nFSW1 # show system snmp user\nconfig system snmp user\n edit \"snmp_test\"\n set notify-hosts 192.168.1.101\n\
      \ set security-level auth-priv\n set auth-proto sha512\n set auth-pwd ENC xxxxx\n set priv-proto aes256\n set priv-pwd\
      \ ENC xxxxx\n next\nend\nValidate that \"notify-hosts\" is configured with specific IP address, and there is no\n\"\
      0.0.0.0\" configured.\nFrom GUI:\n1. System > Config > SNMP > Users.\n2"
- id: 1.5.1.3
  title: Disable SNMPv3 Query Per User
  scoring: scored
  profile:
  - Level 2
  description: Disabling SNMP query for SNMPv3 Users that only need to receive SNMP traps
  rationale: SNMP can contain information that is useful for reconnaissance, SNMP queries allow devices to send requests for
    information, disabling this on SNMPv3 users that do not need to query and only need to receive SNMP traps is necessary.
  impact: ''
  references:
  - 1. https://docs.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-administrationguide/261585/snmp
  page_start: 43
  audit_raw: "From CLI:\nconfig system snmp user\n edit \"snmp_test\"\n set queries disable\n set notify-hosts 192.168.1.101\n\
    \ set security-level auth-priv\n set auth-proto sha512\n set auth-pwd ENC xxxxxx\n set priv-proto aes256\n set priv-pwd\
    \ ENC xxxxxx\n next\nend\nValidate that \"set queries\" is disabled\nFrom GUI:\n1. System > Config > SNMP > Users\n2.\
    \ On the Users section click \"Edit\" on a User and validate the configured SNMPv3\nsettings\n3. Ensure that the checkbox\
    \ for \"Queries\" is disabled"
  remediation: 'To disable Queries for a specific SNMPv3 User in CLI:

    {snmp_test is the example SNMPv3 username}

    FSW1 # config system snmp user

    FSW1 (user) # edit snmp_test

    FSW1 (snmp_test) # set queries disable

    FSW1 (snmp_test) # next

    FSW1 (user) # end

    To disable Queries for a specific SNMPv3 User in GUI:

    1. System > Config > SNMP > Users

    2. On the Users section click "Edit" on "snmp_test" and validate the configured

    SNMPv3 settings

    3. Under the "Queries" section click the checkbox "Enabled" so it is turned off'
  checks:
  - type: manual_review
    info: "From CLI:\nconfig system snmp user\n edit \"snmp_test\"\n set queries disable\n set notify-hosts 192.168.1.101\n\
      \ set security-level auth-priv\n set auth-proto sha512\n set auth-pwd ENC xxxxxx\n set priv-proto aes256\n set priv-pwd\
      \ ENC xxxxxx\n next\nend\nValidate that \"set queries\" is disabled\nFrom GUI:\n1. System > Config > SNMP > Users\n\
      2. On the Users section click \"Edit\" on a User and validate the configured SNMPv3\nsettings\n3. Ensure that the checkbox\
      \ for \"Queries\" is disabled"
    severity: medium
- id: 1.5.1.4
  title: Enabling SNMP trap for memory usage
  scoring: scored
  profile:
  - Level 1
  description: Enabling SNMP traps for memory usage monitoring helps detect anomalies and ensure critical security features
    remain operational. This proactive approach enhances system reliability by alerting administrators to potential resource
    issues.
  rationale: Monitoring memory usage via SNMP traps ensures that critical security processes have sufficient resources to
    operate effectively. This helps prevent performance degradation or failures that could expose the system to security risks.
  impact: ''
  references:
  - 1. https://docs.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-administrationguide/261585/snmp
  - 2. https://docs2.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-clireference/500379/config-system#config22
  page_start: 45
  audit_raw: "In the example below, SNMP trap will trigger once memory usage is above 80% (less\nthan 20% free memory).\n\
    From CLI, enable SNMP trap for mem-low.\nFSW1 # config system snmp user\nFSW1 (sysinfo) # show\nconfig system snmp user\n\
    \ ...\n set events cpu-high mem-low log-full intf-ip ent-conf-change llv\n set notify-hosts 192.168.1.101\n ..."
  remediation: "To configure SNMPv3 trap \"mem-low\" in addition to all trap \"Events\".\nFrom CLI:\nFSW1 # config system\
    \ snmp user\nFSW1 (sysinfo) # show\nconfig system snmp user\n set events cpu-high mem-low log-full intf-ip ent-conf-change\
    \ llv\nend"
  checks:
