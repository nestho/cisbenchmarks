- id: 1.6.3
  title: Settings 1.6.3.1 Ensure default Admin ports are changed
  scoring: scored
  profile:
  - Level 1
  description: FortiSwitch admin ports listen on the common ports of 80 and 443. This is default behavior. While interface
    access is controlled by configuring network interfaces, the FortiSwitch still listens on the admin ports that have been
    configured, which can also cause a conflict should 80 or 443 be needed as part of additional configuration later on.
  rationale: To increase security of the FortiSwitch Admin Ports, changing it from the default ports will reduce the attack
    surface should FortiSwitch Admin Access be targeted. As mentioned, a possible port conflict can also be avoided.
  impact: Unauthorized access to a FortiSwitch could prove very costly. While this is a single hardening step of many, it
    is an important one when hardening a device.
  references:
  - 1. https://docs.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-administrationguide/296914/setting-the-idle-timeout
  - 2. https://docs2.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-clireference/500379/config-system#config15
  page_start: 73
  audit_raw: 'Log in to the GUI and click on System > Admin > Settings and review the ports under

    ''Console Access'' and ''Web Interface'' sections.'
  remediation: "CLI for changing SSH port:\nconfig system global\n set admin-ssh-port 4422 **(or any other uncommon port)**\n\
    end\nCLI for changing HTTPS port:\nconfig system web\n set https-port 4443 **(or any other uncommon port)**\nend\nOR\n\
    From Web GUI:\n1. System > Admin > Settings\n2. Change the ports/settings under 'Console Access' and 'Web Interface' sections."
  checks:
  - type: manual_review
    info: 'Log in to the GUI and click on System > Admin > Settings and review the ports under

      ''Console Access'' and ''Web Interface'' sections.'
    severity: medium
- id: 1.6.3.2
  title: Ensure Admin idle timeout time is configured
  scoring: scored
  profile:
  - Level 1
  description: The idle timeout period is the amount of time that an administrator will stay logged in to the GUI without
    any activity.
  rationale: Best practice dictates setting admin idle timeout to prevent the risk of unauthorized access to the device, such
    as someone using a logged-in GUI on a PC that has been left unattended. For security reasons, the Center for Internet
    Security (CIS) recommends that administrator sessions should automatically timeout after a period of inactivity, with
    a maximum recommended time of 15 minutes or less
  impact: This is to prevent someone from accessing the FortiSwitch if the management PC is left unattended.
  references:
  - 1. https://docs.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-administrationguide/296914/setting-the-idle-timeout
  - 2. https://docs2.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-clireference/500379/config-system#config15
  page_start: 76
