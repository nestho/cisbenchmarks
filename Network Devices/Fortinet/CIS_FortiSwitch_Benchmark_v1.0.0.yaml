- id: 1.6.1.1
  title: Ensure all the login accounts having specific trusted hosts enabled
  scoring: manual
  profile:
  - Level 1
  description: Configure an administrative account to be accessible only to someone who is using a trusted host. You can set
    a specific IP address for the trusted host or use a subnet.
  rationale: Access to a firewall to perform administrative tasks should only come from specific network segments reserved
    for administrators only. This additional layer of security ensures that no one from anywhere else on the network is able
    to log in, even with correct credentials.
  impact: All access outside of the allowed segment will be stopped, including from both legitimate and illegitimate users.
    Thus, administrators working remotely will have to make sure that they have access to jump hosts that sit in the allowed
    segment.
  references:
  - 1. https://docs.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-administrationguide/288914/administrators
  - 2. https://docs2.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-clireference/500379/config-system#config4
  page_start: 62
  audit_raw: "This example is to check if trusted hosts option is enabled for account \"test_admin\" and\nwhich trusted hosts\
    \ are in the list:\nFSW1 # config system admin\nFSW1 (admin) # edit \"test_admin\"\nFSW1 (test_admin) # show\nconfig system\
    \ admin\nedit \"test_admin\"\n...\nset trusthost1 10.0.0.0 255.255.255.0\nset trusthost2 192.168.10.0 255.255.255.0\n\
    \ ...\nnext\nend\nIn the Web GUI:\n1. System > Admin > Administrators.\n2. Select the account \"test_admin\" and click\
    \ on \"Edit\".\n3. In the account setting page, make sure that \"Restrict this Admin Login from\nTrusted Hosts Only\"\
    \ is enabled and all the allowed hosts / subnets are in the list\nof trusted hosts."
  remediation: 'To remove a trusted host item from the list in CLI:

    FSW1 # config system admin

    FSW1 (admin) # edit "test_admin"

    FSW1 (test_admin) # unset trusthost1

    FSW1 (test_admin) # end

    To add a trusted host into the list in CLI:

    FSW1 # config system admin

    FSW1 (admin) # edit "test_admin"

    FSW1 (test_admin) # set trusthost6 1.1.1.1 255.255.255.255

    FSW1 (test_admin) # end

    Before adding an item, please make sure that it does not already exist. For example, if

    trusthost3 is already in the list, using it again will override the existing host/network.

    In the Web GUI:

    1. System > Admin > Administrators.

    2. Select the account "test_admin" and click on "Edit".

    3. In the account setting page, make sure that "Restrict this Admin Login from

    Trusted Hosts Only" is enabled and all the allowed hosts / subnets are in the list

    of trusted hosts.'
  checks:
  - type: sql
    command: 'show

      config system admin'
    severity: medium
    info: "This example is to check if trusted hosts option is enabled for account \"test_admin\" and\nwhich trusted hosts\
      \ are in the list:\nFSW1 # config system admin\nFSW1 (admin) # edit \"test_admin\"\nFSW1 (test_admin) # show\nconfig\
      \ system admin\nedit \"test_admin\"\n...\nset trusthost1 10.0.0.0 255.255.255.0\nset trusthost2 192.168.10.0 255.255.255.0\n\
      \ ...\nnext\nend\nIn the Web GUI:\n1. System > Admin > Administrators.\n2"
- id: 1.6.1.2
  title: Remove default admin user and create one with other name
  scoring: manual
  profile:
  - Level 1
  description: Before deploying any new Fortinet, it is important to change the password of the default admin account. It
    is also recommended that you change even the user name of the default admin account. However, since you cannot change
    the user name of an account that is currently in use, a second administrator account must be created in order to do this.
  rationale: Default credentials are well documented by most vendors, including Fortinet. Therefore, it will be one of the
    first things that will be tried to illegally gain access to the system.
  impact: If not changed, then any scripts that use default credentials will be able to access the system.
  references:
  - 1. https://docs.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-administrationguide/288914/administrators
  - 2. https://docs2.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-clireference/500379/config-system#config4
  page_start: 65
  audit_raw: 'Using both CLI and GUI, in the username field put in "admin", leave the password field

    blank and proceed. If it''s checked out, it means that the default password is still in place

    and needs to be changed.'
  remediation: 'First create another local admin account, for example mycompanyadmin.

    FSW1 # config system admin

    FSW1 (admin) # edit "mycompanyadmin"

    FSW1 (mycompanyadmin) # set accprofile "tier_1"

    FSW1 (mycompanyadmin) # set accprofile "super_admin"

    FSW1 (mycompanyadmin) # end

    Verify if the newly created login works by opening another CLI session, do not logout of

    your current session.

    Once validated, logout with the default local admin account and use the CLI session

    with mycompanyadmin to delete the default local admin account.

    Please make sure there are no references in the configuration to the account (groups,

    etc.)

    FSW1 # config system admin

    FSW1 (admin) # delete "admin"

    FSW1 (mycompanyadmin) # end

    To change the default password in the GUI:

    System > Admin > Administrators and click on "Edit" under the "admin" user.

    Create New admin account (mycompanyadmin):

    System > Admin > Administrators and clicking on "Add Administrator".

    Verify if you can login with that account via another browser session (eg. incognito

    mode).

    Remove default admin user:

    System > Admin > Administrators and selecting "admin" and clicking on the "Delete"

    button.'
  checks:
  - type: manual_review
    info: 'Using both CLI and GUI, in the username field put in "admin", leave the password field

      blank and proceed. If it''s checked out, it means that the default password is still in place

      and needs to be changed.'
    severity: medium
