- id: '2.5'
  title: VLAN 2.5.1 DHCP Snooping Enablement
  scoring: manual
  profile:
  - Level 1
  description: DHCP snooping protects the network from common DHCP attacks, including address spoofing resulting from a rogue
    DHCP server operating on the network or exhaustion of addresses on a DHCP server caused by mass address requests by an
    attacker on the network. DHCP snooping designates trusted DHCP servers and ports on which DHCP requests and responses
    are accepted.
  rationale: DHCP Snooping classifies switch ports as either trusted or untrusted. Trusted ports are those connected to legitimate
    DHCP servers. Untrusted ports are typically edge ports connected to end devices or untrusted networks. The switch inspects
    DHCP messages and allows only valid responses from trusted ports. Malicious or unauthorized DHCP responses from untrusted
    ports are dropped.
  impact: Prevents rogue DHCP servers from assigning incorrect or malicious IP configuration to clients. Protects against
    DHCP-based man-in-the-middle attacks.
  references:
  - 1. https://docs.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-administrationguide/335964/dhcp-snooping
  - 2. https://docs.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-clireference/511852/config-switch#config26
  page_start: 118
  audit_raw: "From the CLI:\nFSW1# show switch vlan\nconfig switch vlan\n edit <vlan-id>\n ...\n set dhcp-snooping enable\n\
    \ config dhcp-server-access-list\n edit \"DHCP Server\"\n set server-ip 192.168.1.1\n ...\nHaving a DHCP server is optional,\
    \ however, it increases the security configuration for\nDHCP Snooping.\nFrom the GUI:\n1. Switch > VLAN and verify DHCP\
    \ SNOOPING is set in the Enable Features column.\n2. Switch > VLAN > Edit a selected VLAN.\n3. Under the DHCP Snooping\
    \ section verify the \"Enable\" checkbox is checked.\n4. Optionally, verify under DHCP Snooping > DHCP Server Whitelist\
    \ a DHCP Server is\nlisted.\nHaving a DHCP server is optional, however, it increases the security configuration for\n\
    DHCP Snooping."
  remediation: 'From the CLI:

    FSW1# config switch vlan

    FSW1# edit <vlan-id>

    FSW1 (<vlan-id>)# set dhcp-snooping enable

    FSW1 (<vlan-id>)# config dhcp-server-access-list

    FSW1 (dhcp-server-acc~s)# edit "DHCP Server"

    FSW1 (dhcp-server-acc~s)# set server-ip 192.168.1.1

    FSW1 (dhcp-server-acc~s)# end

    FSW1 (<vlan-id>)# end

    FSw1# config switch interface

    FSw1 (interface)# edit "portXX" (XX is the port number.)

    FSW1 (portXX)# set dhcp-snooping trusted

    FSW1 (portXX)# end

    By default, all ports are untrusted so you will need to specify trusted ports for uplinks to

    DHCP Servers or to a directly connected DHCP Server. Optionally specify a DHCP

    server for additional security.

    From the GUI:

    1. Switch > VLAN > Select a VLAN > Edit

    2. Under the DHCP Snooping section check the "Enable" checkbox.

    3. Optionally, configure a DHCP Server under DHCP Snooping section within the DHCP

    Server Whitelist configuration.

    4. Switch > DHCP Snooping click on button to enable "Only Allow DHCP from

    Whitelisted Servers".

    5. Switch > Interfaces > Select an Interface > Edit

    6. Under DHCP Snooping set the uplink and/or the connection to the DHCP Server to

    "Trusted".

    By default, all ports are untrusted so you will need to specify trusted ports for uplinks to

    DHCP Servers or to a directly connected DHCP Server. Optionally specify a DHCP

    server for additional security.'
  checks:
  - type: sql
    command: show switch vlan
    severity: medium
    info: "From the CLI:\nFSW1# show switch vlan\nconfig switch vlan\n edit <vlan-id>\n ...\n set dhcp-snooping enable\n config\
      \ dhcp-server-access-list\n edit \"DHCP Server\"\n set server-ip 192.168.1.1\n ...\nHaving a DHCP server is optional,\
      \ however, it increases the security configuration for\nDHCP Snooping.\nFrom the GUI:\n1. Switch > VLAN and verify DHCP\
      \ SNOOPING is set in the Enable Features column.\n2. Switch > VLAN "
- id: 2.5.2
  title: Dynamic ARP Inspection
  scoring: manual
  profile:
  - Level 1
  description: Dynamic ARP Inspection (DAI) is a security feature available on switches that validates ARP packets on the
    network to prevent ARP spoofing and ARP-based man-in-themiddle attacks. It verifies ARP requests and responses against
    trusted sources, such as DHCP snooping and static ARP entries.
  rationale: Dynamic ARP inspection ensures that ARP traffic is authenticated before being forwarded, preventing attackers
    from injecting forged ARP packets to redirect traffic. This feature is critical in maintaining the integrity of Layer
    2 networks and protecting devices from malicious attempts to hijack IP addresses.
  impact: Implementing Dynamic ARP Inspection enhances network security by blocking malicious ARP packets and mitigating risks
    of ARP-based attacks. It reduces downtime caused by compromised devices and ensures reliable communication in enterprise
    environments. However, misconfiguration or lack of trusted entries may disrupt legitimate traffic.
  references:
  - 1. https://docs.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-administrationguide/500016/dynamic-arp-inspection
  - 2. https://docs.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-clireference/608648
  page_start: 123
  audit_raw: "From the CLI:\nFSW1# show switch vlan\nconfig switch vlan\n edit <vlan-id>\n ...\n set arp-inspection enable\n\
    \ ...\nDHCP Snooping is a requirement for enabling Dynamic ARP Inspection.\nFrom the GUI:\n1. Switch > VLAN and verify\
    \ ARP INSPECTION is set in the Enable Features column.\n2. Switch > VLAN > Edit a selected VLAN.\n3. Under the DHCP Snooping\
    \ section verify the checkbox is checked for \"Dynamic ARP\nInspection\".\nDHCP Snooping is a requirement for enabling\
    \ Dynamic ARP Inspection. Please refer to\nthe DHCP Snooping section for additional details."
  remediation: 'Following command enables Dynamic ARP inspection on the current VLAN, which

    means that ARP packets received from untrusted interfaces are discarded if they have

    an Invalid IP-to-MAC address binding.

    From the CLI:

    FSW1# config switch vlan

    FSW1# edit <vlan-id>

    FSW1 (<vlan-id>)# set arp-inspection enable

    FSW1 (<vlan-id>)# end

    From the GUI:

    1. Switch > VLAN > Select a VLAN > Edit

    2. Under the DHCP Snooping section check the checkbox for "Dynamic ARP

    Inspection".

    By default, all ports are untrusted so you will need to specify trusted ports for uplinks to

    DHCP Servers or to a directly connected DHCP Server. Refer to the DHCP Snooping

    section for the DHCP snooping configuration.'
  checks:
  - type: sql
    command: show switch vlan
    severity: medium
    info: "From the CLI:\nFSW1# show switch vlan\nconfig switch vlan\n edit <vlan-id>\n ...\n set arp-inspection enable\n\
      \ ...\nDHCP Snooping is a requirement for enabling Dynamic ARP Inspection.\nFrom the GUI:\n1. Switch > VLAN and verify\
      \ ARP INSPECTION is set in the Enable Features column.\n2. Switch > VLAN > Edit a selected VLAN.\n3. Under the DHCP\
      \ Snooping section verify the checkbox is checked for \"Dynamic ARP\nInsp"
