- id: 1.7.1.1.2
  title: Ensure all the login accounts having specific trusted hosts enabled
  scoring: manual
  profile:
  - Level 1
  description: Configure an administrative account to be accessible only to someone who is using a trusted host. You can set
    a specific IP address for the trusted host or use a subnet.
  rationale: Access to a firewall to perform administrative tasks should only come from specific network segments reserved
    for administrators only. This additional layer of security ensures that no one from anywhere else on the network is able
    to log in, even with correct credentials.
  impact: All access outside of the allowed segment will be stopped, including from both legitimate and illegitimate users.
    Thus, administrators working remotely will have to make sure that they have access to jump hosts that sit in the allowed
    segment.
  references:
  - 1. https://docs.fortinet.com/document/fortigate/7.4.5/administration-guide/14906
  page_start: 82
  audit_raw: "This example is to check if trusted hosts option is enabled for account \"test_admin\" and\nwhich trusted hosts\
    \ are in the list:\nFG1 # config system admin\nFG1 (admin) # edit \"test_admin\"\nFG1 (test_admin) # show\nconfig system\
    \ admin\nedit \"test_admin\"\n...\nset trusthost1 10.0.0.0 255.255.255.0\nset trusthost2 192.168.10.0 255.255.255.0\n\
    \ ...\nnext\nend\nIn the Web GUI:\n1. System > Administrators.\n2. Select the account and click on edit.\n3. In the account\
    \ setting page, make sure that \"Restrict login to trusted hosts\"\nis enabled and all the allowed hosts / subnets are\
    \ in the list of trusted host.\nPlease take note that certain versions of FortiOS will only show the first 3 trusted hosts\n\
    in the list. If you want to see more, you have to click on the \"+\" sign as if you're adding a\nnew item into the list.\
    \ Keep clicking until you see an empty field of trusted host. That's\nwhen you know that you have reached the bottom of\
    \ the list."
  remediation: 'To remove a trusted host item from the list in CLI:

    FG1 # config system admin

    FG1 (admin) # edit "test_admin"

    FG1 (test_admin) # unset trusthost1

    FG1 (test_admin) # end

    FG1 #

    To add a trusted host into the list in CLI:

    FG1 # config system admin

    FG1 (admin) # edit "test_admin"

    FG1 (test_admin) # set trusthost6 1.1.1.1 255.255.255.255

    FG1 (test_admin) # end

    FG1 #

    Before adding an item, please make sure that it does not already exist. For example, if

    trusthost3 is already in the list, using it again will override the existing host/network.

    In the Web GUI:

    1. System > Administrators.

    2. select the account and click on edit.

    3. In the account setting page, make sure that "Restrict login to trusted hosts"

    is enabled and all the allowed hosts / subnets are in the list of trusted host.

    Please take note that certain versions of FortiOS will only show the first 3 trusted hosts

    in the list. If you want to see more, you have to click on the "+" sign as if you''re adding a

    new item into the list. Keep clicking until you see an empty field of trusted host. That''s

    when you know that you have reached the bottom of the list. To add another trusted

    host, fill in the empty field of the new "Trusted Host". To remove a trusted host, simply

    erase everything in the field of that corresponding host.'
  checks:
  - type: sql
    command: 'show

      config system admin'
    severity: medium
