- id: 1.5.4.1
  title: Ensure correct system time is configured through NTP
  scoring: scored
  profile:
  - Level 1
  description: You can either manually set the FortiSwitchOS system time, or configure the device to automatically keep its
    system time correct by synchronizing with a Network Time Protocol (NTP) server. These settings enable the use of primary
    and secondary NTP servers to provide redundancy in case of a failure involving the primary NTP server.
  rationale: NTP enables the device to maintain accurate time and date when receiving updates from a reliable NTP server.
    Accurate timestamps are critical when correlating events with other systems, troubleshooting, or performing investigative
    work. Logs and certain cryptographic functions, such as those utilizing certificates, rely on accurate time and date parameters.
    In addition, rules referencing a Schedule object will not function as intended if the device’s time and date are incorrect.
    For additional security, authenticated NTP can be utilized. If Symmetric Key authentication is selected, only SHA1 should
    be used, as MD5 is considered severely compromised.
  impact: For many features to work, including scheduling, logging, and SSL-dependent features, the FortiOS system time must
    be accurate.
  references:
  - 1. https://docs.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-administrationguide/296921/time
  - 2. https://docs2.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-clireference/500379/config-system#config18
  page_start: 54
  audit_raw: 'In the CLI:

    FSW1 # diag sys ntp status

    synchronized: yes, ntpsync: enabled, server-mode: disabled

    ipv4 server(ntp1.fortinet.net) 208.91.112.63 -- reachable(0xff) S:3 T:54

    server-version=4, stratum=1

    reference time is e12361d5.f27e0322 -- UTC Wed Sep 11 12:06:45 2019

    clock offset is -0.001569 sec, root delay is 0.000000 sec

    root dispersion is 0.010269 sec, peer dispersion is 19 msec'
  remediation: 'Only one NTP server allowed in the GUI. ''System'' > ''Config'' > ''Time''. Use CLI to

    configure additional NTP Servers.

    In this example, we''ll assign pool.ntp.org as primary NTP server and 1.1.1.1 as

    secondary NTP server.

    FSW1 # config system ntp

    FSW1 (ntp) # config ntpserver

    FSW1 (ntpserver) # edit 1

    FSW1 (1) # set server pool.ntp.org

    FSW1 (1) # next

    FSW1 (ntpserver) # edit 2

    FSW1 (2) # set server 1.1.1.1

    FSW1 (2) # end

    FSW1 (ntp) # end

    FSW1 #'
  checks:
  - type: manual_review
    info: 'In the CLI:

      FSW1 # diag sys ntp status

      synchronized: yes, ntpsync: enabled, server-mode: disabled

      ipv4 server(ntp1.fortinet.net) 208.91.112.63 -- reachable(0xff) S:3 T:54

      server-version=4, stratum=1

      reference time is e12361d5.f27e0322 -- UTC Wed Sep 11 12:06:45 2019

      clock offset is -0.001569 sec, root delay is 0.000000 sec

      root dispersion is 0.010269 sec, peer dispersion is 19 msec'
    severity: medium
- id: 1.5.4.2
  title: Ensure timezone is properly configured
  scoring: manual
  profile:
  - Level 1
  description: Sets the local time zone information so that the time displayed by the device is more relevant to those who
    are viewing it.
  rationale: Having a correct time set on the device is important for two main reasons. The first reason is that digital certificates
    compare this time to the range defined by their Valid From and Valid To fields to define a specific validity period. The
    second reason is to have relevant time stamps when logging information. Whether you are sending messages to a Syslog server,
    sending messages to an SNMP monitoring station, or performing packet captures, timestamps have little usefulness if you
    cannot be certain of their accuracy.
  impact: For many features to work, including scheduling, logging, and SSL-dependent features, the FortiOS system time must
    be accurate.
  references:
  - 1. https://docs.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-administrationguide/296921/time
  - 2. https://docs2.fortinet.com/document/fortiswitch/7.4.4/fortiswitchos-clireference/500379/config-system#config15
  page_start: 56
  audit_raw: 'In the CLI, do the following command and check the result of timezone filed in the

    output

    FSW1 # get system global | grep timezone

    timezone : (GMT-8:00) Pacific Time (US & Canada)

    Or from GUI, do the following:

    1) Login to FortiSwitch

    2) Go to ''System'' -> ''Config'' -> ''Time''

    3) TimeZone and NTP settings are under ''System Time'''
  remediation: 'In this example, we will set Eastern Timezone (GMT-5:00) for the FortiSwitch. Each

    timezone will have its corresponding ID. To find the correct ID, when you type in the

    command "set timezone ", also type the question mark ''?'' to list all of the available

    timezones and their IDs. The ID of the Eastern Timezone is 12 In the CLI:

    FSW1 # config system global

    FSW1 (global) # set timezone 12

    FSW1 (global) # end

    FSW1 #

    In the GUI, do the following:

    1) After login to FortiSwich, go to ''System'' -> ''Config'' -> ''Time''

    2) Select ''12 - (GMT-5:00) Eastern Time (US & Canada)'' under ''System Time'' ->

    ''TimeZone'''
  checks:
  - type: command
    command: 'FSW1 # get system global | grep timezone'
    expected: ''
    severity: medium
    info: 'In the CLI, do the following command and check the result of timezone filed in the

      output

      FSW1 # get system global | grep timezone

      timezone : (GMT-8:00) Pacific Time (US & Canada)

      Or from GUI, do the following:

      1) Login to FortiSwitch

      2) Go to ''System'' -> ''Config'' -> ''Time''

      3) TimeZone and NTP settings are under ''System Time'''
