- id: 2.7.3
  title: Use SNMPv3 Instead of Earlier Versions
  scoring: manual
  profile:
  - Level 1
  description: The network element should use SNMP Version 3 for any SNMP agent configured on the device.
  rationale: SNMPv2 only requires a community string to be specified, which the client needs to use in their requests to "authenticate".
    SNMPv3 uses an actual security model called "User-based Security Model" (USM) codified in RFC3414 (originally in RFC2264
    1998). USM supports authentication and encryption.
  impact: Client requests will also need to use snmpv3 to poll the device.
  references:
  - 1. https://www.arista.com/en/um-eos/eos-snmp
  - 2.9 Login Banner
  page_start: 58
  audit_raw: 'switch(config)#show run section snmp-server.*v3

