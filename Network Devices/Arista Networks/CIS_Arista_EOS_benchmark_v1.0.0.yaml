- id: 2.4.2
  title: Emergency Console Access
  scoring: manual
  profile:
  - Level 1
  description: Authentication for administrative access to the device should be required at all times. A single account should
    be created on the device's local database for use in an emergency such as when the authentication server is down or connectivity
    between the device and the authentication server is not operable. The console or emergency account logon credentials should
    be stored in a secure location. SHA512 password hash should always be used and is the default in EOS.
  rationale: Console access should be available even if authentication servers are down or unreachable, but should not be
    accessible without authentication or with simple passwords.
  impact: ''
  references:
  - 1. https://www.arista.com/en/um-eos/eos-user-security#xx1347335
  - 2.5 TACACS+/RADIUS
  page_start: 45
  audit_raw: 'Verify a local username is configured

