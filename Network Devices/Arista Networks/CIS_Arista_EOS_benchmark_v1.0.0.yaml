controls:
- id: 1.1.1.1
  title: Ensure the Management VRF Exists
  scoring: manual
  profile:
  - Level 1
  description: Ensure that the mgmt vrf exists and is assigned to the interface that connects to the management network for
    out of band access. The switch has a dedicated management interface that should be assigned to this vrf.
  rationale: A Management VRF (Virtual Routing and Forwarding) is a dedicated, isolated routing instance on a network device
    used exclusively for out-of-band management traffic. It separates administrator access (like SSH, SNMP, and Syslog) from
    production data traffic.
  impact: ''
  references:
  - 1. https://www.arista.com/en/um-eos/eos-initial-switchaccess#ethernet_management_port
  page_start: 17
  audit_raw: 'Verify vrf exists and is applied to management interface.

    sho run section vrf instance mgmt

    show running-config section interface Management'
  remediation: "Creat a vrf, assign it to the management interface and create a static route to the rest of\nthe network.\
    \ The vrf instance should have a meaningful name and description indicating\nits purpose.\nvrf instance mgmt\n description\
    \ Management VRF\n!\ninterface Management1\n vrf mgmt\nip route vrf mgmt 0/0 {Gateway Address}\nno ip routing vrf mgmt"
  checks:
  - type: sql
    command: show running-config section interface Management
    severity: medium
    info: 'Verify vrf exists and is applied to management interface.

      sho run section vrf instance mgmt

      show running-config section interface Management'
- id: 1.1.2
  title: Control Plane ACL
  scoring: manual
  profile:
  - Level 1
  description: A default control plane ACL is provided and applied to the system control-plane. The default control-place
    ACL is read-only, but you can create and assign a different ACL to the system control-plane if customization is needed.
    However, it is strongly recommended to use the default control-plane ACL as a template for any custom ACL that you may
    apply to ensure protocol and management operations function correctly.
  rationale: 'The default control plane ACL filters all IP traffic inbound and outbound on any management interface. SSH,
    Telnet, NTP, SNMP, IP protocols, and logging/matching on management traffic are done by this ACL. The default control
    plane ACL permits the following protocols: • Telnet • SSH • HTTP/S • BootP • SNMP • ICMP • MLAG • IGMP • OSPF • BGP •
    VRRP • PIM • AHP • VNC'
  impact: While it is possible to create and apply a new/modified ACL to the system control-plane, modifying the control plane
    ACL may unexpectedly block services critical to the network operation. The default control plane allows all expected control
    plane protocols. A custom control plane acl may be overly broad, providing insufficient security, or too narrow to allow
    the network to function.
  references:
  - 1. https://www.arista.com/en/um-eos/eos-data-transfer#xx1135265
  page_start: 18
  audit_raw: "Run the following command to check that either your custom ACL or the default ACL is\napplied\nswitch#show running-config\
    \ all section system control-plane\nsystem control-plane\n ip access-group custom-control-plane-acl in\n ip access-group\
    \ default-control-plane-acl vrf MGMT in\nswitch#\nThe control plane ACL is referenced by the ip[v6] access-group <ACLNAME>\
    \ in\nconfiguration.\nIf a customer access list is specified, verify this acl exists\nswitch#show run section access-list\
    \ custom-control-plane-acl\nExample output of a custom acl based on the default acl. This removed telnet and http\naccess.\n\
    ip access-list custom-control-plane-acl\n counters per-entry\n 10 permit icmp any any\n 20 permit ip any any tracked\n\
    \ 30 permit udp any any eq bfd ttl eq 255\n 40 permit udp any any eq bfd-echo ttl eq 254\n 50 permit udp any any eq multihop-bfd\
    \ micro-bfd sbfd\n 60 permit udp any eq sbfd any eq sbfd-initiator\n 70 permit ospf any any\n 80 permit tcp any any eq\
    \ ssh snmp bgp https msdp ldp netconf-ssh gnmi\n 90 permit udp any any eq bootps bootpc ntp snmp ptp-event ptp-general\
    \ rip\nldp\n 100 permit tcp any any eq mlag ttl eq 255\n 110 permit udp any any eq mlag ttl eq 255\n 120 permit vrrp any\
    \ any\n 130 permit ahp any any\n 140 permit pim any any\n 150 permit igmp any any\n 160 permit tcp any any range 5900\
    \ 5910\n 170 permit tcp any any range 50000 50100\n 180 permit udp any any range 51000 51100\n 190 permit tcp any any\
    \ eq 3333\n 200 permit tcp any any eq nat ttl eq 255\n 210 permit tcp any eq bgp any\n 220 permit rsvp any any\n 230 permit\
    \ tcp any any eq 9340\n 240 permit tcp any any eq 9559\n 250 permit udp any any eq 8503\n 260 permit udp any any eq lsp-ping\n\
    \ 270 permit udp any eq lsp-ping any range 51900 51999\nswitch#"
  remediation: 'Apply a control plane ACL to the default vrf and all non default vrfs

    switch(config)#system control-plane

    switch(config-system-cp)# ip access-group custom-control-plane-acl in

    switch(config-system-cp)# ip access-group custom-control-plane-acl vrf MGMT

    in'
  checks:
  - type: sql
    command: show running-config all section system control-plane
    severity: medium
    info: "Run the following command to check that either your custom ACL or the default ACL is\napplied\nswitch#show running-config\
      \ all section system control-plane\nsystem control-plane\n ip access-group custom-control-plane-acl in\n ip access-group\
      \ default-control-plane-acl vrf MGMT in\nswitch#\nThe control plane ACL is referenced by the ip[v6] access-group <ACLNAME>\
      \ in\nconfiguration.\nIf a customer access list i"
- id: 1.1.3
  title: Control Plane Policy Map
  scoring: manual
  profile:
  - Level 1
  description: The default configuration comes with a pre-configured policy map to ensure adequate rate limiting for most
    traffic types punted to the CPU.
  rationale: Control plane policing can be used to increase the security of Arista switches by protecting the control plane
    from unnecessary or malicious traffic. It is recommended to implement control plane protection by classifying traffic
    types based on importance levels and configure filters to restrict and rate limit the traffic punted to the processor
    according to each class.
  impact: ''
  references:
  - 1. https://www.arista.com/en/um-eos/eos-traffic-management#xzx_fmen3vHmHf
  page_start: 21
