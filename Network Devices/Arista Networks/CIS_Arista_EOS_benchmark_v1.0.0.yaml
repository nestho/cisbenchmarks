    \ vrf MGMT in\n ipv6 access-group default-control-plane-acl in\n ipv6 access-group default-control-plane-acl vrf MGMT\
    \ in\n service-policy input copp-system-policy\nswitch#\nCheck the configuration of the service policy\n#show policy-map\
    \ type control-plane copp-system-policy\nService-policy input: copp-system-policy\n Number of units programmed: 1\n Hardware\
    \ programming status: Successful\n Class-map: copp-system-bpdu (match-any)\n shape : 5000 pps\n bandwidth : 5000 pps\n\
    \ Class-map: copp-system-lacp (match-any)\n shape : 5000 pps\n bandwidth : 5000 pps\n Class-map: copp-system-bfd (match-any)\n\
    \ shape : 10000 pps\n bandwidth : 500 pps\n Class-map: copp-system-mlag (match-any)\n shape : 5000 pps\n bandwidth : 5000\
    \ pps\n Class-map: copp-system-selfip-tc6to7 (match-any)\n shape : 5000 pps\n bandwidth : 5000 pps\n Class-map: copp-system-selfip\
    \ (match-any)\n shape : 5000 pps\n bandwidth : 5000 pps\n Class-map: copp-system-tc6to7 (match-any)\n shape : 10000 pps\n\
    \ bandwidth : 1000 pps\n Class-map: copp-system-vrrp (match-any)\n shape : 5000 pps\n bandwidth : 1000 pps\n Class-map:\
