- id: 3.2.1
  title: BGP Authentication
  scoring: manual
  profile:
  - Level 2
  description: The neighbor password command enables authentication on a TCP connection with a BGP peer
  rationale: When utilizing BGP the threat profile becomes much larger as routes external to the data center will be updating
    routing information in the devices. Much like with the IGP an attacker could redirect traffic to an insecure location
    where traffic could be analyzed and confidential information extracted. In the case of BGP a peer AS can send erroneous
    prefix information and as a result could allow packets to be sent to an insecure network. It is recommended that peer
    authentication be used for all peers. A password or key should be defined for each BGP neighbor regardless of the peer's
    autonomous system.
  impact: ''
  references:
  - 1. https://www.arista.com/en/um-eos/eos-border-gateway-protocol-bgp#xx1117278
  page_start: 70
  audit_raw: "Verify each bgp neighbor has a password\nshow running-config section neighbor.*password\nrouter bgp 65013\n\
    \ neighbor 1.1.1.1 password 8a XXXXX"
  remediation: "Configure passwords for each neighbor as appropriate\nrouter bgp\n neighbor {IP address} password"
  checks:
  - type: sql
    command: show running-config section neighbor.*password
    severity: medium
    info: "Verify each bgp neighbor has a password\nshow running-config section neighbor.*password\nrouter bgp 65013\n neighbor\
      \ 1.1.1.1 password 8a XXXXX"
- id: 3.2.2
  title: BGP TCP Authentication Option (TCP-AO)
  scoring: manual
  profile:
  - Level 2
  description: BGP TCP Authentication Option (TCP-AO) (RFC 5925) support adds a new option for BGP message and TCP segments
    authentication using superior hashing algorithms such as HMACs and CMACs as an improvement over TCP MD5, with stronger
    hashing algorithms providing higher security and protection against replays attacks. It also provides better key management
    by coordinating between the endpoints to rotate to a new secret key or the master key tuple (MKT) without resetting the
    TCP connection.
  rationale: EOS supports BGP message authentication via the TCP MD5 Signature (TCP MD5) option (RFC 2385) to protect the
    BGP sessions from spoofed TCP segments. However, research has shown many concerns that the TCP MD5 algorithm is cryptographically
    ineffective with a just simple keyed hash for authentication.
  impact: ''
  references:
  - 1. https://www.arista.com/en/support/toi/eos-4-28-2f/16087-bgp-tcp-authenticationoption-tcp-ao
