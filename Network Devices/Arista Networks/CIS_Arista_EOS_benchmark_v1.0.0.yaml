    $6$5TvDKp7afe5OBM2/$0BB5GMrdBbKox/wLhVaoLnUV9F2s6k8n9bs42StHnEi37owhb/BHpAIcw

    lomotORDmIBoCvfMie5myiemsJkd.'
  remediation: "switch(config-mgmt-defaults)#username admin privilege 15 role network-admin\nsecret ?\n 0 Specify an UNENCRYPTED\
    \ password will follow\n 5 Specify an ENCRYPTED MD5 password will follow\n LINE The UNENCRYPTED (cleartext) password\n\
    \ sha512 Specifies an ENCRYPTED SHA512 password will follow\n * Specify a password that cannot be used to login\nswitch(config-mgmt-defaults)#username\
    \ admin privilege 15 role network-admin\nsecret <password>\nswitch(config)#"
