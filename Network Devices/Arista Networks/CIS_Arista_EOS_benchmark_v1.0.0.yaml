- id: 1.1.4
  title: Network Time Protocol
  scoring: manual
  profile:
  - Level 1
  description: EOS enables Network Time Protocol (ntp) on the switch by default, and time settings from any properly configured
    ntp server override the manual setting of the system clock. ntp servers synchronize time settings of systems running an
    ntp client. The switch supports ntp versions 1 through 4, and uses version 4 by default.
  rationale: Without synchronized time accurately correlating information between devices becomes difficult, if not impossible.
    If logs cannot be successfully compared between each of the routers, switches, and firewalls, it will be very difficult
    to determine the exact events that resulted in a network breach incident. NTP provides an efficient and scalable method
    for network elements to synchronize to an accurate time source. A trusted time source is important to ensure proper logging
    and correlation of events to a syslog server where forensic information can be gathered in addition to any information
    concerning potential threats. If possible it is recommended to configure more than one NTP server.
  impact: ''
  references:
  - 1. https://www.arista.com/en/um-eos/eos-system-clock-and-timeprotocols#xx1106319
  page_start: 25
  audit_raw: hostname#show running-config section ntp
  remediation: 'Configure one or more NTP servers. NTP should be provided via the management

    network.

    switch(config)# ntp server vrf {management vrf} {Hostname|IPaddr} prefer

    switch(config)# ntp server vrf {management vrf} {Hostname|IPaddr}'
  checks:
  - type: sql
    command: show running-config section ntp
    severity: medium
    info: hostname#show running-config section ntp
- id: 1.1.5
  title: NTP authentication
  scoring: manual
  profile:
  - Level 2
  description: NTP authentication verifies that time updates come from a trusted server, preventing bad actors from spoofing
    time or altering your clock. The NTP authentication model is the opposite of the typical client-server authentication
    model. NTP authentication enables an NTP client or peer to authenticate time received from their servers and peers. It’s
    not used to authenticate NTP clients because NTP servers don’t care about the authenticity of their clients as they never
    accept any time from them.
  rationale: Authentication support allows the NTP client to verify that servers are in fact known and trusted and not intruders
    intending accidentally or intentionally to masquerade as a legitimate server.
  impact: NTP authentication requires server side configuration with a matching key. Mismatches will prevent successful synchronization.
  references:
  - 1. https://www.arista.com/en/um-eos/eos-system-clock-and-timeprotocols#xx1106359
  page_start: 26
  audit_raw: 'switch#show run section ntp.*key

    Example output

    ntp authentication-key 1 sha1 7 120D0C1A1718150A29

    ntp trusted-key 1'
  remediation: 'switch(config)#ntp authentication-key 1 sha1 timesync

    switch(config)#ntp trusted-key 1'
  checks:
  - type: sql
    command: show run section ntp.*key
    severity: medium
    info: 'switch#show run section ntp.*key

      Example output

      ntp authentication-key 1 sha1 7 120D0C1A1718150A29

      ntp trusted-key 1'
- id: 1.1.6
  title: DNS Configuration
  scoring: manual
  profile:
  - Level 1
  description: It is recommended that a DNS server be defined for client resolver. This allows for the use of hostnames when
    configuring services such as ntp or syslog.
  rationale: The susceptibility of IP addresses to spoofing translates to DNS host name and IP address mapping vulnerabilities.
    For example, suppose a source host wishes to establish a connection with a destination host and queries a DNS server for
    the IP address of the destination host name. If the response to this query is the IP address of a host operated by an
    attacker, the source host will establish a connection with the attacker’s host, rather than the intended target. The user
    on the source host might then provide logon, authentication, and other sensitive data.
  impact: ''
  references:
  - 1. https://www.arista.com/en/um-eos/eos-switch-administrationcommands#xx1107749
  page_start: 27
  audit_raw: 'Verify at least one name server is configured and the correct VRF is used for

    reachability to the name server

    show running-config section name-server

    Example output

    ip name-server vrf MGMT 8.8.8.8'
  remediation: 'Configure at least one name server and a domain name. DNS services should be

    provided over the management network.

    switch(config)# ip name-server {vrf [Management VRF]} {ip address}'
  checks:
  - type: sql
    command: show running-config section name-server
    severity: medium
    info: 'Verify at least one name server is configured and the correct VRF is used for

      reachability to the name server

      show running-config section name-server

      Example output

      ip name-server vrf MGMT 8.8.8.8'
- id: 1.1.7
  title: Logging
  scoring: manual
  profile:
  - Level 1
  description: Logging is a critical part of network security. Maintaining an audit trail of system activity logs (syslog)
    can help identify configuration errors, understand past intrusions, troubleshoot service disruptions, and react to probes
    and scans of the network.
  rationale: Syslog levels 0-6 are the levels required to collect the necessary information to help in the recovery process.
    It is recommended to log all messages except debugging and send all log data to a syslog server.
  impact: ''
  references:
  - 1. https://www.arista.com/en/um-eos/eos-system-event-logging
  page_start: 28
  audit_raw: 'Perform the following to determine if a syslog server is enabled. Verify one or more IP

    address(es) returns

    show running-config section logging host'
  remediation: 'Configure a destination for syslog messages. Logging should be sent over the

    management vrf.

    switch(config)# logging trap 6

    switch(config)# logging {vrf [management vrf]} host {ip address}'
  checks:
  - type: sql
    command: show running-config section logging host
    severity: medium
    info: 'Perform the following to determine if a syslog server is enabled. Verify one or more IP

      address(es) returns

      show running-config section logging host'
- id: 1.1.8
  title: VLAN Management
  scoring: manual
  profile:
  - Level 1
  description: VLAN 1 is a special VLAN that tags and handles most of the control plane traffic. VLAN 1 is enabled on all
    trunks and ports by default. Ensure VLAN1 is pruned from all trunk and access ports that do not require it.
  rationale: Instability in one part of the network could affect VLAN 1, thereby influencing controlplane stability and therefore
    STP stability for all other VLANs.
  impact: ''
  references:
  - 1. https://www.arista.com/en/um-eos/eos-virtual-lans-vlans#xzx_c-6_lid0rZ
  page_start: 29
  audit_raw: "Vlan 1 should be suspended and not appear in the allowed list of trunk interfaces.\nshow running-config section\
    \ ^vlan 1$\nshow running-config section switchport trunk allowed\nExpected output\nvlan 1\n state suspend\ninterface Ethernet48\n\
    \ switchport trunk allowed vlan 2-4094"
  remediation: 'switch(config)# vlan 1

    switch(config-vlan-1)# state suspend

    switch(config)# interface Ethernet[X]

    switch(config-if-EtX)# switchport trunk allowed vlan except 1'
  checks:
  - type: sql
    command: show running-config section ^vlan 1$
    severity: medium
    info: "Vlan 1 should be suspended and not appear in the allowed list of trunk interfaces.\nshow running-config section\
      \ ^vlan 1$\nshow running-config section switchport trunk allowed\nExpected output\nvlan 1\n state suspend\ninterface\
      \ Ethernet48\n switchport trunk allowed vlan 2-4094"
- id: 1.1.9
  title: Syslog with TLS support
  scoring: manual
  profile:
  - Level 2
  description: Syslog over TLS is a secure standard (RFC 5425) that encrypts log messages in transit using Transport Layer
    Security. It protects sensitive operational and security data from interception and tampering
  rationale: Syslog messages may transit several hops to arrive at the intended collector. Some intermediary networks may
    not be trusted by the originator, relay, or receiver because the network is in a different security domain or at a different
    security level from the originator, relay, or collector. Another security concern is that the originator, relay, or receiver
    itself is in an insecure network. By using TLS connections, syslog is better protected against attacks and information
    leakage.
  impact: ''
  references:
  - 1. https://www.arista.com/en/um-eos/eos-control-plane-security#xzx_ZxdQkzztCr
  - 2. https://www.arista.com/en/support/toi/eos-4-26-0f/14727-syslog-with-tls-support
  page_start: 30
  audit_raw: "The logging host needs to be configured to use tls and the ssl profile must exist\nshow running-config section\
    \ ssl.profile\nExpected output\nlogging vrf MGMT host 10.1.1.1 protocol tls ssl-profile **syslog-profile**\nmanagement\
    \ security\n ssl profile **syslog-profile**\n certificate clientCert key ClientKey\n trust certificate serverCA\n ```"
  remediation: '1. Create an SSL profile

    switch(config-mgmt-security)#ssl profile syslog-profile

    switch(config-mgmt-sec-ssl-profile-syslog-profile)#certificate clientCert key

    ClientKey

    switch(config-mgmt-sec-ssl-profile-syslog-profile)# trust certificate

    serverCA

    switch(config-mgmt-sec-ssl-profile-syslog-profile)#

    2. Define syslog server

    switch(config)#logging vrf MGMT host 10.1.1.1 protocol tls ssl-profile

    syslog-profile'
  checks:
  - type: sql
    command: show running-config section ssl.profile
    severity: medium
    info: "The logging host needs to be configured to use tls and the ssl profile must exist\nshow running-config section\
      \ ssl.profile\nExpected output\nlogging vrf MGMT host 10.1.1.1 protocol tls ssl-profile **syslog-profile**\nmanagement\
      \ security\n ssl profile **syslog-profile**\n certificate clientCert key ClientKey\n trust certificate serverCA\n ```"
- id: '1.2'
  title: Enable AES-GCM Encryption of EOS Secrets
  scoring: manual
  profile:
  - Level 1
  description: AES-GCM has been added as a method for storing symmetric secrets in EOS. This applies to secrets that must
    be used to remote systems, as found in NTP, TACACS+, and other places. A new secret type “8a”, which stands for AES-256-GCM
    encryption type, has been introduced. Secrets can either be entered in type 0, plaintext, and automatically converted
    or entered directly as type 8a. Upon accepting a value which is encrypted using the new type “8a”, the CLI will validate
    the encrypted value to ensure that it is correctly encoded.
  rationale: The default method of storing shared secrets is to obfuscate them in the running configuration. This obfuscation
    mean secrets can be easily reversed by copying the configuration out of the box. With AES-GCM, the configuration can be
    secured since the secrets cannot be easily reversed or decrypted by copying the configuration out of the box.
  impact: ''
  references:
  - 1. https://www.arista.com/en/support/toi/eos-4-27-0f/14849-aes-gcm-encryption-ofeos-secret-configuration
  - 2.1 Password Management
  page_start: 32
  audit_raw: "switch#sho running-config section password encryption\nExpected output\nmanagement security\n password encryption\
    \ reversible aes-256-gcm"
  remediation: 'switch#conf

    switch(config)#management security

    switch(config-mgmt-security)#password encryption reversible aes-256-gcm'
  checks:
  - type: manual_review
    info: "switch#sho running-config section password encryption\nExpected output\nmanagement security\n password encryption\
      \ reversible aes-256-gcm"
    severity: medium
- id: 2.1.1
  title: Do not allow remote login without a password
  scoring: manual
  profile:
  - Level 1
  description: The default switch configuration allows usernames that are not password-protected to log in only from the console.
    It is possible to configure the switch to allow unprotected usernames to log in from any port.
  rationale: Allowing remote access to accounts without passwords is a severe security risk.
  impact: ''
  references:
  - 1. https://www.arista.com/en/um-eos/eos-user-security#xx1348565
  page_start: 35
  audit_raw: 'Check if remote login without a password is enabled. By default this will return nothing.

    #show running-config section allow-nopassword-remote-login

    Output with feature enabled

    #sho run section allow-nopassword-remote-login

    aaa authentication policy local allow-nopassword-remote-login'
  remediation: 'Reset the feature to the default value

    #default aaa authentication policy local allow-nopassword-remote-login'
  checks:
  - type: sql
    command: show running-config section allow-nopassword-remote-login
    severity: medium
    info: 'Check if remote login without a password is enabled. By default this will return nothing.

      #show running-config section allow-nopassword-remote-login

      Output with feature enabled

      #sho run section allow-nopassword-remote-login

      aaa authentication policy local allow-nopassword-remote-login'
- id: 2.1.2
  title: Configure an enable password
  scoring: manual
  profile:
  - Level 1
  description: The enable command controls access to Privileged EXEC and all configuration command modes. The enable password
    authorizes users to execute the enable command. When the enable password is set, the CLI displays a password prompt when
    a user attempts to enter Privileged EXEC mode.
  rationale: It is recommended that the enable secret password be used at all times to grant administrative access to the
    Arista switch.
  impact: ''
  references:
  - 1. https://www.arista.com/en/um-eos/eos-user-security#xx1349127
  page_start: 36
  audit_raw: 'Verify and enable password is set

    #show running-config section enable password'
  remediation: 'Configure and enable password

    (config)#enable password {password string}'
  checks:
  - type: sql
    command: show running-config section enable password
    severity: medium
    info: 'Verify and enable password is set

      #show running-config section enable password'
- id: 2.1.3
  title: Create a password complexity policy
  scoring: manual
  profile:
  - Level 1
  description: A password policy can be used to mandate password requirements
  rationale: The policy enforces recommendations when creating local users.
  impact: 'Passwords that don''t meet the policy will be rejected switch(config)#username joe secret arista % Password doesn''t
    meet minimum digits: at least 1 required. % Password doesn''t meet minimum special characters: at least 1 are required.
    The special characters are (!"#$%&\''()*+,-./:;<=>?@[^]_`{|}~) % Password doesn''t meet minimum uppercase characters:
    at least 1 required. % Password too short: at least 8 characters required. switch(config)#'
  references:
  - 1. https://www.arista.com/en/um-eos/eos-session-managementcommands#management_accounts
  page_start: 37
  audit_raw: "Verify that a password policy is defined and applied\nswitch(config)#show run section password policy\nmanagement\
    \ accounts\n password policy PasswordPolicy\nmanagement security\n password policy PasswordPolicy\n minimum digits 1\n\
    \ minimum length 8\n minimum lower 1\n minimum special 1\n minimum upper 1"
  remediation: 'switch(config)#management security

    switch(config-mgmt-security)#password policy PasswordPolicy

    switch(config-pwd-policy-PasswordPolicy)#minimum length 8

    switch(config-pwd-policy-PasswordPolicy)#minimum special 1

    switch(config-pwd-policy-PasswordPolicy)#minimum upper 1

