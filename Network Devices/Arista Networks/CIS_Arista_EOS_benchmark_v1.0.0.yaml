- id: 2.5.2
  title: Server Groups
  scoring: manual
  profile:
  - Level 1
  description: A server group is a collection of servers associated with a single group name. Subsequent authorization and
    authentication commands can access all servers in a group by invoking the group name. The switch supports TACACS+ and
    RADIUS server groups.
  rationale: Server groups allow AAA commands to access multiple servers, providing redundancy and load sharing. Before they
    are added to a group, servers must have been previously configured with a radius-server host or tacacs-server host command.
  impact: ''
  references:
