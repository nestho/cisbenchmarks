- id: 2.3.1
  title: Roles
  scoring: manual
  profile:
  - Level 1
  description: A role consists of rules that permit or deny access to a set of commands within specified command modes.
  rationale: For local users a role limits the commands they can run to the appropriate set for their job. Additional custom
    roles can be defined as needed or AAA services - such as TACACS+ - can be used to provide more granular access to the
    switch.
  impact: Incorrect assignment of roles can prevent users performing required functions or allow users to perform actions
    they should not.
  references:
