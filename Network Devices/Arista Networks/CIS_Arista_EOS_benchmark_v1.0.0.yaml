- id: 2.7.2
  title: Ensure SNMP Community
  scoring: manual
  profile:
  - Level 1
  description: Only allow SNMP read access and ensure that the default or well-known SNMP community strings public and private
    are not used. An ACL should be used to further restrict which remote hosts can query the switch.
  rationale: Enabling write access to the device via SNMP provides a mechanism that can be exploited by an attacker to set
    configuration variables that can disrupt network operations.
  impact: Changing SNMP communities requires matching configuration on remote devices that access the device via snmp.
  references:
  - 1. https://www.arista.com/en/um-eos/eos-snmp#xx1153379
  page_start: 57
  audit_raw: show running-config section snmp-server community
