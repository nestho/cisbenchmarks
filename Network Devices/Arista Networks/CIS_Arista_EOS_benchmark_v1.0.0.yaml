- id: 2.4.1
  title: Idle Timeout
  scoring: manual
  profile:
  - Level 1
  description: Tine out access to the console after a period of inactivity.
  rationale: Inactive unattended console sessions provide the opportunity for anyone with physical access to the device to
    make configuration changes enabling them to disrupt network operations resulting in a network outage.
