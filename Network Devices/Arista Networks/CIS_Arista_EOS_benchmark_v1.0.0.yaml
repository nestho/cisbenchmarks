- id: 3.1.1
  title: OSPF Interface Authentication
  scoring: manual
  profile:
  - Level 2
  description: OSPF authentication secures routing updates by verifying the identity of neighboring routers, preventing malicious
    devices from injecting false routing information. The OSPFv2 Secure Hash Algorithms (SHA) Authentication support as defined
    in RFC 5709 supports the configuration of SHA1, SHA256, SHA384 and SHA512 MessageDigest authentication as an alternative
    to the MD5 Message-Digest authentication.
  rationale: Because a routing protocol contains information that need not be kept secret, privacy is not a requirement. However,
    authentication of the messages within the protocol is of interest in order to reduce the risk of an adversary compromising
    the routing system by deliberately injecting false information into the routing system. SHA256 or higher should be used
    due to concerns about the overall strength of the MD5 and SHA1 algorithm.
  impact: ''
  references:
