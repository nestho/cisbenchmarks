- id: 2.5.3
  title: Authentication, Authorization, and Accounting
  scoring: manual
  profile:
  - Level 1
  description: The use of Authentication, Authorization, and Accounting (AAA) affords the best methods for controlling user
    access, authorization levels, and activity logging. By enabling AAA on the switches in conjunction with an authentication
    server such as TACACS+ or RADIUS the administrators can easily add or remove user accounts, add or remove command authorizations,
    and maintain a log of user activity.
  rationale: The Authentication, Authorization, and Accounting (AAA) framework is essential to securing a network device.
    The AAA framework provides a mechanism to authenticate and limit specific actions being performed within a management
    session. AAA also allows for accounting and logging of any commands that are executed within a management session.
  impact: Enabling AAA requires an authentication server available to accept connections and return results. Errors in configuration
    can lock users out of the device.
  references:
  - 1. https://www.arista.com/en/um-eos/eos-user-security#xx1348035
  - 2.6 SSH Access
  page_start: 49
  audit_raw: "switch#show running-config section aaa\naaa group server tacacs+ TACPLUS\n server {ip address} vrf mgmt\n!\n\
    aaa authentication login default group TACPLUS local\naaa authentication enable default group TACPLUS local\naaa authorization\
    \ exec default group TACPLUS local\naaa authorization commands all default group TACPLUS local\n!"
  remediation: 'Configure AAA. Servers should be reachable via the management vrf.

    switch(config)# aaa group server tacacs+ TACPLUS

    switch(config-sg-tacacs+-TACPLUS)# server {ip address} vrf {management vrf}

    switch(config-sg-tacacs+-TACPLUS)# server {ip address2} vrf {management vrf}

    switch(config-sg-tacacs+-TACPLUS)# exit

    switch(config)# aaa authentication default enable group TACACS+ local

    switch(config)# aaa authentication login default group TACPLUS local

    switch(config)# aaa authentication enable default group TACPLUS local

    switch(config)# aaa authorization exec default group TACPLUS local

    switch(config)# aaa authorization commands all default group TACPLUS local'
  checks:
  - type: sql
    command: show running-config section aaa
    severity: medium
    info: "switch#show running-config section aaa\naaa group server tacacs+ TACPLUS\n server {ip address} vrf mgmt\n!\naaa\
      \ authentication login default group TACPLUS local\naaa authentication enable default group TACPLUS local\naaa authorization\
      \ exec default group TACPLUS local\naaa authorization commands all default group TACPLUS local\n!"
