- id: 2.9.1
  title: Login Banner
  scoring: manual
  profile:
  - Level 1
  description: The login banner precedes the login prompt. Use a login banner to warn against unauthorized network access
    attempts or other messages to users.
  rationale: 'A legal banner is recommended on all external administrative interfaces. The purpose of a legal banner is to:
    • Provide Legal Protection should evidence need to be used from a device. • Act as a deterrent to potential intruders.
    • This banner must be displayed prior to login.'
  impact: ''
  references:
  - 1. https://www.arista.com/en/um-eos/eos-switch-administrationcommands#xx1107345
  page_start: 60
  audit_raw: 'This command will display to login banner if it is configured.

    show run section banner login

    If a banner is configured this will be displayed.

    banner login

    The contents of the banner are up to the end user. There are certain items that must be

    included in a legal banner. These include:

    • Statement that the device is for authorized users only.

    • The device is for official use only.

    • Users have no expectations of privacy.

    • All access and use may (not will) be monitored and/or recorded.

    • Monitoring and/or recording may be turned over to the appropriate authorities.

    • Use of the system implies consent to the previously mentioned conditions.

    The banner must not contain:

    • Mention of the purpose, location or owner of the device or any other identification

    information.

    • It should not say “Welcome” anywhere in the description.'
  remediation: "Configure a banner. An example banner is provided as a reference.\nswitch(config)#banner login\nEnter TEXT\
    \ message. Type 'EOF' on its own line to end.\n *** WARNING ***\nThis system is private and may be accessed only by authorized\
    \ users for\nofficial purposes.\nThe system owner reserves the right to monitor any and all activity taking\nplace on\
    \ this system and any attempts to connect to it.\nIndividuals using this computer system are subject to having all of\
    \ their\nactivities monitored and recorded by system personnel.\nUse of this system evidences an express consent to such\
    \ monitoring and\nagreement that if such monitoring reveals evidence of possible abuse or\ncriminal activity, system personnel\
    \ may provide the results of such\nmonitoring to appropriate officials.\nUnauthorized users or users who exceed (or attempt\
    \ to exceed), their\nauthorized level of access are subject to prosecution under any local or\ninternational laws that\
    \ apply as well as Company initiated proceedings.\nEOF\nswitch(config)#"
  checks:
  - type: sql
    command: show run section banner login
    severity: medium
    info: 'This command will display to login banner if it is configured.

      show run section banner login

      If a banner is configured this will be displayed.

      banner login

      The contents of the banner are up to the end user. There are certain items that must be

      included in a legal banner. These include:

      • Statement that the device is for authorized users only.

      • The device is for official use only.

      • Users have no '
