    \ header, enter the following\ncommand:\n3-modify /sys httpd include \"FileETag MTime Size\"\n Save the configuration\
    \ change by entering the following command:\n 4-save /sys config\n5-To restart the httpd service, enter the following\
    \ command:\nrestart /sys service httpd"
  checks:
