- id: '3.1'
  title: Ensure 'Idle timeout' is less than or equal to 10 minutes for Configuration utility sessions
  scoring: scored
  profile:
  - Level 1
  description: To set an idle timeout for GUI sessions
  rationale: Unattended administrative sessions may provide illegal access to the device
  impact: Indefinite or even long session timeout windows can increase the risk of attackers abusing abandoned sessions.
  references:
  - 1. https://support.f5.com/csp/article/K9908
  page_start: 29
  audit_raw: 'On Configuration utility:

    System > Preferences, Under Security settings...check the value of Idle Time

    Before Automatic Logout'
  remediation: 'On Configuration utility:

    System > Preferences, Under Security settings...set the value of Idle Time

    Before Automatic Logout to 600 seconds'
  checks:
  - type: manual_review
    info: 'On Configuration utility:

      System > Preferences, Under Security settings...check the value of Idle Time

      Before Automatic Logout'
    severity: medium
- id: '3.2'
  title: Ensure access to Configuration utility by clients using TLS version 1.2 or later
  scoring: scored
  profile:
  - Level 1
  description: TLSv1.2 should be used for GUI connections
  rationale: Restricting the configuration utility to use TLS version 1.2 is recommended
  impact: Weak security protocols may expose vulnerability by disclosing data through SSL/TLS sessions
  references:
  - 1. https://support.f5.com/csp/article/K02321234
  page_start: 31
  audit_raw: 'Through CLI access, type the following command:

    tmsh list sys httpd ssl-protocol

    The output should show only TLSv1.2'
  remediation: 'If the value is different, execute the following command to modify the protocol used to

    access GUI:

    tmsh modify /sys httpd ssl-protocol "TLSv1.2"

    tmsh save sys config'
  checks:
  - type: sql
    command: show only TLSv1.2
    severity: medium
    info: 'Through CLI access, type the following command:

      tmsh list sys httpd ssl-protocol

      The output should show only TLSv1.2'
- id: '3.3'
  title: Ensure access to Configuration utility is restricted to needed IP addresses only
  scoring: scored
  profile:
  - Level 1
  description: It is recommended to maintain secure access to the GUI by allowing only trusted IP addresses or range of IP
    addresses
  rationale: Any compromised network device within enterprise network would gain illegal access to F5 configuration utility
    abusing existing unresolved vulnerabilities.
  impact: Allowing any IP address to access may expose the management interface of F5 to different types of attacks such as
    DoS
  references:
  - 1. https://support.f5.com/csp/article/K13309
  page_start: 33
  audit_raw: 'The following command should show the list of allowed IP addresses:

    tmsh list /sys httpd allow'
  remediation: 'If the output of the above command show ALL, the following command would be executed

    to modify the settings:

    modify modify /sys httpd allow replace-all-with { <IP address or IP address

    range> }'
  checks:
  - type: sql
    command: 'show the list of allowed IP addresses:'
    severity: medium
    info: 'The following command should show the list of allowed IP addresses:

      tmsh list /sys httpd allow'
