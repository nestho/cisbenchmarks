  scoring: manual
  profile:
  - Level 1
  description: To prevent the disclosure of inode information when accessing Configuration utility (GUI).
  rationale: ''
  impact: When connecting to the Configuration utility, responses from the Apache server contain an Etag HTTP header that
    includes the file's inode information.(CVE-2003-1418).
  references:
