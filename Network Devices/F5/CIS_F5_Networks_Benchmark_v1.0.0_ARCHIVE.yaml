- id: '1.1'
  title: Passwords 1.1.1 Ensure default password of root is not allowed
  scoring: scored
  profile:
  - Level 1
  description: To assist users in changing default password for "root" account
  rationale: Using Default passwords for 'root' access could cause a compromise to the overall system security
  impact: Failure of changing default root's password brings high risk to the system as the root account might be abused by
    unauthorized users who would have full privilege on F5 systems
  references:
  - 1. https://api-u.f5.com/support/kb-articles/K13121?pdf
  page_start: 11
  audit_raw: Attempt to log in as root with default password
  remediation: '- Log in to the Configuration utility.

    - For System, select Platform.

    - Under User Administration, choose the Password box for either Root Account

    or Admin Account.

    - Enter the new password.

    - Enter the same password in the Confirm box for the account that you chose

    in step 3.

    - Select Update.

    - If you have updated the password for Admin Account, the system logs you out

    of the Configuration

    utility, and you must log in again using the new password.'
  checks:
  - type: manual_review
    info: Attempt to log in as root with default password
    severity: medium
