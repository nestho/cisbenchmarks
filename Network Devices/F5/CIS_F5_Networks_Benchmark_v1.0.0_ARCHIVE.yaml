- id: '5.3'
  title: Ensure port lockdown for self IP is set
  scoring: manual
  profile:
  - Level 1
  description: to secure the BIG-IP system from unwanted connection attempts on self-IP.
  rationale: ''
  impact: Default settings allow BIG-IP to listen on several ports on which some are not needed . Attackers may initiate attacks
    against the system self IPs on these ports . To reduce the risk , only needed ports should be enabled on self IPs.
  references:
  - 1. https://support.f5.com/csp/article/K17333
  page_start: 55
  audit_raw: '1-Log in to tmsh by typing the following command: tmsh

    2-Type the command : tmsh list net self-allow

    3-The output shows what protocols allowed for self-ip'
  remediation: '1-Log in to the Configuration utility.

    2-Go to Network > Self IPs.

    3-Select the relevant self IP address.

    4-If the specified interface does not need to listen to incoming connections

    ( Example BGP ,BDF ..etc) , set "Port Lockdown" to "Allow None"

    5-If the specified interface need to listen for incoming connections , set

    "Port Lockdown" to "Allow Custom". Then in the "Custom List" add needed ports

    only.'
  checks:
  - type: manual_review
    info: '1-Log in to tmsh by typing the following command: tmsh

      2-Type the command : tmsh list net self-allow

      3-The output shows what protocols allowed for self-ip'
    severity: medium
