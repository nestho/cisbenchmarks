    \ : Enabled\n SSH two factor authentication : Disabled\n SSH certificate as authorized-key : Disabled\nTrust Anchor (TA)\
    \ profiles can be viewed using the \"show crypto pki ta-profile\"\ncommand:\nswitch(config)# show crypto pki ta-profile\n\
    TA Profile Name TA Certificate Revocation Check\n-------------------------------- -------------------- ----------------\n\
    root-ca-for-ssh-server Installed, valid disabled\nswitch(config)#"
  remediation: 'switch(config)# ssh certificate-as-authorized-key

    switch(config)# ssh two-factor-authentication authorization local'
