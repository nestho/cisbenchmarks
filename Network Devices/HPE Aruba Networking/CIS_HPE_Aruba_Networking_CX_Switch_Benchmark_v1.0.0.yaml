- id: 1.8.1.1
  title: SFTP and SCP
  scoring: manual
  profile:
  - Level 1
  description: The copy command is widely used in AOS-CX switches to transfer files, configurations and log messages. The
    commonly used file transfer protocol TFTP transfers files in plaintext, so attackers can easily capture and view the contents
    of transferred packets. Secure copy protocols encrypt the copy payload to prevent unwanted access to the transferred data
  rationale: To protect malicious users from accessing the contents of transferred files, it is recommended to use SFTP and
    SCP to perform the copy operations.
  impact: Transferring files using other methods, such as TFTP exposes the file contents in plaintext to anyone who has access
    to the data stream betwen the switch and the target. This can lead to disclosure of sensitive information to unwanted
    actors.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/hardening/Content/Chp_hard-mgmt/secure-copy.htm
  - 2. https://arubanetworking.hpe.com/techdocs/AOSCX/10.11/HTML/cli_8400/Content/Chp_SpptCopy/SpptCopy_cmds/sup-copcom.htm
  page_start: 122
  audit_raw: 'The copy commands contains ootions for using SCP and SFTP as transfer protocols.

    examine the copy command to verify the source or desination is specified using the scp

    or sftp command'
  remediation: 'Select secure copy protocols when copying files to or from the switch. To copy a file to

    the device:

    switch# copy scp://root@10.0.1.1/config running-config

    or

    switch# copy sftp://root@10.0.1.1/config running-config

    To copy a file from the device:

    switch# copy running-config scp://root@10.0.1.1/config cli

    or

    switch# copy running-config sftp://root@10.0.1.1/config cli vrf mgmt'
  checks:
  - type: manual_review
    info: 'The copy commands contains ootions for using SCP and SFTP as transfer protocols.

      examine the copy command to verify the source or desination is specified using the scp

      or sftp command'
    severity: medium
- id: 1.9.1
  title: https-server default enablement
  scoring: manual
  profile:
  - Level 1
  description: On AOS-CX, the https-server is enabled by default allowing customers to access the device via its REST API
    or Web interface (WebUI). On campus products, the httpsserver is enabled on the default VRF. Products with an OOBM interface
    also have the https-server enabled on the mgmt VRF.
  rationale: Customers should be aware of this default enablement so that they can account for enabled management interfaces.
  impact: Lack of knowledge of enabled management interfaces can result in unexpected access of a network device.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/rest_v100x/Content/Chp_ena_acc/https_serv_cmds/htt-ser-vrf-10.htm
  - 2. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/rest_v100x/Content/Chp_ena_acc/https_serv_cmds/sho-htt-ser-10.htm
