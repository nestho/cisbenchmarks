- id: 1.9.2
  title: https-server idle session management
  scoring: manual
  profile:
  - Level 1
  description: https-server sessions are used by both the REST API and Web management interface (WebUI). By default, an https-server
    session will remain open for 20 minutes while idle. Customers should be setting the idle session timeout to the lowest
    value that can be tolerated.
  rationale: The https-server session timeout impacts both the REST API and WebUI. If it's only the WebUI being used, then
    an idle timeout of 5 minutes is recommended. If the REST API is being used, then the timeout should be based on how the
    management system is using the REST API. Ultimately, setting the session timeout to the smallest value is recommended
    in order to address this threat.
  impact: It's important that administrators know the idle duration of their management sessions. Sessions that are kept open
    too long may be taken over if the administrator walks away from their computer and fails to lock it. This can then lead
    to someone else gaining access to the device.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/rest_v100x/Content/Chp_ena_acc/https_serv_cmds/http-ser-ses-tim.htm
  - 2. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/rest_v100x/Content/Chp_ena_acc/https_serv_cmds/sho-htt-ser-10.htm
  page_start: 127
  audit_raw: "The \"show https-server\" command displays the configured session timeout:\nswitch# show https-server\nHTTPS\
    \ Server Configuration\n----------------------------\n VRF : default, mgmt\n REST Access Mode : read-write\n Max sessions\
    \ per user : 6\n Session timeout : 20"
  remediation: 'The session-timeout option can be used to set the idle session timeout:

    switch(config)# https-server session-timeout <minutes>'
  checks:
