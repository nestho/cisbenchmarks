    severity: medium
- id: 4.1.1
  title: Control Plane Policing
  scoring: manual
  profile:
  - Level 2
  description: This sequence describes configuring Control plane policing (COPP)
  rationale: Control Plane Policing prevents flooding of certain types of packets from overloading the switch or module CPU
    by either rate-limiting or dropping packets. The switch software provides several configurable classes of packets that
    can be ratelimited, including (but not limited to) ARP broadcasts, multicast, routing protocols (BGP, OSPF), and spanning
    tree. CoPP is always active and cannot be disabled.
  impact: 'CoPP is crucial for protecting the control plane and preventing network outages. It does, however, require careful
    configuration and monitoring to avoid unintended side effects. Misconfiguration can lead to performance degradation, network
    disruptions, and management issues, such as: • Excessive Policing: Overly restrictive CoPP policies can drop legitimate
    control plane traffic, leading to delayed or lost routing updates, impaired management access, and potentially impacting
    network performance. • CPU Cycle Consumption: If not configured effectively it can consume CPU cycles. • Slow or Unresponsive
    CLI Sessions: High CPU utilization or resource exhaustion caused by excessive traffic to the control plane can make interactive
    sessions via the command-line interface (CLI) slow or unresponsive. • Route Flaps: Excessive policing of line protocol
    keepalives or routing protocol updates (like BGP or OSPF updates) can lead to unstable routing, route flaps, neighbor
    adjacency flaps or timeouts, causing network instability. • Resource Exhaustion: A poorly configured CoPP policy could
    lead to route processor resource exhaustion, resulting in resources like memory and buffers becoming unavailable for legitimate
    IP data packets. • Unintended Errors: Incorrectly configured CoPP policies can lead to unintended consequences, such as
    blocking legitimate traffic or failing to adequately protect the control plane.'
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/hardening/Content/Chp_hard-ctrl/ctrl-pln-polic.htm
