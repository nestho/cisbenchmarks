- id: '1.13'
  title: Schedule Configuration Backup Job
  scoring: manual
  profile:
  - Level 1
  description: 'Create a job to periodically backup the configuration to a remote server. Status : waiting Number of commands
    : 1 Total execution count : 0 Failed execution count : 0 Job CLI commands ---------------- 1 cli copy running-config tftp://192.168.0.100/switch.cfg
    cli vrf mgmt Check schedule of jobs: switch# show schedule Schedule Name: backup_config Schedule config ---------------
    Enabled : Yes Trigger type : periodic Transient : No Max trigger count : indefinite Trigger start date : 2025-12-01 10:00
    Schedule Status --------------- Trigger status : active Next trigger time : Mon Dec 1 10:00:00 2025 Scheduled Jobs --------------
    1 : backup_config'
  rationale: 'It is crucial to have remote backups of configuration files for several key reasons, especially in today''s
    digital landscape: 1. Disaster Recovery and Business Continuity: • Protection Against Local Disasters: If your primary
    location experiences a disaster like fire, flood, or theft, having remote backups ensures your configuration files are
    safe and accessible from a different location. • Rapid Recovery: Remote backups allow you to restore systems quickly after
    a disaster, minimizing downtime and ensuring business continuity. • Part of a Comprehensive Plan: Remote backups are an
    essential component of a disaster recovery plan (DRP) and business continuity strategy. 2. Data Security and Redundancy:
    • Cyberattack Protection: Remote backups provide an extra layer of security, especially against ransomware and other cyber
    threats. If your primary systems are compromised, you can restore from clean backups. • Protection Against Hardware Failure
    and Human Error: Remote backups help you recover quickly from data loss due to hardware malfunctions, accidental deletions,
    or other human errors. • Geographical Redundancy: Storing backups in different locations protects against localized disruptions.
    3. Operational Benefits: • Automated Backups: Remote backup services can be configured to run automatically, reducing
    manual effort and minimizing the risk of human error. • Scalability: Remote backup solutions, particularly cloud-based
    ones, offer scalability to accommodate increasing data storage needs. • Remote Access: You can access and restore your
    configuration files from anywhere with an internet connection, providing flexibility. 4. Compliance and Long-Term Preservation:
    • Meeting Regulatory Requirements: Some industries and regulations mandate the use of offsite backups for data retention
    and compliance purposes. • Long-Term Preservation: Remote backups help ensure the long-term preservation of data assets,
    safeguarding against corruption, hardware obsolescence, and technological advancements.'
  impact: If no remote configuration backup strategy is implemented you can be exposed to issues with business continuity,
    disaster recovery and compliance.
  references: []
  page_start: 143
  audit_raw: "check which jobs are configured:\nswitch# show job\nJob Name : backup_config\n Enabled : Yes"
  remediation: 'Create a job to backup the configuration to a remote server

    switch(config)# job backup_config

    switch(config-job-config_backup)# 1 cli copy running-config

    tftp://192.168.0.100/switch.cfg cli vrf mgmt

    Schedule the job to run periodically:

    switch(config)# schedule backup_config

    switch(config-scheduler-backup_config)# 1 job backup_config

    switch(config-scheduler-backup_config)# trigger every days 1 start 12:04

    2024-03-18

    switch(config-scheduler-backup_config)# enable

    switch(config-scheduler-backup_config)# exit'
  checks:
  - type: sql
    command: show job
    severity: medium
    info: "check which jobs are configured:\nswitch# show job\nJob Name : backup_config\n Enabled : Yes"
- id: '2.1'
  title: Physical Security 2.1.1 USB Auxiliary port
  scoring: manual
  profile:
  - Level 2
  description: Disable USB Auxiliary port
  rationale: 'The AOS-CX switch front-panel includes an USB Auxiliary port for the following purposes: • USB Mass storage
    - flash drive for deploying, troubleshooting, backing up configurations, or upgrading switches • Bluetooth Adapter - allows
    Bluetooth enabled devices to connect to and manage the switch on a wireless Bluetooth Personal Area Network (PAN) The
    Bluetooth feature has been enabled by default in AOS-CX switches and designed for operational simplicity. The switch provides
    an IP address to paired devices though DHCP when they join the Bluetooth Personal Area Network. Paired devices can then
    manage the switch through following methods: • SSH • Web UI • REST API • Aruba CX Mobile App'
  impact: Disabling USB will prevent both USB devices from being mounted and Bluetooth adapters form being enabled. Disabling
    Bluetooth will only prevent Bluetooth adapters from being enabled.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/fundamentals_6300-6400/Content/SysHW_cmds/usb-10.htm
