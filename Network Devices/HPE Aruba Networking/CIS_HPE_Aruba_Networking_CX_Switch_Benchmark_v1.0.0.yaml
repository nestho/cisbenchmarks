- id: 1.5.1.3
  title: RadSec Server Configuration
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: 'RadSec Server: RadSec (RADIUS over TLS) is a secure extension of RADIUS that encrypts RADIUS communication
    using TLS. It provides secure authentication, authorization (through RBAC) and accounting for AOS-CX switches over untrusted
    networks like the WANs.'
  rationale: Unlike traditional RADIUS, which uses UDP and leaves communication vulnerable, RadSec ensures transport-layer
    encryption with TLS, offering enhanced security. RadSec is more suitable for environments where RADIUS traffic traverses
    public or untrusted networks. Local authentication, while simple, lacks centralized management and scalability.
  impact: Deploying RadSec improves data security by ensuring all authentication traffic is encrypted, reducing the risk of
    interception or tampering. It is especially beneficial in distributed networks with remote sites. However, it may require
    additional certificate configurations, increasing operational complexity.
  references:
