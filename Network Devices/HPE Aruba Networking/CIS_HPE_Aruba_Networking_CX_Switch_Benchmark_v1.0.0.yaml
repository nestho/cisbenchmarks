- id: 2.1.2
  title: Front Panel Security
  scoring: manual
  profile:
  - Level 1
  description: This sequence describes auditing the front panel reset button status
  rationale: 'AOS-CX switches include a reset button on the front panel to allow users to perform the following reset operations:
    Reset Type Procedure Outcome Soft Reset Press the reset button and release it The switch operating system is cleared gracefully.
    before 5 seconds. The switch then reboots and runs self-tests. Hard Reset Press the reset button and release it The switch
    reboots, like a power cycle. between 5 to 20 seconds. A hard reset is used, for example, when the switch CPU is in an
    unknown state or not responding. Factory Reset Press the reset button and release it The switch will undergo the factory
    reset process. between 20 to 25 seconds.'
  impact: This factory reset capability creates a security and denial-of-service risk if the switch is in a location where
    it is impossible to prevent physical access to the front panel. It is disabled by default and recommended that administrators
    disable this feature after its usage to prevent malicious use by an attacker with physical access to the device.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/hardening/Content/Chp_hard-mgmt/phys-secur.htm
