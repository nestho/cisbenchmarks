- id: 1.5.5
  title: Per User Management Interface Enablement
  scoring: manual
  profile:
  - Level 2
  description: 'By default, authenticated users are enabled for accessing the switch through all these available management
    interfaces: ssh, telnet, https-server, console. Additionally finegrained command authorization can be performed using
    RBAC , but it is applicable only for the CLIs not for Web-UI/REST API requests . Hence it is recommended to enable the
    specific management interfaces for the users based on the user type using below ways - 1. Local Per-User Management interface
    Enablement using CLI 2. Remote AAA Servers (Radius/ RadSec/ TACACS+) using VSA'
  rationale: Enabling a per-user management interface on Aruba AOS-CX switches allows network administrators to assign granular
    permissions and access rights to individual users. This tailored approach enhances the security posture of the network
    by restricting administrative privileges to only what is necessary for each user.
  impact: Implementing per-user management ensures compliance with organizational access control policies, reducing the risk
    of unauthorized changes to the switch configuration.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/security_54206200-6300-6400/Content/Chp_Mng_Use/per-user-mgmt-intfc-cfg.htm
  page_start: 106
  audit_raw: 'To view the configuration change -

    switch(config)# show user-list management-interface

    Sample Output -

    switch(config)# show user-list management-interface

    USER ENABLED MANAGEMENT INTERFACE(S)

    ------------------------------------------------------------

    admin ssh,telnet,https-sever,console

    admin1 telnet,https-server,console'
  remediation: 'Local per-user management interface enablement is performed with CLI command .

    Example of disabling the SSH management interface for local user admin1 -

    switch(config)# no user admin1 management-interface ssh

    For remote TACACS+ and RADIUS/RadSec servers, per-user management interface

    enablement is performed by configuring the AOS-CX VSA Aruba-User-Mgmt-Interface

    (ID = 69 , type = string). On the TACACS+ or RADIUS/RadSec server, the AOS-CX

    VSA Aruba-User-Mgmt-Interface must be set to a comma-separated list of management

    interface names for which login is permitted by the associated user. Management

    interfaces omitted from the list are disabled for the associated user. A maximum of four

    management interface names are allowed, with each management interface name

    given once. Permitted management interface names (always lowercase) are as follows:

    1. ssh

    2. telnet

    3. https-server

    4. console The VSA has a maximum length of 32 characters. The VSA is ignored

    by the switch if longer than 32 characters. When a user login fails because of an

    attempt to use a management interface that is not allowed, an event log is

    available indicating the enabled management interfaces as received in the

    TACACS+ or RADIUS/RadSec VSA.

    Example Remote server VSA value that enables the two named management interfaces

    (ssh, telnet) while disabling the two unnamed management interfaces (https-server,

    console):

    Aruba-User-Mgmt-Interface = "ssh,telnet"

    Example Remote server VSA value that enables all four management interfaces:

    Aruba-User-Mgmt-Interface = "ssh,telnet,https-server,console"'
  checks:
  - type: sql
    command: show user-list management-interface
    severity: medium
    info: 'To view the configuration change -

      switch(config)# show user-list management-interface

      Sample Output -

      switch(config)# show user-list management-interface

      USER ENABLED MANAGEMENT INTERFACE(S)

      ------------------------------------------------------------

      admin ssh,telnet,https-sever,console

      admin1 telnet,https-server,console'
- id: 1.5.6
  title: Login Privilege Elevation for Administrators
  scoring: manual
  profile:
  - Level 2
  description: By default, the AOS-CX switches only allow the administrator user to perform the "enable" command and when
    executed, the user is elevated in privilege without prompting for a password. To increase the security, login privilege
    elevation feature can be enabled. Configuration provided to enable/disable the privilege-elevation feature & will be disabled
    by default. The customer will have to enable this feature & then re-login for the privilege-elevation feature to take
    effect.. Upon successful login into the switch, the administrator user will be first provided with lower privilege access
    (the operator level access ‘>’ prompt) and upon executing the ‘enable’ command, will be prompted to enter a password.
    The user will have to enter the same password and will be reauthenticated to elevate the privilege to administrator (the
    administrator level access with ‘#’ prompt). Executing a disable will bring back the access to the ‘>’ prompt • Supported
    for Local/Radius/TACACS+ login authentications . • Applicable to only users in administrator group and same password for
    both levels.
  rationale: Every time a user runs the "enable" CLI, highly secure environments advise demanding a password.
  impact: The impact of this feature enhances security and operational efficiency by ensuring that only trusted users gain
    administrative access after executing "enable" CLI.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/security_54206200-6300-6400/Content/Chp_Loc_AAA/Loc_AAA_cmds/aaa-aut-priv-ele.htm
  page_start: 109
  audit_raw: 'To view the configuration change -

    switch# show run | in aaa

    aaa authentication login privilege-elevation group administrators'
  remediation: 'To enable login privilege-elevation for group administrators -

    Switch(config)# aaa authentication login privilege-elevation group

    administrators'
  checks:
  - type: sql
    command: show run | in aaa
    severity: medium
    info: 'To view the configuration change -

      switch# show run | in aaa

      aaa authentication login privilege-elevation group administrators'
- id: 1.6.1
  title: TLS Check Key Usage
  scoring: manual
  profile:
  - Level 2
  description: This sequence describes configuring TLS to enforce key usage checking
  rationale: The Extended Key Usage X.509 v3 extension defines one or more purposes for which the public key can be used.
    This is in addition to or in place of the basic purposes specified by the Key Usage extension. As per NDcPP recommendation
    , that a peer certificate being used to establish TLS connection must have its extended key usage field set as client-auth
    or server-auth, depending on its role of the peer device. This configuration enables the checking of key usage during
    TLS handshake. It is disabled by default.
  impact: ''
  references: []
  page_start: 112
