      \ncommand:\nswitch(config)# show crypto pki ta-profile\nTA "
- id: 1.9.4
  title: Assign a custom certificate to the https-server
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: The https-server is enabled by default and is assigned the "local-cert" as its server certificate. The "local-cert"
    is a self-signed certificate generated internally by the switch at first boot. Self-signed certificates generally aren't
    trusted by browsers and shouldn't be used in normal operation. It is recommended that customers add their own server certificate
    to the switch and assign it to the https-server.
  rationale: Self-signed certificates are normally flagged as invalid by modern browsers. The autogenerated "local-cert" serves
    as a placeholder for all certificate-based applications and is not meant for use in production networks.
  impact: Use of the "local-cert" may result in the inability for clients to connect to the https-server. Or it will raise
    support calls as the authenticity of the device cannot be properly validated.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/security_54206200-6300-6400/Content/Chp_PKI/ins-ca-sig-lea-cer-ini-swi-10.htm
