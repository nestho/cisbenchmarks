    \ set\n Lockout Time : 300\n Console Login Attempts : Not set\n Console Lockout Time : 300\nAuthentication for default\
    \ channel:\n--------------------------------------------------------\nGROUP NAME | GROUP PRIORITY\n--------------------------------------------------------\n\
    local | 0\n--------------------------------------------------------"
  remediation: 'To configure a local administrator-level user named localadmin with interactive

