- id: 1.4.3
  title: SNMP Traps
  scoring: manual
  profile:
  - Level 2
  description: Configuring SNMP (Simple Network Management Protocol) traps in AOS-CX switches enables proactive monitoring
    and management capabilities within the network infrastructure. SNMP traps act as automated notifications that are sent
    from the switches to a designated management system whenever specific events or thresholds occur, such as high cpu utilization,
    port status changes, or aaa server unreachability. This ensures real-time visibility into the health and performance of
    the switches. AOSCX switches support multiple SNMP traps, which are either enabled by default or through configuration.
  rationale: The rationale for configuring SNMP traps in AOS-CX switches lies in optimizing network operations and minimizing
    downtime. By enabling SNMP traps, administrators can quickly identify issues or changes in the switch environment without
    the need for constant manual monitoring. This configuration enhances efficiency, improves troubleshooting response times,
    and supports the overall stability and reliability of the network
  impact: Configuring SNMP traps in AOS-CX switches enables proactive issue detection, reducing downtime and improving response
    times.
  references:
  - 1. https://www.arubanetworks.com/techdocs/AOS-CX/10.15/PDF/snmp_mib.pdf
  page_start: 73
  audit_raw: 'To view the list of snmp traps enabled -

    switch# show run | in trap'
  remediation: "Configure SNMPv2c trap\nThis command is used to configure the trap receivers to which the SNMP agent can\n\
    send trap notifications -\nsnmp-server host <A.B.C.D | X:X::X:X> trap version <v1 | v2c> [community\nWORD] [port <UDP\
    \ port>] [vrf <VRF_NAME>]\nConfigure SNMPv3 trap\nThis command is used to configure the trap receivers to which the SNMP\
    \ agent can\nsend SNMPv3 trap notifications.\nsnmp-server host <A.B.C.D | X:X::X:X> <trap | inform> version v3 user <WORD>\n\
    [port <UDP port>] [vrf <VRF_NAME>]\nTo enable specific snmp trap -\nswitch(config)# snmp-server trap\n aaa-server-reachability-status\
    \ Enable SNMP trap for AAA server\nreachability\n status\n configuration-changes Enable configuration changes traps\n\
    \ cpu-utilization Enable high CPU utilization traps\n link-status Enable link status traps for all physical\n interfaces\n\
    \ mac-notify Enable MAC table change notification traps\n memory-utilization Enable high memory utilization traps\n module\
    \ Enable module event traps\n port-security Enable port-security violation traps.\n (Default: enable)\n rmon-events Enable\
    \ RMON event traps\n snmp Enable snmp traps"
  checks:
  - type: sql
    command: show run | in trap
    severity: medium
    info: 'To view the list of snmp traps enabled -

      switch# show run | in trap'
- id: 1.5.1.1
  title: Radius Server Configuration
  scoring: manual
  profile:
  - Level 2
  description: 'Remote AAA with RADIUS provides the following for your Aruba CX switch: • Authentication using remote RADIUS
    AAA servers. • Command authorization is not supported by RADIUS servers, however, userdefined local user groups can be
    configured with command-authorization rules, providing locally configured per command authorization for members of such
    groups. See User-defined user groups . In the switch default state (without userdefined local groups), basic role-based
    authorization is available with the three built-in roles (administrators, operators, auditors). • Transmission of locally
    collected accounting information to remote RADIUS servers.'
  rationale: Using a RADIUS server for AAA centralizes user management, ensuring uniform access policies across the network.
    It provides enhanced scalability, making it suitable for large networks with numerous users, compared to local AAA which
    is limited to individual switch.
