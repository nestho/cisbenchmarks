- id: 1.5.3.1
  title: Local Authorization
  scoring: manual
  profile:
  - Level 1
  description: Authorization controls authenticated users command execution and switch interaction privileges. Local authorization
    uses role-based access control (RBAC) to provide rolebased privilege levels plus optional user-defined local user groups
    with command execution rules. Authorization occurs only after successful authentication. • Administrators have full command
    execution and switch interaction privilege. • Operators are limited to the use of several nonsensitive show commands.
    • Auditors are limited to a few auditing-related commands. Optional per-command authorization is available through configuration
    of user-defined local user groups with command authorization rules applied to respective group members.
  rationale: Using local authorization on CX switches ensures faster authorization processes and eliminates dependency on
    external servers, enhancing reliability in scenarios where network connectivity to remote servers may be unavailable.
  impact: ''
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/security_54206200-6300-6400/Content/Chp_Loc_AAA/Loc_AAA_cmds/aaa-aut-com-dup10.htm
