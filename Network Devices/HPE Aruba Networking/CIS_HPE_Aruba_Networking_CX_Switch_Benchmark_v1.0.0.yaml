      GROUP NAME | GROUP PRIORITY\n---------------------------"
- id: 1.5.2.3
  title: Remote Authentication - RADIUS/RadSec/TACACS+
  scoring: manual
  profile:
  - Level 2
  description: Remote Authentication involves the use of remote RADIUS , RadSec and TACACS+ servers for authenticating the
    management users. Remote AAA servers are used as single point of management to configure and store user accounts. They
    are often coupled with directories and management repositories, simplifying the setup and maintenance of the end-user
    accounts.
  rationale: Remote authentication eliminates the need to manage local user accounts on each AOS-CX switch, simplifying administrative
    tasks and reducing the likelihood of configuration errors. Centralized control provided by remote servers allows for uniform
    enforcement of security policies, ensuring that all switches adhere to the same authentication and access standards.
  impact: Remote authentication servers, such as RADIUS or TACACS+, allow seamless management of a large number of switches
    across distributed networks, enabling administrators to scale authentication across multiple devices without local configuration
    overhead.
  references:
