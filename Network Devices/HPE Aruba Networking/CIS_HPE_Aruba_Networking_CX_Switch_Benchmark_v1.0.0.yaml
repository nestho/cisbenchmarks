- id: 1.2.1
  title: SSH Public Key Authentication
  scoring: manual
  profile:
  - Level 2
  description: This sequence describes configuring public-key authentication
  rationale: Passwords are easy to use and remember, but they are vulnerable to attacks and human errors. Keys are more secure
    and efficient compared to passwords. SSH Public key authentication is enabled by default and takes precedence over password-based
    authentication. Validate users identified with SSH public keys stored in the local user database using the following commands.
  impact: Public-key authentication uses a cryptographic pair if keys, public and private, to verify user identity and secure
    communication. A users private key is kept securely on the device used to connect to the switch. The users public key
    is configured on the switch as an authorizing key for that user. SSH public-key authentication is enabled (by default)
    on the switch to allow user connectivity.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/security_832x8400-9300-10000/Content/Chp_SSH_serv/ssh-ser.htm
  page_start: 42
  audit_raw: "switch# Show user <username> authorized-key <user public-key>\nswitch# show ssh authentication-method\n SSH\
    \ publickey authentication : Enabled\n SSH password authentication : Enabled\n SSH two factor authentication : Disabled\n\
    \ SSH certificate as authorized-key : Disabled\nswitch#"
  remediation: 'switch(config)# user <username> authorized-key <user public-key>

    Added SSH client''s authorized-key with key-identifier 1.

    switch(config)#'
  checks:
  - type: sql
    command: Show user <username> authorized-key <user public-key>
    severity: medium
    info: "switch# Show user <username> authorized-key <user public-key>\nswitch# show ssh authentication-method\n SSH publickey\
      \ authentication : Enabled\n SSH password authentication : Enabled\n SSH two factor authentication : Disabled\n SSH\
      \ certificate as authorized-key : Disabled\nswitch#"
- id: 1.2.2
  title: SSH Allow List
  scoring: manual
  profile:
  - Level 1
  description: This sequence describes configuring SSH access control list
  rationale: SSH server allow-list allows the switch admin to limit in-bound SSH connections to be from specific ip addresses
    or networks. Note that systen access control lists can also limit in-bound SSH traffic, depending on how they are configured.
    If an ACL is applied to the control-plane and the SSH allow-list is also enabled, the control-plane ACL has pre-emption
    over the SSH allow-list.
  impact: Configure a list of addresses that will be the only hosts allowed to connect to the SSH servers running on all VRFs
    of the switch. By default, the allow-list is disabled and any host is allowed to connect given the correct authentication
    criteria. When the allow-list is enabled, only the hosts that fall under one of the entries may connect with the correct
    authentication criteria, all other hosts will be denied to attempt authentication.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/security_832x8400-9300-10000/Content/Chp_SSH_serv/SSH_serv_cmds/ssh-ser-all-lis.htm
  page_start: 44
  audit_raw: "switch# show ssh server allow-list\nSSH server allow-list:\n Status: Enabled\n Allowed host IPs:\n 1.1.1.1\n\
    \ 2.2.2.0/24\n 10::10\n 20:20::/64\nswitch#"
  remediation: 'switch(config)# ssh server allow-list

    switch(config-ssh-al)# ip 1.1.1.1

    switch(config-ssh-al)# ip 2.2.2.0/24

    switch(config-ssh-al)# ipv6 10::10

    switch(config-ssh-al)# ipv6 20:20::/64

    switch(config-ssh-al)# enable

    Active SSH sessions will be terminated.

    Do you want to continue (y/n)? y

    switch(config-ssh-al# exit

