- id: 1.4.1.1
  title: Non Default Community Names, Access Rights & ACL
  scoring: manual
  profile:
  - Level 1
  description: The default SNMP community name is public, a common setting for SNMP-capable devices.
  rationale: Replace the public community name with another value that is hard to guess , but note that this doesn’t fully
    prevent against attacks as this name is in clear text format in packet captures.
  impact: By using a non-default (and strong) SNMP community name, you make it significantly harder for attackers to gain
    access to the SNMP interface of your devices.
  references: []
  page_start: 68
  audit_raw: 'To view the snmp community configuration -

    switch# show snmp community'
  remediation: 'The default access level for SNMP communities is read-only; if read-write support is

    required, set the access level for the community to rw from the community context. IPv4

    and/or IPv6 ACLs may be used to limit access to allowed management stations or

    subnets; only one ACL (IPv4 or IPv6) may be applied to a community at a time. Apply

    an IPv4 or IPv6 ACL from the SNMP config-community context -

    switch(config)# snmp-server community <community-name>

    switch(config-community)# access-level <ro | rw>

    switch(config-community)# access-list <IPv4 and/or IPv6 ACL>'
  checks:
  - type: sql
    command: show snmp community
    severity: medium
    info: 'To view the snmp community configuration -

      switch# show snmp community'
- id: 1.4.2.1
  title: SNMP V3
  scoring: manual
  profile:
  - Level 2
  description: SNMPv3, offers support for different users, authentication, and strong encryption. AOSCX supports stronger
    authentication protocols (SHA224, SHA256, SHA384, and SHA 512) and privacy protocols (AES192 and AES256).
  rationale: Enabling SNMPv3 enhances the security and reliability of network management by introducing authentication, encryption
    and message integrity features, addressing vulnerabilities present in earlier versions like SNMPv1 and SNMPv2c.
