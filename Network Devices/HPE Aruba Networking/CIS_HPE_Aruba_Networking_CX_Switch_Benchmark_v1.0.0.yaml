- id: '2.2'
  title: Traffic Control - Rate limiting
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: 'Configuring rate-limiting on Aruba CX switches allows administrators to control the maximum amount of traffic
    (bandwidth) that can pass through specific interfaces or for specific traffic types. This ensures that no single device
    or application can consume excessive network resources. Specifies the type of ingress traffic to which the rate limit
    applies: broadcast, multicast, unknown-unicast, or ICMP. The multicast rate limit affects multicast and broadcast traffic.
    The broadcast rate limit only affects broadcast traffic. When both types are applied to the same interface, broadcast
    packets are limited to the lower of the two rate values. Layer 2 BPDU packets, like spanning tree, are also included in
    the multicast rate limit. The ICMP rate limit can be configured to apply to IPv4, IPv6, or all IP traffic. Only one ICMP
    rate-limit can be configured at a time. Applying a new ICMP rate-limit replaces any previous ICMP rate-limit. Specifies
    the rate limit in kilobits per second, packets per second, or as a percentage of link bandwidth. Range: 64 to 100000000
    kbps (in steps of 64 kbps), 64 to 209090910 pps (in steps of 64 pps), or 1-100 percent. The actual rate limit will be
    approximately equivalent to the minimum of the two step values that are closest to the configured rate (or for percent
    mode, the kbps-converted rate). Hardware: Ethernet, MAC Address: 08:97:34:b1:20:00 MTU 1500 Type 1000BT qos trust none
    rate-limit broadcast 2000 pps (2000 actual) rate-limit icmp ip-all 10000 kbps (10000 actual) Speed 1000 Mb/s L3 Counters:
    Rx Disabled, Tx Disabled Auto-Negotiation is on Flow-control: off Rx 0 input packets 0 bytes 0 input error 0 dropped 0
    CRC/FCS L3: 0 packets, 0 bytes Tx 127 output packets 16510 bytes 0 input error 0 dropped 0 collision L3: 0 packets, 0
    bytes'
  rationale: Rate-limiting is implemented to prevent network congestion, mitigate the impact of potential denial-of-service
    (DoS) attacks, and ensure fair bandwidth allocation among users and applications. It helps maintain optimal network performance
    and stability
  impact: By configuring rate-limiting, organizations can improve network efficiency, protect critical services from being
    overwhelmed by excessive traffic, and ensure a consistent user experience. This proactive measure enhances both security
    and operational reliability.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/qos_54206200-6300-6400/Content/Chp_Config/cnf-rat-lim-10.htm
  page_start: 155
  audit_raw: "To view the configuration change -\nswitch# show interface <interface-ID> qos\nSample results -\nswitch# show\
    \ interface 1/1/3 qos\n Interface 1/1/3 is up\n Admin state is up"
  remediation: 'To configure rate-limit in interfaces -

    switch(config)# interface <ID>

    switch(config)# rate-limit {broadcast|multicast|unknown-unicast|icmp {ipall|ip|ipv6}} <RATE> {kbps|percent|pps}

    Sample configurations -

    Limiting broadcast traffic to 2000pps on interface 1/1/3:

    switch(config)# interface 1/1/3

    switch(config-if)# rate-limit broadcast 500 kbps

    Limiting all ICMP IPv4 traffic to 10000kbps on interface 1/1/3:

    switch(config)# interface 1/1/3

    switch(config-if)# rate-limit icmp ip 10000 kbps'
  checks:
  - type: sql
    command: show interface <interface-ID> qos
    severity: medium
    info: "To view the configuration change -\nswitch# show interface <interface-ID> qos\nSample results -\nswitch# show interface\
      \ 1/1/3 qos\n Interface 1/1/3 is up\n Admin state is up"
- id: '2.3'
  title: Proxy ARP
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: Proxy ARP is a technique by which a device on a given network answers the ARP queries for a network address
    that is not on that network. The ARP proxy is aware of the location of the traffic's destination, and offers its own MAC
    address as the final destination. Proxy ARP is supported on L3 physical and VLAN interfaces. It is disabled by default.
    Disabling Proxy ARP on unused interfaces in AOS-CX switches prevents the switch from responding to ARP requests on behalf
    of other devices, ensuring that it does not act as a proxy for IP address resolution on inactive ports.
  rationale: Enhances network security by preventing potential misuse of unused interfaces, such as spoofing or unauthorized
    traffic redirection. It also reduces unnecessary processing and ARP-related traffic on the network.
  impact: Disabling Proxy ARP on unused interfaces minimizes attack surfaces, safeguards against ARP-based attacks, and contributes
    to an optimized and secure network environment by eliminating unnecessary overhead on inactive ports.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/ip_services_6300-6400/Content/Chp_ARP/ARP_cmds/ip-proarp.htm
  - 2. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/ip_services_6300-6400/Content/Chp_ARP/ARP_cmds/ip-locpro-arp.htm
  page_start: 158
  audit_raw: 'All interfaces have the proxy arp capability turned off by default. To make sure it''s not

    enabled, the show command below can be verified. IPv4 -

    switch# show run | in proxy-arp

    IPv6 -

    switch# show run | in proxy-nd'
  remediation: 'Proxy ARP is disabled on all interfaces by default. Proxy ARP appears in the

    configuration only if it is enabled (which is usually undesirable). Disable this on an

    interface if it is enabled using below Configuration -

    switch(config)# interface <ID>

    switch(config)# no ip proxy-arp

    switch(config)# no ip local-proxy-arp

    switch(config)# no ipv6 local-proxy-nd'
  checks:
  - type: sql
    command: show command below can be verified. IPv4 -
    severity: medium
    info: 'All interfaces have the proxy arp capability turned off by default. To make sure it''s not

      enabled, the show command below can be verified. IPv4 -

      switch# show run | in proxy-arp

      IPv6 -

      switch# show run | in proxy-nd'
- id: '2.4'
  title: IP Directed Broadcast
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: IP Directed Broadcast is a feature by which remote administration tasks such as backups and wake-on-LAN (WOL)
    application can be achieved by sending directed broadcast packets for hosts and servers residing on a different subnets.
    IP Directed Broadcast is supported on ROP, SVI and L3LAG interfaces. It is disabled by default. Disabling IP directed
    broadcast on unused interfaces in AOS-CX switches prevents the switch from converting directed broadcast packets into
    Layer 2 broadcasts on a destination subnet. This configuration ensures that such traffic is dropped rather than propagated
    further into the network.
  rationale: IP directed broadcasts are often exploited in amplification attacks, such as Smurf attacks, which flood the network
    with broadcast traffic to disrupt operations. By disabling this feature on unused interfaces, network administrators can
    reduce the likelihood of these types of exploits. Additionally, it prevents unnecessary broadcast traffic from consuming
    resources on unused subnets.
  impact: Disabling IP directed broadcast on unused interfaces enhances network security by mitigating potential DoS amplification
    attacks. It reduces unnecessary processing and bandwidth usage caused by broadcast traffic on inactive interfaces. This
    configuration helps maintain network stability, improves overall performance, and minimizes attack surfaces by reducing
    the exposure of unused interfaces to malicious activity.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/ip_route_63006400-8100-83xx-9300-10000/Content/Chp_IPDirBroad/ip-dir-bro55.htm
  page_start: 160
  audit_raw: 'IP Directed Broadcast is disabled by default , it can be validated using below show

    command -

    switch# show run | in "ip directed-broadcast"'
  remediation: 'IP Directed broadcast is disabled by default on all interface , to disable it incase if its

    enabled by mistake -

    switch(config)# interface <ID>

    switch(config)# no ip directed-broadcast'
  checks:
  - type: sql
    command: 'show

      command -'
    severity: medium
    info: 'IP Directed Broadcast is disabled by default , it can be validated using below show

      command -

      switch# show run | in "ip directed-broadcast"'
- id: 3.1.1
  title: OSPF 3.1.1.1 OSPF Passive Interfaces
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: Enable OSPF Passive Interfaces
  rationale: The OSPF Passive Interface feature is used to prevent OSPF from forming neighbor relationships or exchanging
    Hello packets on specified interfaces, while still allowing the connected subnet to be advertised in the OSPF routing
    domain. This enhances network security by avoiding unauthorized OSPF adjacencies, reduces unnecessary control traffic,
    and optimizes resource utilization by limiting OSPF operations to only required interfaces. It is particularly useful
    for interfaces connected to end-user devices or untrusted networks, improving network stability and simplifying management
  impact: To limit where OSPF can learn neighbors, AOS-CX supports the passive OSPF interfaces. A passive OSPF interface has
    its IP subnets announced, but it does not establish neighbor relationships with other OSPF devices on the interface. You
    must make all OSPF enabled interfaces passive. Setting the OSPF enabled interfaces to from default to passive is done
    in the OSPF router instance context.The passive interface is then removed from each interface where OSPF neighbor relationships
    are allowed. Since this is an interface-level configuration change, it can be done from the interface context
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/ip_route_63006400-8100-83xx-9300-10000/Content/Chp_OSPFv2/OSPFv2_cmds/pas-intdef.htm
  - 2. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/ip_route_63006400-8100-83xx-9300-10000/Content/Chp_OSPFv3/OSPFv3_cmds/pas-intosp.htm
  page_start: 164
  audit_raw: 'To view the OSPF Passive interface configurations -

    OSPF -

    switch# show ip ospf [<process-id>] [all-vrfs | vrf <vrf-name>]

    switch# show ip ospf interface <interface-ID>

    OSPFv3 -

    switch# show ipv6 ospfv3 [<process-id>] [all-vrfs | vrf <vrf-name>]

    switch# show ipv6 ospfv3 interface <interface-ID>'
  remediation: 'Configure all OSPF enabled interfaces to be passive in OSPF router context

    OSPF -

    switch(config)# router ospf <OSPF Process ID>

    switch(config-ospf-<Process ID>)# passive-interface default

    OSPFv3 -

    switch(config)# router ospfv3 <OSPF Process ID>

    switch(config-ospfv3-<Process ID>)# passive-interface default

    The passive interface is then removed from each interface where OSPF neighbor

    relationships are allowed. Since this is an interface-level configuration change, it can be

    done from the interface context:

    To disable passive interface from selective interfaces -

    OSPF -

    switch(config)# interface <interface ID>

    switch(config-if)# no ip ospf passive

    OSPFv3 -

    switch(config)# interface <interface ID>

    switch(config-if)# no ipv6 ospfv3 passive'
  checks:
  - type: sql
    command: show ip ospf [<process-id>] [all-vrfs | vrf <vrf-name>]
    severity: medium
    info: 'To view the OSPF Passive interface configurations -

      OSPF -

      switch# show ip ospf [<process-id>] [all-vrfs | vrf <vrf-name>]

      switch# show ip ospf interface <interface-ID>

      OSPFv3 -

      switch# show ipv6 ospfv3 [<process-id>] [all-vrfs | vrf <vrf-name>]

      switch# show ipv6 ospfv3 interface <interface-ID>'
- id: 3.1.1.2
  title: OSPF Neighbor Authentication
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: Enable OSPF Neighbor Authentication
  rationale: The purpose of configuring OSPF neighbor authentication is to secure communication between OSPF routers and protect
    the integrity of routing information exchanged. By default, OSPF uses "null" authentication, meaning no authentication
    is applied, leaving OSPF control packets vulnerable to unauthorized access, tampering, or injection of malicious routing
    information. Introducing cryptographic authentication methods, such as HMAC-SHA-512, ensures that OSPF neighbors exchange
    routing information securely, preventing unauthorized devices from becoming OSPF neighbors and mitigating risks such as
    routing table poisoning or network disruptions caused by malicious actors.
  impact: HMAC-SHA-512 is a robust cryptographic hashing algorithm that offers strong protection against brute force and collision
    attacks. Configuring SHA-512 ensures a higher level of security for OSPF communications compared to plaintext passwords
    or weaker hashing algorithms. Requiring both devices to use the same authentication method and key ensures consistency
    and interoperability between OSPF neighbors, which is critical for maintaining stable OSPF adjacencies
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/ip_route_63006400-8100-83xx-9300-10000/Content/Chp_OSPFv2/OSPFv2_cmds/ip-osp-aut10-59.htm
  page_start: 168
  audit_raw: 'To view the OSPF neighbor authentication in interface -

    switch# show ip ospf interface <interface-ID>'
  remediation: 'AOS-CX keychain feature can be used to specify a system-level cryptographic

    authentication key which can be used by multiple OSPF interfaces -

    To configure the keychain with HMAC-SHA-512 cryptographic algorithm and keystring

    (Keystring can be entered as plaintext or as a hashed ciphertext string)-

    switch(config)# keychain <keychain-name>

    switch(config-keychain)# key <ID>

    switch(config-keychain-key)# cryptographic-algorithm hmac-sha-512

    switch(config-keychain-key)# key-string plaintext <plaintext-key-string>

    To associate the keychain in the OSPF enabled interface -

    switch(config-keychain-key)# interface <interface-ID>

    switch(config-if)# ip ospf authentication keychain

    switch(config-if)# ip ospf keychain <keychain-name>'
  checks:
  - type: sql
    command: show ip ospf interface <interface-ID>
    severity: medium
    info: 'To view the OSPF neighbor authentication in interface -

      switch# show ip ospf interface <interface-ID>'
- id: 3.1.1.3
  title: OSPFv3 Area Authentication and Encryption with IPsec
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: 'OSPFv3 neighbors may use interface-level authentication. An alternative method might be used to provide encryption,
    or authentication, or both for an entire OSPFv3 area using the IPsec protocol, which automatically applies the configured
    methods to all member interfaces. There are two IPsec encapsulation types supported on AOS-CX to secure OSPFv3 areas:
    • IPv6 authentication header (AH), which adds an IPv6 authentication header to OSPFv3 packets. • Encrypted Security Payload
    (ESP), which provides both authentication and encryption for OSPFv3 packets.'
  rationale: The implementation of OSPFv3 (Open Shortest Path First version 3) Area Authentication and Encryption using IPsec
    is essential for enhancing the security of routing protocols in modern networks. OSPFv3 is widely used in IPv6 environments,
    and its reliance on trust between routers makes it vulnerable to attacks such as unauthorized route injection, replay
    attacks, or data interception. By integrating IPsec for authentication and encryption, network administrators can ensure
    that OSPFv3 exchanges are securely transmitted, protecting the integrity and confidentiality of routing information. This
    added layer of security prevents malicious actors from compromising the routing infrastructure, thereby maintaining the
    reliability and performance of the network.
  impact: The use of IPsec for OSPFv3 authentication and encryption significantly strengthens the security posture of networks
    by safeguarding routing updates in transit. This ensures that only authorized routers can participate in OSPFv3 exchanges
    and that all routing information remains confidential and tamper-proof. As a result, the risk of routing table manipulation,
    traffic redirection, and denial of service attacks is greatly reduced. Furthermore, the adoption of IPsec aligns with
    organizational compliance requirements and best practices for securing IPv6 networks, mitigating vulnerabilities associated
    with unprotected routing protocols. Ultimately, this approach enhances network stability, reduces downtime, and fosters
    trust in critical communication infrastructure.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/ip_route_63006400-8100-83xx-9300-10000/Content/Chp_OSPFv3/OSPFv3_cmds/are-aut-ipsosp-10.htm
  page_start: 170
  audit_raw: 'To view the configuration change -

    show run ospfv3

    show ipv6 ospfv3 [<process-id>] [all-vrfs | vrf <vrf-name>]'
  remediation: 'IPsec authentication and encryption are configured from the OSPFv3 router process

    context. Both authentication and encryption require a specified Security Policy Index

    (SPI), which is an integer value between 256 and 4,294,967,295; this value is used on

    each OSPFv3 router in the secured area to match a configured IPsec authentication

    and/or encryption policy. Each OSPFv3 IPsec policy on a switch must use a different

    SPI value, and the SPI value (as well as authentication, or encryption keys, or both)

    must match across all OSPFv3 neighbor interfaces using that policy within the secured

    area. To configure AH authentication for OSPFv3 area 1, specify the SPI, authentication

    method (md5 or sha1), key type (plaintext, hex-string, or ciphertext) and the key string

    itself. If a key type and string are not specified, the user is prompted to enter a plaintext

    key interactively:

    switch(config)router ospfv3 <process-ID>

    switch(config-ospfv3-<process>)# area 1 authentication ipsec spi 1024 sha1

    Enter the IPsec authentication key: *******

    Re-Enter the IPsec authentication key: ********

    To configure ESP encryption for area 1, specify the SPI, authentication method,

    authentication key type and string, encryption type (3des, aes, des, or null), key type,

    and encryption key string. If the encryption type and key string are not specified, you are

    prompted to enter a plaintext key interactively. If the authentication key type and string

    are not specified, you are prompted to enter both a plaintext authentication key as well

    as the desired encryption type and plaintext key.

    switch(config)router ospfv3 <process-ID>

    switch(config-ospfv3-<process>)# area 1 encryption ipsec spi 1024 sha1

    Enter the IPsec authentication key: *******

    Re-Enter the IPsec authentication key: *******

    Enter the IPsec encryption type (3des/aes/des/null)? aes

    Enter the IPsec encryption key: ****************

    Re-Enter the IPsec encryption key: ****************

    Depending on the selected encryption type, a plaintext or hexadecimal encryption key

    must be set to a specific length as mentioned below:

    • 3DES:

    o Hexadecimal: 48 digits

    o Plaintext: 24 characters

    • DES:

    o Hexadecimal: 16 digits

    o Plaintext: 8 characters

    • AES:

    o Hexadecimal: 32, 48, or 64 digits

    o Plaintext: 16, 24, or 32 characters

    For AES encryption, the specified key lengths correspond to AES128, AES192, or

    AES256, respectively; the type of the key that will be used is automatically determined

    by the length of the entered encryption key. AOS-CX recommends using AES over DES

    or 3DES as it is stronger.'
  checks:
  - type: sql
    command: show run ospfv3
    severity: medium
    info: 'To view the configuration change -

      show run ospfv3

      show ipv6 ospfv3 [<process-id>] [all-vrfs | vrf <vrf-name>]'
- id: 3.1.2.1
  title: Control Plane ACL for BGP Peering Sessions
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: Utilizing the control-place ACL functionality to limit BGP communication to configured BGP peers
  rationale: Control Plane ACLs (CP-ACLs) are essential for securing BGP peering sessions by restricting unauthorized access
    to the control plane. They prevent threats like spoofed packets, unauthorized session attempts, and malicious traffic,
    ensuring only legitimate BGP traffic is processed. This protects the routing infrastructure's stability and prevents vulnerabilities
  impact: Implementing CP-ACLs enhances network security and stability by safeguarding the control plane from attacks such
    as DDoS or unauthorized BGP manipulation. This ensures secure and reliable routing updates, reduces disruptions, and strengthens
    the overall resilience and trustworthiness of the routing infrastructure.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/acls_63006400-8100-8360/Content/Chp_ACLs/ACLs_cmds/app-acc-lis-con-pla.htm
  page_start: 174
  audit_raw: 'To view the control plane ACL configuration -

    switch# show access-list control-plane'
  remediation: 'Devices running BGP listen for connections on TCP port 179. When establishing a BGP

    peer session, one device actively establishes a relationship with the other peer by

    sending the first TCP SYN packet. This device is at the outgoing side of the connection.

    The other peer, hearing the TCP SYN, responds with a SYN or ACK at the incoming

    connection. As each peer can assume either role, ACL entries need to be configured for

    BGP in both directions. Sample Control Plane ACL example is shown below, the these

    entries permit traffic from 10.20.0.10 so that it can establish a BGP peering session with

    the device. Either side could play the outgoing or incoming role in the BGP connection,

    so the ACL requires two entries per peer After allowing traffic from all configured peers,

    block all other devices from establishing a BGP peering session by denying all other

    traffic to or from TCP port 179.

    switch(config)# access-list ip <CONTROLPLANE-ACL-NAME>

    switch(config-acl-ip)# 800 comment LOCKDOWN BGP SESSIONS

    switch(config-acl-ip)# 805 permit tcp <10.20.0.10> gt 1023 any eq 179

    switch(config-acl-ip)# 810 permit tcp <10.20.0.10> eq 179 any gt 1023

    switch(config-acl-ip)# 815 deny tcp any gt 1023 any eq 179

    switch(config-acl-ip)# 820 deny tcp any eq 179 any gt 1023

    switch(config-acl-ip)# 990 comment ALLOW ANYTHING ELSE

    switch(config-acl-ip)# 1000 permit any any any

    switch(config-acl-ip)# exit

    switch(config) apply access-list {ip|ipv6} <CONTROLPLANE-ACL-NAME> controlplane vrf <VRF-NAME>'
  checks:
  - type: sql
    command: show access-list control-plane
    severity: medium
    info: 'To view the control plane ACL configuration -

      switch# show access-list control-plane'
- id: 3.1.2.2
  title: Authenticate BGP Peers Using MD5
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: The TCP sessions between the two peers can be secured by adding MD5 protection to the TCP session header
  rationale: Authenticating BGP peers using MD5 ensures that only trusted and authorized devices can establish BGP sessions,
    protecting the integrity of the routing infrastructure. By adding a cryptographic layer of authentication, MD5 mitigates
    risks such as session hijacking, spoofed connection attempts, or unauthorized access, ensuring that routing updates are
    exchanged securely between peers
  impact: Using MD5 for BGP peer authentication significantly improves network security by preventing unauthorized devices
    from establishing BGP sessions. This reduces the risk of malicious activity, such as route injection or disruption of
    routing operations, ensuring reliable and secure communication between peers while maintaining the stability and trustworthiness
    of critical routing protocols.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/ip_route_63006400-8100-83xx-9300-10000/Content/Chp_BGP/BGP_cmds/nei-pas-10.87.htm
  page_start: 176
  audit_raw: 'To view the BGP configuration -

    switch# show run bgp'
  remediation: 'The TCP sessions between the two peers can be secured by adding MD5 protection to

    the TCP session header. The MD5 digest acts like a password between peers. This

    configuration is done within the BGP configuration context, and both peers need to

    configure the same password either plaintext or ciphertext.

    switch(config)# router bgp <ASN>

    switch(config-bgp)# neighbor {<IP-ADDR>|<PEER-GROUP-NAME>} password

    [{ciphertext | plaintext} <PASSWORD>]'
  checks:
  - type: sql
    command: show run bgp
    severity: medium
    info: 'To view the BGP configuration -

      switch# show run bgp'
- id: 3.1.2.3
  title: BGP TTL Security
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: Enables BGP to establish connection with external peers residing on networks that are not directly connected
  rationale: BGP TTL Security is designed to prevent unauthorized devices or attackers from establishing BGP sessions by leveraging
    the Time-to-Live (TTL) field in IP headers. By requiring BGP packets to have a specific TTL value, typically set high
    (e.g., 255), it ensures that only directly connected peers can communicate, blocking spoofed or malicious BGP traffic
    from distant sources.
  impact: Implementing BGP TTL Security enhances the protection of BGP sessions by preventing attacks such as spoofed route
    advertisements or unauthorized session establishment from non-directly connected sources. This strengthens the network’s
    resilience against threats, reduces the risk of routing instability, and ensures reliable, secure communication between
    legitimate BGP peers.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/ip_route_63006400-8100-83xx-9300-10000/Content/Chp_BGP/BGP_cmds/nei-ttl-sec-hop10.htm
  page_start: 178
  audit_raw: 'To view the BGP configuration -

    switch# show run bgp'
  remediation: 'Configuration to enable BGP neighbor ttl-security-hops -

    switch(config)# router bgp <ASN>

    switch(config-bgp)# neighbor {<IP-ADDR>|<PEER-GROUP-NAME>} ttl-security-hops

    <hop-count>'
  checks:
  - type: sql
    command: show run bgp
    severity: medium
    info: 'To view the BGP configuration -

      switch# show run bgp'
- id: 3.2.1.1
  title: DHCPv4 & DHCPv6 Snooping Enablement
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: DHCP snooping protects the network from common DHCP attacks, including address spoofing resulting from a rogue
    DHCP server operating on the network or exhaustion of addresses on a DHCP server caused by mass address requests by an
    attacker on the network. DHCP snooping designates trusted DHCP servers and ports on which DHCP requests and responses
    are accepted.
  rationale: DHCP Snooping classifies switch ports as either trusted or untrusted. Trusted ports are those connected to legitimate
    DHCP servers. Untrusted ports are typically edge ports connected to end devices or untrusted networks. The switch inspects
    DHCP messages and allows only valid responses from trusted ports. Malicious or unauthorized DHCP responses from untrusted
    ports are dropped.
  impact: Prevents rogue DHCP servers from assigning incorrect or malicious IP configuration to clients. Protects against
    DHCP-based man-in-the-middle attacks.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/ip_services_6300-6400/Content/Chp_DHCP_snoop/dhc-sno-flml-xl-10.htm
  page_start: 181
  audit_raw: 'To view the configuration change with DHCPv4 & DHCPv6 snooping -

    switch# show dhcpv4-snooping

    switch# show dhcpv6-snooping'
  remediation: 'The following is a DHCPv4-snooping sample configuration -

    switch(config)# dhcpv4-snooping

    switch(config)# vlan <vlan-id>

    switch(config-vlan-id)# dhcpv4-snooping

    switch(config-vlan-id)# exit

    switch(config)#

    switch(config)# interface <trusted interface id>

    switch(config-if)# dhcpv4-snooping trust

    switch(config-if)# exit

    switch(config)# dhcpv4-snooping authorized-server <ipv4-server-address> vrf

    <vrf-name>

    The following is a DHCPv6-snooping sample configuration:

    switch(config)# dhcpv6-snooping

    switch(config)# vlan <vlan-id>

    switch(config-vlan-id)# dhcpv6-snooping

    switch(config-vlan-id)# exit

    switch(config)#

    switch(config)# interface <trusted interface id>

    switch(config-if)# dhcpv6-snooping trust

    switch(config-if)# exit

    switch(config)# dhcpv6-snooping authorized-server <ipv6-server-address> vrf

    <vrf-name>'
  checks:
  - type: manual_review
    info: 'To view the configuration change with DHCPv4 & DHCPv6 snooping -

      switch# show dhcpv4-snooping

      switch# show dhcpv6-snooping'
    severity: medium
- id: 3.2.1.2
  title: DHCPv6 Guard
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: DHCPv6 guard is an extension of DHCPv6 snooping. When the DHCPv6 snooping feature is configured globally and
    on the VLAN, the ports are configured as trusted and untrusted ports. DHCPv6 guard enhances this by creating a policy
    and applying it on a port and on the VLAN. This policy contains multiple attributes which are compared against the packet
    that is received on trusted ports. If the packet complies with the attributes of the policy, it is forwarded to the destination
    port; otherwise the packet is dropped.
  rationale: The DHCPv6 Guard feature on AOS-CX switches helps prevent rogue DHCPv6 servers from distributing unauthorized
    IPv6 addresses and configurations, ensuring the integrity of network operations. It achieves this by filtering DHCPv6
    server messages on trusted ports.
  impact: By mitigating the risks of rogue servers, DHCPv6 Guard enhances network security, reduces potential misconfigurations,
    and ensures reliable IPv6 address management, leading to a more stable and secure network infrastructure.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/ip_services_63006400/Content/Chp_DHCP_snoop/Dv6Snoop_cmds/dhcv6-sno-gua-pol.htm
  page_start: 184
  audit_raw: 'To view the configuration change with DHCPv6 guard:

    switch# show dhcpv6-snooping guard-policy'
  remediation: 'The following are sample configurations of DHCPv6 guard -

    switch(config)# dhcpv6-snooping guard-policy <policy-name>

    switch(config-dhcpv6-guard-policy)# match server access-list <acl-name>

    switch(config-dhcpv6-guard-policy)# preference min <6>

    switch(config-dhcpv6-guard-policy)# preference max <250>

    switch(config-dhcpv6-guard-policy)# match client prefix-list <prefix-list>

    switch(config-dhcpv6-guard-policy)# exit

    switch(config)# vlan <vlan-id>

    switch(config-vlan-id)# dhcpv6-snooping guard-policy <policy-name>'
  checks:
  - type: manual_review
    info: 'To view the configuration change with DHCPv6 guard:

      switch# show dhcpv6-snooping guard-policy'
    severity: medium
- id: 3.3.1.1
  title: PIM Accept-Register
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: PIM Accept-register is a security feature designed to control which sources and groups are allowed to register
    with the Rendezvous Point (RP). This feature works alongside the RP configuration and includes an access list (ACL) option
    to filter sources and groups. The ACL specifies rules for permitting or denying traffic based on source and group addresses.
    When configured, this functionality ensures that only authorized multicast sources and groups are registered with the
    RP, enhancing security and preventing unauthorized multicast traffic.
  rationale: By associating an ACL with a PIM router, administrators can filter and control the registration of multicast
    sources and groups. Without such control, unauthorized or malicious sources could register with the RP, potentially leading
    to resource misuse or network disruption. The PIM Accept-register feature performs a lookup to check if the source (S)
    and group (G) in a packet match the permitted list defined in the ACL. If there is no match or if a deny rule is encountered,
    the packet is dropped immediately, and a register stop message is sent. This mechanism ensures that only permitted multicast
    traffic is processed, enhancing the network's security and operational efficiency.
  impact: Packets matching the ACL permit rules are processed normally, while denied or unmatched packets are immediately
    dropped with a register stop message sent. This prevents unauthorized or malicious traffic from reaching the RP, enhancing
    network security and efficiency.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/multicast_5420-6200-6300-6400-8xxx-930010000/Content/Chp_pim-sm/pim-sm-ipv4_cmds/acc-reg-acc-lis.htm
  page_start: 189
  audit_raw: 'To view the configuration change -

    switch# show run pim

    switch# show run pim6'
  remediation: 'Sample PIM Accept-Register configuration -

    switch(config)# access-list ip <pim_reg_acl>

    switch(config-acl-ip)# 10 permit any <20.1.1.1> <225.1.1.2>

    switch(config-acl-ip)# 20 deny any <30.1.1.1> <225.1.1.3>

    switch(config-acl-ip)# exit

    switch(config)# router pim

    switch(config-pim)# accept-register access-list <pim_reg_acl>

    switch(config-pim)# exit

    switch(config)# access-list ipv6 <pim_regv6_acl>

    switch(config-acl-ipv6)# 10 permit any <20.::1> <ff1e::1>

    switch(config-acl-ipv6)# 20 deny any <30::1> <ff1e::3>

    witch(config-acl-ipv6)# exit

    switch(config)# router pim6

    switch(config-pim6)# accept-register access-list <pim_regv6_acl>

    switch(config-pim6)# exit'
  checks:
  - type: sql
    command: show run pim
    severity: medium
    info: 'To view the configuration change -

      switch# show run pim

      switch# show run pim6'
- id: 3.3.1.2
  title: PIM Accept-RP
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: PIM Accept-RP allows administrators to restrict which multicast groups a rendezvous point (RP) serves in a
    PIM sparse mode domain. By default, an RP accepts all multicast groups in the 224.0.0.0/4 range. Using an access list
    (ACL), this feature limits join/prune message processing to specific multicast groups, enhancing control and reducing
    unnecessary traffic.
  rationale: Without restrictions, an RP processes join/prune messages for all multicast groups in the default Class D range,
    leading to potential resource waste and security risks. PIM Accept-RP, configured with an ACL, ensures the RP handles
    only authorized multicast groups, preventing unwanted traffic and optimizing network operations.
  impact: The feature improves multicast efficiency and security by filtering out unauthorized groups. Permitted groups are
    processed as usual, while unwanted traffic is ignored. This targeted control reduces resource consumption and limits the
    risk of malicious or unnecessary multicast activity.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/multicast_5420-6200-6300-6400-8xxx-930010000/Content/Chp_pim-sm/pim-sm-ipv4_cmds/acc-rp.htm
  page_start: 191
  audit_raw: 'To view the configuration change -

    switch# show run pim

    switch# show run pim6'
  remediation: 'Configuration to enable PIM Accept RP ACL -

    switch(config)# access-list ip <pim_rp_grp_acl>

    switch(config-acl-ip)# 10 permit any any <225.1.1.2/255.255.255.0>

    switch(config-acl-ip)# 20 permit any any <239.1.1.2/255.255.255.0>

    switch(config)-acl-ip# exit

    switch(config)# router pim

    switch(config-pim)# accept-rp <30.1.1.1> access-list <pim_rp_grp_acl>

    switch(config-pim)# exit

    switch(config)# access-list ip <pim_rpv6_grp_acl>

    switch(config-acl-ipv6)# 10 permit any any <ff2e::2/64>

    switch(config-acl-ipv6)# 20 permit any any <ff1e::1/64>

    switch(config-acl-ipv6)# exit

    switch(config)# router pim6

    switch(config-pim6)# accept-rp <30::1> access-list <pim_rpv6_grp_acl>

    switch(config-pim6)# exit'
  checks:
  - type: sql
    command: show run pim
    severity: medium
    info: 'To view the configuration change -

      switch# show run pim

      switch# show run pim6'
- id: 3.3.1.3
  title: PIM SSM
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: Protocol Independent Multicast - Source-Specific Multicast (PIM-SSM) is a specialized subset of PIM sparse
    mode that enables efficient delivery of multicast traffic from specific sources to receivers. It relies on IGMP version
    3 (IGMPv3) for IPv4 and MLD version 2 (MLDv2) for IPv6 to allow receivers to explicitly specify the source from which
    they wish to receive multicast traffic. By default, PIM-SSM operates within the group range 232.0.0.0/8 for IPv4 and FF3x::/32
    for IPv6. The feature also allows administrators to customize this range using an access list (ACL) to define valid multicast
    group addresses.
  rationale: The design of PIM-SSM aligns with the goal of optimizing multicast traffic by allowing receivers to filter traffic
    based on source, thereby reducing overhead for both the network and end devices. The use of IGMPv3/MLDv2 protocols enables
    precise source selection, ensuring compatibility with modern network environments. The ability to modify the default SSM
    group range via ACLs provides network administrators with flexibility to tailor multicast configurations to meet specific
    organizational needs while adhering to operational constraints.
  impact: PIM-SSM significantly improves multicast traffic efficiency by eliminating unnecessary traffic from unwanted sources,
    reducing network congestion, and ensuring only relevant multicast streams are delivered to receivers. However, modifying
    the PIM-SSM range can lead to temporary traffic loss as the system rebuilds multicast states, potentially disrupting application
    performance momentarily. Ensuring uniformity in the SSM range across a network is critical to maintaining seamless multicast
    traffic delivery and avoiding inconsistencies in routing behavior.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/multicast_5420-6200-6300-6400-8xxx-930010000/Content/Chp_pim-ssm/pim-ssm-ipv4_cmds/pim-ssm-rng-acc-list-v4.htm
  - 2. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/multicast_5420-6200-6300-6400-8xxx-930010000/Content/Chp_pim-ssm/pim-ssm-ipv6_cmds/pim-ssm-rng-acc-list-v6.htm
  page_start: 193
  audit_raw: 'To view the configuration change -

    switch# show run pim

    switch# show run pim6'
  remediation: 'Configuration to enable PIM-SSM Range ACL -

    switch(config)# access-list ip <pim_ssm_grp_range_acl>

    switch(config-acl-ip)# 10 permit any any <225.1.1.2/255.255.255.0>

    switch(config-acl-ip)# 20 permit any any <239.1.1.2/255.255.255.0>

    switch(config-acl-ip)# exit

    switch(config)# router pim

    switch(config-pim)# pim-ssm range-access-list <pim_ssm_grp_range_acl>

    switch(config-pim)# exit

    switch(config)# access-list ipv6 <pim_ssm_v6grp_range_acl>

    switch(config-acl-ipv6)# 10 permit any any <ff2e::2/64>

    switch(config-acl-ipv6)# 20 permit any any <ff1e::1/64>

    switch(config-acl-ipv6)# exit

    switch(config)# router pim6

    switch(config-pim6)# pim-ssm range-access-list <pim_ssm_v6grp_range_acl>

    switch(config-pim6)# exit'
  checks:
  - type: sql
    command: show run pim
    severity: medium
    info: 'To view the configuration change -

      switch# show run pim

      switch# show run pim6'
- id: 3.3.2
  title: SSDP
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: The Simple Service Discovery Protocol (SSDP) is an application layer protocol and one of the key protocols
    that implement Universal Plug and Play (UPnP). SSDP enables network devices to discover and advertise network services
    by sending multicast discovery and advertisement messages to multicast IPv4 group address 239.255.255.250:1900 or multicast
    IPv6 group address FF0x::C.
  rationale: With UPnP, each device generates a unique multicast flow (Source IP, SSDP Group IP). In a multicast network with
    many end user devices, this can consume a large amount of multicast hardware and software resources as each device creates
    a unique (S, G) flow and the resources are limited.
  impact: In networks where there is a need to control, drop, or minimize SSDP traffic, summarized static multicast routes
    can be configured to save network resources and to avoid denial of services.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/multicast_5420-6200-6300-6400-8xxx-930010000/Content/Chp_stat-rou/stat_rou_cmds/ip-mult-stat-rou.htm
  - 2. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/multicast_5420-6200-6300-6400-8xxx-930010000/Content/Chp_stat-rou/use-case1.htm
  page_start: 195
  audit_raw: 'To view the configuration change -

    switch# show ip multicast-static-route all-vrfs'
