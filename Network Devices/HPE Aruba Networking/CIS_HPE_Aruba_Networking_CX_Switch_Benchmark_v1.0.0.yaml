- id: 1.9.3
  title: Two-factor authentication with the https-server server
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: Two-factor authentication provides an additional level of security by requiring administrators to perform X.509
    certificate-based authentication with the AOS-CX httpsserver. The two factors are possession of the certificate private
    key and knowledge of the password associated with the certificate private key. The switch must be configured with the
    corresponding CA certificate which issued the administrator's certificate.
  rationale: Customers with a large number of administrators can be configuration and maintenance challenge across a large
    network. Use of certificate-based and two-factor authentication can simplify this maintenance for customers.
  impact: Any changes in administrator user passwords or the additional or removal of administrator accounts can become a
    maintenance headache for customers. Use of two-factor authentication only requires the enablement of the feature and the
    addition of the corresponding CA certificate as a trust anchor.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/rest_v100x/Content/Chp_ena_acc/https_serv_cmds/htt-ser-aut-cer.htm
  - 2. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/rest_v100x/Content/Chp_ena_acc/https_serv_cmds/sho-htt-ser-aut.htm
