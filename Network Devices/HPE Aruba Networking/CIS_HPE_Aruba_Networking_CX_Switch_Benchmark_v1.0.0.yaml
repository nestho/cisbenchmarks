    TLS crypto algorithms state: default

    TLS key usage checking : off'
  remediation: 'switch# conf

    switch(config)# tls check-key-usage'
  checks:
  - type: sql
    command: show tls
    severity: medium
    info: 'switch# show tls

      TLS crypto algorithms state: default

      TLS key usage checking : off'
