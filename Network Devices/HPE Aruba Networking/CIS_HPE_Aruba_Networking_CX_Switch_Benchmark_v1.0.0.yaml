    switch# show https-server authentication\nAuthentication Modes Status\n----------------------------\n Password Status\
    \ : disabled\n Certificate Status : enabled\nTrust Anchor (TA) profiles can be viewed using the \"show crypto pki ta-profile\"\
    \ncommand:\nswitch(config)# show crypto pki ta-profile\nTA Profile Name TA Certificate Revocation Check\n--------------------------------\
    \ -------------------- ----------------\nroot-ca-for-ssh-server Installed, valid disabled\nswitch(config)#"
  remediation: 'switch(config)# https-server authentication certificate authorization radius

