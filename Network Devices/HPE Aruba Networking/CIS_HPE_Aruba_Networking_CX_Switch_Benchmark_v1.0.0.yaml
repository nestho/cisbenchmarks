- id: 1.5.1.2
  title: TACACS Server Configuration
  scoring: manual
  profile:
  - Level 2
  description: TACACS+ is a centralized authentication, authorization, and accounting protocol that provides granular control
    over user access and command-level authorization for AOSCX switches. It separates authentication, authorization, and accounting
    processes for enhanced flexibility.
  rationale: TACACS+ supports per-command authorization, making it ideal for switches where granular control is needed. Unlike
    RADIUS, it encrypts entire packets, ensuring better security, and it offers more detailed logging for compliance purposes.
    Local authentication lacks scalability and centralized management, making TACACS+ preferable for larger networks.
  impact: Implementing TACACS+ ensures improved security and centralized control, reducing the risk of unauthorized access
    or misconfiguration. It simplifies user management and audit trails, enhancing operational efficiency and compliance.
  references:
