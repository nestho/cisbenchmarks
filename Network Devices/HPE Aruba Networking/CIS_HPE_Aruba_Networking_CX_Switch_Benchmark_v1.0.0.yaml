- id: 4.3.1
  title: Control Plane ACL Management
  scoring: manual
  profile:
  - Level 2
  description: Restrict Management Access to trusted management devices
  rationale: Restricting what devices are allowed to access your network infrastructure helps reduce credential stuffing and
    man-in-the-middle (MITM) attacks.
  impact: There are significant risks associated with allowing any device with reachability to access the exposed ports on
    network infrastructure. White listing specific devices to allow specific interfaces ensures only specific devices will
    be able to access specific interfaces.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/hardening/Content/Chp_hard-mgmt/ctrl-plane-acl.htm
  page_start: 236
  audit_raw: switch# show access-list control-plane
  remediation: 'switch# conf

    switch(config)# access-list ip <acl-name>

    switch(config-acl-ip)# permit ip <ip address or network> any

    switch(config-acl-ip)# deny ip any any log

    switch(config)# apply access-list ip <acl-name> control-plane vrf mgmt'
  checks:
  - type: sql
    command: show access-list control-plane
    severity: medium
    info: switch# show access-list control-plane
