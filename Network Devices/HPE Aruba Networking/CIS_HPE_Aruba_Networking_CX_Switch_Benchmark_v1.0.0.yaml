- id: 1.5.4.1
  title: Local Accounting
  scoring: manual
  profile:
  - Level 1
  description: 'Local Accounting records all the CLI and REST access activities by users from all channels. It logs and helps
    to track all the configuration changes and show command executions happened at the switch for auditing or accounting purposes.
    This accounting information is captured and made available locally (Enabled by default and always active) and, if desired,
    for sending to remote AAA servers: • Exec Accounting: user login/logout events. • Command accounting: commands executed
    by users. • System accounting: remote accounting On/Off events. • Interactions on the non-CLI interfaces: REST and WebUI.
    The following is not captured or made available as accounting information: • CLI commands that reboot the switch. • Interactions
    in the bash shell. ( On the other hand, logging of “start-shell” CLI is supported . It helps in auditing)'
  rationale: Local accounting logs provide immediate access to user activity and configuration changes directly on the switch,
    ensuring visibility even when external logging systems are unavailable.
  impact: Enhances operational resilience and supports faster troubleshooting during network outages or remote accounting
    server failures.
  references:
