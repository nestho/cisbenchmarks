- id: 3.3.3
  title: IGMP Snooping ACL
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: IGMP snooping operates on a Layer 2 device as a multicast constraining mechanism designed to enhance multicast
    forwarding efficiency. It creates Layer 2 multicast forwarding entries by processing IGMP packets exchanged between hosts
    and routers. Without IGMP snooping, the switch would flood multicast packets to all hosts within a VLAN. By enabling IGMP
    snooping, the Layer 2 device forwards multicast packets associated with known multicast groups only to the receivers that
    have expressed interest, thereby conserving bandwidth on segments of the network where no hosts have requested the multicast
    traffic.
  rationale: The device may encounter invalid multicast entries if malicious users send IGMP reports, which can disrupt multicast
    services for legitimate users. To address this, configuring a multicast group policy using an access control list (ACL)
    allows the Layer 2 device to control which multicast groups hosts can join. The device filters IGMP reports according
    to the policy and adds the host's port to the outgoing port list only if the report is permitted by the policy. This ensures
    that multicast traffic flows only to authorized groups, providing better security and optimized resource utilization.
  impact: If an IGMPv3 packet contains multiple group addresses, the switch processes only the permitted group addresses per
    the ACL rules. Such packets are forwarded to the querier and PIM router, even if some group addresses are blocked. This
    prevents delays in learning permitted groups. If all group addresses in an IGMPv3 packet are denied by the ACL, the packet
    is not forwarded to the querier or PIM router, causing existing join messages for those groups to time out. For IGMPv2,
    if the packet does not match any rule or matches a deny rule, the packet is dropped, ensuring unauthorized multicast traffic
    is blocked.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/multicast_5420-6200-6300-6400-8xxx-930010000/Content/Chp_igmp_sno/igmp_sno_cmds/ip-igm-sno-acc-lis.htm
  page_start: 198
  audit_raw: 'To view the configuration change -

    switch# show run | in "ip igmp snooping"'
  remediation: 'To apply ACL to IGMP Snooping -

    switch(config)# ip igmp snooping apply access list <ACL-NAME>'
  checks:
  - type: sql
    command: show run | in "ip igmp snooping"
    severity: medium
    info: 'To view the configuration change -

      switch# show run | in "ip igmp snooping"'
- id: 3.3.4
  title: MLD Snooping ACL
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: Multicast Listener Discovery (MLD) snooping is a feature designed to optimize multicast traffic across the
    network by preventing multicast flooding within a VLAN. MLD snooping forwards multicast traffic only to ports that have
    initiated an MLD request for the multicast group. Additionally, MLD snooping supports configuration to drop packets that
    do not match the configured version and allows blocking multicast traffic on specific ports. This mechanism reduces unnecessary
    multicast traffic and improves network efficiency.
  rationale: Similar to IGMP, malicious users can generate invalid multicast entries using MLD reports, which can overwhelm
    the device and disrupt legitimate multicast services. To mitigate this risk, a multicast group policy configured with
    an ACL is used to filter MLD reports. The Layer 2 device adds a host’s port to the outgoing port list only if the MLD
    report complies with the policy. This ensures that only authorized multicast group traffic is forwarded, providing enhanced
    security and avoiding unnecessary resource consumption.
  impact: When an ACL is applied to MLD snooping, only permitted group addresses in MLD packets are processed. The packets
    containing allowed group addresses are forwarded to the querier and PIM router, while the traffic for denied groups is
    blocked by the ACL. If all multicast groups in an MLD packet are denied by the ACL, the packet is not forwarded, and existing
    join messages for those groups will time out. Ports that do not match the MLD group policy are blocked from receiving
    multicast traffic, ensuring that unauthorized or excessive traffic does not propagate across the network.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/multicast_5420-6200-6300-6400-8xxx-930010000/Content/Chp_mlds/mlds_vlan_cfg_cmds/ipv-mld-sno-app-acc-lis.htm
  page_start: 200
  audit_raw: 'To view the configuration change -

    switch# show run | in "ipv6 mld snooping"'
  remediation: 'To configure the MLD snooping ACL -

    switch(config)# ipv6 mld snooping apply access list <ACL-NAME>'
  checks:
  - type: sql
    command: show run | in "ipv6 mld snooping"
    severity: medium
    info: 'To view the configuration change -

      switch# show run | in "ipv6 mld snooping"'
- id: 3.3.5
  title: MSDP Authentication & SA Filtering
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: The Multicast Source Discovery Protocol (MSDP) connects multiple PIM-SM domains, enabling RPs to share multicast
    source information using SA messages over TCP. It simplifies interdomain multicast routing by supporting an interdomain
    source tree instead of a shared tree.
  rationale: MSDP is crucial for efficient interdomain multicast routing in multi-domain networks. MD5 authentication secures
    peer connections, while ACL-based SA filtering allows precise traffic control, improving network performance and mitigating
    security risks.
  impact: MSDP enhances multicast scalability by enabling cross-domain source discovery while reducing configuration complexity.
    Features like MD5 authentication and SA filtering improve security, optimize traffic flow, and prevent unauthorized or
    unnecessary data processing.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/multicast_5420-6200-6300-6400-8xxx-930010000/Content/Chp_msdp/mdsp_peer_cfg_cmds/sa-fil-acc-lis.htm
  - 2. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/multicast_5420-6200-6300-6400-8xxx-930010000/Content/Chp_msdp/mdsp_peer_cfg_cmds/pas-msd.htm
  page_start: 202
  audit_raw: 'To view the configuration change -

    switch# show run msdp'
  remediation: 'Configuration to enable Authentication -

    switch(config)# router msdp

    switch(config-msdp)# ip msdp peer <ip-address>

    switch(config-msdp-peer)# password plaintext <password>

    User can prevent the incoming and outgoing SA messages on MSDP router by creating

    incoming and outgoing filter lists using an ACL.

    Configuration to associate ACL -

    switch(config-msdp-peer)# sa-filter in access-list <acl-name>

    switch(config-msdp-peer)# sa-filter out access-list <acl-name>'
  checks:
  - type: sql
    command: show run msdp
    severity: medium
    info: 'To view the configuration change -

      switch# show run msdp'
- id: 3.3.6
  title: MSDP SA Cache limit
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: By default, the MSDP SA has no limit configured per peer. All (S, G) entries within the system capacities are
    allowed. If there is a reboot or HA switchover, the (S, G) cache allocation occurs based on first come first served basis.
    The (S, G) entries are allocated until they reach the system capacity or peer limit based on whichever is reached first
    and new sets of (S, G) requests are discarded.
  rationale: The sa-limit command limits the overall number of (S, G) entries that a device can accept from specified MSDP
    peers and store in a SA-cache. When configured, the device maintains a per-peer count of (S, G) messages stored in the
    SA-cache and ignores new messages from a peer if the configured sa-limit for that peer has been reached. This command
    protects MSDP enabled devices from denial of service (DOS) attacks.
  impact: Configuring the MSDP SA cache limit mitigates the risk of denial-of-service (DoS) attacks by restricting excessive
    multicast source entries. It prevents attackers from overwhelming the system with excessive SA messages, preserving network
    stability. Proper limits ensure resilience against DoS threats while maintaining reliable multicast traffic handling.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/multicast_5420-6200-6300-6400-8xxx-930010000/Content/Chp_msdp/msdp_rou_cfg_cmds/sa-lim.htm
  page_start: 204
  audit_raw: 'To view the configuration change -

    switch# show run msdp'
  remediation: 'Configuration to enable MSDP SA cached limit -

    switch(config)#router msdp

    switch(config-msdp)#ip msdp peer <peer-address>

    switch(config-msdp)#sa-limit <value>'
  checks:
  - type: sql
    command: show run msdp
    severity: medium
    info: 'To view the configuration change -

      switch# show run msdp'
- id: 3.3.7
  title: Multicast Boundary ACL
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: A multicast boundary ACL (Access Control List) is a configuration mechanism that filters multicast traffic
    at specified interfaces to control the routing of multicast packets. This feature works on Point-to-Point links, including
    ROP/L3 LAG or Point-to-Point SVI, and can manage both multicast data and control packets, such as IGMP joins and PIM join/prune
    messages. The ACL rules can match multicast group entries (*,G) and use subnet masks to define address ranges, supporting
    IP, IGMP, and PIM protocols. While MSDP (Multicast Source Discovery Protocol) continues to forward source announcements
    (SA messages) across boundaries regardless of ACL configurations, multicast boundary ACLs play a crucial role in defining
    which multicast traffic is permitted or denied between different domains. The feature is IPv4-specific and does not support
    Anycast RP with MSDP mesh groups across boundaries. For filtering PIM bootstrap messages, a separate pim bsr-boundary
    configuration is required
  rationale: The primary rationale for implementing multicast boundary ACLs is to enforce traffic control and domain isolation
    in multicast-enabled networks. By filtering multicast traffic at the interface level, organizations can prevent unwanted
    or unauthorized multicast traffic from being routed across domains, which helps maintain network security and stability.
    The ability to match specific group addresses, such as the example where traffic for 239.0.0.0/8 is denied while 224.0.0.0/4
    is permitted, gives network administrators granular control over traffic policies. This control is critical in preventing
    multicast routing loops, managing traffic congestion, and ensuring that only necessary multicast traffic flows between
    domains.
  impact: Configuring multicast boundary ACLs has a significant impact on network performance, security, and traffic management.
    By applying filters in both inbound and outbound directions, the feature ensures that only authorized multicast traffic
    crosses domain boundaries, reducing the likelihood of network overload or disruptions caused by excessive or misrouted
    multicast packets. It also enhances security by isolating multicast domains, preventing unauthorized traffic from infiltrating
    sensitive areas of the network.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/multicast_5420-6200-6300-6400-8xxx-930010000/Content/Chp_pim-sm/pim-ip-mcst/ip-mcst-bnd.htm
  page_start: 206
  audit_raw: 'To view the configuration change -

    switch# show run'
  remediation: "The boundary ACL example shown below creates a boundary where group address in\n239.0.0.0/8 is denied and\
    \ all other group addresses in 224.0.0.0/4 are permitted. Since\nthe source address is any, it matches (*,G) traffic.\
    \ The boundary will be applied in both\nin and outbound directions.\naccess-list ip bound\n 10 deny any any 239.0.0.0/255.0.0.0\n\
    \ 20 permit any any 224.0.0.0/240.0.0.0\ninterface lag 1\n ip address 40.1.1.1/24\n ip pim-sparse enable\n ip multicast\
    \ boundary access-list bound"
  checks:
  - type: sql
    command: show run
    severity: medium
    info: 'To view the configuration change -

      switch# show run'
- id: 3.3.8
  title: Multicast BSR Boundary
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: PIM Bootstrap messages (BSMs) play a crucial role in electing a Rendezvous Point (RP) for multicast routing
    within a domain. However, exchanging these messages across different multicast domains is undesirable, as it can result
    in the unintended election of an RP in a domain where it does not belong, disrupting multicast operations. To address
    this, the bsr-boundary configuration can be applied to boundary interfaces, ensuring that PIM BSMs originating from external
    domains are dropped and that internally generated BSMs are confined to their domain.
  rationale: The rationale for restricting the propagation of PIM Bootstrap messages across multicast boundaries is to preserve
    the integrity and isolation of domain-specific RP elections. Allowing such messages to traverse domains can lead to conflicts
    or misconfigurations, where RPs are incorrectly elected in domains they are not supposed to serve. By using the bsr-boundary
    feature, network administrators can enforce strict boundaries, ensuring that multicast routing remains consistent and
    domain-specific, preventing cross-domain interference.
  impact: Implementing the bsr-boundary configuration has a significant impact on maintaining the stability and efficiency
    of multicast routing. It prevents RP election conflicts across domains, ensuring that each multicast domain operates independently
    and without disruption.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/multicast_5420-6200-6300-6400-8xxx-930010000/Content/Chp_pim-sm/pim-sm-ipv4_cmds/ip-pim-spa-bsr.htm
  page_start: 208
  audit_raw: 'To view the configuration change in the interface -

    switch# show run interface'
  remediation: 'Configuration to enable Multicast BSR Boundary -

    switch(config)# interface <ID>

    switch(config-int)# ip pim-sparse bsr-boundary'
  checks:
  - type: sql
    command: show run interface
    severity: medium
    info: 'To view the configuration change in the interface -

      switch# show run interface'
- id: '3.4'
  title: IP Source Lockdown
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: IP source lockdown provides added security by preventing IP source address spoofing on a per-port basis. Every
    packet is inspected for this purpose in hardware. When IP source lockdown is enabled, IP traffic received on an interface
    (port) is forwarded only if the VLAN, IP address, MAC address, and interface (port) match the IP binding database entry.
    To use IP source lockdown, the IP binding database must be populated. The binding database is dynamically populated by
    DHCP snooping that learns and saves the binding information. Alternatively, the IP binding database can be statically
    populated with the iP source-binding command.
  rationale: The IP Source Lockdown feature on AOS-CX switches enhances network security by preventing unauthorized devices
    from spoofing IP addresses. It ensures that only legitimate devices with pre-approved IP-to-MAC bindings can communicate
    on the network. This minimizes risks of IP spoofing attacks and unauthorized access.
  impact: By implementing IP Source Lockdown, organizations can significantly reduce vulnerabilities to man-in-the-middle
    attacks, unauthorized device access, and network disruptions. This improves overall network integrity, enhances compliance
    with security policies, and ensures reliable and secure connectivity for critical business operations.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/ip_services_6300-6400/Content/Chp_IP_sou_LD/ip-sou-loc630-840-10.htm
  page_start: 210
  audit_raw: 'To view the IPv4 source lockdown information -

    show ipv4 source-lockdown [binding [interface <IFNAME> | ip <IPV4-ADDR> | mac

    <MAC-ADDR>| vlan <VLAN-ID>] | interface <IFNAME>]

    Following command shows all IPv4 static source binding information irrespective of

    source lockdown configuration -

    show ipv4 source-binding

    To view the IPv6 source lockdown information -

    show ipv6 source-lockdown [binding [interface <IFNAME> | ip <IPV6-ADDR> | mac

    <MAC-ADDR>| vlan <VLAN-ID>] | interface <IFNAME>]

    Following command shows all IPv6 static source binding information irrespective of

    source lockdown configuration -

    show ipv6 source-binding'
  remediation: 'To enable IP source lockdown resource extended on the device (supports dynamically

    sharing hardware resources of IP source lockdown with other features) -

    switch(config)# ip source-lockdown resource-extended

    To enable IPv4/IPv6 source lockdown for all VLANs on the selected interface (port) -

    switch(config)# interface <interface-id>

    switch(config-if)# ipv4 source-lockdown

    switch(config-if)# ipv6 source-lockdown

    To add static IPv4/IPv6 client source binding information to the switch IPv4/IPv6 binding

    database -

    Ipv4 source-binding <VLAN-ID> <IPV4-ADDR> <MAC-ADDR> <IFNAME>

    ipv6 source-binding <VLAN-ID> <IPV6-ADDR> <MAC-ADDR> <IFNAME>'
  checks:
  - type: manual_review
    info: 'To view the IPv4 source lockdown information -

      show ipv4 source-lockdown [binding [interface <IFNAME> | ip <IPV4-ADDR> | mac

      <MAC-ADDR>| vlan <VLAN-ID>] | interface <IFNAME>]

      Following command shows all IPv4 static source binding information irrespective of

      source lockdown configuration -

      show ipv4 source-binding

      To view the IPv6 source lockdown information -

      show ipv6 source-lockdown [binding [interface <IFNAME> | ip <IPV6-ADDR> | mac

      <MAC-ADDR>| vlan <VLAN-ID>] | interface <IFNAME>]

      Following '
    severity: medium
- id: '3.5'
  title: Dynamic ARP Inspection
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: Dynamic ARP Inspection (DAI) is a security feature available in AOS-CX switches that validates ARP packets
    on the network to prevent ARP spoofing and ARP-based man-inthe-middle attacks. It verifies ARP requests and responses
    against trusted sources, such as DHCP snooping and static ARP entries.
  rationale: Dynamic ARP inspection ensures that ARP traffic is authenticated before being forwarded, preventing attackers
    from injecting forged ARP packets to redirect traffic. This feature is critical in maintaining the integrity of Layer
    2 networks and protecting devices from malicious attempts to hijack IP addresses.
  impact: Implementing Dynamic ARP Inspection enhances network security by blocking malicious ARP packets and mitigating risks
    of ARP-based attacks. It reduces downtime caused by compromised devices and ensures reliable communication in enterprise
    environments. However, misconfiguration or lack of trusted entries may disrupt legitimate traffic.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/ip_services_6300-6400/Content/Chp_ARP/ARP_cmds/arp-insfl-xl-ml-10.htm
  page_start: 212
  audit_raw: 'To View the ARP Inspection configuration & Statistics -

    switch# show arp inspection [interface | vlan]

    switch# show arp inspection statistics'
  remediation: 'Following command enables Dynamic ARP inspection on the current VLAN, which

    means that ARP packets received from untrusted interfaces are discarded if they have

    an Invalid IP-to-MAC address binding -

    switch(config)# vlan <vlan-id>

    switch(config-vlan)# arp inspection

    Configures the interface as a trusted. All interfaces are untrusted by default -

    switch(config)# interface <interface-id>

    switch(config-if)# arp inspection trust

    Dynamic ARP Inspection is enforced using DHCP Snooping binding and Static IP

    Binding. Refer to the DHCP Snooping section for the DHCP snooping configuration. To

    enable the Static IP Binding use the below configuration -

    switch(config)# vlan <vlan-id>

    switch(config-vlan)# arp ipv4 <IPV4_ADDR> mac <MAC_ADDR>'
  checks:
  - type: sql
    command: show arp inspection [interface | vlan]
    severity: medium
    info: 'To View the ARP Inspection configuration & Statistics -

      switch# show arp inspection [interface | vlan]

      switch# show arp inspection statistics'
- id: '3.6'
  title: ND Snooping
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: 'ND (Neighbor Discovery) Snooping is a security feature that enhances IPv6 network integrity by monitoring
    and validating IPv6 neighbor discovery messages. It prevents malicious activities such as ND spoofing and rogue advertisements.
    ND snooping drops invalid ND packets, and combined with IPv6 Source Lockdown, blocks data traffic from invalid hosts.
    ND snooping learns the source MAC addresses, source IPv6 addresses, input interfaces and VLANs of incoming ND messages
    and data packets to build IP binding entries. ND snooping drops ND packets for the following reasons: • If the Ethernet
    source MAC address does not match the address in the ICMPv6 Target link layer address field of the ND packet. • If the
    global IPv6 address in the source address field does not match the ND snooping prefix filter table. • If the global IPv6
    address or the link-local IPv6 address in the source IP address field does not match the ND snooping binding table.'
  rationale: The feature ensures that only legitimate IPv6 devices can communicate on the network by maintaining a trusted
    ND cache. This reduces vulnerabilities and strengthens Layer 2 and Layer 3 IPv6 communication.
  impact: ND Snooping improves network security by mitigating IPv6-based attacks, enhances device discovery accuracy, and
    ensures reliable communication between endpoints in IPv6 environments.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/ip_services_6300-6400/Content/Chp_NDsnoop/nd-sno-63010.htm
  page_start: 214
  audit_raw: 'To view the ND snooping configuration -

    switch # show nd-snooping'
  remediation: 'The following are sample VLAN configurations of globally enabled ND snooping -

    switch(config)# nd-snooping

    switch(config)# vlan <vlan-id>

    switch(config-vlan-id)# nd-snooping

    switch(config-vlan-id)# exit

    switch(config)#'
  checks:
  - type: sql
    command: show nd-snooping
    severity: medium
    info: 'To view the ND snooping configuration -

      switch # show nd-snooping'
- id: '3.7'
  title: RA Guard
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: 'RA (Router Advertisement) Guard is a security feature in AOS-CX switches that monitors and filters IPv6 Router
    Advertisement messages, allowing only authorized RAs to propagate. It helps prevent rogue or malicious routers from disrupting
    network operations. When RA guard policy is enabled (with ipv6 nd-snooping ra-guard policy), RA packets received on trusted
    ports are validated against a set of parameters configured on the policy and assigned to a port or VLAN. RA Guard policy
    options include: • Hop Limit • Managed Config Flag • Other Config Flag • Router Preference • ACL • Advertised Prefix Lists'
  rationale: The feature ensures that only trusted router advertisements can influence the IPv6 routing environment. This
    is critical for maintaining the integrity of the routing configuration and mitigating attacks like rogue RA injection
    and man-in-the-middle exploits.
  impact: By deploying RA Guard, network administrators can prevent unauthorized devices from acting as routers, reducing
    the risk of network disruptions and enhancing overall IPv6 network stability, security, and performance.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/ip_services_63006400/Content/Chp_NDsnoop/NDsnoop_cmds/nd-sno-ra-gua-ml-xl-10.htm
  - 2. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/ip_services_63006400/Content/Chp_NDsnoop/RAguard_pol_cmds/nd-sno-ra-gua-pol.htm
  page_start: 216
  audit_raw: 'To view the RA guard configuration -

    switch# show nd-snooping ra-guard interface <interface-id>'
  remediation: 'This command enables Routing Advertisement (RA) guard on the selected VLAN.

    When enabled, ingress Routing Advertisement (RA) packets on the selected VLAN are

    blocked on untrusted ports. The packets are forwarded when received on trusted ports -

    switch(config)# nd-snooping enable

    switch(config)# vlan <id>

    switch(config-vlan-id)# nd-snooping ra-guard

    switch(config-vlan-id)# exit

    switch(config)#

    Following commands enables RA guard policy, hence RA packets received on trusted

    ports are validated against a set of parameters configured on the policy and assigned to

    a port or VLAN -

    switch(config)# ipv6 nd-snooping ra-guard policy <POLICY-NAME>

    switch(config-raguard-policy)# hop-limit <enable | minimum | maximum>

    switch(config-raguard-policy)# match <access-list | prefix-list>

    switch(config-raguard-policy)# managed-config-flag <on | off>

    switch(config-raguard-policy)# other-config-flag <on | off>

    switch(config-raguard-policy)# router-preference <high | medium | low>

    switch(config-raguard-policy)# exit

    switch(config)# vlan <id>

    switch(config-vlan-id)# nd-snooping ra-guard attach-policy POLICY_NAME'
  checks:
  - type: sql
    command: show nd-snooping ra-guard interface <interface-id>
    severity: medium
    info: 'To view the RA guard configuration -

      switch# show nd-snooping ra-guard interface <interface-id>'
- id: '3.8'
  title: IPv6 Destination Guard
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: The IPv6 Destination Guard feature in AOS-CX switches provides security by validating IPv6 traffic against
    a known database of allowed destinations. It ensures only authorized destination IP addresses are reachable, mitigating
    risks of unauthorized access or malicious activity within the network.This feature requires the binding table to be populated
    with the help of DHCPv6 snooping, ND snooping, or static-ip-bindings. Destination guard enables the destination address
    based filtering of IPv6 traffic and blocks the Neighbor Discovery (ND) protocol resolution for destination addresses that
    are not found in the binding table.
  rationale: With the growing adoption of IPv6, networks are exposed to a wider attack surface. IPv6 Destination Guard helps
    secure the network by filtering traffic based on trusted destination addresses, preventing spoofing or unauthorized communication
    to sensitive resources.
  impact: Implementing IPv6 Destination Guard enhances network security by mitigating threats like IPv6 address spoofing and
    unauthorized data exfiltration. It contributes to a robust, reliable, and secure network environment by ensuring only
    legitimate IPv6 destinations are accessible.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/ip_services_63006400/Content/Chp_Dest_guard/Dest_guard_cmds/ipv6-des-gua.htm
  page_start: 219
  audit_raw: 'This command displays ipv6 destination-guard configuration -

    switch# show ipv6 destination-guard'
  remediation: 'Configuring IPV6 Destination Guard on a VLAN -

    switch(config)# vlan <id>

    switch(config-vlan-<id>)# ipv6 destination-guard'
  checks:
  - type: manual_review
    info: 'This command displays ipv6 destination-guard configuration -

