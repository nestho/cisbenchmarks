- id: 1.2.4
  title: Recommended Ciphers, MACs, and Algorithms
  scoring: manual
  profile:
  - Level 1
  description: This sequence describes configuring SSH server ciphers, MACs, and algorithms
  rationale: SSH server ciphers, MACs, and algorithms allow the admin to select specific values for SSH encryption, allowing
    for flexibility and/or greater security in the SSH sessions.
  impact: SSH ciphers , message authentication codes (MACs), and algorithms are based on OpenSSH's default settings and are
    deemed secure by the community. For highly secure deployments like Federal Accounts which mandates the compliance of NDcPP
    (Common Criteria Protection Profile), it is recommended to configure more secure ciphers , MACs, and algorithms as per
    the NDcPP evaluation criteria.
