- id: 1.10.1
  title: ServiceOS Password
  scoring: manual
  profile:
  - Level 1
  description: This sequence descries enabling password authentication for ServiceOS login.
  rationale: By default, the ServiceOS shell (accessible only from the local switch console port) requires no password to
    login as admin. This will allow un-privileged users with console access to log in to the ServiceOS shell.
  impact: Enabling ServiceOS password authentication prevents unintended users from log into the ServiceOS shell, significantly
