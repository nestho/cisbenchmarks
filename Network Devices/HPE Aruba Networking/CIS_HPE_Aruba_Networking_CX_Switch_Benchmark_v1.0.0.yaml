- id: 1.3.2
  title: Configuring Time Services
  scoring: manual
  profile:
  - Level 1
  description: This sequence describes configuring time services. AOS-CX supports both NTP client and NTP server functionality
    NTP client can be configured manually or via DHCP option 42.
  rationale: Network Time services are used to synchronize computer clocks across a network, ensuring accurate and consistent
    timekeeping for various applications and services. This synchronization is crucial for tasks like file system updates,
    network management, security, and distributed systems. Network Time Protocol (NTP) provides a reliable source of accurate
    time that can enable time synchronization between multiple devices dispersed across any network.
  impact: 'Inaccurate timekeeping between network devices can lead to many undesirable results including: • inability to correlate
    events between devices, making debugging difficult. • failure of network authentication services, as many require time
    synchronization to operate. • time-based network attacks that exploit the time settings differences in network devices.
    • operational and security best practice is to configure more than 1 NTP server'
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.14/HTML/fundamentals_6300-6400/Content/Chp_IniCfg/NTP_cmds/ntpcom.htm
  page_start: 63
  audit_raw: "to view the NTP configuration:\nswitch0(config)# show run | include ntp\nntp server 10.10.10.10 minpoll 10 maxpoll\
    \ 14 iburst prefer\nntp server 20.20.20.20\nntp enable\nntp vrf mgmt\nntp conductor vrf default stratum 4\nswitch(config)#\n\
    To view NTP status:\nswitch# show ntp status\nNTP Status Information\nNTP : Enabled\nNTP DHCP : Enabled\nNTP Authentication\
    \ : Disabled\nNTP Server Connections : Using the mgmt VRF\nSystem time : Mon Jun 30 15:40:40 PDT 2025\nNTP uptime : 10\
    \ days, 3 hours, 52 minutes, 19 seconds\nNTP Synchronization Information\nNTP Server : 10.10.10.10 at stratum 4\nPoll\
    \ interval : 1024 seconds\nTime accuracy : Within 0.000836 seconds\nReference time : Mon, Jun 30 2025 15:05:34.146 as\
    \ per\nAmerica/Los_Angeles\nTo view NTP associations:\nswitch# show ntp associations\n----------------------------------------------------------------------\n\
    \ ID NAME REMOTE REF-ID ST LAST POLL REACH\n----------------------------------------------------------------------\n+\
    \ 1 10.10.10.10 10.10.10.10 10.10.100.100 3 702 1024 377\n+ 2 20.20.20.20 20.20.20.20 20.20.200.200 4 776 1024 377\n----------------------------------------------------------------------\n\
    switch#\nTo show NTP server info:\nswitch# show ntp servers\n------------------------------------------------------\n\
    \ NTP SERVER KEYID MINPOLL MAXPOLL OPTION VER\n------------------------------------------------------\n 10.10.10.10 --\
    \ 6 10 iburst 4 prefer\n 20.20.20.20 -- 6 10 iburst 4\n------------------------------------------------------\nswitch#\n\
    To show NTP assiociations:\nswitch# show ntp associations\n----------------------------------------------------------------------\n\
    \ ID NAME REMOTE REF-ID ST LAST POLL REACH\n----------------------------------------------------------------------\n+\
    \ 1 10.10.10.10 10.10.10.10 10.10.100.100 3 702 1024 377\n+ 2 20.20.20.20 20.20.20.20 20.20.200.200 4 776 1024 377\n----------------------------------------------------------------------\n\
    switch"
  remediation: "Note: In order for the NTP process to associate with a server, the switch time must be\nset to within 15 minutes\
    \ of the NTP server time.\nTo set switch time:\nswitch(config)# clock datetime YYYY-MM-DD HH:MM:SS\nswitch(config)# clock\
    \ timezone <timezone>\nswitch(config)#\nNTP Client:\nConfigure an NTP time source:\nswitch(config)# ntp server <DNS-name\
    \ or IP-address> <optional parameters>\nswitch(config)#\nNote: Optional parameters:\n burst NTP Association use burst\
    \ mode\n iburst NTP Association use iburst mode\n key-id <4-17> NTP Key ID\n maxpoll <4-17> NTP maximum poll time to use\
    \ configuration\n minpoll <4-17> NTP minimum poll time to use configuration\n prefer NTP Association preference configuration\n\
    \ version <3-4> NTP Association version configuration\nTo allow NTP server being set via DHCP option 42:\nswitch(config)#\
    \ ntp dhcp-enable\nswitch(config)#\nTo specify a VRF for NTP to listen on:\nswitch(config)# ntp vrf <vrf_name>\nTo enable\
    \ NTP:\nswitch(config)# ntp enable\nExample config of NTP client:\nswitch(config)# clock datetime 2025-06-30 14:22:00\n\
    switch(config)# clock timezone americas/los_angeles\nswitch(config)# ntp server 10.10.10.10 iburst minpoll 10 maxpoll\
    \ 14 prefer\nswitch(config)# ntp server 20.20.20.20\nswitch(config)# ntp vrf mgmt\nswitch(config)# ntp enable\nNTP Conductor:\n\
    Note:\n• NTP clients and conductor must be enabled together. Configure NTP client first.\n• NTP conductor MUST be enabled\
    \ on a vrf other than the vrf of NTP client.\nConfigure an NTP Conductor:\nswitch(config)# ntp conductor stratum <1-15>\
    \ vrf <vrf_name>\nswitch(config)#\nExample config of and NTP conductor:\nswitch(config)# clock datetime 2025-06-30 14:22:00\n\
    switch(config)# clock timezone americas/los_angeles\nswitch(config)# ntp server 10.10.10.10 iburst minpoll 10 maxpoll\
    \ 14 prefer\nswitch(config)# ntp vrf mgmt\nswitch(config)# ntp conductor stratum 4 vrf default\nswitch(config)# ntp enable"
  checks:
