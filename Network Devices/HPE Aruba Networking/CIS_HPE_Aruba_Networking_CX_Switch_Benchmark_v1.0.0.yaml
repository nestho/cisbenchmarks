- id: '1.7'
  title: Firmware 1.7.1 Firmware Validation
  scoring: manual
  profile:
  - Level 1
  description: 'All AOS-CX switch firmware is signed by HPE at the time the firmware is created. The firmware signature is
    verified at the time of download and verified at every boot. The public keys used to verify the firmware is stored within
    the bootloader and firmware. The firmware is digitally signed with RSA-3072 and SHA-256. If the switch firmware validation
    fails at boot, the switch will fail to boot with one of the following error messages and drop the user into the ServiceOS
    login screen: Error: Signature verification failed Error: Signature not found Error: Invalid signature'
  rationale: Firmware is validated when downloaded to the device and on every boot. A manual check can be done on the firmware
    images at any time.
  impact: Firmware that fails validation will not be downloaded to the device. Firmware already on the device that fails validation
    will fail to boot.
  references: []
  page_start: 117
  audit_raw: 'administrators can verify the firmware integrity using below show command before

    booting the switch. The verify option performs an integrity check that the image has a

    valid signature and is compatible with this system. The switch prevents the download of

    firmware without a valid signature.

    switch# show images verify primary

    The primary image is valid

    switch# show images verify secondary

    The secondary image is valid'
  remediation: 'Firmware without a valid signature will not boot. A new firmware image with a valid

    signature should be copied onto the device.'
  checks:
  - type: sql
    command: show command before
    severity: medium
    info: 'administrators can verify the firmware integrity using below show command before

      booting the switch. The verify option performs an integrity check that the image has a

      valid signature and is compatible with this system. The switch prevents the download of

      firmware without a valid signature.

