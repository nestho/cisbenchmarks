- id: 1.2.6
  title: SSH Server Key
  scoring: manual
  profile:
  - Level 1
  description: This sequence describes configuring the SSH server keys.
  rationale: An SSH server key, also known as a host key, is a cryptographic key that identifies an SSH server to a client.
    It's generated when the SSH server is enabled and acts as a digital fingerprint, ensuring the server's identity during
    the connection process.
  impact: 'Weak SSH host keys create significant security risks by making systems vulnerable to attack. Attackers can exploit
    weak keys to intercept or manipulate communications, steal sensitive data, or even gain unauthorized access to the server.
    Among the risks associated with weak SSH-server keys are: • Man in the middle (MITM) attacks • Server identity spoofing
    • Key theft and impersonation • Unauthorized access • Compromised user credentials • Compliance issues To mitigate these
    risks it is important to: • Generate Strong Keys • Use strong cryptographic algorithms and key lengths when generating
    SSH host keys • Rotate Keys Regularly • Use a Key Management System • Monitor SSH Connections • Disable Weak Algorithms'
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/AOSCX-CLIBank/cli_8360/Content/Chp_SSH_serv/SSH_serv_cmds/ssh-hos-key55.htm
