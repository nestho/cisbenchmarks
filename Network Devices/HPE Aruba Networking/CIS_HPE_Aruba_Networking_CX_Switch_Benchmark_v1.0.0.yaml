- id: 1.3.1
  title: NTP Authentication
  scoring: manual
  profile:
  - Level 1
  description: This sequence describes configuring NTP authentication.
  rationale: Many secure protocols and auditing functions rely on system times being synchronized with a reliable time source,
    either within or (where security considerations permit) external to the managed network. Network Time Protocol (NTP) is
    used to synchronize clocks on networked devices, ensuring consistent timestamps for various applications. This is crucial
    for tasks like accurate logging, security analysis, and reliable operation of distributed systems.
  impact: NTP authentication support allows the NTP client to verify that servers are in fact known and trusted and not intruders
    intending accidentally or intentionally to masquerade as a legitimate server.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/hardening/Content/Chp_hard-mgmt/time-sync.htm
  page_start: 60
  audit_raw: 'switch# show ntp servers

    ------------------------------------------------

    NTP SERVER KEYID MINPOLL MAXPOLL OPTION VER

    ------------------------------------------------

    10.100.1.254 -- 6 10 none 4 prefer

    10.80.2.219 -- 6 10 iburst 4 prefer(auto)

    pool.ntp.org -- 4 4 iburst 4

    ------------------------------------------------

    switch# show ntp authentication-keys

    -----------------------------------------------------------------------------

    -----

    Key ID Trusted Type Encrypted Key

    -----------------------------------------------------------------------------

    -----

    1 No MD5 AQBapUtt1YTjZS2PH4+J7G5OKJG0GuZ2WxmD0339TNg6nfGXY=

    -----------------------------------------------------------------------------

    --

    switch# show ntp status

    NTP Status Information

    NTP : Enabled

    NTP DHCP : Enabled

    NTP Authentication : Enabled

    NTP Server Connections : Using the mgmt VRF

    System time : Fri Mar 8 03:51:46 PST 2024

    NTP uptime : 8 days, 15 hours, 24 minutes, 37 seconds

    Not synchronized with an NTP server.'
  remediation: 'switch(config)# ntp authentication

    switch(config)# ntp authentication-key 1 md5 <ntpauthkey>

    switch(config)# ntp server 10.10.10.10 prefer

    switch(config)# ntp vrf mgmt'
