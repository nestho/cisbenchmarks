- id: '1.1'
  title: Securing Switch Management Access 1.1.1 Create security user group
  scoring: scored
  profile:
  - Level 1
  description: This sequence creates a new local user group which can be used for security administrators.
  rationale: Some organizations have a security officer which has a subset of responsibilities compared to an administrator.
    A security administrator should be able to view, clear, and copy the security logs on the device.
  impact: The use of a built-in administrators or operators account for the security officer would provide an excess of access
    to the device.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/security_54206200-6300-6400/Content/Chp_Mng_Use/use-def-use-gro-10.htm
  page_start: 18
  audit_raw: 'Create the security administrator group with the following:

    switch(config)# user-group <group>

    switch(config-usr-grp-<group>)# permit cli command "show security-logs*"

    switch(config-usr-grp-<group>)# permit cli command "clear security-logs"

    switch(config-usr-grp-<group>)# permit cli command "copy security-log*"

    switch(config-usr-grp-<group>)# exit

    Security administrators can be added to this new group through the following:

    switch(config)# user <name> group <group> password

    Adding user <name>

    Enter password:************

    Confirm password:************'
  remediation: 'Perform the following to determine if the security role is available:

    switch# show user-group | include <group>'
  checks:
  - type: sql
    command: show security-logs*"
    severity: medium
    info: 'Create the security administrator group with the following:

      switch(config)# user-group <group>

      switch(config-usr-grp-<group>)# permit cli command "show security-logs*"

      switch(config-usr-grp-<group>)# permit cli command "clear security-logs"

      switch(config-usr-grp-<group>)# permit cli command "copy security-log*"

      switch(config-usr-grp-<group>)# exit

      Security administrators can be added to this new g'
- id: 1.1.2
  title: Securing Password Entry
  scoring: manual
  profile:
  - Level 1
  description: This section describes a method of obfuscating or masking password or shared secret entry.
  rationale: Entering passwords or shared secrets can be a source of information leakage if someone can observe the data entry
    or if the terminal command history can be accessed. Password Masking or obfuscation prevents this leakage by not displaying
    these values in the console session.
  impact: Not utilizing password masking exposes secure credential values to onyone with access to the terminal desplay during
    entry or to the console command history.
  references: []
  page_start: 21
  audit_raw: ''
  remediation: 'The password masking function is accesses by

    example - creating a new user:

    switch(config)# user switchAdmin group administrators password

    Enter password: ********

    Confirm password: ********

    switch(config)#

    example - changing a user password:

    switch(config)# user switchAdmin password

    Enter password: ********

    Confirm password: ********

    switch(config)#

    example - configuring a radius host shared secret:

    switch(config)# radius-server host 10.10.10.10 key

    Enter the RADIUS server key: ********

    Re-Enter the RADIUS server key: ********

    switch(config)#'
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 1.1.3
  title: Hardening Password Rules
  scoring: manual
  profile:
  - Level 1
  description: It is critical that customers set good, strong passwords for their local user accounts. The password complexity
    feature can aid customers in ensuring that users are following company password policies.
  rationale: There are many known attack vectors against weak passwords. The use of strong passwords guard against such attacks
    and is recommended across all of computing. Password complexity allows administrators to define a set of password rules
    which can then align with their company's password policy. The password complexity allows for minimum password length,
    minimum lowercase/uppercase/special/numeric characters, position changes between passwords, and can protect against password
    reuse.
  impact: Use of weak or easily guessed passwords can result in unintended access of the device and could lead to someone
    taking over the network.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/security_54206200-6300-6400/Content/Chp_Mng_Use/User_grp_cmds/pas-complx.htm
  page_start: 23
  audit_raw: "Review the password complexity configuration:\n6200# show password-complexity\nGlobal password complexity checking\
    \ criteria:\n Password complexity : Disabled\n Previous passwords to check : 5\n Minimum password length : 8\n Minimum\
    \ position changes : 8\n Maximum adjacent characters count : 0\n Password composition\n Minimum lowercase characters :\
    \ 1\n Minimum uppercase characters : 1\n Minimum special characters : 1\n Minimum numeric characters : 1"
  remediation: 'Set a password complexity policy with a minimum of <X> characters long, includes at

    least <Y> lowercase/uppercase/special/numeric character, and doesn''t allow users to

    reuse the past <Z> passwords:

    switch(config)# password complexity

    switch(config-pwd-cplx)# minimum-length <X>

    switch(config-pwd-cplx)# lowercase-count <Y>

    switch(config-pwd-cplx)# uppercase-count <Y>

    switch(config-pwd-cplx)# special-char-count <Y>

    switch(config-pwd-cplx)# numeric-count <Y>

    switch(config-pwd-cplx)# history-count <Z>

    switch(config-pwd-cplx)# enable

    Sample recommended password complexity configuration based on

    https://www.cisecurity.org/insights/white-papers/cis-password-policy-guide

    switch(config)# password complexity

    switch(config-pwd-cplx)# minimum-length 8

    switch(config-pwd-cplx)# lowercase-count 1

    switch(config-pwd-cplx)# uppercase-count 1

    switch(config-pwd-cplx)# special-char-count 1

    switch(config-pwd-cplx)# numeric-count 1

    switch(config-pwd-cplx)# history-count 1

    switch(config-pwd-cplx)# enable'
  checks:
  - type: sql
    command: show password-complexity
    severity: medium
    info: "Review the password complexity configuration:\n6200# show password-complexity\nGlobal password complexity checking\
      \ criteria:\n Password complexity : Disabled\n Previous passwords to check : 5\n Minimum password length : 8\n Minimum\
      \ position changes : 8\n Maximum adjacent characters count : 0\n Password composition\n Minimum lowercase characters\
      \ : 1\n Minimum uppercase characters : 1\n Minimum special charact"
- id: 1.1.4
  title: Set an Export Password
  scoring: manual
  profile:
  - Level 1
  description: All AOS-CX switches ship with a default password that's used to export any customer secrets contained with
    the switch configuration. Display of secrets through 'show' commands or exporting the entire switch configuration will
    have its secrets encrypted with this password prior to being displayed. AOS-CX allows customers to set their own password
    to ensure that their switch secrets cannot be loaded onto another AOS-CX switch.
  rationale: AOS-CX switch configurations and secrets can be loaded onto another AOS-CX switch. If a customer exports their
    configuration using the default export password, it can loaded into another switch.
  impact: Secrets are never exposed in plaintext, but loading of another switch's secrets onto another could enable that other
    device to impersonate another switch in the network. This may include, but not limited to, MACsec peering with an MKA
    PSK or OSPFv2 shared secrets.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/security_54206200-6300-6400/Content/Chp_Mng_Use/User_grp_cmds/ser-exp-pas.htm
  page_start: 25
  audit_raw: 'View the state of export password:

    switch# show service export-password

    Export password: default

    After configuring custom export password:

    switch# show service export-password

    Export password: custom'
  remediation: 'Set a custom export password using the following command:

    switch(config)# service export-password

    Enter password: ********

    Confirm password: ********'
  checks:
  - type: sql
    command: show service export-password
    severity: medium
    info: 'View the state of export password:

      switch# show service export-password

      Export password: default

      After configuring custom export password:

      switch# show service export-password

      Export password: custom'
- id: 1.1.5
  title: Enable Enhanced Secure Mode
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: This sequence describes enabling enhanced secure mode
  rationale: The AOS-CX operating system provides access to the underlying Linux system, allowing administrators to launch
    a bash shell session from the switch command-line interface. This shell provides root-level access to the underlying Linux
    OS.
  impact: 'Misuse of shell access could expose sensitive network traffic to an unauthorized third party via packet mirroring
    to a remote device or could cause a denial of service by modifying or removing system files. This file modification could
    render the device unbootable, and require software restoration through the ServiceOS console.. The following are best
    practices for limiting shell access: Disable access to the Bash shell by changing the switch security mode to enhanced
    from ServiceOS. Limit shell access by using RBAC or an external TACACS+ authorization server to deny access to the start-shell
    command to all users except those who specifically require it.'
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/hardening/Content/Chp_hard-mgmt/lim-shell-acc.htm
  page_start: 27
  audit_raw: 'switch# show secure-mode

    Standard secure mode is set

    switch#'
  remediation: "switch(config)# boot system serviceos\nOne time boot to ServiceOS initiated.\nChecking if the configuration\
    \ needs to be saved...\nThis will reboot the system to ServiceOS and render\n the entire switch unavailable.\nAccess to\
    \ ServiceOS is only available through the serial console.\nContinue (y/n)? y\nDefault boot image set to serviceos.\nThe\
    \ system is going down for reboot.\n...\nServiceOS login: admin\nSVOS>\nSVOS> secure-mode enhanced\n############################WARNING############################\n\
    This will set the switch into enhanced secure mode. Before\nenhanced secure mode is enabled, the switch must securely\
    \ erase\nall customer data and reset the switch to factory defaults.\nThis will initiate a reboot and render the switch\
    \ unavailable\nuntil the zeroization is complete.\n############################WARNING############################\nContinue\
    \ (y/n)? y\nreboot: Restarting system\n...\n6300 login: admin\nPassword:\nPlease configure the 'admin' user account password.\n\
    Enter new password: *****\nConfirm new password: *****\nswitch#\nswitch# show secure-mode\nEnhanced secure mode is set\n\
    switch#"
  checks:
  - type: sql
    command: show secure-mode
    severity: medium
    info: 'switch# show secure-mode

      Standard secure mode is set

      switch#'
- id: 1.1.6
  title: Default admin account password
  scoring: manual
  profile:
  - Level 1
  description: The AOS-CX switches ship with a built-in, default user account named 'admin'. In accordance with the 2020 California
    password law, AOS-CX switches require that customers set the password for this built-in user account at first login.
  rationale: The setting of a strong password for all built-in user account is necessary for any device.
  impact: AOS-CX devices will force customers to set a password for the built-in 'admin' user account upon first login. It's
    important that customers abide by this behavior to ensure that their device isn't deployed with a weak or empty password.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/security_54206200-6300-6400/Content/Chp_Mng_Use/def-use-adm-10.htm
  page_start: 30
  audit_raw: 'There is no audit procedure as the first time a customer logs into the device, they will be

    required to provide a password for the built-in ''admin'' user account.'
  remediation: 'If a customer fails to set a strong password for the built-in ''admin'' user account, he/she

    can set the password using the following command:

    switch(config)# user admin password

    Enter password: ************

    Confirm password: ************

    switch(config)#'
  checks:
  - type: manual_review
    info: 'There is no audit procedure as the first time a customer logs into the device, they will be

      required to provide a password for the built-in ''admin'' user account.'
    severity: medium
- id: 1.1.7
  title: RBAC - Customer defined local user groups
  scoring: manual
  profile:
  - Level 1
  description: 'AOS-CX switches include three different built-in local user groups: administrators, operators, auditors. Administrators
    have full read-write access, operators have readonly access, and auditors can read the logs. There may be scenarios where
    customers need a a local user group with a different set of permissions. User-defined local user groups allow customers
    to create their own user group with specific CLI commands allowed for members of that group.'
  rationale: The built-in local user groups may not be sufficient to meet customer needs in how their assign permissions to
    different local user accounts.
  impact: The built-in local user accounts have a very string read-write, read-only, and read-logs set of permissions. There
    may be instances where customers need to allow local users to write access to some switch features, but not all.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/security_54206200-6300-6400/Content/Chp_Mng_Use/use-def-use-gro-10.htm
  - 2. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/security_54206200-6300-6400/Content/Chp_Mng_Use/User_grp_cmds/use-gro-10.htm
  page_start: 32
  audit_raw: 'The "show user group" command allows customers to see the set of local user groups

    configured on the switch:

    switch(config)# show user-group

    GROUP NAME GROUP TYPE INCLUDED GROUP NUMBER OF RULES

    -------------- -------------- ------------------ -------------------

    administrators built-in n/a n/a

    auditors built-in n/a n/a

    operators built-in n/a n/a

    routing-group configuration admuser1 10

    switch(config)#'
  remediation: 'Create local user groups as needed:

    switch(config)# user-group group

    switch(config-usr-grp-group)# 10 permit cli command "<command>"

    switch(config-usr-grp-group)# 20 permit cli command "<command>"

    switch(config-usr-grp-group)# exit'
  checks:
  - type: sql
    command: show user group" command allows customers to see the set of local user groups
    severity: medium
    info: 'The "show user group" command allows customers to see the set of local user groups

      configured on the switch:

      switch(config)# show user-group

      GROUP NAME GROUP TYPE INCLUDED GROUP NUMBER OF RULES

      -------------- -------------- ------------------ -------------------

      administrators built-in n/a n/a

      auditors built-in n/a n/a

      operators built-in n/a n/a

      routing-group configuration admuser1 10

      switch(confi'
- id: 1.1.8
  title: Session Management
  scoring: manual
  profile:
  - Level 1
  description: This sequence describes enabling CLI session limits
  rationale: 'Session management enhances security by enforcing specific CLI user session requirements for console, SSH and
    telnet connections. The following information is provided at the time of a successful login: • When applicable, the number
    of failed login attempts since the most recent successful login. • The date, time, and location (console or IP address
    or hostname) of the most recent previous successful login. • The count of successful logins within the past (configurable)
    time period.'
  impact: Limiting concurrent sessions and session timeouts is crucial for enhancing security and preventing unauthorized
    access to accounts. Failure to restrict the number of active sessions per user and setting appropriate timeout durations,
    can expose you to risks like session hijacking, shared account access, and compromised sessions.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/hardening/Content/Chp_hard-mgmt/session.htm
  page_start: 34
  audit_raw: "To view the configuration change -\nswitch# show running-config | begin cli-session\ncli-session\n max-per-user\
    \ 1\n tracking-range 25\n timeout 15"
  remediation: 'Setting Max sessions per user:

    switch# config

    switch(config)# cli-session

    switch(config-cli-session)# max-per-user <max-sessions>

    switch(config-cli-session)# exit

    switch(config)# exit

    switch#

    Setting session timeout:

    switch# config

    switch(config)# cli-session

    switch(config-cli-session)# timeout <timeout in minutes>

    switch(config-cli-session)# exit

    switch(config)# exit

    switch#

    Setting session tracking records retention:

    switch# config

    switch(config)# cli-session

    switch(config-cli-session)# tracking-range <tracking days>

    switch(config-cli-session)# exit

    switch(config)# exit

    switch#

    Recommended values -

    switch(config)# cli-session

    switch(config-cli-session)# max-per-user 1

    switch(config-cli-session)# timeout 15

    switch(config-cli-session)# tracking-range 25

    switch(config-cli-session)# exit'
  checks:
  - type: sql
    command: show running-config | begin cli-session
    severity: medium
    info: "To view the configuration change -\nswitch# show running-config | begin cli-session\ncli-session\n max-per-user\
      \ 1\n tracking-range 25\n timeout 15"
- id: 1.1.9
  title: Verifying Telnet Server is Disabled
  scoring: manual
  profile:
  - Level 1
  description: 'AOS-CX system includes a telnet server. Telnet is considered insecure primarily because it transmits all data,
    including usernames and passwords, in plaintext, meaning it''s not encrypted. This leaves it vulnerable to several security
    risks: Eavesdropping: Anyone with access to the network traffic can intercept and read the data transmitted during a Telnet
    session, including sensitive information like login credentials. Credential Sniffing: Attackers can easily capture plaintext
    usernames and passwords by observing Telnet traffic. Man-in-the-Middle (MitM) Attacks: Attackers can position themselves
    between the client and server, intercepting, reading, and potentially modifying the data being transmitted, according
    to Kelvin Zero. Session Hijacking: With intercepted credentials, attackers can hijack ongoing Telnet sessions, gaining
    unauthorized access to systems and data. Lack of Authentication: Many Telnet implementations lack proper authentication
    mechanisms, making them vulnerable to attacks like brute-force attacks. In summary, Telnet''s fundamental design, which
    involves unencrypted data transmission, makes it highly insecure and unsuitable for modern remote access, especially over
    public networks like the internet. Instead of Telnet, it is recommended to use Secure Shell (SSH), which provides encryption
    for data transmission and strong authentication mechanisms, ensuring a much higher level of security for remote access.'
  rationale: Telnet server is included in AOS-CX system for customer convenience. Due to it's insecurity it is not recommended
    for general use and is disable by default.
  impact: Verifying Telnet server is disabled will prevent users from accessing the console using an insecure protocol
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.10/HTML/cli_6200/Content/Chp_telnet/telnet_cmds/tel-serv.htm
  page_start: 36
  audit_raw: 'To display telnet server status:

    switch(config)# show telnet server

    TELNET server is not enabled on any VRFs.

    switch(config)#'
  remediation: 'to disable Telnet server:

    switch(config)# no telnet server vrf <vrf>

    All active TELNET sessions on the VRF will be terminated.

    Do you want to continue (y/n)? y

    switch(config)#'
  checks:
  - type: sql
    command: show telnet server
    severity: medium
    info: 'To display telnet server status:

      switch(config)# show telnet server

      TELNET server is not enabled on any VRFs.

      switch(config)#'
- id: 1.1.10
  title: Using Local RBAC to Limit User Access to Shell
  scoring: manual
  profile:
  - Optional Security Recommendations
  description: 'AOS-CX switches include three different built-in local user groups: administrators, operators, auditors. Administrators
    have full read-write access, operators have readonly access, and auditors can read the logs. There may be scenarios where
    customers need a local administrator user with a different set of permissions. User-defined local user groups allow customers
    to create their own user group with specific CLI commands allowed for members of that group, including access to the underlying
    OS shell.'
  rationale: The built-in local user groups may not be sufficient to meet customer needs in how they assign permissions to
    different local user administrator accounts. This can be utilized to allow customers to create users with access to administrator-level
    commands while limiting access to the underlying OS shell.
  impact: The underlying Linux OS allows full access to all features of the AOS-CX system. Many administrative functions do
    not require access to this level of control. Limiting access to the shell helps limit exposure to both malicious and unintentionalsystem
    changes.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.07/PDF/5200-7885.pdf
  page_start: 38
  audit_raw: 'The "show user-group" command allows customers to see the set of local user groups

    configured on the switch:

    switch(config)# show user-group

    GROUP NAME GROUP TYPE INCLUDED GROUP NUMBER OF RULES

    -------------- -------------- ------------------ -------------------

    custom-admin configuration -- 4

    administrators built-in n/a n/a

    auditors built-in n/a n/a

    operators built-in n/a n/a

    routing-group configuration admuser1 10

    switch(config)#

    the show user-group command displays user group status and any Rules configured:

    switch(config)# show user-group custom-admin

    User Group Summary

    ==================

    Name : custom-admin

    Type : configuration

    Included Group : --

    Number of Rules : 4

    User Group Rules

    ================

    SEQUENCE NUM ACTION COMMAND COMMENT

    ------------- ---------- -------------------------------- -------------------

    -------------

    10 deny start-shell

    20 deny user .*

    30 deny user-group .*

    500 permit .*

    switch(config)#'
  remediation: 'Create local user groups as needed:

    switch(config)# user-group group

    switch(config-usr-grp-group)# 10 permit cli command "<command>"

    switch(config-usr-grp-group)# 20 permit cli command "<command>"

    switch(config-usr-grp-group)# exit

    switch(config)#

    Create user group rules to restrict access to underlying shell, and ability to modify the

    user-group rules:

    switch(config)# user-group custom-admin

    switch(config-usr-grp-admin2)# 10 deny cli command "start-shell"

    switch(config-usr-grp-admin2)# 20 deny cli command "user .*"

    switch(config-usr-grp-admin2)# 30 deny cli command "user-group .*"

    switch(config-usr-grp-admin2)# 500 permit cli command ".*"

    switch(config-usr-grp-admin2)# exit

    switch(config)#'
  checks:
  - type: sql
    command: show user-group" command allows customers to see the set of local user groups
    severity: medium
    info: 'The "show user-group" command allows customers to see the set of local user groups

      configured on the switch:

      switch(config)# show user-group

      GROUP NAME GROUP TYPE INCLUDED GROUP NUMBER OF RULES

