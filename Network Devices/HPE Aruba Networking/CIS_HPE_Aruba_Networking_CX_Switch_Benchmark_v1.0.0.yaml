- id: 4.2.2
  title: Spanning Tree Root Protect
  scoring: manual
  profile:
  - Level 1
  description: This sequence describes configuring Spanning Tree's Root Protect feature
  rationale: Root protection secures the active topology by preventing other switches from declaring their ability to propagate
    superior BPDUs, containing both better information on the root bridge and path cost to the root bridge which would normally
    replace the current root bridge selection. This is typically carried out between the core that is required to be the root
    and access switches to prevent ports that are not expected to originate root information such as server ports and access
    switch ports.
  impact: 'Enabling the Spanning Tree Protocol (STP) Root Guard feature, also known as Root Protect, is a crucial security
    measure in network switches. It helps prevent unauthorized switches from becoming the root bridge in your network''s STP
    topology. However, like any network configuration, there can be potential side effects if not implemented correctly: Ports
    in Root-Inconsistent State: If a port receives a superior Bridge Protocol Data Unit (BPDU) the port enters a "root-inconsistent"
    state and stops forwarding traffic. Potential for Unexpected Topology Changes: If Root Guard is erroneously enabled on
    ports that are supposed to be part of the root path, it could block legitimate switches from becoming the root bridge
    in case of a failure, which could lead to network instability. Root Guards implementation can influence how the spanning
    tree converges. Incorrectly chosen root bridges can lead to suboptimal paths for data traffic, potentially impacting network
    performance.'
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOSCX/10.15/HTML/hardening/Content/Chp_hard-ctrl/sec-span-tree.htm
  page_start: 233
  audit_raw: 'switch# show spanning-tree interface 1/1/21

    Port : 1/1/21

    Admin State : up

    BPDU Guard : disabled

    BPDU Filter : disabled

    RPVST Guard : disabled

    RPVST Filter : disabled

    Loop Guard : disabled

    Root Guard : enabled

    TCN Guard : disabled

    Admin Edge Port : admin-network

    Link Type : Point to Point

    BPDU Tx Count : 31

    BPDU Rx Count : 0

    TCN Tx Count : 0

    TCN Rx Count : 0'
  remediation: 'switch(config)# interface 1/1/21

    switch(config-if)# no shutdown

    switch(config-if)# no routing

    switch(config-if)# vlan trunk allow all

    switch(config-if)# vlan trunk native 1

    switch(config-if)# spanning-tree root-guard

    switch(config-if)# exit'
