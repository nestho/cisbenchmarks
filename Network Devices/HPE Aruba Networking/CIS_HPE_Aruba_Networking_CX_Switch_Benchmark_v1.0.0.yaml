- id: 1.5.2.2
  title: Limit Login Attempts
  scoring: manual
  profile:
  - Level 2
  description: The "Limiting Login Attempts" feature on Aruba AOS-CX switches is designed to enhance the security of the system
    by restricting the number of consecutive failed login attempts allowed for user accounts. Once the maximum number of failed
    attempts is reached, the account is blocked for a predetermined period - lockout-time. This local login attempt limiting
    feature is only available when not using remote authentication through AAA servers (TACACS+ or RADIUS) on any interface.
    Remote authentication through AAA servers (TACACS+ or RADIUS) is not possible when limit login attempts is configured
    on any interface.
  rationale: Limiting login attempts on AOS-CX switches helps prevent brute-force attacks and unauthorized access, protecting
    critical network resources.
  impact: This enhances security by safeguarding administrative accounts, reduces operational risks, and ensures compliance
    with security best practices.
  references:
  - 1. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/security_54206200-6300-6400/Content/Chp_Loc_AAA/Loc_AAA_cmds/aaa-auth_cons-logatt.htm
  - 2. https://arubanetworking.hpe.com/techdocs/AOS-CX/10.15/HTML/security_54206200-6300-6400/Content/Chp_Loc_AAA/Loc_AAA_cmds/aaa-aut-lim-log-att10.htm
  page_start: 90
  audit_raw: "To view the configuration -\nswitch# show aaa authentication\nSample output -\nswitch# show aaa authentication\n\
    AAA Authentication:\n Fail-through : Enabled\n Limit Login Attempts : 3\n Lockout Time : 60\n Console Login Attempts :\
    \ 3\n Console Lockout Time : 60\nAuthentication for default channel:\n--------------------------------------------------------\n\
    GROUP NAME | GROUP PRIORITY\n--------------------------------------------------------\nlocal | 0\n--------------------------------------------------------"
  remediation: 'For the console interface (channel) only, enables console login attempt limiting. If the

    number of failed console login attempts equals the configured threshold, the user is

    locked out for the configured duration -

    switch(config)# aaa authentication console-login-attempts <ATTEMPTS> consolelockout-time <LOCKOUT-TIME>

    For SSH/Telnet/https-server -

    switch(config)# aaa authentication limit-login-attempts <ATTEMPTS> lockouttime <LOCKOUT-TIME>

    Sample recommendation -

    Enabling login attempt failure limiting with a 60 second lockout being triggered upon the

    third consecutive login attempt failure -

    switch(config)# aaa authentication console-login-attempts 3 console-lockouttime 60

    switch(config)# aaa authentication limit-login-attempts 3 lockout-time 60'
  checks:
  - type: sql
    command: show aaa authentication
    severity: medium
    info: "To view the configuration -\nswitch# show aaa authentication\nSample output -\nswitch# show aaa authentication\n\
      AAA Authentication:\n Fail-through : Enabled\n Limit Login Attempts : 3\n Lockout Time : 60\n Console Login Attempts\
