      380 | P a g e'
- id: 6.10.2.7
  title: Ensure Web-Management Interface Restriction is set to OOB Management
  scoring: scored
  profile:
  - Level 2
  description: JWeb access should be restricted to trusted networks
  rationale: By default, when configured, the JWeb service will listen for incoming connections on all interfaces which have
    an IP Address configured, exposing JWeb to users on all networks through which the device is reachable. Because control
    of Network Systems can have a serious impact on the security of your environment, the JUNOS device should only be manageable
    using Out Of Band (OOB) Management networks reached through the devices' dedicated Management Interface (called FXP0.0
    on most platforms). This can be accomplished by limiting the interfaces on which the JWeb HTTPS service operates to only
    include the devices' OOB Interface. Firewall Filters or Security Policy (SRX) should also be used to further restrict
    management to authorized sources (see Recommendations in Section 2 - Firewall for further details). Some JUNOS devices
    do not have dedicated OOB Management ports. In some cases a "revenue port" can be configured to act as a Management port,
    such as by defining a "management" functional zone with a Branch/SME SRX Firewall. This type of restricted OOB Management
    Port is accepted as meeting this recommendation, but is not tested for under the audit procedure as a variety of ports
    might be used.
  impact: Ensure that JWeb Management is operational and reachable using the selected interfaces before applying interface
    restrictions in a production environment. 382 | P a g e
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/concept/interfacesunderstanding-management-ethernet-interfaces.html
  page_start: 382
  audit_raw: 'First confirm that JWeb Interface restrictions have been applied by executing the following

    command from the [edit system services web-management] hierarchy:

    [edit system services web-management]

    user@host#show https interfaces | count

    A line count of 1 should be returned, confirming that Interface restrictions have been

    applied.

    [edit system services web-management]

    user@host#show https interfaces | display set | except "fxp0|em0|me0|jmgmt0"

    | count

    A line count of 0 should be returned.

    Where a different dedicated OOB Management Port is used, such as with a Branch SRX

    using a management zone, the interface may be added to the except clause in the previous

    command when auditing this recommendation.'
  remediation: 'To apply JWEB Interface restrictions issue the following commands from the [edit system

    services web-management https] hierarchy:

    To set a single Interface:

    [edit system services web-management https]

    user@host#set interface <interface>

    Or to set multiple Interfaces:

    [edit system services web-management https]

    user@host#set interface [ <interface 1> <interface 2> <interface n> ]

    Interfaces should only be fxp0.0, em0.0, me0.0 or jmgmt0.0 (dependent on platform)

    dedicated Out Of Band Management ports.'
  checks:
  - type: sql
    command: show https interfaces | count
    severity: medium
    info: 'First confirm that JWeb Interface restrictions have been applied by executing the following

      command from the [edit system services web-management] hierarchy:

      [edit system services web-management]

      user@host#show https interfaces | count

      A line count of 1 should be returned, confirming that Interface restrictions have been

      applied.

      [edit system services web-management]

      user@host#show https interface'
- id: 6.10.3.1
  title: Ensure XNM-Clear-Text Service is Not Set
  scoring: scored
  profile:
  - Level 1
  description: Cleartext Management Services should be disabled.
  rationale: JUNOScript Clients can access the router using a variety of transport modes including Clear-Text, Telnet, SSH
    and SSL. When Clear-Text is used the JUNOScript Client connects to the JUNOS Device on port TCP/3221. As the name suggests
    Authentication information, commands and router configuration are all transported across the network in Clear (unencrypted)
    Text form, making it trivial for an attacker to steal login credentials, learn configuration or hijack the session to
    execute their own commands. Because of this, Clear Text mode should never be used to manage JUNOS Devices.
  impact: Ensure that JUNOSCript Clients using the Clear Text interface are not being used to manage the JUNOS Device before
    disabling the service in a production environment.
  references:
  - 1. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  - https://www.pcisecuritystandards.org/documents/PCI_DSS_v3-2-1.pdf
  - 2. https://www.juniper.net/documentation/en_US/junos/informationproducts/pathway-pages/junos-xml-management-protocol/junos-xmlmanagement-protocol.html
  page_start: 386
  audit_raw: 'To confirm whether Clear Text JUNOScript is configured, issue the following command

    from the [edit system] hierarchy:

    [edit system]

    user@host#show services | match xnm-clear-text | count

    The above command should return a line count of 0.'
  remediation: 'The XNM-Clear-Text service is not enabled by default, however if it has been configured on

    your router it can by disabled by issuing the following command from the [edit system]

    hierarchy;

    386 | P a g e

    [edit system]

    user@host#delete services xnm-clear-text'
  checks:
  - type: sql
    command: show services | match xnm-clear-text | count
    severity: medium
    info: 'To confirm whether Clear Text JUNOScript is configured, issue the following command

      from the [edit system] hierarchy:

      [edit system]

      user@host#show services | match xnm-clear-text | count

      The above command should return a line count of 0.'
- id: 6.10.3.2
  title: Ensure XNM-SSL Connection Limit is Set
  scoring: scored
  profile:
  - Level 2
  description: If the XNM-SSL service is configured, connection limits should be set.
  rationale: JUNOScript can be configured to use SSL transport to prevent the exposure of sensitive data and authentication
    details on the network. If configured the XNM-SSL service will provide services on port TCP/3220. An attacker may attempt
    to open a large number of sessions to the XNM-SSL service to exhaust the routers resources or an authorized user may do
    so accidently, especially given that the service is designed to allow a scripting and automation interface to JUNOS. To
    limit the impact of any such incident, the number of concurrent connections to the XNM-SSL service should explicitly limited.
    A relatively low value of 10 is recommended, but may not be appropriate for all environments so it is left to the administrator's
    discretion.
  impact: If the connection limit has been reached, additional JUNOScript sessions will be rejected until an existing session
    has ended.
  references:
  - 1. Configuring SSL Service for JUNOScript Client Applications, JUNOS 9.3 System Basics
  - 2. https://www.juniper.net/documentation/en_US/junos/informationproducts/pathway-pages/junos-xml-management-protocol/junos-xmlmanagement-protocol.html
  page_start: 388
  audit_raw: 'To confirm whether a JUNOScript SSL Session Limit has been configured, enter the

    following command at the [edit system services xnm-ssl] hierarchy:

    [edit system services xnm-ssl]

    user@host#show connection-limit

    The above command should return a positive integer, the number of permitted concurrent

    connections, if configured.'
  remediation: 'The XNM-SSL Connection Limit can be configured by issuing the following command from

    the [edit system services xnm-ssl] hierarchy;

