      A line count of 1 should be returned if the Auxiliary Port is disabled.'
- id: 6.11.2
  title: Ensure Auxiliary Port is Set as Insecure If Used
  scoring: scored
  profile:
  - Level 2
  description: The Auxiliary Port should be set as Insecure if used.
  rationale: The Auxiliary Port on a Juniper Device is used to connect Modems and other devices to allow remote administration
    of the router when other connectivity is not possible. Connections to the Auxiliary Port are treated in a very similar
    fashion to local Console Port connections. Although this is a useful function, connections via the Auxiliary Port represent
    a less secure method of remote administration compared to services such as SSH or HTTPS so the Aux Port is Disabled by
    default. Where the Auxiliary Port is absolutely required for a deployment, logins to the Auxiliary Port using the highly
    privileged Root or Superuser accounts should be prevented by setting the JUNOS Device's Auxiliary Port as being Insecure
    in order to limit the scope for abuse.
  impact: The Auxiliary port will not permit logins using the Root or Superuser accounts.
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Page 55, National Security
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  page_start: 441
