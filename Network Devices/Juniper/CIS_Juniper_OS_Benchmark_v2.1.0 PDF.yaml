      [edit system services]

      user@host#show dhcp'
- id: 6.11.1
  title: Ensure Auxiliary Port is Set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: The Auxiliary Port should be disabled when not required.
  rationale: The Auxiliary Port on a Juniper Device is used to connect Modems and other devices to allow remote administration
    of the router when other connectivity is not possible. Connections to the Auxiliary Port are treated in a very similar
    fashion to local Console Port connections. Although this is a useful function, in most deployments the Auxiliary Port
    is not utilized at all and so should be disabled, which is the default in all current Junos versions, to prevent potential
    abuse.
  impact: The Auxiliary port will not be available.
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Page 55, National Security
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  page_start: 439
  audit_raw: 'From the command prompt, execute the following command from the [edit system

    ports] hierarchy:

    [edit system ports]

    user@host#show auxiliary | match "disable" | count

    A line count of 1 should be returned if the Auxiliary Port is disabled.'
  remediation: 'To disable the Auxiliary Port, issue the following command from the [edit system ports]

    hierarchy;

    [edit system ports]

    user@host#set auxiliary disable

    439 | P a g e'
  checks:
  - type: sql
    command: show auxiliary | match "disable" | count
    severity: medium
    info: 'From the command prompt, execute the following command from the [edit system

      ports] hierarchy:

      [edit system ports]

