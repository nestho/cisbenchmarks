      factory-default configuration.'
    severity: medium
- id: '6.13'
  title: Ensure Autoinstallation is Set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: Autoinstallation should be disabled.
  rationale: The Autoinstallation feature allows the JUNOS Device to automatically download and apply configuration from an
    FTP, TFTP or HTTP server on boot, having obtained IP Address details via DHCP or BOOTP. Autoinstallation provides an extremely
    useful function for rapid deployment of large numbers of devices, however Autoinstallation provides no method to authenticate
    the identity of the Installation Servers or validity of the supplied configuration files. This may allow an attacker to
    change the device's configuration at boot (or after forcing a reboot through a DoS attack) by impersonating the DHCP,
    FTP, TFTP or HTTP servers or by carrying out session hijacking. This would be a multistage attack, as Autoinstallation
    should only be used if the device does not find an existing configuration locally - so the attacker would also need to
    have been able to disrupt the configuration or boot process through some other vector, but this may be viable for an attacker
    who already has some foothold on the device to escalate their privileges. If successful the attacker would have gained
    complete control over the JUNOS Device. Because all of the protocols used by Autoinstallation transfer data in plain text,
    it is trivial for an attacker to intercept the traffic and obtain a complete copy of the configuration, possibly containing
    authentication details to both the device and Operational Support Services. Autoinstallation is useful during deployments
    of large number of devices, but due to these limitations should only be used in a tightly controlled, isolated, build
    environment where the authenticity of servers and configuration can be assured and snooping on sensitive details can be
    eliminated. Autoinstallation should never be used over untrusted or public networks, such as over the Internet. 465 |
    P a g e Many JUNOS Devices have Autoinstallation enabled by default to support large deployments using the feature, but
    Autoinstallation should be disabled on all devices once deployed to production.
  impact: This should have no impact on production systems, as Autoinstallation should only be used when no non-factory-default
    configuration is present on the JUNOS Device at boot.
  references:
  - 1. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/concept/securityautoinstallation-overview.html
