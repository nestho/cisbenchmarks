- id: '6.18'
  title: Ensure Time-Zone is Set to UTC
  scoring: scored
  profile:
  - Level 2
  description: All devices should use the UTC time zone.
  rationale: When a network comprises of hosts across multiple countries or states, the use of local time zones can make analysis
    of log events confusing and error prone, particularly when localized "Daylight Savings Time" or equivalent changes occur,
    affecting one area but not another. To prevent confusion Coordinated Universal Time (UTC) should be used for all routers
    to allow consistent logging timestamps. UTC can be considered equivalent to GMT+0 for the purposes of setting time zones
    (it is actually GMT with added leap seconds defined by atomic clocks at the US Naval Observatory). By having all Servers
    and Network Devices utilizing the same time-zone for logging; correlation and co-ordination is greatly simplified and
    Incident Response time is decreased.
  impact: System time, for example viewed with the show system uptime command, and timestamps in log messages will be given
    in UTC.
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Page 174, National Security
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  page_start: 477
  audit_raw: 'To confirm that the Time Zone has not been configured to something other than UTC/GMT,

    enter the following command from the [edit system] hierarchy:

    [edit system]

    user@host#show time-zone | except "GMT;|UTC;" | count

    A line count of 0 should be returned, indicating that the Time Zone has been set to the

    default of UTC or explicitly to GMT with no offset (which is directly equivalent).

    477 | P a g e'
  remediation: 'To configure the Time Zone, issue the following command from the [edit system]

    hierarchy;

    [edit system]

    user@host#set time-zone UTC'
  checks:
