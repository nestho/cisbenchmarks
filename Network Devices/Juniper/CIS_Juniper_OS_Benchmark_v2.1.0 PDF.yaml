    \ system login] hierarchy:\n[edit system login]\nuser@host#set password format ?\n280 | P a g e\nThe system should provide\
    \ a range of options, such as in the example below which is for a\nsystem which does support SHA512:\n[edit system login]\n\
    user@host# set password format ?\nPossible completions:\n md5 Message Digest 5\n sha1 Secure Hash Algorithm 1\n sha256\
    \ Secure Hash Algorithm 256 ($5$)\n sha512 Secure Hash Algorithm 512 ($6$)\n[edit system login]\nConfigure password hashing\
    \ using the following command under the [edit system\nlogin] hierarchy:\n[edit system login]\nuser@host#set login password\
    \ format sha512\nFor systems which do not support SHA-2 with 512bit hashes, configure SHA-1 using the\nfollowing command\
    \ under the [edit system login] hierarchy:\n[edit system login]\nuser@host#set login password format sha1\nNOTE - SHA1\
    \ hashing should only be configured on systems which do not support SHA512."
