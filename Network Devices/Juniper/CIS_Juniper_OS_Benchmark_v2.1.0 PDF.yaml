- id: 6.3.2
  title: Ensure Local Accounts can ONLY be used during loss of external AAA
  scoring: scored
  profile:
  - Level 1
  description: Authentication using locally configured usernames and passwords should only be permitted when External AAA
    servers are down or cannot be reached.
  rationale: Juniper routers support local user accounts in addition to RADIUS and TACACS+ based authentication. JUNOS will
    use each of the configured protocols in order set under [edit system authentication-order] until the password is either
    accepted or the end of the list is reached. It is vital to understand the impact of this behavior and its relation to
    security. If the order is set as RADIUS then local password, the router will attempt to authenticate a user's credentials
    first using the RADIUS server. If the RADIUS server cannot be reach or the login is denied the router will attempt to
    authenticate against the user accounts configured in the [edit system login user] hierarchy. Because local user accounts
    cannot be centrally audited and controlled they present a far greater risk when, for example, and account is compromised
    or an employee leaves the organization. By removing local authentication from the authentication-order you prevent these
    accounts being used when RADIUS or TACACS+ reject an authentication attempt; however local accounts remain usable on occasions
    where all other authentication services cannot be reached such as during router maintenance or AAA server outages.
  impact: ''
  references:
  - 1. Configuring the Authentication Order, JUNOS 9.3 System Basics Configuration Guide,
  - 2. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  page_start: 224
  audit_raw: 'From the command prompt, execute the following command:

    [edit]

    user@host#show system authentication-order | match "password" | count

    The above command should return zero or an error.

    224 | P a g e'
  remediation: 'Remove local user authentication from the authentication order by issuing the following

    command from the [edit system] hierarchy; [edit system]

    user@host#delete authentication-order password

    This command will leave other authentication methods (RADIUS or TACACS+) that are

    already configured under the authentication-order statement.'
  checks:
  - type: sql
    command: show system authentication-order | match "password" | count
    severity: medium
    info: 'From the command prompt, execute the following command:

      [edit]

      user@host#show system authentication-order | match "password" | count

      The above command should return zero or an error.

      224 | P a g e'
- id: 6.4.1
  title: Ensure Authentication is configured for Diagnostic Ports
  scoring: scored
  profile:
  - Level 1
  description: An encrypted password should be set for access to the routers diagnostic ports.
  rationale: Most high end Juniper network devices contain Diagnostic Ports on one or more of the control boards installed
    in the system, such as FEB (Forwarding Engine Board) in M5 or M10 routers or SSB (System Switching Board) in M20 routers.
    These ports allow access to a range of diagnostic functions and could provide an attacker with physical access to the
    system a route to bypass other controls in order to compromise the router. Because of this risk, it is possible to set
    a password for all Diagnostic Ports installed in the system. As with other similar items, the password is stored by JUNOS
    as a hash (in this case MD5) in the configuration file. Please note, only local authentication is supported for the Diagnostic
    Ports, which are intended for limited use only, often when the device is experience a serious outage where external AAA
    services may be unavailable. Should a system not contain any diagnostic ports, this item of configuration is ignored by
    the device.
  impact: ''
  references:
  - 1. Configuring the Password on the Diagnostics Port, JUNOS 9.3 System Basics
  - 2. Router Security Configuration Guide, Version 1.1b, Page 62, National Security
  page_start: 227
  audit_raw: 'From the command prompt, execute the following commands:

    [edit]

    user@host#show system diag-port-authentication

    The above command should return the following output:

    diag-port-authentication encrypted-password "<MD5 Hash>";'
  remediation: 'Configure a password for the diagnostic ports using one of the following commands under

    the [edit system] hierarchy; To enter a new password in plain text:

    227 | P a g e

    [edit system]

    user@host#set diag-port-authentication plain-text-password

    You will be prompted to enter the new password, which JUNOS will then hash with MD5

    before placing the command in the candidate configuration. To enter an existing password

    hash which you have taken from an existing configuration file, type the following :

    [edit system]

    user@host#set diag-port-authentication encrypted-password "<MD5 Hash>"'
  checks:
  - type: sql
    command: show system diag-port-authentication
    severity: medium
    info: 'From the command prompt, execute the following commands:

      [edit]

      user@host#show system diag-port-authentication

      The above command should return the following output:

      diag-port-authentication encrypted-password "<MD5 Hash>";'
- id: 6.4.2
  title: Ensure Diagnostic Port Authentication uses a complex password
  scoring: manual
  profile:
  - Level 1
  description: A complex password should be used to protect access to Diagnostic Port/s
  rationale: 'Due to the sensitivity of the routers Diagnostic Port/s a complex password should be employed to help prevent
    attackers employing ''brute force'' or ''dictionary'' attacks to gain access through these ports. Passwords are stored,
    automatically by JUNOS, as a MD5 hash in the configuration under the [edit system diag-port-authentication] hierarchy.
    A complex password should be employed which meets or exceeds the following requirements:  Does not contain Dictionary
    words, names, dates, phone numbers or addresses.  Is at least 8 characters in length (longer is recommended).  Contains
    at least one each of upper & lower case letters, numbers and special characters.  Avoids more than 4 digits or same case
    letters in a row.'
  impact: ''
  references:
  - 1. Configuring the Password on the Diagnostics Port, JUNOS 9.3 System Basics
  - 2. Router Security Configuration Guide, Version 1.1b, Page 62, National Security
  page_start: 229
