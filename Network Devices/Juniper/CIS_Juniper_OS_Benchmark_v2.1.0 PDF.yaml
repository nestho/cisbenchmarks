- id: 6.10.1.5
  title: Ensure Remote Root-Login is denied via SSH
  scoring: scored
  profile:
  - Level 1
  description: Prevent remote access to the Root user account on the device.
  rationale: During normal operation, remote access to the Root user should not be required. Because the Root user account
    has full access to the router and underlying BSD OS it is an extremely valuable target for attackers and must be protected
    from remote exploitation. By disabling remote access to the Root user account we ensure that physical access to the console
    port is required in order to gain this level of access. Root access only needs to be disabled for SSH connections, as
    it is never allowed over a Telnet or other remote access session.
