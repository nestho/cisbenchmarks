- id: '6.16'
  title: Ensure Ping Record Route is Set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: The Routing Engine should ignore Echo Requests with the Record Route option set.
  rationale: When the Record Route Option is set on an Echo Request (ping), the hosts processing the packet should record
    their Interface addresses and a Timestamp on the response packet as it traverses the network (up to 9 hops) allowing the
    host that made the request to see the path that the response takes through the network, including discovering details
    of Provider Edge (PE) switches in MPLS VPN services and Loopback Interfaces. Attackers may use Echo Requests with the
    Record Route option set during recognizance of a network to obtain details of the networks topology, The Record Route
    Option is considered to be largely deprecated, with no valid uses expected in almost all production networks; therefore,
    the JUNOS Device should be configured not to to include these details when responding to Echo Requests with the Record
    Route Option set.
  impact: ICMP Echo Requests (pings) with the Record Route Option set will still receive a response (unless blocked elsewhere),
    but the JUNOS Device will not return the additional Route and Interface details.
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/topics/task/configuration/i
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  page_start: 473
  audit_raw: 'To confirm that Ping Record Route responses are Disabled, execute the following command

    from the [edit system] hierarchy:

    [edit system]

    user@host#show | match "no-ping-record-route" | count

    A line count of 1 should be returned, indicating that the JUNOS Device will not respond to

    ICMP Echo Requests with the Record Route Option set.

    473 | P a g e'
  remediation: 'To disable reporting of Interface details in responses to Echo Requests with the Record

    Route option set, issue the following command from the [edit system] hierarchy;

    [edit system]

    user@host#set no-ping-record-route'
  checks:
