- id: 6.6.8
  title: Ensure login message is set
  scoring: scored
  profile:
  - Level 1
  description: A login message should be displayed before a user logs into the router.
  rationale: 'Prior to a user logging into the router a legal notice should be displayed warning that they are connecting
    to a private system. This legal notice may be necessary to protect your organizations rights to pursue legal action or
    to monitor users of the system. It might, in general:  Warn that this is a private system  Tell unauthorized users that
    they should disconnect immediately  Inform users that activity is monitored/recorded and may be shared with 3rd parties
    or used in a criminal investigation  May reference applicable legislation  May specify that continuing to login constitutes
    agreement to an Acceptable Use policy or similar  May provide contact details for any queries NOTE The wording of the
    legal notice is normally defined as part of an organization''s security policy. You should consult your organizations
    legal department or counsel to ensure the legality of the banner message and suitability for the country/s in which you
    operate.'
  impact: ''
