      ICMP Echo Requests with the Record Route Option set.

      473 | P a g e'
    severity: medium
- id: '6.17'
  title: Ensure Ping Timestamps are Set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: The Routing Engine should not return Timestamp information to Ping Requests
  rationale: When the Timestamp Request option is set in a Echo Request (ping) packet, a host generally responds with its
    current system time when the ping is received. Attackers may use Echo Requests with the Timestamp option set during recognizance
    of a network to obtain details of the configuration and state. The use of these options is largely deprecated, with no
    valid usage in almost all modern networks; therefore, the JUNOS Device should be configured not to return the Timestamp
    in ICMP Echo Responses.
  impact: ICMP Echo Requests (pings) with the Request Timestamp Option set will still receive a response (unless blocked elsewhere),
    but the JUNOS Device will not return the additional Timestamp information.
  references:
