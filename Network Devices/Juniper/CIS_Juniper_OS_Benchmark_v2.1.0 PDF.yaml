- id: 6.6.13
  title: Ensure SSH Key Authentication is not set for User Logins
  scoring: scored
  profile:
  - Level 1
  description: SSH Key Based Authentication should not be used for User Logins
  rationale: 'Due to the sensitive nature of SSH, potentially allowing full management of the targeted device, protecting
    SSH access using strong authentication methods is essential to the security of the device. One method which is supported
    in SSH for stronger authentication is the use of Public/Private Encryption Key Pairs in place of a more traditional login
    prompt for a Username and Password. Instead, an administrator uploads the user''s Public key to the JUNOS (or other) device
    to be managed. When the user connects, they will use their Private key to encrypt some session specific data. The JUNOS
    device can verify the Users identity by decrypting that data using the Public key configured previously and comparing
    it to an expected result. If the results match, then the user must have access to the Private key, so is considered valid.
    Unfortunately using SSH Keys to authenticate User Logins to JUNOS devices introduce a number of security issues:  Public
    Keys may only be configured locally on each JUNOS device  Public Keys are used instead of centralized AAA using TACACS+
    or RADIUS as covered in Recommendation 6.8.1 Ensure External AAA Server is set  The use of SSH Keys means only a single
    Authentication Factor (the keys) can be used, preventing the use of Multi Factor Authentication as covered in 6.6.14 Ensure
    Multi-Factor is used with External AAA  JUNOS does not provide any method to automate rollover or locking of keys. If
    keys are compromised/lost, they must be changed on every JUNOS device on which they are configured.  Some SSH implementation
    support the use of X.509 PKI Certificates for managing SSH Keys, but JUNOS does not. 283 | P a g e Because of these limitations
    and the difficulty in auditing and managing SSH Keys on JUNOS devices, this method should not be used for Authentication
    of User logins or for the Root User. In some instances, such as when using PyEZ or NETCONF based automation over SSH,
    it may be preferable to authenticate a limited number of automation services using SSH Keys, rather than "hard coding"
    user details into scripts. Where this is the case, it is imperative to have strong key management procedures in use to
    control and audit access to the Private Keys used and a process to allow for rollover and revocation of compromised keys.'
  impact: Careful configuration of permissions following the least privilege principle is essential for secure and reliable
    management of the network. When configuring remote AAA, it is recommended that a local Emergency Access Account also be
    configured to allow management of the device in the event that AAA services are unavailable.
  references:
  - 1. https://kb.juniper.net/InfoCenter/index?page=content&id=KB30588
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  page_start: 283
  audit_raw: 'To confirm whether any logins have been configured to use SSH Key based Authentication,

    issue the following command from the [edit system login] hierarchy:

    [edit system login]

    user@host# show | display set | match "user.*authentication" | match "sshdsa|ssh-ecdsa|ssh-ed25519|ssh-rsa" | count

    The above command should return a count of 0 lines.

    If SSH Key based Authentication is being used for automation (eg. with PyEZ) the specific

    user accounts used for the automation service can be excluded from the previous command

    as follows:

    [edit system login]

    user@host# show | display set | match "user.*authentication" | match "sshdsa|ssh-ecdsa|ssh-ed25519|ssh-rsa" | exclude
    "pyez-user|netconf-user" | count

    In the example above the users to be excluded were pyez-user and netconf-user. With

    logins used for automation excluded, the above command should return a count of 0 lines.'
  remediation: 'For each User Login configured with SSH Key based Authentication, you can delete the SSH

    Key with the following command from the [edit system login] hierarchy:

    284 | P a g e

    [edit system login]

    user@host# delete user <User ID> authentication

    The user can then be configured with a password locally or, inline with Recommendation

    6.8.1 Ensure External AAA Server is set , leave the authentication method blank and allow

    the External AAA to control Authentication.

    Alternatively, you may wish to delete the local user account entirely using the following

    command:

    [edit system login]

    user@host# delete user <User ID>'
  checks:
  - type: manual_review
    info: 'To confirm whether any logins have been configured to use SSH Key based Authentication,

      issue the following command from the [edit system login] hierarchy:

      [edit system login]

      user@host# show | display set | match "user.*authentication" | match "sshdsa|ssh-ecdsa|ssh-ed25519|ssh-rsa" | count

      The above command should return a count of 0 lines.

      If SSH Key based Authentication is being used for automation (eg. with PyEZ) the specific

      user accounts used for the automation service can be excluded from'
    severity: medium
- id: 6.6.14
  title: Ensure Multi-Factor is used with External AAA
  scoring: manual
  profile:
  - Level 2
  description: Multi-factor Authentication should be used for management sessions
  rationale: Even with the password complexity restrictions and use of External AAA servers for centralized control of user
    Authentication, login with usernames and passwords is commonly exploited through Phishing, Brute Force or other methods.
    Multi-Factor Authentication (sometimes called Two-Factor Authentication or 2FA) provides a significant additional layer
    of security for management sessions by requiring a username, password and some further method/s to all be provided to
    login. The additional factor may use an X.509 "SSL" Certificate, a Time Based One Time Password (TOTP), a physical security
    token, a Fingerprint or may use some other method or even combination of these methods. In all the cases above, the additional
    factor provides a significant additional challenge to an attacker looking to successfully pose as the user and compromise
    the network. Multi-Factor authentication is widely supported by most External AAA services, either using paid for services
    like RSA SecureID or free platforms like Google Authenticator, so is included here as a general recommendation relating
    to AAA and login. However, because the Multi-Factor Authentication is implemented on the AAA Server, it is not possible
    to include an audit action or include this as a scored recommendation.
  impact: As with any AAA service, Multi-Factor Authentication should be carefully tested and you should ensure you maintain
    a local password as a backup method to ensure you are not locked out of your network while implementing such a service.
  references:
  - 1. https://en.wikipedia.org/wiki/Multi-factor_authentication
  - 2. http://tacacs.net/mfa.asp
  page_start: 286
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: 6.7.1
  title: Ensure External NTP Servers are set
  scoring: scored
  profile:
  - Level 1
  description: At least one, and preferably three or more, external NTP Servers should be configured
  rationale: Keeping time settings consistent across a network is vital if log data is to be meaningful and usable in understanding
    faults and security incidents. Consistent time settings are also fundamental to the operation of some network protocols
    and services such as IPSec, PKI and 802.1x which may be critical to many networks. To ensure that the time on your JUNOS
    router is consistent with other devices in your network, at least one, and preferably three or more, NTP Servers external
    to the device should be configured. Although NTP provides for a Peer to Peer type implementation, where individual time
    servers are not specified and methods such as broadcast and multicast are utilized to synchronize time between hosts,
    in almost all real world cases a Server / Client model should be used for network devices - even if multicast or broadcast
    methods are used for other types of hosts. Using specified time sources allows you to better secure, monitor and manage
    your NTP implementation; simplifying debugging and allowing tighter control of NTP traffic. While a complete discussion
    of NTP Architecture is beyond the scope of this Benchmark, it is strongly recommended that careful attention be paid to
    resilience, accuracy and reliability of NTP time sources used within your network. Having multiple NTP servers helps to
    ensure fault tolerance and also protects against misconfigured or compromised servers causing radical time changes, something
    an attacker may want to achieve to cover their tracks or conduct replay attacks.
  impact: If time is not synchronised between devices, log messages cannot readily be correlated to allow administrators to
    understand events on the network. In addition, many services such as IPSEC, PKI or 802.1x which rely on Encryption may
    not function correctly if time and date settings are not properly maintained. 289 | P a g e
  references:
  - 1. [Juniper TechLibary, Time Management Administration
  - 2. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  page_start: 289
  audit_raw: 'From the command prompt, execute the following commands:

    [edit]

    user@host#show system ntp | match server | except boot-server | count

    The above command should return an integer value greater than or equal to 1 if NTP

    servers are explicitly configured.'
  remediation: 'Configure at least one External NTP Server using the following commands under the [edit

    system] hierarchy;

    [edit system]

    user@host#set ntp server <Servers IP>'
  checks:
  - type: sql
    command: show system ntp | match server | except boot-server | count
    severity: medium
