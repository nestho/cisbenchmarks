- id: 6.7.4
  title: Ensure NTP uses version 4
  scoring: scored
  profile:
  - Level 1
  description: Version 4 of the NTP protocol should be utilized.
  rationale: NTP is one of the oldest Internet Standard protocols and has been around for over 30 years. As with most protocols,
    during its lifetime, NTP has received numerous revisions and updates to ensure it remains reliable and secure to use in
    modern networks. The current reference version of NTP is Version 4. Version 4 adds significant enhancements to the protocols
    security which means it is widely accepted as the defacto standard for secure implementation and should be used for all
    network devices.
  impact: ''
  references:
  - 1. [Juniper TechLibary, Time Management Administration
  - 2. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  page_start: 298
