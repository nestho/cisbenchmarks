- id: 6.10.5.1
  title: Ensure REST is Not Set to HTTP
  scoring: scored
  profile:
  - Level 1
  description: Network devices should not be managed using unencrypted HTTP sessions
  rationale: The JUNOS REST API can be configured for access using either HTTP or HTTPS for connections. HTTP transmits all
    data (including passwords) in clear text over the network and provides no assurance of the identity of the hosts involved.
    Because of this HTTP should never be used for sensitive tasks such as managing network devices or entering login credentials;
    so REST HTTP should always be disabled.
  impact: Management of the device through REST HTTP will be lost - ensure that other management options are configured and
    working before disabling this service on production systems.
  references:
  - 1. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  page_start: 400
  audit_raw: 'To check whether REST HTTP is configured, enter the following command from the [edit

    system services rest] hierarchy:

    [edit system services rest]

    user@host# show http | count

    If the command returns a line count of 1 or greater, then REST HTTP is enabled.'
  remediation: 'To disable REST HTTP, enter the following command from the [edit system services

    rest] hierarchy:

    [edit system services rest]

    user@host# delete http

    400 | P a g e'
  checks:
  - type: sql
    command: show http | count
    severity: medium
    info: 'To check whether REST HTTP is configured, enter the following command from the [edit

      system services rest] hierarchy:

      [edit system services rest]

