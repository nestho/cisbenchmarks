- id: 6.10.1.3
  title: Ensure SSH Connection Limit is Set
  scoring: scored
  profile:
  - Level 1
  description: SSH connections should be limited.
  rationale: SSH is a common management protocol, so is often targeted by attackers trying to gain access to routers or execute
    Denial of Service (DoS) attacks. To limit the effectiveness of DoS and Brute Force attacks targeting the JUNOS device
    using the SSH service the maximum number of concurrent connections should be limited. Any sessions attempted once this
    limit is reached will be rejected. A maximum limit of 10 concurrent sessions is recommended for most environments.
  impact: ''
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Page 222, National Security
  - 2. Configuring SSH Service for Remote Access to the Router, JUNOS Software System
  page_start: 337
