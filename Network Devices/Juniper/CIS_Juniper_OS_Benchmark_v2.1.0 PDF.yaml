- id: 6.10.2.6
  title: Ensure Web-Management Interface Restriction is Set
  scoring: scored
  profile:
  - Level 1
  description: JWeb access should be restricted to trusted networks
  rationale: By default, when configured, the JWeb service will listen for incoming connections on all interfaces which have
    an IP Address configured, exposing JWeb to users on all networks through which the device is reachable. Because control
    of Network Systems can have a serious impact on the security of your environment, the JUNOS device should only be manageable
    over some of its interfaces; in particular a JUNOS device providing connectivity to untrusted networks such as the Internet
    should only be manageable from trusted sources. This can be accomplished by limiting the interfaces on which the JWeb
    HTTPS service operates and this restriction should be applied on all JUNOS devices. Firewall Filters or Security Policy
    (SRX) should also be used to further restrict management to authorized sources (see Recommendations in Section 2 - Firewall
    for further details).
  impact: Ensure that JWeb Management is operational and reachable using the selected interfaces before applying interface
    restrictions in a production environment.
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  page_start: 380
  audit_raw: 'To confirm whether the JWeb Interface restrictions have been applied, execute the

    following command from the [edit system services web-management] hierarchy:

    [edit system services web-management]

    user@host#show https interfaces

    The configured Interface or Interfaces should be returned.

    380 | P a g e'
  remediation: 'To apply JWEB Interface restrictions issue the following commands from the [edit system

    services web-management https] hierarchy:

    To set a single Interface:

    [edit system services web-management https]

    user@host#set interface <interface>

    Or to set multiple Interfaces:

    [edit system services web-management https]

    user@host#set interface [ <interface 1> <interface 2> <interface n> ]'
  checks:
