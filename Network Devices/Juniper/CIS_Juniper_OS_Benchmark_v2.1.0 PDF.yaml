- id: 4.1.1
  title: Ensure peer authentication is set to MD5
  scoring: scored
  profile:
  - Level 1
  description: BGP Peers should be authenticated.
  rationale: Where it is deployed, BGP routing is vital for normal operation of an organization's network infrastructure.
    Correct route information is required for routers to correctly direct traffic through the network. An attacker posing
    as one of the target routers BGP neighbors may inject incorrect information into the route table resulting in DOS attack
    or loss of confidential data through a Man in the Middle attack. On Juniper routers (as well as routers from other manufacturers
    such as Cisco or Brocade) it is possible to authenticate neighbors using an MD5 digest of elements of the TCP segment,
    creating a signature which can be verified without ever needing to transmit the password. This method is described in
    RFC 2385.
  impact: ''
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Section 4.4.5 (page 123),
  page_start: 103
  audit_raw: 'Enter the following command from operational mode:

    user@host>show bgp neighbor | match "Authentication key is configured" |

    count

    The above command should return a positive integer equal to the number of configured

    BGP Neighbors.'
  remediation: 'If you have deployed BGP in your network you should authenticate all neighbors.

    Authentication can be configured at the Global, Group or Neighbor level, with more specific

    settings overriding less specific. For eBGP a different MD5 password should be configured

    for each neighbor or peer. For iBGP neighbors the same key may be used globally or

    different keys may be used by group or neighbor as appropriate to your infrastructure. To

    configure BGP Authentication at the globally enter the following command at the [edit

    protocols bgp] hierarchy:

    103 | P a g e

    [edit protocols bgp]

    user@host#set authentication-key <md5 key>

    To configure BGP Authentication at the group level enter the following command at the

    [edit protocols bgp] hierarchy:

    [edit protocols bgp]

    user@host#set group <group name> authentication-key <md5 key>

    Finally, to configure BGP Authentication at the neighbor level enter the following command

    at the [edit protocols bgp group <group name>] hierarchy:

    [edit protocols bgp group <group name>]

    user@host#set neighbor <neighbor IP> authentication-key <md5 key>

    Remember that more specific settings override less specific settings, so a key set at the

    neighbor level will be used even if keys are also set at the group and global levels.'
  checks:
  - type: sql
    command: show bgp neighbor | match "Authentication key is configured" |
    severity: medium
    info: 'Enter the following command from operational mode:

      user@host>show bgp neighbor | match "Authentication key is configured" |

      count

      The above command should return a positive integer equal to the number of configured

      BGP Neighbors.'
- id: 4.1.2
  title: Ensure peer authentication is set to IPSEC SA
  scoring: manual
  profile:
  - Level 2
  description: BGP Neighbors should be strongly authenticated.
  rationale: Where it is deployed, BGP routing is vital for normal operation of an organization's network infrastructure.
    Correct route information is required for routers to correctly direct traffic through the network. An attacker posing
    as one of the target routers BGP neighbors may inject incorrect information into the route table resulting in DoS attack
    or loss of confidential data through a Man in the Middle attack. As well as MD5 hash based authentication, JUNOS routers
    can also authenticate BGP neighbors using IPSEC Security Associations. This allows more robust authentication mechanisms
    to be used and is recommended as an alternative to MD5 HMAC in high security environments. Although M, T and MX series
    devices normally require a Services PIC or DPC installed to use IPSEC tunnels, no additional hardware is required for
    IPSEC SA based authentication of BGP neighbors. As with MD5 HMAC, IPSEC SA based Authentication can be configured Globally,
    at the Group Level or at the Neighbor Level, with more specific settings overriding less specific settings. Because IPSEC
    SA Authentication is intended for use in high security environments, it is recommended that different parameters are configured
    for each neighbor, particularly where eBGP is used.
  impact: ''
  references:
  - 1. Applying IPSEC Security Association, JUNOS Software Routing Configuration Guide,
  page_start: 105
  audit_raw: 'Due to the range of options for configuring IPSEC SA based Authentication with BGP, this

    recommendation is not scorable.'
  remediation: 'To setup IPSEC SA based authentication, first configure a Security Association at the [edit

    security ipsec] hierarchy;

    105 | P a g e

    [edit security ipsec]

    edit security-association <SA name>

    set description <description>

    set mode transport

    set manual direction bidirectional protocol ah

    set manual direction bidirectional authentication algorithm <authentication

    method>

    set manual direction bidirectional authentication key <key>

    The SA must be bi-directional and must be configured with the same parameters on all

    neighbors reachable on the intended interface. Note that only Authenticated Header is

    configured in this example which provides mutual authentication but does not encrypt BGP

    protocol messages in transit.

    To configure IPSEC SA based authentication globally for BGP, issue the following command

    from the [edit protocols bgp] hierarchy;

    [edit protocols bgp]

    user@host#set ipsec-sa

    To configure IPSEC SA based authentication for a group, issue the following command from

    the [edit protocols bgp group <group name>] hierarchy;

    [edit protocols bgp group <group name>]

    user@host#set ipsec-sa <SA name>

    To configure IPSEC SA based authentication for a neighbor, issue the following command

    from the [edit protocols bgp group <group name> neighbor <neighbor ip address>]

    hierarchy;

    [edit protocols bgp group <group name> neighbor <neighbor ip address>]

    user@host#set ipsec-sa <SA name>'
  checks:
  - type: manual_review
    info: 'Due to the range of options for configuring IPSEC SA based Authentication with BGP, this

      recommendation is not scorable.'
    severity: medium
- id: 4.1.3
  title: Ensure EBGP peers are set to use GTSM
  scoring: scored
  profile:
  - Level 1
  description: GTSM should be used with all EBGP peers.
  rationale: Where it is deployed, External BGP routing is vital for normal operation of an organization's network infrastructure.
    Correct route information is required for routers to correctly direct traffic destined for external networks. An attacker
    may attempt to exhaust the routers CPU and memory resources by flooding a target router with fake routing updates, resulting
    in a DoS condition. Potentially an attack may also inject fake routing information into the route table. General TTL Security
    Mechanism (GTSM) is defined in RFC5082 and takes advantage of the fact that routers normally peer with adjacent neighbors,
    i.e. with routers only 1 hop away. GTSM uses the Time to Live (TTL) field of routing update packets to determine whether
    or not the packet originated from an adjacent router, denying those which do not. Juniper routers effectively implement
    GTSM by default. Administrators can use the multihop command hierarchy to increase the maximum acceptable TTL for route
    updates, allowing updates from non adjacent peers. When peering with adjacent routers then multihop should not be configured,
    using the default to effectively configure GTSM with a TTL limit of 254 (or 1 hop). If your network requires peering with
    routers more than 1 hop away (non adjacent peers), multihop should be configured on a per peer or per group basis with
    the minimum possible value so as to limit the distance, in terms of networks, from which an attack can be launched.
  impact: ''
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Section 4.4.5 (page 123),
  page_start: 108
  audit_raw: 'Enter the following command from operational mode:

    [edit]

    user@host#show protocols bgp | match "multihop" | count

    The above command should return an integer indicating the number of occasions that

    multihop is defined. In most cases, where adjacent peers are used, the returned value

    should be 0 (or 1 if peering with the Team Cymru Bogon Route Server).

    108 | P a g e'
  remediation: 'If you have deployed multihop in your network but do not have any peers more then 1 hop

    away, disable multihop with the following command from the [edit protocols bgp],

    [edit protocols bgp group <group name>] or [edit protocols bgp group <group

    name> neighbor <neighbor address>] depending at which level you have configured

    multihop;

    [edit protocols bgp]

    user@host#delete multihop

    To change the number of hops distance from which a route update can originate, enter the

    following command from the [edit protocols bgp group <group name>] to apply

    multihop to a group or [edit protocols bgp group <group name> neighbor <neighbor

    address>] to apply multihop to a single neighbor;

    [edit protocols bgp group <group name>]

    user@host#set multihop ttl <number of hops>

    Remember that, in both cases, more specific settings override less specific ones. So if

    multihop is set to 5 at the neighbor level, but the default of 1 at the global level, the

    neighbor level setting will apply for communications with that peer.'
  checks:
  - type: sql
    command: show protocols bgp | match "multihop" | count
    severity: medium
    info: 'Enter the following command from operational mode:

      [edit]

      user@host#show protocols bgp | match "multihop" | count

      The above command should return an integer indicating the number of occasions that

      multihop is defined. In most cases, where adjacent peers are used, the returned value

      should be 0 (or 1 if peering with the Team Cymru Bogon Route Server).

      108 | P a g e'
- id: 4.1.4
  title: Ensure Bogon Filtering is set (where EBGP is used)
  scoring: manual
  profile:
  - Level 2
  description: Bogon prefixes should be filtered when using eBGP.
  rationale: 'Bogon Networks are those IP Address blocks which should never appear on the Internet. Examples include loopback
    addresses, RFC1918 private addresses and IP blocks which have not yet been assigned by the IANA (Internet Assigned Numbers
    Authority) to one of the RIRs (Regional Internet Registries). If traffic arrives at your network edge from a Bogon network,
    the traffic is almost certainly malicious and should be filtered. Studies have shown instances where as much as 60% of
    DoS attack traffic is being sourced from Bogon or Martian (a subset which includes RFC1918 and RFC3330 networks) addresses.
    As a rule Bogon traffic should also be filtered from leaving the network as it may be malicious or represent a possible
    information leak. Either way, return traffic would not get back. Bogon information can be obtained from a number of sources
    such as:  IANA - Obtain the current IPv4 assignments list, anything that is shown as Unallocated or Reserved is a Bogon.
     Team Cymru provides, what is effectively, the definitive Bogon list in a range of formats and through a BGP Route Server
    project.  RIPE NCC also provides lists of Unallocated, Martian and combined Bogon space. An important point to remember
    about Bogon filtering is that the addresses that make up Bogon space change. Unallocated addresses get allocated, reserved
    networks may be repurposed, etc. If you keep your Bogon filters static, you may accidently block valid traffic from these
    addresses. Ensure you have a procedure to keep your Bogon lists up to date!'
  impact: ''
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Section 4.4.5 (page 123),
  - 2. The Bogon Reference, Team Cymru (http://www.teamcymru.org/Services/Bogons/)
  page_start: 110
  audit_raw: Not scored or auditable.
  remediation: 'JUNOS offers a variety of options for filtering Bogons and Martians, which is why this item

    is not scored. Some of the more common options are discussed below.

    1 - The Martian Table Most Martian space (but not all, else you would not be able to use

    110 | P a g e

    your router on private networks) is blocked using the Martian Routing Table, which is

    discussed elsewhere in this Benchmark and configured under the [edit routing-options

    martians] hierarchy. Route updates for prefixes in this special table are ignored, so adding

    Bogons here will prevent them being learned through any routing protocol.

    2 - Ingress Prefix Filtering Ingress Filtering should be used on eBGP sessions to prevent

    your own prefixes being advertised back to your network or, in the case of ISP networks,

    customer networks advertising prefixes other than those allocated to them.

    The other filtering types are covered previously. Prefix lists are configured under the [edit

    policy-options] hierarchy, but are discussed here as they are applied under the [edit

    protocols bgp <group name>] hierarchy. First configure a policy:

    [edit policy-options]

    user@host#edit policy-statement <policy name> term <term name>

    [edit policy-options policy-statement <policy name> <term name>]

    user@host#set from route-filter <network>/<mask> <exact | orlonger | prefixlength-range <start>-<end>> reject

    The last stage should be repeated for each prefix required, but as several options are

    shown, a couple of examples are given below:

    [edit policy-options <policy name> <term name>]

    user@host#set from route-filter 0.0.0.0/0 exact reject

    user@host#set from route-filter 10.0.0.0/8 orlonger reject

    user@host#set from route-filter 0.0.0.0/0 prefix-length-range /29-/32 reject

    The first line in the example rejects a default route advertised to the router and only that

    route. The second line will filter any route from the 10.0.0.0/8 range, for instance

    10.1.1.0/24 or 10.2.0.0/16. The final line is a little more complex, this will reject any route

    with a mask length of /29, /30, /31 or /32 (generally eBGP routes should be summarized

    into larger prefixes than this). Having defined a policy, we need to apply it.

    As with most other BGP configuration options, you can apply the policy at Global, Group or

    Neighbor levels as suites your needs. In this example we will apply the policy to a group

    containing all our eBGP peers:

    [edit protocols bgp group <group name>]

    user@host#set import <policy name/s>

    3 - Peering with a Bogon Route Server As far as I am aware, the idea of using a BGP

    Peering session to a Route Server for updates on Bogon networks was hatched by Team

    Cymru and they offer a free, public Bogon Route Server, which you can peer with to keep

    you Bogon list up to date. The theory works equally well by peering to a route server of

    your own, allowing a greater degree of control over your Bogon list updates for your

    organization if desired. First a static route is created and configured to discard traffic. An

    111 | P a g e

    address that is reserved for Test or Example networks is used, you may need to allow this

    /32 prefix in the Martian Table:

    [edit routing-options]

    user@host#set static route 192.0.2.1/32 discard no-readvertise retain

    An import policy should be set to match prefixes from the route servers AS and the

    Community (if used) for Bogon updates, setting the next hop to 192.0.2.1 and accepting the

    route.

    [edit policy-options]

    user@host#edit policy-statement <policy name> term <term name>

    [edit policy-options policy-statement <policy name> term <term name>]

    user@host#set from protocol bgp as-path <peer AS> community <community>

    user@host#set then next-hop 192.0.2.1

    Finally the BGP Peering and Group is configured with the import policy above and not to

    export. In addition security options covered in other recommendations should be used:

    [edit protocols bgp <group name>]

    user@host#set type external description "bogon route servers"

    user@host#set import <policy name>

    user@host#set peer-as <AS of Route Server>

    user@host#set neighbor <neighbors IP>

    user@host#set local-address <local IP to use for peering>'
  checks:
  - type: manual_review
    info: Not scored or auditable.
    severity: medium
- id: 4.1.5
  title: Ensure Ingress Filtering is set for EBGP peers
  scoring: manual
  profile:
  - Level 1
  description: Filter prefixes advertised to the router through eBGP.
  rationale: In addition to filtering Bogon and Maritan routes JUNOS routers peering with eBGP neighbors should also apply
    Ingress Filtering to prevent the router processing bad updates sent from the neighbor router, either maliciously or by
    accident. At a minimum prefix filters should deny any prefix which belong to your own AS. Depending on your type of deployment
    you may also wish to block prefixes which are more specific than those issues by RIR's or limit ISP customers to advertising
    those prefixes which you have assigned to them.
  impact: ''
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Section 4.4.5 (page 123),
  page_start: 113
  audit_raw: 'Because a policy may be applied at one or more different levels depending on the

    requirements of a specific organization, it is not possible to score this recommendation.'
  remediation: 'From the [edit policy-options] hierarchy, define a new policy by issuing the following

    commands:

    [edit policy-options]

    user@host#edit policy-statement <policy name> term <term name>

    [edit policy-options policy-statement <policy name> term <term name>]

    user@host# set from route-filter <network>/<mask> <exact | orlonger | prefixlength-range <start>-<end>> reject

    Now apply the policy, either globally, to a group or to an individual peer as required by

    your environment.

    [edit protocols bgp <group name>]

    user@host#set import <policy name>'
  checks:
  - type: manual_review
    info: 'Because a policy may be applied at one or more different levels depending on the

      requirements of a specific organization, it is not possible to score this recommendation.'
    severity: medium
- id: 4.1.6
  title: Ensure RPKI is set for Origin Validation of EBGP peers
  scoring: manual
  profile:
  - Level 2
  description: Use RPKI for Origin Validation on Public BGP Peering
  rationale: 'In addition to filtering Bogon and Maritan routes JUNOS routers peering with eBGP neighbors should also apply
    Ingress Filtering to prevent the router processing bad updates sent from the neighbor router, either maliciously or by
    accident. Traditional Ingress Filtering, outlined in Recommendation 4.1.5 Ensure Ingress Filtering is set for EBGP peers,
    uses manually administrated Routing Policy configured on individual routers to validate prefixes being received from BGP
    Neighbours in Peer Autonomous Systems (ASs) based on Internet Routing Registry (IRR) entries. This technique is maintenance
    intensive and prone to errors, although semi automated tools do exist to help. It is also not readily enforceable on Transit
    Connections, where the router does not connect directly to the Origin AS, but instead receives their routes via a Transit
    Service Provider. The receiving AS has no option but to trust that their upstream provider/s are correctly implementing
    filtering, with no way to validate the routing information they receive independently. This leaves BGP Routing prone to
    Hijack Attacks, with numerous incidents in recent years causing issues both with reachability for some prefixes/ASs and
    with theft of information, after traffic is re-routed to fake destinations. To combat this the Resource Public Key Infrastructure
    (RPKI) framework was created to allow Public ASs to sign their Resources (IPv4 and IPv6 Prefixes they will originate)
    by creating a Route Origination Authorizations (ROA) Certificate, through their Regional Internet Registry (RIR) (AFRINIC,
    ARIN, APNIC, LACNIC or RIPE NCC). Public ASs can perform Origin Validation on the routes received through BGP, whether
    from direct Peer networks or through a Transit Provider. The Junos Router does this by checking the route information
    it receives through BGP with a RPKI Validator Server (sometimes called an RPKI Cache Server) through the RPKI-RTR Protocol
    defined in RFC 8210. The RPKI Validator maintains a cache of ROAs distributed by the RIRs and returns a verdict to the
    Router, which may be either: 115 | P a g e  Valid - The AS, Prefix and Prefix Length all match a valid ROA  Invalid
    - A matching ROA exists for the Prefix, but either the Origin AS or the Prefix Length does not match  Unknown or Not
    Found - No matching ROA exists, most likely the Resource Owner has not created an RPKI with their RIR Routing Policy on
    the Junos device is configured to determine whether routes should be accepted based on results returned by the RPKI Validator.
    Most commonly Valid and Unknown/Not Found routes will be accepted and Invalid rejected, but this should be determined
    by the policy of each individual AS. A full discussion of RPKI is beyond the scope of this Benchmark, but is covered in
    detail in the Juniper TechLibary BGP Origin Validation Using Resource Public Key Infrastructure, available for free from
    the Juniper website. RIPE NCC, one of the RIRs, provide detailed instructions for installing several common RPKI Validators
    (including their own) in How to Install an RPKI Validator.'
  impact: Incorrect configuration of any Route Filtering may impact on reachability
  references:
  - 1. Juniper TechLibary [BGP Origin Validation Using Resource Public Key
  - 2. RIPE NCC [How to Install an RPKI
  page_start: 115
  audit_raw: "Because a policy may be applied at one or more different levels depending on the\nrequirements of a specific\
    \ organization, it is not possible to automatically score this\nrecommendation.\nYou can confirm a RPKI Validator Server\
    \ is configured by issuing the following command\nfrom the [edit routing-options] configuration hierachy:\n[edit routing-options]\n\
    user@host# show validation\nIf a RPKI Validator is configured, details will be returned.\nIn the example below, the RPKI\
    \ Validator Server's IP Address is 10.10.0.100, the RPKI-RTR\nprotocol is running on TCP Port 8323 (the standard port\
    \ for the RIPE NCC RPKI Validator,\nthis may vary for other servers) and the local IP used to by the Junos Router for\
    \ the session\nis 10.10.0.200:\n[edit routing-options]\nuser@host# show validation\nvalidation {\n group rpki-validator\
    \ {\n session 10.10.0.100 {.\n port 8323;\n local-address 10.10.0.200;\n116 | P a g e\n }\n }\n}\nMultiple RPKI Validators\
    \ can be configured and additional options may also be present.\nIf multiple Logical Systems are in use, RPKI Origin Validation\
    \ may need to be configured\nseparately for all which are performing Public BGP peering.\nJunos Routers use a Routing\
    \ Policy to determine what action to take for a route based on\nthe response from the RPKI Validator. This should be applied\
    \ to all Group's or Neighbours\nwhich will be performing Public BGP Peering and can be checked by issuing the following\n\
    command from the [edit protocols] configuration hierarchy:\n[edit protocols]\nuser@host# show bgp group <group-name>\n\
    Where <group-name> is the group or groups used for Public BGP Peering (this will often be\nseveral groups). In the example\
    \ below the rpki-validation policy is applied to routes\nreceived by the transit1 group:\n[edit protocols]\nuser@host#\
    \ show bgp group transit1\ntype external;\nimport rpki-validation;\nexport export-direct;\npeer-as 64510\nneighbor 203.0.113.10\n\
    neighbor 203.0.113.11\nTo confirm the configured RPKI Policy, issue the following command from the [edit\npolicy-options]\
    \ configuration hierarchy:\n[edit policy-options]\nuser@host# show policy-statement <policy name>\nWhere <policy name>\
    \ is the policy configured for the Group or Neighbour in the previous\ncommand (in our example rpki-validation) :\n[edit\
    \ policy-options]\nuser@host# show policy-statement rpki-validation\nterm valid {\n from {\n protocol bgp;\n validation-database\
    \ valid;\n }\n then {\n validation-state valid;\n accept;\n }\n}\n117 | P a g e\nterm invalid {\n from {\n protocol bgp;\n\
    \ validation-database invalid;\n }\n then {\n validation-state invalid;\n reject;\n }\n}\nterm unknown {\n from protocol\
    \ bgp;\n then {\n validation-state unknown;\n accept;\n }\n}\nIn this case the Policy will accept routes for which the\
    \ RPKI Validator returns Valid or\nUnknown and will reject routes which are Invalid."
  remediation: 'Configuration and deployment of an RPKI Validator and a full discussion of all

    configuration options is beyond the scope of this Benchmark.

    To configure an RPKI Validator Server, issue following commands from the [edit

    routing-options] configuration hierarchy:

    [edit routing-options]

    user@host# set validation group <group-name> session <RPKI Server IP> port

    <RPKI Server Port> local-address <Local IP>

    Where:

    

    <group-name> is a descriptive name chosen for the RPKI Server

    

    <RPKI Server IP> is the IP address used on the RPKI Validator for the RPKI-RTR

    protocol

    

    <RPKI Server Port> is the port configured on RPKI Validator for the RPKI-RTR

    protocol

    

    <Local IP> is a Local Interface address that the Router should use as the source for

    RPKI-RTR sessions

    **Note ** - If multiple Logical Systems are configured, RPKI Validation will need to be

    configured separately for all LSYS being used for Public BGP Peering.

    118 | P a g e

    Next create a Routing Policy to accept or reject routes based on the RPKI Validation

    Database, using the following commands for each term from the [edit policy-options]

    heirachy:

    [edit policy-options]

    user@host# set policy-statement <policy-name> term <term-name> from protocol

    bgp

    user@host# set policy-statement <policy-name> term <term-name> from

    validation-database <RPKI Database Result>

    user@host# set policy-statement <policy-name> term <term-name> then

    validation-state <RPKI State>

    user@host# set policy-statement <policy-name> term <term-name> then <action>

    Where:

    

    <policy-name> is a descriptive name for the Routing Policy

    

    <term-name> is a descriptive name for the Term

    

    <RPKI Database Result> is the result returned by the RPKI Validator

    

    <RPKI State> is the RPKI State to be recorded locally for the route (normally the

    same as the RPKI Validator result)

    

    <action> is a Routing Policy action such as to accept or reject the route

    These steps can be repeated until all of your required terms and actions are configured.

    Here we create the rpki-validation Routing Policy given in the Audit Procedure example:

    [edit policy-options]

    user@host# set policy-statement rpki-validation term valid from protocol bgp

    user@host# set policy-statement rpki-validation term valid from validationdatabase valid

    user@host# set policy-statement rpki-validation term valid then validationstate valid

    user@host# set policy-statement rpki-validation term valid then accept

    user@host# set policy-statement rpki-validation term invalid from protocol

    bgp

    user@host# set policy-statement rpki-validation term invalid from validationdatabase invalid

    user@host# set policy-statement rpki-validation term invalid then validationstate invalid

    user@host# set policy-statement rpki-validation term invalid then reject

    user@host# set policy-statement rpki-validation term unknown from protocol

    bgp

    user@host# set policy-statement rpki-validation term unknown then validationstate unknown

    user@host# set policy-statement rpki-validation term unknown then accept

    119 | P a g e

    The final term matches on all BGP Routes which do not return either valid or invalid

    from the RPKI Server, so does not require the additional match condition on the

    validation-database result.

    The RPKI Routing Policy should now be applied to all BGP Neighbours or Groups used for

    Public BGP peering using the following commands from the [edit protocols bgp]

    configuration heirachy:

    [edit protocols bgp]

    user@host# set group <group-name> import <policy-name>

    OR

    [edit protocols bgp]

    user@host# set neighbor <Neighbor IP> import <policy-name>

    Where:

     is the name of the BGP Group

     is the Routing Policy configured in the previous step

     is the IP Address of the individual neighbor to which policy will be applied

    Note - Other BGP Import policies may already be applied, it is important to ensure all policy is

    applied correctly and in the correct order to prevent disruption to the network.'
  checks:
  - type: sql
    command: show validation
    severity: medium
    info: 'Because a policy may be applied at one or more different levels depending on the

      requirements of a specific organization, it is not possible to automatically score this

      recommendation.

      You can confirm a RPKI Validator Server is configured by issuing the following command

      from the [edit routing-options] configuration hierachy:

      [edit routing-options]

      user@host# show validation

      If a RPKI Validator is'
- id: 4.2.1
  title: Ensure IS-IS neighbor authentication is set to MD5
  scoring: scored
  profile:
  - Level 1
  description: IS-IS Neighbors should be authenticated.
  rationale: Where it is deployed, IS-IS routing is vital for normal operation of an organization's network infrastructure.
    Correct route information is required for routers to correctly direct traffic through the network. An attacker posing
    as one of the target routers IS-IS neighbors may inject incorrect information into the route table resulting in DoS attack
    or loss of confidential data through a Man in the Middle attack. On Juniper routers (as well as routers from other manufacturers
    such as Cisco or Brocade) it is possible to authenticate neighbors using either Simple authentication or a Keyed Hash
    Based Message Authentication Check using an MD5 digest of elements in PDU combined with a sequence number to protect against
    Replay attacks and confirm authenticity. Simple authentication sends the configured password as clear-text and should
    never be used. MD5 HMAC based authentication sends only a one way hash in the packets, providing authentication without
    exposing sensitive date, so should be used instead. Authentication is configured for each IS-IS Level. More fine grained
    authentication for Hello packets may also be set at the interface level.
  impact: ''
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Section 4.4.3 (page 113),
  - 2. Configuring IS-IS Authentication, JUNOS Software Routing Protocols Configuration
  page_start: 123
  audit_raw: 'Enter the following command from the [edit protocols isis] hierarchy:

    [edit protocols isis]

    user@host#show | match "authentication-" | except "-auth" | count

    The above command should return ''2'' when both required statements are configured.'
  remediation: 'If you have deployed IS-IS in your network you should use MD5 authentication for all

    neighbors at each IS-IS Level configured.

    123 | P a g e

    To configure MD5 authentication and the secret key to be used, issue the following

    commands from the [edit protocols isis] hierarchy:

    [edit protocols isis]

    user@host#set level <level> authentication-type md5

    user@host#set level <level> authentication-key <key>'
  checks:
  - type: manual_review
    info: 'Enter the following command from the [edit protocols isis] hierarchy:

      [edit protocols isis]

      user@host#show | match "authentication-" | except "-auth" | count

      The above command should return ''2'' when both required statements are configured.'
    severity: medium
- id: 4.2.2
  title: Ensure IS-IS neighbor authentication is set to SHA1
  scoring: scored
  profile:
  - Level 2
  description: IS-IS Neighbors should be authenticated with stronger SHA1 HMAC mechanism, where supported.
  rationale: Where it is deployed, IS-IS routing is vital for normal operation of an organization's network infrastructure.
    Correct route information is required for routers to correctly direct traffic through the network. An attacker posing
    as one of the target routers IS-IS neighbors may inject incorrect information into the route table resulting in DoS attack
    or loss of confidential data through a Man in the Middle attack. On Juniper routers (as well as routers from some other
    manufacturers such as Cisco or Brocade) it is possible to authenticate neighbors using an SHA1 digest of elements in PDU
    combined with a sequence number to protect against Replay attacks. SHA1 provides a stronger algorithm than the older MD5
    standard, but is not so widely supported on none Juniper platforms so should only be deployed once you are certain that
    all of the devices with which IS-IS Adjacencies will be formed support SHA1-HMAC authentication. SHA1 authentication is
    configured differently than either Simple (which sends the password cleartext and should never be used) or MD5 authentication
    methods. Instead of configuring the key directly at the IS-IS protocol, area or interface level, support for SHA1 authentication
    is added via the Hitless Key Rollover extensions. This provides the added benefit of introducing mechanisms to coordinate
    regular changes to authentication keys and make changes to authentication settings without the need to reset IS-IS adjacencies.
  impact: ''
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Section 4.4.3 (page 113),
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/concept/authenticat
  page_start: 125
  audit_raw: 'Enter the following command from the [edit protocols isis] hierarchy:

    [edit protocols isis]

    user@host#show | match "authentication-key-chain" | exclude "hello-"| count

    The above command should return a positive integer equal to the number of levels

    configured for this router.

    125 | P a g e

    Then confirm that all keys in the named key-chain are configured to use the SHA1. First

    getting the name/s of any configured key-chains:

    [edit protocols isis]

    user@host#show | match "authentication-key-chain" | exclude "hello-"

    And then checking each key-chain does not contain any non-SHA1 algorithms with the

    following command issued from the [edit security authentication-key-chains]

    hierarchy for each key-chain found:

    [edit security authentication-key-chains]

    user@host#show key-chain <name> | match "algorithm" | exclude "hmac-sha-1" |

    count

    The above command should return null or 0.'
  remediation: 'If you have deployed IS-IS in your network you should consider configuring Hitless Key

    Rollover with SHA1 authentication for all neighbors at each IS-IS Level configured.

    First a key-chain must be configured. The same key-chain may be used for multiple levels

    or separate key-chains used for each level (or even for individual interfaces where

    required). From the [edit security authentication-key-chains] hierarchy issue the

    following commands:

    [edit security authentication-key-chains]

    user@host#set key-chain <name> key <key number> secret "<secret key>"

    user@host#set key-chain <name> key <key number> start-time "<yyyy-mmdd.hh:mm:ss>"

    user@host#set key-chain <name> key <key number> algorithm hmac-sha-1

    user@host#set key-chain <name> key <key number> options isis-enhanced

    The start-time must be provided for all keys and provides the mechanism for controlled

    key rollover. Keys with a start time in the future can be configured across all of the devices

    in advance, when the time is reached all of the devices will hitlessly rollover to the new

    keys without disruption to IS-IS Adjacencies.

    Next the key should be set for all Levels at which SHA1 HMAC authentication will be used.

    From the [edit protocols isis] hierarchy, issue the following command:

    [edit protocols isis]

    user@host#set level <level> authentication-key-chain <name>

    Where a different key is required for a specific area or interface, the key-chain used at the

    Level can be overridden on a per interface per level basis using the following command

    from the `[edit protocols isis]'' hierarchy:

    126 | P a g e

    [edit protocols isis]

    user@host#set interface <interface name> level <level> hello-authenticationkey-chain <name>

    Note - Only the setting of the authentication-key-chain on a per level basis is included in the

    audit procedure for scoring this recommendation, the per interface override is included as

    additional information only.'
  checks:
  - type: sql
    command: show | match "authentication-key-chain" | exclude "hello-"| count
    severity: medium
    info: 'Enter the following command from the [edit protocols isis] hierarchy:

      [edit protocols isis]

      user@host#show | match "authentication-key-chain" | exclude "hello-"| count

      The above command should return a positive integer equal to the number of levels

      configured for this router.

      125 | P a g e

      Then confirm that all keys in the named key-chain are configured to use the SHA1. First

      getting the name/s of'
- id: 4.2.3
  title: Ensure authentication check is not suppressed
  scoring: scored
  profile:
  - Level 1
  description: IS-IS Neighbors should be authenticated.
  rationale: Where it is deployed, IS-IS routing is vital for normal operation of an organization's network infrastructure.
    Correct route information is required for routers to correctly direct traffic through the network. An attacker posing
    as one of the target routers IS-IS neighbors may inject incorrect information into the route table resulting in DoS attack
    or loss of confidential data through a Man in the Middle attack. On JUNOS routers it is possible to suppress some authentication
    features to aid integration with other vendors IS-IS implementations. One of these interoperability features allows you
    to configure the router to generate authenticated packets, but not check the authentication of received packets. This
    leaves the router as vulnerable as it would be with no authentication enabled at all and should not be used in a production
    environment.
  impact: ''
  references:
  - 1. Configuring IS-IS Authentication, JUNOS Software Routing Protocols Configuration
  page_start: 128
  audit_raw: 'Enter the following command from the [edit protocols isis] hierarchy:

    [edit protocols isis]

    user@host#show | match "no-authentication-check" | count

    The above command should return null or 0.'
  remediation: 'If you have deployed IS-IS in your network and have disabled authentication checking, reenable it by issuing
    the following command from the [edit protocols isis] hierarchy for

    each level at which it had been set:

    [edit protocols isis]

    user@host#delete level <level> no-authentication-check'
  checks:
  - type: manual_review
    info: 'Enter the following command from the [edit protocols isis] hierarchy:

      [edit protocols isis]

      user@host#show | match "no-authentication-check" | count

      The above command should return null or 0.'
    severity: medium
- id: 4.2.4
  title: Ensure loose authentication check is not configured
  scoring: scored
  profile:
  - Level 1
  description: IS-IS Neighbors should be authenticated.
  rationale: Where it is deployed, IS-IS routing is vital for normal operation of an organization's network infrastructure.
    Correct route information is required for routers to correctly direct traffic through the network. An attacker posing
