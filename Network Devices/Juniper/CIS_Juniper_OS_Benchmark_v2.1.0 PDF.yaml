- id: 6.6.3
  title: Ensure Idle Timeout is set for all Login Classes
  scoring: scored
  profile:
  - Level 1
  description: All login classes should have an idle timeout defined.
  rationale: Controlling the level of access which users are granted when logging into a router, helps protect against both
    malicious attacks and accidental misconfiguration of the router by less experienced staff. Login classes should be defined
    to grant permissions to user accounts, both local and remote, allowing permissions to be managed in a similar manner to
    User Groups on a Microsoft Windows system. All login classes should have an Idle Timeout of no more than 15 minutes configured,
    so that unused sessions are automatically logged out after this time, limiting the scope for abuse of unattended sessions.
    Note - The built in Super-User Class does not have an Idle Timeout configured and, for this reason, should be used extremely
    sparingly if at all.
