- id: '5.6'
  title: Ensure AES128 is set for all SNMPv3 users
  scoring: scored
  profile:
  - Level 2
  description: Do not allow plaintext SNMPv3 access.
  rationale: SNMPv3 provides much improved security over previous versions by offering options for Authentication and Encryption
    of messages. When configuring a user for SNMPv3 you have the option of using a range of encryption schemes, or no encryption
    at all, to protect messages in transit. The strongest scheme available is AES128 and this should be configured for all
    SNMPv3 "users" on all sensitive devices.
  impact: ''
  references:
  - 1. Creating SNMPv3 Users, JUNOS Software Network Management Configuration
  page_start: 196
  audit_raw: 'From the command prompt, execute the following command:

