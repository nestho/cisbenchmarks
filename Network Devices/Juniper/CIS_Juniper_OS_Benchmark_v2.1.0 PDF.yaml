      The above command should return 0 or an error.'
- id: '5.3'
  title: Ensure a client list is set for SNMPv1/v2 communities
  scoring: scored
  profile:
  - Level 1
  description: Limit clients to access SNMP.
  rationale: Even when limited to read only access, SNMP can provide an attacker with a wealth of information about your router
    and network topology. To limit the potential for attacks against your routers SNMP service you should limit the IP addresses
    that are permitted to connect using a client-list. This ensure that individual community strings are used to authenticate
    only by the systems in the list, providing granular access control that should be applied in addition to any firewall
    filter.
  impact: ''
  references:
  - 1. Configuring the SNMP Community String, JUNOS Software Management
  page_start: 190
  audit_raw: 'From the command prompt, execute the following command:

    [edit]

    user@host#show snmp | match "client-list-name" | count

    The above command should return a positive integer equal to the number of communities

    configured on the router.'
  remediation: 'To configure a client list issue the following command under the [edit snmp] hierarchy;

    [edit snmp]

    user@host#edit client-list <client list name>

    [edit snmp client-list <client list name>]

    user@host#set default restrict

    user@host#set <ip address/range>

    user@host#set <ip address> restrict #optionally add exceptions

    user@host#up 1

    [edit snmp]

    user@host#edit community <community name>

    [edit snmp community <community name>]

    user@host#set client-list-name <community name>

    190 | P a g e

    The set default restrict is covered in detail in the next recommendation.

    Additional IP Addresses may be permitted by repeating the set <ip address/range>

    command as needed.

    Optionally, addresses that you wish to deny from within a permitted range previously set

    can be configured with the set <ip address> restrict command.

    Note - Client-lists may also be defined directly under the [edit snmp community <community

    name> clients] hierarchy for use within the specified community with the same effect, but

    for ease of management and audit, the first method is preferred.'
  checks:
