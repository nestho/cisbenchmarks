- id: 6.6.7
  title: Ensure Remote Login Class for Authorization through External AAA
  scoring: scored
  profile:
  - Level 2
  description: External AAA servers should be utilized to provide Authorization via a single "Remote" template account.
  rationale: 'JUNOS routers ship with 4 Predefined Login Classes for user Authorization, these are:  super-user  read-only
     operator  unauthorized These classes provide basic Authorization, restricting what users in each class can or cannot
    do, to allow organizations to get a router up and running, but do not provide fine grained control needed by all but very
    smallest organizations. The built in classes also do not meet the other recommendations in this section. For example,
    the super-user class (which is the only built in class with read/write permissions) also has permission to start a Unix
    Shell and does not have an Idle Session Timeout. Because of these limitations it is recommended that Custom Login Classes
    be defined following the principle of least privilege, where each class of users is granted only those permissions needed
    to complete their job role. However, defining and maintaining Custom Login Classes locally on each router, switch, firewall
    or other network device can quickly become difficult and error prone in a larger environment. For larger networks JUNOS
    provides for extremely fine grained access control rules to be defined on an External AAA server running either RADIUS
    or TACACS+ through the use of Vendor Specific Attributes which map to the same permissions that can be set locally for
    a class. 267 | P a g e Vendor Specific Attributes (or VSAs) are standards based extensions to the RADIUS and TACACS+ protocols
    and are supported on most implementations by defining an appropriate dictionary. When performing Authorization using External
    RADIUS or TACACS+ services, it is recommended that a single "remote" user is configured on the device and mapped to a
    "remote" class with minimal permissions set. The user should be named "remote" where possible, as this name is reserved
    by JUNOS as the account to which users are mapped when authenticated through External AAA and for whom the Juniper-Local-User-Name
    VSA is not set. When a user is authenticated by RADIUS or TACACS+ the server can return a number of VSAs including: 
    Juniper-Local-User-Name - Maps the user to a local user "template account", if this is not specified the single "remote"
    user account is used.  Juniper-User-Permissions - Allows the server to set the same permissions as would be set in a
    login class locally. These permission are added to those of the remote user''s configured class.  Juniper-Allow-Commands
    - Uses an Extended Regular Expression to grant Operational Mode commands in addition to those allowed by the user''s class.
     Juniper-Deny-Commands - Uses an Extended Regular Expression to deny Operational Mode commands which would otherwise
    be allowed by the user''s class.  Juniper-Allow-Configuration - As with the Allow Commands, but to grant Configuration
    Mode commands not normally allowed by the user''s class.  Juniper-Deny-Configuration - As with Deny Commands, but to
    deny Configuration Mode commands which would otherwise be allowed by the user''s class. NOTE - This is not a complete
    list of all attributes and uses the RADIUS VSA naming convention. Equivalent TACACS+ VSAs match the above but with slightly
    different naming. By combining the use of the above VSAs from either a RADIUS or TACACS+ server, it is possible to define
    granular access control equivalent to that which can be set using locally configured Login Classes, but without the need
    to configure and maintain consistent, granular AAA policy across all devices. Where devices are primarily managed via
    Software Defined Networking or other centralized management and/or automation platforms rather than through the CLI or
    other local interfaces, then this may be sufficient to meet requirements for centralized AAA and/or allow for effective
    management of local template accounts without using external AAA.'
  impact: 268 | P a g e Careful configuration of permissions following the least privilege principle is essential for secure
    and reliable management of the network. When configuring remote AAA, it is recommended that a local Emergency Access Account
    also be configured to allow management of the device in the event that AAA services are unavailable.
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/informationproducts/pathway-pages/system-basics/user-access.html
  - 2. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  page_start: 267
  audit_raw: 'From the command prompt, execute the following commands:

    Firstly, confirm that no users (apart from any Emergency Access Account) use any of the

    predefined login classes.

    [edit]

    user@host#show system login | find "user .* {" | match "class" | match

    "superuser|super-user|read-only|operator|unauthorized" | count

    The above command should return zero where no Emergency Access Account has been

    configured or 1 where an Emergency Access Account is used.

    Then confirm that the remote user account is defined:

    [edit]

    user@host#show system login user remote

    The above command should return the configured class, UID and other options for the

    remote user.'
  remediation: "To create a new class you can issue the following commands from the [edit system\nlogin] hierarchy. In this\
    \ example, we create a new class named 'remote', granting only\nview permissions, and assign the remote user to the new\
    \ class. More detailed permissions\nwill be added to these permissions\n[edit system login]\nuser@host#set class remote\
    \ permissions [ view ]\n(this class should also have Idle timeouts and other options set in line with other\nrecommendations\
    \ in this section).\nTo change the class for a user account, use the following command under the [edit system\nlogin]\
    \ hierarchy:\n[edit system login]\nuser@host#set user remote class remote\n269 | P a g e\nA full discussion of RADIUS\
    \ or TACACS+ configuration and options is beyond the scope of\nthis guide, but a simple example of using a TACACS.net\
    \ server running on Windows with\nAD integration for a remote user is shown below.\nThis example is taken from an anonymized\
    \ real world deployment, so also includes\nsections to allow access to different groups of TACACS+ Clients and permissions\
    \ for Cisco\nIOS and Netscreen devices. The most relevant section is the <Service> for service=junosexec, where the VSAs\
    \ for TACACS+ Clients running JUNOS are defined, but the entire\nAuthorization for this Class is given for context.\n\
    <Authorization>\n<!--CIS Example remote user Authorization from TACACS.net Authorization.xml--\n>\n <UserGroups>\n <!--\
    \ The UserGroup is defined elsewhere - in this case it maps to an\nActive Directory Group call GRP-NETOPS -->\n <UserGroup>GRP-NETOPS</UserGroup>\n\
    \ </UserGroups>\n <ClientGroups>\n <!--Defines the Groups of devices this usergroup can login to -->\n <ClientGroup>CORE-NET</ClientGroup>\n\
    \ <ClientGroup>ACCESS-NET</ClientGroup>\n <ClientGroup>FIREWALLS</ClientGroup>\n </ClientGroups>\n <Shell>\n <!--note\
    \ that the login and exit commands are always permitted. (used\nfor Cisco and Netscreen devices) -->\n <Permit>show.*</Permit>\n\
    \ <Permit>terminal.*</Permit>\n <Permit>get.*</Permit>\n <Deny>.*</Deny>\n </Shell>\n <Services>\n <Service>\n <!-- JUNOS\
    \ VSAs to set additional user permissions -->\n <Set>service=junos-exec</Set>\n <Set>local-user-name=remote</Set> <!--This\
    \ will be\nmapped to a template user on JUNOS devices with \"remote\" class permissions --\n>\n <Set>allow-commands=show.*</Set>\
    \ <!-- Additional\npermission (above remote class set above) to allow all \"show\" operational\ncommands -->\n <Set>user-permissions=view-configuration</Set>\
    \ <!--\nGrants additional permission to view the full config (no secrets)-->\n <Set>user-permissions=network</Set> <!--\
    \ Grants access\nto the network for SSH, Ping, etc -->\n </Service>\n </Services>\n <AutoExec>\n <!--Set the Priv lvl\
    \ to 15 for Cisco devices, ignored by JUNOS\ndevices -->\n <Set>priv-lvl=15</Set>\n </AutoExec>\n</Authorization>\n270\
    \ | P a g e"
  checks:
  - type: sql
    command: show system login | find "user .* {" | match "class" | match
    severity: medium
    info: 'From the command prompt, execute the following commands:

      Firstly, confirm that no users (apart from any Emergency Access Account) use any of the

      predefined login classes.

      [edit]

      user@host#show system login | find "user .* {" | match "class" | match

      "superuser|super-user|read-only|operator|unauthorized" | count

      The above command should return zero where no Emergency Access Account has been

