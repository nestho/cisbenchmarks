- id: '2.2'
  title: Ensure "Protect RE" Firewall Filter includes explicit terms for all Management Services
  scoring: manual
  profile:
  - Level 2
  description: The Firewall Filter used to protect the Junos Device should include explicit terms for all Management, Automation
    and Monitoring Services used
  rationale: 'Junos supports a wide range of Management, Monitoring and Automation Services, making it an extremely flexible
    and adaptable platform. However, as with any computer system, the more services that are offered and the more hosts to
    which they are available, the wider attack surface is offered to a potential attacker. Because Management Services provide
    users the ability to remotely configure, monitor or otherwise control the Junos Device, it is important to restrict access
    to just trusted hosts for each individual service. Examples of Junos Management Services include (but are not limited
    to):  Telnet (which should not be used, as described elsewhere)  SSH (a secure alternative to Telnet)  JWeb GUI (a
    web based interface over HTTP or HTTPS)  SNMP (Simple Network Management Protocol, typically used for monitoring)  NETCONF
    (an XML-RPC based automation standard)  gRPC (a Remote Procedure Call based automation interface)  REST API (an HTTP/S
    based automation interface)  DMI (Device Management Interface - used by Network Management Systems, including Junos Space)
    Unused services should ideally not be running at all - for example, if you do not use the JWeb GUI to manage your device,
    the service should be disabled under the [edit system services] configuration hierarchy as described elsewhere in this
    Benchmark. Service''s which are in use to manage your network should be appropriately secured using recommendations elsewhere
    in this Benchmark and have access restricted to trusted hosts for that service, using explicit terms in the "Protect RE"
    Firewall Filter discussed in 41 | P a g e Recommendation 2.1 Ensure "Protect RE" Firewall Filter is set for inbound traffic
    to the Routing Engine. A full discussion of Firewall Filter design and evaluation is beyond the scope of this Benchmark,
    but is covered in more detail in Chapter 4 of the Juniper DayOne book Hardening Junos Devices 2nd Edition, available for
    free from the Juniper DayOne Tech Libary.'
  impact: Firewall Filters should be carefully tested before implementation on production systems as incorrect configuration
    may prevent normal services functioning. It is strongly recommended that changes to Firewall Filters are applied using
    commit confirmed so that changes will be automatically rolled back should they prevent the administrator from connecting
    to the Junos Device.
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Section 4.4.1 (page 55), National
  - 2. [Firewall Filter Overview, JUNOS Software Policy Framework Configuration Guide,
  - https://www.oreilly.com/library/view/junos-cookbook/0596100140/
  page_start: 41
  audit_raw: "Due to the range of options available for Management Service selection, management\nsubnets and filter design,\
    \ it is not possible to automatically score this recommendation.\n\"Protect RE\" Firewall Filters should be set for ingress\
    \ traffic on all Loopback interfaces as\ndiscussed in Recommendation 2.1 Ensure \"Protect RE\" Firewall Filter is set\
    \ for inbound\ntraffic to the Routing Engine for IPv4 (inet) and IPv6 (inet6) as necessary.\nYou can confirm what filters\
    \ are applied to all your Loopback interfaces issuing the\nfollowing command from the [edit] hierarchy:\n[edit]\nshow\
    \ interfaces lo0 | display set | match filter\nYou can view the details of the configured filter/s using the following\
    \ command:\n[edit]\nshow firewall family <inet/inet6> filter <filter-name>\nIn the example below, the filter CIS-Example-IPv4\
    \ is configured as the input filter for the\ninet address family (IPv4).\nThis example filter allows SSH and and HTTPS\
    \ (JWeb) traffic from a prefix-list named\nmanagement-hosts (which is configured under the [edit policy-options] hierarchy\
    \ and\nshown at the end of the example).\n[edit]\nmwhite@SRX1# show interfaces lo0 | display set | match filter\nset interfaces\
    \ lo0 unit 0 family inet filter input CIS-Example-IPv4\n42 | P a g e\n[edit]\nmwhite@SRX1#show firewall family inet filter\
    \ CIS-Example-IPv4\nterm AcceptSSH {\n from {\n source-prefix-list {\n management-hosts;\n }\n destination-port ssh;\n\
    \ }\n then {\n count SSH-Allowed;\n log;\n syslog;\n accept;\n }\n}\nterm AcceptHTTPS {\n from {\n source-prefix-list\
    \ {\n management-hosts;\n }\n destination-port https;\n }\n then {\n count HTTPS-Allowed;\n log;\n syslog;\n accept;\n\
    \ }\n}\nterm AcceptSNMP {\n from {\n source-prefix-list {\n snmp-servers;\n }\n destination-port snmp;\n }\n then {\n\
    \ count SNMP-Poll-Allowed;\n accept;\n }\n}\nNote - The example filter above not complete and may not be suitable for\
    \ all environments -\nall other traffic to the Junos Device will be discarded.\nYour filters should include terms for\
    \ all of the Management, Monitoring and Automation\nservices, as well as any Routing Protocols or other services such\
    \ as IPSEC or BFD in use in\nyour network.\nThe use of `prefix-list' entries for the source addresses is not required,\
    \ but is highly\nrecommended as it makes filters clearer and ongoing management much simpler.\nThe lists used in the example\
    \ can be viewed by issuing the following command from the\n[edit] hierarchy:\n43 | P a g e\n[edit]\nmwhite@SRX1# show\
    \ policy-options | find prefix-list\nprefix-list management-hosts {\n 172.16.10.0/24;\n 192.168.17.0/24;\n}\nprefix-list\
    \ snmp-servers {\n apply-path \"snmp community <*> clients <*>\";\n}"
  remediation: 'A full discussion of Firewall Filters is beyond the scope of this Benchmark.

    It is important to ensure that Firewall Filters include terms to match and accept all of your

    required Routing Protocols, Management Services and any other services used on your

    Junos Device. As noted elsewhere, it is strongly recommended that changes to Firewall

    Filters applied to the Loopback interface always be applied using commit confirmed so that

    the change will be automatically rolled back should the administrator lose connection after

    committing the change.

    To create a IPv4 firewall filter enter the following command from the [edit firewall]

    hierarchy.

    [edit firewall]

    user@host#edit family inet

    [edit firewall family inet]

    user@host#edit filter <filter name>

    [edit firewall family inet filter <filter name>]

    user@host#edit term <term name>

    [edit firewall family inet filter <filter name> term <term name>]

    user@host#set from <match conditions>

    user@host#set then <action>

    An IPv6 firewall filter, if required, can be configured under the family inet6 from the same

    hierarchy.

    Once a suitable filter has been configured, it must be applied to the Loopback interface,

    using the following command from the [edit] hierarchy:

    [edit]

    user@host#set interface lo0 unit 0 family inet filter input <filter name>

    If additional Loopback Interface Units are configured (in other Routing Instances), the filter

    should also be applied to these.

    If IPv6 filters are also required, the same command is used but applying to family inet6.

    To configure the CIS-Example-IPv4 shown previously in the Audit Procedure, we opted to

    first configure a prefix-list each for our management-hosts and snmp-servers using the

    following commands from the [edit policy-options] heirachy:

    44 | P a g e

    [edit policy-options]

    mwhite@SRX1# set prefix-list management-hosts 172.16.10.0/24

    mwhite@SRX1# set prefix-list management-hosts 192.168.17.0/24

    mwhite@SRX1# set prefix-list snmp-servers apply-path "snmp community <*>

    clients <*>"

    The management-hosts prefix-list is a manual list of IP subnets which can be used in

    multiple policies or terms. If we add or remote IPs on the list, it will cause all of the terms to

    be updated, rather than having to manually update our management hosts in multiple

    locations.

    The snmp-servers prefix-list used an apply-path to return all configured SNMP Clients

    (the Network Management Servers (NMS) which will be permitted to poll this Junos Device

    using Simple Network Management Protocol) from elsewhere in the configuration. The

    same technique can be used to create a list of all configured NTP Servers, BGP Peers and so

    on. Lists created using an apply-path will automatically update when the source does, so if

    we add a new SNMP Client, the prefix-list updated automatically.

    We then created an IPv4 firewall filter from the [edit firewall] hierarchy:

    [edit firewall]

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AccpetSSH from

    source-prefix-list management-hosts

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AccpetSSH from

    destination-port ssh

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AccpetSSH then

    count SSH-Allowed

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AccpetSSH then log

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AccpetSSH then

    syslog

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AccpetSSH then

    accept

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AcceptHTTPS from

    source-prefix-list management-hosts

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AcceptHTTPS from

    destination-port https

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AcceptHTTPS then

    count HTTPS-Allowed

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AcceptHTTPS then

    log

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AcceptHTTPS then

    syslog

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AcceptHTTPS then

    accept

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AcceptSNMP from

    source-prefix-list snmp-servers

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AcceptSNMP from

    destination-port snmp

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AcceptSNMP then

    count SNMP-Poll-Allowed

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AcceptSNMP then

    accept

    45 | P a g e

    The first two terms AcceptSSH and AcceptHTTPS accept SSH and HTTPS traffic respectively

    from any host listed in the the management-hosts prefix-list. Traffic matching these terms is

    also logged and separate counters incremented each time the term is hit.

    Term 3, AcceptSNMP accepts SNMP Polling from SNMP Clients (SNMP Servers) which were

    automatically added to the snmp-servers prefix-list. As polling could be frequent, no

    logging is used, but a counter is incremented.

    The filter can now be applied to the Loopback interface, using the following command from

    the [edit interfaces] hierarchy:

    [edit interfaces]

    mwhite@SRX1# set unit 0 family inet filter input CIS-Example-IPv4

    Note - The example filter above not complete and may not be suitable for all environments -

    all other traffic to the Junos Device will be discarded.

    Your filters should include terms for all of the Management, Monitoring and Automation

    services, as well as any Routing Protocols or other services such as IPSEC or BFD in use in

    your network.'
  checks:
  - type: sql
    command: show interfaces lo0 | display set | match filter
    severity: medium
    info: 'Due to the range of options available for Management Service selection, management

      subnets and filter design, it is not possible to automatically score this recommendation.

      "Protect RE" Firewall Filters should be set for ingress traffic on all Loopback interfaces as

      discussed in Recommendation 2.1 Ensure "Protect RE" Firewall Filter is set for inbound

      traffic to the Routing Engine for IPv4 (inet) '
- id: '2.3'
  title: Ensure "Protect RE" Firewall filter includes Rate-Limiting for Management Services terms
  scoring: manual
  profile:
  - Level 2
  description: Policers should be applied to Management Services
  rationale: Junos supports a wide range of Management, Monitoring and Automation Services, making it an extremely flexible
    and adaptable platform. However, as with any computer system, the more services that are offered and the more hosts to
    which they are available, the wider attack surface is offered to a potential attacker. An attacker, or a misconfigured
    or failing management server, might flood a service on the Junos device with excessive traffic in a Denial of Service
    (or DoS) attack; resulting in increased load and potentially even a failure of the service or targeted device. To prevent
    this Rate-limiting can be applied to the Firewall Filter Terms already configured for Management Services in Recommendation
    2.1 - Ensure "Protect RE" Firewall Filter includes explicit terms for all Management Services by configuring a policer
    as appropriate for the service. In some environments, it may also be appropriate to configure policers for Routing Protocols
    or other Services, although this is less common practice and can lead to unstable network conditions without careful design
    and testing. A full discussion of how Rate-limiting is configured and implemented in Junos, and across different specific
    chipsets and platforms, is beyond the scope of this Benchmark. The Junos DayOne books Deploying Basic QoS and Hardening
    Junos Devices, 2nd Edition are available for Free from the Juniper website and provide excellent coverage of QoS/CoS techniques
    and the application of Rate-limiting to Firewall Filters respectively. 48 | P a g e
  impact: Firewall Filters should be carefully tested before implementation on production systems as incorrect configuration
    may prevent normal services functioning. It is strongly recommended that changes to Firewall Filters are applied using
    commit confirmed so that changes will be automatically rolled back should they prevent the administrator from connecting
    to the Junos Device.
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/topics/concept/policeroverview.html
  - 2. [Firewall Filter Overview, JUNOS Software Policy Framework Configuration Guide,
  page_start: 48
  audit_raw: "Due to the range of options available for Management Service selection, management\nsubnets and filter design,\
    \ it is not possible to automatically score this recommendation.\n\"Protect RE\" Firewall Filters should be set for ingress\
    \ traffic on all Loopback interfaces as\ndiscussed in Recommendation 2.1 Ensure \"Protect RE\" Firewall Filter is set\
    \ for inbound\ntraffic to the Routing Engine for IPv4 (inet) and IPv6 (inet6) as necessary.\nYou can confirm what filters\
    \ are applied to all your Loopback interfaces issuing the\nfollowing command from the [edit] hierarchy:\n[edit]\nshow\
    \ interfaces lo0 | display set | match filter\nYou can view the details of the configured filter/s using the following\
    \ command:\n[edit]\nshow firewall family <inet/inet6> filter <filter-name>\nIn the example below, the filter CIS-Example-IPv4\
    \ is configured as the input filter for the\ninet address family (IPv4) used in Recommendation 2.2 Ensure \"Protect RE\"\
    \ Firewall\nFilter includes explicit terms for all Management Services has been updated to apply a Rate\nLimit of 10Mb/s\
    \ to SSH and HTTPS traffic, leaving sufficient capacity to allow Junos images\nor other files to be transferred but protecting\
    \ from DoS attacks. A separate 1Mb/s limit has\nbeen applied to SNMP Polling.\n[edit]\nmwhite@SRX1# show interfaces lo0\
    \ | display set | match filter\nset interfaces lo0 unit 0 family inet filter input CIS-Example-IPv4\n[edit]\nmwhite@SRX1#show\
    \ firewall family inet filter CIS-Example-IPv4\nterm AcceptSSH {\n from {\n source-prefix-list {\n management-hosts;\n\
    \ }\n destination-port ssh;\n }\n49 | P a g e\n then {\n policer limit-10m;\n count SSH-Allowed;\n log;\n syslog;\n accept;\n\
    \ }\n}\nterm AcceptHTTPS {\n from {\n source-prefix-list {\n management-hosts;\n }\n destination-port https;\n }\n then\
    \ {\n policer limit-10m;\n count HTTPS-Allowed;\n log;\n syslog;\n accept;\n }\n}\nterm AcceptSNMP {\n from {\n source-prefix-list\
    \ {\n snmp-servers;\n }\n destination-port snmp;\n }\n then {\n policer limit-1m;\n count SNMP-Poll-Allowed;\n accept;\n\
    \ }\n}\nNote - The example filter above not complete and may not be suitable for all environments -\nall other traffic\
    \ to the Junos Device will be discarded. Those Policers can be viewed using the\nfollowing command from the [edit] hierarchy:\n\
    [edit]\nmwhite@SRX1# show firewall policer limit-10m\nif-exceeding {\n bandwidth-limit 10m;\n burst-size-limit 625k;\n\
    }\nthen discard;\n[edit]\nmwhite@aSRX1# show firewall policer limit-1m\nif-exceeding {\n bandwidth-limit 1m;\n burst-size-limit\
    \ 15k;\n50 | P a g e\n}\nthen discard;"
  remediation: 'A full discussion of Firewall Filters is beyond the scope of this Benchmark.

    It is important to ensure that Firewall Filters include terms to match and accept all of your

    required Routing Protocols, Management Services and any other services used on your

    Junos Device. As noted elsewhere, it is strongly recommended that changes to Firewall

    Filters applied to the Loopback interface always be applied using commit confirmed so that

    the change will be automatically rolled back should the administrator lose connection after

    committing the change.

    In this example we will add Rate-Limiting to the Management Services terms configured in

    Recommendation 2.2 Ensure "Protect RE" Firewall Filter includes explicit terms for all

    Management Services Draft using the following commands from the [edit firewall]

    hierarchy:

    First we need to create the two ''policer'' definitions, which can be re-used in multiple terms

    of filters.

    [edit firewall]

    mwhite@SRX1# set policer limit-10m if-exceeding bandwidth-limit 10m

    mwhite@SRX1# set policer limit-10m if-exceeding burst-size-limit 625k

    mwhite@SRX1# set policer limit-10m then discard

    mwhite@SRX1# set policer limit-1m if-exceeding bandwidth-limit 1m

    mwhite@SRX1# set policer limit-1m if-exceeding burst-size-limit 15k

    mwhite@SRX1# set policer limit-1m then discard

    These policers set a bandwidth-limit of 10Mb/s and 1Mb/s respectively, with an

    appropriate burst-size set on each proportional to the configured limit to allow bursts to

    briefly exceed the limit and smooth the impact of the policer on the service.

    The limit-10m policer is then applied to both the AcceptSSH and AcceptHTTPS terms in the

    CIS-Example-IPv4 configured previously. The policer applies separately for each term, so

    SSH and HTTPS can receive 10Mb/s of traffic each, not a combined 10Mb/s between them.

    [edit firewall]

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AcceptSSH then

    policer limit-10m

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AcceptHTTPS then

    policer limit-10m

    Finally, we apply the lower ''limit-1m'' 1Mb/s policer to the existing AcceptSNMP term:

    [edit firewall]

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AcceptSNMP then

    policer limit-1m

    51 | P a g e

    If it is not already, the filter can now be applied to the Loopback interface, using the

    following command from the [edit interfaces] hierarchy:

    [edit interfaces]

    mwhite@SRX1# set unit 0 family inet filter input CIS-Example-IPv4

    Note - The example filter above not complete and may not be suitable for all environments -

    all other traffic to the Junos Device will be discarded.

    Your filters should include terms for all of the Management, Monitoring and Automation

    services, as well as any Routing Protocols or other services such as IPSEC or BFD in use in

    your network.'
  checks:
  - type: sql
    command: show interfaces lo0 | display set | match filter
    severity: medium
    info: 'Due to the range of options available for Management Service selection, management

      subnets and filter design, it is not possible to automatically score this recommendation.

      "Protect RE" Firewall Filters should be set for ingress traffic on all Loopback interfaces as

      discussed in Recommendation 2.1 Ensure "Protect RE" Firewall Filter is set for inbound

      traffic to the Routing Engine for IPv4 (inet) '
