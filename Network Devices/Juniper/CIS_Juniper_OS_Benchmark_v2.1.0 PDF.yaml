- id: 6.7.7
  title: Ensure Strong Authentication Methods are used for NTP Authentication
  scoring: scored
  profile:
  - Level 2
  description: Strong authentication methods should be set for NTP Servers
  rationale: Having established the need for NTP, it is essential to ensure that the devices time is not manipulated by an
    attacker as this could allow DoS to services relying on accurate time as well as replay attacks and other malicious activity.
    NTP Version 3 introduced Authentication mechanisms for NTP messages using a Keyed Hash based Message Authentication Check
    (HMAC), where a hash of the message ensures both that the message is authentic and that it was not changed in transit.
    All JUNOS platforms support HMAC with NTP Versions 3 and 4 using MD5 and some platforms also support the more robust SHA1
    and SHA2-256 algorithms. Message Digest 5 (MD5) is an older hashing mechanism dating back to the early 90's. Since 2004
    an increasing number of collision vulnerabilities have been shown in MD5 and the algorithm is no longer considered suitable
    for authentication and integrity protection of sensitive material or X.509 certificates. While not supported across all
    devices, most JUNOS devices now support use of SHA1 and SHA2-256 HMAC for NTP message authentication. This feature is
    documented through Juniper Feature Explorer as Enhancement to NTP authentication method and is supported on most Junos
    devices from Junos OS 18.2R1 onward (though individual platform support varies). Like MD5, SHA1 is now considered deprecated
    due to the risk of collisions. As a result, in high security environments it is recommended that SHA2-256 be used for
    authentication of all NTP Servers or Peers (where this Junos device itself is acting as an NTP Server). NOTE - Both the
    keys and the algorithm must match on all NTP peers being configured. 306 | P a g e
  impact: If keys or algorithms do not match on NTP Servers and Client devices NTP will not be able to update and this could
    impact Logging, Authentication, Encryption/VPN or other services which rely on consistent time.
