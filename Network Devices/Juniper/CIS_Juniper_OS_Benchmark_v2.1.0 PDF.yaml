- id: 6.12.1
  title: Ensure External SYSLOG Host is Set with Any Facility and Informational Severity
  scoring: scored
  profile:
  - Level 1
  description: Logging data must be sent to at least one external SYSLOG server.
  rationale: 'Log information from a JUNOS Device can be vital in detecting an attack and to allow incidents to be analyzed,
    investigated and (where appropriate) prosecuted. SYSLOG information is also helpful in diagnosing and resolving non-security
    related operational issues on the network. Because of this, one of the first tasks an attacker will attempt to accomplish
    after gaining access to a Network Device is to alter or delete logs to cover their tracks. To prevent an attacker or a
    fault denying you access to log data, it is vital to send logs to at least one External Logging and/or SIEM (Security
    Incident and Event Manager) Server. JUNOS Devices use the industry standard SYSLOG protocol for this. SYSLOG entries are
    generated by a range of sources on a JUNOS Device, such as authorization which reports Authentication and Authorization
    events or PFE for events encountered by the Packet Forwarding Engine. Each of these sources are referred to as a Facility.
    In addition to indicating what facility generated a log message, JUNOS SYSLOG also indicates and allows the administrator
    to filter based on the Severity Level for each message. There are eight possible levels, which are as follows:  Emergency
    (0)  Alert (1)  Critical (2)  Error (3)  Warning (4)  Notice (5)  Informational (6)  Any (7) (called Debug on many
    SYSLOG systems) 450 | P a g e Each increase in level represents an increase in the detail and number of log messages created.
    Each level includes the messages from all preceding levels, so Critical includes all messages from both the Alert and
    Emergency levels. To ensure that vital messages about the Health and Security of the JUNOS Device are not missed, or lost
    should an attacker delete local logs, at least one External SYSLOG or SIEM Server should be configured to receive log
    messages from any Facility and at least info Severity.'
  impact: Network Devices, particularly Firewalls, can generate a significant volumes of log data, it is essential that the
    target SYSLOG server is suitably resourced to handle the expected volume of messages and it is strongly recommended that
    robust archiving and retention processes be employed.
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Page 130, National Security
  - 2. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  page_start: 450
  audit_raw: 'From the command prompt, execute the following command from the [edit system

    syslog] hierarchy:

    [edit system syslog]

    user@host# show | display set | match "host .* any [any|info]" | except

    "other-routing-engine|scc|sfc0" | count

    The above command should return a line count equal to or greater than 1, which is the

    number of configured External SYSLOG Hosts set with the required Facility and Severity.'
  remediation: 'SYSLOG data is recorded locally by default, you can configure external SYSLOG servers by

    issuing the following command from the [edit system syslog] hierarchy;

    [edit system syslog]

    user@host#set host <Server> any <Severity>

    Where:

     <Server> is the IP Address or Fully Qualified Domain Name of the Remote Syslog

    Server

     <Severity> should be either any or info

    Some SYSLOG or SIEM Servers may require additional configuration items such as

    explicit-priority or structured-data options to be configured.

    It is possible to filter SYSLOG messages to be forwarded to the host using a match or match-

    451 | P a g e

    string condition. This should not be set for the device''s the Remote SYSLOG Host/s

    configured in meeting this Recommendation.'
  checks:
  - type: manual_review
    info: 'From the command prompt, execute the following command from the [edit system

      syslog] hierarchy:

      [edit system syslog]

      user@host# show | display set | match "host .* any [any|info]" | except

      "other-routing-engine|scc|sfc0" | count

      The above command should return a line count equal to or greater than 1, which is the

      number of configured External SYSLOG Hosts set with the required Facility and Severity.'
    severity: medium
- id: 6.12.2
  title: Ensure At Least 2 External SYSLOG Hosts are Set with Any/Info
  scoring: scored
  profile:
  - Level 2
  description: Logging data must be sent to at least two external SYSLOG servers.
  rationale: 'Log information from a JUNOS Device can be vital in detecting an attack and to allow incidents to be analyzed,
    investigated and (where appropriate) prosecuted. SYSLOG information is also helpful in diagnosing and resolving non-security
    related operational issues on the network. Because of this, one of the first tasks an attacker will attempt to accomplish
    after gaining access to a Network Device is to alter or delete logs to cover their tracks. To prevent an attacker or a
    fault denying you access to log data, it is vital to send logs to at least one External Logging and/or SIEM (Security
    Incident and Event Manager) Server. JUNOS Devices use the industry standard SYSLOG protocol for this. SYSLOG entries are
    generated by a range of sources on a JUNOS Device, such as authorization which reports Authentication and Authorization
    events or PFE for events encountered by the Packet Forwarding Engine. Each of these sources are referred to as a Facility.
    In addition to indicating what facility generated a log message, JUNOS SYSLOG also indicates and allows the administrator
    to filter based on the Severity Level for each message. There are eight possible levels, which are as follows:  Emergency
    (0)  Alert (1)  Critical (2)  Error (3)  Warning (4)  Notice (5)  Informational (6)  Any (7) (called Debug on many
    SYSLOG systems) 453 | P a g e Each increase in level represents an increase in the detail and number of log messages created.
    Each level includes the messages from all preceding levels, so Critical includes all messages from both the Alert and
    Emergency levels. To ensure that vital messages about the Health and Security of the JUNOS Device are not missed, or lost
    should an attacker delete local logs, at least two External SYSLOG or SIEM Servers should be configured to receive log
    messages from any Facility and at least info Severity. SYSLOG messages are sent in a "fire and forget" manner over UDP,
    with no acknowledgement or ability to resend missed messages in the event a server is unable to handle them. Adding a
    second server significantly reduces the risk that messages are lost in the event of a network or server issue.'
  impact: Network Devices, particularly Firewalls, can generate a significant volumes of log data, it is essential that the
    target SYSLOG servers are suitably resourced to handle the expected volume of messages and it is strongly recommended
    that robust archiving and retention processes be employed.
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Page 130, National Security
  - 2. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  page_start: 453
  audit_raw: 'From the command prompt, execute the following command from the [edit system

    syslog] hierarchy:

    [edit system syslog]

    user@host# show | display set | match "host .* any [any|info]" | except

    "other-routing-engine|scc|sfc0" | count

    The above command should return a line count equal to or greater than 2, which is the

    number of configured External SYSLOG Hosts set with the required Facility and Severity.'
  remediation: 'SYSLOG data is recorded locally by default, you can configure external SYSLOG servers by

    issuing the following commands from the [edit system syslog] hierarchy;

    [edit system syslog]

    user@host# set host <Server 1> any <Severity>

    [edit system syslog]

    user@host# set host <Server 2> any <Severity>

    454 | P a g e

    Where:

     <Server 1> is the IP Address or Fully Qualified Domain Name of the first Remote

    SYSLOG or SIEM Server

     <Server 2> is the IP Address or FQDN of a separate second Remote SYSLOG or SIEM

    Server. For added resilience, you may wish to place the second server on a different

    network to the first and this is recommended where possible.

     <Severity> should be either any or info

    Some SYSLOG or SIEM Servers may require additional configuration items such as

    explicit-priority or structured-data options to be configured.

    It is possible to filter SYSLOG messages to be forwarded to the host using a match or matchstring condition. This should
    not be set for the device''s the Remote SYSLOG Hosts

    configured in meeting this Recommendation.'
  checks:
  - type: manual_review
    info: 'From the command prompt, execute the following command from the [edit system

      syslog] hierarchy:

      [edit system syslog]

      user@host# show | display set | match "host .* any [any|info]" | except

      "other-routing-engine|scc|sfc0" | count

      The above command should return a line count equal to or greater than 2, which is the

      number of configured External SYSLOG Hosts set with the required Facility and Severity.'
    severity: medium
- id: 6.12.3
  title: Ensure Local Logging is Set for Firewall Events
  scoring: scored
  profile:
  - Level 1
  description: Logging data for Firewall Events should be saved to a local file.
  rationale: The JUNOS Device's built in Firewall (configured under [edit firewall] and discussed in more detail elsewhere
    in this Benchmark) can be the first line of defense, so the logging it produces can be vital in responding to a security
    incident as well as a useful tool for diagnosing faults relating to the Firewall. A local SYSLOG file should be configured
    to record all firewall related events.
  impact: Logging of Firewall events may record a large volume of messages. You may wish to specify the size of files to be
    recorded, the number of zipped older files the JUNOS Devices should keep and automatic archiving settings to appropriate
    values for the device and environment you are using. Details of the related commands are linked in the References section.
  references:
