- id: '6.20'
  title: Ensure Default Address Selection is Set
  scoring: scored
  profile:
  - Level 2
  description: The primary address configured on the loopback should be used as the source in all JUNOS generated packets.
  rationale: To ensure a consistent source address for traffic from the JUNOS Device, the Loopback address should be configured
    as the default source address for traffic generated by the Routing Engine. By default the primary address on the Routed
    or Management Interface from which the traffic will be sent will be used. When configured, packets for NTP, SNMP Traps,
    SSH, SYSLOG and other protocols initiated by the router will all use the Loopback address for the packets source unless
    explicitly configured to use a different address at a more specific hierarchy. This predictable source address makes it
    easier to configure strict Firewall filters on neighboring network devices.
  impact: The Primary Address configured on the device's loopback interface will be used as the source for all system generated
    traffic, unless a different address is specified elsewhere.
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Section 4.1.4 (page 58), National
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  page_start: 481
