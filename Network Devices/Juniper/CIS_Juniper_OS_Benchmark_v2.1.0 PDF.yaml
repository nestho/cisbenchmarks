- id: 6.11.3
  title: Ensure Console Port is Set to Disabled
  scoring: scored
  profile:
  - Level 2
  description: The JUNOS Device's Console Port should be disabled.
  rationale: Administrators often use Console Port on a JUNOS Device to configure the Device via the CLI when they have physical
    access to the device. In high security environments or deployments where the physical security of the JUNOS Device cannot
    be assured, such as CPE (Customer Premises Equipment), Point of Sales (POS) or Branch Office installations, disabling
    the console port will increase the difficulty of accessing the router for an attacker with physical access. Connecting
    to the console will not allow access to the CLI without restarting the JUNOS Device to access recovery options, an event
    which will show up in your monitoring and audit logs.
  impact: The JUNOS Device's CLI will no longer be accessible through the Console Port without rebooting the device.
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Page 58, National Security
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/task/configuration/
  page_start: 443
