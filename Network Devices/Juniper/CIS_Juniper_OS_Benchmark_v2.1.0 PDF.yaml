  remediation: 'To set a password for access to the PIC Console, issue the following command from the

    [edit system] hierarchy:

    487 | P a g e

    [edit system]

    user@host# set pic-console-authentication plain-text-password

    The JUNOS Device will prompt you to enter a new password, which must meet the

    complexity requirements configured under [edit system login], as shown below:

    [edit system]

