- id: 3.2.1
  title: Ensure VRRP authentication-key is set
  scoring: scored
  profile:
  - Level 2
  description: VRRP authentication should be used where other security mechanisms are not in place.
  rationale: VRRP provides resilience for a routers interfaces, allowing another router to act as backup in the event of a
    partial or complete failure of the primary router and increasing the availability network resources as well as resilience
    to DoS attack. Routers configured to share a Virtual IP Address using VRRP communicate their status to their peer on a
    regular basis using a multicast packet, allowing a Master for the VIP to be elected. It is the Master that deals with
    packets destined for the VIP address. If no authentication is used an attacker could potentially disrupt the VRRP Master
    Election process, causing neither router to handle packets destined for the VIP and resulting a DoS. An authentication
    key can be configured for all VRRP Groups used on the device to help protect against this.
