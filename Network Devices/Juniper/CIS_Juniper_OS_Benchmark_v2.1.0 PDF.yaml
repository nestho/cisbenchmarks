    severity: medium
- id: '6.21'
  title: Ensure ICMP Redirects are Disabled for IPv4
  scoring: scored
  profile:
  - Level 1
  description: The Routing Engine should not send ICMP Redirect Messages.
  rationale: ICMP Redirect Messages provide a method for a router to communicate routing information with a host and is intended
    for use when a router receives packets to forward to a destination to which the host should have a direct route. In a
    well designed, modern, network ICMP Redirects should not be needed or add any useful functionality. An attacker may abuse
    this feature to obtain topology information about a target network and potentially identify weaknesses for later exploitation
    or to target the router or hosts with a Denial of Service (DoS) or Man in the Middle (MITM) attacks. To prevent this abuse,
    ICMP Redirect message generation should be disabled globally where it is not required.
  impact: In some networks, for instances where subnets populated by hosts include multiple nonredundant gateways, removing
    redirects may result in traffic being doubled on some gateways interfaces as traffic is received and then forwarded on
    the same port.
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  - 2. http://www.cymru.com/gillsr/documents/icmp-redirects-are-bad.pdf
  page_start: 483
  audit_raw: 'From the [edit system] configuration hierarchy, issue the following command:

    [edit system]

    user@host# show | match "no-redirects;" | count

    The command should return a count of 1 line.'
  remediation: 'To disable ICMP redirects globally for IPv4, issue the following command from the [edit

    system] heirachy:

    483 | P a g e

    [edit system]

    user@host# set no-redirects'
  checks:
  - type: manual_review
    info: 'From the [edit system] configuration hierarchy, issue the following command:

      [edit system]

      user@host# show | match "no-redirects;" | count

      The command should return a count of 1 line.'
    severity: medium
