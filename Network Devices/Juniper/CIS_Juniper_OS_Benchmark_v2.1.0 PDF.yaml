- id: '5.5'
  title: Ensure SNMP Write Access is not set
  scoring: scored
  profile:
  - Level 2
  description: Do not allow Read-Write SNMP access.
  rationale: SNMP can be used to read and write configuration information from a router using your Network Management Systems;
    however the inherently insecure design of the older SNMP V1, V2 and V2C standards, which do not use encryption to protect
    community strings, make their use for setting configuration an open invitation to an attacker. Even the more recent SNMPv3,
    which introduces encryption, authentication and message integrity checking, does not provide support for centralized authentication,
    account lockout or other basic security measures applied to other methods to access the router. This leaves the router
    vulnerable to brute force attack. The use of UDP as the transport mechanism in SNMP also makes spoofing the source of
    an SNMP request far simpler, easing brute force or flooding attacks.
  impact: ''
  references:
