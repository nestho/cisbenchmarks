- id: 4.9.1
  title: Ensure Secure Neighbor Discovery is configured
  scoring: scored
  profile:
  - Level 2
  description: NDP should be protected.
  rationale: One of the primary functions of NDP is to resolve Network Layer (IP) addresses to Link Layer (eg Ethernet) addresses,
    a function performed in IPv4 by ARP. An attacker who has access to the broadcast segment may abuse NDP or ARP to trick
    hosts into sending the attacker traffic destined for someone else, a technique known as ARP Poisoning. To protect IPv6
    networks against this, and other attacks against NDP functions, Secure Neighbor Discovery (SEND) should be deployed where
    preventing access to the broadcast segment may not be possible or in sensitive environments with a requirement for increased
    protection. Support for SEND was added to JUNOS in version 9.3. SEND utilizes public/private RSA key pairs to produce
    Cryptographically Generated Addresses (as defined in RFC3972), which ensures that the claimed source of an NDP message
    is the owner of the claimed address.
  impact: ''
  references:
  - 1. Secure Neighbor Discovery Configuration Guidelines, JUNOS Software Routing
  page_start: 169
  audit_raw: 'Enter the following command from the [edit protocols] hierarchy:

    [edit]

    user@host#show neighbor-discovery secure | match cryptographic-address |

    count

    The above command should return a value of 2.'
  remediation: 'If you have deployed IPv6 you can configure SEND by issuing the following commands from

    the [edit protocols neighbor-discovery] hierarchy: If you have not already done so,

    you will need to generate or install an RSA key pair, to generate a new pair enter the

    following command:

    user@host>request pki generate-key-pair <name> <ca-profile>

    169 | P a g e

    Next, set the security level to define how unsecure NDP messages should be handled. If only

    a subset of devices will be configured to use SEND, then use the default option. If all nodes

    on the segment require protection, which is recommended, use the secure-messages-only

    option:

    [edit protocols neighbor-discovery]

    user@host#set secure security-level secure-messages-only

    Finally, specify the key pair and details you generated/installed earlier:

    [edit protocols neighbor-discovery]

    user@host#set secure cryptographic-address key-pair <name>

    user@host#set secure cryptographic-address key-length <length>

    For more details on configuring Public/Private Key Pairs in JUNOS please refer to:

    Generating a Public-Private Key Pair, JUNOS Software Security Configuration Guide, Juniper

    Networks'
  checks:
  - type: sql
    command: show neighbor-discovery secure | match cryptographic-address |
    severity: medium
    info: 'Enter the following command from the [edit protocols] hierarchy:

      [edit]

      user@host#show neighbor-discovery secure | match cryptographic-address |

      count

      The above command should return a value of 2.'
