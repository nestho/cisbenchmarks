    severity: medium
- id: '6.14'
  title: Ensure Configuration File Encryption is Set
  scoring: scored
  profile:
  - Level 2
  description: Configuration files should be encrypted.
  rationale: On many JUNOS platforms the configuration files are stored on a removal flash file system. A malicious user with
    even momentary physical access to the router could readily remove the flash card, gaining access to the device's configuration
    which is likely to contain extremely sensitive details. Exposure to this type of attack increased in Branch Office or
    Customer Premises Equipment (CPE) installations or where devices are transported by third parties post configuration.
    To prevent an attacker accessing the configuration files from flash, JUNOS Devices offer a facility to encrypt the /config
    and /var/db/config directories using AES or DES algorithms. Note - Export restrictions mean that AES is not available
    in all regions.
  impact: The configuration files will be encrypted on storage and the JUNOS Device will use the key stored in it's EEPROM
    to decrypt the configuration file at boot. Adding the unique option will cause the JUNOS Device to combine the device
    Serial Number with the entered key when creating the Encryption Key, meaning that the configuration can only be loaded
    by this JUNOS Device - even with the key being configured.
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/topics/topicmap/encrypting-and-decrypting.html
  page_start: 468
  audit_raw: 'To confirm whether Configuration File Encryption is enabled, execute the following

    command from the [edit system] hierarchy:

    [edit system]

    user@host#show match "encrypt-configuration-files" | count

    468 | P a g e

    The above command return a line count of 1, indicating that Encryption of Configuration

    Files is enabled.'
  remediation: 'To enable Configuration File Encryption, you must first set an encryption key by issuing the

    following command from Operational Mode:

    user@host>request system set-encryption-key

    You will be prompted to enter and then verify the key.

    The preferred encryption algorithm may be specified by adding the algorithm option, or

    left as default. If the device is running the US/Domestic version of JUNOS the default

    algorithm will be AES. Devices running the Export version of JUNOS will default to the

    weaker DES standard and cannot be configured to support AES.

    Optionally, the unique option may be specified. This will cause JUNOS to combine the

    device''s Serial Number as part of the Encryption Key, making the configuration unloadable

    on any other JUNOS device, even with the key set at the prompt.

    Once a key has been set the following command should be issued from the [edit system]

    hierarchy:

    [edit system]

    user@host# set encrypt-configuration-files

    The encryption will not be carried out until the configuration is committed.'
  checks:
  - type: sql
    command: show match "encrypt-configuration-files" | count
    severity: medium
    info: 'To confirm whether Configuration File Encryption is enabled, execute the following

      command from the [edit system] hierarchy:

      [edit system]

      user@host#show match "encrypt-configuration-files" | count

      468 | P a g e

      The above command return a line count of 1, indicating that Encryption of Configuration

      Files is enabled.'
- id: '6.15'
  title: Ensure Multicast Echo is Set to Disabled
  scoring: scored
  profile:
  - Level 2
  description: The Routing Engine should ignore Echo Requests sent to Multicast addresses.
  rationale: An attacker may use multicast Echo Requests (pings) during recognizance of a network to obtain a list of network
    systems and what services they may be offering. An example of this would be sending a ping to 224.0.0.18, hoping to discover
    routers in the network running VRRP. In most environments it is not necessary for the Routing Engine to respond to Multicast
    Echo Requests to function correctly; however in some cases this will be required, such as for troubleshooting in environments
    with Multicast Routing support. Only disable this functionality if you are certain you do not need it.
  impact: The JUNOD Device will not respond to ICMP Echo Requests (pings) sent to Multicast Addresses used by the device.
  references:
  - 1. https://juniper.net/documentation/en_US/junos/topics/reference/configurationstatement/no-multicast-echo-edit-system.html
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/task/configuration/
  page_start: 471
