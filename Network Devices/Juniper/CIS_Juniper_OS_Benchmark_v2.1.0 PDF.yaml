- id: 4.7.1
  title: Ensure authentication is set to MD5
  scoring: scored
  profile:
  - Level 1
  description: LDP peers should be authenticated.
  rationale: Where it is deployed, LDP is vital for normal operation of an MPLS network. LDP is used to determine Label mapping
    and populate the routers Forwarding Information Base (FIB). An attacker posing as one of the target routers LDP peers
    may attempt to inject incorrect label information or exploit a vulnerability in the routers LDP implementation to cause
    an information disclosure or denial of service. On Juniper routers (as well as routers from other manufacturers such as
    Cisco or Brocade) it is possible to authenticate LDP sessions using an MD5 digest of elements in LDP messages. LDP Session
    Authentication may be configured on a per session or per session-group basis. The Audit Procedure checks for both, however,
    the remediation procedure is only given for a session-group; as configuration at the session level is deprecated in current
