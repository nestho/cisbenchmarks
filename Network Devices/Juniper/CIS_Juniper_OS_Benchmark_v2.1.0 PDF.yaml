      [edit system services s'
- id: 6.10.1.7
  title: Ensure Only Suite B Ciphers are set for SSH
  scoring: scored
  profile:
  - Level 2
  description: SSH should be configured with Ciphers based on the Suite B Standard
  rationale: SSH (Secure Shell) is the defacto standard protocol used for remote administration of network devices and Unix
    servers, providing an encrypted and authenticated alternative to Telnet. However, this ubiquity and requirement to support
    a wide range of clients and deployment scenarios, as well as SSH's age, mean SSH needs to support a variety of Ciphers
    of varying strengths. By default, for the widest range of client compatibility, JUNOS supports SSH Ciphers using older
    Encryption Algorithms such as Blowfish or RC4 which are no longer considered suitable for use to protect sensitive services
    like SSH. SSH is a vital tool for administering most JUNOS devices, providing privileged access and potentially transporting
    sensitive information including passwords. It is recommended that SSH sessions be protected by restricting JUNOS to using
    Ciphers recommended in the National Security Agency Suite B Standard. Suite B standards for Cryptographic functions are
    developed and distributed by the US National Security Agency as part of Cryptographic Modernization Programme for protection
    of US Government data, both unclassified and classified (to Secret). Suite B standards for SSH are set out in RFC6239
    and restrict Ciphers to AES-128 and AES-256 in Galois Counter Mode only. When AES is used in Galois Counter Mode (AEAD_AES_128/256_GCM)
    for Confidentiality (Ciphers), it is also used to provide Integrity (replacing any Message Authentication Codes (MACs)
    which may be configured). For more details, please see RFC5647. NOTE - The OpenSSH implementation used in JUNOS is not
    fully compliant with Suite B SSH set out in RFC6239, but these standards have been used as guidance for setting the more
    restrictive Level 2 recommendation. 346 | P a g e
  impact: Some SSH Clients or other management applications or automation platforms utilizing SSH may not support the stronger
    ciphers used in Suite B, so may be unable to connect. Ensure that all applications are fully tested before deploying this
    recommendation in a production environment.
  references:
  - 1. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  - 2. Configuring SSH Service for Remote Access to the Router, JUNOS Software System
