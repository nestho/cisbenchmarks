- id: 6.6.1.5
  title: Ensure Lockout-period is set to at least 30 minutes
  scoring: scored
  profile:
  - Level 1
  description: Users who have been disconnected due to bad login attempts should be locked out for 30 minutes.
  rationale: Remote administration protocols like Telnet and SSH are commonly targeted by Brute Force or Dictionary attacks
    where a malicious user attempts to guess a valid username/password combination in order to gain control of the router.
    To slow down the rate at which an attacker can attempt to guess passwords accounts disconnected by the tries-before-disconnect
    option should be locked out for a period of 30 minutes.
  impact: ''
