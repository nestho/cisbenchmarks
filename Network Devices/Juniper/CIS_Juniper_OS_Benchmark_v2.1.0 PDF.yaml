- id: 6.10.5.7
  title: Ensure REST API Explorer is Not Set
  scoring: scored
  profile:
  - Level 1
  description: The REST API Explorer should be disabled
  rationale: When enabled, the JUNOS REST API can provide a Web GUI interface known as the REST API Explorer to allow developers
    to learn the API or test RPC calls. The API Explorer is not designed for use in production environments and adds an unnecessary
    additional attack surface which could be exploited to compromise the JUNOS Device. Because it is an unneeded service,
    intended for use only in development environments, the API Explorer should be disabled on all production systems.
  impact: The REST API Explorer should only be used in Development or Lab environments, it is not required in order to support
    normal REST API functionality.
  references:
  - 1. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  page_start: 417
  audit_raw: 'To confirm whether the REST API Explorer is enabled, enter the following command from

    the [edit system services rest] hierarchy:

    [edit system services rest]

    user@host# show enable-explorer | count

    If a line count of 1 is returned, the API Explorer is enabled.'
  remediation: 'To disable the REST API Explorer, issue the following command from the [edit system

    services rest] hierarchy:

    [edit system services rest]

    user@host# delete enable-explorer

    This will disable the API Explorer for both HTTP and HTTPS access.

    417 | P a g e'
  checks:
  - type: sql
    command: show enable-explorer | count
    severity: medium
    info: 'To confirm whether the REST API Explorer is enabled, enter the following command from

      the [edit system services rest] hierarchy:

      [edit system services rest]

      user@host# show enable-explorer | count

      If a line count of 1 is returned, the API Explorer is enabled.'
- id: 6.10.5.8
  title: Ensure REST Allowed Sources is Set
  scoring: scored
  profile:
  - Level 1
  description: REST API Clients should be restricted to allowed sources.
  rationale: The REST API service allows remote scripts or users to connect to a JUNOS Device and execute RPC commands to
    operate and configure the device, potentially granting full control if connecting using a privileged account. To protect
    the REST API from unauthorized use, access should be restricted to specific Network Management Systems using the allowed-sources
    option to add a whitelist of one or more individual IP Addresses.
  impact: Hosts which are not included in the Allowed Sources whitelist will no longer be permitted to access the REST API.
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/task/configuration/
  page_start: 419
  audit_raw: 'To confirm if Allowed Sources are configured for the REST API, enter the following

    command at the [edit system services rest] hierarchy:

    [edit system services rest]

    user@host# show control allowed-sources

    The command should return a list of one, or more, IP Addresses which are permitted to

    access the JUNOS Device using the REST API service.'
  remediation: 'To add an IP Address to the REST API Allowed Sources whitelist, enter the following

    command from the [edit system services rest] hierarchy:

    [edit system services rest]

    user@host# set control allowed-sources <Source IP>

    419 | P a g e

    Where <Source IP> is a single host IP Address.

    To add multiple addresses to the Allowed Sources whitelist, enter the following command:

    [edit system services rest]

    user@host# set control allowed-sources [<Source IP 1> <Source IP 2> <Source

    IP ...> ]

    To remove a single address from the current list (for example, if the host is no longer used

    for Network Management) enter the following command:

    [edit system services rest]

    user@host# delete control allowed-sources <Source IP>'
  checks:
  - type: sql
    command: show control allowed-sources
    severity: medium
    info: 'To confirm if Allowed Sources are configured for the REST API, enter the following

      command at the [edit system services rest] hierarchy:

      [edit system services rest]

      user@host# show control allowed-sources

      The command should return a list of one, or more, IP Addresses which are permitted to

      access the JUNOS Device using the REST API service.'
- id: 6.10.5.9
  title: Ensure REST Connection Limit is Set
  scoring: scored
  profile:
  - Level 1
  description: If the REST API service is configured, the Connection Limit should be set.
  rationale: The REST API may be accessed remotely, using either HTTP (though this is not recommended) or HTTPS. An attacker
    may attempt to open a large number of sessions to the REST API service to exhaust the routers resources or an authorized
    user may do so accidently, especially given that the service is designed to allow an automation interface to JUNOS. To
    limit the impact of any such incident, the number of concurrent connections to the REST API service should explicitly
    limited. A relatively low value of 10 is recommended, but may not be appropriate for all environments so it is left to
    the administrator's discretion.
  impact: If the connection limit has been reached, additional REST API sessions will be rejected until an existing session
    has ended.
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/task/configuration/
  page_start: 421
  audit_raw: 'To confirm whether a Connection Limit has been set for the REST API, enter the following

    command at the [edit system services rest] hierarchy:

    [edit system services rest]

    user@host# show control connection-limit | count

    The command should return a line count of 1 if the Connection Limit has been set.'
  remediation: 'To enable a REST API Connection Limit, enter the following command at the [edit system

    services rest] hierarchy:

    421 | P a g e

    [edit system services rest]

    user@host# set control connection-limit <limit>

    Where <limit> is the desired Connection Limit.'
  checks:
  - type: sql
    command: show control connection-limit | count
    severity: medium
    info: 'To confirm whether a Connection Limit has been set for the REST API, enter the following

      command at the [edit system services rest] hierarchy:

      [edit system services rest]

      user@host# show control connection-limit | count

      The command should return a line count of 1 if the Connection Limit has been set.'
- id: 6.10.5.10
  title: Ensure REST Service Address is Set
  scoring: scored
  profile:
  - Level 1
  description: The REST API Service Address should be set.
  rationale: The REST API service allows remote scripts or users to connect to a JUNOS Device and execute RPC commands to
    operate and configure the device, potentially granting full control if connecting using a privileged account. To protect
    the REST API from unauthorized use, access should be restricted to specific network management segments. By default, when
    enabled, the REST API listens on port TCP/3000 (for HTTP) or TCP/3443 (for HTTPS) on all IP Addresses configured on the
    JUNOS Device. The addresses option can be configured with one or more IP Addresses to restrict the REST API to listening
    only on these addresses. In general, this would be the IP Address used for the devices' Out of Band Management interface
    (such as fxp0) where possible.
  impact: Hosts will be unable to connect to the REST API HTTPS Service on any addresses which are not configured.
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/task/configuration/
  page_start: 423
  audit_raw: 'To confirm if the REST API''s Service Address has been limited, enter the following

    command at the [edit system services rest] hierarchy:

    [edit system services rest]

    user@host# show https addresses

    The command should return a list of one, or more, IP Addresses which if configured on

    Interfaces will be used for the REST API HTTPS Service.

    423 | P a g e'
  remediation: 'To restrict the IP Address/es on which the REST API will listen, enter the following

    command from the [edit system services rest] hierarchy:

    [edit system services rest]

    user@host# set https addresses <Service IP>

    Where <Service IP> is a single IP Address configured on one of the JUNOS Device''s

    interfaces.

    To add multiple addresses, enter the following command:

    [edit system services rest]

    user@host# set https addresses [<Service IP 1> <Service IP 2> <Service IP

    ...> ]

    To remove a single address from the current list enter the following command:

    [edit system services rest]

    user@host# delete https addresses <Service IP>'
  checks:
  - type: sql
    command: show https addresses
    severity: medium
    info: 'To confirm if the REST API''s Service Address has been limited, enter the following

