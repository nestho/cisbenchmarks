  description: Idle JWeb sessions should be timed out after 15 minutes.
  rationale: If JWeb Management sessions are left unattended it may be possible for an attacker to use the session to take
    control of the JUNOS device. To prevent this, or at least limit the scope of such an attack, an idle timeout should be
    set to end sessions where no activity has occurred for a defined period of time. The Payment Card Industry Data Security
    Standard (PCI DSS) recommends that administrative sessions should be timed out if left idle for 15 minutes.
  impact: ''
  references:
