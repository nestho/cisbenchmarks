      445 | P a g e

      This command should return a line count of 1, indicating that the Console Port has been set

      as Insecure.'
- id: 6.11.5
  title: Ensure Log-out-on-disconnect is Set for Console
  scoring: scored
  profile:
  - Level 1
  description: Console sessions should be logged out as soon as the console cable is unplugged from the routers console port.
  rationale: Administrators often use a console port to configure JUNOS Devices when they have physical access to the device.
    When the administrator unplugs the cable from the console port, their session may be left logged in; allowing the next
    person who connects to the console port to access the router with the privileges and audit trail of the original administrator.
    To prevent this, the JUNOS Devices should be configured to automatically log out console port sessions as soon as the
    cable is disconnected.
  impact: ''
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Page 58, National Security
  page_start: 447
  audit_raw: 'To confirm whether Automatic Logout for Console sessions has been configured, enter the

    following command from the [edit system ports] hierarchy:

    [edit system ports ]

    user@host#show console | match log-out | count

    This command should return a line count of 1 if the Console Port has been configured to

    automatically disconnect sessions when the cable is unplugged.'
  remediation: 'To log console sessions out when the console cable is unplugged, issue the following

    command from the [edit system ports console] hierarchy;

    [edit system ports console]

    user@host#set log-out-on-disconnect'
  checks:
