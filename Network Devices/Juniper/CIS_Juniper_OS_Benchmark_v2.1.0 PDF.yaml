      user@host#show | match "bfd-live.{" | count

      The line count returned by the first command should be double that returned by the

      second, indicating that every BFD session has been configured with an Au'
    severity: medium
- id: 4.6.2
  title: Ensure BFD Authentication is Not Set to Loose-Check
  scoring: scored
  profile:
  - Level 2
  description: BFD Peers should be authenticated.
  rationale: Bidirectional Forwarding Detection (BFD) is a Forwarding Plane feature which allows more rapid detection of a
    failed neighbor then can be achieved through a routing protocols' normal detection mechanisms, providing faster reconvergence.
    If no authentication was used an attacker may replay or spoof BFD messages to destabilize a network and/or prevent proper
    reconvergence resulting in a Denial of Service. JUNOS supports a Loose Authentication Check mechanism, which is intended
    for use when transitioning from unauthenticated BFD to authenticated BFD implementations or when changing Shared Secret
    Keys. When Loose Authentication Checking is enabled, the JUNOS Device will produce authenticated BFD packets, but will
    not check the authentication of packets it receives from its peer. When enabled the JUNOS Device is effectively as unprotected
    as when authentication is not configured at all. BFD Sessions should never be configured with the authentication loose-check
    option in a production network, with the exception of short transition periods while updating/replacing keys.
  impact: BFD Authentication must be configured to use the same Key and Algorithm on all neighbors/peers with which the session
    will be used. A mismatch will result in the BFD session failing and related routes being declared unreachable. BFD Authentication
