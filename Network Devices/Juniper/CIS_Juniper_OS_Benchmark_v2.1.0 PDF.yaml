    user@host#set then <action>\nAn IPv6 firewall filter, if required, can be configured under the family inet6 from the same\n\
    hierarchy.\nThe following example filter allows SSH from the 192.168.1.0/24 network and OSPF from\n10.0.0.0/8, while (implicitly)\
