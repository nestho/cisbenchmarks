- id: 4.11.1
  title: Ensure authentication is set to MD5
  scoring: scored
  profile:
  - Level 1
  description: RSVP Peers should be authenticated.
  rationale: RSVP messages may be abused by an attacker to interfere with QoS and Traffic Engineering services, resulting
    in poor performance or Denial of Service, or seek to attack the target router directly using weaknesses in the RSVP implementation.
    To protect against these types of attacks RSVP messages may be Authenticated using an MD5 hash of certain packet elements
    combined with a secret key (MD5 HMAC). RSVP authentication is supported in the two major variants described in the IETF
    Draft "RSVP Cryptographic Authentication draft-ietf-rsvp-md5-03" and in RFC 2747. JUNOS automatically detects which variant
    to use on a neighbor by neighbor basis and not interaction is required from the administrator for multi-vendor support.
    RSVP Authentication is set on an interface by interface basis and should be configured for all interfaces where RSVP is
    used.
  impact: ''
  references:
  - 1. Configuring RSVP Interfaces, JUNOS Software MPLS Applications Configuration
  page_start: 175
  audit_raw: 'Enter the following command from the [edit] hierarchy:

