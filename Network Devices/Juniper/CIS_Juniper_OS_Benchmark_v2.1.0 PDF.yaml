    user@host#show host-name | match "Juniper|JUN|ACX|EX|MX|NFX|PTX|QFX|SRX" |

    display inheritance | count

    A line count of 0 should be returned, indicating that the hostname does not include the

    model prefix of primary Juniper platforms or terms like Juniper, JUNOS or JUN-OS (note,

    the match statement is not case sensitive in it''s default operation, so both "JUN" and "jun"

    would be matched.).

    Note - In some instances, some hostnames which may be unrelated to model number may

    479 | P a g e

    match this filter.

    For example, an organization''s naming policy may require that hostnames include the ISO

    3166 standard two letter Country Code for the country in which the device is deployed. If

    the device were deployed in Mexico, then this would be mx, which would match the filter in

    the test above. Or a device might be deployed at the "Equinix Harbour Exchange" facility in

    London, which is typically abbreviated to HEX, and this would also match the filter.'
  remediation: 'To configure the hostname, issue the following command from the [edit system]

    hierarchy;

    [edit system]

    user@host#set host-name <hostname>

    The hostname should not include any indication of the make or model of the device.'
