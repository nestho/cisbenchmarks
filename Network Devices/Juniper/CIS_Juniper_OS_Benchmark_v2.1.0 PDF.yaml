  - Level 1
  description: Passwords for local user accounts must be configured to require character set changes.
  rationale: Weak passwords on local user accounts present a serious threat to the security of any device, allowing malicious
    user access through simple dictionary or brute force attacks. Fortunately JUNOS provides a mechanism for enforcing complexity
    requirements when new passwords are initially set in plain-text. Secure passwords should contain characters from number
    of different character sets (Upper case letters, Lower case letters, Numbers, Punctuation and Special Characters) and
    JUNOS should be configured to force passwords for local users to meet this requirement.
