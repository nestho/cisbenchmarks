- id: '3.8'
  title: Ensure Loopback interface address is set
  scoring: scored
  profile:
  - Level 2
  description: Configure a Loopback address.
  rationale: When a router needs to initiate connections to remote hosts, for example for SYSLOG or NTP, it will use the nearest
    interface for the packets source address. This can cause issues due to the possible variation in source, potentially causing
    packets to be denied by intervening firewalls or handled incorrectly by the receiving host. To prevent these problems
    the router should be configured with a Loopback interface and any services should be bound to this address.
  impact: ''
  references:
