    command from the [edit system] hierarchy:

    [edit system]

    user@host#show | match "default-address-selection" | count

    A line count of 1 should be returned, indicating that Default Address Selection has been set.'
  remediation: 'To set the default source address to the loopback interface enter the following command

    from the [edit system] hierarchy:

    [edit system]

    user@host#set default-address-selection

    481 | P a g e

    Ensure that a loopback address has been configured for the device from the [edit

    interfaces lo0] hierarchy.'
