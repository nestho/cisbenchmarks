      The command should return a list of one, or more, IP Addresses which if configured on

      Interfaces will be used for the REST API HTTPS Service.

      423 | P a g e'
- id: 6.10.5.11
  title: Ensure REST Service Address is Set to OOB Management Only
  scoring: scored
  profile:
