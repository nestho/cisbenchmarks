- id: 6.2.1
  title: Ensure Archive on Commit
  scoring: scored
  profile:
  - Level 2
  description: The routers configuration should be archived whenever changes are committed.
  rationale: Before changes made to a JUNOS router are applied they must be committed. Archiving the configuration to an external
    server on every commit creates a complete history of all changes allowing an effective 'post mortem' to be carried out
    following any breach and aiding recovery to security and other incidents. The archive can also be used to alert administrators
    of unauthorized changes and identify what was changed by utilizing hashes or diff in scripts or systems like Tripwire.
  impact: ''
  references:
