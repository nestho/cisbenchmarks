- id: 6.10.3.4
  title: Ensure XNM-SSL SSLv3 Support is Not Set
  scoring: scored
  profile:
  - Level 1
  description: If the XNM-SSL service is configured, SSLv3 should not be enabled.
  rationale: JUNOScript can be configured to use SSL/TLS transport to prevent the exposure of sensitive data and authentication
    details on the network. If configured the XNM-SSL service will provide services on port TCP/3220. Secure Sockets Layer
    version 3 (SSLv3) is an old standard for securing communication, which has proved vulnerable to a number of systemic weaknesses
    and is now considered unsuitable for use for securing sensitive sessions, such as those used by JUNOScript. SSLv3 has
    been replaced by the Transport Layer Security (TLS) standard. Although support for SSLv3 has been disabled by in most
    JUNOS Releases, it is still possible to enable support for SSLv3 using a hidden configuration command in some currently
    supported versions of JUNOS. Because this would enable a significantly weaker standard, it is strongly recommended that
    SSLv3 Support should never be enabled.
  impact: If a JUNOScript client does not support the newer TLS standard, it will be unable to connect to the JUNOS Device.
  references:
  - 1. Configuring SSL Service for JUNOScript Client Applications, JUNOS 9.3 System Basics
  - 2. https://www.juniper.net/documentation/en_US/junos/informationproducts/pathway-pages/junos-xml-management-protocol/junos-xmlmanagement-protocol.html
  page_start: 392
  audit_raw: 'To confirm whether a JUNOScript SSLv3 Support has been configured, enter the following

    command at the [edit system services xnm-ssl] hierarchy:

    [edit system services xnm-ssl]

    user@host#show sslv3-support | count

    The above command should return a line count of 0.

    392 | P a g e'
  remediation: 'XNM-SSL SSLv3 Support can be disabled by issuing the following command from the [edit

    system services xnm-ssl] hierarchy;

