- id: '3.5'
  title: Ensure proxy-arp is disabled
  scoring: scored
  profile:
  - Level 2
  description: Do not use Proxy ARP.
  rationale: Address Resolution Protocol (ARP) provides resolution between IP and MAC Addresses (or other Network and Link
    Layer addresses on none IP networks) within a Layer 2 network. Proxy ARP is a service where a device connected to one
    network (in this case the JUNOS router) answers ARP Requests which are addressed to a host on another network, replying
    with its own MAC Address and forwarding the traffic on to the intended host. Sometimes used for extending broadcast domains
    across WAN links, in most cases Proxy ARP on enterprise networks is used to enable communication for hosts with misconfigured
    subnet masks, a situation which should no longer be a common problem. Proxy ARP effectively breaks the LAN Security Perimeter,
    extending a network across multiple Layer 2 segments. Using Proxy ARP can also allow other security controls such as PVLAN
    to be bypassed.
  impact: ''
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Section 4.4.2 (page 75), National
  page_start: 89
  audit_raw: 'From the command prompt, execute the following command:

    [edit]

    user@host#show interfaces | match "proxy-arp" | count

    The returned value should return 0 or null.'
  remediation: 'To disable Proxy ARP enter the following command from the [edit interfaces

    <interface name> unit <unit number>] hierarchy:

    [edit interfaces <interface name> unit <unit number>]

    user@host#delete proxy-arp

    89 | P a g e'
  checks:
  - type: sql
    command: show interfaces | match "proxy-arp" | count
    severity: medium
    info: 'From the command prompt, execute the following command:

      [edit]

      user@host#show interfaces | match "proxy-arp" | count

      The returned value should return 0 or null.'
- id: '3.6'
  title: Ensure ICMP Redirects are set to disabled (on all untrusted IPv4 networks)
  scoring: manual
  profile:
  - Level 1
  description: The Routing Engine should not send ICMP Redirect Messages.
  rationale: ICMP Redirect Messages provide a method for a router to communicate routing information with a host and is intended
    for use when a router receives packets to forward to a destination to which the host should have a direct route. In a
    well designed, modern, network ICMP Redirects should not be needed or add any useful functionality. An attacker may abuse
    this feature to obtain topology information about a target network and potentially identify weaknesses for later exploitation
    or to target the router and hosts with Denial of Service (DoS) or Man in the Middle (MITM) attacks. To prevent this abuse,
    ICMP Redirect message generation should be disabled globally where it is not required as discussed in Recommendation 6.15.10
    Ensure ICMP Redirects are Disabled for IPv4. Where this is not possible, ICMP Redirects can be disabled on a per Interface
    basis and should be disabled for all Untrusted networks, such as the Internet, or subnets where this functionality is
    not required.
  impact: In some networks, for instances where subnets populated by hosts include multiple nonredundant gateways, removing
    redirects may result in traffic being doubled on some gateways interfaces as traffic is received and then forwarded on
    the same port.
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  - 2. http://www.cymru.com/gillsr/documents/icmp-redirects-are-bad.pdf
  page_start: 91
  audit_raw: 'From the command prompt, execute the following command:

    [edit]

    user@host#show interfaces | match "no-redirects" | count

    The above command should return an integer value equal to the number of untrusted

    interfaces on the device. Because this is a subjective value, this recommendation is not

    scored.

    91 | P a g e'
  remediation: 'To disable ICMP Redirect message generation on an untrusted network interface, issue the

    following command from the [edit interfaces] hierarchy;

    [edit interfaces]

    user@host#set <interface name> unit <unit number> family <address family> noredirects'
  checks:
