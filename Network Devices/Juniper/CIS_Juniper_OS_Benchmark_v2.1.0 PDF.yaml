      user@host#show interfaces | match "incoming-map" | count

      If an interface is set to accept incoming calls and use Caller ID this should be a positive

      integer. A value of 0 does may indicate that Caller ID is not used or may simply indicate that

      incoming calls are not configured at all.'
- id: 3.1.2
  title: Ensure access profile is set to use CHAP
  scoring: scored
  profile:
  - Level 1
  description: CHAP Authentication MUST be used when Incoming calls are permitted.
  rationale: Some JUNOS routers support the use of a dial in modem connection for Telnet/SSH administration of the router
    from a remote connection over the telephone network. This can provide a useful out of band management channel, allowing
    access to a customer router at a remote site when the primary circuit has failed for example, but also creates a new route
    for attack, allowing a malicious user to bypass firewalls and other defenses. Even when the phone number for the modem
    is kept secret, attackers may still discover it through war dialing, possibly narrowing targets by researching the number
    ranges used by your organization. To limit the scope for such an attack, the dialer interface should be configured to
    use Challenge Handshake Authentication Protocol (CHAP) before allowing calls to connect. Using CHAP, a username and password
    can be configured for each user that needs to connect to the router via the modem. The password should not be the same
    as that used by to login to the routers CLI itself.
  impact: ''
  references:
  - 1. Setting Up USB Modems for Remote Management, JUNOS 9.5 Security Configuration
  page_start: 76
  audit_raw: 'From the command prompt, execute the following command:

    [edit]

    user@host#show interfaces | find "chap" | match "access-profile" | count

    If an interface is set to accept incoming calls and use CHAP Authentication this should be a

    positive integer. A value of 0 does may indicate that CHAP is not used or may simply

    indicate that incoming calls are not configured at all.'
  remediation: 'If you have configured a dialer interface to accept incoming calls, you should configure

    CHAPS authentication using the following commands from the indicated hierarchy (where

    n is the interface number);

