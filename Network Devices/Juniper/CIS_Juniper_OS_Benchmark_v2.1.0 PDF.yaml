- id: 4.6.1
  title: Ensure BFD Authentication is Set
  scoring: scored
  profile:
  - Level 2
  description: BFD Peers should be authenticated.
  rationale: Bidirectional Forwarding Detection (BFD) is a Forwarding Plane feature which allows more rapid detection of a
    failed neighbor then can be achieved through a routing protocols' normal detection mechanisms, providing faster reconvergence.
    If no authentication was used an attacker may replay or spoof BFD messages to destabilize a network and/or prevent proper
    reconvergence resulting in a Denial of Service. Several authentication mechanisms are supported for BFD ranging from plain
    text password, which should not be used, to meticulously keyed SHA1. The latter provides the strongest hashing algorithm
    and best replay protection, with the sequence number being updated on each packet, and it is this mechanism that should
    be used in most cases. However, if None Stop Routing (NSR) features are required; meticulously keyed SHA1 or MD5 should
    not be used as the BFD Sessions using these algorithms may fail when switching to the Backup Routing Engine. Both BFD
    peers must be configured with the same keys and method, otherwise the BFD link may be declared down resulting in a reconvergence.
    Because it is not possible to configure both ends of an existing BFD link simultaneously you may need to use Loose Authentication
    Checking as a transitional step by configuring the loose-check option.
  impact: BFD Authentication must be configured to use the same Key and Algorithm on all neighbors/peers with which the session
    will be used. A mismatch will result in the BFD session failing and related routes being declared unreachable. BFD Authentication
    with meticulous-keyed-sha-1 and meticulous-keyed-md5 algorithms should not be used in conjunction with NSR and GRES. Fail
    over between Routing Engines will cause Authentication to fail. 154 | P a g e
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/topics/concept/policy-bfdstatic-routes-understanding.html
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  page_start: 154
  audit_raw: 'To confirm whether BFD Authentication is configured, issued the following command from

    the root [edit] hierarchy:

    [edit]

    user@host#show | display set | match "bfd-live.*authentication" | except

    loose | count

    Now issue the following command to count the total number of BFD sessions configured:

    [edit]

    user@host#show | match "bfd-live.{" | count

    The line count returned by the first command should be double that returned by the

    second, indicating that every BFD session has been configured with an Authentication

    Algorithm and Key Chain (requiring two commands).

    If the Audit Procedure shows that Authentication is missing, enter the following command

    and apply the Remediation Procedure at each hierarchy where BFD is configured, but

    Authentication is not.

    [edit]

    user@host#show | display set | match "bfd-live"'
  remediation: 'If you have deployed BFD, authentication can be configured by issuing the following

    commands.

    First set the authentication algorithm and keychain from the appropriate [.* bfdliveness-detection] hierarchy, in this
    example we are configuring BFD Authentication

    for OSPF Neighbors on Interface Ge-0/0/0.0:

    [edit protocols ospf interface ge-0/0/0.0 bfd-liveness-detection]

    user@host#set authentication algorithm <algorithm>

    user@host#set authentication key-chain <key-chain>

    Where:

     <algorithm> is either keyed-md5, keyed-sha-1, meticulous-keyed-md5 or

    meticulous-keyed-sha-1, which is preferred but is not compatible with NSR and

    other failover options.

     <key-chain> is the name of a configured key-chain (see below).

    If a Key Chain is not already defined, you should create one by issuing the following

    command at the [edit security authentication-key-chains] hierarchy:

    155 | P a g e

    [edit security authentication-key-chains]

    user@host#set key-chain <key-chain> key <key number> secret <key>

    Where:

     <key-chain> is the name of the key-chain already configured for the BFD session

     <key number> is the number to identify this key, used for key rollover

     <key> is the Shared Secret Key

    The <algorithm> and <key> must be the same on all devices which will use the BFD session

    being configured.

    If the BFD Session is already in use, setting Authentication on one side before the other will

    cause the BFD Session (and the associated routes or adjacencies) to be declared down

    resulting in loss of traffic. To aide in rollout of BFD Authentication, JUNOS Devices can

    operate in a "Loos Authentication Check" mode, whereby they will send Authentication

    information, but will not reject unauthenticated messages.

    This should be used in transition only and can be configured with the following command

    from the same [.* bfd-liveness-detection] hierarchy:

    [edit protocols ospf interface ge-0/0/0.0 bfd-liveness-detection]

    user@host#set authentication loose-check

    BFD may be configured at a wide variety of configuration hierarchies, for different

    Protocols, Routing Instances or even for Static Routes. The bfd-liveness-detection

    hierarchy is the same at each level it is used, so the Remediation Process is the same and

    should be applied at each hierarchy indicated in the Audit Procedure.'
  checks:
  - type: manual_review
    info: 'To confirm whether BFD Authentication is configured, issued the following command from

      the root [edit] hierarchy:

      [edit]

      user@host#show | display set | match "bfd-live.*authentication" | except

      loose | count

      Now issue the following command to count the total number of BFD sessions configured:

