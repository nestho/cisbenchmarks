    Once a suitable filter has been configured, it must be applied to the Loopback interface,

    using the following command from the [edit] hierarchy:

    [edit]

    user@host#set interface lo0 unit 0 family inet filter input <filter name>

    If additional Loopback Interface Units are configured (in other Routing Instances), the filter

    should also be applied to these.

    If IPv6 filters are also required, the same command is used but applying to family inet6.

    In the example below, we add a new term AcceptBGP to the CIS-Example-IPv4 shown

    previously in the Audit Procedure. We opted to first configure a prefix-list each for our

    bgp-neighbors using the following command from the [edit policy-options] hierarchy:

    [edit policy-options]

    mwhite@SRX1# set prefix-list bgp-neighbors apply-path "protocols bgp group

    <*> neighbor <*>"

    The bgp-neighbors prefix-list used an apply-path to return all configured BGP Neighbors

    configured for any group under the [edit protocols bgp] configuration. The same

    technique can be used to create a list of all configured NTP Servers, SNMP Servers and so

    on. Lists created using an apply-path will automatically update when the source

    configuration does, so if we add a new BGP Neighbor, the prefix-list is updated

    automatically.

    NOTE - If you are running protocols in multiple Routing Instances, Logical Systems or similar

    features, you may need to adjust your prefix-list and apply-path to reflect these additional

    locations.

    We can then add a new term to the existing CIS-Example-IPv4 firewall filter with the

    following commands from the [edit firewall] hierarchy:

    57 | P a g e

    [edit firewall]

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AccpetBGPfrom

    source-prefix-list bgp-neighbors

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AccpetBGP from

    protocol tcp

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AccpetBGP from

    destination-port bgp

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AccpetBGP then

    count BGP-Allowed

    mwhite@SRX1# set family inet filter CIS-Example-IPv4 term AcceptBGP then

    accept

    This filter matches traffic coming from any configured BGP Neighbor to TCP Port 179 and

    accepts it, incrementing a named counter BGP-Allowed, which helps us with

    troubleshooting and monitoring.

    If it is not already, the filter can now be applied to the Loopback interface, using the

    following command from the [edit interfaces] hierarchy:

    [edit interfaces]

    mwhite@SRX1# set unit 0 family inet filter input CIS-Example-IPv4

    Note - The example filter above not complete and may not be suitable for all environments -

    all other traffic to the Junos Device will be discarded.

    Your filters should include terms for all of the Management, Monitoring and Automation

    services, as well as any Routing Protocols or other services such as IPSEC or BFD in use in

    your network.'
