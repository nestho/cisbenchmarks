- id: 6.6.5
  title: Ensure all Custom Login Classes Forbid Shell Access
  scoring: scored
  profile:
  - Level 1
  description: All login classes should deny Shell access.
  rationale: JUNOS runs on top of a heavily modified BSD Unix based operating system and users with certain permission sets
    will be able to start a Shell to interact with this underlying system directly. Once within a Unix Shell a user may execute
    scripts or applications and perform changes outside of the normal Authentication, Authorization and Accounting (AAA) mechanisms
    which protect the router when a user performs commands in JUNOS. Access to the underlying Unix Shell is not required in
    normal operation for almost all deployments and the default position should be for this to be denied. In the rare instances
    where it is required, access to the Shell should be restricted to a very small number of users, ideally only being granted
    on a case by case basis and removed when the task requiring access is complete. To ensure all interaction with the router
    will need to be performed through JUNOS, all Custom Login Classes should have access to the shell explicitly denied.
  impact: ''
  references:
  - 1. JUNOS Login Classes Overview, JUNOS 9.5 System Basics Configuration Guide,
  page_start: 262
  audit_raw: 'From the command prompt, execute the following commands:

    [edit]

    user@host#show system login | match "deny-commands.*start shell.*" | count

    The above command should return a positive integer equal to the number of configured

    classes.'
  remediation: 'Deny Shell access for a class using the following command under the [edit system login]

    hierarchy:

    [edit system login]

    user@host#set class <class name> deny-commands "start shell"

    262 | P a g e

    You may also wish to deny other commands or groups of commands by using a list or

    Regular Expression as the deny-commands value, ensure that start shell is still included.'
  checks:
