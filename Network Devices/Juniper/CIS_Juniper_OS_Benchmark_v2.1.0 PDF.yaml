- id: '6.19'
  title: Ensure Hostname is Not Set to Device Make or Model
  scoring: scored
  profile:
  - Level 1
  description: The device make and model should not appear in the hostname.
  rationale: The first step in any attack is reconnaissance. An attacker will attempt to learn about the target network, its
    hosts and network devices. A key piece of information for an attacker is what type of device he/she is attacking. By using
    the routers Model number, type, manufacturer or software version as part of its hostname, we give an attacker this valuable
    piece of information with no effort or risk of exposure. This is particularly true where the hostname is used in DNS.
    This should not be interpreted as recommending "security through obscurity" as a valid approach - rather that, as defenders,
    we would rather an attacker be required to perform more active reconnaissance to gather information about the target network
    - so that Intrusion Prevention Systems, Firewalls, Honeypots and other Security solutions are given a greater opportunity
    to detect and defend against the activity.
  impact: The hostname will appear in the CLI prompt, in SNMP information and in log messages.
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  page_start: 479
  audit_raw: 'To confirm that the Hostname does not contain the make or model number, issue the

    following command from the [edit system] hierarchy:

