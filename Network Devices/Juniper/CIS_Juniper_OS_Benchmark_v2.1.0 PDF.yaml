- id: 3.1.3
  title: Forbid Dial in Access
  scoring: scored
  profile:
  - Level 2
  description: Dial in access should not be used on sensitive routers.
  rationale: Some JUNOS routers support the use of a dial in modem connection for Telnet/SSH administration of the router
    from a remote connection over the telephone network. This can provide a useful out of band management channel, allowing
    access to a customer router at a remote site when the primary circuit has failed for example, but also creates a new route
    for attack, allowing a malicious user to bypass firewalls and other defenses. Even when the phone number for the modem
    is kept secret, attackers may still discover it through war dialing, possibly narrowing targets by researching the number
    ranges used by your organization. For sensitive routers, such as those in a PCI DSS Cardholder Data Environment, the protective
    measures available for dial in access are insufficient and no dial in access should be used. If not required for other
    services the modem should be physically removed from the router.
