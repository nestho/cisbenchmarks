- id: 6.6.12
  title: Ensure SHA512 is used to hash local passwords
  scoring: scored
  profile:
  - Level 1
  description: Passwords should be hashed with a strong hashing algorithm.
  rationale: Passwords for locally configured users are stored in the JUNOS configuration file. By applying a hashing algorithm
    to the password before storing it, JUNOS limits an attacker's ability to gain passwords from configuration backups or
    to escalate privileges when using a different account through the CLI. JUNOS hashes local passwords using MD5, or SHA1
    for FIPS mode devices, by default. However, both are older algorithms and are widely considered to be weak for this type
    of usage. The newer SHA-2 algorithm should be used with a 512bit digest wherever possible, however, some older but still
    supported JUNOS devices do not support this (see notes for more details).
  impact: ''
  references: []
  page_start: 280
  audit_raw: 'From the command prompt, execute the following commands:

    [edit]

    user@host#show system login password format

    The above command should return the following output:

    login password format sha512;'
