- id: 6.5.4
  title: Ensure TCP SYN/FIN is Set to Drop
  scoring: scored
  profile:
  - Level 1
  description: TCP Segments which have both the SYN and FIN flags set should be dropped.
  rationale: TCP packets that have both SYN and FIN flags set are sometimes used by attackers to bypass Intrusion Detection
    Systems and Firewalls or to directly attack hosts on the target network. If patches are up-to-date then most systems are
    no longer vulnerable to this technique; however, there is no valid reason for a packet to contain both SYN and FIN flags,
    so such traffic is almost certainly malicious or the result of an error and should never be processed.
  impact: There is no valid reason for a TCP Segment to have both SYN and FIN flags set.
  references:
  - 1. Configuring the Router to Drop Packets with the SYN and FIN Bits Set, JUNOS 9.3
  - 2. http://www.kb.cert.org/vuls/id/464113
  page_start: 240
  audit_raw: 'To confirm whether the Device is configured to drop SYN/FIN Segments, issue the

    following command from the [edit system internet-options] hierarchy:

    [edit system internet-options]

    user@host#show | match "synfin" | count

    A line count of 1 should be returned, indicating that TCP Segments with SYN/FIN set will be

    dropped.'
  remediation: 'Configure the router to drop TCP Segments containing both SYN and FIN flags by issuing

    the following command from the [edit system internet-options] hierarchy.

    [edit system internet-options]

    user@host#set tcp-drop-synfin-set'
  checks:
  - type: manual_review
    info: 'To confirm whether the Device is configured to drop SYN/FIN Segments, issue the

      following command from the [edit system internet-options] hierarchy:

      [edit system internet-options]

      user@host#show | match "synfin" | count

      A line count of 1 should be returned, indicating that TCP Segments with SYN/FIN set will be

      dropped.'
    severity: medium
- id: 6.5.5
  title: Ensure TCP RST is Set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: Connection attempts to a closed / non-listening port should not return a TCP RST
  rationale: As with most Operating Systems, by default, when a client attempts to connect to a TCP port which is not being
    used by a service to listen for connections JUNOS will return a TCP RST message to inform the client that there is no
    service available on that port. This behavior may aide an attacker who is performing port scanning to identify open services
    as part of a reconnaissance of the network or may allow Denial of Service (DoS) attack to be performed by placing unnecessary
    processing load on the Routing Engine. No valid use exists for attempting to connect to non-listening ports on a router
    or other network device, so JUNOS should be configured to silently drop all packets (with any flags) sent to closed TCP
    ports without sending a TCP reset (RST). The client attempting to connect will timeout rather than getting instant feedback,
    reducing the load on the JUNOS device and increasing the time required for any port scanning.
  impact: Connection attempts to closed/non-listening ports on the JUNOS Device will time out rather than receiving a TCP
    RST.
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  page_start: 242
  audit_raw: 'To confirm whether TCP RST is disabled, enter the following command from the [edit

    system internet-options] hierarchy:

    [edit system internet-options]

    user@host#show | display set | match | "no-tcp-reset drop-all-tcp" | count

    A line count of 1 should be returned, indicating that TCP RST is set to Disabled.

    242 | P a g e'
  remediation: 'To disable sending TCP RSTs to any connections to closed ports issue the following

    command from the [edit system internet-options] hierarchy.

    [edit system internet-options]

    user@host#set no-tcp-reset drop-all-tcp'
  checks:
  - type: manual_review
    info: 'To confirm whether TCP RST is disabled, enter the following command from the [edit

      system internet-options] hierarchy:

      [edit system internet-options]

      user@host#show | display set | match | "no-tcp-reset drop-all-tcp" | count

      A line count of 1 should be returned, indicating that TCP RST is set to Disabled.

      242 | P a g e'
    severity: medium
- id: 6.6.1.1
  title: Ensure Max 3 Failed Login Attempts
  scoring: scored
  profile:
  - Level 1
  description: A maximum of 3 failed login attempts should be allowed before the session is disconnected.
  rationale: Remote administration protocols like Telnet and SSH are commonly targeted by Brute Force or Dictionary attacks
    where a malicious user attempts to guess a valid username/password combination in order to gain control of the router.
    To slow down the rate at which an attacker can attempt to guess passwords, sessions should be disconnected after no more
    than 3 failed login attempts (a lower value can be used if preferred).
  impact: ''
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Page 229, National Security
  - 2. Configuring Password Retry Limits for Telnet and SSH Access, JUNOS 9.5 Security
  page_start: 246
  audit_raw: 'From the command prompt, execute the following commands:

    [edit]

    user@host#show system login retry-options tries-before-disconnect

    The above command should return an integer value equal to or less than 3.'
  remediation: 'Configure the number of tried before disconnect using the following command under the

    [edit system] hierarchy:

    [edit system]

    user@host#set login retry-options tries-before-disconnect'
  checks:
  - type: sql
    command: show system login retry-options tries-before-disconnect
    severity: medium
    info: 'From the command prompt, execute the following commands:

      [edit]

      user@host#show system login retry-options tries-before-disconnect

      The above command should return an integer value equal to or less than 3.'
- id: 6.6.1.2
  title: Ensure Max Login Backoff Threshold of 2
  scoring: scored
  profile:
  - Level 1
  description: A maximum of 2 failed login should trigger a backoff.
  rationale: Remote administration protocols like Telnet and SSH are commonly targeted by Brute Force or Dictionary attacks
    where a malicious user attempts to guess a valid username/password combination in order to gain control of the router.
    To slow down the rate at which an attacker can attempt to guess passwords Juniper routers can initiate a backoff timer
    when a user login fails more times than a configured threshold. Once initiated the backoff will not allow a further login
    attempt by the user for a configured (see next recommendation) period of time called the backoff factor. After the next
    failed login attempt further logins will not be allowed for the 2x the backoff factor, then 3x and so on.
  impact: ''
  references:
  - 1. Configuring Password Retry Limits for Telnet and SSH Access, JUNOS 9.5 Security
  page_start: 248
  audit_raw: 'From the command prompt, execute the following commands:

    [edit]

    user@host#show system login retry-options backoff-threshold

    The above command should return an integer value equal to or less than 2.'
  remediation: 'Configure the backoff threshold using the following command under the [edit system]

    hierarchy:

    [edit system]

    user@host#set login retry-options backoff-threshold <threshold>'
  checks:
  - type: sql
    command: show system login retry-options backoff-threshold
    severity: medium
    info: 'From the command prompt, execute the following commands:

      [edit]

      user@host#show system login retry-options backoff-threshold

      The above command should return an integer value equal to or less than 2.'
