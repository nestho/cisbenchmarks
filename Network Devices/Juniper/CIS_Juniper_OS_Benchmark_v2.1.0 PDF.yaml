- id: '6.23'
  title: Ensure Password is Set for PIC-Console-Authentication
  scoring: scored
  profile:
  - Level 1
  description: Connections to the PIC Console should require a password.
  rationale: Many JUNOS Devices (including M, MX & T Series Routers, PTX Series and High End SRXs) utilize Physical Interface
    Cards to provide interface flexibility. Some PICs include additional Console Ports for performing advanced diagnostics
    on the Packet Forwarding Engine (PFE) with physical access to the device. An attacker, who was able to gain access to
    this normally unauthenticated port, may be able to impact the device or seek to escalate their privileges, bypassing normal
    authentication mechanisms. To prevent this, pic-console-authentication should be configured using a secure password which
    is not the same as that used by any user or the Root account.
  impact: The configured password will be required before accessing the PIC Console to perform diagnostics.
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/topics/task/configuration/
  page_start: 487
  audit_raw: 'To confirm whether a password has been set for the PIC Console, issue the following

    command from the [edit system] hierarchy:

