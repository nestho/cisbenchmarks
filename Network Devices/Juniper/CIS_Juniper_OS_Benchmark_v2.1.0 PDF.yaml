- id: 6.10.5.5
  title: Ensure REST HTTPS Cipher List is Set
  scoring: scored
  profile:
  - Level 1
  description: The REST API should only be accessed using HTTPS with secure Cipher Suites.
  rationale: The JUNOS REST API can be configured for access using either HTTP or HTTPS for connections. When configured to
    use HTTPS, the device supports a wide range of Cipher Suites which define the Encryption, Hashing and Key Exchange methods
    and algorithms. By default, in the interests of compatibility, this includes support for a number of older, weaker algorithms
    such as RC4 Encryption or MD5 Hashing, which are no longer considered suitable for protecting sensitive data or device
    management. To ensure that these weaker algorithms and methods are not used, the REST API HTTPS Service should be configured
    to use only Cipher Suites which do not include RC4 or 3DES for Data Encryption and MD5 or SHA1 for Hashing.
  impact: REST API Management may be lost if the Network Management System or Hosts do not support the secure Cipher Suites.
  references:
  - 1. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  page_start: 412
  audit_raw: 'To check whether REST HTTPS is configured to use insecure Cipher Suites, enter the

    following command from the [edit system services rest] hierarchy:

    [edit system services rest]

    user@host# show https cipher-suites | match "rc4|3des|md5|sha" | exclude

    "sha256|sha384" | count

    A line count of 0 should be returned if no insecure Cipher Suites are configured.

    412 | P a g e'
  remediation: 'To restrict the Cipher Suites used REST over HTTPS, enter the following command from the

    [edit system services rest] hierarchy:

    [edit system services rest]

    user@host# set https cipher-list [ rsa-with-aes-128-cbc-SHA256 rsa-with-aes256-cbc-SHA256 dhe-rsa-with-aes-128-cbc-SHA256
    dhe-rsa-with-aes-256-cbcSHA256 rsa-with-aes-128-gcm-SHA256 rsa-with-aes-256-gcm-SHA384 dhe-rsa-withaes-128-gcm-SHA256
    dhe-rsa-with-aes-256-gcm-SHA384 ecdhe-rsa-with-aes-128cbc-SHA256 ecdhe-rsa-with-aes-256-cbc-SHA384 ecdhe-rsa-with-aes-128-gcmSHA256
    ecdhe-rsa-with-aes-256-gcm-SHA384 ]

    No all Cipher Suites are required to meet this recommendation. A shorter list, or individual

    Cipher Suites, may be configured using the same command.

    Some JUNOS Devices do not support all of the above Cipher Suite (most notably, AES in

    Galois Counter Mode support is not universal), unsupported Cipher Suites can be skipped.'
  checks:
  - type: sql
    command: show https cipher-suites | match "rc4|3des|md5|sha" | exclude
    severity: medium
    info: 'To check whether REST HTTPS is configured to use insecure Cipher Suites, enter the

      following command from the [edit system services rest] hierarchy:

      [edit system services rest]

      user@host# show https cipher-suites | match "rc4|3des|md5|sha" | exclude

      "sha256|sha384" | count

      A line count of 0 should be returned if no insecure Cipher Suites are configured.

      412 | P a g e'
- id: 6.10.5.6
  title: Ensure REST HTTPS Cipher List is Set to Suite B Only
  scoring: scored
  profile:
  - Level 2
  description: The REST API should only be accessed using HTTPS with secure Cipher Suites.
  rationale: The JUNOS REST API can be configured for access using either HTTP or HTTPS for connections. When configured to
    use HTTPS, the device supports a wide range of Cipher Suites which define the Encryption, Hashing and Key Exchange methods
    and algorithms. By default, in the interests of compatibility, this includes support for a number of older, weaker algorithms
    such as RC4 Encryption or MD5 Hashing, which are no longer considered suitable for protecting sensitive data or device
    management. In Secure Environments, the REST API HTTPS Service should be configured to accept only Cipher Suites listed
    in the National Security Agencies Suite B Standards. Suite B standards for Cryptographic functions are developed and distributed
    by the US National Security Agency as part of Cryptographic Modernization Program for protection of US Government data,
    both unclassified and classified (to Secret). The Suite B Profile for Transport Layer Security (TLS) is set in RFC6460
    and specifies two acceptable Profiles using ECDH with standard NIST Elliptic Curves, AES in Galois Counter Mode and SHA2.
  impact: REST API Management may be lost if the Network Management System or Hosts do not support the secure Cipher Suites.
  references:
  - 1. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  page_start: 414
  audit_raw: 'To check whether REST HTTPS is configured to use insecure Cipher Suites, enter the

    following command from the [edit system services rest] hierarchy:

    First, confirm that the two accepted Cipher Suites are configured

    414 | P a g e

    [edit system services rest]

    user@host# show https cipher-suites | display set | match "ecdhe-rsa-withaes-128-gcm-SHA256|ecdhe-rsa-with-aes-256-gcm-SHA384"
    | count

    A line count of 1 or 2 should be returned if one or both of the acceptable Suites are

    configured.

    Then, confirm that no other Cipher Suites are permitted.

    [edit system services rest]

    user@host# show https cipher-suites | display set | exclude "ecdhe-rsa-withaes-128-gcm-SHA256|ecdhe-rsa-with-aes-256-gcm-SHA384"
    | count

    A line count of 0 should be returned if no other Cipher Suites are configured.'
  remediation: 'To restrict the Cipher Suites used REST over HTTPS, enter the following command from the

    [edit system services rest] hierarchy:

    [edit system services rest]

    user@host# set https cipher-list [ ecdhe-rsa-with-aes-128-gcm-SHA256 ecdhersa-with-aes-256-gcm-SHA384 ]

    Either Cipher Suite may be omitted, but at least one of these Cipher Suites must be set. No

    other Cipher Suites may be used.'
  checks:
  - type: sql
    command: show https cipher-suites | display set | match "ecdhe-rsa-withaes-128-gcm-SHA256|ecdhe-rsa-with-aes-256-gcm-SHA384"
      | count
