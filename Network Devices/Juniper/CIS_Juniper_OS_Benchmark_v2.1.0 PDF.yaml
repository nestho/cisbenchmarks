    severity: medium
    info: 'To check whether REST HTTPS is configured, enter the following command from the [edit

      system services rest] hierarchy:

      [edit system services rest]

      user@host# show https | count

      If the command returns a line count of 1 or greater, then REST HTTPS is enabled.'
