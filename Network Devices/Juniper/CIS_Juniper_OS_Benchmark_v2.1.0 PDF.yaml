- id: '3.10'
  title: Ensure inbound firewall filter is set for Loopback interface
  scoring: scored
  profile:
  - Level 2
  description: A Firewall Filter should be applied to lo0.
  rationale: 'JUNOS routers can provide a wide range of services to the network and, as with any computer system, the more
    services that are offered and the more hosts they are available to, the wider attack surface is offered to a potential
    attacker. To protect the router from attack a Firewall Filter should be applied to all inbound traffic to the Routing
    Engine which limits the hosts able to connect to the router and the services on which they are permitted to connect. If
    applied to the lo0 interface the filter will apply to all traffic sent to the Routing Engine rather than to traffic traversing
    the router. Where IPv6 traffic is also handled by the router a firewall filter will also need to be applied for family
    inet 6. See the Firewall section for details of how to configure Firewall Filters. NOTE : The Firewall Filter applies
    to ALL traffic sent to the Routing Engine, including traffic sent to the routers interface addresses. Ensure your firewall
    filter allows all of the Routing, Management and other protocols which are required for normal operation prior to applying
    the filter.'
  impact: ''
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Section 4.4.1 (page 55), National
  page_start: 99
  audit_raw: 'From the command prompt, execute the following command:

    [edit]

