- id: '5.7'
  title: Ensure SHA1 is set for SNMPv3 authentication
  scoring: scored
  profile:
  - Level 2
  description: Do not allow unauthenticated SNMPv3 access.
  rationale: SNMPv3 provides much improved security over previous versions by offering options for Authentication and Encryption
    of messages. Authentication in SNMPv3 is performed using Keyed-Hash Message Authentication Code or HMAC. This technique
    uses a cryptographic hash function in combination with a secret key to authenticate and ensure the integrity of a given
    message. JUNOS supports the MD5 and SHA1 hash functions for use in SNMPv3 authentication. MD5 is an older protocol which
    has shown significant vulnerability in recent years, so the more recent and more trusted SHA1 should be used.
  impact: ''
  references:
  - 1. Creating SNMPv3 Users, JUNOS Software Network Management Configuration
  page_start: 198
  audit_raw: 'From the command prompt, execute the following command:

    [edit]

    user@host#show snmp v3 usm local-engine | match "authentication-sha" | count

    The above command should return a positive integer equal to the number of configured

    SNMPv3 "users".'
  remediation: 'For each SNMPv3 user created on your router add privacy options by issuing the following

    command from the [edit snmp v3 usm local-engine] hierarchy;

    [edit snmp v3 usm local-engine]

    user@host#set user <username> authentication-sha authentication-password

    <password>'
  checks:
  - type: sql
    command: show snmp v3 usm local-engine | match "authentication-sha" | count
    severity: medium
    info: 'From the command prompt, execute the following command:

      [edit]

