  description: Concurrent Web-Management sessions should be limited
  rationale: JUNOS Devices can be managed through a powerful Web Management GUI called JWeb. Operating the JWeb, or any other,
    management service uses resources on the device's Routing Engine (RE). An attacker may attempt to initialize a large number
    of management sessions concurrently in order to exhaust resources and achieve a Denial of Service (DoS) attack. To prevent
    this the maximum number of concurrent JWeb sessions should be set at 5 or less.
