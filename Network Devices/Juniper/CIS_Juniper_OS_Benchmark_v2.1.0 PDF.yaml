  impact: Some SSH Clients or other management applications or automation platforms utilizing SSH may not support the stronger
    ECDSA Key Signing standard, so may be unable to connect. Ensure that all applications are fully tested before deploying
    this recommendation in a production environment.
  references:
  - 1. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  - 2. Configuring SSH Service for Remote Access to the Router, JUNOS Software System
  page_start: 360
  audit_raw: 'Ensure that DSA Keys are explicitly disabled by issuing the following command at the [edit

    system services ssh] hierarchy:

    [edit system services ssh]

    user@host#show hostkey-algorithm | match "no-ssh-(dss|rsa|ed25519)" | count

    This command should return a value of 3.'
  remediation: 'To explicitly disable DSA, RSA and ED25519 signatures, type the following commands at

    the [edit system services ssh] hierarchy:

    [edit system services ssh]

    user@host#set hostkey-algorithm no-ssh-dss

    user@host#set hostkey-algorithm no-ssh-rsa

    user@host#set hostkey-algorithm no-ssh-ed25519

    Enable ECDSA for SSH Public Keys using the following commands:

    [edit system services ssh]

    user@host#set hostkey-algorithm ssh-ecdsa'
  checks:
  - type: sql
    command: show hostkey-algorithm | match "no-ssh-(dss|rsa|ed25519)" | count
    severity: medium
    info: 'Ensure that DSA Keys are explicitly disabled by issuing the following command at the [edit

      system services ssh] hierarchy:

      [edit system services ssh]

      user@host#show hostkey-algorithm | match "no-ssh-(dss|rsa|ed25519)" | count

      This command should return a value of 3.'
- id: 6.10.1.13
  title: Ensure SSH Key Authentication is Disabled
  scoring: manual
  profile:
  - Level 2
  description: SSH Key based Authentication should be disabled (if not used for automation)
  rationale: 'Due to the sensitive nature of SSH, potentially allowing full management of the targeted device, protecting
    SSH access using strong authentication methods is essential to the security of the device. One method which is supported
    in SSH for stronger authentication is the use of Public/Private Encryption Key Pairs in place of a more traditional login
    prompt for a Username and Password. Instead, an administrator uploads the user''s Public key to the JUNOS (or other) device
    to be managed. When the user connects, they will use their Private key to encrypt some session specific data. The JUNOS
    device can verify the Users identity by decrypting that data using the Public key configured previously and comparing
    it to an expected result. If the results match, then the user must have access to the Private key, so is considered valid.
    Unfortunately using SSH Keys to authenticate User Logins to JUNOS devices introduce a number of security issues:  Public
    Keys may only be configured locally on each JUNOS device  Public Keys are used instead of centralized AAA using TACACS+
    or RADIUS as covered in Recommendation 6.8.1 Ensure External AAA Server is set  The use of SSH Keys means only a single
    Authentication Factor (the keys) can be used, preventing the use of Multi Factor Authentication as covered in 6.6.14 Ensure
    Multi-Factor is used with External AAA  JUNOS does not provide any method to automate rollover or locking of keys. If
    keys are compromised/lost, they must be changed on every JUNOS device on which they are configured.  Some SSH implementation
    support the use of X.509 PKI Certificates for managing SSH Keys, but JUNOS does not.  Because of these limitations and
    the difficulty in auditing and managing SSH Keys on JUNOS devices, this method should not be used for Authentication of
    User logins or for the Root User. 363 | P a g e Due to these limitations, it is recommended that SSH Key based Authentication
    be disabled when it is not required to support automation systems. In some instances, such as when using PyEZ or NETCONF
    based automation over SSH, it may be preferable to authenticate a limited number of automation services using SSH Keys,
    rather than "hard coding" user details into scripts. Where this is the case, then this recommendation should not be implemented
    as it disables all use of SSH Key based Authentication. When using SSH Keys for automation, it is imperative to have strong
    key management procedures in use to control and audit access to the Private Keys used and a process to allow for rollover
    and revocation of compromised keys. Consider using a Centralized SSH Key Management solution when trying to achieve this
    at scale.'
  impact: Ensure that SSH Key based Authentication is not required for automation systems and that any User Logins previously
    using SSH Keys have been configured with an alternative authentication methods before disabling SSH Key based Authentication.
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  - 2. https://kb.juniper.net/InfoCenter/index?page=content&id=KB30588
  page_start: 363
  audit_raw: 'To confirm whether SSH Key based Authentication has been disabled, issue the following

    command from the [edit system services ssh] hierarchy:

    [edit system services ssh]

    user@host# show no-public-keys | count

    The command should return a line count of 1.'
  remediation: 'To disable the use of SSH Key based Authentication, issue the following command from the

    [edit system service ssh] hierarchy:

    [edit system services ssh]

    user@host# set no-public-keys'
  checks:
  - type: sql
    command: show no-public-keys | count
    severity: medium
    info: 'To confirm whether SSH Key based Authentication has been disabled, issue the following

      command from the [edit system services ssh] hierarchy:

      [edit system services ssh]

      user@host# show no-public-keys | count

      The command should return a line count of 1.'
- id: 6.10.2.1
  title: Ensure Web-Management is not Set to HTTP
  scoring: scored
  profile:
  - Level 1
  description: Network devices should not be managed using unencrypted HTTP sessions
  rationale: JWeb can be configured to provide a Web GUI over either HTTP or HTTPS. HTTP transmits all data (including passwords)
    in clear text over the network and provides no assurance of the identity of the hosts involved. Because of this HTTP should
    never be used for sensitive tasks such as managing network devices or entering login credentials and HTTP Web-Management
    should be disabled.
  impact: Ensure that management using HTTPS or other secure methods is configured and working before disabling HTTP access.
    Otherwise you may be unable to connect back to the device for management.
  references:
  - 1. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  page_start: 367
  audit_raw: 'From the command prompt, execute the following command from the [edit system

    services web-management] hierarchy:

    [edit system services web-management]

    user@host#show | match "http" | count

    This should return a line count of 0.'
  remediation: 'To disable HTTP access issue the following command from the [edit system services

    web-management] hierarchy:

    [edit system services web-management]

    user@host#delete http

    367 | P a g e'
  checks:
  - type: manual_review
    info: 'From the command prompt, execute the following command from the [edit system

      services web-management] hierarchy:

      [edit system services web-management]

      user@host#show | match "http" | count

      This should return a line count of 0.'
    severity: medium
- id: 6.10.2.2
  title: Ensure Web-Management is Set to use HTTPS
  scoring: scored
  profile:
  - Level 1
  description: JWeb should only be accessed using HTTPS
  rationale: JWeb can be configured to provide a Web GUI over either HTTP or HTTPS. HTTP transmits all data (including passwords)
    in clear text over the network and provides no assurance of the identity of the hosts involved. Because of this HTTP should
    never be used for sensitive tasks such as managing network devices or entering login credentials and HTTPS should be configured
    for WebManagement instead.
  impact: Ensure an alternative method to manage the JUNOS device is configured and working prior to changing the Certificate
    used for HTTPS to ensure continued access in the event of any errors.
  references:
  - 1. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  - https://www.pcisecuritystandards.org/documents/PCI_DSS_v3-2-1.pdf
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/topic-map/securitydigital-certificates-with-pki-overview.html
  page_start: 369
  audit_raw: 'To confirm if HTTPS is configured for Web-Management, enter the following command

    from the [edit system services web-management] hierarchy:

    [edit system services web-management]

    user@host#show | match "https {" | count

    The command should return a line count of 1.'
  remediation: 'To enable HTTPS access using the System Generated "Self Signed" Certificate, issue the

    following command from the [edit system service web-management] hierarchy;

    [edit system services web-management]

    user@host#set https system-generated-certificate

    369 | P a g e

    Alternatively, you may which to use a Local Certificate which is stored in the device''s

    Configuration File:

    [edit system services web-management]

    user@host#set https local-certificate <Certificate Name>

    <Certificate Name> should match an X.509 Certificate loaded under the [edit security

    certificates] hierarchy as shown below:

    [edit security certificates]

    user@host# set <Certificate Name> load-key-file <File Name/URL>

    Where <File Name/URL> is either the name and path of a local Certificate and Key Pair file,

    or the URL from which the file can be fetched.

    Note - This method leaves the Certificate and Private Key as part of the devices

    Configuration file, potentially exposing them. This is not the preferred method to configure

    a certificate in most instances.

    Finally, you can configure JUNOS to use a PKI-Certificate:

    [edit system services web-management]

    user@host#set https pki-local-certificate <Certificate Name>

    Where <Certificate Name> is an X.509 Certificate which has already been loaded to the

    JUNOS device''s local PKI store.'
  checks:
  - type: manual_review
    info: 'To confirm if HTTPS is configured for Web-Management, enter the following command

      from the [edit system services web-management] hierarchy:

      [edit system services web-management]

      user@host#show | match "https {" | count

      The command should return a line count of 1.'
    severity: medium
- id: 6.10.2.3
  title: Ensure Web-Management is Set to use PKI Certificate for HTTPS
  scoring: scored
  profile:
  - Level 2
  description: JWeb should only be accessed using HTTPS with a PKI Certificate
  rationale: 'JWeb can be configured to provide a Web GUI over either HTTP or HTTPS. When configured to use HTTPS X.509 Certificates
    are used to:  Share Public Encryption Keys  Provide Identity Information  Validate the Web Server''s Identity  Enforce
    Encryption Key Rollover by limiting their validity period JWeb can be configured to use Self Signed "System-Generated"
    X.509 Certificates, where the JUNOS device makes an identity claim, such as "I am myrouter.myorg.com", without any external
    validation. When an administrator connects to JWeb their browser will generate a Security Error due to this lack of validation,
    which the user will need to accept in order to proceed to the interface. Without validation from a trusted Certificate
    Authority (CA), either an Internal or Public CA, administrators may be unable to detect when a management session is being
    intercepted or impersonated by an attacker. Additionally, a Self Signed certificate cannot be centrally revoked should
    a compromise be detected, relying instead on each user manually removing trust for the compromised Certificate. A Certificate
    Authority is a Trusted Third Party which validates X.509 Certificates by signing them, using a secure Hashing algorithm
    and their own Private Key. A CA may be part of an organization''s internal Public Key Infrastructure (PKI) or an Public
    CA service such as those provided by Verisign, Entrust or Microsoft. Commonly, for signing Certificates used for internal
    management and systems, Organizations will configure their own PKI rather than paying for Public CA Services - configuring
    their End Points to trust Certificates signed by their CA through Group Policy or similar methods. 372 | P a g e Either
    option is equally acceptable for use with JWeb, but Self Signed Certificates should not be used. In addition, JUNOS offers
    two options for the storage and management of Certificates and their associated Private Keys:  in the configuration under
    the [edit security certificates] hierarchy  in a protected PKI store in memory While the keys are hashed when stored
    in the configuration file, they are still exposed through backups and management access to the device. Storing Certificates
    and Keys in the device''s PKI store means that the Private Keys are never accessible and that additional protections to
    this restricted area of memory can be used. Due to these limitations PKI Certificates from a trusted Certificate Authority
    should always be used for JWeb Management and should always be stored in the device''s PKI store rather than local configuration.'
  impact: Ensure an alternative method to manage the JUNOS device is configured and working prior to changing the Certificate
    used for HTTPS to ensure continued access in the event of any errors.
  references:
  - 1. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/topic-map/securitydigital-certificates-with-pki-overview.html
  page_start: 372
  audit_raw: 'To confirm if HTTPS for Web-Management is configured to use a PKI Certificate, enter the

    following command from the [edit system services web-management] hierarchy:

    [edit system services web-management]

    user@host#show https | match "pki-local-certificate" | count

    The command should return a line count of 1.'
  remediation: 'To configure Web-Management with a PKI Certificate issue the following command from

    the [edit system service web-management] hierarchy:

    [edit system services web-management]

    user@host# set https pki-local-certificate <Certificate ID>

    Where <Certificate ID> is the name of a Certificate which has already been loaded to the

    devices PKI Store.

    373 | P a g e

    To create a new Public/Private Key Pair in the devices PKI Store and generate Certificate

    Signing Request issue the following commands from Operational Mode:

    user@host> request security pki generate-key-pair certificate-id <Certificate

    ID> type <Algorithm> size <Size>

    user@host> request security pki generate-certificate-request certificate-id

    <Certificate ID> domain-name <Device DNS Name> subject <Device Subject DN>

    Where:

     <Certificate ID> is the Name that will be used for this Certificate throughout

    configuration

     <Algorithm> is the Encryption Algorithm to be used (this should be either RSA or

    ECC)

     <Size> is the number of Bits used for the keys (use at least 2048bits for RSA or

    256bits for ECC)

     <Device DNS Name> is the FQDN which will be used to manage the device and

    -<Device Subject DN> is the Distinguished Name used to identify this device and

    certificate.

    Optionally, fields for email address, the device''s IP Address and and output Filename for

    the PKCS#10 CSR which will be generated can be included.

    The CSR should then be submitted to the Certificate Authority for review and signing.

    Once the CA returns the Certificate it can be uploaded to the JUNOS device and imported

    with the following command from Operational Mode:

    user@host> request security pki local-certificate load certificate-id

    <Certificate ID> filename <File Upload Location>'
  checks:
  - type: sql
    command: show https | match "pki-local-certificate" | count
    severity: medium
    info: 'To confirm if HTTPS for Web-Management is configured to use a PKI Certificate, enter the

      following command from the [edit system services web-management] hierarchy:

      [edit system services web-management]

      user@host#show https | match "pki-local-certificate" | count

      The command should return a line count of 1.'
- id: 6.10.2.4
