    the [edit system ports] hierarchy:

    [system ports]

    user@host#show console | match disabled | count

    The command should return a line count of 1 if the Console Port has been disabled.

    443 | P a g e'
  remediation: 'To disable the Console Port, issue the following command from the [edit system ports]

    hierarchy;

    [edit system ports]

    user@host#set console disabled'
  checks:
  - type: sql
    command: show console | match disabled | count
    severity: medium
