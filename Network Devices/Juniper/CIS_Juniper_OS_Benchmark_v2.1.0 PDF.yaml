controls:
- id: '1.1'
  title: Ensure Device is running Current Junos Software
  scoring: manual
  profile:
  - Level 1
  description: All JUNOS Devices should run the current Recommended Release of JUNOS.
  rationale: As with any software, the JUNOS Operating System installed on Juniper Devices may be subject to Bugs, Instabilities
    and Security Vulnerabilities discovered over time. Juniper periodically issues software patches for all Juniper Devices
    which are currently supported, and for which the operating organization has a valid support contract. All JUNOS Devices
    in a production network should be kept up to date based on Security Advisories issued by the Juniper Networks Security
    Incident Response Team (SIRT). SIRT publishes non-urgent Security Bulletins on a predefined quarterly schedule, but may
    also issue out-of-cycle Security Advisories in response to more urgent events such as malicious exploitation of Zero Day
    vulnerabilities, as described in Juniper Knowledge Base Article KB16613. A list of Security Advisories can be viewed on
    the Juniper Knowledge Base here or as an RSS Feed here. No login is required, but additional information is available
    to users with a Juniper CSC or SSO account. If you have a Login to the Juniper Customer Portal, you can Subscribe to Knowledge
    Base articles or to SIRT Security Advisories for your platform/s by going to the Manage My Subscriptions section. You
    can also subscribe the RSS Feed to be notified of new Security Advisories without any login being required. Organizations
    which utilize the Junos Space central management platform can use Service Insight to get proactive notifications for SIRT
    Advisories and End of Life Notifications impacting their managed, supported systems. All administrators responsible for
    management of Junos devices should ensure that they have a process to keep up to date on SIRT Security Advisories and
    apply necessary patches in a timely manner. 18 | P a g e For new device deployments, Juniper provide a regularly update
    list of supported Junos Software called the Junos Software Versions - Suggested Releases to Consider and Evaluate (formally
    known as the JTAC Recommended Release). The Suggested Release is specified for each currently supported platform in Juniper
    Knowledge Base Article KB21476 and is intended as a starting point to help customers select a Junos Software version that
    meets their deployment needs and can be readily supported by JTAC should assistance be required. The Junos Software Versions
    - Suggested Releases to Consider and Evaluate Knowledge Base article is regularly updated by Juniper and typically reflects
    current Security Advisories at the time of posting, but it is strongly recommended that administrators using the Suggested
    Releases as a starting point should always check for any subsequent Security Advisories which may have been issued in
    the interim to select the best version to deploy.
  impact: During updates JUNOS Devices reboot to load the new software. In some instances this may result in loss of service.
    Please refer to the documentation for your platform before attempting to update software.
  references:
  - 1. https://kb.juniper.net/InfoCenter/index?page=content&id=KB21476
  - 2. https://kb.juniper.net/InfoCenter/index?page=content&id=KB16613&actp=META
  page_start: 18
  audit_raw: 'This is an example process for deploying a new Junos device or for implementing patch

    management for the first time within an existing network.

    For Junos systems already deployed in a production network, SIRT Security Advisories

    should be used to determine when additional patches are required on an ongoing

    basis.

    Step 1: Collect the router chassis information

    user@host> show version | match model

    Example:

    root@LAB-SRX300> show version | match model

    Model: srx300

    This device is an SRX300

    Step 2: Check the software version running on the device

    user@host> show version | match JUNOS

    19 | P a g e

    Example:

    root@LAB-SRX300> show version | match JUNOS

    Junos: 15.1X49-D150.2

    JUNOS Software Release [15.1X49-D150.2]

    root@LAB-SRX300>

    For some devices, such as MX Routers, a large number of software components will be

    returned from the previous command. This can be filtered by looking for the "JUNOS Base"

    software

    Example:

    user@LAB-MX> show version | match "Base"

    JUNOS Base OS boot [10.4R8.5] JUNOS Base OS Software Suite [10.4R8.5]

    The Base OS software version on this MX Router is Junos 10.4R8.5

    Step 3: Confirm that the installed Junos Release is still supported by Juniper

    Visit Junos OS Dates & Milestones, where Juniper maintain a list of the support periods

    (during which Security Advisories and patches will be issued) for each Junos release.

    Step 4: If the installed release has reached End of Engineering (EoE), select

    replacement release:

    When a product or software release reaches the End of Engineering (EoE) date, it will no

    longer be actively maintained by Juniper and no new patches or other releases will be

    issued.

    In selecting a replacement the Junos Software Versions - Suggested Releases to Consider and

    Evaluate will be used as a starting point in most deployments. The current Junos Software

    Versions - Suggested Releases to Consider and Evaluate can be found in

    http://kb.juniper.net/InfoCenter/index?page=content&id=KB21476&cat=&actp=LIST, and

    is regularly updated by Juniper.

    Alternatively, you may wish to used Juniper Pathfinder tool at

    https://https://pathfinder.juniper.net/ to select a release that supports the features

    required by your environment.

    Step 5: Check for any Juniper Security Incident Response Team (SIRT) Security

    Advisories which apply to the selected release:

    Juniper Security Advisories can be found on the Knowledge base at

    https://kb.juniper.net/InfoCenter/index?page=content&channel=SECURITY_ADVISORIES

    If the Junos device is running a supported version and no SIRT Security Advisories

    apply, the device is compliant.

    Example Process:

    The SRX300 shown in the sample output above is running Junos version 15.1X49-D150.2.

    Checking the Junos OS Dates & Milestones page, we find that the 15.1X49 release reaches

    20 | P a g e

    End of Engineering on 31st December 2020.

    I am checking in June 2020, so at the time of writing this version is still supported. However

    newer versions with improved features are available, so I opt to look at the Junos Software

    Versions - Suggested Releases to Consider and Evaluate Knowledge Base article.

    The Suggested Release for the SRX300 is currently Junos 18.4R3-S2 and this was last

    updated on the 24th of April 2020.

    Finally, I will check for Security Advisories applying to the SRX300 since this date. At the

    time of writing the most recent Security Advisory that applies was JSA11021.

    Looking at the advisory we can see that this applied to "18.4 versions prior to 18.4R1-S7,

    18.4R3-S2", so the current JTAC Recommended Release includes this patch and would be

    compliant with this recommendation. I can request this software image from Juniper or

    from my Support Partner.

    If I wanted to stay on the 15.1X49 release, then the same advisory informs me that

    "15.1X49 versions prior to 15.1X49-D211, 15.1X49-D220" are impacted, so I could

    alternatively request this release from Juniper and remain complaint with this

    recommendation.'
  remediation: 'Software patching procedures may vary between different platforms or organizations and

    can be accomplished using the CLI, the JWeb GUI, centrally through Junos Space or other

    management platforms.

    To update a standalone JUNOS Device through the CLI, first upload the desired software

    image (downloaded from Juniper or your Support Partner) to the JUNOS Device in the

    /var/tmp/ folder.

    In most cases an upgrade is performed with the following command, issued from

    Operational Mode:

    user@host> request system software add /var/tmp/<image name>

    Where <image name> is the filename of the JUNOS image provided by Juniper.

    NOTE - Updating JUNOS Software with this command will result in a reboot of the system

    and loss of service.

    In platforms deployed with redundant Routing Engines, as Virtual Chassis or as HA

    Clusters, an In-Service Software Updates (or ISSU) may be supported. An ISSU update

    updates and reboots each node or RE separately, failing services on to the other node/RE

    prior to the reboot.

    To perform an ISSU Update, on most platforms, issue the following command from

    Operational Mode:

    user@host> request system software in-service-upgrade /var/tmp/<image name>

    21 | P a g e

    NOTE - The specific procedure and prerequisites for ISSU varies by platform and deployment

    type. If some prerequisites (such as NSR or GRES) are not correctly configured a loss of

    service may still occur.

    Please refer to the documentation for your platform and network enviroment before

    attempting to update software.'
  checks:
  - type: sql
    command: show version | match model
    severity: medium
    info: 'This is an example process for deploying a new Junos device or for implementing patch

      management for the first time within an existing network.

      For Junos systems already deployed in a production network, SIRT Security Advisories

      should be used to determine when additional patches are required on an ongoing

      basis.

      Step 1: Collect the router chassis information

      user@host> show version | match model

      '
- id: '1.2'
  title: Ensure End of Life JUNOS Devices are not used
  scoring: manual
  profile:
  - Level 1
  description: EoL JUNOS Devices should never be used in production networks
  rationale: 'As with most vendors, Juniper Networks only support individual versions of Software and Hardware for a certain
    period of time in order to allow resources to be spent developing new products, rather than supporting old ones and because
    new features and technologies may not be supportable on older hardware. Juniper will announce that support for a device,
    software version or platform is being discontinued by issuing an End of Life Notice for the product being retired. A typical
    EOL Notice will include details of:  Notification Date - The official date that the EOLN was issued, all other timings
    are based on this date.  LOD - the Last Order Date for the product - typically this is 180 days after the EOLN. After
    LOD, no new support services or contracts for the product can be purchased.  LSV - the Last Software Version which will
    be supported for the product  EOSE - the End of Software Engineering. After this date Juniper will not offer new bug
    fixes or software patches for the product. Typically this is 3 years after the EOLN.  LRD - the Last Renewal Date. After
    this date, existing support contracts and services for the platform can no longer be renewed. Typically this is 4 years
    after the EOLN.  EOS - the End of Support. Juniper will no longer provide any support or replacements for the platform.
    Typically this is 5 years after the EOLN. Once a device has reached EOSE state, Juniper may no longer offer any patches,
    bug fixes or fixes for security vulnerabilities. This makes the device essentially unsupportable in a production environment,
    as any serious vulnerability discovered could not be patched. It may not be practical in most cases to provide a work
    around without impacting services and it is rarely possible to instantly retire or replace affected platforms in response
    to a newly discovered vulnerability. This would leave networks vulnerable with no prospect of a timely fix. 23 | P a g
    e You can confirm the current support status of your device by going to the Juniper Serial Number Entitlement Tool and
    entering the device Serial Number/s. Note, you may need to add columns to the default output to display EoL and EoS status.
    You can also search End of Life Notices by platform or software version from the Juniper End of Life Products & Milestones
    page'
  impact: EOL Devices of any type present a significant risk to the security of the network.
  references:
  - 1. https://support.juniper.net/support/pdf/eol/990833.pdf
  - 2. https://support.juniper.net/support/eol/
  page_start: 23
  audit_raw: 'It is essentially that administrators follow Juniper EOLN announcements and plan to retire

    all EoL platforms following the timeline given in the EOLN by the EOSE date to ensure that

    this situation does not occur.

    You can subscribe to EOL Notices in the Juniper Knowledge Base by logging in with your

    Juniper Customer Account, navigating to "Manage Subscriptions" and adding "EOL" to

    "Technical Bulletins" Subscriptions. Juniper will automatically email you a notification

    when a new EOLN is issued.

    A full list of current EOLNs is also available here: https://support.juniper.net/support/eol/'
  remediation: Administrators should plan to retire all JUNOS Devices before they reach EOS/EOSE
  checks:
  - type: manual_review
    info: 'It is essentially that administrators follow Juniper EOLN announcements and plan to retire

      all EoL platforms following the timeline given in the EOLN by the EOSE date to ensure that

      this situation does not occur.

      You can subscribe to EOL Notices in the Juniper Knowledge Base by logging in with your

      Juniper Customer Account, navigating to "Manage Subscriptions" and adding "EOL" to

      "Technical Bulletins" Subscriptions. Juniper will automatically email you a notification

      when a new EOLN is issued.

      A'
    severity: medium
- id: '1.3'
  title: Ensure device is physically secured
  scoring: manual
  profile:
  - Level 1
  description: Network Devices should be physically secured.
  rationale: As with most information assets, it is vital that an attacker is prevented from gaining physical access to your
    Juniper JUNOS Devices. With physical access an attacker may bypass firewalls by re-patching systems, power off your Device
    or connect to Console ports. It is possible with almost all network equipment to reset the Root password if you have physical
    access. Recommendations elsewhere in this document provide some mitigation against these attacks by, for example, Encrypting
    Configuration files and disabling Auxiliary Ports, but preventing or detecting physical access to your network devices
    should still be a fundamental element of a defense in depth strategy.
  impact: ''
  references:
  - 1. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  - 2. Router Security Configuration Guide, Version 1.1b, Section 3.1.1 (page 33), National
  page_start: 25
  audit_raw: Conduct physical inspection of device and ensure it is physically secure.
  remediation: 'While preventing all physical access is nearly impossible in some deployment scenarios,

    such as for a Service Provider supplying Customer Premises Equipment (CPE), in most

    cases the following minimum steps should be considered:

     The JUNOS Device should be deployed in a secure, locked room.

     Access logs should be maintained for the room, either electronically through use of

    access cards or through a manual process for access to the key.

     Access to the room should be limited to only those personnel absolutely required.

     Use of CCTV to monitor sensitive areas and comms rooms.

     The room should ideally be equipped with Uninterruptible Power Supply (UPS) and

    cooling facilities as well as be free from Electromagnetic Interference sources. Loss

    of power (either malicious or accidental) or cooling can result in a loss of service.

    25 | P a g e

    These methods should be a bare minimum and other physical security options considered

    when protecting a JUNOS Device which processes or transits sensitive data, such as

    Encryption Keys, Credit Card or Personally Identifiable Information which may be in scope

    for regulatory/industry compliance standards such as PCI DSS, GDPR or HIPAA.

    In these situation Secure Hosting or Co-Location Facilities may be required and options

    considered for Physical Security should include:

     24/7 Security Guards and Monitoring

     Biometric and/or Multi Factor access control

     Private Caged areas for secure equipment

     Additional alarm and monitoring systems to detect equipment being removed from

    racks'
  checks:
  - type: manual_review
    info: Conduct physical inspection of device and ensure it is physically secure.
    severity: medium
- id: '1.4'
  title: Ensure configuration is backed up on a regular schedule
  scoring: manual
  profile:
  - Level 1
  description: Regular backups should be made of the router.
  rationale: Backups of a routers configuration may be necessary when recovering from physical hardware failure, administrative
    errors or a successful attack. Preserving the evidence of an attack may also be necessary for regulatory compliance, forensic
    investigation or prosecution of the attacker. By default, JUNOS routers save a local backup copy of your configuration
    every time you commit (save) a change. JUNOS maintains the 50 previous configuration files, 4 on the Routing Engines Flash
    drive and the remainder on the hard disk. This provides a useful method to recover from many types of fault or error,
    however an attacker will, potentially, be in a position to compromise these backups along with the active configuration,
    so it is vital that you also keep a remote configuration backup beyond the attackers reach.
  impact: ''
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Section 3.3.4 (page 45), National
  page_start: 27
  audit_raw: ''
  remediation: 'A discussion of all possible backup methods is beyond the scope of this Benchmark.

    Consider the Archival section of this Benchmark for one method of obtaining remote

    backups whenever your configuration is changed.

    CVS tools such as RANCID provide an alternative method to backup and manage

    configuration files from a central location as well as keeping track of changes over time.

    Also consider a method of maintaining offline copies of your backup data, such as tape

    storage. This provides a vital tool in Disaster Recovery and is also extremely helpful when

    recovering from a successful attack, as you can be certain that the attacker was unable to

    alter the offline version.'
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: '1.5'
  title: Ensure backup data is stored and transferred securely
  scoring: manual
  profile:
  - Level 1
  description: Backups of router configuration should be secured.
  rationale: If an attacker has access to your router configuration files they have gained a lot of sensitive information
    about your network topology, defenses, weaknesses, critical servers and possibly your VPN keys and login information.
  impact: ''
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Section 3.3.4 (page 45), National
  page_start: 29
  audit_raw: ''
  remediation: 'A discussion of securing your backup services is beyond the scope of this Benchmark, but at

    a minimum you should consider the following:

     Never transfer configuration files using plain text protocols such as Telnet or FTP.

    Use SSH or SCP instead.

     Restrict access to backups to the least number of administrative users possible.

     Store offline backups in a physically secure, fire resistant, air tight safe.

     Log access and changes to backups.

     Secure any server that stores backups using the appropriate Center for Internet

    Security Benchmark.

     Disable all unused services on the backup server.'
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: '1.6'
  title: Ensure maximum RAM is installed
  scoring: manual
  profile:
  - Level 1
  description: The router should have the maximum RAM installed.
  rationale: Some Denial of Service attacks rely on exhausting the target routers memory resources by bombarding the router
    with bogus requests or traffic, when the router runs out of memory it will stop being able to service genuine requests
    and may be unable to perform critical tasks like maintaining route tables. Juniper routers are somewhat more resilient
    to this type of attack then some other systems due to the separation of the Control and Forwarding planes, but attacks
    against router services may still cause disruption.
  impact: ''
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Section 3.1.1 (page 34), National
  page_start: 30
  audit_raw: ''
  remediation: 'Installing the most RAM available for your system will both help to mitigate these attacks

    and boost performance of your routers. In most cases RAM upgrades are extremely cost

    effective way to increase router performance and survivability.'
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: '1.7'
  title: Ensure logging data is monitored
  scoring: manual
  profile:
  - Level 1
  description: Logs and events should be monitored.
  rationale: 'Even after you have applied all of the settings in this guide, there is no such thing as perfect security. All
    systems are potentially vulnerable, be it to undiscovered software bugs, social engineering or other risks. System logs,
    SNMP traps and any other information generated by your network devices should be monitored for changes and suspicious
    activity at least daily. Remember that your TACACS+ or RADIUS server may also produce logs detailing logins and what commands
    users issue. If your systems produce more logging then you can actively monitor, consider using a Security Information
    and Event Manager type system. SIEM software consolidates and analyzes log information from across your organization,
    detecting security incidents and providing detailed, joined up information to aide your incident response and investigation.
    Some popular SIEM systems include:  Juniper Secure Analytics (JSA)  RSA NetWitness  IBM QRadar (Which is also the basis
    of the Juniper JSA product)  AlienVault USM  OSSIM (now also operated by AlienVault)  Splunk This is not intended as
    a recommendation of individual SIEM or SIM products, nor as an exhaustive list. 1. Watch your Internet Routers!, Internet
    Storm Center Diary, SANS Institute https://isc.sans.org/diary.html?storyid=6100 2. Payment Card Industry Data Security
    Standard (PCI DSS), Version 3.2.1, Requirement 10.6 31 | P a g e'
  impact: ''
  references: []
  page_start: 31
  audit_raw: ''
  remediation: ''
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: '1.8'
  title: Ensure Retired JUNOS Devices are Disposed of Securely
  scoring: manual
  profile:
  - Level 1
  description: JUNOS Devices must be disposed of securely
  rationale: 'As with all systems, there will come a point where a JUNOS Device has reached the end of it''s service and must
    either be redeployed, recycled or disposed of. JUNOS Devices used in production will typically contain a significant store
    of sensitive information, which may include:  Configuration details about your network and services  Sensitive or Personal
    data traversing the network, stored in packet captures, trace output or log files  Hashed Passwords and Shared Secrets
    for users, management platforms or Virtual Private Networks  Encryption Keys and other sensitive keying material used
    for IPSEC VPNs, X.509 Certificates or other uses Attackers may attempt to gain information on potential targets or sensitive
    data by acquiring retired network devices and servers through theft, recycling services or online auctions. It is not
    uncommon to purchase used JUNOS Devices on sites like Ebay and find that the old configuration, encryption keys, licenses
    and other details are still present.'
  impact: ''
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/topics/reference/command
  page_start: 33
  audit_raw: ''
  remediation: 'To ensure that sensitive data is not lost when disposing of or redeploying retired JUNOS

    Devices, it is essential that the system be fully zeroized. This process returns the system to

    its original factory default state, with no root password set and all configuration, backups,

    user specified options, encryption keys, etc deleted.

    To zeroize a JUNOS Device, log in as a user with the maintenance permission or as root and

    issue the following command from Operational Mode:

    root@host>request system zeroize media

    33 | P a g e

    The media option used above also undertakes a process to securely "scrub" onboard

    memory and persistent media (such as flash, HDDs or SSDs) using a method equivalent to

    "clearing" as specified in NIST SP800-88. Using the media option will take significantly

    more time, as it repeatedly overwrites every area of storage with random data, but is

    strongly recommended for all devices where the option is supported.

    An increasing number of JUNOS Devices, such as the PTX5000 Series and some MX Series

    routers, utilize a Disaggregated JUNOS Operating System which hosts JUNOS as a Virtual

    Machine abstracting it from the physical Routing Engine hardware. In some instances the

    request system zeroize command will zeroize the Guest JUNOS VM only, and not the

    underlying Host OS. For these platforms the following command should be used from

    Operational Mode:

    root@host>request vmhost zeroize

    This command will clear both the JUNOS VM and the Host OS.

    When some devices, such as EX or QFX Series, are deployed in Clusters, HA or Virtual

    Chassis environments the request system zeroize media command may be ignored or

    may operate on only the local node, so will need to be issued individually on each device

    being disposed of.

    Ensure you check the current documentation for the request system zeroize command

    for your platform to ensure that all options are correctly specified and perform the

    operation as intended.

    Where possible, devices which are being "returned to base" from a deployment using third

    parties for transport should be zeroized before shipping.'
  checks:
  - type: manual_review
    info: Manual audit procedure required by CIS standard.
    severity: medium
- id: '2.1'
  title: Ensure "Protect RE" Firewall Filter is set for inbound traffic to the Routing Engine
  scoring: manual
  profile:
  - Level 1
  description: Traffic to the Routing Engine should be filtered.
  rationale: JUNOS Devices can provide a wide range of services to the network and, as with any computer system, the more
    services that are offered and the more hosts to which they are available, the wider attack surface is offered to a potential
    attacker. To help protect the Junos Device from attack a Firewall Filter should be applied to all inbound traffic, restricting
    the services available and the hosts trusted to connect to them. Filtering traffic also removes potential resource usage,
    processing unwanted traffic or unused services. On Junos, Transit Traffic (traffic passing through the Junos Device) is
    processed by the Data Plane (often referred to as the PFE). Traffic destined to the Junos Device itself, such as SSH sessions,
    SNMP Polling or Routing Protocol updates, is known as Exception Traffic. Exception Traffic is passed to the Routing Engine,
    which is represented by the Loopback interface Lo0, for processing. By default traffic received on any interface to an
    address owned by the Junos Device will be passed to the RE and can connect to a service, such as SSH, if it is running.
    By applying a Firewall Filter to inbound traffic on the Loopback interface, we can filter traffic to the RE arriving on
    any interface (whether a transit interface or a dedicated Out of Band Management Interface like fxp0). This Firewall Filter
    is commonly referred to as a "Protect RE" filter and is often named as such, though does not have to be. Filters should
    be applied for every address family configured on the Junos Device. For example, a Router configured with both IPv4 (family
    inet) and IPv6 (family inet6) addresses on any interfaces should have inbound Firewall Filters applied to the Loopback
    interface for both address families. A full discussion of Firewall Filter design and evaluation is beyond the scope of
    this Benchmark, but is covered in more detail in Chapter 4 of the Juniper DayOne book 36 | P a g e Hardening Junos Devices
    2nd Edition, available for free from the Juniper DayOne Tech Libary. At a minimum a Firewall Filter should be applied
    which restricts management services to trusted hosts, while accepting all other traffic so as not to interfere with normal
    function of protocol updates and services. This is not a suitable approach in high security environments, where a default
    discard/deny should be used along with other restrictions covered in separate Level 2 Recommendations in this section.
    For devices with multiple Loopback Interface Units configured in different Routing Instances, Logical Systems or similar,
    Firewall Filters should be applied inbound for all configured Loopback units.
  impact: Firewall Filters should be carefully tested before implementation on production systems as incorrect configuration
    may prevent normal services functioning. It is strongly recommended that changes to Firewall Filters are applied using
    commit confirmed so that changes will be automatically rolled back should they prevent the administrator from connecting
    to the Junos Device.
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Section 4.4.1 (page 55), National
  - 2. [Firewall Filter Overview, JUNOS Software Policy Framework Configuration Guide,
  - https://www.oreilly.com/library/view/junos-cookbook/0596100140/
  page_start: 36
  audit_raw: 'At a minimum a Firewall Filter should be applied for each configured IP protocol version.

    NOTE - This audit procedure only checks that Firewall Filters are applied, not that the filters

    are correctly configured.

    To check if any IPv4 (inet) or IPv6 (inet6) processing is configured on the devices

    interfaces issue the following commands from the [edit] configuration hierarchy:

    [edit]

    user@host#show interfaces | match "family inet " | count

    user@host#show interfaces | match "family inet6 " | count

    Output from the first command reflects the number of interfaces configured for IPv4

    processing, output from the second command the number of interfaces configured for IPv6.

    Note that the space after family inet in the first command is required in order to match

    correctly.

    Next, confirm that an input filter is configured for each configured address family:

    [edit]

    user@host#show interfaces lo0 | display set | match "filter input"

    37 | P a g e

    If the system is configured for IPv4 only, then a filter must be returned for family inet.

    If the system is configured for IPv6 only, then a filter must be returned for family inet6.

    For Dual Stack systems, configured for both IPv4 and IPv6 processing, filters must be

    returned for both address families.

    NOTE - For SRX Firewalls, Security Policy using the junos-host zone as a destination may be

