    management services, such as SNMPv3, should be restricted such as to only be reachable through the Out of Band management
    port which is available on most JUNOS platforms. The name of the Out of Band Management port varies considerably between
    platforms, typically:  fxp[0-9] on most routing platforms and SRX firewalls  me[0-9] on most EX and some QFX switches
     em[0-9] on some EX and QFX switches  jmgmt0 on NFX platforms'
