- id: 6.5.3
  title: Ensure ICMP Source-Quench is Set to Disabled
  scoring: scored
  profile:
  - Level 1
  description: ICMP Source Quench messages should be ignored.
  rationale: ICMP Source Quench messages are intended to allow a host to request that a peer with which it is communicating
    slows down the transmission of new data because the host is being overwhelmed. Several recorded vulnerabilities have shown
    how Source Quench messages may be abused by an attacker to create a DoS attack, causing the router to slow down transmission
    of data to one, several or all destinations. Due to these vulnerabilities, and the general ineffectiveness of Source Quench
    for congestion control, RFC6633 deprecated its use and ICMP Source Quench should be disabled.
  impact: ICMP Source Quench is deprecated and there is no valid reason for ICMP Source Quench to be present on a modern network.
  references:
  - 1. Configuring Source Quench, JUNOS 9.3 System Basics Configuration Guide, Juniper
  - 2. http://www.kb.cert.org/vuls/id/222750
  page_start: 238
  audit_raw: 'To confirm whether ICMP Source Quench Requests will be dropped, enter the following

    command from the [edit system internet-options] hierarchy:

    [edit system internet-options]

    user@host#show no-source-quench | count

    A line count of 1 should be returned, indicating that the ICMP Source Quench is Set to

    Disabled.'
  remediation: 'Configure the JUNOS Device to ignore ICMP source-quench messages by issuing the

    following command from the [edit system internet-options] hierarchy.

    [edit system internet-options]

    user@host#set no-source-quench

    238 | P a g e'
  checks:
  - type: sql
    command: show no-source-quench | count
    severity: medium
