      "Protect RE" Firewall Filters should be set for ingress traffic on all Loopback interfaces as

      discussed in Recommendation 2.1 Ensure "Protect RE" Firewall Filter is set for inbound

      traffic to the Routing Engine for IPv4 (inet) '
- id: '2.5'
  title: Ensure "Protect RE" Firewall Filter includes Flood Attack Protection terms
  scoring: manual
  profile:
  - Level 2
  description: Flood Attack protection should be included in the "Protect RE" Filter
  rationale: As with any computer system connected to a network, an attacker may attempt to overwhelm the resources of a Junos
    device by flooding it with unwanted traffic, consuming resources and potentially resulting in a Denial of Service (or
    DoS) Attack. Filtering traffic sources and the available services using a "Protect RE" filter as discussed elsewhere in
    this section helps to limit the scope for an attack, but flood attacks using TCP SYN packets, ICMP or other protocols
    may still be possible. To prevent this Rate-limiting can be applied to the Firewall Filter by configuring a policer to
    new terms matching the potential attack traffic. A full discussion of how Rate-limiting is configured and implemented
    in Junos, and across different specific chipsets and platforms, is beyond the scope of this Benchmark. The Junos DayOne
    books Deploying Basic QoS and Hardening Junos Devices, 2nd Edition are available for Free from the Juniper website and
    provide excellent coverage of QoS/CoS techniques and the application of Rate-limiting to Firewall Filters respectively.
  impact: Firewall Filters should be carefully tested before implementation on production systems as incorrect configuration
    may prevent normal services functioning. It is strongly recommended that changes to Firewall Filters are applied using
    commit confirmed so that changes will be automatically rolled back should they prevent the administrator from connecting
    to the Junos Device.
  references:
  - '1. *Recipe 15: Low-Risk Methodology for Deploying Firewall Filters* in the [Day One:'
  - 2. [Firewall Filter Overview, JUNOS Software Policy Framework Configuration Guide,
  page_start: 60
  audit_raw: "Due to the range of options available for Management Service selection, management\nsubnets and filter design,\
    \ it is not possible to automatically score this recommendation.\n\"Protect RE\" Firewall Filters should be set for ingress\
    \ traffic on all Loopback interfaces as\n60 | P a g e\ndiscussed in Recommendation 2.1 Ensure \"Protect RE\" Firewall\
    \ Filter is set for inbound\ntraffic to the Routing Engine for IPv4 (inet) and IPv6 (inet6) as necessary.\nYou can confirm\
    \ what filters are applied to all your Loopback interfaces issuing the\nfollowing command from the [edit] hierarchy:\n\
    [edit]\nshow interfaces lo0 | display set | match filter\nYou can view the details of the configured filter/s using the\
    \ following command:\n[edit]\nshow firewall family <inet/inet6> filter <filter-name>\nIn the example below, the filter\
    \ CIS-Example-IPv4 is configured as the input filter for the\ninet address family (IPv4), this has already been configured\
    \ with rate limiting for SSH,\nHTTPS and SNMP services as shown in Recommendations 2.3 Ensure \"Protect RE\" Firewall\n\
    filter includes Rate-Limiting for Management Services terms, to this we have added a\nnumber of Flood Protection terms:\n\
    [edit]\nmwhite@SRX1# show interfaces lo0 | display set | match filter\nset interfaces lo0 unit 0 family inet filter input\
    \ CIS-Example-IPv4\n[edit]\nmwhite@SRX1#show firewall family inet filter CIS-Example-IPv4\nterm Limit-SYNFlood {\n from\
    \ {\n source-prefix-list {\n management-hosts;\n }\n protocol tcp;\n tcp-flags \"(syn & !ack) | fin | rst\";\n }\n then\
    \ policer limit-100k;\n}\nterm AcceptSSH {\n from {\n source-prefix-list {\n management-hosts;\n }\n destination-port\
    \ ssh;\n }\n then {\n policer limit-10m;\n count SSH-Allowed;\n log;\n syslog;\n accept;\n }\n}\n61 | P a g e\nterm AcceptHTTPS\
    \ {\n from {\n source-prefix-list {\n management-hosts;\n }\n destination-port https;\n }\n then {\n policer limit-10m;\n\
    \ count HTTPS-Allowed;\n log;\n syslog;\n accept;\n }\n}\nterm AcceptSNMP {\n from {\n source-prefix-list {\n snmp-servers;\n\
    \ }\n destination-port snmp;\n }\n then {\n policer limit-1m;\n count SNMP-Poll-Allowed;\n accept;\n }\n}\nterm AcceptICMP\
    \ {\n from {\n protocol icmp;\n icmp-type [ echo-request echo-reply unreachable time-exceeded ];\n }\n then {\n policer\
    \ limit-1m;\n accept;\n }\n}\nterm AcceptTCP-Established {\n from {\n source-port ssh;\n tcp-established;\n }\n then {\n\
    \ policer limit-10m;\n accept;\n }\n}\nterm AcceptTraceroute {\n from {\n protocol udp;\n destination-port 33434-33523;\n\
    \ }\n then {\n policer limit-1m;\n accept;\n62 | P a g e\n }\n}\nNote - The example filter above not complete and may\
    \ not be suitable for all environments -\nall other traffic to the Junos Device will be discarded.\nThe term Limit-SYNFlood\
    \ has been added ahead of any TCP based services (in this\nexample SSH and HTTPS for JWeb, but this could also include\
    \ TCP based services such as\nNETCONF, DMI or BGP; in which case additional source-prefix-list match conditions\nwill\
    \ be needed for BGP Neighbors, Management/Automation Servers, etc). We match TCP\npackets from the management-hosts prefix-list\
    \ (configured previously), which have the TCP\nSYN Flag, but not the ACK Flag set. Although less common than SYN Floods,\
    \ an attacker may\nalso attempt to abuse RST and FIN flags, so we also match on these. A Rate-limit of 100kb/s\nis applied\
    \ using the policer limit-100k.\nThe AcceptICMP term is added to allow services like Ping (Echo) and ICMP Unreachable\n\
    messages, but applies a 1kb/s policer as these services are often abused by attackers.\nAcceptTCP-Established allows for\
    \ reply traffic to outbound TCP based sessions from the\nJunos device. Firewall Filters are Stateless, so this is needed\
    \ to allow the reply and matches\nbased on TCP packets with the ACK or RST flags set. If other TCP based services such\
    \ as\nBGP are used, additional destination-port entries will be required to allow replies to\nexisting sessions. A 10Mb/s\
    \ policer is applied to matching traffic.\nFinally AcceptTraceroute allows for traceroute traffic through the device while\
    \ applying a\n1Mb/s policer to limit the scope for abuse by an attacker.\nThose Policers can be viewed using the following\
    \ command from the [edit] hierarchy:\n[edit]\nmwhite@SRX1# show firewall policer limit-10m\nif-exceeding {\n bandwidth-limit\
    \ 10m;\n burst-size-limit 625k;\n}\nthen discard;\n[edit]\nmwhite@aSRX1# show firewall policer limit-1m\nif-exceeding\
    \ {\n bandwidth-limit 1m;\n burst-size-limit 15k;\n}\nthen discard;\n[edit]\nmwhite@SRX1# show firewall policer limit-100k\n\
    if-exceeding {\n bandwidth-limit 100k;\n burst-size-limit 15k;\n}\nthen discard;\n63 | P a g e"
  remediation: 'A full discussion of Firewall Filters is beyond the scope of this Benchmark.

    It is important to ensure that Firewall Filters include terms to match and accept all of your

    required Routing Protocols, Management Services and any other services used on your

    Junos Device. As noted elsewhere, it is strongly recommended that changes to Firewall

    Filters applied to the Loopback interface always be applied using commit confirmed so that

    the change will be automatically rolled back should the administrator lose connection after

    committing the change.

    In this example, we will add the new Flood Protection terms seen in the audit procedure to

    our existing Firewall Filter from Recommendation 2.3 Ensure "Protect RE" Firewall filter

    includes Rate-Limiting for Management Services terms using the following commands from

    the [edit firewall] hierachy:

    First we need to create an additional ''policer'' definition, which can be re-used in multiple

    terms of filters.

    [edit firewall]

    mwhite@SRX1# set if-exceeding bandwidth-limit 100k

    mwhite@SRX1# set if-exceeding burst-size-limit 15k

    mwhite@SRX1# set then discard

    This new policer enforces a bandwidth-limit of 100kb/s, with a burst-size proportional

    to the configured limit to allow bursts to briefly exceed the limit and smooth the impact of

    the policer on the service.

    The new limit-100k policer is used in the new Limit-SYNFlood term, while the other new

    terms re-use the limit-1m and limit-10m configured previously. A policer applies separately

    for each term, so SSH, HTTPS and new terms re-using these policers can receive 10Mb/s of

    traffic each, not a combined 10Mb/s between them.

    [edit firewall]

    mwhite@SRX1# set term Limit-SYNFlood from source-prefix-list management-hosts

    mwhite@SRX1# set term Limit-SYNFlood from protocol tcp

    mwhite@SRX1# set term Limit-SYNFlood from tcp-flags "(syn & !ack) | fin |

    rst"

    mwhite@SRX1# set term Limit-SYNFlood then policer limit-100k

    mwhite@SRX1# set term AcceptICMP from icmp-type echo-request

    mwhite@SRX1# set term AcceptICMP from icmp-type echo-reply

    mwhite@SRX1# set term AcceptICMP from icmp-type unreachable

    mwhite@SRX1# set term AcceptICMP from icmp-type time-exceeded

    mwhite@SRX1# set term AcceptICMP then policer limit-1m

    mwhite@SRX1# set term AcceptICMP then accept

    mwhite@SRX1# set term AcceptTCP-Established from source-port ssh

    mwhite@SRX1# set term AcceptTCP-Established from tcp-established

    mwhite@SRX1# set term AcceptTCP-Established then policer limit-10m

    mwhite@SRX1# set term AcceptTCP-Established then accept

    mwhite@SRX1# set term AcceptTraceroute from protocol udp

    mwhite@SRX1# set term AcceptTraceroute from destination-port 33434-33523

    64 | P a g e

    mwhite@SRX1# set term AcceptTraceroute then policer limit-1m

    mwhite@SRX1# set term AcceptTraceroute then accept

    Because the Limit-SYNFlood term needs to be executed before any TCP Services like SSH,

    HTTPS or BGP, we will move the term ahead of the AcceptSSH term configured previously:

    [edit firewall]

    mwhite@SRX1# insert family inet filter CIS-Example-IPv4 term Limit-SYNFlood

    before term AcceptSSH

    If it is not already, the filter can now be applied to the Loopback interface, using the

    following command from the [edit interfaces] hierarchy:

    [edit interfaces]

    mwhite@SRX1# set unit 0 family inet filter input CIS-Example-IPv4

    Note - The example filter above not complete and may not be suitable for all environments -

    all other traffic to the Junos Device will be discarded.

    Your filters should include terms for all of the Management, Monitoring and Automation

    services, as well as any Routing Protocols or other services such as IPSEC or BFD in use in

    your network.'
  checks:
  - type: sql
    command: show interfaces lo0 | display set | match filter
    severity: medium
    info: 'Due to the range of options available for Management Service selection, management

      subnets and filter design, it is not possible to automatically score this recommendation.

      "Protect RE" Firewall Filters should be set for ingress traffic on all Loopback interfaces as

      60 | P a g e

      discussed in Recommendation 2.1 Ensure "Protect RE" Firewall Filter is set for inbound

      traffic to the Routing Engine for'
- id: '2.6'
  title: Ensure firewall filters contain explicit deny and log term
  scoring: manual
  profile:
  - Level 2
  description: Filters should include a final Deny and Log term.
  rationale: Firewall filters are built up of one or more terms, which are evaluated in order until either one is matched
    (at which point the terms then action is taken) or the final term has been evaluated, at which point the default action
    is to discard the packet. It is important to log packets which are denied by the firewall filter, these may indicate an
    attempted attack or could suggest a problem in the network or with the firewall filter itself. A term should be added
    to the end of the each firewall filter which logs the packet header information and blocks the packet. The discard method
    is used to block the packet silently, with no message sent back to the source, denying the attacker information and limiting
    resource usage on the router.
  impact: Firewall Filters should be carefully tested before implementation on production systems as incorrect configuration
    may prevent normal services functioning. It is strongly recommended that changes to Firewall Filters are applied using
    commit confirmed so that changes will be automatically rolled back should they prevent the administrator from connecting
    to the Junos Device.
  references:
  - 1. [Firewall Filter Overview, JUNOS Software Policy Framework Configuration Guide,
  - '2. *Recipe 15: Low-Risk Methodology for Deploying Firewall Filters* in the [Day One:'
  page_start: 67
  audit_raw: 'Due to the range of options available as to Filter Name, Term Name, terms and the use of

    the filter; it is not possible to score this recommendation.

    Firewall filters may be viewed by issuing the following command:

    [edit]

    user@host#show firewall

    Note - In Junos, Firewall Filters may be used for a wide range of purposes in addition to

    actually filtering traffic in or out of interfaces. This could include Quality of Service (QoS)

    67 | P a g e

    Classifiers, Packet Capture & Analysis or Filter Based Forwarding/Policy Based Routing.

    When a Firewall Filter is used for a non-Firewall purpose such as these, an explicit deny all

    term may not be appropriate and traffic not matching the filter may actually require an

    explicit accept all term instead to ensure normal network operations.'
  remediation: 'To create a firewall filter term enter the following command from the [edit firewall

    family <family> filter <filter name>] hierarchy.

    [edit firewall family inet filter <filter name>]

    user@host#set term <term name> then discard

    user@host#set term <term name> then syslog

    user@host#set term <term name> then log'
