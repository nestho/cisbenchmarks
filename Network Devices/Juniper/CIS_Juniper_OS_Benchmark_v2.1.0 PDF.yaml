- id: 6.9.2
  title: Ensure Root Password is Unique
  scoring: manual
  profile:
  - Level 1
  description: The Root Password should be unique.
  rationale: Due to the rights associated with the Root user account it must be protected at all costs to prevent malicious
    users taking ownership of the router. Using the same password for an individual User or other usage exposes the extremely
    privileged Root user account to abuse by that user and introduces the need to manually change the Root password should
    that user leave the organization. Further risks are presented by the lower level hashing algorithm which may be used to
    protect other system passwords. On some JUNOS systems or External AAA platforms these utilize MD5, a demonstrably less
    secure protocol then SHA1 which used for the Root password. Theoretically an attacker could exploit the weaker hashing
    used on these lesser system passwords to recover the Root password. Finally, the Root password should not be reused on
    other systems, including other routers, and should be stored securely - such as using a Password Manager. If the Root
    Password was the same across all of the routers and other systems in your network, the compromise of one host could result
    in the compromise of all hosts.
  impact: Root Authentication must be set prior to JUNOS allowing the first commit on a new system. Ensure that, while the
    Root password is complex, it is safely stored in a Password Vault or remembered as it will be required for access to the
    system until other accounts are configured or to perform certain tasks.
  references:
  - 1. http://en.wikipedia.org/wiki/Privilege_escalation
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/task/configuration/
  page_start: 326
  audit_raw: 'Because all Root Passwords are automatically stored by JUNOS as a SHA1 hash, which will

    always be 160bits long, it is not possible to confirm the uniqueness of the Root Password.

    326 | P a g e'
  remediation: 'Users will generally be prompted to set the Root password during initial setup of the

    router, however, a password may be set from the CLI using either of the two methods

    below from the [edit system] hierarchy; To enter a new Root Password in plain text type:

    [edit system]

    user@host#set root-authentication plain-text-password

    You will be prompted to enter the new Password twice and, if the Passwords match, JUNOS

    will add a SHA1 hash of the Password to the configuration. If you already have a SHA1 hash

    of your Root Password (from an existing router configuration, for example), enter the

    following command:

    [edit system]

    user@host#set root-authentication encrypted-password "<SHA1 hash>"

    If JWEB is installed on your router, the Root Password may also be changed through the

    Configuration > Quick Configuration > Setup page.'
  checks:
  - type: manual_review
    info: 'Because all Root Passwords are automatically stored by JUNOS as a SHA1 hash, which will

      always be 160bits long, it is not possible to confirm the uniqueness of the Root Password.

      326 | P a g e'
    severity: medium
- id: 6.9.3
  title: Ensure SSH Key Authentication is not set for Root Login
  scoring: scored
  profile:
  - Level 1
  description: SSH Key Based Authentication should not be used for Root Login
  rationale: 'Due to the sensitive nature of SSH, potentially allowing full management of the targeted device, protecting
    SSH access using strong authentication methods is essential to the security of the device. One method which is supported
    in SSH for stronger authentication is the use of Public/Private Encryption Key Pairs in place of a more traditional login
    prompt for a Username and Password. Instead, an administrator uploads the user''s Public key to the JUNOS (or other) device
    to be managed. When the user connects, they will use their Private key to encrypt some session specific data. The JUNOS
    device can verify the Users identity by decrypting that data using the Public key configured previously and comparing
    it to an expected result. If the results match, then the user must have access to the Private key, so is considered valid.
    Unfortunately using SSH Keys to authenticate User Logins to JUNOS devices introduce a number of security issues:  Public
    Keys may only be configured locally on each JUNOS device  Public Keys are used instead of centralized AAA using TACACS+
    or RADIUS as covered in Recommendation 6.8.1 Ensure External AAA Server is set  The use of SSH Keys means only a single
    Authentication Factor (the keys) can be used, preventing the use of Multi Factor Authentication as covered in 6.6.14 Ensure
    Multi-Factor is used with External AAA  JUNOS does not provide any method to automate rollover or locking of keys. If
    keys are compromised/lost, they must be changed on every JUNOS device on which they are configured.  Some SSH implementation
    support the use of X.509 PKI Certificates for managing SSH Keys, but JUNOS does not. Because of these limitations and
    the difficulty in auditing and managing SSH Keys on JUNOS devices, this method should not be used for Authentication of
    User logins or for the Root 328 | P a g e User, which is configured separately under the [edit system root-authentication]
    configuration hierarchy.'
  impact: ''
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/topics/reference/configura
  - 2. https://www.ssh.com/ssh/key/
  page_start: 328
  audit_raw: 'To confirm whether Root Login has been configured to use SSH Key based Authentication,

    issue the following command from the [edit system root-authentication] hierarchy:

    [edit system root-authentication]

    user@host# show | match "ssh-" | count

    The above command should return a count of 0.'
  remediation: 'If SSH Key based Authentication is configured for the Root Authentication, remove it using

    the following command from the [edit system] hierarchy:

    [edit system]

    user@host# delete root-authentication

    To set a new Root Password in plain text type:

    [edit system]

    user@host#set root-authentication plain-text-password

    You will be prompted to enter the new Password twice and, if the Passwords match, JUNOS

    will add a hash of the Password to the configuration.

    If you already have a hash of your Root Password (from an existing router configuration,

    for example), enter the following command:

    [edit system]

    user@host#set root-authentication encrypted-password "<hash>"

    Note - Hashes use SHA1 by default, but may use other hashing mechanisms depending on the

    device configuration - ensure the device you are copying from is configured to use the same

    hashing method.

    If JWEB is installed on your router, the Root Password may also be changed through the

    Configuration > Quick Configuration > Setup page.'
  checks:
  - type: manual_review
    info: 'To confirm whether Root Login has been configured to use SSH Key based Authentication,

      issue the following command from the [edit system root-authentication] hierarchy:

      [edit system root-authentication]

      user@host# show | match "ssh-" | count

      The above command should return a count of 0.'
    severity: medium
- id: 6.10.1.1
  title: Ensure SSH Service is Configured if Remote CLI is Required
  scoring: manual
  profile:
  - Level 1
  description: SSH should be utilized for remote console sessions to Juniper routers.
  rationale: SSH provides administrators with a remote console session on the router in a similar fashion to Telnet. Unlike
    Telnet, SSH encrypts all data as it transits the network and ensures the identity of the remote host. Because of this
    extra protection, all remote console sessions should use SSH. If Remote CLI or services which use SSH for transport, like
    Secure Copy (SCP) or NETCONF, are required SSH should be disabled.
  impact: Disabling SSH may result in loss of remote management of the device and also impact other services, like NETCONF,
    which use SSH for transport.
  references:
