- id: 6.6.6
  title: Ensure Predefined Login Classes are not used
  scoring: scored
  profile:
  - Level 1
  description: All user accounts must have a class set, but the Predefined JUNOS Login Classes should be avoided.
  rationale: 'JUNOS routers ship with 4 Predefined Login Classes, these are:  super-user  read-only  operator  unauthorized
    These classes provide basic configuration to allow organizations to get a router up and running, but do not provide fine
    grained control needed by all but very smallest organizations. The built in classes also do not meet the other recommendations
    in this section. For example, the super-user class (which is the only built in class with read/write permissions) also
    has permission to start a Unix Shell and does not have an Idle Session Timeout. Because of these limitations it is recommended
    that Custom Login Classes be defined following the principle of least privilege, where each class of users is granted
    only those permissions needed to complete their job role. All of these class should meet the other requirements in this
    section and no users (either local or remote template users) should use the built-in accounts.'
  impact: Careful configuration of permissions following the least privilege principle is essential for secure and reliable
    management of the network. For larger networks, creating and maintaining Login Classes on each individual device may become
    cumbersome and error prone - for these environments it is suggested you consider the Level 2 Recommendation "Ensure Remote
    Login Class for Authorization through External AAA". 264 | P a g e
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/informationproducts/pathway-pages/system-basics/user-access.html
  - 2. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  page_start: 264
