- id: 6.12.5
  title: Ensure Local Logging is Set for Interactive-Commands
  scoring: scored
  profile:
  - Level 1
  description: Logging data for Interactive Commands should be saved to a local file.
  rationale: When responding to a security incident or fault, a record of all of the commands issued on the JUNOS Devices,
    either through the CLI or through management APIs such as JUNOScript or NETCONF, can provide vital clues. A local SYSLOG
    file should be configured to record all interactive-commands issued on the JUNOS Device, along with details of the user
    who issued them and when. Having this data available locally, as well as on remote SYSLOG or SIEM Servers, can aide Incident
    Responders and enable a faster resolution to both Security and Operational related issues.
  impact: Events detailing Interactive Commands will be logged to the configured file in the JUNOS Device's /var/log/ folder.
    You may wish to specify the size of files to be recorded, the number of zipped older files the JUNOS Devices should keep
