- id: 6.10.6
  title: Ensure Telnet is Not Set
  scoring: scored
  profile:
  - Level 1
  description: Cleartext Management Services should be disabled.
  rationale: Telnet is a remote management protocol that allows users to connect to the command line of a JUNOS router or
    other device. Because Telnet transmits all data (including passwords) in cleartext (unencrypted) over the network and
    provides no assurance of the identity of the hosts involved, it can allow an attacker to gain sensitive configuration,
    password and other data and is also vulnerable to session hijacking and injection attacks. This makes Telnet and other
    unencrypted management applications completely unsuitable for managing network devices and Telnet should be disabled.
  impact: Ensure administrative access via SSH or other secure method is configured and working before disabling Telnet in
    a production environment to ensure that administrative access is not lost.
  references:
  - 1. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  - https://www.pcisecuritystandards.org/documents/PCI_DSS_v3-2-1.pdf
  page_start: 428
  audit_raw: 'To check if Telnet is enabled, execute the following command from the [edit system

    services] hierarchy:

    [edit system services]

    user@host#show | match "telnet;|telnet {" | count

    The above command should return a line count of 0.'
  remediation: 'To disable Telnet access issue the following command from the [edit system telnet]

    hierarchy;

    428 | P a g e

    [edit system services]

    user@host# delete telnet'
  checks:
  - type: manual_review
    info: 'To check if Telnet is enabled, execute the following command from the [edit system

      services] hierarchy:

      [edit system services]

      user@host#show | match "telnet;|telnet {" | count

      The above command should return a line count of 0.'
    severity: medium
- id: 6.10.7
  title: Ensure Reverse Telnet is Not Set
  scoring: scored
  profile:
  - Level 1
  description: Cleartext Management Services should be disabled.
  rationale: Telnet is a remote management protocol that allows users to connect to the command line of a JUNOS router or
    other device. Because Telnet transmits all data (including passwords) in cleartext (unencrypted) over the network and
    provides no assurance of the identity of the hosts involved, it can allow an attacker to gain sensitive configuration,
    password and other data and is also vulnerable to session hijacking and injection attacks. This makes Telnet and other
    unencrypted management applications completely unsuitable for managing network devices and Telnet should be disabled.
    Reverse Telnet is a service that can be configured on JUNOS devices, allowing a user to connect via the auxiliary port
    to the CLI of another device by establishing a Telnet session, on port 2900/TCP by default. Because Telnet is used as
    the underlying protocol, Reverse Telnet is subject to the same risks and this service should be disabled.
  impact: Ensure that alternate administrative access using a secure protocol such as SSH or Reverse SSH is provisioned and
    tested before removing this service in a production environment.
  references:
  - 1. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  - https://www.pcisecuritystandards.org/documents/PCI_DSS_v3-2-1.pdf
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/task/configuration/
  page_start: 430
  audit_raw: 'To confirm whether Reverse Telnet is configured, execute the following command from the

    [edit system services] hierarchy:

    [edit system services]

    user@host#show | match "reverse telnet" | count

    The command should return a line count of 0.

    430 | P a g e'
  remediation: 'To disable Reverse Telnet access issue the following command from the [edit system

    service] hierarchy;

    [edit system services]

    user@host#delete reverse telnet'
  checks:
  - type: manual_review
    info: 'To confirm whether Reverse Telnet is configured, execute the following command from the

      [edit system services] hierarchy:

      [edit system services]

      user@host#show | match "reverse telnet" | count

      The command should return a line count of 0.

      430 | P a g e'
    severity: medium
- id: 6.10.8
  title: Ensure FTP Service is Not Set
  scoring: scored
  profile:
  - Level 1
  description: FTP should be disabled.
  rationale: File Transfer Protocol (FTP) can be used for loading and exporting configuration from a Juniper device, which
    can run an FTP Server Service to support these functions. FTP transfers data in plaintext and should be avoided, with
    the Secure Copy functions of SSH used instead. In addition, the FTP service allows files to be read from and written to
    the devices file system, presenting a risk if misused. The FTP Service should be disabled on all JUNOS devices and users
    should avoid using FTP in operational mode commands.
  impact: Ensure no processes or support systems rely on FTP file transfers from the JUNOS device and migrate any such transfers
    to a secure alternative prior to disabling FTP in a production environment.
  references:
  - 1. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  page_start: 432
  audit_raw: 'To confirm whether the FTP Service is configured, execute the following command from

    the [edit system services] hierarchy:

    [edit system services]

    user@host#show | match ftp | count

    A line count of 0 should be returned.'
  remediation: 'To disable the FTP service, issue the following command from the [edit system]

    hierarchy;

    432 | P a g e

    [edit system]

    user@host#delete services ftp'
  checks:
  - type: manual_review
    info: 'To confirm whether the FTP Service is configured, execute the following command from

      the [edit system services] hierarchy:

      [edit system services]

      user@host#show | match ftp | count

      A line count of 0 should be returned.'
    severity: medium
- id: 6.10.9
  title: Ensure Finger Service is Not Set
  scoring: scored
  profile:
  - Level 1
  description: The Finger service should be disabled.
  rationale: Finger is a simple TCP service dating back to the early 1970's that provides information on users logged into
    a system to other users on the network. While this was a useful feature in the early days of the Internet, providing information
    about a router to unauthenticated users is not quite so desirable in today's Internet and presents a serious threat to
    the security of a JUNOS network device. The finger daemon itself has suffered from numerous vulnerabilities across many
    platforms and, as with any unneeded service, should be disabled for this reason also.
  impact: ''
  references:
  - 1. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/task/configuration/
  page_start: 434
  audit_raw: 'To confirm whether the Finger Service is configured, execute the following command from

    the [edit system services] hierarchy:

    [edit system services]

    user@host#show | match finger | count

    A line count of 0 should be returned.'
  remediation: 'The Finger service is not enabled by default, however if it has been configured on your

    router it can by disabled by issuing the following command from the [edit system

    services] hierarchy;

    [edit system services]

    user@host#delete finger'
  checks:
  - type: manual_review
    info: 'To confirm whether the Finger Service is configured, execute the following command from

      the [edit system services] hierarchy:

      [edit system services]

      user@host#show | match finger | count

      A line count of 0 should be returned.'
    severity: medium
- id: 6.10.10
  title: Ensure Unused DHCP Service is Not Set
  scoring: scored
  profile:
  - Level 1
  description: The DHCP Server should be disabled when not required.
  rationale: When hardening any computer system for security, it is important to disable or uninstall any application that
    is not required. The same rule applies to routers and other network devices. JUNOS devices are able to operate as a Dynamic
    Host Configuration Protocol (DHCP) server, providing IP Address and other information to client systems on connected networks.
    DHCP Services are configured either under the [edit system services dhcp] (using the Legacy DHCPD process) or [edit system
    services dhcp-local-server] (using the newer Extended JDHCPD process) hierarchies. In most larger environments, DHCP services
    will be provided by separate DHCP Servers rather than JUNOS Routers, Switches or Firewalls - although these may still
    be used in smaller networks or Branch Offices. On some JUNOS platforms the DHCP Service is configured by default, but
    it is recommended that it is disabled if it is not required.
  impact: Ensure that DHCP Services are not required before disabling them.
  references:
  - 1. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  - 2. https://www.juniper.net/documentation/en_US/junos/topics/concept/securitydhcp-routing-instance-understanding.html
  page_start: 436
  audit_raw: 'To confirm whether either DHCP Service is configured, execute the following command

    from the [edit system services] hierarchy:

    [edit system services]

    user@host#show | match "dhcp.*{"

    When DHCP is configured above command should return either dhcp { or dhcp-localserver {

    If dhcp { was returned, confirm whether Pool is configured with the following command:

    [edit system services]

    user@host#show dhcp | match "pool.*{" | count

    436 | P a g e

    A line count of at least 1 should be returned to indicate a Pool is configured.

    If dhcp-local-server { was returned from the first command, confirm whether a pool is

    configured with the following command:

    [edit system services]

    user@host# top show access address-assignment | match "pool.*{" | count

    A line count of at least 1 should be returned to indicate a Pool is configured.

    If DHCP is enabled but no pools are configured, or none of the configured pools are still

    required, then this should be considered an Audit Failure and DHCP should be removed.'
  remediation: 'To disable DHCP services which are not required, issue the one of the following command

    from the [edit system services] configuration hierarchy:

    For DHCP configured with the Legacy DHCPD process:

    [edit system services]

    user@host#delete dhcp

    Or, for DHCP configured with the Enhanced JDHCPD process:

    [edit system services]

    user@host#delete dhcp-local-server'
  checks:
  - type: sql
    command: show | match "dhcp.*{"
