- id: 6.11.4
  title: Ensure Console Port is Set as Insecure
  scoring: scored
  profile:
  - Level 2
  description: The JUNOS Device's Console Port should be set as Insecure.
  rationale: Administrators often use Console Port to configure the JUNOS Device when they have physical access to the device.
    In high security environments or deployments where the physical security of the router is minimal, such as CPE (Customer
    Premises Equipment), Point of Sale (POS) or Branch Office installations, it is important to prevent both customers and
    intruders from accessing the Device's CLI or using the Password Recovery process using the Console Port. Normally if an
    attacker is able to connect a console cable and then restart the device, it is possible to reset the root password in
    order to gain full control. To prevent this, the Console Port should be set as Insecure. This option, which persists after
    restart, prevents login to the JUNOS Device's Console Port using the Root account. When rebooting the JUNOS Device, the
    Root password will be required before beginning the Password Recovery process, such as booting into Single User Mode or
    running the Password Recovery Utility (depending on model).
  impact: The Console Port will not permit logins using the Root account. On reboot, access to the Password Recovery process
    will require the Root password to be entered.
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Page 58, National Security
  - 2. Recovering the Root Password, JUNOS Software System Basics Configuration Guide,
  page_start: 445
  audit_raw: 'To confirm whether the Console Port has been set as Insecure, issue the following

    command from the [edit system ports] hierarchy:

    [edit system ports ]

    user@host#show console | match insecure | count

    445 | P a g e

    This command should return a line count of 1, indicating that the Console Port has been set

    as Insecure.'
  remediation: 'To set the Console Port as Insecure, issue the following command from the [edit system

    ports] hierarchy;

    [edit system ports]

    user@host#set console insecure'
  checks:
  - type: sql
    command: show console | match insecure | count
    severity: medium
