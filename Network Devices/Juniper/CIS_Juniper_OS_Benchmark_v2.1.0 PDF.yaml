- id: '2.7'
  title: Ensure internal sources are blocked on external networks
  scoring: manual
  profile:
  - Level 2
  description: Deny traffic with an internal source or reserved IP address from external source.
  rationale: An attacker may attempt to bypass security controls and Intrusion Detection Systems (IDS) by using the source
    address of a trusted (generally internal) host, a technique known as spoofing. Packets arriving on external networks should
    never have a source address from your internal network ranges, especially where the internal networks use RFC1918 private
    address space or invalid addresses. Any traffic with an internal source arriving on an external interface is certain to
    be an attack and should be blocked. A Firewall Filter should be applied to all external network interfaces and include
    a term to deny internal address ranges. The discard method is used to block the packet silently, with no message sent
    back to the source. This traffic should also be logged to the local routing engine and SYSLOG, allowing attacks to be
    detected and record kept.
  impact: ''
  references:
  - 1. Cisco IOS Benchmark Version 2.2, Requirement 2.3.1.1, Center for Internet Security
  - 2. [Firewall Filter Overview, JUNOS Software Policy Framework Configuration Guide,
  page_start: 69
  audit_raw: 'Due to the range of options available as to Filter Name, Term Name and terms; it is not

    possible to score this recommendation. Firewall filters may be viewed by issuing the

    following command:

    [edit]

    user@host#show firewall

    NOTE - In Junos, Firewall Filters may be used for a wide range of purposes in addition to

    actually filtering traffic in or out of interfaces. This could include Quality of Service (QoS)

    Classifiers, Packet Capture & Analysis or Filter Based Forwarding/Policy Based Routing.

    When a Firewall Filter is used for a non-Firewall purpose such as these, a term blocking

    internal addresses may not be appropriate and traffic not matching the filter may actually

    require an explicit accept all term instead to ensure normal network operations.

    69 | P a g e'
  remediation: 'To create a firewall filter term enter the following command from the [edit firewall

    family <family> filter <filter name>] hierarchy.

    [edit firewall family inet filter <filter name>]

    user@host#edit term <term name>

    [edit firewall family inet filter <filter name> term <term name>]

    user@host#set from source-address 127.0.0.0/8

    user@host#set from source-address 10.0.0.0/8

    user@host#set from source-address 0.0.0.0/32

    user@host#set from source-address 172.16.0.0/12

    user@host#set from source-address 192.168.0.0/16

    user@host#set from source-address 192.0.2.0/24

    user@host#set from source-address 169.254.0.0/16

    user@host#set from source-address 198.18.0.0/15

    user@host#set from source-address 198.51.100.0/24

    user@host#set from source-address 203.0.113.0/24

    user@host#set from source-address 224.0.0.0/8

    user@host#set from source-address 255.255.255.255/32

    user@host#set from source-address

    user@host#set then discard

    user@host#set then syslog

    user@host#set then log

    NOTE - At least one further term must be included in this firewall filter to allow legitimate

    traffic.'
