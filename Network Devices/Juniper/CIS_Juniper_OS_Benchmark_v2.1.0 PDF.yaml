      To check whether LLDP is enabled, use the following command from the [edit protocols]

      configuration hierarchy:

      [edit protocols]

      user@host#show lldp | display set | match "interface|disable"

      The command should r'
- id: 4.12.2
  title: Ensure LLDP-MED is Disabled if not Required
  scoring: manual
  profile:
  - Level 2
  description: LLDP-MED should be disabled when not required
  rationale: 'The Link Layer Discovery Protocol (LLDP) is a vendor-neutral and widely supported standard used for network
    devices to advertise information about their capabilities, identity, software and management details to other network
    devices on the LAN. LLDP is specified in the IEEE 802.1AB-2005 standard. Link Layer Discovery Protocol - Media Endpoint
    Discovery (LLDP-MED) is an extension of LLDP published by the Telecommunications Industry Association (TIA) in the ANSI/TIA1057
    standard. LLDP-MED is primarily used to enable Voice over IP (VoIP) services by adding additional Type-Length-Value (TLV)
    data structures to the existing LLDPDU Ethernet Frames sent by LLDP. This information may include:  Detailed information
    about Power Supply Type, Source and Priority (in the extpower-via-mdi TLV)  The physical location of the endpoint (configured
    via Emergency Location Identification Number (ELIN) or Geographic Location, in the location-id TLV)  The Network Policy
    (VLAN configuration, DiffServ code points, in the networkpolicy TLV). This information may be vital to provision of VoIP
    or other Media services, or when documenting/troubleshooting the network; but is also extremely useful to a potential
    attacker, either directly connected to the device or having compromised a neighbouring device. To reduce the information
    given to a potential attacker, in high security environments LLDP-MED should be disabled where it is not absolutely required
    for normal operation. Like LLDP, LLDP-MED can either be disabled globally, or on a per interface basis (for example, leaving
    LLDP-MED enabled on access ports where it may be used for PoE or VoIP applications, but disabling it on infrastructure
    links or connections to untrusted networks). 181 | P a g e LLDP-MED is not supported on all Junos device types, as it
    is primarily concerned with communication with VoIP Phones at the Access Layer. At present LLDP-MED is supported on: 
    EX Series Access Switches (2200, 2300, 3300, 3400, 4200, 4300) (LLDP-MED enabled for all ports by default)  Branch/Mid-Range
    and Virtual SRX Firewalls (SRX100-650, SRX1500, vSRX) (LLDPMED disabled by default)  NFX150 Network Services Platform
    (Virtual CPE) (defaults not clear)'
  impact: LLDP-MED is commonly used to support VoIP devices - disabling LLDP or LLDP-MED for these interfaces may result in
    service disruption.
  references:
  - 1. https://www.juniper.net/documentation/en_US/junos/topics/topic-map/devicediscovery-using-lldp-lldp-med.html
  - 2. https://en.wikipedia.org/wiki/Link_Layer_Discovery_Protocol
  page_start: 181
  audit_raw: 'Due to the range of options as to the type of device, deployment scenario and where LLDP

    will be used in the network, it is not possible to provide Automated Scoring of this

    recommendation.

    To check whether LLDP is enabled, use the following command from the [edit protocols]

    configuration hierarchy:

    [edit protocols]

    user@host#show lldp-med | display set | match "interface|disable"

    LLDP-MED is enabled by default on EX series platforms, so will be enabled for all Interfaces

    if set protocols lldp-med interface all disable is not returned.

    For other supported platforms LLDP-MED is disabled by default.

    It may be enabled for all interfaces, in which case set protocols lldp-med interface

    all will be returned.

    LLDP-MED may also be enabled (set protocols lldp-med interface <interface

    name>) or disabled (set protocols lldp-med interface <interface name> disable) on

    a per-interface basis.'
  remediation: 'To turn off LLDP-MED globally for all interfaces, issue the following command from the

    [edit protocols] configuration hierarchy:

    [edit protocols]

    user@host# set lldp-med interface all disable

    182 | P a g e

    Sending of LLDPDUs will be disabled, while any other LLDP-MED related configuration will

    be retained (but ignored).

    Alternatively, you may wish to disable LLDP on a per-interface basis by issuing the

    following command from the [edit protocols] configuration hierarchy:

    To disable LLDP-MED for a specific interface, leaving LLDP-MED enabled for all others:

    [edit protocols]

    user@host# set lldp-med interface <interface name> disable

    Or to disable LLDP-MED for all interfaces and allow only for specific ports:

    [edit protocols]

    user@host# set lldp-med interface all disable

    user@host# set lldp-med interface <interface name>

    This procedure should be repeated for all Routing Instances/Logical Systems where LLDPMED is configured but not required.'
  checks:
  - type: sql
    command: show lldp-med | display set | match "interface|disable"
    severity: medium
    info: 'Due to the range of options as to the type of device, deployment scenario and where LLDP

      will be used in the network, it is not possible to provide Automated Scoring of this

      recommendation.

      To check whether LLDP is enabled, use the following command from the [edit protocols]

      configuration hierarchy:

      [edit protocols]

      user@host#show lldp-med | display set | match "interface|disable"

      LLDP-MED is enab'
- id: '5.1'
  title: Ensure Common SNMP Community Strings are NOT used
  scoring: scored
  profile:
  - Level 1
  description: Do not use common / default community strings.
  rationale: 'SNMP can be used to read, and sometime write, sensitive information about your router and network environment.
    When using SNMP Versions 1 and 2C (SNMPv2c) a community string is used to identify and, to a limited degree, authenticate
    Management Stations. If an attacker knows or guesses the community string that is used they may be able gain access to
    the SNMP interface as if they were a valid administrator. To reduce the risk of an attacker guessing your community strings
    you should not use the following well known, common strings which are used as defaults on many brands of router:  "Public"
     "Private"  "Admin"  "Monitor"  "Security" Any community used should be complex and should not match any of the passwords
    used elsewhere on the device or in your organization.'
  impact: ''
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Section 4.2.1 (page 77), National
  - 2. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  page_start: 186
  audit_raw: 'From the command prompt, execute the following command:

    [edit]

    user@host#show snmp | match community | match

    "public|private|admin|monitor|security" | count

    The above command should return 0 or an error.

    186 | P a g e'
  remediation: 'If you have deployed SNMPv1 or SNMPv2c on your router using one of these strings,

    rename the community using the following command under the [edit snmp] hierarchy;

    [edit snmp]

    user@host#rename community <old community> to community <new community>'
  checks:
  - type: sql
    command: show snmp | match community | match
    severity: medium
    info: 'From the command prompt, execute the following command:

      [edit]

      user@host#show snmp | match community | match

      "public|private|admin|monitor|security" | count

      The above command should return 0 or an error.

      186 | P a g e'
- id: '5.2'
  title: Ensure SNMPv1/2 are set to Read Only
  scoring: scored
  profile:
  - Level 1
  description: Do not allow Read-Write SNMP access for versions below SNMPv3.
  rationale: SNMP can be used to read and write configuration information from a router using your Network Management Systems;
    however the inherently insecure design of the older SNMP V1, V2 and V2C standards, which do not use encryption to protect
    community strings, make their use for setting configuration an open invitation to an attacker. While, by default, a JUNOS
    router configured for SNMP Write access provides access only to Ping or Traceroute from the router, these still provide
    a potential source of information about your network or avenue for further attack so should not be permitted. Additional
    SNMP Management Information Base (MIB) views might be configured which, were Write access permitted, would allow an attacker
    to disable interfaces, change routing configuration or change anything else that you might do from the command line. If
    an NMS is being used to configure routers via SNMP write access it should only do so via SNMPv3, which is significantly
    more secure.
  impact: ''
  references:
  - 1. Router Security Configuration Guide, Version 1.1b, Section 4.2.1 (page 77), National
  - 2. Payment Card Industry Data Security Standard (PCI DSS), Version 3.2.1,
  page_start: 188
  audit_raw: 'From the command prompt, execute the following command:

    [edit]

    user@host#show snmp | match "authorization read-write" | count

    The above command should return 0 or an error.'
  remediation: 'If you have deployed SNMP below Version 3 on your router with Read-Write access, delete

    the associated community using the following command under the [edit snmp] hierarchy;

    [edit snmp]

    user@host#delete community <community>

    188 | P a g e

    Alternatively you can set the communities authorization level to Read Only with the

    following command from the [edit snmp <community>] hierarchy;

    [edit snmp]

    user@host#set community <community> authorization read-only'
