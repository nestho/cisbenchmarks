  description: If the XNM-SSL service is configured, the Rate Limit should be set.
  rationale: JUNOScript can be configured to use SSL transport to prevent the exposure of sensitive data and authentication
    details on the network. If configured the XNM-SSL service will provide services on port TCP/3220. An attacker may attempt
    to open a large number of sessions to the XNM-SSL service to exhaust the routers resources or an authorized user may do
    so accidently, especially given that the service is designed to allow a scripting interface to JUNOS. To limit the impact
    of any such incident, the rate at which new connections to the XNM-SSL service should explicitly limited. Rate Limits
    are set in terms of the number of connection attempts per minute. Established connections do not count towards this count.
