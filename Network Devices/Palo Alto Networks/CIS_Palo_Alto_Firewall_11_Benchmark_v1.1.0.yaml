- id: 1.2.5
  title: Ensure valid certificate is set for browser-based administrator interface
  scoring: scored
  profile:
  - Level 2
  description: 'In most cases, a browser HTTPS interface is used to administer the Palo Alto appliance. The certificate used
    to secure this session should satisfy the following criteria: 1. A valid certificate from a trusted source should be used.
    While a certificate from a trusted Public Certificate Authority is certainly valid, one from a trusted Private Certificate
    Authority is absolutely acceptable for this purpose. 2. The certificate should have a valid date. It should not have a
    "to" date in the past (it should not be expired), and should not have a "from" date in the future. 3. The certificate
    should use an acceptable cipher and encryption level.'
  rationale: If a certificate that is self-signed, expired, or otherwise invalid is used for the browser HTTPS interface,
    administrators in most cases will not be able to tell if their session is being eavesdropped on or injected into by a
    "Man in the Middle" attack.
  impact: If the default self-signed certificate is used, an administrator will not be able to clearly tell if their HTTPS
    session is being hijacked or not. Using a trusted certificate ensures that the session is both encrypted and trusted.
  references:
  - 1. "How to Configure a Certificate for Secure Web GUI Access" -
  - https://live.paloaltonetworks.com/t5/Configuration-Articles/How-to-configure-acertificate-for-secure-web-gui-access/ta-p/68653
  - 2. “PAN-OS Administrator's Guide 9.0 (English) - Best Practices for Securing
  page_start: 35
  audit_raw: 'Verify that the certificate used to secure HTTPS sessions meets the criteria by

    reviewing the appropriate certificate:

    Navigate to Device > Certificate Management > Certificates

    Verify that this Certificate is properly applied to the Management Interface:

    Navigate to Device > Setup > Management > General Settings > SSL/TLS

    Service Profile'
  remediation: 'Create or acquire a certificate that meets the stated criteria and set it:

    Navigate to Device > Certificate Management > Certificates

    Import an appropriate Certificate for your administrative session, from a trusted

    Certificate Authority.

    Navigate to Device > Certificate Management > SSL/TLS Service Profile

    Choose or import the certificate you want to use for the web based administrative

    session.

    Navigate to Device > Setup > Management > General Settings > SSL/TLS

    Service Profile

    Choose the Service Profile that you have configured'
  checks:
  - type: manual_review
    info: 'Verify that the certificate used to secure HTTPS sessions meets the criteria by

      reviewing the appropriate certificate:

      Navigate to Device > Certificate Management > Certificates

      Verify that this Certificate is properly applied to the Management Interface:

      Navigate to Device > Setup > Management > General Settings > SSL/TLS

      Service Profile'
    severity: medium
- id: 1.3.1
  title: Ensure 'Minimum Password Complexity' is enabled
  scoring: scored
  profile:
  - Level 1
  description: This checks all new passwords to ensure that they meet basic requirements for strong passwords.
  rationale: Password complexity recommendations are derived from the USGCB (United States Government Configuration Baseline),
    Common Weakness Enumeration, and benchmarks published by the CIS (Center for Internet Security). Password complexity adds
    entropy to a password, in comparison to a simple password of the same length. A complex password is more difficult to
    attack, either directly against administrative interfaces or cryptographically, against captured password hashes. However,
    making a password of greater length will generally have a greater impact in this regard, in comparison to making a shorter
    password more complex.
  impact: Simple passwords make an attacker's job very easy. There is a reasonably short list of commonly used admin passwords
    for network infrastructure, not enforcing password lengths and complexity can lend itself to making an attacker's brute
    force attack successful.
  references:
  - 1. “PAN-OS Administrator's Guide 9.0 (English) - Best Practices for Securing
  page_start: 38
  audit_raw: 'Navigate to Device > Setup > Management > Minimum Password Complexity.

    Verify Enabled is checked

    Ensure that the various password settings to values that are appropriate to your

    organization. Non-zero values should be set for Minimum Uppercase, Lowercase and

    Special Characters. "Block Username Inclusion" should be enabled.'
  remediation: 'Navigate to Device > Setup > Management > Minimum Password Complexity.

    Set Enabled to be checked

    Set that the various password settings to values that are appropriate to your

    organization. It is suggested that there at least be some special characters enforced,

    and that a minimum length be set. Ensure that non-zero values are set for Minimum

    Uppercase, Lowercase and Special Characters. "Block Username Inclusion" should be

    enabled.

    Operationally, dictionary words should be avoided for all passwords - passphrases are a

    much better alternative.'
  checks:
  - type: manual_review
    info: 'Navigate to Device > Setup > Management > Minimum Password Complexity.

      Verify Enabled is checked

      Ensure that the various password settings to values that are appropriate to your

      organization. Non-zero values should be set for Minimum Uppercase, Lowercase and

      Special Characters. "Block Username Inclusion" should be enabled.'
    severity: medium
- id: 1.3.2
  title: Ensure 'Minimum Length' is greater than or equal to 12
  scoring: scored
  profile:
  - Level 1
  description: This determines the least number of characters that make up a password for a user account.
  rationale: A longer password is much more difficult to attack, either directly against administrative interfaces or cryptographically,
    against captured password hashes. Making a password of greater length will generally have a greater impact in this regard,
    in comparison to making a shorter password more complex. Passphrases are a commonly used recommendation, to make longer
    passwords more palatable to end users. Administrative staff however generally use "password safe" applications, so a long
    and complex password is more easily implemented for most infrastructure administrative interfaces.
  impact: Longer passwords are much more difficult to attack. This is true of attacks against the administrative interfaces
    themselves, or of decryption attacks against captured hashes. A longer password will almost always have a more positive
    impact than a shorter but more complex password.
  references:
  - 1. “PAN-OS Administrator's Guide 9.0 (English) - Best Practices for Securing
  page_start: 40
  audit_raw: 'Navigate to Device > Setup > Management > Minimum Password Complexity.

    Verify Minimum Length is greater than or equal to 12'
