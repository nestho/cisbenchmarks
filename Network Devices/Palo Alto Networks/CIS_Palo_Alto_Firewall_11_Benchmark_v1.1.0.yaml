- id: 1.7.1
  title: Enabling Post-Quantum (PQ) on IKEv2 VPNs
  scoring: manual
  profile:
  - Level 2
  description: For VPN that has IKEv2 enabled, enable PQ for more secure way to exchange preshared secret to defend against
    "Harvest Now, Decrypt Later" attack technique.
  rationale: Post-quantum IKEv2 VPNs based on RFC 8784 work by transmitting a pre-shared secret separately (out-of-band) from
    the initial peering exchange (the IKE_SA_INIT Exchange). Instead of transmitting the pre-shared secret in the peering
    exchange, which an attacker could compromise or harvest now and decrypt later, the peering exchange only transmits a Key
    ID. A Key ID and a pre-shared secret comprise a unique pair called a post-quantum pre-shared key (PQ PPK). Each IKEv2
    peer uses the Key ID to look up the pre-shared secret, which is transmitted securely between administrators or pushed
    by Panorama, and stored locally on each IKEv2 peer. The pre-shared key is never part of the peering exchange and never
    traverses the post-quantum VPN, so an attacker using a quantum computer can't steal it, crack it, and use it to decrypt
    data harvested from a VPN. Both IKEv2 peers must have the same active pairs of Key ID plus pre-shared secret so that when
    peers negotiate the connection, each peer can look up the same Key ID and retrieve the same pre-shared secret. If the
    responding peer doesn't have a matching Key ID or if the pre-shared secret associated with the Key ID differs from the
    initiator, the connection is aborted.
  impact: ''
  references:
  - 1. “PAN-OS Administrator's Guide 11.1 (English) - Network Security" -
  - https://docs.paloaltonetworks.com/network-security/quantumsecurity/administration/configure-quantum-resistant-ikev2-vpns/configure-postquantum-ikev2-vpns
  page_start: 75
  audit_raw: 'Navigate to Network > Network Profiles > IKE Gateways.

    On gateways that has IKEv2 enabled, click into it and navigate to Advanced Options.

    On IKEv2 section, navigate to PQ PPK section.

    Verify that Enable Post-Quantum Pre-Shared Key (PPK) is checked.

    Negotiation mode should be set to Mandatory if both sides of VPN supports PQ.

    Negotiation mode should be set to Preferred if you don''t know or don''t have control

    over whether the peer supports RFC 8784. Preferred mode preserves backward

    compatibility to ensure connections fall back instead of dropping.

    If both sides of VPN supports more than 1 PPK key ID, then multiple PPK key ID should

    be configured. Configuring multiple PQ PPKs is most secure because it adds a random

    element to PQ PPK selection.'
  remediation: 'Navigate to Network > Network Profiles > IKE Gateways.

    On gateways that has IKEv2 enabled, click into it and navigate to Advanced Options.

    On IKEv2 section, navigate to PQ PPK section.

    Check Enable Post-Quantum Pre-Shared Key (PPK) option.

    Negotiation mode should be set to Mandatory if both sides of VPN supports PQ.

    Negotiation mode should be set to Preferred if you don''t know or don''t have control

    over whether the peer supports RFC 8784. Preferred mode preserves backward

    compatibility to ensure connections fall back instead of dropping.

    If both sides of VPN supports more than 1 PPK key ID, then multiple PPK key ID should

    be configured. Configuring multiple PQ PPKs is most secure because it adds a random

    element to PQ PPK selection.'
  checks:
  - type: manual_review
    info: 'Navigate to Network > Network Profiles > IKE Gateways.

      On gateways that has IKEv2 enabled, click into it and navigate to Advanced Options.

      On IKEv2 section, navigate to PQ PPK section.

      Verify that Enable Post-Quantum Pre-Shared Key (PPK) is checked.

      Negotiation mode should be set to Mandatory if both sides of VPN supports PQ.

      Negotiation mode should be set to Preferred if you don''t know or don''t have control

      over whether the peer supports RFC 8784. Preferred mode preserves backward

      compatibility'
    severity: medium
- id: '2.1'
  title: Ensure that IP addresses are mapped to usernames
  scoring: scored
  profile:
  - Level 2
  description: Configure appropriate settings to map IP addresses to usernames. Mapping userids to IP addresses is what permits
    the firewall to create rules based on userids and groups rather than IP addresses and subnets, as well as log events by
    userids rather than IP addresses or DNS names. The specifics of how to achieve IP-to-username mapping is highly dependent
    on the environment. It can be enabled by integrating the firewall with a domain controller, Exchange server, captive portal,
    Terminal Server, User-ID Agent, XML API, or syslog data from a variety of devices.
  rationale: Understanding which user is involved in a security incident allows appropriate personnel to move quickly between
    the detection and reaction phases of incident response. In environments with either short DHCP lease times, or where users
    may move frequently between systems, the ability to analyze or report, or alert on events based on user accounts or user
    groups is a tremendous advantage. For forensics tasks when DHCP lease information may not be available, the Source User
    information may be the only way to tie together related data.
  impact: ''
  references:
  - 1. “Best Practices for Securing User-ID Deployments” -
  - https://live.paloaltonetworks.com/docs/DOC-7912
  - 2. “How to Configure Group Mapping settings?” -
  - https://live.paloaltonetworks.com/docs/DOC-4994
