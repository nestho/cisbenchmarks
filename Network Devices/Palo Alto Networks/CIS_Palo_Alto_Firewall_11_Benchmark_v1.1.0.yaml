- id: '2.3'
  title: Ensure that User-ID is only enabled for internal trusted interfaces
  scoring: scored
  profile:
  - Level 1
  description: Only enable the User-ID option for interfaces that are both internal and trusted. There is rarely a legitimate
    need to allow WMI probing (or any user-id identification) on an untrusted interface. The exception to this is identification
    of remote-access VPN users, who are identified as they connect.
  rationale: PAN released a customer advisory in October of 2014 warning of WMI probing on untrusted interfaces with User-ID
    enabled. This can result in theft of the password hash for the account used in WMI probing.
  impact: If WMI probing is enabled without limiting the scope, internet hosts that are sources or destinations of traffic
    will be probed, and the password hash of the configured Domain Admin account can be captured by an outside attacker on
    such a host.
  references:
  - '1. “Customer advisory: Security Impact of User-ID Misconfiguration” -'
  - https://live.paloaltonetworks.com/docs/DOC-8125
  - '2. “R7-2014-16: Palo Alto Networks User-ID Credential Exposure” -'
  - https://blog.rapid7.com/2014/10/14/palo-alto-networks-userid-credentialexposure/
