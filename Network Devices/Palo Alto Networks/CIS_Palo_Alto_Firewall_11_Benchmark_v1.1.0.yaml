  scoring: manual
  profile:
  - Level 1
  description: Configure SSL Inbound Inspection for all untrusted traffic destined for servers using SSL or TLS.
  rationale: Without SSL Inbound Inspection, the firewall is not able to protect SSL or TLS-enabled webservers against many
