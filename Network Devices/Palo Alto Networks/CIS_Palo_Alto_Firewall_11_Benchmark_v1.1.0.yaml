    severity: medium
- id: 1.2.3
  title: Ensure HTTP and Telnet options are disabled for the management interface
  scoring: scored
  profile:
  - Level 1
  description: HTTP and Telnet options should not be enabled for device management.
  rationale: Management access over cleartext services such as HTTP or Telnet could result in a compromise of administrator
    credentials and other sensitive information related to device management. Theft of either administrative credentials or
    session data is easily accomplished with a "Man in the Middle" attack.
  impact: ''
  references:
  - 1. "How to Configure a Layer 3 Interface to act as a Management Port" -
  - https://live.paloaltonetworks.com/t5/Configuration-Articles/How-to-Configure-aLayer-3-Interface-to-act-as-a-Management-Port/ta-p/59024
  - 2. “PAN-OS Administrator's Guide 9.0 (English) - Best Practices for Securing
  page_start: 31
