- id: '6.7'
  title: Ensure a secure Vulnerability Protection Profile is applied to all security rules allowing traffic
  scoring: scored
  profile:
  - Level 1
  description: For any security rule allowing traffic, apply a securely configured Vulnerability Protection Profile. Careful
    analysis of the target environment should be performed before implementing this configuration, as outlined by PAN’s “Threat
    Prevention Deployment Tech Note” in the references section.
  rationale: A Vulnerability Protection Profile helps to protect assets by alerting on, or blocking network attacks. By applying
    a secure Vulnerability Protection Profile to all security rules permitting traffic, all network traffic traversing the
    firewall will be inspected for attacks. This protects both organizational assets from attack and organizational reputation
    from damage. Note that encrypted sessions do not allow for complete inspection.
  impact: Not configuring a Vulnerability Protection Profile means that network attacks will not be logged, alerted on or
    blocked.
  references:
  - 1. “Threat Prevention Deployment Tech Note” -
  - https://live.paloaltonetworks.com/docs/DOC-3094
