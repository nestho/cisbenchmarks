- id: '7.1'
  title: Ensure application security policies exist when allowing traffic from an untrusted zone to a more trusted zone
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: 'When permitting traffic from an untrusted zone, such as the Internet or guest network, to a more trusted zone,
    such as a DMZ segment, create security policies specifying which specific applications are allowed. **Enhanced Security
    Recommendation: ** Require specific application policies when allowing any traffic, regardless of the trust level of a
    zone. Do not rely solely on port permissions. This may require SSL interception, and may also not be possible in all environments.'
  rationale: To avoid unintentionally exposing systems and services, rules allowing traffic from untrusted zones to trusted
    zones should be as specific as possible. Application-based rules, as opposed to service/port rules, further tighten what
    traffic is allowed to pass. Similarly, traffic from trusted to untrusted networks should have a security policy set, with
    application-based rules. A "catch-all" rule that allows all applications will also allow malware traffic. The goal should
    be to understand both inbound and outbound traffic, permit what is known, and block all other traffic.
  impact: Setting application based rules on both inbound and outbound traffic ensures that the traffic on the protocol and
    port being specified is actually the application that you expect. For outbound traffic, the days of "we trust our users"
    is well past us, that statement also implies that we trust the malware on the user workstations, which is obviously not
    the case. For traffic from trusted to less trusted interfaces, the applications should be characterized over time, with
    the end goal being that all applications in in the rules, and a final "block all" rule is in place. Not having this goal
    gives both attackers and malware the leeway they need to accomplish their goals. Trusting only Port permissions to control
    traffic exposes an organization to "tunneling" style attacks that can exfiltrate data or facilitate Command and Control
    (C2) sessions.
  references:
  - 1. “PAN-OS Administrator's Guide 11.1 (English) - Security Policies / Applications
  page_start: 179
  audit_raw: 'Navigate to Policies > Security.

