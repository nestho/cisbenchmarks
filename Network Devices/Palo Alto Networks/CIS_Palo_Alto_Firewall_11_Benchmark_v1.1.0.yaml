    profile on all security policies.
  rationale: Traffic matching security policies that do not include a WildFire file blocking profile will not utilize WildFire
    for file analysis. Wildfire analysis is one of the key security measures available on this platform. Without Wildfire
    analysis enabled, inbound malware can only be analyzed by signature - which industry wide is roughly 40-60% effective.
    In a targeted attack, the success of signature-based-only analysis drops even further.
