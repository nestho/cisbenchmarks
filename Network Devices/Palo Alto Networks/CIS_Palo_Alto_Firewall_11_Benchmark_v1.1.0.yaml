- id: '6.9'
  title: Ensure that URL Filtering uses the action of “block” or “override” on the URL categories
  scoring: scored
  profile:
  - Level 1
  description: 'Ideally, deciding which URL categories to block, and which to allow, is a joint effort between IT and another
    entity of authority within an organization—such as the legal department or administration. For most organizations, blocking
    or requiring an override on the following categories represents a minimum baseline: adult, hacking, commandand-control,
    copyright-infringement, extremism, malware, phishing, proxy-avoidanceand-anonymizers, and parked. Some organizations may
    add "unknown" and "dynamicdns" to this list, at the expense of some support calls on those topics.'
  rationale: Certain URL categories pose a technology-centric threat, such as command-andcontrol, copyright-infringement,
    extremism, malware, phishing, proxy-avoidance-andanonymizers, and parked. Users visiting websites in these categories,
    many times unintentionally, are at greater risk of compromising the security of their system. Other categories, such as
    adult, may pose a legal liability and will be blocked for those reasons.
  impact: Not having an effective URL Filtering configuration can leave an organization open to legal action, internal HR
    issues, non-compliance with regulatory policies or productivity loss.
  references:
  - 1. “PAN-OS Administrator's Guide 11.1 (English) - Security Profiles” -
  - https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/policy/securityprofiles
  - 2. “PAN-OS Administrator's Guide 9.0 (English) - URL Filtering” -
  - https://docs.paloaltonetworks.com/pan-os/9-0/pan-os-admin/url-filtering.html
  - https://docs.paloaltonetworks.com/advanced-urlfiltering/administration/configuring-url-filtering/url-filtering-best-practices
