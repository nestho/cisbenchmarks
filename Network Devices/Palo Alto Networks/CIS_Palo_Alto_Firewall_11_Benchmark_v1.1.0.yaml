  profile:
  - Level 1
  description: Configure 'Wildfire Inline ML' on antivirus profiles to a value of 'enable' for all file types. Enable 'Inline
    Cloud Analysis' on Vulnerability Protection profiles to combat zero-day threats. Enable both 'Local Inline Categorization'
    and 'Cloud Inline Categorization' on URL Filtering profiles to evaluate suspicious web page contents in real-time to protect
    users against zero-day threats. Enable 'Inline Cloud Analysis' on Anti-Spyware profiles to detect and protection against
    advanced, highly-evasive zero-day command-and-control (C2) threats.
  rationale: Starting from PanOS 10, Wildfire supports real-time detection and blocking. As more attacks are designed to bypass
    signature-based protection, real-time signaturelessbased protection is needed. With this new functionality, common file
    types used for malware delivery such as Windows Executables, PowerShell Script, MSOffice, Shell, and Executable Linked
    Format (ELF) can be inspected using Wildfire and malicious files are blocked in real-time. Starting from PanOS 11, Palo
    Alto Networks now operates new inline deep learning detection engines in the Advanced Threat Prevention cloud to analyze
    traffic for command injection and SQL injection vulnerabilities in real-time to protect users against zero-day threats.
    By operating cloud-based detection engines, you can access a wide array of detection mechanisms that are updated and deployed
    automatically without requiring the user to download update packages or operate process intensive, firewallbased analyzers
    which can sap resources. It is recommended to set the action as 'alert' during initial deployment and monitor it's false
    positive, configure the exclusion URL and IP before moving to 'reset-both' action. Starting from PanOS 10, Palo Alto Networks
    Advanced URL Filtering now operates a series of inline cloud-based deep learning detectors that evaluate suspicious web
    page contents in real-time to protect users against zero-day threats. This includes cloaked websites, multi-step attacks,
    CAPTCHA challenges, and previously unseen one-timeuse URLs. Starting from PanOS 10, Palo Alto Networks now operates a
    series of ML-based detection engines in the Advanced Threat Prevention cloud to analyze traffic for advanced C2 (command-and-control)
    and spyware threats in real-time to protect users against zero-day threats. By operating cloud-based detection engines,
    you can access a wide array of detection mechanisms that are updated and deployed automatically without requiring the
    user to download update packages or operate process intensive, firewall-based analyzers which can sap resources. The cloud-based
    detection engine logic is continuously monitored and updated using C2 traffic datasets from WildFire, with additional
    support through manual updates by Palo Alto Networks threat researchers, who provide human intervention for highly accurized
    detection enhancements.
