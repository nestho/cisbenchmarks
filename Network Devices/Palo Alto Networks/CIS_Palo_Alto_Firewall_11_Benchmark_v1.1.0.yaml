- id: 1.1.1.2
  title: SNMPv3 traps should be configured
  scoring: scored
  profile:
  - Level 2
  description: SNMP v3 can be used for remote logging, and is the recommended protocol in higher security situations as it
    fully supports encryption of logs.
  rationale: Sending all system logs to a remote host is recommended to provide protected, long term storage and archiving.
    This also places a copy of the logs in a second location, in case the primary (on the firewall) logs are compromised.
    Storing logs on a remote host also allows for more flexible log searches and log processing, as well as many methods of
    triggering events or scripts based on specific log events or combinations of events. Finally, remote logging provides
    many organizations with the opportunity to combine logs from disparate infrastructure in a SIEM (Security Information
    and Event Management) system. Logging to an external system is also usually required by most regulatory frameworks.
  impact: Failure to properly store and archive logs for critical infrastructure leaves an organization without the tools
    required to establish trends in events or activity, or to retrospectively analyze security or operational events beyond
    the log timespan stored on the firewall. Not having remote logs also puts many organizations outside of compliance with
    many regulatory frameworks. Finally, not logging to a remote host leaves organizations without recourse in the event of
    a compromise of logs on the primary device. It is imperative that organizations log critical infrastructure appropriately,
    store and archive these logs in a central location, and have a robust set of tools to analyze logs both in real time and
    after the fact. Not encrypting log data as it transits the network allows an attacker to mount a "MiTM" (Monkey in the
    Middle) attack, which allows them to intercept and/or modify logs as they transit from the source to the destination.
  references:
  - 1. “PAN-OS Administrator's Guide 11.1 (English) - Forward Traps to an SNMP
  page_start: 19
  audit_raw: 'Navigate to Device > Server Profiles > SNMP Traps

    Ensure that a valid SNMP profile is configured, that version V3 is selected, and that it

