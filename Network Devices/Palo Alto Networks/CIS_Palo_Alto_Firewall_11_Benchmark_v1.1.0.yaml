- id: '6.1'
  title: Ensure that antivirus profiles are set to reset-both on all decoders except 'imap' and 'pop3'
  scoring: scored
  profile:
  - Level 1
  description: Configure antivirus profiles to a value of 'reset-both' for all decoders except imap and pop3 under both Action
    and WildFire Action. If required by the organization's email implementation, configure imap and pop3 decoders to 'alert'
    under both Action and WildFire Action.
  rationale: Antivirus signatures produce low false positives. By blocking any detected malware through the specified decoders,
    the threat of malware propagation through the firewall is greatly reduced. It is recommended to mitigate malware found
    in pop3 and imap through a dedicated antivirus gateway. Due to the nature of the pop3 and imap protocols, the firewall
    is not able to block only a single email message containing malware. Instead, the entire session would be terminated,
    potentially affecting benign email messages.
  impact: ''
  references:
  - 1. “Threat Prevention Deployment Tech Note” -
  - https://live.paloaltonetworks.com/docs/DOC-3094
  - 2. “PAN-OS Administrator's Guide 11.1 (English) - Security Profiles” -
  - https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/policy/securityprofiles
  - https://knowledgebase.paloaltonetworks.com/KCSArticleDetail?id=kA10g000000
  page_start: 126
