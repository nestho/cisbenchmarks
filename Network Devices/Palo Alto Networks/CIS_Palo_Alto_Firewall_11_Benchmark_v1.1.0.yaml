- id: 1.1.2
  title: Ensure 'Login Banner' is set
  scoring: scored
  profile:
  - Level 1
  description: Configure a login banner, ideally approved by the organization’s legal team. This banner should, at minimum,
    prohibit unauthorized access, provide notice of logging or monitoring, and avoid using the word “welcome” or similar words
    of invitation.
  rationale: Through a properly stated login banner, the risk of unintentional access to the device by unauthorized users
    is reduced. Should legal action take place against a person accessing the device without authorization, the login banner
    greatly diminishes a defendant’s claim of ignorance.
  impact: ''
  references:
  - 1. “PAN-OS Administrator's Guide 11.1 (English) - Configuring Logon Banners” -
  - https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/firewalladministration/use-the-web-interface/configure-banners-message-of-the-dayand-logos
  page_start: 22
  audit_raw: 'Navigate to Device > Setup > Management > General Settings.

    Verify that Login Banner is set appropriately for your organization.'
  remediation: 'Navigate to Device > Setup > Management > General Settings.

    Set Login Banner as appropriate for your organization.'
  checks:
  - type: manual_review
    info: 'Navigate to Device > Setup > Management > General Settings.

      Verify that Login Banner is set appropriately for your organization.'
    severity: medium
- id: 1.1.3
  title: Ensure 'Enable Log on High DP Load' is enabled
  scoring: scored
  profile:
  - Level 1
  description: Enable the option 'Enable Log on High DP Load' feature. When this option is selected, a system log entry is
    created when the device’s packet processing load reaches 100% utilization.
  rationale: When the device’s packet processing load reaches 100%, a degradation in the availability of services accessed
    through the device can occur. Logging this event can help with troubleshooting system performance.
  impact: Sustained attacks, especially volumetric DOS and DDOS attacks will often affect CPU utilization. This setting will
    generate an event that is easily monitored for and alerted on. While setting CPU utilization watermarks in a Network Management
    System is a standard practice, this setting does not depend on even having an NMS, it doesn't require anything other than
    standard logging to implement.
  references:
  - 1. "Logging Best Practices" - https://live.paloaltonetworks.com/t5/best-practiceassessment-device/logging-and-reporting-settings-log-on-high-dp-mode/tap/336964
  page_start: 24
  audit_raw: 'Navigate to Device > Setup > Management > Logging and Reporting Settings

    > Log Export and Reporting.

    Verify Enable Log on High DP Load is checked.'
  remediation: 'Navigate to Device > Setup > Management > Logging and Reporting Settings

    > Log Export and Reporting.

    Set the Enable Log on High DP Load box to checked.'
  checks:
  - type: manual_review
    info: 'Navigate to Device > Setup > Management > Logging and Reporting Settings

      > Log Export and Reporting.

      Verify Enable Log on High DP Load is checked.'
    severity: medium
- id: 1.2.1
  title: Ensure 'Permitted IP Addresses' is set to those necessary for device management
  scoring: scored
  profile:
  - Level 1
  description: Permit only the necessary IP addresses to be used to manage the device.
  rationale: Management access to the device should be restricted to the IP addresses or subnets used by firewall administrators.
    Permitting management access from other IP addresses increases the risk of unauthorized access through password guessing,
    stolen credentials, or other means.
  impact: ''
  references:
  - 1. "How to Allow Certain IP Addresses on the Management Interface" -
  - https://live.paloaltonetworks.com/docs/DOC-8432
  - 2. “PAN-OS Administrator's Guide 9.0 (English) - Best Practices for Securing
  page_start: 27
  audit_raw: 'Navigate to Device > Setup > Interfaces > Management.

    Verify that Permitted IP Addresses is limited only to those necessary for device

    management.'
  remediation: 'Navigate to Device > Setup > Interfaces > Management.

    Set Permitted IP Addresses to only those necessary for device management for the

    SSH and HTTPS protocols. If no profile exists, create one that has these addresses set.'
  checks:
  - type: manual_review
    info: 'Navigate to Device > Setup > Interfaces > Management.

      Verify that Permitted IP Addresses is limited only to those necessary for device

      management.'
    severity: medium
- id: 1.2.2
  title: Ensure 'Permitted IP Addresses' is set for all management profiles where SSH, HTTPS, or SNMP is enabled
  scoring: scored
  profile:
  - Level 1
  description: For all management profiles, only the IP addresses required for device management should be specified.
  rationale: If a Permitted IP Addresses list is either not specified or is too broad, an attacker may gain the ability to
    attempt management access from unintended locations, such as the Internet. The “Ensure 'Security Policy' denying any/all
    traffic exists at the bottom of the security policies ruleset” recommendation in this benchmark can provide additional
    protection by requiring a security policy specifically allowing device management access.
  impact: ''
  references:
  - 1. "How to Allow Certain IP Addresses on the Management Interface" -
  - https://live.paloaltonetworks.com/docs/DOC-8432
  - 2. “PAN-OS Administrator's Guide 9.0 (English) - Best Practices for Securing
  page_start: 29
  audit_raw: 'Navigate to Network > Network Profiles > Interface Management.

    In each profile, for each of the target protocols (SNMP, HTTPS, SSH), verify that

    Permitted IP Addresses is limited to those necessary for device management.'
  remediation: 'Navigate to Network > Network Profiles > Interface Management.

    In each profile, for each of the target protocols (SNMP, HTTPS, SSH), set Permitted

    IP Addresses to only include those necessary for device management. If no profile

    exists, create one that has these options set.'
  checks:
