- id: '5.3'
  title: Ensure forwarding of decrypted content to WildFire is enabled
  scoring: scored
  profile:
  - Level 1
  description: Allow the firewall to forward decrypted content to WildFire. Note that SSL ForwardProxy must also be enabled
    and configured for this setting to take effect on inside-tooutside traffic flows.
  rationale: As encrypted Internet traffic continues to proliferate, WildFire becomes less effective unless it is allowed
    to act on decrypted content. For example, if a user downloads a malicious pdf over SSL, WildFire can only provide analysis
    if 1) the session is decrypted by the firewall and 2) forwarding of decrypted content is enabled. In today's internet,
    roughly 70-80% of all user traffic is encrypted. If Wildfire is not configured to analyze encrypted content, the effectiveness
    of Wildfire is drastically reduced.
  impact: ''
  references:
  - 1. “WildFire Fails Forwarding File to Cloud for Encrypted Traffic” -
  - https://live.paloaltonetworks.com/docs/DOC-6845
