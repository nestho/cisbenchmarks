- id: '6.13'
  title: Ensure alerting after a threshold of credit card or Social Security numbers is detected is enabled
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: 'This guideline is highly specific to an organization. While blocking of credit card or Social Security numbers
    will not occur with the recommended settings below, careful tuning is also recommended. Create a secure Data Filtering
    profile and apply it to all security policies permitting traffic to or from the Internet. The Data Filtering profile may
    be applied to security policies directly or through a profile group. Enable the SYN Flood Action of SYN Cookies for all
    untrusted zones. The Alert, Activate, and Maximum settings for SYN Flood Protection depend highly on the environment and
    device used. Perform traffic analysis on the specific environment and firewall to determine accurate thresholds. Do not
    rely on default values to be appropriate for an environment. Setting these values for all interfaces is an approach that
    should be considered by many organizations, as traffic floods can result from internal testing or malware as well. As
    a rough ballpark for most environments, an Activate value of 50% of the firewall’s maximum “New sessions per second”/CPS
    is a conservative setting. The following is a list of maximum new sessions per second for each platform: PA-4xx series
    = 73,000 CPS PA-8xx series = 13,100 CPS PA-14xx series = 140,000 CPS PA-32xx series = 84,000 CPS PA-34xx series = 268,000
    CPS PA-52xx series = 500,000 CPS PA-54xx series = 3,600,000 CPS PA-70xx series = 6,000,000 CPS Enable all Flood Protection
    options in the Zone Protection Profile attached to all untrusted zones. The Alert, Activate, and Maximum settings for
    Flood Protection depend highly on the environment and device used. Perform traffic analysis on the specific environment
    and firewall to determine accurate thresholds. Do not rely on default values to be appropriate for an environment. Setting
    these values for all interfaces is an approach that should be considered by many organizations, as traffic floods can
    result from internal testing or malware as well. Enable all three scan options in a Zone Protection profile. Do not configure
    an action of Allow for any scan type. The exact interval and threshold values must be tuned to the specific environment.
    Less aggressive settings are typically appropriate for trusted zones, such as setting an action of alert for all scan
    types. Attach appropriate Zone Protection profiles meeting these criteria to all zones. Separate Zone Protection profiles
    for trusted and untrusted zones is a best practice.'
  rationale: Credit card and Social Security numbers are sensitive, and should never traverse an organization’s Internet connection
    in clear text. Passing sensitive data within an organization should also be avoided whenever possible. Detecting and blocking
    known sensitive information is a basic protection against a data breach or data loss. Not implementing these defenses
    can lead to loss of regulatory accreditation (such as PCI, HIPAA etc), or can lead to legal action from injured parties
    or regulatory bodies. A Data Filtering profile helps prevent certain types of sensitive information from traversing an
    organization’s Internet connection, especially in clear text. Detecting and blocking known sensitive information is a
    basic protection against a data breach or data loss. Not implementing these defenses can lead to loss of regulatory accreditation
    (such as PCI, HIPAA etc), or can lead to legal action from injured parties or regulatory bodies. Before starting, be very
    aware that Data Filtering will often block data that you didn't anticipate, false positives will definitely occur. Even
    the prebuilt filters will frequently match on unintended data in files or websites. Work very closely with your user community
    to ensure that required data is blocked or alerted on, but a minimum of false positive blocks occur. As false positives
    occur, ensure that your user community has a clear and timely procedure to get the configuration updated. Protecting resources
    and the firewall itself against DoS/DDoS attacks requires a layered approach. Firewalls alone cannot mitigate all DoS
    attacks, however, many attacks can be successfully mitigated. Utilizing SYN Cookies helps to mitigate SYN flood attacks,
    where the CPU and/or memory buffers of the victim device become overwhelmed by incomplete TCP sessions. SYN Cookies are
    preferred over Random Early Drop. Without flood protection, it may be possible for an attacker, through the use of a botnet
    or other means, to overwhelm network resources. Flood protection does not completely eliminate this risk; rather, it provides
    a layer of protection. Without a properly configured zone protection profile applied to untrusted interfaces, the protected
    / trusted networks are susceptible to large number of attacks. While many of these involve denial of service, some of
    these attacks are designed to evade IPS systems (fragmentation attacks for instance) or to evade basic firewall protections
    (source routing and record route attacks). Port scans and host sweeps are common in the reconnaissance phase of an attack.
    Bots scouring the Internet in search of a vulnerable target may also scan for open ports and available hosts. Reconnaissance
    Protection will allow for these attacks to be either alerted on or blocked altogether.
  impact: Not configuring a Network Zone Protection Profile on untrusted interfaces leaves an organization exposed to common
    attacks and reconnaissance from those untrusted networks. Not configuring a Zone Protection Profile for internal networks
    leaves an organization vulnerable to malware, software or hardware causes of traffic flooding from internal sources. Not
    configuring and applying a Network Zone Protection Profile leaves an organization exposed to common attacks and reconnaissance
    from untrusted networks. Not configuring a Zone Protection Profile for internal networks leaves an organization vulnerable
    to malware, software or hardware causes of traffic flooding from internal sources. Not configuring a Network Zone Protection
    Profile leaves an organization exposed to common attacks and reconnaissance from untrusted networks.
  references:
  - 1. “What are the Data Filtering Best Practices?” -
  - https://live.paloaltonetworks.com/docs/DOC-2513
  - 2. “PAN-OS Administrator's Guide 9.0 (English) - Setting up Data Filtering" -
  - https://docs.paloaltonetworks.com/pan-os/9-0/pan-os-admin/threatprevention/set-up-data-filtering.html#
