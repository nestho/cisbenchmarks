- id: '8.1'
  title: Ensure 'SSL Forward Proxy Policy' for traffic destined to the Internet is configured
  scoring: scored
  profile:
  - Level 1
  description: Configure SSL Forward Proxy for all traffic destined to the Internet. In most organizations, including all
    categories except financial-services, government and health-and-medicine is recommended.
  rationale: Without SSL inspection, the firewall cannot apply many of its protection features against encrypted traffic.
    The amount of encrypted malware traffic continues to rise, and legitimate websites using SSL encryption are hacked or
    tricked into delivering malware on a frequent basis. As encryption on the Internet continues to grow at a rapid rate,
    SSL inspection is no longer optional as a practical security measure. If proper decryption is not configured, it follows
    that the majority of traffic is not being fully inspected for malicious content or policy violations. This is a major
    exposure, allowing delivery of exploits and payloads direct to user desktops. Note that, categories to be decrypted is
    highly dependant on each organization's policy.
  impact: Failure to decrypt outbound traffic allows attackers to mask attacks, data exfiltration and/or command and control
    (C2) traffic by simply using standard TLS encryption. Privacy concerns for your organization's users will dictate that
    some common categories should be exempted from inspection and decryption. Personal banking or healthcare information is
    almost always exempted, as are interactions with government entities. Exemptions and inclusions to decryption policies
    should be negotiated internally and governed by published Corporate Policies.
  references:
  - 1. “How to Implement SSL Decryption” -
  - https://live.paloaltonetworks.com/docs/DOC-1412
  - 2. ““PAN-OS Administrator's Guide 11.1 (English) - Decryption (English)” -
  - https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/decryption
  page_start: 190
