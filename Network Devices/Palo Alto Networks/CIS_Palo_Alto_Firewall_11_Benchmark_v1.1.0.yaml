- id: '7.2'
  title: Ensure 'Service setting of ANY' in a security policy allowing traffic does not exist
  scoring: scored
  profile:
  - Level 1
  description: 'Create security policies specifying application-default for the Service setting, in addition to the specific
    ports desired. The Service setting of any should not be used for any policies that allow traffic. Create a pair of security
    rules at the top of the security policies ruleset to block traffic to and from IP addresses known to be malicious. Note:
    This recommendation (as written) requires a Palo Alto Networks "Threat Prevention License". Third Party and Open Source
    Threat Intelligence Feeds can also be used for this purpose.'
  rationale: App-ID requires a number of packets to traverse the firewall before an application can be identified and either
    allowed or dropped. Due to this behavior, even when an application is defined in a security policy, a service setting
    of any may allow a device in one zone to perform ports scans on IP addresses in a different zone. In addition, this recommendation
    helps to avoid an App-ID cache pollution attack. Because of how App-ID works, configuring the service setting to "Any"
    allows some initial traffic to reach the target host before App-ID can recognize and appropriately restrict the traffic.
    Setting the Service Setting to application specific at least restricts the traffic to the target applications or protocols
    for that initial volume of traffic. Creating rules that block traffic to/from known malicious sites from Trusted Threat
    Intelligence Sources protects you against IP addresses that Palo Alto Networks has proven to be used almost exclusively
    to distribute malware, initiate command-andcontrol activity, and launch attacks.
  impact: While not foolproof, simply blocking traffic from known malicious hosts allows more resources to be devoted to analyzing
    traffic from other sources for malicious content. This approach is a recommended part of most "Defense in Depth" recommendations,
    allowing defenders to focus more deeply on traffic from uncategorized sources.
  references:
  - 1. “Security Policy Guidelines” - https://live.paloaltonetworks.com/docs/DOC-3469
  - '2. “Security Bulletin: App-ID Cache Pollution” -'
  - http://researchcenter.paloaltonetworks.com/2012/12/app-id-cache-pollutionresponse/
