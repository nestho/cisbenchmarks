    Click Add

    Configure the Syslog Server:

    Select Device > Server Profiles > Syslog > Add

    Enter Name, Display Name, Syslog Server, Transport, Port, Format,

    Facility

    Click OK

    Click Commit to save the configuration

    Configure the SMTP Server:

    Select Device > Server Profiles > Email

    Select Add, Name, Display Name, From, To, Additional Recipients, Gateway

    IP or Hostname

    Click OK

    Click Commit to save the configuration

    Navigate to Objects, Log Forwarding

    Choose Add, set the log type to "wildfire", add the filter "(verdict neq benign)", then add

    log destinations for SNMP, Syslog, Email or HTTP as required.'
