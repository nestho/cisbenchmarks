- id: '6.8'
  title: Ensure that PAN-DB URL Filtering is used
  scoring: scored
  profile:
  - Level 1
  description: Configure the device to use PAN-DB URL Filtering instead of BrightCloud.
  rationale: Standard URL filtering provides protection against inappropriate and malicious URLs and IP addresses. PAN-DB
    URL Filtering is slightly less granular than the BrightCloud URL filtering. However the PAN-DB Filter offers additional
    malware protection and PAN threat intelligence by using the Wildfire service as an additional input, which is currently
    not available in the BrightCloud URL Filtering license. This makes the PAN-DB filter more responsive to specific malware
    "campaigns".
  impact: Not having an effective URL Filtering configuration can leave an organization open to legal action, internal HR
    issues, non-compliance with regulatory policies or productivity loss.
  references:
