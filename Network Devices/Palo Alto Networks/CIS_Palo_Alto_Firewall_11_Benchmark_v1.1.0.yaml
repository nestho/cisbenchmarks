- id: '4.1'
  title: Ensure 'Antivirus Update Schedule' is set to download and install updates hourly
  scoring: scored
  profile:
  - Level 1
  description: Set Antivirus Update Schedule to download and install updates hourly. Set the Applications and Threats Update
    Schedule to download and install updates at daily or shorter intervals.
  rationale: New antivirus definitions may be released at any time. With an hourly update schedule, the firewall can ensure
    threats with new definitions are quickly mitigated. A daily update schedule could leave an organization vulnerable to
    a known virus for nearly 24 hours, in a worst-case scenario. Setting an appropriate threshold value reduces the risk of
    a bad definition file negatively affecting traffic. New Applications and Threats file versions may be released at any
    time. With a frequent update schedule, the firewall can ensure threats with new signatures are quickly mitigated, and
    the latest application signatures are applied.
  impact: ''
  references:
  - 1. “Tips for Managing Content Updates” -
