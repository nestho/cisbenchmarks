- id: '6.19'
  title: Ensure that User Credential Submission uses the action of “block” or “continue” on the URL categories
  scoring: scored
  profile:
  - Level 1
  description: Ideally user names and passwords user within an organization are not used with third party sites. Some sanctioned
    SAS applications may have connections to the corporate domain, in which case they will need to be exempt from the user
    credential submission policy through a custom URL category. Configure 'Wildfire Inline ML Action' on antivirus profiles
    to a value of 'reset-both' for all decoders except imap and pop3 under 'Wildfire Inline ML Action'. If required by the
    organization's email implementation, configure imap and pop3 decoders to 'alert' under 'Wildfire Inline ML Action'.
  rationale: Preventing users from having the ability to submit their corporate credentials to the Internet could stop credential
    phishing attacks and the potential that a breach at a site where a user reused credentials could lead to a credential
    stuffing attack. Starting from PanOS 10, Wildfire supports real-time detection and blocking. As more attacks are designed
    to bypass signature-based protection, real-time signaturelessbased protection is needed. Antivirus signatures produce
    low false positives. By blocking any detected malware through the specified decoders, the threat of malware propagation
    through the firewall is greatly reduced. It is recommended to mitigate malware found in pop3 and imap through a dedicated
    antivirus gateway. Due to the nature of the pop3 and imap protocols, the firewall is not able to block only a single email
    message containing malware. Instead, the entire session would be terminated, potentially affecting benign email messages.
  impact: Not preventing users from submitting their corporate credentials to the Internet can leave them open to phishing
    attacks or allow for credential reuse on unauthorized sites. Using internal email accounts provides malicious actors with
    intelligence information, which can be used for phishing, credential stuffing and other attacks. Using internal passwords
    will often provide authenticated access directly to sensitive information. Not only that, but a pattern of credential
    re-use can expose personal information from multiple online sources.
  references:
  - 1. PAN OS 11.1 Admin Guide - URL Filtering / User Credential Detection -
  - https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-web-interfacehelp/objects/objects-security-profiles-url-filtering/user-credential-detection
  - 1. “PAN-OS Administrator's Guide 11.1 (English) - Security Profiles” -
  - https://docs.paloaltonetworks.com/advanced-wildfire/administration/configureadvanced-wildfire-analysis/enable-advanced-wildfire-inline-ml
