- id: '6.2'
  title: Ensure a secure antivirus profile is applied to all relevant security policies
  scoring: manual
  profile:
  - Level 1
  description: Create a secure antivirus profile and apply it to all security policies that could pass HTTP, SMTP, IMAP, POP3,
    FTP, or SMB traffic. The antivirus profile may be applied to the security policies directly or through a profile group.
  rationale: By applying a secure antivirus profile to all applicable traffic, the threat of malware propagation through the
    firewall is greatly reduced. Without an antivirus profile assigned to any potential hostile zone, the first protection
    in the path against malware is removed, leaving in most cases only the desktop endpoint protection application to detect
    and remediate any potential malware.
  impact: Not having an AV Profile on a Security Policy allows signature-based malware to transit the security boundary without
    blocks or alerts. In most cases this leaves only the Endpoint Security application to block or alert malware.
  references:
  - 1. “PAN-OS Administrator's Guide 11.1 (English) - Security Policies ” -
  - https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/policy/securitypolicy
  - 2. “PAN-OS Administrator's Guide 11.1 (English) - Security Profiles” -
  - https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/policy/securityprofiles
