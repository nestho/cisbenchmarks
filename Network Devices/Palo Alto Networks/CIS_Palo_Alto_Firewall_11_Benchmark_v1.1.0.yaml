- id: '3.1'
  title: Ensure a fully-synchronized High Availability peer is configured
  scoring: scored
  profile:
  - Level 1
  description: Ensure a High Availability peer is fully synchronized and in a passive or active state.
  rationale: To ensure availability of both the firewall and the resources it protects, a High Availability peer is required.
    In the event a single firewall fails, or when maintenance such as a software update is required, the HA peer can be used
    to automatically fail over session states and maintain overall availability
  impact: Not configuring High Availability (HA) correctly directly impacts the Availability of the system. With HA in place,
    standard maintenance such as OS updates, network and power cabling can be accomplished with no outage or a minimum impact.
  references:
  - 1. “PAN-OS Administrator's Guide 11.1 (English) - High Availability" -
  - https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-web-interfacehelp/device/device-high-availability
