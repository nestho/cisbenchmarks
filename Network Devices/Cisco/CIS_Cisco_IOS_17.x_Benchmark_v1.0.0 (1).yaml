- id: 1.1.7
  title: Set 'aaa accounting' to log all privileged use commands using 'commands 15'
  scoring: scored
  profile:
  - Level 2
  description: Runs accounting for all commands at the specified privilege level.
  rationale: Authentication, authorization and accounting (AAA) systems provide an authoritative source for managing and monitoring
    access for devices. Centralizing control improves consistency of access control, the services that may be accessed once
    authenticated and accountability by tracking services accessed. Additionally, centralizing access control simplifies and
    reduces administrative costs of account provisioning and de-provisioning, especially when managing a large number of devices.
    AAA Accounting provides a management and audit trail for user and administrative sessions through RADIUS or TACACS+.
  impact: Enabling 'aaa accounting' for privileged commands records and sends activity to the accounting servers and enables
    organizations to monitor and analyze privileged activity.
  references: []
  page_start: 25
  audit_raw: 'Perform the following to determine if aaa accounting for commands is required:

    Verify a command string result returns

    hostname#show running-config | incl aaa accounting commands'
  remediation: 'Configure AAA accounting for commands.

    hostname(config)#aaa accounting commands 15 {default | list-name | guaranteefirst}

    {start-stop | stop-only | none} {radius | group group-name}'
  checks:
  - type: sql
    command: show running-config | incl aaa accounting commands
    severity: medium
    info: 'Perform the following to determine if aaa accounting for commands is required:

      Verify a command string result returns

      hostname#show running-config | incl aaa accounting commands'
- id: 1.1.8
  title: Set 'aaa accounting connection'
  scoring: scored
  profile:
  - Level 2
  description: Provides information about all outbound connections made from the network access server.
  rationale: Authentication, authorization and accounting (AAA) systems provide an authoritative source for managing and monitoring
    access for devices. Centralizing control improves consistency of access control, the services that may be accessed once
    authenticated and accountability by tracking services accessed. Additionally, centralizing access control simplifies and
    reduces administrative costs of account provisioning and de-provisioning, especially when managing a large number of devices.
    AAA Accounting provides a management and audit trail for user and administrative sessions through RADIUS and TACACS+.
  impact: Implementing aaa accounting connection creates accounting records about connections from the network access server.
    Organizations should regular monitor these connection records for exceptions, remediate issues, and report findings regularly.
  references:
  - 1. http://www.cisco.com/en/US/docs/ios-xml/ios/security/a1/sec-cr-a1.html#GUID0520BCEF-89FB-4505-A5DF-D7F1389F1BBA
  page_start: 27
  audit_raw: 'Perform the following to determine if aaa accounting for connection is required:

    Verify a command string result returns

    hostname#show running-config | incl aaa accounting connection'
  remediation: 'Configure AAA accounting for connections.

    hostname(config)#aaa accounting connection {default | list-name | guaranteefirst}

    {start-stop | stop-only | none} {radius | group group-name}

    27 | P a g e'
  checks:
  - type: sql
    command: show running-config | incl aaa accounting connection
    severity: medium
    info: 'Perform the following to determine if aaa accounting for connection is required:

      Verify a command string result returns

