  remediation: 'Configure AAA accounting for EXEC shell session.

    hostname(config)#aaa accounting exec {default | list-name | guarantee-first}

    {start-stop | stop-only | none} {radius | group group-name}'
  checks:
  - type: sql
    command: show running-config | incl aaa accounting exec
    severity: medium
    info: 'Perform the following to determine if aaa accounting for EXEC shell session is required:

      Verify a command string result returns

