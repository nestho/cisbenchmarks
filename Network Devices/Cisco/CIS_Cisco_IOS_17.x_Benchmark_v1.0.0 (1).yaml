- id: 1.1.9
  title: Set 'aaa accounting exec'
  scoring: scored
  profile:
  - Level 2
  description: Runs accounting for the EXEC shell session.
  rationale: Authentication, authorization and accounting (AAA) systems provide an authoritative source for managing and monitoring
    access for devices. Centralizing control improves consistency of access control, the services that may be accessed once
    authenticated and accountability by tracking services accessed. Additionally, centralizing access control simplifies and
    reduces administrative costs of account provisioning and de-provisioning, especially when managing a large number of devices.
    AAA Accounting provides a management and audit trail for user and administrative sessions through RADIUS and TACACS+.
  impact: Enabling aaa accounting exec creates accounting records for the EXEC terminal sessions on the network access server.
    These records include start and stop times, usernames, and date information. Organizations should regularly monitor these
    records for exceptions, remediate issues, and report findings.
  references:
  - 1. http://www.cisco.com/en/US/docs/ios-xml/ios/security/a1/sec-cr-a1.html#GUID0520BCEF-89FB-4505-A5DF-D7F1389F1BBA
  page_start: 29
