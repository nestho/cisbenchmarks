controls:
- id: 1.1.1
  title: Enable 'aaa new-model'
  scoring: scored
  profile:
  - Level 1
  description: This command enables the AAA access control system.
  rationale: Authentication, authorization and accounting (AAA) services provide an authoritative source for managing and
    monitoring access for devices. Centralizing control improves consistency of access control, the services that may be accessed
    once authenticated and accountability by tracking services accessed. Additionally, centralizing access control simplifies
    and reduces administrative costs of account provisioning and de-provisioning, especially when managing a large number
    of devices.
  impact: Implementing Cisco AAA is significantly disruptive as former access methods are immediately disabled. Therefore,
    before implementing Cisco AAA, the organization should carefully review and plan their authentication criteria (logins
    & passwords, challenges & responses, and token technologies), authorization methods, and accounting requirements.
  references:
  - 1. http://www.cisco.com/en/US/docs/ios-xml/ios/security/a1/sec-cr-a2.html#GUIDE05C2E00-C01E-4053-9D12-EC37C7E8EEC5
  page_start: 13
  audit_raw: "Perform the following to determine if AAA services are enabled:\n hostname#show running-config | inc aaa new-model\n\
    If the result includes a \"no\", the feature is not enabled.\n13 | P a g e"
  remediation: 'Globally enable authentication, authorization and accounting (AAA) using the new-model

    command.

    hostname(config)#aaa new-model'
  checks:
  - type: sql
    command: show running-config | inc aaa new-model
    severity: medium
    info: "Perform the following to determine if AAA services are enabled:\n hostname#show running-config | inc aaa new-model\n\
      If the result includes a \"no\", the feature is not enabled.\n13 | P a g e"
- id: 1.1.2
  title: Enable 'aaa authentication login'
  scoring: scored
  profile:
  - Level 1
  description: Sets authentication, authorization and accounting (AAA) authentication at login.
  rationale: Using AAA authentication for interactive management access to the device provides consistent, centralized control
    of your network. The default under AAA (local or network) is to require users to log in using a valid user name and password.
    This rule applies for both local and network AAA. Fallback mode should also be enabled to allow emergency access to the
    router or switch in the event that the AAA server was unreachable, by utilizing the LOCAL keyword after the AAA server-tag.
  impact: Implementing Cisco AAA is significantly disruptive as former access methods are immediately disabled. Therefore,
    before implementing Cisco AAA, the organization should carefully review and plan their authentication methods such as
    logins and passwords, challenges and responses, and which token technologies will be used.
  references:
  - 1. http://www.cisco.com/en/US/docs/ios-xml/ios/security/a1/sec-cr-a1.html#GUID3DB1CC8A-4A98-400B-A906-C42F265C7EA2
  page_start: 15
  audit_raw: 'Perform the following to determine if AAA authentication for login is enabled:

    hostname#show running-config | incl aaa authentication login

    If a result does not return, the feature is not enabled.'
  remediation: 'Configure AAA authentication method(s) for login authentication.

    hostname(config)#aaa authentication login {default | aaa_list_name} [passwdexpiry]

    [method1] [method2]'
  checks:
  - type: sql
    command: show running-config | incl aaa authentication login
    severity: medium
    info: 'Perform the following to determine if AAA authentication for login is enabled:

      hostname#show running-config | incl aaa authentication login

      If a result does not return, the feature is not enabled.'
- id: 1.1.3
  title: Enable 'aaa authentication enable default'
  scoring: scored
  profile:
  - Level 1
  description: Authenticates users who access privileged EXEC mode when they use the enable command.
  rationale: Using AAA authentication for interactive management access to the device provides consistent, centralized control
    of your network. The default under AAA (local or network) is to require users to log in using a valid user name and password.
    This rule applies for both local and network AAA.
  impact: Enabling Cisco AAA 'authentication enable' mode is significantly disruptive as former access methods are immediately
    disabled. Therefore, before enabling 'aaa authentication enable default' mode, the organization should plan and implement
    authentication logins and passwords, challenges and responses, and token technologies.
  references:
  - 1. http://www.cisco.com/en/US/docs/ios-xml/ios/security/a1/sec-cr-a1.html#GUID4171D649-2973-4707-95F3-9D96971893D0
  page_start: 17
  audit_raw: 'Perform the following to determine if AAA authentication enable mode is enabled:

    hostname#show running-config | incl aaa authentication enable

    If a result does not return, the feature is not enabled'
  remediation: 'Configure AAA authentication method(s) for enable authentication.

    hostname(config)#aaa authentication enable default {method1} enable'
  checks:
  - type: sql
    command: show running-config | incl aaa authentication enable
    severity: medium
    info: 'Perform the following to determine if AAA authentication enable mode is enabled:

      hostname#show running-config | incl aaa authentication enable

      If a result does not return, the feature is not enabled'
