  scoring: scored
  profile:
  - Level 1
  description: Generate keepalive packets on idle incoming network connections.
  rationale: Stale connections use resources and could potentially be hijacked to gain illegitimate access. The TCP keepalives-in
    service generates keepalive packets on idle incoming network connections (initiated by remote host). This service allows
