- id: 1.2.1
  title: Set 'privilege 1' for local users
  scoring: scored
  profile:
  - Level 1
  description: Sets the privilege level for the user.
  rationale: Default device configuration does not require strong user authentication potentially enabling unfettered access
    to an attacker that is able to reach the device. Creating a local account with privilege level 1 permissions only allows
    the local user to access the device with EXEC-level permissions and will be unable to modify the device without using
    the enable password. In addition, require the use of an encrypted password as well (see Section 1.1.4.4 - Require Encrypted
    User Passwords).
  impact: Organizations should create policies requiring all local accounts with 'privilege level 1' with encrypted passwords
    to reduce the risk of unauthorized access. Default configuration settings do not provide strong user authentication to
    the device.
  references:
  - 1. http://www.cisco.com/en/US/docs/ios-xml/ios/security/s1/sec-cr-t2z.html#GUID-34B3E43E-0F79-40E8-82B6-A4B5F1AFF1AD
  page_start: 35
  audit_raw: 'Perform the following to determine if a user with an encrypted password is enabled:

    Verify all username results return "privilege 1"

    hostname#show running-config | incl privilege'
  remediation: 'Set the local user to privilege level 1.

    hostname(config)#username <LOCAL_USERNAME> privilege 1

    35 | P a g e'
  checks:
  - type: sql
    command: show running-config | incl privilege
    severity: medium
    info: 'Perform the following to determine if a user with an encrypted password is enabled:

      Verify all username results return "privilege 1"

      hostname#show running-config | incl privilege'
- id: 1.2.2
  title: Set 'transport input ssh' for 'line vty' connections
  scoring: scored
  profile:
  - Level 1
  description: Selects the Secure Shell (SSH) protocol.
  rationale: Configuring VTY access control restricts remote access to only those authorized to manage the device and prevents
    unauthorized users from accessing the system.
  impact: To reduce risk of unauthorized access, organizations should require all VTY management line protocols to be limited
    to ssh.
  references:
  - 1. http://www.cisco.com/en/US/docs/ios/termserv/command/reference/tsv_s1.htm
  page_start: 37
  audit_raw: 'Perform the following to determine if SSH is the only transport method for incoming VTY

    logins:

    The result should show only "ssh" for "transport input"

    hostname#show running-config | sec vty'
  remediation: 'Apply SSH to transport input on all VTY management lines

    hostname(config)#line vty <line-number> <ending-line-number>

    hostname(config-line)#transport input ssh'
  checks:
  - type: sql
    command: show only "ssh" for "transport input"
    severity: medium
    info: 'Perform the following to determine if SSH is the only transport method for incoming VTY

      logins:

      The result should show only "ssh" for "transport input"

      hostname#show running-config | sec vty'
- id: 1.2.3
  title: Set 'no exec' for 'line aux 0'
  scoring: scored
  profile:
  - Level 1
  description: The 'no exec' command restricts a line to outgoing connections only.
  rationale: Unused ports should be disabled, if not required, since they provide a potential access path for attackers. Some
    devices include both an auxiliary and console port that can be used to locally connect to and configure the device. The
    console port is normally the primary port used to configure the device; even when remote, backup administration is required
    via console server or Keyboard, Video, Mouse (KVM) hardware. The auxiliary port is primarily used for dial-up administration
    via an external modem; instead, use other available methods.
  impact: Organizations can reduce the risk of unauthorized access by disabling the 'aux' port with the 'no exec' command.
    Conversely, not restricting access through the 'aux' port increases the risk of remote unauthorized access.
  references:
  - 1. http://www.cisco.com/en/US/docs/iosxml/ios/fundamentals/command/D_through_E.html#GUID-429A2B8C-FC26-49C494C4-0FD99C32EC34
  page_start: 39
  audit_raw: 'Perform the following to determine if the EXEC process for the aux port is disabled:

    Verify no exec

    hostname#show running-config | sec aux

    Verify you see the following "no exec"

    hostname#show line aux 0 | incl exec'
  remediation: 'Disable the EXEC process on the auxiliary port.

    hostname(config)#line aux 0

    hostname(config-line)#no exec

    39 | P a g e'
  checks:
  - type: sql
    command: show running-config | sec aux
    severity: medium
    info: 'Perform the following to determine if the EXEC process for the aux port is disabled:

      Verify no exec

      hostname#show running-config | sec aux

      Verify you see the following "no exec"

      hostname#show line aux 0 | incl exec'
- id: 1.2.4
  title: Create 'access-list' for use with 'line vty'
  scoring: scored
  profile:
  - Level 1
  description: Access lists control the transmission of packets on an interface, control Virtual Terminal Line (VTY) access,
    and restrict the contents of routing updates. The Cisco IOS software stops checking the extended access list after a match
    occurs.
  rationale: VTY ACLs control what addresses may attempt to log in to the router. Configuring VTY lines to use an ACL, restricts
    the sources where a user can manage the device. You should limit the specific host(s) and or network(s) authorized to
    connect to and configure the device, via an approved protocol, to those individuals or systems authorized to administer
    the device. For example, you could limit access to specific hosts, so that only network managers can configure the devices
    only by using specific network management workstations. Make sure you configure all VTY lines to use the same ACL.
  impact: Organizations can reduce the risk of unauthorized access by implementing access-lists for all VTY lines. Conversely,
    using VTY lines without access-lists increases the risk of unauthorized access.
  references:
  - 1. http://www.cisco.com/en/US/docs/ios-xml/ios/security/a1/sec-cr-a2.html#GUID9EA733A3-1788-4882-B8C3-AB0A2949120C
  page_start: 41
  audit_raw: 'Perform the following to determine if the ACL is created:

    Verify the appropriate access-list definitions

    hostname#sh ip access-list <vty_acl_number>'
  remediation: 'Configure the VTY ACL that will be used to restrict management access to the device.

    hostname(config)#access-list <vty_acl_number> permit tcp

    <vty_acl_block_with_mask> any

    hostname(config)#access-list <vty_acl_number> permit tcp host <vty_acl_host>

    any

    hostname(config)#deny ip any any log

    41 | P a g e'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the ACL is created:

      Verify the appropriate access-list definitions

      hostname#sh ip access-list <vty_acl_number>'
    severity: medium
- id: 1.2.5
  title: Set 'access-class' for 'line vty'
  scoring: scored
  profile:
  - Level 1
  description: The 'access-class' setting restricts incoming and outgoing connections between a particular vty (into a Cisco
    device) and the networking devices associated with addresses in an access list.
  rationale: Restricting the type of network devices, associated with the addresses on the access-list, further restricts
    remote access to those devices authorized to manage the device and reduces the risk of unauthorized access.
  impact: Applying 'access'class' to line VTY further restricts remote access to only those devices authorized to manage the
    device and reduces the risk of unauthorized access. Conversely, using VTY lines with 'access class' restrictions increases
    the risks of unauthorized access.
  references:
  - 1. http://www.cisco.com/en/US/docs/ios-xml/ios/security/a1/sec-cr-a2.html#GUIDFB9BC58A-F00A-442A-8028-1E9E260E54D3
  page_start: 43
  audit_raw: 'Perform the following to determine if the ACL is set:

    Verify you see the access-class defined

    hostname#sh run | sec vty <line-number> <ending-line-number>'
  remediation: 'Configure remote management access control restrictions for all VTY lines.

    hostname(config)#line vty <line-number> <ending-line-number>

    hostname(config-line)# access-class <vty_acl_number> in'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the ACL is set:

      Verify you see the access-class defined

      hostname#sh run | sec vty <line-number> <ending-line-number>'
    severity: medium
- id: 1.2.6
  title: Set 'exec-timeout' to less than or equal to 10 minutes for 'line aux 0'
  scoring: scored
  profile:
  - Level 1
  description: If no input is detected during the interval, the EXEC facility resumes the current connection. If no connections
    exist, the EXEC facility returns the terminal to the idle state and disconnects the incoming session.
  rationale: This prevents unauthorized users from misusing abandoned sessions. For example, if the network administrator
    leaves for the day and leaves a computer open with an enabled login session accessible. There is a trade-off here between
    security (shorter timeouts) and usability (longer timeouts). Review your local policies and operational needs to determine
    the best timeout value. In most cases, this should be no more than 10 minutes.
  impact: Organizations should prevent unauthorized use of unattended or abandoned sessions by an automated control. Enabling
    'exec-timeout' with an appropriate length of minutes or seconds prevents unauthorized access of abandoned sessions.
  references:
  - 1. http://www.cisco.com/en/US/docs/iosxml/ios/fundamentals/command/D_through_E.html#GUID-76805E6F-9E89-4457A9DC-5944C8FE5419
  page_start: 45
  audit_raw: 'Perform the following to determine if the timeout is configured:

    Verify you return a result NOTE: If you set an exec-timeout of 10 minutes, this will not

    show up in the configuration

    hostname#sh run | sec line aux 0'
  remediation: 'Configure device timeout (10 minutes or less) to disconnect sessions after a fixed idle time.

    hostname(config)#line aux 0

    hostname(config-line)#exec-timeout <timeout_in_minutes> <timeout_in_seconds>

    45 | P a g e'
