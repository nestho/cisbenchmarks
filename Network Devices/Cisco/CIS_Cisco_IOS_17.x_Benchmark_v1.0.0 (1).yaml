- id: 1.4.1
  title: Set 'password' for 'enable secret'
  scoring: scored
  profile:
  - Level 1
  description: Use the enable secret command to provide an additional layer of security over the enable password. The enable
    secret command provides better security by storing the enable secret password using a nonreversible cryptographic function.
    The added layer of security encryption provides is useful in environments where the password crosses the network or is
    stored on a TFTP server.
  rationale: Requiring the enable secret setting protects privileged EXEC mode. By default, a strong password is not required,
    a user can just press the Enter key at the Password prompt to start privileged mode. The enable password command causes
    the device to enforce use of a password to access privileged mode. Enable secrets use a one-way cryptographic hash (MD5).
    This is preferred to Level 7 enable passwords that use a weak, well-known, and easily reversible encryption algorithm.
  impact: Organizations should protect privileged EXEC mode through policies requiring the 'enabling secret' setting, which
    enforces a one-way cryptographic hash (MD5).
  references:
  - 1. http://www.cisco.com/en/US/docs/ios-xml/ios/security/d1/sec-cre1.html#GUID-944C261C-7D4A-49E1-AA8F-C754750BDE47
  page_start: 68
  audit_raw: 'Perform the following to determine enable secret is set:

    If the command does not return a result, the enable password is not set.

    hostname#sh run | incl enable secret'
  remediation: 'Configure a strong, enable secret password.

    hostname(config)#enable secret {ENABLE_SECRET_PASSWORD}

    68 | P a g e'
  checks:
  - type: manual_review
    info: 'Perform the following to determine enable secret is set:

      If the command does not return a result, the enable password is not set.

      hostname#sh run | incl enable secret'
    severity: medium
- id: 1.4.2
  title: Enable 'service password-encryption'
  scoring: scored
  profile:
  - Level 1
  description: When password encryption is enabled, the encrypted form of the passwords is displayed when a more system:running-config
    command is entered.
  rationale: This requires passwords to be encrypted in the configuration file to prevent unauthorized users from learning
    the passwords just by reading the configuration. When not enabled, many of the device's passwords will be rendered in
    plain text in the configuration file. This service ensures passwords are rendered as encrypted strings preventing an attacker
    from easily determining the configured value.
  impact: Organizations implementing 'service password-encryption' reduce the risk of unauthorized users learning clear text
    passwords to Cisco IOS configuration files. However, the algorithm used is not designed to withstand serious analysis
    and should be treated like clear-text.
  references:
  - 1. http://www.cisco.com/en/US/docs/ios-xml/ios/security/s1/sec-cr-s1.html#GUIDCC0E305A-604E-4A74-8A1A-975556CE5871
  page_start: 70
  audit_raw: 'Perform the following to determine if a user with an encrypted password is enabled:

    Ensure a result that matches the command return

    hostname#sh run | incl service password-encryption'
