- id: 3.1.2
  title: Set 'no ip proxy-arp'
  scoring: scored
  profile:
  - Level 2
  description: Disable proxy ARP on all interfaces.
  rationale: Address Resolution Protocol (ARP) provides resolution between IP and MAC Addresses (or other Network and Link
    Layer addresses on none IP networks) within a Layer 2 network. Proxy ARP is a service where a device connected to one
    network (in this case the Cisco router) answers ARP Requests which are addressed to a host on another network, replying
    with its own MAC Address and forwarding the traffic on to the intended host. Sometimes used for extending broadcast domains
    across WAN links, in most cases Proxy ARP on enterprise networks is used to enable communication for hosts with misconfigured
    subnet masks, a situation which should no longer be a common problem. Proxy ARP effectively breaks the LAN Security Perimeter,
    extending a network across multiple Layer 2 segments. Using Proxy ARP can also allow other security controls such as PVLAN
    to be bypassed.
  impact: Organizations should plan and implement network policies to ensure unnecessary services are explicitly disabled.
    The 'ip proxy-arp' feature effectively breaks the LAN security perimeter and should be disabled.
  references:
  - 1. http://www.cisco.com/en/US/docs/ios-xml/ios/ipaddr/command/ipaddri4.html#GUID-AEB7DDCB-7B3D-4036-ACF0-0A0250F3002E
  page_start: 171
  audit_raw: 'Verify the proxy ARP status

    hostname#sh ip int {<em>interface</em>} | incl proxy-arp

    171 | P a g e'
  remediation: 'Disable proxy ARP on all interfaces.

    hostname(config)#interface {interface}

    hostname(config-if)#no ip proxy-arp'
  checks:
  - type: manual_review
    info: 'Verify the proxy ARP status

      hostname#sh ip int {<em>interface</em>} | incl proxy-arp

      171 | P a g e'
    severity: medium
