    severity: medium
    info: Hostname#show auto secure config
- id: 1.6.3
  title: Configuring Kerberos
  scoring: scored
  profile:
  - Level 2
  description: 'Kerberos is a secret-key network authentication protocol, developed at the Massachusetts Institute of Technology
    (MIT), that uses the Data Encryption Standard (DES) cryptographic algorithm for encryption and authentication. Kerberos
    was designed to authenticate requests for network resources. Kerberos, like other secret-key systems, is based on the
    concept of a trusted third party that performs secure verification of users and services. In the Kerberos protocol, this
    trusted third party is called the key distribution center (KDC). The primary use of Kerberos is to verify that users and
    the network services they use are really who and what they claim to be. To accomplish this, a trusted Kerberos server
    issues tickets to users. These tickets, which have a limited lifespan, are stored in a user’s credential cache and can
    be used in place of the standard username-and-password authentication mechanism. The Kerberos credential scheme embodies
    a concept called “single logon.” This process requires authenticating a user once, and then allows secure authentication
    (without encrypting another password) wherever that user’s credential is accepted. Cisco IOS XE software includes Kerberos
    5 support, which allows organizations already deploying Kerberos 5 to use the same Kerberos authentication database on
    their routers that they are already using on their other network hosts (such as UNIX servers and PCs). The following network
    services are supported by the Kerberos authentication capabilities in Cisco IOS XE software: Telnet rlogin rsh rcp'
  rationale: 'Authenticating to the Boundary Router This section describes the first layer of security that remote users must
    pass through when they attempt to access a network. The first step in 102 | P a g e the Kerberos authentication process
    is for users to authenticate themselves to the boundary router. The following process describes how users authenticate
    to a boundary router:'
  impact: A remote user who successfully initiates a PPP session and authenticates to the boundary router is inside the firewall
    but still must authenticate to the KDC directly before being allowed to access network services. This is because the TGT
    issued by the KDC is stored on the router and is not useful for additional authentication unless the user physically logs
    on to the router.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/iosxml/ios/sec_usr_cfg/configuration/xe-16-5/sec-usr-cfg-xe-16-5-book/sec-cfgkerberos.html
  page_start: 102
  audit_raw: Hostname#show kerberos cred
  remediation: 'Adding Users to the KDC Database

    Hostname# ank {username@REALM}

    Hostname# ank {username/instance@REALM

    Creating SRVTABs on the KDC

    Hostname# ark {SERVICE/HOSTNAME@REALM}

    Make entries for all network services on all Kerberized hosts that use this KDC for

    authentication.

    Defining a Kerberos Realm

    Hostname#(config)kerberos local-realm {kerberos-realm}

    Hostname#(config)kerberos server {kerberos-realm {hostname | ip-address}}

    {port-number}

    Hostname#(config)kerberos realm {dns-domain | host} {kerberos-realm}'
  checks:
  - type: sql
    command: show kerberos cred
    severity: medium
    info: Hostname#show kerberos cred
- id: 1.6.4
  title: Configure Web interface
  scoring: scored
  profile:
  - Level 2
  description: 'Web-based authentication is an ingress-only feature. You can configure web-based authentication only on access
    ports. Web-based authentication is not supported on trunk ports, EtherChannel member ports, or dynamic trunk ports. External
    web authentication, where the switch redirects a client to a particular host or web server for displaying login message,
    is not supported. You cannot authenticate hosts on Layer 2 interfaces with static ARP cache assignment. These hosts are
