- id: '1.7'
  title: Time Services 1.7.1 Configure at least 2 external NTP Servers
  scoring: manual
  profile:
  - Level 1
  description: Accurate time is a critical piece of security infrastructure. Without accurate time on all infrastructure,
    it is complex or even impossible to correlate events from multiple sources to get an accurate view of a security incident
    or technical issue. Using multiple sources gives redundancy in time sources. In most infrastructures, for efficiency only
    a small subset of devices (often a redundant pair of routers or switches) will use redundant external time sources. All
    other infrastructure will then synchronize time from them. This also means that any perimeter firewalls can be configured
    to limit NTP requests to the public internet to just those sources and destinations. The exception would of course be
    if the organization has an on-premise, internal atomic or GPS based network time source. Even in those situations an tiered
    NTP infrastructure is generally recommended on the internal network.
  rationale: Accurate time is a critical piece of security infrastructure. Without accurate time on all infrastructure, it
    is complex or even impossible to correlate events from multiple sources to get an accurate view of a security incident
    or technical issue. Also, without accurate time authentication issues can arise. If an attacker can influence the NTP
    traffic, it is possible to "back-date" NTP responses to permit the use of older certificates, or "forward-date" NTP responses
    to invalidate any certificates in use on the device. Using multiple sources gives redundancy in time sources. If a management
    network is in use in the infrastructure, using the management VRF to source time can help to protect NTP response traffic
    from tampering. It is key to set an NTP source interface, so that any perimeter devices can be configured to permit NTP
    requests from those IP addresses, and to restrict NTP requests to a list of authorized IP addresses. Be sure that this
    is a "reliable" interface. In many cases this means using a loopback interface, so that any of several interfaces can
    be used to route the request to the NTP server. If a non-loopback interface is used, understand that if that interface
    is in a down state then NTP requests will not be sent.
  impact: Accurate time is a critical piece of security infrastructure. Without accurate time on all infrastructure, it is
    complex or even impossible to correlate events from multiple sources to get an accurate view of a security incident or
    technical issue.
  references: []
  page_start: 103
  audit_raw: 'The "show running-config ntp" command will list all configured NTP servers. Note that

    the IP addresses are for demonstrations purposes only, production configurations will

    likely vary.

    switch(config)# sho run ntp

