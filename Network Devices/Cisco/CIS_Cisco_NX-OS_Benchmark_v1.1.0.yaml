- id: 1.4.4
  title: Set password length for local credentials
  scoring: manual
  profile:
  - Level 1
  description: Password length should be set to some value that makes compromising any captured hashed difficult. This generally
    means that the maximum value of 127 should never be changed, and that the minimum value, which defaults to 8, should always
    be increased. Typical values for minimum passphrase length of administrative users are generally 20 characters or longer
    (values of 30 or 32 are often seen). A specific value is not recommended, since then a savvy attacker may start their
    attack with "only passwords of the exact length recommended in the CIS benchmark", which would reduce their attack time.
  rationale: Passwords are stored in a non-reversible, hashed and salted format. If an attacker should "harvest" a password
    hash, it is of course hashed in a non-reversible format - however, it can be decoded using dictionary and/or brute-force
    attacks using tools such as hashcat or John the Ripper (JtR). The single best obstacle to an attack of this type is password
    length - the longer the password the more difficult it is to decode. Since the default password hash schema on the NX-OS
    version 9 platform is MD5, it's recommended that the password length be set to (and enforced at) some longer value, for
    instance 24, 32 or even longer values. This may seem lengthy, until you consider that with modern hardware running through
    the entire namespace of 8 or 9 characters is often easily done in less than an hour. This discussion actually illustrates
    why the best recommendation is to not use local credentials at all, but rather to use a back-end authentication source
    (using RADIUS or TACACS+). In this scenario, local administrative accounts are only used if the back-end authentication
    source is unavailable. This makes any compromised local credentials much harder to use, a successful attack would have
    to also take back end authentication sources offline (or make them otherwise unavailable).
  impact: Not setting a maximum value leaves administrators with the freedom to set short passwords. If a stored configuration
    file is collected by an attacker (perhaps from a file share), this means that any password hashes in the stored configuration
    will be more likely to be "cracked", giving the attacker the unencrypted credential to the target switch.
  references: []
  page_start: 59
  audit_raw: 'The "show userpassphrase length" command will display the minimum and maximum

    password length values.

    switch# sho userpassphrase length

    Minimum passphrase length : 20

    Maximum passphrase length : 127

    Alternatively, the single resulting configuration command can be displayed:

    switch# sho run | i min-length

    userpassphrase min-length 20 max-length 127'
  remediation: 'Passphrase length values can only be set globally, not per-local user

    switch(config)# userpassphrase min-length <minimum passphrase length>

    switch(config)# userpassphrase max-length <maximum passphrase length>

    or in a single command:

    userpassphrase min-length max-length

    example:

    switch(config)# userpassphrase min-length 20

    switch(config)# userpassphrase max-length 127

    Or in a single command:

    switch(config)# userpassphrase min-length 20 max-length 127'
  checks:
  - type: sql
    command: show userpassphrase length" command will display the minimum and maximum
    severity: medium
    info: 'The "show userpassphrase length" command will display the minimum and maximum

      password length values.

      switch# sho userpassphrase length

      Minimum passphrase length : 20

      Maximum passphrase length : 127

      Alternatively, the single resulting configuration command can be displayed:

      switch# sho run | i min-length

      userpassphrase min-length 20 max-length 127'
- id: 1.5.1
  title: If SNMPv2 is in use, use a Complex Community String
  scoring: manual
  profile:
  - Level 1
  description: SNMP v2 while similar to v1 aside from adding support for 64 bit counters and the ability to use complex strings.
  rationale: Utilizing complex strings with SNMPv2 is no different then using complex passwords. By using the complex string
    you are making it more difficult for an attacker to guess the string. Strings should not contain dictionary words or rely
    on "l33t-speak" spelling. Keep in mind that SNMPv2 is a clear-text protocol, so is subject to interception. This means
    that these strings are passed in clear-text during SNMPv2 operations, so can be "harvested" by a well-positioned attacker.
    Also SNMP results are susceptible to capture or modification in transit.
  impact: ''
  references: []
  page_start: 62
  audit_raw: 'switch(config)# sho snmp community

    Community Group / Access context acl_filter

    _________ ______________ _______ __________

    <SomeComplexString> network-operator'
  remediation: switch(config)# snmp-server community <SomeComplexString> ro
  checks:
  - type: manual_review
    info: 'switch(config)# sho snmp community

      Community Group / Access context acl_filter

      _________ ______________ _______ __________

      <SomeComplexString> network-operator'
    severity: medium
- id: 1.5.2
  title: If SNMPv2 is in use, set Restrictions on Access
  scoring: manual
  profile:
  - Level 1
  description: NX-OS allows administrators to restrict SNMPv2 access to known management stations, usually servers with an
    NMS (Network Management System) installed. It is recommended that only known NMS servers have access to SNMPv2 functions
    on network infrastructure. While SNMP is not enabled by default on the NX-OS platform, historically the SNMP strings of
    "public" (for read-only access) and "private" (for readwrite access) have been used. These well-known values should never
    be configured.
  rationale: Since SNMPv2 is a clear-text UDP protocol, this combination means that even this precaution still exposes this
    traffic to spoofing, eavesdropping and in-flight modification attacks. It also means that the switch can be used as a
    DDOS amplification host if the NMS server's IP address is known. For all of these reasons, the best recommendation is
    in fact to disable SNMPv2 and use SNMPv3. Proceed with this recommendation only if you must use SNMPv2 for some reason.
  impact: If SNMPv2 is configured, not restricting access to SNMPv2 allows an attacker to launch a dictionary and/or a brute
    force attack to compromise the SNMPv2 community string. This would then give the attacker the ability to collect key information
    from the target switch, including it's version, interface status and configuration parameters.
  references: []
  page_start: 64
  audit_raw: "The \"show snmp community\" command will show all configured community strings and\ntheir applied ACLs:\nswitch(config)#\
    \ sho snmp community\nCommunity Group / Access context acl_filter\n_________ ______________ _______ __________\nsomecomplexstring\
    \ network-operator ACL mapped: ipv4:ACLIPV4-SNMPv2\nTo show the exact and complete configuration commands, use \"show\
    \ runningconfiguration snmp\":\nswitch# show run snmp\n!Command: show running-config snmp\n!Running configuration last\
    \ done at: Thu Apr 30 21:47:03 2020\n!Time: Thu Apr 30 21:48:48 2020\nversion 9.3(3) Bios:version\nsnmp-server community\
    \ somecomplexstring group network-operator\nsnmp-server community somecomplexstring use-ipv4acl ACL-IPV4-SNMPv2\nFinally,\
    \ to show the ACL, use the \"show access-list\" command:\nswitch# show access-lists ACL-IPV4-SNMPv2\nIP access list ACL-IPV4-SNMPv2\n\
    \ 10 permit udp 1.2.3.4/32 3.4.5.6/32 eq snmp\n 20 permit udp 1.2.3.8/2 3.4.5.6/32 eq snmp\n 30 deny ip any any log"
  remediation: 'Create the ACL:

    switch(config)# ip access-list ACL-IPV4-SNMPv2

    switch(config-acl)# permit udp 1.2.3.4/2 1.2.3.6/32 eq 161

    switch(config-acl)# deny ip any any log

    Then apply the ACL to the configured SNMP Community. The snmp-server community

    must be configured before applying the ACL.

    switch(config)# snmp-server community <somecomplexstring> ro

    switch(config)# snmp-server community <somecomplexstring> use-ipv4acl ACLIPV4-SNMPV2

    For IPv6, the parameter "use-ipv6acl" would be used instead. Note that either an IPv4

    OR an IPv6 ACL can be applied to a given SNMP community string, not both.

    In releases prior to Cisco NX-OS Release 7.0(3)I4(1), this CLI command includes useacl rather than use-ipv4acl.'
  checks:
  - type: sql
    command: show snmp community" command will show all configured community strings and
    severity: medium
    info: 'The "show snmp community" command will show all configured community strings and

      their applied ACLs:

      switch(config)# sho snmp community

      Community Group / Access context acl_filter

      _________ ______________ _______ __________

      somecomplexstring network-operator ACL mapped: ipv4:ACLIPV4-SNMPv2

      To show the exact and complete configuration commands, use "show runningconfiguration snmp":

      switch# show run'
- id: 1.5.3
  title: Configure SNMPv3
  scoring: manual
  profile:
  - Level 2
  description: The Simple Network Management Protocol (SNMP) is an application-layer protocol that provides a message format
    for communication between SNMP managers and agents. SNMP provides a standardized framework and a common language used
    for the monitoring and management of devices in a network. SNMPv3 provides secure access to devices by a combination of
    authenticating and encrypting frames over the network.
  rationale: SNMPv3 provides for both security models and security levels. A security model is an authentication strategy
    that is set up for a user and the role in which the user resides. A security level is the permitted level of security
    within a security model. A combination of a security model and a security level determines which security mechanism is
    employed when handling an SNMP packet.
  impact: 'SNMPv3 provides security features such as: • Message Integrity - Ensures that a packet has not be tampered with
    • Authentication - Determines message is from a valid source • Encryption - Scrambles the packet content to prevent being
    seen by unauthorized sources. SNMPv2 does not provide any of these features, as SNMPv2 is a cleartext protocol that exposes
    the community string in each exchange of information.'
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/snmp/configuration/xe3se/3850/snmp-xe-3se-3850-book/nm-snmp-snmpv3.html
  page_start: 67
  audit_raw: 'To audit the SNMPv3 configuration, use the "show run snmp" command.

    Ensure that:

    Ensure that SNMP version 3 is set

    switch# sho run snmp | i version

    version 9.3(3) Bios:version

    snmp-server host 1.2.3.4 traps version 3 priv <SNMPv3_UserName>

    Ensure that SNMPv3 encryption is enforced globally for all users:

    switch# sho run snmp | i global

    snmp-server globalEnforcePriv

    Ensure that SNMP Users have appropriate access levels:

    switch# sho run snmp | i user

    snmp-server user SNMPv3_UserName network-admin auth sha

    0x12624c4dcb90cffeb43a1177324f547d priv 0x12624c4dcb90cffeb43a1177324f547d

    localizedkey

    SNMP version 2 is NOT set - "show run snmp | i community" should not return any

    statements (failed audit shown below)

    switch# sho run snmp | i community

    snmp-server community asdf group network-operator

    snmp-server community <SomeComplexString> group network-operator

    snmp-server community asdfasdfasf group network-operator'
  remediation: 'Create SNMPv3 Users (and groups if needed). Ensure that SHA hashes are used

    rather than MD5. Also ensure that appropriate authorization levels are set ("networkadmin" is shown below):

    switch(config)#snmp-server user SNMPv3_UserName network-admin auth sha

    0x12624c4dcb90cffeb43a1177324f547d priv 0x12624c4dcb90cffeb43a1177324f547d

    localizedkey

    To set SNMP to version 3, add the "version" parameter to the snmp-server command

    (note that SNMPv3 users and groups need to be configured first):

    switch(config)# snmp-server host 1.2.3.4 traps version 3 priv

    <SNMPv3_UserName>

    To enforce encryption for all SNMPv3 Users. This can be done by individual user, but

    it''s recommended to enforce it globally:

    switch(config)# snmp-server globalEnforcePriv'
  checks:
