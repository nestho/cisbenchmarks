- id: 1.6.2
  title: Log all Successful and Failed Administrative Logins
  scoring: scored
  profile:
  - Level 2
  description: By default failed logins are logged, but successful logins are not logged. This makes any configuration changes
    or successful malicious activity difficult to correctly attribute.
  rationale: Logging of all device login attempts allows the security team to investigate all login attempts and successful
    logins as needed. In some organizations and for some switches, even successful logins will be configured to generate an
    alert that must be compared against authorized changes or assigned tickets. Without logging both successful and failed
    logins, several important components of any investigation may not be easily available for any subsequent investigation
    or analysis (userids, source IP addresses, login times and so on).
  impact: Not logging successful logins means that unauthorized commands changes will be more difficult to attribute to the
    right person (though changes are logged with the login name by default on NX-OS). It also means that otherwise suspicious
    but successful logins (either because of the time of login, the source IP or other indicator) are not logged for further
    investigation. Not logging unsuccessful logins means that brute force login attempts are not properly logged.
  references: []
  page_start: 95
  audit_raw: 'switch# sho logging level authpriv

    Facility Default Severity Current Session Severity

    -------- ---------------- ------------------------

    authpriv 3 5

    0(emergencies) 1(alerts) 2(critical)

    3(errors) 4(warnings) 5(notifications)

    6(information) 7(debugging)'
  remediation: switch(config)# login level authpriv 5
