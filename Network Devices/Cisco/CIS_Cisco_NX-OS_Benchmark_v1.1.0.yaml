      \ sho run int vlan 9\n!Command: show running-config interface Vlan9\n!Running configuration last done at: Sun Jun 21\
      \ 13:53:16 2020\n!Time: Sun Jun 21 13:53:21 2020\nversion 9.3(3) Bios:version\ninterface Vlan9\n no ip redirects\n ip\
      \ address 10.99.99.99/24\nThis shows an audit failure (no displa"
- id: 3.2.3
  title: Disable Proxy ARP on all Layer 3 Interfaces
  scoring: manual
  profile:
  - Level 1
  description: Proxy ARP is the technique in which one host, usually a router, answers ARP requests intended for another machine
    on a different network segment (vlan or subnet). By faking its identity, the router accepts responsibility for routing
    packets to the real destination.
  rationale: ''
  impact: ''
  references: []
