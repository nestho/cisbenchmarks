    command: show running-config ntp" command will list all configured NTP servers. Note that
    severity: medium
    info: 'The "show running-config ntp" command will list all configured NTP servers. Note that

      the IP addresses are for demonstrations purposes only, production configurations will

      likely vary.

      switch(config)# sho run ntp

