    notice to authorized users of the equipment to notify them of any logging that may be configured. This banner is not appropriate
    to notify unauthorized users of any penalties to accessing the device, because after successful login corresponding laws
    might have already been violated. A post-authentication banner can often also hold asset-specific information, such as:
