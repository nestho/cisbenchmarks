- id: 3.1.2
  title: BGP 3.1.2.1 Configure BGP to Log Neighbor Changes
  scoring: manual
  profile:
  - Level 1
  description: Logging changes to the BGP peering relationships is recommended. Any logged changes will in the best case indicate
    a service issue due to standard operational issues (connectivity issues and so on) or in the worst case, could indicate
    malicious activity attempting to subvert the peering relationship and/or the routing table.
  rationale: ''
  impact: ''
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/switches/datacenter/sw/4_2/nxos/unicast/configuration/guide/l3_cli_nxos/l3_bgp.html
  page_start: 148
  audit_raw: "The \"show running-config bgp\" command will list out the full BGP configuration. For\neach BGP neighbor stanza,\
    \ ensure that the \"log-neighbor-changes\" command is\npresent.\nswitch# sho run bgp\n!Command: show running-config bgp\n\
    !Running configuration last done at: Wed May 20 11:47:06 2020\n!Time: Wed May 20 11:47:10 2020\nversion 9.3(3) Bios:version\n\
    feature bgp\nrouter bgp 65520\n router-id 10.10.10.10\n neighbor 10.10.10.11\n remote-as 65521\n log-neighbor-changes\n\
    Logging events triggered by BGP sessions being established or dropped are shown\nbelow. The keyword \"BGP-5-ADJCHANGE\"\
    , or just \"ADJCHANGE\" should be\nconfigured in any logging or SIEM platform to generate an alert.\nswitch# sho logging\
    \ | i ADJCHANGE\n2020 May 20 11:54:18 CISNXOS9 %BGP-5-ADJCHANGE: bgp- [7984] (default)\nneighbor 10.10.10.11 Up\n2020\
