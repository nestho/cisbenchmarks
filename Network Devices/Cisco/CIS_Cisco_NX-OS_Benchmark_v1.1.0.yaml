- id: '3.3'
  title: Basic Layer 2 Protections 3.3.1 Configure DHCP Trust
  scoring: manual
  profile:
  - Level 1
  description: You can configure whether DHCP snooping trusts traffic sources. An untrusted source may initiate traffic attacks
    or other hostile actions. To prevent such attacks, DHCP snooping filters messages from untrusted sources. In an enterprise
    network, a trusted source is a device that is under your administrative control. These devices include the switches, routers,
    and servers in the network. Any device beyond the firewall or outside the network is an untrusted source. Generally, host
    ports are treated as untrusted sources.
  rationale: In a service provider environment, any device that is not in the service provider network is an untrusted source
    (such as a customer switch). Host ports are untrusted sources. In the Cisco NX-OS device, you indicate that a source is
    trusted by configuring the trust state of its connecting interface. The default trust state of all interfaces is untrusted.
    You must configure DHCP server interfaces as trusted. You can also configure other interfaces as trusted if they connect
    to devices (such as switches or routers) inside your network. You usually do not configure host port interfaces as trusted.
  impact: 'If DHCP Trust is not configured, all ports are trusted to provide DHCP services. This situation enables a malicious
    attacker to provide incorrect DHCP information, for instance an attacker could: • provide a malicious host IP as the default
    gateway, putting that host into a "Monkey in the Middle" position, able to intercept or modify traffic. • Provide a malicious
    host as a proxy, via DHCP option 252 (commonly called a "WPAD attack"). This routes all browser traffic to that malicious
    host (for browsers that use the system setting for proxy) • The final scenario is an end-user bringing in a rogue dhcp
    server in the form of an access point or switch that they''ve purchased themselves. The impact of this is usually that
    the entire subnet will be DOS''d - normally impacted workstations will have a different subnet (192.168.0.0/24 ort 192.168.1.0/24),
    with the rogue device as the default gateway. Configuring DHCP trust not only sends an alert to the log server or SIEM,
    it also puts the rogue DHCP port into ERR-DISABLE mode.'
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/switches/datacenter/sw/4_1/nxos/security/configuration/guide/sec_nx-os-cfg/sec_dhcpsnoop.html
  page_start: 187
  audit_raw: switch(config)# show running-config dhcp
  remediation: 'First, enable DHCP Snooping

    switch(config)#ip dhcp snooping

    Next, enable DHCP Snooping on target VLANs

    switch(config)# ip dhcp snooping vlan 100,200,250-252

    Configure Interface as Trusted

    switch(config)# interface port-channel 5

    switch(config)# ip dhcp snooping trust

    On a distribution or access switch (for instance in a wiring closet or branch office),

    typically only the uplink ports are configured as trusted - the ports leading towards the

    DHCP server

    On a datacenter switch, especially with virtualization, usually multiple ports are

    candidates for where the DHCP servers may appear on, all possible ports that may

    have a DHCP server on them should be trusted.'
  checks:
  - type: sql
    command: show running-config dhcp
    severity: medium
    info: switch(config)# show running-config dhcp
- id: 3.3.2
  title: Configure Storm Control
  scoring: manual
  profile:
  - Level 2
  description: Traffic storm control (also called traffic suppression) allows you to monitor the levels of the incoming broadcast,
    multicast, and unicast traffic over a 3.9-millisecond interval. During this interval, the traffic level, which is a percentage
    of the total available bandwidth of the port, is compared with the traffic storm control level that you configured. When
    the ingress traffic reaches the traffic storm control level that is configured on the port, traffic storm control drops
    the traffic until the interval ends.
  rationale: 'When the traffic exceeds the configured level, you can configure traffic storm control to perform the following
    optional corrective actions : Shut down—When ingress traffic exceeds the traffic storm control level that is configured
    on a port, traffic storm control puts the port into the error-disabled state. To reenable this port, you can use either
    the shutdown and no shutdown options on the configured interface, or the error-disable detection and recovery feature.
    You are recommended to use the errdisable recovery cause storm-control command for errordisable detection and recovery
    along with the errdisable recovery interval command for defining the recovery interval. The interval can range between
    30 and 65535 seconds. Trap—You can configure traffic storm control to generate an SNMP trap when ingress traffic exceeds
    the configured traffic storm control level. The SNMP trap action is enabled by default. However, storm control traps are
    not rate-limited by default. You can control the number of traps generated per minute by using the snmp-server enable
    traps storm-control trap-rate command.'
  impact: This configuration is normally non-impactful - host network interfaces operating normally do not broadcast at the
    levels that are normally set in this command. This command is primarily meant to protect the switch and more importantly
    other hosts in a broadcast domain (VLAN) from a network interface that is malfunctioning, either due to a hardware failure
    or a driver problem. Note however that this protection can prevent some malicious activity, for instance VLAN wide DOS
    attacks, higher volume ARP Cache Poisoning attacks and CAM Table overflow attacks.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/6x/security/configuration/guide/b_Cisco_Nexus_9000_Series_NXOS_Security_Configuration_Guide/b_Cisco_Nexus_9000_Series_NXOS_Security_Configuration_Guide_chapter_010000.html
