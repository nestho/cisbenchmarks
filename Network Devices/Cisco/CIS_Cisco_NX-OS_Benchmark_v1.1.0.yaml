      Ensure that SNMP Users have appr'
- id: 1.5.4
  title: Configure SNMP Traps
  scoring: manual
  profile:
  - Level 2
  description: SNMP relies on an architecture which consists of a manager and an agent. SNMP Managers can be any machine on
    the network that is running SNMP to collect and process information from the devices on either the LAN or WAN.
  rationale: Utilizing traps can alert the user of issues or compromises in advance. For example if the device is overheating
    or if an admin users account is being utilized during odd hours.
  impact: ''
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus5000/sw/config
  page_start: 70
  audit_raw: switch# sho snmp traps
  remediation: 'Examples of traps

    All notifications

    switch(config)##switch(config)#snmp-server enable traps

    CISCO-AAA-SERVER-MIB

    switch(config)#switch(config)#snmp-server enable traps aaa

    ENITY-MIB, CISCO-ENTITY-FRU-CONTROL-MIB, CISCO-ENTITY-SENSOR-MIB

    switch(config)#switch(config)#snmp-server enable traps entity

