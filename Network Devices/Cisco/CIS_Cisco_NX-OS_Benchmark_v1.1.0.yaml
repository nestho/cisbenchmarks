controls:
- id: 1.1.1.1
  title: Configure AAA Authentication - TACACS if applicable
  scoring: scored
  profile:
  - Level 1
  description: TACACS+ is an authentication protocol that Cisco NX-OS devices can use for authentication of management users
    against a remote AAA server. These management users can access the Cisco NX-OS device through any protocol and use this
    back-end authentication. Using a central authentication store (such as Active Directory) ensures that all administrative
    actions are tied to named users, making the tracking of changes much easier. It also makes tracking compromised accounts
    and malicious activities much easier.
  rationale: 'Central authentication is key as it minimizes the effort in managing named user accounts. Keeping local admin
    accounts opens the door to all the issues inherent in shared accounts, namely: • Errors in implementation being done by
    generic admin accounts, which can then be denied by all. • Shared credentials staying unchanged when administrative staff
    leave the organization or change roles. • Giving malicious actors the ability to recover shared credentials from saved
    device backups In many organizations TACACS+ is preferred over RADIUS when TACACS+ is supported by the AAA server and
    network device. This is because (with additional work) TACACS+ also supports command authorization, restricting specific
    users to the command set that they can use on the device. However, TACACS+ started as a Cisco centric protocol, so is
    not as widely supported by other vendors in comparison to RADIUS. In addition, RADIUS use is much more widespread (primarily
    for secure wireless authentication), so is often already in place. Finally, command authorization is a complex endeavor
    and is very rarely implemented because of that, so the main advantage of TACACS+ is very often not realized.'
  impact: 'Implementing TACACS+ (or any central authentication solution) ensures that only named users are allowed to gain
    an administrative session to the device. This allows: • Tracking of all changes to named users • Simplification of reconciling
    changes to a change management process • Off-loading password change cycles and password complexity requirements to that
    central authentication store • Simplification of removing admin access as administrators leave the organization or change
    their roles in the organization'
  references:
  - 1. https://www.cisco.com/c/m/en_us/techdoc/dc/reference/cli/nxos/commands/fund/
  page_start: 15
  audit_raw: "\"Show running-config tacacs+\" will show the basic TACACS+ configuration.\n• The tacacs+ feature should be\
    \ enabled\n• Two or more TACACS+ servers should be defined\n• Two or more TACACS+ servers should be in the TACACS+ server\
    \ group\nswitch(config)#sho run tacacs\n!Command: show running-config tacacs+\n!Running configuration last done at: Mon\
    \ Apr 13 05:14:30 2020\n!Time: Mon Apr 13 05:14:35 2020\nversion 9.3(3) Bios:version\nfeature tacacs+\ntacacs-server host\
    \ 3.4.5.6 key 7 \"vkqjcet\"\ntacacs-server host 4.5.6.7 key 7 \"vkqjgtcjjnod\"\naaa group server tacacs+ TACACSGROUP\n\
    \ server 3.4.5.6\n server 4.5.6.7\nfor more detail, use \"show run tacacs all\"\nswitch(config)# show run tacacs all\n\
    !Command: show running-config tacacs+ all\n!Running configuration last done at: Mon Apr 13 05:15:05 2020\n!Time: Mon Apr\
    \ 13 05:15:38 2020\nversion 9.3(3) Bios:version\nfeature tacacs+\nno ip tacacs source-interface\ntacacs-server test username\
    \ test password 7 wawy idle-time 0\ntacacs-server timeout 5\ntacacs-server deadtime 0\ntacacs-server host 3.4.5.6 key\
    \ 7 \"vkqjcet\" port 49\ntacacs-server host 4.5.6.7 key 7 \"vkqjgtcjjnod\" port 49\ntacacs-server host 3.4.5.6 test username\
    \ test password 7 wawy idle-time 0\ntacacs-server host 4.5.6.7 test username test password 7 wawy idle-time 0\naaa group\
    \ server tacacs+ TACACSGROUP\n server 3.4.5.6\n server 4.5.6.7\n use-vrf default\n no source-interface\nFinally, verify\
    \ that the aaa authentication list includes TACACS for both the default and\nconsole access:\n# show run aaa\n!Command:\
    \ show running-config aaa\n!Running configuration last done at: Mon Apr 13 05:15:05 2020\n!Time: Mon Apr 13 05:16:11 2020\n\
    version 9.3(3) Bios:version\naaa authentication login default group TACACSGROUP local\naaa authentication login console\
    \ group TACACSGROUP local\nno aaa user default-role\nlogin on-success log"
  remediation: "First, enable TACACS+ in NX-OS\nswitch(config)#feature tacacs+\nNext, define two or more TACACS+ servers:\n\
    switch(config)#tacacs-server host 3.4.5.6 key somekey\nswitch(config)#tacacs-server host 4.5.6.7 key someotherkey\ndefine\
    \ the aaa group for TACACS+:\nswitch(config)#aaa group server tacacs+ TACACSGROUP\n server 3.4.5.6\n server 4.5.6.7\n\
    Finally, create the aaa authentication list for both console and default access:\nswitch(config)#aaa authentication login\
    \ default group TACACSGROUP local\nswitch(config)#aaa authentication login console group TACACSGROUP local\nIt is common\
    \ to include \"local\" as the last entry in the list, to allow access to administer\nthe device even if the RADIUS server\
    \ is offline. Note that while this ensures access in\nthe case of the device or the RADIUS server being offline, it also\
    \ means that if an\nattacker can DOS the RADIUS Servers, they can authenticate locally as well."
  checks:
  - type: sql
    command: Show running-config tacacs+" will show the basic TACACS+ configuration.
    severity: medium
    info: '"Show running-config tacacs+" will show the basic TACACS+ configuration.

      • The tacacs+ feature should be enabled

      • Two or more TACACS+ servers should be defined

      • Two or more TACACS+ servers should be in the TACACS+ server group

      switch(config)#sho run tacacs

      !Command: show running-config tacacs+

      !Running configuration last done at: Mon Apr 13 05:14:30 2020

      !Time: Mon Apr 13 05:14:35 2020

      version 9'
- id: 1.1.1.2
  title: Configure AAA Authentication - Local SSH keys
  scoring: manual
  profile:
  - Level 1
  description: Using the client's public key to authenticate their SSH sessions circumvents the need for using passwords for
    an administrative login to the switch.
  rationale: This is primarily an ease-of-use feature. It means that the administrators don't need to remember or key in passwords.
    It also can be used to significantly improve the security of any scripts or API calls that might use SSH.
  impact: 'There are pros and cons to this approach. Pro: • Scripts and API calls that use SSH no longer need to have credentials
    embedded in them. While this can be done securely (using password vaults for instance), all to often the credentials are
    in clear-text, in the code or in an input file. • This is popular with network administrators, as they no longer need
    to key in passwords, or "grab" their password from a password manager application. • It means that administrators can
    no longer configure easy to guess passwords. Con: • The private half of the PKI exchange (client side) can be available
    if the administrator''s workstation or account is compromised • An inventory of SSH hosts that use key based authentication
    needs to be maintained if this approach is used. This is so that if a key needs to be replaced or deleted, the list of
    hosts that need to be updated is easily accessed. This can be time sensitive if an administrator has left the organization,
    or if a laptop is lost or stolen. Even if this is just due to regular hardware replacement or a policy that expires keys
    at regular intervals, missing a device can be a "time bomb" that is often not found until the worst possible moment Normally
    the best recommendation is to use a back-end authentication source (such as AD), with RADIUS or TACACS+ as the authentication
    protocol. The back end directory can then enforce whatever complexity or password change requirements are needed. In particular
    if an administrator leaves the organization or changes departments, those situations can be managed by changing AD Group
    membership or by disabling the account in question.'
  references: []
  page_start: 19
  audit_raw: "To list the status of one user account:\nswitch# sho user-account rvadmin\nuser:rvadmin\n this user account\
    \ has no expiry date\n roles:network-operator network-admin\n ssh public key: ssh-rsa\nAAAAB3NzaC1yc2EAAAABIwAAAIEAy19oF6QaZl9G+3f1XswK\n\
    3OiW4H7YyUyuA50rv7gsEPjhOBYmsi6PAVKui1nIf/DQhum+lJNqJP/eLowb7ubO+lVKRXFY/G+lJ\nNIQ\nW3g9igG30c6k6+XVn+NjnI1B7ihvpVh7dLddMOXwOnXHYshXmSiH3UD/vKyziEh5S4Tplx8=\n\
    To list all users that have SSH key authentication:\nswitch# sho run | i sshkey\nusername rvadmin sshkey ssh-rsa\nAAAAB3NzaC1yc2EAAAABIwAAAIEAy19oF6QaZl9G+3f1XswK\n\
    3OiW4H7YyUyuA50rv7gsEPjhOBYmsi6PAVKui1nIf/DQhum+lJNqJP/eLowb7ubO+lVKRXFY/G+lJ\nNIQ\nW3g9igG30c6k6+XVn+NjnI1B7ihvpVh7dLddMOXwOnXHYshXmSiH3UD/vKyziEh5S4Tplx8="
  remediation: '• Create the client''s SSH public and private keys. The keys must be in OpenSSH

    format for the NX-OS switch to interpret them correctly. Use either RSA or DSA

    algorithms, and be sure to specify enough bits for entropy (2048 minimum, more

    is of course better)

    • Upload the client''s SSH public key, and store it on the bootflash of the switch.

    • Be sure that the file has a meaningful name, often the users''s initials and the key

    algorithm (RSA or DSA) is in the filename. This makes it easier to remove or

    replace that file as keys are expired out, workstations migrate or administrators

    leave the organization.

    • To enable key-based authentication for one local user (for instance, Davey

    Jones), enter the command:

    switch(config)# username djadmin sshkey file bootflash:dj_rsa.pub

    Alternatively, the ssh key can be defined in the username configuration line:

    switch(config)# username djadmin sshkey ssh-rsa

    AAAAB3NzaC1yc2EAAAABIwAAAIEAy19oF6QaZl9G+3f1XswK3OiW4H7YyUyuA50rv7gsEPjhOBYms

    i6PAVKui1nIf/DQhum+lJNqJP/eLowb7ubO+lVKRXFY/G+lJNIQW3g9igG30c6k6+XVn+NjnI1B7i

    hvpVh7dLddMOXwOnXHYshXmSiH3UD/vKyziEh5S4Tplx8=

    The file based method is usually preferred, as they keys can be changed without

    modifying the configuration of the switch. Also, the keys are not stored in any archived

    copy of the configuration.

    Note that the username and file name will vary depending on your organization''s

    policies, procedures and standards'
  checks:
  - type: manual_review
    info: "To list the status of one user account:\nswitch# sho user-account rvadmin\nuser:rvadmin\n this user account has\
      \ no expiry date\n roles:network-operator network-admin\n ssh public key: ssh-rsa\nAAAAB3NzaC1yc2EAAAABIwAAAIEAy19oF6QaZl9G+3f1XswK\n\
      3OiW4H7YyUyuA50rv7gsEPjhOBYmsi6PAVKui1nIf/DQhum+lJNqJP/eLowb7ubO+lVKRXFY/G+lJ\nNIQ\nW3g9igG30c6k6+XVn+NjnI1B7ihvpVh7dLddMOXwOnXHYshXmSiH3UD/vKyziEh5S4Tplx8=\n\
      To list all users that have SSH key authentication:\nswitch# sho run | i sshkey\nusername rvadmin sshkey ssh-rs"
    severity: medium
- id: 1.1.1.3
  title: Configure AAA Authentication - RADIUS if applicable
  scoring: scored
  profile:
  - Level 1
  description: RADIUS is an authentication protocol that Cisco NX-OS devices can use for authentication of management users
    against a remote AAA server. These management users can access the Cisco NX-OS device through any protocol and use this
    back-end authentication. Using a central authentication store (such as Active Directory) ensures that all administrative
    actions are tied to named users, making the tracking of changes much easier. It also makes tracking compromised accounts
    and malicious activities much easier.
  rationale: 'Central authentication is key as it minimizes the effort in managing named user accounts. Keeping local admin
    accounts opens the door to all the issues inherent in shared accounts, namely: • Errors in implementation being done by
    generic admin accounts, which can then be denied by all. • Shared credentials staying unchanged when administrative staff
    leave the organization or change roles. • Giving malicious actors the ability to recover shared credentials from saved
    device backups RADIUS is the most widely used protocol for this purpose, since it is a requirement for secure wireless
    authentication (EAP-TLS). Just as important, RADIUS is much better supported by most non-Cisco vendors for back-end authentication.'
  impact: 'Implementing RADIUS (or any central authentication solution) ensures that only named users are allowed to gain
    an administrative session to the device. This allows: • Tracking of all changes to named users • Simplification of reconciling
    changes to a change management process • Off-loading password change cycles and password complexity requirements to that
    central authentication store • Simplification of removing admin access as administrators leave the organization or change
    their roles in the organization'
  references:
  - 1. https://www.cisco.com/c/m/en_us/techdoc/dc/reference/cli/nxos/commands/fund/
  page_start: 22
  audit_raw: "\"show running-config radius\" will show all radius definitions.\nTwo or more RADIUS servers must be defined,\
    \ as well as the RADIUS server group:\nswitch(config)# sho running-config radius\n!Command: show running-config radius\n\
    !Running configuration last done at: Mon Apr 13 05:02:06 2020\n!Time: Mon Apr 13 05:07:21 2020\nversion 9.3(3) Bios:version\n\
    radius-server host 3.4.5.6 key 7 \"vkqjcet\" authentication accounting\nradius-server host 4.5.6.7 key 7 \"vkqjgtcjjnod\"\
    \ authentication accounting\naaa group server radius RADIUSGROUP\n server 3.4.5.6\n server 4.5.6.7\n\"Show running-config\
    \ radius all\" will give more detail if required:\nswitch# show run radius all\n!Command: show running-config radius all\n\
    !Running configuration last done at: Mon Apr 13 05:02:06 2020\n!Time: Mon Apr 13 05:10:12 2020\nversion 9.3(3) Bios:version\n\
    radius-server test username test password 7 wawy idle-time 0\nradius-server timeout 5\nradius-server retransmit 1\nradius-server\
    \ deadtime 0\nradius-server host 3.4.5.6 key 7 \"vkqjcet\" auth-port 1812 acct-port 1813\nauthent\nication accounting\
    \ timeout 5 retransmit 1\nradius-server host 4.5.6.7 key 7 \"vkqjgtcjjnod\" auth-port 1812 acct-port 1813\nau\nthentication\
    \ accounting timeout 5 retransmit 1\nradius-server host 3.4.5.6 test username test password 7 wawy idle-time 0\nradius-server\
    \ host 4.5.6.7 test username test password 7 wawy idle-time 0\naaa group server radius radius\n server 3.4.5.6\n server\
    \ 4.5.6.7\n deadtime 0\n use-vrf default\n no source-interface\naaa group server radius RADIUSGROUP\n server 3.4.5.6\n\
    \ server 4.5.6.7\n deadtime 0\n use-vrf default\n no source-interface\nno ip radius source-interface\n\"Show running-config\
    \ aaa\" will display the authentication lists. RADIUS should appear\nfirst in the authentication list for both default\
    \ and console access:\nswitch# sho run aaa\n!Command: show running-config aaa\n!Running configuration last done at: Mon\
    \ Apr 13 05:02:06 2020\n!Time: Mon Apr 13 05:08:25 2020\nversion 9.3(3) Bios:version\naaa authentication login default\
    \ group RADIUSGROUP local\naaa authentication login console group RADIUSGROUP local\nno aaa user default-role\nlogin on-success\
    \ log"
  remediation: "First define two or more RADIUS Servers\nswitch(config)#radius-server host 3.4.5.6 key somekey authentication\n\
    accounting\nswitch(config)#radius-server host 4.5.6.7 key someotherkey authentication\naccounting\nThen create an AAA\
    \ group for RADIUS\nswitch(config)# aaa group server radius RADIUSGROUP\n server 3.4.5.6\n server 4.5.6.7\nFinally, create\
    \ the authentication lists in the correct order - to be effective the RADIUS\ngroup needs to appear first in the list.\
    \ Both the default and console access should be\nsecured in the same way:\nswitch(config)# aaa authentication login default\
    \ group RADIUSGROUP local\nswitch(config)# aaa authentication login console group RADIUSGROUP local\nIt is common to include\
    \ \"local\" as the last entry in the list, to allow access to administer\nthe device even if the RADIUS server is offline.\
    \ Note that while this ensures access in\nthe case of the device or the RADIUS server being offline, it also means that\
    \ if an\nattacker can DOS the RADIUS Servers, they can authenticate locally as well."
  checks:
  - type: sql
    command: show running-config radius" will show all radius definitions.
    severity: medium
    info: '"show running-config radius" will show all radius definitions.

      Two or more RADIUS servers must be defined, as well as the RADIUS server group:

      switch(config)# sho running-config radius

      !Command: show running-config radius

      !Running configuration last done at: Mon Apr 13 05:02:06 2020

      !Time: Mon Apr 13 05:07:21 2020

      version 9.3(3) Bios:version

      radius-server host 3.4.5.6 key 7 "vkqjcet" authenticatio'
- id: 1.1.2
  title: Authentication 1.1.2.1 vty line authentication
  scoring: scored
  profile:
  - Level 1
  description: Authenticate management access to the network devices. Typically a central authentication store combined with
    a fallback mechanism should be implemented to allow emergency access, in case the central authentication servers are not
    available.
  rationale: Management access to network devices must be authenticated. The default under AAA (local or network) is to require
    users to log in using a valid user name and password. This rule applies for both local and network AAA. Fallback mode
    should also be enabled to allow emergency access to the router or switch in the event that the AAA server was unreachable.
  impact: If no authentication is implemented, any user with network reachability to the management interface can access network
    devices and change their configuration.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/dcn/nxos/nexus9000/102x/configuration/Security/cisco-nexus-9000-nx-os-securityconfiguration-guide-102x/m-configuring-aaa.html
  page_start: 26
  audit_raw: 'Check if the login authentication is defined:

    switch# show run | i authentication

    aaa authentication login default group <servergroup>

    If no result is shown it means the default (local authentication) is in place.'
  remediation: 'Configure central authentication for vty lines as follows:

    aaa authentication login default group <servergroup>'
  checks:
  - type: sql
    command: show run | i authentication
    severity: medium
    info: 'Check if the login authentication is defined:

      switch# show run | i authentication

      aaa authentication login default group <servergroup>

      If no result is shown it means the default (local authentication) is in place.'
- id: 1.2.1
  title: Restrict Access to VTY Sessions
  scoring: manual
  profile:
  - Level 1
  description: Restrict Management Access to trusted management stations and VLANs.
  rationale: Exposing the management interface too broadly exposes that interface to MiTM (Monkey in the Middle) attacks as
    well as to credential stuffing attacks. The question "should your receptionist have access to your core switch?" usually
    illustrates the need for this if there are any disagreements.
  impact: 'Not restricting access to the management interface has several risks: • exposes your interface to credential stuffing
    attacks from commodity malware (such as Mirai) • highlights your device as missing simple security remediations to even
    simple scans. This invites other attacks in addition to credential stuffing.'
  references: []
  page_start: 30
  audit_raw: 'Perform the following to determine if the ACL is set:

    Verify that you see an access-class defined:

    switch# sho run | section vty

    Next, display the access-list to verify that it is appropriate for your organization:

    switch# sho run <Access-Class name>'
  remediation: 'Create an access-list that defines the various trusted subnets and/or stations:

    switch(config)# ip access-list ACL-MGT

    switch(config-acl)# remark access-class ACL

    switch(config-acl)# permit ip 192.168.12.0/24 any

    switch(config-acl)# deny ip any any log

    It is suggested that all ACLs are commented to help self-document the configuration.

    The last line in the ACL should read deny ip any any log to record all attempts to

    reach the management interface from unauthorized stations.

    Apply the Access-Class to the VTY interface:

    switch(config)# line vty

    switch(config-line)# access-class ACL-MGT in'
  checks:
  - type: manual_review
    info: 'Perform the following to determine if the ACL is set:

      Verify that you see an access-class defined:

      switch# sho run | section vty

      Next, display the access-list to verify that it is appropriate for your organization:

      switch# sho run <Access-Class name>'
    severity: medium
- id: 1.2.2
  title: Configure IP Blocking on Failed Logins
  scoring: manual
  profile:
  - Level 1
  description: After a configured number of failed logins in a set window, offending IP addresses should be blocked from login
    for a configured amount of time.
  rationale: This effectively makes brute force attacks much less practical, slowing automated processes from a rate of multiple
    attempts per second to per minute ranges.
  impact: Not only does this effectively impede brute force or dictionary login attacks, but logs them as such. In addition,
    enabling this command limits login attempts to once per second, rather than as fast as the device can process them.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/sec_usr_cfg/configuration/xe16-12/sec-usr-cfg-xe-16-12-book/sec-login-enhance.html
  page_start: 32
  audit_raw: "For version 7.x:\nswitch# show login\n No Quiet-Mode access list has been configured, default ACL will be applied.\n\
    \ Switch is enabled to watch for login Attacks.\n If more than 5 login failures occur in 120 seconds or less,\n logins\
    \ will be disabled for 120 seconds.\n Switch presently in Normal-Mode.\n Current Watch Window remaining time 62 seconds.\n\
    \ Present login failure count 0.\nor:\nswitch # sho run | i block-for\nlogin block-for 120 attempts 5 within 120\nFor\
    \ version NX-OS 9.x:\nswitch # sho system login\nIf more than 5 login failures occur in 120 seconds or less,\n logins\
    \ will be disabled for 120 seconds.\nNo Quiet-Mode access list has been configured,default ACL will be applied\nSwitch\
    \ is enabled to watch for login Attacks\nor:\nswitch # sho run | i block-for\nsystem login block-for 120 attempts 5 within\
    \ 120"
  remediation: 'This configuration consists of:

    • A "watch" time window (in seconds)

    • the number of failed attempts to trigger on

    • the amount of time (in seconds) to block further login attempts from that IP

    address

    For NX-OS 7.x:

    login block-for <block time window> attempts <fail count> within <detect time

    window>

    for instance:

    login block-for 120 attempts 5 within 120

    For NX-OS 9.x:

    system login block-for <block time window> attempts <fail count> within

    <detect time window>

    for instance:

    system login block-for 120 attempts 5 within 120

    Any values at all will thwart most brute force or dictionary attacks.'
  checks:
  - type: sql
    command: show login
    severity: medium
    info: "For version 7.x:\nswitch# show login\n No Quiet-Mode access list has been configured, default ACL will be applied.\n\
      \ Switch is enabled to watch for login Attacks.\n If more than 5 login failures occur in 120 seconds or less,\n logins\
      \ will be disabled for 120 seconds.\n Switch presently in Normal-Mode.\n Current Watch Window remaining time 62 seconds.\n\
      \ Present login failure count 0.\nor:\nswitch # sho run |"
- id: 1.2.3
  title: Limit SSH Login Attempts
  scoring: manual
  profile:
  - Level 1
  description: After a configured number of failed password attempts, an SSH session terminate. The default configuration
    for this is 3 failed attempts.
  rationale: This setting makes brute force and dictionary attacks against SSH more difficult.
  impact: In many environments, the default setting of 3 failed attempts is appropriate and does not need to be changed. However,
    in this default configuration this setting does not appear in the running or saved configuration. If it is important that
    this setting shows in the configuration this value can be modified.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/se
  page_start: 36
  audit_raw: 'switch# sho running-config security all | i "ssh login-attempts"

    ssh login-attempts 3'
  remediation: switch(config)# ssh login attempts 3
  checks:
  - type: manual_review
    info: 'switch# sho running-config security all | i "ssh login-attempts"

      ssh login-attempts 3'
    severity: medium
- id: 1.2.4
  title: Ensure Exec Timeout for Console Sessions is set
  scoring: manual
  profile:
  - Level 1
  description: Verify device is configured to automatically disconnect console sessions after a defined maximum session time,
    set in minutes.
  rationale: This prevents unauthorized users from misusing abandoned sessions. For example, if the network administrator
    disconnects leaving a console session open, that session will remain open (in the same state and privilege level) for
    the next person who connects a console cable to the device. A shorter timeout is usually desired, but this can be extended
    for longer-running operations such as debug sessions or NX-OS updates. This is not an idle timer, it is the maximum length
    of a session. This is a key difference that should be taken into account when determining the best value for your organization
    and your work habits.
  impact: ''
  references: []
  page_start: 38
  audit_raw: "switch# sho run | b console\nline console\n exec-timeout 10"
  remediation: 'switch(config)# line console

    switch(config)# exec-timeout 10'
  checks:
  - type: manual_review
    info: "switch# sho run | b console\nline console\n exec-timeout 10"
    severity: medium
- id: 1.2.5
  title: Ensure Exec Timeout for Remote Administrative Sessions (VTY) is set
  scoring: manual
  profile:
  - Level 1
  description: This value sets the maximum time of an administrative session that is attached via a VTY line - in most installations
    this means the maximum time and SSH session can have. This value is set in minutes.
  rationale: ''
  impact: ''
