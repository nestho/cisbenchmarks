- id: 1.5.5
  title: Configure SNMP Source Interface for Traps
  scoring: manual
  profile:
  - Level 2
  description: The administrator can configure SNMP to the interfaces source IP address for notifications
  rationale: 'By using a source interface the administrator can ensure that the source IP of SNMP traps does not change as
    the network topology changes. For instance, if a link fails or is reconfigured, and a different IP address is now topologically
    "closer" to the SNMP trap server. There are a few typical candidates for an SNMP source IP address: • A loopback address,
    as loopbacks are always up, and can then route over any transit interface. • The MGMT 0 address, as that provides an out-of-band
    path to the SNMP server. SNMP traffic volume will not affect traffic volumes, and SNMP cannot be "starved" for bandwidth
    by production traffic. If the entire path is out-of-band, this also provides excellent protection from eavesdropping by
    malicious actors that may be on the "production data side" of the switch. • A combination of the two (this is less common)
    - for instance a loopback address in the management VRF'
  impact: ''
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/6x/system_management/configuration/guide/b_Cisco_Nexus_9000_Series_NXOS_System_Management_Configuration_Guide/sm_9snmp.html#task_01A4812
  page_start: 73
  audit_raw: 'There are two typical commands to show the snmp source-interface configuration.

    The first shows only the explicit definitions for traps and informs:

    switch# sho snmp source-interface

    -------------------------------------------------------------------

    Notification source-interface

    -------------------------------------------------------------------

    trap mgmt0

    inform mgmt0

    -------------------------------------------------------------------

    or, more completely, use the "show running-config snmp" command, and filter for the

    keyword "source":

    switch# sho run snmp | i source

    snmp-server source-interface traps mgmt0

    snmp-server source-interface informs mgmt0

    snmp-server host 1.2.3.4 source-interface loopback0'
  remediation: 'switch(config)# snmp-server host 1.2.3.4 source-interface mgmt 0

    or

    switch(config)# snmp-server host 1.2.3.4 source-interface loopback 0

    SNMP Server traps or informs:

    switch(config)# snmp-server source-interface traps loopback 0

    switch(config)# snmp-server source-interface informs loopback 0

    or

    switch(config)# snmp-server source-interface traps mgmt 0

    switch(config)# snmp-server source-interface informs mgmt 0'
  checks:
