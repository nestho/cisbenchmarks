- id: '4.1'
  title: Configure Local Configuration Backup Schedule
  scoring: manual
  profile:
  - Level 1
  description: Using the job scheduler function allows the user to automate backups. This ensures that regular backups are
    created.
  rationale: Having current backups creates an environment where the user can roll back a config in the event of configuration
    failure. Additionally in the event of a compromise a recent backup can get the device back up to running condition in
    a small matter of time.
  impact: ''
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/6x/system_management/configuration/guide/b_Cisco_Nexus_9000_Series_NXOS_System_Management_Configuration_Guide/sm_8scheduler.html
  page_start: 207
  audit_raw: switch(config)# sho scheduler job
  remediation: 'switch(config)# scheduler job name [local backup]

    switch(config-job)#copy running-config startup-config

    Set up timetable for this backup.

    switch(config)# scheduler schedule name [backups]

    switch(config-schedule)# schedule name [backups]

    switch(config-schedule)# time weekly [day 00:00]'
  checks:
  - type: manual_review
    info: switch(config)# sho scheduler job
    severity: medium
- id: '4.2'
  title: Configure a Remote Backup Schedule
  scoring: manual
  profile:
  - Level 1
  description: NX-OS can be configured to initiate remote backups using scheduled jobs. This recommendation can also be satisfied
    (and likely satisfied better) using a host based backup tool, using SSH or SCP.
  rationale: Remote backups are preferred over local backups, as an attacker that has compromised a device also has full access
    to any locally stored files (which local backups are). In that situation, an attacker can modify or delete the stored
    backups, impeding any recovery or remediation efforts.
  impact: 'A host-based backup solution is preferred over one implemented locally. Locally configured backups have several
    security issues. By protocol, they are: • TFTP - cleartext, which is susceptible to interception or modification over
    the wire and the target filesystem allows unauthenticated writes (and usually unauthenticated reads) • FTP or HTTP - cleartext,
    which is susceptible to interception or modification over the wire. Credentials are embedded in the job configuration
    • HTTPS, SCP, SFTP: encrypted, but credentials are still embedded in the job configuration'
  references: []
  page_start: 209
  audit_raw: switch# sho scheduler config
  remediation: 'Note that this first example job uses tftp for backups. The risk here is that the backup is

    sent in clear-text, so can be intercepted and/or modified in transit.

    switch(config)# Scheduler job name [backup-cfg]

    switch(config-job)copy running-config tftp://1.2.3.4/$(SWITCHNAME)-

    cfg.$(TIMESTAMP) vrf management

    This example job uses SCP. The risk here is that the credentials need to be embedded

    in the configuration, so can be recovered if the backup repository is compromised. As

    this is true for all local passwords, the risk may be deemed low in some organizations.

    switch(config)# scheduler aaa-authentication username <username> password

    <some complex password>

    switch(config)# Scheduler job name <backup-cfg>

    switch(config-job)copy running-config scp://1.2.3.4/$(SWITCHNAME)-

    cfg.$(TIMESTAMP) vrf management

    Whatever the protocol, set timetable for this backup

    switch(config)# scheduler schedule name [backups]

    switch(config-schedule)# schedule name [backups]

    switch(config-schedule)# job name <backup-cfg>

    switch(config-schedule)# time weekly [day 00:00]

    While this can certainly work, if the backup server IP should ever change, the effort to

    fix this across multiple switches can be both error-prone and time-intensive. It is

    normally recommended to backup configurations from the backup server to the NX-OS

    switch over SSH or SCP, rather than from the switch to the host. As this config (host to

    switch) resides on the remote host, it cannot be audited from the switch.'
  checks:
  - type: manual_review
    info: switch# sho scheduler config
    severity: medium
- id: '4.3'
  title: Configure Alerts on all Configuration Changes
  scoring: manual
  profile:
  - Level 2
  description: This is not easily implemented directly on the switch. Changes should ideally be backed up remotely, and a
    "diff" process to highlight any changes in successive configurations is a good process to implement.
  rationale: 'Change Control processes are ubiquitous in the industry. Especially with a text-based configuration such as
    most network devices have, it is easy to extract the exact changes from one version of the saved or running configuration
    to the next. This can then be correlated back to the change control process, to see: • Did any and all approved changes
    get executed? • Did any unapproved changes get executed? • Relating this back to the syslogs created by named user logins,
    did the change happen within the correct window? • Also relating back to the syslogs created by named user logins, did
    the correct person make the change? (see the AAA section, and named administrative users) • Is there a pattern of any
    one or more administrators making unapproved or outside of window changes?'
  impact: A formal change control process can manage conflicts in changes nicely, especially between disparate sections of
    the infrastructure. For instance, the situation where "a server upgrade failed because the firewall changes interrupted
    the VPN session" is much less likely to occur if all changes are reviewed in advance. In addition, changes made without
    planning tend to result in the "testing in prod" scenario, ending up with a much higher ratio of service interruptions.
  references: []
  page_start: 211
  audit_raw: 'This should be an automated process running on the host that is the repository for daily

    backups. An assessment should be made on that host.'
  remediation: This is not a process that typically runs on the switch, there is no on-switch remediation.
  checks:
  - type: manual_review
    info: 'This should be an automated process running on the host that is the repository for daily

      backups. An assessment should be made on that host.'
    severity: medium
