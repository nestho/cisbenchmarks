- id: 3.5.2
  title: Configure FCoE Zoning
  scoring: manual
  profile:
  - Level 2
  description: Cisco uses a construction called a "VSAN" (analagous to a VLAN) which is used to restrict access between hosts
    and SAN resources. In restrictive cases, a typical VSAN will include two entries for the two host FCoE interfaces, and
    two entries for the SAN Controller interfaces (usually an FCoE SAN will have at least two). In the most restrictive case,
    the FCOE infrastructure will be split into two fabrics, and zones can hold as few as 2 entries (one for the host and one
    for the SAN controller on that fabric).
  rationale: ''
  impact: This configuration limits the reconnaissance available to a compromised or malicious host. Without configuring Zoning,
    a compromised host can collect the FCoE information from all other hosts in the same VSAN. It can then use that information
    to impersonate any of these hosts, and access their respective LUNs (unless some other control prevents that). Note that
    in Virtualized environments and in most Cluster architectures, multiple hypervisor hosts will access the a common set
    of LUNs on the SAN. In these situations the VSAN can have significantly more members (all host interfaces as well as all
    target SAN controller interfaces), since the reconnaissance and impersonation risks are somewhat lessened - you would
    need a compromised hypervisor to attack another hypervisor. While this risk is non-zero, it is understood that hypervisors
    typically (hopefully) have more strict protections than many other physical hosts. In addition, risk occurs if different
    server operating systems are in play. The most common issue is that if a Windows host can mount a volume that is partitioned
    for Linux or VMware ESXi, Windows will ask a logged in administrator for permission to "sign" that volume. If the administrator
    selects "Yes", then that volume will no longer be readable by the Linux or ESXi host(s). At a minimum, hypervisors should
    not share a zone with other physical hosts. Physical hosts should not share zones with each other. Hosts with different
    operating systems or incompatible filesystems should never share the same zone. In the best case, the "one host / one
    SAN controller / one zone" rule is the safest approach.
  references: []
  page_start: 203
  audit_raw: "switch# sho vsan 101\nvsan 101 information\n name:HOST_X_SAN_Y state:active\n interoperability mode:default\n\
