  description: You can configure authentication between neighbors for EIGRP
  rationale: You can configure EIGRP authentication for the EIGRP process or for individual interfaces. Interface EIGRP authentication
    configuration overrides the EIGRP processlevel authentication configuration. Because EIGRP is a multicast protocol, any
    device can advertise EIGRP capabilities and routes, and by default all connected EIGRP devices will honor those advertisements.
    This means that a malicious actor can advertise bogus routes to valid hosts or networks, allowing the interception and
    modification of traffic intended for those hosts or subnets. For this reason it is important that EIGRP endpoints authenticate
    to each other, ensuring that only valid routers can participate in the exchange of routes.
  impact: ''
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/switches/datacenter/sw/4_2/nxos/unicast/configuration/guide/l3_cli_nxos/l3_eigrp.html#wp1075849
  page_start: 141
  audit_raw: "The \"show running-configuration eigrp\" command will show all of the EIGRP\nconfiguration, ensure that in the\
    \ main EIGRP address-family section (whether that is\nipv4 or ipv6) has both \"authentication mode md5\" set, and the\
    \ appropriate key-chain\nassigned\nswitch(config-if)# sho run eigrp\n!Command: show running-config eigrp\n!Running configuration\
    \ last done at: Wed May 20 14:39:55 2020\n!Time: Wed May 20 14:48:11 2020\nversion 9.3(3) Bios:version\nfeature eigrp\n\
    router eigrp 10\n address-family ipv4 unicast\n passive-interface default\n authentication mode md5\n authentication key-chain\
    \ <EIGRP key-chain name>\ninterface Vlan1\n no ip passive-interface eigrp 10"
  remediation: 'Ensure that you have enabled the EIGRP feature.

    Ensure that all neighbors for an EIGRP process share the same authentication

    configuration, including the shared authentication key.

    Create the key-chain for this authentication configuration. See the Cisco NX-OS

    Security Configuration Guide.

    Ensure that you are in the correct VDC (or use the switchto vdc command)

    Configure authentication:

    switch(config)# router eigrp [instance-tag]

    switch(config-router)# address-family {ipv4 | ipv6} unicast

    switch(config-router)# authentication key-chain [key-chain]

    switch(config-router)# authentication mode md5

    Next assign the interface:

    switch(config)# interface [interface-type slot/port]

    switch(config-if)# router eigrp [instance-tag]

    switch(config-if)# authentication key-chain eigrp [instance-tag key-chain]

    switch(config-if)# authentication mode eigrp [instance-tag] md5

    Every EIGRP routeable interface should be set to either passive-interface, or be

    configured with authentication keys.'
  checks:
