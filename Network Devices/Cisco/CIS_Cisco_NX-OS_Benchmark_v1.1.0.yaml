- id: 3.1.2.2
  title: If Possible, Limit the BGP Routes Accepted from Peers
  scoring: manual
  profile:
  - Level 2
  description: Once a BGP relationship is established, the BGP process will accept routes from any connected peers and consider
    those routes to be valid. For this reason, especially in ISP or other carrier situations, it is important that only routes
    that are valid for any particular peer are accepted for that peer.
  rationale: ''
  impact: Without configuring route filtering, any route advertised by any BGP peer is considered valid. For this reason,
    especially in carrier or ISP situations it is important that route filtering be configured. Without filtering, a misconfigured
    or compromised peer can easily advertise entire subnets that should be routed elsewhere, either routing them to nul or
    receiving traffic to the compromised subnet for for interception or modification, then forwarding it on to it's final
    destination.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/switches/datacenter/sw/4_2/nxos/unicast/configuration/guide/l3_cli_nxos/l3_bgp.html
  page_start: 151
  audit_raw: "\"Show run bgp\" will show a summary of the BGP configuration. In this case, we are\nlooking for the inbound\
    \ route-map statement (the last line in this example):\nswitch# sho run bgp\n!Command: show running-config bgp\n!Running\
    \ configuration last done at: Tue May 19 17:08:35 2020\n!Time: Tue May 19 17:14:14 2020\nversion 9.3(3) Bios:version\n\
    feature bgp\nrouter bgp 65520\n router-id 10.10.10.10\n address-family ipv4 unicast\n network 10.10.10.0/24\n neighbor\
    \ 10.10.10.11\n remote-as 65521\n address-family ipv4 unicast\n route-map route-map RM_BGP_PEERNAME_IN in\nShowing the\
    \ route-map displays the prefix list, which defines what subnets are\npermitted:\nswitch# sho route-map RM_BGP_PEERNAME_IN\n\
    route-map RM_BGP_PEERNAME_IN, permit, sequence 10\n Match clauses:\n ip address prefix-lists: PL_PEERNAME_PERMIT_SUBNETS\n\
    \ Set clauses:\nFinally, to display the prefixes:\nswitch# show ip prefix-list PL_PEERNAME_PERMIT_SUBNETS\nip prefix-list\
    \ PL_PEERNAME_PERMIT_SUBNETS: 2 entries\n seq 5 permit 10.11.11.0/24\n seq 10 permit 10.11.12.0/24"
  remediation: 'First, define the subnets that will be permitted from the peer PEERNAME (use

    descriptive, self documenting names in NX-OS constructions where possible). Note that

    any subnets not listed as permitted are by default denied (there is an implicit "deny all"

    at the bottom of the list)

    switch(config)# ip prefix-list PL_PEERNAME_PERMIT_SUBNETS description

    Permitted Subnets from Peer PEERNAME

    switch(config)# ip prefix-list PL_PEERNAME_PERMIT_SUBNETS permit

    10.11.11.0/24

    switch(config)# ip prefix-list PL_PEERNAME_PERMIT_SUBNETS permit

    10.11.12.0/24

    In this example above, only "permits" are defined. Deny lines are also allowed - refusing

    routes that are not accepted (for instance "bogon" or "martian" subnets), and may be

    more important in some situations, for example if this switch is accepting routes from

    the public internet. (note that this is not typical deployment scenario for an NX-OS

    switch)

    Next, create the route-map, will will apply that list:

    switch(config)# route-map RM_BGP_PEERNAME_IN permit 10

    switch(config-route-map)# match ip address prefix-list

    PL_PEERNAME_PERMIT_SUBNETS

    Finally, within the BGP configuration, apply that route-map to the BGP peer definition.

    Note that the "in" keyword denotes inbound (accepted) information.:

    switch(config)# router bgp 65520

    switch(config-router)# router-id 10.10.10.10

    switch(config-router)# address-family ipv4 unicast

    switch(config-router-af)# network 10.10.10.0/24

    switch(config-router-af)# neighbor 10.10.10.11

    switch(config-router-neighbor)# remote-as 65521

    switch(config-router-neighbor)# address-family ipv4 unicast

    switch(config-router-neighbor-af)# route-map RM_BGP_PEERNAME_IN in'
  checks:
  - type: sql
    command: Show run bgp" will show a summary of the BGP configuration. In this case, we are
    severity: medium
    info: "\"Show run bgp\" will show a summary of the BGP configuration. In this case, we are\nlooking for the inbound route-map\
      \ statement (the last line in this example):\nswitch# sho run bgp\n!Command: show running-config bgp\n!Running configuration\
      \ last done at: Tue May 19 17:08:35 2020\n!Time: Tue May 19 17:14:14 2020\nversion 9.3(3) Bios:version\nfeature bgp\n\
      router bgp 65520\n router-id 10.10.10.10\n address-fami"
- id: 3.1.2.3
  title: Configure BGP Authentication
  scoring: manual
  profile:
  - Level 2
  description: BGP is a usually configured as a point-to-point / unicast protocol. Configuring authentication as part of the
    neighbor configuration adds an additional layer of security to the conversation.
  rationale: ''
  impact: Configuring authentication adds an MD5 hash to the neighbor negotiation that occurs between two BGP peers. An authentication
    failure would indicate either a misconfiguration, or possibly an attacker mounting an impersonation attack, masquerading
    as the BGP peer (possibly by ARP cache poisoning attack) and attempting to then peer up with incorrect credentials.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/switches/datacenter/sw/4_2/nxos/unicast/configuration/guide/l3_cli_nxos/l3_advbgp.html#wp1066903
  page_start: 154
  audit_raw: "The \"show running-confguration bgp\" command will list the entire BGP configuration.\nEnsure that the \"password\"\
    \ command is present in each neighbor stanza.\nswitch# sho run bgp\n!Command: show running-config bgp\n!Running configuration\
    \ last done at: Wed May 20 13:52:03 2020\n!Time: Wed May 20 13:54:17 2020\nversion 9.3(3) Bios:version\nfeature bgp\n\
    router bgp 65520\n router-id 10.10.10.10\n neighbor 10.10.10.11\n remote-as 65521\n log-neighbor-changes\n password 3\
    \ 34a1d2277d4f4cc9e9fa97b9d4434019f46f16ae96bb54a3\n address-family ipv4 unicast"
  remediation: "For each BGP neighbor, add the \"password\" command to the matching stanza, with a\nlong and complex string.\
    \ Note that the same password must be used on the matching\npeer.\nDifferent passwords should be used for each peer.\n\
    switch(config)# router bgp 65520\nswitch(config-router)# neigh 10.10.10.11\nswitch(config-router-neighbor)# password ?\n\
    \ 0 Specifies an UNENCRYPTED neighbor password will follow\n 3 Specifies an 3DES ENCRYPTED neighbor password will follow\n\
    \ 7 Specifies a Cisco type 7 ENCRYPTED neighbor password will follow\n LINE The UNENCRYPTED (cleartext) neighbor password\n\
    switch(config-router-neighbor)# password somelongcomplexstring"
  checks:
  - type: sql
    command: show running-confguration bgp" command will list the entire BGP configuration.
    severity: medium
    info: "The \"show running-confguration bgp\" command will list the entire BGP configuration.\nEnsure that the \"password\"\
      \ command is present in each neighbor stanza.\nswitch# sho run bgp\n!Command: show running-config bgp\n!Running configuration\
      \ last done at: Wed May 20 13:52:03 2020\n!Time: Wed May 20 13:54:17 2020\nversion 9.3(3) Bios:version\nfeature bgp\n\
      router bgp 65520\n router-id 10.10.10.10\n neighbor 10.10.1"
- id: 3.1.3
  title: OSPF 3.1.3.1 Set Interfaces with no Peers to Passive-Interface
  scoring: manual
  profile:
  - Level 1
  description: By default, OSPF will advertise via multicast to solicit peers, and will listen for neighbor / peer advertisements
    on all OSPF configured interfaces.
  rationale: If an interface is set to "passive", then EIGRP will not advertise out of that interface or listen on that interface
    for EIGRP neighbors. I will however still advertise the networks associated with that interface to peers on other interfaces.
    By default, all interfaces advertise via multicast to solicit OSPF neighbors, and also listen for neighbor advertisements.
  impact: If an interface is set to the default (ie - not passive), then an attacker can pose as an OSPF peer, either to collect
    OSPF information from advertisements or to inject bogus routes into the table. Bogus routes can then be used to DOS that
    subnet, or to intercept traffic to or from that subnet either to eavesdrop on conversations or to modify data in transit.
    Quite often the goal of an attack of this type is to collect login credentials from a malicious copy of the target website.
  references: []
  page_start: 156
  audit_raw: "The \"show running-configuration ospf\" command will list the complete OSPF\nconfiguration. For all interfaces\
    \ that do not have facing peers, ensure that those\ninterfaces have the \"ip ospf passive-interface\" set.\nEvery routeable\
    \ interface should be set to either passive-interface, or be configured with\nauthentication keys.\nswitch# sho running-config\
    \ ospf\n!Command: show running-config ospf\n!Running configuration last done at: Wed May 20 14:24:49 2020\n!Time: Wed\
    \ May 20 14:26:46 2020\nversion 9.3(3) Bios:version\nfeature ospf\nrouter ospf 10\n router-id 10.10.10.10\ninterface Vlan1\n\
    \ ip ospf passive-interface\n ip router ospf 10 area 0.0.0.0"
  remediation: 'For each routeable interface, if there is no facing peer on that interface set that interface

    to passive with the "ip ospf passive-interface" configuration command.

    Every routeable interface should be set to either passive-interface, or be configured with

    authentication keys.

    switch(config)# int vlan 1

    switch(config-if)# ip router ospf 10 area 0

    switch(config-if)# ip ospf passive-interface'
  checks:
  - type: sql
    command: show running-configuration ospf" command will list the complete OSPF
    severity: medium
    info: 'The "show running-configuration ospf" command will list the complete OSPF

      configuration. For all interfaces that do not have facing peers, ensure that those

      interfaces have the "ip ospf passive-interface" set.

      Every routeable interface should be set to either passive-interface, or be configured with

      authentication keys.

      switch# sho running-config ospf

      !Command: show running-config ospf

      !Running co'
- id: 3.1.3.2
  title: Authenticate OSPF peers with MD5 authentication keys
  scoring: manual
  profile:
  - Level 2
  description: If OSPF is configured, peers can be authenticated using keys. This is not configured by default. If configured,
    MD5 hashes are recommended as the authentication mechanism. MD5 is the best option for multi-vendor support, and is also
    the best cryptographic option available in the OSPF standard.
  rationale: ''
  impact: Because OSPF is a multicast protocol, any device can advertise OSPF capabilities and routes, and by default all
    connected OSPF devices will honor those advertisements. This means that a malicious actor can advertise bogus routes to
    valid hosts or networks, allowing the interception and modification of traffic intended for those hosts or subnets. For
    this reason it is important that OSPF endpoints authenticate to each other, ensuring that only valid routers can participate
    in the exchange of routes.
  references: []
  page_start: 159
  audit_raw: "The \"show running-configuration ospf\" lists the entire OSPF configuration. For all\ninterfaces that face peers,\
    \ ensure that these two commands are in place:\ninterface <interfacename>\n ip ospf authentication message-digest\n ip\
    \ ospf authentication key-chain <OSPF Key-Chain name>\nEach OSPF routeable interface should either have authentication\
    \ configured or be\nconfigured as an OSPF passive interface.\nswitch(config-if)# sho run ospf\n!Command: show running-config\
    \ ospf\n!Running configuration last done at: Wed May 20 14:39:55 2020\n!Time: Wed May 20 14:43:02 2020\nversion 9.3(3)\
    \ Bios:version\nfeature ospf\nrouter ospf 10\n router-id 10.10.10.10\ninterface Vlan1\n ip ospf authentication message-digest\n\
    \ ip ospf authentication key-chain OSPFKeyChain\n ip router ospf 10 area 0.0.0.0"
  remediation: 'For each OSPF routeable interface, set the message-digest authentication method, and

