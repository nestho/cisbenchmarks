- id: '3.4'
  title: Discovery Protocols 3.4.1 Configure LLDP
  scoring: manual
  profile:
  - Level 1
  description: LLDP is a discovery protocol that transmits information about the capabilities and current status of a device
    and its interfaces. LLDP devices use the protocol to solicit information only from other LLDP devices. You can use LLDP
    to discover and view information about many devices that are directly attached to the switch. In many situations LLDP
    is required for normal operation (for instance for autoprovisioning, or for network configuration of VOIP handsets or
    Wireless Access Points). LLDP advertises potentially sensitive information, including the current version of NXOS. For
    this reason it is recommended that LLDP be disabled or restricted to receiveonly on any link that links to equipment not
    owned by your organization. In more sensitive environments, in particular in carrier or cloud services environments (where
    the majority of the endpoints are customer controlled hosts), it is recommended to disable LLDP entirely.
  rationale: To permit the discovery of non-Cisco devices, the switch also supports the Link Layer Discovery Protocol (LLDP),
    a vendor-neutral device discovery protocol that is defined in the IEEE 802.1ab standard. LLDP allows network devices to
    advertise information about themselves to other devices on the network. This protocol runs over the data-link layer, which
    allows two systems running different network layer protocols to learn about each other. LLDP advertises potentially sensitive
    information, including the current version of NXOS and exposed IP addresses. This information can be used by a malicious
    actor to identify which vulnerabilities exist on the device, and from there which exploits might be most effective to
    compromise it. For this reason, enabling LLDP is generally not recommended except for troubleshooting or network discovery
    purposes. In particular, any ports connected to service provider gear, or any system not owned by your organization should
    have LLDP explicitly disabled. In more sensitive environments, disable LLDP globally.
  impact: ''
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7x/system_management/configuration/guide/b_Cisco_Nexus_9000_Series_NX-
  page_start: 194
