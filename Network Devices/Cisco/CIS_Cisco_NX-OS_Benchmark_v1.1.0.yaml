- id: 1.4.1
  title: Enable Password Complexity Requirements for Local Credentials
  scoring: manual
  profile:
  - Level 1
  description: 'While configuring a back-end authentication store is the recommended configuration, at least one local administrative
    account must be configured. For this reason, ensuring a minimum bar for password strength for all local administrative
    accounts is important. Enabling this setting enforces passwords that conform to the following rules: • At least eight
    characters long • Does not contain many consecutive characters (such as "abcd") • Does not contain many repeating characters
    (such as "aaabbb") • Does not contain dictionary words • Does not contain proper names • Contains both uppercase and lowercase
    characters • Contains numbers'
  rationale: While in ideal conditions local credentials won't be used, there are many scenarios (such as deployed on a purely
    public network or on an air gapped network) where this is the only option. Even if a back-end authentication source is
    used, if that service is not available the fall-back authentication is often to local credentials.
  impact: Having a simple password (for instance, based on a dictionary word) for administrative credentials makes that account
    susceptible to credential stuffing attacks. Even if using a back-end credential store such as TACACS+ or RADIUS, an attacker
    can drill down to the local credentials by taking the back-end service offline.
  references: []
  page_start: 52
  audit_raw: 'A simple "show" command audits the state of this setting:

    switch# show password strength-check

    Password strength check is enabled'
  remediation: 'A single command enables this:

    switch(config)# password strength-check'
  checks:
  - type: sql
    command: show password strength-check
    severity: medium
    info: 'A simple "show" command audits the state of this setting:

      switch# show password strength-check

      Password strength check is enabled'
- id: 1.4.2
  title: Configure Password Encryption
  scoring: manual
  profile:
  - Level 2
  description: You can enable strong, reversible 128-bit Advanced Encryption Standard (AES) password encryption, also known
    as type-6 encryption. To start using type-6 encryption, you must enable the AES password encryption feature and configure
    a master encryption key, which is used to encrypt and decrypt passwords. After you enable AES password encryption and
    configure a master key, all existing and newly created cleartext passwords for supported applications (currently RADIUS
    and TACACS+) are stored in type-6 encrypted format, unless you disable type-6 password encryption. You can also configure
    Cisco NX-OS to convert all existing weakly encrypted passwords to type6 encrypted passwords.
  rationale: Encryption is a good way to protect data that will be used later. Encrypted data can later be decrypted to its
    original value. Although encrypting passwords protects them, typically, an application uses the same encryption key for
    storing all user passwords.
  impact: Encryption of passwords is used to protect it from being sent over the wire cleartext. By applying encryption you
    are making it more difficult for an adversary to gain access to your device/network
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/switches/datacenter/sw/5_x/nxos/security/configuration/guide/b_Cisco_Nexus_7000_NXOS_Security_Configuration_Guide__Release_5-x/b_Cisco_Nexus_7000_NXOS_Security_Configuration_Guide__Release_5-x_chapter_010101.html
  page_start: 54
  audit_raw: switch(config)# show encryption service stat
  remediation: 'Configure a master key to be used with the AES password encryption feature. The key

    can contain between 16 and 32 alphanumeric characters

    switch# key config-key ascii

    New Master Key:

    Retype Master Key:

    switch(config)# feature password encryption aes'
  checks:
  - type: sql
    command: show encryption service stat
    severity: medium
    info: switch(config)# show encryption service stat
- id: 1.4.3
  title: Set password lifetime, warning time and grace time for local credentials
  scoring: manual
  profile:
  - Level 1
  description: NX-OS has commands to adjust the permitted lifetime of passphrases for local credentials, as well as the "warning
    time" before expiry and the "grace time" after expiry. If local credentials are in use, it is recommended that these be
    set to a value appropriate to the organization. Note that these timers cannot be set for the "admin" credential.
  rationale: ''
  impact: If local credentials are in regular use, it is recommended that a reasonable (non default) value be set for the
    passphrase timer values. The default of an infinite lifetime is of course not appropriate. Previous guidance of password
    changes on 30 or 60 day cycles however is also not appropriate if complex passwords are used and enforced. Some middle
    ground should be set - for instance, a password change cycle on a 6 or 12 month rotation is often easy to track. This
    entire discussion illustrates clearly why it is most often advisable to use a back-end authentication source for credential
    storage. In an organization that has multiple switches and other infrastructure, setting a password rotation is a recipe
    that has the risk of missing or entirely forgetting the change date, or of missing one or more devices in the change procedure.
    Since password recovery after the grace period involves a reboot of the entire switch, this end result is undesirable
    in the extreme. The best recommendation is to set a long, complex password for any local administrative accounts, then
    use a back-end authentication source, so that these local accounts are only used in the event that the back-end authentication
    source is not reachable.
  references: []
  page_start: 56
  audit_raw: 'To show the passphrase timers set per-user:

    switch# sho username <local userid> passphrase timevalues

    Last passphrase change(Y-M-D): 2020-04-30

    Passphrase lifetime: 99999 days after last passphrase change

    Passphrase warning time starts: 14 days before passphrase lifetime

    Passphrase Gracetime ends: 3 days after passphrase lifetime

