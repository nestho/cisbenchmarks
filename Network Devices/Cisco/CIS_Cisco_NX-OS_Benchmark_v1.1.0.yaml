    info: 'In practice, this typically means "do not use RIP or EIGRP, OSPF in their default

      configuration, use unicast only"

      In order to audit for this, check for the "multicast group" keyword for each configured

      routing protocol. Note that there is in some cases a "-" character in this keyword, also

      that the word "multicast" does not have consistent upper/lower case from protocol to

      protocol. For these rea'
- id: 3.1.4.4
  title: Configure HSRP protections
  scoring: manual
  profile:
  - Level 1
  description: HSRP is a valuable redundancy protocol, but like many protocols discussed in this document can be attacked
    and compromised. HSRP Authentication is recommended to protect against such attacks.
  rationale: ''
  impact: By default, HSRP is a clear-text protocol that negotiates which of a number of routing peers host the logical "standby"
    IP address. Communication to negotiate this is via clear-text messages using the multicast address 224.0.0.2. By default,
    the protocol is authenticated in cleartext, with a passphrase of "cisco". In a two device HSRP pair, a tool such as SCAPY
    can be used to impersonate a third participant, advertising itself as an HSRP candidate at a higher priority value. A
    successful attack of this type usually results in the malicious actor becoming the default gateway for that subnet, which
    puts the attacker in the position to inspect all traffic leaving the network, either for eavesdropping or for modifying
    traffic in transit. Return traffic will not usually be routed through the attacker (unless a second attack is mounted
    successfully to accomplish this), but intercepting sent traffic gives the attacker the ability to read credentials directly
    or modify the destination IP address (two common goals). Modifying the destination address allows the attacker to stand
    up a malicious copy of a target website (for instance, a bank site or paypal), where high value, encrypted credentials
    can be harvested. Protecting HSRP with hashed credentials makes this type of attack much more difficult, the attacker
    must either reverse the hash, or otherwise mount a "pass the hash" attack on the HSRP hosts. Note however that this setting
    will not prevent all HSRP attacks - it will however make it much more likely that an attack will generate alerts in the
    log, giving the defending team a good indication that the attack occurred and should be investigated. Automated attacks
    are often simpler (for instance, may only try the default value), so those may be defeated.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/6x/unicast/configuration/guide/l3_cli_nxos/l3_hsrp.html#47962
  page_start: 171
  audit_raw: "The \"show running-config hsrp\" shows all HSRP configurations. Ensure that MD5\nauthentication is configured\
    \ for each HSRP configuration.\nswitch# sho run hsrp\n!Command: show running-config hsrp\n!Running configuration last\
    \ done at: Wed May 20 17:24:20 2020\n!Time: Wed May 20 17:25:33 2020\nversion 9.3(3) Bios:version\nfeature hsrp\ninterface\
    \ Vlan1\n hsrp version 2\n hsrp 1\n authentication md5 key-chain HSRP-KEYCHAIN\n name HSRPVLAN1\n preempt\n priority 110\n\
    \ ip 10.10.10.1"
  remediation: 'First, enable HSRP

    switch(config)# feature hsrp

    set the HSRP version to "2" to allow for MD5 encryption (per interface)

    switch(config)# int vlan 1

    switch(config-if)# hsrp version 2

    Finally, configure the remainder of that interfaces HSRP setup. The key command is of

    course the "authentication md5" clause

    switch(config-if)# hsrp 1

    switch(config-if-hsrp)# authentication md5 key-chain <HSRP-KEYCHAIN>

    switch(config-if-hsrp)# name HSRPVLAN1

    switch(config-if-hsrp)# preempt

    switch(config-if-hsrp)# priority 110

    switch(config-if-hsrp)# ip 10.10.10.1'
  checks:
  - type: sql
    command: show running-config hsrp" shows all HSRP configurations. Ensure that MD5
    severity: medium
    info: "The \"show running-config hsrp\" shows all HSRP configurations. Ensure that MD5\nauthentication is configured for\
      \ each HSRP configuration.\nswitch# sho run hsrp\n!Command: show running-config hsrp\n!Running configuration last done\
      \ at: Wed May 20 17:24:20 2020\n!Time: Wed May 20 17:25:33 2020\nversion 9.3(3) Bios:version\nfeature hsrp\ninterface\
      \ Vlan1\n hsrp version 2\n hsrp 1\n authentication md5 key-chain HSR"
- id: 3.2.1
  title: IPv6 Specific Protections 3.2.1.1 Configure RA Guard
  scoring: manual
  profile:
  - Level 1
  description: The IPv6 RA Guard feature provides support for allowing the network administrator to block or reject unwanted
    or rogue RA guard messages that arrive at the network device platform. RAs are used by devices to announce themselves
    on the link. The IPv6 RA Guard feature analyzes these RAs and filters out RAs that are sent by unauthorized devices. In
    host mode, all RA and router redirect messages are disallowed on the port. The RA guard feature compares configuration
    information on the Layer 2 (L2) device with the information found in the received RA frame. Once the L2 device has validated
    the content of the RA frame and router redirect frame against the configuration, it forwards the RA to its unicast or
    multicast destination. If the RA frame content is not validated, the RA is dropped.
  rationale: Packets are classified into one of three DHCP type messages. If a packet arriving from DHCP server is a Relay
    Forward or a Relay Reply, only the device role is checked. In addition, IPv6 DHCP Guard doesn't apply the policy for a
    packet sent out by the local relay agent running on the switch.
  impact: With RA Guard in it's default "not configured" state, a malicious actor can send IPv6 RA (Router Advertisement)
    packets, and present their station as a valid router. This places the attacker in a position where they can send specific
    traffic to a malicious site (usually to steal credentials). Also an attacker in this position can eavesdrop on or modify
    traffic in transit, before forwarding it on.
  references: []
  page_start: 175
  audit_raw: "Use the command \"sho ipv6 nd raguard policy\" to audit for this configuration. Ensure\nthat a valid RA Guard\
    \ Policy is applied to all routed VLANs, unless this causes some\noperational issue.\nswitch# sho ipv6 nd raguard policy\n\
    Policy RAGuardPol01 configuration:\n trusted-port\n device-role router\n hop-limit minimum 3\n managed-config-flag on\n\
    \ other-config-flag on\n router-preference maximum high\nPolicy RAGuardPol01 is applied on the following targets:\nTarget\
    \ Type Policy Feature Target range\nvlan 10 VLAN RAGuardPol01 RA guard vlan all\nNotes:\nThe parameters device-role, hop-limit,\
    \ managed-config-flag, other-config-flag and\nrouter-preference describe various RA Guard checks, and are all optional.\
    \ These will\nvary depending on your operational requirements. These statements are shown as\nexamples only, the key audit\
    \ parameter is that the RAGuard Policy is created and\napplied to the appropriate VLANs."
  remediation: 'In the example below, the RA Guard policy is created, then applied to a VLAN.

    Example

    switch(config)# ipv6 nd raguard policy RAGuardPol01

    switch(config-ra-guard)# device-role router

    switch(config-ra-guard)# hop-limit minimum 3

    switch(config-ra-guard)# managed-config-flag on

    switch(config-ra-guard)# other-config-flag on

    switch(config-ra-guard)# router-preference maximum high

    switch(config-ra-guard)# trusted-port

    Configuring RA Guard on an interface

    Example

    switch(config)#vlan configuration 10

    switch(config-if) ipv6 nd raguard attach-policy RAGuardPol01'
  checks:
  - type: manual_review
    info: "Use the command \"sho ipv6 nd raguard policy\" to audit for this configuration. Ensure\nthat a valid RA Guard Policy\
      \ is applied to all routed VLANs, unless this causes some\noperational issue.\nswitch# sho ipv6 nd raguard policy\n\
      Policy RAGuardPol01 configuration:\n trusted-port\n device-role router\n hop-limit minimum 3\n managed-config-flag on\n\
      \ other-config-flag on\n router-preference maximum high\nPolicy RAGuardPol01 is applied on the following targets:\n\
      Target Type Policy Feature Target range\nvlan 10 VLA"
    severity: medium
- id: 3.2.2
  title: Disable ICMP Redirects on all Layer 3 Interfaces
  scoring: manual
  profile:
  - Level 1
  description: A redirect packet basically informs the host that there is a better way to get to the destination host or network.
    This route is then cached on the (victim) host. For instance, if the default gateway of a host is the NX-OS switch, and
    the victim host sends a packet to an internet or WAN IP, the NX-OS switch will inform the host that the firewall or WAN
    router will be a better path. If at some future time, if that firewall or WAN router should fail and trigger a routing
    change, the route to that failed device will persist in the victim host. This scenario is only in play if the NX-OS device
    is the gateway for the victim host, and the Firewall or WAN router (or other next hop device) is also on the same subnet
    as the victim host. Also, if the next hop device handles its own failover (for instance, using HSRP), there is no routing
    change, so the "redirect" issue will not be a problem. This situation is generally a problem only if the path to the destination
    is handled by a "next hop" mechanism, for instance by a routing protocol or a local route-map, and a backup path exists.
    In this situation, the route to the target will fail, the route will change to the backup path, and the victim will cache
    the old route for minutes or hours after the failure.
  rationale: ''
  impact: ''
  references:
  - 1. https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/nx-ossoftware/213841-understanding-icmp-redirect-messages.html#anc17
  page_start: 179
  audit_raw: "switch# show running-config [layer 3 int]\nFor instance, this shows an audit success (redirects disabled)\n\
    CISNXOS9# sho run int vlan 9\n!Command: show running-config interface Vlan9\n!Running configuration last done at: Sun\
    \ Jun 21 13:53:16 2020\n!Time: Sun Jun 21 13:53:21 2020\nversion 9.3(3) Bios:version\ninterface Vlan9\n no ip redirects\n\
    \ ip address 10.99.99.99/24\nThis shows an audit failure (no display, so the default of \"redirects enabled\" is active)\n\
    switch# sho run int vlan 9\n!Command: show running-config interface Vlan9\n!Running configuration last done at: Sun Jun\
    \ 21 13:49:56 2020\n!Time: Sun Jun 21 13:50:45 2020\nversion 9.3(3) Bios:version\ninterface Vlan9\n ip address 10.99.99.99/24"
  remediation: 'It is recommended that you perform this task on all Layer 3 Interfaces which have both

    a primary and a backup routed path to any destination. In particular, the next hop will

    need to be in the same subnet as the potential victim hosts.

    The corollary to this is that if the network is architected such that all layer 3 egress paths

    are on dedicated or "point to point" segments (with no other hosts on those segments),

    then the ip redirect issue will never arise.

    switch(config-if) no ip redirects

    switch(config)#'
  checks:
  - type: sql
    command: show running-config [layer 3 int]
    severity: medium
