- id: 3.1.1.2
  title: Configure EIGRP Passive interfaces for interfaces that do not have peers
  scoring: manual
  profile:
  - Level 1
  description: EIGRP both listens on and advertises on all interfaces that have IPs in subnets that are defined as "networks"
    in the EIGRP configuration. Ensure that interfaces that do not "face" an EIGRP peer are set to passive.
  rationale: If an interface is set to "passive", then EIGRP will not advertise out of that interface or listen on that interface
    for EIGRP neighbors. By default, all interfaces advertise via multicast to solicit EIGRP neighbors, and also listen for
    neighbor advertisements.
  impact: If an interface is set to the default (ie - not passive), then an attacker can pose as an EIGRP peer, either to
    collect EIGRP information from advertisements or to inject bogus routes into the table. Bogus routes can then be used
    to DOS that subnet, or to intercept traffic to or from that subnet either to eavesdrop on conversations or to modify data
    in transit. Quite often the goal of an attack of this type is to collect login credentials from a malicious copy of the
    target website.
  references: []
  page_start: 144
  audit_raw: "The \"show running-config eigrp\" command will list the entire EIGRP configuration.\nPassive interfaces are\
    \ listed individually - in this example, interface VLAN 1 is passive\nswitch# sho run eigrp\n!Command: show running-config\
    \ eigrp\n!Running configuration last done at: Wed May 20 14:13:17 2020\n!Time: Wed May 20 14:17:22 2020\nversion 9.3(3)\
    \ Bios:version\nfeature eigrp\nrouter eigrp 10\n address-family ipv4 unicast\n authentication mode md5\n authentication\
    \ key-chain <key-chain-name>\ninterface Vlan1\n ip passive-interface eigrp 10"
  remediation: 'If some IP interfaces have peers and some do not, set the ones with no peers to

    "passive"

    switch(config-if)# int vlan 1

    switch(config-if)# ip passive-interface eigrp <EIGRP process number>'
  checks:
  - type: sql
    command: show running-config eigrp" command will list the entire EIGRP configuration.
    severity: medium
    info: "The \"show running-config eigrp\" command will list the entire EIGRP configuration.\nPassive interfaces are listed\
      \ individually - in this example, interface VLAN 1 is passive\nswitch# sho run eigrp\n!Command: show running-config\
      \ eigrp\n!Running configuration last done at: Wed May 20 14:13:17 2020\n!Time: Wed May 20 14:17:22 2020\nversion 9.3(3)\
      \ Bios:version\nfeature eigrp\nrouter eigrp 10\n address-family ip"
- id: 3.1.1.3
  title: Configure EIGRP log-adjacency-changes
  scoring: manual
  profile:
  - Level 1
  description: Logging changes to the EIGRP peering relationships is recommended. This setting is enabled by default.
  rationale: Any logged changes in a routing peer relationship will in the best case indicate a service issue due to standard
    operational issues (connectivity issues and so on) or in the worst case, could indicate malicious activity attempting
    to subvert the peering relationship and/or the routing table.
  impact: Errors on adjacency relationships are a common early warning message in attacks on routers. If successful, a malicious
    actor can advertise bogus routes to valid hosts or networks, allowing the interception and modification of traffic intended
    for those hosts or subnets. For this reason it is important that EIGRP endpoints alert on any interruptions in adjacency.
  references: []
  page_start: 146
  audit_raw: "By default EIGRP adjacency changes are logged, and this does not show in the\nconfiguration.\nAudit pass (no\
    \ output):\nswitch# sho run eigrp | i adjacency\nAudit failure (logging is disabled, as shown in the output):\nswitch#\
    \ sho run eigrp | i adjacency\n no log-adjacency-changes\nLog entries of adjacency changes being formed and dropped are\
    \ shown below. Logging\nservers and SIEMs should be configured to alert on the keyword \"NBRCHANGE\":\n2020 May 22 18:47:32\
    \ switch %EIGRP-5-NBRCHANGE_DUAL: eigrp-10 [3857]\n(default-base) IP-EIGRP(0) 10: Neighbor 10.10.10.11 (Vlan1) is up:\
    \ new\nadjacency\n2020 May 22 18:48:07 switch %EIGRP-5-NBRCHANGE_DUAL: eigrp-10 [3857]\n(default-base) IP-EIGRP(0) 10:\
    \ Neighbor 10.10.10.11 (Vlan1) is down: holding\ntime expired"
  remediation: 'By default EIGRP adjacency changes are logged, and this does not show in the

    configuration.

    If however it is disabled, it can be re-enabled as shown below.

    switch(config)# router eigrp <eigrp process tag>

    switch(config-router)# log-adjacency-changes'
  checks:
