    \ interfaces:\nvsan 101 interfaces:\n vfc1001 vfc1002\nvsan 4079(evfp_isolated_vsan) interfaces:\nvsan 4094(isolated_vsan)\
    \ interfaces:\nswitch# sho int vfc 1001\nvfc1001 is down (Administratively down)\n Bound MAC is 00:01:0b:00:00:02\n Hardware\
    \ is Ethernet\n Port WWN is 23:e8:8c:60:4f:a6:29:bf\n Admin port mode is F, trunk mode is on\n snmp link state traps are\
    \ enabled\n Port vsan is 101\n 1 minute input rate 0 bits/sec, 0 bytes/sec, 0 frames/sec\n 1 minute output rate 0 bits/sec,\
    \ 0 bytes/sec, 0 frames/sec\n 0 frames input, 0 bytes\n 0 discards, 0 errors\n 0 frames output, 0 bytes\n 0 discards,\
    \ 0 errors\n last clearing of \"show interface\" counters never\nswitch# sho fcoe database\n-----------------------------------------------------------------------------\n\
    --\nINTERFACE FCID PORT NAME MAC ADDRESS\n-----------------------------------------------------------------------------\n\
    --"
  remediation: 'Create a VSAN. Give it a meaningful name

