- id: '3.5'
  title: Fiber Channel / Fiber Channel over Ethernet 3.5.1 Basic Fiber Channel Configuration
  scoring: manual
  profile:
  - Level 2
  description: Fibre Channel over Ethernet (FCoE) encapsulation allows a physical Ethernet cable to carry standard Fibre Channel
    traffic within Ethernet frames. In Cisco Nexus devices, an FCoE-capable physical Ethernet interface can carry traffic
    for one virtual Fibre Channel (vFC) interface. If FCoE functionality is not required, this functionality should be disabled.
    Note also that this is a licensed feature, so is not available without a purchased license.
  rationale: ''
  impact: ''
