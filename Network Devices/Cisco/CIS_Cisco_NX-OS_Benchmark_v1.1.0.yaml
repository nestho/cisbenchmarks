- id: 1.8.2
  title: Disable iPXE (Pre-boot eXecution Environment)
  scoring: manual
  profile:
  - Level 2
  description: iPXE allows a NX-OS device to boot from the network, usually using HTTP.
  rationale: This method allows the switch bootup image to be controlled centrally, often using DHCP services.
  impact: The risks of using this boot method are obvious. First, DHCP is a broadcast request, so any host (including a malicious
    host) can provide the DHCP response - the first response "wins". This means that a malicious actor can control operating
    system being booted on the switch. In addition, the HTTP protocol is clear-text, so is susceptible to modification in
    transit by an attacker. This is a less likely attack however, as the NX-OS boot sequence has multiple checks in place
    to verify the validity of the OS, and all most succeed for the boot sequence to proceed.
  references: []
  page_start: 116
  audit_raw: 'The "show boot order" command can be used to view if PXE is configured or not.

    In this example, the running config has PXE configured (audit fail):

    switch# sho boot order

    Current Boot Order:

    BootOrder = PXE boot first, follow by Bootflash if netboot failed

    Boot Order on next reload:

    BootOrder = PXE boot first, follow by Bootflash if netboot failed

    This example shows the default - no boot order set, so the system boots from the

    bootflash image only (audit success):

    CISNXOS9# show boot order

    Current Boot Order:

    BootOrder = Bootflash only

    Boot Order on next reload:

    Boot Order is not set. So, Bootflash is default

    This example shows the values for a bootflash boot explicitly set (also audit success):

    switch(config)# sho boot order

    Current Boot Order:

    BootOrder = Bootflash only

    Boot Order on next reload:

    BootOrder = Bootflash only

    An easier programmatic audit would be to query the running or saved configuration

    directly, using:

    switch# sho run | i "boot order"

    boot order bootflash

    An audit fail will include the keyword "pxe", and audit pass will not. So adding that:

    switch# sho run | i "boot order" | grep pxe

    A blank line indicates audit success, a returned line will include "pxe" so would indicate

    an audit failure.'
  remediation: 'Setting the boot order explicity to "bootflash" will remediate a PXE configured device.

    switch(config)# boot order bootflash

    You can also "no" the current boot order line to revert to the default setting. For

    instance, to remove the configuration line "boot order pxe bootflash" command, use

    switch(config)# no boot order pxe bootflash'
  checks:
  - type: command
    command: switch# sho run | i "boot order" | grep pxe
    expected: ''
    severity: medium
    info: 'The "show boot order" command can be used to view if PXE is configured or not.

      In this example, the running config has PXE configured (audit fail):

      switch# sho boot order

      Current Boot Order:

      BootOrder = PXE boot first, follow by Bootflash if netboot failed

      Boot Order on next reload:

      BootOrder = PXE boot first, follow by Bootflash if netboot failed

      This example shows the default - no boot order set'
- id: 1.8.3
  title: Set SSH Key Modulus Length
  scoring: manual
  profile:
  - Level 2
  description: SSH sessions are encrypted using a key unique to the host (in this case the NX-OS switch). It is recommended
    that this key be 2048 bytes long or longer.
  rationale: While attacking encryption algorithms is not practical for commodity malware, it definitely is possible. As remediation
    is so easily done it is definitely recommended.
  impact: Implementing this feature requires the deletion of the existing (default) ssh keys, which are 1024 bytes in length.
    This means that this change must be implemented using some other access method, such as using the console port or a temporary
    telnet session (be sure to disable telnet after remediation if this method is used)
  references: []
  page_start: 119
  audit_raw: 'switch# sho ssh key | i bitcount

    bitcount:1024

    bitcount: 0'
  remediation: 'Again, this must be implemented using an out-of-band (ie - not ssh) method.

    switch(config)# no feature ssh

    switch(config)# ssh key rsa 2048 force

    switch(config)# feature ssh'
  checks:
  - type: manual_review
    info: 'switch# sho ssh key | i bitcount

      bitcount:1024

      bitcount: 0'
    severity: medium
- id: '1.9'
  title: Use Dedicated "mgmt" Interface and VRF for Administrative Functions
  scoring: manual
  profile:
  - Level 2
  description: 'Vendors provisioning dedicated management interfaces is a widespread practice, and gives some significant
    security advantages when implementing: • SSH access • SNMP polling • Syslog logging • SNMP traps • NTP requests This practice
    facilitates implementation of segmented, access controlled Management VLANs or VRFs, which acts as a significant deterrent
    to attackers. It provides management access outside of the regular data plane operations. Also, if there is a routing
    or switching issue that might interfere with in-band access, the management interface is very often not affected by this
    and is still acceptable.'
  rationale: Administration via the mgmt interface bypasses the default routing and switching processing on the switch. This
    means that any routing issues or switching problems on the device itself will not affect access to the mgmt0 interface.
    Note however that in most cases the uplink from the mgmt0 interface is part of the larger switching infrastructure - this
    should be taken into account when architecting the overall network.
  impact: Using the MGMT interface and a dedicated Management VRF ensures that production and management traffic can never
    interfere with each other. More importantly, this provides a segregated path outside of the production data plane path
    for management traffic. This is important because often management traffic such as syslog, SNMPv2 and NTP are in clear
    text. Routing this traffic using the production data paths gives a malicious actor the opportunity to intercept or modify
    this traffic, which facilitates several opportunities for reconnaissance or active attacks by modifying this data.
  references: []
  page_start: 121
  audit_raw: 'Use the command "show running-config | i source-interface"

    Ensure that (if configured) the source-interface is configured for snmp traps, snmp

    informs, ntp and logging.

    switch# sho run | i source-interface

    snmp-server source-interface traps mgmt0

    snmp-server source-interface informs mgmt0

    snmp-server host 1.2.3.4 source-interface mgmt0

    ntp source-interface mgmt0

    logging source-interface mgmt0'
  remediation: 'First configure the mgmt0 interface:

    switch(config)# interface mgmt0

    switch(config-if)# ip address 1.2.3.1/24

    If needed, add the various routes needed for connectivity for the mgmt interface. Note

    that this can also be accomplished with a routing protocol implemented for the vrf

    "management"

    ip route 5.6.7.8 255.255.255.0 1.2.3.254 vrf management

    Then, configure the source-interface commands for each target protocol that is

    implemented:

    switch(config)# snmp-server source-interface traps mgmt0

    switch(config)# snmp-server source-interface informs mgmt0

    switch(config)# snmp-server host 1.2.3.4 source-interface loopback0

    switch(config)# ntp source-interface mgmt0

    switch(config)# logging source-interface mgmt0'
  checks:
  - type: sql
    command: show running-config | i source-interface"
    severity: medium
    info: 'Use the command "show running-config | i source-interface"

      Ensure that (if configured) the source-interface is configured for snmp traps, snmp

      informs, ntp and logging.

      switch# sho run | i source-interface

      snmp-server source-interface traps mgmt0

      snmp-server source-interface informs mgmt0

      snmp-server host 1.2.3.4 source-interface mgmt0

      ntp source-interface mgmt0

      logging source-interface mgmt0'
- id: 2.1.1
  title: Configure Control Plane Policing
  scoring: manual
  profile:
  - Level 1
  description: Control Plane Policing is used to create a set of policies governing specific traffic. Normally this limits
    the volume and type of traffic that can be directed to the IP addresses on the device, as this traffic normally must be
    handled in process mode by the switch CPU. For instance, limiting the volume of ICMP traffic that can be sent to a device
    IP will both limit the CPU impact of that traffic and also limit the bandwidth that this traffic can take. With 10GB and
    faster interfaces available, both of these considerations are important.
  rationale: You must configure control plane class maps for control plane policies. You can classify traffic by matching
    packets based on existing ACLs. The permit and deny ACL keywords are ignored in the matching. You can configure policies
    for IP version 4 (IPv4) and IP version 6 (IPv6) packets.
  impact: Configuring Control Plane Policing both limits the impact of traffic (either diagnostic or malicious traffic) on
    the CPU and interfaces of the device. It also limits the impact of this traffic on available bandwidth - it can't restrict
    how much traffic is sent, but it certainly limits how much is processed, so by that limits the volume of reply traffic.
    In many DOS attacks, ideally the attacker wants the volume of the reply traffic to exceed the traffic sent - getting the
    victim to "amplify" the attack is almost always a desired goal of the attacker. This DOS attack can then be directed to
    a third "victim" host by the use of spoofing, or the DOS attack may be just against the vulnerable device or host (in
    this case the NX-OS switch)
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/6x/security/configuration/guide/b_Cisco_Nexus_9000_Series_NXOS_Security_Configuration_Guide/b_Cisco_Nexus_9000_Series_NXOS_Security_Configuration_Guide_chapter_010001.html#con_1060709
  page_start: 126
