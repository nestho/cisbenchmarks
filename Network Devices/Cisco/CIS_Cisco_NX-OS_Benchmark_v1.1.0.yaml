- id: 1.7.2
  title: Configure a Time Zone
  scoring: manual
  profile:
  - Level 1
  description: Timezones are a source of contention in larger corporations. On one hand, if infrastructure is configured with
    time consistent with the local timezone, then it is simpler to co-relate end-user symptoms and logs on end-user equipment
    with logs from network equipment. On the other hand, in organizations that span multiple time zones, configuring local
    time can make it easy to mis-match log entries from gear in different time zones. In some organizations, the solution
    is to post both local and UTC time in all log entries. In other organizations, all gear is configured for one timezone
    (either UTC or "head office time"). The important thing is to have a standard for time zone, and to configure it consistently
    across all hosts and infrastructure equipment.
  rationale: ''
  impact: Not having a consistent time zone policy across all hosts and infrastructure means that when dealing with a security
    incident or technical issue, it becomes very easy to mismatch logs as affected hosts span multiple time zones.
  references: []
  page_start: 107
  audit_raw: 'To show the current timezone, show the running configuration and filter for the word

    "timezone".

    switch(config)# sho run | i timezone

    clock timezone EST -5 0'
  remediation: 'To set the timezone, define the timezone name, the offset in hours, then the offset in

    seconds. The example below shows EST (Offset of -5 hours, zero seconds).

    switch(config)# clock timezone EST -5 0'
  checks:
  - type: sql
    command: show the current timezone, show the running configuration and filter for the word
    severity: medium
    info: 'To show the current timezone, show the running configuration and filter for the word

      "timezone".

      switch(config)# sho run | i timezone

      clock timezone EST -5 0'
- id: 1.7.3
  title: If a Local Time Zone is used, Configure Daylight Savings
  scoring: manual
  profile:
  - Level 1
  description: If local time zones are configured on network infrastructure, it is important to also configure the time "shift"
    that occurs as a result of Daylight Savings Time.
  rationale: ''
  impact: If local time zones are configured on network infrastructure, it is usually to simplify relating reported end-user
    issues back to local time entries in the logs. So if local time zones are configured and used in this manner, it becomes
    important to also configure the time "shift" that occurs as a result of Daylight Savings Time (or "summer-time" on the
    Cisco CLI)
  references: []
  page_start: 109
  audit_raw: 'switch(config)# sho run | i summer-time

    clock summer-time EDT 2 Sun Mar 02:00 1 Sun Nov 02:00 60'
  remediation: 'In most cases, just the name of the DST timezone name is sufficient. NX-OS assumes 1

    hour offset, using the United States dates for DST.

    switch(config)# clock summer-time <DST Timezone Name>

    for example:

    switch(config)# clock summer-time EDT

    If a full definition of the change is needed, it can certainly be set:

    switch(config)# clock summer-time <DST Timezone Name> <day1> <month1> <time1>

    <day2> <month2> <time2> <offset in minutes>

    where:

    • day1, month1, time1 define the start of the DST period

    • day2, month2, time2 define the end of the DST period'
  checks:
  - type: manual_review
    info: 'switch(config)# sho run | i summer-time

      clock summer-time EDT 2 Sun Mar 02:00 1 Sun Nov 02:00 60'
    severity: medium
