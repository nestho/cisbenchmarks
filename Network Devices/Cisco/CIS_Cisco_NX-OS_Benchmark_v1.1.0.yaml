- id: 3.1.4.1
  title: If VLAN interfaces have IP addreses, configure anti spoofing / ingress filtering protections
  scoring: manual
  profile:
  - Level 1
  description: If VLAN interfaces have IP addresses, it is important that anti-spoofing protections are in place, to prevent
    an attacker from spoofing an address that is illegal on that inbound interface.
  rationale: If an attacker is allowed to "spoof" addresses to the point that packets are permitted to arrive on the incorrect
    interface, it becomes possible for an attacker to spoof their trust level from a network point of view, for instance to
    source "inside" addresses from an "outside" interface.
  impact: 'The URPF feature uses the same tables as the routing protocol, so the CPU impact of configuring this feature is
    low. However, logging of high volume URPF attacks (or URPF misconfigurations) can result in: • higher CPU impacts on the
    switch • as higher network utilization on the path to the logging server • higher disk utilization on the logging server
    • higher cpu utilization on the logging server Because of this, URPF events, especially in higher volumes should be configured
    to generate a high priority alert in your logging server or SIEM.'
  references: []
  page_start: 164
  audit_raw: "The \"show run ip\" command will show all IP interfaces as well as their URPF settings.\nAll non-loopback interfaces\
    \ that have IP addresses should have URPF configured (ip\nverify unicast source).\nswitch# sho run ip\n!Command: show\
    \ running-config ip\n!Running configuration last done at: Sun May 17 13:32:08 2020\n!Time: Sun May 17 13:36:49 2020\n\
    version 9.3(3) Bios:version\nvrf context management\n ip route 0.0.0.0/0 10.17.8.2\n ip route 0.0.0.0/0 192.168.122.1\n\
    interface Vlan1\n ip address 10.10.10.10/24\n ip verify unicast source reachable-via rx"
  remediation: 'Apply the command "ip verify unicast source reachable-via rx" to all VLAN interfaces

    that have IP addresses. This forces the check to verify that the packet is arriving on the

    correct interface.

    The command variant "ip verify unicast source reachable-via any" is not recommended,

    as it only filters for valid IP addresses. If the device has a default route, then this

    command variant has no affect.

    switch(config)# interface Vlan X

    switch(config-if)# ip verify unicast source reachable-via rx'
  checks:
  - type: sql
    command: show run ip" command will show all IP interfaces as well as their URPF settings.
    severity: medium
    info: "The \"show run ip\" command will show all IP interfaces as well as their URPF settings.\nAll non-loopback interfaces\
      \ that have IP addresses should have URPF configured (ip\nverify unicast source).\nswitch# sho run ip\n!Command: show\
      \ running-config ip\n!Running configuration last done at: Sun May 17 13:32:08 2020\n!Time: Sun May 17 13:36:49 2020\n\
      version 9.3(3) Bios:version\nvrf context management\n ip route "
- id: 3.1.4.2
  title: Create and use a single Loopback Address for Routing Protocol Peering
  scoring: manual
  profile:
  - Level 2
  description: The use of a loopback interface is recommended for use in all routing protocols. This recommendation describes
    the configuration of the loopback interface. Routing protocol specific configurations are described under the respective
    routing protocols.
  rationale: Loopback interfaces are always up, and so are not dependent on physical interface link state issues (cabling
    or other link issues for instance). This means traffic sourced from a loopback interface can take any valid path to establish
    a routing relationship or to route traffic. Loopback interfaces by their nature cannot "flap" (toggle between up and down
    states). Depending on the error condition, most physical interfaces are susceptible to interface flapping.
  impact: Using a loopback interface makes a routing device much less susceptible to intermittent or permanent interface failures.
  references: []
  page_start: 167
  audit_raw: 'switch# sho ip int brief | i Lo

    Lo0 10.11.11.1 protocol-up/link-up/admin-up'
  remediation: 'Creating the loopback interface is a simple process. Addressing the loopback, in

    particular computing the subnet mask will vary by the organization and application.

    Often smaller subnets can be used for loopbacks, depending on how many potential

    peers are possible.

    switch(config)# int loopback 0

    switch(config-if)# ip address 10.11.11.1 255.255.255.252

    In order to use the loopback interface (rather than the closest interface to the routing

    peer), it must be explicitly configured in the routing protocol. This is described in the

    recommendations for each respective routing protocol.'
  checks:
  - type: manual_review
    info: 'switch# sho ip int brief | i Lo

      Lo0 10.11.11.1 protocol-up/link-up/admin-up'
    severity: medium
- id: 3.1.4.3
  title: Use Unicast Routing Protocols Only
  scoring: manual
  profile:
  - Level 2
  description: Unicast routing protocols describe the destination routing peers by IP address. Multicast and Broadcast based
    routing protocols will discover routing neighbors dynamically. Because of this discovery process, a malicious actor can
    much more easily establish a peering relationship and hijack the routing protocol.
  rationale: While most routing protocols can be configured with authentication, multicast and broadcast routing protocols
    have an inherent weakness in their "trust" of any neighbor that advertises or will answer an advertisment.
  impact: In multicast and broadcast routing protocols, the router (in this case the NX-OS device) will advertise its presence
    to all devices on a subnet, soliciting other routers using that same protocol. In that situation, an attacker can simply
    reply to those advertisements and establish a peering relationship. At that point the attacker can inject any route desired,
    so that traffic for that destination will route through the malicious router, putting the attacker in a "monkey in the
    middle" position, able to eavesdrop on or change any traffic to or from that destination, then forward it on. Tools such
    as scapy have wellestablished attack scripts for most broadcast or multicast routing protocols.
  references: []
  page_start: 169
  audit_raw: "In practice, this typically means \"do not use RIP or EIGRP, OSPF in their default\nconfiguration, use unicast\
    \ only\"\nIn order to audit for this, check for the \"multicast group\" keyword for each configured\nrouting protocol.\
    \ Note that there is in some cases a \"-\" character in this keyword, also\nthat the word \"multicast\" does not have\
    \ consistent upper/lower case from protocol to\nprotocol. For these reasons it is recommended to filter by the phrase\
    \ \"ulticast\"\nswitch#show ip <routing protocol> | i ulticast\nfor instance:\nswitch# sho ip rip | i ulticast\nRIP port\
    \ 520, multicast-group 224.0.0.9\nswitch# sho ip eigrp | i ulticast\n IP proto: 88 Multicast group: 224.0.0.10\n(note\
    \ again the inconsistency in upper/lower case in the \"multicast group\" keywords)"
  remediation: Configure unicast routing only, for instance BGP.
  checks:
  - type: sql
    command: show ip <routing protocol> | i ulticast
