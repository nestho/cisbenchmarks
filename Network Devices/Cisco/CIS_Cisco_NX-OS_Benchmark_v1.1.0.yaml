- id: 3.4.2
  title: Configure CDP
  scoring: manual
  profile:
  - Level 2
  description: The Cisco Discovery Protocol (CDP) is a media-independent and protocol-independent protocol that runs on all
    Cisco-manufactured equipment including routers, bridges, access and communication servers, and switches. You can use CDP
    to discover and view information about all the Cisco devices that are directly attached to the device. Each device that
    you configure for CDP sends periodic advertisements to a multicast address. Each device advertises at least one address
    at which it can receive SNMP messages. The advertisements also contain hold-time information, which indicates the length
    of time that a receiving device should hold CDP information before removing it. You can configure the advertisement or
    refresh timer and the hold timer. CDP advertises potentially sensitive information, including the current version of NXOS.
    For this reason it is recommended that CDP be disabled on any link that links to equipment not owned by your organization.
    In more sensitive environments, in particular in carrier or cloud services environments (where the majority of the endpoints
    are customer controlled hosts), it is recommended to disable CDP entirely
  rationale: CDP advertises potentially sensitive information, including the current version of NXOS. This information can
    be used by a malicious actor to identify which vulnerabilities exist on the device, and from there which exploits might
    be most effective to compromise it. For this reason, enabling CDP is generally not recommended except for troubleshooting
    or network discovery purposes. In particular, any ports connected to service provider gear, or any system not owned by
    your organization should have CDP explicitly disabled. In more sensitive environments, disable CDP globally.
  impact: ''
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/7x/system_management/configuration/guide/b_Cisco_Nexus_9000_Series_NXOS_System_Management_Configuration_Guide_7x/b_Cisco_Nexus_9000_Seri
  page_start: 198
  audit_raw: "To show all CDP definitions, for all interfaces:\nswitch# sho cdp all\nTo show CDP status for any single interface:\n\
    switch# sho cdp interface Ethernet x/y\nEthernetx/y is up\n CDP disabled globally\n CDP enabled on interface\n Refresh\
    \ time is 60 seconds\n Hold time is 180 seconds"
  remediation: 'Enabling CDP Globally

