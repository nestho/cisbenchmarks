- id: 2.1.6
  title: Key chains
  scoring: scored
  profile:
  - Level 2
  description: Keychain management is a common method of authentication to configure shared secrets on all entities that exchange
    secrets such as keys, before establishing trust with each other. Routing protocols and network management applications
    on Cisco IOS XR software often use authentication to enhance security while communicating with peers.
  rationale: The keychain by itself has no relevance; therefore, it must be used by an application that needs to communicate
    by using the keys (for authentication) with its peers. The keychain provides a secure mechanism to handle the keys and
    rollover based on the lifetime. Border Gateway Protocol (BGP), Open Shortest Path First (OSPF), and Intermediate System-to-Intermediate
    System (IS-IS) use the keychain to implement a hitless key rollover for authentication. BGP uses TCP authentication, which
    enables the authentication option and sends the Message Authentication Code (MAC) based on the cryptographic algorithm
    configured for the keychain.
  impact: This allows the configuration of routing protocol authentication to be made earier.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/routers/xr12000/software/xr12k_r39/security/configuration/guide/sc39kcm.html
