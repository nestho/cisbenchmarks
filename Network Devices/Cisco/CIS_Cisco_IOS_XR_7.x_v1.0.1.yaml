- id: 1.3.1
  title: Disable CDP
  scoring: manual
  profile:
  - Level 1
  description: Disable Cisco Discovery Protocol (CDP) service at device level.
  rationale: The Cisco Discovery Protocol is a proprietary protocol that Cisco devices use to identify each other on a LAN
    segment. It is useful only in network monitoring and troubleshooting situations but is considered a security risk because
    of the amount of information provided from queries. In addition, there have been published denial-ofservice (DoS) attacks
    that use CDP. CDP should be completely disabled unless necessary.
  impact: To reduce the risk of unauthorized access, organizations should implement a security policy restricting network
    protocols and explicitly require disabling all insecure or unnecessary protocols.
  references:
  - 1. https://www.cisco.com/en/US/docs/ios_xr_sw/iosxr_r3.7/system_management/co
  page_start: 52
  audit_raw: 'Perform the following to determine if CDP is enabled:

