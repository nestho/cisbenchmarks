- id: 1.1.5
  title: Local users, groups and tasks
  scoring: manual
  profile:
  - Level 2
  description: To provide controlled access to the XR and System Admin configurations on the router, user profiles are created
    with assigned privileges. The privileges are specified using command rules and data rules. The authentication, authorization,
    and accounting (aaa) commands are used for the creation of users, groups, command rules, and data rules. The aaa commands
    are also used for changing the disaster-recovery password.
  rationale: IOS-XR has a very strong embedded mechanism to do user authentication and authorization. While XR does not have
    the concept of privilege-levels as what IOS had, the embedded user task group management is extremely strong allow for
    the creation of different task groups.
  impact: 'Default task-groups The following task-groups are predefined in IOS-XR root-system: Root system users root-lr:
    Root logical router users netadmin: Network administrators sysadmin: System administrators operator: Operators performing
    day-to-day activities cisco-support: highest level of privilege allowing lowest level access'
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/iosxr/ncs5000/system-setup/62x/bsystem-setup-cg-ncs5000-62x/b-system-setup-cg-ncs500062x_chapter_0101.html#id_134674
  - 2. https://community.cisco.com/t5/service-providers-knowledge-base/asr9000-xrusing-task-groups-and-understanding-priv-levels-and/ta-p/3109596
  page_start: 41
  audit_raw: "\"show run aaa\" shows all hierarchic configuration on a single line with the hierarchy\nprepended.\nIOSXR#sh\
    \ run aaa\ntaskgroup TASKGROUP\n task read bgp\n!\nusergroup XRGROUP\n taskgroup TASKGROUP\n!\nusername cisco\n group\
    \ root-lr\n group cisco-support\n secret 10\n$6$O51Wr/lUsR6S5r/.$.qUOapiguyRPwNwix3FVwc9APW3WvrhZv84z0F7cM0zxcyCiXwQ45YuX/\n\
    p/jDXb4cS7bTxemvGK73giBtJHoj.\n!\nusername USER1\n group XRGROUP\n secret 10\n$6$cTTjN1rrPqxaBN1.$jq8GqQ.hSwZXb72YxgTCPgm3kZ2MT51FAlXcJDN54l/vY9TNa8Nob6cyY\n\
    tT4vT4Y9wjtH9R7aK3KmUgwjR5pz0\n!"
  remediation: 'The commands below will enable authorizarion for a user.

    IOSXR(config)#taskgroup {task_group} task read {task}

    IOSXR(config)#usergroup {user_group} taskgroup {task_group}

    IOSXR(config)#username {username}

    IOSXR(config-un)#secret {password}

    IOSXR(config-un)#group {user_group}'
  checks:
  - type: sql
    command: show run aaa" shows all hierarchic configuration on a single line with the hierarchy
    severity: medium
    info: "\"show run aaa\" shows all hierarchic configuration on a single line with the hierarchy\nprepended.\nIOSXR#sh run\
      \ aaa\ntaskgroup TASKGROUP\n task read bgp\n!\nusergroup XRGROUP\n taskgroup TASKGROUP\n!\nusername cisco\n group root-lr\n\
      \ group cisco-support\n secret 10\n$6$O51Wr/lUsR6S5r/.$.qUOapiguyRPwNwix3FVwc9APW3WvrhZv84z0F7cM0zxcyCiXwQ45YuX/\np/jDXb4cS7bTxemvGK73giBtJHoj.\n\
      !\nusername USER1\n group XRGROUP\n secre"
- id: 1.2.1
  title: Set the 'hostname'
  scoring: scored
  profile:
  - Level 1
  description: The hostname is used in prompts and default configuration filenames.
  rationale: The domain name is prerequisite for setting up SSH.
