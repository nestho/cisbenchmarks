  rationale: Enabling SNMP read-write enables remote management of the device. Unless absolutely necessary, do not allow simple
    network management protocol (SNMP) write access.
  impact: To reduce the risk of unauthorized access, Organizations should disable the SNMP 'write' access for snmp-server
    community.
  references:
