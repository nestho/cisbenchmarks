- id: 1.1.1.1
  title: TACACS+
  scoring: scored
  profile:
  - Level 2
  description: Cisco IOS XR devices can use the TACACS+ protocol to communicate with a central AAA server. Using a central
    authentication store ensures that all administrative actions are tied to named users, making the tracking of changes much
    easier. It also makes tracking compromised accounts and malicious activities much easier.
  rationale: 'Central authentication is key as it minimizes the effort in managing named user accounts. Keeping local admin
    accounts opens the door to all the issues inherent in shared accounts, namely: • Errors in implementation being done by
    generic admin accounts, which can then be denied by all. • Shared credentials staying unchanged when administrative staff
    leave the organization or change roles. • Giving malicious actors the ability to recover shared credentials from saved
    device backups'
  impact: 'Implementing TACACS+ (or any central authentication solution) ensures that only named users are allowed to gain
    an administrative session to the device. This allows: • Tracking of all changes to named users • Simplification of reconciling
    changes to a change management process • Off-loading password change cycles and password complexity requirements to that
    central authentication store • Simplification of removing admin access as administrators leave the organization or change
    their roles in the organization'
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/asr9k-r75/system-security/configuration/guide/b-system-security-cg-asr900075x/configuring-aaa-services.html
  page_start: 18
  audit_raw: "\"show run aaa\" shows all hierarchic configuration on a single line with the hierarchy\nprepended.\nTwo or\
    \ more TACACS servers must be defined, and they must be referenced by a aaa\ngroup:\nIOSXR#sh run aaa\n!\ntacacs-server\
    \ host 1.1.1.1 port 49\n key 7 070C285F4D06\n!\ntacacs-server host 1.1.1.2 port 49\n key 7 00071A150754\n!\naaa group\
    \ server tacacs+ TAC\n server 1.1.1.1\n server 1.1.1.2"
  remediation: 'For complete instructions how to configure AAA please refer to the configuration guide.

    Below you can find some minimum config snippets to implement a radius or tacacs+

    server group.

    IOSXR(config)#tacacs-server host {tacacs_ip_address} port 49

    IOSXR(config-tacacs-host)#key {tacacs_key}

    IOSXR(config)#aaa group server tacacs+ {tacacs_group_name}

    IOSXR(config-sg-tacacs)#server {tacacs_ip_address}'
  checks:
  - type: sql
    command: show run aaa" shows all hierarchic configuration on a single line with the hierarchy
    severity: medium
    info: "\"show run aaa\" shows all hierarchic configuration on a single line with the hierarchy\nprepended.\nTwo or more\
      \ TACACS servers must be defined, and they must be referenced by a aaa\ngroup:\nIOSXR#sh run aaa\n!\ntacacs-server host\
      \ 1.1.1.1 port 49\n key 7 070C285F4D06\n!\ntacacs-server host 1.1.1.2 port 49\n key 7 00071A150754\n!\naaa group server\
      \ tacacs+ TAC\n server 1.1.1.1\n server 1.1.1.2"
