- id: 1.5.4
  title: Set the ACL for each 'snmp-server community'
  scoring: manual
  profile:
  - Level 1
  description: This feature specifies a list of IP addresses that are allowed to use the community string to gain access to
    the SNMP agent.
  rationale: If ACLs are not applied, then anyone with a valid SNMP community string can potentially monitor and manage the
    router. An ACL should be defined and applied for all SNMP access to limit access to a small number of authorized management
    stations segmented in a trusted management zone. If possible, use SNMPv3 which uses authentication, authorization, and
    data privatization (encryption).
  impact: To reduce the risk of unauthorized access, Organizations should enable access control lists for all snmp-server
    communities and restrict the access to appropriate trusted management zones. If possible, implement SNMPv3 to apply authentication,
