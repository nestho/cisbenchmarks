- id: 1.1.3.1
  title: Configure Authorization
  scoring: scored
  profile:
  - Level 2
  description: Command authorization allows restricting specific users to specific command sets that they can use on the device.
    Command authorization is a complex endeavor and is very rarely implemented. Usually, the TACACS+ protocol is used with
    a central AAA server.
  rationale: Command authorization allows the implementation of fine-grained role-based access control concepts.
  impact: Prevent users from issuing certain commands.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/asr9k-r75/system-security/configuration/guide/b-system-security-cg-asr900075x/configuring-aaa-services.html
  page_start: 30
  audit_raw: 'Check which line template is referenced by the vty-pools

    IOSXR#show run formal | i "vty-pool"

    vty-pool default 0 4 line-template default

    Check the relationship between line template in use and the aaa list:

    IOSXR##show run formal | i "authorization"

    line console authorization commands default

    line default authorization commands default

    Verify an authentication list is defined and optionally references the aaa group that was

    created in the prerequisites:

    IOSXR#show run formal | i "aaa authorization"

    aaa authorization commands default group {tacacs_group} none'
  remediation: 'Currently CIS makes no recommendations how to implement command authorization.

    Roles and access-privileges should be defined in collaboration with your operations and

    security teams.'
  checks:
  - type: sql
    command: show run formal | i "vty-pool"
    severity: medium
    info: 'Check which line template is referenced by the vty-pools

      IOSXR#show run formal | i "vty-pool"

      vty-pool default 0 4 line-template default

      Check the relationship between line template in use and the aaa list:

      IOSXR##show run formal | i "authorization"

      line console authorization commands default

      line default authorization commands default

      Verify an authentication list is defined and optionally refere'
- id: 1.1.4.1
  title: exec accounting
  scoring: scored
  profile:
  - Level 1
  description: The router reports user activity to the TACACS+ or RADIUS security server in the form of accounting records.
    Each accounting record contains accounting AV pairs and is stored on the security server.
  rationale: Authentication, authorization and accounting (AAA) systems provide an authoritative source for managing and monitoring
    access for devices. Centralizing control improves consistency of access control, the services that may be accessed once
    authenticated and accountability by tracking services accessed. Additionally, centralizing access control simplifies and
    reduces administrative costs of account provisioning and deprovisioning, especially when managing a large number of devices.
    AAA Accounting provides a management and audit trail for user and administrative sessions through TACACS+.
  impact: Enabling 'aaa accounting exec' records each new exec session on the router and sends it to the accounting servers
    and enables organizations to monitor and analyze the activity. Command accounting is not supported for commands that are
    executed using Netconf, XML or GRPC.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/asr9k-r75/system-security/configuration/guide/b-system-security-cg-asr900075x/configuring-aaa-services.html
  page_start: 33
  audit_raw: 'Make sure an accounting list is defined and that same list (called ''default'' in the

    example below) is referenced by the line templates.

    IOSXR#show run aaa

    aaa accounting exec default start-stop group {tacacs_group|radius_group}

    line console accounting exec default

    line default accounting exec default

    If not the ''line default'' template is used, make sure the correct line template is

    associated with the vty-pool.'
  remediation: 'Configure an accounting list which for example includes the tacacs+ or radius server

    group, which was defined in the prerequisites or local or both:

    IOSXR(config)#aaa accounting exec default start-stop group

    {tacacs_group|radius_group}

    IOSXR(config)#line console accounting exec default

    IOSXR(config)#line default accounting exec default

    Note: exec accounting doesn''t support the "local" / syslog target.'
  checks:
  - type: sql
    command: show run aaa
    severity: medium
    info: 'Make sure an accounting list is defined and that same list (called ''default'' in the

      example below) is referenced by the line templates.

      IOSXR#show run aaa

      aaa accounting exec default start-stop group {tacacs_group|radius_group}

      line console accounting exec default

      line default accounting exec default

      If not the ''line default'' template is used, make sure the correct line template is

      associated with'
