- id: 1.6.2
  title: Restrict VTY Access
  scoring: manual
  profile:
  - Level 1
  description: VTY access can be restricted via access-lists to limit from which the source addresses a management session
    to the device can be established.
  rationale: VTY ACLs control what addresses may attempt to log in to the router. Configuring VTY lines to use an ACL, restricts
    the sources where a user can manage the device. You should limit the specific host(s) and or network(s) authorized to
    connect to and configure the device, via an approved protocol, to those individuals or systems authorized to administer
    the device. For example, you could limit access to specific hosts, so that only network managers can configure the devices
    only by using specific network management workstations. Make sure you configure all VTY lines to use the same ACL.
  impact: You can potentially lock yourself out, we recommend using commit confirmed when implementing the changes. Using
    VTY lines without access-lists opens up the attack surface because any source IP can establish a connection to the device.
    This could be exploited by an attacker to create DoS condition.
  references: []
  page_start: 92
  audit_raw: 'Check the vty pools in use:

    show run formal | i vty-pool

    vty-pool default 0 4 line-template default

    line-template is "default", multiple vty-pools might exist, check each.

    check the corresponding line template:

    show run formal | i "line default access"

    line default access-class ingress {ssh_access-list}

    Check if ACLs are applied to SSH server:

    show run formal | i "ssh.*access"

    ssh server vrf default ipv4 access-list {ssh_access-list}

    Audit fails if access- is not in any of the outputs.'
  remediation: "Define ACLs which match the allowed sources. To restrict access of incoming or\noutgoing connections over\
    \ IPv4 and IPv6, the IPv4 access list and IPv6 access list must\nshare the same name:\nipv4 access-list ACL-VTY-IN\n 10\
    \ permit ipv4 192.168.1.0/24 any\n 1000 deny ipv4 any any log icmp-off\nipv6 access-list ACL-VTY-IN\n 10 permit ipv6 2001:db8::/64\
    \ any\n 1000 deny any any log icmp-off\nApply the ACL on the line template:\nvty-pool default 0 4 line-template default\n\
    line default\n access-class ingress ACL-VTY-IN\nAlternatively you can implement restrictions on the SSH Server which allows\
    \ both IPv4\nand IPv6. Note that SSH could be also used for Netconf, so the ACL might need to\ninclude additional sources\
    \ which do not apply for VTY access only.\nssh server ipv4 access-list ACL-VTY-IN ipv6 access-list ACL-VTY-IN"
  checks:
  - type: sql
    command: show run formal | i vty-pool
    severity: medium
    info: 'Check the vty pools in use:

      show run formal | i vty-pool

      vty-pool default 0 4 line-template default

      line-template is "default", multiple vty-pools might exist, check each.

      check the corresponding line template:

      show run formal | i "line default access"

      line default access-class ingress {ssh_access-list}

      Check if ACLs are applied to SSH server:

      show run formal | i "ssh.*access"

      ssh server vrf defau'
- id: 1.6.3
  title: Ensure Exec Timeout for Console Sessions is set
  scoring: scored
  profile:
  - Level 1
  description: 'Verify device is configured to automatically disconnect console sessions after a defined maximum session time,
    set in minutes. Note there are 3 different timeout values: • absolute-timeout: terminate the connection after the specified
    time has elapsed, regardless of whether the connection is being used at the time of termination. • exec-timeout: If no
    user input is detected during the interval, the EXEC facility returns the terminal to the idle state and disconnects the
    incoming session • session-timeout: Traditionally the VTY can be used for other features than EXEC (CLI), e.g. terminal
    server, PAD, async lines etc. The session-timeout applies to any sessions running to/through the router on VTY. Use the
    session-timeout command to set the interval that the Cisco IOS XR software waits for traffic before closing the connection
    to a remote device and returning the terminal to an idle state. For management access we need to configure the exec-timeout.'
  rationale: This prevents unauthorized users from misusing abandoned sessions. For example, if the network administrator
    disconnects leaving a console session open, that session will remain open (in the same state and privilege level) for
    the next person who connects a console cable to the device. A shorter timeout is usually desired, but this can be extended
    for longer-running operations such as debug sessions or software upgrades.
  impact: 10 minutes is the default exec-timeout for many Cisco Network Operating systems. You should determine the best value
    for your organization and your work habits.
  references:
  - 1. https://www.cisco.com/en/US/docs/ios_xr_sw/iosxr_r3.7/system_management/co
  page_start: 94
  audit_raw: 'Check if the exec timeout on the console is configured:

    show run formal | i "console exec"

    line console exec-timeout 10 0

    Audit fails if value is not in accordance with your organization standards.

    If not configured, the default value of 10 minutes applies.'
  remediation: "vty-pool default 0 4 line-template default\nline default\n exec-timeout 10 0"
  checks:
  - type: sql
    command: show run formal | i "console exec"
    severity: medium
    info: 'Check if the exec timeout on the console is configured:

      show run formal | i "console exec"

      line console exec-timeout 10 0

      Audit fails if value is not in accordance with your organization standards.

      If not configured, the default value of 10 minutes applies.'
- id: 1.7.1
  title: Pre-authentication Banner
  scoring: scored
  profile:
  - Level 1
  description: A pre-authentication banner is displayed when a terminal connects, before a login occurs. This banner is useful
    for sending messages that affect all users (such as impending system shutdowns). This banner can also be used to notify
    unauthorized users of any penalties to accessing the device, or any logging that may be configured.
  rationale: 'Network banners are electronic messages that provide notice of legal rights to users of computer networks. From
    a legal standpoint, banners have following primary functions. • Banners may be used to generate consent to real-time monitoring
    under ECPA Title III. • Banners may be used to generate consent to the retrieval of stored files and records pursuant
    to ECPA. • in the case of government networks, banners may eliminate any Fourth Amendment "reasonable expectation of privacy"
    that government employees or other users might otherwise retain in their use of the government''s network under O''Connor
    v. Ortega, 480 U.S. 709 (1987). • In the case of a non-government network, banners may establish a system administrator''s
    "common authority" to consent to a law enforcement search pursuant to United States v. Matlock, 415 U.S. 164 (1974)."
    (US Department of Justice APPENDIX A: Sample Network Banner Language) In your country different laws might apply. Please
    consult with your corporate legal team to assess the exact legal context and rules for banners.'
  impact: Organizations provide appropriate legal notice(s) and warning(s) to persons accessing their networks by using a
    'banner-text'.
  references: []
  page_start: 97
  audit_raw: 'Show the running configuration banners:

    IOSXR#show run banner

    If the command does not return a result, the banner is not enabled.'
  remediation: 'Configure a login banner as shown below. The delimiter character shown is a "^", but

    any character can serve as a delimiter.

    IOSXR(config)# banner login ^ {login_banner} ^'
  checks:
  - type: sql
    command: 'Show the running configuration banners:'
    severity: medium
    info: 'Show the running configuration banners:

      IOSXR#show run banner

      If the command does not return a result, the banner is not enabled.'
- id: 1.7.2
  title: Post-authentication Banner
  scoring: scored
  profile:
  - Level 1
  description: 'A post-authentication banner is displayed to the user after a successful login. It can also serve as a legal
    notice to authorized users of the equipment to notify them of any logging that may be configured. This banner is not appropriate
    to notify unauthorized users of any penalties to accessing the device, because after successful login corresponding laws
    might have already been violated. A post-authentication banner can often also hold asset-specific information, such as:
    • The primary technical contacts for the equipment • Location or environment information - for instance the street address
    or rack number or production / test / lab environment • The purchase date • The asset tag information for the device •
    Any upstream circuit numbers • Carrier or ISP support phone numbers • Any other asset-specific information that may be
    important to the organization'
  rationale: Post-authentication banners can be used to reduce the risk of human error. For example by highlighting the current
    environment (Production or Lab).
  impact: Organizations provide appropriate notice(s) and warning(s) to persons accessing their networks by using a 'banner-text'.
  references: []
  page_start: 99
  audit_raw: 'Show the running configuration with a "b" filter to "begin" the listing at the found string

    IOSXR#show run banner

    If the command does not return a result, the banner is not enabled.'
  remediation: 'Configure an exec banner as shown below. The delimiter character shown is a "^", but

    any character can serve as a delimiter.

    IOSXR(config)# banner exec ^ {exec_banner} ^'
  checks:
  - type: sql
    command: Show the running configuration with a "b" filter to "begin" the listing at the found string
    severity: medium
    info: 'Show the running configuration with a "b" filter to "begin" the listing at the found string

      IOSXR#show run banner

      If the command does not return a result, the banner is not enabled.'
- id: 1.8.1
  title: Enable AES Password Encryption
  scoring: manual
  profile:
  - Level 2
  description: You can enable strong, reversible 128-bit Advanced Encryption Standard (AES) password encryption, also known
    as type-6 encryption. To start using type-6 encryption, you must enable the AES password encryption feature and configure
    a master encryption key, which is used to encrypt and decrypt passwords. After you enable AES password encryption and
    configure a master key, all existing and newly created cleartext passwords for supported applications are stored in type-6
    encrypted format
  rationale: Encryption of passwords is used to protect it from being sent over the wire cleartext or being accidentally exposed
    when sharing device configurations with third parties. By applying encryption you are making it more difficult for an
    adversary to gain access to your device/network.
  impact: Make sure to store your master in a secure place and test your emergency backup/restore procedures. Without the
    masterkey all passwords of supported type6 applications will need to be re-entered manually upon config restore from backup.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/asr9k-r79/system-security/configuration/guide/b-system-security-cg-asr900079x/implementing-type-6-password-encryption.html
  page_start: 102
  audit_raw: 'Just verifying the running configuration might not be sufficient because it could be that

    no masterkey has been set.

    IOSXR# show run formal | i password6

    password6 encryption aes

    Use the following show command to see if encryption is enabled and functional. Only

    when all three status are "Enabled" the feature is fully working.

    IOSXR#show type6 server

    Server detail information:

    =============================================

    AES config State : Enabled

    Masterkey config State : Enabled

    Type6 feature State : Enabled

    Master key Inprogress : No

    Verify Type 6 trace server details.'
  remediation: 'Define a password encryption key

    IOSXR#key config-key password-encryption

    New password Requirements: Min-length 6, Max-length 64

    Characters restricted to [A-Z][a-z][0-9]

    Enter new key :

    Enter confirm key :

    Master key operation is started in background

    Enable aes config password encryption

    /* Enable Type 6 password encryption */

    IOSXR# configure

    IOSXR(config)#password6 encryption aes

    IOSXR(config)#commit'
  checks:
  - type: sql
    command: show run formal | i password6
    severity: medium
    info: 'Just verifying the running configuration might not be sufficient because it could be that

      no masterkey has been set.

      IOSXR# show run formal | i password6

      password6 encryption aes

      Use the following show command to see if encryption is enabled and functional. Only

      when all three status are "Enabled" the feature is fully working.

      IOSXR#show type6 server

      Server detail information:

      ===================='
- id: 1.8.2
  title: Set username secret for all local users
  scoring: manual
  profile:
  - Level 1
  description: A root-system user with a normal password will not be authenticated because the normal password is two-way
    encrypted and poses a security risk because the password information is stored in the flash disk, which can be easily
    decrypted. Secrets are oneway encrypted and cannot be easily reverted without brute-forcing. If both secret and password
    are configured for a user, then secret takes precedence, and password security policy does not have any effect on authentication
    or change of password for such users.
  rationale: Secrets use a one-way cryptographic hash.
  impact: Typically the username and secret are defined during initial setup. Make sure to use strong passwords or update
    it later accordingly.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/asr9k-r65/system-security/configuration/guide/b-system-security-cg-asr9000-65x/bsystem-security-cg-asr9000-71x_chapter_010.html#concept_js2_ll3_jmb
  page_start: 104
  audit_raw: "The following command is used to show all local users:\nIOSXR# show run username\nusername {local_username}\n\
    \ group root-lr\n group cisco-support\n secret {local_password}"
  remediation: 'IOSXR# configure

    IOSXR(config)#username {local_username}

    IOSXR(config)#secret {local_password}

    commit'
  checks:
  - type: sql
    command: 'show all local users:'
    severity: medium
    info: "The following command is used to show all local users:\nIOSXR# show run username\nusername {local_username}\n group\
      \ root-lr\n group cisco-support\n secret {local_password}"
- id: 1.8.3
  title: Configure a Password Policy
  scoring: manual
  profile:
  - Level 2
  description: Because passwords are stored only in revertible type 7 format, please consider not applying this recommendation
    and using secrets instead. This only applies if you absolutely need to configure "password" instead of "secret" for local
    users. Cisco IOS XR Software introduces advanced AAA password strengthening policy and security mechanism to store, retrieve
    and provide rules or policy to specify user passwords. This password policy is applicable only for local users, and not
    for remote users whose profile information are stored in a third party AAA server.
  rationale: Strong passwords are important because they help prevent unauthorized access to devices and the network. Even
    if a central authentication source is used, if that service is not available the fall-back authentication is often to
    local credentials. At least one local administrator user must be present on the device.
  impact: This policy is not applicable to secrets of the user. If both secret and password are configured for a user, then
    secret takes precedence, and password security policy does not have any effect on authentication or change of password
    for such users.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/routers/asr9000/software/asr9k-r65/system-security/configuration/guide/b-system-security-cg-asr9000-65x/bsystem-security-cg-asr9000-71x_chapter_010.html
  page_start: 106
  audit_raw: "IOSXR#sh run aaa\naaa password-policy {password_policy}\n lifetime months 3\n max-length 25\n min-length 18\n\
    \ lockout-time days 1\n min-char-change 5\n authen-max-attempts 3\n!\nusername {local_username}\n group root-lr\n group\
    \ cisco-support\n secret {local_password}\nThe policy is only in effect when it is also applied under a \"username\" section."
  remediation: 'Use the following configuration to enable a password policy. Choose values according

    to established guidelines of your organization.

    IOSXR# configure

    IOSXR(config)#aaa password-policy {password_policy}

    IOSXR(config-aaa)#min-length 8

    IOSXR(config-aaa)#max-length 25

    IOSXR(config-aaa)#lifetime months 3

    IOSXR(config-aaa)#min-char-change 5

    IOSXR(config-aaa)#authen-max-attempts 3

    IOSXR(config-aaa)#lockout-time days 1

    IOSXR(config)#username {local_username} password-policy {password_policy}

    password 0 {local_password}

    IOSXR(config)#commit'
  checks:
  - type: manual_review
    info: "IOSXR#sh run aaa\naaa password-policy {password_policy}\n lifetime months 3\n max-length 25\n min-length 18\n lockout-time\
      \ days 1\n min-char-change 5\n authen-max-attempts 3\n!\nusername {local_username}\n group root-lr\n group cisco-support\n\
      \ secret {local_password}\nThe policy is only in effect when it is also applied under a \"username\" section."
    severity: medium
- id: '1.9'
  title: Management plane protection
  scoring: scored
  profile:
  - Level 2
  description: The Management Plane Protection (MPP) feature provides the capability to restrict the interfaces on which network
    management packets are allowed to enter a device. The MPP feature allows a network operator to designate one or more router
    interfaces as management interfaces. The MPP protection feature, as well as all the management protocols under MPP, are
    disabled by default. When you configure an interface as either out-of-band or inband, it automatically enables MPP. Consequently,
    this enablement extends to all the protocols under MPP. If MPP is disabled and a protocol is activated, all interfaces
    can pass traffic. When MPP is enabled with an activated protocol, the only default management interfaces allowing management
    traffic are the route processor (RP) and standby route processor (SRP) Ethernet interfaces. You must manually configure
    any other interface for which you want to enable MPP as a management interface.
  rationale: This is part of the MPP setup.
  impact: 'The following restrictions are listed for implementing Management Plane Protection (MPP): Currently, MPP does not
    keep track of the denied or dropped protocol requests. MPP configuration does not enable the protocol services. MPP is
    responsible only for making the services available on different interfaces. The protocols are enabled explicitly. Management
    requests that are received on inband interfaces are not necessarily acknowledged there. Both Route Processor (RP) and
    distributed route processor (DRP) Ethernet interfaces are by default out-of-band interfaces and can be configured under
    MPP. The changes made for the MPP configuration do not affect the active sessions that are established before the changes.
    Currently, MPP controls only the incoming management requests for protocols, such as TFTP, Telnet, Simple Network Management
    Protocol (SNMP), Secure Shell (SSH), XML , HTTP and Netconf. MPP does not support MIB.'
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/routers/crs/software/crs_r53/security/configuration/guide/b-syssec-cg53x-crs/b-syssec-cg53xcrs_chapter_0110.html
  - 2.1 Routing protocols
  - 2.1.1 EIGRP
  page_start: 108
  audit_raw: "Verify the appropriate management plane protection configuration.\nIOSXR#sh run control-plane\nWed Jul 19 23:25:11.297\
