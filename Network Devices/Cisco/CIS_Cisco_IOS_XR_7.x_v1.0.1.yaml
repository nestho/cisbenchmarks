    ...

    line default transport input ssh

    Check if line default transport input ssh or line default transport input

    none is present.'
  remediation: "It's recommended to restrict VTYs to SSH for management access and not allow this\ndevice to SSH to other\
    \ devices:\nvty-pool default 0 4 line-template default\nline default\n transport input ssh\n transport output none"
  checks:
