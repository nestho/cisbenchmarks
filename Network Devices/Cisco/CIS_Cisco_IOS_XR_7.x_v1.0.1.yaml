- id: 1.6.1
  title: Disable Telnet Access
  scoring: scored
  profile:
  - Level 1
  description: Telnet is a clear-text administrative protocol. As such, both the credentials used to establish the session
    and all commands and data within the session are readable in clear-text, so can be intercepted or modified by an attacker
  rationale: Telnet doesn't natively support encryption or message integrity checks. Hence, any transmitted information (including
    credentials) is exposed to an attacker that gains access to the communication. Furthermore communication could be intercepted
    and modified by a man-in-the-middle attacker.
  impact: Ensure you have already configured an alternative management access to the device before disabling telnet access.
    Otherwise you might be locked out of the device with no management access.
  references: []
  page_start: 90
  audit_raw: 'Check the vty pools in use:

