    and stores them in files or prints them according to a simple configuration file. This form of logging is best because
    it can provide protected long-term storage for logs (the devices internal logging buffer has limited capacity to store
    events.) In addition, logging to an external system is highly recommended or required by most security standards. If desired
    or required by policy, law and/or regulation, enable a second syslog server for redundancy.
