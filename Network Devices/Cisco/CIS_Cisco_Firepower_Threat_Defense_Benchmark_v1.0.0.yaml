- id: 2.1.7
  title: Access Policy - URL Filtering
  scoring: manual
  profile:
  - Level 1
  description: Firepower allows restriction of sites by category and reputation. For instance, allowing "hacking" sites of
    good reputation only would likely permit information security blogs and tools, but block sites that post pirated software
    or key generation tools. Permitting social media sites of good reputation only would permit mainstream sites such as LinkedIn,
    Facebook, Instagram or Twitter, but would block social media sites that have more extremist content.
  rationale: 'Site categories can be blocked for many reasons. In most organizations, these can be divided into "Human Resources"
    and "IT" reasons. The first category will include things like sites that by their nature are outright illegal to access
    in the workplace, as well as sites that violate community standards within the organization. The "community standards"
    list will of course vary between organizations, so this list is of course somewhat fluid, and should be set by a written
    policy within your organization before implementation. Site Categories often blocked for "Human Resources" Reasons: •
    Pornography • Adult • Cheating and Plagarism • Dating • Gambling • Lotteries • Hate Speech • Illegal Activities • Illegal
    Downloads • Illegal Drugs • Child Abuse Content • Terrorism and Violent Extremism • Extreme • Ebanking Fraud Less commonly
    in recent times, some organizations have policies that block social media, games and recreation sites for "productivity"
    reasons. At the other end of the spectrum, there are site categories that allow blocking of sites that seek to infect
    or compromise hosts, supply malware or tools that might not be desired in the organization, or facilitate avoidance of
    acceptable use policies within the organization. Site Categories that are blocked for these "IT Reasons" can often include:
    • Spam • Peer File Transfer • Spyware and Adware • Botnets • Hacking • Open HTTP Proxy • Parked Domains • Filter Avoidance
    • Cryptojacking • Cryptomining • Domain Generated Algorithm • Malware Sites • Malicious Sites • Personal VPN'
  impact: Not having a written policy that governs internet access by category in your organization means that any enforcement
    doesn't have an "legs to stand on" - without a written policy that is approved by Sr Management effective enforcement
    simply is not possible. Not blocking sites for the various "HR Reasons" exposes the organization to legal action due to
    access of illegal content. Not blocking sites that fall into the "community standards" category exposes the organization
    to HR complaints around workplace standards and appropriate behaviour. At the other end of the spectrum, not blocking
    the various "IT Reasons" sites exposes the organization's servers and workstations to actual malicious activity. Sites
    in these categories seek to infect or compromise hosts, download or otherwise supply supply malware, or facilitate avoidance
    of acceptable use policies within the organization. In addition, sites that host legitimate security tools might need
    to be restricted to specific, authorized groups in many organizations.
  references: []
  page_start: 119
  audit_raw: '• Verify that a written policy is in place to restrict access to internet sites by

    category.

    • Navigate to Policies > Access Control.

    • Edit the Access Control Policy

    • Verify that one or more "block by category" rules exist, and ensure that they

    provide complete coverage (and no more) when compared to the written policy.'
  remediation: '• Verify that a written policy is in place to restrict access to internet sites by

    category.

    • Navigate to Policies > Access Control.

    • Edit the Access Control Policy

    • Create one or more "block by category" rules, with blocked categories in

    compliance with the written policy.'
  checks:
