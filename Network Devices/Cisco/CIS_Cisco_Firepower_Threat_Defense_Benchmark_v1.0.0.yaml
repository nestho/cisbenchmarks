- id: 1.4.2.3
  title: Monitor for Clock Drift within the Firepower Infrastructure
  scoring: scored
  profile:
  - Level 1
  description: This setting generates an alert if any of the various times in the Firepower infrastructure do not agree with
    each other.
  rationale: Setting a reliable time source is critical for all security operations. A reliable time sync ensures that logs
    from disparate sources reflect the correct sequence of events, whether investigating from the point of view of a single
    device (and single log) or when consolidating logs for a more complete picture and event timeline. This setting looks
    for and logs clock differences between the various Firepower components in the infrastructure.
  impact: Having one or more security devices with different times can make investigating events or using the resulting logs
    for operational purposes more difficult or even impossible.
  references: []
