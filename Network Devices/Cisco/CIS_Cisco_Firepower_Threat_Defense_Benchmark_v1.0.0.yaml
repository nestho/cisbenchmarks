- id: 2.1.2
  title: Create an outbound SSL Policy
  scoring: manual
  profile:
  - Level 1
  description: As time moves forward, we see more and more traffic that was previously in clear text now being implemented
    with encryption. This makes inspecting that traffic for malicious activity more and more complex. Decrypting traffic for
    inspection makes that process much easier, however, privacy and legal factors should be considered before implementing
    such as process. Decryption is governed by the "SSL Policy". In addition to site categories or individual sites, rules
    within that policy can be assigned by user accounts, workstation names, subnets or applications as in most other Firepower
    policies.
  rationale: 'Standard HTTPS traffic is a good target for decryption, as configuring Firepower to decrypt, inspect then re-encrypt
    traffic is fairly straightforward. In most cases, the following site categories should not be decrypted: • Finance • Government
    and Law • Health and Medicine Essentially, any site that might be subject to Privacy legislation should not be decrypted.'
  impact: This function involves configuring the FirePower system with a Certificate Authority (CA) that is trusted in your
    organization. This means that workstations within your organization will need that CA Certificate in their list of trusted
    Certificate Authorities. What this means is that only managed workstations can effectively have their traffic decrypted.
    "Guest" workstations that are not centrally managed (which includes personal cell phones in many organizations) will not
    have the correct CA Certificate list, so cannot be subject to a decryption policy.
  references: []
  page_start: 109
  audit_raw: '• Verify that you have a written policy that permits decryption that has been

    communicated to the people that are affected by that policy.

