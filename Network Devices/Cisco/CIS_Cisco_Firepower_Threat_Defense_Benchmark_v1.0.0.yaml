- id: '1.6'
  title: Database Settings 1.6.1 Set Database Retention Policies
  scoring: manual
  profile:
  - Level 1
  description: The various databases within Firepower are set to maximum values of events rather than time periods, with an
    overall maximum count. These values vary by model (see the "defaults" section in this recommendation)
  rationale: These database retention values often need adjustment, to prevent one database (often the Connection Database
    from filling up prematurely, while other databases (such as the Intrusion or Malware Databases) remain empty or nearly
    so.
  impact: This adjustment of database limits is quite often specific to each organization. Care should be taken that while
    the Intrusion or Malware databases are often reduced in size, that they won't reach an "overflow" condition in the event
    of an actual Intrusion or Malware event.
  references:
  - 1. https://www.cisco.com/c/en/us/products/collateral/security/firesight-managementcenter/datasheet-c78-736775.html
  - 2. https://<FMCAddress>/help_files/index.html#!r_database_event_limits.html
  page_start: 100
  audit_raw: 'System > Configuration > Database

    Verify that the settings are appropriate to your environment and event volumes'
  remediation: 'System > Configuration > Database

    These values are often set to values that don''t reflect day-to-day working environments

    for many organizations.

    In many environments, these settings can be adjusted down as these event volumes

    are usually lower:

    • Health Event Database

    • Audit Event Database

    • White List Violation History Database

    • Remediation Status Event Database

    If no VPN is configured (such as in a FirePower Services installation) then that

    database is not needed at all. Similarly, if a feature is not licensed (for instance the

    Malware license, which uses the Malware and File databases), those databases can be

    reduced or zero''d out (note that the minimum value for the Malware Events Database is

    10,000, even in the absence of a license)

    In a storage constrained setting (such as when using the Virtual FMC), these settings

    can often also be considered for reduction:

    • Intrusion Event Database

    • Malware Event Database

    After reductions are completed, the Connection Database and Connection Summary

    Database will often be increased.

    The goal is usually to have each event Database hold roughly the same time-period of

    events. In most environments, it is desired to have a longer retention of "catastrophic"

    events such as those stored in the Intrusion or Malware databases than "operational"

    events such as those in the Connection database. However, the Connection database

    is the one most often referenced to troubleshoot rule issues or monitor behaviours, so in

    most environments at least 1-4 weeks is desired in that database.

    This makes for an interesting "tightrope" of configurations that can take an extended

    period of time to optimize for many organizations.'
  checks:
  - type: manual_review
    info: 'System > Configuration > Database

      Verify that the settings are appropriate to your environment and event volumes'
    severity: medium
