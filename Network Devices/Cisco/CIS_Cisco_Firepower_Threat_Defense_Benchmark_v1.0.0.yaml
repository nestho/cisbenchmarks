    severity: medium
- id: 1.4.1
  title: Health Policy 1.4.1.1 Create a Health Policy for your FMC Server
  scoring: scored
  profile:
  - Level 1
  description: The Health Policy defines various settings indicating the overall health and resource utilization of the FMC
    Server and the Firepower Appliances.
  rationale: The defaults are sufficient for many environments, but should be reviewed. In many environments it might be desired
    to lower some thresholds. The ISE monitor is disabled by default, given that the User Agent method of correlating user
    accounts to IP addresses is retired in version 7, this setting should definitely be adjusted if the ISE or ISE/PIC service
    is in use.
  impact: ''
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/security/firepower/650/configuration/guide/
  page_start: 67
