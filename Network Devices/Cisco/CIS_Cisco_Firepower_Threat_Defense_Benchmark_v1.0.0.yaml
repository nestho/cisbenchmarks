    - Verify that your created Syslog server is set as a target

    - Verify email and SNMP alert destinations as appropriate to your

    organization

    - Verify that "Syslog" is set for all Alerts

    - Verify that email and SNMP notifications for each as appropriate for your

    organization

    Next, navigate to Policies > Actions > Alerts > Discover Event Alerts

    - Verify that your created Syslog server is set as a target

    - Verify email and SNMP alert destinations as appropriate to your

    organization

    - Verify that "Syslog" is set for all Alerts

    - Verify that email and SNMP notifications for each as appropriate for your

    organization

    Next, navigate to Policies > Actions > Alerts > Advanced Malware Protection

    Alerts

    - Verify that your created Syslog server is set as a target

    - Verify email and SNMP alert destinations as appropriate to your

    organization

    - Verify that "Syslog" is set for all Alerts

    - Verify that email and SNMP notifications for each as appropriate for your

    organization'
