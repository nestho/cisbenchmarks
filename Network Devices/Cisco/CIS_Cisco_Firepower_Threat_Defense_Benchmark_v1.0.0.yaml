- id: 1.4.2.6
  title: Configure Audit Logging to be Sent to Syslog
  scoring: scored
  profile:
  - Level 1
  description: Audit Logging logs the details of all configuration changes.
  rationale: Logging configuration changes facilitates troubleshooting of any resulting issues that might happen post change.
    From a security perspective, if a configuration change should result in a security exposure or event, the audit log will
    help define the time window of the exposure or event, as well as the party responsible for the change (if RBAC is configured,
    see Recommendation 1.1.3.1) In addition, sending the Audit Log to a central Syslog server allows Firepower changes to
    be reconciled to the Change Control Procedure, especially if a SIEM and appropriate event ticketing is configured.
  impact: Without audit logging enabled, the configuration cannot be "back-tracked" to define when any configuration issues
    might have been made. This may make defining the start and end of a security exposure either much less reliable (if only
    manual tracking is available) or impossible (if the change was made outside of the change control procedure)
  references: []
