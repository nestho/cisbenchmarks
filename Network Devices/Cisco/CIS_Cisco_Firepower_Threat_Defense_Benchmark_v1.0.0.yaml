- id: 1.3.3
  title: Update of URL Filtering Database
  scoring: scored
  profile:
  - Level 1
  description: The URL Filtering database should be automatically downloaded and deployed at a reasonable cadence, at a minimum
    daily.
  rationale: The categorization of websites of course lags behind the deployment of new sites. In addition, malicious sites
    often see changes in site names happen at an accelerated rate (fast flux DNS), to avoid being categorized as malicious.
    Another source of change is the end-users and administrators of deployed Firepower systems, who have the option of sending
    database corrections to Cisco directly. Finally, periodically content categories are updated. For instance, in January
    2021 15 new categories were added, many of which have proven useful in filtering or controlling access to various malicious
    or undesirable sites, All of these reasons mean that keeping the URL database up to date is extremely important, the more
    out of date this database is, the less meaningful rules and detections based on it are.
  impact: ''
  references: []
  page_start: 59
  audit_raw: 'Navigate to System (Gear Icon) > Scheduling

    Verify that there is a job scheduled at least daily to update the URL Database.

    In the lower half of the screen, verify that the URL Database update job is running

    successfully, and that the cadence matches the desired frequency of updates.'
  remediation: 'Navigate to System (Gear Icon) > Scheduling

    Choose "Add Task"

    For "Job Type", select "Update URL Filtering Database"

    Choose Recurring, with a cadence of one daily or less. It may be desirable

    to update this database more frequently.

    Set the scheduled time to match your organizations policies.

    Give the job a descriptive name.

    Choose "Save"'
  checks:
  - type: manual_review
    info: 'Navigate to System (Gear Icon) > Scheduling

      Verify that there is a job scheduled at least daily to update the URL Database.

      In the lower half of the screen, verify that the URL Database update job is running

      successfully, and that the cadence matches the desired frequency of updates.'
    severity: medium
- id: 1.3.4
  title: Regularly update the FMC Server Version
  scoring: manual
  profile:
  - Level 1
  description: The Firepower Infrastructure OS Components are updated frequently by Cisco. It is recommended that the version
    of the FMC Server be checked monthly at a minimum, and updated if recommended.
  rationale: ''
  impact: Not updating the FMC server not only makes it less effective in preventing undesired traffic, it also means that
    bugs that may lead to a system compromise are not addressed. It is routine in today's world that as patches are released,
    malicious actors will reverseengineer those patches to try to deduce the bugs and other issues that are addressed, then
    create exploits based on those findings. In addition, if the bugs were found by researchers outside of the vendor team,
    it is common that at some point after updates or fixes are released that they will post their research, often with proof-of-concept
    code, which can be then used by malicious actors to write more robust exploits.
  references: []
  page_start: 61
  audit_raw: 'Navigate to Overview > Dashboard > Status

    Verify that the software version is at the desired level'
  remediation: 'Before updating, it is recommended that the release notes for the target version are

    reviewed to assess any potential new issues that may be introduced, or any new

    functions or behavior changes that need to be accounted for. The release notes will also

    often have update time estimates, which can help in appropriately scheduling

    maintenance windows.

    It is also recommended that a formal testing procedure be written for Firepower, and

    that this procedure is executed after each update to ensure full functionality post

    update.

    To update FMC:

    - Navigate to System (Gear Icon) > Updates > Product Updates

    - If needed, upload the required FMC Update to the update list

    - Choose "Deploy" on the required update

    - Select the FMC Server that is the target of the update

    - Choose "Launch Readiness Check". Note that this can take an extended

    period of time.

    - If this completes successfully, Choose "Install". Note that this can take

    an extended period of time, and will frequently take the FMC Server out of

    service and/or reboot the server. It is recommended that this only be done

    in a scheduled maintenance window.

    - Execute your testing procedure to ensure that there are no functional

    changes that will affect the people or clients that use systems that are

    protected by your FMC installation.'
  checks:
  - type: manual_review
    info: 'Navigate to Overview > Dashboard > Status

      Verify that the software version is at the desired level'
    severity: medium
- id: 1.3.5
  title: Regularly update the Firepower Sensors
  scoring: scored
  profile:
  - Level 1
  description: The Firepower Infrastructure OS Components are updated frequently by Cisco. It is recommended that the version
    of the Firepower Sensors be checked monthly at a minimum, and updated if recommended. In most cases it is recommended
    that the Firepower Sensors be kept at the same version as the FMC Server. Because of the duration of the update process
    however, it is common to see the sensors "lag" slightly behind the FMC Server due to constraints in scheduling maintenance
    windows.
  rationale: ''
  impact: Not updating the Firepower Sensors not only makes them less effective in preventing undesired traffic, it also means
    that bugs that may lead to a system compromise are not addressed. It is routine in today's world that as patches are released,
    malicious actors will reverseengineer those patches to try to deduce the bugs and other issues that are addressed, then
    create exploits based on those findings. In addition, if the bugs were found by researchers outside of the vendor team,
    it is common that at some point after updates or fixes are released that they will post their research, often with proof-of-concept
    code, which can be then used by malicious actors to write more robust exploits.
  references: []
  page_start: 63
  audit_raw: '- Navigate to Devices > Device Management

    - Verify that the version of each sensor is at the desired level, and that

    all sensors are at a consistent version

    - Unless a different version is in use on one or more sensors for a

    documented reason (for instance, a new version is being tested or the update

    process is in progress but not complete), it is recommended that all sensors

    run the same version, and that this version matches the FMC Server version'
  remediation: 'Before updating, it is recommended that the release notes for the target version are

    reviewed to assess any potential new issues that may be introduced, or any new

    functions or behavior changes that need to be accounted for. The release notes will also

    often have update time estimates, which can help in appropriately scheduling

    maintenance windows.

    It is also recommended that a formal testing procedure be written for Firepower, and

    that this procedure is executed after each update to ensure full functionality post

    update.

    To update a Firepower sensor:

    - Navigate to System (Gear Icon) > Updates > Product Updates

    - If needed, upload the required Sensor Update to the update list

    - Choose "Deploy" on the required update

    - Select the Sensor (or Sensors if multiple devices are being updated at

    once) that is/are the target of the update

    - Choose "Launch Readiness Check". Note that this can take an extended period

    of time.

    - If this completes successfully, Choose "Install". Note that this can take

    an extended period of time, and will frequently take the Firepower Sensor(s)

    out of service and/or reboot the sensor.

    - Updating Firepower Sensors will almost always interrupt service, which

    means that it is recommended that this only be done in a scheduled

    maintenance window.

    - If redundant sensors are deployed, usually only one sensor in a pair will

    be updated at once to eliminate the service outage aspect of the update.

    - Execute your testing procedure to ensure that there are no functional

    changes that will affect the people or clients that use systems that are

    protected by your Firepower installation.'
  checks:
  - type: manual_review
    info: '- Navigate to Devices > Device Management

      - Verify that the version of each sensor is at the desired level, and that

