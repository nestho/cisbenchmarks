- id: 1.4.2
  title: Platform Logging and Time 1.4.2.1 Configure Central Logging for FMC
  scoring: scored
  profile:
  - Level 1
  description: Syslog allows for central logging in almost every environment in a format that almost all logging infrastructure
    can consume. In higher security environments, SNMPv3 Traps should be used (see Recommendations in Section 1.4.3)
  rationale: 'Central logging is critical in almost every environment. Central logging facilitates: • detecting security events
    • Incident response to security events • detection of operational events and problems • detection of trends in the environment,
    especially if a SIEM is one of the logging destinations Syslog is the lower security protocol for central logging. Syslog
    is unencrypted, so if in use that fact should influence the network architecture, as the path from a syslog sender to
    the syslog server should be protected from unauthorized access. SNMPv3 Traps allow for encryption of log messages, so
    is recommended in higher security environments (see Recommendations in Section 1.4.3)'
  impact: Without central logging, the only logs available in Firepower are those in the FMC "Analysis" section. Log retention
    of these logs is limited, usually to a short period depending on log volumes (under System > Configuration > Database),
    so log retention for longer periods depends on central logging. Logs in the "Analysis" section do not contain FMC specific
    events, such as high CPU or Memory utilization or other critical operational events. In addition, combining Firepower
    logs with logs of other devices is only practical in a central logging situation. Finally, if a SIEM or log keyword alerting
    is used to identify security incidents in the organization, then Firepower logs must be sent to that logging destination,
    or any indicators detected by Firepower will not be relayed to the SIEM.
  references: []
  page_start: 77
  audit_raw: 'First, verify a Syslog Alert Configuration:

    - Navigate to Policies > Actions > Alerts > Alerts

    - Verify that a Syslog destination is set correctly for your organization.

