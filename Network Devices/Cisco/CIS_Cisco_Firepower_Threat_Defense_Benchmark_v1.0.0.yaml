- id: '3.3'
  title: Configure default action to Block
  scoring: scored
  profile:
  - Level 1
  description: The default action handles traffic that does not match any of the rulesets created by network administrators.
    A Block default configuration ensures only permitted and desired traffic passes through the network, minimizing unauthorized
    access and preventing potentially malicious traffic from accessing and compromising the network.
  rationale: Block for all actions that aren’t defined by rulesets is similar to the Deny Any/Any in an ASA. It is important
    to prevent traffic not defined by rulesets from gaining access to the network.
  impact: Setting default block with logging can cause some issues with latency in high traffic networks. It is important
    to have adequate storage for the logs.
  references:
  - 1. https://media.defense.gov/2023/Aug/02/2003272858/-1/-
  page_start: 138
  audit_raw: "In the GUI\nPolicies > Access Control > in the Default Action dropdown at the bottom,\nensure Block is selected>\
    \ Verify At Beginning and End of Connection radio\nbutton is selected\nIn the API\nHTTP GET /policy/accesspolicies\nLook\
    \ for:\n \"defaultAction\": {\n \"action\": \"DENY\",\n \"eventLogAction\": \"LOG_BOTH\""
