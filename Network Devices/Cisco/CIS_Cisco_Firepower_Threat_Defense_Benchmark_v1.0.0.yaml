      • Verify that one or more "block by category" rules exist, and ensure that they

      provide complete coverage (and no more) when compared to the written policy.'
    severity: medium
- id: 2.1.8
  title: Enable secure VPN anyconnect tunnelling protocols
  scoring: manual
  profile:
  - Level 1
  description: A secure VPN uses strong encryption protocols making it difficult for anyone to intercept data. Traffic is
    masked to prevent leakage. Strong encryption is recommended with the VPN tunneling. The IKEv2 policy should include AES-256
    or AES-GCM-256 for encryption, a Diffie-Hellman group of 20, a SHA-384 or SHA-512 integrity hash, and a Pseudo Random
    Function (PRF) hash of SHA-384 or SHA-512.
  rationale: Secure VPN settings are important to protect privacy and data. Secure settings ensure that your online activities
    are encrypted and anonymized
  impact: ''
