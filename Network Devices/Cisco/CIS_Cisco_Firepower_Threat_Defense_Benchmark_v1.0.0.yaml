    available resources in mind)

    • AMP For Endpoints Status: On

    • AMP for Firepower Status: On

    • Appliance Heartbeat: On

    • Automatic Application Bypass Status: On

    • Backlog Status: On

    • CPU Usage: On (Warning = 80%, Critical = 90%, adjust downwards as needed)

    • Appliance Configuration Resource Utilization

    • Cluster/Failover Status: On

    • Configuration Database: On (Warning = 15GB, Critical = 50GB, adjust

    downwards as needed)

    • Disk Status: On

    • Disk Usage: On (Warning = 85%, Critical = 90%, 2HD Warning = 97%, 2HD

    Critical = 99%, adjust downward as needed)

    • FMC HA Status: On

    • Hardware Alarms: On

    • Health Monitor Process: On (Warning - 30 minutes since last event, Criticalk = 60

