- id: 2.1.10
  title: Access Policy Application Settings should be set
  scoring: manual
  profile:
  - Level 1
  description: When creating a rule, where possible the "Application" field should be preferred for use over the traditional
    "Dest Port" fields. Even when the destination port is known, the Application value should be added for each rule.
  rationale: This preference makes things like Data Exfiltration or Beaconing to Command and Control servers more difficult
    for malicious actors. Masquerading traffic of this type over port 53 (usually used for DNS) or as unencrypted traffic
    using 443/tcp is a common practice for malware.
  impact: Supplying both the Destination Port and the Application fields for each rule in the Access Policy makes data exfiltration
    and beaconing that much more difficult for malicious actors. Unfortunately, current malware routinely uses valid HTTPS
    traffic for these purposes, but the more "speed bumps" that can be implemented at the perimeter the better.
  references: []
  page_start: 126
  audit_raw: 'For each rule in the Access Policy (especially perm,it rules), ensure that the Application

    field is filled in. Even if the destination port is "known" for any particular rule, the

    application should still be filled in.'
  remediation: 'For each Access Policy Rule:

    • Choose "Edit"

    • Choose the "Applications" tab for that rule

    • Select all applications that are applicable for that rule

    Note that if any application other than "Any" is selected, then the application list must be

    complete, or some desired traffic will be blocked (or undesired traffic will be permitted).

    This means that this is often an iterative process.

    A common method is to have a rule with the Application list implemented, then follow

    that rule with an identical one, but with "Any" selected for the application field. This

    second rule will log differently - with a higher severity or to a different log server, so that

    as the second rule triggers, exceptions are easily seen and the first rule can be

    adjusted. After some period of time the second rule will no longer trigger and will be

    deleted.'
  checks:
  - type: manual_review
    info: 'For each rule in the Access Policy (especially perm,it rules), ensure that the Application

      field is filled in. Even if the destination port is "known" for any particular rule, the

      application should still be filled in.'
    severity: medium
- id: '3.1'
  title: Secure local network infrastructure 3.1.1 Secure the Network Time Protocol Server
  scoring: manual
  profile:
  - Level 1
  description: Network Time Protocol (NTP) is intended to synchronize all participating devices to within a few milliseconds
    of Coordinated Universal Time (UTC). NTP is important for correct logging and tracking of events.
  rationale: Synchronizing the system time on the management center and its managed devices is essential to successful operation
    of Firepower. We strongly recommend using a secure and trusted Network Time Protocol (NTP) server to synchronize system
    time on the management center and the devices it manages.
  impact: When multiple devices are in usage, without time synchronization, each resource will think the correct time is different.
    If you try to compare logs between resources, none of the timestamps line up. If the data is aggregated to a log server
    or security information event manager, the events will appear jumbled, and analytics and correlation engines will not
    be able to process the data for unusual behavior or indicators of compromise.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/security/secure-firewall/managementcenter/device-config/720/management-center-device-config-72/interfacessettings-platform.html?bookSearch=true
  page_start: 129
  audit_raw: Devices > Platform Settings > Time Synchronization (verify NTP server)
  remediation: 'Devices > Platform Settings > Time Synchronization >

    **_Configure one of the following clock options:_**

    **Via NTP from Defense Center—(Default)**. The managed device gets time from

    the NTP servers you configured for the management center (except for

    authenticated NTP servers) and synchronizes time with those servers directly.

    However, if any of the following are true, the managed device synchronizes

    time from the management center:

    The management center’s NTP servers are not reachable by the device.

    The management center has no unauthenticated servers.

    **Via NTP from**—If your management center is using NTP servers on the

    network, select this option and enter the fully-qualified DNS name (such as

    ntp.example.com), or IPv4 or IPv6 address, of the same NTP servers you

    specified in System > Configuration > Time Synchronization. If the NTP

    servers are not reachable, the management center acts as an NTP server.'
  checks:
  - type: manual_review
    info: Devices > Platform Settings > Time Synchronization (verify NTP server)
    severity: medium
