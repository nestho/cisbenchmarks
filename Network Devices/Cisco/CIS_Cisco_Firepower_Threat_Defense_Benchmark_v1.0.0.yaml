- id: 1.2.1
  title: Create Periodic Backups of Firepower Management Center
  scoring: scored
  profile:
  - Level 1
  description: At a minimum, backing up the FMC server configuration is recommended. Backing up managed devices is usually
    not critical, the quickest recovery of a compromised Firepower device is to re-install it from scratch, then to use FMC
    to configure it by deploying the appropriate policies to it.
  rationale: While backups be default configured to run weekly, a minimum cadence of daily backups is recommended in most
    environments to minimize the impact of deploying an older backup. Backups are recommended to be stored remotely so that
    in the event of a security incident, the attacker would need to compromise both the FMC server and the remote backup destination.
    If that remote backup destination is then part of a standard IT backup solution, that then makes a complete compromise
    of Firepower backups even more difficult.
  impact: Backups are a critical part of system recovery, from either operational events that may affect operation of the
    Firepower System, or security incidents that may affect operation or may cast doubt on the integrity of the Firepower
    configuration or stored data.
  references: []
  page_start: 51
  audit_raw: 'Navigate to:

    - System (Gear Icon) > Backups

    - Verify that backups are occurring and completing periodically, in the lower

    part of this screen.

    - At a minimum, backups should have a "Yes" in the "Configurations" column

    - Select "Backup Profiles"

    - For each Backup Profile, open the profile and verify that the backups are

    configured to copy to a remote host.

    Next, navigate to:

    - System (Gear Icon) > Scheduling

    - Verify that the backups are scheduled to run at a reasonable schedule

    (daily in most environments)

    - Select the last few backup jobs, and verify that the Last Run Status is

    "Successful"'
  remediation: 'Navigate to

    System (Gear Icon) > Backup / Restore > Backup Profiles

    - Choose "Create Profile"

    - Assign a descriptive name

    - At a minimum, choose "Back Up Configuration"

    - If space permits, it is advised that "Back Up Events" is also selected,

    with "Back Up Threat Intelligence Director" as a second "if space permits"

    recommendation.

    - If only these fields are completed, the backups are only stored locally on

    the FMC server. This is not recommended, as any event that affects the FMC

    server may make these backups unavailable, or in the case of a security event

    the integrity of the information in the backups may be suspect.

    - Because of this, choose "Copy when complete"

    - Fill in the values for your site, which define an SCP / SFTP service in

    your environment that will host your off-device backups

    - You have the option of completing authentication for your backups as userid

    / password. In a more secure implementation, you also have the option to use

    SSH keys for authentication.

    - When complete, select "Save as New"

    Next, navigate to: System (Gear Icon) > Scheduling

    - Select "Add Task"

    - For Job Type, select "Backup"

    - Choose "Recurring"

    - Choose a start time in the future, preferably in an off-peak time window

    - Give the job a descriptive name

    - Choose "Management Center" as the Backup Type (in most environments no

    critical data is hosted on the managed devices)

    - Choose the Backup Profile that you have created.

    - There is a comment field that can be used at your discretion.

    - An "Email Status to" field is available if email is a convenient way to

    track backup job status in your environment.'
  checks:
  - type: manual_review
    info: 'Navigate to:

      - System (Gear Icon) > Backups

      - Verify that backups are occurring and completing periodically, in the lower

      part of this screen.

      - At a minimum, backups should have a "Yes" in the "Configurations" column

      - Select "Backup Profiles"

      - For each Backup Profile, open the profile and verify that the backups are

      configured to copy to a remote host.

      Next, navigate to:

      - System (Gear Icon) > Scheduling

      - Verify that the backups are scheduled to run at a reasonable schedule

      (daily in most en'
    severity: medium
- id: '1.3'
  title: Scheduled Updates 1.3.1 Scheduled Rule Updates
  scoring: scored
  profile:
  - Level 1
  description: The Snort Vulnerability database should be automatically downloaded and deployed at a reasonable cadence, preferably
    daily.
  rationale: If the IPS Rule database is not updated frequently, then newer attacks may not be detected, and improved detections
    of existing attacks will not be used.
  impact: 'There are a few different impacts to consider for this recommendation: On the positive side, it is definitely recommended
    to use the latest rule database to maximize the detection of malicious events and to minimize false positives. On the
    negative side, deploying the updated database to existing rulesets may cause unintended consequences - it is possible
    (though not probable) that deploying a new database to an existing ruleset without testing can result in affecting production
    traffic in unexpected ways. This negative consequence is generally deemed to be of low probability. For this reason it
    is recommended to both download the newest rule database at a frequent interval, but then also to deploy updated policies
    after the rule updates are completed. The only time this is not recommended is if there is an established manual procedure
    of testing before deploying after rule updates. In most environments this is too labor intensive to mitigate a risk that
    is considered to be both of low probability and low impact, so automated deploys are recommended.'
  references: []
  page_start: 54
  audit_raw: '- Navigate to System (Gear Icon) > Updates

    - Choose "Rule Updates"

    - Under "Recurring Rule Update Imports", verify that "Enable Recurring Rule

    Update Imports from the Support Site" is enabled

    - Verify that the update frequency is set to "Daily", with a scheduled time

    that complies with the policies of the organization.

    - Ensure that "Policy Deploy" is selected, unless there is an equivalent

    manual test / deploy procedure in place.

    - At the top of the screen, verify that the "Running Snort Rule update

    version" is the expected recent value.

    - This version can also be found by Navigating to Overview > Dashboard >

    Status'
  remediation: '- Navigate to System (Gear Icon) > Updates

    - Choose "Rule Updates"

    - Under "Recurring Rule Update Imports", choose "Enable Recurring Rule Update

    Imports from the Support Site"

    - Choose an update frequency and schedule. Daily updates are recommended,

    the update time is should be schedule for an off-peak time window to minimize

    the potential affect on traffic that IPS rule updates can have. (note that

    this impact is usually considered to be of low risk)

    - Choose "Policy Deploy", unless there is an equivalent manual test / deploy

    procedure in place.'
  checks:
