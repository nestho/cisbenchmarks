- id: 2.1.5
  title: Access Policy File Policy
  scoring: manual
  profile:
  - Level 1
  description: 'FirePower allows detection of files by type, then imposing an action on detected files, which can consist
    of any or all of: Block Malware Detect Files Block Files Malware Cloud Lookup With in these categories, processing options
    include: Spero Analysis for MSEXE Dynamic Analysis Capacity Handling (if busy, store suspect files for later processing)
    Local Malware Analysis Reset Connection These values are configurable by Application Protocol and Direction of Transfer.'
  rationale: Files downloaded from the public internet, via email or direct download are a prime source of malware in most
    organizations today. For an initial infection vector, the most common by far is Office documents that have embedded macros
    or other active content. Subsequent stages of infection however will download true executable files or scripts (often
    PowerShell, Python or Javascript, but certainly not limited to these) which will then execute the malicious intent of
    the malware campaign.
  impact: Configuring a File Policy helps to make downloading (or sending or uploading) malware more difficult.
