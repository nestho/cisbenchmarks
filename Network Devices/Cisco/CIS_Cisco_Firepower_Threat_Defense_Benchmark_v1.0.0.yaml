- id: 1.4.3.1
  title: If SNMP is configured, ensure that SNMP v3 only is used to Manage your FMC Server
  scoring: manual
  profile:
  - Level 1
  description: Ensure that if SNMP is configured, that only SNMPv3 is enabled for FMC
  rationale: SNMP is commonly used to manage an alert on common device metrics such as CPU Utilization, Link Utilization and
    Temperature. Older versions of SNMP (1,2,2c) were all unencrypted, and often used default "string" values to authenticate,
    allowing disclosure of sensitive information or in some cases permitting configuration changes. Ensuring that only SNMPv3
    is configured allows this desired management function, but encrypts the associated data.
  impact: If older versions of SNMP are configured, any captured SNMP traffic is in clear text, disclosing sensitive device
    information. In addition, older versions of SNMP often used default authentication "strings", which if configured allowed
    full access to the device SNMP information. Finally, if an older SNMP version is compromised, it gives a malicious actor
    an excellent "traffic multiplier" situation, where small requests resulted in much larger responses. This in combination
    with the UDP protocol used by these protocols allowed for this multiplied traffic to be spoofed, such that the spoofed
    (target) IP address could be subject to enough traffic to result in a denial of service condition. Using appropriate passwords
    and encryption in SNMPv3 makes this type of attack much more difficult, as the credentials must be compromised before
    the traffic multiplier issue is in play.
  references: []
  page_start: 92
  audit_raw: '- Navigate to System (Gear Icon) / SNMP

    - Ensure that the SNMP Version is set to "Version 3"

    - Ensure that SNMPv3 Users exist such that:

    - if applicable, the "Encryption Password Type" is set to "Encrypted"

    - if applicable, the "Auth Algorithm Type" is set to SHA or SHA256

    - if applicable, the "Encryption Type" is set to AES256'
  remediation: '- Navigate to System (Gear Icon) / SNMP

    - Set the SNMP Version to "Version 3"

    - Choose "Add User"

    - Configure SNMPv3 Users such that:

    - If applicable, set the "Encryption Password Type" is set to "Encrypted"

    - If applicable, set the "Auth Algorithm Type" to SHA or SHA256

    - If applicable, set the "Encryption Type" to AES256

    - Save your changes'
  checks:
  - type: manual_review
    info: '- Navigate to System (Gear Icon) / SNMP

      - Ensure that the SNMP Version is set to "Version 3"

      - Ensure that SNMPv3 Users exist such that:

      - if applicable, the "Encryption Password Type" is set to "Encrypted"

      - if applicable, the "Auth Algorithm Type" is set to SHA or SHA256

      - if applicable, the "Encryption Type" is set to AES256'
    severity: medium
