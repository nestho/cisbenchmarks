- id: 1.3.2
  title: Scheduled Geolocation Updates
  scoring: scored
  profile:
  - Level 1
  description: The Geo Location database should be automatically downloaded and deployed at a reasonable cadence, preferably
    daily.
  rationale: ''
  impact: While the geo-location of IP addresses may not seem like a rapidly changing artifact, it actually can be, especially
    for IPv4. In today's world where the IPv4 address space is exhausted, it is common to see addresses change location, sometimes
    even change continents as subnets change hands. In addition, the larger Cloud Service Providers will often move subnets
    between geographically disparate datacenters to balance demand for address space with the subnets they own. Finally, many
    companies have Disaster Recovery strategies that have production (public) address spaces move to a DR location in some
    disaster scenarios All of these common examples mean that any geo-location database will see multiple changes daily. As
    this database is used for both detection of events, enriching events with geo-location data and in many cases in firewall
    rules, keeping this database as upto-date as possible is important for all organizations.
  references: []
  page_start: 57
  audit_raw: '- Navigate to System (Gear Icon) > Updates > Gelolocation Updates

    - Under "recurring Geolocation Updates", ensure that "Enable Recurring Weekly

    Updates from the Support Site" is selected

    - Ensure that the scheduled day and time matches any policies your

    organization may have in place.

    - verify that the "Geolocation Update Version" (at the top of the screen)

    matches the expected recent value.

    - This version can also be found by Navigating to Overview > Dashboard >

    Status'
  remediation: '- Navigate to System (Gear Icon) > Updates

    - Choose "Geolocation Updates"

    - Under "Recurring Rule Update Imports", enable "Enable Recurring Weekly

    Updates from the Support Site"

    - Set the scheduled day and time to match any policies your organization may

    have in place.'
