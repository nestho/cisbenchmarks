    notifications for each as appropriate for your organization

    Next, navigate to Policies > Actions > Alerts > Advanced Malware Protection

    Alerts

    • At a minimum, set your created Syslog server as a target

    • Set email and SNMP alert destinations as appropriate to your organization

    • Set destinations for all Events. Syslog should be set for all, set email and SNMP

    notifications for each as appropriate for your organization'
