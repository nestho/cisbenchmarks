controls:
- id: 1.1.1
  title: Local Credentials 1.1.1.1 Restrict access to the local Admin account
  scoring: manual
  profile:
  - Level 1
  description: The default Admin user should never be used for anything outside of initial setup.
  rationale: Default admin is the only account on the device on initial setup. Access to this account should be restricted.
    Utilizing individual accounts allow for more accurate logging.
  impact: Using the default admin account for day to day tasks opens it to potential compromise. In the event of compromise
    it would be difficult to track where the compromise came from using logging. Default admin has root access and all accounts
    should be as needed.
  references: []
  page_start: 15
  audit_raw: 'Review the FMC Syslog logs, looking for events similar to:

    2021-12-25 13:31:11 User.Info s-hof-fpmgt.mscu.com Dec 25

    18:31:11 mojo_server.pl: s-hof-fpmgt: admin@127.0.0.1, Login, Login

    Success<000>x0a<000>x00'
  remediation: 'Set up alerts on the FMC Syslog logs, looking for events similar to:

    2021-12-25 13:31:11 User.Info s-hof-fpmgt.mscu.com Dec 25

    18:31:11 mojo_server.pl: s-hof-fpmgt: admin@127.0.0.1, Login, Login

    Success<000>x0a<000>x00'
  checks:
  - type: manual_review
    info: 'Review the FMC Syslog logs, looking for events similar to:

      2021-12-25 13:31:11 User.Info s-hof-fpmgt.mscu.com Dec 25

      18:31:11 mojo_server.pl: s-hof-fpmgt: admin@127.0.0.1, Login, Login

      Success<000>x0a<000>x00'
    severity: medium
- id: 1.1.1.2
  title: Do not use the default "admin" account
  scoring: manual
  profile:
  - Level 1
  description: The use of named accounts is recommended for all access to the Firepower interface. The default "admin" account
    should only be used in exceptional circumstances.
  rationale: The built in "admin" account has full rights to all facets of the Firepower platform. If a change is made by
    this account, linking this change back to an actual person or automated process can be difficult or impossible. For this
    reason, it is recommended that all accounts that access the Firepower be named accounts that are easily linked back to
    the people assigned for their use. Accounts used for automation should be similarly named for easy identification.
  impact: Changing the default "admin" account on a Cisco Firepower firewall is a crucial security measure to protect your
    network infrastructure. To change the default "admin" account, you'll need to create a new user and disable or delete
    the default "admin" account.
  references: []
  page_start: 18
  audit_raw: '1. Access the Firepower Management Center (FMC): You can access the FMC

    using a web browser by entering its IP address in the address bar. Make sure

    you have administrative privileges to perform this task.

    2. Log in to the FMC: Use the default "admin" account to log in.

    If this succeeds you have verified that the "admin" account is active.'
  remediation: '1. Create a New User:

    - Go to "System" in the FMC navigation menu.

    - Under "System Configuration," click on "Users."

    - Click the "Add" button to create a new user account.

    - Enter the new user''s details, including a unique username and password.

    - Assign the appropriate role and permissions to the new user, such as

    Administrator or another custom role with the necessary privileges.

    2. Disable or Delete the Default "admin" Account:

    - While still in the "Users" section, locate the "admin" account.

    - You can either disable or delete the "admin" account. Disabling is a safer

    option in case you need to revert changes later, but deletion is more secure.

    To disable the account, simply uncheck the "Enable" option next to the

    "admin" account. To delete the account, select the "admin" account and click

    the "Delete" button.

    3. Log Out and Log Back In: Log out of the FMC, and then log back in using the

    new user account you created.

    4. Test the New User Account: Verify that the new user account has the necessary

    privileges and access to perform administrative tasks on the Cisco Firepower

    firewall.

    5. Update Documentation: Ensure that you document the changes you''ve made,

    including the new user account details and any changes to the "admin" account.'
  checks:
  - type: manual_review
    info: '1. Access the Firepower Management Center (FMC): You can access the FMC

      using a web browser by entering its IP address in the address bar. Make sure

      you have administrative privileges to perform this task.

      2. Log in to the FMC: Use the default "admin" account to log in.

      If this succeeds you have verified that the "admin" account is active.'
    severity: medium
- id: 1.1.2.1
  title: Use an External Authentication Source for Administrative Logins
  scoring: manual
  profile:
  - Level 1
  description: By default, the Firepower administrative account is set during installation (commonly to "admin", but any value
    appropriate to the organization is fine), and is locally defined. It is recommended that a back-end directory be used
    to authenticate all other administrative access of all levels.
  rationale: If the single "admin" account is used, only a single administrator can access the FMC console at one time, subsequent
    logins will disconnect the currently active session. More importantly, using generic accounts means that any changes cannot
    be tied to any specific administrator. This means that tracking change control requests is not practical in the default
    configuration, nor is tieing configuration errors to specific users. Just as important, if an administrator leaves the
    organization it can be difficult to "find" all of the things that they administered in a timely manner, and disable their
    access. Using a back-end directory means that disabling a single account will disable all of their access. Similarly,
    controlling access by group means that moving a user account into or out of that group controls their access.
  impact: Without external authentication defined, it is common to see these systems controlled by a single user - "admin".
    The defaults also have none of the common account management policies defined (enforcing periodic password changes, password
    complexity, preventing password re-use etc). The result of this is that no changes can be connected to any specific person.
    Also, if an administrator should change roles or departments, they still have this default set of credentials. If this
    approach is used for all network infrastructure, changing these credentials as people come and go is also difficult, it's
    very common to forget one or more devices during a password change. In the worst case, at some point in the future accessing
    that missed device might be impossible, as no-one in the team will remember what "the password" was 8 cycles ago. Finally,
    if an attacker should compromise this password on one platform, all platforms are now accessible.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/security/firepower/660/configuration/guide/
  page_start: 21
  audit_raw: 'In the FMC Console:

    Navigate to System / Users

    Verify that all administrative user accounts have "External" as their

    Authentication Method

    Note that the default administrative user that was defined during the

    installation (often this found to be "admin") will remain in this list as an

    Internal user. It is recommended to keep this user in place, in the event

    that the external authentication service is not available.'
  remediation: 'First create an External Authentication Object:

    - Navigate to System / Users / External Authentication.

    - Create an External Authentication Object (RADIUS or LDAP)

    - Whichever method is defined, be sure to configure both a Primary and a

    Backup server for redundant authentication

    - On the External Authentication service, it''s recommended to control access

    by directory Groups rather than by user account (this is easily done in both

    RADIUS and in LDAP)

    - For both RADIUS or LDAP, the various administrative users should be

    populated in their respective RBAC roles. In a smaller environment, it is

    common to see all administrators be populated in the "Administrator"

    category, which gives them full administrative (read/write) rights. If this

    is not done, a "Default User Role" should be selected.

    - If it is desired to restrict Shell Access to specific users only, in

    earlier versions of FMC add them in the Shell Access Filter section. In

    later versions (6.4 or later), you can control this access using RADIUS

    Attributes (Service Type: Administrative)'
  checks:
  - type: manual_review
    info: 'In the FMC Console:

      Navigate to System / Users

      Verify that all administrative user accounts have "External" as their

      Authentication Method

      Note that the default administrative user that was defined during the

      installation (often this found to be "admin") will remain in this list as an

      Internal user. It is recommended to keep this user in place, in the event

      that the external authentication service is not available.'
    severity: medium
- id: 1.1.2.2
  title: Enable SSHv2
  scoring: scored
  profile:
  - Level 1
  description: SSHv2 is the preferred choice for secure remote access. Once configured it allows for an encrypted connection
    to the remote device.
  rationale: SSHv1 is deprecated and is no longer recommended.
  impact: ''
  references: []
  page_start: 24
  audit_raw: Devices > Platform Settings > Secure Shell
  remediation: 'Devices > Platform Settings > Secure Shell

    1. Click Add

    2. Enter in IP addresses or Range

    3. Select Zone/Interface'
  checks:
  - type: manual_review
    info: Devices > Platform Settings > Secure Shell
    severity: medium
- id: 1.1.3.1
  title: Set Appropriate Roles for all Administrative Users
  scoring: manual
  profile:
  - Level 1
  description: The Firepower Management platform has the ability to assign roles (RBAC) to each administrative user.
  rationale: In smaller environments it is common to see all administrative users with full read/write access, but as organizations
    grow, it is recommended that people who only need reporting or other read-only access be assigned to more restrictive
    roles. In all environments, the roles of each user should be assessed to ensure only appropriate access is granted.
  impact: If available, RBAC (Role Based Access Controls) are an important part of any configuration. A properly configured
    RBAC configuration ensures that full environment administrators have appropriate (full) access, but also properly limits
    people like managers, who may only need reports. In between these two extremes you will most often find Helpdesk and SOC
    analysts who require access to the Analysis functions of Firepower to resolve issues or investigate possible security
    incidents. To one side of this spectrum you generally find auditors, who need read-only access to the entire configuration
    to ensure that things like the Access Policy are appropriately configured, or that appropriate security controls are applied
    (for instance as described in this document).
  references: []
  page_start: 26
  audit_raw: 'Navigate to System / Users

    Verify that all user accounts have appropriate Roles assigned (in the Roles column),

    matching their job requirements.'
  remediation: 'Navigate to System / Users

    Edit the target user.

    Select any of the following Roles either singly or in combination, as required:

    • Administrator (Externally Set)

    • External Database User (Read Only)

    • Security Analyst

    • Security Analyst (Read Only)

    • Security Approver

    • Intrusion Admin

    • Access Admin

    • Network Admin

    • Maintenance User

    • Discovery Admin

    • Threat Intelligence Director (TID) User'
  checks:
  - type: manual_review
    info: 'Navigate to System / Users

      Verify that all user accounts have appropriate Roles assigned (in the Roles column),

      matching their job requirements.'
    severity: medium
- id: 1.1.3.2
  title: Use Dedicated User Accounts for API Access
  scoring: manual
  profile:
  - Level 2
  description: Keeping standard admin users (who use the UI or occassionally the CLI) separate from accounts that are used
    for scripting and automation is a key security principal.
  rationale: 'Keeping interactive and automated access separate is key in most situations that involve automation, in particular
    if automation is used to enforce policy. An account that logs in interactively and makes a deliberate change is most likely
    a change that is purposefully done (whether by the person who owns the account or be a compromised account), and should
    be treated as such. Scripting accounts are often used for audit purposes, often because getting management approval for
    automated firewall changes can be a problem in many organizations. These accounts should be configured with read-only
    privileges. At this time, automated read-write access in many organizations is often within a larger automation platform
    (such as Teraform or Ansible, both of which support Firepower). This approach is excellent, as firewall changes are not
    treated as standalone updates, but are usually part of larger deploys - for instance they can be tied to service deployments
    and configurations. In these situations the use of a native password "vault" or "safe" is recommended. Tools of this type
    are often run periodically, re-executing their playbooks that define the environment. In the event that an execution like
    this finds a change to make, it means one of two things: • This is a new change that is scheduled and approved • This
    "run" of the playbooks should be considered a finding - it has found either a conflict within the playbooks, or has found
    a manual change that has just been reversed. In the second situation particularly, the difference between an interactive
    account and an automation account can be critical - knowing if you have a scripting error or an admin who is operating
    outside of the automation framework is a key consideration in remediation of this finding. If an interactive account was
    used to run the automation playbook, working out if this is an automation error or an admin who is operating outside of
    the approved processes and procedures can be much more difficult.'
  impact: ''
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/security/firepower/660/api/REST/firepower
  page_start: 28
  audit_raw: 'Review the assigned users, and collect the privilege level for each.

    Manual Method:

    Automated method:

    https://www.cisco.com/c/en/us/td/docs/security/firepower/ftd-api/guide/ftd-restapi/external-users-ftd-api.html

    Review the login date/time for each account, and verify that these are appropriate.

    Inactive accounts should be deactivated, and accounts operating outside of approved

    times or source IP ranges should be investigated.'
  remediation: ''
  checks:
  - type: manual_review
    info: 'Review the assigned users, and collect the privilege level for each.

      Manual Method:

      Automated method:

      https://www.cisco.com/c/en/us/td/docs/security/firepower/ftd-api/guide/ftd-restapi/external-users-ftd-api.html

      Review the login date/time for each account, and verify that these are appropriate.

      Inactive accounts should be deactivated, and accounts operating outside of approved

      times or source IP ranges should be investigated.'
    severity: medium
- id: 1.1.3.3
  title: Restrict access to the FMC CLI
  scoring: manual
  profile:
  - Level 1
  description: By default, there is one admin user with full administrator rights to the FTD CLI command line. This admin
    user can create multiple accounts and grant them either basic, which is read-only, or config, which is read-write, access
    levels.
  rationale: Appropriate access levels should be administered depending on the user’s role. Access to the CLI should be restricted
    to lower the overall attack surface.
  impact: Decreasing the number of users with config access instead of granting all users config access, significantly reduces
    the chances of a compromised system.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/security/firepower/623/configuration/guide/
  page_start: 31
  audit_raw: 'Users with config level access can use the CLI command expert to access the Linux

    shell. This is available to the admin account, local users, and external users with config

    level access.'
  remediation: 'To block access to the Linux shell, administrators can use the system lockdown-sensor

    command. Once this command is used, any non-administrator user who logs in will only

    have access to the FTD CLI command.'
  checks:
  - type: manual_review
    info: 'Users with config level access can use the CLI command expert to access the Linux

      shell. This is available to the admin account, local users, and external users with config

      level access.'
    severity: medium
- id: 1.1.4.1.1
  title: Create a Realm
  scoring: manual
  profile:
  - Level 1
  description: A realm consists of one or more LDAP or Microsoft Active Directory servers that share the same directory credentials.
    You must configure a realm to perform user and user group queries, user control, or to configure an authoritative identity
    source.
  rationale: Realms are connections between the Firepower Management Center and the user accounts on the servers you monitor.
    They specify the connection settings and authentication filter settings for the server.
  impact: 'Realms can: • Specify the users and user groups whose activity you want to monitor. • Query the user repository
    for user metadata on authoritative users, as well as some non-authoritative users: POP3 and IMAP users detected by traffic-based
    detection and users detected by traffic-based detection, a user agent, or ISE.'
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/security/firepower/601/configuration/guide/
  page_start: 35
  audit_raw: '1. Log in to the Firepower Management Center.

    2. Click System > Integration.

    3. Click Realms.

    Verify that documented Realms exist.'
  remediation: '1. To create a new realm, click Add Realm.

    2. To perform other tasks (such as enable, disable, or delete a realm), see

    Manage a Realm.

    3. Enter the following realm information:

    • Name: A unique name for the realm. The system supports alphanumeric and

    special characters.

    • Description: (Optional.) Enter a description of the realm.

    • Type: The type of realm, AD for Microsoft Active Directory or LDAP for other

    supported LDAP repositories.

    • AD Primary Domain: For Microsoft Active Directory realms only. Domain for the

    Active Directory server where users should be authenticated.

    • Directory Username and Directory Password: For Microsoft Active Directory

    realms only. Domain for the Active Directory server where users should be

    authenticated.

    • Base DN (Distinguished Name): The directory tree on the server where the

    Firepower Management Center should begin searching for user data.

    • Group DN: The directory tree on the server where the Firepower Management

    Center should search for users with the group attribute

    • Group Attribute (Optional): The group attribute for the server, Member or Unique

    Member.

    4. Click OK.

    5. Configure at least one directory as discussed in [Configure a Realm

    Directory](https://www.cisco.com/c/en/us/td/docs/security/firepower/601/confi

    guration/guide/fpmc-config-guidev601/Identity_Policies_and_Realms.html#task_EBC16C6927ED4A33BBEE039547353F99)

    .

    6. Configure user and user group download (required for access control) as

    discussed in [Download Users and

    Groups](https://www.cisco.com/c/en/us/td/docs/security/firepower/601/configur

    ation/guide/fpmc-config-guidev601/Identity_Policies_and_Realms.html#task_828D5C71131C4501AB4FE34423CD6349)

    .

    7. Click Realm Configuration.

    8. Enter user session timeout values, in minutes, for Authenticated Users,

    Failed Authentication Users, and Guest Users.

    9. When you''re finished configuring the realm, click Save.'
  checks:
  - type: manual_review
    info: '1. Log in to the Firepower Management Center.

      2. Click System > Integration.

      3. Click Realms.

      Verify that documented Realms exist.'
    severity: medium
- id: 1.1.4.1.2
  title: Create an Identity Policy
  scoring: manual
  profile:
  - Level 1
  description: An identity policy associates traffic on your network with an authoritative identity source and a realm.
  rationale: 'After configuring one or more identity policies, you can associate one with an access control policy and deploy
    the access control policy to a managed device. Identity policies contain identity rules. Identity rules associate sets
    of traffic with a realm and an authentication method: passive authentication, active authentication, or no authentication.'
  impact: If you do not configure an identity policy, the system does not perform user authentication.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/security/firepower/601/configuration/guide/
  page_start: 37
  audit_raw: '1. Log in to the Firepower Management Center.

    2. Click Policies > Access Control > Identity

    Verify that all documented Identity Policies are in place.'
  remediation: '1. Log in to the Firepower Management Center.

    2. Click Policies > Access Control > Identity and click New Policy.

    3. Enter a Name and, optionally, a Description.

    4. Click Save.

    5. To add a rule to the policy, click Add Rule as described in [Create an

    Identity

    Rule](https://www.cisco.com/c/en/us/td/docs/security/firepower/601/configurat

    ion/guide/fpmc-config-guidev601/Identity_Policies_and_Realms.html#task_A2FCBE057F6A42D598D24C5280D0C238)

    6. To create a rule category, click Add Category.

    7. To configure captive portal active authentication, click Active

    Authentication as described in [Configure the Captive Portal Part 1: Create

    an Identity

    Policy.](https://www.cisco.com/c/en/us/td/docs/security/firepower/601/configu

    ration/guide/fpmc-config-guide-v601/User_Identity_Sources.html#id_61520)

    8. Click Save to save the identity policy.'
  checks:
  - type: manual_review
    info: '1. Log in to the Firepower Management Center.

      2. Click Policies > Access Control > Identity

      Verify that all documented Identity Policies are in place.'
    severity: medium
- id: 1.1.4.1.3
  title: Create an Identity Rule
  scoring: manual
  profile:
  - Level 1
  description: These are the Rules that will be applied within your Identity Policy.
  rationale: Identity Rules are the actions that are performed on users in the specified realms.
  impact: Provides the ability to enforce a form of authentication for users as well as specify which realm contains the users
    you want to perform the Action on.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/security/firepower/601/configuration/guide/
  page_start: 39
  audit_raw: '1. Log in to the Firepower Management Center.

    2. Click Policies > Access Control > Identity

    Verify that all documented Identity Policies are in place and that they have applicable

    rules.'
  remediation: '1. If you haven''t done so already, log in to the Firepower Management Center.

    2. Click Policies > Access Control > Identity .

    3. Click Edit (edit icon) next to the identity policy to which to add the

    identity rule.

    4. If View (view button) appears instead, the configuration belongs to an

    ancestor domain, or you do not have permission to modify the configuration.

    5. Click Add Rule.

    6. Enter a Name.

    7. Specify whether the rule is Enabled.

    8. To add the rule to an existing category, indicate where you want to Insert

    the rule. To add a new category, click Add Category.

    9. Choose a rule Action from the list.

    10. Click Realms & Settings.

    11. Choose a realm for the identity rule from the Realms list. You must

    associate a realm with every identity rule.

    12. The only exception to the realm requirement is implementing user control

    using only the ISE SGT attribute tag. In this case, you do not need to

    configure a realm for the ISE server. ISE SGT attribute conditions can be

    configured in policies with or without an associated identity policy.

    13. If you''re configuring captive portal, see [How to Configure the Captive

    Portal for User

    Control.](https://www.cisco.com/c/en/us/td/docs/security/firepower/601/config

    uration/guide/fpmc-config-guidev601/User_Identity_Sources.html#task_B09D4711593E4506890BB8BE25B39B31)

    14. (Optional) To add conditions to the identity rule, see [Rule Condition

    Types](https://www.cisco.com/c/en/us/td/docs/security/firepower/601/configura

    tion/guide/fpmc-config-guide-v601/fpmc-config-guidev601_chapter_01010111.html#id_16297).

    15. Click Add.

    16. In the policy editor, set the rule position. Click and drag or use the

    right-click menu to cut and paste. Rules are numbered starting at 1. The

    system matches traffic to rules in top-down order by ascending rule number.

    The first rule that traffic matches is the rule that handles that traffic.

    Proper rule order reduces the resources required to process network traffic

    and prevents rule preemption.

    17. Click Save.'
  checks:
  - type: manual_review
    info: '1. Log in to the Firepower Management Center.

      2. Click Policies > Access Control > Identity

      Verify that all documented Identity Policies are in place and that they have applicable

      rules.'
    severity: medium
- id: 1.1.4.1.4
  title: Manage a Realm
  scoring: manual
  profile:
  - Level 1
  description: This section describes how to perform various maintenance tasks for a realm using controls on the Realms page.
  rationale: As a network administrator it is critical that you are able to administrate your realms, rules and identities.
  impact: If the controls are dimmed, the configuration belongs to an ancestor domain, or you do not have permission to modify
    the configuration.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/security/firepower/601/configuration/guide/
  page_start: 42
  audit_raw: '1. Log in to the Firepower Management Center.

    2. Click System > Integration.

    3. Click Realms.

    View all of your available Realms.'
  remediation: '1. Log in to the Firepower Management Center.

    2. Click System > Integration.

    3. Click Realms.

    4. To delete a realm, click Delete (delete icon).

    5. To edit a realm, click Edit (edit icon) next to the realm and make changes

    as described in [Create a

    Realm](https://www.cisco.com/c/en/us/td/docs/security/firepower/601/configura

    tion/guide/fpmc-config-guidev601/Identity_Policies_and_Realms.html#task_F9ED2AF84F604438ACDC2124237DC518)

    .

    6. To enable a realm, slide State to the right; to disable a realm, slide it

    to the left.

    7. To download users and user groups, click Download (download icon).

    8. To copy a realm, click Copy (copy icon).'
  checks:
  - type: manual_review
    info: '1. Log in to the Firepower Management Center.

      2. Click System > Integration.

      3. Click Realms.

      View all of your available Realms.'
    severity: medium
- id: 1.1.4.1.5
  title: Compare Realms
  scoring: manual
  profile:
  - Level 1
  description: Utilize this technique to find differences between your Realms. You must be an Admin, Access Admin, Network
    Admin, or Security Approver to perform this task.
  rationale: Important task for an Administrator.
  impact: Allows you to identify differences between Realms.
  references:
  - 1. https://www.cisco.com/c/en/us/td/docs/security/firepower/601/configuration/guide/
  page_start: 44
  audit_raw: '1. Log in to the Firepower Management Center.

    2. Click System > Integration.

    3. Click Realms.

    4. Click System > Integration.

    5. Click Realms.

    6. Click Compare Realms.'
  remediation: '1. Log in to the Firepower Management Center.

    2. Click System > Integration.

    3. Click Realms.

    4. Click System > Integration.

    5. Click Realms.

    6. Click Compare Realms.

    7. Choose Compare Realm from the Compare Against list.

    8. Choose the realms you want to compare from the Realm A and Realm B lists.

    9. Click OK.

    10. To navigate individually through changes, click Previous or Next above

    the title bar.

    11. (Optional.) Click Comparison Report to generate the realm comparison

    report.

    12. (Optional.) Click New Comparison to generate a new realm comparison view.'
  checks:
  - type: manual_review
    info: '1. Log in to the Firepower Management Center.

      2. Click System > Integration.

      3. Click Realms.

      4. Click System > Integration.

      5. Click Realms.

      6. Click Compare Realms.'
    severity: medium
- id: 1.1.4.1.6
  title: Manage an Identity Policy
  scoring: manual
