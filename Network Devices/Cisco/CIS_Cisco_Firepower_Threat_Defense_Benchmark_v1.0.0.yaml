    have a "do not decrypt" action assigned to them

    • Assess other "Decrypt - Resign" and "Do not Decrypt" assignments for

    compliance to your policy

    • Verify that any sites assigned a "Do not decrypt" action for performance or

    operational reasons still fall within the parameters of your policy

    • In most rulesets, there will be a "default" rule at the bottom of the list, which will

    either decrypt all other sites, or exempt all other sites from decryption.

    • Verify that your SSL Policy is assigned in the Access Policy (Policies > Access

