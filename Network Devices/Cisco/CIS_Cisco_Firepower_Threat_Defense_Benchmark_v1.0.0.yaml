- id: '3.2'
  title: Harden Network Protocol Settings 3.2.1 Disable fragment reassembly
  scoring: scored
  profile:
  - Level 2
  description: ''
  rationale: Attackers use fragmentation to evade security systems such as firewalls or IPS because the checks are usually
    performed on the first fragment. They can then put malicious payload in the other fragments to perform DoS against internal
    systems. Disabling the fragmentation on the security appliance implies changing its default behavior from accepting up
    to 24 fragments in a packet to accepting only 1 fragment in a packet.
  impact: You might need to allow fragments on your network if you have an application that routinely fragments packets, such
    as NFS over UDP. However, fragmented packets are often used in Denial of Service (DoS) attacks, so we recommend that you
    do not allow fragments.
  references: []
  page_start: 134
  audit_raw: Device>Platform settings>(FTD Policy)>Fragment settings>Chain=1
  remediation: 'Devices > Platform Settings > create an FTD policy > Fragment Settings > set

    Chain (Packet) to ‘1’ > Save and Deploy'
  checks:
  - type: manual_review
    info: Device>Platform settings>(FTD Policy)>Fragment settings>Chain=1
    severity: medium
- id: 3.2.2
  title: Block older SSL and TLS versions
  scoring: scored
  profile:
  - Level 1
  description: Transport Layer Protocol or TLS utilities cryptography to encrypt web traffic. Firepower Threat Defense can
    block older TLS and SSL version to help protect the network from compromise. It is recommended that you move to TLS 1.3
    for your enterprise.
  rationale: By using TLS 1.3 you can enhance the security and performance of you network communications while maintaining
    privacy and complying with modern standards.
