- id: 2.1.6
  title: Decrypt traffic
  scoring: scored
  profile:
  - Level 2
  description: SSL decryption policies turn encrypted traffic into plaintext traffic. This allows the FTD device to apply
    URL filtering, intrusion and malware control as well as services that require deep packet inspection. If your policies
    allow the traffic it is then re-encrypted before it leaves the device.
  rationale: Encrypted traffic can hide malicious content or activities. By decrypting the traffic, the firewall can inspect
    it for malware or other threats. Decryption allows the firewall to analyze web pages, applications and files.
  impact: Traffic decryption can be resource intensive. When enabling this on your FTD device ensure that you have a robust
    architecture to handle the additional CPU and memory usage.
  references: []
  page_start: 117
