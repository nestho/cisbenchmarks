  description: A BGP AS number (ASN), or Autonomous System Number, is a unique identifier assigned to each autonomous system
    (AS) on the internet.
  rationale: 'BGP AS are important because: • Global Internet Routing: ASNs enable the global routing of IP traffic by ensuring
    that routing policies are maintained and followed. This is critical for the stability and efficiency of the internet.
    • Network Identity: An ASN provides a unique identity to an autonomous system, distinguishing it from others on the internet.
    • Policy Implementation: ASNs are used to implement and manage routing policies, allowing organizations to control how
    traffic enters and exits their networks. In summary, ASNs are a fundamental component of BGP, enabling the internet to
    function as a cohesive and interconnected network of networks.'
