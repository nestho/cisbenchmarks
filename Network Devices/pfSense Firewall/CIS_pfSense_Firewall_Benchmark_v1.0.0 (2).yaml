  title: Ensure there are no Unused Policies
  scoring: manual
  profile:
  - Level 1
  description: Ensure that there are no firewall policies that are unused
  rationale: Unused policies may provide unintended or anticipated access to services or hosts.
  impact: ''
  references: []
  page_start: 51
  audit_raw: Review all Firewall policies for use and validate the purpose of the policy.
  remediation: Disable and then delete any unused firewall policies.
