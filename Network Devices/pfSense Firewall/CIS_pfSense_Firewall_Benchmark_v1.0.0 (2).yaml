    severity: medium
- id: 4.1.6
  title: Ensure Logging is Enable for All Firewall Rules
  scoring: manual
  profile:
  - Level 1
  description: Ensure all firewall rules have logging enable.
  rationale: The event log of firewall rules helps in identifying the allowed and blocked traffic and also helps in troubleshooting
    and forensic investigation. It is always good to enable logging for all the firewall rules, but by logging multiple firewall
    rules results in a huge log files, which requires huge disk space and management operations. Logs play an important role
    in security auditing, incident response, system maintenance and forensic investigation, and should be configured as per
    the business needs.
  impact: ''
  references: []
  page_start: 52
  audit_raw: 'In the GUI:

    - Navigate to Status > System Logs > Settings

    - Verify Desired Logging Options are enabled'
  remediation: 'In the GUI:

    - Navigate to Status > System Logs > Settings

    - Check Desired Logging Options to enable.'
  checks:
  - type: manual_review
    info: 'In the GUI:

      - Navigate to Status > System Logs > Settings

      - Verify Desired Logging Options are enabled'
    severity: medium
- id: 4.1.7
  title: Ensure ICMP Request in not enable on Firewall
  scoring: manual
  profile:
  - Level 1
  description: The 'Accept ICMP requests' is a global property setting which is used to allow the ICMP requests from any location.
    ICMP is used to send control messages (for example, ping, destination unreachable, source quench, route change) to other
    systems.
  rationale: If this rule is enabled, it allows the echo requests, timestamp requests, information requests, and mask requests.
    This can be used by a malicious user to create a denial of service condition by flooding the network with broadcast echo
    requests and revealing mask request information.
  impact: ''
  references: []
  page_start: 54
  audit_raw: 'In GUI:

    - Navigate to Firewall > Rules > LAN

    - Check that none of the rules allow for "ICMP"

    In pfSense Shell:

    Verify there are no allowed rules present in the firewall which has ICMP Request

    allowed field In CLI:

    pfctl -sr'
  remediation: 'In GUI:

    - Navigate to Firewall > Rules > LAN

    - Delete any rules that allow for "ICMP"'
  checks:
  - type: manual_review
    info: 'In GUI:

      - Navigate to Firewall > Rules > LAN

      - Check that none of the rules allow for "ICMP"

      In pfSense Shell:

      Verify there are no allowed rules present in the firewall which has ICMP Request

      allowed field In CLI:

      pfctl -sr'
    severity: medium
- id: '5.1'
  title: SNMP Policy 5.1.1 Ensure SNMP traps receivers is set
  scoring: manual
  profile:
  - Level 1
  description: Enables SNMP traps receivers where traps are to be sent.
  rationale: The purpose of the SNMP service is to monitor in real-time the events occurring on systems in order to meet the
    security requirement of the availability of systems and services. The traps are SNMP notifications sent to the NMS or
    SNMP traps receivers and should be enabled in order to be sent and processed by the NMS. The NMS or SNMP traps receivers
    will then provide a comprehensive aggregation and reporting of events generated, thus helping the administrator
  impact: ''
  references: []
  page_start: 57
  audit_raw: 'In GUI:

    - Navigate to Services > SNMP.

    - Check "SNMP Traps Enable" is enabled.

    - Check on the "SNMP Trap Settings" is configured.'
  remediation: 'In GUI:

    - Navigate to Services > SNMP.

    - Check "SNMP Traps Enable" is enable.

    - Configured the "SNMP Trap Settings" value.

    - Click Save'
  checks:
  - type: manual_review
    info: 'In GUI:

      - Navigate to Services > SNMP.

      - Check "SNMP Traps Enable" is enabled.

      - Check on the "SNMP Trap Settings" is configured.'
    severity: medium
- id: 5.1.2
  title: Ensure SNMP traps is enabled
  scoring: manual
  profile:
  - Level 1
  description: Enables SNMP traps to be sent to the Network Management Station (NMS)
  rationale: The purpose of the SNMP service is to monitor in real-time the events occurring on systems in order to meet the
    security requirement of the availability of systems and services. The traps are SNMP notifications sent to the NMS and
    should be enabled in order to be sent and processed by the NMS. The NMS will then provide a comprehensive aggregation
    and reporting of events generated, thus helping the administrator.
  impact: ''
  references: []
