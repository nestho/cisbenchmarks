  - type: manual_review
    info: 'In the GUI

      - Navigate to System > Advance

      - Check the ''DNS Rebind Check'' Field'
    severity: medium
- id: '1.8'
  title: Ensure Web Management is Set to use HTTPS
  scoring: manual
  profile:
  - Level 1
  description: Web Admin Management Portal should only be accessed using HTTPS Protocol.
  rationale: HTTP transmits all data (including passwords) in clear text over the network and provides no assurance of the
    identity of the hosts involved. Because of this HTTP should never be used for sensitive tasks such as managing network
    devices or entering login credentials and HTTPS should be configured for Web Portal Management instead
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'In the GUI:

    - Navigate to System > Advance > Admin Access

    - Check the ''webConfigurator'' Table for HTTPS Enable.'
  remediation: 'In the GUI:

    - Navigate to System > Advanced > Admin Access

    - Select ''HTTPS'' in the ''webConfigurator''.

    - Click ''Save'''
  checks:
  - type: manual_review
    info: 'In the GUI:

      - Navigate to System > Advance > Admin Access

      - Check the ''webConfigurator'' Table for HTTPS Enable.'
    severity: medium
- id: '1.9'
  title: Ensure a synchronized High Availability peer is configured
  scoring: manual
  profile:
  - Level 1
  description: Ensure a High Availability peer is fully synchronized and in a passive or active state.
  rationale: To ensure availability of both the firewall and the resources it protects, a High Availability peer is required.
    In the event a single firewall fails, or when maintenance such as a software update is required, the HA peer can be used
    to automatically fail over session states and maintain overall availability
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'In the GUI:

    - Navigate to System > High Avail. Sync

    - Check "Synchronize Config to IP" is configured.'
  remediation: 'In the GUI:

    - Navigate to System > High Avail. Sync

    - Setup each field and Hit Save'
  checks:
  - type: manual_review
    info: 'In the GUI:

      - Navigate to System > High Avail. Sync

      - Check "Synchronize Config to IP" is configured.'
    severity: medium
- id: '2.1'
  title: Ensure Sessions Timeout is set to less than or equal to 10 Minutes
  scoring: manual
  profile:
  - Level 1
  description: The session inactivity timeout setting represents the amount of time a user can be inactive before the user's
    session times out and closes. It only affects user browser sessions.
  rationale: Indefinite or even long session timeout window increase the risk of attackers abusing abandoned sessions
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'In GUI:

    - Navigate to System > User Manager

    - Click the Setting at the top.

    - Check on the ''Session Timeout'' field.'
  remediation: 'In GUI:

    - Navigate to System > User Manager

    - Click the Setting at the top.

    - set 10 in the ''Session Timeout'' field.

    - Click Save'
  checks:
  - type: manual_review
    info: 'In GUI:

      - Navigate to System > User Manager

      - Click the Setting at the top.

      - Check on the ''Session Timeout'' field.'
    severity: medium
