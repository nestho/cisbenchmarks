    info: Need to manually check each account.
    severity: medium
- id: '3.2'
  title: Ensure Maximum number of failed attempts allowed is set to 5 or fewer
  scoring: manual
  profile:
  - Level 1
  description: Only if Deny access after failed attempts is enabled does this take place. the maximum number of unsuccessful
    login attempts before a user is locked out. Future efforts will also fail after that many failed attempts in a row. The
    number of failed login attempts stops counting and is reset to zero when one attempt is successful.
  rationale: A legitimate user who has forgotten their password or a malicious user trying to access the system could both
    be to blame for persistent failed login attempts. To prevent brute force efforts to crack a user's password, this option
    should be as tight as it can be.
  impact: ''
  references: []
  page_start: 36
  audit_raw: 'In the GUI:

    - Navigate to System > Advanced

    - Check the ''Login Protection'' > ''Threshold'' Field'
  remediation: 'In the GUI:

    - Navigate to System > Advanced

    - Set 5 in the ''Login Protection'' > ''Threshold'' Field

    - Click ''Save'''
  checks:
  - type: manual_review
    info: 'In the GUI:

      - Navigate to System > Advanced

      - Check the ''Login Protection'' > ''Threshold'' Field'
    severity: medium
