- id: '2.4'
  title: Ensure known default accounts do not exist or disabled
  scoring: manual
  profile:
  - Level 1
  description: Deletes the known default accounts configured.
  rationale: 'In order to attempt access to known devices'' platforms, attackers use the available database of the known default
    accounts for each platform or Operating System. The known default accounts are often (without limiting to) the following:
    ''admin''.'
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'In GUI:

    - Navigate to System > User Manager > Users

    - View the default users'
  remediation: 'In GUI:

    - Navigate to System > User Manager > Users

    - Remove any default users that are not used.'
  checks:
  - type: manual_review
    info: 'In GUI:

      - Navigate to System > User Manager > Users

      - View the default users'
    severity: medium
- id: '3.1'
  title: Ensure 'Local Account status' is set to 'Disabled'
  scoring: manual
  profile:
  - Level 1
  description: Disable the 'Local User' account except for the admin user.
  rationale: Local accounts pose a threat to system security since the users are not manageable from the LDAP server.
  impact: ''
  references: []
  page_start: 35
  audit_raw: Need to manually check each account.
  remediation: Disabled Local User Account.
  checks:
