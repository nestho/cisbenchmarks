  title: Ensure there are no Unused Policies
  scoring: manual
  profile:
  - Level 1
  description: Ensure that there are no firewall policies that are unused
  rationale: Unused policies may provide unintended or anticipated access to services or hosts.
  impact: ''
  references: []
  page_start: 50
  audit_raw: Review all Firewall policies for use and validate the purpose of the policy.
  remediation: Disable and then delete any unused firewall policies.
  checks:
  - type: manual_review
    info: Review all Firewall policies for use and validate the purpose of the policy.
    severity: medium
- id: 4.1.5
  title: Ensure Logging is Enable for All Firewall Rules
  scoring: manual
  profile:
  - Level 1
  description: Ensure all firewall rules have logging enable.
  rationale: The event log of firewall rules helps in identifying the allowed and blocked traffic and also helps in troubleshooting
    and forensic investigation. It is always good to enable logging for all the firewall rules, but by logging multiple firewall
    rules results in a huge log files, which requires huge disk space and management operations. Logs play an important role
    in security auditing, incident response, system maintenance and forensic investigation, and should be configured as per
    the business needs.
  impact: ''
  references: []
  page_start: 51
  audit_raw: 'In the GUI:

    - Navigate to Status > System Logs > Settings

    - Verify Desired Logging Options are enabled'
  remediation: 'In the GUI:

    - Navigate to Status > System Logs > Settings

    - Check Desired Logging Options to enable.'
  checks:
  - type: manual_review
    info: 'In the GUI:

      - Navigate to Status > System Logs > Settings

      - Verify Desired Logging Options are enabled'
    severity: medium
- id: 4.1.6
  title: Ensure ICMP Request is securely configured
  scoring: manual
  profile:
  - Level 1
  description: ICMP (Internet Control Message Protocol) is used by network devices to communicate with each other. While ICMP
    is essential for network management and troubleshooting, allowing all types of ICMP requests may increase the risk of
    attacks such as Ping Flood and ICMP Redirect. Therefore, it is recommended to securely configure the allowed types of
    ICMP requests on the firewall.
  rationale: Allowing all types of ICMP requests may increase the risk of attacks such as Ping Flood and ICMP Redirect. To
    mitigate these risks, it is recommended to securely configure the allowed types of ICMP requests on the firewall.
  impact: ''
  references: []
  page_start: 53
  audit_raw: 'In GUI:

    - Navigate to Firewall > Rules

    - Review the firewall rules to determine if any ICMP request rules are

    present.

    - Review the firewall rules to determine if any ICMP request rules are

    present.

    - Check the configured ICMP request types for each rule to ensure that only

    necessary types are allowed'
  remediation: 'In GUI:

    - Navigate to Firewall > Rules

    - Review the firewall rules to determine if any ICMP request rules are

    present.

    - Review the firewall rules to determine if any ICMP request rules are

    present.

    - Check the configured ICMP request types for each rule to ensure that only

    necessary types are allowed'
  checks:
  - type: manual_review
    info: 'In GUI:

      - Navigate to Firewall > Rules

      - Review the firewall rules to determine if any ICMP request rules are

      present.

      - Review the firewall rules to determine if any ICMP request rules are

      present.

      - Check the configured ICMP request types for each rule to ensure that only

      necessary types are allowed'
    severity: medium
- id: '5.1'
  title: SNMP Policy 5.1.1 Ensure SNMP traps receivers is set
  scoring: manual
  profile:
  - Level 1
  description: Enables SNMP traps receivers where traps are sent.
  rationale: The purpose of the SNMP service is to monitor in real-time the events occurring on systems in order to meet the
    security requirement of the availability of systems and services. The traps are SNMP notifications sent to the NMS or
    SNMP traps receivers and should be enabled in order to be sent and processed by the NMS. The NMS or SNMP traps receivers
    will then provide a comprehensive aggregation and reporting of events generated, thus helping the administrator. Additionally,
    the add on package NET-SNMP (when configured appropriately) can satisfy this as well.
  impact: ''
  references: []
  page_start: 56
  audit_raw: 'In GUI:

    - Navigate to Services > SNMP.

    - Check "SNMP Traps Enable" is enabled.

    - Check on the "SNMP Trap Settings" is configured.'
  remediation: 'In GUI:

    - Navigate to Services > SNMP.

    - Check "SNMP Traps Enable" is enable.

    - Configured the "SNMP Trap Settings" value.

    - CLIck Save'
  checks:
  - type: manual_review
    info: 'In GUI:

      - Navigate to Services > SNMP.

      - Check "SNMP Traps Enable" is enabled.

      - Check on the "SNMP Trap Settings" is configured.'
    severity: medium
- id: 5.1.2
  title: Ensure SNMP traps is enabled
  scoring: manual
  profile:
  - Level 1
  description: Enables SNMP traps to be sent to the Network Management Station (NMS)
  rationale: The purpose of the SNMP service is to monitor in real-time the events occurring on systems in order to meet the
    security requirement of the availability of systems and services. The traps are SNMP notifications sent to the NMS and
    should be enabled in order to be sent and processed by the NMS. The NMS will then provide a comprehensive aggregation
    and reporting of events generated, thus helping the administrator.
  impact: ''
  references: []
