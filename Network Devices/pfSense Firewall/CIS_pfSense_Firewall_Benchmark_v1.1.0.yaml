benchmark:
  id: cis-pfsense-firewall-benchmark
  title: CIS pfSense Firewall Benchmark
  version: 1.1.0
  technology: pfSense Firewall
  category: Network Devices
  os: pfSense Firewall
  source_pdf: CIS_pfSense_Firewall_Benchmark_v1.1.0.pdf
  total_pages: 92
  controls_count: 33
controls:
- id: '1.1'
  title: Ensure SSH warning banner is configured
  scoring: manual
  profile:
  - Level 1
  description: Before authentication is allowed, a file containing its contents must be provided to the remote user, as specified
    by the Banner argument.
  rationale: Banners are used to inform users who are connected of the specific site's connection rules. The prosecution of
    computer system intruders may be aided by the display of a warning message prior to the normal user login.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'In the CLI:

    Run the following command and verify that output should contain ''Banner'' parameter:

    grep "^Banner" /etc/ssh/sshd_config'
  remediation: 'In the CLI:

    Edit the /etc/ssh/sshd_config file to set the parameter as follows:

    Banner /etc/issue.net'
  checks:
  - type: command
    command: grep "^Banner" /etc/ssh/sshd_config
    expected: 'Run the following command and verify that output should contain ''Banner'' parameter:'
    severity: medium
    info: 'In the CLI:

      Run the following command and verify that output should contain ''Banner'' parameter:

      grep "^Banner" /etc/ssh/sshd_config'
- id: '1.2'
  title: Ensure AutoConfigBackup is enable
  scoring: manual
  profile:
  - Level 1
  description: Making a backup before and after each large change or series of changes, as well as after each little change,
    is the recommended practice. A first backup is typically prepared in case the change being done has unfavorable repercussions.
  rationale: An after-the-fact backup is taken after evaluating the change and ensuring it had the intended outcome. Periodic
    backups are also helpful, regardless of changes, especially in cases where a manual backup may be missed.
  impact: ''
  references:
  - 1. https://docs.netgate.com/pfsense/en/latest/backup/autoconfigbackup.html
  page_start: 15
  audit_raw: 'In the GUI.

    - Navigate to Services > Auto Config Backup.'
  remediation: 'In the GUI.

    - Navigate to Services > Auto Config Backup.

    - CLIck the Setting at the top.

    - Check on the Enable ACB.

    - CLIck Save'
  checks:
  - type: manual_review
    info: 'In the GUI.

      - Navigate to Services > Auto Config Backup.'
    severity: medium
- id: '1.3'
  title: Ensure 'Message Of The Day (MOTD)' is set
  scoring: manual
  profile:
  - Level 1
  description: Sets the MOTD message.
  rationale: Network banners are electronic messages that provide notice of legal rights to users of computer networks. From
    a legal standpoint, banners have four primary functions. • First, banners may be used to generate consent to real-time
    monitoring under Title III. • Second, banners may be used to generate consent to the retrieval of stored files and records
    pursuant to ECPA. • Third, in the case of government networks, banners may eliminate any Fourth Amendment "reasonable
    expectation of privacy" that government employees or other users might otherwise retain in their use of the government's
    network under O'Connor v.
  impact: ''
  references: []
  page_start: 17
  audit_raw: 'In pfSense Shell type:

    cat /etc/motd'
  remediation: 'In pfSense Shell:

    Type ''Message Of The Day (MOTD)'' message here

    vi /etc/motd'
  checks:
  - type: command
    command: cat /etc/motd
    expected: ''
    severity: medium
    info: 'In pfSense Shell type:

      cat /etc/motd'
- id: '1.4'
  title: Ensure Hostname is set
  scoring: manual
  profile:
  - Level 1
  description: Changes the device default hostname.
  rationale: The device hostname is crucial for asset inventory and identification as a security need, as well as for the
    deployment of public keys and certificates and for comparing logs from various systems while handling an issue.
  impact: ''
  references:
  - 1. https://docs.netgate.com/pfsense/en/latest/config/general.html
  page_start: 19
  audit_raw: 'In the CLI:

    hostname

    In the GUI:

    - Navigate to System > General Setup

    - Check the Hostname Field'
  remediation: 'In the GUI:

    - Navigate to System > General Setup

    - Update the field ''Hostname'' with the new hostname, and CLIck "Save"'
  checks:
  - type: manual_review
    info: 'In the CLI:

      hostname

      In the GUI:

      - Navigate to System > General Setup

      - Check the Hostname Field'
    severity: medium
- id: '1.5'
  title: Ensure DNS server is configured
  scoring: manual
  profile:
  - Level 1
  description: You must specify the main DNS server for your system in order to enable DNS lookups. Additionally, supplementary
    and third-party DNS servers can be specified. The system uses the main name server to resolve host names. The system examines
    the secondary name server, and if required, the tertiary, if a failure or time-out occurs.
  rationale: The purpose is to perform the resolution of system hostnames to Internet Protocol (IP) addresses.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'In the GUI:

    - Navigate to System > General Setup

    - Check the ''DNS Servers'' Field in ''DNS Server Settings'' table'
  remediation: 'In the GUI:

    - Navigate to System > General Setup

    - Update the field DNS Servers'' with the Your DNS Server, and CLIck "Save"'
  checks:
  - type: manual_review
    info: 'In the GUI:

      - Navigate to System > General Setup

      - Check the ''DNS Servers'' Field in ''DNS Server Settings'' table'
    severity: medium
- id: '1.6'
  title: Ensure IPv6 is disabled if not used
  scoring: manual
  profile:
  - Level 1
  description: Although IPv6 has many advantages over IPv4, not all organizations have IPv6 or dual stack configurations implemented.
  rationale: If IPv6 or dual stack is not to be used, it is recommended that IPv6 be disabled to reduce the attack surface
    of the system.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'In the CLI:

    cat /etc/sysctl.conf

    check below entries:

    • net.ipv6.conf.all.disable_ipv6=1

    • net.ipv6.conf.default.disable_ipv6=1

    • net.ipv6.conf.lo.disable_ipv6 = 1

    In the GUI:

    Navigate to System > Advanced > Networking

    Check if ''Allow IPv6'' is checked.'
  remediation: 'In the CLI:

    Add below in the `/etc/sysctl.conf` file and reboot.

    - net.ipv6.conf.all.disable_ipv6=1

    - net.ipv6.conf.default.disable_ipv6=1

    - net.ipv6.conf.lo.disable_ipv6 = 1

    In the GUI:

    Navigate to System > Advanced > Networking

    Uncheck ''Allow IPv6'''
  checks:
  - type: command
    command: cat /etc/sysctl.conf
    expected: ''
    severity: medium
    info: 'In the CLI:

      cat /etc/sysctl.conf

      check below entries:

      • net.ipv6.conf.all.disable_ipv6=1

      • net.ipv6.conf.default.disable_ipv6=1

      • net.ipv6.conf.lo.disable_ipv6 = 1

      In the GUI:

      Navigate to System > Advanced > Networking

      Check if ''Allow IPv6'' is checked.'
- id: '1.7'
  title: Ensure 'DNS Rebind Check' is unchecked
  scoring: manual
  profile:
  - Level 1
  description: Ensure that the 'DNS Rebind Check' feature is unchecked to protect against DNS rebinding attacks.
  rationale: Attackers can use DNS rebinding to exploit a DNS server's response to a domain name query that resolves to a
    private IP address. This could provide a hacker access to private network resources that shouldn't be made available to
    the general public. To defend against this kind of attack, pfSense's "DNS Rebind Check" function disables private IP responses
    from DNS servers. As advised in the CIS benchmark, disabling this feature would expose the system to DNS rebinding attacks.
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'In the GUI

    - Navigate to System > Advance

    - Check the ''DNS Rebind Check'' Field'
  remediation: 'In the GUI

    - Navigate to System > Advance

    - Uncheck on ''DNS Rebind Check'' Field'
  checks:
  - type: manual_review
    info: 'In the GUI

      - Navigate to System > Advance

      - Check the ''DNS Rebind Check'' Field'
    severity: medium
- id: '1.8'
  title: Ensure Web Management is Set to use HTTPS
  scoring: manual
  profile:
  - Level 1
  description: Web Admin Management Portal should only be accessed using HTTPS Protocol.
  rationale: HTTP transmits all data (including passwords) in clear text over the network and provides no assurance of the
    identity of the hosts involved. Because of this HTTP should never be used for sensitive tasks such as managing network
    devices or entering login credentials and HTTPS should be configured for Web Portal Management instead
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'In the GUI:

    - Navigate to System > Advance > Admin Access

    - Check the ''webConfigurator'' Table for HTTPS Enable.'
  remediation: 'In the GUI:

    - Navigate to System > Advanced > Admin Access

    - Select ''HTTPS'' in the ''webConfigurator''.

    - CLIck ''Save'''
  checks:
  - type: manual_review
    info: 'In the GUI:

      - Navigate to System > Advance > Admin Access

      - Check the ''webConfigurator'' Table for HTTPS Enable.'
    severity: medium
- id: '1.9'
  title: Ensure a synchronized High Availability peer is configured
  scoring: manual
  profile:
  - Level 1
  description: Ensure a High Availability peer is fully synchronized and in a passive or active state.
  rationale: To ensure availability of both the firewall and the resources it protects, a High Availability peer is required.
    In the event a single firewall fails, or when maintenance such as a software update is required, the HA peer can be used
    to automatically fail over session states and maintain overall availability
  impact: ''
  references: []
  page_start: 27
  audit_raw: 'In the GUI:

    - Navigate to System > High Avail. Sync

    - Check "Synchronize Config to IP" is configured.'
  remediation: 'In the GUI:

    - Navigate to System > High Avail. Sync

    - Setup each field and Hit Save'
  checks:
  - type: manual_review
    info: 'In the GUI:

      - Navigate to System > High Avail. Sync

      - Check "Synchronize Config to IP" is configured.'
    severity: medium
- id: '2.1'
  title: Ensure Sessions Timeout is set to less than or equal to 10 Minutes
  scoring: manual
  profile:
  - Level 1
  description: The session inactivity timeout setting represents the amount of time a user can be inactive before the user's
    session times out and closes. It only affects user browser sessions.
  rationale: Indefinite or even long session timeout window increase the risk of attackers abusing abandoned sessions
  impact: ''
  references: []
  page_start: 29
  audit_raw: 'In GUI:

    - Navigate to System > User Manager

    - CLIck the Setting at the top.

    - Check on the ''Session Timeout'' field.'
  remediation: 'In GUI:

    - Navigate to System > User Manager

    - CLIck the Setting at the top.

    - set 10 in the ''Session Timeout'' field.

    - CLIck Save'
  checks:
  - type: manual_review
    info: 'In GUI:

      - Navigate to System > User Manager

      - CLIck the Setting at the top.

      - Check on the ''Session Timeout'' field.'
    severity: medium
