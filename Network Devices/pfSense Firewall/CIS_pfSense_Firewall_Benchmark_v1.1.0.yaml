- id: '2.4'
  title: Ensure all default accounts are either disabled or utilize strong passwords
  scoring: manual
  profile:
  - Level 1
  description: 'Disable the known default accounts configured. Note: The default admin account must remain enabled for high
    availability synchronization to work. Disabling it could cause issues.'
  rationale: Default accounts are accounts with predefined usernames and passwords that are typically included with software
    and hardware devices. Attackers often target default accounts because they are widely known and can be used to gain unauthorized
    access to a system. To prevent unauthorized access, all default accounts should either be disabled or have their passwords
    changed.
  impact: ''
  references: []
  page_start: 33
  audit_raw: 'In GUI:

    - Navigate to System > User Manager > Users

    - View the default users'
  remediation: 'In GUI:

    - Navigate to System > User Manager > Users

    - Remove any default users that are not used.

    Note: The default admin account must remain enabled for high availability

    synchronization to work. Disabling it could cause issues.'
  checks:
  - type: manual_review
    info: 'In GUI:

      - Navigate to System > User Manager > Users

      - View the default users'
    severity: medium
- id: '3.1'
  title: Ensure 'Local Account status' is set to 'Disabled'
  scoring: manual
  profile:
  - Level 1
  description: Disable the 'Local User' account except for the admin user.
  rationale: Local accounts pose a threat to system security since the users are not manageable from the LDAP server.
  impact: ''
  references: []
  page_start: 36
  audit_raw: Need to manually check each account.
  remediation: Disabled Local User Account.
  checks:
  - type: manual_review
    info: Need to manually check each account.
    severity: medium
- id: '3.2'
  title: Ensure Login Protection Threshold is set to 30 or less
  scoring: manual
  profile:
  - Level 1
  description: The Login Protection Threshold is a score-based system that helps to prevent unauthorized access to the pfSense
    firewall. This score is based on various criteria, including the number of unsuccessful login attempts from a specific
    IP address. This control ensures that the Login Protection Threshold is set to a value of 30 or less.
  rationale: Setting the Login Protection Threshold to a value of 30 or less helps to prevent attackers from brute-forcing
    their way into the system. The default value is 30, and this is a reasonable value for most situations. By limiting the
    number of unsuccessful login attempts, the system can protect against unauthorized access and improve security.
  impact: ''
  references: []
  page_start: 37
  audit_raw: 'In the GUI:

    - Navigate to System > Advanced

    - Check the ''Login Protection'' > ''Threshold'' Field'
  remediation: 'In the GUI:

    - Navigate to System > Advanced

    - Set 30 in the ''Login Protection'' > ''Threshold'' Field

    - CLIck ''Save'''
  checks:
  - type: manual_review
    info: 'In the GUI:

      - Navigate to System > Advanced

      - Check the ''Login Protection'' > ''Threshold'' Field'
    severity: medium
