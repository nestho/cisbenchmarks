- id: 5.5.1
  title: Ensure that OpenVPN use strong ciphers or hashing algorithms
  scoring: manual
  profile:
  - Level 1
  description: This rule aims to prevent the use of weak cryptographic algorithms in OpenVPN, which could be exploited by
    attackers to compromise the confidentiality, integrity, and availability of the VPN traffic. Specifically, this rule requires
    that only strong and secure cryptographic ciphers and hashing algorithms are used in OpenVPN.
  rationale: Weak cryptographic algorithms are more susceptible to attacks such as brute-force attacks, known-plaintext attacks,
    and man-in-the-middle attacks. By ensuring that only strong cryptographic algorithms are used in OpenVPN, the VPN traffic
    will be better protected against unauthorized access and modification.
  impact: Implementing this rule may impact the performance of the OpenVPN service, as strong cryptographic algorithms can
    be more computationally intensive than weaker ones. However, this impact can be minimized by selecting the appropriate
    cryptographic algorithms for the underlying hardware and network environment.
  references: []
  page_start: 73
  audit_raw: ''
  remediation: 6 Logging
