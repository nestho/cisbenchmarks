- id: 5.1.3
  title: Ensure that the add-on package NET-SNMP is installed and configured securely
  scoring: manual
  profile:
  - Level 2
  description: The add-on package NET-SNMP provides Simple Network Management Protocol (SNMP) functionality on pfSense. SNMP
    is used for network management and monitoring, allowing administrators to collect and view information about devices on
    the network. This rule ensures that the NET-SNMP package is installed and securely configured.
  rationale: SNMP is a widely used protocol for network management and monitoring, and it is important to ensure that it is
    securely configured on pfSense. If SNMP is not properly secured, it can allow unauthorized access to network devices and
    sensitive information. By ensuring that the NET-SNMP package is installed and configured securely, administrators can
    monitor network devices while also maintaining the security of their network.
