  rationale: the Allow access again after the time setting determines the number of seconds.
  impact: ''
  references: []
  page_start: 39
  audit_raw: 'In GUI:

    - Navigate to System > Advanced > Admin Access

    - Check the ''Login Protection'' options.

    - Check ''Blocktime'' value is greater than 300 seconds.'
  remediation: 'In GUI:

    - Navigate to System > Advanced > Admin Access

    - set the ''Login Protection'' options.

    - set ''Blocktime'' value to 300.

    - CLIck Save'
  checks:
  - type: manual_review
    info: 'In GUI:

      - Navigate to System > Advanced > Admin Access

      - Check the ''Login Protection'' options.

      - Check ''Blocktime'' value is greater than 300 seconds.'
    severity: medium
- id: '3.4'
  title: Ensure default password of admin is changed
  scoring: manual
  profile:
  - Level 1
  description: To assist users in changing the default password for 'admin' account.
  rationale: Using default passwords for the 'admin' account could cause a compromise to the system.
  impact: Failing to change the default 'admin' account's password creates high risk to the system as the 'admin' account
    may be abused by unauthorized users, allowing them full root access to the system.
  references: []
  page_start: 40
  audit_raw: 'Try to login to the GUI with:

    Username: admin

    Password: pfsense'
  remediation: 'In the GUI:

    - Navigate to System > User Manager

    - CLIck the Pencil Icon under ''Actions''

    - Change the password of the default ''admin'' user account.

    - CLIck ''Save'' at the bottom of the page.'
  checks:
  - type: manual_review
    info: 'Try to login to the GUI with:

      Username: admin

      Password: pfsense'
    severity: medium
- id: 4.1.1
  title: Ensure no Allow Rule with Any in Destination Field present in the Firewall Rules
  scoring: manual
  profile:
  - Level 1
  description: The Firewall Rules with Any in Source field allows all the IP Addresses of the Network to access the specified
    destination configured in the Firewall rules for specific services.
  rationale: In any properly designed and implemented Milner Firewall architecture the connection that loads the service should
    be explicitly allowed from the IP source address to the specific IP destination address. This services abolishes the chances
    of an exploit because of service misconfigurations.
  impact: ''
  references: []
  page_start: 44
  audit_raw: 'Verify there are no allowed rules present in the firewall which has Any used in the

    Destination field

    In CLI:

    pfctl -sr'
  remediation: Delete or Disable the rule from the firewall which has Any used in the Destination field.
  checks:
  - type: manual_review
    info: 'Verify there are no allowed rules present in the firewall which has Any used in the

      Destination field

      In CLI:

      pfctl -sr'
    severity: medium
- id: 4.1.2
  title: Ensure no Allow Rule with Any in Source field present in the Firewall Rules
  scoring: manual
  profile:
  - Level 1
  description: The Firewall Rules with Any in the Destination field allows accessing all the IP Addresses of Network from
    specified Sources configured in the Firewall rules for specific services
  rationale: Ideally, the traffic should be explicitly allowed from the specific Source to specific Destination for the required
    services. This provides better control over the traffic passes through the firewall and reduce the chances of an exploit
    because of service misconfiguration.
  impact: ''
  references: []
  page_start: 46
  audit_raw: 'Verify there are no allowed rules present in the firewall which has Any used in the

    Source field. If there is any such rule present in the firewall, it should have a business

    justification and also it should be documented

    In CLI:

    pfctl -sr'
  remediation: Delete the rule from the firewall which has Any used in the Source field.
  checks:
  - type: manual_review
    info: 'Verify there are no allowed rules present in the firewall which has Any used in the

      Source field. If there is any such rule present in the firewall, it should have a business

      justification and also it should be documented

      In CLI:

      pfctl -sr'
    severity: medium
- id: 4.1.3
  title: Ensure no Allow Rule with Any in Services field present in the Firewall Rules
  scoring: manual
  profile:
  - Level 1
  description: The Firewall Rules with Any in the Service field allows accessing all the Services from specified Source to
    specified Destination configured in the Firewall rules.
  rationale: Many services, including telnet, FTP, and TFTP, have security problems. Attackers can utilize these services
    to their advantage in order to access computers, obtain credentials, or launch DoS attacks. These services must be set
    up in accordance with the requirements of the company.
  impact: ''
  references: []
  page_start: 48
  audit_raw: 'Verify there are no allowed rules present in the firewall which has Any used in the

    Service

    field.

    In CLI:

    pfctl -sr'
  remediation: Delete the rule from the firewall which has Any used in the Service field.
  checks:
  - type: manual_review
    info: 'Verify there are no allowed rules present in the firewall which has Any used in the

      Service

      field.

      In CLI:

      pfctl -sr'
    severity: medium
