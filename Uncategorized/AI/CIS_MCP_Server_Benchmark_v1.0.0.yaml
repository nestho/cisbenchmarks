      behavior is disabled, so project-scoped server definitions are not enabled automatically.

      Then perform a behavioral test: in a throwaway workspace, add a benign projectscoped server definition, open the workspace
      with the client, and confirm the client does

      not enable or launch that server without presenting an e'
- id: 4.1.3
  title: Ensure Elicitation requests are consented, redacted, and identity-bound
  scoring: manual
  profile:
  - Level 1
  description: The client presents each server-initiated elicitation with clear attribution of the requesting server, provides
    decline and cancel options, lets the user review form responses before they are sent, and requires an explicit user decision
    before any form data is submitted or any URL is navigated to. Redaction filters remove personally identifiable information,
    secrets, and other sensitive data from context surfaced during an elicitation exchange, and the client records that the
    redaction check ran. Serverinitiated elicitation is rate-limited. Each elicitation event is logged with the requesting
    server identity, the mode, a request identifier, the user's decision and its source, the redaction result, and the mode-specific
    fields. The 2026-07-28 specification sets two hard requirements. First, servers do not use form-mode elicitation to request
    secrets such as passwords, API keys, access tokens, or payment credentials, and use URL mode for those interactions. Second,
    for URLmode flows the server securely associates any stored state with the individual user and verifies that the completing
    user is the one for whom the elicitation was generated, deriving identity from MCP authorization credentials where possible,
    to prevent phishing-based account takeover.
  rationale: Elicitation is the path by which a server solicits information from the user. Without consent gates and clear
    server identity, a compromised or malicious server can prompt the user for data under a misleading pretext. Form-mode
    elicitation exposes its data to the client and model, so using it for secrets would leak them. URL mode keeps the data
    between the user and the server, which is why the specification requires it for sensitive interactions. The URL-mode same-user
    check closes a phishing path where an attacker triggers an elicitation and tricks a different user into completing it,
    binding the resulting tokens to the wrong identity. Rate limits prevent a server from flooding the user with prompts,
    which would otherwise cause denial-of-service or consent fatigue.
  impact: Consent gates add small UX overhead to server-initiated elicitation, and redaction adds minimal computational overhead.
    Page 137
  references:
  - '1. MCP specification (Client Features / Elicitation):'
  - https://modelcontextprotocol.io/specification/2026-07-28/client/elicitation
  - '2. MCP specification (security best practices):'
  - https://modelcontextprotocol.io/docs/2026-0728/tutorials/security/security_best_practices
  - https://modelcontextprotocol.io/seps/2322-MRTR
  page_start: 137
  audit_raw: "Inspect the elicitation logs for an explicit user decision, a completed redaction check,\nand the mode-specific\
    \ fields, and confirm by configuration review that form-mode\nelicitation cannot request secrets, that such requests use\
    \ URL mode, that URL-mode\nflows verify the completing user, and that rate limiting is applied. Set the field names to\n\
    match the deployment's log schema if they differ. Run the following command:\nLOG=\"<MCP_AUDIT_LOG>\"\ncommand -v jq >/dev/null\
    \ 2>&1 || { echo \"ERROR: jq is required and not installed\n(cannot verify)\"; exit 0; }\n[ -s \"$LOG\" ] || { echo \"\
    ERROR: audit log <MCP_AUDIT_LOG> is missing or empty (cannot\nverify)\"; exit 0; }\nevents=$(grep -E '\"event\":\"elicitation\"\
    ' \"$LOG\")\nn=$(printf '%s\\n' \"$events\" | grep -c .)\n[ \"$n\" -gt 0 ] || { echo \"REVIEW: no elicitation events found\
    \ (control not\nevidenced)\"; exit 0; }\nprintf '%s\\n' \"$events\" | jq -e . >/dev/null 2>&1 || { echo \"ERROR: elicitation\n\
    records are not parseable (cannot verify)\"; exit 0; }\nbad=$(printf '%s\\n' \"$events\" | jq -c '\n select(\n (.server_identity==null\
    \ or .server_identity==\"\") or\n (((.mode//\"\")==\"form\" or (.mode//\"\")==\"url\")|not) or\n (((.decision//\"\")|test(\"\
    ^(accepted|declined|cancelled)$\"))|not) or\n (.decision_source!=\"user\") or\n (.redaction_checked!=true) or\n (.mode==\"\
    form\" and (.requestedSchema==null)) or\n (.mode==\"url\" and ((.url//\"\")==\"\" and (.target_origin//\"\")==\"\"))\n\
    \ )')\nif [ -n \"$bad\" ]; then\n echo \"FAIL: elicitation events without an explicit user decision, a completed\nredaction\
    \ check, a valid mode, or the mode-specific fields\"\nelse\n echo \"PASS: every elicitation event carries server identity,\
    \ mode, an explicit user\ndecision, a completed redaction check, and the mode-specific fields\"\nfi\nThis Recommendation\
    \ is compliant when the audit reports PASS and the configuration\nreview confirms the form-mode secret prohibition, URL\
    \ mode for those requests, URLmode same-user verification, and rate limiting.\n Page 138"
  remediation: 'These are host and server configuration settings, with no portable command. Configure

    the host to present server-initiated elicitation with clear server attribution and to require

    an explicit user decision before form data is submitted or a URL is navigated to. Apply a

    redaction filter that removes API keys, passwords, and common PII formats from any

    surfaced context, and record that the redaction check ran. Rate-limit server-initiated

    elicitation. In the server''s elicitation handling, route any request for secrets through URL

    mode and never form mode, and for URL-mode flows securely associate any stored

    state with the individual user and verify that the same user completes the flow, deriving

    identity from MCP authorization credentials where possible. Log every elicitation event

    with the server identity, the mode, the user''s decision and its source, the redaction

    result, and the mode-specific fields (requestedSchema for form mode, the target

    origin or URL for URL mode).'
  checks:
  - type: command
    command: n=$(printf '%s\n' "$events" | grep -c .)
    expected: ''
    severity: medium
    info: 'Inspect the elicitation logs for an explicit user decision, a completed redaction check,

      and the mode-specific fields, and confirm by configuration review that form-mode

      elicitation cannot request secrets, that such requests use URL mode, that URL-mode

      flows verify the completing user, and that rate limiting is applied. Set the field names to

      match the deployment''s log schema if they differ. Run t'
- id: 4.1.4
  title: Ensure Sampling consent and redaction controls are implemented where Sampling is in use
  scoring: scored
  profile:
  - Level 2
  description: The host requires an explicit user decision before any server-initiated sampling request is forwarded to the
    model. Redaction filters remove personally identifiable information, secrets, and other sensitive data from context before
    it is included in a sampling payload, and the host records that the redaction check ran. Server-initiated sampling is
    rate-limited. Each sampling event is logged with the requesting server identity, a request identifier, the request type,
    the user's decision and its source, and the redaction result, without logging raw sensitive prompts. Under the 2026-07-28
    revision, the Sampling feature is deprecated. It is a client capability, advertised per request in _meta.io.modelcontextprotocol/clientCapabilities,
    and delivered through a Multi Round-Trip Request rather than the standalone sampling/createMessage method used before
    this revision. These controls apply to any deployment still using sampling, and the documented migration path is to integrate
    the LLM provider directly rather than relying on sampling.
  rationale: Sampling lets a server ask the host to send context to the model on the server's behalf. Without consent gates,
    a compromised server can drive that context, including credentials, internal data, or personal information, to the model
    without the user's knowledge. Without redaction, secrets and PII present in host context may be forwarded to an external
    model API. Without rate limits, a server can flood the host with sampling requests, creating denial-of-service or consent
    fatigue. Sampling is the most securitysensitive of the three features deprecated in the 2026-07-28 revision, which is
    why these controls remain important wherever it is still in use.
  impact: Consent gates add small UX overhead to server-initiated sampling, and redaction adds minimal computational overhead.
    Because sampling is deprecated, weigh migrating off it entirely rather than investing further in these controls. Page
    140
  references:
  - '1. MCP specification (Client Features / Sampling):'
  - https://modelcontextprotocol.io/specification/2026-07-28/client/sampling
  - '2. MCP specification (Deprecated Features):'
  - https://modelcontextprotocol.io/specification/2026-07-28/deprecated
  - https://modelcontextprotocol.io/seps/2577-deprecate-roots-sampling-and-logging
  page_start: 140
  audit_raw: "Inspect the sampling logs for an explicit user decision and a completed redaction check,\nand confirm by configuration\
