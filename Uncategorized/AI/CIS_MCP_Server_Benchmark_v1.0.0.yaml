    :\"2026-0728\",\"io.modelcontextprotocol/clientInfo\":{\"name\":\"cis-benchmarkaudit\",\"version\":\"1.0\"},\"io.modelcontextprotocol/clientCapabilities\"\
    :{}}}}'\nresp=$(curl -sS --connect-timeout 5 -m 10 -X POST \"$URL\" -H 'Content-Type:\napplication/json' -H 'Accept: application/json,\
    \ text/event-stream' -H 'MCP-ProtocolVersion: 2026-07-28' -H 'Mcp-Method: tools/call' -H \"Mcp-Name: $TOOL\" -d \"$body\"\
    \n2>/dev/null)\n[ -n \"$resp\" ] || { echo \"ERROR: no response to no-key tools/call probe\"; exit 0; }\nobj=$(printf\
    \ '%s' \"$resp\" | jq -c 'select(.jsonrpc) | select(.id==1)' 2>/dev/null |\nhead -n1)\n[ -n \"$obj\" ] || obj=$(printf\
    \ '%s\\n' \"$resp\" | sed -n 's/^data:[[:space:]]*//p' |\nhead -n1)\n[ -n \"$obj\" ] || { echo \"ERROR: no JSON-RPC response\
    \ with id 1 to no-key probe\"; exit\n0; }\nhaserr=$(printf '%s' \"$obj\" | jq -r 'has(\"error\")' 2>/dev/null)\niserr=$(printf\
    \ '%s' \"$obj\" | jq -r '.result.isError // empty' 2>/dev/null)\nif [ \"$haserr\" = \"true\" ] || [ \"$iserr\" = \"true\"\
    \ ]; then\n echo \"PASS: the server rejected a side-effecting call submitted without an\nidempotency key\"\nelse\n echo\
    \ \"FAIL: the server accepted and executed a side-effecting call with no\nidempotency key\"\nfi\nThen, to confirm the\
    \ key is bound to the request payload, run the following command:\n Page 214\nURL=\"<MCP_ENDPOINT>\"\nKEY=\"cis-audit-key-002\"\
    \nTOOL=\"<SIDE_EFFECTING_OR_TEST_TOOL>\"\nmkbody(){ printf\n'{\"jsonrpc\":\"2.0\",\"id\":%s,\"method\":\"tools/call\"\
    ,\"params\":{\"name\":\"%s\",\"arguments\":%s,\n\"_meta\":{\"io.modelcontextprotocol/protocolVersion\":\"2026-0728\",\"\
    io.modelcontextprotocol/clientInfo\":{\"name\":\"cis-benchmarkaudit\",\"version\":\"1.0\"},\"io.modelcontextprotocol/clientCapabilities\"\
    :{}}}}' \"$1\"\n\"$TOOL\" \"$2\"; }\nhdrs=(-H 'Content-Type: application/json' -H 'Accept: application/json, text/eventstream'\
    \ -H 'MCP-Protocol-Version: 2026-07-28' -H \"Idempotency-Key: $KEY\" -H 'McpMethod: tools/call' -H \"Mcp-Name: $TOOL\"\
    )\nr1=$(curl -sS --connect-timeout 5 -m 10 -X POST \"$URL\" \"${hdrs[@]}\" -d \"$(mkbody 1\n'{\"amount\":1}')\" 2>/dev/null)\n\
    r2=$(curl -sS --connect-timeout 5 -m 10 -X POST \"$URL\" \"${hdrs[@]}\" -d \"$(mkbody 2\n'{\"amount\":2}')\" 2>/dev/null)\n\
    [ -n \"$r1\" ] && [ -n \"$r2\" ] || { echo \"ERROR: server unreachable on one or both\nsubmissions\"; exit 0; }\nobj=$(printf\
    \ '%s' \"$r2\" | jq -c 'select(.jsonrpc)' 2>/dev/null | head -n1)\n[ -n \"$obj\" ] || obj=$(printf '%s\\n' \"$r2\" | sed\
    \ -n 's/^data:[[:space:]]*//p' | head\n-n1)\n[ -n \"$obj\" ] || { echo \"ERROR: no parseable response to the second submission\"\
    ; exit\n0; }\nhaserr=$(printf '%s' \"$obj\" | jq -r 'has(\"error\")' 2>/dev/null)\nif [ \"$haserr\" = \"true\" ]; then\n\
    \ echo \"PASS: the server rejected a reused idempotency key carrying a different\nrequest payload as a conflict\"\nelse\n\
    \ echo \"FAIL: the server returned a result for a reused key with a different payload,\nthe key is not bound to the request\
    \ fingerprint\"\nfi\nThen confirm from backend execution records that the side effect occurred exactly once\nacross the\
    \ duplicate submissions, and that a reuse under a different principal is denied.\nThis Recommendation is compliant when\
    \ a side-effecting tool requires an idempotency\nkey, a duplicate key with the same payload returns a cached result, and\
    \ a reused key\nwith a different payload is rejected as a conflict. Backend records must additionally\nconfirm the side\
    \ effect ran once and that a key reused under a different principal is\ndenied.\n Page 215"
  remediation: 'Add server middleware that requires an Idempotency-Key header for side-effecting

    tools, classified per the tool risk tiers of Recommendation 4.1.5. Key the deduplication

    store on the authenticated principal, the target server or resource, the tool name, the

    idempotency key, and a canonical fingerprint of the request arguments, with a time-tolive of at least 24 hours. Return
    the stored result when the same key arrives with the

    same fingerprint. Reject a reuse of the same key with a different fingerprint as an

