    $ncalls\" -eq 0 ]; then echo \"PASS (records): decisions are complete and\nexplicit. REVIEW (ordering): no tool_call events\
    \ in the log, decision-before-firstexecution not evidenced, confirm by review\"; exit 0; fi\nprintf '%s\\n' \"$calls\"\
