      'no-store' && echo 1) && has_private=$(printf '%s\n' "$tokens" | grep -Eqx 'private' && echo 1) && if ! printf '%s'
      "$code" | grep -Eq '^[0-9]+$'; then && elif ! printf '%s' "$ttl" | grep -Eq '^[0-9]+$'; then
    expected: ''
