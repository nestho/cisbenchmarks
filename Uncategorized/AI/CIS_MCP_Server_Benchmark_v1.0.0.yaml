    io.modelcontextprotocol/clientInfo\":{\"name\":\"cis-benchmarkaudit\",\"version\":\"1.0\"},\"io.modelcontextprotocol/clientCapabilities\"\
    :{}}}}')\njson=\"$resp\"\nprintf '%s' \"$json\" | jq -e . >/dev/null 2>&1 || json=$(printf '%s' \"$resp\" | sed -n\n's/^data:\
    \ //p' | head -n1)\nif [ -z \"$resp\" ]; then\n echo \"ERROR: no response from the MCP endpoint, baseline not written\"\
    \nelif ! printf '%s' \"$json\" | jq -e . >/dev/null 2>&1; then\n echo \"ERROR: response body is not JSON, baseline not\
    \ written\"\nelif printf '%s' \"$json\" | jq -e 'has(\"error\")' >/dev/null 2>&1; then\n echo \"ERROR: server/discover\
    \ rejected with code $(printf '%s' \"$json\" | jq -r\n'.error.code'), baseline not written\"\nelif ! printf '%s' \"$json\"\
    \ | jq -e '.result.capabilities | type ==\n\"object\"' >/dev/null 2>&1; then\n echo \"ERROR: no capability object retrieved,\
    \ baseline not written\"\nelse\n n=$(printf '%s' \"$json\" | jq -r \".result.capabilities | $LEAF\" | grep -c .)\n if\
    \ [ \"$n\" -eq 0 ]; then\n echo \"ERROR: the server advertises an empty capability set, baseline not written.\nIf an empty\
    \ set is the approved configuration, record it deliberately by writing {}\nto $BASELINE under change control\"\n else\n\
    \ printf '%s' \"$json\" | jq -S '.result.capabilities' > \"$BASELINE\"\n echo \"captured $n capability entries to $BASELINE\"\
    \n fi\nfi\nThe script refuses to write an empty baseline since a zero-entry baseline recorded\nwithout review passes every\
    \ later audit. If an empty set is genuinely approved, record it\nby writing {} to the baseline path under change control.\
    \ Otherwise, review the captured\nfile and commit it to the registry before treating it as approved. Re-capture any baseline\n\
    still in the earlier newline-delimited format, which the Audit otherwise reports as ERROR.\n Page 35\nDisable any capability\
    \ not in the baseline through the server's own configuration since a\nproxy cannot enforce capability advertisement. Document\
    \ intentional exceptions with\napprover, justification, and date, and re-establish the baseline whenever a version,\n\
    configuration, or extension change alters the advertised configuration, down to a nested\nsetting value.\nUnder the 2026-07-28\
    \ revision, the Logging capability is deprecated with a minimum\ntwelve-month support window, so Logging continues to\
    \ function during that window, but\ndo not approve it into a new baseline. Roots and Sampling are also deprecated, but\
    \ are\nclient capabilities and do not appear in a server's advertised set."
