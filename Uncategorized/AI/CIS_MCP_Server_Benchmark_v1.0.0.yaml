    \ is missing the MCP-Protocol-Version or Mcp-Method\nheader, is missing the Mcp-Name header on tools/call, resources/read,\
    \ or\nprompts/get, or whose header values disagree with the body after Base64 sentinelencoded values are decoded. Because\
    \ behavior varies by SDK version and adapter,\ndeploy a server build or SDK version that implements 2026-07-28 request\
    \ metadata\nvalidation and confirm the entry point enforces it with the Audit.\nAs a layered defense, the gateway can\
