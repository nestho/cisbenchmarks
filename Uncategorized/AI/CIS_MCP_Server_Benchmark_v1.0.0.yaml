    \ the baselined tool invocations, which is why a baselined tool is used.\nRun the following command to confirm a request\
    \ missing a required routing header is\nrejected with HTTP 400 and HeaderMismatch (-32020):\n Page 70\nURL=\"<MCP_ENDPOINT_URL>\"\
