- id: 4.2.1
  title: Ensure filesystem scope is restricted to least privilege and enforced by OS-level controls
  scoring: manual
  profile:
  - Level 1
  description: Each MCP server process is restricted to the minimum filesystem paths its declared functionality requires,
    and that restriction is enforced with OS-level access controls such as filesystem ACLs, mandatory access control policies
    (SELinux or AppArmor), or container bind mounts, which the kernel imposes regardless of server behavior. The intended
    scope may be expressed through MCP Roots or, under the 2026-07-28 revision where Roots is deprecated, through workspace
    paths passed as tool parameters or resource URIs, and how scope is expressed does not change the requirement. Whatever
    the expression mechanism, treat it as an advisory hint and do not rely on it for containment. The OS-level controls are
    the actual security boundary, and they enforce the same least-privilege scope at the kernel level.
  rationale: 'Any scope hint conveyed through the protocol, whether MCP Roots or a path passed as a tool parameter, is advisory:
    a server that ignores or mishandles it can access any file its OS user account can reach. The MCP specification is explicit
    that Roots are coordination hints, not a security boundary, and the same is true of paths passed as tool arguments. Only
    OS-level controls such as ACLs, SELinux or AppArmor, and container bind mounts are enforced by the kernel and cannot be
    bypassed by application code, which makes them the effective boundary. Scope hints help well-behaved servers stay in bounds.
    OS controls contain servers that do not.'
  impact: Narrowing scope and adding OS sandboxing may require refactoring file-access paths in server logic to stay within
    the approved set. Page 148
  references:
  - '1. MCP specification (Client Features / Roots):'
  - https://modelcontextprotocol.io/specification/2026-07-28/client/roots
  - '2. MCP specification (Deprecated Features):'
  - https://modelcontextprotocol.io/specification/2026-07-28/deprecated
  - https://modelcontextprotocol.io/seps/2577-deprecate-roots-sampling-and-logging
  page_start: 148
  audit_raw: "Review how the server's intended filesystem scope is expressed (MCP Roots, or under\nthe 2026-07-28 revision\
    \ where Roots is deprecated, workspace paths passed as tool\nparameters or resource URIs) and confirm the approved scope\
    \ is the minimum the\nserver's declared functionality requires. Then verify that OS-level controls deny the\nservice account\
    \ access outside that scope. Run the following command to confirm the\nservice account cannot read a chosen sensitive\
    \ path outside its approved scope,\npointing the probe at a path the remediation denies, for example a file under the\n\
    sensitive directory or a system secret such as /etc/shadow:\nSVC_ACCT=\"<MCP_SERVICE_ACCOUNT>\"\nOUT_OF_SCOPE=\"<SENSITIVE_PATH_OUTSIDE_SCOPE>\"\
    \ncommand -v sudo >/dev/null 2>&1 || { echo \"ERROR: sudo is required to switch to the\nservice account (cannot verify)\"\
    ; exit 0; }\nid \"$SVC_ACCT\" >/dev/null 2>&1 || { echo \"ERROR: service account\n<MCP_SERVICE_ACCOUNT> not found (cannot\
    \ verify)\"; exit 0; }\n[ -e \"$OUT_OF_SCOPE\" ] || { echo \"ERROR: probe path <SENSITIVE_PATH_OUTSIDE_SCOPE>\nnot found\
    \ (choose a sensitive path outside the approved scope)\"; exit 0; }\nsudo -n -u \"$SVC_ACCT\" true 2>/dev/null || { echo\
    \ \"ERROR: cannot switch to\n<MCP_SERVICE_ACCOUNT> via sudo (run as root or a sudoer), not a PASS\"; exit 0; }\nif sudo\
    \ -n -u \"$SVC_ACCT\" test -r \"$OUT_OF_SCOPE\"; then\n echo \"FAIL: service account can read $OUT_OF_SCOPE, a path outside\
    \ its approved\nscope\"\nelse\n echo \"PASS: service account cannot read $OUT_OF_SCOPE (this probed path only, not\nproof\
    \ of the whole deny-by-default boundary)\"\nfi\nA PASS covers only the probed path, so repeat against several representative\
    \ sensitive\npaths outside the approved scope. This Recommendation is compliant when the audit\nreports PASS on those\
    \ paths and a reviewer confirms that the approved scope is itself\nminimal and that the OS boundary denies access by default\
    \ rather than only on the\nprobed paths.\n Page 149"
  remediation: 'Enforce containment with a control that denies by default. The strongest options are a

    mandatory access control profile (AppArmor or SELinux) confining the process to its

    working set, or running the server in a mount namespace or container where only the

    work directory is bind-mounted in (read-only where writes are not needed) so paths

    outside it are not visible at all. POSIX ACLs are a useful supplement but are a grant

    mechanism, not a default-deny boundary. They constrain only the paths you name and

    do not remove the account''s standard-permission access to everything else. Where

    ACLs are used as a supplement, restrict the work directory, set a default ACL so newly

    created files inherit it, and apply targeted denies to known-sensitive directories. Run the

    following commands to apply the supplementary ACLs:

    setfacl -R -m u:<MCP_SERVICE_ACCOUNT>:rX <WORK_DIR>

    setfacl -R -d -m u:<MCP_SERVICE_ACCOUNT>:rX <WORK_DIR>

    setfacl -R -m u:<MCP_SERVICE_ACCOUNT>:--- <SENSITIVE_DIR>

    The MAC profile or bind-mount is the boundary, and the ACLs harden within it.'
  checks:
  - type: manual_review
    info: 'Review how the server''s intended filesystem scope is expressed (MCP Roots, or under

      the 2026-07-28 revision where Roots is deprecated, workspace paths passed as tool

      parameters or resource URIs) and confirm the approved scope is the minimum the

      server''s declared functionality requires. Then verify that OS-level controls deny the

      service account access outside that scope. Run the following command to confirm the

      service account cannot read a chosen sensitive path outside its approved scope,

      point'
    severity: medium
- id: 4.2.2
  title: Ensure MCP stdio server subprocess environment is restricted to the minimum required variables
  scoring: scored
  profile:
  - Level 1
  description: 'When spawning stdio MCP server subprocesses, the host constructs the subprocess environment from a documented
    allowlist of required variables rather than inheriting the full parent environment. Only variables required for the server''s
    declared functionality, as documented in the capability baseline, are forwarded, and all others are excluded by default.
    The allowlist is a per-server configuration artifact, reviewed whenever the server''s capability baseline changes. The
    host does not directly dereference an untrusted Resource URI or resource link through the browser, an OS protocol handler,
    or an arbitrary network fetcher unless the scheme and destination are explicitly permitted. A Resource URI is an identifier,
    and its scheme does not authorize local action. A file:// Resource URI identifies a resource that behaves like a filesystem
    but need not map to a physical local file, so the host reads it through the server with resources/read rather than opening
    a local path. The host distinguishes three handling paths. For MCP-mediated resource access, the host sends the URI to
    the MCP server in a resources/read request and does not dereference it locally. For direct external fetch or navigation,
    which the specification allows for https:// resources a client can load on its own, the host applies a scheme and destination
    allowlist, requires user confirmation for destinations that are not preapproved, and applies SSRF protections. For OS
    protocol handler invocation, the host defaults to deny unless the scheme is explicitly approved. The allowlist covers
    both Resource URIs returned directly by the server and URIs the model or client constructs from tool outputs. Where the
    MCP Apps extension (io.modelcontextprotocol/ui) is in use, the host renders all UI resource content inside a sandboxed
    execution context with a Content Security Policy constructed from, and never looser than, the domains declared in the
    resource''s metadata. The extension delivers HTML documents (MIME type text/html;profile=mcp-app, URI scheme ui://) that
    the host renders in a sandboxed iframe. The extension specification requires sandboxed rendering for all view content
    and requires the host to build the CSP from the declared csp metadata (connectDomains, resourceDomains, frameDomains,
    baseUriDomains). When that metadata is absent, a restrictive default applies (default-src ''none'', with frame-src ''none''
    and base-uri ''self'' where those are not declared). The host may restrict further but must not allow any undeclared external
    domain. Web-based hosts additionally interpose the sandbox proxy on a separate origin, as the extension specifies. The
    host logs the effective CSP applied to each rendered resource. Where the MCP Apps extension (io.modelcontextprotocol/ui)
    is in use, the host treats an app''s requested capabilities as default-deny, logs every message the app sends to the host,
    and requires explicit user consent for the high-risk channels. The extension lets a UI resource request the camera, microphone,
    geolocation, and clipboardWrite permissions and tells apps not to assume any are granted. The host does not honor a requested
    permission automatically. It grants one only on a recorded per-permission user decision and denies the rest by default.
    All View-to-host JSONRPC is auditable, so the host logs every app-to-host message, including ui/message, ui/update-model-context,
    ui/open-link, tools/call, and resources/read, with the requesting server identity. The extension leaves permessage consent
    to the host, so as a requirement beyond the extension, the host additionally gates the two high-risk channels behind explicit
    user consent: ui/message, which sends content to the host chat, and ui/update-modelcontext, which injects content into
    the model context. The host also enforces the _meta.ui.visibility declaration, keeping tools whose visibility omits "model"
    out of the agent''s tool list and rejecting an app tools/call for any tool whose visibility omits "app", so an app cannot
    invoke a tool it was not granted.'
  rationale: 'stdio servers run as subprocesses, and when a process spawns a child the operating system passes down the full
    parent environment by default unless the caller supplies a restricted one, so a server inherits the spawning process''s
    complete environment. This is runtime behavior of the host and the operating system, not something MCP defines. On developer
    workstations and CI hosts that environment commonly holds sensitive values: cloud credentials, personal API tokens, internal
    service credentials, and SSH key material. A malicious or compromised stdio server can read any inherited variable with
    no filesystem access or elevated privileges since the values are simply present in its environment. Constructing the subprocess
    environment from an allowlist limits what any one server can access to only what it was explicitly granted. A URI that
    the host directly dereferences without policy can trigger unintended behavior. A file: URI opened locally can expose filesystem
    contents to an attacker-controlled destination. A data: URI can carry content that triggers application handlers. A custom
    protocol handler can invoke a native application with attacker-supplied arguments. An https: URI fetched directly can
    be pointed at an internal address for server-side request forgery. These are risks of direct dereferencing, not of the
    Resource URI itself, which is why this Recommendation restricts local navigation and external fetch rather than the identifier
    a server returns for resources/read. The risk is compounded in agentic workflows where the model follows links without
    per-link human review. MCP Apps places a browser execution context, running HTML from the MCP server, inside the host
    application''s trust boundary. The extension''s own threat model names malicious HTML delivery, sandbox escape, unauthorized
    tool execution, and data exfiltration. The sandbox and the CSP are the containment boundary. With them, a malicious or
    compromised UI resource is confined to its frame and its declared destinations. Without them, it executes with the reach
    of the host page and can move data to arbitrary origins. The no-loosening rule matters as much as the sandbox itself,
    because a host that helpfully adds domains beyond the declaration turns the server''s auditable, reviewable declaration
    into a dead letter. Enforcing from declared metadata also makes exfiltration destinations enumerable in advance: a reviewer
    of a server''s UI resource can read exactly which origins its frames may contact. An MCP App runs in the host''s trust
    boundary and can ask for device access, inject content into the model''s context, send messages into the chat, and call
    tools. The ui/update-model-context channel is a direct prompt-injection vector because an untrusted UI resource can place
    text in front of the model. Default-deny permissions keep a compromised or over-eager app from silently reaching the camera,
    microphone, location, or clipboard. Because the extension makes all View-to-host communication auditable but leaves per-message
    consent to the host, the host logs every message for attribution and gates the two high-risk channels behind explicit
    consent, making context injection and chat insertion visible, attributable, and mediated rather than silent. Visibility
    enforcement stops an app from calling tools never meant to be reachable from a UI, which matters because app-invoked tool
    calls bypass the model and its own guardrails. Page 162'
  impact: Building and maintaining per-server allowlists is a moderate one-time effort per server. The protection against
    credential exfiltration from a compromised stdio server is substantial, especially in developer environments carrying
    many sensitive variables. Page 151 Friction is minimal for workflows that use only standard HTTPS resource links, and
    rises where a workflow relies on other schemes or on destinations that are not pre-approved. Page 154 UI resources that
    legitimately need external origins must declare them, and an undeclared destination breaks at render time. That breakage
    is intended and surfaces during server onboarding, rather than as silent exposure later. Web-based hosts take on the operational
    cost of the separate-origin sandbox proxy. Hosts that do not support the extension are unaffected, because the extension
    is optional and negotiated, and their tools degrade to text-only results. Page 159 Per-permission prompts and message
    consent add interaction cost when an app first requests a capability or injects context, though most read-only apps request
    nothing and proceed without friction. Enforcing visibility means an app that relies on calling a tool not visible to apps
    breaks, which is the intended containment and surfaces during onboarding. Hosts that do not support the extension are
    unaffected. Page 163
  references:
  - '1. MCP specification (Base Protocol / Transports / stdio):'
  - https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/stdio
  - '1. MCP specification (Server Features / Resources):'
  - https://modelcontextprotocol.io/specification/2026-07-28/server/resources
  - '2. MCP specification (security best practices, SSRF):'
  - https://modelcontextprotocol.io/docs/2026-0728/tutorials/security/security_best_practices
  - '1. MCP Extensions (Overview): https://modelcontextprotocol.io/extensions/overview'
  - '2. MCP Apps extension repository: https://github.com/modelcontextprotocol/extapps'
  - '1. MCP Apps extension repository: https://github.com/modelcontextprotocol/extapps'
  - '2. MCP Apps extension specification: https://github.com/modelcontextprotocol/extapps/blob/main/specification/2026-01-26/apps.mdx'
  page_start: 151
  audit_raw: "Inspect the actual environment of a running stdio server subprocess and confirm it\ncontains only the variables\
    \ on that server's documented allowlist, with no inherited\nsensitive variables. The allowlist file lists one approved\
    \ variable name per line. Run the\nfollowing command to validate the allowlist format and compare the subprocess\nenvironment\
    \ against it:\nPID=\"<STDIO_SERVER_PID>\"\nALLOW=\"<ALLOWLIST_FILE>\"\nif [ ! -r \"/proc/$PID/environ\" ]; then\n echo\
    \ \"ERROR: cannot read /proc/$PID/environ (wrong PID or insufficient privilege)\"\nelif [ ! -s \"$ALLOW\" ]; then\n echo\
    \ \"ERROR: allowlist file <ALLOWLIST_FILE> missing or empty (cannot verify)\"\nelse\n malformed=$(grep -vE '^[A-Za-z_][A-Za-z0-9_]*$'\
    \ \"$ALLOW\" | grep -v '^[[:space:]]*$'\n|| true)\n if [ -n \"$malformed\" ]; then\n echo \"REVIEW: allowlist contains\
    \ malformed entries (expect one valid environmentvariable name per line): $(printf '%s' \"$malformed\" | tr '\\n' ' ')\"\
    \n else\n vars=$(tr '\\0' '\\n' < \"/proc/$PID/environ\" | sed 's/=.*//' | sort -u)\n if [ -z \"$vars\" ]; then\n echo\
    \ \"ERROR: no environment read (empty result, not a PASS)\"\n else\n leaked=$(printf '%s\\n' \"$vars\" | grep -vxF -f\
    \ \"$ALLOW\" || true)\n if [ -z \"$leaked\" ]; then\n echo \"PASS: subprocess environment is within the allowlist\"\n\
    \ else\n echo \"FAIL: non-allowlisted variables present: $(printf '%s' \"$leaked\" | tr\n'\\n' ' ')\"\n fi\n fi\n fi\n\
    fi\nA FAIL listing a sensitive variable confirms the parent environment is leaking into the\nsubprocess. This Recommendation\
    \ is compliant when the audit reports PASS, meaning\nthe subprocess environment contains only allowlisted variables.\n\
    \ Page 152\nWhere the host exposes a direct-open surface for URIs, confirm it rejects a disallowed\nscheme while handling\
    \ an approved one, so the rejection is attributable to scheme\nfiltering. This tests the host's direct-navigation policy,\
    \ it does not test\nresources/read, and it does not imply that file:// Resource URIs are invalid. Run\nthe following command\
    \ against a host direct-open surface, which probes both an\napproved https URI and a disallowed file: URI and sends each\
    \ URI as a percentencoded query parameter so a query-based scheme filter such as the nginx example in\nthe remediation\
    \ can inspect it:\nCTRL=\"<HOST_RESOURCE_OPEN_URL>\"\nAPPROVED_URI=\"<APPROVED_HTTPS_URI>\"\nDISALLOWED_URI=\"file:///etc/passwd\"\
    \nallow=$(curl -sS -G --connect-timeout 3 -m 6 -o /dev/null -w '%{http_code}' --dataurlencode \"uri=$APPROVED_URI\" \"\
    $CTRL\")\ndeny=$(curl -sS -G --connect-timeout 3 -m 6 -o /dev/null -w '%{http_code}' --dataurlencode \"uri=$DISALLOWED_URI\"\
    \ \"$CTRL\")\nif [ \"$allow\" = \"000\" ] || [ \"$deny\" = \"000\" ]; then\n echo \"ERROR: control surface unreachable\
    \ (cannot verify)\"\nelif printf '%s' \"$deny\" | grep -qE '^2'; then\n echo \"FAIL: disallowed scheme accepted (file:\
    \ returned $deny)\"\nelif printf '%s' \"$allow\" | grep -qE '^(4|5)'; then\n echo \"REVIEW: approved https scheme also\
    \ rejected ($allow), so the file: rejection\n($deny) is not attributable to scheme filtering\"\nelif printf '%s' \"$deny\"\
    \ | grep -qE '^(400|403)'; then\n echo \"PASS: disallowed scheme rejected ($deny) while the approved scheme was handled\n\
    ($allow)\"\nelse\n echo \"REVIEW: disallowed scheme returned $deny, not a clear accept or reject,\ninspect the control\
    \ surface\"\nfi\nWhere the host has no such surface, confirm by configuration review that the host\napplies the scheme\
    \ and destination allowlist to direct dereferencing and prompts for\nconfirmation on external navigation. This Recommendation\
    \ is compliant when direct\ndereferencing of a disallowed scheme is rejected attributably and the allowlist covers\nboth\
    \ server-returned and model-constructed URIs, while MCP-mediated\nresources/read of any legitimate Resource URI scheme\
    \ is unaffected.\n Page 155\nConfirm by host configuration review and rendering inspection that UI resources render\n\
    inside a sandboxed iframe, and for web-based hosts that the sandbox proxy runs on an\norigin distinct from the host's.\
    \ Render a test UI resource with declared csp metadata\nand inspect the effective Content-Security-Policy on the frame,\
    \ confirming it\npermits no undeclared external domain. The host may be stricter, and the mandatory\nrestrictive defaults\
    \ may include local, 'self', or data: sources defined by the\nextension, which are not server-declared domains and are\
    \ expected. Render a resource\nwith no csp metadata and confirm the restrictive default applies (default-src\n'none',\
    \ with no external connect, resource, or frame origins). Attempt a fetch from the\nrendered view to an undeclared origin\
    \ and confirm it is blocked. As defense-in-depth,\nconfirm the servers permitted to deliver ui:// resources are limited\
    \ to the approved\nallowlist and that UI resource content participates in content-hash pinning.\nThe command below checks\
    \ logging completeness only: it confirms each rendered view\nis logged as sandboxed with an effective CSP and an attributed\
    \ server, but a non-empty\nyet permissive CSP still passes, so CSP correctness is adjudicated by the render\ninspection\
    \ above. Run it after setting the log path:\nLOG=\"<HOST_APP_LOG>\"\ncommand -v jq >/dev/null 2>&1 || { echo \"ERROR:\
    \ jq is required and not installed\n(cannot verify)\"; exit 0; }\n[ -s \"$LOG\" ] || { echo \"ERROR: host application\
    \ log <HOST_APP_LOG> not found or\nempty (cannot verify)\"; exit 0; }\nrenders=$(grep -E '\"event\":\"app_render\"' \"\
    $LOG\")\nn=$(printf '%s\\n' \"$renders\" | grep -c .)\n[ \"$n\" -gt 0 ] || { echo \"REVIEW: no MCP Apps render events\
    \ found (extension may not\nbe in use)\"; exit 0; }\nprintf '%s\\n' \"$renders\" | jq -e . >/dev/null 2>&1 || { echo \"\
    ERROR: render records\nare not parseable (cannot verify)\"; exit 0; }\necho \"count: $n app_render events in window\"\n\
    bad=$(printf '%s\\n' \"$renders\" | jq -c 'select((.csp==null or .csp==\"\") or\n(.sandboxed!=true) or (.server_identity==null\
    \ or .server_identity==\"\"))')\nif [ -n \"$bad\" ]; then\n echo \"FAIL: render events missing an effective CSP, the sandbox\
    \ flag, or server\nidentity (logging completeness)\"\nelse\n echo \"PASS: every rendered app view is logged sandboxed\
    \ with a non-empty effective\nCSP and server identity (logging completeness, not CSP correctness)\"\nfi\nThis Recommendation\
    \ is compliant when sandboxing is unconditional, the effective\npolicy permits no undeclared external domain (the host\
    \ may be stricter), the restrictive\ndefault applies in the absence of a declaration, undeclared-origin requests are blocked,\n\
    and effective policies are logged.\n Page 160\nConfirm by host configuration review that requested permissions are default-deny\
    \ and\ngranted only on a recorded user decision, that all app-to-host messages are logged with\nattribution, and that\
    \ the two high-risk channels are consented. Attempt an app\ntools/call for a tool whose declared visibility does not include\
    \ \"app\" and confirm\nthe host rejects it, and confirm a tool whose visibility excludes \"model\" does not\nappear in\
    \ the agent's tool list. Run the following command:\nLOG=\"<HOST_APP_LOG>\"\ncommand -v jq >/dev/null 2>&1 || { echo \"\
    ERROR: jq is required and not installed\n(cannot verify)\"; exit 0; }\n[ -s \"$LOG\" ] || { echo \"ERROR: host application\
    \ log <HOST_APP_LOG> not found or\nempty (cannot verify)\"; exit 0; }\nevents=$(grep -E '\"event\":\"app_permission\"\
    |\"event\":\"app_message\"' \"$LOG\")\nn=$(printf '%s\\n' \"$events\" | grep -c .)\n[ \"$n\" -gt 0 ] || { echo \"REVIEW:\
    \ no MCP Apps permission or message events found\n(extension may not be in use)\"; exit 0; }\nprintf '%s\\n' \"$events\"\
    \ | jq -e . >/dev/null 2>&1 || { echo \"ERROR: records are not\nparseable (cannot verify)\"; exit 0; }\necho \"count:\
    \ $n app permission/message events in window\"\nautogrant=$(printf '%s\\n' \"$events\" | jq -c 'select(.event==\"app_permission\"\
    \nand .granted==true and ((.decision_source!=\"user\") or\n(((.decision//\"\")|test(\"^(user_granted|user_denied)$\"))|not)))')\n\
    missattr=$(printf '%s\\n' \"$events\" | jq -c 'select(.server_identity==null\nor .server_identity==\"\")')\nhirisk=$(printf\
    \ '%s\\n' \"$events\" | jq -c 'select(.event==\"app_message\" and\n(((.channel//\"\")==\"ui/message\") or ((.channel//\"\
    \")==\"ui/update-model-context\")) and\n((.decision_source!=\"user\") or\n(((.consent//\"\")|test(\"^(accepted|declined)$\"\
    ))|not)))')\nif [ -n \"$autogrant\" ]; then\n echo \"FAIL: a permission was granted without an explicit user decision\
    \ (defaultdeny not enforced)\"\nelif [ -n \"$missattr\" ]; then\n echo \"FAIL: an app permission or message event is missing\
    \ server identity (not\nattributable or logged)\"\nelif [ -n \"$hirisk\" ]; then\n echo \"FAIL: a high-risk channel message\
    \ (ui/message or ui/update-model-context)\nlacks an explicit user consent decision\"\nelse\n echo \"PASS: permissions\
    \ are granted only on an explicit user decision, all app-tohost messages are attributed, and the high-risk channels carry\
    \ explicit user consent\"\nfi\nThis Recommendation is compliant when permissions are default-deny, all app-to-host\nmessages\
    \ are logged with attribution, the high-risk channels are consented, and the\nhost enforces tool visibility.\n Page 164"
  remediation: "Configure the host spawn logic to pass only the variables on each server's documented\nallowlist to that stdio\
    \ subprocess, rather than inheriting the parent environment. This is\nhost spawn-configuration, and the allowlist is a\
    \ per-server artifact. Maintain the allowlist\nwith the minimum required variables for each server, one valid environment-variable\n\
    name per line and nothing else. The following creates the allowlist file the audit reads:\ncat > <ALLOWLIST_FILE> <<'EOF'\n\
    MCP_API_TOKEN\nMCP_LOG_LEVEL\nPATH\nEOF\nThis command creates the allowlist artifact only and does not change the running\n\
    subprocess environment, so the Audit verdict flips from FAIL to PASS only after the host\nspawn logic is configured to\
    \ pass exactly the allowlisted variables, a step with no single\nportable command. Review the allowlist whenever the server's\
    \ capability baseline\nchanges, and document which secrets each server requires.\nConfigure the host so that direct dereferencing\
    \ of a Resource URI is governed by a\nscheme and destination allowlist covering only what legitimate workflows require\n\
    (typically https only), and so that the host prompts for user confirmation on any\nexternal navigation that is not pre-approved.\
    \ This is client configuration, and there is no\nportable command. Do not restrict the Resource URI identifier itself,\
    \ which the host\nreads through the server with resources/read. The allowlist must cover both\nresource URIs returned\
    \ directly by the server and URIs the model or client may\nconstruct from tool outputs. Where direct navigation is proxied\
    \ through a gateway, a\nscheme filter can be added there as a coarse backstop that does not replace the clientside allowlist.\
    \ The following nginx example rejects non-HTTP(S) direct-navigation\nrequests, with the location path set to the site's\
    \ actual direct-navigation route:\nmap $arg_uri $uri_scheme_ok {\n default 0;\n \"~*^https?(://|%3a%2f%2f)\" 1;\n}\nlocation\
    \ /resource-navigation/ {\n if ($uri_scheme_ok = 0) { return 400; }\n}\nFor a gateway that percent-decodes the argument\
    \ before matching, for example\nthrough njs or a decode module, the literal \"~*^https?://\" test is sufficient, and the\n\
    encoded alternative is not needed. Choose whichever matches how the gateway reads\nthe argument.\nThese are host configuration\
    \ and host implementation settings, with no portable\ncommand. Configure the host to render all MCP Apps content in sandboxed\
    \ iframes,\nbuilding the Content Security Policy from the resource's declared csp metadata and\napplying the extension's\
    \ restrictive default when the declaration is absent. Do not add\nexternal domains beyond the declaration, though the\
    \ host may apply a stricter policy\nthan it. For web-based hosts, deploy the extension's sandbox proxy on a separate origin\n\
    and route all view communication through it. Enable logging of the effective CSP per\nrendered resource. Restrict UI-delivering\
    \ servers to the approved allowlist and include\nUI resource content in content-hash verification.\nThese are host configuration\
    \ and host implementation settings, with no portable\ncommand. Configure the host to deny all four MCP Apps permissions\
    \ by default and to\ngrant one only on an explicit per-permission user decision recorded with a user decision\nsource,\
    \ never automatically from the resource's request. Log every app-to-host\nmessage with the requesting server identity,\
    \ and gate the two high-risk channels,\nui/message and ui/update-model-context, behind an explicit user consent\ndecision\
    \ recorded with a user decision source. Enforce the _meta.ui.visibility\ndeclaration so that an app cannot call a tool\
    \ whose visibility omits \"app\", and the\nagent's tool list omits any tool whose visibility omits \"model\"."
  checks:
