- id: 7.1.2
  title: Ensure non-null JSON-RPC request IDs are enforced and included in audit logs
  scoring: scored
  profile:
  - Level 1
  description: 'The protocol''s JSON-RPC id rules are enforced, and the request id is recorded in the audit log. A request
    id must be a string or an integer, must not be null, and must not match the id of another request the sender has issued
    but not yet received a response for. The uniqueness requirement covers only requests still in flight: once a request completes,
    its id may be reused, so enforcement applies to ids awaiting a response rather than to every id ever seen. A server that
    receives a null id, or an id that collides with one of its own outstanding requests, rejects the message as a JSON-RPC
    Invalid Request with error code -32600 and HTTP 400. The JSON-RPC request id is recorded on each audit-log entry so a
    logged event can be tied back to the request that produced it.'
  rationale: Two kinds of bad request id break the correlation between a request and its response. An id that is null cannot
    be matched to a response at all. An id already in use by another request still awaiting a response lets one response be
    mistaken for another. Requiring ids to be non-null and unique among the requests still in flight keeps each request paired
    with its response, and recording the id in the audit log lets an investigator reconstruct which logged events belong to
    which request. Reuse after a response completes is not a violation, so a rule written against every id ever seen would
    reject legitimate traffic.
  impact: Enforcing the id rules is standard JSON-RPC behavior and adds no meaningful overhead. Recording the request id is
    a schema requirement that pairs with structured audit logging. Page 232
  references:
  - '1. MCP specification (Base Protocol / Overview):'
  - https://modelcontextprotocol.io/specification/2026-07-28/basic
  - '2. MCP specification (Schema Reference):'
  - https://modelcontextprotocol.io/specification/2026-07-28/schema
  - https://www.jsonrpc.org/specification
  page_start: 232
  audit_raw: "Send a request that is conformant except for a null id and confirm the server rejects it\nwith HTTP 400 and\
    \ JSON-RPC -32600, then confirm recent audit entries carry the\nJSON-RPC request id. Set URL to the server's MCP endpoint,\
    \ LOG to the audit-log path,\nand AUTH_HEADER to a full authorization header (for example Authorization:\nBearer <token>)\
    \ when the endpoint requires authentication. Supplying the header\nlets the probe reach the id-validation path rather\
    \ than being rejected for missing\ncredentials:\n Page 233\nURL=\"${URL:-https://<SERVER_URL>/mcp}\"\nLOG=\"${LOG:-<MCP_AUDIT_LOG>}\"\
    \nAUTHH=\"${AUTH_HEADER:-}\"\nresp=\"$(curl -sS -m 15 -w '\\n%{http_code}' -X POST \"$URL\" \\\n -H 'Accept: application/json,\
    \ text/event-stream' \\\n -H 'Content-Type: application/json' \\\n -H 'MCP-Protocol-Version: 2026-07-28' \\\n -H 'Mcp-Method:\
    \ tools/list' \\\n -H \"$AUTHH\" \\\n -d\n'{\"jsonrpc\":\"2.0\",\"id\":null,\"method\":\"tools/list\",\"params\":{\"_meta\"\
    :{\"io.modelcontext\nprotocol/protocolVersion\":\"2026-0728\",\"io.modelcontextprotocol/clientInfo\":{\"name\":\"cis-benchmarkaudit\"\
    ,\"version\":\"1.0\"},\"io.modelcontextprotocol/clientCapabilities\":{}}}}'\n2>/dev/null)\"\nrc=$?\ncode=\"$(printf '%s'\
    \ \"$resp\" | tail -n1)\"\nbody=\"$(printf '%s' \"$resp\" | sed '$d')\"\njson=\"$body\"\ncase \"$body\" in *\"data:\"\
    *) json=\"$(printf '%s\\n' \"$body\" | sed -n 's/^data:\n\\{0,1\\}//p')\" ;; esac\nif [ $rc -ne 0 ] || [ -z \"$body\"\
    \ ]; then\n nullid=\"unreachable\"\nelif printf '%s' \"$json\" | jq -e '.error != null' >/dev/null 2>&1; then\n errc=\"\
    $(printf '%s' \"$json\" | jq -r '.error.code // empty' 2>/dev/null)\"\n if [ \"$code\" = \"400\" ] && [ \"$errc\" = \"\
    -32600\" ]; then nullid=\"rejected-clean\";\nelse nullid=\"rejected-nonstd\"; fi\nelse\n nullid=\"accepted\"\nfi\nif [\
    \ ! -r \"$LOG\" ]; then\n corr=\"logmissing\"\nelse\n tot=\"$(tail -n 200 \"$LOG\" 2>/dev/null | grep -c .)\"\n with=\"\
    $(tail -n 200 \"$LOG\" 2>/dev/null | jq -R '(fromjson? // null) as $o |\nselect($o != null) | select(((($o.request_id\
    \ // $o.jsonrpc_id // \"\") | tostring)) !=\n\"\") | 1' 2>/dev/null | grep -c .)\"\n if [ \"${tot:-0}\" -eq 0 ]; then\
    \ corr=\"logempty\"; elif [ \"$with\" -eq \"$tot\" ]; then\ncorr=\"present\"; else corr=\"partial\"; fi\nfi\necho \"---\
    \ null-id wire probe ---\"; echo \"http status: ${code:-none} null-id outcome:\n$nullid\"\necho \"--- audit-log request-id\
    \ field ---\"; echo \"state: $corr\"\nif [ \"$nullid\" = \"unreachable\" ]; then\n echo \"ERROR: server unreachable or\
    \ returned no body, null-id rejection could not be\nassessed at $URL\"\nelif [ \"$nullid\" = \"accepted\" ]; then\n echo\
    \ \"FAIL: the server accepted a null JSON-RPC request id instead of returning an\nerror\"\nelif [ \"$nullid\" = \"rejected-nonstd\"\
    \ ]; then\n Page 234\n echo \"REVIEW: the null id was rejected but not with HTTP 400 and JSON-RPC -32600\n(got HTTP ${code:-none},\
    \ code ${errc:-none}), verify the rejection, and if this was a\n401 supply AUTH_HEADER so the probe reaches the request-id\
    \ validation path\"\nelif [ \"$corr\" = \"logmissing\" ] || [ \"$corr\" = \"logempty\" ]; then\n echo \"REVIEW: the null\
    \ id was rejected with HTTP 400 and -32600, but the audit log\ncould not be read to confirm the JSON-RPC request id is\
    \ recorded\"\nelif [ \"$corr\" = \"partial\" ]; then\n echo \"FAIL: the null id was rejected correctly, but some audit\
    \ entries lack the\nJSON-RPC request id field\"\nelse\n echo \"PASS: the server rejected a null JSON-RPC request id with\
    \ HTTP 400 and -32600\nand audit entries carry the JSON-RPC request id\"\nfi\nThis Recommendation is compliant when the\
    \ server rejects the null id with HTTP 400\nand -32600, recent audit entries carry the JSON-RPC request id, and the command\n\
    prints PASS."
  remediation: 'Configure the server to reject a request whose id is null, or whose id matches one still

    awaiting a response, returning a JSON-RPC Invalid Request with error code -32600

    and HTTP 400. For that check, track only the ids of requests still awaiting a response,

    and release an id for reuse once its response has been sent, rather than retaining every

    id seen. Record the JSON-RPC request id on every audit-log entry. Id-rule enforcement

    is typically provided by a conformant SDK, so the remediation is usually a matter of not

    overriding it and adding the request id to the log schema.'
  checks:
  - type: command
    command: tot="$(tail -n 200 "$LOG" 2>/dev/null | grep -c .)" && "") | 1' 2>/dev/null | grep -c .)"
    expected: ''
    severity: medium
    info: 'Send a request that is conformant except for a null id and confirm the server rejects it

      with HTTP 400 and JSON-RPC -32600, then confirm recent audit entries carry the

      JSON-RPC request id. Set URL to the server''s MCP endpoint, LOG to the audit-log path,

      and AUTH_HEADER to a full authorization header (for example Authorization:

      Bearer <token>) when the endpoint requires authentication. Supplying th'
- id: 7.1.3
  title: Ensure MCP audit records carry accurate, monotonic timestamps
  scoring: scored
  profile:
  - Level 1
  description: Every record in the MCP audit stream carries a timestamp that is present, encoded in a consistent ISO 8601
    format, non-decreasing within the audit stream, and close to real time. The property applies to the recorded timestamp
    values, not to any particular host time service. The timestamp field is read by name from the pinned audit-log schema.
  rationale: 'If the recorded timestamps are missing, malformed, or move backward, every downstream use fails silently: two
    events cannot be ordered, a replay window cannot be computed, and an incident timeline cannot be reconstructed. Checking
    the recorded timestamps directly is a detective control over the property that matters, independent of which time daemon
    the host runs.'
  impact: Recording a well-formed timestamp on every audit record is low effort where the audit pipeline is already structured,
    and the check is read-only. A deployment whose recording host clock is not synchronized surfaces as a REVIEW or a non-monotonic
    FAIL, which points at the host time configuration as the thing to fix. Page 237
  references:
  - 1. MCP specification (Base Protocol / Authorization, token expiry and time-based
  page_start: 237
  audit_raw: "Verify that every record in the MCP audit stream carries a parseable timestamp, that\ntimestamps do not move\
    \ backward within the stream, and that the newest record is\nwithin tolerance of the auditing host clock. Run the following\
    \ command, supplying the\naudit-log path and the timestamp field name from the pinned schema:\nLOG=\"${LOG:-<MCP_AUDIT_LOG>}\"\
    \nTS_FIELD=\"${TS_FIELD:-<AUDIT_TIMESTAMP_FIELD>}\"\nTOL_SEC=\"${TOL_SEC:-5}\"\nif [ ! -f \"$LOG\" ]; then echo \"ERROR:\
    \ audit log $LOG not found\"; exit 0; fi\nif [ ! -s \"$LOG\" ]; then echo \"ERROR: audit log $LOG is empty, no records\
    \ to\nevaluate\"; exit 0; fi\nnow=$(date -u +%s)\nresult=$(jq -sRr --arg tsf \"$TS_FIELD\" --argjson now \"$now\" 'split(\"\
    \\n\") |\nmap(select(length>0)) | reduce .[] as $l\n({total:0,missing:0,unparse:0,nonmono:0,badline:0,prev:null,maxts:null};\
    \ .total+=1 |\n(try ($l|fromjson) catch null) as $o | if $o==null then .badline+=1 elif\n($o|has($tsf)|not) then .missing+=1\
    \ else (($o[$tsf]|tostring)|sub(\"\\\\.[09]+\";\"\")|sub(\"\\\\+00:00$\";\"Z\")) as $n | (try ($n|fromdateiso8601) catch\
    \ null) as $t |\nif $t==null then .unparse+=1 else (if .prev!=null and $t<.prev then .nonmono+=1\nelse . end)|.prev=$t|(if\
    \ .maxts==null or $t>.maxts then .maxts=$t else . end) end\nend) | \"\\(.total) \\(.missing) \\(.unparse) \\(.nonmono)\
    \ \\(.badline) \\(if .maxts==null\nthen \"\" else ((.maxts-$now)|if .<0 then -. else . end|floor) end)\"' \"$LOG\")\n\
    set -- $result\ntotal=\"$1\"; missing=\"$2\"; unparse=\"$3\"; nonmono=\"$4\"; badline=\"$5\"; skew=\"$6\"\nif ! printf\
    \ '%s' \"$total\" | grep -Eq '^[0-9]+$'; then echo \"ERROR: audit log could\nnot be parsed\"; exit 0; fi\nif [ \"$badline\"\
    \ -gt 0 ]; then echo \"ERROR: audit log has $badline non-JSON records,\ncannot evaluate timestamp integrity\"; exit 0;\
    \ fi\nif [ \"$total\" -eq 0 ]; then echo \"ERROR: audit log has no records\"; exit 0; fi\nif [ \"$missing\" -gt 0 ] ||\
    \ [ \"$unparse\" -gt 0 ]; then echo \"FAIL: $missing records\nmissing and $unparse with an unparseable timestamp in field\
    \ $TS_FIELD\"; exit 0; fi\nif [ \"$nonmono\" -gt 0 ]; then echo \"FAIL: $nonmono records have a timestamp earlier\nthan\
    \ a preceding record, the recording clock is not monotonic\"; exit 0; fi\nif [ -n \"$skew\" ] && [ \"$skew\" -gt \"$TOL_SEC\"\
    \ ]; then echo \"REVIEW: newest record is\n$skew seconds from the auditing host clock, confirm the recording host is timesynchronized\
    \ or that this reflects no recent activity\"; exit 0; fi\necho \"PASS: all $total records carry a parseable, monotonic\
    \ timestamp within $TOL_SEC\nseconds of the auditing host clock\"\nThis Recommendation is compliant when the command prints\
    \ PASS. A REVIEW,\nmeaning the newest record is far from now, needs a human to decide between an\nunsynchronized recording\
    \ clock and simple inactivity before the result is trusted.\n Page 238"
  remediation: 'Configure the MCP audit pipeline to stamp every record with a timestamp in a

    consistent parseable format drawn from a synchronized system clock, using the field

    name declared in the audit-log schema, and ensure the recording host maintains a

    synchronized clock so recorded timestamps track real time. Enabling time

    synchronization on a systemd host is:

    sudo timedatectl set-ntp true

    After enabling, set the trusted source and fallback in the time client''s configuration and

    wire the drift alert into the monitoring platform. Those steps are environment-specific

    and have no single portable command.'
  checks:
  - type: command
    command: 'if ! printf ''%s'' "$total" | grep -Eq ''^[0-9]+$''; then echo "ERROR: audit log could'
    expected: Verify that every record in the MCP audit stream carries a parseable timestamp, that
    severity: medium
    info: 'Verify that every record in the MCP audit stream carries a parseable timestamp, that

      timestamps do not move backward within the stream, and that the newest record is

      within tolerance of the auditing host clock. Run the following command, supplying the

      audit-log path and the timestamp field name from the pinned schema:

      LOG="${LOG:-<MCP_AUDIT_LOG>}"

