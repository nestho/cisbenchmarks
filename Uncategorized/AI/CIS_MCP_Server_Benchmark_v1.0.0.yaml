    \ generate a sampling/createMessage request or a\nMulti Round-Trip Request sampling input request. Do not look for a server-advertised\n\
    sampling capability, because sampling is a client capability.\nRun the following command to search the audit log for sampling\
    \ events and confirm\neach carries server identity, an explicit user decision, and a completed redaction check.\nSet the\
    \ field names to match the deployment's log schema if they differ:\nLOG=\"<MCP_AUDIT_LOG>\"\ncommand -v jq >/dev/null\
    \ 2>&1 || { echo \"ERROR: jq is required and not installed\n(cannot verify)\"; exit 0; }\n[ -s \"$LOG\" ] || { echo \"\
    ERROR: audit log <MCP_AUDIT_LOG> is missing or empty (cannot\nverify)\"; exit 0; }\nevents=$(grep -E '\"event\":\"sampling\"\
    ' \"$LOG\")\nn=$(printf '%s\\n' \"$events\" | grep -c .)\n[ \"$n\" -gt 0 ] || { echo \"REVIEW: no sampling events found\
