      \ the streaming endpoint URL, the approved protocol version, a safe streaming\ntool and its arguments, and a valid bearer\
      \ token:\n Page 65\nURL=\"<STREAMING_ENDPOINT_URL"
    severity: medium
- id: '2.4'
  title: Ensure required MCP request metadata headers are present and consistent with the request body
  scoring: scored
  profile:
  - Level 1
  description: Under the 2026-07-28 revision, every Streamable HTTP request mirrors selected request-body fields into HTTP
    headers so that gateways, load balancers, and observability tooling can route and inspect requests without parsing the
    body. The MCPProtocol-Version and Mcp-Method headers are required on every POST, with values matching the protocol version
    in the body's _meta and the JSON-RPC method respectively. The Mcp-Name header is required on tools/call, resources/read,
    and prompts/get requests, with a value that matches the tool name, resource URI, or prompt name in the body. Values that
    cannot be represented as plain ASCII are carried in the specification's Base64 sentinel format, which the server decodes
    before comparing. A server that processes the request body rejects any request with a missing required header or a header
    that disagrees with the body, using HTTP 400 and the HeaderMismatch JSON-RPC error (-32020). This Recommendation ensures
    those rejections are enforced, so a request cannot be routed or rate-limited as one operation while executing as another.
  rationale: In the stateless model, routing, rate-limiting, and observability middleware act on the mirrored headers rather
    than parsing the body. A missing header leaves a gateway unable to route or apply policy correctly. Headers allowed to
    disagree with the body let different components in the request path rely on different sources of truth, so a request can
    be routed or rate-limited as one operation while executing as another, which is a request-smuggling and confusion vector.
    The specification therefore requires servers that process the body to reject missing or mismatched headers with HTTP 400
    and the HeaderMismatch error, and to decode Base64 sentinel-encoded values before comparison. A validator that compares
    encoded values raw either admits encoded disagreement or rejects conformant clients. This Recommendation verifies the
    rejection is enforced on the wire rather than assumed from the SDK.
  impact: There is no impact for conformant clients. Non-conformant clients that omit or contradict the required headers are
    rejected with HTTP 400 and need to be updated. One deployment risk to watch is an SDK that validates headers without decoding
    Base64 sentinel values, which wrongly rejects conformant clients whose names are not headersafe and needs a server or
    SDK update. Page 69
  references:
  - 1. MCP specification (Base Protocol / Transports / Streamable HTTP, request
  - https://modelcontextprotocol.io/specification/2026-0728/basic/transports/streamable-http
  - 2. MCP specification (Key Changes, SEP-2243 header requirement and -32020
  - https://modelcontextprotocol.io/seps/2243-http-standardization
  page_start: 69
