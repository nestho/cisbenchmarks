    \nN=\"${N:-200}\"\nif [ ! -r \"$LOG\" ]; then echo \"ERROR: audit log not readable at $LOG\"; exit 0; fi\nsample=\"$(tail\
    \ -n \"$N\" \"$LOG\" 2>/dev/null)\"\ntotal=\"$(printf '%s\\n' \"$sample\" | grep -c .)\"\nif [ \"$total\" -eq 0 ]; then\
    \ echo \"ERROR: no log entries found in $LOG\"; exit 0; fi\ngood=\"$(printf '%s\\n' \"$sample\" | jq -R '\n (fromjson?\
    \ // null) as $o\n | select($o != null)\n | select(($o.timestamp|type) == \"string\" and $o.timestamp != \"\")\n | select(($o.correlation_id|type)\
    \ == \"string\" and $o.correlation_id != \"\")\n | select(($o.event|type) == \"string\" and $o.event != \"\")\n | select((($o.server_id\
    \ // $o.server // \"\") | tostring) != \"\")\n | 1' 2>/dev/null | grep -c .)\"\nbad=$(( total - good ))\ndistinct_cid=\"\
    $(printf '%s\\n' \"$sample\" | jq -rR 'fromjson? | .correlation_id //\nempty' 2>/dev/null | grep -v '^$' | sort -u | grep\
    \ -c .)\"\necho \"--- event types present in last $total entries ---\"\nprintf '%s\\n' \"$sample\" | jq -rR 'fromjson?\
