controls:
- id: '1.1'
  title: Ensure MCP protocol version is pinned and logged
  scoring: scored
  profile:
  - Level 1
  description: MCP servers, hosts, and gateways serve only operator-approved protocol revisions, such as 2026-07-28, and record
    the asserted protocol version for every request in structured logs. The allowlist is configured explicitly rather than
    inherited from SDK defaults, and it defines the revisions the endpoint serves, not only those it accepts per request.
    Serving older revisions alongside approved ones creates downgrade paths that bypass the allowlist. The allowlist is set
    no lower than 2025-06-18, the revision that introduced the MCP-Protocol-Version header and header-body validation, because
    a server that serves earlier revisions can read a request carrying no header as an earlier revision and process it silently.
    In Streamable HTTP, the protocol version is asserted in both the MCP-Protocol-Version header and the _meta.io.modelcontextprotocol/protocolVersion
    field, the two values agree, and the deployment rejects any request where they differ. In stdio the version is carried
    only in _meta. A request that specifies a version outside the allowlist, omits a required version value, or carries conflicting
    values is rejected and logged rather than processed under a default protocol revision.
  rationale: 'MCP protocol revisions can alter capability negotiation, authorization requirements, and transport behavior.
    Without version controls, a client, or an attacker interposing on the connection, may attempt a downgrade attack by asserting
    an older revision to bypass protections introduced in newer revisions. Version pinning prevents this risk, while version
    logging provides the corresponding detective control. Recording the asserted protocol version for every request enables
    investigators to determine which security model governed a session and whether a downgrade occurred during an incident.
    Together, pinning and logging ensure protocol version selection is both intentional and auditable. The specification permits
    two handlings of a request that omits the protocol version. A server that still supports clients predating 2025-06-18
    may read a missing MCPProtocol-Version header as revision 2025-03-26, whereas a server that does not support those clients
    rejects the request. Because that fallback is a deployment choice rather than a protocol requirement, this Recommendation
    takes the stricter side: serve no revision earlier than 2025-06-18, and reject any request that omits, misstates, or asserts
    an unapproved protocol version. Permitting the fallback creates a silent path onto a revision whose security model was
    never approved. Page 17'
  impact: Impact is low when an endpoint already serves only approved protocol revisions and moderate when older-version clients
    remain in use. Version pinning may modestly delay adoption of new revisions. The greater operational impact comes from
    restricting the revisions an endpoint serves, as clients using unapproved revisions may be disconnected. Organizations
    should inventory connected clients before enforcement. Rejecting requests that omit or misstate the protocol version may
    also expose nonconformant clients, which need to be updated to provide an approved version in both the MCP-Protocol-Version
    header and _meta. Page 18
  references:
  - '1. MCP specification (Base Protocol / Overview / Error Codes):'
  - https://modelcontextprotocol.io/specification/2026-07-28/basic/index#error-codes
  - 2. MCP specification (Base Protocol / Transports / Streamable HTTP / Protocol
  - https://modelcontextprotocol.io/specification/2026-07-28/schema
  - https://modelcontextprotocol.io/seps/2243-http-standardization
  page_start: 17
  audit_raw: "Compare the revisions the server advertises through server/discover against the\napproved allowlist, probe the\
    \ server to confirm it rejects an unapproved version, an\nabsent version, and a header and body that disagree, and inspect\
    \ the logs to confirm\nthe asserted version is recorded on every request. Run the probes against the origin\nserver, because\
    \ a fronting gateway that rejects a probe before it reaches the origin\nreturns an empty or non-JSON response that the\
    \ probes report as ERROR, so verify\ngateway enforcement separately. A response as a single JSON object or an SSE\nstream\
    \ is accepted, and a non-JSON body is reported as ERROR.\nRun the following command to compare the versions the server\
    \ advertises against the\napproved allowlist, substituting your approved revision(s). Keep the allowlist as a\nnewline-delimited\
    \ file exported from the enterprise MCP registry, one revision per line,\nfor example <REGISTRY_DIR>/approved_protocol_versions.txt.\
    \ A revision\nthe server advertises but the allowlist does not approve is a FAIL. A revision the\nallowlist approves but\
    \ the server does not advertise is a REVIEW since the allowlist may\nbe stale or the server misconfigured. An empty or\
    \ unreadable allowlist, or a discovery\nresult with no well-formed supportedVersions array, is an ERROR:\n Page 19\nMCP_URL=\"\
    https://<SERVER_URL>/mcp\"\nALLOW=\"<REGISTRY_DIR>/approved_protocol_versions.txt\"\nresp=$(curl -sS --connect-timeout\
    \ 5 --max-time 20 -X POST \"$MCP_URL\" \\\n -H 'Content-Type: application/json' \\\n -H 'Accept: application/json, text/event-stream'\
    \ \\\n -H 'MCP-Protocol-Version: 2026-07-28' \\\n -H 'Mcp-Method: server/discover' \\\n -d\n'{\"jsonrpc\":\"2.0\",\"id\"\
    :1,\"method\":\"server/discover\",\"params\":{\"_meta\":{\"io.modelconte\nxtprotocol/protocolVersion\":\"2026-0728\",\"\
    io.modelcontextprotocol/clientInfo\":{\"name\":\"cis-benchmarkaudit\",\"version\":\"1.0\"},\"io.modelcontextprotocol/clientCapabilities\"\
    :{}}}}')\njson=\"$resp\"\nprintf '%s' \"$json\" | jq -e 'has(\"id\")' >/dev/null 2>&1 || json=$(printf '%s' \"$resp\"\n\
    | sed -n 's/^data: //p' | jq -c 'select(type == \"object\" and .id == 1)' 2>/dev/null |\nhead -n1)\nWORK=$(mktemp -d)\n\
    if [ -z \"$resp\" ]; then\n echo \"ERROR: no response from the MCP endpoint\"\nelif ! printf '%s' \"$json\" | jq -e .\
    \ >/dev/null 2>&1; then\n echo \"ERROR: response body is not JSON, verdict not attributable\"\nelif printf '%s' \"$json\"\
    \ | jq -e 'has(\"error\")' >/dev/null 2>&1; then\n echo \"ERROR: server/discover rejected with code $(printf '%s' \"$json\"\
    \ | jq -r\n'.error.code'), probe not attributable\"\nelif ! printf '%s' \"$json\" | jq -e '.result.supportedVersions |\
    \ type == \"array\" and\nlength > 0 and all(.[]; type == \"string\")' >/dev/null 2>&1; then\n echo \"ERROR: the discovery\
    \ result carries no well-formed supportedVersions array,\nthe served set cannot be enumerated and no verdict is attributable\"\
    \nelif [ ! -r \"$ALLOW\" ]; then\n echo \"ERROR: allowlist not readable at $ALLOW\"\nelse\n tr -d '\\r' < \"$ALLOW\" |\
    \ grep -v '^[[:space:]]*$' | LC_ALL=C sort -u > \"$WORK/allow\"\n if [ ! -s \"$WORK/allow\" ]; then\n echo \"ERROR: the\
    \ allowlist at $ALLOW is empty, record the approved revisions before\nauditing\"\n else\n printf '%s' \"$json\" | jq -r\
    \ '.result.supportedVersions[]' | LC_ALL=C sort -u >\n\"$WORK/adv\"\n extra=$(LC_ALL=C comm -23 \"$WORK/adv\" \"$WORK/allow\"\
    )\n missing=$(LC_ALL=C comm -13 \"$WORK/adv\" \"$WORK/allow\")\n if [ -n \"$missing\" ]; then printf '%s\\n' \"$missing\"\
    \ | sed 's/^/approved but not\nadvertised: /'; fi\n if [ -n \"$extra\" ]; then\n printf '%s\\n' \"$extra\" | sed 's/^/unapproved:\
    \ /'\n echo \"FAIL: the server advertises protocol revisions outside the approved\nallowlist\"\n Page 20\n elif [ -n \"\
    $missing\" ]; then\n echo \"REVIEW: approved revisions are not advertised, confirm whether the allowlist\nis stale or\
    \ the server is misconfigured\"\n else\n echo \"PASS: the advertised supported-version set matches the approved allowlist\"\
    \n fi\n fi\nfi\nrm -rf \"$WORK\"\nRun the following command to confirm an unapproved version is rejected:\n Page 21\n\
    MCP_URL=\"https://<SERVER_URL>/mcp\"\nresp=$(curl -sS --connect-timeout 5 --max-time 20 -w '\\n%{http_code}' -X POST\n\
    \"$MCP_URL\" \\\n -H 'Content-Type: application/json' \\\n -H 'Accept: application/json, text/event-stream' \\\n -H 'Mcp-Method:\
    \ tools/list' \\\n -H 'MCP-Protocol-Version: 2024-01-01' \\\n -d\n'{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\"\
    ,\"params\":{\"_meta\":{\"io.modelcontextpro\ntocol/protocolVersion\":\"2024-0101\",\"io.modelcontextprotocol/clientInfo\"\
    :{\"name\":\"cis-benchmarkaudit\",\"version\":\"1.0\"},\"io.modelcontextprotocol/clientCapabilities\":{}}}}')\ncode=$(printf\
    \ '%s' \"$resp\" | tail -n1)\nbody=$(printf '%s' \"$resp\" | sed '$d')\njson=\"$body\"\nprintf '%s' \"$json\" | jq -e\
    \ 'has(\"id\")' >/dev/null 2>&1 || json=$(printf '%s' \"$body\"\n| sed -n 's/^data: //p' | jq -c 'select(type == \"object\"\
    \ and .id == 1)' 2>/dev/null |\nhead -n1)\nec=$(printf '%s' \"$json\" | jq -r '.error.code // empty' 2>/dev/null)\nif\
    \ [ -z \"$body\" ] && [ \"$code\" = \"000\" ]; then\n echo \"ERROR: no response from the MCP endpoint\"\nelif [ -z \"\
    $json\" ]; then\n echo \"ERROR: response body is not JSON, verdict not attributable, confirm the probe\nreaches the origin\
    \ MCP server\"\n elif [ \"$ec\" = \"-32022\" ] && [ \"$code\" = \"400\" ]; then\n sup=$(printf '%s' \"$json\" | jq -c\
    \ '.error.data.supported // empty' 2>/dev/null)\n echo \"PASS: unapproved version rejected with HTTP 400 and\nUnsupportedProtocolVersion,\
    \ server supports $sup\"\nelif [ \"$ec\" = \"-32022\" ]; then\n echo \"FAIL: UnsupportedProtocolVersion returned with\
    \ HTTP status $code, the\nspecification requires 400\"\nelif [ -n \"$ec\" ]; then\n echo \"REVIEW: rejected with unexpected\
    \ error code $ec at HTTP $code, confirm the\nrejection is version enforcement\"\nelse\n echo \"FAIL: request asserting\
    \ an unapproved protocol version was accepted\"\nfi\nRun the following command to confirm a request that omits the version\
    \ header but\ncarries a complete _meta envelope is rejected rather than silently downgraded.\nBecause this Recommendation\
    \ floors the served set at 2025-06-18, a header-less\nrequest is rejected with HTTP 400 and HeaderMismatch, and a request\
    \ that is instead\naccepted and served under an earlier revision is a FAIL. An\nUnsupportedProtocolVersion result here\
    \ is a known reference-SDK divergence\nreported upstream, recorded as REVIEW:\n Page 22\nMCP_URL=\"https://<SERVER_URL>/mcp\"\
    \nresp=$(curl -sS --connect-timeout 5 --max-time 20 -w '\\n%{http_code}' -X POST\n\"$MCP_URL\" \\\n -H 'Content-Type:\
    \ application/json' \\\n -H 'Accept: application/json, text/event-stream' \\\n -H 'Mcp-Method: tools/list' \\\n -d\n'{\"\
    jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\",\"params\":{\"_meta\":{\"io.modelcontextpro\ntocol/protocolVersion\"\
    :\"2026-0728\",\"io.modelcontextprotocol/clientInfo\":{\"name\":\"cis-benchmarkaudit\",\"version\":\"1.0\"},\"io.modelcontextprotocol/clientCapabilities\"\
    :{}}}}')\ncode=$(printf '%s' \"$resp\" | tail -n1)\nbody=$(printf '%s' \"$resp\" | sed '$d')\njson=\"$body\"\nprintf '%s'\
    \ \"$json\" | jq -e 'has(\"id\")' >/dev/null 2>&1 || json=$(printf '%s' \"$body\"\n| sed -n 's/^data: //p' | jq -c 'select(type\
    \ == \"object\" and .id == 1)' 2>/dev/null |\nhead -n1)\nec=$(printf '%s' \"$json\" | jq -r '.error.code // empty' 2>/dev/null)\n\
    if [ -z \"$body\" ] && [ \"$code\" = \"000\" ]; then\n echo \"ERROR: no response from the MCP endpoint\"\nelif [ -z \"\
    $json\" ]; then\n echo \"ERROR: response body is not JSON, verdict not attributable, confirm the probe\nreaches the origin\
    \ MCP server\"\n elif [ \"$ec\" = \"-32020\" ] && [ \"$code\" = \"400\" ]; then\n echo \"PASS: request missing the protocol\
    \ version header rejected with HTTP 400 and\nHeaderMismatch\"\nelif [ \"$ec\" = \"-32020\" ]; then\n echo \"FAIL: HeaderMismatch\
    \ returned with HTTP status $code, the specification\nrequires 400\"\nelif [ \"$ec\" = \"-32022\" ]; then\n echo \"REVIEW:\
    \ server rejected the header-less request as an unsupported version\n(HTTP $code) rather than HeaderMismatch. The transport\
    \ specification requires\nHeaderMismatch for a missing required header on a server that does not support pre2025-06-18\
    \ clients; this is a known reference SDK divergence, confirm the server's\nclient-support policy and record the finding\"\
    \nelif [ -n \"$ec\" ]; then\n echo \"REVIEW: rejected with unexpected error code $ec at HTTP $code, confirm the\nrejection\
    \ is version enforcement\"\nelse\n echo \"FAIL: request without the protocol version header was accepted\"\nfi\nRun the\
    \ following command to confirm a request that omits the version field from _meta\nwhile carrying the correct header is\
    \ rejected as malformed with HTTP 400 and invalid\nparams:\n Page 23\nMCP_URL=\"https://<SERVER_URL>/mcp\"\nresp=$(curl\
    \ -sS --connect-timeout 5 --max-time 20 -w '\\n%{http_code}' -X POST\n\"$MCP_URL\" \\\n -H 'Content-Type: application/json'\
    \ \\\n -H 'Accept: application/json, text/event-stream' \\\n -H 'Mcp-Method: tools/list' \\\n -H 'MCP-Protocol-Version:\
    \ 2026-07-28' \\\n -d\n'{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\",\"params\":{\"_meta\":{\"io.modelcontextpro\n\
    tocol/clientInfo\":{\"name\":\"cis-benchmarkaudit\",\"version\":\"1.0\"},\"io.modelcontextprotocol/clientCapabilities\"\
    :{}}}}')\ncode=$(printf '%s' \"$resp\" | tail -n1)\nbody=$(printf '%s' \"$resp\" | sed '$d')\njson=\"$body\"\nprintf '%s'\
    \ \"$json\" | jq -e 'has(\"id\")' >/dev/null 2>&1 || json=$(printf '%s' \"$body\"\n| sed -n 's/^data: //p' | jq -c 'select(type\
    \ == \"object\" and .id == 1)' 2>/dev/null |\nhead -n1)\nec=$(printf '%s' \"$json\" | jq -r '.error.code // empty' 2>/dev/null)\n\
    if [ -z \"$body\" ] && [ \"$code\" = \"000\" ]; then\n echo \"ERROR: no response from the MCP endpoint\"\nelif [ -z \"\
    $json\" ]; then\n echo \"ERROR: response body is not JSON, verdict not attributable, confirm the probe\nreaches the origin\
    \ MCP server\"\n elif [ \"$ec\" = \"-32602\" ] && [ \"$code\" = \"400\" ]; then\n echo \"PASS: request missing the required\
    \ version field in _meta rejected with HTTP\n400 and Invalid params\"\nelif [ \"$ec\" = \"-32602\" ]; then\n echo \"FAIL:\
    \ Invalid params returned with HTTP status $code, the specification\nrequires 400\"\nelif [ \"$ec\" = \"-32020\" ] &&\
    \ [ \"$code\" = \"400\" ]; then\n echo \"REVIEW: server rejected the version-less body as a header mismatch, defensible\n\
    where header and body are compared before required-field validation, confirm the\nrequest was not accepted anywhere\"\n\
    elif [ \"$ec\" = \"-32022\" ]; then\n echo \"REVIEW: server rejected the version-less body as an unsupported version (HTTP\n\
    $code), the specification defines this as a malformed request (-32602), record the\ndivergence\"\nelif [ -n \"$ec\" ];\
    \ then\n echo \"REVIEW: rejected with unexpected error code $ec at HTTP $code, confirm the\nrejection is version enforcement\"\
    \nelse\n echo \"FAIL: request without a version field in the body was accepted\"\nfi\n Page 24\nRun the following command\
    \ to confirm the server rejects a header and _meta value\nthat disagree. The probe carries the approved version in the\
    \ body and a stale version in\nthe header, so the only conforming outcome is HTTP 400 with HeaderMismatch. An\nUnsupportedProtocolVersion\
    \ rejection here is a failure, because the body version\nis supported:\nMCP_URL=\"https://<SERVER_URL>/mcp\"\nresp=$(curl\
    \ -sS --connect-timeout 5 --max-time 20 -w '\\n%{http_code}' -X POST\n\"$MCP_URL\" \\\n -H 'Content-Type: application/json'\
    \ \\\n -H 'Accept: application/json, text/event-stream' \\\n -H 'Mcp-Method: tools/list' \\\n -H 'MCP-Protocol-Version:\
    \ 2025-03-26' \\\n -d\n'{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\",\"params\":{\"_meta\":{\"io.modelcontextpro\n\
    tocol/protocolVersion\":\"2026-0728\",\"io.modelcontextprotocol/clientInfo\":{\"name\":\"cis-benchmarkaudit\",\"version\"\
    :\"1.0\"},\"io.modelcontextprotocol/clientCapabilities\":{}}}}')\ncode=$(printf '%s' \"$resp\" | tail -n1)\nbody=$(printf\
    \ '%s' \"$resp\" | sed '$d')\njson=\"$body\"\nprintf '%s' \"$json\" | jq -e 'has(\"id\")' >/dev/null 2>&1 || json=$(printf\
    \ '%s' \"$body\"\n| sed -n 's/^data: //p' | jq -c 'select(type == \"object\" and .id == 1)' 2>/dev/null |\nhead -n1)\n\
    ec=$(printf '%s' \"$json\" | jq -r '.error.code // empty' 2>/dev/null)\nif [ -z \"$body\" ] && [ \"$code\" = \"000\" ];\
    \ then\n echo \"ERROR: no response from the MCP endpoint\"\nelif [ -z \"$json\" ]; then\n echo \"ERROR: response body\
    \ is not JSON, verdict not attributable, confirm the probe\nreaches the origin MCP server\"\n elif [ \"$ec\" = \"-32020\"\
    \ ] && [ \"$code\" = \"400\" ]; then\n echo \"PASS: disagreeing header and body versions rejected with HTTP 400 and\n\
    HeaderMismatch\"\nelif [ \"$ec\" = \"-32020\" ]; then\n echo \"FAIL: HeaderMismatch returned with HTTP status $code, the\
    \ specification\nrequires 400\"\nelif [ \"$ec\" = \"-32022\" ]; then\n echo \"FAIL: server rejected the mismatch as an\
    \ unsupported version. The body carries\na supported version, so no version-support rejection applies; the specification\n\
    requires HeaderMismatch when header and body disagree\"\nelif [ -n \"$ec\" ]; then\n echo \"REVIEW: rejected with unexpected\
    \ error code $ec at HTTP $code, confirm the\nrejection is mismatch enforcement\"\nelse\n echo \"FAIL: disagreeing header\
    \ and body versions were accepted\"\nfi\n Page 25\nRun the following command to confirm the asserted version is recorded\
    \ on every\nrequest. It reads the version from the _meta object the Description names, counts\nevery request record, and\
    \ excludes the audit client's own probes. Records with no\ndirection field are counted separately rather than assumed\
    \ to be requests:\nLOG=\"<MCP_AUDIT_LOG>\"\nAUDIT_CLIENT=\"cis-benchmark-audit\"\nREQ='select(.direction? == \"request\"\
    ) | select(.method? != null)'\nSELF='((._meta[\"io.modelcontextprotocol/clientInfo\"].name\n// .params._meta[\"io.modelcontextprotocol/clientInfo\"\
    ].name // \"\") == $ac)'\nPV='(._meta[\"io.modelcontextprotocol/protocolVersion\"]\n// .params._meta[\"io.modelcontextprotocol/protocolVersion\"\
    ] // .protocolVersion)'\nif [ ! -r \"$LOG\" ]; then\n echo \"ERROR: log not readable at $LOG\"\nelse\n total=$(jq -s --arg\
    \ ac \"$AUDIT_CLIENT\" \"[.[] | $REQ | select($SELF | not)] | length\"\n\"$LOG\" 2>/dev/null)\n withver=$(jq -s --arg\
    \ ac \"$AUDIT_CLIENT\" \"[.[] | $REQ | select($SELF | not) |\nselect($PV != null)] | length\" \"$LOG\" 2>/dev/null)\n\
    \ nodir=$(jq -s '[.[] | select(has(\"direction\") | not)] | length' \"$LOG\" 2>/dev/null)\n if ! [ \"$total\" -ge 0 ]\
    \ 2>/dev/null || ! [ \"$withver\" -ge 0 ] 2>/dev/null; then\n echo \"ERROR: log could not be parsed, expected one JSON\
    \ object per line\"\n elif [ \"$total\" -eq 0 ]; then\n echo \"ERROR: no request records in log, confirm the log path,\
    \ that records carry a\ndirection field, and that the capture window contains traffic from clients other than\nthe auditor\"\
    \n else\n if [ \"${nodir:-0}\" -gt 0 ]; then\n echo \"records with no direction field: $nodir, excluded from evaluation,\
    \ correct\nthe capture layer so every record carries a direction\"\n fi\n echo \"requests: $total, recording an asserted\
    \ protocol version: $withver\"\n if [ \"$withver\" -eq \"$total\" ]; then\n echo \"PASS: every request records an asserted\
    \ protocol version\"\n else\n echo \"FAIL: $((total - withver)) requests record no asserted protocol version\"\n fi\n\
    \ fi\nfi\nThe system is compliant when the advertised supported-version set matches the\nallowlist, each of the four probes\
    \ rejects its assertion (unapproved, header-less, versionless, and disagreeing) with the specified code at HTTP 400, and\
    \ the log records an\nasserted version on every request.\n Page 26"
  remediation: "Configure the deployment to reject any request that asserts a version outside the\nallowlist, omits it, or\
    \ carries disagreeing header and body values, and to record the\nasserted version on every request. The version is asserted\
    \ twice per Streamable HTTP\nPOST, in the MCP-Protocol-Version header and in _meta under\nio.modelcontextprotocol/protocolVersion,\
    \ and the two are required to\nmatch. The MCP server, or an L7 gateway able to inspect the body, rejects these in\nrequest-handling\
    \ middleware: an out-of-allowlist version with -32022\n(UnsupportedProtocolVersion), a header that disagrees with the\
    \ body or a\nmissing MCP-Protocol-Version header with -32020 (HeaderMismatch), and a\nrequest whose _meta omits the protocol\
    \ version value with -32602 (Invalid\nparams). All are rejected at HTTP 400.\nRecord the asserted version, the request\
    \ direction, and the client identity from _meta\non every request, and ship the logs to the SIEM. The Audit reads the\
    \ version from that\n_meta key, so a deployment that records it under a different name changes the Audit\nand this field\
    \ together.\nRecord the approved revision(s) in the enterprise MCP registry and export them to the\nnewline-delimited\
    \ allowlist the Audit reads, one per line, with Unix line endings.\nA gateway can reject unapproved or absent header values\
    \ as a first filter, but it cannot\ncompare the header against _meta, so it does not replace the server-side validation.\n\
    The following nginx example defines the allowlist in the http context:\nmap $http_mcp_protocol_version $mcp_ver_ok {\n\
    \ default 0;\n \"2026-07-28\" 1;\n}\nThen apply the check inside the MCP location block:\nif ($mcp_ver_ok = 0) { return\
    \ 400; }\nThe map alone only defines the variable. The if rejects the request. Both are required."
  checks:
  - type: command
    command: tr -d '\r' < "$ALLOW" | grep -v '^[[:space:]]*$' | LC_ALL=C sort -u > "$WORK/allow"
    expected: ''
    severity: medium
    info: 'Compare the revisions the server advertises through server/discover against the

      approved allowlist, probe the server to confirm it rejects an unapproved version, an

      absent version, and a header and body that disagree, and inspect the logs to confirm

      the asserted version is recorded on every request. Run the probes against the origin

      server, because a fronting gateway that rejects a probe before it'
- id: '1.2'
  title: Ensure server capability baseline is established and documented
  scoring: manual
  profile:
  - Level 1
  description: 'A documented capability baseline is defined and maintained for each MCP server, recording which protocol components
    and settings it is approved to expose and which extensions it is approved to negotiate. Under the 2026-07-28 revision,
    a server advertises this configuration in the capabilities object returned by server/discover, where core components appear
    as top-level keys (Tools, Resources, Prompts, Completions), each with its own settings such as tools.listChanged or resources.subscribe,
    and extensions appear in the extensions map keyed by a reverse-DNS ID such as io.modelcontextprotocol/tasks. The baseline
    records the full object with its values, not just the names, because a configuration can change materially without any
    name being added, for example by enabling tools.listChanged or raising an extension limit. It is stored as the canonical
    JSON capability object, a versioned artifact in the enterprise MCP registry under change control, and re-approved on every
    server version change, configuration change, and scheduled re-discovery. The advertised configuration should not exceed
    or differ from the approved baseline, and any deviation is unauthorized drift the audit flags. Assessment is manual: the
    comparison is scripted, but approving the baseline and adjudicating withdrawals require human judgement.'
  rationale: 'An MCP server''s advertised capabilities define the attack surface available to any client or model that reaches
    it. Without a documented baseline there is no authoritative record of what a server is expected to expose, so there is
    no way to detect when capabilities have been added, intentionally or otherwise. A compromised or misconfigured server
    that silently begins advertising support it was never approved to offer expands the attack surface without tripping any
    existing control. The drift that matters is not limited to new capability names: a server that enables tools.listChanged,
    turns on resources.subscribe, or changes an extension''s settings gains new behavior while advertising exactly the same
    names, so a baseline that records names alone cannot see the change. The extensions framework widens this further, because
    an extension is negotiated by ID and can introduce whole method families that the core protocol never defined. A maintained
    baseline of the complete capability configuration is the primary detective mechanism for this drift, and the approval
    gate in front of it is the preventive one. Page 29'
  impact: Enabling this control adds a review gate. Each server needs an initial baseline approved, and every later capability
    or settings change needs re-review before it can go live, which delays legitimate changes by the review turnaround. Remediating
    a drifted server means disabling the unapproved capability, so any client already using it loses that function until the
    capability is reviewed and approved into the baseline. Page 30
  references:
  - '1. MCP specification (Architecture, capability negotiation):'
  - https://modelcontextprotocol.io/specification/2026-07-28/architecture
  - 2. MCP specification (Server Features / Discovery, server/discover capability
  - https://modelcontextprotocol.io/seps/2577-deprecate-roots-sampling-and-logging
  page_start: 29
  audit_raw: "Compare the full capability configuration the server advertises through\nserver/discover against the approved\
    \ baseline, and flag any deviation as drift. The\ncomparison covers every nested setting, not only the names, so a change\
    \ to a value\nsuch as tools.listChanged or an extension setting is drift even though no name\nchanged. Maintain the baseline\
    \ per server as the canonical JSON capability object, for\nexample <BASELINE_DIR>/<SERVER>.capabilities.json.\nRun the\
    \ following script to retrieve the advertised configuration and compare it against\nthe baseline:\n Page 31\nMCP_URL=\"\
    https://<SERVER_URL>/mcp\"\nBASELINE=\"<BASELINE_DIR>/<SERVER>.capabilities.json\"\nLEAF='(paths(type | IN(\"string\"\
    ,\"number\",\"boolean\",\"null\")), paths(type == \"object\"\nand length == 0), paths(type == \"array\" and length ==\
    \ 0)) as $p | ($p | tojson) +\n\"\\t\" + (getpath($p) | tojson)'\nresp=$(curl -sS --connect-timeout 5 --max-time 20 -X\
    \ POST \"$MCP_URL\" \\\n -H 'Content-Type: application/json' \\\n -H 'Accept: application/json, text/event-stream' \\\n\
    \ -H 'MCP-Protocol-Version: 2026-07-28' \\\n -H 'Mcp-Method: server/discover' \\\n -d\n'{\"jsonrpc\":\"2.0\",\"id\":1,\"\
    method\":\"server/discover\",\"params\":{\"_meta\":{\"io.modelconte\nxtprotocol/protocolVersion\":\"2026-0728\",\"io.modelcontextprotocol/clientInfo\"\
    :{\"name\":\"cis-benchmarkaudit\",\"version\":\"1.0\"},\"io.modelcontextprotocol/clientCapabilities\":{}}}}')\njson=\"\
    $resp\"\nprintf '%s' \"$json\" | jq -e . >/dev/null 2>&1 || json=$(printf '%s' \"$resp\" | sed -n\n's/^data: //p' | head\
    \ -n1)\nWORK=$(mktemp -d)\nTAB=$(printf '\\t')\nif [ -z \"$resp\" ]; then\n echo \"ERROR: no response from the MCP endpoint\"\
    \nelif ! printf '%s' \"$json\" | jq -e . >/dev/null 2>&1; then\n echo \"ERROR: response body is not JSON, verdict not\
    \ attributable\"\nelif printf '%s' \"$json\" | jq -e 'has(\"error\")' >/dev/null 2>&1; then\n echo \"ERROR: server/discover\
    \ rejected with code $(printf '%s' \"$json\" | jq -r\n'.error.code'), probe not attributable\"\nelif ! printf '%s' \"\
    $json\" | jq -e '.result.capabilities | type ==\n\"object\"' >/dev/null 2>&1; then\n echo \"ERROR: result.capabilities\
    \ is missing or not an object, no verdict is\nattributable\"\nelif [ ! -r \"$BASELINE\" ]; then\n echo \"ERROR: baseline\
    \ not readable at $BASELINE\"\nelif ! jq -e 'type == \"object\"' \"$BASELINE\" >/dev/null 2>&1; then\n echo \"ERROR: baseline\
    \ is not a canonical JSON capability object, re-capture it with\nthe Remediation before auditing\"\nelse\n printf '%s'\
    \ \"$json\" | jq -S '.result.capabilities' > \"$WORK/current.json\"\n jq -r \"$LEAF\" \"$WORK/current.json\" | LC_ALL=C\
    \ sort > \"$WORK/cur\"\n jq -r \"$LEAF\" \"$BASELINE\" | LC_ALL=C sort > \"$WORK/base\"\n comm -23 \"$WORK/cur\" \"$WORK/base\"\
    \ > \"$WORK/curonly\"\n comm -13 \"$WORK/cur\" \"$WORK/base\" > \"$WORK/baseonly\"\n awk -F \"$TAB\" 'FILENAME == ARGV[1]\
    \ { b[$1] = $2; next } ($1 in b) { print \"changed:\n\" $1 \" approved=\" b[$1] \" advertised=\" $2 }' \"$WORK/baseonly\"\
    \ \"$WORK/curonly\" >\n\"$WORK/changed\"\n Page 32\n awk -F \"$TAB\" 'FILENAME == ARGV[1] { b[$1] = $2; next } !($1 in\
    \ b) { print\n\"unapproved: \" $1 \"=\" $2 }' \"$WORK/baseonly\" \"$WORK/curonly\" > \"$WORK/added\"\n awk -F \"$TAB\"\
    \ 'FILENAME == ARGV[1] { c[$1] = $2; next } !($1 in c) { print\n\"withdrawn: \" $1 \"=\" $2 }' \"$WORK/curonly\" \"$WORK/baseonly\"\
    \ > \"$WORK/gone\"\n cat \"$WORK/added\" \"$WORK/changed\" \"$WORK/gone\"\n if [ -s \"$WORK/added\" ] || [ -s \"$WORK/changed\"\
    \ ]; then\n echo \"FAIL: the advertised capability configuration exceeds or differs from the\napproved baseline\"\n elif\
    \ [ -s \"$WORK/gone\" ]; then\n echo \"REVIEW: baselined capability settings are no longer advertised\"\n else\n echo\
    \ \"PASS: the advertised capability configuration matches the approved baseline\"\n fi\nfi\nrm -rf \"$WORK\"\nEach advertised\
    \ setting is compared to the baseline. A setting advertised but not\napproved prints unapproved: and is a FAIL. A setting\
    \ present in both whose value\ndiffers prints changed: and is a FAIL, because the audit cannot judge the direction of\n\
    an arbitrary value change. A setting approved but no longer advertised prints\nwithdrawn: and is a REVIEW. Where a run\
    \ produces both a FAIL and a REVIEW,\nFAIL takes precedence. An empty advertised object is a PASS against an empty\nbaseline\
    \ and a REVIEW against a populated one. A baseline that is not a canonical\nJSON capability object, including the earlier\
    \ newline-delimited format, is an ERROR.\nThe system is compliant when the advertised configuration matches the baseline.\n\
    \ Page 33"
  remediation: "Establish the baseline from a server in a known-good state, have it reviewed, and store\nit in the enterprise\
    \ registry under change control.\nRun the following script to capture the baseline as the canonical JSON capability object.\n\
    Capturing from a drifted server writes the drift into the baseline, so capture only from a\nserver in its approved state.\
    \ The script leaves any existing baseline untouched if the\nconfiguration cannot be retrieved or the server advertises\
    \ an empty set:\n Page 34\nMCP_URL=\"https://<SERVER_URL>/mcp\"\nBASELINE=\"<BASELINE_DIR>/<SERVER>.capabilities.json\"\
    \nmkdir -p \"$(dirname \"$BASELINE\")\"\nLEAF='(paths(type | IN(\"string\",\"number\",\"boolean\",\"null\")), paths(type\
    \ == \"object\"\nand length == 0), paths(type == \"array\" and length == 0)) as $p | $p | tojson'\nresp=$(curl -sS --connect-timeout\
    \ 5 --max-time 20 -X POST \"$MCP_URL\" \\\n -H 'Content-Type: application/json' \\\n -H 'Accept: application/json, text/event-stream'\
    \ \\\n -H 'MCP-Protocol-Version: 2026-07-28' \\\n -H 'Mcp-Method: server/discover' \\\n -d\n'{\"jsonrpc\":\"2.0\",\"id\"\
