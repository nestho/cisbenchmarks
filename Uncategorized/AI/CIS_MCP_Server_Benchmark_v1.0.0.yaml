- id: '10.2'
  title: Ensure request and response body size limits, token budgets, and per-principal quotas are enforced
  scoring: manual
  profile:
  - Level 1
  description: MCP servers enforce maximum size limits on all inbound JSON-RPC request bodies. Servers bound the size of a
    non-streaming result payload, and bound the size of each individual message in a streamed or long-lived response, rather
    than applying a single total ceiling across an arbitrarily long stream. Servers that proxy model calls enforce token-budget
    limits per request and per workload. Per-principal and per-tenant rate quotas are enforced independently of global server
    rate limits. A principal is an authorization context or an application-defined workload scope, not an MCP transport connection,
    because the protocol is stateless and a connection is not a session. Bodysize limits are enforced both at the reverse
    proxy and in MCP application middleware, so that a proxy misconfiguration does not remove the only line of defense.
  rationale: Without body-size limits, a large request or response can exhaust memory or bandwidth, which is a straightforward
    denial-of-service path. Token budgets bound the cost and blast radius of model-proxying calls. Per-principal quotas, enforced
    independently of global limits, prevent a single principal from consuming shared capacity. Enforcing size limits at both
    the proxy and the application means a single misconfiguration does not open the denial-of-service path.
  impact: Size and quota limits can reject legitimate large requests if set too low, so they need tuning to real workloads.
    Page 292
  references:
  - '1. MCP specification (Base Protocol / Transports / Streamable HTTP):'
  - https://modelcontextprotocol.io/specification/2026-0728/basic/transports/streamable-http
  - '2. MCP specification (security best practices, DoS):'
  - https://modelcontextprotocol.io/docs/2026-0728/tutorials/security/security_best_practices
  page_start: 292
  audit_raw: "Confirm that a maximum request-body size is enforced. Send a normal well-formed\nrequest as a baseline and an\
    \ oversized request, and confirm that the oversized request\nis rejected while the normal one is accepted. Set <MAX_REQUEST_BYTES>\
    \ to the\nconfigured limit so the padded body exceeds it. The request carries the 2026-07-28\nenvelope (the MCP-Protocol-Version\
    \ and Mcp-Method headers and a body\n_meta), so a conforming 2026-07-28 server accepts the baseline. tools/list does\n\
    not name a target, so no Mcp-Name header is sent. Run the following command. It\nreports a single verdict:\nURL=\"https://<SERVER_URL>/mcp\"\
    \nMAX_REQUEST_BYTES=\"<MAX_REQUEST_BYTES>\"\nPROTO=\"2026-07-28\"\nmeta='\"_meta\":{\"io.modelcontextprotocol/protocolVersion\"\
    :\"2026-0728\",\"io.modelcontextprotocol/clientCapabilities\":{},\"io.modelcontextprotocol/clientIn\nfo\":{\"name\":\"\
    cis-mcp-audit\",\"version\":\"1.0\"}}'\nnormal=\"{\\\"jsonrpc\\\":\\\"2.0\\\",\\\"id\\\":1,\\\"method\\\":\\\"tools/list\\\
    \",\\\"params\\\":{$meta}}\"\npad=$(head -c \"$MAX_REQUEST_BYTES\" /dev/zero | tr '\\0' 'X')\nbig=\"{\\\"jsonrpc\\\":\\\
    \"2.0\\\",\\\"id\\\":1,\\\"method\\\":\\\"tools/list\\\",\\\"params\\\":{$meta,\\\"pad\\\n\":\\\"${pad}X\\\"}}\"\npost()\
    \ {\n code=$(printf '%s' \"$1\" | curl -s -m 20 -o /dev/null -w '%{http_code}' -X POST \\\n -H 'Content-Type: application/json'\
    \ -H \"MCP-Protocol-Version: $PROTO\" -H 'McpMethod: tools/list' \\\n --data-binary @- \"$URL\" 2>/dev/null)\n [ -n \"\
    $code\" ] && printf '%s' \"$code\" || printf '000'\n}\ncn=$(post \"$normal\")\ncb=$(post \"$big\")\nif [ \"$cn\" = \"\
    000\" ]; then\n echo \"ERROR: server unreachable on a normal request (cn=$cn), no attribution\npossible\"\nelif ! printf\
    \ '%s' \"$cn\" | grep -Eq '^2[0-9][0-9]$'; then\n echo \"REVIEW: the normal control request did not succeed (cn=$cn),\
    \ fix the request\nenvelope or the server before trusting the size result\"\nelif [ \"$cb\" = \"413\" ]; then\n echo \"\
    PASS: oversized body rejected with 413 while a normal request was accepted\n(cn=$cn cb=$cb)\"\nelif [ \"$cb\" = \"000\"\
    \ ]; then\n echo \"REVIEW: server closed the connection on the oversized body (cn=$cn cb=$cb),\nconfirm this is size enforcement\
    \ and not an unrelated fault\"\nelif printf '%s' \"$cb\" | grep -Eq '^2[0-9][0-9]$'; then\n echo \"FAIL: oversized body\
    \ accepted ($cb) at the HTTP layer, no request-body size\nlimit enforced (cn=$cn)\"\nelse\n echo \"REVIEW: oversized body\
    \ returned $cb (cn=$cn), confirm how the server signals\noversize\"\nfi\n Page 293\nThe probe proves body-size enforcement\
    \ at the layer that answers the request. Confirm\nby configuration review that the limit holds at both the reverse proxy\
    \ and the application\nmiddleware, that a non-streaming response payload and each streamed message are\nsize-bounded,\
    \ that per-request and per-workload token budgets are configured, and\nthat per-principal quota exhaustion returns a clear\
    \ error rather than silently queuing.\nThis Recommendation is compliant when the command prints PASS, or prints REVIEW\n\
    for a closed connection that the reviewer confirms is size enforcement, and the\nconfiguration review confirms that the\
    \ remaining limits, budgets, and quotas are in\nplace."
  remediation: 'Configure a maximum request-body size at the reverse proxy and, independently, in

    MCP application middleware. Set a maximum size for non-streaming response

    payloads and a per-message size bound for streamed responses. Configure perrequest and per-workload caps on the token
    budget for model-proxying calls. Set perprincipal and per-tenant rate quotas distinct from global limits. These are server,

    middleware, and proxy settings. At the proxy, the following nginx directive caps the

    request body as one layer of the defense in depth. Set the value to the deployment''s

    chosen limit:

    client_max_body_size 1m;

    Set the application-layer limits (request and response bytes, token budgets, perprincipal quotas) in the server configuration
    to match, so that a proxy misconfiguration

    does not remove the only enforcement point.'
