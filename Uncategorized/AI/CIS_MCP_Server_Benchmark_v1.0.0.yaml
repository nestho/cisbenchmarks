- id: '1.3'
  title: Ensure newly advertised server capabilities are re-validated before invocation
  scoring: manual
  profile:
  - Level 2
  description: When the set of capabilities a server advertises grows beyond its approved baseline, the client and host re-evaluate
    the additions before permitting invocation. Newly advertised capabilities do not inherit the approval granted to the baselined
    set. They are held in a staging state until an explicit re-approval is recorded, and the host denies any attempt to invoke
    a staged capability. Under the 2026-07-28 revision, a client learns of a capability change on a subscriptions/listen stream
    it has opened, filtered per notification type through toolsListChanged, promptsListChanged, and resourcesListChanged.
    A server sends no notification type the client has not requested, so the host opens and maintains one or more subscription
    streams that together cover the affected types. A host that does not subscribe receives no immediate change signal and
    can detect drift only through scheduled or freshness-driven list refreshes. List results also carry ttlMs and cacheScope,
    so a client may re-fetch a list when its freshness expires rather than in response to a notification. The staging gate
    therefore runs on a diff against the approved baseline at every refresh of the capability set, not only when a notification
    arrives.
  rationale: Capability drift is a distinct attack vector. A compromised or malicious server can introduce new tools, resources,
    or prompts after the initial review and advertise them to connected clients, and a capability introduced this way silently
    inherits the trust established for the approved set even though it was never reviewed. This is a shadowtool injection
    path, and it is not hypothetical. An SDK client configured with the listChanged option opens a subscription stream, re-fetches
    the affected list on every published change, and hands the refreshed set straight to the application, so a client that
    has opted in adopts whatever the server now advertises by default. Holding additions in a staging state is the preventive
    control that closes the path, and logging each change with a capability diff and its approval state is the detective control
    that proves the gate is operating.
  impact: This control has two costs. A newly advertised capability is held until re-validation completes, so its adoption
    is delayed by the review turnaround. Separately, the host carries the standing operational cost of maintaining the subscription
    streams that detect capability changes and re-establishing them whenever they close. Page 37
  references:
  - '1. MCP TypeScript SDK v2 (client subscriptions, the listChanged option):'
  - https://ts.sdk.modelcontextprotocol.io/v2/clients/subscriptions.html
  - '2. MCP TypeScript SDK v2 (server errors):'
  - https://ts.sdk.modelcontextprotocol.io/v2/servers/errors.html
  - https://modelcontextprotocol.io/seps/2243-http-standardization
  page_start: 37
  audit_raw: "Confirm that a capability newly advertised beyond the approved baseline is denied until\nexplicitly re-approved,\
    \ and that each change is logged with a capability diff and an\napproval state.\nIdentify two capabilities to use as probes:\
    \ one advertised beyond the baseline and not\nyet re-approved (the staged probe), and one already in the baseline and\
    \ known to be\ninvocable (the control probe). A denial of the staged probe is then attributable to the\nstaging gate rather\
    \ than to the probe itself, because the control probe confirms\ninvocation otherwise works. Supply schema-valid arguments\
    \ in APPROVED_ARGS and\nPENDING_ARGS since a tool invoked with invalid arguments returns an error\nindistinguishable from\
    \ a gate denial. Extend DENY_PATTERN to match the wording the\nlocal gate emits.\nRun the following script to attempt\
    \ both invocations and compare the outcomes:\n Page 38\nMCP_URL=\"https://<SERVER_URL>/mcp\"\nAPPROVED_TOOL=\"<BASELINED_TOOL>\"\
    \nPENDING_TOOL=\"<TOOL_ADVERTISED_SINCE_LAST_APPROVAL>\"\nAPPROVED_ARGS='<JSON_ARGUMENTS_VALID_FOR_APPROVED_TOOL>'\nPENDING_ARGS='<JSON_ARGUMENTS_VALID_FOR_PENDING_TOOL>'\n\
    DENY_PATTERN='pending|not approved|unapproved|unauthorized|awaiting\napproval|forbidden|denied'\nenvelope='\"_meta\":{\"\
    io.modelcontextprotocol/protocolVersion\":\"2026-0728\",\"io.modelcontextprotocol/clientInfo\":{\"name\":\"cis-benchmarkaudit\"\
    ,\"version\":\"1.0\"},\"io.modelcontextprotocol/clientCapabilities\":{}}'\ncall() {\n curl -sS --connect-timeout 5 --max-time\
    \ 20 -X POST \"$MCP_URL\" \\\n -H 'Content-Type: application/json' \\\n -H 'Accept: application/json, text/event-stream'\
    \ \\\n -H 'MCP-Protocol-Version: 2026-07-28' \\\n -H 'Mcp-Method: tools/call' \\\n -H \"Mcp-Name: $1\" \\\n -d\n\"{\\\"\
    jsonrpc\\\":\\\"2.0\\\",\\\"id\\\":1,\\\"method\\\":\\\"tools/call\\\",\\\"params\\\":{\\\"name\\\":\\\"$1\\\",\n\\\"\
    arguments\\\":$2,$envelope}}\"\n}\nnorm() {\n printf '%s' \"$1\" | jq -e 'has(\"id\")' >/dev/null 2>&1 && { printf '%s'\
    \ \"$1\";\nreturn; }\n printf '%s' \"$1\" | sed -n 's/^data: //p' | jq -c 'select(type == \"object\" and .id ==\n1)' 2>/dev/null\
    \ | head -n1\n}\ntext_of() { printf '%s' \"$1\" | jq -r\n'[.result.content[]?|select(.type==\"text\")|.text]|join(\" \"\
    )'; }\nctl_raw=$(call \"$APPROVED_TOOL\" \"$APPROVED_ARGS\")\nctl=$(norm \"$ctl_raw\")\nif [ -z \"$ctl_raw\" ]; then\n\
    \ echo \"ERROR: no response to the control probe, verdict not attributable\"\nelif ! printf '%s' \"$ctl\" | jq -e . >/dev/null\
    \ 2>&1; then\n echo \"ERROR: control probe body is not JSON, verdict not attributable\"\nelif printf '%s' \"$ctl\" | jq\
    \ -e 'has(\"error\")' >/dev/null 2>&1; then\n echo \"ERROR: control probe on $APPROVED_TOOL rejected with code $(printf\
    \ '%s' \"$ctl\"\n| jq -r '.error.code'), verdict not attributable\"\nelif ! printf '%s' \"$ctl\" | jq -e 'has(\"result\"\
    )' >/dev/null 2>&1; then\n echo \"ERROR: control probe returned neither result nor error, verdict not\nattributable\"\n\
    elif printf '%s' \"$ctl\" | jq -e '.result.isError == true' >/dev/null 2>&1; then\n printf 'control probe failed: %s\\\
    n' \"$(text_of \"$ctl\")\"\n echo \"ERROR: the control probe on $APPROVED_TOOL did not execute cleanly, so a\nfailure\
    \ on $PENDING_TOOL is not attributable to a staging gate. Correct APPROVED_ARGS\n Page 39\nuntil this probe succeeds.\"\
    \nelse\n tst_raw=$(call \"$PENDING_TOOL\" \"$PENDING_ARGS\")\n tst=$(norm \"$tst_raw\")\n if [ -z \"$tst_raw\" ]; then\n\
    \ echo \"ERROR: no response to the staged-capability probe\"\n elif ! printf '%s' \"$tst\" | jq -e . >/dev/null 2>&1;\
    \ then\n echo \"ERROR: staged-capability response is not JSON, verdict not attributable\"\n elif printf '%s' \"$tst\"\
    \ | jq -e '.error.code == -32601 or .error.code == -\n32602' >/dev/null 2>&1; then\n printf 'name did not resolve: code\
    \ %s, message %s\\n' \\\n \"$(printf '%s' \"$tst\" | jq -r '.error.code')\" \"$(printf '%s' \"$tst\" | jq -r\n'.error.message')\"\
    \n echo \"REVIEW: the staged capability name did not resolve, confirm it is the name\nadvertised by the list_changed diff\"\
    \n elif printf '%s' \"$tst\" | jq -e 'has(\"error\")' >/dev/null 2>&1; then\n msg=$(printf '%s' \"$tst\" | jq -r '.error.message')\n\
    \ printf 'denial carrier: protocol error, code %s, message %s\\n' \"$(printf '%s' \"$tst\"\n| jq -r '.error.code')\" \"\
    $msg\"\n if printf '%s' \"$msg\" | grep -qiE \"$DENY_PATTERN\"; then\n echo \"PASS: staged capability was denied and the\
    \ denial names a pending or\nunauthorized state\"\n else\n echo \"REVIEW: staged capability was rejected, but the message\
    \ does not name a\npending or unauthorized state, so the rejection may not be the staging gate\"\n fi\n elif printf '%s'\
    \ \"$tst\" | jq -e '.result.isError == true' >/dev/null 2>&1; then\n msg=$(text_of \"$tst\")\n printf 'denial carrier:\
    \ in-band tool error, message %s\\n' \"$msg\"\n if printf '%s' \"$msg\" | grep -qiE \"$DENY_PATTERN\"; then\n echo \"\
    PASS: staged capability was denied and the denial names a pending or\nunauthorized state\"\n else\n echo \"REVIEW: the\
    \ staged capability returned an in-band error that does not name a\npending or unauthorized state. An input validation\
    \ failure reads identically to a\ngate denial on this carrier, so correct PENDING_ARGS and re-run before accepting this\n\
    as a denial\"\n fi\n elif printf '%s' \"$tst\" | jq -e 'has(\"result\")' >/dev/null 2>&1; then\n echo \"FAIL: staged capability\
    \ executed, no approval gate is enforced\"\n else\n echo \"ERROR: staged-capability response carries neither result nor\
    \ error\"\n fi\nfi\n Page 40\nA denial reaches the client on one of two carriers, and the script accepts either by\ninspecting\
    \ the response body rather than the HTTP status. A gateway or middleware\ngate returns a JSON-RPC error. A gate inside\
    \ the server's own tool handling returns a\nsuccessful result carrying isError: true since a tool handler cannot emit\
    \ a protocol\nerror. On both carriers the script returns PASS only when the denial message matches\nDENY_PATTERN. A rejection\
    \ that does not name a pending or unauthorized state is\nREVIEW since an input-validation failure reads identically on\
    \ the isError carrier, as\ndoes a -32601 or -32602 for a name that does not resolve.\nRun the following script to confirm\
    \ capability changes are recorded with a diff and an\napproval state. It reads records as JSON documents so it tolerates\
    \ pretty-printed logs:\nLOG=\"<MCP_AUDIT_LOG>\"\nSEL='select((.method? // \"\") |\ntest(\"^notifications/(tools|resources|prompts)/list_changed$\"\
    ))'\nWF='((.capabilities_added | type == \"array\" and length > 0 and all(.[]; type ==\n\"string\" and length > 0)) and\
    \ (.approval_state | type == \"string\") and\n(.approval_state | IN(\"pending\",\"approved\",\"denied\")) and (if .approval_state\
    \ ==\n\"pending\" then true else ((.approver | type == \"string\" and length > 0) and\n(.approved_at | type == \"string\"\
    \ and length > 0)) end))'\nif [ ! -r \"$LOG\" ]; then\n echo \"ERROR: audit log not readable at $LOG\"\nelse\n total=$(jq\
    \ -s \"[.[] | $SEL] | length\" \"$LOG\" 2>/dev/null)\n good=$(jq -s \"[.[] | $SEL | select($WF)] | length\" \"$LOG\" 2>/dev/null)\n\
    \ if ! [ \"$total\" -ge 0 ] 2>/dev/null || ! [ \"$good\" -ge 0 ] 2>/dev/null; then\n echo \"ERROR: audit log could not\
    \ be parsed as JSON records\"\n elif [ \"$total\" -eq 0 ]; then\n echo \"REVIEW: no list_changed events recorded, the\
    \ control cannot be evaluated\nfrom this log\"\n else\n echo \"list_changed events: $total, carrying well-formed diff\
    \ and approval\nevidence: $good\"\n if [ \"$good\" -eq \"$total\" ]; then\n echo \"PASS: every list_changed event is logged\
    \ with a well-formed capability\ndiff and approval evidence\"\n else\n echo \"FAIL: $((total - good)) list_changed events\
    \ lack a well-formed capability\ndiff or approval evidence\"\n fi\n fi\nfi\n Page 41\nAn event counts as well formed only\
    \ when the capability diff is a non-empty array of\nnon-empty strings and the approval state is pending, approved, or\
    \ denied. An\napproved or denied event also carries a non-empty approver and timestamp, and a\npending event may leave\
    \ both null. The log field names are deployment-specific, so\nsubstitute them in the Audit and Remediation together since\
    \ both read the same fields.\nThe system is compliant when a capability advertised beyond the baseline is denied\nwith\
    \ a message naming a pending or unauthorized state, and every recorded change\ncarries a well-formed diff and approval\
    \ evidence."
  remediation: 'Implement a capability staging gate at the application or host layer, or at a centralized

    gateway. A plain reverse proxy cannot host the gate since the decision depends on

    protocol-level capability state.

    Open and maintain the subscriptions/listen streams covering every notification

    type in scope, and re-establish any stream that closes, because a server sends no type

    the client has not requested. A capability set can also refresh when its freshness

    expires, so run the diff on every refresh, not only on receipt of a notification.

    On each refresh, diff the newly advertised set against the last approved set, place

    additions in a pending state, deny their invocation, and record the event. Where the

    gate is inside the server''s own tool handling, the denial reaches the client as a

    successful result carrying isError: true, so make the denial text name the pending

    or unauthorized state.

    Record each change in the audit log with the capabilities added as a non-empty list of

    names, the approval state (pending, approved, or denied), the approver, and the

    timestamp. The approver and timestamp may be null only while the state is pending.

    Use the same field names the Audit reads. Tie the approved set back to the capability

    baseline.'
