- id: '8.3'
  title: Ensure third-party MCP server artifacts are served exclusively from an internal private mirror
  scoring: manual
  profile:
  - Level 2
  description: Enterprises permitting third-party MCP servers maintain an internal private mirror of all approved server artifacts,
    where each server's provenance has been vetted and its cryptographic hashes verified against official publisher records.
    Production MCP hosts install packaged servers only from this internal mirror across every installable channel the deployment
    uses, which may be a self-hosted package mirror and an internal container registry. The current MCP Registry package types
    are npm, pypi, nuget, oci, and mcpb, named as examples rather than a set every deployment must have. A remote MCP server
    is a live endpoint URL rather than a mirrorable artifact, so its equivalent control is to approve its exact origin and
    route access through an approved enterprise egress gateway or private connector, not to mirror it. An internal MCP registry
    implementing the MCP Registry OpenAPI interface may hold approved discovery metadata for both, but that metadata catalog
    is distinct from the package artifact repository that serves the code, and the two roles are not conflated. Direct access
    from production hosts to external community sources, including registry.npmjs.org, pypi.org, public container registries,
    release-hosted mcpb artifacts, and the public MCP Registry, is blocked by network egress controls, and remote-server access
    is confined to the approved origins through the gateway.
  rationale: Installing directly from public sources exposes production to dependency-confusion, typosquatting, and account-takeover
    attacks at the source. The public MCP Registry authenticates namespaces and hosts metadata, but it delegates code security
    scanning to the underlying package registries and downstream aggregators, so it is not itself a vetting gate. That is
    why provenance vetting and hash verification are enforced at the enterprise mirror instead. An internal mirror of vetted,
    hash-verified artifacts, combined with egress blocking of public sources, ensures that production installs only reviewed
    artifacts and cannot be redirected to a malicious upstream.
  impact: Operating a mirror is infrastructure overhead. Covering every channel the deployment uses can mean mirroring or
    proxying container images and bundle artifacts as well as the common language-ecosystem packages, not only one package
    manager. Blocking public egress from production hosts can break a host that legitimately needs some external access, so
    the egress policy is scoped to the registry endpoints rather than applied as a blanket deny. Page 262
  references:
  - '1. MCP specification (security best practices):'
  - https://modelcontextprotocol.io/docs/2026-0728/tutorials/security/security_best_practices
  - '2. MCP Registry (server identity): https://modelcontextprotocol.io/registry/about'
  - https://modelcontextprotocol.io/registry/package-types
  page_start: 262
  audit_raw: "Confirm that the package managers on production hosts point to the internal mirror.\nThis block requires bash.\
    \ Run the following command with the internal mirror host set to\ncheck each configured source:\n Page 263\nMIRROR=\"\
    <INTERNAL_MIRROR_HOST>\"\nif [ -z \"$MIRROR\" ]; then\n echo \"ERROR: no internal mirror host configured to compare against,\
    \ set the mirror\nhost first\"\n exit 0\nfi\nhost_of() {\n u=$(printf '%s' \"$1\" | tr -d '\\r' | sed 's/\\xc2\\xa0//g')\n\
    \ u=\"${u#*://}\"\n u=\"${u%%/*}\"\n u=\"${u#*@}\"\n u=\"${u%%\\?*}\"\n u=\"${u%%:*}\"\n printf '%s' \"$u\" | tr 'A-Z'\
    \ 'a-z'\n}\npresent=0; bad=0\ncheck() {\n name=\"$1\"; src=\"$2\"\n case \"$src\" in \"\") return ;; esac\n present=$((present+1))\n\
    \ h=$(host_of \"$src\")\n if [ \"$h\" = \"$MIRROR\" ]; then\n echo \"$name source $src resolves to host $h, the internal\
    \ mirror\"\n else\n echo \"$name source $src resolves to host $h, not the internal mirror $MIRROR\";\nbad=$((bad+1))\n\
    \ fi\n}\ncheck_multi() {\n name=\"$1\"; vals=\"$2\"\n oldifs=$IFS\n IFS='\n'\n for one in $vals; do\n case \"$one\" in\
    \ *://*) IFS=$oldifs; check \"$name\" \"$one\"; IFS='\n' ;; esac\n done\n IFS=$oldifs\n}\nif command -v npm >/dev/null\
    \ 2>&1; then\n check \"npm registry\" \"$(npm config get registry 2>/dev/null)\"\n scoped=$(npm config list 2>/dev/null\
    \ | sed -nE\n's/^[[:space:]]*(@[^=:]+:registry)[[:space:]]*=[[:space:]]*\"?([^\"[:space:]]+)\"?.*/\\1\n\\2/p')\n oldifs=$IFS\n\
    \ IFS='\n'\n for line in $scoped; do\n IFS=$oldifs\n key=${line%% *}; val=${line#* }\n Page 264\n check \"npm $key\" \"\
    $val\"\n IFS='\n'\n done\n IFS=$oldifs\nfi\nif command -v pip >/dev/null 2>&1; then\n pl=$(pip config list 2>/dev/null)\n\
    \ iu=$(printf '%s\\n' \"$pl\" | sed -nE \"s/.*\\\\.indexurl[[:space:]]*=[[:space:]]*'?([^'[:space:]]+)'?.*/\\\\1/p\" |\
    \ head -1)\n [ -n \"$PIP_INDEX_URL\" ] && iu=\"$PIP_INDEX_URL\"\n [ -z \"$iu\" ] && iu=\"https://pypi.org/ (default, index-url\
    \ unset)\"\n check \"pip index-url\" \"$iu\"\n eiu=$(printf '%s\\n' \"$pl\" | sed -nE \"s/.*\\\\.extra-indexurl[[:space:]]*=[[:space:]]*'?([^']*)'?.*/\\\
    \\1/p\")\n check_multi \"pip extra-index-url\" \"$eiu $PIP_EXTRA_INDEX_URL\"\n fl=$(printf '%s\\n' \"$pl\" | sed -nE \"\
    s/.*\\\\.findlinks[[:space:]]*=[[:space:]]*'?([^']*)'?.*/\\\\1/p\")\n check_multi \"pip find-links\" \"$fl $PIP_FIND_LINKS\"\
    \nfi\nif [ \"$present\" -eq 0 ]; then\n echo \"ERROR: neither npm nor pip present, confirm the package managers in use\
    \ and\ntheir configured sources\"\nelif [ \"$bad\" -gt 0 ]; then\n echo \"FAIL: $bad of $present package manager source(s)\
    \ do not resolve to the\ninternal mirror host\"\nelse\n echo \"PASS: all $present package manager source(s) resolve to\
    \ the internal mirror\nhost\"\nfi\nConfirm that direct access from the host to the public source is blocked while the\n\
    internal mirror is reachable. This block requires bash and curl, and it runs from the\nproduction host's network context.\
    \ Run the following command with the internal mirror\nURL and the public source URL set (for example https://registry.npmjs.org/\n\
    as the public source):\n Page 265\nMIRROR_URL=\"<INTERNAL_MIRROR_URL>\"\nPUBLIC_URL=\"<PUBLIC_REGISTRY_URL>\"\nprobe()\
    \ {\n code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 \"$1\" 2>/dev/null)\n case \"$code\" in \"\"|000) code=\"\
    000\" ;; esac\n printf '%s' \"$code\"\n}\nmirror_code=$(probe \"$MIRROR_URL\")\npublic_code=$(probe \"$PUBLIC_URL\")\n\
    if [ \"$mirror_code\" = \"000\" ]; then\n echo \"ERROR: internal mirror unreachable (code $mirror_code), cannot attribute\
    \ the\negress result, run from the production host network context and confirm the mirror\nURL\"\n exit 0\nfi\ncase \"\
    $public_code\" in\n 000) echo \"REVIEW: public registry not reachable while the mirror is (public\n$public_code, mirror\
    \ $mirror_code), confirm with egress-policy evidence that this is\nenforced denial and not a transport failure\" ;;\n\
    \ 2*|3*) echo \"FAIL: public registry reachable (code $public_code), egress to the\npublic registry is not restricted\"\
    \ ;;\n *) echo \"REVIEW: public registry returned $public_code, distinguish a blocking\nproxy from an auth wall\" ;;\n\
    esac\nThis Recommendation is compliant when every package manager's configured source\nis the internal mirror, and the\
    \ public source is not reachable from the production host\nwhile the mirror is. A reviewer also confirms that the mirror\
    \ holds only vetted, hashverified artifacts, and that the channels the commands do not check (oci, mcpb, and\nremote URLs)\
    \ are likewise served only from internal sources.\n Page 266"
  remediation: 'Establish an internal artifact mirror (for example a self-hosted registry such as

    Artifactory or Nexus, an internal container registry, and an internal MCP registry)

    holding only vetted, hash-verified artifacts, and configure production host package

    managers and container runtimes to use only those internal sources. Run the following

    command to point npm and pip at the internal mirror:

    npm config set registry https://<INTERNAL_REGISTRY>

    pip config set global.index-url https://<INTERNAL_PYPI>

    Remove or repoint any npm scoped registry (@scope:registry=) and any pip

    extra-index-url or find-links entry that resolves to a source other than the

    internal mirror, including their environment overrides (PIP_EXTRA_INDEX_URL,

    PIP_FIND_LINKS), so that no configured source bypasses the mirror. Configure the

    container runtime and any mcpb install path to pull only from the internal registry.

    Configure network egress controls on production hosts to block direct access to the

    public sources for every channel in use, scoped to those registry endpoints rather than

    a blanket deny.'
  checks:
  - type: manual_review
    info: "Confirm that the package managers on production hosts point to the internal mirror.\nThis block requires bash.\
      \ Run the following command with the internal mirror host set to\ncheck each configured source:\n Page 263\nMIRROR=\"\
      <INTERNAL_MIRROR_HOST>\"\nif [ -z \"$MIRROR\" ]; then\n echo \"ERROR: no internal mirror host configured to compare\
      \ against, set the mirror\nhost first\"\n exit 0\nfi\nhost_of() {\n u=$(printf '%s' \"$1\" | tr -d '\\r' | sed 's/\\\
      xc2\\xa0//g')\n u=\"${u#*://}\"\n u=\"${u%%/*}\"\n u=\"${u#*@}\"\n u=\"${u%%\\"
    severity: medium
- id: '9.1'
  title: Ensure remote MCP servers run in containers or VMs with least privilege and gateway ingress controls applied
  scoring: manual
  profile:
  - Level 2
  description: Streamable HTTP MCP servers run in containers or VMs with non-root user identities and read-only root filesystems.
    All Linux capabilities are dropped, with only an approved set added back, and the process cannot regain privileges through
    setuid or file capabilities (no-new-privileges). Kernel-enforced confinement (seccomp and AppArmor, or an equivalent mandatory
    access control profile) is left enabled rather than disabled. Servers sit behind a gateway that enforces ingress policy.
    Authorization enforcement, rate limiting, anomaly detection, and a kill switch are centralized at the gateway rather than
    implemented separately in each server. An ingress gateway does not mediate the server's outbound connections, so egress
    confinement is enforced at the host or network layer.
  rationale: A containerized server running as root with a writable filesystem and full capabilities offers an attacker who
    compromises it a wide path to escalate and persist. Non-root execution, a read-only root filesystem, dropped capabilities,
    and kernel confinement shrink that path to the minimum the runtime needs. Dropping capabilities alone is incomplete, because
    a process can regain privileges through a setuid binary, so preventing new privileges is what makes the capability drop
    hold. A gateway that centralizes ingress policy, authorization, rate limiting, and a kill switch provides a single enforcement
    and shut-off point, rather than relying on each server to police itself. Outbound confinement is enforced separately at
    the host or network layer, not by the ingress gateway.
  impact: Hardening the security context and routing through a gateway adds deployment and operational complexity. Each server
    needs its container configured for a non-root user, a read-only root filesystem, all capabilities dropped, no-new-privileges,
    and, where the server genuinely needs one, an approved capability add-back set. A server with an undeclared runtime need
    will fail to start until that set is corrected. Page 270
  references:
  - '1. MCP specification (Base Protocol / Overview / Statelessness):'
  - https://modelcontextprotocol.io/specification/2026-0728/basic/index#statelessness
  - '2. MCP specification (security best practices):'
  - https://modelcontextprotocol.io/docs/2026-0728/tutorials/security/security_best_practices
  page_start: 270
  audit_raw: "Confirm the container or containers running the server are hardened. Pass one or more\ncontainer names or ids\
    \ in CONTAINER, for example a single name or $(docker\ncompose ps -q) for a multi-container deployment. A container that\
    \ exists but is not\nrunning returns ERROR, because inspecting a stopped object does not prove the running\nworkload is\
    \ confined.\n Page 271\nCONTAINER=\"<CONTAINER_NAME_OR_ID>\"\nEXPECTED_CAPS=\"${EXPECTED_CAPS:-}\"\ninsp=$(docker inspect\
    \ $CONTAINER 2>/dev/null)\nif [ -z \"$insp\" ] || [ \"$(printf '%s' \"$insp\" | jq -r 'length' 2>/dev/null)\" = \"0\"\
    \ ];\nthen\n echo \"ERROR: no container found for $CONTAINER; confirm the server container is\nrunning, or if the server\
    \ runs in a VM or directly on a host, audit it with the\nsystemd command below\"\nelse\n printf '%s' \"$insp\" | jq -r\
    \ --arg expected_caps \"$EXPECTED_CAPS\" '\n def isnum: test(\"^[0-9]+(:[0-9]+)?$\");\n ($expected_caps | ascii_downcase\
    \ | [splits(\"[ ,]+\")] | map(ltrimstr(\"cap_\")) |\nmap(select(. != \"\")) | sort) as $expcaps\n | ([ .[] | select((.State.Running\
    \ // false) != true) | (.Name // \"container\") ]) as\n$stopped\n | if ($stopped | length) > 0\n then \"ERROR: container(s)\
    \ exist but are not running (\" + ($stopped | join(\", \")) +\n\"); runtime confinement cannot be verified\"\n else\n\
    \ ([ .[] | select(((.Config.User // \"\") != \"\") and (((.Config.User) | isnum) | not)\nand (((.Config.User) | test(\"\
    ^(root|0)(:|$)\")) | not)) | \"detail: User \" +\n(.Config.User) + \" is a name, confirm it resolves to a non-zero uid\
    \ in the image\" ])\nas $un\n | ([ .[] | (.Name // \"container\") as $n | (.Config // {}) as $cfg | (.HostConfig //\n\
    {}) as $h | ($h.SecurityOpt // []) as $so\n | { n:$n, fails: [\n (if ((($cfg.User // \"\")) != \"\" and (($cfg.User //\
    \ \"\") | test(\"^(root|0)(:|$)\") |\nnot)) then empty else \"non-root-user\" end),\n (if ($h.Privileged == true) then\
    \ \"privileged\" else empty end),\n (if ($h.ReadonlyRootfs == true) then empty else \"readonly-rootfs\" end),\n (if (($h.CapDrop\
    \ // []) | any(ascii_upcase == \"ALL\")) then empty else \"cap-drop=ALL\"\nend),\n (if (($h.CapAdd // []) | length ==\
    \ 0) then empty\n elif ($expcaps | length) > 0 and ((($h.CapAdd // []) | map(ascii_downcase |\nltrimstr(\"cap_\")) | sort)\
    \ == $expcaps) then empty\n else \"cap-add=\" + (($h.CapAdd // [])|join(\",\")) end),\n (if ($so | any(test(\"seccomp[:=]unconfined\"\
    ;\"i\"))) then \"seccomp-disabled\" else\nempty end),\n (if ($so | any(test(\"apparmor[:=]unconfined\";\"i\"))) then \"\
    apparmor-disabled\" else\nempty end),\n (if ($so | any(test(\"no-new-privileges\";\"i\"))) then empty else \"no-new-privileges\"\
    \nend)\n ] } ]) as $r\n | ([ $r[] | select((.fails|length)>0) ]) as $bad\n | ($un + [ if ($bad|length)==0\n then \"PASS:\
    \ every running container is non-root and unprivileged, with a read-only\nroot filesystem, all capabilities dropped, no-new-privileges\
    \ set, and seccomp and\nAppArmor confinement not disabled\"\n else \"FAIL: \" + ([ $bad[] | .n + \"[\" + (.fails|join(\"\
    \ \")) + \"]\" ] | join(\"; \"))\nend ]) | join(\"\\n\")\n Page 272\n end'\nfi\nFor a server deployed in a VM or directly\
    \ on a host under systemd rather than in a\ncontainer, run the following command to confirm the service unit is hardened\
    \ to the\nequivalent properties. Pass the unit name in UNIT, and optionally the approved\ncapability set in EXPECTED_CAPS.\n\
    \ Page 273\nUNIT=\"<SYSTEMD_UNIT>\"\nEXPECTED_CAPS=\"${EXPECTED_CAPS:-}\"\nprops=$(systemctl show \"$UNIT\" -p LoadState\
    \ -p User -p NoNewPrivileges -p\nCapabilityBoundingSet -p ProtectSystem -p SystemCallFilter -p AppArmorProfile -p\nSELinuxContext\
    \ 2>/dev/null)\nload=$(printf '%s\\n' \"$props\" | sed -n 's/^LoadState=//p')\nif [ \"$load\" != \"loaded\" ]; then\n\
    \ echo \"ERROR: unit $UNIT is not loaded; confirm the server runs under this systemd\nunit, or if it runs in a container\
    \ use the container command above\"\nelse\n user=$(printf '%s\\n' \"$props\" | sed -n 's/^User=//p')\n nnp=$(printf '%s\\\
    n' \"$props\" | sed -n 's/^NoNewPrivileges=//p')\n caps=$(printf '%s\\n' \"$props\" | sed -n 's/^CapabilityBoundingSet=//p')\n\
    \ psys=$(printf '%s\\n' \"$props\" | sed -n 's/^ProtectSystem=//p')\n scf=$(printf '%s\\n' \"$props\" | sed -n 's/^SystemCallFilter=//p')\n\
    \ aa=$(printf '%s\\n' \"$props\" | sed -n 's/^AppArmorProfile=//p')\n se=$(printf '%s\\n' \"$props\" | sed -n 's/^SELinuxContext=//p')\n\
    \ fails=\"\"\n case \"$user\" in \"\"|root|0|0:*) fails=\"$fails non-root-user\" ;; esac\n [ \"$nnp\" = \"yes\" ] || [\
    \ -n \"$scf\" ] || fails=\"$fails no-new-privileges\"\n case \"$psys\" in strict|full) : ;; *) fails=\"$fails read-only-rootfs\"\
    \ ;; esac\n [ -n \"$scf\" ] || fails=\"$fails seccomp\"\n { [ -n \"$aa\" ] && [ \"$aa\" != \"unconfined\" ]; } || [ -n\
    \ \"$se\" ] || fails=\"$fails macprofile\"\n if [ -n \"$fails\" ]; then\n echo \"FAIL: unit $UNIT missing required hardening:$fails\"\
    \n elif [ -n \"$EXPECTED_CAPS\" ]; then\n want=$(printf '%s' \"$EXPECTED_CAPS\" | tr 'A-Z ,' 'a-z\\n\\n' | sed 's/^cap_//'\
    \ | grep\n-v '^$' | sort | tr '\\n' ' ')\n got=$(printf '%s' \"$caps\" | tr 'A-Z ' 'a-z\\n' | sed 's/^cap_//' | grep -v\
    \ '^$' |\nsort | tr '\\n' ' ')\n if [ \"$want\" = \"$got\" ]; then\n echo \"PASS: unit $UNIT runs non-root with no-new-privileges,\
    \ ProtectSystem=$psys,\na seccomp filter, a MAC profile, and CapabilityBoundingSet matching the approved set\"\n else\n\
    \ echo \"REVIEW: unit $UNIT has the required hardening but CapabilityBoundingSet\n($caps) does not match EXPECTED_CAPS,\
    \ confirm the bounding set is minimized\"\n fi\n else\n echo \"REVIEW: unit $UNIT runs non-root with no-new-privileges,\
    \ ProtectSystem=$psys,\na seccomp filter, and a MAC profile, confirm CapabilityBoundingSet ($caps) is\nminimized to the\
    \ server's needs\"\n fi\nfi\nSeparately, confirm from a network position outside the gateway that the server\nanswers\
    \ only through the gateway. The system is compliant when the applicable\nhardening command reports PASS, or reports REVIEW\
    \ that the reviewer resolves by\nconfirming the capability set is minimized, and the server is reachable only via the\n\
    gateway.\n Page 274"
  remediation: "Configure the container for a non-root user, a read-only root filesystem, all capabilities\ndropped with only\
    \ strictly required capabilities added back, and no-new-privileges.\nLeave Docker's default seccomp and AppArmor profiles\
    \ in place rather than disabling\nthem. Under Docker, run the server with the following hardened configuration, omitting\n\
    --cap-add when no capability is approved:\ndocker run --user <UID>:<GID> --read-only --cap-drop=ALL --cap-add=<APPROVED_CAP>\
    \ --\nsecurity-opt no-new-privileges <IMAGE>\nDo not use --privileged, --security-opt seccomp=unconfined, or --\nsecurity-opt\
    \ apparmor=unconfined. Managed container platforms and\nKubernetes set the same properties through the container security\
    \ context. Apply the\nfollowing, omitting add when no capability is approved, and attach an AppArmor or\nSELinux profile\
    \ through the platform's mechanism:\nsecurityContext:\n runAsNonRoot: true\n runAsUser: <UID>\n readOnlyRootFilesystem:\
    \ true\n allowPrivilegeEscalation: false\n capabilities:\n drop: [\"ALL\"]\n add: [\"<APPROVED_CAP>\"]\n seccompProfile:\n\
    \ type: RuntimeDefault\nFor a server deployed in a VM or directly on a host rather than a container, configure\nthe equivalent\
    \ properties on the service manager. Run it under a dedicated non-root\naccount and apply the following directives to\
    \ the systemd unit, leaving\nCapabilityBoundingSet empty when no capability is approved and replacing\nAppArmorProfile\
    \ with SELinuxContext on an SELinux host. Leave the mandatory\naccess control profile enabled:\n[Service]\nUser=<SERVICE_ACCOUNT>\n\
    NoNewPrivileges=yes\nCapabilityBoundingSet=<APPROVED_CAPS>\nProtectSystem=strict\nReadWritePaths=<REQUIRED_PATHS>\nSystemCallFilter=@system-service\n\
    AppArmorProfile=<PROFILE>\n Page 275\nSeparately, place the server behind a gateway that enforces ingress policy and\n\
    centralizes authorization, rate limiting, anomaly detection, and a kill switch. Enforce\noutbound confinement separately\
    \ at the host or network layer, for example with an\negress proxy or a network policy, because the ingress gateway does\
    \ not mediate the\nserver's outbound connections. The gateway is distinct from the hardening and does not\nsubstitute\
    \ for it."
  checks:
  - type: command
    command: got=$(printf '%s' "$caps" | tr 'A-Z ' 'a-z\n' | sed 's/^cap_//' | grep -v '^$' |
    expected: ''
    severity: medium
    info: "Confirm the container or containers running the server are hardened. Pass one or more\ncontainer names or ids in\
      \ CONTAINER, for example a single name or $(docker\ncompose ps -q) for a multi-container deployment. A container that\
      \ exists but is not\nrunning returns ERROR, because inspecting a stopped object does not prove the running\nworkload\
      \ is confined.\n Page 271\nCONTAINER=\"<CONTAINER_NAME_OR_ID>\"\nEX"
- id: '9.2'
  title: Ensure the MCP server process is confined to its working set by OS-level kernel-enforced controls
  scoring: scored
  profile:
  - Level 1
  description: Each MCP server process is confined to the directories it legitimately needs by OS-level enforcement that the
    kernel applies regardless of what the server code attempts. Suitable mechanisms include POSIX ACLs, a mandatory access
    control profile such as AppArmor or SELinux, and container bind mounts for containerized deployments. The deployment selects
    the mechanism, and whichever is used, the service account's effective filesystem access is confined to its working set.
    MCP Roots is a deprecated advisory feature that a server can ignore, so it is never the boundary and is not relied on
    for containment. The boundary is verified as the MCP service account, by reading a known file inside the working set and
    being denied a known file outside it, and denied attempts are logged for anomaly detection.
  rationale: MCP Roots does not constrain a server that ignores it, and under the 2026-07-28 revision it is deprecated, so
    only kernel-enforced OS-level mechanisms actually contain file access. POSIX ACLs, MAC profiles, and bind mounts restrict
    the service account to its working directory regardless of what the server code attempts, which makes them the real boundary.
    Logging denials surfaces probing or misbehavior.
  impact: Confining the process requires identifying the legitimate working set and may need iteration. Where a mandatory
    access control profile is used, it is authored and confirmed separately from any ACLs. Page 277
  references:
  - '1. MCP specification (Client Features / Roots):'
  - https://modelcontextprotocol.io/specification/2026-07-28/client/roots
  - '2. MCP specification (Deprecated Features):'
  - https://modelcontextprotocol.io/specification/2026-07-28/deprecated
  - https://modelcontextprotocol.io/docs/2026-0728/tutorials/security/security_best_practices
  page_start: 277
  audit_raw: "Confirm, as the MCP service account, that a known file inside the working set is\nreadable and a known file\
    \ outside it is denied. Then review the confinement\nconfiguration to confirm it restricts the account to the intended\
    \ directories. Reading a\nsystem file such as /etc/shadow does not demonstrate the boundary, because every\nnon-root account\
    \ is denied it by default. The check therefore reads a sentinel the\naccount should reach and a sentinel it should not.\
    \ This block requires sudo and the\nservice account. Run the following command, supplying the two sentinel file names\
    \ in\nWORK_SENTINEL and OOS_SENTINEL:\nSVC_ACCT=\"<MCP_SERVICE_ACCOUNT>\"\nWORK_DIR=\"<MCP_WORK_DIR>\"\nOUT_OF_SCOPE=\"\
    <SENSITIVE_DIR_OUTSIDE_SCOPE>\"\nWORK_SENTINEL=\"${WORK_SENTINEL:-<WORK_SENTINEL_FILE>}\"\nOOS_SENTINEL=\"${OOS_SENTINEL:-<OUT_OF_SCOPE_SENTINEL_FILE>}\"\
    \nif [ ! -f \"$WORK_DIR/$WORK_SENTINEL\" ] || [ ! -f \"$OUT_OF_SCOPE/$OOS_SENTINEL\" ];\nthen\n echo \"ERROR: sentinel\
    \ files missing, need a readable file at\n$WORK_DIR/$WORK_SENTINEL and $OUT_OF_SCOPE/$OOS_SENTINEL so the denial is\n\
    attributable to the boundary and not to an empty path\"\nelse\n in_ok=1; out_denied=1\n sudo -u \"$SVC_ACCT\" cat \"$WORK_DIR/$WORK_SENTINEL\"\
    \ >/dev/null 2>&1 || in_ok=0\n if sudo -u \"$SVC_ACCT\" cat \"$OUT_OF_SCOPE/$OOS_SENTINEL\" >/dev/null 2>&1; then\nout_denied=0;\
    \ fi\n if [ \"$in_ok\" != 1 ]; then\n echo \"ERROR: service account cannot read its own working file\n$WORK_DIR/$WORK_SENTINEL,\
    \ the profile is wrong or the account is misconfigured\"\n elif [ \"$out_denied\" = 1 ]; then\n echo \"PASS: service account\
    \ reads its working file and is denied the out-of-scope\nfile $OUT_OF_SCOPE/$OOS_SENTINEL\"\n else\n echo \"FAIL: service\
    \ account can read out-of-scope file $OUT_OF_SCOPE/$OOS_SENTINEL\n(OS controls not confining it to $WORK_DIR)\"\n fi\n\
    fi\nThis Recommendation is compliant when the account reads its working sentinel, is\ndenied the out-of-scope sentinel,\
    \ and the command prints PASS, and a reviewer\nconfirms that the mandatory access control profile is present and that\
    \ denied attempts\nare logged.\n Page 278"
  remediation: 'Confine the MCP service account to its working directory with OS-level enforcement

    and deny it access to sensitive paths. Then confirm the effective access with the

    sentinel check in the Audit. Where POSIX ACLs are the chosen mechanism, the

    following commands apply a working-directory-only restriction. They need setfacl from

    the acl package and a filesystem mounted with ACL support:

    SVC_ACCT="<MCP_SERVICE_ACCOUNT>"

    WORK_DIR="<MCP_WORK_DIR>"

    SENSITIVE_DIR="<SENSITIVE_DIR>"

    sudo setfacl -R -m u:"$SVC_ACCT":rX "$WORK_DIR"

    sudo setfacl -R -m u:"$SVC_ACCT":--- "$SENSITIVE_DIR"

    Where a mandatory access control profile is the chosen mechanism, author an

    AppArmor or SELinux profile that confines the process to the same scope. The profile is

    platform-specific and is not applied by the commands above. For containerized

    deployments, expose only the working directory through a bind mount, read-only where

    possible. Configure denied-access logging for anomaly detection.'
  checks:
  - type: manual_review
    info: 'Confirm, as the MCP service account, that a known file inside the working set is

      readable and a known file outside it is denied. Then review the confinement

      configuration to confirm it restricts the account to the intended directories. Reading a

      system file such as /etc/shadow does not demonstrate the boundary, because every

      non-root account is denied it by default. The check therefore reads a sentinel the

      account should reach and a sentinel it should not. This block requires sudo and the

      servic'
    severity: medium
- id: '9.3'
  title: Ensure local stdio MCP servers run under least-privilege identities with sandbox or container isolation
  scoring: manual
  profile:
  - Level 2
  description: 'Each local stdio MCP server runs under a least-privilege identity and inside an isolation boundary that limits
    its filesystem reach, network egress, and ability to spawn subprocesses to what its declared function requires. A stdio
    server is a subprocess of the host and, without such a boundary, inherits the full privileges of the host user: every
    file, credential, environment variable, and network destination that user can reach. The isolation boundary may be a container,
    an operating-system sandbox, systemd sandboxing directives, or a mandatory access control profile combined with capability
    restrictions. The mechanism varies by platform, but the required properties do not. The execution identity is non-privileged,
    and where feasible it is distinct from or restricted relative to the interactive user. Filesystem access is limited to
    the paths the server''s declared function requires. Outbound network access is limited to the destinations the server''s
    function requires, which is none for a server with no network function. Subprocess execution is disabled or restricted
    to declared helper binaries. In higher-risk environments, sandboxed execution is the default for all local servers, with
    exceptions documented.'
  rationale: 'A remote, network-exposed server is contained so that a compromise stays inside a boundary, and a compromised
    local server needs the same containment. The local population is in practice the riskier one. It is dominated by community
    tool wrappers with a documented record of command injection, the attack class in which a crafted argument to a wrapper
    yields arbitrary command execution. Filesystem confinement limits what a compromised server can read on disk. It does
    not stop that server from opening an outbound connection to exfiltrate what it can read, or from spawning a shell, which
    is exactly the capability this attack class gives an attacker. Constraining egress and subprocess execution turns arbitrary
    code execution inside the sandbox from a full compromise of the user context into a bounded event: the attacker holds
    a process that can read its permitted paths and reach its permitted destinations, and nothing else. A least-privilege
    identity is what makes the rest enforceable, because a sandbox configured by the same unconstrained user it confines is
    only advisory. Page 280'
  impact: There is a meaningful setup cost per server. Each local server needs its isolation profile authored (permitted paths,
    permitted destinations, permitted helpers). A server with an undeclared runtime dependency will break inside the boundary
    until the profile is corrected. Developer workflows that install and run ad hoc local servers acquire friction by design.
    Platforms differ in mechanism, so the properties are portable while the profiles are not. Page 281
  references:
  - '1. MCP specification (Base Protocol / Transports / stdio):'
  - https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/stdio
  - '2. MCP specification (security best practices):'
  - https://modelcontextprotocol.io/docs/2026-0728/tutorials/security/security_best_practices
  page_start: 280
  audit_raw: "Verify for each approved local stdio server that the running process is confined as its\nprofile declares. Confirm\
    \ that the execution identity is the designated least-privilege\nidentity, that the isolation mechanism limits filesystem\
    \ access to the paths documented\nfor the server, that a default-deny egress policy with an allowlist of the declared\n\
    destinations is applied, and that subprocess execution is disabled or restricted. Under\nsystemd, the command below evaluates\
    \ the unit's sandbox properties. Supply the\napproved account in EXPECTED_USER, and any approved capability set in\nEXPECTED_CAPS\
    \ where the deployment defines one. A unit that is loaded but not active\nreturns ERROR, because a running process is\
    \ required to verify runtime confinement. An\nIPv4 catch-all denial is accepted as default-deny when the unit restricts\
    \ address families\nto exclude AF_INET6. The command needs systemctl. Run the following command:\n Page 282\nUNIT=\"<SYSTEMD_UNIT>\"\
    \nout=$(systemctl show \"$UNIT\" -p\nLoadState,ActiveState,SubState,User,NoNewPrivileges,ProtectSystem,ProtectHome,Capabil\n\
    ityBoundingSet,SystemCallFilter,IPAddressDeny,IPAddressAllow,RestrictAddressFamilies\n2>/dev/null)\nget() { printf '%s\\\
    n' \"$out\" | sed -n \"s/^$1=//p\" | head -n1; }\nnorm_caps() { printf '%s' \"$1\" | tr 'A-Z' 'a-z' | tr ' ,' '\\n\\n'\
    \ | sed\n's/^cap_//;/^$/d' | sort | tr '\\n' ' '; }\nload=$(get LoadState)\nif [ -z \"$out\" ] || [ \"$load\" = \"not-found\"\
    \ ] || [ \"$load\" = \"bad-setting\" ] || { [ -\nn \"$out\" ] && [ -z \"$load\" ]; }; then\n echo \"ERROR: unit $UNIT\
    \ not loaded (LoadState='${load:-unknown}') or systemctl\nunavailable; confirm the unit name, or use the container or\
    \ MAC form of this audit\"\nelse\n active=$(get ActiveState)\n if [ \"$active\" != \"active\" ]; then\n echo \"ERROR:\
    \ unit $UNIT is loaded but not active (ActiveState='${active:-\nunknown}', SubState='$(get SubState)'); a running process\
    \ is required to verify\nruntime confinement\"\n else\n fails=\"\"\n u=$(get User)\n if [ -n \"${EXPECTED_USER:-}\" ];\
    \ then\n [ \"$u\" = \"$EXPECTED_USER\" ] || fails=\"$fails User\"\n else\n { [ -n \"$u\" ] && [ \"$u\" != \"root\" ];\
    \ } || fails=\"$fails User\"\n fi\n [ \"$(get NoNewPrivileges)\" = \"yes\" ] || fails=\"$fails NoNewPrivileges\"\n ps=$(get\
    \ ProtectSystem); { [ \"$ps\" = \"strict\" ] || [ \"$ps\" = \"full\" ]; } ||\nfails=\"$fails ProtectSystem\"\n ph=$(get\
    \ ProtectHome); { [ \"$ph\" = \"yes\" ] || [ \"$ph\" = \"read-only\" ] || [ \"$ph\"\n= \"tmpfs\" ]; } || fails=\"$fails\
    \ ProtectHome\"\n cbs=$(get CapabilityBoundingSet)\n if [ -n \"${EXPECTED_CAPS:-}\" ]; then\n [ \"$(norm_caps \"$cbs\"\
    )\" = \"$(norm_caps \"$EXPECTED_CAPS\")\" ] || fails=\"$fails\nCapabilityBoundingSet\"\n else\n [ -z \"$cbs\" ] || fails=\"\
    $fails CapabilityBoundingSet\"\n fi\n scf=$(get SystemCallFilter)\n [ -n \"${scf#\\~}\" ] || fails=\"$fails SystemCallFilter\"\
    \n deny=$(get IPAddressDeny)\n allow=$(get IPAddressAllow)\n raf=$(get RestrictAddressFamilies)\n ipv6_blocked=0\n if\
    \ [ -n \"$raf\" ]; then\n case \"$raf\" in\n \"~\"*) case \"$raf\" in *AF_INET6*) ipv6_blocked=1 ;; esac ;;\n *) case\
    \ \"$raf\" in *AF_INET6*) : ;; *) ipv6_blocked=1 ;; esac ;;\n esac\n Page 283\n fi\n deny_ok=0\n if printf '%s' \" $deny\
    \ \" | grep -q ' any '; then deny_ok=1\n elif printf '%s' \"$deny\" | grep -q '0\\.0\\.0\\.0/0' && printf '%s' \"$deny\"\
    \ | grep -\nq '::/0'; then deny_ok=1\n elif printf '%s' \"$deny\" | grep -q '0\\.0\\.0\\.0/0' && [ \"$ipv6_blocked\" =\
    \ 1 ];\nthen deny_ok=1\n fi\n allow_bad=0\n printf '%s' \"$allow\" | grep -Eq '0\\.0\\.0\\.0/0|::/0|(^| )any( |$)' &&\
    \ allow_bad=1\n { [ \"$deny_ok\" = 1 ] && [ \"$allow_bad\" = 0 ]; } || fails=\"$fails\nEgressDefaultDeny\"\n for f in\
    \ $fails; do echo \"detail: property not at required setting: $f\"; done\n [ -z \"${EXPECTED_USER:-}\" ] && echo \"detail:\
    \ User=$u not verified against an\napproved profile; confirm it is the designated least-privilege identity\"\n [ -n \"\
    $allow\" ] && [ \"$allow_bad\" = 0 ] && echo \"detail: egress allowlist present\n(IPAddressAllow=$allow); confirm it matches\
    \ the server documented destinations\"\n [ -z \"$fails\" ] && echo \"PASS: running unit under a restricted identity with\n\
    filesystem, capability, syscall, and default-deny egress restrictions applied\" ||\necho \"FAIL: unit is missing required\
    \ sandbox properties:$fails\"\n fi\nfi\nThen test denials as the confined identity: attempt to read a path outside the\
    \ profile,\nopen a connection to an undeclared destination, and spawn an undeclared binary, and\nconfirm that each is\
    \ denied and logged. This Recommendation is compliant when every\napproved local server runs under its designated identity\
    \ inside an isolation boundary\nwhose filesystem, egress, and subprocess restrictions match its documented profile,\n\
    and whose denials can be demonstrated."
  remediation: "Author an isolation profile for each approved local server that documents its required\npaths, required network\
    \ destinations, and required helper binaries. Run the server\ninside a boundary that enforces that profile. The boundary\
    \ may be a container with a\nnon-root user, a read-only root filesystem, dropped capabilities, and an egress policy. It\n\
    may be systemd sandboxing directives: a dedicated user, filesystem protection, a\ndefault-deny egress policy set with\
    \ IPAddressDeny=any and an IPAddressAllow\nallowlist of the declared destinations, an approved capability set, and restricted\
    \ system\ncalls. Or it may be a MAC profile with equivalent constraints. Set the execution identity\nto a dedicated least-privilege\
    \ account where the host supports launching servers under\none. Log denials from the boundary for anomaly detection. The\
    \ mechanism differs by\nplatform, but the required properties (identity, filesystem, egress, subprocess) do not.\n Page\
    \ 284"
  checks:
  - type: command
    command: if printf '%s' " $deny " | grep -q ' any '; then deny_ok=1 && elif printf '%s' "$deny" | grep -q '0\.0\.0\.0/0'
      && printf '%s' "$deny" | grep - && elif printf '%s' "$deny" | grep -q '0\.0\.0\.0/0' && [ "$ipv6_blocked" = 1 ]; &&
      printf '%s' "$allow" | grep -Eq '0\.0\.0\.0/0|::/0|(^| )any( |$)' && allow_bad=1
    expected: ''
    severity: medium
    info: 'Verify for each approved local stdio server that the running process is confined as its

      profile declares. Confirm that the execution identity is the designated least-privilege

      identity, that the isolation mechanism limits filesystem access to the paths documented

      for the server, that a default-deny egress policy with an allowlist of the declared

      destinations is applied, and that subprocess executi'
- id: '10.1'
  title: Ensure safe, static resources are cached with freshness limits and per-user data is never shared-cached
  scoring: manual
  profile:
  - Level 1
  description: 'Genuinely immutable or infrequently changing resources are cached using ETag or Last-Modified headers, which
    enable conditional requests, and static content carries appropriate Cache-Control directives for client-side caching.
    Cached entries are invalidated when a resource updates, and a relevant change notification invalidates a cached result
    immediately, even before its ttlMs elapses. Authorization decisions, security-sensitive resource content, and resources
    that vary by user identity are never held in a shared cache. This Recommendation covers two caching layers. At the HTTP
    layer, static resource content served over HTTP carries validators and a CacheControl policy, and dynamic or identity-sensitive
    content is marked no-store or private. At the protocol layer, the 2026-07-28 revision requires the cacheable-result fields
    resultType, ttlMs, and cacheScope on the results of resources/list, resources/read, resources/templates/list, tools/list,
    prompts/list, and server/discover. Every ordinary result carries resultType: "complete". Any per-user or identity-sensitive
    result is marked cacheScope: private, so a shared intermediary reuses it only within the same authorization context. Only
    genuinely non-identity-specific data is marked cacheScope: public. Because a public result may be shared across callers
    even from an authenticated endpoint, cacheScope is set alongside per-primitive access control and is not relied on alone.'
  rationale: Caching immutable resources reduces load and latency without risk. The danger is caching the wrong thing. Caching
    an authorization decision can let a revoked permission persist, and serving per-user data from a shared cache can disclose
    one user's data to another. Under the 2026-07-28 revision, the cacheScope hint makes the sharing boundary explicit. Marking
    identity-sensitive data public is a direct confidentiality failure, because a public result may be reused across authorization
    contexts even when it came from an authenticated endpoint. The default for anything that varies by user is therefore private.
    The hint does not replace access control, so per-primitive authorization is enforced regardless of the cache scope set.
  impact: Configuring ETag and Cache-Control for static content is low effort. Scoping per-user data as private adds negligible
    cost. Page 287
  references:
  - '1. MCP specification (Server Features / Resources):'
  - https://modelcontextprotocol.io/specification/2026-07-28/server/resources
  - '2. MCP specification (Server Features / Utilities / Caching):'
  - https://modelcontextprotocol.io/specification/2026-07-28/server/utilities/caching
  page_start: 287
  audit_raw: "Inspect the caching response headers for a sample of static and dynamic resources.\nRun the following command\
    \ against a static resource. It reports a single verdict and\nrejects a resource that carries a non-shareable directive\
    \ alongside caching:\nURL=\"https://<SERVER_URL>/static/<PATH>\"\nresp=$(curl -sS -m 10 -D - -o /dev/null \"$URL\" 2>/dev/null)\
    \ || resp=\"\"\ncode=$(printf '%s\\n' \"$resp\" | awk 'NR==1{print $2}')\nval=$(printf '%s\\n' \"$resp\" | grep -Ei '^(etag|last-modified):'\
    \ | tr -d '\\r')\ncc=$(printf '%s\\n' \"$resp\" | grep -Ei '^cache-control:' | head -1 | sed 's/^[Cc]ache-\n[Cc]ontrol:[[:space:]]*//'\
    \ | tr -d '\\r')\ntokens=$(printf '%s' \"$cc\" | tr ',' '\\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'\n| tr 'A-Z'\
    \ 'a-z')\nhas_maxage=$(printf '%s\\n' \"$tokens\" | grep -Eqx 'max-age=[0-9]+' && echo 1)\nhas_nostore=$(printf '%s\\\
    n' \"$tokens\" | grep -Eqx 'no-store' && echo 1)\nhas_private=$(printf '%s\\n' \"$tokens\" | grep -Eqx 'private' && echo\
    \ 1)\nif ! printf '%s' \"$code\" | grep -Eq '^[0-9]+$'; then\n echo \"ERROR: static resource unreachable, no attribution\
    \ possible\"\nelif [ \"$code\" -ge 400 ]; then\n echo \"ERROR: static path returned $code, cannot attribute cache policy\
    \ to the\nresource\"\nelif [ -n \"$has_nostore\" ] || [ -n \"$has_private\" ]; then\n echo \"FAIL: static resource carries\
    \ a contradictory non-shareable directive (nostore/private) alongside caching ($code)\"\nelif [ -n \"$val\" ] && [ -n\
    \ \"$has_maxage\" ]; then\n echo \"PASS: static resource carries a validator and a Cache-Control max-age\n($code)\"\n\
    else\n echo \"FAIL: static resource lacks a validator or a Cache-Control max-age ($code)\"\nfi\nRun the following command\
    \ against a dynamic or identity-sensitive resource. It matches\nno-store or private as directives, so no-cache alone does\
    \ not pass:\n Page 288\nURL=\"https://<SERVER_URL>/<DYNAMIC_OR_USER_SPECIFIC_PATH>\"\nresp=$(curl -sS -m 10 -D - -o /dev/null\
    \ \"$URL\" 2>/dev/null) || resp=\"\"\ncode=$(printf '%s\\n' \"$resp\" | awk 'NR==1{print $2}')\ncc=$(printf '%s\\n' \"\
    $resp\" | grep -Ei '^cache-control:' | head -1 | sed 's/^[Cc]ache-\n[Cc]ontrol:[[:space:]]*//' | tr -d '\\r')\ntokens=$(printf\
    \ '%s' \"$cc\" | tr ',' '\\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'\n| tr 'A-Z' 'a-z')\nhas_nostore=$(printf '%s\\\
    n' \"$tokens\" | grep -Eqx 'no-store' && echo 1)\nhas_private=$(printf '%s\\n' \"$tokens\" | grep -Eqx 'private' && echo\
    \ 1)\nif ! printf '%s' \"$code\" | grep -Eq '^[0-9]+$'; then\n echo \"ERROR: dynamic/identity-sensitive resource unreachable,\
    \ no attribution\npossible\"\nelif [ \"$code\" -ge 400 ]; then\n echo \"ERROR: path returned $code, cannot attribute cache\
    \ policy to the resource\"\nelif [ -n \"$has_nostore\" ] || [ -n \"$has_private\" ]; then\n echo \"PASS: dynamic/identity-sensitive\
    \ response is not shared-cacheable ($code)\"\nelse\n echo \"FAIL: dynamic/identity-sensitive response lacks a no-store\
    \ or private\ndirective ($code)\"\nfi\nAt the protocol layer, confirm that a cacheable result for per-user data is a conformant\n\
    complete result marked private. Capture a resources/read for an identitysensitive resource with the 2026-07-28 request\
    \ envelope and confirm that\nresultType is complete, ttlMs is an integer at least zero, and cacheScope is\nprivate. The\
    \ following command reports a single verdict. Substitute the server, the\nper-user resource URI, and its name:\n Page\
    \ 289\nURL=\"https://<SERVER_URL>/mcp\"\nRES_URI=\"<PER_USER_RESOURCE_URI>\"\nRES_NAME=\"<RESOURCE_NAME>\"\nPROTO=\"2026-07-28\"\
    \nmeta='\"_meta\":{\"io.modelcontextprotocol/protocolVersion\":\"2026-0728\",\"io.modelcontextprotocol/clientCapabilities\"\
    :{},\"io.modelcontextprotocol/clientIn\nfo\":{\"name\":\"cis-mcp-audit\",\"version\":\"1.0\"}}'\nbody=\"{\\\"jsonrpc\\\
    \":\\\"2.0\\\",\\\"id\\\":1,\\\"method\\\":\\\"resources/read\\\",\\\"params\\\":{\\\"uri\\\"\n:\\\"$RES_URI\\\",$meta}}\"\
    \nresp=$(curl -sS -m 10 -X POST -H 'Content-Type: application/json' -H \"MCP-ProtocolVersion: $PROTO\" -H 'Mcp-Method:\
    \ resources/read' -H \"Mcp-Name: $RES_NAME\" --databinary \"$body\" \"$URL\" 2>/dev/null) || resp=\"\"\nfields=$(printf\
    \ '%s' \"$resp\" | python3 -c 'import sys,json\ntry:\n r=json.load(sys.stdin).get(\"result\",{}) or {}\n print(\"%s|%s|%s\"\
    \ % (r.get(\"resultType\",\"\"), r.get(\"ttlMs\",\"\"),\nr.get(\"cacheScope\",\"\")))\nexcept Exception:\n print(\"||\"\
    )' 2>/dev/null)\nrt=${fields%%|*}; rest=${fields#*|}; ttl=${rest%%|*}; cs=${rest##*|}\nif [ -z \"$resp\" ]; then\n echo\
    \ \"ERROR: server unreachable, no attribution possible\"\nelif [ -z \"$rt\" ] && [ -z \"$cs\" ]; then\n echo \"ERROR:\
    \ no result fields returned, confirm the request envelope and endpoint\"\nelif [ \"$rt\" != \"complete\" ]; then\n echo\
    \ \"FAIL: result is missing resultType complete (got '$rt'), not a conformant\ncacheable result\"\nelif ! printf '%s'\
    \ \"$ttl\" | grep -Eq '^[0-9]+$'; then\n echo \"FAIL: result lacks a non-negative ttlMs (got '$ttl')\"\nelif [ \"$cs\"\
    \ = \"private\" ]; then\n echo \"PASS: per-user result is complete, carries ttlMs, and is marked cacheScope\nprivate\"\
    \nelif [ \"$cs\" = \"public\" ]; then\n echo \"FAIL: per-user result is marked cacheScope public, a cross-user disclosure\n\
    path\"\nelse\n echo \"REVIEW: cacheScope is '$cs', confirm the intended visibility for this\nresource\"\nfi\nThis protocol-layer\
    \ command is an optional aid to a per-primitive review rather than a\nrequired block, because the correct scope is resource-specific\
    \ and a generic probe\ncannot judge every primitive.\nThis Recommendation is compliant when the static-resource command\
    \ prints PASS, the\ndynamic-resource command prints PASS, and a reviewer confirms that every per-user\nor identity-sensitive\
    \ cacheable result is marked cacheScope: private, that no such\nresult is marked public, and that per-primitive access\
    \ control is enforced\nindependently of the cache scope.\n Page 290"
  remediation: 'Enable ETag or Last-Modified generation for genuinely static content, and set

    Cache-Control max-age values appropriate to how static each resource is, with

    invalidation on update. Mark all dynamic, identity-sensitive, and authorization-related

    responses Cache-Control: no-store. This is web-server and application

    configuration. Where a reverse proxy serves static content, the following nginx fragment

    is illustrative. It sets a validator and max-age on the static location and no-store on

    the dynamic location:

    location /static/ { etag on; add_header Cache-Control "public, max-age=3600"; }

    location /api/ { add_header Cache-Control "no-store" always; }

    At the protocol layer, set cacheScope: private on resources/list,

    resources/read, and other cacheable results for any per-user or identity-sensitive

    data. Reserve cacheScope: public for genuinely non-identity-specific data. Set

    ttlMs to a freshness bound appropriate to the data. Enforce per-primitive access

    control independently of the cache scope.'
  checks:
