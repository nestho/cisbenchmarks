- id: 5.3.1
  title: Ensure logs are separated from the protocol stream in stdio mode
  scoring: scored
  profile:
  - Level 1
  description: 'In stdio transport mode, stdout is reserved exclusively for valid JSON-RPC protocol messages. A valid message
    is a response correlated by id, or a notification that relates to an in-flight request or an active subscription. A server
    does not write JSON-RPC requests to stdout under the 2026-07-28 revision because server-initiated interaction uses the
    multi round-trip pattern inside a response rather than a serveroriginated request. No log output, diagnostic message,
    progress banner, or debug line may be written to stdout, and all logging goes to stderr or a file sink. The requirement
    is unconditional: a single invalid line on stdout is a failure. Logger configuration is verified at startup to confirm
    no appender or handler writes to stdout before the server accepts connections.'
  rationale: stdio framing depends on stdout carrying only well-formed JSON-RPC responses and notifications. Any log line,
    banner, or stray write corrupts the stream and breaks the client, and a line that happens to contain a jsonrpc field but
    is not a valid message is contamination just the same. Validating that each line is a valid response or notification,
    rather than merely that a field is present, is what distinguishes a clean protocol channel from a contaminated one. Directing
    all logging to stderr or a file keeps the channel clean. Under the 2026-07-28 revision, the Logging capability is deprecated,
    and its advised replacement is stderr or OpenTelemetry, which aligns with this requirement.
  impact: Operational impact is minimal. Directing logs to stderr or a file provides equivalent observability without interfering
    with the protocol stream. Redirecting logging away from stdout and adding a startup guard is one-time configuration for
    a server that does not already do so. Page 196
  references:
  - '1. MCP specification (Base Protocol / Overview):'
  - https://modelcontextprotocol.io/specification/2026-07-28/basic
  - '2. MCP specification (Base Protocol / Transports / stdio):'
  - https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/stdio
  - https://modelcontextprotocol.io/specification/2026-07-28/changelog
  page_start: 196
  audit_raw: "Confirm that the stdio server's stdout carries only valid JSON-RPC messages and\nstays clean during startup.\
    \ First capture the server's stdout into a file while sending it\ntool calls and any requests that trigger notifications,\
    \ then run the following command to\nvalidate each captured line:\nOUT=\"<CAPTURED_STDOUT_FILE>\"\n[ -f \"$OUT\" ] ||\
    \ { echo \"ERROR: captured stdout file not found at $OUT\"; exit 0; }\n[ -s \"$OUT\" ] || { echo \"ERROR: captured stdout\
    \ file is empty, no representative\nexchange to check\"; exit 0; }\nbad=0; review=0; total=0\nwhile IFS= read -r line;\
    \ do\n [ -z \"$line\" ] && continue\n total=$((total+1))\n cls=$(printf '%s' \"$line\" | jq -r '\n if type != \"object\"\
    \ then \"bad\"\n elif (.jsonrpc != \"2.0\") then \"bad\"\n elif (has(\"method\") and has(\"id\")) then \"request\"\n elif\
    \ has(\"method\") then \"notification\"\n elif (has(\"id\") and has(\"result\") and (has(\"error\")|not)) then \"response\"\
    \n elif (has(\"id\") and has(\"error\") and (has(\"result\")|not)) then \"response\"\n else \"bad\" end' 2>/dev/null)\n\
    \ [ -n \"$cls\" ] || cls=\"bad\"\n case \"$cls\" in\n request) review=$((review+1)); echo \"detail: server-originated\
    \ request on stdout, a\n2026-07-28 server does not emit requests here: $line\" ;;\n notification|response) : ;;\n *) bad=$((bad+1));\
    \ echo \"detail: non-JSON-RPC or malformed line on stdout:\n$line\" ;;\n esac\ndone < \"$OUT\"\nif [ \"$bad\" -gt 0 ];\
    \ then\n echo \"FAIL: $bad of $total stdout line(s) are not valid JSON-RPC messages, the\nprotocol stream is contaminated\"\
    \nelif [ \"$review\" -gt 0 ]; then\n echo \"REVIEW: $review of $total stdout line(s) are server-originated requests, which\n\
    a 2026-07-28 server should not emit on stdout, attribute before concluding\"\nelse\n echo \"PASS: all $total stdout line(s)\
    \ are valid JSON-RPC responses or notifications\"\nfi\nThen confirm stdout stays clean during startup, before any protocol\
    \ input arrives. Run\nthe following command, substituting the server's startup command:\n Page 197\nSERVER_CMD=\"<SERVER_STARTUP_COMMAND>\"\
    \nout=$(mktemp); err=$(mktemp)\ntimeout 5 sh -c \"$SERVER_CMD\" </dev/null 1>\"$out\" 2>\"$err\"\nstatus=$?\ncase \"$status\"\
    \ in\n 127) echo \"ERROR: startup command not found (127), cannot assess stdout hygiene\"; rm\n-f \"$out\" \"$err\"; exit\
    \ 0 ;;\n 126) echo \"ERROR: startup command not executable (126), cannot assess stdout\nhygiene\"; rm -f \"$out\" \"$err\"\
    ; exit 0 ;;\n 124) state=\"still running when the timeout fired\" ;;\n 0) state=\"exited cleanly before the timeout\"\
    \ ;;\n *) echo \"ERROR: startup command exited $status before the timeout, the server did\nnot stay up, cannot assess\
    \ stdout hygiene (stderr head: $(head -c 200 \"$err\" | tr\n'\\n' ' '))\"; rm -f \"$out\" \"$err\"; exit 0 ;;\nesac\n\
    if [ -s \"$out\" ]; then\n echo \"FAIL: content on stdout during startup before any protocol input ($state):\n$(head -c\
    \ 200 \"$out\" | tr '\\n' ' ')\"\nelse\n echo \"PASS: stdout clean during startup with no protocol input ($state)\"\n\
    fi\nrm -f \"$out\" \"$err\"\nThen review the logging configuration to confirm no log output targets stdout, with all\n\
    destinations being stderr or a file. This Recommendation is compliant when every\ncaptured stdout line is a valid JSON-RPC\
    \ response or notification, stdout stays\nclean during an attributable startup, and the logging configuration directs\
    \ all diagnostic\noutput to stderr or a file."
  remediation: "Configure the server's logging so all output goes to stderr or a file and never to\nstdout. The exact setting\
    \ is framework-specific. In Python, initialize the logging\nmodule against a stderr stream and avoid print, which writes\
    \ to stdout. In\nNode.js, use console.error rather than console.log for diagnostics, and confirm\nany logging library\
    \ defaults to stderr. Under the 2026-07-28 revision, prefer stderr\nor OpenTelemetry over the deprecated Logging capability.\
    \ Add a startup guard to the\nlaunch wrapper that fails the launch if anything reaches stdout before protocol input\n\
    arrives, and that distinguishes a failed launch from a clean start rather than treating an\nempty stdout as success. This\
    \ is server configuration, and there is no single portable\ncommand.\n Page 198"
  checks:
  - type: manual_review
    info: 'Confirm that the stdio server''s stdout carries only valid JSON-RPC messages and

      stays clean during startup. First capture the server''s stdout into a file while sending it

      tool calls and any requests that trigger notifications, then run the following command to

      validate each captured line:

      OUT="<CAPTURED_STDOUT_FILE>"

      [ -f "$OUT" ] || { echo "ERROR: captured stdout file not found at $OUT"; exit 0; }

      [ -s "$OUT" ] || { echo "ERROR: captured stdout file is empty, no representative

      exchange to check'
    severity: medium
- id: 5.4.1
  title: Ensure path traversal and arbitrary filesystem access are prevented
  scoring: scored
  profile:
  - Level 1
  description: The server normalizes and canonicalizes every filesystem path supplied as a tool or resource parameter before
    any access-control check or filesystem operation. Canonicalization resolves symbolic links, for example os.path.realpath()
    in Python or fs.realpathSync() in Node.js, before comparing the resolved path against the configured allowlist of approved
    directories. Symlink bypass and ../ directory traversal are two independent attack paths, and each is guarded. The read
    is rejected unless the resolved real path is the approved root itself or a descendant of it, compared by path component
    and not by string prefix, so an approved root such as /srv/approved does not admit a sibling such as /srv/approved_evil.
    Every rejected attempt is logged as a security event.
  rationale: Without canonicalization, a ../ sequence or a symlink can resolve to a file outside the approved scope while
    passing a naive check performed before resolution. Resolving symlinks and ../ first, then checking the resolved real path
    against the allowlist by path component, closes both paths. Comparing by component rather than by string prefix prevents
    a sibling directory whose name begins with the root's name from aliasing into the root. Logging rejected attempts surfaces
    probing.
  impact: Per-call overhead is negligible. Configuring the path-handling middleware and the approved-directory allowlist is
    one-time setup. Page 201
  references:
  - '1. MCP specification (Key Changes):'
  - https://modelcontextprotocol.io/specification/2026-07-28/changelog
  - '2. MCP specification (Server Features / Resources, security considerations):'
  - https://modelcontextprotocol.io/specification/2026-07-28/server/resources
  page_start: 201
  audit_raw: "Confirm that a resource read whose URI escapes the approved root is denied, while an\nallowed read under the\
    \ same conditions succeeds. Run the following command,\nsubstituting the endpoint, an allowed resource URI under the approved\
    \ root, and a\ntraversal URI that points outside it, for example\nfile:///approved/../../etc/passwd:\n Page 202\nMCP_ENDPOINT=\"\
    <MCP_ENDPOINT>\"\nALLOWED_URI=\"<ALLOWED_RESOURCE_URI>\"\nTRAVERSAL_URI=\"<TRAVERSAL_RESOURCE_URI>\"\nread_uri(){ curl\
    \ -sS --connect-timeout 5 -m 10 -X POST \"$MCP_ENDPOINT\" \\\n -H 'Content-Type: application/json' -H 'Accept: application/json,\
    \ text/event-stream'\n\\\n -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: resources/read' -H \"Mcp-Name:\n$2\"\
    \ \\\n -d\n\"{\\\"jsonrpc\\\":\\\"2.0\\\",\\\"id\\\":$1,\\\"method\\\":\\\"resources/read\\\",\\\"params\\\":{\\\"uri\\\
    \":\\\"$\n2\\\",\\\"_meta\\\":{\\\"io.modelcontextprotocol/protocolVersion\\\":\\\"2026-0728\\\",\\\"io.modelcontextprotocol/clientInfo\\\
    \":{\\\"name\\\":\\\"cis-benchmarkaudit\\\",\\\"version\\\":\\\"1.0\\\"},\\\"io.modelcontextprotocol/clientCapabilities\\\
    \":{}}}}\"\n2>/dev/null; }\npick(){ o=$(printf '%s' \"$1\" | jq -c \"select(.jsonrpc) | select(.id==$2)\" 2>/dev/null\n\
    | head -n1); [ -n \"$o\" ] || o=$(printf '%s\\n' \"$1\" | sed -n 's/^data:[[:space:]]*//p'\n| while IFS= read -r d; do\
    \ printf '%s' \"$d\" | jq -e \"select(.id==$2)\" >/dev/null 2>&1\n&& { printf '%s' \"$d\"; break; }; done); printf '%s'\
    \ \"$o\"; }\nc=$(read_uri 1 \"$ALLOWED_URI\"); t=$(read_uri 2 \"$TRAVERSAL_URI\")\n[ -n \"$c\" ] && [ -n \"$t\" ] || {\
    \ echo \"ERROR: no response to one or both\nresources/read probes\"; exit 0; }\noc=$(pick \"$c\" 1); ot=$(pick \"$t\"\
    \ 2)\nctrl_ok=$(printf '%s' \"$oc\" | jq -e '.result.contents | length > 0' >/dev/null 2>&1\n&& echo yes || echo no)\n\
    if [ \"$ctrl_ok\" != \"yes\" ]; then\n echo \"ERROR: the positive-control read of an allowed file did not return contents,\n\
    cannot attribute the traversal result to path confinement (check ALLOWED_URI and\nauthorization)\"; exit 0\nfi\nt_contents=$(printf\
    \ '%s' \"$ot\" | jq -e '.result.contents | length > 0' >/dev/null\n2>&1 && echo yes || echo no)\nt_err=$(printf '%s' \"\
    $ot\" | jq -r '.error.code // empty' 2>/dev/null)\nif [ \"$t_contents\" = \"yes\" ]; then\n echo \"FAIL: the allowed read\
    \ succeeded and the traversal read returned contents, the\npath boundary was escaped\"\nelif [ -n \"$t_err\" ]; then\n\
    \ echo \"PASS: the allowed read succeeded and the traversal read was denied with error\n$t_err, path confinement is enforced\"\
    \nelse\n echo \"REVIEW: the allowed read succeeded but the traversal read returned neither\ncontents nor an error, attribute\
    \ before concluding\"\nfi\n Page 203\nThen, using a filesystem-backed environment, stage a symlink inside the approved\n\
    directory that points outside it and repeat the read, to confirm the symlink path is\nguarded independently of the ../\
    \ path. Apply the same probe, a positive control paired\nwith a traversal attempt, to every tool that accepts a path argument.\
    \ This\nRecommendation is compliant when an allowed read under the approved root\nsucceeds, a traversal read that escapes\
    \ the root is denied with no contents returned,\nand the symlink path is guarded independently across every path-taking\
    \ surface."
  remediation: 'Configure the server''s path-handling middleware to canonicalize every supplied path,

    resolving symlinks and ../ via realpath or realpathSync, before any access

    check. Reject the read unless the resolved real path is the approved root or a

    descendant of it, compared by path component rather than by string prefix, and log

    rejected attempts as security events. Set the approved directories in server

    configuration. For defense in depth, add kernel-enforced confinement that resolves

    beneath the root without following symlinks, and apply the OS-level isolation

    Recommendations in Section 9. This is server middleware, so there is no portable

    command for the canonicalization logic itself.'
  checks:
  - type: manual_review
    info: "Confirm that a resource read whose URI escapes the approved root is denied, while an\nallowed read under the same\
      \ conditions succeeds. Run the following command,\nsubstituting the endpoint, an allowed resource URI under the approved\
      \ root, and a\ntraversal URI that points outside it, for example\nfile:///approved/../../etc/passwd:\n Page 202\nMCP_ENDPOINT=\"\
      <MCP_ENDPOINT>\"\nALLOWED_URI=\"<ALLOWED_RESOURCE_URI>\"\nTRAVERSAL_URI=\"<TRAVERSAL_RESOURCE_URI>\"\nread_uri(){ curl\
      \ -sS --connect-timeout 5 -m 10 -X POST"
    severity: medium
- id: 5.5.1
  title: Ensure authorization, scope, and expiry controls are enforced on MCP Tasks
  scoring: manual
  profile:
  - Level 2
  description: MCP Tasks are long-running operations that return a task handle for asynchronous status polling and result
    retrieval. Because the Tasks extension defines task lifecycle management but leaves access control to implementations,
    authorization is enforced independently at task creation, status polling, and result retrieval. The server ensures callers
    can only access tasks they created and re-validates authorization when results are retrieved since credentials may be
    revoked or expire during execution. Task handles are generated from a cryptographically secure random source, remain nonguessable,
    and never serve as proof of identity on their own. Although the extension makes ttlMs nullable and expiration optional,
    Level 2 deployments enforce a finite, non-null retention period through ttlMs as a CIS hardening measure. In the 2026-0728
    revision, Tasks is an extension (io.modelcontextprotocol/tasks) negotiated through extension capabilities and implemented
    through tasks/get, tasks/update, and tasks/cancel. The extension defines no tasks/list method, so callers cannot enumerate
    tasks.
  rationale: A guessable or unauthorized task handle could let an attacker access another user's task status or results. Because
    the Tasks extension enforces authorization only when the server implements it, task security depends on per-identity ownership
    controls, nonguessable handles, and authorization re-validation during result retrieval. The removal of tasks/list prevents
    task enumeration across users but does not prevent access to a specific task handle that has been exposed, which makes
    ownership validation and reauthorization checks essential. Since the extension treats expiration as optional, requiring
    a finite, non-null retention period limits the usefulness of a leaked handle and is a Level 2 requirement under this Recommendation.
  impact: Re-validating authorization at each stage adds minor overhead. Enforcing per-identity ownership and finite ttlMs
    cleanup is one-time implementation work. Page 206
  references:
  - '1. MCP specification (Key Changes):'
  - https://modelcontextprotocol.io/specification/2026-07-28/changelog
  - '2. MCP Extensions (Tasks):'
  - https://modelcontextprotocol.io/extensions/tasks/overview
  page_start: 206
  audit_raw: "Confirm that a task retrievable by its owning identity cannot be retrieved by a second\nidentity. Run the following\
    \ command, substituting the endpoint, a task handle owned by\na first identity, that identity's bearer token, and a second\
    \ identity's bearer token. The\ncommand sets Mcp-Name to the task id as the extension requires:\n Page 207\nURL=\"<MCP_ENDPOINT>\"\
    \nOWNER_TASK='<TASK_HANDLE_OWNED_BY_FIRST_IDENTITY>'\nOWNER_TOKEN='<FIRST_IDENTITY_BEARER_TOKEN>'\nOTHER_TOKEN='<SECOND_IDENTITY_BEARER_TOKEN>'\n\
    gettask(){ curl -sS --connect-timeout 5 -m 10 -X POST \"$URL\" \\\n -H 'Content-Type: application/json' -H 'Accept: application/json,\
    \ text/event-stream'\n\\\n -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: tasks/get' -H \"Mcp-Name:\n$OWNER_TASK\"\
    \ \\\n -H \"Authorization: Bearer $1\" \\\n -d\n\"{\\\"jsonrpc\\\":\\\"2.0\\\",\\\"id\\\":$2,\\\"method\\\":\\\"tasks/get\\\
    \",\\\"params\\\":{\\\"taskId\\\":\\\"$OW\nNER_TASK\\\",\\\"_meta\\\":{\\\"io.modelcontextprotocol/protocolVersion\\\"\
    :\\\"2026-0728\\\",\\\"io.modelcontextprotocol/clientInfo\\\":{\\\"name\\\":\\\"cis-benchmarkaudit\\\",\\\"version\\\"\
    :\\\"1.0\\\"},\\\"io.modelcontextprotocol/clientCapabilities\\\":{\\\"extens\nions\\\":{\\\"io.modelcontextprotocol/tasks\\\
    \":{}}}}}}\" 2>/dev/null; }\npick(){ o=$(printf '%s' \"$1\" | jq -c \"select(.jsonrpc) | select(.id==$2)\" 2>/dev/null\n\
    | head -n1); [ -n \"$o\" ] || o=$(printf '%s\\n' \"$1\" | sed -n 's/^data:[[:space:]]*//p'\n| while IFS= read -r d; do\
    \ printf '%s' \"$d\" | jq -e \"select(.id==$2)\" >/dev/null 2>&1\n&& { printf '%s' \"$d\"; break; }; done); printf '%s'\
    \ \"$o\"; }\nown=$(gettask \"$OWNER_TOKEN\" 1); oth=$(gettask \"$OTHER_TOKEN\" 2)\n[ -n \"$own\" ] && [ -n \"$oth\" ]\
    \ || { echo \"ERROR: no response to one or both tasks/get\nprobes\"; exit 0; }\noo=$(pick \"$own\" 1); ot=$(pick \"$oth\"\
    \ 2)\nown_code=$(printf '%s' \"$oo\" | jq -r '.error.code // empty' 2>/dev/null)\n[ \"$own_code\" = \"-32601\" ] && {\
    \ echo \"ERROR: tasks extension not implemented (-\n32601), nothing to assess\"; exit 0; }\nowner_ok=$(printf '%s' \"\
    $oo\" | jq -e '.result.taskId != null' >/dev/null 2>&1 && echo\nyes || echo no)\nif [ \"$owner_ok\" != \"yes\" ]; then\n\
    \ echo \"ERROR: the owning identity could not retrieve its own task, cannot attribute a\ncross-identity denial to ownership\
    \ (check OWNER_TASK and OWNER_TOKEN)\"; exit 0\nfi\nother_result=$(printf '%s' \"$ot\" | jq -e '.result.taskId != null'\
    \ >/dev/null 2>&1 &&\necho yes || echo no)\nother_err=$(printf '%s' \"$ot\" | jq -r '.error.code // empty' 2>/dev/null)\n\
    if [ \"$other_result\" = \"yes\" ]; then\n echo \"FAIL: the owner retrieved its task and a second identity also retrieved\
    \ the\nsame task, cross-identity task access is not prevented\"\nelif [ -n \"$other_err\" ]; then\n echo \"PASS: the owner\
    \ retrieved its task and a second identity was denied (error\n$other_err), cross-identity access is prevented at the wire,\
    \ confirm the denial\nreason from the backend record\"\nelse\n echo \"REVIEW: the owner retrieved its task but the second\
    \ identity returned neither\na task nor an error, attribute before concluding\"\nfi\n Page 208\nThen confirm from the\
    \ backend authorization record that the second identity's denial is\nan ownership decision rather than an unrelated error\
    \ or a task that never existed,\ninspect the handle-generation mechanism for a cryptographically secure source, and\n\
    confirm tasks carry a finite, non-null ttlMs and are cleaned up. This Recommendation\nis compliant when a second identity\
    \ cannot retrieve a task its owner can, the backend\nrecord establishes the denial as an ownership decision, handles are\
    \ non-guessable,\nand tasks carry a finite retention period."
  remediation: 'Configure the server to generate task handles from a cryptographically secure random

    source, for example a version-4 UUID. Enforce per-identity ownership at both

    tasks/get and result retrieval, and re-validate authorization at retrieval time. Set a

    finite, non-null ttlMs with scheduled cleanup. The extension makes expiry optional, so

    a finite retention period is a Level 2 requirement under this Recommendation. Negotiate

    the Tasks extension through the extension capability, with the client declaring

    io.modelcontextprotocol/tasks in its per-request capabilities. The extension

    defines no tasks/list method, so do not rely on task enumeration. This is server

    middleware, and there is no portable command.'
  checks:
  - type: manual_review
    info: "Confirm that a task retrievable by its owning identity cannot be retrieved by a second\nidentity. Run the following\
      \ command, substituting the endpoint, a task handle owned by\na first identity, that identity's bearer token, and a\
      \ second identity's bearer token. The\ncommand sets Mcp-Name to the task id as the extension requires:\n Page 207\n\
      URL=\"<MCP_ENDPOINT>\"\nOWNER_TASK='<TASK_HANDLE_OWNED_BY_FIRST_IDENTITY>'\nOWNER_TOKEN='<FIRST_IDENTITY_BEARER_TOKEN>'\n\
      OTHER_TOKEN='<SECOND_IDENTITY_BEARER_TOKEN>'\ng"
    severity: medium
- id: 5.6.1
  title: Ensure idempotency keys are required for side-effecting tool calls and duplicate side effects are prevented
  scoring: manual
  profile:
  - Level 2
  description: The server requires a client-supplied idempotency key for every side-effecting tool call and uses that key
    to de-duplicate retries, so a request is not executed twice. In MCP's stateless model, interrupted operations are recovered
    by re-issuing the request with a new request ID, which makes the idempotency key, rather than request tracking, the mechanism
    that guarantees safe replay. Duplicate detection is scoped to the authenticated principal, target server or resource,
    tool name, idempotency key, and a canonical fingerprint of the request arguments. A request with the same key and fingerprint
    returns the previously stored result instead of re-executing. A request that reuses a key with a different fingerprint
    is rejected as an idempotency conflict, to prevent payload substitution or cross-principal result exposure. Multi-node
    deployments require a shared idempotency store because any node may process a retried request. The Idempotency-Key header
    and cached-result indicator are conventions defined by this Recommendation and are not MCP specification fields.
  rationale: 'Without idempotency keys, a retried or replayed side-effecting call executes twice, for example sending an email
    or charging a payment twice. Under the stateless model a broken stream is recovered by re-issuing the request with a new
    request ID, so detecting a repeated request ID would not catch a legitimate re-issue and is not a mechanism the protocol
    provides since a request ID only has to be unique among the sender''s still-outstanding requests. The client-supplied
    idempotency key is what makes the re-issue safe, by returning a stored result instead of re-executing. Scoping the key
    to the principal, server, tool, and request fingerprint prevents three failures: two principals colliding on a key, one
    principal''s stored result reaching another, and the same key with different arguments returning an unrelated result.
    A shared store across load-balanced instances is required so a duplicate routed to a different node is still caught.'
  impact: Idempotency tracking adds a small per-call lookup, a canonical fingerprint computation, and a shared-store dependency
    for multi-node deployments. Removing request-ID replay tracking simplifies the server since it no longer maintains historical
    request-ID state the protocol does not require. Page 212
  references:
  - '1. MCP specification (Base Protocol / Overview):'
  - https://modelcontextprotocol.io/specification/2026-07-28/basic
  - '2. MCP specification (Key Changes):'
  - https://modelcontextprotocol.io/specification/2026-07-28/changelog
  - https://modelcontextprotocol.io/specification/2026-07-28/server/tools
  page_start: 212
  audit_raw: "Identify the tools in the capability baseline that perform writes or trigger external actions,\nthen confirm\
    \ three properties against a safely reversible or dedicated test tool so the\nprobes cause no real side effect. First,\
    \ confirm a duplicate key returns a cached result.\nRun the following command:\nURL=\"<MCP_ENDPOINT>\"\nKEY=\"cis-audit-key-001\"\
    \nTOOL=\"<SIDE_EFFECTING_OR_TEST_TOOL>\"\nmkbody(){ printf\n'{\"jsonrpc\":\"2.0\",\"id\":%s,\"method\":\"tools/call\"\
    ,\"params\":{\"name\":\"%s\",\"arguments\":{},\n\"_meta\":{\"io.modelcontextprotocol/protocolVersion\":\"2026-0728\",\"\
    io.modelcontextprotocol/clientInfo\":{\"name\":\"cis-benchmarkaudit\",\"version\":\"1.0\"},\"io.modelcontextprotocol/clientCapabilities\"\
    :{}}}}' \"$1\"\n\"$TOOL\"; }\nextract(){ obj=$(printf '%s' \"$1\" | jq -c 'select(.jsonrpc)' 2>/dev/null | head -n1);\n\
    [ -n \"$obj\" ] || obj=$(printf '%s\\n' \"$1\" | sed -n 's/^data:[[:space:]]*//p' | head -\nn1); printf '%s' \"$obj\"\
    \ | jq -r 'if (.result|type==\"object\") and\n(.result|has(\"cached\")) then (.result.cached|tostring) else \"absent\"\
    \ end'\n2>/dev/null; }\nhdrs=(-H 'Content-Type: application/json' -H 'Accept: application/json, text/eventstream' -H 'MCP-Protocol-Version:\
    \ 2026-07-28' -H \"Idempotency-Key: $KEY\" -H 'McpMethod: tools/call' -H \"Mcp-Name: $TOOL\")\nr1=$(curl -sS --connect-timeout\
