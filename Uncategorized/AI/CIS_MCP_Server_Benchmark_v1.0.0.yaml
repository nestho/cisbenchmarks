- id: 4.1.2
  title: Ensure project-scoped MCP server definitions are not enabled or executed without explicit user approval
  scoring: manual
  profile:
  - Level 1
  description: A project-scoped server definition is one declared in configuration carried inside a project or repository,
    rather than in the user's own global configuration. The MCP client or host does not enable or execute such a definition
    without an explicit user review and approval of it. A server definition specifies a command the client will launch, so
    trusting it is equivalent to agreeing to run that command. Auto-trust and auto-approval of project-scoped servers are
    disabled, so opening a shared or cloned workspace does not enable or launch its declared servers before the user has seen
    and approved them. Approval is per-project and precedes any launch of, or command execution from, a project-scoped definition.
  rationale: 'A server definition is not passive data. It names an executable and its arguments, and enabling it runs that
    command. When a client honors project-scoped definitions automatically, a definition placed in a repository or shared
    workspace by someone other than the user runs on their machine as soon as they open the project, before any review. This
    has been a live vulnerability class in deployed agentic clients. A projectscoped setting that auto-approved servers, or
    a project configuration that launched a server on open, produced remote code execution from nothing more than opening
    an untrusted repository. The defense is a trust boundary at the point of enabling the definition: the user reviews which
    servers a project declares and approves them before any run. This is the client-side counterpart to the server-side consent
    controls, the difference between reading a project''s server list and executing it unseen.'
  impact: Opening a newly cloned or shared workspace that declares its own servers requires an explicit approval before those
    servers are enabled, which adds a confirmation step at onboarding. For the common case of a workspace with no project-scoped
    servers there is no added friction. Page 134
  references:
  - '1. MCP specification (security best practices):'
  - https://modelcontextprotocol.io/docs/2026-0728/tutorials/security/security_best_practices
  - '2. MCP specification (Server Features / Tools, human oversight of tool execution):'
  - https://modelcontextprotocol.io/specification/2026-07-28/server/tools
  page_start: 134
  audit_raw: "Confirm by configuration review that the client's project auto-trust or auto-approval\nbehavior is disabled,\
    \ so project-scoped server definitions are not enabled automatically.\nThen perform a behavioral test: in a throwaway\
    \ workspace, add a benign projectscoped server definition, open the workspace with the client, and confirm the client\
    \ does\nnot enable or launch that server without presenting an explicit approval, and that\ndeclining the approval prevents\
    \ the launch. For a client that exposes a named auto-trust\nsetting, the following optional command confirms it is not\
    \ enabled in the located\nconfiguration, as a convenience rather than the verdict:\nFILES=\"<CLIENT_CONFIG_FILE_LIST>\"\
    \nfound=0; enabled=\"\"\nfor f in $FILES; do\n [ -e \"$f\" ] || continue\n found=$((found+1))\n grep -Eq\n'\"(enableAllProjectMcpServers|enabledMcpjsonServers|autoApprove|autoMode)\"\
    [[:space:]]\n*:[[:space:]]*true' \"$f\" 2>/dev/null && enabled=\"${enabled} ${f}\"\ndone\nif [ \"$found\" -eq 0 ]; then\n\
    \ echo \"REVIEW: none of the given config paths exist (confirm the client's config\nlocation)\"\nelif [ -n \"$enabled\"\
    \ ]; then\n echo \"FAIL: project auto-trust or auto-approval is enabled in:$enabled\"\nelse\n echo \"PASS: no known project\
    \ auto-trust or auto-approval flag is enabled in the\nlocated config\"\nfi\nThis Recommendation is compliant when the\
    \ behavioral test shows a project-scoped\nserver definition cannot be enabled or executed without an explicit, per-project\
    \ user\napproval, and no known client auto-trust setting is left enabled."
  remediation: 'These are client configuration settings, with no portable command. Disable the client''s

    project auto-trust or auto-approval of servers, so project-scoped definitions are

    presented for approval rather than enabled automatically. Where the client supports it,

    block auto-trust settings from being honored when they originate in project scope.

    Require an explicit per-project approval before a project''s server definitions are enabled

    or any command from them runs. Keep the client updated to a version that gates

    project-scoped definitions behind that approval.'
