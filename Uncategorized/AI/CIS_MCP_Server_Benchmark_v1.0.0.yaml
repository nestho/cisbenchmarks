- id: 7.1.1
  title: Ensure lifecycle and invocation metadata is recorded
  scoring: scored
  profile:
  - Level 1
  description: Structured audit-log entries are generated for MCP lifecycle events and invocation operations. Under the 2026-07-28
    stateless model, server/discover calls and the per-request protocol metadata in each request's _meta (io.modelcontextprotocol/protocolVersion,
    io.modelcontextprotocol/clientCapabilities, and io.modelcontextprotocol/clientInfo) are recorded, together with the server
    identity each result reports in _meta as io.modelcontextprotocol/serverInfo. The invocation operations tools/call, resources/read,
    and prompts/get are recorded (input metadata, but not full argument payloads for privacy-sensitive tools), along with
    authentication events, elicitation exchanges, human approval and denial decisions, and Task lifecycle events. Every entry
    carries a synchronized timestamp, an event type, the producing server's identity, and a correlation identifier tying one
    request's events together (the JSON-RPC request id or a deployment correlation value). Where distributed tracing is enabled,
    the traceparent trace and span identifiers are recorded alongside that correlation identifier, not in place of it. Logs
    are shipped to a centralized store with integrity controls, captured at the server (stderr or an OpenTelemetry exporter)
    rather than through the deprecated MCP logging utility.
  rationale: 'Without structured, correlated logs, an investigator cannot reconstruct what a deployment did: which server
    was invoked, under whose authority, with what approval, and to what effect. Under the stateless protocol no connection-level
    session groups a request''s events, so a per-request correlation identifier is what makes reconstruction possible, and
    recording the server identity on each entry is what attributes an event to a server in a multi-server deployment. Distributed
    trace context, where present, supplements the correlation identifier rather than replacing it. Shipping to a centralized
    store with integrity controls protects the record from tampering by a compromised host.'
  impact: Structured logging adds storage overhead, which in regulated environments is a compliance requirement rather than
    a discretionary cost. Propagating a per-request correlation identifier is a one-time instrumentation cost where trace-context
    propagation is not already in place. Page 229
  references:
  - 1. MCP specification (Base Protocol / Overview, per-request _meta and request
  - '2. MCP specification (Deprecated Features):'
  - https://modelcontextprotocol.io/specification/2026-07-28/deprecated
  - https://modelcontextprotocol.io/specification/2026-07-28/changelog
  page_start: 229
