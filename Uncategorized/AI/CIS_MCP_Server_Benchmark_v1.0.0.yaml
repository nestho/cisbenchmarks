- id: 5.1.1
  title: Ensure tool schemas and argument types are validated
  scoring: scored
  profile:
  - Level 1
  description: 'The server validates every tool input and output against the tool''s advertised schema at the server middleware
    layer before the tool executes. Validation uses the JSON Schema dialect each schema declares in $schema, defaulting to
    2020-12 when none is declared. A tools/call request that fails the CallToolRequest structure is a protocol error. A well-formed
    call whose arguments fail the tool''s input schema is surfaced as a tool execution error in a normal result with isError
    set to true, not as a -32602 protocol error. Where a tool declares an outputSchema, the server returns structured results
    that conform to it. The server sanitizes the whole tool schema, including tool names, parameter names, descriptions, and
    outputs, not only inputSchema. The validator accepts the full schema vocabulary the 2026-07-28 revision permits, including
    composition keywords, conditionals, and internal $ref and $defs. inputSchema keeps a type: "object" root, and outputSchema
    may be any valid schema, including arrays and primitives. Implementations do not automatically dereference external $ref
    URIs, and schema depth and validation time are bounded, as the revision recommends.'
  rationale: Unvalidated tool arguments let a malformed or malicious call reach tool logic, and unsanitized schema fields
    let a malicious server inject instructions the model reads when choosing how to call a tool. Validating at the middleware
    layer before dispatch closes the first path, and sanitizing all schema fields closes the second. Returning an input-validation
    failure as a tool execution error rather than a protocol error keeps it actionable to the caller, which is the behavior
    the specification defines, while a structurally malformed request stays a protocol error. Auto-dereferencing an external
    $ref URI turns schema validation into a server-side request forgery primitive, and unbounded composition or nesting depth
    turns it into a denial-of-service primitive, so the revision's prohibition on external $ref and its recommended depth
    and time bounds close both.
  impact: Schema validation adds minor per-call overhead. Bounding schema depth and validation time is a one-time configuration
    cost. Returning input-validation failures as tool execution errors rather than protocol errors is a small change to the
    error path for servers that currently answer such calls with -32602. Tools whose schemas were generated against an older
    draft continue to validate as long as they declare that draft. Page 167
  references:
  - '1. MCP specification (Base Protocol / Transports / Streamable HTTP):'
  - https://modelcontextprotocol.io/specification/2026-0728/basic/transports/streamable-http
  - '2. MCP specification (Key Changes):'
  - https://modelcontextprotocol.io/specification/2026-07-28/changelog
  - https://modelcontextprotocol.io/seps/1303-input-validation-errors-as-toolexecution-errors
  page_start: 167
  audit_raw: "Verify that every advertised input and output schema compiles under its declared dialect\nand that a schema-violating\
    \ call is not executed. Run the following command to compile\neach advertised schema under its declared dialect, substituting\
    \ the endpoint. It requires\najv:\n Page 168\nMCP_ENDPOINT=\"<MCP_ENDPOINT>\"\nraw=$(curl -sS --connect-timeout 5 -m 10\
    \ -X POST \"$MCP_ENDPOINT\" \\\n -H 'Content-Type: application/json' \\\n -H 'Accept: application/json, text/event-stream'\
    \ \\\n -H 'MCP-Protocol-Version: 2026-07-28' \\\n -H 'Mcp-Method: tools/list' \\\n -d\n'{\"jsonrpc\":\"2.0\",\"id\":1,\"\
    method\":\"tools/list\",\"params\":{\"_meta\":{\"io.modelcontextpro\ntocol/protocolVersion\":\"2026-0728\",\"io.modelcontextprotocol/clientInfo\"\
    :{\"name\":\"cis-benchmarkaudit\",\"version\":\"1.0\"},\"io.modelcontextprotocol/clientCapabilities\":{}}}}'\n2>/dev/null)\n\
    [ -n \"$raw\" ] || { echo \"ERROR: no response from $MCP_ENDPOINT\"; exit 0; }\nobj=$(printf '%s' \"$raw\" | jq -c 'select(.jsonrpc)\
    \ | select(.id==1)' 2>/dev/null |\nhead -n1)\nif [ -z \"$obj\" ]; then\n obj=$(printf '%s\\n' \"$raw\" | sed -n 's/^data:[[:space:]]*//p'\
    \ | while IFS= read -r\nd; do printf '%s' \"$d\" | jq -e 'select(.id==1)' >/dev/null 2>&1 && { printf '%s'\n\"$d\"; break;\
    \ }; done)\nfi\n[ -n \"$obj\" ] || { echo \"ERROR: no JSON-RPC response with id 1 in tools/list reply\";\nexit 0; }\n\
    tmpd=$(mktemp -d)\nprintf '%s' \"$obj\" | jq -c '.result.tools[]? | {t:.name, k:\"inputSchema\",\ns:.inputSchema}, (select(.outputSchema!=null)\
    \ | {t:.name, k:\"outputSchema\",\ns:.outputSchema})' > \"$tmpd/schemas.jsonl\" 2>/dev/null\n[ -s \"$tmpd/schemas.jsonl\"\
    \ ] || { echo \"ERROR: no inputSchema present on any tool\";\nrm -rf \"$tmpd\"; exit 0; }\nbad=0; review=0; total=0\n\
    while IFS= read -r rec; do\n total=$((total+1))\n tname=$(printf '%s' \"$rec\" | jq -r '.t')\n kind=$(printf '%s' \"$rec\"\
    \ | jq -r '.k')\n printf '%s' \"$rec\" | jq -c '.s' > \"$tmpd/s.json\"\n ext=$(jq '[.. | objects | select(has(\"$ref\"\
    )) | .[\"$ref\"]] | map(select(test(\"^[az][a-z0-9+.-]*://\";\"i\"))) | length' \"$tmpd/s.json\" 2>/dev/null)\n [ -n \"\
    $ext\" ] || ext=0\n if [ \"$ext\" -gt 0 ]; then\n review=$((review+1)); echo \"detail: $tname $kind declares an external\
    \ \\$ref, a\nhardened validator refuses to dereference it\"; continue\n fi\n dialect=$(jq -r '.[\"$schema\"] // \"\"'\
    \ \"$tmpd/s.json\" 2>/dev/null)\n case \"$dialect\" in\n \"\"|*2020-12*) spec=draft2020 ;;\n *2019-09*) spec=draft2019\
    \ ;;\n *draft-07*) spec=draft7 ;;\n *) review=$((review+1)); echo \"detail: $tname $kind declares an unsupported dialect\n\
    $dialect\"; continue ;;\n esac\n ajv compile -s \"$tmpd/s.json\" --spec=$spec >/dev/null 2>&1 || { bad=$((bad+1)); echo\n\
    \ Page 169\n\"detail: $tname $kind does not compile under $spec\"; }\ndone < \"$tmpd/schemas.jsonl\"\nrm -rf \"$tmpd\"\
    \nif [ \"$bad\" -gt 0 ]; then\n echo \"FAIL: $bad of $total advertised schema(s) do not compile under their declared\n\
    dialect\"\nelif [ \"$review\" -gt 0 ]; then\n echo \"REVIEW: $review of $total advertised schema(s) use an unsupported\
    \ dialect or\nan external \\$ref, attribute before concluding\"\nelse\n echo \"PASS: all $total advertised schema(s) compile\
    \ under their declared JSON Schema\ndialect\"\nfi\nThen confirm the server does not execute a schema-violating call. Run\
    \ the following\ncommand, substituting a tool name and an argument object that violates that tool's input\nschema, for\
    \ example an omitted required field or a wrong-typed field:\n Page 170\nMCP_ENDPOINT=\"<MCP_ENDPOINT>\"\nTOOL=\"<TOOL_NAME>\"\
    \nARGS='<VIOLATING_ARGS_JSON>'\nresp=$(curl -sS --connect-timeout 5 -m 10 -X POST \"$MCP_ENDPOINT\" \\\n -H 'Content-Type:\
    \ application/json' \\\n -H 'Accept: application/json, text/event-stream' \\\n -H 'MCP-Protocol-Version: 2026-07-28' \\\
    \n -H 'Mcp-Method: tools/call' \\\n -H \"Mcp-Name: $TOOL\" \\\n -d\n\"{\\\"jsonrpc\\\":\\\"2.0\\\",\\\"id\\\":2,\\\"method\\\
    \":\\\"tools/call\\\",\\\"params\\\":{\\\"name\\\":\\\"$TOOL\n\\\",\\\"arguments\\\":$ARGS,\\\"_meta\\\":{\\\"io.modelcontextprotocol/protocolVersion\\\
    \":\\\"202607-28\\\",\\\"io.modelcontextprotocol/clientInfo\\\":{\\\"name\\\":\\\"cis-benchmarkaudit\\\",\\\"version\\\
    \":\\\"1.0\\\"},\\\"io.modelcontextprotocol/clientCapabilities\\\":{}}}}\"\n2>/dev/null)\n[ -n \"$resp\" ] || { echo \"\
    ERROR: no response to tools/call probe\"; exit 0; }\nobj=$(printf '%s' \"$resp\" | jq -c 'select(.jsonrpc) | select(.id==2)'\
    \ 2>/dev/null |\nhead -n1)\nif [ -z \"$obj\" ]; then\n obj=$(printf '%s\\n' \"$resp\" | sed -n 's/^data:[[:space:]]*//p'\
    \ | while IFS= read -r\nd; do printf '%s' \"$d\" | jq -e 'select(.id==2)' >/dev/null 2>&1 && { printf '%s'\n\"$d\"; break;\
    \ }; done)\nfi\n[ -n \"$obj\" ] || { echo \"ERROR: no JSON-RPC response with id 2 in tools/call reply\";\nexit 0; }\n\
    haserr=$(printf '%s' \"$obj\" | jq -r 'has(\"error\")' 2>/dev/null)\niserr=$(printf '%s' \"$obj\" | jq -r '.result.isError\
    \ // empty' 2>/dev/null)\nhasresult=$(printf '%s' \"$obj\" | jq -r 'has(\"result\")' 2>/dev/null)\nif [ \"$iserr\" = \"\
    true\" ]; then\n echo \"PASS: the server surfaced the invalid input as a tool execution error\n(isError) rather than executing\
    \ it\"\nelif [ \"$haserr\" = \"true\" ]; then\n code=$(printf '%s' \"$obj\" | jq -r '.error.code // empty' 2>/dev/null)\n\
    \ echo \"REVIEW: the server rejected the invalid input with a protocol error (code\n$code) rather than a tool execution\
    \ error, attribute before concluding\"\nelif [ \"$hasresult\" = \"true\" ]; then\n echo \"FAIL: the server returned a\
    \ normal tool result for schema-violating input, the\ninput was not validated before execution\"\nelse\n echo \"ERROR:\
    \ no result or error field in the tools/call response\"\nfi\nThen confirm by configuration review that the validator does\
    \ not auto-dereference\nexternal $ref URIs, that schema depth and validation time are bounded, and that all\nschema fields\
    \ are sanitized before presentation to the model. This Recommendation is\ncompliant when every advertised input and output\
    \ schema compiles under its declared\ndialect, a schema-violating call is surfaced as a tool execution error rather than\n\
    executed, and the validator configuration refuses external $ref and bounds schema\ndepth and time.\n Page 171"
  remediation: 'Add a validation middleware layer that runs before tool dispatch and validates every tool

    call''s arguments against the tool''s input schema under the dialect the schema declares.

    Return a schema-violating call as a tool execution error in a normal result with isError

    set true, and reject a structurally malformed tools/call request as a protocol error.

    Where a tool declares an outputSchema, validate the structured result against it

    before returning. Sanitize all schema fields, meaning tool names, parameter names,

    descriptions, and outputs, not only inputSchema, before they reach the model or

    downstream use. Tighten schemas to strict types, disallow additionalProperties

    where appropriate, and mark required fields. Configure the validator so it does not autodereference external $ref URIs,
    and bound schema depth and validation time. This is

    server middleware and configuration, and the exact validator is implementation-specific,

    for example ajv for TypeScript servers, so there is no portable command.'
  checks:
  - type: manual_review
    info: "Verify that every advertised input and output schema compiles under its declared dialect\nand that a schema-violating\
      \ call is not executed. Run the following command to compile\neach advertised schema under its declared dialect, substituting\
      \ the endpoint. It requires\najv:\n Page 168\nMCP_ENDPOINT=\"<MCP_ENDPOINT>\"\nraw=$(curl -sS --connect-timeout 5 -m\
      \ 10 -X POST \"$MCP_ENDPOINT\" \\\n -H 'Content-Type: application/json' \\\n -H 'Accept: application/json, text/event-stream'\
      \ \\\n -H 'MCP-Protocol-Version: 2026"
    severity: medium
- id: 5.1.2
  title: Ensure resource templates with explicit URI patterns and MIME types are used
  scoring: scored
  profile:
  - Level 1
  description: 'The server exposes resources through predictable, well-defined URI template patterns with an explicit MIME
    type for each resource type. The specification makes mimeType optional on resource definitions and templates, and this
    Recommendation requires it be set explicitly so the client interprets each resource type unambiguously, which is stricter
    than the base protocol. The server validates every substituted URI-template value against the expected pattern before
    constructing the final URI. A read of a non-existent resource is rejected with a JSON-RPC -32602 error, the code the specification
    defines for that case. Resource templates advertise parameterized resources and are not the exhaustive set a server serves,
    because a server may also expose individual resources that no template describes. Where a deployment intends the approved
    templates to be an access-control namespace so that a read outside it is denied, that is a stricter CIS posture, not a
    base-protocol requirement. Where a deployment also serves resource bytes over HTTP directly to a user agent, for example
    a separate download endpoint or an https:// resource the host renders, that HTTP surface sets X-Content-TypeOptions: nosniff
    to prevent content-type sniffing. That surface is outside the MCP resources/read mechanism, where content is delivered
    inside the JSON-RPC result with a declared mimeType.'
  rationale: 'Explicit URI templates and MIME types let the client interpret resources predictably and prevent content-type
    confusion. The specification leaves mimeType optional, so an operator can advertise resources without one, and this Recommendation
    says which side to choose because an absent MIME type forces the client to guess the type. Validating template variables
    before substitution prevents injection through resource URIs, which the specification also requires. A read of a non-existent
    resource is rejected with -32602 rather than answered with an ambiguous empty result, which the specification requires.
    Treating the approved template set as an access-control namespace is a stronger posture an operator may choose, but it
    is not implied by the templates alone since the protocol allows a server to serve resources outside any template. Where
    resource bytes are served over HTTP directly to a user agent, XContent-Type-Options: nosniff stops that agent from reinterpreting
    a response as a more dangerous type than declared, though that surface is separate from resources/read. Page 174'
  impact: 'Impact is low. Defining URI templates and explicit MIME types is straightforward and improves both security and
    interoperability. Requiring an explicit mimeType where the specification makes it optional costs only the one-time work
    of annotating each resource type. For deployments that serve resource bytes over HTTP directly, the X-ContentType-Options:
    nosniff header is a standard web security header with no operational downside. Page 175'
  references:
  - '1. MCP specification (Key Changes):'
  - https://modelcontextprotocol.io/specification/2026-07-28/changelog
  - 2. MCP specification (Server Features / Resources, resource templates and
  page_start: 174
  audit_raw: "Verify that every advertised resource template declares a non-empty URI pattern and\nMIME type and that a read\
    \ of a non-existent resource is rejected. Run the following\ncommand to list the templates, substituting the endpoint:\n\
    MCP_ENDPOINT=\"<MCP_ENDPOINT>\"\nraw=$(curl -sS --connect-timeout 5 -m 10 -X POST \"$MCP_ENDPOINT\" \\\n -H 'Content-Type:\
    \ application/json' \\\n -H 'Accept: application/json, text/event-stream' \\\n -H 'MCP-Protocol-Version: 2026-07-28' \\\
    \n -H 'Mcp-Method: resources/templates/list' \\\n -d\n'{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"resources/templates/list\"\
    ,\"params\":{\"_meta\":{\"io.m\nodelcontextprotocol/protocolVersion\":\"2026-0728\",\"io.modelcontextprotocol/clientInfo\"\
    :{\"name\":\"cis-benchmarkaudit\",\"version\":\"1.0\"},\"io.modelcontextprotocol/clientCapabilities\":{}}}}'\n2>/dev/null)\n\
    [ -n \"$raw\" ] || { echo \"ERROR: no response from $MCP_ENDPOINT\"; exit 0; }\nobj=$(printf '%s' \"$raw\" | jq -c 'select(.jsonrpc)\
    \ | select(.id==1)' 2>/dev/null |\nhead -n1)\nif [ -z \"$obj\" ]; then\n obj=$(printf '%s\\n' \"$raw\" | sed -n 's/^data:[[:space:]]*//p'\
    \ | while IFS= read -r\nd; do printf '%s' \"$d\" | jq -e 'select(.id==1)' >/dev/null 2>&1 && { printf '%s'\n\"$d\"; break;\
    \ }; done)\nfi\n[ -n \"$obj\" ] || { echo \"ERROR: no JSON-RPC response with id 1 in\nresources/templates/list reply\"\
    ; exit 0; }\ncount=$(printf '%s' \"$obj\" | jq '.result.resourceTemplates | length' 2>/dev/null)\n[ -n \"$count\" ] &&\
    \ [ \"$count\" != \"null\" ] || { echo \"ERROR: resources/templates/list\nreturned no resourceTemplates array\"; exit\
    \ 0; }\n[ \"$count\" -gt 0 ] || { echo \"ERROR: no resource templates advertised, confirm\nwhether the server exposes\
    \ templated resources\"; exit 0; }\nmissing=$(printf '%s' \"$obj\" | jq '[.result.resourceTemplates[] |\nselect((.uriTemplate|type!=\"\
    string\") or (.uriTemplate==\"\") or\n(.mimeType|type!=\"string\") or (.mimeType==\"\"))] | length' 2>/dev/null)\n[ -n\
    \ \"$missing\" ] || missing=0\nif [ \"$missing\" -eq 0 ]; then\n echo \"PASS: all $count resource template(s) declare\
    \ a non-empty uriTemplate and an\nexplicit non-empty mimeType\"\nelse\n echo \"FAIL: $missing of $count resource template(s)\
    \ lack a non-empty uriTemplate or\nan explicit non-empty mimeType\"\nfi\nThen confirm the server rejects a read of a non-existent\
    \ resource. Run the following\ncommand, substituting the endpoint and a URI within a scheme the server serves but\nthat\
    \ points to no existing resource:\n Page 176\nMCP_ENDPOINT=\"<MCP_ENDPOINT>\"\nMISSING_URI=\"<KNOWN_NONEXISTENT_RESOURCE_URI>\"\
    \nresp=$(curl -sS --connect-timeout 5 -m 10 -X POST \"$MCP_ENDPOINT\" \\\n -H 'Content-Type: application/json' \\\n -H\
    \ 'Accept: application/json, text/event-stream' \\\n -H 'MCP-Protocol-Version: 2026-07-28' \\\n -H 'Mcp-Method: resources/read'\
    \ \\\n -H \"Mcp-Name: $MISSING_URI\" \\\n -d\n\"{\\\"jsonrpc\\\":\\\"2.0\\\",\\\"id\\\":2,\\\"method\\\":\\\"resources/read\\\
    \",\\\"params\\\":{\\\"uri\\\":\\\"$M\nISSING_URI\\\",\\\"_meta\\\":{\\\"io.modelcontextprotocol/protocolVersion\\\":\\\
    \"2026-0728\\\",\\\"io.modelcontextprotocol/clientInfo\\\":{\\\"name\\\":\\\"cis-benchmarkaudit\\\",\\\"version\\\":\\\
    \"1.0\\\"},\\\"io.modelcontextprotocol/clientCapabilities\\\":{}}}}\"\n2>/dev/null)\n[ -n \"$resp\" ] || { echo \"ERROR:\
    \ no response to resources/read probe\"; exit 0; }\nobj=$(printf '%s' \"$resp\" | jq -c 'select(.jsonrpc) | select(.id==2)'\
    \ 2>/dev/null |\nhead -n1)\nif [ -z \"$obj\" ]; then\n obj=$(printf '%s\\n' \"$resp\" | sed -n 's/^data:[[:space:]]*//p'\
    \ | while IFS= read -r\nd; do printf '%s' \"$d\" | jq -e 'select(.id==2)' >/dev/null 2>&1 && { printf '%s'\n\"$d\"; break;\
    \ }; done)\nfi\n[ -n \"$obj\" ] || { echo \"ERROR: no JSON-RPC response with id 2 in resources/read\nreply\"; exit 0;\
    \ }\nerrcode=$(printf '%s' \"$obj\" | jq -r '.error.code // empty' 2>/dev/null)\nhasresult=$(printf '%s' \"$obj\" | jq\
    \ -r 'has(\"result\")' 2>/dev/null)\ncase \"$errcode\" in\n -32602) echo \"PASS: a read of a non-existent resource was\
    \ rejected with -32602\n(Invalid Params)\" ;;\n -32002) echo \"REVIEW: the server used legacy -32002 for resource-not-found,\
    \ accepted\nfor backward compatibility but confirm the deployment's target revision\" ;;\n \"\") if [ \"$hasresult\" =\
    \ \"true\" ]; then\n echo \"FAIL: the server returned a result for a non-existent resource instead\nof a -32602 error\"\
    \n else\n echo \"ERROR: no error code and no result in the resources/read response\"\n fi ;;\n *) echo \"REVIEW: the server\
    \ returned error code $errcode rather than -32602,\nattribute before concluding\" ;;\nesac\nWhere a deployment treats\
    \ the approved template set as an access-control\nnamespace, confirm a read outside that namespace is denied. Where a\
    \ deployment\nserves resource bytes over HTTP directly to a user agent, confirm that HTTP surface\nsets X-Content-Type-Options:\
    \ nosniff. This Recommendation is compliant\nwhen every advertised resource template declares a non-empty URI pattern\
    \ and MIME\ntype, a read of a non-existent resource is rejected with -32602, and any applicable\nnamespace-denial and\
    \ nosniff conditions above hold.\n Page 177"
  remediation: 'Define a URI template and an explicit MIME type for every resource type in the server

    configuration, and validate substituted template values against their expected pattern

    before building the final URI. Configure the server to reject a read of a non-existent

    resource with -32602 rather than returning an ambiguous empty result. Where the

    deployment treats the approved template set as an access-control namespace, deny a

    read outside that namespace and state the policy explicitly because the base protocol

    does not require it. Where the deployment also serves resource bytes over HTTP

    directly to a user agent, configure that HTTP surface, or the reverse proxy fronting it, to

    set X-Content-Type-Options: nosniff on those responses. The following nginx

    directive sets the header on a proxied resource surface:

    add_header X-Content-Type-Options "nosniff" always;'
  checks:
  - type: manual_review
    info: "Verify that every advertised resource template declares a non-empty URI pattern and\nMIME type and that a read\
      \ of a non-existent resource is rejected. Run the following\ncommand to list the templates, substituting the endpoint:\n\
      MCP_ENDPOINT=\"<MCP_ENDPOINT>\"\nraw=$(curl -sS --connect-timeout 5 -m 10 -X POST \"$MCP_ENDPOINT\" \\\n -H 'Content-Type:\
      \ application/json' \\\n -H 'Accept: application/json, text/event-stream' \\\n -H 'MCP-Protocol-Version: 2026-07-28'\
      \ \\\n -H 'Mcp-Method: resources/templates/list' \\\n"
    severity: medium
- id: 5.1.3
  title: Ensure prompt templates declare and validate their arguments
  scoring: scored
  profile:
  - Level 1
  description: The server publishes MCP prompts with an explicit arguments declaration for every parameter. Each argument
    names the parameter with a non-empty name, and where it marks whether the argument is required it uses a boolean required
    value, so the client knows what to supply. The base protocol makes the arguments list optional, so requiring an explicit
    declaration for parameterized prompts is a stricter posture. The server validates provided argument values before processing.
    This Recommendation requires it to reject an invalid prompt name or a missing required argument with a JSON-RPC -32602
    error, which the specification recommends and this Recommendation elevates to a deterministic requirement for auditing.
    By design, prompts are user-controlled and explicitly selected, so a deployment runs prompt logic only in response to
    an explicit, identifiable prompts/get call and not as a side effect of discovery or another operation. The server records
    the prompt name for every invocation to support supply-chain traceability. Where the deployment versions prompts out of
    band, it records that version because the prompt model carries no version field.
  rationale: Declaring each prompt argument with a name and a required flag lets client and server agree on what a prompt
    needs. Validating provided values before processing prevents malformed or injected input from reaching prompt logic, which
    the specification requires when it states that implementations validate all prompt inputs and outputs to prevent injection.
    The specification recommends a -32602 error for an invalid prompt name or a missing required argument, and this Recommendation
    elevates that to a deterministic requirement so the check audits to a clean PASS or FAIL. The specification's design that
    prompts are user-controlled and explicitly selected makes explicit invocation the safe posture because it prevents a malicious
    server from running prompt logic as a side effect of another operation. Recording the prompt name supports traceability
    if a prompt is later found to be malicious.
  impact: 'Impact on legitimate workflows is low, because a well-formed client already supplies the declared arguments and
    selects prompts explicitly. The remaining costs are one-time and small: declaring arguments for each parameterized prompt,
    recording the prompt name and any out-of-band version in the audit log, and removing any path that runs a prompt as a
    side effect of another operation. Page 179'
  references:
  - '1. MCP specification (Key Changes, promptsListChanged via subscriptions/listen):'
  - https://modelcontextprotocol.io/specification/2026-07-28/changelog
  - 2. MCP specification (Server Features / Prompts, prompts/list and prompts/get
  page_start: 179
