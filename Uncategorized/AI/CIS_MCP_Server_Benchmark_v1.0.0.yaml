  remediation: 'These are host and server configuration settings, with no portable command. Configure

    the host to require an explicit user decision before forwarding a server-initiated sampling

    request to the model. Apply a redaction filter that removes API keys, passwords, and

    common PII formats from context before it is sent, and record that the redaction check

    ran. Rate-limit server-initiated sampling. Log every sampling event with the server

