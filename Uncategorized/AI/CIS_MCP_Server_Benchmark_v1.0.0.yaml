- id: 7.2.1
  title: Ensure alerts are generated on audience and issuer validation failures
  scoring: scored
  profile:
  - Level 1
  description: A structured audit event is emitted whenever a token audience or an authorizationserver issuer fails validation,
    and each event carries a recognized event identifier and a standardized error code. A SIEM rule alerts the security operations
    team on those events. Two kinds of failure are covered. In its resource-server role, an MCP server validates that an access
    token was issued for it as the intended audience and returns HTTP 401 when it is not. As an OAuth client, an MCP client
    validates the issuer (iss) on an authorization response to catch a response returned by the wrong authorization server.
  rationale: Audience and issuer validation failures are signs of a stolen or misdirected token, or of a response coming back
    from the wrong authorization server, which is a bigger risk in the single-client, many-server pattern MCP encourages.
    An alert is only reliable if each failure is a structured event with an error code, because a free-text log line cannot
    be matched precisely, and loose substring matching also catches harmless records. Alerting on these failures turns a rejection
    that would otherwise pass unnoticed into a signal someone can act on.
  impact: Structured failure events and a SIEM alert rule add little overhead. The benefit is early detection of token theft,
    audience confusion, and authorization-server mix-up that a silent 401 would not surface. Page 241
  references:
  - '1. MCP specification (Base Protocol / Authorization):'
  - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
  - '2. MCP specification (key changes):'
  - https://modelcontextprotocol.io/specification/2026-07-28/changelog
  - https://datatracker.ietf.org/doc/html/rfc8707
  - https://datatracker.ietf.org/doc/html/rfc9207
  page_start: 241
  audit_raw: "Confirm that audience and issuer validation failures are emitted as structured events\ncarrying an error code,\
    \ then separately confirm a SIEM rule alerts on them and that the\ndeployment rejects a wrong-audience token end to end.\
    \ The command reads a\nstructured JSON-lines authentication log and detects a failure by matching the\nstructured identifier\
    \ fields rather than free text, so a benign record that merely mentions\na token claim is not counted. Run the following\
    \ command, adjusting LOG and the field\nnames to the local schema:\nLOG=\"${LOG:-<MCP_AUTH_LOG>}\"\nN=\"${N:-500}\"\n\
    if [ ! -r \"$LOG\" ]; then echo \"ERROR: auth log not readable at $LOG\"; exit 0; fi\nsample=\"$(tail -n \"$N\" \"$LOG\"\
    \ 2>/dev/null)\"\ntotal=\"$(printf '%s\\n' \"$sample\" | grep -c .)\"\nif [ \"$total\" -eq 0 ]; then echo \"ERROR: no\
    \ entries found in $LOG\"; exit 0; fi\nfails=\"$(printf '%s\\n' \"$sample\" | jq -cR '\n (fromjson? // null) as $o\n |\
    \ select($o != null)\n | ( ( (($o.event // \"\") | tostring) + \" \" + (($o.reason // \"\") | tostring) + \" \"\n + (($o.type\
    \ // \"\") | tostring) + \" \" + (($o.error // \"\") | tostring) + \" \"\n + (($o.code // \"\") | tostring) + \" \" +\
    \ (($o.error_code // \"\") | tostring) + \" \" +\n(($o.http_status // \"\") | tostring) )\n | ascii_downcase ) as $id\n\
    \ | select(($id | test(\"audience|issuer|\\\\baud\\\\b|\\\\biss\\\\b\")) and ($id |\ntest(\"invalid|mismatch|fail|reject|unauthor|denied|401|403\"\
    )))\n | $o' 2>/dev/null)\"\nnfail=\"$(printf '%s\\n' \"$fails\" | grep -c .)\"\ncoded=\"$(printf '%s\\n' \"$fails\" |\
    \ jq -c 'select((((.error_code // .code // .error\n// .http_status // \"\") | tostring)) != \"\")' 2>/dev/null | grep\
    \ -c .)\"\necho \"--- audience/issuer validation failures in last $total entries ---\"\necho \"failure events (matched\
    \ on structured event, reason, type, error, code fields):\n$nfail with structured error code: $coded\"\nif [ \"$nfail\"\
    \ -eq 0 ]; then\n echo \"REVIEW: no audience or issuer validation failures in the sample, which cannot\ndistinguish no\
    \ failures from failures not logged as structured events, force one with\na wrong-audience token and confirm the SIEM\
    \ alert rule exists\"\nelif [ \"$coded\" -lt \"$nfail\" ]; then\n echo \"FAIL: $(( nfail - coded )) of $nfail audience\
    \ or issuer validation failure\nevents lack a structured error code\"\nelse\n echo \"PASS: all $nfail audience or issuer\
    \ validation failures carry a structured\nerror code, confirm the SIEM alert rule fires on them\"\nfi\n Page 242\nThis\
    \ Recommendation is compliant when the audience and issuer validation-failure\nevents in the sample all carry a structured\
    \ error code, the command prints PASS, and a\nreviewer confirms a SIEM rule fires on them and a deliberately mis-scoped\
    \ token is\nrejected. Where the sample contains no such failures, force one with a wrong-audience\ntoken and confirm it\
    \ is logged as a structured event and alerted on."
  remediation: 'Configure the resource-server audience validation and the client issuer validation to

    emit a structured audit event on every failure, each carrying a recognized event

    identifier and an error code rather than a free-text log line. Add a SIEM rule that alerts

    on those event identifiers and routes to the security operations team. As optional

