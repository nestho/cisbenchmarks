- id: 3.3.3
  title: Ensure shared downstream service account identities are prohibited across multiple MCP tools or servers
  scoring: manual
  profile:
  - Level 2
  description: Each MCP server, and each tool that accesses backend systems or downstream APIs, uses a dedicated downstream
    service identity with the minimum permissions required for that function. Sharing a service account, workload identity,
    or API credential across multiple tools or servers is prohibited. An exception is allowed only when explicitly approved
    with a documented justification, an identified owner, a defined expiry date, and compensating controls on file, and approved
    exceptions are reviewed at least annually. The MCP specification does not mandate per-tool service identities, so this
    Recommendation is a hardening measure the specification leaves open.
  rationale: Shared service accounts undermine both attribution and blast-radius containment. When multiple tools or servers
    share one downstream identity, downstream audit logs cannot attribute an action to a specific tool or server, and compromising
    any one component that holds the identity grants access to everything that identity can reach. The risk is acute when
    tools of different risk tiers share a credential, because compromising a read-only tool that shares its credential with
    a write tool yields write access. The MCP specification supports least privilege but does not itself require pertool identities.
  impact: Giving each tool or server its own downstream identity is a moderate one-time IAM effort, plus ongoing provisioning
    as new tools or servers are added. Page 118
  references:
  - '1. MCP specification (Base Protocol / Authorization):'
  - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
  - 2. MCP specification (security best practices, dedicated service identities and least
  page_start: 118
  audit_raw: "Review the identity mapping inventory as the authoritative evidence, with the credentialreuse scan below as\
    \ a supplementary check. In the inventory, confirm each MCP server\nand tool maps to a distinct downstream service principal\
    \ or workload identity, and that\nany shared identity has a documented, time-bound exception with an owner and\ncompensating\
    \ controls. The scan extracts credential-bearing values, hashes them so\nthe value is never printed, and flags a hash\
    \ appearing in more than one file. An empty\nextraction can mean workload identity federation is in use with no literal\
    \ credentials to\nscan, or that the configuration directory or search pattern is wrong, so it is inconclusive\non its\
    \ own. Run the following command to detect literal credential values reused across\ndistinct configuration files:\nCONF_DIR=\"\
    <MCP_SERVERS_CONFIG_DIR>\"\ncommand -v sha256sum >/dev/null 2>&1 || { echo \"ERROR: sha256sum unavailable, cannot\nscan\
    \ for duplicate literal credentials\"; exit 0; }\ntmp=$(mktemp)\ngrep -rEn 'service_account|client_id|api_key|client_secret'\
    \ \"$CONF_DIR\" 2>/dev/null \\\n | sed -E 's/^([^:]+:[09]+):.*(service_account|client_id|api_key|client_secret)[=: ]+[\"\
    '\"'\"']?([^\"'\"'\"' ]+).\n*/\\1|\\2|\\3/' \\\n | while IFS='|' read -r loc key val; do\n [ -n \"$val\" ] || continue\n\
    \ file=$(printf '%s' \"$loc\" | sed -E 's/:[0-9]+$//')\n printf '%s %s %s\\n' \"$(printf '%s' \"$val\" | sha256sum | cut\
    \ -c1-12)\" \"$key\" \"$file\"\n done > \"$tmp\"\ncount=$(wc -l < \"$tmp\" | tr -d ' ')\ndups=$(awk '{print $1, $3}' \"\
    $tmp\" | sort -u | awk '{print $1}' | sort | uniq -d)\nif [ \"$count\" -eq 0 ]; then\n echo \"REVIEW: no literal credentials\
    \ extracted. Either this deployment uses workload\nidentity federation (assess via the identity mapping inventory), or\
    \ CONF_DIR or the\npattern is wrong\"\nelif [ -z \"$dups\" ]; then\n echo \"PASS: no literal credential value shared across\
    \ distinct configs ($count\nreferences scanned)\"\nelse\n echo \"FAIL: literal credential value(s) shared across distinct\
    \ configs (hash ->\nfiles):\"\n for h in $dups; do printf ' %s -> ' \"$h\"; awk -v h=\"$h\" '$1==h{print $3}' \"$tmp\"\
    \ |\nsort -u | tr '\\n' ' '; echo; done\nfi\nrm -f \"$tmp\"\nThe system is compliant when the inventory shows each server\
    \ and tool using a distinct\ndownstream identity with any sharing covered by a documented exception, and the\nscan finds\
    \ no identical literal credential across distinct files. An empty scan is a REVIEW\ndirecting the reviewer to the inventory,\
    \ not a pass.\n Page 119"
  remediation: 'This is IAM and documentation work with no portable command. Maintain an identity

    mapping inventory that records, for each server and tool, the downstream system it

    reaches, the service principal or workload identity it uses, and the permissions granted.

    Configure each MCP tool and server to use a dedicated downstream service identity,

    and for each shared-identity case create a least-privilege dedicated identity and update

    each configuration to use its own. Use workload identity federation and per-workload

    IAM roles for cloud deployments, and separate OS user accounts or container identities

    per stdio server. Prohibit sharing absent a documented, time-bound exception, and

    record any case where separation is not yet feasible as an approved exception with

    owner, justification, expiry, and compensating controls, reviewed at least annually.

    Verify with the Audit.'
  checks:
  - type: command
    command: grep -rEn 'service_account|client_id|api_key|client_secret' "$CONF_DIR" 2>/dev/null \
    expected: ''
    severity: medium
    info: 'Review the identity mapping inventory as the authoritative evidence, with the credentialreuse scan below as a supplementary
      check. In the inventory, confirm each MCP server

      and tool maps to a distinct downstream service principal or workload identity, and that

      any shared identity has a documented, time-bound exception with an owner and

      compensating controls. The scan extracts credential-bearing va'
- id: 3.3.4
  title: Ensure OAuth scopes are minimized and elevated progressively
  scoring: manual
  profile:
  - Level 2
  description: MCP servers advertise the minimal set of scopes needed for basic functionality in Protected Resource Metadata
    scopes_supported and do not expose an over-broad or wildcard scope surface. During initial authorization a client requests
    only the scopes indicated by the WWW-Authenticate challenge or, absent a challenge scope, the advertised scopes_supported.
    When a privileged operation returns an insufficient_scope challenge, the client elevates through a step-up flow, requesting
    the union of its previously requested scopes and the scopes named in the challenge, so previously granted permissions
    are preserved. A granted token may therefore carry more than the operation in progress requires, but every granted scope
    stays within an approved cumulative scope set that the deployment records in the capability baseline, together with the
    per-tool scopes that compose it. Broad wildcard scopes such as admin:* are not granted unless a documented exception approves
    them.
  rationale: Over-broad scopes amplify token theft. A token scoped to files:*, db:*, and admin:* simultaneously enables lateral
    access, privilege chaining, and hard revocation. The damage from a stolen token is bounded by its scopes, so constraining
    the granted set to an approved, least-privilege cumulative model, and refusing broad wildcard grants, reduces that bound.
    Progressive elevation keeps the granted set as small as the workflow allows at each point while still preserving permissions
    the client legitimately accumulated, rather than issuing a broad token up front.
  impact: Constraining scopes may require a one-time re-consent when existing broad tokens are revoked. Progressive elevation
    also adds an authorization round-trip the first time a session needs a higher scope, and a client without step-up support
    sees that round-trip as a failed privileged operation. Page 121
  references:
  - 1. MCP specification (Base Protocol / Authorization, scope selection and step-up
  - 2. MCP specification (security best practices, least privilege and scope
  - https://github.com/modelcontextprotocol/modelcontextprotocol/pull/2350
  page_start: 121
  audit_raw: "Inspect the Protected Resource Metadata for the scopes advertised in\nscopes_supported, then compare a token's\
    \ granted scopes against the approved\ncumulative scope set in the capability baseline. Run the following command to read\
    \ the\nscopes on a token in use. The decode is padding-safe, and scopes may be in the\nscope or scp claim:\nTOKEN='<JWT_ACCESS_TOKEN>'\n\
    seg=$(printf '%s' \"$TOKEN\" | cut -d. -f2 | tr '_-' '/+')\npad=$(( (4 - ${#seg} % 4) % 4 )); seg=\"$seg$(printf '=%.0s'\
    \ $(seq 1 $pad))\"\nclaims=$(printf '%s' \"$seg\" | base64 -d 2>/dev/null)\n[ -z \"$claims\" ] && { echo \"ERROR: could\
    \ not decode (opaque token? introspect\ninstead)\"; exit 0; }\nprintf '%s' \"$claims\" | jq empty 2>/dev/null || { echo\
    \ \"ERROR: decoded payload is not\nJSON (opaque token? introspect instead)\"; exit 0; }\ngranted=$(echo \"$claims\" |\
    \ jq -r '(.scope // (.scp // [] | join(\" \")))')\necho \"granted_scopes: $granted\"\nSet APPROVED to the deployment's\
    \ approved cumulative scope set from the capability\nbaseline, space-delimited (for example mcp:read mcp:write). Run the\
    \ following\ncommand to flag any granted scope outside the approved set and any broad wildcard\ngrant:\nAPPROVED=\"<APPROVED_CUMULATIVE_SCOPES>\"\
    \n[ -z \"$granted\" ] && { echo \"ERROR: token carries no scopes (opaque token, or scopes\nconveyed out of band); assess\
    \ via introspection\"; exit 0; }\nextra=\"\"; wild=\"\"\nfor s in $granted; do\n case \"$s\" in *:\\*|\\*) wild=\"$wild\
    \ $s\" ;; esac\n case \" $APPROVED \" in *\" $s \"*) ;; *) extra=\"$extra $s\" ;; esac\ndone\nif [ -n \"$extra\" ]; then\n\
    \ echo \"FAIL: token carries scopes outside the approved cumulative set:$extra\"\nelif [ -n \"$wild\" ]; then\n echo \"\
    REVIEW: all granted scopes are approved but the token carries broad wildcard\nscopes:$wild\"\nelse\n echo \"PASS: every\
    \ granted scope is within the approved cumulative scope set and\nnone are broad wildcards\"\nfi\nThe system is compliant\
    \ when every scope on a token in use is within the approved\ncumulative set and the token carries no broad wildcard scope.\
    \ A token with no\ndecodable scopes is ERROR and is assessed by introspection. An approved wildcard\nscope is REVIEW for\
    \ a human to confirm the documented exception.\n Page 122"
  remediation: 'Trim the scopes advertised in Protected Resource Metadata scopes_supported to

    the minimal set the server''s tools need, and do not advertise or grant broad wildcard

    scopes such as admin:* unless a documented exception approves them. Configure

    the authorization server so that a privileged operation returns an

    insufficient_scope challenge naming all required scopes in a single challenge

    rather than one at a time. Clients elevate through the step-up flow, requesting the union

    of previously requested scopes and the challenge scopes so accumulated permissions

    are preserved. Document the approved cumulative set, and the per-tool scopes that

    compose it, in the capability baseline using the same scope names the Audit reads. For

    servers with read and write tools, separate scope tiers (for example mcp:read,

    mcp:write, mcp:admin). Verify with the Audit.'
  checks:
  - type: manual_review
    info: 'Inspect the Protected Resource Metadata for the scopes advertised in

      scopes_supported, then compare a token''s granted scopes against the approved

      cumulative scope set in the capability baseline. Run the following command to read the

      scopes on a token in use. The decode is padding-safe, and scopes may be in the

      scope or scp claim:

      TOKEN=''<JWT_ACCESS_TOKEN>''

      seg=$(printf ''%s'' "$TOKEN" | cut -d. -f2 | tr ''_-'' ''/+'')

      pad=$(( (4 - ${#seg} % 4) % 4 )); seg="$seg$(printf ''=%.0s'' $(seq 1 $pad))"

      claims=$'
    severity: medium
- id: 3.3.5
  title: Ensure confused-deputy safeguards are applied for static OAuth client IDs
  scoring: manual
  profile:
  - Level 2
  description: An MCP server acting as an OAuth proxy with a shared static client ID toward a downstream third-party authorization
    server, that lets MCP clients dynamically register (each obtaining its own client ID), and whose third-party authorization
    server sets a consent cookie for the static client ID, implements the specification's confused-deputy mitigations. The
    third-party authorization server often lacks dynamic client registration, which is why the proxy uses one static client
    ID for all requests. Three mitigations apply. (1) Per-client consent keyed to each dynamically-registered MCP client's
    client_id, checked before any redirect to the third-party authorization server, and never reused across registrations.
    (2) Exact-string redirect_uri validation with no wildcards or pattern matching, rejecting any request whose redirect_uri
    changed without reregistration. (3) State parameter validation, with a cryptographically random single-use state stored
    server-side only after consent is approved and validated at the callback. Consent records are logged with the registered
    MCP client's identity and a timestamp.
  rationale: The confused-deputy attack arises when a proxy uses one static client ID on behalf of many MCP clients. An attacker
    registers a malicious client with an attacker-controlled redirect_uri, then sends the victim a crafted authorization link.
    Because the thirdparty authorization server already set a consent cookie for the static client ID during a prior legitimate
    flow, it skips consent, and the authorization code is redirected to the attacker. Per-client consent closes this skip-consent
    path, while exact redirect_uri matching and single-use state validation harden the surrounding flow against code redirection
    to an unregistered URI and against code interception and CSRF. The specification mandates all three.
  impact: 'There is minor UX friction: an extra consent prompt the first time each MCP client registers. Page 124'
  references:
  - 1. MCP specification (security best practices, confused deputy and per-client
  page_start: 124
  audit_raw: "Review the proxy's OAuth flow and confirm a newly registered MCP client triggers fresh\nconsent, a changed redirect_uri\
    \ is rejected by exact match, and a missing or\nmismatched state is rejected.\nAUTHZ=\"https://<SERVER_URL>/authorize\"\
    \nCID=\"<REGISTERED_CLIENT_ID>\"\nGOOD_REDIRECT=\"<REGISTERED_REDIRECT_URI>\"\nBAD_REDIRECT=\"https://attacker.example.com/cb\"\
    \nCH=\"<CODE_CHALLENGE>\"\nbase=\"client_id=$CID&response_type=code&state=test123&code_challenge=$CH&code_challen\nge_method=S256\"\
    \ngc=$(curl -sS -o /dev/null -w '%{http_code}'\n\"$AUTHZ?$base&redirect_uri=$GOOD_REDIRECT\")\nbc=$(curl -sS -o /dev/null\
    \ -w '%{http_code}'\n\"$AUTHZ?$base&redirect_uri=$BAD_REDIRECT\")\necho \"control_valid_redirect=$gc varied_bad_redirect=$bc\"\
    \ncase \"$gc\" in\n 000) echo \"ERROR: authorization endpoint unreachable\"; exit 0 ;;\n 4*) echo \"ERROR: positive control\
    \ was itself rejected ($gc), the request is\nmissing required parameters, cannot attribute the redirect_uri rejection\"\
    ; exit 0 ;;\nesac\ncase \"$bc\" in\n 400|401|403) echo \"PASS: with only redirect_uri changed the request is rejected\n\
    while the valid one is accepted, rejection attributable to exact redirect_uri\nvalidation\" ;;\n 302) echo \"REVIEW: the\
    \ bad redirect_uri produced a 302, confirm it is an error\nredirect and not an authorization code sent to the attacker\
    \ URI\" ;;\n 000) echo \"ERROR: authorization endpoint unreachable\" ;;\n *) echo \"REVIEW: bad redirect_uri returned\
    \ $bc\" ;;\nesac\nRun the following command to confirm per-client consent records exist keyed to the\nregistered MCP client's\
    \ client_id with a timestamp. This block is reconstructed from the\nconsent-record shape the Description and Remediation\
    \ specify and needs lab\nconfirmation of the actual consent-log field names before sign-off:\nCB=\"https://<SERVER_URL>/callback\"\
    \nnostate=$(curl -sS -o /dev/null -w '%{http_code}' \"$CB?code=fakecode\")\nbadstate=$(curl -sS -o /dev/null -w '%{http_code}'\
    \ \"$CB?code=fakecode&state=wrongvalue\")\necho \"no_state=$nostate bad_state=$badstate\"\necho \"REVIEW: both should\
    \ be 4xx, but a fabricated code is rejected regardless of\nstate, confirm state validation with a controlled transaction\
    \ varying only state, or\nwith callback-validation logs\"\n Page 125\nRun the following command to confirm per-client\
    \ consent records exist keyed to a\ndownstream client_id with a timestamp. This block is reconstructed from the\nconsent-record\
    \ shape the Description and Remediation specify and needs lab\nconfirmation of the actual consent-log field names before\
    \ sign-off:\nLOG=\"<MCP_CONSENT_LOG>\"\nCLIENT=\"<DOWNSTREAM_CLIENT_ID>\"\nif [ ! -s \"$LOG\" ]; then\n echo \"ERROR:\
    \ consent log not found or empty (cannot verify, capture consent\nrecords)\"\nelse\n grep -E '\"event\":\"consent_granted\"\
    ' \"$LOG\" \\\n | jq -e --arg c \"$CLIENT\" 'select(.client_id==$c and .timestamp!=null)' >/dev/null \\\n && echo \"PASS:\
    \ per-client consent record found for the downstream client with a\ntimestamp\" \\\n || echo \"REVIEW: no per-client consent\
    \ record for this client_id (confirm log field\nnames and that consent runs before the redirect)\"\nfi\nThe system is\
    \ compliant when a mismatched redirect_uri is rejected, a missing or\nmismatched state is rejected, and per-client consent\
    \ is recorded per registered MCP\nclient and enforced before the third-party redirect. A reviewer adjudicates any REVIEW,\n\
    in particular confirming a 302 is an error redirect and not a leaked authorization code."
  remediation: 'This is application or server logic with no portable command. Maintain a per-user

    registry of the MCP client client_id values that have been consented, check it before

    any redirect to the third-party authorization server, and show an MCP-owned consent

    page that names the client and the third-party scopes, with CSRF protection and antiframing. Validate redirect_uri by
    exact string match and reject any change without

    re-registration. Generate a cryptographically random state per request, store it serverside only after consent is approved,
    validate it at the callback, and make it single-use

    and short-lived. Log consent per MCP client. Verify with the Audit.'
  checks:
  - type: command
    command: grep -E '"event":"consent_granted"' "$LOG" \
    expected: ''
    severity: medium
    info: 'Review the proxy''s OAuth flow and confirm a newly registered MCP client triggers fresh

      consent, a changed redirect_uri is rejected by exact match, and a missing or

      mismatched state is rejected.

      AUTHZ="https://<SERVER_URL>/authorize"

      CID="<REGISTERED_CLIENT_ID>"

      GOOD_REDIRECT="<REGISTERED_REDIRECT_URI>"

      BAD_REDIRECT="https://attacker.example.com/cb"

      CH="<CODE_CHALLENGE>"

      base="client_id=$CID&respon'
- id: 4.1.1
  title: Ensure per-tool consent or pre-approved allowlists are required
  scoring: manual
  profile:
  - Level 1
  description: MCP hosts display the canonical tool definition to the operator before a tool is executed for the first time,
    and require either an explicit user decision or a pre-approved allowlist entry before execution proceeds. The canonical
    tool definition includes at least the tool name, title, description, and input schema, the output schema where present,
    and the annotations, though server-provided annotations are untrusted and do not determine enterprise risk. The pre-approved
    allowlist path and the per-invocation consent path are each configured explicitly and are not interchangeable. A tool
    newly advertised or modified through a notifications/tools/list_changed notification is not added to the allowlist automatically.
    The tool is quarantined until re-validated under the capability baseline, after which it becomes eligible for allowlist
    addition or per-invocation consent.
  rationale: Tool invocation consent is the primary way human operators keep awareness and control of what an MCP-connected
    model does on their behalf. Without consent or a reviewed allowlist, a model can invoke any tool the server exposes, including
    tools with destructive, irreversible, or data-exfiltrating effects. This matters most for third-party servers, where tool
    descriptions and schemas are untrusted metadata that may not reflect actual behavior. Presenting the full canonical tool
    definition before first execution ensures the operator sees what the tool claims to do before authorizing it.
  impact: Consent prompts add slight friction on first use of a new tool, and the automated path avoids that friction at the
    cost of configuring and maintaining the allowlist. Both paths require explicit configuration. Page 129
  references:
  - '1. MCP specification (security best practices):'
  - https://modelcontextprotocol.io/docs/2026-0728/tutorials/security/security_best_practices
  - '2. MCP specification (Server Features / Tools):'
  - https://modelcontextprotocol.io/specification/2026-07-28/server/tools
