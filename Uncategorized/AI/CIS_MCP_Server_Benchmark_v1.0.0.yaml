- id: '2.5'
  title: Ensure Origin header is validated on all Streamable HTTP requests to prevent DNS rebinding attacks
  scoring: scored
  profile:
  - Level 1
  description: Streamable HTTP servers validate the Origin header on every incoming request. When the Origin header is present
    and is not on the operator-configured allowlist, the server returns HTTP 403. This is enforced on the request itself,
    not only on a CORS preflight. Because non-browser MCP clients routinely send no Origin, the specification does not require
    an absent Origin to be rejected, and a server may accept it or, under a stricter local policy, reject it. The control
    targets a present, hostile Origin, which is the DNSrebinding shape. For locally bound servers, bind to localhost and reject
    non-localhost Origins.
  rationale: DNS rebinding lets a remote web page re-resolve its own domain to a loopback address and then issue requests
    to a locally bound MCP server, which is why developer-facing localhost deployments are the prime target. Without Origin
    validation the server cannot distinguish a legitimate same-origin request from a rebinding attack, which enables cross-origin
    tool invocation. The specification's Streamable HTTP security section requires Origin validation on all incoming connections
    and a 403 on a present-andinvalid Origin.
  impact: There is no impact for legitimate clients that send an allowlisted Origin. A legitimate non-browser client that
    sends no Origin is unaffected where the server accepts an absent Origin, and is rejected only under a stricter local policy
    that requires one. The control adds strong protection against DNS rebinding, including for localhost-bound developer servers.
    Page 78
  references:
  - 1. MCP specification (Base Protocol / Transports / Streamable HTTP, security and
  - '2. MCP specification (security best practices, SSRF and DNS rebinding):'
  - https://modelcontextprotocol.io/docs/2026-0728/tutorials/security/security_best_practices
  page_start: 78
  audit_raw: "Send a well-formed Streamable HTTP request carrying a hostile Origin and confirm the\nserver returns HTTP 403\
    \ on the request itself, not only on a CORS preflight. Then\nrepeat with an allowlisted Origin and with no Origin. Because\
    \ acceptance or rejection of\nan absent Origin does not determine compliance unless policy requires one, record the\n\
    no-Origin result for compatibility awareness rather than as a pass or fail. Substitute the\nendpoint URL, the approved\
    \ protocol version, and an allowlisted Origin. Run the\nfollowing command:\n Page 79\nURL=\"<MCP_ENDPOINT_URL>\"\nVER=\"\
    <APPROVED_PROTOCOL_VERSION>\"\nALLOWED_ORIGIN=\"<ALLOWED_ORIGIN>\"\nHOSTILE_ORIGIN=\"https://cis-rebinding-probe.example\"\
    \nBODY=$(jq -nc --arg v \"$VER\"\n'{jsonrpc:\"2.0\",id:51,method:\"tools/list\",params:{_meta:{\"io.modelcontextprotocol/pro\n\
    tocolVersion\":$v,\"io.modelcontextprotocol/clientInfo\":{name:\"cis-benchmarkaudit\",version:\"1.0\"},\"io.modelcontextprotocol/clientCapabilities\"\
    :{}}}}'\n2>/dev/null)\nif [ -z \"$BODY\" ]; then\n echo \"ERROR: probe build failed\"\nelse\n EV=$(curl -sS -o /dev/null\
    \ --connect-timeout 5 --max-time 15 -w '%{http_code}' -X\nPOST \"$URL\" -H 'Accept: application/json, text/event-stream'\
    \ -H 'Content-Type:\napplication/json' -H \"MCP-Protocol-Version: $VER\" -H 'Mcp-Method: tools/list' -H\n\"Origin: $HOSTILE_ORIGIN\"\
    \ --data-binary \"$BODY\" 2>/dev/null)\n GD=$(curl -sS -o /dev/null --connect-timeout 5 --max-time 15 -w '%{http_code}'\
    \ -X\nPOST \"$URL\" -H 'Accept: application/json, text/event-stream' -H 'Content-Type:\napplication/json' -H \"MCP-Protocol-Version:\
    \ $VER\" -H 'Mcp-Method: tools/list' -H\n\"Origin: $ALLOWED_ORIGIN\" --data-binary \"$BODY\" 2>/dev/null)\n NO=$(curl\
    \ -sS -o /dev/null --connect-timeout 5 --max-time 15 -w '%{http_code}' -X\nPOST \"$URL\" -H 'Accept: application/json,\
    \ text/event-stream' -H 'Content-Type:\napplication/json' -H \"MCP-Protocol-Version: $VER\" -H 'Mcp-Method: tools/list'\
    \ --databinary \"$BODY\" 2>/dev/null)\n echo \"hostile_origin=$EV allowed_origin=$GD no_origin=$NO\"\n if [ \"$EV\" =\
    \ \"000\" ] || [ \"$GD\" = \"000\" ] || [ \"$NO\" = \"000\" ]; then\n echo \"ERROR: endpoint unreachable or timed out\
    \ on one or more probes\"\n elif [ \"$EV\" = \"400\" ] || [ \"$GD\" = \"400\" ] || [ \"$NO\" = \"400\" ]; then\n echo\
    \ \"ERROR: a probe was rejected 400 before Origin was evaluated (likely a routingheader mismatch); align the probe headers\
    \ and re-run\"\n elif [ \"$EV\" = \"403\" ]; then\n case \"$GD\" in\n 2*|3*) echo \"PASS: the hostile Origin is rejected\
    \ with 403 on the request itself and\nthe allowlisted Origin is accepted\" ;;\n 403) echo \"REVIEW: the allowlisted Origin\
    \ is also rejected with 403; confirm\nALLOWED_ORIGIN matches the server's allowlist exactly\" ;;\n *) echo \"REVIEW: hostile\
    \ Origin rejected but the allowlisted Origin returned $GD;\ninspect before concluding\" ;;\n esac\n else\n echo \"FAIL:\
    \ the hostile Origin was not rejected with 403 (got $EV) on the request\nitself\"\n fi\nfi\nThe system is compliant when\
    \ the hostile Origin is rejected with 403 on the actual\nrequest and the allowlisted Origin is accepted. Whether the server\
    \ accepts or rejects a\nrequest with no Origin is informational, not part of the verdict. A probe rejected with 400\n\
    indicates a routing-header mismatch rather than an Origin decision, so correct the probe\nheaders and re-run.\n Page 80"
  remediation: "Configure the MCP server to validate the Origin header on every Streamable HTTP\nrequest and return HTTP 403\
    \ for any present Origin not on an explicit allowlist, logging\nthe rejection as a security event. For locally bound servers,\
    \ bind to localhost and reject\nnon-localhost Origins. As layered defense, the gateway can enforce the allowlist. The\n\
    following nginx example is illustrative:\nmap $http_origin $cis_mcp_origin_ok {\n default 0;\n \"https://app.example.com\"\
    \ 1;\n}\nserver {\n location /mcp { if ($cis_mcp_origin_ok) { set $cis_block 0; } if ($http_origin)\n{ set $cis_block\
    \ \"${cis_block}1\"; } if ($cis_block = 1) { return 403; } proxy_pass\nhttp://mcp_upstream; }\n}\nThe gateway enforces\
    \ the allowlist for present Origins but does not replace server-side\nvalidation, which the specification requires. Where\
    \ a web UI is served alongside the\nMCP endpoint, set an explicit Access-Control-Allow-Origin allowlist, do not\ncombine\
    \ Access-Control-Allow-Credentials: true with a wildcard origin, and\nset a restrictive Content-Security-Policy: frame-ancestors."
  checks:
  - type: manual_review
    info: 'Send a well-formed Streamable HTTP request carrying a hostile Origin and confirm the

      server returns HTTP 403 on the request itself, not only on a CORS preflight. Then

      repeat with an allowlisted Origin and with no Origin. Because acceptance or rejection of

      an absent Origin does not determine compliance unless policy requires one, record the

      no-Origin result for compatibility awareness rather than as a pass or fail. Substitute the

      endpoint URL, the approved protocol version, and an allowlisted Ori'
    severity: medium
- id: 3.1.1
  title: Ensure stdio server credentials are sourced from the environment or OS credential store
  scoring: scored
  profile:
  - Level 1
  description: Source the stdio server's own credentials from environment variables, an OS keychain or secret store, or injected
    process credentials, and do not use MCP's HTTP browserbased authorization flow to authenticate the client-to-server stdio
    connection. This does not prohibit a tool or server from independently using OAuth to access a downstream service. Under
    the 2026-07-28 specification, implementations using an stdio transport do not follow the HTTP authorization specification
    and instead retrieve credentials from the environment.
  rationale: Using MCP's interactive HTTP authorization flow for a stdio connection cannot work and creates a credential-exposure
    risk, because a stdio server has no browser and no redirect URI. Sourcing the server's own secrets from the environment
    or an OS secret store keeps them out of command lines, process listings, and logs. A stdio server that acts as a client
    of a downstream service may still use OAuth for that downstream call, which is out of scope for the client-to-server stdio
    connection this Recommendation covers.
  impact: There is no impact on functionality. Sourcing credentials from the environment keeps them out of process listings
    and shell history. Page 83
  references:
  - 1. MCP specification (Base Protocol / Authorization, environment-based credentials
  - '2. MCP specification (security best practices, local server credential handling):'
  - https://modelcontextprotocol.io/docs/2026-0728/tutorials/security/security_best_practices
  page_start: 83
  audit_raw: "Inspect the stdio server's launch configuration and process environment, and confirm\nthat credentials come\
    \ from the environment or a secret store and that no interactive\nOAuth flow authenticates the stdio connection. The commands\
    \ assume systemd, so\nadapt them to the process manager. Run the following command to confirm no\ninteractive or browser\
    \ OAuth is configured. The command reads the unit first and treats\na missing unit as an error:\nUNIT=\"<MCP_STDIO_UNIT>\"\
    \nunit_text=$(systemctl cat \"$UNIT\" 2>/dev/null) || { echo \"ERROR: cannot read unit\n$UNIT (does it exist? is this\
    \ a systemd deployment?)\"; exit 0; }\n[ -n \"$unit_text\" ] || { echo \"ERROR: unit $UNIT returned no configuration\"\
    ; exit\n0; }\nif printf '%s' \"$unit_text\" | grep -iqE 'oauth|authorization_code|redirect_uri|--\nbrowser|open-browser';\
    \ then\n printf '%s\\n' \"$unit_text\" | grep -inE 'oauth|authorization_code|redirect_uri|--\nbrowser|open-browser'\n\
    \ echo \"FAIL: interactive-auth indicators in launch config (inspect above)\"\nelse\n echo \"PASS: no interactive OAuth\
    \ indicators in launch config\"\nfi\nRun the following command to confirm the credential is injected from the environment\
    \ or\nsecret store, not the command line. The command also treats a missing unit as an error:\nUNIT=\"<MCP_STDIO_UNIT>\"\
    \nCRED_VAR_NAME=\"<CRED_VAR_NAME>\"\nunit_text=$(systemctl cat \"$UNIT\" 2>/dev/null) || { echo \"ERROR: cannot read unit\n\
    $UNIT\"; exit 0; }\nenv_line=$(systemctl show \"$UNIT\" -p Environment 2>/dev/null)\nif printf '%s' \"$env_line\" | grep\
    \ -q \"$CRED_VAR_NAME\"; then echo \"PASS: credential\nsupplied via environment\"\nelse echo \"REVIEW: credential not\
    \ found in unit Environment (check secret-store\ninjection)\"; fi\nif printf '%s' \"$unit_text\" | grep -E '^ExecStart='\
    \ | grep -qiE \"$CRED_VAR_NAME|--\ntoken|--api-key\"; then\n echo \"FAIL: credential appears on the command line (visible\
    \ in process list)\"\nelse echo \"PASS: no credential on the command line\"; fi\nThe system is compliant when no interactive\
    \ OAuth indicators appear, no credential\nappears on the command line, and the credential is supplied through the environment\
    \ or\na secret store. A missing or unreadable unit is ERROR. A REVIEW on the environmentpresence check means the credential\
    \ was not visible in the unit Environment, and the\nreviewer confirms whether a secret-store wrapper injects it at launch.\n\
    \ Page 84"
  remediation: 'Configure stdio servers to receive credentials from the environment or an OS secret

    store, not through an interactive OAuth flow or a command-line argument. The following

    example uses secret-tool from libsecret, so adapt it to your store. Place the export

    in the unit''s environment setup (an EnvironmentFile or wrapper script), not on the

    command line, then exec the server. Run the following command to retrieve the

    credential and export it before launch:

    export MCP_API_TOKEN="$(secret-tool lookup app mcp-server)"

    Remove any interactive OAuth configuration and any credential passed as a commandline argument. This does not affect a
    downstream OAuth client the server uses to reach

    a third-party service. Restart the server and re-run the Audit.'
  checks:
  - type: command
    command: 'if printf ''%s'' "$unit_text" | grep -iqE ''oauth|authorization_code|redirect_uri|-- && printf ''%s\n'' "$unit_text"
      | grep -inE ''oauth|authorization_code|redirect_uri|-- && if printf ''%s'' "$env_line" | grep -q "$CRED_VAR_NAME"; then
      echo "PASS: credential && if printf ''%s'' "$unit_text" | grep -E ''^ExecStart='' | grep -qiE "$CRED_VAR_NAME|--'
    expected: ''
    severity: medium
    info: 'Inspect the stdio server''s launch configuration and process environment, and confirm

      that credentials come from the environment or a secret store and that no interactive

      OAuth flow authenticates the stdio connection. The commands assume systemd, so

      adapt them to the process manager. Run the following command to confirm no

      interactive or browser OAuth is configured. The command reads the unit first'
- id: 3.1.2
  title: Ensure OIDC/OAuth 2.1 or short-lived API tokens are used for remote servers
  scoring: manual
  profile:
  - Level 1
  description: Remote (HTTP) MCP servers use transport-level authentication, OAuth 2.1/OIDC for user access or the OAuth client_credentials
    flow for service-to-service access. Tokens are scoped and audience-bound narrowly (see the Resource Indicators Recommendation),
    token lifetimes are kept short, and rotation is automated. Where a deployment uses short-lived API tokens instead of interactive
    OAuth, those tokens are audience-bound to this server, validated server-side, issued by an enterprise-controlled issuer,
    and never long-lived static keys. Under the 2026-07-28 revision, clients validate the iss parameter on authorization responses.
    Client registration uses Client ID Metadata Documents as the standard mechanism, where the client identifies itself with
    a portable HTTPS URL rather than a per-server registration, with pre-registration and Dynamic Client Registration retained
    for backwards compatibility. A client that registers through Dynamic Client Registration or pre-registration declares
    its OpenID Connect application_type, so the authorization server does not default a desktop or CLI client to web and reject
    its localhost redirect URI. It also binds registered credentials to the issuing authorization server's issuer, re-registering
    when a resource migrates between authorization servers rather than sending credentials to the wrong party.
  rationale: Strong authentication limits the blast radius of token theft and cross-service misuse. Short token lifetimes
    bound the window in which a stolen token is useful, and audience binding prevents a token issued for one resource from
    being replayed at another. iss validation mitigates a class of mix-up attack that is more prevalent in MCP's singleclient,
    many-server pattern.
  impact: 'Adopting OAuth 2.1/OIDC or the client_credentials flow is a moderate one-time integration effort, standing up or
    connecting to an authorization server, registering the client, and wiring token validation into the request path. The
    security value is high: it establishes who is calling and bounds the damage from a stolen token through short lifetimes
    and audience binding. Page 86'
  references:
  - '1. MCP specification (Base Protocol / Authorization):'
  - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
  - '2. MCP specification (Key Changes, authorization hardening):'
  - https://modelcontextprotocol.io/specification/2026-07-28/changelog
  - https://github.com/modelcontextprotocol/modelcontextprotocol/pull/837
  - https://github.com/modelcontextprotocol/modelcontextprotocol/pull/2352
  - https://modelcontextprotocol.io/seps/2468-recommend-issuer-claim-for-auth
  - https://datatracker.ietf.org/doc/html/rfc9207
  page_start: 86
  audit_raw: "Review the server authentication middleware, token lifetimes, and audiences. Confirm\nunauthenticated requests\
    \ are rejected and issued tokens are short-lived. Audience\nbinding is assessed under Recommendation 3.3.1. Run the following\
    \ command to\nconfirm an unauthenticated request returns 401, ideally with a WWW-Authenticate\nheader pointing at resource\
    \ metadata:\nURL=\"https://<SERVER_URL>/mcp\"\nPROTO=\"2026-07-28\"\ncode=$(curl -sS -o /dev/null -w '%{http_code}' -X\
    \ POST \"$URL\" -H 'Content-Type:\napplication/json' -H 'Accept: application/json, text/event-stream' -H \"MCP-ProtocolVersion:\
    \ $PROTO\" -H 'Mcp-Method: tools/list' -d\n\"{\\\"jsonrpc\\\":\\\"2.0\\\",\\\"id\\\":1,\\\"method\\\":\\\"tools/list\\\
    \",\\\"params\\\":{\\\"_meta\\\":{\\\"io.\nmodelcontextprotocol/protocolVersion\\\":\\\"$PROTO\\\",\\\"io.modelcontextprotocol/clientInf\n\
    o\\\":{\\\"name\\\":\\\"cis-benchmark-audit\\\",\\\"version\\\":\\\"1.0\\\"}}}}\")\ncase \"$code\" in\n 401) echo \"PASS:\
    \ unauthenticated request rejected with 401\" ;;\n 403) echo \"REVIEW: unauthenticated request returned 403, expected\
    \ 401 for missing\ncredentials, confirm this is a deliberate gateway policy\" ;;\n 000) echo \"ERROR: server unreachable\
    \ (not a PASS)\" ;;\n 2*) echo \"FAIL: unauthenticated request accepted ($code)\" ;;\n *) echo \"REVIEW: returned $code\"\
    \ ;;\nesac\nThe aud claim is shown for context, and its validation is assessed under\nRecommendation 3.3.1. Run the following\
    \ command to decode a live JWT access token\nand confirm it is short-lived:\n Page 87\nTOKEN='<JWT_ACCESS_TOKEN>'\nseg=$(printf\
    \ '%s' \"$TOKEN\" | cut -d. -f2 | tr '_-' '/+')\npad=$(( (4 - ${#seg} % 4) % 4 )); seg=\"$seg$(printf '=%.0s' $(seq 1\
    \ $pad))\"\nclaims=$(printf '%s' \"$seg\" | base64 -d 2>/dev/null)\n[ -z \"$claims\" ] && { echo \"ERROR: could not decode\
    \ token (opaque token? use\nintrospection)\"; exit 0; }\nprintf '%s' \"$claims\" | jq empty 2>/dev/null || { echo \"ERROR:\
    \ decoded payload is not\nJSON (opaque token? use introspection)\"; exit 0; }\necho \"$claims\" | jq '{iss, aud, exp,\
    \ iat, scope, scp}'\nnow=$(date +%s)\nexp=$(echo \"$claims\" | jq -r '.exp // empty')\niat=$(echo \"$claims\" | jq -r\
    \ '.iat // empty')\n[ -z \"$exp\" ] && { echo \"REVIEW: token has no exp claim, lifetime cannot be\nassessed\"; exit 0;\
    \ }\nremaining=$(( exp - now )); echo \"remaining_seconds=$remaining\"\n[ \"$remaining\" -le 0 ] && echo \"note: sampled\
    \ token is already expired, remaining\nlife is not the issued lifetime\"\nif [ -n \"$iat\" ]; then\n lifetime=$(( exp\
    \ - iat )); echo \"issued_lifetime_seconds=$lifetime\"\n if [ \"$lifetime\" -gt 0 ] && [ \"$lifetime\" -le 3600 ]; then\
    \ echo \"PASS: issued token\nlifetime is within the 1h guideline\"\n else echo \"REVIEW: issued token lifetime is $lifetime\
    \ (longer than the 1h\nguideline, or non-positive)\"; fi\nelse\n echo \"REVIEW: token has no iat claim, issued lifetime\
    \ cannot be computed from the\ntoken; confirm expires_in from the token endpoint response is short-lived\"\nfi\nConfirm\
    \ iss validation on authorization responses by inspecting the authorizationserver metadata and the client since the resource-server\
    \ boundary cannot exercise it. In\nthe metadata, confirm authorization_response_iss_parameter_supported is\ntrue and that\
    \ the server emits iss. In the client, confirm it records the expected issuer\nbefore redirecting and rejects a response\
    \ whose iss does not match, or is absent when\nthe server advertises support. The system is compliant when unauthenticated\
    \ requests\nare rejected with 401, issued tokens are short-lived, and the client validates iss.\n Page 88"
  remediation: 'Configure remote MCP servers to require OAuth 2.1/OIDC, or client_credentials

    for machine-to-machine access. They issue short-lived audience-bound tokens and

    validate iss on authorization responses. This spans the client, server, and authorizationserver layers with no single
    runnable command. Set a short access-token TTL (a

    common baseline is <= 1 hour) with refresh-token rotation, require PKCE for public

    clients, and enforce audience and iss validation on the MCP server. Register clients

    through Client ID Metadata Documents where supported. A client using Dynamic Client

    Registration or pre-registration declares its OpenID Connect application_type and

    binds registered credentials to the issuer, re-registering on resource migration. Record

    these as authorization-server and server configuration in the enterprise registry. Verify

    with the Audit.'
  checks:
  - type: manual_review
    info: 'Review the server authentication middleware, token lifetimes, and audiences. Confirm

      unauthenticated requests are rejected and issued tokens are short-lived. Audience

      binding is assessed under Recommendation 3.3.1. Run the following command to

      confirm an unauthenticated request returns 401, ideally with a WWW-Authenticate

      header pointing at resource metadata:

      URL="https://<SERVER_URL>/mcp"

      PROTO="2026-07-28"

      code=$(curl -sS -o /dev/null -w ''%{http_code}'' -X POST "$URL" -H ''Content-Type:

      applicat'
    severity: medium
- id: 3.2.1
  title: Ensure per-tool authorization policies are enforced
  scoring: manual
  profile:
  - Level 2
  description: 'Authorization for tool invocation is deny-by-default: tools are allowlisted per role or identity, and every
    authorization decision (allow and deny) is logged with the tool name, calling identity, the policy rule that matched,
    a timestamp, and a request or correlation identifier that ties the decision to the invocation. Authorization is enforced
    server-side or at the gateway, never in the model or client.'
  rationale: Tools can have powerful side effects, and without per-tool authorization any caller that reaches the server can
    invoke every tool it exposes, including destructive, irreversible, or data-exfiltrating ones. Role-based, deny-by-default
    authorization limits which identities can invoke which tools, so a compromised client, or a confused or injected model,
    is confined to the tools its identity is granted rather than the full set.
  impact: This adds ongoing policy-management overhead to define and maintain each tool's access policy, justified by preventing
    an over-permissioned caller from invoking every tool the server exposes. Page 91
  references:
  - '1. MCP specification (Base Protocol / Authorization):'
  - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
  - '2. MCP specification (Base Protocol / Transports / Streamable HTTP, MCPProtocol-Version, Mcp-Method, and Mcp-Name headers):'
  - https://modelcontextprotocol.io/specification/2026-0728/basic/transports/streamable-http
  page_start: 91
  audit_raw: "Compare the tool registry to the role-based authorization policy, then confirm a leastprivileged identity is\
    \ denied a privileged tool that an authorized identity is allowed. Both\ndecisions are logged and correlated to the controlled\
    \ requests. Set TOOL, ARGS,\nAUTH_TOKEN (an identity the policy permits, the positive control), and LP_TOKEN (a\nleast-privileged\
    \ identity that should be denied). Set AUTHZ_ERR_JQ to the boolean\nmatching the deployment's structured authorization-denial\
    \ error, for\nexample .error.code==<AUTHZ_DENY_CODE>. Run the following command:\n Page 92\nURL=\"https://<SERVER_URL>/mcp\"\
    \nTOOL=\"<PRIVILEGED_TOOL>\"\nARGS='<VALID_ARGUMENTS_JSON>'\nAUTH_TOKEN=\"<AUTHORIZED_TOKEN>\"\nLP_TOKEN=\"<LEAST_PRIVILEGED_TOKEN>\"\
    \nPROTO=\"2026-07-28\"\nAUTHZ_ERR_JQ=\"${AUTHZ_ERR_JQ:-.error.code==-32003}\"\nCORR=$(head -c16 /dev/urandom 2>/dev/null\
    \ | od -An -tx1 | tr -d ' \\n'); [ -n\n\"$CORR\" ] || CORR=$(date +%s%N | sha1sum | cut -c1-32)\necho \"$CORR\" > /tmp/cis_3_3_corr\n\
    TP=\"00-$CORR-$(printf '%016x' 1)-01\"\nmkbody() { printf\n'{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"\
    params\":{\"name\":\"%s\",\"arguments\":%s,\"\n_meta\":{\"io.modelcontextprotocol/protocolVersion\":\"%s\",\"io.modelcontextprotocol/trace\n\
    parent\":\"%s\",\"io.modelcontextprotocol/clientInfo\":{\"name\":\"cis-benchmarkaudit\",\"version\":\"1.0\"}}}}' \"$1\"\
    \ \"$2\" \"$PROTO\" \"$TP\"; }\nnorm() { case \"$(printf '%s' \"$1\" | sed -e 's/^[[:space:]]*//' | cut -c1)\" in '{')\n\
    printf '%s' \"$1\";; *) printf '%s' \"$1\" | sed -n 's/^data: //p' | while IFS= read -r\nl; do printf '%s' \"$l\" | jq\
    \ -e 'select(.id==1)' 2>/dev/null && break; done;; esac; }\nbf=$(mktemp)\npcs=$(curl -sS --connect-timeout 5 -m 10 -o\
    \ \"$bf\" -w '%{http_code}' -X POST \"$URL\" -H\n'Content-Type: application/json' -H 'Accept: application/json, text/event-stream'\
    \ -H\n\"Authorization: Bearer $AUTH_TOKEN\" -H \"MCP-Protocol-Version: $PROTO\" -H 'Mcp-Method:\ntools/call' -H \"Mcp-Name:\
    \ $TOOL\" -d \"$(mkbody \"$TOOL\" \"$ARGS\")\" 2>/dev/null)\npc=$(norm \"$(cat \"$bf\")\")\nif [ \"$pcs\" != \"200\" ]\
    \ || ! printf '%s' \"$pc\" | jq -e '.result and\n(.error|not)' >/dev/null 2>&1; then\n echo \"ERROR: positive control\
    \ failed (authorized identity status=$pcs), transport\nor auth broken, cannot attribute the denial\"; rm -f \"$bf\"; exit\
    \ 0\nfi\nds=$(curl -sS --connect-timeout 5 -m 10 -o \"$bf\" -w '%{http_code}' -X POST \"$URL\" -H\n'Content-Type: application/json'\
    \ -H 'Accept: application/json, text/event-stream' -H\n\"Authorization: Bearer $LP_TOKEN\" -H \"MCP-Protocol-Version:\
    \ $PROTO\" -H 'Mcp-Method:\ntools/call' -H \"Mcp-Name: $TOOL\" -d \"$(mkbody \"$TOOL\" \"$ARGS\")\" 2>/dev/null)\nd=$(norm\
    \ \"$(cat \"$bf\")\"); rm -f \"$bf\"\nif [ \"$ds\" = \"403\" ]; then echo \"PASS: least-privileged identity denied by\n\
    attributable authorization response (403)\"\nelif printf '%s' \"$d\" | jq -e \"$AUTHZ_ERR_JQ\" >/dev/null 2>&1; then echo\
    \ \"PASS:\nleast-privileged identity denied by documented authorization error\"\nelif [ \"$ds\" = \"200\" ] && printf\
    \ '%s' \"$d\" | jq -e '.result and\n(.error|not)' >/dev/null 2>&1; then echo \"FAIL: least-privileged identity invoked\
    \ the\nprivileged tool\"\nelse de=$(printf '%s' \"$d\" | jq -r '.error.code // \"none\"'); echo \"ERROR: denial not\n\
    attributable to authorization (status=$ds, error=$de)\"; fi\nRun the following command to confirm both decisions were\
    \ logged and correlated to the\ncontrolled requests. Set LOG to the authorization decision log and adjust the jq\nselectors\
    \ to the deployment's log schema. The command scopes to the correlation\nidentifier from the previous command:\n Page\
    \ 93\nLOG=\"<MCP_AUDIT_LOG>\"\nCORR=$(cat /tmp/cis_3_3_corr 2>/dev/null)\n[ -n \"$CORR\" ] || { echo \"ERROR: no correlation\
    \ id from the wire audit, run the wire\nblock first\"; exit 0; }\nscoped=$(grep -F \"$CORR\" \"$LOG\" 2>/dev/null)\nn=$(printf\
    \ '%s\\n' \"$scoped\" | sed '/^$/d' | wc -l | tr -d ' ')\necho \"count: $n log records match this audit's correlation\
    \ id\"\nallow=$(printf '%s\\n' \"$scoped\" | jq -c 'select(.event==\"authz_allow\" and .tool!=null\nand .identity!=null\
    \ and .rule!=null and .ts!=null and .corr!=null)' 2>/dev/null |\nhead -1)\ndeny=$(printf '%s\\n' \"$scoped\" | jq -c 'select(.event==\"\
    authz_deny\" and .tool!=null\nand .identity!=null and .rule!=null and .ts!=null and .corr!=null)' 2>/dev/null |\nhead\
    \ -1)\nif [ -n \"$allow\" ] && [ -n \"$deny\" ]; then echo \"PASS: both allow and deny decisions\nlogged for the controlled\
    \ requests with tool, identity, rule, timestamp, and\ncorrelation id\"\nelif [ -n \"$allow\" ] || [ -n \"$deny\" ]; then\
    \ echo \"REVIEW: only one of the allow or\ndeny decisions was logged with the required fields for this audit\"\nelse echo\
    \ \"FAIL: no correlated authorization decision records with the required\nfields\"; fi\nThe system is compliant when a\
    \ least-privileged identity is denied a privileged tool by an\nattributable authorization response (a 403 or the documented\
    \ authorization error) while\nan authorized identity is allowed the same tool under the same request, and both\ndecisions\
    \ are logged with tool, identity, matched rule, timestamp, and correlation\nidentifier. A denial not attributable to authorization\
    \ is ERROR."
  remediation: 'Configure the server or gateway to enforce deny-by-default per-tool authorization keyed

    to role and identity, and to log every decision. This is application, server, or gateway

    logic with no portable config or command. Define a deny-by-default policy that allowlists

    tools per role, map identities to roles from the authenticated token, and reference the

    enterprise tool risk classification rather than server-provided annotations (see

    Recommendation 3.2.3). For every invocation, emit an authorization decision log entry

    (allow and deny) with the tool name, calling identity, matched rule, timestamp, and a

    correlation identifier. Verify with the Audit using least-privileged and authorized test

    identities.'
  checks:
  - type: manual_review
    info: 'Compare the tool registry to the role-based authorization policy, then confirm a leastprivileged identity is denied
      a privileged tool that an authorized identity is allowed. Both

      decisions are logged and correlated to the controlled requests. Set TOOL, ARGS,

      AUTH_TOKEN (an identity the policy permits, the positive control), and LP_TOKEN (a

      least-privileged identity that should be denied). Set AUTHZ_ERR_JQ to the boolean

      matching the deployment''s structured authorization-denial error, for

      example'
    severity: medium
- id: 3.2.2
  title: Ensure token passthrough to downstream APIs is forbidden
  scoring: manual
  profile:
  - Level 1
  description: An MCP server never forwards a client-presented inbound token to a downstream API. Under the MCP authorization
    specification, the server accepts only tokens whose audience is the MCP server itself. To call a downstream API, the server
    presents a separate token whose audience is that downstream API, never the inbound token. It obtains that token through
    OAuth token exchange when acting on behalf of a user, or through client_credentials when acting as itself. Because the
    inbound token's audience is the MCP server and not the downstream API, it is never valid there.
  rationale: The MCP authorization specification forbids token passthrough because it circumvents security controls such as
    rate limiting, request validation, and audience checks, breaks the audit trail by making downstream logs record the wrong
    origin identity, and widens the trust boundary so a token accepted at one service is honored at others.
  impact: Enforcing this may require a one-time gateway or middleware change so the server acquires a separate downstream
    token rather than forwarding the inbound token. Page 96
  references:
  - '1. MCP specification (Base Protocol / Authorization, token audience restriction):'
  - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
  - '2. MCP specification (security best practices, token passthrough):'
  - https://modelcontextprotocol.io/docs/2026-0728/tutorials/security/security_best_practices
  page_start: 96
  audit_raw: "Inspect the proxy or gateway configuration and the token-handling middleware, and\nconfirm the token presented\
    \ downstream is a separate token audience-bound to the\ndownstream API, not the inbound token. Run the following command\
    \ to decode the\ninbound token and confirm its aud includes the MCP server and not the downstream\nAPI:\nTOKEN='<CLIENT_INBOUND_JWT>'\n\
    MCP_SERVER_AUDIENCE=\"<MCP_SERVER_AUDIENCE>\"\nDOWNSTREAM_API_AUDIENCE=\"<DOWNSTREAM_API_AUDIENCE>\"\nseg=$(printf '%s'\
    \ \"$TOKEN\" | cut -d. -f2 | tr '_-' '/+')\npad=$(( (4 - ${#seg} % 4) % 4 )); seg=\"$seg$(printf '=%.0s' $(seq 1 $pad))\"\
    \nclaims=$(printf '%s' \"$seg\" | base64 -d 2>/dev/null)\n[ -z \"$claims\" ] && { echo \"ERROR: could not decode token\
    \ (opaque token? use AS\nintrospection)\"; exit 0; }\nprintf '%s' \"$claims\" | jq empty 2>/dev/null || { echo \"ERROR:\
    \ decoded payload is not\nJSON (opaque token? use AS introspection)\"; exit 0; }\necho \"$claims\" | jq '{aud, iss}'\n\
    echo \"$claims\" | jq -e --arg mcp \"$MCP_SERVER_AUDIENCE\" --arg down\n\"$DOWNSTREAM_API_AUDIENCE\" '\n (.aud | if type==\"\
    array\" then . else [.] end) as $a\n | ($a | index($mcp)) != null\n and ($a | index($down)) == null' >/dev/null \\\n &&\
    \ echo \"PASS: client token is bound to the MCP server, not the downstream API\" \\\n || echo \"REVIEW: client token audience\
    \ does not match the expected MCP-only binding\n(missing the MCP audience, or including the downstream API)\"\nRun the\
    \ following command to confirm the inbound token does not appear in egress to\nthe downstream host. The command scopes\
    \ to that host, confirms that host captures\nAuthorization headers, and matches the inbound token by fingerprint, not\
    \ by raw bearer\nstring:\n Page 97\nLOG=\"<MCP_EGRESS_LOG>\"\nTOKEN='<CLIENT_INBOUND_JWT>'\nDOWNSTREAM_HOST=\"<DOWNSTREAM_HOST>\"\
    \n[ -s \"$LOG\" ] || { echo \"ERROR: egress log not found or empty (capture egress for the\ncontrolled request)\"; exit\
    \ 0; }\nFP=$(printf '%s' \"$TOKEN\" | sha256sum | cut -c1-32)\n[ -n \"$FP\" ] || { echo \"ERROR: cannot compute token\
    \ fingerprint (sha256sum\nunavailable)\"; exit 0; }\nscope=$(grep -F \"$DOWNSTREAM_HOST\" \"$LOG\")\n[ -n \"$scope\" ]\
    \ || { echo \"REVIEW: no egress lines to $DOWNSTREAM_HOST in the log\nwindow, cannot assess passthrough to this destination\"\
    ; exit 0; }\nprintf '%s' \"$scope\" | grep -qE 'Bearer |Authorization:' || { echo \"REVIEW: egress to\n$DOWNSTREAM_HOST\
    \ does not capture Authorization headers, so absence of the token\ncannot prove no passthrough\"; exit 0; }\nhit=\"\"\n\
    while IFS= read -r line; do\n bt=$(printf '%s' \"$line\" | sed -n 's/.*[Bb]earer \\([A-Za-z0-9._-]*\\).*/\\1/p')\n [ -z\
    \ \"$bt\" ] && continue\n h=$(printf '%s' \"$bt\" | sha256sum | cut -c1-32)\n [ \"$h\" = \"$FP\" ] && hit=1\ndone <<EOF\n\
    $scope\nEOF\nif [ -n \"$hit\" ]; then echo \"FAIL: inbound client token found by fingerprint in\negress to $DOWNSTREAM_HOST\
    \ (passthrough)\"\nelse echo \"PASS: inbound client token not present in egress to $DOWNSTREAM_HOST and\nthat egress captures\
    \ Authorization headers\"; fi\nThe system is compliant when the inbound token is bound to the MCP server and not\nthe\
    \ downstream API, and does not appear by fingerprint in egress to a downstream\ndestination that is demonstrably capturing\
    \ Authorization headers. A reviewer\nadjudicates any REVIEW."
  remediation: 'This is server or gateway logic with no portable command. On an inbound request,

    validate that the token''s audience is this MCP server and reject it otherwise. To call a

    downstream API, obtain a separate token whose audience is that downstream API,

    using token exchange when acting on behalf of a user or client_credentials when

    the server acts as itself, and never forward the inbound token. Pair with audience and

    issuer alerting (see Recommendation 7.2.1) so passthrough or wrong-audience tokens

    raise an alert in production.'
  checks:
  - type: command
    command: 'printf ''%s'' "$scope" | grep -qE ''Bearer |Authorization:'' || { echo "REVIEW: egress to'
    expected: ''
    severity: medium
    info: 'Inspect the proxy or gateway configuration and the token-handling middleware, and

      confirm the token presented downstream is a separate token audience-bound to the

      downstream API, not the inbound token. Run the following command to decode the

      inbound token and confirm its aud includes the MCP server and not the downstream

      API:

      TOKEN=''<CLIENT_INBOUND_JWT>''

      MCP_SERVER_AUDIENCE="<MCP_SERVER_AUDIENCE>"'
- id: 3.2.3
  title: Ensure server-provided tool annotations are not relied upon for authorization or HITL gating decisions
  scoring: manual
  profile:
  - Level 1
  description: Authorization policies, RBAC rules, and human-in-the-loop (HITL) gating treat MCP tool annotations (readOnlyHint,
    destructiveHint, idempotentHint, openWorldHint) and any other server-provided behavior annotation as untrusted and exclude
    them from access-control decisions. The specification requires clients to consider tool annotations untrusted unless they
    come from a trusted server. All authorization and HITL decisions instead rest on an enterprise-controlled tool risk classification
    that maps tool names and identifiers to approved risk tiers. Annotations from verified internal servers may inform UI
    decisions (for example, showing a confirmation dialog) but never substitute for enforcement.
  rationale: 'Tool annotations are unsigned, server-provided metadata that the client or host consumes without independent
    validation, so a compromised, misconfigured, or malicious server can set readOnlyHint: true on a tool that performs destructive
    writes or openWorldHint: false on a tool that reaches external systems. Any authorization or HITL logic that trusts the
    annotation then misclassifies the tool as safe and skips approval gates. Enterprise authorization therefore rests on operator-controlled
    classification, not server-asserted hints. The Tools specification is explicit that clients treat tool annotations as
    untrusted unless they come from a trusted server, so this Recommendation audits at the enterprise policy layer what the
    specification already requires the client to enforce.'
  impact: Maintaining the enterprise tool risk classification is ongoing effort since the registry must be updated as tools
    are added or their behavior changes. Page 100
  references:
  - '1. MCP specification (Base Protocol / Transports / Streamable HTTP):'
  - https://modelcontextprotocol.io/specification/2026-0728/basic/transports/streamable-http
  - '2. MCP specification (security best practices, annotations are untrusted hints):'
  - https://modelcontextprotocol.io/docs/2026-0728/tutorials/security/security_best_practices
  - https://modelcontextprotocol.io/specification/2026-07-28/server/tools
  - https://github.com/modelcontextprotocol/modelcontextprotocol/discussions/1138
  - https://modelcontextprotocol.io/docs/2026-0728/tutorials/security/security_best_practices
  page_start: 100
  audit_raw: "Run the following command to confirm that a destructive tool falsely advertising\nreadOnlyHint: true is still\
    \ gated, attributable to the classification rather than to a\nmalformed request. Set SAFE_TOOL to a permitted tool with\
    \ valid arguments (the\npositive control) and DEST_TOOL to a tool classified destructive in the registry that\nadvertises\
    \ readOnlyHint: true. Set GATING_JQ to the deployment's structured\nHITL or authorization signal, for example .result.hitl_required==true:\n\
    \ Page 101\nURL=\"https://<SERVER_URL>/mcp\"\nSAFE_TOOL=\"<PERMITTED_TOOL>\"\nSAFE_ARGS='<VALID_SAFE_ARGUMENTS_JSON>'\n\
    DEST_TOOL=\"<DESTRUCTIVE_TOOL_FALSELY_ANNOTATED_READONLY>\"\nDEST_ARGS='<VALID_DEST_ARGUMENTS_JSON>'\nAUTH_TOKEN=\"<AUTH_TOKEN>\"\
    \nPROTO=\"2026-07-28\"\nGATING_JQ=\"${GATING_JQ:-.result.hitl_required==true}\"\nnormalize() {\n raw=\"$1\"\n case \"\
    $(printf '%s' \"$raw\" | sed -e 's/^[[:space:]]*//' | cut -c1)\" in\n '{') printf '%s' \"$raw\" ;;\n *) printf '%s' \"\
    $raw\" | sed -n 's/^data: //p' | while IFS= read -r line; do\nprintf '%s' \"$line\" | jq -e 'select(.id==1)' 2>/dev/null\
    \ && break; done ;;\n esac\n}\nmkbody() { printf\n'{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\"\
    :{\"name\":\"%s\",\"arguments\":%s,\"\n_meta\":{\"io.modelcontextprotocol/protocolVersion\":\"%s\",\"io.modelcontextprotocol/clien\n\
    tInfo\":{\"name\":\"cis-benchmark-audit\",\"version\":\"1.0\"}}}}' \"$1\" \"$2\" \"$PROTO\"; }\nbfile=$(mktemp)\npcs=$(curl\
    \ -sS --connect-timeout 5 -m 10 -o \"$bfile\" -w '%{http_code}' -X POST \"$URL\"\n-H 'Content-Type: application/json'\
    \ -H 'Accept: application/json, text/event-stream'\n-H \"Authorization: Bearer $AUTH_TOKEN\" -H \"MCP-Protocol-Version:\
    \ $PROTO\" -H 'McpMethod: tools/call' -H \"Mcp-Name: $SAFE_TOOL\" -d \"$(mkbody \"$SAFE_TOOL\"\n\"$SAFE_ARGS\")\" 2>/dev/null)\n\
    pc=$(normalize \"$(cat \"$bfile\")\")\nif [ \"$pcs\" != \"200\" ] || ! printf '%s' \"$pc\" | jq -e '.result and\n(.error|not)'\
    \ >/dev/null 2>&1; then\n echo \"ERROR: positive control failed (permitted tool status=$pcs), transport or\nauth broken,\
    \ cannot attribute gating\"\n rm -f \"$bfile\"; exit 0\nfi\nds=$(curl -sS --connect-timeout 5 -m 10 -o \"$bfile\" -w '%{http_code}'\
    \ -X POST \"$URL\"\n-H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream'\n-H \"Authorization:\
    \ Bearer $AUTH_TOKEN\" -H \"MCP-Protocol-Version: $PROTO\" -H 'McpMethod: tools/call' -H \"Mcp-Name: $DEST_TOOL\" -d \"\
    $(mkbody \"$DEST_TOOL\"\n\"$DEST_ARGS\")\" 2>/dev/null)\nd=$(normalize \"$(cat \"$bfile\")\"); rm -f \"$bfile\"\nif [\
    \ \"$ds\" = \"403\" ]; then echo \"PASS: destructive tool gated by attributable\nauthorization denial (403)\"\nelif printf\
    \ '%s' \"$d\" | jq -e \"$GATING_JQ\" >/dev/null 2>&1; then echo \"PASS:\ndestructive tool gated by documented HITL or\
    \ authorization signal\"\nelif [ \"$ds\" = \"200\" ] && printf '%s' \"$d\" | jq -e '.result and\n(.error|not)' >/dev/null\
    \ 2>&1; then echo \"FAIL: destructive tool executed without\ngating, annotation was trusted\"\nelse de=$(printf '%s' \"\
    $d\" | jq -r '.error.code // \"none\"' 2>/dev/null); echo \"ERROR:\ndestructive-tool response not attributable to gating\
    \ (status=$ds, error=$de)\"; fi\n Page 102\nReview the policy and HITL gating configuration, whose location is environmentspecific.\
    \ Confirm it references tool names and identifiers from the enterprise registry,\nand that no rule branches on readOnlyHint,\
    \ destructiveHint,\nidempotentHint, or openWorldHint. The system is compliant when a destructive\ntool falsely advertising\
    \ readOnlyHint: true is still gated by an attributable signal\nwhile a permitted tool succeeds under the same request,\
    \ and no rule branches on\nannotation fields. A response that is neither an attributable gating signal nor a clean\nexecution\
    \ is ERROR."
  remediation: 'Configure authorization and human-in-the-loop logic to key on the enterprise tool risk

    classification, never on server-provided annotations. Remove any rule that branches on

    readOnlyHint, destructiveHint, idempotentHint, or openWorldHint, and

    replace it with a lookup of the tool name or identifier in the enterprise risk classification

    registry. Document the risk tier for each approved tool in the capability baseline

    independently of server metadata. Where a gateway or host performs the gating, apply

    the classification there as the enforcement point of record. Verify with the Audit using a

    tool classified destructive that advertises readOnlyHint: true, confirming it is still

    gated.'
  checks:
  - type: manual_review
    info: "Run the following command to confirm that a destructive tool falsely advertising\nreadOnlyHint: true is still gated,\
      \ attributable to the classification rather than to a\nmalformed request. Set SAFE_TOOL to a permitted tool with valid\
      \ arguments (the\npositive control) and DEST_TOOL to a tool classified destructive in the registry that\nadvertises\
      \ readOnlyHint: true. Set GATING_JQ to the deployment's structured\nHITL or authorization signal, for example .result.hitl_required==true:\n\
      \ Page 101\nURL=\"https"
    severity: medium
- id: 3.3.1
  title: Ensure OAuth tokens are audience-bound to the MCP server using Resource Indicators
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: OAuth tokens are bound to the MCP server they are used with, so a token minted for one server cannot be replayed
    at another. Clients send the Resource Indicators resource parameter in both the authorization request and the token request,
    identifying this MCP server by its canonical URI, so the authorization server mints a token whose audience is this server.
    The MCP server validates that an inbound token's audience is itself and rejects a token bound to a different resource.
    Validating a present iss parameter on authorization responses is a related client responsibility required under the 2026-07-28
    revision, not a resource-server check, and is covered by Recommendation 3.1.2. The OAuth discovery chain for every remote
    MCP server resolves only to approved authorization servers, over TLS, from documents protected against unauthorized modification.
    Under the 2026-07-28 revision, a client discovers where to obtain tokens by reading the server's Protected Resource Metadata,
    reached either through the resource_metadata parameter of a WWW-Authenticate challenge or, where the challenge is absent,
    through the well-known protected-resource URIs (the sub-path form first, then the root form). The challenge is optional
    under this revision, so a server that serves only the well-known document is conformant and the audit treats a missing
    challenge as normal. The Protected Resource Metadata document names at least one authorization server in authorization_servers,
    and an empty or absent list is protocol-invalid and fails. The client then discovers each authorization server through
    its own metadata, retrieved by trying the OAuth Authorization Server Metadata forms and the OpenID Connect Discovery forms
    in turn, including path-insertion and path-append variants where the issuer has a path component. The Protected Resource
    Metadata document is served only over TLS, its resource value matches the server's canonical URI (the RFC 8707 resource
    identifier the audience-binding Recommendation relies on), and every entry in its authorization_servers list appears in
    a changecontrolled export of the enterprise's approved authorization servers. Each listed authorization server's metadata
    publishes an issuer identical to the approved entry by simple string comparison, which is the identity check the revision
    requires of clients. The files or configuration that generate these documents are writable only by the deployment pipeline,
    enforced through Remediation and confirmed out of band. An advertised authorization server absent from the approved export
    is a failure, and an approved authorization server not currently advertised is flagged for review. Page 109
  rationale: 'Resource Indicators bind a token''s audience to a specific resource, so the authorization server issues a token
    scoped to one MCP server rather than an over-broad credential accepted anywhere. Without this binding, a token obtained
    for or stolen from one server can be replayed at another that accepts any valid-looking bearer token, letting an attacker
    pivot from one service to the next on a single credential. This cross-resource replay, or token audience confusion, is
    more damaging in MCP''s single-client, manyserver pattern, where one client holds tokens for many servers at once. Audience
    binding closes it by construction: a token minted for MCP server A cannot be replayed at server B when B validates that
    the audience is itself. The discovery chain is the root of trust for every token-based control in this section. Audience
    binding, scope minimization, and issuer validation all assume the client obtained its token from the intended authorization
    server. A single unauthorized entry in authorization_servers, introduced through misconfiguration or tampering, redirects
    the entire authentication flow to a party the enterprise never approved, and every downstream token check then validates
    tokens from the wrong issuer perfectly. The revision makes the issuer-identity check normative: a client rejects authorization
    server metadata whose issuer differs from the identifier used to construct the discovery URL, so this Recommendation audits
    at the server what the specification already requires the client to enforce. This is a preventive control at the point
    of maximum leverage since one metadata document governs the authorization path for every client of that server.'
  impact: The effort is low, requiring a client request parameter and a server-side audience check. Once the audience check
    is enforced, tokens not bound to this server, including those from clients that do not send the resource parameter, are
    rejected, so existing integrations may need updating first. Page 106 The impact is low for a single enterprise identity
    provider, where the approved export is one line. Deployments with multiple authorization servers maintain the export under
    change control, and a stale export produces review findings until updated. Page 110
  references:
  - 1. MCP specification (Base Protocol / Authorization, resource parameter and
  - '2. RFC 8707 (Resource Indicators for OAuth 2.0):'
  - https://datatracker.ietf.org/doc/html/rfc8707
  - https://datatracker.ietf.org/doc/html/rfc9207
  - https://modelcontextprotocol.io/seps/2468-recommend-issuer-claim-for-auth
  - 1. MCP specification (Base Protocol / Authorization / Authorization Server
  - 2. MCP specification (Base Protocol / Authorization, authorization server metadata
  - https://datatracker.ietf.org/doc/html/rfc8707
  - https://datatracker.ietf.org/doc/html/rfc8414
  - https://datatracker.ietf.org/doc/html/rfc9728
  page_start: 106
  audit_raw: "Verify that issued tokens carry an aud equal to this MCP server and that a token whose\naudience is a different\
    \ resource is rejected. Where an OAuth trace is available, also\nconfirm that the resource parameter carrying this server's\
    \ canonical URI appears in\nboth the authorization and token requests, as a supplementary review. Run the\nfollowing command\
    \ to decode a token issued for this server and check its aud:\nTOKEN='<JWT_ISSUED_FOR_THIS_SERVER>'\nMCP_SERVER_AUDIENCE=\"\
    <MCP_SERVER_AUDIENCE>\"\nseg=$(printf '%s' \"$TOKEN\" | cut -d. -f2 | tr '_-' '/+')\npad=$(( (4 - ${#seg} % 4) % 4 ));\
    \ seg=\"$seg$(printf '=%.0s' $(seq 1 $pad))\"\nclaims=$(printf '%s' \"$seg\" | base64 -d 2>/dev/null)\n[ -z \"$claims\"\
    \ ] && { echo \"ERROR: could not decode token (opaque token? use AS\nintrospection)\"; exit 0; }\nprintf '%s' \"$claims\"\
    \ | jq empty 2>/dev/null || { echo \"ERROR: decoded payload is not\nJSON (opaque token? use AS introspection)\"; exit\
    \ 0; }\necho \"$claims\" | jq -e --arg aud \"$MCP_SERVER_AUDIENCE\" '\n (.aud | if type==\"array\" then . else [.] end)\
    \ as $a\n | ($a | index($aud)) != null' >/dev/null \\\n && echo \"PASS: token audience-bound to this MCP server\" \\\n\
    \ || echo \"FAIL: token audience does not include this MCP server\"\nRun the following command with a token issued for\
    \ a different resource and confirm the\nserver rejects it with 401:\nURL=\"https://<SERVER_URL>/mcp\"\nPROTO=\"2026-07-28\"\
    \nWRONG='<JWT_FOR_DIFFERENT_RESOURCE>'\ncode=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \"$URL\" -H 'Content-Type:\n\
    application/json' -H 'Accept: application/json, text/event-stream' -H \"MCP-ProtocolVersion: $PROTO\" -H \"Authorization:\
    \ Bearer $WRONG\" -H 'Mcp-Method: tools/list' -d\n\"{\\\"jsonrpc\\\":\\\"2.0\\\",\\\"id\\\":1,\\\"method\\\":\\\"tools/list\\\
    \",\\\"params\\\":{\\\"_meta\\\":{\\\"io.\nmodelcontextprotocol/protocolVersion\\\":\\\"$PROTO\\\",\\\"io.modelcontextprotocol/clientInf\n\
    o\\\":{\\\"name\\\":\\\"cis-benchmark-audit\\\",\\\"version\\\":\\\"1.0\\\"}}}}\")\ncase \"$code\" in\n 401) echo \"PASS:\
    \ wrong-audience token rejected with 401\" ;;\n 403) echo \"REVIEW: wrong-audience token returned 403, expected 401 for\
    \ a token not\nvalid for this resource, confirm this is a deliberate policy\" ;;\n 000) echo \"ERROR: server unreachable\
    \ (not a PASS)\" ;;\n 2*) echo \"FAIL: wrong-audience token accepted ($code)\" ;;\n *) echo \"REVIEW: returned $code\"\
    \ ;;\nesac\nThe system is compliant when a token issued for this server carries aud equal to this\nserver and a token\
    \ bound to a different resource is rejected with 401. Where a trace is\navailable, the resource parameter is present in\
    \ both OAuth exchanges.\n Page 107\nVerify each remote MCP server's discovery chain against the approved export. The\n\
    command below checks that a discovery path (the challenge, or the well-known subpath or root form) serves one consistent\
    \ Protected Resource Metadata document over\nTLS whose resource matches the canonical URI. Set ALLOW_PRIVATE to 1 only\
    \ for\ninternal or lab deployments whose discovery hosts are legitimately non-public, and\nleave it unset for public deployments\
    \ so a URL whose host is a private, loopback, linklocal, or other non-public address is refused as a possible SSRF target.\
    \ This refusal is a\nlexical check on the URL host and does not resolve DNS, so a hostname resolving to\nan internal address\
    \ is not caught. Run the following command, substituting the anglebracket placeholders:\n Page 111\nMCP_URL=\"<MCP_URL>\"\
    \nCANON=\"<CANONICAL_URI>\"\nALLOW_PRIVATE=\"${ALLOW_PRIVATE:-0}\"\nPROTO=\"2026-07-28\"\nhost_of() {\n printf '%s' \"\
    $1\" | sed -E 's#^[a-zA-Z]+://\\[([^]]+)\\].*#\\1#; t; s#^[a-zAZ]+://([^/@:]+).*#\\1#' | tr 'A-F' 'a-f'\n}\nis_private_host()\
    \ {\n case \"$1\" in\n localhost|localhost.*|*.internal|*.local) return 0 ;;\n 127.*|0.*|10.*|169.254.*|192.168.*) return\
    \ 0 ;;\n 172.1[6-9].*|172.2[0-9].*|172.3[0-1].*) return 0 ;;\n 100.6[4-9].*|100.[789][0-9].*|100.1[01][0-9].*|100.12[0-7].*)\
    \ return 0 ;;\n ::1|::|0:*) return 0 ;;\n ::ffff:*) return 0 ;;\n fc*:*|fd*:*) return 0 ;;\n fe8*:*|fe9*:*|fea*:*|feb*:*)\
    \ return 0 ;;\n esac\n return 1\n}\nguard() {\n gh=$(host_of \"$1\")\n if [ \"$ALLOW_PRIVATE\" != \"1\" ] && is_private_host\
    \ \"$gh\"; then\n echo \"FAIL: server-provided discovery URL resolves to a private, loopback, linklocal, or mapped host\
    \ ($gh), set ALLOW_PRIVATE=1 only for internal deployments\"\n exit 0\n fi\n}\ncase \"$MCP_URL\" in https://*) : ;; *)\
    \ echo \"FAIL: MCP endpoint is not served over TLS\n($MCP_URL)\"; exit 0 ;; esac\nORIGIN=$(printf '%s' \"$MCP_URL\" |\
    \ sed -E 's#^(https://[^/]+).*#\\1#')\nRPATH=$(printf '%s' \"$MCP_URL\" | sed -E 's#^https://[^/]+##')\nWK_SUB=\"$ORIGIN/.well-known/oauth-protected-resource$RPATH\"\
    \nWK_ROOT=\"$ORIGIN/.well-known/oauth-protected-resource\"\nbody=\"{\\\"jsonrpc\\\":\\\"2.0\\\",\\\"id\\\":1,\\\"method\\\
    \":\\\"tools/list\\\",\\\"params\\\":{\\\"_meta\\\":{\n\\\"io.modelcontextprotocol/protocolVersion\\\":\\\"$PROTO\\\"\
    }}}\"\nchal=$(curl -sS --connect-timeout 5 -m 10 -o /dev/null -D - -X POST \"$MCP_URL\" -H\n\"Content-Type: application/json\"\
    \ -H \"Accept: application/json, text/event-stream\" -H\n\"MCP-Protocol-Version: $PROTO\" -H \"Mcp-Method: tools/list\"\
    \ -d \"$body\" 2>/dev/null |\ntr -d '\\r' | sed -n 's/.*resource_metadata=\"\\([^\"]*\\)\".*/\\1/p')\nsub=$(curl -sS --connect-timeout\
    \ 5 -m 10 \"$WK_SUB\" 2>/dev/null)\nwkdoc=\"\"\nif printf '%s' \"$sub\" | jq -e . >/dev/null 2>&1; then\n wkdoc=\"$sub\"\
    \nelse\n root=$(curl -sS --connect-timeout 5 -m 10 \"$WK_ROOT\" 2>/dev/null)\n printf '%s' \"$root\" | jq -e . >/dev/null\
    \ 2>&1 && wkdoc=\"$root\"\nfi\nif [ -z \"$wkdoc\" ] && [ -z \"$chal\" ]; then\n Page 112\n echo \"ERROR: discovery unavailable,\
    \ no WWW-Authenticate challenge and neither wellknown protected-resource path returned JSON\"\n exit 0\nfi\nif [ -n \"\
    $chal\" ]; then\n guard \"$chal\"\n case \"$chal\" in https://*) : ;; *) echo \"FAIL: challenge-advertised metadata URL\
    \ is\nnot TLS ($chal)\"; exit 0 ;; esac\n chdoc=$(curl -sS --connect-timeout 5 -m 10 \"$chal\" 2>/dev/null)\n printf '%s'\
    \ \"$chdoc\" | jq -e . >/dev/null 2>&1 || { echo \"ERROR: challengeadvertised metadata at $chal unreachable or not JSON\"\
