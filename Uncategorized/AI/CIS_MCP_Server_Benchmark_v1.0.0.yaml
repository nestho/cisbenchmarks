- id: '6.1'
  title: Ensure model context is minimized and MIME handling is honored
  scoring: manual
  profile:
  - Level 1
  description: The server sends only the minimum context necessary for the model to complete the current operation. Where
    the server requests a model generation through sampling, that request travels inside an InputRequiredResult under the
    multi round-trip request pattern. The includeContext parameter defaults to none, with the thisServer and allServers values
    deprecated, so a compliant request does not pull in server or cross-server context unless the operator opts in. Content
    filters and size constraints are applied to resource content before it is placed in a sampling payload or forwarded directly
    to a model provider. Arbitrary or unvalidated bytes are not injected into text context, and where image or audio context
    is intentionally supported, it is validated and passed as the provider's typed image or audio representation (base64 data
    with a mimeType) rather than as text. Secrets, credentials, and other sensitive data are redacted or excluded before context
    is forwarded to the model. A maximum context payload size is defined and enforced at the server middleware layer, coordinated
    with recommendation 10.2. Because sampling is deprecated as of the 2026-07-28 revision, the same minimization and scrubbing
    apply to any context sent to a model provider through a direct integration.
  rationale: Oversized or unnecessary context increases the chance that secrets or sensitive data are forwarded to an external
    model API and raises cost and latency. Distinguishing binary from text prevents corrupt or wasteful payloads. Redaction
    before forwarding keeps credentials and PII out of the model context. Enforcing a maximum payload size bounds both the
    data-exposure and denial-of-service surface.
  impact: Context filtering and redaction add minor processing overhead. Defining and enforcing a maximum context payload
    size is one-time middleware configuration. Page 218
  references:
  - '1. MCP specification (Client Features / Sampling):'
  - https://modelcontextprotocol.io/specification/2026-07-28/client/sampling
  - '2. MCP specification (Deprecated Features):'
  - https://modelcontextprotocol.io/specification/2026-07-28/deprecated
  - https://modelcontextprotocol.io/specification/2026-07-28/server/resources
  - https://modelcontextprotocol.io/seps/2577-deprecate-roots-sampling-and-logging
  page_start: 218
  audit_raw: "Inspect model-context payloads, whether sent through sampling or forwarded directly to\na model provider, and\
    \ confirm each carries only the content needed for the operation,\ncontains no raw or unvalidated bytes in text fields,\
    \ and contains no credentials or\nsecrets. Set MAX_CONTEXT_BYTES to the configured maximum payload size, then run\nthe\
    \ following command, which reads each log line as JSON, selects the samplingpayload records, and fails any that exceed\
    \ the maximum:\nLOG=\"<MCP_AUDIT_LOG>\"\nMAX_CONTEXT_BYTES=\"<MAX_CONTEXT_BYTES>\"\nif [ ! -r \"$LOG\" ]; then\n echo\
    \ \"ERROR: audit log \\\"$LOG\\\" not found or not readable (set MCP_AUDIT_LOG)\"\nelse\n sizes=$(jq -rR '(fromjson? //\
    \ null) as $o | select($o != null and $o.event ==\n\"sampling_payload\") | ($o.payload_bytes // empty)' \"$LOG\" 2>/dev/null\
    \ | sort -nr)\n if [ -z \"$sizes\" ]; then\n echo \"REVIEW: no sampling_payload events in log (nothing to assess, or the\n\
    deployment integrates a model provider directly and the direct-provider path must be\ninspected instead)\"\n elif printf\
    \ '%s' \"$MAX_CONTEXT_BYTES\" | grep -q '<MAX_CONTEXT_BYTES>'; then\n echo \"sampling_payload sizes (bytes), largest first:\"\
    \n printf '%s\\n' \"$sizes\" | head\n echo \"REVIEW: set MAX_CONTEXT_BYTES to the configured maximum, then confirm no\n\
    record exceeds it and that content carries no secrets or raw binary\"\n else\n over=$(printf '%s\\n' \"$sizes\" | awk\
    \ -v m=\"$MAX_CONTEXT_BYTES\" '$1+0 > m+0')\n if [ -n \"$over\" ]; then\n echo \"FAIL: sampling_payload record(s) exceed\n\
    MAX_CONTEXT_BYTES=$MAX_CONTEXT_BYTES (bytes):\"\n printf '%s\\n' \"$over\" | head\n else\n echo \"PASS: all sampling_payload\
    \ records within\nMAX_CONTEXT_BYTES=$MAX_CONTEXT_BYTES (confirm by content review that none carry\nsecrets or raw binary)\"\
    \n fi\n fi\nfi\nThen confirm by content review that the sampled payloads include no secrets and no\nraw binary in text\
    \ fields. Where the deployment has migrated off deprecated sampling to\na direct model-provider integration, inspect that\
    \ provider telemetry rather than treating\nthe absence of sampling records as evidence of compliance. This Recommendation\
    \ is\ncompliant when model-context payloads carry only the content the operation needs, no\npayload exceeds the configured\
    \ maximum size, and content review confirms no secrets\nor raw binary in text fields, whether context is sent through\
    \ sampling or forwarded\ndirectly to a model provider.\n Page 219"
  remediation: 'Configure the server middleware to filter context to the minimum needed for the

    operation, and to scrub secrets and personally identifiable information before

    forwarding. Keep unvalidated bytes out of text context, and pass intentional image or

    audio content as the provider''s typed representation. Enforce a maximum context

    payload size, coordinated with the deployment''s request and response body-size limits.

    Because sampling is deprecated as of the 2026-07-28 revision, apply the same

    minimization and scrubbing to any context sent to a model provider through a direct

    integration. This is server middleware and configuration, so there is no portable

    command.'
  checks:
  - type: command
    command: elif printf '%s' "$MAX_CONTEXT_BYTES" | grep -q '<MAX_CONTEXT_BYTES>'; then
    expected: ''
    severity: medium
    info: 'Inspect model-context payloads, whether sent through sampling or forwarded directly to

      a model provider, and confirm each carries only the content needed for the operation,

      contains no raw or unvalidated bytes in text fields, and contains no credentials or

      secrets. Set MAX_CONTEXT_BYTES to the configured maximum payload size, then run

      the following command, which reads each log line as JSON, selec'
- id: '6.2'
  title: Ensure tokens and keys are protected in clients and servers
  scoring: scored
  profile:
  - Level 1
  description: All credentials (API tokens, OAuth client secrets, service-account keys) are stored in system keychains, managed
    secret stores, or KMS-backed stores. As a CIS hardening position, secret values are not embedded in deployed configuration
    or artifacts in any form, including encrypted, and are referenced from the managed store at runtime instead. Automated
    credential rotation is in place, with alerts for credentials approaching expiry.
  rationale: 'Credentials embedded in deployed configuration or artifacts are a leading cause of compromise: they propagate
    through backups and images and are a primary target of automated scanning by attackers. A managed secret store keeps secret
    material out of configuration, supports rotation, and centralizes access control.'
  impact: Migrating to a secret store is a moderate one-time effort. Ongoing, rotation adds little overhead and substantially
    reduces credential-compromise risk. Page 221
  references:
  - '1. MCP specification (Base Protocol / Authorization / Client Registration):'
  - https://modelcontextprotocol.io/specification/2026-0728/basic/authorization/client-registration
  - '2. MCP specification (security best practices, credential handling):'
  - https://modelcontextprotocol.io/docs/2026-0728/tutorials/security/security_best_practices
  - https://github.com/modelcontextprotocol/modelcontextprotocol/pull/2352
  page_start: 221
  audit_raw: "Scan the deployed configuration and installed artifacts for inline credentials, and confirm\nthat deployment\
    \ manifests reference secrets from a managed store rather than defining\nthem inline. Set DEPLOY to the directory holding\
    \ the deployed configuration and\ninstalled artifacts. Run the following command, which invokes the gitleaks secret\n\
    scanner, to detect embedded credentials in that directory:\nDEPLOY=\"${DEPLOY:-<MCP_DEPLOY_DIR>}\"\nif ! command -v gitleaks\
    \ >/dev/null 2>&1; then echo \"ERROR: gitleaks not installed\n(cannot scan)\"; exit 0; fi\nif [ ! -d \"$DEPLOY\" ]; then\
    \ echo \"ERROR: deployment directory \\\"$DEPLOY\\\" not found\n(set MCP_DEPLOY_DIR)\"; exit 0; fi\nGLOUT=$(mktemp)\n\
    gitleaks detect --no-banner --no-git --source \"$DEPLOY\" --redact >\"$GLOUT\" 2>&1\nrc=$?\nif [ \"$rc\" -eq 0 ]; then\n\
    \ echo \"PASS: no inline credentials detected in the deployed configuration and\nartifacts\"\nelif [ \"$rc\" -eq 1 ];\
    \ then\n echo \"FAIL: gitleaks reported potential inline credentials in the deployed files:\"\n tail -n 20 \"$GLOUT\"\n\
    else\n echo \"ERROR: gitleaks scan failed (exit $rc), cannot assess, inspect the scanner\ninstallation and flags\"\nfi\n\
    rm -f \"$GLOUT\"\nThen inspect deployment manifests to confirm secrets are referenced from a managed\nstore, not defined\
    \ inline. This Recommendation is compliant when the scan reports no\nfindings, the command prints PASS, and manifests\
    \ contain only secret references."
  remediation: 'Migrate all inline or embedded secrets to a managed secret store or system keychain,

    and update deployment configuration to reference them from the store at runtime rather

    than inline. This is a deployment and configuration change, and the exact store is

    environment-specific. Implement automated rotation with alerts for credentials

    approaching expiry. Rotate any secret that was previously embedded in deployed

    configuration or an artifact since it must be treated as compromised.'
  checks:
  - type: manual_review
    info: 'Scan the deployed configuration and installed artifacts for inline credentials, and confirm

      that deployment manifests reference secrets from a managed store rather than defining

      them inline. Set DEPLOY to the directory holding the deployed configuration and

      installed artifacts. Run the following command, which invokes the gitleaks secret

      scanner, to detect embedded credentials in that directory:

      DEPLOY="${DEPLOY:-<MCP_DEPLOY_DIR>}"

      if ! command -v gitleaks >/dev/null 2>&1; then echo "ERROR: gitl'
    severity: medium
- id: '6.3'
  title: Ensure outbound proxy and DNS controls are applied for resource fetchers
  scoring: manual
  profile:
  - Level 1
  description: All outbound network access from MCP server processes is forced through a configured egress proxy. DNS resolution
    is restricted to approved internal resolvers, and FQDN allowlists are enforced for all resource-retrieval operations.
    Direct outbound connections to arbitrary IP addresses, or to external hostnames not on the approved FQDN list, are blocked.
    All outbound connection attempts, including blocked ones, are logged as security events.
  rationale: An MCP server that fetches resources can be induced to connect to internal services or attacker-controlled hosts
    through SSRF, a malicious resource URI, or DNS rebinding. Forcing egress through a proxy with an FQDN allowlist and restricting
    DNS to approved resolvers bounds where the server can connect and provides a logging chokepoint. This is only effective
    if direct, non-proxied egress is actually blocked, not merely if a proxy is available. A test that only observes a failed
    direct connection cannot prove egress is bounded, because the destination may simply be unreachable. The audit therefore
    establishes reachability through the approved proxy first, then treats a failed direct attempt to the same destination
    as evidence that egress is enforced.
  impact: Routing egress through a proxy and restricting DNS adds configuration and a dependency on the proxy and resolvers.
    Page 224
  references:
  - 1. MCP specification (security best practices, SSRF, egress proxies, and DNS
  - '2. MCP specification (Server Features / Resources):'
  - https://modelcontextprotocol.io/specification/2026-07-28/server/resources
  page_start: 224
  audit_raw: "Confirm outbound connections are forced through the egress proxy and that a direct\nconnection bypassing the\
    \ proxy is blocked, then confirm DNS resolution uses approved\nresolvers. Set PROXY to the approved egress proxy and TEST_DEST\
    \ to a destination\nthat is reachable through that proxy and is not on any host-local allowlist, then run the\nfollowing\
    \ command. The command reaches the destination through the proxy as a\npositive control, then attempts the same destination\
    \ directly with no proxy. It reports\negress enforced only when the proxy path works and the direct path fails:\nPROXY=\"\
    <EGRESS_PROXY_URL>\"\nTEST_DEST=\"<REACHABLE_TEST_DESTINATION>\"\ncurl -sS -o /dev/null --max-time 8 --proxy \"$PROXY\"\
    \ \"$TEST_DEST\" >/dev/null 2>&1;\nvia_proxy_rc=$?\ncurl -sS -o /dev/null --max-time 8 --proxy \"\" \"$TEST_DEST\" >/dev/null\
    \ 2>&1;\ndirect_rc=$?\nif [ \"$direct_rc\" -eq 0 ]; then\n echo \"FAIL: direct outbound (proxy bypassed) reached the destination,\
    \ egress is not\nlocked down\"\nelif [ \"$via_proxy_rc\" -eq 0 ]; then\n echo \"PASS: direct outbound blocked and the\
    \ approved proxy path reached the\ndestination\"\nelse\n echo \"REVIEW: neither the proxy path nor the direct path reached\
    \ the destination,\negress control unverifiable (check the proxy and that the destination is reachable\nthrough it)\"\n\
    fi\nA REVIEW here means the test could not attribute the result, most often because the\ndestination is unreachable by\
    \ any path. Resolve it by choosing a destination that is\nreachable through the approved proxy, so the verdict is trustworthy.\
    \ Then confirm DNS\nresolution is restricted to approved internal resolvers, setting APPROVED_RESOLVERS to\nthe space-separated\
    \ list of approved resolver addresses. On a systemd-resolved host,\n/etc/resolv.conf carries only the local stub 127.0.0.53.\
    \ In that case the\ncommand reads the real upstream resolvers from resolvectl.\n Page 225\nRESOLV=\"${RESOLV:-/etc/resolv.conf}\"\
    \nRESOLVECTL=\"${RESOLVECTL:-resolvectl}\"\nAPPROVED=\"<APPROVED_RESOLVERS>\"\napproved_check() {\n set=$1\n if printf\
    \ '%s' \"$APPROVED\" | grep -q '<APPROVED_RESOLVERS>'; then\n echo \"configured resolvers: $set\"\n echo \"REVIEW: set\
    \ APPROVED_RESOLVERS, then confirm each resolver above is approved\"\n return\n fi\n bad=\"\"\n for n in $set; do\n case\
    \ \" $APPROVED \" in *\" $n \"*) ;; *) bad=\"$bad $n\" ;; esac\n done\n if [ -n \"$bad\" ]; then\n echo \"FAIL: non-approved\
    \ resolver(s):$bad\"\n else\n echo \"PASS: all resolvers approved ($set)\"\n fi\n}\nif [ ! -r \"$RESOLV\" ]; then\n echo\
    \ \"ERROR: $RESOLV not found or not readable\"\nelse\n ns=$(grep -E '^[[:space:]]*nameserver' \"$RESOLV\" | awk '{print\
