    command: malformed=$(grep -vE '^[A-Za-z_][A-Za-z0-9_]*$' "$ALLOW" | grep -v '^[[:space:]]*$' && leaked=$(printf '%s\n'
      "$vars" | grep -vxF -f "$ALLOW" || true) && elif printf '%s' "$deny" | grep -qE '^2'; then && elif printf '%s' "$allow"
      | grep -qE '^(4|5)'; then && elif printf '%s' "$deny" | grep -qE '^(400|403)'; then && n=$(printf '%s\n' "$renders"
      | grep -c .) && n=$(printf '%s\n' "$events" | grep -c .)
    expected: ''
    severity: medium
    info: 'Inspect the actual environment of a running stdio server subprocess and confirm it

      contains only the variables on that server''s documented allowlist, with no inherited

      sensitive variables. The allowlist file lists one approved variable name per line. Run the

