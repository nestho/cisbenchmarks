- id: '1.4'
  title: Ensure MCP client and server identity metadata is captured and validated against the asset inventory
  scoring: scored
  profile:
  - Level 1
  description: The self-asserted identity metadata that MCP clients and servers exchange is captured and validated against
    the identities and capability profiles in the enterprise MCP registry. Under the 2026-07-28 revision, a client identifies
    itself in _meta["io.modelcontextprotocol/clientInfo"] on each request and a server in _meta["io.modelcontextprotocol/serverInfo"]
    on each response. Both fields carry a name and a version, and both are optional in the schema, so an implementation configured
    not to send one is still conforming. The specification does not define how a receiver treats a malformed identity value,
    and handling varies by implementation. This Recommendation therefore never accepts a malformed value as an approved inventory
    identity and records it as a metadata-validation finding. Server capabilities and supported protocol versions are obtained
    separately from the server/discover result. The enterprise standard is that every approved client and server emits these
    fields, the capturing layer records them, and each captured name and version is cross-referenced against the registry.
    An identity or version not in the registry, or an advertised capability set that differs from the registered profile for
    that identity, raises an alert and is treated as unauthorized asset expansion until reconciled. These fields are self-reported
    and are not authenticated by the protocol. They are treated as an inventory signal rather than proof of identity, and
    tool invocation is not gated on them. Where a deployment refuses an unrecognized server, the refusal is bound to an authenticated
    property of the connection, such as the mutual TLS identity, the OAuth client or resource identity, or the pinned artifact
    hash under the supply-chain Recommendations, with the captured serverInfo recorded alongside as the correlation key. Page
    44
  rationale: An MCP deployment accumulates servers faster than any manual process tracks them, and a server that no one approved
    is indistinguishable from one that everyone forgot about. Identity metadata is the cheapest signal for telling the two
    apart, because supported client and server SDK versions commonly stamp it on every request and response unless configured
    otherwise, and the capturing layer needs no protocol change to record it. Without that capture there is no inventory of
    what is actually running, so a new or modified server arriving through supply-chain compromise, misconfiguration, or insider
    action operates undetected until someone audits by hand. The fields are self-reported and unverified, which sets the boundary
    of what this Recommendation claims. Cross-referencing them against the registry detects the unapproved, the stale, and
    the misconfigured, which is the large majority of real drift. It does not detect an adversary who forges the string, and
    treating it as though it did would substitute a detective control for a preventive one. The preventive control belongs
    on the authenticated identity of the channel. This Recommendation is the detective control that makes the inventory true,
    and the alert on an unregistered identity is what converts it from a log into a finding.
  impact: Recording identity on every request and response produces log volume proportional to traffic, so size retention
    or sample accordingly. Capture requires the server, host, or an application-layer proxy able to read the JSON body. Page
    45
  references:
  - '1. MCP specification (Key Changes, stateless core and per-request identity):'
  - https://modelcontextprotocol.io/specification/2026-07-28/changelog
  - 2. MCP specification (Schema Reference, ResultMetaObject and
  - https://modelcontextprotocol.io/specification/2026-07-28/schema
  - https://modelcontextprotocol.io/extensions/overview
  page_start: 44
  audit_raw: "Confirm the capturing layer records client and server identity, and cross-reference each\ncaptured identity\
    \ against the approved identities in the enterprise registry.\nSet the log-schema variables at the head of each script\
    \ to match the deployment: RESP\nand REQ select response and request records, ERR identifies an error response, and\n\
    SID and CID locate the server and client identity objects. Error responses are excluded\nfrom the identity count rather\
    \ than counted as failures since a JSON-RPC error has no\nresult to carry serverInfo. Client identity is counted over\
    \ requests and server\nidentity over responses. The comparison excludes the audit client's own identity by\nname.\nRun\
    \ the following script to confirm identity is recorded on every captured server\nresponse. It reads records as JSON documents\
    \ so it tolerates pretty-printed logs:\n Page 46\nLOG=\"<MCP_AUDIT_LOG>\"\nRESP='select((.direction? // \"\") == \"response\"\
    )'\nREQ='select((.direction? // \"\") == \"request\")'\nERR='((.error? != null) or ((.has_error? // false) == true))'\n\
    SID='(.result._meta[\"io.modelcontextprotocol/serverInfo\"]\n// ._meta[\"io.modelcontextprotocol/serverInfo\"])'\nCID='(._meta[\"\
    io.modelcontextprotocol/clientInfo\"]\n// .params._meta[\"io.modelcontextprotocol/clientInfo\"])'\nif [ ! -r \"$LOG\"\
    \ ]; then\n echo \"ERROR: audit log not readable at $LOG\"\nelse\n rtot=$(jq -s \"[.[] | $RESP] | length\" \"$LOG\" 2>/dev/null)\n\
    \ rerr=$(jq -s \"[.[] | $RESP | select($ERR)] | length\" \"$LOG\" 2>/dev/null)\n rok=$(jq -s \"[.[] | $RESP | select($ERR\
    \ | not)] | length\" \"$LOG\" 2>/dev/null)\n rid=$(jq -s \"[.[] | $RESP | select($ERR | not) | select($SID.name != null\
    \ and\n$SID.version != null)] | length\" \"$LOG\" 2>/dev/null)\n qtot=$(jq -s \"[.[] | $REQ] | length\" \"$LOG\" 2>/dev/null)\n\
    \ qid=$(jq -s \"[.[] | $REQ | select($CID.name != null and $CID.version != null)] |\nlength\" \"$LOG\" 2>/dev/null)\n\
    \ if ! [ \"$rtot\" -ge 0 ] 2>/dev/null || ! [ \"$qtot\" -ge 0 ] 2>/dev/null; then\n echo \"ERROR: audit log could not\
    \ be parsed as JSON records\"\n elif [ \"$qtot\" -eq 0 ]; then\n echo \"ERROR: no request records matched the selector,\
    \ client identity cannot be\nevaluated, confirm the log path and the selector\"\n elif [ \"$rtot\" -eq 0 ]; then\n echo\
    \ \"ERROR: no response records matched the selector, server identity cannot be\nevaluated, confirm the log path and the\
    \ selector\"\n elif [ \"$rok\" -eq 0 ]; then\n echo \"ERROR: every recorded response carried a protocol error, so there\
    \ is no\nsuccessful response to evaluate, widen the capture window\"\n else\n echo \"requests: $qtot, carrying clientInfo:\
    \ $qid\"\n echo \"responses: $rtot, of which protocol errors: $rerr (excluded)\"\n echo \"successful responses: $rok,\
    \ carrying serverInfo: $rid\"\n mc=$((qtot - qid))\n ms=$((rok - rid))\n if [ \"$mc\" -eq 0 ] && [ \"$ms\" -eq 0 ]; then\n\
    \ echo \"PASS: client identity is recorded on every captured request and server\nidentity on every captured successful\
    \ response\"\n elif [ \"$mc\" -gt 0 ] && [ \"$ms\" -gt 0 ]; then\n echo \"FAIL: $mc requests carry no client identity\
    \ and $ms successful responses carry\nno server identity\"\n elif [ \"$mc\" -gt 0 ]; then\n echo \"FAIL: $mc requests\
    \ carry no client identity\"\n else\n echo \"FAIL: $ms successful responses carry no server identity\"\n fi\n fi\nfi\n\
    \ Page 47\nMaintain the approved identities as two registry exports of name|version pairs, one\nper line, for servers\
    \ and for clients. Because each entry occupies one line delimited by\nthe pipe, a registered name or version cannot contain\
    \ the pipe delimiter, a carriage\nreturn, or a line break, and the script flags any observed identity containing the delimiter\n\
    for review.\nRun the following script to confirm every observed identity is registered on its own side:\n Page 48\nLOG=\"\
    <MCP_AUDIT_LOG>\"\nREG=\"<REGISTRY_DIR>/approved_identities.txt\"\nCREG=\"<REGISTRY_DIR>/approved_client_identities.txt\"\
    \nAUDIT_CLIENT=\"cis-benchmark-audit\"\nRESP='select((.direction? // \"\") == \"response\")'\nREQ='select((.direction?\
    \ // \"\") == \"request\")'\nSID='(.result._meta[\"io.modelcontextprotocol/serverInfo\"]\n// ._meta[\"io.modelcontextprotocol/serverInfo\"\
    ])'\nCID='(._meta[\"io.modelcontextprotocol/clientInfo\"]\n// .params._meta[\"io.modelcontextprotocol/clientInfo\"])'\n\
    WORK=$(mktemp -d)\nif [ ! -r \"$LOG\" ]; then\n echo \"ERROR: audit log not readable at $LOG\"\nelif [ ! -r \"$REG\" ];\
    \ then\n echo \"ERROR: server registry export not readable at $REG\"\nelif [ ! -r \"$CREG\" ]; then\n echo \"ERROR: client\
    \ registry export not readable at $CREG\"\nelif ! jq -r -s \"[.[] | $RESP | $SID | select(.name != null) |\n\\\"\\(.name)|\\\
    (.version)\\\"] | unique[]\" \"$LOG\" > \"$WORK/sseen\" 2>/dev/null; then\n echo \"ERROR: audit log could not be parsed\
    \ as JSON records\"\nelif ! jq -r -s --arg ac \"$AUDIT_CLIENT\" \"[.[] | $REQ | $CID | select(.name != null)\n| select(.name\
    \ != \\$ac) | \\\"\\(.name)|\\(.version)\\\"] | unique[]\" \"$LOG\" >\n\"$WORK/cseen\" 2>/dev/null; then\n echo \"ERROR:\
    \ audit log could not be parsed as JSON records\"\nelif [ ! -s \"$WORK/sseen\" ]; then\n echo \"ERROR: no server identities\
    \ present in the log, confirm the capture point and\nthe selector\"\nelif [ ! -s \"$WORK/cseen\" ]; then\n echo \"ERROR:\
    \ no client identities present in the log after excluding the auditor,\nconfirm the capture point and that the window\
    \ contains traffic from clients other\nthan the auditor\"\nelse\n PIPEQ='select(((.name | tostring) | contains(\"|\"))\
    \ or ((.version | tostring) |\ncontains(\"|\")))'\n jq -r -s \"[.[] | $RESP | $SID | select(.name != null) | $PIPEQ |\
    \ \\\"server \\(.name),\nversion \\(.version)\\\"] | unique[]\" \"$LOG\" > \"$WORK/sbad\" 2>/dev/null\n jq -r -s --arg\
    \ ac \"$AUDIT_CLIENT\" \"[.[] | $REQ | $CID | select(.name != null) |\nselect(.name != \\$ac) | $PIPEQ | \\\"client \\\
    (.name), version \\(.version)\\\"] |\nunique[]\" \"$LOG\" > \"$WORK/cbad\" 2>/dev/null\n LC_ALL=C sort -u \"$WORK/sseen\"\
    \ -o \"$WORK/sseen\"\n LC_ALL=C sort -u \"$WORK/cseen\" -o \"$WORK/cseen\"\n tr -d '\\r' < \"$REG\" | grep -v '^[[:space:]]*$'\
    \ | LC_ALL=C sort -u > \"$WORK/sregs\"\n tr -d '\\r' < \"$CREG\" | grep -v '^[[:space:]]*$' | LC_ALL=C sort -u > \"$WORK/cregs\"\
    \n us=$(LC_ALL=C comm -23 \"$WORK/sseen\" \"$WORK/sregs\")\n uc=$(LC_ALL=C comm -23 \"$WORK/cseen\" \"$WORK/cregs\")\n\
    \ as=$(LC_ALL=C comm -13 \"$WORK/sseen\" \"$WORK/sregs\")\n ac2=$(LC_ALL=C comm -13 \"$WORK/cseen\" \"$WORK/cregs\")\n\
    \ if [ -n \"$as\" ]; then printf '%s\\n' \"$as\" | sed 's/^/registered but not observed\n(server): /'; fi\n Page 49\n\
    \ if [ -n \"$ac2\" ]; then printf '%s\\n' \"$ac2\" | sed 's/^/registered but not observed\n(client): /'; fi\n if [ -n\
    \ \"$us\" ]; then printf '%s\\n' \"$us\" | sed 's/^/unregistered server: /'; fi\n if [ -n \"$uc\" ]; then printf '%s\\\
    n' \"$uc\" | sed 's/^/unregistered client: /'; fi\n if [ -n \"$us\" ] && [ -n \"$uc\" ]; then\n echo \"FAIL: client and\
    \ server identities were observed that are absent from the\nregistry exports\"\n elif [ -n \"$us\" ]; then\n echo \"FAIL:\
    \ server identities were observed that are absent from the registry\nexport\"\n elif [ -n \"$uc\" ]; then\n echo \"FAIL:\
    \ client identities were observed that are absent from the registry\nexport\"\n elif [ -n \"$as\" ] || [ -n \"$ac2\" ];\
    \ then\n echo \"REVIEW: every observed identity is registered, but registered identities were\nnot observed\"\n elif [\
    \ -s \"$WORK/sbad\" ] || [ -s \"$WORK/cbad\" ]; then\n cat \"$WORK/sbad\" \"$WORK/cbad\" | sed 's/^/contains the registry\
    \ delimiter: /'\n echo \"REVIEW: observed identities contain the registry delimiter and cannot be\nrepresented in the\
    \ name|version export, apply the registry naming policy or\ninvestigate the sender\"\n else\n echo \"PASS: every observed\
    \ client and server identity is present in the registry\nexports\"\n fi\nfi\nrm -rf \"$WORK\"\nAn observed client or server\
    \ identity absent from its export is unauthorized asset\nexpansion and is a FAIL. A registered identity not seen in the\
    \ log window is a REVIEW\nsince it may be a decommissioned deployment or a quiet window. Where both apply,\nFAIL takes\
    \ precedence. The system is compliant when client identity is recorded on\nevery captured request, server identity on\
    \ every captured successful response, and no\nunregistered identity appears.\n Page 50"
  remediation: "Configure the MCP server, the host, or an application-layer gateway able to read the\nJSON body to record\
    \ clientInfo from each request and serverInfo from each\nresponse into the audit log, with a correlation ID on each entry.\
    \ The identity travels in\nthe JSON body, not in an HTTP header, so a plain reverse proxy cannot capture it.\nConfigure\
    \ the approved clients and servers to emit these fields. Both are optional, and\nsupported Tier 1 SDKs commonly send them\
    \ unless configured otherwise, so confirm\nnothing has disabled them.\nExport the approved identities from the registry\
    \ to two newline-delimited files at the\npaths the Audit reads, one name|version pair per line, servers in one file and\
    \ clients\nin the other, using Unix line endings. Generate the export from the registry rather than\nby hand, and enforce\
    \ a registry naming policy that excludes the pipe character, carriage\nreturns, and line breaks so no identity can break\
    \ the one-pair-per-line format.\nRun the following script to create the export directory and confirm both exports are\
    \ well\nformed:\nREGDIR=\"<REGISTRY_DIR>\"\nREG=\"$REGDIR/approved_identities.txt\"\nCREG=\"$REGDIR/approved_client_identities.txt\"\
    \nmkdir -p \"$REGDIR\"\nmissing=\"\"\n[ -s \"$REG\" ] || missing=\"$missing $REG\"\n[ -s \"$CREG\" ] || missing=\"$missing\
    \ $CREG\"\nif [ -n \"$missing\" ]; then\n echo \"ERROR: no registry export at$missing, export the approved server and\
    \ client\nidentities from the enterprise MCP registry before running the audit\"\nelse\n sbad=$(tr -d '\\r' < \"$REG\"\
    \ | grep -vcE '^[^|]+\\|[^|]+$')\n cbad=$(tr -d '\\r' < \"$CREG\" | grep -vcE '^[^|]+\\|[^|]+$')\n if ! [ \"$sbad\" -ge\
    \ 0 ] 2>/dev/null || ! [ \"$cbad\" -ge 0 ] 2>/dev/null; then\n echo \"ERROR: registry exports could not be read under\
    \ $REGDIR\"\n elif [ \"$sbad\" -gt 0 ] || [ \"$cbad\" -gt 0 ]; then\n tr -d '\\r' < \"$REG\" | grep -nvE '^[^|]+\\|[^|]+$'\
    \ | sed 's/^/malformed server line\n/'\n tr -d '\\r' < \"$CREG\" | grep -nvE '^[^|]+\\|[^|]+$' | sed 's/^/malformed client\
    \ line\n/'\n echo \"FAIL: $((sbad + cbad)) lines in the registry exports are not in name|version\nform\"\n else\n echo\
    \ \"PASS: $(tr -d '\\r' < \"$REG\" | grep -c .) approved server and $(tr -d '\\r' <\n\"$CREG\" | grep -c .) approved client\
    \ identities recorded in name|version form\"\n fi\nfi\n Page 51\nConfigure the capturing layer to alert when an observed\
    \ identity or version is absent\nfrom the registry, or when an advertised capability set differs from the registered profile.\n\
    Treat an unreconciled alert as an open finding.\nThese fields are self-reported, and an adversary bypasses them by changing\
    \ a string,\nso do not block tool invocation on them. Where a deployment refuses an unrecognized\nserver, bind the refusal\
    \ to the authenticated channel identity under the authorization\nRecommendations or the pinned artifact hash under the\
    \ supply-chain\nRecommendations, using the captured identity as the correlation key."
  checks:
  - type: command
    command: 'tr -d ''\r'' < "$REG" | grep -v ''^[[:space:]]*$'' | LC_ALL=C sort -u > "$WORK/sregs" && tr -d ''\r'' < "$CREG"
      | grep -v ''^[[:space:]]*$'' | LC_ALL=C sort -u > "$WORK/cregs" && cat "$WORK/sbad" "$WORK/cbad" | sed ''s/^/contains
      the registry delimiter: /'''
    expected: ''
    severity: medium
    info: 'Confirm the capturing layer records client and server identity, and cross-reference each

      captured identity against the approved identities in the enterprise registry.

      Set the log-schema variables at the head of each script to match the deployment: RESP

      and REQ select response and request records, ERR identifies an error response, and

      SID and CID locate the server and client identity objects. Error'
- id: '2.1'
  title: Ensure stdio is preferred for local, single-user servers
  scoring: manual
  profile:
  - Level 1
  description: The stdio transport is used for local development environments and single-user tool deployments, and Streamable
    HTTP is reserved for servers that must serve remote clients or multiple concurrent users. Each server's transport choice
    is inventoried, and a documented operational reason is kept on file for any server on a network-exposed transport where
    stdio would suffice. When a local stdio server is later promoted to serve multiple users, moving to Streamable HTTP means
    it must then meet the transportsecurity requirements, TLS and Origin validation, and the applicable client-configuration
    requirements.
  rationale: The stdio transport confines all communication to local inter-process pipes, eliminating the network attack surface
    for servers that do not require remote access. A stdio server cannot be reached by external attackers over the network,
    cannot be subject to DNS rebinding, and requires no TLS, certificate management, or Origin validation. Using a network
    transport where stdio suffices exposes the server to all of these attack classes for no operational benefit. This recommendation
    makes stdio the enforced organizational preference for local, single-user servers.
  impact: There is no impact for a server used only locally. For a server that was networkreachable without needing to be,
    moving to stdio removes that exposure at no functional cost. Page 55
  references:
  - '1. MCP specification (Base Protocol / Transports / Overview):'
  - https://modelcontextprotocol.io/specification/2026-07-28/basic/transports
  - '2. MCP specification (Base Protocol / Transports / stdio):'
  - https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/stdio
  page_start: 55
  audit_raw: "Inventory each MCP service unit and record whether the server process owns a TCP\nlistener. A listener does\
    \ not by itself prove Streamable HTTP, and its absence does not\nprove stdio, so determine the transport from the unit's\
    \ ExecStart, the MCP client\nconfiguration, and the server configuration. Run the following command:\nfor unit in $(systemctl\
    \ list-units --type=service --no-legend 'mcp*' | awk '{print\n$1}'); do\n pid=$(systemctl show -p MainPID --value \"$unit\"\
    \ 2>/dev/null)\n if [ -n \"$pid\" ] && [ \"$pid\" -gt 0 ] 2>/dev/null \\\n && ss -ltnp 2>/dev/null | grep -q \"pid=$pid,\"\
    ; then\n echo \"NETWORK-LISTENER $unit (TCP listener detected, determine whether it carries\nMCP)\"\n else\n echo \"NO-PROCESS-LISTENER\
    \ $unit (no TCP listener owned by this process, inspect the\nconfigured MCP transport)\"\n fi\ndone\nA local, single-user\
    \ server carrying MCP over a network listener is a finding. The system\nis compliant when every local, single-user server\
    \ is confirmed to use stdio, and any\nserver exposing a network listener either does not carry MCP over it or genuinely\n\
    serves multiple users or remote clients.\n Page 56"
  remediation: "Reconfigure the server to use stdio and restart it. Then run the following command to\nconfirm the server\
    \ process owns no TCP listener, substituting the service unit name.\nThe check reports ERROR and stops if the service\
    \ did not restart, is not active, or has no\nactive MainPID:\nMCP_UNIT=\"${MCP_UNIT:-<MCP_UNIT>}\"\nsudo systemctl restart\
    \ \"$MCP_UNIT\" || {\n echo \"ERROR: service restart failed for $MCP_UNIT\"\n exit 1\n}\nif ! systemctl is-active --quiet\
    \ \"$MCP_UNIT\"; then\n echo \"ERROR: $MCP_UNIT is not active after restart\"\n exit 1\nfi\npid=$(systemctl show -p MainPID\
    \ --value \"$MCP_UNIT\" 2>/dev/null)\nif [ -z \"$pid\" ] || [ \"$pid\" -le 0 ] 2>/dev/null; then\n echo \"ERROR: $MCP_UNIT\
    \ has no active MainPID, cannot attribute the listener check\"\n exit 1\nfi\nif ss -ltnp 2>/dev/null | grep -q \"pid=$pid,\"\
    ; then\n echo \"FAIL: a TCP listener is owned by the MCP server process\"\nelse\n echo \"PASS: no TCP listener is owned\
    \ by the MCP server process\"\nfi\nA PASS confirms no TCP listener is owned by the MCP server process. It does not by\n\
    itself prove the transport is stdio, which the manual assessment confirms from the\nserver configuration."
  checks:
  - type: command
    command: '&& ss -ltnp 2>/dev/null | grep -q "pid=$pid,"; then'
    expected: ''
    severity: medium
    info: 'Inventory each MCP service unit and record whether the server process owns a TCP

      listener. A listener does not by itself prove Streamable HTTP, and its absence does not

      prove stdio, so determine the transport from the unit''s ExecStart, the MCP client

      configuration, and the server configuration. Run the following command:

      for unit in $(systemctl list-units --type=service --no-legend ''mcp*'' | awk ''{'
- id: '2.2'
  title: Ensure TLS is required for HTTP and plaintext is disallowed
  scoring: scored
  profile:
  - Level 1
  description: MCP Streamable HTTP servers that carry sensitive data are expected to be deployed over a secure transport.
    The MCP specification requires Origin validation and recommends authentication for HTTP deployments, but it does not prescribe
    a minimum TLS protocol revision. TLS 1.2 or higher is the baseline established here, consistent with current enterprise
    TLS configuration guidance. A server that serves plaintext HTTP, negotiates a legacy TLS version, or presents an expired
    certificate does not meet this baseline.
  rationale: Transmitting MCP messages, OAuth tokens, and tool-call payloads over unencrypted HTTP exposes all of it to interception.
    An attacker positioned on the network can read or modify every message. Authorization tokens captured from plaintext can
    then be replayed to invoke tools as the victim. TLS is the baseline defense against both. Permitting TLS 1.0 or 1.1 reopens
    known transport weaknesses that TLS 1.2 closes.
  impact: Certificate expiry is the main operational risk, mitigated by automated renewal. Clients pinned to TLS 1.0 or 1.1
    fail to connect once weak versions are refused and must be updated. Page 59
  references:
  - 1. MCP specification (Base Protocol / Transports / Streamable HTTP, security and
  - 2. NIST SP 800-52 Revision 2, Guidelines for the Selection, Configuration, and Use
  - https://csrc.nist.gov/pubs/sp/800/52/r2/final
  page_start: 59
  audit_raw: "Verify that the plaintext HTTP port is not served or redirects to HTTPS, that legacy TLS\nversions are refused\
    \ while TLS 1.2 or 1.3 is negotiated, and that the served certificate is\nwithin its validity period. Substitute the plaintext\
    \ URL, the TLS endpoint URL, and the\nTLS host, port, and SNI name. Because a refused plaintext port on a dead deployment\n\
    proves nothing, the probe first confirms the TLS endpoint answers. Run the following\ncommand to confirm plaintext behavior:\n\
    HTTP_URL=\"${HTTP_URL:-<PLAINTEXT_HTTP_URL>}\"\nTLS_URL=\"${TLS_URL:-<TLS_ENDPOINT_URL>}\"\ncurl -sk -o /dev/null --connect-timeout\
    \ 5 --max-time 15 \"$TLS_URL\" 2>/dev/null\nTRC=$?\nif [ \"$TRC\" -eq 6 ] || [ \"$TRC\" -eq 7 ] || [ \"$TRC\" -eq 28 ];\
    \ then\n echo \"ERROR: the TLS endpoint is unreachable (curl exit $TRC), so plaintext\nbehavior is not attributable to\
    \ a served deployment\"\nelse\nR=$(curl -sS -o /dev/null --connect-timeout 5 --max-time 15 -w '%{http_code}'\n\"$HTTP_URL\"\
    \ 2>/dev/null)\nRC=$?\nT=$(curl -sS -o /dev/null --connect-timeout 5 --max-time 15 -w '%{redirect_url}'\n\"$HTTP_URL\"\
    \ 2>/dev/null)\nif [ \"$RC\" -eq 7 ] || [ -z \"$R\" ] || [ \"$R\" = \"000\" ]; then\n echo \"plaintext probe: connection\
    \ refused or no response (curl rc=$RC)\"\n echo \"PASS: the plaintext HTTP port is not served while the TLS endpoint answers\"\
    \nelse\n echo \"plaintext probe: HTTP $R redirect_target=${T:-none}\"\n case \"$R\" in\n 301|302|307|308)\n case \"$T\"\
    \ in\n https://*) echo \"PASS: plaintext HTTP redirects to an HTTPS target ($R)\" ;;\n *) echo \"FAIL: plaintext HTTP\
    \ redirects to a non-HTTPS target ($R to ${T:-an\nempty target})\" ;;\n esac ;;\n 200) echo \"FAIL: plaintext HTTP is\
    \ served with a 200 response\" ;;\n 426) echo \"PASS: plaintext HTTP requires upgrade to TLS (426)\" ;;\n *) echo \"REVIEW:\
    \ plaintext HTTP returned $R, inspect whether the endpoint serves\ncleartext content before concluding\" ;;\n esac\nfi\n\
    fi\nRun the following command to confirm legacy TLS versions are refused. Because a\ndefault modern client cannot offer\
    \ TLS 1.0 or 1.1 at all, the legacy offers use the\nOpenSSL security-level opt-in:\n Page 60\nHOST=\"${HOST:-<TLS_HOST>}\"\
    \nPORT=\"${PORT:-<TLS_PORT>}\"\nSNI=\"${SNI:-<TLS_SNI>}\"\nif ! echo | timeout 10 openssl s_client -connect \"$HOST:$PORT\"\
    \ -servername\n\"$SNI\" >/dev/null 2>&1; then\n echo \"ERROR: no TLS handshake possible with $HOST:$PORT, endpoint unreachable\
    \ or\nnot serving TLS\"\nelse\nFAILN=0; ERRN=0\nfor ver in tls1 tls1_1; do\n if ! echo | timeout 10 openssl s_client -connect\
    \ \"$HOST:$PORT\" -servername \"$SNI\" -\n\"$ver\" -cipher DEFAULT@SECLEVEL=0 >/dev/null 2>/tmp/cis22_cap.$$; then\n if\
    \ grep -qi 'no protocols available\\|unknown option\\|unsupported protocol'\n/tmp/cis22_cap.$$; then\n echo \"$ver: the\
    \ auditing openssl cannot offer this version even at security\nlevel 0, so a refusal here is not attributable to the server\"\
    \n ERRN=$((ERRN+1))\n else\n echo \"$ver: refused by the server\"\n fi\n else\n echo \"$ver: NEGOTIATED (the server accepted\
    \ a weak TLS version)\"\n FAILN=$((FAILN+1))\n fi\ndone\nrm -f /tmp/cis22_cap.$$\necho | timeout 10 openssl s_client -connect\
    \ \"$HOST:$PORT\" -servername \"$SNI\" -\ntls1_2 >/dev/null 2>&1 && T12=ok || T12=no\necho | timeout 10 openssl s_client\
    \ -connect \"$HOST:$PORT\" -servername \"$SNI\" -\ntls1_3 >/dev/null 2>&1 && T13=ok || T13=no\necho \"tls1_2=$T12 tls1_3=$T13\"\
    \nif [ \"$FAILN\" -gt 0 ]; then\n echo \"FAIL: a legacy TLS version was negotiated by the server\"\nelif [ \"$ERRN\" -gt\
    \ 0 ]; then\n echo \"ERROR: the auditing host cannot offer one or more legacy versions, run from a\nhost whose openssl\
    \ can offer TLS 1.0 and 1.1 or the negative test proves nothing\"\nelif [ \"$T12\" = \"ok\" ] || [ \"$T13\" = \"ok\" ];\
    \ then\n echo \"PASS: legacy TLS versions are refused and TLS 1.2 or 1.3 is negotiated\"\nelse\n echo \"REVIEW: legacy\
    \ TLS refused but neither TLS 1.2 nor 1.3 negotiated, inspect\nthe endpoint's protocol configuration before concluding\"\
    \nfi\nfi\nRun the following command to confirm the served certificate is currently valid:\n Page 61\nHOST=\"${HOST:-<TLS_HOST>}\"\
    \nPORT=\"${PORT:-<TLS_PORT>}\"\nSNI=\"${SNI:-<TLS_SNI>}\"\nPEM=$(echo | timeout 10 openssl s_client -connect \"$HOST:$PORT\"\
    \ -servername \"$SNI\"\n2>/dev/null | openssl x509 2>/dev/null)\nif [ -z \"$PEM\" ]; then\n echo \"ERROR: could not retrieve\
    \ a certificate from $HOST:$PORT, confirm the endpoint\nis reachable and terminates TLS\"\nelse\n DATES=$(printf '%s'\
    \ \"$PEM\" | openssl x509 -noout -subject -issuer -dates\n2>/dev/null)\n echo \"$DATES\"\n if printf '%s' \"$PEM\" | openssl\
    \ x509 -noout -checkend 0 >/dev/null 2>&1; then\n echo \"PASS: the certificate is currently valid\"\n else\n echo \"FAIL:\
    \ the certificate is expired or not yet valid\"\n fi\nfi\nThe system is compliant when the plaintext, protocol, and certificate\
    \ probes all print\nPASS. An ERROR means the evidence is not attributable, usually an unreachable\nendpoint or an auditor\
    \ host whose openssl cannot offer legacy versions."
  remediation: "Terminate TLS in front of the MCP server and redirect or refuse plaintext. The following\nnginx example defines\
    \ the upstream, redirects port 80 to HTTPS, restricts protocols to\nTLS 1.2 and 1.3, and proxies the MCP path. Substitute\
    \ the upstream address, the\nserver name, and the certificate paths:\nupstream mcp_upstream {\n server <MCP_UPSTREAM_ADDR>;\n\
    }\nserver {\n listen 80;\n server_name <MCP_SERVER_NAME>;\n return 308 https://$host$request_uri;\n}\nserver {\n listen\
    \ 443 ssl;\n server_name <MCP_SERVER_NAME>;\n ssl_protocols TLSv1.2 TLSv1.3;\n ssl_ciphers HIGH:!aNULL:!MD5;\n ssl_certificate\
    \ <TLS_CERTIFICATE_PATH>;\n ssl_certificate_key <TLS_CERTIFICATE_KEY_PATH>;\n location /mcp { proxy_pass http://mcp_upstream;\
    \ }\n}\nAfter applying the configuration, run the Audit to confirm all three probes print PASS.\n Page 62"
  checks:
  - type: manual_review
    info: 'Verify that the plaintext HTTP port is not served or redirects to HTTPS, that legacy TLS

      versions are refused while TLS 1.2 or 1.3 is negotiated, and that the served certificate is

      within its validity period. Substitute the plaintext URL, the TLS endpoint URL, and the

      TLS host, port, and SNI name. Because a refused plaintext port on a dead deployment

      proves nothing, the probe first confirms the TLS endpoint answers. Run the following

      command to confirm plaintext behavior:

      HTTP_URL="${HTTP_URL:-<'
    severity: medium
- id: '2.3'
  title: Ensure authentication propagates through proxies to requestscoped SSE responses
  scoring: manual
  profile:
  - Level 2
  description: Under the 2026-07-28 revision, each JSON-RPC request on the Streamable HTTP transport is sent as its own HTTP
    POST, and the server answers with either a single JSON response or a request-scoped Server-Sent Events stream that carries
    any request-related notifications and then the final response. There is no standalone GET stream and no Last-Event-ID
    resumption. A request-scoped SSE stream is not resumable, so closing or dropping it cancels that request. If the client
    retries, the retry is a new HTTP POST authenticated independently. When the MCP server is reached through one or more
    proxies, every hop preserves the authentication requirement, so an unauthenticated request cannot reach a streamed response.
  rationale: Misconfigured gateways can strip or cache credentials, causing either an authentication failure or credential
    leakage. A stripped credential is an availability failure, the request is rejected. A cached, logged, or forwarded credential
    is the security failure, because a token exposed at an intermediary can be captured and replayed to act as the user. The
    risk is greatest in gateway-mediated deployments with multiple proxy hops, especially where a proxy terminates TLS and
    re-encrypts to the backend, where header-stripping and header-logging bugs commonly appear on the inner hop.
  impact: Meeting this requirement may need gateway configuration changes, or pinning the proxy and client to versions that
    handle streaming authentication correctly. The cost is minimal where authentication already terminates at a conformant
    gateway. Page 64
  references:
  - 1. MCP specification (Base Protocol / Transports / Streamable HTTP, receiving
  - https://modelcontextprotocol.io/specification/2026-0728/basic/transports/streamable-http
  - 2. MCP specification (Base Protocol / Message Patterns / Multi Round-Trip
  page_start: 64
  audit_raw: "Send a tools/call request to the endpoint that returns a request-scoped SSE\nstream, through the same proxy\
    \ path production clients use, once without a credential\nand once with a valid one. Confirm the unauthenticated request\
    \ is rejected, the\nauthenticated request is accepted, and the authenticated response is an SSE stream.\nSubstitute the\
    \ streaming endpoint URL, the approved protocol version, a safe streaming\ntool and its arguments, and a valid bearer\
    \ token:\n Page 65\nURL=\"<STREAMING_ENDPOINT_URL>\"\nVER=\"<APPROVED_PROTOCOL_VERSION>\"\nTOOL=\"<SAFE_STREAMING_TOOL>\"\
    \nARGS='<SAFE_STREAMING_TOOL_ARGS_JSON>'\nTOKEN=\"<VALID_BEARER_TOKEN>\"\nBODY=$(jq -nc --arg v \"$VER\" --arg t \"$TOOL\"\
    \ --argjson a \"$ARGS\"\n'{jsonrpc:\"2.0\",id:31,method:\"tools/call\",params:{name:$t,arguments:$a,_meta:{\"io.mod\n\
    elcontextprotocol/protocolVersion\":$v,\"io.modelcontextprotocol/clientInfo\":{name:\"cis\n-benchmark-audit\",version:\"\
    1.0\"},\"io.modelcontextprotocol/clientCapabilities\":{}}}}'\n2>/dev/null)\nNAME_HDR=$TOOL\ncase $TOOL in *[!-A-Za-z0-9._~]*|\"\
    \") NAME_HDR=\"=?base64?$(printf '%s' \"$TOOL\" |\nbase64 | tr -d '\\r\\n')?=\" ;; esac\nif [ -z \"$BODY\" ]; then\n echo\
    \ \"ERROR: probe build failed, check that ARGS is valid JSON\"\nelse\n NO=$(curl -sS -o /dev/null --connect-timeout 5\
    \ --max-time 20 -w '%{http_code}' -X\nPOST \"$URL\" -H 'Accept: application/json, text/event-stream' -H 'Content-Type:\n\
    application/json' -H \"MCP-Protocol-Version: $VER\" -H 'Mcp-Method: tools/call' -H\n\"Mcp-Name: $NAME_HDR\" --data-binary\
    \ \"$BODY\" 2>/dev/null)\n YES_HDRS=$(curl -sS -D - -o /dev/null --connect-timeout 5 --max-time 20 -X POST\n\"$URL\" -H\
    \ 'Accept: application/json, text/event-stream' -H 'Content-Type:\napplication/json' -H \"MCP-Protocol-Version: $VER\"\
    \ -H 'Mcp-Method: tools/call' -H\n\"Mcp-Name: $NAME_HDR\" -H \"Authorization: Bearer $TOKEN\" --data-binary \"$BODY\"\n\
    2>/dev/null)\n YES=$(printf '%s' \"$YES_HDRS\" | awk 'NR==1{print $2}')\n YES_CT=$(printf '%s\\n' \"$YES_HDRS\" | tr -d\
    \ '\\r' | awk -F': ' 'tolower($1)==\"contenttype\"{print tolower($2)}')\n echo \"no_auth=$NO with_auth=$YES with_auth_content_type=${YES_CT:-none}\"\
    \n if [ \"$NO\" = \"000\" ] || [ -z \"$YES\" ]; then\n echo \"ERROR: endpoint unreachable or timed out, the credential\
    \ path could not be\nexercised\"\n else\n case \"$NO\" in\n 401|403)\n case \"$YES\" in\n 2*)\n case \"$YES_CT\" in\n\
    \ *text/event-stream*) echo \"PASS: authentication is enforced before a requestscoped SSE stream is established, and enforcement\
    \ holds across every proxy hop on the\npath\" ;;\n *) echo \"REVIEW: authentication is enforced and the authenticated\
    \ request\nsucceeded ($YES), but the response was $YES_CT rather than an SSE stream, so the\nserver chose a non-streamed\
    \ response and the SSE-specific assertion could not be\nexercised, re-run against a tool or condition that yields a streamed\
    \ response\" ;;\n esac ;;\n 401|403) echo \"REVIEW: the valid credential was also rejected ($YES), confirm\nthe token\
    \ and that it survives every proxy hop to the enforcement point\" ;;\n *) echo \"REVIEW: the unauthenticated request was\
    \ rejected but the authenticated\nrequest returned $YES, inspect the proxy path before concluding\" ;;\n Page 66\n esac\
    \ ;;\n 2*) echo \"FAIL: an unauthenticated request was accepted, authentication is not\nenforced before the response is\
    \ established\" ;;\n *) echo \"REVIEW: the unauthenticated request returned $NO, expected 401 or 403,\ninspect before\
    \ concluding\" ;;\n esac\n fi\nfi\nA PASS requires the unauthenticated request rejected with 401 or 403, the\nauthenticated\
    \ request accepted with 2xx, and the authenticated response carrying\nContent-Type: text/event-stream. A 2xx that is not\
    \ an SSE stream is a\nREVIEW, so re-run against a tool that yields a streamed response. An accepted\nunauthenticated request\
    \ is a FAIL. An unreachable endpoint is ERROR."
  remediation: 'Configure each proxy hop to forward the Authorization header to the upstream for

    both the initial stream and any reconnect, and to pass the SSE response through

    without buffering so the stream is not held or broken. Because a reconnect is a new

    POST, the same rule covers it, and there is no separate resumption path. The following

    nginx example is illustrative. Other proxies use their own header-forwarding directives:

    proxy_set_header Authorization $http_authorization;

    proxy_pass_request_headers on;

    proxy_buffering off;

    proxy_read_timeout 3600s;

    Pin proxy and client or server versions known to handle streaming authentication

    correctly, and re-run the Audit after any proxy upgrade.'
  checks:
  - type: manual_review
    info: "Send a tools/call request to the endpoint that returns a request-scoped SSE\nstream, through the same proxy path\
