    \ .)\n[ \"$total\" -gt 0 ] || { echo \"REVIEW: no tool consent or allowlist records found\n(control not evidenced)\";\
    \ exit 0; }\nprintf '%s\\n' \"$recs\" | jq -e . >/dev/null 2>&1 || { echo \"ERROR: audit log contains\nunparseable records\
    \ (cannot verify)\"; exit 0; }\nbad=$(printf '%s\\n' \"$recs\" | jq -c '\n select(\n (.tool==null or .tool==\"\") or\n\
    \ (.manifest_shown!=true) or\n (((.decision//\"\")|test(\"^(user_approved|user_denied|allowlist_match)$\"))|not) or\n\
    \ (((.decision//\"\")|test(\"^user_\")) and (.decision_source!=\"user\")) or\n ((.decision//\"\")==\"allowlist_match\"\
    \ and ((.allowlist_ref//\"\")==\"\"))\n )')\nif [ -n \"$bad\" ]; then echo \"FAIL: tool records without the manifest shown,\
    \ or with a\ndefault or automatic grant not backed by an explicit user decision or an approved\nallowlist match\"; exit\
