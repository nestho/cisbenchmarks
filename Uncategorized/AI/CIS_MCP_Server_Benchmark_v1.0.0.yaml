- id: 5.2.1
  title: Ensure listChanged notifications are rate-limited to prevent client flooding
  scoring: scored
  profile:
  - Level 2
  description: The server applies rate limiting or debouncing per notification type to list_changed notifications and other
    server-to-client event emissions, to prevent client floods and denial-of-service conditions. Under the 2026-07-28 revision,
    these notifications flow on the subscriptions/listen stream to clients that opted into the corresponding type through
    toolsListChanged, promptsListChanged, or resourcesListChanged. Each type is an independent subscription, so the throttle
    applies per type on that stream. The server enforces a minimum interval between two successive list_changed notifications
    of the same type, and batches or applies cooldown logic to high-frequency change events. The server logs the rate of its
    notification emissions so anomalous spikes can be detected.
  rationale: A server that emits list_changed notifications without throttling can flood a client that has opened a subscriptions/listen
    stream and opted into that type, causing denial-of-service or forcing repeated re-fetches of capability lists. More important
    for security, rapid toolsListChanged emission accelerates the shadow-tool injection attack that Recommendation 1.3 addresses.
    A server that can fire many toolsListChanged events quickly can introduce newly advertised tools faster than re-validation
    and quarantine can review them. Throttling per type bounds the emission rate, which both prevents the flood and gives
    detection and re-validation more time to catch unauthorized capability expansion. Per-server emission logging lets a monitor
    flag a server whose emission rate is abnormal, which can indicate compromise or misconfiguration.
  impact: Throttling list_changed notifications may slightly delay a client's awareness of new capabilities when changes occur
    in rapid succession. This tradeoff is acceptable because the goal is stability rather than maximum notification throughput.
    Under the 2026-07-28 revision, the downside is smaller still, because list results carry ttlMs and cacheScope, so a client
    re-fetches the list once its cached copy expires, regardless of whether a list_changed notification arrived. Page 184
  references:
  - '1. MCP specification (Base Protocol / Message Patterns / Subscriptions):'
  - https://modelcontextprotocol.io/specification/2026-0728/basic/patterns/subscriptions
  - '2. MCP specification (Key Changes, subscriptions/listen replaces the GET stream):'
  - https://modelcontextprotocol.io/specification/2026-07-28/changelog
  - https://modelcontextprotocol.io/specification/2026-07-28/server/resources
  page_start: 184
  audit_raw: "Confirm the server does not emit two successive list_changed notifications of the\nsame type within a configured\
    \ minimum interval. Run the following command,\nsubstituting the deployment's audit log and the minimum interval in seconds:\n\
    LOG=\"<MCP_AUDIT_LOG>\"\nMIN_INTERVAL=\"<MIN_INTERVAL_SECONDS>\"\n[ -f \"$LOG\" ] || { echo \"ERROR: audit log not found\
    \ at $LOG\"; exit 0; }\npairs=$(grep -E '\"method\":\"notifications/(tools|resources|prompts)/list_changed\"'\n\"$LOG\"\
    \ | while IFS= read -r ln; do\n m=$(printf '%s' \"$ln\" | grep -oE\n'notifications/(tools|resources|prompts)/list_changed'\
    \ | head -n1)\n t=$(printf '%s' \"$ln\" | grep -oE '\"timestamp\":\"[^\"]+\"' | head -n1 | sed\n's/\"timestamp\":\"//;\
    \ s/\"$//')\n [ -n \"$m\" ] && [ -n \"$t\" ] && printf '%s\\t%s\\n' \"$m\" \"$t\"\ndone)\n[ -n \"$pairs\" ] || { echo\
    \ \"ERROR: no listChanged notifications with timestamps in\n$LOG\"; exit 0; }\nassessed=0; fail=0; worst=\"\"; worst_type=\"\
    \"\nfor type in notifications/tools/list_changed notifications/resources/list_changed\nnotifications/prompts/list_changed;\
    \ do\n epochs=$(printf '%s\\n' \"$pairs\" | awk -F'\\t' -v ty=\"$type\" '$1==ty{print $2}' |\nwhile IFS= read -r t; do\
    \ date -d \"$t\" +%s 2>/dev/null; done | sort -n | sed '/^$/d')\n cnt=$(printf '%s\\n' \"$epochs\" | sed '/^$/d' | wc\
    \ -l | tr -d ' ')\n if [ \"$cnt\" -lt 2 ]; then\n echo \"detail: $type had $cnt emission(s), insufficient to assess an\
    \ interval for\nthis type\"\n continue\n fi\n assessed=$((assessed+1))\n mn=$(printf '%s\\n' \"$epochs\" | awk 'NR>1{d=$1-p;\
    \ if(m==\"\"||d<m)m=d} {p=$1} END{print\nm}')\n echo \"detail: $type minimum interval ${mn}s across $cnt emissions\"\n\
    \ if [ \"$mn\" -lt \"$MIN_INTERVAL\" ]; then\n fail=$((fail+1))\n if [ -z \"$worst\" ] || [ \"$mn\" -lt \"$worst\" ];\
    \ then worst=\"$mn\"; worst_type=\"$type\";\nfi\n fi\ndone\nif [ \"$assessed\" -eq 0 ]; then\n echo \"ERROR: no notification\
    \ type emitted twice in the log window, cannot assess a\nsame-type emission rate\"\nelif [ \"$fail\" -gt 0 ]; then\n echo\
    \ \"FAIL: $worst_type emitted ${worst}s apart, below the ${MIN_INTERVAL}s minimum\ninterval for a single notification\
    \ type\"\nelse\n echo \"PASS: no notification type emitted two successive notifications closer than\nthe ${MIN_INTERVAL}s\
    \ minimum interval\"\nfi\n Page 185\nThis Recommendation is compliant when, for each notification type, no two successive\n\
    notifications of that type are emitted closer together than the configured minimum\ninterval."
  remediation: 'Configure a minimum interval between two successive list_changed notifications of

    the same type on the subscriptions/listen stream, and batch or debounce rapid

    change events of a type into consolidated notifications rather than one per change.

    Configure the audit log to record notification emissions with a timestamp and the

    notification method so anomalous per-type rates can be detected. This is server

    configuration, and there is no portable command.'
  checks:
