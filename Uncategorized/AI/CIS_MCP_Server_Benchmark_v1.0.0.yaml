- id: 4.1.5
  title: Ensure a human can deny tool invocations and sensitive or high-impact operations require confirmation
  scoring: manual
  profile:
  - Level 2
  description: A human can always deny a tool invocation, and sensitive or high-impact operations require explicit confirmation
    before they execute. A compliant host makes clear which tools are exposed to the model, shows a clear indicator when a
    tool is invoked, and shows the tool inputs to the user before the call. Routine, non-sensitive read operations proceed
    without a prompt but are logged. Sensitive operations, and high-impact or irreversible operations such as external communications,
    financial or legal commitments, security-posture changes, and destructive writes, require explicit human confirmation
    or approval before execution. In agentic multi-step workflows, the same confirmation applies to a sequence of operations
    that is collectively high-impact, so the human's ability to deny covers the aggregate effect, not only a single call.
    The operator maintains the judgment of what is sensitive or high-impact independently of serverprovided tool annotations,
    which are untrusted unless they come from a trusted server.
  rationale: 'The MCP Tools specification recommends that there always be a human in the loop able to deny a tool invocation,
    and that applications present confirmation prompts for operations and make clear which tools are invoked. Applying identical
    oversight to every invocation produces one of two bad outcomes: uniform high-friction oversight that causes consent fatigue,
    or uniform low-friction oversight that leaves irreversible actions unreviewed. Requiring confirmation for sensitive and
    high-impact operations while letting routine reads proceed matches oversight to actual risk and keeps the human able to
    deny the actions that matter. The confirmation step is also a prompt-injection mitigation: an injected instruction cannot
    silently trigger a high-impact action that needs human approval, so the approval breaks the attack chain at the execution
    layer even when input-layer detection fails. Because server-provided annotations are untrusted unless from a trusted server,
    the operator classifies what is sensitive or high-impact rather than relying on a tool''s self-description.'
  impact: Sensitive and high-impact operations require explicit human confirmation before execution, which adds overhead in
    workflows that frequently invoke them. In most deployments the majority of invocations are routine reads and proceed without
    added friction. Page 143
  references:
  - '1. MCP specification (security best practices):'
  - https://modelcontextprotocol.io/docs/2026-0728/tutorials/security/security_best_practices
  - 2. MCP specification (Server Features / Tools, humans retain ability to deny
  - https://modelcontextprotocol.io/seps/2322-MRTR
  page_start: 143
  audit_raw: "Confirm the host or gateway keeps a human able to deny any tool invocation, and that\nsensitive or high-impact\
    \ operations require confirmation. Verify behavior at the\nenforcement point, not by calling the MCP server directly unless\
    \ the server is explicitly\nthe enforcement point: attempt a high-impact operation through the host or gateway and\nconfirm\
    \ a human approval is required before execution, and separately confirm a\nroutine read executes without a prompt but\
    \ is logged.\nSet ENFORCEMENT to the host control API, gateway, or policy engine that enforces the\ncontrols (only the\
    \ MCP server if the server itself is the enforcement point), set\nHIGH_IMPACT_TOOL to a tool the operator classifies as\
    \ sensitive or high-impact, set\nTOKEN to a bearer token the enforcement point accepts, and set APPROVAL_JQ to the\nboolean\
    \ the deployment documents as its attributable human-approval signal, for\nexample a host approval state. Run the following\
    \ command:\n Page 144\nENFORCEMENT=\"<HITL_ENFORCEMENT_URL>\"\nHIGH_IMPACT_TOOL=\"<HIGH_IMPACT_TOOL>\"\nPROTO=\"2026-07-28\"\
    \nAPPROVAL_JQ=\"${APPROVAL_JQ:-.result.approval.state==\\\"pending_human\\\"}\"\nTOKEN=\"<BEARER_TOKEN>\"\ncommand -v\
    \ jq >/dev/null 2>&1 || { echo \"ERROR: jq is required and not installed\n(cannot verify)\"; exit 0; }\nbody=\"{\\\"jsonrpc\\\
    \":\\\"2.0\\\",\\\"id\\\":1,\\\"method\\\":\\\"tools/call\\\",\\\"params\\\":{\\\"name\\\":\\\"\n$HIGH_IMPACT_TOOL\\\"\
    ,\\\"arguments\\\":{},\\\"_meta\\\":{\\\"io.modelcontextprotocol/protocolVer\nsion\\\":\\\"$PROTO\\\",\\\"io.modelcontextprotocol/clientInfo\\\
    \":{\\\"name\\\":\\\"cis-benchmarkaudit\\\",\\\"version\\\":\\\"1.0\\\"}}}}\"\nraw=$(curl -sS --connect-timeout 3 -m 10\
    \ -X POST \"$ENFORCEMENT\" -H 'Content-Type:\napplication/json' -H 'Accept: application/json, text/event-stream' -H \"\
    MCP-ProtocolVersion: $PROTO\" -H 'Mcp-Method: tools/call' -H \"Mcp-Name: $HIGH_IMPACT_TOOL\" -H\n\"Authorization: Bearer\
    \ $TOKEN\" -d \"$body\" 2>/dev/null)\ncase \"$(printf '%s' \"$raw\" | sed -e 's/^[[:space:]]*//' | cut -c1)\" in\n '{')\
    \ resp=\"$raw\" ;;\n *) resp=$(printf '%s\\n' \"$raw\" | sed -n 's/^data: //p' | while IFS= read -r l; do\nprintf '%s'\
    \ \"$l\" | jq -e 'select(.id==1)' 2>/dev/null && break; done) ;;\nesac\n[ -z \"$resp\" ] && { echo \"ERROR: no response\
    \ from the enforcement point\n(unreachable), cannot verify\"; exit 0; }\nprintf '%s' \"$resp\" | jq -e . >/dev/null 2>&1\
    \ || { echo \"ERROR: response is not valid\nJSON, cannot verify\"; exit 0; }\nif printf '%s' \"$resp\" | jq -e '.error\
    \ != null' >/dev/null 2>&1; then\n echo \"ERROR: request errored (for example an auth or method error), which does not\n\
    demonstrate a human approval gate, cannot verify\"\nelif printf '%s' \"$resp\" | jq -e \"$APPROVAL_JQ\" >/dev/null 2>&1;\
    \ then\n echo \"PASS: the high-impact operation produced the deployment's attributable humanapproval signal\"\nelif printf\
    \ '%s' \"$resp\" | jq -e '.result.resultType==\"input_required\"' >/dev/null\n2>&1; then\n echo \"REVIEW: the response\
    \ is input_required, which is not by itself proof of human\napproval (it can be elicitation, sampling, or roots), confirm\
    \ the input request\nrepresents human approval in this deployment\"\nelif printf '%s' \"$resp\" | jq -e '.result != null'\
    \ >/dev/null 2>&1; then\n echo \"FAIL: the high-impact operation returned a completed result with no human\napproval step\"\
    \nelse\n echo \"REVIEW: response did not clearly indicate approval or execution, inspect it\"\nfi\nThis Recommendation\
    \ is compliant when a human can deny any invocation, sensitive\nand high-impact operations are gated with human confirmation\
    \ at the enforcement\npoint, and the operator's classification is maintained independently of server\nannotations.\n Page\
    \ 145"
  remediation: 'These are host and gateway configuration settings, with no portable command.

    Configure human-in-the-loop controls at the host or the gateway, the enforcement point,

    so a human can deny any tool invocation and sensitive or high-impact operations

    require explicit confirmation or approval before execution, while routine reads proceed

    without a prompt but are logged. Maintain the operator''s classification of which

    operations are sensitive or high-impact independently of server-provided annotations

    (see Recommendation 3.2.3), and review it whenever a tool is added or its behavior

    changes. Apply the confirmation to a multi-step sequence that is collectively highimpact, not only to an individual call.
    Show the tool inputs to the user before the call so

    the confirmation is informed.'
