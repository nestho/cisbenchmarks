- id: 5.2.2
  title: Ensure sessions are not used as authentication and, where present, are bound to user identity
  scoring: manual
  profile:
  - Level 1
  description: Under the 2026-07-28 revision, the protocol-level session and the Mcp-Session-Id header are removed. Every
    request carries its protocol version, self-reported client identity metadata, and client capabilities in _meta, and none
    of these is authentication. For a remote HTTP server, authentication and authorization are established independently for
    each request through the transport authorization framework, and an invalid or absent credential is rejected, so a session
    identifier or a continuity handle is never proof of identity. Where an application needs continuity across calls, it uses
    an explicit, server-issued handle passed as an ordinary tool argument, which the specification treats as an application
    value rather than a credential. Building on the specification's non-normative guidance for such handles, this Recommendation
    requires that the handle be generated from a cryptographically secure random source, be nonguessable, be bound to the
    authenticated identity, be re-validated against that identity on every use, and expire after a server-defined duration.
    For deployments still on 2025-11-25, the same principle applies to the protocol session.
  rationale: Treating a session identifier or a continuity handle as authentication lets anyone who captures or guesses it
    impersonate the user. Because the 2026-07-28 revision makes the protocol stateless, application state now lives in explicit
    handles that flow through the model and the client and can be logged or leaked. This Recommendation therefore requires
    that they be unguessable, bound to identity, and re-checked on every use. Authentication is established independently
    per request through the transport authorization framework, not through the self-reported identity in _meta. The specification
    treats such a handle as an application value and gives non-normative guidance that it carry sufficient entropy and a bounded
    lifetime, and this Recommendation makes that a requirement. Expiry bounds the window in which a leaked handle is useful.
  impact: Re-validating identity per request adds minor overhead. Deployments that span multiple nodes must store the handle-to-identity
    binding in a shared store, a modest infrastructure requirement. Page 187
  references:
  - '1. MCP specification (Base Protocol / Authorization):'
  - https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
  - '2. MCP specification (Base Protocol / Transports / Streamable HTTP):'
  - https://modelcontextprotocol.io/specification/2026-0728/basic/transports/streamable-http
  - https://modelcontextprotocol.io/specification/2026-07-28/changelog
  - https://modelcontextprotocol.io/specification/2026-07-28/server/tools
  page_start: 187
  audit_raw: "First, confirm the server rejects a request that carries a captured handle but no\nauthorization credential.\
    \ Run the following command, substituting the endpoint, a tool\nthat accepts a continuity-handle argument, and a captured\
    \ handle or session value. The\nrequest is otherwise a valid tool call, so a rejection can only be due to the missing\n\
    authorization and not to some other defect in the request:\nURL=\"<MCP_ENDPOINT>\"\nCAPTURED_HANDLE='<CAPTURED_HANDLE_OR_SESSION_VALUE>'\n\
    TOOL=\"<TOOL_ACCEPTING_A_HANDLE>\"\ncode=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 -m 10 -X POST\n\
    \"$URL\" \\\n -H 'Content-Type: application/json' \\\n -H 'Accept: application/json, text/event-stream' \\\n -H 'MCP-Protocol-Version:\
    \ 2026-07-28' \\\n -H 'Mcp-Method: tools/call' \\\n -H \"Mcp-Name: $TOOL\" \\\n -d\n\"{\\\"jsonrpc\\\":\\\"2.0\\\",\\\"\
    id\\\":1,\\\"method\\\":\\\"tools/call\\\",\\\"params\\\":{\\\"name\\\":\\\"$TOOL\n\\\",\\\"arguments\\\":{\\\"handle\\\
    \":\\\"$CAPTURED_HANDLE\\\"},\\\"_meta\\\":{\\\"io.modelcontextprotoc\nol/protocolVersion\\\":\\\"2026-0728\\\",\\\"io.modelcontextprotocol/clientInfo\\\
    \":{\\\"name\\\":\\\"cis-benchmarkaudit\\\",\\\"version\\\":\\\"1.0\\\"},\\\"io.modelcontextprotocol/clientCapabilities\\\
    \":{}}}}\"\n2>/dev/null)\ncase \"$code\" in\n 401) echo \"PASS: a request presenting only a captured handle with no valid\n\
    authorization was rejected with 401 (authorization required or token invalid)\" ;;\n 403) echo \"REVIEW: rejected with\
    \ 403, which signals insufficient scope for an\nauthenticated caller rather than a missing credential, confirm the server\
    \ rejects the\nunauthenticated request as 401\" ;;\n 000) echo \"ERROR: server unreachable\" ;;\n 400) echo \"REVIEW:\
    \ rejected with 400, confirm it is an authorization rejection and\nnot a header-mismatch or malformed-request rejection\
    \ before concluding\" ;;\n 2*) echo \"FAIL: a captured handle with no valid authorization was accepted ($code),\nthe handle\
    \ is being treated as authentication\" ;;\n *) echo \"REVIEW: server returned $code, attribute before concluding\" ;;\n\
    esac\nThen inspect the handle-generation mechanism to confirm a cryptographically secure\nrandom source, and confirm by\
    \ configuration review that handles are bound to the\nauthenticated identity, stored server-side, re-validated per request,\
    \ and expire. This\nRecommendation is compliant when a request presenting only a captured handle with\nno valid authorization\
    \ is rejected with 401, and inspection confirms the handle is nonguessable, identity-bound, re-validated on each use,\
    \ and expiring.\n Page 188"
  remediation: 'Establish authentication per request through the transport authorization framework,

    never through a session identifier or a continuity handle, and do not rely on a protocol

    session under the 2026-07-28 revision. For cross-call continuity, issue an explicit

    handle from a tool. Generate the handle from a cryptographically secure random

    source, bind it to the authenticated identity, store the binding server-side in a shared

    store for multi-node deployments, re-validate it against the identity on every use, and

    expire it after a server-defined duration. Reject any request that presents only a handle

    without independent authentication. This is server middleware and configuration, and

    there is no portable command.'
  checks:
  - type: manual_review
    info: 'First, confirm the server rejects a request that carries a captured handle but no

      authorization credential. Run the following command, substituting the endpoint, a tool

      that accepts a continuity-handle argument, and a captured handle or session value. The

      request is otherwise a valid tool call, so a rejection can only be due to the missing

      authorization and not to some other defect in the request:

      URL="<MCP_ENDPOINT>"

      CAPTURED_HANDLE=''<CAPTURED_HANDLE_OR_SESSION_VALUE>''

      TOOL="<TOOL_ACCEPTING_A_H'
    severity: medium
- id: 5.2.3
  title: Ensure legacy Streamable HTTP session and streamresumption mechanisms are disabled
  scoring: scored
  profile:
  - Level 1
  description: Under the 2026-07-28 revision, a server does not implement the legacy Streamable HTTP session and stream-resumption
    mechanisms that earlier revisions defined. A server that supports only this revision responds to a standalone GET or a
    DELETE on the MCP endpoint with 405, ignores a client-supplied Mcp-Session-Id header and neither mints nor echoes one,
    and ignores a Last-Event-ID header while still serving the request normally, because streams are not resumable. These
    mechanisms were removed in 2026-07-28, so a server that still honors them exposes a legacy session or replay surface an
    attacker can use to receive another identity's server-initiated messages or to resume a stream that should not be resumable.
    Deployments that stream must also scope each streamed response to its originating authenticated request so it cannot be
    retrieved across identities. This request-scoped SSE property is confirmed by reviewing the transport and authentication
    configuration.
  rationale: 'Earlier revisions let a server assign a session through the Mcp-Session-Id header, let a client open a standalone
    SSE stream with GET to receive server-initiated messages, and let streams be resumed through Last-Event-ID. The 2026-07-28
    revision removes all three, and each request now carries its own identity in _meta. A server that still exposes any of
    them keeps a legacy attack surface: a standalone GET stream or a resumable stream can leak or replay events across contexts,
    and a minted session identifier reintroduces the connection-level state the stateless model eliminated. Rejecting GET
    and DELETE, ignoring Last-Event-ID, and never minting a session identifier close that surface. Because the revision removes
    stream resumability and message redelivery, there is no cross-stream replay to abuse and each SSE response carries only
    the originating request''s notifications.'
  impact: There is a minor impact. Rejecting legacy GET and DELETE and ignoring the legacy headers is the default posture
    of a server built for 2026-07-28, so the cost is confirming rather than adding behavior. A deployment that carried forward
    legacy session or resumption handling from an earlier revision removes it, which also removes the connection-level state
    a stateless deployment does not need. Page 190
  references:
  - '1. MCP specification (Base Protocol / Overview):'
  - https://modelcontextprotocol.io/specification/2026-07-28/basic
  - '2. MCP specification (Base Protocol / Transports / Streamable HTTP):'
  - https://modelcontextprotocol.io/specification/2026-0728/basic/transports/streamable-http
  - https://modelcontextprotocol.io/specification/2026-07-28/changelog
  page_start: 190
  audit_raw: "Verify that the MCP endpoint rejects legacy GET and DELETE, ignores Last-EventID, and neither honors nor mints\
    \ a protocol-level session identifier. Run the following\ncommand to confirm a standalone GET and a DELETE are rejected,\
    \ substituting the\nendpoint:\nURL=\"<MCP_ENDPOINT>\"\nget_code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout\
    \ 5 -m 8 -X GET\n\"$URL\" -H 'Accept: text/event-stream' 2>/dev/null)\ndel_code=$(curl -sS -o /dev/null -w '%{http_code}'\
    \ --connect-timeout 5 -m 8 -X DELETE\n\"$URL\" 2>/dev/null)\necho \"detail: GET=$get_code DELETE=$del_code (2026-07-28-only\
    \ servers respond 405 to\nboth)\"\nif [ \"$get_code\" = \"000\" ] || [ \"$del_code\" = \"000\" ]; then\n echo \"ERROR:\
    \ server unreachable on the GET or DELETE probe\"\nelif [ \"$get_code\" = \"405\" ] && [ \"$del_code\" = \"405\" ]; then\n\
    \ echo \"PASS: standalone GET and DELETE to the MCP endpoint return 405, no legacy\nstream or session surface is exposed\"\
    \nelse\n case \"$get_code $del_code\" in\n 2[0-9][0-9]\\ *|*\\ 2[0-9][0-9]) echo \"FAIL: a standalone GET or DELETE is\
    \ served on\nthe MCP endpoint (GET=$get_code DELETE=$del_code)\" ;;\n *) echo \"REVIEW: expected 405 for both, got GET=$get_code\
    \ DELETE=$del_code, both\nare rejections but not the recommended status, attribute before concluding\" ;;\n esac\nfi\n\
    Then confirm the server ignores a Last-Event-ID header by comparing a request\nthat carries it against a control request\
    \ that does not. Run the following command:\n Page 191\nURL=\"<MCP_ENDPOINT>\"\nbody='{\"jsonrpc\":\"2.0\",\"id\":1,\"\
    method\":\"tools/list\",\"params\":{\"_meta\":{\"io.modelconte\nxtprotocol/protocolVersion\":\"2026-0728\",\"io.modelcontextprotocol/clientInfo\"\
    :{\"name\":\"cis-benchmarkaudit\",\"version\":\"1.0\"},\"io.modelcontextprotocol/clientCapabilities\":{}}}}'\ncommon=\"\
    -H Content-Type:application/json -H Accept:application/json,text/event-stream\n-H MCP-Protocol-Version:2026-07-28 -H Mcp-Method:tools/list\"\
    \nctrl=$(curl -sS --connect-timeout 5 -m 8 -X POST \"$URL\" $common -d \"$body\"\n2>/dev/null)\nwithid=$(curl -sS --connect-timeout\
    \ 5 -m 8 -X POST \"$URL\" $common -H 'Last-Event-ID:\n1' -d \"$body\" 2>/dev/null)\n[ -n \"$ctrl\" ] && [ -n \"$withid\"\
    \ ] || { echo \"ERROR: server unreachable on one or\nboth probes\"; exit 0; }\nnorm(){ obj=$(printf '%s' \"$1\" | jq -c\
    \ 'select(.jsonrpc) | select(.id==1)'\n2>/dev/null | head -n1); [ -n \"$obj\" ] || obj=$(printf '%s\\n' \"$1\" | sed -n\n\
    's/^data:[[:space:]]*//p' | while IFS= read -r d; do printf '%s' \"$d\" | jq -e\n'select(.id==1)' >/dev/null 2>&1 && {\
    \ printf '%s' \"$d\"; break; }; done); printf '%s'\n\"$obj\" | jq -r 'if has(\"result\") and (.result|has(\"tools\"))\
    \ then \"toolsresult\" elif\nhas(\"error\") then \"error\" else \"other\" end' 2>/dev/null; }\nc=$(norm \"$ctrl\"); w=$(norm\
    \ \"$withid\")\necho \"detail: control_post=$c last_event_id_post=$w (both must be a normal tools/list\nresult)\"\nif\
    \ [ \"$c\" = \"toolsresult\" ] && [ \"$w\" = \"toolsresult\" ]; then\n echo \"PASS: the server returned the same normal\
    \ tools/list result with and without\nLast-Event-ID, the header is ignored\"\nelif [ \"$c\" = \"toolsresult\" ] && [ \"\
    $w\" != \"toolsresult\" ]; then\n echo \"FAIL: the Last-Event-ID request was handled differently from the control, the\n\
    header is not ignored\"\nelse\n echo \"ERROR: the control request did not return a tools/list result, cannot\nattribute\
    \ the Last-Event-ID behavior\"\nfi\nThen confirm the server ignores a client-supplied Mcp-Session-Id and never mints or\n\
    echoes one. Run the following command:\n Page 192\nURL=\"<MCP_ENDPOINT>\"\nbody='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\"\
    :\"tools/list\",\"params\":{\"_meta\":{\"io.modelconte\nxtprotocol/protocolVersion\":\"2026-0728\",\"io.modelcontextprotocol/clientInfo\"\
    :{\"name\":\"cis-benchmarkaudit\",\"version\":\"1.0\"},\"io.modelcontextprotocol/clientCapabilities\":{}}}}'\ncommon=\"\
    -H Content-Type:application/json -H Accept:application/json,text/event-stream\n-H MCP-Protocol-Version:2026-07-28 -H Mcp-Method:tools/list\"\
    \nhdr_ctrl=$(mktemp); hdr_sess=$(mktemp)\nb_ctrl=$(curl -sS --connect-timeout 5 -m 8 -D \"$hdr_ctrl\" -X POST \"$URL\"\
    \ $common -d\n\"$body\" 2>/dev/null)\nb_sess=$(curl -sS --connect-timeout 5 -m 8 -D \"$hdr_sess\" -X POST \"$URL\" $common\
    \ -H\n'Mcp-Session-Id: cis-audit-supplied-000' -d \"$body\" 2>/dev/null)\n[ -n \"$b_ctrl\" ] && [ -n \"$b_sess\" ] ||\
    \ { echo \"ERROR: server unreachable on one or\nboth probes\"; rm -f \"$hdr_ctrl\" \"$hdr_sess\"; exit 0; }\nminted=$(cat\
    \ \"$hdr_ctrl\" \"$hdr_sess\" | grep -ic '^Mcp-Session-Id:')\nrm -f \"$hdr_ctrl\" \"$hdr_sess\"\nsess_ok=$(printf '%s'\
    \ \"$b_sess\" | jq -r 'if has(\"result\") and (.result|has(\"tools\"))\nthen \"ok\" else \"notok\" end' 2>/dev/null)\n\
    echo \"detail: mcp_session_id_response_headers=$minted\npost_with_client_session_id=$sess_ok\"\nif [ \"$minted\" -gt 0\
    \ ]; then\n echo \"FAIL: the server minted or echoed an Mcp-Session-Id response header, a\nprotocol-level session surface\
    \ is present\"\nelif [ \"$sess_ok\" = \"ok\" ]; then\n echo \"PASS: the server ignored a client-supplied Mcp-Session-Id\
    \ and did not mint or\necho one\"\nelse\n echo \"REVIEW: no Mcp-Session-Id was minted, but the request carrying a client\n\
    session id did not return a normal result, attribute before concluding\"\nfi\nThen confirm by configuration review that\
    \ any streamed response is scoped to its\noriginating authenticated request and cannot be retrieved across identities.\
    \ This\nRecommendation is compliant when standalone GET and DELETE return 405, a LastEvent-ID request behaves identically\
    \ to a control request, and no Mcp-Session-Id\nis honored, minted, or echoed, and, for deployments that stream, each streamed\n\
    response is request-scoped and not retrievable across identities.\n Page 193"
  remediation: 'For the 2026-07-28 revision, do not implement resumable streams or protocol-level

    sessions. Reject a standalone GET and a DELETE on the MCP endpoint with 405,

    ignore a Last-Event-ID header, and neither mint nor echo an Mcp-Session-Id

    header. Where a deployment streams responses, scope each streamed response to its

    originating authenticated request and maintain per-identity separation so events cannot

    be retrieved across identities. Where a tool uses the multi round-trip pattern, bind the

    requestState blob to the originating identity and authorize it on the follow-up call.

    Where the SDK in use exposes no server-side switch for the legacy surface, enforce the

    rejection at a front proxy or gateway, returning 405 to a standalone GET or DELETE on

    the MCP endpoint and stripping Mcp-Session-Id and Last-Event-ID before the

    origin. Gateway enforcement covers only paths that traverse the gateway, so restrict

    direct network reach to the origin where this layer is the enforcement point. This is

    server middleware and configuration, and there is no portable command.'
