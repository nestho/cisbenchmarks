    syntax are platform-specific.'
  checks:
  - type: command
    command: total="$(printf '%s\n' "$sample" | grep -c .)" && nfail="$(printf '%s\n' "$fails" | grep -c .)" && // .http_status
      // "") | tostring)) != "")' 2>/dev/null | grep -c .)"
    expected: ''
    severity: medium
    info: 'Confirm that audience and issuer validation failures are emitted as structured events

      carrying an error code, then separately confirm a SIEM rule alerts on them and that the

      deployment rejects a wrong-audience token end to end. The command reads a

      structured JSON-lines authentication log and detects a failure by matching the

      structured identifier fields rather than free text, so a benign record th'
- id: 7.2.2
  title: Ensure notifications/cancelled and notifications/progress messages are monitored for behavioral anomalies
  scoring: scored
  profile:
  - Level 2
  description: 'Cancellation and progress signals are monitored for anomalous patterns, with cancellation, progress, and task
    lifecycle kept distinct and each correlated by the identifier the protocol defines for it. Cancellation depends on the
    transport: on stdio it is a notifications/cancelled message keyed by params.requestId, while Streamable HTTP has no such
    message and cancellation appears as a responsestream close or abort seen at the server or gateway. Progress is correlated
    by the progressToken carried in _meta, and task lifecycle, where the Tasks extension is in use, is a separate mechanism
    using a server-generated taskId. Per-server baselines for cancellation rate, stream-close rate, and progress frequency
    and payload volume are established over a learning period. An alert is raised when a server deviates from its baseline
    in a rolling window, or when a cancellation requestId or progress progressToken matches no request the deployment issued.
    Because stream resumability was removed at this revision, a request re-issued after a broken stream carries a new id,
    and the baseline excludes it as a legitimate near-duplicate.'
  rationale: 'Cancellation and progress signals are low-visibility side channels, and abuse shows up as a shift in rate or
    pattern rather than a discrete rule violation. Correlating by the correct identifier is what makes an anomaly legible:
    a notifications/cancelled whose requestId names no request the deployment issued, or a notifications/progress whose progressToken
    matches no originating request, is a spoofed or malformed signal a per-server baseline surfaces only if the monitor keys
    on the identifier the protocol actually uses. Matching on the wrong field, as an earlier version did, produces confident
    results about a relationship the protocol does not define. Monitoring progress-payload volume additionally turns the progress
    channel into a detection surface for data exfiltration through long-running operations.'
  impact: This control requires a learning period to establish baselines and ongoing SIEM rule maintenance. The benefit is
    detection of notification-abuse patterns that no single-event rule would catch. Page 245
  references:
  - '1. MCP specification (Base Protocol / Message Patterns / Progress):'
  - https://modelcontextprotocol.io/specification/2026-07-28/basic/patterns/progress
  - '2. MCP specification (Base Protocol / Transports / Overview, cancellation binding):'
  - https://modelcontextprotocol.io/specification/2026-07-28/basic/transports
  - https://modelcontextprotocol.io/specification/2026-07-28/schema
  page_start: 245
  audit_raw: "Confirm that cancellation and progress notifications carry a server identity and map to\nan originating request\
    \ by the correct identifier. Separately, confirm the SIEM baseline\nand rate-anomaly rules exist. This block requires\
    \ jq and a structured JSON-lines log in\nwhich each issued request is recorded with its JSON-RPC id, and its progressToken\n\
    where progress was requested. Adjust LOG and the field names to the local schema.\nRun the following command:\n Page 246\n\
    LOG=\"${LOG:-<MCP_AUDIT_LOG>}\"\nN=\"${N:-2000}\"\nif [ ! -r \"$LOG\" ]; then echo \"ERROR: audit log not readable at\
    \ $LOG\"; exit 0; fi\nsample=\"$(tail -n \"$N\" \"$LOG\" 2>/dev/null)\"\ntotal=\"$(printf '%s\\n' \"$sample\" | grep -c\
    \ .)\"\nif [ \"$total\" -eq 0 ]; then echo \"ERROR: no entries found in $LOG\"; exit 0; fi\nissued_ids=\"$(printf '%s\\\
    n' \"$sample\" | jq -rR '(fromjson? // null) as $o |\nselect($o != null) | (($o.request_id // $o.id) // empty) | tostring'\
    \ 2>/dev/null |\ngrep -v '^$' | sort -u)\"\nissued_tokens=\"$(printf '%s\\n' \"$sample\" | jq -rR '(fromjson? // null)\
    \ as $o |\nselect($o != null) | (($o.progress_token // $o.params.\"_meta\".progressToken //\n$o.\"_meta\".progressToken)\
    \ // empty) | tostring' 2>/dev/null | grep -v '^$' | sort -\nu)\"\ncanc=\"$(printf '%s\\n' \"$sample\" | jq -cR '(fromjson?\
    \ // null) as $o | select($o !=\nnull) | select(($o.method // \"\") == \"notifications/cancelled\") | $o' 2>/dev/null)\"\
    \nprog=\"$(printf '%s\\n' \"$sample\" | jq -cR '(fromjson? // null) as $o | select($o !=\nnull) | select(($o.method //\
    \ \"\") == \"notifications/progress\") | $o' 2>/dev/null)\"\nncanc=\"$(printf '%s\\n' \"$canc\" | grep -c .)\"\nnprog=\"\
    $(printf '%s\\n' \"$prog\" | grep -c .)\"\nnnotif=$(( ncanc + nprog ))\nnoid=\"$( { printf '%s\\n' \"$canc\"; printf '%s\\\
    n' \"$prog\"; } | grep . | jq -c\n'select((((.server_id // .server // \"\") | tostring)) == \"\")' 2>/dev/null | grep\
    \ -\nc .)\"\ncanc_ids=\"$(printf '%s\\n' \"$canc\" | jq -r '(.params.requestId // empty) | tostring'\n2>/dev/null | grep\
    \ -v '^$' | sort -u)\"\nprog_tokens=\"$(printf '%s\\n' \"$prog\" | jq -r '(.params.progressToken // empty) |\ntostring'\
    \ 2>/dev/null | grep -v '^$' | sort -u)\"\ncanc_orphan=\"$(comm -23 <(printf '%s\\n' \"$canc_ids\" | grep -v '^$') <(printf\
    \ '%s\\n'\n\"$issued_ids\" | grep -v '^$') 2>/dev/null | grep -c .)\"\nprog_orphan=\"$(comm -23 <(printf '%s\\n' \"$prog_tokens\"\
    \ | grep -v '^$') <(printf\n'%s\\n' \"$issued_tokens\" | grep -v '^$') 2>/dev/null | grep -c .)\"\norphan=$(( canc_orphan\
    \ + prog_orphan ))\necho \"--- notification correlation in last $total entries ---\"\necho \"cancelled(by requestId):\
    \ $ncanc progress(by progressToken): $nprog without\nserver identity: $noid orphaned: $orphan (cancel $canc_orphan, progress\n\
    $prog_orphan)\"\necho \"(note: on Streamable HTTP cancellation is a closed response stream, not a\nnotifications/cancelled\
    \ message; monitor stream-close events out of band. Tasks use\ntaskId via tasks/cancel, monitored separately.)\"\nif [\
    \ \"$nnotif\" -eq 0 ]; then\n echo \"REVIEW: no cancellation or progress notifications in the sample, so no perserver\
    \ baseline can be derived, extend the window or confirm the transport, and\nconfirm the SIEM baseline rules exist\"\n\
    elif [ \"$orphan\" -gt 0 ]; then\n echo \"FAIL: $orphan notification(s) reference a requestId or progressToken with no\n\
    originating request in the log\"\nelif [ \"$noid\" -gt 0 ]; then\n echo \"FAIL: $noid notification event(s) lack a server\
    \ identity, which prevents perserver baselining\"\nelse\n Page 247\n echo \"PASS: cancellation and progress notifications\
    \ carry server identity and map\nto an originating request, confirm the SIEM baseline and rate-anomaly rules exist\"\n\
    fi\nThis Recommendation is compliant when the notifications carry a server identity, every\nrequestId and progressToken\
    \ maps to an originating request, the command prints\nPASS, and a reviewer confirms that the per-server baselines and\
    \ rate-anomaly rules\nexist in the SIEM. The command does not compute a rate baseline itself, and on\nStreamable HTTP\
    \ it does not consume stream-close events, which are observed\nseparately at the server or gateway. Those two gaps are\
    \ the manual part of this\nRecommendation."
  remediation: 'Configure structured logging to record issued requests with their JSON-RPC id and,

    where progress is requested, their progressToken, and to capture cancellation and

    progress notifications with server identity. On stdio, capture

    notifications/cancelled and correlate it by params.requestId. On

    Streamable HTTP, capture response-stream close and abort events, which are the

    cancellation signal there, and correlate each to its originating request. Capture

    notifications/progress and correlate it by params.progressToken. Where the

    Tasks extension is in use, capture task lifecycle separately by taskId. Establish perserver baselines over a learning
    period. Then add SIEM rules that alert on three

    conditions: a per-server cancellation or stream-close rate above a baseline-derived

    threshold, progress frequency or payload volume outside baseline, and any cancellation

    requestId or progress progressToken that references no originating request.

    Exclude requests re-issued after a broken stream from the anomaly logic. Route alerts

    to the security operations team. The exact rule syntax is platform-specific.'
  checks:
  - type: command
    command: total="$(printf '%s\n' "$sample" | grep -c .)" && grep -v '^$' | sort -u)" && $o."_meta".progressToken) // empty)
      | tostring' 2>/dev/null | grep -v '^$' | sort - && ncanc="$(printf '%s\n' "$canc" | grep -c .)" && nprog="$(printf '%s\n'
      "$prog" | grep -c .)" && noid="$( { printf '%s\n' "$canc"; printf '%s\n' "$prog"; } | grep . | jq -c && 'select((((.server_id
      // .server // "") | tostring)) == "")' 2>/dev/null | grep - && 2>/dev/null | grep -v '^$' | sort -u)" && tostring' 2>/dev/null
      | grep -v '^$' | sort -u)" && canc_orphan="$(comm -23 <(printf '%s\n' "$canc_ids" | grep -v '^$') <(printf '%s\n' &&
      "$issued_ids" | grep -v '^$') 2>/dev/null | grep -c .)" && prog_orphan="$(comm -23 <(printf '%s\n' "$prog_tokens" |
      grep -v '^$') <(printf && '%s\n' "$issued_tokens" | grep -v '^$') 2>/dev/null | grep -c .)"
    expected: ''
    severity: medium
    info: 'Confirm that cancellation and progress notifications carry a server identity and map to

      an originating request by the correct identifier. Separately, confirm the SIEM baseline

      and rate-anomaly rules exist. This block requires jq and a structured JSON-lines log in

      which each issued request is recorded with its JSON-RPC id, and its progressToken

      where progress was requested. Adjust LOG and the field'
- id: '8.1'
  title: Ensure third-party MCP servers and connectors are vetted and allowlists are enforced
  scoring: manual
  profile:
  - Level 1
  description: Code review and security assessment are required for every third-party MCP server and connector before it is
    approved for use. MCP hosts and clients enforce a runtime allowlist so that only approved servers can be connected to.
    Each allowlist entry is keyed on the server's server.json name together with its approved distribution locator, version,
    and content digest. A remote server is additionally keyed on its exact approved origin. The server.json name only identifies
    who may publish under a namespace, not whether the installed instance is the approved build, so it is one component of
    the key rather than the whole basis of trust. The allowlist covers every distribution channel the deployment installs
    from, including remote server URLs, not just a single ecosystem. The current MCP Registry package types are npm, pypi,
    nuget, oci, and mcpb, given as an example rather than a fixed set. The approved tool, resource, prompt, and permission
    surface of each allowlisted server is documented. Any expansion or material change to that surface, or to the executable
    package, is blocked until it has been reviewed and promoted through the approval workflow.
  rationale: Third-party servers are untrusted code with access to whatever the host grants them. A local server is a downloaded
    binary that runs with the client's privileges, so installing one is equivalent to running arbitrary code. Vetting before
    approval and enforcing a runtime allowlist ensure that only reviewed servers can connect. Tying the allowlist to a documented
    tool, resource, prompt, and permission surface stops a server from quietly expanding what it does after approval. Presence
    in the public MCP Registry is not a substitute for vetting, because the registry authenticates namespaces and hosts metadata
    but does not scan server code. The specification's install-consent requirement for one-click local installs is a per-install
    prompt, not a persistent approved-server allowlist, so it complements this Recommendation rather than replacing it.
  impact: Vetting and allowlist maintenance are ongoing costs. A default-deny allowlist will block any currently connected
    server that lacks a vetting record, so those servers need to be identified and quarantined before enforcement is turned
    on. Covering every channel, not only npm and pypi, means keying on remote URLs, oci digests, and mcpb artifacts. Some
    hosts cannot do that natively, so enforcement may need to sit at a gateway. Page 251
  references:
  - '1. MCP specification (security best practices):'
  - https://modelcontextprotocol.io/docs/2026-0728/tutorials/security/security_best_practices
  - '2. MCP Registry (server identity): https://modelcontextprotocol.io/registry/about'
  - https://modelcontextprotocol.io/registry/package-types
  - https://modelcontextprotocol.io/seps/1024-mcp-client-security-requirements-forlocal-server-
  page_start: 251
  audit_raw: "Confirm that a vetting record exists for each third-party server in use, and that the host\nor client enforces\
    \ a connection allowlist that refuses any server not on the list. Where\nthe allowlist is file-based, run the following\
    \ command to list the approved servers for\nreview:\nALLOWLIST=\"<MCP_ALLOWLIST_FILE>\"\nif [ ! -e \"$ALLOWLIST\" ]; then\n\
    \ echo \"ERROR: no allowlist file at the configured path, confirm where the host or\nclient enforces the approved-server\
    \ allowlist (it may live in a policy engine or\ngateway rather than a file)\"\n exit 0\nfi\nif [ ! -r \"$ALLOWLIST\" ];\
    \ then\n echo \"ERROR: allowlist file present but not readable, re-run with sufficient\nprivilege\"\n exit 0\nfi\napproved=$(grep\
    \ -vE '^[[:space:]]*(#|$)' \"$ALLOWLIST\")\ncount=$(printf '%s\\n' \"$approved\" | grep -c .)\nif [ \"$count\" -eq 0 ];\
    \ then\n echo \"Approved servers: (none)\"\n echo \"REVIEW: allowlist present but lists no approved servers, confirm whether\
    \ the\nhost is default-deny with nothing yet approved or enforcement is unpopulated\"\n exit 0\nfi\necho \"Approved servers\
    \ ($count):\"\nprintf '%s\\n' \"$approved\"\necho \"REVIEW: confirm each entry has a current vetting record and that the\
    \ host or\nclient refuses any server not listed, keyed on the server.json name or the pinned\npackage identifier and version\"\
    \nThis Recommendation is compliant when every server the host or client can connect to\nis on the enforced allowlist,\
    \ each allowlisted server has a current vetting record, and any\nserver without one is refused. Because the enforcement\
    \ mechanism and the vetting\nrecords require human confirmation, the command's final verdict is REVIEW on the\nnormal\
    \ path and ERROR when the configured path is absent or unreadable.\n Page 252"
  remediation: 'Establish a vetting workflow of code review and security assessment that completes

    before a third-party server is added to the allowlist. Configure the host or client to refuse

    connections to any server not on the allowlist. Key each allowlist entry on the server''s

    server.json name together with the approved locator, version, and content digest,

    and key a remote server on its exact approved origin as well. Make sure the

    enforcement point covers every distribution channel the deployment installs from, not

    only the common package managers. Document each approved server''s tool, resource,

    prompt, and permission surface, and block any expansion or material change pending

    review. Quarantine or remove any server in use that lacks a completed vetting record.

    This is host, client, and process configuration, and the exact allowlist mechanism is

    implementation-specific, so no single portable enforcement command is given.'
  checks:
  - type: command
    command: count=$(printf '%s\n' "$approved" | grep -c .)
    expected: ''
    severity: medium
    info: "Confirm that a vetting record exists for each third-party server in use, and that the host\nor client enforces\
      \ a connection allowlist that refuses any server not on the list. Where\nthe allowlist is file-based, run the following\
      \ command to list the approved servers for\nreview:\nALLOWLIST=\"<MCP_ALLOWLIST_FILE>\"\nif [ ! -e \"$ALLOWLIST\" ];\
      \ then\n echo \"ERROR: no allowlist file at the configured path, conf"
- id: '8.2'
  title: Ensure third-party MCP servers are pinned to a verified content hash and re-vetted before updates
  scoring: manual
  profile:
  - Level 1
  description: 'Each approved third-party MCP server has a recorded SHA-256 content hash of its approved artifact, computed
    the same way the audit recomputes it. The approved artifact is unambiguous: a canonical package archive, an oci manifest
    digest, an mcpb artifact, or a deterministic bundle-manifest artifact generated by a documented process. This keeps a
    single-file entry point from leaving dependencies outside the integrity boundary. Where a native SHA-256 pin exists it
    is recorded directly: mcpb fileSha256 is SHA-256, and an oci digest is SHA-256 when the reference uses sha256:. Otherwise
    the algorithm is preserved, or an enterprise SHA-256 is computed by the documented procedure. npm integrity is SHA-512
    and pip hash-checking is operatorprovided (SHA-256 recommended). Both are verified once, at install time, and are separate
    from the recorded hash. The recorded hash is keyed to the server''s identity: the package.json mcpName for npm installs,
    the server.json name for registrystyle layouts, and the bundle manifest identity for mcpb. Before starting a server, the
    host or gateway recomputes the hash of its artifact and refuses to start it if the value differs from the one recorded
    for its identity. An installed server with no recorded approved hash is also refused. Any update to a third-party server
    triggers a re-vetting workflow equivalent to initial onboarding before the new version is permitted. The approved hash
    and the re-vetting approval are recorded in the enterprise capability baseline.'
  rationale: 'A content hash detects any change to an approved artifact, whether a legitimate update or a malicious substitution.
    The MCP Registry requires an mcpb package entry to carry a fileSha256, which clients validate before installation, but
    that is a one-time, perchannel check. Recording an approved hash keyed to server identity, and blocking on a mismatch,
    extends integrity checking to artifacts altered after install and to channels that carry no install-time validation. Each
    installed instance''s own bytes are compared to an approved hash for its identity, rather than merely confirming that
    the identity appears in the approved set. That distinction stops an artifact from passing on some other approved server''s
    hash, and it catches a second install that shares an approved identity but carries different bytes (a shadow install).
    Requiring re-vetting on update ensures changes are reviewed rather than trusted automatically. This applies the same discipline
    to the artifact that the capability baseline applies to a changed tool list: it is quarantined until reviewed. Page 255'
  impact: Hash tracking and re-vetting add overhead per update, and legitimate updates are delayed by the re-vetting cycle,
    which is intended. Because the audit refuses any server with no recorded hash, every server must be pinned before the
    check passes, so expect to pin or remove unpinned installs. Hashing dependencies needs a deterministic manifest (stable
    file ordering, no embedded timestamps), which may require a canonicalization step the deployment defines. Page 256
  references:
  - '1. MCP specification (security best practices):'
  - https://modelcontextprotocol.io/docs/2026-0728/tutorials/security/security_best_practices
  - '2. MCP Registry (server identity): https://modelcontextprotocol.io/registry/about'
  - https://modelcontextprotocol.io/registry/package-types
  page_start: 255
  audit_raw: "Verify that every recorded artifact matches its approved SHA-256, and that every\ninstalled server instance\
    \ under the servers root maps to an approved hash for its\nidentity. The approved-hash file has one line per pinned artifact\
    \ in the form <sha256>\n<identity> <artifact_path>. One identity may carry more than one approved\nhash if it legitimately\
    \ runs more than one build. The instance scan takes identities from\neach server.json name and each package.json mcpName,\
    \ and hashes each\ninstance's own entry artifact. This block requires bash. Run the following command with\nMCP_SERVERS_ROOT\
    \ set to the directory of installed servers:\n Page 257\nAPPROVED=\"<APPROVED_HASHES_FILE>\"\nSERVERS_ROOT=\"<MCP_SERVERS_ROOT>\"\
    \nif [ ! -r \"$APPROVED\" ]; then\n echo \"ERROR: approved-hash list not readable at the configured path, cannot verify\n\
    any server\"\n exit 0\nfi\ncommand -v sha256sum >/dev/null 2>&1 || { echo \"ERROR: sha256sum unavailable, cannot\nverify\
    \ artifact hashes\"; exit 0; }\nnorm() { printf '%s' \"$1\" | tr -d '\\r' | sed 's/\\xc2\\xa0//g'; }\ndeclare -A approved_for\n\
    rec_h=(); rec_id=(); rec_art=(); checked=0\nwhile IFS= read -r raw || [ -n \"$raw\" ]; do\n line=$(printf '%s' \"$raw\"\
    \ | tr -d '\\r' | sed 's/\\xc2\\xa0/ /g')\n case \"$line\" in \"\"|\\#*) continue ;; esac\n set -- $line\n exp=$(printf\
    \ '%s' \"$1\" | tr -cd '0-9a-fA-F'); id=\"$2\"; art=\"$3\"\n checked=$((checked+1))\n if [ -z \"$exp\" ] || [ -z \"$id\"\
    \ ] || [ -z \"$art\" ]; then\n echo \"server (malformed line): needs '<sha256> <identity> <artifact_path>'\";\ncontinue\n\
    \ fi\n approved_for[\"$id\"]=\"${approved_for[$id]} $exp\"\n rec_h+=(\"$exp\"); rec_id+=(\"$id\"); rec_art+=(\"$art\"\
    )\ndone < \"$APPROVED\"\nif [ \"$checked\" -eq 0 ]; then\n echo \"ERROR: approved-hash list is empty, no server is pinned\"\
    \n exit 0\nfi\nfail=0; err=0; unpinned=0; shadow=0\ni=0\nwhile [ \"$i\" -lt \"${#rec_h[@]}\" ]; do\n exp=\"${rec_h[$i]}\"\
    ; id=\"${rec_id[$i]}\"; art=\"${rec_art[$i]}\"; i=$((i+1))\n if [ ! -r \"$art\" ]; then\n echo \"approved $id: recorded\
    \ artifact not readable at $art\"; err=$((err+1));\ncontinue\n fi\n got=$(sha256sum \"$art\" | awk '{print $1}')\n if\
    \ [ \"$got\" = \"$exp\" ]; then\n echo \"approved $id: recorded artifact at $art matches\"\n else\n echo \"approved $id:\
    \ recorded artifact at $art MISMATCH, computed $got\";\nfail=$((fail+1))\n fi\ndone\nresolve_entry() {\n d=\"$1\"; e=\"\
    \"\n [ -f \"$d/package.json\" ] && e=$(norm \"$(grep -oE\n'\"main\"[[:space:]]*:[[:space:]]*\"[^\"]+\"' \"$d/package.json\"\
    \ | sed -E\n's/.*\"([^\"]+)\"$/\\1/' | head -1)\")\n Page 258\n { [ -n \"$e\" ] && [ -f \"$d/$e\" ] && printf '%s' \"\
    $d/$e\"; } && return\n [ -f \"$d/dist/index.js\" ] && { printf '%s' \"$d/dist/index.js\"; return; }\n [ -f \"$d/server.js\"\
    \ ] && { printf '%s' \"$d/server.js\"; return; }\n ls \"$d\"/*.js 2>/dev/null | head -1\n}\nif [ -n \"$SERVERS_ROOT\"\
    \ ] && [ -d \"$SERVERS_ROOT\" ]; then\n declare -A seen_dir\n while IFS= read -r idf; do\n d=$(dirname \"$idf\")\n [ -n\
    \ \"${seen_dir[$d]:-}\" ] && continue\n case \"$idf\" in\n */server.json) iid=$(tr -d '\\r' < \"$idf\" | grep -oE\n'\"\
    name\"[[:space:]]*:[[:space:]]*\"[^\"]+\"' | sed -E 's/.*:[[:space:]]*\"([^\"]+)\".*/\\1/'\n| head -1) ;;\n */package.json)\
    \ grep -q '\"mcpName\"' \"$idf\" || continue\n iid=$(tr -d '\\r' < \"$idf\" | grep -oE '\"mcpName\"[[:space:]]*:[[:space:]]*\"\
    [^\"]+\"' |\nsed -E 's/.*:[[:space:]]*\"([^\"]+)\".*/\\1/' | head -1) ;;\n *) continue ;;\n esac\n [ -z \"$iid\" ] &&\
    \ continue\n seen_dir[\"$d\"]=1\n entry=$(resolve_entry \"$d\")\n if [ -z \"$entry\" ] || [ ! -r \"$entry\" ]; then\n\
    \ echo \"installed $iid at $d: no readable entry artifact to hash, cannot integritycheck this instance\"; err=$((err+1));\
    \ continue\n fi\n ihash=$(sha256sum \"$entry\" | awk '{print $1}')\n if [ -z \"${approved_for[$iid]:-}\" ]; then\n echo\
    \ \"installed $iid at $d: unpinned, no approved-hash entry for this identity\";\nunpinned=$((unpinned+1)); continue\n\
    \ fi\n case \" ${approved_for[$iid]} \" in\n *\" $ihash \"*) echo \"installed $iid at $d: instance artifact matches an\
    \ approved\nhash\" ;;\n *) echo \"installed $iid at $d: instance artifact hash $ihash is NOT an approved\nvalue for this\
    \ identity (shadow or tampered install)\"; shadow=$((shadow+1)) ;;\n esac\n done < <(find \"$SERVERS_ROOT\" \\( -name\
    \ server.json -o -name package.json \\) -print\n2>/dev/null)\nfi\nif [ \"$fail\" -gt 0 ] || [ \"$unpinned\" -gt 0 ] ||\
    \ [ \"$shadow\" -gt 0 ]; then\n echo \"FAIL: $fail recorded mismatch(es), $shadow unapproved installed instance(s),\n\
    $unpinned unpinned install(s) across $checked pinned record(s)\"\nelif [ \"$err\" -gt 0 ]; then\n echo \"ERROR: $err artifact(s)\
    \ could not be verified across $checked pinned\nrecord(s), not a PASS\"\nelse\n echo \"PASS: every pinned record matches\
    \ and every installed instance maps to an\napproved hash for its identity\"\nfi\n Page 259\nThis Recommendation is compliant\
    \ when every pinned server's artifact matches the\nhash recorded for its own identity and no installed server is unpinned.\
    \ The per-server\nlines are diagnostics and the final line is the single verdict. Confirm separately that the\nhost or\
    \ gateway refuses to start a server on a hash mismatch and that an update\ntriggers re-vetting rather than automatic approval,\
    \ which the audit calls for but does not\nitself enforce."
  remediation: 'Record the SHA-256 hash of each approved third-party server artifact, including its

    dependency bundle, in the capability baseline, keyed to the server''s server.json

    name. Take the value from a native SHA-256 pin where one exists (mcpb

