    \ | while IFS= read -r\nd; do printf '%s' \"$d\" | jq -e 'select(.id==1)' >/dev/null 2>&1 && { printf '%s'\n\"$d\"; break;\
    \ }; done)\nfi\n[ -n \"$obj\" ] || { echo \"ERROR: no JSON-RPC response with id 1 in prompts/list\nreply\"; exit 0; }\n\
    count=$(printf '%s' \"$obj\" | jq '.result.prompts | length' 2>/dev/null)\n[ -n \"$count\" ] && [ \"$count\" != \"null\"\
    \ ] || { echo \"ERROR: prompts/list returned no\nprompts array\"; exit 0; }\n[ \"$count\" -gt 0 ] || { echo \"ERROR: no\
    \ prompts advertised, confirm whether the\nserver exposes prompts\"; exit 0; }\nbadargs=$(printf '%s' \"$obj\" | jq '[.result.prompts[]?\
