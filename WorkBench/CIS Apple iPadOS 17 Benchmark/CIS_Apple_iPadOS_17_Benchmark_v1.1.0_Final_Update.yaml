  title: (L1) Ensure "Allow iCloud backup" is set to "Disabled"
  scoring: scored
  profile:
  - Level 1 - Institutionally-Owned Devices
  description: This recommendation pertains to allowing iCloud backup. This recommendation does block educational institutions
    from being able to use iCloud backup with devices issued to students. Because of this, we do not recommend educational
    institutions enable this recommendation for those devices.
  rationale: iCloud backups are encrypted in transit and at rest within Apple's infrastructure, but there is no protection
    against restoring a backup to an unmanaged device. This potentially allows for data leakage. Use of back-ups is strongly
    advised as they allow to create a copy of data that can be recovered in the event of failures, such as hardware or software
    failure, data corruption, or a human-caused event, or accidental deletion of data. Back-up copies allow data to be restored
    from an earlier point in time to help recovering from an unexpected event.
