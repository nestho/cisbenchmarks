- id: 2.2.1.3
  title: (L1) Ensure "Allow managed apps to store data in iCloud" is set to "Disabled"
  scoring: scored
  profile:
  - Level 1 - End-User Owned Devices
  description: This recommendation pertains to managed applications storing and syncing data through iCloud.
  rationale: This recommendation addresses data leakage. It prevents a user from installing an application that is managed
    by the organization on a personal device and allowing iCloud to sync the managed application's data to the personal, non-managed
    application.
  impact: Syncing managed application data between multiple managed devices will not be possible.
  references: []
