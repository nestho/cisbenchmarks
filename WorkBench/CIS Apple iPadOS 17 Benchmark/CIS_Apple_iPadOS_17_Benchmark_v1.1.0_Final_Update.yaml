- id: 4.1.5
  title: (L2) Review Airprint
  scoring: manual
  profile:
  - Level 2 - End-User Owned Devices
  - Level 2 - Institutionally-Owned Devices
  description: This recommendation pertains to Apple's AirPrint, a feature for printing without installing printer-specific
    drivers.
  rationale: AirPrint does not enforce managed boundaries for printers. This allows the device to connect to any AirPrint
    compatible printer, which may result in data leakage.
  impact: End users may be inconvenienced by disabling AirPrint on their personal devices since they may already be using
    Airprint compatible printers in their homes.
  references: []
  page_start: 213
  audit_raw: 'From the Configuration Profile:

    1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left window pane, click on the Restrictions tab.

    4. In the right window pane, verify that under the tab Functionality, that the

    checkbox for Allow AirPrint (supervised only) is unchecked.

    Or, from the device:

    1. Tap Settings.

    2. Tap General.

    3. Tap VPN & Device Management.

    4. Tap <_Profile Name_>.

    5. Tap Restrictions.

    6. Confirm AirPrint is not allowed is displayed.'
  remediation: '1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left window pane, click on the Restrictions tab.

    4. In the right window pane, under the tab Functionality, uncheck the checkbox for

    Allow AirPrint (supervised only).

    5. Deploy the Configuration Profile.'
  checks:
  - type: manual_review
    info: 'From the Configuration Profile:

      1. Open Apple Configurator.

      2. Open the Configuration Profile.

      3. In the left window pane, click on the Restrictions tab.

      4. In the right window pane, verify that under the tab Functionality, that the

      checkbox for Allow AirPrint (supervised only) is unchecked.

      Or, from the device:

      1. Tap Settings.

      2. Tap General.

      3. Tap VPN & Device Management.

      4. Tap <_Profile Name_>.

      5. Tap Restrictions.

      6. Confirm AirPrint is not allowed is displayed.'
    severity: medium
- id: 4.1.6
  title: (L2) Ensure "Stolen Device Protection" Is Enabled
  scoring: manual
  profile:
  - Level 2 - End-User Owned Devices
  description: 'With the release of iOS and iPadOS 17.3, Apple added the ability to restrict when a passcode can be reset.
    Turning this on will protect a user if their phone is stolen and the thief has obtained the user''s passcode. If the passcode
    is compromised, a user''s iCloud credentials can be reset or altered, giving access to the user''s AppleID. To access
    your significant locations follow this guide: Delete significant locations on iPhone. To learn more about what access
    to an AppleID allows: Where can I use my Apple ID?'
  rationale: Requiring a user to be in a significant location to reset the passcode can hinder (or thwart) the takeover of
    a user's identity, through iCloud, in the case of a stolen device.
  impact: This could cause an issue for the user if they are trying to change their passcode outside of their significant
    location(s).
  references:
  - 1. https://9to5mac.com/2024/01/22/turn-on-iphone-stolen-device-protection/
  - 2. https://tidbits.com/2024/01/25/turn-on-stolen-device-protection-in-ios-17-3/
  page_start: 215
  audit_raw: 'From the device:

    1. Tap Settings

    2. Tap Face ID & Passcode

    3. Enter the passcode

    4. Tap Stolen Device Protection.

    5. Verify Stolen Device Protection is enabled.'
  remediation: 'From the device:

    1. Tap Settings

    2. Tap Face ID & Passcode

    3. Enter the passcode

    4. Tap Stolen Device Protection

    5. Enable Stolen Device Protection'
  checks:
  - type: manual_review
    info: 'From the device:

      1. Tap Settings

      2. Tap Face ID & Passcode

      3. Enter the passcode

      4. Tap Stolen Device Protection.

      5. Verify Stolen Device Protection is enabled.'
    severity: medium
- id: '4.2'
  title: (L1) Ensure device is not obviously jailbroken or compromised
  scoring: manual
  profile:
  - Level 1 - End-User Owned Devices
  - Level 1 - Institutionally-Owned Devices
  description: This recommendation pertains to inspecting a device for the presence of the most common jailbreak indicator.
  rationale: Apple imposes certain restrictions on which apps can be installed on a device. Further, no app can gain access
    to information and data on the device or another app without being given authorization. This restricts the potential risk
    of unauthorized access by an app due to the limited administrative rights allowed by Apple. A compromised iOS device,
    both unintentionally in the event of a malicious actor and willingly as for jailbroken devices, may circumvent the above
    restrictions and in doing so may execute arbitrary code, compromise configuration profile requirements, or open the device
    to exploits that are otherwise not possible.
  impact: ''
  references: []
  page_start: 217
  audit_raw: 'The ways a device is compromised change over time, thus it may prove to be hard

    detecting a compromised device. However, there are some indicators that are

    suspiscious and might mean an iOS device is no longer genuine.

    1. Suspicious apps are installed on the device.

    2. High data usage.

    3. The device is hot or overheats.

    4. High battery drain.

    5. Poor overall performance.

    6. Unrecongnized calls/texts.

    For jailbroken devices, the additional checks below can be run:

    1. From the Home Screen, swipe down to open Spotlight.

    2. Enter Cydia, Sileo, and checkra1n.

    3. Confirm every time that Spotlight results do not return any of the apps above.'
  remediation: 'Restore the iOS to a known good state from a trusted computer:

    1. Open iTunes.

    2. Connect the iOS device to the computer with a USB cable.

    3. Select your iOS device within iTunes.

    4. Select Restore iPhone/iPad.

    5. After restoration, set up as a new device or restore from a known good backup.'
  checks:
  - type: manual_review
    info: 'The ways a device is compromised change over time, thus it may prove to be hard

      detecting a compromised device. However, there are some indicators that are

      suspiscious and might mean an iOS device is no longer genuine.

      1. Suspicious apps are installed on the device.

      2. High data usage.

      3. The device is hot or overheats.

      4. High battery drain.

      5. Poor overall performance.

      6. Unrecongnized calls/texts.

      For jailbroken devices, the additional checks below can be run:

      1. From the Home Screen, swipe d'
    severity: medium
