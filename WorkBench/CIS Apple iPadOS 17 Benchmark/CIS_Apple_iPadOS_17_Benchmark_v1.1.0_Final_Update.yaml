controls:
- id: 2.1.1
  title: (L1) Ensure a "Consent Message" has been "Configured"
  scoring: scored
  profile:
  - Level 1 - End-User Owned Devices
  description: This recommendation pertains to the configuration of a consent message shown at the time of a configuration
    profile installation. Typically, the enrollment of devices into a Mobile Device Management (MDM) solution requires users
    to provide their approval. Such approval can waive the need of a consent message. The enrolled MDM must be the organization
    approved MDM.
  rationale: In this section of the benchmark, recommendations are for devices that are owned by the end user. They are voluntarily
    accepting the configuration profile and should be provided an explicit opportunity to consent.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'From the Configuration Profile:

    1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left window pane, click on the General tab.

    4. In the right window pane, verify that under the heading Consent Message, there is

    an appropriate consent message configured.

    There is no method to determine if the installed configuration profile included a consent

    message from the device.'
  remediation: '1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left window pane, click on the General tab.

    4. In the right window pane, under the heading Consent Message, insert an

    appropriate consent message.

    5. Deploy the Configuration Profile.'
  checks:
  - type: manual_review
    info: 'From the Configuration Profile:

      1. Open Apple Configurator.

      2. Open the Configuration Profile.

      3. In the left window pane, click on the General tab.

      4. In the right window pane, verify that under the heading Consent Message, there is

      an appropriate consent message configured.

      There is no method to determine if the installed configuration profile included a consent

      message from the device.'
    severity: medium
- id: 2.1.2
  title: (L1) Ensure "Controls when the profile can be removed" is set to "Always"
  scoring: manual
  profile:
  - Level 1 - End-User Owned Devices
  description: This recommendation pertains to the removal of a given configuration profile.
  rationale: In this section of the benchmark, recommendations are for devices that are owned by the end user. They are voluntarily
    accepting the configuration profile and should be able to remove it at will.
  impact: 'Having a user removing a configuration profile can have impacts for both the organization and the user: the former
    might lose visibility/control over the device owned by the user, whilst the latter might lose access to the systems due
    to the removal of the configuration profile.'
  references: []
  page_start: 23
  audit_raw: 'From the Configuration Profile:

    1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left window pane, click on the General tab.

    4. In the right window pane, verify that under the heading Security, the menu

    Controls when the profile can be removed is set to Always.

    Or, from the device:

    1. Tap Settings.

    2. Tap General.

    3. Tap VPN & Device Management.

    4. Tap <_Profile Name_>.

    5. Tap Restrictions.

    6. Verify Remove Profile is displayed near the bottom of the screen.'
  remediation: '1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left window pane, click on the General tab.

    4. In the right window pane, under the heading Security, set the menu Controls

    when the profile can be removed to Always.

    5. Deploy the Configuration Profile.'
  checks:
  - type: manual_review
    info: 'From the Configuration Profile:

      1. Open Apple Configurator.

      2. Open the Configuration Profile.

      3. In the left window pane, click on the General tab.

      4. In the right window pane, verify that under the heading Security, the menu

      Controls when the profile can be removed is set to Always.

      Or, from the device:

      1. Tap Settings.

      2. Tap General.

      3. Tap VPN & Device Management.

      4. Tap <_Profile Name_>.

      5. Tap Restrictions.

      6. Verify Remove Profile is displayed near the bottom of the screen.'
    severity: medium
