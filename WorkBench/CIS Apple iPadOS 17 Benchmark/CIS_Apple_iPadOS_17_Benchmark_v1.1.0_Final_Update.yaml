  title: (L1) Ensure "Force automatic date and time" is set to "Enabled"
  scoring: manual
  profile:
  - Level 1 - End-User Owned Devices
  description: It is possible to automatically set the date and time on devices running iOS 12 and later. The time zone updates
    only when the device can determine its location, such as when a device has a cellular connection or a Wi-Fi connection
    with location services enabled.
  rationale: Correct date and time settings are required for authentication protocols, file creation, modification dates,
    and log entries.
  impact: When this option is enabled, users can’t turn off Set Automatically under General > Date & Time
