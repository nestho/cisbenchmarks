- id: '4.1'
  title: Privacy & Security 4.1.1 (L1) Review Manage Sharing & Access
  scoring: manual
  profile:
  - Level 1 - End-User Owned Devices
  - Level 1 - Institutionally-Owned Devices
  description: Managing Sharing & Access is a new feature available with iOS 16, which allows via a wizard to review what
    is being shared with people and apps to determine if current settings are adequate or if some access needs to be revoked.
    It also allows to review the settings related to a user's Apple ID.
  rationale: By regularly reviewing what is being shared with apps and people, and by reviewing the Apple ID settings, users
    can ensure sharing settings are accurate and fit for purpose as well as their Apple ID is kept safe.
  impact: ''
  references:
  - 1. https://support.apple.com/en-lb/guide/personalsafety/ips16ea6f2fe/1.0/web/1.0#ips3a9e8e23f
  - 2. https://support.apple.com/en-lb/guide/personal-safety/welcome/web
  page_start: 204
  audit_raw: 'From the device:

    1. Tap Settings.

    2. Tap Privacy & Secuurity.

    3. Tap Safety Check.

    4. Tap Manage Sharing & Access.

    5. Tap Continue.

    6. Go through the 3 steps to review the settings.

    7. Tap Done at the end of the procedure.'
  remediation: 'From the device:

    1. Tap Settings.

    2. Tap Privacy & Secuurity.

    3. Tap Safety Check.

    4. Tap Manage Sharing & Access.

    5. Tap Continue.

    6. Remove sharing from any applications or people that are outside your

    organization''s requirements

    7. Tap Done at the end of the procedure.'
  checks:
  - type: manual_review
    info: 'From the device:

      1. Tap Settings.

      2. Tap Privacy & Secuurity.

      3. Tap Safety Check.

      4. Tap Manage Sharing & Access.

      5. Tap Continue.

      6. Go through the 3 steps to review the settings.

      7. Tap Done at the end of the procedure.'
    severity: medium
- id: 4.1.2
  title: (L2) Review Emergency Reset
  scoring: manual
  profile:
  - Level 2 - End-User Owned Devices
  - Level 2 - Institutionally-Owned Devices
  description: Emergency Reset is a one-tap option that allows to protect a user by revoking everything an iOS device is sharing
    all people and apps; this includes things like location information, home data, photo albums and more. Emergency Reset
    also allows to remove all emergency contacts and reset user's Apple ID and password, so no one can log into their account.
  rationale: Emergency Reset is designed for people who are experiencing or at risk of domestic abuse, but it’s also useful
    for anyone who has ever shared their location or data with partners in the past. The tool is a centralized dashboard of
    controls meant to simplify resetting privacy permissions, revoking location access and auditing data sharing. Monitoring
    smartphones is a common tactic in domestic-abuse situations because it takes advantage of everyday tools, such as iCloud
    or location sharing. By cutting off an abuser’s access to a device it is possible mitigating the risks of being stalked
    or exposed.
  impact: ''
  references:
  - 1. https://support.apple.com/en-lb/guide/personalsafety/ips16ea6f2fe/1.0/web/1.0#ips3a9e8e23f
  - 2. https://support.apple.com/en-lb/guide/personal-safety/welcome/web
  page_start: 207
  audit_raw: There is no way to audit Emergency Reset since it is not a state that can be set.
  remediation: 'From the device:

    1. Tap Settings.

    2. Tap Privacy & Secuurity.

    3. Tap Safety Check.

    4. Tap Emergency Reset.

    5. Tap Start Emergency Reset.

    6. Follow the onscreen instructions until the procedure is complete.'
  checks:
  - type: manual_review
    info: There is no way to audit Emergency Reset since it is not a state that can be set.
    severity: medium
- id: 4.1.3
  title: (L2) Review Lockdown Mode
  scoring: manual
  profile:
  - Level 2 - End-User Owned Devices
  - Level 2 - Institutionally-Owned Devices
  description: Lockdown Mode is a new operational model made available with iOS. It ensures a high level of security by limiting
    or disabling a nummber of features of the device Lockdown Mode blocks most attachment types in Messages, blocks FaceTime
    calls from non-contacts, limits web browsing functions, prevents configuration profiles from being installed, and more,
    with a full list available in our Lockdown article.
  rationale: Lockdown Mode is meant for users who can be targeted by sophisticated cyberattacks (such as activists, journalists
    and others) and as such requires an additional level of security.
  impact: 'Lockdown Mode is not for the average user and is meant for individual operating in very specific and risky circumstances.
    When Lockdown Mode is enabled the device doesn''t work as usual: certain apps, websites and features are strictly limited
    for security and some experiences might not be available at all.'
  references:
  - 1. https://support.apple.com/en-us/HT212650
  - 2. https://techcrunch.com/2023/04/18/apple-lockdown-mode-iphone-nsopegasus/?guccounter=1
  page_start: 209
  audit_raw: 'From the device:

    1. Tap Settings.

    2. Tap Privacy & Security.

    3. Under Security, verify the status of Lockdown Mode.'
  remediation: 'From the device:

    1. Tap Settings.

    2. Tap Privacy & Security.

    3. Tap Lockdown Mode.

    4. Tap Turn On Lockdown Mode.

    5. Tap Turn On Lockdown Mode.

    6. Tap Turn On & Restart.

    7. Enter the device passcode.'
  checks:
  - type: manual_review
    info: 'From the device:

      1. Tap Settings.

      2. Tap Privacy & Security.

      3. Under Security, verify the status of Lockdown Mode.'
    severity: medium
