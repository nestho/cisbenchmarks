- id: '4.5'
  title: (L1) Review "iCloud Private Relay" settings
  scoring: manual
  profile:
  - Level 1 - End-User Owned Devices
  - Level 1 - Institutionally-Owned Devices
  description: iCloud Private Relay is a service offered by Apple as part of an iCloud+ subscription. It allows users on iOS
    15, iPadOS 15, and macOS Monterey to browse the Web more privately by hiding the user's actual IP address. The service
    makes use of a multi-hop architecture whereby a user's requests are sent through two separate internet relays, operated
    by different entities, that replace a user's original IP address. The user's IP address is visible to the network provider
    and to the first relay, which is operated by Apple. The DNS records are encrypted, so neither party can see the address
    of the website the user is trying to visit. The second relay, which is operated by a third-party content provider, generates
    a temporary IP address, decrypts the name of the website, and connects to the site. By doing so, no single party — including
    Apple — can view or collect the details of a user's browsing activity or unencrypted activity in applications.
  rationale: While browsing the Web, information contained in the Web traffic, such as DNS records and IP address, can be
    seen by a network provider and by any websites visited. This information could be used to determine a user's identity
    and build a profile of their location and browsing history. Hiding this information prevents the tracking and profiling
    of users, resulting in an increased level of privacy while browsing the Web.
  impact: iCloud Private Relay only protects connections on public internet servers, instructing the device to try to access
    the servers directly over the local network. Some entities or enterprises, however, might be required to audit all network
    traffic by policy. In this case, it is possible to block access to Private Relay. Should iCloud Private Relay be blocked,
    the user will be alerted that they need to either disable the feature or choose another network. In this scenario, users
    will still be able to use the service when they are not connected to their corporate network. The fastest and most reliable
    way to do this is to return a negative answer from the network’s DNS resolver, preventing DNS resolution for the mask.icloud.com
    and maskh2.icloud.com hostnames necessary for Private Relay traffic.
  references:
  - 1. https://www.apple.com/privacy/docs/iCloud_Private_Relay_Overview_Dec2021.
  page_start: 223
  audit_raw: 'From the device:

    1. Tap Settings.

    2. Tap <_The User''s Name_> where Apple ID, iCloud, iTunes & App Store is

    displayed beneath.

    3. Tap iCloud.

    4. Tap Private Relay.

    5. Verify that Private Relay is enabled.'
  remediation: 'From the device:

    1. Tap Settings.

    2. Tap <_The User''s Name_> where Apple ID, iCloud, iTunes & App Store is

    displayed beneath.

    3. Tap iCloud.

    4. Tap Private Relay.

    5. Enable Private Relay.'
  checks:
  - type: manual_review
    info: 'From the device:

      1. Tap Settings.

      2. Tap <_The User''s Name_> where Apple ID, iCloud, iTunes & App Store is

      displayed beneath.

      3. Tap iCloud.

      4. Tap Private Relay.

      5. Verify that Private Relay is enabled.'
    severity: medium
- id: '4.6'
  title: (L1) Review "Mail Privacy Protection" settings
  scoring: manual
  profile:
  - Level 1 - End-User Owned Devices
  - Level 1 - Institutionally-Owned Devices
  description: Mail Privacy Protection helps protect user privacy by preventing email senders from learning information about
    the activity they engage with using the Mail application. When turned on, this feature hides user IP addresses.
  rationale: By enabling Mail Privacy, senders cannot build a profile of a user's online activity or determine their location.
    Such a feature also prevents senders from seeing if users have opened the email they sent. Hiding user IP addresses prevents
    user tracking and profiling, which results in an increased level of privacy while using the Mail app.
  impact: Some entities or enterprises might be required to audit all network traffic by policy. In this case, it is possible
    to block access to Mail Privacy Protection. The fastest and most reliable way to do this is to return a negative answer
    from the network’s DNS resolver, preventing DNS resolution for the mask.icloud.com and mask-h2.icloud.com hostnames necessary
    for Mail Privacy Protection traffic. In this scenario, users will still be able to use the service when they are not connected
    to their corporate network.
  references: []
  page_start: 226
  audit_raw: 'From the device:

    1. Tap Settings.

    2. Tap Mail.

    3. Tap Privacy Protection.

    4. Verify that Protect Mail Activity is enabled.'
  remediation: 'From the device:

    1. Tap Settings.

    2. Tap Mail.

    3. Tap Privacy Protection.

    4. Enable Protect Mail Activity.'
  checks:
  - type: manual_review
    info: 'From the device:

      1. Tap Settings.

      2. Tap Mail.

      3. Tap Privacy Protection.

      4. Verify that Protect Mail Activity is enabled.'
    severity: medium
