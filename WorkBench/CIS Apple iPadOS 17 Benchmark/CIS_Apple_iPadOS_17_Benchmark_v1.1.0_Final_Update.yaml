- id: 2.2.1.8
  title: (L1) Ensure "Allow documents from managed sources in unmanaged destinations" is set to "Disabled"
  scoring: scored
  profile:
  - Level 1 - End-User Owned Devices
  description: This recommendation pertains to Apple's managed application implementation. The terms "managed" and "unmanaged"
    refer to application classifications made through Managed Open In, a feature introduced in iOS 7. Managed Open In provides
    for data containerization. Institutionally-provisioned applications are designated as managed. Applications elected by
    the end user are designated as unmanaged.
  rationale: Limiting data transfer from the managed institutional application space to the unmanaged user space may prevent
    data leakage.
  impact: ''
  references: []
  page_start: 41
  audit_raw: 'From the Configuration Profile:

