- id: 2.2.1.5
  title: (L1) Ensure "Allow personalized ads delivered by Apple" is set to "Disabled"
  scoring: manual
  profile:
  - Level 1 - End-User Owned Devices
  description: Apple provides a framework that allows advertisers to target Apple users with advertisements relevant to them
    and their interests by means of a unique identifier. For such personalized advertisements to be delivered, however, detailed
    information is collected, correlated, and made available to advertisers. This information is valuable to both advertisers
    and attackers and has been used with other metadata to reveal users' identities.
  rationale: Disabling the use of a unique identifier helps hinder the tracking of users, which in turn supports protection
    of user data.
  impact: Users will see generic advertising rather than targeted advertising. Apple warns that this will reduce the number
    of relevant ads.
  references: []
  page_start: 35
  audit_raw: 'From the Configuration Profile:

    1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left window pane, click on the Restrictions tab.

    4. In the right window pane, verify that under the tab Functionality, that the

    checkbox for Allow personalized ads delivered by Apple is unchecked.

    Or, from the device:

    1. Tap Settings.

    2. Tap General.

    3. Tap VPN & Device Management.

    4. Tap <_Profile Name_>.

    5. Tap Restrictions.

    6. Confirm Apple personalized advertising not allowed is displayed.'
  remediation: '1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left window pane, click on the Restrictions tab.

    4. In the right window pane, under the tab Functionality, uncheck the checkbox for

    Allow personalized ads delivered by Apple.

    5. Deploy the Configuration Profile.'
  checks:
