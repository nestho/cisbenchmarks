  description: This recommendation pertains to passcode requirements. A simple passcode is defined as containing repeated
    characters, or increasing/decreasing characters (such as 123 or CBA).
  rationale: Simple passcodes such as those with repeating, ascending, or descending character sequences are easily guessed.
    Preventing the selection of passwords containing such sequences increases the complexity of the passcode and reduces the
    ease with which an attacker may attempt to guess the passcode in order to gain access to the device.
