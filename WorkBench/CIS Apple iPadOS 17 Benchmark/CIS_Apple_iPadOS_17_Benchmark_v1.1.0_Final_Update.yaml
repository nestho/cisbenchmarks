- id: 2.2.1.4
  title: (L1) Ensure "Force encrypted backups" is set to "Enabled"
  scoring: scored
  profile:
  - Level 1 - End-User Owned Devices
  description: This recommendation pertains to iTunes backup encryption of iOS and iPadOS devices.
  rationale: Data that are stored securely on an iOS or iPadOS device may be trivially accessed from a local computer backup.
    Forcing the encryption of backups protects data from being compromised if the local host computer is compromised. Use
    of back-ups is strongly advised as they allow to create a copy of data that can be recovered in the event of failures,
    such as hardware or software failure, data corruption, human-caused event, or accidental deletion of data. Back-up copies
    allow data to be restored from an earlier point in time to help recovering from an unexpected event.
  impact: End users must configure a password for the encrypted backup, the complexity of which is not managed.
  references: []
  page_start: 33
  audit_raw: 'From the Configuration Profile:

    1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left window pane, click on the Restrictions tab.

    4. In the right window pane, verify that under the tab Functionality, the checkbox

    for Force encrypted backups is checked.

    Or, from the device:

    1. Tap Settings.

    2. Tap General.

    3. Tap VPN & Device Management.

    4. Tap <_Profile Name_>.

    5. Tap Restrictions.

    6. Confirm Encrypted backups enforced is displayed.'
  remediation: '1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left window pane, click on the Restrictions tab.

    4. In the right window pane, under the tab Functionality, check the checkbox for

    Force encrypted backups.

    5. Deploy the Configuration Profile.'
  checks:
  - type: manual_review
    info: 'From the Configuration Profile:

