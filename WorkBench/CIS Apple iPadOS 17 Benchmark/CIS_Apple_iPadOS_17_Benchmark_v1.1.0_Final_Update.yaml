  - Level 1 - Institutionally-Owned Devices
  description: This recommendation pertains to the automatic installation of operating system updates.
  rationale: System updates may patch software vulnerabilities, therefore it is important that devices are kept up-to-date.
  impact: 'In the following circumstances automatic updates should be kept disabled: • If the organization leverages third-party
    tools to manage software updates for Apple devices, • If the organization has a strict patch management process, which
    involves testing the software updates on pilot devices before an exhaustive roll-out.'
