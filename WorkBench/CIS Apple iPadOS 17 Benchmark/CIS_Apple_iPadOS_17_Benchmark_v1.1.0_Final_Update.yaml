- id: '4.9'
  title: (L2) Ensure the latest iOS device architecture is used by highvalue targets
  scoring: manual
  profile:
  - Level 2 - End-User Owned Devices
  - Level 2 - Institutionally-Owned Devices
  description: This recommendation pertains to the physical device(s) used by high-value targets.
  rationale: Physical security exploits against iOS devices are rarely demonstrated within two years of the release of the
    underlying architecture. For users whose physical iOS device(s) may be targeted, it is prudent to use the most recently
    released architecture.
  impact: ''
  references: []
  page_start: 231
  audit_raw: 'Ensure the device(s) deployed to high-value targets are of the latest generation

    architecture.'
  remediation: 'Replace the device(s).

    As of publication, the latest iOS device architectures are:

    • iPhone 13 and iPhone 13 Mini using the Apple A15 Bionic processor

    • iPhone 13 Pro and iPhone 13 Pro Max using the Apple A15 Bionic processor

    • iPad Mini 8.3" using the Apple A15 Bionic processor

    • iPad 10.2" using the Apple A13 Bionic processor

    • iPad Air 10.9" using the Apple A14 Bionic processor

    • iPad Pro 11" and 12.9" using the Apple M1 processor'
  checks:
  - type: manual_review
    info: 'Ensure the device(s) deployed to high-value targets are of the latest generation

      architecture.'
    severity: medium
