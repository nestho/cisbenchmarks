- id: 2.2.1.11
  title: (L2) Ensure "Allow Handoff" is set to "Disabled"
  scoring: scored
  profile:
  - Level 2 - End-User Owned Devices
  description: This recommendation pertains to Apple's Handoff data-sharing mechanism.
  rationale: Handoff does not enforce managed application boundaries. This allows managed application data to be moved to
    the unmanaged application space on another device, which may result in data leakage.
  impact: End users may be inconvenienced by disabling Handoff on their personal devices.
