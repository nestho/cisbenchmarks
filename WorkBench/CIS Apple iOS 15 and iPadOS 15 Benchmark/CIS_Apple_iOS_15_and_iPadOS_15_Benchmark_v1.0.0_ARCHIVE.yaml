- id: 2.2.1.3
  title: (L1) Ensure 'Allow managed apps to store data in iCloud' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 - End-User Owned Devices
  description: This recommendation pertains to managed apps storing and syncing data through iCloud.
  rationale: This recommendation addresses data leakage. It prevents a user from installing an app that is managed by the
    organization on a personal device and having iCloud sync the managed app data to the personal, non-managed app.
  impact: Syncing managed app data between multiple managed devices will not be possible.
  references: []
  page_start: 27
  audit_raw: 'From the Configuration Profile:

    1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left windowpane, click on the Restrictions tab.

    4. In the right windowpane, verify that under the tab Functionality, the checkbox for

    Allow managed apps to store data in iCloud is unchecked.

    Or, from the device:

    1. Tap Settings.

    2. Tap General.

    3. Tap VPN & Device Management.

    4. Tap <_Profile Name_>.

    5. Tap Restrictions.

    6. Confirm Managed apps cloud sync not allowed is displayed.

    27 | Page'
  remediation: '1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left windowpane, click on the Restrictions tab.

    4. In the right windowpane, under the tab Functionality, uncheck the checkbox for

