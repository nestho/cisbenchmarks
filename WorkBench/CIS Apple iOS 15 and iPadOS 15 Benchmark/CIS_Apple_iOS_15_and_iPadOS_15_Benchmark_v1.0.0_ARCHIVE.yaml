- id: 2.5.1
  title: (L1) Ensure 'Disable Association MAC Randomization' is 'Configured'
  scoring: manual
  profile:
  - Level 1 - End-User Owned Devices
  - Level 1 - Institutionally-Owned Devices
  description: This recommendation pertains to disabling MAC randomization as appropriate.
  rationale: MAC randomization is a feature available from iOS 14 and it is enabled by default. Although this feature enhances
    privacy for individuals by using random and different addresses for each Wi-Fi network, it can lead to problems in some
    circumstances (captive portals, MACbased Access Control Lists, etc.). In such cases it might be needed disabling such
    a feature. This is a per-network setting, which means it can be turned off for specific networks only.
  impact: ''
  references: []
  page_start: 75
  audit_raw: 'This is a per-network configuration setting, the auditor will need to determine which

    solution is appropriate for a specific network.

    From the Configuration Profile:

    1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left windowpane, click on the Wi-Fi tab.

    4. In the right windowpane, select the relevant Wi-Fi configuration.

    5. Verify that the checkbox for Disable Association MAC Randomization is checked.

    From the device:

    1. Tap Settings.

    2. Tap Wi-Fi.

    3. Tap the relevant network.

    4. Ensure Private Addressis disabled.

    75 | Page'
  remediation: 'This remediation procedure cannot be accomplished with a checkbox, it needs to be

    applied on a per-network basis as appropriate.

    From the Configuration Profile:

    1. Open Apple Configurator.

