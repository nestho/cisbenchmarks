- id: 2.2.1.5
  title: (L1) Ensure 'Allow personalized ads delivered by Apple' is set to 'Disabled'
  scoring: manual
  profile:
  - Level 1 - End-User Owned Devices
  - Level 1 - Institutionally-Owned Devices
  description: Apple provides a framework that allows advertisers to target Apple users with advertisements relevant to them
    and their interests by means of a unique identifier. However, for such personalized advertisements to be delivered, detailed
    information is collected, correlated, and made available to advertisers. This information is valuable to both advertisers
    and attackers and has been used with other metadata to reveal users' identities.
  rationale: Disabling the use a unique identifier helps hindering the tracking of users and this in turns supports the protection
    of user's data.
  impact: Uses will see generic advertising rather than targeted advertising. Apple warns that this will reduce the number
    of relevant ads. 31 | Page
  references: []
  page_start: 31
  audit_raw: 'From the Configuration Profile:

    1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left windowpane, click on the Restrictions tab.

    4. In the right windowpane, verify that under the tab Functionality, that the

    checkbox for Allow personalized ads delivered by Apple is unchecked.

    Or, from the device:

    1. Tap Settings.

    2. Tap General.

    3. Tap VPN & Device Management.

    4. Tap <_Profile Name_>.

    5. Tap Restrictions.

    6. Confirm Apple personalized advertising not allowed is displayed.'
  remediation: '1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left windowpane, click on the Restrictions tab.

    4. In the right windowpane, under the tab Functionality, uncheck the checkbox for

    Allow personalized ads delivered by Apple.

    5. Deploy the Configuration Profile.'
  checks:
  - type: manual_review
    info: 'From the Configuration Profile:

      1. Open Apple Configurator.

      2. Open the Configuration Profile.

      3. In the left windowpane, click on the Restrictions tab.

      4. In the right windowpane, verify that under the tab Functionality, that the

