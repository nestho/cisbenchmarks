    Allow documents from managed sources in unmanaged destinations is

    unchecked.

    Or, from the device:

    1. Tap Settings.

    2. Tap General.

    3. Tap VPN & Device Management.

    4. Tap <_Profile Name_>.

    5. Tap Restrictions.

    6. Confirm Opening documents from managed to unmanaged apps not allowed is

    displayed.

    37 | Page'
