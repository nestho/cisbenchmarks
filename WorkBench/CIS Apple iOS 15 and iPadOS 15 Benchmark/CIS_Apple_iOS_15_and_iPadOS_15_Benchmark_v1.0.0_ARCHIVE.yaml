    severity: medium
- id: 2.2.1.6
  title: (L2) Ensure 'Allow users to accept untrusted TLS certificates' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 2 - End-User Owned Devices
  description: This recommendation pertains to the acceptance of untrusted TLS certificates.
  rationale: iOS devices maintain a list of trusted TLS certificate roots. An organization may add their own certificates
    to the list by way of a configuration profile. Allowing users to bypass that list and accept self-signed or otherwise
    unverified certificates may increase the likelihood of an incident.
  impact: The device automatically rejects untrusted HTTPS certificates without prompting the user. Services using self-signed
    certificates will not function.
  references: []
  page_start: 33
  audit_raw: 'From the Configuration Profile:

    1. Open Apple Configurator.

    2. Open the Configuration Profile.

    3. In the left windowpane, click on the Restrictions tab.

    4. In the right windowpane, verify that under the tab Functionality, that the

    checkbox for Allow users to accept untrusted TLS certificates is unchecked.

    Or, from the device:

    1. Tap Settings.

    2. Tap General.

    3. Tap VPN & Device Management.

    4. Tap <_Profile Name_>.

    5. Tap Restrictions.

    6. Confirm Establishing untrusted TLS connections not allowed is displayed.

    33 | Page'
  remediation: '1. Open Apple Configurator.

