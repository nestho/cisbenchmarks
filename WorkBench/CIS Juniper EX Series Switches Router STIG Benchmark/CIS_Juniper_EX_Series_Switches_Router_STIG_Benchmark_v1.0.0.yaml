    settings based on DoD security configuration or implementation guidance, including

    STIGs, NSA configuration guides, CTOs, and DTMs.

    If it is not configured in accordance with the designated security configuration settings,

    this is a finding.'
  remediation: 'Configure the router to be configured in accordance with the security configuration

    settings based on DoD security configuration or implementation guidance, including

    STIGs, NSA configuration guides, CTOs, and DTMs.'
