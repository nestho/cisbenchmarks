      \ }\n }\n then {\n log;\n syslog;\n discard;\n }\n }\n t"
    severity: medium
- id: '1.45'
  title: JUEX-RT-000450
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper PE router must be configured with Unicast Reverse Path Forwarding (uRPF) loose mode, or a firewall
    filter, enabled on all CE-facing interfaces. GROUP ID: V-254017 RULE ID: SV-254017r997527'
  rationale: The uRPF feature, and ingress firewall filters, are defenses against spoofing and denialof-service (DoS) attacks
    by verifying if the source address of any ingress packet is reachable. To mitigate attacks that rely on forged source
    addresses, all provider edge routers must enable uRPF or ingress firewall filters to guarantee that all packets received
    from a CE router contain source addresses that are in the route table.
  impact: ''
  references: []
  page_start: 159
  audit_raw: "Review the PE router configuration to determine if uRPF loose mode is enabled on all\nCE-facing interfaces.\n\
    [edit interfaces]\nge-0/0/12 {\n unit 0 {\n family inet {\n rpf-check {\n mode loose;\n }\n address <IPv4 address>/<mask>;\n\
    \ }\n family inet6 {\n rpf-check {\n mode loose;\n }\n address <IPv6 address>/<prefix>;\n }\n }\n}\nFor those platforms\
    \ that do not support uRPF, verify an ingress stateless firewall filter is\napplied to all CE-facing interfaces. Because\
    \ the prefixes assigned to each customer is\nknown, verify each customer's prefix list contains only their prefixes and\
    \ is referenced in\nan appropriate firewall filter. For example:\n[edit policy-options]\nprefix-list cust1-prefixes-ipv4\
    \ {\n 192.0.2.0/24;\n}\nprefix-list cust1-prefixes-ipv6 {\n 2001:db8:2::/64;\n}\n[edit firewall]\nfamily inet {\n filter\
    \ cust1-prefixes-ipv4 {\n term 1 {\n from {\n source-prefix-list {\n cust1-prefixes-ipv4;\n }\n }\n then accept;\n }\n\
    \ term default {\n then {\n log;\n syslog;\n discard;\n }\n }\n }\n}\nfamily inet6 {\n filter cust1-prefixes-ipv6 {\n\
    \ term 1 {\n from {\n source-prefix-list {\n cust1-prefixes-ipv6;\n }\n }\n then accept;\n }\n term default {\n then {\n\
    \ log;\n syslog;\n discard;\n }\n }\n }\n}\nVerify the appropriate filter is applied to each CE-facing interface. For\
    \ example:\n[edit interfaces]\nge-0/0/0 {\n unit 0 {\n family inet {\n filter {\n input cust1-prefixes-ipv4;\n }\n address\
    \ <IPv4 address>/<mask>;\n }\n family inet6 {\n filter {\n input cust1-prefixes-ipv6;\n }\n address <IPv6 address>/<prefix>;\n\
    \ }\n }\n}\nNote: Some Juniper devices support both monolithic filters and filter lists. Filter lists\nseparate each term,\
    \ or set of terms, into a separate filter that is applied sequentially to\nan interface. If using filter lists, the keywords\
    \ \"input\" or \"output\" change to \"input-list\" or\n\"output-list\". Verify the final list item is a deny-all filter.\
    \ The deny-all filter is created once\nper family and can be reused across multiple lists. For example:\ninput-list [\
    \ permit_mgt permit_routing_protocols default-deny ];\nIf uRPF or an ingress firewall filter is not enabled on all CE-facing\
    \ interfaces, this is a\nfinding."
  remediation: 'Enable uRPF loose mode or apply an ingress filter on all CE-facing interfaces.

    For example, configure uRPF on CE-facing interfaces:

    set interfaces ge-0/0/0 unit 0 family inet rpf-check mode loose

    set interfaces ge-0/0/0 unit 0 family inet6 rpf-check mode loose

    For example, configure firewall filter and apply to CE-facing interfaces (only for devices

    that do not support uRPF):

    set policy-options prefix-list cust1-prefixes-ipv4 192.0.2.0/24

    set policy-options prefix-list cust1-prefixes-ipv6 2001:db8:2::/64

    set firewall family inet filter cust1-prefixes-ipv4 term 1 from sourceprefix-list cust1-prefixes-ipv4

    set firewall family inet filter cust1-prefixes-ipv4 term 1 then accept

    set firewall family inet filter cust1-prefixes-ipv4 term default then log

    set firewall family inet filter cust1-prefixes-ipv4 term default then syslog

    set firewall family inet filter cust1-prefixes-ipv4 term default then discard

    set firewall family inet6 filter cust1-prefixes-ipv6 term 1 from sourceprefix-list cust1-prefixes-ipv6

    set firewall family inet6 filter cust1-prefixes-ipv6 term 1 then accept

    set firewall family inet6 filter cust1-prefixes-ipv6 term default then log

    set firewall family inet6 filter cust1-prefixes-ipv6 term default then syslog

    set firewall family inet6 filter cust1-prefixes-ipv6 term default then

    discard

    set interfaces ge-0/0/0 unit 0 family inet filter input cust1-prefixes-ipv4

    set interfaces ge-0/0/0 unit 0 family inet6 filter input cust1-prefixes-ipv6'
  checks:
  - type: manual_review
    info: "Review the PE router configuration to determine if uRPF loose mode is enabled on all\nCE-facing interfaces.\n[edit\
      \ interfaces]\nge-0/0/12 {\n unit 0 {\n family inet {\n rpf-check {\n mode loose;\n }\n address <IPv4 address>/<mask>;\n\
      \ }\n family inet6 {\n rpf-check {\n mode loose;\n }\n address <IPv6 address>/<prefix>;\n }\n }\n}\nFor those platforms\
      \ that do not support uRPF, verify an ingress stateless firewall filter is\napplied to all CE-facing interfaces. Because\
      \ the prefixes assigned to each customer is\nknown, "
    severity: medium
- id: '1.46'
  title: JUEX-RT-000460
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper out-of-band management (OOBM) gateway must be configured to transport management traffic to the
    Network Operations Center (NOC) via dedicated circuit, MPLS/VPN service, or IPsec tunnel. GROUP ID: V-254018 RULE ID:
    SV-254018r997528'
  rationale: Using dedicated paths, the OOBM backbone connects the OOBM gateway routers located at the edge of the managed
    network and at the NOC. Dedicated links can be deployed using provisioned circuits or MPLS layer 2 and layer 3 VPN services
    or implementing a secured path with gateway-to-gateway IPsec tunnels. The tunnel mode ensures that the management traffic
    will be logically separated from any other traffic traversing the same path.
  impact: ''
  references: []
  page_start: 163
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the network topology diagram to determine\
    \ connectivity between the managed\nnetwork and the NOC.\nReview the OOBM gateway router configuration to validate the\
    \ path and interface that\nthe management traffic traverses. MPLS-based VPN (L2 or L3) must have a working\nprovider MPLS\
    \ network including routing (for reachability) and Label Switched Paths\n(LSP). Additionally, the PE router will maintain\
    \ separation for each CE router in\nindividual routing instances. If using a dedicated circuit, verify the interface transporting\n\
    NOC traffic is properly connected.\nCE routers will not peer with PE routers when using L2 VPN. Verify the CE router peers\n\
    with the appropriate CE router, generally with an IGP (e.g., OSPF), and not the PE\nrouter.\n[edit interfaces]\n<exterior\
    \ interface> {\n unit <number> {\n family inet {\n address <IPv4 address>/<mask>;\n }\n }\n}\nlo0 {\n unit 0 {\n family\
    \ inet {\n address <IPv4 address>/32;\n }\n }\n}\n[edit protocols ospf]\narea <number> {\n interface lo0.0;\n interface\
    \ <exterior interface>.<number>;\n}\nCE routers will peer with PE routers, generally with eBGP, when using L3 VPN. Verify\n\
    the CE router advertises the appropriate interior networks to the PE.\n[edit interfaces]\n<exterior interface>:0 {\n unit\
    \ <number> {\n family inet {\n address <IPv4 address>/<mask>;\n }\n }\n}\nlo0 {\n family inet {\n address <IPv4 address>/<mask>;\n\
    \ }\n}\n[edit routing-options]\nrouter-id <ID>;\nautonomous-system <AS #>;\n[edit protocols bgp]\ngroup PE1 {\n type external;\n\
    \ export <policy name>;\n peer-as <peer AS #>;\n neighbor <neighbor address>; << Reachable from the exterior interface\n\
    }\n[edit policy-options policy-statement <statement name>]\nterm 1 {\n from {\n protocol <protocol>; << Include the appropriate\
    \ protocol (e.g.,\n'direct' for directly connected routes)\n route-filter <subnet>/<mask> <match condition>; << Include\
    \ only\ninterior routes that must be advertised to the L3 VPN\n }\n then accept;\n}\nNote: The policy-statement is applied\
    \ as an export filter, using a route-filter to limit the\nexported routes. For example, assume 192.0.2.0/24 is the advertised\
    \ route, and that it\nis directly connected. Using \"protocol direct\" will export all directly-connected routes, but\n\
    no routes learned via an IGP (e.g., OSPF). Using \"route-filter 192.0.2.0/24 orlonger then\naccept\" will accept that\
    \ /24 (or longer mask) and deny all others. Verify the match\ncondition is appropriate for the desired advertisement.\n\
    If management traffic is not transported between the managed network and the NOC\nvia dedicated circuit, MPLS/VPN service,\
    \ or IPsec tunnel, this is a finding."
  remediation: 'This requirement is not applicable for the DODIN Backbone.

    CE peering to CE (L2 VPN):

    set interfaces <exterior interface> unit <number> family inet address <IPv4

    address>/<mask>

    set interfaces lo0 unit 0 family inet address <IPv4 address>/32

    set protocols ospf area <number> interface lo0.0

    set protocols ospf area <number> interface <exterior interface>

    CE peering to PE (L3 VPN):

    set system host-name ce1

    set interfaces <exterior interface>:<number> description "Link from CE1 to

    PE1 for L3vpn"

    set interfaces <exterior interface>:<number> unit <number> family inet

    address <IPv4 address>/<mask>

    set interfaces lo0 unit 0 family inet address <IPv4 address>/32

    set routing-options router-id <ID>

    set routing-options autonomous-system <AS #>

    set protocols bgp group <name> type external

    set protocols bgp group <name> export <policy name>

    set protocols bgp group <name> peer-as <Peer AS #>

    set protocols bgp group <name> neighbor <neighbor address>

    set policy-options policy-statement <policy name> term 1 from protocol

    <protocol>

    set policy-options policy-statement <policy name> term 1 from route-filter

    <subnet> <match criterion>

    set policy-options policy-statement <policy name> term 1 then accept

    Ensure that a dedicated circuit, MPLS/VPN service, or IPsec tunnel is deployed to

    transport management traffic between the managed network and the NOC.'
  checks:
  - type: manual_review
    info: 'This requirement is not applicable for the DODIN Backbone.

      Review the network topology diagram to determine connectivity between the managed

      network and the NOC.

      Review the OOBM gateway router configuration to validate the path and interface that

      the management traffic traverses. MPLS-based VPN (L2 or L3) must have a working

      provider MPLS network including routing (for reachability) and Label Switched Paths

      (LSP). Additionally, the PE router will maintain separation for each CE router in

      individ'
    severity: medium
- id: '1.47'
  title: JUEX-RT-000470
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper out-of-band management (OOBM) gateway router must be configured to forward only authorized management
    traffic to the Network Operations Center (NOC). GROUP ID: V-254019 RULE ID: SV-254019r844090'
  rationale: The OOBM network is an IP network used exclusively for the transport of OAM&P data from the network being managed
    to the OSS components located at the NOC. Its design provides connectivity to each managed network device, enabling network
    management traffic to flow between the managed network elements and the NOC. This allows the use of paths separate from
    those used by the managed network.
  impact: ''
  references: []
  page_start: 167
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the network topology diagram to determine\
    \ connectivity between the managed\nnetwork and the NOC.\nReview the OOBM gateway router configuration to validate the\
    \ path that the\nmanagement traffic traverses.\nVerify that only management traffic is forwarded through the OOBM interface\
    \ or IPsec\ntunnel. Verify the destination address is configured either via a prefix-list or directly\nassigned addresses\
    \ in each firewall filter term match condition.\n[edit policy-options]\nprefix-list NOC-ipv4 {\n <IPv4 address>/<mask>;\n\
    }\nprefix-list NOC-ipv6 {\n <IPv6 address>/<prefix>;\n}\n[edit firewall]\nfamily inet {\n filter permit-NOC-ipv4 {\n term\
    \ 1 {\n from {\n destination-prefix-list {\n NOC-ipv4;\n }\n protocol <protocol>;\n destination-port [ <port 1> <port\
    \ 2> ];\n }\n then accept;\n }\n <additional permitted traffic terms>\n term default {\n then {\n log;\n syslog;\n discard;\n\
    \ }\n }\n }\n}\nfamily inet6 {\n filter permit-NOC-ipv6 {\n term 1 {\n from {\n destination-prefix-list {\n NOC-ipv6;\n\
    \ }\n next-header <protocol>;\n destination-port [ <port 1> <port 2> ];\n }\n then accept;\n }\n <additional permitted\
    \ traffic terms>\n term default {\n then {\n log;\n syslog;\n discard;\n }\n }\n }\n}\n[edit interfaces]\n<OOBM interface>\
    \ {\n unit <number> {\n family inet {\n filter {\n output NOC-ipv4;\n }\n address <IPv4 address>/<mask>;\n }\n family\
    \ inet6 {\n filter {\n output NOC-ipv6;\n }\n address <IPv6 address>/<prefix>;\n }\n }\n}\nNote: Some Juniper devices\
    \ support both monolithic filters and filter lists. Filter lists\nseparate each term, or set of terms, into a separate\
    \ filter that is applied sequentially to\nan interface. If using filter lists, the keywords \"input\" or \"output\" change\
    \ to \"input-list\" or\n\"output-list\". Verify the final list item is a deny-all filter. The deny-all filter is created\
    \ once\nper family and can be reused across multiple lists. For example:\ninput-list [ permit_mgt permit_routing_protocols\
    \ default-deny ];\nIf using an IPsec tunnel, verify the route with the tunnel interface as the next-hop\ndestination.\n\
    [edit routing-options]\nrib inet6.0 {\n static {\n route <NOC IPv6 network> next-hop <(tunnel interface | NOC IPv6\ntunnel\
    \ endpoint address)>;\n }\n}\nstatic {\n route <NOC IPv4 network> next-hop <(tunnel interface | NOC IPv6 tunnel\nendpoint\
    \ address)>;\n}\nIf traffic other than authorized management traffic is permitted through the OOBM\ninterface or IPsec\
    \ tunnel, this is a finding."
  remediation: 'Configure appropriate prefix lists and firewall filters. For example:

    set policy-options prefix-list NOC-ipv4 <IPv4 network>/<mask>

    set policy-options prefix-list NOC-ipv6 <IPv6 network>/<prefix>

    set firewall family inet filter permit-NOC-ipv4 term 1 from destinationprefix-list NOC-ipv4

    set firewall family inet filter permit-NOC-ipv4 term 1 from protocol

    <protocol>

    set firewall family inet filter permit-NOC-ipv4 term 1 from destination-port

    [ <port 1> <port 2> ]

    set firewall family inet filter permit-NOC-ipv4 term 1 then accept

    <additional permit terms>

    set firewall family inet filter permit-NOC-ipv4 term default then log

    set firewall family inet filter permit-NOC-ipv4 term default then syslog

    set firewall family inet filter permit-NOC-ipv4 term default then discard

    set firewall family inet6 filter permit-NOC-ipv6 term 1 from destinationprefix-list NOC-ipv6

    set firewall family inet6 filter permit-NOC-ipv6 term 1 from next-header

    <protocol>

    set firewall family inet6 filter permit-NOC-ipv6 term 1 from destination-port

    [ <port 1> <port 2> ]

    set firewall family inet6 filter permit-NOC-ipv6 term 1 then accept

    <additional permit terms>

    set firewall family inet6 filter permit-NOC-ipv6 term default then log

    set firewall family inet6 filter permit-NOC-ipv6 term default then syslog

    set firewall family inet6 filter permit-NOC-ipv6 term default then discard

    Apply firewall filter to OOBM interface:

    set interfaces <OOBM interface> unit <number> family inet filter output NOCipv4

    set interfaces <OOBM interface> unit <number> family inet address <IPv4

    address>/<mask>

    set interfaces <OOBM interface> unit <number> family inet6 filter output NOCipv6

    set interfaces <OOBM interface> unit <number> family inet6 address <IPv6

    address>/<prefix>

    If using IPsec tunnel:

    set rib inet6.0 static route <NOC IPv6 network> next-hop <(tunnel interface |

    NOC IPv6 tunnel endpoint address)>

    set static route <NOC IPv4 network> next-hop <(tunnel interface | NOC IPv4

    tunnel endpoint address)>'
  checks:
  - type: manual_review
    info: 'This requirement is not applicable for the DODIN Backbone.

      Review the network topology diagram to determine connectivity between the managed

      network and the NOC.

      Review the OOBM gateway router configuration to validate the path that the

      management traffic traverses.

      Verify that only management traffic is forwarded through the OOBM interface or IPsec

      tunnel. Verify the destination address is configured either via a prefix-list or directly

      assigned addresses in each firewall filter term match cond'
    severity: medium
- id: '1.48'
  title: JUEX-RT-000480
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper out-of-band management (OOBM) gateway router must be configured to block any traffic destined
    to itself that is not sourced from the OOBM network or the NOC. GROUP ID: V-254020 RULE ID: SV-254020r844093'
  rationale: If the gateway router is not a dedicated device for the OOBM network, several safeguards must be implemented
    for containment of management and production traffic boundaries. It is imperative that hosts from the managed network
    are not able to access the OOBM gateway router.
  impact: ''
  references: []
  page_start: 172
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the firewall filter for the router receive\
    \ path.\nVerify that only traffic sourced from the OOBM network or the NOC is allowed to access\nthe router.\n[edit policy-options]\n\
    prefix-list OOBM-ipv4 {\n <IPv4 address>/<mask>;\n}\nprefix-list OOBM-ipv6 {\n <IPv6 address>/<prefix>;\n}\nprefix-list\
    \ router-ipv4 {\n <IPv4 address>/<mask>;\n}\nprefix-list router-ipv6 {\n <IPv6 address>/<prefix>;\n}\n[edit firewall]\n\
    family inet {\n filter protect-re-ipv4 {\n term 1 {\n from {\n source-prefix-list OOBM-ipv4;\n destination-prefix-list\
    \ router-ipv4;\n }\n then accept;\n }\n <additional terms for authorized traffic like OSPF or BGP>\n term default {\n\
    \ then {\n log;\n syslog;\n discard;\n }\n }\n }\n}\nfamily inet6 {\n filter protect-re-ipv6 {\n term 1 {\n from {\n source-prefix-list\
    \ OOBM-ipv6;\n destination-prefix-list router-ipv6;\n }\n then accept {\n }\n <additional terms for authorized traffic\
    \ like OSPF or BGP>\n term default {\n then {\n log;\n syslog;\n discard;\n }\n }\n }\n}\nVerify the firewall filter is\
    \ applied to the loopback interface.\n[edit interfaces]\nlo0 {\n unit 0 {\n family inet {\n filter {\n input protect-re-ipv4;\n\
    \ }\n address <IPv4 address/mask>;\n }\n family inet6 {\n filter {\n input protect-re-ipv6;\n }\n address <IPv6 address/prefix>;\n\
    \ }\n }\n}\nNote: Some Juniper devices support both monolithic filters and filter lists. Filter lists\nseparate each term,\
    \ or set of terms, into a separate filter that is applied sequentially to\nan interface. If using filter lists, the keywords\
    \ \"input\" or \"output\" change to \"input-list\" or\n\"output-list\". Verify the final list item is a deny-all filter.\
    \ The deny-all filter is created once\nper family and can be reused across multiple lists. For example:\ninput-list [\
    \ permit_mgt permit_routing_protocols default-deny ];\nIf the router does not block any traffic destined to itself that\
    \ is not sourced from the\nOOBM network or the NOC, this is a finding.\nNote: If the platform does not support the receive\
    \ path filter, verify that all non-OOBM\ninterfaces have an ingress firewall filter to restrict access to that interface\
    \ address or\nany of the router’s loopback addresses to only traffic sourced from the management\nnetwork. An exception\
    \ would be to allow packets destined to these interfaces used for\ntroubleshooting, such as ping and traceroute."
  remediation: 'This requirement is not applicable for the DODIN Backbone.

    Ensure that traffic from the managed network is not able to access the OOBM gateway

    router using either receive path or interface firewall filters.

    set policy-options prefix-list OOBM-ipv4 <IPv4 address>/<mask>

    set policy-options prefix-list OOBM-ipv6 <IPv6 address>/<prefix>

    set firewall family inet filter protect-re-ipv4 term 1 from source-prefixlist OOBM-ipv4

    set firewall family inet filter protect-re-ipv4 term 1 from destinationprefix-list router-ipv4

    set firewall family inet filter protect-re-ipv4 term 1 then accept

    <additional terms for authorized traffic like OSPF or BGP>

    set firewall family inet filter protect-re-ipv4 term default then log

    set firewall family inet filter protect-re-ipv4 term default then syslog

    set firewall family inet filter protect-re-ipv4 term default then discard

    set firewall family inet filter protect-re-ipv6 term 1 from source-prefixlist OOBM-ipv6

    set firewall family inet filter protect-re-ipv6 term 1 from destinationprefix-list router-ipv6

    set firewall family inet filter protect-re-ipv6 term 1 then accept

    <additional terms for authorized traffic like OSPF or BGP>

    set firewall family inet filter protect-re-ipv6 term default then log

    set firewall family inet filter protect-re-ipv6 term default then syslog

    set firewall family inet filter protect-re-ipv6 term default then discard

    set interfaces lo0 unit 0 family inet filter input protect-re-ipv4

    set interfaces lo0 unit 0 family inet address <IPv4 address>/<mask>

    set interfaces lo0 unit 0 family inet6 filter input protect-re-ipv6

    set interfaces lo0 unit 0 family inet6 address <IPv6 address>/<prefix>'
  checks:
  - type: manual_review
    info: "This requirement is not applicable for the DODIN Backbone.\nReview the firewall filter for the router receive path.\n\
      Verify that only traffic sourced from the OOBM network or the NOC is allowed to access\nthe router.\n[edit policy-options]\n\
      prefix-list OOBM-ipv4 {\n <IPv4 address>/<mask>;\n}\nprefix-list OOBM-ipv6 {\n <IPv6 address>/<prefix>;\n}\nprefix-list\
      \ router-ipv4 {\n <IPv4 address>/<mask>;\n}\nprefix-list router-ipv6 {\n <IPv6 address>/<prefix>;\n}\n[edit firewall]\n\
      family inet {\n filter protect-re-ipv4 {\n"
    severity: medium
- id: '1.49'
  title: JUEX-RT-000490
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to only permit management traffic that ingresses and egresses the OOBM
    interface. GROUP ID: V-254021 RULE ID: SV-254021r997529'
  rationale: The OOBM access switch will connect to the management interface of the managed network elements. The management
    interface can be a true OOBM interface or a standard interface functioning as the management interface. In either case,
    the management interface of the managed network element will be directly connected to the OOBM network. An OOBM interface
    does not forward transit traffic, thereby providing complete separation of production and management traffic. Because
    all management traffic is immediately forwarded into the management network, it is not exposed to possible tampering.
    The separation also ensures that congestion or failures in the managed network do not affect the management of the device.
    If the device does not have an OOBM interface, the interface functioning as the management interface must be configured
    so that management traffic does not leak into the managed network and that production traffic does not leak into the management
    network.
  impact: ''
  references: []
  page_start: 176
  audit_raw: "Verify that the managed interface has an inbound and outbound firewall filter\nconfigured. In this example,\
    \ the firewall filter uses prefix-lists rather than directly\nembedding the addresses in the filter term. Verify that\
    \ the ingress filter only allows\nmanagement, IGP, and ICMP traffic.\nCaveat: If the management interface is a true OOBM\
    \ interface, this requirement is not\napplicable.\n[edit policy-options]\nprefix-list OOBM-ipv4 {\n 192.0.2.0/24;\n}\n\
    prefix-list OOBM-ipv6 {\n 2001:db8:2::/64;\n}\n[edit firewall]\nfamily inet {\n filter inbound-OOBM-ipv4 {\n term 1 {\n\
    \ from {\n source-prefix-list {\n OOBM-ipv4;\n }\n protocol [ icmp ospf ];\n }\n then accept;\n }\n term 2 {\n from {\n\
    \ source-prefix-list {\n OOBM-ipv4;\n }\n protocol tcp;\n destination-port ssh;\n }\n then accept;\n }\n <additional permit\
    \ terms>\n term default {\n then {\n log;\n syslog;\n discard;\n }\n }\n }\n filter outbound-OOBM-ipv4 {\n term 1 {\n\
    \ from {\n destination-prefix-list {\n OOBM-ipv4;\n }\n protocol [ icmp ospf ];\n }\n then accept;\n }\n term 2 {\n from\
    \ {\n destination-prefix-list {\n OOBM-ipv4;\n }\n protocol tcp;\n source-port ssh;\n }\n then accept;\n }\n <additional\
    \ permit terms>\n term default {\n then {\n log;\n syslog;\n discard;\n }\n }\n }\n}\nfamily inet6 {\n filter inbound-OOBM-ipv6\
    \ {\n term 1 {\n from {\n source-prefix-list {\n OOBM-ipv6;\n }\n next-header [ icmp6 ospf ];\n }\n then accept;\n }\n\
    \ term 2 {\n from {\n source-prefix-list {\n OOBM-ipv6;\n }\n next-header tcp;\n destination-port ssh;\n }\n then accept;\n\
    \ }\n <additional permit terms>\n term default {\n then {\n log;\n syslog;\n discard;\n }\n }\n }\n filter outbound-OOBM-ipv6\
    \ {\n term 1 {\n from {\n destination-prefix-list {\n OOBM-ipv6;\n }\n next-header [ icmp6 ospf ];\n }\n then accept;\n\
