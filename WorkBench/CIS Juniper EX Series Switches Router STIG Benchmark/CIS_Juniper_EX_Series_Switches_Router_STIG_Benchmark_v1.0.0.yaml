- id: '1.61'
  title: JUEX-RT-000610
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper router must be configured to have IP directed broadcast disabled on all interfaces. GROUP ID:
    V-254033 RULE ID: SV-254033r997534'
  rationale: An IP directed broadcast is a datagram sent to the broadcast address of a subnet that is not directly attached
    to the sending machine. The directed broadcast is routed through the network as a unicast packet until it arrives at the
    target subnet, where it is converted into a link-layer broadcast. Because of the nature of the IP addressing architecture,
    only the last router in the chain, which is connected directly to the target subnet, can conclusively identify a directed
    broadcast. IP directed broadcasts are used in the extremely common and popular smurf, or denialof-service (DoS), attacks.
    In a smurf attack, the attacker sends Internet Control Message Protocol (ICMP) echo requests from a falsified source address
    to a directed broadcast address, causing all the hosts on the target subnet to send replies to the falsified source. By
    sending a continuous stream of such requests, the attacker can create a much larger stream of replies, which can completely
    inundate the host whose address is being falsified. This service should be disabled on all interfaces when not needed
    to prevent smurf and DoS attacks. Directed broadcast can be enabled on internal facing interfaces to support services
    such as Wake-On-LAN. Case scenario may also include support for legacy applications where the content server and the clients
    do not support multicast. The content servers send streaming data using UDP broadcast. Used in conjunction with the IP
    multicast helper-map feature, broadcast data can be sent across a multicast topology. The broadcast streams are converted
    to multicast and vice versa at the first-hop routers and last-hop routers before entering and leaving the multicast transit
    area respectively. The last-hop router must convert the multicast to broadcast. Hence, this interface must be configured
    to forward a broadcast packet (i.e., a directed broadcast address is converted to the all-nodes broadcast address).
  impact: ''
  references: []
  page_start: 217
  audit_raw: "Review the router configuration to determine if IP directed broadcast is enabled.\nBy default, IP directed broadcast\
