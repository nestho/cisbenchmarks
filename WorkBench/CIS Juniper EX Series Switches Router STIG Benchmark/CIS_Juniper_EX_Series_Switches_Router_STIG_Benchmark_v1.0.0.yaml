      disabled.\n[edit system ports]\nauxiliary {\n disable;\n}\nIf the auxiliary port is not disabled or is not connected\
      \ to a secured modem when it is\nenabled, this"
    severity: medium
- id: '1.12'
  title: JUEX-RT-000120
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to enforce approved authorizations for controlling the flow of information
    between interconnected networks in accordance with applicable policy. GROUP ID: V-253984 RULE ID: SV-253984r843985'
  rationale: Information flow control regulates authorized information to travel within a network and between interconnected
    networks. Controlling the flow of network traffic is critical so it does not introduce any unacceptable risk to the network
    infrastructure or data. An example of a flow control restriction is blocking outside traffic claiming to be from within
    the organization. For most routers, internal information flow control is a product of system design.
  impact: ''
  references: []
  page_start: 43
  audit_raw: "Verify each router enforces approved authorizations for controlling the flow of\ninformation between interconnected\
    \ networks in accordance with applicable policy.\nJunos enforces information flow via stateless firewall filters and unicast\
    \ Reverse Path\nForwarding (uRPF). uRPF performs a forwarding table lookup to validate the incoming\npacket's source address\
    \ is appropriate for the arriving interface. Verify uRPF is enabled\non applicable interfaces. The example shows uRPF\
    \ and the stateless firewall filter\napplied. Verify the interface and assigned addresses are appropriate for the target\n\
    environment.\n[edit interfaces]\n<interface name> {\n unit <logical unit number> {\n family inet {\n rpf-check;\n filter\
    \ {\n input deny-prod-to-mgt;\n }\n }\n family inet6 {\n rpf-check;\n filter {\n input deny-prod-to-mgt-v6;\n }\n }\n\
    \ }\n}\nNote: Some Juniper devices support both monolithic filters and filter lists. Filter lists\nseparate each term,\
    \ or set of terms, into a separate filter that is applied sequentially to\nan interface. If using filter lists, the keywords\
    \ \"input\" or \"output\" change to \"input-list\" or\n\"output-list\". Verify the final list item is a deny-all filter.\n\
    [edit firewall]\nfamily inet {\n filter deny-prod-to-mgt {\n term 1 {\n from {\n source-address {\n <production IPv4 subnet/mask>;\n\
    \ }\n destination-address {\n <MGT IPv4 subnet/mask>;\n }\n }\n then {\n log;\n syslog;\n discard;\n }\n }\n term 2 {\n\
    \ from {\n source-address {\n <production IPv4 subnet/mask>;\n }\n }\n then accept;\n }\n }\n}\nfamily inet6 {\n filter\
    \ deny-prod-to-mgt-v6 {\n term 1 {\n from {\n source-address {\n <production IPv6 subnet/prefix>;\n }\n destination-address\
    \ {\n <MGT IPv6 subnet/prefix>;\n }\n }\n then {\n log;\n syslog;\n discard;\n }\n }\n term 2 {\n from {\n source-address\
    \ {\n <production IPv6 subnet/prefix>;\n }\n }\n then accept;\n }\n }\n}\nIf the router does not enforce approved authorizations\
    \ for controlling the flow of\ninformation between interconnected networks in accordance with applicable policy, this\n\
    is a finding."
  remediation: 'Configure the router to enforce approved authorizations for controlling the flow of

    information between interconnected networks in accordance with applicable policy.

    set interfaces <interface name> unit <logical unit> family inet rpf-check

    set interfaces <interface name> unit <logical unit> family inet filter input

    deny-prod-to-mgt

    set interfaces <interface name> unit <logical unit> family inet6 rpf-check

    set interfaces <interface name> unit <logical unit> family inet6 filter input

    deny-prod-to-mgt-v6

    set firewall family inet filter deny-prod-to-mgt term 1 from source-address

    <production IPv4 subnet/mask>

    set firewall family inet filter deny-prod-to-mgt term 1 from destinationaddress <MGT IPv4 subnet/mask>

    set firewall family inet filter deny-prod-to-mgt term 1 then log

    set firewall family inet filter deny-prod-to-mgt term 1 then syslog

    set firewall family inet filter deny-prod-to-mgt term 1 then discard

    set firewall family inet filter deny-prod-to-mgt term 2 from source-address

    <production IPv4 subnet/mask>

    set firewall family inet filter deny-prod-to-mgt term 2 then accept

    set firewall family inet6 filter deny-prod-to-mgt-v6 term 1 from sourceaddress <production IPv6 subnet/prefix>

    set firewall family inet6 filter deny-prod-to-mgt-v6 term 1 from destinationaddress <MGT IPv6 subnet/prefix>

    set firewall family inet6 filter deny-prod-to-mgt-v6 term 1 then log

    set firewall family inet6 filter deny-prod-to-mgt-v6 term 1 then syslog

    set firewall family inet6 filter deny-prod-to-mgt-v6 term 1 then discard

    set firewall family inet6 filter deny-prod-to-mgt-v6 term 2 from sourceaddress <production IPv6 subnet/prefix>

    set firewall family inet6 filter deny-prod-to-mgt-v6 term 2 then accept'
  checks:
  - type: manual_review
    info: 'Verify each router enforces approved authorizations for controlling the flow of

      information between interconnected networks in accordance with applicable policy.

      Junos enforces information flow via stateless firewall filters and unicast Reverse Path

      Forwarding (uRPF). uRPF performs a forwarding table lookup to validate the incoming

      packet''s source address is appropriate for the arriving interface. Verify uRPF is enabled

      on applicable interfaces. The example shows uRPF and the stateless firewall '
    severity: medium
- id: '1.13'
  title: JUEX-RT-000130
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to disable Protocol Independent Multicast (PIM) on all interfaces that
    are not required to support multicast routing. GROUP ID: V-253985 RULE ID: SV-253985r843988'
  rationale: If multicast traffic is forwarded beyond the intended boundary, it is possible that it can be intercepted by
    unauthorized or unintended personnel. Limiting where, within the network, a given multicast group's data is permitted
    to flow is an important first step in improving multicast security. A scope zone is an instance of a connected region
    of a given scope. Zones of the same scope cannot overlap while zones of a smaller scope will fit completely within a zone
    of a larger scope. For example, Admin-local scope is smaller than Site-local scope, so the administratively configured
    boundary fits within the bounds of a site. According to RFC 4007 IPv6 Scoped Address Architecture (section 5), scope zones
    are also required to be "convex from a routing perspective"; that is, packets routed within a zone must not pass through
    any links that are outside of the zone. This requirement forces each zone to be one contiguous island rather than a series
    of separate islands. As stated in the DoD IPv6 IA Guidance for MO3, "One should be able to identify all interfaces of
    a zone by drawing a closed loop on their network diagram, engulfing some routers and passing through some routers to include
    only some of their interfaces." Therefore, it is imperative that the network engineers have documented their multicast
    topology and thereby know which interfaces are enabled for multicast. Once this is done, the zones can be scoped as required.
  impact: ''
  references: []
  page_start: 47
  audit_raw: "If IPv4 or IPv6 multicast routing is enabled, verify all interfaces enabled for PIM are\ndocumented in the network's\
    \ multicast topology diagram.\nReview the router configuration to determine if multicast routing is enabled and which\n\
    interfaces are enabled for PIM.\nBy default, PIM is not enabled on any interface. If not a PIM router, verify there is\
    \ no\nPIM stanza at [edit protocols], PIM is disabled globally and/or for all interfaces, or that\nthe stanza is inactive.\n\
    [edit protocols]\ninactive: pim { << Stanza is removed or marked inactive\n disable; << If stanza is present and not inactive,\
    \ verify globally\ndisabled\n interface all { << If stanza is present, not inactive, and not globally\ndisabled, disable\
    \ for all interfaces\n disable;\n }\n}\nFor PIM routers, verify only the required interfaces are configured. For example,\
    \ the\nfollowing configuration enables PIM on a specific interface and disables PIM for all\nothers.\n[edit protocols]\n\
    pim {\n interface <name>.<logical unit>;\n interface all {\n disable;\n }\n}\nNote: More specific interface configuration\
    \ statements are preferred. In the example, the\ninterface configuration is more specific than interface \"all\", so PIM\
    \ is enabled only on\nthat interface.\nIf an interface is not required to support multicast routing and it is enabled,\
    \ this is a\nfinding."
  remediation: 'Document all enabled interfaces for PIM in the network''s multicast topology diagram.

    Disable support for PIM on interfaces that are not required to support it.

    For non-PIM routers, verify there is no [edit protocols pim] stanza. If the stanza is

    present, delete or deactivate it.

    delete protocols pim

    deactivate protocols pim

    To disable PIM globally or for all interfaces.

    set protocols pim disable

    set protocols pim interface all disable

    For PIM routers verify only the required interfaces are configured and all others are

    disabled:

    set protocols pim interface <name>.<logical unit>

    set protocols pim interface all disable'
  checks:
  - type: manual_review
    info: 'If IPv4 or IPv6 multicast routing is enabled, verify all interfaces enabled for PIM are

