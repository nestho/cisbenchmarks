  description: 'The Juniper PE router providing Virtual Private LAN Services (VPLS) must be configured to have all attachment
    circuits defined to the virtual forwarding instance (VFI) with the globally unique VPN ID assigned for each customer VLAN.
    GROUP ID: V-254068 RULE ID: SV-254068r997539'
  rationale: VPLS defines an architecture that delivers Ethernet multipoint services over an MPLS network. Customer layer
    2 frames are forwarded across the MPLS core via pseudowires using IEEE 802.1q Ethernet bridging principles. A pseudowire
    is a virtual bidirectional connection between two attachment circuits (virtual connections between PE and CE routers).
    A pseudowire contains two unidirectional label-switched paths (LSP) between two PE routers. Each MAC virtual forwarding
    table instance (VFI) is interconnected using pseudowires provisioned for the bridge domain, thereby maintaining privacy
    and logical separation between each VPLS bridge domain. The VFI specifies the pseudowires associated with connecting PE
    routers and the customer-facing attachment circuits belonging to a given VLAN. Resembling a layer 2 switch, the VFI is
    responsible for learning MAC addresses and providing loop-free forwarding of customer traffic to the appropriate end nodes.
    Each VPLS domain is identified by a globally unique VPN ID; hence, VFIs of the same VPLS domain must be configured with
    the same VPN ID on all participating PE routers. To guarantee traffic separation for all customer VLANs and that all packets
    are forwarded to the correct destination, it is imperative that the correct attachment circuits are associated with the
    appropriate VFI and that each VFI is associated to the unique VPN ID assigned to the customer VLAN.
  impact: ''
  references: []
  page_start: 319
  audit_raw: "Review the implementation plan and the VPN IDs assigned to customer VLANs for the\nVPLS deployment.\nReview\
    \ the PE router configuration to verify that customer attachment circuits (i.e.,\nVLANs) are associated to the appropriate\
    \ VPLS ID.\nReview the implementation plan and the VPLS IDs assigned to customer VLANs for the\nVPLS deployment.\nReview\
    \ the PE router configuration to verify that customer attachment circuits are\nassociated to the appropriate routing instance\
    \ configured for the customers VPLS ID.\n[edit]\nrouting-instances {\n <instance name> {\n interface <interface name>.<logical\
    \ unit>;\n protocols {\n vpls {\n vpls-id <VPLS ID>;\n neighbor <neighbor address>;\n }\n }\n }\n }\n}\nNote: Only EX9200-series\
    \ devices currently support VPLS.\nIf the attachment circuits have not been bound to the appropriate routing-instance\
    \ with\nthe assigned VPN ID for each associated VLAN, this is a finding."
  remediation: 'Assign globally unique VPN IDs for each customer VLAN using VPLS for carrier

    Ethernet services between multiple sites, and configure the attachment circuits to the

    appropriate VFI.

    set routing-instances <instance name> protocols vpls vpls-id <VPLS ID>

    neighbor <neighbor address>'
  checks:
  - type: manual_review
    info: 'Review the implementation plan and the VPN IDs assigned to customer VLANs for the

      VPLS deployment.

      Review the PE router configuration to verify that customer attachment circuits (i.e.,

      VLANs) are associated to the appropriate VPLS ID.

      Review the implementation plan and the VPLS IDs assigned to customer VLANs for the

      VPLS deployment.

      Review the PE router configuration to verify that customer attachment circuits are

      associated to the appropriate routing instance configured for the customers VPLS I'
    severity: medium
- id: '1.97'
  title: JUEX-RT-000970
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper PE router must be configured to enforce the split-horizon rule for all pseudowires within a Virtual
    Private LAN Services (VPLS) bridge domain. GROUP ID: V-254069 RULE ID: SV-254069r844240'
  rationale: A virtual forwarding instance (VFI) must be created on each participating PE router for each customer VLAN using
    VPLS for carrier Ethernet services. The VFI specifies the VPN ID of a VPLS domain, the addresses of other PE routers in
    the domain, and the type of tunnel signaling and encapsulation mechanism for each peer PE router. The set of VFIs formed
    by the interconnection of the emulated VCs is called a VPLS instance, which forms the logic bridge over the MPLS core
    network. The PE routers use the VFI with a unique VPN ID to establish a full mesh of emulated virtual circuits or pseudowires
    to all the other PE routers in the VPLS instance. The fullmesh configuration allows the PE router to maintain a single
    broadcast domain. With a full-mesh configuration, signaling and packet replication requirements for each provisioned virtual
    circuit on a PE can be high. To avoid the problem of a packet looping in the provider core, thereby adding more overhead,
    the PE devices must enforce a split-horizon principle for the emulated virtual circuits; that is, if a packet is received
    on an emulated virtual circuit, it is not forwarded on any other virtual circuit.
  impact: ''
  references: []
  page_start: 321
  audit_raw: "Review the PE router configuration to verify that split horizon is enabled. By default,\nJuniper devices configured\
    \ as PE routers and VPLS enforce split horizon operation.\nExcept for H-VPLS, Juniper devices do not support disabling\
    \ split horizon operation.\nLDP signaled VPLS requires a full mesh topology, which can lead to scaling issues.\nHierarchical\
    \ VPLS (H-VPLS) partitions the VPLS domains into mesh groups, reducing\nthe required number of pseudo wires. However,\
    \ the inner VPLS domain may require\nsplit horizon be disabled. Juniper devices support these scenarios with the \"localswitching\"\
    \ command. Ensure mesh groups supporting H-VPLS do not have the \"localswitching\" directive enabled, unless required,\
    \ as shown in the following example.\nGenerally, only inner mesh groups (that is, a group \"nested\" within another) may\
    \ require\nsplit horizon be disabled.\n[edit routing-instances <name> protocols vpls]\nmesh-group <name> {\n :\n local-switching;\n\
    \ :\n}\nNote: Only EX9200-series devices currently support VPLS.\nIf split horizon is disabled but not required to be,\
    \ this is a finding.\nNote: In a ring VPLS, split horizon is disabled so that a PE router can forward a packet\nreceived\
    \ from one pseudowire to another pseudowire. To prevent the consequential\nloop, at least one span in the ring would not\
    \ have a pseudowire for any given VPLS\ninstance."
  remediation: 'Enable split horizon on all PE routers deploying VPLS in a full-mesh configuration.

    There is no fix for full mesh VPLS because Juniper PE devices with VPLS do not

    support or require a CLI command to enable/disabled split horizon. Split horizon

    operation cannot be disabled.

    For H-VPLS, delete the "local-switching" directive for all inner mesh groups that do not

    require split horizon be disabled.

    delete routing-instances <name> protocols vpls mesh-group <name> localswitching'
  checks:
  - type: manual_review
    info: 'Review the PE router configuration to verify that split horizon is enabled. By default,

      Juniper devices configured as PE routers and VPLS enforce split horizon operation.

      Except for H-VPLS, Juniper devices do not support disabling split horizon operation.

      LDP signaled VPLS requires a full mesh topology, which can lead to scaling issues.

      Hierarchical VPLS (H-VPLS) partitions the VPLS domains into mesh groups, reducing

      the required number of pseudo wires. However, the inner VPLS domain may require'
    severity: medium
- id: '1.98'
  title: JUEX-RT-000980
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper Multicast Source Discovery Protocol (MSDP) router must be configured to use its loopback address
    as the source address when originating MSDP traffic. GROUP ID: V-254070 RULE ID: SV-254070r844243'
  rationale: Using a loopback address as the source address offers a multitude of uses for security, access, management, and
    scalability of MSDP routers. It is easier to construct appropriate ingress filters for router management plane traffic
    destined to the network management subnet since the source addresses will be from the range used for loopback interfaces
    instead of a larger range of addresses used for physical interfaces. Log information recorded by authentication and syslog
    servers will record the router’s loopback address instead of the numerous physical interface addresses.
  impact: ''
  references: []
  page_start: 323
  audit_raw: "Review the router configuration to verify that a loopback address has been configured.\nVerify that a loopback\
    \ interface is used as the source address for all MSDP packets\ngenerated by the router.\n[edit protocols]\nmsdp {\n active-source-limit\
    \ {\n maximum <1..1000000>;\n threshold <1..1000000>;\n log-warning <percent to log warning>;\n }\n local-address <lo0\
    \ address>;\n <additional configuration>\n peer <address> {\n active-source-limit {\n maximum <1..1000000>;\n threshold\
    \ <1..1000000>;\n log-warning <percent to log warning>;\n }\n authentication-key \"hashed PSK\"; ## SECRET-DATA\n }\n\
    }\nNote: Both the global, and the peer limit, are applied to every MSDP peer, and Junos\napplies the most restrictive\
    \ limit. The maximum value sets the upper limit for sourceactive messages and the threshold value determines when Junos\
    \ begins Random Early\nDetection (RED) dropping to alleviate congestion. The log-warning value is a percent\nwhere Junos\
    \ begins generating syslog messages.\nIf the router does not use its loopback address as the source address when originating\n\
    MSDP traffic, this is a finding."
  remediation: 'Ensure that the router’s loopback address is used as the source address when

    originating traffic.

    set protocols msdp active-source-limit maximum <1..1000000>

    set protocols msdp active-source-limit threshold <1..1000000>

    set protocols msdp active-source-limit log-warning <percent to log warning>

    set protocols msdp local-address <lo0 address>

    <additional configuration>

    set protocols msdp peer <address> active-source-limit maximum <1..1000000>

    set protocols msdp peer <address> active-source-limit threshold <1..1000000>

    set protocols msdp peer <address> active-source-limit log-warning <percent to

    log warning>

    set protocols msdp peer <address> authentication-key <PSK>'
  checks:
  - type: manual_review
    info: "Review the router configuration to verify that a loopback address has been configured.\nVerify that a loopback\
      \ interface is used as the source address for all MSDP packets\ngenerated by the router.\n[edit protocols]\nmsdp {\n\
      \ active-source-limit {\n maximum <1..1000000>;\n threshold <1..1000000>;\n log-warning <percent to log warning>;\n\
      \ }\n local-address <lo0 address>;\n <additional configuration>\n peer <address> {\n active-source-limit {\n maximum\
      \ <1..1000000>;\n threshold <1..1000000>;\n log-warning <percen"
    severity: medium
- id: '1.99'
  title: JUEX-RT-000990
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper router must be configured to advertise a hop limit of at least 32 in Router Advertisement messages
    for IPv6 stateless auto-configuration deployments. GROUP ID: V-254071 RULE ID: SV-254071r844246'
  rationale: The Neighbor Discovery protocol allows a hop limit value to be advertised by routers in a Router Advertisement
    message being used by hosts instead of the standardized default value. If a very small value was configured and advertised
    to hosts on the LAN segment, communications would fail due to the hop limit reaching zero before the packets sent by a
    host reached its destination.
  impact: ''
  references: []
  page_start: 325
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to determine if\
    \ the hop limit has been configured for\nRouter Advertisement messages. Verify each interface configured for router\n\
    advertisements contains a hop limit of at least 32.\n[edit protocols]\nrouter-advertisement {\n interface ge-0/0/0.0 {\n\
    \ :\n current-hop-limit 32; <<< Supported values: 0 - 255\n :\n }\n}\nIf it has been configured and has not been set to\
    \ at least 32, it is a finding."
  remediation: 'Configure the router to advertise a hop limit of at least 32 in Router Advertisement

    messages.

    set protocols router-advertisement interface <internal interface> currenthop-limit <32 or greater>'
  checks:
  - type: manual_review
    info: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to determine if the\
      \ hop limit has been configured for\nRouter Advertisement messages. Verify each interface configured for router\nadvertisements\
      \ contains a hop limit of at least 32.\n[edit protocols]\nrouter-advertisement {\n interface ge-0/0/0.0 {\n :\n current-hop-limit\
      \ 32; <<< Supported values: 0 - 255\n :\n }\n}\nIf it has been configured and has not been set to at least 32, it is\
      \ a finding."
    severity: medium
- id: '1.100'
  title: JUEX-RT-001000
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must not be configured to use IPv6 Site Local Unicast addresses. GROUP ID: V-254072 RULE
    ID: SV-254072r844249'
  rationale: As currently defined, site local addresses are ambiguous and can be present in multiple sites. The address itself
    does not contain any indication of the site to which it belongs. The use of site-local addresses has the potential to
    adversely affect network security through leaks, ambiguity, and potential misrouting as documented in section 2 of RFC3879.
    RFC3879 formally deprecates the IPv6 site-local unicast prefix FEC0::/10 as defined in RFC3513.
  impact: ''
  references: []
  page_start: 327
  audit_raw: 'Review the router configuration to ensure FEC0::/10 IP addresses are not defined.

    Show the interface configuration using "show configuration interfaces" (from operational

    mode) or "show interfaces" (configuration mode at the top of the hierarchy).

    When showing the configuration, piping (|) to match or find (similar to *nix ''grep'') will

    limit the search.

    For example, to limit the search to lines that include "FEC0":

    (operational mode) show configuration interfaces | match fec0

    Returns the lines with ''fec0'' but no surrounding context

    There should be no returned lines

    (operational mode) show configuration interfaces | find fec0

    Returns the configuration with the first line containing ''fec0''

    Returns context (meaning can scroll up / down in the configuration)

    There should be no returned configuration

    If IPv6 Site Local Unicast addresses are defined, this is a finding.'
  remediation: 'Configure the router using authorized IPv6 addresses.

    Delete unauthorized addresses:

    delete interfaces <interface name> unit <logical unit number> family inet6

    address <unauth address>/<prefix>

    Configure authorized addresses:

    set interfaces <interface name> unit <logical unit number> family inet6

    address <auth address>/<prefix>'
