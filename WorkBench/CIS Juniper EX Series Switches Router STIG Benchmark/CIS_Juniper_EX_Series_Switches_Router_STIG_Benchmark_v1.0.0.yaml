  title: JUEX-RT-000170
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper perimeter router must be configured to protect an enclave connected to an alternate gateway by
    using an inbound filter that only permits packets with destination addresses within the site''s address space. GROUP ID:
    V-253989 RULE ID: SV-253989r997520'
  rationale: Enclaves with alternate gateway connections must take additional steps to ensure there is no compromise on the
    enclave network or NIPRNet. Without verifying the destination address of traffic coming from the site's alternate gateway,
    the perimeter router could be routing transit data from the internet into the NIPRNet. This could also make the perimeter
    router vulnerable to a denial-of-service (DoS) attack as well as provide a back door into the NIPRNet. The DOD enclave
    must ensure the ingress filter applied to external interfaces on a perimeter router connecting to an Approved Gateway
    is secure through filters permitting packets with a destination address belonging to the DOD enclave's address block.
  impact: ''
  references: []
  page_start: 57
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the configuration of each router interface\
    \ connecting to an alternate gateway.\nVerify each permit statement of the ingress filter only permits packets with destination\n\
    addresses of the site's NIPRNet address space or a destination address belonging to\nthe address block assigned by the\
    \ alternate gateway network service provider. Verify\neach permit statement \"from\" stanza (filter match conditions)\
    \ references either the\n\"destination-address\" or \"destination-prefix-list\" directive. Using prefix lists makes\n\
    management easier because managing interior addresses must only be configured in\none location (the prefix-list) vice\
    \ many locations (each permitting filter term). For\nexample:\n[edit policy-options]\nprefix-list inside_addresses-ipv4\
    \ {\n <IPv4 subnet / mask>;\n}\nprefix-list inside_addresses-ipv6 {\n <IPv6 subnet / prefix>;\n}\n[edit firewall]\nfamily\
    \ inet {\n filter inbound-ipv4 {\n <deny terms>;\n permit-term1 {\n from {\n <match conditions>;\n destination-prefix-list\
    \ inside_addresses-ipv4;\n }\n then accept;\n }\n <additional permit terms with a destination address definition>\n }\n\
    }\nfamily inet6 {\n filter inbound-ipv6 {\n <deny terms>;\n permit-term1 {\n from {\n <match conditions>;\n destination-prefix-list\
    \ inside_addresses-ipv6;\n }\n then accept;\n }\n <additional permit terms with a destination address definition>\n }\n\
    }\nVerify the filter is applied inbound on exterior-facing interfaces. For example:\n[edit interfaces]\n<interface name>\
    \ {\n unit <number> {\n family inet {\n filter {\n input inbound-ipv4;\n }\n address <IPv4 address / mask>;\n }\n family\
    \ inet6 {\n filter {\n input inbound-ipv6;\n }\n address <IPv6 address / prefix>;\n }\n }\n}\nNote: Some Juniper devices\
    \ support both monolithic filters and filter lists. Filter lists\nseparate each term, or set of terms, into a separate\
    \ filter that is applied sequentially to\nan interface. If using filter lists, the keywords \"input\" or \"output\" change\
    \ to \"input-list\" or\n\"output-list\". Verify the final list item is a deny-all filter.\nIf the ingress filter permits\
    \ packets with addresses other than those specified, such as\ndestination addresses of the site's NIPRNet address space\
    \ or a destination address\nbelonging to the address block assigned by the alternate gateway network service\nprovider,\
    \ this is a finding."
  remediation: 'This requirement is not applicable for the DODIN Backbone.

    Configure the ingress filter of the perimeter router connected to an alternate gateway to

    only permit packets with destination addresses of the site''s NIPRNet address space or a

    destination address belonging to the address block assigned by the alternate gateway

    network service provider. For example:

    set policy-options prefix-list inside_addresses-ipv4 <IPv4 subnet / mask>

    set policy-options prefix-list inside_addresses-ipv6 <IPv6 subnet / prefix>

    set firewall family inet filter inbound-ipv4 <deny terms>

    set firewall family inet filter inbound-ipv4 <permit term> from <match

    conditions>

    set firewall family inet filter inbound-ipv4 <permit term> from destinationprefix-list inside_addresses-ipv4

    set firewall family inet filter inbound-ipv4 <permit term> then accept

    set firewall family inet6 filter inbound-ipv6 <deny terms>

    set firewall family inet6 filter inbound-ipv6 <permit term> from <match

    conditions>

    set firewall family inet6 filter inbound-ipv6 <permit term> from destinationprefix-list inside_addresses-ipv6

    set firewall family inet6 filter inbound-ipv6 <permit term> then accept'
  checks:
  - type: manual_review
    info: 'This requirement is not applicable for the DODIN Backbone.

      Review the configuration of each router interface connecting to an alternate gateway.

      Verify each permit statement of the ingress filter only permits packets with destination

      addresses of the site''s NIPRNet address space or a destination address belonging to

      the address block assigned by the alternate gateway network service provider. Verify

      each permit statement "from" stanza (filter match conditions) references either the

      "destination-'
