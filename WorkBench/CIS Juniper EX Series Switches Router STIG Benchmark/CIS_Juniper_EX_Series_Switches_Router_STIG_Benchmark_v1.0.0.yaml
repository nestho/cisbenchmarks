- id: '1.21'
  title: JUEX-RT-000210
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper out-of-band management (OOBM) gateway router must not be configured to redistribute routes between
    the management network routing domain and the managed network routing domain. GROUP ID: V-253993 RULE ID: SV-253993r844012'
  rationale: If the gateway router is not a dedicated device for the OOBM network, several safeguards must be implemented
    for containment of management and production traffic boundaries; otherwise, it is possible that management traffic will
    not be separated from production traffic. Since the managed network and the management network are separate routing domains,
    separate Interior Gateway Protocol routing instances must be configured on the router, one for the managed network and
    one for the OOBM network. In addition, the routes from the two domains must not be redistributed to each other.
  impact: ''
  references: []
  page_start: 67
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nVerify the Interior Gateway Protocol instance used\
    \ for the managed network does not\nredistribute routes into the Interior Gateway Protocol instance used for the management\n\
    network, and vice versa.\nJuniper routers use export policies to limit redistribution of routes. Verify a policy exists\n\
    to filter route redistribution. Juniper policy-statements support terms, which provides\ngreater granularity within a\
    \ single policy.\n[edit policy-options]\npolicy-statement deny-mgt-redist {\n term 1 {\n from protocol static;\n then\
    \ reject;\n }\n term 2 {\n from {\n protocol ospf;\n route-filter <IPv4 subnet>/<mask> orlonger;\n route-filter <IPv6\
    \ subnet>/<prefix> orlonger;\n }\n then reject;\n }\n <additional terms permitting authorized routes for redistribution>\n\
    }\npolicy-statement deny-managed-routes {\n term 1 {\n from {\n route-filter <IPv4 subnet>/<mask> orlonger;\n route-filter\
    \ <IPv6 subnet>/<prefix> orlonger;\n }\n then accept;\n }\n term 2 {\n then reject;\n }\n}\nVerify an export policy is\
    \ applied to the IGP protocol for each routing instance (default\nand OOBM).\n[edit protocols]\n ospf {\n area <area number>\
    \ {\n interface <NOT OOBM interface>.<logical unit>;\n }\n export deny-mgt-redist;\n }\n ospf3 {\n area <area number>\
    \ {\n interface <NOT OOBM interface>.<logical unit>;\n }\n export deny-mgt-redist;\n }\n}\n[edit routing-instances]\n\
    OOBM {\n instance-type virtual-router;\n protocols {\n ospf {\n area <area number> {\n interface <OOBM interface>.<logical\
    \ unit>;\n }\n export deny-managed-routes;\n }\n ospf3 {\n area <area number> {\n interface <OOBM interface>.<logical\
    \ unit>;\n }\n export deny-managed-routes;\n }\n }\n}\nIf the Interior Gateway Protocol instance used for the managed\
    \ network redistributes\nroutes into the Interior Gateway Protocol instance used for the management network, or\nvice\
    \ versa, this is a finding."
  remediation: 'This requirement is not applicable for the DODIN Backbone.

    Configure the Interior Gateway Protocol instance used for the managed network to

    prohibit redistribution of routes into the Interior Gateway Protocol instance used for the

    management network, and vice versa.

    set policy-options policy-statement deny-managed-routes term 1 from routefilter <IPv4 subnet>/<mask> orlonger

    set policy-options policy-statement deny-managed-routes term 1 from routefilter <IPv6 subnet>/<prefix> orlonger

    set policy-options policy-statement deny-managed-routes term 1 then accept

    set policy-options policy-statement deny-managed-routes term 2 then reject

    set policy-options policy-statement deny-mgt-redist term 1 from protocol

    static

    set policy-options policy-statement deny-mgt-redist term 1 then reject

    set policy-options policy-statement deny-mgt-redist term 2 from protocol ospf

    set policy-options policy-statement deny-mgt-redist term 2 from route-filter

    <IPv4 subnet>/<mask> orlonger

    set policy-options policy-statement deny-mgt-redist term 2 from route-filter

    <IPv6 subnet>/<prefix> orlonger

    set policy-options policy-statement deny-mgt-redist term 2 then reject

    <additional terms for permitted redistributable routes>

    set routing-instances OOBM instance-type virtual-router

    set routing-instances OOBM protocols ospf area <area number> interface <OOBM

    interface>.<logical unit>

    set routing-instances OOBM protocols ospf export test

    set routing-instances OOBM protocols ospf3 area <area number> interface <OOBM

    interface>.<logical unit>

    set routing-instances OOBM protocols ospf3 export test'
  checks:
  - type: manual_review
    info: 'This requirement is not applicable for the DODIN Backbone.

      Verify the Interior Gateway Protocol instance used for the managed network does not

      redistribute routes into the Interior Gateway Protocol instance used for the management

