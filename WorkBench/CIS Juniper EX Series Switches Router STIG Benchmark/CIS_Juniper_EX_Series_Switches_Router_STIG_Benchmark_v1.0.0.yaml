      Juniper routers use export policies to limit redistribution of routes. Verify a policy exists

      to filter route redistribution. Juniper policy-statements support terms, which provides

      greater granularity within a single policy.

      [edit policy-optio'
    severity: medium
- id: '1.22'
  title: JUEX-RT-000220
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper multicast Rendezvous Point (RP) router must be configured to filter Protocol Independent Multicast
    (PIM) Register messages received from the Designated Router (DR) for any undesirable multicast groups and sources. GROUP
    ID: V-253994 RULE ID: SV-253994r844015'
  rationale: Real-time multicast traffic can entail multiple large flows of data. An attacker can flood a network segment
    with multicast packets, over-using the available bandwidth and thereby creating a denial-of-service (DoS) condition. Hence,
    it is imperative that register messages are accepted only for authorized multicast groups and sources.
  impact: ''
  references: []
  page_start: 71
  audit_raw: "Verify that the RP router is configured to filter PIM register messages from unauthorized\nmulticast groups\
    \ and sources.\n[edit policy-options]\npolicy-statement <name> {\n term filter_groups {\n from {\n route-filter <multicast\
    \ address>/<mask> orlonger;\n route-filter <multicast address>/<mask> exact;\n <additional groups to filter>\n }\n then\
    \ reject;\n }\n term filter_sources {\n from {\n source-address-filter <source host address>/32 exact;\n source-address-filter\
    \ <source subnet address>/<mask> orlonger;\n <additional source addresses to filter>\n }\n then reject;\n }\n term accept_others\
    \ {\n then accept;\n }\n}\n[edit protocols pim]\nrp {\n rp-register-policy <policy name>;\n}\nIf the RP router peering\
    \ with PIM-SM routers is not configured with a PIM import policy\nto block registration messages for any undesirable multicast\
    \ groups and sources, this is\na finding."
  remediation: 'Configure the RP router to filter PIM register messages received from a multicast DR for

    any undesirable multicast groups or sources.

    set policy-options policy-statement <name> term filter_groups from routefilter <multicast address>/<mask> <match criterion>

    set policy-options policy-statement <name> term filter_groups from routefilter <additional multicast address>/<mask> <match
    criterion>

    set policy-options policy-statement <name> term filter_groups then reject

    set policy-options policy-statement <name> term filter_source from sourceaddress-filter <source address>/<mask> <match
    criterion>

    set policy-options policy-statement <name> term filter_source from sourceaddress-filter <additional source address>/<mask>
    <match criterion>

    set policy-options policy-statement <name> term filter_source then reject

    set policy-options policy-statement <name> term accept_others then accept

    set protocols pim rp rp-register-policy <policy name>'
  checks:
  - type: manual_review
    info: "Verify that the RP router is configured to filter PIM register messages from unauthorized\nmulticast groups and\
