  description: 'The Juniper router must be configured to bind a Protocol Independent Multicast (PIM) neighbor filter to interfaces
    that have PIM enabled. GROUP ID: V-253986 RULE ID: SV-253986r843991'
  rationale: PIM is a routing protocol used to build multicast distribution trees for forwarding multicast traffic across
    the network infrastructure. PIM traffic must be limited to only known PIM neighbors by configuring and binding a PIM neighbor
    filter to those interfaces that have PIM enabled. If a PIM neighbor filter is not applied to those interfaces that have
    PIM enabled, unauthorized routers can join the PIM domain, discover and use the rendezvous points, and also advertise
    their rendezvous points into the domain. This can result in a denial of service by traffic flooding or result in the unauthorized
    transfer of data.
  impact: ''
  references: []
  page_start: 50
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the multicast topology diagram and determine\
    \ if router interfaces are enabled\nfor IPv4 or IPv6 multicast routing.\nBy default, PIM is not enabled on any interface.\
    \ If not a PIM router, verify there is no\nPIM stanza at [edit protocols], PIM is disabled globally and/or for all interfaces,\
    \ or that\nthe stanza is inactive.\n[edit protocols]\ninactive: pim { << Stanza is removed or marked inactive\n disable;\
    \ << If stanza is present and not inactive, verify globally\ndisabled\n interface all { << If stanza is present, not inactive,\
    \ and not globally\ndisabled, disable for all interfaces\n disable;\n }\n}\nFor PIM routers, verify only the required\
    \ interfaces are configured. For example, the\nfollowing configuration enables PIM on a specific interface and disables\
    \ PIM for all\nothers.\n[edit protocols]\npim {\n interface <name>.<logical unit>;\n interface all {\n disable;\n }\n\
    }\nNote: More specific interface configuration statements are preferred. In the example, the\ninterface configuration\
    \ is more specific than interface \"all\", so PIM is enabled only on\nthat interface.\nIf the router is enabled for multicast\
    \ routing, verify all interfaces enabled for PIM have a\nneighbor filter bound to the interface. The neighbor filter must\
    \ only accept PIM control\nplane traffic from the documented PIM neighbors.\n[edit policy-options]\nprefix-list PIM-NEIGHBOR-1\
    \ {\n <PIM neighbor address>/32;\n}\n<additional PIM neighbor lists>\npolicy-statement PIM-NBR-1 {\n from {\n prefix-list\
    \ PIM-NEIGHBOR-1;\n }\n then accept;\n}\n<additional policies>\n[edit protocols pim]\ninterface <interface name>.<logical\
    \ unit> {\n mode sparse;\n neighbor-policy PIM-NBR1;\n}\ninterface all {\n disable;\n}\nIf PIM neighbor filters are not\
    \ bound to all interfaces that have PIM enabled, this is a\nfinding."
  remediation: 'This requirement is not applicable for the DODIN Backbone.

    Configure neighbor filters to only accept PIM control plane traffic from documented PIM

    neighbors. Bind neighbor filters to all PIM enabled interfaces.

    set policy-options prefix-list PIM-NEIGHBOR-1 <PIM neighbor address>/32

    set policy-options policy-statement PIM-NBR-1 from prefix-list PIM-NEIGHBOR-1

    set policy-options policy-statement PIM-NBR-1 then accept

    set protocols pim interface <interface name>.<logical unit> mode sparse

    set protocols pim interface <interface name>.<logical unit> neighbor-policy

    PIM-NBR-1

    set protocols pim interface all disable'
  checks:
