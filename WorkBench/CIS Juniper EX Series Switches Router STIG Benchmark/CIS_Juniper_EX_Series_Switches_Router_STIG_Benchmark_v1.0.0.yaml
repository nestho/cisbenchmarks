- id: '1.37'
  title: JUEX-RT-000370
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper perimeter router must be configured to deny network traffic by default and allow network traffic
    by exception. GROUP ID: V-254009 RULE ID: SV-254009r844060'
  rationale: A deny-all, permit-by-exception network communications traffic policy ensures that only connections that are
    essential and approved are allowed. This requirement applies to both inbound and outbound network communications traffic.
    All inbound and outbound traffic must be denied by default. Firewalls and perimeter routers should only allow traffic
    through that is explicitly permitted. The initial defense for the internal network is to block any traffic at the perimeter
    that is attempting to make a connection to a host residing on the internal network. In addition, allowing unknown or undesirable
    outbound traffic by the firewall or router will establish a state that will permit the return of this undesirable traffic
    inbound.
  impact: ''
  references: []
  page_start: 134
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to verify that the\
    \ firewall filter is configured to allow\nspecific ports and protocols and deny all other traffic. Associating any firewall\
    \ filter to an\ninterface will create a deny-all, permit-by-exception posture because each filter includes\nan implicit\
    \ \"deny all\" final term. Verify firewall filters applied inbound on external\ninterfaces are configured with terms permitting\
    \ specific traffic.\nFor example:\n[edit firewall]\nfamily inet {\n filter permitted_inbound_traffic_ipv4 {\n term 1 {\n\
    \ from {\n destination-prefix-list {\n INSIDE_ADDRESSES_IPv4;\n }\n protocol tcp;\n destination-port [ http https ];\n\
    \ }\n then accept;\n }\n term 2 {\n from {\n destination-prefix-list {\n INSIDE_ADDRESSES_IPv4;\n }\n protocol udp;\n\
    \ destination-port [ domain radius ];\n }\n then accept;\n }\n }\n}\nfamily inet6 {\n filter permitted_inbound_traffic_ipv6\
    \ {\n term 1 {\n from {\n destination-prefix-list {\n INSIDE_ADDRESSES_IPv6;\n }\n next-header tcp;\n destination-port\
    \ [ http https ];\n }\n then accept;\n }\n term 2 {\n from {\n destination-prefix-list {\n INSIDE_ADDRESSES_IPv6;\n }\n\
    \ next-header udp;\n destination-port [ domain radius ];\n }\n then accept;\n }\n }\n}\nNote: Although the example filter\
    \ is sufficient to meet this requirement, an explicit \"denyall\" term is required for logging. For example, add the following\
    \ final term to both filters\n(IPv4 and IPv6) to enable logging of discarded packets:\n[edit firewall family (inet|inet6)\
    \ filter <name>]\nterm default {\n then {\n log;\n syslog;\n discard;\n }\n}\nThe filter must be configured inbound on\
    \ all external interfaces.\n[edit interfaces]\n<external interface> {\n unit <number> {\n family inet {\n filter input\
    \ permitted_inbound_traffic_ipv4;\n address <IPv4 address/mask>;\n }\n family inet6 {\n filter input permitted_inbound_traffic_ipv6;\n\
    \ address <IPv6 address/prefix>;\n }\n}\nNote: Some Juniper devices support both monolithic filters and filter lists.\
    \ Filter lists\nseparate each term, or set of terms, into a separate filter that is applied sequentially to\nan interface.\
    \ If using filter lists, the keywords \"input\" or \"output\" change to \"input-list\" or\n\"output-list\". Verify the\
    \ final list item is a deny-all filter. The deny-all filter is created once\nper family and can be reused across multiple\
    \ lists. For example:\ninput-list [ permit_mgt permit_routing_protocols default-deny ];\nIf the filter is not configured\
    \ to allow specific ports and protocols and deny all other\ntraffic, this is a finding.\nIf the filter is not configured\
    \ inbound on all external interfaces, this is a finding."
  remediation: 'This requirement is not applicable for the DODIN Backbone.

    Configure the perimeter router to deny network traffic by default and allow network

    traffic by exception. For example:

    set firewall family inet filter permitted_inbound_traffic_ipv4 term 1 from

    destination-prefix-list INSIDE_ADDRESSES

    set firewall family inet filter permitted_inbound_traffic_ipv4 term 1 from

    protocol tcp

    set firewall family inet filter permitted_inbound_traffic_ipv4 term 1 from

    destination-port http

    set firewall family inet filter permitted_inbound_traffic_ipv4 term 1 from

    destination-port https

    set firewall family inet filter permitted_inbound_traffic_ipv4 term 1 then

    accept

    set firewall family inet filter permitted_inbound_traffic_ipv4 term 2 from

    destination-prefix-list INSIDE_ADDRESSES

    set firewall family inet filter permitted_inbound_traffic_ipv4 term 2 from

    protocol udp

    set firewall family inet filter permitted_inbound_traffic_ipv4 term 2 from

    destination-port domain

    set firewall family inet filter permitted_inbound_traffic_ipv4 term 2 from

    destination-port radius

    set firewall family inet filter permitted_inbound_traffic_ipv4 term 2 then

    accept

    set firewall family inet6 filter permitted_inbound_traffic_ipv6 term 1 from

    destination-prefix-list INSIDE_ADDRESSES

    set firewall family inet6 filter permitted_inbound_traffic_ipv6 term 1 from

    next-header tcp

    set firewall family inet6 filter permitted_inbound_traffic_ipv6 term 1 from

    destination-port http

    set firewall family inet6 filter permitted_inbound_traffic_ipv6 term 1 from

    destination-port https

    set firewall family inet6 filter permitted_inbound_traffic_ipv6 term 1 then

    accept

    set firewall family inet6 filter permitted_inbound_traffic_ipv6 term 2 from

    destination-prefix-list INSIDE_ADDRESSES

    set firewall family inet6 filter permitted_inbound_traffic_ipv6 term 2 from

    next-header udp

    set firewall family inet6 filter permitted_inbound_traffic_ipv6 term 2 from

    destination-port domain

    set firewall family inet6 filter permitted_inbound_traffic_ipv6 term 2 from

    destination-port radius

    set firewall family inet6 filter permitted_inbound_traffic_ipv6 term 2 then

    accept

    Note: To enable logging, add the following as the final term to each filter:

    set firewall family [inet|inet6] filter <name> term default then log

    set firewall family [inet|inet6] filter <name> term default then syslog

    set firewall family [inet|inet6] filter <name> term default then discard

    set interfaces <external interface> unit 0 family inet filter input

    permitted_inbound_traffic_ipv4

    set interfaces <external interface> unit 0 family inet address <IPv4 address

    / mask>

    set interfaces <external interface> unit 0 family inet6 filter input

    permitted_inbound_traffic_ipv6

    set interfaces <external interface> unit 0 family inet6 address <IPv6 address

    / prefix>'
  checks:
  - type: manual_review
    info: 'This requirement is not applicable for the DODIN Backbone.

      Review the router configuration to verify that the firewall filter is configured to allow

      specific ports and protocols and deny all other traffic. Associating any firewall filter to an

      interface will create a deny-all, permit-by-exception posture because each filter includes

      an implicit "deny all" final term. Verify firewall filters applied inbound on external

      interfaces are configured with terms permitting specific traffic.

      For example:'
    severity: medium
- id: '1.38'
  title: JUEX-RT-000380
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper router must be configured to restrict traffic destined to itself. GROUP ID: V-254010 RULE ID:
    SV-254010r997524'
  rationale: The routing engine (RE) handles traffic destined to the router—the key component used to build forwarding paths
    and is also instrumental with all network management functions. Hence, any disruption or DoS attack to the RE can result
    in mission critical network outages.
  impact: ''
  references: []
  page_start: 139
  audit_raw: "Review the firewall filter for the router receive path and verify that it will only process\nspecific management\
    \ plane and control plane traffic from specific sources. For example:\n[edit policy-options]\nauth_mgt_networks-ipv4 {\n\
    \ <IPv4 subnet / mask>;\n}\nauth_mgt_networks-ipv6 {\n <IPv6 subnet / prefix>;\n}\ndevice_mgt_address-ipv4 {\n <IPv4 address>/32;\n\
    }\ndevice_mgt_address-ipv6 {\n <IPv6 address>/128;\n}\n[edit firewall]\nfamily inet {\n filter protect_re-ipv4 {\n term\
    \ 1 {\n from {\n source-prefix-list auth_mgt_networks-ipv4;\n destination-prefix-list device_mgt_address-ipv4;\n <additional\
    \ match criteria>;\n }\n }\n <additional permit terms>\n term default {\n then {\n log;\n syslog;\n discard;\n }\n }\n\
    \ }\n}\nfamily inet6 {\n filter protect_re-ipv6 {\n term 1 {\n from {\n source-prefix-list auth_mgt_networks-ipv6;\n destination-prefix-list\
    \ device_mgt_address-ipv6;\n <additional match criteria>;\n }\n }\n <additional permit terms>\n term default {\n then\
    \ {\n log;\n syslog;\n discard;\n }\n }\n }\n}\nNote: Additional match criteria includes protocol (next-header for IPv6),\
    \ source and\ndestination ports, ICMP type and code, etc. When applied to the loopback interface, the\nfilter affects\
    \ identified traffic regardless of ingress interface. Ensure the filter addresses\nall traffic destined to the RE like\
    \ routing protocols, ICMP messages, SSH and SCP\ntraffic, SNMP, etc.\nVerify filters are applied to loopback, all L3 interfaces,\
    \ or both. For example:\n[edit interfaces]\nlo0 {\n unit 0 {\n family inet {\n filter {\n input protect_re-ipv4;\n }\n\
    \ address <IPv4 address>/32;\n }\n family inet6 {\n filter {\n input protect_re-ipv6;\n }\n address <IPv6 address>/32;\n\
    \ }\n }\n}\nNote: Some Juniper devices support both monolithic filters and filter lists. Filter lists\nseparate each term,\
    \ or set of terms, into a separate filter that is applied sequentially to\nan interface. If using filter lists, the keywords\
    \ \"input\" or \"output\" change to \"input-list\" or\n\"output-list\". Verify the final list item is a deny-all filter.\
    \ The deny-all filter is created once\nper family and can be reused across multiple lists. For example:\ninput-list [\
