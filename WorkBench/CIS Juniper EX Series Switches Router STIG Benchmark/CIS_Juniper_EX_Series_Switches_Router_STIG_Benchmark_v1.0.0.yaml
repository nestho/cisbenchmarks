    set firewall family inet6 filter <name> term default then syslog

    set firewall family inet6 filter <name> term default then discard

    set interfaces <interface name> unit <number> family inet6 filter input

    <filter name>

    set interfaces <interface name> unit <number> family inet6 address <IPv6

    address>.<prefix>'
