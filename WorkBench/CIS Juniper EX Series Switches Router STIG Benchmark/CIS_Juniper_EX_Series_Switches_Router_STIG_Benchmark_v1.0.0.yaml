      customer, whichever is larger. Verify each BGP neighbor implements an import policy.

      BGP import policies are supported in three locations: Global (at [edit protocols bgp]),

      group (at [edit protocols bgp group ]), and for each neighbor (at [edit protocols bgp

      gro'
