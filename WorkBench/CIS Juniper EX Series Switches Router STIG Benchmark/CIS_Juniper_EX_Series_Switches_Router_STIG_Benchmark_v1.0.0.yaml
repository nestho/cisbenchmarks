- id: '1.71'
  title: JUEX-RT-000710
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper multicast Designated Router (DR) must be configured to increase the shortest-path tree (SPT) threshold
    or set it to infinity to minimalize source-group (S, G) state within the multicast topology where Any Source Multicast
    (ASM) is deployed. GROUP ID: V-254043 RULE ID: SV-254043r945856'
  rationale: ASM can have many sources for the same groups (many-to-many). For many receivers, the path via the RP may not
    be ideal compared with the shortest path from the source to the receiver. By default, the last-hop router will initiate
    a switch from the shared tree to a source-specific SPT to obtain lower latencies. This is accomplished by the last-hop
    router sending an (S, G) Protocol Independent Multicast (PIM) Join toward S (the source). When the last-hop router begins
    to receive traffic for the group from the source via the SPT, it will send a PIM Prune message to the RP for the (S, G).
    The RP will then send a Prune message toward the source. The SPT switchover becomes a scaling issue for large multicast
    topologies that have many receivers and many sources for many groups because (S, G) entries require more memory than (*,
    G). Hence, it is imperative to minimize the amount of (S, G) state to be maintained by increasing the threshold that determines
    when the SPT switchover occurs.
  impact: ''
  references: []
  page_start: 240
  audit_raw: "Review the multicast last-hop router configuration to verify that the SPT switchover\nthreshold is increased\
    \ (default is \"0\") or set to infinity (never switch over).\nVerify the policy statement includes specific multicast\
    \ groups or all groups (as shown).\n[edit policy-options]\npolicy-statement <name> {\n term 1 {\n from {\n route-filter\
    \ 234.0.0.0/8 orlonger;\n }\n then accept;\n }\n}\nVerify the infinity policy is applied.\n[edit protocols pim]\nspt-threshold\
    \ {\n infinity <policy name>;\n}\nIf any multicast router is not configured to increase the SPT threshold or set to infinity\
    \ to\nminimalize (S, G) state, this is a finding."
  remediation: 'Configure the multicast router to increase the SPT threshold or set it to infinity to

    minimalize (S, G) state within the multicast topology where ASM is deployed.

    set policy-options policy-statement <name> term 1 from route-filter

    239.0.0.0/8 orlonger

    set policy-options policy-statement <name> term 1 then accept

    set protocols pim spt-threshold infinity <policy name>'
  checks:
  - type: manual_review
    info: "Review the multicast last-hop router configuration to verify that the SPT switchover\nthreshold is increased (default\
