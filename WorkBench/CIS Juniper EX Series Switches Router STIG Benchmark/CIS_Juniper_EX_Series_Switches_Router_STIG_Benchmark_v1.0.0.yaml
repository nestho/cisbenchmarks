    Verify all configured interfaces are not external facing.\n[edit protocols]\nrouter-advertisement {\n interface <internal\
    \ interface>.<logical unit> {\n managed-configuration;\n :\n :\n prefix <internal IPv6 prefix>;\n }\n}\nIf the router\
    \ is not configured to suppress Router Advertisements on all external IPv6enabled interfaces, this is a finding."
  remediation: 'Configure the router to suppress Router Advertisements on all external IPv6-enabled

