controls:
- id: '1.1'
  title: JUEX-RT-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to enforce approved authorizations for controlling the flow of information
    within the network based on organization-defined information flow control policies. GROUP ID: V-253973 RULE ID: SV-253973r843952'
  rationale: Information flow control regulates where information is allowed to travel within a network and between interconnected
    networks. The flow of all network traffic must be monitored and controlled so it does not introduce any unacceptable risk
    to the network infrastructure or data. Information flow control policies and enforcement mechanisms are commonly employed
    by organizations to control the flow of information between designated sources and destinations (e.g., networks, individuals,
    and devices) within information systems. Enforcement occurs, for example, in boundary protection devices (e.g., gateways,
    routers, guards, encrypted tunnels, and firewalls) that employ rule sets or establish configuration settings that restrict
    information system services, provide a packet filtering capability based on header information, or provide a message filtering
    capability based on message content (e.g., implementing key word searches or using document characteristics).
  impact: ''
  references: []
  page_start: 12
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to verify that stateless\
    \ firewall filters are configured to\nallow or deny traffic for specific source and destination addresses as well as ports\
    \ and\nprotocols. Verify the IP addresses are appropriate for the target environment. IP\naddresses are configured in\
    \ lists at [edit policy-options] or are directly embedded into\neach term.\n[edit policy-options]\nprefix-list inside-addresses-ipv4\
    \ {\n <inside IPv4 subnet>/<mask>;\n <inside IPv4 subnet>/<mask>;\n}\nprefix-list inside-addresses-ipv6 {\n <inside IPv6\
    \ subnet>/<prefix>;\n <inside IPv6 subnet>/<prefix>;\n}\nFor example:\n[edit firewall]\nfamily inet {\n filter authorized-outbound-ipv4\
    \ {\n term permitted-http {\n from {\n source-prefix-list {\n inside-addresses-ipv4;\n }\n destination-address {\n <destination\
    \ IPv4 address>/<mask>;\n }\n protocol tcp;\n destination-port http;\n }\n then accept;\n }\n :\n <other terms>\n :\n\
    \ term permitted-source-addresses {\n from {\n source-prefix-list {\n inside-addresses-ipv4;\n }\n protocol-except tcp;\n\
    \ destination-port-except http;\n }\n then accept;\n }\n term default-deny {\n then {\n log;\n syslog;\n discard;\n }\n\
    \ }\n }\n}\nfamily inet6 {\n filter authorized-outbound-ipv6 {\n term permitted-http {\n from {\n source-prefix-list {\n\
    \ inside-addresses-ipv6;\n }\n destination-address {\n <destination IPv6 address>/<prefix>;\n }\n next-header tcp;\n destination-port\
    \ http;\n }\n then accept;\n }\n :\n <other terms>\n :\n term permitted-source-addresses {\n from {\n source-prefix-list\
    \ {\n inside-addresses-ipv6;\n }\n next-header-except tcp;\n destination-port-except http;\n }\n then accept;\n }\n term\
    \ default-deny {\n then {\n log;\n syslog;\n discard;\n }\n }\n }\n}\nVerify filters are applied to the correct interface.\
    \ For example, the \"authorized-outbound\"\nfilter, as written, should be applied to the ingress of internal interfaces:\n\
    [edit interfaces]\n<internal interface name> {\n unit <number> {\n family inet {\n filter {\n input authorized-outbound-ipv4;\n\
    \ }\n address <IPv4 address>/<mask>;\n }\n family inet6 {\n filter {\n input authorized-outbound-ipv6;\n }\n address <IPv6\
    \ address>/<prefix>;\n }\n }\n}\nNote: Some Juniper devices support both monolithic filters and filter lists. Filter lists\n\
    separate each term, or set of terms, into a separate filter that is applied sequentially to\nan interface. If using filter\
    \ lists, the keywords \"input\" and \"output\" change to \"input-list\"\nor \"output-list\". Verify the final list item\
    \ is a deny-all filter.\nIf the router is not configured to enforce approved authorizations for controlling the flow\n\
    of information within the network based on organization-defined information flow control\npolicies, this is a finding."
  remediation: 'This requirement is not applicable for the DODIN Backbone.

    Configure stateless firewall filters to allow or deny traffic for specific source and

    destination addresses as well as ports and protocols.

    Example prefix-lists:

    set policy-options prefix-list inside-addresses-ipv4 <inside IPv4 subnet>

    set policy-options prefix-list inside-addresses-ipv6 <inside IPv6 subnet>

    Example firewall filter:

    set firewall family inet filter authorized-outbound-ipv4 term permittedsource-addresses from source-prefix-list inside-addresses-ipv4

    set firewall family inet filter authorized-outbound-ipv4 term permittedsource-addresses then accept

    set firewall family inet filter authorized-outbound-ipv4 term 2 then log

    set firewall family inet filter authorized-outbound-ipv4 term 2 then syslog

    set firewall family inet filter authorized-outbound-ipv4 term 2 then discard

    set firewall family inet6 filter authorized-outbound-ipv6 term permittedsource-addresses from source-prefix-list inside-addresses-ipv6

    set firewall family inet6 filter authorized-outbound-ipv6 term permittedsource-addresses then accept

    set firewall family inet6 filter authorized-outbound-ipv6 term 2 then log

    set firewall family inet6 filter authorized-outbound-ipv6 term 2 then syslog

    set firewall family inet6 filter authorized-outbound-ipv6 term 2 then discard

    Example firewall filter applied to ingress of internal interface:

    set interfaces <interface name> unit <number> family inet filter input

    authorized-outbound-ipv4

    set interfaces <interface name> unit <number> family inet address <IPv4

    address>/<mask>

    set interfaces <interface name> unit <number> family inet6 filter input

    authorized-outbound-ipv6

    set interfaces <interface name> unit <number> family inet6 address <IPv6

    address>/<prefix>'
  checks:
  - type: manual_review
    info: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to verify that stateless\
      \ firewall filters are configured to\nallow or deny traffic for specific source and destination addresses as well as\
      \ ports and\nprotocols. Verify the IP addresses are appropriate for the target environment. IP\naddresses are configured\
      \ in lists at [edit policy-options] or are directly embedded into\neach term.\n[edit policy-options]\nprefix-list inside-addresses-ipv4\
      \ {\n <inside IPv4 subnet"
    severity: medium
- id: '1.2'
  title: JUEX-RT-000020
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper BGP router must be configured to reject inbound route advertisements for any Bogon prefixes. GROUP
    ID: V-253974 RULE ID: SV-253974r843955'
  rationale: Accepting route advertisements for Bogon prefixes can result in the local autonomous system (AS) becoming a transit
    for malicious traffic as it will in turn advertise these prefixes to neighbor autonomous systems. The list of Bogon addresses
    can change, based upon new address range assignments, and must be reviewed to ensure filters remain current.
  impact: ''
  references: []
  page_start: 17
  audit_raw: "Review the BGP router configuration to verify that it will reject routes of any currently\ndefined Bogon prefixes.\n\
    Example route-filter-list of Bogon addresses with corresponding policy-statement\nreferencing the list:\n[edit policy-options]\n\
    route-filter-list bogon {\n /* This host on this network */\n 0.0.0.0/8 orlonger;\n /* CGN Addresses */\n 100.64.0.0/10\
    \ orlonger;\n /* Loopback */\n 127.0.0.0/8 orlonger;\n /* IPv4 link-local or APIPA */\n 169.254.0.0/16 orlonger;\n /*\
    \ IETF Protocol Assignments (/24) and DS-Lite (/29) */\n 192.0.0.0/24 orlonger;\n /* IPv4 documentation addresses: TEST-NET-1\
    \ */\n 192.0.2.0/24 orlonger;\n /* 6to4 Relay Anycast descr in RFC3068 */\n 192.88.99.0/24 orlonger;\n /* Benchmark testing\
    \ descr in RFC2544 */\n 198.18.0.0/15 orlonger;\n /* IPv4 documentation addresses: TEST-NET-2 */\n 198.51.100.0/24 orlonger;\n\
    \ /* IPv4 documentation addresses: TEST-NET-3 */\n 203.0.113.0/24 orlonger;\n /* Multicast */\n 224.0.0.0/24 orlonger;\n\
    \ /* Reserved */\n 240.0.0.0/4 orlonger;\n /* RFC1918 Addresses */\n 10.0.0.0/8 orlonger;\n 172.16.0.0/12 orlonger;\n\
    \ 192.168.0.0/16 orlonger;\n <add additional routes as needed>\n}\nroute-filter-list bogon-ipv6 {\n /* Includes unspecified\
    \ (::/128) and loopback (::1/128) */\n ::/8 orlonger;\n /* IPv4-mapped */\n ::ffff:0:0/96 orlonger;\n /* IPv4 Compatible\
    \ */\n ::/96 orlonger;\n /* 6Bone */\n 3ffe::/16 orlonger;\n /* IPv4-IPv6 Translate */\n 64:ff9b::/96 orlonger;\n /* Reserved\
    \ - 100::/8 includes Discard-Only (100::/64) */\n 100::/8 orlonger;\n 200::/7 orlonger;\n 400::/6 orlonger;\n 800::/5\
    \ orlonger;\n 1000::/4 orlonger;\n 4000::/3 orlonger;\n 6000::/3 orlonger;\n 8000::/3 orlonger;\n a000::/3 orlonger;\n\
    \ c000::/3 orlonger;\n e000::/4 orlonger;\n f000::/5 orlonger;\n f800::/6 orlonger;\n fe00::/9 orlonger;\n /* IETF Protocol\
    \ Assignments */\n 2001::/23 orlonger;\n /* TEREDO */\n 2001::/32 orlonger;\n /* Benchmarking */\n 2001:2::/48 orlonger;\n\
    \ /* Documentation */\n 2001:db8::/32 orlonger;\n /* ORCHID */\n 2001:10::/28 orlonger;\n /* 6to4 */\n 2002::/16 orlonger;\n\
    \ /* Unique-Local */\n fc00::/7 orlonger;\n /* Linked-Scoped Unicast */\n fe80::/10 orlonger;\n /* Site local (deprecated)\
    \ - now reserved */\n fec0::/10 orlonger;\n /* Multicast */\n ff00::/8 orlonger;\n <add additional routes as needed>\n\
    }\nNote: The comments (/* comment */) are annotations used to easily identify each list\nitem. Annotations are not required.\
    \ To add annotations, navigate to the appropriate\nhierarchy level (\"edit policy-options route-filter-list \" in this\
    \ example) and use the\n\"annotate\" command (annotate \"desired comment\").\npolicy-statement bgp-discard {\n term 1\
    \ {\n from {\n route-filter-list bogon;\n route-filter-list bogon-ipv6;\n }\n then reject;\n }\n <add additional terms\
    \ as needed>\n}\nNote: Using a route-filter-list permits list reuse as well as easing management because\nthe policy-statement\
    \ only need reference the list once. Other terms within the same\npolicy-statement can be added without affecting the\
    \ Bogon list.\nThe prefix filter must be referenced inbound on the appropriate BGP neighbor\nstatements.\nVerify the eBGP\
    \ import statement prevents Junos from importing routes into the route\ntable. Junos accepts import statements at three\
    \ hierarchy levels: Global protocol, group,\nand neighbor (peer). Global is the most general, followed by group, and neighbor\
    \ is the\nmost restrictive. Junos applies only the most restrictive policy so if a policy is configured\nat the protocol,\
    \ group, and neighbor level, only the neighbor policy is applied.\n[edit protocols bgp]\ngroup eBGP {\n <other group configuration>\n\
    \ import bgp-discard;\n neighbor 192.0.2.2 {\n <other neighbor configuration>\n import bgp-discard;\n }\n}\nimport bgp-discard;\n\
    <other BGP configuration>\nIf the router is not configured to reject inbound route advertisements for any Bogon\nprefixes,\
    \ this is a finding."
  remediation: 'Ensure all eBGP routers are configured to reject inbound route advertisements for any

    currently defined Bogon prefixes.

    set policy-options route-filter-list bogon 0.0.0.0/8 orlonger

    set policy-options route-filter-list bogon 10.0.0.0/8 orlonger

    set policy-options route-filter-list bogon 100.64.0.0/10 orlonger

    set policy-options route-filter-list bogon 127.0.0.0/8 orlonger

    set policy-options route-filter-list bogon 169.254.0.0/16 orlonger

    set policy-options route-filter-list bogon 172.16.0.0/12 orlonger

    set policy-options route-filter-list bogon 192.0.0.0/24 orlonger

    set policy-options route-filter-list bogon 192.0.2.0/24 orlonger

    set policy-options route-filter-list bogon 192.168.0.0/16 orlonger

    set policy-options route-filter-list bogon 198.18.0.0/15 orlonger

    set policy-options route-filter-list bogon 198.51.100.0/24 orlonger

    set policy-options route-filter-list bogon 203.0.113.0/24 orlonger

    set policy-options route-filter-list bogon 224.0.0.0/4 orlonger

    set policy-options route-filter-list bogon 240.0.0.0/4 orlonger

    set policy-options route-filter-list bogon-ipv6 ::/128 exact

    set policy-options route-filter-list bogon-ipv6 ::1/128 exact

    set policy-options route-filter-list bogon-ipv6 ::ffff:0:0/96 orlonger

    set policy-options route-filter-list bogon-ipv6 ::/96 orlonger

    set policy-options route-filter-list bogon-ipv6 100::/64 orlonger

    set policy-options route-filter-list bogon-ipv6 2001:10::/28 orlonger

    set policy-options route-filter-list bogon-ipv6 2001:db8::/32 orlonger

    set policy-options route-filter-list bogon-ipv6 fc00::/7 orlonger

    set policy-options route-filter-list bogon-ipv6 fe80::/10 orlonger

    set policy-options route-filter-list bogon-ipv6 fec0::/10 orlonger

    set policy-options route-filter-list bogon-ipv6 ff00::/8 orlonger

    set policy-options policy-statement bgp-discard term 1 from route-filter-list

    bogon

    set policy-options policy-statement bgp-discard term 1 from route-filter-list

    bogon-ipv6

    set policy-options policy-statement bgp-discard term 1 then reject

    set protocols bgp group eBGP import bgp-discard

    set protocols bgp group eBGP neighbor 192.0.2.2 import bgp-discard

    set protocols bgp import bgp-discard'
  checks:
  - type: manual_review
    info: "Review the BGP router configuration to verify that it will reject routes of any currently\ndefined Bogon prefixes.\n\
      Example route-filter-list of Bogon addresses with corresponding policy-statement\nreferencing the list:\n[edit policy-options]\n\
      route-filter-list bogon {\n /* This host on this network */\n 0.0.0.0/8 orlonger;\n /* CGN Addresses */\n 100.64.0.0/10\
      \ orlonger;\n /* Loopback */\n 127.0.0.0/8 orlonger;\n /* IPv4 link-local or APIPA */\n 169.254.0.0/16 orlonger;\n /*\
      \ IETF Protocol Assignments (/24) an"
    severity: medium
- id: '1.3'
  title: JUEX-RT-000030
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper BGP router must be configured to reject inbound route advertisements for any prefixes belonging
    to the local autonomous system (AS). GROUP ID: V-253975 RULE ID: SV-253975r843958'
  rationale: Accepting route advertisements belonging to the local AS can result in traffic looping, being black holed, or
    at a minimum using a nonoptimized path.
  impact: ''
  references: []
  page_start: 22
  audit_raw: "Review the BGP router configuration to verify that it will reject routes belonging to the\nlocal AS.\nExample\
    \ route-filter-list of local AS addresses with corresponding policy-statement\nreferencing the list. Verify the routes\
    \ are appropriate for the target environment.\n[edit policy-options]\nroute-filter-list local-routes {\n 192.0.2.0/24\
    \ orlonger;\n 192.0.3.0/24 orlonger;\n}\nroute-filter-list local-routes-ipv6 {\n 2001:db8:2::/64 orlonger;\n 2001:db8:3::/64\
    \ orlonger;\n}\npolicy-statement bgp-discard {\n term 1 {\n from {\n route-filter-list bogon;\n route-filter-list bogon-ipv6;\n\
    \ }\n then reject;\n }\n term 2 {\n from {\n route-filter-list local-routes;\n route-filter-list local-routes-ipv6;\n\
    \ }\n then reject;\n }\n term 3 {\n from protocol [ ospf direct ];\n then reject;\n }\n}\nThe example shows using route-filter-lists\
    \ to ease management. The policy-statement\nalso supports the route directly in the match condition. For example, \"route-filter\n\
    192.0.2.0/24 orlonger\" (in place of route-filter-list local-routes).\nNote: To reject routes learned via OSPF or directly-connected\
    \ routes, include a term\nwith a protocol (OSPF and directly-connected routes shown). The policy-statement\nincludes the\
    \ Bogon term to demonstrate adding terms to a policy without affecting\nexisting terms.\nThe prefix filter must be referenced\
    \ inbound on the appropriate BGP neighbor\nstatements.\nVerify the eBGP import statement prevents Junos from importing\
    \ routes into the route\ntable. Junos accepts import statements at three hierarchy levels: Global protocol, group,\nand\
    \ neighbor (peer). Global is the most general, followed by group, and neighbor is the\nmost restrictive. Junos applies\
    \ only the most restrictive policy so if a policy is configured\nat the protocol, group, and neighbor level, only the\
    \ neighbor policy is applied.\n[edit protocols bgp]\ngroup eBGP {\n <other group configuration>\n import bgp-discard;\n\
    \ neighbor 192.0.2.2 {\n <other neighbor configuration>\n import bgp-discard;\n }\n}\nimport bgp-discard;\n<other BGP\
    \ configuration>\nIf the router is not configured to reject inbound route advertisements belonging to the\nlocal AS, this\
    \ is a finding."
  remediation: 'Ensure all eBGP routers are configured to reject inbound route advertisements for any

    prefixes belonging to the local AS.

    set policy-options route-filter-list local-routes 192.0.2.0/24 orlonger

    set policy-options route-filter-list local-routes 192.0.3.0/24 orlonger

    set policy-options route-filter-list local-routes-ipv6 2001:db8:2::/64

    orlonger

    set policy-options route-filter-list local-routes-ipv6 2001:db8:3::/64

    orlonger

    set policy-options policy-statement bgp-discard term 1 from route-filter-list

    bogon

    set policy-options policy-statement bgp-discard term 1 from route-filter-list

    bogon-ipv6

    set policy-options policy-statement bgp-discard term 1 then reject

    set policy-options policy-statement bgp-discard term 2 from route-filter-list

    local-routes

    set policy-options policy-statement bgp-discard term 2 from route-filter-list

    local-routes-ipv6

    set policy-options policy-statement bgp-discard term 2 then reject

    set policy-options policy-statement bgp-discard term 3 from protocol ospf

    set policy-options policy-statement bgp-discard term 3 from protocol direct

    set policy-options policy-statement bgp-discard term 3 then reject

    set protocols bgp group eBGP import bgp-discard

    set protocols bgp group eBGP neighbor 192.0.2.2 import bgp-discard

    set protocols bgp import bgp-discard'
  checks:
  - type: manual_review
    info: "Review the BGP router configuration to verify that it will reject routes belonging to the\nlocal AS.\nExample route-filter-list\
      \ of local AS addresses with corresponding policy-statement\nreferencing the list. Verify the routes are appropriate\
      \ for the target environment.\n[edit policy-options]\nroute-filter-list local-routes {\n 192.0.2.0/24 orlonger;\n 192.0.3.0/24\
      \ orlonger;\n}\nroute-filter-list local-routes-ipv6 {\n 2001:db8:2::/64 orlonger;\n 2001:db8:3::/64 orlonger;\n}\npolicy-statement\
      \ bgp-discard {\n t"
    severity: medium
- id: '1.4'
  title: JUEX-RT-000040
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper BGP router must be configured to reject inbound route advertisements from a customer edge (CE)
    router for prefixes that are not allocated to that customer. GROUP ID: V-253976 RULE ID: SV-253976r843961'
  rationale: As a best practice, a service provider should only accept customer prefixes that have been assigned to that customer
    and any peering autonomous systems. A multi-homed customer with BGP speaking routers connected to the internet or other
    external networks could be breached and used to launch a prefix deaggregation attack. Without ingress route filtering
    of customers, the effectiveness of such an attack could impact the entire IP core and its customers.
  impact: ''
  references: []
  page_start: 25
  audit_raw: "Review the BGP router configuration to verify there are filters defined to only accept\nroutes for prefixes\
    \ that belong to specific customers.\nExample route-filter-list of customer addresses with corresponding policy-statement\n\
    referencing the list:\n[edit policy-options]\nroute-filter-list customer1-routes {\n <customer route 1/mask> orlonger;\n\
    \ <customer route 2/mask> orlonger;\n}\nroute-filter-list customer1-routes-ipv6 {\n <customer route 1/prefix> orlonger;\n\
    \ <customer route 1/prefix> orlonger;\n}\n<additional route-filter-list for other customers>\npolicy-statement bgp-accept-cust1-routes\
    \ {\n term 1 {\n from {\n route-filter-list customer1-routes;\n route-filter-list customer1-routes-ipv6;\n }\n then accept;\n\
    \ }\n term 2 {\n then reject;\n }\n}\n<additional policies for other customers>\nNote: The example shows using route-filter-lists\
    \ to ease management. The policystatement also supports the route directly in the match condition. For example, \"routefilter\
    \ <customer route 1/mask> orlonger\" (in place of route-filter-list customer-routes).\nVerify the eBGP import statement\
    \ prevents Junos from importing routes into the route\ntable. Junos accepts import statements at three hierarchy levels:\
    \ Global protocol, group,\nand neighbor (peer). Global is the most general, followed by group, and neighbor is the\nmost\
    \ restrictive. Junos applies only the most restrictive policy so if a policy is configured\nat the protocol, group, and\
    \ neighbor level, only the neighbor policy is applied.\n[edit protocols bgp]\ngroup customer1 {\n <other group configuration>\n\
    \ import bgp-accept-cust1-routes;\n neighbor <address> {\n <other neighbor configuration>\n import bgp-accept-cust1-routes;\n\
    \ }\n}\nimport <import policy name>;\n<other BGP configuration>\nIf the router is not configured to reject inbound route\
    \ advertisements from each CE\nrouter for prefixes that are not allocated to that customer, this is a finding.\nNote:\
    \ Routes to PE-CE links within a VPN are needed for troubleshooting end-to-end\nconnectivity across the MPLS/IP backbone.\
    \ Hence, these prefixes are an exception to\nthis requirement."
  remediation: 'Configure all eBGP routers to reject inbound route advertisements from a CE router for

    prefixes that are not allocated to that customer.

    set policy-options route-filter-list customer1-routes <customer route 1/mask>

    orlonger

    set policy-options route-filter-list customer1-routes <customer route 2/mask>

    orlonger

    set policy-options route-filter-list customer1-routes-ipv6 <customer route

    1/prefix> orlonger

    set policy-options route-filter-list customer1-routes-ipv6 <customer route

    2/prefix> orlonger

    <additional route-filter-list for other customers>

    set policy-options policy-statement bgp-accept-cust1-routes term 1 from

    route-filter-list customer-routes

    set policy-options policy-statement bgp-accept-cust1-routes term 1 from

    route-filter-list customer-routes-ipv6

    set policy-options policy-statement bgp-accept-cust1-routes term 1 then

    accept

    set policy-options policy-statement bgp-accept-cust1-routes term 2 then

    reject

    <additional policies for other customers>

    set protocols bgp group customer1 import bgp-accept-cust1-routes

    set protocols bgp group customer1 neighbor <address> import bgp-accept-cust1routes

    Note: An import filter is only required at the group, or the neighbor, level but not both

    unless the specific neighbor requires a different import filter than the group.'
  checks:
  - type: manual_review
    info: "Review the BGP router configuration to verify there are filters defined to only accept\nroutes for prefixes that\
      \ belong to specific customers.\nExample route-filter-list of customer addresses with corresponding policy-statement\n\
      referencing the list:\n[edit policy-options]\nroute-filter-list customer1-routes {\n <customer route 1/mask> orlonger;\n\
      \ <customer route 2/mask> orlonger;\n}\nroute-filter-list customer1-routes-ipv6 {\n <customer route 1/prefix> orlonger;\n\
      \ <customer route 1/prefix> orlonger;\n}\n<ad"
    severity: medium
- id: '1.5'
  title: JUEX-RT-000050
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper BGP router must be configured to reject outbound route advertisements for any prefixes that do
    not belong to any customers or the local autonomous system (AS). GROUP ID: V-253977 RULE ID: SV-253977r843964'
  rationale: Advertisement of routes by an AS for networks that do not belong to any of its customers pulls traffic away from
    the authorized network. This causes a denial of service (DoS) on the network that allocated the block of addresses and
    may cause a DoS on the network that is inadvertently advertising it as the originator. It is also possible that a misconfigured
    or compromised router within the GIG IP core could redistribute IGP routes into BGP, thereby leaking internal routes.
  impact: ''
  references: []
  page_start: 28
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the BGP router configuration to verify there\
    \ is a filter defined to only advertise\nroutes for prefixes belonging to any customer or the local AS.\nExample route-filter-list\
    \ of customer addresses with corresponding policy-statement\nreferencing the list:\n[edit policy-options]\nroute-filter-list\
    \ customer1-routes {\n <customer route 1/mask> exact;\n <customer route 2/mask> exact;\n}\nroute-filter-list customer1-routes-ipv6\
    \ {\n <customer route 1/prefix> exact;\n <customer route 2/prefix> exact;\n}\n<additional route-filter-lists for other\
    \ customers>\npolicy-statement bgp-advertise-cust-routes {\n term 1 {\n from {\n route-filter-list customer1-routes;\n\
    \ route-filter-list customer1-routes-ipv6;\n }\n then accept;\n }\n <additional terms for other customers>\n term default\
