- id: '1.27'
  title: JUEX-RT-000270
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper router must be configured to have all nonessential capabilities disabled. GROUP ID: V-253999 RULE
    ID: SV-253999r844030'
  rationale: A compromised router introduces risk to the entire network infrastructure, as well as data resources that are
    accessible via the network. The perimeter defense has no oversight or control of attacks by malicious users within the
    network. Preventing network breaches from within is dependent on implementing a comprehensive defense-in-depth strategy,
    including securing each device connected to the network. This is accomplished by following and implementing all security
    guidance applicable for each node type. A fundamental step in securing each router is to enable only the capabilities
    required for operation.
  impact: ''
  references: []
  page_start: 86
  audit_raw: 'Review the router configuration to determine if services or functions not required for

    operation, or not related to router functionality (e.g., DNS, email client or server, FTP

    server, or web server) are enabled.

    By default, unnecessary services like finger, telnet, TFTP and FTP are not enabled and

    will not be listed at [edit system services].

    For example, the following services should NOT be enabled as shown:

    [edit system services]

    finger;

    ftp;

    rlogin;

    telnet;

    tftp-server;

    web-management;

    Note: If the services listed above are marked "inactive", they are not enabled.

    If unnecessary services and functions are enabled on the router, this is a finding.'
  remediation: 'Remove unneeded services and functions from the router. For example:

    delete system services finger

    delete system services ftp

    delete system services rlogin

    delete system services telnet

    delete system services tftp-server

    delete system services web-management

    For processes that support disable:

    set system processes web-management disable

    Removal is recommended because the service or function may be inadvertently

    enabled otherwise.

    However, if removal is not possible, disable the service or function.'
  checks:
  - type: manual_review
    info: 'Review the router configuration to determine if services or functions not required for

      operation, or not related to router functionality (e.g., DNS, email client or server, FTP

      server, or web server) are enabled.

      By default, unnecessary services like finger, telnet, TFTP and FTP are not enabled and

      will not be listed at [edit system services].

      For example, the following services should NOT be enabled as shown:

      [edit system services]

      finger;

      ftp;

      rlogin;

      telnet;

      tftp-server;

      web-management;

      Note:'
    severity: medium
- id: '1.28'
  title: JUEX-RT-000280
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must not be configured to have any feature enabled that calls home to the vendor. GROUP
    ID: V-254000 RULE ID: SV-254000r844033'
  rationale: Call home services will routinely send data such as configuration and diagnostic information to the vendor for
    routine or emergency analysis and troubleshooting. There is a risk that transmission of sensitive data sent to unauthorized
    persons could result in data loss or downtime due to an attack.
  impact: ''
  references: []
  page_start: 88
  audit_raw: "Verify the call home service is disabled on the device.\nVerify [edit system] does NOT contain a phone-home\
    \ hierarchy as shown:\n[edit system]\nhost-name <hostname>;\n:\n<other system configuration>\n:\nphone-home {\n server\
    \ https://<applicable URL>;\n rfc-compliant;\n}\nIf a call home service is enabled, this is a finding."
  remediation: 'Configure the network device to disable the call home service or feature.

    Delete the phone-home hierarchy under [edit system].

    delete system phone-home

    Note: Because the command is hidden, Junos will not autocomplete and "phone-home"

    must be explicitly, and correctly, spelled out.'
  checks:
  - type: manual_review
    info: "Verify the call home service is disabled on the device.\nVerify [edit system] does NOT contain a phone-home hierarchy\
      \ as shown:\n[edit system]\nhost-name <hostname>;\n:\n<other system configuration>\n:\nphone-home {\n server https://<applicable\
      \ URL>;\n rfc-compliant;\n}\nIf a call home service is enabled, this is a finding."
    severity: medium
- id: '1.29'
  title: JUEX-RT-000290
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to use encryption for routing protocol authentication. GROUP ID: V-254001
    RULE ID: SV-254001r844036'
  rationale: A rogue router could send a fictitious routing update to convince a site's perimeter router to send traffic to
    an incorrect or even a rogue destination. This diverted traffic could be analyzed to learn confidential information about
    the site's network or used to disrupt the network's ability to communicate with other networks. This is known as a "traffic
    attraction attack" and is prevented by configuring neighbor router authentication for routing updates. However, using
    clear-text authentication provides little benefit since an attacker can intercept traffic and view the authentication
    key. This would allow the attacker to use the authentication key in an attack. This requirement applies to all IPv4 and
    IPv6 protocols that are used to exchange routing or packet forwarding information; this includes all Interior Gateway
    Protocols (such as OSPF, EIGRP, and IS-IS) and Exterior Gateway Protocols (such as BGP), MPLS-related protocols (such
    as LDP), and multicast-related protocols.
