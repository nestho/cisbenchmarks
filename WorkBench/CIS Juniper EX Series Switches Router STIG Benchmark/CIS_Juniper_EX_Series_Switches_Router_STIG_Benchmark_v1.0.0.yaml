- id: '1.40'
  title: JUEX-RT-000400
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper perimeter router must be configured to filter traffic destined to the enclave in accordance with
    the guidelines contained in DoD Instruction 8551.1. GROUP ID: V-254012 RULE ID: SV-254012r844069'
  rationale: Vulnerability assessments must be reviewed by the System Administrator, and protocols must be approved by the
    Information Assurance (IA) staff before entering the enclave. Stateless firewall filters are the first line of defense
    in a layered security approach. They permit authorized packets and deny unauthorized packets based on port or service
    type. They enhance the posture of the network by not allowing packets to reach a potential target within the security
    domain. The lists provided are highly susceptible ports and services that should be blocked or limited as much as possible
    without adversely affecting customer requirements. Auditing packets attempting to penetrate the network but that are stopped
    by a firewall filter will allow network administrators to broaden their protective ring and more tightly define the scope
    of operation. If the perimeter is in a Deny-by-Default posture and what is allowed through the filter is in accordance
    with DoD Instruction 8551.1, and if the permit rule is explicitly defined with explicit ports and protocols allowed, then
    all requirements related to PPS being blocked would be satisfied.
  impact: ''
  references: []
  page_start: 146
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to verify that the\
    \ ingress filter is in accordance with DoD\n8551. For example, assuming TCP 80 and 443 are permitted inbound:\n[edit policy-options]\n\
    prefix-list inside-addresses-ipv4 {\n <interior IPv4 subnet / mask>;\n}\nprefix-list inside-addresses-ipv4 {\n <interior\
    \ IPv6 subnet / prefix>;\n}\n[edit firewall]\nfamily inet {\n filter inbound-ipv4 {\n term 1 {\n from {\n destination-prefix-list\
    \ inside-addresses-ipv4;\n protocol tcp;\n destination-port [ 80 443 ];\n }\n then accept;\n }\n <other terms as required>\n\
    \ term default-deny {\n then {\n log;\n syslog;\n discard;\n }\n }\n }\n}\nfamily inet6 {\n filter inbound-ipv6 {\n term\
    \ 1 {\n from {\n destination-prefix-list inside-addresses-ipv6;\n next-header tcp;\n destination-port [ 80 443 ];\n }\n\
    \ then accept;\n }\n <other terms as required>\n term default-deny {\n then {\n log;\n syslog;\n discard;\n }\n }\n }\n\
    }\nIf the router does not filter traffic in accordance with the guidelines contained in DoD\n8551, this is a finding."
  remediation: 'This requirement is not applicable for the DODIN Backbone.

    Configure the router to use ingress firewall filters to restrict traffic in accordance with the

    guidelines contained in DOD Instruction 8551.1 for all services and protocols required

    for operational commitments.

    set policy-options prefix-list inside-addresses-ipv4 <IPv4 subnet>/<mask>

    <additional subnets as required>

    set policy-options prefix-list inside-addresses-ipv6 <IPv6 subnet>/<prefix>

    <additional subnets as required>

    set firewall family inet filter inbound-ipv4 term 1 from destination-prefixlist inside-addresses-ipv4

    set firewall family inet filter inbound-ipv4 term 1 from protocol tcp

    set firewall family inet filter inbound-ipv4 term 1 from destination-port 80

    set firewall family inet filter inbound-ipv4 term 1 from destination-port 443

    set firewall family inet filter inbound-ipv4 term 1 then accept

    <additional terms as required>

    set firewall family inet filter inbound-ipv4 term default-deny then log

    set firewall family inet filter inbound-ipv4 term default-deny then syslog

    set firewall family inet filter inbound-ipv4 term default-deny then discard

    set firewall family inet6 filter inbound-ipv6 term 1 from destination-prefixlist inside-addresses-ipv6

    set firewall family inet6 filter inbound-ipv6 term 1 from next-header tcp

    set firewall family inet6 filter inbound-ipv6 term 1 from destination-port 80

    set firewall family inet6 filter inbound-ipv6 term 1 from destination-port

    443

    set firewall family inet6 filter inbound-ipv6 term 1 then accept

    set firewall family inet6 filter inbound-ipv6 term default-deny then log

    set firewall family inet6 filter inbound-ipv6 term default-deny then syslog

    set firewall family inet6 filter inbound-ipv6 term default-deny then discard'
  checks:
  - type: manual_review
    info: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to verify that the\
      \ ingress filter is in accordance with DoD\n8551. For example, assuming TCP 80 and 443 are permitted inbound:\n[edit\
      \ policy-options]\nprefix-list inside-addresses-ipv4 {\n <interior IPv4 subnet / mask>;\n}\nprefix-list inside-addresses-ipv4\
      \ {\n <interior IPv6 subnet / prefix>;\n}\n[edit firewall]\nfamily inet {\n filter inbound-ipv4 {\n term 1 {\n from\
      \ {\n destination-prefix-list inside-addresses-ipv4;\n"
    severity: medium
- id: '1.41'
  title: JUEX-RT-000410
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper perimeter router must be configured to filter ingress traffic at the external interface on an
    inbound direction. GROUP ID: V-254013 RULE ID: SV-254013r844072'
  rationale: 'Firewall filters are used to separate data traffic into that which it will route (permitted packets) and that
    which it will not route (denied packets). Secure configuration of routers makes use of firewall filters for restricting
    access to services on the router itself as well as for filtering traffic passing through the router. Inbound versus Outbound:
    It should be noted that some operating systems default access lists are applied to the outbound queue. The more secure
    solution is to apply the access list to the inbound queue for three reasons: • The router can protect itself before damage
    is inflicted. • The input port is still known and can be filtered upon. • It is more efficient to filter packets before
    routing them.'
  impact: ''
  references: []
  page_start: 149
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to verify that the\
    \ ingress firewall filter is bound to the\nexternal interface in an inbound direction.\n[edit interfaces]\n<external interface>\
    \ {\n unit <number> {\n family inet {\n filter {\n input inbound-ipv4;\n }\n }\n family inet6 {\n filter {\n input inbound-ipv6;\n\
    \ }\n }\n }\n}\nNote: Some Juniper devices support both monolithic filters and filter lists. Filter lists\nseparate each\
    \ term, or set of terms, into a separate filter that is applied sequentially to\nan interface. If using filter lists,\
    \ the keywords \"input\" or \"output\" change to \"input-list\" or\n\"output-list\". Verify the final list item is a deny-all\
    \ filter. The deny-all filter is created once\nper family and can be reused across multiple lists. For example:\ninput-list\
    \ [ permit_mgt permit_routing_protocols default-deny ];\nIf the router is not configured to filter traffic entering the\
    \ network at the external interface\nin an inbound direction, this is a finding."
  remediation: 'This requirement is not applicable for the DODIN Backbone.

    Bind the ingress firewall filter to the external interface (inbound).

    set interfaces <external interface name> unit <number> family inet filter

    input inbound-ipv4

    set interfaces <external interface name> unit <number> family inet6 filter

    input inbound-ipv6'
  checks:
  - type: manual_review
    info: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to verify that the\
      \ ingress firewall filter is bound to the\nexternal interface in an inbound direction.\n[edit interfaces]\n<external\
      \ interface> {\n unit <number> {\n family inet {\n filter {\n input inbound-ipv4;\n }\n }\n family inet6 {\n filter\
      \ {\n input inbound-ipv6;\n }\n }\n }\n}\nNote: Some Juniper devices support both monolithic filters and filter lists.\
      \ Filter lists\nseparate each term, or set of terms, into a sepa"
    severity: medium
