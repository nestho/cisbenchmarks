      \ }\n interface <interface name>.<logical unit> {\n interface-mac-limit {\n <value>;\n }\n }\n }\n }\n}\nNote: Only\
      \ EX9200-series devices currently support VPLS.\nIf a limit has not"
    severity: medium
- id: '1.32'
  title: JUEX-RT-000320
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper MPLS router with RSVP-TE enabled must be configured to enable refresh reduction features. GROUP
    ID: V-254004 RULE ID: SV-254004r844045'
  rationale: 'RSVP-TE can be used to perform constraint-based routing when building LSP tunnels within the network core that
    will support QoS and traffic engineering requirements. RSVP-TE is also used to enable MPLS Fast Reroute, a network restoration
    mechanism that will reroute traffic onto a backup LSP in case of a node or link failure along the primary path. When there
    is a disruption in the MPLS core, such as a link flap or router reboot, the result is a significant amount of RSVP signaling,
    such as "PathErr" and "ResvErr" messages that need to be sent for every LSP using that link. When RSVP messages are sent
    out, they are sent either hop by hop or with the router alert bit set in the IP header. This means that every router along
    the path must examine the packet to determine if additional processing is required for these RSVP messages. If there is
    enough signaling traffic in the network, it is possible for an interface to receive more packets for its input queue than
    it can hold, resulting in dropped RSVP messages and hence slower RSVP convergence. Increasing the size of the interface
    input queue can help prevent dropping packets; however, there is still the risk of having a burst of signaling traffic
    that can fill the queue. Solutions to mitigate this risk are RSVP message pacing or refresh reduction to control the rate
    at which RSVP messages are sent. RSVP refresh reduction includes the following features: RSVP message bundling, RSVP Message
    ID to reduce message processing overhead, Reliable delivery of RSVP messages using Message ID, and summary refresh to
    reduce the amount of information transmitted every refresh interval.'
  impact: ''
  references: []
  page_start: 98
  audit_raw: "Review the router configuration to verify that the router has been configured to enable\nrefresh reduction features.\
    \ Junos OS controls RSVP refresh reduction features using\ntwo commands:\naggregate: RSVP message bundling and summary\
    \ refresh.\nreliable: RSVP message ID, reliable message delivery, and summary refresh.\nStarting in Junos 15.2, refresh\
    \ reduction is enabled by default and the \"aggregate\"\ncommand is deprecated. Configuring the \"aggregate\" command\
    \ generates a warning\nmessage in the configuration file (## Warning: \"aggregate\" is deprecated). On Junos\nearlier\
    \ than 15.2, verify the \"aggregate\" command is enabled. On Junos 15.2 and later,\nno command is required.\nJunos earlier\
    \ than 15.2:\n[edit protocols]\nrsvp {\n interface <interface name>.<logical unit> {\n aggregate;\n reliable; << If RSVP\
    \ message ID and reliable message delivery are\nrequired.\n }\n}\nJunos 15.2 but pre-16.1R1:\n[edit protocols]\nrsvp {\n\
    \ interface <interface name>.<logical unit> {\n reliable; << If RSVP message ID and reliable message delivery are\nrequired.\n\
    \ }\n}\nStarting in Junos 16.1R1, all refresh reduction features are enabled by default. Verify\nthe 'no-reliable' command\
    \ is configured only if RSVP message ID and reliable message\ndelivery are not required. To enable all refresh reduction\
    \ features, no commands are\nnecessary.\nJunos 16.1R1 and later:\n[edit protocols]\nrsvp {\n interface <interface name>.<logical\
    \ unit> {\n <other configuration>\n }\n}\nIf the router with RSVP-TE enabled does not have message pacing configured based\n\
    on the link speed and input queue size of adjacent core routers, this is a finding."
  remediation: 'Configure RSVP-TE enabled routers with refresh reduction features.

    Junos earlier than 15.2:

    set protocols rsvp interface <interface name>.<logical unit> aggregate

    set protocols rsvp interface <interface name>.<logical unit> reliable

    Junos 15.2 but pre 16.1R1:

    set protocols rsvp interface <interface name>.<logical unit> reliable

    Junos 16.1R1 and later:

    set protocols rsvp interface <interface name>.<logical unit> <other

    configuration>'
  checks:
  - type: manual_review
    info: 'Review the router configuration to verify that the router has been configured to enable

      refresh reduction features. Junos OS controls RSVP refresh reduction features using

      two commands:

      aggregate: RSVP message bundling and summary refresh.

      reliable: RSVP message ID, reliable message delivery, and summary refresh.

      Starting in Junos 15.2, refresh reduction is enabled by default and the "aggregate"

      command is deprecated. Configuring the "aggregate" command generates a warning

      message in the configu'
    severity: medium
- id: '1.33'
  title: JUEX-RT-000330
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper PE router providing Virtual Private LAN Services (VPLS) must be configured to have traffic storm
    control thresholds on CE-facing interfaces. GROUP ID: V-254005 RULE ID: SV-254005r844048'
  rationale: A traffic storm occurs when packets flood a VPLS bridge, creating excessive traffic and degrading network performance.
    Traffic storm control prevents VPLS bridge disruption by suppressing traffic when the number of packets reaches configured
    threshold levels. Traffic storm control monitors incoming traffic levels on a port and drops traffic when the number of
    packets reaches the configured threshold level during any one-second interval.
  impact: ''
  references: []
  page_start: 101
  audit_raw: "Review the router configuration to verify that storm control is enabled on CE-facing\ninterfaces deploying VPLS.\n\
    Verify that a stateless firewall filter has been applied to each VPLS routing instances.\n[edit]\nrouting-instances {\n\
    \ <name> {\n forwarding-options {\n family vpls {\n flood {\n input <filter name>;\n }\n }\n }\n }\n}\nVerify the filter\
    \ defines traffic types associated with storm control (i.e., broadcast,\nmulticast, and unknown unicast storms).\nfirewall\
    \ {\n family vpls {\n filter <filter name> {\n term <term name> {\n from {\n traffic-type broadcast;\n }\n then {\n policer\
    \ <policer name>;\n accept;\n }\n }\n term <term name> {\n from {\n traffic-type multicast;\n }\n then {\n policer <policer\
    \ name>;\n accept;\n }\n }\n term <term name> {\n from {\n traffic-type unknown-unicast;\n }\n then {\n policer <policer\
    \ name>;\n accept;\n }\n }\n }\n }\n}\nVerify that the policer rate limits in accordance with local requirements.\nfirewall\
    \ {\n policer <policer name> {\n if-exceeding {\n bandwidth-limit <value>;\n burst-size-limit <value>;\n }\n then discard;\n\
    \ }\n}\nNote: Only EX9200-series devices currently support VPLS.\nIf storm control is not enabled for broadcast traffic,\
    \ this is a finding."
  remediation: 'Configure storm control for each CE-facing interface deploying VPLS bridge domains.

    Base the suppression threshold on expected traffic rates plus some additional capacity.

    Configure a policer to rate limit traffic providing storm control in accordance with

    organizational requirements.

    set firewall policer <policer name> if-exceeding bandwidth-limit <value>

    burst-size-limit <value>

    set firewall policer <policer name> then discard

    Configure the filter providing storm control to specify traffic types and rate limit

    broadcast, multicast, and unknown unicast storms.

    set firewall family vpls filter <filter name> term <term name> from traffictype broadcast

    set firewall family vpls filter <filter name> term <term name> then policer

    <policer name> accept

    set firewall family vpls filter <filter name> term <term name> from traffictype multicast

    set firewall family vpls filter <filter name> term <term name> then policer

    <policer name> accept

    set firewall family vpls filter <filter name> term <term name> from traffictype unknown-unicast

    set firewall family vpls filter <filter name> term <term name> then policer

    <policer name> accept

    Apply the storm control filter to all CE-facing instances deploying VPLS bridge domains.

    set routing-instances <instance name> forwarding-options family vpls flood

    input <filter name>'
  checks:
  - type: manual_review
    info: "Review the router configuration to verify that storm control is enabled on CE-facing\ninterfaces deploying VPLS.\n\
      Verify that a stateless firewall filter has been applied to each VPLS routing instances.\n[edit]\nrouting-instances\
      \ {\n <name> {\n forwarding-options {\n family vpls {\n flood {\n input <filter name>;\n }\n }\n }\n }\n}\nVerify the\
      \ filter defines traffic types associated with storm control (i.e., broadcast,\nmulticast, and unknown unicast storms).\n\
      firewall {\n family vpls {\n filter <filter name> {\n t"
    severity: medium
- id: '1.34'
  title: JUEX-RT-000340
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper PE router must be configured to enforce a Quality-of-Service (QoS) policy to limit the effects
    of packet flooding denial-of-service (DoS) attacks. GROUP ID: V-254006 RULE ID: SV-254006r997521'
  rationale: DoS is a condition when a resource is not available for legitimate users. Packet flooding distributed denial-of-service
    (DDoS) attacks are referred to as volumetric attacks and have the objective of overloading a network or circuit to deny
    or seriously degrade performance, which denies access to the services that normally traverse the network or circuit. Volumetric
    attacks have become relatively easy to launch using readily available tools such as Low Orbit Ion Cannon or botnets. Measures
    to mitigate the effects of a successful volumetric attack must be taken to ensure that sufficient capacity is available
    for mission-critical traffic. Managing capacity may include, for example, establishing selected network usage priorities
    or quotas and enforcing them using rate limiting, QoS, or other resource reservation control methods. These measures may
    also mitigate the effects of sudden decreases in network capacity that are the result of accidental or intentional physical
    damage to telecommunications facilities (such as cable cuts or weather-related outages).
  impact: ''
  references: []
  page_start: 104
  audit_raw: "Review the router configuration and interview the System Administrator to verify that a\nmechanism for traffic\
    \ prioritization and bandwidth reservation exists. For example:\n[edit class-of-service]\nclassifiers {\n dscp <classifier\
    \ name> {\n forwarding-class NC {\n loss-priority low code-points 110000;\n }\n forwarding-class EF {\n loss-priority\
    \ high code-points [ 101101 101111 100101 100111\n110011 ];\n loss-priority low code-points [ 101000 100000 101001 101011\n\
    100001 100011 110001 ];\n }\n forwarding-class AF41 {\n loss-priority high code-points [ 100010 100100 100110 ];\n loss-priority\
    \ low code-points [ 011000 101110 011100 011110 ];\n }\n forwarding-class AF31 {\n loss-priority high code-points [ 011101\
    \ 011111 011010 010101\n010111 010010 001101 001010 010000 ];\n loss-priority low code-points [ 001001 001011 010001 010011\n\
    011001 011011 ];\n }\n forwarding-class BE {\n loss-priority high code-points 000000;\n }\n forwarding-class Default {\n\
    \ loss-priority high code-points 001000;\n }\n forwarding-class dscp15 {\n loss-priority high code-points 001111;\n }\n\
    \ }\n}\nNote: Some platforms apply DSCP values to both IPv4 and IPv6 traffic with a single\nclassifier definition (as\
    \ shown). Those platforms that support separating classifiers will\nrequire a \"dscp-ipv6\" stanza.\nhost-outbound-traffic\
    \ {\n forwarding-class NC;\n dscp-code-point 110000;\n}\nshared-buffer {\n ingress {\n percent 50;\n buffer-partition\
    \ lossless {\n percent 5;\n }\n buffer-partition lossless-headroom {\n percent 0;\n }\n buffer-partition lossy {\n percent\
    \ 95;\n }\n }\n egress {\n percent 100;\n buffer-partition lossless {\n percent 50;\n }\n buffer-partition lossy {\n percent\
    \ 45;\n }\n buffer-partition multicast {\n percent 5;\n }\n }\n}\nNote: Some platforms only support shared-buffer percent,\
    \ and cannot separate between\ningress and egress. Not all devices require a shared-buffer stanza.\nforwarding-classes\
    \ {\n class NC queue-num 7;\n class EF queue-num 6;\n class AF41 queue-num 5;\n class AF31 queue-num 4;\n class BE queue-num\
    \ 0;\n class Default queue-num 1;\n class dscp15 queue-num 6;\n}\ntraffic-control-profiles {\n <control profile name 1>\
    \ {\n scheduler-map <scheduler map name 1>;\n shaping-rate percent 100;\n }\n <control profile name 2> {\n scheduler-map\
    \ <scheduler map name 2>;\n guaranteed-rate percent 20;\n }\n}\nforwarding-class-sets {\n <set name 1> {\n class NC;\n\
    \ class EF;\n class AF41;\n class AF31;\n class Default;\n class dscp15;\n }\n <set name 2> {\n class BE;\n }\n}\ninterfaces\
    \ {\n <interface name> {\n forwarding-class-set {\n <set name 1> {\n output-traffic-control-profile <control profile name\
    \ 1>;\n }\n <set name 2> {\n output-traffic-control-profile <control profile name 2>;\n }\n }\n classifiers {\n dscp <classifier\
    \ name>;\n }\n rewrite-rules {\n dscp <rewrite rule name>;\n }\n }\n}\nrewrite-rules {\n dscp <rewrite rule name> {\n\
    \ forwarding-class dscp15 {\n loss-priority high code-point 101101;\n }\n forwarding-class EF {\n loss-priority low code-point\
    \ 110001;\n }\n forwarding-class AF41 {\n loss-priority high code-point 100110;\n }\n forwarding-class NC {\n loss-priority\
    \ low code-point 110000;\n }\n forwarding-class AF31 {\n loss-priority high code-point 010000;\n }\n forwarding-class\
    \ Default {\n loss-priority high code-point 001000;\n }\n }\n}\nNote: Some platforms require rewriting all DSCP values\
    \ if rewriting one (smaller\nplatforms). Most support only rewriting a single DSCP value, which would eliminate all\n\
    but one rewrite rule.\nscheduler-maps {\n <scheduler map name 1> {\n forwarding-class NC scheduler NC;\n forwarding-class\
    \ EF scheduler EF;\n forwarding-class AF41 scheduler AF41;\n forwarding-class AF31 scheduler AF31;\n forwarding-class\
    \ Default scheduler Default;\n }\n <scheduler map name 2> {\n forwarding-class BE scheduler BE;\n }\n}\nschedulers {\n\
    \ NC {\n buffer-size percent 5;\n priority strict-high;\n }\n EF {\n shaping-rate percent 20;\n buffer-size percent 19;\n\
    \ priority strict-high;\n }\n AF41 {\n shaping-rate percent 15;\n buffer-size percent 14;\n priority strict-high;\n }\n\
    \ AF31 {\n shaping-rate percent 31;\n buffer-size percent 29;\n priority strict-high;\n }\n BE {\n transmit-rate percent\
    \ 20;\n buffer-size percent 20;\n priority low;\n }\n Default {\n shaping-rate percent 10;\n buffer-size percent 9;\n\
    \ priority strict-high;\n }\n}\nThis arrangement must ensure that sufficient capacity is available for mission-critical\n\
