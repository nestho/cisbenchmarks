- id: '1.18'
  title: JUEX-RT-000180
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper perimeter router must not be configured to be a Border Gateway Protocol (BGP) peer to an alternate
    gateway service provider. GROUP ID: V-253990 RULE ID: SV-253990r844003'
  rationale: ISPs use BGP to share route information with other autonomous systems (i.e., other ISPs and corporate networks).
    If the perimeter router was configured to BGP peer with an ISP, NIPRNet routes could be advertised to the ISP; thereby
    creating a backdoor connection from the internet to the NIPRNet.
  impact: ''
  references: []
  page_start: 61
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the configuration of the router connecting\
    \ to the alternate gateway.\nReview the [edit protocols bgp] hierarchy and verify there are no BGP neighbors\nconfigured\
    \ to the remote AS that belongs to the alternate gateway service provider. For\nexample:\n[edit protocols bgp]\ngroup\
    \ eBGP {\n type external;\n peer-as 2;\n neighbor <address-1> {\n <bgp neighbor configuration>;\n }\n neighbor <address-2>\
    \ {\n <bgp neighbor configuration>;\n }\n}\nNote: Neither neighbor can belong to a peer AS belonging to the alternate\
    \ gateway\nservice provider.\nVerify static routing to the peer AS belonging to the alternate gateway service provider.\n\
    For example:\n[edit routing-options]\nrib inet6.0 {\n static {\n route <peer AS IPv6 subnet>/<prefix> next-hop <peer AS\
    \ router>;\n }\n}\nstatic {\n route <peer AS IPv4 subnet>/<mask> next-hop <peer AS router>;\n}\nIf there are BGP neighbors\
    \ connecting the remote AS of the alternate gateway service\nprovider, this is a finding."
  remediation: 'This requirement is not applicable for the DODIN Backbone.

    Remove BGP neighbors belonging to the alternate gateway service provider.

    delete protocols bgp group <name> neighbor <peer AS belonging to alternate

    gateway service provider>

    Configure a static route on the perimeter router to reach the AS of a router connecting

    to an alternate gateway.

    set routing-options rib inet6.0 static route <IPv6 subnet>/<prefix> next-hop

    <peer AS router>

    set routing-options static route <IPv4 subnet>/<mask> next-hop <peer AS

    router>'
  checks:
  - type: manual_review
    info: "This requirement is not applicable for the DODIN Backbone.\nReview the configuration of the router connecting to\
