- id: '1.50'
  title: JUEX-RT-000500
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper perimeter router must be configured to restrict it from accepting outbound IP packets that contain
    an illegitimate address in the source address field via egress filter or by enabling Unicast Reverse Path Forwarding (uRPF).
    GROUP ID: V-254022 RULE ID: SV-254022r997530'
  rationale: A compromised host in an enclave can be used by a malicious platform to launch cyberattacks on third parties.
    This is a common practice in "botnets", which are a collection of compromised computers using malware to attack other
    computers or networks. DDoS attacks frequently leverage IP source address spoofing to send packets to multiple hosts that
    in turn will then send return traffic to the hosts with the IP addresses that were forged. This can generate significant
    amounts of traffic. Therefore, protection measures to counteract IP source address spoofing must be taken. When uRPF is
    enabled in strict mode, the packet must be received on the interface that the device would use to forward the return packet;
    thereby mitigating IP source address spoofing.
  impact: ''
  references: []
  page_start: 182
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to verify uRPF or\
    \ an egress filter has been configured\non all internal interfaces to restrict the router from accepting outbound IP packets\
    \ that\ncontain an illegitimate address in the source address field.\n[edit interfaces]\n<internal interface name> {\n\
    \ unit <number> {\n family inet {\n rpf-check;\n address <IPv4 address>/<mask>;\n }\n family inet6 {\n rpf-check;\n address\
    \ <IPv6 address>/<prefix>;\n }\n }\n}\nFor those platforms that do not support uRPF, verify an egress stateless firewall\
    \ filter is\napplied to all internal interfaces. In this example, the egress (from the enclave) filter is\napplied in\
    \ the input direction of internal interfaces to prevent the router from accepting\npackets sourced from any address except\
    \ the internal subnets. For example:\n[edit policy-options]\nprefix-list internal-prefixes-ipv4 {\n 192.0.2.0/24;\n}\n\
    prefix-list internal-prefixes-ipv6 {\n 2001:0:2::/64;\n}\n[edit firewall]\nfamily inet {\n filter internal-inbound-ipv4\
    \ {\n term 1 {\n from {\n source-prefix-list {\n internal-prefixes-ipv4;\n }\n }\n then accept;\n }\n term default {\n\
    \ then {\n log;\n syslog;\n discard;\n }\n }\n }\n}\nfamily inet6 {\n filter internal-inbound-ipv6 {\n term 1 {\n from\
    \ {\n source-prefix-list {\n internal-prefixes-ipv6;\n }\n }\n then accept;\n }\n term default {\n then {\n log;\n syslog;\n\
    \ discard;\n }\n }\n }\n}\nVerify the appropriate filter is applied to each internal interface. For example:\n[edit interfaces]\n\
    <internal interface name> {\n unit <number> {\n family inet {\n filter {\n input internal-inbound-ipv4;\n }\n address\
    \ <IPv4 address>/<mask>;\n }\n family inet6 {\n filter {\n input internal-inbound-ipv6;\n }\n address <IPv6 address>/<prefix>;\n\
    \ }\n }\n}\nNote: Some Juniper devices support both monolithic filters and filter lists. Filter lists\nseparate each term,\
    \ or set of terms, into a separate filter that is applied sequentially to\nan interface. If using filter lists, the keywords\
    \ \"input\" or \"output\" change to \"input-list\" or\n\"output-list\". Verify the final list item is a deny-all filter.\
    \ The deny-all filter is created once\nper family and can be reused across multiple lists. For example:\ninput-list [\
    \ permit_mgt permit_routing_protocols default-deny ];\nIf uRPF or an egress filter to restrict the router from accepting\
    \ outbound IP packets that\ncontain an illegitimate address in the source address field has not been configured on\nall\
    \ internal interfaces, this is a finding."
  remediation: 'This requirement is not applicable for the DODIN Backbone.

    Configure the router to ensure that an egress filter or uRPF is configured to restrict the

    router from accepting any outbound IP packet that contains an external IP address in

    the source field.

    set interfaces <internal interface name> unit <number> family inet rpf-check

    set interfaces <internal interface name> unit <number> family inet6 rpf-check

    For example, configure firewall filter and apply to internal interfaces:

    set policy-options prefix-list internal-prefixes-ipv4 192.0.2.0/24

    set policy-options prefix-list internal-prefixes-ipv6 2001:0:2::/64

    set firewall family inet filter internal-inbound-ipv4 term 1 from sourceprefix-list internal-prefixes-ipv4

    set firewall family inet filter internal-inbound-ipv4 term 1 then accept

    set firewall family inet filter internal-inbound-ipv4 term default then log

    set firewall family inet filter internal-inbound-ipv4 term default then

    syslog

    set firewall family inet filter internal-inbound-ipv4 term default then

    discard

    set firewall family inet6 filter internal-inbound-ipv6 term 1 from sourceprefix-list internal-prefixes-ipv6

    set firewall family inet6 filter internal-inbound-ipv6 term 1 then accept

    set firewall family inet6 filter internal-inbound-ipv6 term default then log

    set firewall family inet6 filter internal-inbound-ipv6 term default then

    syslog

    set firewall family inet6 filter internal-inbound-ipv6 term default then

    discard

    set interfaces ge-0/0/0 unit 0 family inet filter input internal-inbound-ipv4

    set interfaces ge-0/0/0 unit 0 family inet6 filter input internal-inboundipv6'
  checks:
  - type: manual_review
    info: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to verify uRPF or an\
      \ egress filter has been configured\non all internal interfaces to restrict the router from accepting outbound IP packets\
      \ that\ncontain an illegitimate address in the source address field.\n[edit interfaces]\n<internal interface name> {\n\
