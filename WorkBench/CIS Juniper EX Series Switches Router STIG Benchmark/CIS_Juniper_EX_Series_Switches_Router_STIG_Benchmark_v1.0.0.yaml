- id: '1.55'
  title: JUEX-RT-000550
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to use keys with a duration not exceeding 180 days for authenticating
    routing protocol messages. GROUP ID: V-254027 RULE ID: SV-254027r945863'
  rationale: If the keys used for routing protocol authentication are guessed, the malicious user could create havoc within
    the network by advertising incorrect routes and redirecting traffic. Some routing protocols allow the use of key chains
    for authentication. A key chain is a set of keys that is used in succession, with each having a lifetime of no more than
    180 days. Changing the keys frequently reduces the risk of them eventually being guessed. Keys cannot be used during time
    periods for which they are not activated. If a time period occurs during which no key is activated, neighbor authentication
    cannot occur, and therefore routing updates will fail. Therefore, ensure that for a given key chain, key activation times
    overlap to avoid any period of time during which no key is activated.
  impact: ''
  references: []
  page_start: 199
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nFor each authenticated routing protocol session,\
    \ review the configured key expiration\ndates.\n[edit security]\nauthentication-key-chains {\n key-chain <name> {\n key\
    \ 1 {\n secret \"$9$vNbM7Vg4ZjkPJGn/AtOB7-d\"; ## SECRET-DATA\n start-time \"2021-1-1.00:00:00 -0700\";\n algorithm md5;\n\
    \ }\n key 2 {\n secret \"$9$MAQL7VgoGqmTwYmTz3tpWLxNwY4aZjk.\"; ## SECRET-DATA\n start-time \"2021-5-31.00:00:00 -0700\"\
    ;\n algorithm md5;\n }\n }\n}\n[edit protocols]\nbgp {\n group eBGP {\n authentication-key-chain <name>;\n neighbor 1.2.3.4\
    \ {\n authentication-key-chain <name>;\n }\n }\n authentication-key-chain <name>;\n}\nNote: BGP supports authentication\
    \ globally, at the group level, and individually for each\nneighbor. The most specific authentication configuration is\
    \ applied.\nospf {\n area 0.0.0.2 {\n interface ge-0/0/0.0 {\n authentication {\n md5 0 key \"$9$vG08xd24Zk.5bs.5QFAtM8X7bsgoJDHq\"\
