    l2circuit {\n neighbor 1.1.1.1 {\n interface <interface name>.<logical unit> {\n virtual-circuit-id <1..4294967295>;\n\
    \ }\n }\n}\nIf the correct VC ID has not been configured on both routers, this is a finding.\nNote: Ethernet over MPLS\
    \ in VLAN mode transports Ethernet traffic from a source\n802.1Q VLAN to a destination 802.1Q VLAN over a core MPLS network.\
    \ The VC ID\nmust be unique and the same on each end as it is used to connect the endpoints of the\nVC."
  remediation: 'Assign globally unique VC IDs for each virtual circuit and configure the attachment

    circuits with the appropriate VC ID.

    Configure the same VC ID on both ends of the VC.

    set interfaces <interface name> unit <number> encapsulation vlan-ccc

    set protocols l2circuit neighbor <neighbor> interface <interface>.<logical

    unit> virtual-circuit-id <1..4294967295>'
