- id: '1.81'
  title: JUEX-RT-000810
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper perimeter router must be configured to drop fragmented IPv6 packets where the first fragment does
    not include the entire IPv6 header chain. GROUP ID: V-254053 RULE ID: SV-254053r950991'
  rationale: 'One of the fragmentation weaknesses known in IPv6 is the "undetermined transport" packet, which is the first
    fragment where the entire IPv6 header chain is not included. Fragmenting IPv6 datagrams and not including the upper-layer
    header makes it difficult to identify the traffic. RFC7112 and RFC8200 require the entire IPv6 header chain be present
    in the first fragment and defines the header chain as: "The IPv6 Header Chain contains an initial IPv6 header, zero or
    more IPv6 Extension Headers, and optionally, a single upper-layer header. If an upperlayer header is present, it terminates
    the header chain; otherwise, the "No Next Header" value (Next Header = 59) terminates it." Both RFCs consider a second
    IPv6 header and an ESP header as "upper-layer headers" when determining where the IPv6 header chain terminates.'
  impact: ''
  references: []
  page_start: 281
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nThere is no check for dropping RFC 7112 nonconformant\
    \ fragmented IPv6 packets\nbecause Juniper EX switches drop these packets without offering or requiring a\nconfigurable\
    \ option in the CLI.\nReview the router configuration to determine if it is configured to drop fragmented transit\nIPv6\
    \ traffic.\n[edit firewall family inet6]\nfilter <filter name> {\n term <name> {\n from {\n next-header fragment;\n }\n\
    \ then {\n syslog;\n discard;\n }\n }\n}\nNote: Some platforms also support \"is-fragment\" or \"fragment-flags is-fragment\"\
    \ in\naddition to \"next-header fragment\" as shown in the example.\nIf the router is not configured to drop first-fragment\
    \ IPv6 packets without the entire\nheader chain, this is a finding."
  remediation: 'Configure the router to drop first-fragment IPv6 packets without the entire header chain.

    There is no configurable CLI option to prevent EX devices from dropping nonconformant

    fragmented IPv6 packets destined to the device.

    Configure the router to drop fragmented transit IPv6 packets.

    set firewall family inet6 filter <name> term <name> from next-header fragment

    set firewall family inet6 filter <name> term <name> then syslog

    set firewall family inet6 filter <name> term <name> then discard'
  checks:
  - type: manual_review
    info: "This requirement is not applicable for the DODIN Backbone.\nThere is no check for dropping RFC 7112 nonconformant\
      \ fragmented IPv6 packets\nbecause Juniper EX switches drop these packets without offering or requiring a\nconfigurable\
      \ option in the CLI.\nReview the router configuration to determine if it is configured to drop fragmented transit\n\
      IPv6 traffic.\n[edit firewall family inet6]\nfilter <filter name> {\n term <name> {\n from {\n next-header fragment;\n\
      \ }\n then {\n syslog;\n discard;\n }\n }\n}\nNote: Some"
    severity: medium
- id: '1.82'
  title: JUEX-RT-000830
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper perimeter router must be configured to drop IPv6 packets containing a Hopby-Hop header with invalid
    option type values. GROUP ID: V-254055 RULE ID: SV-254055r844198'
  rationale: These options are intended to be for the Destination Options header only. The optional and extensible natures
    of the IPv6 extension headers require higher scrutiny since many implementations do not always drop packets with headers
    that it cannot recognize and hence could cause a denial-of-service on the target device. In addition, the type, length,
    value (TLV) formatting provides the ability for headers to be very large.
  impact: ''
  references: []
  page_start: 283
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to determine if\
    \ filters are bound to the applicable\ninterfaces to drop IPv6 packets containing a Hop-by-Hop header with option type\
    \ values\nof 0x04 (Tunnel Encapsulation Limit), 0xC9 (Home Address Destination), or 0xC3\n(NSAP Address).\n[edit firewall\
    \ family inet6]\nfilter <name> {\n term 1 {\n from {\n next-header [ hop-by-hop dstopts ];\n }\n then {\n log;\n syslog;\n\
    \ discard;\n }\n }\n <additional terms>\n term default {\n then {\n log;\n syslog;\n discard;\n }\n }\n}\nNote: Juniper\
    \ routers do not support configuring option types for Hop-by-Hop or\nDestination Options extension headers. Therefore,\
    \ all packets with the Hop-by-Hop or\nDestination Options extension header are dropped.\nVerify the filter is applied\
    \ to applicable interfaces.\n[edit interfaces]\n<interface name> {\n unit <number> {\n family inet6 {\n filter {\n input\
    \ <filter name>;\n }\n address <IPv6 address>.<prefix>;\n }\n }\n}\nNote: Some Juniper devices support both monolithic\
    \ filters and filter lists. Filter lists\nseparate each term, or set of terms, into a separate filter that is applied\
    \ sequentially to\nan interface. If using filter lists, the keywords \"input\" or \"output\" change to \"input-list\"\
    \ or\n\"output-list\". Verify the final list item is a deny-all filter. The deny-all filter is created once\nper family\
