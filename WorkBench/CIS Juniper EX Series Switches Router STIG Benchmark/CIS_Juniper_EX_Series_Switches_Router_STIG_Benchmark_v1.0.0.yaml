- id: '1.36'
  title: JUEX-RT-000360
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper PE router must be configured to enforce a Quality-of-Service (QoS) policy in accordance with the
    QoS GIG Technical Profile. GROUP ID: V-254008 RULE ID: SV-254008r997523'
  rationale: Different applications have unique requirements and toleration levels for delay, jitter, bandwidth, packet loss,
    and availability. To manage the multitude of applications and services, a network requires a QoS framework to differentiate
    traffic and provide a method to manage network congestion. The Differentiated Services Model (DiffServ) is based on per-hop
    behavior by categorizing traffic into different classes and enabling each node to enforce a forwarding treatment to each
    packet as dictated by a policy. Packet markings such as IP Precedence and its successor, Differentiated Services Code
    Points (DSCP), were defined along with specific per-hop behaviors for key traffic types to enable a scalable QoS solution.
    DiffServ QoS categorizes network traffic, prioritizes it according to its relative importance, and provides priority treatment
    based on the classification. It is imperative that end-to-end QoS is implemented within the IP core network to provide
    preferred treatment for mission-critical applications.
  impact: ''
  references: []
  page_start: 124
  audit_raw: "Review the router configuration and verify that a QoS policy has been configured to\nprovide preferred treatment\
    \ for mission-critical applications in accordance with the QoS\nGIG Technical Profile.\nVerify that the classifiers are\
    \ configured to match on DSCP.\nNote: Juniper routers also support classifying on MPLS EXP and IEEE 802.1 values.\nVerify\
    \ that the schedulers are configured to set DSCP values for the defined classifiers\nin accordance with the QoS GIG Technical\
    \ Profile.\nVerify that classifiers are applied all interfaces.\nNote: The GTP QOS document (GTP-0009) can be downloaded\
    \ via the following link:\nhttps://intellipedia.intelink.gov/wiki/Portal:GIG_Technical_Guidance/GTG_GTPs/GTP_D\nevelopment_List\n\
    To classify on L4 ports or protocols, use stateless firewall filters to direct matched traffic\ninto the required forwarding\
    \ class.\n[edit class-of-service]\nclassifiers {\n dscp <classifier name> {\n forwarding-class NC {\n loss-priority low\
    \ code-points 110000;\n }\n forwarding-class EF {\n loss-priority high code-points [ 101101 101111 100101 100111\n110011\
    \ ];\n loss-priority low code-points [ 101000 100000 101001 101011\n100001 100011 110001 ];\n }\n forwarding-class AF41\
    \ {\n loss-priority high code-points [ 100010 100100 100110 ];\n loss-priority low code-points [ 011000 101110 011100\
    \ 011110 ];\n }\n forwarding-class AF31 {\n loss-priority high code-points [ 011101 011111 011010 010101\n010111 010010\
    \ 001101 001010 010000 ];\n loss-priority low code-points [ 001001 001011 010001 010011\n011001 011011 ];\n }\n forwarding-class\
    \ BE {\n loss-priority high code-points 000000;\n }\n forwarding-class Default {\n loss-priority high code-points 001000;\n\
    \ }\n forwarding-class dscp15 {\n loss-priority high code-points 001111;\n }\n }\n}\nNote: Some platforms apply DSCP values\
    \ to both IPv4 and IPv6 traffic with a single\nclassifier definition (as shown). Those platforms that support separating\
    \ classifiers will\nrequire a \"dscp-ipv6\" stanza.\nhost-outbound-traffic {\n forwarding-class NC;\n dscp-code-point\
    \ 110000;\n}\nshared-buffer {\n ingress {\n percent 50;\n buffer-partition lossless {\n percent 5;\n }\n buffer-partition\
    \ lossless-headroom {\n percent 0;\n }\n buffer-partition lossy {\n percent 95;\n }\n }\n egress {\n percent 100;\n buffer-partition\
    \ lossless {\n percent 50;\n }\n buffer-partition lossy {\n percent 45;\n }\n buffer-partition multicast {\n percent 5;\n\
    \ }\n }\n}\nNote: Some platforms only support shared-buffer percent, and cannot separate between\ningress and egress.\
    \ Not all devices require a shared-buffer stanza.\nforwarding-classes {\n class NC queue-num 7;\n class EF queue-num 6;\n\
    \ class AF41 queue-num 5;\n class AF31 queue-num 4;\n class BE queue-num 0;\n class Default queue-num 1;\n class dscp15\
    \ queue-num 6;\n}\ntraffic-control-profiles {\n <control profile name 1> {\n scheduler-map <scheduler map name 1>;\n shaping-rate\
    \ percent 100;\n }\n <control profile name 2> {\n scheduler-map <scheduler map name 2>;\n guaranteed-rate percent 20;\n\
    \ }\n}\nforwarding-class-sets {\n <set name 1> {\n class NC;\n class EF;\n class AF41;\n class AF31;\n class Default;\n\
    \ class dscp15;\n }\n <set name 2> {\n class BE;\n }\n}\ninterfaces {\n <interface name> {\n forwarding-class-set {\n\
    \ <set name 1> {\n output-traffic-control-profile <control profile name 1>;\n }\n <set name 2> {\n output-traffic-control-profile\
    \ <control profile name 2>;\n }\n }\n classifiers {\n dscp <classifier name>;\n }\n rewrite-rules {\n dscp <rewrite rule\
    \ name>;\n }\n }\n}\nrewrite-rules {\n dscp <rewrite rule name> {\n forwarding-class dscp15 {\n loss-priority high code-point\
    \ 101101;\n }\n forwarding-class EF {\n loss-priority low code-point 110001;\n }\n forwarding-class AF41 {\n loss-priority\
    \ high code-point 100110;\n }\n forwarding-class NC {\n loss-priority low code-point 110000;\n }\n forwarding-class AF31\
    \ {\n loss-priority high code-point 010000;\n }\n forwarding-class Default {\n loss-priority high code-point 001000;\n\
    \ }\n }\n}\nNote: Some platforms require rewriting all DSCP values if rewriting one (smaller\nplatforms). Most support\
    \ only rewriting a single DSCP value, which would eliminate all\nbut one rewrite rule.\nscheduler-maps {\n <scheduler\
    \ map name 1> {\n forwarding-class NC scheduler NC;\n forwarding-class EF scheduler EF;\n forwarding-class AF41 scheduler\
    \ AF41;\n forwarding-class AF31 scheduler AF31;\n forwarding-class Default scheduler Default;\n }\n <scheduler map name\
    \ 2> {\n forwarding-class BE scheduler BE;\n }\n}\nschedulers {\n NC {\n buffer-size percent 5;\n priority strict-high;\n\
    \ }\n EF {\n shaping-rate percent 20;\n buffer-size percent 19;\n priority strict-high;\n }\n AF41 {\n shaping-rate percent\
    \ 15;\n buffer-size percent 14;\n priority strict-high;\n }\n AF31 {\n shaping-rate percent 31;\n buffer-size percent\
    \ 29;\n priority strict-high;\n }\n BE {\n transmit-rate percent 20;\n buffer-size percent 20;\n priority low;\n }\n Default\
    \ {\n shaping-rate percent 10;\n buffer-size percent 9;\n priority strict-high;\n }\n}\nIf the router is not configured\
    \ to implement a QoS policy in accordance with the QoS\nGIG Technical Profile, this is a finding."
