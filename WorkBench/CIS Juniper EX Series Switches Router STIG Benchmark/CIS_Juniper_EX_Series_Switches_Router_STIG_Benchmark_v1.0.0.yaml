- id: '1.19'
  title: JUEX-RT-000190
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper perimeter router must not be configured to redistribute static routes to an alternate gateway
    service provider into BGP or an IGP peering with the NIPRNet or to other autonomous systems. GROUP ID: V-253991 RULE ID:
    SV-253991r844006'
  rationale: If the static routes to the alternate gateway are being redistributed into an Exterior Gateway Protocol or Interior
    Gateway Protocol to a NIPRNet gateway, this could make traffic on NIPRNet flow to that particular router and not to the
    Internet Access Point routers. This could not only wreak havoc with traffic flows on NIPRNet, but it could overwhelm the
    connection from the router to the NIPRNet gateway(s) and also cause traffic destined for outside of NIPRNet to bypass
    the defenses of the Internet Access Points.
  impact: ''
  references: []
  page_start: 63
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the configuration of the router connecting\
    \ to the alternate gateway and verify\nthat redistribution of static routes to the alternate gateway is not occurring.\
    \ Juniper\nrouters use export policies to limit redistribution of routes. Verify a policy exists to filter\nroute redistribution.\n\
    [edit policy-options]\npolicy-statement <name> {\n term 1 {\n from protocol static;\n then reject;\n }\n}\nVerify the\
    \ export policy is applied to the EGP and/or IGP protocol.\n[edit protocols]\nbgp {\n export <policy-name>;\n group <group\
    \ name> {\n type external;\n export <policy-name>;\n neighbor <address> {\n export <policy-name>;\n }\n }\n ospf {\n export\
    \ <policy name>;\n }\n ospf3 {\n export <policy name>;\n }\n}\nNote: BGP supports export statements at the protocol level\
    \ (global), the group level,\nand the neighbor level. Only the most specific policy is applied.\nIf the static routes\
    \ to the alternate gateway are being redistributed into BGP or any IGP\npeering with a NIPRNet gateway or another autonomous\
    \ system, this is a finding."
  remediation: 'This requirement is not applicable for the DODIN Backbone.

    Configure the router so that static routes are not redistributed to an alternate gateway

    into either an Exterior Gateway Protocol or Interior Gateway Protocol to the NIPRNet or

    to other autonomous systems.

    set policy-options policy-statement <policy name> term 1 from protocol static

    set policy-options policy-statement <policy name> term 1 then reject

    set protocols bgp group <group name> export <policy name>

    set protocols bgp group <group name> neighbor <address> export <policy name>

    set protocols bgp export <policy name>

    set protocols ospf export <policy name>

    set protocols ospf3 export <policy name>'
  checks:
  - type: manual_review
    info: "This requirement is not applicable for the DODIN Backbone.\nReview the configuration of the router connecting to\
      \ the alternate gateway and verify\nthat redistribution of static routes to the alternate gateway is not occurring.\
      \ Juniper\nrouters use export policies to limit redistribution of routes. Verify a policy exists to filter\nroute redistribution.\n\
      [edit policy-options]\npolicy-statement <name> {\n term 1 {\n from protocol static;\n then reject;\n }\n}\nVerify the\
      \ export policy is applied to the EGP an"
    severity: medium
