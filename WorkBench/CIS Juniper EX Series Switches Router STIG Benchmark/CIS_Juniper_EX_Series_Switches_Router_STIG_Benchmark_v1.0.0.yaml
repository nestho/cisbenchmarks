      \ address <IPv6 address>/<prefix>;\n }\n }\n}\nFor thos"
    severity: medium
- id: '1.51'
  title: JUEX-RT-000510
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper perimeter router must be configured to block all packets with any IP options. GROUP ID: V-254023
    RULE ID: SV-254023r997531'
  rationale: Packets with IP options are not fast switched and must be punted to the route engine (RE). Hackers who initiate
    denial-of-service (DoS) attacks on routers commonly send large streams of packets with IP options. Dropping the packets
    with IP options reduces the load of IP options packets on the router. The end result is a reduction in the effects of
    the DoS attack on the router and on downstream routers.
  impact: ''
  references: []
  page_start: 187
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to determine if\
    \ it will block all packets with IP options.\n[edit firewall family inet]\nfilter <name> {\n term 1 {\n from {\n ip-options\
    \ any;\n }\n then {\n log;\n syslog;\n discard;\n }\n }\n <additional accept terms>\n term default {\n then {\n log;\n\
    \ syslog;\n discard;\n }\n }\n}\n[edit interfaces]\n<interface name> {\n unit <number> {\n family inet {\n filter input\
