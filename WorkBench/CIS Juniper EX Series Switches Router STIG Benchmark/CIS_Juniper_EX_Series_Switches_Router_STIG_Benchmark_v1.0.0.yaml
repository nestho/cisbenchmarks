- id: '1.7'
  title: JUEX-RT-000070
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper router configured for Multicast Source Discovery Protocol (MSDP) must filter received source-active
    multicast advertisements for any undesirable multicast groups and sources. GROUP ID: V-253979 RULE ID: SV-253979r843970'
  rationale: The interoperability of BGP extensions for interdomain multicast routing and MSDP enables seamless connectivity
    of multicast domains between autonomous systems. MP-BGP advertises the unicast prefixes of the multicast sources used
    by Protocol Independent Multicast (PIM) routers to perform RPF checks and build multicast distribution trees. MSDP is
    a mechanism used to connect multiple PIM sparse-mode domains, allowing RPs from different domains to share information
    about active sources. When RPs in peering multicast domains hear about active sources, they can pass on that information
    to their local receivers, thereby allowing multicast data to be forwarded between the domains. Configuring an import policy
    to block multicast advertisements for reserved, martian, single-source multicast, and any other undesirable multicast
    groups, as well as any source-group (S, G) states with Bogon source addresses, would assist in avoiding unwanted multicast
    traffic from traversing the core.
  impact: ''
  references: []
  page_start: 33
  audit_raw: "Review the router configuration to determine if there is an import policy to block sourceactive multicast advertisements\
    \ for any undesirable multicast groups, as well as any (S,\nG) states with undesirable source addresses.\nVerify that\
    \ an inbound source-active filter is bound to each MSDP peer.\n[edit protocols msdp]\npeer <address> {\n import source-active-filter;\n\
    }\nReview the policy-statement referenced by the source-active filter to verify that\nundesirable multicast groups, auto-RP,\
    \ single source multicast (SSM) groups, and\nadvertisements from undesirable sources are blocked.\n[edit policy-options]\n\
    policy-statement source-active-filter {\n term unauth-groups {\n from {\n route-filter 224.0.1.2/32 exact;\n route-filter\
    \ 224.0.2.2/32 exact;\n }\n then reject;\n }\n term unauth-sources {\n from {\n source-address-filter 10.0.0.0/8 orlonger;\n\
    \ source-address-filter 127.0.0.0/8 orlonger;\n }\n then reject;\n }\n}\nIf the router is not configured with an import\
    \ policy to block undesirable SA multicast\nadvertisements, this is a finding."
  remediation: 'Configure the MSDP router to implement an import policy to block multicast

    advertisements for undesirable multicast groups and sources.

    set protocols msdp peer <address> import source-active-filter

    set policy-options policy-statement source-active-filter term unauth-groups

    from route-filter 224.0.1.2/32 exact

    set policy-options policy-statement source-active-filter term unauth-groups

    from route-filter 224.0.2.2/32 exact

    set policy-options policy-statement source-active-filter term unauth-groups

    then reject

    set policy-options policy-statement source-active-filter term unauth-sources

    from source-address-filter 10.0.0.0/8 orlonger

    set policy-options policy-statement source-active-filter term unauth-sources

    from source-address-filter 127.0.0.0/8 orlonger

    set policy-options policy-statement source-active-filter term unauth-sources

    then reject'
  checks:
  - type: manual_review
    info: "Review the router configuration to determine if there is an import policy to block sourceactive multicast advertisements\
      \ for any undesirable multicast groups, as well as any (S,\nG) states with undesirable source addresses.\nVerify that\
      \ an inbound source-active filter is bound to each MSDP peer.\n[edit protocols msdp]\npeer <address> {\n import source-active-filter;\n\
      }\nReview the policy-statement referenced by the source-active filter to verify that\nundesirable multicast groups,\
      \ auto-RP, single source"
    severity: medium
- id: '1.8'
  title: JUEX-RT-000080
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper router configured for Multicast Source Discovery Protocol (MSDP) must filter source-active multicast
    advertisements to external MSDP peers to avoid global visibility of local-only multicast sources and groups. GROUP ID:
    V-253980 RULE ID: SV-253980r843973'
  rationale: To avoid global visibility of local information, there are a number of source-group (S, G) states in a PIM-SM
    domain that must not be leaked to another domain, such as multicast sources with private address, administratively scoped
    multicast addresses, and the auto-RP groups (224.0.1.39 and 224.0.1.40). Allowing a multicast distribution tree, local
    to the core, to extend beyond its boundary could enable local multicast traffic to leak into other autonomous systems
    and customer networks.
  impact: ''
  references: []
  page_start: 35
  audit_raw: "Review the router configuration to determine if there is export policy to block local\nsource-active multicast\
    \ advertisements.\nVerify that an outbound source-active filter is bound to each MSDP peer.\n[edit protocols msdp]\npeer\
    \ <address> {\n export source-active-filter;\n}\nReview the policy-statement referenced by the source-active filters and\
    \ verify that\nMSDP source-active messages being sent to MSDP peers do not leak advertisements\nthat are local.\n[edit\
    \ policy-options]\npolicy-statement source-active-filter {\n term unauth-groups {\n from {\n route-filter 224.0.1.2/32\
    \ exact;\n route-filter 224.0.2.2/32 exact;\n }\n then reject;\n }\n term unauth-sources {\n from {\n source-address-filter\
    \ 10.0.0.0/8 orlonger;\n source-address-filter 127.0.0.0/8 orlonger;\n }\n then reject;\n }\n}\nIf the router is not configured\
    \ with an export policy to block local source-active multicast\nadvertisements, this is a finding."
  remediation: 'Ensure an export policy is implemented on all MSDP routers to avoid global visibility of

    local multicast (S, G) states.

    set protocols msdp peer <address> export source-active-filter

    set policy-options policy-statement source-active-filter term unauth-groups

    from route-filter 224.0.1.2/32 exact

    set policy-options policy-statement source-active-filter term unauth-groups

    from route-filter 224.0.2.2/32 exact

    set policy-options policy-statement source-active-filter term unauth-groups

    then reject

    set policy-options policy-statement source-active-filter term unauth-sources

    from source-address-filter 10.0.0.0/8 orlonger

    set policy-options policy-statement source-active-filter term unauth-sources

    from source-address-filter 127.0.0.0/8 orlonger

    set policy-options policy-statement source-active-filter term unauth-sources

    then reject'
  checks:
  - type: manual_review
    info: "Review the router configuration to determine if there is export policy to block local\nsource-active multicast\
      \ advertisements.\nVerify that an outbound source-active filter is bound to each MSDP peer.\n[edit protocols msdp]\n\
      peer <address> {\n export source-active-filter;\n}\nReview the policy-statement referenced by the source-active filters\
      \ and verify that\nMSDP source-active messages being sent to MSDP peers do not leak advertisements\nthat are local.\n\
      [edit policy-options]\npolicy-statement source-acti"
    severity: medium
- id: '1.9'
  title: JUEX-RT-000090
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper router configured for MSDP must limit the amount of source-active messages it accepts on per-peer
    basis. GROUP ID: V-253981 RULE ID: SV-253981r843976'
  rationale: To reduce any risk of a denial-of-service (DoS) attack from a rogue or misconfigured MSDP router, the router
    must be configured to limit the number of source-active messages it accepts from each peer.
  impact: ''
  references: []
  page_start: 37
  audit_raw: "Review the router configuration to determine if it is configured to limit the amount of\nsource-active messages\
    \ it accepts on a per-peer basis.\n[edit protocols]\nmsdp {\n active-source-limit {\n maximum <1..1000000>;\n threshold\
    \ <1..1000000>;\n log-warning <percent to log warning>;\n }\n local-address <lo0 address>;\n <additional configuration>\n\
    \ peer <address> {\n active-source-limit {\n maximum <1..1000000>;\n threshold <1..1000000>;\n log-warning <percent to\
    \ log warning>;\n }\n authentication-key \"hashed PSK\"; ## SECRET-DATA\n }\n}\nNote: Both the global, and the peer limit,\
    \ are applied to every MSDP peer, and Junos\napplies the most restrictive limit. The maximum value sets the upper limit\
    \ for sourceactive messages and the threshold value determines when Junos begins Random Early\nDetection (RED) dropping\
    \ to alleviate congestion. The log-warning value is a percent\nwhere Junos begins generating syslog messages.\nIf the\
    \ router is not configured to limit the source-active messages it accepts, this is a\nfinding."
  remediation: 'Configure the MSDP router to limit the amount of source-active messages it accepts

    from each peer.

    set protocols msdp active-source-limit maximum <1..1000000>

    set protocols msdp active-source-limit threshold <1..1000000>

    set protocols msdp active-source-limit log-warning <percent to log warning>

    <additional configuration>

    set protocols msdp peer <address> active-source-limit maximum <1..1000000>

    set protocols msdp peer <address> active-source-limit threshold <1..1000000>

    set protocols msdp peer <address> active-source-limit log-warning <percent to

    log warning>'
  checks:
  - type: manual_review
    info: "Review the router configuration to determine if it is configured to limit the amount of\nsource-active messages\
      \ it accepts on a per-peer basis.\n[edit protocols]\nmsdp {\n active-source-limit {\n maximum <1..1000000>;\n threshold\
      \ <1..1000000>;\n log-warning <percent to log warning>;\n }\n local-address <lo0 address>;\n <additional configuration>\n\
      \ peer <address> {\n active-source-limit {\n maximum <1..1000000>;\n threshold <1..1000000>;\n log-warning <percent\
      \ to log warning>;\n }\n authentication-key \"hashed PSK"
    severity: medium
- id: '1.10'
  title: JUEX-RT-000100
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper router configured for BGP must reject route advertisements from CE routers with an originating
    AS in the AS_PATH attribute that does not belong to that customer. GROUP ID: V-253982 RULE ID: SV-253982r945855'
  rationale: Verifying the path a route has traversed will ensure that the local AS is not used as a transit network for unauthorized
    traffic. To ensure that the local AS does not carry any prefixes that do not belong to any customers, all PE routers must
    be configured to reject routes with an originating AS other than that belonging to the customer.
  impact: ''
  references: []
  page_start: 39
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to verify the router\
    \ is configured to deny updates\nreceived from CE routers with an originating AS in the AS_PATH attribute that does not\n\
    belong to that customer.\nReview the router configuration and verify that there is an as-path access-list statement\n\
    defined.\nEach peer requires a regular expression (REGEX) defining the expected AS_PATH\nattribute. Each neighbor has\
    \ an import policy applied to filter updates that do not match\nthe expected path attribute. Assuming AS 65535 is an authorized\
    \ neighbor's originating\nAS, verify an as-path REGEX is defined ('.* 65535') and a policy-statement configured\nto accept\
    \ that REGEX.\n[edit policy-options]\npolicy-statement bgp_originate_65535 {\n term 1 {\n from as-path orig_65535;\n then\
    \ accept;\n }\n term 2 {\n then reject;\n }\n}\nas-path orig_65535 \".* 65535\";\nNote: The REGEX matches zero or more\
    \ prepended AS in the AS_PATH beginning\nwith the defined AS number (the originator is the right-most AS in the path).\
    \ The\nAS_PATH attribute is a space-delimited list, so a space between the leading AS\nnumbers (.*) and the originating\
    \ AS (65535) is required.\nVerify that the as-path access list is referenced by the filter-list inbound for the\nappropriate\
    \ BGP neighbors.\n[edit protocols bgp]\ngroup eBGP {\n neighbor <address> {\n import bgp_originate_65535;\n }\n}\nIf the\
    \ router is not configured to reject updates from CE routers with an originating AS in\nthe AS_PATH attribute that does\
    \ not belong to that customer, this is a finding."
  remediation: 'Configure the router to reject updates from CE routers with an originating AS in the

    AS_PATH attribute that does not belong to that customer.

    set policy-options policy-statement bgp_originate_65535 term 1 from as-path

    orig_65535

    set policy-options policy-statement bgp_originate_65535 term 1 then accept

    set policy-options policy-statement bgp_originate_65535 term 2 then reject

    set policy-options as-path orig_65535 ".* 65535"

    set protocols bgp group eBGP neighbor <address> import bgp_originate_65535'
  checks:
  - type: manual_review
    info: 'This requirement is not applicable for the DODIN Backbone.

      Review the router configuration to verify the router is configured to deny updates

      received from CE routers with an originating AS in the AS_PATH attribute that does not

      belong to that customer.

      Review the router configuration and verify that there is an as-path access-list statement

      defined.

      Each peer requires a regular expression (REGEX) defining the expected AS_PATH

      attribute. Each neighbor has an import policy applied to filter updat'
    severity: medium
- id: '1.11'
  title: JUEX-RT-000110
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper router must be configured to disable the auxiliary port unless it is connected to a secured modem
    providing encryption and authentication. GROUP ID: V-253983 RULE ID: SV-253983r843982'
  rationale: The use of POTS lines to modems connecting to network devices provides clear text of authentication traffic over
    commercial circuits that could be captured and used to compromise the network. Additional war dial attacks on the device
    could degrade the device and the production network. Secured modem devices must be able to authenticate users and must
    negotiate a key exchange before full encryption takes place. The modem will provide full encryption capability (Triple
    DES) or stronger. The technician who manages these devices will be authenticated using an authorized MFA token and granted
    access to the appropriate maintenance port; thus, the technician will gain access to the managed device (router, switch,
    etc.). The token provides a method of strong (two-factor) user authentication. The token works in conjunction with a server
    to generate one-time user passwords. The user must know a personal identification number (PIN) and possess the token to
    be allowed access to the device.
  impact: ''
  references: []
  page_start: 41
  audit_raw: "Review the configuration and verify that the auxiliary port is disabled unless a secured\nmodem providing encryption\
    \ and authentication is connected to it.\nThe Junos auxiliary port is disabled by default. Verify the auxiliary port is\
    \ not configured\n(there will be no [edit system ports auxiliary] stanza) or that the auxiliary port is explicitly\ndisabled.\n\
    [edit system ports]\nauxiliary {\n disable;\n}\nIf the auxiliary port is not disabled or is not connected to a secured\
    \ modem when it is\nenabled, this is a finding."
  remediation: 'Disable the auxiliary port.

    set system ports auxiliary disable

    -ordelete system ports auxiliary

    If used for out-of-band administrative access, the port must be connected to a secured

    modem providing encryption and authentication.'
  checks:
  - type: manual_review
    info: "Review the configuration and verify that the auxiliary port is disabled unless a secured\nmodem providing encryption\
      \ and authentication is connected to it.\nThe Junos auxiliary port is disabled by default. Verify the auxiliary port\
