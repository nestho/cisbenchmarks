- id: '1.75'
  title: JUEX-RT-000750
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper perimeter router must be configured to have Link Layer Discovery Protocols (LLDPs) disabled on
    all external interfaces. GROUP ID: V-254047 RULE ID: SV-254047r844174'
  rationale: LLDPs are primarily used to obtain protocol addresses of neighboring devices and discover platform capabilities
    of those devices. Use of SNMP with the LLDP Management Information Base (MIB) allows network management applications to
    learn the device type and the SNMP agent address of neighboring devices, thereby enabling the application to send SNMP
    queries to those devices. LLDPs are also media- and protocol-independent as they run over the data link layer; therefore,
    two systems that support different network-layer protocols can still learn about each other. Allowing LLDP messages to
    reach external network nodes is dangerous as it provides an attacker a method to obtain information of the network infrastructure
    that can be useful to plan an attack.
  impact: ''
  references: []
  page_start: 259
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview all router configurations to ensure LLDPs\
    \ are not included in the global\nconfiguration or LLDPs are not included for each active external interface. Examples\
    \ of\nLLDPs are Cisco Discovery Protocol (CDP), Link Layer Discovery Protocol (LLDP), and\nLink Layer Discovery Protocol\
    \ - Media Endpoint Discovery (LLDP-MED). Junos does\nnot support CDP, but supports both LLDP and LLDP-MED, configured\
    \ at [edit\nprotocols]. Verify external interfaces are either not configured or explicitly disabled. For\nexample:\nTo\
    \ globally disable LLDP and LLDP-MED:\n[edit protocols]\n<no LLDP or LLDP-MED hierarchy>\n-or-\nlldp {\n interface all\
    \ {\n disable;\n }\n}\nlldp-med {\n interface all {\n disable;\n }\n}\nIf LLDP or LLDP-MED is authorized, verify external\
    \ interfaces are not configured or are\nexplicitly disabled. For example:\n[edit protocols]\nlldp {\n interface all {\n\
    \ disable;\n }\n interface ge-0/0/0; <<< Verify ge-0/0/0 is not an external interface.\n interface ge-0/0/1 {\n disable;\
    \ <<< Assuming ge-0/0/1 is an external interface, it is\ndisabled globally (interface all disable) or explicitly disabled\
    \ as shown.\n }\n}\nlldp-med {\n interface all {\n disable;\n interface ge-0/0/0; <<< Verify ge-0/0/0 is not an external\
    \ interface.\n interface ge-0/0/1 {\n disable; <<< Assuming ge-0/0/1 is an external interface, it is\ndisabled globally\
    \ (interface all disable) or explicitly disabled as shown.\n }\n}\nNote: Both LLDP and LLDP-MED are globally disabled\
    \ on all interfaces but Junos will\napply the most specific configuration. Therefore, both LLDP and LLDP-MED are\nenabled\
    \ only on ge-0/0/0 and disabled on all other interfaces as configured in the\nexample.\nIf LLDPs are configured globally\
    \ or on any external interface, this is a finding."
  remediation: 'This requirement is not applicable for the DODIN Backbone.

    Disable LLDPs on all external interfaces.

    set protocols lldp interface all disable

    set protocols lldp interface <interior interface>

    set protocols lldp interface <exterior interface> disable

    set protocols lldp-med interface all disable

    set protocols lldp-med interface <interior interface>

    set protocols lldp-med interface <exterior interface> disable

    Note: The disable command is not required if LLDP and LLDP-MED are globally

    disabled. However, the configured protocol status may be more apparent if each

    exterior interface is explicitly disabled.'
  checks:
  - type: manual_review
    info: 'This requirement is not applicable for the DODIN Backbone.

      Review all router configurations to ensure LLDPs are not included in the global

      configuration or LLDPs are not included for each active external interface. Examples of

      LLDPs are Cisco Discovery Protocol (CDP), Link Layer Discovery Protocol (LLDP), and

      Link Layer Discovery Protocol - Media Endpoint Discovery (LLDP-MED). Junos does

      not support CDP, but supports both LLDP and LLDP-MED, configured at [edit

      protocols]. Verify external interfa'
    severity: medium
- id: '1.76'
  title: JUEX-RT-000760
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper perimeter router must be configured to have Proxy ARP disabled on all external interfaces. GROUP
    ID: V-254048 RULE ID: SV-254048r844177'
  rationale: When Proxy ARP is enabled on a router, it allows that router to extend the network (at layer 2) across multiple
    interfaces (LAN segments). Because proxy ARP allows hosts from different LAN segments to look like they are on the same
    segment, proxy ARP is only safe when used between trusted LAN segments. Attackers can leverage the trusting nature of
    proxy ARP by spoofing a trusted host and then intercepting packets. Proxy ARP should always be disabled on router interfaces
    that do not require it, unless the router is being used as a LAN bridge.
  impact: ''
  references: []
  page_start: 262
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to determine if\
    \ Proxy ARP is disabled on all external\ninterfaces. By default, Proxy ARP is disabled on all interfaces. Verify \"proxy-arp\"\
    \ has not\nbeen enabled on external interfaces as shown in the example:\n[edit interfaces]\n<external interface> {\n unit\
    \ 0 {\n proxy-arp [restricted|unrestricted]; << Must not be configured on\nexternal interfaces.\n <additional configuration>\n\
    \ }\n}\nIf Proxy ARP is enabled on any external interface, this is a finding."
  remediation: 'This requirement is not applicable for the DODIN Backbone.

    Disable IP Proxy ARP on all external interfaces.

    delete interfaces <external interface> unit 0 proxy-arp'
  checks:
  - type: manual_review
    info: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to determine if Proxy\
      \ ARP is disabled on all external\ninterfaces. By default, Proxy ARP is disabled on all interfaces. Verify \"proxy-arp\"\
      \ has not\nbeen enabled on external interfaces as shown in the example:\n[edit interfaces]\n<external interface> {\n\
      \ unit 0 {\n proxy-arp [restricted|unrestricted]; << Must not be configured on\nexternal interfaces.\n <additional configuration>\n\
      \ }\n}\nIf Proxy ARP is enabled on any"
    severity: medium
- id: '1.77'
  title: JUEX-RT-000770
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper perimeter router must be configured to block all outbound management traffic. GROUP ID: V-254049
    RULE ID: SV-254049r945857'
  rationale: For in-band management, the management network must have its own subnet to enforce control and access boundaries
    provided by layer 3 network nodes, such as routers and firewalls. Management traffic between the managed network elements
    and the management network is routed via the same links and nodes as that used for production or operational traffic.
    Safeguards must be implemented to ensure that the management traffic does not leak past the perimeter of the managed network.
  impact: ''
  references: []
  page_start: 264
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nThe perimeter router of the managed network must\
    \ be configured with a firewall filter on\nthe egress interface to block all management traffic.\n[edit firewall]\nfamily\
    \ inet {\n filter <name> {\n term block-UDP-MGT-SRC {\n from {\n protocol udp;\n source-port [ snmp snmptrap 2055 9995\
    \ 9996 ];\n }\n then {\n syslog;\n discard;\n }\n }\n term block-TCP-MGT-SRC {\n from {\n protocol tcp;\n source-port\
    \ [ ssh tacacs ];\n }\n then {\n syslog;\n discard;\n }\n }\n term block-UDP-MGT-DST {\n from {\n protocol udp;\n destination-port\
    \ [ snmp snmptrap 2055 9995 9996 ];\n }\n then {\n syslog;\n discard;\n }\n }\n term block-TCP-MGT-DST {\n from {\n protocol\
    \ tcp;\n destination-port [ ssh tacacs ];\n }\n then {\n syslog;\n discard;\n }\n }\n <additional terms>\n term accept-other\
    \ {\n then accept;\n }\n }\n}\nfamily inet6 {\n filter <name> {\n term block-UDP-MGT-SRC {\n from {\n next-header udp;\n\
    \ source-port [ snmp snmptrap 2055 9995 9996 ];\n }\n then {\n syslog;\n discard;\n }\n }\n term block-TCP-MGT-SRC {\n\
    \ from {\n next-header tcp;\n source-port [ ssh tacacs ];\n }\n then {\n syslog;\n discard;\n }\n }\n term block-UDP-MGT-DST\
    \ {\n from {\n next-header udp;\n destination-port [ snmp snmptrap 2055 9995 9996 ];\n }\n then {\n syslog;\n discard;\n\
    \ }\n }\n term block-TCP-MGT-DST {\n from {\n next-header tcp;\n destination-port [ ssh tacacs ];\n }\n then {\n syslog;\n\
    \ discard;\n }\n }\n <additional terms>\n term accept-other {\n then accept;\n }\n }\n}\nNote: Some platforms support\
    \ the \"port\" match criterion. For those platforms, only a\nsingle term is required to flag on both source- and destination-port.\
    \ For example:\n[edit firewall]\nfamily [inet|inet6] {\n filter <name> {\n term <name> {\n from {\n :\n port [ port1 port2...\
    \ ];\n }\n then {\n syslog;\n discard;\n }\n }\n <additional terms>\n }\n}\nVerify the filter is applied to external interfaces.\n\
    [edit interfaces]\n<external interface> {\n unit <number> {\n family inet {\n filter {\n output <name>;\n }\n address\
    \ <IPv4 address>/<mask>;\n }\n family inet6 {\n filter {\n output <name>;\n }\n address <IPv6 address>/<prefix>;\n }\n\
    \ }\n}\nNote: Some Juniper devices support both monolithic filters and filter lists. Filter lists\nseparate each term,\
    \ or set of terms, into a separate filter that is applied sequentially to\nan interface. If using filter lists, the keywords\
    \ \"input\" or \"output\" change to \"input-list\" or\n\"output-list\". Verify the final list item is a deny-all filter.\
    \ The deny-all filter is created once\nper family and can be reused across multiple lists. For example:\ninput-list [\
    \ permit_mgt permit_routing_protocols default-deny ];\nIf management traffic is not blocked at the perimeter, this is\
    \ a finding."
  remediation: 'This requirement is not applicable for the DODIN Backbone.

