- id: '1.24'
  title: JUEX-RT-000240
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to produce audit records containing information to establish where the
    events occurred. GROUP ID: V-253996 RULE ID: SV-253996r844021'
  rationale: Without establishing where events occurred, it is impossible to establish, correlate, and investigate the events
    leading up to an outage or attack. To compile an accurate risk assessment and provide forensic analysis, it is essential
    for security personnel to know where events occurred, such as router components, modules, device identifiers, node names,
    and functionality. Associating information about where the event occurred within the network provides a means of investigating
    an attack, recognizing resource utilization or capacity thresholds, or identifying an improperly configured router.
  impact: ''
  references: []
  page_start: 77
  audit_raw: "The router must log all packets that have been dropped via the stateless firewall filter.\nVerify all discarding\
    \ firewall filter terms are configured to send events to syslog.\nNote: Stateless firewall filters support \"log\" and\
    \ \"syslog\" actions. The \"log\" action\nmaintains a temporary list of events and the \"syslog\" action generates events\
    \ for local\nstorage and/or external syslog servers. Verify at least \"syslog\" is associated with all\ndiscarding terms.\n\
    For example:\n[edit firewall]\nfamily inet {\n filter <filter name> {\n term 1 {\n from {\n <match conditions>;\n }\n\
    \ then {\n log;\n syslog; <<< At a minimum, the 'syslog' action must be enabled\nfor all discarding terms.\n discard;\n\
    \ }\n }\n }\n}\nfamily inet6 {\n filter <filter name> {\n term 1 {\n from {\n <match conditions>;\n }\n then {\n log;\n\
    \ syslog; <<< At a minimum, the 'syslog' action must be enabled\nfor all discarding terms.\n discard;\n }\n }\n }\n}\n\
    If the router fails to log all packets that have been dropped via the firewall filter, this is a\nfinding.\nVerify logging\
    \ is enabled for local and/or external syslog. To meet this requirement,\neither the \"any\" or the \"firewall\" logging\
    \ facility must be enabled.\nNote: To reduce log sizes and to segregate entries, a separate log file for firewall entries\n\
    is permissible.\n[edit system syslog]\nhost <external syslog address> {\n any info;\n log-prefix <hostname>;\n explicit-priority;\n\
    }\nfile messages {\n any info;\n}\ntime-format year;\nLog output must contain an interface name identifying where the\
    \ packet was filtered.\nNote: Logged firewall events include the interface and cannot be configured otherwise.\nThere\
    \ is no provision for changing the log message or for removing the interface name.\nIf the logged output does not contain\
    \ an interface name identifying where the packet\nwas filtered, this is a finding."
  remediation: 'Configure the router to record the interface in the log record for packets being dropped.

    Example firewall filter with logging enabled:

    set firewall family inet filter <filter name> term 1 from <match conditions>

    set firewall family inet filter <filter name> term 1 then log

    set firewall family inet filter <filter name> term 1 then syslog <<< Must be

    enabled for all discarding terms

    set firewall family inet filter <filter name> term 1 then discard

    set firewall family inet6 filter <filter name> term 1 from <match conditions>

    set firewall family inet6 filter <filter name> term 1 then log

    set firewall family inet6 filter <filter name> term 1 then syslog <<< Must be

    enabled for all discarding terms

    set firewall family inet6 filter <filter name> term 1 then discard

    Example consolidated logging:

    set syslog host <external syslog address> any info

    set system syslog file messages any info'
  checks:
  - type: manual_review
    info: "The router must log all packets that have been dropped via the stateless firewall filter.\nVerify all discarding\
      \ firewall filter terms are configured to send events to syslog.\nNote: Stateless firewall filters support \"log\" and\
      \ \"syslog\" actions. The \"log\" action\nmaintains a temporary list of events and the \"syslog\" action generates events\
      \ for local\nstorage and/or external syslog servers. Verify at least \"syslog\" is associated with all\ndiscarding terms.\n\
      For example:\n[edit firewall]\nfamily inet {\n f"
    severity: medium
