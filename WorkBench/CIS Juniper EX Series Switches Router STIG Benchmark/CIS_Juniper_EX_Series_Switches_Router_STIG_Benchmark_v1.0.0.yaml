- id: '1.80'
  title: JUEX-RT-000800
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper Multicast Source Discovery Protocol (MSDP) router must be configured to only accept MSDP packets
    from known MSDP peers. GROUP ID: V-254052 RULE ID: SV-254052r844189'
  rationale: MSDP peering with customer network routers presents additional risks to the DISN Core, whether from a rogue or
    misconfigured MSDP-enabled router. To guard against an attack from malicious MSDP traffic, the receive path or interface
    filter for all MSDPenabled RP routers must be configured to only accept MSDP packets from known MSDP peers.
  impact: ''
  references: []
  page_start: 276
  audit_raw: "Review the router configuration to determine if there is a receive path or interface filter\nto only accept\
    \ MSDP packets from known MSDP peers.\n[edit firewall]\nfamily inet {\n filter <name> {\n term 1 {\n from {\n source-prefix-list\
    \ {\n msdp-peers;\n }\n protocol tcp;\n destination-port msdp;\n }\n then accept;\n }\n term 2 {\n from {\n source-prefix-list\
    \ {\n msdp-peers;\n }\n protocol tcp;\n source-port msdp;\n }\n then accept;\n }\n <additional terms>\n term default {\n\
    \ then {\n syslog;\n discard;\n }\n }\n }\n}\nfamily inet6 {\n filter <name> {\n term 1 {\n from {\n source-prefix-list\
    \ {\n msdp-peers-ipv6;\n }\n next-header tcp;\n destination-port msdp;\n }\n then accept;\n }\n term 2 {\n from {\n source-prefix-list\
    \ {\n msdp-peers-ipv6;\n }\n next-header tcp;\n source-port msdp;\n }\n then accept;\n }\n <additional terms>\n term default\
    \ {\n then {\n syslog;\n discard;\n }\n }\n }\n}\nNote: Some platforms support the \"port\" keyword that filters on both\
    \ source- and\ndestination-port, which eliminates the need for separate terms. For instance:\nfilter <name> {\n term 1\
    \ {\n from {\n source-prefix-list {\n <prefix list name>;\n }\n [protocol|next-header] tcp;\n port msdp;\n }\n then accept;\n\
    \ }\n <additional terms>\n term default {\n then {\n syslog;\n discard;\n }\n }\n}\nVerify the filter is applied to external\
    \ interfaces or loopback.\n[edit interfaces]\n<external interface> {\n unit <number> {\n family inet {\n filter {\n input\
    \ <IPv4 filter name>;\n }\n address <IPv4 address>/<mask>;\n }\n family inet6 {\n filter {\n input <IPv6 filter name>;\n\
    \ }\n address <IPv6 address>/<prefix>;\n }\n }\n}\nlo0 {\n unit <number> {\n family inet {\n filter {\n input <IPv4 filter\
    \ name>;\n }\n address <IPv4 address>/32;\n }\n family inet6 {\n filter {\n input <IPv6 filter name>;\n }\n address <IPv6\
    \ address>/128;\n }\n }\n}\nNote: Some Juniper devices support both monolithic filters and filter lists. Filter lists\n\
    separate each term, or set of terms, into a separate filter that is applied sequentially to\nan interface. If using filter\
    \ lists, the keywords \"input\" or \"output\" change to \"input-list\" or\n\"output-list\". Verify the final list item\
    \ is a deny-all filter. The deny-all filter is created once\nper family and can be reused across multiple lists. For example:\n\
    input-list [ permit_mgt permit_routing_protocols default-deny ];\nIf the router is not configured to only accept MSDP\
    \ packets from known MSDP peers,\nthis is a finding."
  remediation: 'Ensure the receive path or interface filter for all MSDP routers only accepts MSDP

