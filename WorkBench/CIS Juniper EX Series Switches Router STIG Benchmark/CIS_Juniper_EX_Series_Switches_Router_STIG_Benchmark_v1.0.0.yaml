    severity: medium
- id: '1.68'
  title: JUEX-RT-000680
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper multicast RP router must be configured to limit the multicast forwarding cache so that its resources
    are not saturated by managing an overwhelming number of PIM and MSDP source-active entries. GROUP ID: V-254040 RULE ID:
    SV-254040r997535'
  rationale: MSDP peering between networks enables sharing of multicast source information. Enclaves with an existing multicast
    topology using PIM-SM can configure their RP routers to peer with MSDP routers. As a first step of defense against a denial-of-service
    (DoS) attack, all RP routers must limit the multicast forwarding cache to ensure that router resources are not saturated
    managing an overwhelming number of PIM and MSDP source-active entries.
  impact: ''
  references: []
  page_start: 235
  audit_raw: "Review the router configuration to determine if forwarding cache thresholds are defined.\n[edit routing-options]\n\
    multicast {\n forwarding-cache {\n threshold {\n suppress <1..200000>;\n reuse <1..200000>;\n log-warning <percent to\
    \ generate warning>;\n }\n }\n}\nIf the RP router is not configured to limit the multicast forwarding cache to ensure\
    \ that\nits resources are not saturated, this is a finding."
  remediation: 'Configure MSDP-enabled RP routers to limit the multicast forwarding cache for sourceactive entries.

    set routing-options multicast forwarding-cache threshold suppress <1..200000>

    set routing-options multicast forwarding-cache threshold reuse <1..200000>

    set routing-options multicast forwarding-cache threshold log-warning <percent

    to generate warning>'
  checks:
