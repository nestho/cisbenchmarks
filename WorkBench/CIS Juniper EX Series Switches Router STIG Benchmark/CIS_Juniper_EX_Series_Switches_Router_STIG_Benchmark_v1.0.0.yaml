  title: JUEX-RT-000200
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper out-of-band management (OOBM) gateway router must be configured to have separate IGP instances
    for the managed network and management network. GROUP ID: V-253992 RULE ID: SV-253992r844009'
  rationale: If the gateway router is not a dedicated device for the OOBM network, implementation of several safeguards for
    containment of management and production traffic boundaries must occur. Since the managed and management network are separate
    routing domains, configuration of separate Interior Gateway Protocol routing instances is critical on the router to segregate
    traffic from each network.
  impact: ''
  references: []
  page_start: 65
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nVerify that the OOBM interface is an adjacency in\
    \ the Interior Gateway Protocol routing\ndomain for the management network. Interfaces can only be assigned to one routing\n\
    instance.\n[edit protocols ospf]\ninterface <interface name>.<logical unit>; << Cannot be assigned to a virtual\nrouting\
    \ instance.\n[edit routing-instances]\n<name> {\n instance-type virtual-router;\n protocols {\n ospf {\n area <area number>\
    \ {\n interface <interface name>.<logical unit>; << Cannot be\nassigned to the default routing instance at [edit protocols].\n\
    \ }\n }\n }\n}\nNote: If the same interface is assigned to the default routing instance and to a virtual\nrouting instance,\
    \ commit fails.\nSome platforms support a routing-instance using the reserved name \"mgmt_junos\". On\nthese platforms,\
    \ configure the \"mgmt_junos\" instance and apply at the [edit system]\nhierarchy.\n[edit system]\nmanagement-instance;\n\
    [edit routing-instances]\nmgmt_junos {\n routing-options {\n static {\n route 0.0.0.0/0 next-hop <next-hop address>;\n\
    \ }\n }\n}\nNote: Not all platforms support routing instances.\nIf the router does not enforce that Interior Gateway Protocol\
    \ instances configured on the\nOOBM gateway router peer only with their own routing domain, this is a finding."
  remediation: 'This requirement is not applicable for the DODIN Backbone.

    Configure the router to enforce that Interior Gateway Protocol instances configured on

    the OOBM gateway router peer only with their own routing domain.

    set protocols ospf area <number> interface <interface name>.<logical unit>

    set routing-instances <name> instance-type virtual-router

    set routing-instances <name> protocols ospf area <number> interface

    <interface name>.<logical unit>'
  checks:
  - type: manual_review
