- id: '1.59'
  title: JUEX-RT-000590
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to protect against or limit the effects of denial-ofservice (DoS) attacks
    by employing control plane protection. GROUP ID: V-254031 RULE ID: SV-254031r997533'
  rationale: The Routing Engine (RE) is critical to all network operations because it is the component used to build all forwarding
    paths for the data plane via control plane processes. It is also instrumental with ongoing network management functions
    that keep the routers and links available for providing network services. Any disruption to the RE or the control and
    management planes can result in mission-critical network outages. A DoS attack targeting the RE can result in excessive
    CPU and memory utilization. To maintain network stability and RE security, the router must be able to handle specific
    control plane and management plane traffic that is destined to the RE. In the past, one method of filtering was to use
    ingress filters on forwarding interfaces to filter both forwarding path and receiving path traffic. However, this method
    does not scale well as the number of interfaces grows and the size of the ingress filters grows. Control plane policing
    increases the security of routers and multilayer switches by protecting the RE from unnecessary or malicious traffic.
    Filtering and rate limiting the traffic flow of control plane packets can be implemented to protect routers against reconnaissance
    and DoS attacks, allowing the control plane to maintain packet forwarding and protocol states despite an attack or heavy
    load on the router or multilayer switch.
  impact: ''
  references: []
  page_start: 208
  audit_raw: "Determine whether control plane protection has been implemented on the device by\nverifying traffic types have\
    \ been classified based on importance levels and a policy has\nbeen configured to filter and rate limit the traffic according\
    \ to each class.\nVerify firewall filters include policers (rate limiting) based upon importance levels.\nAlthough the\
    \ policer names shown in the example are the bandwidth limit, any legal\nname can be used.\n[edit firewall]\nfamily inet\
    \ {\n filter <name> {\n term accept-tcp-initial {\n from {\n source-prefix-list {\n management-networks-ipv4;\n }\n destination-prefix-list\
    \ {\n router-addresses-ipv4;\n }\n protocol tcp;\n destination-port ssh;\n tcp-initial;\n }\n then {\n policer policer-32k;\
    \ << Lower rate for connection attempts to\nhelp prevent SYN flood attacks.\n accept;\n }\n }\n term accept-ssh {\n from\
    \ {\n source-prefix-list {\n management-networks-ipv4;\n }\n destination-prefix-list {\n router-addresses-ipv4;\n }\n\
    \ protocol tcp;\n destination-port ssh;\n }\n then {\n policer policer-1g; << Higher rate after connection\nestablishment\
    \ for remote management and/or secure file transfer.\n accept;\n }\n }\n term accept-snmp {\n from {\n source-prefix-list\
    \ {\n snmp-servers-ipv4;\n }\n destination-prefix-list {\n router-addresses-ipv4;\n }\n protocol udp;\n destination-port\
    \ snmp;\n }\n then {\n policer policer-1m;\n accept;\n }\n }\n <additional terms>\n term default-deny {\n then {\n log;\n\
    \ syslog;\n discard;\n }\n }\n }\n}\nfamily inet6 {\n filter <name> {\n term accept-tcp-initial {\n from {\n source-prefix-list\
    \ {\n management-networks-ipv6;\n }\n destination-prefix-list {\n router-addresses-ipv6;\n }\n next-header tcp;\n destination-port\
    \ ssh;\n tcp-initial;\n }\n then {\n policer policer-32k; << Lower rate for connection attempts to\nhelp prevent SYN flood\
    \ attacks.\n accept;\n }\n }\n term accept-ssh {\n from {\n source-prefix-list {\n management-networks-ipv6;\n }\n destination-prefix-list\
    \ {\n router-addresses-ipv6;\n }\n next-header tcp;\n destination-port ssh;\n }\n then {\n policer policer-1g; << Higher\
    \ rate after connection\nestablishment for remote management.\n accept;\n }\n }\n term accept-snmp {\n from {\n source-prefix-list\
    \ {\n snmp-servers-ipv6;\n }\n destination-prefix-list {\n router-addresses-ipv6;\n }\n next-header udp;\n destination-port\
    \ snmp;\n }\n then {\n policer policer-1m;\n accept;\n }\n }\n <additional terms>\n term default-deny {\n then {\n log;\n\
    \ syslog;\n discard;\n }\n }\n }\n}\nNote: Verify the applied filter has terms for all permitted traffic (e.g., OSPF,\
    \ BGP, etc.).\npolicer policer-1g {\n if-exceeding {\n bandwidth-limit 1g;\n burst-size-limit 100k;\n }\n then discard;\n\
    }\npolicer policer-1m {\n if-exceeding {\n bandwidth-limit 1m;\n burst-size-limit 15k;\n }\n then discard;\n}\npolicer\
    \ policer-32k {\n if-exceeding {\n bandwidth-limit 32k;\n burst-size-limit 1500;\n }\n then discard;\n}\n[edit interfaces]\n\
    lo0 {\n unit <number> {\n family inet {\n filter {\n input <filter name>;\n }\n address <IPv4 address>/32;\n }\n family\
    \ inet6 {\n filter {\n input <filter name>;\n }\n address <IPv6 address>/128/\n }\n }\n}\nNote: Some Juniper devices support\
    \ both monolithic filters and filter lists. Filter lists\nseparate each term, or set of terms, into a separate filter\
    \ that is applied sequentially to\nan interface. If using filter lists, the keywords \"input\" or \"output\" change to\
    \ \"input-list\" or\n\"output-list\". Verify the final list item is a deny-all filter. The deny-all filter is created\
    \ once\nper family and can be reused across multiple lists. For example:\ninput-list [ permit_mgt permit_routing_protocols\
    \ default-deny ];\nIf the router does not have control plane protection implemented, this is a finding."
  remediation: 'Implement control plane protection by classifying traffic types based on importance and

    configure filters to restrict and rate limit the traffic directed to and processed by the RE

    according to each class.

    set firewall family inet filter <name> term accept-tcp-initial from sourceprefix-list management-networks-ipv4

    set firewall family inet filter <name> term accept-tcp-initial from

    destination-prefix-list router-addresses-ipv4

    set firewall family inet filter <name> term accept-tcp-initial from protocol

    tcp

    set firewall family inet filter <name> term accept-tcp-initial from

    destination-port ssh

    set firewall family inet filter <name> term accept-tcp-initial from tcpinitial

    set firewall family inet filter <name> term accept-tcp-initial then policer

    policer-32k

    set firewall family inet filter <name> term accept-tcp-initial then accept

    set firewall family inet filter <name> term accept-ssh from source-prefixlist management-networks-ipv4

    set firewall family inet filter <name> term accept-ssh from destinationprefix-list router-addresses-ipv4

    set firewall family inet filter <name> term accept-ssh from protocol tcp

    set firewall family inet filter <name> term accept-ssh from destination-port

    ssh

    set firewall family inet filter <name> term accept-ssh then policer policer1g

    set firewall family inet filter <name> term accept-ssh then count accept-ssh

    set firewall family inet filter <name> term accept-ssh then accept

    set firewall family inet filter <name> term accept-snmp from source-prefixlist snmp-servers-ipv4

    set firewall family inet filter <name> term accept-snmp from destinationprefix-list router-addresses-ipv4

    set firewall family inet filter <name> term accept-snmp from protocol udp

    set firewall family inet filter <name> term accept-snmp from destination-port

    snmp

    set firewall family inet filter <name> term accept-snmp then policer policer1m

    set firewall family inet filter <name> term accept-snmp then count acceptsnmp

    set firewall family inet filter <name> term accept-snmp then accept

    <additional terms>

    set firewall family inet filter <name> term default-deny then log

    set firewall family inet filter <name> term default-deny then syslog

    set firewall family inet filter <name> term default-deny then discard

    set firewall policer policer-1g if-exceeding bandwidth-limit 1g

    set firewall policer policer-1g burst-size-limit 100k

    set firewall policer policer-1g then discard

    set firewall policer policer-1m if-exceeding bandwidth-limit 1m

    set firewall policer policer-1m burst-size-limit 15k

    set firewall policer policer-1m then discard

    set firewall policer policer-32k if-exceeding bandwidth-limit 132k

    set firewall policer policer-32k burst-size-limit 1500

    set firewall policer policer-32k then discard

    set interfaces lo0 unit <number> family inet filter <name>

    set interfaces lo0 unit <number> family inet address <IPv4 address>/32

    set interfaces lo0 unit <number> family inet6 filter <name>

    set interfaces lo0 unit <number> family inet6 address <IPv6 address>/128'
  checks:
  - type: manual_review
    info: "Determine whether control plane protection has been implemented on the device by\nverifying traffic types have\
      \ been classified based on importance levels and a policy has\nbeen configured to filter and rate limit the traffic\
      \ according to each class.\nVerify firewall filters include policers (rate limiting) based upon importance levels.\n\
      Although the policer names shown in the example are the bandwidth limit, any legal\nname can be used.\n[edit firewall]\n\
      family inet {\n filter <name> {\n term accept-tcp-"
