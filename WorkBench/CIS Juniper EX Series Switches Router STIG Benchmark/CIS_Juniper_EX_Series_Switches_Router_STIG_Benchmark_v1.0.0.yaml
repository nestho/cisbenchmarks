- id: '1.78'
  title: JUEX-RT-000780
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper multicast Designated Router (DR) must be configured to filter the IGMP and MLD Report messages
    to allow hosts to join only multicast groups that have been approved by the organization. GROUP ID: V-254050 RULE ID:
    SV-254050r844262'
  rationale: Real-time multicast traffic can entail multiple large flows of data. Large unicast flows tend to be fairly isolated
    (i.e., someone downloading a file here or there), whereas multicast can have broader impact on bandwidth consumption,
    resulting in extreme network congestion. Hence, it is imperative that there is multicast admission control to restrict
    which multicast groups hosts are allowed to join via IGMP or MLD.
  impact: ''
  references: []
  page_start: 270
  audit_raw: "Review the configuration of the DR to verify that it is filtering IGMP or MLD report\nmessages, allowing hosts\
    \ to join only those groups that have been approved.\nNote: This requirement is only applicable to Source Specific Multicast\
    \ (SSM)\nimplementation. This requirement is not applicable to Any Source Multicast (ASM) since\nthe filtering is being\
    \ performed by the Rendezvous Point router.\n[edit policy-options]\npolicy-statement <name> {\n term unauth-groups {\n\
    \ from {\n route-filter 224.0.1.2/32 exact;\n route-filter 224.0.2.2/32 exact;\n }\n then reject;\n }\n term allow-others\
    \ {\n then accept;\n }\n}\npolicy-statement <name IPv6> {\n term unauth-groups {\n from {\n route-filter fec0:1:1:4::/64\
    \ exact;\n }\n then reject;\n }\n term allow-others {\n then accept;\n }\n}\n[edit protocols]\nigmp {\n interface <name>.<logical\
    \ unit> {\n group-policy <policy name>;\n }\n}\nmld {\n interface <name>.<logical unit> {\n group-policy <policy name\
    \ IPv6>;\n }\n}\nIf the DR is not filtering IGMP or MLD report messages, this is a finding."
  remediation: 'Configure the DR to filter the IGMP and MLD report messages to allow hosts to join only

