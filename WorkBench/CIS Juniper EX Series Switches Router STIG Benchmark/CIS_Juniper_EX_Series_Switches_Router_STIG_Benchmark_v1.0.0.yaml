- id: '1.39'
  title: JUEX-RT-000390
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to drop all fragmented Internet Control Message Protocol (ICMP) packets
    destined to itself. GROUP ID: V-254011 RULE ID: SV-254011r997525'
  rationale: Fragmented ICMP packets can be generated by hackers for denial-of-service (DoS) attacks such as Ping O' Death
    and Teardrop. It is imperative that all fragmented ICMP packets are dropped.
  impact: ''
  references: []
  page_start: 143
  audit_raw: "Review the firewall filter for the router receive path. Firewall filters applied to the\nloopback interface\
    \ affects traffic destined for the Route Engine (RE) regardless of\ningress interface. Individual firewall filters are\
    \ also supported on each ingress interface.\nNote: Verify the firewall filter applied to the loopback interface addresses\
    \ all traffic\ndestined for the RE (e.g., BGP, OSPF, etc.).\nVerify that it will drop all fragmented ICMP packets destined\
    \ to itself. For example:\n[edit policy-options]\nprefix-list router-addresses-ipv4 {\n <interface IPv4 address>/32;\n\
    \ <other router interface addresses>;\n}\n[edit firewall family inet]\nfilter protect_re {\n term 1 {\n from {\n destination-prefix-list\
    \ {\n router-addresses-ipv4;\n }\n is-fragment;\n protocol icmp;\n }\n then {\n log;\n syslog;\n discard;\n }\n }\n <additional\
    \ terms for RE destined traffic>\n}\n[edit interfaces lo0 unit 0]\nfamily inet {\n filter {\n input protect_re;\n }\n\
    \ address <IPv4 address>/32;\n}\nNote: Some Juniper devices support both monolithic filters and filter lists. Filter lists\n\
    separate each term, or set of terms, into a separate filter that is applied sequentially to\nan interface. If using filter\
    \ lists, the keywords \"input\" or \"output\" change to \"input-list\" or\n\"output-list\". Verify the final list item\
    \ is a deny-all filter. The deny-all filter is created once\nper family and can be reused across multiple lists. For example:\n\
    input-list [ permit_mgt permit_routing_protocols default-deny ];\nIf the router is not configured with a receive-path\
    \ filter to drop all fragmented ICMP\npackets, this is a finding.\nNote: If the platform does not support the receive\
    \ path filter, verify that all layer 3\ninterfaces have an ingress filter to control what packets are allowed to be destined\
    \ to\nthe router for processing."
  remediation: 'Ensure all routers have their receive path filter configured to drop all fragmented ICMP

    packets.

    set policy-options prefix-list router-addresses-ipv4 <interface IPv4

    address>/32

    set firewall family inet filter protect_re term 1 from destination-prefixlist router-addresses-ipv4

    set firewall family inet filter protect_re term 1 from protocol icmp

    set firewall family inet filter protect_re term 1 from is-fragment

    set firewall family inet filter protect_re term 1 then log

    set firewall family inet filter protect_re term 1 then syslog

    set firewall family inet filter protect_re term 1 then discard

    <additional terms to account for all traffic destined for the RE>

    set interfaces lo0 unit 0 family inet filter input protect_re'
