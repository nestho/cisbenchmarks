- id: '1.43'
  title: JUEX-RT-000430
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper BGP router must be configured to reject outbound route advertisements for any prefixes belonging
    to the IP core. GROUP ID: V-254015 RULE ID: SV-254015r844078'
  rationale: Outbound route advertisements belonging to the core can result in traffic either looping or being black holed,
    or at a minimum, using a nonoptimized path.
  impact: ''
  references: []
  page_start: 153
  audit_raw: "Review the BGP router configuration to verify that there is a filter defined to block route\nadvertisements\
    \ for prefixes that belong to the IP core.\nVerify an appropriate prefix-list containing the IP core prefixes is referenced\
    \ in a policystatement. For example:\n[edit policy-options]\nprefix-list ip-core-ipv4 {\n 192.0.2.0/24;\n}\nprefix-list\
    \ ip-core-ipv6 {\n 2001:db8:2::/64;\n}\npolicy-statement advertise-bgp-prefix {\n term exclude-ipv4-core {\n from {\n\
    \ prefix-list ip-core-ipv4;\n }\n then reject;\n }\n term exclude-ipv6-core {\n from {\n prefix-list ip-core-ipv6;\n }\n\
    \ then reject;\n }\n term default {\n then accept;\n }\n}\nThe prefix filter must be referenced outbound on the appropriate\
    \ BGP neighbor\nstatements. For example:\n[edit protocols]\nbgp {\n group eBGP {\n type external;\n export advertise-bgp-prefix;\n\
    \ neighbor 192.0.2.11 {\n export advertise-bgp-prefix;\n }\n }\n export advertise-bgp-prefix;\n}\nNote: Juniper routers\
    \ support global, group, and neighbor export statements with the\nmore specific definition taking precedence. Ensure more\
    \ specific export policies (e.g.,\nneighbor and group) do not reverse higher level export statements.\nIf the router is\
    \ not configured to reject outbound route advertisements that belong to the\nIP core, this is a finding."
  remediation: 'Configure all eBGP routers to filter outbound route advertisements belonging to the IP

    core.

    For example:

    set policy-options prefix-list ip-core-ipv4 192.0.2.0/24

    set policy-options prefix-list ip-core-ipv6 2001:db8:2::/64

    set policy-options policy-statement advertise-bgp-prefix term exclude-ipv4core from prefix-list ip-core-ipv4

    set policy-options policy-statement advertise-bgp-prefix term exclude-ipv4core then reject

    set policy-options policy-statement advertise-bgp-prefix term exclude-ipv6core from prefix-list ip-core-ipv6

    set policy-options policy-statement advertise-bgp-prefix term exclude-ipv6core then reject

    set policy-options policy-statement advertise-bgp-prefix term default then

    accept

    set protocols bgp group eBGP type external

    set protocols bgp group eBGP export advertise-bgp-prefix

    set protocols bgp group eBGP neighbor 192.0.2.11 export advertise-bgp-prefix

    set protocols bgp export advertise-bgp-prefix'
  checks:
  - type: manual_review
    info: "Review the BGP router configuration to verify that there is a filter defined to block route\nadvertisements for\
      \ prefixes that belong to the IP core.\nVerify an appropriate prefix-list containing the IP core prefixes is referenced\
      \ in a policystatement. For example:\n[edit policy-options]\nprefix-list ip-core-ipv4 {\n 192.0.2.0/24;\n}\nprefix-list\
      \ ip-core-ipv6 {\n 2001:db8:2::/64;\n}\npolicy-statement advertise-bgp-prefix {\n term exclude-ipv4-core {\n from {\n\
      \ prefix-list ip-core-ipv4;\n }\n then reject;\n }\n te"
    severity: medium
- id: '1.44'
  title: JUEX-RT-000440
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Juniper PE router must be configured to block any traffic that is destined to IP core infrastructure.
    GROUP ID: V-254016 RULE ID: SV-254016r997526'
  rationale: IP/MPLS networks providing VPN and transit services must provide, at the least, the same level of protection
    against denial-of-service (DoS) attacks and intrusions as layer 2 networks. Although the IP core network elements are
    hidden, security should never rely entirely on obscurity. IP addresses can be guessed. Core network elements must not
    be accessible from any external host. Protecting the core from any attack is vital for the integrity and privacy of customer
    traffic as well as the availability of transit services. A compromise of the IP core can result in an outage or, at a
    minimum, nonoptimized forwarding of customer traffic. Protecting the core from an outside attack also prevents attackers
    from using the core to attack any customer. Hence, it is imperative that all routers at the edge deny traffic destined
    to any address belonging to the IP core infrastructure.
  impact: ''
  references: []
  page_start: 155
  audit_raw: "Review the PE router configuration to verify that an ingress firewall filter is applied to all\nCE-facing interfaces.\n\
    Verify that the ingress firewall filter rejects and logs packets destined to the IP core\naddress block. For example:\n\
    [edit policy-options]\nprefix-list ipv4-core {\n 192.0.2.0/24;\n}\nprefix-list ipv6-core {\n 2001:db8:2::/64;\n}\n[edit\
    \ firewall]\nfamily inet {\n filter deny-core-ipv4 {\n term 1 {\n from {\n destination-prefix-list {\n ipv4-core;\n }\n\
    \ }\n then {\n log;\n syslog;\n discard;\n }\n }\n term default {\n then accept;\n }\n }\n}\nfamily inet6 {\n filter deny-core-ipv6\
    \ {\n term 1 {\n from {\n destination-prefix-list {\n ipv6-core;\n }\n }\n then {\n log;\n syslog;\n discard;\n }\n }\n\
    \ term default {\n then accept;\n }\n }\n}\nVerify the firewall filter is applied to CE-facing interfaces:\n[edit interfaces]\n\
    ge-0/0/0 {\n unit 0 {\n family inet {\n filter {\n input deny-core-ipv4;\n }\n address <IPv4 address/mask>;\n }\n family\
    \ inet6 {\n filter {\n input deny-core-ipv6;\n }\n address <IPv6 address/prefix>;\n }\n }\n}\nNote: Some Juniper devices\
    \ support both monolithic filters and filter lists. Filter lists\nseparate each term, or set of terms, into a separate\
    \ filter that is applied sequentially to\nan interface. If using filter lists, the keywords \"input\" or \"output\" change\
    \ to \"input-list\" or\n\"output-list\". Verify the final list item is a deny-all filter. The deny-all filter is created\
    \ once\nper family and can be reused across multiple lists. For example:\ninput-list [ permit_mgt permit_routing_protocols\
    \ default-deny ];\nIf the PE router is not configured to block any traffic with a destination address assigned\nto the\
    \ IP core infrastructure, this is a finding.\nNote: Internet Control Message Protocol (ICMP) echo requests and traceroutes\
    \ will be\nallowed to the edge from external adjacent peers."
  remediation: 'Configure protection for the IP core to be implemented at the edges by blocking any

    traffic with a destination address assigned to the IP core infrastructure.

    Configure appropriate prefix lists and firewall filters. For example:

    set policy-options prefix-list ipv4-core 192.0.2.0/24

    set policy-options prefix-list ipv6-core 2001:db8:2::/64

    set firewall family inet filter deny-core-ipv4 term 1 from destinationprefix-list ipv4-core

    set firewall family inet filter deny-core-ipv4 term 1 then log

    set firewall family inet filter deny-core-ipv4 term 1 then syslog

    set firewall family inet filter deny-core-ipv4 term 1 then discard

    set firewall family inet filter deny-core-ipv4 term default then accept

    set firewall family inet6 filter deny-core-ipv6 term 1 from destinationprefix-list ipv6-core

    set firewall family inet6 filter deny-core-ipv6 term 1 then log

    set firewall family inet6 filter deny-core-ipv6 term 1 then syslog

    set firewall family inet6 filter deny-core-ipv6 term 1 then discard

    set firewall family inet6 filter deny-core-ipv6 term default then accept

    Configure the appropriate interfaces with the firewall filter. For example:

    [edit interfaces]

    set interfaces ge-0/0/0 unit 0 family inet filter input deny-core-ipv4

    set interfaces ge-0/0/0 unit 0 family inet address <IPv4 address/mask>

    set interfaces ge-0/0/0 unit 0 family inet6 filter input deny-core-ipv6

    set interfaces ge-0/0/0 unit 0 family inet6 address <IPv6 address/prefix>'
  checks:
  - type: manual_review
    info: "Review the PE router configuration to verify that an ingress firewall filter is applied to all\nCE-facing interfaces.\n\
      Verify that the ingress firewall filter rejects and logs packets destined to the IP core\naddress block. For example:\n\
