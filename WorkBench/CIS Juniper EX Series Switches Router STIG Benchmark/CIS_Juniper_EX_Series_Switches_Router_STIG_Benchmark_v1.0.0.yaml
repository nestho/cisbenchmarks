- id: '1.88'
  title: JUEX-RT-000880
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper BGP router must be configured to use its loopback address as the source address for iBGP peering
    sessions. GROUP ID: V-254060 RULE ID: SV-254060r844213'
  rationale: Using a loopback address as the source address offers a multitude of uses for security, access, management, and
    scalability of the BGP routers. It is easier to construct appropriate ingress filters for router management plane traffic
    destined to the network management subnet since the source addresses will be from the range used for loopback interfaces
    instead of a larger range of addresses used for physical interfaces. Log information recorded by authentication and syslog
    servers will record the router’s loopback address instead of the numerous physical interface addresses. When the loopback
    address is used as the source for eBGP peering, the BGP session will be harder to hijack since the source address to be
    used is not known globally— making it more difficult for a hacker to spoof an eBGP neighbor. By using traceroute, a hacker
    can easily determine the addresses for an eBGP speaker when the IP address of an external interface is used as the source
    address. The routers within the iBGP domain should also use loopback addresses as the source address when establishing
    BGP sessions.
  impact: ''
  references: []
  page_start: 301
  audit_raw: "Review the router configuration to verify that a loopback address has been configured.\nVerify that a loopback\
    \ interface is used as the source address for all iBGP sessions.\nbgp {\n group iBGP {\n type internal;\n local-interface\
    \ lo0.0;\n :\n }\n}\nIf the router does not use its loopback address as the source address for all iBGP\nsessions, this\
    \ is a finding."
  remediation: 'Ensure that the router’s loopback address is used as the source address when

    originating traffic.

    set protocols bgp group <group name> type internal

    set protocols bgp group <group name> local-interface lo0.0'
  checks:
  - type: manual_review
    info: "Review the router configuration to verify that a loopback address has been configured.\nVerify that a loopback\
