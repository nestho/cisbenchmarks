- id: '1.53'
  title: JUEX-RT-000530
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to implement message authentication for all control plane protocols.
    GROUP ID: V-254025 RULE ID: SV-254025r945861'
  rationale: A rogue router could send a fictitious routing update to convince a site's perimeter router to send traffic to
    an incorrect or even a rogue destination. This diverted traffic could be analyzed to learn confidential information about
    the site's network or used to disrupt the network's ability to communicate with other networks. This is known as a "traffic
    attraction attack" and is prevented by configuring neighbor router authentication for routing updates. This requirement
    applies to all IPv4 and IPv6 protocols that are used to exchange routing or packet forwarding information; this includes
    all Interior Gateway Protocols (such as OSPF, EIGRP, and IS-IS) and Exterior Gateway Protocols (such as BGP), MPLS-related
    protocols (such as LDP), and multicast-related protocols.
  impact: ''
  references: []
  page_start: 193
  audit_raw: "Review the router configuration.\nFor every protocol that affects the routing or forwarding tables (where information\
    \ is\nexchanged between neighbors), verify that neighbor router authentication is enabled.\n[edit security ipsec]\nsecurity-association\
    \ <sa name> {\n manual {\n direction bidirectional {\n protocol esp;\n spi <SPI value>;\n authentication {\n algorithm\
    \ hmac-sha-256-128;\n key ascii-text \"$8$aes256-gcm$hmac-sha2256$100$SpJ/ERRFEsc$y1Wqf1zM3d3xI+ZVB9WzTw$lgM06LJZN3FcVbTaSkDz4g$bZVi57MkUWg\n\
    \"; ## SECRET-DATA\n }\n }\n }\n}\n[edit protocols]\nbgp {\n group <group name> {\n type external;\n local-as <local AS\
    \ number>;\n neighbor <neighbor 1 address> {\n authentication-key \"$8$aes256-gcm$hmac-sha2256$100$cFQ99Gy83Og$SCMVXvnfna7/cZqH9fCECQ$bCVokm+es94xFJONmbKFNA$4561Uc/r\"\
    ;\n## SECRET-DATA\n }\n neighbor <neighbor 2 address> {\n ipsec-sa <SA name>;\n }\n }\n}\nNote: Juniper BGP routers support\
    \ either an MD5 key, rotating MD5 keys, or an IPsec\nsecurity association (SA). Verify the PSK for each MD5 and SA is\
    \ different between all\nneighbors.\nospf {\n area <area number> {\n interface <interface name>.<logical unit> {\n authentication\
    \ {\n md5 1 key \"$8$aes256-gcm$hmac-sha2256$100$hvt9Fpk6EEU$I2FKFJNrdKHpp1xesMB0aA$l9BsHxOYO4+B8f7erRj8Hw$A9PYzx53Ius\n\
    \"; ## SECRET-DATA\n }\n }\n interface <interface name>.<logical unit> {\n interface-type p2p;\n ipsec-sa <SA name>;\n\
    \ }\n }\n}\nNote: Juniper OSPF routers support either an MD5 key or an IPsec SA.\nospf3 {\n area <area number> {\n interface\
    \ <interface name>.<logical unit> {\n ipsec-sa <SA name>;\n }\n }\n}\nNote: Juniper OSPFv3 routers only support IPsec\
    \ SA.\nIf authentication is not enabled, this is a finding."
  remediation: 'Configure authentication to be enabled for every protocol that affects the routing or

    forwarding tables.

    set security ipsec security-association <sa name> manual direction

    bidirectional protocol esp

    set security ipsec security-association <sa name> manual direction

    bidirectional spi <SPI value>

    set security ipsec security-association <sa name> manual direction

    bidirectional authentication algorithm hmac-sha-256-128

    set security ipsec security-association <sa name> manual direction

    bidirectional authentication key ascii-text <PSK value>

    set protocols bgp group <group name> type external

    set protocols bgp group <group name> local-as <local AS number>

    set protocols bgp group <group name> neighbor <neighbor 1 address>

    authentication-key <PSK value>

    set protocols bgp group <group name> neighbor <neighbor 1 address> ipsec-sa

    <SA name>

    set protocols ospf area 0.0.0.1 interface <interface name>.<logical unit>

    authentication md5 1 key <PSK value>

    set protocols ospf area 0.0.0.1 interface <interface name>.<logical unit>

    interface-type p2p

    set protocols ospf area 0.0.0.1 interface <interface name>.<logical unit>

    ipsec-sa <SA name>'
  checks:
  - type: manual_review
    info: "Review the router configuration.\nFor every protocol that affects the routing or forwarding tables (where information\
      \ is\nexchanged between neighbors), verify that neighbor router authentication is enabled.\n[edit security ipsec]\n\
      security-association <sa name> {\n manual {\n direction bidirectional {\n protocol esp;\n spi <SPI value>;\n authentication\
      \ {\n algorithm hmac-sha-256-128;\n key ascii-text \"$8$aes256-gcm$hmac-sha2256$100$SpJ/ERRFEsc$y1Wqf1zM3d3xI+ZVB9WzTw$lgM06LJZN3FcVbTaSkDz4g$bZVi57MkUWg\n\
      \"; ##"
    severity: medium
- id: '1.54'
  title: JUEX-RT-000540
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper BGP router must be configured to use a unique key for each autonomous system (AS) that it peers
    with. GROUP ID: V-254026 RULE ID: SV-254026r945862'
  rationale: If the same keys are used between eBGP neighbors, the chance of a hacker compromising any of the BGP sessions
    increases. It is possible that a malicious user exists in one autonomous system who would know the key used for the eBGP
    session. This user would then be able to hijack BGP sessions with other trusted neighbors.
  impact: ''
  references: []
  page_start: 196
  audit_raw: "Interview the ISSM and router administrator to determine if unique keys are being used.\n[edit security ipsec]\n\
    security-association <sa name> {\n manual {\n direction bidirectional {\n protocol esp;\n spi <SPI value>;\n authentication\
    \ {\n algorithm hmac-sha-256-128;\n key ascii-text \"$8$aes256-gcm$hmac-sha2256$100$SpJ/ERRFEsc$y1Wqf1zM3d3xI+ZVB9WzTw$lgM06LJZN3FcVbTaSkDz4g$bZVi57MkUWg\n\
    \"; ## SECRET-DATA\n }\n }\n }\n}\n[edit protocols bgp]\ngroup <group name> {\n type external;\n local-as <local AS number>;\n\
    \ neighbor <neighbor 1 address> {\n authentication-key \"$8$aes256-gcm$hmac-sha2256$100$cFQ99Gy83Og$SCMVXvnfna7/cZqH9fCECQ$bCVokm+es94xFJONmbKFNA$4561Uc/r\"\
    ;\n## SECRET-DATA\n }\n neighbor <neighbor 2 address> {\n ipsec-sa <sa name>;\n }\n}\nNote: Juniper BGP routers support\
    \ either an MD5 key, rotating MD5 keys, or an IPsec\nsecurity association (SA). Verify the PSK for each MD5 and SA is\
    \ different between all\nneighbors.\nIf unique keys are not being used, this is a finding."
  remediation: 'Configure all eBGP routers with unique keys for each eBGP neighbor that it peers with.

