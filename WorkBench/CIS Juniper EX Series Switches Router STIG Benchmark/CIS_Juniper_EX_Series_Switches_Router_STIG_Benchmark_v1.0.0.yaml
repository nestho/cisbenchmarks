- id: '1.67'
  title: JUEX-RT-000670
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper PE router must be configured to implement Internet Group Management Protocol (IGMP) or Multicast
    Listener Discovery (MLD) snooping for each Virtual Private LAN Services (VPLS) bridge domain. GROUP ID: V-254039 RULE
    ID: SV-254039r844150'
  rationale: IGMP snooping provides a way to constrain multicast traffic at layer 2. By monitoring the IGMP membership reports
    sent by hosts within the bridge domain, the snooping application can set up layer 2 multicast forwarding tables to deliver
    traffic only to ports with at least one interested member within the VPLS bridge, thereby significantly reducing the volume
    of multicast traffic that would otherwise flood an entire VPLS bridge domain. The IGMP snooping operation applies to both
    access circuits and pseudowires within a VPLS bridge domain.
  impact: ''
  references: []
  page_start: 233
  audit_raw: "Review the router configuration to verify that IGMP or MLD snooping has been\nconfigured for IPv4 and IPv6 multicast\
    \ traffic respectively for each VPLS bridge domain\n(VFI instance).\n[edit routing-instances <name>]\nprotocols {\n igmp-snooping\
    \ {\n vlan <VLAN name>;\n }\n mld-snooping {\n vlan <VLAN name>;\n }\n}\nNote: Only EX9200-series devices currently support\
    \ VPLS.\nIf the router is not configured to implement IGMP or MLD snooping for each VPLS\nbridge domain, this is a finding."
  remediation: 'Configure IGMP or MLD snooping for IPv4 and IPv6 multicast traffic respectively for

    each VPLS bridge domain.

    set routing-instances <name> protocols igmp-snooping vlan <vlan ID>

    set routing-instances <name> protocols mld-snooping vlan <vlan ID>'
  checks:
  - type: manual_review
    info: "Review the router configuration to verify that IGMP or MLD snooping has been\nconfigured for IPv4 and IPv6 multicast\
      \ traffic respectively for each VPLS bridge domain\n(VFI instance).\n[edit routing-instances <name>]\nprotocols {\n\
      \ igmp-snooping {\n vlan <VLAN name>;\n }\n mld-snooping {\n vlan <VLAN name>;\n }\n}\nNote: Only EX9200-series devices\
