- id: '1.94'
  title: JUEX-RT-000940
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper PE router must be configured to have each VRF with the appropriate Route Distinguisher (RD). GROUP
    ID: V-254066 RULE ID: SV-254066r844231'
  rationale: An RD provides uniqueness to the customer address spaces within the MPLS L3VPN infrastructure. The concept of
    the VPN-IPv4 and VPN-IPv6 address families consists of the RD prepended before the IP address. Hence, if the same IP prefix
    is used in several different L3VPNs, it is possible for BGP to carry several completely different routes for that prefix,
    one for each VPN. Since VPN-IPv4 addresses and IPv4 addresses are different address families, BGP never treats them as
    comparable addresses. The purpose of the RD is to create distinct routes for common IPv4 address prefixes. On any given
    PE router, a single RD can define a VRF in which the entire address space may be used independently, regardless of the
    makeup of other VPN address spaces. Hence, it is imperative that a unique RD is assigned to each L3VPN and that the proper
    RD is configured for each VRF.
  impact: ''
  references: []
  page_start: 315
  audit_raw: "Review the RDs that have been assigned for each VRF according to the plan provided\nby the ISSM.\nReview all\
    \ VRFs configured on CE-facing interfaces and verify that the proper RD has\nbeen configured for each. Assuming the assigned\
    \ RD for \"customer 1\" is \"33:33\", verify\nthe route-distinguisher matches.\n[edit routing-instances]\n<instance name>\
    \ {\n description \"To customer 1\";\n instance-type vrf;\n interface <ce-facing interface>.<logical unit>;\n route-distinguisher\
    \ 33:33; << Must match the design plan for \"customer\n1\".\n vrf-target cust1:33:33; << Must match the design plan for\
