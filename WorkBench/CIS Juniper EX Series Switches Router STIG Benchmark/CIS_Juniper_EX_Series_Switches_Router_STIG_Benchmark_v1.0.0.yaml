    set policy-options policy-statement <name IPv6> term unauth-groups then

    reject

    set policy-options policy-statement <name IPv6> term accept-others then

    accept

    set protocols igmp interface <name>.<logical unit> group-policy <policy name>

    set protocols mld interface <name>.<logical unit> group-policy <policy name

    IPv6>'
