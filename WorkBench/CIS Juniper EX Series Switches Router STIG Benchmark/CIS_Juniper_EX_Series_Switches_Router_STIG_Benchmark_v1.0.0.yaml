  description: 'The Juniper router must be configured in accordance with the security configuration settings based on DoD
    security configuration or implementation guidance, including STIGs, NSA configuration guides, CTOs, and DTMs. GROUP ID:
    V-254074 RULE ID: SV-254074r844255'
  rationale: Configuring the network device to implement organization-wide security implementation guides and security checklists
    ensures compliance with federal standards and establishes a common security baseline across DoD that reflects the most
    restrictive security posture consistent with operational requirements. Configuration settings are the set of parameters
    that can be changed that affect the security posture and/or functionality of the network device. Security-related parameters
    are those parameters impacting the security state of the network device, including the parameters required to satisfy
    other security control requirements.
  impact: ''
  references: []
  page_start: 331
