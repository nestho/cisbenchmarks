- id: '1.83'
  title: JUEX-RT-000820
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper perimeter router must be configured drop IPv6 packets with a Routing Header type 0, 1, or 3255.
    GROUP ID: V-254054 RULE ID: SV-254054r844195'
  rationale: The routing header can be used maliciously to send a packet through a path where less robust security is in place,
    rather than through the presumably preferred path of routing protocols. Use of the routing extension header has few legitimate
    uses other than as implemented by Mobile IPv6. The Type 0 Routing Header (RFC 5095) is dangerous because it allows attackers
    to spoof source addresses and obtain traffic in response, rather than the real owner of the address. Secondly, a packet
    with an allowed destination address could be sent through a Firewall using the Routing Header functionality, only to bounce
    to a different node once inside. The Type 1 Routing Header is defined by a specification called "Nimrod Routing", a discontinued
    project funded by DARPA. Assuming that most implementations will not recognize the Type 1 Routing Header, it must be dropped.
    The Type 3–255 Routing Header values in the routing type field are currently undefined and should be dropped inbound and
    outbound.
  impact: ''
  references: []
  page_start: 286
  audit_raw: "This requirement is not applicable for the DODIN Backbone.\nReview the router configuration to determine if\
    \ it is configured to drop IPv6 packets\ncontaining a Routing Header of type 0, 1, or 3–255.\n[edit firewall family inet6]\n\
    filter <name> {\n term 1 {\n from {\n next-header routing;\n }\n then {\n log;\n syslog;\n discard;\n }\n }\n <additional\
    \ terms>\n term default {\n then {\n log;\n syslog;\n discard;\n }\n }\n}\nNote: Juniper routers do not support configuring\
    \ option types for Routing extension\nheaders. Therefore, all packets with the Routing extension header are dropped.\n\
    Verify the filter is applied to applicable interfaces.\n[edit interfaces]\n<interface name> {\n unit <number> {\n family\
    \ inet6 {\n filter {\n input <filter name>;\n }\n address <IPv6 address>.<prefix>;\n }\n }\n}\nNote: Some Juniper devices\
    \ support both monolithic filters and filter lists. Filter lists\nseparate each term, or set of terms, into a separate\
    \ filter that is applied sequentially to\nan interface. If using filter lists, the keywords \"input\" or \"output\" change\
    \ to \"input-list\" or\n\"output-list\". Verify the final list item is a deny-all filter. The deny-all filter is created\
    \ once\nper family and can be reused across multiple lists. For example:\ninput-list [ permit_mgt permit_routing_protocols\
    \ default-deny ];\nIf the router is not configured to drop IPv6 packets containing a Routing Header of type\n0, 1, or\
    \ 3–255, this is a finding."
  remediation: 'Configure the router to drop IPv6 packets with Routing Header of type 0, 1, or 3–255.

