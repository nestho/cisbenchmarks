      \ << If stanza is present and not "
    severity: medium
- id: '1.15'
  title: JUEX-RT-000150
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper multicast edge router must be configured to establish boundaries for administratively scoped multicast
    traffic. GROUP ID: V-253987 RULE ID: SV-253987r843994'
  rationale: If multicast traffic is forwarded beyond the intended boundary, it is possible that it can be intercepted by
    unauthorized or unintended personnel. Administrative scoped multicast addresses are locally assigned and are to be used
    exclusively by the enterprise network or enclave. Administrative scoped multicast traffic must not cross the enclave perimeter
    in either direction. Restricting multicast traffic makes it more difficult for a malicious user to access sensitive traffic.
    Admin-Local scope is encouraged for any multicast traffic within a network intended for network management, as well as
    for control plane traffic that must reach beyond linklocal destinations.
  impact: ''
  references: []
  page_start: 53
  audit_raw: "Review the router configuration and verify that admin-scope multicast traffic is blocked\nat the external edge.\n\
    Verify either a scope is defined for specific interfaces or a scope policy is applied.\n[edit routing-options multicast]\n\
    scope <name IPv4> {\n prefix 239.0.0.0/8;\n interface [ <external interface 1> <external interface 2> ];\n}\nscope <name\
    \ IPv6> {\n prefix ff08::/16;\n interface [ <external interface 1> <external interface 2> ];\n}\n-or-\n[edit policy-options]\n\
    policy-statement <name> {\n term 1 {\n from {\n route-filter 239.0.0.0/8 orlonger;\n route-filter ff08::/16 orlonger;\n\
    \ }\n then reject;\n }\n}\n[edit routing-options multicast]\nscope-policy <policy name>\nIf the router is not configured\
    \ to establish boundaries for administratively scoped\nmulticast traffic, this is a finding."
  remediation: 'Configure the policy to deny packets with multicast administratively scoped destination

