- id: '1.58'
  title: JUEX-RT-000580
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must not be configured to have any zero-touch deployment feature enabled when connected
    to an operational network. GROUP ID: V-254030 RULE ID: SV-254030r844123'
  rationale: Network devices configured via a zero-touch deployment or auto-loading feature can have their startup configuration
    or image pushed to the device for installation via TFTP or Remote Copy (rcp). Loading an image or configuration file from
    the network is taking a security risk because the file could be intercepted by an attacker who could corrupt the file,
    resulting in a denial of service.
  impact: ''
  references: []
  page_start: 206
  audit_raw: "Review the device configuration to determine if a configuration auto-loading or zerotouch deployment feature\
    \ is enabled. Verify the Juniper router is not configured with the\nfactory default configuration. The Zero Touch Provisioning\
    \ (ZTP) feature requires the\nfactory default configuration. Juniper ZTP leverages Dynamic Host Configuration\nProtocol\
    \ (DHCP) options to provide not only the interface address, but also the location\nof the upgrade image and configuration\
    \ file. Interfaces configured for DHCP will not\nattempt to establish a ZTP session simply because DHCP is enabled but,\
    \ instead, also\nrequire a factory default configuration. Therefore, if DHCP is authorized, removing the\nfollowing [edit\
    \ system] options, setting a root password, and committing will prevent the\ndevice from attempting ZTP.\nVerify the following\
    \ are removed.\n[edit system]\n:\n:\nauto-configuration; << Delete this command.\nphone-home { << Delete this stanza.\n\
    \ server <server URL>;\n rfc-compliant;\n}\nIf a configuration auto-loading feature or zero-touch deployment feature is\
    \ enabled, this\nis a finding.\nNote: Auto-configuration or zero-touch deployment features can be enabled when the\nrouter\
    \ is offline for the purpose of image loading or building out the configuration. In\naddition, this would not be applicable\
    \ to the provisioning of virtual routers via a softwaredefined network (SDN) orchestration system."
  remediation: 'Disable all configuration auto-loading or zero-touch deployment features.

    delete system auto-configuration

    delete system phone-home

    Note: The "phone-home" command is hidden and must be fully typed into the CLI

    (autocomplete will not work).

    Configure the router with a nondefault configuration and commit.'
