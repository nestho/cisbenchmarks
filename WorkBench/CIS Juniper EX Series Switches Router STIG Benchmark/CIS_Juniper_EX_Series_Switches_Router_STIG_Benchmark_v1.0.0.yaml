  title: JUEX-RT-000160
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper router must be configured to have all inactive interfaces disabled. GROUP ID: V-253988 RULE ID:
    SV-253988r843997'
  rationale: An inactive interface is rarely monitored or controlled and may expose a network to an undetected attack on that
    interface. Unauthorized personnel with access to the communication facility could gain access to a router by connecting
    to a configured interface that is not in use. If an interface is no longer used, the configuration must be deleted and
    the interface disabled. For logical interfaces, delete those that are on inactive interfaces and delete logical interfaces
    that are themselves inactive. If the logical interface is no longer necessary for authorized communications, it must be
    deleted.
  impact: ''
  references: []
  page_start: 55
  audit_raw: "Review the router configuration and verify unused interfaces are not configured\n(implicitly disabled) or are\
    \ explicitly disabled. If explicitly disabling interfaces, verify\nmultiple interfaces are disabled with the \"interface-range\"\
    \ command or separately at\neach interface declaration.\n[edit interfaces]\ninterface-range DISABLED_INTERFACES {\n member\
    \ <interface name>;\n member-range <first interface> to <last interface>;\n disable;\n}\n<interface name> {\n disable;\n\
    }\nNote: Individually disabled interfaces should not be included in any \"interface-range\"\nstanza. The \"member-range\"\
    \ directive assigns the configured parameter(s) to\ncontiguously numbered interfaces.\nJunos lists interfaces in order\
    \ so a \"missing\" interface is not enabled. For instance, if ge0/0/0 and ge-0/0/2 are configured, but there is no individual\
    \ ge-0/0/1 stanza and that\ninterface is not a member of an interface-range, then ge-0/0/1 is implicitly disabled.\nIf\
    \ an interface is not being used but is configured or enabled, this is a finding."
  remediation: 'Disable inactive interfaces.

    delete interfaces <interface name>

    -orset interfaces <interface name> disable

    -orset interfaces interface-range DISABLED_INTERFACES member <interface name>

    set interfaces interface-range DISABLED_INTERFACES member-range <first

    interface name> to <last interface name>

    set interfaces interface-range DISABLED_INTERFACES disable'
