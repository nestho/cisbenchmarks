- id: '1.30'
  title: JUEX-RT-000300
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper router must be configured to authenticate all routing protocol messages using NIST-validated FIPS
    198-1 message authentication code algorithm. GROUP ID: V-254002 RULE ID: SV-254002r904444'
  rationale: A rogue router could send a fictitious routing update to convince a site's perimeter router to send traffic to
    an incorrect or even a rogue destination. This diverted traffic could be analyzed to learn confidential information about
    the site's network or used to disrupt the network's ability to communicate with other networks. This is known as a "traffic
    attraction attack" and is prevented by configuring neighbor router authentication for routing updates. However, using
    clear-text authentication provides little benefit since an attacker can intercept traffic and view the authentication
    key. This would allow the attacker to use the authentication key in an attack. Since MD5 is vulnerable to "birthday" attacks
    and may be compromised, routing protocol authentication must use FIPS 198-1 validated algorithms and modules to encrypt
    the authentication key. This requirement applies to all IPv4 and IPv6 protocols that are used to exchange routing or packet
    forwarding information; this includes all Interior Gateway Protocols (such as OSPF, EIGRP, and IS-IS) and Exterior Gateway
    Protocols (such as BGP), MPLS-related protocols (such as LDP), and multicast-related protocols. IP Security (IPsec) Security
    Association (SA) routing protocol authentication provides strong protection against unauthorized ("rogue") routing updates.
    IPsec SAs offer Authentication Header (AH) or Encapsulated Security Payload (ESP) to protect the routing updates. IPsec
    SA is required by newer routing protocols like OSPFv3 for authentication. IPsec SA routing protocol authentication supports
    FIPS 198-1 validated algorithms.
  impact: ''
  references: []
  page_start: 93
  audit_raw: "Verify routing protocol authentication is enabled using a FIPS 198-1 validated hashed\nmessage authentication\
    \ code (HMAC).\nFor protocols supporting IPsec SA:\n[edit security ipsec]\nsecurity-association <SA name> {\n<snip>\n\
    NOTE: Versions of Junos not supporting RFC5709 must be configured to use MD5\nauthentication, but this is still a CAT\
    \ III finding since MD5 is not compliant.\nFor protocols not supporting IPsec SA (OSPFv2 example shown)\n[edit protocols\
    \ ospf]\narea <area number> {\n interface <name> {\n authentication {\n <algorithm> <key number> key “<hashed value>”;\n\
    \ }\n }\n}\nIf a NIST-validated FIPS 198-1 message authentication code algorithm is not being\nused to authenticate routing\
    \ protocols, this is a finding.\nRouting protocols using authentication with non-NIST-validated FIPS 198-1 algorithms\n\
    may be downgraded to CAT III"
  remediation: 'Configure routing protocol authentication to use a NIST-validated FIPS 198-1 message

    authentication code algorithm.

    Configure the IPsec SA:

    set security ipsec security-association <SA name> mode transport

    set security ipsec security-association <SA name> manual direction

    bidirectional protocol (ah | esp | bundle)

    set security ipsec security-association <SA name> manual direction

    bidirectional spi <manually configured SPI (256..16639)>

    set security ipsec security-association <SA name> manual direction

    bidirectional authentication algorithm (hmac-sha1-96 | hmac-sha-256-128)

    set security ipsec security-association <SA name> manual direction

    bidirectional authentication key hexadecimal "<appropriate PSK>"

    Note: Encryption keys can also be entered as ASCII with the keyword ''ascii-text''

    replacing ''hexadecimal''. Regardless of key type, the PSK is hashed in the configuration.

    Configure EGP / IGP to use IPsec SA for authentication:

    set protocols bgp group <BGP group name> neighbor <IPv4 neighbor address>

    ipsec-sa <SA name>

    set protocols bgp group <BGP group name> neighbor <IPv6 neighbor address>

    ipsec-sa <SA name>

    set protocols ospf area <OSPFv2 area number> interface <interface

    name>.<logical unit> ipsec-sa <SA name>

    set protocols ospf3 area <OSPFv3 area number> interface <interface

    name>.<logical unit> ipsec-sa <SA name>

    NOTE: Versions of Junos not supporting RFC5709 must be configured to use MD5

    authentication, but this is still a CAT III finding since MD5 is not compliant.'
  checks:
  - type: manual_review
    info: "Verify routing protocol authentication is enabled using a FIPS 198-1 validated hashed\nmessage authentication code\
      \ (HMAC).\nFor protocols supporting IPsec SA:\n[edit security ipsec]\nsecurity-association <SA name> {\n<snip>\nNOTE:\
      \ Versions of Junos not supporting RFC5709 must be configured to use MD5\nauthentication, but this is still a CAT III\
      \ finding since MD5 is not compliant.\nFor protocols not supporting IPsec SA (OSPFv2 example shown)\n[edit protocols\
      \ ospf]\narea <area number> {\n interface <name> {\n"
    severity: medium
- id: '1.31'
  title: JUEX-RT-000310
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Juniper PE router must be configured to limit the number of MAC addresses it can learn for each Virtual
    Private LAN Services (VPLS) bridge domain. GROUP ID: V-254003 RULE ID: SV-254003r844042'
  rationale: VPLS defines an architecture that delivers Ethernet multipoint services over an MPLS network. Customer layer
    2 frames are forwarded across the MPLS core via pseudowires using IEEE 802.1q Ethernet bridging principles. A pseudowire
    is a virtual bidirectional connection between two attachment circuits (virtual connections between PE and CE routers).
    A pseudowire contains two unidirectional label-switched paths (LSP). Each MAC forwarding table instance is interconnected
    using domain-specific LSPs, thereby maintaining privacy and logical separation between each VPLS domain. When a frame
    arrives on a bridge port (pseudowire or attachment circuit) and the source MAC address is unknown to the receiving PE
    router, the source MAC address is associated with the pseudowire or attachment circuit and the forwarding table is updated
    accordingly. Frames are forwarded to the appropriate pseudowire or attachment circuit according to the forwarding table
    entry for the destination MAC address. Ethernet frames sent to broadcast and unknown destination addresses must be flooded
    out to all interfaces for the bridge domain; hence, a PE router must replicate packets across both attachment circuits
    and pseudowires. A malicious attacker residing in a customer network could launch a source MAC address spoofing attack
    by flooding packets to a valid unicast destination, each with a different MAC source address. The PE router receiving
    this traffic would try to learn every new MAC address and would quickly run out of space for the VFI forwarding table.
    Older, valid MAC addresses would be removed from the table, and traffic sent to them would have to be flooded until the
    storm threshold limit is reached. Hence, it is essential that a limit is established to control the number of MAC addresses
    that will be learned and recorded into the forwarding table for each bridge domain.
  impact: ''
  references: []
  page_start: 96
  audit_raw: "Review the PE router configuration to determine if a MAC address limit has been set for\neach bridge domain.\n\
    Verify the MAC address limit is globally defined for the VPLS protocol or at each\ninterface assigned to the routing instance.\n\
    [edit routing-instance]\n<instance name> {\n protocols {\n vpls {\n interface-mac-limit {\n <value>;\n }\n interface <interface\
    \ name>.<logical unit> {\n interface-mac-limit {\n <value>;\n }\n }\n }\n }\n}\nNote: Only EX9200-series devices currently\
    \ support VPLS.\nIf a limit has not been configured, this is a finding."
  remediation: 'Configure a MAC address learning limit for each VPLS bridge domain.

    set routing-instance <name> protocols vpls interface-mac-limit <value>

    set routing-instance <name> protocols vpls interface <name>.<logical unit>

    interface-mac-limit <value>'
  checks:
  - type: manual_review
    info: "Review the PE router configuration to determine if a MAC address limit has been set for\neach bridge domain.\n\
      Verify the MAC address limit is globally defined for the VPLS protocol or at each\ninterface assigned to the routing\
