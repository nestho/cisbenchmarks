- id: '1.90'
  title: JUEX-RT-000900
  scoring: manual
  profile:
  - 'SEVERITY: CAT III'
  description: 'The Juniper MPLS router must be configured to synchronize IGP and LDP to minimize packet loss when an IGP
    adjacency is established prior to LDP peers completing label exchange. GROUP ID: V-254062 RULE ID: SV-254062r844219'
  rationale: Packet loss can occur when an IGP adjacency is established and the router begins forwarding packets using the
    new adjacency before the LDP label exchange completes between the peers on that link. Packet loss can also occur if an
    LDP session closes and the router continues to forward traffic using the link associated with the LDP peer rather than
    an alternate pathway with a fully synchronized LDP session. The MPLS LDP-IGP Synchronization feature provides a means
    to synchronize LDP with OSPF or IS-IS to minimize MPLS packet loss. When an IGP adjacency is established on a link but
    LDPIGP synchronization is not yet achieved or is lost, the IGP will advertise the max-metric on that link.
  impact: ''
  references: []
  page_start: 305
  audit_raw: "Review the router OSPF or IS-IS configuration.\nVerify that LDP will synchronize with the link-state routing\
    \ protocol.\n[edit protocols]\nospf {\n area <number> {\n interface <name>.<logical unit> {\n authentication {\n md5 <key\
    \ number> key \"$8$aes256-gcm$hmac-sha2256$100$LfJ7NdAYx/0$+4wGg1QJKLzkaAmVCGxBUQ$n0XxNofUtXE8aoJBhFNDDQ$uIDW/H+VY6U\n\
    \"; ## SECRET-DATA\n }\n ldp-synchronization {\n hold-time 10;\n }\n }\n interface <name>.<logical unit> {\n ipsec-sa\
    \ <name>;\n ldp-synchronization {\n hold-time 10;\n }\n }\n }\n}\nldp {\n interface <name>.<logical unit>;\n}\n-ORisis\
    \ {\n interface <name>.<logical unit> {\n ldp-synchronization {\n hold-time 10;\n }\n }\n level 1 authentication-key-chain\
    \ <name>;\n level 2 authentication-key-chain <name>;\n}\nmpls {\n interface <name>.<logical unit>;\n}\nIf the router is\
    \ not configured to synchronize IGP and LDP, this is a finding."
  remediation: 'Configure the MPLS router to synchronize IGP and LDP, minimizing packet loss when

    an IGP adjacency is established prior to LDP peers completing label exchange.

    set protocols ospf area <number> interface <name>.<logical unit>

