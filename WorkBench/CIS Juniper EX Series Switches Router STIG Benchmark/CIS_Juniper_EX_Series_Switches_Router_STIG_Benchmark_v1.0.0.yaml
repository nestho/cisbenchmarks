    239.0.0.0/8 orlonger

    set policy-options policy-statement <policy name> term 1 from route-filter

    ff08::/16 orlonger

    Apply the multicast boundary at the appropriate interfaces.

    set routing-options multicast scope <IPv4 scope name> interface [ <external

    interface 1> <external interface 2> ]

    set routing-options multicast scope <IPv6 scope name> interface [ <external

    interface 1> <external interface 2> ]

    -orset routing-options multicast scope-policy <policy name>'
