controls:
- id: '1.1'
  title: CISC-ND-000010
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to limit the number of concurrent management sessions to an organization-defined
    number. GROUP ID: V-216522 RULE ID: SV-216522r960735'
  rationale: Device management includes the ability to control the number of administrators and management sessions that manage
    a device. Limiting the number of allowed administrators and sessions per administrator based on account type, role, or
    access type is helpful in limiting risks related to DoS attacks. This requirement addresses concurrent sessions for administrative
    accounts and does not address concurrent sessions by a single administrator via multiple administrative accounts. The
    maximum number of concurrent sessions should be defined based upon mission needs and the operational environment for each
    system. At a minimum, limits must be set for SSH, HTTPS, account of last resort, and root account sessions.
  impact: ''
  references: []
  page_start: 11
  audit_raw: 'Note: This requirement is not applicable to file transfer actions such as FTP, SCP and

    SFTP.

    Review the router configuration to determine if concurrent management sessions are

    limited as show in the example below:

    ssh server session-limit 2

    If the router is not configured to limit the number of concurrent management sessions,

    this is a finding.'
  remediation: 'Configure the router to limit the number of concurrent management sessions to an

    organization-defined number as shown in the example below.

    RP/0/0/CPU0:R3(config)#ssh server session-limit 2'
  checks:
  - type: sql
    command: 'show in the example below:'
    severity: medium
    info: 'Note: This requirement is not applicable to file transfer actions such as FTP, SCP and

      SFTP.

      Review the router configuration to determine if concurrent management sessions are

      limited as show in the example below:

      ssh server session-limit 2

      If the router is not configured to limit the number of concurrent management sessions,

      this is a finding.'
- id: '1.2'
  title: CISC-ND-000140
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to enforce approved authorizations for controlling the flow of management
    information within the device based on control policies. GROUP ID: V-216523 RULE ID: SV-216523r991929'
  rationale: A mechanism to detect and prevent unauthorized communication flow must be configured or provided as part of the
    system design. If management information flow is not enforced based on approved authorizations, the network device may
    become compromised. Information flow control regulates where management information is allowed to travel within a network
    device. The flow of all management information must be monitored and controlled so it does not introduce any unacceptable
    risk to the network device or data. Application-specific examples of enforcement occur in systems that employ rule sets
    or establish configuration settings that restrict information system services or messagefiltering capability based on
    message content (e.g., implementing key word searches or using document characteristics). Applications providing information
    flow control must be able to enforce approved authorizations for controlling the flow of management information within
    the system in accordance with applicable policy.
  impact: ''
  references: []
  page_start: 13
  audit_raw: 'Review the Cisco router configuration to verify that it is compliant with this requirement.

    Step 1: Verify that the line vty has an ACL inbound applied as shown in the example

    below.

    line default

    access-class ingress MANAGEMENT_NET

    transport input ssh

    !

    vty-pool default 0 4

    Step 2: Verify that the ACL permits only hosts from the management network to access

    the router.

    ipv4 access-list MANAGEMENT_NET

    10 permit ipv4 10.1.1.0 255.255.255.0 any

    20 deny ipv4 any any log-input

    If the Cisco router is not configured to enforce approved authorizations for controlling

    the flow of management information within the device based on control policies, this is a

    finding.'
  remediation: 'Configure the Cisco router to restrict management access to specific IP addresses via

    SSH as shown in the example below.

    RP/0/0/CPU0:ios(config)#ipv4 access-list MANAGEMENT_NET

    RP/0/0/CPU0:ios(config-ipv4-acl)#permit ipv4 10.1.1.0 255.255.255.0 any

    RP/0/0/CPU0:ios(config-ipv4-acl)#deny ipv4 any any log-input

    RP/0/0/CPU0:ios(config-ipv4-acl)#exit

    RP/0/0/CPU0:R3(config)#vty default 0 4

    RP/0/0/CPU0:R3(config)#line default

    RP/0/0/CPU0:R3(config-line)#transport input ssh

    RP/0/0/CPU0:R3(config-line)#access-class MANAGEMENT_NET in

    RP/0/0/CPU0:R3(config-line)#end'
  checks:
  - type: manual_review
    info: 'Review the Cisco router configuration to verify that it is compliant with this requirement.

      Step 1: Verify that the line vty has an ACL inbound applied as shown in the example

      below.

      line default

      access-class ingress MANAGEMENT_NET

      transport input ssh

      !

      vty-pool default 0 4

      Step 2: Verify that the ACL permits only hosts from the management network to access

      the router.

      ipv4 access-list MANAGEMENT_NET

      10 permit ipv4 10.1.1.0 255.255.255.0 any

      20 deny ipv4 any any log-input

      If the Cisco router is '
    severity: medium
- id: '1.3'
  title: CISC-ND-000150
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to enforce the limit of three consecutive invalid logon attempts after
    which time lock out the user account from accessing the device for 15 minutes. GROUP ID: V-216524 RULE ID: SV-216524r960840'
  rationale: By limiting the number of failed login attempts, the risk of unauthorized system access via user password guessing,
    otherwise known as brute-forcing, is reduced.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'The Cisco router is not compliant with this requirement. However, the risk associated

    with this requirement can be fully mitigated if the router is configured to utilize an

    authentication server to authenticate and authorize users for administrative access.

    Review the router configuration to verify that the device is configured to use an

    authentication server as primary source for authentication as shown in the following

    example:

    radius-server host 10.1.3.16 auth-port 1645 acct-port 1646

    key xxxxxxxxxx

    …

    …

    …

    aaa authentication login LOGIN_AUTHENTICATION group radius local

    line console

    login authentication LOGIN_AUTHENTICATION

    !

    line default

    login authentication LOGIN_AUTHENTICATION

    transport input ssh

    If the router is not configured to use an authentication server to authenticate and

    authorize users for administrative access, this is a finding.'
  remediation: 'Step 1: Configure the router to use an authentication server as shown in the following

    example:

    RP/0/0/CPU0:R3(config)#radius-server host 10.1.3.16 key xxxxxxxx

    Step 2: Configure the authentication order to use the authentication server as primary

    source for authentication as shown in the following example:

    RP/0/0/CPU0:R3(config)#aaa authentication login LOGIN_AUTHENTICATION group

    radius local

    Step 3: Configure all network connections associated with a device management to use

    an authentication server for the purpose of login authentication as shown in the

    following example:

    RP/0/0/CPU0:R3(config)#line default

    RP/0/0/CPU0:R3(config-line)#login authentication LOGIN_AUTHENTICATION

    RP/0/0/CPU0:R3(config-line)#exit

    RP/0/0/CPU0:R3(config)#line console

    RP/0/0/CPU0:R3(config-line)#login authentication LOGIN_AUTHENTICATION'
  checks:
  - type: manual_review
    info: 'The Cisco router is not compliant with this requirement. However, the risk associated

      with this requirement can be fully mitigated if the router is configured to utilize an

      authentication server to authenticate and authorize users for administrative access.

      Review the router configuration to verify that the device is configured to use an

      authentication server as primary source for authentication as shown in the following

      example:

      radius-server host 10.1.3.16 auth-port 1645 acct-port 1646

      key xxx'
    severity: medium
- id: '1.4'
  title: CISC-ND-000160
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to display the Standard Mandatory DoD Notice and Consent Banner before
    granting access to the device. GROUP ID: V-216525 RULE ID: SV-216525r960843'
  rationale: Display of the DoD-approved use notification before granting access to the network device ensures privacy and
    security notification verbiage used is consistent with applicable federal laws, Executive Orders, directives, policies,
    regulations, standards, and guidance. System use notifications are required only for access via logon interfaces with
    human users.
  impact: ''
  references: []
