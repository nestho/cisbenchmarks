  rationale: In order to ensure network devices have a sufficient storage capacity in which to write the audit logs, they
    need to be able to allocate audit record storage capacity. The task of allocating audit record storage capacity is usually
    performed during initial device setup if it is modifiable. The value for the organization-defined audit record storage
    requirement will depend on the amount of storage available on the network device, the anticipated volume of logs, the
    frequency of transfer from the network device to centralized log servers, and other factors.
