    RP/0/0/CPU0:R3(config)#snmp-server view V3READ iso included

    RP/0/0/CPU0:R3(config)#snmp-server view V3WRITE iso included

    RP/0/0/CPU0:R3(config)#snmp-server host x.x.x.x version 3 auth V3USER'
