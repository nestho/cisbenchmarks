- id: '1.5'
  title: CISC-ND-000250
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to generate audit records when successful/unsuccessful attempts to logon
    with access privileges occur. GROUP ID: V-216526 RULE ID: SV-216526r960885'
  rationale: Without generating audit records that are specific to the security and mission needs of the organization, it
    would be difficult to establish, correlate, and investigate the events relating to an incident or identify those responsible
    for one. Audit records can be generated from various components within the information system (e.g., module or policy
    filter).
  impact: ''
  references: []
  page_start: 20
  audit_raw: 'Review the Cisco router configuration to verify that it is compliant with this requirement.

    The configuration example below will log all logon attempts.

    logging buffered informational

    logging 10.1.22.2 vrf default severity info

    If the Cisco router is not configured to generate audit records when

    successful/unsuccessful attempts to logon, this is a finding.'
  remediation: 'Configure the Cisco router to log all logon attempts as shown in the example below.

    RP/0/0/CPU0:R3(config)#logging buffered informational

    RP/0/0/CPU0:R3(config)#logging 10.1.22.2 severity info'
  checks:
  - type: manual_review
    info: 'Review the Cisco router configuration to verify that it is compliant with this requirement.

      The configuration example below will log all logon attempts.

      logging buffered informational

      logging 10.1.22.2 vrf default severity info

      If the Cisco router is not configured to generate audit records when

      successful/unsuccessful attempts to logon, this is a finding.'
    severity: medium
- id: '1.6'
  title: CISC-ND-000280
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must produce audit records containing information to establish when (date and time) the events
    occurred. GROUP ID: V-216527 RULE ID: SV-216527r960894'
  rationale: It is essential for security personnel to know what is being done, what was attempted, where it was done, when
    it was done, and by whom it was done in order to compile an accurate risk assessment. Logging the date and time of each
    detected event provides a means of investigating an attack; recognizing resource utilization or capacity thresholds; or
    identifying an improperly configured network device. In order to establish and correlate the series of events leading
    up to an outage or attack, it is imperative the date and time are recorded in all log records.
  impact: ''
  references: []
  page_start: 21
  audit_raw: 'Verify that the router is configured to include the date and time on all log records as

    shown in the configuration example below.

    service timestamps log datetime localtime

    If time stamps are not configured, this is a finding.'
  remediation: 'Configure the router to include the date and time on all log records as shown in the

    example below.

    RP/0/0/CPU0:R3(config)#service timestamps log datetime localtime'
  checks:
  - type: manual_review
    info: 'Verify that the router is configured to include the date and time on all log records as

      shown in the configuration example below.

      service timestamps log datetime localtime

      If time stamps are not configured, this is a finding.'
    severity: medium
- id: '1.7'
  title: CISC-ND-000290
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must produce audit records containing information to establish where the events occurred.
    GROUP ID: V-216528 RULE ID: SV-216528r960897'
  rationale: In order to compile an accurate risk assessment and provide forensic analysis, it is essential for security personnel
    to know where events occurred, such as device hardware components, device software modules, session identifiers, filenames,
    host names, and functionality. Associating information about where the event occurred within the network device provides
    a means of investigating an attack; recognizing resource utilization or capacity thresholds; or identifying an improperly
    configured device.
  impact: ''
  references: []
  page_start: 22
  audit_raw: 'Review the deny statements in all interface ACLs to determine if the log-input parameter

    has been configured as shown in the example below.

    Note: log-input can only apply to interface bound ACLs.

    ipv4 access-list BLOCK_INBOUND

    10 deny icmp any any log-input

    If the router is not configured with the log-input parameter after any deny statements to

    note where packets have been dropped via an ACL, this is a finding.'
  remediation: 'Configure the log-input parameter after any deny statements to provide the location as

    to where packets have been dropped via an ACL.

    RP/0/0/CPU0:R3(config)#ipv4 access-list BLOCK_INBOUND

    RP/0/0/CPU0:R3(config-ipv4-acl)#deny icmp any any log-input'
  checks:
  - type: manual_review
    info: 'Review the deny statements in all interface ACLs to determine if the log-input parameter

      has been configured as shown in the example below.

      Note: log-input can only apply to interface bound ACLs.

      ipv4 access-list BLOCK_INBOUND

      10 deny icmp any any log-input

      If the router is not configured with the log-input parameter after any deny statements to

      note where packets have been dropped via an ACL, this is a finding.'
    severity: medium
- id: '1.8'
  title: CISC-ND-000470
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco router must be configured to be configured to prohibit the use of all unnecessary and nonsecure
    functions and services. GROUP ID: V-216529 RULE ID: SV-216529r1043177'
  rationale: Network devices are capable of providing a wide variety of functions and services. Some of the functions and
    services provided by default may not be necessary to support essential organizational operations. Additionally, it is
    sometimes convenient to provide multiple services from a single component (e.g., email and web services); however, doing
    so increases risk over limiting the services provided by any one component. To support the requirements and principles
    of least functionality, the network device must support the organizational requirements providing only essential capabilities
    and limiting the use of ports, protocols, and/or services to only those required, authorized, and approved. Some network
    devices have capabilities enabled by default; if these capabilities are not necessary, they must be disabled. If a particular
    capability is used, then it must be documented and approved.
  impact: ''
  references: []
  page_start: 24
  audit_raw: 'Verify that the router does not have any unnecessary or nonsecure ports, protocols, and

    services enabled. For example, the following commands should not be in the

    configuration:

    service ipv4 tcp-small-servers max-servers 10

    service ipv4 udp-small-servers max-servers 10

    http client vrf xxxxx

    telnet vrf default ipv4 server max-servers 1

    service call-home

    Note: Certain legacy devices may require ''service call-home'' be enabled to support

    Smart Licensing as they do not support the newer smart transport configuration. Those

    devices do not incur a finding for having call-home enabled for Smart Licensing.

    If any unnecessary or nonsecure ports, protocols, or services are enabled, this is a

    finding.'
  remediation: 'Disable the following services if enabled as shown in the example below.

    RP/0/0/CPU0:R3(config)#no service ipv4 tcp-small-servers

    RP/0/0/CPU0:R3(config)#no service ipv4 udp-small-servers

    RP/0/0/CPU0:R3(config)#no http client vrf xxxxx

    RP/0/0/CPU0:R3(config)#no telnet ipv4 server

    RP/0/0/CPU0:R3(config)#no service call-home'
  checks:
  - type: manual_review
    info: 'Verify that the router does not have any unnecessary or nonsecure ports, protocols, and

      services enabled. For example, the following commands should not be in the

      configuration:

      service ipv4 tcp-small-servers max-servers 10

      service ipv4 udp-small-servers max-servers 10

      http client vrf xxxxx

      telnet vrf default ipv4 server max-servers 1

      service call-home

      Note: Certain legacy devices may require ''service call-home'' be enabled to support

      Smart Licensing as they do not support the newer smart transpo'
    severity: medium
- id: '1.9'
  title: CISC-ND-000490
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured with only one local account to be used as the account of last resort in
    the event the authentication server is unavailable. GROUP ID: V-216530 RULE ID: SV-216530r1051115'
  rationale: Authentication for administrative (privileged level) access to the device is required at all times. An account
    can be created on the device's local database for use when the authentication server is down or connectivity between the
    device and the authentication server is not operable. This account is referred to as the account of last resort since
    it is intended to be used as a last resort and when immediate administrative access is absolutely necessary. The account
    of last resort logon credentials must be stored in a sealed envelope and kept in a safe. The safe must be periodically
    audited to verify the envelope remains sealed. The signature of the auditor and the date of the audit should be added
    to the envelope as a record. An alternative to using a sealed envelope in a safe would be credential files, separated
    by technology, located in a secured location on a file server, with the files only accessible to those administrators
    authorized to use the accounts of last resort, and access to that location monitored by a central log server. Administrators
    should secure the credentials and disable the root account (if possible) when not needed for system administration functions.
  impact: ''
  references: []
  page_start: 26
  audit_raw: 'Step 1: Review the Cisco router configuration to verify that a local account for last resort

    has been configured.

    username xxxxxxxxxxxx

    group netadmin

    secret 5 xxxxxxxxxxxxxxxxxxxx

    Note: The following groups should not be assigned to this local account: root-system

    and root-lr. A custom group that provides appropriate tasks can be used.

    Step 2: Verify that local is defined after radius or tacas+ in the authentication order as

    shown in the example below.

    aaa authentication login default group tacacs+ local

    If the Cisco router is not configured with only one local account to be used as the

    account of last resort in the event the authentication server is unavailable, this is a

    finding.'
  remediation: 'Step 1: Configure a local account with the necessary privilege level to troubleshoot

    network outage and restore operations as shown in the following example:

    RP/0/0/CPU0:R3(config)#username xxxxxxxxx group netadmin

    RP/0/0/CPU0:R3(config)#username xxxxxxxxx secret xxxxxx

    Step 2: Configure the authentication order to use the local account if the authentication

    server is not reachable as shown in the following example:

    RP/0/0/CPU0:R3(config)#aaa authentication login default group tacacs+ local'
  checks:
  - type: manual_review
    info: 'Step 1: Review the Cisco router configuration to verify that a local account for last resort

      has been configured.

      username xxxxxxxxxxxx

      group netadmin

      secret 5 xxxxxxxxxxxxxxxxxxxx

      Note: The following groups should not be assigned to this local account: root-system

      and root-lr. A custom group that provides appropriate tasks can be used.

      Step 2: Verify that local is defined after radius or tacas+ in the authentication order as

      shown in the example below.

      aaa authentication login default group tac'
    severity: medium
- id: '1.10'
  title: CISC-ND-000530
  scoring: manual
  profile:
  - 'SEVERITY: CAT II'
  description: 'The Cisco router must be configured to implement replay-resistant authentication mechanisms for network access
    to privileged accounts. GROUP ID: V-216531 RULE ID: SV-216531r960993'
  rationale: A replay attack may enable an unauthorized user to gain access to the application. Authentication sessions between
    the authenticator and the application validating the user credentials must not be vulnerable to a replay attack. An authentication
    process resists replay attacks if it is impractical to achieve a successful authentication by recording and replaying
    a previous authentication message. Techniques used to address this include protocols using nonces (e.g., numbers generated
    for a specific one-time use) or challenges (e.g., TLS, WS_Security). Additional techniques include time-synchronous or
    challenge-response one-time authenticators.
  impact: ''
  references: []
  page_start: 28
  audit_raw: 'Review the router configuration to verify that SSH version 2 is configured as shown in

    the example below.

    ssh server v2

    Note: IOS XR supports SSHv1 and SSHv2. SSHv1 uses Rivest, Shamir, and Adelman

    (RSA) keys while SSHv2 uses Digital Signature Algorithm (DSA) keys.

    If the router is not configured to implement replay-resistant authentication mechanisms

    for network access to privileged accounts, this is a finding.'
  remediation: 'Configure the router to use SSH version 2 as shown in the example below.

    RP/0/0/CPU0:R3(config)#ssh server v2'
  checks:
  - type: manual_review
    info: 'Review the router configuration to verify that SSH version 2 is configured as shown in

      the example below.

      ssh server v2

      Note: IOS XR supports SSHv1 and SSHv2. SSHv1 uses Rivest, Shamir, and Adelman

      (RSA) keys while SSHv2 uses Digital Signature Algorithm (DSA) keys.

      If the router is not configured to implement replay-resistant authentication mechanisms

      for network access to privileged accounts, this is a finding.'
    severity: medium
- id: '1.11'
  title: CISC-ND-000720
  scoring: manual
  profile:
  - 'SEVERITY: CAT I'
  description: 'The Cisco router must be configured to terminate all network connections associated with device management
    after five minutes of inactivity. GROUP ID: V-216532 RULE ID: SV-216532r961068'
  rationale: Terminating an idle session within a short time period reduces the window of opportunity for unauthorized personnel
    to take control of a management session enabled on the console or console port that has been left unattended. In addition,
    quickly terminating an idle session will also free up resources committed by the managed network element. Terminating
    network connections associated with communications sessions includes, for example, de-allocating associated TCP/IP address/port
    pairs at the operating system level, or de-allocating networking assignments at the application level if multiple application
    sessions are using a single, operating system-level network connection. This does not mean that the device terminates
    all sessions or network access; it only ends the inactive session and releases the resources associated with that session.
  impact: ''
  references: []
  page_start: 30
  audit_raw: 'Review the Cisco router configuration to verify that all network connections associated

    with a device management have an idle timeout value set to five minutes or less as

    shown in the following example:

    line console

    …

    …

    …

    exec-timeout 5 0

    !

    line default

    …

    …

    …

    exec-timeout 5 0

    transport input ssh

    If the Cisco router is not configured to terminate all network connections associated with

    a device management after five minutes of inactivity, this is a finding.'
  remediation: 'Set the idle timeout value to five minutes or less on all configured login classes as

    shown in the example below.

    RP/0/0/CPU0:R3(config)#line con

    RP/0/0/CPU0:R3(config-line)#exec-timeout

    RP/0/0/CPU0:R3(config)#line default

    RP/0/0/CPU0:R3(config-line)#exec-timeout 5 0'
  checks:
  - type: manual_review
    info: 'Review the Cisco router configuration to verify that all network connections associated

      with a device management have an idle timeout value set to five minutes or less as

      shown in the following example:

      line console

      …

      …

      …

      exec-timeout 5 0

      !

      line default

      …

      …

      …

      exec-timeout 5 0

