    62 | P a g e

    1. Apache httpd mailing list - http://httpd.apache.org/lists.html The main announcement mailing

    list is going to tell you whenever a new release of Apache comes out and about security fixes but

    doesn''t usually contain much information about the actual issues. Serious vulnerabilities tend to

    get their own advisories written up which also get posted to the announce list.

    2. OS Vendor security lists such as Red Hat

    https://www.redhat.com/mailman/listinfo/enterprise-watch-list

    3. CERT CC http://www.cert.org/ The Computer Emergency Response Team Co-ordination Centre

    monitors security incidents - mostly focused on those that have a significant impact. CERT

    advisories are well researched and a good source of information, especially when CERT was

