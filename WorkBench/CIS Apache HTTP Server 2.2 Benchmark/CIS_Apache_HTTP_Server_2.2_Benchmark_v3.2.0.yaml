    apply. However in the event a lock file is used, it is important for the lock file to be in a locally directory that is
    not writable by other users.
  rationale: If the LockFile is placed in a writable directory other accounts could create a denial of service attack and
    prevent the server from starting by creating a lock file with the same name.
