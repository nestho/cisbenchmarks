  title: Monitor Vulnerability Lists
  scoring: scored
  profile:
  - Level 1
  description: Subscribe to an appropriate security advisory list.
  rationale: One of the most frustrating aspects of web attacks is that most can be prevented if the appropriate patches are
    applied. Both OS and web server vendors are constantly issuing patches in response to flaws found within their application's
    code. Keeping abreast of new patches can be a daunting task to say the least. To keep abreast of issues specific to Apache
    software and the operating system platform, the individuals responsible for security and/or administration of the server
    should subscribe to a notification service such as those listed below that will alert them to newly discovered security
    issues.
  impact: ''
  references: []
