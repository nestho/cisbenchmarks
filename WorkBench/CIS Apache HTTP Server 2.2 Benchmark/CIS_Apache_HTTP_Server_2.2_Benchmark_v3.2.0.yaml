  title: ScoreBoard File Security
  scoring: scored
  profile:
  - Level 1
  description: The ScoreBoardFile directive sets a file path which the server will use for inter-process communication (IPC)
    among the Apache processes. On most Linux platform shared memory will be used instead of a file in the file system, so
    this directive is not generally needed and does need to be specified. However, if the directive is specified, then Apache
    will use the configured file for the inter-process communication. Therefore if it is specified it needs to be located
